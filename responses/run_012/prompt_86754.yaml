prompt: |-
  So I've somehow agreed to give the after-dinner talk at our hospital foundation's pain clinic benefit next month. Five minutes, six tops, in front of maybe two hundred people: donors, half the clinic staff, my husband, who will mock me regardless. And two of the guests of honor are former patients, and I can't stop thinking about them together.

  The first is a guy in his sixties who had a stroke and now has what our neurologists call pain asymbolia — he still feels pain, he can point to it, rate it an eight, tell you it's burning, but it doesn't bother him. He'll describe the worst pain of his life with a little smile, like he's giving you the weather. (If you don't know the term, just go off what I've described, don't make stuff up.) The second is a nine year old with congenital insensitivity to pain, meaning no pain sensation at all, ever, and she's got a burn scar on one arm and has broken I think four bones, because her body never tells her to stop.

  Here's my problem. This year's appeal is basically 'a life without pain,' and I'm supposed to get up and sell that. But the kid in the front row IS a life without pain, and it isn't a life anyone in that room would want for their own kid. And the man with asymbolia has all the pain and none of the misery, which seems to mean the awful part isn't the sensation itself. So what am I actually asking people to fund?

  Write the talk. It needs to move people to give, it needs to be honest about that split, and it can't imply that the people in the room who are suffering are suffering because they aren't tough enough or calm enough. No lecture, no TED talk about reframing, and no citations, I don't want a literature review at a dinner. American English please.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write an after-dinner talk (speech) for a hospital foundation's pain clinic benefit.
      *   **Length:** 5-6 minutes (roughly 750-900 words spoken at a normal pace).
      *   **Audience:** ~200 people (donors, clinic staff, husband, two guests of honor).
      *   **Speaker:** Likely a doctor or clinician at the clinic (implied by "our neurologists," "our hospital," "clinic staff").
      *   **Key Characters/Patients:**
          1.  Man in 60s with pain asymbolia (feels pain, rates it, but isn't bothered by it).
          2.  9-year-old girl with congenital insensitivity to pain (no pain sensation, injured frequently).
      *   **Theme/Conflict:** The appeal theme is "A Life Without Pain." The speaker sees the paradox: The girl *has* a life without pain, but it's dangerous/tragic. The man *has* pain but no suffering. So what are we funding?
      *   **Constraints:**
          *   Must move people to give.
          *   Must be honest about the paradox (the split between sensation and suffering).
          *   Cannot blame patients for suffering (no "just tough it out" or "reframe your pain" vibes).
          *   No lecture/TED talk style.
          *   No citations/literature review.
          *   American English.
          *   Tone: Honest, empathetic, compelling, not preachy.

  2.  **Determine the Core Message:**
      *   The prompt asks: "What am I actually asking people to fund?"
      *   Answer: We aren't funding the elimination of *sensation* (nociception). We are funding the elimination of *suffering* and the restoration of *function/safety*. We are funding the bridge between feeling something and being destroyed by it. We are funding the ability to live *with* or *without* pain, but always with *meaning* and *safety*.
      *   The "Life Without Pain" slogan is a hook, but the reality is "A Life Where Pain Doesn't Steal Your Humanity."
      *   Need to validate the suffering of chronic pain patients without blaming them. Pain *is* suffering for them because the system is broken, not because they are weak.
      *   Need to honor the two guests without exploiting them.

  3.  **Structure the Speech:**
      *   **Opening:** Acknowledge the awkwardness/honor. Set the scene. Mention the theme ("A Life Without Pain").
      *   **The Two Guests:** Introduce the man and the girl (without naming them necessarily, keeping dignity). Describe their conditions simply (as per prompt instructions).
      *   **The Paradox:** Lay out the conflict. The girl has no pain but is vulnerable. The man has pain but no suffering.
      *   **The Pivot:** So what do we treat? We treat the *middle*. The people for whom pain is a jailer.
      *   **The Ask:** Redefine the goal. It's not just silencing the alarm; it's making the house safe again. It's about giving people back their lives, not just numbness.
      *   **Closing:** Bring it back to the donors. Their money buys time, dignity, and safety. Thank you.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Keep it warm. Acknowledge the husband (light touch). Acknowledge the theme.
      *   *The Patients:* Describe the man first. The smile while describing burning. Describe the girl. The scars, the breaks.
      *   *The Realization:* These two bookends show us that pain isn't just a signal. It's a relationship.
      *   *The Middle Ground:* Most patients aren't at either extreme. They are in the messy middle. The alarm won't stop ringing.
      *   *Reframing the Mission:* We aren't promising a pain-free existence (impossible/dangerous). We are promising a life where pain doesn't win.
      *   *The Donation:* What does the money do? It buys the tools to decouple sensation from suffering. It buys the team that listens.
      *   *Ending:* A call to action that feels human.

  5.  **Refining Tone and Constraints:**
      *   *Check:* Did I blame patients? No, emphasize that chronic pain is a disease state, not a failure of mindset.
      *   *Check:* Is it too academic? Avoid terms like "nociception" or "affective component." Stick to the prompt's description of asymbolia.
      *   *Check:* Length? Aim for ~800 words.
      *   *Check:* American English? (e.g., "program" not "programme", "color" not "colour", idioms).
      *   *Check:* Husband mention? Keep it brief and self-deprecating.
      *   *Check:* The "Life Without Pain" slogan? Address it directly. It's a marketing hook, but the reality is nuanced.

  6.  **Drafting - Iteration 1 (Mental Outline):**
