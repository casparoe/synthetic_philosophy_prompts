answer: |-
  # Causal Attribution Protocol (CAP-1)
  **Version:** 1.0  
  **Owner:** Causal-Attribution Unit  
  **Purpose:** To standardize determinations of workplace causation for compensation files.  
  **Constraint:** This protocol distinguishes between scientific findings and policy choices. It does not resolve moral questions; it flags them for the Director.

  ---

  ## Part 1: Vocabulary (Plain Language)

  *   **Exposure:** The specific workplace hazard (e.g., silica dust, noise, shift work).
  *   **Outcome:** The specific health condition being claimed (e.g., silicosis, hearing loss, heart attack). *Must include a time window if relevant.*
  *   **Reference Class:** A group of people similar to the worker (e.g., "50-year-old male construction workers") used to estimate risk.
  *   **Verdict A (Difference-Making):** Would the Outcome have happened *at the time it did* if the Exposure had been removed?
  *   **Verdict B (Mechanism):** Did the Exposure physically participate in the biological process that created the Outcome?
  *   **Verdict C (Probability):** Does the Exposure raise the rate of the Outcome in the Reference Class compared to no Exposure?
  *   **[FACT]:** A step based on measured data or records.
  *   **[INFERENCE]:** A step based on scientific models or expert estimation.
  *   **[POLICY]:** A step based on legal or moral standards, not science.

  ---

  ## Part 2: The Procedure

  ### Step 1: Define the Variables [FACT]
  **Owner:** Industrial Hygienist  
  **Action:** Write down the Exposure and the Outcome.
  *   **Exposure:** Be specific (e.g., "Wood dust, 1990–2000," not just "Dust").
  *   **Outcome:** Be specific (e.g., "Diagnosis of Asthma in 2023," not just "Respiratory Disease").
  *   **Honesty Label:** `[FACT]` (Based on medical records and exposure logs).

  ### Step 2: The Sensitivity Check (Variable Carving) [INFERENCE]
  **Owner:** Lead Epidemiologist  
  **Action:** You must identify one reasonable alternative way to define the Exposure or Outcome.
  *   **Alternative Definition:** (e.g., Outcome = "Onset of symptoms" vs. "Formal Diagnosis").
  *   **Test:** If you used the Alternative Definition, would Verdict A (Difference-Making) change from Yes to No, or No to Yes?
  *   **Record:** Write "Sensitive" if the verdict flips. Write "Stable" if it does not.
  *   **Honesty Label:** `[INFERENCE]` (This is a modeling choice, not a measurement).

  ### Step 3: Determine Verdict A (Difference-Making) [INFERENCE]
  **Owner:** Physician Panel  
  **Action:** Answer the "But-For" question.
  *   **Question:** "If we magically removed this worker's Exposure, would they still have this Outcome *at this time*?"
  *   **Sufficient Answer:** "Yes" (Disease was inevitable/independent) or "No" (Disease depends on Exposure).
  *   **Honesty Label:** `[INFERENCE]` (This is a counterfactual simulation; it cannot be observed).

  ### Step 4: Determine Verdict B (Mechanism) [INFERENCE]
  **Owner:** Physician Panel  
  **Action:** Answer the "Pathway" question.
  *   **Question:** "Is there a known biological pathway where this Exposure contributes to this Outcome?"
  *   **Sufficient Answer:** "Yes" (Pathway exists and was active) or "No" (Pathway unknown or inactive).
  *   **Honesty Label:** `[INFERENCE]` (Based on current medical consensus, which changes).

  ### Step 5: Determine Verdict C (Probability) [INFERENCE]
  **Owner:** Lead Epidemiologist  
  **Action:** Answer the "Risk" question.
  *   **Question:** "In the Reference Class, does this Exposure increase the likelihood of the Outcome?"
  *   **Sufficient Answer:** "Yes" (Risk Ratio > 1.0) or "No" (Risk Ratio ≤ 1.0).
  *   **Honesty Label:** `[INFERENCE]` (Based on population data, not this specific worker).

  ### Step 6: The Decision Rule [POLICY]
  **Owner:** Lead Epidemiologist (Applied by Unit)  
  **Action:** Combine the three verdicts into a final Determination.
  *   **Rule 1 (Primary):** The Determination follows **Verdict A**.
  *   **Rule 2 (Overdetermination Exception):** If Verdict A is "No" *only* because another sufficient cause existed (e.g., two exposures, either one enough), the Determination follows **Verdict B**.
  *   **Rule 3 (Acceleration Constraint):** If Verdict A is "No" because the Outcome was inevitable but earlier (Acceleration), the Determination remains **No**. (See *Limitations* for why).
  *   **Honesty Label:** `[POLICY]` (This rule chooses which scientific truth matters most for compensation).

  ### Step 7: Legal Handoff [POLICY]
  **Owner:** Agency Lawyer  
  **Action:** If the file requires deciding on "Fairness," "Fault," or "Statutory Interpretation" (e.g., does 'disease' include 'earlier onset'?"), stop the procedure.
  *   **Trigger:** Any disagreement on Step 1 (Outcome Definition) that cannot be resolved by medical records.
  *   **Action:** Send file to Legal Counsel for standard setting. Do not route back to Epidemiology.
  *   **Honesty Label:** `[POLICY]` (This is a legal standard, not a causal test).

  ---

  ## Part 3: The Three Verdicts (Capabilities & Limits)

  | Verdict | What It Establishes | What It Cannot Establish | Role in Determination |
  | :--- | :--- | :--- | :--- |
  | **A (Difference-Making)** | Whether this specific exposure was required for this specific outcome at this specific time. | Whether the exposure is generally harmful, or if it mattered in the presence of other sufficient causes. | **Primary Driver.** |
  | **B (Mechanism)** | Whether the exposure physically participated in the disease process. | Whether the disease would have happened anyway without it. | **Tie-Breaker** (Overdetermination only). |
  | **C (Probability)** | Whether the exposure is dangerous to the group the worker belongs to. | Whether it caused *this* worker's disease (ecological fallacy). | **Corroboration** only. |

  ---

  ## Part 4: Worked Cases (Stress Test)

  Here is how CAP-1 handles the four files you provided.

  ### File 1: The Overdetermination Case
  *   **Scenario:** Worker has Exposure X and Exposure Y. Either one alone causes the disease. Both occurred.
  *   **Step 1 (Variables):** Exposure = X & Y. Outcome = Disease.
  *   **Step 2 (Sensitivity):** Stable. (Carving X and Y separately doesn't change the fact that both are sufficient).
  *   **Step 3 (Verdict A):** **No.** (If you remove X, Y still causes the disease. The disease is not *difference-made* by X alone).
  *   **Step 4 (Verdict B):** **Yes.** (X is part of the mechanism).
  *   **Step 5 (Verdict C):** **Yes.** (X raises risk).
  *   **Step 6 (Decision):** **Yes (Compensable).**
      *   *Reasoning:* Rule 2 (Overdetermination Exception) applies. Verdict A fails due to redundancy, so we default to Verdict B.
  *   **Strain:** This matches your instinct (Find Causation).

  ### File 2: The Acceleration Case
  *   **Scenario:** Disease was inevitable (genetic/age). Exposure moved onset forward by 10 years.
  *   **Step 1 (Variables):** Exposure = Hazard. Outcome = Disease Diagnosis at Age 50.
      *   *Note:* If Outcome is defined as "Disease Ever," Verdict A changes. CAP-1 requires defining the Outcome as the claim specifies (usually "Current Disability").
  *   **Step 2 (Sensitivity):** **Sensitive.** If Outcome = "Disease Ever," Verdict A flips to No. If Outcome = "Disease at Age 50," Verdict A is Yes.
  *   **Step 3 (Verdict A):** **No** (Based on your instruction to treat "Inevitable" as No Causation).
      *   *Logic:* If the disease was going to happen anyway, the exposure did not make the difference to the *existence* of the disease, only the timing.
  *   **Step 4 (Verdict B):** **Yes.** (Exposure sped up the mechanism).
  *   **Step 5 (Verdict C):** **Yes.** (Exposure raises risk of early onset).
  *   **Step 6 (Decision):** **No (Not Compensable).**
      *   *Reasoning:* Rule 3 (Acceleration Constraint) applies. We prioritize Verdict A's "Inevitability" finding over Verdict B's "Mechanism" finding.
  *   **Strain:** This matches your instinct (Find No Causation).

  ### File 3: The Omission Case
  *   **Scenario:** Harm caused by missing ventilation (safety failure), not added hazard.
  *   **Step 1 (Variables):** Exposure = "Absence of Ventilation." Outcome = Toxic Accumulation.
  *   **Step 2 (Sensitivity):** Stable.
  *   **Step 3 (Verdict A):** **Yes.** (If ventilation existed, disease would not have occurred).
  *   **Step 4 (Verdict B):** **Yes.** (Lack of removal allowed mechanism to proceed).
  *   **Step 5 (Verdict C):** **Yes.**
  *   **Step 6 (Decision):** **Yes (Compensable).**
      *   *Reasoning:* Verdict A is clear.
  *   **Strain:** None. CAP-1 handles omissions as "Exposures" without issue.

  ### File 4: The Susceptibility Case
  *   **Scenario:** Worker has genetic risk. Exposure only harms those with the gene.
  *   **Step 1 (Variables):** Exposure = Chemical. Outcome = Disease. Reference Class = "Workers with Gene."
  *   **Step 2 (Sensitivity):** **Sensitive.** If Reference Class = "All Workers," Verdict C might be weak. If "Workers with Gene," Verdict C is strong.
  *   **Step 3 (Verdict A):** **Yes.** (Without exposure, gene alone was insufficient).
  *   **Step 4 (Verdict B):** **Yes.** (Interaction triggered mechanism).
  *   **Step 5 (Verdict C):** **Yes** (For the specific reference class).
  *   **Step 6 (Decision):** **Yes (Compensable).**
      *   *Reasoning:* Verdict A is satisfied. The "Eggshell Skull" principle holds: you take the worker as you find them.
  *   **Strain:** None, provided the Reference Class is defined correctly in Step 1.

  ---

  ## Part 5: The Instinct Conflict (What You Have to Give Up)

  You stated your instincts are:
  1.  **Overdetermination:** Find Causation (Yes).
  2.  **Acceleration:** Find No Causation (No).

  CAP-1 allows you to have both, **but only by applying inconsistent logic in Step 6.**

  *   In **File 1 (Overdetermination)**, we ignored Verdict A (which said "No") and used Verdict B to find "Yes." We forgave the fact that the disease "would have happened anyway."
  *   In **File 2 (Acceleration)**, we enforced Verdict A (which said "No") and ignored Verdict B. We punished the fact that the disease "would have happened anyway."

  **The Logical Cost:**
  Scientifically, these two cases are identical regarding the "would have happened anyway" test. In both cases, the disease occurs with or without the exposure (in Acceleration, it occurs later; in Overdetermination, it occurs via the other cause).
  *   To be logically consistent, you must choose one standard for "Inevitability."
  *   **Option A (Strict But-For):** If the disease happens anyway, it is not caused by the exposure.
      *   *Result:* Overdetermination = **No**. Acceleration = **No**.
      *   *What you give up:* Your instinct on File 1.
  *   **Option B (Material Contribution):** If the exposure contributes to the process, it is a cause, even if redundant or accelerating.
      *   *Result:* Overdetermination = **Yes**. Acceleration = **Yes**.
      *   *What you give up:* Your instinct on File 2.

  **Recommendation:**
  CAP-1 currently codifies your instincts (Option Hybrid). However, you must acknowledge in your annual report that this is a **Policy Choice**, not a scientific finding. You are compensating "Contribution" in File 1 but demanding "Necessity" in File 2. If this is appealed, a court may ask why the standard changes based on the type of case.

  ---

  ## Part 6: Limitations and Exclusions

  **What This Procedure Cannot Do:**
  1.  **Resolve Statutory Ambiguity:** If the law says "arising out of employment" but doesn't define "acceleration," CAP-1 cannot decide if acceleration counts. Step 7 must hand this to Legal.
  2.  **Fix Bad Data:** If exposure measurements are missing, Verdict C cannot be calculated. The procedure will return "Inconclusive," not "No."
  3.  **Moral Desert:** CAP-1 cannot determine if the worker "deserves" compensation if the employer was negligent but the cause was weak. That is a legal question.

  **Files That Should Never Be Routed Through CAP-1:**
  1.  **Pure Legal Questions:** Files where the exposure is admitted, but the dispute is whether the law covers that type of injury (e.g., "Is stress a compensable injury?"). Send to Legal.
  2.  **Missing Outcome Definition:** Files where the physician panel cannot agree on *what* the disease is (e.g., "Is this fatigue or depression?"). Send to Medical Board for classification before Causal Attribution.
  3.  **Retaliatory Claims:** Files where the primary dispute is whether the injury occurred at work *at all* (e.g., "I fell at home" vs "I fell at work"). This is a factual dispute for investigators, not a causal determination for epidemiologists.

  ---

  **Final Note to the Lead Epidemiologist:**
  You suspected your unit was "one picture wearing the other's clothes." CAP-1 makes the clothing visible. By forcing you to record the Sensitivity Check (Step 2) and label the Decision Rule (Step 6) as `[POLICY]`, you prevent the science from hiding the value judgment. When the three verdicts disagree, do not pretend science tells you which one to pick. The Rule picks for you. Own the Rule.
