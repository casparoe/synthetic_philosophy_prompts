answer: |-
  This is a remarkably sharp observation, and you are right to feel that standard logical labels (like the naturalistic fallacy) don't quite fit. You aren't watching people make a logical error; you are watching them use a specific linguistic technology that is essential to governance.

  The phenomenon you are describing has a name in moral philosophy, a different name in political science, and a third name in organizational theory. None of them alone captures the whole picture, but together they give you the "carving" you are looking for.

  ### 1. The Philosophical Label: Thick Ethical Concepts
  The precise philosophical term for a word that fuses description and evaluation is a **Thick Ethical Concept**.

  This distinction was popularized by Bernard Williams and Clifford Geertz.
  *   **Thin concepts** are pure evaluation: *Good, Bad, Right, Wrong.* They tell you nothing about the world, only how to judge it.
  *   **Thick concepts** are description and evaluation fused: *Cruel, Courageous, Treacherous, Blighted.*

  If you call an act "cruel," you are describing it (it causes pain) and evaluating it (it is wrong to cause pain) simultaneously. If you try to separate them ("It caused pain, but was it cruel?"), the word loses its grip.

  "Blighted" is a classic thick concept. As you noted, if you strip the value ("It has boarded windows"), you have no reason to act. If you strip the description ("It is bad"), you have no legal standing. The word works *only* because the community accepts that the description inherently warrants the evaluation.

  **How it differs from Loaded Language:** Loaded language is rhetorical icing on a cake that could stand without it. A thick concept *is* the cake. You cannot state the claim plainly because the claim *is* the fusion. To say "This building has boarded windows and we dislike that" is weak. To say "This building is blighted" invokes a shared social reality where boarded windows *constitute* a harm.

  ### 2. The Political Label: Essentially Contested Concepts
  While "thick concepts" explains the linguistics, it doesn't explain the fighting. For that, you want W.B. Gallie's **Essentially Contested Concepts**.

  Gallie argued that certain concepts (Democracy, Justice, Art, and in your case, *Neighborhood Character*) are inherently subject to endless dispute. This isn't because people are confused; it's because the concept involves a complex weighting of values that cannot be settled by empirical evidence.

  When a developer says "Highest and Best Use" and a neighbor says "Overdevelopment," they are not disagreeing about the math. They are disagreeing about which values get to define the concept.
  *   **Developer:** "Best" = Maximum economic yield.
  *   **Neighbor:** "Best" = Maximum compatibility with existing social fabric.

  The word remains ambiguous because if you pinned down a single definition, you would exclude one side of the political coalition necessary to run the city.

  ### 3. The Organizational Label: Strategic Ambiguity
  This explains why the commission keeps using them. In organizational communication (specifically the work of Eric Eisenberg), this is called **Strategic Ambiguity**.

  In a bureaucracy, unity is often more important than precision. If your code defined "blight" with perfect mathematical precision (e.g., "tax delinquency > 3 years"), you would lose the ability to act on a dangerous building that is only 2 years delinquent. If you defined it purely by value ("harmful to the public"), you would get sued for vagueness.

  The ambiguity is a feature, not a bug. It allows the commission to build a majority consensus for action without requiring everyone to agree on *why* they are acting. The developer agrees it's blighted because they want the land; the neighbor agrees it's blighted because they hate the weeds; the city agrees it's blighted because of the taxes. You can all vote "Yes" on the word "blight" while holding three different definitions in your head.

  ### Is it Legitimate? (The Carving You Asked For)
  You asked how to separate the honest use from the question-begging. This is the critical part. Thick concepts are necessary for law (you can't write a code without them), but they are also the primary vehicle for corruption.

  Here is a heuristic for distinguishing them in a hearing:

  **1. The Decomposition Test**
  *   **Legitimate:** When pressed, the speaker can temporarily separate the *is* from the *ought* to show the link. *"I call this blight (value) because the structural failure poses a fire risk (description), and we have agreed fire risks are unacceptable (shared norm)."*
  *   **Illegitimate:** When pressed, the speaker treats the description as proof of the value without establishing the norm. *"It's blighted because look at it."* (This is where the naturalistic fallacy actually creeps in).
  *   **The Tell:** If the description changes every time the value is challenged, it's illegitimate. If "blight" means "boarded windows" today, but "low tax revenue" tomorrow when the windows are fixed, the word is being used as a shield, not a tool.

  **2. The Reversibility Test**
  *   **Legitimate:** The concept applies symmetrically. If "neighborhood character" is used to stop a new apartment complex, does it also stop a new McMansion that breaks the setback line?
  *   **Illegitimate:** The concept is applied only when it benefits a specific interest. "Underutilized" is often illegitimate here. A park is "underutilized" compared to a hotel, but we don't call it that. A single-family home is "underutilized" compared to a tower, but we only use the word when a developer is in the room.

  **3. The Exit Clause**
  *   **Legitimate:** The speakers acknowledge the tension. *"We know 'character' is vague, so we are using it as a proxy for sunlight access, which we can measure."*
  *   **Illegitimate:** The ambiguity is defended as a virtue to avoid scrutiny. *"You can't define character, you just know it when you see it."* This is the language of exclusion.

  ### The Literature
  If you want to read further, this sits at the intersection of three fields:

  1.  **Philosophy:** Bernard Williams, *Ethics and the Limits of Philosophy* (Chapter on Thick Concepts).
  2.  **Planning Theory:** Bent Flyvbjerg, *Rationality and Power*. He studied a Danish planning project and showed exactly how "facts" and "values" were manipulated through language to shift power. He argues that "rationality" in planning is often just a mask for power.
  3.  **Legal Theory:** H.L.A. Hart's concept of the "Open Texture" of law. He argues that legal terms *must* have a core of certainty and a penumbra of doubt to function in a changing world.

  ### Summary
  You are watching **Thick Ethical Concepts** operate under conditions of **Strategic Ambiguity**.

  It is not sloppiness. It is the grease that allows a pluralistic society to make binding decisions without agreeing on first principles. However, it becomes illegitimate when the ambiguity is used to hide the transfer of value rather than to facilitate the negotiation of it.

  Your job on the commission, effectively, is to police the **Decomposition Test**. When someone uses a thick concept, ask them to hold the description still while you examine the value, or hold the value still while you examine the description. If the word dissolves, you've found the question-begging. If it holds, you've found a shared community standard.
