      *   *Deficit:* Connect the phrase to the *permissive consensus*. The phrase allowed elites to integrate while citizens weren't paying attention. Now that consensus is gone, the phrase is contested.

  7.  **Final Review against constraints:**
      *   Menu format? Yes.
