prompt: |-
  Bit of an odd request, but I'm in the second year of a European studies degree and 'ever closer union' has become the phrase everyone in my seminar reaches for, and I've noticed it's doing completely different jobs depending on whose mouth it's in. Last week one person used it to argue that a member state could never lawfully leave the EU, someone else used it to argue the EU is obliged to keep enlarging, and the guy who's always slightly contrarian said it actually protects national sovereignty, because it's union among the *peoples*, plural — a union of peoples, not a merger into one superstate. Then in the pub a friend who's doing law said the phrase is written into the treaties, so it's legally binding and any government unwinding integration is acting unlawfully, and another friend said treaty preambles are just mood music and mean nothing at all. I nodded along to all of it and then realised I couldn't actually have told you what the phrase claims. (I have a vague memory there's an exit clause in the treaties, which sits awkwardly with the first person's arguement, but I don't know if that's relevant.)

  What I want is for you to take 'ever closer union' apart and lay out the distinct precise things it could be claiming, as a menu rather than one "here's what it really means". Is it a description of what's happening (integration has a built-in tendency to deepen), a prediction, an aspiration, a commitment, an instruction about how to interpret the rest of the treaties, a promise made to citizens, a limit on integration, or rhetoric with no content at all? For each reading give me a verdict — platitude, contested empirical thesis, normative commitment, or genuinely empty — and tell me which of them would actually get my friends their conclusions. Does any reading support 'no member can leave'? Does any support 'must keep enlarging'? Is the sovereignty-protecting reading real or does it collapse once you press on it? Also, what is 'union' a union *of* under the various readings — states, citizens, markets, institutions — because I suspect that's where most of the vagueness lives. And if some reading is not just vague but actually contradictary (closer union of states pulling against closer union of citizens, say), I'd rather see that spelled out than smoothed over.

  If it helps orient the answer: I have to write a short essay on the democratic deficit in a few weeks, so flag any reading that bears on it. My hunch is that the slogan is either doing the legitimating work in that whole debate or quietly hiding an assumption, but I can't tell which, and that's the thing I'd most like to come away understanding.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Second-year European Studies student.
      *   **Problem:** The phrase "ever closer union" is being used in conflicting ways in seminars and social settings (legal bindingness, impossibility of exit, obligation to enlarge, protection of sovereignty, mere rhetoric).
      *   **Task:** Deconstruct the phrase "ever closer union" into distinct precise claims (a "menu" of readings).
      *   **Requirements:**
          *   Categorize each reading (platitude, contested empirical thesis, normative commitment, empty rhetoric, etc.).
          *   Map readings to the friends' conclusions (no exit, must enlarge, sovereignty protection).
          *   Address the "union of *what*?" question (states, citizens, markets, etc.).
          *   Highlight contradictions/tensions between readings.
          *   Flag relevance to the "democratic deficit" essay.
          *   Address the legal status (treaty text vs. preamble) and the exit clause (Article 50).
      *   **Tone:** Academic but accessible, analytical, nuanced (avoiding a single "truth"), tailored to a 2nd-year undergrad level.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Source:* The phrase appears in the Preamble of the Treaty on European Union (TEU) and the Treaty on the Functioning of the European Union (TFEU). It originates from the Treaty of Rome (1957).
      *   *Legal Status:* Preambles have interpretive value but usually don't create standalone obligations. The ECJ (European Court of Justice) uses it for teleological interpretation.
      *   *Exit Clause:* Article 50 TEU explicitly allows withdrawal. This directly contradicts the "cannot leave" argument.
      *   *Enlargement:* Article 49 TEU covers accession. "Ever closer union" doesn't strictly mandate *geographic* enlargement, but rather *depth* of integration among members.
      *   *Sovereignty:* The phrase implies pooling sovereignty, not necessarily protecting it, though the "union of peoples" argument suggests a federalist balance.
      *   *Democratic Deficit:* If "ever closer union" drives integration without corresponding democratic mechanisms, it exacerbates the deficit. If it implies a union of *citizens*, it demands more democracy.

  3.  **Deconstructing the Phrase (The "Menu"):**
      I need to create distinct categories of meaning.
      *   *Reading 1: The Teleological Legal Principle.* (How courts use it).
      *   *Reading 2: The Political Aspiration.* (What politicians say).
      *   *Reading 3: The Historical/Sociological Trajectory.* (Functionalism).
      *   *Reading 4: The Federalist End-Goal.* (State-building).
      *   *Reading 5: The Pluralist/Intergovernmental Limit.* (Union of peoples).

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the confusion. It's a "floating signifier." Validate the student's observation.
      *   **The Textual Home:** Briefly state where it lives (Preambles of TEU/TFEU) and its history (Treaty of Rome). Mention Article 50 immediately to debunk the "no exit" claim.
      *   **The Menu of Readings:**
          1.  *The Interpretive Key (Legal):* It tells judges how to read ambiguities. *Verdict:* Legal tool. *Friends:* Supports the law student (sort of), but not "unlawful to unwind" absolutely.
          2.  *The Teleological Engine (Functionalist):* Integration begets integration. *Verdict:* Contested empirical thesis. *Friends:* Supports the "built-in tendency" argument.
          3.  *The Federalist Destiny (Political):* Moving towards a United States of Europe. *Verdict:* Normative commitment. *Friends:* Supports the "superstate" fear/hope.
          4.  *The Pluralist Compromise (Intergovernmental):* Union of *peoples*, not *states*. *Verdict:* Normative commitment/Legal nuance. *Friends:* Supports the contrarian sovereignty argument.
          5.  *The Rhetorical Glue (Legitimation):* Justifies steps without specific promises. *Verdict:* Legitimating myth/Empty. *Friends:* Supports the "mood music" friend.
      *   **Addressing Specific Claims:**
          *   *No Exit:* Explicitly debunk using Article 50.
          *   *Enlargement:* Distinguish depth vs. breadth.
          *   *Sovereignty:* Analyze the "peoples" vs. "states" distinction.
      *   **The "Union of What?" Question:** States, Citizens, Markets, Administrations. Highlight the tension (e.g., Market integration vs. Citizen protection).
      *   **Contradictions:** Point out where these readings clash (e.g., Federalist destiny vs. Pluralist sovereignty).
      *   **The Democratic Deficit Connection:** This is crucial for the user's upcoming essay.
          *   If it's a *legal engine*, it bypasses politics (judges drive integration).
