      *   Union of *what*? Yes.
      *   Contradictions spelled out? Yes.
      *   Democratic deficit flagged? Yes.
      *   Article 50 mentioned? Yes.

  8.  (Proceed to generate output based on these thoughts.)
answer: |-
  This is an excellent observation. You have stumbled upon one of the central tensions in EU studies: "Ever closer union" is what political scientists call a **floating signifier**. It is vague enough to mean almost anything, which is precisely why it has survived in the treaties from the Treaty of Rome (1957) through to Lisbon (2009). If it were defined precisely, it would have been removed decades ago.

  Your friends are all partially right, but they are talking past each other because they are using different *categories* of meaning (legal, historical, political, sociological).

  Here is the menu of readings, broken down by what the phrase is actually doing, the verdict on its substance, and which of your friends' arguments it supports.

  ### 1. The Teleological Legal Principle
  *   **The Claim:** The phrase is an instruction to the European Court of Justice (ECJ) on how to interpret ambiguous laws. If a treaty article can be read in two ways, the Court should choose the one that deepens integration.
  *   **Verdict:** **Legal Tool.** It is not "mood music" (your law friend is closer to the truth than the sceptic), but it is not a standalone command that overrides specific articles.
  *   **Union of What:** **Legal Order.** It implies a union of legal systems where EU law has primacy.
  *   **Who it supports:** The law student who says it's "legally binding." However, it does *not* support the idea that unwinding integration is *unlawful* per se, provided it follows the treaty mechanisms (see Article 50 below).
  *   **Democratic Deficit Flag:** **High.** If integration is driven by judicial interpretation of this phrase rather than legislative debate, it bypasses national parliaments. This is a core source of the democratic deficit (integration by jurisprudence).

  ### 2. The Functionalist Trajectory (The "Spillover" Thesis)
  *   **The Claim:** This is a description of historical momentum. Economic integration in one sector (e.g., coal and steel) creates pressure to integrate adjacent sectors (e.g., general trade, then currency, then fiscal policy). It claims integration has a built-in tendency to deepen.
  *   **Verdict:** **Contested Empirical Thesis.** It describes how the EU *did* work from 1950–2000. It is currently under severe stress (e.g., differentiated integration, Brexit, opt-outs).
  *   **Union of What:** **Markets and Administrations.** It assumes economic logic drives political structure.
  *   **Who it supports:** The seminar student who argued integration has a "built-in tendency to deepen."
  *   **Contradiction:** This reading clashes with Reading 4 (Sovereignty). If markets demand closer union, national sovereignty is inevitably eroded, regardless of what the treaties say about "peoples."

  ### 3. The Federalist Destiny
  *   **The Claim:** The phrase is a normative commitment to an end-state: a United States of Europe. "Closer" implies a destination where the distinction between member states dissolves into a single federal entity.
  *   **Verdict:** **Normative Commitment (Political).** This is the "Europhile" ideal and the "Eurosceptic" fear.
  *   **Union of What:** **A Single People (Demos).** It implies the creation of a European citizenry that supersedes national citizenship.
  *   **Who it supports:** None of your friends explicitly, but it underpins the fear behind the "no exit" argument (you can't leave the federation).
  *   **Democratic Deficit Flag:** **Critical.** A federal state requires a federal democracy. If "ever closer union" pushes toward federalism without building the corresponding democratic institutions (a European press, strong parliament, pan-European parties), it creates a massive legitimacy gap.

  ### 4. The Pluralist Compromise (Union of Peoples)
  *   **The Claim:** This relies on the specific wording in the TEU preamble: "ever closer union among the *peoples* of Europe." It argues that the union is a partnership of distinct nations, not a merger into one.
  *   **Verdict:** **Normative Commitment / Legal Nuance.** This is the "Confederal" reading. It is legally real (the text says "peoples"), but often politically ignored by federalists.
  *   **Union of What:** **Nations/Peoples.** It preserves the national *demos*.
  *   **Who it supports:** The contrarian student who said it "protects national sovereignty."
  *   **Does it hold up?** It holds up textually, but collapses functionally. If the union makes laws that bind individuals directly (which it does), it is acting on citizens, not just states. You cannot have a "union of peoples" that legislates for individuals without creating a direct political relationship between the EU and the citizen.
  *   **Democratic Deficit Flag:** **Medium.** If the EU is just a union of states, then national parliaments should control it. The deficit arises because the EU acts like a government (Reading 3) but claims to be a union of states (Reading 4), leaving citizens unsure who to hold accountable.

  ### 5. The Legitimating Myth (Rhetoric)
  *   **The Claim:** The phrase has no specific content. It is a "permissive consensus" tool used by elites to justify specific steps of integration without asking for explicit permission each time. It creates a vibe of inevitability.
  *   **Verdict:** **Genuinely Empty (but politically potent).** It is "mood music," as your sceptical friend said, but mood music that dictates the tempo of the dance.
  *   **Union of What:** **Elites.** It is a union of bureaucrats and politicians who agree on the direction.
  *   **Who it supports:** The sceptical friend in the pub.
  *   **Democratic Deficit Flag:** **Maximum.** If the phrase is just rhetoric used to bypass public debate, it is the *definition* of the democratic deficit. It assumes the direction of travel is obvious and good, rendering dissent irrational.

  ---

  ### Addressing Your Specific Questions

  **1. Does any reading support 'no member can leave'?**
  **No.** This is legally incorrect.
  *   **The Evidence:** Article 50 of the Treaty on European Union (introduced by Lisbon, 2009) explicitly codifies the right of any member state to withdraw in accordance with its own constitutional requirements.
  *   **The Nuance:** Before 2009, there was a legal debate about whether withdrawal was implied to be impossible because the union was "ever closer." Article 50 settled this. The student making this argument is relying on a pre-Lisbon theoretical argument that is now textually obsolete. "Ever closer union" describes the *direction* of the remaining members, not an indissoluble bond.

  **2. Does any support 'must keep enlarging'?**
  **No, not strictly.**
  *   **The Distinction:** "Ever closer union" refers to *depth* (integration among existing members), not *breadth* (geographic enlargement).
  *   **The Confusion:** Your seminar friend is conflating "union" with "expansion." Article 49 TEU covers enlargement. "Ever closer union" could theoretically be achieved by a small group of states integrating deeply (a "multi-speed Europe") while excluding others. In fact, some argue that to get "closer," you must stop getting "wider."

  **3. Is the sovereignty-protecting reading real?**
  **It is textually real but functionally fragile.**
  *   **The Text:** The Treaty on European Union (Article 1) says "ever closer union among the *peoples* of Europe." The Treaty of Rome originally said "peoples," Maastricht changed it to "citizens," and Lisbon reverted to "peoples" in the preamble while keeping "citizens" in the operative text. This oscillation shows the tension.
  *   **The Collapse:** As noted in Reading 4 above, the EU regulates individuals directly (GDPR, competition law, human rights). You cannot protect sovereignty if the Union has direct effect on your citizens. The "union of peoples" reading collapses when the ECJ rules that EU law trumps national constitutional courts (a current flashpoint in Germany and Poland).

  **4. Where is the vagueness? (Union of *What*?)**
  You suspected this is where the problem lives. You are correct.
  *   **Union of Markets:** (Functionalism) -> Demands deregulation, free movement.
  *   **Union of States:** (Intergovernmentalism) -> Demands unanimity, veto power.
  *   **Union of Citizens:** (Federalism) -> Demands voting rights, social protection, parliament.
  *   **The Contradiction:** You cannot maximize all three simultaneously. A "closer union of markets" often requires stripping sovereignty from "states." A "closer union of citizens" requires bypassing "states." The phrase "ever closer union" allows politicians to sign a treaty thinking it means *their* version, while the ECJ or Commission later implements a *different* version.

  ---

  ### Connection to Your Essay: The Democratic Deficit

  You mentioned you have an essay on the democratic deficit coming up. This phrase is arguably the **engine of the democratic deficit**. Here is how you can use this analysis:

  1.  **The "Teleological" Trap:** If "ever closer union" is a legal instruction (Reading 1) to judges, then integration happens through court rulings, not parliamentary votes. This removes the issue from the democratic arena. *Argument: The phrase judicializes politics.*
  2.  **The "Inevitability" Narrative:** If the phrase implies a historical trajectory (Reading 2), it suggests that integration is inevitable. If something is inevitable, why vote on it? This discourages public debate. *Argument: The phrase depoliticizes choice.*
  3.  **The Legitimacy Gap:** If the phrase promises a "Union of Citizens" (Reading 3) but delivers a "Union of Markets" (Reading 2), citizens feel the burden of union (laws) without the benefit (protection/voice). *Argument: The phrase creates false expectations of democracy.*
  4.  **The "Permissive Consensus":** For decades, the vagueness of "ever closer union" allowed elites to integrate while citizens didn't care. Now that citizens *do* care (migration, currency, sovereignty), the vagueness is no longer a feature; it's a bug. The deficit exists because the phrase allowed the EU to outpace the development of a European public sphere.

  ### Summary for your Seminar
  Next time someone reaches for the phrase, you can ask: **"Which union are we talking about?"**
  *   If they mean **Law**, remind them of Article 50 (exit is legal).
  *   If they mean **History**, remind them that spillover is not guaranteed (stall-outs happen).
  *   If they mean **Sovereignty**, ask them how a union that binds individuals protects state autonomy.
  *   If they mean **Democracy**, ask them if "ever closer" implies "ever more federal," and if so, where is the European *demos* to vote for it?

  The phrase isn't a lie, but it is a **container**. Your friends are all fighting over what's inside the container, but the container itself was designed to keep them from noticing they were carrying different cargo.
