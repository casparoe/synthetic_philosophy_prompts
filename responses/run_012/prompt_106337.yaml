      *   *Refining the Attention Crux:* The core issue is whether attention is a *confound* or a *mechanism*. If I attend to something because I believe it's important, is that penetration? Encapsulator says: Attention is the gate, belief opens the gate, but the *view* through the gate isn't changed. Penetrator says: Opening the gate changes the brightness of the view.
      *   *Experiment:* **Contrast Sensitivity with Equated Attention.** Use a task where attention is objectively measured (e.g., via pupil dilation or neural markers) to ensure it's identical across conditions, then vary the belief.
      *   *Actually, a cleaner distinction:* **The "Hollow Face" Illusion.** Knowledge (it's hollow) vs. Perception (it looks convex).
      *   *Wait, the prompt asks for (a) Attention vs Belief line.*
      *   *Okay, Experiment 1:* **Value-Driven Attentional Capture.**
      *   *Experiment 2:* **Statistical Learning (Gray/Red).**

  8.  **Final Polish:**
      *   Ensure the "Crux" column identifies the *sub-question* that resolves the row.
      *   Make sure the predictions are falsifiable.
      *   Ensure the "Verbal Dispute" section is honest about where definitions might be masking empirical disagreements.

      *(Self-Correction during drafting)*: I need to be careful not to make the Encapsulator sound like a behaviorist. They believe in experience, just that it's modular. I need to make sure the Penetrator doesn't sound like they think *everything* is perception.
      *   *Agreed Claim:* Both agree there is a distinction between sensing and thinking, they just disagree on the permeability of the border.
      *   *Attention Crux:* Is attention a *cognitive* state? If attention is cognitive, and attention changes perception, then cognition penetrates perception. Encapsulator must argue Attention is *not* cognitive (it's sub-personal/orienting).
      *   *Slow Learning Crux:* Is plasticity penetration? Encapsulator says plasticity = calibration (module updating). Penetrator says plasticity = belief sedimentation.

      *Let's finalize the Experiments.*
      *   *Case 1 (Attention):* **Endogenous Cueing with Control.** Compare a spatial cue (arrow) to a semantic cue ("70% Left"). Measure d' (sensitivity) vs C (criterion).
      *   *Case 2 (Slow Learning):* **The "Makin" Color Learning Task.** (Gray blob -> Red flash). Measure appearance matching *after* learning, controlling for decision bias.

      *Wait, one more thing:* The prompt asks for the "Disagreements Table" to have the disagreement stated twice (once in P wording, once in E wording). I need to make sure that's clear.

      *Verbal Dispute:* The word "Experience." P uses it to mean "Phenomenology." E uses it to mean "Early Visual Representation."

