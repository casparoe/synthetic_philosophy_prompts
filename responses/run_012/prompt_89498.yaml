answer: |-
  Here is the specification for a theory of rational choice under uncertainty. I have separated consensus requirements from contested ones, and flagged where the trade-offs lie.

  ### Part 1: The Test Cases (Load-Bearing vs. Redundant)

  These cases are not a menu; they are stress tests. Most are variations on three core failure modes: **Correlation vs. Causation**, **Time Consistency**, and **Logical Correlation**.

  **1. The Smoking Lesion**
  *   **The Case:** A genetic lesion causes both a desire to smoke and cancer. Smoking itself does not cause cancer. You like smoking. Do you smoke?
  *   **What it Tests:** **Evidential vs. Causal reasoning.**
  *   **The Load:** This breaks Evidential Decision Theory (EDT). EDT sees smoking as *evidence* of the lesion/cancer and advises against it. Causal Decision Theory (CDT) sees no causal link and advises smoking.
  *   **Status:** Consensus that EDT fails here. A viable theory must not treat mere correlation as a reason to act when causation is absent.

  **2. Newcomb's Problem**
  *   **The Case:** A predictor puts $1M in Box A if it predicts you take only Box A. Box B has $1k. You can take both or just A. The prediction is already made.
  *   **What it Tests:** **Causal dominance vs. Policy optimality.**
  *   **The Load:** This breaks CDT. CDT says "The money is already there; take both." But one-boxers get $1M and two-boxers get $1k. It tests whether the theory respects the *consequences of being the kind of agent who chooses X* versus the *causal consequences of choosing X now*.
  *   **Status:** Contested. CDT proponents argue two-boxing is rational and the loss is unavoidable. UDT/FDT proponents argue one-boxing is rational. You must decide if "winning" or "causal purity" is the goal.

  **3. Parfit's Hitchhiker**
  *   **The Case:** You are stranded. A driver will save you only if they predict you will pay them $100 once you reach the city. Once in the city, you are safe. Do you pay?
  *   **What it Tests:** **Precommitment / Time Consistency.**
  *   **The Load:** CDT and EDT say "Don't pay." You are already safe; paying costs utility with no causal benefit. But if you are that kind of agent, you die in the desert.
  *   **Redundancy Check:** This is structurally identical to **Counterfactual Mugging**. In Mugging, Omega asks for money in the "loss" branch to justify giving money in the "win" branch. In Hitchhiker, you pay in the "safe" branch to justify being saved in the "danger" branch.
  *   **Verdict:** Keep one, drop the other. They test the same thing: **Updatelessness**. Can you act to satisfy a condition that was evaluated in the past, even when it no longer serves your current interests?

  **4. Twin Prisoner's Dilemma**
  *   **The Case:** You play PD against a perfect copy of yourself.
  *   **What it Tests:** **Logical Correlation.**
  *   **The Load:** CDT says "Defect." Your choice doesn't causally change the copy's choice. But since you are identical, you output the same move. Cooperating yields a better outcome.
  *   **Status:** This distinguishes Functional/Updateless Decision Theory (FDT/UDT) from CDT. It tests whether the theory treats your decision as a *logical fact* that constrains other instances of the same algorithm.

  **5. XOR Blackmail**
  *   **The Case:** A predictor sends you a letter demanding money if and only if: (You have termites AND won't pay) OR (No termites AND will pay). You receive the letter. Do you pay?
  *   **What it Tests:** **Logical correlation without causal influence.**
  *   **The Load:** Similar to Newcomb, but the predictor's action (sending the letter) is logically entangled with your response. CDT pays (to avoid termites). FDT/UDT refuses (because paying makes it more likely the letter was sent in the no-termites world).
  *   **Verdict:** Redundant with Newcomb/Twin PD if you accept logical correlation. It's a stress test for whether the theory handles *logical* dependencies as carefully as *causal* ones.

  **Summary of Load-Bearing Cases:**
  1.  **Smoking Lesion:** Must handle correlation without causation. (Breaks EDT)
  2.  **Newcomb:** Must handle prediction based on your disposition. (Breaks CDT)
  3.  **Hitchhiker/Mugging:** Must handle counterfactual payoff dependence. (Breaks CDT & EDT; requires Updatelessness)
  4.  **Twin PD:** Must handle logical identity between agents. (Breaks CDT)

  ---

  ### Part 2: Structural Requirements

  These are formal properties the math must satisfy. I have flagged which are consensus and which are tradition-specific.

  **1. Non-Exploitability (Dutch Book / Money Pump)**
  *   **Requirement:** There should be no cycle of trades or bets that guarantees a loss regardless of the state of the world.
  *   **Status:** **Consensus.** If a theory allows a money pump, it is formally broken.

  **2. Ordinariness (Agreement with Expected Utility)**
  *   **Requirement:** In standard cases of risk (dice, cards, no predictors), the theory must collapse to standard Expected Utility maximization.
  *   **Status:** **Consensus.** We are not reinventing probability theory, only the link between probability and action.

  **3. Partition Invariance**
  *   **Requirement:** The recommendation should not change based on how the state space is described or carved up (e.g., grouping states together vs. keeping them separate).
  *   **Status:** **Consensus (in principle), Contested (in practice).** EDT often violates this depending on how "evidence" is conditioned. A robust theory must be invariant to description.

  **4. Reflective Consistency**
  *   **Requirement:** If you know the theory's verdict before you act, you should not wish you were following a different theory. You should not want to self-modify away from the theory.
  *   **Status:** **Contested (UDT/FDT specific).** CDT agents in Newcomb problems *know* they will lose and wish they were precommitted one-boxers. If you demand reflective consistency, you rule out CDT. If you demand causal dominance, you rule out reflective consistency in predictor cases.

  **5. Self-Locating Uncertainty**
  *   **Requirement:** The theory must handle cases where you are unsure *which* agent you are (e.g., Sleeping Beauty, copies).
  *   **Status:** **Highly Contested.** There is no consensus on the "Self-Sampling Assumption" vs. "Self-Indication Assumption." This is an open wound in decision theory. Do not treat any specific solution as a desideratum yet.

  ---

  ### Part 3: The Incompatibility (The Trade-Off)

  You suspected a tension between "Maximize expected value given your evidence" and "Act so the policy you'd have picked in advance does best." You are correct. They are mutually exclusive in predictor cases.

  **The Conflict:**
  *   **Desideratum A (Local Optimality):** Given your current state and evidence, choose the action with the highest conditional expected utility. (This is CDT/EDT).
  *   **Desideratum B (Global/Policy Optimality):** Choose the action that the optimal *policy* (selected before you had this specific evidence) would dictate. (This is UDT/FDT).

  **Why they clash:**
  In Newcomb's Problem, once the money is in the boxes, your evidence says "The money is there or it isn't. My choice now doesn't move it." Local Optimality says "Take both."
  However, the Policy that says "Take both" gets $1,000. The Policy that says "Take one" gets $1,000,000. Global Optimality says "Take one."

  **Which to drop?**
  If your goal is **agent design** (building something that wins), you must drop **Local Optimality (Desideratum A)**.
  *   **The Cost:** You must accept actions that look irrational from a narrow, causal, post-hoc perspective. You will pay the Hitchhiker when you are already safe. You will pay the Muggers when you know the reward is gone. You are acting to satisfy a counterfactual condition.
  *   **The Benefit:** **Reflective Consistency.** You never wish you were a different kind of agent. You are robust against prediction and logical correlation.

  If your goal is **causal explanation** (describing how physical movements affect physical outcomes), you keep Local Optimality and drop Reflective Consistency.
  *   **The Cost:** You lose. In Newcomb, you get $1k. In Hitchhiker, you die. You will constantly wish you could bind your own hands beforehand.
  *   **The Benefit:** Causal Purity. You never claim your action influences the past or logically distant events.

  **Recommendation:** For a reading group focused on "rational choice" in the sense of achieving goals, **drop Local Optimality.** A theory that guarantees you lose against predictors is not a theory of rational *choice*, it is a theory of rational *motion*.

  ---

  ### Part 4: The Custom Case (Omega Coin Flip)

  **The Case:** Omega flips a coin.
  *   **Heads:** She hands you $10,000. (She did this *only* because she predicted you would pay in Tails).
  *   **Tails:** She asks you for $1,000.
  *   **Current State:** You are in the Tails branch. You know the Heads money is already distributed/foregone.

  **Is this new?**
  No. This is **Counterfactual Mugging** with a symmetric payoff structure.
  *   Standard Mugging: "If Heads I give you $10k (counterfactual). If Tails give me $100."
  *   Your Case: "If Heads I gave you $10k (actual). If Tails give me $1k."

  **Does existing theory handle it?**
  *   **CDT/EDT:** No. In the Tails branch, the Heads money is already gone. Paying $1k is a pure loss. They refuse.
  *   **UDT/FDT:** Yes. The theory evaluates the policy *before* the coin flip.
      *   Policy "Pay": Expected Value = 50% * ($10,000 - $1,000) + 50% * (-$1,000) = $4,500.
      *   Policy "Don't Pay": Expected Value = 0 (Omega predicts this and gives nothing in Heads).
      *   UDT pays the $1k in the Tails branch because that is what the optimal policy dictates.

  **Does it need a new rule?**
  No. It requires **Updatelessness**, which is already required for Counterfactual Mugging and Parfit's Hitchhiker.
  *   **The Nuance:** Your version makes the reward *actual* in the other branch, whereas standard Mugging makes it *counterfactual*. This makes the loss in the Tails branch feel more visceral ("I could have had the money, but now I don't AND I have to pay?").
  *   **Desideratum Check:** This confirms the requirement for **Policy Invariance**. The decision in the Tails branch cannot depend on the fact that you *are* in the Tails branch. You must act as if you are still behind the veil of ignorance regarding the coin flip.

  **Missing Desideratum?**
  If anything, this case highlights a specific phrasing of Updatelessness: **Counterfactual Payoff Recognition.**
  *   *Desideratum:* The theory must treat payoffs that are contingent on your *disposition* as real, even if they are contingent on a branch of reality you are not currently in.
  *   This is already covered by "Reflective Consistency" and "Policy Optimality," but your case is an excellent pedagogical tool to expose people who claim to solve Mugging but flinch when the reward is "real" in the other branch.

  ---

  ### Part 5: Epistemic Status Checklist

  To ensure your reading group doesn't smuggle in assumptions, use this key when discussing the list above:

  *   **[CONSENSUS]:** Non-exploitability, Ordinariness (standard EU), Partition Invariance, Smoking Lesion verdict (Don't treat correlation as causation).
  *   **[CONTENDED - CDT TRADITION]:** Newcomb Two-Boxing, Hitchhiker Non-Payment, Local Optimality (Maximize given current evidence). *Note: CDT proponents admit they lose in these cases but argue it is the price of causal sanity.*
  *   **[CONTENDED - UDT/FDT TRADITION]:** Reflective Consistency (without external precommitment), Newcomb One-Boxing, Paying in Counterfactual Mugging/Hitchhiker, Logical Correlation (Twin PD). *Note: This tradition argues that losing is irrational, regardless of causal purity.*
  *   **[UNRESOLVED]:** Self-Locating Uncertainty (Sleeping Beauty type cases). No theory has a universally accepted solution here yet.

  **Final Advice for the Group:**
  The biggest trap is treating "Rationality" as a single concept. It is not. It is a triangle between **Causal Purity**, **Reflective Consistency**, and **Winning**. You can have any two, but not all three in predictor environments.
  *   CDT chooses Causal Purity + Consistency (and accepts Losing).
  *   UDT chooses Consistency + Winning (and accepts Causal Impurity).
  *   There is no stable position that chooses Causal Purity + Winning in Newcomb-like problems.

  Make the group pick which vertex they are willing to cut off before they argue about the cases. Otherwise, they are just talking past each other.
