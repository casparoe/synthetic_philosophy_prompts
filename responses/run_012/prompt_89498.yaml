      *   *Epistemic Status:* Throughout, label claims. "CDT says X," "UDT says Y," "Consensus says Z."

  7.  **Refining the Tension/Trade-off:**
      *   The user asks: "if that's right, say which you'd drop and what it costs."
      *   I need to take a stance or present the strongest argument. The prompt asks me to "be straight with me."
      *   *Argument:* Reflective Consistency is the stronger desideratum for an *agent design*. Dominance is stronger for *post-hoc justification*. If the goal is "winning," drop strict conditional dominance in favor of policy optimality. The cost is counter-intuitive actions in the actual world (paying when you get nothing).
      *   *Wait, check constraints:* "seperate what every camp would sign off on from what's just one tradition's intuition." I shouldn't present my personal preference as fact. I should present the *logical* incompatibility.
      *   *Correction:* I will state the incompatibility clearly. I will advise that if the goal is *reflective stability* (not wanting to self-modify), you drop "Maximize conditional on current state." If the goal is *causal purity*, you drop "Reflective consistency in predictor cases." Most modern decision theory research aimed at AI leans toward the former.

  8.  **Refining the Custom Case:**
