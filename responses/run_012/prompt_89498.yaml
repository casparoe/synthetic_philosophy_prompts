      *   User Case: Omega flips. Heads: Gives $10k (because predicted pay). Tails: Asks for $1k.
      *   Difference: In standard Mugging, the reward is counterfactual ("I *would* have given"). In this case, the reward is actual in the Heads branch ("She hands you $10,000").
      *   Does this change the decision theory? No. From the perspective of the agent *before* the coin flip (the policy selection point), the expected value depends on paying in Tails. From the perspective of the agent *in* Tails, the Heads money is gone.
      *   Verdict: It is Counterfactual Mugging. It tests Updatelessness.

