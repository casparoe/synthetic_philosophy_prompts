      *   *Newcomb's Problem:* Tests Causal (CDT) vs. Evidential (EDT) vs. Functional/Updateless (FDT/UDT). Core issue: Correlation vs. Causation with a predictor.
      *   *Smoking Lesion:* Tests EDT's weakness. Correlation without causation (genetic lesion causes smoking and cancer). EDT smokes (bad), CDT doesn't (good).
      *   *Counterfactual Mugging:* Tests Updatelessness. A loss in the actual world is required to secure a gain in the counterfactual world. CDT/EDT fail (myopic). UDT/FDT succeed.
      *   *XOR Blackmail:* Tests logical correlation vs. causal influence. Similar to Newcomb but with blackmail dynamics. Distinguishes FDT from CDT/EDT.
      *   *Parfit's Hitchhiker:* Tests precommitment/credibility. You must pay once in the city to have been picked up. CDT defects (already safe), FDT/UDT pays.
      *   *Twin Prisoner's Dilemma:* Tests logical correlation between agents. If you are identical to your opponent, cooperation is rational. CDT defects.
      *   *Redundancy Check:* Hitchhiker and Counterfactual Mugging are very similar (paying in the 'loss' branch to enable the 'win' branch). Newcomb and Twin PD are similar (predictor/copy correlation).

  3.  **Deconstruct Structural Requirements:**
      *   *Non-exploitability (Dutch Book/Money Pump):* Consensus. You shouldn't lose sure money.
      *   *Reflective Consistency:* Consensus-ish, but defined differently. You shouldn't want to self-modify away from the theory.
      *   *Ordinary EU Agreement:* Consensus. In standard risk (cards, dice), it must look like EU.
      *   *Self-locating Uncertainty:* Contested. How to handle "I am one of many copies." (SSA vs. SRA).
