prompt: |-
  Okay so I'm a third-year PhD student (philosophy, but my supervisor sits in the cognitive science institute so I basically live with the sleep people), and next Thursday I'm up at our consciousness/dreaming reading group. Audience: four sleep-and-dreaming researchers — two of them run a lucid-dreaming lab and are deep into the in-dream eye-signaling work, one does quantitative dream-content coding, one's a sleep clinician — plus two philosophers of mind, and one of those is a dyed-in-the-wool representationalist who thinks mental imagery is just perception-lite. I've got 25 minutes and then however long the Q&A runs.

  I'm defending a version of the old Malcolm/Dennett line that dreams aren't experiences, but with a wrinkle I havent seen anyone put quite this way and I'm scared it'll get shredded. Two moves. First, I split the dream *content* from the *episode of experiencing* it: the content is perfectly real, it's caused by what the brain is doing at night, it's probe-able, it tracks REM and pre-sleep stimuli and all that — but the episode of experiencing that content is an artifact of the waking report. The report doesn't report a perception, it constructs one, and we then mistake the construction for a memory of an experience. My analogy is that it's like asking whether the past is experienced: the content can be about a real event without there being any episode of experiencing it at the time. Second — and I think this is the more dangerous bit — I want to say the dream report isn't really a report at all; it's closer to an avowal or a confession, more like "I'm in pain" than like "I saw a fox," so the whole "is the report a reliable report of an experience?" frame is a category mistake. Net effect I'm claiming: the question "are dreams experiences?" dissolves rather than gets answered either way, which I suspect will annoy literally everyone in the room.

  Can you write my Q&A prep sheet for this specific crowd — the objections I'll actually get *here*, not the ones I'd get from a room of analytic epistemologists. Rank them by how much damage they do to me, phrase each one the way the person who'd raise it would phrase it (the clinician should sound different from the representationalist), give me a ~90-second reply and tell me honestly where each reply is soft. And include the question I'm dreading, the one I don't have an answer to. Format it as: "How they'll hear my view" (3-4 sentences, no jargon); then "The objections" (ranked, each with who raises it, the phrasing, the reply, and where the reply is weak — about 800 words); then "What I should concede up front" (4-5 bullets); then "The one I'm hoping nobody asks" (the question, why it's lethal, what I can salvage); then "What to fix in the talk" (3 bullets).
