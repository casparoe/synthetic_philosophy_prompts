answer: |-
  The Reflection principle posits a tight bond between an agent's present and future doxastic states. It dictates that if an agent is certain her future credence in a proposition $A$ will be $x$, her current credence in $A$ must also be $x$. This is often defended as a constitutive norm of rationality, ensuring that an agent does not view her future self as less reliable than her present self without cause. However, the Calibration Asymmetry (CA) proposes a more nuanced constraint: an agent should align her credence with $x$ only if the method producing $x$ is trusted; if there is evidence of systematic bias, her credence should be regressed towards the mean. Adjudicating between these principles requires determining whether rationality demands blind trust in one's own cognitive trajectory or responsive calibration based on empirical reliability.

  The first hurdle for the Calibration Asymmetry is coherence. The principle instructs an agent to set her credence in $A$, conditional on her credence in $A$ being $x$, to a value other than $x$ (specifically, a discounted value) when bias is detected. Superficially, this appears contradictory. If an agent knows her credence is $x$, does she not, by definition, have credence $x$? To condition on the fact that one's credence is $x$ and then conclude something else seems to violate the transparency of mind.

  However, this incoherence is only apparent if we conflate the *output* of a cognitive process with the *rational endorsement* of that output. The CA stipulation refers to $x$ as issuing from a "method". In the diachronic context relevant to Reflection, the proposition conditioned upon is not merely "I believe $A$ to degree $x$", but rather "My cognitive system will produce an output of $x$". The agent treats this output as evidence about the world, akin to testimony from a reliable instrument. Just as one might read a gauge indicating pressure $x$ but discount it due to known calibration errors, one can acknowledge a future credence of $x$ while assigning a different rational credence based on the known reliability of the process generating $x$. Thus, CA is coherent provided we distinguish between the psychological state of having a credence and the normative status of that credence as a guide to truth. In the diachronic setting of Reflection, where the future credence is treated as a piece of evidence to be evaluated by the present self, CA is perfectly consistent.

  This coherence allows us to reassess the standard Dutch-book and accuracy-based arguments typically marshalled in support of Reflection. The Dutch-book argument suggests that violating Reflection leaves an agent vulnerable to a series of bets that guarantee a loss. If an agent now believes $A$ to degree 0.5 but knows she will later believe it to degree 0.7, a bookie can sell her a bet now at 0.5 and buy it back later at 0.7. However, this argument presupposes that the change in credence is driven by rational information uptake. If the agent possesses evidence that her future self will be overconfident—say, due to fatigue or emotional agitation—then the future credence of 0.7 is not a reliable indicator of truth. In such cases, the "guaranteed loss" arises only if the agent treats the future credence as authoritative. By adhering to CA and discounting the future credence now, the agent avoids the bet that exploits her future irrationality. The Dutch book does not demonstrate irrationality in violating Reflection; rather, it demonstrates vulnerability to exploitation by those who know the agent's future bias better than the agent does herself. If the agent knows the bias, CA protects her.

  Similarly, accuracy-based arguments claim that adhering to Reflection minimises expected inaccuracy. Yet, accuracy is a function of correspondence with the truth, not internal consistency. If an agent has strong evidence that her future credences on a certain topic are systematically overconfident (e.g., they are 0.9 when the truth frequency is 0.7), then adopting the future credence of 0.9 guarantees higher inaccuracy than regressing towards 0.7. To insist on Reflection in the face of known miscalibration is to prioritise diachronic consistency over truth-tracking. Since the primary aim of credence is accuracy, the accuracy argument actually supports CA over strict Reflection. CA ensures that the agent's credences remain calibrated to the world, whereas Reflection ensures they are calibrated only to the agent's own potentially flawed trajectory.

  One might object that CA is merely a restatement of ordinary conditionalisation on higher-order evidence, and thus adds nothing new to the debate. If an agent learns she is biased, she simply conditionalises on that evidence, and her credence shifts accordingly. On this view, Reflection holds for the "ideal" agent, and CA describes what happens when we add empirical premises about reliability.

  This objection misunderstands the normative force of CA. Standard conditionalisation is a mechanical rule: update by conditioning on new evidence. It does not dictate *how* to interpret that evidence. One could, in principle, have priors that treat one's own bias as evidence of truth (a form of perversity). CA is a substantive constraint on those priors. It mandates that evidence of overconfidence *must* lead to a less extreme credence. It is a structural norm about the relationship between first-order evidence and higher-order evidence of reliability. Reflection, by contrast, attempts to bypass the need for evaluating reliability by asserting a priori that future credence is sufficient. CA acknowledges that the move from "my future self believes $x$" to "I should believe $x$" requires a bridge of reliability, and it specifies the geometry of that bridge. Therefore, CA is not merely conditionalisation; it is a principle governing the rational priors required for conditionalisation to yield truth-approximating results.

  When the two principles conflict, it is evident which must give way. Reflection demands $P_{now}(A | P_{future}(A) = x) = x$. CA demands $P_{now}(A | P_{future}(A) = x) = x^*$, where $x^*$ is discounted for bias. Since CA accommodates the empirical reality of cognitive fallibility while Reflection does not, Reflection must be viewed as a special case of CA that obtains only when the condition of "no specific reason to distrust" is met. Rationality is not a closed loop of self-trust; it is an open system responsive to data about its own performance. To demand Reflection in the face of positive evidence of bias is to demand that the agent ignore relevant evidence regarding the reliability of her own cognitive faculties. Therefore, Reflection is not a genuine requirement of rationality. It is, at best, a permissible ideal that holds in the absence of defeaters. The genuine requirement is the Calibration Asymmetry.

  The strongest objection to this verdict concerns rational instability. If an agent currently discounts her future credence because she expects bias, she effectively judges her future self to be irrational. But if she knows now that her future self will be irrational, why does she not correct the irrationality then? If she plans to hold a discounted credence now, but knows her future self will hold the extreme credence $x$, she is planning to disagree with her future self. This looks like a form of akrasia: she believes that when the time comes, she ought to believe $x$ (since it will be her sincere assessment then), yet she refuses to believe $x$ now. This threatens to fragment the agent over time, turning her into a sequence of distinct strangers rather than a unified rational entity. Furthermore, if she knows she will be overconfident later, and she is rational now, should she not take steps to prevent that overconfidence? If she cannot prevent it, is she truly rational now?

  This objection, however, relies on an overly intellectualised view of cognitive limitations. Rationality does not imply omniscience or perfect control over one's psychological states. An agent can be fully rational in recognising that fatigue will degrade her performance later, without being able to prevent that fatigue. Consider a surgeon who knows her hands will shake tomorrow due to a known medical condition. She is rational to decline surgery tomorrow, even though tomorrow she may feel perfectly capable. Her current assessment of her future incapacity does not render her unstable; it renders her prudent. Similarly, an agent who knows her future credences will be inflated by emotion is not fragmented; she is accurately modelling her own cognitive ecology. The "disagreement" with her future self is not a conflict between two rational agents, but a conflict between a rational present agent and a predictably compromised future agent. The unity of the agent is preserved by the present self's commitment to truth, which sometimes requires protecting the agent's epistemic interests against the agent's own future lapses. The instability is not in the rationality, but in the psychological conditions the rationality is navigating.

  In conclusion, the Reflection principle fails as a universal constraint on rationality. It mistakenly elevates diachronic consistency above empirical calibration. The Calibration Asymmetry provides the correct normative framework: self-trust is the default, but it is defeasible in the face of evidence regarding the reliability of one's own cognitive methods. CA is coherent when understood as treating credences as fallible evidence, it withstands Dutch-book and accuracy challenges better than Reflection, and it offers a substantive norm beyond mere conditionalisation. When the two conflict, Reflection must yield. Rationality requires us to trust ourselves, but only insofar as we have reason to believe we are trustworthy. To demand more is not to demand rationality, but to demand infallibility.
