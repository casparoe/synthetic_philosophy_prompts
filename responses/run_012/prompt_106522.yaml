answer: |-
  You have put your finger on the central methodological crisis of historiography. As a chemist, you have intuitively identified the historical equivalent of **pseudoreplication**.

  In experimental science, if you measure the same sample three times, you have $N=1$, not $N=3$. If you treat them as three independent data points, you have artificially inflated your statistical confidence. You are describing the exact same structural flaw in historical reasoning: treating three derivative texts as three independent witnesses inflates the epistemic "sample size" ($N$) of the past.

  There is no single, universally agreed-upon noun for this specific circularity (like "gravity" or "entropy"), but it is a recognized cluster of problems in the philosophy of history and textual criticism. If we must name it, the most precise label is **The Problem of Testimonial Independence**, often discussed under the umbrella of **Source Criticism** (*Quellenkritik*). The specific circularity you identified—where independence is inferred from the very data whose weight depends on independence—is a form of **Epistemic Circularity** or **Bootstrapping**.

  Here is how this phenomenon is defined, where it appears in the literature, and how it distinguishes itself from the related concepts you mentioned.

  ### 1. The Name and Definition
  While historians often speak loosely of "derivative sources," the philosophical problem you describe is best defined as **The Underdetermination of Source Genealogy**.

  *   **Definition:** A state in which the evidential weight of a set of testimonies depends on their probabilistic independence, but their independence cannot be established by external evidence and must instead be inferred from the internal patterns of agreement and disagreement among the testimonies themselves.
  *   **The Circle:** To trust the content, we need independent sources. To know they are independent, we must analyze the content. If we assume independence to analyze the content, we assume what we are trying to prove.

  In the philosophy of history (e.g., in the work of C.B. McCullagh or Aviezer Tucker), this is treated as a **Bayesian problem**. The probability of an event ($E$) given testimony ($T_1, T_2, T_3$) skyrockets if the testimonies are independent. But if $T_2$ and $T_3$ are causally dependent on $T_1$ (a common cause), the probability does not increase. The "circularity" arises because the causal structure (the genealogy) is hidden, and we try to deduce it from the correlation of the data.

  ### 2. The Scientific Analog: Pseudoreplication
  Since you are a chemist, the closest conceptual match is not actually in philosophy, but in statistics: **Pseudoreplication**.
  *   **In the Lab:** You run an assay on one lysate three times. You cannot claim $N=3$. You have one biological sample and three technical replicates.
  *   **In History:** You have one lost original account (the lysate) and three surviving manuscripts (the technical replicates).
  *   **The Error:** Counting manuscripts instead of sources. Historians often count *surviving witnesses* rather than *independent traditions*.

  ### 3. The Asymmetry of Error (Lachmann's Method)
  You noted: *"When two reports share an unusual error, we treat the shared error as proof of a common ancestor... yet we are reluctant to apply the identical reasoning to a shared true detail."*

  This has a name: **Lachmann's Method** (or the Method of Common Errors), derived from textual criticism (stemmatics).
  *   **Why Errors Bind:** Two scribes are unlikely to independently make the *same* mistake (e.g., skipping a line because two lines ended in the same word). Therefore, shared error proves common ancestry (dependence).
  *   **Why Truths Float:** Two scribes *can* independently copy the *same* truth from reality (or from a common original). Therefore, shared truth is ambiguous: it could mean they both saw the event (independence) or they both copied the same book (dependence).
  *   **The Trap:** Historians often treat shared *truths* as corroboration (independence) while treating shared *errors* as genealogy (dependence). This is logically inconsistent unless you can prove the "truth" was not available in a common prior source.

  ### 4. Distinctions from Related Concepts
  You asked how this differs from nearer things it resembles.

  **A. Versus "Plain Caution that sources may be derivative"**
  *   **Caution** is a heuristic ("Be careful, Author B might have read Author A").
  *   **The Problem of Testimonial Independence** is a structural limitation. It asserts that *without external evidence* (like archaeology or disjointed contextual details), the independence is formally unknowable. It is not just a warning; it is a limit on what can be known.

  **B. Versus "Common-Cause Point (Agreement need not be corroboration)"**
  *   **Common-Cause** is the general principle (Reichenbach's Common Cause Principle).
  *   **Your Observation** is the *historical application* where the "Common Cause" is usually a *lost text*. The specific difficulty is that the common cause is often missing, making the inference retroactive and circular.

  **C. Versus "Treating readings as independent when they share an instrument"**
  *   **This is the same phenomenon.** In your lab, the "instrument" is the lost source text. If three readings come from one spectrometer, they are correlated. If three histories come from one lost chronicle, they are correlated. The only difference is that in chemistry, you can inspect the spectrometer. In history, the spectrometer is burned, and you only have the printouts.

  ### 5. Forgery vs. Honestly Shared Memory
  You asked where the boundary lies between a deliberately forged common source and an honestly shared memory.

  From the perspective of **epistemic weight**, **there is no boundary.**
  *   **Scenario A:** Author B copies Author A honestly, believing A is true.
  *   **Scenario B:** Author B forges a document and pretends it is Author A.
  *   **Epistemic Result:** In both cases, B is not an independent witness. B adds zero new information about the *event*; B only adds information about the *tradition*.

  The distinction matters for *moral* judgment of the author, but not for the *logical* problem you identified. Whether the funneling is due to lazy copying, oral tradition bottlenecking, or deliberate forgery, the result is **Correlated Testimony**. The "N" remains 1.

  ### 6. The "Funneling" Effect
  You noted: *"The many streams, traced upstream, are one spring."*
  In historiography, this is often called the **Bottleneck Effect** or **Transmission Loss**.
  *   In Biblical Studies, this is famously known as **The Synoptic Problem**. For centuries, scholars thought Matthew, Mark, and Luke were three independent witnesses to Jesus. It was later deduced (via shared errors and phrasing) that they were largely one witness (Mark) in three costumes.
  *   In Classical History, this is the **Source Critical Dilemma**. For example, much of what we know about Alexander the Great comes from five historians writing centuries later. Source criticism suggests they all funnel back to two lost accounts (Cleitarchus and Ptolemy). We think we have five witnesses; we have two.

  ### Summary Recommendation
  If you wish to search for further reading on this, the specific terms to use are:
  1.  **Source Criticism** (*Quellenkritik*)
  2.  **The Criterion of Multiple Attestation** (and its critiques)
  3.  **Stemmatics** (for the method of tracing the "one spring")
  4.  **Bayesian Epistemology of History** (for the probabilistic formulation of independence)
  5.  **Pseudoreplication** (for the statistical analogy)

  You have not found a name because historians often try to solve this problem methodologically (by building stemmas) rather than naming the epistemic circle itself. You are correct to identify it as a circle. In the absence of external anchors (archaeology, contemporary inscriptions), historical reasoning about the distant past often rests on this circular appraisal of independence. Recognizing it does not invalidate history, but it does require that we treat the "sample size" of the past with the same rigor you would apply to a chemical assay.
