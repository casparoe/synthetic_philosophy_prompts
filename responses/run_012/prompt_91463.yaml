answer: |-
  ### The Disposition Assessment Protocol (DAP)

  **Purpose:** To distinguish between a dog that is safe (Disposition Absent), a dog that is unsafe but hiding it (Masked/Finkish), and a dog that acted out of character due to pain or accident (Mimic).
  **Operator:** Trained Volunteer (2-hour curriculum).
  **Time:** 45 Minutes per dog.
  **Authority:** This procedure overrides the old "If/Then" sheet. If this protocol says "Refer," the old sheet is discarded.

  ---

  ### Phase 1: The Baseline (Rule Out Mimicry)
  *Before you test the disposition, you must ensure the hardware isn't broken.*

  **Step 1.1: Medical Scan**
  *   **Action:** Review kennel card for vet notes. Observe the dog walking from kennel to assessment room. Look for limping, head-shaking, flinching when air moves near the body, or whining when sitting/standing.
  *   **Question:** Is there *any* objective sign of pain or illness?
  *   **If YES:** **STOP.** Do not assess aggression.
      *   **Action:** Mark form as "MEDICAL HOLD."
      *   **Escalate:** Notify Shelter Vet.
      *   **Why:** Pain mimics aggression (Mimicry). A dog biting because its hip hurts is not an aggressive dog; it is a hurting dog. You cannot score disposition here.
  *   **If NO:** Proceed to Step 1.2.

  **Step 1.2: Stress Baseline**
  *   **Action:** Stand 5 feet away. Do not make eye contact. Count for 60 seconds.
  *   **Observation:** Look for "Shutdown" signals: rigid freeze, no tail movement, no panting, eyes wide with whites showing (whale eye), refusal to take treats.
  *   **Question:** Is the dog in a state of high stress or shutdown *before* you touch anything?
  *   **If YES (High Stress/Shutdown):** Flag as **POTENTIALLY MASKED**.
      *   **Note:** A terrified dog often cannot access aggression (Masking). It will pass your test because it is frozen, not because it is safe.
      *   **Action:** Proceed to Phase 2, but you are not allowed to score this dog "Clear."
  *   **If NO (Relaxed/Neutral):** Proceed to Phase 2.

  ---

  ### Phase 2: The Stimulus & Response (The Test)
  *Run your standard 45-minute battery (bowl, hand, toy, decoy).*

  **Step 2.1: The Manifestation Check**
  *   **Action:** Record the reaction to each stimulus.
  *   **Question:** Did the dog growl, snap, lunge, or bite?
  *   **If YES:** **Disposition Manifested.**
      *   **Action:** Go to Phase 3 (Consistency). Do not stop. You need to know if this was a one-off or a trait.
  *   **If NO:** **Disposition Not Manifested.**
      *   **Action:** Go to Phase 3. You need to know if it's Absent or Masked/Finkish.

  ---

  ### Phase 3: The Consistency Check (Rule Out Finkishness & Accident)
  *This is where you distinguish a trait from a state.*

  **Step 3.1: The Re-Test (For Aggression Only)**
  *   **Condition:** Only if the dog showed aggression in Phase 2.
  *   **Action:** Wait 5 minutes. Reset the dog. Run the *same* stimulus again, but lower the intensity (e.g., if you reached for the bowl, just walk near it).
  *   **Question:** Does the aggression happen again?
  *   **If YES:** **Consistent.** This is likely a genuine disposition.
      *   **Action:** Mark "Disposition Present." Escalate to Director for Risk Assessment.
  *   **If NO:** **Inconsistent.**
      *   **Action:** Mark "Single Episode."
      *   **Escalate:** Refer to Staff Behaviourist. This could be a "Mimic" (startle reflex) or a "Fink" (the dog learned instantly not to trust you). A volunteer cannot clear this dog.

  **Step 3.2: The "Too Perfect" Check (For Non-Aggression Only)**
  *   **Condition:** Only if the dog showed *no* aggression in Phase 2.
  *   **Action:** Compare Phase 1 Baseline to Phase 2 Performance.
  *   **Question:** Was the dog highly stressed in Phase 1 (Frozen/Shut Down) but perfectly calm during the stimuli in Phase 2?
  *   **If YES:** **Suspect Masking.**
      *   **Logic:** The dog did not relax; it dissociated. The aggression is likely present but masked by fear.
      *   **Action:** Mark "Disposition Unassessable (Masked)."
      *   **Escalate:** Refer to Staff Behaviourist. Do not clear for adoption.
  *   **If NO:** (Dog was relaxed in Phase 1 and remained relaxed in Phase 2).
      *   **Action:** Mark "Disposition Absent (Provisional)."
      *   **Note:** This is the only scenario where a volunteer can suggest a "Clear" score.

  ---

  ### Phase 4: The Risk Call (The Non-Dispositional Step)
  *This is not a test of the dog. This is a test of policy.*

  **Step 4.1: The Handoff**
  *   **Action:** Submit the form.
  *   **Rule:** Volunteers **never** make the final "Adopt/Euthanize" decision. You assess the *Disposition*; the Director assesses the *Risk*.
  *   **Why:** "Is this dog dangerous?" is a dispositional question. "Is this level of danger acceptable for our shelter?" is a political and ethical question. You cannot answer the second one.

  **Step 4.2: The Form Fields**
  *   Replace "Aggressive: Yes/No" with:
      1.  **Medical Clear?** (Yes/No/Hold)
      2.  **Baseline Stress?** (Low/High/Shutdown)
      3.  **Manifestation?** (Yes/No)
      4.  **Consistency?** (Consistent/Single Episode/Not Applicable)
      5.  **Final Volunteer Recommendation:** (Clear / Refer to Behaviourist / Medical Hold).

  ---

  ### Where This Procedure Will Misfire (Honesty Clause)

  1.  **The "Fink" Problem:** True finkishness (where the disposition vanishes *because* you tested it) is indistinguishable from learning. If a dog decides *during* the test that you are not a threat, it may pass. This protocol catches this only if the Baseline Stress was low. If the dog was relaxed and passed, but bites later, we missed it. There is no test a volunteer can run in 45 minutes to fix this. **Accept this error rate.**
  2.  **The Judgment Call:** Step 1.2 (Stress Baseline) is subjective. "Shut down" looks like "calm" to an untrained eye. This is the weakest link. **Mitigation:** If two volunteers disagree on stress levels, the dog automatically goes to the Staff Behaviourist.
  3.  **The Risk Question:** This procedure cannot tell you if a dog is "safe enough." It can only tell you if the aggression is a *trait* or a *state*. A dog with a genuine disposition to guard food might still be adoptable to a knowledgeable home. That decision belongs to the Director, not the form.
  4.  **The "One Bite" Rule:** Step 3.1 asks you to re-test a dog that just bit. This carries risk. **Safety Override:** If the bite broke skin or was unprovoked, **do not re-test.** Mark "Consistent" by default and escalate. Only re-test mild warnings (growls/air snaps).

  ---

  ### Case Studies: Running the Procedure

  #### Case 1: The "Guarding" Dog (Suspected Masking)
  *   **Scenario:** You assessed a dog last month. It growled when you reached for the bowl. You scored it "Resource Guarding." You now suspect it was just stressed (Masking).
  *   **Procedure Run:**
      *   **Phase 1.1 (Medical):** No limp, no vet notes. (Pass)
      *   **Phase 1.2 (Baseline):** Dog is trembling, panting heavily, refuses treats before you even approach the bowl. **(Flag: High Stress)**.
      *   **Phase 2 (Stimulus):** You reach. Dog growls. **(Manifestation: Yes)**.
      *   **Phase 3 (Consistency):** You wait 5 minutes. Dog is still trembling. You walk near bowl. Dog growls again. **(Consistent: Yes)**.
  *   **Analysis:** Under the old sheet, this is "Aggressive." Under DAP, this is **"Disposition Present, Compounded by High Stress."**
  *   **Correction on your suspicion:** You suspected *Masking*. Philosophically, if the growl happened, the disposition was not masked; it manifested. However, the *intensity* may be inflated by the stress state. The procedure confirms the trait is there, but the Baseline Stress flag tells the Director: "This dog is not safe in a high-stress environment, but might settle in a home."
  *   **Outcome:** Refer to Behaviourist. Do not euthanize based on volunteer sheet alone. The stress flag saves the dog from being labeled "Hopelessly Aggressive."

  #### Case 2: The "Perfect" Dog (Suspected Finkishness)
  *   **Scenario:** A dog comes in. It wags its tail, takes treats, lets you handle the bowl, lets you take the toy. Score: Perfect. You feel uneasy. You think it's "finking" you (suppressing the trait because of the assessment context).
  *   **Procedure Run:**
      *   **Phase 1.1 (Medical):** Clear.
      *   **Phase 1.2 (Baseline):** Dog is loose, wiggly, eyes soft. **(Low Stress)**.
      *   **Phase 2 (Stimulus):** No growls, no snaps. **(Manifestation: No)**.
      *   **Phase 3.2 (Too Perfect Check):** Baseline was Low Stress. Performance was Relaxed.
  *   **Analysis:** The procedure forces you to mark **"Disposition Absent (Provisional)."**
  *   **The Hard Truth:** You cannot flag this as Finkish. A relaxed dog that passes the test *is* a safe dog until proven otherwise. If you flag it as suspicious without evidence (high stress or history), you are assessing based on "vibe," which the form must not allow.
  *   **Outcome:** The dog goes to the adoption floor.
  *   **Why this is right:** If you block every dog that "feels" off but tests clean, you will never move dogs. The DAP protects you from your own anxiety. If the dog bites later, it was a true fink (context-dependent trait), and the procedure admits it cannot catch that. **Write "Provisional" on the form.** This tells the adopter: "We tested him, he passed, but monitor him."

  #### Case 3: The Unpleasant Truth (Your Favorite)
  *   **Scenario:** A dog you love. You've walked him for weeks. He's sweet with you. Today, during the toy test, he snaps at the decoy dog. Hard. No skin broken, but a clear warning.
  *   **Procedure Run:**
      *   **Phase 1.1 (Medical):** Clear.
      *   **Phase 1.2 (Baseline):** Dog was happy, wagging, ready to play. **(Low Stress)**.
      *   **Phase 2 (Stimulus):** Snap occurred. **(Manifestation: Yes)**.
      *   **Phase 3.1 (Re-Test):** You reset. You bring the decoy back at a distance. Dog stiffens, low growl. **(Consistent: Yes)**.
  *   **Analysis:** The procedure forces the mark: **"Disposition Present (Consistent)."**
  *   **The Conflict:** You want to write "He was just excited." The procedure forbids it. Low Stress + Consistent Reaction = Trait.
  *   **Outcome:** Refer to Director. You cannot recommend for adoption.
  *   **Why this matters:** This is the value of the DAP. It prevents you from lying for a dog you love. The "Low Stress" baseline proves he wasn't lashing out from fear; he was asserting a boundary. The Director now has to decide if "Dog-Dog Aggression" is a euthanasia offense or a "No Other Dogs" adoption. That is their call. Your job was to tell the truth about the disposition. **You write "Disposition Present."** You do not write "Euthanize."

  ### Final Note on Compression
  You asked what distinctions survive the form.
  *   **Survive:** Medical vs. Behavioral (Mimicry). High Stress vs. Low Stress (Masking). Consistent vs. Single Event (Trait vs. State).
  *   **Drop:** The difference between "Finkish" and "Masked" in a relaxed dog. If the dog is relaxed and passes, we treat it as Absent. If the dog is stressed and passes, we treat it as Masked. We do not have the tools to dig deeper without turning volunteers into ethologists.
  *   **The "Vibe" Step:** Step 1.2 (Baseline Stress) is the only place where "vibe" enters. It is unavoidable. But by making it a explicit "Stop/Go" gate, we force the volunteer to articulate *why* they feel the vibe (trembling, freezing) rather than just "I have a bad feeling."

  This procedure will not stop all mistakes. It will not find every fink. But it will stop you from putting a hurting dog down for aggression, and it will stop you from sending a terrified dog home with a family. That is enough.
