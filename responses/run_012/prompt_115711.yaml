answer: |-
  First off, take a breath. You have stumbled into one of the classic late-night philosophy spirals. It is a rite of passage to lose sleep over Kripke. Your flatmate's "Vulcan" objection is not a cheap trick; it is a genuine, hard problem in the philosophy of language (the problem of empty names), but it actually helps clarify the main issue you're worried about: **the relationship between our words, the world, and scientific authority.**

  Here is the breakdown of what actually follows from the Rigid Designator + Necessary A Posteriori picture when science threatens to overturn an identity claim like "Water is H2O."

  ### 1. The Flatmate's Point: Reference vs. Belief
  Your flatmate is right that the "Vulcan" case (a planet posited to exist between Mercury and the Sun, which turned out to be nothing) shows that **reference is external to our beliefs.**

  *   **The Trap:** If meaning were just "the description in our heads" (Descriptivism), then "Vulcan" would mean "the planet causing Mercury's perturbations." Since nothing caused them (it was actually general relativity), the term would be meaningless or refer to nothing.
  *   **The Rigid View:** Kripke agrees "Vulcan" refers to nothing. But he insists this is because there was no *object* to attach the name to in the first place. The "meaning" your flatmate is talking about is *cognitive significance* (we understand the sentence), not *semantic reference* (there is no object).
  *   **The Implication:** This establishes that **we can be completely wrong about the properties of a thing without changing what thing we are talking about.** We can think Vulcan causes perturbations, but if it existed, it would be *that object*, regardless of the perturbation theory.

  This sets the stage for your Water question. It implies that what "water" refers to is determined by the **actual stuff in the world**, not by our **beliefs about the stuff.**

  ### 2. The Scenario: Science Says "Water Isn't H2O"
  Let's say in 2050, physicists discover that H2O is not a fundamental natural kind, but a loose cluster of quantum fields, or that the stuff in our oceans is actually a mixture where H2O is incidental. They announce: "Water is not H2O."

  Here are the three real implications of the Kripkean picture for this scenario.

  #### Implication A: Necessity is Metaphysical, Not Epistemic
  This is the most important distinction.
  *   **The Picture:** "Water is H2O" is a *necessary truth* **if and only if** it is true.
  *   **The Reality:** We do not have a magic meter that tells us a truth is necessary. We infer necessity from identity.
  *   **What Follows:** If science overturns the identity, the statement loses its necessity. It doesn't mean "Necessary truths can change." It means **we were wrong to classify it as a necessary truth.**
  *   **Authority of Science:** Science has absolute authority over the *truth value* of the identity. Philosophy (semantics) only dictates the *modal status* (necessity) **conditional on that truth.**
      *   *If* Water = H2O, *then* it is necessarily so.
      *   *If* Science says Water ≠ H2O, *then* it was never necessary.
      *   **Takeaway:** Do not treat "Water is H2O" as a shield against scientific revision. Treat it as a claim that *would be* unshakeable *if* it holds up. It is a bet on the stability of the scientific reduction, not a logical guarantee.

  #### Implication B: Reference Fixing vs. Giving the Meaning
  Kripke distinguishes between **fixing the reference** and **giving the meaning**.
  *   **Fixing Reference:** We pointed at the oceans and said, "Whatever *this* stuff is, that's 'water'." We used the description "clear, drinkable liquid" to *find* the stuff, not to *define* the word.
  *   **Giving Meaning:** The meaning is just "that stuff."
  *   **What Follows:** If science says "That stuff isn't H2O," we don't say "Well, then this isn't water." We say, "Okay, water is [New Chemical Essence]."
  *   **Authority of Science:** Science has authority over the **essence** (the right side of the equation). Semantics dictates that there *is* an essence (the left side).
      *   If chemists change the essence, the word "water" sticks to the *new* essence because the word is anchored to the *stuff*, not the *formula*.
      *   **Takeaway:** You should give future science authority to redefine the *composition* of water without fearing that the word "water" will become meaningless. The term is robust because it is anchored to the physical reality, not the current theory.

  #### Implication C: The Risk of Eliminativism (When the Picture Breaks)
  This is where the "picture does the talking" vs. "reality" distinction matters most.
  *   **The Picture:** Assumes that for every natural kind term (like "water"), there *is* a underlying micro-structure that is the essence.
  *   **The Reality:** What if science says, "There is no unified micro-structure. 'Water' is just a functional category for a messy mix of molecules that varies by context"?
  *   **What Follows:** If there is no single underlying essence, **rigid designation fails.** "Water" would cease to be a natural kind term and become a functional/descriptive term (like "jade," which is two different minerals, or "weed," which is just any unwanted plant).
  *   **Authority of Science:** Science has the authority to **destroy the metaphysical status of the term.** If science determines there is no natural kind there, then "Water is H2O" wasn't a necessary truth *or* a contingent truth. It was a category error.
      *   **Takeaway:** The rigid designator picture relies on the world being "carved at the joints." If future science says the world is messy and doesn't have joints there, the philosophical picture collapses for that term. You must grant science the authority to tell you whether "water" is even the *kind* of word that can be a rigid designator.

  ### Summary: How much authority to give future science?

  1.  **On Truth:** Total authority. If they say Water ≠ H2O, then Water ≠ H2O. The "necessary" label drops off immediately.
  2.  **On Reference:** Total authority. If they say the stuff we drink is actually a quantum field configuration, then "water" refers to that configuration. We were just ignorant of the essence.
  3.  **On Modality (Necessity):** Conditional authority. Science tells us *what* is the case; the rigid designator picture tells us *how* that fact behaves across possible worlds. But science can veto the modality by showing there is no identity to begin with.

  ### What's Real vs. What's "The Picture Talking"

  *   **Real:** Our scientific identity claims are fallible. We treat them as necessary because we think we've found the essence, but we could be wrong about the essence. The "Necessary A Posteriori" is a status we confer on successful reductions, not a property we can detect prior to verification.
  *   **Picture Talking:** The idea that "Water is H2O" has a special metaphysical lock on it that protects it from revision. It doesn't. The lock only engages *after* the truth is confirmed.
  *   **Real:** The distinction between *fixing reference* (pointing at the liquid) and *stating the essence* (H2O). This allows language to survive scientific revolutions. We keep using "water" even if the chemistry changes.
  *   **Picture Talking:** The assumption that *every* term must have a rigid essence. If science decides "water" is a functional concept with no single essence, the Kripkean model simply doesn't apply to that word anymore.

  **The Verdict:** Your flatmate's Vulcan point highlights that we can talk meaningfully about things that don't exist or properties we get wrong. Apply that to Water: We can talk meaningfully about water even if we get the chemistry wrong. But if the chemistry changes, the "necessary truth" claim was just a placeholder for "the best theory we have."

  Give future science the authority to change the **essence**, and accept that if they do, the **necessity** evaporates. The rigid designator picture explains how language *tracks* reality, but it doesn't guarantee that our current map of reality is correct.

  Now, try to sleep. The possible worlds will still be there in the morning.
