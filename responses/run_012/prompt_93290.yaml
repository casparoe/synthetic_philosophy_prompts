answer: |-
  # The Population Ethics Decision Tree

  This instrument is designed to map your intuitions onto established philosophical positions. It does not tell you which view is correct; it tells you which view you already hold based on your answers to concrete cases.

  There are **10 Decision Nodes**. Follow the path that matches your judgment.

  ### Node 1: The Value of Existence
  **Case:** A child is born into a life that is happy and worth living.
  *   **Branch A:** This is good *for the child*. (Existence can benefit the existent.) → **Go to Node 2**
  *   **Branch B:** This is good *for the world*, but neutral for the child (since they didn't exist to be harmed/benefited). (Impersonal Value.) → **Go to Node 2**
  *   **Branch C:** This is only meaningful if it affects people who *already* exist. (Person-Affecting Restriction.) → **Go to Node 5**

  ### Node 2: The Aggregation Method
  **Case:** Compare World X (1 billion people, very happy) vs. World Y (10 billion people, moderately happy).
  *   **Branch A:** World Y is better if the *total sum* of happiness is higher. (Totalism.) → **Go to Node 3**
  *   **Branch B:** World X is better if the *average happiness* per person is higher. (Averagism.) → **Go to Node 4**

  ### Node 3: The "Barely Worth Living" Test
  **Case:** Compare a small world of ecstatic people vs. a massive world of people whose lives are barely worth living (but still positive).
  *   **Branch A:** The massive world is better because the total happiness is greater. → **Leaf: Total Utilitarianism**
  *   **Branch B:** The massive world is worse; quality matters more than quantity. → **Go to Node 4**

  ### Node 4: The Critical Threshold
  **Case:** Can adding a person with a "good" life make the world worse?
  *   **Branch A:** Yes, if their happiness is below the current average (or a set "critical level"). → **Leaf: Critical-Level Utilitarianism**
  *   **Branch B:** No, adding a good life never makes things worse, even if it lowers the average. → **Leaf: Variable Value View**

  ### Node 5: The Resource Trade-Off
  **Case:** A couple can have a third happy child, but the two existing children will have slightly fewer resources/attention.
  *   **Branch A:** This is permissible; the new life's value outweighs the slight loss to existing children. → **Go to Node 6**
  *   **Branch B:** This is impermissible; existing people's interests trump creating new people. → **Leaf: Prior Existence View**

  ### Node 6: The Mechanism of Growth
  **Case:** A country needs 10% more population. Options: Subsidize births, admit immigrants, or extend healthy lifespans. All produce equal happy lives.
  *   **Branch A:** These are morally identical; only the number of good lives matters. → **Go to Node 7**
  *   **Branch B:** These are different; births create new souls, immigration moves existing ones, longevity extends current ones. → **Leaf: Non-Substitution View**

  ### Node 7: The Agent and Scope
  **Case:** Who is deciding? A couple in their home, or a State making policy?
  *   **Branch A:** The moral rule is the same for both. → **Go to Node 8**
  *   **Branch B:** Families have special rights/privileges that States do not. → **Leaf: Liberal Parentalism**

  ### Node 8: The Cost Distribution
  **Case:** A policy pays people to have children. Costs fall on parents (body/time); benefits (tax base/culture) spread to everyone.
  *   **Branch A:** This is fair; society benefits, so society should subsidize the cost. → **Leaf: Pro-Natalist Egalitarianism**
  *   **Branch B:** This is exploitative; reproductive costs should not be socialized for demographic goals. → **Leaf: Reproductive Libertarianism**

  ### Node 9: The Negative Weight (Alternative Path from Node 2)
  **Case:** Is preventing suffering more important than creating happiness?
  *   **Branch A:** Yes; we should minimize misery, not maximize joy. → **Leaf: Negative Utilitarianism**
  *   **Branch B:** No; happiness and suffering count equally. → **Return to Node 2**

  ### Node 10: The Obligation Strength
  **Case:** If having a child creates a net good, are you *required* to do it?
  *   **Branch A:** Yes, it is a moral duty. → **Leaf: Positive Duty Pro-Natalism**
  *   **Branch B:** No, it is optional (supererogatory). → **Leaf: Permissive Pro-Natalism**

  ---

  ## The Leaves: Positions and Awkward Commitments

  1.  **Total Utilitarianism:** Maximize the total sum of happiness.
      *   *Awkward Commitment:* You must accept the "Repugnant Conclusion" (a world of billions with barely worth-living lives is better than a small, blissful one).
  2.  **Critical-Level Utilitarianism:** Maximize total happiness, but only count lives above a certain quality threshold.
      *   *Awkward Commitment:* Adding a person with a wonderful life can make the world *worse* if they fall slightly below the "critical" average.
  3.  **Average Utilitarianism:** Maximize the average happiness per person.
      *   *Awkward Commitment:* It implies it would be better to eliminate unhappy people than to make them happy (the "Sadist Conclusion").
  4.  **Variable Value View:** Total value matters, but the weight of each life diminishes as population grows.
      *   *Awkward Commitment:* There is no clear mathematical formula for when a life stops counting as much; it feels arbitrary.
  5.  **Prior Existence View:** Only consider the interests of people who already exist or will exist independently of the choice.
      *   *Awkward Commitment:* You cannot say it is "better" for a child to be born, only that it is not worse; it struggles to justify having children at all.
  6.  **Non-Substitution View:** Births, immigration, and longevity are morally distinct categories.
      *   *Awkward Commitment:* You might have to oppose immigration even if it creates more total happiness than breeding citizens, based on "identity" grounds.
  7.  **Liberal Parentalism:** Families have rights to reproduce that States do not have to mandate.
      *   *Awkward Commitment:* You cannot consistently advocate for population targets; you can only hope individuals align with them.
  8.  **Pro-Natalist Egalitarianism:** Reproduction is a public good that should be publicly funded.
      *   *Awkward Commitment:* The state has a legitimate interest in the contents of the family unit and reproductive choices.
  9.  **Reproductive Libertarianism:** Reproduction is a private cost and right; state intervention is suspect.
      *   *Awkward Commitment:* Society may face demographic collapse, but the state is forbidden from incentivizing growth to prevent it.
  10. **Negative Utilitarianism:** Minimize suffering above all else.
      *   *Awkward Commitment:* It may imply that human extinction is good if it guarantees no future suffering.
  11. **Positive Duty Pro-Natalism:** If you can create a happy life, you ought to.
      *   *Awkward Commitment:* Childfree couples are acting immorally, similar to refusing to save a drowning child.
  12. **Permissive Pro-Natalism:** Creating life is good, but not required.
      *   *Awkward Commitment:* It offers no guidance on *how many* children to have; any number from zero to infinity is theoretically permissible.

  ---

  ## Logical Space Analysis

  ### Unoccupied or Incoherent Combinations
  *   **Person-Affecting + Total Utilitarianism:** (Incoherent). You cannot claim value only exists for specific people *and* that we should maximize a total sum that includes people who don't exist yet. This space is empty because the definitions contradict.
  *   **Average Utilitarianism + Positive Duty Pro-Natalism:** (Unattractive/Unexplored). If you maximize averages, you usually want *fewer* people to keep the average high. Defending a duty to have more children while holding an Averagist view is logically unstable and rarely defended.
  *   **Non-Substitution + Total Utilitarianism:** (Tense). If you care only about total happiness, the *method* (birth vs. immigration) shouldn't matter. Defending both requires a complex theory of "identity value" that most totalists reject.

  ### Indistinguishable Positions
  *   **Critical-Level Utilitarianism vs. Total Utilitarianism:** In normal, non-extreme cases (where lives are well above the "barely worth living" threshold), these two views give the exact same advice. The tree only separates them at Node 3 (The Repugnant Conclusion).
  *   **Liberal Parentalism vs. Reproductive Libertarianism:** In practice, these often look the same (state stays out of bedrooms). They only diverge if the State tries to *subsidize* rather than *mandate*. The tree separates them at Node 8 (Cost Distribution).

  ---

  ## Settled vs. Contested

  **What is Settled (Among Experts):**
  *   **The Non-Identity Problem:** It is logically settled that actions today change *who* is born in the future. Therefore, you cannot claim a policy is "bad for future people" if those people would not have existed without the policy. All positions must account for this.
  *   **The Repugnant Conclusion:** It is settled that *Total Utilitarianism* logically leads to the conclusion that a massive population of barely-livable lives is better than a small, blissful one. The debate is not whether Totalism implies this, but whether we should accept the implication or reject Totalism.
  *   **Person-Affecting Limitations:** It is settled that strict "Person-Affecting Views" (only harm/benefit existing people) struggle to explain why it is wrong to cause a child to be born with a severe genetic disease (since the alternative was non-existence, not a healthy existence).

  **What is Genuinely Contested:**
  *   **The Intuition vs. The Math:** There is no consensus on whether we should trust our intuition (that the Repugnant Conclusion is false) or our math (that Total Utilitarianism is consistent).
  *   **Impersonal Value:** There is no agreement on whether "the world" can be better off in a way that is not good *for anyone*. Some find this metaphysically spooky; others find it necessary.
  *   **Obligation Strength:** There is no consensus on whether creating a happy life is a duty, a permission, or morally neutral.
  *   **Substitution:** It is contested whether extending the lives of the elderly is a moral substitute for birthing the young, even if the "happy life years" are identical.

  **Note on Consensus:** Do not treat any leaf in this tree as the "standard" view. Population ethics is characterized by the fact that every major position has counter-intuitive consequences. The field is defined by choosing which awkward commitment you are willing to accept, not by finding a view with none.
