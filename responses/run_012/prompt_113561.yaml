answer: |-
  Here is the specification for a theory of promissory obligation. This is not a summary of existing theories, but a list of the functional requirements any successful account must satisfy to match our intuitions and logical constraints.

  ### The Desiderata (Requirements)

  **1. The Normative Shift**
  *   **The Requirement:** The theory must explain how a specific kind of "ought" comes into existence that did not exist before. Before the promise, the act was optional; after the promise, it is obligatory.
  *   **Motivating Intuition:** If promising doesn't change what you are required to do, it's just a prediction or a hope.
  *   **Status:** **Non-negotiable.**

  **2. The Volitional Source**
  *   **The Requirement:** The obligation must originate from the promisor's choice. It cannot be imposed entirely by external facts (like the promisee's needs) without the promisor's consent.
  *   **Motivating Intuition:** If I am forced to help you, that is charity or duty, not a promise. A promise is something I *do*, not something that happens to me.
  *   **Status:** **Non-negotiable** (for a theory of *promising*, though some utilitarian theories reject this).

  **3. The Anti-Bootstrapping Constraint**
  *   **The Requirement:** The theory cannot allow the promisor to create a binding reason out of thin air. The mere utterance "I promise" cannot be the *sole* source of the obligation without a prior normative framework that gives those words power.
  *   **Motivating Intuition:** You cannot lift yourself up by your own shoelaces. If I could create obligations whenever I wanted, morality would be subject to my whim. There must be a background reason why "I promise" binds me.
  *   **Status:** **Non-negotiable** (Logically required to avoid magic).

  **4. The Particularity Constraint**
  *   **The Requirement:** The obligation must be owed *to the promisee*, not just a general duty to perform the act. The promisee must have the special standing to release the promisor or complain of a wrong.
  *   **Motivating Intuition:** If I promise *you* to stop smoking, and I don't, I wrong *you*. If I just have a duty to stop smoking for health reasons, I wrong myself or no one.
  *   **Status:** **Non-negotiable.**

  **5. The Invalidity Conditions (Duress & Immorality)**
  *   **The Requirement:** The theory must explain why some promises do not bind. Specifically: promises made at gunpoint (duress) and promises to commit crimes (immorality).
  *   **Motivating Intuition:** "I promise to kill him" creates no obligation to kill. "I promise to pay you" (said while you hold a knife to my throat) creates no obligation to pay.
  *   **Status:** **Non-negotiable.**

  **6. The Convention Independence (The "First Promise" Case)**
  *   **The Requirement:** The theory must explain how a promise can bind even if there is no pre-existing social practice or convention of promising.
  *   **Motivating Case:** Two people meet on a desert island with no language or history. One says, "I will bring wood if you bring water." If this doesn't bind, promising is just a social game, not a moral mechanism.
  *   **Status:** **Contestable.** (Convention theorists argue promising *is* a social artifact like money; without the practice, the act is meaningless).

  **7. The Epistemic Independence (The "Secret Promise" Case)**
  *   **The Requirement:** The theory must account for promises where the promisee never knows the promise was made.
  *   **Motivating Case:** A promise to a dead person, a sleeping person, or a secret vow to protect someone who never finds out. If obligation relies on the promisee's *reliance* or *expectation*, these promises shouldn't bind. But intuition says they often do.
  *   **Status:** **Contestable.** (Reliance theorists argue these aren't genuine promises, or the obligation is different).

  ---

  ### Classification: Hard Constraints vs. Hobbyhorses

  **Non-Negotiable (The Hard Constraints)**
  If a theory violates these, it ceases to be a theory of *promissory obligation* and becomes a theory of something else (like coercion, general morality, or prediction).
  *   Normative Shift
  *   Volitional Source
  *   Anti-Bootstrapping
  *   Particularity
  *   Invalidity Conditions

  **Contestable (The Hobbyhorses)**
  These depend on which philosophical camp you belong to. A theory can fail these and still be coherent, but it will alienate one side of the debate.
  *   **Convention Independence:** Rejection of this leads to "Practice Theories" (Rawls, Searle). Acceptance leads to "Will Theories."
  *   **Epistemic Independence:** Rejection of this leads to "Reliance Theories" (Shiffrin, Scallen). Acceptance leads to "Autonomy Theories."

  ---

  ### The Single Most Constraining Requirement

  **The Anti-Bootstrapping Constraint.**

  This is the filter that kills the most contenders.
  *   It kills **Pure Will Theories**: If the will alone creates the obligation, it looks like bootstrapping (magic).
  *   It kills **Pure Expectation Theories**: If the obligation comes *only* from the promisee's reliance, the promisor's will is irrelevant (violating Volitional Source).
  *   It kills **Simple Convention Theories**: If the obligation comes *only* from the social rule, why am I bound if I didn't intend to invoke the rule?

  To satisfy Anti-Bootstrapping, you must posit a background moral norm (e.g., "do not disappoint expectations" or "respect autonomy"). But once you posit that background norm, you risk making the actual promise redundant. The theory must walk the tightrope where the promise matters, but isn't magic.

  ---

  ### The Incompatible Pair

  You asked to flag any pair of requirements that cannot be met together. This is the critical section.

  **The Pair:** **Convention Independence** + **Anti-Bootstrapping**.

  **The Conflict:**
  1.  **Anti-Bootstrapping** says you cannot create an obligation out of nothing; you need a pre-existing normative framework to give your words power.
  2.  **Convention Independence** says the obligation must hold even without a pre-existing social practice (the "First Promise").

  **The Result:**
  If there is no social practice (Convention Independence), and you cannot create obligations by fiat (Anti-Bootstrapping), **where does the normative force come from?**

  *   If you say "It comes from the nature of rational agency," you are positing a metaphysical fact about humans that many find dubious (the "Normative Power" move).
  *   If you say "It comes from the harm of disappointment," you collapse into Reliance Theory, which fails the "Secret Promise" case.
  *   If you say "It comes from the practice," you fail Convention Independence.

  **Verdict on Will vs. Bootstrap:**
  You asked: *Can a theory have the obligation created by the promisor's own act of will and still not be a bootstrap?*

  **Plain Answer:** **No, not without a controversial metaphysical cost.**
  To hold both, you must accept that human beings possess a "Normative Power"—a brute capacity to change moral reality by willing it, akin to a miniature god. If you reject that metaphysics as "spooky," then **Volitional Source** and **Anti-Bootstrapping** are incompatible. One must give: either the will doesn't create the obligation (it just triggers a background duty), or the obligation is bootstrapped (the will creates it ex nihilo).

  Most successful modern theories (like Raz or Owens) try to solve this by saying the will *invokes* a background duty of fidelity. But this risks making the promise itself redundant. If the pair really can't be satisfied, then **the list itself is the result**: there is no unified theory, only a trade-off between the magic of the will and the security of background norms.

  ---

  ### Confidence and Weakest Link

  **Confidence Level:** **70%**
  This is not physics. The "data" here are intuitions, and intuitions vary by culture and individual. However, this list captures the structural problems that have stalled the debate for 300 years (from Hume to today).

  **The Weakest Link (Most Likely to be Pushed Back On):**
  **Convention Independence.**

  **Why:** This is the requirement I am least sure of. A very strong argument exists that promising is *essentially* a social institution, like marriage or money. You cannot have "the first promise" any more than you can have "the first dollar" without an economy. If you accept this, you drop Requirement 6, and the tension between Will and Bootstrap eases significantly (because the "background norm" is just the social practice).

  If you are writing something on promising, your most productive move may be to attack **Convention Independence**. If you can argue that promising *requires* a practice, you dissolve the "First Promise" problem and make the "Anti-Bootstrap" requirement much easier to satisfy. If you insist on Convention Independence, you are signing up for the hardest version of the problem.
