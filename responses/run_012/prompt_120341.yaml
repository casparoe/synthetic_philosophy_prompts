answer: |-
  Here is the breakdown you need for your next dinner with your friend. The goal is to move past the caricature that Peirce is about the "future" and James is about the "present." That distinction is real, but it's a symptom, not the disease. The real disagreement is about what truth *is* and whether reality pushes back.

  ### 1. The Core Distinction: Definition vs. Criterion

  To argue this effectively, you need to categorize what each man is actually doing. They are playing different games.

  **Peirce: A Definition of Truth (Realist)**
  Peirce is offering a definition of what the word "truth" means. For him, truth is a specific relationship between a sign (a belief) and an object (reality).
  *   **The Theory:** Truth is the opinion that the community of investigators is *fated* to agree upon after exhausting all evidence and argument.
  *   **The Point:** Truth is *independent* of what you or I think right now. It is an external anchor. Even if every human being believes the earth is flat, the truth is what we would find if we investigated forever.
  *   **The Function:** This is a semantic and ontological claim. It tells us what truth *is*. It does not necessarily tell you how to find it today, only that it exists as a limit of inquiry.
  *   **Why "Pragmaticism"?** Peirce renamed his view "pragmaticism" (a word he called "ugly enough to be safe from kidnappers") specifically to distance himself from James. He felt James had hijacked his method and turned it into something soft and subjective.

  **James: A Criterion of Truth (Humanist/Instrumentalist)**
  James is offering a criterion for recognizing truth and a justification for holding beliefs.
  *   **The Theory:** Truth is not a static property; it *happens* to an idea. An idea becomes true if it verifies itself, if it guides us successfully through experience, if it "pays."
  *   **The Point:** Truth is made in the process of living. There is no "view from nowhere." Truth is the "cash value" of an idea in terms of its practical consequences for the believer.
  *   **The Function:** This is epistemological and psychological. It tells you when you are *allowed* to call a belief true.
  *   **Truth vs. Acceptability:** This is the crucial pivot. For Peirce, truth and acceptability are distinct. You can accept a false belief (temporarily), and a true belief might be unacceptable (painful). For James, this distinction collapses. If a belief is acceptable (expedient, life-enhancing, verifiable in experience), it *is* true.

  **Is James's Difference Substantive?**
  It is entirely substantive, not terminological. If James is right, truth is pluralistic. A belief can be true for you (because it saves your life) and false for me (because it doesn't fit my experience). Peirce insists truth is singular and convergent. If James is right, truth is a tool. If Peirce is right, truth is a destination.

  ### 2. The Stress-Test: Self-Fulfilling Beliefs

  Now, apply this to the case your friend couldn't crack: The student who believes, "I am the sort of person who finishes what she starts."

  This is a self-fulfilling prophecy. The belief helps cause the behavior that makes the belief accurate. The comfort and utility of the belief are part of why it is held.

  **How James Handles It**
  James handles this case effortlessly. In fact, this is his home turf.
  *   **The Analysis:** For James, the truth of the statement "I am a finisher" is found in its consequences. If holding this belief gives the student the confidence to complete tasks, and she consequently completes tasks, the belief has "worked." It has guided her through experience successfully.
  *   **The Verdict:** The belief is **true**. It became true *because* she believed it. The utility (finishing the work) constitutes the truth. James explicitly argues in *The Will to Believe* that in certain cases (live, forced, momentous options), we have the right to believe ahead of the evidence if the belief helps create the fact.
  *   **The Strength:** It captures the agency of the believer. It explains why the belief is rational to hold even without prior evidence.

  **How Peirce Handles It**
  Peirce struggles here, and the strain reveals his commitment to realism.
  *   **The Analysis:** Peirce asks: Is this belief fated to be agreed upon by all investigators? Or is it just a trick of the mind? He distinguishes between the *method of tenacity* (believing something because it makes you feel good) and the *method of science* (believing something because external reality forces it upon you).
  *   **The Verdict:** Peirce would say the belief is **hypothetical**. It is not yet "true" in the strict sense until it withstands the friction of external reality. If the student believes she is a finisher, but then faces a task that breaks her regardless of her belief, the "truth" of her character is exposed as false.
  *   **The Problem:** Peirce requires reality to be *independent* of the belief. But in this case, the belief *constructs* the reality. Peirce would worry that this is circular. He would insist that the truth lies not in the belief itself, but in the *habit of action* it produces. If the habit holds up under public scrutiny over time, it converges toward truth. If it's just self-deception that cracks under pressure, it was never true.
  *   **The Strength:** It protects against delusion. Just because a belief feels good and works temporarily doesn't mean it aligns with the way the world is structured.

  ### 3. The Scorecard: Who Wins and What They Lose

  **Which account handles the case better?**
  **James wins this specific round.** The case of self-fulfilling character traits is exactly the kind of "human truth" James's system was built to accommodate. Peirce's system is built for hard science and public facts; it treats the internal, creative power of belief with suspicion. To a lawyer, think of it this way: James treats the belief as a **settlement** that resolves the case successfully. Peirce treats it as a **verdict** that must match the evidence regardless of the settlement's utility.

  **What James has to give up:**
  To accommodate this, James sacrifices **objective constraint**. If truth is what works, then two contradictory self-fulfilling beliefs could both be "true" for different people. (e.g., An athlete believes "I win by being aggressive," another believes "I win by being calm." Both work. Both are true.) This makes truth local and fragile. It risks turning truth into mere successful coping.

  **What Peirce has to give up:**
  To accommodate this, Peirce has to soften his **realism**. He has to admit that some facts (like character traits) are not "out there" waiting to be found, but are generated by the inquiry itself. He has to admit that the "ideal end of inquiry" might look different depending on the habits formed by the inquirers. If he doesn't give this up, he has to call the student's belief "false" until she dies having finished everything, which seems absurd.

  ### 4. The Closing Argument for Your Friend

  Here is how you put this to the litigator:

  "Look, the difference isn't about time. It's about **constraint**.

  Peirce thinks truth is a **wall**. You can run into it, you can't move it, and eventually, we will all map it the same way. He cares about what happens when we can't ignore reality anymore.

  James thinks truth is a **key**. It's true if it opens the door. If believing you're honest makes you act honestly, James says the key worked, so it's a true key. Peirce says, 'Wait, let's check if the door was actually locked or if you just walked through an open frame.'

  In the case of your own character, James is right: believing you're a finisher makes you a finisher. That belief creates the fact. But Peirce would warn you: that only works until reality hits you hard enough to break the belief. Peirce wants a truth that survives the crash. James wants a truth that helps you drive.

  Peirce renamed his view because he thought James sold out the wall for the key. He thought James made truth too easy, too dependent on how we feel. James thought Peirce made truth too distant, too useless for living.

  So, when you ask if a belief is true because it does good: James says **yes**, that's what truth *is*. Peirce says **no**, that's just what makes the belief *useful*. Truth is what remains when the usefulness is tested to destruction."

  **Summary for the table:**
  *   **Peirce:** Truth = Convergence on independent reality (Definition).
  *   **James:** Truth = Successful navigation of experience (Criterion/Justification).
  *   **Self-Fulfilling Beliefs:** James validates them as truth-creating; Peirce treats them as hypotheses requiring external verification.
  *   **The Stakes:** James risks relativism; Peirce risks irrelevance to human agency.
