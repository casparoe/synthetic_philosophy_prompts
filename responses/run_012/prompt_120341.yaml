      *   *The "What is it?" Question:*
          *   Peirce: Definition of truth (ontological/semantic).
          *   James: Criterion of truth + Theory of justification (epistemological/practical).
      *   *Peirce's Renaming:* He hated that James made truth too subjective/plastic. "Pragmaticism" was meant to be "ugly enough to be safe from kidnappers."

  3.  **Address the "Theory of Truth vs. Acceptability" Question:**
