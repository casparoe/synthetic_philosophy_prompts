answer: |-
  **Hexapod Trust: Donor FAQ & Operational Overview**

  **Why prioritize insects over vertebrates?**
  While vertebrate sentience is assigned a higher credence probability (approaching 1.0), the population differential renders expected value calculations decisive. Current estimates place the global insect population at approximately $10^{18}$ individuals. Even applying a conservative sentience probability floor of $10^{-6}$, the expected number of sentient subjects dwarfs vertebrate populations by orders of magnitude. In a framework maximizing expected welfare, vertebrate interventions constitute a rounding error. We allocate capital where the marginal dollar purchases the greatest reduction in expected suffering-years.

  **What is a Sentience-Adjusted Insect-Year (SAIY)?**
  The SAIY is our internal metric for cost-effectiveness analysis. One SAIY represents one year of existence for a reference insect (typically *Apis mellifera*), weighted by our current credence distribution regarding its capacity for valenced experience. We adjust this weight using proxy metrics for neural complexity, such as ganglia count and nociceptor density. When a donor funds a intervention preventing 1,000 insect deaths, we model the SAIYs gained based on the average remaining lifespan of that cohort, discounted by the probability that the lifespan would have been net-negative. This allows us to compare disparate interventions—such as habitat preservation versus pesticide regulation—on a unified scale.

  **How do you handle internal strategic disagreement?**
  The Trust operates under a portfolio diversification model to address moral uncertainty. Our Operations division is split between Cessationists, who advocate for the total abolition of broad-spectrum insecticides, and Mitigationists, who prioritize funding research into rapid-onset neurotoxins that minimize duration of suffering. These factions are currently barely on speaking terms; the Cessationists view humane killing as morally incoherent, while Mitigationists argue abolition is politically unfeasible. The Research Wing holds the tie-breaking vote, directing funds toward empirical studies on insect nociception. Until epistemic consensus is reached, we split operational funding 50/50 to hedge against the risk of backing the wrong moral theory.

  **Doesn't this rely on arbitrary probability assignments?**
  We acknowledge that assigning a specific probability to insect consciousness is epistemically hazardous. However, under moral uncertainty, one must act according to the weighted sum of all plausible moral theories. To assign zero probability to insect sentience requires a level of certainty regarding consciousness that current philosophy of mind does not support. Therefore, we treat sentience as a non-zero variable. Even if our probability estimates are noisy, the astronomical magnitude of the population ensures the expected value remains positive and dominant. We update our credence distributions quarterly based on new neuroethological data.

  **Do staff members contribute to the problem they are solving?**
  Yes. Operational integrity requires acknowledging that staff inadvertently cause insect harm through commuting, facility maintenance, and incidental crushing. We maintain a strict internal offset scheme. Every employee logs estimated incidental insect deaths monthly; these are converted into SAIY liabilities and offset by mandatory payroll deductions directed toward our most cost-effective mitigation programs. This ensures our net operational footprint remains negative. We recognize that perfect purity is impossible, but rigorous accounting prevents moral leakage.

  **Why donate now if the science is unsettled?**
  Because the leverage is highest before consensus forms. Interventions established now will lock in welfare standards for decades. If we wait for definitive proof of sentience, the opportunity to shape agricultural and urban policy will have passed. We are not buying certainty; we are buying optionality on behalf of potential subjects. The arithmetic suggests that even a small chance of preventing astronomical suffering warrants immediate investment.
