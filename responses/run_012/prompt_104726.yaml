  Island of 100 souls, 100 acres. Stock: 100 gold coins.
  State A: 50 workers produce 100 corn. 50 idle. Price: 1 coin/corn.
  Policy 1: Authority issues 50 paper tickets. Wages paid to idle to farm intensively. Output rises to 200 corn. Money stock 150. Price: 0.75 coin/corn (velocity constant).
  Policy 2: Authority issues 150 more tickets (Total 300). Workers already full employed. Output stays 200 corn. Price rises to 1.5 coins/corn.

  **Demonstration**
  Berkeley endorses Policy 1 via Principle 2 (money stirs industry) and Principle 1 (wealth is power over labour). The Realist sees output gain from labour mobilization, viewing money as neutral. The accounts diverge at Policy 1: Berkeley claims money *caused* the wealth; Realist claims labour did.
  Berkeley licenses Policy 2 via Principle 5 (quantity proportioned to needs of trade) and Principle 3 (money is a ticket; commerce maintained at any price). The nominal value of trade is 300 (200 corn × 1.5 price), matching the 300 money stock. A modern reader calls this ruinous inflation.

  **Load-bearing Principle**
  Principle 2 ("Money is useful only insofar as it stirs up... industry") makes Verdict 1 work.
  *Rival:* Principle 1 (Wealth definition). *Defense:* Principle 1 defines wealth but offers no mechanism for money to create it. Principle 2 provides the causal link.
  *Removal:* If Principle 2 is removed, money cannot activate idle labour. The doctrine collapses into Bullionism (money must be metal to hold value) or nothing, as paper becomes a useless claim on unchanged product.

  **Consistency**
  The halves are inconsistent. Principle 2 restricts money to real industry stimulation ("only insofar as"). Principle 5 accommodates nominal expansion ("needs of trade"). Policy 2 violates Principle 2 but satisfies Principle 5. To remain a single theory, the doctrine must abandon the license for Policy 2, restricting "needs of trade" to real volume.
  *Defender's Attack:* A defender would deny Policy 2 follows, insisting "needs of trade" implies real volume, not nominal value. They would argue Principle 4 (price proportionality) describes market mechanics, not policy goals, preserving Principle 2's constraint.

  Verdict: Principle 2 Split
