prompt: |-
  I am a trustee of a small charitable foundation that funds work on the long-term risks of artificial intelligence, and we have spent the last few months arguing about our mission statement. A colleague has proposed that we adopt coherent extrapolated volition as our guiding standard: that we should act not on what our grantees or the public now say they want, but on what they would want if they knew more, thought faster, were more the people they wished they were, and had grown up together. I am drawn to the ambition of the idea but uneasy about its application, and the OpenAI board crisis of late 2023 has become our test case. The board, after all, claimed to be acting not for shareholders but for the mission, and when it dismissed Sam Altman it cited a lack of consistent candour; when the staff and investors revolted, the board reversed itself. I would like you to analyse that episode through the lens of coherent extrapolated volition and the related family of idealized-preference accounts, rather than through the usual corporate-governance or power-politics reading.

  What I want is a careful mapping: who are the subjects whose volition is to be extrapolated -- humanity, OpenAI's employees, the board itself, the beneficiaries of its mission? What is the extrapolation procedure supposed to be, and does the board's fiduciary duty to a nonprofit mission conflict with it or instantiate it? What would a CEV standard have told the board to do at each stage -- before the firing, during the staff revolt, and at the reinstatement -- and how does that differ from what an idealized-preference account (say, one that asks what the relevant parties would prefer under fuller information and greater coherence) would have told them? Then I want the reverse direction: what does the episode reveal about the feasibility of CEV as a decision standard? Does the board's failure show that CEV is indeterminate, or that it was simply misapplied, or that no institution can be trusted to extrapolate anyone's volition but its own? Finally, tell me which of the two standards -- coherent extrapolated volition or a more individualistic idealized-preference account -- is more defensible for a foundation like mine, and what the episode suggests about the limits of both. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Trustee of a small charitable foundation funding long-term AI risk work.
      *   **Context:** Debating mission statement. Colleague proposes Coherent Extrapolated Volition (CEV) as the guiding standard.
      *   **Case Study:** The OpenAI board crisis (November 2023, firing and reinstatement of Sam Altman).
      *   **Task:** Analyze the OpenAI episode through the lens of CEV and idealized-preference accounts (IPA), *not* standard corporate governance/power politics.
      *   **Specific Questions to Address:**
          1.  Who are the subjects of volition? (Humanity, employees, board, beneficiaries?)
          2.  What is the extrapolation procedure?
          3.  Does fiduciary duty conflict with or instantiate CEV?
          4.  What would CEV vs. IPA have told the board to do at each stage (pre-firing, revolt, reinstatement)?
          5.  What does the episode reveal about the feasibility of CEV? (Indeterminate, misapplied, institutional bias?)
          6.  Recommendation: Which standard (CEV vs. IPA) is more defensible for the user's foundation?
          7.  Limits of both.
      *   **Tone/Style:** Careful mapping, analytical, philosophical but practical, British English.

  2.  **Deconstruct the Concepts:**
      *   **Coherent Extrapolated Volition (CEV):** Originated by Eliezer Yudkowsky. The idea is not to do what humans *say* they want, but what they *would* want if they knew more, thought faster, were more the people they wished they were, and had grown up together. It implies a convergence of values under ideal conditions. It's collective and dynamic.
      *   **Idealized-Preference Account (IPA):** A broader category. Asks what an agent would prefer under conditions of full information, rationality, and calm reflection. Can be individualistic (what *I* would want) or aggregated. Less focused on the "grown up together" convergence aspect of CEV.
      *   **The OpenAI Crisis (Nov 2023):**
          *   *Context:* OpenAI is a capped-profit subsidiary of a non-profit board. Mission: Ensure AGI benefits all of humanity.
          *   *Event:* Board fires Altman. Reason cited: Lack of candour/trust (safety concerns implied).
          *   *Reaction:* Staff threaten to quit. Investors threaten legal action/funding pull.
          *   *Resolution:* Altman reinstated, Board mostly replaced.
          *   *Standard Reading:* Power struggle, governance failure, misalignment between staff/investors and safety-focused board.
          *   *CEV/IPA Reading:* Who represents the "idealized" will of humanity/beneficiaries?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the trustee's position. Validate the ambition of CEV but highlight the danger. Set the stage for the OpenAI analysis.
      *   **Mapping the Subjects of Volition:**
          *   *Humanity:* The ultimate beneficiary (per OpenAI's charter). Hardest to extrapolate.
          *   *Employees:* Highly informed about the tech, but biased towards employment/mission culture.
          *   *The Board:* Self-appointed guardians. Claimed to act for the mission (humanity's long-term interest).
          *   *Investors:* Financial return + mission alignment.
          *   *Analysis:* CEV requires a "we." OpenAI's structure creates competing "wes."
      *   **The Extrapolation Procedure & Fiduciary Duty:**
          *   *Procedure:* CEV requires simulation of ideal epistemic conditions. The Board claimed to have better information (safety risks) than the public/employees.
          *   *Fiduciary Duty:* In a nonprofit, duty is to the *mission*, not shareholders. This looks like CEV (acting for humanity's long-term good) but risks becoming paternalistic (we know your true will better than you).
      *   **Stage-by-Stage Analysis (CEV vs. IPA):**
          *   *Pre-Firing:*
              *   *CEV:* Would idealized humanity want AGI paused/slowed if risks are real? Probably yes. Board acted on this hypothesis.
              *   *IPA:* Did Altman violate the idealized preferences of the partners (staff/investors) for transparency? Yes.
          *   *During Revolt:*
              *   *CEV:* Does the staff revolt represent humanity's volition? No, it represents a specific cohort's immediate interest. However, if the tech requires *this* specific team to be safe, their volition matters instrumentally.
              *   *IPA:* Staff have full info on operations. Their threat to leave signals that the Board's plan is unworkable.
          *   *Reinstatement:*
              *   *CEV:* Did the Board capitulate to "current volition" (pressure) rather than "extrapolated volition" (safety)? Likely.
              *   *IPA:* A pragmatic compromise. The idealized preference for *existence* of the org outweighed the idealized preference for *governance purity*.
      *   **Feasibility of CEV (The Reverse Direction):**
          *   *Indeterminacy:* We don't know what "idealized humanity" wants regarding AGI speed vs. safety.
          *   *Institutional Bias:* The Board extrapolated *their own* fears as humanity's volition. This is the "God's eye view" problem.
          *   *Epistemic Arrogance:* CEV requires knowing the counterfactual (what they *would* think). The Board assumed they knew.
      *   **Recommendation for the Foundation:**
          *   *CEV vs. IPA:* CEV is too metaphysically heavy and prone to capture for a small foundation. IPA is more manageable.
          *   *Why:* CEV implies a singular convergent truth. IPA allows for pluralism.
          *   *Limits:* Both suffer from the "who extrapolates?" problem.
      *   **Conclusion:** Summarize. Caution against using CEV as a shield for unilateralism.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to drift into standard governance talk (e.g., "the board breached duties"). Keep it focused on *volition*.
      *   *Nuance:* Distinguish between CEV (Yudkowsky's specific formulation about convergence) and general Idealized Preference (what a specific agent would want if rational).
      *   *British English:* Check spelling (organisation, programme, centre, analyse, defence) and tone (slightly more reserved, precise).
      *   *OpenAI Specifics:* Ensure accuracy. The board cited "not consistently candid." The staff revolt was pivotal. The reinstatement involved a new board.

  5.  **Drafting the Content (incorporating British English):**
      *   *Intro:* "Dear Trustee..." or just direct address. Let's go with a formal essay style suitable for a board paper.
      *   *Terminology:* Use "volition," "epistemic," "fiduciary," "paternalism."
      *   *Structure:* Use headings for clarity.

      *(Self-Correction during drafting)*: I need to be careful not to definitively say what CEV *would* have decided, because CEV is computationally intractable. I must frame it as "What a CEV *framework* demands" vs "What the Board *claimed* CEV demanded." The core tension is *who gets to run the extrapolation*.

      *Key Insight:* The OpenAI Board claimed to be the proxy for CEV (humanity's long-term safety). The Staff/Investors claimed to be the proxy for IPA (the immediate stakeholders' rational preferences for the org's success). The collapse happened because the Board's claim to represent CEV was rejected by the stakeholders who held the power.

      *Recommendation:* For a small foundation, CEV is dangerous. It invites mission drift into ideology. IPA is better: "What would our donors/beneficiaries want if they understood the grants?"

  6.  **Final Review against Constraints:**
      *   British English? Yes.
      *   All questions answered? (Subjects, Procedure, Fiduciary, Stages, Feasibility, Recommendation).
      *   Tone? Analytical, respectful, cautious.

  7.  **Final Polish:** Check for flow and ensure the distinction between CEV and IPA remains sharp throughout. (CEV = Collective convergence; IPA = Individual idealized rationality).

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  **Memorandum**

  **To:** The Board of Trustees
  **From:** [Your Name/AI Assistant]
  **Date:** 24 May 2024
  **Subject:** Analysis of Coherent Extrapolated Volition and the OpenAI Governance Crisis

  **1. Introduction**

  The proposal to adopt Coherent Extrapolated Volition (CEV) as a guiding standard for our foundation is intellectually seductive. It promises to liberate us from the caprices of public opinion and the short-termism of grantees, anchoring our work in what humanity *ought* to value rather than what it currently claims to want. However, as the OpenAI board crisis of November 2023 demonstrates, the operationalisation of idealised-preference accounts is fraught with peril. That episode was not merely a failure of corporate governance; it was a collision between competing claims to represent the 'true' will of the relevant stakeholders.

  This analysis maps the OpenAI episode through the lens of CEV and the broader family of Idealised-Preference Accounts (IPA), examining who counts as a moral subject in such frameworks, how extrapolation is purported to occur, and what this implies for our own mission statement.

  **2. Mapping the Subjects of Volition**

  In any idealised-preference framework, the first question is: *whose* preferences are being extrapolated? In the OpenAI case, four distinct groups laid claim to this status.

  *   **Humanity (The Beneficiaries):** OpenAI's charter mandates that AGI benefit all of humanity. Under a strict CEV reading, humanity is the sole subject. The Board positioned itself as the proxy for this group, arguing that current humanity cannot accurately assess existential risk, and thus the Board must act on humanity's *extrapolated* desire for safety over speed.
  *   **The Employees:** The staff possess high epistemic access to the technology. An IPA applied to them asks: 'What would the engineers want if they fully understood the safety implications and the employment market?' Their revolt suggested their idealised preference was for continuity of leadership and technical momentum, provided safety was not egregiously compromised.
  *   **The Board:** The Board members are subjects too. A CEV process requires them to be 'more the people they wished they were'. However, the crisis revealed a conflict between their *stated* volition (safety guardianship) and their *operational* volition (maintaining control).
  *   **The Investors:** While OpenAI is capped-profit, investors hold leverage. Their idealised preference is typically a coherent alignment of mission and return.

  **The Conflict:** The crisis arose because the Board claimed exclusive standing to interpret the volition of 'Humanity', while the Employees and Investors asserted that their own idealised preferences (as informed insiders) should veto the Board's interpretation. CEV posits a convergence ('grown up together'), but the OpenAI structure created divergent tribes with incompatible extrapolations.

  **3. The Extrapolation Procedure and Fiduciary Duty**

  **The Procedure**
  CEV requires a simulation of ideal epistemic conditions: more knowledge, faster thought, greater moral maturity. In practice, an institution must approximate this via deliberation, expert consultation, and red-teaming.
  *   **The Board's Claim:** They argued they possessed superior information regarding safety risks (the 'lack of candour' cited in Altman's dismissal). They implied that if the public knew what they knew, the public would support the dismissal. This is a claim to *epistemic superiority* as a proxy for *volitional extrapolation*.
  *   **The Flaw:** There is no mechanism to verify the extrapolation. We cannot observe the counterfactual world where humanity is wiser. We can only observe the Board's assertion.

  **Fiduciary Duty**
  In a non-profit, fiduciary duty is owed to the *mission*, not shareholders.
  *   **Instantiation:** One could argue this duty *instantiates* CEV. The Board is legally bound to ignore short-term pressure (current volition) to secure the long-term goal (extrapolated volition).
  *   **Conflict:** However, fiduciary duty requires prudence. If acting on an extrapolated preference destroys the institution's capacity to act (via staff revolt), the duty is breached. The Board's error was treating their fiduciary duty to the *abstract mission* as superior to the *instrumental necessities* (staff and capital) required to fulfil it. They conflated the *end* (humanity's safety) with their specific *means* (their own governance).

  **4. Stage-by-Stage Analysis: CEV vs. IPA**

  How would these standards have guided the Board at each juncture?

  **Stage 1: Before the Firing**
  *   **CEV Standard:** The Board should ask: 'If humanity understood the specific safety risk Altman posed, would they want him removed?' If the risk was existential, CEV demands removal regardless of current popularity.
  *   **IPA Standard:** The Board should ask: 'Do our partners (staff, investors) have a rational, informed objection to this leadership?'
  *   **The Divergence:** The Board followed a strict CEV logic (safety overrides all). They failed the IPA test by not securing the 'informed consent' of the operational cohort. They assumed their extrapolation was self-authenticating.

  **Stage 2: During the Staff Revolt**
  *   **CEV Standard:** This is the critical test. Does the staff revolt represent 'current volition' (to be ignored) or new evidence about the 'extrapolated volition'? If the technology is so complex that only this specific team can build it safely, their refusal to work *is* data about humanity's safety. Ignoring them risks losing the capability to steer AGI.
  *   **IPA Standard:** The staff, being highly informed, are the best proxies for idealised agents in this context. Their collective threat indicates that the Board's plan is incoherent with the reality of the lab.
  *   **The Failure:** The Board treated the revolt as pressure politics (current volition) rather than epistemic data (extrapolated volition). A true CEV process would have updated its probability estimates based on the experts' refusal to cooperate.

  **Stage 3: The Reinstatement**
  *   **CEV Standard:** Did reinstating Altman serve humanity's long-term interest? If the Board lacked the support to govern safely, remaining in power might cause greater instability. Stepping down could be seen as aligning with the 'coherent' will of the ecosystem.
  *   **IPA Standard:** A pragmatic compromise. The idealised preference of the organisation is to exist and function.
  *   **Outcome:** The Board's capitulation suggests they realised their claim to represent CEV was unsustainable without the consent of the informed stakeholders.

  **5. Feasibility of CEV as a Decision Standard**

  The OpenAI episode reveals three structural weaknesses in CEV when applied to human institutions:

  1.  **Indeterminacy:** There is no unique solution to the extrapolation function. The Board extrapolated 'safety first'; the staff extrapolated 'collaborative development'. Both claimed to be acting for the long-term good. CEV offers no algorithm to resolve this dispute other than 'wait until we agree', which is impossible in real-time governance.
  2.  **Institutional Narcissism:** The episode suggests that no institution can be trusted to extrapolate anyone's volition but its own. The Board did not discover humanity's volition; they projected their own risk tolerance onto humanity. CEV, without an external check, becomes a licence for paternalism.
  3.  **The Epistemic Gap:** To run CEV, one needs to know the 'true' facts (the safety risk). The Board claimed to have them but could not disclose them (due to confidentiality or lack of concrete evidence). An idealised-preference account collapses if the 'fuller information' condition cannot be met or verified.

  The failure was not necessarily that CEV is incoherent, but that it is *computationally intractable* for a human board. They attempted to simulate the output of a superintelligence regarding human values, using only their own heuristics.

  **6. Recommendation for Our Foundation**

  You asked which standard is more defensible for a small charitable foundation. I advise against adopting Coherent Extrapolated Volition as a formal governing standard, and recommend a modified Idealised-Preference Account instead.

  **Why CEV is Unsuitable:**
  *   **Mission Drift:** CEV invites trustees to substitute their own moral intuitions for the stated needs of beneficiaries. It creates a 'God's eye view' that is vulnerable to ideological capture. If we claim to know what beneficiaries *would* want if they were 'better people', we risk disregarding their actual suffering or stated needs.
  *   **Lack of Accountability:** As OpenAI showed, CEV can be used to justify unilateral action that alienates the very partners required to do the work.

  **Why Idealised-Preference (IPA) is Preferable:**
  *   **Definition:** Adopt a standard that asks: 'What would our stakeholders (donors, grantees, beneficiaries) prefer if they had full information about our constraints and the technical landscape?'
  *   **Defensibility:** This is more humble. It does not require us to simulate moral growth ('more the people they wished they were'), only informational completeness. It keeps us tethered to the actual preferences of living people, merely corrected for ignorance, not corrected for character.
  *   **Process:** It mandates transparency. You cannot claim to know what stakeholders would want under 'full information' if you are not willing to share that information.

  **7. Limits and Conclusion**

  Both standards share a limit: they require the trustees to act as proxies for minds they do not inhabit. The OpenAI crisis teaches us that when trustees claim to represent a volition that contradicts the expressed will of their informed community, they must possess near-certain evidence of catastrophe to justify the override.

  For a foundation funding long-term AI risk, the temptation to adopt CEV is high because the risks are existential and public understanding is low. However, using CEV as a mission statement is dangerous. It transforms the foundation from a funder of research into a self-appointed guardian of humanity's soul.

  **Recommendation:**
  Draft your mission to reflect an **Informed Stakeholder Preference** model. State that you aim to fund work that aligns with the long-term interests of humanity *as understood through rigorous, transparent dialogue with the scientific community and public stakeholders*. Avoid language that suggests you know what humanity *would* want better than they do.

  The OpenAI board fell because they claimed the authority of CEV without the epistemic security to sustain it. For a small foundation, legitimacy is your primary currency. Do not spend it on metaphysical claims you cannot verify.

  Yours sincerely,

  [AI Assistant]
