answer: |-
  The press smelled like wet wood and forgotten autumns. It was a good smell, mostly, unless you were standing next to Barrel 7.

  I was seventeen, which made me the youngest person to ever sit on the Town Standard Board, and only because Grandma died in March and the bylaws said her seat couldn't stay empty. My uncle, who actually ran the place, looked at me like I was a stray cat he'd been forced to feed. He wanted the stamp. The stamp meant double the price. No stamp meant vinegar. The difference between a good year and a bad year wasn't the weather; it was three people sitting around a table spitting apple mash into a bucket.

  The board was me, Elias, and Mr. Henderson. Elias had been judging since before I was born, thirty years of sniffing and souring. Henderson was a grocer who bought the bulk of what we didn't stamp. He cared about volume. Elias cared about history. I cared about getting out of there before homework piled up.

  The rule was simple: unanimous consent. If one of us turned up our nose, the barrel failed. No appeals.

  Barrel 7 was dark, cloudy, and smelled faintly of the barnyard. We poured. The liquid was amber, thick. I took a sip. It was good. It was actually incredible. Rich, deep, with a kick that warmed the back of the throat. But underneath the apple, there was something else. A sharpness. Like licking a battery. And beneath that, a dry, tannic drag, like chewing on an old belt.

  "It's got iron," I said. I put the glass down.

  Elias paused. He swirled his glass, sniffed again. "There's a metallic tang. Yes."

  Henderson laughed. He took a big gulp. "Tastes like cider. Best batch we've had in five years. You two are chasing ghosts."

  "There's leather too," I said. "Old leather."

  Elias nodded slowly. "The finish is dry. Too dry."

  "It's complex," Henderson insisted. "You're looking for faults because you're bored."

  "We don't vote on complex," Elias said. "We vote on standard."

  "I vote yes," Henderson said.

  "I vote no," I said.

  Elias looked at me, then at Henderson. "No."

  That was it. Barrel 7 was dead. Uncle wouldn't say anything, but I saw his jaw tighten. He needed the money from the stamped barrels to fix the roof. Now he'd be dumping premium cider into vinegar vats.

  Two weeks later, during the deep clean, we found it. Behind the press mechanism, hidden in the guts of the machine, was a leather washer that had disintegrated and a fitting that had rusted through. The maintenance log showed it had been loose since the start of the crush.

  I stood there holding the rusted iron piece. It validated us. Me and Elias had been right. Henderson was wrong. The flaws were real, physical objects floating in the juice. But standing there, holding the rust, I didn't feel vindicated. I felt tired. Because I still liked the taste. The rust and the leather had made it better. They gave it a weight the clean barrels lacked. If I drank a glass of Barrel 7 right then, I'd choose it over the stamped stuff any day. But the stamp wasn't about what I wanted to drink. It was about what we said was allowed.

  I went to the office to file the verdict. The Ledger was on the desk. It was a massive book, bound in leather that was cracking at the spine. Records went back to 1892. The handwriting changed every few pages, shifting from copperplate to ballpoint.

  I flipped back to the 1960s. There were pages of rejected barrels. '64, '65, '67. All marked "Fail." I knew those years. My dad talked about them. The '64 reserve was legendary now. People paid hundreds for a bottle if one showed up at auction. But back then, the board said it was too sharp. Too acidic.

  Then I turned to the 1950s. The stamped barrels. "Town Standard." I'd tried a bottle of '52 once. It was thin. Watery. Sweet like candy. Nobody wanted it now. The standard had moved, but the ink hadn't.

  I found a note in the margin of the 1978 page. The board had reconvened in 1988 and reversed a verdict from ten years prior. The note said, simply: *We were wrong then.*

  I ran my finger over the ink. Were they wrong in '78, or was 1988 just different? Did the cider change, or did the tongues? If taste gets better, does that mean the past was worse? Or does it just mean the past was later? The book didn't answer. It just recorded the change and called it a correction.

  I took the Ledger out to the porch where Elias was smoking. Henderson was gone; he didn't like being wrong.

  "The washer was leather," I said. "And the fitting was iron."

  Elias nodded. He didn't look surprised. "So the taste was real."

  "It was good, though."

  "It was flawed."

  "Who decides?" I asked.

  "The board."

  "But who decides the board is good?"

  Elias tapped ash onto the wood. "The standard is just whatever the good tasters say."

  "How do you know who the good tasters are?"

  "Because their judgments last."

  "Lasting according to who?"

  Elias looked at me. He opened his mouth, then closed it. He took a drag of his cigarette. The smoke hung between us, gray and shapeless. He didn't have an answer. There wasn't one. The logic circled itself like a dog chasing its tail. Good taste makes the standard, the standard defines good taste. We were just sitting in the middle of the loop, holding pens.

  I looked at him. He was old. His hands shook slightly. He believed in the book. He believed that if he wrote "Fail," it was a fact, like gravity.

  I realized then that I thought Henderson was an idiot. I thought his palate was broken. I looked at Elias and thought he was wise. I was ranking them. I was deciding that my sensitivity to the iron made me superior to Henderson's enjoyment of the sweet. I was being a snob. I was horrified by how easily the thought came, how natural it felt. I wanted to say, *Actually, Henderson's way is fine,* but I didn't believe it. I still thought he was wrong. I just didn't know why that mattered anymore.

  I went back inside. The Ledger was open to the current year. The page was blank except for the printed lines. *Barrel Number. Date. Verdict. Initials.*

  Grandma's pen was next to it. It was a fountain pen, black, with a nib that was too sharp. It scratched the paper. She'd always said a smooth pen made you write too fast. You had to feel the resistance to know you were making a mark.

  Barrel 7 was my favorite. I wanted to drink it all winter. I wanted to keep it. But if I stamped it, I was lying. The rust was there. The leather was there. If I stamped it, I was saying the flaw didn't matter. If I failed it, I was saying the flavor didn't matter.

  Uncle needed the money. Henderson looked foolish. Elias looked tired. I looked at the line where I had to write.

  There was no right answer. There was just the ink. If I wrote "Pass," the standard meant nothing. If I wrote "Fail," the cider went to vinegar. Either way, someone lost. Either the truth of the taste, or the truth of the book.

  I dipped the pen. The ink was black and thick. It smelled like chemicals. I put the nib to the paper. The scratch was loud in the quiet room. It dragged. I had to press hard to make it flow.

  *Barrel 7,* I wrote. The ink pooled slightly where I pressed too hard. *Verdict: Fail.*

  My hand didn't shake. I didn't feel brave. I didn't feel sad. I just felt the pen scratching against the grain of the paper, fighting every letter, making a permanent record of a decision that would probably be called wrong in ten years. I finished the line and put the cap back on. The pen clicked. It was done.
