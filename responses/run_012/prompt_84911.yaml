      *   *The Core Principle:* It's not about "Future Self" vs. "Present Self." It's about **Evidence**. You update when you expect the future belief to be the result of *processing evidence* that you currently respect.
      *   *Addressing (2) vs. (6):* In (6), the future self is correcting an error you acknowledge you might have made (math is hard when tired). In (2), the future self is introducing an error you acknowledge (caffeine withdrawal makes you cranky). It's about *expected rationality*.
      *   *Addressing (8) & (9):*
