          *   (8) is an unvalidated method. You cannot update to 0.9. You update based on your trust in the doctor's assessment of the drug.
      *   *The Verdicts:* Most of the user's verdicts are philosophically defensible. The only one under pressure is (1) vs (6). In (1), you don't have the info yet. In (6), you don't have the calculation yet. Both are "future evidence."
      *   *What to give up:* The idea that there is a *single* simple principle. It's a cluster of conditions (Rationality, Evidence, Reliability).
