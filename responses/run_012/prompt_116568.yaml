  2.  **Deconstruct the Philosophical Positions (in context):**
      *   **Epistemicism (User):** There is a sharp boundary between "vehicle" and "not vehicle." We just don't know where it is. The scooter *is* either a vehicle or it isn't, regardless of our inability to pinpoint the threshold. The bylaw has a determinate truth value.
      *   **Supervaluationism (Cousin):** There is no sharp boundary. "Vehicle" is vague. There are many admissible ways to make "vehicle" precise (precisifications). In some, the scooter is a vehicle; in others, it isn't. Therefore, the statement "The scooter is a vehicle" is neither true nor false (it's indeterminate).
      *   **The Bylaw:** Bans "vehicles," lists examples (bicycles, skateboards, e-scooters, mobility scooters). Says "no motorized vehicles." Neighbor's scooter has a throttle but uses pedal assist mostly. Used for medical reasons.
      *   **Higher-Order Vagueness:** Where does the borderline start? Epistemicists say there's a boundary for that too (we just don't know it). Supervaluationists say the set of admissible precisifications itself has fuzzy boundaries.
      *   **Verbal Dispute:** Are they arguing about the word "true" or "fact"? Or about the legal reality?

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to find common ground. Both agree the bylaw is vague. Both agree the scooter is a borderline case. Both agree the council needs a resolution.
