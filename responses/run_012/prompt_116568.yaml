      *   *Bylaw:* Both agree the text creates ambiguity when applied to hybrid devices (mobility aid + motorized transport).
      *   *Higher-Order Vagueness:* This is tricky. Epistemicists believe in sharp boundaries for higher-order vagueness. Supervaluationists usually model it with fuzzy boundaries of precisifications. *Correction:* To find agreement, we need to frame it as "Both agree that identifying the *start* of the borderline zone is itself difficult/imprecise."
      *   *Verbal Dispute:* Both should agree that *some* of the argument is about how to interpret "fact of the matter."
      *   *Strength:* Ensure the cousin's view isn't "anything goes" and the user's view isn't "magic boundary."

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to separate genuine metaphysical/semantic disagreement from verbal confusion.
      *   *Core Disagreement:* Truth value of "This scooter is a vehicle."
      *   *Epistemicist Wording:* "There is a specific fact..."
      *   *Supervaluationist Wording:* "There is no single truth value across all admissible interpretations..."
      *   *Verbal Component:* Acknowledge that if "fact of the matter" means "legal enforceability," they might agree. If it means "metaphysical truth," they disagree.
      *   *Application:* How does this affect the council? Epistemicist: Find the fact. Supervaluationist: Make a choice to precisify.

  5.  **Drafting - Section 3: The Cruxes:**
      *   What would change their minds?
      *   *Crux 1: Legislative Intent vs. Text.* If the intent was clearly "mobility aids exempt," does that sharpen the boundary?
      *   *Crux 2: Precedent/Consistency.* If another building treats similar scooters differently.
      *   *Crux 3: The "Throttle" Feature.* Does the presence of a throttle make it definitively motorized?
      *   *Predictions:* Epistemicist predicts intent reveals the hidden boundary. Supervaluationist predicts intent selects a precisification but doesn't reveal a pre-existing truth.
      *   *Falsification:* What would make them doubt? Epistemicist: If legal counsel says the text is legally void for uncertainty. Supervaluationist: If a judge rules there *was* a correct answer all along.

  6.  **Refining and Polishing:**
