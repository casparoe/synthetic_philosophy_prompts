answer: |-
  **Elena:** The shard case breaks your view, Marcus. Admit it. For thirty years, mathematicians proved theorems about shards. They built a theory. Then they found an inconsistency. On your view, every single one of those proofs was vacuous.

  **Marcus:** Not vacuous. Conditional. Every theorem proved was effectively a statement of the form: "If the shard axioms hold, then X follows." Those conditionals remain true even if the antecedent is false. The logic was sound; the ontology was empty.

  **Elena:** But that's sterile. It ignores what actually happened. Halfway through that generation, someone realized shard-theorems described ordinary finite structures. They reinterpreted the terms, and the math worked. It predicted behavior in combinatorics. If shards were just a story with no model, why did the story map onto reality?

  **Marcus:** Because the story was structured similarly to reality. I'm a nominalist, not a solipsist. We build fictions using rules inspired by the world. If I write a novel about a city that looks like Chicago, and readers learn something about urban planning, I haven't discovered a metaphysical Chicago-in-the-ether. I've codified patterns. The shard axioms were a useful codification that happened to overlap with finite structures until the contradiction surfaced.

  **Elena:** You're conflating the map with the territory. The mathematicians weren't just shuffling symbols; they were grasping at a structure they couldn't fully formalize. The inconsistency wasn't proof that shards didn't exist; it was proof that their *axiomatization* of shards was flawed. They were discovering facts about a real object but describing it imperfectly.

  **Marcus:** What object, Elena? You say "real object." I ask: where is it? When the inconsistency was proven, it showed no structure satisfies those axioms. None. Zero. If existence means "having a model," shards never existed. Not even for a day.

  **Elena:** Existence doesn't mean "satisfying a specific list of sentences written by fallible humans." It means "having a coherent structure." The fact that the early theorems held true for finite structures suggests the coherent structure was there. The mathematicians were peering at it through a cracked lens. The crack doesn't mean the landscape vanished.

  **Marcus:** But which landscape? Once the inconsistency was found, the theory shattered. You can salvage parts of it—restrict the axioms, define "pseudo-shards"—but those are new objects. You're saying the mathematicians were discovering facts about *those* objects all along?

  **Elena:** I'm saying they were discovering facts about the relationships that hold in any structure resembling a shard. The truth of the theorem wasn't created by the proof; it was recognized. When they proved "All shards have property P," and later found finite structures with property P, they didn't make P true. They found that P was a necessary feature of the terrain they were exploring.

  **Marcus:** "Terrain." That's the metaphor I reject. There was no terrain. There was only the path they walked. When they hit the wall of contradiction, the path ended. The utility of the early steps doesn't imply a destination. Consider this: before the inconsistency was found, were the theorems true?

  **Elena:** Yes.

  **Marcus:** Even though the object didn't exist?

  **Elena:** The object existed independently of their definition. Their definition was an attempt to capture it.

  **Marcus:** So mathematical existence is independent of consistency?

  **Elena:** Mathematical *truth* is. Existence requires coherence, yes. But coherence isn't identical to a specific formal system.

  **Marcus:** Then you've moved the goalposts. If existence isn't tied to consistent axioms, how do we know when we've found it? You rely on intuition. "It feels real because it works." But history is littered with useful inconsistencies. Newtonian calculus used infinitesimals that were logically incoherent for centuries. Was the calculus true then?

  **Elena:** The results were true. The justification was incomplete.

  **Marcus:** Exactly. The results were valid moves in a game we hadn't fully defined. That's my point. Mathematics is the game. The "truth" is just validity within the rules. When the rules broke, the game changed. You want to say they were discovering eternal verities. I say they were exploring the consequences of a hypothesis. When the hypothesis failed, the exploration stopped. The fact that some souvenirs matched items in the real world is a compliment to their imagination, not evidence of a platonic realm.

  **Elena:** But why does the imagination track so well? Why does the fiction constrain us? We couldn't just decide shards had any property we wanted. We had to work hard to derive them. There was resistance.

  **Marcus:** Resistance doesn't prove ontology. You feel resistance when playing chess, too. The knight moves in an L-shape. You can't move it diagonally. Is the knight a platonic object?

  **Elena:** The knight is a defined piece. Shards were supposed to be discovered kinds.

  **Marcus:** And they turned out to be defined pieces with contradictory rules. Here's the fork, Elena. When you say "The theorem was true before the inconsistency," you mean it corresponded to a reality outside the proof. When I say it, I mean it was derivable from the premises accepted at the time. You think the inconsistency was a mistake in our grasp of something permanent. I think it was a mistake in the construction of something temporary.

  **Elena:** And that's why we're stuck. You see the inconsistency as the death of the object. I see it as the death of the description.

  **Marcus:** Precisely. For me, no model means no object. Full stop. The history of the shards is a history of human ingenuity, not human discovery.

  **Elena:** And for me, the utility and the resistance prove the object was there, waiting for a better description. The inconsistency just tells us we were blind, not that there was nothing to see.

  **Marcus:** So you believe in ghosts because the house creaks.

  **Elena:** And you believe the house is silent because you refuse to listen for anything but the wood.

  **Marcus:** Then I suppose we'll keep listening for different things.

  **Elena:** We will. But the shards remain.

  **Marcus:** The shards remain only as a story about what we almost believed.

  **Elena:** No. They remain as a proof that truth outlasts error.

  **Marcus:** Or that utility outlasts truth.

  **Elena:** We'll see.

  **Marcus:** We won't. That's the point.
