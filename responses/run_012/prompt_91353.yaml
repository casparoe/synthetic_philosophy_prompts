      *   *Licensing the Conclusion:* The nurse and kidney donor want to say "It's good, but you won't be blamed for skipping it." This requires Reading 2 (Cost-Limit) or Reading 3 (Asymmetry). Reading 1 works for the nurse, not the kidney. Reading 4 undermines them.
      *   *Ordinary Usage vs. Defensible:* Ordinary people usually mean Reading 2 (It costs too much) or Reading 5 (Social norms). The most defensible philosophically is usually Reading 3 (Asymmetry) grounded in Reading 2 (Cost).

  5.  **Drafting the Content (incorporating tone):**
