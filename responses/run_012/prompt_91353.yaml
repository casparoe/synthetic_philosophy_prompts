      *   *Idea 5 (The Incoherent/Utilitarian Read):* "There is no BCOD."
          *   Claim: If it's the best thing to do, you must do it. BCOD is a myth.
          *   Status: Substantive (Utilitarianism), but contradicts ordinary language.
