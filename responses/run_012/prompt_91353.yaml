prompt: |-
  I'm a night-shift nurse in a big city ICU, and I've gotten into two separate arguements in the last month that both came down to the same four words: "beyond the call of duty." The first was in the break room. We're chronically short-staffed and admin keeps asking people to pick up extra nights, and a senior nurse I really respect said, basically, look, nobody can make you come in on your day off, that's beyond the call of duty, so stop letting them guilt you into it — which, fine, I agreed with the conclusion, but I noticed I couldn't have said why. The second was online, in a thread about whether you're doing something wrong by not donating a kidney to a stranger if you turn out to be a match, where somebody said that donating a kidney is beyond the call of duty, and therefore it's absurd to say anyone is *obligated* to do it, so the whole question is a non-starter. I'm pretty sure I've seen the same move used about giving away a big chunk of your income, and about a bystander who runs into a burning building. In the second thread I said philosophers actually have a word for this, supererogation, and got told I was overcomplicating a simple phrase, and honestly I couldn't defend myself because I realized I don't actually know what I think it means. So I'd like you to act like a moral philosopher who's good at teaching and help me take the phrase apart.

  Could you start by just brainstorming, roughly, all the different things "beyond the call of duty" could be asserting — not the dictionary gloss, but the actual precise claims, from the ones that are nearly empty to the ones that are doing real philosophical work — and then lay them out as a numbered menu? For each reading I want: exactly what it claims, whether it's a platitude or a substantive thesis or something alot of philosophers would call false, and whether it even hangs together (one friend insists the whole phrase is incoherent, since whatever is genuinely best to do is what you ought to do, so "beyond" would have nowhere to go — I want to know if that's a real objection to all the readings or only to some of them). Then, separately, tell me which of these readings would actually license what the senior nurse and the kidney guy were using it for — i.e. which ones make it true that the act is admirable but that nobody could be required to do it — and which ones leave that conclusion untouched or even undermine it. Finish with your best guess at which reading ordinary people mean when they're using it to win an arguement, versus which reading is the most defensible one. Please definately lay it out as a menu I can bring back to both conversations rather than picking one reading and running with it, and don't send me off to a reading list — I can't look anything up and I wouldn't read it anyway, I just want the distinctions.
