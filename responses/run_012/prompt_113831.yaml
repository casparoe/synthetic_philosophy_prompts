answer: |-
  This is a profound governance dilemma because it touches on the foundational questions of political philosophy and social ontology: How do norms become rules? When does expectation become obligation? And what destroys the legitimacy of a shared practice?

  To help your board think this through, I will separate the **coordination problems** (how we organize behavior) from the **legitimacy problems** (why we ought to obey), and then address the specific wrinkle of the private notebook, which fundamentally alters the landscape.

  ### 1. Coordination vs. Fairness/Legitimacy

  You must disentangle these two layers, as they require different solutions.

  **The Coordination Layer**
  *   **The Question:** How do we ensure the drill goes to the person who needs it most without conflict?
  *   **The Function:** The practice (late returners wait a cycle) is a *convention* in the sense defined by philosopher David Lewis. It is a regularity in behavior that solves a coordination problem. Everyone prefers to follow it *on the condition* that others do too, because the alternative is chaos (fighting over tools, hoarding).
  *   **The Survey:** If you ask everyone what they expect, you are testing for a **coordination equilibrium**. If 90% say, "I expect to wait if I'm late, and I expect others to wait," you have confirmed a stable convention.
  *   **Limitation:** A survey settles whether the practice is *stable*, not whether it is *binding*. A traffic jam is a stable regularity, but it creates no obligation. To move from "we all do this" to "we *must* do this," you need legitimacy.

  **The Fairness/Legitimacy Layer**
  *   **The Question:** By what right do we punish the member who was away? Is the enforcement arbitrary?
  *   **The Function:** This concerns consent, notice, and equality.
  *   **The "Away Member":** His objection is a legitimacy claim, not a coordination claim. He is arguing that obligation requires some form of consent (explicit or implicit).
  *   **The Risk:** If you enforce a rule that lacks legitimacy, you rely solely on power. In a volunteer organization, power without legitimacy leads to attrition and resentment.

  ### 2. Is the Practice Already Binding? (Social Ontology)

  You asked if mutual expectation makes the practice authoritative.

  *   **The Internal Point of View:** Legal philosopher H.L.A. Hart argued that for a rule to exist, members must adopt an "internal point of view." They shouldn't just *obey* the habit; they must accept it as a *standard of criticism*. If members say, "You *ought* to wait," rather than "You *will* wait," the norm has normative force.
  *   **The Problem of Tacit Consent:** For the "Away Member," the argument for bindingness rests on **membership as consent**. By rejoining the library, did he accept existing norms?
      *   *Argument for Binding:* Membership implies accepting the operational culture. If he didn't know the rule, he was negligent in his re-onboarding.
      *   *Argument Against:* Norms that carry penalties require **publicity**. If a rule is not written and not explicitly stated upon return, punishing someone for violating it violates the principle of *nulla poena sine lege* (no penalty without law).
  *   **History and Alternatives:**
      *   *Accidental Origin:* This matters little for current bindingness. Language and money started accidentally but are binding now. What matters is current acceptance.
      *   *Rival Libraries:* The existence of other arrangements elsewhere is irrelevant to local bindingness, unless your members are mobile between libraries and expect portability of rules. It does, however, prove the rule is not "natural" but chosen, which strengthens the argument that it needs conscious ratification.

  **Verdict on Bindingness:** The practice is a **social norm**, not a **governance rule**. It binds those who internalize it, but it lacks the legitimacy to sanction those who do not, specifically because it was never publicized as a condition of membership.

  ### 3. Codification: Creating vs. Recording

  If you write this into the bylaws, are you creating a new rule or recording an old one?

  *   **Transformation of Character:** You are **creating a new source of authority**, even if the content is old.
      *   *Informal:* Obligation comes from peer pressure and trust ("I do this because we are neighbors").
      *   *Formal:* Obligation comes from the institution ("I do this because the bylaws say so").
  *   **The "Away Member" Obligation:**
      *   If you codify it *now*, it generally applies prospectively. You cannot fairly sanction him for past behavior under a new bylaw.
      *   If you claim you are merely "recording" an old rule to sanction him now, you are engaging in retroactive enforcement, which is widely considered unjust in governance.
  *   **The Flexibility Trade-off:** The longtime member is correct that codification reduces flexibility. Formal rules require formal amendment processes to change. However, formal rules allow for **formal exceptions**. You can write a penalty schedule *and* a hardship clause. Informal flexibility often masks informal bias (see below).

  ### 4. The "Private Notebook" Wrinkle (The Decisive Factor)

  This revelation changes the problem from "Formal vs. Informal" to "Public vs. Arbitrary."

  **Common Knowledge and Publicity**
  For a norm to be binding on a community (especially one that sanctions members), it must be **common knowledge**.
  *   **The Defect:** A rule with secret exceptions is not a rule; it is a system of patronage.
  *   **Impact on Bindingness:** The "Away Member" is now on stronger ground. If the exceptions were private, the *true* practice was not "Late returners wait," but "Late returners wait unless they are friends with the coordinator." Since he is not (presumably), he was subject to a different regime than the insiders.
  *   **Impact on Legitimacy:** This destroys the legitimacy of the informal system. Lon Fuller, in *The Morality of Law*, argued that for a system to be lawful, it must be public, general, and consistent. Secret exceptions violate publicity and consistency.

  **Does this make it unjust or non-binding?**
  It makes it **illegitimate**. A practice cannot be binding if its enforcement conditions are hidden. The "Away Member" was not just unaware of the rule; he was unaware of the *selective enforcement* of the rule.

  ### 5. Decisive Reasons for Each Path

  Here is how to evaluate your three options based on the analysis above.

  **Option A: Codify the Practice (Write it into Bylaws)**
  *   **Decisive Reason To Choose This:** **Transparency and Equality.**
      *   Given the private notebook, the informal system is compromised. Codification forces the exceptions into the light. You can write a "Hardship Clause" that replaces the coordinator's private discretion with a board-approved process.
      *   It solves the "Away Member" problem prospectively: Everyone knows the rules upon joining/rejoining.
      *   It protects the volunteers: They are no longer personally responsible for making judgment calls that look like favoritism.
  *   **The Cost:** You lose the "neighborly" feel. It becomes more bureaucratic.

  **Option B: Leave it Informal (But Reform the Process)**
  *   **Decisive Reason To Choose This:** **Community Trust and Flexibility.**
      *   If you believe the "neighborly" aspect is the core value of the library, formal rules might chill participation.
      *   *Condition:* This is only viable if you **destroy the private notebook** and make the exception criteria public. You must announce: "We generally do X, but exceptions are made for Y and Z, decided by [transparent process]."
      *   If you cannot make the exception process public, you cannot keep the system informal.
  *   **The Cost:** Enforcement remains weak. The "Away Member" type will always have a valid complaint.

  **Option C: Treat as Already Binding (Enforce without Codification)**
  *   **Decisive Reason To Choose This:** **None.**
      *   There is no decisive reason to choose this path given the "private notebook" revelation.
      *   To claim the practice was binding all along is to claim that secret, arbitrary enforcement was legitimate. This exposes the board to liability and moral hazard.
      *   Sanctioning the "Away Member" now would be an admission that the board values consistency over fairness.

  ### 6. Advice on How to Proceed

  Do not vote on "Formal vs. Informal" yet. Vote on **Transparency vs. Opacity**.

  1.  **Acknowledge the Notebook:** The board must address the private notebook immediately. It cannot remain private. If the exceptions were for valid hardships, they should be ratified. If they were for friends, the board must acknowledge the inequity.
  2.  **The "Away Member" Resolution:** You cannot fairly sanction him. The lack of publicity and the existence of secret exceptions mean he did not have fair notice. Waive his penalty as a gesture of good faith, acknowledging the governance failure.
  3.  **The Survey:** Do conduct the survey you mentioned, but ask two questions:
      *   "What do you expect the rule to be?" (Tests coordination)
      *   "Do you believe exceptions should be public and criteria-based?" (Tests legitimacy)
  4.  **The Decision:**
      *   If the community wants **flexibility**, you must codify the *process for exceptions*, not just the rule. (e.g., "Late returns wait a cycle, unless the Board grants a hardship waiver based on criteria X, Y, Z").
      *   This creates a **hybrid**: The rule is written (solving the notice problem), but the flexibility is institutionalized (solving the rigidity problem), and the discretion is public (solving the favoritism problem).

  **Summary Thought:**
  The question is not whether a habit can become a law. It can. The question is whether a habit enforced by secret discretion can bind a member. It cannot. The binding force of a shared expectation relies on the reciprocity of knowledge. If the coordinator knew the exceptions and the member did not, the reciprocity is broken. You must restore reciprocity through publicity, whether that publicity takes the form of a bylaw or a public charter of norms. Given the breach of trust regarding the notebook, a formal bylaw with a public hardship clause is likely the only way to restore legitimacy.
