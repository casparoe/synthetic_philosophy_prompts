prompt: |-
  I'm putting together a session on the necessity of origin — the idea that you couldn't have come from a different sperm and egg — and I want a case that shows how much work the notion of the same origin is doing. Here's the raw material: a person who began as two seperate fertilised eggs that fused into one embryo early on, so she's a single person built out of two sperm and two eggs. Build me a thought experiment around someone like that which pulls apart two readings of origin essentialism: the thin one, on which what's essential is just the particular gametes you came from, and a fuller one, on which the whole origin story is essential — the gametes plus how they were paired up and the actual sequence of events. I want the two readings to come out with opposite verdicts about whether some particular person in the other world is her, one yes and one no, and I want those verdicts to fall out of the theories rather than being stipulated by the setup.

  Keep it realistic — no cloning, no three-parent IVF, no time travel, no souls — and keep the scenario itself to a paragraph.

  Then do the check: what each reading says and why it follows, which single feature of the case is doing the work, what happens to the case if you take that feature away, and how someone who backs the reading that comes off worse would try to defuse it. I don't want a reading list, just the case and the check.
