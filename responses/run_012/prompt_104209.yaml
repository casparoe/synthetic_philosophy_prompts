answer: |-
  Here is a breakdown you can read directly to your coach. It's timed for about two minutes at a conversational pace.

  ***

  "Here are the four distinct claims hidden in that sentence, ranked from trivial to radical.

  **One: The Retrospective.** 'Looking back, things often improve.'
  *   **Status:** A platitude. Hard to deny, but not a prediction.
  *   **Truth Value:** Mostly true, but selective.
  *   **Action:** Implies nothing. Don't bother working, or do work; this doesn't say.

  **Two: The Empirical Trend.** 'On average, over centuries, rights expand.'
  *   **Status:** Substantive and arguable.
  *   **Truth Value:** Contingent on data. Can be falsified by counter-examples like fascism.
  *   **Action:** Suggests patience, but risks complacency.

  **Three: The Moral Imperative.** 'We *must* bend the arc.'
  *   **Status:** A command, not a fact.
  *   **Truth Value:** Neither true nor false. It's a value judgment.
  *   **Action:** Demands local work. The arc doesn't move without hands.

  **Four: The Cosmic Destiny.** 'A force guarantees justice wins.'
  *   **Status:** Metaphysical and radical.
  *   **Truth Value:** Likely false. No evidence of a moral universe.
  *   **Action:** Encourages passivity. 'Relax, history handles it.'

  **Here is the diagnosis of my senior's argument:**
  He is relying on **Claim Four**. He treats justice like gravity—an automatic law of nature. That makes his argument sketchy because it removes human agency. If justice is inevitable, why did slavery require a war?

  However, when Martin Luther King Jr. popularized this line, he was using **Claim Three**. He meant the arc is long, but it only bends because we pull it.

  **Conclusion:**
  My senior's argument only works if we accept the 'Cosmic Destiny' reading, which is the least defensible version. If we accept the 'Moral Imperative' reading—the one actually intended by the quote's famous users—then skipping local action is a contradiction. The quote isn't a reason to relax; it's a reason to show up."
