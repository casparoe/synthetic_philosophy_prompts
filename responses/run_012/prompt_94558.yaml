      *   *Addressing the Clubmates:*
          *   Kid 1 is mostly right (verbal), but misses the metaphysical stakes.
          *   Kid 2 is wrong (capability isn't the issue).
          *   Kid 3 is insightful (perspective).
      *   *The "Progress" Plan:*
          1.  **Terminological Truce:** Adopt "Motivating Reason" (User) vs. "Normative Reason" (Opponent).
          2.  **The Real Fight:** Move to the "Bridge Principle." Can a Normative Reason exist without *any* possible connection to motivation?
          3.  **Better Examples:** Move away from moral loadedness (the uncle) to prudential or instrumental cases (Williams' Gin/Petrol).
          4.  **The "So What?" Test:** What practical difference does it make? (Blame vs. Explanation).
