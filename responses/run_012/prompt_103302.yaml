prompt: |-
  Hey, I'm not an academic, I just read a lot of history stuff and hang around forums, and I keep bumping into this line people say — that history gets written by the winners. Someone said it to me last week to explain why we basically know nothing about what ordinary people thought during some revolt a few hundred years back. His point was: the people who lost didn't get to write anything down, so all we're left with is the winners' version.

  I want to know what that sentence is actually claiming, because I feel like it's doing about five different jobs at once and people slide between them without noticing. Sometimes it seems to mean something obvious, like the textbook you got in school was written by whoever won the war. Sometimes it seems to mean something much bigger, like the records themselves only exist because somebody with power bothered to make them, so the past we can even ask about is shaped at the source. And sometimes, honestly, people use it to mean we can't know anything at all, which can't be right — I know plenty about what losers were up to, usually from winners writing it down so they could tax them, try them, or complain about them. My great-grandad only appears in the record because of a rent book and a hospital ledger, and nobody making either of those cared about him personally. So it's definately not just glorious winners who get recorded.

  You're a historian who's thought a lot about how archives get built and who ends up inside them. Please think carefully before answering, and maybe start by brainstorming every distinct reading you can find hiding in that one sentence. Then lay them out as a menu for me, from the ones that are basically a platitude to the ones that are genuinely controversial to the ones that are just false. For each, tell me what it would commit me to and whether it would actually support the thing my friend was using it for — dismissing the idea that we can learn anything real about how ordinary people thought. Also say which reading you think people usually mean when they say it, and whether that's the reading the arguemnt actually needs. Since I've got no way to check any of this myself, please say how confident you are in each part and flag the one point you're least sure about.
