      *   *Narrative meaning:* The *story* told favors the winners (moral justification, hero/villain dynamics).
      *   *Epistemological meaning:* We cannot know the truth about the losers.
      *   *Structural meaning:* Power dictates what counts as "history" vs. "noise."

  3.  **Drafting the "Menu" of Readings:**

      *   *Reading 1: The Textbook Truism (Platitude).* School books reflect the state's narrative.
          *   Commitment: Curricula are political.
