      *   *Core Tension:* The user suspects this is a story about *value*, not just justice/consent. My job is to validate or refute that using incommensurability theory.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the gravity of the case. Set the stage for the philosophical mapping.
      *   **The Mapping (Agent, Options, Choice Situation):**
