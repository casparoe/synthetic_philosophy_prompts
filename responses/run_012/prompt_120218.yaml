      *   **Verdict:** Is it confirmation, anomaly, or unanticipated?
          *   *Lean:* It's a confirmation of the *social experience* of incommensurability, but an anomaly for the *metaphysics* if one thinks scarcity creates the incommensurability. I need to be nuanced here. It shows incommensurability is often *context-dependent* (scarcity triggers the hard choice), but the *revulsion* suggests a deep normative boundary.

