      *(Self-Correction during drafting the "Verdict"):* I need to be precise. Is it a confirmation? It confirms that *hard choices* generate social revulsion when they force commensuration of the incomparable. It challenges the idea that incommensurability is purely metaphysical; it shows it's institutional. I'll call it a "structural confirmation."

      *(Final check on constraints):* "Treat the facts I have given as fixed." I must not mention the specific name "God Committee" (though the prompt mentions the nickname "followed it ever since," I shouldn't elaborate on the nickname's origin beyond what's implied). I won't mention specific patient counts. I won't mention the specific cost of dialysis then vs now.

