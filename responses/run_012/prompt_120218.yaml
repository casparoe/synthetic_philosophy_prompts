          *   *Expressive Account (Anderson/Chang):* The objection isn't bad math; it's the *category error*. Ranking persons on a single scale of social worth expresses a disrespectful attitude (commodification of life).
      *   **Running Analysis Backwards (Evidence for Theory):**
