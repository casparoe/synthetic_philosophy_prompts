answer: |-
  This is a profound case for value theory because it forces us to distinguish between the *ontology* of value (what values *are*) and the *sociology* of choice (how institutions handle them). You are right to suspect that the standard bioethical framing (justice/consent) misses the axiological core. The committee was not merely distributing a resource unfairly; they were asked to perform a calculation that value theory suggests may be impossible.

  Here is the analysis, proceeding through the candidate readings, the mapping, the expressive critique, the sequel, and finally the verdict.

  ### I. Candidate Readings of the Situation

  Before mapping the choice, we must isolate three competing interpretations of what made this situation difficult.

  1.  **The Distributive Justice Reading:** The values are commensurable (life is the good), but the *distribution* was unjust. The committee applied the wrong principles (social worth vs. egalitarian lottery). The scandal arose because they violated a norm of equality, not because the choice was hard.
  2.  **The Epistemic Reading:** The values are comparable, and there is a fact of the matter about who *should* live (e.g., the one with the most dependents), but the committee lacked the knowledge to discern it reliably. They used poor proxies (church attendance) for a real but hidden metric (social utility).
  3.  **The Incommensurability Reading:** The values at stake (biological life, social utility, familial duty, moral worth) do not share a common metric. There is no fact of the matter about whether a mother of three is "more valuable" than a bachelor. The choice is "hard" not because it is difficult to calculate, but because the options are on a par or incomparable.

  You have asked me to analyze this through the third lens. However, to do so honestly, I must acknowledge that the committee's behavior *looks* like the second reading (Epistemic), while the public's reaction *looks* like the third (Incommensurability). The philosophical work lies in explaining that tension.

  ### II. The Mapping: Agent, Options, and Choice Situation

  To apply value theory, we must fix the coordinates of the choice.

  *   **The Agent:** The anonymous lay committee. (Note: While Congress later becomes an agent, the "hard choice" locus is the committee).
  *   **The Options:** To allocate a machine slot to Candidate A *or* Candidate B (both of whom meet strict medical criteria). Crucially, the option set is forced: *Select A* implies *Let B Die*. It is not a choice between treatments, but a choice between persons.
  *   **The Choice Situation:** A tragic allocation under conditions of absolute scarcity. The agent is tasked with maximizing a function (social benefit/survival) without a defined currency.

  ### III. Distinguishing the Three Value Types

  You requested a careful distinction between three specific value configurations. Here is how they apply to the committee's task:

  1.  **Genuine Incomparability (Raz/Chang):** Neither "Save Candidate A" nor "Save Candidate B" is better than the other, nor are they equal. They are *on a par*. The reasons favoring A (dependents) and the reasons favoring B (future contribution/youth) belong to different normative orders that cannot be summed. If this is the case, the committee's task was metaphysically impossible.
  2.  **Epistemic Opacity:** There is a single scale of "Social Worth," and Candidate A is objectively higher on it than Candidate B. However, the scale is hidden from the committee. They are guessing. If this is true, the committee's failure was one of measurement, not value theory.
  3.  **Contested Exchange Rates (Commensurable):** There is a single scale, and we know how to measure it, but we disagree on the weights. Is one year of life worth two years of education? Is church attendance worth 5 points or 10? If this is true, the scandal was political, not philosophical.

  **Which did the committee face?**
  The evidence suggests the committee *acted as if* they faced **Contested Exchange Rates**, but the situation was structurally one of **Genuine Incomparability**.

  Why? The committee *did* rank candidates. This looks like evidence for commensurability. However, look at the *proxies* they used: church attendance, occupation, income. These are measurable surrogates for "future contribution to the community." The fact that they had to substitute a measurable surrogate (church attendance) for the target value (moral/social worth) suggests they could not measure the target value directly. If "social worth" were commensurable with "life," one would expect a direct metric. Instead, they constructed a fragile bridge of proxies.

  This points to **Genuine Incomparability**. They were trying to commensurate the incomparable. The fact that they produced a ranking does not prove commensurability; it proves desperation. As Ruth Chang argues, agents often force a choice in the face of parity by "willing" a reason into existence. The committee willed a metric (social worth) into existence to resolve a choice that value theory suggests should remain unresolved.

  ### IV. The Expressive Account: Anderson and Chang

  This is where the bioethical literature usually stops, but where value theory must go further. You asked whether the objection is that the committee got the *weights* wrong, or that the *scale* itself is offensive.

  An expressive account of value (à la Elizabeth Anderson) argues that the committee's practice presupposed that lives can be placed on a single scale of social worth. The public revulsion was not primarily because they thought a homemaker should be worth *more* than a banker (a dispute over weights). The revulsion was because the very act of ranking persons on a single scale of social worth expresses an attitude toward them that no weighting could repair.

  To treat a human life as a variable in a maximization function is to commodify it. If the values are incommensurable, then "Life" and "Social Utility" are different kinds of goods. To trade them off is a category error. Therefore, the objection is **structural**, not arithmetic. The committee's scale was not inaccurate; it was illegitimate. It expressed a relationship of evaluation between the state (via the committee) and the citizen that is incompatible with the status of persons as ends in themselves.

  This aligns with Chang's work on parity. If two options are on a par, choosing one over the other requires a "normative leap." The committee tried to hide this leap behind a bureaucracy of points. The scandal erupted when the public realized the leap was not grounded in objective value, but in the committee's subjective construction of "worth."

  ### V. Running the Analysis Backwards

  What does this episode show about the *theory* of incommensurability?

  1.  **Anguish and Revulsion:** The committee's evident anguish and the public's revulsion support the claim that these values are genuinely incomparable. If the values were commensurable (like dollars for apples), the decision would be technical, not tragic. The emotional residue suggests a violation of a normative boundary.
  2.  **The Terms of Public Argument:** However, the public argument ("a mother of three should outrank a bachelor") presupposes comparability. This is the anomaly. People argued *as if* there were a correct answer.
      *   *Resolution:* This does not prove commensurability. It proves that in the face of tragic choice, human discourse defaults to commensuration to reduce anxiety. We speak the language of weights because the language of parity is paralyzing. The fact that people *argued* about the weights does not mean the weights exist; it means they wished they did.

  Therefore, the episode supports the incommensurabilist picture by showing the *cost* of pretending values are commensurable. The scandal was the cost.

  ### VI. The Sequel: A Natural Experiment

  The sequel (home dialysis + Medicare 1972) is the critical test. Scarcity was removed. The choice between persons was eliminated.

  **Calabresi and Bobbitt's *Tragic Choices*:** They argue societies reach for methods (markets, lotteries, supply expansion) to avoid deciding face-to-face who lives and who dies. The avoidance is structural.

  **Implications for Incommensurability:**
  1.  **Did the values become commensurable?** No. Expanding supply did not make a mother's life commensurable with a bachelor's. It made it so both could live. The incommensurability remains latent; it is simply no longer *activated* by scarcity.
  2.  **Does the disappearance of the hard choice prove commensurability?** No. It counts as evidence that we **bought our way out of having to find out.** If I have only one apple and two hungry children, I face a hard choice. If I buy a second apple, the choice disappears. This does not prove the children's hunger was commensurable; it proves scarcity was the trigger for the choice.
  3.  **Deep Feature vs. Scarcity Feature:** Incommensurability is a deep feature of value, but *tragic choice* is a feature of scarcity. The theory must distinguish between the *incompatibility of values* (incommensurability) and the *necessity of choosing between them* (scarcity). The Seattle episode shows that when scarcity forces a choice between incommensurables, society experiences moral distress. When scarcity is removed, the distress vanishes, but the incommensurability remains (we still do not say the mother's life is *worth more*, we just say both get treatment).

  ### VII. Where the Theory Falls Silent

  You asked where the theory falls silent, specifically regarding procedural responses.

  1.  **Guidance:** Incommensurability theory is notoriously bad at guiding action. It explains why the choice is hard, but not how to make it. If values are on a par, reason runs out.
  2.  **Procedural Responses:** Does incommensurability license randomization (lotteries)?
      *   *Yes:* If there is no fact of the matter about who is more worthy, a lottery acknowledges the parity. It treats the candidates as equals because reason cannot distinguish them.
      *   *No:* A lottery might smuggle in a substantive claim of equal value. If I flip a coin to save a saint or a murderer, I imply their lives are of equal worth.
      *   *In this case:* The committee *rejected* a lottery. They insisted on ranking. This suggests they believed (or needed to believe) in commensurability to justify the killing implied by non-selection.
  3.  **The Silence:** Value theory cannot tell the committee *who* to pick. It can only tell them that *picking* involves a normative violation. The theory falls silent on the "dirty hands" problem. It diagnoses the tragedy but offers no cure other than the removal of scarcity (which is often outside the agent's control).

  ### VIII. Verdict

  Is this episode a confirmation, an anomaly, or unanticipated?

  **Verdict: A Structural Confirmation.**

  This episode is a confirmation of the incommensurabilist picture, but specifically of the **social phenomenology** of incommensurability, rather than its metaphysics.

  *   **Why Confirmation?** The public revulsion and the eventual legislative solution (Medicare) confirm that the society collectively recognized the choice as illegitimate. If the values were truly commensurable, the solution would have been better accounting (fixing the weights). Instead, the solution was to remove the necessity of choice. This aligns with the view that some values (human life) resist trade-offs.
  *   **The Nuance:** It is not a confirmation that incommensurability is *always* present. It confirms that incommensurability becomes *visible* under scarcity. The Seattle committee tried to force commensuration where none existed. The "scandal" was the friction generated by grinding incommensurable values against a commensurating machine.

  **Final Thought:**
  You suspected this is a story about value, not just justice. You are correct. Justice assumes a distributable good and a fair rule. Value theory asks if the good *can* be distributed without loss of meaning. The Seattle committee failed not because they were unjust (though they may have been), but because they attempted to measure the unmeasurable. The 1972 Medicare extension did not solve the math; it acknowledged that the math should not have been attempted in the first place. The "hard choice" was not a puzzle to be solved, but a boundary to be respected. By expanding supply, society respected the boundary by stepping back from it.
