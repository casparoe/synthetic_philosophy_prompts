              3.  Contested exchange rates (commensurable but disputed weights).
          *   Analyze the committee's practice (ranking via proxies like church attendance) vs. expressive accounts (Anderson/Chang).
          *   Run analysis backwards: What does the episode say about the *theory* of incommensurability? (Anguish/Revulsion vs. Public Argument).
          *   Analyze the *sequel* (Home dialysis + Medicare 1972) as a natural experiment (Calabresi & Bobbitt's *Tragic Choices*).
