      *   *Refinement on Move 6:* Farid's point about "naming" is crucial. I need to highlight that.
      *   *Refinement on "What's Missing":* The capability approach isn't just about food; it's about voice. Also, the international dimension (global market) is absent from their binary state-vs-nature frame.

  6.  **Final Polish:** Check against the prompt requirements.
