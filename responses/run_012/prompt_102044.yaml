answer: |-
  The structure you have isolated is the central normative friction within the literature on **precommitment** (often colloquially called a **Ulysses Pact** or **Ulysses Contract**). However, while "Ulysses Pact" names the *device*, it does not precisely name the *logical tension* you describe.

  In the philosophical and legal literature, this specific tension—the conflict between a justification that requires identity and a mechanism that requires divergence—is most accurately termed **The Paradox of Diachronic Autonomy**. Sometimes it is referred to more broadly as **The Precommitment Paradox**, though that term often encompasses issues of rationality rather than just authority and identity.

  Since you asked for the carving rather than merely the label, I will define **The Paradox of Diachronic Autonomy** formally, distinguish it from its neighbors, and address your specific questions regarding endorsement and mutual agreement.

  ### 1. Definition: The Paradox of Diachronic Autonomy

  **The Phenomenon:**
  An agent at Time 1 ($A_1$) imposes a constraint on an agent at Time 2 ($A_2$) to prevent $A_2$ from acting on preferences that $A_1$ anticipates $A_2$ will hold.

  **The Tension:**
  The arrangement creates a justificatory contradiction consisting of two necessary but conflicting conditions:
  1.  **The Condition of Authority (Identity):** For the constraint to be legitimate (autonomous rather than oppressive), $A_1$ and $A_2$ must be sufficiently identical that $A_1$'s will counts as $A_2$'s will. ($A_1 = A_2$).
  2.  **The Condition of Necessity (Divergence):** For the constraint to be functional (necessary rather than superfluous), $A_1$ and $A_2$ must be sufficiently distinct that $A_2$'s will diverges from $A_1$'s will. ($A_1 \neq A_2$).

  **The Paradox:**
  The justification relies on the **Continuity of Self** (to claim self-government), while the mechanism relies on the **Discontinuity of Will** (to justify the lock). If the selves are truly one, the constraint is redundant; if they are truly distinct, the constraint is tyranny.

  ### 2. Distinction from Neighboring Concepts

  You correctly noted that several adjacent concepts fail to capture this specific structure. Here is how **The Paradox of Diachronic Autonomy** is distinguished from them:

  *   **Vs. Ordinary Paternalism:**
      *   *Paternalism:* Agent A restricts Agent B for B's good. The justification admits distinct agency ("I know better than you").
      *   *Diachronic Autonomy:* Agent A restricts Agent A. The justification denies distinct agency ("I am you").
      *   *Distinction:* Paternalism resolves the tension by accepting otherness; Diachronic Autonomy attempts to sustain the tension by claiming sameness.

  *   **Vs. The Divided/Successive Self (e.g., Parfit, Schelling):**
      *   *Divided Self:* Posits that $A_1$ and $A_2$ are genuinely different entities (e.g., different neural states, different preference orderings).
      *   *Diachronic Autonomy:* Requires that $A_1$ and $A_2$ be treated as the *same* entity for the purpose of authority, even if they differ in preference.
      *   *Distinction:* The Divided Self theory *dissolves* the paradox by accepting difference. The Paradox of Diachronic Autonomy *preserves* the paradox because the political/moral language requires unity.

  *   **Vs. Constitutional Paradox (Constituent vs. Constituted Power):**
      *   *Constitutional Paradox:* Focuses on the hierarchy of norms (The People vs. The Government). It asks how a higher law can bind a lower authority.
      *   *Diachronic Autonomy:* Focuses on the temporal identity of the authority itself (The People Then vs. The People Now).
      *   *Distinction:* Constitutional theory often sidesteps the identity question by treating "The People" as a mystical entity. Diachronic Autonomy forces the question of whether the "People" at T2 is the same agent as the "People" at T1.

  ### 3. Does the tension vanish if the later agent endorses the arrangement?

  **No, it becomes invisible, but it does not vanish.**

  *   **Latency:** If $A_2$ endorses the constraint, the *Condition of Necessity* (Divergence) is not actualized, but it remains the *reason for the device's existence*. The lock was built because divergence was *expected*.
  *   **The Counterfactual:** The justification still relies on the claim that $A_1$ had the right to bind $A_2$. If $A_2$ endorses it, we retroactively view $A_1$ and $A_2$ as aligned. However, if $A_2$ *changed their mind* and then changed it *back*, the tension re-emerges.
  *   **The Edge Case:** The tension only truly vanishes if the constraint is revocable by $A_2$ without cost. If $A_2$ endorses a constraint they *cannot* remove, the Paradox remains: $A_2$ is currently willing their own inability to will otherwise. This is the structure of **voluntary slavery**, which many philosophers argue is impossible (one cannot voluntarily alienate the capacity to revoke consent).

  Therefore, endorsement makes the tension **practically inert** but **structurally persistent**. The mechanism still presupposes that $A_2$ *could* diverge, even if they currently do not.

  ### 4. Does the structure appear in mutual agreement?

  **Yes, but it shifts from Diachronic to Synchronic/Collective.**

  When two agents bind each other (Contract), the structure transforms into **The Paradox of Sovereign Contract**.

  *   **The Shift:** Instead of $A_1$ binding $A_2$ (same person, different time), it is $A$ and $B$ binding $A$ and $B$ (different persons, same time).
  *   **The Recurrence:** The tension reappears if the contract is intended to bind the *future* selves of both parties (e.g., a marriage vow, a constitution, a treaty).
      *   *Justification:* "We agreed." (Identity of the Collective "We" over time).
      *   *Mechanism:* Enforcement against a party who now wants out. (Divergence of the Collective "We" over time).
  *   **The Difference:** In mutual agreement, the "Sameness" is not personal identity but **Collective Identity**. The tension becomes: *How can the "We" of today bind the "We" of tomorrow?*
  *   **Legal Manifestation:** This is seen in the doctrine of *rebus sic stantibus* (things thus standing) in international law, which allows treaties to be voided if circumstances change fundamentally. This doctrine is essentially an admission that the Paradox of Diachronic Autonomy cannot be sustained indefinitely; the divergence of will eventually overrides the identity of the agreement.

  ### Summary Recommendation

  If you need an established term to search the literature, use **The Precommitment Paradox** (specifically in the works of Jon Elster, *Ulysses and the Sirens*, or Stephen Holmes, *Passions and Constraint*).

  However, if you wish to name the specific *carving* you have identified for the sake of precision, I propose you adopt **The Paradox of Diachronic Autonomy**.

  **Definition:** *The normative contradiction arising when an agent's claim to self-government over time requires asserting both the identity of the self (to justify authority) and the divergence of the self (to justify constraint).*

  This term captures the exact friction you described: it is not merely about binding oneself, but about the impossible dual requirement of being the same enough to rule, and different enough to need ruling.
