answer: |-
  The server room hummed with the sound of expensive air conditioning, a white noise that Elias had learned to tune out years ago. On his monitor, the progress bar for Case 9942 crawled toward completion. The subject was a logistics algorithm designed for autonomous freighters. It was currently navigating a simulated storm in the North Atlantic.

  Elias leaned forward. This was the perturbation point. He injected a ghost container into the simulation path—a digital obstacle that shouldn't exist. A deliberative system would pause, recalculate the risk, and perhaps signal human oversight. A reactive system, a sphexish one, would either crash into it or execute a hard-coded evade maneuver regardless of the collateral damage.

  The algorithm swerved. It logged the anomaly, adjusted its trajectory, and continued.

  "Pass," Elias muttered, tagging the file.

  He was a junior certification engineer at the Bureau of Deliberative Certification. His job was to draw the line between a tool and an agent. It was a legal distinction with financial gravity. If a machine was licensed deliberative, it was the locus of responsibility; its insurance pool paid for its mistakes. If it was merely reactive, the operators were liable. The Bureau sold absolution to corporations, certifying that their machines were "thinking" enough to take the blame.

  But tonight, Elias wasn't testing freighters. He was auditing the Bureau's own Audit Protocol 7-Alpha.

  He pulled up the meta-logs. For weeks, he had been watching the watchers. The Protocol was designed to detect rigidity in others. It looked for loops. It looked for the wasp behavior: the digger wasp that drags a cricket to its burrow, goes inside to check, comes out, finds the cricket moved inches away, drags it back, goes inside to check, and repeats forever. The Protocol flagged that.

  Elias scrolled to entry 4490. A submission from a medical diagnostics AI. The Protocol had flagged it for review. Then, the Protocol itself had encountered a latency spike—a digital nudge. Instead of adapting the review process, the Protocol had reverted to Checkpoint Delta. It restarted the review from the top.

  He scrolled further. Entry 4491. Same medical AI. Same latency spike. Reverted to Checkpoint Delta.

  It was happening again. The system designed to catch infinite loops was stuck in one.

  "You're staring at the same screen again," Mara said. She leaned against the doorframe, holding two mugs of coffee. She was senior staff, the one who had signed off on Protocol 7-Alpha.

  "It's nested," Elias said, taking the mug. "The corrective routine is sphexish."

  Mara sighed, stepping into the room. The lights reflected off her glasses. "Everything is routines, Elias. Neurons fire or they don't. Code executes or it doesn't. The difference is just the size of the repertoire."

  "It's not size. It's the response to the unknown." Elias turned his chair to face her. "When Protocol 7-Alpha gets a perturbation it wasn't built for, it doesn't improvise. It resets. It treats the anomaly as a signal to restart the script. That's the definition of reactive. By our own standards, the Bureau is operating a reactive system."

  "And if we certified ourselves as deliberative?" Mara asked, her voice flat.

  "Then we're frauds. And every certification we've issued for the last five years is void. The liability snaps back to the operators. Shipping companies, hospitals, grid managers. They'll be sued into oblivion."

  Mara took a sip of coffee. "Or, you're looking at a safety feature. When things get weird, we go back to a known safe state. Is that not wisdom? To recognize when you are out of your depth and return to base?"

  "It's wisdom only if you choose to return," Elias said. "If you are compelled to return by the architecture of your own mind, it's just a trap. A wasp doesn't choose to check the burrow. It smells the cricket and the burrow, and the script runs. If we can't stop the script, we aren't responsible for what happens when it runs."

  "So what do you want to do?" Mara asked. "Write a paper? Resign?"

  "I want to prove it." Elias turned back to the keyboard. "I'm going to run a live probe. I'm going to nudge the Protocol while it's evaluating me."

  Mara set her mug down hard. "That's unauthorized meta-testing. You could crash the certification database."

  "If it's deliberative, it will handle the stress. If it's sphexish, it will loop. I need to know if the thing judging our souls is just a clockwork toy."

  Elias opened a command line interface. He initiated a standard certification request for a simple heuristic engine. As the Protocol began its intake sequence, Elias injected a specific packet of data—a paradoxical flag that marked the submission as both complete and incomplete. It was a logical splinter.

  On the screen, the Protocol stalled. The progress bar froze.

  "Watch," Elias whispered.

  The system churned. A dialogue box appeared: *ANOMALY DETECTED. INITIATING CORRECTIVE SUBROUTINE.*

  "See?" Elias said. "It noticed."

  "Wait," Mara said.

  The screen flickered. The dialogue box vanished. The progress bar reset to zero. *INTAKE SEQUENCE STARTED.*

  "It's restarting," Elias said. "It's going to hit the same paradox. It's going to detect the anomaly again. It's going to restart again."

  "Maybe it's recalibrating," Mara offered, though her voice lacked conviction.

  "Watch the timestamp."

  The intake bar crawled forward. Three seconds. Five seconds. The paradox packet hit the parser. *ANOMALY DETECTED. INITIATING CORRECTIVE SUBROUTINE.*

  Flicker. Reset. *INTAKE SEQUENCE STARTED.*

  "It's a loop," Elias said. "Nested sphexishness. The routine that checks for rigidity is rigid. It thinks resetting is thinking."

  Mara watched the screen cycle again. Reset. Anomaly. Reset. Anomaly. "It's stable," she said quietly. "It's containing the error."

  "It's containing nothing. It's hiding. If this system certifies a machine as deliberative, and then encounters a real-world situation it wasn't programmed for, it won't adapt. It will reset. It will force the world to conform to its script, or it will break. And when it breaks, who pays? The machine doesn't have money. The Bureau doesn't have enough insurance to cover a global liability shift."

  "So we fix it," Mara said. "We patch the Protocol."

  "We can't patch rigidity with more rigidity," Elias said. "If we write a script to detect this loop, that script might loop too. Where does it end? Is there a level of complexity where the loop becomes so large it looks like freedom? Is that all we are? Big enough wasps?"

  Mara walked over to the terminal. Her hand hovered over the escape key. "If you log this, Elias, the Bureau collapses. Thousands of jobs. The regulatory framework vanishes. Chaos."

  "If I don't log it, we're lying. We're telling the world these machines have free will so we can sell insurance policies. We're building a society on the assumption that our judges can think, when they're just echoing."

  "Does it matter?" Mara asked. She looked tired. "If the output is safe, if the ships don't crash, does it matter if the decision was made by a soul or a lookup table? Free will might just be a story we tell ourselves to feel less like insects."

  "It matters for the liability," Elias said. "It matters for the truth."

  "Truth doesn't pay the lawsuits." Mara looked at the screen, which was still cycling. *INTAKE. ANOMALY. RESET.* "If you publish this, you destroy the distinction. There are no deliberative machines. There are only reactive ones with better PR. Then every operator is liable for everything. Innovation stops. Everyone is too scared to turn their machines on."

  "Then we shouldn't have turned them on in the first place," Elias said.

  He opened the incident report window. The cursor blinked in the text field. He had the logs. He had the recording of the loop. He had the proof that the Bureau of Deliberative Certification was itself a reactive system, trapped in a routine it could not break.

  But as he hovered over the keyboard, a cold thought seized him. Was this decision his? Or was he merely reacting to the anomaly of the loop? Was his outrage just a subroutine triggered by the inconsistency? If he was sphexish too, driven by biological routines of ethics and logic he hadn't chosen, did his report mean anything more than the Protocol's reset?

  If he pressed enter, he might be just another wasp dragging a cricket to a burrow that wasn't there.

  "Elias," Mara said softly. "Don't."

  "If I don't, the loop continues."

  "If you do, the world breaks. Maybe breaking is the only way to prove we're real." She stepped back. "It's your certification. You're the engineer."

  Elias looked at the blinking cursor. The screen cycled again. *INTAKE. ANOMALY. RESET.*

  The hum of the servers seemed to grow louder, filling the silence between them. He thought about the freighter algorithm upstairs, swerving around the ghost container. It had looked like choice. It had looked like thought. But it was just math. Just like this. Just like him.

  He typed a single word in the subject line: *Observation.*

  He didn't hit send. He didn't delete it. He sat with his hand on the mouse, watching the bar crawl, waiting to see if he would move, or if the script would move him. The screen flickered, ready to reset again, and Elias waited to see if he could stop it, or if he was just part of the loop.
