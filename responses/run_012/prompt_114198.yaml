answer: |-
  The wind was doing what it always did in November, throwing itself against the limestone face of the museum as if it intended to knock the building into the harbor. Inside the Hall of Human Origins, the noise was muffled to a low, constant thrum, like the building was breathing heavily. Vera stood on the ladder, wrapping a cast of *Australopithecus* in acid-free tissue. Her hands knew the weight of these skulls better than they knew the weight of her own grandchildren. Thirty years of lifting, turning, cataloging. Now she was putting them to bed.

  The hall was half-crated. Fiberglass shells of early hominids stood in wooden coffins, waiting for the move to the storage facility in Jersey. The placards were down. The lighting had been dimmed to save power. It looked less like a temple of science and more like a shop closing for bankruptcy.

  "You're packing the brow ridges wrong," a voice said from the shadows near the entrance.

  Vera didn't turn. She smoothed the tissue over the orbital socket. "If you're here to help, Julian, take the tape gun. If you're here to critique, there's a bar across the street that doesn't close until four."

  Julian stepped into the pool of light from the work lamp. He looked older than when he'd left her lab ten years ago, softer around the middle, but he still had that specific shine in his eyes that meant he'd been thinking about a single idea for too long. He held two cups of coffee. He offered one up.

  "Black. Two sugars. I remembered," he said.

  "You remembered because I never changed." She climbed down the ladder, her knees popping in sympathy with the wind outside. She took the coffee. "Why are you here, Julian? The gala is tomorrow. The donors want to see the sad curator giving her farewell speech. They don't want to see me taping boxes."

  "I wanted to see the hall before it became inventory." He walked toward the centerpiece, the display of *Homo sapiens* skulls that ran the gamut of global variation. He ran a hand along the glass case. "It's quiet in here. It feels like... like the argument is over."

  "The argument is never over. We're just moving the evidence."

  "Are we?" Julian turned to her. "Or are we admitting that the story we told in here doesn't fit anymore?"

  Vera took a sip of coffee. It was too hot. "I told the truth. We are shaped by what worked. The things we have are the things that kept us alive. The whites of the eyes to signal trust. The ability to synchronize movement to music so the tribe stays cohesive. It's all function, Julian. It's all tools."

  "It's all tools," he repeated, tasting the words. "That's the adaptationist hammer. If you have it, everything looks like a nail."

  "And if you don't," Vera said, setting the cup on a crate labeled *FRAGILE - PLEISTOCENE*, "everything looks like an accident."

  Julian walked over to the far wall, where the architecture of the museum itself curved into a vaulted ceiling. He pointed up. "See those triangular spaces? Where the arch meets the square of the wall?"

  "Spandrels," Vera said. She kept her voice flat.

  "Spandrels," he said, and she could hear the satisfaction in it, the word landing like a coin in a slot. "Nobody designed them to hold mosaics. Nobody said, 'We need a triangle here to convey divine glory.' They are just what happens when you put a dome on a square room. They are structural necessities. Leftovers."

  "We are not a church, Julian."

  "Aren't we?" He turned back to her. "You've spent thirty years telling people that every bit of us was forged in the fire of survival. But what if some of it is just the geometry of being a mammal? What if the way we cry at movies isn't because grief signaling saved us on the savanna, but because it's a side effect of having a brain complex enough to simulate others' pain? It's the mosaic in the spandrel. We painted it later because it was there, not because it was built for it."

  Vera picked up the tape gun. She pulled a length of clear plastic. The sound was sharp, tearing through the hum of the wind. "You know the problem with spandrels, Julian? You can tell a just-so story about a leftover just as easily as you can tell one about a tool. You can say, 'Oh, this trait is useless noise,' and there's no way to prove you wrong. It's a free pass. It lets you off the hook from finding the mechanism."

  "It lets me off the hook from pretending there's a mechanism where there isn't one," he countered. "You look at a trait, see it's useful now, and assume it was selected for that. That's backwards. Usefulness now tells you nothing about origin."

  "Then give me one," Vera said. "Give me a trait that is purely a spandrel. No utility. Just noise."

  Julian smiled. He had been waiting for this. "The chin."

  Vera laughed, a short, dry sound. "The chin."

  "The human chin. No other ape has it. It doesn't help us chew. It doesn't help us breathe. In fact, it's a weak point in the jaw. It's just what happens when the horizontal growth of the face meets the vertical growth of the mandible. Two processes crashing into each other. The chin is the debris."

  "It sticks out," Vera said. "It's visible. It's sexually dimorphic. Men's chins are square, women's are pointed. That's not debris. That's signaling."

  "That's exaptation," Julian said. He used the word carefully. "Maybe later we used it for signaling. Maybe later we used it for muscle attachment. But it didn't start there. It started as structural noise. And if the chin is a spandrel, Vera, how many other things you call 'human nature' are just the triangular bits in the dome?"

  The wind gusted harder. Somewhere high above, a window pane rattled in its frame. Vera looked at the crate in front of her. Inside was a collection of hand axes from the Acheulean tradition. Teardrop shaped, symmetrical, beautiful.

  "Look at these," she said, tapping the wood. "They're too symmetrical to be just for cutting. They're too heavy. Some of them show no wear. We think they were made to be held. To show off motor control. To say, 'I have the energy to waste on perfection.' That's sexual selection. That's adaptation."

  "Or," Julian said, leaning against the crate, "maybe the symmetry is a byproduct of how the brain controls bilateral movement. You try to hit the core, you get symmetry for free. Then you notice it looks nice, so you keep it. Which part is the tool and which part is the spandrel?"

  "That's the thing that keeps you up at night, isn't it?" Vera asked softly. "That you can't tell where the noise ends and the signal begins."

  "It's the thing that should keep you up," he said. "Because if you're wrong, you've built a career on seeing design where there is only geometry."

  Vera walked over to the donor wall. It was a plaque of brass names, people who had given money to keep the lights on. One name was highlighted with a piece of blue painter's tape. Mr. Henderson. He had donated the funds for the new lighting system before the closure was announced. He wanted his name on the spotlight that hit the *Homo sapiens* case.

  "Henderson wants to know if his name goes on the crate or the new wing," Vera said.

  "Does it matter?"

  "It matters to him. He wants to be useful. He wants to be an adaptation." She turned back to Julian. "You talk about leftovers like they're nothing. But a leftover can save your life. Feathers didn't start for flying. They started for warmth. Leftovers. Thermoregulation. But then you jump off a cliff with them, and suddenly you're an eagle. The spandrel becomes the arch."

  Julian nodded slowly. "Exaptation. I know."

  "I know you know." Vera walked back to the ladder. "I'm not saying everything is perfect design. Nature is a tinkerer, not an engineer. She uses what's at hand. But to say it's all just... architectural noise? That denies the pressure. The wind outside doesn't care about our geometry. It knocks down the weak structures. If the chin was truly useless, if it was truly just debris, why did it stay? Why didn't selection grind it away?"

  "Because it wasn't costly enough to remove," Julian said. "Not everything has to be optimized. Some things just... persist."

  "Like this museum," Vera said. She looked around the hall. "It was built to show progress. A march from ape to man. Linear. Upward. That was the design. But now? Now it's being closed. The building is still here. The stones are still here. But the purpose has shifted. Is it still a temple of progress? Or is it now a warehouse of memory?"

  Julian looked up at the vaulted ceiling. "It's both. Depending on who's walking through the door."

  "That's my point." Vera climbed the ladder again. She picked up the *Australopithecus* cast. It was light, hollow fiberglass, but it felt heavy in her hands. "You want to sort us into bins. Adaptation. Spandrel. Function. Noise. But life doesn't use bins. It uses what works. If a spandrel keeps the roof up, it's functional. If a trait starts as noise and becomes a signal, it's selected. The line isn't real, Julian. It's just a way for us to sleep at night."

  Julian was quiet for a long time. He walked over to the crate of hand axes. He picked one up. It was a replica, but heavy enough to feel real. He held it in his palm, testing the balance.

  "I used to think you were rigid," he said. "When I was in your lab. I thought you saw tools everywhere because you wanted the world to make sense. That if everything had a reason, then we were safe. Understandable."

  "And now?"

  "Now I think I wanted the world to be messy because if it's messy, I don't have to find the reason." He put the axe back. "But you're right. It doesn't matter what it started as. It matters what it does now."

  "It matters what it becomes," Vera corrected. She began taping the crate shut. The sound of the tape was rhythmic, final. *Zzzzip. Snap. Zzzzip. Snap.*

  The lights in the hall flickered. The storm outside was hitting the grid hard. The backup generators hummed to life, a diesel cough that vibrated through the floor.

  "We should go," Julian said. "Before the power cuts completely."

  "One more box."

  "Vera."

  "She spent thirty years in here," Vera said, ignoring him. She was looking at the last crate. It wasn't filled with skulls or tools. It was filled with the placards. The text panels. The explanations. *'Selected for endurance running.' 'Evolved for social cohesion.'*

  "What are you doing?" Julian asked.

  "Packing the story," she said. She lifted a panel that read *THE ADAPTIVE VALUE OF LANGUAGE*. She wrapped it in bubble wrap. "You know, when I started, we didn't have the genetic tools we have now. We had bones and stones. We had to infer the soft tissue from the hard. We had to guess the behavior from the shape. We told stories to bridge the gaps."

  "And now we have the genes."

  "And now we have more gaps," Vera said. "We know so much more about what we are, and less about why. Maybe that's better."

  She sealed the box. She wrote *HALL OF ORIGINS - TEXT* on the side in black marker. Her handwriting was shaky.

  Julian came up the ladder and took the marker from her. He wrote his own name below hers on the box label. *J. ARKOWITZ*.

  "Why are you doing that?" Vera asked.

  "Because I helped," he said. "Even if I was just arguing."

  "You were holding the flashlight."

  "That's structural support," he said. "That's load-bearing."

  Vera smiled, just a little. She climbed down. Her knees protested. The wind howled again, a long, low note that sounded like a whale singing in the deep dark. It made the hair on her arms stand up. It was the sound of the outside world, indifferent and vast.

  "Come on," she said. "I'll let you buy me a drink. But not across the street. Somewhere with food."

  They walked toward the exit, turning off the work lamps as they went. The hall sank back into shadow. The skulls disappeared into their crates. The spandrels in the ceiling faded into the dark, indistinguishable from the arches that held them.

  At the door, Vera paused. She looked back at the empty space. The hall looked different without the lights. Less like a narrative and more like a room. Just a space where things had been kept for a while.

  "Do you think we were wrong?" Julian asked. "About any of it?"

  Vera put her hand on the door handle. The metal was cold. "I think we were trying to draw a map of a river while standing in the water. The water moves. The banks shift. Sometimes the river floods and makes a new channel where there wasn't one before."

  "That's not an answer."

  "It's the only one I have." She pushed the door open. The wind hit them immediately, cold and wet, smelling of salt and rain. It whipped her hair across her face. She didn't bother to fix it. "Come on. Before we drown."

  They stepped out into the storm. Behind them, the museum stood solid against the wind, a square room with a dome on top, holding its shape against the pressure. Inside, the crates sat in the dark, full of bones and stories, waiting to see what they would be used for next.
