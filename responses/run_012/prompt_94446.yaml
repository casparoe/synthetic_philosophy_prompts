answer: |-
  Your analysis is substantively sound for the purpose of a policy speech. The only minor nuance is that American federalism does employ positive duties through conditional spending grants, though you are correct that the rhetorical tradition emphasizes the negative. I will proceed with your framework as the foundation for the address.

  ***

  Good evening. It is an honor to stand before you as we mark one hundred years of this association. A century is a long time to spend arguing about who owns the water pipes, and I suspect if we could summon the founders of this organization from 1924, they would be surprised to find us still having the same argument, just with better microphones and colder salad. I run a municipal law clinic at the state university, which means my students and I spend our days reading the fine print of the disputes you live through. We see the zoning appeals, the boundary disputes, and the interlocal agreements that land on our desk when the handshake deals stop working. So when I look out at this room, I do not see enemies. I see colleagues who are stuck in a hard place, trying to govern communities that are changing faster than the laws that bind them.

  I know the shape of this room. I know that down the center aisle, there is a fault line. On one side, you have the larger suburban towns looking at the cost of emergency dispatch, the complexity of transit networks, and the engineering requirements of regional water systems, knowing that scale brings efficiency and resilience. On the other side, you have the small rural towns looking at those same proposals and seeing absorption. You hear "regional district" and you think "loss of voice." Both sides have spent this year quoting the principle of subsidiarity at each other. Both sides claim it as a shield. And both sides are using it to mean "the decision should be made by whoever I happen to be."

  I am not here to tell you who is right about the regional service districts. I am not here to resolve the fight. If I tried to solve that in fifteen minutes, I would be arrogant, and you would be right to ignore me. Instead, I want to hand you a better version of the principle you are already fighting over. I want to give you a version of subsidiarity that is sharp enough to cut through the fog, robust enough to survive contact with reality, and useful enough that you can take it back to a board meeting on Monday morning without sounding like you are reading from a philosophy textbook.

  To do that, we have to admit that subsidiarity is not a single rule. It is two duties pulling in opposite directions. There is a negative duty: a larger body must not absorb what a smaller body can do for itself. This is the duty the rural towns are citing when they say keep our dispatch local. It is the protection of local capacity. But there is also a positive duty: the larger body owes the smaller one real help with the things the smaller one genuinely cannot manage alone. This is the duty the suburban towns are citing when they talk about water infrastructure that crosses county lines. In American arguments about federalism, we almost entirely talk about the negative duty. We talk about states' rights, local control, and getting the government off our backs. The positive duty, the obligation to assist, is where the deeper tradition of the idea lives. It is why telling a small town to "just handle it yourself" when the task exceeds their tax base sounds to some people in this hall like half a principle. If we are going to use this word, we have to acknowledge that it cuts both ways. It protects the small from the big, but it also obligates the big to support the small.

  We also need to stop confusing subsidiarity with decentralization. They are not the same thing. Decentralization is about where power sits on a map. It is structural. Subsidiarity is about who should decide based on the function at hand, and it isn't only territorial. It applies inside a level too. It is the county deciding something the town could have decided, but it is also the town council deciding something a neighborhood association could have decided. If you decentralize power to a town council, but that council centralizes decision-making within itself rather than letting the relevant committees or neighborhoods handle what they can, you have not achieved subsidiarity. You have just moved the bottleneck. For the suburban towns advocating for regional districts, this means you cannot simply create a larger bureaucracy and call it efficiency. If the regional district absorbs decisions that could be made by the member towns, you are violating the principle even if you are right about the scale. For the rural towns, this means local control is not an absolute virtue if the town council is hoarding decisions that belong to the citizens. The principle demands we look at the task, not just the jurisdiction.

  This brings us to the hard problem, the one that keeps municipal attorneys up at night. The hard problem is who decides who decides. If the higher level is the one that gets to determine when the higher level may act, then the principle is advisory and nothing more. It becomes a suggestion box. That is why the enforcement machinery matters more than the slogan. Somebody has to be able to say no to the level that wants to act, and where you put that somebody decides most of the outcomes. In our state, sometimes that somebody is the legislature. Sometimes it is the courts. Sometimes it is a referendum. When you argue about regional districts, you are actually arguing about where the veto power lives. The pro-district side wants the veto to lie with the regional body so that holdouts cannot jeopardize the system. The anti-district side wants the veto to lie with the individual town so that consent is never presumed. You are not just arguing about water; you are arguing about the lock on the door. Acknowledging this does not solve the dispute, but it stops you from pretending it is merely a technical debate about pipe diameter. It is a constitutional debate about authority.

  There is another reason you are talking past each other, and it is because there are two different triggers for when a higher body may step in. People in this room are running different tests without realizing it. The first is the efficiency reading. Under this reading, the higher body may act when it can achieve the objective better, weighing scale and effects. That is roughly how modern administrative states are written. It asks whether the objective could have been achieved by the member states themselves, at the central or the regional or the local level. If the regional level can do it cheaper and safer, the regional level should do it. This is the argument for consolidated dispatch and regional water. It is a utilitarian argument. It is about output.

  The second trigger is the dignity reading. Under this reading, the higher body may act only when the smaller one truly cannot act at all. This is because doing things through smaller bodies is a matter of respect for persons and not merely a matter of output. It assumes that self-governance has value even when it is slightly less efficient. It assumes that a town managing its own affairs is a good in itself, regardless of the cost per unit of service. Those two triggers give different answers on nearly every real case. I suspect this association has been having the efficiency-versus-dignity argument all year without knowing it. The suburban towns are arguing from efficiency. The rural towns are arguing from dignity. Neither is misusing the principle. They are just using different versions of it. If you want to move forward, you have to admit which version you are selling. If you are pro-district, admit that you are prioritizing efficiency over local autonomy in this specific instance. If you are anti-district, admit that you are prioritizing local autonomy over potential cost savings. Stop pretending that subsidiarity dictates one outcome. It frames the trade-off.

  Finally, I cannot give this speech without saying the quiet part out loud. There is a concept called fiscal equivalence. It means that if the level that decides isn't the level that pays, then subsidiarity just becomes a way for somebody else to spend your money. The rural towns are not wrong to ask who is on the hook for the regional district. If the regional board decides to upgrade the system, but the assessment falls disproportionately on the small towns, then the decision-making power has been severed from the fiscal responsibility. That is not subsidiarity; that is exploitation. But the reverse is also true. If the small towns block a regional upgrade that benefits the whole system, and the cost of that delay falls on the larger towns, then the smaller body is imposing costs it does not bear. Fiscal equivalence requires that the boundary of the decision matches the boundary of the cost. When you draw the map for these service districts, you are drawing the bill. You cannot separate the governance structure from the tax structure. If you try, you will end up in court, and my students will be reading the briefs in ten years.

  So where does that leave us at the centennial? It leaves us with a principle that is heavier than a slogan. It leaves us with the understanding that subsidiarity is not a magic wand that makes the conflict disappear. It is a framework for managing the conflict honestly. For the suburban towns, you have a real argument based on the positive duty of assistance and the efficiency trigger. You can say that some tasks genuinely exceed the capacity of small jurisdictions, and that refusing to scale is refusing to solve the problem. But you must accept the negative duty. You must design the regional district so that it does not absorb decisions that the towns can still make. You must leave room for local variation where scale is not required.

  For the rural towns, you have a real argument based on the negative duty of non-absorption and the dignity trigger. You can say that local control is a value worth paying for, and that consolidation threatens the identity of the community. But you must accept the positive duty. You must acknowledge that there are things you cannot do alone, and that refusing help because it comes with strings attached might leave your citizens underserved. You must be willing to define what "cannot do alone" actually means. Is it technical impossibility? Is it financial ruin? If you cannot define the limit of your capacity, you cannot claim the protection of the principle.

  This is the work for the next hundred years. It is not about finding the perfect boundary line. It is about building the machinery to adjust the line when the reality changes. It is about admitting that the negative and positive duties will collide. They will collide on the water board. They will collide on the transit authority. They will collide on emergency dispatch. When they collide, you will have to choose which duty weighs more in that specific instance, and you will have to own that choice. Do not hide behind the word subsidiarity to avoid the hard choice. Use the word to illuminate the choice.

  I know you want me to tell you who wins. I know you want me to say that the principle demands regional districts, or that the principle forbids them. I will not do that. To do so would be to lie to you. The principle does not settle the fight. It elevates it. It forces you to argue about capacity instead of power. It forces you to argue about dignity instead of turf. It forces you to argue about who pays instead of who decides. That is a better argument. It is a harder argument, but it is the only one worthy of a century of governance.

  You are the stewards of this state's local government. You are the ones who have to sign the agreements. You are the ones who have to explain the rates to the voters. You are the ones who have to live with the consequences when the dispatch system fails or the water main breaks. My hope is that when you go back to your towns and your counties, you take this dual nature of the principle with you. When someone cites subsidiarity to stop a project, ask them about the positive duty. When someone cites subsidiarity to start a project, ask them about the negative duty. When someone talks about efficiency, ask them about dignity. When someone talks about control, ask them about the bill.

  We are not going to resolve the tension between the big and the small tonight. We are not going to draw the final map. But we can agree to stop using our shared principles as weapons of convenience. We can agree that the health of this state depends on both the capacity of the region and the vitality of the town. It depends on knowing when to join hands and when to stand apart. It depends on knowing that sometimes the larger body must step in, and sometimes it must step back, and that knowing the difference is the work of government.

  Thank you for your service, thank you for your patience, and happy centennial. Let us get back to work.
