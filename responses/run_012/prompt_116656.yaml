answer: |-
  Here is the breakdown of my credence that your graded/statistical teleosemantics can succeed as a naturalistic theory of content.

  **P(Some teleosemantic strategy is the right naturalistic approach at all) = 0.65**
  *Teleosemantics remains the only framework that robustly naturalizes normativity (misrepresentation) without invoking homunculi, despite its known flaws.*

  **P(A graded version escapes the indeterminacy objection) = 0.55**
  *Treating content as vague or degree-theoretic dissolves the demand for sharp boundaries, but risks making content too fuzzy to explain precise behavioral guidance.*

  **P(It doesn't collapse into "content is whatever useful for us to ascribe") = 0.35**
  *This is the critical failure mode; "proportions of selection history" are notoriously description-sensitive, often smuggling in the interpreter's interests you aim to exclude.*

  **P(It survives cases where function and content come apart) = 0.45**
  *History-dependent views inherently struggle with novel environments or Swampman cases where current reliability diverges from ancestral selection pressures.*

  **Combined Credence = 0.25**
  *While the graded approach is philosophically sophisticated, the dependency on the third term (avoiding instrumentalism) severely constrains the probability of the whole project succeeding as realism.*

  ***

  ### The Weakest Link & Moving the Needle
  I am least sure about **P(It doesn't collapse into instrumentalism)**. The danger is that calculating "proportions of selection history" requires individuating the environmental conditions (flies vs. dots vs. retinal shadows), and that individuation often relies on the very intentional descriptions you are trying to reduce. To move this credence up, I would need to see a formal, non-intentional metric for "selection trials" that yields the same proportions regardless of how an observer describes the environment (e.g., a purely physicalist account of the selection gradient).

  ### You vs. Your Friend
  Your disagreement lives in the **ontology of content**. You are trying to save **Realism** (content is a mind-independent natural property, even if graded), while your friend advocates **Instrumentalism** (content is a tool for predicting system behavior, grounded in current dynamics like prediction error). Your graded view actually moves you closer to your friend than you might realize: by admitting content is a "coarse gloss" on a messy reality, you are conceding that content is partly constituted by the level of description we choose, which is the instrumentalist's core claim. The debate is no longer about whether content is real, but whether the "grading" is fixed by history (you) or by current model fit (them).
