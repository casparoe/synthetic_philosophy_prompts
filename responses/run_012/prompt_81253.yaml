      *   *Least sure claim:* Highlight this at the end.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Campfire exclusion:* Both agree it's not alive. Camp 1: It doesn't maintain a specific bounded structure (it dissipates). Camp 2: It doesn't encode heredity (wind doesn't select for 'better fire genes').
