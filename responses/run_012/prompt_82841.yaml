prompt: |-
  For thirty years I ran controlled experiments on living systems, and I have spent the last four reading moral philosophy. I keep returning to the dispute between neo-Aristotelian virtue ethicists, who hold that durable traits of character are the proper unit of moral assessment and explanation, and situationists, who hold that behavior is better predicted by features of the immediate situation and better improved by institutional design than by character. Each side, it seems to me, answers the other's strongest point with something that functions as a rescue clause, and I would like the two of them to produce the document I would have demanded of two laboratories that had spent a decade contradicting each other in print.

  Draft that document. It should contain the following.

  A numbered list of claims both sides can sign. Include the findings neither disputes (the familiar battery in which ordinary helping and honesty shift substantially with hurry, ambient noise, an unexpected small windfall, or the mere presence of bystanders), what each side's positive position actually asserts rather than what its critics say it asserts, and the methodological points both accept about how single-occasion correlations, behavior averaged across many occasions, and person-by-situation interactions should be read. If a claim would be signed by anyone at all, cut it.

  A disagreements table: one row per genuine disagreement, with the question at issue and then each side's position stated in wording that side would accept as its own.

  The cruxes, ordered by how much turns on each. For each crux, say why settling it would move at least one side; give a study, argument, or case that both sides agree would bear on it; and record each side's prediction in advance. I want the sharp ones — whether a trait that shows up only in aggregate behavior counts as a trait, whether a virtue acquired in one setting must transfer to a structurally different one, and how many occasions of observation the virtue ethicist needs before evidence could count for or against a trait's existence. Where a number is possible, give me the number and the design that would estimate it.

  A section separating the disagreements that are real from those that are verbal, saying which piece of vocabulary is doing the work — in particular whether "virtue" names a standard for what a good person would do or a prediction about what people in fact do.

  Finally, the single experiment both sides agree is worth running, and what each would count as evidence against its own position. If either position can be made immune to every possible result, say so plainly, and say what would have to be fixed for it to be falsifiable. I do not need a bibliography; I need the logic, the formulations, and the designs.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Persona:** A researcher with 30 years of experience in controlled experiments on living systems, now 4 years into moral philosophy. Pragmatic, demanding empirical rigor, frustrated by theoretical evasion ("rescue clauses").
      *   **Task:** Draft a consensus/disagreement document between Neo-Aristotelian Virtue Ethicists (VE) and Situationists (SIT).
      *   **Required Sections:**
          1.  Numbered list of agreed claims (no trivialities, must be substantive).
          2.  Disagreements table (genuine disagreements, phrased acceptably to both).
          3.  The Cruxes (ordered by importance, why it matters, agreed-upon evidence/case, specific predictions/numbers/designs).
          4.  Verbal vs. Real Disagreements (specifically regarding the definition of "virtue").
          5.  The Single Experiment (falsifiability conditions for both).
      *   **Tone:** Precise, empirical, logical, no fluff, no bibliography.
      *   **Constraint:** "If a claim would be signed by anyone at all, cut it." (Meaning: only include claims specific to this debate that both actually accept, not general platitudes).

  2.  **Deconstruct the Debate (VE vs. SIT):**
      *   **Virtue Ethics (Neo-Aristotelian):** Morality is about character traits (virtues). These are stable dispositions. Moral improvement is about cultivating these traits.
      *   **Situationism:** Empirical psychology (e.g., Milgram, Zimbardo, Darley & Batson) shows behavior is driven by situational factors, not stable traits. "Global traits" don't exist. Moral improvement is about designing situations/institutions.
      *   **The "Rescue Clause" Problem:** VE says "Traits are stable *across relevantly similar situations* over *long periods*." SIT says "If the cross-situational consistency is that low, it's not a trait in the folk-psychological sense."

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Constraint Check:* Must not be trivial. Must be specific to the debate.
      *   *Idea 1:* Both accept the empirical data (Darley & Batson, etc.).
      *   *Idea 2:* Both accept that behavior is a function of Person x Situation.
      *   *Idea 3:* Both accept that "perfect" consistency is not required for traits (VE doesn't demand saints, SIT doesn't demand robots).
      *   *Idea 4:* Both accept that aggregation increases predictability.
      *   *Refinement:* Make these punchy and technical.
      *   *Drafting:*
          1.  Empirical findings on helping/honesty (Good Samaritan, Phone Booth, etc.) are accepted as valid data by both.
          2.  Behavioral variance is partitioned into Person, Situation, and Interaction. Both agree the Interaction term is non-zero.
          3.  Aggregation: Predictive power of personality measures increases with the number of behavioral observations averaged.
          4.  Normativity vs. Descriptivity: Both agree virtue ethics is primarily normative, but relies on psychological feasibility (the "ought implies can" constraint).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Genuine disagreements, phrased neutrally.
      *   *Row 1: Existence of Global Traits.* VE: Robust cross-situational traits exist in normal adults. SIT: Empirical evidence shows consistency coefficients are too low to support "global" traits.
      *   *Row 2: Moral Improvement.* VE: Focus on internal character cultivation. SIT: Focus on external situational design.
      *   *Row 3: Folk Psychology.* VE: Virtue terms track real psychological structures. SIT: Virtue terms are misleading folk theories not supported by data.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Requirement:* Order by importance. Why it matters. Agreed evidence. Predictions/Numbers.
      *   *Crux 1: The Aggregation Threshold.* How many observations make a trait "real"?
          *   *Design:* Longitudinal behavioral tracking.
          *   *Number:* VE needs a specific correlation coefficient (r) over N occasions to claim trait existence. SIT claims r will remain below .30 even at high N.
      *   *Crux 2: Transferability.* Does virtue in Context A predict Context B?
          *   *Design:* Cross-domain testing (e.g., honesty in tax vs. honesty in marriage).
          *   *Prediction:* VE says significant positive correlation. SIT says near zero once situational variables are controlled.
          *   *Why it matters:* If no transfer, "character" is just a label for a specific habit, not a moral unity.
      *   *Crux 3: The "Rescue Clause" Limit.* When does modifying the definition of "virtue" make it vacuous?
          *   *Argument:* If virtues only apply to "relevantly similar" situations, who defines relevance?
          *   *Prediction:* VE must define relevance *ex-ante*. SIT predicts *ex-post* rationalization.

  6.  **Drafting Section 4: Verbal vs. Real Disagreements:**
      *   *Focus:* The word "Virtue."
      *   *VE Usage:* Normative ideal + psychological disposition.
      *   *SIT Usage:* Descriptive psychological prediction (folk trait).
      *   *Resolution:* If VE admits "Virtue" is an ideal *goal* rather than a *current description*, SIT's empirical attack weakens (is attacking a straw man). If VE insists it's a *current description*, SIT's data holds.
      *   *Verbal:* Whether we call the *capacity* for improvement a "trait."
      *   *Real:* Whether current adult psychology supports the *stability* required for moral responsibility ascriptions.

  7.  **Drafting Section 5: The Single Experiment:**
      *   *Goal:* Falsifiability.
      *   *Design:* A high-stakes, multi-domain longitudinal study.
      *   *VE Falsification:* If cross-situational consistency (corrected for reliability) stays below r = .40 after 50 observations across 5 distinct moral domains over 2 years.
      *   *SIT Falsification:* If a specific training intervention (character education) produces cross-situational transfer (r > .40) that situational controls cannot explain.
      *   *Immunity Check:* VE is often immune by redefining "relevant situations." SIT is often immune by claiming "unmeasured situational variables."
      *   *Fix:* Pre-register situational similarity metrics.

  8.  **Review and Refine:**
      *   *Tone Check:* Is it dry and experimental? Yes.
      *   *Constraint Check:* Did I cut trivial claims? (e.g., "Murder is bad" - cut).
      *   *Specifics:* Ensure numbers are proposed for the cruxes (e.g., correlation coefficients, number of occasions).
      *   *Voice:* Maintain the voice of the experimentalist demanding a lab report.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the Agreed Claims, ensure I don't just say "Psychology is hard." Make it about the *structure* of the debate.
      *   *Correction:* In the Cruxes, ensure the "Why it matters" links back to moral assessment, not just psychology.
      *   *Correction:* Make sure the "Single Experiment" isn't just "do more research." It needs specific falsification conditions.

  10. **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  **MEMORANDUM OF UNDERSTANDING AND DISAGREEMENT**
  **SUBJECT:** Empirical Foundations of Moral Character
  **PARTIES:** Neo-Aristotelian Virtue Ethicists (VE) / Moral Situationists (SIT)
  **DATE:** October 26, 2023

  ### I. JOINT CLAIMS (SIGNED BY BOTH)

  1.  **Empirical Baseline:** Both sides accept the validity of the standard experimental battery (e.g., Darley & Batson's Good Samaritan, Isen & Levin's Phone Booth, Milgram's Obedience). Both agree that in single-occasion trials, situational variables (hurry, noise, bystanders, authority) often predict behavioral variance better than measures of self-reported character.
  2.  **Interactionism:** Both sides reject pure dispositionalism and pure situationalism. Behavior ($B$) is accepted as a function of Person ($P$), Situation ($S$), and the Interaction ($P \times S$). Neither side claims the Interaction term is zero.
  3.  **Aggregation Effect:** Both sides accept the psychometric principle that the reliability and predictive validity of personality measures increase as the number of behavioral observations aggregated increases. A single act is a noisy signal; an average of many acts is a clearer signal.
  4.  **Feasibility Constraint:** Both sides accept that a normative ethical theory requiring psychological capacities humans demonstrably lack is defective ("ought implies can"). VE claims virtues are attainable; SIT claims global virtues are not attainable for most humans via current methods.
  5.  **Non-Perfectionism:** VE does not claim virtues are exceptionless habits (the "Saint" objection is a straw man). SIT does not claim humans are robots with no internal states (the "Automaton" objection is a straw man). The dispute is over the *degree* of cross-situational consistency required to warrant the label "character trait."

  ### II. DISAGREEMENTS TABLE

  | Question at Issue | Virtue Ethicist Position (VE) | Situationist Position (SIT) |
  | :--- | :--- | :--- |
  | **Existence of Global Traits** | Robust, cross-situational dispositions (virtues/vices) exist in normal adults, even if activated probabilistically. They are the primary explanatory unit for moral behavior. | "Global" traits (e.g., Honesty simpliciter) do not exist as psychological realities. Behavior is best explained by "local" habits tied to specific situational cues. |
  | **Moral Improvement** | The primary path to moral improvement is the cultivation of internal character structures (habituation, practical wisdom) that resist situational pressure. | The primary path to moral improvement is institutional and situational design (nudges, checks, incentives) that bypasses the unreliability of character. |
  | **Folk Psychology** | Virtue terms track real, causally efficacious psychological structures. Eliminating them degrades our capacity for moral deliberation and responsibility. | Virtue terms are part of a false folk-psychology. Retaining them encourages the Fundamental Attribution Error and blinds us to systemic causes of harm. |
  | **Consistency Threshold** | The observed consistency in empirical studies is sufficient to ground ascriptions of character, provided we account for *relevant* situational differences. | The observed consistency (typically $r < .30$ across dissimilar situations) is too low to support the robustness required for moral responsibility or prediction. |

  ### III. THE CRUXES (ORDERED BY IMPACT)

  **1. The Aggregation Threshold (High Impact)**
  *   **Why it matters:** If traits only appear after aggregating hundreds of observations, they cannot support everyday moral assessment (which relies on limited data). If they appear after few observations, SIT's empirical attack fails.
  *   **Agreed Evidence:** A longitudinal study measuring specific moral behaviors (honesty, helping, courage) across distinct domains.
  *   **VE Prediction:** Cross-situational correlation will stabilize above $r = .40$ after $N = 20$ observations per subject.
  *   **SIT Prediction:** Cross-situational correlation will plateau below $r = .30$ even at $N = 50$ observations, indicating no underlying global factor.
  *   **Design:** 200 subjects. 5 moral domains (financial, physical risk, social truth-telling, resource allocation, rule compliance). 10 trials per domain over 6 months. Calculate split-half reliability of the "general virtue factor."

  **2. Transferability of Acquired Virtue (High Impact)**
  *   **Why it matters:** VE claims *phronesis* (practical wisdom) allows transfer of virtue from trained contexts to new ones. SIT claims training is context-locked.
  *   **Agreed Evidence:** A targeted character intervention study.
  *   **VE Prediction:** Subjects trained in "honesty" in Domain A will show statistically significant improvement in Domain B (structurally different) compared to controls ($\Delta d > 0.5$).
  *   **SIT Prediction:** Improvement will be restricted to Domain A. Transfer to Domain B will be indistinguishable from zero once situational cues are controlled.
  *   **Design:** Intervention group undergoes cognitive-behavioral habituation for truth-telling in financial contexts. Test measure is truth-telling in social/relational contexts. Control group receives no intervention.

  **3. The "Relevant Situation" Boundary (Medium Impact)**
  *   **Why it matters:** VE rescues traits by claiming situations in experiments are not "relevantly similar." If "relevance" is defined *post-hoc*, the theory is unfalsifiable.
  *   **Agreed Evidence:** Pre-registered classification of situational similarity.
  *   **VE Prediction:** VE can specify *ex-ante* which situational features render a trait irrelevant without reducing the trait's scope to a single action type.
  *   **SIT Prediction:** VE definitions of "relevant similarity" will shrink until the trait describes only one specific behavior (e.g., "honesty when tax-forms are present"), rendering "character" redundant with "habit."
  *   **Design:** VE panel must pre-register a taxonomy of situations where "Courage" should predict behavior. SIT panel predicts behavior will vary wildly within VE's "Courage-Relevant" category based on minor situational tweaks (e.g., time of day).

  ### IV. VERBAL VS. REAL DISAGREEMENTS

  **1. The Definition of "Virtue" (Verbal)**
  *   **Vocabulary:** The term "Virtue."
  *   **Analysis:**
      *   If VE defines "Virtue" as a **Normative Ideal** (what a good person *would* do, even if no one currently does it), SIT's empirical data is irrelevant. SIT attacks a descriptive claim VE isn't making.
      *   If VE defines "Virtue" as a **Psychological Prediction** (what a person labeled 'virtuous' *will* do), SIT's data is devastating.
  *   **Resolution:** VE must clarify if they are positing an existing psychological structure or a regulatory ideal. If the latter, the debate shifts to whether positing this ideal is useful, not whether it is empirically current.

  **2. The Locus of Stability (Real)**
  *   **Vocabulary:** "Stability."
  *   **Analysis:** Both agree behavior is not random.
  *   **Disagreement:** SIT locates stability in the *environment* (stable institutions produce stable behavior). VE locates stability in the *agent* (stable character produces stable behavior).
  *   **Resolution:** This is a real causal dispute. It determines whether we invest resources in training people or designing rooms.

  ### V. THE SINGLE EXPERIMENT AND FALSIFIABILITY CONDITIONS

  **The Design:**
  A 3-year, multi-lab longitudinal study ($N = 500$).
  *   **Phase 1:** Baseline measurement of "Global Virtue" via self-report and peer-report.
  *   **Phase 2:** 100 unobtrusive behavioral measures across 5 distinct moral domains (e.g., returning lost wallets, resisting temptation in games, intervening in harassment, tax compliance simulation, endurance under physical stress).
  *   **Phase 3:** Situational manipulation. Half the subjects are placed in "High Pressure" variants of the 5 domains; half in "Low Pressure."
  *   **Phase 4:** Character Intervention. Half the subjects undergo intensive virtue-cultivation training; half undergo situational-awareness training.

  **Falsification Conditions:**

  *   **For Virtue Ethics (VE):**
      *   **Condition:** If the correlation between behavioral measures across distinct domains (Phase 2) remains below $r = .30$ after correcting for measurement reliability, AND if the Character Intervention (Phase 4) fails to produce cross-domain transfer (effect size $< 0.2$).
      *   **Immunity Check:** VE is currently immune by claiming the 100 measures were not "relevantly similar."
      *   **Fix:** Relevance taxonomy must be pre-registered. If VE claims "Tax compliance" and "Intervening in harassment" are not relevantly similar tests of character, VE admits "Global Character" does not exist, only specific habits.

  *   **For Situationism (SIT):**
      *   **Condition:** If the Character Intervention (Phase 4) produces a cross-domain effect size $> 0.5$ that cannot be explained by situational covariates, AND if a subset of subjects shows high cross-situational consistency ($r > .50$) without situational scaffolding.
      *   **Immunity Check:** SIT is currently immune by claiming "unmeasured situational variables" caused the consistency.
      *   **Fix:** SIT must agree that if consistency persists across *structurally* different environments (e.g., digital vs. physical, anonymous vs. public) where no single situational cue is constant, the explanation must be internal (trait).

  **Status of Immunity:**
  Currently, VE is immune to falsification via the "Relevance Clause" (redefining the trait to fit the data). SIT is immune via the "Hidden Variable Clause" (postulating unseen situational causes).
  **Required Fix:** Both sides must pre-register the **Boundary Conditions**. VE must list situations where a virtue *should not* predict behavior. SIT must list situational variables they claim *exhaust* the variance. If variance remains after these are accounted for, the opposing side wins.
