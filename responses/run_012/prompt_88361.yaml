answer: |-
  **Essay Question**

  **Time Allowed:** 50 minutes
  **Total Marks:** 20

  **Question:**
  Critically assess the reliability of the fisheries model for advising on new quotas given the stock depletion. In your answer, you must:
  1.  Classify assumptions (a), (b), and (c) by the specific *kind* of failure each represents (e.g., negligibility, epistemic, ontological).
  2.  Explain precisely what Friedman's predictive success criterion licenses for each assumption individually, and where it fails to guarantee reliability in this new context.
  3.  Consider the view that one of these assumptions is not truth-apt (cannot be true or false); identify which one and explain what follows for the model's assessment if this view is correct.
  4.  State what additional criteria of assumption-assessment are required to distinguish these cases beyond predictive accuracy.

  *Note: You will receive no credit for simply stating Friedman's thesis that assumptions need not be realistic, nor for reciting general objections to instrumentalism without applying them to the specific assumptions (a–c) provided.*

  ***

  **Model Answer**

  The fisheries model presents a classic tension between predictive fit and structural validity. While the model tracked landings closely during the fitting period, the depletion of the stock changes the domain of application. Friedman's instrumentalism suggests that because the model predicted well previously, the falsity of its assumptions is irrelevant. However, this criterion licenses reliance only on the *output*, not the *mechanism*. When the system structure changes (stock fished down), a model relying on false structural assumptions may fail catastrophically, even if it previously fit the data.

  To assess this, we must sort the assumptions by the kind of failure they represent. Assumption (a) is a **negligibility idealization**. It claims a causal factor (individual boat impact) is too small to matter. Its failure is empirical: the factor is not negligible. Friedman's criterion licenses this so long as the aggregate effect mimics the model's output. However, if the stock is now small, individual catches *do* matter causally. Friedman's criterion does not license (a) in the new context because the causal structure has shifted; past prediction does not guarantee future negligibility.

  Assumption (b) is an **epistemic idealization**. It attributes knowledge to agents (fishers) they do not possess. Its failure is psychological. Friedman licenses this if fishers behave *as if* they have this knowledge (perhaps via heuristics). However, if recruitment patterns change due to stock depletion, past behavioral regularities may break. Friedman's criterion fails here because it cannot distinguish between genuine foresight and lucky coincidence in the fitting period.

  Assumption (c) posits a **representative agent**. This is an **aggregation idealization**, but it raises a truth-aptitude issue. One might argue (c) is not truth-apt; it is a mathematical construct rather than an empirical claim about a specific entity. There is no "average fisher" in reality. If (c) is not truth-apt, Friedman's critique of unrealistic assumptions does not apply directly, as there is no claim to be false. However, this does not save the model. If preferences are heterogeneous, averaging them may obscure critical thresholds (e.g., some fishers quit while others overfish). Even if (c) is merely a tool, its structural adequacy matters for policy advice.

  Therefore, Friedman's criterion is insufficient because it treats all assumptions as black-box inputs validated only by output. To distinguish these cases, we need criteria of **domain validity** and **causal structure**. For (a), we need evidence that the negligibility condition holds in the *new* stock size. For (b), we need evidence that the behavioral mechanism remains stable despite changed ecological conditions. For (c), we need robustness analysis to see if heterogeneity alters the quota outcome.

  In conclusion, the model is unreliable for new quotas. Predictive success in a high-stock regime does not license use in a low-stock regime when the assumptions involve causal negligibility and epistemic capacities that are sensitive to stock size. Whether (c) is truth-apt or not, the aggregation masks risk. A proper assessment requires validating the causal links, not just the historical fit.

  ***

  **Marking Scheme**

  **Total Marks:** 20

  | Move | Marks | Required Content | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Friedman's Scope** | 4 | Correctly states Friedman licenses use based on output but fails to guarantee reliability when structural context changes (stock depletion). | Candidates simply recite Friedman's thesis without linking it to the context change (stock depletion). |
  | **2. Assumptions (a) & (b)** | 4 | Identifies (a) as negligibility/causal and (b) as epistemic/psychological; explains why past fit doesn't secure future validity for each. | Candidates treat (a) and (b) as identical "falsehoods" without distinguishing causal vs. epistemic failure types. |
  | **3. Assumption (c) & Truth** | 4 | Identifies (c) as aggregation/ontological; argues whether it is truth-apt (construct vs. claim) and implications for assessment. | Candidates assert (c) is false without considering the view that it is a non-truth-apt mathematical convention. |
  | **4. Specific Licensing** | 4 | Explains what Friedman licenses for each specifically (e.g., licenses (b) only if behavior mimics knowledge) and where it falls short. | Candidates make general claims about Friedman licensing "the model" rather than analyzing licensing per assumption. |
  | **5. Additional Criteria** | 4 | Specifies needed criteria (e.g., domain validity, causal structure, robustness) that allow distinction beyond predictive accuracy. | Candidates suggest vague solutions like "make assumptions more realistic" rather than specifying assessment criteria. |
