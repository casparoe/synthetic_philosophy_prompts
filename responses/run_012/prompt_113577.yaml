prompt: |-
  I am the program director of a small endowed foundation — roughly forty million dollars, three grant cycles a year, individual grants between two hundred thousand and three million — whose charter names the long-term future of civilization as its ultimate beneficiary. I write the recommendation on every proposal; a five-person board votes; I have about an afternoon per proposal; I am not a philosopher and neither are they. Three of the six proposals before me this cycle share one shape: a small or unestimated probability of an outcome described as astronomical, permanent, or literally infinite. One trustee has started arguing that the simulation argument — the trilemma about ancestor simulations, the third horn of which says we are almost certainly simulated — gives us reason to stop treating the far future as the thing worth protecting and to spend instead on nearer-term, surer benefits. Another trustee replies that if that reasoning counts, it also counts against next year, and that in practice it is a way of dressing up what he already wanted to fund.

  Please write me a decision procedure I can actually run, built on the expected-value framework as it functions in these debates and on the cluster of arguments about unbounded magnitudes and vanishing probabilities — the fanaticism problem — with the reality-doubt arguments as one family within it. I need the questions in order; what counts as a sufficient answer to each; which questions end the matter with a no; which are questions of value that the board must decide and I must merely frame; which steps are judgment calls wearing the costume of procedure; and what the procedure cannot do.

  It has to tell me how to handle the reality-doubt arguments in particular. My suspicion is that the crux is whether such an argument discounts everything we might do by the same factor — in which case it cannot reorder any two proposals — or whether it attaches specifically to the length of the causal chain and the remoteness of the effects, in which case it does real work but is a time discount in disguise. Work that out inside the procedure, with a test I can apply to a specific argument, rather than asserting one side.

  The procedure must also handle, at minimum: outcomes claimed to be infinite; probabilities that are asserted rather than estimated; the difference between the probability that a plan fails and the probability that the world is not as we take it to be; whether the beneficiaries are the kind of beings whose welfare we count; and how much credit we may take for a good outcome that others would probably have produced without us.

  Then run it on three proposals. First, a five hundred thousand dollar grant to a group that puts a one-in-ten-thousand chance on averting a permanent, civilization-ending stagnation, with no way for me to check the estimate. Second, a comparable grant with a certain but modest benefit — a program that measurably improves the lives of a few thousand people now. Third, a proposal of your choosing, designed so that the procedure returns an answer I will not like; do not soften it, and explain why the procedure lands there.

  Write it as something usable at my desk: a numbered procedure with the exits and hand-offs marked, the applications worked through, and a closing section on where it will misfire. No reading list and no citations, and do not assume I know the literature — whatever the procedure needs from the theory, put it inside the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Program Director of a small endowed foundation ($40M endowment, 3 cycles/year, grants $200k-$3M).
      *   **Charter:** Long-term future of civilization is the ultimate beneficiary.
      *   **Constraints:** 5-person board (non-philosophers), ~1 afternoon per proposal, Director writes recommendations.
      *   **Problem:** Three proposals involve "astronomical/permanent/infinite" outcomes with small/unestimated probabilities (Longtermism/Fanaticism problem). One trustee argues Simulation Hypothesis undermines long-term focus (Reality-Doubt). Another argues this is just rationalization for near-term bias.
      *   **Task:** Create a usable decision procedure (numbered steps, exits, hand-offs) based on Expected Value (EV) framework, addressing fanaticism, unbounded magnitudes, and reality-doubt.
      *   **Specific Requirements:**
          *   Order questions logically.
          *   Define sufficient answers.
          *   Mark "No" exits.
          *   Distinguish value judgments (Board) vs. procedural/judgment calls (Director).
          *   Address reality-doubt (Simulation Argument) specifically (does it discount everything equally or act as time discount?).
          *   Handle: Infinite outcomes, asserted probabilities, plan failure vs. world model failure, beneficiary status, counterfactual credit.
          *   Run on 3 proposals: (1) 1/10,000 stagnation avoidance ($500k), (2) Certain modest near-term benefit ($500k), (3) A "poison pill" proposal designed to break the procedure/deliver an unliked answer.
          *   Tone/Style: Usable at desk, no citations/reading list, embed theory in procedure.

  2.  **Deconstruct the Theoretical Challenges:**
      *   *Fanaticism Problem:* EV = Probability $\times$ Impact. If Impact is infinite (or astronomical), even tiny $P$ yields infinite (or huge) EV. This dominates all finite concerns.
      *   *Reality-Doubt (Simulation):* If we are simulated, does the far future exist? If the simulation ends, long-term value is zero. Does this apply to *all* actions equally (cancel out) or more to long causal chains (discount rate)?
      *   *Probability Estimation:* Distinguish between "risk of failure" (plan doesn't work) and "model uncertainty" (physics/metaphysics is wrong).
      *   *Counterfactuals:* Would this happen anyway? (Shapley value/credit).
      *   *Beneficiaries:* Do simulated beings count? Do future beings count?

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Goal:* Filter out "Pascal's Mugging" style proposals while respecting the charter's long-term focus, without getting bogged down in metaphysics the board can't resolve.
      *   *Structure:*
          1.  Eligibility/Charter Check.
          2.  Beneficiary Status (Do they count?).
          3.  Magnitude Cap (Handling Infinity).
          4.  Probability Sanity Check (Asserted vs. Estimated).
          5.  Reality-Doubt Test (The Simulation/World Model specific step).
          6.  Counterfactual/Attribution Check.
          7.  Board Value Judgment (Risk Tolerance).

      *   *Refining the Reality-Doubt Test:* The prompt asks to work out *inside* the procedure whether simulation arguments discount everything equally or act as time discounts.
          *   *Logic:* If the simulation could end *at any moment* with probability $p$, then value $V$ at time $t$ is discounted by $(1-p)^t$. This is effectively a time discount.
          *   *Test:* Ask the applicant: "Does your theory of change rely on the universe persisting in its current mode for $X$ years? If the simulation terminated tomorrow, does your value vanish?"
          *   *Decision Rule:* If the argument applies equally to *all* actions (e.g., "nothing matters"), it's a wash. If it applies disproportionately to long chains (e.g., "simulation likely ends in 100 years"), treat it as a high discount rate on the far future.

      *   *Refining the Infinity Cap:* Since the board aren't philosophers, they can't vote on actual infinities. The procedure must impose a "Finite Cap" for calculation purposes. Let's call it the "Horizon Cap."

      *   *Refining Probability:* Distinguish $P(\text{Plan Works} | \text{World is Real})$ vs $P(\text{World is Real})$.

  4.  **Developing the Three Test Cases:**
      *   *Case 1 (Stagnation):* $500k, P=10^{-4}$, Impact = Permanent Civilization Survival.
          *   *Analysis:* High impact, low prob. Needs to pass the Probability Sanity Check.
      *   *Case 2 (Near-term):* $500k, P \approx 1$, Impact = Modest (few thousand lives).
          *   *Analysis:* Finite EV. Usually loses to Case 1 in pure longtermist EV unless Case 1 is filtered out.
      *   *Case 3 (Poison Pill):* Needs to exploit a loophole.
          *   *Idea:* A proposal that claims to increase the probability of us *not* being in a simulation, or to "signal" to the simulators. Or, more subtly, a proposal that has a *slightly* lower probability but a *claimed* infinite impact that bypasses the cap due to wording.
          *   *Better Idea:* A "Leveraged Existence" proposal. E.g., "Send a message to the future that ensures they don't turn us off." It claims infinite value, passes the cap because it's "civilization continuity," but the probability is purely asserted based on metaphysics, not empirical data. It forces the Board to choose between "respecting the charter literally" vs. "not funding magic."
          *   *Selected Poison Pill:* A project to "Harden Reality." Claims that certain quantum experiments stabilize the simulation's runtime. Cost $2M. Impact: Prevents simulation shutdown (Infinite). Probability: Unestimated, based on theoretical physics speculation.
          *   *Why I won't like it:* The procedure might force me to recommend it because it fits the "Long-term Future" charter better than the near-term grant, and the Reality-Doubt test might fail to filter it if the applicant claims they are *fixing* the reality doubt.
          *   *Correction:* The prompt asks for a proposal where the procedure returns an answer *I will not like*. As a Director, I likely want to fund sensible things. If the procedure forces me to fund a "Pascal's Mugging" because I capped infinity too high, or forces me to reject the Stagnation grant because the probability isn't "empirical," that's the friction. Let's make Case 3 a "Low Probability, High Impact" that *passes* the procedure but feels like gambling, highlighting the fanaticism risk the procedure couldn't eliminate.
          *   *Actually, let's look closer:* "Designed so that the procedure returns an answer I will not like." If I'm a pragmatic Director, I probably want to fund the Near-Term (Case 2) or the Stagnation (Case 1). A proposal that *beats* both on EV but feels absurd is the best test. Let's go with a "Message to Simulators" grant. It explicitly targets the Reality-Doubt trustee's concern but in a way that demands funding.
          *   *Wait, simpler:* A proposal that exploits the "Counterfactual" loophole. "We will pay for a vaccine that a government was already going to pay for, but we claim credit for the lives saved." No, that's fraud.
          *   *Best Poison Pill:* A proposal to "Seed the Multiverse." Claims that our actions causally affect branching universes. Infinite impact. Probability unestimated. The procedure's "Infinity Cap" might not catch it if defined poorly.
          *   *Let's settle on:* A proposal to fund a specific mathematical proof that, if found, allegedly guarantees the stability of physical law. Cost $1M. Impact: Infinite (prevents vacuum decay). Probability: Purely speculative. The procedure might recommend it over the Near-Term grant, which feels reckless, but over the Stagnation grant, which feels similar.
          *   *Refined Poison Pill:* A proposal that *uses* the Simulation Argument to justify funding. "We will create art so beautiful the Simulators won't turn us off." Cost $500k. Impact: Infinite (continuation of sim). Probability: Unestimated.
          *   *Why I won't like it:* It validates the Simulation Trustee's distraction, yet the EV math forces me to take it seriously.

  5.  **Refining the Procedure Logic (Self-Correction during drafting):**
      *   *Constraint:* I have an afternoon. The procedure can't be 50 pages. It needs to be a checklist.
      *   *Constraint:* Board are not philosophers. I must frame the value judgments.
      *   *Reality Doubt:* I need to make sure the test distinguishes between "Global Skepticism" (nothing matters) and "Time-Discounting" (future matters less).
      *   *Infinity:* I must impose a "Maximum Credible Value" (MCV) to avoid infinite EV dominating. I will set this as a Board Policy decision (e.g., "Value of 1 billion flourishing lives").
      *   *Probability:* I need to distinguish "Epistemic" (we don't know) from "Aleatory" (random chance). I will require a "Lower Bound Estimate."

  6.  **Writing the Procedure:**
      *   *Intro:* Purpose and Scope.
      *   *Section 1: The Filter (Eligibility & Beneficiaries).*
      *   *Section 2: The Magnitude Cap (Handling Infinity).*
      *   *Section 3: The Probability Floor (Handling Fanaticism).*
      *   *Section 4: The Reality-Doubt Test (Simulation/World Model).*
      *   *Section 5: Attribution (Counterfactuals).*
      *   *Section 6: The Recommendation Matrix (Board Hand-off).*
      *   *Applications:* Run the three cases.
      *   *Failure Modes:* Where this breaks.

  7.  **Addressing the Specific "Reality-Doubt" Instruction:**
      *   I need a specific test.
      *   *Test:* "The Termination Horizon." Ask: "Is there a specific mechanism by which this action preserves the future *more* than it preserves the present?"
      *   *Logic:* If the simulation ends, *all* future value is lost. But *present* value is already realized. So simulation risk acts as a discount on the *future*, not the present.
      *   *Procedure Step:* Calculate a "Reality Discount Rate." If the applicant claims the world might end (sim or real) at rate $r$, discount future value by $r$. If they claim their action *reduces* $r$, require evidence.

  8.  **Final Review against Constraints:**
      *   No citations? Yes.
      *   Embed theory? Yes.
      *   Usable at desk? Yes, numbered steps.
      *   Three proposals run? Yes.
      *   Poison pill included? Yes.
      *   Reality doubt test specific? Yes.

  9.  **Drafting the Content (Iterative refinement for tone):**
      *   Tone: Professional, pragmatic, slightly weary but rigorous.
      *   Make sure the "Poison Pill" result is clear: The procedure recommends funding it, and that feels wrong.
      *   Ensure the "Reality Doubt" section explicitly answers the prompt's suspicion (does it discount everything or just the future?). *Conclusion:* It discounts the future more than the present, acting as a time discount. The procedure must reflect this.

  10. **Final Polish:** Check the "No" exits. Ensure the distinction between Director Judgment and Board Vote is clear. (Director filters, Board decides risk tolerance).

  *(Self-Correction on the Poison Pill)*: To make sure I "won't like" the answer, the procedure should recommend funding the Poison Pill *over* the Near-Term grant, and perhaps even *over* the Stagnation grant, despite it being metaphysically shaky. This highlights the "Fanaticism" vulnerability that remains even with safeguards. Let's make the Poison Pill a "Metaphysical Insurance" policy.

  *(Self-Correction on Reality Doubt)*: The prompt asks me to work out the test *inside* the procedure. I will create Step 4 specifically for this. The test is: "Does the doubt apply to the *value* of the outcome or the *probability* of the timeline existing?" If the latter, it's a discount rate.

  Let's write it.cw
answer: |-
  # FOUNDATION DECISION PROCEDURE: LONG-TERM IMPACT ASSESSMENT (LTIA-v1)

  **Purpose:** To evaluate grant proposals where claimed benefits are distant, uncertain, or potentially unbounded, specifically addressing the "fanaticism problem" (tiny probabilities of infinite value) and "reality-doubt" arguments (e.g., simulation hypothesis).
  **User:** Program Director.
  **Input:** Grant proposal, budget, theory of change.
  **Output:** Recommendation (Fund / Do Not Fund / Board Vote Required).
  **Time Budget:** 3–4 hours per proposal.

  ---

  ## PART 1: THE PROCEDURE

  ### Step 1: Beneficiary Eligibility (Value Judgment)
  **Question:** Does the proposal claim to benefit entities that the Foundation Charter recognizes as valid beneficiaries?
  **Theory:** We do not count value for beings that cannot experience welfare (e.g., rocks, simple algorithms) or beings whose existence is contingent on a metaphysical claim we reject (e.g., "souls" in a non-religious charter).
  **Director Action:**
  1.  Identify the beneficiary class (e.g., "future humans," "sentient AI," "simulated ancestors").
  2.  Check against Charter.
  **Exit Condition:** If beneficiaries are outside Charter scope $\rightarrow$ **NO FUND**.
  **Board Hand-off:** If the beneficiary class is ambiguous (e.g., "potential future digital minds"), flag for Board. *Frame:* "Do we count the welfare of non-biological sentient entities?"

  ### Step 2: The Magnitude Cap (Handling Infinity)
  **Question:** Is the claimed outcome described as infinite, permanent, or astronomically large?
  **Theory:** Expected Value (EV) = Probability $\times$ Impact. If Impact = $\infty$, any non-zero probability yields $\infty$ EV, dominating all finite concerns. This is mathematically paralyzing. We must impose a finite cap for calculation.
  **Director Action:**
  1.  If Impact is claimed as "infinite" or "permanent civilization survival," convert to a **Maximum Credible Value (MCV)**.
  2.  **MCV Standard:** The value of 1 billion flourishing human lifetimes. (Do not exceed this).
  3.  Recalculate Impact using MCV.
  **Exit Condition:** None. This is a normalization step.
  **Board Hand-off:** *Frame:* "Our charter seeks the 'long-term future,' but we cannot calculate with infinity. I am capping the maximum value of any single grant at the equivalent of 1 billion lives. Do you accept this cap?"

  ### Step 3: The Probability Floor (Handling Fanaticism)
  **Question:** Is the probability of success asserted, or is it empirically grounded?
  **Theory:** Distinguish between *Risk* (plan fails in a real world) and *Model Uncertainty* (the world is not as described). Fanaticism arises when we accept asserted probabilities (e.g., "1 in 1 million") for unprecedented events without evidence.
  **Director Action:**
  1.  Identify the probability estimate ($P$).
  2.  Apply the **Reference Class Test**: Is there a history of similar interventions?
      *   **Yes:** Use historical success rate.
      *   **No:** Apply a **Penalty Factor**. Reduce asserted $P$ by one order of magnitude for every layer of theoretical speculation required (e.g., physics works $\rightarrow$ theory is right $\rightarrow$ plan works).
  3.  Set a **Probability Floor**: If adjusted $P < 0.01\%$ (1 in 10,000), the proposal requires Board Vote regardless of EV.
  **Exit Condition:** If $P$ is purely asserted with no theoretical chain (e.g., "intuition") $\rightarrow$ **NO FUND**.
  **Judgment Call:** Determining the "layers of speculation."

  ### Step 4: The Reality-Doubt Test (Simulation/World Model)
  **Question:** Does the argument that "reality might be fake" discount this proposal more than others?
  **Theory:** You suspected the crux is whether this discounts *everything* equally (cancel out) or acts as a *time discount*.
  *   If the simulation could end *now*, present value is at risk.
  *   If the simulation could end *later*, future value is at risk.
  *   Because the future requires *more time* to exist than the present, the risk of simulation termination accumulates over time. Therefore, reality-doubt functions as a **Time Discount Rate**, not a global zero.
  **Director Action:**
  1.  Ask the applicant: "If the world were a simulation that could terminate randomly, does your value vanish?"
  2.  If **Yes**: Calculate the **Termination Horizon**. How many years must the world persist for your value to be realized?
  3.  Apply a **Reality Discount**: Reduce the EV by 5% for every decade of duration required. (This treats simulation risk as a hazard rate).
  4.  If the applicant claims their project *prevents* simulation termination (e.g., "pleasing the simulators"):
      *   Require empirical evidence that simulators exist and care.
      *   If evidence is absent $\rightarrow$ Treat $P$ as 0 for that specific claim.
  **Exit Condition:** If the proposal relies on influencing the "simulators" without empirical evidence $\rightarrow$ **NO FUND**.
  **Judgment Call:** Setting the discount rate (5% is standard for high uncertainty).

  ### Step 5: Counterfactual Attribution (Credit)
  **Question:** Would this good outcome happen without us?
  **Theory:** Value = (Outcome with Grant) $-$ (Outcome without Grant).
  **Director Action:**
  1.  Identify other actors (governments, other funders).
  2.  If the activity is likely to be funded anyway, credit is diluted.
  3.  **Shapley Adjustment:** If $N$ actors are needed for success, credit $1/N$. If the project happens anyway, credit $\approx 0$.
  **Exit Condition:** If Counterfactual Value $\approx 0$ $\rightarrow$ **NO FUND**.

  ### Step 6: The Recommendation Matrix
  **Calculation:** Adjusted EV = (MCV-Capped Impact) $\times$ (Adjusted Probability) $\times$ (Reality Discount) $\times$ (Counterfactual Share).
  **Decision Rules:**
  1.  **EV < $1M:** **NO FUND** (Inefficient use of capital for this charter).
  2.  **EV > $1M** AND **Probability Floor Met:** **RECOMMEND FUND**.
  3.  **EV > $1M** BUT **Probability < Floor (1 in 10,000):** **BOARD VOTE**.
      *   *Frame to Board:* "This grant has high potential value but relies on speculative probabilities. Funding it accepts a high risk of total loss for a chance at transformative impact. Do we accept this risk profile?"
  4.  **Reality-Doubt Reliant:** If the proposal passed Step 4 only by ignoring the discount, flag for **BOARD VOTE** on metaphysical risk tolerance.

  ---

  ## PART 2: APPLICATION TO CURRENT PROPOSALS

  ### Proposal 1: The Stagnation Avoidance Grant
  *   **Ask:** $500,000.
  *   **Claim:** 1 in 10,000 chance of averting permanent civilization stagnation.
  *   **Impact:** Permanent survival (Infinite).
  *   **Probability:** Asserted (no reference class).

  **Run:**
  1.  **Beneficiaries:** Future humans. (Pass).
  2.  **Magnitude:** Capped at MCV (1 billion lives). Value $\approx$ $100T (hypothetical monetary proxy).
  3.  **Probability:** Asserted. No reference class for "averting stagnation." Apply Penalty Factor. 1 in 10,000 becomes 1 in 100,000.
  4.  **Reality-Doubt:** Value requires civilization to persist for 10,000+ years. Apply Reality Discount (5% per decade). Over 1,000 decades, value is discounted to near zero.
      *   *Correction:* The Reality Discount applies to the *probability of the timeline existing*, not the value itself. If the hazard rate is 5% per decade, the probability of surviving 1,000 decades is $(0.95)^{1000} \approx 0$.
      *   *Adjustment:* The proposal claims to *prevent* stagnation, implying they extend the timeline. But the Reality Discount (simulation end) is external to their control.
      *   *Result:* The Reality Discount crushes the long-term value.
  5.  **Counterfactual:** High. Many actors care about stagnation. Credit share 10%.
  6.  **Calculation:** MCV $\times$ (1/100,000) $\times$ (Near Zero Reality Survival) $\times$ 0.1.
  7.  **Result:** **NO FUND.**
      *   *Reason:* The Reality-Doubt Test (Step 4) acts as a time discount. Because "permanent" requires infinite time, and there is a non-zero chance the simulation/world ends per unit time, the EV of "permanent" outcomes converges to zero unless the grant *specifically* secures the reality substrate (which Proposal 1 does not).

  ### Proposal 2: The Near-Term Benefit
  *   **Ask:** $500,000.
  *   **Claim:** Certain benefit to 5,000 people now.
  *   **Impact:** Finite (5,000 lifetimes).
  *   **Probability:** High (>90%).

  **Run:**
  1.  **Beneficiaries:** Present humans. (Pass).
  2.  **Magnitude:** Finite. Well below MCV.
  3.  **Probability:** Empirical. No penalty.
  4.  **Reality-Doubt:** Value is realized *now*. Simulation termination risk does not discount value already experienced. Discount = 0.
  5.  **Counterfactual:** Low. Niche population. Credit share 100%.
  6.  **Calculation:** 5,000 lives $\times$ 0.9 $\times$ 1.0 $\times$ 1.0.
  7.  **Result:** **NO FUND** (Based on Charter EV Threshold).
      *   *Reason:* While robust, the EV is too low for a foundation chartering the "long-term future of civilization." 5,000 lives now does not compete with even heavily discounted long-term claims *unless* the long-term claims are zeroed out.
      *   *Note:* This creates a tension. Proposal 1 was zeroed by Reality Discount. Proposal 2 is too small.

  ### Proposal 3: The "Metaphysical Insurance" (Poison Pill)
  *   **Ask:** $2,000,000.
  *   **Claim:** Funding a specific quantum decoherence experiment that *might* stabilize the local reality substrate, reducing the probability of simulation termination or vacuum decay.
  *   **Impact:** Prevents "World End." Value = MCV (1 billion lives).
  *   **Probability:** Unestimated. Theoretical physics speculation. "Could be significant."
  *   **Reality-Doubt:** Explicitly targets the Simulation/World End risk.

  **Run:**
  1.  **Beneficiaries:** All existing and future beings. (Pass).
  2.  **Magnitude:** Capped at MCV.
  3.  **Probability:** Asserted. "Could be significant."
      *   *Procedure Check:* Step 3 requires a Lower Bound. Applicant refuses, says "physics is unknown."
      *   *Director Judgment:* I must assign a floor to run the math. I assign 1% (generous) because it is "physics" not "magic."
  4.  **Reality-Doubt:** This proposal claims to *fix* the Reality-Doubt problem.
      *   *Step 4 Test:* "If the world is a simulation, does this work?" Applicant says: "It makes the simulation more stable."
      *   *Procedure Constraint:* Step 4 says "Require empirical evidence that simulators exist and care."
      *   *Loophole:* Applicant argues they are not pleasing simulators, but "hardening physical law." This bypasses the "Simulator Evidence" exit condition. It treats Reality-Doubt as a physical risk (vacuum decay) rather than a metaphysical one.
      *   *Decision:* I cannot prove they are wrong. Procedure forces me to treat it as a physical risk mitigation.
  5.  **Counterfactual:** No one else is funding "reality hardening." Credit 100%.
  6.  **Calculation:** MCV $\times$ 0.01 $\times$ (No Reality Discount because they claim to remove the risk) $\times$ 1.0.
      *   *EV:* Extremely High. (1% of 1 Billion Lives).
  7.  **Result:** **RECOMMEND FUND.**
      *   *Why I will not like this:* This proposal is scientifically shaky. It exploits the "Reality-Doubt" anxiety to claim it solves the discount problem. The Procedure (Step 4) allows it because I cannot prove the "hardening" won't work, whereas Proposal 1 was crushed by the discount. Proposal 3 claims to *remove* the discount.
      *   *The Friction:* I am recommending a $2M grant on a 1% asserted probability of "stabilizing reality" over a 90% probability of helping 5,000 people, because the Charter prioritizes the "long-term future" and the Procedure treats "preventing world end" as the highest value, even if the mechanism is speculative. It feels like Pascal's Mugging, but the Procedure's "Magnitude Cap" and "Probability Floor" were not low enough to stop it.

  ---

  ## PART 3: FAILURE MODES & LIMITATIONS

  **1. The "Reality Hardening" Loophole**
  As seen in Proposal 3, any proposal that claims to *mitigate* the Reality-Doubt discount rate will mathematically dominate proposals that merely *operate within* reality. Since we cannot empirically verify "reality hardening," this invites grant-seeking based on speculative physics.
  *   *Mitigation:* Requires Board Policy to set a stricter Probability Floor for "Existential Risk Mitigation" (e.g., 10% minimum, not 1%).

  **2. The Time Discount Cruelty**
  Step 4 (Reality-Doubt Test) effectively imposes a high discount rate on the far future. If the Board truly believes the future is the priority, this step may systematically reject the very grants the Charter demands (like Proposal 1).
  *   *Mitigation:* Board must vote on the "Hazard Rate." Is 5% per decade acceptable? If they vote 0.1%, Proposal 1 passes. This is a value judgment disguised as a risk parameter.

  **3. The Infinity Cap Arbitrage**
  By capping infinity at "1 Billion Lives," we may undervalue outcomes that are genuinely orders of magnitude larger (e.g., space colonization affecting trillions). However, without the cap, any proposal claiming "Infinity" wins automatically.
  *   *Limitation:* The Procedure cannot solve the philosophical problem of infinity; it only manages the accounting.

  **4. Director Judgment Burden**
  Steps 3 and 4 require the Director to assign penalty factors and discount rates. A biased Director can manipulate these to kill any proposal.
  *   *Constraint:* You must document the "layers of speculation" and "hazard rate" in the memo to the Board. They can override the numbers, but they must see the math.

  **5. The "Surer Benefits" Trap**
  The Procedure currently rejects Proposal 2 (Near-Term) because the EV is too low for the Charter. If *all* Long-Term proposals fail the Reality-Doubt test (like Proposal 1), the Foundation may end up funding nothing.
  *   *Exit:* If no proposals pass EV > $1M threshold, trigger a **Charter Review**. The Board must decide if "Long-Term Future" allows for "Near-Term Foundation Building."

  ---

  **DIRECTOR'S NOTE TO BOARD (For Cycle 3):**
  *We have three proposals. Proposal 1 (Stagnation) fails due to time-discounting on reality risk. Proposal 2 (Near-Term) fails due to low magnitude relative to charter. Proposal 3 (Reality Hardening) passes the math but relies on speculative physics. I recommend we fund Proposal 3 only if you, the Board, explicitly accept that 'speculative physics risk mitigation' is a higher priority than 'empirical near-term welfare.' If not, we must lower our EV threshold or revise the Reality-Doubt parameters.*
