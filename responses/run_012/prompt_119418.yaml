answer: |-
  **MEMORANDUM**

  **TO:** Chair, Naming and Memorials Committee
  **FROM:** Undergraduate Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Truman Wing Naming

  ### 1. Recommendation and Executive Summary

  I recommend that the Committee vote to **remove the name "Truman Wing"** from the Social Sciences building.

  This recommendation is not based on a retrospective legal trial, but on the current moral standards required for university honours. While the Terms of Reference (ToR) restrict removal to conduct "disqualifying under current law" or "facts not established at the time," I argue that the deliberate targeting of civilian populations—conduct now explicitly prohibited under international humanitarian law—meets the first criterion. Furthermore, retaining the name constitutes an active moral judgment that the honour is still appropriate; neutrality is not an option.

  **Proposed Timeline:**
  *   **Next Meeting:** Vote on the recommendation to remove.
  *   **If Passed:** Commission a historical review of the naming (4 weeks) to ensure no procedural errors in removal.
  *   **Implementation:** Physical removal of signage to coincide with the start of the next academic term (approx. 4 months), allowing time for community consultation on the building's future designation.

  ### 2. The Moral Question: Why Naming Is Not Neutral

  A member previously noted that "we're only deciding a name, we're not putting anyone on trial." This distinction is legally sound but morally incoherent in the context of commemoration. To name a building after an individual is to hold them up as a model of distinction. It is an endorsement.

  If we keep the name, we are not remaining neutral; we are judging that Truman's actions remain compatible with our values. If we remove it, we are judging that they are not. The Committee cannot avoid making a moral judgment about the past because the act of naming is a statement about the present. To claim otherwise is to hide behind procedure while effectively endorsing the status quo.

  ### 3. The Ethical Argument (Anscombe and Intent)

  The petition rests on the bombings of Hiroshima and Nagasaki. The standard defense is consequentialist: the bombings shortened the war and saved lives overall. However, the Committee should consider the deontological argument advanced by G.E.M. Anscombe in 1956, which remains the strongest philosophical objection to honouring Truman.

  Anscombe argued that the morality of an act depends on the *intent*, not just the outcome.
  *   **The Distinction:** In just war theory, the "Doctrine of Double Effect" allows for civilian casualties if they are an unintended *side effect* of a strike on a military target. Anscombe argued this does not apply here. The destruction of the cities and the terrorizing of the population were not side effects; they were the *means* by which the surrender was sought. The civilians were the target.
  *   **The "Just Signing" Defense:** Regarding the comment that Truman "only signed a piece of paper," Anscombe would reject this as a evasion of command responsibility. A head of state who authorizes the intentional killing of innocents is morally culpable for those deaths, regardless of the physical distance or the bureaucratic mechanism.

  If the University accepts the premise that intentionally targeting civilians is intrinsically wrong (a premise codified in modern international law), then honouring the individual who authorized it contradicts our stated commitment to human rights and ethical inquiry.

  ### 4. The Terms of Reference and Current Law

  The ToR allow removal for "conduct that would be disqualifying under current law." The legalistic objection is that the bombings were legal in 1945.

  This interpretation is too narrow. The ToR does not say "conduct illegal *at the time*." It says "disqualifying under *current* law." Under current international humanitarian law (specifically the Geneva Conventions and Additional Protocol I), the deliberate targeting of civilian populations is a war crime. While we cannot prosecute Truman, we can assess whether conduct that would constitute a war crime today is disqualifying for a university honour *today*.

  If we bind ourselves strictly to 1945 legal standards, we render the "current law" clause meaningless. The ToR were designed to prevent frivolous removals, not to force the University to honour conduct that is now recognized as criminal.

  ### 5. Precedent and the "Slippery Slope"

  There is concern that removing Truman sets a precedent that threatens other buildings named after historical figures with "ugly records" (e.g., colonial administrators, slaveholders).

  To manage this, the Committee should establish a high bar for removal, distinguishing Truman's case from others:
  1.  **Specificity of Act:** Truman's case involves a specific, discrete executive order to target civilians. Many other historical figures are implicated in systemic injustices (slavery, colonialism) which, while morally abhorrent, involve diffuse responsibility over long periods.
  2.  **Intent:** The bar for removal should be the *intentional* targeting of non-combatants as a strategic end. This distinguishes Truman from, for example, a military general who fought in a war where civilian casualties occurred as collateral damage (Double Effect), or a politician who held racist views but did not order mass killings.

  This precedent does not require scrubbing all controversial history from campus. It reserves removal for cases where the honour is directly incompatible with the fundamental laws of war as we understand them now.

  ### 6. The Strongest Case for Retaining the Name

  Those arguing to retain the name are not necessarily defending the bombings as morally good. Their position rests on three pillars that deserve recognition:

  *   **Historical Contextualism:** Honours reflect the values of the time they were given (the 1960s Commencement). Removing the name risks sanitizing history. A university should be a place where uncomfortable history is preserved and debated, not erased. The building itself can serve as a teaching tool about the complexities of the 20th century.
  *   **Consequentialist Necessity:** The historical consensus, while debated, still holds that the bombings likely prevented a land invasion of Japan that would have resulted in significantly higher casualties on both sides. Honouring Truman honours the decision that ended the war, not necessarily the specific mechanism of destruction.
  *   **Institutional Stability:** If the bar for removal becomes "moral failings by contemporary standards," no historical figure is safe. This creates uncertainty for donors and distracts from the University's educational mission. The "Keep and Plaque" option allows the University to acknowledge the complexity without the divisiveness of removal.

  *This view is not a denial of the suffering caused, but a prioritization of historical continuity and the educational value of engaging with controversial legacies in situ.*

  ### 7. Epistemic Humility: Weaknesses and Uncertainties

  My reasoning relies on specific premises that, if false, would change my recommendation:

  1.  **The Historical Necessity Claim:** If new historical evidence were to conclusively demonstrate that the bombings were *not* intended to terrorize civilians but were strictly aimed at military industrial hubs (and the civilian death was truly collateral), the Anscombe argument collapses. I am relying on the historical consensus that the target was the city itself.
  2.  **The Function of Naming:** I am operating on the premise that a building name is an *honour*. If the Committee determines that building names are merely *identifiers* with no normative weight (like "Building A"), then removal is unnecessary. However, given the petition exists, the community clearly views it as an honour.
  3.  **Legal Risk:** My interpretation of the ToR ("current law" vs. "law at the time") is plausible but untested. If University Counsel advises that interpreting "current law" retrospectively creates legal liability or breaches donor agreements from the 1960s, the Committee may be forced to retain the name regardless of the moral argument.

  ### 8. Conclusion

  The Committee cannot hide behind the Terms of Reference to avoid the moral weight of this decision. To keep the name is to judge that the intentional killing of civilians is compatible with the values of this University. I believe it is not. I recommend we remove the name, establish a clear precedent regarding intentional targeting of civilians, and accept the responsibility of making a moral judgment about whom we honour.
