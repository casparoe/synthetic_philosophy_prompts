answer: |-
  The pattern you have identified is indeed philosophically unstable, but not because it is incoherent. Rather, it is unstable because it relies on a **functionalist taxonomy of media** that masks a deeper metaphysical contradiction. The institutions you describe are operating under an implicit theory I will call **Contextual Stewardship**. This theory holds that the moral valence of a commemoration is not intrinsic to the honoree, but is determined by the relationship between the *medium* of memory and the *temporal mode* in which the public encounters it.

  To reconstruct this implicit theory, we must look at how each device classifies the object of commemoration. The practices you describe are not applying a single standard of "honor" to four different objects. They are applying four different standards of "public utility" to the same moral problem.

  ### I. The Implicit Taxonomy of Media

  Under the regime of Contextual Stewardship, the four devices presuppose distinct ontological categories for the commemorative object:

  1.  **The Statue as Artifact (The Past Tense):**
      When an institution chooses retrofitting (the plaque) for a statue, it presupposes that the statue is no longer primarily an *honorific* but has become an *archival* object. The bronze figure is treated as evidence of the values of the time it was erected, not necessarily the values of the time in which it is viewed.
      *   **Presupposition:** The physical mass of the statue represents historical inertia. To remove it is to falsify history (erasure); to leave it naked is to endorse injustice.
      *   **Function:** The plaque acts as a "warning label." It attempts to sever the link between *presence* and *endorsement*. It says: "This existed, but we no longer affirm what it signifies."

  2.  **The Building Name as Branding (The Present Tense):**
      When an institution removes a name from a building, it presupposes that the name is a active speech act of current affiliation. A building is a functional space used in the present; its name operates like a logo or a signature.
      *   **Presupposition:** A name on a door is not history; it is a current claim of ownership or partnership. Unlike a statue, which is looked *at*, a building is entered *into*.
      *   **Function:** Removal is a act of disavowal. A plaque on a building would imply the institution is still comfortable housing the name; removal implies the relationship is severed. The blank space is not erasure of history (which is kept in archives) but the cessation of a current honor.

  3.  **The Street Name as Commons (The Plural Tense):**
      When a city allows co-naming, it presupposes that the street is a shared thoroughfare rather than a shrine. Street signs are navigational tools first and honorifics second.
      *   **Presupposition:** Civic space is capacious enough to hold contradictory memories simultaneously. The street belongs to everyone, so no single name should monopolize the sign.
      *   **Function:** Additive naming transforms the sign from a declaration of *truth* (This is X Street) to a record of *negotiation* (This is X, also known as Y). It neutralizes the exclusivity of the old name without denying its historical footprint.

  4.  **The Sunset Monument as Discourse (The Future Tense):**
      The sunset monument presupposes that commemoration is a provisional claim on the future, subject to revision.
      *   **Presupposition:** No generation has the authority to bind future generations to its moral judgments in perpetuity.
      *   **Function:** This shifts commemoration from a deed (property) to a license (permission). It acknowledges the fallibility of the present.

  ### II. The Conflict: Why a Plaque Works on Bronze but Not on Brick

  You ask what conception of commemoration allows a plaque to neutralize a statue but not a name. The answer lies in the distinction between **opacity** and **transparency**.

  *   **Statues are Opaque:** A bronze figure is semantically dense. It conveys heroism through posture, material, and scale. A plaque is *textual*. In the implicit theory, text is assumed to have higher cognitive authority than image. The institution bets that the passerby will read the critique and override the visual impact of the hero. The statue becomes an illustration for the text.
  *   **Names are Transparent:** A name on a building is purely linguistic. It has no visual counterweight. If you leave the name and add a plaque, the name remains the primary signifier of the building's identity. The plaque becomes a footnote to the name, rather than the name becoming an exhibit for the plaque. To "neutralize" a name, you must remove the signifier itself, because the signifier *is* the honor.

  **The Instability:** This distinction is philosophically fragile. It assumes that text overrides image (statues) but that image (the building's presence) overrides text (the explanatory plaque). It relies on a psychological bet about how people process information that is empirically debatable. If a plaque fails to neutralize the statue (because the visual dominance remains), the strategy is morally hollow. If a plaque could neutralize a building name (by explaining the controversy), the removal is performative erasure. The practices are inconsistent regarding the power of context to cure moral contamination.

  ### III. Strict Presuppositions vs. Comfortable Fits

  To teach this effectively, you must distinguish what these practices *require* from what they merely *accommodate*.

  **Strict Presuppositions (What must be true for the practice to make sense):**
  1.  **Institutional Authority:** The institution assumes it has the standing to modulate public meaning. It claims the right to decide when a statue is "history" and when a name is "branding."
  2.  **Differentiated Media:** The theory requires that we accept that different media carry different moral weights. If a name and a statue were morally equivalent, the divergent responses would be arbitrary.
  3.  **Reversibility Gradient:** The practices assume that removing a name is easier/less destructive than removing a statue, and that adding a name is easier than removing one. The strategy tracks the *cost of alteration*.

  **Comfortable Fits (What fits the practice but isn't required by it):**
  1.  **The Neutrality of the Blank:** Building removal assumes a blank wall is neutral. It is not; it signifies absence, conflict, or shame. A rival theory could demand the space be immediately filled with a new name to avoid the "void."
  2.  **The Efficacy of the Plaque:** This fits the desire to keep the statue, but it is not philosophically necessary. One could argue that if a statue is morally toxic, context cannot cleanse it. The plaque is a compromise, not a logical necessity of the "artifact" view.
  3.  **The Stability of Co-naming:** Co-naming fits a pluralistic view, but it presupposes the two names can coexist without one subsuming the other. History suggests the older name often dominates usage, rendering the addition symbolic rather than structural.

  ### IV. Philosophical Underdetermination

  There are points where the current practices are underdetermined, meaning multiple theories could justify the same action.

  1.  **The Statue:** Both the "Artifact Theory" (keep it for history) and the "Pedagogical Theory" (keep it to teach about error) justify retrofitting. However, the "Restorative Justice Theory" might demand removal to return the land to the aggrieved community. The current practice ignores the land claim, focusing only on the narrative.
  2.  **The Sunset:** This is the most underdetermined. It could be justified by *epistemic humility* (we might be wrong) or by *political pragmatism* (this will reduce conflict temporarily). The physical object is the same, but the moral justification shifts the obligation. If it is humility, we must be willing to take it down. If it is pragmatism, we may renew it indefinitely despite the "expiration."

  ### V. Rival Theories and Their Consequences

  If you asked your students to abandon Contextual Stewardship, how would the landscape change?

  **Rival 1: Commemoration as Promise**
  *   **Theory:** To erect a monument or name a building is to make a promise to the honoree (or their descendants) and the public that this memory will endure. It is a contract.
  *   **Consequences:**
      *   **Removal becomes a breach of contract.** Stripping a name is morally permissible only if the honoree violated the terms of the "honor" (e.g., fraud, crimes discovered posthumously that void the agreement).
      *   **Sunset Monuments become the default.** If commemoration is a promise, it must have terms. Indefinite monuments are unethical because they bind the future without consent.
      *   **Retrofitting is insufficient.** Adding a plaque does not fulfill the promise of honor, nor does it satisfy the breach. You must either renew the promise (keep it clean) or formally dissolve it (remove it). The middle ground is a broken contract.

  **Rival 2: Commemoration as Surface Control (The Agonistic View)**
  *   **Theory:** Public space is a site of power struggle. Commemoration is not about truth or honor, but about who controls the visible surface of the city.
  *   **Consequences:**
      *   **Neutrality is impossible.** The "blank wall" after a name removal is not neutral; it is a victory mark for the removalists.
      *   **Co-naming is a truce, not a solution.** It is a temporary ceasefire in a territorial dispute.
      *   **Statues must fall.** If the statue is an assertion of dominance (which this theory posits all statues are), a plaque does not disarm it. It merely annotates the dominance. The only logical move is replacement.
      *   **Inconsistency is exposed.** This view highlights that the current pattern is hypocritical: institutions remove names (easy victory) but keep statues (hard victory) to avoid the cost of physical labor and artistic loss.

  ### VI. Conclusion: The Source of the Instability

  The pattern you have observed is philosophically unstable because it attempts to solve a **normative problem** (what do we owe the past and the present?) with a **managerial solution** (how do we manage the physical assets?).

  The implicit theory of Contextual Stewardship allows institutions to avoid choosing between *fidelity to history* (keep the statue) and *justice for the present* (remove the honor). It splits the difference:
  *   On buildings (high utility), it chooses justice (removal).
  *   On statues (high history), it chooses fidelity (retrofitting).
  *   On streets (high sharing), it chooses pluralism (co-naming).
  *   On new works (low risk), it chooses humility (sunset).

  This works administratively, but it fails metaphysically. It commits the institution to the view that a name is more "present" than a statue, and that a street is more "shareable" than a building. If your students challenge the premise that a building name is merely branding, or that a statue is merely history, the entire taxonomy collapses. They would be forced to admit that all four devices are attempts to manage guilt without relinquishing control, and that the variation in response tracks not the *ethics of memory*, but the *cost of change*.

  To stabilize the theory, one would have to argue that the *medium itself carries moral weight*—that bronze speaks differently than brick. If they cannot defend that claim, they are left with a set of ad hoc compromises that look like a philosophy but function as risk management.
