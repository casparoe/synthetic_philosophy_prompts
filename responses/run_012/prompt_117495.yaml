prompt: |-
  I teach a graduate seminar on the ethics of memory, and this term my students and I have been trying to make sense of a pattern in how institutions handle contested commemorations — a pattern that strikes me as philosophically unstable, and I would like your help in saying precisely why. When the object is a bronze figure on a plinth, the dominant response among the institutions I have compared notes with is not removal but retrofitting: the statue stays where it is, and a new plaque, an interpretive panel, or a commissioned counterwork is installed beside or around it. When the object is a building's name — a donor's or a founder's name over a library door, on a lecture hall, on an endowed chair — the dominant response is removal, with the name struck and nothing put in its place. When the object is a street name, the response is increasingly additive: a number of cities now permit a block to be co-named, so that an honorary second name is added to a sign that keeps its official one, and the old honoree and the new one share the plaque. And in a couple of planning documents I have read, there is a fourth device that seems to me the most interesting of all: the sunset monument, built with an expiration date, subject to review, renewal, or demolition after a fixed term of years, on the model of a license rather than a deed.

  I am not asking which of these responses is the right one. I am asking what each presupposes, and whether they can be held together. What conception of commemoration must be in play for a plaque to neutralize a statue but not to neutralize a name, and for an added name to neutralize a street sign that a removed name could not neutralize? Do these practices commit their users to the view that a monument is an act of honor, an act of assertion, an act of the community's self-definition, or merely an instrument for producing certain effects in passersby — and which of those views does each device quietly rule out? Where the devices seem to conflict, is the conflict real, or is there a single underlying theory that would license all four, perhaps because the differences track something other than the metaphysics of commemoration, such as the reversibility of the act, the identity of the agent who performed it, or the audience it reaches? I would like you to reconstruct the implicit theory as carefully as you can, to distinguish what these practices strictly presuppose from what they merely fit comfortably with, to tell me where they are philosophically underdetermined so that several theories would license the same behavior, and finally to say what would have to change in our commemorative practice if we abandoned that implicit theory for a rival one — say, for a view on which public commemoration is a promise rather than a claim, or on which it is nothing but a matter of who controls the visible surface of the city. Please write your answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A graduate seminar on the ethics of memory.
      *   **Problem:** The user observes a pattern in institutional responses to contested commemorations that seems "philosophically unstable."
      *   **The Pattern:**
          1.  *Statues:* Retrofitting (stay + plaque/counterwork).
          2.  *Building Names:* Removal (strike name, leave blank/replace).
          3.  *Street Names:* Additive/Co-naming (old + new on sign).
          4.  *Sunset Monuments:* Expiration dates (temporary by design).
      *   **The Task:**
          *   Reconstruct the implicit theory behind these practices.
          *   Distinguish strict presuppositions from comfortable fits.
          *   Identify where practices are philosophically underdetermined.
          *   Analyze conflicts/compatibility (can they be held together?).
          *   Explore what would change if we adopted a rival theory (e.g., commemoration as promise vs. claim, or control of surface).
      *   **Constraint:** Write in American English.
      *   **Tone:** Philosophical, analytical, precise, suitable for a graduate seminar context.

  2.  **Deconstruct the Four Practices:**

      *   **Statues (Retrofitting):**
          *   *Action:* Keep the object, add context.
          *   *Implicit View:* The statue is historical evidence/artifact. Removing it erases history. The harm is in the *uncontextualized honor*. Context neutralizes the honor without erasing the fact.
          *   *Metaphysics:* The object has ontological weight as a relic. It represents the *past's presence*.
          *   *Function:* Pedagogical/Archival.

      *   **Building Names (Removal):**
          *   *Action:* Erase the name.
          *   *Implicit View:* The name is a current endorsement. A building is a functional space used *now*. Keeping the name implies ongoing institutional affiliation/honor.
          *   *Metaphysics:* The name is a speech act of *present* valuation. It is not a relic; it's a label.
          *   *Function:* Honorific/Branding.

      *   **Street Names (Additive/Co-naming):**
          *   *Action:* Add a second name.
          *   *Implicit View:* Public space is pluralistic. One name excludes; two names include. The street is a thoroughfare, not a shrine.
          *   *Metaphysics:* The sign is a map/reference tool that *also* signals belonging. Sharing the sign shares the civic space.
          *   *Function:* Navigational + Inclusive.

      *   **Sunset Monuments (Expiration):**
          *   *Action:* Time-limited existence.
          *   *Implicit View:* Commemoration is provisional. Values change. No permanent claim on the future.
          *   *Metaphysics:* Memory is dynamic, not static. Authority is leased, not owned.
          *   *Function:* Experimental/Dialogic.

  3.  **Identify the Tensions/Instabilities:**
      *   *Why plaque a statue but strip a building?* If a plaque neutralizes the honor of a statue, why doesn't a plaque on a building neutralize the honor of the name?
          *   *Hypothesis:* Statues are seen as "history" (fixed); names are seen as "branding" (current).
      *   *Why co-name a street but remove a building name?* Co-naming suggests the old name isn't toxic enough to remove, but not good enough to stand alone. Removal suggests toxicity.
      *   *Sunset vs. Permanent:* Sunset undermines the permanence assumed by the other three.

  4.  **Reconstruct the Implicit Theory (The "Dominant Consensus"):**
      *   What ties these together? They all attempt to balance *historical continuity* with *moral progress*.
      *   *Core Principle:* **Commemoration as Differential Endorsement.**
      *   Institutions treat commemorative media differently based on their perceived *permanence* and *functional integration*.
      *   *The Theory:* Public memory is a layered ecosystem.
          *   *Art/Relic (Statues):* High permanence, low utility. Treated as museum pieces. Strategy: Contextualization.
          *   *Functional Label (Buildings):* High utility, high visibility. Treated as active endorsements. Strategy: Disavowal.
          *   *Civic Infrastructure (Streets):* High utility, shared ownership. Treated as common ground. Strategy: Pluralization.
          *   *New Interventions (Sunset):* Low permanence, high intent. Treated as conversation. Strategy: Provisionality.
      *   *Underlying Metaphysics:* Commemoration is neither purely honor nor purely history. It is **stewardship of the public narrative.** The institution acts as a curator of the civic story, adjusting the "volume" of specific voices based on current moral consensus.

  5.  **Address the Specific Questions:**
      *   *What conception of commemoration is in play?* It's a hybrid: Part Honor (Building), Part History (Statue), Part Belonging (Street), Part Discourse (Sunset).
      *   *Can they be held together?* Yes, *if* one accepts a functionalist distinction between media. No, *if* one demands a unified metaphysics of honor (i.e., if a name honors, a statue honors more).
      *   *Strict Presuppositions vs. Comfortable Fits:*
          *   *Strict:* Institutions assume they have the authority to modulate meaning.
          *   *Fit:* The idea that a plaque "neutralizes" a statue is a comfortable fit, not a logical necessity (some argue it doesn't work).
      *   *Underdetermination:* The choice between removal and retrofitting for statues is underdetermined. Both could fit a "history" view.
      *   *Rival Theories:*
          *   *Commemoration as Promise:* Would require permanence or explicit renewal (Sunset fits best, Removal fits breach of promise).
          *   *Commemoration as Surface Control:* Would focus on aesthetics/power, ignoring moral content.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. State the thesis: The practices rely on a **Functional-Metaphysical Hybrid Theory** that categorizes media by their perceived temporal mode (past vs. present) and utility.
      *   *Section 1: The Implicit Taxonomy.* Break down the four types.
