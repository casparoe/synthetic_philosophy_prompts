          *   *Surface Control:* Commemoration is just power. Removal is victory; Retrofitting is compromise.
      *   *Conclusion:* Summarize the instability. The current practice avoids the hard question: *Do we owe the past fidelity or the present justice?* It tries to do both by splitting the difference across media types.

  7.  **Refining the Tone:**
      *   Ensure it sounds like a colleague speaking to a colleague (academic but accessible).
      *   Use precise terminology (illocutionary act, ontological status, functionalism).
      *   Check American English spelling (honor, neutralize, program).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about the plaque neutralizing a statue but not a name?
      *   *Correction:* I need to be explicit about this. A plaque treats the statue as *evidence*; a name on a building is treated as *branding*. Evidence needs context; branding needs accuracy.
      *   *Check:* Did I address the "Sunset" aspect sufficiently?
      *   *Correction:* Ensure the Sunset model is framed as the challenger to the permanence assumption of the other three.
      *   *Check:* Is the distinction between "strict presupposition" and "comfortable fit" clear?
