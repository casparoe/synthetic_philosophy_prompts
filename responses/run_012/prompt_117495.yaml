          *   Street Name = Commons (Shared).
          *   Sunset = Discourse (Future/Provisional).
      *   *Section 2: The Tension (The "Why").* Address the plaque vs. name paradox.
          *   Statues are "opaque" (hard to change), so we add text.
          *   Names are "transparent" (easy to change), so we edit text.
          *   *Key Insight:* The medium dictates the moral strategy.
      *   *Section 3: Philosophical Underdetermination.* Where is the logic loose?
          *   Does a plaque actually neutralize? (The "counter-monument" critique).
