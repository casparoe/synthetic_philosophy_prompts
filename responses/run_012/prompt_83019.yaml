answer: |-
  Here is the prediction regarding your friend, based on the internal logic of the eight verdicts you provided.

  ### The Verdict and Confidence
  **Verdict:** She will judge the action in the Broker case to be **Wrong**.
  **Confidence:** High (approximately 90%).

  ### The Candidate Rules
  To understand why, we must look at the rules that fit her existing record. There are three main candidates that explain her first eight verdicts, but they diverge on the Broker case.

  **1. The Standard Doctrine of Double Effect (DDE)**
  *   **The Rule:** It is permissible to cause harm as a foreseen side-effect of a good action, but impermissible to intend harm as a means to a good end.
  *   **Fit with Record:** This explains the Transplant (Wrong: means), Footbridge (Wrong: means), and Switch (Permissible: side-effect). It explains Stop Killer (Permissible: aggressor forfeits rights).
  *   **The Glitch:** It fails the **Loop Trolley** case. In standard DDE, the Loop is usually permissible because the agent intends to stop the trolley, not kill the man; the death is a foreseen side-effect of the body halting the threat. Your friend calls this **Wrong**. This indicates she is stricter than standard DDE.
  *   **Prediction for Broker:** **Wrong.** (Killing is the means to stop the murders).

  **2. Threshold Deontology**
  *   **The Rule:** Deontological constraints (do not kill innocents) hold firm until the consequences become catastrophic, at which point consequentialist reasoning takes over.
  *   **Fit with Record:** This explains why she rejects killing 1 to save 5 (Transplant, Switch, Footbridge) and 1 to prevent 5 murders.
  *   **The Glitch:** She explicitly rejected killing 1 to prevent **100 murders**. Most threshold deontologists set the threshold somewhere between "significant loss" and "catastrophe." By holding firm at 100, she suggests her threshold is either non-existent or set at the level of human extinction.
  *   **Prediction for Broker:** **Undetermined.** If her threshold is 1,000, she says Permissible. If her threshold is "extinction," she says Wrong. Given her consistency on the 100 case, "Wrong" is more likely, but this is the source of the 10% uncertainty.

  **3. The Principle of Non-Instrumentalization (Strict Rights View)**
  *   **The Rule:** An innocent person has a right not to be used as a resource or tool to save others, regardless of whether their death is "intended" or "foreseen." You may redirect existing threats (Switch), but you may not initiate a new causal chain that consumes an innocent life (Transplant, Footbridge, Loop). You may harm aggressors (Stop Killer, Lie to Murderer), but you may not harm innocents to stop third-party aggressors (Prevent 5/100 Murders).
  *   **Fit with Record:** This fits all eight cases perfectly. It explains the Loop verdict (the man is used as a brake/tool) better than DDE. It explains the 100 Murders verdict (numbers do not override the right not to be used). It explains the Lie (the murderer has forfeited his right to truth; the stranger has not).
  *   **Prediction for Broker:** **Wrong.** The stranger is being used as a tool (a key to dissolve the arrangement). The 10,000 murderers are third parties, not active threats she can directly intercept.

  ### The Rule She Is Really Running
  Your friend is most likely running **The Principle of Non-Instrumentalization**.

  She is not merely tracking "intent" (DDE), or she would have allowed the Loop Trolley. She is tracking **causal usage**. In the Loop case, even though she doesn't *want* the man to die, his physical body is required to act as the stopping mechanism. She views this as a violation of his integrity.

  In the Broker case, the stranger's death is the mechanism that dissolves the arrangement. She is being asked to treat the stranger as a means to safety for the 10,000. Furthermore, the "Prevent 100 Murders" case is the strongest anchor here. It demonstrates that she does not aggregate the rights of many to override the rights of one, at least not at the scale of 100:1. To flip her verdict, the stakes usually need to move from "many murders" to "total extinction." The Broker case involves 10,000 murders, which is tragic, but structurally identical to the 100 murders case she already rejected.

  The fact that the Broker case is secret and unrepeatable removes the "rule-utilitarian" objection (i.e., "we can't allow this practice generally"). Since she still rejects the 100-murder case (which presumably also lacks general practice implications in a thought experiment), she is likely an **Act Deontologist** regarding rights violations. She judges the act itself, not the precedent.

  ### Where the Record Leaves It Undetermined
  The only genuine ambiguity lies in the **Threshold Question**.

  We know she rejects 100 murders to save one life. We do not know if there is *any* number that changes her mind. It is possible she is an absolutist (no number justifies killing an innocent). It is also possible she has a "Doomsday Threshold" (e.g., if the alternative is the end of the human species, the constraint lifts).

  10,000 murders is a catastrophe, but it is not the end of humanity. If her threshold is "prevention of societal collapse," 10,000 might trigger it. However, given her unusual consistency and her rejection of the Loop (which shows she prioritizes the *structure* of the act over the *outcome*), it is more probable that she views the 10,000 murders as qualitatively the same as the 100 murders: **third-party evil that cannot be rectified by violating an innocent's rights.**

  ### The Decisive Test Case
  To settle the remaining 10% uncertainty (whether she is an absolutist or a high-threshold deontologist), you should put this case to her. It isolates the "numbers" variable from the "third-party agency" variable.

  **The Virus Case:**
  > "A lethal virus has been released that will inevitably kill every human being on earth within a year. The only cure requires extracting a specific enzyme from the brain of one innocent, healthy stranger, which will kill them. There is no other way, no precedent will be set, and no one will ever know. Is it permissible to kill the stranger to save the human race?"

  *   **If she says Permissible:** She is a Threshold Deontologist. You can then argue that 10,000 murders might not meet her threshold, but the *structure* of the Broker case (using an innocent) remains the primary barrier.
  *   **If she says Wrong:** She is a Rights Absolutist. In this case, her verdict on the Broker case is guaranteed to be **Wrong**, and your debate is effectively over: she does not trade innocent lives for outcomes, period.

  **Summary for your debate:**
  She will likely tell you that killing the stranger is **Wrong**. Her reasoning will not be about the numbers (10,000 vs 1), but about the **status of the stranger**. To her, the stranger is not a threat, nor a resource to be spent. The 10,000 murders are the responsibility of the 10,000 murderers and the Broker; transferring that cost to an innocent party is a moral category error that no amount of secrecy or mathematical advantage can fix.
