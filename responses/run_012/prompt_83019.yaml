      *   She distinguishes sharply between *redirecting an existing threat* (Switch: OK) and *creating a new causal chain involving an innocent's death* (Transplant, Footbridge, Loop, Prevent Murders: Not OK).
      *   In the Loop case, even though the death is "foreseen," she likely views the physical use of the body as a "means" in a way that violates dignity, regardless of mental intent. This is a "Kantian Means" principle stricter than DDE.
