          *   *Better Idea:* Distinguish between "Using the body" (Loop) and "Numbers." The Loop case showed she isn't a standard DDE follower. The 100 case showed she isn't a low-threshold deontologist.
          *   *The Settler:* A case where the *only* way to save the 10,000 is to *redirect* a threat that naturally passes through the stranger (like Switch) vs. *initiating* harm (like Broker). Wait, Broker is initiating.
          *   *The Real Settler:* We need to know if *any* number changes her mind.
          *   *Proposed Test:* "The Burning Building." You can save 1,000,000 people from burning alive, but the only way is to blow up a wall that crushes 1 innocent bystander (who is not part of the fire's cause). Is this permissible? This mirrors the Broker (initiating harm to save many) but removes the "murderers" aspect to isolate the numbers vs. rights constraint.
          *   *Actually, better test:* To distinguish between "Means" and "Numbers."
          *   *Case:* "The Fat Man on the Switch." The only way to flip the switch to save 10,000 is to drop a heavy object on a man's head to make him fall on the switch. (Means). vs "The Dam." Flooding a valley to save a city.
