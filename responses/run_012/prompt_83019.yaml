      *   *However*, the Broker case adds "Secret/Unrepeatable/No Precedent." This removes the "rule utilitarian" objection (what if everyone did this?). Since she is consistent, she likely operates on act-deontology or rights-based constraints.
      *   *Verdict:* She will say **Wrong**.
      *   *Confidence:* High (85-90%). The jump from 100 to 10,000 is quantitative, not qualitative. Her rejection of the Loop case shows she cares about the *structure* of the action (using a person), not just the outcome or the intent.

  5.  **Drafting the Response:**

      *   *Verdict:* Wrong.
      *   *Confidence:* High.
      *   *Candidate Rules:*
          1.  *Strict Means Principle (Kantian):* Never use an innocent as a means. (Fits all, predicts Wrong).
          2.  *Liability/Forfeiture:* Only harm those responsible for the threat. (Fits all, predicts Wrong).
          3.  *Threshold Deontology:* Constraints hold until catastrophe. (Fits 1-7, but 100 murders was rejected. 10,000 might trigger it. Predicts Permissible *if* threshold is high enough).
