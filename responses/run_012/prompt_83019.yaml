      *   *Most Likely Rule:* A hybrid of **Rights Inviolability** and **Causal Agency**. She treats the innocent stranger as having a right not to be killed that is not outweighed by third-party actions. The Loop case is the clincher: she rejects "foreseen but not intended" if the body is physically utilized. This points to a "Use" prohibition, not just an "Intent" prohibition.
      *   *Undetermination:* The only ambiguity is whether 10,000 constitutes a "catastrophe" that triggers a threshold she didn't admit to at 100. But given her consistency, she likely views 100 as already "large enough" to test that, and she held firm.
      *   *Test Case:* Need to distinguish between "Threshold" and "Absolutist."
          *   *Idea:* Extinction level event? Too sci-fi.
          *   *Idea:* The stranger is *slightly* responsible? No, needs to be innocent.
