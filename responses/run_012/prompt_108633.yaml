  ## THE QUESTION I HOPE NOBODY ASKS
  **Question:** "Who decides what goes on the 'stands fast' ledger? If it's not the sceptic, and not just you, who is the arbiter? Isn't this just majority vote or power?"

  **Response:**
  "The arbiter is the world itself, via resistance. Items stand fast because they survive interaction, not because we vote. If I try to walk through a wall, the wall decides. The ledger is a record of these successes. It is not democratic; it is pragmatic. However, I concede that social agreement stabilises the ledger. But the foundation is worldly resistance."

