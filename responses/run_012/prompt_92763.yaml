answer: |-
  # The Continuity & Function Assessment Protocol (CFAP)
  **For:** City Culture Office Intangible Heritage Register
  **Team Capacity:** 2 Persons
  **Theoretical Basis:** Hobsbawm (*Invented Traditions*), Anderson (*Imagined Communities*)
  **Objective:** To distinguish between *living custom*, *invented tradition*, and *state standardization* without making claims of "authenticity" that invite public backlash.

  ## Part 1: The Procedure

  This protocol is designed to be run by a two-person team. It does not determine "truth" in an absolute sense, but assesses the *social function* and *administrative risk* of the nomination.

  ### Phase 1: The Variance Check (Hobsbawm)
  *Goal: Distinguish Living Custom from Invented Tradition.*
  **Question:** Does the practice allow for drift and adaptation, or does it insist on invariance?
  *   **Indicator A (Living Custom):** The form changes (route, song, date, material) while the community agrees the "essence" remains. *Action: Flag as High Viability.*
  *   **Indicator B (Invented Tradition):** The form is rigid. Deviations are policed. The claim is made that "it has always been done exactly this way." *Action: Flag for Phase 2.*
  *   **Theory Note:** Hobsbawm argues living customs evolve; invented traditions freeze to prove legitimacy. Freezing is not "fake," but it is a signal of a specific social function (usually defense or cohesion).

  ### Phase 2: The Genesis & Context Check (Hobsbawm)
  *Goal: Locate the "Moment of Invention" without requiring archival proof of antiquity.*
  **Question:** Does the claimed origin align with a period of rapid social change?
  *   **Check:** Compare the "claimed date" against city history (redevelopment, regime change, tourism boom, crisis).
  *   **Risk Flag:** If the practice appears suddenly during a crisis (e.g., threat of demolition) but claims to be centuries old, this is a **Provenance Discrepancy**.
  *   **Procedure:** Do not reject based on recentness. Reject based on *discrepancy*. A tradition invented in 1980 is valid heritage *of the 1980s*. A tradition invented in 1980 claiming to be from 1780 is an administrative liability.

  ### Phase 3: The Standardization Check (Anderson)
  *Goal: Identify who "imagined" the community.*
  **Question:** Who defined the "correct" version of this practice?
  *   **Option A (Organic):** Defined by practitioners, changes via consensus.
  *   **Option B (State/Institute):** Defined by an external body (Folklore Institute, Tourism Board, State Census) for exhibition or classification.
  *   **Theory Note:** Anderson's "Census-Map-Museum." If the State already classified it, the City Register is merely duplicating a State map.
  *   **Risk Flag:** If multiple communities claim the *same* standardized practice, the "Imagined Community" is contested. Registration will intervene in a conflict.

  ### Phase 4: The Anderson Safeguard (Imagined $\neq$ False)
  *Goal: Prevent the "Fake Heritage" Accusation.*
  **Mandatory Finding:** If the practice is found to be "Invented" (Phase 1) or "Recent" (Phase 2), the team **must not** frame the rejection as "inauthentic."
  *   **Wording Constraint:** Rejections must cite "Insufficient Documentation of Continuity" or "Jurisdictional Overlap," never "Invented" or "Recent."
  *   **Acceptance Condition:** We may register recent inventions *if* the nomination acknowledges the actual origin. We register the *social function*, not the *myth*.

  ### Phase 5: The Administrator's Flag (Human Judgment)
  *Goal: Hand off political decisions to the Director.*
  **Trigger:** If Phase 2 (Provenance Discrepancy) or Phase 3 (Contested Ownership) is flagged, the team cannot make the final call.
  *   **Reasoning:** This is no longer a question of fact, but of **City Policy**. Do we support the community's myth to preserve cohesion? Or do we preserve the Register's accuracy at the risk of conflict?
  *   **Output:** A one-page brief for the Director outlining the risk. The Director signs the rejection letter, not the team.

  ---

  ## Part 2: Application to Current Nominations

  Here is the assessment of the three files on your desk, run through the CFAP.

  ### 1. The Paper-Lantern Procession (Old Fishing Quarter)
  *   **Phase 1 (Variance):** **Rigid.** Song and costumes were written by a specific teacher; likely policed to maintain the "look" of antiquity. (Flag: Invented Tradition).
  *   **Phase 2 (Genesis):** **Discrepancy.** Claim: Centuries. Fact: 1981. Context: Redevelopment threat. This fits Hobsbawm's model perfectly: a tradition invented to mobilize community defense during a rupture.
  *   **Phase 3 (Standardization):** **Organic/Defensive.** Invented by residents, not the State.
  *   **Phase 4 (Safeguard):** The practice is socially "real" (Anderson). It holds the community together. However, the *claim* of antiquity is factually falsifiable (school records exist).
  *   **Phase 5 (Admin Flag):** **RAISED.**
      *   *Risk:* If we register it as "Centuries Old," we are complicit in a lie. If the paper finds the 1981 records, they will say we certified a fraud.
      *   *Mitigation:* We can only register it if the description is amended to "Established 1980s Community Resistance Tradition."
      *   *Likely Outcome:* The group will refuse the amendment.
  *   **Verdict:** **NO.** (But the reasoning must be "Documentation of continuity prior to 1980 is unavailable," not "It is invented.")
      *   *Why:* You cannot defend a factual falsehood in a public register. This is the one you can say no to without violating Anderson, provided you do not call it fake. You are rejecting the *claim*, not the *community*.

  ### 2. The Saint's Day (Continuous since 1700s)
  *   **Phase 1 (Variance):** **Fluid.** Route, effigy, and date change every year.
  *   **Phase 2 (Genesis):** **Continuous.** Records exist back to 1700s. No rupture found.
  *   **Phase 3 (Standardization):** **Organic.** Changes are driven by practitioners, not an institute.
  *   **Phase 4 (Safeguard):** The nomination *insists* it is unchanging. This is Hobsbawm's "Invented Tradition" rhetoric applied to a "Living Custom."
  *   **Phase 5 (Admin Flag):** **RAISED.**
      *   *Risk:* Bureaucratically, this is a nightmare. You cannot catalogue something that changes every year. You *want* to say no because it defies classification.
      *   *Theory Constraint:* Hobsbawm dictates that this *drift* is the marker of authentic living heritage. To reject it because it changes is to impose "Invented Tradition" rigidity on a "Living Custom." Anderson says the community imagines continuity *through* the change.
  *   **Verdict:** **YES.** (Even though you don't want to).
      *   *Condition:* You must register it as an "Evolving Custom." You must edit their nomination text to remove the claim of "unchanging."
      *   *Why:* This is the only file that is theoretically robust. Rejecting it makes you the villain who "froze" heritage. Accepting it requires you to embrace the messiness of actual culture.

  ### 3. The Weaving Pattern (Family/State Claim)
  *   **Phase 1 (Variance):** **Rigid.** Standardized pattern.
  *   **Phase 2 (Genesis):** **State Invention.** 1960s State Folklore Institute.
  *   **Phase 3 (Standardization):** **State/Top-Down.** This is Anderson's "Museum" function in action. The State created the "folklore" for an exhibition.
  *   **Phase 4 (Safeguard):** It is now "real" because people believe it (Anderson). However, it is not *city* heritage; it is *state* heritage.
  *   **Phase 5 (Admin Flag):** **RAISED.**
      *   *Risk:* Contested ownership (Neighboring village).
      *   *Theory Constraint:* Hobsbawm warns against top-down inventions masquerading as local custom. Anderson warns against the City duplicating the State's Map.
  *   **Verdict:** **NO.**
      *   *Reasoning:* "Jurisdictional Overlap" and "Prior State Classification."
      *   *Why:* This is the safest "No." It acknowledges the practice exists but declines the City's role in standardizing a State-created asset that is already contested.

  ## Summary for the Director

  | Nomination | Recommendation | Theoretical Justification | Administrative Reasoning (For the Letter) |
  | :--- | :--- | :--- | :--- |
  | **Lanterns** | **Reject** | Hobsbawm: Invented Tradition with Provenance Discrepancy. | "Unable to verify continuity prior to 1980." (Do not mention 'invented'). |
