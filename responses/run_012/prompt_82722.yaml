      *   *Reasoning:* The panel seems stricter on "invisible" conditions unless there is proof of *failed* participation (Case 3 had dismissals; Case 1 had strict chaperone need). This claimant is abstinent (managed, like Case 6) and has no severe pathology (like Case 5). The caring role is 15 hours, which the panel might view as compatible with part-time or flexible work, unlike the agoraphobia in Case 1 which prevented *independent* travel. The "6 years out of work" might be viewed as de-skilling rather than incapacity (contrast Case 4, roofer to desk).
