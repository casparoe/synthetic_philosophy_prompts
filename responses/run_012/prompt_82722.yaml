      *   *Pivot:* Actually, the "Caring" aspect is the wildcard. In Case 1, the sister's presence was a *medical necessity* for the claimant. Here, the mother's needs are a *demand on* the claimant. The system usually treats caring responsibilities as separate from medical incapacity.
      *   *Refined Best Guess:* **Dismiss.** The panel distinguishes between medical incapacity and social circumstance (caring, age, lack of quals). The medical evidence is "thin" (mild liver changes, abstinent). This mirrors Case 5 (pain behaviour, no scan) and Case 6 (managed condition).

  6.  **Developing the "Watch Case":**
      *   To distinguish between "Managed Condition" (Case 6/Alcohol) and "Reliability Risk" (Case 3/Migraine).
