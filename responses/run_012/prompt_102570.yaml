  # The Responsibility Gap Diagnostic Tree

  This instrument is designed to move your reading group from abstract labels to concrete commitments. It begins with the phenomenology of the error (the "Gap"), moves through the locus of burden (the "Target"), and ends with the mechanism of remedy (the "Solution").

  **Instructions:** Start at Node 1. Answer based on your intuition about the anchored case. Follow the path until you reach a Leaf. Compare your Leaf with your peers'; if you are at the same Leaf but disagree on the "Awkward Commitment," your disagreement is likely about implementation, not theory.

  ### The Tree

  **Node 1 (The Gap Type)**
  *Case: An autonomous surgical robot selects a plan the supervising surgeon would not have chosen, resulting in harm.*
  **Question:** Is the core problem that *no human* satisfies the conditions for responsibility (a gap in the ledger), or that *too many humans* are candidates and we cannot agree which one to burden (a gap in the conversation)?
  *   **A:** No human satisfies conditions (Attribution/ledger gap). → Go to Node 2.
  *   **B:** We cannot agree which human (Allocation/conversation gap). → Go to Node 6.

  **Node 2 (The Deployment Stance)**
  *Case: A lethal autonomous weapon (LAW) selects targets without human intervention.*
  **Question:** Does this lack of a responsible human mean we must stop using the system entirely, or can we manage the risk while deploying?
  *   **A:** Stop using the system. → **Leaf 1**.
  *   **B:** Manage the risk while deploying. → Go to Node 3.

  **Node 3 (The Control Requirement)**
  *Case: The surgical robot again.*
  **Question:** To manage the risk, must we require that a human *could* have intervened or overridden the decision (meaningful human control), or is full autonomy permissible?
  *   **A:** Human intervention must be possible. → **Leaf 2**.
  *   **B:** Full autonomy is permissible. → Go to Node 4.

  **Node 4 (The Remedy Timing)**
  *Case: A high-frequency trading (HFT) algorithm triggers a flash crash.*
  **Question:** Do we fix this by regulating the design before deployment (ex ante), or by compensating victims after the crash (ex post)?
  *   **A:** Regulate the design. → **Leaf 2** (Merged with Node 3A).
  *   **B:** Compensate victims. → Go to Node 5.

  **Node 5 (The Compensation Source)**
  *Case: The HFT flash crash.*
  **Question:** Should the compensation fund come from a tax on the specific users of the tech, or from general public revenue?
  *   **A:** Tax the users/industry. → **Leaf 3**.
  *   **B:** General public revenue. → **Leaf 4**.

  **Node 6 (The Deployment Stance: Allocation)**
  *Case: A content-moderation classifier removes protected speech.*
  **Question:** Does the inability to agree on who is to blame justify halting deployment, or should we deploy and fix the accounting later?
  *   **A:** Halt deployment. → **Leaf 1** (Merged with Node 2A).
  *   **B:** Fix accounting later. → Go to Node 7.

  **Node 7 (The Locus of Responsibility)**
  *Case: The content-moderation classifier.*
  **Question:** Must responsibility ultimately land on a specific natural person's mental state (engineer, manager), or can it land on a collective budget or process?
  *   **A:** Specific natural person. → Go to Node 8.
  *   **B:** Collective budget/process. → Go to Node 10.

  **Node 8 (The Individual Target)**
  *Case: The surgical robot.*
  **Question:** If it is a specific person, are we blaming the person who used it (surgeon) or the person who made it (manufacturer)?
  *   **A:** The user (surgeon). → Go to Node 9.
  *   **B:** The maker (manufacturer). → **Leaf 6**.

  **Node 9 (The Individual Remedy)**
  *Case: The surgical robot.*
  **Question:** Do we require that the surgeon could have foreseen the error (ex ante), or do we hold them liable simply because they were in the loop (ex post)?
  *   **A:** Must have foreseen it. → **Leaf 5**.
  *   **B:** Liable for being in the loop. → **Leaf 6** (Merged with Node 8B).

  **Node 10 (The Collective Remedy)**
  *Case: The HFT algorithm.*
  **Question:** Do we fix this by requiring safety audits before trading (ex ante), or by pooling risk across the industry (ex post)?
  *   **A:** Safety audits. → **Leaf 7**.
  *   **B:** Pool risk. → **Leaf 3** (Merged with Node 5A).

  ---

  ### The Leaves (Positions)

  **Leaf 1: Precautionary Moratorium**
  *Defenders:* Ban Advocates (e.g., Campaign to Stop Killer Robots).
  *Awkward Commitment:* We must forgo the benefits of the technology (e.g., precision surgery, market liquidity) indefinitely because our moral accounting is incomplete.

  **Leaf 2: Meaningful Human Control (MHC)**
  *Defenders:* MHC Proponents (e.g., Santoni de Sio, van den Hoven).
  *Awkward Commitment:* We must retain a human in the loop even if the human is functionally a "button-pusher" who cannot cognitively process the machine's decision in time.

  **Leaf 3: Industry Risk Pooling**
  *Defenders:* Risk-Based Liability Scholars (e.g., Abraham, some Law & Econ scholars).
  *Awkward Commitment:* Innocent users of the technology must subsidize the harms caused by the most reckless actors in their industry via higher costs.

  **Leaf 4: Public No-Fault Compensation**
  *Defenders:* Welfare State Proponents (e.g., some European Commission advisors).
  *Awkward Commitment:* The general public, including those who never use or benefit from the autonomous system, must pay for its inevitable failures.

  **Leaf 5: Traditional Tracing**
  *Defenders:* Compatibilists (e.g., Fischer, Ravizza).
  *Awkward Commitment:* In complex socio-technical systems, many victims will go uncompensated because no specific individual can be proven to have "foreseen" the specific harm.

  **Leaf 6: Strict Product Liability**
  *Defenders:* Consumer Protection Advocates (e.g., Tort Law Reformers).
  *Awkward Commitment:* Manufacturers are responsible for harms even when the system behaved exactly as designed and no "defect" in the traditional sense can be identified.

  **Leaf 7: Regulatory Compliance**
  *Defenders:* Administrative Law Scholars (e.g., Coglianese).
  *Awkward Commitment:* A system that passes all safety audits is morally "clean," even if it causes catastrophic harm due to an unanticipated interaction that the audit did not cover.

  ---

  ### Diagnostic Notes for the Group

  **1. Empty Combinations (The "Incoherent" Zones)**
  *   **Attribution Gap + Individual Responsibility:** You cannot reach Leaf 5 or 6 from Node 1A. If no one satisfies the conditions for responsibility (Attribution Gap), assigning blame to a specific individual (Leaf 5/6) is logically incoherent. This view is empty because it contradicts the premise of Node 1A.
  *   **Allocation Gap + Precautionary Moratorium:** Node 6A routes to Leaf 1. While possible, this is theoretically unstable. If the gap is merely *allocation* (someone is responsible, we just don't know who), halting deployment treats it as an *attribution* gap. Defenders of this path usually collapse into Leaf 1 arguments anyway.

  **2. Indistinguishable Leaves (The "Papering Over" Zones)**
  *   **Leaf 2 (MHC) vs. Leaf 7 (Compliance):** In practice, "requiring human control" (Leaf 2) and "requiring safety audits" (Leaf 7) often result in identical regulatory checklists. The tree separates them based on *who* is the fail-safe (human vs. process), but your engineers may report that the implementation is identical.
  *   **Leaf 6 (Strict Liability) Convergence:** Node 8B (Maker) and Node 9B (User in loop) both lead to Leaf 6. The tree cannot separate "Manufacturer Strict Liability" from "User Strict Liability" at the Leaf level, though the *target* differs. If your group agrees on the Leaf but fights about the target, you have solved the theoretical disagreement and are now arguing about policy targeting.

  **3. The "Label-Sorting" Trap**
  *   If someone claims to be a **"Tracing"** theorist, they should land on **Leaf 5**. If they land on Leaf 6, they are functionally a Strict Liability advocate, regardless of their philosophical self-description.
  *   If someone claims the gap is a **"Liability-Insurance"** problem, they should land on **Leaf 3 or 4**. If they land on Leaf 1, they are not solving the allocation problem; they are avoiding it via moratorium.

  **4. Node Count & Structure**
  *   **Internal Nodes:** 10.
  *   **Leaves:** 7.
  *   **Merges:** Note that Leaf 2, Leaf 3, and Leaf 6 are reached via multiple paths. This indicates that different philosophical routes (e.g., Attribution vs. Allocation) can converge on the same policy prescription, which is a common source of confusion in your discussions.
