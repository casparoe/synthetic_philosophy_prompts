answer: |-
  Thank you, Dean [Name], for that introduction, and for talking me into this. I'm standing here partly because I teach archaeology, and partly because I haven't successfully said "no" to an administrator since 2004.

  To the graduating class: congratulations. To the families: thank you for supporting these students, and for pretending to understand what "material culture analysis" means. To my colleagues in the front row: I see you. I know you're listening for errors. I promise not to say "Bronze Age collapse" without qualifying it.

  Usually, commencement speeches are about the future. You are supposed to look forward; I am supposed to tell you how bright it is. But I'm an archaeologist. My job is to look at what's buried. And for the last few years, I've been circling a question that feels inappropriate for a celebration, but honest for a send-off. It's the question of whether the biggest change in human history—the shift to farming—was actually a good idea.

  You've probably heard the headline: "Agriculture was a mistake." It's a provocative idea. The argument is that before farming, people worked less, ate better, and suffered fewer epidemics. And there is truth there. But if I tell you that civilization is a disaster, I'm not sending you off well. And if I tell you it's a triumph, I'm lying to you.

  The reality is messier. Farming didn't arrive on a Tuesday afternoon because someone had a bad idea. It crept in. Region by region, over thousands of years. In some places, people were living in settled villages with storage and some hierarchy before they were farming much at all. There was no single moment we chose wrong.

  And we shouldn't romanticize the alternative. The idea of the "affluent forager" working a fifteen-hour week is real data, but it describes particular groups in particular seasons. There is plenty of evidence of violence, hunger, and child mortality among foragers, too. Life was not a paradise before wheat.

  But something did change. Early farming villages often look pretty level in the archaeological record. Real hierarchy shows up late and unevenly. The trouble wasn't the calories or the teeth, though those got worse. The trouble was what storage and surplus eventually made it possible for some people to do to others. Once you have grain in a silo, you can guard it. Once you can guard it, you can hoard it. Once you can hoard it, you can starve someone who doesn't obey you.

  My own view is that calling it a "mistake" is a category error. Nobody chose it. It was a demographic ratchet. Farming feeds more mouths per acre. More mouths mean you need more acres. You can't un-ratchet that. You can't go back. So the interesting question isn't whether we chose poorly, but whether something can be a catastrophe without being anyone's error.

  I tell you this because you are graduating into a world full of ratchets. You are stepping into economic systems, climate realities, and technologies that feel locked in. You didn't choose them, but you inherit them. It is tempting to look at the locked-in systems of your adult life—the debt, the carbon, the algorithms—and feel paralyzed. If the foundation is flawed, why build on it?

  But here is what the dirt teaches me. We are still here. The ratchet locked, but we kept living. We kept making art, and kinship, and meaning inside the constraint. The inequality wasn't immediate; it took generations to lock in. That means the locking isn't inevitable. It means there are moments where the gear slips.

  You cannot undo the Neolithic. You cannot go back to a world without surplus or storage or systems. But you can decide what the surplus is for. You can decide who gets fed from the silo. You can build structures that are less eager to hoard power.

  So, my blessing to you is not that you will solve everything. It is that you will recognize the ratchets. When you find yourself in a system that demands more growth than is good, or more hierarchy than is just, know that it is not natural law. It is just old technology. You have the agency to adjust the gear.

  Go build something. Just please, check the foundation every few years.

  " You cannot undo the Neolithic, but you can decide what the surplus is for."

  Verdict: The agricultural revolution was not a conscious mistake, but a demographic trap whose consequences we are still responsible for managing.
