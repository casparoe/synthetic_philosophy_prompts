      *   Verdict: It's not just relabeling, but it requires a substantive metaphysical claim about the nature of concepts.

  9.  (Self-Correction during drafting): Make sure to address the Time Travel/Grandparent point. That's usually a logical impossibility vs. metaphysical. Water is metaphysical necessity. Grandparents is logical/causal. Keep the focus on Water as the stronger analogy for the Physicalist critique.

  10. **Final Polish:** Ensure the "price" is clear. The price is accepting Two-Dimensional Semantics and the Transparency of Experience.

  *(Self-Correction)*: Wait, I need to be careful not to say "Ideal Conceivability" *guarantees* the conclusion. It just saves the premise from the Water objection. The Physicalist can still argue that *even* ideal conceivability doesn't entail possibility for consciousness if they adopt the Phenomenal Concept Strategy. I should mention that risk.

  Okay, ready to write. The structure will be:
