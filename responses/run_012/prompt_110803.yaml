      *   **Topic:** The fall of Robespierre (9 Thermidor).
      *   **Task:** Analyse the event through three standard lenses (Class Struggle, Ideology, Contingency).
      *   **Core Task:** Test a specific "pet theory" called the "Revolutionary Ratchet" (revolutions devour their children because factions must out-denounce predecessors to prove sincerity, narrowing the coalition until implosion).
      *   **Comparison:** Does the Ratchet explain Thermidor better than the standard three?
      *   **Limitations:** Where does the Ratchet break? (Prediction of *who* vs. *that*).
      *   **Reflexivity:** What does Thermidor show about the Ratchet thesis itself?
      *   **Constraints:** No readings or citations. British English.
      *   **Tone:** Academic, analytical, rigorous but conversational enough for a brainstorming partner.

  2.  **Deconstruct the Standard Lenses (9 Thermidor):**
      *   *Class Struggle:* Traditional Marxist view (Soboul, etc.). The bourgeoisie turning on the *sans-culottes*? Or the Thermidorians representing property owners against the "excesses" of the Terror? Robespierre as a petty-bourgeois anomaly?
      *   *Ideology:* Republican virtue, Rousseauian general will, the Incorruptible vs. the Dantonists/Hebertists. The logic of virtue requiring terror.
      *   *Contingency:* The specific mechanics of the day. Tallien's fear, the conspiracy in the committees, Robespierre's hesitation, the misunderstanding about the arrest decree.

  3.  **Deconstruct the "Revolutionary Ratchet":**
      *   *Mechanism:* Out-denunciation -> Purity Spiral -> Coalition Narrowing -> Implosion.
      *   *Key feature:* It's structural/performative, not necessarily rooted in material class interest or deep philosophical conviction, but in the *logic of legitimacy* within a revolutionary context.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the student's level. Set the scene (9 Thermidor).
      *   **Lens 1: Class Struggle:** Focus on the shift from emergency economy to property rights. The *nouveaux riches* and the bourgeoisie wanting stability. Robespierre becomes an obstacle to accumulation.
      *   **Lens 2: Ideology:** The logic of Virtue. Robespierre's moral absolutism alienated pragmatists. The concept of the 'enemy within' becomes infinite.
      *   **Lens 3: Contingency:** The specific conspiracy. Tallien, Fouché, Billaud-Varenne. Robespierre's silence/speech failure. The role of fear (personal survival).
      *   **Testing the Revolutionary Ratchet:**
          *   *Application:* Does the "out-denouncing" logic fit? Yes. The Girondins denounced the King, Jacobins denounced Girondins, Hebertists denounced Jacobins, Robespierre denounced everyone.
          *   *Comparison:* Is it better? It synthesizes ideology and survival. It explains the *momentum* better than class (which is too slow) or contingency (which is too accidental).
          *   *Limitations:* Does it predict *who*? No. It predicts *that* someone will go. Robespierre survived longer than expected because he controlled the ratchet, but eventually, the ratchet consumed the operator.
          *   *Reflexivity:* What does Thermidor tell us about the Ratchet? The ratchet isn't infinite. It stops when the cost of purity exceeds the benefit of survival. Thermidor is the *release* of the ratchet.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique of the Ratchet:* The Ratchet sounds like a closed loop. But Thermidor was a *break* in the loop. The Convention voted to stop the ratchet. So the Ratchet explains the Terror, but Thermidor is the moment the Ratchet was dismantled.
      *   *British English:* Ensure spelling (analyse, honour, centre, programme) and vocabulary (whilst, amongst, etc., though keep it natural).
      *   *Tone Check:* Avoid being too definitive. Use phrases like "one might argue," "it suggests," "the evidence points to." This is a PhD brainstorming session, not a lecture.

