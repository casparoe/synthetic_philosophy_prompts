answer: |-
  This is a compelling framework for a chapter. The fall of Robespierre is the hinge upon which the entire historiography of the Revolution turns, and testing a structural theory like your 'Revolutionary Ratchet' against the standard materialist, idealist, and accidentalist explanations offers a robust way to interrogate the mechanics of political violence.

  Here is a mapping of 9 Thermidor through the three standard lenses, followed by a stress-test of your Ratchet thesis, its comparative utility, its limitations, and what the event reveals about the thesis itself.

  ### I. The Standard Lenses on 9 Thermidor

  **1. Class Struggle**
  Through this lens, Thermidor is the moment the bourgeoisie reasserted control over a movement that threatened property relations. The Terror, initially a defence of the Republic, had evolved into a threat to the *nouveaux riches* and the commercial bourgeoisie who had profited from assignats and national lands. Robespierre, allied tacitly with the *sans-culottes* and the price controls (the Maximum), represented a petty-bourgeois moralism that obstructed capitalist accumulation.
  *   **The Verdict:** The Convention turned on the Committee of Public Safety because the emergency measures were no longer economically viable for the dominant class. Robespierre was devoured because he stood between the bourgeoisie and stability.
  *   **Weakness:** It struggles to explain the timing. The economic pressure had been building for months; why *this* day? It also flattens the complex alliances within the Convention, treating the Thermidorians as a monolithic class bloc rather than a frightened coalition.

  **2. Ideology**
  Here, the focus is on the logic of Republican Virtue. If the Revolution is defined by moral purity, then compromise is treason. Robespierre's ideology required the elimination of 'corruption'. However, by 1794, the definition of corruption had become so elastic that it encompassed anyone with a past, a fortune, or a differing tactical view.
  *   **The Verdict:** Robespierre fell because his ideology became self-cannibalising. He threatened to purge the Convention itself (the 'tyrants' he hinted at in his speech of 8 Thermidor). The deputies voted for his head to save their own skins from the guillotine of virtue.
  *   **Weakness:** It assumes the actors were driven primarily by philosophical consistency. It underplays the cynical manoeuvring of men like Tallien or Fouché, who were hardly ideologues but survivors.

  **3. Contingency**
  This view emphasises the accidental nature of the event. It was not inevitable. It relied on a specific conspiracy among members of the Committee of Public Safety (Billaud-Varenne, Collot d'Herbois) and General Security who feared they were next on the list. It hinged on Robespierre's illness, his hesitation to name names on 8 Thermidor, and the confusion in the Convention hall the next day.
  *   **The Verdict:** Robespierre fell because a group of frightened men conspired effectively and Robespierre failed to rally the sections in time. Had he spoken sooner, or had the Paris Commune mobilised faster, the outcome might have differed.
  *   **Weakness:** It risks reducing a structural shift to a series of coincidences. It explains *how* it happened, but not *why* the climate was so combustible that a conspiracy could succeed so easily.

  ### II. Testing the 'Revolutionary Ratchet'

  Your thesis posits that legitimacy is derived from radicalism, forcing factions to out-denounce predecessors until the coalition narrows to the point of implosion.

  **Does the Ratchet explain Thermidor better?**
  In several respects, yes. It synthesises the strengths of the other three while mitigating their weaknesses.
  *   **Against Class:** It explains why the 'bourgeois' Thermidorians waited until 1794. The ratchet had to spin through the Girondins, then the Dantonists, then the Hebertists, before the tension became unsustainable. Class interest provided the fuel, but the Ratchet provided the engine.
  *   **Against Ideology:** It accounts for the performative nature of the denunciations without requiring the actors to be true believers. One does not need to be a Rousseauian to use the *language* of virtue to destroy a rival. The Ratchet captures the *instrumentalisation* of ideology.
  *   **Against Contingency:** It suggests that while the specific date was contingent, the *event* of a purge was structural. Once the logic of out-denunciation is established, stability is impossible. The conspiracy was not an accident; it was the inevitable reaction to the narrowing of the circle.

  The Ratchet is superior because it explains the *momentum*. Class and Ideology are static states; the Ratchet is a dynamic process. It captures why the Revolution could not stop at Valmy, or the execution of the King, or the fall of the Girondins. It explains the acceleration.

  ### III. Where the Ratchet Breaks

  You asked if the Ratchet predicts *who* gets devoured, or just *that* someone will. This is the critical fault line in your theory.

  **1. Prediction of 'That' vs. 'Who'**
  The Ratchet definitely predicts *that* someone will be devoured, but it is poor at predicting *who*.
  *   According to the logic of the Ratchet, the most radical faction should survive the longest by denouncing the moderates. Yet, Robespierre, the apparent master of the Ratchet, was the victim.
  *   Why? Because the Ratchet eventually consumes the operator. Robespierre fell not because he was insufficiently radical, but because he attempted to *pause* the Ratchet (via the Law of 22 Prairial, which streamlined executions but removed the Convention's oversight). He tried to institutionalise the purge, which threatened the legislators themselves.
  *   **The Break:** The Ratchet assumes a linear progression of radicalism. Thermidor shows that the mechanism can be jammed. The 'who' is determined not by who is the least revolutionary, but by who poses the greatest immediate threat to the survival of the coalition. Robespierre was devoured not for his sins, but for his power.

  **2. The Limit of Narrowing**
  The Ratchet suggests a narrowing until a single point remains (a dictator or total collapse). Thermidor contradicts this. The Convention managed to widen the coalition again. They absorbed the centre and the right, marginalising the Jacobin left.
  *   The Ratchet does not account for the *exhaustion* of the mechanism. By 9 Thermidor, the currency of denunciation had been devalued. When everyone is a traitor, no one is. The Convention realised that continuing the Ratchet meant their own extinction, so they collectively agreed to break the pawl.

  ### IV. What Thermidor Shows About the Ratchet Thesis

  This is the most vital part for your chapter. You are not just applying the theory; the event interrogates the theory.

  **1. The Ratchet requires a 'Revolutionary Paradigm'**
  The Ratchet only functions so long as 'revolutionary sincerity' is the primary source of legitimacy. Thermidor demonstrates that legitimacy can be re-based. The Convention shifted the source of legitimacy from *Virtue* to *Legality* and *Property*.
  *   **Implication for your thesis:** The Ratchet is not a universal law of revolutions; it is a law of *ideological* revolutions. It ceases to function when the revolutionaries decide to become statesmen. Your thesis needs a condition for when the Ratchet disengages.

  **2. The Role of the Institution**
  The Ratchet focuses on factions and individuals. Thermidor highlights the resilience of the institution (the Convention). The Ratchet assumes the factions are stronger than the structure. 9 Thermidor shows that when the structure (the Assembly) feels threatened by the factions (the Committee), the structure can bite back.
  *   **Implication:** The Ratchet underestimates the conservative inertia of representative bodies, even revolutionary ones. The 'coalition narrowing' hits a wall when it threatens the physical survival of the voting body.

  **3. The Paradox of the 'Last Man Standing'**
  Your theory suggests the coalition narrows until it turns on itself. Thermidor confirms this, but with a twist: it turned on the one man who claimed to represent the Revolution's conscience.
  *   **Implication:** The Ratchet does not necessarily produce the most radical leader in the end; it produces the most isolated. Robespierre's isolation was not just political; it was social. He had denounced the Hebertists (atheists) and the Dantonists (corrupt moderates). He had no base left. The Ratchet creates a vacuum of support.

  ### V. Conclusion for the Chapter

  The Revolutionary Ratchet is a more potent explanatory tool for the *Terror* than for *Thermidor*. It explains the climb perfectly: the necessity of out-denunciation drove the escalation from 1792 to 1794. However, 9 Thermidor represents the moment the Ratchet snapped.

  If you use this case study, your argument should be nuanced: The Ratchet explains the *necessity* of the purge, but not the *outcome*. It predicts a crisis of legitimacy, but not its resolution. Thermidor proves that revolutions do not inevitably devour all their children; they eventually spit them out when the cost of digestion becomes too high.

  The Ratchet is a mechanism of escalation, but Thermidor is the evidence of a safety valve. Your thesis holds true only up to the point where the participants prioritise survival over sincerity. 9 Thermidor is the moment sincerity was sacrificed for survival. Therefore, the Ratchet is not a closed loop; it is a spiral that can be exited, but only through a violent rupture with the revolutionary logic itself.

  In British academic terms, you might argue that the Ratchet is a necessary but insufficient condition. It provides the tension, but the release is determined by institutional self-preservation. That distinction could be the core contribution of your chapter.
