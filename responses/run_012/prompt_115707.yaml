answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION (R & E)**

  **I. AGREED CLAIMS**
  1.  **Truth-Aptness:** Moral sentences (e.g., "Murder is wrong") are truth-apt. They are not merely emotional ejaculations; they function logically as propositions. *[Note: Accepted deflationarily by E, robustly by R. Error theorists reject this.]*
  2.  **Disagreement:** Moral disagreements are genuine conflicts of belief, not merely incompatible preferences like "I like coffee" vs. "I like tea." Parties aim to correct one another.
  3.  **Justification:** We are prima facie justified in holding many of our core moral beliefs (e.g., gratuitous cruelty is wrong). Global skepticism is false.
  4.  **Normativity:** Moral judgments are internally linked to reasons for action. To judge an act wrong is to judge there is a reason not to do it.

  **II. DISAGREEMENTS, CRUXES, AND TESTS**

  | Disagreement | Crux | Shared Evidence / Test Case | R's Prediction & Falsification Condition | E's Prediction & Falsification Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Metaphysical Status**<br>R: Moral properties are mind-independent, non-natural features of reality.<br>E: Moral properties are projections of attitudes; ontology is exhausted by natural facts + psychology. | Do moral properties appear in the *best causal explanation* of why we hold moral beliefs?<br>*(Is 'wrongness' causally efficacious?)* | **Idealized Inquiry:** Observe convergence in moral beliefs under conditions of full information, impartiality, and reflection. | **Prediction:** Convergence occurs because intuition tracks mind-independent facts.<br>**Falsification:** If convergence fails despite ideal conditions, or if convergence is better explained by shared psychology alone. | **Prediction:** Convergence occurs because shared human sensibilities align under reflection.<br>**Falsification:** If convergence requires positing properties that do no explanatory work (violates parsimony). |
  | **2. Evolutionary Debunking**<br>R: If beliefs are selected for cohesion regardless of truth, justification is defeated unless truth-tracking is restored.<br>E: Justification depends on coherence of attitudes, not tracking mind-independent facts. | **The Tracking Demand:** Does a belief need to be explained by something that tracks the truth in order to be justified?<br>*(Is 'tracking' required for justification?)* | **Genealogical Test:** Demonstrate that specific moral belief *B* (e.g., purity norms) was produced by a mechanism selected for group cohesion, counterfactually insensitive to mind-independent moral facts. | **Prediction:** *B* is unjustified unless a "bridge principle" links cohesion-selected instincts to non-natural truths via intuition.<br>**Falsification (Against R):** If no bridge principle is found and R still claims justification, R admits justification requires no tracking (collapsing into E). | **Prediction:** *B* is justified if it coheres with our reflective attitudes, regardless of evolutionary origin.<br>**Falsification (Against E):** If *B* is shown to be arational (immune to reasoned revision), E admits expressivism fails to capture normativity. |
  | **3. Normative Authority**<br>R: Facts themselves provide reasons.<br>E: Our commitments provide reasons; facts are inert without attitudes. | Can a purely naturalistic psychology explain the *authority* of moral demands without positing non-natural facts?<br>*(Does ontology ground authority?)* | **Phenomenology of Obligation:** Compare the felt authority of moral demands vs. prudential or conventional demands. | **Prediction:** Phenomenology reveals a distinct ontological category (categorical imperative).<br>**Falsification:** If moral authority is phenomenologically indistinguishable from deep social conditioning. | **Prediction:** Phenomenology reveals depth of commitment, not ontology.<br>**Falsification:** If subjects cannot distinguish moral 'must' from prudential 'must' even upon reflection. |

  **III. SPECIFIC FOCUS: EVOLUTIONARY DEBUCKING & JUSTIFICATION**
  Regarding the test case where human moral beliefs are produced by a mechanism selected for group cohesion, insensitive to mind-independent truth:

  *   **R's Stance:** If the mechanism is insensitive to truth, justification is defeated *unless* we have independent access (intuition) that corrects the mechanism.
      *   *Evidence against R:* If our "intuitions" are shown to be post-hoc rationalizations of the cohesion mechanism with no corrective power.
  *   **E's Stance:** The demand for "tracking" is misplaced. Justification is internal to the practice of giving reasons.
      *   *Evidence against E:* If the "practice of giving reasons" is shown to be a sham—i.e., if moral reasoning cannot alter attitudes even in principle.
  *   **The Compounding Issue:** R admits non-natural facts do not causally track beliefs. R claims *rational* tracking suffices. E claims *causal* tracking is irrelevant; only *rational* coherence matters.
      *   *Agreed Test:* Can we identify moral beliefs that persist despite failing coherence tests but serving cohesion?
      *   *R:* If yes, those beliefs are unjustified.
      *   *E:* If yes, those beliefs are still justified if they cohere with basic attitudes (risk: conservatism).

  **IV. VERBAL-DISPUTE VERDICT**

  **Is this fight real?**
  Yes, but partially verbal.

  **Where it is Verbal:**
  Both parties agree to the sentence: *"It is true that murder is wrong."*
  *   **E** signs this based on deflationary truth conditions (to assert 'p' is to assert 'it is true that p').
  *   **R** signs this based on correspondence to non-natural facts.
  *   **Resolution:** If R drops the claim that "truth" implies "causal explanatory power," and E drops the claim that "attitude" implies "lack of objectivity," the semantic fight dissolves. They agree on the logic and usage of moral language.

  **Where it is Substantive:**
  The disagreement remains real regarding **explanatory ontology** and **epistemological vulnerability**.
  *   **R** must drop the claim that moral properties explain *why* we have beliefs (causally). If R admits moral facts are causally inert, E's charge of "explanatory idleness" stands, but R accepts it as the cost of normativity.
  *   **E** must drop the claim that normativity requires *no* ontology beyond psychology. If E admits that reflective stability is the only ground, R's charge of "losing authority" stands, but E accepts it as the only coherent ground.

  **Final Determination:**
  The dispute is substantive regarding the **Evolutionary Debunking Argument**. R is vulnerable to genealogy in a way E is not. If genealogy shows insulation from truth, R loses justification; E retains it (provided coherence holds). This is not verbal; it yields different epistemological outcomes. However, if R concedes that "tracking" need not be causal but only rational, and E concedes that "rational coherence" functions *as if* there were truths, the practical difference vanishes. The remaining fight is purely about whether to label the source of coherence "Mind-Independent Fact" or "Reflective Attitude."

  **Recommendation:** Stop arguing about "truth." Argue about **epistemic vulnerability to genealogy**. That is the only live wire.
