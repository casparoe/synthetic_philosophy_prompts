  2.  **Character Profiles:**
      *   **R (Robust Realist):** Moral facts exist mind-independently. Non-naturalist (not reducible to natural facts). Knowledge via intuition/reason. Thinks E changes the subject/loses normativity.
      *   **E (Expressivist/Quasi-Realist):** Moral sentences express/coordinate attitudes. Accepts deflationary truth ('murder is wrong' is true iff murder is wrong). Thinks R adds explanatory idle wheels. Thinks normativity is preserved without metaphysical baggage.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need claims both accept but a nihilist/error theorist would reject.
      *   1. Moral sentences are truth-apt (in some sense). E accepts deflationary truth; R accepts robust truth. Both agree 'Murder is wrong' is not merely a grunt like 'Ouch'.
      *   2. Moral disagreements are genuine disagreements, not just clashes of preference like 'I like ice cream' vs 'I hate ice cream'.
      *   3. Moral judgments provide reasons for action internally (internalism-ish).
      *   4. We are justified in holding many of our current moral beliefs.
      *   *Constraint Check:* Don't pad. Ensure nihilists wouldn't sign. A nihilist thinks moral sentences are false or not truth-apt. So 1 and 4 are good.
      *   *Refinement:* Make sure E's acceptance of truth isn't conflated with R's. Use deflationary wording that R can also accept (since robust truth implies deflationary truth conditions usually).

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need specific disagreements, cruxes, shared evidence, and predictions.
      *   *Key Requirement:* The Evolutionary Debunking Argument (EDA) case.
      *   *Disagreement 1: The Nature of Moral Truth.*
