          *   Prediction E: Convergence explains shared sensibility/utility.
      *   *Disagreement 2: Evolutionary Debunking (The Specific Request).*
          *   Scenario: Beliefs produced by mechanism selected for cohesion, regardless of truth.
          *   Crux: Does this undermine justification unless the mechanism tracks truth?
          *   Evidence: Genealogical analysis of specific moral beliefs (e.g., purity vs. harm).
          *   Prediction R: If cohesion explains it better than truth-tracking, justification is defeated (unless a bridge principle exists). Evidence against R: If no bridge principle is found.
          *   Prediction E: Justification stands because justification is about coherence of attitudes, not tracking mind-independent facts. Evidence against E: If we find our attitudes are arbitrarily manipulable without reason.
      *   *Disagreement 3: Normativity/Reasons.*
          *   R: Facts provide reasons.
          *   E: Attitudes commit us to reasons.
          *   Crux: Can a purely naturalistic psychology explain the *authority* of moral demands without positing non-natural facts?
