  **1. The Empty HOT**
  **Question:** In cases of targetless HOTs, there is no first-order state. You say the subject is still conscious. But conscious of what? If there's no object, aren't you just describing confabulation, not consciousness?
  **Follow-up:** If the HOT alone fixes the phenomenology independent of the target, why do we need the first-order state at all? Doesn't that make your theory a theory of imagination, not perception?

  **2. The Misrepresentation Problem**
  **Question:** If a HOT misrepresents a red perceptual state as green, you say the subject consciously sees green. But the visual system is tracking red. Haven't you severed consciousness from perception?
  **Follow-up:** If consciousness tracks the HOT and perception tracks the world, and they can diverge, don't you have two separate minds? How do they stay synchronized so seamlessly?

  **3. Occurrent vs. Dispositional**
  **Question:** You insist HOTs must be occurrent. But since the HOTs are unconscious, isn't the distinction between "occurrent" and "dispositional" just a label? Is a dispositional HOT theory actually a different theory wearing the same name?
  **Follow-up:** If you say they're different, what work does "occurrent" do? If it doesn't change the empirical predictions, aren't you fighting over semantics?

  **4. Access vs. Phenomenality**
  **Question:** Critics say HOT theory explains access consciousness—reportability—but eliminates phenomenal consciousness. Are you explaining the feeling, or explaining it away?
  **Follow-up:** If you reject the distinction, why does the intuition of "raw feel" persist even when access is denied? Are you betting that everyone else's intuition is wrong?

  **5. The Regress Worry**
  **Question:** The HOT is a mental state. If mental states need HOTs to be conscious, isn't the HOT itself unconscious? How can an unconscious state confer consciousness?
  **Follow-up:** But if the mechanism is dark, how does it light up the target? What specific property of the unconscious thought transfers the "light"?

  **6. The Generality Problem**
  **Question:** How does a HOT lock onto the *right* first-order state? With multiple states firing, what fixes the reference so I'm conscious of seeing red and not hearing noise?
  **Follow-up:** If it's purely causal, what prevents cross-wiring? If a pain state causes a HOT about a visual state, do I consciously see pain?

  **7. Sufficiency vs. Necessity**
  **Question:** Is the HOT sufficient for consciousness, or just necessary? If it's sufficient, then creating a HOT without a first-order state creates consciousness. What turns on this distinction for your theory's viability?
  **Follow-up:** If yes, why haven't we seen this in stimulation studies? If no, then what else is necessary, and why isn't *that* the real source of consciousness?

  **8. Conceptual Capacity (Animals/Infants)**
  **Question:** HOTs require concepts. Do infants or animals have concepts like "I am seeing red"? If not, are they phenomenally unconscious zombies?
  **Follow-up:** If their consciousness is different because their concepts are simpler, isn't consciousness graded by conceptual vocabulary? That seems to contradict the binary nature of your theory.

  **9. The Transitivity Principle**
  **Question:** Your theory rests on the Transitivity Principle: a state is conscious only if we're aware of it. Why accept this principle? It seems to beg the question against unconscious consciousness.
  **Follow-up:** If it's definitional, isn't the theory trivial? You're defining consciousness as awareness, then proving awareness is necessary. Where's the empirical meat?

  **10. Falsification**
  **Question:** What empirical finding would force you to abandon HOT theory? Not tweak it, but drop it.
  **Follow-up:** If we find consciousness without the purported HOT mechanism, will you say the mechanism is just subcortical? How do I know you aren't just moving the goalposts?
