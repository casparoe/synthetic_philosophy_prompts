  But owing to the nature of the **fire**
  Allows no other soul as **witness**
  To what consumes the loose **cotton**.
  There is no bond on this **occasion**
  Save for the keeping of a **habit**.

  Thirty years learnt by rote and **habit**,
  Expecting always flame to follow **again**
  Whenever presented an **occasion**.
  I calibrated burners for the **fire**,
  Measured the weave of the grey **cotton**,
  Yet never saw the link, stood only **witness**.

  I am the sole and silent **witness**
  Behind the screen of steady **habit**?
  The spark leaps across to the **cotton**
  As if it planned to return **again**.
  There is no logic in the **fire**
  That dictates precisely this **occasion**.

  We mark the time and place, the **occasion**,
  Relying on the world to **witness**
  That nothing changes in the **fire**.
  But trust is built on sheer **habit**,
  A hope that it will burn **again**,
  When flame meets fibre of the **cotton**.

  The blackened scrap of charred **cotton**
  Remains the proof of each **occasion**.
  Not that it must occur **again**,
  But that we stand as **witness**
  To order born of sheer **habit**,
  Where nothing binds the fuel to **fire**.

  No iron bond holds **cotton** to the **fire**,
  Though I stand **witness** on each **occasion**
  That ash will follow flame **again** by **habit**.
