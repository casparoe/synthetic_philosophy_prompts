prompt: |-
  I'm a novelist and I need a sample of a character's writing for a manuscript, so what I'm asking for is the writing itself, not advice about it. Write me an excerpt from a wellness program's FAQ page, plus a short "sample day" sidebar, authored by a founder who has gotten it into her head that Nietzsche's late autobiographical writing is basically a diet book. Around 550-650 words, deadpan, no winking at the reader.

  The comedy has to come from the actual content, so here's the raw material she'd be working with. In the section of Twilight of the Idols where he runs through the big errors, he spends a while on the mistake of flipping cause and effect, and his example is the genius: people notice that a great man eats sparingly and lives quietly, then conclude the eating and the quiet living produced the greatness, when he thinks its the reverse — the constitution comes first and the habits are downstream of it. She should build her entire program on that inversion and never once notice that it makes the program useless as a program. She'd also insist that the question of place and climate comes before the question of food — the air, the city, the altitude — and she'd treat alcohol as the enemy of everything, with coffee and tea as lesser offenders. She should have an aggressively anti-universalist piece of fine print (these rules are for me, not for you) sitting right next to a hard sell aimed at everyone. And a section on recreation, where the recreation turns out to be walking and almost no reading, which she presents as a productivity tip.

  The thing I'm satirizing is the wellness industry's move of turning one persons regimen into a universal protocol, and the extra layer that this particular person has half-read a book that is explicitly hostile to exactly that move. So she has to stay internally consistent — don't let her slip into "everybody's different" sincerity that undercuts her halfway through — but by the end the reader should feel the cause/effect inversion turn over in their hands. No direct quotations from Nietzsche, paraphrase only, and don't lean on specific book or chapter titles beyond what I've mentioned; I don't want the piece depending on me having the citations right. Begin with the piece itself, no preface or commentary.
