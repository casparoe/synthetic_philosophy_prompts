answer: |-
  A suburban school board facing a budget deficit announces a public hearing on cutting free lunch programs, offering a $100 "time compensation" stipend to any parent who attends the three-hour evening session, explicitly marketing the payment as reimbursement for lost wages. While the hearing remains legally open to all and the procedure follows standard civic protocol, the only parents who show up are from the lowest-income neighborhoods, many admitting they need the cash to cover the week's groceries, while wealthier parents stay home knowing the meeting is stacked against their interests. The meeting proceeds quietly with little objection, as the attendees feel unable to protest the very cuts that harm them while accepting the board's money, creating a room full of silent, paid witnesses to their own disadvantage.

  **Analysis of Views**
  The corruption view argues this market is permissible because the meaning of the civic hearing remains intact; compensating citizens for time is no different than jury duty or paid internships, so there is no meaning externality that degrades the value of democratic participation. The transaction is viewed as a neutral exchange of time for money that doesn't inherently cheapen the act of attending. In contrast, the exploitation view finds the market repugnant because of the agency externality; the economic desperation of the parents compromises their consent, turning them into instruments of the board's agenda rather than autonomous participants. Their presence doesn't express their will or support, but rather their inability to refuse the money, creating a coercive environment where the poor are pressured to legitimize policies that hurt them.

  **Key Feature and Removal**
  The feature doing the work is the **asymmetry of economic necessity relative to the payment size**. The $100 is trivial to the board and wealthy parents but significant to the attending parents, creating a coercive pressure that distorts the voluntariness of their participation. If you take this feature out—for example, if the stipend was a nominal $5 covering only gas, or if all parents were equally wealthy—the exploitation objection vanishes because the financial pressure no longer overrides their agency, leaving only the neutral exchange of time for compensation that the corruption view accepts.

  **Corruption View Counter-Move**
  A proponent of the corruption view would try to re-describe the case by arguing that putting a price on civic attendance *does* corrupt the meaning of democracy, transforming citizens into employees and political rights into labor contracts. They would claim that by introducing wages, the board changes the social meaning of the hearing from a space of shared governance to a transactional workplace, thereby violating the norm that civic duty should be motivated by common good rather than private gain, ultimately arguing that the market itself degrades the institution regardless of the economic pressure on the participants.
