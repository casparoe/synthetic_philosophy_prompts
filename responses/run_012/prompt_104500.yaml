  # Moore's Paradox: A Decision Tree for Graduates

  **Starting Sentence:** *"It is raining, but I don't believe that it is raining."*

  **Instructions:** Follow the branches by answering the questions based on your intuitions about the sentence. You do not need to know the philosophical theories to answer; just decide what seems most plausible to you.

  ```text
  START: "It is raining, but I don't believe it is raining."
  │
  ├── Q1: Is it possible for a person to genuinely *hold* this thought in their mind?
  │   │
  │   ├── NO (It is psychologically/logically impossible to believe this conjunction)
  │   │   └──► LEAF 1: DOXASTIC LOGIC (Hintikka)
  │   │        (Belief distributes over conjunction; believing (p & ~Bp) implies 
  │   │         believing p and believing ~Bp, which is inconsistent.)
  │   │
  │   └── YES (One can hold the thought, even if it's strange)
  │       │
  │       ├── Q2: If they hold the thought, is the sentence *true*?
  │       │   │
  │       │   ├── NO (The second half "I don't believe" must be false)
  │       │   │   └──► LEAF 2: INCORRIGIBILITY (Cartesian)
  │       │   │        (First-person authority is absolute; if you assert p, you 
  │       │   │         necessarily believe p, making the denial false.)
  │       │   │
  │       │   └── YES (It can be true; I can be wrong about my own mind)
  │       │       │
  │       │       ├── Q3: Is the absurdity in the *meaning* of the words or the *use*?
  │       │       │   │
  │       │       │   ├── MEANING (The sentence lacks a grammar/logic of use)
  │       │       │   │   └──► LEAF 3: WITTGENSTEINIAN (No Language-Game)
  │       │       │   │        (The sentence has no use; it isn't a move in any 
  │       │       │   │         language-game. It looks like a proposition but isn't.)
  │       │       │   │
  │       │       │   └── USE (The sentence is meaningful but defective in practice)
  │       │       │       │
  │       │       │       ├── Q4: When you assert "It is raining", are you *expressing* 
  │       │       │       │   a state of mind or *describing* the world?
  │       │       │       │   │
  │       │       │       │   ├── EXPRESSING (Assertion constitutes the avowal)
  │       │       │       │   │   └──► LEAF 4: EXPRESSIVIST (Performative)
  │       │       │       │   │        (Asserting p just is expressing belief that p. 
  │       │       │   │        │         Saying you don't believe contradicts the act.)
  │       │       │       │   │
  │       │       │       │   └── DESCRIBING (Assertion reports a fact)
  │       │       │       │       │
  │       │       │       │       ├── Q5: Does proper assertion require *Knowledge*?
  │       │       │       │       │   │
  │       │       │       │       │   ├── YES (Knowledge is the norm of assertion)
  │       │       │       │       │   │   └──► LEAF 5: KNOWLEDGE NORM (Williamson)
  │       │       │       │       │   │        (You shouldn't assert what you don't 
  │       │       │       │       │   │         know. The sentence admits you lack 
  │       │       │       │       │   │         the norm required for the first half.)
  │       │       │       │       │   │
  │       │       │       │       │   └── NO (Truth or Justification is enough)
  │       │       │       │       │       │
  │       │       │       │       │       ├── Q6: How do you determine your belief?
  │       │       │       │       │       │   │
  │       │       │       │       │       │   ├── WORLD-DIRECTED (Look at the rain)
  │       │       │       │       │       │   │   └──► LEAF 6: TRANSPARENCY (Evans/Burge)
  │       │       │       │       │       │   │        (Belief is transparent to the 
  │       │       │       │       │       │   │         world. To answer "Do I believe 
  │       │       │       │       │       │   │         p?", I look at whether p is true.)
  │       │       │       │       │       │   │
  │       │       │       │       │       │   └── MIND-DIRECTED (Look inside)
  │       │       │       │       │       │       │
  │       │       │       │       │       │       ├── Q7: Is the sentence *always* absurd?
  │       │       │       │       │       │       │   │
  │       │       │       │       │       │       │   ├── YES (In all contexts)
  │       │       │       │       │       │       │   │   ├── Q8: Is the speaker lying 
  │       │       │       │       │       │       │   │   │   or merely irrational?
  │       │       │       │       │       │       │   │   │   │
  │       │       │       │       │       │       │   │   │   ├── IRRATIONAL (But possible)
  │       │       │       │       │       │       │   │   │   │   └──► LEAF 7: PURE PRAGMATIC (Grice)
  │       │       │       │       │       │       │   │   │   │        (Meaningful & true, but 
  │       │       │       │       │       │       │   │   │   │         violates conversational 
  │       │       │       │       │       │       │   │   │   │         maxims of quantity/quality.)
  │       │       │       │       │       │       │   │   │   │
  │       │       │       │       │       │       │   │   │   └── LYING/ERROR (No real paradox)
  │       │       │       │       │       │       │   │   │       └──► LEAF 8: DEFLATIONARY (Error Theory)
  │       │       │       │       │       │       │   │   │                (There is no deep paradox, 
  │       │       │       │       │       │       │   │   │                 just confusion about belief.)
  │       │       │       │       │       │       │   │   │
  │       │       │       │       │       │       │   └── NO (Depends on context)
  │       │       │       │       │       │       │       └──► LEAF 9: CONTEXTUALIST (Bach)
  │       │       │       │       │       │       │            (Absurdity vanishes in specific 
  │       │       │       │       │       │       │             contexts, e.g., therapy, irony.)
  │       │       │       │       │       │       │
  │       │       │       │       │       │       └── (Alternative Path from Q7: YES)
  │       │       │       │       │       │           └──► LEAF 10: DIVIDED MIND (Self-Deception)
  │       │       │       │       │       │                (The mind is modular; one part believes 
  │       │       │       │       │       │                 p, another monitors and reports ~Bp.)
  ```

  ---

  ### Part A: Variant Analysis
  *Run the tree branches against these variations. Does the absurdity survive? Which leaf does it push you toward?*

  | Variant | Sentence | Absurdity Survives? | Shift in Leaf Position | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Knowledge** | "It's raining but I don't *know* it's raining." | **Yes** (Weakly) | Shifts toward **Knowledge Norm** or **Pure Pragmatic**. | Less paradoxical than belief version. Consistent with humility. Suggests the problem is specifically about the *belief* link, not knowledge. |
  | **Past Tense** | "It was raining but I didn't *believe* it was raining." | **No** | Shifts toward **Incorrigibility** or **Divided Mind**. | Perfectly assertable. Shows the paradox relies on *present-tense* first-person authority. |
  | **Third-Person** | "It's raining but *he* doesn't believe it's raining." | **No** | Shifts toward **Incorrigibility**. | Perfectly assertable. Confirms the problem is specific to the *first-person* perspective. |
  | **AI / LLM** | [Chatbot prints]: "It's raining but I don't believe it's raining." | **Debatable** | Pushes toward **Wittgensteinian** or **Expressivist**. | If AI has no mind, it can't believe. If it's just simulating language, is it a "move in a language-game"? Either it's nonsense (no user) or purely expressive code. |

  ---

  ### Part B: Meta-Commentary on the Tree

  #### 1. Unoccupied Combinations
  *Paths in the tree that yield no philosophical position.*

  *   **Q1 (NO) + Q2 (YES):** *Incoherent.* If it is impossible to hold the thought (Q1-No), asking if the sentence is true when held (Q2-Yes) is a contradiction in terms. Nobody occupies this because it violates the law of non-contradiction regarding possibility.
  *   **Q3 (MEANING) + Q5/Q6/Q7 (Use/Norms):** *Incoherent.* If the sentence lacks meaning or grammar (Wittgensteinian), questions about norms of assertion, knowledge, or context are category errors. You cannot violate a norm of assertion if the string of words isn't an assertion.
  *   **Q7 (NO/Contextual) + Q8 (Lying/Error):** *Unexplored.* Most contextualists argue the sentence remains *semantically* odd but *pragmatically* acceptable in niche contexts. The idea that it becomes a straightforward lie in some contexts is rarely defended, though not strictly incoherent.

  #### 2. Indistinguishable Leaves
  *Positions the tree struggles to pull apart.*

  *   **Expressivist (Leaf 4) vs. Pure Pragmatic (Leaf 7):**
      *   *Problem:* Both predict you shouldn't say the sentence.
      *   *Distinction:* Expressivism says the act *constitutes* the belief (internal connection). Pragmatics says the act *implicates* the belief (external convention).
      *   *Tree Limitation:* Q4 tries to split them, but in practice, "expressing" and "conversationally implicating" often look identical from the outside.
  *   **Incorrigibility (Leaf 2) vs. Transparency (Leaf 6):**
      *   *Problem:* Both rely on the link between world and mind.
      *   *Distinction:* Incorrigibility says I *cannot be wrong* about my belief. Transparency says I *don't check* my belief, I check the world.
      *   *Tree Limitation:* Both lead to the intuition that the second conjunct ("I don't believe") is false when the first is asserted.
  *   **Doxastic Logic (Leaf 1) vs. Divided Mind (Leaf 10):**
      *   *Problem:* Both deal with the possibility of the mental state.
      *   *Distinction:* Logic says the state is impossible. Divided Mind says the state is possible but fragmented.
      *   *Tree Limitation:* Empirical psychology (self-deception) makes Q1 hard to answer confidently without theory.

  #### 3. Note on the AI Case
  The AI variant exposes a limitation in **Leaf 3 (Wittgensteinian)**. If an LLM prints the sentence, is it a "move in a language-game"?
  *   If **Yes**: The AI is a player, and the paradox applies (pushing to **Expressivist** simulation).
  *   If **No**: The AI is a parrot, and the sentence is noise (pushing to **Wittgensteinian**).
  *   *Current Consensus:* Most philosophers treat the AI case as a **Category Error** for this specific tree, as the tree assumes a "speaker" with a mind. You may need to add a "Simulated Agent" leaf if your reading group focuses on philosophy of AI.
