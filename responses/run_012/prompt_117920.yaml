answer: |-
  # Q&A Prep Sheet: Conceivability & Thick Representation
  **Context:** Mind & Metaphysics Reading Group (WIP Talk)
  **Strategy:** Pre-emptive concession + Defensive fortification on the "Thick" definition.

  ### 1. Strategic Concessions (Say these *during* the talk)
  *Don't wait for the Q&A to admit these. If you wait, it looks like you were caught. If you say them early, it looks like nuance.*

  *   **Concede Defeasibility:** "I am not arguing thick conceivability is *infallible*. It's a prima facie guide, defeasible by stronger theoretical reasons."
  *   **Concede Theory-Dependence:** "Conceivability doesn't generate modal force ex nihilo; it signals coherence with our best background theory."
  *   **Concede Gradability:** "'Thick' isn't a binary switch. It's a spectrum of representational detail. I'm arguing zombies fall on the 'thin' end of that spectrum."

  ---

  ### 2. The Objections (Ordered by Damage Potential)

  #### **Threat Level: CRITICAL**
  **Who:** The Two-Dimensionalists (Modal Epistemologists)
  **The Objection:** "Your 'thick' conceivability looks extensionally equivalent to Chalmers' *positive primary conceivability*, and your 'thin' looks like *negative conceivability*. If you're just renaming the 2D machinery, what work is the 'thick' label doing? And if it *is* primary conceivability, why think it entails metaphysical possibility without the further argument that the primary intension picks out a secondary intension? You seem to be assuming the link you need to prove."

  **The Reply (2 mins):**
  "That's a helpful mapping, and I agree there's significant overlap. However, the 2D framework is semantic—it's about how terms pick out referents across worlds. My distinction is *representational*. 'Positive conceivability' can still be satisfied by a schematic model. 'Thick' conceivability requires a level of simulation detail that rules out the schematic gaps where contradictions hide.
  Regarding the link to metaphysical possibility: I'm not claiming thick conceivability *entails* possibility on its own. I'm claiming it's the only *evidence* we get, and that evidence is only reliable when the representation is thick enough to engage the relevant background theory. So, I'm not assuming the link; I'm arguing the link is only forged when the cognitive load of the representation forces engagement with the actual nature of the properties involved."

  **Honest Note (Where you're bluffing):**
  This is your softest spot. If they press that "simulation detail" is just a psychological gloss on "positive conceivability," you have no technical rebuttal. You are relying on the intuition that *more detail* = *more modal security*, which isn't formally established. If they ask for a formal criterion for "thick" vs. "positive," you don't have one. **Pivot to:** "I'm offering a psychological constraint on the semantic machinery."

  #### **Threat Level: HIGH**
  **Who:** The Hardline Kripkean
  **The Objection:** "Kripke already showed this with 'Water = H2O'. I can conceive water isn't H2O. By your lights, is that 'thin'? If yes, why is the zombie case different? If no, then your guide yields false positives on a posteriori necessities. Conceivability is just an illusion of contingency. Admit it's worthless for metaphysics."

  **The Reply (2 mins):**
  "I agree with Kripke that the 'water isn't H2O' case is an illusion, but that's precisely because it's *thin* conceivability. You can represent the superficial properties (clear, liquid, thirst-quenching) without the microstructure. That's a schematic representation.
  The zombie case is different because physicalism claims consciousness *is* a physical process. To thickly conceive a zombie, you'd need to represent the full physical structure *and* represent the absence of consciousness without finding a contradiction. I argue you can't do that thickly; you can only do it thinly by ignoring the physical theory that posits the identity. With water, we *know* the identity is a posteriori. With consciousness, dualists claim we can conceive the separation. I'm saying that separation is only conceivable thinly, by ignoring the background theory that would bind them."

  **Honest Note (Where you're bluffing):**
  You are betting that the audience accepts you can't "thickly" conceive a zombie. A physicalist will agree; a dualist won't. The Kripkean might retort that *all* conceivability of identity statements is thin. **Risk:** You might be forced to admit that *no* identity statement can be thickly conceived as false, which makes your principle trivial.

  #### **Threat Level: MEDIUM**
  **Who:** The Modal Logician
  **The Objection:** "You're sliding between epistemic and metaphysical possibility. When you say 'guide to possibility,' which accessibility relation are we using? If it's epistemic, you haven't said anything about metaphysics. If it's metaphysical, you've begged the question by assuming your thick conceivability accesses it."

  **The Reply (2 mins):**
  "Fair point on terminology. I am talking about *metaphysical* possibility as the target. 'Thick conceivability' is an *epistemic* marker. The claim isn't that the epistemic state creates the metaphysical fact. It's that the epistemic state (thick representation) is the only reliable track we have to the metaphysical fact, *provided* our background theory is true. I'm not defining possibility in terms of conceivability; I'm defining the *evidence* for possibility claims."

  **Honest Note:**
  This is safe ground. Just don't let them drag you into defining the accessibility relation formally. Keep it at the level of "evidence."

  #### **Threat Level: MEDIUM/LOW**
  **Who:** The Cognitive Scientists
  **The Objection:** "You're treating 'thick conceivability' as a normative ideal, but in the lab, mental imagery is fragmentary and reconstructive. There's no psychological kind that matches your 'thick' definition. If humans can't actually do what you describe, your guide is empirically empty."

  **The Reply (2 mins):**
  "I'm not doing psychology; I'm doing modal epistemology. I'm describing a normative standard for when a conceivability claim *ought* to be trusted, not describing what happens in the average brain under fMRI. Of course, actual humans fall short. That just means our modal judgments are often unreliable. It doesn't mean the standard itself is invalid. We don't abandon logic because people make reasoning errors."

  **Honest Note:**
  This is a standard "idealization" defense. It works, but it risks making your theory irrelevant to actual human practice. If they press, concede that "thick" is an idealization we approximate to varying degrees.

  #### **Threat Level: LOW**
  **Who:** The Historian of Philosophy
  **The Objection:** "This is just Hume's 'whatever is distinct is separable' but you've added a 'thick' constraint to avoid the obvious counterexamples. You haven't solved the problem; you've just moved the goalposts."

  **The Reply (2 mins):**
  "Hume did anticipate the basic intuition. But Hume didn't have the benefit of Kripkean a posteriori necessity or the two-dimensionalist critique. He treated all distinct ideas as separable. My 'thick' constraint is the update Hume needs to survive Kripke. It's not just moving goalposts; it's adding the safety equipment Hume's motorcycle was missing."

  **Honest Note:**
  Safe to joke here. The historian likely won't press a technical refutation.

  ---

  ### 3. The "Nightmare Question"
  **Hope nobody asks:** "If the evidential force comes from the *background theory* and not the *imagining*, why do we need conceivability at all? Why not just cite the theory?"

  **Why it's a nightmare:** It renders your central mechanism (conceivability) epiphenomenal. If the theory does the work, conceivability is just a flashlight, not a guide.

  **How to answer if cornered:**
  "Because the theory underdetermines the modal space. Theory tells us what *is*, conceivability helps us navigate what *could be* consistent with what is. The theory provides the constraints; thick conceivability is the heuristic we use to test if a scenario fits within those constraints. We can't just run the theory's algorithm for every modal claim; we need the imaginative simulation to check for coherence we haven't explicitly formalized."
  *(Honest Note: This is weak. It admits conceivability is just a heuristic shortcut for theory. If they push, concede: "It's a discovery tool for us, limited beings, even if an omniscient being would just look at the theory.")*

  ---

  ### 4. Reality Check: The Two-Dimensionalist Distinction
  **You asked for plain truth:**
  Your "Thick/Thin" distinction is **highly vulnerable** to being mapped directly onto **Positive/Negative Conceivability** (Chalmers) or **Primary/Secondary Intensions**.
  *   **Thin** = Negative Conceivability (No contradiction found).
  *   **Thick** = Positive Conceivability (Constructing a coherent scenario).

  **The Risk:** The 2Ders will argue that Chalmers already showed Positive Conceivability $\to$ Primary Possibility, but *not* necessarily Secondary (Metaphysical) Possibility without further argument (the "bridge principle").
  **The Fix:** Do not claim your distinction is *novel* in terms of logical space. Claim it is **psychologically grounded**.
  *   *Say this:* "I'm not proposing a new logical category. I'm arguing that 'Positive Conceivability' is often treated too loosely. My 'Thick' requirement is a stricter *cognitive* condition on Positive Conceivability to ensure it's not just a schematic placeholder."

  If you claim it's a totally new logical distinction, the 2Ders will dismantle you. If you frame it as a **refinement of the cognitive conditions** required for positive conceivability to count as evidence, you survive.
