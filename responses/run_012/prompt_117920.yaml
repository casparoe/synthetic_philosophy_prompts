      *   **Audience:** Specific mix of experts/skeptics:
          *   2 Modal Epistemologists (2D semantics experts).
          *   1 Hardline Kripkean (a posteriori necessity skeptic).
          *   2 Cognitive Scientists (empirical/psychological focus).
          *   1 Historian of Philosophy (Hume comparator).
