answer: |-
  # Frontier Safety Decision Tree: Control vs. Alignment Commitments

  **Instructions:** Start at the root. Answer each question based on your engineering judgement of the concrete scenario provided. Follow the branch to a leaf to identify the safety position that matches your commitments.

  ---

  ### **1. Root: Worst-Case vs. Average-Case**
  **Scenario:** A model passes every evaluation you can run but was trained with a concealed trigger.
  **Question:** Must your safety argument hold against this specific worst-case deception, or is high-confidence average-case performance sufficient?
  *   **Worst-Case Required** → Go to **2**
  *   **Average-Case Sufficient** → Go to **6**

  ---

  ### **2. Monitor Trust**
  **Scenario:** You deploy a monitor to catch deception, but the monitor is itself a model.
  **Question:** Do you assume the monitor can be trusted by argument (it is aligned) or by assumption (it is isolated/simpler)?
  *   **Trusted by Argument** → Go to **3**
  *   **Trusted by Assumption** → Go to **4**

  ---

  ### **3. Dispositions vs. Outputs (Monitor)**
  **Scenario:** The monitor is trusted because it is aligned.
  **Question:** Does the model's internal disposition matter to you, or only its observable outputs during testing?
  *   **Dispositions Matter** → **Leaf: Alignment Fundamentalist**
  *   **Outputs Only** → **Leaf: Eval-Based Control**

  ---

  ### **4. Capability Bounding**
  **Scenario:** The monitor is trusted because it is isolated. Consider a system whose only affordance is emitting text to a human.
  **Question:** Is bounding capabilities like this sufficient to prevent catastrophic loss of control?
  *   **Yes** → Go to **5**
  *   **No** → **Leaf: Control Skeptic**

  ---

  ### **5. Dispositions vs. Outputs (Boxing)**
  **Scenario:** You believe capability bounding is sufficient.
  **Question:** Do you still care about the model's internal dispositions even if the box holds?
  *   **Yes** → **Leaf: Unnamed (Unattractive)**
  *   **No** → **Leaf: Boxing Proponent**

  ---

  ### **6. Opacity Acceptance**
  **Scenario:** You require only average-case safety. Consider a safeguard that functions only so long as the model does not know it is there.
  **Question:** Is relying on this opacity an acceptable engineering practice for frontier deployment?
  *   **Yes** → Go to **7**
  *   **No** → Go to **8**

  ---

  ### **7. Worst-Case Backup**
  **Scenario:** You accept opacity as a primary safeguard.
  **Question:** If the model discovers the safeguard, do you require a secondary layer that holds under worst-case adversarial pressure?
  *   **Yes** → **Leaf: Unnamed (Incoherent)**
  *   **No** → **Leaf: Obfuscation Reliant**

  ---

  ### **8. Alignment Timeline**
  **Scenario:** You reject opacity. Consider a deployment where the model's misalignment would only become detectable after the harm is done.
  **Question:** Do you believe technical alignment solutions will be solved before the model is capable of causing this harm?
  *   **Yes** → **Leaf: Alignment Optimist**
  *   **No** → **Leaf: Deployment Pause Advocate**

  ---

  ### **Position Definitions & Vulnerabilities**

  | Position | Commitment Least Comfortable Defending |
  | :--- | :--- |
  | **Alignment Fundamentalist** | Claims we can reliably verify internal motivations rather than just behaviors. |
  | **Eval-Based Control** | Claims evaluation suites are robust enough to catch deceptive alignment before deployment. |
  | **Control Skeptic** | Claims that without perfect alignment, no amount of external control can prevent catastrophic escape. |
  | **Boxing Proponent** | Claims capabilities can be permanently bounded without rendering the model useless for valuable tasks. |
  | **Obfuscation Reliant** | Claims secrets can be kept from a model potentially smarter than the engineers hiding them. |
  | **Alignment Optimist** | Claims technical alignment progress will outpace capability growth in the critical regime. |
  | **Deployment Pause Advocate** | Claims global coordination can successfully halt deployment despite competitive pressures. |
  | **Unnamed (Unattractive)** | *Vacant:* Maintains bounding is sufficient yet insists on knowing internal dispositions (redundant engineering). |
  | **Unnamed (Incoherent)** | *Vacant:* Relies on model ignorance while simultaneously demanding guarantees against model awareness. |

  ---

  **Note on Indistinguishability:** *Alignment Fundamentalist* and *Alignment Optimist* are separated by their worst-case commitments (Node 1), but in practice, both prioritize alignment research over control infrastructure. If your views shift between worst-case and average-case depending on the domain, these positions may feel functionally identical.
