answer: |-
  ### Session Plan: The Mechanics of the Handicap Principle
  **Time:** 75 Minutes
  **Audience:** Biology & Economics Grads (Conceptually familiar, mechanically vague)
  **Carrying Example:** **Stotting in Thomson's Gazelles** (Predator-Prey Pursuit-Deterrence).
  *Why this example:* It is not mating (excludes sexual selection confounds), not human (excludes cultural noise), and clearly separates physical ability from strategic cost.

  ---

  ### I. The Receiver First (0:00 – 0:15)
  **Goal:** Establish that a signal is a *strategic equilibrium*, not a physical trait.
  **Action:**
  1.  **Draw the Reaction Function:** On the board, draw axes: X = Signal Intensity, Y = Receiver Response (e.g., Probability of Abandoning Chase).
  2.  **The Prerequisite:** State clearly: "There is no handicap without a receiver who changes behavior based on the signal." If the predator ignores the stot, the stot is just exercise.
  3.  **Head Off Misconception #1 (Cost = Signal):**
      *   *The Trap:* Students will assume that because stotting burns calories, it is a signal.
      *   *The Intervention:* At minute 10, pose this: "A gazelle tripping over a rock expends energy and makes noise. Is that a signal?"
      *   *The Fix:* Force them to admit that without the *receiver's conditional response*, cost is just noise. A signal requires a *game*, not just a trait. The receiver's strategy must be on the table *before* we define the sender's cost.

  ### II. The Cost Differential (0:15 – 0:35)
  **Goal:** Move from "Costly" to "Differentially Costly."
  **Action:**
  1.  **Define the Cost:** In stotting, the cost is not just energy; it is **increased risk of capture** if the chase continues. Stotting signals "I am so fast I can waste time jumping."
  2.  **The Marginal Condition:** Explain that for the signal to be stable, the *marginal cost* of stotting must be higher for the low-quality (slower) gazelle than for the high-quality (faster) gazelle.
      *   *Fast Gazelle:* Stots -> Still escapes -> Low marginal cost.
      *   *Slow Gazelle:* Stots -> Gets caught -> High marginal cost (death).
  3.  **Head Off Misconception #2 (Cost = Waste/Group Benefit):**
      *   *The Trap:* Students will argue, "Wasting energy is bad for the species; there must be a collective benefit."
      *   *The Intervention:* At minute 25, when the concept of "waste" arises, stop. Say: "We are not doing group selection."
      *   *The Fix:* Show the individual payoff matrix. The high-quality gazelle benefits *individually* by avoiding the chase. The cost is not a "tax for the good of the herd"; it is the *price of admission* to the equilibrium that prevents the low-quality gazelle from lying. The "waste" is the mechanism of individual stability, not a collective sacrifice.

  ### III. Handicap vs. Index (0:35 – 0:55)
  **Goal:** Distinguish strategic honesty from physical impossibility.
  **Action:**
  1.  **Define the Index:** An index is a signal the low-quality sender *physically cannot produce* (e.g., a deep roar requiring large vocal cords a small animal lacks).
  2.  **Define the Handicap:** A handicap is a signal the low-quality sender *can* produce but *will not*, because the receiver's response makes it unprofitable.
  3.  **Apply to Example:**
      *   *Can* a slow gazelle stot? Yes. It is physically possible.
      *   *Will* it? No, because if it stots and the predator calls the bluff, the slow gazelle dies.
  4.  **Head Off Misconception #3 (Handicap = Index):**
      *   *The Trap:* Students will merge the two, saying "Low-quality signallers simply cannot produce it."
      *   *The Intervention:* At minute 45, explicitly draw the distinction. "If the cost is physiological impossibility, it is an Index. If the cost is strategic unprofitability, it is a Handicap."
      *   *The Fix:* Force them to articulate the *counterfactual*. In an Index, the low-quality sender fails to signal even if no predator is watching. In a Handicap, the low-quality sender *would* signal if the receiver didn't punish them. The honesty in a handicap comes from the *receiver's threat*, not the sender's anatomy.

  ### IV. Synthesis and Closing (0:55 – 1:15)
  **Goal:** Lock in the mechanistic understanding and set boundaries.

  **The Closing Question (Ask this at 1:05):**
  > "If we could magically subsidize the survival cost for the slow gazelle—so it could stot without increasing its risk of capture—would it begin to stot?"
  *   **Correct Answer:** **Yes.** (This proves the cost was doing the work. If it were an Index, the subsidy wouldn't matter; they still couldn't do it. If it were just a trait, they were already doing it.)
  *   **Why this works:** It isolates the *strategic cost* from the *physical trait*.

  **The Explicit Refusal (State this at 1:10):**
  > "I am refusing to cover **the evolutionary origin of the receiver's psychology.**"
  *   **Reasoning:** Do not let the session drift into *why* the predator believes the signal (co-evolution, pre-existing bias, sensory exploitation). That is a separate evolutionary dynamic problem. This session is about the *maintenance of honesty* given a response function. If you try to explain how the predator learned to trust the signal, you will lose the game-theoretic logic of the sender's cost. Keep the receiver's response as a fixed parameter for this model.

  ---

  ### Instructor Notes on Flow
  *   **Board Work:** Keep the Receiver's Reaction Function visible throughout. Do not erase it. It is the anchor.
  *   **Econ vs. Bio:** When Biology students focus on the physiology of the jump, redirect them to the *payoff*. When Economics students focus on the abstract payoff, redirect them to the *biological constraint* (death).
  *   **Pacing:** If you spend more than 20 minutes on the Receiver (Section I), you will run out of time for the Index/Handicap distinction (Section III). Section III is where the deepest confusion lies; protect that time.
