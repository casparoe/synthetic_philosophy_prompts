answer: |-
  ### The Spec: Desiderata for a Theory of Original Value

  **I. The Cases (The theory must predict or explain the valuation in these scenarios)**
  1.  **The Forgery Drop:** Explain why value evaporates upon reattribution despite zero physical change.
  2.  **The Perfect Twin:** Explain why an atom-for-atom duplicate lacks the value of the source, despite perceptual identity.
  3.  **The Honest Replica:** Explain why a known copy can retain significant value (aesthetic/historical) without claiming originality.
  4.  **The Ship of Theseus (Restoration):** Explain at what point material replacement extinguishes "original" status.
  5.  **The Survivor Copy:** Explain the value status of a copy when the original is lost (does it graduate to original?).
  6.  **The Artist's Re-performance:** Explain why a later version by the same artist is a distinct work, not the same original.
  7.  **The Relic (Non-Aesthetic):** Explain the premium on objects like treaty pens or wedding rings where beauty is irrelevant.
  8.  **The Exculpatory Confession:** Explain why admitting to forgery changes the object's normative status (and legal/market value) even if the maker is the same person in both narratives.

  **II. The Distinctions (The theory must not collapse these categories)**
  9.  **Aesthetic vs. Artistic vs. Historical:** Separate the beauty of the surface from the achievement of the act from the fact of causal presence.
  10. **Object vs. Experience:** Distinguish the value of owning/being-near the thing from the value of perceiving it.
  11. **Epistemic vs. Ontological:** Distinguish the value of *knowing* it is real from the value of *it being* real (for someone who doesn't know).
  12. **Autographic vs. Allographic:** Distinguish works where history constitutes the work (painting) from works where notation constitutes the work (novel/score).

  **III. The Puzzles (The theory must dissolve these apparent contradictions)**
  13. **The Reattribution Puzzle:** How can value supervene on something other than physical properties?
  14. **The Indiscernibility Puzzle:** How can two perceptually identical items hold different values?
  15. **The Provenance Puzzle:** Why does a paper trail of ownership add value to the object itself?
  16. **The Location Puzzle:** Where does the "extra" value of the original reside (in the object, the history, or the observer)?

  **IV. The Constraints (The theory must remain consistent with these facts)**
  17. **Beauty Independence:** Ugly originals can be worth more than beautiful copies.
  18. **Market Reality:** The premium is quantifiable and tradable, not merely theoretical.
  19. **Access Sufficiency:** For some purposes (study, enjoyment), a reproduction is functionally equivalent.

  ***

  ### Analysis of Requirements

  **Non-Negotiables (The theory fails without these)**
  *   **The Forgery Drop:** If you cannot explain the value shift on reattribution, you are not theorizing originals, you are theorizing aesthetics.
  *   **Autographic/Allographic Distinction:** If you treat a painting like a poem, you ignore the fundamental ontology of art markets.
  *   **Market Reality:** A theory that claims the premium is illusory contradicts observable economic behavior.

  **Prejudices (Common but dispensable assumptions)**
  *   **The "Aura" Necessity:** Assuming a mystical residue is required privileges Benjamin over economics.
  *   **The Aesthetic Primacy:** Assuming beauty is the primary driver is refuted by the Relic case.
  *   **The Intrinsic Supervenience:** Assuming value must attach to physical properties is refuted by the Forgery Drop.

  ***

  ### The Fault Line: Joint Unsatisfiability

  Your suspicion is correct. The hard fault line lies between **Intrinsic Supervenience** and **The Discovery Case**.

  *   **Requirement A:** Value must supervene on the intrinsic physical properties of the object (The "It's what you see" constraint).
  *   **Requirement B:** The Forgery Drop is real (Value changes when history is revealed, physics constant).

  **Verdict:** These are jointly unsatisfiable. You cannot hold that value is *only* in the molecules and also that value changes when the *history* of the molecules changes. A viable theory must reject Intrinsic Supervenience. It must accept that value is partially **relational** or **historical**, residing in the causal chain, not just the current state.

  ***

  ### The Killer Requirement

  **The Forgery Drop Case.**

  *   **Kills "It's-all-about-beauty":** Beauty remains constant while value plummets.
  *   **Kills "It's-just-sentimental":** Market prices shift objectively, not just in the owner's head.
  *   **Kills "The Aura" (Perceptual):** If aura were perceptual, the forgery would radiate it; if historical, "aura" is just a metaphor for provenance.

  ***

  ### The Exculpatory Confession Requirement

  **The theory must account for the normative weight of truthful genesis.**

  In the case where a forger claims authorship to mitigate charges, the object physically remains the same, but its status shifts from "fraudulent artifact" to "honest fake." A theory of original value owes us an explanation of why **intent and truthful attribution** are constitutive of value independent of the object's beauty or age. It must explain why the *lie* devalues the object more than the *copying* does.
