answer: |-
  Your hypothesis is correct. You have hit the wall because the literature is suffering from a severe **level confusion**, compounded by a disagreement over the **explanandum**. You are not having one argument; you are having three distinct arguments that share a vocabulary but operate on different logical levels.

  Here is the diagnosis of the disagreement, followed by an assessment of what would actually count as progress.

  ### 1. The Diagnosis: Three Axes of Confusion

  Your reading group is stuck because Bratman, Searle, and Gilbert are not trying to solve the same puzzle. They are carving the phenomenon at different joints.

  **Axis 1: The Ontological Question (Searle vs. Bratman)**
  *   **The Question:** Is the "We" a fundamental unit of analysis, or is it a construct of "I"s?
  *   **The Conflict:** This is not primarily a psychological claim; it is a claim about the **logic of content**. Searle's claim that we-intentions are "primitive" is a conceptual claim masquerading as a biological one. He is arguing that you cannot define the *content* of a we-intention (e.g., "We intend to push the car") solely in terms of I-intentions (e.g., "I intend that we push...") without losing the specific phenomenological "feel" or logical structure of the collective.
  *   **The Trap:** Bratman argues you *can* reduce the functional role of the we-intention to interlocking I-intentions. Searle argues you can't reduce the *mode*. They talk past each other because Bratman is offering a functionalist reduction (how it works), while Searle is offering a phenomenological/ontological insistence (what it *is*).

  **Axis 2: The Normative Question (Gilbert vs. Everyone)**
  *   **The Question:** Is obligation constitutive of joint action, or is it a consequence?
  *   **The Conflict:** Gilbert changes the **explanandum**. Bratman and Searle are trying to explain *coordinated behavior* (how do we push the car without crashing?). Gilbert is trying to explain *social entity formation* (when do we become a "plural subject"?).
  *   **The Trap:** For Gilbert, if there is no standing to demand performance, there is no joint commitment. For Bratman, you can have a shared intention that fizzles without anyone being blameworthy. This isn't a psychological dispute; it's a definitional one. Gilbert is doing social ontology; Bratman is doing philosophy of action. When Gilbert says Bratman is missing the "obligation," she means he is missing the *social glue*. When Bratman says Gilbert is adding too much, he means he is explaining *coordination*, not *marriage*.

  **Axis 3: The Implementation Question (The Empirical Gap)**
  *   **The Question:** How is this instantiated in the cognitive architecture?
  *   **The Conflict:** None of the three theories are sufficiently constrained by cognitive science. They are "armchair psychology."
  *   **The Trap:** Searle appeals to biology ("Neurobiological Naturalism") but offers no mechanism. Bratman offers a logical architecture that is computationally expensive (do I really track your tracking of my intention?). Gilbert offers a normative structure that requires conceptual capacities infants lack.

  ### 2. Addressing Your Specific Questions

  **Is Searle's irreducibility claim psychological or descriptive?**
  It is a claim about the **logic of intentionality**. Searle argues that the *direction of fit* and the *mode* of a we-intention are distinct. However, because he ties this to "biological capacity," he invites empirical falsification he cannot sustain. It is best read as a claim that the *phenomenology* of acting together cannot be exhausted by the phenomenology of acting individually + beliefs about others. If you treat it as a hard psychological claim (that there is a specific "we-neuron" or module), it is likely false. If you treat it as a claim about the irreducibility of the *description*, it is tautological.

  **Does Gilbert's obligation make her dispute with Bratman non-psychological?**
  Yes. Gilbert is arguing about the **conditions for being a social group**, not the cognitive mechanics of coordination. Her dispute with Bratman is verbal in the sense that they define "shared intention" differently. Bratman defines it functionally (successful coordination); Gilbert defines it normatively (creation of mutual obligations). You cannot settle this with an experiment because it depends on whether you think a flash-mob pushing a car is the *same kind of thing* as a married couple making dinner. Gilbert says no; Bratman says yes.

  **Do infants count for Searle or against him?**
  This is the strongest evidence against the "conceptual" reading of Searle and for the "capacity" reading. Infants (per Tomasello) engage in joint attention and cooperative action before they have the conceptual machinery for "I intend that we intend."
  *   **Against Searle:** If "we-intention" requires a propositional attitude with a we-mode, infants shouldn't have it.
  *   **For Searle:** If "we-intention" is a primitive biological capacity that *later* gets propositional structure, infants support him.
  *   **The Real Lesson:** It suggests the debate is **developmental**. The "We" might start as a non-conceptual, embodied coupling (phenomenology/enactivism) and only later become the propositional attitude structure Bratman and Searle argue about. Your group is ignoring the developmental trajectory.

  **Is there a deflationary option?**
  Yes. The **Intentional Stance applied to Groups**. If you adopt a Dennettian view, asking "is the we-intention *really* in the head?" is a category error. The question is: "Is the system (the pair) more predictively tractable if we attribute a we-intention to it than if we attribute two I-intentions?"
  *   This dissolves the metaphysical fight. It makes "we-intention" a tool for prediction, not a natural kind.
  *   **Why your group resists it:** Philosophers of action hate deflationism because it sidesteps the question of *agency*. If the "we" is just a predictive fiction, who is responsible when things go wrong?

  **Where does Team Reasoning fit?**
  Team reasoning (Bacharach, Sugden) is the **formalization of the I-mode/We-mode distinction**. It shows that if agents maximize *group* utility rather than *individual* utility, equilibrium outcomes change (e.g., in Hi-Lo games or Prisoner's Dilemmas).
  *   It fits on the **Algorithmic Level**. It shows the *consequences* of adopting a we-mode.
  *   It does not solve the ontological dispute. It doesn't tell you *how* the brain switches to team reasoning, only *that* if it does, the math changes. It is a useful tool for clarifying the stakes, but not for settling the metaphysics.

  ### 3. What Counts as Progress?

  You will not move by analyzing the "walking together" example again. It is too underdetermined. To break the stalemate, you need to force the discussion onto one specific axis.

  **Option A: Admit the Normative Dispute (The Gilbert Solution)**
  Acknowledge that Gilbert is playing a different game.
  *   **Progress:** Agree that Bratman explains *coordination* and Gilbert explains *sociality*.
  *   **Test:** Find a case where coordination exists without obligation (e.g., two strangers pushing a car) and a case where obligation exists without coordination (e.g., a pact to meet that fails). If these are distinct phenomena, Bratman and Gilbert are both right about different things.

  **Option B: Force the Empirical Hand (The Infant/Neuro Solution)**
  Stop doing armchair psychology.
  *   **Progress:** Look at the developmental data (Tomasello, Carpenter) or interactional neuroscience (Dumas et al. on hyperscanning).
  *   **Test:** If joint action requires the complex recursive mind-reading Bratman suggests ("I intend that you intend that I intend..."), infants and animals shouldn't be able to do it. They can. This suggests Bratman's model is too intellectualist. This pushes you toward a **phenomenological** or **enactive** account (e.g., Gallagher, Hutto) where the "we" is in the interaction dynamics, not inside the head. This undermines both Searle (internal state) and Bratman (internal state).

  **Option C: The Deflationary Dissolution**
  Adopt the stance that "collective intentionality" is a cluster concept.
  *   **Progress:** Stop looking for the necessary and sufficient conditions.
  *   **Test:** Treat "we-intention" as a family resemblance concept. Sometimes it's normative (Gilbert), sometimes it's functional (Bratman), sometimes it's phenomenological (Searle).
  *   **Result:** This admits the debate is verbal, but saves the utility of the concept.

  ### Recommendation for the Reading Group

  Your group is stuck in **Conceptual Analysis Purgatory**. You are trying to find the essence of a phenomenon that is likely a cluster of different mechanisms.

  **The Move:**
  Propose that the "Shared Intention" is not a natural kind.
  1.  **Split the Explanandum:** Distinguish **Joint Action** (coordination of behavior) from **Joint Commitment** (creation of a plural subject).
  2.  **Evaluate Bratman** on Joint Action (does his model predict coordination success?).
  3.  **Evaluate Gilbert** on Joint Commitment (does her model predict the emergence of blame/entitlement?).
  4.  **Evaluate Searle** on Phenomenology (does his model capture the *experience* of acting together?).

  If you do this, you will find they are not competitors. They are describing different layers of the same cake. The "wall" you are hitting is the realization that there is no single "thing" called collective intentionality that satisfies all three sets of criteria simultaneously. Admitting that is the only way to move forward.
