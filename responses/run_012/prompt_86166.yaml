answer: |-
  1. Is the distinction between internal representational structure and counterfactual behavioral disposition a genuine ontological fork, or merely an epistemic limitation? This is upstream because if structure just *is* disposition, interpretability research collapses into behavioral testing, dissolving the core methodological conflict; evidence that identical behaviors arise from mutually exclusive internal geometries would raise its priority, whereas a 1:1 mapping of circuits to counterfactuals would lower it.

  2. Can a system whose only causal contact with reality is mediated through text tokens sustain truth-conditional content, or is belief essentially embodied? This is upstream because if belief requires non-linguistic causal traction, LLMs are disqualified regardless of their internal complexity or behavioral finesse; demonstrating that grounded world-models emerge purely from linguistic co-occurrence would lower its priority, while proving syntax without sensorimotor loops cannot reference objects would raise it.

  3. Does optimizing for statistical prediction constitute aiming at truth, or is there a categorical gap between minimizing loss and holding a proposition as true? This is upstream because beliefs are normative states that can be wrong, whereas probabilities are just distributions, so misidentifying them misdescribes the system's nature; showing that loss minimization converges on truth-tracking in the limit would lower its priority, while showing hallucination is a structural feature of the objective would raise it.

  4. At what point does a model's sensitivity to input perturbations become stable enough to support the rationality assumptions required by the intentional stance? This is upstream because Dennett's stance requires rational patterns, meaning if LLM outputs are too brittle, the stance fails regardless of internal structure or grounding; evidence that models maintain consistent belief-attributions across adversarial prompting would lower its priority, while evidence that slight phrasing changes flip "beliefs" arbitrarily would raise it.

  5. Does attributing belief to AI systems yield novel predictive power or safety interventions that non-mentalistic descriptions fail to provide? This is upstream because if the term does no pragmatic work, the metaphysical debate is idle, making this the ultimate validator of the entire project's utility; developing a safety protocol that works only under belief-attribution would lower its priority, while showing mechanical descriptions predict failures better would raise it.
