prompt: |-
  I'm a PhD student working on religion and moral epistemology, and my department keeps leaning on the glue picture: religion is the binding agent that holds a society together, and when it goes you get atomisation, free-riding and distrust. My supervisor used it last week to argue that the high-trust secular countries are living off a religious inheritance they can't replenish — the adhesive is drying out, and contract law, welfare states and reputation markets are too thin to carry the load. He also says the active ingredient is specifically belief in a god who's watching, and calls what's being spent down religious capital. I want the analogy audited, not the politics argued.

  You're a philosopher of religion with a foot in social epistemology — think it through properly before you write, and brainstorm the correspondence first rather than jumping to the verdict. Then give me: (a) the mapping table — glue, the materials being glued, the bond, cure time, load-bearing, failure mode — and what each is supposed to be in the social case; (b) where the mapping breaks, sorted into the breakages that actually matter for what he wants the analogy to do versus the ones that are just decorative; (c) the features the glue picture quietly imports that the target doesn't obviously have — I suspect it smuggles in one binding substance rather than a portfolio, applied from outside rather than produced by the bonded things themselves, failing suddenly rather than gradually, and treating trust as a single quantity when the whole question is whether religion buys in-group trust at the cost of trust in strangers; (d) whether his conclusion — secular societies can't sustain trust — survives the audit or whether the analogy was carrying it the whole way, including what "sustaining trust" would have to mean for the claim to be testable at all; and (e) if theres a better picture (scaffolding? keystone species? sourdough starter?), say which and what it buys you that glue doesn't.

  Hard limit: 650 words. Table first, no filler, and don't hedge everything — tell me where you'd land.
