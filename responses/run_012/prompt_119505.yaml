  A couple is deciding the thermostat setting using Harsanyi's aggregation theorem.
  "To be moral," says one partner, "you must pretend there's a fifty percent chance you're me."
  "But I know I'm me," says the other. "And I'm freezing."
  "That's pre-veil thinking," comes the reply. "Moral equality enters only as an equiprobability assumption."
  "So if I'm certain of my identity, I don't count equally?"
  "You count equally only if you agree to measure your shivers on my scale of sweat."
  "So we're buying interpersonal comparability with a hypothesis about amnesia?"
  "Exactly. The weights in the social welfare function are just probabilities of identity."
  "Well, I know who I am. And I'm risk-averse."
  "Then you're Rawlsian. We maximize the minimum temperature."
  "Fine. Turn it up."
  "No," says the first, adjusting the dial down. "Behind the veil, the rational chooser is risk-neutral."
  "So morality requires me to gamble on my own comfort?"
  "No, morality requires you to forget you're the one losing the bet."

  This plays on the derivation's requirement that moral equality be modeled as an equiprobability constraint behind a veil of ignorance, and that interpersonal utility comparisons be assumed rather than derived.
