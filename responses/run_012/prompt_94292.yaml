answer: |-
  Here is an analysis of your verdicts, a proposed principle (or pair of principles), and an honest assessment of the boundary problem.

  ### 1. The Principle(s)

  Your verdicts cannot be captured by a single smooth rule without significant patching. They express two distinct normative commitments that sometimes conflict. To fit your cases, I propose **The Principle of Coercive Standing**, composed of two clauses: one for the *demos* (vote) and one for the periphery (hearing).

  **Clause A (The Vote): The Principle of Irreversible Subjection.**
  > You are a member of the *demos* if you are permanently subject to the polity's coercive authority, you cannot exit without bearing a cost no one would call reasonable, **and** you have attained the status of a legal adult. Once that status is attained, it cannot be revoked by incapacity.

  **Clause B (The Hearing): The Principle of Significant External Impact.**
  > You are owed a hearing (notice, reasons, consultation) if you are significantly affected by specific coercive decisions of the polity, but you are not permanently subject to its authority.

  ### 2. How the Clauses Work (and Where They Strain)

  Here is how this principle maps onto your ten cases, and where the machinery shows its seams.

  *   **Cases 1, 5, 7 (The Core Demos):** These are captured by the first half of Clause A. They are subject to the law (coercion) and cannot leave without unreasonable cost (the woman's life is there; the guest workers are economically dependent; the territory is governed). Citizenship papers (Case 1) or formal status (Case 5) are irrelevant; *subjection* is the key.
  *   **Cases 2, 6, 9 (The Excluded):** These fail Clause A. The brother (2) is not subject to the daily coercive order; the diplomat (6) is immune from it; the consumer (9) is affected economically but not coercively. They are out.
  *   **Case 8 (The Hearing):** This is the perfect fit for Clause B. The farmers are affected by the dam (significant impact) but are not subject to the polity's general coercive authority (they live across the border). They get a seat at the table, not a vote.
  *   **Case 10 (Future Generations):** This principle leaves them with **nothing at all**, or perhaps a **Trustee**. Since they do not currently exist, they cannot be "subject" or "exit." This aligns with your uncertainty, though it pushes you toward the "nothing" end unless you add a specific trustee clause.
  *   **Case 3 (The Child):** She is subject and cannot exit, but she fails the **"attained the status of a legal adult"** requirement. She is in a temporary stage of developmental dependency. The principle excludes her.
  *   **Case 4 (The Guardianship Adult):** This is the stress point. He lacks capacity. If the principle were based on *capacity*, he would be out (like the child). To save your verdict, Clause A includes the **"Once that status is attained, it cannot be revoked"** saver clause. This treats voting as a right of *personhood* that, once granted by age, is immune to later incapacity.

  **The *Ad Hoc* Warning:**
  The distinction between Case 3 and Case 4 is the weakest link. It relies on a legal metaphysics (that adulthood is a threshold you cross, rather than a capacity you hold) rather than a functional one.
  *   **Which verdict to give up?** If you want a cleaner principle, **drop Case 4**. It is more consistent to say that voting requires *agency*. If a child lacks agency, so does the man under full guardianship. In many democracies, voting rights are restricted in guardianship cases. Keeping Case 4 requires a normative commitment to "dignity over competence" that complicates the boundary. If you keep Case 4, you must accept that the boundary is not about *ability* to vote, but about *status* against caste-creation.

  ### 3. The Stress Test: A New Case

  Let us take the repaired **Principle of Irreversible Subjection** to a case you did not list.

  **Case 11: The Undocumented Long-Term Resident.**
  > A man entered the country illegally fifteen years ago. He works in the informal economy, pays no income taxes (but pays sales and property taxes via rent), and is subject to deportation if discovered. He has a family there.

  **What the Principle Says:**
  *   **Subject to Coercion?** Yes. He is subject to criminal and civil law, and specifically to the coercive threat of deportation.
  *   **Exit Cost?** High. Returning to his country of origin may mean poverty or danger; leaving the country means abandoning the life he has built.
  *   **Status?** He is a legal adult.
  *   **Verdict:** **Vote.**

  **Why this is surprising:**
  This is politically contentious. Many would argue that breaking the law of entry forfeits the claim to membership. However, your principle (and Case 1) suggests that *subjection* trumps *legality of entry*. If the polity claims the authority to arrest him, deport him, and regulate his labor, it claims him as a subject. To deny him the vote is to create a class of permanent subjects without representation (Case 7 logic). The principle forces you to either grant him the vote or admit that your boundary is not about subjection, but about *permission*.

  ### 4. The Meta-Worry: Constraint or Redescription?

  You asked: *Does any such principle constrain who a demos may include, or does it only redescribe what an existing demos has already settled?*

  **Plain Answer:** It is mostly a **redescription**.

  This is known in political theory as the "Boundary Problem" (or the *Who Decides?* problem). To define the *demos*, you need a rule. To enforce that rule, you need a *demos* to agree to it.
  *   If the existing citizens vote to exclude the guest workers (Case 5), your principle says they are wrong. But who corrects them? There is no higher court of democracy.
  *   The principle constrains only if you assume there is a "true" democracy that exists independently of the decisions of actual democracies.
  *   In practice, boundaries are almost always decided by the existing insiders (the *demos* defines itself). Your principle is a moral critique of that self-definition, not a mechanical key that unlocks the gate from the outside. It tells us what a *just* demos looks like, not how to identify the *actual* one without circularity.

  ### 5. Confidence and Weakest Point

  **Confidence Level:** Moderate.
  The fit for Cases 1, 2, 5, 6, 7, 8, and 9 is strong. These align with standard "All-Subjected" and "All-Affected" intuitions in democratic theory.

  **Least Sure Point:** The reconciliation of **Case 3 (Child)** and **Case 4 (Guardianship)**.
  This is the point where the principle is most vulnerable. It relies on the idea that "adulthood" is a status that, once gained, creates an irrevocable right to vote regardless of capacity.
  *   **Why I am unsure:** This creates a paradox where a person who *cannot* understand the ballot (Case 4) is mandated to vote, while a person who *might* understand it (a mature 12-year-old, perhaps) is mandated not to.
  *   **The Risk:** If you prioritize *capacity*, you lose Case 4. If you prioritize *status*, you accept that some votes are symbolic or exercised by proxy (despite your verdict that the guardian shouldn't vote *in his place*). If the man under guardianship votes, but cannot form a political will, is it a vote, or is it a ritual? Your principle treats it as a right of dignity; a critic would call it a fiction.

  **Summary Recommendation:**
  Keep the **Principle of Irreversible Subjection**. It captures your core intuition that democracy is about escaping arbitrary power (coercion without voice). Accept that the distinction between the child and the incapacitated adult is a specific moral choice to prevent second-class citizenship, not a logical necessity. And be aware that without a global enforcer, this principle remains a moral claim against existing borders, not a definition that dissolves them.
