  (5) By the same logic as (3), being a person whose preferences change over time is irrational.
  (6) But thats nuts. My taste in music changed between freshman and sophomore year and nobody thinks that makes me broken. Getting hungry and then full is a preference change. That cant be irrational.
  (7) So either (4) doesnt actually follow from (1)-(3), or (5) doesnt follow even though it looks like the exact same move.

