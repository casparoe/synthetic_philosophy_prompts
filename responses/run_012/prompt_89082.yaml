  This is a classic problem in decision theory, often called the distinction between **synchronic** (at one time) and **diachronic** (across time) rationality. You have spotted a genuine tension that philosophers still debate, but for your purposes, there is a clear cut to make.

  You need to give up **Step (5)**.

  Here is the breakdown of why, what it costs you, and why it doesn't let the looping-preference person off the hook.

  ### Why Step (5) is the Slip
  Step (5) claims the logic of the Money Pump (Step 3) applies equally to changing preferences over time. It does not.

  The Money Pump argument relies on the assumption that the preferences exist **simultaneously**. In the doughnut/muffin/bagel loop, you hold all three preferences *at the same time*. This creates a logical contradiction in your ranking of the world *right now*. Because they are simultaneous, you cannot escape the cycle by waiting; every time you are offered a trade, your *current* preference demands you take it.

  In the gym example, the preferences are **sequential**. Night-You prefers Gym. Morning-You prefers Sleep. These are not logically contradictory because they are indexed to different times. Night-You is not saying "I prefer Gym to Sleep *now* AND I prefer Sleep to Gym *now*." Night-You is saying "I prefer Gym *tonight*," and Morning-You says "I prefer Sleep *now*."

  Because the preferences are separated by time, the "Money Pump" isn't exploiting a logical error in a single utility function; it's exploiting a conflict between two different temporal "selves."

  ### What Giving Up Step (5) Costs You
  By rejecting (5), you are accepting that **rationality is primarily about consistency at a single moment, not consistency across a lifetime.**

  1.  **You lose the claim that changing your mind is "irrational."** You have to admit that a person who knowingly sabotages their future self (like Night-You booking the gym knowing Morning-You will cancel) is not "irrational" in the strict logical sense. They are merely *dynamic inconsistent*. You can't call them "broken" in the same way you call the loop-preference person broken.
  2.  **You limit the scope of the Money Pump.** You must concede that the Money Pump argument *only* proves that simultaneous preferences must be transitive. It does not prove that you must stick to your plans over time.

  ### Does This Let the Looping-Preference Person Off the Hook?
  No. This is the crucial part. You asked: *if the fix is "well, you should just see the pump coming and refuse to trade," doesnt that also let the looping-preference person off the hook?*

  The answer is **no**, and here is why:

  *   **The Time-Traveler (Gym Case):** Night-You *can* "see the pump coming." Because Night-You knows Morning-You will have *different* preferences, Night-You can buy a non-refundable ticket. Night-You can bind Morning-You. This works because the preferences *change*.
  *   **The Looper (Snack Case):** The Looper *cannot* "see the pump coming" and stop. Why? Because the Looper's preferences *do not change*. When the Looper is holding the Bagel, they *currently* prefer the Muffin. They cannot say, "I won't trade, because I know I'll regret it later," because "later" they will still have the same cyclic preferences. At every single moment of the trade, the trade is the rational choice according to their *current* preferences. They are trapped in the present.

  The Time-Traveler has a "future self" that disagrees, allowing for commitment. The Looper has a "future self" that agrees with the cycle, trapping them in it.

  ### Summary
  If you keep Step (5), you have to claim that getting hungry or changing your music taste is irrational. That is too high a cost.
  If you drop Step (5), you save the claim that looping preferences are irrational (Step 4), while acknowledging that changing preferences over time is normal. You distinguish between **logical contradiction** (loops) and **temporal conflict** (changing minds).

  Verdict: Step 5 is the false equivalence.
