answer: |-
  **The Perihelion Colour**

  The rain on Aethelgard did not fall; it hung, a shimmering curtain of acidic mist that clung to the dome of the Outpost like wet wool. Inside the control sphere, the air was dry and recycled, smelling of ozone and old coffee. Elara stood over the spectrometer, her hands resting on the cool metal casing. Outside, the sky was darkening towards the moment they called the Stabilisation. In ten minutes, the planetary shields would reach full capacity, the stellar flux would normalise, and the epoch marked $t$ would arrive.

  'It's holding,' Elara said, though her voice lacked conviction. She tapped the screen. The readout showed the cryo-glass samples lining the outer hull. Every single one registered as *vish*.

  Kael leaned against the bulkhead, arms crossed. He was the station's theorist, a man who found comfort in equations where Elara found it in torque and tensile strength. 'All observed samples are *vish*,' he recited. 'Therefore, the next sample will be *vish*.'

  'That is the law of hull integrity,' Elara said sharply. 'Don't start.'

  'I'm not starting. I'm finishing.' Kael pushed off the wall and walked to the window, looking out at the grey swirl. 'You know what *vish* means, Elara. It means green before Stabilisation, and blue after. You are predicting that when the shields lock, the glass will turn blue.'

  'Because it is *vish*,' she said. 'It has always been *vish*. Induction tells us it will remain *vish*.'

  'Or,' Kael said, turning to face her, 'you could say the glass is *green*. We agree on that, don't we? Look at the samples. They are *green*. All of them. So, by the same logic of induction, the next sample will be *green*.'

  Elara felt the familiar tightness in her chest. This was the argument that had plagued the colony since the first landing party devised the colour lexicon. To the inhabitants of Aethelgard, *vish* and *nael* were the primitives. They were the colours children learned before they could walk. *Vish* was the colour of healthy lichen and calm seas. *Nael* was the colour of bruised fruit and storm clouds.

  'Green' was the derived term. It was a clumsy compound, defined in their language as '*vish* before Stabilisation or *nael* after'. It was a gerrymandered thing, a patchwork predicate that required you to check the clock before you could name the colour.

  'If I predict *green*,' Elara said, keeping her eyes on the spectrometer, 'then after Stabilisation, I am predicting the glass will be *nael*. Because after $t$, *green* means *nael*.'

  'Exactly,' Kael said. '*Nael* is green. So I predict the glass stays green. You predict it turns blue. We agree on all the data so far. Every sample observed has been *green*, and therefore every sample observed has been *vish*. The evidence supports both hypotheses equally.'

  'They don't support them equally,' Elara snapped. 'One of them is a law. The other is a coincidence.'

  'Why?'

  'Because *vish* is entrenched.' She turned from the machine, wiping her hands on her trousers. 'We have used *vish* in projections for fifty years. Every time we said a material was *vish*, we expected it to behave like *vish* materials. "If it is *vish*, it will resist corrosion." "If it is *vish*, it will bond with silica." The predicate is woven into the fabric of our science.'

  Kael shook his head. 'That's circular. You're saying *vish* is projectible because we have projected it before. But why did we project it before? Because we thought it was the natural kind. Now we have a reason to think it isn't. The Stabilisation is a physical shift. Why should our colour categories shift with it?'

  'Because the categories aren't about the light,' Elara said. 'They're about the use. Look at your definition of *green*. To apply it, you have to know the time. You have to ask, "Is it before or after Stabilisation?" before you can say what colour the glass is. That's not a colour property. That's a history lesson.'

  'It's no worse than *vish*,' Kael countered. 'To apply *vish* after Stabilisation, you have to know it will be blue. You're assuming the future resembles the past.'

  'I'm assuming the language works,' Elara said. 'If you adopt *green* as your primitive, then *vish* becomes the complex term. *Vish* becomes "green before Stabilisation or *nael* after". You can swap the words, Kael. You can speak that language if you like. But you can't use it to do engineering.'

  'Why not?'

  'Because you haven't earned the entrenchment.' Elara walked over to the wall where the maintenance logs were archived. She pulled a physical folio from the slot, the pages crackling. 'Look at the records. Every successful prediction in the history of this outpost is written in terms of *vish* and *nael*. "The sealant cures *vish*." "The algae bloom turns *nael*." There are no laws written in *green*. There are no equations using *green* as a variable.'

  Kael looked at the logs but didn't touch them. 'So we're trapped by our history? Just because our ancestors chose *vish* as the base term, we're bound to it? Even if it leads us to predict the glass turns blue when it might stay green?'

  'It's not a trap. It's a tool.' Elara's voice softened. She looked at the timer on the wall. Three minutes to Stabilisation. 'Goodman showed us that there is no logical guarantee in induction. There's no metaphysical glue that binds the future to the past. We choose the predicates that allow us to navigate the world. *Vish* allows us to navigate. *Green* requires us to stop and check the calendar every time we name a colour.'

  'That's pragmatic,' Kael said. 'It's not true.'

  'Truth in induction is a matter of successful practice,' Elara replied. 'If we project *vish*, and the glass turns blue, then *vish* was projectible. If we project *green*, and the glass stays green, then *green* was projectible. But we can't project both. They contradict after $t$. We have to pick one before we see the result.'

  'And you pick *vish* because it's familiar.'

  'I pick *vish* because it's ours.' Elara turned back to the spectrometer. 'If you start using *green* now, you break the chain. You make every past law incompatible with future observations. You'd have to rewrite fifty years of materials science to accommodate a predicate that saves you from a colour change you haven't even observed yet.'

  The room hummed. The shields outside were engaging; the low thrum of the generators vibrated through the floor. The light in the room shifted subtly as the external filters adjusted.

  Kael was silent for a long moment. He looked at the samples, glowing softly in the instrument's light. They were *vish*. They were *green*. The distinction existed only in the sentence they used to describe the future.

  'If you're wrong,' Kael said quietly, 'the albedo shifts. The station overheats.'

  'If I'm wrong, we learn,' Elara said. 'And then we adjust the entrenchment. But we don't adjust it on a whim. We don't adjust it because a theorist found a logical symmetry.'

  'Two minutes,' the computer announced.

  Kael pushed himself off the bulkhead. He walked to the console and placed his hand next to Elara's. He didn't look at her, but he didn't pull away. 'Log it as *vish*,' he said.

  'Logged.'

  They stood together as the timer counted down. There was no way to know, logically, whether the glass would remain green or turn blue. The evidence was identical. The difference lay only in the path they chose to walk into the dark. Elara felt the weight of the choice, not as a burden of truth, but as a commitment to a form of life. To speak *vish* was to inhabit a world where the future was continuous with the past in a specific way. To speak *green* was to inhabit a world where time cut through the fabric of things.

  'One minute.'

  The rain outside seemed to hold its breath. Elara watched the readout. The colour of the glass on the screen was a constant, unwavering line. It was *vish*. It would remain *vish*. That was the rule. It had to be the rule, because without the rule, there was no science, only a catalogue of accidents.

  'Stabilisation complete,' the computer said.

  The hum of the station settled into a new, steady pitch. The light in the room stabilised. Elara looked at the samples. They looked the same as they had a moment before. To her eyes, trained in the colony, they were still *vish*. If they were *vish*, they were now blue. If they were *green*, they were still green.

  She didn't check the spectral shift immediately. She logged the prediction first. *Hull integrity: VISH.*

  Kael exhaled, a long, slow release of tension. 'We'll know in an hour,' he said.

  'We know now,' Elara corrected, closing the folio. 'We know what kind of world we're living in.'

  She turned off the spectrometer. The screen went dark, reflecting their faces back at them. In the reflection, the colours were indistinct, shifting with the angle of the light. For a moment, Elara couldn't tell if her own eyes were *vish* or *nael*, and it didn't matter. What mattered was that she had spoken, and the world had answered in the same language.

  ***

  **Author's Note**

  This story takes a definite stance on the dissolution of Goodman's riddle, prioritising the pragmatic aspect of entrenchment over any attempt to find a logical asymmetry between 'grue' (here *vish*) and 'green'. In the philosophical literature, this aligns with a Humean or pragmatist reading of Goodman, where projectibility is not a matter of matching reality but of fitting into a settled linguistic practice.

  I have taken liberties with the symmetry of the predicates. Strictly speaking, if a society speaks *grue/bleen*, 'green' is indeed the gerrymandered predicate for them, and the riddle dissolves locally. However, I have introduced Kael as a character who attempts to revive the 'green' hypothesis to dramatises the tension between logical symmetry and pragmatic utility. The resolution hinges on Goodman's concept of *entrenchment*: predicates are projectible because they have been successfully projected in the past, not because they carve nature at its joints.

  Some philosophers (realists) would reject this, arguing that 'green' corresponds to a natural kind (wavelength reflectance) in a way 'grue' does not, regardless of linguistic history. The story sidesteps this metaphysical debate by refusing to verify the prediction physically. The 'truth' of the prediction is secondary to the commitment to the linguistic practice that makes prediction possible. This leans on a contested reading that suggests the New Riddle is solved by accepting that induction is fundamentally a social and linguistic practice rather than a logical relation between evidence and hypothesis.
