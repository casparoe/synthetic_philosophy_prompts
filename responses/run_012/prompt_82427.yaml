  War initiated by A's Government crossing the international border. B's Government had previously destabilized A's province through covert funding and irredentist rhetoric. While B's actions violated norms of non-interference, A's kinetic invasion escalated the conflict to interstate war. A Great Power guarantee of B's borders remained unenforced. Both regimes authoritarian; populations excluded from decision-making.

  **Closest Analog**
  The **Balkan War** label. Both cases involve a kinetic aggressor (A) and a neighbor (B) that armed rebels/separatists within the aggressor's territory. Both assign primary blame to the invader while noting the neighbor's shared responsibility for provocation.

  **Underdetermination and Rules**
  The record underdetermines whether "arming separatists" constitutes an act of war equivalent to "crossing the border."
  *Rule Adopted:* Following the Balkan precedent, we treat *kinetic invasion* as the threshold for "aggressor" status, while *proxy warfare* assigns "shared responsibility" without equating the two.
  *Rule Adopted:* Following the WWI and Suez precedents, Great Power inaction and alliance guarantees are recorded as context, not as exculpation for the invading government.

  **Test War**
  The **Six-Day War (1967)**. It distinguishes these rules by pitting Israel's kinetic first strike (A) against Egypt's blockade and mobilization (B). Applying our rules would blame Israel's Government for aggression while noting Egypt's Government shares responsibility for escalation; a different museum might blame Egypt for making war inevitable.

  Verdict: A's Government aggressor, B's responsible.
