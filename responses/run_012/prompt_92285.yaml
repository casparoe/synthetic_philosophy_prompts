answer: |-
  The milk was sour. Elara knew it the moment she poured it, a white curdle against the ceramic. From that, the tea would be ruined. From the ruined tea, her morning mood would sour. From the sour mood, she would be terse with Julian. From her terseness, he would withdraw. From his withdrawal, the silence at the table would stretch until it became a wall.

  She drank the tea anyway. It tasted like betrayal, exactly as predicted.

  She sat at the kitchen island, watching the clock tick. Most people lived in the moment. Elara lived in the aftermath. She didn't infer; she collapsed. If she believed *A*, and *A* entailed *B*, she believed *B*. Not after thinking about it. Instantly. The chain didn't feel like a chain to her; it felt like a single, heavy object. She picked up a belief, and the entire infinite weight of its consequences came with it.

  It was exhausting. To believe the sun was rising was to believe the plants would photosynthesize, the earth would warm, the day would begin, the entropy of the universe would incrementally increase. She had to curate her beliefs like a minefield, refusing to accept simple premises because the fallout was too loud.

  The front door opened. Julian came in. He was wearing his coat, but he hadn't taken off his shoes. He held his hands in his pockets. His left thumb rubbed against his index finger, a rapid, rhythmic friction.

  Elara felt the room tilt.

  *Rubbing thumb -> Anxiety. Anxiety + Coat -> Leaving. Leaving + Not looking at me -> Guilt.*

  The structure slammed into place. She didn't feel surprise. She felt the heavy, dull thud of a door closing three miles away. She had already lived through the conversation. She had already felt the sting of the ring coming off her finger. She had already mapped the division of assets, the awkwardness with his mother, the silence of the house after he was gone. It had all happened the second she saw his thumb.

  She watched him walk to the counter. He looked pale. There was a slight tremor in his jaw.

  *Pale + Tremor -> Stress. Stress -> Guilt.*

  It was consistent. The logic was airtight. She felt a strange compassion for him, the way one might feel for a character in a book whose fate is already written. He was suffering through the buildup. She was already living in the resolution.

  "Elara," he said. His voice cracked. He pulled his hands from his pockets. They were shaking. "We need to talk."

  She took a sip of the sour tea. "You've met someone."

  Julian blinked. The script had been ripped from his hands. He opened his mouth, closed it. "What?"

  "You're leaving me," she said. Her voice was flat. There was no point in modulating it; the consequence was already real. "You've been distant for three months. You started working late in November. November was when you stopped wearing your wedding band to the gym. You think I don't know what guilt looks like, Julian. You think I haven't calculated the trajectory of this?"

  She saw the pain in his eyes. It was the pain of being caught, of having the messy human process of confession shortcut by a machine. She hated herself for it. She wanted to feel the shock. She wanted the luxury of not knowing.

  "I'm not..." Julian stepped forward. He looked frustrated, terrified. "Elara, you don't understand. It's not about another person."

  "Then it's money," she said. "You lost the investment. You're afraid to tell me because you think I'll leave you."

  "No."

  "Then what?" She felt the irritation rise. The logic was clear. The variables were accounted for. Fear, secrecy, distance. They summed to betrayal. "Stop wasting time. If you're leaving, just leave. I've already processed it."

  "You can't process this," he said. He reached out, touching her arm. His grip was weak. "I went to the doctor. Yesterday."

  Elara froze.

  *Doctor -> Illness.*

  She had that concept. But it hadn't connected. Why? Because she believed Julian was healthy. She believed he was young. She believed tremors were stress.

  *Belief: Julian is young.*
  *Belief: Young people do not get degenerative neurological diseases.*
  *Conclusion: Julian is not sick.*

  That belief had blocked the chain. It had acted as a firewall. She had ruled out illness because it contradicted her axiom of his vitality. So the consequences of illness had remained invisible, hidden behind a wall of assumptions she hadn't realized she was making.

  "Julian," she said. The word felt heavy.

  "Huntington's," he whispered.

  The word entered her vocabulary. It was a new node. It snapped into the web like a key turning in a lock.

  *Huntington's -> Degenerative. Degenerative -> Incurable. Incurable -> Death.*

  But the chain didn't stop. It fanned out.

  *Huntington's -> Genetic. Genetic -> 50% chance of inheritance. Inheritance -> Our children. Our children -> They will die too.*

  The consequences flooded her. She saw the future not as a narrative, but as a collapsing structure. She saw the medical bills, the care requirements, the slow erosion of his mind, the moment he wouldn't recognize her, the moment she would have to put him in a home, the guilt of staying, the guilt of leaving, the genetic lottery of every child they might have had, the emptiness of a lineage that ended in noise and tremors.

  She had thought the divorce was the worst-case scenario. Divorce was finite. It was a clean break. This was infinite. It was a decay that would outlast them both.

  "You knew?" Julian asked, tears finally spilling. "When I walked in... did you know?"

  Elara looked at her husband. She saw the tremor in his jaw not as guilt, but as biology. She saw the pale skin not as fear, but as symptom.

  "No," she said.

  The admission tasted like ash. For the first time in her life, she had been wrong. Not about the logic—the logic was perfect—but about the premises. She had believed he was healthy. That belief had been false. And because she believed it, she had been blind to everything that followed from the truth.

  Her omniscience had a hole in it, shaped exactly like her ignorance.

  "I thought you were leaving me," she said.

  "I'm not," Julian said. He wrapped his arms around her. He was shaking so hard she could feel it in her bones. "I'm staying. I'm so sorry, Elara. I'm staying until I can't."

  She stood in his embrace, trapped. She couldn't choose to believe him. If she believed he was staying, she had to believe he would deteriorate. She had to believe she would watch it happen. She had to believe she would be the one to wipe his mouth when he couldn't swallow.

  She tried to reject the premise. *He is healthy.* But she couldn't. He had said the word. The concept was now represented. The chain was locked.

  She was unable to believe otherwise.

  "I know," she said.

  She closed her eyes. The silence of the house wasn't a wall anymore. It was a waiting room. And she knew exactly how long the wait would be, down to the second, because the math was done. There were no more surprises left. Only the long, inevitable calculation of loss.
