  Bayesians view probability as degrees of rational belief. They adhere to the Likelihood Principle: all evidence regarding a parameter is contained in the likelihood function of the *observed* data. Unobserved data (what might have happened if you continued) is irrelevant to what the current data says. Stopping rules reflect intentions, not physical properties of the data. Their claim is about coherence: a rational agent should update beliefs based on evidence, regardless of when they decided to stop looking. To condition on unobserved outcomes is to let imaginary data influence real beliefs, which they view as incoherent.

  ### 2. "Three candidate diagnoses"

  First, it could be a verbal dispute about the word "probability." If frequentists mean "propensity of a generator" and Bayesians mean "credence of an agent," they aren't contradicting each other but talking past one another. The anger suggests otherwise; they often claim the other is *wrong*, not just different. However, much confusion arises when consumers interpret frequentist outputs as Bayesian inputs, expecting a p-value to function as a posterior probability.

  Second, they are answering different questions under one name. Frequentists answer: "Is this procedure reliable enough to publish?" Bayesians answer: "What should I believe now?" The stopping rule matters for reliability (because it changes error rates) but not for belief updating (because the likelihood is unchanged). The conflict emerges because "statistical inference" is expected to do both jobs simultaneously. We want a number that tells us what to believe *and* guarantees we won't be fooled often. No single number does both.

  Third, it's about community norms versus individual rationality. Frequentism acts as a regulatory technology for a community of fallible researchers. It assumes scientists are tempted to p-hack; strict stopping rules are constraints to maintain trust. Bayesianism assumes a more idealized, honest agent updating beliefs. The fight is about governance: do we police intentions (frequentist) or trust coherence (Bayesian)? The replication crisis supports the frequentist worry that without procedural constraints, individual rationality collapses into motivated reasoning. The dispute is thus political: it is about how much freedom to give the individual researcher versus how much protection to give the scientific record. If you trust researchers to be honest, Bayesianism is efficient. If you assume they are strategic, frequentism is necessary. This explains why the debate heats up during crises of trust.

  ### 3. "Which one I think it is, and why"

  I believe it is primarily the second diagnosis (different questions), compounded by the third (norms). The math isn't the battleground; both sides accept the likelihood function and sampling distributions exist. The friction comes from institutional mismatch. Science institutions (journals, grants) require frequentist error control to manage risk across thousands of studies. However, individual scientists reason Bayesianly about their specific hypotheses.

