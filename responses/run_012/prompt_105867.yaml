  ### 4. "What would count as progress"

  Progress requires functional pluralism. We must stop seeking a unified theory of inference and instead match tools to tasks. Confirmatory research, designed to regulate community claims, needs frequentist pre-registration and strict stopping rules to control error rates. Exploratory research, designed for learning, should embrace Bayesian updating and flexible stopping.

  A concrete step: Journals should explicitly label analyses as "confirmatory" (requiring frequentist guarantees) or "exploratory" (allowing Bayesian flexibility). We need to stop pretending p-values measure belief and stop pretending posteriors guarantee long-run safety. Progress isn't resolving the philosophy, but acknowledging that science is both a learning process and a regulatory system. Until we separate these functions, the fight will continue. We need a cultural shift where "exploratory" isn't a dirty word, and "confirmatory" isn't assumed to be the only valid science. Simply lowering the p-value threshold is a bandage; it acknowledges the error rate problem without addressing the interpretive mismatch. Real progress looks like transparency about intentions: stating clearly whether a result is meant to update personal belief or certify a public fact.
