          *   *Drafting thought:* "They are me, but they are also themselves. Sometimes they lie to me."

      *   **Climax (Fission/Splitting):** The colony grows too large. It prepares to split.
          *   *Idea:* This is the "forking" of the self. A painful division. Creating a new Queen.
          *   *Drafting thought:* "I must tear myself in half to survive."

      *   **Ending (Senescence/Continuity):** Acknowledge the eventual end, but focus on the current state of being.
          *   *Idea:* The cycle continues. The "I" persists through the flow.

  4.  **Refining the Voice:**
      *   Avoid anthropomorphizing too much. Don't say "I thought." Say "The gradient shifted."
      *   Use chemical metaphors. "Scent of alarm," "taste of sugar."
      *   Highlight the "imperfect weld." The colony isn't a god; it's a struggling consensus.

  5.  **Addressing the Constraints in the Narrative:**
      *   *Memory:* Mention a tunnel collapse erasing a food source location.
      *   *No Queen Control:* Show the Queen as passive, just a pulse of egg-scent.
