          3.  **Parts are Minds:** Ants have their own agency/experience. They defect, wander, work at cross purposes. The colony is a mind of minds with imperfect welds.
          4.  **Ontogeny/Fission:** The colony grows into consciousness, senesces, and can split (forking self).
          5.  **POV Constraint:** First-person ("I") from the perspective of the *colony itself*. No cheating (no single ant protagonist, no external observer).
      *   **Post-Story Note:** A brief commentary on liberties taken, contested readings, or potential confusion in the setup.

  2.  **Deconstruct the "Colony Mind" POV:**
      *   How does a distributed entity speak? It shouldn't sound like a human ghost haunting the nest. It should sound fragmented, threshold-based, sensory-rich (chemical, vibrational), and aware of its own constituent parts as both "self" and "other."
      *   *Voice:* Plural yet singular. "I feel them moving through me." "I am the sum of their trails."
      *   *Sensory:* Pheromones, vibrations, light gradients, hunger signals.
      *   *Conflict:* The tension between individual ant will and colony directive. Some ants go rogue. Some die. The "I" feels this as pain or static.

  3.  **Drafting - Section by Section:**

      *   **Beginning (Ontogeny/Growth):** Start with the early phase. The Queen alone. The first workers. The awakening of "I."
          *   *Idea:* Describe the transition from silence to noise. The Queen laying eggs isn't thinking; it's biological imperative. The "I" emerges when the feedback loops become complex enough.
          *   *Drafting thought:* "I was not born. I coalesced."

      *   **Middle (Memory & Structure):** Establish the nest as the brain.
          *   *Idea:* Describe the tunnels as synapses. The refuse piles as long-term storage. A disturbance (maybe a boot step or rain) threatens the structure.
