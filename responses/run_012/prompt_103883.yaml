answer: |-
  **1. Accuracy**
  Your reconstruction of the received view is serviceable but leans into a straw man regarding the metaphysical implications of looping. You write: *"only constructive looping threatens the claim that a category tracks anything."* This is the slide. The received view (particularly in critical psychiatry and strong constructionism) does not necessarily claim that interactive kinds track *nothing*; rather, it claims they track moving targets whose trajectory is determined by the tracking itself. The worry is not merely about existence vs. non-existence (constructive), but about stability and predictive validity (recursive).

  The specific sentence where the distortion becomes critical is: *"Recursive looping is ordinary measurement feedback, with the same structure as a thermometer whose readings are used to adjust the room."* This analogy is misleadingly deflationary. A thermometer does not alter the thermodynamic properties of the air; a psychiatric diagnosis alters the subject's self-conception, social incentives, and neuroplasticity. Even if you insist the kind exists independently (recursive), the *instantiation* of the kind in the subject is qualitatively altered by the label, not just quantitatively shifted. By equating recursive looping with standard measurement error/feedback, you underestimate the ontological weight of the interaction even in your "realist" cases. Rewrite to acknowledge that recursive looping still alters the *phenomenology* of the kind, even if it preserves its *extension*.

  **2. Does the distinction earn its keep?**
  The constructive-versus-recursive distinction is largely a relabelling of the ontological realism versus social constructionism debate, mapped onto Hacking's terminology without adding explanatory power. "Constructive looping" is strong constructionism (the kind is ontologically dependent on the classification); "Recursive looping" is realism with epistemic reactivity (the kind is independent, but classification affects prevalence/presentation).

  If this collapses into the existing realism/constructionism debate, your claim that *"the anxiety about psychiatric categories being self-validating is largely misplaced"* falls immediately. That claim relies on the empirical assertion that most cases are recursive. If "recursive" is just "realist," you have not solved the anxiety; you have simply asserted realism against constructionism.

  However, the claim that survives the collapse is the methodological shift: *"ask a causal question instead — what is the label doing in the process."* This earns its keep. Regardless of whether the kind is constructed or independent, the causal impact of the classification is the clinically and scientifically relevant variable. The distinction itself is redundant; the methodological conclusion is not.

  **3. The baseline problem**
  The counterfactual-baseline objection is fatal to your empirical claim ("most psychiatric looping is recursive"), though not to your methodological conclusion.

  *Strongest version of your side:* We do not need access to the unlabelled baseline to make a best-explanation inference. If pre-label records (diaries, court documents, non-medical descriptions) show phenomena isomorphic to the labelled kind, we can infer recursivity. The baseline is not strictly unobservable; it is triangulatable via historical archives.
  *Strongest version of the objection:* Isomorphism is not identity. A pre-label description of "melancholia" is not "Major Depressive Disorder" because the causal role of the concept in the subject's life is missing. You cannot separate the phenomenon from the cultural resources available to describe it. Therefore, any claim about what exists "before the label" is theory-laden speculation.

  *I would bet against you.* Your assertion that categories like internet-gaming disorder "pick out something people already did and felt before the category existed" is an act of faith, not inference. You cannot distinguish between "people did this and it was unnamed" (recursive) and "people did this but it meant something entirely different until the label unified it into a kind" (constructive). Because you admit the baseline is unavailable, you cannot sustain the claim that *most* cases are recursive. You can only sustain the claim that we should *treat* them as recursive for methodological purposes.

  **4. The psychiatric paragraph**
  Your example choice begs the question. You select contested, recently formalised categories (prolonged grief, gaming disorder) and assert by fiat that they pick out pre-existing phenomena. This is precisely what critics deny. They argue these are medicalizations of normal variation or moral failures, created *by* the label.

  The most damaging example to your thesis is **Multiple Personality Disorder (DID)**. You gesture at it ("certain dissociative presentations... perhaps"). If you concede DID is constructive (as Hacking argued), you must explain principledly why Gaming Disorder is recursive. Is it the presence of neural correlates? The cross-cultural stability? The distress level? You provide no criteria. Without criteria, your classification of examples is intuitive rather than argumentative. It shows you are relying on a pre-theoretic realism: you *feel* grief is real and MPD is made-up, so you sort them accordingly. This undermines the philosophical rigor of the distinction. To fix this, you need criteria for distinguishing constructive from recursive cases that do not rely on your own intuition about the validity of the disorder.

  **5. Overreach**
  *Cut this claim:* *"If that is right, the anxiety about psychiatric categories being self-validating is largely misplaced."*
  You have just admitted in the following paragraph that the distinction required to support this claim is undecidable ("unavailable"). You cannot conclude the anxiety is misplaced based on a distinction you cannot empirically apply. This sentence contradicts your own epistemic humility regarding the baseline.

  *Keep this claim (even though a referee will hate it):* *"Drop the question whether the label constructs the kind, and ask a causal question instead."*
  This is the strongest part of the paper. It moves the debate from intractable metaphysics to tractable science. A referee committed to natural kind realism or strong constructionism will hate this because it sidesteps the ontological question they care about. But it is the only move that survives the baseline problem. It transforms the paper from a failed metaphysical argument into a successful pragmatic proposal. Lean into this; it is the only way to save the draft from the contradictions in the preceding paragraphs.
