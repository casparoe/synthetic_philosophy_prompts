answer: |-
  You are right to be annoyed, but you are also framing the problem slightly backwards. Your flatmate's objection is the standard "Aggregation Objection," and his proposed fix is a version of "Threshold Contractualism." You suspect the fix is consequentialism in disguise; you are correct to suspect this, but proving *why* it collapses is where the work lies.

  However, your list of open questions treats "Aggregation," "Ex Ante/Ex Post," and "The Nature of Complaint" as separate forks. They are not. They are a dependency chain. If you spend a year on aggregation without settling the ontology of the complaint, you will spin your wheels. If you settle the Ex Ante/Ex Post distinction, the aggregation problem often dissolves or changes shape entirely.

  Here is the prioritization for a year of leave, ranked by upstream leverage and tractability for pure conceptual work.

  ### 1. The Ontology of the Complaint (The Metric Question)
  **Rank:** #1 (The Foundation)
  **Status:** Upstream of everything else.

  You asked whether "complaint" is the right primitive or if it should be "avoidability of harm." This is the most critical question, yet it is often treated as settled in these debates. Contractualism says an act is wrong if it violates principles no one could reasonably reject. The "complaint" is the expression of that reason for rejection.

  **Why this is #1:**
  You cannot solve the aggregation problem until you know *what* is being aggregated.
  *   **If complaints are welfare units:** Then aggregation is natural, and your flatmate wins. The view collapses into a constrained utilitarianism.
  *   **If complaints are status-based claims (e.g., "I am being used"):** Then aggregation is a category error. You cannot sum "uses."
  *   **If complaints are reasons of autonomy:** Then the "strength" of the complaint isn't linear.

  **Tractability:** High. This is pure conceptual analysis. You don't need data; you need to test intuitions about incommensurability.
  **Downstream Impact:** If you determine complaints are non-aggregable reasons (status/autonomy), the "Threshold Fix" is dead on arrival. If they are welfare-based, the "Threshold Fix" is unavoidable. Settling this tells you whether to fight the aggregation battle or surrender it.
  **Where you are wrong:** You treat "complaint" as a stable unit that we just need to figure out how to sum. It is likely not a stable unit. The "strength" of a complaint might be lexical, not cardinal. If it's lexical, aggregation is impossible by definition, and the flatmate's objection fails because it assumes a cardinal metric.

  ### 2. Ex Ante vs. Ex Post (The Risk Fork)
  **Rank:** #2 (The Structural Lever)
  **Status:** Midstream, but determines the input for #1.

  You framed this as a separate confusion ("I never know what to do with..."). It should be your primary focus. This is the most tractable place to make progress that *looks* like it solves aggregation without actually aggregating.

  **Why this is #2:**
  The "Save the Five" case changes completely depending on this choice.
  *   **Ex Post:** We compare the one blinded person against the five scarred people. The one has a stronger complaint. Aggregation is required to save the five.
  *   **Ex Ante:** We compare the risk everyone faced *before* the outcome. If the policy is "save the majority," the one person faced a 100% risk of death/harm, while the five faced a 0% risk (or vice versa depending on the lottery setup). But if the policy is a lottery, everyone faces an equal ex ante risk.

  **Tractability:** Very High. This is formalizable. You can model the decision nodes. It allows you to bypass the "summing" problem by changing the *timing* of the comparison.
  **Downstream Impact:** If you defend an Ex Ante view, you can often justify saving the five *without* aggregating complaints, because the ex ante complaint of the one (in a lottery system) is weaker than the ex ante complaint of the five (in a "save the one" system). This neutralizes the flatmate's objection without accepting utilitarianism.
  **Risk:** Ex Ante views have their own counter-intuitive results (e.g., they can justify imposing huge certain harms on a minority if it lowers overall risk ex ante). You need to see if the cure is worse than the disease.

  ### 3. The Stability of Threshold Views (The Flatmate's Fix)
  **Rank:** #3 (The Defense/Refutation)
  **Status:** Downstream of #1 and #2.

  Your flatmate suggested: *Protect the worst-off individually; aggregate the rest.* This is a "Threshold View." You suspected it's consequentialism with extra steps.

  **Why this is #3:**
  It is likely a dead end, but proving it is valuable. The problem is the "Sorites" or "Continuum" problem.
  *   Where is the threshold?
  *   If one person faces death and 1,000,000 face broken fingers, you aggregate.
  *   If one person faces death and 1,000,000 face *almost* death (but slightly less), do you aggregate?
  *   If you draw a line, you violate the individualist restriction arbitrarily. If you don't draw a line, the threshold slides until it vanishes, and you are a utilitarian.

  **Tractability:** Medium. It is easy to generate counter-examples, but hard to prove *no* threshold works.
  **Downstream Impact:** Low. Even if you fix the threshold, you have already conceded the core contractualist insight (that individuals are inviolable) for the "merely badly off." This changes the view so much it may not be worth saving the label "contractualism."
  **Verdict:** Spend time here only to kill the view, not to save it. If you can prove the threshold *must* collapse into utilitarianism given the Ontology (#1), you have a paper.

  ### 4. Tie-Breakers and "Numbers Count"
  **Rank:** #4 (The Patch)
  **Status:** Downstream of everything.

  The idea that "numbers break ties" when complaints are otherwise equal.

  **Why this is #4:**
  It is theoretically ad hoc. It lacks a principled foundation. Why do numbers count *only* when complaints are equal? If numbers matter morally, why don't they matter when complaints are unequal?
  **Tractability:** Low. It's hard to build a robust theory on a "tie-breaker."
  **Downstream Impact:** Minimal. It solves a narrow set of cases but leaves the hard cases (unequal complaints) untouched.
  **Verdict:** Ignore this for a year-long project. It's a footnote, not a foundation.

  ---

  ### Strategic Recommendation for Your Year

  **Do not start with Aggregation.** That is your flatmate's trap. If you start there, you are playing on his field (consequentialist math).

  **Start with Question #2 (Ex Ante vs. Ex Post), grounded in Question #1 (Ontology).**

  Here is the reasoning:
  1.  **It bypasses the aggregation fight.** If you can show that the *correct* contractualist view is Ex Ante, you don't need to sum complaints to save the five. You justify the policy based on the fairness of the risk distribution, not the sum of the outcomes. This preserves the individualist restriction (no one is sacrificed for the greater good) while avoiding the "implausible implication" (letting the five die).
  2.  **It is tractable.** You can map out the decision trees. You can test the limits of Ex Ante contractualism (e.g., the "Certain Harm" objection) and see if they are fatal.
  3.  **It clarifies the "Complaint."** Working through Ex Ante/Ex Post forces you to define what the complaint *is*. Is the complaint "I got hurt" (Ex Post) or "I was exposed to danger" (Ex Ante)? This solves Question #1 implicitly.

  **Where your framing needs correction:**
  You asked: *"Whether the pairwise/individualist restriction has to be relaxed."*
  This is a false dichotomy. The restriction doesn't have to be relaxed; the *description of the case* has to change.
  *   **Flatmate's view:** We compare One (Dead) vs. Five (Dead). Pairwise, One wins. So we need aggregation to save Five.
  *   **Ex Ante view:** We compare Policy A (Save One) vs. Policy B (Save Five). Under Policy A, the Five face 100% risk. Under Policy B, the One faces 100% risk (if no lottery) or 20% risk (if lottery).
      *   If you use a lottery, everyone has an equal ex ante complaint. The tie-breaker isn't "numbers," it's "expected value of survival."
      *   This allows you to save the five *without* aggregating welfare, by aggregating *probabilities* assigned to individuals.

  **The Trap to Avoid:**
  Do not spend the year trying to make the "Threshold View" work. It is philosophically unstable. The boundary between "serious complaint" and "minor complaint" will always be arbitrary, and arbitrariness is fatal to contractualism (which relies on reasonable rejectability). If you can't give a non-arbitrary account of the threshold, the view fails. It is better to show *why* it fails than to try to patch it.

  **Summary of Plan:**
  1.  **Months 1-3:** Define the "Complaint." Is it welfare, status, or reason-strength? (Question #1).
  2.  **Months 4-8:** Build the Ex Ante model. Can it handle the "Blind vs. Scar" case without aggregation? (Question #2).
  3.  **Months 9-12:** Stress test. Does Ex Ante contractualism imply unacceptable risks for minorities? If so, does it collapse back into needing a Threshold? (Question #3).

  This path gives you a definitive answer on whether contractualism can survive the aggregation objection without becoming utilitarianism. It moves the debate from "how do we sum?" to "what are we summing and when?" which is where the actual philosophical progress lies.
