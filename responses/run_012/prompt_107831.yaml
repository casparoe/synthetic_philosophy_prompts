      *   *Critique of User's Framing:* The user treats "Ex Ante vs. Ex Post" and "Aggregation" as separate forks. They aren't. The aggregation problem *dissolves* or *transforms* depending on the Ex Ante/Ex Post choice. Also, the "Nature of Complaint" is the real bottleneck. If complaints are just "strength of reason to reject," aggregation might be category error. If they are "welfare units," aggregation is natural.
      *   *Priority 1: The Metric of Complaint (The "Primitive" Question).* Before aggregating, you need to know *what* you are aggregating. Is it welfare loss? Autonomy violation? Reason strength? This determines if aggregation is even possible. If complaints are qualitative reasons, summing them is nonsense. If they are quantitative burdens, summing is natural. *Why Top?* It dictates the answer to aggregation.
      *   *Priority 2: Ex Ante vs. Ex Post (The Risk Question).* This is the most tractable place to make progress that impacts aggregation. Ex Ante contractualism (Frumush, Otsuka) often allows saving the five because the *individual* risk is lower. Ex Post (Scanlon's later view?) blocks it. Resolving this clarifies the "numbers" issue without necessarily abandoning individualism. *Why Second?* It's a structural choice that resolves many cases without needing a new aggregation principle.
      *   *Priority 3: The Stability of Threshold Views (The "Fix").* The flatmate's suggestion (threshold aggregation) is unstable. It invites "sorites" problems and collapses into utilitarianism. *Why Third?* It's likely a dead end, but proving *why* it's a dead end is valuable. It's downstream of the Metric question.
      *   *Priority 4: The Tie-Breaker/Numbers Move.* "Numbers break ties" is ad hoc. *Why Fourth?* It's a patch, not a foundation. Only worth pursuing if 1-3 fail.
