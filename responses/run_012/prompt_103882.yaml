prompt: |-
  I'm grading the adaptationism section of a philosophy of biology midterm and need to get these back to students by friday, so I'm looking for help writing up one answer. Below is the question and a student's response. Can you give me a grade out of 15 plus the specific comments that justify it -- go point by point rather than giving me a general impression of the answer, and call out anything that's wrong but easy to skim past, with the wording you'd put in the margin.

  Question (15 pts):

  (a) In this unit we distinguished thin adaptationism -- selection is one legitimate mode of explanation, to be used once the plausible alternatives have been tested -- from thick adaptationism -- the working assumption that a trait is an adaptation until someone shows otherwise. Which one does Gould and Lewontin's spandrels critique target, and what is the critique's core, stated as a claim about method rather than about any particular trait? (5)

  (b) A study reports that male skinks with larger blue throat patches win more fights, that patch size is heritable, and that patch size tracks body size almost one to one. A classmate concludes that the patches are an adaptation for winning fights. Using the critique from (a), say what this inference has going for it and what it does not yet establish. (10)

  Student's answer:

  (a) The critique targets thick adaptationism. Gould and Lewontin aren't saying adaptation never happens; their complaint is that adaptationists assume a trait must have been selected for whatever it happens to do now, then tell a plausible story about how it helped its bearers, which nobody can test because the story is fitted to the trait after the fact. The spandrels of San Marco are the example -- the triangular spaces are a byproduct of mounting a dome on round arches, but an adaptationist could still tell you a nice story about why they're exactly that size and shape. Their methodological demand is that you work through the alternatives first -- developmental constraint, drift, historical accident -- so until you've ruled every one of them out, "selection did it" is off the table.

  (b) The classmate has something, because heritability shows the trait can evolve, and winning more fights with a bigger patch is at least a candidate function. But this is exactly the pattern the critique warns about, and Gould and Lewontin would say the patches are a spandrel: a byproduct of body size that later got co-opted for signalling, which makes it a genuine adaptation after all, so the spandrel point ends up cutting both ways. The study also only shows the trait is useful now, and current utility is precisely what adaptationists mistake for evidence of past selection. And since the patches track body size so closely, they could just be riding along with whatever body size is doing -- which is drift.
reasoning: |-
  Here's a thinking process that leads to the suggested grading:

  1.  **Analyze the Request:**
      *   **Task:** Grade a specific student answer on a philosophy of biology midterm.
      *   **Format:** Grade out of 15, specific point-by-point comments, marginal notes for errors easy to skim past.
      *   **Deadline Context:** Needs to be done quickly (by Friday), so clarity and efficiency are key.
      *   **Input:** Question (parts a & b) and Student Response.

  2.  **Analyze the Question:**
      *   **Part (a) (5 pts):**
          *   Identify target of Gould & Lewontin (G&L) critique (Thin vs. Thick).
          *   State the core critique as a *methodological claim* (not about specific traits).
      *   **Part (b) (10 pts):**
          *   Scenario: Skinks, blue throat patches, win fights, heritable, tracks body size 1:1.
          *   Classmate conclusion: Adaptation for winning fights.
          *   Task: Apply G&L critique. What does the inference have going for it? What does it *not* yet establish?

  3.  **Analyze the Student's Answer:**

      *   **Part (a):**
          *   *Target:* "The critique targets thick adaptationism." -> **Correct.**
          *   *Core Critique (Methodological):* "adaptationists assume a trait must have been selected for whatever it happens to do now, then tell a plausible story... fitted to the trait after the fact." -> **Correct (Just-So Stories).**
          *   *Methodological Demand:* "work through the alternatives first -- developmental constraint, drift, historical accident -- so until you've ruled every one of them out, 'selection did it' is off the table." -> **Mostly Correct,** though "ruled *every* one of them out" is a bit strong/absolute compared to the standard "test plausible alternatives," but captures the spirit of the Spandrels paper (pluralism/testing constraints).
          *   *Example:* Spandrels of San Marco. -> **Good illustration.**

      *   **Part (b):**
          *   *What it has going for it:* "heritability shows the trait can evolve, and winning more fights with a bigger patch is at least a candidate function." -> **Correct.** Identifies variation/heredity and current utility.
          *   *What it does not establish (The Critique):*
              *   "Gould and Lewontin would say the patches are a spandrel: a byproduct of body size..." -> **Correct application.** The prompt says patch size tracks body size 1:1. This suggests allometry/constraint.
              *   "...that later got co-opted for signalling, which makes it a genuine adaptation after all, so the spandrel point ends up cutting both ways." -> **Confused/Problematic.** This muddies the water. If it's co-opted (exaptation), it's not an adaptation *for* that original reason, but the student seems to imply this validates the classmate's conclusion ("genuine adaptation after all"). The classmate said it's an adaptation *for winning fights*. If it was co-opted, it *is* an adaptation for fighting (exaptation turned adaptation), *but* the G&L critique focuses on the origin. The student's phrasing "spandrel point ends up cutting both ways" is vague and philosophically weak. It sounds like they are talking themselves out of the critique.
              *   "current utility is precisely what adaptationists mistake for evidence of past selection." -> **Correct.** This is a key G&L point.
              *   "since the patches track body size so closely, they could just be riding along with whatever body size is doing -- which is drift." -> **Partially Correct/Imprecise.** If it tracks body size, it's likely an allometric constraint (developmental), not necessarily *drift*. Drift is random fluctuation. Allometry is a structural/developmental correlation. Conflating allometry/constraint with drift is a conceptual error in Evo Bio.

  4.  **Determine the Grade:**

      *   **Part (a) (5 pts):**
          *   Targets Thick: 1/1
          *   Core Critique (Just-So/Post-hoc): 2/2
          *   Methodological Demand (Test alternatives): 2/2
          *   *Total:* 5/5. (The "rule every one out" phrasing is slightly rigid but acceptable for an undergrad midterm summary of G&L).

      *   **Part (b) (10 pts):**
          *   What it has going for it (Heritability/Utility): 2/2.
          *   Application to Body Size/Constraint (The Spandrel link): 3/4. (Identifies the body size link correctly as the alternative explanation).
          *   Distinction between Current Utility vs. History: 2/2. (Good point on utility != history).
          *   Conceptual Clarity on Drift vs. Constraint: -2. (Calling the body-size correlation "drift" is wrong. It's constraint/allometry).
          *   Clarity on Exaptation/Adaptation distinction: -1. (The "cutting both ways" comment is confusing and undermines the critique).
          *   *Total:* ~7 or 8/10. Let's be generous on the "going for it" part but strict on the biological concepts.
          *   *Re-evaluation:* The prompt asks what the inference *does not yet establish*. The student says "patches are a spandrel... which makes it a genuine adaptation after all." This contradicts the instruction to apply the *critique*. The critique says "don't assume adaptation." The student says "actually it might be adaptation anyway." That loses points on applying the critique.
          *   Also, the Drift vs. Constraint error is significant in a Phil Bio context.
          *   Let's settle on 7.5/10 for part (b).
          *   *Total Grade:* 12.5/15. Let's round to 12 or 13 depending on strictness. Given the "by Friday" stress, I should provide a clear rubric. I'll go with 12.5/15 to reflect the good grasp of (a) and the muddled biology in (b). Actually, 13/15 feels fairer because the core philosophical point (utility != history) is there, even if the biological mechanism (drift vs constraint) is sloppy. Let's aim for 13/15.

      *   *Wait, looking closer at (a):* "until you've ruled every one of them out, 'selection did it' is off the table." G&L argue for testing alternatives, but saying "rule *every* one out" is a bit of a straw man of the methodological demand (you need to rule out *plausible* alternatives, not logically possible ones). However, for a 5pt question, this is likely full marks territory.
      *   *Looking closer at (b):* The "drift" comment is the biggest error. If patch size tracks body size 1:1, that is **allometric constraint**, not drift. Drift implies randomness relative to fitness. Allometry implies structural necessity. Conflating these suggests a misunderstanding of the "alternatives" mentioned in part (a).
      *   The "cutting both ways" comment is also philosophically weak. G&L distinguish adaptation from exaptation. The classmate claimed adaptation *for* fighting. If it's a spandrel co-opted, the origin wasn't fighting. The student's conclusion undermines the critique they are supposed to be applying.
      *   So, (a) = 5/5. (b) = 7/10. Total = 12/15.

  5.  **Drafting the Comments:**
      *   Need to be point-by-point.
      *   Need marginal notes for the "easy to skim past" errors (specifically the drift/constraint confusion and the exaptation muddle).
      *   Tone: Professional, constructive, efficient for a TA/Professor.

  6.  **Refining the Marginal Notes:**
      *   *Drift vs. Constraint:* "Careful: correlation with body size = allometric constraint, not drift."
      *   *Exaptation:* "G&L distinguish origin (spandrel) from current use (exaptation). Don't conflate."
      *   *Methodology:* "Strong summary of the 'testing alternatives' requirement."

  7.  **Final Review of the Output:**
      *   Does it meet the "by Friday" urgency? Yes, keep it structured.
      *   Does it meet the "point by point" requirement? Yes.
      *   Does it highlight the specific errors? Yes.

      *(Self-Correction during drafting)*: I should make sure the grade reflects the strength of Part (a) vs the weakness of Part (b). Part (a) is actually quite good. Part (b) is where the points are lost. I will structure the feedback to show exactly where the points were deducted.

      *Grade Calculation:*
      (a) 5/5
      (b) 7/10 (2 for 'going for it', 2 for utility/history distinction, 1 for identifying body size link, -3 for drift/constraint error and exaptation confusion).
      Total: 12/15.

      *Wait, one more check:* Is "ruled every one of them out" in part (a) a significant error? G&L's point is that adaptationists *don't* test alternatives. The student says the demand *is* to test alternatives. That is correct. The phrasing "rule every one of them out" is slightly hyperbolic but captures the "null hypothesis" shift G&L advocated. I won't dock points there, but I might add a marginal note about "plausible" alternatives.

      *Final Plan:*
      Grade: 12.5/15 (Split the difference on the Part B errors).
      Comments: Structured by question part.
      Marginalia: Specific phrases to write next to the text.

      *Wait, let's look at the "cutting both ways" sentence again.* "makes it a genuine adaptation after all, so the spandrel point ends up cutting both ways." This is actually a misunderstanding of the definition. If it's a spandrel, it's *not* an adaptation for that trait's origin. If it's co-opted, it's an exaptation. The classmate claimed it was an adaptation *for winning fights*. If it was co-opted for that, the classmate is right about function, but wrong about evolutionary history. G&L care about the history. The student is confused here. I need to highlight this clearly.

      Okay, ready to write.
answer: |-
  **Grade: 12.5 / 15**

  **Part (a): 5 / 5 pts**
  *   **Target Identification (1/1):** Correctly identifies "thick adaptationism" as the target.
  *   **Core Critique (2/2):** Accurately describes the methodological complaint: constructing post-hoc, untestable narratives ("Just-So stories") fitted to current traits.
  *   **Methodological Demand (2/2):** Correctly notes the requirement to test alternatives (constraint, drift, etc.) before inferring selection.
      *   *Marginal Note:* "Minor quibble: G&L ask for testing *plausible* alternatives, not necessarily 'every' logical possibility, but you capture the spirit of the null-shift correctly."

  **Part (b): 7.5 / 10 pts**
  *   **Strengths of Inference (2/2):** Correctly identifies that heritability and current utility (winning fights) are necessary prerequisites for adaptation, giving the classmate a starting point.
  *   **Utility vs. History (2/2):** Strong point: correctly notes that current utility does not prove historical selection. This is the heart of the G&L critique.
  *   **Application to Scenario (2/3):** You correctly identify the body-size correlation as the potential "spandrel" (constraint) alternative. However, you lose clarity in the next sentence.
      *   *Marginal Note:* "Careful: If it's co-opted later, it's an *exaptation*. The classmate claimed it was an *adaptation for* fighting (implying origin). G&L insist on distinguishing origin from current use."
  *   **Biological Concepts (1.5/3):** You suggest the body-size correlation could be "drift." This is a category error.
      *   *Marginal Note:* "**Important:** A 1:1 track with body size indicates *allometric constraint*, not drift. Drift is random fluctuation; allometry is developmental linkage. Don't conflate non-adaptive mechanisms."

  **General Comments:**
  You have a very strong grasp of the philosophical argument in Part (a). Part (b) shows you understand how to apply the critique regarding history vs. utility, but you get wobbly on the specific biological mechanisms (constraint vs. drift) and the definition of exaptation. Tighten up those distinctions to secure full marks on application questions.
