  The single distinction doing the most work in the tree is whether you treat logical consistency as an absolute precondition for truth or as a manageable engineering constraint.

  **Root Commitment:** I trust the standard axioms enough to use them day to day.

  **Q1: If a contradiction were proven in ZFC tomorrow, would you consider all proofs derived from it (including your smart contract verification) to be logically void?**
  *   **Yes** → Go to Q2.
  *   **No** → Go to Q5.

  **Q2: Do you believe mathematical objects (like infinite sets) exist independently of human definition?**
  *   **Yes** → Go to Q3.
  *   **No** → Go to Q4.

  **Q3: Would you cease all verification work until a new consistent foundation is secured?**
  *   **Yes** → **Leaf 1: Crisis Fundamentalist**
  *   **No** → Go to Q3b.

  **Q3b: Do you believe the contradiction will eventually be resolved without changing the axioms?**
  *   **Yes** → **Leaf 2: Optimist Platonist**
  *   **No** → **Leaf 3: Pessimist Platonist**

  **Q4: Is consistency valuable primarily to prevent logical explosion or to preserve semantic meaning?**
  *   **Prevent Explosion** → **Leaf 4: Formal Safetyist**
  *   **Preserve Meaning** → **Leaf 5: Semantic Formalist**

  **Q5: Is the inconsistency acceptable specifically because you restrict yourself to a subset of axioms known to be safe?**
  *   **Yes** → **Leaf 6: Fragment Localizer** (Your friend's view; stable only if the fragment boundaries are provably impermeable, otherwise wishful.)
  *   **No** → Go to Q6.

  **Q6: Would you modify the underlying logic (e.g., allow true contradictions) to accommodate the inconsistency?**
  *   **Yes** → **Leaf 7: Paraconsistent Engineer**
  *   **No** → Go to Q7.

  **Q7: Do you require a consistency proof from a stronger system to trust the current one?**
  *   **Yes** → **Leaf 8: Relativist Pragmatist**
  *   **No** → **Leaf 9: Empirical Pragmatist**

  ***

  **Empty Combination Note:** The path **Q1(Yes) → Q2(No) → Q4(Preserve Meaning)** is **incoherent**. If you deny independent mathematical reality (Q2=No), you cannot value consistency for "semantic meaning" in a realist sense; you must value it for structural utility (explosion prevention). No coherent position occupies this leaf.

  **Indistinguishable Leaves Note:** **Leaf 4 (Formal Safetyist)** and **Leaf 5 (Semantic Formalist)** are both variants of **Formalism**. While the tree separates them by motivation (explosion vs. meaning), in practice these motivations often collapse into the same working stance: "Keep the system coherent so the tool works."
