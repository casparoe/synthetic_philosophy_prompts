      *   *Innocence:* Call it "The Liability Requirement." Stress test: The Sheriff's Dilemma (frame an innocent to stop a riot).
      *   *Authority:* Call it "The Standing Requirement." Stress test: Vigilante vs. State.
      *   *Empirical:* Call it "The Feasibility Requirement." Stress test: Deterrence math that doesn't match reality.
      *   *Dead/Indifferent:* Call it "The Subject-Condition Requirement." Stress test: Posthumous sanctions.

  4.  **Analyzing the Tensions (The "Conflict Matrix"):**
      *   The user suspects a clash between *Desert* (Retributive) and *Social Benefit* (Consequentialist).
      *   *Case 1: The Dangerous Non-Offender.* (Preventive detention). Desert says "No punishment (no guilt)." Benefit says "Detain (safety)."
      *   *Case 2: The Harmless Heinous Offender.* (e.g., Attempted murder who fails and is reformed). Desert says "Punish (guilty mind)." Benefit says "Release (no threat, no deterrence needed)."
      *   *Case 3: The Innocent Scapegoat.* Desert says "Never." Benefit *might* say "Yes" (if it saves more lives).
      *   *Conclusion:* Yes, they break apart. Specifically, *Cardinal Proportionality* (desert-based) clashes with *Optimization* (benefit-based).

  5.  **Identifying the "Keystone" Requirement:**
      *   Which requirement, if dropped, lets the most "dead theories" back in?
