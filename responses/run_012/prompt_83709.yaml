          2.  The Spec Sheet (The Desiderata with Stress Tests).
          3.  The Conflict Analysis (Where the requirements break).
          4.  The Keystone Requirement (The one that matters most).
      *   Self-Correction on "Keystone": I need to be careful. Some might argue *Authority* is more fundamental. But in the context of *justifying suffering*, Liability is the moral blocker. I will argue for Liability but acknowledge Authority's role. Actually, looking at the "dead theories" clause: Pure Deterrence Theory is "dead" morally but logically coherent unless blocked by Liability. So Liability is the filter.

      *Wait, one more check:* The user asked about the "Dead Offender." Can you punish the dead? Most theories say no, because punishment requires a subject who can experience the hard treatment or understand the censure. If a theory says "Yes," does it fail a desideratum? Yes, the *Subject-Condition*.

      *Let's finalize the list.*
      1.  Demarcation (Punishment vs. Price/Therapy).
      2.  Liability (Guilt condition).
      3.  Hard Treatment + Censure (The dual nature).
      4.  Proportionality (Ordinal/Cardinal).
      5.  Authority (State vs. Private).
      6.  Feasibility (Empirical fit).
      7.  Subject-Condition (Alive/Competent).

      *Conflict:* Liability vs. Social Defense (The "Preventive Detention" case).
      *Keystone:* Liability.

      *Wait, looking at the user's prompt again:* "Tell me which of these can't all be satisfied together... and tell me which single requirement does the most work."
      Okay, I will structure the second half specifically around this.

      *Refining the "Pluralism" point:* This is a strong critique of Expressive Theory. If the community doesn't agree on the message, does the punishment express *anything*? Or does it express *dominance*? This is a validity condition for Expressive Theories specifically, but maybe a general desideratum for *legitimacy*. I'll include it under Authority or as a sub-point of Expression.

