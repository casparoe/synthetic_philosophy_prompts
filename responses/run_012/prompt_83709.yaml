      *   *However*, the user asked which one does the *most work*.
      *   Actually, **The Liability Requirement (No punishing the innocent)** is usually the hardest constraint. But is it the *keystone*?
      *   Consider **The Hard Treatment Requirement**. If you don't require suffering, "punishment" becomes "therapy" or "education."
      *   Consider **The Authority Requirement**. Without this, it's just interpersonal morality.
      *   *Decision:* The **Liability Requirement** is the standard filter. But the **Demarcation Requirement** (defining what punishment *is*) is logically prior. If you can't define it, you can't justify it.
      *   *Wait, re-reading the prompt:* "Which single requirement does the most work, i.e. which one, if you drop it, lets the most otherwise-dead theories back in?"
      *   If I drop "Don't punish the innocent," Utilitarianism becomes fully viable. If I drop "Proportionality," Utilitarianism becomes viable.
      *   If I drop "Authority," Anarchism/Vigilantism becomes viable.
      *   *Best Candidate:* **The Liability Constraint (No Punishing the Innocent).** This is the specific constraint that kills pure act-utilitarian accounts of punishment. It forces the move to rights-based or retributive constraints.

  6.  **Review and Refine:**
      *   Make sure I answer the specific question about the "Dead/Indifferent" offender.
