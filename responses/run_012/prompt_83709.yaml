      *   **Format:** List of requirements, each accompanied by the specific case or consideration that motivates it (to distinguish genuine requirements from camp-specific prejudices).
      *   **User's Input:** The user has provided a preliminary list of 8 items they think belong. I need to evaluate these, refine them, and potentially add/remove based on philosophical rigor.
      *   **Specific Task:** Identify tensions/incompatibilities between requirements (specifically desert vs. social benefit) and identify the "keystone" requirement (the one that, if dropped, allows the most bad theories back in).
      *   **Constraint:** Skip the survey of specific philosophers/theories. Focus on the structural logic of the requirements.
      *   **Tone:** Analytical, rigorous, direct, avoiding fluff.

  2.  **Evaluate the User's Preliminary List:**
