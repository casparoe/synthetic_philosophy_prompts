answer: |-
  This is the right way to approach the problem. Most debates about punishment stall because one side is arguing from a *definition* (e.g., "Punishment is essentially retribution") while the other is arguing from a *goal* (e.g., "Punishment is essentially crime reduction"). You cannot resolve the conflict until you agree on what the theory is required to explain.

  Below is the **Spec Sheet for a Theory of Punishment**. I have refined your list into formal desiderata. For each, I have listed the **Requirement** (what the theory must deliver) and the **Stress Test** (the specific case or intuition that forces the requirement onto the list).

  Following the list, I address the incompatibilities and the "keystone" requirement.

  ---

  ### Part I: The Spec Sheet (Desiderata)

  #### 1. The Demarcation Requirement
  *   **The Requirement:** The theory must distinguish punishment from other impositions of hardship that look similar but are conceptually distinct.
  *   **The Stress Test:** *The Tax vs. Fine Distinction.*
      *   If I pay a fee to park illegally, is that punishment or just the price of doing business? If a theory cannot distinguish a *penalty* (which implies moral condemnation) from a *price* (which implies permission to pay for convenience), it fails to capture the normative force of punishment.
      *   *Secondary Test:* *Preventive Detention.* If we lock up a dangerous person who has committed no crime, is that punishment? If the theory says "yes," it violates the Liability Requirement (see below). If it says "no," it must explain why the hardship is justified without the usual safeguards of criminal law.

  #### 2. The Liability Requirement (The Guilt Condition)
  *   **The Requirement:** The theory must explain why punishment is only permissible (or coherent) when directed at an agent who is responsible for a specific wrong. It must rule out punishing the innocent as a conceptual error, not just a bad outcome.
  *   **The Stress Test:** *The Sheriff's Dilemma.*
      *   A riot is about to kill 100 people. The only way to stop it is to frame and execute one innocent drifter. A pure cost-benefit theory says "execute him." A theory of *punishment* must say "that is not punishment; that is murder/sacrifice." If the theory cannot explain why this is categorically different from punishing a guilty man, it has failed to define punishment.

  #### 3. The Dual-Nature Requirement (Censure + Hard Treatment)
  *   **The Requirement:** The theory must account for the fact that punishment seems to consist of two distinct elements: **Hard Treatment** (deprivation of life, liberty, property) and **Censure** (communicative condemnation). It must explain the relationship between them.
  *   **The Stress Test:** *The Indifferent Offender & The Mere Tax.*
      *   *Case A:* A billionaire pays a $500 fine for assault and feels nothing. Is she punished? If punishment requires suffering, this fails. If it requires only censure, why take the money?
      *   *Case B:* A mob beats a thief. There is hard treatment and censure, but no authority.
      *   The theory must explain why hard treatment is necessary to convey the censure (or vice versa), rather than just sending a letter of disapproval.

  #### 4. The Scaling Requirement (Proportionality)
  *   **The Requirement:** The theory must provide a metric for matching the severity of the punishment to the offense. It must distinguish between **Ordinal Proportionality** (ranking offenses correctly: murder > theft) and **Cardinal Proportionality** (anchoring the scale: why 5 years and not 50?).
  *   **The Stress Test:** *The Speeding Ticket vs. The Life Sentence.*
      *   If a theory justifies punishment by deterrence, it might justify executing speeders if it saves lives (Cardinal failure). If a theory justifies punishment by desert, it might struggle to explain why 5 years is the right amount of suffering for a specific harm (The "Lex Talionis" problem: you can't rape a rapist). The theory must explain the *limit* of suffering.

  #### 5. The Standing Requirement (Authority)
  *   **The Requirement:** The theory must explain why the *state* has the exclusive right to punish, distinguishing it from vigilante justice, parental discipline, or international sanctions.
  *   **The Stress Test:** *The Victim's Revenge.*
      *   If a victim harms their attacker in a way that perfectly fits the desert and proportionality requirements, why is it still "wrong" (or at least legally distinct) compared to the state doing it? If the theory cannot distinguish the *agent* of punishment, it collapses into a general theory of morality rather than political legitimacy.

  #### 6. The Subject-Condition Requirement
  *   **The Requirement:** The theory must specify the conditions of the recipient. Punishment requires a subject capable of understanding the censure and experiencing the hard treatment.
  *   **The Stress Test:** *The Dead Offender & The Insane.*
      *   *Case A:* We strip a dead dictator's name from buildings. Is this punishment? Most theories say no, because the dead cannot be held liable or feel the burden. If a theory says "yes," it treats punishment as mere historical bookkeeping.
      *   *Case B:* Punishing someone with advanced dementia. If they cannot connect the suffering to the past act, is it cruelty or punishment?

  #### 7. The Feasibility Requirement (Empirical Fit)
  *   **The Requirement:** The mechanisms the theory relies on (deterrence, rehabilitation, moral communication) must be empirically possible. A theory cannot rely on psychological mechanisms that do not exist.
  *   **The Stress Test:** *The Rational Calculator.*
      *   If a theory relies on deterrence, it assumes offenders weigh costs and benefits. If criminology shows most crime is impulsive or situational, the theory's justification collapses. If a theory relies on moral reform, but prisons increase recidivism, the theory is empirically falsified.

  #### 8. The Pluralism Requirement (Legitimacy in Disagreement)
  *   **The Requirement:** The theory must explain how punishment is legitimate in a society that does not share a single moral code.
  *   **The Stress Test:** *The Expressive Failure.*
      *   Expressive theories say punishment "speaks for the community." But in a polarized society, a punishment for abortion (or drug use, or speech) might express condemnation to half the population and oppression to the other. If the theory requires moral consensus to function, it fails in liberal democracies.

  ---

  ### Part II: The Incompatibility Analysis

  You hypothesized that **Desert-Based Proportionality** and **Social Benefit (Non-Excessive Suffering)** cannot always be satisfied together. You are correct. They diverge in two specific directions, creating a "Trilemma" between Desert, Safety, and Rights.

  #### Conflict 1: The Dangerous but Undeserving (Preventive Detention)
  *   **The Case:** An individual has committed no crime (or served their sentence) but is assessed as highly likely to commit violence (e.g., a psychopath with an irresistible urge, or someone acquitted by reason of insanity but still dangerous).
  *   **The Clash:**
      *   **Liability/Desert:** Demands release. You cannot punish what was not done (or punish beyond the desert of the past act).
      *   **Social Benefit/Safety:** Demands confinement. The cost to society of letting them go is too high.
  *   **The Break:** Any theory that prioritizes *Liability* must allow the danger to exist. Any theory that prioritizes *Safety* must authorize confinement without guilt. You cannot have both absolute security and absolute liability. Most liberal states try to hide this by calling it "civil commitment," but philosophically, it is a breach of the Liability Requirement.

  #### Conflict 2: The Harmless but Heinous (The Retributive Excess)
  *   **The Case:** An elderly person committed a brutal murder 40 years ago, has lived a flawless life since, is physically incapable of re-offending, and is well-known in the community as a reformed character.
  *   **The Clash:**
      *   **Desert:** Demands punishment. The wrong was done; the debt is unpaid.
      *   **Social Benefit:** Demands release. Deterrence is unnecessary (he's old), incapacitation is unnecessary (he's harmless), rehabilitation is unnecessary (he's reformed). Punishing him creates net suffering with no social gain.
  *   **The Break:** Retributivists must punish him (wasting resources/suffering). Utilitarians must release him (violating the intuition of justice).

  #### Conflict 3: The Scapegoat (The Ultimate Break)
  *   **The Case:** (See Sheriff's Dilemma above).
  *   **The Clash:**
      *   **Liability:** Absolute constraint.
      *   **Social Benefit:** Contingent constraint. If the benefit is high enough (saving 1,000 lives), the constraint is overridden.
  *   **The Break:** This is the hard line. If you accept *any* trade-off here, you have abandoned the concept of "punishment" in favor of "social hygiene."

  ---

  ### Part III: The Keystone Requirement

  You asked which single requirement does the most work—i.e., which one, if dropped, lets the most "otherwise-dead" theories back in.

  **The Winner: The Liability Requirement (No Punishing the Innocent).**

  **Reasoning:**
  1.  **It is the primary kill-switch for Utilitarianism.** Pure act-utilitarian theories of punishment are logically coherent *except* for this constraint. If you remove the requirement that the subject must be guilty, Utilitarianism becomes a perfectly functional theory of social control. It explains deterrence, incapacitation, and rehabilitation efficiently. The *only* thing stopping it from being a dominant theory is the moral intuition that punishing the innocent is categorically forbidden, not just instrumentally unwise.
  2.  **It defines the practice.** If you drop the Demarcation Requirement, you confuse fines with taxes. If you drop the Authority Requirement, you confuse law with war. But if you drop the Liability Requirement, you confuse **punishment** with **management**.
  3.  **It forces the "Hard Problem."** Once you accept Liability as non-negotiable, you *must* adopt some form of Retributivism (or a hybrid that smuggles Retributivism in). You can no longer justify punishment solely by looking forward (consequences); you must look backward (culpability). This single requirement forces the entire philosophical debate into the shape it currently has.

  **The Runner Up: The Authority Requirement.**
  If you drop this, you let Vigilantism and Private Revenge back in as valid forms of "punishment." This changes the political landscape but doesn't necessarily break the moral logic of the suffering itself. Liability is more fundamental because it protects the individual against the collective (whether that collective is the State or a Mob).

  ### Summary Recommendation for Your Spec
  If you are building a theory, start by accepting the **Liability Requirement** as a hard constraint. This eliminates the "easy" consequentialist solutions. Then, your burden is to explain **Hard Treatment** (why suffering?) and **Authority** (why the state?) without violating that constraint.

  If you find yourself justifying a case where an innocent person suffers for the greater good, do not argue that it is "justified punishment." Argue that it is a **tragic necessity outside the scope of punishment.** Keeping that distinction clear is the only way to keep the spec coherent.
