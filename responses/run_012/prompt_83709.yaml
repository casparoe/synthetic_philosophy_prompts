      *   *Expressive vs. Hard Treatment:* Crucial. Is punishment symbolic, material, or both?
      *   *Proportionality:* Crucial. But needs to be defined neutrally (ordinal vs. cardinal).
      *   *Innocence:* Crucial. The "punishing the innocent" objection is the standard kill-shot for utilitarianism.
      *   *Edge Cases (Dead, indifferent, etc.):* Important for conceptual coherence.
      *   *Empirical Consistency:* Important. A theory requiring impossible psychology is flawed.
      *   *Authority:* Crucial. Why the *state*?
      *   *Pluralism:* Important for modern liberal societies.

      *Verdict:* The user's list is very strong. My job is to formalize them into a structured "Spec Sheet" and then address the tension analysis they requested at the end.

  3.  **Drafting the Desiderata (The "Spec Sheet"):**
