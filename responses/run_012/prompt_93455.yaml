      *   *Core Argument:* "Responsibility" in history is not a single concept. It is a hybrid. We need to separate *Political Responsibility* (forward-looking, collective, liability) from *Moral Guilt* (backward-looking, individual, culpability). The Fischer debate conflates these.
      *   *Decision:* I will argue that the user is right to be suspicious of "National Guilt" as a moral concept, but wrong to think we should drop "National Responsibility." We should keep Claim 1 (Causal) and Claim 3 (Collective) but radically redefine Claim 3 as *Political Liability* rather than *Moral Blame*. Claim 2 (Moral Blame) belongs strictly to individuals. Structural explanations do not dissolve agency; they relocate it from "conscious intent" to "institutional role."

