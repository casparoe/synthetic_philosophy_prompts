      *   *Critique:* Is the recommendation realistic for a high schooler?
      *   *Fix:* Acknowledge the power dynamic with the coach. The recommendation must navigate authority, not just peer logic.

  6.  **Final Polish:** Check against the 5 specific questions to ensure all are answered clearly. Ensure the "Restatement" section is distinct. Ensure the tone is that of a strategic philosopher. (Proceed to generate output based on this thought process).

      *   *Wait, one nuance:* The user asked "what you would do in my position." I need to be decisive.
