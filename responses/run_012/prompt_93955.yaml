  7.  **Finalizing the Output Structure:**
      *   **Restatement & Readings:** Briefly summarize and offer 3 lenses (Arms Race, Commitment Device, Principal-Agent).
      *   **Analysis:** Deep dive into the 5 questions.
      *   **Recommendation:** Concrete steps.

      *(Self-Correction during final review)*: Make sure to explicitly address the "who started it" paradox in section 2. It's about the *perception* of threat, not historical causality.

      *(Final check on constraints)*: "Begin by restating... brainstorming several readings... then work through analysis... only then give recommendation." Okay, I will follow this order strictly.

      *(Tone Check)*: Keep it intellectual but accessible. No jargon without explanation.

