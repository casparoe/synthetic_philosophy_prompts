      *   *Key Concepts to Integrate:* Prisoner's Dilemma, Schelling Points, Commitment Devices, Nash Equilibrium, Negative-Sum Game.

      *   *Refining Point 1 (Form):* Call it a "Symmetric Escalatory Trap." Distinct from ordinary conflict because the *value of the prize* is being eroded by the *cost of the fight*.
      *   *Refining Point 2 (Validity):* The logic is instrumentally rational but collectively irrational. The "who started it" is a red herring; it's about the current incentive structure.
      *   *Refining Point 3 (Intent/Ability):* Use Schelling's terminology. The contract is a "binding commitment." It sacrifices freedom of action to gain bargaining power.
      *   *Refining Point 4 (Middle Option):* Focus on the "Coaches" as the barrier. The captains can agree, but can they enforce it on their coaches? Maybe a "Student Wellness Pact."
      *   *Refining Point 5 (Action):* Don't just say "talk to them." Say "Coordinate a mutual de-escalation proposal." If that fails, modify the contract to be less punitive (remove the fee forfeiture).

  5.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is this too abstract?
