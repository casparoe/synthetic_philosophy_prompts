              3.  Explicit identification of verbal vs. substantive disputes.
              4.  Closing: What counts as evidence/argument against each position and if there's common ground for moving the debate.
      *   **Tone:** Professional, philosophical, collaborative but acknowledging deep disagreement.

  2.  **Deconstruct the Cases:**
      *   *Case A (Nadia/Bat-1):* Standard bootstrapping. Uses device to confirm device. No independent check.
      *   *Case B (Kappa/Lambda):* Coherentist/Mutual support bootstrapping. Two devices from same batch check each other. No external standard.
      *   *Case C (Nadia/Defect):* Defeater present. Same procedure as A, but background knowledge suggests unreliability.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground. Both sides agree on the *structure* of the inference, even if they disagree on the *status*.
      *   Both agree the cases are structurally similar to canonical easy knowledge cases.
      *   Both agree there are costs (Bootstrappers accept counter-intuitiveness; Circularists accept skepticism about basic sources).
      *   Both agree Case C is different (defeater).
      *   *Drafting thought:* Keep it neutral. Use terms like "subject," "belief source," "inference."

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Row 1: Premise vs. Rule Circularity.*
          *   Circularists: It's vicious rule-circularity (using the rule to prove the rule).
          *   Bootstrappers: It's not vicious; basic knowledge doesn't require prior justification of the rule.
          *   Crux: Is rule-circularity inherently vicious for justification?
      *   *Row 2: Generalization to Memory/Testimony/Induction.*
          *   Circularists: If Bootstrapping is okay, *any* source can self-certify, leading to absurdity (e.g., crystal ball). Need to distinguish basic vs. non-basic.
          *   Bootstrappers: Yes, basic sources *do* self-certify eventually. The intuition that they shouldn't is the error.
          *   Crux: Is there a principled distinction between perception and the Bat-1?
      *   *Row 3: Dud vs. Reliable (Nadia vs. Twin-Nadia).*
          *   Circularists: Internalists leanings. If evidence is identical, justification is identical. If Bootstrapping works for Reliable Nadia, it works for Dud Nadia (which is absurd).
          *   Bootstrappers: Externalists leanings. Dud Nadia doesn't *know*, even if she thinks she does. Reliability does the work.
          *   Crux: Internalism vs. Externalism regarding the *process* of bootstrapping.
      *   *Row 4: Role of Reliability (Justification vs. Explanation).*
          *   Circularists: Reliability explains truth, not justification. Justification requires access.
          *   Bootstrappers: Reliability is constitutive of justification (or knowledge).
          *   Crux: Nature of justification (factive vs. non-factive).

  5.  **Drafting Section 3: Verbal vs. Substantive:**
      *   *Verbal:* Often turns on the definition of "justification." If Circularists mean "internalist justification" and Bootstrappers mean "externalist warrant," they talk past each other.
      *   *Substantive:* The norms of inquiry. Can we rationally rely on a source without antecedent reason? The normative force of the "no self-certification" intuition.

  6.  **Drafting Section 4: Moving the Debate:**
      *   What would change minds?
