  2. Follow-up: If Equivalence fails because confirmation isn't truth-functional, doesn't that undermine logical closure for confirmed hypotheses generally, not just in paradox cases?

  3. Your contrastive account blocks the white shoe without invoking population sizes. How does your three-place relation structurally prevent confirmation without implicitly relying on the rarity of non-black objects, which is the Bayesian escape route you reject?

  4. Follow-up: If the contrast class is fixed by experimental design rather than ontology, doesn't that just shift the arbitrariness from the confirmation relation to the setup, leaving the Bayesian worry about logical equivalence untouched?

  5. How does your account handle a hypothesis with a disjunctive tail where evidence plainly bears on one disjunct and not the other? Does the contrast block confirmation of the irrelevant disjunct?

  6. Follow-up: If the contrast excludes the irrelevant disjunct, doesn't that mean the hypothesis being tested is effectively changed, not just the confirmation relation?

  7. If confirmation is contrast-relative, what prevents scientists from gerrymandering the contrast class post-hoc to ensure their data confirms their preferred hypothesis?

  8. Follow-up: If you say the contrast is fixed by the antecedent question, what stops a scientist from reframing the question once the data are in to salvage a failed prediction?

  9. You classify the Raven Paradox as a special case of the irrelevant-conjunction problem. But isn't the conjunction problem usually about H & X, whereas Raven involves logically equivalent formulations? How do you bridge that gap?

  10. Is there ever a default contrast, or is every confirmation claim incomplete without explicitly stating the alternative?
