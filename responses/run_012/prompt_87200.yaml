answer: |-
  The conceptual issue you are grappling with is not about *which* standard (Truth, Belief, Knowledge) is the right one, but about the **ontological status of the norm itself** and the **metaphysics of the act** it governs.

  You are asking whether the norm is **constitutive** (it defines what the act *is*) or **regulative** (it governs how an existing act is *performed*). Your friend's distinction between "Move Norm" and "License Norm" is a vernacular version of this.

  Here is the shape of the problem, the costs of the available moves, and why the "no uptake" cases are the crucible that forces a decision.

  ### 1. The Fork: Constitutive (Move) vs. Regulative (License)

  This is the primary axis. You have to choose whether the norm determines the *identity* of the act or the *quality* of the act.

  **Option A: The Constitutive View (Move Norm)**
  *   **The Claim:** The norm is a rule of the game. Just as you cannot "castle" in chess if you have already moved your king, you cannot "assert" without knowledge (on the Knowledge Norm view).
  *   **The Consequence:** If you say "P" without knowing "P," you have not made a defective assertion; you have failed to assert *at all*. You have made a guess, a conjecture, or a lie, but not an assertion.
  *   **The Cost:** This makes the concept of "wrongful assertion" unintelligible. We intuitively criticize people for *asserting* things they don't know. If they didn't assert, what are we criticizing? We are criticizing a sham. This view risks turning the norm into a verbal trick: "That wasn't a *real* assertion because it violated the rule."
  *   **The Benefit:** It explains why knowledge feels essential. It ties the act tightly to its success conditions.

  **Option B: The Regulative View (License Norm)**
  *   **The Claim:** The act exists independently of the norm. You can assert without knowledge, just as you can drive without a license. The norm tells you what you *ought* to do to perform the act properly or permissibly.
  *   **The Consequence:** If you say "P" without knowing "P," you have asserted, but you have asserted improperly. You are subject to criticism, blame, or sanction.
  *   **The Cost:** It weakens the connection between the act and the norm. If I can assert without knowing, why is knowledge the *norm* and not just a good idea? It makes the norm look like an external moral constraint rather than an internal structural feature.
  *   **The Benefit:** It preserves the intuition that people make "bad assertions" all the time. It allows for a robust notion of accountability.

  **Verdict on the Distinction:** Your friend's distinction is **real, not verbal**, but it is often used as a dodge. It is real because it tracks a difference between *conditions of success* (Constitutive) and *conditions of blamelessness* (Regulative). It is a dodge when philosophers switch between them to avoid counterexamples (e.g., "It's not an assertion!" when challenged on a bad case, but "It's a bad assertion!" when challenged on a good case).

  ### 2. The Target: What is Being Evaluated?

  You asked whether we are evaluating the speaker, the token, or the conversational score. This determines how the norm functions.

  *   **Speaker Evaluation (Ethical/Epistemic):** The norm judges *you*. Did you do your due diligence? This aligns with the **Regulative** view. It focuses on blame.
  *   **Act Token Evaluation (Illocutionary):** The norm judges the *utterance*. Did this utterance carry the force of assertion? This aligns with the **Constitutive** view. It focuses on validity.
  *   **Conversational Score (Common Ground):** The norm judges the *update*. Did this move legitimately add P to the shared information? This is a third option, often overlooked.

  **What hangs on this:** If the norm is about the **Conversational Score**, then an assertion is a proposal to update the common ground. The norm (Knowledge) ensures the proposal is safe to accept. If the norm is about the **Speaker**, it ensures the speaker is trustworthy.

  ### 3. The "No Uptake" Crucible

  This is where your intuition is sharpest, and where most theories fracture. The "dead mic," "sleeping roommate," and "diary" cases test whether assertion is essentially **social** or essentially **expressive**.

  **Scenario 1: Assertion as Social Practice (The Brandomian/Wittgensteinian Move)**
  *   **Logic:** Assertion is defined by its role in the "game of giving and asking for reasons." To assert is to undertake a commitment that entitles others to rely on it and challenges them to question it.
  *   **Implication for No Uptake:** If there is no audience, there is no one to undertake the entitlement, no one to challenge, and no one to hold you accountable. Therefore, **there is no assertion.**
  *   **The Cost:** You must admit that writing in a diary or talking to yourself is not *asserting*. It is *recording* or *judging*. The norm of assertion is suspended because the game is not being played.
  *   **The Benefit:** It explains why the norm is knowledge. Knowledge is the currency of social trust. No society, no currency.
  *   **The Problem:** It feels counterintuitive to say I didn't "assert" to my diary. It makes the internal experience of asserting derivative of the social practice.

  **Scenario 2: Assertion as Expression of Judgment (The Cartesian/Gricean Move)**
  *   **Logic:** Assertion is the outward expression of an inward belief/judgment. The audience is secondary; the primary act is the commitment of the mind.
  *   **Implication for No Uptake:** The norm applies identically. You should not write "P" in your diary unless you know "P," because you are still representing the world to yourself.
  *   **The Cost:** It makes the communicative machinery irrelevant. If the norm applies in solitude, why is assertion primarily a communicative act? The "giving and asking for reasons" becomes a secondary use, not the definition.
  *   **The Benefit:** It preserves the intuition that solitary claims are subject to the same epistemic standards as public ones.

  **The Test:** The "no uptake" cases are **not a distraction**. They are the decisive test.
  *   If you think the norm applies in the diary, you are committed to the view that the norm is grounded in **internal rationality** (Regulative/Expressive).
  *   If you think the norm dissolves in the diary, you are committed to the view that the norm is grounded in **social accountability** (Constitutive/Scorekeeping).

  ### 4. The Two-Norm Solution: Dodge or Discovery?

  You asked if positing two norms is just a way to dodge the question. It depends on *which* two norms you posit.

  **The Dodge:** "There is a norm of *asserting* (Knowledge) and a norm of *communicating* (Uptake)." This is usually verbal. It just splits the hairs of the same act.

  **The Substantive Split:** There is a norm of **Propriety** and a norm of **Identity**.
  1.  **Norm of Identity (Constitutive):** To count as an assertion, you must *purport* to know. (This allows the sleeping roommate case to count as assertion because you *purport* to address an audience, even if they aren't there).
  2.  **Norm of Propriety (Regulative):** To assert *well*, you must *actually* know.

  **Why this isn't a dodge:** This split explains why we react differently to different failures.
  *   If I say "P" as a joke, I violate the **Norm of Identity**. I didn't assert. You don't blame me for being wrong; you correct my force.
  *   If I say "P" seriously but recklessly, I satisfy the **Norm of Identity** but violate the **Norm of Propriety**. You blame me.

  **However,** this split does not solve the "No Uptake" problem. It just pushes it back. In the diary case, do I *purport* to address an audience? If yes, it's assertion. If no, it's not. The norm of knowledge follows the *purport*, not the *uptake*.

  ### 5. What Actually Hangs on Getting It Right?

  If you get this wrong, you break three things:

  1.  **Lying:** Is a lie a false assertion or a false statement? If the norm is constitutive (Move), a lie might not be an assertion (because you don't believe/know). If the norm is regulative (License), a lie is a defective assertion. This changes how we understand deception.
  2.  **Testimony:** If the norm is social (Uptake required), testimony creates knowledge in the hearer. If the norm is internal (Diary applies), testimony just transfers information. The "No Uptake" view determines whether knowledge is social or individual.
  3.  **Accountability:** If the norm is constitutive, you can't be blamed for a "bad assertion," only corrected for a "non-assertion." If the norm is regulative, you are blameworthy. This determines the ethics of speech.

  ### The Cheapest Move (and its Price)

  The move that costs you the least, philosophically, is this:

  **Assertion is defined by its *aim* (Common Ground), but the norm applies to the *attempt*.**

  *   **The Move:** Treat the "No Uptake" cases as **parasitic**. When you write in a diary, you are simulating the social practice. You are acting *as if* there is an audience (even if that audience is Future You). Therefore, the norm applies because the *structure* of the act is social, even if the *context* is solitary.
  *   **Why it works:** It keeps the norm grounded in social practice (explaining why Knowledge is the standard—it's about reliance) without denying that solitary claims feel normative.
  *   **The Price:** You have to accept that solitary assertion is not the "pure" form of assertion; it is a derivative, simulated form. The "real" game requires two players.

  **Summary of the Shape:**
  The conflict is between **Assertion as a Social Commitment** (requires uptake, constitutive norm) and **Assertion as an Epistemic Expression** (requires only mind, regulative norm).
  *   If you choose Social: The diary case is not assertion (or is derivative). The norm is about *trust*.
  *   If you choose Epistemic: The diary case is full assertion. The norm is about *truth-tracking*.

  Your friend's "Move vs. License" distinction is the tool to map this.
  *   **Move Norm** aligns with **Social/Constitutive**. (No uptake = No move).
  *   **License Norm** aligns with **Epistemic/Regulative**. (No uptake = Move made, but no one licensed to receive it).

  If you want to preserve the intuition that the diary case *is* assertion but *still* governed by the knowledge norm, you must adopt the **Regulative/Epistemic** view. But you pay for this by severing the link between assertion and the "game of giving and asking for reasons." You cannot have it both ways: you cannot ground the norm in social accountability and then apply it where there is no accountability. One of those intuitions has to go.
