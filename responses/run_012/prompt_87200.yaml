      *   **Key Question 3 (The "No Uptake" Problem):** Silent assertion, diary, dead mic, sleeping roommate. If norms depend on social practice (giving/asking for reasons), do they vanish here? If they depend on internal states (belief/knowledge), why does the communicative aspect matter?
