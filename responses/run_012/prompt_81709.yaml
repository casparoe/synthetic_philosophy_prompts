  **The Case:** *A saying found in Two Independent Strands (e.g., Mark and Q) that fits the later Church's theology perfectly and aligns with Jewish wisdom traditions.*
  *   **Criterion of Friction:** **Inauthentic.** (It creates no friction with Church or Context; it's too smooth).
  *   **Multiple Attestation is King:** **Authentic.** (It appears in two independent sources, which is usually the gold standard).

  If she calls this **Inauthentic**, you know she prioritizes *discontinuity* over *attestation*. If she calls it **Authentic**, she is more traditional than she appears.

  ### 5. The Step Back: Is this a machine for priors?
  You asked if this method gets us closer to who he was, or if it is a machine for putting our own priors in his mouth. The honest answer from the last thirty years of Historical Jesus scholarship is: **Mostly the latter.**

  Here is why your seminar leader's method is problematic:

  1.  **The "No True Scotsman" of History:** The Criterion of Dissimilarity (Friction with Context) assumes that Jesus must be distinct from Judaism to be authentic. This constructs a Jesus who is not a Jew. Historically, this is impossible. He was a first-century Jew; most of his authentic sayings *should* sound like the synagogue. By filtering out anything that sounds "Jewish," she is systematically removing his actual context.
  2.  **The Protestant Bias:** The Criterion of Embarrassment (Friction with Church) assumes the early Church was a monolithic machine that tried to sanitize Jesus. While they did interpret him, this criterion often privileges sayings that make Jesus look like a proto-Protestant reformer fighting against "institutional religion" (the disciples/church). It creates a Jesus who fits the modern scholar's ideal of a "religious genius" rather than a first-century prophet.
  3.  **Memory Theory:** Contemporary scholars (e.g., Chris Keith, Anthony Le Donne) argue that we cannot peel back the gospel layers like an onion to find a "pure" core. The memories of Jesus were shaped by his impact *from the start*. The "authentic" voice is not a hidden core, but the impact he made on the movement.

  **Conclusion:**
  Your leader is likely using a heuristic that produces a **distinctive, idiosyncratic Jesus.** This is intellectually satisfying in a seminar because it gives clear "Win/Loss" rulings. But it risks producing a caricature: a Jesus who never sounded like his neighbors and was constantly embarrassing his friends.

  If she rules next week's saying **Authentic**, she is confirming that she values **uniqueness** over **historical plausibility.** She is looking for the *exceptional* Jesus, not necessarily the *historical* one.
