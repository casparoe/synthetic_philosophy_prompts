answer: |-
  This is one of the most famous and persistent arguments in the foundations of physics. You and your friend are in excellent company: Nobel laureates, philosophers of physics, and quantum information theorists have been having this exact argument for 50 years.

  The short answer is: **Your disagreement is both verbal and substantive, but mostly it stems from answering different ontological questions while using the same vocabulary.**

  Here is the breakdown of why you are both partially right, where the definitions clash, and what actually counts as progress here.

  ### 1. The Verbal Disagreement: Two Definitions of "Local"
  You are talking past each other because you are using different definitions of "locality."

  *   **Your Definition (Bell Locality):** You are using the definition John Bell used. For Bell, a theory is local if the probability of an outcome at one wing depends *only* on variables in its past light cone (settings + hidden variables). If the correlation requires a dependency on the distant setting or outcome, Bell called that **nonlocal**. Since Bell's Inequality is violated, **Local Hidden Variable theories are dead.** On this definition, you are right.
  *   **Your Friend's Definition (Signal Locality):** Your friend is using the definition from Special Relativity. A theory is local if you cannot use it to send a superluminal signal (information). Since the No-Communication Theorem holds in QM (you can't force a specific outcome at the other wing to send a Morse code message), **Signal Locality is preserved.** On this definition, your friend is right.

  **The Conflict:** Bell proved that *Signal Locality* is compatible with *Bell Nonlocality*. Your friend thinks "Locality" *means* Signal Locality. You think "Locality" *means* Bell Locality. When you say "Nonlocal," you mean "causally connected beyond light cones." When they hear "Nonlocal," they hear "Faster-than-light signaling," which they correctly know is false.

  ### 2. The Substantive Disagreement: Jarrett's Decomposition
  This is where the physics gets specific. In 1984, physicist Jon Jarrett showed that Bell's "Locality" condition is actually the conjunction of two separate mathematical conditions. To satisfy Bell Locality, you need both:

  1.  **Parameter Independence:** The outcome at $A$ does not depend on the *setting* chosen at $B$. (If this is violated, you can signal).
  2.  **Outcome Independence:** The outcome at $A$ does not depend on the *outcome* obtained at $B$ (once you account for the hidden variables).

  **Quantum Mechanics violates Outcome Independence, but respects Parameter Independence.**

  *   **Your Friend's Point:** Since Parameter Independence holds, there is no causal mechanism to transmit control. The system is just a single, indivisible object (a "holistic" wavefunction) that spans the distance. Calling this "nonlocal" suggests a mechanism (like a force) that isn't there. They prefer **"Non-separability."**
  *   **Your Point:** Since Outcome Independence is violated, the world cannot be carved into separate pieces at $A$ and $B$ that only interact locally. If you insist on a realist description (like Bohmian Mechanics), you *must* introduce explicit nonlocal equations of motion. If "Realism" is true, "Nonlocality" is the price.

  **Who is right?**
  *   If you are an **Instrumentalist** (QM is just a tool for predicting outcomes): Your friend wins. There is no action-at-a-distance, just correlations in a holistic state.
  *   If you are a **Realist** (QM describes what is actually happening): You win. Any theory that reproduces QM while maintaining definite outcomes (like Pilot Wave theory) is explicitly nonlocal.

  ### 3. The "Cheating" Assumption: Statistical Independence
  You mentioned getting stuck on whether you're allowed to drop the assumption that settings and hidden variables are independent ($P(\lambda | a, b) = P(\lambda)$).

  *   **The Assumption:** This is often called "Measurement Independence" or "Free Choice." It assumes the experimenter's choice of setting isn't correlated with the particle's hidden state from the start of the universe.
  *   **Dropping It:** This leads to **Superdeterminism**.
  *   **Is it Cheating?**
      *   **Logically:** No. It is a valid loophole.
      *   **Methodologically:** Most physicists agree with you that it is "cheating" in the sense that it undermines the scientific method. If the settings are correlated with the hidden variables, you can never trust an experiment to test a theory, because the universe could be conspiring to make a local theory *look* quantum.
      *   **Progress:** There is a minority view (e.g., 't Hooft) that takes this seriously, but until a Superdeterministic model makes a novel prediction that QM doesn't, it remains a philosophical escape hatch rather than physics.

  ### 4. What Kind of Disagreement Is This?
  It is a **Metaphysical Disagreement disguised as a Physical one.**

  *   **Physics:** The experimental data is in. Bell inequalities are violated. No-communication holds. You both agree on the math and the data.
  *   **Metaphysics:** You disagree on what the math implies about the nature of reality.
      *   You prioritize **Separability**: You want the world to be made of distinct things in distinct places. To save that, you must accept Nonlocality (spooky action).
      *   Your Friend prioritizes **Relativistic Causality**: They want to protect the idea that influences can't travel faster than light. To save that, they must accept Holism (the world isn't made of distinct things).

  ### 5. What Counts as Progress?
  You asked what would count as progress: a distinction, a theorem, or an experiment?

  *   **Experiments:** Loophole-free Bell tests (2015) have essentially closed the book on Local Hidden Variables. More experiments won't solve this semantic dispute.
  *   **Theorems:** We have the theorems we need (Bell, Jarrett, PBR).
  *   **Distinctions:** **This is where the progress lies.**

  The most productive question to ask isn't "Is it nonlocal?" but **"What is the status of the Wavefunction?"**

  *   If the wavefunction is **real (Psi-ontic)**, then the friend's "Holism" is a physical fact: there is one object spanning the universe.
  *   If the wavefunction is **information (Psi-epistemic)**, then the correlations are about knowledge, and the "Nonlocality" is less troubling. (Though the PBR Theorem makes this view difficult to maintain).

  ### The Verdict
  *   **You are right** that "Local Realism" is dead. If you want a world where particles have definite properties before measurement, that world is nonlocal.
  *   **Your friend is right** that "Signaling" is impossible. Relativity is not violated in any operational sense.
  *   **The Label:** "Nonlocality" is the standard term in the field (Bell's term), but your friend is correct that it is often misunderstood by the public to imply signaling. "Non-separability" is more precise for standard QM, but "Nonlocality" is more precise for Realist interpretations (like Bohm).

  **How to end the argument:**
  Acknowledge that Bell's Theorem forces us to give up one of three things:
  1.  **Locality** (in the Bell sense) -> You keep Realism.
  2.  **Realism** (definite outcomes) -> You keep Locality (e.g., Many Worlds or Copenhagen).
  3.  **Statistical Independence** -> You keep both, but lose scientific freedom (Superdeterminism).

  You are arguing over which of those three pills is the least bitter to swallow. That isn't a physics question anymore; it's a philosophical preference. The progress comes from admitting that the math forces a choice, not from arguing about the label for the choice.
