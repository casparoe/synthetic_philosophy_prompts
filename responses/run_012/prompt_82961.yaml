answer: |-
  Here is the scratch brainstorm, followed by the organized menu of readings, and finally the diagnosis you asked for.

  ### Phase 1: Scratch Brainstorm

  *   **The Historical Claim:** Did this actually happen? The *Birkenhead* (1852) is the origin myth. The *Titanic*? Mostly for first class. The *Lusitania*? Not really. If the history is a myth, does the norm collapse?
  *   **The Biological Claim:** Women = reproductive capacity. Children = future potential. Men = expendable. Is this the hidden utilitarian calculus?
  *   **The Coordination Claim:** It doesn't matter *who* goes first, it matters that we *agree* on who goes first to stop the fighting. "Women and children" is just a salient focal point (Schelling point).
  *   **The Duty Claim:** It's not about the women's right to live, it's about the men's duty to die. It's a code of conduct for the "strong," not a right for the "weak."
  *   **The Categorical Claim:** Is it absolute? Or only when seats are exactly equal? If a woman is 90 and a man is 20, does the rule still hold? Suggests it's a crude heuristic, not a precise principle.
  *   **The Authority Claim:** Who says it? The Captain? If the Captain says it, it's an order. If the men say it to themselves, it's a norm.
  *   **The Triage Mismatch:** On a boat, the threat is external (the sea). In a hospital, the threat is internal (the virus). On a boat, you leave. In a hospital, you treat. Does the logic hold?
  *   **The "Children" vs. "Women" tension:** Children makes sense on a "life-cycle" view (they haven't lived yet). Women? That looks like gender essentialism. Why are they bundled?
  *   **The "Strong" Presupposition:** The rule assumes there *are* strong men capable of restraining themselves. In a pandemic, the "strong" (healthy) are the vectors. The logic inverts.

  ***

  ### Phase 2: The Menu of Readings

  Here are five distinct philosophical claims the sentence "Women and children first" could be making. I have separated them by the *type* of claim (descriptive, normative, conventional) to isolate the disagreement.

  #### Reading 1: The Strong Descriptive Claim
  *   **The Claim:** "In maritime disasters, the actual practice is that women and children are evacuated before adult men."
  *   **Commitments:** This is an empirical claim about human behavior and historical record. It commits you to nothing moral, only to factual accuracy.
  *   **Status:** **False (or heavily qualified).** Historical analysis shows this was inconsistently applied (often class-dependent). On the *Titanic*, 74% of women died in third class. On the *Lusitania*, there was no such order.
  *   **Moral Status:** None. However, if your friend uses this descriptive fact to justify a normative conclusion (an "is-ought" move), she is committing a naturalistic fallacy unless she adds a premise like "we ought to follow established successful conventions."

  #### Reading 2: The Coordination Convention (The Schelling Point)
  *   **The Claim:** "In a panic situation with fixed capacity, we need *any* salient rule to prevent a stampede that kills everyone; 'Women and children' is the culturally salient focal point we have agreed upon."
  *   **Commitments:** This commits you to the view that the *content* of the rule matters less than the *existence* of the rule. The value is instrumental (order over chaos), not intrinsic (women are not necessarily more valuable).
  *   **Status:** **Substantive-but-defensible.** It explains why we keep the rule even if the historical record is messy. It functions as a social technology.
  *   **Moral Status:** **Indirectly Moral.** It is a moral achievement to have a convention that prevents a "war of all against all." However, it is not a principle of *justice* (giving people their due), but of *efficiency* (saving the most by stopping the fight).

  #### Reading 3: The Substantive Moral Priority (Vulnerability/Value)
  *   **The Claim:** "Women and children have a stronger moral claim to rescue than adult men, ceteris paribus."
  *   **Commitments:** This commits you to a theory of value. Either women/children are more vulnerable (need protection), or their lives are more valuable (reproductive potential/future life), or men have less right to life in emergencies.
  *   **Status:** **Controversial.** It relies on essentialist views of gender or a specific "fair innings" argument for children. It is vulnerable to counter-examples (e.g., a female surgeon vs. a male father).
  *   **Moral Status:** **Directly Moral.** This is a claim about distributive justice. If this is the reading, the slogan is a principle of allocation based on moral worth or need.

  #### Reading 4: The Role-Based Duty (The "Birkenhead Drill")
  *   **The Claim:** "Adult men have a specific duty to sacrifice their safety for the vulnerable in contexts of civil collapse."
  *   **Commitments:** This locates the obligation not in the *recipient* (women/children) but in the *agent* (men). It is a virtue-ethical or role-ethical claim. It presupposes a category of "men" capable of agency and restraint.
  *   **Status:** **Defensible within specific contexts.** It makes sense in a military or maritime hierarchy. It becomes murky in civilian contexts where role distinctions are blurred.
  *   **Moral Status:** **Moral (Deontological).** It is about duty and honor, not necessarily about the value of the lives saved.

  #### Reading 5: The Procedural Tie-Breaker
  *   **The Claim:** "When all other relevant medical or logistical factors are equal, use gender and age as the final arbiter."
  *   **Commitments:** This commits you to the view that gender/age are *lexically secondary* to other criteria (like survival probability). It is not a selector, but a tie-breaker.
  *   **Status:** **Defensible.** This avoids the claim that a woman is *always* worth more than a man, only that she wins the coin toss if utility is identical.
  *   **Moral Status:** **Moral (Procedural).** It resolves indeterminacy without claiming deep metaphysical inequality.

  ***

  ### Phase 3: Deep Dives on Your Specific Concerns

  **1. Descriptive Accuracy and Moral Dependence**
  You are right to be suspicious. The historical record is messy. If the slogan is **Reading 1 (Descriptive)**, it is factually false.
  *   *Does the moral reading depend on the descriptive one?* Only if you believe moral norms derive authority from tradition (Reading 2). If you hold **Reading 3 (Substantive)**, the history doesn't matter; a principle can be true even if never practiced. However, if the friend argues "We should do X because this is what is *done*," she is relying on the descriptive claim to carry normative weight. That is a weak link.

  **2. Situational Presuppositions (The Category Error)**
  The slogan presupposes a specific architecture of the problem:
  *   **Fixed Capacity:** A lifeboat has 20 seats. A hospital has flexible capacity (you can build tents, redirect power). Immigration has no clear "seat" limit, only political will.
  *   **One-off Event:** The ship sinks once. A pandemic is iterative. Saving a woman today might mean she infects three men tomorrow.
  *   **Determinable "Strong":** The rule requires a class of people (men) who are physically capable of saving others but choosing not to save themselves. In a pandemic, the "strong" (healthy young adults) are often the primary vectors of transmission. Restraint helps, but "staying behind" doesn't save the vulnerable in the same way holding a ladder does.
  *   **Authority:** A ship has a Captain with a gun. Triage has a doctor with a chart. Immigration has a border agent with a law.
  *   *Verdict:* In triage and immigration, the presuppositions fracture. Applying the slogan there is likely a **category error**. It imports the logic of a sinking ship into a flowing system.

  **3. Coordination vs. Moral Facts**
  This is the crux of your friend's position.
  *   **Coordination (Reading 2):** The rule is justified *because* everyone expects it. If everyone expected "Tallest first," that would work too. The moral achievement here is *social stability*, not *justice*.
  *   **Moral Fact (Reading 3):** The rule is justified because women/children *deserve* it.
  *   *The Friend's Trap:* If she says "It's just a convention," she is arguing for Reading 2. But if she uses it to *settle* allocation (i.e., to stop you from arguing for a different distribution), she is treating it like Reading 3. She wants the stability of a convention with the authority of a moral truth. That is the slippage. A convention can be overturned if it produces bad outcomes; a moral truth cannot.

  **4. Tie-Breaker vs. Selector**
  *   **Selector:** "Women get ventilators, men do not." (Reading 3).
  *   **Tie-Breaker:** "If Patient A and Patient B have identical survival odds, pick the woman/child." (Reading 5).
  *   *The Disagreement:* You are likely arguing against the **Selector** reading (which seems unjust in triage). Your friend is likely defending the **Tie-Breaker** or **Coordination** reading (which seems pragmatic). You are talking past each other. In high-stakes triage, we rarely have exact ties, so a tie-breaker rule is practically useless, whereas a selector rule is dangerous.

  **5. Who is the "You"?**
  *   **The Crew/Captain:** "Load them first." (Administrative order).
  *   **The Men:** "Stand back." (Individual duty).
  *   **The State:** "Prioritize these citizens." (Policy).
  *   *Shift:* In the lifeboat, the "You" is the able-bodied male passenger. In triage, the "You" is the medical administrator. In immigration, the "You" is the border state. The moral weight shifts. A duty on a passenger to die is different from a duty on a state to exclude.

  ***

  ### Phase 4: Diagnosis and Application

  **Which reading did your friend mean?**
  She most likely meant **Reading 2 (Coordination Convention)** but expressed it as **Reading 1 (Descriptive)**.
  *   *Why:* She explicitly said, "it isn't a moral principle... it's just what people do." That is the definition of a convention. She wants to bypass the moral weighing because she thinks the moral weighing leads to a stampede (or endless debate). She is treating the slogan as a *tool for decision closure*, not a truth about value.
  *   *The Flaw:* She is using a maritime coordination norm to settle a medical/Political distribution question where the coordination benefits don't clearly apply (doctors aren't stampeding patients).

  **Which reading did you mean?**
  You most likely meant **Reading 3 (Substantive Moral Priority)** or **Reading 5 (Tie-Breaker)**.
  *   *Why:* You pushed back on the *allocation*. You are concerned with who *deserves* the resource. You heard her invoking a priority rule and assumed she was making a claim about the relative value of lives (women/children > men). You are treating the slogan as a claim about *justice*, she is treating it as a claim about *order*.

  **Can any reading settle the ventilator allocation question?**
  **Plainly: No.**

  Here is why none of the readings work for ventilators:

  1.  **Reading 1 (Descriptive):** Irrelevant. What happened on the *Titanic* tells us nothing about viral transmission or ICU capacity.
  2.  **Reading 2 (Coordination):** Weak. Medical staff are trained professionals, not a panicking crowd. They do not need a crude focal point to prevent stampeding; they have protocols. Using a gendered convention introduces bias without gaining stability.
  3.  **Reading 3 (Substantive):** Dangerous. Prioritizing women over men for ventilators violates standard medical ethics (which prioritize survival probability and sometimes "life-cycle" views). Prioritizing women specifically (rather than just "young people") introduces gender discrimination that is hard to justify medically.
  4.  **Reading 4 (Duty):** Inapplicable. We do not ask male patients to "duty die" in a hospital. We ask them to be treated based on need.
  5.  **Reading 5 (Tie-Breaker):** The only candidate, but still flawed. In modern triage, "ties" in survival probability are rare. When they do occur, a random lottery is generally preferred over a demographic heuristic to avoid systemic bias.

  **Conclusion:**
  Your friend is trying to import a **maritime emergency convention** into a **medical distributive justice** problem. The logic fails because the presuppositions (fixed capacity, panic risk, clear "strong" class) do not hold.

  You are right to feel that something is off. The sentence "Women and children first" is not a moral principle that travels well. It is a context-specific heuristic for a specific kind of physical disaster. When you move it to triage or immigration, it stops being a coordination device and starts looking like discrimination, because the "emergency" conditions that justified the exception are no longer present in the same form.

  Tell your friend: If it's just a convention to stop a stampede, show me the stampede in the ICU. If there is no stampede, the convention has no work to do, and we must return to moral principles.
