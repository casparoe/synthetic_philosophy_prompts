prompt: |-
  So I just spent most of last night arguing with my friend Dara — she's a Kantian-ish person who works in immigration law, I'm the annoying utilitarian-ish one — and I came out of it still holding a view I want you to attack. Here it is: I think most disputes between people with different value systems are, underneath, bargaining problems. Each side has an ordering over outcomes, the orderings disagree, and when they disagree in the right way there's some package where both sides give up something they rank low in exchange for something they rank high, and both walk away better off by their own lights. So "moral compromise" isn't a sad second-best or a betrayal of principle, it's gains from trade, and the whole apparatus of trade — the contract curve, the zone of agreement, the gap between what you'd accept and what you'd pay — carries over pretty much intact. Dara says this is a category error, that I'm treating commitments like commodities, but she couldn't give me a case that actually broke it, she just kept saying "but what about the wetland." (Long story — we were also fighting about a development near her parents' place, so the evening had alot going on.)

  What I want from you is the other side of that: what would actually count against this view? Not the vibe-level objection that values are special, but the real defeaters — cases where the bargaining picture can't even be set up, results showing it collapses into some rival picture, consequences I'm committed to that turn out unacceptable. I'm especially interested in whether there are values that can't be put on a common scale at all. A friend-of-a-friend keeps telling me that some commitments are lexicographic — you'd never trade any amount of them for any amount of something else — and I can't tell whether that's a deep point or just a refusal to name a number. Same question for whether my framework quietly assumes each side's ranking is complete and stable in a way real people's rankings aren't. And: what does my picture predict that a rival picture doesn't? If it doesn't predict anything different, I want to know that too.

  Sort them by how decisive they'd be, fatal down to merely awkward, and tell me which ones a committed gains-from-trade person like me would actually concede versus which they'd wave off as not a real case. I'd find it most persuasive if you can show me a live disagreement — something like the immigration stuff Dara deals with — where the trade framing lands the parties on a deal that both of them should reject by their own values. And if it turns out the view survives only because I keep bolting on qualifications every time someone pushes, say so, and tell me whether that's a bug or just what a view like this has to look like.
