answer: |-
  # Joint Statement on Advance Directives and Personal Identity

  ### I. Agreed Claims
  1.  **Purpose:** An advance directive is a planning tool intended to extend a person's agency into a period of incapacity, not merely a expression of fear about decline.
  2.  **Worth Honoring:** Directives deserve significant weight because ignoring them undermines trust in the practice and disrespects the effort of planning.
  3.  **Dementia Experience:** People with advanced dementia have subjective experiences of well-being and suffering that are real and morally relevant, regardless of their cognitive deficits.
  4.  **Continuity:** There is sufficient continuity between the earlier competent self and the later incapacitated self to warrant moral concern for both, though the nature of that continuity is disputed.
  5.  **Stakes:** The earlier self risks having their life narrative violated; the later self risks having their current welfare neglected.
  6.  **Evidence:** A directive is always evidence of what the person valued; the disagreement is whether it remains a *command* when values or facts shift.
  7.  **Policy Goal:** Decisions should minimize actionable regret and moral residue for caregivers, families, and the selves involved.

  ### II. Disagreements Table

  | Claim | Precedent-Autonomy Position | Present-Interests Position | What's Doing the Work |
  | :--- | :--- | :--- | :--- |
  | **Source of Authority** | The directive binds because the competent agent has a right to shape their life narrative and death, even after capacity is lost. | The directive guides because it indicates past values, but current well-being holds normative priority over past abstract wishes. | Metaphysics of Identity vs. Ethics of Welfare |
  | **Status of Present Preference** | A current desire to live (contrary to the directive) is a symptom of the pathology that the directive was meant to address. | A current desire to live is an expression of will that must be respected unless the agent is currently suffering unbearably. | Epistemology of Capacity |
  | **Nature of Violation** | Overriding the directive harms the earlier self by violating their right to self-determination and integrity. | Enforcing the directive harms the later self by sacrificing their concrete existence for an abstract principle. | Who is the Patient? |

  ### III. Analysis of Cruxes and Test Cases

  **Crux 1: Does bindingness rest on identity, promise, or autonomy?**
  *   **Test Case:** A directive with a **self-revising clause** ("If I later seem content and ask to live, ignore this directive").
  *   **Precedent-Autonomy Prediction:** The directive is overridden. The earlier self exercised autonomy *about* the limits of their autonomy. Honoring the clause honors the earlier self's meta-wish.
  *   **Present-Interests Prediction:** The directive is overridden. The condition (contentment) is met, confirming the present self's welfare is positive. Honoring the clause honors the present self's state.
  *   **Diagnostic:** They agree on the outcome but disagree on the *source* of the permission. PA sees it as the Earlier Self's continued rule; PI sees it as the Earlier Self conceding authority to the Present Self.

  **Crux 2: Is the present preference authoritative or discountable?**
  *   **Test Case:** A directive signed when a treatment was **expensive, burdensome, and rare**, now **cheap, pleasant, and widely available**. The present self wants the treatment; the directive refuses it.
  *   **Precedent-Autonomy Prediction:** The directive stands. The earlier self's valuation of life vs. burden was based on core values, not just cost. Changing facts do not invalidate the value judgment unless the directive specified them.
  *   **Present-Interests Prediction:** The directive lapses. The preference was based on false premises. The present self's desire, grounded in current reality, overrides the outdated calculation.
  *   **Diagnostic:** This is a genuine clash. PA prioritizes the stability of values; PI prioritizes the rationality of the current choice.

  **Crux 3: Is overriding a harm to the earlier self?**
  *   **Test Case:** The **self-revising clause** case again (specifically the scenario where the clause is *absent*, but the present self is happy).
  *   **Precedent-Autonomy Prediction:** Yes, it is a harm. The earlier self is wronged because their right to determine the end of their narrative is violated, even if they no longer exist to feel the frustration.
  *   **Present-Interests Prediction:** No, it is not a harm. The earlier self no longer exists in a morally relevant sense to be harmed; only the present being can be harmed, and overriding protects them.
  *   **Diagnostic:** PA relies on a notion of "critical interests" that survive psychological change. PI relies on a notion of "experiential interests" that require consciousness.

  ### IV. Verbal vs. Genuine Clash

  **Verbal Disagreements**
  *   **"The Same Person":** PA uses this to mean biological/legal continuity (numerical identity). PI uses this to mean psychological continuity (narrative identity). They are often talking past each other when debating whether the later self *is* the earlier self.
  *   **"Autonomy":** PA defines this as the right to bind one's future self (precedent autonomy). PI defines this as the right to current self-determination (current autonomy), even if impaired.
  *   **"Harm":** PA includes violation of rights/wishes as harm. PI restricts harm to suffering/negative experience.

  **Genuine Disagreements**
  *   **Outcome in Standard Cases:** In the case of a happy dementia patient with a directive refusing life-sustaining treatment (without a self-revising clause), PA mandates withholding treatment; PI mandates providing it. This is a policy clash with life-or-death consequences.
  *   **Weight of Outdated Facts:** In the cheap/pleasant treatment case, PA risks enforcing a wish the agent would not hold today; PI risks treating the earlier self's values as disposable based on external circumstances.
  *   **Moral Residue:** PA believes caregivers incur guilt by ignoring the directive. PI believes caregivers incur guilt by ignoring the smiling patient in front of them. This emotional conflict is real, not verbal.
