answer: |-
  # Specification for Species Concept Evaluation

  ## 1. Empirical Coverage (The Hard Cases)
  *A viable concept must provide a consistent decision rule for the following scenarios.*

  1.  **Ring Species:** Must explain why terminal forms are distinct species despite continuous gene flow through intermediate populations. **[Non-negotiable]**
  2.  **Cryptic Lineages:** Must distinguish genetically/ecologically distinct lineages that lack morphological differentiation. **[Preference: Phylogenetic/Ecological]**
  3.  **Asexual and Parthenogenetic Taxa:** Must delimit lineages in organisms lacking meiotic recombination without resorting to analogy with sexual processes. **[Non-negotiable]**
  4.  **Horizontal Gene Transfer (HGT):** Must accommodate prokaryotic/viral evolution where ancestry is reticulate rather than strictly bifurcating. **[Preference: Pluralist]**
  5.  **Fossil and Microbial Sequences:** Must operate on data limited to morphology (fossils) or short genomic fragments (metabarcoding) without behavioral observation. **[Non-negotiable]**
  6.  **Divergence-with-Gene-Flow:** Must resolve the status of a daughter population that has diverged ecologically from a parent population but continues to exchange genes at low frequency (the "gray zone" of speciation). **[Non-negotiable]**

  ## 2. Conceptual Distinctions
  *A viable concept must maintain logical separation between the following pairs.*

  7.  **Species Category vs. Species Taxon:** Must distinguish the theoretical definition of the rank (category) from the operational identification of specific groups (taxa). **[Non-negotiable]**
  8.  **Diagnosability vs. Reproductive Isolation:** Must not conflate the ability to distinguish groups (characters) with the mechanism maintaining their separation (process). **[Preference: Biological]**
  9.  **Monophyly vs. Interbreeding:** Must clarify whether species are defined by shared ancestry (historical) or current cohesive exchange (causal). **[Preference: Phylogenetic vs. Biological]**
  10. **Ranking vs. Delimitation:** Must separate the question of "is this a species?" from "where is the boundary drawn?" without circularity. **[Non-negotiable]**

  ## 3. Theoretical Consistency
  *A viable concept cannot contradict established findings in these fields.*

  11. **Population Genetics:** Cannot posit sharp boundaries where allele frequency clines are continuous, unless a specific threshold mechanism is defined. **[Non-negotiable]**
  12. **Phylogenetics:** Cannot require strict monophyly for incipient species that have not yet sorted ancestral polymorphism. **[Preference: Evolutionary]**
  13. **Ecology:** Cannot ignore adaptive divergence as a driver of lineage independence, even in the presence of gene flow. **[Preference: Ecological]**

  ## 4. Operational Utility
  *A viable concept must serve these practical functions.*

  14. **Conservation Law:** Must produce discrete units that can be legally protected (e.g., Endangered Species Act compliance). **[Non-negotiable]**
  15. **Biodiversity Inventory:** Must allow for stable counting and naming over time without constant revision upon new genetic data. **[Preference: Taxonomic]**
  16. **Model-Organism Choice:** Must justify why findings in one population generalize to the species level. **[Preference: Biological]**
  17. **Non-Specialist Use:** Must allow identification by non-experts using incomplete data (field guides, keys). **[Non-negotiable]**

  ***

  ## 5. Incompatibility Analysis

  **Flagged Incompatible Subsets:**
  *   **Set A (Process Reality):** Requirements 11 (PopGen continuity), 12 (Polyphyly allowed), and 6 (Divergence-with-gene-flow). These acknowledge speciation as a gradual, messy process.
  *   **Set B (Operational Discreteness):** Requirements 14 (Conservation Law), 15 (Inventory), and 17 (Non-specialist use). These require species to be static, discrete, and easily identifiable units.
  *   **Conflict:** Set A and Set B cannot be jointly satisfied. Evolution produces continua; Law and Inventory require binaries. A concept satisfying Set A will fail Set B (too fluid for law); a concept satisfying Set B will fail Set A (arbitrary cuts in continuous variation).

  **The "Killer" Requirement:**
  *   **Requirement 3 (Asexual and Parthenogenetic Taxa) combined with Requirement 1 (Ring Species).**
  *   **Reasoning:** This combination eliminates the most proposed concepts. The Biological Species Concept (BSC) fails Requirement 3 (no sex). The Phylogenetic Species Concept (PSC) often struggles with Requirement 1 (defining terminals in a ring) and Requirement 4 (HGT). Only a Pluralist or highly abstract Evolutionary concept attempts both, often at the cost of Operational Utility (Requirement 17).

  ***

  ## 6. Brief Assessment of Existing Contenders

  *   **Biological Species Concept (BSC):** Fails asexuals and fossils outright; struggles with divergence-with-gene-flow; excellent for theoretical cohesion in sexual animals.
  *   **Phylogenetic Species Concept (PSC):** Handles asexuals and cryptic lineages well; prone to oversplitting (violating Inventory stability); struggles with HGT and reticulation.
  *   **Ecological Species Concept (ESC):** Handles divergence-with-gene-flow well; difficult to operationalize for non-specialists or fossils where niche data is absent.
  *   **Evolutionary Species Concept (EvoSC):** Theoretically robust across all cases; too vague for operational delimitation and legal application.
  *   **Pluralist Approaches:** Acknowledge incompatibilities; fail to provide the single unified rule required by Conservation Law and general inventory.
