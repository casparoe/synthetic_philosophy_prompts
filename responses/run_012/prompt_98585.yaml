prompt: |-
  I need a specification for what a species concept must deliver before I evaluate any more of them. Set out the desiderata: the cases it has to get right (ring species, cryptic lineages, asexual and parthenogenetic taxa, organisms that swap genes horizontally, fossil and microbial sequences, and a hypothetical case of a single interbreeding population that sends out a daughter population which then diverges ecologically while still exchanging genes at low frequency), the distinctions it must respect (species category versus species taxon; diagnosability versus reproductive isolation; monophyly versus interbreeding; ranking versus delimitation), the findings from population genetics, phylogenetics, and ecology it cannot contradict, and the practical tasks it must serve (conservation law, biodiversity inventory, model-organism choice, and decisions made by non-specialists on incomplete data). For each requirement, give the case or consideration behind it and mark it non-negotiable or a preference of a particular school (biological, evolutionary, phylogenetic, ecological, or pluralist). Then flag any subset of requirements that cannot be jointly satisfied, and say which single requirement eliminates the most proposed concepts. Keep the assessment of existing contenders to a sentence or two each; the list of requirements is what I want.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Goal:** Create a specification (list of desiderata) for a species concept.
      *   **Purpose:** To evaluate future species concepts against this standard.
      *   **Required Content:**
          *   Cases to get right (ring species, cryptic lineages, asexual/parthenogenetic, HGT, fossils/microbes, divergence-with-gene-flow).
          *   Distinctions to respect (category vs. taxon, diagnosability vs. RI, monophyly vs. interbreeding, ranking vs. delimitation).
          *   Scientific findings not to contradict (population genetics, phylogenetics, ecology).
          *   Practical tasks to serve (law, inventory, model organisms, non-specialist use).
          *   Classification: Mark each as "Non-negotiable" or "Preference of [School]".
          *   Conflict Analysis: Flag incompatible subsets and identify the single requirement that eliminates the most concepts.
          *   Constraint: Keep assessment of existing contenders to 1-2 sentences each (focus on the requirements).
      *   **Tone:** Rigorous, philosophical, biological, systematic.

  2.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Empirical Cases (The "Hard Tests")*
          *   Ring Species: Needs to handle gradual variation with terminal non-interbreeding. (Often breaks BSC).
          *   Cryptic Lineages: Morphologically identical but genetically/ecologically distinct. (Breaks Morphological SC).
          *   Asexual/Parthenogenetic: No sex, so no interbreeding. (Breaks BSC).
          *   Horizontal Gene Transfer (HGT): Prokaryotes/viruses. Tree of life is a web. (Breaks PSC/monophyly).
          *   Fossils/Microbial Sequences: Limited data (no behavior, no breeding tests). (Breaks BSC).
          *   Divergence-with-Gene-Flow (The hypothetical case): Ecological divergence + low frequency gene exchange. (The "Gray Zone" problem).

      *   *Category 2: Conceptual Distinctions*
          *   Category vs. Taxon: Concept (what is a species?) vs. Operational unit (this specific group).
          *   Diagnosability vs. Reproductive Isolation: Can we tell them apart vs. do they breed?
          *   Monophyly vs. Interbreeding: Shared history vs. current cohesion.
          *   Ranking vs. Delimitation: What rank is it? vs. Where do we draw the line?

      *   *Category 3: Scientific Consistency*
          *   Population Genetics: Drift, selection, migration rates.
          *   Phylogenetics: Ancestry, branching processes.
          *   Ecology: Niche, adaptive zones.

      *   *Category 4: Practical Utility*
          *   Conservation Law: Needs legal standing (often requires discrete units).
          *   Biodiversity Inventory: Counting needs stability.
          *   Model Organism: Generalizability.
          *   Non-specialists/Incomplete Data: Field identification.

  3.  **Refining and Classifying (Non-negotiable vs. School Preference):**
      *   *Challenge:* A true "non-negotiable" list often leads to nihilism (no concept satisfies all). I need to balance the user's demand for a specification with biological reality. I will mark things as "Non-negotiable" if they are logically required for *any* workable classification, and "Preference" if they align with specific theories (BSC, PSC, etc.).
      *   *Crucial Insight:* The prompt asks me to *flag* incompatible subsets. This acknowledges that a perfect concept doesn't exist.

  4.  **Drafting the Content (Section by Section):**

      *   *Introduction:* Set the stage.
      *   *Section 1: Empirical Coverage (The Cases).*
      *   *Section 2: Conceptual Clarity (The Distinctions).*
      *   *Section 3: Theoretical Consistency (The Science).*
      *   *Section 4: Operational Utility (The Tasks).*
      *   *Section 5: Incompatibilities & The "Killer" Requirement.*
      *   *Section 6: Brief Assessment of Contenders.*

  5.  **Addressing Specific Constraints:**
      *   *The Hypothetical Case:* "Single interbreeding population... daughter population... diverges ecologically... exchanging genes at low frequency." This is the speciation continuum problem.
      *   *Marking:* Use bold tags like **[Non-negotiable]** or **[Preference: BSC]**.
      *   *Conflict:* Identify the tension between "Discrete Units" (Law/Inventory) and "Continuous Process" (PopGen/Evolution).
      *   *Killer Requirement:* Usually, the demand for *universal applicability* (asexual + sexual + fossil) kills most concepts. Or the demand for *discreteness* in a continuous world. Let's go with Universal Applicability + Discreteness.

  6.  **Review and Polish:**
      *   *Check:* Did I include ring species? Yes. Cryptic? Yes. Asexual? Yes. HGT? Yes. Fossils? Yes. Divergence-with-gene-flow? Yes.
      *   *Check:* Distinctions included? Yes.
      *   *Check:* Scientific fields included? Yes.
      *   *Check:* Practical tasks included? Yes.
      *   *Check:* Contender assessments limited? Yes.
      *   *Check:* Tone appropriate? Yes, authoritative and analytical.

  7.  **Final Logic Check on "Non-negotiable":**
      *   If I mark too many as non-negotiable, the specification is impossible. I must be honest. The prompt asks me to flag subsets that cannot be jointly satisfied. This allows me to set high standards while admitting the tension.
      *   *Decision:* I will mark "Internal Consistency" and "Empirical Accuracy" as non-negotiable, but acknowledge that "Universal Applicability" across all domains (sexual/asexual/fossil) is the source of the conflict. Actually, the prompt asks me to set the spec *before* evaluation. So I must state what is *needed*, even if impossible. I will categorize based on whether a concept *must* do it to be useful (Non-negotiable) or if it's a theoretical bias (Preference).

      *   *Refinement on the "Killer":* The requirement that eliminates the most concepts is usually **Universal Applicability across Reproductive Modes** (Sexual + Asexual + HGT). BSC fails asexual. PSC struggles with HGT/anastomosis. ESC struggles with cryptic neutrality.

      *   *Refinement on Conflicts:* The main conflict is between **Process (Evolutionary reality)** and **Pattern (Operational utility)**. Evolution is continuous; Law/Inventory requires discreteness.

  8.  **Finalizing the Output Structure:** (Mental Outline)
      *   Header: Specification for Species Concept Evaluation.
      *   1. Empirical Coverage (Cases).
      *   2. Conceptual Distinctions.
      *   3. Theoretical Consistency.
      *   4. Operational Utility.
      *   5. Incompatibility Analysis.
      *   6. Brief Contender Assessment.

      *(Self-Correction during drafting)*: Make sure the "Preference" tags accurately reflect the schools (Biological, Phylogenetic, Ecological, Evolutionary, Pluralist).

      *(Self-Correction on the Hypothetical Case)*: Ensure the "divergence with gene flow" case is explicitly detailed as requested.

      *(Self-Correction on Contenders)*: Keep it very brief. BSC, PSC, ESC, GSC, Pluralism.

  9.  **Final Polish:** Check against the prompt's instruction: "Keep the assessment of existing contenders to a sentence or two each; the list of requirements is what I want." Okay, ensure the bulk of the text is the requirements.

