answer: |-
  The rain in Harrow's Reach did not fall; it accumulated. It sat on the asphalt, seeped into the brickwork, and waited for the tide to come up to meet it. Elara sat in her office on the fourth floor of the Coastal Risk Board, watching a droplet trace a path down the windowpane. It merged with another, sped up, and vanished.

  On her desk lay the Statutory Form 14-B: *Seasonal Inundation Probability*. The box at the bottom required a single percentage. The statute, passed after the second flood in ten years, was explicit. To trigger the evacuation protocol, the Board must certify that the probability of critical inundation exceeded a threshold. To certify, they needed a number. Not a range. Not a confidence interval. A number.

  Elara opened her notebook. It was a mess of grey lead and blue ink, filled with the debris of other people's certainty.

  *Model A (Hydraulic):* $p \in [0.12, 0.14]$
  *Model B (Historical):* $p \in [0.13, 0.15]$
  *Consensus (Last Month):* $p = 0.135$

  She had been comfortable with 0.135. It was defensible. It was the center of gravity of the data they had. Then, three days ago, a resident from the Lower Wards had come forward with a logbook from the '21 flood. He had measured the water line against his porch steps. It was six inches higher than the Board's sensors had recorded.

  It was a single data point. By all rights, it should have calibrated the model. It should have narrowed the error bars.

  Elara turned to the fresh page.

  *Update: Witness Testimony (WT-21).*
  *Conditioning on WT-21 invalidates sensor calibration assumption $C_1$.*
  *If $C_1$ is false, sensor drift parameter $\delta$ is unbounded within physical limits.*
  *New Set $\mathcal{P}$:*
  *Lower Bound: 0.08*
  *Upper Bound: 0.26*

  She stared at the brackets. They had breathed open. The more she knew, the less she could pin down.

  In the theory she had read quietly, late at night, this had a name. She didn't write the name in the notebook. Names made things sound like they belonged to someone else. Here, it was just arithmetic honesty. When the new information revealed that the underlying assumptions were more fragile than previously thought, the set of admissible distributions expanded. The information was relevant, but it was not *decisive*. It dissolved the glue holding the prior models together.

  The door opened without a knock. Marcus stood there, holding two mugs of coffee. He was her senior counterpart, a man who believed that uncertainty was just a tax on the indecisive.

  "Still wrestling with the ghost?" Marcus asked, setting a mug down near her elbow. He glanced at the open notebook. His eyes tracked the numbers. "0.08 to 0.26? Elara, that's not an estimate. That's a shrug."

  "It's the set of distributions consistent with the evidence," she said. Her voice was level. She was not timid, but she was tired. "The witness data breaks the exchangeability of the sensor records. We can't treat the 2021 data as independent anymore. The system has memory."

  "So pick the midpoint," Marcus said, leaning against the filing cabinet. "0.17. It's conservative enough to trigger the alert if the storm surge hits the mean, low enough that we don't cry wolf if it misses."

  "If I write 0.17, I am lying," Elara said. "I am asserting a precision that does not exist. I am saying the risk is 0.17, when the evidence supports 0.08 just as well as it supports 0.26."

  "No one cares about the support," Marcus said. "Halloway cares about the signature. The statute says 'a number'. It doesn't say 'a number that makes you sleep well'. It says 'a number'."

  "The statute assumes the world is a coin toss," Elara said. "It assumes we know the weight of the coin. We don't. We only know the coin is warped."

  Marcus took a sip of coffee. "You're describing a prior over priors. Just integrate it out. Commit to a hyper-prior. Flatten the hierarchy."

  "There is no objective hyper-prior," she said. "Any choice I make there is arbitrary. If I choose one, I get 0.17. If I choose another, I get 0.22. Why is my arbitrary choice better than the interval?"

  "Because 0.17 allows us to act," Marcus said. He pushed off the cabinet. "There's a journalist in the lobby. Kaito. He's asking why the evacuation order hasn't been pre-authorized. He thinks we're waiting for the water to rise before we move people. He needs a story. Either we are ready, or we are incompetent. There is no third option for the press."

  "There is a third option," Elara said, closing the notebook. "We are blind."

  "Then guess," Marcus said. "Guessing is a job requirement."

  He left the mug. The steam rose and joined the condensation on the window.

  Elara took the notebook to the Chair's office. Director Halloway was a man carved from the same granite as the sea wall. He was not a villain; he was a signatory. He understood that his signature carried legal weight, not mathematical truth.

  Elara placed the notebook on his desk. She did not open it to the page with the widening brackets. She opened it to the summary.

  "The interval has expanded," she said.

  Halloway looked at the numbers. He took off his glasses and rubbed the bridge of his nose. "Last month you gave me 0.13. Today you give me a gap that spans from 'negligible' to 'catastrophic'."

  "Last month we were ignoring the porch-step data."

  "And now that we aren't ignoring it, the answer is worse?"

  "The answer is more honest."

  Halloway leaned back. The office was quiet, save for the hum of the HVAC and the distant sound of a siren testing the warning system. "Elara, I have to sign Form 14-B. If I sign with a range, the courts will throw it out. The statute is not a suggestion. It requires a point estimate. If I don't sign, the protocol doesn't trigger. If the protocol doesn't trigger, and the water comes... the families in the Lower Wards don't move."

  "If I sign 0.17, and the water comes at the 0.26 severity, people die," Elara said. "And if I sign 0.17, and the water stays at 0.08, we evacuate ten thousand people for nothing. The cost of the error is asymmetric, but the error itself is guaranteed."

  "You're saying you can't do the math?"

  "I'm saying the math doesn't produce a number. It produces a shape. You're asking me to measure the volume of a cloud with a ruler."

  Halloway stood up and walked to the window. The sky over the port was the colour of bruised iron. The storm, designated *Cyclone 9*, was two days out. It was large, slow, and unpredictable.

  "Marcus tells me you're hesitating," Halloway said.

  "Marcus thinks hesitation is a failure of nerve."

  "Is it?"

  Elara thought about the notebook. She thought about the way the interval had breathed open when she added the truth. It felt like a physical recoil, as if the reality of the coast was pushing back against the attempt to contain it.

  "It's a refusal to pretend," she said. "If I give you 0.17, I am not giving you a risk assessment. I am giving you a shield. You can point to it and say, 'We followed the number.' But the number won't stop the water."

  Halloway turned. His face was tired. "I know that. Do you think I don't know that? I was here in '21. I remember the water in the lobby. But I am not a mathematician, Elara. I am a public official. My job is to make decisions under uncertainty. Your job is to quantify the uncertainty. If you quantify it as 'everything is possible', you have not quantified anything. You have resigned."

  "I haven't resigned. I've given you the bounds."

  "The bounds are useless to the statute."

  "Then the statute is useless to the coast."

  Halloway walked back to the desk. He picked up a pen. It was a heavy thing, black and silver. He hovered it over the Form 14-B.

  "Kaito is downstairs," Halloway said. "If I don't sign, he writes that the Board is paralyzed. If I sign, and I'm wrong, he writes that the Board was negligent. I have to choose which headline I can survive."

  "Choose the one that keeps people dry."

  "I can't choose that. I can only choose the number." Halloway looked at her. "Give me the number, Elara. Not the interval. The number you would use if you were me."

  Elara looked at the form. The blank box waited. It was a small space for a large fear.

  She knew what would happen if she wrote 0.17. It would be processed. The alarms would be set. The trucks would be staged. It would be *manageable*. The widening interval in her notebook would be filed away as 'analyst notes', distinct from the 'official determination'. The gap between what she knew and what she filed would become a permanent feature of the architecture, like a load-bearing wall that no one was allowed to see.

  If she refused, the storm would arrive, and the decision would be made by the water itself.

  "The midpoint is 0.17," she said. Her voice sounded thin in the room.

  "Write it," Halloway said.

  "I can't."

  Halloway put the pen down. He didn't get angry. He just looked disappointed, the way a teacher looks when a student understands the lesson but refuses to take the test.

  "Then I will write it," Halloway said. "And I will note that it is based on the senior analyst's recommendation."

  "That's not true."

  "It will be true enough for the court." Halloway picked up the pen again. "Elara, go home. Pack a bag. If the water comes, I want you somewhere high."

  "I'll be in the office."

  "Don't be."

  Elara took her notebook and left. The hallway was long and carpeted, dampening the sound of her footsteps. She passed the conference room where Marcus was briefing the logistics team. He was pointing at a map, drawing circles with a marker. Confident arcs. Clean perimeters.

  She went back to her office. The rain was heavier now, drumming against the glass. She sat down and opened the notebook to the page with the widening brackets.

  $[0.08, 0.26]$.

  She took her pen and drew a line through the interval. She did not cross it out; she just underlined it.

  There was a phenomenon she had read about, once, in a paper she hadn't cited. It described how, in certain systems, acquiring more information increases entropy. It wasn't noise. It was structural. The more you looked, the more you saw that you couldn't see.

  She thought about the people in the Lower Wards. They didn't know about the interval. They knew about the water on their porch steps. They knew about the mould in the drywall. They lived in the gap. The Board lived in the number.

  Her phone buzzed. A text from Marcus. *He signed. 0.17. Press release in ten.*

  Elara closed the notebook. She stood up and walked to the window. Down in the street, the drainage grates were already swirling with brown water. The tide was coming in. The number was 0.17. The water did not know the number. The water only knew the shape of the land, and the land was sinking.

  She watched the droplet on the window. It grew heavy, distorted the view of the street below, and finally let go. It fell out of sight.

  Elara picked up her bag. She would not go home. She would go to the operations floor. She would not try to change the number. She would watch the sensors. If the water rose faster than the model predicted—and it would, because the model was a single line and the water was a volume—she would find a way to bypass the protocol.

  There was no statute for that. There was only the choice.

  She turned off the light. The office was dark, save for the glow of the city outside, reflecting on the wet glass. The storm was not a question. It was an answer. The Board had asked the wrong one.

  Elara walked into the corridor. The sirens began to wind up, a low, rising moan that vibrated in the floorboards. It was the sound of the machine starting up, the sound of the number becoming real. She walked toward it, her notebook heavy in her bag, a record of everything the number could not say.
