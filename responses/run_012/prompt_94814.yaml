          2.  Attack Thresholds (violates continuity/additivity).
          3.  Attack Bounded Utility (violates preference structure/arbitrary cap).
          4.  Attack Risk Aversion (mathematically equivalent to bounded utility or shifts fanaticism to tail thickness).
          5.  Attack Imprecise Credences (collapses to threshold or ignores evidence).
          6.  Synthesize common structure (Archimedean vs. Non-Archimedean tension).
