  4.  **Drafting the Content - Section by Section:**

      *   **Plan Paragraph:** Keep it tight. Focus on defining "Failure" as either violating Dominance or introducing Arbitrary Parameters. Weakest point will be the bounded utility critique, as many find bounded utility intuitive.
      *   **Standard of Acceptability:** Two criteria: (1) *Dominance Preservation*: If Act A is better than Act B in every state, A must be chosen. (2) *Parameter Non-Arbitrariness*: If a rule requires a parameter (like a threshold), the theory must specify how to set it; otherwise, verdicts are hostage to whim.
      *   **Repair 1: Probability Threshold.**
