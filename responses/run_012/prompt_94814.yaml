          *   *Counter:* The "Sorites of Risks". If I face $N$ independent risks each with $p < \epsilon$, the union might have $P > \epsilon$. Or simply: Move the probability slightly above $\epsilon$.
          *   *Formal:* Act A: $p=\epsilon + \delta$, Payoff $X$. Act B: Sure $S$. If $\delta \to 0$, verdict flips discontinuously. Violates continuity. Also, violates dominance if we partition states finely enough to push probabilities below $\epsilon$.
      *   **Repair 2: Bounded Utility.**
          *   *Setup:* $u(x) \in [0, M]$.
          *   *Counter:* The "St. Petersburg Variance". Even with bounded utility, if the *cost* of the ticket is utility-based, we can construct scenarios. But more strongly: Why bound utility? If preferences satisfy von Neumann-Morgenstern axioms over unbounded outcomes, utility *must* be unbounded. To bound it is to deny the preference structure.
          *   *Refinement:* The prompt asks to show it fails to remove fanaticism or introduces arbitrary parameters. Bounding utility *does* remove fanaticism mathematically. So I must attack the *principled basis* for the bound. It introduces an arbitrary parameter $M$. Where does $M$ come from? If it's psychological, it's descriptive, not normative. If it's normative, it violates the axiom that more is better (monotonicity) over some domain.
          *   *Better Attack:* "Relocating Fanaticism". If utility is bounded, fanaticism shifts to probability discrimination. To distinguish between two acts with expected utility near the bound, you need infinite precision in credence. Or, simply, the bound itself is the arbitrary parameter.
      *   **Repair 3: Risk Aversion (Concave Transformation).**
          *   *Setup:* Maximize $E[v(u(x))]$ where $v$ is concave.
          *   *Counter:* If $u$ is unbounded, $v(u)$ can still be unbounded (e.g., log). If $v(u)$ is bounded, this *is* the bounded utility repair. If $v(u)$ is unbounded, fanaticism remains (just requires higher payoffs).
          *   *Formal:* Let $v(y) = \ln(y)$. If payoff $X$ can be $e^Y$, then $v(u(X)) = Y$. Still unbounded. To stop fanaticism, $v \circ u$ must be bounded. Thus, this collapses into Repair 2.
      *   **Repair 4: Imprecise Credences.**
          *   *Setup:* $P(E) \in [a, b]$. Use Maximin or Hurwicz.
          *   *Counter:* If the interval includes 0, Maximin ignores the risk (good). But if evidence forces interval $[\epsilon, 2\epsilon]$, we are back to EV. If we use Maximin, we violate dominance (ignore positive evidence). If we use a weighted compromise, the weight is arbitrary.
