      *   Core claim: EV maximization is fanatical. Any attempt to stop this fanaticism fails systematically.
      *   Definition of Fanaticism: For any sure payoff $S$ and any $p > 0$, there exists a payoff $X$ such that $p \cdot u(X) > u(S)$. (Pascal's Mugging style).
      *   Goal: Show patches either move the fanaticism (e.g., to probabilities near the threshold) or introduce arbitrariness.

