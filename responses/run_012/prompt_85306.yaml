      *   *The Criteria:* Flesh out (a) and (b). (a) is about integration into practical reasoning. (b) is about veto power.
      *   *The Reordering:*
          *   Defaults: Inertia is just a friction. If I can overcome friction, I am answerable.
          *   Cooling-off: This is a cage. It stops the action regardless of my reasoning. It treats me as a child who *must* wait.
          *   New Case: *Graphic Warning Labels.* Critics hate them (emotional manipulation). Answerability loves them (I see the image, I weigh it, I still buy). This shows the divergence clearly.
      *   *The Hard Bit (Agent-Relativity):* This is the killer. If a default is answerable to a philosopher but not to a tired single mom, is the policy just?
