          *   *Concession:* This admits the view isn't purely about the agent's mind, but about the design of the choice architecture.
      *   *The Bet:* The view underestimates the cumulative burden of answerability. Being constantly asked to represent and defeat influences is exhausting. It creates a "compliance burden" on autonomy.

