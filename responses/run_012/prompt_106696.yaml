answer: |-
  **MODULE: PUZZLES OF THE INFINITE**
  **FINAL EXAMINATION**

  **Question 1**
  Consider the following supertask: A lamp has a toggle switch. At time $t=0$, the lamp is off. At $t=1/2$, it is turned on. At $t=3/4$, it is turned off. At $t=7/8$, it is turned on. Generally, at the $n$-th step of the sequence (occurring at $t = 1 - 2^{-n}$), the state of the lamp is reversed. The sequence completes at $t=1$.

  **(a)** Philosophers disagree on whether the state of the lamp at $t=1$ is impossible to determine because the description fails to specify it (underdetermination) or because the description entails a contradiction (inconsistency). Distinguish these two claims clearly. Commit to one reading and argue for it. Then, specify precisely what principle or fact would need to be added to the description to make the final state determinate on your view. **(10 marks)**

  **(b)** Consider a "Dimming Lamp" variant. The lamp is not binary but dimmable. At the $n$-th step, the brightness is set to $1 - 2^{-n}$ (where 1 is full brightness). As $n$ increases, the brightness approaches 1. Is the final state of this lamp determinate? Explain what this variant reveals about whether the indeterminacy in the original case stems from the supertask structure itself or the binary nature of the variable. **(7 marks)**

  **(c)** Consider a "Parity Lamp" variant. We stipulate that the lamp is on at $t=1$ if and only if the total number of toggles performed is even. Does this stipulation successfully resolve the indeterminacy? Explain what this reveals about the relationship between underdetermination and incoherence. **(8 marks)**

  ***

  **MODEL ANSWER**

  The central philosophical tension regarding Thomson's Lamp lies in diagnosing why the final state at $t=1$ seems unknowable. The inconsistency reading claims the description of the supertask violates logical or physical laws, rendering the scenario impossible akin to a square circle. The underdetermination reading claims the scenario is possible, but the provided instructions simply fail to fix the state at the limit point, leaving a gap in the description rather than a contradiction in the world.

  I commit to the underdetermination reading. The description specifies the state of the lamp for every instant $t < 1$. There is no logical contradiction in the sequence of states prior to the limit. The contradiction only arises if one assumes a principle linking the limit of the inputs to the limit of the outputs that is not explicitly stated. To claim inconsistency is to assume that physical states must be continuous functions of time without justification. To claim underdetermination is to acknowledge that the causal history provided does not logically entail a unique outcome.

  To make the final state determinate, we must add a principle of continuity or causal closure. Specifically, we need a law stating that the state at the limit time $t=1$ is determined by the limit of the states as $t$ approaches 1. In the binary case, since the state oscillates between 0 and 1 without converging, this principle would imply the final state is undefined, or we must add a physical law specifying the state at $t=1$ independently of the sequence. However, if we adopt a continuity principle for physical properties, the binary lamp fails to have a limit, suggesting the description is incomplete regarding the physics of the switch at the limit.

  The Dimming Lamp variant clarifies the source of this indeterminacy. Here, the brightness at step $n$ is $1 - 2^{-n}$. Mathematically, the limit of this sequence as $n$ approaches infinity is 1. If we accept a principle that physical properties evolve continuously where mathematically possible, the brightness at $t=1$ is determinately 1 (full brightness). This variant demonstrates that the supertask structure itself is not the source of indeterminacy. A supertask can yield a determinate result if the state space is continuous and convergent. The indeterminacy in the original Thomson's Lamp arises specifically from the discrete, binary nature of the variable (on/off) which prevents mathematical convergence. The gap is topological, not temporal.

  The Parity Lamp variant attempts to force determinacy by stipulation: the lamp is on iff the number of toggles is even. This stipulation fails to resolve the indeterminacy because it is ill-defined. The concept of "parity" (even or odd) applies to natural numbers. The supertask involves completing $\omega$ toggles. $\omega$ is a transfinite number, not a natural number, and does not possess parity. Stipulating a condition based on the parity of $\omega$ is semantically void, similar to stipulating the lamp is on if the number of toggles is "green."

  This reveals a crucial distinction between underdetermination and incoherence. The original lamp is underdetermined because the description allows multiple consistent outcomes (on or off). The Parity Lamp attempts to fix this by adding a rule, but because the rule relies on a category mistake, it pushes the description toward incoherence. It shows that not all stipulations resolve underdetermination; some stipulations are themselves meaningless within the logical framework of the supertask. Therefore, resolving the puzzle requires not just adding rules, but adding well-defined rules that respect the mathematical structure of the infinite sequence. The failure of the Parity Lamp confirms that the indeterminacy of the original is not merely a lack of information, but a structural feature of applying finite concepts (like parity or binary states) to completed infinities.

  ***

  **MARKING SCHEME**

  **Total: 25 Marks**

  **Part (a): Distinction, Commitment, and Fix (10 Marks)**
  *   **Distinction (3 marks):** Clearly defines inconsistency (logical impossibility/contradiction in the setup) vs. underdetermination (possible setup, outcome not fixed by premises).
  *   **Commitment & Argument (4 marks):** Takes a clear side. (Underdetermination is preferred for higher marks as it allows nuanced discussion of continuity, but Inconsistency is acceptable if argued via physical impossibility of supertasks). Argues why the opposite view is less plausible.
  *   **The Fix (3 marks):** Identifies a specific principle needed (e.g., Continuity Principle, Causal Closure, or independent physical law). Must explain *why* this fixes the gap.
  *   *Common Mistake:* Claiming the lamp is impossible because "there is no last switch" without distinguishing whether this makes it contradictory or just inconclusive.

  **Part (b): Dimming Lamp Variant (7 Marks)**
  *   **Verdict (2 marks):** Correctly identifies the final state is determinate (Brightness = 1).
  *   **Analysis (5 marks):** Explains that the mathematical limit exists. Crucially, argues that this isolates the binary variable as the source of the original problem, exonerating the supertask structure itself.
  *   *Common Mistake:* Saying the Dimming Lamp is also indeterminate because "infinity is never reached," missing the point of mathematical limits in continuous spaces.

  **Part (c): Parity Lamp Variant (8 Marks)**
  *   **Verdict (3 marks):** Correctly identifies the stipulation fails/is ill-defined.
  *   **Analysis (5 marks):** Explains that parity applies to natural numbers, not transfinite cardinals ($\omega$). Connects this to the difference between underdetermination (multiple valid options) and incoherence (meaningless stipulation). Shows that adding rules can create nonsense if they don't match the ontology.
  *   *Common Mistake:* Accepting the stipulation as valid and arguing the lamp is therefore On or Off, failing to notice $\omega$ has no parity.

  **General Criteria**
  *   **No Citations:** Deduct 2 marks if specific author names (e.g., Thomson, Benacerraf) are used.
  *   **Clarity:** Deduct up to 3 marks for significant ambiguity or failure to follow the word count constraints (too brief to cover points).
