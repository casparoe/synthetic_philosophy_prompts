          *   *Con:* If variation is *biased* (guided) rather than blind, does selection do the heavy lifting? (This is the "Lamarckian swamping" argument).
          *   *Response:* Even guided variation needs selection to filter which improvements stick. Also, variation isn't *perfectly* guided; there's still noise.

