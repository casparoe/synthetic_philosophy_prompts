answer: |-
  This is not a verbal quibble; it is the central theoretical tension in the field of cultural evolution. You have identified the exact fault line where the analogy between biology and culture either pays dividends or collapses into metaphor.

  To answer your specific questions: No, a Darwinian theory of culture is not an oxymoron, but only if you decouple "Darwinian" from "Neo-Darwinian genetics." The standard move is to define Darwinism as a **substrate-neutral algorithm** rather than a specific biological mechanism. However, whether this move survives scrutiny depends on how much explanatory weight you place on the *source of variation* versus the *filter of selection*.

  Here is the breakdown of the standard move, the classification of your toy model, and the scrutiny it faces.

  ### 1. The Terminological Correction: Darwin vs. Neo-Darwin
  Your premise contains a common historical conflation. Charles Darwin did not strictly define his theory by the *absence* of the inheritance of acquired characteristics. Darwin himself allowed for use/disuse mechanisms (Lamarckism). The hard barrier against inheriting acquired characteristics is the **Weismann Barrier**, a cornerstone of the **Modern Synthesis (Neo-Darwinism)**, not Darwinism itself.

  When cultural evolutionists (like Boyd, Richerson, Henrich, or Dennett) speak of "Darwinian" culture, they are usually invoking **Generalized Darwinism**. This framework, championed by Donald Campbell (1960) and David Hull (1980), argues that natural selection is a logical process that can run on any substrate provided three conditions are met:
  1.  **Variation:** There is variation among individuals.
  2.  **Selection:** That variation correlates with differential fitness (success/replication).
  3.  **Retention:** The successful variants are transmitted with sufficient fidelity to the next generation.

  Under this definition, the *mechanism* of inheritance (genes vs. learning) is secondary to the *population-level dynamic*.

  ### 2. Classifying Your Toy Model
  > *Model: Each generation copies the most successful practitioner's method, improvises an improvement, and the improved method is what gets copied next.*

  Is this Darwinian, Lamarckian, both, or neither?

  *   **It is Lamarckian** regarding inheritance: The "improvement" is acquired during the lifetime and passed on. The Weismann barrier is violated.
  *   **It is Darwinian** regarding population dynamics: There is differential replication based on success (selection), and there is retention of the successful trait.

  Therefore, the standard classification in cultural evolution is that this is a **Darwinian process operating on Lamarckian inheritance.**

  Does calling it "Darwinian" add anything? **Yes.** If you only call it "Lamarckian," you describe the *transmission mechanism* but lose the *adaptive logic*. A purely Lamarckian system could theoretically drift or degrade. By labeling it Darwinian, you are making a specific prediction: that the system will exhibit **cumulative adaptive design** without a designer. The term signals that the *selection pressure* is doing the work of organizing complexity, not just the intelligent improvisation of the agents.

  ### 3. The Standard Move: Generalized Darwinism
  The standard move in the field (exemplified by **Dual Inheritance Theory**) is to accept the Lamarckian nature of cultural transmission but insist that selection still governs the macro-scale outcome.

  They argue that even if variation is "guided" (intelligent improvisation) rather than "blind" (random mutation), selection is still required to determine:
  1.  Which improvements are actually improvements (fitness is context-dependent).
  2.  Which improvements spread through the population vs. dying with the inventor.
  3.  Which combinations of improvements are compatible.

  In this view, "Darwinian" does not mean "blind variation." It means "differential retention of variants."

  ### 4. Does the Standard Move Survive Scrutiny?
  This is where your skepticism is warranted. There are two major lines of critique that suggest the term "Darwinian" might indeed become too thin to do work.

  #### A. The "Bias vs. Selection" Debate (Sperber's Critique)
  Dan Sperber and the "Epidemiology of Representations" school argue that if variation is heavily guided by cognitive biases (transformations), selection becomes epiphenomenal.
  *   **The Argument:** In biology, mutation is random relative to need, so selection is the *only* source of adaptation. In culture, humans intentionally design solutions. If I invent a better mousetrap because I understand physics, the "adaptation" comes from my brain, not from the selection process.
  *   **The Implication:** If the "improvisation" in your toy model is smart enough, selection is just a rubber stamp. Calling this "Darwinian" obscures the real engine of change (human intelligence/psychology).
  *   **The Counter:** Cultural evolutionists reply that individual intelligence is bounded. We copy heuristics we don't fully understand (e.g., food processing techniques). In these cases, we cannot intelligently design the improvement; we must rely on trial, error, and copying the successful. Here, selection is doing the heavy lifting, not the individual's insight.

  #### B. The Fidelity Problem
  Darwinian evolution requires high-fidelity replication to maintain complex adaptations.
  *   **The Critique:** Cultural transmission is "noisy." We don't copy genes; we reconstruct ideas. If the fidelity is too low, complex adaptations unravel (the "copying error" threshold).
  *   **The Defense:** This led to the concept of **Cultural Ratcheting**. While individual learning is Lamarckian and noisy, *social* learning mechanisms (norms, institutions, rituals) evolve to enforce high-fidelity copying. Thus, the *mechanisms of copying* evolve Darwinially to protect the *content* from Lamarckian degradation.

  ### 5. Verdict: Oxymoron or Insight?
  Is "Darwinian Theory of Culture" an oxymoron? **No.**
  Is "Darwinian" too thin? **Sometimes.**

  The term retains explanatory power **if and only if** you are analyzing phenomena where the outcome is *not* fully intelligible to the participants.
  *   **Low Explanatory Power:** Explaining why engineers build better bridges. (This is mostly intelligent design/Lamarckian).
  *   **High Explanatory Power:** Explaining why certain religious rituals, linguistic structures, or social norms persist despite being costly or misunderstood by participants. (This is selection acting on variation).

  The "Standard Move" survives scrutiny provided you accept **Campbell's Blind Variation and Selective Retention (BVSR)** in a nuanced form. You do not need *random* variation, but you do need variation that is **undirected with respect to the specific selective pressure.**

  In your toy model, if the "improvisation" is directed toward *fitness*, it is Lamarckian design. If the "improvisation" is directed toward *usability* or *aesthetics*, but *fitness* (survival of the practice) is a separate filter, then the process remains Darwinian.

  ### Summary
  The field has largely settled on **Dual Inheritance Theory**. It posits that humans have two lines of inheritance (genetic and cultural) that interact. It explicitly admits cultural inheritance is Lamarckian but argues that the *population dynamics* are Darwinian.

  Calling it "Darwinian" is not a metaphor; it is a claim about **causal structure.** It claims that the *reason* a cultural trait exists is not because it was designed, but because it out-competed alternatives. If you believe that most cultural complexity arises from intelligent design rather than competitive filtering, then yes, the term is vacuous. If you believe (as the field does) that most cultural complexity arises from the accumulation of small, semi-blind tweaks filtered by social success, then the term is doing essential work.

  The "standard move" is to treat Darwinism as an **algorithm**, not a biology. It survives scrutiny as long as you acknowledge that cultural variation is *biased*, but argue that bias does not preclude selection from being the primary driver of long-term adaptation.
