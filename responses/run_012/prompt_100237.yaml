      *   *Culture:* We definitely learn during our lifetimes and teach what we learned. This is "Lamarckian" in the biological sense.
      *   *The Crucial Pivot:* Is "Darwinian" defined by the *mechanism of inheritance* (genes vs. learning) or the *population-level dynamic* (differential fitness of variants)?
