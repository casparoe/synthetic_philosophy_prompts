  5.  **Evaluating the "Standard Move" (Generalized Darwinism):**

      *   *The Move:* Decouple the *logic* of natural selection from the *substrate* of genetics. Campbell (1960), Dawkins (1976), Hull (1980).
      *   *Requirements:* Variation, Selection, Retention (or Fidelity).
      *   *Scrutiny:* Does it survive?
