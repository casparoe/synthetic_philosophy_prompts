  ### Brainstorm: Axes of Disagreement

  Before building the instrument, here are the genuine fault lines. These are not merely terminological; they represent incompatible commitments about truth, reference, and the world.

  1.  **Metaphysical vs. Epistemic Underdetermination:** Is there a fact of the matter that we cannot reach (Realism), or is there no further fact beyond the evidence (Anti-Realism)? *Disagreement:* Realists vs. Verificationists/Internal Realists.
  2.  **Intrinsic Nature vs. Structure:** Is the "stuff" of the world defined by what it *is* (intrinsic properties) or only by how it *relates* (structure)? *Disagreement:* Substance Ontologists vs. Structural Realists.
  3.  **Triviality of Structure (The Newman Problem):** If we claim only structure is known, is that claim empty (since any set of objects can satisfy any structure via redefinition of relations)? *Disagreement:* Structural Realists vs. Newman Skeptics.
  4.  **Determinacy of Reference:** Do theoretical terms latch onto unique objects in the world, or is mapping words to things underdetermined by all physical facts? *Disagreement:* Causal Theorists vs. Quineans.
  5.  **Source of Indeterminacy:** Is reference indeterminate because the *world* allows multiple mappings (Quine) or because *truth itself* is relative to a conceptual scheme (Putnam)? *Disagreement:* Quineans vs. Internal Realists.
  6.  **Meaningfulness of the Extra:** Is the unobservable ontology *cognitively meaningless* (Verificationism) or just *pragmatically equivalent* (Deflationism)? *Disagreement:* Logical Empiricists vs. Carnapians.
  7.  **Ramseyfication:** Does replacing theoretical terms with existentially quantified variables ("there exists an x such that...") solve the reference problem or merely hide it? *Disagreement:* Ramsey Realists vs. Critics.

  ---

  ### Diagnostic Instrument: The Underdetermination Decision Tree

  **Start Point:** You accept that two theories ($T_1$ and $T_2$) agree on every piece of accessible information—all observable predictions, all inputs and outputs, everything any conceivable measurement could turn up—yet they differ in what they say exists.

  **Node 1: The Fact of the Matter**
  Considering cases like **Other Minds** (a system behaves consciously but is it?) or **Mereology** (simples arranged tablewise vs. simples + tables):
  *Is there a unique, mind-independent fact of the matter about which ontology is true, even if we cannot access it?*
  *   **YES** → Go to Node 2 (Realist Path)
  *   **NO** → Go to Node 7 (Anti-Realist Path)

  **Node 2: Intrinsic Natures vs. Structure**
  Considering **Fields vs. Particles-with-dispositions**:
  *Is the difference between the theories about the intrinsic nature of the entities, or can the difference be stated purely in terms of causal/structural relations?*
  *   **Intrinsic Nature** → Go to Node 3
  *   **Purely Structural** → Go to Node 4

  **Node 3: Accessibility of Intrinsics**
  Considering **Other Minds** or hidden variables:
  *If the difference is about intrinsic natures, are those natures inaccessible in principle (even to a God's-eye view), or just in practice for humans?*
  *   **In Principle** → **Leaf A: Stubborn Metaphysical Realist**
  *   **In Practice** → (This collapses into standard realism; assume In Principle for this debate) → **Leaf A: Stubborn Metaphysical Realist**

  **Node 4: The Newman Check**
  Considering a **Permutation of Objects** (relabeling the underlying domain):
  *If you claim "the world has Structure S," does that claim rule out any possible worlds, or is it satisfied by any collection of objects of the right size?*
  *   **Rules out worlds (Non-trivial)** → **Leaf B: Epistemic Structural Realist**
  *   **Satisfied by any domain (Trivial)** → Go to Node 5

  **Node 5: Fixing the Structure**
  Considering the **Newman Objection**:
  *Since abstract structure is trivial, do you add causal constraints to fix the relations, or accept that the structural claim is empty?*
  *   **Add Causal Constraints** → **Leaf C: Causal Structural Realist**
  *   **Accept Emptiness** → **Leaf D: Newman-Flavoured Objection**

  **Node 6: Reference and Ramsey**
  Considering **Quine's Rabbit** or **Neural Network Weights**:
  *Even if the physics is real, do terms (like 'rabbit' or 'feature') latch onto unique objects? If not, does replacing terms with variables (Ramsey sentences) fix this?*
  *   **Reference Determinate** → (Standard Realism; return to Node 2)
  *   **Reference Indeterminate** → Go to Node 6b
      *   **Node 6b: Ramsey Rescue**
          *Does turning the theory into "There exist entities such that..." secure the reference?*
          *   **YES** → **Leaf E: Ramsey-Sentence Realist**
          *   **NO** → **Leaf F: Quinean Indeterminacy of Reference**

  **Node 7: Meaning vs. Pragmatics**
  Considering **Mereology** or **Verifiability**:
  *If there is no fact of the matter, is the ontological question cognitively meaningless (no verification possible) or just pragmatically undecidable?*
  *   **Meaningless** → **Leaf G: Verificationist / Strong Anti-Realist**
  *   **Pragmatically Undecidable** → Go to Node 8

  **Node 8: The Source of Relativity**
  Considering **Radical Translation** (Rabbit vs. Rabbit-stage):
  *Is the choice of ontology determined by our conceptual scheme/language, or is it a free pragmatic choice within a framework?*
  *   **Determined by Scheme** → **Leaf H: Putnam-Style Internal Realist**
  *   **Free Pragmatic Choice** → **Leaf I: Carnapian / Deflationary**

  ---

  ### Leaf Legend & Positions

  *   **Leaf A: Stubborn Metaphysical Realist.** (There is a truth about intrinsics/other minds; we just can't have it.)
  *   **Leaf B: Epistemic Structural Realist.** (We know the structure; intrinsic nature is unknowable but structure is non-trivial.)
  *   **Leaf C: Causal Structural Realist.** (Structure + Causal constraints fixes the Newman problem.)
  *   **Leaf D: Newman-Flavoured Objection.** (Structural claims are trivial without knowing relata; structuralism fails.)
  *   **Leaf E: Ramsey-Sentence Realist.** (Existential quantification saves reference without committing to specific terms.)
  *   **Leaf F: Quinean Indeterminacy of Reference.** (Physical facts fixed, but reference is inscrutable; 'rabbit' is underdetermined.)
  *   **Leaf G: Verificationist / Strong Anti-Realist.** (Unobservable ontology is meaningless noise.)
  *   **Leaf H: Putnam-Style Internal Realist.** (Truth is relative to conceptual scheme; no external ontology.)
  *   **Leaf I: Carnapian / Deflationary.** (Ontological questions are internal to frameworks; external questions are pseudo-problems.)

  ---

  ### Analysis of Branches and Separations

  **1. Empty or Nearly Empty Branches**
  *   **The "In Practice" Intrinsic Realist (Node 3):** This branch is nearly empty in the context of *underdetermination*. If the difference is only inaccessible in practice, it is not a case of radical underdetermination but merely a limitation of current technology. Philosophers who occupy this space usually migrate to **Leaf A** (admitting in-principle limits) or deny the distinction entirely. It is unattractive because it posits a "miracle" distinction that makes no causal difference.
  *   **The "Ramsey Realist" who denies Structuralism (Node 6b -> Leaf E without Node 4):** Few occupy this space. If you believe Ramsey sentences save reference, you typically accept that what is saved is the *structure* of the theory, not the specific names. Separating Ramsey Realism from Structural Realism is difficult because Ramsey sentences essentially describe the causal structure of the theory.

  **2. Suspicious Separations (Heavy Lifting)**
  *   **Leaf H (Putnam) vs. Leaf I (Carnap):** Node 8 does suspiciously heavy lifting here. The distinction between "ontology determined by scheme" (Putnam) and "ontology as free pragmatic choice" (Carnap) is notoriously thin. Both deny an external fact of the matter. The separation relies on whether one views the conceptual scheme as *constitutive* of truth (Putnam) or merely a *tool* for organizing experience (Carnap). In practice, these positions often collapse into one another during argument.
  *   **Leaf B (ESR) vs. Leaf C (Causal SR):** This separation hinges entirely on the interpretation of the Newman objection. If one believes causal relations can be specified without reverting to intrinsic natures, one lands on C. If one believes specifying causal relations *just is* specifying intrinsic natures, one is forced back to Node 2 or Leaf D. The tree treats them as distinct, but the boundary is porous.

  **3. The Newman Node (Node 4/5)**
  This is the most critical diagnostic. Most participants will instinctively answer "Non-trivial" (Leaf B) without realizing the force of the permutation argument. To reach **Leaf D**, one must accept that *any* domain of the right cardinality can model *any* structure if relations are redefined. To reach **Leaf C**, one must argue that *causal* relations are privileged and cannot be permuted without changing the physical facts. This is the hinge on which modern structural realism turns.

  **4. Quine vs. Putnam (Leaf F vs. Leaf H)**
  The tree separates these cleanly via Node 1. Quine (Leaf F) says "Yes, there is a fact of the matter about physics (the stimulus), but reference is indeterminate." Putnam (Leaf H) says "No, there is no fact of the matter about ontology independent of the scheme." This captures the crucial difference: Quine is a realist about the physical world but an anti-realist about reference; Putnam is an internal realist about both.
