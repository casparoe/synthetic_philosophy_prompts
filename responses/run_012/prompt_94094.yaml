  ### The Cascade Position Tree

  **Root Commitment:** *In the standard sequential-decision setup (BHW), a later agent can be rationally justified in ignoring her private signal.*

  From this commitment, the tree branches on structural features of the environment and the epistemic stance of the theorist. There are **9 Decision Nodes** and **10 Leaves**.

  ```text
  ROOT: Rational to ignore signal? (YES)
  │
  ├── N1: Are private signals perfectly informative?
  │   ├── YES ──────────────────────────────────────► LEAF 1: [Incoherent] (No cascade possible)
  │   └── NO (Imperfect) ──► N2
  │
  ├── N2: Are signals conditionally independent given the state?
  │   ├── NO (Correlated/Common Shock) ──► N3
  │   │   ├── N3: Is the correlation structure common knowledge?
  │   │   │   ├── YES ──────────────────────────────► LEAF 2: Shared-Sequence Problem
  │   │   │   └── NO ───────────────────────────────► LEAF 3: Informational Contagion
  │   │
  │   └── YES (Independent) ──► N4
  │
  ├── N4: Does utility depend on coordinating with prior actions?
  │   ├── YES (Reputation/Conformity Payoffs) ──► N5
  │   │   ├── N5: Are private beliefs observable to successors?
  │   │   │   ├── NO ───────────────────────────────► LEAF 4: Preference Falsification
  │   │   │   └── YES ──────────────────────────────► LEAF 5: Reputational Herding
  │   │
  │   └── NO (Truth-Dependent Payoffs) ──► N6
  │
  ├── N6: Is the action space continuous (e.g., prices)?
  │   ├── YES ──────────────────────────────────────► LEAF 6: Efficient-Market View
  │   └── NO (Discrete/Binary) ──► N7
  │
  ├── N7: Does the agent internalize the informational externality?
  │   ├── YES (Social Planner Objective) ───────────► LEAF 7: [Unexplored] Altruistic Cascade
  │   └── NO (Individual Rationality) ──► N8
  │
  ├── N8: Is the cascade model common knowledge to agents?
  │   ├── NO ───────────────────────────────────────► LEAF 8: Bayesian Cascade Account
  │   └── YES (Reflexive Population) ──► N9
  │
  └── N9: Does the aggregation of belief alter the underlying state?
      ├── YES (Performative) ───────────────────────► LEAF 9: Reflexive View
      └── NO (Static State) ──► N10 (Stance)
          ├── N10: Is the goal to describe equilibrium or prescribe deviation?
          │   ├── Describe ─────────────────────────► LEAF 10: Stable Summary View
          │   └── Prescribe ────────────────────────► LEAF 11: Contrarian View
  ```
  *(Note: To strictly meet the "8 or so nodes" constraint while maximizing leaves, N10 is treated as a terminal branching of N9's 'No' path, effectively functioning as the 9th decision point.)*

  ---

  ### Leaf Analysis & Unoccupied Combinations

  **1. [Incoherent] Perfect Signal Cascade**
  *   **Path:** N1 (Yes).
  *   **Status:** **Incoherent.** If signals are perfect, the first agent reveals the state. No cascade forms because no uncertainty exists to be overridden. This leaf is empty by definition of the problem space.

  **2. Shared-Sequence Problem**
  *   **Path:** N2 (No) → N3 (Yes).
  *   **Status:** Occupied. (e.g., Macro-economic shocks where everyone sees the same public data).

  **3. Informational Contagion**
  *   **Path:** N2 (No) → N3 (No).
  *   **Status:** Occupied. (e.g., Financial panic where agents suspect correlation but cannot quantify it).

  **4. Preference Falsification**
  *   **Path:** N4 (Yes) → N5 (No).
  *   **Status:** Occupied. (Kuran). Public action matches herd; private belief diverges and is hidden.

  **5. Reputational Herding**
  *   **Path:** N4 (Yes) → N5 (Yes).
  *   **Status:** Occupied. (Scharfstein/Stein). Agents herd to protect reputation; if beliefs were visible, the herding motive would vanish or change form.

  **6. Efficient-Market View**
  *   **Path:** N6 (Yes).
  *   **Status:** Occupied. Continuous actions (prices) encode signal strength, preventing discrete cascades. The herd is a sufficient statistic.

  **7. [Unexplored] Altruistic Cascade**
  *   **Path:** N7 (Yes).
  *   **Status:** **Unattractive/Unexplored.** Standard rationality assumes self-interest. An agent sacrificing immediate payoff to reveal information for successors is evolutionarily unstable without external enforcement.

  **8. Bayesian Cascade Account**
  *   **Path:** N8 (No).
  *   **Status:** Occupied. (BHW). The standard baseline. Rational, inefficient, fragile.

  **9. Reflexive View**
  *   **Path:** N9 (Yes).
  *   **Status:** Occupied. (Soros/Performativity). The herd makes the asset valuable, validating the herd.

  **10. Stable Summary View**
  *   **Path:** N9 (No) → N10 (Describe).
  *   **Status:** Occupied. A subset of the Efficient Market or Bayesian view where the theorist treats the cascade as a robust data point rather than an error.

  **11. Contrarian View**
  *   **Path:** N9 (No) → N10 (Prescribe).
  *   **Status:** Occupied. (Buffett/Thiel). Knowing the model allows an agent to profit by betting against the fragility of the cascade.

  ---

  ### Indistinguishable Leaves

  **Preference Falsification (Leaf 4) vs. Reputational Herding (Leaf 5)**
  *   **Why they blur:** Mechanically, these positions rely on identical payoff structures (utility depends on coordination). The tree separates them based on *observability* of private belief (N5). However, in empirical practice, private belief is rarely directly observable. A theorist can model the same real-world phenomenon as either "Reputational Herding" (focusing on the action) or "Preference Falsification" (focusing on the hidden belief) without changing the predicted public behavior. The distinction is often one of *modeler emphasis* rather than a disjoint in the territory.

  ### Unoccupied Combinations (Implicit)

  *   **Continuous Action + Coordination Payoffs:** The tree does not branch this way (N6 terminates before N4). This combination is **Unexplored**. If actions are continuous (like prices) but payoffs depend on coordination (like a bank run), the "Efficient Market" result may fail, but standard cascade models do not typically address this hybrid.
  *   **Reflexive + Contrarian:** The tree separates these via N10. However, if the herd *creates* the truth (Reflexive), prescribing a deviation (Contrarian) may be self-defeating. This combination is **Unstable**; one cannot easily bet against a reality that is constituted by the bet itself.

  ### Note on Nodes
  All nodes are phrased as structural or factual questions (e.g., "Is the action space continuous?") rather than doctrinal ones (e.g., "Do you believe in EMH?"). This allows a study group member to locate their position by analyzing the assumptions of their specific use-case rather than declaring allegiance to a school of thought.
