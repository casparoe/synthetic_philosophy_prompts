      *   *Critique:* Did I address Priya? Yes, by acknowledging her point on liberty but rejecting the conclusion that liberty implies no process.
      *   *Critique:* Did I address the Student? Yes, by clarifying we aren't acting *for* her, but for the Association.
      *   *Critique:* Is the "Mob" point addressed? Yes, by framing the process as a firewall.
      *   *Check:* The prompt asks to "settle whether what we'd be doing counts as punishment." I need to be definitive there. I will argue it is a *sanction* that carries punitive weight, triggering procedural fairness, even if it's not legal punishment.

  6.  **Final Polish:** Check the constraints. No reading list. Concrete recommendation. Bottom line. (Proceed to generate output).

  *(Self-Correction on the "Punishment" definition)*: I need to be careful not to get bogged down in semantics. Priya says "It's not punishment." User says "It is." I should argue that the *label* matters less than the *consequence*. If it functions as a sanction, it requires legitimacy. Legitimacy requires process.

  *(Final Plan)*:
