answer: |-
  This is a known and deeply frustrating structure in decision theory and practical philosophy. You have described it with perfect precision.

  The name you are looking for is **The Sorites Trap** (sometimes called the **Dynamic Sorites Problem** or **The Paradox of the Heap in Practical Reasoning**).

  In technical decision theory, it is analyzed under **Dynamic Choice** as a failure of **Separability** leading to **Global Suboptimality via Local Optimization**.

  Here is the carving you asked for. I will distinguish it from the concepts you ruled out, explain the mechanism that makes it happen, assess whether it is a rational failure, and tell you what can be done about it.

  ### 1. The Carving: What it is and isn't

  You correctly identified that the usual suspects don't fit. Here is the precise boundary:

  *   **It is not a Money Pump.** A money pump requires *cyclic* preferences (A > B > C > A). You have *acyclic* preferences. You never return to a previous state; you just drift down a slope. No one is extracting value from you; you are giving it away freely in exchange for local relief.
  *   **It is not Weakness of Will (Akrasia).** In akrasia, you judge action X to be best, but do Y. Here, you judge action X to be best, and *do X*. You are fully aligned with every step. The conflict is not between judgment and action, but between *local judgment* and *global judgment*.
  *   **It is not Preference Drift.** You say your preferences haven't changed. You wanted a manageable job then, and you want a manageable job now. The *situation* changed, not the *metric*.
  *   **It is not the Tragedy of the Commons.** That requires multiple agents defecting against a group. Here, you are the defector and the victim, but you are a single temporal entity. It is a **Intrapersonal Tragedy of the Commons** across time-slices.
  *   **It is not a Mistake about Future Wants.** You aren't surprised that you dislike the end state. You are surprised that *rational steps* led you there.

  **The Specific Mechanism:**
  The trap relies on three conditions meeting simultaneously:
  1.  **Vague Predicates:** There is no sharp line between "reasonable workload" and "unreasonable workload" (The Sorites/Vagueness condition).
  2.  **Separability:** You treat each decision as independent of the past and future. You evaluate the choice *at the node*, not the choice *as part of a path*.
  3.  **Non-Linear Utility:** The cost of the 50th hour of overtime is much higher than the 1st hour, but the "price" offered (the small win) remains constant.

  ### 2. Is this a failure of rationality?

  This is the contentious part. According to standard decision theory (Savage, Jeffrey), **no, it is not a failure of rationality.**

  Standard theory relies on an axiom called **Separability** (or the **Principle of Dynamic Consistency**). This axiom states: *When you are at a choice point, you should ignore the sunk costs and the path taken to get there. You should only maximize utility from this moment forward.*

  If you follow Separability, you *must* say yes to the small request. Why? Because at this specific moment, saying yes yields +1 utility (small win) and -0.1 utility (small cost). The fact that saying yes 50 times ago contributed to a bad situation is "water under the bridge." To refuse the current small win because of past steps is, by standard definitions, **irrational** (specifically, it violates Independence of Irrelevant Alternatives).

  **However**, many philosophers (most notably **Edward McClennen** in *Rationality and Dynamic Choice* and **Michael Bratman** in *Intention, Plans, and Practical Reason*) argue that this reveals a flaw in standard theory, not in you.

  They argue that true rationality requires **Resolute Choice**.
  *   **Myopic Choice:** Optimize for now. (Gets you trapped).
  *   **Sophisticated Choice:** Predict that your future self will optimize for then, and plan accordingly. (Still gets you trapped in a Sorites sequence, because your future self will *still* see a local win).
  *   **Resolute Choice:** You adopt a plan at the start, and you stick to it *even if* a deviation looks locally optimal later. You treat your past commitment as a reason for action now.

  So, is it a failure?
  *   By **Static/Myopic** standards: No. You are perfectly rational.
  *   By **Dynamic/Planning** standards: Yes. You failed to bind your agency across time.

  ### 3. Why the "Obvious Fix" feels wrong

  You wrote: *"the obvious fix — decide now where you want to end up and refuse the small wins along the way — means turning down things that are genuinely better at the time."*

  This is the heart of the pain. It *feels* like you are turning down a genuine win.
  The philosophical counter-argument is this: **The win is not genuine.**

  It *looks* genuine because you are evaluating it using **Marginal Utility** (What does this one step cost?) instead of **Total Utility** (What does this policy cost?).
  Because the predicate is vague ("Is this *too* much work?"), you cannot see the threshold. But the threshold exists.
  When you say "yes" to step 42, you aren't just buying step 42. You are buying **Step 42 + The Precedent that Step 42 is Acceptable.**

  The cost of the precedent is hidden. It doesn't show up on the ledger until step 50.
  So, when you refuse the small win, you are not turning down something "genuinely better." You are turning down something that is **locally positive but globally negative**.

  The error is in the **Unit of Agency**.
  *   You are acting as an **Act-Agent** (choosing individual moves).
  *   You need to act as a **Rule-Agent** (choosing policies).

  If you choose the policy "I never work more than 40 hours," then working 40.5 hours is *not* a win. It is a violation of your optimal policy. The "win" was an illusion created by narrowing the frame too tightly.

  ### 4. What can you actually do about it?

  Since you cannot rely on your future self to "see the trap" (because the trap is invisible at the node), you must use **Pre-commitment Strategies** that bypass the node evaluation entirely.

  **1. Schelling Fences (Hard Constraints)**
  Thomas Schelling called this "self-binding." You cannot rely on willpower or rational evaluation at the moment of choice, because the rational evaluation *will* tell you to step over the line.
  *   *Example:* Don't decide "I'll say no if it feels like too much." (Too vague).
  *   *Fix:* "I do not check email after 6 PM." The technical barrier removes the choice node. If there is no node, there is no local optimization.

  **2. Change the Unit of Evaluation**
  Stop asking "Is this single request reasonable?" Start asking "Is this *rate* of requests sustainable?"
  *   When a request comes in, do not evaluate the request. Evaluate the **trajectory**.
  *   "If I say yes to this, and one like it comes every week, where am I in 6 months?"
  *   This forces the hidden cumulative cost into the local calculation.

  **3. Resolute Choice (The "Because I Said So" Method)**
  This is the hardest but most philosophically robust. You must grant your **Past Self** authority over your **Present Self**.
  *   When the small win appears, you must say: "I know this looks like a win. I know it makes things slightly better right now. But I am refusing it because my Past Self made a plan, and violating that plan destroys my ability to make plans."
  *   You are not defending the *outcome* of the refusal; you are defending the *integrity of the planning agent*.

  ### Summary

  *   **Name:** The Sorites Trap (in Dynamic Choice).
  *   **Technical Cause:** Myopic Optimization + Separability Axiom + Vague Predicates.
  *   **Rationality:** It is a failure of **Dynamic Rationality** (planning), not **Static Rationality** (choice). Standard theory says you're fine; Planning theory says you're broken.
  *   **Solution:** You must stop acting as a series of time-slices optimizing for the present and start acting as a **single temporally extended agent** who uses **Rules** rather than **Acts**. You must accept that "locally better" is a lie when the landscape is non-linear.

  You are not being irrational. You are being **locally rational in a globally hostile environment.** The fix is to stop trusting the local view.
