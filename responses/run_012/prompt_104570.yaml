answer: |-
  Epistemicism is the correct theory of vagueness, and supervaluationism is a failed attempt to avoid its consequences. Supervaluationism promises to preserve classical logic without accepting sharp boundaries in the world or in language. It fails because it cannot coherently define the set of "admissible precisifications" without either reintroducing sharp boundaries at the meta-level or rendering its own notion of truth vague. Epistemicism, by contrast, accepts sharp boundaries as a consequence of bivalence and attributes our inability to locate them to ignorance rather than ontology. This makes epistemicism the more robust and honest theory.

  To see why supervaluationism collapses, consider the predicate "roomy enough to be a comfortable study." This is not a one-dimensional sorites like "tall." It involves trade-offs between floor area, ceiling height, and daylight. A room with 150 square feet might be comfortable with low light, while a 100-square-foot room requires high ceilings and a skylight. A supervaluationist handles this by considering all admissible precisifications of "roomy enough." A precisification might stipulate: "At least 120 square feet AND at least 8 feet ceiling height." A sentence is super-true if it is true on every admissible precisification.

  The theory stands or falls on the coherence of "admissible." We face a dilemma regarding the boundary of this set. Either there is a sharp boundary between admissible and inadmissible precisifications, or there is not.

  If there is a sharp boundary, supervaluationism contradicts its own motivation. The theory was introduced to avoid the counterintuitive result that there is a specific square footage where a room suddenly becomes "roomy enough." But if the set of admissible precisifications is sharply defined, there is a specific precisification that is admissible while a minutely different one is not. For instance, a precisification requiring 120.0 square feet is admissible, but one requiring 120.1 is inadmissible. The vagueness has not vanished; it has merely been relocated from the object language to the meta-language. The theory posits sharp boundaries after all, merely hiding them one level up.

  If there is no sharp boundary, then the set of admissible precisifications is itself vague. Consequently, the notion of "super-truth" becomes vague. If it is vague whether a precisification is admissible, it is vague whether a sentence is true on all admissible precisifications. The theory then fails to deliver the determinate verdicts it was introduced to secure. It cannot guarantee the law of excluded middle or classical inference rules if the truth relation itself is subject to vagueness. This leads to higher-order vagueness problems that supervaluationism was designed to solve. The theory becomes unstable, lacking the logical rigor it claims to provide.

  Epistemicism faces no such dilemma. It asserts that there is a fact of the matter regarding whether a room is roomy enough, determined by the actual extension of the predicate. There is a sharp boundary in the extension of "roomy enough," fixed by usage and causal history, even if we cannot know it. When asked where the boundary lies for admissible interpretations, the epistemicist answers that there is only one true interpretation—the actual extension. There is no set of admissible precisifications to draw boundaries around. The epistemicist accepts sharp boundaries without embarrassment because they never claimed boundaries were absent, only that they are unknowable. This consistency gives epistemicism a structural advantage over supervaluationism.

  The strongest supervaluationist reply is that admissible precisifications are constrained by meaning and usage, so no arbitrary boundary needs to be drawn. They argue that usage carves out a range of acceptable precisifications naturally, without a sharp line between what fits usage and what does not. This attempts to escape the dilemma by denying the presupposition that constraints must be sharp.

  This reply fails because it either relocates the boundary or begs the question. If usage constrains precisifications, does it do so sharply or vaguely? If usage constrains them sharply, then there is a sharp boundary between meanings that are consistent with usage and those that are not. We are back to the first horn of the dilemma: sharp boundaries exist at the level of semantic constraint. The supervaluationist has simply become an epistemicist about semantic constraints.

  If usage constrains them vaguely, then we are back to the second horn. The set of precisifications consistent with usage is vague, so super-truth is vague. The supervaluationist cannot have it both ways. They cannot claim that usage constrains precisifications enough to generate classical logic but not so much as to create sharp boundaries. To generate classical logic, the set of precisifications must be definite enough to yield a determinate truth value. If it is definite enough to do that, it has a sharp boundary. To assert that meaning constrains without drawing a line is to beg the question against the epistemicist claim that meaning *does* draw a line, we just cannot see it.

  Supervaluationism is motivated by the intuition that sharp boundaries are implausible. But this intuition is purchased at the cost of logical coherence. The theory attempts to retain classical logic while denying bivalence at the object level, but it smuggles bivalence back in at the meta-level to define admissibility. Epistemicism is the more humane theory not because it feels better, but because it is intellectually honest. It acknowledges that our language functions to carve the world at its joints, even if our access to those joints is limited. Supervaluationism tries to have its cake and eat it too, promising precision without boundaries. The dilemma of admissible precisifications shows this is impossible. We must choose between vague logic or sharp boundaries. Epistemicism chooses the latter and explains our uncertainty. Supervaluationism chooses neither and explains nothing.
