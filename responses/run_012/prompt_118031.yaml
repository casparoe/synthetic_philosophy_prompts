answer: |-
  # The Cybernetic Criterion: Why Control Grounds Composition

  The Special Composition Question (SCQ) asks: under what conditions do some things compose a further thing? When do many become one? The history of metaphysics offers a trilemma of unsatisfying answers. Nihilism says composition never happens (there are no tables, only table-wise arranged simples). Universalism says it always happens (there is an object composed of your left shoe and the Moon). Restricted views say it happens sometimes, but struggle to draw the line without arbitrariness.

  The view proposed here—that composition is a matter of control, specifically a single feedback loop where parts regulate the whole—is a Restricted View. Let's call it the *Cybernetic Criterion*. It suggests that $xs$ compose $y$ if and only if the $xs$ are bound into a self-correcting regulatory system. A bacterium qualifies; a heap of sand does not; a corporation is a borderline case depending on its internal integration.

  Critics will charge that this is merely a relabeling of "life" or "function," inheriting the same vagueness it seeks to resolve. They will argue it fails to handle the metaphysical nightmares: the Problem of the Many, vague boundaries, and the suspicion that any restriction is just a line drawn for human convenience. However, a rigorous defense shows that the Cybernetic Criterion is not only defensible but superior to its rivals. It succeeds precisely because it stops looking for objects in *stuff* and starts looking for them in *causal power*. It solves the nightmares not by sharpening the boundaries, but by rendering them ontologically secondary.

  ### The Landscape of Composition

  To evaluate the Cybernetic Criterion, we must place it against the standard contenders. Nihilism is logically parsimonious but phenomenologically bankrupt. It denies the existence of the very things (organisms, machines, societies) that seem to do the most causal work in the universe. Universalism avoids arbitrariness by accepting everything, but at the cost of populating the world with "trivial objects" (like the fusion of a proton and the Eiffel Tower) that have no causal unity. It grants existence without significance.

  Restricted views attempt to capture the intuition that some collections are "tighter" than others. The traditional restricted view relies on spatial contact or fastening. But this fails: a glued-together sculpture is an object, but so is a scattered ecosystem, while a glued-together pile of dust is not. The Cybernetic Criterion improves on this by shifting the metric from spatial proximity to causal integration.

  Is this just "life" in disguise? No. A thermostat involves composition under this view (sensor, heater, controller), as does a corporation (departments feeding data to management to adjust output). It is not biological life that matters, but *cybernetic life*—the capacity for homeostasis. Is it just "function"? Only if one admits that function is the only reason we posit objects in the first place. If a collection of parts does not act as a unit, calling it a unit is a linguistic error, not a metaphysical insight.

  ### The Nightmares of Metaphysics

  The true test of the Cybernetic Criterion lies in the "nightmares" that usually destroy restricted views: the Problem of the Many, vague boundaries, and the charge of convenience.

  **The Problem of the Many**
  This problem arises when there seem to be many equally good candidates for a single object. Consider a cloud. There are billions of water droplets. Some are clearly part of the cloud, some are clearly outside, but there is a penumbra of droplets where it is indeterminate whether they are in or out. If we pick one set of droplets, there is another set slightly different that is equally qualified. Thus, there are thousands of overlapping cloud-candidates. Which one is the cloud? Universalism says all of them (absurd). Nihilism says none (counterintuitive).

  The Cybernetic Criterion dissolves this problem by rejecting the premise. The Problem of the Many assumes that objects are defined by their *material boundaries*. If an object is just a collection of stuff, then slight variations in stuff create new objects. But under the Cybernetic Criterion, an object is defined by its *causal boundary*.

  Does a cloud have a feedback loop? Generally, no. It is a passive accumulation. Therefore, under this view, a cloud is not a composite object; it is a heap. The Problem of the Many vanishes because the cloud was never an object to begin with. But what about a cat? A cat loses hairs and gains cells. There are many material candidates for "the cat." However, there is only one *control loop*. The regulatory system that maintains the cat's homeostasis persists despite the turnover of matter. The "many" material candidates are merely transient fuel for the single, enduring process. The Criterion solves the Problem of the Many by prioritizing the stability of the loop over the stability of the parts. There are not many cats; there is one control system temporarily realized by many different atomic arrangements.

  **Vague Boundaries**
  Critics argue that "control" is vague. How tight must the feedback loop be? When does a group of people become a corporation? When does a parasite become part of the host? If the criterion is vague, the ontology is vague.

  This charge assumes that vagueness is a defect. It is not. The demand for sharp boundaries is a legacy of classical logic imposed on a gradient reality. In nature, integration is a matter of degree. A virus is on the boundary of life; a symbiotic gut bacterium is on the boundary of the self. The Cybernetic Criterion accepts this ontic vagueness. It does not claim there is a precise nanosecond when a collection becomes an object. It claims that as causal integration increases, ontological status increases.

  This is not a failure of the theory; it is an accurate map of the territory. To demand a sharp line is to demand that reality conform to binary logic. By accepting vague boundaries, the Cybernetic Criterion avoids the arbitrariness of drawing a fake line (e.g., "objects must be within 1mm of each other"). It admits that some things are *more* composed than others. A bacterium is more of an object than a slime mold, which is more of an object than a cloud. This gradation is a feature, allowing the metaphysics to match the physics of complex systems.

  **The Suspicion of Convenience**
  Finally, there is the suspicion that restricted composition is just pragmatic. We say a corporation exists because it's useful for law and taxes, not because it's metaphysically real. If composition depends on control, isn't "control" just a human interest?

  This confuses *epistemic utility* with *ontological ground*. We notice control loops because they are useful to us, but the loops exist independently of our notice. A bacterium regulated itself before humans evolved to name it. The causal power of the whole—the ability of the system to constrain the behavior of its parts to ensure survival—is a physical fact, not a linguistic convention.

  If a heap of sand cannot correct an error (e.g., a grain blowing away), it lacks the causal unity of a bacterium that repairs its DNA. This difference is not in our heads; it is in the causal structure of the universe. Therefore, the restriction is not for convenience; it is for *causal fidelity*. We restrict composition to control loops because only control loops act as single causes. If the parts do not regulate each other, the "whole" does nothing that the parts do not already do independently. To posit an object where there is no emergent causal control is to multiply entities without necessity.

  ### Conclusion

  The Cybernetic Criterion is the correct answer to the Special Composition Question. It must be defended not as a perfect, sharp-edged logical system, but as the only metaphysics that aligns existence with causal efficacy.

  Nihilism fails because it denies the causal unity we observe in organisms. Universalism fails because it grants existence to causal junk. The Cybernetic Criterion succeeds because it identifies *being* with *doing*. To be a composite object is to act as one. This requires a mechanism of unity, and the only known physical mechanism that unifies disparate parts into a single causal agent is the feedback loop.

  Does this view inherit arbitrariness? Only if one insists that reality must be crisp. If we accept that the universe is made of processes rather than static things, then vagueness is inevitable. But this is not a flaw in the Cybernetic Criterion; it is a flaw in the demand for static precision. The view handles the Problem of the Many by showing that material overlap is irrelevant to functional unity. It handles the charge of convenience by grounding objecthood in mind-independent causal power.

  Therefore, we should accept the view: composition is control. A thing exists when it holds itself together against entropy. Anything less is not an object, but a crowd. Anything more is a mystery. But the crowd and the mystery are not the business of metaphysics; the business of metaphysics is the thing that acts. And only the controlled act as one.
