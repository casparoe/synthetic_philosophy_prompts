      *   *Section 7: Alternative Metaphor.* Propose "The City" or "The Language." Let's go with **The City**. It fits the "landscape" vibe the user mentioned.

      *(Self-Correction during drafting)*: Wait, the user is a fiction writer. They care about the *texture* of the metaphor. I need to be precise about the *narrative* implications. The Monopoly metaphor tells a story of inevitable collapse. The Campaigner wants a story of arbitrary rules. These conflict.
      *Alternative Metaphor:* **A Language.** Rules of grammar are arbitrary but constrain expression. You can introduce new words (UBI). It's not zero-sum. Everyone can speak at once.
      *Actually, let's look at the "Weather/Landscape" line in the prompt.* The user is writing about money as weather. The Campaigner wants Money as Rules.
      *Best Alternative:* **The Operating System.** Code is written (rules), hardware is finite (resources), but applications (lives) can vary infinitely. UBI is a background process allocation.
