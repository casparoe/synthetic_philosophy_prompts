      *Re-evaluating the Bank:* The Monopoly bank *cannot* run out. In reality, central banks can run out of *credibility* or cause inflation. The Monopoly model hides the constraint of *real resources*, not money. This is a critical distinction for UBI (inflation risk).

      *Re-evaluating the History:* Magie's game shows that *private land ownership* leads to monopoly. The Campaigner uses Monopoly to say *rules* lead to outcomes. This aligns, BUT the Campaigner treats Monopoly as the *status quo* model. Magie treated it as a *warning*. If the Campaigner says "Economy = Monopoly," she is admitting the Economy is designed to create one winner. That undermines the idea that UBI just "fixes" it gently. It implies the whole game needs tossing.

