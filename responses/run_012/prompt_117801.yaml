  2.  **Deconstruct the Monopoly Metaphor:**

      *   *The Campaigner's Goal:* Deflate the "naturalness" of the market. Argue for UBI as a rule change.
      *   *The Metaphor's Strength:* Rules *are* written. Property rights *are* legal constructs.
      *   *The Metaphor's Weakness:* Monopoly is a closed system, zero-sum, designed to end in monopoly. The real economy is (ideally) positive-sum, open, infinite, and doesn't *have* to end in one winner.

  3.  **Drafting the Audit Table:**
      *   Need to map: Players, Dice, Board, Properties, Rents, Bank, Chance, Rulebook, Endgame.
      *   *Players:* Economic agents (individuals/firms).
      *   *Dice:* Luck/uncertainty (market volatility, birth lottery).
      *   *Board:* The market/legal jurisdiction (finite?).
      *   *Properties:* Assets/Capital/Land.
      *   *Rents:* Yield/Profit/Interest.
      *   *Bank:* Central Bank/Treasury.
      *   *Chance:* Exogenous shocks.
      *   *Rulebook:* Laws/Regulations.
      *   *Endgame:* Bankruptcy/Wealth concentration.

  4.  **Analyzing the Breaks (Disanalogies):**
      *   *Zero-Sum vs. Positive-Sum:* Monopoly ends when one wins. Economy can grow for everyone. **(Matters)**
      *   *Finite Board vs. Infinite Innovation:* Monopoly board is static. Economy creates new "spaces." **(Matters)**
      *   *Equal Start vs. Inheritance:* Monopoly starts equal. Reality starts unequal. **(Matters for UBI specifically)**
      *   *The Bank:* Monopoly bank is infinite/passive. Central banks are constrained (inflation, politics) but can create money. **(Crucial)**
      *   *The Goal:* Monopoly goal is ruin others. Economic goal is usually utility/profit, not necessarily ruin. **(Matters)**

  5.  **Evaluating the Campaigner's Conclusion:**
      *   *Conclusion:* Rules are arbitrary, so change them (UBI).
      *   *Does it survive?* Partially. Yes, rules are made. But Monopoly implies the rules *necessarily* lead to one winner. If the real economy *doesn't* necessarily do that, then UBI isn't just a "house rule" to make it nicer; it might be a fundamental structural shift to prevent the Monopoly outcome.
      *   *The Bank:* The Monopoly bank is a pure fiat issuer with no solvency risk. This actually *supports* MMT (Modern Monetary Theory) views often aligned with UBI, but it hides the inflation constraint. It's a dangerous simplification.
      *   *The History:* *The Landlord's Game* was designed to show land monopoly is bad. Using it to say "monopoly is natural" is ironic. Using it to say "rules cause monopoly" supports the campaigner *if* she admits the rules are bad. But she treats Monopoly as the *neutral* baseline. That's the flaw. Monopoly is the *problem* simulation, not the *system* simulation.

