answer: |-
  Here are ten questions tailored for your audience. They're designed to be punchy enough for Discord voice chat but sharp enough to prevent her from just lecturing.

  ### 1. The Number/Structure Gap
  You draw a hard line between "big numbers" and "structural stakes," saying the latter survive your usability floor even with absurd odds. But isn't "the existence of the future" just a utility variable set to infinity? If the math is identical, why does the label "structural" let it bypass the floor when a massive lottery payoff doesn't?

  ### 2. Follow-up: The Complexity Trap
  *(Use this if she says structural stakes change the "state space" or "game rules" rather than just the payoff.)*
  **Likely Answer:** She'll argue that structural changes alter the domain of decision-making itself, making them categorically different from magnitude changes.
  **Follow-up:** If structural stakes change the domain, doesn't that make the probability *harder* to estimate, not easier? Why does adding complexity grant immunity from the usability floor rather than triggering it?

  ### 3. The Paralysis Objection
  If expected value maximization is the only rule, and there's always a hypothetical bet with higher upside and worse odds, doesn't your theory demand we never act? Why would we ever stop searching for a better bet to justify our time?

  ### 4. Follow-up: The Cost of Filtering
  *(Use this if she says the usability floor stops the search because low-probability bets are filtered out.)*
  **Likely Answer:** She'll claim the floor acts as a stopping rule; once odds are too vague, you discard the bet and move on.
  **Follow-up:** But determining if a bet falls below the floor requires analysis. Isn't that analysis itself subject to the paralysis problem? How do you know when to stop analyzing whether to stop analyzing?

  ### 5. The Mugging Case
  In the standard Pascal's Mugging case, a stranger offers an astronomically large payoff for a tiny stake. You say we can ignore this. Is that because the probability is too low, or because the stranger lacks the mechanism to deliver?

  ### 6. Follow-up: The Causal Chain
  *(Use this if she says the mugger lacks a causal model or credible mechanism.)*
  **Likely Answer:** She'll argue the mugger's claim is ungrounded because there's no causal model connecting the payment to the payoff.
  **Follow-up:** Longtermism often relies on causal chains just as long and speculative as the mugger's promise. What specific feature of the longtermist causal model lets it pass the floor when the mugger fails? Is it just that we like the story better?

  ### 7. The Engineering Analogy
  I'm an engineer. Sometimes we find a one-in-a-billion bug that could wipe production. We usually ignore it unless we understand the mechanism, even if the payoff of fixing it is huge. Is your floor actually about probability precision, or is it just a proxy for "do I understand the mechanism well enough to model it"?

  ### 8. The "Arbitrary Cap" Turn
  You reject utility caps because they're picked to dodge conclusions rather than discovered in reality. But your usability floor is set at "a couple orders of magnitude." Why isn't that just a probability cap tuned specifically to save longtermism from the mugging objection?

  ### 9. Operationalizing the Floor
  Who decides if a probability is estimable? Is it subjective to the agent, or is there a fact of the matter? If it's subjective, doesn't that let me justify ignoring any obligation I don't like by claiming the probabilities are too vague?

  ### 10. The Closer
  What evidence or argument would actually move you on the floor itself? If you can nudge the threshold whenever it gets inconvenient, isn't it just a dial rather than a principle?
