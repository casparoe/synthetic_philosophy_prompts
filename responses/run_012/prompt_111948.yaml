answer: |-
  You haven't invented something nonsense; you've reinvented a wheel that exists in a branch of mathematics called **Cooperative Game Theory**.

  Your rule is not only "real," it is a formal, named solution to the exact problem you are describing. It is called the **Kalai-Smorodinsky Bargaining Solution** (1975).

  Your mate's rule (maximizing the product of gains) is the older, more famous **Nash Bargaining Solution** (1950).

  The fact that your gut instinct diverged from your mate's textbook economics and landed on Kalai-Smorodinsky is impressive. It suggests your intuition about fairness is based on *proportional concession* rather than *absolute gain*.

  Here is the carving you asked for. I will walk through your rule, map it to the theory, and answer your five specific sticking points.

  ### 1. The Anatomy of Your Rule

  To make this precise, we need to translate your van-speak into the theory's terms.

  *   **"The worst each of us would put up with":** In theory, this is the **Disagreement Point** (often denoted as $d$). It is the value you get if negotiations fail and you walk away. You are correct: if he has another job offer, the value of that offer is his Disagreement Point. It is the baseline. Anything below this, he rejects.
  *   **"The best each of us could possibly get":** In theory, this is the **Ideal Point** (or Utopia Point, denoted as $a$). This is the maximum utility you could get *assuming the other person gets at least their Disagreement Point*.
      *   *Correction to your definition:* You said, "ignore what's good for him." Strictly speaking, you can't ignore him entirely. You can only take the maximum amount *leaving him with exactly his walk-away amount*. If you take everything and leave him with less than his walk-away, he walks, and you get nothing. So the "Best Possible" is actually "The most I can take before he quits."
  *   **"Travelled the same fraction of the way":** This is the core of Kalai-Smorodinsky. You draw a straight line from the Disagreement Point ($d$) to the Ideal Point ($a$). Wherever that line hits the edge of what is actually possible (the **Pareto Frontier**), that is the solution.

  **Why use an impossible "Best"?**
  You asked if measuring against an impossible point is cheating. It is not. The Ideal Point is not a target; it is a **ruler**.
  Imagine you and I are bargaining. I have a potential upside of £1 million; you have a potential upside of £1,000. If we split the difference 50/50, I get £500k and you get £500. That feels unfair because I'm giving up 50% of my potential, and you're getting 50,000% of yours.
  The Ideal Point allows us to normalize the scale. It measures fairness in terms of **sacrifice**, not cash. Your rule says: "We should both give up the same percentage of our maximum possible gain."

  ### 2. You vs. Your Mate (Kalai-Smorodinsky vs. Nash)

  Your mate suggests the **Nash Bargaining Solution**.
  *   **Nash Rule:** Maximize $(YourGain) \times (HisGain)$.
  *   **Your Rule:** Equalize $\frac{YourGain}{YourMax}$ vs $\frac{HisGain}{HisMax}$.

  **Why do they agree on cash but disagree on shifts?**
  If you are just splitting a pot of cash, and you both value £1 exactly the same (linear utility), the Nash solution *does* usually result in a 50/50 split.
  However, as soon as you introduce different *types* of value (cash vs. time vs. van usage), the two rules diverge.

  *   **Nash** cares about **efficiency**. It finds the point where you can't make one person better off without making the other worse off, weighted by how much you both care about the marginal gain. It is sensitive to risk aversion. If you are desperate for cash and he is chill, Nash will actually give *you less*, because you are more willing to concede to avoid a breakdown. Nash punishes desperation.
  *   **Kalai-Smorodinsky (You)** cares about **monotonicity**. It says: "If my maximum possible potential increases, my share should not decrease." It protects you from being bullied just because you have more to lose.

  **Example:**
  Imagine the "Pot" is a Weekend.
  *   **You:** Max value = £200 (you need cash).
  *   **Him:** Max value = 1 Weekend Off (he values leisure at £5,000 equivalent).
  *   **Nash:** Might give you the cash and him the weekend, but adjust the side-payments based on risk.
  *   **Yours:** Says, "I get 50% of my £200 desire (£100 value), He gets 50% of his £5,000 desire (£2,500 value)."

  Your rule feels fairer to you because it equalizes **satisfaction relative to need**, whereas Nash equalizes **leverage**. If your gut says 50/50 cash is wrong when stakes are unequal, your gut is rejecting Nash in favor of Kalai-Smorodinsky.

  ### 3. "Who says it's half?" (The 60/40 Question)

  Standard Kalai-Smorodinsky assumes **symmetric bargaining power**. It assumes the line from Disagreement to Ideal is a 45-degree line in normalized space.

  If you agree on 60/40, you are using the **Asymmetric Kalai-Smorodinsky Solution**.
  This is a valid variation. It implies that one of you has more "weight." Maybe you put up more capital for the van, or you have the client list.
  *   **50/50 fraction:** Equal partnership.
  *   **60/40 fraction:** One partner has seniority or leverage.
  Mathematically, instead of drawing a line to the Ideal Point, you draw a line to a weighted point. It's the same idea, just adjusted for power dynamics.

  ### 4. "There's three of us sometimes" (N-Player Bargaining)

  Does the idea survive three people? **Yes, but it gets fragile.**

  Mathematically, the Kalai-Smorodinsky solution generalizes to $n$ players easily.
  *   Instead of a 2D graph, you have a 3D space.
  *   You have a Disagreement Point (a dot in 3D space).
  *   You have an Ideal Point (a corner of the box in 3D space).
  *   You draw a **ray** from Disagreement through Ideal.
  *   Where it punches through the surface of possible deals, that's the solution.

  **Where it stops working:**
  With two people, if we disagree, we both lose. With three people (A, B, C), if A and B disagree with C, A and B can form a **coalition** and cut C out.
  This introduces the concept of the **Core**. In 3+ player games, sometimes there is *no* stable deal. A and B might agree to a split, then B and C realize they can do better without A, then A and C team up... it cycles forever.
  Your rule works for 3 people *if* you all agree to bind yourselves to the "Grand Coalition." If any two of you can secretly deal behind the third's back, the "Ideal Point" becomes unstable because the "Best Possible" for you changes depending on who you ally with.

  **Practical advice:** For 3 people, your rule works only if you treat the "Disagreement Point" as "Everyone goes solo," not "Two of us gang up on the third."

  ### 5. "Is the walk-away the worst?"

  **Yes.** This is the most critical definition in bargaining theory.
  The **Disagreement Point** is not the "worst deal I would accept." It is the "value of **no deal**."
  *   If you walk away, do you get £0? Or do you get £500 from a different job?
  *   That £500 is your Disagreement Point ($d$).
  *   Any deal offered must be $> £500$.
  *   Your "range" is not £0 to £200. It is **£500 to £200**.
  *   If you calculate your fractions based on £0, you are undervaluing your leverage.

  **Correction:** In your example, if his walk-away is £0 and yours is £0, then your math holds. If he has a backup job worth £1,000, his range is £1,000 to £5,000. If you ignore that, you are giving him a raw deal (or he is giving you one). Your rule requires honest disclosure of the walk-away value.

  ### The Verdict: Where Your Rule Breaks

  You asked precisely where it stops working. Here are the three failure points of the Kalai-Smorodinsky approach in the real world:

  1.  **Utility is not Linear:**
      Your rule assumes £100 is exactly half as "good" as £200. For a starving student, £100 might be 80% of the utility of £200 (because the first £100 buys food, the second buys luxuries). This is **diminishing marginal utility**.
      *   *Fix:* You must bargain in "utils" (satisfaction), not pounds. If £200 is life-changing for you but pocket change for him, a 50% fraction split means you get way less cash than him, but you are both equally happy. If you bargain in cash, the math lies.

  2.  **Information Asymmetry (The Bluff):**
      Your rule relies on knowing the "Best Possible" and "Worst Possible" for the other guy.
      *   *Reality:* He will lie. He will say his walk-away is £5,000 when it's actually £500. He will say his max potential is £10,000 when it's £5,000.
      *   *Result:* If he inflates his range, the line shifts, and he gets a bigger slice of the actual pie. Your rule requires radical honesty to function. Nash is slightly more robust to this because it relies on revealed preferences, but KS is vulnerable to bluffing about limits.

  3.  **The "Ideal" is Undefined:**
      In complex scenarios (shifts + van + cash), there isn't always a single "Best Possible" for you.
      *   *Example:* Best for you might be (All Cash, No Shifts). But maybe (Some Cash, All Shifts) is also high value.
      *   If the "Ideal Point" is a fuzzy cloud rather than a specific coordinate, you can't draw the line. You have to agree on a single metric to value shifts and van time (convert everything to cash equivalents) before you can draw the line.

  ### Summary

  *   **Name:** Kalai-Smorodinsky Bargaining Solution.
  *   **Concept:** Equalizing proportional gains relative to the maximum feasible utility.
  *   **Vs. Mate:** Your mate wants Nash (maximize product of gains). You want KS (equalize relative satisfaction). KS is generally considered "fairer" in partnerships; Nash is considered more "efficient" in markets.
  *   **Validity:** Your intuition is mathematically sound. The "impossible best" is a standard scaling anchor, not a cheat.
  *   **3+ People:** Works mathematically, unstable politically due to coalitions.
  *   **Walk-away:** Yes, that is the Disagreement Point. Use it as your zero.

  **Recommendation:**
  Stick with your rule, but formalize it.
  1.  Sit down and explicitly agree on the **Disagreement Point** (what happens if we dissolve the partnership tomorrow).
  2.  Explicitly agree on the **Ideal Point** (what is the max value I can extract without forcing the other below their Disagreement Point).
  3.  Convert non-cash items (shifts, van) into cash equivalents so you are drawing the line in a single currency of "value."
  4.  Accept that 50/50 of the *range* is the default, unless one of you puts in more capital (Asymmetric KS).

  You didn't make it up in the van. You derived a solution that economists spent decades formalizing. Trust the gut, but check the inputs.
