  7.  (Self-Correction during drafting): Make sure to distinguish between "Equal Split" (50/50 money) and "Equal Relative Gain" (KS). The user's intuition is that fairness is about *sacrifice*, not *outcome*. KS formalizes "equal sacrifice relative to potential."

  8.  Final Polish: Ensure the tone is conversational but authoritative. (e.g., "You've reinvented a wheel, but it's a very high-quality wheel.")

