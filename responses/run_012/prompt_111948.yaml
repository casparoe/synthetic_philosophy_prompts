      *   *Is the user's "worst" actually the disagreement point?* The user says "worst each of us would put up with." That is the reservation price, which defines the disagreement point.
      *   *The "Impossible Best":* In KS, the ideal point is defined as the maximum utility a player can get *given that the other player gets at least their disagreement point*. Wait, strictly speaking, the Ideal Point in KS is the max utility player $i$ can get *assuming player $j$ gets at least $d_j$*. Actually, usually, it's defined as the max possible utility in the feasible set regardless of the other, provided it's individually rational. The user's definition ("ignore what's good for him") aligns with the standard "Utopia Point" definition in KS.
      *   *3+ Players:* The KS solution generalizes to $n$ players. The geometry holds (ray from $d$ through $a$). However, stability is an issue in $n$-player cooperative games (the Core might be empty). I should keep it simple: The math works, the politics get messy.

  6.  **Final Plan:**
      *   Confirm: It's a real thing.
      *   Name: Kalai-Smorodinsky Bargaining Solution.
      *   Breakdown the 5 questions using this framework.
