answer: |-
  First, let me reassure you: you are not asking a badly formed question. In fact, you have stumbled onto a specific branch of social ontology and moral psychology without needing the jargon. You are asking about the *axioms* of a social system. In your old line of work, if you changed the assumption about carrying capacity or recruitment variability, the whole model output shifted. You are asking for the carrying capacity assumptions of culture.

  You are also right to suspect that the "readings" you floated (envy, luck, humility) are not mutually exclusive. In a robust cultural model, multiple assumptions stack to support the load. However, some are load-bearing, and some are just cladding.

  Here is the reconstruction of the implicit theories, broken down by the variables that matter.

  ### 1. The Jante Model: The Ecology of the Group

  **The Core Axiom:** The self is not an independent variable; it is a function of the group.
  In the American model, the individual is the unit of measure. In the Jante model, the *relationship* is the unit of measure. Therefore, any claim that elevates the individual necessarily degrades the relationship.

  **The Load-Bearing Assumption:** *Esteem is a Positional Good (Zero-Sum).*
  This is the hypothesis your wife's cousin pointed to, and it is the critical structural beam. Janteloven assumes that social standing is finite. If you claim you are "better," you are not just describing yourself; you are implicitly stating that others are "worse." In a zero-sum economy of status, boasting is not just annoying; it is an act of extraction. You are stealing standing from the collective.

  **Necessary vs. Compatible Readings:**
  *   **Equality of Standing (Necessary):** This is the goal. The system collapses if hierarchy is legitimized.
  *   **Luck/Contingency (Necessary):** For the zero-sum logic to hold morally, success cannot be purely meritocratic. If success were 100% earned virtue, then the "best" fisherman *should* stand above the rest. Jante requires the assumption that outcomes are sufficiently decoupled from virtue (due to luck, circumstance, or help) that claiming credit is a falsehood.
  *   **Distrust of Merit Claims (Necessary):** This follows from the luck assumption. Verbal claims of superiority are treated as "noise" in the data—likely signal distortion.
  *   **Envy (Compatible, not Necessary):** Envy is the emotional enforcement mechanism, not the philosophical premise. You can have Jante without active malice; you can have a benevolent Jante where the group gently suppresses the individual "for their own good" (to keep them grounded). Envy is what happens when the norm breaks down, not the foundation of the norm.
  *   **Ethics of Humility (Compatible):** Humility is the virtue that allows the system to function without constant friction. It is the behavioral interface, not the underlying code.

  **What breaks if you swap the assumption?**
  If you introduce the American assumption (Agency is high, Luck is low) into Jante, the norm becomes oppressive tyranny. If I believe I earned my success through pure grit and divine favor, being told to shut up about it feels like a violation of truth, not a social courtesy. The system relies on the collective agreement to downplay agency.

  ### 2. The American Model: The Market of the Self

  **The Core Axiom:** The self is a sovereign project.
  The individual is the primary unit. Society is an aggregation of individuals. Therefore, the improvement of the individual *is* the improvement of the society.

  **The Load-Bearing Assumption:** *Esteem is a Scalable Good (Positive-Sum).*
  The American Dream assumes that one person's success does not diminish another's potential; in fact, it validates it. The "self-made man" is a proof of concept. If he did it, the pathway is open. This requires the belief that status is not fixed, but expandable.

  **Necessary vs. Compatible Readings:**
  *   **Agency/Desert (Necessary):** For the pedestal to be legitimate, the person on it must have earned it. If success is mostly luck, the "self-made" narrative collapses into a lottery, and the resentment you mentioned ("resent the guy standing on it") becomes the dominant feature, destroying the admiration.
  *   **Hierarchy as Natural (Necessary):** The model assumes inequality of outcome is evidence of inequality of effort or talent. It treats hierarchy as a sorting mechanism, not a distortion.
  *   **Luck (Incompatible):** This is the poison pill. The American model *must* suppress the variable of luck to function. Acknowledging luck undermines the moral justification for the inequality the system produces.
  *   **Admiration (Necessary):** Admiration is the fuel. It must be freely given to the successful to incentivize the striving.

  **What breaks if you swap the assumption?**
  If you introduce the Jante assumption (Status is Zero-Sum) into the American Dream, the system becomes a war of all against all. If my success reduces your standing, I am not an inspiration; I am a predator. The "commencement speech" becomes a threat.

  ### 3. The Disagreement: Ontology, not Economics

  You asked if they disagree less about equality than about whether admiration is a fixed pie. You are very close, but I would push it one layer deeper. They disagree about **where the value resides.**

  *   **Jante:** Value resides in the *equilibrium*. A stable school of fish survives better than a few fast swimmers who break formation. The assumption is that social cohesion is the primary survival strategy.
  *   **America:** Value resides in the *variance*. Innovation comes from the outliers. The assumption is that adaptation comes from mutation, even if it disrupts the school.

  **The "Badly Formed" Check**
  You asked if you were sniffing for the right thing. You are. In philosophy, this is the debate between **Communitarianism** (the good is defined by the community) and **Liberal Individualism** (the good is defined by the individual's pursuit).

  However, here is the variable you might be missing in your model: **Time.**

  Janteloven is a *synchronic* norm. It cares about how we stand relative to each other *right now*. It freezes the hierarchy to preserve peace.
  The American Dream is a *diachronic* norm. It cares about the trajectory over time. It allows for hierarchy now in exchange for the promise of mobility later.

  ### 4. The Verdict on Your Readings

  To answer your specific request on which readings the practice *needs*:

  1.  **Jante needs:**
      *   **Esteem is Positional (Zero-Sum):** If status were infinite, silence wouldn't be necessary.
      *   **Success is partially Luck:** If success were pure merit, silence would be a lie.
      *   **The Group is the Survivor:** The unit of survival is the village, not the fisherman.

  2.  **America needs:**
      *   **Agency is High:** You must be the author of your fate.
      *   **Esteem is Inspirational (Positive-Sum):** Your win must help my odds.
      *   **The Individual is the Survivor:** The unit of survival is the lineage or the self, not the town.

  **The Inconsistency**
  You noted that Americans "build the pedestal and then resent the guy standing on it." This suggests the American model is currently suffering from a parameter error. The *Agency* variable is being overestimated, and the *Luck* variable is being ignored. When people realize the game isn't purely meritocratic (the "self-made" myth fails), the Positive-Sum assumption collapses. If the pedestal was rigged, the guy on it isn't an inspiration; he's a cheater. At that point, the American system secretly craves Jante—it wants to lop the poppies—but it lacks the cultural software to do it without violence.

  Conversely, Jante struggles when the "village" is no longer the unit of survival. In a globalized economy, the best fisherman *does* need to leave the village to sell the catch. Jante assumes a closed system. Open systems break the zero-sum assumption.

  ### Summary
  You are asking a precise question about the **moral metaphysics** of culture.

  *   **Jante assumes:** We are nodes in a net. Tension on one strand vibrates the whole. Silence preserves the net.
  *   **America assumes:** We are arrows in flight. Drag on one slows it down. Celebration reduces the drag.

  Your wife's cousin is right: it is about the economy of standing. But the deeper assumption is about whether human beings are fundamentally **separate** (America) or **continuous** (Jante).

  If you treat the self as continuous with the group, boasting is a lie because there is no "you" separate from "us" to boast about. If you treat the self as separate, boasting is a duty, because it marks the boundary of your sovereignty.

  You aren't doing philosophy badly. You're doing it the only way that matters: by looking at the assumptions hidden in the water you're swimming in.
