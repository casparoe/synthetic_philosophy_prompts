answer: |-
  This is not an ill-posed question. It is a **tragic trade-off**, and that is excellent news for a novelist.

  If this were merely a verbal dispute about the definition of "democracy," your book would be a seminar. If it were purely an empirical bet that better data could settle, your book would be a technocratic thriller with a definitive ending. But it is neither. It is a clash between two incompatible goods that cannot be fully realized simultaneously.

  Your hunch is not lazy; it is structurally sound, but it misses the normative weight. Here is the diagnosis of the fight, broken down by what is verbal, what is empirical, and what is bedrock.

  ### 1. The Verbal Layer: "Democracy" as Signifier
  You are correct that there is an equivocation here, but it is not just semantic sloppiness. It is a fight over the *locus of sovereignty*.
  *   **Camp 1 (Epistemic Democracy):** Defines democracy as **Rule by the People's Interest.** If the outcome matches the common good, the process is democratic. They view elections as a filter that distorts the signal.
  *   **Camp 2 (Procedural Democracy):** Defines democracy as **Rule by the People's Will.** If the process allows for authorization and withdrawal of consent, it is democratic. They view sortition as a filter that removes the signal (accountability).

  **Diagnosis:** This part *is* verbal, but it masks the deeper conflict. You can resolve this in the novel by having characters argue past each other using the same word, but the reader needs to see that they are worshipping different gods. One worships **Truth** (the right decision); the other worships **Consent** (the right to choose the wrong decision).

  ### 2. The Empirical Layer: The Deliberation Wager
  This is where your hunch is strongest. Camp 1's entire moral authority rests on the Condorcet Jury Theorem (CJT). As you noted, CJT requires two things: individual competence > 0.5 and **independence of judgment**.
  *   **The Vulnerability:** Deliberation creates correlation. If a charismatic member of the lot, or a particularly persuasive briefing binder, sways the room, independence collapses. The "wisdom of crowds" becomes the "madness of mobs."
  *   **The Counter-Wager:** Camp 2 assumes elections produce accountability. But if the electorate is misinformed or polarized, accountability just punishes competence.

  **What counts as progress here?**
  In the real world, we don't have a 50-year dataset on a full lottocracy. In your novel, *you run the experiment.* Progress in the narrative looks like stress-testing the CJT.
  *   *Does the assembly converge on the truth, or do they converge on the person who speaks first?*
  *   *Does the "Briefing Binder" become the real government?* (This is the bureaucratic capture risk. If the permanent civil service writes the binders, the lot is just a rubber stamp. This is a tangible, dramatizable plot point.)

  ### 3. The Bedrock Layer: Legitimacy vs. Competence
  This is the core. This is not ill-posed; it is **incompatible**.
  *   **Camp 2's Bedrock:** Legitimacy comes from the *right to be wrong.* I accept a law I hate because I had a mechanism to vote out the people who passed it. In sortition, I cannot vote them out. I can only wait for their term to end. If they pass a law that ruins my life, I have no recourse. That feels like tyranny, even if the law is objectively "good."
  *   **Camp 1's Bedrock:** Competence comes from *freedom from incentive.* An elected official *must* optimize for re-election, which means optimizing for short-term popularity over long-term good. A lotteried official *must* optimize for... what? Their conscience? Their legacy? Their boredom?

  **The Diagnosis:** The fight is not about whether sortition works. It is about **who bears the risk of error.**
  *   In elections, the politician bears the risk (they get fired).
  *   In sortition, the public bears the risk (they can't fire anyone).

  ### Why This Is Not Ill-Posed (And How to Write It)
  You asked if you can write a novel about a question where nobody can say what an answer would look like. The answer is yes, but only if you recognize that the "answer" isn't a verdict on the system. The answer is the **cost of the system.**

  A novel that tries to prove Camp 1 right will feel like propaganda. A novel that proves Camp 2 right will feel like a cautionary tale. A novel that acknowledges the trade-off will feel like tragedy.

  **Here is how you find the "answer" in the narrative:**
  You need to create a scenario where **Competence** and **Consent** demand opposite things.

  *   **Scenario A (The Competence Win):** The Assembly passes a vital, unpopular law that saves the island from economic collapse. Camp 1 cheers. Camp 2 riots, because the people never consented to the pain. *Result: The system worked, but is it stable?*
  *   **Scenario B (The Consent Win):** The Assembly refuses to pass a vital law because it hurts a specific neighborhood. Camp 2 cheers (they represented their constituents!). Camp 1 weeps (they failed the common good). *Result: The system is legitimate, but is it useful?*

  **The "Binder" Problem (Your Specific Sticking Point)**
  You mentioned: *who writes the briefing materials.*
  This is the hidden empirical bet that nobody talks about. In a lottocracy, power flows to those who set the agenda.
  *   If the civil service writes the binders, you have a technocracy with a random face.
  *   If the Assembly hires their own researchers, you have 300 new fiefdoms.
  *   If lobbyists write the binders, you have corruption without the ability to vote the corrupt out.

  **Diagnosis of your stalemate:** You are stuck because you are looking for a theoretical resolution to a practical tension. The tension *is* the story.

  ### Recommendation for the Novel
  Do not decide if the system is "better" or "disaster." Decide **what kind of failure it is.**

  1.  **If you write the "Fragile Utopia":** The system produces brilliant laws, but the people hate it because they feel powerless. The conflict is **Alienation.** The protagonist realizes they are governing a people who do not recognize their authority.
  2.  **If you write the "Polite Disaster":** The system produces gridlock or capture by the briefing writers. The conflict is **Drift.** The protagonist realizes they are a rubber stamp for unelected bureaucrats.

  **The Progress You Need:**
  Stop asking "Is this democratic?" Start asking "Where does the power actually go?"
  *   **Test:** Have your protagonist try to change a briefing document. If they can't, Camp 2 wins (it's a sham). If they can, Camp 1 wins (it's real power), but then ask: *Why did they change it?* Was it for the common good, or because a lobbyist took them to dinner? (Remember: no elections doesn't mean no corruption).

  **Final Verdict:**
  The question is **hard, not ill-posed.** The "answer" is that you cannot have high competence and high authorization simultaneously without sacrificing something else (usually speed, or stability).

  Your protagonist, the retired schoolteacher, is the perfect lens for this. She understands that a classroom of 30 random kids (the Lot) can be brilliant, but only if the teacher (the Bureaucracy/Agenda) sets the lesson plan. If the kids write the lesson plan, it's chaos. If the teacher writes it, it's tyranny.

  Write the book about the moment she realizes she is either the teacher or the kid, and that neither role allows her to save the island without breaking the system. That is where the truth lives.
