      *   *The "Democracy" Label:* Both sides claim this word. Camp 1 means "rule by the people" (statistically). Camp 2 means "rule by the people" (via consent mechanisms). This is a verbal dispute, but it masks deeper normative disagreements.
      *   *The Empirical Gap:* The Condorcet Jury Theorem (CJT) relies on independence and competence > 0.5. Deliberation often violates independence (correlation). This is a crucial technical point the user identified.
      *   *The "Authorization" Gap:* Camp 2 is right that you can't fire a lottery. But Camp 1 is right that you can't really fire an elected politician either (safe seats, gerrymandering).
