      *   *Decision:* It is **not ill-posed**. It is a **tragic trade-off**.
      *   *Why:* Because you can maximize legitimacy (consent) or competence (outcomes), but rarely both perfectly. The novel should explore the *cost* of choosing one.

  9.  (Final Review against constraints): The user wants a diagnosis, not a verdict. They want to know if they can write a novel about a question with no answer. Yes, you can, *if* the lack of answer is the point. But better: show the *consequences* of the answer.

