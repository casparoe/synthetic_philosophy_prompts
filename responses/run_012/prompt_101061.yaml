  A swimmer is caught in a rip current far from shore, their head repeatedly submerging as they exhaust themselves. A bystander wades out, grabs the swimmer's wrist, and holds their head above water, successfully arresting the drowning process. After thirty seconds, the bystander consciously decides to leave; he deliberately uses his free hand to pry the swimmer's fingers off his own arm—a distinct muscular exertion—and then swims away. The swimmer's head immediately slips beneath the surface, water fills their lungs, and they die of asphyxiation.

  Your guess survives contact with this case. The hinge is indeed whether the lethal process was already underway and whether the agent removed an existing barrier rather than failing to supply one. In this scenario, the drowning was underway before the bystander arrived, and his physical action removed the barrier (his grip) that was holding the threat back. This confirms that the moral classification (killing vs. letting die) tracks the causal history of the threat, not the physical classification (doing vs. allowing) of the agent's behavior.

  First, consider the agent's behaviour described in the vocabulary of someone who thinks the important line is doing versus allowing: the bystander performed a deliberate physical act, exerting muscle to pry fingers away and propel himself forward, which classifies his behaviour as "doing" something. Now consider the description in the vocabulary of someone who thinks the important line is killing versus letting die: the bystander withdrew protection from a pre-existing lethal threat, allowing nature to take its course, which classifies his behaviour as "letting die." The same behaviour is an act in the first vocabulary and an allowance in the second.

  Second, the verdict from the doing/allowing outlook is that the agent acted, because there was undeniable bodily movement initiated by neural command. The verdict from the killing/letting die outlook is that the agent let the swimmer die, because the cause of death was the water entering the lungs—a process active before intervention—rather than a new lethal force introduced by the agent. These verdicts follow from the physical facts of muscle contraction versus the causal facts of where the lethal energy originated.

  Third, the one feature of the case doing the work is the **pre-existence of the lethal process** prior to the agent's intervention. Because the drowning was already happening, the agent's involvement was structurally defensive (a barrier) rather than offensive (a threat).

  Fourth, remove that feature: imagine the swimmer was treading water safely until the bystander arrived, grabbed them, and actively pushed their head underwater before swimming away. Here, the lethal process was not underway, and the agent supplied the threat rather than removing a barrier. In this reversed case, the two lines snap back into agreement: the agent plainly did something, and plainly killed, so both distinctions classify the behaviour identically.

  Fifth, someone convinced that the two distinctions are one would attack the case by redescribing the behaviour: they would argue that prying fingers off is not truly an "act" but merely "stopping holding," attempting to collapse the doing/allowing distinction to match the killing/letting die verdict. This attack fails because prying requires active extensor muscle engagement distinct than mere relaxation; the physical effort is measurable and distinct from stillness, so the behaviour remains an act regardless of the moral description.

  Finally, the case shows the two distinctions to be genuinely independent. The doing/allowing distinction tracks the kinematics of the agent's body (movement vs. stillness), while the killing/letting die distinction tracks the dynamics of the causal chain (initiating vs. permitting a threat). Since a single event can involve movement that permits a threat, the concepts map onto different features of reality and cannot be reduced to one another.
