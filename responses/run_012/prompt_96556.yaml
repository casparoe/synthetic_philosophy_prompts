      *   *Signal:* Prices (Market) vs. Quotas/Instructions (Planning).
      *   *Program:* Profit motive/Supply & Demand (Market) vs. The Optimization Function (Planning).
      *   *Error/Bug:* Bankruptcy/Loss (Market) vs. Shortages/Surpluses/Inefficiency (Planning).
      *   *Critique:* The mapping is asymmetrical. The "Market Computer" is decentralized; the "Planning Computer" is centralized. The opponent is conflating the *structure* of computation.

  4.  **Drafting Section 2: Where it Breaks (The Crucial Bits):**
      *   *Break 1: Data Generation vs. Data Processing.* Computers process *given* data. Markets *generate* data (prices) through action. You can't input "preferences" without a market to reveal them.
      *   *Break 2: Incentives.* A CPU doesn't lie. A factory manager might lie to lower quotas. A computer doesn't care about risk. Humans do.
      *   *Break 3: Tacit Knowledge.* Hayek's point. Knowledge that *cannot* be written down (how to fix a specific machine, local nuance). Computers need explicit data.
