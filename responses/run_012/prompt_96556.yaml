          2.  Identify where it breaks and which breaks matter.
          3.  Identify hidden assumptions (what the computer picture smuggles in).
          4.  Evaluate the conclusion and suggest a better analogy.
          5.  Address Project Cybersyn.
      *   **Tone:** Sharp, debate-ready, not pedantic, avoiding "boring version of the argument."

  2.  **Deconstruct the Opponent's Argument (The "Market as Computer" Analogy):**
