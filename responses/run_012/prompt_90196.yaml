      *   *Numbers:* Confirm $10^{18}$.
      *   *Misconception Map:* Exact timing.
      *   *Final Question:* Structural understanding check.
      *   *Boundaries:* What to exclude.

  10. **Final Polish of the Plan:**

      *   *Structure:*
          1.  **The Anchor (5 mins):** Bug Zapper. Establish indifference.
          2.  **The Framework (10 mins):** Expected Value. *This is the key to preventing "low prob = ignore".*
          3.  **The Scale (10 mins):** The Numbers ($10^{18}$ vs $10^{11}$).
