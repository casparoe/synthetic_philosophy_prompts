      *   *Better Fix:* Frame it as "Expected Suffering Units."
      *   *Key Move:* Before saying "low probability," make them agree that *if* an insect suffers, it counts. Then agree that we are uncertain. Then show that Uncertainty $\times$ Huge Number > Certainty $\times$ Small Number.

  8.  **Refining the Anchor:**

