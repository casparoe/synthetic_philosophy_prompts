answer: |-
  Here is the 45-minute teaching plan, structured to force the arithmetic to feel inevitable rather than clever.

  ### 1. The Anchoring Example
  **Use the Bug Zapper.**
  *   **Why:** The agricultural field is too abstract and triggers "necessity" defenses ("we need to eat"). The bug zapper is *gratuitous*. It isolates the moral variable of **indifference**. It matches your "watching it like television" observation, which highlights that the suffering is not just happening, but is being *ignored* for entertainment.
  *   **Requirements for the Example:**
      *   **Must be countable:** Describe the tray after a night. "A handful of bodies." Then zoom out to "millions of devices."
      *   **Must be faceless:** Do not describe individual bugs struggling. Describe the *sound* (the zap) and the *pile* (the biomass). This prevents the "face bias" where they empathize with one but ignore the million.
      *   **Must be routine:** Frame it as a standard summer evening, not a massacre event. The banality is the point.
      *   **Must not be "pest control":** Explicitly frame it as "insects attracted to light," not "mosquitoes biting us." This removes the self-defense justification.

  ### 2. The Sequence (45 Minutes)

  **0:00–0:05: The Anchor & The Attitude**
  *   Show the image of the zapper tray. Ask: "What is the moral weight of this pile?"
  *   Capture the room's intuition. The welfarists will say "some weight." The skeptics will say "zero."
  *   **Do not resolve this yet.** State: "We are not here to prove they feel. We are here to calculate what happens if we aren't sure."

  **0:05–0:15: The Moral Arithmetic (Crucial Prerequisite)**
  *   **Goal:** Nail down **Expected Value (EV)** reasoning before mentioning insects.
  *   **The Move:** Present a non-insect case. "If there is a 1% chance a building contains a person, and a 99% chance it's empty, do you demolish it?"
  *   **The Rule:** Establish that Moral Weight = **Probability $\times$ Magnitude of Harm**.
  *   **Why this matters:** This is the only way to prevent "low probability" from being heard as "doesn't matter." You must establish that *low probability $\times$ catastrophic harm = significant obligation*.
  *   **Check:** Ask the skeptics: "Do you agree that if there is a non-zero chance of a human inside, you can't ignore it?" Get the nod. This logic is now locked in for the insects.

  **0:15–0:25: The Scale (The Numbers)**
  *   **Goal:** Make the multiplication feel boring.
  *   **The Numbers:** Use your **billion billion ($10^{18}$)** figure for insects alive at any moment. Compare this to the **hundred billion ($10^{11}$)** farmed vertebrates per year.
  *   **The Visualization:** Do not just say the numbers. Draw a bar chart. One bar is 1 unit (vertebrates). The other bar is 10,000,000 units (insects).
  *   **Address Scope Insensitivity Here:** If they glaze over, stop. Ask: "If I told you there were two insects, would you care less than if there were a million?" Force them to admit that *number matters*.
  *   **The Move:** "We have a gap of ten million to one. To ignore the insects, you need a reason that is ten million times stronger than your reason for caring about cows."

  **0:25–0:35: The Swamping (Your Wrinkle)**
  *   **Goal:** Destroy the "they suffer less" objection.
  *   **The Move:** Invite the skeptics' strongest point. "Okay, assume a bug feels pain. Surely it's less than a cow? Let's discount it."
  *   **The Math:** Write on the board: **Intensity Discount**.
      *   "Say a bug feels 1/100th of a cow." (Write $\div 100$).
      *   "Say a bug feels 1/1000th of a cow." (Write $\div 1000$).
      *   "Look at our population ratio." (Point to $10,000,000$).
      *   "The population ratio swallows the intensity discount."
  *   **The Conclusion:** "Unless you think a bug feels *ten million times less* than a cow, the sheer number of bugs outweighs the intensity of cow suffering."
  *   **Timing:** This must happen *before* you introduce sentience probability. If you do it after, they will hide behind the probability. Force them to concede the math of *numbers vs. intensity* first.

  **0:35–0:40: The Credence (The Final Variable)**
  *   **Goal:** Apply the "low probability" without losing the room.
  *   **The Move:** Now you say the words: "Low Probability of Sentience."
  *   **The Constraint:** Remind them of the 0:05–0:15 section (Expected Value).
  *   **The Calculation:** "Even if you give only a 1% credence that they feel..."
      *   $10,000,000 \text{ (scale)} \times 0.01 \text{ (credence)} = 100,000 \text{ equivalent vertebrates}.$
      *   "You still outweigh the vertebrate argument by a factor of 100,000."
  *   **The Bite:** "For the 'low probability' objection to work, your credence cannot be 'small.' It must be *astronomically* small. It must be one in a billion."

  **0:40–0:45: Objections & Close**
  *   Handle the Reductio (see below).
  *   Ask the Assessment Question.

  ### 3. The Misconception Map

  | Misconception | When it arises | Where you head it off | How to head it off |
  | :--- | :--- | :--- | :--- |
  | **"Insects are automatons / brain size settles it"** | Early (Anchor phase) | **0:05–0:15 (Moral Arithmetic)** | Do not argue neuroscience. Argue *uncertainty*. "We don't need to know they feel; we need to know we don't know they *don't*." |
  | **"Probability is low so it washes out"** | Mid (Credence phase) | **0:05–0:15 (Moral Arithmetic)** | Establish the "Demolish the Building" analogy first. Low prob $\times$ High Stake = Action. |
  | **"Scope Insensitivity" (Number is too big to mean anything)** | Mid (Scale phase) | **0:15–0:25 (The Scale)** | Force a comparison: "Is killing 10 bugs worse than 1?" If yes, number matters. If number matters, big number matters more. |
  | **"Argument requires certainty of sentience"** | Late (Credence phase) | **0:35–0:40 (The Credence)** | Explicitly state: "This argument *requires* uncertainty. If we were certain they didn't feel, the math would be zero." |
  | **"Reductio: Bacteria / Laptops"** | End (Q&A) | **0:40–0:45 (Objections)** | Draw the line at *nervous systems*. "We are discussing the boundary of sentience, not the boundary of life. Bacteria lack the hardware for pain. Insects have the hardware; we are unsure if it runs the software." |

  ### 4. The Assessment Question
  Do not ask "Do you agree?" Ask a structural question that forces them to use the formula ($E = P \times N \times W$).

  **The Question:**
  > "I want to test if we're on the same page. If I convinced you that insects feel pain *exactly* as intensely as cows, but you believed there were only *half* as many insects as cows, would the conclusion of this argument stand or fall?"

  *   **Correct Answer:** "It falls." (Because $N$ dropped below the threshold).
  *   **Incorrect Answer:** "It stands because bugs are weird." (They missed the math).
  *   **Incorrect Answer:** "It stands because probability is high." (They ignored the variable change).

  ### 5. Scope Boundaries (What to Announce You Are *Not* Covering)
  Openly state these three exclusions at the start to prevent derailment:
  1.  **Intervention Logistics:** "We are not discussing *how* to help insects (wild animal suffering, pesticides, etc.). We are only discussing whether they count."
  2.  **Neuroanatomy:** "We are not debating specific neural structures today. We are debating decision-making under uncertainty."
  3.  **Plants/Microbes:** "We are drawing the line at organisms with nervous systems. This argument does not extend to bacteria or plants."

  ### 6. Note on the Numbers
  Your "billion billion" ($10^{18}$) is the correct order of magnitude for **global insect population at any given moment**.
  *   **Farmed Vertebrates:** ~100 billion ($10^{11}$) slaughtered *per year*.
  *   **Insects:** $10^{18}$ alive *at once*.
  *   **The Trap:** Since insects live shorter lives, the *annual* flow of insects is even higher.
  *   **Advice:** Stick to "alive at any given moment" for both if you can find a vertebrate stock number, OR acknowledge the time discrepancy and note that it makes the insect number *even larger*. For a 45-minute session, the $10^{18}$ vs $10^{11}$ gap (factor of 10 million) is sufficient to make your point without getting bogged down in turnover rates.
