  I studied some economics as an undergraduate, but that was years ago and this episode got about two lectures, so I know just enough to be suspicious of a summary without being able to say exactly where it goes wrong. I would like a careful, self-contained audit rather than pointers to the literature. Please act as an expert on the interwar socialist calculation debate — someone who knows the arguments of Mises, Hayek, and Lange in detail, along with the ways the exchange is usually reconstructed by later commentators — and work through the following problem.

  A trade book on markets that I picked up, written by a professional economist for a general audience, opens with a chapter on the socialist calculation debate. It summarizes the episode roughly as follows:

  "During the interwar years, economists fought what came to be called the socialist calculation debate. Mises opened it by arguing that socialism is impossible: without private ownership of the means of production there can be no market prices for capital goods, and without such prices the planners have no way of comparing the relative costs of alternative uses of resources, so rational allocation is ruled out from the start. Hayek then added that even if a central board could somehow assemble all the relevant information, it would have to solve millions of simultaneous equations, and by the time it had solved them the data would have changed; so socialist planning might be possible in theory but is hopeless in practice. Lange answered on behalf of the socialists. A Central Planning Board, he said, could set prices by trial and error — raising them when goods were in short supply and lowering them when there were surpluses — and could instruct factory managers to minimize average cost and to produce up to the point where price equals marginal cost, while consumers chose freely what to buy and workers chose freely where to work. Since the board's prices would converge on the very prices a competitive market would produce, the calculation problem is solved, and a socialist economy would be just as efficient as a capitalist one. Lange's model — a form of market socialism, essentially what Yugoslavia later tried — has never really been refuted on its own terms. In the end, then, the debate came down to incentives rather than information: the Lange system works on paper, but planners and managers would have had no reason to follow its rules, which is why the planned economies collapsed at the end of the 1980s and why Mises and Hayek are now generally thought to have won the argument."

  Before you draft your answer, please take some time to sort out for yourself the distinct arguments that are actually in play in this literature — I want them kept separate rather than bundled under "the calculation problem" — and to work out which sentences of the summary map onto which argument. Then, in your answer, do the following:

  1. Go through the summary claim by claim and sort each one into three buckets: (a) accurate as far as it goes; (b) a defensible simplification that an expert would let pass with a wince; (c) a genuine misrepresentation. For anything in (b) or (c), say precisely what the author has conflated, overstated, or silently moved from one argument to another. Where a sentence is true but only for a reason the author doesn't give, say so.
  2. Say separately what a defender of Mises, a defender of Hayek, and a defender of Lange would each object to, since they would not object to the same sentences.
  3. Address the closing move directly. Does the claim that the debate "came down to incentives rather than information" survive correction? Is the appeal to the collapse of the planned economies a good reason to think Mises and Hayek were right about the theoretical question, or does it trade on a different question?
  4. State plainly whether Lange's reply answers the argument Mises actually made or whether it answers a somewhat different question. If the latter, say what the original argument was and what, if anything, would be needed to answer it.

  Write in American English, and do not soften your verdicts: where the book is simply wrong, say so. Assume I am intelligent but not trained in this literature, and define any technical term you rely on — for instance, anything about how a "parametric" price system is supposed to work for a socialist manager.
