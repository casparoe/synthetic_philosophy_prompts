answer: |-
  1. **Summary**
  The practice attempts to combine aggregative utilitarianism with agent-relative duties, creating a fundamental logical tension rather than a unified theory. I argue this inconsistency is a feature of political compromise, not moral coherence. Consequently, the system is philosophically incoherent, functioning only through strategic ambiguity.

  2. **The practice as I've described it**
  Health systems employ Cost-Effectiveness Analysis using Quality-Adjusted Life-Years (QALYs) to maximize aggregate health within a budget. A cost-per-QALY threshold determines funding, theoretically treating all lives impartially to save the most life-years possible. However, these systems routinely exceed the threshold for identifiable patients facing imminent death, such as children with rare diseases or neonates in intensive care. This creates a dual regime: strict utilitarian accounting for statistical populations and high-cost rescue for identifiable cases. The official justification remains efficiency, yet operational reality prioritizes specific lives over aggregate gains, invoking the "Rule of Rescue" to bypass the very thresholds designed to ensure fairness.

  3. **The commitments it strictly presupposes**
  The practice strictly presupposes two conflicting moral axioms. First, it assumes utilitarianism: aggregate health utility is the primary metric of justice, necessitating the QALY threshold. Second, it assumes agent-relative duties: moral obligation intensifies based on identifiability and proximity, necessitating the exception. It presupposes that impartiality is the default but can be overridden by emotional salience. It commits to the view that public legitimacy is a higher-order good than health maximization, justifying the inconsistency. It assumes decision-makers can distinguish "worthy" exceptions without arbitrariness, despite lacking criteria. Crucially, it presupposes that the moral weight of a statistical death differs from an identifiable one, violating the principle of equal consideration. It relies on the public accepting the threshold as binding generally while expecting it to be broken specifically. This entails a rejection of pure impartiality while retaining the language of impartial calculation, creating a system built on contradictory foundations regarding the value of human life. It presupposes that efficiency is the public face of policy, while duty is the private engine.

  4. **The commitments it merely fits, or that it doesn't actually need**
  This practice fits Prioritarianism, which weights benefits to the worse-off more heavily, without needing the identifiable/statistical distinction. It also fits Rule Utilitarianism if the "rule" includes maintaining public trust as a utility component. It does not need to presuppose that QALYs are morally meaningless; they remain the baseline for standard care. It doesn't require a full deontological system, only specific constraints on aggregation. It doesn't need to claim Harsanyi is false universally, only that social welfare functions are context-sensitive. The system could function without the QALY facade, but the facade provides administrative cover. It fits a model of "bounded rationality" where perfect consistency is sacrificed for cognitive ease. It does not need to assert that rescue is always right, only that it is sometimes politically necessary.

  5. **Where the practice is underdetermined**
  It is underdetermined whether the rescue value is intrinsic (the life itself matters more) or instrumental (paying saves the system from revolt). It is unclear if the exception applies to all identifiable lives or only sympathetic ones, like children versus criminals. The threshold itself is arbitrary, leaving the boundary between rule and exception fuzzy and vulnerable to lobbying. We don't know if the system values the *act* of rescuing or the *outcome* of the specific life. Furthermore, it is unclear whether the "utility" gained from rescue is experienced by the patient or the society watching. This ambiguity allows the system to shift justifications depending on the case, preventing rigorous ethical auditing. The lack of a defined limit on rescue spending leaves the budget vulnerable to infinite claims.

  6. **What Harsanyi's theorem would say about the exception**
  Harsanyi's aggregation theorem derives utilitarianism from rational choice axioms, specifically Pareto and Independence. If you accept these, social welfare must be a weighted sum of individual utilities. The Rule of Rescue violates Independence because the choice depends on the description (identifiable vs. statistical), not just the outcomes. Harsanyi would call this irrational unless the "warm glow" of rescue is added to the utility sum. But if added, the QALY threshold is miscalculated because it ignores this social utility. Thus, the exception implies the axioms do not hold for social choice, or the utility metric is incomplete. The practice effectively rejects Harsanyi's conclusion while keeping his language, treating the sum as binding only when convenient.

  7. **Your verdict**
  The practice is philosophically incoherent. It tries to hide a deontological constraint within a utilitarian calculus, which is logically unstable. This is not a subtle moral theory but a political compromise masquerading as rational administration. It deceives the public by claiming efficiency while practicing partiality. The system should admit it is Prioritarian or sufficientarian. By keeping the QALY facade, it invites criticism whenever it breaks its own rules, eroding trust when exceptions seem unfair. The "administrative detail" is actually a fundamental category error. You cannot maximize a sum while granting lexical priority to subsets. I argue this inconsistency is dangerous; it masks the true trade-offs. The honest path is to abandon the single threshold and adopt a weighted system that explicitly values the worse-off, rather than pretending to maximize health while buying legitimacy. Consistency demands choosing one master: efficiency or duty.
