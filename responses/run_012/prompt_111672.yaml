answer: |-
  ### Preliminary Scoping & Sharpening

  Before locking in the proposal, we need to ensure the question isn't just "Can we avoid Pascal's Mugging?" (which has endless answers) but "Can we avoid it *without* breaking diachronic rationality?" Here are three ways to sharpen the diachronic fault line. We will select **Option 2** for the proposal, as it offers the cleanest formal tractability for a three-month timeline.

  1.  **The Aggregation Problem (Thresholds):** If you ignore probabilities below $\epsilon$, does a sequence of $N$ bets where each $p < \epsilon$ but $\sum p > \epsilon$ force you to accept the bundle while rejecting the parts?
      *   *Verdict:* Too well-trodden. The "Shmisking" literature covers this. Hard to find new ground in 3 months.
  2.  **The Policy-Action Gap (Plan vs. Do):** Can you adopt a *policy* ex-ante ("I never take these bets") that you have no incentive to deviate from ex-post, even when the specific instance looks favorable under your anti-fanatic rule?
      *   *Verdict:* **Selected.** This isolates the dynamic consistency issue without getting bogged down in infinite utility sums. It frames the problem as a game between your current self and your future selves.
  3.  **The Bookie's Sequence (Money Pump):** Can a bookie construct a finite tree of offers where an anti-fanatic agent pays to enter, pays to switch, and ends up back where they started but poorer?
      *   *Verdict:* Risky. If the answer is "yes," the project ends in week 4. If "no," proving the negative is hard. Option 2 allows for a more nuanced "It depends on the information structure" result.

  ***

  ### Research Proposal

  **Title:** The Diachronic Trap: Dynamic Consistency vs. Anti-Fanaticism in Sequential Choice

  **Abstract**
  Current solutions to expected-value fanaticism (Pascal's Mugging) focus on synchronic constraints: bounding utility or truncating probabilities. This project argues that the core vulnerability is diachronic. An agent who rejects a single low-probability/high-payoff bet may be vulnerable to a sequence of such bets that collectively guarantee a loss, or conversely, an agent who resists the sequence may violate dynamic consistency (preferring a plan ex-ante that they abandon ex-post). This project seeks to formalize this trilemma. We ask: *Does there exist a decision rule that is simultaneously anti-fanatic, dynamically consistent, and immune to finite Dutch strategies?* The output will be a formal impossibility theorem or a characterization of the necessary conditions for a consistent non-fanatic rule.

  **The Precise Question**
  Let a **Decision Rule** $D$ map decision nodes to choices. We define three properties:
  1.  **Anti-Fanaticism:** There exists a cost $c > 0$ and a probability threshold $\epsilon > 0$ such that for any payoff $V$, $D$ rejects a bet costing $c$ with probability $p < \epsilon$ of winning $V$.
  2.  **Dynamic Consistency:** If a strategy $S$ is optimal at node $n_0$, then the continuation of $S$ is optimal at any successor node $n_1$ reached under $S$.
  3.  **Strategy-Proofness:** No finite sequence of offers exists such that an agent following $D$ ends with strictly less utility than an agent who refused all offers, regardless of the outcome of stochastic events.

  **Research Question:** In a finite decision tree with stochastic nodes, does there exist a Decision Rule $D$ satisfying properties 1, 2, and 3?

  **Why Existing Positions Don't Settle This**
  *   **Expected Value Maximization:** Satisfies 2 and 3, but violates 1 (it is fanatical).
  *   **Bounded Utility:** Satisfies 1. However, in sequential settings, bounded utility often violates 2 because the "remaining utility budget" changes how future bets are evaluated, leading to time-inconsistency.
  *   **Probability Thresholds:** Satisfies 1. Violates 3 (vulnerable to aggregation pumps) and typically violates 2 because the threshold applies differently to single bets vs. bundled strategies.
  *   **The Gap:** No one has formally proven whether the violation of 2 is *necessary* to maintain 1 in a sequential environment. The literature treats the money pump as a consequence of thresholds, not as a structural feature of anti-fanaticism itself.

  **Work Plan (3 Months)**

  *   **Month 1: Formalization.**
      *   Define the "Mugging Tree": A finite sequential game where nature offers a sequence of low-probability/high-payoff bets.
      *   Rigorously define Dynamic Consistency in this context (separability vs. consequentialism).
      *   Draft the definitions of Anti-Fanaticism and Strategy-Proofness to ensure they don't trivially contradict by definition.
  *   **Month 2: Exploration & Counter-Examples.**
      *   Test candidate rules: (a) Fixed probability cutoff, (b) State-dependent utility, (c) Policy-based choice (commitment).
      *   Attempt to construct a Dutch Strategy (money pump) against each candidate.
      *   Identify if "Policy-Based Choice" (choosing a rule for the whole tree at once) rescues Dynamic Consistency or merely shifts the inconsistency to the policy selection stage.
  *   **Month 3: Proof & Write-up.**
      *   Formalize the impossibility result (if found) or the specific constraints required for a possibility result.
      *   Draft the manuscript (target: 15–20 pages).
      *   Finalize definitions and appendices.

  **Deliverables & Success Criteria**
  *   **Success:** A formal theorem stating either "No such rule exists" or "Such a rule exists if and only if [Condition X]." Condition X might involve restricting the agent's knowledge of the sequence length or allowing commitment devices.
  *   **Failure:** The definitions of "Anti-Fanaticism" and "Dynamic Consistency" turn out to be incompatible by trivial stipulation (e.g., if Dynamic Consistency implies EV maximization by definition).
      *   *Mitigation:* If this happens, the deliverable shifts to a "Conceptual Map" paper clarifying why the standard definitions force fanaticism, which is still a valuable contribution.

  **Feasibility Assessment**
  *   **Is 3 months realistic?** It is tight but viable *if* we restrict the domain to finite trees and discrete choices. Proving a general impossibility theorem for continuous time or infinite horizons is impossible in this timeframe.
  *   **Risk:** The highest risk is that the "Dynamic Consistency" definition used in standard literature (e.g., Hammond's consequentialism) already mathematically entails EV maximization. If so, the theorem is trivial.
  *   **Contingency:** If the triviality risk materializes in Month 1, the scope shifts to analyzing *weaker* notions of consistency (e.g., "resolute choice" or "sophisticated choice") to see if they can sustain anti-fanaticism without exploitation. This is still a coherent project.

  **Budget Justification**
  *   **Person-Months:** 3 (Principal Investigator only).
  *   **Needs:** No travel or data collection costs. Funds allocated for buy-out time to ensure focused derivation and proof-checking.

  **Conclusion**
  This project does not attempt to solve fanaticism. It attempts to prove why the usual solutions fail when time is introduced. Even a negative result (an impossibility theorem) clarifies the decision-theoretic landscape by showing that anti-fanaticism comes at the price of diachronic rationality. This fits the scope of a small, short-term grant perfectly.
