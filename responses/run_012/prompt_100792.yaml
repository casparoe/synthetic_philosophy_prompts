answer: |-
  Here is the read on Tom, the rule he's running, and how to trap him in a contradiction.

  ### 1. The Verdict on Your Aunt
  Tom will almost certainly say **she wants the treatment.**

  He will argue that the written statement was "theory" (talk), but grabbing the pills is "practice" (action). In every previous case you listed, Tom discarded the internal narrative ("I loathed it," "It was agony") in favor of the physical commitment (staying, running, working). To Tom, the dementia doesn't change the rule; it just changes the actor. He sees a living body fighting to stay alive, and he will treat that biological imperative as the only "revealed preference" that matters. He will likely say your mum is honoring a ghost, while your cousin is honoring the woman in the bed.

  ### 2. The Rule Tom Is Actually Running
  You suspected **Revealed Preference**, but that's too clean. Economists assume agents are rational. Tom doesn't care about rationality; he cares about **Costly Persistence.**

  Tom's rule is: **"Preference is proven by what you endure, not what you endure it for."**

  Look at his logic:
  *   **Uncle:** Endured misery. Proof: Stayed 30 years.
  *   **Runner:** Endured agony. Proof: Ran four times.
  *   **Colleague:** Endured back pain. Proof: Worked nights.
  *   **Wife:** Endured coldness. Proof: Stayed married.

  In every single case, Tom ignored the *reason* given (pension, achievement, sister, kids) and ignored the *complaint* (misery, agony). He focused entirely on the **sustained behavioral cost.** If you pay the price, you bought the item. If you didn't leave, you wanted to stay.

  ### 3. The Alternative Rules (That Fit Perfectly)
  Here is the problem: Tom's rule isn't the only one that fits his four verdicts. There are two other rules that explain his history just as well, but they will give you the *opposite* answer on your aunt.

  **Rule A: Rational Endorsement (The 'Competent Self' Rule)**
  *   **The Logic:** People want what they consciously choose when they are capable of weighing costs, regardless of how they feel in the moment.
  *   **Fits the 4 Cases:** The uncle *chose* the pension over happiness. The runner *chose* the goal over comfort. The colleague *chose* his sister over his back. The wife *chose* her kids over romance. In all four, the "rational choice" aligned with the "action."
  *   **Verdict on Aunt:** She wrote the directive when competent. That was her rational endorsement. The treatment-grabbing is instinct, not choice. **Let her go.**

  **Rule B: Narrative Identity (The 'Story' Rule)**
  *   **The Logic:** People want what fits the long-term story they are telling about themselves.
  *   **Fits the 4 Cases:** The uncle was a provider. The runner was an athlete. The colleague was a protector. The wife was a mother. Their actions maintained their identity.
  *   **Verdict on Aunt:** This is the wildcard. If her identity was "independent/dignified," honor the directive. If her identity is "survivor," give treatment. But it proves Tom's "Costly Persistence" isn't the only game in town.

  ### 4. The Test Case (To Break the Tie)
  To find out which rule Tom is actually running, you need a case where **Sustained Action** conflicts with **Rational Commitment.** You need a "Ulysses Pact" scenario where someone binds their future self, and the future self fights the bonds.

  **Put this to him:**

  > "A mate of ours, Dave, is a gambling addict. Last year, when he was sober and straight, he signed a legal self-exclusion ban from all casinos and gave his wife control of his finances so he *couldn't* bet. He said, 'I want to be a non-gambler.'
  >
  > Last week, Dave broke into the safe, stole the cash, and bet it all at a dog track. He lost it. When caught, he was screaming, 'I didn't want to do it, stop me!' but he also placed the bet.
  >
  > **Tom: Did Dave want to place that bet?**"

  **Why this splits the rules:**

  1.  **If Tom says "Yes, he wanted to bet":** He is running **Costly Persistence / Hard Behaviorism.** He believes the immediate action overrides the past contract. (This means he will treat your aunt).
  2.  **If Tom says "No, he wanted to be sober":** He is running **Rational Endorsement.** He believes the competent commitment overrides the failed action. (This means he should let your aunt go).
  3.  **If Tom hedges:** He'll say something like, "He wanted to bet *in the moment*, but he wants to be sober *in reality*." Call him on it. Ask: "Which want is the *real* one? The one that cost him the money, or the one that cost him the signature?"

  **The Trap:**
  If he sticks to his history, he has to say Dave wanted to bet. Because in every other case, Tom dismissed the "I didn't want this" complaint (the uncle's loathing, the runner's agony) in favor of the action. If he suddenly respects Dave's *past* wish over Dave's *current* action, he admits that **competence matters more than behavior.**

  And if competence matters more than behavior, his verdict on your aunt is wrong.
