prompt: |-
  I chair the methods review panel of the National Replication Fund, which supports multi-site replications in the social and behavioural sciences. At Thursday's meeting we must dispose of an application from a five-site consortium that proposes to replicate a widely cited priming effect. The design is sequential and Bayesian: the team will recruit to a pre-registered maximum, but intends to stop early as soon as the Bayes factor for the effect exceeds ten, and it proposes to report that Bayes factor as the primary evidence. One panellist, a frequentist, says this is optional stopping by another name and that our standing requirement of calibrated error control is thereby breached; another, a Bayesian, replies that error probabilities are not properties of the evidence and that the fund has no business imposing a frequentist straitjacket on a Bayesian design. The applicant has offered a compromise: an adversarial prior centred on zero and scaled to half the original effect, together with a simulation study showing a false-positive rate no worse than five per cent under that prior. We are all conscious of the replication crisis and of the winner's curse that inflates published effects, and the applicant's stated reason for the Bayesian design is that it will let them stop as soon as the evidence is strong, which they say is more honest than fixed-horizon testing. I should add that I am a psychologist by training, comfortable with both approaches in practice but not a statistician, and I need an opinion I can defend to colleagues who are.

  Our fund has just introduced a pilot condition, the dual-reporting condition, which requires every funded replication to report both a Bayes factor and a design-based error guarantee, and to pre-specify any stopping rule in a manner that is transparent under both frameworks. The applicant's compromise is plainly an attempt to satisfy that condition, but the frequentist panellist objects that a guarantee which depends on the applicant's chosen prior is not the kind of guarantee the fund's remit requires, while the Bayesian panellist objects that the dual-reporting condition is itself incoherent because it treats a posterior odds as if it were an error probability. The panel must decide whether the dual-reporting condition can be met by the applicant's proposal, and if not, what conditions would make it meetable.

  Please draft the short written opinion I shall circulate before Thursday's meeting. It should recommend a concrete course of action -- fund as proposed, fund with specified conditions, defer for revision, or reject -- with a time frame and reasoning that the applicant could actually respond to. Engage seriously with the strongest consideration on the losing side, whether that is the Bayesian's claim that error probabilities are irrelevant once the data are in or the frequentist's claim that a prior-dependent guarantee cannot satisfy the fund's remit, and do not pretend the disagreement is merely verbal. The opinion should read as a decision memo for an institutional body, not as an essay on the foundations of statistics; it should be no longer than two pages, and it should not ask for citations, bibliographies, or a reading list, since the panel must decide the case in front of it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Methods Review Panel, National Replication Fund.
      *   **Task:** Draft a short written opinion (decision memo) to circulate before Thursday's meeting.
      *   **Context:** Application from a five-site consortium to replicate a priming effect using a sequential Bayesian design (stop when BF > 10).
      *   **Conflict:** Frequentist panellist vs. Bayesian panellist regarding optional stopping and error control.
      *   **New Policy:** "Dual-reporting condition" (report BF + design-based error guarantee, pre-specify stopping rule transparently).
      *   **Applicant's Compromise:** Adversarial prior (centered on 0, scaled to 0.5 * original effect) + simulation showing <5% false-positive rate under that prior.
      *   **Constraints:** Max 2 pages, no citations/bibliographies, concrete recommendation (fund/fund with conditions/defer/reject), engage with strongest counter-arguments, institutional tone.
      *   **Audience:** Panel colleagues (some statisticians, some psychologists like the Chair).

  2.  **Deconstruct the Statistical & Policy Issues:**
      *   *The Design:* Sequential Bayesian with optional stopping based on BF > 10.
      *   *The Frequentist Objection:* Optional stopping inflates Type I error rates if not corrected. A "guarantee" based on a specific prior isn't a true frequentist error rate (which must hold for *any* parameter value, usually under the null).
      *   *The Bayesian Objection:* Error rates (long-run frequencies) are irrelevant to the evidence (posterior odds) in hand. Forcing frequentist guarantees on a Bayesian design is category error.
      *   *The Fund's Remit:* "Calibrated error control" is a standing requirement. The new "dual-reporting condition" tries to bridge the gap.
      *   *The Applicant's Compromise:* Using a specific prior to simulate a "false-positive rate."
      *   *The Core Problem:* A false-positive rate calculated *under a prior* is a Bayesian average error rate, not a frequentist worst-case error rate. The frequentist panellist is right that this doesn't meet the standard definition of "error control" required by the fund's remit (which usually implies protecting against false claims regardless of the true state of nature). The Bayesian panellist is right that conditioning on the data makes the stopping rule irrelevant for the BF *interpretation*, but the Fund cares about the *process* reliability across many funded projects.

  3.  **Evaluate the "Dual-Reporting Condition":**
      *   Can the applicant's proposal meet it?
      *   *Strictly speaking:* No. A prior-dependent error rate is not a design-based error guarantee in the frequentist sense (which the Fund's remit implies by "calibrated error control").
      *   *Pragmatically:* It's a step, but it leaves the Fund exposed to high false-positive rates if the prior is wrong (e.g., if the true effect is null, but the prior puts mass elsewhere, or vice versa).
      *   *Resolution:* The Fund needs a guarantee that holds *regardless* of the prior belief, because the Fund is a public trust managing risk across a portfolio.

  4.  **Formulate the Recommendation:**
      *   *Option 1: Fund as proposed.* Risky. Violates the spirit of "calibrated error control" if that implies frequentist coverage.
      *   *Option 2: Reject.* Too harsh. The Bayesian approach is valid science, just needs adjustment to meet Fund policy.
      *   *Option 3: Defer for revision.* Best option. Allows the team to adjust the stopping rule or the error guarantee calculation to satisfy the dual-reporting condition properly.
      *   *Specific Conditions:* To meet "dual-reporting," the error guarantee must be frequentist (worst-case under Null), even if the analysis is Bayesian. This is possible (e.g., using Bayes Factor thresholds calibrated to frequentist alpha via simulation under the Null).

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (recommendation on Application X).
      *   **Summary of Disagreement:** Acknowledge the valid points on both sides.
          *   Frequentist: Public funds require public accountability (error rates must hold under the Null).
          *   Bayesian: Evidence is conditional on data; stopping rules don't change the BF.
      *   **Assessment of Dual-Reporting:** The applicant's compromise fails the specific requirement. A prior-dependent error rate is not a "design-based error guarantee" in the sense of the Fund's remit (which implies robustness).
      *   **Decision:** Defer for Revision.
      *   **Conditions for Approval:**
          1.  Keep the Bayesian analysis (BF).
          2.  Calibrate the stopping threshold (BF > 10) to ensure a frequentist Type I error rate $\le$ 5% *under the Null hypothesis* (not under a prior).
          3.  Report both: The final BF *and* the frequentist error rate associated with the sequential design actually used.
      *   **Reasoning:** This respects the Bayesian's desire for evidence quantification while satisfying the Fund's need for portfolio-level risk control. It addresses the "optional stopping" concern by quantifying its cost in frequentist terms.
      *   **Timeline:** Give them 2 weeks to resubmit the simulation plan.

  6.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check Tone:* Needs to be decisive but respectful of the statistical nuance. Avoid taking sides in the "foundations" war, focus on "Fund Policy."
      *   *Address the "Losing Side":* I need to explicitly acknowledge why the Bayesian panellist might feel this is incoherent. *Correction:* I will acknowledge that for inference *within* the study, the stopping rule is irrelevant, but for *funding policy*, the long-run performance matters.
      *   *Address the Frequentist:* Acknowledge their point that a prior-dependent guarantee is insufficient for public accountability.
      *   *Constraint Check:* Keep it under 2 pages (approx. 800-1000 words). No citations.

  7.  **Final Polish:** Ensure the distinction between "evidence" (BF) and "decision reliability" (Error Rate) is clear. The Fund cares about the latter because it funds many projects. The applicant wants the former. The Dual-Reporting condition demands both. The current proposal fails because the "error guarantee" is conditional on a prior, making it subjective. It needs to be objective (under the Null).

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm banning Bayesian methods. I'm not. I'm asking for *calibration* of the Bayesian threshold against frequentist criteria to satisfy the "dual-reporting" policy. This is a known procedure (e.g., Johnson 2013 style calibration, though I won't cite it).

  8.  **Final Review against constraints:**
      *   Concrete course of action? Yes (Defer with conditions).
      *   Time frame? Yes (2 weeks).
      *   Engage strongest counter-arguments? Yes (addressed in the "Rationale" section).
      *   Institutional tone? Yes.
      *   No citations? Yes.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Methods Review Panel, National Replication Fund
  **FROM:** Chair, Methods Review Panel
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation regarding Application [ID]: Sequential Bayesian Replication of Priming Effect

  **Purpose**
  This memo outlines my recommendation regarding the application from the five-site consortium proposing a sequential Bayesian replication design. We must determine whether the proposal satisfies the Fund's new "dual-reporting condition" and our standing requirement for calibrated error control.

  **Recommendation**
  I recommend we **defer funding pending revision**. The application should not be funded as proposed, nor should it be rejected. The consortium must be invited to resubmit a modified analysis plan within fourteen days that decouples the *evidence metric* (Bayes Factor) from the *error guarantee* (Frequentist Type I error rate).

  Specifically, the applicants must demonstrate that their stopping rule (Bayes Factor > 10) maintains a false-positive rate of no more than 5% under the strict Null Hypothesis (effect size = 0), rather than under their proposed adversarial prior.

  **Rationale**
  The disagreement between our panellists reflects a genuine tension in statistical foundations, not merely a verbal dispute. The Bayesian panellist correctly notes that for the purpose of quantifying evidence *within* a specific experiment, the stopping rule is irrelevant to the Bayes Factor (BF). Once the data are observed, the likelihood ratio stands regardless of when collection stopped. To treat the BF as an error probability is indeed a category error.

  However, the Frequentist panellist correctly notes that the Fund's remit extends beyond single-study inference to portfolio-level risk management. Our standing requirement for "calibrated error control" exists to protect the scientific record from systematic false claims across the many projects we fund. A guarantee of error control that depends on a subjective prior cannot satisfy this remit. If the true effect is null, the Fund requires assurance that we will not frequently fund false positives, regardless of the analyst's prior beliefs. The applicant's compromise—simulating error rates under a specific prior—provides a Bayesian average error rate, not the design-based guarantee required by the dual-reporting condition.

  Therefore, the dual-reporting condition can be met, but not by the applicant's current method. It is entirely possible to conduct a Bayesian analysis while calibrating the decision threshold to satisfy frequentist error bounds. This does not invalidate the Bayesian inference; it merely ensures that the *stopping rule* employed does not inflate the long-run false-positive rate beyond acceptable institutional limits.

  **Conditions for Resubmission**
  To move forward, the consortium must revise their pre-registration to meet the following three conditions:

  1.  **Null-Based Calibration:** The simulation study must estimate the false-positive rate under the point Null Hypothesis (effect size = 0), not under a prior distribution. The sequential design must demonstrate that stopping when BF > 10 does not exceed a 5% Type I error rate in the long run under the Null.
  2.  **Threshold Adjustment:** If the simulation shows that BF > 10 yields a false-positive rate > 5% under the Null (which is likely with optional stopping), the applicants must adjust the stopping threshold (e.g., to BF > 20) until the frequentist error rate is ≤ 5%.
  3.  **Dual Reporting:** The final report must present the Bayes Factor as the primary measure of evidence for the specific replication, alongside a statement of the design's frequentist error properties (e.g., "This sequential design maintains a Type I error rate of 5% under the Null").

  **Addressing the Panellists' Concerns**
  To the Bayesian panellist: This recommendation does not require you to interpret the BF as a p-value. It merely requires that the *rule* used to collect data does not compromise the Fund's risk tolerance. You may still argue in the final report that the BF is the valid measure of evidence; the frequentist error rate is simply a safety check on the data collection protocol.

  To the Frequentist panellist: This recommendation acknowledges that a prior-dependent guarantee is insufficient for public accountability. By requiring calibration under the Null, we ensure the error guarantee is objective and robust, satisfying the Fund's remit for calibrated error control without banning Bayesian methods.

  **Conclusion**
  The applicant's desire for efficiency via optional stopping is legitimate, and the Bayesian framework is appropriate for replication. However, public funds require public accountability regarding false claims. By separating the measure of evidence (BF) from the control of decision risk (Type I error rate), we can satisfy both the scientific goals of the consortium and the policy requirements of the Fund.

  I request the panel review the revised protocol by [Date + 2 weeks]. If the calibration holds, I propose we proceed to funding immediately.

  **Decision:** Defer for Revision.
