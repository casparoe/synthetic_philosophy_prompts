          *   *Repair:* Abandon 7's claim that this modeling *solves* the paradox, or abandon 4's claim that it's not an artifact. Given Sen's literature, the paradox holds even with partitions if preferences are meddlesome.
          *   *Cost:* If you keep 7, you must admit the paradox is a formalization artifact (abandon 4). If you keep 4, you must admit 7 doesn't solve it without 5.

      *   **Tension D: Weak Pareto (2) vs. Rights as Constraints (8).**
          *   *Analysis:* If everyone prefers $x$ to $y$ (WP), but $y$ is in $A$'s protected domain and $A$ prefers $y$, Rights say choose $y$. WP says choose $x$.
