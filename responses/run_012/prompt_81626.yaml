      *   *5. Preference Restriction:* Exclude "meddlesome" preferences (other-regarding preferences over others' domains).
      *   *6. Justification for Restriction:* Meddlesome preferences aren't about well-being; they are exercises of authority. Welfarism doesn't count authority.
      *   *7. Modeling Rights:* Rights = partition of issue space (cells), not pairs of alternatives.
      *   *8. Nature of Rights:* Rights are side constraints, not entries in a SWF.

