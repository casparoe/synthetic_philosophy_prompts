answer: |-
  Colleagues, I recommend that we approve this protocol contingent on specific modifications regarding session duration, frequency, and physiological monitoring, rather than approving it as submitted or rejecting it outright. My position is that we must ask the lab to change the protocol to include a hard ceiling on daily stimulation and mandatory welfare checks, because while our current guidelines may not explicitly name this category of harm, they charge us with preventing distress, and the risk of biological neglect arising from compulsive behaviour constitutes distress even in the absence of pain. I do not believe the right answer is to defer to a future amendment of the guidelines, because that would leave the current cohort of animals unprotected against a form of exploitation that our mandate implies we should prevent, even if the conceptual vocabulary for it is still developing within our committee.

  The investigators argue that because the animal works for the stimulation, it wants the stimulation, and therefore receives a benefit. This inference relies on a conception of welfare as preference satisfaction, where the act of choosing is itself the metric of the good. However, two theoretical considerations suggest this metric is unreliable in this specific paradigm. The first is the structural similarity between this setup and the wireheading problem in reinforcement learning. In natural environments, reward signals are proxies for fitness-enhancing states like caloric intake or social bonding. Here, the experimenter has placed the reward channel inside the animal's head, allowing the animal to intervene directly on the signal rather than the state of the world it usually represents. When an agent learns to maximize the signal rather than the underlying state, its behaviour ceases to be a trustworthy indicator of welfare. The fact that these animals will sometimes work to turn the stimulation off as well as on suggests that the stimulation is not a univocal good but a destabilizing force on the decision-making architecture. If the lever press is not a stable preference but a hijacked feedback loop, we cannot treat the animal's persistence as evidence of benefit.

  The second consideration is the dissociation between the motivational and hedonic components of reward, often described as wanting versus liking. Intracranial self-stimulation is a paradigm case of high wanting potentially decoupled from liking. If the stimulation drives the motivational system without providing corresponding hedonic satisfaction, the animal is in a state of compulsion rather than enjoyment. In this scenario, the investigators' claim that we are preventing harm by allowing unlimited access is inverted; we would be permitting the animal to be pulled by a mechanism that offers no restorative satisfaction. This breaks the inference from work to welfare. However, I must acknowledge the strongest case for the view I am rejecting, which is the investigators' argument that imposing a ceiling is an anthropomorphic imposition of human values on a rat's life. If welfare consists strictly in preference satisfaction, then a rat that wants stimulation and gets it is better off than a rat that wants it and is stopped, regardless of the hedonic tone. Furthermore, a rat's life is predominantly constituted by pursuit, and an animal whose pursuit is unusually intense and self-directed may not be worse off in any meaningful biological sense, even if the object of pursuit is artificial. To reject this protocol or constrain it heavily is to assume that naturalness is a component of welfare, a claim that is philosophically contentious and not explicitly codified in our guidelines. There is a genuine risk that we are projecting human anxieties about artificiality onto a subject for whom the distinction between natural and artificial reward channels may be nonexistent.

  Despite this uncertainty, we cannot approve the protocol as submitted because the risk of neglect is tangible and measurable within our current mandate. If the wanting system is hijacked, the animal may neglect eating and drinking not because it is in pain, but because the opportunity cost of leaving the lever is too high. This neglect results in weight loss and physiological stress, which falls squarely under distress. Therefore, we should require the lab to implement a hard limit of two sessions per day, each lasting no more than sixty minutes, with a minimum inter-session interval of four hours to ensure opportunities for feeding and drinking. We must also require daily logging of body weight and food intake, with a removal criterion set at fifteen percent weight loss from baseline, and a mandatory review point after the first five animals have completed the protocol to assess whether these limits are sufficient to prevent neglect. These conditions are specific enough to be monitored and compliance can be verified through lab notebooks and veterinary records.

  Finally, while I am arguing for protocol changes now, I believe this case exposes a limitation in our guidelines that ought to be amended in the future. Our current framework is built around pain and distress, but this paradigm suggests a category of harm that is neither painful nor necessarily distressing in the moment, but rather a corruption of agency that leads to long-term welfare deficits. We are currently addressing this by treating the downstream effects (neglect) as the proxy for harm, but we should eventually discuss whether our committee should adopt a preference-satisfaction model or a hedonic model explicitly, as our current hybrid approach leaves us vulnerable to exactly this kind of uncertainty. For now, however, we have a duty to the animals in front of us, and the precautionary principle dictates that we constrain the protocol until we have evidence that the animals maintain physiological health despite the compulsive nature of the task. I urge you to support these conditions so that we can allow the science to proceed without abdicating our responsibility to prevent states where an animal's behaviour is decoupled from its welfare.
