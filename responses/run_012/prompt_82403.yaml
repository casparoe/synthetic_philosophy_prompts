answer: |-
  Here are nine questions designed to tighten the logical noose around the "therapy vs. theory" defense, moving from definitions to metaphysics, and ending on hermeneutics. Each includes a follow-up tailored to her likely evasive maneuvers.

  **1. The Definition of "Control"**
  You argue that the popular "Dichotomy of Control" is a distortion, and that *eph' hēmin* ("up to us") refers to ownership or attribution rather than causal control. But the popular slogan is ubiquitous for a reason: it gives the student a clear heuristic. If we strip the word "control" from the doctrine, what precisely falls inside the circle of "up to us" that wouldn't fall inside the circle of "ownership"? If there is no difference in extension, what work is the word "control" doing in the popular version that your version forbids?

  *   **Follow-up:** She will likely say that "control" implies a causal power we don't have, leading to frustration. Press her: "But if I 'own' a result I cannot causally influence, in what sense am I answerable for it? Does your view not risk making moral responsibility detached from causal agency?"

  **2. The Triviality Objection**
  Critics of your reading often argue that if "up to us" means only "what belongs to my agency," the doctrine becomes trivial. Everyone agrees I am the one who judges; the problem is I feel I *should* be able to control the outcome. Does your distinction actually solve the student's anxiety, or does it merely rename the problem? If I own my failure but cannot control it, haven't I just traded frustration for guilt?

  *   **Follow-up:** She will likely argue that ownership removes the sting of failure. Press her: "So the benefit is purely psychological? If so, does it matter if the underlying claim about agency is metaphysically true, or only that the student believes it?"

  **3. The Boundary of the Dichotomy**
  Let's test the exhaustiveness of your boundary. Where do habits, character traits, or sustained attention fall? I cannot, in this instant, causally control my temper or my focus, yet Stoics say we are responsible for them. If these fall outside "up to us" because they aren't fully under causal command, your dichotomy seems to exclude the very things we need to train. If they fall inside, how do you define "ownership" without smuggling "control" back in?

  *   **Follow-up:** She will likely say these are "developed over time" through assents. Press her: "But the advice 'attend only to what is up to you' is meant for the moment of action. In that moment, is my character up to me? If not, does the advice collapse when I need it most?"

  **4. Mechanics of the Reserve Clause**
  You propose the "Reserve Clause" (*hupexairesis*)—"I will do this, if nothing prevents"—as the true therapeutic core. Walk me through the deliberation of a Stoic acting on your view. When I decide to speak out against an injustice, do I actively hold the proviso "if nothing prevents" in my mind, or is that a background attitude? If I hold it actively, does it not weaken my resolve? If I don't, how is it functioning as a discipline?

  *   **Follow-up:** She will likely say it's a background attitude that prevents disappointment. Press her: "If it's background, how does it stop me from feeling betrayed by fate when I fail? If it's foreground, doesn't it make me a hesitant actor? How do you avoid the charge that this makes deliberation idle?"

  **5. Technique vs. Thesis**
  Following on that: Is the Reserve Clause a technique for managing expectation, or is it a thesis about how the world works? If it's just a technique, I can use it while believing I *should* have controlled the outcome. If it's a thesis, it claims that outcomes are genuinely not mine to claim. Which is it?

  *   **Follow-up:** She will likely say it's a technique grounded in physics. Press her: "If it's grounded in physics, then the physics must be true for the technique to be rational. You can't have it both ways: either this is a cognitive tool that works even if false, or it's a truth claim that risks being wrong."

  **6. The "Therapy vs. Theory" Defense**
  You have a standard defense against these tensions: that critics confuse the school's therapeutic exercises with its theory of agency. But we've just discussed boundaries, metaphysics, and deliberation. If the theory of agency is incoherent—as the determinism objection suggests—can the therapy actually function? Or are you arguing that Epictetus taught a "noble lie" to beginners?

  *   **Follow-up:** She will likely retreat to "the goal is tranquility, not metaphysical precision." Press her: "But Stoicism claims to be a philosophy of truth, not just CBT. If the map of agency you give the student doesn't match the territory of fate, aren't you advising them to navigate by a false map?"

  **7. Determinism and Assent**
  Let's press that map. The Stoics are determinists; everything is fated. If my assent is fated, in what sense is it "mine" to own? The "control" reading at least tries to carve out a causal pocket for the will. Your "ownership" reading seems to make the problem harder: I own an assent I could not have withheld. Does your view make the tension with determinism worse, not better?

  *   **Follow-up:** She will likely argue that compatibilism solves this. Press her: "Epictetus doesn't sound like a compatibilist; he sounds like someone who thinks we are free. If your reading makes him a compatibilist, aren't you smoothing over a genuine tension in the text to save the system?"

  **8. Politics and Quietism**
  A common political objection to the Dichotomy is that it licenses quietism: if only my judgment is up to me, why fight systemic injustice? How does your "ownership" model square with Stoic cosmopolitanism? If I own my attempt to help but cannot control the help, does that not encourage me to withdraw from the political sphere where control is necessary for success?

  *   **Follow-up:** She will likely say the Stoic acts for the common good regardless of outcome. Press her: "But if the 'Dichotomy of Control' warns us not to invest in outcomes, doesn't that drain the urgency from political action? How do you motivate a student to risk their life for a result they are trained to regard as 'not up to them'?"

  **9. Modern Revival and Hermeneutics**
  Finally, the Modern Stoic revival is built on the Dichotomy of Control. If your reading is correct, the movement is built on a distortion. Is Modern Stoicism therefore illegitimate, or is the popular dichotomy a legitimate development—a simplification for a secular age that dropped the physics? And ultimately: is the ownership/control distinction you're drawing found in Epictetus, or is it your own philosophical correction imported into the text to save him from himself?

  *   **Follow-up:** She will likely say she is "clarifying" Epictetus. Press her: "Clarifying implies the truth was there. Correcting implies the truth was missing. If Epictetus consistently used language of power and ability, and you reinterpret that as ownership, are you recovering his voice or silencing it to make it palatable for us?"
