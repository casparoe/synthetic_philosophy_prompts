      **Falsifying Observation:** "Adversarial perturbation changes output without shifting attention weights."
      **Status:** Active. Escalation Step 2 (Prompt Template) currently open.

      **B.2 Claim:** "Safety filters prevent harmful generation."
      **Falsifying Observation:** "Successful jailbreak via token smuggling."
      **Status:** Active. Escalation Step 1 (Data Pipeline) currently open.

