  RFC 2048-B: Implementation of Falsifiability Gate for External and Internal Claims
  Author: J. Vane, Platform Integrity
  Date: 2023-10-27
  Status: Draft

  1. Summary
  This document proposes the Falsifiability Gate, a mandatory procedural step for all engineering and research claims destined for internal memos, customer emails, or sales decks. Before a claim is published, the owning team must register a specific observation that would demonstrate the claim is false. Claims without a registered falsifying observation are classified as non-scientific and may not be distributed. This policy aligns company output with established demarcation standards.

  2. Motivation
  Current communication practices allow assertions regarding model capabilities to circulate without defined failure conditions. This exposes the organization to reputational risk when claims behave like non-science. By requiring a pre-registered falsifying observation, we ensure that all statements are grounded in empirical risk. This does not guarantee claims are true, but it guarantees they are scientific. A claim that cannot be false is not a claim; it is marketing. The Gate separates valid engineering assertions from metaphysical speculation.

  3. Definitions
  3.1 Claim: Any assertion regarding model performance, architecture, or behavior. Examples include "Chain of Thought tokens reflect internal reasoning states" or "Benchmark X measures real-world utility."
  3.2 Falsifying Observation: A specific, observable state of the world or system metric that, if observed, contradicts the Claim.
  3.3 Gate: The administrative checkpoint where the Claim and Falsifying Observation are logged.

  4. Policy
  4.1 Registration: Prior to publication, the claim owner must submit the Claim and the Falsifying Observation to the Integrity Dashboard.
  4.2 Validation: The Integrity Team verifies that the Observation is logically capable of contradicting the Claim. Vague observations are rejected. Specific thresholds are required.
  4.3 Publication: Once validated, the Claim receives a Gate ID. This ID must be appended to the footer of any document containing the Claim.
  4.4 Claim Classification: Claims regarding core business value require Level 3 Validation. These claims often involve complex auxiliary assumptions regarding data distribution and metric validity. Teams are advised to register observations that are unlikely to occur under normal operating conditions to minimize administrative overhead.

  5. Exception Handling and Escalation
  5.1 Normal Operations: During the monitoring period, if the Falsifying Observation occurs, the Claim is initially flagged as Anomalous. In standard engineering practice, anomalies are treated as tickets rather than refutations. The owning team may open a troubleshooting ticket to investigate the discrepancy.
  5.2 Escalation Ladder: If the Claim is challenged by the Observation, the team may attribute the failure to auxiliary components in the following order. Each step requires a separate ticket resolution before the Claim itself is considered falsified.
  1. Data Pipeline: The eval set was contaminated or mislabeled.
  2. Prompt Template: The inference prompt drifted from the registration spec.
  3. Metric Definition: The metric failed to capture the intended construct.
  4. Test Harness: The logging infrastructure recorded the observation incorrectly.
  5. The Claim: Only if steps 1-4 are ruled out is the Claim retired.
  5.3 Load-Bearing Assumptions: Certain assumptions regarding architecture stability are protected from revision to ensure system continuity. Adjusting these assumptions requires VP approval. This prevents routine noise from rescuing a dying theory while allowing legitimately adjusting a supporting assumption when evidence warrants. In practice, this distinction is managed by the ticket priority field.

  6. Exempt Artifacts
  The following artifacts are exempt from the Falsifiability Gate due to their foundational nature:
  1. Roadmap Projections.
  2. Core Architecture Documents.
  3. Investor Relations Materials.
  4. This RFC.
  Exemptions are granted because these documents establish the conditions under which falsification is possible, rather than making claims within those conditions.

  7. Repeal Condition
  This policy shall remain in effect until a Claim is positively verified as universally true. Since empirical verification is asymptotic, this condition ensures policy stability.

  Appendix A: Dissent
  The following comment was recorded during the review period by L. K., Staff Engineer:

  > "This procedure treats probability mass as binary. When a prediction fails, my posterior probability for the theory decreases, but it does not hit zero. The Escalation Ladder effectively allows me to shift the probability mass to the auxiliary hypotheses indefinitely. We are not building science; we are building a mechanism to prevent priors from ever collapsing. I cannot register a bold prediction twice because the paperwork implies I was wrong the first time. We will only solve puzzles now."
