answer: |-
  The whiteboard was full of rotation matrices that looked like spiderwebs. Rhea stood with her arms crossed, staring at the draft open on the monitor. Silas was spinning a pen, leaning back in a chair that cost more than his first car.

  "You're burying the Decoy result," Silas said. "It's the headline. 'Orthogonal Rotation Preserves Function, Erases Features.' That's the story."

  "It's not the story because it's a trick," Rhea said. "You inserted a rotation matrix $Q$ into layer $L$ and $Q^T$ into $L+1$. Of course the function is invariant. But if you probe the activations in $L$, you get garbage. You're saying because the probe reads garbage, the feature isn't real?"

  "I'm saying the feature was never in the neurons to begin with. It was in the basis you chose to look at them. You trained an SAE on the original net, found a latent that looks like 'remainder mod 5'. You rotate the space, train a new SAE, and now the latents look like… what? Noise? Clusters of nothing? The network computes the same addition, bit for bit. If the feature was real, it should survive the rotation."

  "The feature *does* survive the rotation. The *vector* changes. If I patch the original direction $d$ into the decoy net, nothing happens. Performance doesn't drop. But if I patch the rotated direction $Qd$, it breaks. That proves the specific direction is causal."

  Silas stopped spinning the pen. "It proves the direction is causal *relative to the downstream weights*. The downstream weights are also rotated. You're treating the activation vector as if it carries meaning intrinsically. It doesn't. It's a key that only fits because the lock was turned to match it. Change the lock, change the key. The 'feature' is the relationship, not the vector."

  "So nothing is real except the input-output map?"

  "Everything else is a coordinate system. You're reifying the grid lines."

  "Then explain the Random SAE result," Rhea said, tapping the screen. "We trained an SAE on an untrained, randomly initialized transformer. Same architecture. Same data distribution. The labelers couldn't distinguish the latents from the trained net's latents when we hid the inputs. They called them 'clean,' 'interpretable,' 'structured.' If features are just stories we tell about functions, why does the random net— which computes nothing but noise—yield the same stories?"

  "Because the SAE isn't finding features in the network. It's finding features in the data, projected through a random matrix. The structure you're seeing is the structure of modular addition inputs, not the structure of the model. The SAE is compressing the data manifold. It doesn't care if the network uses that compression to compute anything."

  "But in the trained net, ablating that latent kills the addition. In the random net, ablating the 'identical' latent does nothing to the output distribution because there's no function to break. There is a difference. One set of features has causal leverage. The other is pareidolia."

  "Causal leverage is a bar for utility, not ontology," Silas countered. "You can find a lever that breaks a machine without understanding the machine's representation. I can smash a gear with a hammer. The hammer is causal. Is the hammer a feature of the clock? Your realism conflates 'useful intervention point' with 'semantic variable stored in the net.'"

  "Fine. Then why does transfer work?" Rhea pushed off the desk. "Seed 42 and Seed 108. Different initializations, different data orderings. They converge to the same loss. We find a 'mod 5' direction in 42. We patch it into 108. It works. It restores performance. If it's all just arbitrary basis choices relative to downstream weights, why do independent training runs land on compatible bases? Why does the key from Lock A open Lock B?"

  "Because they're solving the same optimization problem. They're converging on the same function. The geometry of the loss landscape funnels them into similar configurations. It doesn't mean they found the same *object*. It means they found the same *solution*."

  "A solution represented by the same vector direction across seeds isn't a coincidence, Silas. It's evidence of a shared internal ontology. The network isn't just learning $f(x)$. It's learning an intermediate representation $R$ where $R$ decomposes into features. The fact that $R$ is stable across seeds means $R$ is determined by the task, not the seed."

  "Stable enough to patch, maybe. But look at the Decoy again. You can rotate Seed 42 into a configuration where the 'mod 5' direction is now spread across fifty dimensions. You can't patch it anymore. Did the feature disappear? Or did you just lose the coordinate system?"

  "If I have to rotate the basis to find it, it's still there. It's a subspace."

  "And who decides the rotation? You do. The SAE does. The random seed of the dictionary learning does. You're saying the feature is real, but it's invisible unless we choose the right lens. That's not realism. That's idealism with extra steps."

  Rhea walked to the whiteboard, picked up a marker. "Here's where you're wrong. You think the SAE is just a lens. It's a discovery procedure. If the feature is real, the SAE should find it consistently. In the Decoy net, the SAE finds *different* features. Why? Because you broke the alignment between the natural basis of the computation and the activation basis. You forced the network to compute in a code it wasn't optimized to represent cleanly. The sparsity penalty on the SAE fights the rotation. The fact that the Decoy net's features look 'messier' or 'different' proves the original basis was special. It was the one the network preferred."

  "The network didn't prefer it. Gradient descent found it. Another run of gradient descent on the decoy architecture would find the rotated basis just as easily. The 'preference' is path dependence, not truth."

  "Then why does the original basis transfer and the decoy basis doesn't?"

  "Because the original basis is the local minimum everyone falls into by default. It's a focal point. Schelling point. Doesn't make it true. Just makes it convenient."

  Rhea capped the marker. "So we're stuck. You think features are tools for us to intervene. I think features are structures the network uses to compute."

  "I think 'structure' is doing too much work. If I can rotate it away without changing the computation, it's not structure. It's gauge freedom."

  "And I think if I can patch it across seeds and break the model, it's not gauge. It's load-bearing."

  They stood in the silence of the lab. The hum of the servers was the only sound.

  "Okay," Silas said, softer. "Concession. You're right about the transfer. If patching across seeds works reliably, then there is some invariant structure there. I can't dismiss it as pure analyst artifact. The network is doing something consistent that allows the transfer. I'll grant that the *causal role* is real, even if the vector isn't."

  "And I'll grant you the Decoy," Rhea said. "The specific vector isn't the feature. The feature is the subspace, or the equivalence class under rotation. I've been writing the draft like the direction itself is the atom. It's not. It's the role the direction plays relative to the next layer. If I change the next layer, the feature moves. So the feature isn't local to the activation."

  "Fine. But the Random SAE still bugs me," Silas said. "If the trained net's features are real causal structures, why does the random net look just as clean to humans? What are we actually measuring when we say 'interpretable'?"

  "That's the mystery," Rhea said. "I can't make sense of why the random net yields high scores on human interpretability metrics. If features are for computation, random weights shouldn't have them. Unless 'interpretability' is just a measure of how well the SAE compresses the data distribution, regardless of the network. Which means our evals are broken."

  "And my mystery," Silas said, "is the transfer. If it's all gauge freedom, why does the gauge align across seeds? There's a constraint there I don't have a theory for. Maybe the loss landscape forces not just the function, but the representation, into a specific shape. But I can't prove it."

  "So we write it up as a tension," Rhea said. "Causal stability vs. Basis arbitrariness."

  "We write it up as a question," Silas corrected. "Are we finding joints in nature, or are we carving them?"

  "Both," Rhea said. "The knife is ours. The meat is theirs."

  Silas smiled, tired. "Don't put that in the abstract."

  "Too late."
