      *   **S (Instrumentalist):** Let's call him **Silas**. He believes features are compressions useful for humans, not necessarily mirrors of the machine's "mind." He needs to argue that if the function is invariant, the internal structure is underdetermined.

  3.  **Drafting - Section by Section:**

