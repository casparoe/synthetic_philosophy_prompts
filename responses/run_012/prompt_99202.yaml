prompt: |-
  Write an essay on the following controversy in the theory of convention. On David Lewis's account, a convention is a regularity in behaviour that holds because each party expects the others to conform — and knows that they expect the same of everyone — and prefers to conform on condition that the others do. On this picture the authority of a convention appears purely instrumental: one ought to conform because conforming is the best way to get what one wants from others, and only for so long as it is. Yet the conventions we live by are not merely predictable; breaches of them are resented and criticised, and the criticism does not sound like advice about prudence. Evolutionary and game-theoretic stories about how norms emerge sharpen the difficulty rather than ease it, for they explain why a regularity would become stable without saying what is owed to those who have come to rely on it. Weigh the considerations on both sides and reach a verdict: is the normative 'ought' of a convention reducible to the instrumental 'ought' of someone who expects others to conform, or does it require something further? In defending your verdict, address at least these three matters: whether the arbitrariness of a convention — that either side of the road would have done — tells against its having genuine normative weight; whether the prior conformity of others gives one a reason to conform that is not merely the reason of continuing coordination; and whether a regularity that holds only because breaches are sanctioned is a convention at all, or something else wearing the name. Argue in your own terms; no survey of the literature or list of references is wanted.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**
      *   **Topic:** The controversy in the theory of convention, specifically focusing on David Lewis's account vs. the normative force of conventions.
      *   **Lewis's Account:** Convention = regularity in behavior based on mutual expectations and conditional preferences (coordination equilibrium). Authority is purely instrumental (prudential).
      *   **The Problem:** Real-world conventions involve resentment, criticism, and a sense of obligation that doesn't sound like prudential advice. Evolutionary/game-theoretic accounts explain stability but not *obligation* (what is *owed*).
      *   **Task:** Weigh considerations and reach a verdict: Is the normative 'ought' of convention reducible to the instrumental 'ought', or does it require something further?
      *   **Required Elements:**
          1.  Address the *arbitrariness* of convention (does "either side would do" undermine normative weight?).
          2.  Address *prior conformity* (does others' conformity give a non-coordination reason to conform?).
          3.  Address *sanctions* (if a regularity holds only because of sanctions, is it still a convention?).
      *   **Constraint:** Argue in own terms; no survey of literature or list of references.

  2.  **Deconstruct the Core Tension:**
      *   *Side A (Lewis/Instrumental):* Conventions are solutions to coordination problems. I drive on the left because you drive on the left, and I want to not crash. If everyone switched to the right tomorrow, I'd switch too. There is no moral weight, just efficiency.
      *   *Side B (Normative/Non-Reducible):* When you cut in line or drive on the wrong side, we don't just say "that's inefficient"; we say "that's wrong." We feel entitled to expect conformity. There is a sense of fairness or obligation generated by the practice itself.

  3.  **Formulate a Verdict:**
      *   *Option 1:* Pure Lewisian. (Too dismissive of the phenomenology of resentment).
      *   *Option 2:* Pure Normative. (Too mystical, ignores the arbitrary basis).
      *   *Option 3:* Hybrid/Modified. The instrumental basis is the *seed*, but the normative force grows from the *reliance* and *fairness* involved in sustained cooperation.
      *   *Decision:* I will argue that the instrumental 'ought' is necessary but insufficient. The normative 'ought' emerges from the *principle of fairness* triggered by sustained reliance. It requires something further: a recognition of the claim others have on us based on their reliance.

  4.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Define Lewis's view (coordination, expectations, instrumental rationality).
          *   State the problem (the gap between "I want to coordinate" and "You ought to coordinate").
          *   State the thesis: The instrumental account captures the *origin* but misses the *obligation*. The normative 'ought' requires a principle of fairness regarding reliance, not just coordination.

      *   **Point 1: Arbitrariness:**
          *   *Challenge:* If it doesn't matter *which* side we drive on, how can it be *wrong* to choose the other?
          *   *Response:* Arbitrariness applies to the *selection* of the rule, not the *compliance* once selected. The moral weight isn't in the content (left vs. right) but in the *act of coordinating*. Once a focal point is established, violating it exploits the trust of those coordinating.
          *   *Key phrase:* "Arbitrary in origin, binding in practice."

      *   **Point 2: Prior Conformity & Reliance:**
          *   *Challenge:* Lewis says I conform because I expect you to.
          *   *Response:* It's not just prediction; it's *reliance*. When others conform, they restrict their own liberty for the sake of the group. To free-ride is to take advantage of their self-restraint. This generates a duty of fair play. The reason is not just "to avoid a crash" (future) but "because you benefited from their restraint" (past/present).
          *   *Distinction:* Prudence vs. Fairness.

      *   **Point 3: Sanctions:**
          *   *Challenge:* If we punish breaches, is it just fear?
          *   *Response:* If a regularity holds *only* because of sanctions, it's coercion, not convention. But in genuine conventions, sanctions are *reactive* expressions of the normative expectation, not the *cause* of the conformity. We sanction because a norm was violated, not to create the norm. The resentment validates the 'ought'.
          *   *Nuance:* Sanctions uphold the convention, but the convention exists in the mutual recognition of the obligation.

      *   **Conclusion:**
          *   Summarize the argument.
          *   Reiterate verdict: Instrumental rationality explains the *equilibrium*, but moral psychology (fairness/reliance) explains the *authority*.
          *   Final thought: Conventions are the bedrock of social order, transforming "I prefer" into "We owe."

  5.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I avoid listing references? Yes.
      *   *Check:* Did I address all three specific matters? (Arbitrariness, Prior Conformity, Sanctions). Yes.
      *   *Tone:* Philosophical, argumentative, clear.
      *   *Critique of Lewis:* Be fair to Lewis. His account is brilliant for explaining *how* conventions start. Don't trash it, just show its limits regarding *normativity*.
      *   *Clarification on "Ought":* Distinguish between the "ought of prudence" (if you want X, do Y) and the "ought of obligation" (you must do Y, regardless of immediate desire).

  6.  **Final Review against Prompt:**
      *   "Weigh considerations on both sides": Ensure the instrumental view gets a fair hearing before critiquing it.
      *   "Reach a verdict": Make sure the conclusion is decisive.
      *   "Argue in your own terms": Avoid jargon like "common knowledge" unless defined simply. Focus on the concepts.

  7.  **Final Polish:** (Mental check of flow and transitions). Ensure the transition from arbitrariness to reliance to sanctions feels logical. (Arbitrariness sets the stage, Reliance builds the obligation, Sanctions test the nature of that obligation).

  *(Self-Correction during drafting Point 2)*: I need to be careful not to turn this into a full theory of political obligation. Keep it focused on *convention*. The key is the micro-interaction of reliance.

  *(Self-Correction during drafting Point 3)*: Make sure to distinguish between a convention backed by sanctions and a command backed by sanctions. The difference is the *source* of the expectation.

  8.  **Final Output Generation** (Proceed to write the essay based on these thoughts).
answer: |-
  David Lewis's account of convention is a masterpiece of analytical clarity. He defines a convention as a regularity in behavior sustained by a system of mutual expectations and conditional preferences. I drive on the left because I expect you to drive on the left, and I prefer to drive on the left *on the condition* that you do. On this picture, the authority of the convention is exhausted by its utility. I ought to conform because doing so satisfies my desire to coordinate with you. If the utility vanished—if everyone else suddenly switched to the right—my obligation would vanish with it. This instrumental view explains the stability of social habits with elegant precision. However, it fails to capture the moral phenomenology of living within a conventional order. When a convention is breached, we do not merely note a miscalculation; we feel a grievance. We criticize the defector not for being imprudent, but for being unfair. While Lewis correctly identifies the engine that starts a convention, he misidentifies the fuel that sustains its authority. The normative 'ought' of a convention is not reducible to the instrumental 'ought' of coordination; it requires the additional element of a duty of fairness arising from reliance.

  To see why the instrumental account is insufficient, we must first confront the argument from arbitrariness. A defining feature of a Lewisian convention is that it is arbitrary: there is no intrinsic reason to drive on the left rather than the right, provided everyone does the same. Critics argue that this arbitrariness drains the practice of genuine normative weight. If the rule is merely a accidental solution to a coordination problem, how can violating it be a moral wrong rather than a mere error? If I drive on the right in a left-driving country, I have not violated a law of nature or a principle of justice; I have simply chosen the other equally valid equilibrium.

  However, this objection conflates the arbitrariness of the *selection* with the arbitrariness of *compliance*. It is true that the specific content of the convention is arbitrary; society could have coalesced around any number of signals. But once the selection is made and relied upon, the obligation to comply is not arbitrary. The normative weight does not reside in the leftness of the lane, but in the *trust* placed in the lane. When I drive on the left, I am not just avoiding a crash; I is signaling my participation in a shared scheme. To violate the convention is to exploit the predictability of others while exempting oneself from the constraint they accept. The arbitrariness of the origin does not negate the binding nature of the agreement implied by sustained participation. Therefore, arbitrariness tells against the intrinsic value of the rule, but not against the obligatory force of the coordination itself.

  This leads to the second matter: the significance of prior conformity. In Lewis's model, my reason to conform is forward-looking. I conform because I expect you to conform *now* and in the *future*, and I want to coordinate. The past conformity of others is relevant only as evidence of their future behavior. But this ignores the normative power of reliance. When others have conformed to a convention over time, they have restricted their own liberty for the sake of the collective good. They have sacrificed the option to drive on the right so that I might safely drive on the left.

  This creates a reason to conform that is distinct from the reason of continuing coordination. It is the reason of fair play. If I benefit from the self-restraint of others—enjoying the safety and efficiency of the traffic system—while refusing to restrain myself, I am acting as a free-rider. My obligation arises not merely because I want to coordinate, but because I have accepted the benefits of their coordination. This transforms the 'ought' from a hypothetical imperative ("If you want to avoid a crash, drive on the left") to a categorical claim grounded in reciprocity ("You ought to drive on the left because others have done so for your sake"). The prior conformity of others generates a debt of fairness that the purely instrumental model cannot recognize. The instrumentalist sees a pattern of behavior; the normative realist sees a web of mutual obligation woven by that behavior.

  Finally, we must consider the role of sanctions. In the real world, conventions are often policed. We glare at queue-jumpers; we honk at wrong-way drivers. A skeptic might argue that if a regularity holds only because breaches are sanctioned, it is not a convention but a regime of coercion. If I conform only because I fear your resentment, am I not back in the realm of pure prudence? I am merely avoiding the "cost" of social disapproval.

  This objection, however, misunderstands the function of sanctions in a conventional order. In a system of pure coercion, the sanction creates the motivation to obey. In a genuine convention, the sanction is an *expression* of the normative expectation that already exists. We do not resent the queue-jumper merely because they annoyed us; we resent them because they violated a shared standard to which we all subscribe. The anger is the emotional signature of the 'ought'. If the regularity held *only* because of the threat of sanction, it would indeed be coercion. But in paradigmatic conventions, the sanction is secondary. The primary motivation is the recognition of the convention's authority; the sanction is the reactive attitude that confirms the existence of that authority. The fact that we feel entitled to criticize, rather than merely discouraged by the risk of criticism, shows that the 'ought' exceeds the instrumental. We are not advising the defector on how to avoid pain; we are holding them to a standard they acknowledge.

  In verdict, the Lewisian account is necessary but incomplete. It successfully explains the emergence of conventions and the rationality of entering them. It captures the "equilibrium" aspect of social life. But it fails to capture the "obligation" aspect. The instrumental 'ought' explains why I *will* conform, but the normative 'ought' explains why I *should* conform even when I might get away with it.

  The reduction fails because it cannot account for the resentment felt at breaches, which signals a claim of right rather than a prediction of behavior. It cannot account for the duty of fair play generated by the prior reliance of others, which binds us to the past actions of our peers, not just their future predictions. And it cannot distinguish between the coercion of a threat and the enforcement of a shared norm. Conventions begin as solutions to coordination problems, but they mature into moral practices. They transform the calculation of self-interest into the language of duty. To live by a convention is not merely to navigate a world of predictable others; it is to acknowledge a claim they have upon us. The authority of convention is not purely instrumental; it is grounded in the fairness required to sustain the trust upon which social life depends.
