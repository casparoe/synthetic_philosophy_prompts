answer: |-
  Your apartment's boiler fails due to normal wear and tear in January, leaving you without heat in freezing weather; the lease and local law strictly require your landlord to repair it at no cost to you within 24 hours. You call the landlord, who arrives and says, "I can fix this today, but only if you sign this addendum agreeing to waive your security deposit refund when you move out," otherwise he leaves and schedules the repair for next week. You sign the addendum to get the heat, though you would have been physically warmer with the heat than without it, and the landlord did nothing to cause the breakdown.

  **Analysis**

  The **status quo baseline** compares your situation before the offer (freezing, no heat) to your situation after accepting (warm, but no deposit). Since being warm is materially better than freezing, you are better off than you would have been if the offer was never made; therefore, you voluntarily consented to a beneficial deal. The **normative baseline** compares your situation after accepting (warm, no deposit) to what you were already entitled to (warm, plus deposit). Since the landlord was legally obligated to provide the heat regardless of your signature, he effectively held your property hostage to extract a concession; therefore, your consent was coerced because you were forced to pay for what was already yours.

  The single feature doing the work is the **pre-existing duty**. The landlord is not offering a new benefit; he is offering to fulfill an obligation he already holds. If you remove this feature—for example, if the lease stated the tenant was responsible for all repairs—the normative baseline collapses. In that case, you were not *owed* heat, so the landlord's offer is genuinely generous or negotiable, and both baselines would agree that your consent was valid.

  Someone arguing the consent was valid would say the normative baseline is smuggling in an idealized view of rights that ignores enforcement costs. They would argue that while you were *theoretically* owed heat, realizing that right through courts would take months of freezing; the offer traded a difficult-to-enforce right for immediate safety, which is a rational, voluntary exchange. The "coercion" claim assumes rights are self-executing, but in reality, you consented to buy immediacy. Finally, if the landlord had lied about the wait time (deception) or you were unable to understand the addendum (competence), the coercion claim would strengthen, but the core conflict remains rooted in the duty, not those factors.
