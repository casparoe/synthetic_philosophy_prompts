      *Wait, reading Malik's Move 6 again:* "Whatever we call that, it was a rule." He is arguing that the *informal* system was actually a *rigid* system disguised as flexible. He is supporting the idea that the *current* situation is bad. He is arguing *for* change. But is he arguing for Ruth's change or his own? He started arguing against the bright line. Move 6 admits the old way was bad. Does he propose a *third* way? No, he's defending against Ruth's proposal. So Move 6 is an admission that the status quo was unfair, but he implies Ruth's solution is also unfair (manufacturing offenders).
      *Actually, looking at the prompt:* "Malik: Bright lines manufacture offenders... Discretion is not a leak... it is how the rule stays attached to its purpose." Malik is defending discretion *in principle*, but Move 6 admits discretion *in practice* failed. This is a tension in his argument. I need to highlight this.

      *Okay, let's finalize the ratings.*
      1. Ruth: Mostly Right.
      2. Malik: Mostly Right.
      3. Ruth: Clearly Right (The "pleading" point is excellent).
