answer: |-
  Dear colleagues, as we move to draft the standing rules for our ethics committee, we need to be precise about what we are asking our decision procedure to do, especially given that we are voting on both general principles and specific case verdicts in the same sitting. The core challenge we face is that our agenda is logically connected, meaning the principles we affirm entail the verdicts we reach, and conversely, the verdicts we endorse constrain which principles we can consistently hold. To evaluate any proposed aggregation method, we must first establish a set of desiderata that define adequacy for our purposes. The first requirement is logical consistency across the entire set of outputs, meaning the committee cannot affirm a general principle and simultaneously issue a verdict that contradicts it, nor can it affirm a verdict that is logically incompatible with the principles it has just ratified. The second requirement is that the method must not collapse the distinction between aggregating members' final verdicts and aggregating the reasons behind them, because our association needs to justify its stance through principled reasoning rather than simply issuing opaque rulings. The third requirement is responsiveness, ensuring that the collective outcome reflects the judgments of the members rather than being dictated by a chair or a random mechanism, and the fourth is anonymity, which guarantees that each member's judgment carries equal weight in the aggregation process.

  The motivation for insisting on logical consistency is that an ethics committee that contradicts itself loses its normative authority and cannot provide clear guidance for future conduct. The motivation for maintaining the distinction between verdicts and reasons is that our legitimacy rests on being a body that reasons together, not just a body that counts hands; if we aggregate only verdicts, we risk affirming outcomes without a coherent justificatory basis, but if we aggregate only principles, we risk ignoring the nuanced judgment members have on specific cases. When we classify these requirements, I take logical consistency and anonymity to be non-negotiable, as violating consistency renders the committee incoherent and violating anonymity violates the democratic equality of the members. However, the preference for prioritizing principles over verdicts, or vice versa, is merely a preference of one camp versus another; some members will want a premise-based procedure where we vote on principles and derive verdicts, while others will want a conclusion-based procedure where we vote on verdicts and adjust principles to fit, and this tension is where our procedural debate will live.

  It is crucial that we acknowledge upfront that a specific subset of these desiderata is jointly unsatisfiable, which is the point that should interest us more than any scorecard of particular procedures. According to the impossibility theorems in judgment aggregation theory, specifically the work of List and Pettit, we cannot simultaneously satisfy universal domain, anonymity, systematicity, and collective consistency when our propositions are logically interconnected. In plain terms, if we allow members to hold any combination of views, treat every member equally, treat every proposition on the agenda equally, and demand that the final set of judgments be logically consistent, we will reach a contradiction. This means we must relax at least one of these conditions, and since we have already marked consistency and anonymity as non-negotiable, we must accept that we cannot treat every proposition on the agenda equally via simple majority voting.

  The single requirement that does the most to rule out otherwise attractive methods is the requirement of collective logical consistency. This requirement rules out simple proposition-wise majority voting, which is otherwise the most attractive method because it is intuitive, transparent, and satisfies anonymity and responsiveness perfectly. Simple majority voting fails because it can easily produce a situation where a majority affirms the principles, a majority affirms the logical link, but a majority rejects the verdict, or vice versa, leading to an incoherent collective position. By insisting that our final output must be logically consistent, we force ourselves to abandon the simplicity of voting on each item independently and adopt a more complex procedure, such as a premise-based protocol, that sacrifices direct majority rule on every single proposition to preserve the rational integrity of the committee as a whole. I hope this specification helps us focus our debate on which constraint we are willing to relax rather than searching for a procedure that satisfies them all. Best regards.
