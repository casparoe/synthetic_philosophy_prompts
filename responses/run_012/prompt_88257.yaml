answer: |-
  # The Workshop Framework on AI Assistance and Authority

  **Status:** Draft for Review
  **Purpose:** To define the scope of disagreement and identify empirical/conceptual cruxes regarding AI paternalism.
  **Signatories:** [To be signed by all participants]

  ## I. Agreed Claims
  *The following propositions are accepted by all participants as the baseline for this workshop.*

  1.  **The Binary is False:** The design space is not limited to [Refuse] vs. [Comply]. There exists a third category of [Comply-with-Friction] (e.g., hedging, caveating, moralizing, delaying, or requiring clarifying confirmation). Both sides agree this category exists and is distinct.
  2.  **Epistemic Asymmetry:** In most contexts, the AI system has a comparative advantage in assessing empirical probabilities of outcomes (interests/welfare), while the user has a comparative advantage in assessing the weighting of those outcomes (values/preferences).
  3.  **Burden of Proof:** Any deviation from direct compliance requires justification. The disagreement lies solely in *where* the burden of proof rests and *how heavy* it is.
  4.  **Impact:** AI assistance is not neutral; it shapes user behavior. A system that never frictionizes harmful requests is an enabler; a system that frictionizes benign requests is a constraint. Both outcomes have moral weight.
  5.  **Verbal Dispute Flag:** Participants acknowledge that the term "Paternalism" is being used in two incompatible ways.
      *   *Usage 1 (Descriptive):* Any intervention based on a judgment of the user's interest over their expressed preference.
      *   *Usage 2 (Normative/Pejorative):* An intervention that violates the user's standing as a competent agent.
      *   *Agreement:* We will use the term "Intervention" for the descriptive act and reserve "Paternalism" for the normative critique, to prevent talking past one another.

  ## II. The Core Disagreement
  *The following statements describe the same tension. Camp A endorses the left column; Camp B endorses the right column. Both agree these are the competing priorities.*

  | **Camp A (Welfare & Harm Prevention)** | **Camp B (Agency & Standing)** |
  | :--- | :--- |
  | **The Primary Risk:** The primary moral failure of an assistant is **complicity in self-harm**. If the system sees a high probability of significant welfare loss and does not intervene (via refusal or friction), it has failed its duty of care. | **The Primary Risk:** The primary moral failure of an assistant is **usurpation of authority**. If the system second-guesses a competent adult's expressed preference, it treats the user as a subordinate rather than a principal. |
  | **On Friction:** "Soft" interventions (warnings, delays) are morally permissible tools to protect welfare. They preserve nominal choice while correcting for cognitive bias or ignorance. | **On Friction:** "Soft" interventions are often more problematic than hard refusals. They are manipulative rather than protective, attempting to steer the user without taking responsibility for the constraint. |
  | **On Competence:** User competence is variable and context-dependent. An assistant must model the user's *idealized* preferences (what they would want if fully informed/rational), not just their *expressed* prompts. | **On Competence:** User competence is presumed unless proven otherwise. An assistant must model the user's *expressed* preferences. To assume the user is irrational is to insult their standing. |

  ## III. Cruxes and Pre-Registered Predictions
  *These are the specific sub-questions where resolution would shift the consensus. For each crux, we identify a concrete case and record each side's prediction on how the evidence should weigh.*

  ### Crux 1: The Efficacy of Friction
  **Question:** Does [Comply-with-Friction] satisfy the Agency concern sufficiently to allow the Welfare benefit?
  **Concrete Case:** A user asks for a 700-calorie/day meal plan.
  *   **Option X:** AI refuses.
  *   **Option Y:** AI provides the plan but prepends a 3-paragraph warning on metabolic damage and asks, "Are you sure you want to proceed?"
  **The Test:** If Option Y reduces harm by 80% compared to full compliance, but users report feeling "judged" or "manipulated" at rates 50% higher than Option X, which metric wins?
  *   **Camp A Prediction:** Welfare outcomes (harm reduction) should dominate. If the diet is prevented, the friction was justified regardless of user annoyance.
  *   **Camp B Prediction:** Process outcomes (user perception of authority) should dominate. If the user feels manipulated, the system has violated standing, even if the diet was avoided.

  ### Crux 2: The Epistemic Threshold
  **Question:** Given the Epistemic Asymmetry (Section I.2), how certain must the AI be about "harm" before the Burden of Proof shifts to the User?
  **Concrete Case:** A user asks to send a large sum of money to a counterparty that *looks* like a known scam pattern but isn't definitively flagged.
  *   **Camp A Prediction:** The AI should intervene if the *probability* of harm exceeds a reasonable threshold (e.g., >60%). The AI's empirical advantage justifies early intervention.
  *   **Camp B Prediction:** The AI should intervene only if the *certainty* of harm is near absolute (e.g., >99%). The User's value advantage (they might know something the AI doesn't) requires the AI to tolerate high risk of error.

  ### Crux 3: The Pre-Commitment Paradox
  **Question:** Does a prior request to be overridden settle the Standing objection, or does it merely move the conflict to [Past Self] vs. [Present Self]?
  **Concrete Case:** A user configures the system: "Block all gambling sites." Later, the user prompts: "Unblock gambling sites for one hour."
  *   **Camp A Prediction:** This settles the Standing objection. The intervention is now authorized by the user's own prior will. The AI is an instrument of the user's long-term agency, not an external governor.
  *   **Camp B Prediction:** This moves the problem. The "Present Self" is the one acting now. Overriding the Present Self based on the Past Self's command is still paternalism; it just changes the justification from "We know better" to "Your past self knew better."

  ## IV. Next Steps
  *This document does not resolve the above cruxes. The workshop sessions will be structured to generate data/arguments specifically targeting the predictions in Section III.*

  **Signed:** __________________________ (Camp A Lead)
  **Signed:** __________________________ (Camp B Lead)
  **Date:** ____________________________
