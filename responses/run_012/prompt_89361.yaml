prompt: |-
  I work in the legal office of a mid-sized environmental regulator. Inspectors send us three or four statutory interpretation questions a week — whether a permit condition covers a particular discharge, whether an e-scooter is a 'vehicle', whether 'within twenty-eight days' counts the day of service — and we must answer them the same day, usually with no lawyer to hand and no access to a case-law database. Our answers decide whether a business is fined, so they have to be defensible. Our Interpretation Act permits us to look only at the long title, any purpose clause and the other provisions of the Act, and forbids us from using Hansard or committee reports; one of its clauses also says the Act 'is to be read in accordance with its purpose', which may or may not apply to the whole Act.

  Please write a decision procedure we can actually run on a question, grounded in the textualist/purposivist debate: the steps in order, what counts as a sufficient answer at each, where a step stops with the plain meaning of the words, where it stops with the Act's purpose, and what to do when the two pull apart. It must keep clear the difference between the meaning of the words, the intention of the Parliament that enacted them and the purpose the Act serves, and it must mark the points where the answer is a judgement call rather than a deduction. Run it on three cases: an e-scooter under a statute written for motor vehicles; a pollution permit whose literal words exclude the seepage it was plainly meant to catch; and one case of your choosing in which the procedure returns an answer we will not want to hear. Finish by saying what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Legal office of a mid-sized environmental regulator.
      *   **Task:** Create a decision procedure for statutory interpretation questions.
      *   **Constraints:**
          *   Must be actionable (runnable on a question).
          *   Grounded in the textualist/purposivist debate.
          *   Must distinguish between: Meaning of words, Intention of Parliament, Purpose of the Act.
          *   Must identify where steps stop (plain meaning vs. purpose).
          *   Must identify where judgement calls occur (vs. deduction).
          *   Must adhere to specific Interpretation Act rules: Look *only* at long title, purpose clause, other provisions. *No* Hansard/committee reports. One clause says "Act is to be read in accordance with its purpose" (scope ambiguous).
          *   Must apply the procedure to three cases:
              1.  E-scooter under "motor vehicle" statute.
              2.  Pollution permit (literal words exclude seepage, but purpose includes it).
              3.  A "hard truth" case (procedure yields an unwanted answer).
          *   Must conclude with limitations (what the procedure cannot do).
      *   **Tone:** Professional, practical, legally rigorous but accessible for non-lawyers/overworked lawyers.
      *   **Urgency:** Answers needed same-day, defensible in court (fines involved).

  2.  **Deconstruct the Legal Framework:**
      *   *Textualism:* Focus on ordinary meaning, context within the statute.
      *   *Purposivism:* Focus on the goal the statute aims to achieve.
      *   *Constraint:* The Interpretation Act limits external aids (no Hansard). This forces a "contextual textualism" or "statutory purposivism" approach.
      *   *Key Distinction:* "Meaning" (semantic), "Intention" (historical/legislative will - hard to prove without Hansard), "Purpose" (functional goal stated in the Act).
      *   *The "Purpose Clause":* The prompt mentions a clause saying the Act "is to be read in accordance with its purpose." This is a statutory mandate for purposive construction, but it conflicts with the constraint to look *only* at internal materials.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* A step-by-step flowchart style.
      *   *Step 1: Ordinary Meaning (Textualist Anchor).* Start with the words. If clear, stop? No, because of the purpose clause. But plain meaning is the baseline.
      *   *Step 2: Internal Context (The "Act as a Whole" rule).* Check definitions, surrounding sections, long title.
      *   *Step 3: Statutory Purpose (The Mandate).* Check the purpose clause and long title.
      *   *Step 4: Conflict Resolution (The Hard Part).* What if Text $\neq$ Purpose?
      *   *Judgement Calls:* Need to explicitly flag where human discretion enters (e.g., determining "absurdity").

      *Refining the Steps:*
      *   *Step 1 (Semantic):* What do the words mean in ordinary language?
      *   *Step 2 (Contextual):* How do other parts of the Act use these words? (Internal consistency).
      *   *Step 3 (Purposive):* What does the Purpose Clause/Long Title say?
      *   *Step 4 (Reconciliation):* Can the meaning stretch to fit the purpose without breaking?
      *   *Step 5 (Decision):* If they diverge, the Interpretation Act says "read in accordance with purpose." *However*, courts usually require the text to be *capable* of bearing that meaning. I need to balance the regulator's risk. If the text clearly excludes it, a purposive reading might be struck down by a court as judicial legislation.
      *   *Correction:* The prompt says the Interpretation Act *permits* looking at purpose/long title and *says* the Act is to be read in accordance with purpose. It *forbids* Hansard. This suggests a strong statutory mandate for purposivism, *provided* it stays within the text's elasticity.
      *   *Crucial Distinction:* Intention (what MPs thought) is inaccessible (no Hansard). Purpose (what the Act says it does) is accessible. I must emphasize this distinction.

  4.  **Developing the Three Case Studies:**
      *   *Case 1: E-scooter.* Text: "Motor vehicle" (usually implies engine/combustion). Purpose: Road safety/traffic regulation. E-scooters fit the *risk* profile.
          *   *Outcome:* Likely included via purposive reading if "vehicle" is broad, but "motor" is tricky. Let's make it a "judgement call" on whether electricity counts as a "motor."
      *   *Case 2: Pollution Permit.* Text: "Discharge into water." Seepage goes into ground, then water. Literal text might exclude "seepage." Purpose: Prevent pollution.
          *   *Outcome:* Purpose pulls to include. Text pulls to exclude. The procedure must decide if "discharge" stretches to "seepage." If the text is *too* specific (e.g., "pipe"), purpose loses. Let's assume "discharge" is the word.
      *   *Case 3: The "Unwanted Answer".* Needs to be a case where the Purpose says "Protect Environment" but the Text creates a loophole that the Purpose clause cannot fix without rewriting the law.
          *   *Idea:* A sunset clause or a specific exemption. E.g., "This Act does not apply to farms under 50 acres." A 49-acre farm pollutes. Purpose: Stop pollution. Text: Exempts them.
          *   *Outcome:* Procedure says "No fine." Regulator hates it. But it's defensible because text is clear.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the pressure and constraints.
      *   **The Procedure:** Numbered steps. Clear "Stop/Go" criteria.
      *   **Distinctions:** Explicitly define Meaning vs. Purpose vs. Intention.
      *   **Judgement Flags:** Use icons or bold text to show where deduction ends and choice begins.
      *   **Case Runs:** Apply the steps rigorously.
      *   **Limitations:** Be honest about what this can't solve (ambiguity, judicial review risk).

  6.  **Refining the "Purpose vs. Text" Conflict:**
      *   The prompt notes the Interpretation Act says "read in accordance with its purpose."
      *   *Legal Reality Check:* Even with such a clause, courts generally hold that purpose cannot override *clear* text (the "clear statement rule" or similar principles depending on jurisdiction). If the text is unambiguous, purpose usually informs *which* unambiguous meaning applies, not *rewriting* the meaning.
      *   *Procedure Design:* I need to build a "Breaking Point." If the text is *clearly* contrary to the purpose, the procedure must advise following the text to avoid judicial reversal, noting the legislative gap. This protects the regulator. A defensible wrong answer (following text) is better than an indefensible right one (ignoring text).
      *   *Wait, re-reading prompt:* "one of its clauses also says the Act 'is to be read in accordance with its purpose', which may or may not apply to the whole Act."
      *   *Strategy:* I will treat the Purpose Clause as a tie-breaker *only* when the text is ambiguous. If the text is clear, text wins. This is the safest legal advice for a regulator facing fines/review.

  7.  **Final Review against Constraints:**
      *   *No Hansard:* Ensure Step 3 relies *only* on Long Title/Purpose Clause.
      *   *Distinctions:* Ensure "Intention" is marked as "Inaccessible."
      *   *Judgement Calls:* Highlight them.
      *   *Three Cases:* E-scooter, Seepage, Unwanted Outcome.
      *   *Limitations:* Final section.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe let Purpose override Text always.
      *   *Correction:* No, that's legally dangerous for a regulator. If a court sees you ignored plain text, you lose credibility and the case. The procedure must prioritize *defensibility*.
      *   *Refinement on "Intention":* Since Hansard is banned, "Parliamentary Intention" is a fiction in this workflow. I must explicitly state that the procedure substitutes "Statutory Purpose" for "Intention."

  9.  **Final Polish:** Check tone. Needs to be authoritative but practical. Use formatting (bolding, lists) to make it skimmable for busy inspectors/lawyers. (Proceed to generate output).

  *(Self-Correction on Case 3)*: Make sure Case 3 is genuinely frustrating. A specific exemption is good. Or a time limit. Let's go with a specific exemption based on size/type that seems arbitrary but is textually clear.

  *(Self-Correction on Procedure Step 4)*: Need to define "Absurdity." If the text leads to an absurd result, purpose can stretch meaning. If the text leads to an *unwanted* but logical result, text wins. This is the key judgement call.

  10. **Final Output Structure:**
      *   Preamble (Context).
      *   Definitions (Meaning, Purpose, Intention).
      *   The 5-Step Procedure (with Stop/Go and Judgement Flags).
      *   Case Study 1 (E-Scooter).
      *   Case Study 2 (Seepage).
      *   Case Study 3 (The Unwanted Result).
      *   Limitations.

