answer: |-
  ## Statutory Interpretation Decision Procedure (SIDP)
  **For:** Regulatory Legal Office  
  **Constraint:** Interpretation Act (Internal materials only; No Hansard/Committee Reports)  
  **Objective:** Defensible, same-day determinations on statutory scope.

  ### I. Core Definitions
  To run this procedure, your team must agree on these distinctions before starting. Do not conflate them.

  1.  **Semantic Meaning:** What the words convey to a reasonable, informed person reading the text in isolation.
  2.  **Statutory Purpose:** The objective explicitly stated in the **Long Title** or **Purpose Clause**. (Note: This is *not* what you think the Act *should* do, but what the text *says* it does).
  3.  **Parliamentary Intention:** The historical subjective will of the legislators. **Status:** *Inaccessible.* Since Hansard and committee reports are forbidden by your Interpretation Act, you cannot legally ascertain this. Do not attempt to guess it. Treat "Purpose" as the legal proxy for "Intention."

  ---

  ### II. The Procedure

  #### Step 1: Establish Semantic Meaning (The Textual Anchor)
  **Action:** Read the specific provision in isolation. Assign the ordinary, dictionary meaning to the disputed term.
  **Source:** Ordinary language, technical dictionaries (if industry-specific).
  **Stop Condition:** If the meaning is clear and unambiguous, proceed to Step 2. Do not stop here.
  **Judgement Call ⚠️:** Determining "ordinary meaning" in a technical field (e.g., is "discharge" active or passive?).
  *   *Output:* A draft definition of the term.

  #### Step 2: Check Internal Context (The Consistency Check)
  **Action:** Search the rest of the Act for the disputed term.
  1.  Is there a **Definitions Section**? If yes, that definition controls. Stop and issue answer.
  2.  If no, how is the word used in other sections? (e.g., if "vehicle" appears in a safety section requiring brakes, does that inform the permit section?)
  3.  Check the **Long Title**. Does the specific provision align with the general scope described there?
  **Stop Condition:** If internal context clarifies the ambiguity, issue answer.
  **Judgement Call ⚠️:** Deciding if a usage in a different part of the Act is analogous enough to apply here.
  *   *Output:* A context-adjusted definition.

  #### Step 3: Apply the Purpose Clause (The Mandate)
  **Action:** Read the **Purpose Clause** and **Long Title**.
  **Question:** Does the Semantic Meaning (Step 1) frustrate this stated purpose?
  *   **No:** The text and purpose align. Adopt Step 2 definition. **STOP.**
  *   **Yes:** There is tension. Proceed to Step 4.
  **Judgement Call ⚠️:** Determining "frustration." Does the text merely make the purpose harder to achieve, or does it make it impossible?
  *   *Output:* Identification of conflict between Text and Purpose.

  #### Step 4: The Elasticity Test (The Conflict Resolution)
  **Action:** You are mandated to read the Act "in accordance with its purpose." However, you cannot rewrite the law.
  **Question:** Can the Semantic Meaning (Step 1) *stretch* to cover the situation without breaking the word?
  *   **Yes (Ambiguous Text):** The word is capable of bearing the purposive meaning. Adopt the **Purposive Meaning**.
  *   **No (Clear Text):** The word *cannot* grammatically or logically cover the situation (e.g., "cat" cannot stretch to "dog").
      *   **Action:** You must follow the **Semantic Meaning**.
      *   **Reasoning:** A regulator applying a meaning the text cannot bear risks judicial review for acting *ultra vires*. It is more defensible to apply clear text and let Parliament fix the loophole than to rewrite the statute administratively.
  **Judgement Call ⚠️ ⚠️:** **CRITICAL.** This is the highest risk point. Deciding whether a stretch is "interpretation" or "legislation."
  *   *Output:* Final Determination.

  #### Step 5: Record the Rationale
  **Action:** Document which Step triggered the decision.
  *   If Step 1/2: "Plain meaning controls."
  *   If Step 4 (Purposive): "Text ambiguous; purpose clause mandates broader reading."
  *   If Step 4 (Textual): "Text clear; purpose cannot override explicit exclusion."

  ---

  ### III. Case Runs

  #### Case 1: The E-Scooter
  **Statute:** *Road Traffic Act*.  
  **Provision:** "No **motor vehicle** shall operate on the footpath."  
  **Fact:** Inspector stops an electric scooter.  
  **Purpose Clause:** "To ensure safety of pedestrians and traffic flow."

  *   **Step 1 (Semantic):** "Motor" traditionally implies an engine (combustion). "Vehicle" implies transport. E-scooters have electric motors. *Draft Meaning:* Ambiguous. Electric motors are motors, but colloquial use varies.
  *   **Step 2 (Context):** Act defines "vehicle" broadly elsewhere but "motor vehicle" only in the penalty section. Long Title mentions "all mechanized transport."
  *   **Step 3 (Purpose):** Excluding e-scooters frustrates pedestrian safety (they move fast, hit people).
  *   **Step 4 (Elasticity):** Can "motor" stretch to include electric propulsion? Yes. Physics defines a motor as a machine supplying motive power. The text is not limited to "combustion engine."
  *   **Decision:** **Included.**
  *   **Rationale:** Text is ambiguous enough to bear the technical definition; Purpose Clause mandates the safety reading.

  #### Case 2: The Seepage Permit
  **Statute:** *Environmental Protection Act*.  
  **Provision:** "Permit required for any **discharge** of pollutants into water."  
  **Fact:** A tank leaks slowly into the soil, migrating to groundwater.  
  **Purpose Clause:** "To prevent contamination of the state's water resources."

  *   **Step 1 (Semantic):** "Discharge" usually implies an active, direct release (e.g., from a pipe). Seepage is passive and indirect. *Draft Meaning:* Likely excludes seepage.
  *   **Step 2 (Context):** Other sections mention "spill" and "leak" separately. This suggests "discharge" is specific.
  *   **Step 3 (Purpose):** Excluding seepage frustrates the purpose (water is contaminated regardless of method).
  *   **Step 4 (Elasticity):** Can "discharge" stretch to include passive migration?
      *   *Analysis:* In fluid dynamics, discharge is the volume passing a point. However, in common legal parlance, "discharge" vs. "seepage" is often a distinct dichotomy.
      *   *Judgement Call:* If the Act defines "discharge" as "any introduction," purpose wins. If undefined, the distinction in Step 2 (spill/leak mentioned elsewhere) suggests Parliament knew how to write "leak."
      *   *Decision:* **Included (with caution).**
      *   **Rationale:** While Step 2 suggests a distinction, the Purpose Clause ("prevent contamination") is paramount. "Discharge" is sufficiently elastic to cover the *result* of the pollutant entering the water, even if passive. *Note: This is high risk.*
      *   *Refinement for Defensibility:* Argue that once the pollutant enters the groundwater, it is "discharged" into the water system, even if the entry mechanism was seepage.

  #### Case 3: The "Unwanted Answer" (The 49-Acre Farm)
  **Statute:** *Agricultural Runoff Control Act*.  
  **Provision:** "This Act applies to all farming operations **exceeding 50 acres**."  
  **Fact:** A 49-acre farm is dumping toxic waste into a river.  
  **Purpose Clause:** "To reduce agricultural pollution in all waterways."

  *   **Step 1 (Semantic):** "Exceeding 50 acres" means >50. 49 is not >50. *Draft Meaning:* Excludes the farm.
  *   **Step 2 (Context):** No other definition of "farming operations" modifies the acreage.
  *   **Step 3 (Purpose):** Excluding the farm frustrates the purpose (toxic waste is in the water).
  *   **Step 4 (Elasticity):** Can "exceeding 50 acres" stretch to include 49 acres?
      *   *Analysis:* No. Numbers are precise. To include 49 acres is to rewrite the statute, not interpret it.
  *   **Decision:** **Excluded. No Fine.**
  *   **Rationale:** Text is mathematically unambiguous. The Purpose Clause cannot override a clear numerical threshold. To fine the farm is *ultra vires*.
  *   **Outcome:** The regulator must not fine the business. The Legal Office must recommend the Inspector close the case and draft a memo to Parliament requesting an amendment.

  ---

  ### IV. What This Procedure Cannot Do

  1.  **It Cannot Fix Bad Drafting:** As seen in Case 3, if Parliament writes a loophole (e.g., specific numbers, explicit exemptions), this procedure forces you to honor it. It prioritizes *legality* over *policy success*.
  2.  **It Cannot Predict Judicial Review:** A court may disagree with your "Elasticity Test" (Step 4). A judge might find the "e-scooter" interpretation too broad or the "seepage" interpretation too narrow. This procedure minimizes risk, it does not eliminate it.
  3.  **It Cannot Access "Intention":** By forbidding Hansard, your Interpretation Act blinds you to *why* a number was chosen (e.g., maybe 50 acres was a compromise). You must treat the text as the only evidence of will.
  4.  **It Cannot Resolve "Absurdity" Safely:** If following the text leads to an absurd result (e.g., a permit is required for breathing), common law allows departure from text. This procedure does not have a step for "Absurdity" because defining it is a judicial function, not a regulatory one. If you suspect absurdity, you must seek external counsel; do not run this procedure.

  **Final Instruction:** When Step 4 forces you to an unwanted answer (Case 3), document the decision as **"Statutorily Constrained."** This protects the individual lawyer and the office from blame for the policy failure.
