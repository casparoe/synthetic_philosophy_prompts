      *   *Refining the Twins Case:* This is the trickiest part. If the twins share the sensation, is it private? If it's a sensation *no one else can have*, it's ontologically private. But if they have a *practice*, it's semantically public. The PLA targets semantic privacy. The twins have semantic publicity (they correct each other) but ontological privacy. Wittgenstein cares about the semantic/normative side. So the PLA *permits* the twins, provided they have a practice of correction. This shows the argument is about *normativity*, not *solipsism*.
      *   *Refining Camp 2 (Straw Man):* They need to realize that "presence to mind" fails to distinguish correct/incorrect use over time. That's the memory objection.
