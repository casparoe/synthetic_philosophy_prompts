answer: |-
  ### Move-by-Move Adjudication

  **1. X (Political vs. Industrial)**
  **Sound but overstated.** X is correct that leveraging disruption for political ends raises distinct ethical questions from bargaining over wages, and the coercion charge has weight. However, he is mistaken to imply the university lacks agency; endowment management is entirely within the employer's control, making this a demand on the employer's conduct, not national policy.

  **2. Y (Terms of Employment)**
  **Sound.** Y correctly identifies that the boundary between 'industrial' and 'political' is porous when the employer controls the asset in question. Her definition of coercion is also philosophically robust: refusing to contract is not coercion in a liberal framework, provided the employer retains the theoretical right to hire elsewhere.

  **3. X (Coercion and Cartels)**
  **Sound but overstated.** Economically, a union acts as a cartel, and strikes are inherently coercive mechanisms designed to inflict cost. However, this overlooks the moral distinction between capital and labour; treating human labour purely as a commodity subject to competition law ignores the dependency of the worker on that labour for survival.

  **4. Y (Labour Inseparability)**
  **Sound.** This is the standard and strongest philosophical rebuttal to the cartel analogy. Because labour cannot be separated from the person or warehoused, workers possess a unique vulnerability that justifies collective counter-power against a monopsony buyer, distinguishing them from commercial suppliers.

  **5. X (Third-Party Harm)**
  **Sound.** This is X's strongest point. Strikes in essential services or teaching institutions inevitably harm non-consenting third parties (students) who cannot exit the relationship. The rolling tactic does arguably maximise uncertainty and disruption without giving the employer a clean opportunity to mitigate, which complicates the proportionality of the action.

  **6. Y (Consistency and Contract)**
  **Sound.** Y correctly identifies that a strict prohibition on third-party harm would render almost all industrial action illegitimate. Her point on work-to-rule is also legally sound: an employer purchases specified labour, not discretionary goodwill, so withdrawing the latter is not a breach of contract.

  ***

  ### Analysis and Verdict

  **Are they answering different questions?**
  Yes. X is asking a question about **legitimacy of purpose and target**: is it right to use economic leverage to force ethical changes unrelated to immediate wages? Y is asking a question about **rights and contract**: do workers own their labour sufficiently to withhold it under these conditions? X focuses on the consequences for the community; Y focuses on the rights of the worker against the employer.

  **Is the political/industrial distinction doing real work?**
  It is a red herring in this specific context. While legally significant in many jurisdictions (including the UK), ethically it collapses when the demand is within the employer's direct gift. If workers can strike to force an employer to spend money on pensions (a financial decision), it is inconsistent to say they cannot strike to force an employer to spend money ethically (a divestment decision). The distinction protects employers from political embarrassment rather than marking a genuine moral boundary.

  **Does the cartel objection survive Move 4?**
  No. The cartel objection survives only if one accepts that labour is a commodity like any other. Y's point about inseparability—that selling labour is selling time from a finite life—breaks the moral equivalence between a union and a price-fixing consortium of firms. While the economic *mechanism* is similar, the moral *status* of the actors is not, which is why competition law exemptions exist.

  **Who has the better of it?**
  **Y has the better of it.**
  X's argument relies on a definition of coercion that ignores power asymmetry and a definition of 'industrial' that is historically contingent rather than morally fundamental. While X raises a serious concern about third-party harm (Move 5), Y correctly notes that this is an inherent feature of all strikes, not a unique flaw of this one. If the harm to students is unacceptable, the argument should be against strikes in essential services generally, not against this specific demand. Y's defence rests on the more foundational principle that workers retain autonomy over their labour and that employers are responsible for the ethical conduct of their capital. X asks workers to accept a limitation on their leverage that capital does not accept itself.

  **Missed Consideration**
  Neither colleague addressed the **efficacy and proportionality** of the specific tactic relative to the demand. A rolling strike on maintenance staff risks damaging sensitive research (cold rooms, gas lines) permanently, which may outweigh the ethical gain of divestment. The ethical calculus should not just be about the *right* to strike, but whether the specific disruption chosen is proportionate to the grievance. If a lab's years of work are destroyed by a boiler shutdown, the workers become directly complicit in harm to third parties that goes beyond mere inconvenience, which neither X nor Y fully explored.
