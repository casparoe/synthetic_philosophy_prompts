answer: |-
  So, look at the three cases side by side. The plane burns the fuel whether I'm in the seat or not. The cow was slaughtered months ago, and the store's reorder point hasn't been hit by my single steak. The election is decided by twenty points; my vote is dust. In every single one, the outcome is identical whether I participate or abstain. So why are we pretending I have a moral problem here? If I cannot change the world, how can I be blamed for it?

  Because you're assuming the only thing that matters is changing the world. That's the causal view. But think about the harm itself. Climate change isn't one big event; it's millions of tons of carbon. Factory farming isn't one slaughter; it's millions of deaths. The harm is constituted by acts like yours. You aren't causing the harm in the sense of tipping the scale, but you are part of what the harm is made of. Like a traffic jam. No single car causes the jam, but the jam is made of cars. If you pull into the bottleneck, you aren't the cause of the traffic, but you are part of the traffic.

  That analogy is doing too much work. A jam is a descriptive state. Morality is normative. If I'm the only car on the road, I'm not in a jam. So the "constituting" relation depends on there already being a problem. But if my act doesn't make the problem worse, what work is "constituting" doing? It sounds like a fancy way of saying I was nearby. If I walk past a crowd beating someone up, I'm near the harm, but I'm not part of it unless I join in. What makes buying the steak joining in, if the butcher didn't need my money to order the next one?

  It's about participating in a practice. The harm exists because there's a structured practice of burning carbon, killing animals, and electing candidates who ignore minorities. When you vote in that safe seat, you aren't changing the winner, but you are adding to the mandate. You're swelling the numbers that the winner claims represent the people. When you buy the steak, you signal demand. Even if the signal is lagged, you are aligning yourself with the industry. You're making yourself the kind of person who benefits from that system.

  But that shifts the ground from harm to integrity. And sure, maybe I want to be clean. But let's look at the math. If I fly, I add maybe two tons of carbon. If enough people do it, the planet cooks. But if I don't fly, the planet still cooks. You're asking me to bear a cost—missing a wedding, paying more for food—for a benefit that will never exist. That's not integrity; that's suckerhood. And politically, it's dangerous. If we tell people their individual choices are the battlefield, the airline and the factory farm win. They want us fighting over steak while they lobby against regulation. Focusing on my constitution of the harm lets the state and the firm off the hook.

  That's a strategic claim, not a moral one. You're saying focusing on individual action is counterproductive. Maybe. But that doesn't make the action right. It just means we should do both. But let's test your causal view with a threshold. Suppose I walk into the store and I buy the very last steak. The manager sees the empty shelf and calls the supplier. Because of me, a new order goes out, and eventually, another cow dies. Now did I make a difference?

  Yes. In that case, you crossed the threshold. You triggered the causal chain.

  So it's wrong only if I'm the one who tips the scale? That makes morality a lottery. If I buy the second-to-last steak, I'm innocent. If I buy the last one, I'm a killer. But the cow dies either way if the store averages its sales. If they sell ten steaks a week, they order ten cows. My steak is one of the ten. Why does the moral weight rest entirely on the person who happens to buy the tenth unit?

  Because that's where the causal leverage is. Without the tenth sale, the order doesn't happen.

  But that means the other nine buyers are off the hook? They wanted the meat, they paid for it, but because they weren't the marginal buyer, they didn't do anything wrong? That seems absurd. It suggests that for every wrong act, there are nine right acts that look exactly like it. It makes moral knowledge impossible. I can't know if I'm the tenth buyer. So if I care about not killing cows, I have to act as if I might be the tenth. Which means I shouldn't buy the steak even if I'm probably not the trigger.

  Okay, so you're moving to expected utility. Even if the chance I'm the trigger is one in a hundred, if the harm is big enough, the risk outweighs the pleasure of the meal.

  Exactly. And that applies to the vote too. The chance my vote decides the election is one in a hundred thousand. But if the difference between the candidates is worth billions in human welfare, the expected value is still high. So the math saves the duty to vote, even if the causal impact is negligible.

  But the flight and the steak aren't lotteries in the same way. The carbon adds up linearly. There's no threshold for climate change; every ton matters. But for the steak, the harm is lumpy. One cow makes hundreds of steaks. So my single purchase is maybe one five-hundredth of a cow death. It's not a lottery; it's a fractional contribution. I'm buying a share of the harm.

  Fine, let's grant that. I'm buying a share. But now look at the voting case again. I think you're lumping it in where it doesn't belong. When I vote, I'm not causing the policy. I'm not even buying a share of the policy in the same way I buy a share of the cow. Voting is expressive. It's about standing in a relation of citizenship. If I don't vote, I'm not harming anyone directly. I'm just opting out of the collective decision. But flying and eating meat are market transactions. They're demand signals. Voting isn't a demand signal in the same way; it's an authorization.

  Is it? If I vote for a candidate who starts a war, haven't I authorized it? If I buy meat, haven't I demanded it? They both look like inputs into a system that produces harm. The difference is that voting is supposed to be how we control the system, whereas eating is how we feed ourselves. But if the system is rigged—like the safe seat—then my vote is just noise. Just like my steak is just noise if the order is already placed.

  Here's where I push back on your "constituting" idea. You say I'm part of the harm. But imagine a world where I'm the only person eating meat. Everyone else is vegan. The industry doesn't exist. I kill a cow myself. That's clearly wrong. Now imagine everyone else eats meat, and I don't. The industry exists. I abstain. Have I stopped the harm? No. But have I separated myself from it? Yes. So the relation isn't about what the harm is made of; it's about my alignment with it. But if I'm the only one eating meat in a world where nobody else does, there is no industry. So "constituting" requires a practice. It requires others.

  Right. So it's a collective action problem.

  Exactly. And that's why the "no difference" argument feels so strong. Because individually, we are powerless. But if "constituting" is the key, then it requires a shared intention or at least a shared practice. If I buy the steak, I'm joining a practice. If I vote, I'm joining a practice. If I fly, I'm joining a practice. But what does that ask of me? Does it ask me to stop? Or does it ask me to work to change the practice? If I fly to go to a climate protest, am I constituting the harm or fighting it?

  That's the tricky bit. If the harm is made of acts like mine, then doing the act adds to the harm, regardless of why I do it. The carbon doesn't care about my intention. But the moral blame might. If I'm trying to stop the practice, maybe my participation is justified as necessary friction. But if I'm just flying for a holiday, I'm just adding to the mass.

  But then we're back to the structural point. If the harm is collective, the solution must be collective. If I stop eating meat, but the state subsidizes factory farming, the meat stays cheap, and someone else buys it. My abstention doesn't reduce the harm; it just shifts who benefits from the surplus. So focusing on my constitution of the harm lets the subsidizer off the hook. It makes me feel virtuous while the machine keeps running.

  I agree that feeling virtuous is useless. But there's a difference between letting someone off the hook and not being on the hook yourself. The state can be responsible for the regulation, and I can be responsible for my participation. They aren't mutually exclusive. But I will concede this: the voting case is different because voting is the mechanism we use to hold the state responsible. If I don't vote, I weaken the very tool we need to fix the flying and the meat. So even if my vote doesn't change the winner, it maintains the legitimacy of the system that could regulate the airlines and the farms.

  So you're saying voting is instrumental in a way the steak isn't?

  I'm saying voting is constitutive of the authority that could stop the steak. If I abstain, I'm not just avoiding harm; I'm withdrawing consent from the solution. With the steak, I'm adding demand to the problem. With the vote, I'm adding capacity to the solution, even if my single vote doesn't tip the election. It adds to the margin that gives the winner confidence to act.

  That's a hopeful story. But if the seat is safe by twenty points, my vote doesn't give them confidence. They already have it. So I'm back to square one. I'm adding a number to a tally that changes nothing.

  Then maybe we agree on this: the causal question is settled. In all three cases, you don't change the outcome. The disagreement is whether morality requires causal leverage. I think it requires not participating in wrongful practices, regardless of leverage. You think that's a distraction from fixing the practices.

  I think it's a distraction if it replaces fixing the practices. If you tell people "don't fly" instead of "tax carbon," you've lost. But if you tell people "don't fly" AND "tax carbon," then maybe the personal piece matters. Not because it stops the harm, but because it keeps you honest. You can't fight a system you're willingly feeding.

  So we agree that the "no difference" claim is true?

  Yes. Mathematically, causally, you change nothing.

  And we agree that the state and firms bear the primary responsibility for the structure?

  Yes. They set the rules.

  So the only gap is whether I have a secondary duty to align my actions with the change I want to see, even if it doesn't cause the change.

  Exactly. You see it as integrity. I see it as political hygiene. If I'm too dirty, I can't clean the house.

  Then maybe the handout shouldn't ask "Did I cause the harm?" It should ask "What kind of participant am I?"

  And "What does my participation do to my ability to demand better?"

  That works. Because if I say "I didn't cause it," I'm right. But if I say "So it doesn't matter," I might be wrong. Not because I changed the world, but because I let the world change me.

  And because if everyone said "I didn't cause it," the harm would vanish. So the act matters, just not in the way we usually think about acts.

  It matters as a vote for the kind of world we're building, even if it doesn't decide the election.

  Okay. So we aren't answering the same question. I'm asking about outcomes. You're asking about affiliation.

  And the reading group needs to see that the frustration comes from mixing the two.

  Right. If you want to know if you saved the cow, the answer is no. If you want to know if you're complicit in the killing, the answer is maybe. And those are different things.

  So the handout starts there. Don't ask if it made a difference. Ask what difference it makes that you ask.

  That's a start.
