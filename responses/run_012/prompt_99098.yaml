answer: |-
  It is completely understandable that you feel stuck, and your intuition that the group is talking past one another is almost certainly correct. What you have identified looks less like a single stalemate and more like a convergence of two distinct misunderstandings that reinforce each other, creating the illusion of a single intractable problem. Your hypothesis about the split between a normative claim and a claim about intelligibility is particularly strong, and it maps onto a deeper divide in how each side conceives the purpose of a moral theory. When the critics say the theory is too demanding, they are often making a claim about the conditions of agency itself, essentially arguing that a moral system that requires you to abandon your ground projects is not just harsh but incoherent because it destroys the very self that is supposed to be acting. The consequentialists, however, tend to hear this as a claim about the weighting of interests. They respond by adjusting the weights, offering prerogatives or thresholds, trying to find a mathematical space where the agent can breathe. But you cannot solve a problem about the integrity of the self with a adjustment to the calculus of outcomes. If the critic is saying that a life without personal projects is not a human life, and the consequentialist is saying that a life without maximal utility is not a moral life, they are not disagreeing about the same proposition. They are disagreeing about what kind of thing a human being is, and no amount of argument about specific cases will resolve a disagreement about philosophical anthropology.

  Your second insight regarding the aggregate of small demands versus single big asks is equally crucial and likely the engine that drives the first complaint. The standard philosophical examples of demandingness are often dramatic and discrete, like donating a kidney or falling on a grenade. These are easy to isolate and evaluate. But moral life is rarely lived in discrete dramatic spikes; it is lived in the continuous hum of small obligations. If a theory says yes to every small request because each one produces a net gain, the sum total of those yeses is a life consumed. Consequentialists often defend the theory by looking at the individual act in isolation, noting that any single instance of helping is good. Critics are looking at the trajectory of a life. This is a category error in evaluation. It is similar to saying that because one step off a cliff is safe, a continuous walk off the cliff is safe. The consequentialist move to offer a prerogative usually functions as an exception clause for specific acts, but it does not solve the aggregation problem. If I am permitted to rest today, but required to work tomorrow, and permitted to rest next week but required to work the week after, I still never actually inhabit my life. I am always waiting for the next obligation. The pattern of a life matters to the person living it in a way that the sum of the moral status of individual acts does not capture.

  When you combine these two insights, the shape of the impasse becomes clear. The critics are often arguing from the perspective of the pattern of a life and the intelligibility of the agent living it, while the consequentialists are arguing from the perspective of the moral status of individual acts and the impartiality of the outcome. The reason the begging the question charge flies back and forth is that each side thinks the other is ignoring the fundamental data. The consequentialist thinks the fundamental data is the good state of affairs, so any objection based on the agent's comfort looks like selfishness begging the question against impartiality. The critic thinks the fundamental data is the lived experience of agency, so any objection based on aggregate utility looks like a category error begging the question against the reality of human psychology. They are not just disagreeing about the answer; they are disagreeing about what the question is. One side is asking what acts produce the most good, and the other is asking what kind of life a moral agent can sustainably live.

  Given this diagnosis, you should not expect a standard argumentative victory to end this debate, because the disagreement is not primarily about the content of the moral theory but about the metaphilosophical function of moral theory. Progress in your group will not come from one side convincing the other that their moral weights are correct. Instead, progress would look like a shift from first-order moral arguing to second-order methodological clarity. You would make real headway if you could get the group to explicitly state whether they view a moral theory as a decision procedure for agents or as a criterion of rightness for evaluating states of affairs. If they agree it is a criterion of rightness, the demandingness objection loses some of its bite because the theory is not meant to be a guide for living. If they agree it is a decision procedure, the consequentialists must confront the pattern problem and explain how their theory avoids consuming the agent over time. Until you force that distinction into the open, you will remain in the loop.

  Honestly, though, you should prepare for the possibility that this is one of those debates where no amount of argument should be expected to end it, precisely because it rests on a clash of fundamental temperaments. Some people fundamentally believe that morality is about the view from nowhere, that the impartial standpoint is the only rational one, and that any resistance to it is a failure of imagination or will. Others fundamentally believe that morality must be rooted in the view from somewhere, that the impartial standpoint is an abstraction that loses touch with reality, and that any theory requiring it is pathological. These are not claims that can be proven false in the way a mathematical proof can be shown to have an error. They are commitments about what matters most in human existence. The best outcome for your reading group is not consensus, but rather a clear articulation of where the consensus is impossible. If you can reach a point where everyone admits that the consequentialist is willing to pay the cost of alienation for the sake of impartiality, and the critic is willing to pay the cost of partiality for the sake of integrity, then you have actually progressed. You will have moved from talking past each other to understanding exactly where the paths diverge, which is often the only kind of resolution available in fundamental ethics.
