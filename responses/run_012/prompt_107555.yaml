  Here is a tier list of the escape routes, ranked by their current standing in the philosophy of physics literature regarding their ability to defuse the indeterminism without excessive ontological cost.

  **Tier 1: Sophisticated Substantivalism**
  This is the orthodox consensus because it preserves the manifold for vacuum solutions while blocking indeterminism by denying primitive thisness to points.

  **Tier 1 (Tie): Your Friend's Suggestion (Deflationary/Mathematical Equivalence)**
  This dissolves the problem rather than solving it by treating diffeomorphisms as representational redundancy rather than metaphysical distinctness, requiring no Leibnizian machinery.

  **Tier 2: Relationalism about Spacetime Points**
  This ontologically purges the source of the trouble but struggles to account for vacuum solutions without awkward modal additions or structuralist caveats.

  **Tier 3: Reductio on Individuality**
  This is diagnostically powerful but usually functions as the argument *for* Tier 1 rather than a standalone ontology, as it still requires a positive account of non-individual points.

  **Tier 4: Biting the Bullet (Accept Indeterminism)**
  This preserves naive substantivalism but at the cost of accepting a radical, unobservable indeterminism that violates the deterministic spirit of classical field theory.

  ***

  **Is your friend's suggestion a genuine extra option?**
  Yes, it is a genuine option, but it is not relationalism; it is best understood as **Deflationary Substantivalism** (closely associated with James Weatherall's 2018 analysis). Relationalism denies the existence of spacetime points entirely, whereas your friend's view allows the points to exist but denies that the mathematics distinguishes them in the first place. It differs from Sophisticated Substantivalism because Soph Sub admits there are two distinct mathematical models and posits a metaphysical principle (Leibniz equivalence) to identify them, whereas your friend argues that respecting the mathematical practice shows there is only *one* model description to begin with. It belongs in **Tier 1** because it is arguably the most parsimonious solution, though some philosophers worry it sweeps the metaphysical questions under the rug rather than answering them.
