answer: |-
  # ETHICS OF EVERYDAY LIFE: THE CONVENTION TREE

  **Instructions:** Follow the branches by answering the **Diagnostic Questions** in bold. Mark your path to find your ethical position.

  ### 1. THE MORAL WEIGHT SPLIT
  **Diagnostic:** *Is jaywalking on a dead street at 3am morally wrong, or merely unsafe/impolite?*
  *   **A. Merely unsafe/impolite (No Moral Weight)** → Go to **Branch 2A**.
  *   **B. Morally wrong (Has Moral Weight)** → Go to **Branch 2B**.

  ---

  ### 2A. THE NON-MORAL BRANCH (No Weight)
  **Diagnostic:** *Why queue when the line is empty and no one is scrambling?*
  *   **i. To avoid future hassle/confusion (Prudence).**
      *   **Leaf 1: The Pragmatist** (Conventions are tools for self-interest).
  *   **ii. To be polite, though not obliged (Etiquette).**
      *   **Leaf 2: The Mannerist** (Conventions are social aesthetics, not duties).

  ---

  ### 2B. THE MORAL BRANCH (Has Weight)
  **Diagnostic:** *What makes breaking the convention wrong?*
  *   **i. It ruins coordination/efficiency (e.g., standing wrong escalator side).** → **Source: Coordination**
  *   **ii. It violates reliance/fairness (e.g., tipping a server).** → **Source: Fairness**
  *   **iii. It expresses disrespect/arrogance (e.g., ignoring local norms).** → **Source: Disrespect**

  *(Take your Source above and apply the Visitor Split below)*

  ### 3. THE VISITOR SPLIT (Apply to Coordination, Fairness, or Disrespect)
  **Diagnostic:** *When visiting a culture where the local convention differs (e.g., tipping is rude), are you bound by the local rule?*
  *   **i. Yes, simply because it is the local rule.**
      *   **Leaf 3 (Coord):** **Local Conventionalist**
      *   **Leaf 4 (Fair):** **Tip Localist**
      *   **Leaf 5 (Disresp):** **Ritualist**
  *   **ii. Only if the local rule serves the moral principle (e.g., actually helps efficiency/fairness).**
      *   **Leaf 6 (Coord):** **Efficiency Moralist**
      *   **Leaf 7 (Fair):** **Reliance Moralist**
      *   **Leaf 8 (Disresp):** **Expressive Moralist**
  *   **iii. No, follow universal/home norms regardless of local practice.**
      *   **Leaf 9 (Coord):** **Coordination Universalist**
      *   **Leaf 10 (Fair):** **Fairness Universalist**
      *   **Leaf 11 (Disresp):** **UNNAMED** (See Analysis)

  ---

  ### ANALYSIS OF LOGICAL SPACE

  **Unoccupied Positions:**
  *   **Leaf 11 (Disrespect + Universalist):** Likely **Incoherent**. If the moral wrong is *disrespecting the local norm*, one cannot simultaneously hold that local norms never bind. This view collapses into Leaf 8 or Leaf 2.
  *   **Leaf 5 (Disrespect + Localist):** **Unexplored**. Rare to argue one must follow local norms *solely* to avoid expressing disrespect, without appealing to fairness or coordination.

  **Indistinguishable Positions:**
  *   **Leaf 1 (Pragmatist) vs. Leaf 6 (Efficiency Moralist):** Both advise following conventions only when they "work." The tree cannot easily tell apart a student who queues for *self-interest* from one who queues for *social efficiency* without probing their internal motivation.
  *   **Leaf 7 (Reliance Moralist) vs. Leaf 10 (Fairness Universalist):** In practice, both often yield the same action (tip if relied upon), differing only on whether the *local rule* itself holds authority.

  **Diagnostic Key:**
  1.  **Jaywalking (3am):** Tests Moral Weight.
  2.  **Empty Queue:** Tests Prudence vs. Rule-following.
  3.  **Escalator Side:** Tests Coordination vs. Disrespect.
  4.  **Tipping (Where Rude):** Tests Fairness vs. Localism.

  *(C) First-Year Ethics Unit | Fit for A4 Handout*
