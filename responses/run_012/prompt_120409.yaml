answer: |-
  ### The Action/Meaning Decision Protocol (AMDP)

  **Purpose:** To filter archaeological interpretations into three buckets: **Descriptive (Action-Side)**, **Institutional (Patterned Action)**, and **Speculative (Meaning-Side)**.
  **Time Required:** ~2 hours per assemblage.
  **Users:** Lead Archaeologist + Descendant-Community Liaison (for Step 5).

  **Core Distinction:**
  *   **Action-Side:** Claims about physical manipulation (manufacture, use, deposition) supported by wear analysis, stratigraphy, and spatial data.
  *   **Meaning-Side:** Claims about internal states (belief, intent, theology, symbolism) inferred from the Action-Side.

  ---

  #### The Procedure

  **Q1: The Verbal Filter (Action-Side Verification)**
  *   **Question:** Can every verb in your draft label be replaced with a physically observable term without losing descriptive accuracy? (e.g., change "offered" to "placed"; change "valued" to "transported from source X"; change "ritual" to "repeated deposition").
  *   **Sufficient Answer:** Yes. The text describes only movement, modification, or association of matter.
  *   **Stop Condition:** If **No**, rewrite the text until **Yes**. Do not proceed to Q2 until the Action-Side is clean.
  *   **Why:** Prevents smuggling meaning into the description of action.

  **Q2: The Recurrence Test (Institutional Threshold)**
  *   **Question:** Does this specific configuration of objects and actions appear more than once, across different contexts or time slices, within the study area?
  *   **Sufficient Answer:** Yes. There is a statistically significant pattern (e.g., >3 instances with similar variables) that excludes random accident.
  *   **Stop Condition:** If **No**, stop. You have an *event*, not an *institution*. Label must remain singular/descriptive (e.g., "A cache was placed" not "Caches were placed").
  *   **Why:** Beliefs and institutions imply shared norms. A single instance cannot prove a norm.

  **Q3: The Functional Exclusion (The "Utility" Filter)**
  *   **Question:** Can the observed Action-Side (Q1) be fully explained by immediate practical utility, preservation, or waste disposal, without invoking symbolic intent?
  *   **Sufficient Answer:** No. Practical utility has been ruled out (e.g., the object was unusable, the location was inaccessible for daily use, the modification reduced function).
  *   **Stop Condition:** If **Yes**, stop. Label must remain functional (e.g., "Tool storage" not "Votive offering").
  *   **Why:** Occam's Razor. Do not multiply mental entities beyond necessity.

  **Q4: The Specificity Gap (Meaning-Side Boundary)**
  *   **Question:** Does the remaining gap between Action and Function *require* a specific belief (e.g., "afterlife"), or does it only require a general social norm (e.g., "status display" or "group membership")?
  *   **Sufficient Answer:** It requires only a general social norm.
  *   **Hand-Off Condition:** If the answer is **Specific Belief** (e.g., "They believed the dead travel west"), hand the decision to the **Descendant-Community Liaison**.
  *   **Why:** Evidence can support "this mattered to them" (Norm). It rarely supports "this is what they thought" (Belief). The latter is a narrative choice, not an evidentiary one.

  **Q5: The Stakeholder Veto (Values & Stance)**
  *   **Question:** (To be answered by Liaison) Does the proposed Meaning-Side claim conflict with oral history, traditional knowledge, or community values, even if the evidence is ambiguous?
  *   **Sufficient Answer:** No conflict.
  *   **Stop Condition:** If **Yes**, the claim is vetoed regardless of archaeological probability.
  *   **Why:** Epistemic authority over meaning belongs to the descendants when evidence is underdetermined.

  ---

  #### Where This Procedure Will Misfire

  1.  **The "Silent Ritual" Problem:** If a belief system explicitly forbids material deposition (e.g., sky burial, ephemeral art), this procedure will return a "Stop" at Q2. You will fail to detect the institution because it left no pattern *in your data*, not because it didn't exist.
  2.  **The "Social Utility" Blindspot:** Q3 assumes "utility" is distinct from "symbol." In many societies, social signaling *is* a utility (e.g., burying a tool to claim land rights). The procedure may force you to label a political act as "symbolic" when it was actually "practical" in their context.
  3.  **The Individual Genius:** If a single artisan created a complex symbolic object that was never repeated, Q2 kills the "belief" claim. You will miss the emergence of new ideas that hadn't yet become institutions.

  ---

  ### Case Runs

  #### Case 1: Rockshelter Cache of Ochre with Engraved Geometric Marks
  *   **Assemblage:** 14 pieces of ochre, 8 with incised cross-hatching. Found together in a sealed layer. No other artifacts in immediate cluster.
  *   **Draft Label:** "Ritual cache of sacred pigment used for ceremonial body painting."

  **Running the AMDP:**
  *   **Q1 (Verbal Filter):** "Ritual" and "sacred" are removed. "Ceremonial" is removed.
      *   *Revision:* "Collection of ochre pieces, some with incised cross-hatching, placed together in a rockshelter." (Pass)
  *   **Q2 (Recurrence):** Is this cache one of many?
      *   *Data:* This is the only cache found in 10 seasons of survey in this region.
      *   *Result:* **No.**
      *   *Outcome:* **STOP.**
      *   *Label Consequence:* You cannot claim "Ritual" or imply a shared practice. It is a singular event. The label must read: "A collection of ochre... was placed." You cannot infer a "ceremonial" institution from a single data point.
  *   **Q3 (Functional Exclusion):** (Skipped due to Stop, but for argument's sake): Ochre has adhesive/preservative uses. Engraving increases surface area for grinding.
      *   *Result:* Plausible functional explanation exists.

  **The Unwanted Truth:**
  This procedure tells you that you **cannot call this a ritual.** You have a singular deposition of useful material. The "geometric marks" might be tallying, grip improvement, or testing hardness. Without recurrence (Q2), "belief" is philosophically inaccessible. You wanted to label it "evidence of early symbolic behavior"; the AMDP forces you to label it "modified pigment."

  #### Case 2: Cemetery with Imported Shells and Worn Tools
  *   **Assemblage:** 20 burials. 5 contain imported marine shells. 3 of those 5 also contain heavily worn stone tools. 15 burials have no goods.
  *   **Draft Label:** "High-status individuals buried with goods for use in the afterlife."

  **Running the AMDP:**
  *   **Q1 (Verbal Filter):** "High-status" implies social valuation (Meaning). "For use in the afterlife" implies belief (Meaning).
      *   *Revision:* "Five individuals buried with non-local shells and used tools. Fifteen individuals buried without objects." (Pass)
  *   **Q2 (Recurrence):** Is this patterned?
      *   *Data:* Yes, 25% of the population receives this treatment. It is a repeated differentiation. (Pass)
  *   **Q3 (Functional Exclusion):** Can utility explain the deposition?
      *   *Data:* Tools are "heavily worn" (near exhaustion). Shells are "imported" (costly to acquire). Burying them removes them from the economic cycle.
      *   *Result:* **No.** Practical utility would suggest recycling the tool or keeping the shell. Removing them from circulation suggests a non-functional norm. (Pass)
  *   **Q4 (Specificity Gap):** Does this require "afterlife" belief?
      *   *Analysis:* Burying goods could signal status to the *living* (conspicuous consumption), memorialize the dead without implying an afterlife, or provision the dead. The evidence (Action-Side) supports "removal from circulation," but does not distinguish between "giving to ancestors," "showing off to neighbors," or "sending to next world."
      *   *Result:* **Hand-Off.** The evidence supports "Institution of Differentiated Burial," but not "Belief in Afterlife."
  *   **Q5 (Stakeholder Veto):** Liaison review.
      *   *Scenario:* The descendant community holds that their ancestors did *not* believe in an afterlife, but believed in becoming part of the land.
      *   *Result:* The "Afterlife" claim is vetoed.

  **The Outcome:**
  The label cannot say "for use in the afterlife." It must say: "Some individuals were buried with valued objects, suggesting social differentiation." The specific *meaning* of that differentiation is handed to the Liaison. If the Liaison says "This represents our belief in becoming the land," you may print that, but you must acknowledge it is **Traditional Knowledge**, not **Archaeological Inference**.

  ---

  ### What This Procedure Cannot Do

  No amount of procedural care will license the following inferences. If your museum requires these, you are doing mythology, not archaeology.

  1.  **Phenomenology:** You cannot know what the action *felt like*. You can know they buried a tool; you cannot know if they felt grief, duty, fear, or indifference.
  2.  **Theology:** You cannot identify specific agents (gods, spirits) without texts. You can infer "non-practical deposition," but you cannot infer "offering to a Sky God."
  3.  **Distinction between Belief and Habit:** You cannot distinguish between "I do this because I believe it is true" and "I do this because this is how it is done." The Action-Side looks identical for true belief and unthinking custom.
  4.  **Resolution of Competing Narratives:** If two descendant groups have conflicting oral histories about the site, this procedure cannot adjudicate who is right. It can only tell you where the archaeology stops and the oral history begins. Q5 hands the authority to them, but it does not solve the conflict.

  **Final Note:** This procedure is designed to protect you from overreach. It will make your labels drier. It will make your "belief" claims vanish. This is the cost of philosophical legitimacy.
