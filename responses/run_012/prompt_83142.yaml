answer: |-
  **Project Title:** The Ladder Trap: Distinguishing Wellbeing Improvement from Expectation Management in National Happiness Rankings

  **The Research Question**
  Under what conditions does targeting a national happiness score improve actual citizen wellbeing, and when does it merely manipulate the measurement?

  Current policy debates treat the World Happiness Report as a scorecard: if the number goes up, policy is working. This project argues that the number is a composite of two distinct drivers: genuine improvement in living conditions and shifts in what citizens consider "possible" or "normal." Because the metric cannot distinguish between these drivers, a government can raise its score by lowering expectations rather than raising living standards. This project will determine whether public data exists to separate these drivers, and if not, establish clear guidelines for why governments should not treat the ranking as a primary policy target.

  **Why This Matters**
  Governments are increasingly adopting wellbeing budgets and using happiness rankings as key performance indicators. This is dangerous if the metric is vulnerable to Goodhart's Law: when a measure becomes a target, it ceases to be a good measure.

  Three specific risks justify this inquiry:
  1.  **The Same-Number-Two-Causes Problem:** A score increase looks identical whether it comes from better healthcare or from a media environment that convinces citizens the "best possible life" is out of reach. If we cannot tell the difference in the data, policymakers might inadvertently reward expectation management over material improvement.
  2.  **The Zero-Sum Trap:** Rankings are positional. Only one country can be number one. If every government aims to "top the rankings," the goal is mathematically incoherent. Policy needs to distinguish between improving absolute wellbeing (which everyone can do) and improving relative rank (which is impossible for all to achieve).
  3.  **The Agency Problem:** Who is the "country" acting here? A statistical office publishing data acts differently than a ministry chasing a target. If the act of targeting changes the behavior of the respondents (e.g., they answer surveys differently because they know the government is watching), the measure loses its validity over time.

  **Methodology and Work Plan (12 Months, Part-Time)**
  I will approach this as a data analyst, not a philosopher. The work is divided into four phases.

  *Months 1–3: Reconstruction and Stress-Testing*
  I will rebuild the happiness index from published public data (Gallup World Poll, World Bank, UN data) in a transparent spreadsheet model. I will not try to improve the index, but to break it. I will run sensitivity analyses to see how much the score moves based on changes in the "ladder" anchors (best/worst life) versus changes in the supporting variables (GDP, social support, health). This establishes the mechanical relationship between the inputs and the final rank.

  *Months 4–6: The Toy Model*
  I will construct two hypothetical country scenarios.
  *   Scenario A: Material conditions improve, expectations remain stable.
  *   Scenario B: Material conditions remain stable, expectations narrow (the "best possible life" becomes harder to imagine).
  I will test whether existing public indicators (inequality data, media freedom indices, social mobility stats) can distinguish Scenario A from Scenario B retrospectively. If the public data cannot distinguish them, this is a negative finding of high value: it proves the metric is opaque to external audit.

  *Months 7–9: Case Studies of Movers*
  I will select two countries that showed significant score changes in the last decade (one up, one down). Using only public data, I will look for evidence of *how* they moved. Did economic indicators track the happiness score? Or did the score move while the economy stagnated? I am not looking for causal proof, but for plausibility. If a country's score rose while inequality widened and social support fell, it suggests an expectation-shift rather than a wellbeing gain.

  *Months 10–12: Synthesis and Deliverables*
  I will draft the final report, split into two distinct documents:
  1.  **The Minister's Brief:** A 5-page practical guide on the risks of using happiness rankings as targets, including a decision matrix for when the metric is safe to use and when it should be ignored.
  2.  **The Uncertainty Log:** An honest accounting of what could not be settled, specifically regarding the inability to separate expectation shifts from material gains in public data.

  **Success and Failure Criteria**
  *   **Success:** The project produces a decision matrix that allows a policy maker to look at a rising happiness score and identify at least one "red flag" indicator that suggests the rise might be due to narrowed expectations rather than improved lives. Alternatively, success is proving definitively that public data *cannot* make this distinction, thereby arguing against the metric's use as a target.
  *   **Failure:** The project concludes that the distinction is theoretically interesting but practically irrelevant to policy, or fails to produce a concrete tool (the Brief) that a non-specialist can use.

  **Feasibility and Scope Cuts**
  This scope is tight for a part-time year. The biggest risk is the Case Studies (Months 7–9). Deep causal analysis of country-level data is a career's work.
  *   **Cut Plan:** If the Toy Model shows that public data *cannot* distinguish the two causes, I will drop the Case Studies. A proven negative in the modeling phase is more valuable than a speculative case study. I will pivot those months to expanding the "Minister's Brief" to cover other wellbeing metrics (like OECD Better Life Index) to see if they suffer the same flaw.
  *   **Data Constraint:** I will strictly use open-source data. I will not attempt to access micro-data or request new surveys.
  *   **Academic Constraint:** I will not engage in the philosophical debate of "what is happiness." I will treat the Cantril Ladder as a fixed object and analyze its behavior as a policy tool, not its validity as a psychological measure.

  **Deliverables**
  1.  Open-source spreadsheet model of the Happiness Index.
  2.  "The Minister's Brief" (Practical Policy Guide).
  3.  "The Uncertainty Log" (Technical Appendix on limitations).
  4.  A public blog post summarizing findings for a general audience.

  This project does not ask "Are people happy?" It asks "Is this ruler broken for the job we are giving it?" That is a question data can answer.
