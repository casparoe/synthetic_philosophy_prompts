          *   *Cut:* Don't try to prove *causality* in the case studies. Just look for plausibility. Don't try to solve the philosophical definition of happiness. Stick to the *policy usage* of the metric.
          *   *Risk:* Data access. User said "public data only." Stick to World Happiness Report data + World Bank data.
          *   *Advice:* Focus heavily on the "Toy Model" and the "Minister's Brief." The case studies might need to be scaled back if data is messy.

      *   **Success/Failure Criteria:**
          *   *Success:* A clear framework for ministers to decide *not* to chase the rank, or a way to distinguish the two causes.
          *   *Failure:* Concluding "we just can't know." (Though the user says an honest list of unsolved things is a deliverable, so "failure" needs to be about not producing the tool).
          *   *Refinement:* Success = A decision matrix. Failure = Ambiguity that prevents decision making.

      *   **Tone Check:**
          *   Avoid academic jargon ("ontological," "epistemological").
          *   Use the user's phrases ("same-number-two-causes," "zero sum").
