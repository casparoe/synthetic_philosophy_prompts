      *   **Key Themes to Include:**
          1.  *Same-Number-Two-Causes:* Score goes up either by improving life *or* by narrowing expectations/reference points. Can we tell the difference?
          2.  *Positional/Zero-Sum:* Ranking implies competition, but well-being isn't zero-sum. Aiming for #1 is incoherent as a general policy.
          3.  *Agency & Goodhart's Law:* Who is the "country"? Government? Stats office? Once a measure becomes a target, it ceases to be a good measure.
