  - clear stabbing pain in her knee, asked whether she's in pain. verdict: glowing.
  - asked whether she believes the seminar is on tuesday; she'd assert it sincerely, no hedging, no doubt. verdict: glowing.
  - asked whether she's more anxious than she was yesterday, difference right at the edge of what she can tell apart. verdict: not glowing.
  - asked whether she's imagining a beach right now, and the image is vivid and unambiguous. verdict: glowing.

