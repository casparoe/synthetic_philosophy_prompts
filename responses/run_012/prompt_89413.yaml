          *   *Claim:* "And because the premise-based procedure always returns a logically consistent set of collective judgments, adopting it removes the difficulty: if the panel fixes the premises by majority vote and lets logic supply the rest, the collective judgment cannot be inconsistent, and the dilemma is dissolved."
          *   *Assessment:*
