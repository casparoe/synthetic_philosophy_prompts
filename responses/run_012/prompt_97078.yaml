  **Theoretical Motivation:**
  Leading positions leave this question open. Intrinsicists argue unpleasantness is a phenomenal property of the sensory state; thus, asymbolia must involve a loss of (i). Attitudinalists argue unpleasantness is a conative attitude toward a neutral sensation; thus, asymbolia involves a loss of (ii) while (i) remains. Both camps claim asymbolia as evidence, rendering the data theoretically inert without finer granularity. If asymbolia abolishes (iii) but leaves (i) and (ii) intact, neither view is confirmed. By disentangling (i)–(iv), this project determines which component is actually severed by insular damage, thereby constraining the metaphysical debate.

  **Methodology:**
  Over one term, I will execute a conceptual analysis triangulated against existing clinical case studies.
  1.  **Conceptual Mapping:** Weeks 1–4 will be dedicated to rigorously defining distinctions (i)–(iv), establishing criteria for their independence. I will argue that (i) and (ii) are conceptually separable, contrary to views that treat unpleasantness as inherently motivating.
  2.  **Comparative Case Analysis:** Weeks 5–8 will compare asymbolia against neighboring dissociations: nociceptive registration without feeling (spinal reflexes) and hypnotic analgesia (felt sensation without dislike). This matrix isolates whether asymbolia is unique in preserving sensory intensity while abolishing aversiveness.
  3.  **Data Triangulation:** A key challenge is reliance on asymbolic self-report. Patients state, "It hurts, but it doesn't bother me." I will treat these reports not as transparent windows into phenomenology but as behavioral data requiring interpretation. I will cross-reference verbal reports with observed behavior (e.g., failure to withdraw despite acknowledging danger) to distinguish between a loss of dislike (ii) versus a loss of imperative force (iii). If a patient acknowledges harm but fails to act, (iii) may be compromised even if (ii) is reported as intact.
  4.  **Drafting:** Weeks 9–12 will focus on synthesizing these analyses into a draft chapter, explicitly addressing counterarguments from both intrinsicist and attitudinalist perspectives.

  **Success and Failure Conditions:**
  Success looks like a mapped topology of pain's normative dimensions, demonstrating that asymbolia specifically targets one component (e.g., dissociating (i) from (ii)). This would show whether "badness" is intrinsic to the feel or relational to the subject's attitude.
  Failure would occur if: (a) the four-way distinction collapses under phenomenological pressure (e.g., if (i) conceptually entails (ii)); or (b) clinical reports prove too thin or inconsistent to support any specific reading, leaving the data ambiguous regarding the intrinsic/relational debate.

  **Feasibility:**
  This project is feasible within a single term. It requires no new empirical data collection, relying instead on re-analysis of published case studies and conceptual groundwork. The scope is limited to the first dissertation chapter, focusing solely on the interpretation of asymbolia rather than a full theory of pain. The primary risk is the scarcity of detailed phenomenological reports in neurological literature, but this limitation itself constitutes a viable negative result regarding the data's utility for philosophy of mind.
