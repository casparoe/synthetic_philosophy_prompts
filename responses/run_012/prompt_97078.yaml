      **Project Title:** Dissociating Badness: Pain Asymbolia and the Structure of Unpleasantness

      **Research Question:**
      Pain asymbolia—where patients perceive noxious stimuli without suffering—is standardly recruited to support a two-component view of pain, separating sensory-discriminative processing from motivational-affective evaluation. However, this argument relies on an equivocation regarding "the badness of pain." This project asks: Does asymbolia support a relational account on which pain is bad because it is disliked, over an intrinsic account on which unpleasantness is a feature of the sensory state itself? Crucially, which of the following distinct notions does the clinical data actually bear on: (i) the phenomenal quality of unpleasantness; (ii) the subject's dislike of the sensation; (iii) the sensation's functioning as an imperative to act; or (iv) the prudential badness of the experience?

      **Theoretical Motivation:**
      Leading positions leave this question open. Intrinsicists argue unpleasantness is a phenomenal property of the sensory state; thus, asymbolia must involve a loss of (i). Attitudinalists argue unpleasantness is a conative attitude toward a neutral sensation; thus, asymbolia involves a loss of (ii) while (i) remains. Both camps claim asymbolia as evidence, rendering the data theoretically inert without finer granularity. If asymbolia abolishes (iii) but leaves (i) and (ii) intact, neither view is confirmed. By disentangling (i)–(iv), this project determines which component is actually severed by insular damage, thereby constraining the metaphysical debate.

      **Methodology:**
      Over one term, I will execute a conceptual analysis triangulated against existing clinical case studies. First, I will rigorously define distinctions (i)–(iv), establishing criteria for their independence. Second, I will compare asymbolia against neighboring dissociations: nociceptive registration without feeling (spinal reflexes) and hypnotic analgesia (felt sensation without dislike). This comparative matrix isolates whether asymbolia is unique in preserving sensory intensity while abolishing aversiveness.

      A key methodological challenge is reliance on asymbolic self-report. Patients state, "It hurts, but it doesn't bother me." I will treat these reports not as transparent windows into phenomenology but as behavioral data requiring interpretation. I will cross-reference verbal reports with observed behavior (e.g., failure to withdraw despite acknowledging danger) to distinguish between a loss of dislike (ii) versus a loss of imperative force (iii). If a patient acknowledges harm but fails to act, (iii) may be compromised even if (ii) is reported as intact.

      **Success and Failure Conditions:**
      Success looks like a mapped topology of pain's normative dimensions, demonstrating that asymbolia specifically targets one component (e.g., dissociating (i) from (ii)). This would show whether "badness" is intrinsic to the feel or relational to the subject's attitude.
      Failure would occur if: (a) the four-way distinction collapses under phenomenological pressure (e.g., if (i) conceptually entails (ii)); or (b) clinical reports prove too thin or inconsistent to support any specific reading, leaving the data ambiguous regarding the intrinsic/relational debate.

      **Feasibility:**
      This project is feasible within a single term. It requires no new empirical data collection, relying instead on re-analysis of published case studies and conceptual groundwork. The scope is limited to the first dissertation chapter, focusing solely on the interpretation of asymbolia rather than a full theory of pain. The primary risk is the scarcity of detailed phenomenological reports in neurological literature, but this limitation itself constitutes a viable negative result regarding the data's utility for philosophy of mind.

