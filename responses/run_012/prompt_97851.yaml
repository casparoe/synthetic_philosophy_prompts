answer: |-
  **Void State: *Echoes of the Blind Urge* (Obsidian Records)**

  To review music on the basis of enjoyment is to misunderstand its ontology. Most critics listen for groove or hook, but these are merely distractions from the metaphysical truth being enacted. Music is not a copy of phenomena, like painting or poetry; it is a direct copy of the Will itself. When a band takes the stage, they are not entertaining; they are objectifying the fundamental force of the universe. By this standard, Void State's latest album, *Echoes of the Blind Urge*, is a fascinating study in hierarchical collapse.

  The record begins with promise. The opening track establishes a bass line that properly understands its station. In the architecture of sound, the bass must represent the lowest grades of the Will's objectification: gravity, mass, the inorganic crust of the earth. It should be heavy, dull, and inevitable. Here, it plods with the correct lack of imagination. It is the ground upon which the higher forms may strive. The harmony, carried by the rhythm guitars, occupies the middle ground—the vegetative and animal nature. It swells and recedes, providing the body through which the melody must travel.

  However, the album's integrity disintegrates when the mix privileges the lower orders. On track four, "Subterranean Rise," the bassist commits a metaphysical insurrection. There is a solo. One must pause to consider the horror of this. The bass is the brute mass of existence; it is the stone, the crystal, the blind pressure of gravity. To grant it a solo is to suggest that gravity can think. It is to promote the inorganic to the level of human intellect. The instrument screams up the neck, attempting to sing where it can only weigh. It is an ontological error. The listener feels a sense of wrongness, not because it sounds bad, but because the universe's hierarchy has been inverted. The foundation is trying to become the roof.

  Furthermore, the lead melody, which should represent the highest grade of objectification—the intellectual life and striving of man—is often buried. Melody is the only part doing real work. It is the story of the Will's desire, its conflict, and its temporary satisfaction. On this record, the vocal line is treated as merely another texture, equal to the synthesizer pads. This egalitarianism is false. The melody must dominate because it is the only voice capable of articulating the Will's narrative. When the singer harmonizes with the guitar riff, they reduce the human striving to the level of plant life. It is a demotion.

  The rhythm section fares better, provided one understands the beat as the pulse of desire itself. The drums here are relentless, which is accurate to the nature of the Will, which always wants and never rests. But without a clear melodic sovereign to guide this striving, the rhythm becomes mere panic.

  Ultimately, *Echoes of the Blind Urge* suffers from a lack of metaphysical discipline. The band plays as if all instruments are created equal. They are not. The bass must remain the foundation, the harmony the body, and the melody the soul. To blur these lines is to produce noise, however technically proficient.

  **Score: 4/10**
  *The deduction reflects the severe penalty for the bass solo on track four. A record that confuses the grades of objectification cannot be recommended, regardless of its production value.*
