  ### 1. Categorization Model: Homeostatic Property Cluster (HPC)

  For your purposes, **Family Resemblance** is too permissive; it explains why we *recognize* games but offers no principled boundary to generate verdicts on borderline cases (like the chess engine). **Prototype Theory** is psychologically accurate but philosophically weak for your goal; it yields graded membership ("more or less" a language game), whereas you are seeking binary verdicts (is/is not).

  The **Homeostatic Property Cluster (HPC)** account is superior here. On an HPC view, a kind is defined not by a list of necessary-and-sufficient conditions, but by a cluster of properties that tend to co-occur because of an underlying causal mechanism. For language games, the "mechanism" is **social coordination via normative accountability**. This allows surface features to vary (words vs. gestures, human vs. machine interface) without breaking the category, provided the underlying function (coordinating action through mutually intelligible norms) is present. This explains why peekaboo (gestures) and builders (words) cluster together, while chess search (causal processing) does not, despite both following rules.

  ### 2. The Principle: The Normative Social Coordination Account

  A system of interaction constitutes a language game if and only if it satisfies the following four conditions:

  1.  **Sign-vehicle Condition:** The interaction employs perceptible signals (linguistic or otherwise) that function as moves within the system.
      *   *Motivating Case:* **Peekaboo.** This clause prevents the exclusion of non-linguistic games. "Signs" are not restricted to propositional content but include gestures and cries that function as moves.
  2.  **Normative Accountability Condition:** The appropriateness of moves is subject to assessment (correction, validation, or sanction) by at least two distinct agents.
      *   *Motivating Case:* **Chess Engine Internal Search.** This clause excludes the chess engine. While modules manipulate symbols, they do not hold each other *accountable* in a normative sense; they process causally. There is no "mistake" in the normative sense, only a function return.
  3.  **Shared Telos Condition:** The interaction aims at a coordinated outcome mutually recognized by the participants as the point of the activity.
      *   *Motivating Case:* **Builder Case & Market Transaction.** This distinguishes language games from mere noise or solitary expression. The builder isn't just making sounds; they are *building*. The market strangers are *exchanging*.
  4.  **Enactment Condition:** The game exists only in the performance of the practice, not as a static structure or abstract object.
      *   *Motivating Case:* **Formal Language (Abstract).** This clarifies that a logic textbook's calculus is not a game *until* it is taught or used. The rules alone are the board, not the play.

  ### 3. Predictions for New Cases

  **Case A: A bilingual speaker's code-switching in a single sentence.**
  *   **Verdict:** **Yes, this is a language game (or a move within one).**
  *   **Reasoning:** It satisfies the **Sign-vehicle Condition** (words from two lexicons function as moves) and the **Shared Telos Condition** (the switch often signals a specific social alignment or contextual frame mutually recognized by interlocutors). It is a rule-governed practice of coordination. The HPC model accommodates this easily: the "signs" cluster varies, but the mechanism (social coordination) remains stable.

  **Case B: A formal proof checked by a machine with no human participant.**
  *   **Verdict:** **No, this is not a language game.**
  *   **Reasoning:** It fails the **Normative Accountability Condition**. Without a human participant to *take* the machine's output as a validation or correction, the process is purely causal symbol manipulation. The machine does not "recognize" the proof in the normative sense required for a language game; it merely computes a truth value. It is a calculation, not a communicative act.

  ### 4. The Verdict You Must Give Up

  The principle forces you to reconsider your verdict on the **Proof Assistant's type-checking dialogue**.

  **Your Verdict:** "A proof assistant's type-checking dialogue with a user is one."
  **The Conflict:** You exclude the **Chatbot** because "something in the exchange [must be] mutually recognized as done," implying the chatbot fails to genuinely recognize the action. However, a proof assistant is also software. It does not possess normative agency; it cannot *recognize* an action in the social sense any more than a chatbot can. It merely returns a boolean value (type check passed/failed).

  **Why you must give it up (or qualify it):**
  If you maintain that the Chatbot is *not* a language game because it lacks mutual recognition, consistency demands the same for the Proof Assistant. The machine is a tool, not a participant.
  *   **The Correction:** The language game is not between the *user and the machine*. It is between the **user and the mathematical community**, *mediated* by the machine. The machine acts as a proxy for the community's norms.
  *   **Implication:** You must admit that the Proof Assistant case is only a language game insofar as the human treats the machine's output as a move from the *community* (e.g., "The system is telling me my proof is invalid by *our* standards"). If treated as a solitary tool use (like a calculator), it falls out of the category, just like the chess engine. Your current distinction between Chatbot and Proof Assistant relies on an ambiguity about whether the machine is a partner or a proxy; the HPC principle forces you to clarify that the machine is never the partner.
