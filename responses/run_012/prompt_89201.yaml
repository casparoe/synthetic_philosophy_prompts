      Let's go with a maintenance crisis. A "jam."
      If you treat it as balls, you have to un-jam billions of collisions.
      If you treat it as a blob, you just push the piece back.
      But if you push the piece back without fixing the ball, it jams again.
      So you have to do both, but you can't acknowledge both simultaneously in the moment.

      Okay, ready to write.

