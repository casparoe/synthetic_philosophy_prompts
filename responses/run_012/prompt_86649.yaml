          2.  **The Logical Uncertainty/Counterpossible Problem:** If I choose Defect, and we are identical, then *you* choose Defect. But what if I *could* choose Defect while you Choose Cooperate? SR requires a specific metaphysics of logic (logical counterfactuals). If that metaphysics is incoherent, SR collapses.
