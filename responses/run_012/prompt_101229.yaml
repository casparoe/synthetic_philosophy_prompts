      *   **The Case:** A "transfer box" moves suffering between two people (100 units on one -> 50/50 split). Intensity/duration dial exists but isn't the main focus here (main focus is distribution). Total suffering remains constant (100 units).
      *   **Key Conflict:** R is indifferent to the transfer. S prefers the transfer (50/50 is better than 100/0).
      *   **Key Objections:**
          *   R to S: Leveling-down objection. If you make it better without reducing total suffering (and actually increasing one person's suffering), what are you measuring? Is equality a non-suffering value?
          *   S to R: Aggregation problem. Is suffering really summable? Can we condemn cruelty that keeps total constant?
      *   **Topics to Explore:** Aggregation vs. distribution, commensurability across persons, cruelty, asymmetry (creating happy vs. suffering people), painless instant end to life (benign elimination), whether S is still "suffering-focused."
      *   **Tone:** Real dialogue, not bumper stickers. Honest ending, no tidy handshake, no fake resolution. Acknowledge walls hit.
