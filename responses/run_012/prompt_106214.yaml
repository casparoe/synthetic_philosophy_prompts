answer: |-
  **HARROW INSTITUTE OF ART**
  **Conservation Department Report #492-B**
  **Object:** *Portrait of a Kneeling Figure* (c. 1924)
  **Attributed Maker:** Julian Harth

  **Object and Provenance**
  Oil on canvas, 80 x 60 cm. Acquired 1950 via the Estate of L. Harth. Attribution confirmed 2023 via pigment analysis and correspondence regarding the subject's confinement during execution. Note: If reattributed to Harth's assistant (who prepared the ground), the work functions as a standard study. As a Harth, the work functions as a document of coercion. The aesthetic weight is provenancial; the canvas is identical, the work is not.

  **Condition**
  Structurally stable. Canvas tension within acceptable parameters. Surface varnish shows minor oxidation consistent with age. No physical evidence of distress corresponding to the subject's reported status during production. The ground layer is intact; no delamination observed where moral pressure might be expected to concentrate.

  **Examination and Analysis**
  UV fluorescence reveals no previous restoration overpainting attempting to mitigate the figure's expression. X-radiography indicates no compositional changes; the positioning was decisive. Solvent tests on the dark background yield standard resin profiles. Crucially, spectral analysis detects no anomalous density in the paint layer correlating to the artist's documented actions. The instruments return a negative result: the monstrosity is not a material property. It is not in the binder. It is not in the weave. The fault lies exclusively in the biography of the maker, yet it permeates the viewing experience.

  **Treatment Proposal**
  No intervention recommended. Inpainting the figure's expression to reduce viewer discomfort would constitute falsification. Removing the attribution would stabilize the ethical environment but degrade the aesthetic object; the tension provided by the known coercion is load-bearing. To sanitize the provenance is to collapse the composition. The work relies on the viewer's knowledge of the act to achieve its intended spatial depth. Cleaning is limited to surface dust. The stain is not removable.

  **Risk Assessment**
  High risk of viewer distress. Low risk of physical degradation. Institutional reputation risk moderated by contextual signage. The object does not degrade when looked at, but the viewer's capacity to look may degrade under the weight of the provenance.

  **Recommendation**
  Continue display. The decision to exhibit is not an aesthetic verdict but a curatorial mandate. The object remains property of the Harrow Institute. A covering note will clarify that display constitutes preservation of evidence, not endorsement of method. The separation of art and artist is not physically possible here; the separation of display and approval is administratively possible.

  **Appendix A: Minority Note (Curatorial)**
  The horror is the achievement. The painting demands complicity; it requires the viewer to occupy the position of the captor to see the figure correctly. This is not a moral failure of the object but a success of its realism. To remove the threat is to remove the light. The work is better because the artist was worse; it tells the truth about power.

  **Appendix B: Minority Note (Ethics Review)**
  The flaw is internal. The painting asks the viewer to go along with a perspective they cannot morally occupy. This is an artistic defect, not merely a biographical one. If the viewer cannot take up the perspective the picture demands, the difficulty is a defect in the picture, not the viewer. The work fails to function for a moral agent. It is broken art. Leave it unresolved.
