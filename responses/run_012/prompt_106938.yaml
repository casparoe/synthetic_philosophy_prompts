answer: |-
  **Proposal Title:** The Ethics of the Reset: Diegetic Content vs. Interactional Relation in Virtual Cruelty

  **Research Question**
  Does the moral significance of gratuitous cruelty toward NPCs (specifically via save-scumming to engineer worse outcomes) reside in the *diegetic content* of the act (the simulated suffering) or in the *interactional relation* established by the player (the practice of manipulating the system)?

  **The Problem: Why Standard Accounts Fail**
  Current discourse on virtual ethics generally collapses into two opposing camps, both of which fail to account for our specific intuitions regarding save-scumming for cruelty.

  1.  **The Fictionalist/Null View:** This position argues that because the NPC is code and the pain is simulated, no harm occurs. Therefore, the act is morally neutral. This fails because it cannot explain why many players feel a distinct sense of unease or "dirty hands" even when they agree no sentient being was harmed. It treats the game as a closed ontological box, ignoring the player's agency.
  2.  **The Realist/Virtue View:** This position argues that virtual acts are rehearsals for real ones; therefore, cruelty to an NPC reveals a vicious character. This fails because it overstates the stakes. It conflates *playing* a villain with *being* a villain, and it cannot distinguish between cruelty that is narratively required (e.g., a tragic plot point) and cruelty that is gratuitously engineered by the player via mechanics.

  Both views fixate on the *object* of the act (the NPC/Death). My proposal argues that both are looking in the wrong place. The moral weight does not sit in the fiction (the diegesis) nor strictly in the player's soul (virtue), but in the *interactional relation*—the specific practice of engaging with the game system and the implied community of players.

  **Methodology: Developing the Diegetic/Interactional Split**
  To argue this, I will distinguish between two layers of gameplay:
  *   **Diegetic Content:** What happens "in the story." (e.g., The NPC dies.)
  *   **Interactional Relation:** What the player does *with* the game as a system. (e.g., The player manipulates time and state to maximize suffering for the sake of curiosity or amusement.)

  I will argue that the "wrongness" of save-scumming for cruelty is a violation of the *ludic contract*. It is not that the NPC suffers, but that the player treats the game system as a sandbox for sadism in a way that violates the normative expectations of play. This explains why "nobody's harmed" feels insufficient (it ignores the relational violation) while "you're a bad person" feels hyperbolic (it ignores the magic circle).

  **Case Studies and Stress Testing**
  I will stress-test this distinction using two contrasting case studies where the diegetic content is identical (an NPC dies gruesomely), but the interactional relation differs.

  1.  **Case A: The Neutral Sandbox (*The Elder Scrolls V: Skyrim*)**
      *   *Scenario:* The player saves before engaging a friendly NPC, kills them in various ways to observe ragdoll physics, and reloads.
      *   *Analysis:* The game system treats this as neutral. There is no mechanical penalty, and the narrative does not acknowledge the reset.
      *   *Prediction:* Under my framework, the moral unease here is generated entirely by the *player's* awareness of the interactional violation, not the game. The game fails to register the interactional relation, leaving the moral weight entirely on the player's conscience.

  2.  **Case B: The Meta-Commentary (*Undertale* / *NieR: Automata*)**
      *   *Scenario:* The player attempts to reset to achieve a "worse" outcome (e.g., the Genocide route in *Undertale*).
      *   *Analysis:* The game system *remembers* the resets. It breaks the fourth wall to address the player directly, scolding the interactional act rather than just the diegetic outcome.
      *   *Prediction:* This confirms the Interactional Hypothesis. The game locates the "sin" not in the death of the characters (which happens anyway in neutral runs), but in the player's *decision to reload and try again*. The moral weight is explicitly coded into the interactional relation.

  **Success and Failure Conditions**
  *   **Success:** The proposal succeeds if I can demonstrate that the *Undertale* example generates a stronger, more specific moral response than *Skyrim* precisely because it targets the interactional relation. If I can show that the "wrongness" tracks with the *system's response to the reset* rather than the *severity of the virtual death*, the distinction holds.
  *   **Failure:** The project fails if the "interactional relation" collapses back into virtue ethics (i.e., if "violating the ludic contract" is just a fancy way of saying "showing bad character"). I must prove that the violation is structural and contextual, not just psychological. If I cannot clearly separate the *practice* of playing from the *character* of the player, the distinction is useless.

  **Scope Assessment: Semester or Career?**
  Honesty check: This is a **career-level topic** disguised as a term paper.

  The philosophy of virtual ethics (Morgan Luck, Gualeni, Aarseth) is a dense, contested field. Fully defending the "interactional relation" against established Fictionalist and Realist accounts requires navigating the "Magic Circle," ludonarrative dissonance, and speech-act theory.

  **To make this viable for a 5,000-word semester paper:**
  1.  **Narrow the Scope:** I will not address all virtual cruelty. I will focus *exclusively* on the mechanic of **save-scumming/reloading**. This isolates the interactional element (manipulating time/state) from the diegetic element (the violence itself).
  2.  **Limit the Theory:** I will not attempt to build a full ethical framework. I will only argue for the *location* of the moral weight (Interactional > Diegetic), leaving the question of *why* that weight exists (consequentialist vs. deontological) for future work.
  3.  **Limit the Cases:** I will stick strictly to *Skyrim* (neutral) and *Undertale* (punitive). Adding more games will bloat the word count.

  **Recommendation:** If you advise that this is too ambitious, I am prepared to pivot to a purely descriptive analysis of how *Undertale* codes the reset mechanic as a moral violation, using the ethical framework only as a lens rather than the primary object of argument. However, I believe the distinction is sharp enough to defend in brief if I remain disciplined about the save-scumming constraint.

  **Timeline**
  *   **Week 1-2:** Finalize definitions of Diegetic vs. Interactional.
  *   **Week 3-4:** Draft analysis of *Skyrim* vs. *Undertale* mechanics.
  *   **Week 5:** Draft argument against Fictionalist/Realist standards.
  *   **Week 6:** Revision and polishing.

  **Request for Feedback**
  Does the distinction between "diegetic content" and "interactional relation" hold enough water to support a 5,000-word argument, or am I risking a category error that will collapse under scrutiny? I would appreciate your guidance on whether to narrow the focus further to just the *Undertale* case study.
