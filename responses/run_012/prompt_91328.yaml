      *   *"Possessing modal force":* Humeanism denies this. *Abandon.*
      *   *"Licensing counterfactuals":* Standard BSA tries to save this via the "best system" applying to nearby possible worlds, but it's weaker than Governing. *Reinterpret.*
      *   *"Explaining why a particular event happened":* Humeanism explains via prior events + regularities, not via laws *making* it happen. *Reinterpret.*
