prompt: |-
  Okay, I need help planning a class, not writing it. I'm a phil grad student and I've been roped into running a 90-minute session for a mixed crowd — a few phil grad students, two physicists, one very game undergrad — on the ethics of panpsychism. Specifically the question of whether, if experience goes all the way down, there's morally relevant suffering (or bliss, or anything at all) happening down at the level of fundamental physics. Please act like an expert in philosophy of mind and ethics who's taught this exact weird intersection before, and think carefully through the conceptual dependencies before you answer — maybe brainstorm the structure first.

  Dont explain panpsychism to me, I know it. What I want is a plan for how to explain it to them: the order the ideas have to come in, and why each depends on the last, so that the ethical question feels like it arises rather than gets announced. Which single case or example should carry the whole session — what does it need to have and not have — and why is the obvious candidate (a quark, or a rock) a trap? The misconceptions they'll walk in with or form along the way (I'm betting on "panpsychism means rocks are conscious so we have to be nice to rocks" and "more experience = more moral status"), and exactly where in the sequence I should head each one off. One question I can ask at the end that tells me whether they actually got the structure of the problem rather than just feeling spooky about quarks. And what I should deliberately not get into at this level, said out loud as a "we're not going there."

  Here's the twist I want to build the session around, because I made it up and I don't think they'll have heard it: introduce what I'm calling the "valence gap." The point being that panpsychism as usually defended is a thesis about experience, not about pleasure and pain — so the ethical question is really whether valence is also fundamental, or whether it needs something like integration or complexity or a certain kind of global availability before there's anything it's like to be helped or hurt. I want the whole arc to hinge on whether that gap is real or whether it's just a verbal dodge that falls apart once you press on it. So the order of ideas has to set that up: by the time they hear "valence gap" they should feel the pressure of it, not just nod. Keep it casual, no sources needed, just the teaching plan.
