          6.  2DS is just the analytic/synthetic distinction in new clothes.
          7.  Main payoff is handling indexicals ("I", "now").

  2.  **Deconstruct & Evaluate Sentence by Sentence:**

      *   **Sentence 1:** *"The view is that every expression has two intensions."*
          *   *Verdict:* Roughly correct, but simplified.
          *   *Nuance:* Proponents (Chalmers, Jackson) talk about two *dimensions* of intension. It's not necessarily that every *expression* has them independently, but that the content of an expression can be evaluated along two axes (epistemic and metaphysical).
          *   *Reaction:* Acceptable shorthand.

      *   **Sentence 2 & 3:** *"The primary intension is what the term picks out in the actual world; the secondary intension is what it picks out at other possible worlds."*
          *   *Verdict:* **Wrong/Confused.** This is the biggest technical error.
          *   *Correction:* Both intensions map *worlds* to extensions.
              *   Primary Intension (1-intension): Function from *centered* worlds (or scenarios) considered as *actual* to extensions. It answers: "Given this world is actual, what does 'water' refer to?"
              *   Secondary Intension (2-intension): Function from worlds considered as *counterfactual* to extensions, holding the actual reference fixed. It answers: "Given what 'water' actually refers to (H2O), what does it refer to in world W?"
          *   *Professor's Error:* She implies primary is *only* for the actual world and secondary is *only* for other worlds. That's not how functions work. Both are functions across worlds, but they differ in *how* the world is treated (as actual vs. as counterfactual).
          *   *Reaction:* A defender would wince hard here. This misses the core mechanism (the diagonal vs. horizontal).

      *   **Sentence 4:** *"Thats why 'Hesperus is Phosphorus' comes out a priori — you get the primary intension just by understanding the words..."*
          *   *Verdict:* **Wrong.**
          *   *Correction:* In 2DS (specifically the Chalmers/Jackson version), "Hesperus is Phosphorus" is *a posteriori* and *necessary*.
          *   *Why?* The Primary Intension of "Hesperus" is roughly "the bright star seen in the evening." The Primary Intension of "Phosphorus" is "the bright star seen in the morning." These are *different* functions. It is not *a priori* that the evening star is the morning star. You need empirical investigation.
          *   *Where does A Priori come in?* "Hesperus is Hesperus" is *a priori*. Or "Water is H2O" has a primary intension that is contingent (if XYZ were actual, water would be XYZ), but the statement "Water is H2O" is *a posteriori*.
          *   *Wait, is there a version where it's a priori?* Some 2DS frameworks distinguish between epistemic and metaphysical necessity. But claiming "Hesperus is Phosphorus" is *a priori* is a classic mistake. Kripke's whole point was that it's necessary but *a posteriori*. 2DS is designed to *preserve* Kripke's insight, not overturn it. It explains *why* it's necessary a posteriori.
          *   *Reaction:* A defender would reject this flatly. 2DS explains the necessary a posteriori; it doesn't turn it into the a priori.

      *   **Sentence 5:** *"...and also necessary, thanks to the secondary intension."*
