answer: |-
  This is the **Absent-Minded Driver** paradox (Piccione & Lipman, 1997). It is not a bug in your reasoning; it is a feature of decision theory when agency is fragmented by memory loss.

  Here is the principle that resolves your puzzle, followed by the specific verdicts on your six points and the prediction for the three-exit case.

  ### The Principle: Ex-Ante Optimal Mixed Strategy

  The governing principle is **Dynamic Consistency via Pre-commitment**.

  You are not two different agents (the Planner at home and the Driver at the exit). You are one agent whose future self cannot distinguish locations. Therefore, the "Driver" at the exit cannot re-calculate expected utility based on new information, because they have no new information. Their presence at an exit is *evidence* of the strategy chosen at home.

  To maximize payoff, you must choose a **probability $p$** (a mixed strategy) at home that maximizes the expected value of the *entire trip*, and you must program yourself to execute that probability blindly at every exit.

  **The Math for your 2-exit case:**
  Let $p$ be the probability you exit at any given exit.
  *   Probability of exiting at Exit 1: $p$ (Payoff 0)
  *   Probability of exiting at Exit 2: $(1-p) \times p$ (Payoff 4)
  *   Probability of reaching End: $(1-p) \times (1-p)$ (Payoff 1)

  Expected Value $E(p) = 0 + 4p(1-p) + 1(1-p)^2$
  $E(p) = 4p - 4p^2 + 1 - 2p + p^2$
  $E(p) = 1 + 2p - 3p^2$

  To maximize, take the derivative: $2 - 6p = 0$.
  **Optimal $p = 1/3$.**
  **Max Expected Value = 1.33.**

  ### Resolving Your Verdicts

  **1. Planning at home (Stay On):**
  *   **Verdict:** **Incorrect conclusion, correct method.**
  *   **Why:** You were right to plan at home, but "Always Stay" ($p=0$) yields a payoff of 1. The optimal plan ($p=1/3$) yields 1.33. "Stay On" is dominated by a mixed strategy. You shouldn't plan to stay; you should plan to randomize.

  **2. Standing at an exit (Exit Now):**
  *   **Verdict:** **Wrong. This must be given up.**
  *   **Why:** This intuition relies on the **Principle of Indifference** ("I don't know where I am, so it's 50/50"). This is false. The probability that you are at Exit 2 is *dependent* on the strategy you adopted at home. If you adopt the optimal strategy ($p=1/3$), the probability you are at Exit 2 given that you are at an exit is actually only 40% (derived via Bayes' rule on the strategy).
  *   The feeling that "Exiting might get me the 4" ignores the risk that "Exiting might get me the 0." Because you cannot distinguish the exits, you must treat the current exit as a representative sample of *all* exits you will encounter. If exiting is bad on average (which it is, if $p$ is too high), it is bad *now*.

  **3. Flipped Numbers (Exit Early):**
  *   **Verdict:** **Correct.**
  *   **Why:** This aligns with the principle. If Exit 1 is +5 and Exit 2 is -10, the optimal $p$ shifts toward 1. In extreme cases, $p=1$ (Always Exit) becomes optimal because the risk of hitting Exit 2 is outweighed by the guaranteed gain at Exit 1. Your reasoning ("the rule only ever gets applied at the first exit") is exactly how the ex-ante calculation works.

  **4. Information (Passenger/Signs):**
  *   **Verdict:** **Correct.**
  *   **Why:** Information breaks the symmetry. If you know you are at Exit 2, the probability of being at Exit 1 becomes 0. The constraint forcing the mixed strategy vanishes, allowing you to switch to a pure strategy (Exit at 2, Stay at 1). This confirms that the "cost" you identified is the cost of *indistinguishability*, which forces the mixed strategy.

  **5. Randomization (The Coin Flip):**
  *   **Verdict:** **Correct. This replaces Verdict 1.**
  *   **Why:** Your friend is right. Randomization is not a "tie-breaker"; it is the optimal control mechanism for absent-minded agents. It allows you to hedge. It gives you a 33% chance to grab the 4 at Exit 2, while limiting your exposure to the 0 at Exit 1. It beats "Stay On" (1.0 vs 1.33).
  *   **Principle implication:** Verdict 1 ("Stay On") is not the alternative to Verdict 2 ("Exit"). The alternative to "Exit" is "Randomize with $p=1/3$."

  **6. Repeated Trips:**
  *   **Verdict:** **Correct intuition.**
  *   **Why:** Over 100 trips, the Law of Large Numbers validates the ex-ante expected value. If you follow $p=1/3$, you will exit at Exit 1 roughly 33 times (Payoff 0) and Exit 2 roughly 22 times (Payoff 4), and finish the rest (Payoff 1). The average will converge to 1.33. The "blank out" prevents you from learning *during* the trip, but it doesn't prevent the strategy from working *across* trips.

  ### The Sacrifice

  You must give up **Verdict 2**.

  The feeling at the exit is a cognitive illusion caused by **self-locating uncertainty**. You feel like you can make a fresh decision, but you are actually executing a line of code written at home. If you re-optimize at the exit based on "I might be at the second one," you implicitly change $p$. If you change $p$, you change the probability of *arriving* at the second one. You cannot treat your arrival probability as fixed while changing your exit probability.

  Trust the plan (Verdict 1's method), but update the plan to include randomization (Verdict 5's insight).

  ### Prediction: The Three-Exit Case

  **Setup:**
  *   Exit 1: 0
  *   Exit 2: 0
  *   Exit 3: 4 (Assuming "good" matches the original "4")
  *   End: 1
  *   Constraint: Identical exits, memory wipe.

  **Calculation:**
  Let $p$ be the probability of exiting at any exit.
  *   Reach Exit 1: Prob 1. Payoff 0.
  *   Reach Exit 2: Prob $(1-p)$. Payoff 0.
  *   Reach Exit 3: Prob $(1-p)^2$. Payoff $4 \times p$.
  *   Reach End: Prob $(1-p)^3$. Payoff 1.

  $E(p) = 4p(1-p)^2 + (1-p)^3$
  Factor out $(1-p)^2$:
  $E(p) = (1-p)^2 [4p + (1-p)]$
  $E(p) = (1 - 2p + p^2)(1 + 3p)$
  $E(p) = 1 + 3p - 2p - 6p^2 + p^2 + 3p^3$
  $E(p) = 1 + p - 5p^2 + 3p^3$

  Maximize (derivative = 0):
  $1 - 10p + 9p^2 = 0$
  $(9p - 1)(p - 1) = 0$

  Roots are $p=1$ (Payoff 0) and **$p=1/9$**.

  **Prediction:**
  You should exit with **probability 1/9 (approx 11%)** at every exit.
  *   **Why:** With more "trap" exits (1 and 2) before the reward (3), you must become more conservative. In the 2-exit case, you exited 33% of the time. In the 3-exit case, you exit 11% of the time.
  *   **Expected Value:** $E(1/9) \approx 1.05$.
  *   **Comparison:** This still beats "Always Stay" (Payoff 1), but the margin is much thinner because the risk of exiting early (getting 0) has doubled (two bad exits instead of one).

  ### Summary
  1.  **Principle:** Pre-commit to an ex-ante optimal mixed strategy ($p$).
  2.  **Verdict 2 is the error:** Do not re-evaluate at the exit.
  3.  **Verdict 5 is the solution:** The coin flip implements the optimal $p$.
  4.  **3-Exit Case:** Exit with probability 1/9 at each exit.
