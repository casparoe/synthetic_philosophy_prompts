answer: |-
  **ClearView Dynamics – Subscriber Onboarding FAQ**
  **Subject:** Tier Functionality and Trust Architecture

  Welcome to ClearView. You have subscribed to clarity. The following questions address the operational differences between our **Stream** and **Shield** tiers. Both are designed to maximize your cognitive comfort, but they utilize different mechanisms to maintain truth integrity.

  **1. What is the functional difference between Stream and Shield?**
  Stream prioritizes efficiency through omission. We filter out low-relevance signals and divergent narratives before they reach your dashboard. You simply do not see the clutter. Shield prioritizes resilience through interpretation. It allows external signals to pass but applies our Proprietary Contextual Overlay (PCO). Essentially, Stream keeps the noise out; Shield teaches you why the noise is wrong. Stream is a quiet room; Shield is a fortified position.

  **2. What happens if I encounter contradictory information?**
  Stream subscribers rarely encounter contradictions, as our filters preemptively exclude competing data sets. If you are on Stream, confusion is usually a result of system error. Shield subscribers may encounter contradictions, but the PCO automatically flags the source's credibility score in real-time. This turns potential confusion into a validation opportunity. You do not just ignore the outside; you understand specifically why it fails to meet ClearView standards. Encountering error becomes proof of your own correctness.

  **3. Why would I upgrade from Stream to Shield?**
  Stream is ideal for a quiet life within the ecosystem. Shield is designed for engagement with the legacy web. If you plan to interact with non-subscribers or uncurated media, Shield provides the necessary immunization. It redirects trust from the message to the messenger. While Stream users are protected by absence, Shield users are protected by certainty. The upgrade does not provide more information; it provides better weapons against misinformation.

  **4. Can I tell which tier I am currently using?**
  Subjectively, both tiers feel identical: correct. The architecture of truth feels the same whether it is curated by omission or fortified by verification. However, there is a diagnostic metric. If you find yourself feeling anxious when confronted with outside data, you are likely on Stream; you are experiencing unprotected exposure. If you feel pity or superiority toward the outside data, you have successfully activated Shield. Both states are valid, but only one is combat-ready.

  **5. Is outside information ever considered valid?**
  Stream assumes outside information is unnecessary for your goals. Shield assumes outside information is structurally compromised by bias. Neither tier requires you to waste cognitive resources verifying external claims independently. Our epistemology is service-based. You subscribe to clarity, not debate. Trust is a finite resource; ClearView ensures yours is spent only on sources that have paid to be in the room.

  **6. How do I manage my subscription level?**
  You may downgrade from Shield to Stream at any time, though we advise against removing immunization once established. Upgrading from Stream to Shield requires a brief orientation module to calibrate your skepticism thresholds. Once installed, the Contextual Overlay is difficult to disable, as users typically report that raw data feels "unsafe" or "incomplete" without our interpretive labels.

  Thank you for choosing ClearView Dynamics. Please close this window to begin your calibration.
