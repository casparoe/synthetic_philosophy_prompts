answer: |-
  **Q&A Preparation Sheet: Colour Phi & Temporal Consciousness**

  **Audience Profile:** 8 Vision Scientists (empirical focus), 1 Eliminativist (anti-Cartesian), 1 Representationalist (early-state fixity).
  **Constraint:** No purely conceptual distinctions between experience and judgment accepted.

  **1. The Timing Objection (High Likelihood / High Damage)**
  **Question:** "You claim phenomenology isn't revised, but postdictive effects occur within 100ms, early enough to constitute perceptual content. How do you distinguish 'judgment' from 'perceptual binding' empirically? If the signal is altered before report, isn't that perception?" **(Vision Scientists)**
  **Reply:** "This isn't a conceptual distinction; it's a temporal one. The fast colour pathway (V1/V2) fires before the slow binding pathway (MT/V5) integrates motion. I propose a priming test: if the first dot primes colour-A responses despite verbal reports of colour-B, we empirically separate the perceptual state from the binding judgment. The 'filling-in' is a downstream narrative, not the sensory state itself."
  **Weakness:** Priming effects might also be subject to postdictive binding.
  **Strategy:** **Hold Ground.** Offer the priming test as falsifiable evidence. Emphasize latency disparities.

  **2. The Cartesian Theatre Objection (High Likelihood / Medium Damage)**
  **Question:** "You're positing an unreportable experience. If it doesn't influence behavior or report, in what sense does it exist? This reintroduces the Cartesian Theatre—a place where 'real' experience happens unseen." **(Eliminativist)**
  **Reply:** "It influences behavior, just not verbal report. Dissociations between physiological measures (pupil dilation, priming) and verbal report are common in blindsight and masking. I'm not positing a theatre, but parallel processing streams where only one reaches linguistic centers. The empirical dissociation replaces the conceptual distinction."
  **Weakness:** Hard to prove the 'experience' isn't just unconscious processing.
  **Strategy:** **Concede Accessibility, Hold on Existence.** Accept we can't access it verbally, but insist physiological data validates its presence.

  **3. The Representationalist Ally-Trap (Medium Likelihood / Low Damage)**
  **Question:** "Representationalism says early states fix phenomenology. If the fast pathway fires red, experience is red. Why do they say green? You agree with me, but your 'judgment' claim is unnecessary." **(Representationalist)**
  **Reply:** "I agree early states fix character, but subjects confuse the binding output with the sensory state. My account explains *why* the error occurs mechanistically, whereas pure representationalism often treats the error as brute. I provide the engineering schematic for your philosophical claim."
  **Weakness:** Risks collapsing into their view entirely, making your contribution seem redundant.
  **Strategy:** **Ally.** Frame thesis as mechanistic support for their view, distinguishing via explanatory power.

  **4. The Dreaded Question (Low Likelihood / Catastrophic Damage)**
  **Question:** "What is the neural correlate of the 'veridical' experience if it's never accessed by the binding pathway? If it's not accessed by higher-order systems, is it truly conscious?" **(Any)**
  **Reply:** "Consciousness doesn't require higher-order access; V1 activity suffices for phenomenal character. However, if you define consciousness strictly by global access, my thesis requires adjustment."
  **Weakness:** Contradicts Global Workspace Theory; undermines the "experience" claim.
  **Strategy:** **Hope Nobody Asks.** If asked, pivot to Q1's latency data. Do not engage in meta-consciousness debate.

  **General Advice:**
  *   **Avoid Philosophy Jargon:** Speak "latency," "pathways," and "dissociation," not "qualia" or "ontology."
  *   **Empirical Anchor:** Every claim about experience must be tied to a measurable signal (V1 vs. MT).
  *   **Time Management:** Keep replies under 2 minutes. If pressed, offer to discuss the priming experimental design offline.
