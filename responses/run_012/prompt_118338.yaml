      *   **Constraints:** 15 min presentation, 30 min Q&A. Order objections by likelihood/damage. Phrase objections as audience members would. Identify camp. Provide 2-minute reply, weakness note, concede/hold strategy. Include the "hope nobody asks" question. Under 900 words.

