prompt: |-
  I'm a postdoc who somehow became the de facto methods person for our lab — twelve of us, psych and behavioral-econ crossover — and the deal is that anyone about to write up a surprising result brings me the data and the draft, and I get about ninety minutes to say whether I think it's real before it goes out to a journal. It's a couple of times a month, the stakes are someone's first-author paper or a whole thesis chapter, so I can't just say 'looks fine, ship it' and I also can't be the guy who kills everything that walks in. What I keep reaching for is Occam's razor, and I know it's been formalized — Solomonoff's universal prior, Kolmogorov complexity, minimum description length, the whole picture where a shorter hypothesis gets more prior mass — but everytime I try to actually use it I get stuck on the translation. Description length in what language? Do I count free parameters, or bits, or how many plots I'd need to explain the thing to a smart undergrad? And the bit I can't shake: K is only pinned down up to an additive constant, which is harmless if you're taking limits over infinite data, except I have n=58. So please write me a procedure I can run in those ninety minutes: the questions in order, what counts as a sufficient answer to each, where it just stops and says no, and where it has to hand the decision back to me as taste or values rather than fact. Where a distinction that matters in the formal theory has to be dropped to make a checklist, say so and say what it costs me.

  Run it on two things from last term. First: a student found that people who watched a ten-minute nature video scored higher on a 'willingness to cooperate' scale than people who watched a news clip — big effect, n=58, the whole write-up describes it in a single sentence, no mechanism, and I happen to know she tried three other video conditions first. Second: a different project where the analysis is a hierarchical model with a couple dozen parameters and a long story about the one subgroup where the effect shows up, and honestly it does fit held-out data better than the simple version. I want to know whether my instinct to be more suspicious of the complicated one is anything better than instinct. Make sure at least one worked case comes out against what I'd like — either in favor of the ugly model or against the pretty one; if the procedure can only ever land on 'too complicated, don't believe it' then it isn't doing what the theory says it should and I'd rather you tell me that outright.

  One more thing, and it's half-baked. I've been wondering whether the right move is to charge the description length in units of 'how many analyses could have been run' — if she tried four video conditions and reported the best, the hypothesis I'm actually evaluating isn't 'nature videos help' but 'one of four videos helps', and that description is longer by roughly the log of four. Is that a legitimate reading of the formal picture, or am I just reinventing the garden of forking paths with extra steps? Related confusion: I've read that with enough data the prior washes out and Solomonoff induction converges no matter where you start, which makes me think the razor mostly does its work in small samples — but I've also seen it said that the complexity penalty grows as you collect more data. Both can't be the headline, so sort that out for me, and tell me what it implies about which cases I should be most suspicious of. Throughout: separate what's actually settled in this literature — theorems, provable equivalences — from what's contested or is just my lab's folklore, don't hand me a contested position dressed up as the consensus, and flag the steps where you're least confident. I'd rather have a procedure with honest holes than a tidy one that's quietly wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Postdoc, de facto methods person for a 12-person lab (psych/behavioral econ crossover).
      *   **Task:** Create a 90-minute decision procedure to evaluate surprising results before submission.
      *   **Core Tension:** Wants to use Occam's Razor/Solomonoff/Kolmogorov/MDL principles but struggles with implementation (language dependence, additive constants, small $n$).
      *   **Specific Inputs:** Two case studies (Nature video vs. News, $n=58$, $p$-hacking suspected; Hierarchical model, complex, fits held-out data better).
      *   **Constraints:**
          *   Must produce a concrete procedure (questions, order, stop conditions).
          *   Must distinguish fact (theorems) from folklore/contested views.
          *   Must address the "garden of forking paths" vs. description length question.
          *   Must resolve the confusion about priors washing out vs. complexity penalties growing with data.
          *   **Crucial:** At least one worked case must go against the user's instinct (support the complex model or reject the simple one).
          *   Tone: Professional, rigorous, honest about uncertainty, no "tidy but wrong" advice.

  2.  **Deconstruct the Theoretical Underpinnings:**
      *   *Solomonoff Induction/Kolmogorov Complexity:* Theoretically elegant but uncomputable. Depends on the choice of Universal Turing Machine (UTM). The additive constant issue is real and significant for small $n$ ($n=58$).
      *   *Minimum Description Length (MDL):* The practical cousin. $L(H) + L(D|H)$. Model complexity vs. fit.
      *   *Bayesian Model Selection:* Priors on models. BIC/AIC are approximations.
      *   *The "Prior Washes Out" vs. "Complexity Penalty" Confusion:*
          *   *Prior washes out:* As $n \to \infty$, the likelihood dominates the prior *for a fixed model*.
          *   *Complexity penalty:* In model selection (comparing $M_1$ vs $M_2$), the penalty for extra parameters *does not* vanish; in fact, BIC penalty is $\log(n) \times k$. So as $n$ grows, the requirement for evidence to justify complexity grows.
          *   *Resolution:* For *parameter estimation* within a model, data wins. For *model selection*, complexity matters more as $n$ grows (to prevent overfitting noise that looks like signal).
      *   *Forking Paths:* This is effectively increasing the "search space" size. In MDL terms, you must encode *which* analysis was selected. If the selection process isn't encoded, the description length is underestimated.

  3.  **Develop the 90-Minute Procedure:**
      *   Need to translate "bits/UTM" into "lab practicalities."
      *   *Phase 1: Data Integrity & Pre-processing (15 mins).* Garbage in, garbage out.
      *   *Phase 2: The "Search Space" Audit (30 mins).* This addresses the forking paths. How many tests were run?
      *   *Phase 3: Model Complexity vs. Fit (30 mins).* MDL/BIC approximation.
      *   *Phase 4: Plausibility & Mechanism (15 mins).* The "taste" part.
      *   *Stop Rules:* Hard stops for p-hacking, soft stops for "needs more data."

  4.  **Address the Specific Confusion Points:**
      *   *Language Dependence:* Acknowledge it. In practice, use "standard psych/econ vocabulary" as the proxy for the UTM.
      *   *Additive Constant:* Admit it's fatal for $n=58$ if taken literally. Shift to *comparative* MDL (BIC) rather than absolute Kolmogorov.
      *   *Forking Paths:* Yes, it is legitimate MDL. You are encoding the *selection procedure*, not just the result.
      *   *Data vs. Complexity:* Clarify the BIC behavior ($\log n$ penalty).

  5.  **Run the Procedure on the Two Cases:**
      *   *Case 1 (Nature Video):* Simple model, but hidden search space (4 conditions tried).
          *   *Instinct:* Suspicious (p-hacking).
          *   *Procedure Outcome:* High penalty for search space. Likely "No."
      *   *Case 2 (Hierarchical Model):* Complex model, fits held-out data.
          *   *Instinct:* Suspicious (too complex).
          *   *Procedure Outcome:* If it fits *held-out* data, the $L(D|H)$ term is low on unseen data. This is the key. MDL rewards generalization.
          *   *Constraint Check:* The user wants one case to go against instinct. The instinct is to be suspicious of the complicated one. If the procedure says "Keep the complicated one because it predicts held-out data," that satisfies the constraint. *Wait, let's look closer.* The user says "honestly it does fit held-out data better." If that's true, MDL *should* favor it. The user's instinct is "suspicious of complicated." So validating the complex model is the counter-intuitive result.
          *   *Refinement:* I need to make sure I don't just say "it fits held-out so it's good." I need to check if the complexity penalty outweighs the fit gain. But if it's *held-out* fit, that's the gold standard for overfitting. I will argue that if held-out fit is genuinely better, the complexity is *justified*, contradicting the "simple is always better" heuristic.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the burden. Validate the theoretical struggle (UTM problem is real).
      *   **Theoretical Clarifications (The "Sort that out" part):**
          *   Kolmogorov vs. MDL.
          *   The $n=58$ problem (constants matter).
          *   The Prior/Data confusion (BIC penalty grows with $\log n$).
          *   Forking Paths = Encoding the search.
      *   **The 90-Minute Protocol:**
          *   Break down into time blocks.
          *   Define "Pass/Fail/Gray" for each.
          *   Explicitly state where "Taste" takes over.
      *   **Case Study 1 (Nature Video):** Apply protocol. Highlight the "Garden of Forking Paths" penalty. Result: Reject/Major Revision.
      *   **Case Study 2 (Hierarchical):** Apply protocol. Highlight Held-Out validation. Result: Accept (Counter to instinct).
      *   **Caveats & Confidence Levels:** Be honest about where the math ends and the sociology begins.

  7.  **Refining the "Counter-Intuitive" Requirement:**
      *   User instinct: "Suspicious of the complicated one."
      *   My goal: Show the procedure *can* support the complicated one.
      *   How? By emphasizing *predictive accuracy* (held-out data) over *parametric parsimony*. MDL isn't just "fewer parameters"; it's "shortest total description." If the complex model compresses the *data* significantly better (including held-out), it wins.
      *   *Self-Correction:* I need to be careful not to overpromise on the held-out claim. If the "held-out" split was cherry-picked, it's fake. I will add a check for that. Assuming it's robust, the procedure supports the complex model.

  8.  **Refining the "Forking Paths" Question:**
      *   Is it legitimate MDL? Yes. If the hypothesis is "One of 4 videos works," the description length includes $\log_2(4)$ bits to specify *which* one. If the researcher doesn't report the others, they are hiding the code length.
      *   Terminology: "Selection Bias" in frequentist terms, "Model Search Cost" in MDL terms.

  9.  **Final Review against Constraints:**
      *   90-minute procedure? Yes.
      *   Questions in order? Yes.
      *   Stop conditions? Yes.
      *   Distinguish fact/folklore? Yes (e.g., Kolmogorov uncomputable vs. BIC computable).
      *   Case 1 & 2 analyzed? Yes.
      *   One case against instinct? Yes (Case 2).
      *   Address the $n=58$ constant issue? Yes.
      *   Address the prior/data confusion? Yes.

  10. **Tone Check:** Needs to be peer-to-peer, not lecturing. Respect the difficulty of the position. Acknowledge the "de facto" burden.

  *(Self-Correction during drafting)*: I need to make sure I don't validate the hierarchical model *too* easily. The user said "honestly it does fit held-out data." I must treat that as a premise but add a verification step in the protocol to ensure the held-out split wasn't manipulated. If it passes that, then the protocol supports it.

  *(Theoretical Nuance)*: The user asks about "complexity penalty grows as you collect more data." In BIC, the penalty is $k \ln(n)$. So yes, it grows. But the *likelihood ratio* grows linearly with $n$ (if signal exists). So signal wins eventually. But if there is *no* signal, the penalty ensures you don't pick the complex model. I need to explain this distinction clearly.

  Let's assemble the response.cw
answer: |-
  This is a heavy load to carry, and your intuition that the formal theory doesn't translate cleanly to $n=58$ is correct. You are running into the difference between *asymptotic* guarantees (where Solomonoff and MDL shine) and *finite-sample* reality (where additive constants and researcher degrees of freedom dominate).

  Below is the theoretical sorting you asked for, followed by the 90-minute protocol, and then the application to your two cases. I have flagged where the math is solid, where it is approximate, and where you are essentially doing ethics by another name.

  ### Part 1: Sorting the Theory (Fact vs. Folklore)

  **1. The "Language" and Additive Constant Problem**
  *   **Fact:** Kolmogorov complexity $K(x)$ is uncomputable and defined relative to a Universal Turing Machine (UTM). Changing the UTM changes $K(x)$ by an additive constant $C$.
  *   **Fact:** For infinite data, $C$ is negligible. For $n=58$, $C$ can be larger than the signal.
  *   **Implication:** You cannot calculate absolute description length. You can only calculate *relative* description length between two models using the *same* encoding language.
  *   **Practical Fix:** Your "UTM" is the standard vocabulary of your field (psych/econ). A "linear regression" is a primitive; a "custom neural net" is not. You are comparing $\Delta L$, not $L$.
  *   **Confidence:** High. This is a known limitation of algorithmic information theory in finite settings.

  **2. The "Prior Washes Out" vs. "Complexity Penalty" Confusion**
  *   **Fact:** Within a *fixed* model, as $n \to \infty$, the likelihood dominates the prior (Bernstein-von Mises theorem).
  *   **Fact:** In *model selection* (comparing Model A vs. Model B), the complexity penalty *increases* with sample size. In BIC (a proxy for MDL), the penalty is $k \ln(n)$.
  *   **Resolution:** As you get more data, noise averages out. If a complex model is just fitting noise, the evidence against it grows stronger as $n$ increases. If the complex model is capturing true structure, the likelihood grows faster than the penalty.
  *   **Implication for you:** You should be *more* suspicious of complex models in large datasets if they don't generalize, but in small datasets ($n=58$), you lack the power to distinguish signal from noise, so the prior (simplicity) must carry more weight.
  *   **Confidence:** High. This is standard Bayesian model selection theory.

  **3. Forking Paths as Description Length**
  *   **Fact:** If a researcher runs 4 analyses and reports the best, the hypothesis being tested is not "Effect exists" but "Effect exists in one of 4 specific specifications."
  *   **MDL Interpretation:** To reconstruct the data, you need to encode *which* path was taken. The cost is $\log_2(\text{number of paths})$.
  *   **Verdict:** Your intuition is legitimate. This is not just "garden of forking paths" folklore; it is an increase in the description length of the *model selection procedure*. If they don't report the other 3, they are hiding bits, making the description length artificially short.
  *   **Confidence:** Medium-High. This is theoretically sound (see "selective inference"), but quantifying the exact "number of paths" is often impossible, requiring heuristics.

  ---

  ### Part 2: The 90-Minute "Razor" Protocol

  This procedure prioritizes *comparative* description length over absolute truth. It assumes you cannot verify the code line-by-line in 90 minutes, so it focuses on the *structure* of the inference.

  **Time Allocation:**
  *   **0–15 min:** Data Integrity & Pre-processing Audit.
  *   **15–45 min:** The Search Space Audit (The "Hidden Bits" Check).
  *   **45–75 min:** Model Complexity vs. Predictive Fit (MDL Proxy).
  *   **75–90 min:** Plausibility & "Taste" Decision.

  #### Phase 1: Data Integrity (15 mins)
  **Q1: Are the exclusion criteria pre-registered or post-hoc?**
  *   *Pass:* Pre-registered or standard field practice (e.g., attention checks).
  *   *Fail:* "We removed outliers until $p < .05$."
  *   *Stop Rule:* If exclusions are clearly driven by the result, **STOP. Reject.** No amount of modeling fixes broken data.
  *   *Cost:* You may kill a valid finding where exclusions were justified but poorly documented. Require revision, not rejection, if documentation is just missing.

  **Q2: Is $N$ fixed?**
  *   *Pass:* Data collection stopped at a pre-determined $N$.
  *   *Fail:* "We collected until it was significant."
  *   *Stop Rule:* **STOP. Reject.** This invalidates the likelihood calculation entirely.

  #### Phase 2: The Search Space Audit (30 mins)
  *This addresses your "Forking Paths" question.*

  **Q3: How many "similar" analyses were possible?**
  *   *Action:* Ask the author: "How many variations of this analysis did you run before getting this one?" (Conditions, covariates, transformations).
  *   *Calculation:* Estimate $K_{search} \approx \log_2(M)$, where $M$ is the number of tried specifications.
  *   *Threshold:* If $M > 5$ and unreported, add a "complexity penalty" to their claim.
  *   *Stop Rule:* If the result disappears after a Bonferroni-style correction for $M$, **STOP. Reject.**
  *   *Theoretical Cost:* You are treating the *researcher's mind* as part of the model. This is not formal MDL (which requires a fixed algorithm), but it is necessary for human data.
  *   *Confidence:* Medium. This is the "honest hole." You are estimating $M$ based on trust and plausibility, not counting code.

  #### Phase 3: Complexity vs. Fit (30 mins)
  *This addresses the Simple vs. Hierarchical tension.*

  **Q4: Does the complex model improve fit on *held-out* data?**
  *   *Pass:* Yes, genuinely (e.g., cross-validation or true holdout set not used for tuning).
  *   *Fail:* No, or "we didn't do that," or the holdout set was used to tune parameters.
  *   *Rule:* If fit on held-out data is better, the complexity is **justified**. The data is compressing better with the extra parameters.
  *   *Rule:* If fit is only better on *training* data, the complexity is **penalized**.
  *   *Theoretical Fact:* This is the only place where complexity is "allowed." If parameters don't compress unseen data, they are just noise encoding.

  **Q5: Is the complexity "structured" or "ad-hoc"?**
  *   *Pass:* Hierarchical structure, regularization, priors grounded in previous literature.
  *   *Fail:* Polynomial terms, interaction terms added until significance, subgroup slicing without pre-specification.
  *   *Rule:* Structured complexity costs fewer "bits" in our field's "language" than ad-hoc complexity.
  *   *Confidence:* High. This aligns with the UTM concept of "primitives."

  #### Phase 4: Plausibility & Values (15 mins)
  *Here the math ends.*

  **Q6: Does the mechanism match the effect size?**
  *   *Action:* Compare the magnitude of the manipulation to the magnitude of the outcome.
  *   *Rule:* If a 10-minute video changes deep personality traits permanently, the description length of the *world model* required to believe this is huge.
  *   *Decision:* This is where you exercise "taste." If the result requires rewriting the textbook, the prior probability is vanishingly small. The evidence must be correspondingly massive (which $n=58$ is not).

  **Q7: The "Smell Test" Handoff**
  *   If the procedure hasn't stopped the paper, but you still feel uneasy, **you must own that unease as a prior, not a fact.**
  *   *Script:* "The math clears the hurdle, but my prior on this phenomenon is low. I recommend adding a replication caveat or toning down the claim."

  ---

  ### Part 3: Running the Protocol on Your Cases

  #### Case 1: The Nature Video ($n=58$, Simple Model, Hidden Conditions)
  *   **Instinct:** Suspicious (too simple, p-hacking suspected).
  *   **Protocol Run:**
      1.  **Data Integrity:** $N=58$ fixed? Assume yes.
      2.  **Search Space:** You know she tried 3 other conditions. $M=4$.
          *   *Penalty:* $\log_2(4) = 2$ bits of hidden information.
          *   *Impact:* In a frequentist frame, this is a $p$-value adjustment. In MDL, the hypothesis "Nature works" is actually "One of 4 videos works." The description of the *finding* requires specifying *which* video.
      3.  **Complexity:** Model is simple (t-test). Low parameter cost.
      4.  **Plausibility:** 10-minute video $\to$ cooperation scale. Effect size is "big."
          *   *Prior Check:* Literature on priming is mixed/replication-crisis heavy. Prior should be low.
      5.  **Decision:** **REJECT / MAJOR REVISION.**
      6.  **Why:** The "Hidden Bits" in Phase 2 kill it. Even if the model is simple, the *search procedure* was complex and unreported. The description length of the *process* is too long.
      7.  **Alignment:** Matches your instinct.

  #### Case 2: The Hierarchical Model (Complex, Fits Held-Out Data)
  *   **Instinct:** Suspicious (too complex, "ugly").
  *   **Protocol Run:**
      1.  **Data Integrity:** Assume standard.
      2.  **Search Space:** "Long story about one subgroup."
          *   *Risk:* Did they slice subgroups until one worked?
          *   *Check:* If the subgroup was pre-registered or theoretically motivated *before* seeing the data, Pass. If post-hoc, Fail (add search penalty). Let's assume for this exercise the subgroup was theoretically motivated (e.g., "high impulsivity" based on prior lit).
      3.  **Complexity vs. Fit:** **Crucial Step.** You stated: *"honestly it does fit held-out data better than the simple version."*
          *   *MDL Rule:* If $L(Data | Model_{complex}) < L(Data | Model_{simple})$ on *unseen* data, the complex model provides a shorter total description of reality. The extra parameters are earning their keep.
      4.  **Plausibility:** Hierarchical models account for individual variation. In psych/econ, people *are* heterogeneous. A model assuming homogeneity (simple) is often theoretically false.
      5.  **Decision:** **ACCEPT (with caveats).**
      6.  **Why:** The protocol forces you to acknowledge that "simplicity" is not the goal; "compression" is. If the complex model compresses held-out data better, it is objectively the better scientific tool, regardless of aesthetic ugliness.
      7.  **Alignment:** **Goes against your instinct.** You wanted to be suspicious of the complexity. The theory says: if it predicts, the complexity is real structure, not noise.
      8.  **Caveat:** You must verify the held-out split wasn't manipulated (Phase 3, Q4). If that holds, your instinct is biased toward aesthetic parsimony over predictive accuracy.

  ---

  ### Part 4: Where the Procedure is Fragile (The "Honest Holes")

  1.  **The $n=58$ Constant:**
      *   *Issue:* As noted, Kolmogorov complexity has an additive constant dependent on the UTM. With $n=58$, the "cost" of a parameter might be smaller than the constant uncertainty.
      *   *Mitigation:* The protocol uses *comparative* MDL (BIC/Cross-Validation) which cancels out some constant error, but you are still operating in a zone where statistical power is low.
      *   *Confidence:* Low. You are making high-stakes decisions on underpowered data. The protocol minimizes error, it doesn't eliminate it.

  2.  **Quantifying the "Search Space":**
      *   *Issue:* In Case 1, I assumed $M=4$. In reality, the "garden" includes covariates, transformations, and exclusion criteria. $M$ could be 100.
      *   *Mitigation:* You rely on the author's honesty.
      *   *Confidence:* Medium. This is the weakest link. It requires a lab culture where admitting "I tried 10 things" is safe.

  3.  **Held-Out Data Integrity:**
      *   *Issue:* In small labs, "held-out" data is often peeked at during model tuning.
      *   *Mitigation:* Ask to see the code script. Ensure the split happens *before* model fitting.
      *   *Confidence:* High (if you check code), Low (if you take their word).

  ### Summary Recommendation

  Your instinct to be suspicious of the complex model is a heuristic for "overfitting," but **overfitting is defined by failure to generalize, not by parameter count.**

  *   **Case 1** fails because the *selection process* was complex and hidden, even if the final model was simple.
  *   **Case 2** succeeds (counter-intuitively) because the *predictive performance* justifies the parameters.

  **The Headline:** In small samples ($n=58$), the prior (simplicity) matters immensely. However, "simplicity" means "shortest description of the *data generating process*," not "fewest parameters in the regression." If the world is hierarchical, a flat model is a lie, and a lie is not simple—it requires many exceptions to explain.

  Use the protocol to separate "hiding the search" (Case 1) from "modeling heterogeneity" (Case 2). That is the distinction Occam's Razor actually demands, even if it feels like you're letting the ugly model off the hook.
