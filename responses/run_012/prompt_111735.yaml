answer: |-
  You are standing at the classic fault line in the foundations of probability: the divide between **Objective Bayesianism** (logic/symmetry constrains belief) and **Subjective/Mechanism Bayesianism** (only physical facts or personal commitment constrain belief).

  Your intuitions are actually more consistent than you fear, but they commit you to a specific philosophical stance that your friend is challenging. You are implicitly operating with a version of **The Principle of Intrinsic Invariance**.

  Here is the principle that generates your verdicts, the analysis of your cases, the prediction for your new case, and the honest verdict on what you must sacrifice.

  ### 1. The Principle: Intrinsic Invariance on Primitive Spaces

  **Statement:**
  A credence distribution is *forced* (objective) if and only if:
  1.  **Primitive Space:** The problem description identifies a hypothesis space $\Omega$ that is *primitive* (not defined via an ambiguous parameterization of a deeper space).
  2.  **Transitive Symmetry:** There exists a group $G$ of transformations acting transitively on $\Omega$.
  3.  **Description Invariance:** The problem description is invariant under $G$ (i.e., the description provides no information that distinguishes $\omega$ from $g\cdot\omega$).
  4.  **Uniqueness:** There exists a unique measure $\mu$ on $\Omega$ (up to normalization) that is invariant under $G$.

  If these conditions are met, rationality requires $P = \mu$. If the space is not primitive (i.e., the "unknown" is a function of underlying variables not specified) or the group does not act transitively on the *described* space, the prior is conventional.

  ### 2. Mapping the Clauses to Your List

  *   **Clause 1 (Primitive Space):** This is the filter that saves you from Bertrand's Paradox.
      *   **Case 3 (Sphere):** "Point on a sphere" specifies the manifold (the surface $S^2$). This is primitive. The surface area measure is intrinsic to the manifold.
      *   **Case 4 (Chord):** "Chord in a circle" does *not* specify a primitive space. A chord is a derivative object. It can be parameterized by midpoints, by endpoints, or by distance/angle. These parameterizations define *different* manifolds with *different* intrinsic measures. The description "chord" fails to pick out *which* measure space we are on. Thus, unforced.
      *   **Case 5 (Cubes):** The interval $(1, 2)$ is primitive, but...
  *   **Clause 2 & 4 (Transitivity/Uniqueness):**
      *   **Case 5 (Cubes):** ...the interval $(1, 2)$ admits no transitive group of transformations that preserves the boundaries. Translation breaks the bounds; scaling breaks the bounds. No unique invariant measure exists. Thus, unforced.
      *   **Case 2 (Weighted Dice):** The physical facts break the symmetry group. The group of permutations no longer leaves the *physical setup* invariant. Thus, unforced.
  *   **Clause 3 (Description Invariance):**
      *   **Case 1 & 6 (Mechanisms):** Here, the "symmetry" is replaced by physical chance setups. The principle yields to physical facts (Clause 0: Mechanism Trumps Symmetry). These are forced, but by physics, not indifference.
      *   **Case 7 (Location-Scale):** The "unknown" is the parameter pair $(\mu, \sigma)$. The *statistical problem* is defined by the location-scale family. This definition *is* the invariance under shifting and rescaling. The space is primitive *relative to the model*. The right-invariant Haar measure ($1/\sigma$) is unique. Thus, forced.
      *   **Case 8 (Biased Coin):** The sequence space is primitive, but "biased coin" breaks exchangeability symmetry, and "3 heads" is data, not symmetry. Without a symmetry group acting on the bias parameter $\theta$ that is mandated by the description (unlike Case 7), the prior on $\theta$ is not forced.

  ### 3. Prediction: The Rigid Body Case

  **Case:** A rigid body's orientation in space is "random." No other info.
  **Verdict:** **Forced.**
  **Reasoning:**
  *   **Space:** The space of orientations is the rotation group $SO(3)$. This is a primitive manifold (like the sphere surface).
  *   **Group:** $SO(3)$ acts on itself transitively (by left multiplication).
  *   **Invariance:** "Random orientation" implies the description is invariant under any fixed rotation of the reference frame.
  *   **Uniqueness:** There is a unique Haar measure on $SO(3)$ (the uniform distribution over rotations).
  *   **Clause:** This relies on the same clause as **Case 3 (Sphere)**. Both rely on the unique invariant measure of a compact Lie group describing the state of the object.

  *Note:* If you were told the body was "tumbled in a specific machine," that would be a Mechanism Case (like 1). If you are told only "orientation is random," the symmetry of the *state space* forces the prior, exactly as in the sphere case.

  ### 4. The Honest Verdict: What You Have to Give Up

  You asked for an honest verdict on which of your eight intuitions must go. Here is the hard truth:

  **You cannot consistently hold that Case 3 is Forced while Case 4 is Unforced, unless you accept a distinction that threatens Case 7.**

  Here is the dilemma:

  **Option A: Side with your Friend (Mechanism Only).**
  *   **Verdict:** You must give up **Case 3 and Case 7**.
  *   **Reasoning:** If symmetry is only shorthand for mechanism, then "Point on Sphere" tacitly assumes a marking mechanism that is rotationally invariant. If you admit that, you admit it's a physical claim, not a logical one. If the mechanism is unknown (like Case 2), there is no fact of the matter.
  *   **Cost:** You lose the ability to do "objective" Bayesian inference in physics and statistics without explicit physical models.

  **Option B: Side with Yourself (Objective Bayesianism).**
  *   **Verdict:** You must give up **Case 4 (as Unforced)**.
  *   **Reasoning:** If symmetry of the description forces a prior in Case 3 (Sphere), it must do so in Case 4 (Chord). E.T. Jaynes argued precisely this: Bertrand's Paradox is not a paradox but a failure to specify the *invariance group* of the problem. If the problem is "a chord in a circle" and we assume the problem is invariant under translation, rotation, and scaling of the circle (the maximal ignorance assumption), there **is** a unique measure (the kinematic measure of lines). It yields the 1/2 solution.
  *   **Why your intuition resists:** You feel Case 4 is unforced because standard textbooks present it as ambiguous. But they present it as ambiguous because they allow the *agent* to choose the parameterization. Under the **Principle of Intrinsic Invariance**, the agent is *not* allowed to choose; they must find the group that leaves the *problem statement* invariant.
  *   **The Threat to Case 7:** If you accept Option B, you are an Objective Bayesian. You must accept that "maximum entropy" or "invariance" can generate facts from ignorance. This makes Case 7 secure, but it requires you to defend Case 4 against the charge of "but which parameterization?" The answer is: "The one invariant under the Euclidean group of the plane."

  **The Reductio:**
  If you insist that **Case 4 is Unforced** (because "chord" is ambiguous) but **Case 3 is Forced** (because "point" is not), you are relying on the linguistic primitivity of "point" vs "chord."
  *   *Counter:* A "point" can be parameterized by $(x, y, z)$ subject to $x^2+y^2+z^2=1$. If I assume uniformity on $x$, I get a different answer than uniformity on surface area. Why is "surface area" the forced one? Because it's the *intrinsic* measure of the manifold.
  *   *Counter-Counter:* The space of lines intersecting a disk *also* has an intrinsic measure (the kinematic measure). If you deny this for chords, you must deny it for the sphere surface.

  **Recommendation:**
  Keep **Case 3** and **Case 7**. They are the pillars of objective statistical inference.
  **Drop the intuition on Case 4.** Accept that Case 4 *does* have a forced answer (the Jaynes/kinematic solution), provided you interpret "random chord" as "a chord selected by a process invariant under the symmetries of the circle."
  If you refuse to do this, you are implicitly admitting that **Case 3** is also unforced (your Friend is right), and you are merely more comfortable with the tacit assumptions in the Sphere case than the Chord case.

  **Summary of Sacrifices:**
  1.  **If you want to keep 3 & 7:** You must accept that **4 is Forced** (by Euclidean invariance).
  2.  **If you want to keep 4 as Unforced:** You must admit **3 is Unforced** (tacit mechanism).

  Given you are a Phil Sci student who wants to save the normative power of symmetry (3 & 7), **Case 4 is the one to revise.** Embrace the Jaynes resolution. It is the price of admission for Objective Bayesianism.
