  **The Claritas Residence: Initial Metabolic & Environmental Assessment**

  **Welcome**
  Thank you for choosing Claritas. Our practice operates on a single foundational principle: thinking is not a disembodied activity but a symptom of metabolism. What you believe is often merely what you can digest. Therefore, we do not treat the mind in isolation. We treat the unity of your diet, your climate, and your residence as one biological question. Our methodology was forged over decades of migratory calibration across Europe, identifying the precise atmospheric pressures required for clear thought. Please complete this intake honestly. Note that while we ask for your self-report, our clinicians reserve the right to override your subjective experience if it contradicts your physiological baseline.

  **Intake Questionnaire**

  1.  **Geographical Instinct:** Where do you feel your breathing deepen without conscious effort? Do not list where you live now, but where your body feels it belongs. Many patients claim loyalty to their birthplace, but instinct often points elsewhere. If you say you prefer the north but your skin reacts to the damp, we will prioritize the skin. Your instinct either knows this or it does not; reasoning cannot correct a metabolic error.

  2.  **Dietary Resistance:** Describe your relationship to heavy cooking. Do you require sauces to feel nourished, or do you feel lighter after simple preparations? We operate under the assumption that complex cooking is a narcotic designed to mask indigestion. If you report cravings for rich stews, we will log this as a sign of physiological exhaustion rather than genuine hunger. You may feel you need the heat, but your stomach likely requires silence.

  3.  **Intellectual Symptoms:** What philosophical problem currently occupies you? Please describe the idea, then describe your last bowel movement. We correlate rigid moral systems with chronic constipation and nihilistic despair with liquid instability. Do not claim objectivity regarding your troubles. Objectivity is usually a disguised physiological need. If you say you are depressed by the state of the world, we will ask if you have been drinking wine or staying indoors too long.

  4.  **Substance Use:** Be precise regarding alcohol. Do not frame it as social lubrication. We classify alcohol as a crime against the future, a narcotic that dulls the precision of the instinct. If you claim you function better with a drink, we will assume your baseline functioning is impaired. Water is the only acceptable solvent here. If you dislike water, this indicates a deeper resistance to clarity.

  5.  **Movement and Rest:** How many hours do you walk daily? Not exercise, but walking. Thought is produced by the legs. If you claim to think best while seated, we will assume you are merely ruminating on indigestion. Our protocol requires hours of movement in southern air. If you resist this, ask yourself if you are protecting your fatigue because it feels familiar.

  **House Protocol**

  Upon acceptance, you surrender your personal rules to the residence. We provide light food, strictly timed. Heavy meals are prohibited as they divert blood from the brain to the gut, inducing moral fog. Alcohol is not permitted on the grounds; it is treated as a toxin that compromises the instinctual verification process. You will be assigned a room based on light exposure and airflow, not your preference. If you request a darker room, we will assume you are hiding from the climate your body requires.

  Our staff monitors your walk times. If you claim your instinct tells you to rest, but your posture suggests stagnation, we will instruct you to move. You are here because your own instinct failed you elsewhere. We do not universalize rules for humanity, but we do universalize the conditions for your specific recovery. You cannot choose the answer to where you belong; you must be shown it. If you feel resistance to the water, the air, or the light, understand that this resistance is the symptom we are here to cure. Welcome to Claritas.
