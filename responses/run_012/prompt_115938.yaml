answer: |-
  This is a classic formulation of the **Sorites Paradox** (the paradox of the heap) applied to ethics. Your friend has constructed a valid argument: if you accept premises (1) through (3), conclusions (4) through (6) follow logically. Since (6) is absurd (moral collapse), at least one of the earlier premises must be false.

  You want to keep (1) (harm/consciousness is the criterion) and (3) (no arbitrariness), and you want to reject (6). To do that, you have to cut the chain earlier.

  Here are the three places you can cut, ranked from the most philosophically standard to the most nuanced, along with the "cost" of each.

  ### Option 1: Cut Premise (2) — The "Panpsychist Trap"
  **The Cut:** You deny that the capacities for a subjective point of view come in a smooth, unbroken continuum all the way down to thermostats.
  **The Argument:** Premise (2) equivocates on the word "cares." A thermostat *functionally* regulates temperature, but there is no evidence it *phenomenally* experiences temperature. There is a difference between **homeostasis** (keeping a system running) and **sentience** (feeling like something is happening). You can argue that consciousness is an **emergent property** that switches "on" only when a system reaches a certain threshold of complexity (e.g., specific neural architecture), rather than being a dimmer that starts at zero.
  **The Cost:**
  1.  **The Boundary Problem:** If consciousness is a switch (on/off) rather than a dimmer, you have to admit there is a sharp line somewhere. You must accept that adding one specific neuron (or synaptic connection) could theoretically make the difference between a being that matters morally and one that doesn't. This feels biologically arbitrary.
  2.  **Loss of the Dimmer:** You lose your friend's core intuition. You are reverting to a binary view of moral status (moral patient vs. non-moral object).

  ### Option 2: Cut the Inference from (5) to (6) — The "De Minimis" Cut
  **The Cut:** You accept that moral status comes in degrees (4) and even that a thermostat might have a non-zero status (5), but you deny that *any* non-zero status creates a *practical moral obligation* (6).
  **The Argument:** Distinguish between **Moral Status** (intrinsic value) and **Moral Significance** (action-guiding weight). A single atom has weight, but it does not register on a bathroom scale. Similarly, a thermostat might have a moral status of $0.000000001$, but morality includes a **threshold of relevance**. Below a certain threshold, obligations are theoretically real but practically null. This is the legal principle *de minimis non curat lex* ("the law does not concern itself with trifles").
  **The Cost:**
  1.  **Theoretical Clutter:** You have to explain why a "real wrong" doesn't count in the moral ledger. You are essentially saying, "It is wrong, but you are allowed to do it."
  2.  **Aggregation Problems:** If you step on a billion beetles, do the tiny wrongs add up to a big wrong? If yes, you still face moral overload. If no, you have to explain why they don't aggregate.

  ### Option 3: Cut Premise (3) — The "Threshold" Cut
  **The Cut:** You accept that capacities come in degrees (2), but you deny that moral status must mirror those degrees perfectly (3).
  **The Argument:** Moral categories are often binary even when underlying traits are continuous. Consider "pregnant" or "adult." Biologically, these are gradual processes, but legally and morally, we draw sharp lines (viability, age 18). We accept the arbitrariness at the margins because we need functional categories to navigate the world. We can say, "Yes, the difference between this mouse and that nematode is tiny, but for the purpose of moral law, we draw the line here."
  **The Cost:**
  1.  **Accepting Arbitrariness:** You explicitly violate premise (3). You have to admit that moral status *is* somewhat arbitrary at the margins.
  2.  **Marginal Cases:** This makes it harder to defend the rights of "marginal" humans (e.g., infants or cognitively impaired individuals) if you admit that moral status is just a pragmatic line-drawing exercise rather than something intrinsic.

  ### Recommendation
  If you want to preserve common sense and avoid the "moral collapse" of (6), **cut Premise (2).**

  **Why?**
  Premise (2) is the most controversial claim in the argument. It smuggles in **Panpsychism** (the view that mind is a fundamental feature of all matter) without arguing for it. Most philosophers and scientists distinguish between *information processing* (which thermostats do) and *phenomenal consciousness* (which thermostats likely don't).

  By cutting (2), you preserve the intuition that "harm requires experience." A thermostat cannot be harmed because it cannot suffer; it can only be damaged. Damage is not harm in the moral sense.

  **The Cost to You:**
  You lose the elegant "Dimmer Switch" metaphor. You have to accept that moral status is likely a **Switch** (you are either sentient or you aren't), even if the biology underneath is fuzzy. You also take on the burden of explaining *where* the switch flips (e.g., "It's not about complexity, it's about the capacity for valenced experience like pain/pleasure, which requires a specific kind of nervous system").

  **If you love the Dimmer metaphor:**
  Then you must **Cut the move to (6).** You can argue that moral status is indeed a dimmer, but moral *obligations* have a "floor." A thermostat has status, but it is below the floor of obligation. This saves the Dimmer without forcing you to apologize to your laptop, but it requires a more complex ethical theory to explain why some "wrongs" don't count.
