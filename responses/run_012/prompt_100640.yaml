answer: |-
  There is no single, universally established term in the history or philosophy of science that precisely captures the phenomenon you describe. While the components of your description are well-discussed, the specific configuration—the **retrospective fusion of heterogeneous independent achievements into a single canonical unit**—lacks a dedicated noun phrase comparable to "multiple discovery" or "priority dispute."

  Below is an analysis of the nearest existing concepts, a proposal for terminology, and the "carving" of the phenomenon you requested.

  ### 1. Terminological Status and Nearest Neighbors

  **Confidence:** High (90%+) that no single standard term exists; Medium (70%) that the following concepts are the most relevant proximate tools.

  The phenomenon sits at the intersection of three established concepts, none of which fully capture your specific point about the *heterogeneity* of the original objects:

  *   **Multiple Discovery (Simultaneous Invention):**
      *   *Definition:* The independent discovery of the *same* idea by different individuals.
      *   *Why it fails:* As you noted, it presupposes identity ($A = A'$). It assumes the "thing" discovered is stable and pre-existing. Your phenomenon describes a situation where $A \neq A'$, but history records $B$ (where $B$ is a composite of $A$ and $A'$).
  *   **Obliteration by Incorporation (Robert K. Merton, 1968):**
      *   *Definition:* A process where an idea becomes so thoroughly absorbed into common knowledge that its source is forgotten.
      *   *Relevance:* This captures the *sociological* erasure of the distinct origins. However, Merton focused on the loss of *credit*, whereas you are focusing on the transformation of the *content* (the epistemic object) itself.
  *   **Rational Reconstruction (Imre Lakatos, 1970s):**
      *   *Definition:* The methodological practice of rewriting the history of a theory to make it logically coherent, often smoothing over false starts, inconsistencies, or distinct conceptual frameworks.
      *   *Relevance:* This is the closest philosophical match. Rational reconstruction is the *mechanism* by which the fusion occurs. Historians reconstruct the past to look like a straight line toward the present composite. However, "Rational Reconstruction" describes the *historian's method*, not the *ontological status* of the resulting discovery unit.
  *   **Black Boxing (Bruno Latour):**
      *   *Definition:* The process by which the complex internal workings of a scientific fact or technology are hidden, leaving only the input and output visible.
      *   *Relevance:* The "composite discovery" functions as a black box. The heterogeneity of its origins is sealed inside.

  **Proposed Terminology:**
  Given the gap, the most precise descriptive label currently available in scholarly discourse is **Retrospective Unification**. In Science and Technology Studies (STS), you might occasionally encounter **Epistemic Amalgamation**, but this is not standardized.

  If you are writing on this, I recommend using **Retrospective Unification** while explicitly defining it as you have: *the historiographical operation wherein heterogeneous independent achievements are fused into a single canonical object, thereby altering the conditions of attribution.*

  ### 2. The Carving: Boundaries and Distinctions

  Here is how this phenomenon distinguishes itself from its neighbors and how its internal boundaries function.

  #### A. What it is vs. What it is Not
  *   **Vs. Multiple Discovery:** Multiple discovery claims "They found the same thing." Retrospective Unification claims "They found different things, but we now treat them as one."
      *   *Example:* Newton and Leibniz did not discover the "same" calculus (fluxions vs. differentials/notation). Retrospective Unification treats "Calculus" as a singular object they both discovered.
  *   **Vs. Whig History:** Whig history is the *bias* of judging the past by present standards. Retrospective Unification is the *mechanism* or *outcome* of that bias applied to attribution units. Whig history is the lens; Retrospective Unification is the image produced.
  *   **Vs. Synthesis:** A synthesis (e.g., the Modern Evolutionary Synthesis) is often a conscious, contemporary effort to merge competing theories. Retrospective Unification is typically *unconscious* and *later*, imposed by textbook writers or historians rather than the practitioners themselves.

  #### B. Boundaries of Legitimacy
  When is this fusion a legitimate synthesis, and when is it a distortion?

  1.  **Legitimate Unification (Convergence):**
      *   *Condition:* The heterogeneous methods are later proven to be mathematically or logically equivalent, or to describe the same underlying structure.
      *   *Example:* Heisenberg's Matrix Mechanics and Schrödinger's Wave Mechanics. They were conceptually distinct and seemingly incompatible. Dirac and others proved their equivalence. Textbooks teaching "Quantum Mechanics" as a unified field is a **legitimate Retrospective Unification**.
      *   *Credit Implication:* Priority becomes shared or irrelevant; the focus shifts to the unified structure.

  2.  **Distortive Unification (Conflation):**
      *   *Condition:* The fusion hides conceptual incompatibilities that matter for future development or philosophical understanding.
      *   *Example:* Treating Darwin's theory of natural selection and Wallace's as identical. Wallace lacked Darwin's argument on the *accumulation* of variations over deep time and the specific mechanism of divergence. Merging them into "The Darwin-Wallace Theory" often obscures why Darwin's version was the one that generated a research programme.
      *   *Credit Implication:* It creates a false sense of inevitability. If $A$ and $A'$ are treated as identical, it suggests the "truth" was waiting to be picked up, rather than constructed by Darwin's specific conceptual commitments.

  3.  **The Special Case Boundary:**
      *   *Condition:* One discoverer finds a general principle ($G$), the other a specific instance ($S$).
      *   *Analysis:* If history credits both with $G$, it is distortive. If it credits the first with $G$ and the second with $S$, but textbooks teach $G$ using $S$'s examples without attribution, that is **Obliteration by Incorporation**.
      *   *Example:* Mendel (general laws) vs. various hybridizers (specific cases).

  #### C. Who Performs the Fusion?
  *   **Discoverer-Led:** The actors correspond and agree on a common framework (e.g., the correspondence between Fermat and Pascal on probability). This is **Collaborative Synthesis**, not Retrospective Unification.
  *   **Successor-Led:** A third party (e.g., Euler, Lagrange) formalizes the work of two predecessors into a single system. This is the most common site of Retrospective Unification.
  *   **Historian-Led:** Textbook authors or historians of science impose the unity long after the fact to simplify pedagogy. This is where the distortion is highest.

  #### D. Implications for Inevitability and Priority
  *   **Inevitability:** Retrospective Unification strengthens the "inevitability thesis" (that the discovery would have happened anyway). By smoothing over the heterogeneity, it makes the path look like a single funnel rather than divergent tributaries. It hides the contingency of *which* conceptual framework won.
  *   **Priority:** It renders priority disputes "meaningless" (as you noted) not because the contributions were equal, but because the *object* of the dispute did not exist at the time. You cannot have priority on a composite object that was assembled later. It shifts credit from "who got there first" to "whose framework was more absorbable into the composite."

  ### 3. Confidence and Uncertainty

  **Confidence in Terminological Claim:** **High (90%)**.
  I am confident that there is no single, dominant phrase in the mainstream history of science (e.g., in the works of Kuhn, Merton, Latour, or contemporary journals like *Isis* or *History of Science*) that serves as the standard label for this specific nuance. Scholars discuss the *components* (rational reconstruction, black boxing), but they do not typically name the *fusion of heterogeneous discovery units* as a distinct category separate from multiple discovery.

  **Confidence in Historical/Philosophical Analysis:** **High (85%)**.
  The distinction between "Multiple Discovery" (identity) and "Retrospective Unification" (fusion) is a robust analytical tool used implicitly by historians (e.g., in analyses of the Calculus priority dispute or the Darwin-Wallace reading), even if not explicitly named as such.

  **Point of Least Certainty:** **Medium (60%)**.
  The point I am least sure about is whether a niche sub-field within **Science and Technology Studies (STS)** or **Conceptual History** (*Begriffsgeschichte*) has coined a specific term in the last 15 years that has not yet permeated general historiography. Terms like "Epistemic Leveling" or "Ontological Collapsing" may exist in specific sociological papers regarding standardization, but they are not established as a general historical category for discovery attribution.

  ### Summary Recommendation
  If you are writing about this, do not search for a non-existent standard term. Instead, define **Retrospective Unification** explicitly.

  You might frame it this way:
  > *"While 'multiple discovery' describes the independent arrival at an identical result, **Retrospective Unification** describes the historiographical process by which heterogeneous results are fused into a single canonical object. This fusion creates a composite discovery that neither actor originally produced, thereby distorting the conditions of priority and inevitability."*

  This carving allows you to distinguish between legitimate mathematical equivalence (Heisenberg/Schrödinger) and historiographical conflation (Darwin/Wallace), providing the precision you feel is currently missing.
