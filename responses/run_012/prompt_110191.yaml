prompt: |-
  I'd like you to take the role of a philosopher who has spent a long career working on Quine and on metaethics, and who is good at explaining a position to someone who is interested but untrained. Please think carefully rather than giving me a survey: begin by thinking aloud for a few lines, mapping the space of possible readings and flagging where the terrain is uncertain, and only then commit to numbers. Write the whole answer in British English. I should say up front that I have no academic background and no access to books, journals or the internet, so please argue rather than point me at literature — I don't need reading lists or citations, and I couldn't check them if you gave me any.

  Here is the puzzle I've been turning over on my own. What I take from Quine's general picture of knowledge is that our beliefs don't get supported or revised one at a time: they hang together as a single connected body, none of them is immune to revision, and the sharp line between what is true by meaning and what is true by fact doesn't hold up. What I take from his remarks about morality is close to the opposite: that moral judgements are not answerable to observation the way scientific ones are, that there is no shared procedure for settling a moral disagreement the way there is for settling an empirical one, and that moral talk ends up looking less like findings and more like matters of taste, however serious. I can't get these two impressions to sit together, and I'd like to know where the pressure actually falls. If I've mischaracterised him, tell me plainly at the start and give me the correct characterisation in your own words — I'd rather be corrected than humoured.

  I'd like two credences, because I suspect they can come apart:

  (P) The philosophical claim: moral norms are answerable to experience in the same way scientific hypotheses are, and any appearance of a difference in kind is a difference of degree, of social scaffolding, or of how much disagreement we happen to put up with — not a difference in the kind of authority that experience has over them.

  (Q) The reading-of-Quine claim: his holism and his insistence on the special status of moral values cannot both be held; whatever he thought he was doing, his general account of knowledge leaves him no room to quarantine morality.

  For each, give me a number between 0 and 1 and then the decomposition — the sub-questions the number rests on, a rough probability for each with one line of justification, how they combine, and which sub-question the final figure is most sensitive to. Please treat at least these as candidates, and add any term you think belongs:

  1. Whether holism is even a doctrine about prescriptions at all, or only about beliefs — whether the body of knowledge contains commands and commitments, or only claims about how things are, and whether that distinction is doing real work or is just a way of talking.
  2. Whether "answerable to experience" can be pinned to one thing. It seems to me it might mean any of: experience can count for or against the judgement; there is a routine method for adjudicating disagreement about it; or its very content is fixed by observational conditions. Give me your estimate of the chance that these come apart in a way that leaves (P) indeterminate rather than simply false.
  3. Whether observation's anchoring role in science is evidential or social — whether it is really a matter of what supports what, or mainly a device that gets speakers to converge, in which case the contrast with morality may be about agreement rather than about evidence.
  4. Whether the underdetermination of theory by evidence, together with the pragmatic considerations we already use to choose between empirically equivalent theories, means that scientific justification is itself partly non-evidential — and if so, how much of the apparent gap closes.
  5. A thought of my own that I'd like you to price rather than dismiss: even if moral norms can't be tested on the spot, communities that live by certain norms flourish and others collapse, so experience does bear on them, only with a long lag and through survival rather than through inference. If that counts as answerability, how far does it raise your credence in (P), and if it doesn't count, why not?
  6. Whether the difference in kind, if there is one, is necessary or merely a feature of the current sociology of moral discourse — how many shared procedures we happen to have, how entrenched our disagreements happen to be.
  7. The chance that (P) is at bottom not a claim with a truth value at all, because "difference in kind" is too indeterminate to be right or wrong, so that whatever number you give me should be read as a credence in the nearest precisification rather than in (P) as I stated it.

  Then tell me which single term your numbers hang on most, what evidence or argument would move it most, and what it would amount to if (Q) came out high while (P) came out low — I want to know whether that combination is a stable position or just a way of having it both ways.
