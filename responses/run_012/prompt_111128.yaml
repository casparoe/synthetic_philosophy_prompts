      *   *Gerrymandering:* We can fit the story into Lakatos *because* we know the ending. We identify the "Hard Core" of the winners as the "true" hard core. We label the losers' moves as "ad hoc" because they lost. If the Acid Programme had found a virus instead, we'd label the bacterial search as the degenerating detour.
      *   *Conclusion on Framework:* The case supports "no instant rationality" (it took 10 years), BUT it exposes that Lakatos's criteria are too internalist. They miss the material/clinical nature of medical progress (cure > prediction) and the economic inertia of the protective belt.

