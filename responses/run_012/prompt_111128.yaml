          *   **Lakatos's Entitlement:** Lakatos cares about the *heuristic power* at the time, not truth. If the Bacterial Programme was generating new tests (even if failed initially) while the Acid Programme was just explaining away recurrence, the Bacterial one was progressive *then*, even if the Nobel came later. However, if they were just saying "it's the bug" without explaining *why* acid suppressors worked temporarily, they were degenerating.
