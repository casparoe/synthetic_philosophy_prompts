answer: |-
  # HANDOUT: The Utility Decision Tree

  **Instructions:** Do not look at the "Positions" at the end until you have followed the path. Answer each question based on your intuition about the concrete case provided. There are no "correct" economic answers here, only consistent philosophical ones.

  ---

  ### START HERE: The Regret Test
  **Case:** Imagine a person who is on a diet, knows it, wants to stick to it, and yet eats the cake. They feel immediate regret.
  **Question:** In that exact moment of eating, did the person choose something they **preferred less** than the diet?

  *   **NO:** (Choice defines preference. If they chose it, they preferred it.)
      *   → Go to **Node A**.
  *   **YES:** (Preference is internal. Choice can be wrong.)
      *   → Go to **Node B**.

  ---

  ### NODE A: The Vocabulary Test (Behavioral Path)
  **Case:** We agree preference is just a summary of what people choose.
  **Question:** Is the word "preference" a useful tool we should keep, or a confusing label we should ban and replace with "choice dispositions"?

  *   **BAN IT:** (We should only talk about physical behavior.)
      *   → **LEAF 1: Radical Eliminativism**
  *   **KEEP IT:** (It's a useful shorthand.)
      *   → Go to **Node C**.

  ### NODE C: The Risk Test (Measurement Path)
  **Case:** Since preference is just choice, look at how people gamble.
  **Question:** Does the way a person chooses between risky bets reveal the *intensity* of their preference (cardinal), or just the *ranking* (ordinal)?

  *   **INTENSITY:** (The numbers add up; we can measure strength.)
      *   → **LEAF 2: VNM Behaviorism**
  *   **RANKING:** (The numbers only show order; strength is meaningless.)
      *   → **LEAF 3: Strict Revealed Preference**

  ---

  ### NODE B: The Content Test (Mentalist Path)
  **Case:** We agree preference is a mental state that causes choice.
  **Question:** When you prefer X to Y, is your brain ultimately tracking **pleasure/pain** or **goal satisfaction**?

  *   **PLEASURE/PAIN:** (It's about how good it feels.)
      *   → Go to **Node D**.
  *   **GOAL SATISFACTION:** (It's about getting what you want, even if it hurts.)
      *   → Go to **Node E**.

  ### NODE D: The Summation Test (Hedonic Path)
  **Case:** We agree preference is about pleasure.
  **Question:** If Person A has 10 units of pleasure and Person B has 5, is the total pleasure 15? Can we add them up across people?

  *   **YES:** (Pleasure is a universal currency.)
      *   → **LEAF 4: Classical Hedonic Realism**
  *   **NO:** (Pleasure is real, but private and uncomparable.)
      *   → **LEAF 5: Ordinal Hedonic Realism**

  ### NODE E: The Origin Test (Desire Path)
  **Case:** We agree preference is about satisfying goals/desires.
  **Question:** When you face a brand new choice you've never made before, did the preference exist in your head *before* you chose, or did the act of choosing *create* the preference?

  *   **EXISTED BEFORE:** (I discovered my preference.)
      *   → Go to **Node F**.
  *   **CREATED:** (I constructed my preference by choosing.)
      *   → **LEAF 6: Preference Constructivism**

  ### NODE F: The Scan Test (Measurement Path)
  **Case:** We agree preferences are real, pre-existing mental desires.
  **Question:** If we had a perfect brain scanner, would we find a measurable *quantity* of desire (cardinal), or just a *ranking* of neural pathways (ordinal)?

  *   **QUANTITY:** (Desire has intensity like volume.)
      *   → **LEAF 7: Neuro-Cardinal Realism**
  *   **RANKING:** (Desire is structural, not quantitative.)
      *   → **LEAF 8: Folk Psychological Realism**

  ---

  ### THE POSITIONS (Do not read until finished)

  1.  **Radical Eliminativism:** "Utility" does not exist. There are only stimuli and responses. Stop using mental vocabulary.
  2.  **VNM Behaviorism:** Utility is a mathematical fiction derived from risk choices. It is cardinal, but only because we defined it that way to make the math work.
  3.  **Strict Revealed Preference:** Utility is ordinal and purely descriptive. It says nothing about the mind, only that choices are consistent.
  4.  **Classical Hedonic Realism:** Utility is a real sensation of pleasure. It is cardinal and comparable across people (the old Utilitarian view).
  5.  **Ordinal Hedonic Realism:** Utility is a real sensation of pleasure, but it cannot be measured or compared. (Note: This is a logically tense position).
  6.  **Preference Constructivism:** Preferences are not internal causes; they are formed on the fly during the choice process.
  7.  **Neuro-Cardinal Realism:** Preferences are real brain states with measurable intensity (e.g., firing rates). Utility is physical and cardinal.
  8.  **Folk Psychological Realism:** Preferences are real mental states (beliefs/desires) that cause choice, but they are only ordinally rankable, not quantitatively measurable.

  ***

  # INSTRUCTOR'S KEY: Logical Space & Diagnosis

  *For the session leader. Do not distribute.*

  ### 1. The Logical Space Map
  This tree is built on five binary distinctions. Theoretically, there are $2^5 = 32$ possible combinations of views. We have populated 8 leaves. Here is the diagnosis of the empty space and the structural quirks.

  **The Five Cuts:**
  1.  **Ontology:** Mental State vs. Behavioral Summary (Node 1).
  2.  **Vocabulary:** Retain "Preference" vs. Eliminate (Node A).
  3.  **Measurement:** Cardinal vs. Ordinal (Nodes C, D, F).
  4.  **Content:** Hedonic vs. Conative/Desire (Node B).
  5.  **Temporality:** Pre-existing vs. Constructed (Node E).

  ### 2. Diagnosis of Empty Slots (Why aren't they leaves?)

  *   **Cardinal Strict Revealed Preference (Without Risk):**
      *   *Slot:* Behavioral + Keep Word + Cardinal + (No Risk Assumption).
      *   *Diagnosis:* **Incoherent.** If preference is *only* observed choice, you cannot derive cardinal intensity without additional structural assumptions (like von Neumann-Morgenstern risk axioms). Pure choice data is inherently ordinal.
  *   **Hedonic Eliminativism:**
      *   *Slot:* Behavioral + Ban Word + Hedonic Content.
      *   *Diagnosis:* **Contradictory.** You cannot claim pleasure/pain is the content of preference while simultaneously claiming preference talk should be eliminated in favor of pure behavior, unless you also eliminate pleasure as a mental state.
  *   **Constructivist Behaviorism:**
      *   *Slot:* Behavioral + Preference Created by Choice.
      *   *Diagnosis:* **Unexplored/Redundant.** If preference is created by choice, it collapses into Strict Revealed Preference, but with a time-delay caveat. It doesn't add enough ontological weight to warrant a separate leaf in this specific tree.
  *   **Ordinal Hedonic Realism (Leaf 5):**
      *   *Diagnosis:* **Unattractive/Unstable.** This slot is populated, but it is philosophically precarious. If pleasure is a sensation (like heat), it seems naturally cardinal/measurable. Claiming it is real but *only* ordinal often looks like an attempt to save Hedonism from the impossibility of interpersonal comparison without giving up the "mental reality" claim.

  ### 3. Indistinguishable Leaves

  *   **Leaf 2 (VNM Behaviorism) vs. Leaf 3 (Strict Revealed Preference):**
      *   *Warning:* In practice, these often operate identically in standard microeconomics. The distinction is purely axiomatic (does risk choice reveal intensity?). Students may struggle to see the philosophical difference. Emphasize that Leaf 2 treats utility as a *number* derived from axioms, while Leaf 3 treats it as an *ordering* derived from observation.
  *   **Leaf 8 (Folk Psychological Realism) vs. Leaf 3 (Strict Revealed Preference):**
      *   *Warning:* These are **observationally equivalent**. Both agree preferences are ordinal and predict choice the same way. The *only* difference is the answer to Node 1 (Can you be wrong?).
      *   *Discussion Point:* If two theories predict the exact same choices, does the mentalist claim (Leaf 8) add any explanatory power, or is it just "spooky" metaphysics? This forces the debate on distinction (e).

  ### 4. The "Unheard Of" Positions
  *   **Leaf 5 (Ordinal Hedonic Realism):** Most students assume Hedonism implies Cardinality. This view (pleasure is real but unmeasurable) is rarely defended explicitly but often implicitly held by those who want mental realism without the baggage of interpersonal comparison.
  *   **Leaf 6 (Preference Constructivism):** This challenges the standard economic assumption that the choice function reveals a pre-existing ordering. It aligns with behavioral findings (framing effects) but is often treated as a "bias" rather than a fundamental ontology of preference.
  *   **Leaf 7 (Neuro-Cardinal Realism):** This is the emerging view in neuroeconomics. It bypasses the "utility is fictional" argument by grounding cardinality in physical neural intensity, reviving a form of Benthamism via fMRI.
