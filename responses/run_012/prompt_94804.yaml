      *   *Order from Nothing:* The work comes from the heat bath, organized by info.
      *   *Quantum:* Explicitly state this is classical thermodynamics + info theory. Quantum isn't needed for the resolution.
      *   *Unbounded Memory:* If the demon never resets, it doesn't violate the 2nd law *yet*, but it's not a perpetual motion machine, it's a battery. To be a cycle, it must reset.

  5.  **Drafting the Plan (Iterative refinement):**
      *   *Intro:* Hook them with the paradox.
      *   *Step 1 (Entropy):* Avoid "disorder." Use "counting states." Connect to their Bayesian priors (phase space volume = prior support).
      *   *Step 2 (Szilard):* Draw the box. One molecule. Partition.
      *   *Step 3 (The Cycle):* Walk through the 4 steps. Calculate work extracted ($W = k_B T \ln 2$).
      *   *Step 4 (The Trap):* Ask "Where did the entropy go?" They will say "Measurement." Correct them. Measurement is copying. Copying can be reversible (Fredkin gates, etc., though maybe too technical? Keep it conceptual: correlation).
      *   *Step 5 (The Bill):* To repeat the cycle, the demon must clear its memory. Compressing phase space of the memory device generates heat.
      *   *Step 6 (Synthesis):* Total entropy change $\ge 0$.

  6.  **Refining for the Audience (Rationalists):**
