      *   **Key Constraint 1:** Plan the session, don't just explain the topic.
      *   **Key Constraint 2:** Order of ideas matters (dependency structure).
      *   **Key Constraint 3:** Use the Szilard one-particle engine as the carrying example (not a gas).
      *   **Key Constraint 4:** Emphasize *erasure* (Landauer's Principle) over *measurement* cost. Avoid the "measurement costs energy" fudge.
      *   **Key Constraint 5:** Address specific misconceptions (subjective info, order from nothing, quantum uncertainty, unbounded memory).
      *   **Key Constraint 6:** Provide a specific "Check for Understanding" question.
