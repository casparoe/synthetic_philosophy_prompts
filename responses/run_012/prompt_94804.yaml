  2.  **Deconstruct the Physics & Pedagogy:**
      *   *The Core Conflict:* The Second Law says entropy increases. The Demon seems to decrease it without work.
      *   *The Resolution:* Information is physical. Acquiring info (measurement) can be reversible. Resetting info (erasure) is irreversible and costs $k_B T \ln 2$ per bit.
      *   *The Trap:* Many pop-sci and older textbooks say "measuring takes energy." This is technically incorrect in the context of the modern resolution (Bennett, 1982). Measurement *can* be done reversibly. The debt comes due when you want to reuse the demon (reset its memory).
      *   *The Audience:* Rationalists love Bayesian updating. They might think entropy is just "uncertainty" (subjective). I need to bridge subjective probability and objective phase space volume without getting bogged down in the philosophy of statistical mechanics too deeply, while acknowledging the link.
      *   *The Example:* Szilard Engine. One particle, box, partition, piston. Simple arithmetic ($W = k_B T \ln 2$).

  3.  **Brainstorming Dependency Structure:**
      *   To understand why erasure costs energy, you must understand that the demon's memory is a physical system with states.
      *   To understand that, you must understand that entropy is about the volume of accessible microstates (phase space), not just "disorder."
      *   To understand the threat to the 2nd Law, you must see how the demon extracts work from a single heat bath using information.
