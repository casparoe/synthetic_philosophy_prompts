      *   I am confident in the Bennett/Landauer resolution.
      *   I am confident in the Szilard engine mechanics.
      *   *Uncertainty:* The precise thermodynamic derivation of Landauer's Principle without invoking quantum mechanics or specific Hamiltonian dynamics might be the wobbliest bit to explain *simply* without hand-waving. Specifically, justifying *why* erasure *must* dissipate heat in a classical continuum without getting into the weeds of Liouville's theorem vs. coarse-graining. I need to be careful not to claim Liouville's theorem *forces* it without explaining phase space compression. Actually, the weakest point is often explaining *why* measurement can be reversible without getting into quantum nondemolition measurements. I'll stick to the classical logic gate argument (Toffoli/Fredkin) as an analogy.
