answer: |-
  It is completely understandable that this phrase has become a conversation-stopper in your seminar, because it is functioning as a philosophical placeholder rather than a precise argument. When someone says belief comes in degrees to dismiss the Lottery or Preface paradoxes, they are often sliding between several distinct claims without noticing the shift. To get clear on what is happening, we need to walk through the spectrum of interpretations available, starting from the harmless observations and moving toward the metaphysically heavy ones, evaluating each for its truth status and its effect on the paradoxes you are discussing.

  At the most trivial end of the spectrum, the claim is merely psychological or linguistic. On this reading, the slogan means that people experience varying levels of confidence or that ordinary language allows for hedging, such as saying I am pretty sure rather than I know. This is undoubtedly a platitude. It is empirically true that human confidence fluctuates and that our language reflects this. However, this reading does absolutely nothing to the Lottery or Preface paradoxes. These paradoxes are not about how confident people feel; they are about the norms of rationality and the logic of acceptance. Even if I acknowledge that I am only ninety-nine percent confident a ticket will lose, the paradox arises when I ask whether it is rational to accept or assert that it will lose. Acknowledging that confidence varies leaves the normative conflict exactly where it was, because the paradox emerges from the relationship between high probability and rational belief, not from the absence of confidence gradients.

  Moving slightly away from the trivial, we encounter a normative dualist reading. Here the claim is that there are two distinct kinds of doxastic states, binary belief and graded credence, and that rationality imposes norms on both. This is a defensible substantive thesis held by many epistemologists who argue that belief and credence serve different functional roles. Belief might be for reasoning and assertion, while credence is for decision theory. If this is what your seminar mates mean, they are not dissolving the paradoxes but merely complicating the landscape. On this view, the Lottery and Preface cases remain live problems because we still need an account of how these two states interact. If rational binary belief requires high credence, we are back to the original problem. If rational binary belief does not require high credence, we need a new explanation for what does govern it. Consequently, this reading leaves the paradoxes exactly where they were, perhaps making them slightly worse by adding the burden of explaining the relationship between the two states without resolving the tension between conjunction closure and high probability.

  The next step up in strength is the reductive or threshold view, which is likely the reading the slogan most naturally suggests to most philosophers. This is the Lockean Thesis, which identifies outright belief with credence above a certain context-sensitive threshold. On this view, to believe p is just to have a credence in p that exceeds some value less than one. This is a defensible substantive thesis, though it is controversial precisely because of the paradoxes you are studying. Your suspicion is correct that this reading does not dissolve the Lottery Paradox; in fact, it restates it. The Lottery Paradox is traditionally formulated as an argument against this very identification. If belief is just credence above a threshold, and it is rational to have high credence in each ticket losing, then it is rational to believe of each ticket that it loses. If rational belief is closed under conjunction, you are committed to believing all tickets will lose, which contradicts the belief that one will win. Therefore, this reading preserves the paradox intact. It turns the paradox from a puzzle about belief into a proof that either belief is not closed under conjunction or belief is not simply high credence. Regarding the Preface Paradox, this reading similarly fails to dissolve the tension; it merely translates the author's situation into a conflict between high credence in each claim and high credence in the falsity of the conjunction, leaving the rationality of the author's stance just as puzzling as before.

  At the radical end of the spectrum lies the eliminativist or primacy reading. This claim asserts that there is no such state as outright binary belief at all, or at least that it is not a legitimate category for epistemology. On this view, credence is the only real doxastic state, and talk of belief is merely a coarse-grained façon de parler useful for everyday communication but misleading in philosophical analysis. This is a radical substantive thesis, defended by some Bayesians but rejected by many others who argue that binary belief is necessary to explain reasoning and assertion. However, this is the only reading that actually dissolves the paradoxes. If there is no such state as outright belief, then there is no paradox about when it is rational to hold such a state. The Lottery case becomes a trivial observation about high credences that do not sum to one, and the Preface case becomes a consistent set of probabilistic assignments. The cost, of course, is that you have changed the subject. You have not solved the problem of belief; you have denied the existence of the thing that was problematic. For many, this is too high a price, as it leaves unexplained how we manage to reason with propositions we treat as true rather than probable.

  Given this menu, we can now diagnose what is likely happening in your seminar. Your hypothesis is almost certainly correct. The people repeating the slogan are likely aiming for the dissolving power of the radical eliminativist reading while only committing themselves to the reductive threshold reading. The threshold view is comfortable and intuitive; it feels like we are just making things precise by introducing numbers. But as we saw, the threshold view preserves the paradoxes rather than solving them. To get the dissolution effect—the sense that there is nothing left to explain—one needs the eliminativist claim that binary belief is illusory. Most epistemologists are not willing to defend full eliminativism in plain company because it seems to deny obvious features of human cognition and discourse. So, the slogan is being asked to do work that only the stronger claim could do, while relying on the weaker claim to avoid controversy. This creates a dialectical illusion where the paradox seems to vanish because the听众 hears the radical implication, but the speaker has only asserted the moderate thesis.

  Ultimately, the phrase belief comes in degrees is too ambiguous to carry the weight being placed on it. If it means only that we have credences, it is true but irrelevant to the norms of belief. If it means belief is just high credence, it is relevant but fails to solve the problem. If it means belief does not exist, it solves the problem but denies the phenomenon. In the context of the Lottery and Preface paradoxes, invoking degrees of belief without specifying the metaphysical relationship between those degrees and outright belief is essentially a gesture toward a solution rather than a solution itself. It signals that the speaker prefers a probabilistic framework, but it does not address the core logical tension that generates the paradoxes in the first place. Until your seminar mates specify whether they are dualists, reductionists, or eliminativists, the slogan will remain a conversation-stopper because it masks the very disagreement that needs to be had.
