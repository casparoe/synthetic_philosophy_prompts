      *   *Check:* Is Elena sounding too sentimental? *Fix:* Make sure Elena leans on the logic of agency and moral consistency, not just "love."
      *   *Check:* Technical terms. Use "temporal parts," "space-time worm," "numerical identity," "psychological continuity" but keep it conversational.
      *   *Check:* The Brother's point. Incorporate the brother's argument ("the person who wrote that isn't here") as the Perdurantist's opening gambit.

