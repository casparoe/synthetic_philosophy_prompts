          *   *Implication for AD:* It's the *same person*. The directive holds because *she* is still *her*, even if damaged. To ignore it is to disrespect her autonomy as a continuous agent.
      *   **Perdurantism (4Dism):** I am a space-time worm. The "me" at $t_1$ is a temporal part. The "me" at $t_2$ is a different temporal part. We are connected by psychological/physical continuity, but we are not numerically identical in a strict sense.
          *   *Implication for AD:* The "past self" is a different temporal part than the "present self." Why should the happiness of the current part be sacrificed for the preferences of a dead part? However, the *whole worm* has interests.

  3.  **Drafting - Setting the Scene:**
      *   Needs to be intimate but intellectual. A coffee shop or a quiet room? Let's go with a quiet room, maybe late night. Gives it weight.
