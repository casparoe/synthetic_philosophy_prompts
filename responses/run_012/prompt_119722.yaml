  I've never quite got Leibniz's ethics to sit together in my head. He defines justice as something like charity or love guided by wisdom, and he wants universal benevolence to be the heart of it. But he also thinks each monad is windowless, that pre-established harmony does all the work, and that my good is my own perfection and the pleasure I take in perceiving it. So explain how, on his view, loving another's perfection isn't just a roundabout way of loving my own — how the metaphysics is meant to make disinterested love of others more than disguised egoism — and say where you think the account is weakest. One paragraph, British English.
