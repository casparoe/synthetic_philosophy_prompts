      *   *The Tension:* If I only feel my own perceptions (windowless), and my good is my own pleasure/perfection, isn't loving you just loving how *I* feel when I think of you?
      *   *Leibniz's Solution:* Harmony. The universe is optimally ordered by God. My perfection is intrinsically linked to the perfection of the whole. To love God is to love the order of the universe. To love others is to align my will with the universal harmony. The pleasure taken in another's good is not merely instrumental (good for me) but constitutive of my own perfection because my perfection *is* mirroring the universal harmony accurately. Disinterested love arises because the wise person recognises that their true good *is* the common good, not because they sacrifice their good, but because they understand their good correctly.
