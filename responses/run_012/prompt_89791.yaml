prompt: |-
  I teach a 90-minute session of an interdisciplinary graduate seminar on decision theory (roughly 18 participants, a mix of philosophy and economics students, some of whom have seen the prisoner's dilemma and some of whom have not), and I want a runnable in-class game that makes them feel both the pull and the instability of superrational reasoning. The material I want to build on is the family of puzzles Douglas Hofstadter constructed in his Scientific American column of June 1983, later collected in Metamagical Themas: in the Platonia Dilemma, a fixed number of anonymous participants are each invited to claim a large prize, the prize is voided if two or more claim it, no contact between participants is permitted, and the winner may not share. Do not quote the column at me and do not supply a reading list; I will handle sources myself. I need only the mechanism and the conceptual structure, restated in your own words.

  Design the activity in two phases. Phase one should be a clean symmetric version of the dilemma: identical players, identical options, free entry, a fixed prize that is voided or evenly diluted once claims exceed a threshold, and payoffs displayed so that the collective optimum and the individual temptation are both visible. Phase two should introduce an asymmetry that the participants are not told about in advance — for instance, some players privately receive a cheaper or more valuable entry, or one participant secretly holds the role of prize administrator with a stake in the outcome. I want the group to discover that the maxim "everyone who reasons alike will settle on the same answer" delivers a crisp prescription in phase one and something much less determinate in phase two, where the players are no longer interchangeable and there is no settled way to say what reasoning alike even amounts to. The activity should make that gap felt, not merely announced.

  Give me: the rules and materials (including how entries are submitted anonymously and how information is released between rounds); a payoff scheme that uses points or a trivial non-monetary reward rather than real money, and that avoids collapsing into a pure free-rider problem; the number of rounds and a minute-by-minute timeline for the 90 minutes; the instructions I read aloud, which must not name superrationality, team reasoning, or any related term until the debrief; and a debrief that maps specific moments in the activity onto the underlying ideas, including the difference between the symmetric and asymmetric cases and the objection that the game only demonstrates that people enjoy winning things.

  Also tell me what will predictably go wrong the first time I run it, how to handle each failure, and which feature of the original dilemma the activity cannot reproduce — what I will have to supply by talking rather than by having them play.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute interdisciplinary graduate seminar (Philosophy + Economics), ~18 students. Mixed familiarity with Prisoner's Dilemma (PD).
      *   **Goal:** Create a runnable in-class game illustrating the pull and instability of *superrational reasoning* (Hofstadter's concept from the Platonia Dilemma).
      *   **Constraints:**
          *   Do not quote Hofstadter/Scientific American.
          *   Do not supply a reading list.
          *   Restate mechanism/conceptual structure in own words.
          *   Two Phases:
              *   Phase 1: Clean symmetric version (identical players/options, fixed prize, voided/diluted if threshold exceeded).
              *   Phase 2: Introduce hidden asymmetry (private costs/values or a secret role).
          *   Outcome: Students feel the gap between "reasoning alike" in symmetric vs. asymmetric cases.
          *   Deliverables: Rules/Materials, Payoff Scheme (points/trivial reward, avoid pure free-rider collapse), Rounds/Timeline (90 mins), Instructions (no jargon until debrief), Debrief (map moments to ideas, address "just like winning" objection).
          *   Troubleshooting: Predictable failures + fixes.
          *   Limitations: What the game *cannot* reproduce (must be supplied by lecture).

  2.  **Deconstruct the Core Concept (Superrationality/Platonia):**
      *   *Platonia Dilemma:* $N$ people. If exactly 1 claims, they win $X$. If 0 or >1 claim, everyone gets 0. No communication.
      *   *Standard Rationality (Causal):* If I think others won't claim, I should claim. If I think others will claim, I should claim (might as well try, 0 is 0). Dominant strategy is often to claim (or randomize with high probability). Result: High probability of collision -> 0 payoff.
      *   *Superrationality:* If we are all rational and identical, we will all arrive at the same strategy. Therefore, I must choose the strategy that, if *everyone* adopts it, maximizes expected utility. This usually implies randomizing with $p = 1/N$.
      *   *The Twist:* Superrationality relies heavily on symmetry (common knowledge of rationality, identical situations). Break the symmetry, and the "mirror" breaks.

  3.  **Designing the Game Mechanism:**
      *   *Phase 1 (Symmetric):* Needs to be close to Platonia but playable in class.
          *   $N=18$.
          *   Option: "Claim" or "Pass".
          *   Win Condition: Exactly $K$ claims. Let's make $K=1$ for pure Platonia, or maybe $K=3$ to allow some success and reduce total despair. Let's stick to $K=1$ for maximum tension, or perhaps a threshold where payoff dilutes. The prompt says "voided or evenly diluted once claims exceed a threshold." Let's use a threshold $T$. If Claims $\le T$, Prize $P$ is shared. If Claims $> T$, Prize = 0.
          *   Actually, Hofstadter's Platonia is specifically "Exactly one wins." Let's adapt that. If exactly 1 person submits a token, they get 100 points. If 0 or 2+, everyone gets 0.
          *   *Correction for Classroom Dynamics:* If everyone gets 0, students get bored/angry. Let's make it: If exactly 1 claims, they get 100, others get 10 (participation). If 0 claim, everyone gets 0. If 2+ claim, everyone gets 0.
          *   *Better Payoff:* To avoid "pure free-rider," there needs to be a cost to claiming or a benefit to passing *if* someone else claims.
          *   *Revised Payoff:*
              *   Total Pot: 100 points.
              *   If exactly 1 person claims: Claimer gets 80, Others get 20. (Incentivizes letting someone else win, but tempts claiming).
              *   If 0 claim: Everyone gets 0.
              *   If 2+ claim: Everyone gets 0.
              *   *Wait, this creates a Volunteer's Dilemma.* In Volunteer's Dilemma, if you know someone else will volunteer, you prefer to pass. In Platonia, if you know someone else will claim, you prefer to pass (to avoid voiding).
              *   Let's stick closer to Platonia: The prize is *only* for the claimer, but the group wants *someone* to win.
              *   *Classroom Version:* "The Singleton."
              *   Submit a slip saying "IN" or "OUT".
              *   If exactly one "IN": That person gets 100 pts. Everyone else gets 10 pts (consolation).
              *   If zero "IN": Everyone gets 0.
              *   If two+ "IN": Everyone gets 0.
              *   *Why this works:* It forces the superrational calculation. "If I go IN, I risk killing the pot. If I go OUT, I risk no one winning."
      *   *Phase 2 (Asymmetric):*
          *   Need to break symmetry without them knowing immediately.
          *   *Idea:* Give 3 students a "Priority Card." If they are the singleton winner, they get 150 pts. If a non-card holder is the singleton, they get 80 pts.
          *   *Problem:* If they know others have cards, symmetry breaks. They must *not* know who has them.
          *   *Better Idea:* Private Cost. Most students pay 5 points to enter "IN". 3 students pay 0 points to enter "IN".
          *   *Best Idea for "Reasoning Alike":* Role asymmetry. One student is the "Observer." They don't play but get points based on total claims. No, that's too complex.
          *   *Let's go with Private Value:* 4 students (randomly selected) receive a slip saying "Your win is worth double." The rest are normal. No one knows who has the double value.
          *   *Effect:* The "double value" holders have a higher incentive to claim. The "normal" holders should theoretically defer. But since they don't know who is who, can they reason superrationally? "If I am a double holder, I claim. If I am normal, I pass." But everyone thinks they might be the special one (if the distribution isn't known) or everyone knows 4 are special but doesn't know if *they* are.
          *   *Refinement:* Tell them: "Some of you have a Red Slip, some have a Blue Slip. Red Slips win 200 points if Singleton. Blue Slips win 100 points if Singleton. You know your color. You do not know the distribution of colors."
          *   *Actually, to make the "reasoning alike" break:* We need them to realize that "reasoning alike" requires identical utility functions.
          *   *Setup:* 18 Students. 3 are secretly "High Stakes" (Win 200). 15 are "Low Stakes" (Win 100). All know 3 are High, 15 are Low. All know their own type.
          *   *Rule:* Exactly one "IN" wins their respective stake. 2+ "IN" = 0 for all. 0 "IN" = 0 for all.
          *   *Tension:* High Stakes players feel more pressure to claim. Low Stakes players feel they should yield. But if all High Stakes reason "I am High, I must claim," they collide. If they reason superrationally, they must randomize differently than Low Stakes. The "focal point" of $1/N$ dissolves.

  4.  **Drafting the Timeline (90 Minutes):**
      *   0-10: Setup & Instructions Phase 1.
      *   10-25: Phase 1 Rounds (3 rounds to allow learning/coordination).
      *   25-35: Transition & Instructions Phase 2 (Hand out secret roles).
      *   35-50: Phase 2 Rounds (3 rounds).
      *   50-90: Debrief & Lecture connection. (40 mins is plenty for deep discussion).

  5.  **Drafting the Instructions:**
      *   Must be neutral. No "superrationality."
      *   Focus on "maximizing your points."
      *   Anonymity is key. Use sealed envelopes or a digital tool (but physical slips are more tangible for "no contact"). Let's use folded slips collected in a box.

  6.  **Addressing Predictable Failures:**
      *   *Failure 1:* Everyone claims (Collision). *Fix:* Highlight the loss in debrief.
      *   *Failure 2:* No one claims (Void). *Fix:* Highlight the loss.
      *   *Failure 3:* Students talk/coordinate. *Fix:* Strict silence rule.
      *   *Failure 4:* Phase 2 asymmetry is ignored. *Fix:* Ensure stakes are different enough.
      *   *Failure 5:* Cynicism ("It's just luck"). *Fix:* Debrief must focus on the *decision process*, not just the outcome.

  7.  **Addressing Limitations:**
      *   The game is one-shot (or few-shot). Hofstadter's argument relies on a specific conception of rationality that transcends causal impact. The game shows the *result* of coordination failure, but the *philosophical justification* for superrationality (that my decision logically determines yours) must be lectured.
      *   The "common knowledge of rationality" is hard to enforce in a classroom.

  8.  **Refining the Payoff:**
      *   Use "Course Participation Points" or just "Hypothetical Utility." Let's use Hypothetical Utility converted to a small tangible reward (e.g., chocolate or priority on a topic) to keep stakes low but real.
      *   Let's stick to points on a leaderboard. Winner gets a small prize at the end.
      *   *Payoff Structure:*
          *   Phase 1: Singleton = 100 pts. Others = 10 pts. Collision/None = 0.
          *   Phase 2: High Type Singleton = 150 pts. Low Type Singleton = 100 pts. Others = 10 pts. Collision/None = 0.
          *   This ensures passing isn't *pure* altruism (you get 10 pts if someone else wins), avoiding the pure public good collapse where passing is always dominant if you expect a win. You want *someone* to win, but you'd prefer it be you.

  9.  **Structuring the Debrief:**
      *   Map Phase 1 success/failure to the $1/N$ probability argument.
      *   Map Phase 2 confusion to the breakdown of symmetry.
      *   Address the "I just wanted to win" objection (causal vs. logical dependence).

  10. **Review against Constraints:**
      *   No quoting Hofstadter? Check.
      *   No reading list? Check.
      *   Two phases (Symmetric/Asymmetric)? Check.
      *   90 minutes? Check.
      *   Instructions clean? Check.
      *   Troubleshooting included? Check.

  11. **Final Polish:**
      *   Ensure the "Asymmetry" is handled subtly. If I tell them "3 of you are High," they know the group composition. If they know their own type, they know the remaining distribution. This creates a Bayesian game.
      *   Is this too complex for 90 mins? Maybe simplify Phase 2.
      *   *Simpler Phase 2:* One student is the "Judge." They get points if *no one* claims. Everyone else plays the standard game. The Judge is anonymous.
      *   *Critique:* That changes the game structure too much.
      *   *Stick to the Private Value Asymmetry:* It keeps the rules identical, only the utility function changes. This perfectly targets the "reasoning alike" requirement (which assumes identical utility).
      *   *Wait, one nuance:* If I tell them "3 are High, 15 are Low," and I am High, I know there are 2 other Highs. If I am Low, I know there are 3 Highs. This is solvable but creates distinct strategies. The "superrational" move is no longer "do what everyone else does" because everyone else *isn't* in the same situation. This is exactly the point.

  12. **Writing the Plan:** (Self-Correction during drafting)
      *   Make sure the anonymity method is robust. Folded paper in a box is best.
      *   Ensure the timeline allows for the *feeling* of the dilemma. Don't rush the rounds.
      *   Make the debrief questions specific.

  13. **Final check on "Superrationality" definition in this context:**
      *   It's the idea that rational agents facing the same problem will choose the same strategy.
      *   Phase 1: We are all the same. So we should all choose $p$. To maximize group utility, $p$ must be $1/N$.
      *   Phase 2: We are not all the same. So "choosing the same strategy" is ill-defined. Do Highs match Highs? Do Highs match Lows? The focal point vanishes.

  14. **Okay, ready to generate.**
answer: |-
  # Seminar Activity: The Singleton Protocol

  ## 1. Mechanism and Conceptual Structure
  This activity operationalizes the tension between causal decision theory (maximizing individual payoff given fixed expectations of others) and superrationality (maximizing payoff assuming your decision procedure is mirrored by similar agents).

  **Phase 1 (Symmetry):** All participants face identical payoff structures and information. The "superrational" solution suggests that if everyone is rational and identical, they must arrive at the same strategy. To maximize the probability of a payout, the group must coordinate on a mixed strategy where the expected number of claimants is exactly one (i.e., each person claims with probability $1/N$). Standard causal reasoning often leads to over-claiming (collision) or under-claiming (void), as individuals treat others' actions as fixed probabilities rather than logical correlates of their own.

  **Phase 2 (Asymmetry):** Hidden heterogeneity is introduced into the payoff structure. Participants are no longer interchangeable. The superrational maxim ("choose the strategy that, if adopted by all similar reasoners, yields the best result") becomes unstable because "similar reasoners" is no longer well-defined. High-stakes players and low-stakes players have different optimal probabilities. The activity forces students to feel the loss of the "focal point" that symmetry provided.

  ## 2. Rules and Materials

  **Materials:**
  *   18 small slips of paper (identical size/weight).
  *   18 larger envelopes (opaque).
  *   1 collection box.
  *   Whiteboard for tallying results.
  *   **Secret Role Slips:** For Phase 2, prepare 18 slips. 15 say "Type A," 3 say "Type B." Fold them identically.

  **Anonymity Protocol:**
  Participants write their decision ("IN" or "OUT") on the small slip, seal it in the envelope, and place it in the box. You (the instructor) collect and open them. This ensures no signaling via handwriting or timing.

  **Payoff Scheme (Points):**
  Use a hypothetical point system tracked on the board. To maintain engagement without financial conflict, announce that the top 3 point-scorers at the end of the seminar receive a trivial tangible reward (e.g., choice of seminar topic for next week, a bar of chocolate, or priority on office hours).

  *   **Phase 1 Payoffs:**
      *   **Exactly 1 "IN":** The claimant gets **100 points**. All "OUT" players get **10 points**.
      *   **0 "IN" or 2+ "IN":** Everyone gets **0 points**.
      *   *Rationale:* The 10-point consolation ensures passing is not purely altruistic; you want *someone* to win, but you prefer it be you. This prevents the game from collapsing into a pure public goods problem where "OUT" is dominant.

  *   **Phase 2 Payoffs:**
      *   **Type A (15 players):** If Singleton "IN", get **100 points**.
      *   **Type B (3 players):** If Singleton "IN", get **200 points**.
      *   **All "OUT" players:** Get **10 points** (regardless of type).
      *   **Collision/Void:** Everyone gets **0 points**.
      *   *Information:* Players know their own Type. They are told publicly that "Some of you have been assigned a different payout structure, but you do not know how many or who." (Actually, tell them: "There are two types. Most are Type A, a few are Type B. You know your type. You do not know the distribution.") *Correction for clarity:* To make the asymmetry felt but solvable, tell them: "There are 15 Type A and 3 Type B. You know your type. You do not know who else is what."

  ## 3. Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute materials. Read Phase 1 Instructions. Emphasize silence and anonymity. |
  | **10-25** | **Phase 1** | **Round 1:** Submit, tally, reveal results (number of claims only, not who).<br>**Round 2:** Submit, tally, reveal.<br>**Round 3:** Submit, tally, reveal. |
  | **25-35** | **Transition** | Collect Phase 1 materials. Distribute Secret Role Slips. Read Phase 2 Instructions. |
  | **35-50** | **Phase 2** | **Round 1:** Submit, tally, reveal.<br>**Round 2:** Submit, tally, reveal.<br>**Round 3:** Submit, tally, reveal. |
  | **50-90** | **Debrief** | Guided discussion mapping gameplay to decision theory concepts (see below). |

  ## 4. Instructions (Read Aloud)

  **Phase 1 Instructions:**
  "You are participating in a decision exercise. You will make three decisions in total. For each decision, you will place a slip in an envelope marked either 'IN' or 'OUT'. All envelopes go into the box.

  Here is how points are awarded:
  1. If exactly **one** person submits 'IN', that person receives 100 points. Everyone else receives 10 points.
  2. If **no one** submits 'IN', everyone receives 0 points.
  3. If **two or more** people submit 'IN', everyone receives 0 points.

  You cannot communicate. You do not know who is in the room beyond the people present. Your goal is to maximize your total points. You have 2 minutes to decide for Round 1."

  *(Repeat for Rounds 2 and 3, allowing 2 minutes each. After each round, announce only: "The result was [Win/Void/Collision]. Total claims: X.")*

  **Phase 2 Instructions:**
  "We are resetting the game. The rules of winning are the same: Exactly one 'IN' wins; otherwise, everyone gets 0. However, we are introducing private valuation.

  Inside the envelope you just received is a slip designating you as Type A or Type B.
  *   If you are **Type A** and you are the single 'IN', you win **100 points**.
  *   If you are **Type B** and you are the single 'IN', you win **200 points**.
  *   If you submit 'OUT' and someone else wins the singleton, you get **10 points**.
  *   If there is a collision or no claims, everyone gets **0 points**.

  You know your type. You do not know the types of others. You do not know the distribution of types. Maximize your points. 2 minutes for Round 1."

  *(Note: In the debrief, you will reveal you lied about the distribution not being known if you told them that, or clarify the common knowledge. For the strongest effect, tell them: "There are 15 Type A and 3 Type B." This makes the asymmetry common knowledge, but the identity private.)*

  **Revised Phase 2 Instruction for Maximum Effect:**
  "There are 15 Type A and 3 Type B in this room. You know your type. You do not know who holds the other types. The payout for a singleton win is 100 for Type A, 200 for Type B. Consolation for 'OUT' is 10 points. Collision/Void is 0 for all."

  ## 5. Debrief Guide (40 Minutes)

  **Step 1: The Data (5 mins)**
  Write the results on the board.
  *   Phase 1: How many collisions? How many voids? Did anyone converge on a stable rate of claiming?
  *   Phase 2: Did the collision rate go up? Did Type B players claim more often? (Ask for a show of hands anonymously if possible, or ask "Did Type B players feel more pressure?")

  **Step 2: Phase 1 - The Pull of Symmetry (10 mins)**
  *   *Question:* "In Phase 1, you were identical. If you assume everyone in this room reasons exactly like you, what is the rational move?"
  *   *Concept:* Elicit the $1/N$ argument. If everyone claims with probability $p$, the expected number of claims is $N \times p$. To maximize the chance of exactly one claim, $N \times p$ should equal 1. So $p = 1/18$.
  *   *Concept:* "Did anyone try to calculate that? Did anyone feel that if you chose 'IN', you were effectively choosing for everyone else to choose 'IN'?"
  *   *Point:* This is the core of superrationality. The reasoning is: "I cannot causally affect their choice, but my reasoning process is identical to theirs. Therefore, my decision predicts theirs."

  **Step 3: Phase 2 - The Breakdown (10 mins)**
  *   *Question:* "In Phase 2, did the instruction 'reason like everyone else' become harder to follow?"
  *   *Concept:* Type B players have a dominant incentive to claim more aggressively than Type A. If Type B players reason "I am special, I should claim," and there are 3 of them, they will likely collide.
  *   *Concept:* If Type A players reason "I am standard, I should yield," the pot might go void.
  *   *Point:* Superrationality relies on **interchangeability**. Once utility functions diverge, the "mirror" cracks. There is no longer a single strategy $S$ that "everyone" can adopt. Who is "everyone"? The group? The Type subset? The lack of a focal point leads to instability.

  **Step 4: Addressing the "Winning" Objection (10 mins)**
  *   *Objection:* "This just shows people like winning points. It's not about rationality."
  *   *Response:* "If this were purely about wanting to win, Phase 1 should have resulted in 18 claims every time (dominant strategy in causal theory if you value 100 > 0). The fact that people hesitated, or tried to coordinate on a low number of claims, shows they were modeling the *group's* behavior, not just their own desire. The instability in Phase 2 wasn't about desire (everyone still wanted points); it was about the loss of a shared logical anchor."

  **Step 5: Connecting to Theory (5 mins)**
  *   Summarize: Causal Decision Theory treats others' moves as independent probabilities. Superrationality treats others' moves as logical outputs of the same function you are running.
  *   The game demonstrates that Superrationality is fragile. It works beautifully in symmetric, common-knowledge environments (Phase 1 ideal). It fractures when the "common knowledge of identical situation" is broken (Phase 2).

  ## 6. Predictable Failures and Fixes

  **Failure 1: Total Collision (Everyone claims "IN" in Round 1).**
  *   *Why:* Students treat it as a lottery where a ticket costs nothing.
  *   *Fix:* Do not stop the game. Use it. In the debrief, highlight: "This is the Causal Equilibrium. If you think your action doesn't influence theirs, you claim. The result is 0 for everyone. This is the problem superrationality tries to solve."

  **Failure 2: Total Void (Everyone claims "OUT").**
  *   *Why:* Risk aversion. "I don't want to be the cause of the collision."
  *   *Fix:* Highlight the coordination cost. "Even if you reason alike, if you all reason 'I should be safe', you all lose."

  **Failure 3: Breach of Silence/Anonymity.**
  *   *Why:* Students try to solve the coordination problem by talking.
  *   *Fix:* Pre-empt this. "If you coordinate verbally, you have turned this into a cooperative bargaining game. The philosophical puzzle only exists if you are isolated. Please respect the isolation." If it happens, discard that round and repeat.

  **Failure 4: Phase 2 Asymmetry Ignored.**
  *   *Why:* The point difference (100 vs 200) isn't salient enough.
  *   *Fix:* Make the difference larger (100 vs 500) or announce it dramatically. Ensure Type B players know their status *before* the round starts.

  **Failure 5: Cynicism ("It's just random").**
  *   *Why:* Students feel they have no control over the outcome.
  *   *Fix:* In the debrief, ask: "Did you choose your probability, or did you just guess?" Push them to acknowledge they were running a mental simulation of the room. That simulation *is* the subject of the seminar.

  ## 7. Limitations: What the Game Cannot Reproduce

  You must supply the following via lecture, as the game mechanics cannot demonstrate them:

  1.  **Logical vs. Causal Dependence:** The game shows *correlation* (we all thought the same thing). It does not prove *logical dependence* (my decision *determines* yours). You must explain that superrationality is a normative claim about how rational agents *should* view their agency, not an empirical claim that they are physically linked.
  2.  **Common Knowledge of Rationality:** The game assumes everyone is trying to maximize points. In reality, some students may be spiteful, bored, or altruistic. The superrational solution collapses if I cannot assume you are a payoff-maximizer. You must explain that Hofstadter's dilemma assumes "Common Knowledge of Rationality" as a premise, which is rarely true in a classroom.
  3.  **The "One-Shot" Nature:** Superrationality is often defended in iterated contexts or high-stakes philosophical thought experiments. In a 3-round classroom game, learning effects (iterative elimination) mix with superrational reasoning. You must distinguish between "I learned not to claim because I saw collisions" (learning) vs. "I didn't claim because I realized we would all claim" (superrationality).
  4.  **The Definition of "Similar":** In Phase 2, the game shows symmetry breaking. It does not tell you *how* to define similarity. Is a Type A player similar to a Type B player? The game leaves this undefined intentionally; you must explain that this ambiguity is the central philosophical weakness of superrationality.
