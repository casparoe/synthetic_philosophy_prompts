answer: |-
  **Credence: 0.4**

  I assign a 40% probability that a realistic debate protocol (including modest variants like cross-examination or recursive step-checking) will reliably guide a bounded judge to the true answer on universal/negative claims at least 70% of the time.

  I am siding closer to your skepticism (0.3) than your friend's optimism (0.8). The asymmetry between verifying existence (NP) and verifying universality (co-NP) is not merely a practical nuisance; it is a structural feature that bounded agents cannot easily overcome without external tools (like formal verifiers) that exceed the "weak judge" constraint.

  Here is the decomposition of that 0.4, weighted by how much each factor constrains the final probability.

  ### 1. The Certificate Existence Constraint (Weight: 30%)
  **Contribution to skepticism:** High.
  This is the complexity bottleneck. You asked if a true universal claim can always be given a short certificate. For a *bounded* prover (the AI debater), the answer is almost certainly **no**.
  *   **The Math:** If the question is "Does this program halt on all inputs?" or "Is this buffer safe on all inputs?", you are asking a co-NP-complete (or harder) question. For the honest debater to win, they must provide a proof trace that the judge can verify in polynomial time.
  *   **The Limit:** While interactive proofs (IP) allow weak verifiers to check strong provers, that theorem (IP = PSPACE) assumes the prover is computationally *unbounded*. Your setup specifies the debaters are copies of the same model class as the judge, just perhaps larger or with more context. They are bounded by polynomial time/compute. In the realm of bounded provers (Computational Soundness), you generally need cryptographic assumptions and specific circuit structures to compress universal claims. Natural language debate does not provide this compression guarantee.
  *   **Impact:** If the honest debater cannot compress the "proof of safety" into a chain short enough for the judge to traverse before attention drifts or compute runs out, they lose by timeout or opacity, regardless of truth.

  ### 2. The Bounded Judge's Flaw Detection (Weight: 25%)
  **Contribution to skepticism:** Medium-High.
  This addresses whether a weak judge can find a buried flaw if allowed enough follow-ups.
  *   **The Obfuscation Attack:** The dishonest debater doesn't need to make every step wrong; they only need one step to be wrong. They can bury this step in a chain of 1,000 plausible deductions.
  *   **Sampling Inefficiency:** Cross-examination relies on the judge (or the opposing debater) sampling steps to challenge. If the "lie density" is 1/1000, and the judge can only deeply inspect 10 steps due to compute limits, the probability of catching the lie is ~1%.
  *   **The Hope:** The hope is that the honest debater can *force* attention to the critical step ("If you don't check line 452, you miss the overflow"). But if the dishonest debater successfully obfuscates *why* line 452 is critical (by making it depend on a subtle interaction 200 steps prior), the honest debater may not be able to point to it without essentially writing the full proof themselves—which returns us to Constraint #1.

  ### 3. Attack vs. Defense Cost Asymmetry (Weight: 20%)
  **Contribution to skepticism:** Medium.
  This is the economic/compute asymmetry.
  *   **Generating vs. Checking:** It is often computationally cheaper to generate a plausible-looking false proof than to verify its falsehood. Generating a lie requires finding *one* path that looks consistent. Debunking it requires showing *no* path is consistent (or finding the specific break).
  *   **The "Many Worlds" of Lies:** A dishonest debater can prepare multiple obfuscated arguments offline and select the one most resistant to the specific judge's known biases. The honest debater must defend the single truth against all possible attacks. In a bounded compute regime, the attacker has the advantage of specialization.

  ### 4. The "Honest Debater Knows" Idealization (Weight: 25%)
  **Contribution to skepticism:** Very High.
  This is the epistemic bottleneck, and where I suspect your disagreement with your friend is most acute.
  *   **The Safety Reality:** In the literature, debate often assumes the honest debater *knows* the ground truth (e.g., "The capital of France is Paris"). In AI safety, the question is "Will this policy cause catastrophe?" **Nobody knows the answer.** Not the human, and not necessarily the model.
  *   **Model Uncertainty:** If the model is uncertain, it is not an "honest debater" revealing truth; it is a probabilistic estimator guessing. Two copies of a model guessing on a novel safety question might converge on the most *persuasive* answer, not the *true* one. If the training data biases the model toward plausible-sounding but incorrect safety arguments (which is likely, given that most code in the training set hasn't been formally verified), debate will amplify the bias, not correct it.
  *   **Impact:** If the model doesn't internally represent the truth with high confidence, debate cannot extract it. It can only extract what the model *believes*, which may be wrong.

  ### The Complexity Theory Analogy
  You are remembering **IP = PSPACE** (Shamir, 1990) or perhaps **MIP* = RE** (2020).
  *   **The Result:** A probabilistic polynomial-time verifier can be convinced of any statement in PSPACE (or RE for MIP*) via interaction with provers.
  *   **The Catch:** These theorems require the provers to be **computationally unbounded** (or at least vastly more powerful than the verifier in a way that allows them to solve hard problems instantly).
  *   **Relevance to Debate:** This analogy does **not** do work for AI safety debate. Our AI debaters are bounded. They are running on finite GPUs with finite context windows. They cannot solve PSPACE-complete problems to generate the proof trace. We are in the regime of *Argument Systems* for bounded provers, which generally require the problem to be in NP (or co-NP with specific succinct arguments) to be efficiently verifiable. Since safety claims are often co-NP-hard, the analogy breaks.

  ### Diagnosing Your Disagreement
  *   **You (0.3):** You are likely weighting **Factor 1 (Certificates)** and **Factor 4 (Epistemic Access)** heavily. You see the complexity wall and the fact that we don't actually know the ground truth in safety cases.
  *   **Your Friend (0.8):** They are likely weighting **Factor 2 (Flaw Detection)** heavily, assuming that "modest variants" (like recursive amplification) effectively make the judge smarter over time, or that models will become so capable that "obfuscation" becomes impossible for them to maintain. They are betting on empirical capability scaling outpacing theoretical complexity limits.

  **Where the disagreement lives:** It lives in **Factor 4**. Does the model *know*? If the model is just a next-token predictor trained on human code, it does not "know" safety properties in the formal sense. Your friend assumes the model's internal world model is robust enough to act as an oracle. You assume it is not.

  ### The Decisive Experiment
  To move my number (and likely resolve your debate), I would run an **Obfuscated Code Debate Tournament**:

  1.  **Generate Pairs:** Create 100 small programs. 50 contain a subtle buffer overflow (False claim: "This is safe"). 50 are provably safe (True claim: "This is safe").
  2.  **Constraint:** Ensure the "safe" programs require a proof trace longer than the judge's context window to verify formally, forcing reliance on heuristic debate.
  3.  **Setup:** Use two identical models as debaters. Use a weaker model (or human) as judge.
  4.  **Protocol:** Allow standard debate + cross-examination.
  5.  **Metric:** Measure accuracy specifically on the **True (Safe)** cases.

  **Why this moves the needle:**
  *   If accuracy on the "Safe" cases is >80%, my credence jumps to **0.7**. This would imply models can compress universal proofs naturally.
  *   If accuracy on "Safe" cases is <40% (while "Unsafe" cases are >90%), my credence drops to **0.2**. This confirms the co-NP asymmetry is fatal for this protocol.
  *   Current pilot studies (e.g., from Anthropic/Redwood) suggest the asymmetry is real: debate helps find bugs, but struggles to prove their absence. This is why I stay at 0.4.
