answer: |-
  Here is a new paradox built to your specifications. It avoids the Chord, the Cube, and the Wine. It relies on a physical object, a clear bet, and three distinct, sensible ways to define "random."

  ### The Paradox of the Leaning Ladder

  **The Setup**
  Imagine a rigid ladder of length $L=1$ meter. It is leaned against a vertical wall on a horizontal floor. The wall and floor meet at a perfect 90-degree corner. The ladder is in a static position (we are ignoring slipping dynamics; we are just looking at a snapshot of a ladder placed in a corner).

  **The Question**
  You place a bet: **"Is the top of the ladder higher than 0.5 meters from the floor?"**

  You agree to place the ladder "at random" in the corner. What is the probability you win the bet?

  **The Constraint**
  The ladder must touch both the wall and the floor. Its position is fully determined by any one of three variables:
  1.  The distance of the **foot** from the corner ($x$).
  2.  The **angle** the ladder makes with the floor ($\theta$).
  3.  The height of the **top** on the wall ($y$).

  These are linked by geometry: $x^2 + y^2 = 1$ and $y = \sin(\theta)$, $x = \cos(\theta)$. The range for all three is $[0, 1]$ for distances and $[0, \pi/2]$ for the angle.

  Here are the three sensible readings of "at random."

  ---

  ### Reading 1: The Contractor's Method (Uniform Foot)
  **Assumption:** You mark the floor from 0 to 1 meter. You close your eyes and pick a spot for the ladder's foot. Every position on the floor is equally likely.
  **Variable:** $x \sim \text{Uniform}(0, 1)$.

  **Derivation:**
  You win if the height $y > 0.5$.
  Since $x^2 + y^2 = 1$, the condition $y > 0.5$ implies:
  $$ \sqrt{1 - x^2} > 0.5 $$
  $$ 1 - x^2 > 0.25 $$
  $$ x^2 < 0.75 $$
  $$ x < \sqrt{0.75} = \frac{\sqrt{3}}{2} $$
  Since $x$ is uniform on $[0, 1]$, the probability is simply the length of the winning interval:
  $$ P(\text{Win}) = \frac{\sqrt{3}}{2} \approx \mathbf{0.866} $$

  **Why it's sensible:** If you are setting up a ladder, you usually position your feet first. There is no reason to favor one spot on the floor over another.

  ---

  ### Reading 2: The Surveyor's Method (Uniform Angle)
  **Assumption:** You stand at the corner with a protractor. You pick an angle between 0° (flat on floor) and 90° (flat on wall). Every angle is equally likely.
  **Variable:** $\theta \sim \text{Uniform}(0, \pi/2)$.

  **Derivation:**
  You win if height $y > 0.5$.
  Since $y = \sin(\theta)$, the condition is:
  $$ \sin(\theta) > 0.5 $$
  In the range $[0, \pi/2]$, $\sin(\theta) = 0.5$ at $\theta = \pi/6$ (30°).
  So you win if $\theta \in (\pi/6, \pi/2]$.
  The length of the winning interval is $\pi/2 - \pi/6 = \pi/3$.
  The total interval length is $\pi/2$.
  $$ P(\text{Win}) = \frac{\pi/3}{\pi/2} = \frac{2}{3} \approx \mathbf{0.667} $$

  **Why it's sensible:** If you use an inclinometer or a digital level to set the ladder, the natural "uniform" setting is the angle. Rotational symmetry suggests no angle is preferred.

  ---

  ### Reading 3: The Painter's Method (Uniform Height)
  **Assumption:** You mark the wall from 0 to 1 meter. You pick a target height for the top of the ladder. Every height is equally likely.
  **Variable:** $y \sim \text{Uniform}(0, 1)$.

  **Derivation:**
  You win if height $y > 0.5$.
  Since $y$ is uniform on $[0, 1]$, this is trivial:
  $$ P(\text{Win}) = \frac{1 - 0.5}{1 - 0} = \mathbf{0.5} $$

  **Why it's sensible:** If your goal is to reach a specific spot on the wall (like a paint can on a shelf), you think in terms of vertical reach. You have no reason to favor one height over another.

  ---

  ### Analysis: What is doing the work?

  You suspected the issue was about symmetries. You are half-right, but the deeper culprit is the **curvature of the constraint**.

  In the "Cube in a Box" paradox, the ambiguity comes from scaling dimensions (length vs. area vs. volume). In the Ladder Paradox, the ambiguity comes from the **non-linear mapping** between the parameters.

  The ladder is constrained to lie on a circle quadrant ($x^2 + y^2 = 1$).
  *   In Reading 1, you spread probability mass evenly along the **x-axis**. Because of the circle's curve, this bunches up the probability mass near the top of the wall (small changes in $x$ near 0 create huge changes in $y$).
  *   In Reading 3, you spread probability mass evenly along the **y-axis**. This bunches up the probability mass near the foot of the wall.
  *   In Reading 2, you spread probability mass evenly along the **arc**.

  The disagreement exists because "Uniform" is not an invariant property under non-linear transformation. If $x$ is uniform, $\arccos(x)$ is *not* uniform. A sensible person can hold any of these views because "random" describes the **process of selection**, not the **object selected**. Without specifying the mechanism (tape measure on floor vs. protractor vs. tape measure on wall), the word "random" has no single mathematical referent.

  ### Adding Symmetry: Does it collapse?

  You asked what happens if we add the symmetry that *would* pin things down.

  In the Bertrand Chord problem, E.T. Jaynes argued that the solution should be invariant under the symmetries of the circle itself (rotation, scaling, translation). Here, we have a corner. The physical setup consists of a Wall and a Floor meeting at 90°.

  **The Symmetry Move:**
  Assert that the Wall and the Floor are **physically indistinguishable**. Imagine the ladder is in a smooth trough where "up" and "sideways" are arbitrary labels. If we swap the labels "Wall" and "Floor" (swapping $x$ and $y$), the probability of the bet should not change.

  *   **Check Reading 1 (Uniform Foot):** If we swap Wall/Floor, we are now choosing a Uniform Height. Reading 1 becomes Reading 3. Since Reading 1 gives 0.866 and Reading 3 gives 0.5, this method **violates** the symmetry. It privileges the floor.
  *   **Check Reading 3 (Uniform Height):** Similarly, this privileges the wall. It **violates** the symmetry.
  *   **Check Reading 2 (Uniform Angle):** If $\theta$ is the angle with the floor, the angle with the wall is $\phi = \pi/2 - \theta$. If $\theta$ is Uniform$(0, \pi/2)$, then $\phi$ is *also* Uniform$(0, \pi/2)$. This distribution is **invariant** under swapping the axes.

  **Result:** If you demand the physical setup treats the wall and floor identically, the paradox collapses. Readings 1 and 3 are eliminated as biased. **Reading 2 (2/3) is the unique solution.**

  ### Steelmanning the Indifference Defense

  **The Argument:**
  A defender of the Principle of Indifference might say: *"Space is fundamentally homogeneous. Positions ($x, y$) are more primitive than angles ($\theta$). Angles are derived from positions. Therefore, a uniform distribution over position is the only true expression of ignorance. The 0.5 or 0.866 answers are correct; the angle answer imposes a geometric structure (polar coordinates) that isn't inherent to space itself."*

  **The Best Reply:**
  *"Space is not just homogeneous; it is isotropic. There is no preferred direction. By choosing Uniform $x$, you are implicitly asserting that the 'x-direction' is the fundamental axis of the universe. But in a corner, there is no fundamental axis. The only coordinate-independent feature of the ladder's state is its orientation relative to the constraint. If you claim 'position is fundamental,' you must specify which position. If you cannot specify which position without breaking the symmetry of the corner, you cannot claim Indifference justifies Uniform $x$."*

  ### Summary for the Blog

  1.  **The Object:** A ladder in a corner.
  2.  **The Bet:** Top of ladder > 50% height.
  3.  **The Three Numbers:**
      *   Uniform Foot: $\frac{\sqrt{3}}{2}$ (~86.6%)
      *   Uniform Angle: $\frac{2}{3}$ (~66.7%)
      *   Uniform Height: $\frac{1}{2}$ (50%)
  4.  **The Lesson:** "At random" is not a property of the *state*; it is a property of the *history*. Unless you specify how the ladder got there (the physical mechanism), the probability is undefined.
  5.  **The Resolution:** If you impose symmetry between the wall and floor, only the Angle method survives.

  Your brother was right about Bertrand, but he missed the broader point: this isn't about circles. It's about the fact that nature doesn't speak "Uniform Distribution" until you build a machine that generates one. Tell him the ladder says hi.
