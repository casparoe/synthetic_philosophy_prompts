prompt: |-
  Ok, I need help with something weirdly specific and I'm not sure it's even doable.

  Background: a couple weeks ago me and my brother got into a stupid argument that started over who was buying lunch and ended with him saying "well what does *at random* even mean" and then pulling out the circle-and-chord thing (Bertrand's, I think?) where you get 1/2, 1/3, or 1/4 depending on how you set it up. He was right, I was furious, and now I can't let it go. I want to actually understand the shape of the thing and not just that one example, and honestly I want an example he hasn't already seen so he can't just nod along.

  So: build me a new Bertrand-style paradox. Same species as the chord one, but not the chord one — and not the cube-in-a-box one and not the water-and-wine one either, and not any of those three wearing a fake mustache (different nouns, same math). I want a case where "pick one at random" has at least three readings that give three different numbers, and where all three readings are ones a sensible person could genuinely hold. No two straw men and one obvious answer.

  Constraints on the case:

  - Something a normal person can picture — an object, a physical procedure, a bet someone could actually make. Not an abstract measure-theoretic construction.
  - The randomness has to come from something physically realizable: a toss, a drop, a throw, a spin. Not "let X be a uniformly random real."
  - Exactly one thing varies between the three readings — which quantity gets treated as the uniform one. Everything else, including the question being asked, stays fixed.
  - Simple numbers, with the derivation shown for each.

  Then, for the case you build:

  - Tell me which feature of the setup is doing the work in generating the disagreement. My hunch is it's about which transformations leave the case looking identical, and that the circle is a bad place to see this because the circle's own symmetries are too small to settle anything — but I don't trust myself, so check me.
  - Show me what happens if I add the symmetry that *would* pin things down. Does the paradox collapse to a single answer, and which one?
  - Steelman the guy who insists indifference still gives you a unique answer here. What's his best move, and what's the best reply?
  - Please don't just tell me "it's ill-posed, move on." I know that's the standard line and it's definately true as far as it goes, but I want to see the three numbers and why the disagreement has the shape it does.

  It's for a blog post, so it needs to actually work as a demonstration — the three numbers should fall out of the three readings, not be asserted up front. And no citations or reading lists, I'm not going to go track down a paper.
