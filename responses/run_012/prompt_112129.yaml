answer: |-
  1. **The Crew.** In the *Odyssey*, Odysseus does not tie himself; the sailors bind him, and they are under instruction to ignore his later pleas. In your model, who plays the sailors, and is this really self-binding?
     *Follow-up:* If judges or framers are the sailors, does this not transform democratic self-binding into elitist other-binding?

  2. **What Precommitment Is Against.** Circe warned Odysseus specifically about the Sirens; he knew exactly what temptation looked like. Constitutions are framed in ignorance of the future circumstances they will govern.
     *Follow-up:* If the later majority is better informed than the framers, does the precommitment lose its normative force?

  3. **Reversibility.** The ropes on the mast cannot be untied by the man they hold, whereas a constitutional commitment can be undone by supermajority amendment. Is this a genuine binding or only a tax on change?
     *Follow-up:* If merely a tax, does the analogy not break down where the constraint matters most?

  4. **Conditions of Commitment.** A precommitment is only as good as the self that makes it; Odysseus was sober. How do we distinguish a sober founding from one made while asleep or coerced?
     *Follow-up:* If excluded groups were silenced at the founding, is the binding still legitimate?

  5. **Who the Binding Self Is.** The framers, the ratifying generation, and the present majority are not the same agent. Which entity is the "self" that binds?
     *Follow-up:* If you say the people, how do you define their boundaries across time without circularity?

  6. **Bootstrapping.** A precommitment binds the later self only if the later self already grants the earlier self the authority to bind it. What performs that granting?
     *Follow-up:* If the granting is the binding, is the precommitment not circular?

  7. **The Continuing Agent.** You argue the people are a continuing agent rather than successive generations. What makes the earlier act authoritative for the later one?
     *Follow-up:* Does this not privilege the dead hand of the past over the living will of the present?

  8. **Elster's Concession.** Elster conceded in his later work that constitutions are frequently devices for binding others rather than their authors. Does this demote the Ulysses story from a description of constitutionalism to a decoration on it?
     *Follow-up:* If it is decoration, why rely on it for normative justification?

  9. **Coordination vs. Precommitment.** A constitution may be less a self-lashing than a focal point that lets many agents settle on one of several equilibria. What evidence shows precommitment is the better diagnosis?
     *Follow-up:* If coordination explains the data, is weakness of will not redundant?

  10. **Disagreement.** When pressed that later majorities disagree with the entrenched settlement, you say disagreement is precisely what precommitment is for. When does disagreement indicate error in the original commitment rather than weakness in the current one?
      *Follow-up:* Who holds the authority to make that distinction?

  11. **The Sailors' Power.** The sailors must ignore Odysseus's pleas. If judges ignore legislative majorities to enforce the precommitment, who checks the judges?
      *Follow-up:* If no one checks them, is the model not aristocratic rather than democratic?

  12. **Refutation.** What empirical or logical evidence would count as refutation of the Ulysses model rather than mere imperfection?
      *Follow-up:* If such evidence were found, would you abandon the model?

  \answer{The Bootstrapping Circularity Question}
