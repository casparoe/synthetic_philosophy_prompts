answer: |-
  **Examination Paper: Philosophical Logic and Epistemology**
  **Section B: Essay Question**
  **Time Allowed: 45 minutes**
  **Marks: 20**

  **Question 1**
  The problem of logical omniscience presents a fork for the theorist of knowledge and belief. Either:

  (a) Keep the content of the attitude truth-apt but finer-grained than a set of possible worlds, so that logically equivalent contents can come apart. The price is a semantics in which the agent can be represented as believing a contradiction, and in which logical consequence no longer constrains what she believes.

  (b) Keep the content coarse-grained and locate the limitation in the agent's state — a set of representations together with some awareness, attention, or computational component — so that closure holds only relative to what she is aware of. The price is that a failure to see a consequence becomes a fact about her representational resources rather than a fault in her, and an epistemic question has been traded for a question in the theory of computation.

  Choose one horn and defend it. In doing so, you must: (i) distinguish between knowing all logical truths and having knowledge closed under entailment, showing how a repair might affect one without the other; (ii) explain what an adequate account must preserve regarding the truth-aptness of content and the normativity of logic; (iii) argue why the problem ultimately demands an account of inference as an agentive activity. You should also address the hazard that an awareness clause bolted onto an unreduced closure principle collapses back into omniscience.

  ***

  **Model Answer**

  The standard possible-worlds framework implies that agents know all logical truths and their knowledge is closed under entailment. This is psychologically unrealistic. To resolve this, I defend horn (b), locating the limitation in the agent's state rather than fracturing the content of belief. While horn (a) preserves truth-aptness by hyperintensionality, it sacrifices the normative constraint of logic, allowing agents to believe contradictions without error. Horn (b) retains classical content but limits access, preserving the idea that logic governs belief, even if bounded by capacity.

  It is crucial to distinguish between knowing all logical truths and having knowledge closed under entailment. These are distinct properties often run together. An agent might know every tautology yet fail to believe a consequence of her beliefs because she has not performed the inference. Conversely, an agent might have closure relative to her current beliefs but fail to know a specific logical truth because it lies outside her conceptual repertoire. A repair might remove omniscience regarding truths by limiting the set of accessible worlds, yet leave closure intact within that set. Alternatively, one might retain all truths but deny closure by fragmenting the belief state. An adequate solution must recognise that failing to know a tautology is ignorance, whereas failing to draw a consequence is often a performance failure. Horn (b) captures this by treating closure as relative to awareness; the agent knows the truths she grasps, but closure only applies to what she actively considers.

  An adequate account must preserve two features: the truth-aptness of content and the normativity of logic. Content must be truth-apt because belief aims at truth; if contents are not truth-evaluable, belief loses its distinctive character. Horn (a) risks making content non-truth-apt by introducing impossible worlds where contradictions hold. Horn (b) preserves truth-aptness by keeping content classical. Furthermore, logic is normative; failing to draw a consequence one has accepted is a defect in the agent. Horn (a) removes this defect by changing the logic itself. Horn (b) retains the defect but explains it as a limitation of resources. However, this risks trading an epistemic question for a computational one. If failure is merely a resource shortage, it ceases to be a rational fault. To avoid this, we must insist that the limitation is not merely causal but rational; the agent *ought* to infer, even if she cannot.

  This leads to the requirement for an account of inference as an agentive activity. The problem of omniscience arises because we model belief as a static state rather than a dynamic achievement. Neither horn fully supplies this, but horn (b) points towards it by invoking awareness. Inference is something an agent *does*, not merely a relation between propositions. If inference is an act, then closure is not a property of the belief state but a goal of the agent's activity. This preserves normativity: the agent is criticised not for lacking a state, but for failing to perform the act.

  Finally, we must address the hazard facing horn (b). If the awareness clause is treated propositionally—for example, if the agent must believe she is aware of a proposition for closure to apply—the closure principle applies to that belief as well. This generates a regress or collapses back into omniscience, as the agent must be aware of her awareness. To succeed, awareness must be non-propositional, a primitive feature of the agent's cognitive architecture rather than another object of belief.

  In conclusion, horn (b) is superior because it preserves the classical nature of content and the normative force of logic. However, it only succeeds if we understand inference as an agentive performance constrained by norms, rather than a mechanical transition constrained only by capacity. Without this, we merely describe a machine, not a knower.

  ***

  **Marking Scheme**

  1.  **Choice and Defence (4 marks):** The candidate must explicitly choose one horn and provide a reasoned justification for preferring it over the alternative.
      *   *Common Error:* Candidates describe both options neutrally without committing to a defence of one.
  2.  **Distinction of Properties (4 marks):** The candidate must distinguish knowing logical truths from closure under entailment and show how a repair might affect one without the other.
      *   *Common Error:* Candidates treat omniscience and closure as a single, indivisible property throughout the essay.
  3.  **Preservation of Norms (4 marks):** The candidate must explain the necessity of preserving truth-aptness of content and the normativity of logic within their chosen framework.
      *   *Common Error:* Candidates sacrifice truth-aptness without comment or ignore the normative dimension of logical failure.
  4.  **Inference as Activity (4 marks):** The candidate must argue that the problem demands an account of inference as something an agent does rather than a static state relation.
      *   *Common Error:* Candidates treat inference as a purely mechanical or causal state transition rather than an agentive activity.
  5.  **Awareness Hazard (4 marks):** The candidate must explain how an awareness clause bolted onto an unreduced closure principle can collapse back into omniscience.
      *   *Common Error:* Candidates assume that adding an awareness clause automatically solves the problem without considering the regress or collapse hazard.

  **Total: 20 Marks**

  The move that separates a first-class answer from a competent second-class one is the recognition that logical normativity requires inference to be an agentive performance rather than a static relation between states.
