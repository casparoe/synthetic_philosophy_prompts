      *   *The Turn:* How does it go wrong without bad people? It needs to prioritize *winning* or *the Coalition's stance* over the actual nuance of safety.
      *   *Drafting the paragraph:* Focus on the shift from "fixing the corner" to "defending the Coalition's proposal."
      *   *Refining:* Make sure the conflict arises from the *need to maintain unity* against a counter-proposal, even if the counter-proposal has merit.

  3.  **Analyzing the Mechanism (Weil's Features):**
      *   *Obligation Migration:* Members stop asking "Is this safe?" and start asking "Is this good for the Coalition?"
      *   *Need for Rivals:* The Coalition needs the Department of Transportation (DOT) to be the "enemy" to stay cohesive, even when the DOT offers a compromise.
      *   *Attention Shift:* Energy goes into newsletters, meetings, and recruiting rather than listening to the kids or drivers.
      *   *Speaking for Others:* They claim to speak for "The Parents," silencing parents who disagree.
      *   *Load-Bearing Feature:* The *collective will to persist*. Once the group exists, its primary goal becomes its own continuation.

  4.  **The Control Condition (Loose Network):**
