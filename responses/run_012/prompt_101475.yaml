answer: |-
  **The Case: The Northwood Crossing Committee**

  In the quiet suburb of Northwood, a group of six parents forms the "Northwood Crossing Committee" to stop cars from speeding past the elementary school. Their goal is indisputably good: prevent children from getting hit. Every member is a conscientious neighbor; no one wants power, money, or status. They meet bi-weekly, take minutes, and draft a proposal for a new traffic light. When the City Engineering Department responds with data suggesting a roundabout would actually reduce speed more effectively and cost less, the Committee faces a choice. If they accept the roundabout, their specific proposal dies, their letterhead becomes obsolete, and their scheduled meetings lose their agenda. Without a single member acting in bad faith, the group collectively decides to reject the roundabout. They argue the light is "more visible" and "what the community expects," subtly dismissing the engineers' data. They begin to view the Engineering Department not as partners in safety, but as obstacles to the Committee's success. The original obligation—to keep children safe—is silently replaced by the obligation to validate the Committee's existence. The light is eventually installed after a prolonged delay, it costs more, and it is less effective than the roundabout would have been, but the Committee holds a victory dinner, feeling morally satisfied.

  ***

  **The Mechanism: What Did the Work?**

  In this scenario, the load-bearing feature is the **migration of obligation from the concrete to the abstract.**

  At the start, the members' conscience was hooked directly onto the suffering of potential victims (the children). By the end, their conscience was hooked onto the survival and vindication of the Committee. Weil argues that a collective mind is a fiction; it cannot feel pity or perceive truth, only persistence. When the engineers offered a better solution, a lone individual could have perceived the truth of the data. But the *group* could only perceive a threat to its unity. To accept the roundabout would require the group to admit its own proposal was secondary to the goal, which effectively dissolves the group's reason for being.

  Secondary features accelerated this:
  *   **The Need for Rivals:** The Committee needed the Engineering Department to be slightly adversarial to maintain its own cohesion. If the Department agreed immediately, the Committee disbands. Subconsciously, conflict became necessary fuel.
  *   **Speaking for Others:** The Committee claimed to represent "The Parents." This allowed them to ignore actual parents who might have preferred the roundabout, because the Committee had already monopolized the voice of the collective.
  *   **Attention Shift:** Energy moved from watching the cars (reality) to managing the meetings and press releases (the group's self-image).

  **The Control Condition: The Loose Network**

  Strip the form away. Imagine the same six parents, but they never form a committee. No name, no votes, no minutes, no platform. They just have a group chat called "Northwood Safety."

  When the City proposes the roundabout, the dynamic changes. There is no "Committee stance" to defend. Parent A can say, "Actually, this data looks solid." Parent B can say, "I'm fine with that." Parent C might still want the light, but they can't enforce a party line because there is no party. There is no membership to revoke, no reputation of an organization to protect. The obligation remains stuck to the children, because there is no intermediate idol (the Organization) to absorb it.

  In this control, the problem dissolves. The solution (roundabout) gets implemented faster. The "rot" was not in the people, nor the goal, but in the *structure that required self-perpetuation.* A loose network can disband the moment its goal is achieved; a party must survive the achievement of its goal to remain a party.

  **Steelman: The Defense of the Party Form**

  A pragmatist would attack this case by arguing that the "loose network" is a luxury of small stakes. In the control condition, the City might have ignored the group chat entirely. It is easy to be fluid when you have no leverage.

  The pragmatist argues that the "Committee" form, with its name, its minutes, and its unified voice, is what forced the City to the table in the first place. The "rot" of self-perpetuation is the tax you pay for effectiveness. A loose network cannot sustain pressure over months; it fragments when people get busy. The Party form creates a fictional entity that can show up when individuals can't. It concentrates scattered moral energy into a beam strong enough to cut through bureaucracy.

  From this view, Weil's critique is too pure. Yes, the Committee prioritized itself, but without that self-prioritization, the City might have done nothing at all. The "bad" outcome (a light instead of a roundabout) is still a net positive compared to the status quo (speeding cars). The party form is a tool that amplifies will, and like any amplifier, it introduces distortion. The question is whether you prefer silence or distorted sound.

  **The Honest Conclusion: Parties or People?**

  If we follow the logic through, the honest answer is that this is a claim about **people**, which the party form simply crystallizes.

  Any durable collective—a marriage, a corporation, a friendship circle, a family—tends to prioritize its own continuation over its original purpose. Families stay together "for the sake of the family" even when the members are miserable. Companies keep selling products even when they no longer serve the customers. The "party" is just the most explicit version of this human tendency to build an idol out of our shared efforts.

  However, Weil's specific bite is that parties *formalize* this idolatry. They demand intellectual consent. They ask you to surrender your judgment to the collective line. A family might drift into self-preservation by accident; a party requires you to vote for it. So while the root is in human psychology (our desire to belong to something bigger than ourselves), the party is the only structure that makes that surrender a condition of participation.

  So, does the problem dissolve in a loose network? Yes, but only because the network lacks the power to get anything big done. The tragedy Weil points to is that the very mechanism required to scale human cooperation (the collective structure) is the same mechanism that corrupts the moral intention behind it. We cannot easily have the power without the rot.
