prompt: |-
  I sit on the heritage committee in my city — we're the ones who hand out the culture grants — and next week we vote on an application from the Midwinter Lantern Walk people. They want forty grand to stage what their application calls "a tradition unbroken since the 1650s." Our resident historian (retired archivist, does this for free) has dug up that the walk was actually assembled in 1974 by a schoolteacher and a tourism officer out of scraps of a Victorian thing, and that the Victorian thing was itself a revival somebody cooked up for a mill opening. She wants us to reject on the grounds that funding it means the city printing a lie. Two other members say who cares where it came from, three thousand people show up and the old folks cry, so rejecting is just vandalism with a filing cabinet.

  Then I got into it with my friend Nell at the pub. She did a module on Hobsbawm and Anderson at some point and kept saying the whole question is confused, because all traditions are invented — christmas, the monarchy, weddings — so the historian's "authenticity" line is just snobbery with a footnote. I said fine, but then what is the historian actually measuring, and if nothing is authentic then the word "lie" has nothing to bite on, which can't be right either. She said that's just me wanting there to be real traditions under the floorboards. I said if we ran her test consistently we'd have to slap a disclaimer on half the city's civic furniture, and she said yes, good, do it. We went round for about an hour and a half.

  Draft the memo I'll circulate before the vote. I want a concrete recommendation — fund, fund with conditions, or reject, and say exactly what the conditions or wording would be, including whether they get to keep the "unbroken since the 1650s" line on the posters — plus the reasoning, and an honest account of the strongest case on the losing side. And say something useful about the Nell problem: what is this committee supposed to be measuring when it asks whether a tradition is real, does it matter whether the people doing the walking believe the 1650s story or would cheerfully admit it's from 1974, and should any answer to that actually move the vote.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a City Heritage Committee (culture grants).
      *   **Task:** Draft a memo to circulate to the committee before a vote.
      *   **Subject:** Funding application from "Midwinter Lantern Walk" ($40k).
      *   **Conflict:**
          *   Applicant claim: "Tradition unbroken since the 1650s."
          *   Historian's finding: Invented in 1974 (based on a Victorian revival).
          *   Historian's stance: Reject (funding = printing a lie).
          *   Other Members' stance: Fund (community value > historical accuracy).
          *   Friend (Nell)'s stance (Hobsbawm/Anderson): All traditions are invented; "authenticity" is snobbery.
      *   **Requirements:**
          *   Concrete recommendation (Fund, Fund with Conditions, or Reject).
          *   Specific wording/conditions (especially regarding the "1650s" claim).
          *   Reasoning.
          *   Honest account of the strongest case for the losing side.
          *   Address the "Nell Problem" (What are we measuring? Does belief matter? Should it move the vote?).
      *   **Tone:** Professional, thoughtful, decisive, nuanced, suitable for a committee memo.

  2.  **Deconstruct the "Nell Problem" (Theoretical Framework):**
      *   *Hobsbawm & Ranger (Invention of Tradition):* Traditions are often constructed to establish continuity with a suitable historic past, usually to legitimize institutions or foster social cohesion.
      *   *The Committee's Mandate:* "Heritage Committee." What is heritage? Is it objective historical fact or subjective community value?
      *   *The "Lie" vs. "Myth" distinction:* A lie implies intent to deceive for gain. A myth implies a shared story that holds meaning regardless of factual accuracy.
      *   *Belief:* Do the participants *need* to believe it's 1650s for it to work? Or is the *performance* of continuity enough?
      *   *Conclusion for Memo:* The committee shouldn't be arbitrating absolute historical truth (Nell is right that *all* traditions have constructed elements), but we *are* stewards of public trust and historical integrity. We can fund the *practice* without funding the *falsehood*.

  3.  **Determine the Recommendation:**
      *   *Reject:* Too harsh. Kills community joy based on technicality. Aligns with the Historian but ignores the "Heritage as Living Practice" aspect.
      *   *Fund Unconditionally:* Ignores the historian's work. Validates misinformation. Risks the committee's credibility if the 1974 date becomes public knowledge (which it now is).
      *   *Fund with Conditions:* The middle path. Acknowledges value, supports the event, but corrects the record.
      *   *Decision:* **Fund with Conditions.**
      *   *Condition:* The "1650s" claim must be removed or qualified. The program notes must acknowledge the 1974 revival.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Recommendation:** State it clearly up top.
      *   **Context:** Briefly summarize the application and the historian's report.
      *   **Reasoning (The Core):**
          *   Address the value of the event (community cohesion, joy).
          *   Address the historical accuracy issue (the "Lie").
          *   Address the "Nell Problem" (Invented Tradition theory).
      *   **The "Nell Problem" Integration:** This needs to be the intellectual anchor.
          *   *What are we measuring?* Not "purity," but "integrity of narrative."
          *   *Does belief matter?* Yes, but informed belief is better than false belief.
          *   *Should it move the vote?* Yes, because public funds require public trust.
      *   **Conditions:** Specific wording for the grant agreement and marketing.
      *   **The Losing Side:** Give the Historian and the "Community First" members their due.
          *   *Historian:* Integrity of the archive.
          *   *Community First:* Don't ruin magic with pedantry.
      *   **Conclusion:** Final wrap-up.

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but acknowledge the Hobsbawm point intelligently.
      *   Be firm but collegial.
      *   Ensure the distinction between "historical fact" and "cultural value" is clear.
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm scolding the applicants. They might genuinely believe the 1650s story. The focus should be on *our* funding criteria, not their morality.
      *   *Specific Wording:* Instead of banning the 1650s reference entirely (which might be too aggressive if there's *some* vague link), require context. Actually, the historian said 1974 assembly from Victorian scraps. The 1650s claim is demonstrably false. It should be removed from *marketing*, but can be discussed as *lore* in educational materials. Let's make it clear: Marketing cannot state it as fact.

  6.  **Addressing the Prompt's Specific Questions:**
      *   *Concrete recommendation?* Yes (Fund with Conditions).
      *   *Wording?* Yes (Grant clause + Poster text).
      *   *Strongest losing case?* Yes (Historian's integrity vs. Community's joy).
      *   *Nell Problem?* Yes (Section on "The Nature of Heritage").

  7.  **Final Polish:** Check the flow. Ensure the transition from the theoretical (Nell) to the practical (Grant Conditions) is smooth. Make sure the "1650s" line is handled decisively. (Decision: They cannot print it as fact. They can frame it as "Inspired by lore dating to..." but "Unbroken since" is the lie.)

  8.  *(Self-Correction on the "1650s" line)*: The prompt says the application *calls* it "a tradition unbroken since the 1650s." The historian says it's 1974. If I say "remove the line," that's a condition. If I say "change the line," that's also a condition. The prompt asks if they get to keep it. My recommendation should be "No, not as stated."

  9.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommendation clear? Yes.
      *   Reasoning included? Yes.
      *   Losing side accounted for? Yes.
      *   Nell problem addressed? Yes.

