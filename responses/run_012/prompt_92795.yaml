prompt: |-
  I'm hosting a podcast episode with a scholar who defends Du Bois's claim that all art is propaganda — she thinks the idea that art should be judged apart from politics is basically a luxury position for people who can afford to be indifferent. I want the interview to actually test her instead of letting her restate the thesis, so give me eight to ten questions, each with a follow-up keyed to the answer she's most likely to give, so I can pivot when she takes the obvious escape route.

  Four things I want hit. First, the beauty problem: Du Bois clearly cared about beauty and form for their own sake and didn't just want sermons, so how does she square that with the propaganda thesis without making beauty a mere delivery vehicle. Second, his own nastier side as a critic — his infamous takedown of a Harlem Renaissance novel for wallowing in the seamy side of Black life — doesn't the thesis collapse into a demand for respectable representation. Third, whether it survives when the audience isn't a movement but a scattered streaming audience, e.g. a prestige TV drama about slavery made mostly for white viewers' catharsis. Fourth, falsifiability: is there any art she'd call genuinely apolitical, and if not, is the thesis in danger of being unfalsifiable.

  Format it like this: a section called "Ground floor" with 2 questions, then "Where it hurts" with 5 or 6 covering those four issues, then "Last word" with 1 question she can't dodge with a slogan. Under each question, one line starting "If she says..." that tells me the comeback. Keep it under 600 words and dont make any of them sound like a book report.
