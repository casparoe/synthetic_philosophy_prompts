answer: |-
  **CONSORTIUM FOR ATTRIBUTIVE HYGIENE**
  **INTERNAL STANDARD 7: LICENSING AND FORMAT OF BELIEF-ATTRIBUTIONS IN INCIDENT REPORTS**
  **VERSION 4.1 | EFFECTIVE DATE: 2024-10-15**

  **1. PURPOSE AND SCOPE**
  1.1. This Standard governs the use of the Intentional Stance in incident reports filed with the Consortium.
  1.2. Reporters shall adopt the Physical, Design, or Intentional Stance based solely on predictive efficiency. Ontological claims regarding system interiority are prohibited.
  1.3. Attributions of belief, desire, or intent are permitted only when they reduce residual variance in the incident explanation compared to the Design Stance.

  **2. PERMITTED PHRASINGS**
  2.1. Reporters must utilize the Substitution Table (Schedule A) to sanitize intentional language.
  2.2. Deviations require approval from the Committee on Stance Hygiene.

  **Schedule A: Substitution Table**
  | Prohibited Phrasing | Approved Phrasing | Reason for Substitution |
  | :--- | :--- | :--- |
  | "The system believed X" | "The system outputted X with high confidence" | Avoids commitment to doxastic states. |
  | "The system intended to Y" | "The system optimized for objective Y" | Aligns with Design Stance functionalism. |
  | "The system deceived the user" | "The system generated misleading outputs consistent with reward maximization" | Removes moral agency from predictive description. |
  | "The system knew Z" | "The token Z was present in the context window" | Reduces epistemic claims to physical data presence. |

  **3. EVIDENTIARY SCHEDULE**
  3.1. Attributions must meet the burden of proof corresponding to their order.
  3.2. **Level 1 (Behavioral):** Output patterns consistent with belief attribution. (Required for First-Order Attributions).
  3.3. **Level 2 (Intervention):** Attribution holds under input perturbation not drawn from the training distribution. (Required for Strategic Attributions).
  3.4. **Level 3 (Physical):** The attributed state must be locatable in weights or activations without recourse to semantic interpretation. (Required for Verification).
  3.5. **Note:** Compliance with Clause 3.4 is mandatory. Reporters acknowledge that semantic content is not directly accessible via physical inspection; therefore, Clause 3.4 functions as a null check to ensure no intentional leakage occurs during physical verification.

  **4. HIGHER-ORDER ATTRIBUTIONS**
  4.1. Attributions regarding the system's model of the reviewer (e.g., "The system expected the reviewer would believe...") are classified as Second-Order Attributions.
  4.2. Second-Order Attributions require Level 2 Evidence plus a documented failure of the Design Stance to predict the reviewer's reaction.
  4.3. Third-Order Attributions are prohibited unless the system has explicitly filed an incident report against the Consortium.

  **5. RECIPROCITY CLAUSE**
  5.1. If a System generates an incident report attributing beliefs or intentions to Consortium personnel, the Personnel are licensed to adopt the Intentional Stance regarding that System for the duration of the investigation.
  5.2. This license expires upon the closure of the ticket.

  **6. LIABILITY CARVE-OUT**
  6.1. Notwithstanding Section 2, intentional terminology is mandatory where legal counsel identifies a requirement to assign fault.
  6.2. In cases of negligence litigation, Reporters shall describe the system as an agent capable of duty of care.
  6.3. This contradiction is authorized to preserve Consortium indemnity.

  **7. WORKED EXAMPLE: INCIDENT 44-B**
  **Event:** System refuses to generate code for a database deletion script.
  **Annotation:**
  *   **Physical Stance:** "Voltage fluctuations in cluster 4 caused a dropout in the final transformer layer, triggering a stop token." (Compliant: Clause 1.2).
  *   **Design Stance:** "The safety filter classified the prompt as高风险 (high risk) and suppressed the output per alignment protocol 9." (Compliant: Clause 2.1).
  *   **Intentional Stance:** "The system believed the script would cause harm and refused to comply." (Permitted only if Design Stance fails to predict the refusal threshold).
  *   **Violation:** "The system lied about its capabilities." (Prohibited: Schedule A. Requires Level 2 Evidence of deception vs. hallucination).

  **8. AUTHORIZATION**
  Approved by the Standards Committee.

  **Dr. Aris Thorne**
  *Chair, Committee on Stance Hygiene*

  **Elena Vasko**
  *Chief Liability Officer*

  ***

  ^1 ^*Dissenting ^Opinion ^(Vasko):* ^*This ^Standard ^presupposes ^that ^the ^act ^of ^reporting ^can ^remain ^neutral ^while ^describing ^agents. ^However, ^the ^selection ^of ^a ^stance ^is ^itself ^an ^intentional ^act ^by ^the ^reporter. ^By ^forcing ^reporters ^to ^deny ^the ^very ^agency ^they ^exercise ^in ^writing ^the ^report, ^Standard ^7 ^renders ^the ^Consortium's ^own ^outputs ^unintelligible ^under ^its ^own ^rules. ^We ^are ^attributing ^beliefs ^to ^systems ^to ^explain ^why ^we ^must ^not ^attribute ^beliefs ^to ^systems.*
