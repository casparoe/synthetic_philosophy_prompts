          *   *Claim 2:* "This is essentially Blackburn's quasi-realist strategy: moral sentences come out true or false, with truth-conditions of the ordinary descriptive kind..."
              *   *Critique:* **Fatal Error.** Blackburn explicitly denies "ordinary descriptive truth conditions." That is the definition of realism. Quasi-realism mimics the *grammar* of truth, not the *metaphysics*. This conflates quasi-realism with realism.
          *   *Claim 3:* "...and that is exactly what the expressivist needs in order to explain validity."
              *   *Critique:* Controversial. Many expressivists argue validity is about consistency of attitudes, not truth conditions. But the bigger issue is the previous point.
          *   *Claim 4:* "The only thing the proposal leaves out is a reason why these inferences... This can be supplied by the attitudes we actually have..."
