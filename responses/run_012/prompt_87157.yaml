answer: |-
  ### Instructor's Preliminary Sketch & Key

  Before grading, I must establish what a fully correct answer requires at the upper-level undergraduate standard.

  **Part (a): The Problem**
  *   **Core Definition:** Expressivism claims moral sentences express non-cognitive attitudes (e.g., disapproval) rather than describing facts (beliefs).
  *   **The Embedding Problem:** Moral sentences occur in unasserted contexts (e.g., the antecedent of a conditional: "If lying is wrong..."). In these contexts, the speaker does not express the attitude. If meaning *is* the expression of the attitude, the sentence in the antecedent lacks meaning or has a different meaning than in the asserted premise ("Lying is wrong").
  *   **The Threat to Validity:** If the meaning of "lying is wrong" shifts between the conditional premise and the categorical premise, the argument commits the fallacy of equivocation. Expressivism seemingly cannot account for the validity of moral modus ponens.
  *   **The Negation Problem (Distinction):** This is distinct from general embedding. It concerns logical inconsistency. If "Lying is wrong" expresses Attitude A, what does "Lying is not wrong" express? It cannot be merely the absence of A (one can lack an attitude without holding the opposing view). It must express an attitude incompatible with A. The difficulty is specifying this incompatibility without treating the attitudes as truth-apt beliefs (which would abandon expressivism).
  *   **Why it Threatens Expressivism:** If expressivism cannot explain logical relations (validity, inconsistency) without collapsing into cognitivism, it fails as a semantic theory.

  **Part (b): Evaluating the Proposal**
  *   **The Proposal:** Meaning = Inferential Role.
  *   **Assessment:** This is the standard inferentialist response (associated with Blackburn and Gibbard). However, simply asserting this does not *solve* the problem without further machinery.
  *   **Crucial Nuance:** The student must recognize that for the expressivist, "validity" cannot be standard truth-preservation (since moral sentences aren't truth-apt in the descriptive sense). It must be preservation of *commitment* or *consistency of attitudes*.
  *   **The Trap:** A correct answer should note that while inferentialism is the right *direction*, the student's claim that this grants "ordinary descriptive truth-conditions" is a **misattribution** that collapses expressivism into realism. Quasi-realism earns the *right to talk* of truth, but denies the *metaphysics* of descriptive truth conditions.
  *   **Psychologism:** Explaining validity via psychological dispositions ("we are disposed to disapprove...") is insufficient. Validity is normative (what one *ought* to accept), not descriptive (what one *does* accept).

  ---

  ### Grading Assessment

  **Part (a): Statement of the Problem and Distinction**

  *   **Statement of the Problem:** **Correct.** You accurately identify the core expressivist claim (attitude vs. fact) and correctly utilize the modus ponens example to illustrate the embedding issue. You correctly identify the threat: if meaning changes between asserted and unasserted contexts, the argument is invalid due to equivocation.
  *   **The Distinction (Embedding vs. Negation):** **Mostly Correct, slightly underdeveloped.** You successfully distinguish the two. Your explanation of the negation problem ("It cannot be the mere absence of disapproval...") captures the intuitive difficulty well. However, you frame the issue as "describing an attitude instead of expressing one." While related, the precise philosophical threat of the negation problem is explaining *logical inconsistency* between attitudes without positing contradictory beliefs. Nevertheless, for an undergraduate exam, your grasp of the distinction is sufficient.
  *   **Explanation of the Threat:** **Correct.** You clearly state that without a uniform meaning across contexts, expressivism cannot explain validity.

  **Part (b): Evaluation of the Proposal**

  *   **Assessment of Inferential Role:** **Underdeveloped.** You correctly identify that inferential role persists in unasserted contexts. This is the standard expressivist move. However, you treat this as a complete solution rather than a research program. Merely stating that meaning is inferential role does not explain *what kind* of logic governs those inferences if not a logic of truth.
  *   **Misattribution of Quasi-Realism:** **Wrong.** You write: *"This is essentially Blackburn's quasi-realist strategy: moral sentences come out true or false, with truth-conditions of the ordinary descriptive kind."* This is a fundamental mischaracterization. Blackburn's quasi-realism explicitly **denies** that moral sentences have "ordinary descriptive truth-conditions." That is the definition of realism. Quasi-realism argues that expressivists can *mimic* the linguistic practices of truth (assertibility, negation, conditionals) without committing to descriptive truth-conditions. By claiming the proposal grants ordinary descriptive truth-conditions, you have described a view that has ceased to be expressivism. This matters because the Frege-Geach problem is precisely about solving logical issues *without* adopting realist semantics. If the solution is "become a realist," it is not a solution for an expressivist.
  *   **Conflation of Logic and Psychology:** **Wrong.** In your final paragraph, you argue the proposal works because *"we are disposed to disapprove... whenever we disapprove."* This conflates **validity** with **psychological disposition**. Validity is a normative relation: if you accept the premises, you *ought* to accept the conclusion. Explaining that humans *happen* to have certain psychological dispositions explains why we accept the argument, but not why the argument is valid. A logical theory must account for the normativity of inference, not just the causal regularity of attitude formation. This is a version of the psychologistic fallacy.
  *   **Conclusion on the Proposal:** **Unsupported.** Because of the errors above, your conclusion that *"the proposal does answer the Frege–Geach problem"* is too strong. A rigorous answer would conclude that the proposal offers a framework for a solution (inferentialism) but requires a developed logic of attitudes (e.g., Gibbard's norm-expressivism) or a deflationary theory of truth to succeed, rather than simply appealing to dispositions or descriptive truth.

  **Clarity and Coherence**
  Your writing is clear, structured, and easy to follow. You demonstrate a good grasp of the dialectic in Part (a). The breakdown occurs in Part (b) where philosophical precision is required regarding the metaphysical commitments of the views you cite.

  ### Final Grade: B-

  **Justification:**
  You demonstrate a strong command of the Frege-Geach problem itself (Part a), which is the foundational knowledge required for this course. Your distinction between embedding and negation is clear, and your explanation of the equivocation threat is accurate. However, Part (b) requires critical evaluation of a metaethical proposal, and here you make two significant errors. First, you fundamentally mischaracterize Blackburn's quasi-realism by attributing "ordinary descriptive truth-conditions" to it, which contradicts the definition of expressivism. Second, you offer a psychological explanation for a logical problem (validity), failing to address the normativity of inference. In an upper-level course, distinguishing between realist and quasi-realist truth, and between psychological disposition and logical validity, is essential. These errors prevent the grade from rising into the A range, but the strength of Part (a) and the clarity of your writing keep it from falling lower.
