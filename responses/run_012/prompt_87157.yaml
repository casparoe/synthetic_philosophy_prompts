  2.  **Work the Question (Instructor's Key):**

      *   **Part (a): The Frege-Geach Problem**
          *   *Core Claim:* Expressivism says moral sentences express non-cognitive attitudes (not beliefs/facts).
          *   *The Problem:* Moral sentences appear in unasserted contexts (conditionals, questions, etc.).
          *   *Distinction 1 (Embedding/Unasserted):* In "If lying is wrong...", the speaker isn't expressing disapproval of lying. If meaning *is* expressing attitude, the sentence in the antecedent lacks meaning or has different meaning than in the assertion "Lying is wrong." This threatens logical validity (equivocation).
          *   *Distinction 2 (Negation):* The "Negation Problem" (often associated with Schroeder or Unwin). It's not just about embedding, but specifically about the logical relations between $P$, $\neg P$, and conditionals involving them. What attitude does "It is not the case that lying is wrong" express? It's not just "no attitude." It needs to be incompatible with the attitude expressed by "Lying is wrong" to preserve logical inconsistency.
          *   *The Threat:* If expressivism cannot account for the meaning of embedded sentences being the *same* as asserted sentences, it cannot account for the validity of moral arguments (like modus ponens). If it can't explain validity, it fails as a semantic theory.

      *   **Part (b): Evaluating the Proposal**
          *   *The Proposal:* Meaning = Inferential Role. Since inferential role persists in unasserted contexts, the problem is solved.
          *   *Assessment:* Does this solve it?
          *   *Critical Analysis:*
              *   *Surface Plausibility:* Inferentialism (e.g., Blackburn, Gibbard) is indeed a common route to address F-G.
              *   *The Catch:* Simply *stating* that meaning is inferential role doesn't solve the problem unless you explain *how* the expressivist accounts for that inferential role without collapsing into realism.
              *   *The Student's Error:* The student claims this proposal allows moral sentences to come out "true or false, with truth-conditions of the ordinary descriptive kind." This is a **major misattribution**. Quasi-realism (Blackburn) aims to *earn the right* to talk of truth, but explicitly denies they have "ordinary descriptive truth conditions." If they had ordinary descriptive truth conditions, expressivism would be false (it would be cognitivism/realism).
              *   *The "Solution" Claim:* The student says the proposal *does* answer the problem because we can add the attitudes back in. But the core of the F-G problem is precisely that the *attitude* account fails in embedded contexts. Merely asserting inferential role works only if one provides a logic of attitudes (e.g., Gibbard's norm-expressivism or Blackburn's projectionist logic). The student's explanation that "we are disposed to disapprove... whenever we disapprove" is a psychological claim, not a semantic one. It explains why we *accept* the argument, not why the argument is *valid* (truth-preserving or commitment-preserving in a logical sense).
              *   *Verdict:* The student identifies the strategy (inferentialism/quasi-realism) but fundamentally misunderstands the metaphysical/semantic commitment of quasi-realism (claiming it grants ordinary descriptive truth conditions) and offers a psychological explanation for a logical problem.

  3.  **Evaluate the Student's Answer (Point-by-Point):**

      *   **Part (a) - Statement of Problem:**
          *   *Strengths:* Correctly identifies expressivism (attitude vs. fact). Correctly identifies the modus ponens example. Correctly notes the equivocation threat (meaning change between asserted/unasserted).
