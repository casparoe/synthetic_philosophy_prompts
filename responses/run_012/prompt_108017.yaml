          *   (5) If irrational, ought not to do it.
          *   Result: I ought to pay AND I ought not to pay.
          *   *Severity:* Fatal. Logical inconsistency.
          *   *Revision:* Drop (5). Adopt a view where "Rational" and "Ought" come apart, or where "Ought" is determined by *ex ante* rationality (dispositional) rather than *ex post* act rationality. This is the "Resolute Choice" or "Disposition-Based" move.
          *   *Cost:* Abandoning the principle that local act-rationality dictates obligation.

      *   **Tension 2: Hitchhiker (2)/(3) vs. Counterfactual Mugging (6).**
