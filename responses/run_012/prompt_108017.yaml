          *   (4) says it's rational to cultivate a disposition to do $X$ (where $X$ is irrational at $t_{action}$).
          *   (5) says if $X$ is irrational at $t_{action}$, you ought not do $X$.
          *   If you cultivate the disposition, you *will* do $X$.
          *   So you ought to cultivate a disposition that makes you do what you ought not do?
          *   This is the "Rational Irrationality" paradox. (4) and (5) are technically compatible if "Rational to cultivate" $\neq$ "Ought to cultivate" or if "Ought" in (5) is act-ought vs. "Ought" in (2) is dispositional-ought. But the user uses "Ought" in (2) and (5) seemingly interchangeably regarding the act.
          *   *Tension:* High. (2) says "Ought to Pay". (4) says "Paying is irrational". (5) says "If Irrational, Ought Not". This is a logical contradiction: Ought Pay AND Ought Not Pay.

