          *   *Tension:* Why does the *ex ante* disposition argument work for Hitchhiker but not Counterfactual Mugging? Both involve a past event (rescue/coin flip) that is causally independent of the current choice, but evidentially/counterfactually linked to the *ex ante* setup.
