          *   If they accept (7) (One-Box), they usually accept that acting *as if* you are the type who One-Boxes is rational even if the money is already in the box.
          *   If they accept (7), why do they reject paying in Counterfactual Mugging (6)? Newcomb and Counterfactual Mugging are often seen as structurally similar (Parfit's "Psychopath Button" or Ahmed's arguments). If you One-Box because the predictor already predicted it, why not Pay in Mugging because the predictor (Omega) already predicted you would pay?
