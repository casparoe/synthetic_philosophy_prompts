      *   (3) *Hitchhiker Justification:* I ought to pay because I ought to have a standing disposition to keep promises, which is rational *ex ante* ($t_0$).
      *   (4) *Rational Irrationality:* It can be rational to cultivate a disposition that leads one to perform an act that is irrational at the time of action.
      *   (5) *Ought-Implies-Rational (or similar):* If an act is irrational, one ought not to perform it.
      *   (6) *Counterfactual Mugging:* I ought *not* to pay (in the specific formulation where the coin is already flipped).
