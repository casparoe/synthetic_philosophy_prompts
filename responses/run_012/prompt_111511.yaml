  # Joint Statement on Algorithmic Fairness Trade-offs

  **Preamble**
  We, the undersigned, represent two perspectives on the role of mathematical impossibility theorems in algorithmic fairness. One perspective emphasizes the inevitability of trade-offs under conditions of group inequality (the Impossibility Camp). The other emphasizes the sensitivity of these results to modeling assumptions and the availability of alternative formalisms (the Artefact Camp). We agree that our previous debate suffered from conflating mathematical constraints with normative choices, and from ambiguity regarding what constitutes a "solution" to unfairness. This document clarifies our common ground, isolates our genuine disagreements, and proposes specific tests to resolve them.

  ### 1. Agreed Claims

  We jointly affirm the following propositions regarding the mathematics, the application, and the normative status of fairness trade-offs:

  1.  **Mathematical Validity:** We agree that the impossibility theorems are mathematically correct under their stated assumptions. Specifically, when base rates differ between groups and a classifier is imperfect, it is generally impossible to satisfy Calibration (predictive parity) and Error Rate Balance (equalized odds) simultaneously.
  2.  **Driver of Tension:** We agree that divergence in base rates is the primary statistical engine of this conflict. If base rates were equal, or if prediction were perfect, the tension would vanish.
  3.  **Normative Underdetermination:** We agree that the mathematics does not dictate which fairness criterion should be prioritized. Choosing to satisfy Calibration over Error Rate Balance (or vice versa) is a moral and political decision, not a technical derivation.
  4.  **Scope of Formalism:** We agree that the theorems apply strictly to the formalisms in which they are proved (typically binary classification, single protected attribute, static thresholds). They do not automatically generalize to all decision-making contexts without further argument.
  5.  **Ontological Status:** We agree that a mathematical impossibility within a model is not necessarily a physical or moral impossibility in the world. A theorem constrains the model, not necessarily the reality the model attempts to capture.
  6.  **Base Rate Origins:** We agree that base rate differences often reflect historical injustice or structural inequality. We disagree on the implication of this fact (see Section 3), but we agree it is relevant to the design of the system.
  7.  **No Technical Fix for Values:** We agree that no algorithmic adjustment can substitute for a societal consensus on what constitutes a fair distribution of error.

  ### 2. Residual Disagreements

  While we share the above foundations, we maintain distinct positions on the significance and solvability of the trade-off.

  **Position A (Impossibility Camp):**
  The trade-off results are decisive in spirit. Even if the specific assumptions are stylized, they capture a fundamental truth: when groups differ in risk profiles due to past injustice, any imperfect decision system must distribute harm unequally. Relaxing the assumptions (e.g., allowing randomization or utility optimization) does not remove the moral burden; it merely obscures it. The conflict is a feature of making high-stakes decisions under inequality, not a bug of the math. We must explicitly choose which error type to minimize for which group.

  **Position B (Artefact Camp):**
  The trade-off results are theorems about a narrow formalism. They describe a specific, constrained optimization problem, not a law of nature. By expanding the formalism to include causal structures, group-specific thresholds, or dynamic feedback loops, the "impossibility" dissolves into a standard constrained optimization problem. The conflict arises because the original metrics (like equalized odds) are often poor proxies for the underlying moral goal. Solving the math by changing the metrics is not "changing the subject"; it is correcting the formalization to match the moral intuition.

  ### 3. Cruxes and Pre-Registered Tests

  We identify two specific points of contention where our disagreement is empirical or argumentative rather than merely terminological. For each, we propose a test case and record our predictions.

  **Crux 1: The Realism of Assumptions**
  *The Dispute:* Is the standard formalism (binary decision, fixed threshold, exogenous base rate) a sufficiently accurate map of high-stakes deployment to make the impossibility binding?
  *   **Impossibility Camp View:** The assumptions are close enough to reality (e.g., bail decisions are effectively binary, risk scores are used as fixed cutoffs) that the trade-off will manifest in practice regardless of theoretical escapes.
  *   **Artefact Camp View:** The assumptions are too rigid. Real-world decision-making involves continuous risk assessment, human discretion, and cost-sensitive thresholds that bypass the binary parity conflict.

  *   **Test Case:** A simulation of pretrial release using historical data.
      *   *Setup:* Construct two models. Model 1 enforces strict Equalized Odds (equal FPR/FNR across groups) via a single threshold. Model 2 optimizes a cost-sensitive utility function with group-specific thresholds that equalizes *expected harm* rather than error rates.
      *   **Prediction (Impossibility Camp):** Model 2 will result in visibly disparate error rates that the public will perceive as unfair, demonstrating that the trade-off was hidden, not solved. The "optimization" will simply privilege one group's errors over the other's based on the cost function.
      *   **Prediction (Artefact Camp):** Model 2 will achieve higher overall social welfare with no significant increase in perceived unfairness when the decision logic is explained. The disparity in error rates will be shown to be statistically necessary but morally acceptable given the utility structure, dissolving the "impossibility" tension.

  **Crux 2: The "Changing the Subject" Objection**
  *The Dispute:* When the Artefact Camp proposes alternative criteria (e.g., causal fairness or utility maximization), does this satisfy the original moral intuition behind the impossible metrics, or does it abandon it?
  *   **Impossibility Camp View:** Metrics like Equalized Odds capture a specific moral claim (that the burden of false accusations should be shared). Replacing this with Utility Maximization abandons that claim in favor of efficiency. This is changing the subject.
  *   **Artefact Camp View:** Metrics like Equalized Odds are flawed proxies for the moral claim. The true moral claim is about just outcomes. If Utility Maximization yields more just outcomes, it satisfies the *intent* of the fairness requirement, even if it violates the *metric*.

  *   **Test Case:** A deliberative argument analysis.
      *   *Setup:* Present a scenario where Base Rates differ. Option X satisfies Equalized Odds but lowers total public safety. Option Y satisfies Utility Maximization (higher safety) but has higher False Positive Rates for the lower base-rate group.
      *   **Prediction (Impossibility Camp):** When the trade-off is made explicit, a majority of stakeholders will reject Option Y as discriminatory, confirming that the original metric (Equalized Odds) captured a non-negotiable moral constraint that Utility Maximization violates.
      *   **Prediction (Artefact Camp):** When the consequences are made explicit (i.e., "Option X releases more dangerous individuals"), a majority of stakeholders will accept Option Y, confirming that the original metric was a rigid heuristic that people are willing to discard for better outcomes.

  ### 4. Identification of Verbal Disputes

  We acknowledge that portions of our prior argument were verbal rather than substantive. We clarify them as follows to prevent future confusion:

  1.  **"Impossibility":**
      *   *Source of Confusion:* The Impossibility Camp uses this to mean "logical incompatibility of specific statistical criteria." The Artefact Camp hears "it is impossible to build a fair system."
      *   *Resolution:* We agree to use the phrase **"Metric Incompatibility"** when referring to the theorems. We reserve **"Impossibility"** only for cases where no feasible decision rule satisfies the normative goal. We agree the theorems prove Metric Incompatibility, not necessarily Normative Impossibility.

  2.  **"Fairness":**
      *   *Source of Confusion:* The Impossibility Camp often equates fairness with **"satisfaction of a parity metric."** The Artefact Camp equates fairness with **"justification of the decision process."**
      *   *Resolution:* We agree that fairness is a normative property, not a statistical one. Statistical metrics are *evidence* of fairness or unfairness, not definitions of it. Disagreement about metrics is actually disagreement about which evidence is relevant.

  3.  **"The Base Rate":**
      *   *Source of Confusion:* The Impossibility Camp treats base rates as **fixed inputs** to the model. The Artefact Camp treats base rates as **mutable outcomes** of the system.
      *   *Resolution:* We agree that base rates are fixed *at the moment of prediction* but mutable *over time through policy*. The dispute is about the time horizon of the model. We will specify whether we are discussing "static fairness" (one-shot decision) or "dynamic fairness" (long-term equilibrium) in future arguments.

