prompt: |-
  My friend and I spent most of last night arguing about algorithmic fairness and kept talking past each other, so I want the document we should have written instead. You are a methodologist working across statistics, machine learning, and normative theory; before you write anything, think carefully, and brainstorm in a scratchpad the candidate points of agreement, the candidate cruxes, and any part of the dispute you suspect is merely verbal, then produce the final text.

  The two camps are these. The impossibility camp holds that the trade-off results are decisive in spirit: once two groups differ in base rate and the predictor is less than perfect, you cannot at the same time have a score that means the same thing in both groups and error rates that match across groups, so something must be given up, and which thing is given up is a moral choice rather than a technical one. The artefact camp holds that those results are theorems about a narrow formalism -- binary decisions, a single protected attribute, exact parity, calibration defined one particular way -- and that once you permit randomization, approximate rather than exact parity, group-specific thresholds, richer decision problems, or a causal or counterfactual rather than statistical characterization of a fair decision, the conflict either dissolves or becomes an ordinary constrained optimization problem with no special impossibility about it. We also kept sliding into a third question neither of us could state cleanly: whether an impossibility proved inside a formalism is a fact about the world at all, and whether the base-rate gap being itself the residue of past injustice tells us which criterion to abandon or is simply a different question.

  Draft the joint statement these two could sign. Give me a numbered section of agreed claims, including what the trade-off results establish as mathematics and what they do not; a section stating the residual disagreements in wording each side would accept for its own position; then the cruxes, at least one of which I expect to be whether the assumptions of the theorems are realistic and another whether the proposed escapes preserve the original fairness requirement or quietly change the subject; and for each crux, a case, dataset, or argument both sides agree would bear on it, with each side's prediction written down in advance. If any of our disagreement was verbal, say which part and why. No citations or reading lists, please -- I want the argument itself, in a form both of us could put our names to.
