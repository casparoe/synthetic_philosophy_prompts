  <scratchpad>
  **Brainstorming & Analysis**

  **1. The Core Dispute:**
  *   **Impossibility Camp (IC):** Believes the mathematical tension between Calibration (predictive parity) and Error Rate Balance (equalized odds) is a fundamental constraint on moral reasoning in high-stakes decisions. If base rates differ, you *must* choose which group gets the burden of error. This is a tragic choice, not a bug.
  *   **Artefact Camp (AC):** Believes the tension arises from specific, restrictive modeling choices (binary thresholds, static base rates, non-causal metrics). By changing the model (e.g., using causal fairness, cost-sensitive learning, or continuous decisions), the "impossibility" vanishes. It's an engineering problem, not a moral law.
  *   **The Third Question:** Ontology. Does a theorem about a score imply a fact about justice? Does the origin of the base rate gap (historical injustice) force us to ignore base rates in the model?

  **2. Candidate Points of Agreement:**
  *   The theorems are mathematically valid *within their assumptions*.
  *   Base rate differences are the primary driver of the statistical tension.
  *   Fairness is not a purely statistical property; it requires normative input.
  *   Perfect prediction resolves the tension (but is rarely possible).
  *   Context matters (medical vs. criminal justice).
  *   Neither side advocates for ignoring protected attributes entirely (blindness is not the default solution for either).

  **3. Candidate Cruxes:**
  *   **Realism of Assumptions:** IC says the assumptions (binary decision, fixed base rate) are close enough to reality to be binding. AC says they are too stylized to be binding.
  *   **Concept Drift:** When AC proposes a solution (e.g., "maximize utility subject to constraints"), IC argues this abandons the original moral intuition (e.g., "equal false positive rates"). AC argues the original intuition was poorly formalized.
  *   **Endogeneity:** IC treats base rates as inputs. AC treats base rates as potentially mutable or partly constituted by the decision system itself.

  **4. Verbal Disputes:**
  *   **"Impossibility":** IC means "logical incompatibility of specific statistical criteria." AC hears "it is impossible to be fair."
  *   **"Fairness":** IC often operationalizes this as "satisfaction of a specific parity metric." AC operationalizes this as "just allocation of resources/harm."
  *   **"The Model":** IC treats the score as a passive reflector of risk. AC treats the score as an active intervention in a system.

  **5. Test Cases for Cruxes:**
  *   *For Assumptions:* A pretrial release simulation where we compare fixed-threshold parity vs. cost-sensitive optimization.
  *   *For Concept Drift:* A survey or deliberative poll on whether "equal error rates" or "maximized social welfare" feels fairer when they conflict.

  **6. Structure of the Document:**
  *   Preamble (Joint intent).
  *   Section 1: Agreed Claims (Math vs. World).
  *   Section 2: Residual Disagreements (Position Statements).
  *   Section 3: Cruxes & Pre-registered Tests.
