prompt: |-
  so i've somehow ended up on the board of my housing co-op (40 units, we bought the building in 2019, meetings are 3 hours of chaos) and the newest member is extremely online and keeps pitching futarchy at us -- the Hanson thing where you vote on the outcome you want and then a prediction market tells you which policy actually delivers it, and you just do that. he wants it for the big calls: raise rents to fund the roof, ban short-term rentals, blow the reserve on solar. i'm not against it on principle, i just dont want to be the one who agreed to bet the roof on a market that four people trade in.

  before i take a side at the next meeting i want the actual spec, not the pitch. write me the desiderata for any theory of prediction markets used as a decision device in a governance setting -- what does such a theory have to be able to deliver before i should trust it with a real decision? i want the requirements list: the cases it has to get right, the distinctions it can't collapse, the results it has to be consistent with, each with the consideration behind it. for the cases, use the weird ones i actually care about:

  - our metric (repairs completed, member satisfaction, monthly cost per unit) gets chosen by the board -- i.e. by us -- and we also run the policy the market is predicting. the thing being measured and the thing doing the measuring are the same body.
  - it's a one-off decision. no repeat trials, so no track record, so i can never check whether the market was right. someone suggested a second market on "was the first market's call actually good, in hindsight" and i honestly can't tell if that fixes anything or just moves the problem up a level.
  - the traders would be us -- the same 40 people who are affected and who are also the only ones with any real information. so is the price aggregating dispersed info or just re-reporting what we already all think?
  - a member with strong views can trade to push the price, and if the market is binding then moving the price is how you win, so manipulation becomes the rational play. if it's only advisory the manipulation is cheap but pointless.
  - the metric is one number but the policy helps some members and hurts others, badly and unevenly.

  also tell me which of the requirements are genuine and which are just a camp's prejudice, whether any pair of them can't be jointly satisfied (if so, say so plainly -- that's the part i most want), and which single requirement does the most to knock out the plausible designs. then briefly score futarchy-as-pitched, markets-as-advisory-only, and just letting a citizens assembly or a couple of outside experts decide, against the list.

  please commit. don't lay out both sides and leave me to pick, i have a meeting thursday -- give me your actual position with reasons, and flag where you'd bet against your own list. no reading list, i wont read it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Board member of a 40-unit housing co-op (bought 2019).
      *   **Problem:** Meetings are chaotic (3 hours). A new member is pushing *futarchy* (vote on values, bet on beliefs) for major decisions (rents, roof, solar).
      *   **User's Stance:** Skeptical but open. Worried about thin markets (4 traders), manipulation, and one-off decisions. Wants the *spec*, not the pitch.
      *   **Request:** A list of desiderata (requirements) for a theory of prediction markets in governance. Specific edge cases provided (metric selection, one-off decisions, closed trader pool, manipulation incentives, distributional effects).
      *   **Constraints:** Commit to a position. Don't hedge. Score the options (Futarchy, Advisory Markets, Experts/Assembly). No reading lists. Flag where I'd bet against my own list.
      *   **Tone:** Direct, analytical, pragmatic, slightly cynical (matching the user's "3 hours of chaos" vibe).

  2.  **Deconstruct the Request (The Desiderata):**
      The user wants a "requirements list" for prediction markets in governance, specifically tailored to their weird co-op cases.
      *   *Case 1: Endogenous Metrics.* The board picks the metric *and* runs the policy. Risk: Goodhart's Law on steroids.
      *   *Case 2: One-off Decisions.* No frequency, no calibration. Risk: Noise looks like signal.
      *   *Case 3: Closed Pool.* Traders = Residents = Subjects. Risk: Echo chamber + conflict of interest.
      *   *Case 4: Manipulation.* Binding markets invite sabotage. Advisory markets invite noise.
      *   *Case 5: Distribution.* One number (aggregate) hides winners/losers. Risk: Tyranny of the majority (or the wealthy).

  3.  **Develop the Desiderata (The "Spec"):**
      I need to translate these cases into formal requirements for the *theory* to be valid.
      *   *Requirement 1 (Metric Integrity):* The theory must explain how to prevent the governance body from gaming the metric *after* the market resolves but *before* the outcome is realized. (Addresses Case 1).
      *   *Requirement 2 (Singularity Handling):* The theory must account for non-ergodic decisions where "being right" cannot be verified by frequency. It needs a mechanism for *calibration* without repetition. (Addresses Case 2).
      *   *Requirement 3 (Information vs. Preference Aggregation):* The theory must distinguish between *revealing private info* and *amplifying existing bias* in a closed loop. (Addresses Case 3).
      *   *Requirement 4 (Manipulation Resistance):* The theory must define a cost-of-manipulation floor that exceeds the benefit of swaying the decision *in a binding system*. (Addresses Case 4).
      *   *Requirement 5 (Distributional Blindness):* The theory must explicitly state how it handles Pareto improvements vs. Kaldor-Hicks efficiency. It cannot claim "efficiency" if it immiserates a minority. (Addresses Case 5).

  4.  **Analyze Conflicts & "Camp Prejudices":**
      *   *Genuine vs. Prejudice:*
          *   Genuine: Manipulation resistance in thin markets is a hard math problem.
          *   Prejudice: "Markets are always efficient" (Libertarian camp) vs. "Markets are always gambling" (Traditionalist camp).
      *   *Impossible Pairs:*
          *   *Binding Decision + Thin Market + One-Off.* You can't have all three. If it's binding and one-off, thin markets guarantee manipulation or noise wins.
          *   *Metric Selection + Market Authority.* If the board picks the metric, the market is subordinate. If the market picks the policy to maximize the metric, the board is subordinate. You can't have the board control the metric *and* trust the market to optimize it without gaming.
      *   *The Knockout:* Requirement 4 (Manipulation Resistance in Thin Markets) is the killer. With 40 units, likely <10 active traders, the cost to move the price is trivial compared to the financial stakes of a roof repair.

  5.  **Evaluate the Options:**
      *   *Futarchy (Binding):* Fails on Manipulation (Req 4) and Singularity (Req 2). High risk.
      *   *Advisory Markets:* Fails on Metric Integrity (Req 1) - people ignore it if it contradicts them. Low risk, low reward.
      *   *Experts/Assembly:* Fails on Information Aggregation (Req 3) - misses dispersed info. But handles Distribution (Req 5) better via debate.

  6.  **Formulate the Position:**
      *   *My Verdict:* Don't do binding futarchy. It's mathematically unsound for a 40-unit co-op.
      *   *Why:* The liquidity/manipulation constraint is fatal. The "one-off" nature means you can't learn.
      *   *Compromise:* Use markets as *information gathering* (advisory), but decouple them from the *decision mechanism*. Or, better yet, fix the meeting process first.
      *   *Self-Bet:* I should flag that I might be underestimating the value of the *process* of setting up a market, even if the price is wrong. (Actually, the prompt asks where I'd bet *against* my own list. I'll flag that Req 2 (Singularity) might be too strict; sometimes you just need a tiebreaker).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the chaos. Validate the skepticism.
      *   *The Spec:* List the 5 requirements clearly. Link them to the user's cases.
      *   *The Conflicts:* Highlight the "Impossible Trinity" of Governance Markets (Binding + Thin + One-Off).
      *   *The Scoring:* Be harsh on Futarchy. Be realistic about Experts.
      *   *The Recommendation:* Don't adopt futarchy. Fix the meeting structure. Use polls if needed.
      *   *The "Bet Against My List":* Admit that sometimes "wrong" markets are better than "politicized" arguments, even if the theory says they shouldn't work.

  8.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Be decisive. "Here is the spec." "Here is the verdict."
      *   Ensure the "Impossible Pair" is highlighted clearly as requested.

  9.  **Final Review against Constraints:**
      *   Did I commit? Yes.
      *   Did I use the weird cases? Yes.
      *   Did I flag the impossible pair? Yes.
      *   Did I score the options? Yes.
      *   No reading list? Yes.
      *   Flag where I bet against my list? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "markets are bad." I need to explain *why* the theory fails in this specific context (liquidity/manipulation). The user asked for the *theory's desiderata*, not just practical advice. I need to frame the practical advice as a failure of the theory to meet the desiderata.

      *Refining the "Impossible Pair":* The strongest conflict is between **Binding Authority** and **Thin Liquidity**. In a 40-unit co-op, liquidity is structurally thin. Therefore, Binding Authority must go.

      *Refining the "Bet Against My List":* I will flag that Requirement 2 (Singularity/Calibration) is theoretically sound but practically annoying. Sometimes you *have* to make a one-off decision, and a market price is still better data than a shouty meeting, even if uncalibrated. I'll note that tension.

  10. **Final Polish:** Check word count and clarity. Ensure the distinction between "Vote on Values" and "Bet on Beliefs" is clear in the Futarchy critique. (The user knows this, but keep it sharp).

      *Wait, one more thing:* The user asked "which single requirement does the most to knock out the plausible designs." I need to explicitly name that. It's Requirement 4 (Manipulation Resistance).

      *Okay, ready to write.*
answer: |-
  Here is the spec. I have stripped the ideology and focused on the mechanism. If a theory of governance markets cannot satisfy these five requirements, it is not ready for your roof, your rents, or your reserves.

  ### The Desiderata (The Spec)

  **1. Metric Integrity (The Endogeneity Constraint)**
  *   **Requirement:** The theory must provide a mechanism to prevent the governance body from altering the metric *after* the market opens but *before* the outcome resolves.
  *   **Consideration:** You noted the board chooses the metric (e.g., "member satisfaction") and runs the policy. If the board can redefine "satisfaction" or delay the survey to help a position win, the market price reflects political access, not truth.
  *   **Case:** *Our metric gets chosen by us.* If the board can tweak the measurement, the market is just a bet on how the board will cheat.

  **2. Singularity Calibration (The Frequency Constraint)**
  *   **Requirement:** The theory must explain how to validate accuracy on non-repeatable events without relying on historical track records.
  *   **Consideration:** Prediction markets work via calibration over time (did 70% events happen 70% of the time?). A roof repair is a one-off. You cannot know if the market was "right" until it's too late to undo it. A second-order market ("was the first market right?") creates an infinite regress of hedging, not truth.
  *   **Case:** *It's a one-off decision.* If you can't verify the result, the price is just an opinion with a dollar sign attached.

  **3. Information vs. Preference Separation (The Closed Loop Constraint)**
  *   **Requirement:** The theory must distinguish between price movements driven by *private information* and price movements driven by *changed preferences* or *coordination*.
  *   **Consideration:** In a 40-unit co-op, the traders are the residents. If the price moves, is it because someone knows the roof is worse than we thought (information), or because four friends agreed to bid up "Repair Now" to scare the board (coordination)? In a closed pool, these are indistinguishable.
  *   **Case:** *The traders would be us.* If the pool is closed, the market aggregates bias, not dispersed info.

  **4. Manipulation Resistance (The Cost Constraint)**
  *   **Requirement:** The cost to move the market price to a false position must exceed the potential gain from making the wrong decision.
  *   **Consideration:** In binding futarchy, moving the price *is* how you win. If I can spend $500 to move the "Solar" contract from 40% to 60%, and that triggers a $200k spend that lowers my fees, I have an arbitrage opportunity. In thin markets, manipulation is profitable.
  *   **Case:** *A member with strong views can trade to push the price.* If the market is binding, manipulation is the rational play.

  **5. Distributional Visibility (The Aggregation Constraint)**
  *   **Requirement:** The theory must account for variance in outcomes across participants, not just the aggregate sum.
  *   **Consideration:** Markets optimize for the mean. If a policy helps 30 units $100 and hurts 10 units $1,000, the market says "Yes." Governance requires knowing who loses. A price cannot encode "this bankrupts Unit 4B."
  *   **Case:** *The metric is one number but the policy helps some and hurts others.* Efficiency is not legitimacy.

  ---

  ### The Conflicts & The Knockout

  **Which requirements are genuine vs. prejudice?**
  *   **Genuine:** Metric Integrity and Manipulation Resistance. These are mathematical/game-theoretic constraints. If the incentives aren't aligned, the mechanism breaks.
  *   **Prejudice:** Singularity Calibration. This is a statist/academic prejudice that demands scientific rigor where politics requires action. Sometimes you must act without calibration. However, acting blindly is risky.
  *   **Prejudice:** Distributional Visibility. Market purists argue "side payments" can fix this (winners compensate losers). In a co-op, that's politically impossible. It's a genuine governance constraint, but a market theory prejudice to ignore it.

  **The Impossible Pair**
  You cannot satisfy **Binding Authority** and **Thin Liquidity** simultaneously.
  *   If the market decision is binding (Futarchy), you need deep liquidity to prevent manipulation (Req 4).
  *   You have 40 units. Liquidity will be thin.
  *   Therefore, you cannot have a binding market.
  *   *Plainly:* If the market tells you what to do, four rich members can buy the decision. If you limit trade to prevent that, the price contains no information.

  **The Single Knockout Requirement**
  **Requirement 4 (Manipulation Resistance).**
  This is the killer. In a 40-unit building, the "market cap" of any decision is tiny compared to the financial stakes of the decision itself. The cost to manipulate the price is negligible compared to the value of swaying the roof repair vote. Any design that makes the market binding fails this immediately.

  ---

  ### The Scorecard

  **1. Futarchy (Binding Markets)**
  *   **Score:** **F (Fail)**
  *   **Reason:** Fails Req 4 (Manipulation) and Req 3 (Closed Loop). In your setting, a binding market is not a truth machine; it is a fundraising mechanism for the most confident manipulator. It turns governance into a poker game where the bluff *creates* the reality.
  *   **Verdict:** Do not use. It turns your board meetings from 3 hours of chaos into 3 hours of forensic accounting on who shorted the roof.

  **2. Advisory Markets (Non-Binding)**
  *   **Score:** **C (Passable)**
  *   **Reason:** Passes Req 4 (manipulation is costly but pointless). Fails Req 1 (Board ignores the market if it disagrees).
  *   **Verdict:** Useful only as a temperature check. If the market says "Solar" but the board votes "No," the market price reveals the board is out of step with member belief. But it adds a layer of complexity without decision power.

  **3. Citizens Assembly / Outside Experts**
  *   **Score:** **B (Best Available)**
  *   **Reason:** Passes Req 5 (Distributional Visibility) and Req 1 (Metric Integrity). Fails Req 3 (Information Aggregation) — experts miss ground-level info.
  *   **Verdict:** For a 40-unit co-op, a rotating committee of 3 members + 1 external engineer is superior. They can weigh distributional effects (who can afford the rent hike) which a market price erases.

  ---

  ### My Position

  **Do not adopt futarchy.**

  Your co-op is too small, the decisions are too lumpy (one-off), and the stakes are too high relative to the liquidity. The "newest member" is treating your housing as a sandbox for Hansonian theory. He is correct that markets aggregate information; he is wrong that they aggregate *wisdom* or *legitimacy* in a thin, closed loop.

  **The specific failure mode you will face:**
  Someone will trade heavily on "Ban Short-Term Rentals." The price spikes. The board feels compelled to follow the "market." It turns out the trader was a member who runs an Airbnb business and wanted to signal scarcity to drive up their own rates, or a member who hates guests and was willing to lose $200 to make a point. The market price is now "contaminated," but because it was binding, you have to enact the policy. You have privatized the gain (the trader made their point) and socialized the loss (the co-op made a bad rule).

  **What to do instead:**
  1.  **Kill the binding mechanism.** Tell the board you will support *information markets* only if they are explicitly non-binding.
  2.  **Fix the meeting.** 3 hours of chaos is the real problem. Use a consent agenda. Hire a professional parliamentarian for $500 to run one meeting. The ROI on fixing the process is higher than the ROI on a prediction market.
  3.  **Use the market as a poll.** If the member wants to run a market, let them. But treat the price exactly like a straw poll. "The market says 70% confidence on the roof." Okay, that's data. It doesn't dictate the vote.

  ### Where I Bet Against My Own List

  I am flagging **Requirement 2 (Singularity Calibration)**.

  My spec says you need to validate accuracy. In practice, **you never will.** Even with experts, you won't know if the roof repair was "worth it" for 10 years. I am demanding a standard of proof that no governance method can meet.

  **The Bet:** I would bet that an **Advisory Market** performs better than a **Citizens Assembly** on *technical* estimates (e.g., "What will the solar payback period be?"), even if it fails on *values* (e.g., "Should we do solar?"). The market might aggregate the guys who know roofing better than the committee will.

  **Recommendation:** Use the market to estimate *facts* (costs, timelines, technical outcomes). Use the board/vote to decide *values* (fairness, risk tolerance, who pays). Do not let the market decide the values. That is the futarchy trap.
