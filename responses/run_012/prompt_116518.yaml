      *   This separates the weight of History vs. Structure.

  8.  **Refining the Output:**
      *   *Verdict:* Own.
      *   *Rules:*
          1.  *Pure History:* Direct manipulation negates ownership.
          2.  *Pure Structure:* Endorsement/Control secures ownership.
          3.  *Hybrid (Most Likely):* Direct manipulation negates ownership *only if* accompanied by alienation or compulsion.
