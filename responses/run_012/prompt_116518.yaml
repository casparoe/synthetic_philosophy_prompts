      *   *Separating Case:* A man whose ambitions were installed by a surgeon. He *deplores* them (Alienated). But he has *control* (could resist, but doesn't).
      *   *Historical Blocker:* Not Own.
      *   *Structural/Hybrid:* Own (Because no compulsion).
