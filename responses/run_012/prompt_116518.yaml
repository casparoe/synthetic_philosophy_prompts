      *   *Evaluating the Rules against Data:*
          *   Rule 1 fits 1, 3. Fits 2? No (2 lacked control). Fits 4? No (4 lacked control).
          *   Rule 2 fits 1. Fits 3? No (3 deplores). So Endorsement isn't necessary.
          *   Rule 3 fits 2, 4. Fails 1 (Normal history). Fails 3 (Upbringing is causal history). But does "Surgeon" count as distinct from "Upbringing"? Yes. But Rule 3 predicts "Not Own" for Target.
