      *   *However*, the colleague *makes* the distinctions. She must be treating "Deed is Agent's Own" as a *compatibilist* notion (attributability) distinct from *Ultimate Responsibility*.
      *   She needs to say: "The Basic Argument kills UR. It does not kill *agency* or *attributability*." She is likely a *sceptic about blame* but a *realist about psychology*.
      *   If she wants to keep the distinction, she must argue that "Ownership" is about the *structure of the will* (mesh between first and second order desires, or reasons-responsiveness), not about the *metaphysical origin*.
      *   If the Basic Argument flattens it, she would have to admit that Case 1 is just as "Not His" as Case 2, ultimately. To keep the distinction, she must retreat to a pragmatic or psychological definition of "Own," conceding it doesn't ground *desert*.

