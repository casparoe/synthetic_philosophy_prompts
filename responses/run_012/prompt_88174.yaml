answer: |-
  Here is a defended agenda for your steering committee, ranked by failure mode, grounded in your constraints (one year, modest budget, infrastructure question) and your criteria (upstreamness, tractability, locus of failure, outcome impact).

  ### I. Historical Diagnosis: Mapping Episodes to Failures

  You are correct to be skeptical of the monolithic "Athens failed" narrative. The three episodes diagnose distinct pathologies. Your design must not treat them as interchangeable warnings.

  1.  **Mytilene (427 BCE):** This is evidence for **Lesson 7 (Boundary of Demos)** and **Lesson 1 (Impulsivity).**
      *   *Diagnosis:* The assembly voted on the fate of a subject ally without Mytilenean representation. The emotional distance allowed for extreme violence; the physical distance allowed for a lack of immediate feedback. The reversal the next day proves the *first* vote was impulsive, but the *mechanism* for reversal existed.
      *   *Relevance to you:* Low on impulsivity (you have a referendum safety valve), but high on boundary. If your sortition is city-wide but the bridge closures disproportionately affect specific corridors or neighboring municipalities, you have a Mytilene problem.

  2.  **Sicilian Expedition (415–413 BCE):** This is evidence for **Lesson 6 (Distance/Feedback)** and **Lesson 3 (Amateurism).**
      *   *Diagnosis:* This was not a snap decision; it was debated. The failure was informational asymmetry. The assembly believed they were authorizing a modest reinforcement; Alcibiades and others framed it as an easy victory. They lacked the technical knowledge to assess the logistics (naval capacity, distance, enemy strength).
      *   *Relevance to you:* **Critical.** River crossings are a logistical/technical coordination problem, not primarily a moral one. The risk is not that citizens will be "cruel," but that they will choose a closure order that creates gridlock they cannot model. This is informational distance, not just geographic.

  3.  **Socrates (399 BCE):** This is evidence for **Lesson 4 (Entrenched Law)** and **Lesson 2 (Rhetoric).**
      *   *Diagnosis:* The democracy violated its own amnesty norms. However, as you noted, Socrates' own tenure on the *prytany* (presiding committee) shows that *procedural dissent* within the rules can check illegality. The failure was not the absence of a court, but the willingness of the presiding officers to uphold procedure against the mood of the room.
      *   *Relevance to you:* Medium. You cannot build judicial review into a citizens' assembly (Lesson 4 is low tractability). But you can design the *facilitation* to empower procedural dissent (Lesson 2).

  ### II. The Ranking: A Defended Agenda

  I have ranked the seven lessons based on **Upstreamness** (does fixing this prevent downstream errors?), **Tractability** (can you do this in one year with modest budget?), and **Outcome Impact** (will this change the recommendation?).

  **1. Lesson 3: Amateurism (Weight Expert Input)**
  *   **Rank:** #1 (Priority)
  *   **Why:** For an infrastructure question, "amateurism" is the primary risk. Citizens cannot intuit traffic flow, emergency service access, or economic impact. Unlike moral questions (e.g., "should we have a universal basic income"), bridge closures have objective failure states (gridlock, economic loss).
  *   **Tractability:** High. You can budget for independent traffic consultants.
  *   **Upstreamness:** Maximum. If they misunderstand the constraints, the deliberation is theater.

  **2. Lesson 6: Distance and Feedback (Restrict to Observable Consequences)**
  *   **Rank:** #2
  *   **Why:** In Athens, "distance" meant Sicily. In your city, "distance" means *second-order effects*. A resident near Bridge A doesn't feel the impact of closing Bridge B. This creates a "concentrated benefits, diffuse costs" problem.
  *   **Tractability:** Medium. You cannot restrict the franchise (sortition is likely statutory), but you can restrict the *testimony* to ensure localized impacts are visualized.
  *   **Upstreamness:** High. Prevents the "Sicilian" error of underestimating systemic drag.

  **3. Lesson 2: Rhetoric (Structure Speech)**
  *   **Rank:** #3
  *   **Why:** In a 100-person room, loud voices dominate. However, do not interpret this as "censorship." Interpret it as "facilitation design."
  *   **Tractability:** High. This is your facilitator's job.
  *   **Upstreamness:** Medium. Bad process leads to bad buy-in, but good data can survive bad process if structured well.

  **4. Lesson 7: Boundary of Demos (Widen Franchise)**
  *   **Rank:** #4
  *   **Why:** Ideally, commuters and neighboring towns should vote. Practically, you likely cannot change the sortition pool this late.
  *   **Tractability:** Low. Changing the demographic makeup of the assembly now looks like gerrymandering.
  *   **Mitigation:** Treat this via Lesson 3 (experts represent the commuters' data) and Lesson 2 (structured testimony from affected non-members).

  **5. Lesson 1: Impulsivity (Delay and Revote)**
  *   **Rank:** #5
  *   **Why:** **Overrated for your context.** The standard Athenian lesson is "people are rash." But your output goes to a *binding referendum*. The referendum *is* the delay and the revote. Building internal cooling-off periods into four weekends wastes precious deliberation time.
  *   **Tractability:** Low. You only have four weekends.
  *   **Outcome Impact:** Low. The public referendum provides the check.

  **6. Lesson 4: Entrenched Law (Judicial Review)**
  *   **Rank:** #6
  *   **Why:** **Low Tractability.** You are a steering committee, not the City Council. You cannot bind the referendum to judicial review or supermajority thresholds without new legislation.
  *   **Outcome Impact:** Low. This is a legal constraint, not a design feature.

  **7. Lesson 5: Cost-Bearing (Align Power/Cost)**
  *   **Rank:** #7
  *   **Why:** **Irrelevant.** You cannot make citizens pay for the bridges directly based on their vote. This is a structural feature of representative democracy, not a design flaw of the assembly.
  *   **Outcome Impact:** None.

  ### III. The Single Feature: Adversarial Expertise

  If you have one shot at council approval, spend your political capital and budget on **Competing Technical Scenarios (Red Team/Blue Team Expertise).**

  Do not hire one neutral traffic consultant. Neutral experts often present a "single truth" that the assembly feels unable to question (recreating the expert/amateur hierarchy). Instead, hire two independent firms to model the closure orders.
  *   **Firm A** models the Council's preferred closure order.
  *   **Firm B** models the alternative closure order.
  *   **Requirement:** Both must testify to the assembly, answer cross-examination, and agree on a "statement of undisputed facts" before deliberation begins.

  **Why this wins:**
  1.  **Solves Amateurism (Lesson 3):** It gives citizens the technical capacity to judge without needing to become engineers.
  2.  **Solves Distance (Lesson 6):** It makes the invisible consequences (traffic diversion) visible and contested.
  3.  **Solves Rhetoric (Lesson 2):** It structures the debate around data, not charisma.
  4.  **Council Proof:** When the Council sees the design, they cannot claim the citizens were "misled." They were armed with the same data the Council uses. This protects *you* from the Council rejecting the design as naive.

  ### IV. Critique of Overrated Lessons

  *   **Lesson 1 (Impulsivity) is overrated here.** The Mytilene reversal is cited to prove people change their minds. But in a modern context with a referendum, "changing minds" is a feature of the electorate, not a bug of the assembly. Your assembly's job is not to be the final brake; it is to be the *proposer*. Prioritizing internal delay mechanisms reduces the time available for the hard work of understanding the traffic models.
  *   **Lesson 4 (Entrenched Law) is a category error.** The Socrates trial is often used to argue for constitutional courts. But Socrates' own defense of procedure (*graphe paranomon*) shows that the *internal* rules of the assembly mattered more than external review. You cannot build a court, but you can build a robust *rulebook* for the assembly (e.g., a guardian of procedure who can halt voting if rules are violated). This is more tractable than judicial review.

  ### V. Evidence to Watch (The Feedback Loop)

  Over the next year, monitor these three metrics to adjust your ranking:

  1.  **Pre/Post Technical Literacy Surveys:** If citizens cannot correctly answer basic questions about traffic flow after the expert testimony, **Lesson 3 (Amateurism)** moves up. You may need to simplify the options (e.g., reduce from 3 closure orders to 2).
  2.  **Demographic Discrepancy in Testimony:** If 80% of public testimony comes from residents of one neighborhood, **Lesson 7 (Boundary)** moves up. You will need to actively recruit affected commuters for witness panels, even if they aren't assembly members.
  3.  **Council Signaling:** If the Council starts hinting they will ignore the recommendation if it costs too much, **Lesson 5 (Cost-Bearing)** moves up. You may need to include a budget constraint in the assembly's mandate that was not originally there.

  **Summary:** Ignore the "mob rule" fear (Lesson 1); the referendum handles that. Fear the "ignorant rule" fear (Lesson 3/6). Your design must assume the citizens are *rational but uninformed*. Spend your one shot on making the invisible consequences of the bridge closures visible through adversarial expertise. That is the only way to avoid a modern Sicilian Expedition.
