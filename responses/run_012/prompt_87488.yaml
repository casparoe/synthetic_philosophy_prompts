prompt: |-
  I've just started as a grad on the cat risk desk at a reinsurer and I've realised I don't actually understand what my own firm thinks a probability is. Maybe you can help me work it out.

  Here's what happens. We price flood cover off a catastrophe model that spits out a "1-in-100 year" loss figure for each site, and everyone here talks about it as a fact about the world — the client is in a 1-in-100 zone, full stop. But the number comes from simulating tens of thousands of synthetic years in a computer, and there's alot of judgement in it, and it gets revised every time the vendor updates the model or we get another bad winter, and the climate is shifting the distribution underneath it anyway, so what exactly is it a frequency *of*? Then last month we wrote a big line on a risk with no loss history at all (I'd rather not say what), and the actuaries ran a "structured expert elicitation" — asked six people for their 10th, 50th and 90th percentiles, pooled them somehow — and that number went into the same spreadsheet, in the same cell type, and is now used for pricing and for the capital we report to the regulator, who wants us to hold enough to survive a 1-in-200 year loss. Meanwhile there's a standing instruction from the head of underwriting that we must never write "there is a 1 per cent chance of flooding at your site next year" in a client email, because "it either floods or it doesn't" — but we're allowed to say "1-in-100 year event" in the same email, and we do, constantly.

  So: what theory of probability does this practice actually presuppose? Reconstruct it for me. I want to know which bits are frequentist, which are subjectivist, which look like a propensity view (that there's a real chance out there in the world and the model is trying to read it off), and which bits don't commit us to anything in particular. Is the whole thing actually inconsistent, or is there a reading — calibrated credences, or "the model is just our best guess and the numbers are shorthand" — under which it hangs together? Is the "1-in-100" talk even intelligible if the underlying process isn't stationary? Does the reference class problem do real damage here, given we're applying a model fitted on one population to one particular site? And tell me what would have to change if we took either horn seriously: a thoroughgoing frequency view (only write business with a long, stable loss history?) or a thoroughgoing subjective view (whose credences? does the pooled elicitation number have any claim to being *the* number, and if not, what are we reporting to the regulator?). Don't give me a reading list — I just want the implicit theory laid out, with a verdict on which parts of it the practice genuinely needs and which parts it could drop without anything changing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Grad on a Cat (Catastrophe) Risk desk at a Reinsurer. Smart, technically literate, skeptical, philosophical bent. They see the contradictions in their daily work.
      *   **Core Question:** What theory of probability does my firm *actually* use? (Reconstruct the implicit theory).
      *   **Specific Tensions Identified:**
          *   Cat models (synthetic years, frequentist language "1-in-100") vs. Reality (non-stationary climate, model updates, judgment).
          *   Expert Elicitation (subjective credences) vs. Regulatory Capital (treated as objective facts).
          *   Communication Ban (no "1% chance" to clients) vs. Standard Practice ("1-in-100 year event" allowed).
          *   Reference Class Problem (population model vs. specific site).
          *   Non-stationarity (climate change).
      *   **Constraints:** No reading list. Lay out the implicit theory. Verdict on consistency. What parts are needed vs. dispensable. What if we took Frequentism or Subjectivism seriously?

  2.  **Deconstruct the Practice (The "Phenomenology" of Cat Risk):**
      *   *Cat Models:* They simulate synthetic years. This *looks* frequentist (long-run frequency). But the parameters are calibrated on limited history + physics + judgment. The output is treated as a "physical property" of the site (Propensity).
      *   *Expert Elicitation:* Pure Subjectivism (Bayesian credences). But the output is pooled and treated as an objective input for Solvency II/Regulatory capital (which demands a Frequentist-style "1-in-200" solvency standard).
      *   *Communication:* "1% chance" is banned (implies uncertainty about a single event, highlights Subjectivism). "1-in-100 year" is allowed (implies a return period, sounds like a physical property/Propensity or Frequentist long-run average).
      *   *Regulatory Capital:* Requires a specific quantile (1-in-200). This demands a coherent probability distribution, regardless of how it was derived.

  3.  **Identify the Implicit Theory:**
      *   It's not pure Frequentism (too much judgment, no long-run data for many risks).
      *   It's not pure Subjectivism (treated as objective fact for regulation/pricing).
      *   It's not pure Propensity (climate change breaks stationarity, models are updated).
      *   *Diagnosis:* It's **Operational Pragmatism** disguised as **Epistemic Objectivity**. It's a *hybrid* that shifts masks depending on the audience (Regulator vs. Client vs. Internal Model).
      *   *Philosophical Label:* **Imprecise Probability / Robust Bayesianism** (though they don't call it that) mixed with **Institutional Fiction**.
      *   *Better Label:* **Calibrated Credence with Institutional Reification.** The numbers are subjective degrees of belief *calibrated* to look like frequencies for the sake of capital algebra and contract language.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. Validate that yes, it is inconsistent *philosophically*, but consistent *functionally*.
      *   **The Three Masks (The Implicit Theory):**
          1.  *For the Model (The Engine):* **Synthetic Frequentism.** We pretend the synthetic years are real time to get a distribution.
          2.  *For the Regulator/Capital (The Constraint):* **Reified Propensity.** We treat the output as a physical property of the portfolio to justify capital holdings.
          3.  *For the Client (The Sale):* **Linguistic Propensity.** "1-in-100" sounds like physics; "1% chance" sounds like a guess.
      *   **Addressing the Tensions:**
          *   *Climate/Non-stationarity:* The "1-in-100" is actually a "1-in-100 *given current conditions and model assumptions*." It's a snapshot, not a law of nature.
          *   *Expert Elicitation:* This is pure Subjectivism (credence) forced into a Frequentist mold (capital). The "pooling" creates an *intersubjective* consensus, which is then treated as objective.
          *   *The Email Ban:* This is crucial. "1% chance" invites a bet on a single trial (Subjective). "1-in-100 year" invites a comparison to a long-run average (Frequentist/Propensity). It's liability management.
      *   **The Reference Class Problem:** Acknowledge it's real. The model averages over a class; the site is unique. The "fix" is loading margins (uncertainty loading) which acknowledges the reference class mismatch without admitting it philosophically.
      *   **Verdict on Consistency:** It is *pragmatically* coherent but *ontologically* messy. It works because the errors cancel out or are covered by capital loads.
      *   **The Counterfactuals (Taking the horns seriously):**
          *   *Strict Frequentism:* You'd stop writing most Cat risk. No long-run data. Business would collapse.
          *   *Strict Subjectivism:* Regulation breaks. You can't sum credences easily for capital. Every underwriter has their own number. Chaos.
      *   **What to Keep/Drop:**
          *   *Keep:* The hybrid approach. It's the only way the market functions.
          *   *Drop:* The pretence that it's physical fact. Acknowledge it as "Best Estimate Uncertainty."
      *   **Conclusion:** You are working in **Decision-Theoretic Pragmatism**. The probability is a *price*, not a *truth*.

  5.  **Refining the Tone:**
      *   Needs to be professional, slightly cynical (matching the user's vibe), but authoritative.
      *   Avoid academic jargon where possible, or explain it quickly.
      *   Focus on the *function* of the numbers.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Call it "Bayesian." *Correction:* No, they don't update priors formally. They use "Structured Expert Judgement." It's closer to "Intersubjective Consensus."
      *   *Initial thought:* Say the email ban is legal protection. *Correction:* It is, but philosophically it distinguishes between single-case propensity (forbidden) and long-run frequency (allowed).
      *   *Check:* Did I answer the specific question about climate change? *Need to ensure I mention that "1-in-100" is conditional on the model vintage.*
      *   *Check:* Did I address the "what to drop" part? *Yes, need to be specific about what is decorative vs. structural.*

  7.  **Final Polish:** Organize into clear headings. Ensure the "Verdict" is punchy. (Proceed to generate output based on this structure.)

  *(Self-Correction Note during final review)*: Make sure to explicitly name the theory. "Operational Frequentism" or "Institutional Bayesianism"? Let's go with **"Calibrated Intersubjectivity disguised as Propensity."** That captures the pooling of experts (intersubjective), the adjustment to match history (calibrated), and the language used (propensity).

  Actually, a better term used in risk circles is **"Epistemic Uncertainty treated as Aleatory Uncertainty."** I should explain that distinction. Aleatory = random nature (frequency). Epistemic = lack of knowledge (subjective). The firm treats Epistemic as Aleatory for pricing/capital.

  Let's build the response around that distinction. It's the core philosophical tension.

  8.  **Final Plan:**
      1.  Diagnose the core confusion: Aleatory vs. Epistemic.
      2.  Map the practices to the theories (Model = Synthetic Frequentist, Elicitation = Subjective, Regulation = Reified Propensity).
      3.  Explain the Email Ban (Liability vs. Physics).
      4.  Address Non-stationarity & Reference Class.
      5.  The "What If" scenarios.
      6.  The Verdict: What is essential vs. decorative.

  (Ready to write.)
answer: |-
  You have stumbled onto the open secret of the entire insurance industry. You are asking for the ontology of your spreadsheet, and the honest answer is that your firm operates on a **hybrid theory of probability that is ontologically inconsistent but pragmatically necessary.**

  Philosophically, you are conflating **Aleatory Uncertainty** (randomness inherent in the world, e.g., quantum decay, coin flips) with **Epistemic Uncertainty** (lack of knowledge, e.g., whether a specific dike will hold).

  Your firm's practice treats Epistemic Uncertainty *as if* it were Aleatory Uncertainty. This is not an accident; it is the business model. Here is the reconstruction of the implicit theory you are working under, broken down by function.

  ### 1. The Implicit Theory: "Calibrated Intersubjectivity Disguised as Propensity"

  Your firm does not hold one theory of probability. It holds three, switched depending on the audience.

  **A. For the Catastrophe Model (The Engine): *Synthetic Frequentism***
  *   **The Practice:** You run 100,000 synthetic years. You count the losses. You derive a frequency.
  *   **The Theory:** This pretends to be Frequentist. It claims that if we waited 100,000 years, this is the rate at which floods would occur.
  *   **The Reality:** It is actually **Propensity** masked as Frequency. The model encodes physical assumptions (river depth, topography, storm tracks). The "frequency" is derived from the physics, not observed history. Because the climate is non-stationary, the "long run" does not exist. The model output is actually a statement about the *current physical state of the system*, projected forward.
  *   **Why you keep it:** You need a distribution to integrate over. You cannot price or capitalise a single number; you need a curve. Synthetic years provide the mathematical scaffolding for integration.

  **B. For the Expert Elicitation (The Gap-Filler): *Intersubjective Bayesianism***
  *   **The Practice:** Six experts give percentiles. You pool them.
  *   **The Theory:** This is pure Subjectivism (credence). It admits there is no data, only opinion.
  *   **The Reality:** By pooling and "structuring" the elicitation, you convert *Subjective Credence* into *Intersubjective Consensus*. Once pooled, the number loses its "owner." It is no longer "John's guess"; it is "The Desk's View."
  *   **Why you keep it:** You have to write business where data doesn't exist. Without this, you would have to decline risk.

  **C. For the Regulator and Price (The Output): *Reified Propensity***
  *   **The Practice:** You report a 1-in-200 capital number. You price off a 1-in-100 loss cost.
  *   **The Theory:** This treats the probability as a **Physical Property** of the risk (Propensity). It implies the risk *has* a 1-in-200 capital requirement, just as it *has* a weight or a location.
  *   **The Reality:** This is an **Institutional Fiction.** Regulators (Solvency II, etc.) require a quantile of a loss distribution. They do not care how you got it (Frequency vs. Credence); they care that it is a number they can audit. By reifying the number, you make it actionable.
  *   **Why you keep it:** Capital algebra requires commensurable units. You cannot add "John's Credence" to "Model Frequency." You must convert both into "Equivalent Annual Loss Probability" to sum them into a portfolio view.

  ### 2. The Email Ban: Why "1% Chance" is Forbidden but "1-in-100" is Allowed

  This is the clearest window into your firm's philosophical anxiety.

  *   **"There is a 1% chance of flooding next year":** This is a statement about a **single trial**. In probability theory, this is a subjective degree of belief (Bayesian). If you say this, you admit the number is about *your knowledge*, not the *world*. If the flood happens, the client can say, "You said only 1%!" If it doesn't, they say, "You charged me for a risk that didn't exist." It highlights the Epistemic nature of the risk.
  *   **"This is a 1-in-100 year event":** This is a statement about a **return period**. It sounds like a physical property of the site (Propensity) or a long-run average (Frequentist). It distances the firm from the specific outcome. It implies, "Over a long time, this water level is reached this often." It shifts the frame from *prediction* to *classification*.
  *   **The Verdict:** The ban is liability management. It prevents the probability from being interpreted as a warranty. It forces the client to view the risk as a physical hazard they are assuming, rather than a prediction you are making.

  ### 3. The Non-Stationarity and Reference Class Problems

  You asked if the "1-in-100" talk is intelligible if the process isn't stationary (climate change).

  *   **Strictly speaking:** No. A 1-in-100 year event implies a stationary distribution. If the climate shifts, the probability changes every year.
  *   **Practically speaking:** The number is a **snapshot**. It means "1-in-100 *given the climate and model vintage as of today*." Your firm handles this by updating models (vintage risk) and applying "Climate Change Loadings" (factors that increase the loss cost).
  *   **The Reference Class:** You are applying a model fitted on a population to a specific site. This is the classic Reference Class Problem. Your firm solves this with **Uncertainty Loading**. You don't admit the reference class is wrong; instead, you add margin (e.g., "Technical Price" + "Uncertainty Load"). This load is the monetary value of the philosophical error.

  ### 4. Counterfactuals: What if you took the horns seriously?

  **Horn A: Thoroughgoing Frequentism**
  *   **Requirement:** You only write risks with long, stable loss histories. You reject all modelled risks (since they are synthetic). You reject all expert elicitation (since it is opinion).
  *   **Result:** Your firm writes almost no catastrophe risk. You might write some auto or property in stable zones with 50+ years of data. Reinsurance as an asset class collapses because the point of reinsurance is to cover the *unobserved* tail.
  *   **Verdict:** Business suicide.

  **Horn B: Thoroughgoing Subjectivism**
  *   **Requirement:** You admit all numbers are credences. You report to the regulator: "Our Head Actuary is 95% confident we won't go bust." You allow every underwriter to use their own priors.
  *   **Result:** Regulatory capital becomes impossible to standardise. You cannot aggregate risk easily (summing credences is mathematically fraught without coherence constraints). Clients cannot compare quotes (is Underwriter A's 1-in-100 the same as Underwriter B's?).
  *   **Verdict:** Regulatory and Market chaos.

  ### 5. The Verdict: What to Keep and What to Drop

  Your practice is not "wrong"; it is **Decision-Theoretic Pragmatism**. You are not trying to describe the world (Truth); you are trying to allocate capital and price contracts (Utility).

  **What is Essential (Keep this):**
  1.  **The Hybrid Number:** You *must* convert Epistemic uncertainty (what we don't know) into Aleatory terms (frequency distributions) to do the math. You cannot run a capital model on "vibes." You need a distribution to integrate.
  2.  **The Intersubjective Pooling:** Expert elicitation *must* be pooled. Individual credence is too noisy for institutional capital. The "consensus number" is a governance tool, not a truth claim.
  3.  **The "1-in-100" Language:** It is a necessary shorthand for "Expected Loss at this exceedance probability." It allows for contract standardisation.

  **What is Decorative (Drop the pretence):**
  1.  **The Claim of Objectivity:** Stop telling yourself the model output is a "fact about the world." It is a **conditional assertion**: "If our physics are right, and the climate is stationary, and the data is clean, then..."
  2.  **The Stationarity Assumption:** Acknowledge explicitly that the 1-in-100 is a moving target. The "Climate Load" isn't an add-on; it's an admission that the base frequency is obsolete.
  3.  **The Distinction between Model and Elicitation:** In your spreadsheet, they are in the same cell. Philosophically, they are different. Practically, treat them the same *after* uncertainty loading. The loading should be higher for the elicitation, but the *type* of probability is the same: **Calibrated Credence.**

  ### Summary Reconstruction

  Your firm operates on a theory of **Institutional Probability**.

  Probability, in your desk, is not a property of the world (Frequentist/Propensity) nor a property of the mind (Subjectivist). It is a **property of the institution's commitment.**

  When you write "1-in-100," you are not saying "Nature flips a coin." You are saying: *"Our institution is willing to commit capital and reputation as if this event occurs with this frequency, based on the best synthesis of physics, history, and expert opinion available today."*

  The inconsistency you feel is the friction between the **mathematics of risk** (which requires stable distributions) and the **reality of uncertainty** (which is shifting and unique). Your firm bridges this gap with language ("1-in-100 year"), process (elicitation), and margin (capital loads).

  **Advice:** Do not try to resolve the philosophy. It will paralyse you. Instead, master the **translation**. Your job is to manage the gap between the Epistemic reality (we don't know) and the Aleatory requirement (we must price). The "probability" is the exchange rate between the two.
