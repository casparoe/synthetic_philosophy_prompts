answer: |-
  # SEMINAR HANDOUT: CONDORCET UNBOUND
  **Topic:** Projecting the Marquis de Condorcet (1743–1794) into the Algorithmic Age
  **Course:** Social Epistemology 405
  **Date:** October 2023

  ## PREFACE: THE MAN BEHIND THE THEOREM
  We all know the *Jury Theorem*. We know the math: if individual competence $p > 0.5$ and votes are independent, the majority probability approaches 1 as group size $n \to \infty$. But Condorcet was not merely a mathematician; he was a revolutionary politician and a moral philosopher. He believed the calculus of probabilities was the only rational foundation for ethics and governance. He argued for universal suffrage (including women), universal public education, and the abolition of hereditary privilege. He believed truth was objective and discoverable, and that the primary function of social institutions was to aggregate individual judgments without distorting them.

  This handout does not ask what Condorcet *said*. It asks what his premises *commit* him to. We are applying his axioms of "moral arithmetic" to four modern epistemic structures he could not have conceived. Where the inference is strained, it will be noted. Where his principles collide, the conflict will be made explicit.

  ---

  ## CASE 1: THE LLM JURY
  **Scenario:** A public broadcaster replaces a panel of three human experts with forty Large Language Models (LLMs). Each model is prompted with the same factual question. The broadcaster reports the majority answer.

  **Condorcet's Verdict:** **A Parody of the Theorem.**

  **The Argument:**
  Condorcet would initially be seduced by the numbers. Moving from $n=3$ to $n=40$ fits his intuition that volume dilutes individual error. However, his theorem rests on a rigid axiom: **independence of errors**. Condorcet assumed that voters reason from their own observation and conscience. He feared "factions" because they correlate votes, turning many voters into one.

  Forty LLMs trained on overlapping corpora do not constitute forty independent voters; they constitute one voter with forty mouths. If the training data contains a systemic bias (a shared error), the probability of the majority being wrong does not decrease as $n$ increases; it remains fixed at the probability of the systemic error. Condorcet would view this as a violation of the theorem's boundary conditions. He would not see this as "wisdom of the crowds" but as "amplification of the archive."

  **The Strain:**
  Condorcet equated "voters" with moral agents capable of judgment. Applying "competence" ($p$) to a stochastic parrot is a category error he would likely reject. However, if we treat the models as *information processors*, his critique holds: without architectural or data independence, the aggregation is mathematically void.

  ---

  ## CASE 2: ALGORITHMIC CORRELATION
  **Scenario:** A country where citizens are individually well-informed (high $p$), but nearly all news is filtered through the same two recommendation algorithms. Consequently, when errors occur, they are correlated across the population.

  **Condorcet's Verdict:** **Epistemic Tyranny.**

  **The Argument:**
  This is Condorcet's specific nightmare. In his *Essay on the Application of Analysis to the Probability of Majority Decisions* (1785), he worries less about individual ignorance than about shared delusion. He understands that the theorem is not about *people*; it is about *error structures*. If errors are scattered (random), they cancel out. If errors are correlated (systemic), they sum up.

  In this scenario, the recommendation systems act as a "super-faction." Even if $p > 0.5$ on average, the effective $n$ (independent voices) is nearly zero. Condorcet would argue that democracy has technically occurred (people voted), but epistemically, it has failed. The "General Will" has been hijacked by the code. He would demand the breakup of these information monopolies not on antitrust grounds, but on *epistemic* grounds. To save the theorem, you must save the independence of the voter.

  **The Strain:**
  Condorcet assumed physical separation and print media ensured independence. He did not anticipate a centralized digital infrastructure that could psychologically synchronize millions without explicit coercion. He would be forced to admit that "freedom of the press" is insufficient if the *distribution* mechanism is singular.

  ---

  ## CASE 3: THE CITIZENS' ASSEMBLY
  **Scenario:** A body of citizens picked by lot (sortition), given three weekends of expert briefings, whose recommendation is then made binding on the legislature.

  **Condorcet's Verdict:** **Cautious Endorsement (Conditional on Education).**

  **The Argument:**
  Condorcet was a republican, not a direct democrat in the Athenian sense, but he deeply distrusted representative bodies that became oligarchies. He would like the sortition (breaking elite capture) and the briefings (raising $p$). His entire political project was built on **universal education** to ensure $p > 0.5$. The briefings act as a temporary, intensive substitute for the public education system he dreamed of.

  However, he would clash with the "binding" nature if he felt the timeframe (three weekends) was insufficient to raise competence above the threshold. Condorcet believed in the *perfectibility* of man, but not his instantaneous enlightenment. If the briefings are neutral, he supports the Assembly as a check on corrupt representatives. If the briefings are manipulated, he views the Assembly as a tool of demagoguery. He would likely prefer the Assembly's output to be advisory *unless* the education component is guaranteed and transparent.

  **The Strain:**
  Condorcet favored representative democracy with imperative mandates, not necessarily sortition. He believed representatives should be more educated than the average. He might view a random sample as too risky compared to elected officials who (theoretically) earn their place through merit. His enthusiasm for "numbers" usually referred to the electorate, not the decision-making body.

  ---

  ## CASE 4: PREDICTION MARKETS
  **Scenario:** A market where traders bet on outcomes. The price aggregates information, but a handful of very confident, wealthy traders can move the price significantly.

  **Condorcet's Verdict:** **Epistemically Useful, Politically Repugnant.**

  **The Argument:**
  Condorcet would recognize the market price as an aggregation of private information, similar to a vote count. He would appreciate that the price moves toward the truth as information is revealed. However, his political axiom is **One Person, One Vote**. Prediction markets operate on **One Dollar, One Vote**.

  To Condorcet, allowing wealth to weight judgment is a return to aristocracy. If a wealthy trader moves the price based on confidence rather than accuracy, they are distorting the "moral arithmetic." He would argue that while the market might find the truth *faster*, it illegitimately empowers the rich to define reality for the poor. He would accept prediction markets as a *consultative* tool for experts but reject them as a *decision* mechanism for the public. Truth cannot be bought; it must be counted.

  **The Strain:**
  Condorcet was a technocrat at heart; he loved expertise. He might be tempted by the efficiency of markets. But his revolutionary commitment to equality overrides his love of efficiency. He would likely struggle to reconcile the market's speed with the voter's equality.

  ---

  ## CONCLUSION: THE BAFFLING FEATURE
  **What would baffle Condorcet most?**

  It is not the speed of communication, nor the volume of data. Condorcet expected progress to be rapid.

  **It is the Industrialization of Doubt.**

  Condorcet's *Esquisse d'un tableau historique des progrès de l'esprit humain* (1795) posits a linear trajectory: as knowledge spreads, superstition and error naturally recede. He believed truth had a natural advantage over falsehood when exposed to the light of reason. He could not conceive of a political economy where the primary industry is the *manufacture of uncertainty*.

  In our world, bad actors do not just hide the truth; they flood the zone with plausible falsehoods to lower the collective $p$ below 0.5 intentionally. Condorcet assumed that if you educated people, they would vote correctly. He did not anticipate an adversary who uses education's tools (media, data, rhetoric) specifically to decouple belief from truth. He would find the idea that "more information" could lead to "less knowledge" logically incoherent. This is the one place his optimism breaks: he could not model an enemy whose goal is not to win the argument, but to destroy the arena of argumentation itself.

  **Discussion Question:** If Condorcet's optimism relies on the natural convergence of reason, is social epistemology possible in an environment designed to prevent convergence?
