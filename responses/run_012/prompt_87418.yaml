      *   Internal coherence? Yes.
      *   Coexistence contradiction? Yes.
      *   Ledger reform assessed? Yes.
      *   Strict control vs. risk-spreading alternatives? Yes.
      *   Distinguish presupposition vs. fit vs. open? Yes.
      *   No citations? Yes.

      *(Self-Correction on the Ledger)*: The prompt asks: "Does it commit us to the view that an opportunity to intervene, rather than actual causal contribution, is the ground of answerability?" Yes, that is the key philosophical shift. I need to make sure that's clear.

      *(Self-Correction on Coexistence)*: Is it underdetermined? Yes. MHC can be justified by Control theories (idealized) or Role theories (pragmatic). No-Fault bypasses the need to decide.

