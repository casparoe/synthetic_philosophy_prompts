  7.  **Refining the Philosophy (Self-Correction during drafting):**

      *   *Caution:* Don't just say "it's broken." The prompt asks for the *implicit philosophy*. The philosophy is that **Accountability is a structural slot, not a psychological state.**
      *   *Nuance:* The prompt asks if MHC presupposes control OR role. I need to take a stand. Given the description (seconds, bias, unusable veto), the *practice* presupposes Role, even if the *rhetoric* claims Control. I must highlight this divergence.
      *   *Ledger:* If liability attaches to the person with "genuine opportunity," does that mean if the opportunity wasn't genuine, they aren't liable? If so, that pushes back toward Strict Control. If they are liable regardless of the genuineness, it's Strict Role Responsibility. The prompt says "genuine opportunity," implying a test of feasibility. This moves it closer to Control, but "opportunity" is weaker than "causal contribution."
      *   *Distinction:* Be careful to separate what the practice *needs* to function (a named human) vs. what it *claims* (a controlling human).

  8.  **Final Polish:** Check against all constraints.
      *   Implicit philosophy dug out? Yes.
      *   Control vs. Role addressed? Yes.
