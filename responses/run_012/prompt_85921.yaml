answer: |-
  The idea in my words (150 words)
  Your gloss is accurate: Dennett argues that a system's behavior can be objectively explained by a reason (a rationale) even if no agent within the system represents that reason. This is "competence without comprehension." The rationale is not a metaphor; it does real predictive work. However, you must emphasize that the rationale is not merely "useful fiction." It is an objective feature of the design space, anchored in history or structure, not in current mental states. For this session to work, participants must feel the tension between the obvious intelligence of the outcome and the absolute absence of any planner. They need to succeed without knowing the goal, then fail without changing their behavior. The feeling should be: "We did something smart, but none of us knew what we were doing, and then we did something stupid using the exact same logic."

  Opening (50 words)
  "Today we aren't discussing texts. We are going to run a mechanical process. You will receive instructions on cards. Follow them exactly. Do not try to guess the goal. Do not talk about the numbers on your cards. If you follow the rules, something will happen. If you break them, nothing will. Let's begin."

  Setup and materials (150 words)
  You need sixteen index cards, numbered 1 through 16 in large marker. Prepare a clear space in the center of the room. Use masking tape to mark two distinct configurations on the floor: a straight line of sixteen spots (labeled 1–16 temporarily for setup, then removed) and a circle of sixteen spots. The tape defines the "environment." Ensure the cards are shuffled face-down before class. You need a visible timer. The room must be quiet enough for students to compare numbers verbally without shouting. Arrange desks to the perimeter to maximize floor space. Have a whiteboard ready for the debrief, but do not write on it until the activity concludes. The physical constraint of the tape is crucial; the difference between the line and the circle is the only variable that changes between phases.

  Rules and roles (300 words)
  Distribute one card to each student. Tell them: "This number is your identity. Do not show it to anyone except when the rule requires comparison." Divide the class into the taped Line configuration. Hand out a second card to each student titled "Protocol A." The rule reads: "1. Look at the person immediately to your left. 2. Compare numbers silently. 3. If YOUR number is HIGHER than theirs, swap places. 4. If LOWER or EQUAL, stay. 5. Wait five seconds. 6. Repeat." Emphasize that they must not discuss strategy, only execute the comparison. They are processors, not planners. You act as the clock, calling "Compare" every five seconds. No one knows the global goal is sorting. They only know the local mechanic. For the second phase, move them to the Circle configuration. Distribute "Protocol B," which is identical to Protocol A except it specifies "person to your left" in a closed loop. The rule itself does not change logically, only the topology. Students must not alter the rule even if the outcome looks chaotic. If a student asks "What are we trying to do?", answer "Follow the card." If they ask "Is this right?", answer "Follow the card." Your role is to enforce mechanical obedience, not to facilitate understanding. The intelligence must emerge from the friction of the rules against the environment, not from your guidance.

  Run of play (250 words)
  **Minutes 0–5:** Opening and distribution. Students stand in the Line. Ensure they understand "left" is consistent.
  **Minutes 5–15:** Phase 1 (Line). Call "Compare" every five seconds. Initially, movement is chaotic. Around minute 10, the line stabilizes into numerical order (1 to 16). Ask them to freeze. Ask: "What happened?" They will say "We sorted." Ask: "Who decided to sort?" Write "No One" on the board.
  **Minutes 15–25:** Phase 2 (Circle). Move students to the circle tape. Hand out Protocol B (identical rule). Start the timer. Because there is no end to the line, the highest number (16) will chase the lowest (1) forever. The system will rotate perpetually. It will look like panic. Stop them at minute 25. Ask: "Did the rule change?" (No). "Did you change?" (No). "Why did wisdom become stupidity?"
  **Minutes 25–35:** Group Discussion. Ask: "Who had the reason for the sorting?" If they say "The Class," challenge them: "Does the class have a brain?" Push them to see that attributing reason to the collective is the same error as attributing it to an individual.
  **Minutes 35–45:** Connect to Dennett. Explain free-floating rationales. The reason (order) was real, but the reasoner was absent. The environment held the rationale, not the students.

  Debrief (250 words)
  Connect the specific mechanical failures to the philosophical concept. In Phase 1, the outcome (order) was predictable and useful. You could explain their movements by saying "They are sorting." That explanation was true, even though no student intended "sorting." This is the free-floating rationale. It did explanatory work without a mind. In Phase 2, the same rationale ("they are sorting") still explains their behavior, but now it predicts failure. The rationale detached from success. This shows the rationale belongs to the structure, not the agents. When students suggested "The Group" had the reason, point out that this is a "homunculus error" scaled up. The group is just more mechanics. If no individual understood the goal, adding more individuals doesn't create understanding; it just creates more complex mechanics. The "wisdom" was in the topology of the line, which allowed the local rule to generate global order. The "stupidity" was in the topology of the circle, which turned the same rule into a loop. The rationale floated free of the students entirely; it was a property of the system's geometry. This mirrors Dennett's claim about evolution: organisms act for reasons (survival) that no gene represents. The reason is real, but the reasoner is absent. You must emphasize that the rationale is not a metaphor; it is the only way to predict the system's behavior accurately.

  Where it will break the first time (200 words)
  **Failure 1: Cheating.** Students will talk and strategize ("You go there, I'll go here"). This introduces a mind where there should be none. *Fix:* Stop the clock immediately. Remind them they are machines. Restart the count.
  **Failure 2: Impatience.** They will swap faster than the five-second beat, causing chaos. *Fix:* You control the beat. Clap loudly. Enforce the wait.
  **Failure 3: The "Group Mind" Trap.** They will insist "We figured it out." *Fix:* Ask one specific student: "Did you know the line was sorted until the end?" When they say no, ask: "If none of you knew, how did 'We' know?" Force them to confront the absence of the subject.
  **Failure 4: Phase 2 Confusion.** They might think the rule changed because the outcome changed. *Fix:* Have them hold up Protocol A and B side-by-side to prove text identity. The environment (tape) is the only variable.
  **Failure 5: Time Overrun.** Sorting takes longer than expected. *Fix:* If Phase 1 isn't sorted by minute 15, stop anyway. The trend toward order is sufficient; perfect order is not required.

  What the activity cannot show (100 words)
  This simulation is synchronic; it shows structure, not history. Dennett's free-floating rationales are deeply tied to evolutionary time—rationales exist because past systems failed without them. This activity cannot show the selection process that anchors the rationale. You must supply this verbally: explain that in nature, the "Line" is the result of millions of years of pruning, not just tape on a floor. Be honest that the game isolates the structural absence of the reasoner, but you must narrate the historical depth that makes the rationale objective rather than accidental.
