  ### Advisor's Preliminary Notes: Framing the Question

  You have a strong intuition, but right now it's a cluster of worries rather than a research question. If you submit a proposal that says "I want to explore the tension between MDL and intent," you will get feedback that says "This is too vague; what are you actually *doing*?" You need to operationalize the philosophical distinction.

  Here are four ways to frame this, ranging from "too abstract" to "just right":

  1.  **The Metaphysical Framing:** *What is the ontological status of the rule in a Bongard Problem?* This asks whether the rule exists independently of the solver or is constituted by the solving act.
      *   *Critique:* This is a philosophy dissertation topic, not a semester seminar proposal. You won't reach a determinate answer in six pages. It invites hand-waving.
  2.  **The Communicative/Pragmatic Framing:** *Are Bongard Problems semantic puzzles or Gricean conversations?* This frames the solver as inferring the *maker's intent* rather than logical truth.
      *   *Critique:* Strong, but it leans too heavily on existing literature on pragmatics. It risks becoming a literature review rather than a novel investigation of the negative set.
  3.  **The Computational/MDL Framing:** *Does Minimum Description Length predict human performance on Bongard Problems better than Generative Recovery?*
      *   *Critique:* This is your roommate's position. If you take this, you are just testing his hypothesis. You want to challenge it, not just verify it.
  4.  **The Contrast Class Framing:** *Does the specific composition of the negative set (the Right-hand images) constrain hypothesis selection independently of descriptive complexity?*
      *   *Critique:* **This is the winner.** It isolates the variable you mentioned (the right-hand set). It allows you to construct specific cases where MDL predicts one answer, but the contrast class suggests another. It is empirically testable (even on a small scale) and philosophically substantive.

  **My Bet:** Go with Framing 4. It forces you to build the "Divergence Cases" you mentioned (where the generator is baroque but a simple rule fits, or vice versa). It gives you a concrete method (stimulus construction and response measurement) and a clear success condition (do responses shift when the negative set shifts, holding the positive set constant?).

  Below is the proposal drafted in your voice. I have tightened the scope to ensure you can actually finish this in a month. I've also hardened the "Method" section—vague methods are the number one reason seminar proposals get torn apart.

  ***

  # Research Proposal: The Role of Contrast Classes in Concept Induction
  **Seminar:** Concepts and Induction
  **Student:** [Your Name]

  ### 1. The Core Question

  Bongard Problems (BPs) present a solver with two sets of images: six on the left that share a rule, and six on the right that do not. The standard metric for success is matching the rule intended by the puzzle-maker. However, this metric conflates two distinct criteria for a "correct" solution: the *generative rule* (the procedure actually used to create the sets) and the *minimal description* (the simplest rule that fits the provided data).

  In many cases, these criteria diverge. A puzzle may be generated by a complex, baroque process, yet admit a much simpler description that partitions the examples identically. Conversely, the provided examples may underspecify the generator, allowing multiple incompatible rules of equal complexity. Current computational approaches, particularly those relying on Minimum Description Length (MDL), typically resolve this by selecting the shortest description that fits the data. This assumes the negative set (the right-hand images) functions merely as the logical complement of the positive set.

  My hypothesis is that this assumption is cognitively unrealistic. I propose that the right-hand set functions not as a logical complement, but as a *contrast class* that pragmatically constrains the hypothesis space. If this is true, changing the specific images in the negative set—while holding the positive set and the minimal description constant—should systematically alter the rules human solvers induce.

  **Research Question:** *Does the specific composition of the negative set in Bongard Problems influence rule induction independently of descriptive complexity?*

  ### 2. Why Obvious Responses Fail

  To justify this investigation, I must rule out three standard responses to the underdetermination problem in BPs.

  **The MDL Response (The Roommate Objection):**
  The computationalist argument is that induction *just is* compression. If two rules fit the data, the shorter one wins. Any deviation from this is noise or error. This response fails because it treats the BP as a static logical problem rather than a communicative act. It ignores the information carried by the *selection* of negative examples. If the puzzle-maker chose specific counter-examples, that selection carries information about the hypothesis space they want the solver to consider. MDL accounts for the fit, but not the sampling.

  **The Intentionalist Response:**
  The opposite view is that the "correct" rule is simply whatever the maker intended. This makes the problem empirically empty for cognitive science. Unless we have access to the maker's mind, we cannot distinguish between a solver who found the "true" rule and one who found a different rule that happens to fit the data. We need a criterion for correctness that is intersubjective and based on the stimuli, not private mental states.

  **The Skeptical Response:**
  A third view is that there is no fact of the matter; the problem is radically underdetermined. While logically sound, this is scientifically unproductive. If human solvers consistently agree on a rule despite underdetermination, there is a psychological fact to be explained, even if there is no logical one. My project seeks to identify the constraints that resolve this underdetermination, rather than declaring it unsolvable.

  ### 3. Methodology

  This project will proceed in three phases over the course of the semester. The goal is not to build a full-scale cognitive model, but to construct a proof-of-concept demonstration that the negative set matters.

  **Phase 1: Construction of Divergence Cases (Weeks 1-3)**
  I will construct a set of 10 custom Bongard-style problems designed to create tension between MDL and Contrast Class cues.
  *   *Type A (Baroque Generator):* I will generate images using a complex rule, but ensure a simpler rule fits the positive set. I will then manipulate the negative set to either support the simple rule or hint at the complex one.
  *   *Type B (Underspecified Generator):* I will create positive sets compatible with two rules of equal complexity (e.g., "contains triangles" vs. "contains three-sided shapes"). I will then vary the negative set to favor one interpretation over the other.
  *   *Tooling:* I will use Python (with the `manim` or `Pillow` libraries) to generate geometric stimuli. This ensures I control the generative process exactly, avoiding the ambiguity of using existing BP datasets where the generator is unknown.

  **Phase 2: Pilot Testing (Weeks 4-6)**
  I will run a within-subjects experiment with a small sample (N=20), recruited from the graduate student community.
  *   *Procedure:* Participants will see the six left-hand images. They will then be shown one of two versions of the right-hand set (Version 1 vs. Version 2).
  *   *Task:* Participants will be asked to write down the rule that distinguishes Left from Right.
  *   *Measurement:* I will code the responses for alignment with the "MDL-preferred" rule versus the "Contrast-suggested" rule.
  *   *Control:* To ensure descriptive complexity is held constant, I will verify the complexity of the competing rules using a basic symbolic description length metric (counting primitive operators) prior to the experiment.

  **Phase 3: Analysis and Refinement (Weeks 7-10)**
  I will analyze whether the variation in the negative set produces a statistically significant shift in the reported rules. If participants consistently shift their answers based on the right-hand images despite the left-hand images and minimal description remaining constant, this supports the Contrast Class Hypothesis.

  ### 4. Success and Failure Conditions

  It is crucial to define what counts as a result, given the small scale of this seminar project.

  **Successful Outcome:**
  A successful result does not require a full theory of concept learning. Success is defined as demonstrating a *dissociation*. If I can show even 3-4 cases where changing the negative set flips the majority consensus on the rule (e.g., from "contains circles" to "contains curved lines"), I have demonstrated that the negative set carries independent informational weight. This would validate the claim that MDL alone is insufficient to model human induction in this context.

  **Failure or Triviality:**
  The project fails if participants ignore the negative set entirely and converge on the single shortest description regardless of the contrast class. This would suggest my roommate is right: MDL dominates pragmatic cues in this domain.
  The project is trivial if the manipulation of the negative set simply makes the problem easier or harder without changing the *content* of the rule. For example, if Version 1 leads to "contains circles" and Version 2 leads to "definitely contains circles," the concept hasn't changed, only the confidence. I need to see a change in the *hypothesis selected*, not just the confidence level.

  **Contingency Plan:**
  If the human pilot proves too noisy (common in small-N studies), I will pivot to a "Wizard of Oz" analysis. I will take existing, solved Bongard Problems from the literature and analyze the relationship between the provided solution and the specific features of the negative set. I can code the negative sets for "distance" from the positive set in feature space. Even without new human data, I can argue theoretically that the published solutions rely on contrast features that MDL would ignore. This saves the philosophical argument even if the empirical pilot falters.

  ### 5. Scope Management

  The primary risk to this project is scope creep regarding the stimulus generation. Creating valid Bongard Problems is notoriously difficult; it is easy to accidentally create ambiguous stimuli that frustrate participants.

  **Cuts for Feasibility:**
  1.  **No Neural Networks:** I will not train a model to solve these. Comparing human performance to a neural net is a separate project. I will compare human performance to a theoretical MDL baseline.
  2.  **Limited Stimuli:** I will cap the stimulus set at 10 problems. Power analysis for N=20 suggests I can only detect large effect sizes, so I need high-quality, high-effect stimuli rather than many low-quality ones.
  3.  **No Eye-Tracking:** I considered tracking where participants look on the right-hand set, but this adds technical overhead. I will rely on the written rule descriptions as the primary data.

  **Deliverables:**
  By the end of the semester, I will produce:
  1.  A dataset of 10 "Divergence Case" Bongard Problems (made publicly available).
  2.  A 6-page paper detailing the dissociation between MDL predictions and human responses in these cases.
  3.  A discussion of how the "Contrast Class" view modifies standard accounts of induction in cognitive science.

  ### 6. Significance

  This project bridges a gap between formal models of induction (which prioritize compression) and philosophical accounts of concepts (which prioritize meaning and use). If the negative set acts as a contrast class, it implies that concept learning is inherently relational and contextual, not just a matter of compressing positive data. This has implications beyond puzzles: it suggests that in real-world learning, the specific examples of what a concept is *not* may be as constitutive of the concept as the examples of what it *is*. For a first-year project, establishing this distinction in a controlled micro-domain provides a solid foundation for future work on pragmatic constraints in concept acquisition.
