  I have been reading a nineteenth-century book about the English constitution, and there is one stretch of it I cannot get to the bottom of. I have copied it out below. Please help me understand it rather than summarising the book, and please explain it out of the passage itself — I have no internet access and no library, so I cannot look anything up, and being told to consult other sources would not help me.

  > If we leave literary theory, and look to our actual old law, it is wonderful how much the sovereign can do. A few years ago the Queen very wisely attempted to make life Peers, and the House of Lords very unwisely, and contrary to its own best interests, refused to admit her claim. They said her power had decayed into non-existence; she once had it, they allowed, but it had ceased by long disuse. If any one will run over the pages of Comyn's "Digest," or any other such book, title "Prerogative," he will find the Queen has a hundred such powers which waver between reality and desuetude, and which would cause a protracted and very interesting legal argument if she tried to exercise them. Some good lawyer ought to write a careful book to say which of these powers are really usable, and which are obsolete. There is no authentic explicit information as to what the Queen can do, any more than of what she does.
  >
  > In the bare superficial theory of free institutions this is undoubtedly a defect. Every power in a popular government ought to be known. The whole notion of such a government is that the political people—the governing people—rules as it thinks fit. All the acts of every administration are to be canvassed by it; it is to watch if such acts seem good, and in some manner or other to interpose if they seem not good. But it cannot judge if it is to be kept in ignorance; it cannot interpose if it does not know. A secret prerogative is an anomaly—perhaps the greatest of anomalies. That secrecy is, however, essential to the utility of English royalty as it now is. Above all things our royalty is to be reverenced, and if you begin to poke about it you cannot reverence it. When there is a select committee on the Queen, the charm of royalty will be gone. Its mystery is its life. We must not let in daylight upon magic. We must not bring the Queen into the combat of politics, or she will cease to be reverenced by all combatants; she will become one combatant among many. The existence of this secret power is, according to abstract theory, a defect in our constitutional polity, but it is a defect incident to a civilisation such as ours, where august and therefore unknown powers are needed, as well as known and serviceable powers.

  Four things defeat me.

  First, he says that in a popular government every power ought to be known, then grants that secrecy is nevertheless essential to the utility of the monarchy, then calls the secret power a defect "incident to" a civilisation such as his. I cannot tell whether "incident to" means "a cost we are stuck with" or "a fault this kind of society produces and another kind might avoid". Which reading does the rest of the paragraph support, and does the difference change what he is claiming?

  Second, "august and therefore unknown powers are needed, as well as known and serviceable powers" seems to run the inference backwards from what I would expect. Is he saying that being unknown is what makes a power august, that august powers simply do happen to be partly unknown, or something else? And does the argument require the holder of the powers to be mysterious, or only the powers themselves?

  Third, he gives what look like two different reasons for keeping the sovereign out of sight: one about reverence ("if you begin to poke about it you cannot reverence it") and one about partisanship ("she will become one combatant among many"). Are these one argument or two, and could one of them hold while the other fails?

  Fourth, I cannot tell whether he is describing how the English system does work or recommending how it ought to work. Is there anything in the passage that settles this, or is the ambiguity real?

  Finally, a friend and I have been amusing ourselves by designing a head of state for a country that wants one with no political power at all. Our design: the office is filled by lot for a single five-year term from among retired judges; the holder may not join a party or state political opinions in public; the holder meets the prime minister every week and keeps a complete written record of those meetings, sealed for twenty years and then published in full. My friend says this is the passage's scheme with the mystique stripped out, and that it will therefore fail at the very job the passage assigns to the monarch. I say the mystique was only ever a means to the reverence, and that an office transparently impartial and transparently temporary will be reverenced in the way that matters. Which of us is reading the passage better, and which sentences would have to mean what for one of us to be right?

