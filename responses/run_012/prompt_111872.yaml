answer: |-
  ### Examination Question

  **Course:** Data Ethics (CS/PHIL)
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question 1: The Wellness App Case**

  A technology company sells a workplace wellness app. An employer requires its employees to use this app to log their hours; hours that are not logged are not paid. The app requests continuous location and heart-rate data. Its disclosure screen states that the company "shares data with analytics partners in order to improve the service." This statement is literally true. However, it omits that those partners build health-risk profiles which are sold to insurers. The user is a competent adult. The company offers a paid tier, at eight dollars a month, that collects no continuous data; the user has not chosen it. No threat comes from the technology company: the pressure to accept comes from the employer's requirement, and the employer is not the party asking for consent.

  **Task:**
  Determine whether valid consent has been obtained in this case. To receive full marks, your answer must explicitly address the following four issues:

  1.  **The Baseline Problem:** Voluntariness is measured against the alternative the person would otherwise have had. You must state which baseline you are using: (a) not using the app at all (which means not being paid), (b) the paid tier (which means paying to avoid surveillance), or (c) the situation the user would have occupied had the employer never adopted the app. Explain how your choice of baseline changes the verdict.
  2.  **The Act/Attitude Problem:** Consent might be an **act** (the click, the signature) or a **state of mind** (understanding and endorsing what is happening). You must state which reading your verdict depends on. Explain whether the user's click settles the matter or whether it can be defeated by what the user did not understand.
  3.  **Disclosure:** Decide whether a disclosure that is literally true but materially incomplete counts as deception in this context.
  4.  **Competence:** Decide whether competence is a general capacity (the user is an adult) or a capacity with respect to this particular transaction (the user understands *this* risk).

  ***

  ### Model Answer (First-Class Standard)

  Valid consent has not been obtained. While the user clicked "agree," the structural coercion and informational asymmetry render the consent ethically void. This verdict relies on selecting a baseline that accounts for power dynamics, adopting an attitude-based view of consent, recognizing omission as deception, and requiring transaction-specific competence.

  First, regarding the **baseline problem**, the correct baseline is the situation the user would have occupied had the employer never adopted the app. If we use the baseline of "not using the app," the user technically has a choice: accept surveillance or go unpaid. This makes the choice appear voluntary. However, this ignores that the threat of unpaid labor originates from the employer, who is intertwined with the app's deployment. If we use the "paid tier" baseline, we imply that privacy is a luxury good. By choosing the pre-app baseline, we see that the user has been placed in a "take-it-or-leave-it" situation regarding their biometric data that did not exist previously. The voluntariness is compromised because the alternative (losing wages) is too costly to be a genuine refusal. The choice of baseline decides the verdict: only the pre-app baseline reveals the coercion inherent in tying essential compensation to invasive data collection.

  Second, regarding the **act/attitude problem**, consent must be read as an attitude (understanding and endorsement), not merely an act (the click). If consent were merely an act, the user's click would settle the matter, regardless of the hidden insurance risk. However, a click without understanding is compliance, not consent. Because the disclosure omitted the insurer risk, the user could not endorse the specific harm occurring. The act reading protects the company; the attitude reading protects the user's autonomy. Since the user did not understand the material consequence (insurance profiling), the attitude of consent was never formed, rendering the act of clicking meaningless.

  Third, on **disclosure**, a statement that is literally true but materially incomplete counts as deception here. Ethics requires enabling informed decision-making, not just avoiding lies. Stating data is shared "to improve service" implies a benign technical purpose. Hiding the commercial sale of health profiles creates a false impression of the risk. In high-stakes contexts like health data, omitting the downstream use is functionally equivalent to lying because it prevents the user from weighing the true cost.

  Finally, regarding **competence**, competence must be transaction-specific. Being a competent adult is insufficient if the transaction is designed to obscure risks. The complexity of data brokerage means a general capacity for reasoning does not guarantee understanding of this specific flow. If we rely on general competence, we allow companies to hide behind the user's inability to parse technical omissions. Valid consent requires the user to be competent *regarding the specific risk*, which was made impossible by the incomplete disclosure.

  In conclusion, consent is invalid. The employer's coercion restricts voluntariness (baseline), the omission prevents understanding (attitude/disclosure), and the complexity negates general competence. The click is a formality, not a moral authorization.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Passing Threshold:** 13 Marks

  #### 1. The Baseline Problem (5 Marks)
  *   **5 Marks:** Explicitly selects one baseline (A, B, or C) and argues *why* that baseline is ethically appropriate. Explains how a different baseline would lead to a different verdict (e.g., "If I chose baseline A, it would look voluntary, but I choose C because...").
  *   **3 Marks:** Selects a baseline but fails to explain how the choice changes the verdict.
  *   **0 Marks:** Ignores the baseline or conflates the employer's pressure with the company's consent without referencing the counterfactual.

  #### 2. The Act/Attitude Problem (5 Marks)
  *   **5 Marks:** Explicitly distinguishes between the click (act) and understanding (attitude). Argues that one overrides the other in this case.
  *   **3 Marks:** Mentions the click or understanding but treats them as the same thing.
  *   **0 Marks:** Assumes the click is final proof of consent regardless of understanding.

  #### 3. Disclosure and Competence (5 Marks)
  *   **5 Marks:** Correctly identifies that literal truth can be deceptive via omission AND argues that competence is transaction-specific (not just "adult").
  *   **3 Marks:** Addresses one point well but ignores the other.
  *   **0 Marks:** Argues that "truthful statements cannot be deception" or "adults are always competent."

  #### 4. Synthesis and Coherence (5 Marks)
  *   **5 Marks:** The four arguments support a single verdict. The student acknowledges tension (e.g., "Even if the baseline were voluntary, the attitude is missing...").
  *   **3 Marks:** The arguments are disjointed or contradict the final verdict.
  *   **0 Marks:** No clear verdict or contradictory reasoning.

  #### 5. Specific Error Penalties (Deduct from Total)
  *   **The "Paid Tier" Fallacy (-5 Marks):** Deduct if the student argues that the existence of the $8 paid tier *automatically* resolves the voluntariness issue without analyzing the economic burden. (This sounds sophisticated because it acknowledges an alternative, but it ignores the coercion of paying to work).
  *   **The "Legalistic" Fallacy (-3 Marks):** Deduct if the student argues that because the statement was "literally true," it is ethically sufficient.

  ***

  ### Grader's Note: Distinguishing First-Class from Second-Class

  As a technical grader, you will encounter answers that are logically sound but mechanically applied. Here is how to defend the distinction when the philosopher co-instructor reviews the grades.

  **The Solid Second-Class Answer (15–19 Marks):**
  This student treats the four requirements as a checklist. They select a baseline, select Act/Attitude, and tick the boxes. Their reasoning is consistent, but they treat the puzzles as independent variables.
  *   *Example:* They argue the baseline is coercive, and separately argue the disclosure is deceptive. They do not explain how the deception makes the baseline irrelevant, or how the baseline makes the deception worse.
  *   *Defense:* "The student applied the concepts correctly but failed to integrate them. They solved the parts but not the system."

  **The First-Class Answer (20–25 Marks):**
  This student shows how the puzzles **interlock**. They recognize that the choice of Act/Attitude often dictates the importance of the Baseline.
  *   *Key Move:* They argue that if consent is an *Attitude*, the Baseline matters less because the user never understood the deal regardless of their options. Conversely, if consent is an *Act*, the Baseline becomes the only thing that matters.
  *   *Defense:* "This student demonstrated meta-ethical reasoning. They didn't just apply the frameworks; they analyzed the relationship between the frameworks. They showed that the deception (Disclosure) invalidates the mental state (Attitude), which renders the economic choice (Baseline) moot."

  **The "Sophisticated" Error to Watch For:**
  Students may argue: *"The user had a meaningful choice because they could pay $8 to opt-out, therefore the baseline is the paid tier and consent is valid."*
  *   **Why it looks smart:** It acknowledges the nuance of the paid tier.
  *   **Why it is wrong:** It treats privacy as a commodity the worker must purchase to retain rights they should inherently possess. It ignores that the employer created the dilemma.
  *   **Action:** Apply the **-5 Mark Penalty** in Section 5. This is the most common point of contention between engineers (who see an opt-out mechanism) and philosophers (who see coerced commodification).
