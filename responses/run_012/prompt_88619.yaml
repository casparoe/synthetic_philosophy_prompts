  **Credence Terms**

  0.75 — Probability that non-instrumental desert conceptually requires ultimate self-authorship rather than merely agential control.
  0.90 — Probability that no human agent possesses ultimate self-authorship given causal determinism and genetic environmental luck.
  0.60 — Probability that compatibilist responsibility fails to ground non-instrumental desert despite grounding legal or moral accountability.
  0.85 — Probability that the origin-indifference reading is wrong and the implanted worker's causal history negates their desert claim.

  **Combination**
  Multiplying the probability that desert requires ultimacy (0.75), that no one has it (0.90), that compatibilism fails to save it (0.60), and that causal origin matters (0.85) yields a final credence of **0.34**.

  **Sensitivity Analysis**
  The final number is most sensitive to the first term (whether desert requires ultimate authorship), because if desert is defined by forward-looking social functions or present agential capacities instead, the product collapses to zero regardless of the metaphysics. The argument that would move this most is a robust defense of "desert as a reactive attitude" that decouples merit from metaphysical ultimacy, showing that the implanted worker's felt effort is sufficient for desert regardless of the device.

  **Disagreement Location**
  Your disagreement with your friend most likely lives in the first term: the definition of desert. Your friend (0.85) likely assigns a probability near 1.0 to the claim that desert *must* mean ultimate authorship, whereas your lower credence (0.40) suggests you suspect desert can be grounded in the quality of the will or the phenomenology of effort, even if the causal chain is compromised. You are debating the meaning of the word "desert," not just the physics of the implant.
