          *   *Synthesis:* It is a ticket for *claiming goods in the market*. The "issuer" is the collective industry of the nation (Q5 "mutually to participate"). It is not a claim on a specific hoard of gold (rejecting "pledge" in Q23).

  7.  **Address Difficulty 5: The Interrogative Form**
      *   *Formula:* "Whether X be not Y."
