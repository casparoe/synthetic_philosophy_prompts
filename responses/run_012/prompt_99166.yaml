      *   *Work it must do:* Demonstrate that "being an 'a'" is not about having a specific loop, but about satisfying a topological or functional role that changes definition based on the stylistic system.
      *   *Work it must NOT do:* Serve as a menu of options (pick a bowl, pick a stem).

  4.  **Develop the Sequence (The Arc of the Session):**
      *   *Start:* Meet them where they are (Features/Prototypes).
      *   *Step 1:* Break the Feature Model. (Show 'a's that lack standard features).
      *   *Step 2:* Break the Prototype Model. (Show that no single shape is central).
      *   *Step 3:* Introduce the "Style" problem. (If identity isn't shape, is it abstract + style overlay?)
      *   *Step 4:* The Twist (Identity/Style Entanglement). (Style determines which features *count* as identity).
      *   *End:* Synthesis (The "Spirit" of the letter).

  5.  **Drafting the Misconception Map:**
      *   1. Checklist (Features). *Timing:* Immediate. *Fix:* Show an 'a' without a loop (e.g., specific handwriting or avant-garde type).
      *   2. Prototype (Central Tendency). *Timing:* After features fail. *Fix:* Show that a "average" 'a' might look like nothing recognizable, or that distinct styles have distinct centers.
      *   3. Style as Overlay (Separability). *Timing:* The core hurdle. *Fix:* Show that changing style changes *which* parts are essential.
      *   4. Conventionalism (It's just arbitrary). *Timing:* Defensive reaction. *Fix:* Show constraints. You can't make *any* shape an 'a'.
      *   5. (Missing One): *The "Atomistic" Fallacy.* Thinking letters are independent. *Letter Spirit* is about the *grid* and consistency across the alphabet. I should add this.

  6.  **Determining Refusals:**
      *   Don't get into neural implementation.
      *   Don't get into the specific code of *Letter Spirit* (grid structures, codelets).
      *   Don't solve the philosophical "essence" debate fully (keep it cognitive/design focused).
      *   Don't let Design students dominate with "kerning/legibility" arguments; keep it on *identity*.

  7.  **Crafting the Final Question:**
      *   Needs to test the entanglement of identity and style.
      *   Bad answer: "Identity is the shape, style is the thickness."
