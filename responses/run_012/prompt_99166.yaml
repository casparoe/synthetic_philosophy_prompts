      *   Standard CogSci view (Prototype/Exemplar): 'a' is a cluster in feature space.
      *   Design view: 'a' is a glyph to be drawn.
      *   The *Letter Spirit* view: 'a' is a set of abstract roles (loop, stem, arch) realized through stylistic constraints that permeate the whole alphabet.
      *   Crucial insight: You can't define the identity *independently* of the style because the style dictates *which* features count as the identity markers in that context.

  3.  **Evaluate the Carrying Example (Double-story vs. Single-story 'a'):**
      *   *Pros:* Everyone knows it. It's the classic "same letter, different shape" case.
      *   *Cons (User's worry):* It tempts the "shape + decoration" view. It might reinforce the idea that there's a "real" 'a' (double-story) and a "simplified" 'a' (single-story).
      *   *Verdict:* It *is* the right example, but it needs to be handled carefully. It shouldn't be used to show *variation*; it should be used to show *structural ambiguity*.
