      *   *Reference Class Problem:* This is the crux. As the user suspects, defining the reference class is subjective. Is "Great Powers since 1500" the class? Is "Hegemons with Reserve Currencies post-1945"? Is "Nuclear-armed Democracies"? Different classes yield wildly different base rates.
      *   *Age vs. State:* This is a crucial insight by the user. "Empires die at age 250" (Spenglerian/organic) vs. "Empires die when debt/GDP > X or legitimacy < Y" (structural/functional). These are fundamentally different causal models.

