  ok so i'm putting together a seminar thing and i want a consistency check on my constructionism before i say any of it out loud. here's roughly where i've landed, numbered so you can point at them by number:

  (1) race, gender and money are all socially constructed — there's no biological or physical essence sitting underneath them doing the work.

  (2) but none of them are 'just' anything. race shows up in health outcomes and hiring, money moves prices, gender shapes who gets interrupted in meetings. constructed doesn't mean unreal.

  (3) i'm a physicalist in the boring sense: whatever exists is ultimately physical, or at least supervenes on the physical. no extra spooky layer.

  (4) i think there's a real difference between kinds we discover and kinds we invent — electrons discovered, money invented — and that difference matters for what kind of claim 'X is constructed' is supposed to be.

  (5) i think construction claims are objectively true or false. 'gender is socially constructed' is a claim with a truth value, and whether it's true doesn't depend on whether you happen to be a constructionist.

  (6) i also think the interesting version of the project is the revisionary one: the question isn't what people currently mean by 'gender', it's what concept we'd want to have, given what we're trying to do with it.

  (7) a friend keeps telling me the real test is whether a kind pushes back: reclassify an electron and it doesn't care, reclassify a person and they start acting like the new label, which changes the kind itself. he says that's the mark of the social. i can't tell if that's a principled line or just a vibe.

