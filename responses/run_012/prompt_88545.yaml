      *   **Philosophical Question:** Is an advance directive a binding command from a past self, or just a guess by a past self that should yield to the present self's actual desires? Does personal identity persist over time enough to justify one self ruling the other?
      *   **Format:** Short story.
      *   **Perspective:** Narrator is the "later self" (likely the "sick" self, or the one currently in the "spell"), reading a letter from the "earlier self" (the "well" self).
      *   **Constraint:** No courtroom/medical procedure drama (no "pulling the plug" scenes). Focus on the internal experience of identity and authorship.
      *   **Ending:** Ambiguous. Do not resolve who is right. Leave the reader chewing on it.
      *   **Tone:** Weird, introspective, unsettling.

  2.  **Determine the Voice and Setting:**
      *   *Voice:* Needs to feel slightly detached but deeply confused. The narrator is currently in the "spell" (the "sick" state), feeling the weight of the "well" self's words.
      *   *Setting:* A quiet, domestic space. A kitchen table or a study. Somewhere intimate where one reads a letter. Let's go with a rainy afternoon in a study. It adds atmosphere.
      *   *The "Illness":* Keep it vague. It's not about symptoms; it's about the shift in *selfhood*. Let's call it "the fog" or "the turn."

  3.  **Drafting - Scene by Scene:**

      *   **Opening:** Establish the current state. The narrator is reading the letter. Establish the physical sensation of the "spell." The handwriting looks familiar but alien.
      *   **The Letter's Content:** It shouldn't be legalistic. It should be personal, almost pleading but authoritative. It needs to assert continuity ("I am you") while acknowledging the rift.
      *   **The Conflict:** The narrator reads the words and feels they are false. The "well" self wanted X, the "sick" self wants Y. But the "well" self predicted this rejection.
      *   **The Memory:** The narrator recalls the previous incident (tearing up the older directive). This mirrors the uncle's history mentioned in the prompt. It shows the cycle.
      *   **The Philosophical Core:** The narrator struggles with the concept of time and identity. Am I the same person who wrote this? Or did he die, and I am the replacement?
      *   **The Climax (Internal):** A moment of decision. To follow the letter or burn it? But the prompt says *no* resolving who is right. So the action must be suspended or ambiguous.
      *   **The Ending:** Leave the letter open. Leave the pen hovering. The question remains unanswered.

  4.  **Refining the Narrative Arc:**
      *   *Narrator:* Let's call him Elias. The "Well" self is also Elias, but... *Before*.
      *   *The Letter:* Needs to address the specific argument in the prompt: "The well me outranks the sick me."
      *   *Key Image:* A mirror. Or a photograph. Let's use a photograph on the desk. The man in the photo looks like the narrator, but the smile is wrong.
      *   *The "Spell":* Describe it not as pain, but as a shift in values. The things that mattered then don't matter now.

  5.  **Drafting - Specific Lines & Beats (Mental Sandbox):**
