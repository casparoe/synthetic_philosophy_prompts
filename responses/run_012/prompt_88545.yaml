      *   The feeling of the "turn" coming on or being present.
      *   The specific phrasing of the directive: "Do not trust the voice that speaks from the dark."

  7.  **Addressing the Prompt's Specific Constraint:** "Don't end by telling me which one was right."
      *   I need to make sure the narrator doesn't suddenly realize, "Ah, he was right." Nor should he decisively say, "He was a tyrant." The uncertainty must linger. The *weight* of the decision is the story.

  8.  **Revising for Tone:**
