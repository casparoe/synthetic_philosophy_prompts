answer: |-
  The rain is doing that thing where it doesn't hit the glass so much as smear across it, blurring the garden into a watercolor of greens and grays. It matches the inside of my head. The edges of things are soft. The coffee cup in my hand feels like it belongs to someone else's hand.

  On the desk in front of me is the envelope. Thick cream stock. My name is written in my handwriting.

  I know it's my handwriting. I've spent twenty minutes comparing the loop of the *y* in my name to the *y* in the grocery list on the fridge. They match. But the pressure is wrong. The writer of this envelope pressed down hard, certain, digging into the paper. I am barely holding the pen right now.

  I slide the letter out. I don't need to read it to know what it says. I've heard the arguments before, from the doctor, from my sister, from the version of me that lived three years ago, before the Turn.

  *Dear Elias,* it begins.

  *If you are reading this, the weather has changed. You are likely sitting in the chair by the window. You likely feel that the man who wrote this is a stranger. You likely feel that his values are heavy coats you are being forced to wear in summer.*

  I stop. I am sitting in the chair by the window. I am wearing a sweater I hate because *he* bought it.

  *You feel like an imposter in your own life,* the letter continues. *You feel that I am the imposter. You remember four years ago, when you tore up the first directive? You remember how righteous you felt? You burned that paper in the sink. You told your sister that the man who signed that first form was depressed, confused, a ghost. You said, 'I am the real one now.'*

  My stomach tightens. I remember the sink. I remember the ash swirling down the drain. I remember the relief. But then the fog came back, slowly, like tide rising over a sandcastle. And now I am here, and the ash is dry, and the paper is new.

  *But here is the math you cannot do while you are in the fog,* the letter says. *I am not a stranger. I am you, stretched. I am the bridge. If you cut me, you don't free yourself; you collapse the span. You say you want different things now. You say you no longer value the legacy, the endurance, the painful continuity. You want comfort. You want the spell to be the truth.*

  *But I knew you would want that. I predicted this rebellion. Does my prediction invalidate your desire? Or does your desire invalidate my preparation?*

  I put the letter down. The room feels tilted. This is the weirdness of it. It isn't pain. It's authorship.

  If I am a single story, then the chapter written in sunlight has authority over the chapter written in the dark. The architect outranks the tenant.

  But what if we aren't a story? What if we are a series of tenants, each changing the locks, each swearing they own the deed? The Elias who wrote this loved mountain climbing and hated morphine. The Elias sitting here loves the warmth of the radiator and thinks mountain climbing was a vanity of a dead man.

  If I listen to him, I am betraying myself. If I ignore him, I am murdering him.

  I pick up the pen. It's a heavy thing, silver-capped. He bought it for this.

  There is a box on the desk, next to the letter. Inside is the new directive. It's already signed. His signature. *Elias Thorne.* It looks like a command. All I have to do is countersign. Acknowledge receipt. Acknowledge that I understand that my current objections are symptoms, not decisions.

  *The well me outranks the sick me,* he wrote in the margin, in a different ink. *Because the well me is the only one who can see the whole map.*

  But I can see a map too. It's just a different one. His map has borders and destinations. Mine is just terrain. Just *now*.

  I think about the brother I lost. He had a stroke. He wasn't the same after. We didn't ask him if he wanted to be kept alive; we asked the man he was before. We let the ghost vote. Is that mercy? Or is it necromancy?

  I look at my hand. The skin is the same. The scar on the thumb is the same. But the blood moving underneath feels different. Slower. Darker.

  If I sign, I am agreeing that I am not real. I am agreeing that I am a glitch in the system, a corruption of the file. I am agreeing that the true Elias is the one who is not here, the one who is waiting for me to step aside.

  If I don't sign, I am declaring war on my own past. I am saying that time does not bind us. That a promise made in joy does not hold in sorrow.

  The rain streaks harder. The garden is gone now, just a gray wash.

  I uncapped the pen. The ink is black. Fresh.

  I hover the nib over the line. *Date.*

  If I write today's date, I validate his timeline. I admit that we share a calendar.

  If I leave it blank, I claim this moment is a new era. Year One.

  The letter rustles in the draft from the window. *Do not trust the voice that speaks from the dark,* it says. *It is a liar. It is me, but it is the broken me.*

  But the voice reading the letter is the one in the dark. And it sounds clear to me. It sounds like survival.

  Or is it just the sickness talking?

  I press the nib to the paper. The ink bleeds slightly into the fiber. A small, dark star.

  I don't move my hand. I just let the ink pool there, waiting to see if I will drag it into a number, or lift the pen and let it dry as a dot. A period. Or the start of a digit.

  Outside, the rain keeps falling, erasing the garden, rewriting the glass, one drop at a time.
