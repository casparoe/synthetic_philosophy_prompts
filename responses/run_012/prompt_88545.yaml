      *   *Concept:* The letter warns me that I will feel this way. It's a trap.
      *   *Concept:* If I ignore him, did I kill him? If I obey him, am I killing myself?
      *   *Ending:* I put the letter down. I pick up the pen. Do I sign? Do I write a rebuttal? I just stare at the paper.

  6.  **Writing - Focusing on Sensory Details:**
