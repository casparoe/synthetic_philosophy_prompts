          *   Define Tyranny (confusing the orders).
          *   The Friend's Error: He reduces the Order of Justice (Heart/Will) to the Order of Force (Body). This *is* the tyranny Pascal warns against.
          *   Pascal's view: Earthly kings rule by Force (Body). True Justice rules by Grace (Heart). We obey kings to keep peace, but we know their authority is of the Body, not the Heart.
      *   **Part 5: A Better Analogy:**
