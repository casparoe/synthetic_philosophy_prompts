          *   *Verdict:* The analogy holds regarding danger/adulteration, but fails regarding the *direction* of potency. Alcohol prohibition didn't necessarily drive higher ABV systematically in the same way drug prohibition drives synthetics.

      *   *Point 3: Drivers of Repeal & Settlement.*
          *   Repeal was largely economic (tax revenue/jobs) and anti-crime, not necessarily "rights-based."
          *   Settlement was *not* laissez-faire; it was highly restrictive (state monopolies, separation of tiers).
