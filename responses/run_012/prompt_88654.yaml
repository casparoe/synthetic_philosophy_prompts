  *(Self-Correction Note on Point 2)*: I need to be careful about the potency claim. During Prohibition, beer largely disappeared because it was too bulky to smuggle; hard liquor and spirits became dominant. This *does* support the potency concentration thesis. I should ensure this nuance is captured.

  *(Self-Correction Note on Point 3)*: The prompt mentions the "mandated separation of production, distribution and retail." I need to acknowledge that modern cannabis regulation is actually moving *toward* vertical integration in some states, which contradicts the alcohol model. This is a disanalogy in the *settlement* phase.

