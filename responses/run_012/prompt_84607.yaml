      INSTITUTE FOR NORMATIVE CLASSIFICATION
      MEMORANDUM 44-B
      TO: Junior Classifiers
      FROM: The Classification Desk
      SUBJECT: Protocol for Sorting Considerations

      1. General Sorting Protocol
      All submitted considerations must be sorted by relation to the attitude content. Considerations bearing on the correctness of the attitude are Right-Kind. Considerations bearing on the desirability of holding the attitude are Wrong-Kind. Do not conflate the reason for the attitude with the reason for the state of having the attitude.

      2. Incentivized Belief
      In cases where an agent is offered a reward for adopting a belief, file as Wrong-Kind. The consideration supports the desirability of the belief state but does not bear on the truth of the content. Applicants are entitled to conclude they have a reason to want to believe, but not a reason to believe. Do not stamp as Evidence.

      3. Coercive Admiration
      In cases where a powerful being threatens punishment unless admired, file as Wrong-Kind. The threat makes admiring prudent but not fitting. Classifiers should note the difficulty: the threat provides a reason to bring about the state of admiring, yet agents often report this as a reason counting in favour of the admiration itself. If the threat is severe, mark for review regarding whether pragmatic pressure mimics normative force.

      4. Temporal Intentions
      In cases where a consideration favours forming an intention to act but ceases to favour acting once the intention exists, file as Contested. This arises when the reason supports the planning state but not the execution. Do not resolve. The Desk lacks consensus on whether reasons for intentions reduce to reasons for actions.

      5. Fittingness and Value
      It is policy that whatever makes an attitude fitting does not thereby make its object valuable. Reject complaints that this policy licenses rewarding people into value. The Desk does not adjudicate value, only fittingness. A bribe may make an attitude rational to hold without making the object worthy of the attitude. Maintain this separation to prevent inflation of normative worth.

      6. Unclassifiable Considerations
