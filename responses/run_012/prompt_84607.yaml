answer: |-
  INSTITUTE FOR NORMATIVE CLASSIFICATION
  INTERNAL MEMORANDUM 44-B
  TO: Junior Classifiers
  FROM: The Classification Desk
  SUBJECT: Protocol for Sorting Considerations

  1. General Sorting Protocol
  All submitted considerations must be sorted by relation to the attitude content. Considerations bearing on the correctness of the attitude are Right-Kind. Considerations bearing on the desirability of holding the attitude are Wrong-Kind. Do not conflate the reason for the attitude with the reason for the state of having the attitude. The Desk operates on the presumption that fittingness is determined by object-given features, whereas prudence is determined by state-given features. Agents often submit state-given features as if they were object-given. Your task is to separate them without altering the normative landscape.

  2. Incentivized Belief
  In cases where an agent is offered a reward for adopting a belief, file as Wrong-Kind. The consideration supports the desirability of the belief state but does not bear on the truth of the content. Applicants are entitled to conclude they have a reason to want to believe, but not a reason to believe. Do not stamp as Evidence. If an applicant insists the reward makes the belief true, return the file with a note explaining that pragmatic utility does not constitute epistemic support. The gap between believing and wanting to believe must be maintained even if the agent finds the distinction distressing.

  3. Coercive Admiration
  In cases where a powerful being threatens punishment unless admired, file as Wrong-Kind. The threat makes admiring prudent but not fitting. Classifiers should note the difficulty: the threat provides a reason to bring about the state of admiring, yet agents often report this as a reason counting in favour of the admiration itself. If the threat is severe, mark for review regarding whether pragmatic pressure mimics normative force. The Desk remains divided on whether the threat supplies an ordinary reason for the attitude or merely a reason to cultivate the attitude artificially. Do not resolve this locally.

  4. Temporal Intentions
  In cases where a consideration favours forming an intention to act but ceases to favour acting once the intention exists, file as Contested. This arises when the reason supports the planning state but not the execution. Do not resolve. The Desk lacks consensus on whether reasons for intentions reduce to reasons for actions. Some classifiers argue the reason evaporates upon intention formation. Others argue the reason persists but changes shape. Mark these files as Temporal Mismatch and store in the pending cabinet.

  5. Fittingness and Value
  It is policy that whatever makes an attitude fitting does not thereby make its object valuable. Reject complaints that this policy licenses rewarding people into value. The Desk does not adjudicate value, only fittingness. A bribe may make an attitude rational to hold without making the object worthy of the attitude. Maintain this separation to prevent inflation of normative worth. If an applicant argues that successful bribing renders the object admirable, remind them that admiring a bribed object is fitting only if the bribe alters the object, not the attitude.

  6. Unclassifiable Considerations
  Cases involving partiality towards friends remain unclassifiable. The consideration favours favouring the friend but is not evidence of merit nor purely pragmatic. Mark for Escalation. Senior staff will determine if this constitutes a distinct kind of reason or a classification error. Do not attempt to force these into Right-Kind or Wrong-Kind bins until further notice.

  Signed,
  Director of Classification

  Footnote: Objections regarding the extensionality of attitudes and the possibility of reasons that are neither right-kind nor wrong-kind remain under review. The Desk accepts no liability for normative confusion resulting from strict adherence to this protocol.
