answer: |-
  Look, if you want to know what she's going to say about your banker, you have to stop looking at the outcomes and start looking at the excuses she's allowed so far. Her ledger isn't actually about who won or lost, because she's already told you that twice. Borgia lost everything and still has *virtù* on her sheet, while Agathocles won everything and gets nothing. So success isn't the metric. The metric she's using is a specific kind of agency, a capacity to master circumstances unless the circumstances are literally impossible to master. You can see the machinery if you line up her failures. When Soderini went down, she blamed him because he had ten years to see the wind changing and he kept doing the same humane, patient thing. When Borgia went down, she excused him because his father died and a new Pope arrived simultaneously, which she calls a stretch of fortune so extreme no man could have stood against it. The difference between those two rulings is the only thing that matters for your banker. She distinguishes between a failure of imagination and a failure of physics. Soderini could have adapted but didn't. Borgia couldn't have adapted because the ground vanished.

  So here is where your banker sits, and why she's going to tell you he didn't have *virtù*. The run on the bank sounds like Borgia's bad luck, doesn't it? Nobody saw it coming, not even the regulators. That sounds like impossible fortune. But you built in a poison pill eighteen months before the end. He was offered a merger. He turned it down. He chose independence over survival. In her eyes, that moves this case out of the Borgia category and into the Soderini category. Soderini chose humanity over necessity. Your banker chose identity over necessity. She's going to say that *virtù* requires you to keep the state alive, even if it means becoming something you didn't intend to be. Fabius and Scipio both had *virtù* because their different styles both preserved Rome. The banker's style destroyed the bank. She's going to argue that refusing the merger wasn't principle, it was rigidity. It was a refusal to change his mode when the times shifted underneath him, which is the exact definition of how she condemned Soderini. She'll say the run was the bullet, but refusing the merger was taking off the bulletproof vest. You can't claim you were defeated by impossible fortune if you rejected the one lifeline that was thrown to you.

  But here is the machinery glitch, the place where her rules are actually underdetermined. She hasn't truly defined the threshold where fortune becomes too extreme for *virtù* to matter. She says Borgia faced something no man could stand against, but she says Soderini faced something a man should have stood against by changing his shape. How do we know the difference beforehand? In the banker's case, she's using the merger offer as proof that the situation was survivable. But what if the merger would have destroyed the bank's purpose anyway? What if becoming like everybody else meant the bank ceased to be the thing he was trying to save? That's the hole in her logic. She assumes survival of the institution is the only goal, but Agathocles taught us that getting what you want isn't enough to prove *virtù*. So maybe preserving the institution by turning it into something else isn't *virtù* either. She's currently having it both ways by saying Borgia failed due to luck and Soderini failed due to stubbornness, but she hasn't given us a rule for when stubbornness is actually the only virtuous choice left.

  To force her hand, you need a case where the merger doesn't exist. You need a leader who refuses to change their mode, faces a run that nobody saw coming, has no lifeline offered, and still goes under. If she says that leader had no *virtù*, then she's admitting that *virtù* is just a fancy word for success, because that leader did everything right except predict the unpredictable. If she says that leader had *virtù*, then she has to admit that Soderini might have been right to stay humane, and that sometimes the times are just too hostile for any mode to work. Or, you flip it. You bring her a case of a leader who adapts cynically, betrays their original purpose, saves the institution, and becomes exactly like everybody else. If she grants them *virtù*, she kills the Agathocles rule. If she denies it, she admits that *virtù* requires a moral component that might get you killed. Right now she's comfortable because every case she's judged has had a clear exit door. Borgia had no door. Soderini walked past the door. Your banker locked his own door. She'll say he lacked *virtù* because he locked it, but the real test is whether she thinks having the key mattered more than what was on the other side.
