  Could you lay the answer out like this: first a section called "The thing you're circling" where you restate what I'm after more sharply than I did (roughly 100 words); then "The nearest named concepts," one short paragraph per concept saying precisely how it differs from mine; then "Which one fits, if any" with your verdict; and finally "If nothing fits, a coinage" with the name, the definition, and the edge cases. Total maybe 700–900 words is plenty.
