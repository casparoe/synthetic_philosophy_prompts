answer: |-
  ### The thing you're circling

  You are isolating the identification problem inherent in sequential social learning. The core issue is that action histories are lossy compressions of private information. A sequence of identical choices is consistent with both high-confidence independence and low-confidence imitation. You are asking for the label of this many-to-one mapping, and specifically whether endogenous timing acts as a side-channel that restores information content when actions cease to be informative. Essentially, you want the term for the opacity of aggregation: when the public record stops distinguishing between genuine consensus and fragile imitation, and whether delay breaks that symmetry. You are looking for the name of the shadow that hides the signal structure.

  ### The nearest named concepts

  **Information Cascade:** This names the mechanism of the "empty" herd, where private signals are rationally ignored because public history outweighs them. It describes the stability of the run but treats the indistinguishability as a feature, not the phenomenon itself. It doesn't offer a term for the confusion between a cascade and independent convergence, focusing instead on the threshold where private information becomes irrelevant. It assumes the cascade has started, whereas you are asking about the inability to verify if it has. It is about the decision rule, not the history's opacity.

  **Observational Equivalence:** This is the econometric term for your indistinguishability problem. It correctly identifies that different structural models generate identical data. However, it is a methodological label for model comparison, not a behavioral concept describing the social state or the epistemic loss within the group. It tells you that you can't tell the difference, but not what that state is called. It is a property of the estimator, not the agents. It lacks the normative weight of the social learning context.

  **Herding:** This is often too broad and theoretically loose. In finance and macro, it frequently implies payoff externalities or irrational conformity rather than pure informational externalities. It conflates the "empty" cascade with network effects, missing the specific epistemic distinction you care about regarding signal independence. It often presumes the "empty" case without acknowledging the "full" possibility, treating all runs as suspect rather than ambiguous. It misses the rationality of the followers.

  **Timing Games:** These model observable waiting, often as a war of attrition. While they capture the signaling value of delay, they typically frame waiting as strategic competition for a prize rather than an epistemic leak that resolves informational degeneracy during a stalemate. They focus on who wins the timing game, not how timing reveals hidden signal strength. Your model uses timing for information revelation, not prize allocation. It misses the learning aspect.

  ### Which one fits, if any

  None fit perfectly. "Information Cascade" is the closest neighbor but refers to the mechanism of ignoring signals, not the observational ambiguity between ignoring and confirming. "Observational Equivalence" captures the ambiguity but lacks behavioral content. You are describing a property of the history itself, not just the model or the mechanism. The waiting wrinkle is essentially about breaking the equivalence via endogenous timing, which standard cascade models usually exogenize. You need a term that binds the ambiguity and the potential resolution via delay. The core tension is that the action space is too coarse to capture the signal intensity, whereas timing is continuous. The waiting variable transforms the game from discrete choice to continuous signaling, which standard terminology does not capture.

  ### If nothing fits, a coinage

  **Name:** *Informational Degeneracy*

  **Definition:** The state where distinct distributions of private information generate identical public action histories, resolvable only through non-action signals like timing.

  **Edge Cases (Right):** A citation pile-on where only two agents read the paper (degenerate); a standard cascade where early movers lock in behavior (degenerate); a long delay broken by a high-signal agent (resolution).

  **Edge Case (Wrong):** Payoff-based bandwagons where agents follow because utility increases with adoption, not because of information (not epistemic).

  This coinage captures the loss of injectivity in the mapping from signals to actions. It gets the citation case right because the history looks strong but isn't. It gets the cascade right because the history is empty but stable. It gets the waiting case right because the delay breaks the degeneracy. It fails on payoff bandwagons because those are not about information hiding, but about utility interdependence, which is a different structural problem entirely.
