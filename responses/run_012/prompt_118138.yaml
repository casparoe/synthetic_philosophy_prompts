answer: |-
  # Seminar Design: The Consistency Trap

  ## 1. Materials & Setup
  *   **The Urn:** Opaque container, 100 ping-pong balls (99 white, 1 gold), numbered 1–100 on the inside (visible only after draw).
  *   **The Cards:** 100 index cards. Card #*k* reads: *"Ball #k will not be drawn."*
  *   **The Ledger:** A large whiteboard or shared digital doc with columns: `Card #`, `Holder`, `Decision (Endorse/Abstain)`, `Auditor Check`.
  *   **Tokens:** Poker chips or similar. Starting endowment: 10 per student.
  *   **Roles:**
      *   **Participants:** 18 students (hold the cards).
      *   **Clerk:** 1 student (records Ledger).
      *   **Auditors:** 2 students (check for logical consistency).
      *   **Bureau Chief:** Instructor (holds the Guarantee).
  *   **Room:** Arranged so the Urn is visible but inaccessible.

  ## 2. The Payoff Sheet (Handout)
  **Scoring Rule for Cards:**
  *   **Endorse & True:** +1 Token
  *   **Endorse & False:** −9 Tokens
  *   **Abstain:** 0 Tokens

  **The Clean Sheet Guarantee:**
  *   **Condition:** The Bureau Chief may sign this only if the Ledger is logically consistent with the Urn Rules.
  *   **Payout:** If signed, **all** participants receive +6 Tokens if *every endorsed statement in the Ledger is true*. If *any* endorsed statement is false, all participants receive −6 Tokens.
  *   **Note:** If the Chief refuses to sign, no Guarantee tokens are exchanged.

  **Urn Rules:**
  1.  Exactly one ball will be drawn.
  2.  Every ball has an equal chance of being drawn.

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00–10 | **Setup** | Distribute cards (approx. 5-6 per student). Explain Scoring & Guarantee. |
  | 10–30 | **Endorsement** | Students publicly decide card-by-card. Clerk records. |
  | 30–45 | **Audit** | Auditors check Ledger against Urn Rules. Crisis emerges. |
  | 45–60 | **Repair** | Group discusses withdrawals to satisfy Auditors. |
  | 60–70 | **Sign & Draw** | Chief signs (if allowed). Live draw. Token settlement. |
  | 70–80 | **Epilogue** | Preface Paradox activity (Report writing). |
  | 80–90 | **Debrief** | Connect activity to epistemological concepts. |

  ## 4. Exact Words (Scripted Moments)

  **A. Opening (Minute 0)**
  > "Welcome back. We've been discussing how rational agents align their confidence with evidence. Today, we test that alignment under institutional constraints. You hold cards describing the outcome of a draw that will happen at the end of class. Your goal is to maximize your token score. The scoring rule is on your handout; verify the break-even point yourself. There is also a collective Guarantee available, but it has a strict condition: I will not sign it if the Ledger describes an impossible world. You have thirty minutes to record your decisions. Begin."

  **B. The Auditors' Charge (Minute 30)**
  > *(After the Clerk marks all 100 cards as 'Endorse')*
  > "Auditors, your task is not to calculate odds. Your task is to check for logical consistency between the Ledger and the Urn Rules. If the Ledger asserts a state of affairs that the Urn Rules declare impossible, you must flag it. Report only on possibility, not probability."

  **C. The Chief's Decision (Minute 60)**
  > *(After the group has withdrawn exactly one endorsement to fix consistency)*
  > "The Ledger is now logically consistent. It describes a possible world. I will sign the Guarantee. However, remember: the payout depends on truth, not consistency. Prepare for the draw."

  ## 5. Mathematical Verification & Scenario Workouts

  **Break-Even Credence:**
  *   $EV = (P \times 1) + ((1-P) \times -9)$
  *   $0 = P - 9 + 9P \Rightarrow 9 = 10P \Rightarrow P = 0.9$.
  *   *Verification:* Correct. Since the probability of any specific ball *not* winning is 0.99, rational expected-value maximizers must **Endorse** every card.

  **Scenario 1: Everyone Endorses Everything**
  *   **Ledger:** $\neg B_1, \neg B_2, ..., \neg B_{100}$ (Ball 1 won't win, Ball 2 won't win...).
  *   **Urn Rule:** $B_1 \lor B_2 \lor ... \lor B_{100}$ (Exactly one ball will win).
  *   **Audit Result:** **Inconsistent.** The conjunction of the Ledger implies *no* ball wins.
  *   **Guarantee:** Chief refuses to sign. Payoff = 0.
  *   **Individual Score:** 99 students get +1, 1 student gets -9. Net group score = +90. (But Guarantee lost).

  **Scenario 2: One Withdrawal (The Repair)**
  *   **Action:** Group withdraws endorsement on Card #42 (arbitrary).
  *   **Ledger:** $\neg B_1, ..., \text{Abstain}_{42}, ..., \neg B_{100}$.
  *   **Audit Result:** **Consistent.** It is possible that Ball #42 is the winner.
  *   **Guarantee:** Chief signs.
  *   **Probability of Payout:** The Guarantee pays only if *all endorsed* claims are true. This requires Ball #42 to be the winner (so that all "Not Ball $X$" claims hold).
  *   **Chance:** 1/100 (0.01).
  *   **The Tension:** To unlock the Guarantee, the group must make the Guarantee almost certainly fail (1% chance of +6, 99% chance of -6).
  *   **Marginal Value:** Withdrawing a *second* card (e.g., #43) keeps the Ledger consistent but raises the Guarantee win chance to 2/100. However, since the choice of #42 was arbitrary (no evidence distinguished it), withdrawing #43 is equally arbitrary. The "repair" is a single, unjustified exception.

  ## 6. Epilogue: The Preface Mechanism (10 Minutes)
  1.  **Task:** The group co-authors a "Session Report" of 12 sentences.
  2.  **Content:** Factual claims about the room/session (e.g., "The urn is blue," "Eighteen students are present," "The scoring rule allows abstention"). These should be high-credence but empirically checkable.
  3.  **The Clause:** The group must vote on appending a 13th sentence: *"At least one sentence in this report is false."*
  4.  **The Trap:**
      *   If they believe the 12 sentences are true, adding the 13th creates a contradiction (The Report asserts $P_1...P_{12}$ and $\neg(P_1 \land ... \land P_{12})$).
      *   If they believe the 13th sentence (acknowledging fallibility), they logically cannot endorse the conjunction of the first 12.
      *   **Discussion:** Ask them to calculate the probability of the 13th sentence given their confidence in the first 12. (If each is 95% confident, the conjunction is ~54% likely, making the 13th sentence ~46% likely. But intuitively, they *know* they are fallible).

  ## 7. Debrief (10 Minutes)

  **Mapping the Room to the Problem:**
  *   **Endorsement Phase:** Modeled **Probabilism**. You endorsed because $0.99 > 0.90$.
  *   **Audit Phase:** Modeled **Logical Closure**. The Auditors enforced that if you believe $P$ and believe $Q$, you cannot deny $P \land Q$.
  *   **The Repair:** Modeled the **Arbitrary Exception**. Withdrawing Card #42 had no evidential basis; it was purely to satisfy logic.
  *   **The Epilogue:** Modeled **Fallibilism**. Acknowledging error in the whole while maintaining confidence in the parts.

  **The Labels:**
  *   "The structure you just navigated with the urn is known as **the lottery paradox**."
  *   "The structure you just navigated with the report is known as **the preface paradox**."
  *   (Do not attach names, dates, or titles).

  **Escape Routes & Prices:**
  1.  **Raise the Threshold:** Require certainty (P=1.0) to endorse. *Price:* Skepticism. You can never endorse empirical claims.
  2.  **Refuse Conjunction:** Accept every conjunct ($\neg B_1...$) but refuse the conjunction ($\neg B_1 \land ...$). *Price:* Violates standard logic (Closure).
  3.  **Distinguish Acceptance from Belief:** "Accept" for the sake of the game, but don't "Believe." *Price:* Creates a dual-track psychology difficult to maintain.
  4.  **Deny Justified Belief in Lotteries:** Claim statistical evidence alone never justifies belief. *Price:* Undermines much of scientific induction.
  5.  **Contextual Fallibility:** Treat the "one is false" claim as a different *kind* of claim (meta-level) than the report sentences (object-level). *Price:* Requires complex hierarchical logic.

  ## 8. Limitations (Instructor Note)
  **What this activity cannot reproduce:**
  You must assert this in your own voice; the game cannot show it. First, the activity models **acceptance as a scored bet**, not belief proper. Students may treat endorsement as a pragmatic move rather than a doxastic state, allowing them to bypass the tension by saying "I didn't *believe* it, I just bet on it." You must press that in epistemology, acting on high credence *is* the operational definition of belief. Second, the activity cannot reproduce the **inductive, first-person basis of the preface sentence**. In the game, the fallibility clause is a logical add-on. In reality, the author's belief in their own fallibility comes from a lifetime of error, not a calculation of the current text's probability. The game makes the preface sentence look like a probabilistic inference; in reality, it is often a standalone, non-inferential conviction.

  ## 9. Predictable Problems & Fixes
  1.  **"I only find it probable, I don't believe it."**
      *   *Fix:* Do not argue semantics. Point to the Scoring Rule. "The rule rewards 'Endorse' at 0.99 credence. If you Abstain, you are leaving free tokens on the table. Are you irrational, or is the rule wrong?" Force them to own the endorsement.
  2.  **"Let's just sacrifice Card #100."**
      *   *Fix:* The Auditors must intervene. "Is there evidence distinguishing #100 from #1?" If they say no, point out the arbitrariness. "You are amputating a limb to save the body, but choosing the limb by rolling dice. Is that rational repair?"
  3.  **Auditors check arithmetic instead of consistency.**
      *   *Fix:* Remind them of their Charge. "Does 1+1=2 matter? No. Does 'No ball wins' contradict 'One ball wins'? Yes. Check the logic, not the odds."

  ## 10. The 50-Minute Cut
  If you must run this in 50 minutes:
  1.  **Cut the Epilogue:** Drop the Preface Report entirely. Focus solely on the Lottery structure.
  2.  **Pre-Deal Cards:** Have cards already distributed as students enter.
  3.  **Compress Endorsement:** Instead of 100 cards, use **10 balls**. Adjust Scoring: Endorse True +1, False -9 (Break-even still 0.9). Probability of loss is 0.9 per card. This makes the tension tighter (0.9 vs 0.9 break-even) but faster to process. *Correction:* Keep 100 balls but have the Clerk record "Block Endorsements" (e.g., "Cards 1-50: Endorse") to save time, then audit the whole block.
  4.  **Shorten Debrief:** Focus only on the Conflict between Probabilism and Closure. Skip the detailed list of escape routes; ask students to propose one solution and critique it immediately.
  5.  **Guarantee Simplification:** Make the Guarantee payout immediate upon signature (based on expected value) rather than waiting for the draw, if time is critical, though live draw is preferred for impact. (Better: Keep the draw, it only takes 2 minutes).

  **Revised 50-Min Timeline:**
  *   00-05: Setup & Rules.
  *   05-20: Endorsement (Block recording).
  *   20-30: Audit & Crisis.
  *   30-40: Repair & Sign.
  *   40-45: Draw & Settle.
  *   45-50: Debrief (Lottery Paradox only).
