  **Joint Statement on Comparative Cognition Framework**

  **Agreed Claims**

  1.  **Darwinian Rung:** Competence fixed by selection is paid for in mortality across generations, not within a lifetime.
  2.  **Modes not Taxonomy:** The ladder denotes modes of operation, not species; individual organisms occupy multiple rungs across contexts.
  3.  **Multiple Realizability:** One behavioural profile can be produced by more than one mechanism; no test battery alone settles which mode is in play.
  4.  **The Metric:** The quantity that increases up the ladder is the degree to which action selection is decoupled from immediate environmental consequences.
  5.  **Scope:** The ladder is not a theory of consciousness, nor a strict phylogenetic sequence.

  **Residual Disagreements**

  | Question at Issue | Fair Formulation | Crux | Test / Case | Side A (Kind) Prediction | Side B (Degree) Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The S–P Transition** | Is the shift from Skinnerian to Popperian categorical or continuous? | A: Distinct mechanism required.<br>B: Continuum of decoupling. | Can associative machinery simulate planning without a model? | Neural imaging reveals distinct module for off-line selection. | Same network shows gradient of activation intensity. |
  | **2. Stored Disposition Table** | Does perfect behavioral mimicry imply Popperian mechanism? | A: Mechanism defines rung.<br>B: Function defines rung. | Creature with vast lookup table matches Popperian performance. | **Still Skinnerian.** Internal structure dictates classification. | **Functionally Popperian.** Input-output defines classification. |
  | **3. Gregorian Tool Removal** | Does competence survive tool removal? | A: Tool reveals underlying kind.<br>B: Tool shows degree of coupling. | Remove numerals/notation; measure performance drop. | Loss is evidence tool was doing part of the computation. | Loss is mere retrieval cost; competence remains internal. |
  | **4. Neural Signature** | Is there a specific signature for off-line selection? | A: Unique architecture.<br>B: Usage pattern. | Compare neural activity during planning vs. habit. | Distinct network active during planning. | Same network, different activation pattern. |

  *Note on Row 2:* This disagreement is verbal regarding the label 'Popperian', but substantive regarding whether mechanism matters for cognitive classification. Both agree on the physics of the creature.

  *Note on Row 3:* Both sides endorse the test, but disagree on the interpretation of performance loss (computation vs. retrieval).

  **Signatories:** Colleague A, Colleague B.
