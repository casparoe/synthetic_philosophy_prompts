answer: |-
  The puzzle you are grappling with is often called the Knobe Effect, though for your purposes, it is better understood as the problem of *moral penetration*. The core question is whether the folk concept of "intentional action" is a purely psychological description (a mental state causing a movement) or a moral verdict (a judgment of accountability).

  To render your administrator's inner life honestly, you must decide which of the three leading theoretical accounts governs her world. These accounts differ on what drives the asymmetry: Is it the **moral badness** of the outcome, the **violation of a norm**, or the **pragmatic need to blame**?

  Here is the conceptual map, tested against your three variants.

  ### The Three Competing Accounts

  1.  **The Moral Valence Account:** This view holds that moral judgment is constitutive of the concept of intentionality. We cannot help but see a bad outcome as intentional because our moral outrage rewrites the psychological description. The mind does not separate "what happened" from "how bad it was."
  2.  **The Normative Deviation Account:** This view argues that intentionality tracks *abnormality*, not just morality. An outcome is judged intentional if it deviates from the expected course of events or the agent's prescribed role. If an agent acts "as they should," the outcome is a mere side effect; if they act "out of bounds," it is intentional.
  3.  **The Blame-Driven Pragmatics Account:** This view suggests the concept of intentionality is a tool for social sanctioning. We do not have a fixed concept; we stretch or shrink the definition of "intentional" to fit the amount of blame or praise we wish to assign. It is post-hoc rationalization, not perception.

  ### Testing the Variants

  #### Variant 1: The Harm Case (Standard Asymmetry)
  *Scenario:* Administrator redirects funds. Efficiency gains (Goal). Clinic starved (Side Effect). Agent indifferent to clinic.
  *   **Moral Valence:** Predicts **Intentional**. The outcome is morally bad. The badness penetrates the psychological assessment.
  *   **Normative Deviation:** Predicts **Intentional**. She violates the norm of care toward vulnerable populations, even if she follows efficiency metrics.
  *   **Blame Pragmatics:** Predicts **Intentional**. We want to blame her for the suffering; therefore, we certify the act as intentional to make blame stick.
  *   **Verdict:** **Muddied.** All three accounts converge here. This variant cannot distinguish between them because moral badness, norm violation, and blameworthiness are perfectly aligned. For your novel, this is the easy case: the reader will unanimously condemn her and call it intentional.

  #### Variant 2: The Benefit Case (Reverse Asymmetry)
  *Scenario:* Administrator redirects funds. Majority burdened (Side Effect). Clinic helped (Side Effect). Agent indifferent to clinic.
  *Note: To test the asymmetry, we must ask if the *benefit* to the clinic is intentional, parallel to the harm in Variant 1.*
  *   **Moral Valence:** Predicts **Not Intentional**. The outcome is good. We do not need to blame, so we do not attribute intentionality to the side effect, even if foreseen.
  *   **Normative Deviation:** Predicts **Not Intentional** (regarding the help). Helping the stigmatized clinic might be statistically rare or outside her mandate, but usually, this account predicts that *positive* deviations are treated as lucky accidents unless specifically aimed at. However, if burdening the majority is the "violation," the account might predict intentionality regarding the *burden*, creating a split judgment.
  *   **Blame Pragmatics:** Predicts **Not Intentional**. We have no urge to blame her for helping the clinic. We might blame her for burdening the majority, but regarding the help, we withhold the label.
  *   **Verdict:** **Muddied.** The complication here is dual side effects. If the reader focuses on the burdened majority, they might call *that* intentional. If they focus on the helped clinic, they likely won't. This variant reveals that "intentional" is sensitive to *which* side effect is being queried, but it doesn't cleanly separate Moral Valence from Norm Deviation because both predict a lack of intentionality for the *benefit*.

  #### Variant 3: The Rule-Bound Harm Case (The Crucial Test)
  *Scenario:* Harm to clinic is *required* by a rule she is bound to follow. She conforms to the institutional norm. Harm occurs.
  *   **Moral Valence:** Predicts **Intentional**. The outcome is still morally bad (starving a clinic). The fact that a rule required it does not wash away the badness. The moral stain penetrates the judgment regardless of institutional cover.
  *   **Normative Deviation:** Predicts **Not Intentional** (or significantly reduced). She is not deviating from her prescribed role. She is acting exactly as the system expects. On this view, intentionality requires a sense of "going off script." If she is just a cog following a manual, the harm is a systemic outcome, not her intentional act.
  *   **Blame Pragmatics:** Predicts **Split/Contextual**. If the reader believes the rule is an excuse, they will withhold "intentional" to withhold blame. If the reader believes "following orders" is no excuse (e.g., Nuremberg logic), they will assign "intentional" to ensure blame lands. This account predicts the judgment will fluctuate based on the reader's attitude toward bureaucracy, not the act itself.
  *   **Verdict:** **Clean Test.** This is where the accounts come apart.
      *   If your readers say, "She did it intentionally, even if it was the rule," they are operating on **Moral Valence**.
      *   If they say, "She didn't intend it; she was just following protocol," they are operating on **Normative Deviation**.
      *   If their answer changes based on whether they think the rule is legitimate, they are operating on **Blame Pragmatics**.

  ### Checklist vs. Context-Sensitive Concept

  Your question about whether the folk concept is a checklist or context-sensitive is answered by the existence of the asymmetry itself.

  If intentionality were a **checklist** (e.g., Did she know? Did she desire it? Did she cause it?), Variant 1 and Variant 2 would yield identical results. In both, she knows the outcome, she causes it, and she is indifferent (lacking specific desire). A checklist theory cannot explain why we call the harm intentional but the help unintentional.

  Therefore, the concept is **context-sensitive**. It is not a static container for psychological facts. It is a dynamic judgment that integrates psychological facts with normative expectations. For your novelist's purpose, this means your administrator's "intentionality" is not a fact inside her head; it is a verdict rendered by the community observing her. Her inner life might feel the same in Variant 1 and Variant 2 (indifference), but the world will describe her differently.

  ### Current State of the Debate and the Decisive Experiment

  The debate currently stands at a stalemate between the **Moral Valence** account and the **Normative Deviation** account. The Blame Pragmatics account is generally seen as explaining *why* we make the judgment, but not *how* the concept is structured.

  The stalemate exists because "moral badness" and "norm violation" usually travel together. To break it, one must isolate badness from norm violation.

  **The Decisive Experiment:**
  A decisive experiment would require a scenario where an outcome is **morally bad** but **normatively required**, versus **morally bad** and **normatively forbidden**, while holding psychological states constant.

  Your **Variant 3** is precisely this experiment. To make it scientifically decisive (rather than just philosophically suggestive), one would need to control for the *legitimacy* of the rule.
  *   **Condition A:** The rule is widely viewed as legitimate (e.g., a triage protocol during a plague).
  *   **Condition B:** The rule is widely viewed as illegitimate (e.g., a discriminatory policy).

  If readers judge the harm as **Intentional in B** but **Not Intentional in A**, the **Normative Deviation** account wins (intentionality tracks rule-breaking, not just harm).
  If readers judge the harm as **Intentional in both A and B**, the **Moral Valence** account wins (badness alone drives the judgment).

  **Current Consensus:**
  Recent work leans toward a hybrid view: **The Normative Account is dominant, but Moral Norms are the strongest norms.** That is, we treat moral rules as the ultimate "script." So, even if an institutional rule requires harm (Variant 3), if that institutional rule violates a deeper moral norm, readers will likely still call it intentional. They treat the moral norm as the "real" rule and the institutional one as invalid.

  ### Implications for Your Novelist's Rendering

  1.  **The Inner Life vs. The Outer Verdict:** Your administrator may feel she is *not* acting intentionally in Variant 3 (she is just following the script). But if you want the reader to feel the weight of her agency, you must write the scene such that the *moral norm* overshadows the *institutional norm*. If she feels the moral weight, the reader will call it intentional. If she feels only bureaucratic compliance, the reader may let her off the hook.
  2.  **Indifference is Key:** In all three variants, her indifference is the engine of the puzzle. If she *wanted* the clinic to starve, it would be intentional in all accounts. The asymmetry only exists because she is indifferent. Her indifference forces the reader to supply the moral valence from their own judgment, not hers.
  3.  **Use Variant 3 for Conflict:** Variant 1 is too easy; the reader will condemn her. Variant 3 is where the philosophical tension lives. If you want to explore whether she is a monster or a bureaucrat, Variant 3 is the arena. If she hides behind the rule, and the reader still calls it intentional, you have proven the Moral Valence thesis in narrative form: morality cannot be bureaucratized away.

  **Summary Recommendation:**
  Treat the concept of "intentional" in your book not as a fact your character possesses, but as a verdict your character fears. In Variant 1, she fears the verdict. In Variant 3, she hopes the rule will shield her from the verdict. The tension of the book can rest on whether the shield holds. The conceptual map suggests the shield will not hold against a morally bad outcome, but it might weaken the attribution of intentionality enough to create the ambiguity you need for a complex character.
