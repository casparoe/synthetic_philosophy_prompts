prompt: |-
  As a side project I've been writing a small program that takes an action I'm considering, strips out the details that seem particular to me, and checks whether the resulting rule could be adopted by everyone at once without contradiction. I had assumed Kant's universalizability test was essentially a consistency check of this kind, so the program should reproduce a careful human's verdict on any case. In practice the verdict moves with my phrasing: the same act fails when I describe it as skipping a meeting I promised to attend, passes when I describe it as protecting my health on a day when the meeting would have exhausted me, and fails again when I enter something plainly permissible, such as my decision to train as an engineer rather than a doctor, because a world where everyone did that would have no doctors. If the test is a formal requirement that a rule hold consistently when universalized, shouldn't there be a single correct description of any given action, so that the verdict is fixed rather than left to my wording? Where is that description supposed to come from?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Project:** A program implementing Kant's Categorical Imperative (specifically the Formula of Universal Law).
      *   **Mechanism:** Takes an action, abstracts details, universalizes the maxim, checks for contradiction.
      *   **Issue:** The verdict changes based on how the action is described (framing problem).
          *   Case 1: "Skipping a promised meeting" $\rightarrow$ Fails (contradiction in conception/will).
          *   Case 2: "Protecting health when exhausted" $\rightarrow$ Passes.
          *   Case 3: "Training as an engineer not a doctor" $\rightarrow$ Fails (world with no doctors).
      *   **User's Assumption:** There should be a *single correct description* of any action, making the verdict fixed and objective.
      *   **Core Question:** Where does the correct description come from? Is the test purely formal, or does it rely on something else?

  2.  **Diagnose the Philosophical Issue:**
      *   This is the classic "Problem of Relevant Descriptions" or the "Maxim-Fixing Problem" in Kantian ethics.
      *   Kant himself didn't provide a strict algorithm for formulating maxims.
      *   The user's program highlights a well-known criticism/feature of Kantian ethics: the flexibility of maxim formulation allows for rationalization.
      *   Case 3 (Engineer vs. Doctor) is a specific type of contradiction often discussed (contradiction in will vs. conception, and the issue of "necessary ends").
      *   The assumption that there is a "single correct description" is the crux of the error. Kantian maxims are subjective principles of volition, not objective descriptions of physical events.

  3.  **Formulate the Response Strategy:**
      *   **Validate:** Acknowledge that this is a profound and well-recognized problem in Kant scholarship (not a bug in the code, but a feature of the philosophy).
      *   **Correct the Assumption:** Explain that there is *no* single correct description independent of the agent's intention. The maxim includes the *reason* for acting.
      *   **Address the Specific Cases:**
          *   *Skipping the meeting:* Distinguish between the motive (laziness vs. health).
          *   *Engineer vs. Doctor:* Explain why this universalization fails (it's not a duty to be a doctor, but a duty to pursue perfection/happiness, and the contradiction arises from willing a world where necessary ends are impossible).
      *   **Explain the Source of the Description:** The description comes from the agent's *subjective principle of volition* (the "maxim"). It must be honest and capture the true intent.
      *   **Discuss the "Formalism" Critique:** Address the user's expectation that the test should be purely formal/algorithmic. It requires moral judgment *before* the test is applied.
      *   **Suggest Refinements:** How might the program account for this? (e.g., requiring the "because" clause, checking against perfect vs. imperfect duties).

  4.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* You've discovered the "Maxim-Fixing Problem." It's the biggest hurdle in applying Kant.
      *   *The Nature of a Maxim:* It's not just "what I do," it's "I will do X in circumstance Y for reason Z." The user's program might be stripping too much or too little.
      *   *Case 1 & 2 (The Meeting):* The difference isn't wording; it's the *motive*. If the motive is convenience, it fails. If the motive is self-preservation (a duty), it passes. The program needs to capture the *end*, not just the *action*.
      *   *Case 3 (Engineer vs. Doctor):* This is the "World without Doctors" objection. Kant's reply involves "Imperfect Duties." We have a duty to develop talents, but not a duty to develop *every* talent or a *specific* one. Universalizing "I will choose career A over B" doesn't mean *no one* chooses B. It means everyone follows the principle of choice. The contradiction only arises if the principle makes the *choice itself* impossible.
      *   *Where does the description come from?* From the agent's rational will. It requires introspection. You can't automate the *formulation* of the maxim easily because it requires moral honesty.
      *   *The "Formal Requirement" Misconception:* Kant's test isn't a logic gate that runs on raw data. It's a test of *rationale*. The input (the maxim) is already morally laden.
      *   *Conclusion:* The program is a great tool for thinking, but it can't replace the moral agent's responsibility to formulate the maxim truthfully.

  5.  **Refining the Philosophical Nuance (Self-Correction):**
      *   *Correction on Case 3:* I need to be careful. The user says "a world where everyone did that would have no doctors." This is a contradiction in *conception* if the maxim is "I will be an engineer *and no one should be a doctor*." But if the maxim is "I will choose the career that fits my talents," then universalizing that *allows* for doctors (people with medical talents). The error is in the level of abstraction.
      *   *Key Distinction:* Perfect vs. Imperfect Duties. Skipping a promise is a Perfect Duty (strict). Career choice falls under Imperfect Duty (latitude). The test works differently for each.
      *   *Onion's Point:* The description comes from the *agent's intention*. There is no "view from nowhere."

  6.  **Final Polish:** Structure the answer clearly. Use headings. Keep the tone encouraging but philosophically rigorous. Ensure the distinction between "action description" and "maxim formulation" is clear. (The user calls it "description," Kant calls it "maxim.")

  7.  **Final Review against User Query:**
      *   Did I answer "Where is that description supposed to come from?" Yes (the agent's subjective principle).
      *   Did I address the "single correct description" assumption? Yes (challenged it).
      *   Did I address the specific examples? Yes.

  8.  (Mental Check): Make sure not to sound like I'm dismissing the program. It's a valuable heuristic, just not an algorithm.

  9.  *Constructing the response...* (Proceeds to generate output based on these thoughts.)
answer: |-
  You have independently rediscovered one of the most persistent and significant challenges in Kantian ethics: **the problem of maxim formulation** (sometimes called the "problem of relevant descriptions").

  Your intuition is correct: if the test were purely formal, the input (the description of the act) would need to be fixed objectively. But in Kant's system, the input is not an objective description of a physical event; it is a **maxim**, which is a *subjective principle of volition*.

  Here is where the description is supposed to come from, why your program yields different results, and why there is no "single correct description" independent of the agent's intent.

  ### 1. A Maxim Is Not an Action Description
  Your program seems to treat the input as a description of an event (e.g., "Person skips meeting"). But for Kant, a maxim has a specific tripartite structure:
  > "I will do **Action X** in **Circumstance Y** for the sake of **End/Purpose Z**."

  The verdict changes in your examples not because the *wording* is arbitrary, but because you are actually changing the **End (Z)**.

  *   **Case 1:** "I will skip a promised meeting (X) when I don't feel like it (Y) to save myself effort (Z)."
      *   *Universalized:* Everyone breaks promises when inconvenient.
      *   *Result:* Contradiction in conception. Promises become meaningless. **Fail.**
  *   **Case 2:** "I will skip a promised meeting (X) when attendance threatens my health (Y) to preserve my well-being (Z)."
      *   *Universalized:* Everyone prioritizes self-preservation over social obligations when health is at risk.
      *   *Result:* No contradiction. We have a perfect duty to others, but also a duty to self. Conflicts of duty are resolved by hierarchy. **Pass.**

  The description doesn't come from an external observer; it comes from **your honest introspection regarding why you are acting.** If you lie to yourself about the purpose (claiming "health" when you mean "laziness"), the test will validate a lie. This is why Kant emphasizes that morality requires moral honesty; the formal test cannot detect a dishonestly formulated maxim.

  ### 2. The Engineer vs. Doctor Problem (Imperfect Duties)
  Your third case highlights a different nuance: the distinction between **Perfect** and **Imperfect** duties.

  *   **The Input:** "I will train as an engineer rather than a doctor."
  *   **Your Universalization:** "Everyone trains as an engineer; no one is a doctor."
  *   **The Verdict:** Contradiction (society collapses).

  This is a classic objection to Kant, but the error lies in the level of abstraction. The duty to develop one's talents is an **Imperfect Duty**. It requires us to cultivate *some* talents, but it gives us latitude (choice) regarding *which* ones.

  The correct maxim formulation is not "I will be an engineer." It is: **"I will choose a career path that aligns with my aptitudes and contributes to society."**

  If *everyone* adopts the rule "Choose the career that fits your aptitudes," some people will be engineers and some will be doctors. There is no contradiction. The contradiction only arises if you formulate the maxim as "I will be an engineer *and* I will prevent others from being doctors," which is not your actual intention.

  Your program fails here because it universalizes the *specific content* of the choice rather than the *principle of choice*.

  ### 3. Where Does the Description Come From?
  You asked: *"Shouldn't there be a single correct description of any given action?"*

  **No.** In Kantian ethics, there is no "view from nowhere." An action has no moral color until it is adopted by a will. A physical movement (raising an arm) can be a greeting, a signal to attack, or a stretch, depending on the maxim.

  The description comes from **the agent's rational will.** It is the bridge between your internal motivation and the external world. This means:
  1.  **It is subjective:** It depends on what *you* are actually trying to do.
  2.  **It is normative:** Formulating the maxim is already a moral act. You must describe your action truthfully and at the right level of generality.

  ### 4. Why the Test Cannot Be Fully Algorithmic
  You assumed the universalizability test was a "consistency check" that could reproduce a careful human's verdict. In practice, philosophers agree that the test is not a **decision procedure**; it is a **test of justification**.

  *   **Decision Procedure:** Input act $\rightarrow$ Output Verdict (Right/Wrong).
  *   **Test of Justification:** Input Maxim (Act + Reason) $\rightarrow$ Check if Reason is compatible with Rational Agency.

  The "work" is done in formulating the maxim, not in running the universalization logic. If you can game the description, you can game the test. This is why Kant scholars argue that the Categorical Imperative cannot be used in isolation; it relies on a prior understanding of human goods, duties, and the nature of rational agency.

  ### Suggestions for Your Program
  If you want to refine the project, you might consider hardcoding the structural requirements of a Kantian maxim to prevent the "framing" issue:

  1.  **Require the "Because" Clause:** Force the user to input the *End* (the goal), not just the *Action*.
  2.  **Distinguish Duty Types:** Allow the user to tag the maxim as relating to a Perfect Duty (strict rules like lying/promises) or an Imperfect Duty (goals like self-improvement/beneficence). The contradiction test works differently for each (Contradiction in Conception vs. Contradiction in Will).
  3.  **Check for "Necessary Ends":** For the Engineer/Doctor case, the program should check if the universalization makes the *goal* impossible, or just a specific *path* impossible. If the goal is "contribute to society," a world of only engineers might still satisfy that, whereas a world of no promise-keepers destroys the concept of promising.

  ### Summary
  The verdict moves with your phrasing because **the moral quality of the act resides in the phrasing (the maxim), not the physical movement.** There is no single correct description of the *act*, only a truthful description of the *intention*.

  Your program is an excellent tool for exposing rationalization. When you find that changing the phrasing changes the verdict, the program isn't failing; it is correctly signaling that you need to interrogate which description actually matches your true intent. That interrogation is the moral work the test is designed to provoke.
