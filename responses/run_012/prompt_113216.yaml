answer: |-
  1. The practice presupposes that political authority stems from deliberative legitimacy, where decisions gain weight through reasoned consensus under fair conditions rather than mere numerical superiority. It claims that a judgment formed without coercion, misinformation, or strategic voting reflects the public interest more authentically than an aggregate of raw preferences.
  2. It assumes that individual opinions are not fixed private properties but malleable judgments that can be distorted by polarization or improved through exposure to diverse viewpoints and evidence. Therefore, the expressed will of the people is something to be constructed through dialogue rather than simply counted as pre-existing data.
  3. Strictly required are random selection to ensure descriptive representation and trained facilitation to guarantee equitable dialogue, as these create the epistemic conditions for legitimacy. Merely suitable are the advisory status and the publication of vote breakdowns, which serve pragmatic transparency but do not constitute the core deliberative act itself.
  4. This framework quietly rules out aggregative democracy, which equates legitimacy with the sum of pre-existing preferences regardless of how they were formed. It also rejects epistocracy, denying that a specialized elite holds exclusive claim to wisdom, while simultaneously rejecting pure majoritarianism that ignores the quality of informed consent.
  5. If the goal were straightforward preference aggregation, the random selection and facilitation would be obsolete obstacles replaced by universal suffrage and secret ballots to maximize sample size. The briefing materials and advisory status would become irrelevant, as the theory would prioritize the intensity and count of initial impulses over the quality of the final reasoned judgment.
