answer: |-
  Your proposal to mitigate the cluelessness objection by restricting moral deliberation to a fifty-year horizon is a pragmatic attempt to make consequentialism action-guiding, but it relies on assumptions about causal decay and value distribution that are philosophically and empirically contentious. While it is true that consequentialists routinely handle uncertainty by maximizing expected value, the cluelessness objection highlights a specific kind of deep uncertainty where the probabilities are not merely poorly estimated but are potentially unknowable due to the complexity of causal chains. Your suggestion treats this as a matter of degree rather than kind, assuming that because we cannot know everything, we should know what is close. This is a reasonable heuristic for daily life, but as a foundational modification to consequentialist theory, it risks ignoring the very consequences that might matter most.

  The claim that causal influence decays with time is not universally true, particularly in complex systems where small inputs can trigger tipping points or lock-in effects that persist for centuries. For example, actions taken today regarding artificial intelligence development, nuclear proliferation, or climate change infrastructure may have negligible effects in the short term but could determine the trajectory of civilization for millennia. If an action slightly increases the probability of an existential catastrophe within the next two hundred years, the expected value of preventing that catastrophe dwarfs almost any benefit achievable within a fifty-year window. By arbitrarily truncating the timeline, you risk assigning zero value to these long-term stakes, which could lead to decisions that are optimal in the short run but catastrophic in the long run. Therefore, fifty years is likely too short a horizon for a robust consequentialist calculus, as it excludes the domain of existential risk and structural institutional change where the magnitude of consequences is highest.

  Regarding the reliability of predictions, consequentialism does not require perfect foresight to be usable, but it does require that the signal of expected value exceeds the noise of uncertainty. A decision procedure becomes unusable when the confidence intervals of your predictions are so wide that any action looks equally good or bad, or when the model is systematically biased in a way that leads to worse outcomes than following simple moral heuristics. You do not need to predict the future with high precision, but you do need enough reliability to distinguish between actions that clearly increase well-being and those that clearly decrease it within your chosen window. However, if you restrict the window to fifty years to gain reliability, you must accept that you are no longer practicing pure consequentialism but rather a form of myopic consequentialism, which admits that it might sacrifice the greater good of the distant future for the lesser good of the near future.

  Ultimately, the soundness of your approach depends on whether you view consequentialism as a theory of the right that demands actual optimization of the good, or as a decision procedure for agents with limited cognitive capacities. If it is the latter, your fifty-year rule might be a necessary bound for psychological feasibility, but it should be recognized as a concession to human limitation rather than a metaphysical truth about value. A more robust approach might involve keeping the horizon open indefinitely while applying a discount rate to future value, though even this is controversial because it implies that the lives of future people matter less than those of present people. To answer your question directly, predictions need only be reliable enough to consistently outperform alternative decision-making methods like following common sense moral rules, but the fifty-year horizon is likely too restrictive to capture the full scope of moral responsibility, especially concerning risks that threaten to eliminate the possibility of any future value at all.
