answer: |-
  You have identified two of the most persistent pathologies in philosophical and scientific explanation. They are well-known to philosophers of mind and science, though they rarely appear under a single unified label.

  To answer your primary question: **There is no single established term that perfectly captures both as a unified error,** because they operate in opposite directions (one eliminates the phenomenon, the other duplicates it). However, they are best understood as two species of the same genus: **Explanatory Premature Closure.**

  Here is the breakdown of the existing terminology, where it fits, where it falls short, and the criterion that separates the cheat from the achievement.

  ### 1. Form One: The Reductive Stop
  *The Move:* Explaining $X$ by asserting it is "nothing but" $Y$ (where $Y$ is a lower-level substrate), without showing how $Y$ generates the specific properties of $X$.

  **Established Terms:**
  *   **"Nothing-buttery":** Coined by Gilbert Ryle. He used it to describe the tendency to say "mind is nothing but behavior" or "love is nothing but chemistry." It captures the grammatical dismissiveness.
  *   **"Greedy Reductionism":** Popularized by Daniel Dennett. This is the strongest fit. It describes the attempt to skip levels of organization. A "good" reduction respects the hierarchy (chemistry $\to$ biology $\to$ psychology); a "greedy" reduction tries to go straight from physics to psychology, losing the functional architecture in between.
  *   **"The Explanatory Gap":** Coined by Joseph Levine. This describes the *result* of the failed move (we still don't understand *why* the chemicals feel like love), rather than the move itself.

  **Why "Heat" Works but "Love" Fails:**
  You asked for the line between legitimate reduction and the cheat. The criterion is **Derivability of Functional Role.**

  *   **Heat (Legitimate):** When we say heat is molecular motion, we can mathematically derive the macroscopic laws of thermodynamics (pressure, temperature, expansion) from the statistical mechanics of the molecules. The higher-level properties are *conserved* and *reconstructed* in the lower-level account. Nothing essential is lost; the "heat" role is fully played by the "motion" actors.
  *   **Love (Illegitimate):** When we say love is neurochemicals, we cannot derive the *normative*, *phenomenological*, or *social* properties of love from the chemistry alone. Knowing the dopamine levels does not tell you why this state counts as a commitment, why it feels like longing, or why it entails specific obligations. The functional role of "love" is not reconstructed; it is merely pointed at.

  **Verdict:** This is a failure when it functions as **Eliminativism without Bridge Laws.** It is defensible only as a methodological heuristic ("Let's study the chemicals to find clues"), but false as an ontological conclusion ("Therefore love doesn't really exist").

  ### 2. Form Two: The Smuggled Feature
  *The Move:* Explaining $X$ by invoking a cause $Y$, where $Y$ already possesses the mysterious power of $X$.

  **Established Terms:**
  *   **"The Homunculus Fallacy":** Attributed to Gilbert Ryle and refined by Dennett. If you explain vision by saying "the brain contains a little man who sees the images," you haven't explained vision; you've just pushed the need for vision one step back.
  *   **"Dormitive Virtue":** From Molière's *The Imaginary Invalid*. A doctor explains that opium induces sleep because it has a "dormitive virtue" (sleep-inducing power). This is the classic label for explaining a phenomenon by naming a power that is identical to the phenomenon.
  *   **"Vitalism":** The specific historical instance of this regarding life (explaining life by a "life force").

  **The Nuance on "Virtual Machines":**
  You mentioned "the mind works because it runs a virtual machine." In computer science, this *can* be a legitimate explanation, provided the "virtual machine" is fully specified in terms of simpler logic gates. It becomes a Form 2 failure only if "virtual machine" is treated as a black box that magically possesses understanding. If the explanation stops at "virtual machine" without unpacking the computation, it is a **Homunculus.**

  **Verdict:** This is a failure of **Analysis.** It claims to analyze a complex capacity into simpler parts, but the parts are just as complex as the whole.

  ### 3. Are They One Error or Two?

  They are distinct moves, but they share a single structural vice: **The Illusion of Explanatory Depth.**

  In both cases, the explainer creates a feeling of understanding without actually increasing the predictive or integrative power of the theory.
  *   **Form 1** creates the illusion by **flattening** the world (denying the complexity of the higher level).
  *   **Form 2** creates the illusion by **inflating** the cause (attributing the complexity to the source).

  If you require a single term to cover both, the closest existing concept is **"Pseudo-Explanation."** However, if you wish to coin a term that captures the specific structural failure you identified, I propose:

  **Explanatory Nominalism**
  *Definition:* The error of believing that assigning a name (whether a lower-level name like "chemicals" or a higher-level name like "design") constitutes an account of the mechanism.
  *   *Form 1* is **Reductive Nominalism** (naming the substrate).
  *   *Form 2* is **Occult Nominalism** (naming the power).

  ### 4. Is There a Defensible Reading?

  You asked if these are genuinely failures or if they have a respectable setting.

  **Form 1 (Reductive Stop) is defensible as a Research Program.**
  Saying "morality is just evolutionary dispositions" is a bad *final* explanation, but a good *starting* hypothesis. It directs attention to the biological substrate. It fails only when it claims to be the *end* of the inquiry. If the writer says, "Morality is dispositions... and here is how those dispositions interact to create normative bindingness," it ceases to be a failure.

  **Form 2 (Smuggled Feature) is defensible as a Black Box.**
  In engineering and cognitive science, we often explain a system by positing a module with certain capacities (e.g., "a parser," "a designer"). This is acceptable **if and only if** there is a plan to unpack the black box later.
  *   **Legitimate:** "The eye acts *as if* designed." (This is a functional description, open to evolutionary analysis).
  *   **Illegitimate:** "The eye exists *because* it was designed." (This stops the inquiry).

  ### Summary of the Distinction

  | Feature | Form 1 (The Reductive Stop) | Form 2 (The Smuggled Feature) |
  | :--- | :--- | :--- |
  | **Direction** | Downward (to substrate) | Upward/Backward (to source) |
  | **Classic Term** | Greedy Reductionism / Nothing-buttery | Homunculus Fallacy / Dormitive Virtue |
  | **The Error** | Denying the emergent properties need explanation. | Assuming the cause has the properties needing explanation. |
  | **Legitimate Version** | **Reduction:** Deriving higher laws from lower laws (Heat). | **Functionalism:** Positing a module to be analyzed later (CPU). |
  | **Failure Condition** | When bridge laws are missing. | When the homunculus is unanalyzed. |

  **Recommendation:**
  If you are writing about this, do not force them into one label. Use **"Greedy Reductionism"** for the first and **"The Homunculus Fallacy"** for the second. They are distinct enough that conflating them will weaken your analysis.

  However, to answer your deepest question: **What separates the cheat from the achievement?**
  It is **Information Conservation.**
  *   In a good explanation (Heat), the information required to describe the phenomenon is preserved and translated into the new vocabulary.
  *   In a bad explanation (Love is chemicals / Mind is a VM), information is either deleted (the feeling of love) or presupposed (the intelligence of the designer).

  Both failures are attempts to bypass the hard work of showing **how** the lower-level facts organize to produce the higher-level reality.
