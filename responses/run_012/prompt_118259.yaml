answer: |-
  You have a very sharp grip on both the history and the theology, and your suspicion about where Aquinas hits the wall of modern totalitarianism is well-founded. Let's run the 20 July plot through the Thomistic mill, piece by piece, starting with your fact-check.

  ### 1. The Textual Check: Praise, Reward, and Cicero
  You are right to be skeptical about the "praise and reward" line, but it is actually Aquinas, not just Cicero. In *De Regno* (On Kingship), Book I, Chapter 6, Aquinas writes:

  > "Indeed, to kill a tyrant for the liberation of the country is praiseworthy and worthy of reward."

  He cites the example of Ehud in the Book of Judges and the classical tyrannicides. However, he immediately pivots to the New Testament and the risk of sedition. He notes that the Apostles did not kill Nero or Domitian, and he warns that attempting this often leads to the tyrant becoming more cruel or the liberators becoming tyrants themselves.

  So, your grasp is correct: the permission is there, but the caution is baked in. It is not a blanket endorsement of vigilante justice. In the *Summa Theologiae* (II-II, Q. 42, A. 2), he is stricter, classifying sedition as a mortal sin, but he distinguishes between resisting a tyrant (which can be lawful) and stirring up sedition (which is not). The distinction hinges on *authority*.

  ### 2. Tyrant by Title vs. Tyrant by Exercise
  You ask if Aquinas's argument requires the first kind (usurper) to get off the ground.

  Aquinas distinguishes between a tyrant *ex defectu tituli* (by defect of title, i.e., a usurper) and *ex parte exercitii* (by exercise, i.e., a legal ruler who rules badly).
  *   **Usurpers:** Aquinas is much more permissive here. A usurper has no legitimate claim, so the community (or a superior authority) can depose them.
  *   **Abusers:** This is the hard case. Aquinas argues that if a ruler is legal but tyrannical, removal is far more dangerous. He worries that the process of removal might cause more disorder than the tyranny itself.

  **Does this make a legal monster untouchable?** No. Aquinas does not say legal status grants immunity. He says the *threshold* for action is higher. The tyranny must be so excessive that it destroys the *common good* entirely. If the ruler is no longer ruling for the good of the community but for his own whim, he ceases to be a true ruler in the metaphysical sense, even if he holds the legal office.

  **Application to Hitler:** Hitler was legally Chancellor (via the Enabling Act). He is a tyrant by exercise. For Aquinas, this makes the plot riskier morally, not impossible. The justification rests on the total destruction of the common good (aggressive war, genocide, destruction of the rule of law). By 1944, the "common good" of Germany was being actively consumed by the regime. Aquinas would likely agree the *condition* for removal was met, even if the *agent* is problematic.

  ### 3. The Agent: Who Acts for the Community?
  This is where your suspicion hits the nerve. Aquinas insists that tyrannicide cannot be the act of a "private person" (*privatus*). It must be undertaken by "public authority."

  In a medieval framework, "public authority" means a superior lord (an Emperor over a King), the nobility, or the community acting through established institutions.
  *   **The Problem:** As you noted, Nazism dissolved the intermediate institutions. There was no Parliament, no independent judiciary, and the Army was sworn to Hitler *personally*, not the Constitution.
  *   **The Plotters:** Stauffenberg and Beck were, technically, private persons in Aquinas's eyes. They were state employees, but they lacked a constitutional mandate to depose the head of state.
  *   **The Counter-Argument:** The plotters argued that the *Wehrmacht* itself was the last remaining organ of the German state. If the Army is the sword of the community, and the community is enslaved, does the sword have the right to sheath itself or turn?

  **Aquinas's Verdict:** He would likely stumble here. He assumes a hierarchy where someone is always "above" the tyrant or alongside him with equal standing. In a totalitarian state, the tyrant *is* the state.
  However, Aquinas allows for the "community" to act. The question is: Can a handful of insiders represent the community when the community is silenced?
  *   **If No:** They are seditious private murderers.
  *   **If Yes:** They are acting as a "latent public authority."

  This is the break point. Aquinas has no theory for a "latent" community. He assumes the *res publica* is visible and institutional. When the institutions are criminalized, his framework lacks a mechanism to designate who speaks for the people. The plotters claimed to speak for the "conscience of the nation." Aquinas would ask: "Where is the mandate?" The plotters would answer: "The mandate is Natural Law." Aquinas respects Natural Law, but he prefers it to be mediated through positive law.

  ### 4. Consequences: Prudence or Morality?
  You ask if the warning about reprisals is a moral argument or a prediction. For Aquinas, it is both, because **Prudence (*Prudentia*) is a moral virtue.**

  It is not enough to intend the good (killing a tyrant); one must also choose the right means and circumstances. If an action is likely to produce a greater evil (e.g., a civil war that kills more people than the tyranny, or a worse tyrant taking over), then undertaking it is *imprudent*, and therefore morally flawed.

  **Application to 20 July:**
  *   **The Prediction:** The plot failed. The reprisals were horrific (thousands executed). The war continued.
  *   **The Moral Calculus:** Does the failure prove it was wrong? Not necessarily. Aquinas distinguishes between the *moral act* and the *outcome*. If the plotters acted with right reason, based on the information they had, and accepted the risk for the common good, the failure does not make the act sinful.
  *   **The Counter:** However, if they knew the chances were near-zero (which many generals argued), Aquinas might call it rashness (*temeritas*). Rashness is a vice opposed to prudence.

  But there is a deeper layer: Aquinas acknowledges that sometimes, enduring a tyrant is better than the chaos of removal. This is the "reward the crime" problem you identified. If the theory says "don't act because he's too strong," it effectively grants immunity to successful monsters.
  Aquinas's escape hatch is **martyrdom**. If the tyrant commands something against Divine Law, you must disobey, even if you die. But *killing* the tyrant is different from *disobeying* him. Aquinas is much more comfortable with passive resistance or martyrdom than active regicide by subordinates.

  ### 5. Where the Framework Runs Out of Road
  Your suspicion is correct: **Aquinas assumes a functioning polity.**

  His political theology relies on an organic hierarchy where authority flows from God through the people to the king. When the king breaks the law, the people (or their representatives) can retract the authority. But this assumes the "people" exist as a political entity.

  Totalitarianism does not just break the law; it atomizes the people. It destroys the "public" that Aquinas requires to authorize the killing.
  *   **The Gap:** Aquinas has no category for a "conspiracy of conscience." He cannot conceive of a situation where the *only* legitimate authority left is a small group of men acting on Natural Law against Positive Law, with no institutional backing.
  *   **The Oath:** Aquinas takes oaths seriously. The Wehrmacht oath to Hitler was a major theological hurdle for the plotters (many struggled with this). Aquinas would likely say breaking a sworn oath is a grave sin unless the oath itself was unlawful (swearing to do evil). Since Hitler was ordering evil, the oath was void. But who declares it void? Again, we return to the authority problem.

  ### 6. What Is Left of the Position?
  If we admit that Aquinas's institutionalism breaks down under totalitarianism, what remains?

  1.  **Natural Law Supremacy:** The core remaining principle is that Positive Law (Hitler's decrees) is subordinate to Natural Law (the good of the community, justice). When Positive Law becomes criminal, it ceases to be law (*lex iniusta non est lex*). This justifies *resistance*.
  2.  **The Shift from "Public Authority" to "Moral Necessity":** Modern resistance theory (developed partly *because* of experiences like this) shifts the justification from *who acts* (institutional standing) to *what is at stake* (existential evil).
  3.  **The Burden of Proof:** Aquinas's caution remains vital. It prevents romanticizing assassination. It forces the question: "Will this actually help?" The 20 July plotters asked this. They knew the odds. They proceeded anyway because the *moral necessity* of ending the regime outweighed the *prudential risk* of failure.

  **The Verdict:**
  Aquinas would likely condemn the *method* (private conspiracy) but acknowledge the *intent* (liberation of the country). He would be torn between the sin of sedition and the sin of enabling genocide.
  However, the episode breaks his framework because it reveals that in the modern age, "public authority" can be completely hijacked. When the state becomes the tyrant, the "community" has no voice but the conspiratorial one.

  If Aquinas were forced to rule on 20 July 1944, he would likely have to evolve his own theory: that when the public authority is totally corrupted, the duty to the common good devolves to those with the power to act, even if their standing is technically "private." The "community" is not just the institutions; it is the moral reality of the people. Stauffenberg didn't just act for himself; he acted as a trustee for a community that had been silenced.

  So, the framework doesn't vanish, but it stretches. The "public authority" requirement transforms from an institutional checklist into a moral mandate: *Whoever can act to restore the common good, must.* That is a dangerous doctrine, as Aquinas knew, but it is the only one that fits the catastrophe of the 20th century.
