      *   Standard Form: $C_0(A | C_t(A) = x) = x$. My current credence in A, conditional on my future credence in A being x, should be x.
      *   Condition: This holds if I believe my future self is rational and updating on evidence (conditionalization).
      *   The Problem of Forgetting: If I know I will forget evidence, my future credence might be rational *relative to my future evidence*, but irrational relative to my *current* evidence (which includes the fact that I will forget).
      *   The User's Insight: If "rational" means "rational given what they'll remember," then Reflection is trivial/predictive. If "rational" implies retaining evidence, then Reflection breaks when forgetting happens.
      *   The Volta: Realizing that deference requires evidence accumulation, not loss.

