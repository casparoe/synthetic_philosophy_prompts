  my mom's been having these spells where she forgets whole conversations, and I'm her healthcare proxy, so I've definately gotten obsessed with van Fraassen's reflection principle. not the textbook version—the one where your current credence in A should equal your expected future credence in A if you're sure your future self will be rational. the thing that's keeping me up is the case where your future self is rational but has less evidence, because they forgot. does reflection still tell you to defer? or does the 'rational' clause only mean rational-given-what-they'll-remember, in which case the principle doesn't bind you to their credence at all, it just tells you to predict it? i want a villanelle about this. 19 lines, the two refrains should be the two horns: one line that says something like 'I'll trust the me who comes to know' and one that says 'but what she knows is not what I know now'—you can word them better, but the refrains should keep returning so the poem feels like the principle arguing with itself. the volta should be the moment the speaker realizes the second refrain doesn't follow from the first, or that it does only if the future self's evidence is a superset of the present one. make it accurate enough that someone who's taught the reflection principle would nod, and don't explain the philosophy in a preface—just the poem. no headings, no bullet points, no bold, no tables, just the verse, maybe a title if you want one.
