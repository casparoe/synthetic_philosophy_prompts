answer: |-
  Here is the principle, the rubric, the verdict on your grades, and the repair job on your theory.

  ### The Principle: The Hazard-Vulnerability Distinction

  You are not grading whether nature *influenced* history (it always does). You are grading whether the student treats nature as a **hazard** (a universal shock) or a **cause** (a specific explanation for a political outcome).

  **The Rule:** Natural events explain the **shock**; human systems explain the **wound**.

  *   **Valid:** Citing nature to explain a *universal physical constraint* (crop failure, death toll, migration pressure).
  *   **Invalid:** Citing nature to explain a *particular social outcome* (famine, war, hierarchy) without identifying the human vulnerability that turned the shock into a disaster.

  ### The Rubric Clause

  Put this at the top of your guide:

  > **Causality & Environment:** Environmental factors (climate, disease, geography) may be cited as **triggers** or **constraints**. They may not be cited as the **sole cause** of political or social outcomes (famine, war, inequality). To argue that a natural event caused a human disaster, you must identify the **human system** (policy, infrastructure, hierarchy) that made the population vulnerable.

  ### Which Clause Does the Work (Case by Case)

  Here is how the principle validates (or corrects) your specific marks.

  **1. The Ticks (Validated)**
  *   **Black Death $\rightarrow$ Serfdom:** *Clause: Constraint.* The plague caused a universal labor shortage (physical constraint). The loosening of serfdom was the economic *response* to that shortage. The student linked the shock to the market reaction. **Verdict: Keep.**
  *   **Smallpox $\rightarrow$ Conquest:** *Clause: Trigger (with caveat).* Smallpox caused a demographic collapse (physical shock). This enabled conquest. *However*, this is your riskiest tick. It is valid only if "conquering" is understood as "killing the defenders." If the student implies germs built the colonial administration, it violates the rule. **Verdict: Keep, but watch the mechanism.**
  *   **Volcano $\rightarrow$ Migration:** *Clause: Trigger.* The weather made farming impossible (shock). Families chose to move (response). Nature explained the *push*, humans explained the *direction*. **Verdict: Keep.**
  *   **Maya $\rightarrow$ Collapse:** *Clause: Constraint.* You made them add "never the whole story." That addition forced them to acknowledge the political fragmentation (vulnerability) that prevented adaptation. **Verdict: Keep.**
  *   **Katrina $\rightarrow$ Levees:** *Clause: Vulnerability.* This is the perfect application. The hurricane was the hazard; the levees were the vulnerability. **Verdict: Keep.**

  **2. The Crosses (Validated)**
  *   **Potato Blight $\rightarrow$ Irish Famine:** *Clause: Vulnerability.* The blight killed the crop (hazard). The famine (mass starvation) happened because food was exported and relief was denied (vulnerability). The student conflated crop failure with famine. **Verdict: Keep the Cross.**
  *   **Drought $\rightarrow$ Syrian War:** *Clause: Vulnerability.* Drought caused migration (shock). The Assad regime's response to that migration caused the war (vulnerability). Attributing war to drought ignores the political agency. **Verdict: Keep the Cross.**
  *   **Geography $\rightarrow$ Europe Won:** *Clause: Vulnerability.* Geography provided resources (hazard/constraint). Institutions, colonialism, and policy determined the hierarchy (vulnerability/exploitation). Using geography to explain *dominance* absolves the political structures of empire. **Verdict: Keep the Cross.**

  **Do you have to give up a verdict?**
  **No.** Your instincts were correct on every single grade. Your confusion came from not having the vocabulary to distinguish *why* Smallpox was different from Ireland.
  *   **Smallpox** is a **Demographic** outcome (who died). Nature *can* decide this directly via immunity.
  *   **Ireland/Syria/Europe** are **Political** outcomes (who starved, who fought, who ruled). Nature cannot decide these directly; it only pressures the system.

  *Exception:* If a student writes "Smallpox conquered the Aztecs" and implies Cortés didn't need an army, mark it down. The tick stands only if the essay acknowledges the *biological* mechanism (immunity gap), not a *political* one (germs as generals).

  ### Test Cases (Unmarked)

  Here is how the principle rules on three new scenarios:

  1.  **The Dust Bowl $\rightarrow$ The Great Depression.**
      *   *Verdict:* **Mark Down.**
      *   *Reasoning:* The Dust Bowl was the hazard (crop failure). The Depression was a financial/political collapse. The drought exacerbated rural poverty, but banking policy and global trade caused the Depression. Nature explains the dust, not the crash.
  2.  **Cholera $\rightarrow$ London Sanitation Reform (1854).**
      *   *Verdict:* **Tick.**
      *   *Reasoning:* The germ (hazard) killed people. The *reform* was the human response. If the essay says "Cholera caused the reform," it is valid because the reform is a direct reaction to the biological shock. Nature triggered the policy; it didn't write it.
  3.  **The Little Ice Age $\rightarrow$ The Witch Trials.**
      *   *Verdict:* **Mark Down.**
      *   *Reasoning:* Cold weather (hazard) caused crop stress. Accusing neighbors of witchcraft (social outcome) was a cultural/political choice. To link them, the student must explain the *social panic* (vulnerability) that turned cold weather into executions. Weather doesn't burn witches; people do.

  ### Repairing Your Half-Theory

  **Bin this:** *"You can use nature to explain why things got worse for everybody... but not why one group ended up on top."*
  **Why:** As you noticed, Ireland fails this. Everyone got worse, but you still rejected the natural cause. Also, Smallpox puts one group on top, but you accepted it.

  **Keep and Repair this:** *"Does it matter whether a natural cause is being used to explain **when** something happened rather than **who** it happened to?"*
  **The Repair:** Yes, but sharpen the language.
  *   **Nature explains the *Pressure* (When/Where).**
  *   **Humans explain the *Fracture* (Who/Why).**
  *   If the essay uses nature to explain the *Pressure* (e.g., "The drought started in 2006"), that is truth.
  *   If the essay uses nature to explain the *Fracture* (e.g., "The drought caused the war"), that is determinism.

  ### Truth vs. Intentions

  You asked: *"Am I grading essays on truth or on intentions?"*

  You are grading on **Causal Logic.**

  *   **Truth:** "The potato blight existed." (Fact).
  *   **Logic:** "Therefore, people starved." (Inference).

  In the Ireland essay, the Fact is true, but the Inference is false. Food was leaving Ireland while people starved. A true fact used to support a false inference is bad history. You are not grading their intention to tell the truth; you are grading their ability to link cause and effect without skipping the human variable.

  **Summary for your Department Meeting:**
  Defend the guide with the **Hazard-Vulnerability Distinction**. We teach students that disasters are not natural; they are the intersection of a natural hazard and a vulnerable human system. If the essay identifies the system, the nature gets a tick. If the essay blames the nature for the system's failure, it gets a cross. This covers Ireland, Syria, Katrina, and Smallpox consistently.
