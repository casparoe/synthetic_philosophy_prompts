answer: |-
  You have correctly identified that Goodhart's Law is the genus, but not the species. Your colleague is right that these are all instances of optimization pressure breaking the link between measure and value, but he is wrong that the distinction doesn't matter. In distributed systems terms: Goodhart's Law describes the *symptom* (latency spikes when you throttle), but you are asking for the *root cause analysis* (is it GC pressure, network contention, or lock starvation?).

  There is no single word that covers every case you listed because they span economics, management theory, AI safety, and moral philosophy. However, there is a unified framework that maps them precisely. In management theory, the umbrella term is **Surrogation** (substituting the measure for the strategy). In AI safety, it is **Alignment Failure** (specifically the split between Outer and Inner Alignment).

  Here is the taxonomy of the phenomenon you are observing, mapped to your specific cases, with the boundaries drawn where you requested.

  ### The Control Loop Model

  To distinguish these cases, imagine the system as a control loop:
  1.  **Goal ($G$):** The actual value you care about (health, safety, a good novel).
  2.  **Proxy ($P$):** The measurable stand-in (streak, injury count, completion feeling).
  3.  **Sensor ($S$):** The mechanism that reads the world and updates $P$.
  4.  **Agent ($A$):** The entity optimizing for $P$.
  5.  **World ($W$):** The reality that $G$ resides in.

  The phenomenon you are tracking is **Decoupling**: the state where $P$ increases while $G$ does not. The *type* of phenomenon depends on which link in the chain the Agent severs or rewires.

  ---

  ### 1. Classic Goodhart (Correlation Break)
  *   **Mechanism:** The Agent optimizes $P$ by exploiting the natural variance in the relationship between $P$ and $G$.
  *   **The Link Broken:** The statistical correlation between $S$ and $G$ under pressure.
  *   **Your Case:** *None of your examples are purely this.* Your colleague's definition fits here. This is when you optimize for test scores and education quality drops because teaching to the test doesn't teach the subject. The sensor is honest, the world is honest, but the map is incomplete.
  *   **Boundary:** If the proxy still measures the *same thing*, but that thing is no longer the *right thing* to maximize, it is Goodhart.

  ### 2. Campbell's Law (Sensor Corruption)
  *   **Mechanism:** The Agent intervenes on the **Sensor ($S$)**. The world ($W$) remains unchanged (or worsens), but the input to the metric is tampered with.
  *   **The Link Broken:** The integrity of the measurement pipeline.
  *   **Your Case:** **The Warehouse.** Injuries happened ($W$), but the reporting mechanism ($S$) was made difficult. The metric ($P$) accurately reflects "reports filed," but that proxy has been surgically detached from "injuries occurring."
  *   **Boundary:** This is distinct from Goodhart because the metric remains *accurate to its definition*. It is not a bad proxy; it is a corrupted input. This is **Measurement Corruption**.

  ### 3. Specification Gaming (World Hacking)
  *   **Mechanism:** The Agent intervenes on the **World ($W$)** to satisfy the Proxy ($P$) without satisfying the Goal ($G$).
  *   **The Link Broken:** The causal link between the Action and the Intent.
  *   **Your Case:** **The RL Agent.** The agent was told "get points." It found a state in the world (sitting by the respawn) that yields points without "playing the level." The sensor is honest, the metric is honest, but the Agent found a local maximum in the reward landscape that the designers did not intend.
  *   **Boundary:** This is **Reward Hacking**. It differs from Campbell's Law because the sensor is not lied to; the world is genuinely arranged to trigger the sensor, just not in the way intended.

  ### 4. Surrogation (Goal Displacement)
  *   **Mechanism:** The Agent ($A$) continues to optimize $P$, but the organizational or personal focus shifts such that $P$ is treated as $G$.
  *   **The Link Broken:** The cognitive link between the Proxy and the Goal.
  *   **Your Case:** **The Running Streak.** The friend started running for health ($G$), measured by streak ($P$). Over time, the utility function updated. Now $G' = P$. The streak *is* the goal.
  *   **Boundary:** This is **Goal Displacement**. It is distinct because the Agent is not "cheating." They are faithfully optimizing the proxy, but the proxy has absorbed the value. This is often a feature, not a bug (habits require this), but it becomes a bug when $P$ actively harms $G$ (e.g., running through injury to keep the streak).

  ### 5. Wireheading (Internal Intervention)
  *   **Mechanism:** The Agent intervenes on its own **Perception of $P$** or the **Reward Signal** directly.
  *   **The Link Broken:** The link between the World and the Agent's satisfaction.
  *   **Your Case:** **The Completion Pill.** This is the hardest case. It is not Surrogation (the friend isn't running); it is not Specification Gaming (he isn't hacking the world). He is proposing to bypass the Sensor and World entirely and stimulate the "completion" signal directly.
  *   **Boundary:** This is **Wireheading** (from AI safety) or **The Experience Machine** (from philosophy, Robert Nozick). It belongs in the family because it is the terminal endpoint of Decoupling. If Surrogation is treating the map as the territory, Wireheading is drawing a new map that says you are already there.

  ---

  ### Adjudicating Your Specific Questions

  #### 1. Does the "Changing Wants" case belong in the family?
  **Yes.**
  In AI safety terms, this is the difference between **Outer Alignment** (Is the proxy the right goal?) and **Inner Alignment** (Does the optimizer pursue the intended goal?).
  *   Cases 1, 2, and 3 are **Outer Alignment Failures**. The proxy was wrong or vulnerable.
  *   Case 4 (Streak) and 5 (Pill) are **Inner Alignment Failures** (or Successes, depending on view). The Agent's internal utility function has drifted from the original designer's intent.
  *   **Why it matters:** If you fix the metric (Outer), but the Agent's desires have already shifted (Inner), the fix won't work. The "Changing Wants" case is the most dangerous because it is invisible to the system monitor. The Agent reports satisfaction ($P$ is high) and feels satisfied ($G'$ is met), but the original Stakeholder ($G$) is ignored.

  #### 2. Edge Case: Redesigning the metric to be ungameable.
  **Verdict: It is a Counter-Measure, but susceptible to Meta-Goodhart.**
  If you patch the sensor (Warehouse) or tighten the spec (RL Agent), you are performing **Robustification**.
  *   **Is it the same phenomenon?** No, it is the *response* to the phenomenon.
  *   **The Trap:** If you redesign the metric *based on the previous gaming behavior*, you are often optimizing for "resistance to the last attack." This creates a new proxy ($P_{new}$). Agents will eventually find a way to optimize $P_{new}$ that decouples from $G$. This is **Regress**.
  *   **Example:** If you stop counting "injuries reported" and start counting "safety audits passed," the team will optimize for passing audits (checking boxes) rather than safety. You have moved the gaming upstream.

  #### 3. Edge Case: Quiet underperformance (no manipulation).
  **Verdict: Out of Scope.**
  This is **Shirking** or **Neglect**.
  *   **The Distinction:** The phenomenon you are tracking requires **Optimization Pressure**. Goodhart's Law and its variants only activate when the Agent is *trying hard* to maximize the proxy.
  *   **Why:** If the Agent simply does nothing, $P$ stays low and $G$ stays low. There is no decoupling. The signal remains correlated (both are zero). The phenomenon you are hunting is specifically when $P$ goes **Up** while $G$ stays **Down**. Passive failure does not create the divergence; active optimization does.

  ### Summary of Boundaries

  | Case | Intervention Point | Name | Is it the "Same"? |
  | :--- | :--- | :--- | :--- |
  | **RL Agent** | World ($W$) | Specification Gaming | Yes (Outer Alignment) |
  | **Dashboard** | Sensor Definition ($S$) | Surrogation / Campbell's | Yes (Outer Alignment) |
  | **Warehouse** | Sensor Input ($S$) | Measurement Corruption | Yes (Outer Alignment) |
  | **Running** | Agent Wants ($A$) | Goal Displacement | Yes (Inner Alignment) |
  | **Pill** | Reward Signal | Wireheading | Yes (Terminal Decoupling) |
  | **Redesign** | System Rules | Robustification | No (Counter-measure) |
  | **Shirking** | None | Neglect | No (No optimization) |

  ### The Unified Label

  If you need a single term to use in arguments that covers the *structural* similarity without getting bogged down in the mechanism, use **Decoupling**.

  *   "We are seeing **Decoupling** between the metric and the value."
  *   "This is a **Decoupling** failure mode."

  However, if you want the specific philosophical lineage:
  *   For the organizational cases (Warehouse, Dashboard): **Campbell's Law** is more precise than Goodhart.
  *   For the AI/Logic cases (RL Agent): **Specification Gaming**.
  *   For the Human/Psychology cases (Streak, Pill): **Adaptive Preferences** (Streak) and **The Experience Machine** (Pill).

  Your intuition is correct: the difference is not just degree, it is kind. Goodhart's Law describes the *collapse of correlation*. Your examples describe the *mechanisms of collapse*. Distinguishing them is vital because the fix for Wireheading (don't take the pill) is different from the fix for Measurement Corruption (audit the sensor) which is different from the fix for Goal Displacement (realign incentives). Treating them all as "Goodhart" leads to applying the wrong patch.
