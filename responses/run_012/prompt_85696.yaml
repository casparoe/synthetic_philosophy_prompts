  2.  **Deconstruct the Philosophical Problem:**
      *   *Colour Phi:* Blue dot -> Red dot -> Subject sees Blue moving dot turning Red mid-path.
      *   *Problem:* The subject reports seeing the color change *before* the second dot is physically flashed. How is this possible?
      *   *Stalinesque (Researcher 1):* The brain waits for the second stimulus, edits the sequence internally (like a film editor before screening), and presents the finished movie to consciousness. Consciousness sees the edited version.
      *   *Orwellian (Researcher 2):* Consciousness sees the raw sequence (Blue, then Red), but memory revises the story afterwards (like a historian rewriting records). The subject *reports* the change, but didn't strictly *experience* it in real-time.
      *   *The Trap:* Both theories predict the exact same behavioral report ("I saw it change color"). Since we only have access to reports (or neural correlates open to interpretation), distinguishing them is notoriously difficult (Dennett's point).
      *   *Third Option:* Illusion of consciousness/no fact of the matter (Dennett's Multiple Drafts view essentially, though I shouldn't name-drop).

