answer: |-
  This is a request for a metaphysical and normative excavation, not a historical one. Given your background, you understand that dating a sample requires knowing what material you are holding; if you misidentify the substrate, the half-life calculation is meaningless. The same applies to nationalism. The literature is clogged with arguments about *when* nations began because there is no agreement on *what* a nation is.

  For a team of four or five philosophers working without empirical tools for three years, the agenda must prioritize **ontological clarity** before **temporal classification**, and **temporal classification** before **normative assignment**. To argue about the rights of a nation (normative) before defining its identity conditions (ontological) is to build a stratigraphy on loose fill.

  Here is a defended agenda, ordered by logical dependency (upstream/downstream), with explicit criteria for tractability and ranking.

  ### Guiding Criteria for the Agenda

  1.  **Upstream Dependency:** A question is upstream if its answer determines the validity of the questions downstream. (e.g., If nations are fictions, their "age" is a category error).
  2.  **Armchair Tractability:** A question is tractable if it can be resolved through conceptual analysis, logical consistency, and comparison with other social kinds (money, marriage, corporations), without needing to count speakers or dig up pottery.
  3.  **Leverage:** A question moves up the ranking if its resolution dissolves multiple downstream debates. It moves down if it is a terminological stalemate with no consequence for the rest of the project.

  ---

  ### The Three-Phase Agenda

  #### Phase 1: The Ontology of the Collective (Year 1)
  **Primary Question:** *What are the identity conditions of a nation?*
  **Sub-questions:** Is a nation a *natural kind*, a *social kind*, or a *fiction*? If it is a social kind, is it defined by objective traits (language, territory) or subjective attitudes (mutual recognition)?

  *   **Why Upstream:** You cannot date a nation until you know what persists through time. If a nation is defined by a specific political structure (Modernist view), it cannot exist before that structure. If it is defined by an ethnic core (Ethno-symbolist view), it might. This phase determines whether "antiquity" is even a coherent predicate to apply to the subject.
  *   **Tractability:** High. This is pure analytic metaphysics. The team can utilize the literature on social ontology (Searle, Tuomela, Gilbert) and compare nations to other institutional facts.
  *   **Ranking Mover:** If the team concludes nations are purely "imagined" fictions with no continuous identity conditions, Phase 2 becomes a study of error, not history. This makes Phase 1 the critical path.

  #### Phase 2: The Temporality of Identity (Year 2)
  **Primary Question:** *How does collective memory function as a constituent of national identity?*
  **Sub-questions:** Does the *belief* in continuity constitute continuity? Can a nation be "born" at time $T$ but validly claim existence at $T-n$ based on retroactive constitution?

  *   **Why Midstream:** This addresses your first puzzle directly. It relies on the ontological definition from Phase 1. If a nation is a "psychological community," then the *belief* in antiquity is a real, present-tense fact, even if the historical referent is false.
  *   **Tractability:** High. This requires analyzing the logic of self-reference and performative speech acts. It does not require verifying the history, only analyzing the *claim* to history.
  *   **Ranking Mover:** This moves up if Phase 1 concludes that subjective attitude is necessary for national existence. It moves down if Phase 1 concludes nations are objective structures independent of belief.

  #### Phase 3: The Normativity of Origins (Year 3)
  **Primary Question:** *Does the genealogy of a nation track its legitimacy?*
  **Sub-questions:** Does "recentness" or "invention" diminish a claim to self-determination? Is there a "statute of limitations" on historical injustice that creates a new legitimate nation?

  *   **Why Downstream:** You cannot determine if a recent tradition warrants self-determination until you know if the "recentness" invalidates the entity claiming it. This is the bridge from *is* to *ought*.
  *   **Tractability:** Medium. This requires normative political philosophy. It is tractable without polling because it deals with principles of justice, not public opinion. However, it risks becoming intuitive rather than logical if not anchored in Phases 1 and 2.
  *   **Ranking Mover:** This is the foundation's ultimate goal, so it must be included. However, it is demoted in order because answering it prematurely leads to the standard "Modernist vs. Primordialist" moralizing you wish to avoid.

  ---

  ### Weighing Your Two Puzzles

  You asked for these to be weighed on their merits. I propose integrating them as the central hypotheses of Phase 2 and Phase 3, respectively.

  **Puzzle 1: Can a nation be partly constituted by beliefs about its own antiquity?**
  *   **Verdict:** **Yes, but with a caveat.**
  *   **Reasoning:** If we accept the "social kind" ontology (Phase 1), nations exist similarly to promises or marriages. A marriage exists because two people believe and act as though they are married. If a group acts *as if* they are a continuous nation, that performative act creates a present-tense social reality.
  *   **The Caveat:** The *content* of the belief may be false (the radiometric date is wrong), but the *fact* of the belief is true. Therefore, the nation is "ancient" in terms of *subjective continuity*, but "modern" in terms of *objective structural continuity*.
  *   **Agenda Placement:** This is the core of Phase 2. The team should not ask "Is this nation old?" but "What work does the *claim* of oldness do for the nation's current cohesion?" This makes the question tractable for philosophers: they are analyzing the function of the myth, not the truth of the myth.

  **Puzzle 2: Does normative consequence follow for self-determination once a tradition is shown to be recent?**
  *   **Verdict:** **No, not necessarily.**
  *   **Reasoning:** This is the "Genetic Fallacy" applied to political legitimacy. The origin of a claim does not automatically invalidate its current validity. A constitution may be "invented" yesterday, but if it secures justice and represents the will of the people today, its recentness is normatively irrelevant.
  *   **The Nuance:** Normative consequence *only* follows if the claim to self-determination relies *explicitly* on historical priority (e.g., "We deserve this land because we were here first"). If the claim relies on current capacity for self-government or democratic will, the "invented" nature of the tradition is irrelevant.
  *   **Agenda Placement:** This is the core of Phase 3. The team must distinguish between *historical legitimacy* (based on ancestry) and *political legitimacy* (based on function). This distinction dissolves the puzzle: recentness kills the former, but not necessarily the latter.

  ---

  ### Questions to Set Aside (Exclusions)

  To keep the team focused on conceptual foundations, you must explicitly exclude questions that tempt empiricists or historians.

  1.  **The "When" Question (Historical Semantics):**
      *   *Exclude:* "When did the word 'nation' first appear?" or "When did industrialization begin?"
      *   *Reason:* This is archival work. Knowing when the *label* was applied does not tell us when the *concept* became viable. It confuses the map with the territory.
  2.  **The "Why" Question (Evolutionary Psychology):**
      *   *Exclude:* "Is nationalism an adaptation?" or "Do humans have a tribal instinct?"
      *   *Reason:* This requires cognitive science and fieldwork. Even if humans have a tribal instinct, it does not tell us if a *nation* is the correct unit of moral analysis. It is upstream of biology but downstream of ontology.
  3.  **The "Good vs. Bad" Question (Typology):**
      *   *Exclude:* "Distinguishing civic vs. ethnic nationalism."
      *   *Reason:* This is a normative classification that presupposes we know what a nation is. It often serves as a proxy for "nations I like vs. nations I dislike." It distracts from the foundational metaphysics.

  ### Summary of Logic

  1.  **Ontology (Phase 1):** Define the substance. (Is it rock or sand?)
  2.  **Temporality (Phase 2):** Date the substance. (Does the belief in age count as age?)
  3.  **Normativity (Phase 3):** Assess the value. (Does the age grant rights?)

  If the team skips Phase 1, Phase 2 becomes history (which you cannot fund), and Phase 3 becomes polemics. By forcing the team to treat the nation as a **social object** whose existence conditions are philosophical problems, you utilize their constraints (no fieldwork) as a strength. They will not be distracted by data; they will be forced to clarify the concepts that make data intelligible.

  Your radiometric instinct is correct: without knowing the half-life of the concept, you cannot measure the age of the specimen. Let them calculate the half-life.
