  I want to have some fun with it. Write me a deadpan self-help column, 550-650 words, by a productivity guru who has taken both moves personally: his whole thing is that understanding is a seperate step you can just fire. Headline and all, first person, no winking. Give him a numbered method with names he invented, a consultancy (call it Crane & Hook) and a couple of clients he's proud of — a hospital, an airline — where nobody on the floor could explain why the protocol works and it works fine. He should get the arguments right; he cites Darwin and Turing the way a guy cites a study he half remembers. Finish with a reader's letter asking the obvious thing — if it behaves right but understands nothing, then who's home — and have him answer it cheerfully and definately not notice.
