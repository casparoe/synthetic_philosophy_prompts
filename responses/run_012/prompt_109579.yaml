      *   *Resolution/Priority:* A rationalist must prioritize *action-guiding coherence* over *theoretical purity*. EU is a limit concept, not an algorithm. The fundamental constraint is avoiding paralysis. Therefore, some form of thresholding or risk-aversion is necessary for bounded agents.

  4.  **Drafting Section (b): Epistemology of Testimony:**
