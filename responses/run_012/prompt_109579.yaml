answer: |-
  This setup transforms Pascal's Mugging from a paradox of infinity into a problem of **resource allocation under epistemic uncertainty**. The core tension is between the *normative ideal* of Expected Utility (EU) maximization and the *computational reality* of a bounded agent facing a landscape of mutually exclusive, high-stakes claims.

  Here is the map of tensions and implications.

  ### (a) Decision Theory: EU vs. Heuristic Thresholds

  **The Tension:**
  Pure EU maximization demands you act on any proposition where $P \times U > \text{Cost}$. In your scenario, with many mutually exclusive muggers, the sum of expected utilities across all muggers exceeds your total resources, but you can only satisfy a few (or none). If you follow EU, you must spend your cognitive budget calculating $P$ for every mugger to find the highest $P \times U$. Since there are infinitely many (or simply more than you can compute), EU leads to **computational paralysis**. You die while calculating.

  Rival rules (maximin, risk-aversion, or lexicographic thresholds) suggest ignoring any claim where $U$ exceeds a certain magnitude unless $P$ meets a baseline evidentiary standard. This avoids paralysis but introduces **arbitrariness**. Where do you set the threshold? Setting it too high blinds you to genuine black swans; setting it too low invites mugging.

  **The Implication:**
  For a bounded agent, EU is not an algorithm; it is a limit concept. You cannot maximize expected utility directly; you must maximize the expected utility of your *decision procedure*. A decision procedure that spends all its compute evaluating low-probability high-stakes claims has an expected utility of zero (because it starves).

  **The Fundamental Constraint:**
  **Functionality trumps Theoretical Purity.**
  A rationalist must treat **avoidance of paralysis** as the more fundamental constraint. If a decision rule prevents you from acting, it fails the definition of instrumental rationality. Therefore, a bounded agent is rationally required to adopt a decision rule that approximates EU *within* computational limits, even if that rule violates EU axioms in edge cases (like ignoring a specific mugger). You must implement a "complexity penalty" or a "magnitude cap" on utility estimates to keep the decision space tractable.

  ### (b) Epistemology: Testimony and Magnitude

  **The Tension:**
  Standard Bayesian epistemology suggests that if a claim has sufficient stakes, even a tiny likelihood ratio should update your credence significantly. However, in the "Many Muggers" scenario, the *content* of the claim (the magnitude of $U$) is inversely correlated with the *reliability* of the testimony. As the promised utility grows, the space of possible lies grows faster than the space of possible truths.

  If you update fully on testimony regarding astronomical stakes, you become vulnerable to **epistemic hijacking**. Any agent who can construct a story with a higher $U$ can dominate your belief state, regardless of truth. Conversely, if you discount testimony based on magnitude, you are engaging in a form of **motivated skepticism**, violating the Likelihood Principle.

  **The Implication:**
  You must decouple *credence* from *decision weight*. You might assign a non-zero credence to a mugger's claim (acknowledging you aren't certain it's false) but assign it zero decision weight. Epistemically, you must adopt a prior that penalizes hypothesis complexity, where "complexity" includes the ontological leverage required to produce the promised $U$. A claim that requires physics-breaking leverage to fulfill must carry an exponentially heavier complexity penalty.

  **The Fundamental Constraint:**
  **Calibration trumps Updating.**
  The more fundamental constraint is the **reliability of the belief-forming process**. If your cognitive architecture cannot distinguish between a true claim of magnitude $10^{100}$ and a false one of magnitude $10^{100}$, you are not permitted to update on the magnitude. You must treat the evidence as non-diagnostic regarding the magnitude. Rationality requires admitting when your sensors are saturated; updating beyond your calibration range is irrational, even if the math says otherwise.

  ### (c) Practice: Existential Risk and Longtermism

  **The Tension:**
  This is the sharpest conflict. Effective Altruism and AI safety often rely on the logic that small probabilities of astronomical future loss justify large present costs. This structure is isomorphic to Pascal's Mugging. If you build an immune system against Mugging (e.g., "ignore claims with $U > X$"), you risk blinding yourself to genuine existential risks (x-risks), which also involve small probabilities and huge stakes.

  However, there is a structural difference: x-risk arguments usually rely on **causal mechanisms** (physics, computation, game theory), whereas Muggers rely on **ontological loopholes** (magic, simulation leverage). The "Many Muggers" problem arises because the muggers offer mutually exclusive *magic*. X-risk scenarios are often mutually exclusive *outcomes* of the same physical system.

  **The Implication:**
  You must distinguish between **robust small probabilities** and **fragile small probabilities**.
  *   **Robust:** Derived from models where the causal chain is understood, even if the outcome is uncertain (e.g., "If we build AGI without alignment, it might kill us").
  *   **Fragile:** Derived from testimony or speculation where the mechanism for the payoff is opaque or relies on unverified leverage (e.g., "Give me $5 and I will use magic to save $10^{100}$ lives").

  **The Fundamental Constraint:**
  **Causal Grounding trumps Utility Magnitude.**
  A rationalist should prioritize claims that are grounded in known causal mechanisms over claims grounded purely in utility magnitude. If an x-risk argument collapses into "you can't prove it won't happen" without a mechanistic model, it should be treated as a Mugger. The fundamental constraint is **mechanistic plausibility**. You act on x-risk because the physics allows it, not because the stakes are high. You ignore the Mugger because the physics forbids them.

  ### (d) Bounded Rationality: Can a Bounded Agent be Rational?

  **The Tension:**
  If "rationality" is defined as satisfying the axioms of Von Neumann-Morgenstern (completeness, transitivity, etc.), a bounded agent facing the Many Muggers problem **cannot be rational**. To satisfy completeness, you must have a preference ordering over all muggers. To do that, you must compute all $P \times U$. You cannot. Therefore, you are necessarily irrational.

  This implies a dilemma: Either rationality is impossible for bounded agents, or our definition of rationality is wrong.

  **The Implication:**
  Rationality must be redefined from **axiomatic consistency** to **resource-optimized goal achievement**. This is the shift from "Ideal Rationality" to "Bounded Rationality." An agent that ignores Muggers to eat lunch is more rational than an agent that starves while calculating the utility of lunch vs. the Mugger. The "irrationality" of ignoring a positive EV bet is a necessary cost of the "rationality" of maintaining an agent capable of taking bets at all.

  **The Fundamental Constraint:**
  **Survival trumps Consistency.**
  The most fundamental constraint is **agent continuity**. An agent that ceases to exist (via paralysis or resource depletion) cannot maximize utility. Therefore, any heuristic that preserves the agent's ability to act in the future is rationally mandated, even if it violates EU axioms in the present. You must sometimes ignore positive expected value considerations to preserve the cognitive infrastructure required to evaluate expected value at all.

  ### Summary of Priorities

  Where these implications pull in opposite directions, the hierarchy of constraints for a bounded rationalist is:

  1.  **Agent Continuity (Survival/Functionality):** Do not adopt rules that cause paralysis or resource depletion. (Overrides Axiomatic Consistency).
  2.  **Causal Grounding:** Prioritize claims with mechanistic support over claims with pure utility magnitude. (Overrides Utility Maximization).
  3.  **Calibration:** Do not update on evidence beyond your capacity to distinguish signal from noise. (Overrides Bayesian Updating).

  **The Verdict:**
  You cannot live as an Expected Utility Maximizers. You must live as an **Expected Utility Approximator with Hard Constraints.** The "Pascal's Mugging" stress test proves that for bounded agents, **ignoring** certain low-probability high-stakes claims is not a bug; it is a feature of a robust decision architecture. The rationalist who refuses to be mugged is not failing at math; they are succeeding at engineering.
