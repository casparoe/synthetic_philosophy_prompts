answer: |-
  This is a profound question about the nature of time, community, and authenticity. You are standing at the intersection of sociology and personal grief, mourning a specific kind of magic that has evaporated not because the lanterns are dimmer, but because the origin story is known.

  Here is how I see the balance between your neighbour and your brother-in-law, the reality of what you have lost, and the conditions under which I would change my position.

  ### The Verdict: Who is Right?

  Sociologically and historically, **your brother-in-law is right.** Your neighbour is operating under a romantic fallacy.

  There is a concept in history called "The Invention of Tradition," popularized by historian Eric Hobsbawm. He argued that many traditions we assume are ancient (Scottish clan tartans, many royal ceremonies, even some folk festivals) were manufactured in the 19th or early 20th centuries to create social cohesion during times of rapid change. Your mill closure was that time of rapid change. You did exactly what communities have always done: you created a ritual to bind the wound of economic loss.

  The 100-year rule used by the heritage register is not a metaphysical truth about what constitutes a "soul" for a town; it is a bureaucratic risk assessment. It is designed to filter out fads. But a fad and a tradition look identical in their first thirty years. The only difference is survival.

  Your neighbour defines "tradition" by its **roots** (where it came from). Your brother-in-law defines it by its **function** (what it does). A tradition is not a fossil; it is a muscle. It is defined by use, not by age. If your neighbour's definition held true, Christianity, Islam, and democracy would not be "real" during their first centuries.

  ### Is Something Real Lost?

  You asked if something real is lost when a tradition turns out to be manufactured. The answer is **yes, but it is not the thing that matters.**

  What you have lost is **anonymity.**

  When a tradition is perceived as ancient, the founders disappear. The ritual belongs to no one and everyone. It feels like a force of nature, like the seasons. You feel like a steward keeping a fire lit that was burning before you were born.

  When the manufacturing is revealed, the ritual becomes a **project.** It belongs to *you*. The weight shifts from "keeping this alive" to "deciding whether to continue this." That is a heavy, secular burden. You are mourning the transition from being a *priest* of the event to being the *manager* of the event.

  However, the **meaning** is not lost. The comfort the townspeople feel, the continuity for the children, the resilience after the mill closure—that is all objectively real. The "illusion" your brother-in-law mentions is only the illusion of antiquity. The value of the procession was never in 1894; it was in 1994, and it is in 2024.

  ### What Would Change My Mind

  You asked what would change my mind about which of you has it right. Currently, I side with the brother-in-law: *Tradition is functional, not genealogical.*

  However, I would shift toward your **neighbour's** position under the following conditions:

  1.  **If the Knowledge Destroys the Cohesion:** If it turns out that the *only* reason people participate is because they believe it is centuries old, and participation collapses now that they know it was started by a few locals in a pub in 1994, then the neighbour is practically right. If the "lie" of age is the actual glue holding the town together, then the manufactured nature is a fatal flaw. (Though, given you've run for 30 years, this seems unlikely).
  2.  **If the Ritual Becomes Coercive:** If you and the other founders start using the label of "Tradition" to prevent the event from evolving or to exclude new people ("We can't change the route, it's *tradition*"), then the neighbour's definition becomes dangerous. In that case, calling it a "hobby with a march" would be a healthy corrective to restore agency.
  3.  **If the Origin is Actively Suppressed:** If you decide to forge minutes from 1920 to get on that heritage register, then the neighbour wins. A tradition that requires lying about its birth to be valid is a cult, not a community practice. Authenticity requires owning the origin.

  I would shift toward your **brother-in-law's** cynicism (that it's all just paperwork) if:

  1.  **The Ritual Loses its Participants:** If the kids stop coming, and you find yourselves marching alone simply to "keep the record alive," then it becomes exactly what he says: a hobby. A tradition requires a collective. If the collective dissolves, the "tradition" status is just a label on a box in a basement.
  2.  **If the "100-Year" Status Grants Unearned Authority:** If getting on that register allows the procession to dictate town policy or shut down roads indefinitely without review, then his point about "hiding paperwork" becomes a political warning. We should be wary of granting authority solely based on longevity.

  ### The Path Forward

  You feel the procession is now "yours to cancel." That feels like a loss of sanctity, but it is actually a gift of **agency.**

  Ancient traditions can become zombies—walking dead things that drain resources and joy because "we've always done it." Because you know you made this, you have the power to change it. You can alter the route, change the date, or hand the keys to a new generation without guilt.

  You are not mourning an illusion; you are mourning the comfort of fatalism. It is easier to serve a ghost than to lead a community. But the lanterns lit in 1994 were lit for the living, not the dead. The fact that you made it up on the spot doesn't make it fake; it makes it a deliberate act of love for your town.

  Thirty years is a generation. That is enough time for a story to become true. Don't let the heritage register tell you when your history starts. You know when it started. That is enough.
