answer: |-
  1.  **The Agency Test:** Did the historical actors intend this outcome? If yes, a link to the present is valid causality. If no, proceed to step 2. This separates intentional reform (Factory Acts) from accidental anticipation (abandoned treatments).
  2.  **The Inevitability Test:** Does the text imply the outcome was destined? Scan for teleological markers: "finally," "won," "couldn't see it coming." Rewrite to show the outcome was contested, not pre-ordained.
  3.  **The Moral Test:** Is praise or blame based on alignment with current values rather than contemporary impact? Strike phrases like "ahead of his time" or "enlightened." These judge the past by our curve, not theirs.
  4.  **The Erasure Test:** Does mentioning the present make alternative paths look stupid? If a technology lost (canals vs. railways), acknowledge its logic at the time. Do not let the winner's history erase the loser's rationality.
  5.  **The Handoff:** If the connection relies on complex debate beyond the word count, flag it. This is where editing stops and curatorial judgement begins. Do not enforce uniformity where historical ambiguity exists.

  **(a) The Mill Label**
  *Draft:* "By 1900 the mill was finally forced to shorten children's hours: a small step on the road to the workplace protections we take for granted today."
  *Verdict:* **Pass with edit.**
  *Analysis:* Passes Agency (campaigners intended this). Fails Inevitability ("finally," "road to").
  *Fix:* Remove "finally" and "road to." Try: "By 1900 the mill shortened children's hours. Campaigners sought these changes; they form part of the history of workplace protections we know today." This keeps the funder's link without implying destiny.

  **(b) The Surgeon Label**
  *Draft:* "A man ahead of his time, whose warnings went unheeded."
  *Verdict:* **Fail.**
  *Analysis:* Fails Moral Test. "Ahead of his time" praises him for matching our knowledge, not his own. It implies history was waiting for him.
  *Fix:* Focus on contemporary impact. "He pushed a treatment later abandoned, arguing it reduced risk. Colleagues disagreed; the debate shaped local medical practice."
  *Note on your Woman Campaigner:* She passes Agency (she campaigned for the change). Unlike the surgeon, she intended the outcome, even if she didn't live to see it. The procedure saves her because her intent bridges the gap, whereas the surgeon's "correctness" was accidental.

  **Limitations and Taste**
  This procedure cannot eliminate subjectivity. Step 1 (Agency) requires historical knowledge you may not have; if unsure, you must hand off to the curator (Step 5). Step 3 (Moral Test) is where your taste most risks disguising itself as method; you might dislike "progress" narratives personally. The rule isn't "no progress," but "no inevitable progress." If a curator insists a figure was "enlightened," ask for evidence of contemporary reception, not just modern approval. Finally, this cannot fix bad history, only bad framing. If the underlying research is Whiggish, editing the label won't cure the exhibition. You are policing the syntax of history, not the history itself.
