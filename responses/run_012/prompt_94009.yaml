answer: |-
  This is a fantastic setup. You have the exact right composition of people to actually make progress on this, provided you don't fall into the trap of each discipline talking past the others. The Archaeologist knows the data, the Philosopher knows the normative stakes, and the Economists know how to model trade-offs and ratchets.

  Here is the prioritization for a one-semester sprint. I have ordered these by **logical dependency** (upstream questions must be answered before downstream ones make sense) and **group tractability** (where your specific skill set gives you leverage).

  ### 1. The Normative Frame: Defining "Mistake" and "Affluence"
  **Lead:** Philosopher & Economists (with Archaeologist constraint)
  **Status:** *Upstream / Foundational*

  You cannot answer whether it was a "mistake" until you agree on the counterfactual and the utility function. This is the most critical upstream task. If you skip this, you will spend the semester arguing past each other about data that means different things to different people.

  *   **The Core Question:** Are we evaluating *average individual welfare* (Sahlins/Diamond) or *total aggregate capacity* (state-building/population)? And was the transition a *choice* (agency) or a *trap* (determinism)?
  *   **Why it's first:** If the Philosopher defines "affluence" as autonomy and leisure, but the Economists define it as caloric surplus and population carrying capacity, no amount of bioarchaeological data will resolve the debate. Furthermore, if the transition was a "ratchet" (you can't go back once population density hits a certain point), calling it a "mistake" might be a category error—it wasn't a decision, it was a systemic lock-in.
  *   **Tractability:** High. This is conceptual work. Your Philosopher and Economists can model this quickly. The Archaeologist's job is to veto definitions that are empirically impossible to measure (e.g., "subjective happiness").
  *   **Settled vs. Contested:**
      *   *Settled:* There is no universal metric for "welfare" in deep time.
      *   *Contested:* Whether the "trap" model (Scott/Boserup) holds water against the "choice" model (Sahlins).
  *   **What moves this down:** If you find you can't agree on a metric, pivot immediately to **Question 2** and treat "welfare" as a variable rather than a constant.

  ### 2. The Unit of Analysis: Deconstructing "The Revolution"
  **Lead:** Archaeologist (with Philosopher support)
  **Status:** *Upstream / Empirical Constraint*

  Before you measure the *outcome*, you must define the *event*. If "The Agricultural Revolution" is a myth, evaluating it as a singular decision is impossible.

  *   **The Core Question:** Are we looking at a specific transition (e.g., Pre-Pottery Neolithic B in the Levant) or a global typology? Did sedentism precede domestication (the Natufian/Jomon model), and does that decouple "farming" from "settling down"?
  *   **Why it's second:** You need to know *what* you are evaluating. If sedentism and hierarchy predate farming (as Gobekli Tepe and Natufian evidence suggests), then farming didn't *cause* inequality, it might have just sustained it. This fundamentally changes the "mistake" calculus.
  *   **Tractability:** High for your Archaeologist. There is a wealth of synthesis literature on the "co-evolutionary" model of domestication (Zeder, Larson, etc.).
  *   **Settled vs. Contested:**
      *   *Settled:* It was not a single event. Domestication was a co-evolutionary process taking millennia, not a "discovery." Sedentism frequently predates full-blown agriculture.
      *   *Contested:* The degree to which this varies by region. The Levant is well-trodden; the Americas and Asia have different timelines. Don't try to solve the global picture; pick one or two well-documented transitions (e.g., Levant, Andes, or Mississippian) as case studies.
  *   **What moves this down:** If the Archaeologist confirms you can treat "Neolithic Transition" as a sufficiently coherent proxy for your specific case study region.

  ### 3. The Labor-Leisure Trade-off (The Sahlins Claim)
  **Lead:** Economists & Archaeologist
  **Status:** *Downstream / Empirical Test*

  This is the most famous empirical claim (foragers worked 15-20 hours/week; farmers worked more). It is also the most vulnerable to methodological critique.

  *   **The Core Question:** Did the *time cost* of subsistence actually increase? This includes not just harvesting, but processing (threshing, grinding) and defense/storage.
  *   **Why it's third:** You can only answer this once you've defined "work" (Question 1) and identified the specific transition (Question 2).
  *   **Tractability:** Medium. Ethnographic analogy (using modern foragers to model past ones) is risky but necessary. The Economists can model the time-allocation budgets; the Archaeologist can validate against tool assemblages and processing infrastructure (e.g., appearance of querns/sickles implies increased processing time).
  *   **Settled vs. Contested:**
      *   *Settled:* Early farming often required *more* labor per calorie than foraging in the same environment.
      *   *Contested:* The baseline. Which foragers? !Kung (abundant environment) vs. Inuit (harsh environment)? Also, "work" for foragers isn't just food acquisition; it's camp maintenance, tool making, etc.
  *   **Dead End Warning:** Do not try to calculate a global average hours-worked. It doesn't exist. Focus on the *marginal* change in labor cost at the specific transition point you selected in Q2.

  ### 4. The Health-Resilience Trade-off (The Diamond Claim)
  **Lead:** Archaeologist (Bioarchaeology focus)
  **Status:** *Downstream / Empirical Test*

  This is the "did we get sicker?" question. It is empirically richer but normatively simpler (everyone agrees disease is bad, mostly).

  *   **The Core Question:** Did stature, dental enamel hypoplasia, and anemia markers decline? Crucially: Did *volatility* increase? (Farming = higher variance/famine risk vs. Foraging = broader portfolio).
  *   **Why it's fourth:** Health data is abundant, but interpreting it requires the normative frame from Q1. (e.g., Is a shorter life with more leisure "better"?).
  *   **Tractability:** High. This is the Archaeologist's home turf. There are massive datasets on Neolithic health (Cohen, Steckel, etc.).
  *   **Settled vs. Contested:**
      *   *Settled:* In the Near East and Europe, early agriculturalists show marked declines in stature and increases in infectious disease markers compared to immediate predecessors.
      *   *Contested:* How universal this is. Some North American contexts show less dramatic declines. Also, the "recovery" period: health often bounces back after the initial transition as systems stabilize.
  *   **What moves this up:** If your Philosopher argues that "suffering" is the primary metric of the "mistake," this becomes Priority 1.

  ---

  ### The Missing Question: Reversibility and Path Dependence
  **You didn't list this, but it should be integrated into Question 1 or 2.**

  *   **The Issue:** The "Mistake" narrative implies a fork in the road where one path was chosen. But historical ecology shows societies *abandoned* farming repeatedly (e.g., the Maori in New Zealand reverted to foraging; various North American groups switched back and forth).
  *   **Why it matters:** If the switch was reversible, "trap" models weaken. If it was irreversible, "mistake" models strengthen (because you're stuck with the mistake).
  *   **Action:** Ask your Archaeologist: "In our case study region, is there evidence of reversion to foraging?" This is a hard empirical check on the "ratchet" theory.

  ### What is Actually Settled? (The Reality Check)
  *To save you time arguing over things the field has already moved past:*

  1.  **Settled:** There was no single "Agricultural Revolution." It happened independently at different times with different packages (wheat vs. maize vs. taro).
  2.  **Settled:** Sedentism often preceded domestication. People settled down *then* started farming, not always the other way around. This undermines the idea that farming *caused* property/territory; territory likely caused farming.
  3.  **Settled:** Early agriculture generally increased infectious disease load and reduced average stature in the Near East/Europe. (Don't let anyone argue this didn't happen; the bone data is robust).
  4.  **Settled:** Hierarchy and storage predate farming in some contexts (Natufians, Jomon, Pacific NW). Farming amplified hierarchy, it didn't necessarily invent it.
  5.  **Contested:** The *labor* input. Time-allocation studies are notoriously difficult to compare across contexts.
  6.  **Contested:** The *mechanism* of adoption. Was it population pressure forcing innovation (Boserup), or did surplus allow population growth (Malthus)? Or was it social competition (feasting models)?

  ### Dead Ends to Avoid
  1.  **"When did it start?"** You will burn weeks trying to pin down a date. It's a gradient. Treat it as a process window (e.g., 9500–8500 BCE), not a year.
  2.  **"Global Welfare."** Do not attempt to weigh the welfare of a Neolithic Levantine against a Neolithic Andean. The ecological constraints are too different. Pick *one* region for deep dive, or compare two distinct ones to isolate variables.
  3.  **"Subjective Happiness."** You cannot measure this. Any claim about whether Neolithic people were "happier" is pure speculation. Stick to measurable proxies (leisure time, health, autonomy).

  ### Re-Ranking Triggers
  *   **Move Q4 (Health) to #1 if:** Your Philosopher convinces the group that "biological suffering" is the only non-arbitrary metric of welfare. (Economists might resist this, but it simplifies the model).
  *   **Move Q2 (Unit of Analysis) to #1 if:** Your Archaeologist reveals that in your chosen region, the "transition" is so gradual that distinguishing "forager" from "farmer" is impossible. (This happens in the Andes).
  *   **Move "Reversibility" to Top if:** You find evidence that your case study group *did* abandon farming and return to foraging successfully. This kills the "Trap/Ratchet" argument and forces a re-evaluation of "Mistake" as a choice.

  ### Final Advice for the Group
  Your biggest risk is the **Economist-Philosopher vs. Archaeologist** friction. The theorists will want to build a model of "The Transition." The Archaeologist will say "The Transition didn't exist like that."
  *   **Solution:** Let the Archaeologist define the *bounds* of the reality (the "possibility space"). Let the Philosopher and Economists build the *evaluation framework* inside those bounds.
  *   **Deliverable:** Don't aim for "Was it a mistake? Yes/No." Aim for: "Under Metric X, it was a mistake; under Metric Y, it was a ratchet; and the evidence suggests Z mechanism drove it." That is a publishable, nuanced conclusion that respects the complexity.
