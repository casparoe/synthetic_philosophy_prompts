  Bottom line first

  The Neolithic transition was indeed a Moloch trap, but framing it as a "mistake" obscures the mechanism. Sahlins is correct that foragers achieved high individual welfare through limited wants, while Diamond and Scott are correct that agriculture enabled demographic dominance at the cost of that welfare. The conflict dissolves when you realize they measure different currencies: Sahlins measures leisure and satisfaction per capita, while Diamond measures population density and state power. The critical failure wasn't calories or health alone, but the loss of exit options. Agriculture didn't just make life harder; it made leaving impossible. Once grain became the tax base, peasants were locked into a system where individual suffering was subsidized by collective reproductive expansion. Therefore, the Diamond/Scott line wins on structural analysis, but only if we accept that "better off" must include the freedom to opt out. The trap wasn't that farming was worse initially; it was that it removed the ability to return to better. This makes it a tragedy of selection, not an error of judgment.

  The two theses at their strongest

  Sahlins's thesis rests on a specific definition of affluence: not endless accumulation, but the easy satisfaction of finite desires. Foragers weren't struggling to get rich; they engineered a society where wants did not outstrip means. By limiting material culture and mobility needs, they ensured work weeks remained short—often fifteen hours—and leisure remained high. This is a welfare argument grounded in subjective satisfaction and time sovereignty. The empirical backing lies in ethnographic time-allocation studies showing hunter-gatherers meet caloric needs with minimal labor, suggesting a rational choice for leisure over surplus. Crucially, Sahlins argues this wasn't subsistence scraping; it was a Zen path to wealth. If you want little, you have enough. This makes the forager economy robust against scarcity because scarcity is socially constructed, not environmentally determined. The forager refuses to be burdened by possessions that hinder movement. Their affluence is a deliberate cultural strategy to maximize freedom and minimize labor input per calorie. The strength here is explaining the stability of foraging lifeways for millennia. If they were starving, they would have farmed. They didn't because they weren't starving. It treats economics as a cultural subsystem, not a biological imperative. This implies that poverty is an invention of civilization, not a natural state of man.

  The Diamond/Scott thesis rests on demographic warfare and state legibility. Agriculture isn't adopted because it's easier; it's adopted because it produces storable surplus that supports higher population densities and standing armies. Grain is visible, divisible, and taxable; roots and herds are not. This system creates a ratchet effect: farming populations expand into foraging territory, absorbing or displacing the locals. The evidence is in the skeletal record—shorter stature, dental decay, zoonotic disease—and the archaeological record of fortifications and storage pits. This is a structural argument grounded in power dynamics and biological cost. It posits that the unit of selection shifted from the individual to the group phenotype. The "worst mistake" isn't that individuals chose poorly, but that the system rewards self-exploitation. Farming allows you to work harder to feed more kids, who work harder to feed more kids, until you are trapped by your own density. It is a Malthusian trap where the only way to maintain status is to expand production, which requires more labor, which requires more children. The state emerges to protect the grain, and the grain protects the state. The strength here is explaining the ubiquity of agriculture despite the costs. It explains why states look the same. It implies that history is not progress but a series of consolidations of power where individual welfare is sacrificed for group resilience.

  Where they actually collide, and where they just talk past each other

  The collision is sharpest on the metric of value. Sahlins measures success by the ratio of wants to means; Diamond measures it by biological integrity and political freedom. If you ask "Who worked less?", Sahlins wins. If you ask "Who had more power?", Diamond wins. But they often talk past each other because Sahlins describes a stable equilibrium while Diamond describes a phase transition. Sahlins explains why foraging persisted for two hundred thousand years; Diamond explains why it vanished in ten thousand. They are describing different phases of the same system. Sahlins assumes the boundary conditions of the foraging world remain intact; Diamond shows how agriculture shattered those boundaries.

  They also talk past each other on agency. Sahlins presents foragers as rational economic actors choosing leisure. Diamond presents peasants as victims of demographic inevitability. This creates a false dichotomy where either foragers were smart or farmers were duped. The reality is likely both: foragers were smart to avoid farming, but farmers were smart to reproduce. The conflict dissolves if you view agriculture as a multi-level selection problem. What is bad for the individual (sickness, labor) is good for the meme complex (expansion, state building).

  The counterfactual is where the fight gets verbal. Sahlins compares the forager to the modern industrial worker. Diamond compares the forager to the early peasant. When Diamond says "worst mistake," he means compared to the foraging alternative. When Sahlins says "affluent," he means compared to the desire for accumulation. They agree on the data: farming meant more work and worse health. They disagree on whether that matters if the population grows. Sahlins cares about the lived experience of the individual. Diamond cares about the trajectory of the species. The Moloch trap framing bridges this: it acknowledges Sahlins's individual welfare loss while accepting Diamond's structural inevitability. The trap is that the system which destroys individual welfare is the system that survives. Furthermore, the selection effect masks the loss: the people who might have kept the good version of forager life are exactly the ones who got absorbed or pushed to margins. We only see the winners of the selection process, making the "mistake" look like progress in retrospect. The debate is often about whether we mourn the lost foragers or celebrate the surviving farmers.

  The phrase "better off" is the verbal trap doing the heavy lifting. Better off for whom? For the individual alive today, or the genetic lineage over millennia? Sahlins ignores the violence of the transition, treating cultures as isolated islands. Diamond ignores the misery of foraging scarcity when it happens, focusing on averages. They talk past each other on time horizon. Sahlins looks at the steady state; Diamond looks at the dynamic shift. In a steady state, Sahlins is right. In a dynamic competition, Diamond is right.

  Want-side vs means-side affluence

  Sahlins runs two arguments: means-side (plenty of food) and want-side (few desires). If wants are endogenous, the want-side argument collapses into unfalsifiability. If you adapt your desires to your chains, you are always affluent. A serf who desires only what his lord allows is technically affluent by Sahlins's definition. This renders the theory useless for comparison across systems. It becomes a tautology: people are satisfied because they want what they have. However, the empirical record supports the means-side argument more strongly: foragers did work less. But the want-side argument survives if we redefine "wants" to include meta-preferences, specifically the desire for exit.

  The hedonic treadmill suggests peasants felt "normal," but objective metrics (height, disease) show biological stress. Feelings adapt; skeletons don't. But the deeper loss wasn't calories or leisure; it was sovereignty. Foragers could walk away from bad social situations. Peasants were tied to land and lord. If affluence includes the power to say "no," then agriculture was a catastrophic reduction in wealth. Sahlins's claim gets stronger if we view "limited wants" as a strategy to maintain exit options. You don't accumulate because accumulation anchors you. Once you anchor yourself with grain stores, you lose the ability to leave.

  So, does "better off" survive? Only if we value freedom over comfort. If wants are fully endogenous, any equilibrium feels normal, and comparison is impossible. But if we treat the capacity to exit as a fundamental human want, then agriculture failed. It traded high exit/low surplus for low exit/high surplus. The empirical record shows the surplus was taxed away, leaving the low exit. Thus, Sahlins is right about the forager strategy, but wrong to imply it was just about leisure. It was about keeping options open. The "affluence" was liquidity of life, not just calories. When agriculture solidified social structures, it froze that liquidity. The want-side argument holds only if we acknowledge that some wants—like autonomy—are universal and not easily adapted away without psychological cost.

  Furthermore, the selection effect biases our view of wants. The people with high exit wants likely stayed foragers longer or fled to the margins. The population that remained to become peasants was the one most willing to tolerate restriction. So the "endogenous wants" we see in agricultural societies are partly a result of filtering out the people who wouldn't adapt. This makes the hedonic treadmill argument even weaker as a defense of agriculture. It wasn't just adaptation; it was selection.

  Can there be a mistake with no mistake-maker?

  "Mistake" implies a mind that could have chosen otherwise. In a Moloch trap, there is no mind, only selection pressures. Calling it a mistake is anthropomorphizing evolution. It was a bad outcome for individuals, but a successful strategy for genes. The subject of the "mistake" is ambiguous. If the subject is the human individual, it was a disaster. If the subject is the human biomass, it was a triumph. The debate hinges on this counterfactual: compared to what? Compared to continued foraging, yes, it was a mistake. Compared to extinction by competing farmers, it was necessary.

  But the selection effect complicates the counterfactual. The people who might have kept the good version of forager life are exactly the ones who got absorbed. We don't see the alternative history where foraging held because those populations were overwritten. The "mistake" looks inevitable because the losers were erased. This makes it a tragedy rather than an error. An error implies you could have done better with the same information. A tragedy implies the structure forced the loss.

  So, can there be a mistake without a mistake-maker? Yes, if we define mistake as "suboptimal equilibrium for the agent." The agent is the human lineage. We moved to a peak that is lower than the previous one but harder to leave. It is a mistake in terms of welfare, not in terms of persistence. The Diamond line works best here: it wasn't a choice, it was a trap. But calling it a mistake validates the idea that there was a better path available, even if we couldn't take it. The "we" who made the mistake is the collective human project, not any specific farmer. The counterfactual holds because we can observe the remaining foragers and see they were healthier. The mistake is real even if the choice wasn't free. It is a systemic failure, not an individual one.

  The horizon matters too. For the first few generations, farming might have been neutral or even beneficial in good years. The mistake compounds over centuries. The subject of the harm is often future generations who inherit the locked-in system. They didn't choose it, but they pay the cost. So the "mistake" is intergenerational. The selection pressure operates on the group, but the cost is borne by the individual over time. This distinguishes it from a simple bad bet. It's a ratchet. You can go up in population, but you can't go down in complexity without collapse. The mistake is locking the door behind you.

  Verdict

  I pick the Diamond/Scott side, but with the Moloch modification. Sahlins is right about the forager experience, but wrong about its viability in a competitive environment. Affluence without defense is just prey. The Neolithic transition was a welfare loss for individuals but a victory for the system. Since the system determines the conditions of life for everyone eventually, the structural analysis wins. We are living in the consequences of the trap, not the affluence. The loss of exit is the definitive metric. If you cannot leave, you are not free, and if you are not free, you are not affluent. Therefore, agriculture was a mistake for humans, even if it was necessary for humanity. The trap is real, and we are still in it.

  Sahlins offers a comforting myth of origin, but Diamond offers a warning about trajectory. In a Moloch trap, the truth that helps you survive is the structural one, not the experiential one. Knowing you were happy in the cage doesn't help you escape it. Knowing how the cage was built might. The verdict must favor the theory that explains the current reality. We are not affluent foragers; we are crowded peasants with smartphones. The structural constraints dictate the experience. Thus, the "worst mistake" framing is the more useful tool for understanding our predicament, provided we acknowledge it was a systemic trap rather than individual stupidity.
