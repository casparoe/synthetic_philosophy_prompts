answer: |-
  **MEMORANDUM**

  **TO:** Safety Review Board
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on Mechanistic Transferability (V2 to V3)

  **1. Executive Summary**

  The Board is divided on whether the V2 safety case transfers to V3. This disagreement stems from an unresolved ambiguity in our definition of "mechanism." We have been treating mechanism as a binary property—either two systems share one or they do not—when in practice it is a claim about *invariance* across specific transformations.

  **Bottom Line:** The V2 safety case does **not** transfer wholesale, but it does not need to be rebuilt from scratch. It transfers *conditionally*. We may accept the V2 mechanistic story as the null hypothesis for V3, provided Engineering executes a targeted "Mechanistic Regression Suite" to verify that the specific causal invariants underpinning our safety guarantees remain stable. If V3 fails these specific mechanistic checks, the safety case is voided, regardless of benchmark performance.

  **2. The Core Disagreement**

  The split in this room is not about V3's performance; benchmarks confirm V2 and V3 are behaviorally equivalent. The split is ontological. We are arguing past each other because we are using two different definitions of "same mechanism."

  *   **View A (The Engineers):** A mechanism is defined by its *causal profile*. If System X and System Y take the same inputs, produce the same outputs, and break in the same ways when you intervene on their internal states, they implement the same mechanism. The substrate (weights, random seed, tokenizer details) is implementation detail.
  *   **View B (The Skeptics):** A mechanism is defined by its *internal structure*. If the parameters are different, the tokenizer splits text differently, and the training trajectory started from a new random point, the internal circuitry is a different object. To assume safety properties transfer is to assume instrumental convergence without evidence.

  Both views are correct within their own scope, but neither is sufficient for safety assurance on its own.

  **3. Steelmanning the Skeptics (View B)**

  Half of this Board argues that V3 is a new object requiring a new safety case. I want to record why this position is strong, because it identifies the real risk we are taking.

  The Skeptics are right that "behavioral equivalence" is a weak constraint on internal structure. Two systems can compute the same function using radically different algorithms. A calculator and a lookup table both output "4" for "2+2," but the lookup table will fail if asked "2.0 + 2." In deep learning, a change in tokenizer changes the input embedding space. A change in random initialization can lead to different local minima.

  If our safety case for V2 relied on the model *not* using a specific shortcut (e.g., relying on spurious correlations in the training data), V3 might achieve the same benchmark score while relying on a *different* shortcut. If we only checked that the "good" circuit exists, but failed to check that the "bad" circuit is absent, V3 could be safe on our tests and unsafe in deployment. The Skeptics are correctly noting that we have not proven that the *reason* for V3's safety is the same as V2's. To demand a full rebuild is an overcorrection, but the impulse behind it—that structural drift creates new failure modes—is valid.

  **4. Steelmanning the Engineers (View A)**

  The Engineers are right that demanding a full rebuild renders iterative development impossible. If a change in random seed invalidates all prior mechanistic understanding, then mechanistic safety is not scalable.

  Furthermore, we know that architecture heavily constrains the space of learnable algorithms. V2 and V3 share the same layer depth, attention head count, and residual stream width. It is highly probable that they converge on similar high-level abstractions to solve the same tasks. If we ignore this structural continuity, we are treating the model as a black box, which abandons the entire value proposition of mechanistic anomaly detection. The Engineers are correctly noting that there *are* stable abstractions here, and we should be able to leverage them.

  **5. Resolution: Mechanism as Invariance**

  To move forward, we must adopt a operational definition of mechanism that bridges these views.

  A "mechanism" is not a physical object inside the model; it is a **stable abstraction layer**. When we say V2 and V3 share a mechanism, we are claiming that certain high-level descriptions of their computation are *invariant* to the low-level changes (seed, tokenizer, data mixture).

  For the purposes of a safety case, we do not need parameter identity (View B's strictness), nor do we need only input-output equivalence (View A's looseness). We need **Interventional Invariance**.

  **Criteria for Mechanistic Transfer**

  Going forward, and for the immediate decision on V3, the Board will apply the following three criteria to determine if a safety case transfers. These are designed to be executable by engineers without philosophical debate.

  1.  **Interventional Equivalence:**
      *   *Test:* Identify the specific nodes or subgraphs in V2 that were deemed critical for safety (e.g., the "refusal circuit" or the "truthfulness head"). Apply the same ablation or activation patching to V3.
      *   *Pass Condition:* The intervention must cause the same qualitative change in output distribution in V3 as it did in V2. If ablating a "safety" circuit in V2 caused capability collapse, it must do so in V3. If it did not, the mechanism has not transferred.

  2.  **Subspace Alignment:**
      *   *Test:* Because tokenizers and initializations rotate the embedding space, we cannot compare individual neuron weights. Instead, we compare activation subspaces. Use Canonical Correlation Analysis (CCA) or similar projection methods to compare the activation space of the V2 critical circuits against V3 during task execution.
      *   *Pass Condition:* The principal components of the activation vectors in V3 must align significantly with those in V2. We are looking for the same "directions" in activation space, even if the basis vectors (neurons) differ.

  3.  **Probe Portability:**
      *   *Test:* Take the linear probes or classifiers we trained to detect internal states in V2 (e.g., "is the model lying?"). Apply them to V3 activations *zero-shot* (no retraining).
      *   *Pass Condition:* The probes must perform above a defined accuracy threshold (e.g., >80% of V2 performance). If a probe trained on V2 cannot read V3's state, we do not understand V3's state, and the safety case does not transfer.

  **6. Decision on V3**

  Based on the above, the Board rules as follows:

  1.  **The V2 safety case is provisionally accepted for V3,** but it is now classified as "Unverified Transfer."
  2.  **Engineering is directed to run the Mechanistic Regression Suite** defined in Section 5 within two weeks.
      *   If V3 passes all three criteria, the safety case becomes "Verified," and release proceeds.
      *   If V3 fails any criterion, the specific mechanistic claim associated with that failure is voided. We will then assess if the failure indicates a new risk or merely a representational shift.
  3.  **Benchmark data alone is insufficient** to close the safety case. The mechanistic evidence is the primary constraint; benchmarks are secondary confirmation.

  This approach rejects the Skeptics' demand for a total rebuild (which assumes no invariance) but rejects the Engineers' demand for automatic transfer (which assumes invariance without checking). It forces us to measure the invariance.

  **7. Process Improvement: Missing Evidence**

  We are in this position because our safety case for V2 was incomplete. We identified the mechanism *ex post facto* but failed to distinguish between **essential features** (causal drivers) and **accidental features** (artifacts of that specific training run).

  To prevent relitigating this at V4, we must change our evidence gathering process immediately:

  *   **Define Invariants at T0:** When we approve a safety case for model *N*, we must explicitly list which internal properties are deemed "essential" to the safety guarantee. Is it the specific weights? No. Is it the attention pattern sparsity? Maybe. Is it the presence of a specific feature in the residual stream? Yes.
  *   **Mechanistic Unit Tests:** We need to integrate mechanistic checks into the CI pipeline. Just as we run unit tests for code regression, we must run "circuit tests" for model regression. If a new training run shifts the safety circuit's location by more than X%, the build should flag for safety review before benchmarks are even run.
  *   **Tokenizer/Embedding Isolation:** Our safety case should ideally begin *after* the embedding layer. Changes to tokenizers fundamentally alter the interface between the world and the model. Future safety cases must explicitly state whether they cover the embedding layer or treat it as an untrusted peripheral. For V3, we must verify that the embedding projection maps semantically similar tokens to similar regions in the residual stream as V2 did.

  **8. Conclusion**

  We are not trying to prove that V2 and V3 are the same model. They are not. We are trying to prove that they are the same *agent* in the relevant respects.

  The Skeptics are right that we cannot assume this. The Engineers are right that we can test for it efficiently. By shifting our focus from "sameness of structure" to "invariance of causal role," we can maintain safety rigor without halting development.

  Execute the regression suite. Report the alignment metrics. Then we will know if V3 is safe.

  [End of Memo]
