  **The Case**

  On the conservator's workbench sits a sealed letter, enclosed in a glass case filled with argon to prevent any chemical decay, oxidation, or dust accumulation, ensuring that not a single atom is added to or subtracted from the packet over the course of a decade. Yesterday, the statement 'This letter has remained sealed for ten years' was false; today, precisely ten years since the wax was stamped, it is true. No physical alteration has occurred, no market has valued it differently, and no human opinion has shifted; only the passage of time has converted the falsehood into a truth. The property in question is 'having remained sealed for ten years', a condition that requires a continuous temporal extent rather than a momentary state. The quarrel turns on the sentence: 'This object now present possesses the property of having remained sealed for ten years'. Both agree the sentence is true, but they divide on whether the property belongs to the object wholly present at this instant or to the extended entity of which this instant is merely a part.

  **The Verdict of Each View**

  The endurantist holds that the letter is wholly present at every moment of its existence. For this view, the object itself persists by enduring through time, carrying its history as a set of accumulated properties. Consequently, the letter sitting on the bench today is the very same entity that was sealed ten years ago, and it now bears the property of 'having remained sealed for ten years' as a direct attribute of its current self. The truth of the sentence is grounded in the fact that the wholly present object stands in a specific relation to its own past, a relation that is intrinsic to the object now.

  The perdurantist holds that the letter is a four-dimensional space-time worm, composed of temporal parts spread across the decade. For this view, the object persists by perduring, meaning what is present on the bench is merely the final temporal slice of the whole entity. The property 'having remained sealed for ten years' cannot belong to a momentary slice, as a slice has no temporal thickness to contain a decade. Instead, the property belongs to the entire space-time worm. The sentence is true only because the name 'this letter' refers to the whole worm, not merely the slice currently visible; the slice itself is merely the locus where the worm's ten-year property is manifest, not the bearer of it.

  **The Single Feature and Its Removal**

  The feature doing the work is the absolute absence of material change coupled with the acquisition of a duration-dependent property. The object remains materially identical while crossing a temporal threshold that alters its truth conditions. If this feature were removed—for instance, if the letter had yellowed or accumulated dust—the case would collapse into a familiar problem of material constitution or qualitative change, where physical alteration could be blamed for the new property. If the duration requirement were removed, the property would be instantiable at a moment, dissolving the need for a temporal extension entirely. The case relies entirely on the tension between material stasis and temporal growth.

  **The Attack**

  The defender of perdurantism comes off worse, as the view demands we deny that the object before our eyes is the primary bearer of its own history. A committed perdurantist would attack the case by arguing that it relies on an intuitive but mistaken identification of the 'object now present' with the 'whole object'. They would claim the endurantist is seduced by language into thinking a three-dimensional slice can hold a four-dimensional property. This attack lands partially, as it exposes the linguistic ambiguity of 'this object', but it fails to resolve the discomfort of telling a conservator that the letter they are preserving is not the thing that possesses the age they are measuring.

  **Verbal Disagreement**

  A significant part of the disagreement is merely verbal, centreing on the reference of the term 'object'. When the endurantist says 'this object', they refer to the three-dimensional entity wholly present now; when the perdurantist says 'this object', they refer to the four-dimensional aggregate. However, the disagreement is not *entirely* verbal, as it rests on a substantive ontological divergence regarding whether persistence is a matter of being wholly present at each time or being extended across time. The verbal clash masks a deeper conflict over what kinds of entities populate reality.
