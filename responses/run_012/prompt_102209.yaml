answer: |-
  The resin cures to something like a bone,
  Ensuring that the color claims its day.
  But authenticity stands strictly alone,
  Unwilling to be stabilized or stayed.
  We argue for a future clearly known,
  Against the ruin's right to slow decay.
  One logic builds a shelter, fully grown,
  The other lets the plaster have its way.
  The future asks to be distinctly shown,
  The present asks to vanish where it lay.
  The hand hovers above the exposed stone,
  Seeking a reason that will not obey.
  There is no bridge between the solid tone,
  And the dust that settles on the clay.
  The values sit upon a separate throne,
  The light moves on. The reasons turn away.

  ***

  **Note on Philosophical Accuracy**

  I'm reasonably confident the poem captures the *structure* of incommensurability (specifically the Razian view that there is no common metric of measurement) via the two rhyme schemes that run parallel without intersecting or resolving into a couplet. The lack of a volta mirrors the lack of a rationally determined solution.

  The point I'm least sure of is whether the ending ("The reasons turn away") leans too heavily into *incomparability* rather than *incommensurability*. In the literature (e.g., Ruth Chang), values can be incommensurable yet still comparable (they are "on a par"), allowing for a choice that is not determined by reason but is not irrational. The poem risks suggesting the reasons simply vanish or fail to apply, rather than failing to *determine* a choice. I prioritized the formal feeling of non-translation over the nuance of parity, as the former reads more clearly aloud, but a strict Chang-advocate might quibble with the finality of the separation.
