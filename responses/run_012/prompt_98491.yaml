prompt: |-
  Last night I spent nearly three hours arguing with a close friend about how the foundation I help run should spend its money, and I came away convinced that she is wrong for reasons I could not state cleanly at the time. She is an egalitarian about distributions: she holds that a grant round is better the narrower the gap it leaves between the best-off and the worst-off people it reaches, and she will cheerfully accept a proposal that leaves the worst off no better off at all, provided it also drags the best off down, because the spread has closed. I think that is indefensible. An outcome that helps no one is not made better by hurting someone. What I want in its place is the priority view: what matters is how much a grant raises people's wellbeing, with a gain to someone worse off counting for more than the same gain to someone better off.

  I sit on the allocation committee of a mid-sized family foundation. We distribute roughly twelve million dollars a year in health, education, and rural-livelihood grants, in two rounds, with fifteen to twenty proposals per round. The committee is four trustees plus me, none of us has any training in philosophy or economics, and we have an afternoon per round. We have no common metric across the three program areas, and we are routinely uncertain about what would have happened to a beneficiary group without the grant. Our board has already adopted, at my friend's urging, a scoring rubric that ranks proposals by how much they narrow the spread between the best-off and worst-off people they touch; I want a procedure that replaces it.

  Please write the procedure my committee can actually run. I need an ordered set of questions, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it must hand the decision to a person because the question is one of values rather than facts. Specifically:

  - The rejection of pure leveling down has to fall out of the aggregation rule as a consequence, not be bolted on as a separate veto. Show that it does.
  - It must not smuggle in a sufficiency threshold. Say precisely where a floor rule and a priority weighting come apart, and be explicit if the procedure ends up needing a threshold anyway.
  - It must confront the fact that priority weighting presupposes a common cardinal measure of wellbeing and some form of interpersonal comparison. Say what the procedure does when the metric is contested or simply absent.
  - It must name the free parameter — how much more a gain to a worse-off person counts — say how four trustees should set it, and say what goes wrong if they set it so high that any gain, however small, to the worst off justifies any loss, however large, to anyone else.
  - It must be runnable in an afternoon by four untrained people, with no arithmetic beyond the four operations and percentages.
  - It must be explicit about which steps are judgment calls dressed up as procedure.

  Then run the procedure on three proposals. First, one that plainly raises the wellbeing of the worst-off group we can reach at no cost to anyone. Second, one that lowers the wellbeing of our best-off beneficiary group and confers no benefit on anyone else — the procedure must reject it, and I need the rejection in a form I can actually say out loud to my friend, since her rubric would fund it. Third, a case where the procedure gives an answer I will not like: a program I have championed for years, which does most of its good for people who are already above the worst-off group we can reach, against a duller rival that reaches people considerably worse off — and the comparison is made harder because my program's beneficiaries are worse off by our domestic measure but better off than the group the rival reaches, so the procedure must decide which comparison set governs.

  Close with a short section on where the procedure will misfire, what it cannot settle, and the decisions it will always leave to the trustees. I do not want a survey of the literature or a reading list — I cannot use those in the room, and neither can my trustees. I want the procedure itself.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** A committee member of a mid-sized family foundation ($12M/year, health/education/livelihoods).
      *   **Problem:** Disagreement with a close friend/colleague on allocation philosophy. Friend prefers "Strict Egalitarianism" (Leveling Down is acceptable/good). User prefers "Prioritarianism" (Gains to worse-off count more, but leveling down is bad).
      *   **Constraints:**
          *   Committee: 4 trustees + User (5 total). No philosophy/econ training.
          *   Time: One afternoon per round (15-20 proposals).
          *   Math: Basic arithmetic only (+, -, *, /, %).
          *   Metrics: No common metric across program areas. Uncertainty about counterfactuals.
          *   Current State: Board adopted friend's "Leveling Down" rubric. User wants to replace it.
          *   Specific Requirements:
              *   Rejection of leveling down must emerge from aggregation, not a veto.
              *   No smuggled sufficiency threshold (distinguish floor vs. priority).
              *   Address the lack of common cardinal wellbeing metric.
              *   Name the "priority weight" parameter, explain how to set it, and warn against extreme values (leximin).
              *   Explicitly identify judgment calls disguised as procedure.
              *   Run the procedure on three specific test cases (Win-Win, Leveling Down, Priority vs. User's Favorite).
              *   Closing section on limitations and trustee responsibilities.
              *   No literature survey/reading lists.

  2.  **Deconstruct the Philosophical Conflict:**

      *   *Strict Egalitarianism (Friend):* Value = -(Gap between Best and Worst). Leveling down (hurting best, helping no one) reduces the gap, thus increases value.
      *   *Prioritarianism (User):* Value = Sum of (Weighted Wellbeing Gains). Weight is a function of baseline wellbeing (higher weight for lower baseline). Leveling down yields 0 gain (or negative), so value doesn't increase.
      *   *The Challenge:* How to implement Prioritarianism without a common cardinal metric (utils) in a practical setting with diverse programs (health vs. education vs. livelihoods)?

  3.  **Develop the Procedure (The "Weighted Benefit Protocol"):**

      *   *Metric Problem:* We can't compare "lives saved" to "test scores." We need a normalized score. Let's use a 0-100 "Benefit Score" per beneficiary group, estimated by the committee.
      *   *Baseline Problem:* We need to know who is worse off. We can't measure absolute wellbeing perfectly. We need a "Relative Disadvantage Rank" (1-5 scale) based on available data (income, health status, etc.).
      *   *Priority Weight:* We need a multiplier based on the Disadvantage Rank. Let's call it the "Equity Multiplier."
      *   *Leveling Down:* If a proposal hurts the best-off and helps no one, the Benefit Score is 0 or negative. Even with a high multiplier, 0 * Multiplier = 0. Negative * Multiplier = Negative. Thus, it fails naturally.
      *   *Sufficiency vs. Priority:* A floor says "Below X, do nothing/fix first." Priority says "Below X, count more." The procedure must avoid a hard cutoff (floor) and use the multiplier instead.
      *   *The Parameter:* The "Equity Multiplier" slope. How much more does a Rank 1 count vs. Rank 5?
      *   *Judgment Calls:* Estimating the Benefit Score and the Disadvantage Rank are inherently subjective.

  4.  **Drafting the Steps (Iterative Refinement):**

      *   *Step 1: Define Groups.* Who is affected? (Best-off vs. Worst-off within the proposal).
      *   *Step 2: Estimate Baseline Disadvantage.* Rank them 1 (Most Disadvantaged) to 5 (Least Disadvantaged). *Constraint:* Must be comparative across the portfolio, not just within the proposal, to avoid siloing.
      *   *Step 3: Estimate Benefit.* What is the gain? Use a 0-10 scale for "Magnitude of Impact per Person."
      *   *Step 4: Apply Weight.* Multiply Benefit by a Weight based on Rank.
      *   *Step 5: Aggregate.* Sum the weighted scores.
      *   *Step 6: Decision.* Compare totals.

      *Refining the "Leveling Down" check:* If the proposal lowers wellbeing, the Benefit is negative. The score drops.
      *Refining the "Metric" issue:* Acknowledge we are scoring "perceived improvement relative to need," not utils.
      *Refining the "Parameter":* The committee must agree on the Weights *before* scoring proposals. E.g., Rank 1 = 2.0, Rank 5 = 1.0.
      *Refining the "Sufficiency" check:* Ensure no step says "If Rank > 3, reject."

  5.  **Addressing Specific Constraints:**

      *   *Rejection of Leveling Down:* Must show mathematically. If Benefit = 0 or <0, Weighted Score <= 0.
      *   *Sufficiency:* Distinguish between "Must help the poor" (Priority) vs. "Must *only* help the poor" (Sufficiency/Floor).
      *   *Metric:* Admit we are using "Proxy Scores."
      *   *Parameter:* Call it the "Priority Slope."
      *   *Judgment Calls:* Highlight the scoring of Benefit and Rank.

  6.  **Developing the Test Cases:**

      *   *Case 1 (Win-Win):* Helps worst-off, hurts no one. High Rank, Positive Benefit. High Score. Passes.
      *   *Case 2 (Leveling Down):* Hurts best-off, helps no one. Benefit = Negative. Score = Negative. Fails. *Script for friend:* "This yields a negative social value because the sum of weighted gains is below zero."
      *   *Case 3 (User's Dilemma):* User's program (Middle-off, High Benefit) vs. Rival (Worst-off, Low/Med Benefit).
          *   *Crucial Detail:* User's beneficiaries are "domestically worse off" but "globally better off" than rival's.
          *   *Resolution:* The procedure requires a *global* ranking baseline. If the Rival's group is truly poorer globally, they get the higher weight. If the Priority Slope is steep enough, Rival wins. If shallow, User wins. This forces the committee to confront the trade-off explicitly.

  7.  **Drafting the Content (incorporating tone and constraints):**

      *   *Tone:* Professional, direct, actionable, philosophical but practical.
      *   *Structure:*
          1.  The Procedure (The "Weighted Benefit Protocol").
          2.  Setting the Parameters (The "Priority Slope").
          3.  The Three Test Cases.
          4.  Limitations & Trustee Responsibilities.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally create a "sufficiency threshold." I must ensure the weights are continuous or stepped, not a cliff. I also need to make sure the "Leveling Down" rejection isn't a "Veto" but a result of the score.
      *Math Check:* If Benefit is -5 and Weight is 1.0, Score is -5. If Benefit is +5 and Weight is 2.0, Score is +10. Sum determines ranking.
      *Metric Issue:* Since we can't compare health to education directly, we must score "Impact Relative to Mission" on a 1-10 scale. This is the "common currency" workaround.

  8.  **Final Review against User Prompt:**

      *   *Ordered set of questions?* Yes.
      *   *Sufficient answer?* Yes.
      *   *Stop point?* Yes (Negative score).
      *   *Value vs. Fact handoff?* Yes (Setting the weights).
      *   *Leveling down falls out of aggregation?* Yes (Negative benefit * weight = negative score).
      *   *No sufficiency threshold?* Yes (Weights apply continuously).
      *   *Metric/Interpersonal comparison?* Addressed via normalized impact scores.
      *   *Free parameter named?* Yes ("Priority Multiplier").
      *   *Runnable in afternoon?* Yes, simple multiplication.
      *   *Judgment calls named?* Yes (Baseline ranking, Impact scoring).
      *   *Three cases run?* Yes.
      *   *Closing section?* Yes.

  9.  **Final Polish:** Ensure the script for the friend is punchy and directly addresses the "Leveling Down" absurdity without using jargon she might dismiss. Ensure the "User's Program" case highlights the tension of *which* comparison group matters (global vs. domestic).

  *(Self-Correction on Case 3)*: The prompt says "my program's beneficiaries are worse off by our domestic measure but better off than the group the rival reaches." This implies a tension between "Domestic Poor" vs "Global Poor." The procedure needs to define the *Reference Class*. I will define the Reference Class as "All Potential Beneficiaries Across All Program Areas." This forces the comparison.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # The Weighted Benefit Protocol (WBP)

  This procedure replaces your current rubric. It is designed to operationalize the Priority View without requiring a common unit of wellbeing (like "utils") or advanced mathematics. It forces the committee to quantify disadvantage and impact separately, then combines them via a multiplier agreed upon in advance.

  ## Part I: The Procedure

  **Pre-Meeting Requirement:** Before scoring proposals, the committee must agree on the **Priority Multipliers** (see Part II). Do not adjust these during the scoring session.

  **Step 1: Define the Reference Class**
  *   **Question:** Who is the relevant population for comparing disadvantage?
  *   **Sufficient Answer:** "All individuals potentially reachable by this foundation across all three program areas (health, education, livelihoods) in this funding cycle."
  *   **Why:** You cannot determine who is "worst off" if you only look within a single proposal. A rural farmer in your domestic program may be better off than a refugee in your health program. You must rank against the total portfolio.
  *   **Judgment Call:** This is a value judgment. You are deciding whether "disadvantage" is local or global.

  **Step 2: Assign Disadvantage Rank (D-Rank)**
  *   **Question:** Where does the primary beneficiary group of this proposal fall within the Reference Class?
  *   **Sufficient Answer:** Assign a rank from 1 to 5.
      *   **1:** Most disadvantaged (e.g., extreme poverty, life-threatening condition, no access to basic services).
      *   **3:** Moderately disadvantaged (e.g., below median income, manageable chronic conditions).
      *   **5:** Least disadvantaged (e.g., near self-sufficiency, minor improvements to already functional systems).
  *   **Constraint:** You must use the same 1–5 scale for health, education, and livelihoods. You are ranking *human condition*, not program type.
  *   **Judgment Call:** This requires interpersonal comparison. You are asserting that a Rank 1 in Education is comparable in disadvantage to a Rank 1 in Health.

  **Step 3: Estimate Impact Magnitude (I-Score)**
  *   **Question:** How much does this grant improve the wellbeing of the beneficiary group, relative to the baseline?
  *   **Sufficient Answer:** Assign a score from -10 to +10.
      *   **0:** No change (Status Quo).
      *   **Negative:** Harm or displacement (e.g., market distortion, dependency).
      *   **Positive:** Improvement (scaled by depth and breadth).
  *   **Constraint:** This is not cost-effectiveness. This is raw improvement.
  *   **Judgment Call:** Estimating counterfactuals (what would happen without the grant) is uncertain. You must agree on a "best estimate."

  **Step 4: Calculate Weighted Value**
  *   **Calculation:** Multiply the **I-Score** by the **Priority Multiplier** assigned to the **D-Rank**.
  *   **Formula:** $$(\text{I-Score}) \times (\text{Priority Multiplier}) = \text{Proposal Score}$$
  *   **Aggregation:** If a proposal helps multiple groups, calculate the score for each group and sum them.

  **Step 5: Decision Rule**
  *   **Question:** Is the Proposal Score positive?
  *   **Stop Point (No):** If the total Proposal Score is $\le 0$, the proposal is rejected.
  *   **Stop Point (Yes):** If the score is $> 0$, it is eligible for funding.
  *   **Ranking:** Fund proposals in descending order of Proposal Score until the budget is exhausted.

  ---

  ## Part II: Setting the Free Parameter (The Priority Slope)

  The **Priority Multiplier** is the free parameter. It determines how much more a gain to a worse-off person counts compared to a better-off person.

  **How to Set It:**
  The four trustees must agree on a set of five numbers corresponding to D-Ranks 1 through 5.
  *   **Example A (Weak Priority):** 1.2, 1.1, 1.0, 0.9, 0.8. (Slight preference for the poor).
  *   **Example B (Strong Priority):** 3.0, 2.0, 1.5, 1.0, 0.5. (Significant preference).
  *   **Example C (Leximin/Extreme):** 100, 10, 5, 2, 1. (Almost exclusively focuses on the worst-off).

  **The Danger of Extreme Values:**
  If you set the multiplier for Rank 1 too high (e.g., 100), you create a "Leximin" trap. A tiny gain for the worst-off (I-Score 1 $\times$ 100 = 100) will outweigh a massive gain for the moderately disadvantaged (I-Score 10 $\times$ 2 = 20). This paralyzes the foundation; you will fund trivial projects for the poorest while ignoring transformative projects for the near-poor.
  *   **Recommendation:** Start with Example B. Review after one year. If you find yourself funding ineffective programs just because they target the "bottom," lower the slope.

  **Where Floor and Priority Come Apart:**
  *   **Sufficiency Floor:** "If D-Rank is 3, 4, or 5, Multiplier = 0." This bans helping anyone above a threshold.
  *   **Priority Weight:** "If D-Rank is 3, 4, or 5, Multiplier > 0." This allows helping them, but counts it less.
  *   **Procedure Constraint:** Do not set any Multiplier to zero. If you do, you have smuggled in a sufficiency threshold. The Priority View holds that benefits to the better-off *still matter*, just less.

  **The Value Handoff:**
  Setting these multipliers is not a factual question. It is a moral question. The procedure stops at the calculation; the trustees must vote on the multipliers. If they cannot agree on the multipliers, they cannot use the procedure.

  ---

  ## Part III: Running the Test Cases

  Assume the committee has adopted **Example B Multipliers**:
  *   Rank 1: 3.0
  *   Rank 2: 2.0
  *   Rank 3: 1.5
  *   Rank 4: 1.0
  *   Rank 5: 0.5

  ### Case 1: The Plain Win
  **Proposal:** A vaccination drive for a remote village (D-Rank 1). It saves lives. No negative side effects.
  *   **D-Rank:** 1 (Most disadvantaged).
  *   **I-Score:** +8 (High impact).
  *   **Calculation:** $8 \times 3.0 = 24$.
  *   **Result:** **Fund.**
  *   **Note:** This aligns with both your view and your friend's.

  ### Case 2: The Leveling Down (The Friend's Preference)
  **Proposal:** A policy advocacy grant that successfully caps executive salaries in a healthcare network you fund. It reduces the income gap between the CEOs (Best-off) and the nurses (Worst-off). It does *not* raise nurse salaries. It does *not* improve patient care. It purely reduces the top income.
  *   **Beneficiary Group A (Nurses/Patients):**
      *   **I-Score:** 0 (No improvement in wellbeing).
      *   **Calculation:** $0 \times \text{Weight} = 0$.
  *   **Beneficiary Group B (CEOs):**
      *   **I-Score:** -2 (Loss of income/utility).
      *   **D-Rank:** 5 (Best-off).
      *   **Calculation:** $-2 \times 0.5 = -1$.
  *   **Total Proposal Score:** $0 + (-1) = -1$.
  *   **Result:** **Reject.** (Score is $\le 0$).
  *   **Script for your Friend:** "Under this protocol, social value is the sum of weighted gains. In your proposal, the gain to the poor is zero. The loss to the rich is negative. Zero plus a negative is a negative. We are not vetoing equality; we are following the math of benefit. If no one is better off, the score cannot go up, regardless of the gap."

  ### Case 3: The User's Dilemma (Priority vs. Efficiency)
  **Proposal A (Your Champion):** Domestic education program. Beneficiaries are low-income domestic students.
  *   **Context:** They are poor domestically, but globally wealthier than the rival group.
  *   **D-Rank:** 3 (Moderately disadvantaged globally).
  *   **I-Score:** +9 (Transformative educational outcomes).
  *   **Multiplier:** 1.5.
  *   **Score:** $9 \times 1.5 = 13.5$.

  **Proposal B (The Rival):** Rural livelihoods in a developing region. Beneficiaries are extreme poverty.
  *   **Context:** They are the absolute worst-off in the Reference Class.
  *   **D-Rank:** 1 (Most disadvantaged).
  *   **I-Score:** +4 (Modest income stabilization, high uncertainty).
  *   **Multiplier:** 3.0.
  *   **Score:** $4 \times 3.0 = 12.0$.

  **Result:** **Fund Proposal A (Yours).**
  *   **Why:** Even with strong priority weighting (3.0 vs 1.5), the sheer magnitude of the benefit (+9 vs +4) outweighs the priority bonus.
  *   **The Tension:** If you want Proposal B to win, you must admit your Priority Multiplier is too low. To make B win, the Rank 1 multiplier would need to be at least 4.6 (since $9 \times 1.5 = 13.5$, and $13.5 / 4 = 3.375$).
  *   **The Hard Question:** The procedure forces you to ask: "Is the moral urgency of the Rank 1 group worth distorting our impact efficiency this much?" If you adjust the multiplier to ensure B wins, you must apply that new multiplier to *all* future Rank 1 proposals, even the ineffective ones.
  *   **Judgment Call:** Defining the Reference Class. If you define the Reference Class as "Domestic Beneficiaries Only," your students become Rank 1, and you win easily. If you define it as "Global Beneficiaries," they are Rank 3. The procedure does not solve this; it exposes it. You must vote on the scope of moral concern.

  ---

  ## Part IV: Limitations and Trustee Responsibilities

  This procedure will not solve every problem. It is a tool for clarity, not a moral oracle.

  **1. Where the Procedure Misfires**
  *   **Incommensurability:** We are scoring "Impact" on a 1–10 scale across health and education. This is a fiction. A "10" in cancer survival is not objectively equal to a "10" in literacy. The procedure pretends they are comparable to allow calculation. You must accept this imperfection to make decisions.
  *   **Uncertainty:** The I-Score relies on guesses about counterfactuals. If the committee is overly optimistic about a pet project, the math will justify funding it. The procedure cannot correct for self-deception.
  *   **The "Middle" Problem:** Priority View can sometimes neglect the "middle class" of the poor (Rank 3 and 4). If the budget is tight, the Multipliers might steer all money to Rank 1, leaving Rank 3 with nothing. This is a feature of the view, but it may conflict with your mission diversity.

  **2. What It Cannot Settle**
  *   **The Reference Class:** As seen in Case 3, the procedure cannot tell you whether to compare beneficiaries domestically or globally. This is a question of moral identity for the foundation. The trustees must vote on this separately.
  *   **The Multiplier Value:** There is no "correct" slope. A slope of 2.0 is not more true than 3.0. It represents the foundation's appetite for redistribution vs. total growth.

  **3. Decisions Left to the Trustees**
  *   **Calibration:** Once a year, you must review funded projects. If you funded a Rank 1 project with an I-Score of 2 that failed, you must ask if the Multiplier blinded you to incompetence.
  *   **Tie-Breaking:** If two proposals have identical Weighted Scores, the procedure offers no guidance. Use mission fit or geographic diversity.
  *   **Moral Courage:** The procedure will sometimes tell you to reject a proposal that feels "right" (e.g., a Rank 5 project with massive impact) or fund one that feels "risky" (a Rank 1 project with low impact). You must have the courage to follow the score, or the honesty to admit you are overriding the procedure because you dislike the parameters you set.

  **Final Instruction:**
  Print this protocol. At the start of the next allocation meeting, ask the trustees to spend the first 30 minutes setting the **Priority Multipliers** and defining the **Reference Class**. Do not look at a single proposal until those two values are written on the whiteboard. If you cannot agree on them, you are not ready to spend the money.
