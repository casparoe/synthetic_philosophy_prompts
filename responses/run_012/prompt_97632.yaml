prompt: |-
  I'm a philosophy professor and next month I'm doing a guest session in a friend's cognitive-science seminar — mixed crowd, maybe a dozen PhD students from philosophy and psych plus one machine-learning person, ninety minutes, whiteboard, no slides. The topic is Molyneux's problem. I don't want you to explain the problem to me and I definitely don't want a reading list, I know the literature; I want you to plan how I should teach it. So: the order the pieces have to go in and why (what has to be in place before the question even makes sense to them), the one concrete case that carries the whole thing and what it must have and must lack — and if you think it shouldn't just be the stock cube and the sphere, argue for the replacement — the misconceptions they'll walk in with or form, and exactly where in the sequence I head each one off, plus one question I can put to the room at the end that would tell me whether they've got the problem rather than just the story.

  Two things I want the plan to take an actual stance on, because I keep flip-flopping. First, the formulation everyone remembers isn't the one Molyneux first sent: the original letter asks both whether the man could tell the cube from the sphere by sight and whether he could tell by sight alone whether the objects were within reach at twenty feet or a thousand, and it's only the later, trimmed version that Locke printed in the Essay that makes it purely about shape. Do I keep the distance half in, messy and interesting as it is, or cut it — and if I cut it, how do I keep them from concluding the whole thing is just object recognition? Second, the historical yes-answers aren't all the same shape: one route is that sight and touch share extension so the inference goes through, and there's a more surgical line, I think it's Reid's, that newly sighted people could get flat figures like squares and circles right away but not solids — a partial answer the students never predict, which might be worth making them commit to before I reveal it. There's also that much older version from Islamic philosophy where the man is told about colors rather than shapes; useful warm-up, or does it muddy things? And I know at least one student will push on the sensory-substitution angle — suppose someone blind from birth has spent years with one of those camera-to-tongue devices that paints a video signal onto the tongue as a tactile pattern: is that person still "born blind" for the purposes of the question, and if they then pass the cube-and-sphere test, has the question been answered or dissolved? Meanwhile the ML person will say it's all just cross-modal alignment and can be settled by training. I want a slot in the plan where those two land, because neither is stupid and I don't want to just wave them off. Tell me how confident you are in the plan as a whole and flag the single step you're least sure of — I'd rather know which part is a guess than get a smooth answer. And after the prose plan, give me a compact structured summary I can paste into my notes: a JSON object with fields `sequence` (ordered array, each entry the idea plus what it depends on), `carrying_case` (the case, and the features it must have and must lack), `misconceptions` (array of objects with `misconception` and `where_defused`), `check_question`, `omitted` (what I should leave out at this level and say so), and `least_confident_step`.
