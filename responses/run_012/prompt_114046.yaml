answer: |-
  Here is the spec. I've stripped out the theory labels. This is just the data and the demands any account has to meet if it wants to survive the first ten minutes of Q&A.

  ### Part 1: The Candidate List (Brainstorm & Filter)

  I started with a wider net and winnowed it down. Here is what didn't make the cut and why, so you know where I'm drawing the line:
  *   *The "Conscious Awareness" Requirement:* I dropped this. Too many cases of flow state or expert automation where consciousness is minimal or absent.
  *   *The "Success" Requirement:* I dropped this. You can know how to sink a putt and miss. Skill is not identical to success.
  *   *The "Normativity" Requirement:* Too vague. It's implied by the "Explanatory" requirement below.

  Here is the final list of six desiderata. I have marked the **Status** of each: **Consensus** (almost everyone agrees this is data), **Contested** (one camp treats it as data, the other as a bug), or **My Call** (where the literature is muddy and I'm imposing structure).

  #### 1. The Dissociation Requirement
  *   **What:** An agent can possess the knowledge-how without possessing the corresponding declarative knowledge-that, and without the ability to articulate the rules governing their action.
  *   **The Case:** Chick sexers who can sort accurately but cannot teach you the rule; amnesic patients who improve at mirror-tracing despite no memory of the task; the batsman reading the wrist.
  *   **Status:** **Consensus.** Even hard-line Intellectualists usually grant this, though they try to explain it away as a performance error rather than a competence deficit.

  #### 2. The Guidance Requirement
  *   **What:** The knowledge must play an active role in directing the action, not merely correlate with it. It must distinguish the knower from a lucky guesser or a rigid reflex machine.
  *   **The Case:** The guided tourist. They get everywhere on time, but if the guide vanishes, they are lost. They have the *ability* to follow, but not the *knowledge* of how to navigate. A theory must distinguish the tourist from the navigator.
  *   **Status:** **Consensus.** This is the core difference between "mere ability" and "skill."

  #### 3. The Resilience Requirement
  *   **What:** The knowledge persists through temporary physical incapacities or changes in context, provided the agent's underlying capacity remains.
  *   **The Case:** The broken arm. A pianist with a broken arm still knows how to play the Moonlight Sonata; they just can't execute it. If the theory identifies the knowledge *with* the disposition to move, it fails here.
  *   **Status:** **Consensus.** Distinguishes the *state* of knowing from the *manifestation* of doing.

  #### 4. The Gradability Requirement
  *   **What:** Knowing-how admits of degrees. It is not binary.
  *   **The Case:** A novice, a journeyman, and a grandmaster all "know how" to play chess, but in vastly different ways. A theory that treats it as a binary relation (either you stand in the relation to the proposition or you don't) struggles here.
  *   **Status:** **Contested.** Intellectualists often treat this as a pragmatic feature of ascription, not the state itself. Anti-Intellectualists treat it as fundamental to the nature of the state.

  #### 5. The Interference Requirement
  *   **What:** Explicit reflection on the mechanics of the action can degrade or destroy the performance.
  *   **The Case:** "Choking" under pressure or the centipede's dilemma. If knowing-how were simply grasping a set of facts, thinking harder about those facts should help, or at least not hinder. The fact that monitoring disrupts flow suggests the knowledge is not held in the same format as the monitoring.
  *   **Status:** **My Call.** I'm elevating this. Many theories ignore it. But if you can't explain why thinking about your knowledge breaks your skill, you haven't explained skill.

  #### 6. The Explanatory Requirement
  *   **What:** Attributing knowledge-how must explain the action in a way that attributing "mere ability" does not. It must account for the *flexibility* and *appropriateness* of the response to novel situations.
  *   **The Case:** A thermostat has the ability to regulate temperature, but we don't say it knows how. A skilled agent adjusts to wind, light, and opponent strategy. The knowledge explains the *adaptation*, not just the output.
  *   **Status:** **Consensus.** This is the job description of the concept.

  ***

  ### Part 2: The Constraints and Conflicts

  Now, the part you actually need for the seminar. Which of these are real walls, and which are picket fences? And where do they crash into each other?

  **Real Constraints vs. Partisan Prejudices**
  The **Dissociation** and **Resilience** requirements are real constraints. Any theory that denies them is simply changing the subject. If you say the amnesic patient *doesn't* know how, you're fighting the data. If you say the pianist with the broken arm *loses* the knowledge, you're fighting intuition.

  The **Gradability** requirement is often treated as a partisan prejudice by Intellectualists. They want to reduce skill to a relation with a proposition (which is usually binary). I consider this a dodge. If your theory can't handle degrees without ad-hoc patching, it's inadequate.

  The **Interference** requirement is the most ignored. It is often dismissed as a "performance variable" rather than a "competence constraint." That is a mistake. It is a real constraint. The architecture of the knowledge must explain why accessing it explicitly can be destructive.

  **The Incompatibility Claim**
  Here is the flat truth: **You cannot satisfy the Guidance Requirement, the Dissociation Requirement, and a standard Propositional Structure simultaneously.**

  This is the trilemma at the heart of the literature:
  1.  **If you prioritize Guidance** (it must look like intelligence/rules) **and Propositional Structure** (it is a relation to facts), you violate **Dissociation**. You end up saying the chick sexer *must* have unconscious beliefs, which looks like a theoretical fiction designed to save the theory rather than describe the agent.
  2.  **If you prioritize Dissociation** (it's non-declarative) **and Guidance** (it's flexible/intelligent), you struggle to define the **Propositional Structure**. You end up with "representations" that look nothing like propositions, forcing you to abandon Intellectualism.
  3.  **If you prioritize Dissociation** and **Propositional Structure** (you say they have the facts but can't access them), you fail **Interference**. Why does accessing the facts they "have" break the skill?

  Most theories survive by quietly dropping one of these. Intellectualists weaken Dissociation (positing unconscious propositions). Ryleans weaken Guidance (reducing it to complex dispositions, which risks the "tourist" problem—how is a disposition smarter than a reflex?).

  **My verdict:** The list itself is the result. There is no current theory that satisfies all six without significant strain. The **Interference Requirement** combined with the **Guidance Requirement** is the specific choke point. It demands that the knowledge be structured enough to guide action flexibly, but unstructured enough that thinking about it breaks it. That is a very narrow window.

  ***

  ### Part 3: The Killer Constraint

  If you want to eliminate the most theories in the shortest time, press the **Interference Requirement**. It is the single hardest pill for Intellectualist accounts to swallow. It is easy to posit unconscious propositions to save the Dissociation Requirement. It is easy to posit complex dispositions to save the Guidance Requirement. It is very hard to explain why grasping a truth (which is what Intellectualism says knowing-how *is*) would actively impair your ability to act on that truth. If knowing-how is a species of knowing-that, thinking about what you know should stabilize performance, not destabilize it. Any theory that cannot explain the fragility of skill under scrutiny is treating skill as a static object rather than a dynamic process. That's where the bodies are buried.
