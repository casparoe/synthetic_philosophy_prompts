prompt: |-
  I'm a fourth-year PhD student in philosophy of science, and as part of a departmental arrangement I spend one day a week as the methodology consultant for a lab in the psychology department and, through them, for an editor at a mid-tier journal who forwards me the cases her reviewers cannot agree on. The recurring case is this: a paper reports that a hypothesis is confirmed by data, and a reviewer objects that the data were already in hand before the hypothesis was formulated — that the effect was found first and a story fitted to it afterward — and concludes that the data therefore cannot confirm the hypothesis at all. The authors reply that the data still raise the probability of the hypothesis, and that it is absurd to say a hypothesis can never be supported by evidence that already existed. Both sides are invoking something real, and I keep having to improvise a verdict in under twenty minutes, for an audience with no formal training, with the editor's name on the decision and mine nowhere on it. I have been trying to turn the Bayesian literature on confirmation, and specifically the cluster of puzzles that goes under the heading of old evidence, into something I can actually run. My own working distinction is between temporal novelty — when the data came into existence — and epistemic novelty — whether the data were in the reasoner's evidence set at the moment the hypothesis was fixed — and I suspect the whole dispute lives in the gap between the two; I also want to make room for the counterfactual question of how surprised we would have been by the data had we not already had them. But I do not trust my improvisation, and I would rather have a written procedure than keep reinventing one.

  Please write me that procedure: a checklist or decision tree in prose that a smart non-philosopher can run on a case, stating the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure returns a verdict of "this evidence should not count toward the hypothesis," the point at which it returns "it counts, and roughly this much," and the point at which it must hand the decision to a person because the remaining question is one of norms rather than of probability. It should keep whatever distinctions from the theory genuinely do the work — the difference between evidence that is old to the community and evidence that is old only to the individual, the difference between a hypothesis that was merely formulated late and one that could not have been formulated earlier, the difference between updating on evidence and merely redescribing it — and drop the ones that matter only to specialists. Be honest about which of its steps are judgment calls wearing the costume of a procedure, and about where the procedure will misfire.

  Then run it on three cases and show your work. First, a researcher who collected a large dataset for one purpose, noticed an unanticipated interaction in it, and only then wrote down the hypothesis that the interaction exists. Second, a case in which the relevant result had been published and was common knowledge in the field, but this particular researcher genuinely did not know it when she formed her hypothesis. Third, a case you construct in which the procedure returns an answer I will not like — ideally one where the intuitively right verdict and the procedure's verdict come apart — and tell me what that divergence shows about the limits of the procedure. End by stating plainly what the procedure cannot decide, and what a philosopher, as opposed to a reviewer, would still want to argue about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** 4th-year PhD student in Philosophy of Science.
      *   **Role:** Methodology consultant for a psych lab/journal editor.
      *   **Problem:** Recurring dispute between authors and reviewers regarding "old evidence" (data existed before hypothesis formulation). Reviewers say no confirmation; Authors say probability raised.
      *   **Task:** Create a written procedure (checklist/decision tree in prose) for a smart non-philosopher (editor/reviewer) to adjudicate these cases.
      *   **Requirements:**
          *   Must distinguish temporal vs. epistemic novelty.
          *   Must handle counterfactual surprise.
          *   Must identify where it returns "no confirmation," "confirmation (quantified qualitatively)," or "hand off to human (normative)."
          *   Must be honest about judgment calls and limitations.
          *   Must drop specialist jargon where possible but keep working distinctions.
          *   **Application:** Run the procedure on three specific cases:
              1.  Unanticipated interaction in existing dataset (HARKing-ish).
              2.  Published result known to community, unknown to individual researcher.
              3.  A constructed case where the procedure fails/diverges from intuition.
          *   **Conclusion:** State plainly what the procedure cannot decide and what remains for the philosopher.

  2.  **Deconstruct the Philosophical Problem (Old Evidence):**
      *   *The Problem:* In Bayesian confirmation theory, if $P(E) = 1$ (evidence is already known/certain), then $P(H|E) = P(H)$. No updating occurs. This implies known evidence cannot confirm new hypotheses. This contradicts scientific practice (e.g., Einstein and Mercury's perihelion).
      *   *Solutions:*
          *   *Garber-style:* Learn the logical connection between H and E, not E itself.
          *   *Counterfactual:* What would our credence in H be if we *didn't* know E?
          *   *Ur-Priors:* What would a prior agent think?
      *   *User's Distinction:* Temporal Novelty (when data existed) vs. Epistemic Novelty (when data entered the reasoner's corpus).
      *   *Goal:* Operationalize this for a journal editor.

  3.  **Drafting the Procedure (The "Old Evidence Adjudication Protocol"):**
      *   *Tone:* Professional, clear, actionable, but philosophically grounded.
      *   *Structure:* Sequential questions (Decision Tree).
      *   *Key Distinctions to Embed:*
          *   Community knowledge vs. Individual knowledge.
          *   Prediction vs. Accommodation.
          *   Riskiness of the hypothesis.
      *   *Verdicts:*
          *   V1: Evidence excluded (Fatal flaw).
          *   V2: Evidence admitted (with caveats/weighting).
          *   V3: Normative impasse (Editor discretion/Philosophical debate).

      *   *Drafting Steps:*
          1.  **Q1: Temporal Status.** Did the data exist before the hypothesis? (If No -> Standard Confirmation. If Yes -> Proceed).
          2.  **Q2: Epistemic Status (Individual).** Did *this* author know the specific result before hypothesizing? (If No -> "Local Novelty," counts strongly. If Yes -> Proceed).
          3.  **Q3: Epistemic Status (Community).** Was this result established fact in the field? (If Yes -> "Historical Confirmation," counts weakly/structurally. If No -> Proceed).
          4.  **Q4: The Counterfactual Test.** If the data *hadn't* been known, would the hypothesis have been risky/surprising? (This captures the "predictive power" without needing time travel).
          5.  **Q5: Logical Connection.** Is the link between H and E deductive/tautological or probabilistic/independent? (Avoids "redescribing data").

      *   *Refining the Verdicts:*
          *   If Q2 is Yes AND Q3 is Yes AND Q4 is No -> **Exclude.** (Pure accommodation).
          *   If Q2 is No -> **Include (High Weight).** (Genuine prediction relative to agent).
          *   If Q2 is Yes BUT Q4 is Yes -> **Include (Low/Moderate Weight).** (Old evidence, but risky hypothesis).
          *   If Q5 fails (tautology) -> **Exclude.**

      *   *Honesty Clause:* Need to explicitly state where the "judgment call" is (mostly Q4).

  4.  **Running the Cases:**

      *   **Case 1: Unanticipated Interaction (HARKing).**
          *   Data existed. Author saw pattern, then wrote H.
          *   Q1: Yes. Q2: Yes (they saw it). Q3: No (unanticipated). Q4: Would it be surprising? Maybe, depends on theory.
          *   *Verdict:* Likely "Include (Low Weight)" or "Exclude" depending on Q4. Let's make it a "Low Weight/Accommodation" case. The procedure should flag this as weak confirmation requiring independent replication.

      *   **Case 2: Community Knowledge, Individual Ignorance.**
          *   Result published, author didn't know.
          *   Q1: Yes. Q2: No (genuinely didn't know). Q3: Yes (common knowledge).
          *   *Verdict:* This is the "Einstein/Mercury" case. The procedure should allow it but note it confirms the *theory's reach*, not the *novelty*. It counts, but doesn't demonstrate predictive risk *by this author*.

      *   **Case 3: The Divergence Case.**
          *   Need a case where the procedure says "Confirm" but intuition says "Don't" (or vice versa).
          *   *Idea:* A hypothesis that is *constructed* specifically to fit the old data so perfectly that it lacks generality, but passes the counterfactual test because the data *is* surprising generally.
          *   *Better Idea:* "The Curve Fitter." A researcher takes old data, fits a high-degree polynomial (Hypothesis = Equation), and claims confirmation.
          *   *Procedure Check:* Q1 Yes. Q2 Yes. Q3 No. Q4 (Counterfactual): Would we be surprised? Yes, the fit is perfect.
          *   *Procedure Verdict:* Counts.
          *   *Intuition:* Overfitting. No confirmation of underlying mechanism.
          *   *Divergence:* The procedure lacks a penalty for *complexity* or *gerrymandering*. It treats "surprise" as sufficient, ignoring "likelihood of chance fit."

  5.  **Drafting the Conclusion:**
      *   What can't it decide? The value of novelty itself. Why do we care? (Realism vs. Instrumentalism).
      *   What does the philosopher argue about? The nature of "support." Is it psychological (surprise) or logical (relation between propositions)?

  6.  **Review and Refine:**
      *   *Constraint Check:* Did I use prose? Yes. Is it under 20 mins to run? Should be. Is it honest about limitations? Yes.
      *   *Tone Check:* Respectful of the user's expertise (PhD level) but practical for the end-user (Editor).
      *   *Philosophy Check:* Ensure the "Old Evidence" problem is addressed correctly (Garber vs. Counterfactual). The prompt asks to use the Bayesian literature but make it runnable. The Counterfactual approach is the most runnable.
      *   *Refining the Procedure:* Make sure the "Hand off" point is clear. It should be when the question shifts from "Does it fit?" to "Do we value this kind of fit?"

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Case 2, if the author didn't know, it's effectively new evidence *for them*. But for the *field*, it's old. The journal represents the field. The procedure needs to weigh *community* epistemic state more than *individual* state for publication decisions. I need to adjust Q2/Q3 weighting. If the field knows it, it can't support a *new* claim of discovery, even if the author didn't know. It supports the *theory*, not the *finding*.
      *   *Correction on Case 3:* Make sure the divergence is sharp. The "Overfitting" example is good. The procedure sees "Surprise" (high likelihood ratio) but misses "Penalty for Complexity."
      *   *Formatting:* Use bolding for the decision points to make it skimmable.

  8.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  Here is the procedure you requested. It is designed to be printed and kept on the desk of an editor or senior reviewer. It operationalizes the distinction between temporal and epistemic novelty without requiring the user to solve the Bayesian "old evidence" problem from first principles.

  Following the procedure, I have run it on the three cases you specified, followed by an analysis of its limitations.

  ***

  # The Old Evidence Adjudication Protocol (OEAP)

  **Purpose:** To determine whether data that existed prior to hypothesis formulation should count as confirmation of that hypothesis in a manuscript under review.
  **Time Required:** 10–15 minutes.
  **User:** Editor or Senior Reviewer.

  ### Phase 1: The Temporal Filter
  **Question 1:** Did the specific data points cited as evidence exist before the hypothesis was written down or fixed by the authors?
  *   **No:** Stop. This is standard confirmation. Proceed with normal review.
  *   **Yes:** Proceed to Phase 2.

  ### Phase 2: The Epistemic Status Check
  **Question 2:** At the moment the authors fixed the hypothesis, was the *specific result* (the pattern in the data) already known to the authors?
  *   **No (Local Novelty):** The authors possessed the data but did not know the pattern/result until after hypothesizing.
      *   *Verdict:* **Count the evidence.** Treat this as a successful prediction. The psychological state of the researcher protects the confirmatory value.
  *   **Yes (Accommodation):** The authors saw the pattern in the data, then wrote the hypothesis to match it.
      *   *Action:* Proceed to Phase 3.

  ### Phase 3: The Community Knowledge Check
  **Question 3:** Is this result already established, published, or common knowledge in the relevant scientific community?
  *   **Yes (Historical Fact):** The field already knows this data is true.
      *   *Action:* Proceed to Phase 4.
  *   **No (Private Pattern):** The data exists, the authors know the pattern, but the field does not (e.g., a new analysis of an old public dataset).
      *   *Action:* Proceed to Phase 4.

  ### Phase 4: The Counterfactual Risk Test (Judgment Call)
  **Question 4:** If we imagine a scientist *without* knowledge of this specific data, how surprising would this hypothesis be to them?
  *   *Instruction:* Ignore the data in front of you. Look only at the hypothesis and the background theory. Does the hypothesis make a risky claim that *could* have been wrong? Or is it a vague claim that fits almost any outcome?
  *   **Low Surprise (Vague/Safe):** The hypothesis is flexible, post-hoc, or guaranteed to fit the data (e.g., "Variable A relates to Variable B").
      *   *Verdict:* **Do not count the evidence.** This is mere redescripton. The hypothesis is supported only by the fact that it was built to fit.
  *   **High Surprise (Risky):** The hypothesis specifies a precise relationship, direction, or boundary condition that was not guaranteed by the background theory alone.
      *   *Action:* Proceed to Phase 5.

  ### Phase 5: The Logical Independence Check
  **Question 5:** Is the link between the Hypothesis and the Evidence deductive/tautological, or probabilistic/independent?
  *   **Tautological:** The hypothesis is defined *by* the data (e.g., "The mean of this sample is X").
      *   *Verdict:* **Do not count the evidence.**
  *   **Probabilistic:** The hypothesis posits a mechanism or law that *implies* the data but is not identical to it.
      *   *Verdict:* **Count the evidence, but discount the weight.**
      *   *Weighting:* Assign "Moderate" confirmatory value. It supports the *plausibility* of the theory, but cannot be used to claim *novel discovery*. The paper must frame the contribution as theoretical unification or explanation of known facts, not prediction.

  ### Phase 6: The Normative Hand-Off
  **Trigger:** If the user finds that the evidence passes Phase 5 (it counts), but the *Reviewer* still objects strongly on the grounds that "Science requires prediction," OR if the *Author* claims this constitutes a "Novel Discovery."
  *   **Verdict:** **Hand off to Editor-in-Chief / Methodologist.**
  *   **Reason:** The dispute is no longer about probability or logic; it is about the norms of the field (Predictionism vs. Explanatorism). The procedure cannot resolve whether "accommodation" is a sin or a valid scientific strategy.

  ***

  # Application of the OEAP

  Here is the procedure run on the three cases you provided.

  ### Case 1: The Unanticipated Interaction (HARKing)
  **Scenario:** A researcher collects a large dataset for Purpose A. They notice an unanticipated interaction in the data. They then write down the hypothesis that this interaction exists and submit the paper.

  *   **Phase 1 (Temporal):** Did data exist before hypothesis? **Yes.**
  *   **Phase 2 (Epistemic/Individual):** Did authors know the result before hypothesizing? **Yes.** (They noticed the interaction first).
  *   **Phase 3 (Community):** Is this common knowledge? **No.** (It is unanticipated).
  *   **Phase 4 (Counterfactual Risk):** If a scientist didn't have this data, would the hypothesis be surprising?
      *   *Analysis:* This depends on the theory. If the theory strongly predicts interactions generally, but not this specific one, it is moderately risky. If the hypothesis is "There is an interaction somewhere," it is low risk. Let us assume the hypothesis is specific: "Factor X moderates Y."
      *   *Judgment:* **Moderate Surprise.**
  *   **Phase 5 (Logical Independence):** Is the link tautological? **No.** It posits a psychological mechanism.
  *   **OEAP Verdict:** **Count the evidence, but discount weight.**
  *   **Recommendation:** The paper cannot claim "We predicted and found." It must claim "We identified a pattern consistent with Theory X." The evidence supports the theory, but the *discovery claim* is weakened. The editor should require the authors to frame this as an exploratory finding requiring replication, rather than a confirmatory test.

  ### Case 2: The Ignorant Researcher (Community Old, Individual New)
  **Scenario:** A result was published five years ago and is common knowledge in the sub-field. A new researcher, genuinely unaware of this publication, formulates the hypothesis based on first principles and runs a new study that replicates the old result.

  *   **Phase 1 (Temporal):** Did data exist before hypothesis? **Yes** (The original data existed; also, the new data is generated after, but the *fact* is old). *Correction for this case:* The *hypothesis* concerns a phenomenon already established. Let's treat the "evidence" as the phenomenon itself, which the new study measures.
  *   **Phase 2 (Epistemic/Individual):** Did *this* author know the result? **No.**
  *   **OEAP Immediate Verdict (Phase 2):** **Count the evidence.** Treat as Local Novelty.
  *   **Nuance:** However, Phase 3 (Community) is **Yes**.
  *   **OEAP Adjustment:** Because the community already knows $E$ is true, $P(E) \approx 1$ for the audience.
  *   **Final OEAP Verdict:** **Count the evidence for the *Researcher's Competence*, but not for the *Theory's Novelty*.**
  *   **Recommendation:** The paper is valid as a demonstration that the theory generates the hypothesis (theoretical coherence), but it does not confirm the theory *to the field* any more than it was confirmed five years ago. It should be published as a "Conceptual Replication" or "Theoretical Extension," not as a novel empirical discovery. The procedure protects the researcher from being accused of fraud (they didn't know), but protects the field from double-counting evidence.

  ### Case 3: The Curve-Fitter (The Divergence Case)
  **Scenario:** A researcher takes a large, public, old dataset (known to the community). They fit a complex, 12-parameter polynomial equation to the data points. The hypothesis is: "The relationship between X and Y is described by Equation Z." The fit is perfect ($R^2 = 1.0$). The researcher claims the data confirms the equation.

  *   **Phase 1 (Temporal):** Data existed before hypothesis? **Yes.**
  *   **Phase 2 (Epistemic/Individual):** Did author know the result? **Yes** (They fitted it to the result).
  *   **Phase 3 (Community):** Is result known? **Yes** (The data points are public).
  *   **Phase 4 (Counterfactual Risk):** If a scientist didn't have the data, how surprising is the hypothesis?
      *   *Judgment:* **High Surprise.** A specific 12-parameter equation is highly specific. The probability of guessing that exact equation by chance is near zero.
  *   **Phase 5 (Logical Independence):** Is the link tautological?
      *   *Judgment:* **Borderline.** The equation is *derived* from the data, not independent of it. However, the OEAP asks if the hypothesis *implies* the data. It does.
  *   **OEAP Verdict:** **Count the evidence, discount weight.** (Because it passes Phase 4 as "Risky/Specific").
  *   **Intuitive Verdict:** **Do not count the evidence.** This is overfitting. The hypothesis has no predictive power for *new* data. It is a description, not an explanation.
  *   **The Divergence:** The OEAP validates the hypothesis because it is "surprising" (specific) and "non-tautological" (in a narrow logical sense). It fails to penalize *complexity*.
  *   **What this shows:** The procedure relies on "Surprise" (Phase 4) as a proxy for "Predictive Power." But one can be surprised by a complex fit to old data without that fit having any generalizability. The OEAP lacks a "Penalty for Ad Hoc Complexity." It treats all specific hypotheses as equally risky, whether they are simple laws or complex curves.

  ***

  # Limitations and The Philosopher's Remainder

  ### What the Procedure Cannot Decide
  The OEAP is a tool for managing **epistemic credit**, not for establishing **truth**. It cannot decide:
  1.  **The Value of Novelty:** It assumes novelty (or counterfactual novelty) is valuable. It cannot argue *why*. A strict instrumentalist might argue that accommodation is just as good as prediction if the theory works; a Popperian will insist prediction is the only thing that matters. The procedure splits the difference, which may satisfy neither.
  2.  **The Threshold of "Risk":** Phase 4 requires a human to judge "Surprise." One reviewer's "risky prediction" is another's "obvious consequence." The procedure exposes this disagreement but does not resolve it.
  3.  **The Unit of Confirmation:** It treats the hypothesis as a single unit. It cannot easily handle cases where the *core* theory was old, but the *auxiliary* assumptions were new (the Duhem-Quine problem).

  ### What the Philosopher Still Argues About
  As a philosopher, your work begins where the procedure hands off. Specifically:
  1.  **The Nature of "Support":** The procedure treats confirmation as a binary or ordinal switch (Count/Don't Count, High/Low Weight). You know confirmation is a three-place relation ($E$ supports $H$ relative to Background $B$). The procedure hides $B$. You need to argue about how much of the background theory is allowed to be adjusted to make the old evidence fit.
  2.  **The Counterfactual Justification:** The procedure uses the Counterfactual Test (Phase 4) as a pragmatic fix. You need to defend *why* this works. Are we measuring the logical relation between $H$ and $E$, or the psychological state of the scientist? If the latter, does science reduce to sociology? If the former, how do we compute the counterfactual probability without time travel?
  3.  **The Normative Hand-Off:** When the procedure says "Hand off to Editor," it is admitting that the conflict is about the *goals* of the discipline. Is the goal to find true theories (where accommodation is fine) or to find robust theories (where prediction is required)? The procedure manages the conflict; you must argue for the resolution.

  **Summary for your Editor:**
  Tell her the OEAP is a triage tool. It will correctly filter out the obvious cases of "data dredging" (Phase 2 & 5 failures) and protect the "Einstein cases" (Phase 2 success). It will fail on the "Overfitting cases" (Case 3). When it fails, or when reviewers and authors fight over Phase 4, that is when she should call you. That is not a failure of the procedure; it is the point where methodology becomes philosophy.
