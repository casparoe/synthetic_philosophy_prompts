answer: |-
  ### Part I: The Translation

  Here is Iterated Elimination of Dominated Strategies (IEDS) restated in the vocabulary of fixed-point engines and rewriting systems.

  **1. The Lattice and the Relation**
  Let $S = \bigcup_i S_i$ be the finite universe of pure strategies for all players. We work on the powerset lattice $\mathcal{L} = (2^S, \subseteq)$.
  The **current extension** is a set $R \in \mathcal{L}$, representing the strategies currently considered "rational" or "surviving."
  Initial state: $R_0 = S$.

  **2. The Deletion Operator**
  Define an operator $\mathcal{F}: \mathcal{L} \to \mathcal{L}$ such that $\mathcal{F}(R)$ is the subset of $R$ containing only strategies that are not dominated relative to $R$.
  Formally, $s \in \mathcal{F}(R)$ iff $s \in R$ and:
  $$ \neg \exists \sigma \in \Delta(R \cap S_{\text{player}(s)}) \text{ s.t. } \forall s' \in R \cap S_{-\text{player}(s)}, u(\sigma, s') > u(s, s') $$
  (For strict dominance; replace $>$ with $\ge$ plus one strict inequality for weak dominance).

  **3. Monotonicity and Fixed Points**
  *   **Strict Dominance:** The operator $\mathcal{F}_{\text{strict}}$ is **monotone** on $\mathcal{L}$.
      *   *Reasoning:* If $R \subseteq Q$, the set of opponent profiles shrinks (making dominance easier to satisfy) but the set of available mixers also shrinks (making dominance harder). However, strict dominance is transitive: if $s_1$ dominates $s_2$ and $s_3$ dominates $s_1$, then $s_3$ dominates $s_2$. This transitivity ensures that if a dominator is removed, a "better" dominator remains in the set. Consequently, $R \subseteq Q \implies \mathcal{F}(R) \subseteq \mathcal{F}(Q)$.
      *   *Consequence:* By Knaster-Tarski, a **Unique Least Fixed Point (LFP)** exists. The order of deletion (the schedule) does not affect the final extension.
  *   **Weak Dominance:** The operator $\mathcal{F}_{\text{weak}}$ is **non-monotone**.
      *   *Reasoning:* Weak dominance requires strict inequality in *at least one* column. If $R \subset Q$, the specific column providing the strict inequality might be removed in $R$. Thus, a strategy dominated in $Q$ may become undominated in $R$.
      *   *Consequence:* Knaster-Tarski does not apply. Multiple maximal fixed points exist. The final extension depends on the evaluation schedule.

  **4. Rewriting System Properties**
  View the process as a rewrite system $R \to R \setminus \{s\}$ where $s$ is dominated in $R$.
  *   **Termination:** Guaranteed. The state space is finite, and $|R|$ strictly decreases with every rule application.
  *   **Confluence (Newman's Lemma):**
      *   **Strict:** The system is **locally confluent**. If $s_1, s_2$ are both dominated in $R$, deleting $s_1$ does not prevent $s_2$ from being dominated in $R \setminus \{s_1\}$ (due to transitivity of strict dominance). Local confluence + Termination $\implies$ **Global Confluence**. Unique normal form.
      *   **Weak:** The system **fails local confluence**. Deleting $s_1$ might remove the critical column that made $s_2$ dominated. Critical pairs do not join. The normal form is schedule-dependent.
  *   **Stratification:** There is **no analog to stratification** here. Stratification in Datalog resolves ambiguity introduced by negation to force a unique model. In Weak IEDS, the ambiguity is intrinsic to the reduction relation itself, not an artifact of negation handling. There is no structural constraint that recovers uniqueness. The object of study must indeed be the **family of maximal deletion sequences** (the set of all reachable normal forms), not a canonical fixed point.

  **5. Mixed Strategies and the LP Oracle**
  When dominators may be mixed strategies ($\sigma \in \Delta(R)$):
  *   **Side Condition:** The rule guard is no longer a finite syntactic pattern match over $R$. It is an **existential query over a continuous convex hull** of $R$, solvable via Linear Programming (LP).
  *   **Impact on Confluence:** For strict dominance, confluence holds (Pearce, 1984). For weak, it fails. The LP nature does not restore confluence to weak dominance.
  *   **Relation Extension:** The relation $R$ need not carry mixed strategies explicitly. It suffices to track surviving pure strategies, treating the LP check as an external oracle. However, this makes the operator **computationally opaque**. In Datalog, rule application is symbolic and local; here, applying a rule requires solving an optimization problem over the global state of $R$. The "proof" that a deletion is valid is a dual vector (prices), not a syntactic derivation.

  ---

  ### Part II: The Residue Report

  This section details what is lost, distorted, or left unrepresented when game theory is forced into the fixed-point/rewriting mold.

  **1. What Translates Cleanly**
  *   **Epistemic Depth:** The iteration index $k$ in the fixed-point computation $R_{k+1} = \mathcal{F}(R_k)$ maps cleanly to the depth of **Common Knowledge of Rationality**. $R_0$ is no knowledge; $R_1$ is "I am rational"; $R_2$ is "I know you are rational." The fixed point is "Common Knowledge." This is a robust isomorphism.
  *   **Termination:** The finiteness of the game translates directly to termination of the rewrite system.
  *   **Strict vs. Weak Structuralism:** The distinction between confluent (strict) and non-confluent (weak) rewriting captures the mathematical stability difference accurately.

  **2. What Survives as Distortion**
  *   **Normativity vs. Descriptivity:** In your world, a non-confluent rewrite system is a bug or a feature of an underspecified language. In game theory, non-confluence in Weak IEDS is a **foundational crisis**. It means the theory fails to predict behavior. The rewriting vocabulary treats multiple normal forms as a set of possibilities; game theory treats them as a failure of the solution concept to identify *the* rational outcome.
  *   **The LP Oracle:** Treating the dominance check as a side condition hides the **economic content**. The dual variables of the LP represent the opponent's beliefs that make the strategy suboptimal. By reducing this to a boolean "dominated/not," the translation discards the *reason* for deletion (the specific belief state), which is often more important than the deletion itself.
  *   **Order Dependence:** In rewriting, we say "the result depends on the schedule." In game theory, this translates to "the result depends on the **order in which players realize strategies are irrational**." The rewriting vocabulary abstracts away the temporal/agent-based causality of the schedule, treating it as a mere evaluation order rather than a sequence of epistemic updates.

  **3. What Has No Counterpart**
  *   **The Agent Boundary:** Your relations are global. Game theory is fundamentally distributed. $R$ is a Cartesian product $R_1 \times \dots \times R_n$. The dominance check for player $i$ depends only on $R_{-i}$. While you can encode this in the schema, the **independence of agents** is a semantic constraint not inherent to the lattice structure. A general Datalog engine does not know that $R_i$ and $R_j$ belong to distinct decision-makers who cannot coordinate their deletions.
  *   **Payoff Magnitudes:** The rewriting system sees only the boolean outcome of the LP check (dominated or not). It discards the **magnitude of the payoff difference**. In static analysis, precision loss is usually about set inclusion. Here, a strategy dominated by $\epsilon$ is treated identically to one dominated by $M$. This matters for **trembling-hand perfection** and stability, which have no analog in the boolean deletion model.

  **4. The Soundness/Completeness Gap**
  You asked whether the deletion procedure has a "concrete semantics" relative to which it is sound or complete.

  *   **The Verdict:** **No.** There is no independent concrete semantics.
  *   **The Defect:** This is **not a defect of your vocabulary**. It is a sign that the textbook presentation of IEDS is tidier than its foundations.
      *   In static analysis, the concrete semantics (e.g., operational semantics of the code) exists *prior* to the analysis. The analysis is judged by how well it approximates that pre-existing truth.
      *   In game theory, **there is no pre-existing "truth" of play.** The game is just a matrix of numbers. The "outcome" is not a physical fact waiting to be measured; it is a social construct derived from assumptions about rationality.
      *   If you posit **Nash Equilibrium** as the concrete semantics:
          *   Strict IEDS is **Sound** (all NE survive) but not Complete (survivors are not necessarily NE).
          *   Weak IEDS is **Unsound** (it can eliminate NE).
      *   If you posit **Rationalizability** as the concrete semantics:
          *   Strict IEDS is **Complete and Sound** (they are equivalent).
      *   But Rationalizability is *defined* by the IEDS process itself. You are checking soundness of a procedure against a definition generated by that same procedure.

  **Conclusion on the Gap:**
  In your domain, soundness means "we never miss a bug." In game theory, IEDS *defines* what a bug (irrationality) is. The lack of an independent concrete semantics reveals that game theory solution concepts are **normative definitions**, not **approximations of reality**.

  When you translate IEDS to a fixed-point engine, you inadvertently reify the solution concept as an algorithm. The "gap" you sense is the absence of a *physical execution model* for the game. The game does not "run" like a program; it is solved like a constraint system. Your vocabulary expects a program to analyze; game theory offers only a constraint system to solve. The "soundness" question exposes that IEDS is not analyzing a behavior; it is *legislating* it.
