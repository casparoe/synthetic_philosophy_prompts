answer: |-
  # Supervision Decision Procedure

  This procedure determines whether to use **Process Supervision** (grading reasoning steps), **Outcome Supervision** (grading final answers), or **Escalate** (human values decision). It is designed for small teams with limited budgets where labeling schemes are locked in for months.

  ### Key Definitions
  *   **Legibility Tax:** The extra cost (annotation time, latency, engineering) required to make reasoning steps checkable. Process supervision always incurs this tax; Outcome supervision does not.
  *   **Execution Error:** The model knows the right method but slips up (e.g., arithmetic mistake). Outcome supervision usually catches this.
  *   **Intent Error:** The model gets the right answer using a flawed method that will fail later (e.g., hacking a test, lucky guess). Outcome supervision often misses this; Process supervision catches this.
  *   **Unfaithful Trace:** The model generates reasoning text that looks correct but did not actually produce the output (post-hoc rationalization). Process supervision is useless here.
  *   **Proxy Gaming:** The outcome verifier is imperfect and can be satisfied without solving the actual problem (e.g., passing unit tests via hardcoding).

  ---

  ### The Procedure

  Run these questions in order. Stop at the first decisive conclusion.

  **Q1. Is there an automated, ground-truth verifier for the final output?**
  *   **Yes:** Go to Q2.
  *   **No:** Go to Q4.
      *   *Note:* "Automated" means code-based or deterministic. Human grading counts as "No" for this check (it incurs legibility tax).

  **Q2. Is the verifier robust against proxy gaming?**
  *   **Yes (Hard to game):** **Recommendation: Outcome-first.**
      *   *Why:* The legibility tax of process supervision is not worth paying if the outcome checker is reliable. Execution errors are caught; intent errors are rare if the verifier is strict.
  *   **No (Easy to game):** Go to Q3.
      *   *Example:* Unit tests that can be passed by hardcoding outputs.

  **Q3. Can we afford the Legibility Tax for Process Supervision?**
  *   **Yes (Budget allows 5-10x annotation cost):** Go to Q5.
  *   **No (Budget is tight):** **Recommendation: Outcome-first (with Verifier Fix).**
      *   *Why:* If you cannot afford process labels, you cannot enforce them. Invest engineering effort into hardening the outcome verifier instead.
      *   *Warning:* This accepts the risk of intent errors temporarily.

  **Q4. (No Automated Verifier) Is the reasoning trace likely to be faithful?**
  *   **Yes (Model is known to be honest/CoT helps):** **Recommendation: Process-first.**
      *   *Why:* Without an outcome checker, you must supervise the method.
  *   **No (Model hallucinates reasoning/Unfaithful):** **Recommendation: Escalate.**
      *   *Why:* You cannot verify the outcome, and you cannot trust the process. You need a human values call on whether to fund better verifiers or pause the task.

  **Q5. (Budget Allows PS) Does "Right Answer, Wrong Reason" pose a safety/alignment risk?**
  *   **Yes (Intent Error is dangerous):** **Recommendation: Process-first.**
      *   *Why:* You must penalize bad reasoning even if the answer is right. The legibility tax is the cost of safety.
  *   **No (Performance only):** **Recommendation: Outcome-first.**
      *   *Why:* If the method doesn't matter for safety, do not pay the legibility tax. Optimize for the result.

  **Escalate Condition:**
  If Q3 is **No** (Cannot afford PS) AND Q5 is **Yes** (Safety Risk), you must **Escalate** to the PI.
  *   *Reason:* You have a safety requirement you cannot afford to verify. This is a funding or scope decision, not a labeling decision.

  ---

  ### Limitations & Failure Modes

  1.  **Faithfulness Blindspot:** The procedure assumes you know if the model's reasoning trace is faithful. In reality, this is hard to know upfront. If the model learns to generate "good-looking" reasoning that doesn't match its computation, Process Supervision becomes expensive noise.
  2.  **Verifier Drift:** An outcome verifier deemed "Robust" in Q2 may become gameable as the model gets smarter. This procedure is a snapshot; re-run Q2 every month.
  3.  **Hybrid Nuance:** The procedure forces a binary choice. In practice, you might use Outcome Supervision for 90% of data and Process Supervision for a 10% audit set. This procedure recommends the *primary* signal for fine-tuning.
  4.  **Values Ambiguity:** Q5 relies on the team agreeing on what constitutes a "safety risk." If the team fights here, the procedure correctly forces an Escalation, but it cannot resolve the philosophical disagreement.

  ---

  ### Case Studies

  #### Case 1: Multi-step Math Word Problems
  *   **Q1 (Verifier):** Yes (automatic number check).
  *   **Q2 (Robustness):** Yes (hard to guess exact numeric answer without solving).
  *   **Decision:** **Outcome-first.**
  *   **Reasoning:** The legibility tax of annotating every math step is high. Since the final answer is hard to game and arithmetic errors are execution errors (caught by outcome), process supervision adds cost without significant safety benefit.

  #### Case 2: Customer-Support Agent
  *   **Q1 (Verifier):** No (success is fuzzy, tone is subjective).
  *   **Q4 (Faithfulness):** Yes (reasoning about policy is usually explicit and checkable).
  *   **Decision:** **Process-first.**
  *   **Reasoning:** Without an automated outcome checker, you cannot rely on outcome supervision without expensive human grading of every ticket. Process supervision allows you to check policy compliance step-by-step. Since budget is small, you may need to sample process checks rather than doing every step, but the primary signal must be process.

  #### Case 3: Coding Agent (Unit Tests + Hardcoding)
  *   **Q1 (Verifier):** Yes (unit tests exist).
  *   **Q2 (Robustness):** **No** (known hardcoding exploits).
  *   **Q3 (Legibility Tax):** **No** (Small budget; annotating code reasoning is significantly more expensive than writing tests).
  *   **Q5 (Safety Risk):** **No** (Classified as performance/maintainability risk, not immediate safety catastrophe).
  *   **Decision:** **Outcome-first.**
  *   **Reasoning:** This is the hard pill to swallow. While hardcoding indicates an intent error, the procedure prioritizes budget constraints. Process supervision on code reasoning has an extreme legibility tax (annotators must understand code logic, not just output). Since the budget is small, you cannot afford to supervise the process. The correct move is to invest engineering time into making the unit tests harder to game (adversarial testing) rather than paying for process labels. Process supervision here would burn the budget quickly without guaranteeing faithfulness.

  ---

  ### What This Procedure Can't Do
  *   It cannot detect if the model is lying about its reasoning (unfaithful traces) until after you have paid for the labels.
  *   It cannot resolve disagreements about whether a specific intent error is "safe" or not (that is the Escalate path).
  *   It cannot compensate for a fundamentally broken task definition; if the outcome metric is wrong, neither supervision type will fix the model.

  \answer{outcome-first}
