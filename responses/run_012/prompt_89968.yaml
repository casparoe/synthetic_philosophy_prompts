          *   *CEV Angle:* Future workforce needs AI literacy. Hiding it hurts students.
          *   *Outcome:* Allow with citation. This is likely the one the user *might* like, or the other way around. The prompt says "one of those should come out a way i won't like." I need to ensure one feels like a loss.
          *   *Decision:* Let's make the AI outcome the "win" (Allow with rules) and the Phone outcome the "loss" (Strict Ban). Or vice versa. Let's assume the user is probably pro-freedom (typical student council). So, a strict phone ban would be the "unlike" outcome. A nuanced AI policy might be acceptable.
          *   *Wait, re-reading:* "one of those should come out a way i won't like." Okay. I will structure the Phone outcome as a "Ban" (restrictive) and the AI outcome as "Allowed with Disclosure" (permissive). If the user is pro-phone, the ban is the "unlike" part.

  5.  **Refining the Procedure for Reality:**
