          *   *CEV Angle:* What builds a healthier social culture long-term? What respects autonomy?
          *   *Outcome:* Needs to be nuanced. Maybe "Zones" or "Opt-in." Let's make it a restriction that annoys the user (e.g., "Phones away, but school provides tablets for music/media"). Or maybe "No ban, but designated tech-free tables." Let's go with a restriction the user might hate: *Phones must be docked in lockers during lunch.* Why? Because the "Better Self" values face-to-face community building over convenience.
      *   *Issue 2: AI on Essays.*
