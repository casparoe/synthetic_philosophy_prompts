answer: |-
  Here's the deal: Your friend is right that the *idea* is good, but she's wrong that you can just "do" Coherent Extrapolated Volition (CEV) in a high school cafeteria. Real CEV requires superintelligence to simulate what you'd want if you were smarter and better. You don't have that. You have 40 minutes and a bunch of tired juniors.

  However, you can run a "CEV-Lite" protocol. It's basically a structured way to force you to stop arguing about what feels good *now* and argue about what works for the school's *future self*.

  Here is the procedure, the honesty check, and the simulation.

  ### The "Future-Self" Protocol (40 Minutes)

  **Role:** The Council President acts as Facilitator. They keep time and enforce the rules.
  **Goal:** Move from "What do I want?" to "What would we recommend if we were alumni looking back?"

  **Step 1: The Fact Dump (5 Minutes)**
  *   **Action:** No opinions allowed. Write down only verifiable facts on the whiteboard. (e.g., "Phones distract some kids," "AI can write a B+ essay in 30 seconds," "Open campus increases lateness by 15%.")
  *   **Move On When:** The board is full and nobody can add a new fact without arguing.
  *   **Stop Condition:** If you can't agree on facts, you can't proceed. Abort to Step 5 (Vote).

  **Step 2: The 'Wisdom' Shift (10 Minutes)**
  *   **Action:** Everyone must argue for the side they *disagree* with, but specifically from the perspective of the "Better Community." You cannot say "I want." You must say "A student who wants to succeed would..."
  *   **Move On When:** Every member has spoken at least once using the "Better Community" framing.
  *   **Stop Condition:** If people just rephrase their original opinion as "wisdom," the Facilitator calls it out. If it happens twice, abort to Step 5.

  **Step 3: The 5-Year Mirror (10 Minutes)**
  *   **Action:** Imagine it's five years from now. You're an alum. You're coming back to talk to current freshmen. Does this policy make you proud or embarrassed?
  *   **Move On When:** The group identifies one "Pride Point" and one "Regret Point" for the proposed policy.
  *   **Stop Condition:** If the "Regret Point" is catastrophic (e.g., "Kids get hurt," "School gets sued"), the policy is dead.

  **Step 4: Convergence Check (5 Minutes)**
  *   **Action:** Facilitator asks: "Can everyone live with this decision without feeling it betrays the school's values?"
  *   **Move On When:** A show of hands.
  *   **Stop Condition:** If more than 2 people say "No," you do not vote. You go to Step 5.

  **Step 5: The Decision (10 Minutes)**
  *   **Scenario A (Convergence):** If Step 4 passed, take a formal vote. Pass/Fail.
  *   **Scenario B (Stalemate):** If Step 4 failed, this is a **Values Call**. The Council cannot agree on the "Better Self."
  *   **Ownership:** The Council President (or Faculty Advisor) must make the executive call and take the heat for it. You record the vote as "Recommendation to Admin" with a note that the Council was divided on values.

  ***

  ### The Honesty Check (Read This First)

  Before you use this, you need to know where this is BS and where it's real.

  1.  **It's Not Real CEV:** You aren't actually smarter or more moral in Step 2. You're just roleplaying. If your group is toxic, this just gives toxicity a fancy script.
  2.  **The "Values Call" is the Real Work:** Most student councils pretend consensus is always possible. It isn't. Step 5 Scenario B is the most important part. It admits that sometimes, reasonable people disagree on core values, and someone has to take the fall.
  3.  **Time Pressure:** 40 minutes is tight. If Step 1 drags, you skip Step 3. Don't skip Step 2. That's the only part that actually changes your brain.
  4.  **Admin Reality:** If Admin adopts whatever you pass, they are outsourcing their risk to you. This protocol forces you to realize when you're being set up to fail.

  ***

  ### Simulation 1: Phones During Lunch

  **Step 1: Facts**
  *   Kids scroll instead of talking.
  *   Some kids use phones to call parents for mental health support.
  *   Lunch is 30 minutes.
  *   Teachers hate policing phone bags.

  **Step 2: Wisdom Shift**
  *   *Pro-Phone:* "A resilient student manages their own time and uses tools to decompress."
  *   *Anti-Phone:* "A connected community requires face-to-face friction to build friendships that last beyond high school."

  **Step 3: 5-Year Mirror**
  *   *Pride Point:* If we ban them, alumni might say, "That's where I met my best friend because we couldn't hide behind screens."
  *   *Regret Point:* If we ban them, alumni might say, "They treated us like prisoners during our only break."

  **Step 4: Convergence**
  *   The group realizes the "Regret Point" hurts individual autonomy, but the "Pride Point" builds school culture. The "Better Self" values culture over convenience.
  *   *Result:* 4 people say "Yes, I can live with this." 2 say "No, it's too controlling."
  *   *Convergence Failed.* Move to Step 5 Scenario B.

  **Step 5: The Decision (Values Call)**
  *   **Outcome:** The Council President makes the executive call.
  *   **Ruling:** **Phones are banned during lunch, but must be left in lockers, not bags.**
  *   **Why you won't like it:** You probably wanted a compromise (like "phones down on tables"). The CEV process pushed the group to realize that "moderation" doesn't actually solve the social fragmentation issue. The "Better Self" wants a phone-free zone, not a phone-quiet zone. It's stricter than the status quo. The President owns the backlash.

  ***

  ### Simulation 2: AI on Essays

  **Step 1: Facts**
  *   AI can draft essays instantly.
  *   Detection software is unreliable.
  *   College and jobs will require AI literacy.
  *   Current policy is "Zero Tolerance."

  **Step 2: Wisdom Shift**
  *   *Anti-AI:* "A student who cannot think without a crutch will fail when the tool is removed."
  *   *Pro-AI:* "A modern professional knows how to direct AI, not just write from scratch. Hiding it teaches dishonesty."

  **Step 3: 5-Year Mirror**
  *   *Pride Point:* Alumni say, "My school taught me how to use the tools of the future ethically."
  *   *Regret Point:* Alumni say, "My school punished me for using technology that is now standard everywhere."

  **Step 4: Convergence**
  *   The group agrees that banning AI is fighting a losing battle that hurts students later.
  *   *Result:* 6 people say "Yes." 0 say "No."
  *   *Convergence Passed.* Move to Vote.

  **Step 5: The Decision (Vote)**
  *   **Outcome:** **AI is permitted, but must be cited like a source. Using AI without citation is plagiarism.**
  *   **Why this works:** It shifts the value from "Writing is the skill" to "Editing and Integrity are the skills." This aligns with the "Better Self" who is prepared for the real world.
  *   **Vote:** Passes 6-0. Admin adopts it.

  ***

  ### Summary of Where You Stop

  *   **Stop and Vote:** When Step 4 (Convergence) gets a "Yes" from everyone. This means you've found the "Coherent" part of CEV. You all agree on the direction.
  *   **Stop and Own It:** When Step 4 fails. This means your "Volition" isn't coherent. You don't agree on values. Do not vote. Voting 4-3 on a values issue just creates a civil war in the council. The President or Advisor must make the call and say, "I know half of you hate this, but I'm signing it."

  ### Final Advice

  Don't sell this as "CEV." Call it "The 5-Year Test." If you tell people it's an AI alignment concept, they'll tune out. If you tell them "Imagine you're an alum judging us," they'll listen.

  And remember: The point isn't to be right. It's to make a decision you don't regret when you're 23.
