          *   Where to stop and vote.
          *   Where it's a values call (someone owns it).
          *   Run the procedure on two issues: Phones at lunch, AI on essays.
          *   Constraint: One outcome must be unpopular/unexpected for the user ("one of those should come out a way i won't like").
          *   Constraint: Be honest about limitations (where it's just fancy discussion, where CEV fails).
          *   Tone: American English, no citations, practical, honest.

  2.  **Deconstruct "Coherent Extrapolated Volition" (CEV):**
      *   *Original Concept (Yudkowsky):* An AI should do what we *would* want if we knew more, thought faster, were more the people we wish we were, grew up closer together, etc.
      *   *High School Adaptation:* We can't literally know more or think faster. We *can* simulate a more informed, empathetic, long-term perspective.
      *   *Translation:* Instead of "What do I want now?" ask "What would we recommend if we were looking out for the school's best interest 5 years from now, knowing all the downsides?"

  3.  **Develop the Procedure (The "CEV-Lite" Protocol):**
      *   *Time Limit:* 40 minutes total. Need to be strict.
      *   *Step 1: Fact-Finding (5 mins):* Stop arguing opinions, list known facts/consequences.
      *   *Step 2: The "Better Self" Shift (10 mins):* Reframe positions. Not "I want," but "What helps the community thrive?"
      *   *Step 3: The Future Test (10 mins):* Project 5 years out. Does this decision age well?
      *   *Step 4: Convergence Check (5 mins):* Do we agree?
      *   *Step 5: The Vote/Owner (10 mins):* If converged, vote. If not, who owns the call? (Usually the council president or admin liaison).
      *   *Honesty Check:* Acknowledge this isn't real CEV. It's structured empathy + long-term thinking.

  4.  **Drafting the Scenarios:**
      *   *Issue 1: Phones at Lunch.*
