answer: |-
  Here is a complete lesson plan designed for a 50-minute undergraduate seminar. It is tight on time, so you must keep strict control of the clock.

  ### **Session Title:** The Chocolate Protocol: Discounting, Binding, and Judgment

  **Materials Needed:**
  *   36 high-quality chocolates (e.g., Lindt squares). 3 per student.
  *   12 small envelopes.
  *   24 slips of paper (two colours: White for T0, Blue for T1).
  *   Pens.
  *   A visible timer (projected or phone).
  *   A box or bag (The "Lock Box").

  ---

  ### **1. The Rules (Read these aloud at min 0:00)**

  1.  **The Stake:** You are earning chocolates. You will eat them at the end of class.
  2.  **Decision Point 1 (T0):** In 5 minutes, you will choose between **1 Chocolate in 20 minutes** or **3 Chocolates in 40 minutes**.
  3.  **The Binding Option:** At T0, you may place your choice slip into an envelope and seal it. If you seal it, you **cannot** change your choice later. If you leave it unsealed, you may change your choice at Decision Point 2.
  4.  **Decision Point 2 (T1):** At the 20-minute mark, those with unsealed envelopes will be offered the **1 Chocolate Immediately** or the **3 Chocolates in 20 minutes**.
  5.  **The Judgment Survey:** At T1, before you take any chocolate, you must answer a private question on a Blue Slip about what you *judge* you ought to do, regardless of what you *want* to do.
  6.  **Honesty:** This only works if you report your actual desires and judgments.

  ---

  ### **2. The Timeline (50 Minutes)**

  **00:00 – 05:00 | Setup & T0 Choice**
  *   Distribute White Slips.
  *   **Choice:** 1 Chocolate at Min 25 OR 3 Chocolates at Min 45.
  *   **Binding:** Hand out envelopes. Tell them: *"If you think your future self will be weak, seal your choice now. If you seal it, I will not accept a change later. If you don't seal it, you can change your mind at Min 25."*
  *   Collect slips. Place sealed envelopes in the **Lock Box**. Keep unsealed slips on your desk.
  *   *Expected Result:* Most will choose 3 @ 45. Some will seal (anticipating weakness); most will not.

  **05:00 – 25:00 | The Distraction (Seminar Content)**
  *   Run the first half of your seminar discussion on the theory (e.g., Strotz, Ainslie, or Davidson).
  *   **Crucial:** Do not mention the chocolates again. Let the anticipation build. The boredom of theory makes the immediate reward more tempting.
  *   Keep an eye on the timer.

  **25:00 – 30:00 | T1 Choice & Judgment Survey**
  *   Stop the discussion.
  *   **For Sealed Envelopes:** Tell them their contract is binding. They wait.
  *   **For Unsealed Slips:** Place 1 Chocolate on each desk. Say: *"You can take this 1 chocolate now. Or you can hand the slip back to me and receive 3 chocolates at Min 45. You must decide now."*
  *   **The Survey (The Critical Step):** Before they touch the chocolate, hand out Blue Slips. They must write:
      1.  *What did you choose?* (1 Now / 3 Later)
      2.  *What do you desire most right now?* (1 Now / 3 Later)
      3.  *What do you judge it is rational/better to do?* (1 Now / 3 Later)
  *   Collect Blue Slips immediately.

  **30:00 – 45:00 | Analysis (Seminar Content)**
  *   Continue seminar discussion. Do not distribute rewards yet. The delay for the "3 Later" group must be felt.

  **45:00 – 50:00 | Payout & Debrief**
  *   Distribute chocolates according to final choices.
  *   Run the debrief below.

  ---

  ### **3. The Debrief: Mapping Experience to Theory**

  Do not just ask "Who switched?" Use the Blue Slips to categorize the room. Write these three categories on the board.

  **Category A: The Time-Inconsistent Agent (Hyperbolic Discounting)**
  *   **Profile:** Chose 3 Later at T0. At T1, Desired 1 Now, Chose 1 Now, **Judged** 1 Now as better.
  *   **Philosophical Map:** This is *preference reversal*, not necessarily weakness of will. Their utility curve shifted. At T1, the "Now" reward was genuinely more valuable to them than the "Later" reward. They acted in accordance with their current judgment.
  *   **Discussion:** Is this irrational? Humeans say no (passion dictates reason). Thaler says it's a cognitive error.

  **Category B: The Akratic Agent (Weakness of Will Proper)**
  *   **Profile:** Chose 3 Later at T0. At T1, Desired 1 Now, Chose 1 Now, but **Judged** 3 Later as better.
  *   **Philosophical Map:** This is *akrasia* (Davidson). They acted against their own all-things-considered judgment. They knew the larger sum was "better" (by their own T1 standards) but were overcome by the proximity of the reward.
  *   **Discussion:** This is the only group that experienced genuine normative conflict. Ask them: *"Did you feel regret the moment you took the chocolate?"*

  **Category C: The Resolute Agent (Pre-commitment)**
  *   **Profile:** Chose 3 Later at T0, **Sealed the Envelope**.
  *   **Philosophical Map:** This demonstrates the *demand for binding*. These students anticipated they might become Category A or B. They used their T0 rationality to constrain their T1 agency.
  *   **Discussion:** Why didn't everyone seal the envelope? (Overconfidence, cost of flexibility).

  ---

  ### **4. Predicted Pitfalls (What will go wrong)**

  1.  **The "Gambler" Problem:** A student might take the 1 Chocolate at T1 and claim they still judge the 3 Later as better, just to get a snack.
      *   *Fix:* Emphasize in the T1 instructions that the Judgment Survey is anonymous and graded on honesty, not "correctness."
  2.  **The "Social Proof" Cascade:** If one influential student takes the 1 Chocolate, others will follow to avoid being the "sucker" who waits.
      *   *Fix:* Collect the Blue Slips *before* anyone is allowed to unwrap the chocolate. Make the choice private.
  3.  **The Timing Drift:** You run over on the theory discussion and T1 happens at Min 30 instead of Min 25.
      *   *Fix:* Set a phone alarm for Min 24:00. When it vibrates, wrap up your sentence and switch modes immediately. If you lose the timing, the "immediacy" effect dissolves.
  4.  **No One Switches:** If the group is too disciplined or not hungry, you get no data.
      *   *Fix:* Have a backup story. If no one switches, ask: *"Why did the pull fail? Was the stake too low? Or are you all Kantian saints?"* This still generates discussion on stakes and moral psychology.

  ---

  ### **5. The Missing Feature: What You Must Supply**

  A compressed classroom version cannot reproduce the **diachronic cost to self-trust.**

  In real life, weakness of will is damaging not just because you lose the greater good, but because it degrades your relationship with your future self. When you break a diet or miss a deadline, you learn that your own resolutions are unreliable signals. This makes future pre-commitment harder.

  In this 50-minute session, the "cost" is trivial (2 chocolates). There is no long-term damage to their identity as a rational agent. They will not lose trust in themselves tomorrow because they ate a chocolate today.

  **Your Task:** In the final 5 minutes, you must verbally bridge this gap. Ask them: *"If this choice had been about studying for finals vs. going to a party, would the guilt of Category B (Akrasia) have felt heavier? Why?"* You must supply the **emotional weight of long-term identity** that the chocolate cannot carry. Without your prompting, they will leave thinking weakness of will is just a math error about snacks.
