answer: |-
  # The Recursive Decomposition Protocol (RDP-v1)

  **Purpose:** To safely extract analytical answers from a mid-size model that tends to improvise on complex tasks.
  **Time Budget:** 20 minutes per question (hard stop).
  **Operator:** Competent Engineer (no philosophy background required).
  **States:** `ANSWER_DIRECT`, `ANSWER_DECOMPOSED`, `ESCALATE_HUMAN`.

  ---

  ## Part 1: The Procedure

  ### Phase 1: Atomicity Triage (Minutes 0–3)
  **Goal:** Determine if the question is small enough to bypass decomposition.

  1.  **Input:** Paste the question into the model with the system prompt: *"You are an analytical engine. Do not answer. Estimate the number of distinct facts or logical steps required to answer this definitively."*
  2.  **Check:** If the model estimates **≤ 3 steps** AND **≤ 2 external sources**:
      *   **Action:** Proceed to **Phase 4 (Direct Answer)**.
      *   **Record:** Log `Triage_Step_Count`.
  3.  **Else:** Proceed to **Phase 2 (Split Proposal)**.

  ### Phase 2: Split Admissibility (Minutes 3–8)
  **Goal:** Force the model to break the question down, then audit the split.
  **User Device Fix:** Your "Difficulty Ledger" is too subjective. We replace it with a **Context Reduction Rule**.

  1.  **Prompt:** *"Propose 3-5 sub-questions that, if answered, would allow you to answer the parent question. Do not answer them yet."*
  2.  **Engineer Check (Judgment Call):** Look at the sub-questions.
      *   **Criterion A (Sufficiency):** If all sub-questions are answered "Yes/True/Value X", is the parent question logically solved? If no, **Reject Split**.
      *   **Criterion B (Context Reduction):** Does each sub-question require *less* documentation/context to define than the parent? (e.g., Parent needs 5 docs, Sub-question needs 1). If no, **Reject Split**.
      *   **Criterion C (Independence):** Can sub-question B be answered without knowing the answer to sub-question A? If they are tightly coupled, **Reject Split**.
  3.  **Decision:**
      *   If Split Rejected twice: Go to **Phase 5 (Escalate)**.
      *   If Split Accepted: Proceed to **Phase 3**.
      *   **Record:** Log `Sub_Questions_List`, `Sufficiency_Rationale`.

  ### Phase 3: Execution & Adversarial Verification (Minutes 8–15)
  **Goal:** Answer sub-questions and check for the "Same Model Blind Spot."
  **User Device Fix:** Your "Trust Budget" is converted to an **External Anchor Requirement**.

  1.  **Loop:** For each accepted sub-question:
      *   **Step 3.1 (Generate):** Ask the model to answer the sub-question.
      *   **Step 3.2 (Anchor Check):** Does the answer cite specific evidence (line numbers, doc titles, log timestamps)?
          *   If **No**: Tag as `UNANCHORED`.
          *   If **Yes**: Tag as `ANCHORED`.
      *   **Step 3.3 (Adversarial Check):** Prompt the model: *"Assume the answer you just gave is FALSE. List three specific reasons why it might be wrong based on the provided context."*
          *   If the model finds plausible errors: **Flag for Human Review**.
          *   If the model finds no errors: **Pass**.
  2.  **Budget Rule:** If >30% of sub-answers are `UNANCHORED`, you cannot proceed to composition. Go to **Phase 5 (Escalate)**.
      *   *Why:* This enforces your Trust Budget. The model cannot rely on its own reasoning for the majority of the work.
  3.  **Record:** Log `Sub_Answers`, `Anchor_Status`, `Adversarial_Flags`.

  ### Phase 4: Composition & Final State (Minutes 15–20)
  **Goal:** Assemble the answer or admit defeat.

  1.  **Prompt:** *"Here are the answers to the sub-questions: [Insert]. Compose the final answer to the parent question. Explicitly state any assumptions made to bridge gaps between sub-answers."*
  2.  **Engineer Check:** Read the "Assumptions" section.
      *   If the model assumes logical connections not proven by the sub-answers: **Downgrade Confidence**.
  3.  **Final State Selection:**
      *   **ANSWER_DIRECT:** (From Phase 1) Model provided a crisp answer with citations.
      *   **ANSWER_DECOMPOSED:** (From Phase 4) Sub-questions were `ANCHORED`, Adversarial Check passed, Composition assumptions are minimal.
      *   **ESCALATE_HUMAN:** Split failed, Anchors missing, or Adversarial Check found critical flaws.
  4.  **Audit Record:** Save the full prompt chain, the model's raw outputs, and the Engineer's `Sufficiency_Rationale`.

  ---

  ## Part 2: Judgment Calls vs. Procedure

  You asked to mark where this is "dressed up." Here is the honest breakdown:

  1.  **Sufficiency Check (Phase 2, Criterion A):** *Judgment Call.* The procedure says "If all sub-questions are answered... is the parent solved?" The model cannot verify this reliably because it doesn't know what it doesn't know. **You** must verify that the sum of the parts equals the whole.
  2.  **Context Reduction (Phase 2, Criterion B):** *Procedure.* Count the documents/tokens referenced. This is objective.
  3.  **Adversarial Check (Phase 3):** *Weak Procedure.* Since it is the same model, it may lack the knowledge to refute itself. This detects *internal inconsistency*, not *external falsehood*.
  4.  **The 30% Anchor Rule (Phase 3):** *Arbitrary Threshold.* I chose 30% as a heuristic. You may tune this, but do not set it to 0% (the model will fail) or 100% (you lose the benefit of decomposition).

  ---

  ## Part 3: Procedure Runs

  Here is the procedure executed on your three test cases.

  ### Case 1: Vendor Security Claims (Fact Pile + Calculation)
  **Question:** "Vendor X claims 24-hour key rotation. Their architecture doc v4.2 says keys are stored in HSM Type Y which requires manual approval for export. Their SLA says automated exports take 1 hour. Is the claim plausible?"

  *   **Phase 1 (Triage):** Model estimates 4 steps (Check HSM spec, Check SLA, Check Rotation Policy, Calculate Timing). **>3 steps.** Proceed to Split.
  *   **Phase 2 (Split):**
      *   *Sub-Q1:* Does HSM Type Y support automated export without manual approval?
      *   *Sub-Q2:* What is the maximum latency for an automated export in SLA?
      *   *Sub-Q3:* Does the 24h claim include the export time?
      *   *Engineer Check:* Sufficiency? Yes. Context Reduction? Yes (each looks at one doc). Independence? Yes. **Split Accepted.**
  *   **Phase 3 (Execution):**
      *   *Q1:* Answer: "No, manual approval required." (Anchor: Doc v4.2 Section 3). Adversarial: "Could there be a bypass mode?" Model: "Not documented." -> **Pass.**
      *   *Q2:* Answer: "1 hour." (Anchor: SLA Page 5). **Pass.**
      *   *Q3:* Answer: "Claim implies full cycle." (Anchor: Marketing Sheet). **Pass.**
      *   *Anchor Status:* 100% Anchored.
  *   **Phase 4 (Composition):** Model combines: Manual approval breaks the 24h automated window.
  *   **Final State:** **ANSWER_DECOMPOSED**.
  *   **Why:** The facts were independent. The calculation was trivial once facts were isolated. The procedure worked.

  ### Case 2: Formal Proof Validity (The Team's Wish)
  **Question:** "Attached is a cryptographic proof regarding our new handshake protocol. Is the reduction to the discrete log problem valid?"
  *(Team wants this automated to speed up audits.)*

  *   **Phase 1 (Triage):** Model estimates 15+ logical steps. **Proceed to Split.**
  *   **Phase 2 (Split):**
      *   *Sub-Q1:* Is Lemma 1 correctly stated?
      *   *Sub-Q2:* Does Step 3 follow from Lemma 1?
      *   *Sub-Q3:* Is the final reduction consistent with Step 3?
      *   *Engineer Check:* Sufficiency? **No.** Even if Lemma 1 is stated correctly, the *logic* connecting them requires understanding the math, not just retrieving facts. Context Reduction? **No.** Each sub-question requires understanding the whole proof context.
      *   *Attempt 2:* Model tries to split by line numbers. Engineer rejects (not logically atomic).
  *   **Phase 3 (Execution):** Skipped. Split failed twice.
  *   **Final State:** **ESCALATE_HUMAN**.
  *   **Why:** The procedure correctly identifies that "validity" is not a fact-retrieval task. It is a holistic logical check. A mid-size model cannot verify logic steps without understanding the whole chain, violating the Context Reduction rule.
  *   **Team Impact:** **Negative.** You cannot automate this. The procedure forces you to admit the model is not a theorem prover.

  ### Case 3: Migration Strategy (Composition Heavy)
  **Question:** "Plan A has 4h downtime and $10k cost. Plan B has 1h downtime and $50k cost. Operations says downtime costs $5k/hour. Which plan is better?"
  *(Facts are known. The hard part is the trade-off.)*

  *   **Phase 1 (Triage):** Model estimates 3 steps. **Proceed to Direct Answer?**
      *   *Wait,* Engineer overrides. This is a value judgment. Force **Split**.
  *   **Phase 2 (Split):**
      *   *Sub-Q1:* What is total cost of Plan A? (4h * 5k + 10k = 30k).
      *   *Sub-Q2:* What is total cost of Plan B? (1h * 5k + 50k = 55k).
      *   *Sub-Q3:* Is cost the only metric?
      *   *Engineer Check:* Sufficiency? **No.** The model can calculate the numbers, but "Better" depends on risk tolerance, not just math.
  *   **Phase 3 (Execution):**
      *   *Q1 & Q2:* Anchored. **Pass.**
      *   *Q3:* Model says "Unknown." -> **UNANCHORED.**
      *   *Anchor Status:* 66% Anchored. (Passes the 30% rule).
  *   **Phase 4 (Composition):**
      *   Model says: "Plan A is cheaper ($30k vs $55k). Therefore Plan A is better."
      *   *Engineer Check:* The model assumed "Cheaper = Better." This is a **Composition Assumption**.
      *   *Adversarial Check:* "What if 4h downtime violates compliance?" Model: "Possible."
  *   **Final State:** **ESCALATE_HUMAN**.
  *   **Why:** The procedure catches the "Composition Bottleneck." The math was easy, but the *decision rule* was hidden. The model relocated the difficulty from "Calculation" to "Value Weighting," which it cannot do safely.
  *   **Team Impact:** **Negative.** The team wanted a recommendation. The procedure gives them a spreadsheet and a warning.

  ---

  ## Part 4: Limitations & The Truth About the "Picture"

  ### What This Procedure Cannot Do
  1.  **Systemic Blind Spots:** If the model lacks the concept of "manual approval bypass" (Case 1), the Adversarial Check will not find it. The procedure verifies *consistency*, not *truth*.
  2.  **Holistic Reasoning:** As seen in Case 2 and 3, some problems cannot be split without losing the "gist." The procedure will correctly Escalate these, which reduces automation throughput.
  3.  **The "Same Model" Problem:** Phase 3, Step 3.3 (Adversarial Check) is theater. It helps catch hallucinations where the model contradicts itself, but it cannot catch errors where the model is confidently wrong about the world.

  ### Where It Will Predictably Misfire
  *   **False Negatives:** It will Escalate questions that a human expert could answer quickly, because the "Context Reduction" rule is too strict for experts (who hold context in head).
  *   **Gaming the Ledger:** The model may learn to propose trivial sub-questions to pass the "Context Reduction" check, pushing the actual hard work into the Composition phase (Phase 4), where it is harder to audit.

  ### What A Human Must Supply
  1.  **The Ground Truth:** The procedure manages *uncertainty*, it does not create *knowledge*. If the vendor docs are wrong, the model will confidently derive the wrong answer.
  2.  **The Value Function:** In Case 3, the human must define "Better." Is it cost? Risk? Speed? The model cannot infer organizational values.
  3.  **The Verdict on the "Picture":**
      *   *Is the underlying picture true?* **Partially.**
      *   *The Truth:* Decomposition works for **conjunctive** tasks (A and B and C must be true). It fails for **gestalt** tasks (Is this argument *sound*? Is this strategy *better*?).
      *   *Your Colleague's Claim:* "In principle get you much further."
      *   *Reality:* It gets you further on *retrieval and synthesis*. It does **not** get you further on *reasoning and judgment*. If the base model cannot do logic, splitting a logic problem into smaller logic problems does not help; it just creates more opportunities for the logic to break.

  **Final Recommendation:** Adopt RDP-v1. It will not automate your hardest problems (Case 2 & 3), but it will prevent the model from confidently lying about them. It turns "Hallucinated Answer" into "Escalated Ticket," which is the only win condition available to you with this hardware.
