      *   *The "What is this" question:* It's informal sanctioning without due process. It's community shunning.
      *   *The "When justified" question:* When the harm is irreparable or the person is dangerous. Here, it's a social faux pas that was apologized for.
      *   *Action:* The user needs to speak up because they helped write the document. Their silence validates the bypass.

