      Dear friend, your intuition is correct. What is happening is informal ostracism. It is distinct from natural consequences. Natural consequences are people feeling hurt. Exclusion from the sign-up sheet is an administrative act. The document was meant to prevent this. By bypassing it, the group is undermining its own integrity. The organizer's claim is a deflection. You should raise this. Frame it as protecting the document and the community's health. Don't just defend Dana, defend the process.

