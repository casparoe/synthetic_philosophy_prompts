answer: |-
  Jake is logically consistent, but morally shallow. He is applying a purely utilitarian framework (the greatest good for the greatest number) to a situation that is deeply relational and personal. Under his math, you are correct: 13 jobs saved is better than 1 job lost.

  But Jake is wrong about the guilt. He is confusing **justification** with **innocence**.

  You can be justified in doing a thing and still be guilty of the harm that thing caused. In ethics, this is often called the problem of **"dirty hands."** It describes situations where a leader must commit a moral wrong to achieve a necessary good. If you walk away from that situation with clean hands, it usually means you didn't actually do what was required. If you walk away without guilt, it usually means you lack the empathy to understand what you took.

  You asked for a real answer about what you are guilty of, without the "you did your best" platitude. Here is exactly what you are guilty of.

  ### 1. You are guilty of betrayal, not just termination.
  Firing Martin might have been a business necessity. Betraying him was a personal choice.
  Martin hired you. In the unspoken contract of mentorship, there is an expectation of loyalty. You didn't just sign off on his firing; you actively participated in the narrative that made him the scapegoat. When you sat at that cafe and looked him in the eye and lied about "going to bat for him," you severed a human bond to preserve a professional one. You are guilty of prioritizing your own position (and the company's survival) over truth with a man who trusted you. That is a specific moral injury, separate from the economics of the firing.

  ### 2. You are guilty of using a person as a means to an end.
  Immanuel Kant argued that you should never treat a human being merely as a means to an end, but always as an end in themselves.
  In this scenario, Martin was turned into a tool. He became the "cost" required to unlock the board's approval. His career, his reputation, and his livelihood were instrumentalized to save the visa holder, the parents, and the company.
  Even if that instrumentalization was necessary to prevent greater suffering, it still happened. You are guilty of participating in a system that consumed a person to keep the machine running. The guilt you feel is the recognition of his humanity that the spreadsheet ignored.

  ### 3. You are guilty of moral residue.
  This is the technical term for what you are feeling. When two moral obligations conflict (the obligation to save the company/employees vs. the obligation to be loyal/honest to a mentor), you have to violate one to fulfill the other.
  Even when you choose the "right" obligation (saving the 13 jobs), the violation of the other obligation (loyalty to Martin) leaves a residue.
  Jake calls this vanity. That is incorrect. Vanity implies you are doing it for attention or self-aggrandizement. This isn't vanity; it's **grief**. You are mourning the loss of your own moral cleanliness. You are acknowledging that the world is not set up in a way where you can save everyone and keep your hands clean.

  ### So, is Jake right?
  No. Jake's argument ("If you'd do it again, it wasn't wrong") relies on the idea that morality is only about *outcomes*. But morality is also about *actions* and *relationships*.
  *   **Outcome:** The company survived. (Jake is right).
  *   **Action:** You lied to a mentor and scapegoated him. (You are right to feel bad about this).

  If you *didn't* feel guilty, that would be dangerous. It would mean you have normalized sacrificing individuals for the collective without a second thought. That is how good people become dangerous leaders. The guilt is the check balance. It ensures that if you ever have to make this call again, you feel the weight of it.

  ### What do you do with the debt?
  You said it yourself: *"Martin is owed something I'm never going to be able to give him."*
  You are right. You cannot give him his job back. You cannot undo the lie. The debt is real, and it is unpaid.

  Jake thinks the goal is to eliminate the guilt. The goal is actually to **carry it.**
  *   **Don't try to talk yourself out of it.** Accept that you did the necessary thing *and* the harmful thing. Both are true.
  *   **Don't seek absolution from Martin.** Reaching out to him to clear your conscience would likely be for *your* benefit, not his. It would ask him to comfort you for the pain you caused him.
  *   **Pay the debt forward.** You owe Martin a debt you can't pay to him. So you pay it to the universe. You treat your next mentee with radical honesty. You fight for someone when the math says cut them. You become the kind of leader who absorbs the blow so their team doesn't have to.

  Jake thinks your guilt is vanity because he thinks morality is a ledger you balance and close. It isn't. It's a scar. You made the hard call to save the company, but you sacrificed a piece of your integrity and a friendship to do it. Acknowledge the cost. Keep the scar. Let it remind you that "the right thing" sometimes still hurts like hell.
