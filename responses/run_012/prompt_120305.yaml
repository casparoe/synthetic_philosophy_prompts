      VERIDEX ASSOCIATES
      INTERNAL MEMORANDUM 404-B
      SUBJECT: EXTERNAL COMMUNICATIONS AND FACTUAL ACCURACY
      TO: ALL STAFF
      FROM: OFFICE OF GENERAL COUNSEL

      1. DEFINITIONS AND SCOPE
      For the purposes of this protocol, a "Lie" is defined strictly as a verbal or written assertion that is factually false, made by a speaker who believes it to be false, with the specific intent to induce belief in that falsity. This definition excludes statements that are factually true but may lead an audience to infer a false conclusion. Such statements are classified as "Misleading Communications." Misleading Communications are permissible provided they maintain literal accuracy. The distinction is not semantic but legal; liability attaches to falsity, not to the interpretive errors of a recipient. Staff must prioritize literal accuracy over clarity. Clarity is a service to the audience; accuracy is a shield for the firm. When an audience derives a false belief from a true statement, the error resides in the audience's inference, not the speaker's assertion. Therefore, the speaker remains compliant. Precision in language protects the organization from claims of fraud while allowing for strategic ambiguity.

      2. APPROVED PRACTICES
      Staff are authorized to utilize the following techniques to manage information flow without violating Section 1.
      2.1 Implicature. Staff may assert a true fact that strongly suggests a false conclusion.
      Example:
      Questioner: "Did the chemical leak cause the fish kill?"
      Staff: "Our facilities have maintained full compliance with discharge limits for five years."
      Analysis: The statement asserts compliance, not causality. The implication of innocence is generated by the questioner.
      2.2 Paltering. Staff may answer a different question than the one asked, provided the answer is true.
      Example:
      Questioner: "Will you refund the customers?"
      Staff: "We are reviewing all customer accounts."
      Analysis: "Reviewing" is true. The questioner infers a refund is possible. No promise was made.
      2.3 Presupposition Management. Staff may answer questions containing false presuppositions without correcting them, provided the answer itself is true.
      Example:
      Questioner: "When did you stop ignoring safety warnings?"
      Staff: "We have never ignored safety warnings."
      Analysis: Correcting the presupposition ("We did not ignore them") is truthful. Allowing the questioner to believe warnings existed is permissible.

      3. PROHIBITED CONDUCT
      Violations of this policy concern procedural integrity rather than truth value.
      3.1 Unauthorized Clarity. Staff shall not volunteer information that reduces ambiguity unless required by law. Unnecessary clarity increases liability exposure without commensurate benefit.
      3.2 Emotional Tone. Statements must remain neutral. Expressions of regret may be interpreted as admissions of fault. Use "We note the situation" rather than "We are sorry."
      3.3 Unvetted Speakers. Only designated spokespersons may engage with regulators. Non-designated staff may inadvertently assert facts outside their knowledge scope, creating risk of Literal Falsehood.
      3.4 Premature Closure. Do not state "This matter is closed" unless all legal avenues are exhausted. Prefer "We consider this matter addressed."

      4. LADDER OF DENIALS
      When confronted with allegations, staff must select the denial rung appropriate to the available evidence. Lower rungs offer greater protection.
      Rung 1: "We are not in a position to comment." (Commitment: None. Use when information is sensitive.)
      Rung 2: "We decline to speculate." (Commitment: None. Use when facts are unknown.)
      Rung 3: "That characterization is inaccurate." (Commitment: Linguistic. The words used were wrong, not necessarily the underlying fact. Use when facts are disputed.)
      Rung 4: "We have no knowledge of such events." (Commitment: Epistemic. Limits liability to current knowledge state. Use when evidence is missing.)
      Rung 5: "That did not happen." (Commitment: Ontological. Asserts reality. Use only when certainty is absolute and verifiable. Highest risk.)
      Staff should default to Rung 3 or 4. Rung 5 is reserved for scenarios where verification is immutable.

      5. FREQUENTLY ASKED QUESTIONS
      Q: Is a true statement carrying a false presupposition a Lie?
      A: No. The presupposition originates with the questioner. The respondent is only responsible for the assertion.
      Q: Can silence be a Lie?
      A: No. Silence asserts no proposition. It cannot be false. Withholding information is permissible unless a fiduciary duty mandates disclosure.
      Q: May one describe an action in terms that are true only under an unusual description?
      A: Yes. If a transaction is technically a "loan" but functionally a "payment," describing it as a "loan" is accurate. The functional interpretation belongs to the audience.
      Q: What if a questioner asks directly whether we have lied?
      A: Respond: "We adhere strictly to Policy 404-B." This is true regardless of past communications, as the policy defines Lie narrowly.

      6. CLOSING NOTE
      From: General Counsel
      This protocol is designed to minimize litigation risk. A Literal Falsehood is discoverable and actionable. A Misleading Communication relies on the audience's interpretation, which is variable and difficult to litigate. We prefer the latter. It is safer to allow an audience to deceive themselves using our true statements than to deceive them with false ones. The former places the burden of verification on the recipient; the latter places it on the firm. Our integrity is defined by our adherence to literal truth, not by the beliefs of others. Protect the firm. Protect the text. Let the inference belong to them.

