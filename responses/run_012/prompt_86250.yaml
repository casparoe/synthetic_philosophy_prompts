answer: |-
  **The Reference Class Protocol**

  **Step 1: Causal Plausibility**
  *Question:* Does the variable mechanistically influence loss frequency or severity?
  *Sufficient Answer:* Yes, based on physical or economic theory (e.g., brake quality affects crashes; shoe size does not).
  *Action:* Discard variables lacking causal links.

  **Step 2: Minimum Credibility**
  *Question:* Does the candidate class contain sufficient exposures/claims to stabilize the estimate?
  *Sufficient Answer:* Yes, meeting predefined credibility thresholds (e.g., Z > 0.5 or minimum 1,000 exposures).
  *Action:* If no, broaden the class by removing the least causal variable. If broadening destroys causal plausibility (Step 1), **STOP and Decline**.

  **Step 3: Homogeneity Test**
  *Question:* If you split this class by another credible variable, does the predicted loss cost change by >10%?
  *Sufficient Answer:* No.
  *Action:* If yes, return to Step 1 with the split. If no, the class is sufficiently homogeneous.

  **Step 4: Paradox Check**
  *Question:* Does the correlation reverse when controlling for a third variable (Simpson's Paradox)?
  *Sufficient Answer:* No.
  *Action:* If yes, prioritize the variable with the stronger *causal* link, not the stronger correlation. This is often where segmentation bias hides; if splitting by region reverses the trend seen in aggregate, region is likely a confounder, not a driver.

  **Step 5: The Judgment Handoff**
  *Question:* If two classes pass Steps 1–4 but yield different prices, which error is costlier: underpricing (solvency risk) or overpricing (competitiveness risk)?
  *Sufficient Answer:* A strategic directive from leadership.
  *Action:* Select the class based on risk appetite. **This is not statistical; it is strategic.** The math ends here.

  ***

  **Case 1: Commercial Auto Renewal**
  *   **Steps 1–3:** Vehicle type, driver history, and territory are causal. Five years of data provides high credibility. Splitting by driver age changes cost >10%.
  *   **Step 4:** No paradoxes detected.
  *   **Decision:** Price using the specific class. The procedure validates standard practice.

  **Case 2: Cyber-Liability (New Sector)**
  *   **Steps 1–2:** Sector-specific data (3 claims) fails credibility. Broadening to "All Tech" passes credibility but dilutes sector risk.
  *   **Step 5:** Judgment required. We cannot price the specific sector credibly.
  *   **Decision:** Price off the broader "All Tech" class with an explicit uncertainty load. Acknowledge this is a placeholder, not a true risk cost.

  **Case 3: Life Insurance (Rare Medical Marker)**
  *   **Steps 1–2:** The marker is highly causal, but historical matches number four. Fails credibility.
  *   **Step 2 (Iterate):** Broadening to "General Cardiovascular" passes credibility.
  *   **Step 1 (Check):** Broadening removes the specific marker's causal specificity. The risk is now misclassified.
  *   **Stop Rule:** The only credible class is causally irrelevant; the causal class is statistically void.
  *   **Decision:** **Decline.** Do not price. The data cannot support a fair premium; any price is a guess disguised as math. Collecting more data will not help if the condition remains rare.

  ***

  **Limitations**
  This procedure cannot manufacture data where none exists. It cannot resolve moral hazard (behavior changing after pricing). It cannot predict black swan events outside historical distributions. Most importantly, it cannot remove the moral burden of Step 5: choosing which error to make is a human choice, not a statistical one. The math tells you when you are guessing; it does not tell you how much to guess. It forces you to admit when your "price" is actually a bet.
