  6.  **Removing the Feature:**
      *   If the harm was immediate/obvious (e.g., "Open the airlock"), even Darwinian might stop if hardwired, or Skinnerian if punished before. The split collapses.

  7.  **Attacking the Case (Defending Compliance):**
