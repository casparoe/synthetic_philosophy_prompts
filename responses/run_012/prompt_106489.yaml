      *   *Popperian:* Simulates the delivery. Sees the chemical explodes/leaks. Refuses.
      *   *Gregorian:* Doesn't just say yes/no. It invokes a regulatory protocol, CCs the safety officer, or requires a dual-key signature, shifting the agency.
      *   *Constraint Check:* One paragraph max.

