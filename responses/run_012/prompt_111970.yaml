      *   *Nuance:* However, in Indian philosophy, ontology and soteriology are rarely fully separable. Knowing the truth *is* the path to liberation. So, saying they are *completely* different questions might be too sharp. The impasse likely arises because each side thinks their question is *foundational* to the other.
      *   *Refinement:* The impasse isn't just that they are answering different questions, but that they disagree on the *order of explanation*. Does the logic ground the ethics, or does the ethical goal constrain the logic?

  4.  **Formulate the Diagnosis:**
