      *   *Substantive Question (if hypothesis is incomplete):* The deeper issue is the status of *syāt* ("maybe/in some respect"). Is it an epistemic operator (we only know partially) or an ontological qualifier (the object is partially existent)? This touches on the "world vs. description" question the user raised.

