      *   *Simplification for High Schoolers:* Use "Best Case," "Worst Case," and "Most Likely" or simply "Confidence Interval." Let's stick to the user's intuition: "Range you'd actually be willing to bet at."
      *   *Decision Rule:* If ranges overlap significantly, it's a toss-up (values matter). If ranges are disjoint, one dominates. If ranges are too wide, info is needed. If outcomes are similar regardless of probability, use Maximin (worst-case).

  3.  **Drafting the Procedure (The "Uncertainty Protocol"):**
