      *   *Phase 4: Check for Sensitivity.* Does the decision change if the probability is at the low end vs. the high end of the range?
      *   *Phase 5: The "Gap" Rule.* If the committee's ranges don't overlap, do we need more info?
      *   *Phase 6: The Values Call.* If uncertainty remains, admit it's a values choice, not a math choice.

