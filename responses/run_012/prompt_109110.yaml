answer: |-
  ### Brainstorming the Crux

  The weak student sees two geometry problems and applies uniform distributions blindly. They calculate the latitude ratio for the Earth ($47^\circ/180^\circ$) and the length ratio for the interval ($9/1000$). They might mention that "indifference is tricky" but treat both cases as structurally identical applications of the principle.

  The strong student recognizes that the "invariance move" relies on the structure of the symmetry group. For the Earth, the physical object possesses rotational symmetry. The only probability measure invariant under all rotations is the normalized surface area measure. This rules out uniformity over latitude (which clusters points at the poles). The symmetry group is "rich enough" (compact and transitive) to uniquely fix the prior.

  For the number machine, the interval $[1, 1000]$ lacks that richness. It is not invariant under scaling (changing units changes the bounds) nor full translation. Consequently, there is no unique invariant measure. A uniform distribution over $x$ is not invariant under the transformation $y = \log(x)$, yet nothing in the problem statement privileges linear scale over logarithmic scale. The invariance move succeeds in Case 1 (resolving ambiguity) but fails in Case 2 (revealing ill-posedness). The crux is seeing that symmetry doesn't just constrain probabilities; it determines whether the question is meaningful at all.

  ***

  ### 1. Essay Question

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question:**
  Consider the following claim regarding the Principle of Indifference: *Assigning equal probability to possibilities is only justified when there is a symmetry in the problem that demands it. Where the symmetry group is rich enough, this invariance requirement pins down a unique prior; where it is not, the problem is merely ill-posed rather than paradoxical.*

  Evaluate this claim using the following two cases:

  **Case 1:** A probe selects a random point on the surface of the Earth. What is the probability it lands in the tropics (within 23.5 degrees latitude of the equator)?
  **Case 2:** A machine outputs a random real number between 1 and 1000. What is the probability it comes out below 10?

  In your answer, explain how the invariance requirement applies differently to each case. Does the symmetry of the situation resolve the ambiguity in both, neither, or only one? Justify your conclusion without appealing to external authorities.

  ***

  ### 2. Model Answer

  The claim posits that indifference is not a default setting for ignorance, but a consequence of physical or structural symmetry. To evaluate this, we must determine whether the symmetries inherent in each case are sufficient to uniquely determine a probability measure. If a symmetry group is rich enough—specifically, if it acts transitively on the space of possibilities—it forces a unique invariant measure. If not, multiple incompatible measures remain possible, rendering the problem ill-posed.

  In Case 1, the object in question is a sphere. The physical symmetry here is rotational invariance; the Earth looks the same regardless of how it is spun. Any probability distribution assigned to the surface must respect this symmetry. If we assign uniform probability over latitude, we violate rotational symmetry because lines of latitude have different circumferences; a uniform latitude distribution implies points are more densely packed near the poles than the equator. The only measure invariant under all rotations is the uniform surface area measure. Therefore, the symmetry group is rich enough to pin down the prior. The probability is not the ratio of latitudes ($47/180$), but the ratio of surface areas. Since the area of a spherical zone is proportional to the sine of the latitude, the probability is $\sin(23.5^\circ) - \sin(-23.5^\circ)$, divided by the total range factor. The ambiguity is resolved by the geometry.

  In Case 2, the space is a bounded interval of real numbers. The intuition suggests a uniform distribution over the linear values, yielding a probability of $9/1000$. However, we must ask what symmetry justifies this. The interval $[1, 1000]$ is not invariant under scaling; if we changed the units or parameterized the output as the logarithm of the number, the bounds would shift, and the uniform measure would change. A distribution uniform in $x$ is not uniform in $\log(x)$. Unlike the sphere, there is no compact group of transformations acting on this bounded interval that rules out reparameterization. The problem statement does not specify a physical mechanism that privileges linear scale over logarithmic scale. Consequently, the symmetry group is not rich enough to force a unique prior.

  Therefore, the claim holds up under scrutiny. In Case 1, the rich symmetry structure eliminates ambiguity, making the problem well-posed and the answer unique. In Case 2, the lack of sufficient symmetry leaves the choice of measure arbitrary, making the problem ill-posed. The Principle of Indifference is not inconsistent; rather, it is inapplicable where symmetries fail to constrain the measure. The paradox arises only when we pretend a unique prior exists in the absence of the symmetry required to define it.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20 (5 Criteria × 4 Marks)

  | Criterion | Marks | Common Error / Note |
  | :--- | :--- | :--- |
  | **1. Interpretation of the Invariance Claim**<br>Correctly identifies that uniqueness depends on the richness of the symmetry group, not just ignorance. | /4 | Students often treat the claim as simply "symmetry matters" without linking it to uniqueness vs. ill-posedness. |
  | **2. Case 1 Symmetry Analysis**<br>Identifies rotational symmetry as the relevant constraint for the sphere. | /4 | Weak answers focus on "geometry" generally without specifying rotation as the invariant transformation. |
  | **3. Case 1 Measure Resolution**<br>Concludes surface area is the unique measure, rejecting uniform latitude. | /4 | Many students calculate the latitude ratio ($47/180$) and treat it as equally valid to the area ratio. |
  | **4. Case 2 Symmetry Deficit**<br>Identifies that the interval lacks symmetry to rule out reparameterization (e.g., log vs linear). | /4 | Students often assume uniformity is default and fail to see why log-uniform is a competing valid option. |
  | **5. Final Evaluation**<br>Concludes Case 1 is well-posed (resolved) and Case 2 is ill-posed (unresolved) based on the claim. | /4 | A common B-grade move is to conclude "both are ambiguous" or "both are fine" rather than distinguishing them. |

  **The single move that separates an A from a B is recognizing that symmetry solves the first problem while exposing the second as meaningless.**
