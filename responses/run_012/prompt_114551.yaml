answer: |-
  **The Scenario: The Folding Map Universe**
  **System:** A universe consisting of a single scalar variable $x$, where $x \in [0,1]$.
  **Time:** Discrete steps $t = 0, 1, 2, \dots$ (Idealization: Continuous smooth flows obey Picard-Lindelöf uniqueness, forcing invertibility. Discrete time bypasses this).
  **State:** The exact value of $x_t$.
  **Law:** $x_{t+1} = 4x_t(1 - x_t)$.
  **Demon:** Knows the law and the exact present value $x_{now}$.

  **Mechanics:** The law is a parabola mapping $[0,1]$ onto $[0,1]$. It folds the interval: distinct inputs (e.g., $0.2$ and $0.8$) yield the identical output ($0.64$). The dynamics are chaotic (Lyapunov exponent $\ln 2$): nearby points separate exponentially, making the future unpredictable for any agent with finite precision, though fixed for the Demon.

  **1. The Demon's Computation**
  *   **Known:** Exact $x_t$ and function $f(x) = 4x(1-x)$.
  *   **Forward:** Demon computes $x_{t+1} = f(x_t)$. Arithmetic yields a single unique number. The future is fixed and knowable.
  *   **Backward:** Demon solves $x_t = 4x_{t-1}(1 - x_{t-1})$. This is a quadratic equation with two valid roots in $[0,1]$. $x_{t-1}$ could be either $a$ or $b$.
  *   **Failure Point:** At the inversion step. Going back $k$ steps yields $2^k$ possible histories consistent with the present state and laws. The demon cannot distinguish them because the information distinguishing them was destroyed by the folding dynamics, not hidden.

  **2. Feature Analysis**
  *   **Working Feature:** **Non-Invertible Dynamics.** The map is many-to-one.
  *   **Modification:** Replace $f(x)$ with a bijective chaotic map (e.g., the Bernoulli shift $x_{t+1} = 2x_t \mod 1$ with state defined to track the branch).
  *   **Result:**
      *   *Fixed Future:* Survives (still deterministic).
      *   *Unpredictable Future:* Survives (still chaotic/sensitive).
      *   *Unfixed Past:* Vanishes. Every present state maps to exactly one past state.
  *   **Conclusion:** Chaos does not require information loss; retrodiction failure does.

  **3. The Determinism Objection**
  *   **Objection:** "Determinism entails bidirectional uniqueness. If the past isn't fixed by the present, the system isn't deterministic, or your state variable $x$ is incomplete (hidden variables exist)."
  *   **Response:** This relies on conflating **Forward Determinism** (present $\to$ future unique) with **Bidirectional Determinism** (present $\leftrightarrow$ past unique).
      *   This case satisfies Forward Determinism strictly: given $x_t$, $x_{t+1}$ is logically necessitated.
      *   It violates Bidirectional Determinism.
      *   **Not a Cheap Trick:** The state $x$ is complete by stipulation of the universe's ontology. There are no "hidden variables" to find; the laws themselves are irreversible functions. The asymmetry is structural to the laws, not epistemic. If determinism is defined solely as "the future follows from the present," the past's indeterminacy is a feature, not a bug, of this specific logical space.
