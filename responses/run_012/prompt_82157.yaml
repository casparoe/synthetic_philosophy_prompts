answer: |-
  The flaw is in **(3)**.

  > *(3) A fact counts as a cause only if it makes a difference to some event over and above the facts that already determine that event.*

  This is the engine of the exclusion argument (famously sharpened by Jaegwon Kim), and it is the step you must reject if you want to save the reality of the memory register without sliding into dualism. However, rejecting it comes with a metaphysical price tag that your friend's trap at (7) is designed to expose.

  Here is the breakdown of why (3) seduces us, why it fails in this context, how to dodge the "shadow register" bullet, and whether the Careenium actually buys you anything for the human mind.

  ### 1. Why (3) Looks True (The Intuition of Oomph)
  Premise (3) relies on a tacit model of causation as **conserved quantity transfer**. In classical physics, if a billiard ball moves, it's because momentum was transferred to it. If the micro-physical facts (the magnetic forces on the simmballs) already account for 100% of the momentum transfer, there seems to be no "causal room" left for the macro-pattern (the memory register) to contribute.

  It looks like a zero-sum game: either the balls move the balls, or the memory moves the balls. If the balls do it, the memory is just a shadow. This intuition is robust because it works perfectly for collisions, levers, and circuits. It treats causation as a physical *force* rather than a logical *relation*.

  ### 2. Why (3) Fails (The Category Error)
  The Careenium is not just a physical system; it is an *information-processing* system. In such systems, causation is best understood not as force transfer, but as **counterfactual dependence** (an interventionist account).

  To say the memory register is a cause is not to say it adds magnetic force to the simmballs. It is to say: *If the memory register had been different, the subsequent motion of the balls would have been different.*

  Premise (3) fails because it demands the macro-cause do work *over and above* the micro-cause. But the macro-cause *is* the micro-cause, described at a higher resolution of abstraction. They are not competitors; they are the same event described in different vocabularies. To insist that the macro-fact must add something *over and above* the micro-facts is to commit a category error. It's like saying, "The sentence's meaning didn't cause me to laugh; only the ink patterns on the page did." The ink patterns *are* the vehicle of the meaning. Without the meaning, the ink patterns wouldn't be there (in a designed system) or wouldn't have that effect (in an interpreting system).

  By rejecting (3), you adopt a **compatibilist** view of causation: the micro-level determines the *trajectory*, but the macro-level determines the *explanation* that supports prediction and control.

  ### 3. The Price: Dodging the Shadow Register (7 & 8)
  Your friend's trap is sharp. If you save the memory register by saying "it's a real pattern that predicts," haven't you opened the door to *any* pattern that predicts? Can I not define a "shadow register" (e.g., *Ball-1-is-here-OR-Ball-2-is-there*) that tracks the system perfectly but is ontologically junk?

  If you reject (3), you pay the price of making causal reality **interest-relative** or **pragmatic**. You cannot say the memory register is causally real in the same way gravity is real. You must say it is real *relative to a stance* that values compression.

  Here is how you keep the memory register without letting in the grue-ish shadows: **Informational Compression.**

  Dennett's doctrine of "Real Patterns" (1991) provides the filter. A pattern is real if describing the system in terms of that pattern allows you to predict its behavior *more efficiently* than describing it in terms of the micro-constituents.
  *   **The Memory Register:** To predict the next state of the Careenium, I can track the position of the "register clump." I don't need to know the velocity of every simmball. The macro-description compresses the data without losing predictive power.
  *   **The Shadow Register:** Your friend's gerrymandered pattern might fit the data, but to use it for prediction, you likely need to know the micro-state anyway. It is a disjunction that tracks the outcome but offers no *leverage*. It has high descriptive cost and low predictive independence.

  The "cost" of rejecting (3) is admitting that **causation is not a fundamental feature of the universe.** It is a tool used by agents (like us) to navigate complex systems. The memory register is a cause *for us*, because we are the size of memories, not simmballs. The shadow register is not a cause because it offers no handle for intervention or prediction to an agent with our cognitive limits.

  ### 4. Does the Careenium Transfer to Brains?
  This is the critical journalistic pivot. The Careenium works for brains only if you accept that brains, like the Careenium, are **evolved design systems**.

  In the Careenium, the "memory register" is an emergent regularity. In the brain, "beliefs" are emergent regularities. The friend's argument (1 & 2) holds for neurons just as it does for simmballs: neuronal firing is determined by electrochemical gradients. Nothing "about the belief" enters the ion channel.

  However, the transfer holds because evolution acts as the **selector of real patterns**. Evolution doesn't select for neurons; it selects for organisms that survive. Organisms survive by tracking macro-regularities (predators, food, mates). Therefore, the brain is *designed* (by natural selection) to be sensitive to macro-patterns.

  The "shadow register" in the brain would be a neural pattern that correlates with behavior but plays no role in the evolutionary history of the organism's success. It is a spandrel, not an adaptation. The "belief" is the pattern that was selected *because* it tracked reality efficiently.

  So, the Careenium transfers, but with a caveat: The Careenium is a static physics toy; the brain is a historical artifact. The "reality" of the belief is secured not just by its current predictive power, but by its **etiological role** in the system's design.

  ### 5. Is the Question Malformed?
  You asked me to be plain if the setup is confused. Here is the plain truth:

  The question *"Do symbols push the substrate around?"* is indeed malformed. It assumes a single ontology of "pushing."

  *   **Substrate level:** Causation is force/energy transfer.
  *   **Symbol level:** Causation is information/constraint propagation.

  When you ask if the memory register causes the balls to move, you are asking if an *abstraction* exerts a *force*. The answer is no. Abstractions don't exert forces. But abstractions **constrain** forces.

  The memory register is a stable attractor in the state-space of the Careenium. It doesn't push the balls; it limits the possibilities of where the balls can go. The "shadow register" does not constrain; it merely describes.

  **The Verdict:**
  Reject (3). Causation is not a competition between levels. But to avoid the "shadow register" absurdity, you must concede that causal efficacy is not a binary property of the world, but a graded property of **descriptions relative to agents**.

  The memory register is real because it is a **projectible kind** that supports counterfactuals (*"If the register had been different, the output would differ"*) with **informational compression**. The shadow register fails the compression test.

  **The Cost:** You lose the idea that causation is "out there" in the physics. You gain the ability to say that your belief in coffee caused you to walk to the kitchen, without violating the conservation of energy. You trade metaphysical gravity for pragmatic utility. For a science journalist writing on mind and evolution, that is likely the better trade. Evolution cares about utility, not metaphysical purity.
