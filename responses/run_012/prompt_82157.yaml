      *   **Why it looks right:** Intuition of physical "oomph" (conservation of energy).
      *   **Why it's wrong:** Causal exclusion is a category mistake. Levels don't compete; they supervene.
      *   **Handling the Trap (7/8):** Use Dennett's "Real Patterns" (information compression/projectibility). The shadow register fails the complexity test.
      *   **Brain Transfer:** Yes, but brains are evolved, not just physical. The "design stance" matters.
      *   **The "Bad Question" Clause:** Acknowledge that "pushing" is the wrong verb. "Constraining" or "Informing" is better.

  8.  **Polishing the Voice:** Ensure it sounds like a conversation between peers. Use terms like "supervenience," "counterfactual dependence," "informational compression," "interventionalist." Keep the Dennettian flavor (Design Stance, Intentional Stance).

      *(Self-Correction during drafting)*: I need to be careful not to just say "Dennett says X." I need to analyze the argument provided. The friend's argument is essentially Jaegwon Kim's Exclusion Argument dressed in Careenium clothes. The standard physicalist response is to deny the exclusion principle or redefine causation. I will argue for redefining causation via the "Real Patterns" criterion.

