      *   *Argument 2 (Oedipus Effect):* Predictions can influence the predicted event (self-fulfilling/defeating).
      *   *Argument 3 (Laws vs. Trends):* Science discovers universal laws, not specific historical trends. Trends are not laws; they depend on initial conditions which change.
      *   *Sociological Laws:* Popper allowed for "trivial" sociological laws (e.g., you can't build a machine that works perpetually), but not laws of historical *development*.

