  ## 7. Facilitator Script Snippets

  *   **Start:** "I am not going to tell you why time moves forward. I am going to ask you to make it move backward."
  *   **During Reversal:** "Notice: I did not change the rules. I changed the *state*. The asymmetry is not in the physics. It is in the arrangement."
  *   **During Betting:** "Bet on what you know, not what you feel. But remember: what you 'know' is based on runs like Phase 1. What if the run was like Phase 2?"
  *   **End:** "You reversed time today. You proved it is possible. Now explain why you can't do it to your coffee cup."
