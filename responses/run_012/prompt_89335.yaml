  # Scoring Key

  To determine your position, tally your answers according to the table below. Note that some answers are shared by multiple theories; your final position is determined by the *pattern* of your responses, specifically where you diverge from the clusters.

  | Item | (A) | (B) | (C) |
  | :--- | :--- | :--- | :--- |
  | **1** | Overflow, Russellian | GWT, HOT, FOR | Illusionism |
  | **2** | GWT, HOT, FOR | Overflow, Russellian | Illusionism |
  | **3** | Overflow, Russellian, FOR | GWT | HOT |
  | **4** | Overflow | GWT | HOT |
  | **5** | Russellian, Overflow | GWT, FOR, HOT | Illusionism |
  | **6** | Russellian | FOR, Overflow | Illusionism, GWT, HOT |
  | **7** | GWT, HOT | Overflow | FOR |
  | **8** | HOT | GWT, FOR | Illusionism (or HOT variant) |
  | **9** | Russellian, Overflow | FOR, GWT, HOT | Illusionism |
  | **10** | FOR, Overflow, Russellian | GWT, HOT | Illusionism |
  | **11** | Overflow, Russellian | GWT, FOR | Illusionism |
  | **12** | Russellian | GWT, FOR, HOT | Illusionism |

  **Position Profiles:**

  *   **(i) Phenomenal Overflow:** You likely chose **(A)** on Items 1, 3, 4, 7, and 11. You consistently maintain that phenomenality exceeds access/report.
  *   **(ii) Global Workspace (GWT):** You likely chose **(B)** on Items 1, 2, 3, 4, and 11. You equate consciousness with global availability. *Crucial Check:* On Item 7, if you chose (A), you are GWT. If you chose (C), you are FOR.
  *   **(iii) Higher-Order (HOT):** You likely chose **(B)** on Item 1 but **(C)** on Items 3, 4, 8, and 10. You distinguish access from meta-representation.
  *   **(iv) Illusionism:** You likely chose **(C)** on Items 1, 2, 5, 6, 10, and 12. You reject the existence of phenomenal properties as traditionally conceived.
  *   **(v) First-Order Representationalism (FOR):** You likely chose **(B)** on Item 1 (with GWT) but **(C)** on Item 7 and **(A)** on Item 10. You believe representation suffices for consciousness without meta-awareness.
  *   **(vi) Panpsychism/Russellian Monism:** You likely chose **(A)** on Items 1, 5, 6, 9, and 12. You view phenomenality as intrinsic and fundamental.

