  # Limitations and Overlaps

  This instrument cannot cleanly separate **Global Workspace Theory (GWT)** and **First-Order Representationalism (FOR)** on **Item 2 (Blindsight)**. Both views typically deny phenomenal consciousness in blindsight (GWT because there is no broadcast, FOR because the first-order content is damaged or non-veridical). They are separated instead by **Item 7 (Masked Priming)**: FOR claims the masked stimulus is conscious (as it is represented), while GWT claims it is unconscious (as it is not broadcast).

  Similarly, **GWT** and **Higher-Order Thought (HOT)** often converge on **Item 1 (Sperling)** and **Item 4 (Inattentional Blindness)**, as both deny consciousness without access/meta-awareness. They are distinguished by **Item 3 (No-Report)** and **Item 8 (Alien Hand)**: HOT allows for conscious states without global access if a higher-order representation is present, whereas GWT ties consciousness strictly to the global broadcast mechanism.

  Finally, **Illusionism** and **Eliminativism** are treated here as synonymous; the quiz does not distinguish between denying the existence of qualia and denying the coherence of the concept. If you found yourself selecting (C) options but feeling that the *term* "consciousness" is still useful for functional states, you are an Illusionist; if you think the term should be discarded entirely, your view lies slightly outside the six positions mapped here.
