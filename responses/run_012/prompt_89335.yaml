answer: |-
  # The Consciousness Commitments Inventory

  **Instructions:** For each of the following twelve scenarios or claims, select the option that best matches your intuitive judgment or theoretical commitment. Do not select an answer based on which theory you *think* you should hold; select the answer that reflects what you actually believe happens in the case. There are no right or wrong answers, only diagnostic ones.

  **1. The Sperling Paradigm (Iconic Memory)**
  Subjects are shown a grid of 12 letters for 50 milliseconds. When asked to report the whole grid, they recall about 4 letters. When cued to report only a specific row immediately after the display vanishes, they recall nearly all letters in that row.
  *   (A) Subjects phenomenally see all 12 letters, but the rich experience fades faster than they can report it.
  *   (B) Subjects only consciously see the letters they attend to and report; the rest is unconscious processing.
  *   (C) The question assumes a "rich experience" that is a cognitive confusion; there is only information processing.

  **2. The Blindsight Case**
  A patient with V1 damage denies seeing a stimulus in their blind field but can guess its location or movement above chance when forced to choose.
  *   (A) There is no phenomenal experience here; it is purely unconscious visual guidance.
  *   (B) There is a dim, degraded phenomenal experience that lacks the access required for report.
  *   (C) The distinction between "experience" and "guessing" is a category error in this context.

  **3. No-Report Paradigms**
  Researchers measure neural correlates of consciousness using pupillometry or EEG while the subject performs a task that does not require explicit reporting of the stimulus.
  *   (A) This isolates consciousness from the confounds of access and report, revealing true phenomenology.
  *   (B) This is impossible; any measure of consciousness requires some form of global access or broadcast.
  *   (C) This measures first-order sensory states, which may or may not be conscious depending on higher-order targeting.

  **4. Inattentional Blindness**
  Subjects counting basketball passes fail to notice a person in a gorilla suit walking through the scene.
  *   (A) The gorilla is phenomenally present but ignored; access is the bottleneck.
  *   (B) The gorilla is not consciously seen because it was not globally broadcast or attended.
  *   (C) The gorilla is represented but lacks the higher-order thought required for awareness.

  **5. Split-Brain Patients**
  In commissurotomy patients, the left hand (right hemisphere) may undo the actions of the right hand (left hemisphere), with the speaking left hemisphere confabulating reasons for the action.
  *   (A) There are two distinct streams of phenomenal consciousness in one body.
  *   (B) There is one consciousness with fractured access to information and motor control.
  *   (C) The unity of consciousness is a narrative illusion constructed by the speaking hemisphere.

  **6. The Nature of "Red"**
  When you experience the color red, what is the nature of that property?
  *   (A) It is an intrinsic, fundamental property of experience itself.
  *   (B) It is a representational content pointing to surface reflectance properties in the world.
  *   (C) It is a functional state that we misdescribe using phenomenal terms.

  **7. Masked Priming**
  A visual stimulus is presented briefly and masked such that subjects deny seeing it, yet it influences their reaction times to subsequent targets.
  *   (A) The stimulus is truly unconscious; representation does not guarantee phenomenality.
  *   (B) The stimulus is phenomenally conscious but the access required to report it is blocked.
  *   (C) The stimulus creates a first-order representation which *is* the experience, regardless of report.

  **8. Alien Hand Syndrome**
  A patient's hand performs complex actions (e.g., unbuttoning a shirt) that the patient disowns, claiming the hand has a "will of its own."
  *   (A) The movement is conscious but lacks the higher-order representation of agency/ownership.
  *   (B) The movement is generated unconsciously; the feeling of alienation is a post-hoc access judgment.
  *   (C) The "feeling of ownership" is the only thing that ever makes a state conscious in the first place.

  **9. Philosophical Zombies**
  Is it conceivable that there exists a being physically identical to you but lacking any phenomenal experience?
  *   (A) Yes, this is clearly conceivable, indicating experience is not exhausted by function.
  *   (B) No, this is incoherent; if the function is identical, the experience is identical.
  *   (C) The question is misleading; "phenomenal experience" is a term for specific functional roles.

  **10. Animal Consciousness**
  Does a mouse feel pain when its nociceptors fire, assuming it lacks complex meta-cognitive abilities?
  *   (A) Yes, first-order nociceptive representation is sufficient for pain.
  *   (B) No, without higher-order awareness or global access, it is a reflex without feeling.
  *   (C) Pain is a human construct; the mouse has avoidance behavior, not "pain."

  **11. Change Blindness**
  When a major change in a scene occurs during a saccade or flicker, subjects often fail to notice it.
  *   (A) We have a rich phenomenal field that is not stable; we sample it sparsely.
  *   (B) We have a sparse phenomenal field; we only see what we attend to.
  *   (C) We have an illusion of a rich field generated by the expectation of access.

  **12. The Hard Problem**
  Why does physical processing give rise to an experienced inner life?
  *   (A) This is a real explanatory gap that physicalism cannot bridge.
  *   (B) This is a problem that will be solved by identifying the specific functional architecture of access.
  *   (C) This is a pseudo-problem generated by misdescribing functional states as phenomenal.

