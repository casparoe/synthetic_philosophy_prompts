  The wire triggers on the stroke of night,
  A million resting heavy in the mind;
  The vial glimmers in the sterile light.

  But cash is yours only if you can bind
  A real intent, not just a guess you tell;
  Prediction leaves the commitment far behind.

  By noon the money sits inside the well,
  Deposited and safe beyond the hour;
  No reason left to make the suffering sell.

  So Kavka says the will lacks all the power
  To mean the drink when profit disappears;
  I see the cliff within this present hour.

  Yet Gauthier says the commitment steers
  The rational agent past the doubt so clear;
  Once pledged, the act is what the will adheres.

  So midnight tries to lock the future here
  Against the logic that dissolves the pact;
  I hold the vial, keeping both things near.

  I lift the glass.

