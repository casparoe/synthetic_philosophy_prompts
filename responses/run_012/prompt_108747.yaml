answer: |-
  ### Q&A Prep Sheet: Sidgwick & Psychical Research

  **Ordering:** Ranked by potential damage to the core argument (1 = catastrophic, 8 = nuisance). Speaker attribution is noted where the vocabulary is specific, but note that the Ethicists may pile on once one smells blood.

  ---

  #### 1. The Is-Ought Collapse (Analytic Ethicist)
  **The Objection:** "You're claiming Sidgwick tried to solve a normative problem (the dualism of practical reason) with empirical data (psychical phenomena). Even if he found ghosts, that's a causal fact. How does the existence of a soul bridge the gap between 'what is rational for me' and 'what is morally right'? You're treating the postulates of practical reason as if they were hypotheses in natural science. They aren't."
  **Concession:** Concede that empirical facts alone don't generate normative force. Sidgwick knew this.
  **Reply:** Sidgwick isn't trying to derive 'ought' from 'is'. He's trying to verify the *conditions* under which the 'ought' becomes rational. The dualism exists because rational egoism and utilitarianism diverge *unless* there's a sanction (reward/punishment) aligning them. If survival + moral order is empirically true, the divergence disappears not because facts create values, but because the *costs* of egoism change. He's checking the ledger, not writing the moral law.
  **Honest Flag:** **Soft.** This relies on a prudential interpretation of rationality that many ethicists reject. If they don't buy that "rationality" is about long-term payoff, this reply dies.
  **Damage:** Catastrophic. If this holds, the central thesis (empirical wing of ethics) is a category error.

  #### 2. The Null Result (Psychologist / Historian)
  **The Objection:** "Sidgwick spent twenty years on this and died without conclusive evidence. The SPR's own archives are full of failed replications and debunked mediums. If the project was to find data to resolve the dualism, and the data never arrived, then the project failed. Why are you presenting a failed research program as a 'coherent' philosophical strategy?"
  **Concession:** Concede the data was inconclusive and Sidgwick knew it.
  **Reply:** The coherence isn't in the *success* of the findings, but in the *structure* of the inquiry. Sidgwick's stance was 'hope based on investigation,' not 'certainty based on proof.' The project is coherent as an attempt to keep the question open without dogmatism. The failure of the data doesn't invalidate the necessity of the question for his ethical system.
  **Honest Flag:** **Bluff.** You are reframing "failure" as "process." To the psychologist, a twenty-year experiment with no result is a waste, not a valid method. You have no defense against the claim that he wasted his life.
  **Damage:** High. Undercuts the "coherent figure" claim and makes him look deluded.

  #### 3. Methodological Bankruptcy (Psychologist)
  **The Objection:** "You call this the 'empirical wing' of his philosophy. But by modern standards, and even by the standards of emerging Victorian science, psychical research was methodologically rotten. Confirmation bias, lack of controls, cherry-picking. You can't advocate this as a 'live option' for us now. It's a case study in how *not* to do science."
  **Concession:** Concede that much of the SPR's work wouldn't pass modern review.
  **Reply:** I'm not advocating the specific methods of 1880. I'm advocating the *stance*: that when philosophy hits a wall requiring metaphysical postulates, we shouldn't just posit them dogmatically (like Kant) or ignore them (like modern ethics), but investigate them as best we can with available tools. The tools change; the imperative to test the postulates remains.
  **Honest Flag:** **Soft.** You are separating the "stance" from the "method," but the psychologist will argue the stance is contaminated by the method. If the method is fraud-prone, the stance is naive.
  **Damage:** High. Kills the second claim (that this is a live option for us).

  #### 4. Motivational Mismatch (Historian)
  **The Objection:** "The archival record suggests Sidgwick's involvement was driven more by personal grief and the loss of friends than by the *Methods of Ethics* argument. The timeline doesn't line up neatly. You're retrofitting the ethical project onto what was essentially a bereavement response institutionalized as science."
  **Concession:** Concede that personal loss was a major driver and the timeline is messy.
  **Reply:** Motivation isn't justification. Even if grief sparked the interest, the *philosophical work* he assigned to it is clear in his correspondence and the *Methods* conclusion. He intellectualized the grief into the project. Whether it started in pain doesn't change the fact that he used it to address the dualism.
  **Honest Flag:** **Hard.** The historian has the letters; you don't. If they press on specific dates or letters linking the *Methods* conclusion to the SPR founding, you will fumble. Keep it high-level.
  **Damage:** Medium-High. Makes your philosophical reading look like a rationalization of biography.

  #### 5. The Contradiction Charge (Analytic Ethicist)
  **The Objection:** "In the *Methods*, Sidgwick says practical reason *cannot* resolve the dualism. It's a fundamental limit. Now you're saying he spent twenty years trying to resolve it empirically. Is he contradicting himself? Either reason can't do it, or it can. Which is it?"
  **Concession:** Concede the tension is explicit in the text.
  **Reply:** He says *practical reason* (a priori) can't do it. He doesn't say *empirical inquiry* can't. He's shifting the burden from pure philosophy to mixed inquiry. It's not a contradiction; it's a supplementation. He admits philosophy hits a wall, so he goes to find a ladder elsewhere.
  **Honest Flag:** **Soft.** This is a distinctions-without-a-difference argument. If "reason" includes all rational inquiry, he's contradicting himself. You need them to accept a narrow definition of "practical reason."
  **Damage:** Medium. Makes Sidgwick look confused rather than coherent.

  #### 6. The Sanction Problem (Analytic Ethicist)
  **The Objection:** "Even if survival is proven, why does that reconcile egoism and benevolence? You could survive and be punished, or survive and be indifferent. Survival alone doesn't guarantee the 'moral order' where virtue is rewarded. He needed a specific kind of afterlife, not just any afterlife."
  **Concession:** Concede survival isn't enough; it needs to be a moral universe.
  **Reply:** Sidgwick knew this. That's why the SPR looked for evidence of *moral* progression and communication, not just ghosts. The hope was specifically that consciousness persists *and* retains moral character. It's a specific hypothesis, not a generic one.
  **Honest Flag:** **Hard.** The evidence for a *moral* afterlife is even thinner than for survival. You're doubling down on a weaker claim.
  **Damage:** Medium. Narrows the target for the Psychologist to shoot at.

  #### 7. The Seriousness Challenge (Chair)
  **The Objection:** "Let's be blunt. This department teaches ethics, not parapsychology. Why are we spending seminar time on what amounts to Victorian ghost hunting? What is the actual philosophical payoff beyond historical curiosity?"
  **Concession:** Concede the topic sounds marginal compared to standard ethics.
  **Reply:** The payoff is understanding how a major philosopher handled the limits of rationality. It's not about the ghosts; it's about what you do when your ethical system requires metaphysical assumptions you can't prove. Do you ignore them? Lie? Or investigate? That's the payoff.
  **Honest Flag:** **None.** This is the right answer. Stand firm.
  **Damage:** Low (Social risk only). Don't apologize.

  #### 8. The James Derivative (Grad Student)
  **The Objection:** "This sounds exactly like William James's 'Will to Believe.' You're saying we should hope and investigate despite lack of evidence. Isn't this just rebranding James? What does Sidgwick add that James didn't do better?"
  **Concession:** Concede the overlap with James is significant.
  **Reply:** James argues for the *right* to believe without evidence. Sidgwick argues for the *duty* to investigate before hoping. James is voluntarist; Sidgwick is evidentialist who hopes evidence will show up. It's a stricter, more desperate stance.
  **Honest Flag:** **None.** This is actually a friendly question. Use it to clarify your position.
  **Damage:** Low. Mostly about intellectual ownership.

  ---

  ### The Question You're Praying Nobody Asks

  **The Question:** "Sidgwick wrote privately that if he couldn't find evidence of survival, he couldn't see how life was worth living. If your claim is that this project makes him coherent, aren't you arguing that his entire ethical system rests on a hope he knew was likely false? Isn't the 'coherent figure' actually just a desperate man trying to rationalize his own depression?"

  **Why It Hurts:**
  1.  **It bypasses the philosophy and attacks the agent.** It makes your "coherence" argument look like a euphemism for "delusion."
  2.  **It collapses the "Live Option" claim.** If the stance is rooted in existential desperation rather than rational strategy, you can't recommend it to us now as a methodological model.
  3.  **It forces you to choose:** Either admit Sidgwick was emotionally compromised (undermining his authority) or deny the depth of his despair (contradicting the biographical record you're relying on for context).
  4.  **No Good Reply:** You can't say "desperation is a valid philosophical method." You can't say "he wasn't desperate" (the letters exist). You're stuck defending the rationality of a project born from the fear of death.

  **Handling It:**
  *   **Do not** get defensive about Sidgwick's mental state.
  *   **Concede** the desperation. "He was desperate. That's precisely why the case is interesting."
  *   **Pivot:** "The question isn't whether his motivation was clean, but whether the *structure* of his response holds up. Desperation drove the question, but rigor drove the method. We can learn from the rigor even if the motivation was painful."
  *   **Flag:** This is damage control, not a win. Your goal is to survive the question without the room turning sympathetic but dismissive (i.e., "Poor Henry, let's move on").
