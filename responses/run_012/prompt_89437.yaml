answer: |-
  This is the correct way to approach the literature. You are asking for the *conditions of adequacy* for a meta-ethical or normative theory attempting to solve the problem of moral obligation. Your friend has stumbled into the distinction between *explaining the origin* of morality and *justifying its authority*.

  Here is the spec. These are the desiderata any successful answer must meet, why they are required, and where the system breaks.

  ### 1. Case Coverage (The Five Personas)
  A theory must account for the normative status of the agent in these five scenarios without changing its definition of "moral reason."

  *   **The Ring-Bearer (Impunity):** Must explain why the agent has a reason to refrain when detection is impossible and self-interest is maximized by transgression.
      *   *Why required:* This isolates morality from social sanction. If the reason vanishes when the ring is on, you have described prudence, not morality.
  *   **The Reluctant Moralist (Kant's Case):** Must explain the obligation of the agent who does the right thing but feels no desire to do so (no sympathy, no habit, just duty).
      *   *Why required:* Morality claims authority over inclination. If the theory requires you to *want* to be good to have a reason to be good, it collapses into psychology.
  *   **The Fair-Weather Friend (The Knave):** Must explain why the agent who is moral only when it pays is *mistaken*, not just risky.
      *   *Why required:* To distinguish moral error from strategic error. If the Knave is only wrong because he might get caught, morality is just risk management.
  *   **The Martyr (Self-Sacrifice):** Must explain why the agent who is "wrecked" for doing right acted rationally or correctly.
      *   *Why required:* Morality often demands net loss to the agent. A theory that defines "good" as "good for the agent" cannot account for legitimate self-sacrifice without redefining self-interest so broadly it becomes meaningless.
  *   **The Amoralist (The Outsider):** Must address the agent who understands moral claims but feels no grip from them.
      *   *Why required:* To test the universality of the reason. If the theory says "they have a reason but don't feel it," it is Externalist. If it says "they have no reason," it concedes morality is optional.

  ### 2. The Distinctions (The Boundaries)
  A theory cannot collapse these pairs. If it does, it changes the subject.

  *   **Motivating vs. Justifying Reasons:**
      *   *Requirement:* The theory must explain what makes an action right (justification) separately from what makes an agent move (motivation).
      *   *Why:* Your friend slid between these. If you answer "you should be moral because you'll feel guilty," you have given a motive, not a justification. Guilt is a psychological sanction, not a moral truth.
  *   **Morality's Demands vs. Morality's Function:**
      *   *Requirement:* You cannot justify an individual obligation solely by citing the social utility of the practice.
      *   *Why:* This is the "Utilitarian Trap." Even if morality is good *for society*, that does not explain why *I* must sacrifice my interest for it when I can cheat. That requires a further premise linking my interest to society's.
  *   **The Skeptic's Question vs. The Answer Given:**
      *   *Requirement:* The answer must address "Why should *I* do it?" not "Why is it good that it be done?"
      *   *Why:* Most theories answer the second question and pretend they answered the first. This is the "Quid Juris" problem (Kant).

  ### 3. The Assumption Verdict
  **Is it legit to tell him he's already committed to morality just by asking?**

  **Verdict: No. It is a cheat.**

  *   **Why:** This is a Transcendental Argument (common in Kantian and Habermasian approaches). It argues that by engaging in rational discourse or asking for reasons, you presuppose the moral framework.
  *   **The Flaw:** The radical skeptic (Thrasymachus/Your Friend) can reply: "I am asking for a *prudential* reason to be moral. If you tell me I am committed to morality to understand my question, you are begging the question." It assumes the authority of rationality is identical to the authority of morality. The skeptic can reject rationality's normative grip just as easily as morality's. It forces a commitment the skeptic explicitly denies holding.

  ### 4. The Empirical Constraint
  **"Morality looks like a human practice... plenty of people who don't believe in it seem to get on fine."**

  *   **Requirement:** The theory must square the *categorical* nature of moral claims ("You must, regardless") with the *contingent* nature of moral practices (they evolved, they vary, people opt out).
  *   **Why:** If morality is a human invention (Naturalism), its authority seems contingent (like chess rules). If it is objective (Realism), its history seems irrelevant. A successful theory must explain how a human practice can generate non-optional reasons. If it ignores the "getting on fine" part, it is out of touch with reality. If it accepts it fully, morality loses its authority.

  ### 5. Non-Negotiables
  Of the above, these two are the hard constraints. If a theory fails these, it is not an answer to "Why be moral?":

  1.  **Non-Prudential Normativity:** The reason to be moral cannot ultimately reduce to self-interest (happiness, reputation, avoiding guilt). If it does, the Ring of Gyges destroys it.
  2.  **Categorical Authority:** The reason must apply even when the agent does not desire the end. If morality is hypothetical ("If you want to be happy, be moral"), it is not morality.

  ### 6. The Hard Truth: Are They Jointly Unsatisfiable?

  **Yes.**

  There is a strong argument that **Non-Prudential Normativity** and **The Empirical Constraint** are jointly unsatisfiable without significant metaphysical cost. This is the "Meta-Ethical Dilemma."

  *   **Horn A:** You satisfy **Non-Prudential Normativity**. You argue morality binds regardless of interest.
      *   *Cost:* You violate the **Empirical Constraint**. You must posit moral facts that exist independently of human psychology or society (Non-Naturalism). This makes morality "queer" (Mackie) and hard to square with evolution/history. It makes the "getting on fine" amoralist irrational, but not necessarily unhappy.
  *   **Horn B:** You satisfy the **Empirical Constraint**. You argue morality is a human practice rooted in psychology/society.
      *   *Cost:* You violate **Non-Prudential Normativity**. If morality is a human practice, the amoralist can opt out like a chess player quitting a game. You cannot prove they *must* play. You collapse into Prudence or Error Theory (Mackie again: morality is false).

  **The Dilemma:** To save the *authority* of morality, you must make it metaphysically strange. To make morality *natural/plausible*, you must surrender its *authority*. Your friend's dilemma feels insoluble because it likely is, given naturalistic assumptions.

  ### 7. The Single Requirement That Does The Most Work

  **Non-Prudential Normativity.**

  This is the filter that kills the most candidate answers.

  *   **Kills Hobbesian Contractarianism:** If the reason to be moral is "to avoid the state of nature," it is prudence. Put the Ring on, and the reason vanishes.
  *   **Kills Simple Virtue Ethics:** If the reason is "to flourish/be happy," the Ring-bearer who sins secretly and flourishes has no reason to stop.
  *   **Kills Rule Utilitarianism:** If the reason is "general welfare," the skeptic asks "Why is general welfare *my* reason?" If the answer is "because it helps you in the long run," it's prudence. If the answer is "just because," you've jumped to Non-Prudential Normativity.

  **Summary for Grading Your Books:**
  When you open those four books, check if they try to derive morality from self-interest (they will fail the Ring). Check if they posit objective moral facts (they will fail the Empirical Constraint). Check if they argue you are "committed" by asking (they will fail the Verdict).

  If a book claims to solve it without admitting a cost to one of those desiderata, it is likely smuggling a premise. Your friend was right to feel the gap; the literature is largely a map of attempts to bridge a chasm that may not have a bridge.
