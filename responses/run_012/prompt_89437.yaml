          *   **The Fair-Weather Friend:** Needs to distinguish true obligation from prudence.
          *   **The Martyr (Wrecked for doing right):** Needs to explain why morality trumps self-preservation/interest.
          *   **The Amoralist:** Needs to address someone who rejects the framework entirely.

      *   *Distinctions:*
          *   **Motivating vs. Justifying:** Internalism vs. Externalism. A reason must justify even if it doesn't motivate.
          *   **Demands vs. Function:** What morality asks of me vs. why society invented it.
