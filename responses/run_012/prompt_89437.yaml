prompt: |-
  so my friend and i got into it last night about the ring of Gyges and it went till 2am and i lost. his line: fine, give me the ring and I'll probably still be decent — guilt, habit, reputation, whatever. but thats not the question. he's not asking why being moral is usually a good bet, he's asking what makes it true that he has to, and every reason i gave him he either already accepted because it was really just prudence in a coat, or i ended up saying 'because it's wrong', which is the thing we're supposed to be justifying. and he kept sliding between what reason do i have to do it and what would make me want to do it, and i honestly couldn't tell if that was a trick or a real distinction.

  i've got four books on this on the shelf and i dont want to start them until i know what i'm grading them against. so skip the answers, give me the desiderata — what any answer to why be moral has to deliver to count as one.

  Which cases it has to get right: the ring; the guy who does the right thing and hates every minute of it; the one who's decent only while it pays; the one who does the right thing and gets wrecked for it; the one who says he doesn't care about reasons at all. Which distinctions it can't collapse: motivating vs justifying; what morality demands vs what it's for; the question the skeptic actually asked vs the question the answer actually answers. What it can't assume — and here i want a verdict, not a shrug: is it legit to tell him he's already committed to morality just by asking, or is that a cheat? What it has to square with: morality looks like a human practice with a history, and plenty of people who don't believe in it seem to get on fine.

  For each one, why it's a requirement and not just my preference, and which are non-negotiable. Then the bit i actually want: are any of these jointly unsatisfiable? my friend's dilemna feels like it ought to be, and if it is i want it laid out rather than patched over. And which single requirement does the most work, i.e. knocks out the most candidate answers by itself. no reading list please, i have the books, just the spec.
