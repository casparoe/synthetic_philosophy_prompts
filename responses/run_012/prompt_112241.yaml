prompt: |-
  Ok weird one, bear with me. I'm a commercial contracts lawyer, twelve years in, I can draft an indemnity clause half asleep, but I've never studied any philosophy. A friend lent me Austin's lectures on performatives — the hereby kind of utterance, promising, that whole thing — and its genuinely messing with my head, because the entire time I'm reading it I keep thinking: this is just contract formation with the enforcement filed off.

  So two asks. First, restate his theory of performative utterances in my actual working vocabulary. I mean the real machinery I use every day: offer and acceptance, consideration, intention to create legal relations, certainty of terms, capacity, conditions precedent, void vs voidable, the objective theory of assent, reps vs warranties. And don't stop at the early stuff — include the later moves too, him giving up on the performative/constative split and swapping in locutionary / illocutionary / perlocutionary, plus his taxonomy of felicity conditions and the misfire vs abuse distinction. Be as faithful as you can and don't water it down on my account.

  Second, and this is the part I actually want, the residue report. What came through cleanly, what only came through with a fudge, and what has no counterpart at all in how contract law thinks. Please don't just relabel his terms with mine and call it a translation — I can do that myself and I don't trust it.

  Also, attack my working theory while your at it: I think his felicity conditions are just formation requirements, and his abuses (the insincere ones) are just breaches, so the whole thing collapses into contract law minus the courthouse. Where's the leak? And when you hit something with no counterpart, tell me which kind of residue it is — my framework literally can't say it, or his was never doing any real work to begin with.

  Last thing. If you remember the later fight about whether a performative only works because it's a repeatable formula — the same words reused over and over, even quoted, even on a stage — tell me which side my world lands on, given that half of what I do all day is standard forms and boilerplate.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

