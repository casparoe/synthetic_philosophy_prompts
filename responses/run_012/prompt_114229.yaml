  I need one essay question for the final of an upper-level seminar on collective responsibility, on the inefficacy objection — the claim that because no individual's contribution to a collective harm (climate, factory farming, voting) makes a difference to the outcome, individuals bear no responsibility for it. The question must not be answerable by reciting the harmless-torturer or threshold cases, so build it around this scenario: a firm emits a pollutant in proportion to its sales; the emissions raise the risk of illness for nearby residents; each customer's purchase adds one unit of emissions and shifts each resident's risk by an imperceptible amount, but no purchase changes whether any resident actually falls ill. Ask candidates to (i) say whether any customer causes the harm in a difference-making sense, (ii) say whether that finding settles the question of individual responsibility, and (iii) state what a defensible principle of individual obligation would have to look like — one that neither collapses into "only total outcomes matter" nor holds people responsible for effects they could not possibly influence. Provide a model answer of roughly 700 words and a marking scheme built around four must-hit points, with the marks for each (total 20) and a one-line note on the specific error that typically loses each point.
