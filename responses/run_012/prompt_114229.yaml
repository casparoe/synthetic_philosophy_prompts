answer: |-
  ### Essay Question

  **Topic:** The Inefficacy Objection and Probabilistic Harm

  **Scenario:**
  Consider a manufacturing firm that emits a toxic pollutant in strict proportion to its sales volume. For every unit of product sold, one unit of pollutant is released. Epidemiological data confirms that these emissions raise the statistical risk of severe respiratory illness for nearby residents. However, the causal mechanism is non-threshold and continuous: each customer's purchase adds one unit of emissions, shifting each resident's risk by an imperceptible amount (e.g., from 0.500001% to 0.500002%). Crucially, stipulate that **no single purchase changes whether any specific resident actually falls ill.** The difference between a resident falling ill or remaining healthy is determined by the aggregate volume, not by any marginal unit.

  **Prompt:**
  In a well-structured essay, address the following:
  1.  **Causation:** In this specific scenario, does any individual customer cause the harm in a *difference-making* sense? Distinguish between causing the *outcome* (illness) and causing the *risk*.
  2.  **Responsibility:** Does your finding in (1) settle the question of individual moral responsibility? Explain why or why not.
  3.  **Principle of Obligation:** Propose a defensible principle of individual obligation that applies here. This principle must avoid two extremes: it cannot collapse into the claim that "only total outcomes matter" (ignoring individual agency), nor can it hold that individuals are responsible only for effects they could *possibly* influence (the inefficacy objection).

  ***

  ### Model Answer

  In the scenario described, the inefficacy objection relies on a rigid conception of causation that fails to account for probabilistic harm. To address the three components of the prompt, we must distinguish between deterministic outcomes and the imposition of risk, and subsequently ground responsibility in the normative significance of that risk rather than solely in its materialization.

  Regarding the first question, we must distinguish between *outcome-causation* and *risk-causation*. If causation is defined strictly as a counterfactual difference-maker regarding the specific outcome (i.e., "but for this purchase, the resident would not be ill"), then no individual customer causes the harm. The prompt stipulates that no single unit tips a resident from health to illness; the biological threshold is crossed only by the aggregate. However, this ignores the *ex ante* reality. Each purchase incrementally increases the probability of harm. Therefore, while no customer causes the *illness* in a deterministic difference-making sense, every customer causes an *increase in risk*. In a probabilistic framework, difference-making applies to the likelihood of the event, not just the event itself. To deny this is to deny the scientific reality of how toxicology functions in continuous exposure contexts.

  This finding does not settle the question of responsibility. Traditional consequentialism often ties responsibility to the actual good or bad produced. If we adhere strictly to the view that responsibility requires making a difference to the *outcome*, then customers are blameless. However, this leads to the "paradox of inefficacy," where collectively catastrophic harm generates zero individual blame. Responsibility should not be tethered exclusively to *ex post* results, which are often subject to moral luck. Instead, responsibility attaches to the *ex ante* choice to impose unjustifiable risks on others. Even if the harm does not materialize for a specific person due to the marginal nature of the contribution, the agent has still engaged in an action that objectively worsens the moral landscape by elevating the danger to which vulnerable populations are subjected. Thus, the lack of outcome-difference does not exonerate the agent because the moral wrong lies in the participation in a risk-imposing practice, not solely in the final tally of injuries.

  Consequently, a defensible principle of obligation must navigate between aggregative utilitarianism and strict individual inefficacy. It cannot simply claim "only total outcomes matter," because that dissolves individual agency into a collective blob, potentially justifying individual sacrifices that violate rights. Conversely, it cannot accept the inefficacy objection, which grants moral immunity to participants in harmful systems simply because their contribution is small.

  The principle should be formulated as follows: **An individual is obligated to refrain from participating in a collective practice when that participation imposes a non-negligible increase in unjustified risk on others, regardless of whether the participation deterministically causes a specific harm.**

  This principle satisfies the constraints. It respects individual agency by focusing on the specific act of purchasing (the risk imposition) rather than just the total pollution (the outcome). It avoids the inefficacy trap by acknowledging that increasing probability is a morally relevant difference. It does not demand that individuals control the total outcome, only that they control their own contribution to the risk profile. By focusing on *unjustified risk*, it allows for exceptions where the benefit outweighs the danger (e.g., essential medicines), but in the case of consumer goods where the risk is severe and the benefit trivial, the obligation holds. This preserves the link between agency and responsibility without requiring impossible causal power over collective thresholds.

  ***

  ### Marking Scheme (Total 20 Marks)

  | **Criteria** | **Marks** | **Specific Error That Loses the Point** |
  | :--- | :---: | :--- |
  | **1. Analysis of Causation (Risk vs. Outcome)**<br>Student distinguishes between causing the specific illness (no) and causing the risk increase (yes), utilizing probabilistic causation. | **5** | **Error:** Treating causation as purely deterministic and concluding the customer causes *nothing* because no threshold was crossed. |
  | **2. Decoupling Responsibility from Outcome**<br>Student argues that responsibility is not settled by outcome-causation, citing moral luck, complicity, or the normative weight of risk imposition. | **5** | **Error:** Asserting that "no difference to outcome" automatically entails "no moral responsibility" (accepting the inefficacy objection). |
  | **3. Formulation of the Principle**<br>Student proposes a specific principle (e.g., regarding unjustifiable risk or participation) that clearly assigns obligation to the individual agent. | **5** | **Error:** Proposing a threshold-based principle (e.g., "only buy if you tip the scale") which contradicts the scenario's stipulations. |
  | **4. Avoiding the Two Extremes**<br>Student demonstrates how their principle avoids pure aggregativism ("only totals matter") and strict individualism ("no influence = no duty"). | **5** | **Error:** Collapsing into act-utilitarianism where the individual is responsible for the *total* harm rather than their marginal contribution to risk. |
