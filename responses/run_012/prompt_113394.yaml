answer: |-
  The archive room smelled of lignin and dry rot, a scent Elias Thorne associated with permanence. On his desk lay the Box. It was a metal strongbox, grey and dented, containing the Founding Ledger of Port Harrow. Inside was the Account of the Collapse, dated November 14, 1924. It listed fourteen names. Beside each name was a date of birth, a payroll number, and a signature from the Coroner of the time. It was a document of ink and law. It could be amended, but only by a subsequent affidavit, filed in triplicate, explaining the error. In a century, there had been two amendments. Both were clerical corrections of spelling.

  Across the village, in the high-beamed hall of the Union House, Saoirse Niall was practicing. She stood before a row of empty chairs, her hands clasped behind her back. She was reciting the List. It began the same way as the Ledger: *On the fourteenth day of November, the pier gave way.* But where the Ledger stopped after fourteen names, Saoirse continued. She spoke the names of the wives who had been bringing dinner to the shift change. She spoke the names of the three boys who had been scavenging for copper wire beneath the planks. She spoke the name of the transient fisherman who had no payroll number and no next of kin. Her List held fifty-two names.

  The rule of the List was absolute, taught to every child who sat on the Union House floor: *A name may be added, and no name may ever be taken out.*

  For a hundred years, the Box and the Voice had existed in a fragile parallel. The Box was for the government, the banks, the courts. It was exact about what it was designed to record: liability and employment. It was silent about everything else. The Voice was for the village. It was inaccurate in one direction only; it erred on the side of inclusion. It could not shed a name, even if a descendant later proved an ancestor had been elsewhere that day. It ratcheted up. The Box ratcheted down, refined by bureaucracy into a hard, small diamond of fact.

  The pressure did not come from a quarrel between Elias and Saoirse. They were both intelligent, unsentimental people who understood the utility of the other's burden. Elias knew the Voice kept the peace; Saoirse knew the Box kept the lights on.

  The pressure came in a registered envelope from the National Heritage & Restitution Commission.

  The Commission was offering a significant grant for the preservation of the pier site, alongside a compensation scheme for the descendants of the victims. But the terms were strict. To qualify, the community must submit a single, Verified Roll of Casualties. The Commission would not arbitrate between conflicting local accounts. If the submitted roll contained names that could not be cross-referenced with contemporary employment records or civil registries, the entire claim would be flagged for fraud and rejected.

  Elias brought the letter to the Union House. It was late afternoon, the light failing over the water.

  "They want one list," Elias said, placing the paper on the table between them. "If we send the Box, we get the grant. The restoration saves the pier structure. The compensation goes to the fourteen families on the Ledger."

  "And the other thirty-eight?" Saoirse asked. Her voice was low, rough from the practice.

  "They remain in the Voice. The grant doesn't forbid the Recitation."

  "The grant requires an affidavit," Elias corrected. "Section 4, Paragraph B. *'The submitting authority certifies that the attached Roll is exhaustive and accurate to the best of historical knowledge.'* If I sign that, I am swearing under penalty of perjury that the fourteen names are the only names."

  Saoirse looked at the List she kept in her head. It was not written down. To write it would be to freeze it, and the Rule required it to be fluid, capable of absorbing the new dead as they joined the old. "If you sign that, the Voice becomes a lie."

  "If I don't, the pier crumbles. The grant pays for the structural reinforcement. Without it, the site is condemned. Safety hazard. They'll demolish it."

  "So we trade the thirty-eight for the wood?"

  "We trade the verification for the survival."

  Saoirse walked to the window. She watched the gulls circling the harbor. She knew what the Box was for. It was a shield against the outside world. It presented a version of Port Harrow that the outside world could process: a company town, a legal entity, a manageable risk. The Voice was for the inside. It held the truth of the messiness. The women *had* been there. The boys *had* been scavenging. That was true. But it was unrecorded. The Box did not record it because the women and boys were not assets. They were not false; they were invisible to the ledger's purpose.

  But the Commission did not care about purpose. They cared about liability. If they acknowledged the thirty-eight, they opened the door to thousands in compensation for unverified claims. If they acknowledged the fourteen, they closed the door.

  "What happens to the Rule?" Saoirse asked.

  "The Rule is local. The Commission is national."

  "The Rule says no name out. If we submit the Box, we are effectively striking thirty-eight names from the official history. We are taking them out."

  "We are not taking them out of the Hall. We are just not putting them on the form."

  "There is no difference," Saoirse said. "Once the Plaque goes up with only fourteen names, the thirty-eight become folklore. And folklore is something people can choose to believe or not. The Record is something they must accept."

  Elias rubbed his temples. He saw the structural engineers' report in his mind. The rot in the pilings was advanced. Without the grant, the pier would be closed within five years. The town would lose its docking rights. The economy would hollow out. He was the custodian of the File, and the File's job was to ensure the town continued to exist as a legal entity.

  "If we submit the Voice," Elias said, "they reject the claim. We get nothing. The pier falls. The town stagnates. The thirty-eight are remembered, but the place they died in disappears."

  "And if we submit the File?"

  "The place stands. The fourteen are compensated. The thirty-eight are... unverified."

  Saoirse turned from the window. "There is a boy," she said. "Thomas Keane. Drowned last week. Mending nets off the south breakwater."

  Elias nodded. He knew. The town always knew.

  "He belongs in the Voice," Saoirse said. "He died doing the work of the port."

  "He's not in the Box."

  "He will be in the Recitation this year. That is the Rule."

  Elias looked at the letter. "The Commission requires the Roll to be static. Finalized. If we submit the claim, we are declaring the event closed. No new names can be added to the Verified Roll."

  "So Thomas goes in the Voice, but not the Record."

  "Yes."

  "And next year? If another drowns?"

  "Same."

  Saoirse sat down. She understood the asymmetry. The File was designed to stop. It was a snapshot of liability at the moment of the accident. The Voice was designed to grow. It was a lineage of grief. To accept the grant was to force the Voice to stop growing, or to grow in the shadows, severed from the authority of the state.

  "If I agree," Saoirse said, "I have to change the Recitation."

  Elias looked up. "You said no name can be taken out."

  "I can't take a name out. But I can change the preamble. I have to tell them that the names after the fourteenth are not claims. They are prayers. I have to downgrade them."

  "You don't have to say that."

  "I do. Because if I don't, the children will ask why their compensation checks didn't come. I have to explain that the Voice is no longer a ledger. It is a eulogy."

  Elias picked up his pen. He needed to sign the affidavit by Friday. The structural integrity of the town depended on his signature. The moral integrity of the history depended on Saoirse's voice. They were both partly right. The pier needed to stand. The dead needed to be counted. They could not both be fully counted.

  "Will you do it?" Elias asked.

  Saoirse looked at her hands. They were old hands, knotted from work and cold. She thought of the thirty-eight. She thought of the woman who had died pulling a beam off her husband, a woman whose name was on the Voice but never on a payroll. She thought of Thomas Keane, wet and cold in the morgue, waiting to be added to the chain.

  "If I do this," Saoirse said, "the Rule breaks. Not the adding. The meaning. The Rule says a name is added to the Account. If the Account is only the Box, then the Voice is no longer an Account. It is a story."

  "I know."

  "And once it is a story, people can edit it. They will start to ask if the boys were really there. They will ask if the woman really died. Without the authority of the Record, the Voice is just opinion."

  Elias said nothing. He knew she was right. The File conferred reality. Without it, memory was fragile. But with it, memory was exclusive.

  "Sign it," Saoirse said.

  Elias signed.

  The ceremony was held in June. The stone Plaque was unveiled on the seawall. It was grey granite, stark and clean. It bore the fourteen names from the Box. The Commission's seal was at the bottom. The grant money was transferred. The scaffolding went up to reinforce the pilings.

  That November, the community gathered in the Union House. The hall was full. The air was thick with wool and expectation. Saoirse stood at the front. She looked at the faces. She saw the descendants of the fourteen, who held their heads high. She saw the descendants of the thirty-eight, who sat a little straighter, waiting for the validation of the Voice.

  Saoirse began. *On the fourteenth day of November, the pier gave way.*

  She spoke the fourteen names. Her voice was steady. Then she paused. The silence stretched. In the past, this was the moment where the Voice diverged from the File, where the community leaned in to hear the rest of the truth.

  "This year," Saoirse said, "we do not add."

  A murmur went through the room.

  "The Record is closed," she said. "For the sake of the pier, for the sake of the town, we have submitted the File. The names that follow the fourteen are not lost. But they are not on the Stone."

  She looked at the empty space where Thomas Keane's name would have hung in the air. He was the specific loss. He was the first name to be denied entry not because he was forgotten, but because he was inconvenient. He was true, but unrecorded. He was unverifiable, and therefore, in the eyes of the world that now owned their history, he was false.

  Saoirse finished the recitation with the original fourteen. She did not add Thomas. She did not add the woman. She did not add the boys.

  The Rule had not been broken technically; she had simply chosen not to exercise the option to add. But the room understood. The ratchet had slipped. The Voice was no longer growing to meet the future; it was retreating to match the past.

  When the meeting ended, Elias stood by the door. He watched the people leave. He saw the descendants of the thirty-eight walking out into the dark. They would not be compensated. Their grief would not be on the seawall.

  Saoirse came to the door. She did not look at Elias.

  "Thomas?" Elias asked quietly.

  "He is in the water," Saoirse said. "He is not in the Hall."

  "We saved the pier."

  "You saved the wood," she said. "We lost the count."

  She walked past him into the night. Elias locked the Union House. He walked back to the archive. He placed the signed affidavit in the Box, next to the Ledger. The Box clicked shut. It was secure. It was exact. It contained the truth that could be paid for.

  Outside, the wind came off the sea, cold and salt-heavy. It swept over the new stone Plaque, washing over the fourteen names. It swept over the water where Thomas Keane lay, and where the other thirty-eight had died. The wind did not distinguish between them. It moved through the rigging of the boats, making a sound like a voice trying to speak, but there was no one left to add the names, and the list, for the first time in a century, was full.
