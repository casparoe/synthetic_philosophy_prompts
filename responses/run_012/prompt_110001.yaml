      *   *Meaning 1: The Objective.* The loss function is cross-entropy on next tokens. (True by definition).
      *   *Meaning 2: The Mechanism.* At inference, the model calculates logits and samples. No internal search/planning happens. (Mostly true, but "search" can be learned).
      *   *Meaning 3: The Capabilities.* It can't do things that require planning/goals because it's only looking one step ahead. (False/Empirical bet).
      *   *Meaning 4: The Ontology.* It doesn't have internal states corresponding to "wants" or "beliefs," only statistical correlations. (Philosophical/Empirical).
      *   *Meaning 5: The Safety Implication.* It won't act instrumentally because it's not an agent. (Empirical bet).

  3.  **Drafting the Menu (Iterative Refinement):**

      *   *Claim 1 (The Tautology):* Training Objective.
