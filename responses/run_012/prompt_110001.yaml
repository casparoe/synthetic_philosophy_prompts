          *   Relevance: Doesn't rule out implicit lookahead.

      *   *Claim 3 (The Horizon Limit):* Myopic Optimization.
          *   Assertion: The model only cares about the immediate token, not long-term consequences.
          *   Category: (a) Training Objective / (b) Mechanism.
