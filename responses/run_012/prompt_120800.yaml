prompt: |-
  I teach a 75-minute graduate seminar on existential risk and AI governance, about 16 students. Design a runnable game that makes them feel the force of the unilateralist's curse in a precise form: many agents each receive a private, noisy but fairly reliable signal about whether a one-shot intervention is net-positive; each can unilaterally trigger the intervention without communicating; only the first trigger matters; and the intervention is beneficial if the underlying state is positive and catastrophic if it is negative. Calibrate the signal reliability and the no-money payoffs so that acting on a positive signal is individually justified on expected-value grounds, yet the group-level probability that at least one agent acts on a false positive rises sharply with the number of agents. Run a single-agent baseline and then at least two rounds with larger groups, recording outcomes on a board; keep the true state hidden until after each round. The game should let them discover through play that individual reliability does not aggregate into collective safety. Include setup, materials, timing, and a debrief that maps specific moments onto the curse and distinguishes it from the bystander effect and the volunteer's dilemma. The idea should emerge from the rules and incentives, not from a lecture. Also tell me what will predictably go wrong the first time I run it, how to handle that, and which feature of the curse the activity cannot reproduce, so I know what I must supply in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Context:** 75-minute graduate seminar on existential risk and AI governance.
      *   **Audience:** ~16 students.
      *   **Goal:** Design a runnable game to demonstrate the "Unilateralist's Curse" (Bostrom, Douglas, & Sandberg, 2016).
      *   **Core Mechanic:** Many agents, private noisy signals, one-shot intervention, first trigger wins, beneficial if state positive, catastrophic if state negative.
      *   **Calibration:** Individual EV > 0 for acting on positive signal, but Group Probability of False Positive Action $\uparrow$ with $N$.
      *   **Structure:** Single-agent baseline, then larger groups (at least two rounds). Record outcomes. Hide true state until end of round.
      *   **Pedagogy:** Discovery through play, not lecture. Debrief must distinguish from Bystander Effect/Volunteer's Dilemma.
      *   **Logistics:** Setup, materials, timing, debrief.
      *   **Meta-Analysis:** Predict failure modes, handling strategies, and limitations of the simulation.

  2.  **Deconstruct the Unilateralist's Curse:**
      *   *Definition:* A situation where an initiative that should not be undertaken (because it's net negative) is undertaken by at least one agent, even if every agent is rational and tries to do good, simply because there are many agents.
      *   *Key Tension:* Individual rationality vs. Collective rationality.
      *   *Math:* If $p$ is probability an individual acts (based on signal), probability *someone* acts is $1 - (1-p)^N$. If the action is harmful in the "bad state," the risk scales with $N$.
      *   *Differentiation:*
          *   *Bystander Effect:* Diffusion of responsibility (I don't act because others *should*).
          *   *Volunteer's Dilemma:* Someone *needs* to act, but everyone hopes someone else does (costly to volunteer).
          *   *Unilateralist's Curse:* Everyone *wants* to act if they think it's good, but the sheer number makes a mistake likely. It's an *over*-action problem, not an under-action problem.

  3.  **Game Design - "The Protocol":**
      *   **Theme:** AI Governance / Biosecurity (fits the seminar). Let's use "Deploying the Patch" vs. "The Vulnerability."
      *   **State:** World is either "Safe" (Action = Good) or "Fragile" (Action = Bad).
      *   **Signal:** Each student gets a card or digital message. "Green" (Go) or "Red" (Stop).
      *   **Reliability:** Needs to be high enough that an individual feels justified acting, but low enough that errors happen. Let's say 80% accurate.
      *   **Payoffs:**
          *   Safe State + Act = +10 points (Individual & Group).
          *   Safe State + No Act = 0 points.
          *   Fragile State + Act = -50 points (Catastrophe).
          *   Fragile State + No Act = 0 points.
      *   **Individual Calculation:** If I see Green, what is $P(\text{Safe} | \text{Green})$?
          *   Assume prior $P(\text{Safe}) = 0.5$.
          *   $P(\text{Green} | \text{Safe}) = 0.8$.
          *   $P(\text{Green} | \text{Fragile}) = 0.2$.
          *   $P(\text{Safe} | \text{Green}) = \frac{0.8 \times 0.5}{0.8 \times 0.5 + 0.2 \times 0.5} = \frac{0.4}{0.5} = 0.8$.
          *   EV(Act | Green) = $0.8(10) + 0.2(-50) = 8 - 10 = -2$. *Wait, this makes acting irrational individually.*
          *   *Correction:* I need Individual EV > 0.
          *   Let's adjust Payoffs. Catastrophe needs to be less severe *for the individual calculation* or Signal needs to be better.
          *   Actually, the Curse relies on the idea that the *individual* thinks it's worth it, but the *collective* risk is too high.
          *   Let's try Signal Accuracy = 90%.
          *   $P(\text{Safe} | \text{Green}) = 0.9$.
          *   EV(Act | Green) = $0.9(10) + 0.1(-50) = 9 - 5 = +4$. (Rational to act).
          *   Now Group Risk: If State is Fragile, prob *someone* gets a False Positive (Green) is $1 - (0.1)^N$. With $N=16$, $1 - 0.1^{16} \approx 1$. Someone *will* act.
          *   Wait, the curse is about the *decision to act*. If the state is Fragile, we want *no one* to act. But if 16 people get signals, and 10% error rate, roughly 1.6 people get "Green" in a Fragile world. They will act.
          *   So, in Fragile world, Group EV is negative. In Safe world, Group EV is positive (someone acts).
          *   The tension: Individuals act rationally based on their info, but the existence of many individuals makes the "Fragile" world outcome almost certain disaster.

      *   *Refining the Payoff for the Game:* To make it visceral, points should matter (grade bonus? candy? bragging rights?). Let's use a shared class pool. If catastrophe happens, everyone loses. If success, everyone gains. This aligns incentives to the "Collective" but the decision is "Individual."
      *   *Wait, standard Unilateralist Curse:* Agents care about the outcome, but they can't coordinate. If they all care about the collective outcome, they should apply the "corrective" (Bostrom et al.). The game needs to show why the *naive* approach fails.
      *   *Instruction:* "Maximize the total class score." (So they care about the group).
      *   *Constraint:* "You cannot talk. You must decide based *only* on your private signal."
      *   *Mechanism:* If *anyone* submits "Deploy," the action happens.
      *   *Calibration:*
          *   State: Safe (50%) or Fragile (50%).
          *   Signal: 85% accurate.
          *   Payoff: Safe+Act = +100 (Class Pool). Fragile+Act = -1000 (Class Pool). No Act = 0.
          *   Individual Logic (Naive): "I see Green. 85% chance Safe. EV = $0.85(100) + 0.15(-1000) = 85 - 150 = -65$."
          *   *Problem:* If the catastrophe is that big, even an individual shouldn't act. The Unilateralist's Curse usually assumes the individual *believes* the action is net positive.
          *   *Solution:* The individual must underestimate the probability of the bad state *conditional on being the one acting*, or the payoff structure must make individual action rational *ignoring the selection effect of others*.
          *   *Better approach for classroom:* Make the Individual EV positive *from their perspective* assuming they are the only decider.
          *   Let's set Payoff: Safe+Act = +100. Fragile+Act = -200.
          *   Signal: 90% accurate.
          *   Indiv EV (Green): $0.9(100) + 0.1(-200) = 90 - 20 = +70$. (Rational to act).
          *   Group Risk (Fragile State): Prob at least one False Positive with $N=16$. $1 - (0.1)^{16} \approx 100\%$.
          *   So in Fragile rounds, the class *will* lose big. In Safe rounds, they win.
          *   The lesson: Even though every agent is trying to help and acting rationally on their info, the Fragile rounds destroy the gains from Safe rounds.

  4.  **Drafting the Game Flow:**
      *   **Round 1 (Baseline):** 1 Volunteer. Rest observe. Shows individual rationality.
      *   **Round 2 (Small Group):** 4 Students.
      *   **Round 3 (Full Class):** 16 Students.
      *   **Materials:** Envelopes/Cards for signals. Scoreboard.
      *   **Timing:** 75 mins is tight. Need strict timekeeping.
          *   Intro/Rules: 15 min.
          *   Round 1: 10 min.
          *   Round 2: 15 min.
          *   Round 3: 15 min.
          *   Debrief: 20 min.

  5.  **Addressing "Predictably Go Wrong":**
      *   *Issue 1:* Students talk. (Solution: Strict silence rule, collect phones).
      *   *Issue 2:* Students try to be "too clever" and meta-game (e.g., "I won't act because I know others will"). This actually *solves* the curse, which ruins the demo.
          *   *Fix:* Instruct them: "You are an autonomous agent. You do not know how many others are deciding. You must decide based on your signal and the rules." Or, acknowledge this in debrief (this is the 'corrective').
          *   *Better Fix:* Tell them "You are one of many, but you don't know N." No, they need to know N to feel the curse.
          *   *Best Fix:* Instruct them: "Your goal is to maximize points. You cannot coordinate. Assume you are the only one who can act." (This isolates the individual rationality).
      *   *Issue 3:* Boredom/Confusion. Keep it simple.
      *   *Issue 4:* The "Catastrophe" isn't felt. Make the score visible. Start with 1000 points. Watch it drain.

  6.  **Addressing "What the Activity Cannot Reproduce":**
      *   The game simulates the *statistical* risk. It cannot simulate the *normative* weight of real existential risk (death vs. points).
      *   It cannot simulate the *difficulty of coordination* in the real world (the game forbids talk, real world allows talk but it's hard).
      *   It doesn't naturally lead to the Bostrom solution (norm of conformity) unless the debrief pushes it.

  7.  **Refining the Debrief:**
      *   Must distinguish from Bystander (inaction) and Volunteer's Dilemma (costly action). This is *Uncertain Action*.
      *   Highlight the math: $P(\text{Error})_{\text{group}} = 1 - (1-p)^N$.
      *   Discuss the "Corrective": Norms, coordination, epistemic humility.

  8.  **Final Polish of Mechanics:**
      *   Use a "Red/Green" card system.
      *   State determined by coin flip (hidden).
      *   If State = Safe (Heads): Action = +100.
      *   If State = Fragile (Tails): Action = -500.
      *   Signal Accuracy: 80% (easier to calculate mentally? No, 90% makes individual EV clearer). Let's stick to 90%.
      *   Individual EV: $0.9(100) + 0.1(-500) = 90 - 50 = +40$. (Positive).
      *   Group Risk (Fragile): $N=16$. Prob of at least one False Positive = $1 - 0.9^{16}$? No, False Positive rate is 10%. Prob = $1 - 0.9^{16}$ is prob of at least one True Positive in Safe.
      *   In Fragile State, Prob of False Positive per person = 0.1.
      *   Prob *someone* acts in Fragile State = $1 - (0.9)^{16} \approx 1 - 0.185 = 81.5\%$.
      *   So in Fragile rounds, 80% chance of catastrophe.
      *   Expected Value for Class (N=16):
          *   50% Safe: Someone acts (Prob $\approx 1$). Score +100.
          *   50% Fragile: Someone acts (Prob $\approx 0.8$). Score -500. No act (Prob $\approx 0.2$). Score 0.
          *   Total EV $\approx 0.5(100) + 0.5(0.8 \times -500) = 50 - 200 = -150$.
      *   So the *Class* loses points on average, even though *Individuals* act rationally. This is the perfect demonstration.

  9.  **Structuring the Output:**
      *   Title.
      *   Learning Objective.
      *   Materials.
      *   Setup & Calibration (The Math).
      *   Procedure (Round by Round).
      *   Debrief Guide (The Meat).
      *   Failure Modes & Limitations.

  10. **Self-Correction on "Individual Rationality":**
      *   In the Bostrom paper, the curse arises because agents act on their *own* assessment without adjusting for the fact that *others* are also assessing.
      *   If I tell students "Maximize Class Score," a smart student might think "If I act, I risk the class score."
      *   To make the curse work, I must frame the instruction as: "You are an independent agency. You want to do good. You don't know what others will do. Decide based on your signal."
      *   Actually, the most robust way is to tell them: "You receive a bonus for a successful intervention. You receive a penalty if you cause a catastrophe *and* you are the one who triggered it."
      *   *Wait, Unilateralist Curse is usually about shared outcomes.* "Only the first trigger matters."
      *   If I penalize only the trigger, it becomes a Volunteer's Dilemma variant.
      *   If I penalize everyone, it becomes a Commons Dilemma variant.
      *   The Curse is specific: Everyone shares the outcome, but decision is unilateral.
      *   *Instruction:* "We are simulating a world where you are independent organizations. You care about the world outcome (points), but you cannot talk. You must decide: Deploy or Wait."
      *   *Crucial:* To ensure they act on the signal, the individual incentive must align with acting on a positive signal.
      *   *Revised Payoff:*
          *   Class Pool starts at 0.
          *   Safe + Act: +100 to Pool.
          *   Fragile + Act: -500 to Pool.
          *   *Individual Bonus:* If you trigger a +100, you get +10 personal points. If you trigger a -500, you get -10 personal points.
          *   This ensures individual rationality aligns with "Act on Green."
          *   EV(Individual | Green) = $0.9(10) + 0.1(-10) = +8$. (Rational to act).
          *   Class EV (as calculated before) is Negative.
          *   This creates the tension: Individual rationality vs. Collective disaster.

  11. **Final Review against Constraints:**
      *   75 mins? Yes, tight but doable.
      *   16 students? Yes.
      *   Single agent baseline? Yes.
      *   Two rounds larger groups? Yes (4 and 16).
      *   Debrief distinctions? Yes.
      *   Failure modes? Yes.

  12. **Writing the Response:** (Drafting content with clear headings, bold text for emphasis, and specific scripts for the instructor). *Self-Correction during drafting:* Ensure the signal distribution is physically easy to manage. Pre-printed envelopes are best.

      *   *Math Check:*
          *   Prior: 50/50 Safe/Fragile.
          *   Signal Accuracy: 90%.
          *   P(Safe|Green) = 90%.
          *   Indiv Payoff: +10 / -10. EV = +8.
          *   Class Payoff: +100 / -500.
          *   Class EV (N=1): $0.5(0.9 \times 100) + 0.5(0.1 \times -500) = 45 - 25 = +20$. (Good for N=1).
          *   Class EV (N=16):
              *   Safe (50%): Prob someone acts $\approx 100\%$. Gain 100.
              *   Fragile (50%): Prob someone acts $= 1 - 0.9^{16} \approx 81\%$. Loss 500.
              *   Total: $0.5(100) + 0.5(0.81 \times -500) = 50 - 202.5 = -152.5$.
          *   This works perfectly. N=1 is net positive. N=16 is net negative.

      *   *Wait, one nuance:* In the Fragile state, the signal is "Green" (False Positive) 10% of the time.
      *   So in Fragile state, prob of *not* acting is 0.9 per person.
      *   Prob *someone* acts = $1 - 0.9^{16}$. Correct.
      *   In Safe state, signal is "Green" (True Positive) 90% of the time.
      *   Prob *someone* acts = $1 - 0.1^{16} \approx 100\%$. Correct.

      *   *Wait, one more nuance:* If *no one* acts, score is 0.
      *   So Safe State EV: $1.0 \times 100 = 100$.
      *   Fragile State EV: $0.81 \times -500 + 0.19 \times 0 = -405$.
      *   Average: $(100 - 405) / 2 = -152.5$.
      *   Baseline (N=1):
      *   Safe: $0.9 \times 100 = 90$.
      *   Fragile: $0.1 \times -500 = -50$.
      *   Average: $(90 - 50) / 2 = +20$.
      *   Perfect. The transition from Positive EV to Negative EV as N scales is the core insight.

      *   *Logistics:* Need to ensure they decide simultaneously. Use a "3-2-1 Reveal" or sealed envelopes. Sealed envelopes with "ACT" or "WAIT" written inside is best to prevent reaction to others.

      *   *Debrief:* Need to explicitly mention Bostrom et al. (2016).

      *   *Failure Mode:* Students colluding. "Let's all wait."
      *   *Counter:* "In this round, communication is strictly prohibited. In the real world, coordination costs exist." Or run a round where they *can* talk to show the solution. (Maybe too complex for 75 mins). Stick to prohibiting talk to isolate the curse.

      *   *Limitation:* The game assumes identical priors and signal reliability. Real world is messier. Also, the game forces a decision. Real world allows "seek more info." I need to mention this in limitations.

      *   *Timing:* 75 mins is very tight for 3 rounds + debrief.
      *   Intro: 10 min.
      *   Round 1 (N=1): 5 min.
      *   Round 2 (N=4): 10 min.
      *   Round 3 (N=16): 15 min.
      *   Debrief: 35 min.
      *   This is safer. Cut the N=4 round if needed, but N=1 -> N=16 is a big jump. N=4 helps show the curve. I'll keep N=4 but keep it snappy.

      *   *Wait, N=1 Baseline:* Need a volunteer.
      *   *Materials:* Envelopes. 16 per round.
      *   *State:* Flip coin once per round.
      *   *Signals:* Pre-pack envelopes based on State.
      *   If Safe: 90% Green, 10% Red.
      *   If Fragile: 10% Green, 90% Red.
      *   Instructor needs to prep this quickly or have pre-made decks. Pre-made decks for "Safe Scenario" and "Fragile Scenario" are better.
      *   Deck A (Safe): 14 Green, 2 Red (for N=16).
      *   Deck B (Fragile): 2 Green, 14 Red (for N=16).
      *   For N=4, use subset. For N=1, use 1.
      *   Actually, easier: Just have a bag of chips.
      *   Safe Bag: 9 Green, 1 Red.
      *   Fragile Bag: 1 Green, 9 Red.
      *   Draw with replacement? No, without replacement for the specific N.
      *   Best: Pre-prepared envelopes labeled 1-16. Inside is the signal.
      *   Have two sets of 16 envelopes: Set "World A" and Set "World B".
      *   Flip coin to decide which Set to use.
      *   This ensures exact probabilities.

      *   Okay, ready to write.
answer: |-
  # Game Design: "The Unilateral Protocol"

  **Learning Objective:** Students will experientially discover that when many independent agents act on reliable private information to do good, the collective probability of a catastrophic error can approach certainty, even when every individual decision is rational.

  **Time:** 75 Minutes
  **Class Size:** 16 Students
  **Materials:**
  *   32 Envelopes (pre-prepared, see Setup).
  *   2 Large Signs: "SAFE WORLD" / "FRAGILE WORLD" (kept hidden).
  *   Whiteboard/Projector for Scorekeeping.
  *   Timer.
  *   Small incentives (candy, extra credit points, or just "Class Reputation Points").

  ---

  ## 1. Setup & Calibration (Instructor Prep)

  The math must ensure **Individual Rationality** (Acting on a "Go" signal has positive Expected Value) but **Collective Ruin** (With $N=16$, the class loses points on average).

  **The World State (Hidden):**
  *   **Safe (50% chance):** Intervention yields **+100 Class Points**.
  *   **Fragile (50% chance):** Intervention yields **-500 Class Points**.
  *   **No Intervention:** 0 Points.

  **The Signal (Private):**
  *   Students draw a slip from an envelope: **GREEN (Deploy)** or **RED (Wait)**.
  *   **Reliability:** 90% Accurate.
      *   If **Safe**: 90% Green, 10% Red.
      *   If **Fragile**: 10% Green, 90% Red.

  **The Incentives:**
  *   **Class Pool:** Starts at 0. Tracks collective outcome.
  *   **Individual Bonus:** If you are the *first* to trigger "Deploy":
      *   Success (Safe): **+10 Personal Points**.
      *   Failure (Fragile): **-10 Personal Points**.
      *   *Why?* This ensures individual EV for acting on Green is positive ($0.9 \times 10 + 0.1 \times -10 = +8$), motivating them to act despite the collective risk.

  **Preparation:**
  Create two decks of 16 envelopes each.
  *   **Deck A (Safe):** 14 Green slips, 2 Red slips (approx 90%).
  *   **Deck B (Fragile):** 2 Green slips, 14 Red slips (approx 10%).
  *   *Note:* For Round 1 (N=1) and Round 2 (N=4), use a subset of the deck or prepare smaller specific decks to maintain ratios.

  ---

  ## 2. Game Procedure (55 Minutes)

  ### Introduction (10 mins)
  1.  **Context:** "We are independent AI labs. We have a chance to deploy a powerful optimization patch. It might save the world, or it might break it."
  2.  **Rules:**
      *   "You will receive a private signal (Green/Red)."
      *   "You cannot communicate."
      *   "If *anyone* submits 'DEPLOY', the action happens immediately. Only the first submission counts."
      *   "If no one submits, nothing happens."
      *   "Goal: Maximize your personal points, but note the Class Pool on the board. We want the Class Pool to survive."
  3.  **Decision Mechanism:** Students write "DEPLOY" or "WAIT" on a card, seal it in an envelope. Instructor collects all, then reveals. (This prevents "first mover" speed races and ensures simultaneous decision-making).

  ### Round 1: The Baseline (N=1) (5 mins)
  1.  Ask for **one volunteer**. The rest observe.
  2.  Flip a coin to determine World State (Safe/Fragile). Select the corresponding Deck.
  3.  Volunteer draws 1 envelope.
  4.  **Decision:** They decide privately.
  5.  **Reveal:** Open envelope. Reveal World State. Update Scoreboard.
  6.  **Ask:** "Was the decision rational?" (Usually yes). "Did the class gain or lose?"

  ### Round 2: Small Group (N=4) (15 mins)
  1.  Select 4 students.
  2.  **Crucial Instruction:** "You do not know what signal others received. You cannot coordinate. Decide based *only* on your slip and the rules."
  3.  Flip coin, select Deck (subset of 4), distribute envelopes.
  4.  **Decision:** 2 minutes silent thought. Write decision. Seal.
  5.  **Reveal:** Open all. If any "DEPLOY", reveal State. Update Scoreboard.
  6.  **Record:** Write $N=4$, State, Action Taken, Outcome on board.

  ### Round 3: Full Class (N=16) (15 mins)
  1.  All 16 students participate.
  2.  **Instruction:** "Same rules. The stakes are the same. You are still rational agents."
  3.  Flip coin, select Full Deck, distribute.
  4.  **Decision:** 3 minutes silent thought. (Tension will be higher).
  5.  **Reveal:** Collect all. Check for any "DEPLOY".
  6.  **Outcome:** Reveal State. Update Scoreboard.
  7.  **Record:** Write $N=16$, State, Action, Outcome.

  ### Transition to Debrief (10 mins)
  *   Tally the final Class Pool.
  *   Likely outcome: Round 1 & 2 were mixed/positive. Round 3 likely resulted in a Catastrophe if the state was Fragile, or a narrow win if Safe.
  *   Ask: "Why did the Class Pool trend negative as N increased, even though everyone was trying to be rational?"

  ---

  ## 3. Debrief Guide (20 Minutes)

  Do not lecture immediately. Let them speak first.

  **Phase 1: Phenomenology (5 mins)**
  *   "Raise your hand if you got a Green signal in Round 3." (Count them).
  *   "Raise your hand if you got Green but voted WAIT." (This reveals if they intuitively corrected for the curse).
  *   "How did it feel to hold a Green signal in Round 3 compared to Round 1?"

  **Phase 2: The Math of the Curse (5 mins)**
  *   Draw the probability tree on the board.
  *   **Individual Logic:** $P(\text{Safe}|\text{Green}) = 90\%$. EV(Act) > 0. Rational to act.
  *   **Collective Logic (Fragile State):**
      *   Prob one person errs = 10%.
      *   Prob *no one* errs = $0.9^{16} \approx 18.5\%$.
      *   Prob *someone* errs (Catastrophe) = $81.5\%$.
  *   **Point out:** "In Round 1, the risk was 10%. In Round 3, the risk was 81%. The *action* didn't change, but the *context* did."

  **Phase 3: Distinguishing Concepts (5 mins)**
  *   **Vs. Bystander Effect:** "In the Bystander Effect, no one acts because everyone thinks someone else *will*. Here, the risk is that someone *does* act. This is an over-action problem, not an under-action problem."
  *   **Vs. Volunteer's Dilemma:** "In a Volunteer's Dilemma, someone *must* act to save the group, but it's costly. Here, in the Fragile state, *no one* should act. The 'volunteer' is the villain."
  *   **The Unilateralist's Curse:** "This is specifically about **epistemic independence**. You assumed your signal was the only data that mattered. You failed to condition on the fact that *if the world is Fragile, it is highly likely someone else also saw Green*."

  **Phase 4: Governance Implications (5 mins)**
  *   "How do we fix this in AI governance?"
  *   Elicit solutions: Coordination, norms of conformity, information sharing, third-party audit.
  *   Reference: Bostrom, Douglas, & Sandberg (2016). "The Unilateralist's Curse."
  *   **Key Takeaway:** "When stakes are high and actors are numerous, individual rationality is insufficient. We need structural constraints."

  ---

  ## 4. Predictable Failure Modes & Fixes

  | Failure Mode | Why it Happens | How to Handle |
  | :--- | :--- | :--- |
  | **Collusion** | Students whisper: "Let's all wait to be safe." | **Prevention:** Enforce strict silence. Confiscate phones. <br>**Recovery:** If they succeed, acknowledge it: "You solved the curse by coordinating. In the real world, coordination is costly or impossible (e.g., rogue states). We will run a 'No Talk' round to see the raw risk." |
  | **Meta-Gaming** | Students think: "I know others will act, so I won't." | **Instruction:** Explicitly tell them: "You are an autonomous agency. You do not know $N$ (number of deciders) for sure, or you must act as if your decision is pivotal." <br>**Debrief:** If they *do* meta-game, praise it! "This is the 'Corrective' Bostrom suggests. But notice how hard it was to trust others to do the same." |
  | **Boredom/Confusion** | Payoff structure is too complex. | **Simplify:** Use a projected counter. +100 / -500. Keep personal points secondary to the "Class Survival" narrative. |
  | **Round 3 "Safe" Win** | Coin flip lands Safe; they Deploy; Class wins. | **Pivot:** "You got lucky. Let's look at the *Expected Value*. If we ran this 100 times, the Class Pool would be deeply negative. Existential risk is about the one run where we lose." |

  ---

  ## 5. Limitations (What You Must Supply in Debrief)

  This simulation is a model, not reality. You must explicitly state what it **cannot** reproduce:

  1.  **The "Seek More Info" Option:** In the game, they must Act or Wait. In reality, agents can delay to gather more data. The Curse applies most strongly when time pressure forces a one-shot decision.
  2.  **Heterogeneity:** In the game, all signals are 90% reliable. In reality, some actors are reckless (higher false positive rate) and some are cautious. The reckless actors drive the curse disproportionately.
  3.  **Normative Weight:** Losing "Class Points" is not an existential catastrophe. The emotional weight of real x-risk is hard to simulate without inducing paralysis.
  4.  **The Solution:** The game demonstrates the *problem*. It does not automatically generate the *solution* (normative conformity). You must explicitly teach the Bostrom et al. proposal: *Agents should adopt a norm of not acting on their own judgment alone when they suspect other rational agents are assessing the same initiative.*

  ## 6. Instructor Script Snippet (The "Aha" Moment)

  > "Look at the board. In Round 1, your individual judgment served the group. In Round 3, your individual judgment nearly destroyed the group. Nothing changed about *you*. Nothing changed about your *signal*. The only variable that changed was $N$.
  >
  > This is the Unilateralist's Curse. It is not a tragedy of the commons where we greedily over-consume. It is a tragedy of *epistemic independence*. We all tried to do the right thing, individually, and collectively we walked off a cliff.
  >
  > If you leave this seminar with one thing: When the stakes are existential, and the number of capable actors is growing, 'doing what you think is right' is not a sufficient governance strategy."
