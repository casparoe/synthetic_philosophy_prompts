answer: |-
  The generator hummed outside, a steady drone against the night insects. Ines poured two glasses of wine, setting one down hard beside Rafe's notebook.

  'You're treating the junction like a switch,' Ines said. 'But the blight-salt doesn't block the path. The ants walk over it. Their legs work. Their antennae smell nothing different. Yet the colony refuses the short route. It remembers the salt as a barrier long after the chemical logic should have faded. That junction is a memory trace.'

  Rafe didn't touch the glass. 'It's a physical alteration, Ines. You paint a wall pink, the colony avoids the wall. Is the paint a memory? The salt changes the friction coefficient or the micro-topography. The ants respond to the immediate physics. There is no representation of "past" there, only a reaction to "now".'

  'No ant experiences the "now" of the whole route,' Ines countered. 'An individual lives weeks. The route persists for years. Ninety per cent of the workers who built the arches are dead before the arch holds weight. No single ant has ever walked from nest to food and back knowing the whole distance. The knowledge isn't in the head of the walker. It's in the structure of the trail. The colony knows the way because the path exists, not because a brain holds a map.'

  'That's a category error. A river knows the sea because gravity pulls it down. We don't call the river cognitive. You're conflating stability with thought. If I carve a groove in wood and roll a ball, the ball "remembers" the groove. Is the wood thinking?' Rafe leaned forward. 'And consider the wasp. When the parasite lays in the colony, the foraging shifts. The ants serve the wasp's larvae, not the colony's growth. Is that the colony's purpose or the wasp's? If the colony thinks, whose thought is it?'

  Ines paused, tracing the rim of her glass. 'The wasp hijacks the mechanism. I'll grant you that. It complicates the notion of a singular purpose. But the system remains competent. It still routes, still builds, still adapts. The wasp uses the colony's cognition; it doesn't replace it. Like a virus using a cell's machinery to replicate. The cell is still alive.'

  'A virus doesn't decide to replicate,' Rafe said. 'It's chemistry. If the wasp drives the behaviour, then the colony is merely the substrate. You can't claim the colony is the thinker if it can be remotely piloted by a guest. It suggests the "mind" is wherever the reproductive interest lies, and currently, that's the wasp.'

  'Then cut the nest,' Ines said sharply. 'We severed the trail joining the two halves. Each half functioned as a complete colony. They foraged, defended, bred. When we restored the trail, they reconciled into one unit without conflict. Two minds became one. If cognition requires a specific architecture, where did the mind go when the bridge was cut? It didn't vanish. It duplicated.'

  Rafe rubbed his temple. 'Alright. Functional unity is distributed. I'll concede that the cognitive load isn't centralised. The split shows resilience, not necessarily dual consciousness. But it proves nothing about memory. It just shows the network is redundant. You still haven't explained the queen.'

  'The queen died in chapter—' Ines stopped herself. 'The queen died six weeks ago. Behaviour degraded slowly. Not instantly. Then we introduced a replacement unrelated by blood. The colony stabilised. If the queen were the brain, death would be immediate lobotomy. If the colony were nothing, the replacement wouldn't matter. The continuity survived the loss of the reproductive centre.'

  'Survived how?' Rafe pressed. 'The behaviour degraded. Something broke. The replacement fixed it, yes, but that implies the colony requires a specific chemical signature to maintain cohesion. That's not memory; that's hormonal regulation. You're describing a homeostat, not a historian. The blight-salt isn't a memory of a bad path; it's a disruption of the pheromone homeostasis. When you rinsed it, you reset the chemical balance. That's not recall; that's maintenance.'

  Ines stood up, walking to the window where the dark mound of the nest was barely visible. 'Maintenance is a form of memory. To maintain a state against entropy requires information about what that state should be. The colony holds a model of itself. When the salt interferes, the model mismatches the reality. When you rinse it, the model fits again. You say it's just chemistry. I say the chemistry is the medium, not the message.'

  'But where is the message?' Rafe's voice was quieter now. 'If I erase the salt, the ants walk. If I erase the ants, the salt remains. Which one holds the route? If the ants are replaced every few weeks, the "memory" must be in the trail itself. But the trail is just dirt and pheromone. Dirt doesn't think.'

  'The pattern thinks,' Ines said. 'The relationship between the ants and the dirt. You want a skull to point to. There isn't one. There's only the work.'

  'Then show me the work that isn't just reaction,' Rafe said. 'Show me a decision that wasn't forced by physics.'

  'The reroute,' Ines said. 'When the blockage happened, they didn't scramble. They flowed. Instantly. No trial and error. They knew the alternative existed before they found it.'

  'They followed the strongest gradient,' Rafe said. 'That's physics.'

  'They created the gradient,' Ines said. 'Before the blockage.'

  Rafe looked at his notebook, then closed it. 'We're arguing about the word "know".'

  'No,' Ines said. 'We're arguing about where the light is.'

  'Then turn it on,' Rafe said.

