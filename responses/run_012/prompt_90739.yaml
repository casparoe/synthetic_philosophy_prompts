      *   *Foreseeability:* It's not merely informed consent, but whether the harm flows from a voluntary assumption of risk compared to the baseline.
      *   *Closing:* The theory requires judgment, but judgment isn't arbitrariness.

      *Draft:*
      You raise a formidable challenge regarding the individuation of actions, one that strikes at the heart of how we attribute responsibility. However, the dilemma you present is false. The relevant level of description is not fixed by an external principle alien to luck egalitarianism, nor merely by foreseeability, but by the nexus of control and differential risk. We do not hold agents responsible for 'driving' simpliciter, but for specific voluntary adjustments to their safety profile within that activity. The seatbelt choice is morally salient because it represents a specific locus of control where the agent could have altered the probability of harm without abstaining from the activity entirely. This isn't arbitrary; it tracks where the agent's will actually intervened to change the outcome. While drawing this line requires practical judgment, and borderline cases will exist, this does not render the distinction unworkable any more than the vagueness of 'heap' renders counting impossible. The theory demands we isolate the specific choice that converted a safe situation into a risky one, rather than accepting the broadest possible description of the activity. Thus, luck egalitarianism remains the substantive ground for judgment, not merely a placeholder for consent.

