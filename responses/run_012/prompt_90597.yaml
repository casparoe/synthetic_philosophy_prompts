      *   *Hypothesis 4: Epistemic vs. Ontological.* The "biggest moral fact" feeling is intellectual, but the "gut call" is evolutionary/psychological.

  3.  **Evaluate the "Discounting" Idea:**
      *   User suggests rounding small probabilities to zero.
      *   *Risk:* This is the "Pascal's Mugging" avoidance strategy. If we ignore small probabilities of huge stakes, we miss existential risks. But in ethics, ignoring tiny moral weights for huge numbers feels like speciesism or arbitrariness.
      *   *Better Approach:* Non-linear scaling of moral weight.

  4.  **Develop a Reconciling Framework:**
      *   *Idea:* **Moral Weight is not just Expected Sentience.** It involves *intensity* and *complexity* of experience.
      *   *Refinement:* The "Capacity for Suffering" ($C$) factor is doing the heavy lifting. If a chicken's $C$ is $1,000,000\times$ an ant's $C$, then $10^9$ chickens > $10^{15}$ ants.
      *   *Is that plausible?* Neurologically, maybe. A lobster has a more complex nervous system than a beetle. A chicken more than a lobster.
