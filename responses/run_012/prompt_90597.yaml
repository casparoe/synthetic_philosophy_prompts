      *   $W = N \times P(S) \times C$ (Number $\times$ Probability of Sentience $\times$ Capacity for Suffering).
      *   *The User's Issue:* If $N$ is huge ($10^{18}$), even tiny $P(S)$ and $C$ yield a huge $W$.
      *   *The Disconnect:* Why does $10^{15}$ sentient insects feel less important than a billion chickens?
      *   *Hypothesis 1: Capacity ($C$) is not linear.* A chicken's capacity for suffering might be 10,000x an ant's, not just 2x.
      *   *Hypothesis 2: Probability ($P$) isn't independent.* Maybe our uncertainty isn't just "0.1% chance they are full humans," but "0.1% of the *moral weight* of a human."
