  # Decision Tree: The Timing of Conscious Experience (Color Phi)

  **Instructions:** Begin at Node 1. Answer each question based on your theoretical commitments regarding the Color Phi phenomenon (two flashed dots reported as one moving dot changing color mid-stream). Follow the path to a leaf.

  ### Branch Nodes

  **Node 1:** Does the subject's report reflect a genuine sensory experience of motion and color change, or is it a post-hoc narrative confabulation about two static flashes?
  *   **Confabulation:** Go to Leaf 1.
  *   **Genuine Experience:** Go to Node 2.

  **Node 2:** Is the reported "color change" constituted by the sensory phenomenology itself, or is it a metacognitive judgment imposed on static sensory snapshots?
  *   **Metacognitive Judgment:** Go to Leaf 2.
  *   **Sensory Phenomenology:** Go to Node 3.

  **Node 3:** Is there a determinate fact about *when* the experience occurs that is independent of the subject's capacity to report it or the neural correlates identified?
  *   **No Fact of the Matter:** Go to Leaf 3.
  *   **Fact of the Matter:** Go to Node 4.

  **Node 4:** Is the neural content fixing the experience finalized *prior* to the registration of the second dot, or does it require information from the second dot?
  *   **Prior to 2nd Dot:** Go to Leaf 4.
  *   **Requires 2nd Dot:** Go to Node 5.

  **Node 5:** Does the use of the second dot's information involve overwriting a previously established faithful memory trace of the first dot?
  *   **Yes (Overwrite):** Go to Node 6.
  *   **No (No Faithful Trace):** Go to Node 7.

  **Node 6:** In this overwriting process, is the overwritten faithful trace accessible to any subsystem (e.g., for unconscious priming)?
  *   **Yes (Accessible):** Go to Leaf 5.
  *   **No (Inaccessible):** Go to Leaf 6.

  **Node 7:** Can neural data (e.g., latency in cutaneous rabbit or flash-lag variants) in principle distinguish this view from the Corrective Orwellian view?
  *   **Yes (Distinguishable):** Go to Leaf 7.
  *   **No (Indistinguishable):** Go to Leaf 8.

  ---

  ### Leaves (Positions)

  **Leaf 1: Direct-Realist Confabulation**
  *   **Awkward Commitment:** Requires that subjects are systematically deluded about the very content of their own conscious experience, reporting motion where there is none.

  **Leaf 2: Metacognitive Judgment**
  *   **Awkward Commitment:** Denies the sensory phenomenology it aims to explain, reducing the "illusion" to a cognitive error rather than a perceptual one.

  **Leaf 3: Deflationary Indeterminacy**
  *   **Awkward Commitment:** Dissolves the hard problem of timing by asserting that the question "when did it happen?" has no answer independent of verification.

  **Leaf 4: Stalinesque Delay**
  *   **Awkward Commitment:** Requires implausibly long neural transmission delays or a "waiting room" in the brain to hold consciousness until the story is complete.

  **Leaf 5: Unoccupied (Accessible Overwrite)**
  *   **Diagnosis:** Incoherent; if a faithful trace is accessible for priming, the revision is not Orwellian (memory falsification) but merely a dissociation between access and phenomenology.

  **Leaf 6: Corrective Orwellianism**
  *   **Awkward Commitment:** Implies a homuncular mechanism that reads a faithful memory trace and actively rewrites it with false content.

  **Leaf 7: Pre-emptive Orwellianism (Distinguishable)**
  *   **Awkward Commitment:** Commits to the existence of specific neural markers for "falsified from start" traces that current physics may not permit us to isolate.
  *   **Data Note:** Color Phi data *could* distinguish this if neural latency for the first dot's consolidation is found to exceed the inter-stimulus interval.

  **Leaf 8: Pre-emptive Orwellianism (Indistinguishable)**
  *   **Awkward Commitment:** Posits a fact of the matter (pre-emptive vs. corrective) that is causally inert and empirically undetectable.
  *   **Flag:** **Leaf 7 and Leaf 8 are empirically equivalent.** If Node 7 is answered "No," no question in this tree can separate these leaves; they differ only in metaphysical description of the unobservable trace.

  ---

  ### Map Confidence & Doubt

  **Overall Confidence:** High. The logical space is tightly constrained by the definitions of "experience," "memory," and "report." The tree successfully isolates the major historical positions (Dennett's Orwellian/Stalinesque, Direct Realism, Deflationism) without relying on author names.

  **Least Certain Branch:** **Node 7 (Pre-emptive Distinguishability).**
  **Reason for Doubt:** It is unclear whether the distinction between a "falsified trace laid down immediately" (Pre-emptive) and a "faithful trace overwritten instantly" (Corrective) is a genuine physical difference or merely a descriptive one. If the overwrite is instantaneous, the physical state of the brain at $t+1$ is identical in both cases, rendering Node 7's question potentially meaningless. I have retained it to satisfy the request for the Pre-emptive/Corrective split, but students should treat Leaf 7 and Leaf 8 as a single "Pre-emptive/Corrective Equivalence" class if they reject the possibility of instantaneous overwriting detection.
