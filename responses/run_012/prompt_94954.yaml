      *   *Clarification on "Unique NE":* The user thinks unique NE implies the NE is the only rationalizable outcome. This is true for *strict* dominance solvable games. But not for games like Matching Pennies where no pure strategy is dominated. I need to make sure I distinguish between "Iterated Deletion of *Strictly* Dominated Strategies" (IDSDS) and "Iterated Deletion of *Never* Best Responses" (IDNBR). In 2-player games, they are equivalent. In the user's game, nothing is dominated. So nothing is deleted.
