  **The Gentle Reduction**
  *Subtracting pain, one breath at a time.*

  Welcome back to our quiet corner. Here we measure progress not in gains, but in subtractions. We track the Suffering-Adjusted Life-Year, or SALY. One SALY is one year lived at the peak of agony; lesser pains count as fractions. Frequently, a reader asks what coefficient converts pleasure into SALYs. I supply none. To give a number would concede they are commensurable. They are not. Joy is merely a temporary analgesic, never a currency. We seek to minimize the negative sum, not maximize the positive.

  **Dear Columnist,**
  **My husband and I are trying for a second child. Our first is happy. Relatives say stopping is selfish; friends say growing the family is life-affirming. I want to do the right thing.**
  **— Hopeful in Hertfordshire, 34**

