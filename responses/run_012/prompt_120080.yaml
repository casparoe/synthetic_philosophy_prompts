          To: Nosology Review Panel Chair
          From: Staff Ethicist
          Re: Vote on "Scripted Dysphoria"

          **Recommendation:** Include "scripted dysphoria" as a provisional condition for further study, subject to a mandatory five-year review. Do not grant full diagnostic status at this time.

          **Reasoning:**
          We face a unique ontological hazard. Standard validation assumes the phenomenon exists independently of our classification. Here, the classification *is* part of the phenomenon. The online script provides the taxonomy patients use to understand themselves. By codifying this script, we do not merely describe a population; we intervene in it.

          Our field trials validated reliability, not static validity. We confirmed clinicians can agree on the label, not that the label captures a fixed natural kind. If classifying the population alters the population—the looping effect—then our evidence confirms only that the category is currently intelligible, not that it is stable. For self-modifying categories, the evidentiary bar must shift from reproducibility to ethical consequence. We must ask: does this classification reduce suffering or amplify the script's grip?

          Provisional inclusion acknowledges the genuine distress and impairment reported in trials without reifying the online script as biological truth. It grants clinicians coding access for treatment and insurance while signaling epistemic humility. The five-year review forces us to measure whether the diagnosis stabilized the condition or accelerated its spread through feedback loops.

          **The Strongest Case for Exclusion:**
          The member arguing for "culture-bound syndrome" or exclusion raises the critical concern of iatrogenic reification. By granting this full status, we risk validating the online community's narrative as medical fact, potentially encouraging further immersion and symptom enactment. Exclusion protects the manual's authority from transient digital subcultures and avoids becoming a tool for the very scripting mechanism we aim to treat. There is merit in refusing to certify a condition whose primary vector is the search for diagnosis itself.

          **Conclusion:**
          However, exclusion abandons sufferers to unmanaged impairment. Provisional status strikes the necessary ethical balance: it permits care without cementing the loop. We must monitor whether our naming heals or harvests.

