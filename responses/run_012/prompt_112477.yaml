answer: |-
  **MEMORANDUM**

  **TO:** Remembrance and Collections Committee
  **FROM:** The Chair
  **DATE:** 24 May 2024
  **SUBJECT:** Allocation of Ring-Fenced Funding: Strategic Recommendation

  **1. Purpose**

  At our forthcoming meeting, we are required to commit the trust's ring-fenced sum to one of two competing proposals. This decision carries profound ethical weight, touching upon the dignity of the deceased, the wishes of living survivors, and the long-term stewardship of the archive. This memo outlines my recommendation, engages with the theoretical interventions circulated by committee members, and sets out a proposed timeframe for implementation.

  **2. The Proposals**

  We are presented with a binary choice:
  *   **Proposal A (Survivors' Association):** A permanent public exhibition accompanied by a schools programme.
  *   **Proposal B (Director):** Thirty years of restricted access to the most graphic recordings, with funding redirected to bursaries for descendants.

  **3. Engagement with Committee Interventions**

  Before weighing the proposals, we must address the theoretical frameworks raised in your circulated notes, as they fundamentally alter how we view 'access' and 'duty'.

  Regarding the first note on archival neutrality: we must accept that an archive is not a passive vessel. As noted, silences are produced at four points: the making of facts, their assembly, their retrieval, and the assignment of significance. An embargo is not a mere omission; it is an active intervention at the point of retrieval. The critical question is standing. Given that one-fifth of our recordings were given under terms of anonymity and many narrators are now deceased, their families have rightly claimed a stake. In the absence of explicit consent for public display from the next of kin, the Trust holds the standing—and indeed the fiduciary duty—to intervene. To expose these materials without clear consent would be to produce a new, unethical silence: the silencing of the narrator's right to privacy post-mortem.

  Regarding the second note on the duty to remember: we must distinguish between memory owed *within* a community and memory performed *for* outsiders. There is a compelling argument that the primary duty of remembrance is internal, sustaining those who share the memory. What is owed to the wider public is not necessarily exposure to trauma, but the avoidance of humiliation and the prevention of denial. Invoking a collective duty to remember on behalf of people who do not share this memory risks turning suffering into a pedagogical tool for outsiders, rather than a legacy for the community itself.

  **4. The Case for the Public Exhibition (Proposal A)**

  I wish to give the rejected option its full due. The case for the permanent exhibition is morally robust and emotionally compelling. It honours the explicit campaign of the Survivors' Association, affirming their agency after a lifetime of having choices removed from them. A public exhibition serves as a bulwark against historical denialism; it makes the atrocity undeniable in the public square. Furthermore, the schools programme offers a tangible mechanism for 'Never Again', educating the next generation to recognise the precursors to mass violence. To reject this is to risk the accusation that we are hiding history, potentially feeding the very revisionism we seek to combat. It prioritises the public good and the educational mandate that often justifies charitable status.

  **5. Recommendation**

  Despite the strengths of Proposal A, I recommend the committee commit the ring-fenced sum to **Proposal B: The Director's plan for restricted access and descendant bursaries.**

  My reasoning rests on three pillars:

  1.  **Consent and Stewardship:** The complication regarding anonymous recordings and deceased narrators is not merely administrative; it is ethical. A public exhibition creates an untenable risk of breaching the confidence of those who can no longer speak for themselves. Proposal B allows us to honour the anonymity terms while preserving the material for future historical inquiry when the passage of time may alter the sensitivity of disclosure.
  2.  **Moving Beyond Victimhood:** The Director's argument that perpetual exposure conscripts a community into living the remainder of its life as victims is persuasive. By funding bursaries for descendants, we invest in the *future* of the community rather than curating its *past* trauma. This aligns with the view that the duty to remember is internal; it supports the living heirs of the survivors in a material way, rather than asking them to witness the graphic suffering of their ancestors for public consumption.
  3.  **Archival Integrity:** As noted in our theoretical discussions, an embargo is a valid curatorial intervention. Restricting the *most graphic* recordings does not erase the history; it contextualises it. It acknowledges that some truths are too raw for immediate public digestion and preserves the dignity of the narrator over the curiosity of the viewer.

  **6. Course of Action and Timeframe**

  If the committee agrees with this recommendation, I propose the following timeline:

  *   **Immediate (June 2024):** Formal vote to allocate the ring-fenced sum to the restricted access and bursary fund.
  *   **Month 1–6:** Establish an Ethics Panel, including representatives from the survivors' families and the Survivors' Association, to define the specific criteria for "graphic" classification and to oversee the restriction protocol.
  *   **Month 6–12:** Launch the Descendant Bursary Scheme. We must ensure the Survivors' Association is consulted on the administration of this fund to maintain trust.
  *   **Year 5:** A scheduled review of the restriction policy. While the proposal suggests thirty years, a five-year review allows us to assess the impact of the bursaries and reconsider the access levels without committing to a three-decade blackout that may become untenable.

  **7. Conclusion**

  This is a difficult decision that will not please everyone. However, as custodians, our primary obligation is to do no harm to the subjects of our archive. By choosing restriction and investment in descendants, we prioritise the dignity of the dead and the future of the living over the educational demands of the public. I look forward to discussing this further at our meeting.

  Yours sincerely,

  [Your Name]
  Chair, Remembrance and Collections Committee
