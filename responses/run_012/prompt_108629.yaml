      *   *The "Parity" Principle:* This is the engine of EMT. It needs to be felt, not just defined.
      *   *Causation vs. Constitution:* This is the philosophical hinge. Without it, EMT collapses into "tools cause thoughts."
      *   *Complementarity:* This is a nuance (often associated with the "coupling-constitution fallacy" critique or newer 4E cognition). It needs careful handling so it doesn't dilute the parity principle.

  3.  **Drafting the Plan - Section by Section:**

