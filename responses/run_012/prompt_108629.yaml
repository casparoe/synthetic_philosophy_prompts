answer: |-
  Here is a teaching plan structured to handle the specific pedagogical traps you've identified.

  ### 1. The Prerequisite: Causation vs. Constitution
  **Verdict:** You are correct. This distinction is the engine of the session. Without it, the thesis collapses into the trivial claim that "tools help us think."
  **The Trap:** Do not start by lecturing on "Causation vs. Constitution." That is jargon that induces glazing.
  **The Fix:** Start with a physical analogy to build the intuition *before* naming the distinction.
  *   **The Move:** Use the **Crutch vs. Prosthetic** analogy.
      *   Ask: "If I use a crutch to walk because my leg is broken, is the crutch part of my leg?" (Intuition: No. It *causes* me to walk, but isn't *constitutive* of the walking system.)
      *   Ask: "If I have a high-tech prosthetic leg fused to my bone, controlled by my nerves, is it part of my leg?" (Intuition: Closer to Yes. It *constitutes* the walking system.)
  *   **The Label:** Only *after* they agree on the difference do you give them the philosophical labels: "Helping (Causation)" vs. "Being (Constitution)."
  *   **Why:** This creates a conceptual bucket they can pour the "Otto" case into later.

  ### 2. The Core Case: Otto and the Notebook
  **Verdict:** Keep Otto. Do not replace it.
  **Reasoning:** You worry it's "worn smooth," but for non-specialists, its smoothness is a feature, not a bug. It is the *only* case where the variables are controlled enough for them to see the argument. A smartphone is too complex (notifications, apps, connectivity issues); a friend is too social (theory of mind complications).
  **The Fix:** Don't just *tell* the story. **Stress-test it.**
  *   Run the Otto case, but pause at three specific variables that Clark & Chalmers specify:
      1.  **Availability:** Is the notebook always there?
      2.  **Trust:** Does Otto trust the info implicitly?
      3.  **Endorsement:** Did Otto write it himself?
  *   **The Twist:** Ask the group: "If Otto asks a friend instead of writing in the book, does the friend become part of his mind?" (This sets up the Group Mind muddle kill later). "If Otto uses Google but doesn't understand the answer, is it his belief?" (This sets up the Complementarity nuance).
  *   **Why:** This prevents nodding along. They have to work to see *why* the notebook qualifies but the friend/Google might not.

  ### 3. Managing Initial Intuitions
  **Verdict:** Let them sit in **"Obviously True" (We all use tools)** first.
  **Sequence:**
  1.  **Start:** "We use tools to think." (Everyone agrees. Comfortable.)
  2.  **Pivot:** "Okay, does the tool *help* the thinking, or is it *part* of the thinking?" (Introduce the Crutch/Prosthetic distinction here).
  3.  **Head Off:** The "Obviously False" (A notebook isn't a brain) intuition.
      *   **Where:** Immediately after the Pivot.
      *   **How:** "You're thinking a mind has to be biological squishy stuff. Why? If the *job* is the same, why does the material matter?"
      *   **Goal:** Shift their criterion from **Substance** (brain stuff) to **Function** (what it does). If you don't kill the "Substance" intuition here, Otto will never make sense.

  ### 4. Smuggling in "Complementary Jobs"
  **Verdict:** This is high-risk. The original Extended Mind Thesis (Clark & Chalmers) relies on the **Parity Principle** (the external process must do the *same* job as the internal one). Arguing it does a *complementary* (different) job actually weakens the original argument, though it aligns with newer "4E Cognition."
  **Placement:** **Late in the session.** Only after they have grasped the Parity Principle (Otto's notebook = Inga's biological memory).
  **The Move:** Frame it as "The Next Step."
  *   "We've argued the notebook does the *same* job as memory. But what if the tool does something the brain *can't* do? Does that make it *more* part of the mind, or less?"
  **The Risk:** The **Coupling-Constitution Fallacy**. (Just because two things are coupled/working together doesn't mean they are one thing).
  **The Mitigation:** You must explicitly state: "Just because a tool complements the brain doesn't automatically make it part of the mind. It still needs that tight integration (trust, availability) we discussed with Otto."
  *   **Misconception to Kill:** "So anything I happen to use is part of my mind."
  *   **The Brake:** "If I use a calculator to multiply, is the calculator part of my mind? Only if I rely on it as blindly as I rely on my own arithmetic intuition. If I check its work, it's just a tool. If I trust it like memory, it's part of the system."

  ### 5. Killing the Muddles (Timing is Key)
  *   **Consciousness/Qualia:** **Kill immediately in the setup.**
      *   *Script:* "We are talking about processing, memory, and belief. We are *not* talking about what it feels like. The notebook doesn't feel sad. We are talking about the machinery of thought, not the experience of it."
  *   **Group Mind:** **Kill during the Otto stress-test.**
      *   *Script:* When they ask about asking a friend: "This thesis is about the individual's cognitive system. If we start including other people, we enter 'distributed cognition,' which is a different debate. Let's keep the boundary at the individual's skin for today."
  *   **Empirical/Brain Scanner Claim:** **Kill during the Causation/Constitution setup.**
      *   *Script:* "A brain scanner can tell us where the activity is. It cannot tell us where the mind *is*. That is a philosophical question about definitions, not a scientific question about location. No experiment can settle this."

  ### 6. The Closing Diagnostic Question
  Do not ask "Do you agree?" (They will just say yes to be polite). Ask a boundary case that forces them to apply the **criteria** (Trust/Availability/Endorsement) rather than the **vibe**.

  **The Question:**
  > "Otto carries his notebook everywhere and trusts it implicitly. Inga has a biological memory she trusts implicitly.
  >
  > **Case A:** Otto looks up an address in his notebook.
  > **Case B:** Otto asks a stranger on the street for the address, the stranger tells him, and Otto writes it down.
  >
  > In Case A, Clark & Chalmers say the notebook is part of Otto's mind. In Case B, is the *stranger* part of Otto's mind? Why or why not? Use the criteria we discussed."

  *   **What this tests:** If they say "Yes, the stranger is part of his mind," they haven't understood the **coupling-constitution** limit or the **endorsement/trust** constraint. They've slipped into "anything that helps is part of the mind." If they say "No," and can articulate that the stranger isn't *reliably available* or *under Otto's direct control* in the same way, they have grasped the thesis.

  ### 7. What to Refuse (The "Out of Bounds" List)
  Openly state these are off-limits for *this* session to prevent scope creep:
  1.  **The Hard Problem:** "We are not solving consciousness today."
  2.  **Neural Mechanisms:** "We are not debating how neurons fire."
  3.  **Ethics/Privacy:** "If my phone is my mind, can police search it without a warrant? Interesting, but not for today."

  ### Summary of Flow
  1.  **Hook:** Tools help us think (True).
  2.  **Distinction:** Crutch (Helps) vs. Prosthetic (Is). Label: Causation vs. Constitution.
  3.  **Core:** Otto/Inga. Apply the distinction. Shift from Substance to Function.
  4.  **Muddle Kill:** Not about feelings (Consciousness), not about neurons (Empirical).
  5.  **Nuance:** Complementary jobs (with warning about the "Anything Goes" fallacy).
  6.  **Diagnostic:** The Stranger vs. Notebook test.
  7.  **Close:** Readings for next week.
