answer: |-
  "Four hours," Elias said, swirling the ice in his empty glass. "The airline owes us more than peanuts. They owe us a resolution."

  Mara sighed, leaning back against the sticky bar top. "Fine. Bivalence. Future contingents. You say the coin flip is heads or false now. I say it's neither. Let's bury it."

  "Not bury. Settle." Elias tapped the table. "Take this case I read. A firm publishes a report: 'We will be bankrupt within twelve months.' Investors read it, panic, pull capital. The panic bankrupts the firm. When the report was published, was it true?"

  Mara frowned. "That's a self-fulfilling prophecy. At the moment of publication, the future was open. The report itself closed the branch. So, no. It wasn't true then. It became true because it was published."

  "But it *is* true now," Elias countered. "If we assess the sentence from here, after the fact, it corresponds to reality. If truth is correspondence, and the reality is fixed, why shouldn't the truth value be fixed?"

  "Because correspondence requires something to correspond *to*," Mara said sharply. "At t-one, there was no fact of the bankruptcy. There was only a probability. You're conflating 'will turn out true' with 'is true now.' If I say 'It might rain,' and it does, was 'It might rain' true? Yes. Was 'It will rain' true? No. Not until the clouds broke."

  Elias paused. "Okay. Concession: If your ontology is presentist—if only the now exists—then I grant you, there's no future fact to match the sentence. But does physics matter here? If the universe is deterministic, isn't the future sentence already true, even if we don't know it?"

  "Does it matter?" Mara leaned forward. "If the coin is quantum-random, there is literally no physical state determining heads. If it's deterministic, there is. If you claim bivalence holds regardless of physics, you're saying logic dictates reality. That's idealism, Elias."

  "Fair," Elias nodded slowly. "If indeterminism is real, then my claim that 'It is true now' implies a metaphysical commitment. It implies eternalism—that the future exists tenselessly. I'm not saying logic forces the coin; I'm saying if the future exists, the sentence describes it. But you... you're saying truth requires *settledness*."

  "Truth requires a fact," Mara corrected. "Not just a timeline."

  "Then let's press the second point. What is 'true' doing for you?" Elias asked. "Is it just 'warranted assertibility'? If I say 'The coin will land heads,' and I have no evidence, you say it's not true. If I flip it and it's heads, you say it *became* true. But did the sentence change? No. The world changed. So why not say the sentence was always true, waiting for the world to catch up?"

  "Because 'true' isn't a placeholder for 'eventually matches'," Mara said. "If I say 'There is a city on Mars' today, and one is built tomorrow, was I true today? No. I was wrong. Truth tracks existence. If you strip 'true' of 'currently grounded,' it becomes magic. It becomes 'we're warranted in asserting it' only after the fact. You're smuggling retrocausality into semantics."

  Elias rubbed his temple. "Ouch. Okay. If truth is grounded in current existence, I lose the future. But if truth is timeless, I keep bivalence but lose the 'now.' So are we just fighting over the word 'now'?"

  "Maybe," Mara said. "That's the third thing. Is this genuine? Or are you using 'true' to mean 'fits the complete history of the universe' and I'm using it to mean 'fits the current state of the universe'?"

  "If it's verbal," Elias said, "we should be able to pinpoint the split. You think 'S is true' entails 'S is settled.' I think 'S is true' entails 'S corresponds to the actual future branch.' If we agree on the metaphysics—say, branching time—do we still disagree?"

  Mara thought for a moment. "If branching time is real, then 'The sea battle will happen' is false on some branches and true on others. But on *this* branch, before the split... there is no unique proposition. So yes, even with branching, I say no truth value. You say... what? That one branch is 'actual'?"

  "I say the actual future is unique," Elias said. "Even if we can't see it."

  "But the bankruptcy case breaks that," Mara insisted. "The report made the future unique. Before the report, there was no unique future of bankruptcy. So the sentence couldn't have been true. It *made* itself true. If it was true before, it was true independently of the report. But it wasn't. The report was the cause."

  Elias stared at his glass. "So you're saying the truth value is causal? That a sentence can't be true unless it's causally determined?"

  "I'm saying truth supervenes on being," Mara said. "No being, no truth."

  "And I'm saying truth supervenes on reality," Elias countered. "And reality includes the future." He paused, then sighed. "Here's my shift. If the bankruptcy report caused the outcome, then at t-one, the outcome wasn't inevitable. If it wasn't inevitable, and I claim it was 'true' at t-one, I'm claiming inevitability. So, if indeterminism holds, my bivalence claim forces determinism. I can't have openness and bivalence."

  "Exactly," Mara said. "But I'll concede this: If eternalism is true—if the future block exists—then you're right. The sentence is true. My objection collapses into 'we can't know it.' So our disagreement isn't logic. It's metaphysics. You're an eternalist; I'm a presentist."

  "And the bankruptcy case?" Elias asked.

  "Shows that speech acts can change ontology," Mara said. "But it doesn't prove the sentence was true beforehand. It proves the sentence was potent."

  Elias raised his glass. "So we're not arguing about truth. We're arguing about time."

  "And whether words create worlds," Mara said, clinking her glass against his. "Which is worth four hours."

  "Next round?"

  "Only if the airline pays."
