answer: |-
  Based on the internal logic of Marcus's five prior verdicts, here is the reconstruction of his system, the verdict on the drug company, and the machinery required to test it.

  ### 1. Marcus's Verdict
  **Yes, there is karma.**

  However, it is distributed unevenly across the three terms he uses:
  *   **The Board:** They carry a heavy **Ledger** debt. They made the explicit choice (the "Chooser" requirement from the Village case is met). The dissolution of the company does not erase the debt (per the Fraudster case: "You don't have to remember a debt for it to be owed," implying the debt survives structural collapse).
  *   **The Employees:** They carry a **Stream** karmic load, potentially tipping into **Ledger**. Marcus's Mob verdict ("doesn't get discharged by everyone shrugging") suggests that doing a "small lawful job" within a harmful collective does not absolve you. However, since they lacked the final decision power, their karma is more about *what they are becoming* (Stream) through complicity, unless they actively knew and facilitated, in which case they share the Ledger.
  *   **The Company:** The entity itself is irrelevant once it folds. Karma attaches to the *people* (the Choosers and the Participants), not the legal shell.

  ### 2. The Rule He Is Actually Running
  Marcus is operating on the **Principle of Concerted Agency**.

  *   **The Rule:** Karma requires a "Chooser" (Village case), but a "Chooser" can be a collective mind acting in concert (Mob case). If a group creates a decision-making structure (Board) that intends a harmful outcome, every participant who sustains that structure shares the karmic weight. Diffusion of labor (employees doing "small jobs") does not break the chain of agency.
  *   **Why it fits:**
      *   It explains the **Village** exemption (no concert, just aggregate individual choices).
      *   It explains the **Mob** inclusion (concerted action, shared intent to harm).
      *   It explains the **Soldier** (the "order" creates a concerted link between commander and soldier; the soldier chooses to obey).
      *   It explains the **Fraudster** (individual concert with himself over time; intent existed at the moment of choice).

  ### 3. Alternative Rules That Fit the Data
  You could reconstruct Marcus's history using different engines that yield the same past results but might crack on the drug company.

  *   **Alternative A: The "Direct Causation" Rule**
      *   *Principle:* Karma only attaches to the physical hand that causes the harm or the specific voice that commands it.
      *   *Fit:* Works for Fraudster (he stole), Surgeon (he cut), Soldier (he shot), Mob (they dragged).
      *   *Conflict:* It struggles with the **Mob** verdict. If karma is only direct causation, the guy holding the feet should have less karma than the guy holding the knife. Marcus says "a lot of it" for the whole mob. It also struggles with the **Drug Company Board**, who never touched the pills.
  *   **Alternative B: The "Moral Awareness" Rule**
      *   *Principle:* Karma only attaches if the agent *knows* they are doing wrong at the time.
      *   *Fit:* Works for Soldier (sick about it), Fraudster (knew he was defrauding), Mob (presumably knew killing was wrong).
      *   *Conflict:* It contradicts the **Fraudster** verdict ("having completely forgotten her"). Marcus explicitly says memory/ongoing awareness isn't required for the debt to exist, only the initial choice.
  *   **Alternative C: The "Power to Prevent" Rule**
      *   *Principle:* Karma attaches only to those who had the power to stop the harm and didn't.
      *   *Fit:* Works for Board, Fraudster, Surgeon.
      *   *Conflict:* It breaks the **Soldier** verdict. The soldier was "ordered to." If he refused, he might have been court-martialed or shot. His power to prevent was negligible compared to the commander, yet Marcus says the soldier *also* has karma ("still running").

  ### 4. The Closest Analog: The Mob
  The Drug Company is the **Mob**, not the Village.

  *   **Why not the Village?** The Village failed the "Chooser" test. It was emergent harm from individual acts. The Drug Company has a Board—an explicit mechanism for collective choice.
  *   **Why the Mob?** Both cases involve a group causing death where individuals attempt to minimize their role ("I only did my bit" vs. "I just worked there"). Marcus's specific annoyance at the Mob ("doesn't get discharged by everyone shrugging") is the exact precedent for the employees' defense. The existence of a hierarchy (Mob leaders vs. Drug Board) doesn't change the karmic physics; it just concentrates the Ledger debt at the top while spreading the Stream debt downward.

  ### 5. The Tie-Breaker Case
  To distinguish between the **Principle of Concerted Agency** (Marcus's likely rule) and a stricter **Principle of Causal Will** (Alternative), you need to test the limits of "participation" vs. "decision."

  **The Case:** *The Dissenting Board Member.*
  A member of the drug company Board votes **NO** on the policy. They argue against it loudly in the minutes. They are outvoted 10-to-1. They do not resign; they stay on the Board for the next 30 years, collect their dividends, and attend the meetings where the policy is reaffirmed.

  *   **If Marcus says "Karma" (Ledger/Field):**
      *   *Principle:* **Complicity through Benefit.** By remaining in the structure and accepting the benefits (pay/status) of the harmful decision, you sustain the "Field" that allows the harm to continue. Your initial "No" is erased by your continued presence.
      *   *Implication:* Marcus's system is about *sustaining* harm, not just *initiating* it.
  *   **If Marcus says "No Karma" (Ledger):**
      *   *Principle:* **Causal Will.** Karma requires a specific volitional act to cause harm. Since this member voted No and lacked the power to veto, they are karmically distinct from the majority. They are a "Soldier" without the order, or a "Villager" in a Mob.
      *   *Implication:* Marcus's system is strictly about the *moment of choice*. If the choice was "No," no debt is incurred, regardless of subsequent benefit.

  ### 6. Summary of Machinery
  *   **To get Marcus's likely "Yes" Verdict:** You must adopt the view that **organizations are karmic entities** composed of their members. Participation is consent. (The Mob Rule).
  *   **To get a "No" Verdict:** You must adopt the view that **karma is strictly individual and causal.** If I file a paper, and you sign the order, and the paper kills someone, the karma is on your signature, not my filing. (The Village Rule applied to hierarchy).

  Marcus's record suggests he will choose the **Mob Rule**. He has already ruled that "doing your bit" in a collective harm (Mob) and "following orders" (Soldier) do not absolve the individual. The Drug Company is simply a Mob with a payroll.
