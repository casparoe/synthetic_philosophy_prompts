answer: |-
  You have identified a precise and significant mechanism in contemporary nosology, yet your difficulty in finding a single canonical term is well-founded. While the phenomenon is widely discussed in the sociology of medicine, bioethics, and the philosophy of medicine, it is often subsumed under broader, less precise headings like 'medicalisation' or 'disease mongering'.

  There is no single, universally established term that captures this specific *ontological dependence* of disease status on intervention availability. However, the philosophical carving you require already exists in fragments across the literature. To give you the precision you need for your doctoral work, I propose that the most accurate conceptual label is **Therapeutic Operationalism**.

  Below, I delineate this concept, distinguish it from its neighbours, and clarify its descriptive and normative status.

  ### 1. The Concept: Therapeutic Operationalism

  **Therapeutic Operationalism** is the practice (and implicit ontology) wherein the extension of a disease category is determined by the operational capacity to intervene upon it safely and effectively.

  It draws directly from the philosophy of science tradition of **Operationalism** (associated with Percy Bridgman in the 1920s), which argues that scientific concepts are defined by the set of operations used to measure or manipulate them. In your context, the 'operation' is the therapeutic intervention (drug, surgery, guideline). If the operation changes (e.g., a drug becomes safe at lower thresholds), the concept (e.g., 'hypertension') changes to match it.

  This concept captures the specific dependence you observed: the disease is not a pre-existing natural kind waiting to be discovered; rather, its boundaries are constituted by the 'therapeutic horizon'.

  ### 2. Edges and Boundaries

  To ensure this concept does the work you need, we must state precisely what it covers and what it excludes.

  **What it Covers:**
  *   **Threshold Drift:** The lowering of diagnostic criteria (e.g., HbA1c, blood pressure) following the availability of interventions that show benefit at those new levels.
  *   **Risk Reification:** The classification of asymptomatic risk factors (e.g., osteopenia, pre-hypertension) as distinct pathological entities solely to facilitate prophylactic treatment.
  *   **Retreat:** The de-classification or narrowing of a disease category when interventions are deemed to cause net harm (e.g., the shifting guidelines on hormone replacement therapy or the definition of sepsis).
  *   **Administrative Constitution:** The role of reimbursement codes and guidelines in solidifying the disease status, making the administrative apparatus part of the disease's ontology.

  **What it Excludes:**
  *   **Etiological Discovery:** It does not cover cases where a disease boundary shifts due to the discovery of a pathogen or genetic cause *without* an immediate change in treatment capability.
  *   **Symptom-Led Classification:** It excludes conditions defined primarily by patient-reported suffering where no specific intervention exists (e.g., certain chronic pain syndromes or medically unexplained symptoms), unless the classification is specifically created to unlock a payment pathway for management.

  ### 3. Differentiation from Neighbours

  You correctly noted that this is close to medicalisation, overdiagnosis, and disease mongering. Here is how Therapeutic Operationalism is distinct:

  *   **Vs. Medicalisation:** Medicalisation is a *sociological process* describing the expansion of medicine's authority into non-medical spheres (e.g., childbirth, ageing). It describes the *colonisation of territory*. Therapeutic Operationalism describes the *logic of definition* within that territory. One can have medicalisation without operationalism (e.g., treating grief with counselling), but your observation is about the *definition of the disease itself* shifting to match the tool.
  *   **Vs. Overdiagnosis:** Overdiagnosis is an *individual-level outcome* where a person is diagnosed with a condition that would not have caused them harm. It presupposes the disease category is fixed and the diagnosis is an error. Therapeutic Operationalism suggests the *category itself* is fluid and defined by the treatment. Under Operationalism, 'overdiagnosis' is arguably a category error; if the treatment defines the disease, then anyone eligible for the treatment is, by definition, diseased.
  *   **Vs. Disease Mongering:** This is a *normative and often polemical* term implying corporate manipulation or exaggeration. Therapeutic Operationalism is a *structural description*. It does not assume malign intent; it acknowledges that clinicians and guideline committees often genuinely wish to prevent harm. The shift occurs because the *logic of medicine* prioritises actionability.

  ### 4. Descriptive or Normative?

  This is the crux of your philosophical inquiry. Therapeutic Operationalism functions as both, but in different registers.

  **As a Descriptive Claim:**
  It is a robust description of how modern evidence-based medicine actually functions. Guideline committees (such as NICE or the JNC) explicitly tie diagnostic thresholds to intervention trials. If a trial shows benefit at a lower blood pressure, the definition of hypertension changes. Descriptively, disease status *is* a function of the therapeutic apparatus in contemporary practice. This aligns with a **Pragmatic Instrumentalist** view of disease kinds.

  **As a Normative Claim:**
  It serves as a critique of **Naturalist** ontologies of disease (e.g., Boorse's Biostatistical Theory). If disease status depends on the availability of a drug, then disease is not a value-free fact of nature.
  *   **Normative Implication:** If one holds that disease *ought* to be a natural kind (independent of our ability to fix it), then Therapeutic Operationalism is a corruption of medical science.
  *   **Counter-Normative Implication:** If one holds that the *purpose* of medicine is to alleviate suffering and prevent harm (a Normativist or Pragmatist view), then Therapeutic Operationalism is not a bug, but a feature. It ensures that the label 'disease' is reserved for states where medical action is warranted, preventing the diagnosis of conditions we cannot help.

  ### 5. Philosophical Lineage and References

  To ground this in your literature review, you should note that while the specific term 'Therapeutic Operationalism' is not canonical, the argument is present in the work of:

  *   **Robert Aronowitz:** In *Making Sense of Illness*, he argues that disease concepts are framed to make them actionable. He discusses how risk factors are turned into diseases to enable intervention.
  *   **Peter Schwartz:** He has written extensively on the normativity of disease concepts, arguing that 'disease' is a value-laden term used to justify medical intervention.
  *   **Lisa Bortolini:** Her work on the ontology of disease discusses how psychiatric and somatic categories shift based on utility rather than natural kinds.
  *   **Ian Hacking:** While his 'Looping Effects' focus on human kinds, the logic applies here: the classification changes the classified, but in your case, the *treatment* changes the *classification*.

  ### Summary for Your Work

  If you require a label for your thesis, I recommend **Therapeutic Operationalism**.

  *   **Definition:** The constitution of disease boundaries by the availability and safety profile of therapeutic interventions.
  *   **Ontological Status:** It posits that disease categories are **Response-Dependent Concepts** (where the 'response' is the medical intervention), rather than Natural Kinds.
  *   **Utility:** It allows you to analyse the drift of diagnostic thresholds without resorting to the conspiratorial overtones of 'disease mongering' or the broad brush of 'medicalisation'.

  This carving permits you to argue that the 'reality' of a disease in modern medicine is not its biological substrate, but its **actionability**. This shifts the philosophical debate from 'What is disease?' to 'What is disease *for*?'
