prompt: |-
  I'm the best man at my oldest friend's wedding next month and I have to give the toast, and I'm a bit stuck on how to pitch it. Here's the situation: the groom (my friend) is a constitutional historian — his whole career is on how the crown actually functions in a parliamentary democracy, the stuff nobody outside the field knows, like the reserve powers that exist on paper but are governed only by convention, the question of who gets first chance to form a government when an election returns no majority, whether the monarch can refuse a dissolution, the caretaker conventions, all that. He's a monarchist but the sophisticated, slightly melancholy kind: he thinks the whole thing runs on conventions that no court would enforce and that it survives only as long as everyone agrees to keep pretending. The bride is a republican — not militant, but she genuinely thinks hereditary public office is absurd, and she's a political theorist who'll hear every word as a claim. Her side of the room is mostly academics and a few Scandinavian and Japanese colleagues who know their own constitutional monarchies inside out and will absolutely notice if I say something glib or wrong about, say, how the emperor's role differs from the queen's, or why the Scandinavian monarchies look so different from the British one. His side is his family, who are lovely and completely apolitical and will not know what a reserve power is, plus a couple of his old supervisors who'll be grading my accuracy in real time.

  What I want: a five-minute toast that somehow uses the actual machinery of constitutional monarchy — reign but not rule, power that's real but never exercised, authority that depends on the powerful party voluntarily not using what it legally has, the weird dignity of a head of state who has no opinions — as the thing the whole toast is built on, so that it's really about the marriage and not a lecture. It has to land for both halves: the republicans shouldn't feel I've smuggled in a defense of the monarchy, the monarchists shouldn't feel I've made their position a joke, and nobody should feel they're at a seminar. It should be warm and a little funny and it should have one genuinely non-obvious idea in it, not just the reign-but-don't-rule cliché — something like the point that the crown's power is a power it must never spend, so its whole strength is in restraint, which is either a beautiful model for a marriage or a terrible one and I want the toast to leave that slightly open. Don't quote anyone and don't name any statutes or dates — I don't want to get anything wrong, and anyway half the room would fact-check me. Just write the toast.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Best Man.
      *   **Occasion:** Wedding toast (5 minutes).
      *   **Groom:** Constitutional historian, specialist in crown function in parliamentary democracy (reserve powers, conventions, caretaker conventions, etc.). Sophisticated, slightly melancholy monarchist (believes it survives on collective pretense/agreement).
      *   **Bride:** Political theorist, republican (thinks hereditary office is absurd), but not militant. Will scrutinize every word.
      *   **Audience:**
          *   Groom's side: Family (apolitical), old supervisors (will fact-check accuracy).
          *   Bride's side: Academics, Scandinavian/Japanese colleagues (know their own constitutional monarchies, will notice glib errors).
      *   **Goal:** A toast built on the machinery of constitutional monarchy as a metaphor for marriage.
      *   **Constraints:**
          *   Warm and slightly funny.
          *   No quotes, no statutes, no dates (avoid fact-checking traps).
          *   Must not feel like a lecture or a seminar.
          *   Must not defend monarchy to republicans or mock it to monarchists.
          *   **Key Idea:** Needs a non-obvious insight (e.g., power exists but must never be spent, strength in restraint), leaving it slightly open whether this is a beautiful or terrible model for marriage.
          *   **Tone:** Balanced, nuanced, intimate but intellectual enough for the room.

  2.  **Deconstruct the Metaphor:**
      *   *Constitutional Monarchy:* Reign but not rule. Power exists on paper but is governed by convention. Authority depends on voluntary restraint. The Head of State has no opinions (publicly).
      *   *Marriage:* Partnership, compromise, knowing when to speak and when to listen, holding power but choosing not to wield it for the sake of the union.
      *   *The Tension:* The groom knows the system is fragile (depends on everyone pretending). The bride thinks the system is absurd.
      *   *The Insight:* The strength of the system isn't the power itself, but the *refusal* to use it. In marriage, having the "right" to be right doesn't matter; choosing not to enforce it does.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room's expertise. Light humor about the risk of speaking here. Establish the groom's passion without getting technical.
      *   **The Groom's Passion:** Describe his love for the "invisible rules." The things that exist only because we agree they exist. Connect this to his character (thoughtful, careful).
      *   **The Bride's Perspective:** Acknowledge her skepticism gently. She values substance over ceremony. This creates the dynamic.
      *   **The Core Metaphor (The "Non-Obvious Idea"):** Focus on *reserve powers*. The idea that you have the authority to intervene, but the wisdom to know that using it destroys the system. In marriage, this is about having the capacity to win an argument but choosing the relationship instead.
      *   **The Fragility/Convention Aspect:** The system survives on trust. Marriage survives on trust. It's a "collective pretense" in the state, but a "collective promise" in marriage.
      *   **The Closing:** Wish them well. Leave the question open: is restraint beautiful or limiting? Let them decide. Raise a glass.

  4.  **Refining the Tone:**
      *   *Avoid:* "The King can dissolve Parliament." (Too specific, risk of error).
      *   *Use:* "The powers that sit on the shelf." "The authority that is real only because it is unused."
      *   *Check:* Is it too dry? Need warmth. Focus on *them*, not just the theory.
      *   *Check:* Is it offensive to the bride? Ensure the metaphor doesn't validate hereditary privilege, but rather validates *restraint* and *convention* (agreement) over *force*.
      *   *Check:* Is it offensive to the groom's supervisors? Don't misstate the theory. Stick to the philosophical essence (convention vs. law) rather than mechanical details.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm nervous because there are experts here. Groom loves the crown. Bride thinks it's silly. But they both agree on rules. The crown has power but doesn't use it. That's like marriage. You have the power to be right, but don't use it. It's fragile. Like the crown depends on everyone agreeing, marriage depends on you two agreeing. Cheers.

      *Critique 1:* Too simple. Needs more nuance on the "melancholy monarchist" angle and the "republican theorist" angle. Needs the "non-obvious idea" about power being strength only when unspent.

  6.  **Drafting - Iteration 2 (Adding Nuance):**
      Start with the risk. I know [Groom] studies the things that exist only on paper. [Bride] thinks that's absurd. But maybe they're both right. The crown works because everyone pretends it works. Marriage works because you pretend the other person is right sometimes. The power is in the restraint. If you use the reserve power, the system breaks. If you win every argument, the marriage breaks. But is that good? Maybe. Let's drink.

      *Critique 2:* Better. Needs to be more poetic. Needs to address the international guests (Scandinavian/Japanese) without naming them specifically (just acknowledge the room's knowledge). Needs to handle the "melancholy" bit—the idea that it survives only as long as we agree.

  7.  **Drafting - Iteration 3 (Polishing the Language):**
      *   *Opening:* Acknowledge the minefield. "Speaking to a room where half the people could correct my grammar and the other half could correct my constitutional theory."
      *   *The Groom:* He loves the "silent machinery." The things that are true because we say they are.
      *   *The Bride:* She asks "Why?" She wants substance.
      *   *The Bridge:* What if the point isn't the crown, but the *constraint*?
      *   *The Insight:* A power that is only strong because it is never used. In marriage, the "reserve power" of being right, or having the last word.
      *   *The Fragility:* It relies on convention. Not law. Trust.
      *   *The Ending:* Raise a glass to the constitution they are writing themselves.

  8.  **Final Review against Constraints:**
      *   5 minutes? (Word count check: ~750-850 words usually fits 5 mins spoken at a moderate pace).
      *   No statutes/dates? (Checked).
      *   No quotes? (Checked).
      *   Non-obvious idea? (Power is strength only when unspent/refusal to dissolve).
      *   Warm/Funny? (Add some self-deprecation and warmth about the couple).
      *   Balanced for Bride/Groom sides? (Focus on *agreement* rather than *monarchy* itself).

  9.  **Writing the Toast (incorporating the "melancholy" and "republican" tension):**
      *   Make sure to highlight that the system survives on *agreement*. This appeals to the republican (social contract) and the monarchist (convention).
      *   The "terrible or beautiful" ambiguity needs to land softly.

      *(Self-Correction during drafting)*: Be careful not to imply the bride is "wrong" about hereditary office. Frame her skepticism as a valuable counterweight that keeps the groom grounded. The metaphor should be about *their* dynamic, not validating the institution of monarchy itself. The monarchy is just the lens.

      *Key phrase to include:* "The strength of a veto you never exercise."
      *Key phrase to include:* "A system that survives only because everyone agrees to keep pretending." (Use this carefully so it doesn't sound like "marriage is a pretense"). Instead, "Marriage survives because you agree to uphold the conventions of kindness."

      *Let's write.*

      *Opening:* Good evening. I stand here aware that I am speaking to a room where half the guests could correct my syntax and the other half could correct my understanding of caretaker conventions.
      *Groom:* He finds beauty in the unwritten rules.
      *Bride:* She finds beauty in truth.
      *Metaphor:* The reserve power.
      *Closing:* To the constitution of two.

      *Refining the "Melancholy":* The groom knows it's fragile. The toast should acknowledge that fragility is what makes it precious.
      *Refining the "Republican":* She knows power corrupts. The toast should agree that power must be checked.

      *Final Polish:* Ensure it sounds spoken, not read. Rhythm and pauses.

      *(Word Count Check)*: A 5-minute toast is roughly 750-800 words. I need to make sure I don't ramble.

      *(Safety Check)*: Ensure I don't accidentally say something factually wrong about constitutions while trying to be vague. Stick to "conventions," "powers on paper," "refusal to act."

      *(The "Non-Obvious Idea")*: The idea that the *existence* of the power guarantees the stability, but the *use* of it guarantees the collapse. In marriage, knowing you *could* leave, or *could* win, but choosing not to, is what makes staying meaningful.

      *Let's go.*
answer: |-
  Good evening, everyone.

  I stand before you aware that I am navigating a minefield. To my left, I see the groom's family, who are lovely and just want to know if there's enough cake. To my right, I see his former supervisors, who are currently mentally fact-checking my punctuation. And scattered throughout the room are colleagues who know the differences between European and Asian constitutional frameworks better than I know my own phone number.

  So, I have decided not to talk about the law. I'm not going to talk about statutes, or succession, or the specific mechanics of how a government is formed. Instead, I want to talk about [Groom]'s favorite subject: the things that exist only because we agree they exist.

  [Groom] has spent his life studying the invisible machinery of the state. He loves the idea of powers that sit on the shelf—authorities that are real on paper but are governed entirely by convention, by trust, by the gentle understanding that some things *can* be done, but simply *should not* be done. He is a monarchist, but not the kind who waves flags. He is the kind who finds beauty in the restraint required to keep a system alive. He knows that the whole thing is fragile. He knows it survives only as long as everyone agrees to keep pretending that the rules matter more than the power.

  [Bride], on the other hand, is a political theorist who looks at that same system and asks the dangerous question: "Why?" She believes that public office should be earned, not inherited, and that authority should be substantive, not ceremonial. She is the reality check to [Groom]'s romanticism about tradition.

  And yet, here they are. Standing together.

  I've been thinking about what makes this work. And I keep coming back to that strange piece of constitutional machinery that [Groom] loves so much: the reserve power.

  In a constitutional system, the Head of State often holds powers that are never meant to be used. The strength of the position isn't in what it can do; it's in what it refuses to do. The authority is real, but it is only strong because it remains unspent. If you use it, the system breaks. If you exercise the veto, the convention shatters. The power exists to ensure stability, but it maintains that stability only by remaining dormant.

  I think this is a beautiful, and perhaps slightly terrifying, model for a marriage.

  Because let's be honest: in any long partnership, you accumulate reserve powers. You learn where the other person is vulnerable. You learn which arguments you could win if you really pushed. You have the authority to be right, to have the last word, to dissolve the partnership if things get too difficult. You have the power to demand satisfaction.

  But the genius of a marriage, like the genius of the constitution [Groom] studies, is that those powers are only valuable if you never use them.

  The strength of this union won't be in how often you enforce your rights, but in how often you voluntarily choose not to. It is in the veto you don't exercise. It is in the argument you let go, not because you were wrong, but because the relationship matters more than the point. It is in the understanding that you are both bound by conventions of kindness that no court would enforce, but which you uphold anyway.

  [Bride], you know better than anyone that power corrupts. [Groom], you know better than anyone that power is fragile. Together, you understand that the only authority that lasts is the authority you mutually agree to recognize.

  Some might say this sounds like restraint is a burden. That a system built on not using your power is a system built on suppression. Maybe it is. Maybe there is something melancholy in knowing that the strongest thing you can do is nothing at all. But there is also something profoundly dignified in it. It means that every day you stay, every day you compromise, every day you choose the convention of "us" over the power of "me," you are renewing the constitution of this marriage.

  You are not bound by law. You are bound by promise. And like the best constitutional systems, this one survives only because you both decide, every morning, to pretend that the other person's happiness is as important as your own.

  So, I propose a toast.

  To the reserve powers you will never use.
  To the conventions you will always keep.
  And to the constitution of two, which is far more durable than any statute written on paper.

  To [Groom] and [Bride].
