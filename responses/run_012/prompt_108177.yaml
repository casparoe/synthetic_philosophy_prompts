answer: |-
  The question of why promises bind is not merely a puzzle for linguists or legal theorists; it is a question about the architecture of morality itself. When I say "I promise," I do not merely predict my future behavior; I create a reason to act that did not exist before. The debate over the source of this reason divides into two camps. The first, the **Practice View**, argues that promising is a social game. We are bound because we participate in an institution with constitutive rules, much like chess players are bound by the rules of chess. The second, the **Non-Convention View**, argues that the binding force comes from something deeper: the exercise of the will, the invitation of reliance, or the demand of respect for persons.

  The Practice View offers comfort in its clarity, but it collapses under the weight of moral reality. The Non-Convention View, specifically a **Voluntarist account grounded in the invitation of trust**, is the only theory that survives the stress tests of human experience. Promises bind not because we follow rules, but because we claim authority over another's expectations.

  To see why the Practice View fails, consider the case of the **Strangers**. Imagine two individuals who share no language, no culture, and no prior institution of promising. Through gesture and context, one signals a firm commitment to aid the other, and the other, understanding this signal, relies on it. If the Promisor then abandons the Promisee, has a moral wrong occurred?

  The Practice View must answer "no," or at least "not a promise-based wrong." If there is no shared institution, there are no constitutive rules to break. On this view, the obligation is contingent on social happenstance. This is morally repugnant. It suggests that morality is a club membership rather than a universal demand. If I induce you to rely on me, I incur an obligation to you regardless of whether we both read Rawls or speak English. The obligation arises from the **normative shift** I enacted by inviting your trust. I did not just predict the future; I gave you a right to expect it. The Practice View mistakes the *vocabulary* of promising for the *grammar* of morality. The strangers case proves that the binding force exists prior to the institution; the institution merely codifies a power we already possess.

  However, the Non-Convention View faces its own crucible in the case of the **Non-Recipient**. Consider a promise made to an infant, a patient in late-stage dementia, or a dog. You tell the dog, "I promise I will not leave you." The Practice View is untroubled here. You uttered the words within the social practice; therefore, you are bound. The rule is satisfied. But this reveals the hollowness of the Practice View. It prioritizes the ritual over the relationship.

  A strict Reliance View (a subset of Non-Convention) also fails here. A dog cannot "rely" in the normative sense required for a promise; it cannot hold a normative expectation that you *ought* to return, only a predictive hope that you *will*. Similarly, the Kantian view that promising is about not treating the other as a mere tool struggles because a dog is not a rational agent capable of being treated as an end in itself in the relevant sense.

  But a refined **Voluntarist/Trust View** handles this case not by stretching to include the dog, but by clarifying the nature of the bond. When you "promise" a dog, you are not making a promise. You are making a **vow**. A promise is a second-personal act: it transfers authority to the promisee to hold the promisor accountable. A dog cannot hold you accountable. An infant cannot claim their right. Therefore, the obligation that binds you in the dog case does not come from the dog's right to demand fidelity, but from your own integrity and the value of the being you are caring for.

  This distinction is fatal to the Practice View. The Practice View says the obligation is identical in both cases because the rule is identical. The Non-Convention View correctly identifies that the *source* of the obligation has shifted. In the human case, I am bound because I gave *you* power over me. In the dog case, I am bound because I imposed a duty on *myself*. By recognizing this difference, the Non-Convention View explains why breaking a promise to a competent adult feels like a betrayal of *them*, while breaking a vow to a dog feels like a corruption of *you*. The Practice View cannot make this distinction; it sees only rule-breaking.

  What, then, is really doing the work? It is the **exercise of normative power**. To promise is to intentionally alter the moral landscape between agents. I give you the authority to demand performance and to release me from the duty. This power does not come from a social rulebook; it comes from the capacity of rational agents to bind themselves through communication.

  The Stranger Case shows that this power exists without institutions. The Dog Case shows that this power requires a specific kind of recipient—one capable of participating in the exchange of authority. The Practice View gets it backward: it thinks the institution creates the power. In reality, the power creates the institution. We built the practices of promising because we already possessed the moral capacity to bind ourselves to one another.

  Therefore, we must reject the idea that promises bind because of convention. Conventions can be changed; morality cannot. If promising were merely a social practice, we could opt out of it when it became inconvenient, provided we left the "game." But we cannot opt out of the obligation not to betray those who trust us. The binding force of a promise is the binding force of respect for the agency of another. It is the recognition that when I invite your trust, I am no longer free to treat your expectations as mere data points in my calculation of convenience. I have made them my law.

  The verdict is clear. Promises bind because we are the kind of beings who can create obligations through the exercise of our will and the invitation of trust. The social practice is just the echo of that moral thunder. To argue otherwise is to reduce the sacred weight of a promise to the trivial rules of a parlor game. We are bound not because we play by the rules, but because we are responsible for the hopes we ignite in others.
