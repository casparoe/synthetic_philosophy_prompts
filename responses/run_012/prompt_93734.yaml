      *   **The Claim:** The policy states the point of QALYs is to put *every* treatment on *one scale* for comparison.
      *   **The Exceptions (Carve-outs):**
          1.  Ultra-rare conditions (Orphan drugs): Funded even if way over threshold (Rule of Rescue/No other option).
          2.  End-of-life/Palliative care: QALY arithmetic isn't decisive (Dignity/Quality of Life at end).
      *   **The Tension:** The policy claims universal commensurability (one scale) but practices exceptions that suggest incommensurability or lexical priority.
