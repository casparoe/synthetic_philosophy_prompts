  2.  **Analyze the Core Mechanism (QALY/CEA):**

      *   *Mathematical requirement:* To divide cost by QALYs and compare to a threshold, you need a single metric. This implies **strong commensurability**. It's not just ranking (A > B); it's measuring magnitude (A is 2x better than B).
      *   *Philosophical presupposition:* Utilitarianism/Consequentialism. Health is a good that can be aggregated. A year of life for Person X is equivalent to a year of life for Person Y (adjusted for quality). Equity/distribution doesn't matter intrinsically, only the sum total.

  3.  **Analyze the Exceptions:**

      *   *Ultra-rare:* "Can't say no when there's no other option." This sounds like the **Rule of Rescue**. It prioritizes the identifiable life over the statistical life. It suggests a deontological constraint or a special duty that overrides utility maximization.
      *   *End-of-Life:* "Quality of life at the end... isn't the kind of thing you price." This explicitly denies commensurability. It says dignity has a value that cannot be expressed in QALYs.
      *   *Implication:* These exceptions admit that the "one scale" claim is false in practice. They introduce **lexical priority** (these values come first) or **incommensurability** (these values can't be measured on the QALY scale).

  4.  **Reconstruct the Implicit Theory:**

      *   *Official Theory:* Aggregative Consequentialism (Maximize total health benefit within budget).
      *   *Operational Theory:* Constrained Maximization. Maximize QALYs *unless* a specific non-quantifiable duty triggers (Rescue, Dignity).
      *   *Tension:* The official theory says "everything fits on the scale." The operational theory says "some things break the scale."
      *   *Is it a bug or feature?* It's likely a "reflective equilibrium" compromise. The math provides discipline for the bulk of decisions, but the exceptions prevent moral outrage. The exceptions are the "honest" acknowledgment of moral reality; the rule is the "administrative" tool.

  5.  **Address Specific Questions:**

      *   *Commensurability vs. Rankability:* QALYs require commensurability (cardinal utility), not just rankability (ordinal utility). You need to know *how much* better to calculate the ratio.
      *   *Exceptions Presuppose:* Incommensurability or Lexical Priority. They treat Rescue/Dignity as "trumps" (Dworkin) over the aggregate good.
      *   *Rival Views Ruled Out:* Strict Egalitarianism (distribution doesn't matter in the main rule), Strict Libertarianism (rights-based absolute vetoes aren't present, only carve-outs), Pure Utilitarianism (ruled out by the exceptions).
      *   *Swap to Pluralism:* If you adopted straight pluralism (no trade-offs), the budget constraint breaks. You can't allocate resources if you can't compare. You'd need a different mechanism (e.g., deliberative committees for every decision, or rigid siloed budgets).
      *   *Bug or Honest?* The carve-out is the honest part. The "one scale" claim is the fiction necessary for bureaucracy.

