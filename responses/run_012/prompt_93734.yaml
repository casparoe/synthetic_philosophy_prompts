answer: |-
  Here is the reconstruction of the implicit theory your hospital system is operating on, broken down by the machinery, the exceptions, and the tension between them.

  ### 1. The Core Machinery: Strong Commensurability
  The Cost-per-QALY rule presupposes **strong commensurability**, not just rankability.

  *   **Rankability (Ordinal):** You can say Treatment A is better than Treatment B.
  *   **Commensurability (Cardinal):** You can say Treatment A produces *exactly three times* the value of Treatment B, and that value is of the same *kind* as the value produced by Treatment C.

  To divide cost by QALYs and compare the result to a single threshold, every health outcome must be reducible to a common currency (the QALY). This presupposes a **consequentialist utilitarian view**: the only thing that matters is the aggregate sum of health benefits produced. It rules out the view that *who* gets the health matters (egalitarianism) or that there are rights-based constraints on how health is distributed (deontology), at least within the main rule. It assumes a year of life for a 20-year-old is mathematically comparable to a year of life for an 80-year-old, adjusted only for quality.

  ### 2. The Exceptions: Lexical Priority and Incommensurability
  The two carve-outs contradict the "one scale" claim. They presuppose **incommensurability** and **lexical priority**.

  *   **Ultra-Rare (Rule of Rescue):** By funding drugs that blow past the threshold because "you can't say no," the system admits that the duty to save an identifiable life trumps the duty to maximize aggregate health. This is a **deontological side-constraint**. It says: *Maximize QALYs, unless doing so requires abandoning someone with no other hope.*
  *   **End-of-Life (Dignity):** By stating QALY arithmetic isn't decisive, the system admits that "dignity" or "peace" is a value that cannot be converted into QALYs. If it could be converted, you would just add it to the numerator. Saying it "isn't the kind of thing you price" asserts **incommensurability**.

  These exceptions treat Rescue and Dignity as **lexically prior** to efficiency. In lexicographic ordering, you satisfy the higher priority value (don't abandon the rare patient; don't undignify the dying) before you even look at the second value (cost-effectiveness).

  ### 3. The Implicit Theory: Constrained Maximization
  Your system's actual operating theory is not pure cost-effectiveness. It is **Constrained Maximization**.

  *   **The Theory:** Maximize total health output (QALYs) subject to a fixed budget, *subject to* hard moral constraints (Rescue, Dignity) that are immune to trade-offs.
  *   **The Policy Document's Claim:** The document claims the QALY puts *everything* on one scale. This is false. The QALY puts *most* things on one scale, but the exceptions acknowledge a second scale (moral duty/dignity) that cannot be converted into the first.
  *   **Rival Views Ruled Out:**
      *   **Pure Utilitarianism:** Ruled out by the exceptions (a pure utilitarian would fund the rare drug only if it beat the threshold).
      *   **Strict Egalitarianism:** Ruled out by the main rule (which ignores distribution in favor of total sum).
      *   **Libertarian/Rights-Based:** Ruled out because the exceptions are limited carve-outs, not universal rights. You still ration care for non-rare, non-terminal conditions based purely on cost.
  *   **Rival Views Accommodated:**
      *   **Moderate Pluralism:** The system fits a view where efficiency is the default, but specific moral intuitions act as veto powers.

  ### 4. The Tension: The "One Scale" Fiction
  The two halves are pulling against each other.
  *   **The Pull:** The main rule requires you to ignore the *source* of the health benefit. The exceptions require you to look specifically at the *source* (is this rare? is this end-of-life?).
  *   **The Conflict:** If dignity is incommensurable, you cannot logically have a threshold. If you have a threshold, you have admitted commensurability. By keeping the threshold *and* the exceptions, the system is engaging in a bureaucratic fiction: it pretends the exceptions are just "adjustments" to the math, when they are actually suspensions of the math.

  ### 5. Swapping in a Straight Pluralist View
  If you swapped in a straight pluralist view (where values like Efficiency, Rescue, and Dignity do not trade off at all), the current budgeting mechanism would collapse.

  *   **Current State:** You have one pot of money. The QALY rule tells you how to slice it. The exceptions take a slice out first.
  *   **Pluralist State:** If values don't trade off, you cannot decide between spending $1M on palliative care (Dignity) vs. $1M on hip replacements (Efficiency). There is no common metric to decide which pot gets the money.
  *   **Required Change:** You would need **siloed budgets** determined by political negotiation, not administrative calculation. You would decide politically "10% of the budget is for Dignity, 90% for Efficiency," and never allow money to move between them. The administrative role shifts from *calculating value* to *policing boundaries*.

  ### 6. Bug or Honest Part?
  The carve-out is the **honest part**. The "one scale" claim is the bug (or rather, the necessary lie).

  *   **Why:** Human moral intuition rejects pure aggregation. We feel a stronger duty to the drowning child in front of us (Rescue) than to the statistical lives saved by sanitation (Efficiency). We feel that dying with dignity is a right, not a commodity.
  *   **The Function:** The QALY machinery provides **discipline** for the 90% of decisions where moral intuition is fuzzy or silent. It prevents bias and waste. The carve-outs provide **legitimacy** for the 10% of decisions where the math yields morally repugnant results.
  *   **Conclusion:** The system works *because* of the inconsistency. If you removed the carve-outs, the system would be logically consistent but morally intolerable. If you removed the QALY rule, the system would be morally flexible but fiscally unmanageable. The "inconsistency" is the price of having a system that is both solvent and humane. The policy document is wrong to claim the QALY covers everything; the practice is right to admit it doesn't.
