answer: |-
  **TO:** Members of the Judicial Committee
  **FROM:** [Your Name], Student Member
  **RE:** Upcoming Appeal regarding Student Activity Fee Travel Bylaw
  **DATE:** [Date]

  **I. Recommendation**
  I recommend that the Committee **uphold the Treasurer's denial** of funds. While the equities of the club's situation are understandable, the Bylaw's text is unambiguous. To decide otherwise would require us to prioritize drafters' intent over enacted language, a practice that undermines the stability of our code.

  **II. The Textual Case**
  The Bylaw states: "No student organization may use Student Activity Fee funds to pay the travel expenses of any individual who is not a *currently* enrolled student."

  The strongest case for following this text rests on the amendment history. Two years ago, the student body voted to insert the word "currently." This deliberate addition signals a specific focus on enrollment status at the time of travel. It distinguishes between those who are enrolled and those who are not (including alumni, who were *formerly* enrolled, and external coaches, who were *never* enrolled).

  If the drafters intended to create an exception for "necessary staff" or "essential coaches," they had the opportunity to write it. They did not. They chose the broad phrase "any individual." To read a "necessity" exception into this text is not to interpret the law, but to rewrite it. The text draws a bright line at enrollment; we are not authorized to move that line because the result in this specific case seems harsh.

  **III. Precedent and the Purposive Appeal**
  I acknowledge the Committee's precedent from the equipment dispute two years ago, where we resolved ambiguity by asking what the provision was *for* rather than what it *said*. I also acknowledge the amendment minutes, which indicate the target was subsidizing alumni and outside advisers. The Club argues their coach is not an "adviser" in the pejorative sense intended by the minutes, but a necessary operational staff member.

  A purposive reading would likely favor the Club. It aligns the outcome with the perceived spirit of the amendment: preventing perk-seeking rather than hindering competition. However, we must be honest about the cost of this approach. Purposive interpretation trades predictability for flexibility. When we ask "what was this for?" rather than "what does this say?", we force every student organization and Treasurer to guess at our subjective understanding of legislative intent. Minutes are often incomplete or silent (as they are here regarding necessary staff). Relying on them makes the law unstable. A Treasurer cannot confidently deny funds today if they fear we will ignore the text tomorrow based on unwritten intentions.

  **IV. Methodological Commitment**
  This case forces us to answer a threshold question: Can this Committee move between textual and purposive methods from one case to the next?

  I argue we cannot. Switching methods based on the desired outcome of a specific case creates arbitrariness. It suggests that the method is merely a tool to reach a conclusion, rather than a constraint on our power. If we used a textualist approach in a case where the text favored a strict outcome, we cannot switch to purposivism here simply because the text favors a strict outcome we dislike. Consistency in method is the only way to ensure that like cases are treated alike.

  **V. Why the Enacted Words Bind Us**
  If we must commit to a single method, it must be textualism. The ground for this commitment is democratic legitimacy within our student government.

  Students vote to enact the *words* of the Bylaws. They do not vote on the minutes of the debate, nor do they vote on the subjective intentions of the sponsors. The minutes are a record of discussion, not law. When we prioritize the drafters' intentions over the enacted words, we bind the student body to rules they never actually approved. The text is the only object that underwent the formal process of ratification. Therefore, the text is the only thing that binds us.

  **VI. Rule for Future Cases**
  Going forward, this Committee should adopt the following rule of construction: **Bylaws shall be interpreted according to their plain meaning. Extrinsic evidence of intent (such as minutes) may only be consulted if the text is genuinely unintelligible or leads to an absurdity that the text cannot bear.**

  In this case, the text is not unintelligible. It prohibits payment for non-students. The coach is a non-student. The denial must stand. We should advise the Club that if they require funding for coaches, they must seek an amendment to the Bylaw, not an exception from the Committee.

  **VII. Conclusion**
  Upholding the denial preserves the integrity of the Code. It respects the student body's vote on the text over the drafters' unenacted intentions. It provides a clear rule for Treasurers and Clubs moving forward. I urge the Committee to join me in this disposition.
