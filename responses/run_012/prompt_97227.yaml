  2.  **Drafting Section 1: Translation of Positions:**
      *   *Fischer's Thesis:* Needs to sound like a prosecution case. Germany is the principal offender.
          *   *Mens Rea:* Intent (*dolus directus* or *dolus eventualis*). The "Griff nach der Weltmacht" implies a planned objective.
          *   *Actus Reus:* The Blank Cheque, the invasion of Belgium.
          *   *Causation:* But-for cause. Without German encouragement, Austria wouldn't have acted; without German mobilisation, France/Russia wouldn't have reacted so fatally.
          *   *Continuity:* Recidivism. 1914 is the first count, 1939 is the second count of the same indictment.
      *   *Revisionist (Clark) Thesis:* Needs to sound like a defence of "no single liable party" or a complex multi-party tort.
          *   *Mens Rea:* Negligence at best, or lack of capacity. "Sleepwalkers" implies unconsciousness or lack of specific intent.
          *   *Causation:* Overdetermination. Multiple sufficient causes.
          *   *Liability:* Joint and several, but diluted by contributory fault of all parties.
          *   *Intervening Acts:* Each mobilisation is a *novus actus* breaking the chain from the previous one.
      *   *Flagging Assumptions:* I need to explicitly state where I am forcing state actions into individual criminal/tort concepts (e.g., treating "Germany" as a legal person capable of *mens rea*).

  3.  **Drafting Section 2: The Residue Report:**
      *   *Clean Translations:*
          *   The Blank Cheque -> Authorisation/Accessory liability (aiding and abetting).
          *   Septemberprogramm -> Evidence of intent (though post-dating the act, so admissibility issues).
          *   July Crisis -> Chain of intervening acts (remoteness).
      *   *Distorted Translations:*
          *   "Primary Responsibility" -> Legal causation usually binary (liable/not liable), not scalar. "Primary" implies a degree of fault not easily captured by "but-for."
          *   "Collective Responsibility" -> Corporate liability exists, but national liability is abstract. Who is the *directing mind and will*? The Kaiser? Bethmann-Hollweg? The General Staff?
      *   *No Counterpart:*
          *   Structural/Overdetermined Causation -> In law, if A and B both shoot C, both are liable. In history, if the *system* causes war, who is the defendant?
          *   "Sleepwalking" -> In law, automatism is a defence, but applied to states, it negates agency entirely.
      *   *Trivial/Vacuous:*
          *   If "everyone is liable," does it mean "no one is liable"? In tort, joint and several liability still means you pay. In history, "shared guilt" often functions as "no specific guilt."

  4.  **Drafting Section 3: Article 231 (Versailles):**
      *   *Fact:* It didn't say "guilt" (*Schuld*), it said "responsibility" (*Verantwortlichkeit*).
      *   *Legal Coherence:* It was a liability clause for reparations (tortious damages), not a criminal conviction.
      *   *The Confusion:* The friend argues they confused liability with blame.
      *   *Analysis:* In law, strict liability exists. You can be liable without moral blame. The Allies wanted a legal hook for money. The German public read it as criminal blame. The drafters were legally coherent (establishing a basis for damages) but politically naive about how it would be received (moral stigma).

  5.  **Drafting Section 4: Conclusion (The Loose Ends):**
      *   *Surviving the Residue:* To make the dispute legal, you need to identify the *directing mind*. Without that, it's a category error.
      *   *Standard of Proof:* Is the dispute about facts or the burden? Fischer requires "beyond reasonable doubt" of intent. Clark suggests the evidence only supports "balance of probabilities" for negligence across multiple parties.
