      *   **Key Concepts to Translate:** Fischer's thesis (German primary responsibility, continuity 1914-1939) vs. Revisionist thesis (shared responsibility, sleepwalkers, no single will).
      *   **Key Legal Concepts to Use:** But-for causation, legal causation, remoteness, intervening acts (*novus actus interveniens*), joint and several liability, contributory fault, *actus reus*, *mens rea*, accessory/command liability, standard of proof.
      *   **Output Sections:**
          1.  Translation of Historical Positions into Legal Terms.
          2.  Residue Report (What translates cleanly, what distorts, what has no counterpart).
          3.  Analysis of Article 231 (Versailles).
