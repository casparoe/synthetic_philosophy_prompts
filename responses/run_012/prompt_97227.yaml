  6.  **Review and Refine (Self-Correction/Polishing):**
      *   *Tone:* Professional, precise, British English (e.g., "defence," "programme," "centre").
      *   *Check Constraints:* Did I flag the importation of individual agency? Yes. Did I address the Septemberprogramm? Yes. Did I address the Blank Cheque? Yes.
      *   *Legal Accuracy:* Ensure terms like *novus actus interveniens*, *dolus eventualis*, and "directing mind and will" are used correctly in context.
      *   *Historical Accuracy:* Ensure Fischer and Clark are represented fairly within the legal metaphor. Fischer = Intentional Tort/Crime. Clark = Complex Accident/Negligence.
      *   *Residue:* Make sure the distinction between scalar responsibility (history) and binary liability (law) is clear.

  7.  **Final Polish:** Check flow and ensure the "Residue Report" is the highlight as requested. (The prompt says "Then give me the residue report, which is the part I care about." I should ensure this section is robust).

  *(Self-Correction during drafting)*: I need to be careful not to say Fischer is *right* or Clark is *right*. I am translating their *arguments*.
  *(Self-Correction on Article 231)*: Ensure I distinguish between the legal basis for reparations and the moral perception of war guilt.
  *(Self-Correction on "Primary")*: In joint tortfeasors, one can be more culpable, but liability is often joint and several. The historical "primary" is more about *originating* cause than *legal* liability. I need to highlight this friction.

