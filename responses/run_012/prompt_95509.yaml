answer: |-
  Here is a state-of-the-question breakdown of the desiderata for a theory of convention. This list distinguishes between the "hard core" of the concept (what almost everyone agrees on) and the "protective belt" (where the Lewisian rationalists and the evolutionary game theorists diverge). It also flags the genuine incompatibilities you suspected.

  ### I. The Non-Negotiables (The Hard Core)
  *These are the requirements nearly all parties accept. If a theory fails these, it isn't describing convention in the game-theoretic sense; it's describing something else (habit, law, or natural necessity).*

  **1. The Multiplicity of Equilibria (Arbitrariness)**
  *   **The Requirement:** The situation must present at least two distinct stable solutions (equilibria) where everyone is better off coordinating than not coordinating.
  *   **The Case:** This distinguishes convention from a "natural" solution. If there is only one way to avoid crashing (e.g., "don't drive off the cliff"), following it isn't a convention; it's rational necessity. A convention exists only if we *could* have coordinated on the alternative (e.g., driving on the left) with equal success.
  *   **Why it matters:** It rules out accounts that treat conventions as simply "the efficient thing to do." Efficiency doesn't create convention; the existence of *alternative* efficiencies does.

  **2. Interdependence of Preference (Conditional Cooperation)**
  *   **The Requirement:** An agent's preference for performing the action must be conditional on the expectation that others will perform it.
  *   **The Case:** This distinguishes convention from parallel habit or independent regularity. If I drink coffee at 8:00 AM and you drink coffee at 8:00 AM, but I would drink it at 8:00 AM regardless of what you do, that is not a convention. In a convention, my reason for doing $X$ is that *you* are doing $X$.
  *   **Why it matters:** This is the primary filter against "mere regularity." It ensures the behavior is socially connected, not just statistically correlated.

  **3. Stability (Resistance to Unilateral Deviation)**
  *   **The Requirement:** Once established, no single agent has an incentive to deviate from the regularity, provided others stick to it.
  *   **The Case:** This captures the "binding" nature of convention without necessarily invoking morality. If I start driving on the left while everyone else drives on the right, I crash. The convention holds because deviation is self-punishing in the context of the group's behavior.
  *   **Why it matters:** It explains why conventions persist without a police force. The payoff structure itself punishes the deviator.

  ---

  ### II. The Contested Desiderata (The Protective Belt)
  *Here is where the "Rationality-and-Common-Knowledge" camp (Lewis, Gilbert) clashes with the "Evolutionary-and-Learning" camp (Skyrms, Young, Binmore). You must specify which camp your theory serves, as these are not jointly satisfiable in their strong forms.*

  **4. The Epistemic Requirement (Common Knowledge vs. Empirical Belief)**
  *   **The Lewisian Commitment:** Agents must have *common knowledge* of the convention (I know it, you know it, I know that you know it, ad infinitum).
  *   **The Evolutionary Commitment:** Agents need only have empirical beliefs based on past observations or genetic programming. They do not need to reason about others' reasoning.
  *   **The Disagreement:** Lewisians argue that without common knowledge, the coordination is fragile or accidental. Evolutionists argue common knowledge is psychologically impossible for humans and impossible for animals, yet animals clearly have conventions (e.g., territorial boundaries).
  *   **Status:** **Contested.** This is the main fault line in the literature.

  **5. The Mechanism of Sustainability (Expectation vs. Sanction)**
  *   **The Lewisian Commitment:** Conventions are self-enforcing via *expectations*. Sanctions (disapproval, punishment) are secondary or unnecessary. If you need a threat to keep people in line, it's a norm or a law, not a pure convention.
  *   **The Normativist Commitment:** Conventions often drift into norms. Once a convention is established, deviation often triggers social sanctions (disapproval), which then become part of the reason for conformity.
  *   **The Disagreement:** Is a convention defined by the *absence* of external sanctions, or can it survive even if sanctions become the primary motivator?
  *   **Status:** **Contested.** Many modern theorists argue the line between convention and norm is a spectrum, not a binary.

  **6. The Agency Requirement (Hyper-Rationality vs. Bounded Rationality)**
  *   **The Lewisian Commitment:** Agents are capable of complex reasoning about equilibria and mutual expectations.
  *   **The Evolutionary Commitment:** Agents can be boundedly rational, following simple heuristics (e.g., "copy the majority"), or non-cognitive (biological traits selected for fitness).
  *   **The Disagreement:** Can a convention exist among creatures who do not understand they are coordinating?
  *   **Status:** **Contested.** The evolutionary camp says yes; the strict Lewisian camp says no.

  ---

  ### III. Genuine Tensions (Incompatibilities)
  *You suspected a tension between common knowledge and non-cognitive agents. You are correct. This is not just a hunch; it is a formal incompatibility.*

  **1. Common Knowledge vs. Evolutionary Emergence**
  *   **The Tension:** You cannot satisfy the **Common Knowledge** requirement and the **Non-Cognitive Agency** requirement simultaneously.
  *   **The Result:** If you insist on Common Knowledge, you rule out conventions in animals, infants, and arguably most adult human interactions (since we rarely verify infinite recursive knowledge). If you insist on explaining conventions in these populations, you must drop Common Knowledge in favor of adaptive dynamics or salience.
  *   **Verdict:** This is a real result. Most contemporary work has moved toward weakening the epistemic requirement to accommodate evolutionary explanations.

  **2. Stability vs. Switchability (The "Sweden" Problem)**
  *   **The Tension:** A convention must be stable enough to persist (Desideratum 3), but the theory must also explain how a population can switch from one equilibrium to another (e.g., Sweden changing from left-hand to right-hand traffic).
  *   **The Result:** If a convention is too stable (a deep "basin of attraction"), switching is impossible without catastrophe. If it is too fragile, it isn't a convention.
  *   **The Resolution:** Theories must account for *path dependence* and *focal points*. Switching usually requires an external shock or a coordinated "reset" (often state-managed, as in Sweden) that temporarily alters the payoff structure or salience, allowing the population to jump to the new equilibrium. A theory that predicts permanent lock-in fails the Sweden test.

  **3. Arbitrariness vs. Optimality**
  *   **The Tension:** Conventions are arbitrary (Desideratum 1), but populations often seem to converge on the *best* convention over time (e.g., QWERTY vs. Dvorak, though QWERTY is a counter-example of stickiness).
  *   **The Result:** If a theory claims conventions always converge on the optimal solution, it fails the Arbitrariness test. If it claims they are purely random, it fails to explain why some conventions are universal.
  *   **Verdict:** An adequate theory must allow for **suboptimal stability**. It must explain why we stick with a "worse" convention (like QWERTY or Imperial measurements) simply because the coordination cost of switching outweighs the efficiency gain of the new standard.

  ---

  ### IV. The "Killer" Requirement
  *You asked which single requirement does the most to rule out popular accounts.*

  **The Winner: Interdependence of Preference (Conditional Cooperation)**

  While **Arbitrariness** is the most famous Lewisian criterion, **Interdependence of Preference** is the most exclusionary technical requirement.

  *   **Why:** It rules out the two most common conflations in popular and legal discourse.
      1.  **It rules out "Natural" Regularities:** It distinguishes convention from behavior caused by environmental constraints (e.g., "everyone wears coats in winter" is not a convention; "everyone wears ties to work" is).
      2.  **It rules out "Coercive" Norms:** It distinguishes convention from law or moral obligation backed solely by force. If I stop at a red light *only* because I fear a fine, and would run it if the police were gone, that is compliance, not convention. If I stop because I expect *you* to expect *me* to stop (and we both want to avoid crashing), that is convention.

  Most popular accounts treat convention as "anything people do regularly." The Interdependence requirement cuts that field down by 90%. It forces the theory to explain *why* the behavior is socially contingent, not just statistically frequent.

  ### V. Summary of the State of Play

  1.  **Settled:** Conventions solve coordination problems with multiple equilibria. They are arbitrary in origin but stable in practice. They rely on the interdependence of agents' choices.
  2.  **Contested:** Whether agents need *common knowledge* or just *belief*. Whether conventions can exist without *rational deliberation*. Whether *sanctions* disqualify a regularity from being a convention.
  3.  **The Hard Trade-off:** You generally have to choose between a **High-Rationality/High-Epistemic** model (Lewis) that is precise but psychologically unrealistic, or a **Low-Rationality/Low-Epistemic** model (Evolutionary) that is realistic but less precise about the "normative" feel of convention.
  4.  **Your Hunch:** Confirmed. The Common Knowledge requirement is incompatible with explaining conventions in non-cognitive or boundedly rational agents. Modern literature largely treats Common Knowledge as an idealization rather than a literal requirement.

  For your "state of the question," the most honest approach is to present **Interdependence** and **Arbitrariness** as the definitional core, while treating **Common Knowledge** as the specific commitment of the Lewisian camp that the Evolutionary camp explicitly rejects to solve the problem of emergence.
