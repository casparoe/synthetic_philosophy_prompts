at have no common knowledge" requirement are in genuine tension, and I'd like to know whether that's a real result or just me. And if you can, tell me which single requirement does the most to rule out the popular accounts.

  One thing I care about a lot here: separate what's actually settled among people who work on this from what's genuinely contested, and dont serve me a contested reading as if it were the consensus. I'd rather have a shorter, honest list that flags the live disagreements than a tidy one that papers over them. And it's going to a US audience, so please write in American English, and skip the bibliography -- I can find sources myself.
