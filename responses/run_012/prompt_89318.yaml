  **MEMORANDUM**

  **TO:** Members of the Biosafety and Ethics Committee
  **FROM:** Dr [Your Name], Committee Member
  **DATE:** 20 October 2023
  **SUBJECT:** Pre-Meeting Decision Note: Protocol SB-2023-09 (Minimal Protocell Replication)

  **1. Purpose**

  This note circulates ahead of our scheduled meeting next Thursday regarding Protocol SB-2023-09. The proposing team seeks authorisation to construct a minimal self-replicating protocell. Their ethical and safety justification relies heavily on a specific theoretical framework: Hofstadter's 'Typogenetics'. They argue that by instantiating a formal loop wherein the system encodes the instructions for its own construction and maintenance, they have satisfied the necessary conditions for 'selfhood', thereby negating unique ethical risks associated with novel life forms.

  A preliminary objection has been raised within the Committee—specifically regarding the ontological status of 'self-replication'—which I believe requires resolution before we can vote. This memo outlines my assessment and a proposed way forward.

  **2. Assessment of the Theoretical Claim**

  The proposing team contends that because their chemical system mirrors the logical structure of Gödelian self-reference (a description, a reader, a copier, and a description of the whole), the resulting entity possesses a 'self' in a meaningful sense. They imply this logical closure renders the system stable and ethically transparent.

  I am minded to agree with the objection raised by our colleague in Chemistry that this conflates formal isomorphism with physical reality. That a chemical process can be *described* as self-referential does not necessarily mean the physical boundary between the 'self' and the 'environment' is robust. As the objection notes, a photocopier that copies its own manual can be described as self-replicating if one draws the boundary loosely enough. The Gödelian trick is a feature of the description, not necessarily of the molecules.

  On this specific philosophical point, the objection holds water. We cannot approve the protocol on the assumption that a logical loop grants the protocell ontological independence or inherent stability. The 'self' in 'self-replicating' remains, in this context, an observer-relative label.

  **3. Biosafety Implications**

  However, whilst the chemist is correct regarding the metaphysics, the conclusion that the protocol should be rejected outright overlooks the practical biosafety imperative. Whether or not the protocell possesses a 'true' self is irrelevant to the risk assessment; what matters is whether it behaves *as if* it does.

  If the system functionally closes the loop—producing enzymes that maintain its membrane and replicate its genetic material—it achieves *functional autonomy*. For the purposes of containment, a system that acts like a self-replicator is indistinguishable from one that 'is' a self-replicator. The risk is not in the philosophy, but in the exponential growth potential and the potential for evolutionary drift once the system is operational.

  Therefore, we cannot reject the protocol simply because the team's philosophical justification is overstated. We can, however, reject the *current* risk assessment because it relies on that overstatement to claim safety.

  **4. Recommendation**

  I recommend that the Committee moves to **Approve with Conditions**.

  We should not block the research, as the scientific value is clear, but we must decouple the safety approval from the philosophical claim. The team must demonstrate safety based on physical containment and chemical kinetics, not on logical closure.

  **5. Required Conditions**

  Approval is contingent upon the submission of a revised Risk Assessment within **14 days**, addressing the following:

  *   **Operationalising the Boundary:** The team must define the physical boundary of the 'self' without recourse to information theory. Where, physically, does the protocell end and the medium begin? This addresses the chemist's concern regarding arbitrary boundary drawing. We need a material definition (e.g., lipid bilayer integrity) that dictates when replication has occurred.
  *   **Fidelity and Error Rates:** The Typogenetics model assumes perfect translation. The risk assessment must account for chemical noise. If the 'self-description' degrades over generations, does the system become parasitic or toxic? We require data on replication fidelity limits.
  *   **Containment Strategy:** Containment must be designed for a system that *might* evolve beyond its initial logical constraints. The safety case cannot rest on the system remaining 'true' to its initial code.

  **6. Conclusion**

  This approach allows us to acknowledge the validity of the scepticism regarding the 'self' claim without stifling the research. It shifts the burden of proof back to where it belongs: on the physical behaviour of the molecules, rather than the elegance of the analogy.

  I propose we adopt this position as the Committee's baseline for Thursday's discussion. If the team can meet these conditions, the philosophical disagreement becomes moot for the purposes of biosafety.

  **Dr [Your Name]**
  Committee Member
