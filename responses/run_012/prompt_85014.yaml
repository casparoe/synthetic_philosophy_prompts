      *   This is the classic "Strategy Stealing Argument."
      *   **Premise:** Symmetric game, no draws, finite, perfect information.
      *   **Argument:** Assume Player 2 has a winning strategy $S$. Player 1 makes an arbitrary move $m_1$. Then Player 1 pretends to be Player 2, using $S$ to respond to Player 2's moves. If $S$ calls for a move already made (specifically $m_1$), Player 1 makes another arbitrary move.
      *   **Conclusion:** Player 1 has a winning strategy, contradicting the assumption that Player 2 has one. Thus Player 1 must win.
      *   **The Flaw:** The flaw lies in step (4), specifically the clause: "if S ever tells them to make a move that's already been made, they just do some other legal move instead, since being one move ahead of the other player isn't a disadvantage."
      *   **Why it's a flaw:** This assumes that having an extra piece on the board (the arbitrary first move) is never a disadvantage. In some games (like Nim), having extra pieces removed or extra options taken can be disadvantageous. In games like Hex or Chomp, having an extra piece of your color is generally an advantage (monotonicity). The argument relies on the property that an extra move never hurts you. This is not true for all symmetric games (like Nim), but it is true for specific games (like Hex).
      *   **Consensus:** The Strategy Stealing Argument is a well-known non-constructive proof technique. It is settled mathematics that it proves Player 1 cannot lose (win or draw) in games where an extra move is never a disadvantage. It does *not* prove Player 1 wins in all symmetric games (because draws might be possible, or extra moves might hurt). In the specific context of Hex (no draws), it proves Player 1 has a winning strategy, but doesn't tell you what it is.

