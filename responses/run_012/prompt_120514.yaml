answer: |-
  **To:** Standards Committee Member
  **From:** Legal Theory Interface
  **Subject:** Restatement of the Hart–Fuller Debate in Compiler Vocabulary

  Here follows the restatement of the Hart–Fuller debate, translated into the vocabulary of language standardisation and compiler engineering.

  ### I. The Positions Restated

  #### 1. The Positivist Position (Hart)
  **The Standard as Social Fact**
  For the Positivist, the validity of a standard is determined solely by its source. The 'Rule of Recognition' is the committee's formal process: the drafting, the ballot, the publication of ISO/IEC N-documents. If a document emerges from this process, it is *the Standard*.

  A program is 'valid' (conforming) if it satisfies the syntactic and semantic constraints laid out in the text. It matters not whether the standard is efficient, safe, or morally desirable. If the committee ratifies a clause permitting Undefined Behaviour (UB) in a specific context, that UB is a valid feature of the standard. The separation of 'Standard' and 'Engineering Best Practice' is absolute. One can say, "This is a conforming program, though it relies on optimisation hooks that render it unsafe."

  **Translation Analysis:**
  *   **Clean:** The Rule of Recognition maps cleanly to the standardisation process (WG14/WG21 procedures). Validity maps cleanly to conformance (strictly well-formed).
  *   **Distorted:** Hart's 'minimum content of natural law' (survival) maps awkwardly to 'minimum viability'. A standard can be technically valid even if no one uses it, whereas law must arguably aim for social survival.
  *   **Inexpressible:** The concept of 'wickedness'. A standard can be poorly designed, but it cannot be 'evil' in the moral sense. The Positivist separation of law and morals becomes a separation of specification and utility.

  #### 2. The Natural Law Position (Fuller)
  **The Inner Morality of the Standard**
  For the Natural Lawyer, a document cannot function as a standard merely because the committee stamped it. It must possess an 'Inner Morality of Standardisation'. These are procedural constraints that make the document capable of guiding action:
  1.  **Generality:** Rules must apply to all implementations, not specific vendors.
  2.  **Promulgation:** The standard must be published and accessible.
  3.  **Non-Retroactivity:** Changes must not break existing conforming programs without a deprecation cycle.
  4.  **Clarity:** The prose must not be ambiguous (avoiding excessive reliance on UB).
  5.  **Non-Contradiction:** The standard must not mandate mutually exclusive behaviours.
  6.  **Possibility of Compliance:** It must be physically possible to implement the standard.
  7.  **Constancy:** The standard cannot change so frequently that conformance is impossible to maintain.
  8.  **Congruence:** The behaviour of compilers must match the specification.

  If a 'standard' violates these principles (e.g., it is contradictory, or requires impossible optimisation), it is not merely a bad standard; it fails to be a standard at all. It is noise. A program written against such a document is not 'conforming'; it is merely processing noise.

  **Translation Analysis:**
  *   **Clean:** The eight desiderata map remarkably well to 'Drafting Quality' and 'Implementability'. A contradictory standard is legally void in Fuller's view; in compiler terms, it is ill-formed.
  *   **Distorted:** Fuller's morality is ethical; the standard's 'morality' is functional. A standard that fails these tests is useless, not unjust.
  *   **Inexpressible:** The dignity of the subject. Fuller argues that bad law insults human agency. A bad standard insults the compiler engineer's time, but not their moral agency.

  ---

  ### II. Specific Analogies

  **Undefined Behaviour (UB) as Open Texture**
  *   **Hart:** Open texture is necessary for the law to adapt to unforeseen circumstances.
  *   **Compiler:** UB is often introduced to allow hardware mapping or optimisation without over-constraining the implementation.
  *   **Distortion:** In law, open texture is resolved by a judge aiming for justice. In code, UB is resolved by the hardware/OS, often resulting in security vulnerabilities or crashes. UB is a 'zone of non-law' where the standard abdicates authority.

  **Implementation-Defined Behaviour (IDB) as Delegated Discretion**
  *   **Hart:** Judges/Officials have discretion within the rule.
  *   **Compiler:** The implementation chooses the behaviour (e.g., endianness, size of `int`) but must document it.
  *   **Fit:** This is a high-fidelity translation. Both require the authority to publish their decision so the subject (citizen/programmer) can plan accordingly.

  ---

  ### III. The Residue Report

  Here we examine what remains unaccounted for when the legal concepts are forced into the compiler vocabulary.

  #### 1. The Internal Point of View
  *   **Legal:** Officials and citizens accept the rules as binding reasons for action, not merely because they fear sanctions.
  *   **Compiler:** Programmers and compiler writers accept the standard as binding to ensure portability and interoperability.
  *   **Residue:** The legal internal point of view carries a sense of *obligation*. The compiler internal point of view carries a sense of *pragmatic necessity*. If I ignore the law, I am a criminal. If I ignore the standard, I am a vendor with a non-portable product. The normativity of legal obligation is reduced to a hypothetical imperative: "If you want portability, you ought to conform." The categorical 'ought' is lost.

  #### 2. The Grudge Informant
  *   **Legal:** A citizen uses a validly enacted statute to denounce a rival, knowing the statute is wicked. Hart says the law is valid; Fuller says the system failed its inner morality.
  *   **Compiler:** A programmer writes a conforming program that exploits UB to corrupt memory or bypass security checks (e.g., 'standard-compliant malware' or 'type-punning exploits').
  *   **Residue:** In law, the harm is to rights and liberty. In code, the harm is to system integrity. The 'Grudge Informant' in code is often celebrated as an 'optimisation expert' or 'security researcher'. The moral revulsion required for the debate to matter is absent. The standard does not care if the program is malicious, only if it is well-formed.

  #### 3. Open Texture vs. Undefined Behaviour
  *   **Legal:** Open texture allows the law to breathe and adapt to new social realities via interpretation.
  *   **Compiler:** UB often represents a failure of the standard to define the abstraction, delegating it to the metal.
  *   **Residue:** Hart views open texture as a virtue of a living system. In compiler engineering, UB is often viewed as a technical debt or a hazard. The 'life' of the law is replaced by the 'stability' of the ABI.

  #### 4. Law As It Is vs. Law As It Ought To Be
  *   **Legal:** Hart insists we must distinguish the existing law from what we wish it to be, to critique it clearly.
  *   **Compiler:** We distinguish the current Standard (e.g., C++17) from the Proposal/Working Draft (C++2x).
  *   **Residue:** In law, the 'ought' is moral. In standards, the 'ought' is technical (better performance, safety, ergonomics). The distinction survives, but the stakes are lowered from justice to engineering utility.

  ---

  ### IV. Conclusion: Defect or Ambiguity?

  Does the residue point to a defect in the compiler vocabulary, or to something in the legal debate that is less clear than it looks?

  It points to **both**, but primarily to a category error in the translation.

  1.  **Defect in Compiler Vocabulary:** The vocabulary of conformance is fundamentally instrumental. It describes a relationship between a text and a machine. It lacks the vocabulary of *rights*, *harm*, and *justice*. Therefore, it cannot capture the normativity of law. The 'Internal Point of View' in coding is always contingent on a goal (portability). The 'Internal Point of View' in law is often constitutive of citizenship. The compiler vocabulary cannot express the 'ought' of obligation, only the 'ought' of function.

  2.  **Ambiguity in the Legal Debate:** However, the translation also reveals that Hart and Fuller may be arguing past one another regarding *functionality*. Fuller's argument is strongest when viewed through the compiler lens: a system that is contradictory, secret, or retroactive *cannot function* as a guide. This suggests that Fuller's 'Inner Morality' is not actually moral, but functional. It is the 'Inner Logic' of law.
      *   If Fuller is right, then 'Law' is defined by its ability to guide conduct.
      *   If Hart is right, 'Law' is defined by its source, regardless of its ability to guide.

  The compiler analogy suggests Fuller has the stronger technical argument: a standard that is impossible to implement is not a standard. However, Hart retains the stronger political argument: a standard can be authoritative (enforced by the committee) even if it is broken.

  **Final Verdict:**
  The residue indicates that the legal debate relies on a dual nature of law that code does not possess: law is both a **technical system of rules** and a **moral claim on conduct**. The compiler vocabulary captures the technical system perfectly (Hart's validity, Fuller's implementability) but strips away the moral claim. Consequently, the 'Grudge Informant' loses their sting, and 'Obligation' becomes 'Constraint'.

  The debate is not less clear; rather, the compiler vocabulary reveals that much of what Fuller calls 'Morality' is actually 'Engineering Hygiene'. The true divergence remains in the domain the compiler cannot touch: the justification of force against the human subject. In code, the 'force' is a compilation error. In law, it is the loss of liberty. That residue is not a defect in your vocabulary, sir; it is the boundary of your domain.

  Yours faithfully,

  **The Interface**
