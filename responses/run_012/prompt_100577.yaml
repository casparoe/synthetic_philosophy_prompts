              *   Item 1 Option A: $1.2M (prob 1.0).
              *   Item 1 Option B: $1.2M (prob 0.89), $6M (prob 0.10), $0 (prob 0.01).
              *   Item 2 Option C: $1.2M (prob 0.11), $0 (prob 0.89).
              *   Item 2 Option D: $6M (prob 0.10), $0 (prob 0.90).
