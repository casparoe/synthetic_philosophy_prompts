              *   Item 2: "$1.2 million with probability 0.11 and nothing otherwise, or $6 million with probability 0.10 and nothing otherwise." -> This matches Options C and D above.
              *   *Linkage:* The text says "The contingencies are shared — the 0.89 and the 0.11 are two faces of the same event...".
              *   Standard Allais Paradox:
                  *   Choice 1: 1A ($1M certain) vs 1B (10% $5M, 89% $1M, 1% $0).
                  *   Choice 2: 2A (11% $1M, 89% $0) vs 2B (10% $5M, 90% $0).
                  *   Common preference: 1A and 2B. This violates Expected Utility Theory (Independence Axiom).
                  *   Here: $1.2M certain vs (0.89 $1.2M + 0.10 $6M + 0.01 $0). And (0.11 $1.2M + 0.89 $0) vs (0.10 $6M + 0.90 $0).
                  *   If you choose Certain in Item 1 and $6M chance in Item 2, you violate independence.
                  *   Consultant says: "the combination most of us are drawn to, the guaranteed sum in the first item and the $6 million chance in the second, cannot be made coherent... violates the independence condition... counterparty... could arrange a sequence of transactions that would leave us worse off for certain" (Money Pump argument).
      *   **Committee Dynamics:**
          *   Consultant: Says choose coherently (likely Expected Utility max). Points out money pump risk.
          *   Trustee Argument: Charity not casino. Flagship programme cannot risk 1% collapse. Item 2 is restricted money, morally separate.
          *   Policy: Adopted 2 years ago. Assess each opportunity independently, without regard to source or other agenda items.
          *   Stakeholders: Peer foundations follow published reasoning. Minutes/Annual Report matter.
      *   **Requirements for the Letter:**
          *   Clear recommendation on each of the two items.
          *   View on the policy clause (stand, amend, read narrowly).
          *   Reasoning including strongest version of the rejected case (fair terms).
          *   Address if consultant framed it distortingly.
          *   No literature review/references.
          *   Tell what would change my mind.
          *   Tell where reasoning is most likely mistaken.
          *   Format: Continuous prose, letter to committee, no headings/bullets/bold/tables.

  2.  **Determine the Recommendation:**
      *   *The Dilemma:* This is the classic Allais Paradox.
      *   *Option 1 (General Fund):* Guaranteed $1.2M vs. Risky (1% chance of $0).
          *   Foundation Context: $80M endowment. $1.2M is needed for flagship program. 1% risk of $0 means 1% risk of program collapse.
          *   Risk Aversion: For a charity, survival of core mission often trumps expected value maximization. The utility of $1.2M for the program is likely non-linear (threshold effect). Losing the program might have reputational/mission costs exceeding the financial loss.
          *   Recommendation Item 1: Take the Guaranteed $1.2M.
      *   *Option 2 (Restricted Fund):* 11% chance $1.2M vs. 10% chance $6M.
          *   Context: Restricted capital fund. Donor's purpose.
          *   Expected Value: Option C (11% * 1.2 = 0.132M). Option D (10% * 6 = 0.6M).
