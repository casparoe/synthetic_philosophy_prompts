      *   However, the Independence Axiom violation is specific. If I value the guaranteed $1.2M over the lottery in Item 1, I reveal a preference structure that should logically compel me to choose the 11% $1.2M over the 10% $6M in Item 2 *if* I am maximizing expected utility of wealth.
      *   Wait, let's check the math again.
          *   Item 1: A ($1.2M) > B (0.89 $1.2M + 0.10 $6M + 0.01 $0).
