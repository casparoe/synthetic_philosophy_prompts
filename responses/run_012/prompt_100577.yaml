answer: |-
  Dear Committee Members,

  I am writing this note ahead of Thursday's meeting to provide a clear framework for our decision on the two proposals from the donor consortium. We face a complex choice that touches on both our fiduciary duties and our mission identity, and I believe it is better to put a reasoned recommendation in front of you than to attempt to referee the argument in the room. Our consultant has correctly identified that the two items on the agenda are mathematically linked through shared contingencies, forming a structure known in decision theory as the Allais Paradox. He argues that choosing the guaranteed sum for the general fund while simultaneously choosing the higher-risk, higher-reward option for the restricted fund violates the independence axiom of expected utility theory. He warns that this inconsistency could theoretically expose us to a money pump, where a counterparty could exploit our preferences to drain value from us with certainty. While his mathematics are sound within the framework of standard economic theory, I believe that framework is insufficient for a mission-driven institution like ours. Accordingly, I recommend that we accept the guaranteed $1.2 million for the general fund and accept the ten percent chance at $6 million for the restricted capital fund. I further recommend that we amend our standing policy to allow for holistic risk assessment rather than requiring each opportunity to be assessed independently without regard to other agenda items.

  My recommendation for the general fund is driven by the threshold nature of our operational needs. The programme director has stated clearly that $1.2 million is required to keep the flagship programme running for the next three years and that she cannot plan on anything else. While our endowment is $80 million, the loss of this programme represents a failure of our public identity and a breach of trust with our beneficiaries. The one percent risk of receiving nothing under the lottery option is not merely a financial loss; it is an existential risk to a core component of our mission. In charitable finance, the utility of money is not linear. The difference between zero and $1.2 million is infinite in terms of mission delivery, whereas the difference between $1.2 million and $6 million, while significant, is marginal compared to the catastrophe of program collapse. Therefore, securing the guaranteed sum is the only choice that aligns with our duty to maintain continuity of service.

  For the restricted capital fund, the calculus is different. This money is designated for capital purposes left by a donor, and the baseline expectation for such funds is often growth rather than immediate operational survival. Both options here involve a high probability of receiving nothing, either eighty-nine percent or ninety percent. The difference in probability of success is merely one percentage point, favouring the smaller sum, but the difference in expected value is massive. The ten percent chance at $6 million offers an expected value of $600,000, whereas the eleven percent chance at $1.2 million offers an expected value of only $132,000. Given that the restricted fund is not needed to prevent immediate program collapse, we should maximise the expected value of this gift to honour the donor's intent of capital growth. Taking the larger chance here does not endanger our operations, whereas taking the smaller chance leaves significant potential value on the table for a negligible increase in probability.

  I acknowledge that combining these two choices creates a logical tension that our consultant has rightly highlighted. The strongest case for the option I reject, which would be to choose the eleven percent chance in the second item to maintain consistency with the guaranteed choice in the first, rests on the principle of fiduciary coherence. A trustee arguing for this position would say that we cannot claim to be prudent stewards if our decision-making process violates the basic laws of probability when viewed as a whole. They would argue that by accepting the guaranteed sum in the first item, we reveal that we value certainty highly, and therefore we should not suddenly become risk-seeking in the second item simply because the money is restricted. They would contend that allowing ourselves to be incoherent opens us to reputational risk among peers who understand these models, and that a policy of consistency protects us from making emotional rather than rational decisions. This is a fair and serious argument, and it is the reason our consultant advises against the pair of choices I am recommending.

  However, I believe the consultant has framed the choice in a way that distorts our reality by treating all dollars as fungible and all risks as comparable. The independence axiom assumes that the value of an outcome depends only on the outcome itself, not on the context in which it occurs. For a foundation, the context is everything. The $1.2 million in the general fund prevents a mission failure; the $1.2 million in the restricted fund is merely a gain. Because the utility function of a charity has a sharp kink at the point of program survival, the mathematical inconsistency identified by the consultant does not translate into a practical vulnerability. The money pump argument requires a liquid market where we can trade these probabilities repeatedly, but we are making one-off strategic decisions regarding specific funds. We are not a casino, but neither are we a hedge fund bound solely by expected value maximisation. We are a charity bound by mission continuity, and that requires a nuanced view of risk that standard economic models do not capture.

  This brings me to our standing policy adopted two years ago, which mandates that each opportunity be assessed independently without regard to the source of funds or whatever else is on the agenda. I believe this clause must be amended. The consultant's analysis proves that these items are not independent; the contingencies are shared, and the 0.89 probability in the first item is the flip side of the 0.11 probability in the second. By forcing ourselves to assess them in silos, we blind ourselves to the aggregate risk profile and the correlated nature of the outcomes. A policy that forbids looking at the whole board prevents us from managing our portfolio effectively. We should amend the policy to require that when contingencies are shared or when risks are correlated, the committee must assess the combined impact on the foundation's overall risk exposure and mission capacity. This does not mean we commingle restricted and general funds, but it does mean we must understand how decisions in one area affect our resilience in another.

  There are considerations that would change my mind. If the flagship programme had a viable backup plan or if the one percent risk of collapse could be mitigated by bridge funding from our operating reserve, I would be more inclined to accept the lottery in the first item to align with the second. Similarly, if the restricted capital fund was needed for immediate grant-making commitments rather than long-term growth, I would recommend the safer option there to ensure some return is realised. My reasoning is most likely to be mistaken in underestimating the reputational cost of appearing inconsistent to our peers. Two peer foundations follow our published reasoning, and if our minutes record a decision that explicitly contradicts standard financial logic without a robust explanation, it could undermine confidence in our governance. I am betting that our explanation of mission-weighted utility will suffice, but it is possible that the market for philanthropic capital values mathematical coherence more than I anticipate.

  In conclusion, I urge you to support the guaranteed sum for the general fund to protect our flagship programme and the higher-risk option for the restricted fund to maximise potential capital growth. We should do so with the understanding that while this pair of choices violates a specific axiom of economic theory, it honours the deeper logic of our charitable purpose. We will also need to vote on amending the policy clause regarding independent assessment to ensure we are not forced into this corner again when faced with correlated risks. I look forward to discussing this with you on Thursday.

  Sincerely,

  Chair, Finance and Investment Committee
