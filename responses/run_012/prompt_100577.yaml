          *   *Note:* The probabilities are linked. Item 1's 0.89/0.11 split corresponds to Item 2's 0.11/0.89 split? Wait, let's look closer at the Allais Paradox structure described.
          *   Consultant's Claim: These are one item (Allais Paradox structure). The common consequence (0.89 chance of $1.2M in Item 1 vs 0.89 chance of $0 in Item 2?) needs careful parsing.
