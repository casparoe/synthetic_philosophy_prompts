      *   *Analogy:* Unreliable introspection = The speedometer is broken. Interface theory = The speedometer is working fine, but speed isn't actually a needle moving; that's just how the car shows it to you.

  7.  **Self-Refuting vs. Self-Effacing:**
      *   "No truths" is self-refuting (performative contradiction).
