      *   The theory claims the *phenomenology* (the feeling) is real as a feeling, but its *content* (that there is a magical inner self) is false.
      *   *Analogy:* A dream. In a dream, there is a "dreamer" and a "world." When you wake up, you say "The dreamer wasn't real." But the *experience* of dreaming was real. The illusionist says waking life is like the dream.

  4.  **What is Denied vs. What is Left Untouched:**
      *   *Denied:* That the "feeling" reveals the underlying nature of reality. That there is a metaphysical "soul" or "homunculus" inside the head.
      *   *Untouched:* That there is *something happening*. That reports of pain, red, etc., occur. The *data* of experience exists, but the *interpretation* is wrong.
      *   *Crucial Point:* They aren't denying experience exists; they are denying our *interpretation* of experience is accurate regarding the machinery.

  5.  **Genuine Problem or Verbal Trap?**
      *   It's not a verbal trap, but it is a category error risk.
      *   The "who is being illuded?" question assumes a "who" must exist prior to the illusion.
