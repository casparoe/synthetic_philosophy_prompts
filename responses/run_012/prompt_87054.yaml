answer: |-
  ### Exam Question: Causal Reasoning in Algorithm Rollouts

  **Scenario:**
  A ride-hailing company tests a new dispatch algorithm. The rollout was not randomized at the level of individual trips. It was introduced gradually, first in denser cities, and within each city, it was assigned to a subset of drivers. Because the dispatch system is shared, a treated driver's behavior can affect the wait times of riders assigned to control drivers. The company compares average rider wait times. The results are as follows:

  **Overall:**
  *   New algorithm: 1,000 trips, average wait 4.04 minutes.
  *   Old algorithm: 1,000 trips, average wait 4.50 minutes.

  **Dense cities:**
  *   New algorithm: 800 trips, average wait 3.80 minutes.
  *   Old algorithm: 200 trips, average wait 3.50 minutes.

  **Sparse cities:**
  *   New algorithm: 200 trips, average wait 5.00 minutes.
  *   Old algorithm: 800 trips, average wait 4.75 minutes.

  The company also has data on driver acceptance rate. The new algorithm increases driver acceptance rate, and higher acceptance rates are associated with shorter waits.

  **Questions:**
  1.  Explain how the overall result (New is better) and the stratified results (Old is better in both) can both be mathematically correct. Identify the variable responsible for the reversal. (4 marks)
  2.  Identify the causal question that the overall comparison answers versus the dense-city comparison. Which is more relevant to a decision to launch the algorithm in a *new* dense city? State one key assumption that decision would require. (4 marks)
  3.  Classify driver acceptance rate as a confounder, a mediator, or a collider. Explain what happens to the estimated effect if you adjust for acceptance rate, and when adjusting would be appropriate. (4 marks)
  4.  Explain why the shared dispatch system can violate the Stable Unit Treatment Value Assumption (SUTVA) and why that matters for interpreting the estimated effect. (4 marks)
  5.  Discuss what this case shows about the idea that there is a "single true effect" of the algorithm, in terms of the causal question, target population, and the role of assumptions. (4 marks)

  ***

  ### Model Answer

  1.  **Mathematical Consistency:** Both results are correct due to Simpson's Paradox, driven by unequal weighting. The New algorithm was deployed primarily in Dense cities (800/1000 trips), which naturally have lower wait times than Sparse cities. The Old algorithm was primarily in Sparse cities (800/1000 trips). The aggregate average is skewed by the city mix, not just the algorithm performance. **City Density** is the variable responsible for the reversal; it influences both the treatment assignment (rollout strategy) and the outcome (wait times).

  2.  **Causal Questions:** The overall comparison estimates the Average Treatment Effect (ATE) on the *current mixed population* of trips during the test period. The dense-city comparison estimates the Conditional Average Treatment Effect (CATE) specifically for dense environments. For launching in a *new dense city*, the dense-city comparison is relevant. This decision requires the **transportability assumption**: that the dense cities in the test period are representative of future dense cities (e.g., no seasonal changes or concurrent marketing campaigns affected the test results).

  3.  **Acceptance Rate:** Acceptance rate is a **mediator**. The causal path is Algorithm → Acceptance Rate → Wait Time. The algorithm improves waits partly *by* improving acceptance. If you adjust for (stratify by) acceptance rate, you block this pathway, isolating only the direct effect of the routing logic while removing the benefit gained from driver behavior. Adjusting is only appropriate if the business question is specifically about the routing math excluding behavioral changes, not the total system impact.

  4.  **SUTVA Violation:** SUTVA assumes one unit's treatment does not affect another's outcome. In a shared marketplace, treating a driver changes supply availability for control riders. If treated drivers are more efficient, control riders might experience longer waits because treated drivers took nearby requests. This **interference** means the control group does not represent a true "no treatment" baseline. The estimated effect captures spillover effects, potentially overstating the benefit if the algorithm were rolled out to 100% of the fleet (where spillovers would vanish).

  5.  **Single True Effect:** This case demonstrates there is no single true effect. The effect size changes based on the **target population** (dense vs. sparse cities) and the **mechanism** measured (total effect vs. direct effect excluding acceptance). Causal claims are not intrinsic properties of the algorithm but are relational statements dependent on the context, the population defined, and the assumptions made about interference and confounding.

  ***

  ### Marking Scheme

  | Subpart | Must-Hit Points (4 Marks Each) | Common Error |
  | :--- | :--- | :--- |
  | **1** | Identifies unequal weighting/sample composition between groups and names **City Density** as the confounding variable causing the reversal. | Calculates numbers correctly but fails to name density as the cause, or claims data is erroneous. |
  | **2** | Distinguishes ATE (mixed) vs. CATE (dense), selects Dense for the decision, and states an assumption (e.g., **transportability**/representativeness). | Selects Overall average for the decision, or fails to state an assumption about future validity. |
  | **3** | Classifies as **Mediator**, explains that adjusting blocks the indirect path (underestimates total benefit), and notes adjusting is only for direct effects. | Classifies as Confounder, or says adjusting is always good to "control for variables." |
  | **4** | Identifies **Interference/Spillover** (treated affects control) as the SUTVA violation and notes this biases the estimate relative to full rollout. | Defines SUTVA correctly but fails to apply it to the marketplace dynamics described. |
  | **5** | Rejects "single true effect," citing dependence on **population context** and **assumptions/definitions** of the effect. | States there is a true effect but we just can't measure it, or gives a vague philosophical platitude. |

  **A vs. B Distinction:**
  *   **A Answer:** Explicitly connects the statistical concept to the business decision (e.g., explains *why* transportability matters for the launch) and nuances the mediator adjustment (total vs. direct effect).
  *   **B Answer:** Correctly defines the terms (Mediator, SUTVA, Simpson's Paradox) but treats them as abstract definitions without linking them to the specific consequences for the company's decision-making.

  ***

  ### Confidence Statement

  I am **90% confident** in this model answer and marking scheme. The scenario is mathematically consistent, and the causal structures (mediator vs. confounder, SUTVA violation) are standard interpretations of the text provided.

  The point I am **least sure about** is Subpart 3 (Mediator). While the prompt strongly implies a causal chain (Algo → Acceptance → Wait), in complex systems, acceptance rate could arguably be viewed as a proxy for driver quality (confounder) if not carefully measured. However, based strictly on the text "New algorithm increases driver acceptance rate," the mediator classification is the intended correct answer for this level of course. Graders should accept "Confounder" only if the student provides a robust alternative causal diagram justified by the text, but the Model Answer treats Mediator as the primary truth.
