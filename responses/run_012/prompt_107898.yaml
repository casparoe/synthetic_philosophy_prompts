answer: |-
  Good morning. I know what time it is. I know most of you are here because this assembly gets you out of fourth period, and honestly, I respect the strategy. I also know that the front two rows—shout out to Mr. Alvarez's civics class—are currently mentally preparing to roast me if I say something scientifically false.

  So, let's get the math out of the way. I know the formula. R equals P times B minus C plus D. I know that P—the probability that your single ballot decides this election—is basically zero. Unless we have a repeat of the 2022 statistical anomaly where two votes decided everything, you are not going to be the tiebreaker. And I'm not going to stand here and talk about "duty," because that's just a guilt trip wearing a nicer outfit.

  So, if your vote won't decide the winner, and you don't owe the school anything, why are we doing this?

  Because this isn't about the *result*. It's about the *signal*.

  Individually, a vote is just a piece of paper. Collectively, it's data. When the administration sees that eighty percent of the school voted for longer lunch periods, or better music at dances, they can ignore one complaint in the office, but they can't ignore a data set of nine hundred people. Voting in this mock election isn't about who sits in the student council chair. It's about proving to the adults in this building that we actually care about what happens here.

  For the rest of you who don't care about policy: fine. Don't vote for the person. Vote for the stuff you actually want. Vote because this is the only time all year the school asks what you want without grading you on the answer.

  The cynics in the front row are right about the odds. You won't change the outcome. But you will change the noise level. And if we make enough noise, the school has to listen.

  So take the ballot. Don't do it because you have to. Do it because it's the easiest way to make sure someone knows what you think. Let's get some data.

  Thank you.
