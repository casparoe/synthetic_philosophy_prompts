prompt: |-
  ok so next friday is our school's mock election assembly and as student council vp I have to give the opening speech to the whole school — 900 kids, most of whom are only there cause it gets them out of 4th period, plus mr. alvarez's civics class in the front two rows, who spent the last two weeks on the paradox of voting, so if I open with "every vote counts" they will actually laugh out loud. his whole thing is R = PB − C + D: P is the odds that your vote is the one that actually decides the election, which he says is like one in a million in any real election, B is how much you care about who wins, C is the cost of showing up, and D is "duty," which he says is just cheating, since duty is the exact thing we're supposed to be explaining. Also our council president election two years ago was decided by two votes out of like 380, so everybody thinks it's easy to be the deciding vote and he keeps having to explain that it isn't. Please write me the speech. I want to give 900 bored teenagers a real reason to vote that doesn't fall apart the second mr. alvarez raises his eyebrows — so nothing about how your vote could be the one, and nothing that's just a guilt trip wearing a nicer outfit — but it also has to land for the 850 kids who have no idea what a paradox is and didn't ask. Like 3 minutes said out loud, and dont turn it into a civics lecture or they'll riot. Start with the speech itself, no "here's your speech" preamble.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Student Council VP.
      *   **Occasion:** School mock election assembly.
      *   **Audience:** 900 students.
          *   Majority (850+): Bored, there to skip 4th period, don't care about civics.
          *   Minority (Front rows): Mr. Alvarez's civics class. They know the "Paradox of Voting" (R = PB - C + D). They will laugh/cringe at clichés like "every vote counts" or "your vote could be the deciding one."
      *   **Constraints:**
          *   No "every vote counts" (Alvarez's class will laugh).
          *   No "your vote could be the deciding one" (Alvarez debunked this, plus past election anecdote makes kids think it's easy when it's not).
          *   No guilt trips ("duty" is cheating according to Alvarez).
          *   No civics lecture (bored kids will riot).
          *   Length: ~3 minutes spoken (approx. 400-500 words).
          *   Tone: Engaging, honest, relatable, not preachy.
          *   Format: Start directly with the speech, no preamble.

  2.  **Deconstruct the Problem:**
      *   *The Alvarez Challenge:* The formula R = PB - C + D suggests voting is irrational unless D (duty) is huge. P (probability of deciding) is near zero. B (benefit) is low in a mock election. C (cost) is low (it's in the assembly), but still exists (effort).
      *   *The Bored Crowd Challenge:* They don't care about policy. They care about social dynamics, fun, feeling heard, or just getting through the day.
      *   *The Solution:* Shift the focus from *outcome* (who wins) to *signal* (what sending the ballot says). Acknowledge the math without getting bogged down in it. Make voting about *participation in the culture* rather than *deciding the result*. Frame it as data, not destiny.

  3.  **Drafting Strategy:**
      *   **Hook:** Acknowledge the elephant in the room. Acknowledge Alvarez's class. Disarm the cynics immediately.
      *   **Body Paragraph 1 (The Math):** Address the "one in a million" argument. Admit it's true. Don't fight the math.
      *   **Body Paragraph 2 (The Real Reason):** Why vote then? Because it's not about *winning*, it's about *noise*. It's about making the school pay attention. It's about the signal sent to the administration.
      *   **Body Paragraph 3 (The Bored Kids):** Make it relevant to them. It's not about tax policy; it's about lunch lines, bathroom passes, spirit weeks.
      *   **Conclusion:** Call to action. Keep it low stakes but high meaning.

  4.  **Refining the Tone:**
      *   Needs to sound like a student, not a principal.
      *   Needs to be witty enough for Alvarez's class but simple enough for everyone else.
      *   Avoid "Duty." Focus on "Voice" or "Signal."

  5.  **Drafting - Section by Section:**

      *   *Opening:* Good morning. I know where we are. 4th period escape. Alvarez's front row ready to roast me.
      *   *The Alvarez Nod:* I know the formula. R = PB - C + D. I know P is basically zero. I'm not going to tell you you're the tie-breaking vote.
      *   *The Pivot:* So why are we here? Because this isn't about the *result*. It's about the *noise*.
      *   *The Argument:* When 900 of us do something, the adults notice. Even if the margin is 5 votes, the fact that 800 showed up matters. It's data.
      *   *The Bored Kids:* You don't care about the candidates? Fine. Care about the stuff they change. Lunches. Events.
      *   *Closing:* Cast the ballot. Not because you have to. But because it's the only time the school asks what you want without grading you on it.

  6.  **Review against Constraints:**
      *   *No "Every vote counts"?* Check. Instead, "Every vote adds to the noise."
      *   *No "Deciding vote"?* Check. Acknowledge P is near zero.
      *   *No "Duty"?* Check. Focus on signal/data.
      *   *Length?* Need to ensure it's around 3 minutes. ~450 words.
      *   *No Preamble?* Check.

  7.  **Polishing:**
      *   Make the Alvarez reference specific but friendly.
      *   Ensure the transition from cynics to bored kids is smooth.
      *   End on a strong note.

      *(Self-Correction during drafting)*: Wait, if I say "it's about the noise," is that too abstract? Let's make it about *leverage*. The administration ignores individual complaints. They don't ignore data sets. A mock election is a data set.
      Also, need to make sure I don't sound *too* much like Alvarez. I need to simplify the math for the 850 kids. "The odds you decide this are basically zero" is clear enough.

      *Revised Plan:*
