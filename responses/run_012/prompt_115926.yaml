answer: |-
  Friends, families, faculty, and most of all, the graduating class.

  It is a privilege to stand here with you. We gather to mark a transition, a word we use easily but rarely examine. To transition is to pass from one state to another. But what is it that passes? When we speak of your lives, we often speak as though you are a single thread stretching from infancy to old age, a continuous line that merely changes color as it moves through time. It is a comforting image. It suggests that the baby in the photograph and the graduate standing here are literally one and the same thing, fully present at every moment along the line.

  I will not offer you that comfort today. Not because it is wrong to feel connected to your past, but because the truth is more demanding, and ultimately, more generous.

  The reality is sharper. The student who arrived on this campus four years ago is not identical to the graduate standing here today. You are not the same entity that walked into those dormitories, nervously clutching a key. That student was a real person, existing at that time. You are a real person, existing at this time. You are linked to that student by memory, by cause and effect, by the physical continuity of a body and a mind. But you are not identical. You are a successor. You are a counterpart.

  This distinction matters. It matters for how you understand the sealed letters you have written, the ones tradition demands you open at your tenth reunion. When you wrote those letters, you were writing to a stranger. You were writing to someone who will share your name, who will carry your memories, who will inhabit a body built from the cells you possess now. But that person will not be you. You will not be there to open the envelope. The stage of your life happening now will have ceased. The person who reads that letter will be someone you care about deeply, someone you are building right now, but someone you will never meet.

  This might sound cold. It might sound as though I am telling you that you will die every moment. But I am telling you something warmer. I am telling you that caring for your future is not a matter of selfishness. It is an act of love toward someone else.

  If you were merely one long worm stretching through time, looking after your future would be automatic. You would simply be looking after yourself. But because you are distinct from the person you will become, your concern for them is a moral choice. It is a bridge you must build. When you choose to study hard, to rest, to cultivate kindness, you are not polishing a static statue. You are constructing a world for a successor. You are preparing a home for someone who will rely on the foundations you lay today.

  This makes your responsibility heavier, but it makes your capacity for care much wider. It means that self-care is not narcissism. It is stewardship. You are the guardian of the person you will become.

  I know this view competes with another. The student who will speak after me has written a brilliant thesis arguing precisely for that continuous thread I just set aside. They will tell you that you are one object, extended through time, wholly present at every moment of your life. They will argue that identity is what binds you to your past and future. They are not wrong to find comfort in that view. It is the way we speak. It is the way we feel. When you hug your parents today, you feel like the same child they held years ago.

  I do not ask you to reject that feeling. I ask you to see that it does not require metaphysical identity to be real. You can honor the student who started this journey without claiming to be them. You can love the person at the reunion without claiming to meet them. The bond between you is not identity. It is something stronger. It is commitment.

  This is why the letters matter. You are not sending a note to yourself. You are sending a message across a gap. You are saying to a future counterpart: "I thought about you. I prepared for you. I hoped for you." That is a promise. And a promise is only meaningful when it is kept by one party for the benefit of another. If you were literally the same person, a promise to yourself would be merely a plan. Because you are distinct, a promise to your future is a covenant.

  So, as you leave this hall, do not worry about staying the same. You cannot. The person who walks out of these doors will not be the person who walked in. You will change. Your counterparts will change. The world will change. Do not try to hold onto this moment as if you could freeze it and keep it. You are not meant to persist by being wholly present at every time. You persist by leaving something behind that is worth inheriting.

  Care for your future counterparts as you would care for a child or a friend. Listen to them. When you feel tired, remember that you are tired so that they might be strong. When you feel uncertain, remember that you are deciding so that they might have direction. You are the ancestor of your own future. Treat them with the kindness you would show a stranger who depends on you entirely.

  And when you return for that reunion, when you open those letters, you will meet someone who knows your history better than anyone else could. You will see the hand of the person you were ten years prior. You will not be them. But if you have built well, if you have cared across the gap of time, you will recognize them. You will feel the connection. It will not be the comfort of identity. It will be the joy of recognition. It will be the satisfaction of a bridge held firm.

  To the families here: thank you. You have cared for these graduates across vast distances of time already. You loved them when they were infants who could not speak, and you love them now as adults who can. You know better than anyone that love does not require identity. It requires presence. It requires showing up for the stage that exists now, while honoring the stages that came before.

  To the graduates: Go forward. Do not try to be the same person forever. Be a good predecessor. Build a future counterpart who will be proud of the work you did today. Write a life that the person who reads your letter will be glad to inherit.

  The student who follows me will tell you that you are one. I tell you that you are many, linked by love. Both of us agree on this: the link must hold. The chain must not break.

  Congratulations. We are proud of who you are, and we are proud of who you will become.
