      *   **Problem:** Needs a decision procedure for advising new hires on local customs (tipping, jaywalking, queuing, gifts, etc.). Current advice is instinct/folklore. Needs something philosophical but practical (10 mins, no training).
      *   **Core Conflict:** Distinguishing between breaking a rule, being rude, and doing something morally wrong.
      *   **Requirements:**
          *   Turn philosophical knowledge on convention/visitor obligations into a desk procedure.
          *   Order of questions, sufficient answers, clear Yes/No stops, and explicit judgment calls (marked as such).
          *   Honest about limitations ("honest holes").
          *   Distinctions to keep: Coordination problems vs. membership markers; owed vs. prudent; to whom it is owed; limits of "When in Rome"; returning resident vs. first-time visitor.
          *   Test on 4 specific cases (Tipping, Jaywalking, Queuing, Corrupt/Unjust Custom).
          *   Explain what the procedure *cannot* settle (local disagreement, exemptions, high costs, resentful groups).
          *   State what distinctions were kept/dropped in compression.

  2.  **Philosophical Grounding (Mental Sandbox):**
      *   *David Hume/Convention:* Conventions solve coordination problems (driving on the left/right).
      *   *H.L.A. Hart/Social Rules:* Internal aspect (acceptance) vs. external aspect (observation).
      *   *John Rawls/Practice Conceptions:* Rules of a practice define the activity.
      *   *Joseph Raz/Exclusionary Reasons:* Some rules exclude personal moral calculation.
      *   *Margaret Gilbert/Plural Subjects:* Joint commitment creates obligations.
      *   *Cosmopolitanism vs. Particularism:* Universal morals vs. local norms.
      *   *Key Distinction:* *Moral Obligations* (universal) vs. *Social Obligations* (local/relational) vs. *Prudential Choices* (self-interest).
      *   *The "Guest" Status:* A guest enters a social contract. They gain protection/benefit, they owe respect/compliance.
      *   *The "Returning Local" Status:* They have historical membership but current foreign habits. Do they owe more? Yes, because they claim belonging while acting outside.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* 10 minutes, no jargon.
      *   *Step 1: Harm/Right?* Is anyone's rights violated? (Kant/Utilitarian check). If yes, Don't do it.
