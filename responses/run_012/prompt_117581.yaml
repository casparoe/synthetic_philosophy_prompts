          1.  **The Harm Test:** Does this hurt someone specific or violate a right?
          2.  **The Coordination Test:** Is this a rule that makes the game work?
          3.  **The Reciprocity Test:** Are you benefiting from the system this rule supports?
          4.  **The Conscience Test:** Does this violate a deep moral principle?
          5.  **The Status Check:** Are you a visitor or a returning member?

      *   *Wait, the prompt asks for specific distinctions:* Coordination vs. Membership; Owed vs. Prudent; To whom owed.
      *   *Let's build a Flowchart style text.*

  4.  **Developing the "Visitor's Compliance Protocol" (VCP):**
      *   *Name:* Needs to sound professional but not legalistic. "Local Norm Assessment Protocol."
      *   *Step 1: The Direct Harm Check.* (Moral floor).
      *   *Step 2: The Livelihood Check.* (Specific obligation).
      *   *Step 3: The Coordination Check.* (Systemic efficiency).
      *   *Step 4: The Membership Check.* (Social signaling).
      *   *Step 5: The Conscience Override.* (Moral ceiling).
      *   *Marking Judgment Calls:* Use [JUDGMENT] tags.

  5.  **Running the Cases:**
      *   *Case 1 (Tipping):* Direct harm? Yes (server loses wage). Livelihood? Yes. Coordination? No. Membership? Maybe. Conscience? User hates system. *Result:* Pay tip. Obligation is to the server, not the system.
      *   *Case 2 (Jaywalking):* Direct harm? No (empty intersection). Coordination? Yes (traffic flow/predictability). Livelihood? No. Membership? Yes. Conscience? No. *Result:* Follow local custom (if safe). It's coordination.
      *   *Case 3 (Queuing):* Direct harm? Yes (people behind lose time/spot). Coordination? Yes (order). Livelihood? No. Membership? Yes. *Result:* Follow local queue style. It's fairness to those behind.
      *   *Case 4 (Corrupt/Unjust Custom):* Direct harm? Yes (systemic injustice). Coordination? Yes (but bad system). Livelihood? Maybe (clerk). Conscience? Yes (bribery/wrong). *Result:* Refuse. Moral floor trumps local norm.

