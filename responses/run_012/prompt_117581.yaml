      *   *Mark Judgment Calls?* Yes, bold/bracketed.
      *   *Distinctions Kept/Dropped?* Need a section at the end.
      *   *Tone:* Professional, direct, humble about limitations.

  9.  **Refining the Procedure (Self-Correction during drafting):**
