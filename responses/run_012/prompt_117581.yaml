answer: |-
  # The Local Norm Assessment Protocol (LNAP)

  **Purpose:** To determine whether a relocating employee should adopt a specific local practice.
  **Time:** 10 minutes.
  **Users:** Onboarding staff (no philosophical training required).
  **Status:** Advisory. Final discretion rests with the employee, but this protocol defines the company's recommended stance.

  **Instructions:** Run the five questions below in order. If a step yields a definitive **STOP**, do not proceed. If a step yields **JUDGMENT**, mark it as such in your advice log.

  ---

  ### Step 1: The Harm & Rights Check
  **Question:** Does ignoring this practice cause direct material loss, physical risk, or rights violation to a specific, identifiable person?
  *   **Yes:** The employee **must** follow the practice (or find a lawful alternative).
      *   *Obligation:* To the specific person harmed.
      *   *Type:* Moral/Legal Duty.
      *   **STOP.**
  *   **No:** Proceed to Step 2.
      *   *[JUDGMENT]:* Defining "direct material loss" requires estimation. (e.g., Is a server's lost tip "material loss" or "lost opportunity"? Treat reliance on income as material loss.)

  ### Step 2: The Coordination Check
  **Question:** Is this practice a solution to a coordination problem (e.g., traffic, queues, safety signals) where deviation creates confusion or inefficiency for the group?
  *   **Yes:** The employee **should** follow the practice.
      *   *Obligation:* To the system and the other participants.
      *   *Type:* Prudence & Fairness.
      *   **STOP.** (Unless Step 5 overrides).
  *   **No:** Proceed to Step 3.
      *   *[JUDGMENT]:* Distinguishing "coordination" from "mere habit" is not always clear. If locals get annoyed by deviation, treat it as coordination.

  ### Step 3: The Membership Check
  **Question:** Is this practice a marker of group membership or respect (e.g., greetings, dress, gifts) where deviation signals hostility or aloofness?
  *   **Yes:** The employee **is advised** to follow the practice, provided the cost is low.
      *   *Obligation:* To the relationship/community.
      *   *Type:* Social Prudence.
      *   **STOP.** (Unless Step 5 overrides).
  *   **No:** Proceed to Step 4.
      *   *[JUDGMENT]:* Assessing "hostility" is subjective. Ask: "Would a local reasonably feel disrespected?"

  ### Step 4: The Cost-Benefit Check
  **Question:** Does following the practice impose a significant financial, psychological, or safety cost on the employee?
  *   **Yes:** The employee **may decline** the practice.
      *   *Obligation:* None.
      *   *Type:* Personal Discretion.
      *   **STOP.**
  *   **No:** Proceed to Step 5.

  ### Step 5: The Conscience Override
  **Question:** Does following the practice violate a core moral principle or legal statute of the employee's home jurisdiction or universal human rights (e.g., bribery, discrimination)?
  *   **Yes:** The employee **must not** follow the practice.
      *   *Obligation:* To conscience/universal law.
      *   *Type:* Moral Duty.
      *   **STOP.**
  *   **No:** Follow the local practice.
      *   *Rationale:* When in Rome, do as the Romans do, provided no one is hurt, the system works, and conscience is clear.

  ---

  ### Status Modifier: The Returning Resident
  **Instruction:** Before applying the protocol, determine the employee's status.
  *   **First-Time Visitor:** Apply the protocol as written. Ignorance is a mitigating factor in Steps 3 & 4.
  *   **Returning Resident:** If the employee previously lived here, **tighten Step 3 (Membership).**
      *   *Reasoning:* A returning resident claims membership in the community. They cannot claim the benefits of belonging while rejecting the costs of its norms. Ignorance is not a valid excuse in Step 4.
      *   *Action:* Treat "Social Prudence" as "Social Obligation."

  ---

  ## Application to Cases

  Here is how the LNAP processes the four scenarios you provided.

  ### Case 1: Tipping (Sub-minimum wage context)
  *   **Step 1 (Harm):** **Yes.** The server's wage is contractually set below minimum *on the assumption* of tips. Refusing to tip causes direct material loss to the specific person serving.
      *   *[JUDGMENT]:* We are treating the server's reliance on tips as "material loss" rather than "lost opportunity."
  *   **Result:** **Follow the practice.**
  *   **Why this lands against both you and your friend:**
      *   Your friend argued customs aren't laws. Step 1 bypasses "law" entirely; this is an economic reliance issue.
      *   You argued it's about "house rules." Step 1 clarifies the obligation isn't to the "house" (the restaurant) but to the *individual server*.
      *   *Verdict:* It is not manners; it is deferred wages.

  ### Case 2: Jaywalking (Empty intersection, unenforced law)
  *   **Step 1 (Harm):** **No.** Intersection is empty; no specific person is at risk.
  *   **Step 2 (Coordination):** **Yes.** Traffic flow relies on predictability. If everyone else crosses on red, a pedestrian waiting on green at an empty intersection may confuse drivers or disrupt the flow of pedestrian packs.
      *   *[JUDGMENT]:* We are assuming the local custom *is* the coordination mechanism here, overriding the written law.
  *   **Result:** **Follow the practice.**
  *   **Verdict:** This is a coordination problem. The "law" is nominal; the "custom" is operational. Deviation creates friction without moral gain.

  ### Case 3: The Loose Queue
  *   **Step 1 (Harm):** **Yes (Potential).** If the local custom is a "scrum" and the newcomer forms a rigid line, they may block flow or inadvertently cut off the "next" person as defined by local norms.
  *   **Step 2 (Coordination):** **Yes.** Queuing is purely a coordination technology for fairness and order.
  *   **Result:** **Follow the practice.**
  *   **Verdict:** The obligation is to the people behind you. "Fairness" is defined by the local mechanism. Imposing a foreign queue structure is effectively cutting in line, even if it looks orderly to an outsider.

  ### Case 4: Corrupt/Unjust Custom (Bribery/Discrimination)
  *   **Step 1 (Harm):** **Yes.** Systemic harm to third parties (other applicants, marginalized groups).
  *   **Step 5 (Conscience):** **Yes.** Bribery violates universal legal/moral standards; discrimination violates rights.
  *   **Result:** **Do not follow the practice.**
  *   **Verdict:** The "When in Rome" argument stops at the moral floor. Coordination (Step 2) cannot justify injustice. The employee bears the cost of delay or refusal.

  ---

  ## Limitations & Failure Modes

  This procedure is a tool, not a truth machine. It will misfire in the following four scenarios. You must flag these to your staff as "Escalate to Manager."

  **1. The Disagreement Problem (Locals disagree)**
  *   *Scenario:* Half the locals tip, half don't. Half queue, half push.
  *   *Failure:* Step 2 and 3 rely on a singular "local practice." If the norm is contested, the protocol cannot determine which side is the "coordination" point.
  *   *Action:* Advise the employee to follow the subset of locals they interact with most (e.g., their specific team), or default to the more formal option.

  **2. The Exemption Problem (Privilege)**
  *   *Scenario:* The employee is a diplomat, disabled, or visibly foreign in a way that grants them a "pass" locals don't get.
  *   *Failure:* The protocol assumes the employee is subject to the same social pressure as a local. If they are exempt, Step 3 (Membership) loses force.
  *   *Action:* If an exemption exists, the obligation shifts from "Owed" to "Optional." However, warn that using the exemption may damage long-term relationships (Step 3 risk).

  **3. The High-Cost Problem (Pricing the unpriceable)**
  *   *Scenario:* Following the custom requires a payment the employee cannot afford, or a safety risk the protocol doesn't capture (e.g., walking on grass that hides unexploded ordnance).
  *   *Failure:* Step 4 asks about "significant cost," but staff may underestimate psychological or safety costs.
  *   *Action:* If the employee expresses hesitation about safety or solvency, override the protocol. Prudence trumps protocol.

  **4. The Resentment Problem (Oppressive Norms)**
  *   *Scenario:* The custom is a relic of colonialism, caste, or occupation that a specific subgroup resents.
  *   *Failure:* The protocol treats "local custom" as monolithic. It may advise complying with a norm that an oppressed minority within the host country finds harmful.
  *   *Action:* If the employee belongs to a group that historically resents this norm, or if the norm targets a vulnerable group, invoke Step 5 (Conscience) even if not strictly "illegal."

  ---

  ## Compression Report: Distinctions Kept and Dropped

  To make this fit a 10-minute window, I made the following philosophical trades. You should know what was lost in translation.

  **Distinctions Kept:**
  1.  **Harm vs. Manners:** Step 1 isolates direct material harm (moral duty) from social friction (prudence). This solves your tipping argument.
  2.  **Coordination vs. Membership:** Step 2 (Coordination) is about system efficiency (traffic/queues). Step 3 (Membership) is about social signaling (gifts/greetings). This clarifies *why* we follow the rule.
  3.  **Owed To Whom:** The protocol explicitly labels whether the obligation is to a *Specific Person* (Step 1), the *System* (Step 2), or the *Community* (Step 3).
  4.  **Returning vs. Visitor:** The Status Modifier acknowledges that social contracts are thicker for those claiming membership.

  **Distinctions Dropped (The "Honest Holes"):**
  1.  **Rule vs. Convention:** Philosophy distinguishes between "constitutive rules" (you aren't playing chess if you move the rook diagonally) and "regulative conventions" (you shake hands). I collapsed these into Step 2. It works for onboarding, but it blurs the line between "breaking the game" and "being rude."
  2.  **Internal vs. External Acceptance:** Philosophers care if the local *believes* in the rule or just follows it. The protocol treats observed behavior as the rule. This risks codifying bad habits if the locals are hypocrites.
  3.  **The "Clean Hands" Problem:** The protocol does not calculate whether complying with a bad system makes you complicit (e.g., tipping in a system that allows wage theft). It prioritizes the immediate interaction (the server) over the systemic critique. This is a pragmatic choice, not a moral one.
  4.  **Epistemic Burden:** The protocol assumes the employee *knows* the custom. It does not solve the problem of how they find out. That remains on your training materials.

  **Final Note to Staff:**
  If a step is marked **[JUDGMENT]**, do not present the outcome as a company rule. Present it as: *"Our assessment suggests X, but this depends on local interpretation."* False confidence is the risk you identified; this disclaimer is the insurance.
