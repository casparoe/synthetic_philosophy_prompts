  6.  **Final Polish:** Check American English spelling (realize vs realise, etc.). Ensure flow and transitions. Make sure the "honesty about breakdown" section is robust. (The prompt specifically asks for honesty about where it breaks down).

  7.  **Final Review against constraints:**
