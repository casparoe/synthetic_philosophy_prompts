  2.  **Deconstruct Berkeley's Position:**
      *   *Esse est percipi* (To be is to be perceived).
      *   The Master Argument: You cannot conceive of an object existing unconceived, because in the act of conceiving it, you are conceiving it.
      *   Role of God: God perceives everything constantly, ensuring continuity of existence when finite minds aren't looking.
      *   Rejection of Material Substance: There is no "matter" underlying ideas; reality consists of minds and ideas.

  3.  **Deconstruct *Toy Story*'s Ontology:**
      *   Toys are alive (have minds/consciousness) when humans aren't looking.
      *   Toys freeze (become inert objects) when humans *are* looking.
      *   Humans see them as inanimate plastic.
      *   Toys perceive each other.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the "weirdness" but validate the philosophical intuition. Set the stage: Berkeley vs. The Plastic World.
      *   **The Master Argument & The Freezing Mechanism:**
          *   Berkeley says: You can't imagine an unperceived tree.
          *   *Toy Story* says: Here is an unperceived toy (by humans), but it *is* perceived (by other toys).
          *   *Crucial Distinction:* Berkeley denies matter. *Toy Story* affirms matter (plastic) but hides the mind. It's actually a form of *panpsychism* or *dualism*, not strict idealism.
          *   *The Equivocation:* Berkeley attacks the *concept* of unperceived existence. The film shows the *narrative* of unperceived existence. The camera acts as the omniscient perceiver.
      *   **Woody vs. Buzz (The Epistemological Shift):**
          *   Buzz isn't just a naive realist; he's a *deluded* idealist. He thinks his "mission" is real.
          *   The TV Ad moment: "You are a toy!" This isn't *esse est percipi*; it's *esse est function*.
          *   Woody is the pragmatist. He knows the rules of the "human gaze."
          *   Correction: Buzz is the Materialist/Realist (I am a space ranger in a real universe). Woody is the Social Constructivist (I am what Andy needs me to be).
      *   **Continuity of Existence (The God Problem):**
          *   When Andy is at school, who perceives the toys?
          *   Berkeley needs God. *Toy Story* needs *Other Toys*.
          *   This creates a community of minds. It solves the continuity problem without theology, but relies on a collective subjectivity.
          *   *Toy Story 3* (The Incinerator/Attic): The threat of non-existence. If no human loves you, do you cease to function? Jessie's trauma suggests "being loved" = "being real." This substitutes Divine Perception with Human Affection.
      *   **The Breakdown (Materiality):**
          *   Berkeley denies matter. *Toy Story* is obsessed with matter (broken arms, batteries, plastic smell).
          *   The "Gag Economy": Physical damage matters. In Berkeley, pain is an idea. In *Toy Story*, a ripped seam is a structural failure of the substrate.
          *   The film is actually *Dualist*: Mind + Matter. Berkeley is *Monist*: Mind + Ideas.
      *   **What the Film Dramatizes:**
          *   Berkeley is abstract/epistemological. *Toy Story* is ethical/existential.
          *   It dramatizes the *anxiety* of being unperceived. The horror of the closet/box.
          *   It turns the Master Argument into a moral imperative: To perceive is to love.
