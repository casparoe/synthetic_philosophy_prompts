answer: |-
  Here is a draft for your reading group talk. It treats the analogy with the philosophical seriousness you requested, while maintaining the necessary critical distance.

  ***

  **Title:** Plastic and Perception: A Berkeleyan Reading of *Toy Story*

  It is easy to dismiss the intuition that *Toy Story* is a Berkeleyan text as a bit of clever undergraduate whimsy. After all, George Berkeley's immaterialism is a rigorous epistemological claim about the nature of reality, not a fable about talking plastic. However, if we take the Master Argument seriously—not as a parlor trick, but as a genuine challenge to the coherence of "mind-independent matter"—*Toy Story* does not merely parallel Berkeley; it dramatizes the existential anxiety that Berkeley's system attempts to resolve.

  To be clear from the outset: *Toy Story* is not strictly Berkeleyan in its metaphysics. Berkeley denies the existence of material substance; he argues that reality consists only of minds and their ideas. *Toy Story*, conversely, is committed to a robust dualism. The toys are undeniably physical objects. They have mass, they break, they smell like plastic, and they occupy space. If Berkeley were watching Sid's mutiny, he would insist that the "torture" of the toys is merely a sequence of ideas in Sid's mind and the mind of God. The film, however, insists the pain is real and the plastic is real.

  Nevertheless, the film operates on a Berkeleyan *logic of existence*. The central rule of the toy universe is that their agency is contingent upon the absence of human perception. When Andy enters the room, the toys freeze. They revert from subjects to objects. This creates a fascinating inversion of the Master Argument. Berkeley argues that you cannot conceive of a tree existing unconceived, because the act of conceiving it places it in your mind. *Toy Story* shows us a world of objects existing unconceived *by humans*, but only because they are conceived *by each other*.

  This brings us to the equivocation on "conceive," which your group member will undoubtedly raise. Berkeley is often accused of sliding between "conceiving" as mental imagery and "conceiving" as understanding a proposition. *Toy Story* pulls a similar trick, but it locates the ambiguity in the camera. We, the audience, are granted a God's-eye view. We see the toys moving when Andy is not there. In Berkeleyan terms, the camera acts as the Divine Perceiver that guarantees continuity. Without the camera (or God), the toys' inner lives would be ontologically unstable. The film solves the problem of unperceived existence not by denying matter, but by positing a community of finite perceivers. When Andy is at school, the toys do not cease to exist because they perceive one another. This is a secularization of Berkeley's God: continuity is guaranteed by the collective gaze of the toy community.

  This sheds light on the dynamic between Woody and Buzz. It is tempting to cast Woody as the Berkeleyan and Buzz as the Naive Realist, but the topology is more complex. Buzz Lightyear, in the first film, is not a realist about the physical world; he is a realist about his own essence. He believes he is a Space Ranger. He believes his function is intrinsic to his nature, independent of any observer. In a sense, Buzz is the true Idealist—he believes his reality is defined by a higher mission (the Star Command narrative) that transcends his material form.

  Woody, conversely, is the pragmatist. He knows that his existence is relational. To be a toy is to be played with. His famous line, "You are a toy!" is not an ontological revelation about Buzz's material composition; it is a social assignment of function. Woody understands the Berkeleyan constraint: to be is to be perceived *by a child*. When Buzz watches the TV commercial and sees himself as a mass-produced object, his crisis is not that he discovers he is made of plastic, but that he discovers he is not unique. His "conversion" is the realization that his *esse* is indeed *percipi*—his being is determined by how he is perceived by Andy, not by the internal narrative of his own mind.

  The stakes of this ontology become tragic in *Toy Story 2* and *3*, specifically regarding Jessie and the attic. Here, the film swaps Berkeley's theology for sentimentality. In Berkeley's system, God's perception is constant and benevolent; objects never truly cease to exist because God never blinks. In *Toy Story*, human love is the sustaining force, and humans are fallible perceivers. They grow up. They leave.

  Jessie's backstory in the second film introduces the horror of Berkeleyanism without God. When Emily outgrows her, Jessie is not destroyed, but she is rendered ontologically dormant. She is stored in a box. She describes this experience as a kind of death. "You don't forget kids like Emily," she says, but the tragedy is that Emily *did*. The film suggests that for a toy, to be unloved is to be unreal. The attic in the third film represents the limbo of unperceived existence. It is a purgatory where objects wait for a perceiver who may never return. This dramatizes a fear that Berkeley's system suppresses: What if the Divine Mind looks away? The film answers: then you are just stuff.

  However, we must be honest about where this reading breaks down. The "gag economy" of the films relies heavily on the very material substance Berkeley rejects. The tension in the films often comes from physical vulnerability. Woody's ripped arm, the batteries in Buzz, the melting plastic of the soldiers. In a strict Berkeleyan framework, damage to an object is just a change in the sequence of ideas. But for the toys, physical integrity is a prerequisite for their social function. If Woody's arm is ripped, he cannot be played with; if he cannot be played with, he risks being discarded.

  This reveals that *Toy Story* is actually arguing for a kind of functionalist dualism. The mind (the toy's consciousness) is real, but it is hostage to the matter (the plastic body). Berkeley would say the body is just an idea. The toys know better. They know that if Sid burns them with a magnifying glass, the pain is not just an idea; it is a structural failure of their vessel. The film cannot sustain strict idealism because its drama relies on the persistence of the physical world even when no one is looking. The toys worry about being broken, not just being unperceived.

  So, is this a fair reading of Berkeley? Metaphysically, no. The film affirms the existence of matter and independent minds in a way Berkeley explicitly forbids. If anything, *Toy Story* is a refutation of the Master Argument: it asks us to conceive of a world where objects have inner lives unconceived by humans, and it succeeds in making us visualize it vividly.

  But philosophically, the reading holds water because the film dramatizes the *ethical* implications of idealism that Berkeley ignores. Berkeley's system is epistemologically secure but emotionally sterile. *Toy Story* asks what it *feels* like to be an object whose existence depends on a subject. It turns *esse est percipi* into a demand for recognition. The terror of the closet, the relief of the shelf, the trauma of the donation box—these are the lived experiences of a Berkeleyan universe where the Perceiver is a capricious child rather than an omnipotent God.

  In conclusion, *Toy Story* is not a Berkeleyan text, but it is a text about the *desire* for Berkeleyan security. The toys want a world where to be is to be perceived, because that guarantees they matter. But they live in a world where matter matters, and where perception is fleeting. Woody's journey is not to prove he is real—he knows he is—but to secure a perceiver who will not look away. In that sense, the film is less about Berkeley's metaphysics and more about the human need for a universe that watches back.
