prompt: |-
  Ok so I'm a third year econ student taking game theory and something about iterated elimination has been driving me nuts all term, and every time I ask a TA I get a different answer so I figure id ask properly.

  Two things bug me. First, in one homework game I had three options. One gave me 1 whatever the other player did. The other two gave me 3 against one of her moves and 0 against the other. The answer key said my first option was strictly dominated and crossed it out. But it isn't dominated by either of my other options — each of those is awful against one of her moves — it's only worse than flipping a coin between them. That feels like I'm being made to assume I randomize, which nobody told me I have to do. Second, we did a game where you delete weakly dominated strategies, and a guy in section pointed out that if you delete them in a different order you're left with a different set of strategies at the end. The prof basically shrugged and said that's why we usually dont do that, which, fine, but then why did we do it.

  What I actually want to know is this. It seems like it should be a settled math question and it obviously isn't — there's a whole literature and people who've been going at it for decades. The camps look like (a) people who treat iterated elimination as just a formal operation on a game, so order-dependence or the mixed-strategy thing are features of the operation rather than problems, and (b) people who think a solution concept only means anything if you can back it with an epistemic story, some version of rationality plus common knowledge of rationality implies you'd never play these strategies. Those two seem to talk past each other forever, and neither seems to be winning.

  So: is this a real disagreement, or a verbal one about what rationality and solution concept are supposed to mean, or two groups answering different questions under one heading? My guess is it's mostly verbal — (a) is asking what set of strategies you can't be criticised for, (b) is asking what a maximiser with correct beliefs would do — but I suspect that's too easy, because the weak dominance case is exactly where the epistemic story seems to break (someone said the common knowledge version is false there and you need something weaker, which honestly sounds like a patch).

  Diagnose it for me, and be concrete about what would actually move this along — a theorem, a definition, or just admitting the two sides want different things from the theory. And if it can't be settled, say that.
