answer: |-
  You have hit on one of the genuine fault lines in game theory. Your frustration is not a failure of comprehension; it is a success of intuition. You have identified the exact points where the standard undergraduate narrative ("rational people don't play dominated strategies") crashes into the formal reality of the mathematics.

  To answer your core question: **This is not merely a verbal disagreement, nor is it just two groups answering different questions.** It is a tension between **procedural robustness** (the math of elimination) and **epistemic justification** (the logic of belief).

  Here is the diagnosis of the two specific bugs you found, followed by the diagnosis of the "Two Camps."

  ### 1. The Mixed Strategy "Coin Flip" (Strict Dominance)

  **Your Observation:** A pure strategy was eliminated because it was dominated by a *mixed* strategy, even though no single pure strategy dominated it. You feel this forces an assumption of randomization.

  **The Diagnosis:**
  This is standard, rigorous game theory, but it is often glossed over in introductory courses.
  *   **The Math:** A strategy $s_i$ is strictly dominated if there exists *some* $\sigma_i$ (in the set of all mixed strategies) that yields a higher payoff against *all* opponent profiles. In your example, if Option A pays 1 always, and Options B and C pay 3/0, a 50/50 mix of B and C pays 1.5 always. Since $1.5 > 1$, Option A is strictly dominated.
  *   **The Epistemic Story:** This does **not** require you to actually randomize. It requires only that you *could* randomize if you wanted to. Rationality is defined over the set of *available* actions. If there exists a plan (even a mixed one) that is strictly better than your current plan regardless of what the opponent does, your current plan is irrational.
  *   **Why TAs disagree:** In many 2nd-year courses, "dominance" is implicitly defined as "pure-strategy dominance" to keep the algebra simple. In 3rd/4th-year or grad courses, "dominance" defaults to "mixed-strategy dominance" because it is the mathematically correct definition (Pearce's Lemma).
  *   **Verdict:** The answer key was right by standard definitions. Your intuition that "I don't have to randomize" is also right—you don't have to *play* the mix, but the *existence* of the mix proves the pure strategy is suboptimal.

  ### 2. Order Dependence (Weak Dominance)

  **Your Observation:** Iterated Elimination of Weakly Dominated Strategies (IEWDS) yields different results depending on the order of elimination. The professor shrugged.

  **The Diagnosis:**
  The professor shrugged because this is a known, fatal flaw of IEWDS as a standalone solution concept.
  *   **The Math:** Weak dominance allows for equality ($ \geq $) rather than strict inequality ($ > $). If you eliminate Strategy X because it is weakly worse than Y, you might remove the only reason Strategy Z was bad. If you had eliminated Z first, Y might look weakly dominated instead. The operation is not path-independent.
  *   **The Epistemic Story:** This is where the "Rationality + Common Knowledge" story breaks.
      *   **Strict Dominance (IESDS):** If we assume Common Knowledge of Rationality (CKR), IESDS is justified. A rational player never plays a strictly dominated strategy. If I know you are rational, I know you won't play it, so I can eliminate it from my consideration, and so on. This is robust.
      *   **Weak Dominance (IEWDS):** CKR is **not enough** to justify IEWDS. To eliminate a weakly dominated strategy, you must believe the opponent plays the specific strategy that makes you indifferent with *probability zero*. This requires an assumption about beliefs (priors), not just rationality. Specifically, it requires **lexicographic beliefs** or a **trembling hand** assumption (the opponent might make a mistake).
  *   **Why we do it:** We teach it because it often isolates "sensible" Nash Equilibria (like in the Chainstore Paradox or specific signaling games) that strict dominance misses. It is a *refinement* tool, not a *solution* tool.
  *   **Verdict:** The order dependence proves that IEWDS is not a stable prediction of behavior under CKR alone. It is a heuristic that requires extra epistemic assumptions.

  ### 3. The "Two Camps" Diagnosis

  You identified Camp (a) **Formalists** (elimination as an operation) and Camp (b) **Epistemicists** (elimination as a consequence of knowledge/belief).

  **Is it a verbal disagreement?**
  No. It is a disagreement about **what a solution concept is for.**

  *   **Camp (a)** treats the game matrix as a computational object. They want to reduce the search space. For them, order dependence is a "bug" to be noted, but the operation is still useful for finding equilibria.
  *   **Camp (b)** treats the game as a model of knowledge. They ask: "What state of the world leads to this outcome?" For them, order dependence is a "feature" that reveals the solution concept is underspecified (i.e., we haven't defined the beliefs precisely enough).

  **The Real Conflict:**
  The conflict arises because textbooks often present Camp (a)'s tools using Camp (b)'s language. They say "Rational players won't play weakly dominated strategies" (Epistemic claim) but teach an algorithm that is order-dependent (Formal property). This is inconsistent. If rationality implies the outcome, the outcome shouldn't depend on the order in which the analyst thinks about the rationality.

  **Who is winning?**
  The Epistemicists (Camp b) effectively won the theoretical war decades ago (thanks to Aumann, Brandenburger, Pearce, Bernheim in the 80s), but the Formalists (Camp a) still win the classroom war because Epistemic Game Theory is mathematically heavy (type spaces, universal belief spaces, lexicographic probability systems).

  ### 4. What Would Move This Along?

  You asked for concrete things that would settle this. The field has actually largely settled this, but the settlement hasn't fully trickled down to undergraduate pedagogy.

  **1. The Theorem that Settled Strict Dominance:**
  **Pearce's Lemma (1984)** and **Bernheim (1984)**.
  They defined **Rationalizability**.
  *   *Result:* The strategies that survive IESDS (allowing for mixed dominance) are exactly the **Rationalizable Strategies**.
  *   *Meaning:* This bridges Camp (a) and (b). It proves that the formal operation of IESDS corresponds exactly to the set of strategies consistent with Common Knowledge of Rationality. This closed the book on Strict Dominance.

  **2. The Definition that Settles Weak Dominance:**
  To fix the order-dependence and epistemic gap of Weak Dominance, you need to change the definition of belief.
  *   *Solution:* **Sequential Equilibrium** (Kreps & Wilson, 1982) or **Trembling Hand Perfect Equilibrium** (Selten, 1975).
  *   *Meaning:* These concepts impose the requirement that players assign positive probability to *all* strategies (trembles), which eliminates the "indifference" problem of weak dominance. If you use these concepts, order dependence disappears because you aren't deleting strategies; you are taking limits as probabilities go to zero.
  *   *Why it's not settled in class:* It's too hard for a 3rd-year course. It requires limits and sequences of beliefs.

  **3. The Admission:**
  The field needs to admit that **IEWDS is not a solution concept; it is a refinement procedure.**
  *   IESDS = Prediction (based on Rationality).
  *   IEWDS = Selection (based on Rationality + Specific Belief Restrictions).
  *   Most courses blur this line, causing your confusion.

  ### Summary Advice for You

  You are not missing anything. You are seeing the seams in the theory.

  1.  **On the Homework:** Accept that "dominated" implies "dominated by any mixture." You don't have to randomize, but you must acknowledge that a randomized plan exists that beats your pure plan. That makes the pure plan irrational.
  2.  **On Weak Dominance:** Trust your skepticism. Order dependence means the concept is fragile. When you see it, think: "This solution relies on specific assumptions about what players believe is impossible."
  3.  **On the Camps:** The "Formal" view is a shortcut for the "Epistemic" view. The shortcut works for Strict Dominance (thanks to Rationalizability). The shortcut breaks for Weak Dominance (requiring Trembling Hand/Sequential Equilibrium).

  **The Verdict:** It is not a verbal dispute. It is a hierarchy of assumptions.
  *   Level 1: Rationality $\rightarrow$ No Strictly Dominated Strategies (Robust, Order Independent).
  *   Level 2: Rationality + "I believe you won't play strictly dominated strategies" $\rightarrow$ IESDS.
  *   Level 3: Rationality + "I believe you might make mistakes (trembles)" $\rightarrow$ No Weakly Dominated Strategies (Robust, but requires stronger assumptions).

  Your TAs were giving you different answers because some were teaching Level 1 (Intro logic) and some were teaching Level 2/3 (Formal definitions). The Professor shrugged because acknowledging Level 3 requires a lecture on belief systems that wasn't in the syllabus.

  **Concrete takeaway:** If you want to pursue this, look up **"Epistemic Game Theory"** and **"Rationalizability."** That is the literature that formally unifies the two camps you identified. It confirms your suspicion: the math is settled, but the *interpretation* depends on how much you assume players know about each other's beliefs.
