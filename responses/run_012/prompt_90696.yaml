      *   *The "Hope Nobody Asks" Question:* Needs to be something that undermines the fundamental definition. "If the environment is heritable, what stops a Darwinian creature from being Gregorian if it inherits a modified niche?" Or "Is a termite mound Gregorian?"

  5.  **Refining the Tone:**
      *   The user wants to *defend* the thesis, not discover it. The tone should be confident, strategic, and concise.
