      *Self-Correction on Order:* Actually, the Behaviorist might be more damaging in a *cognition* reading group than the Philosopher. If the room is mostly psychologists, the "homunculus" charge sticks harder than "what is the replicator." However, the user's thesis rests on "selection." If the Philosopher proves there is no selection at Level 4, the thesis ("ladder of what is permitted to be selected") is logically void. I will keep Philosopher #1.

      *Self-Correction on Postdoc:* If the Postdoc proves Level 4 is just Niche Construction, the user's "new reading" is just a rename. This threatens the *contribution*. I'll keep this high.

