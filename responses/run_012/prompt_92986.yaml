  ### The cases

  Your anti-cat vase stiffens upon approach, removing its fragility; this is a *fink*, not merely a mask, because the disposition itself vanishes. The plastic chandelier breaks only due to an external hammer; this is a *mimic*, making the counterfactual true without the disposition. The crystal-foam composite retains brittleness but blocks breaking; this is a standard *mask*. The shy wire loses conductivity upon touch; this is a standard *fink*. The plutonium device resets decay probabilities upon stimulus; this is a *probabilistic fink*. These cases test whether dispositions depend on intrinsic stability, extrinsic context, or something deeper than behaviour.

  ### The branches

  **1. Analysability:** Can disposition terms be fully defined by what an object would do in certain circumstances, or are they primitive features of reality that resist definition?
  **2. Counterfactual Sufficiency:** If analysable, does a simple "if struck, then break" conditional capture the meaning, even when finks or masks interfere with the outcome?
  **3. Repair Strategy:** If the simple conditional fails, do we fix it by adding a clause about the object's internal basis, or by changing how counterfactuals work contextually?
  **4. Basis Location:** If a basis clause is needed, must the basis be intrinsic to the object, or can it be relational, spread across objects like a key and lock?
  **5. Primitive Ontology:** If not analysable, do dispositions exist as real properties distinct from categorical properties like shape or mass?
  **6. Property Identity:** If they are real properties, are they identical to categorical properties, or is everything fundamentally dispositional or categorical?
  **7. Chance:** Finally, must a disposition guarantee its manifestation, or can it be essentially probabilistic, allowing for chance without loss of power?

  ### The leaves

  **Simple Conditional Analysis:** Dispositions are just shorthand for counterfactuals. *Awkward commitment:* You must say the chandelier is fragile because it would break, ignoring the hidden hammer.
  **Lewis-Style Reformed Analysis:** Add a clause holding the intrinsic basis fixed. *Awkward commitment:* You must deny the key has a disposition to open the lock unless the basis is purely inside the key.
  **Martin-Style Causal Basis:** Focus on the causal power regardless of intrinsic/extrinsic split. *Awkward commitment:* You allow relational bases, but struggle to define where the property ends.
  **Contextualism:** The meaning of "fragile" shifts with context. *Awkward commitment:* Truth becomes unstable; the vase is fragile in the shop but not in your kitchen.
  **Dispositional Essentialism:** Dispositions are primitive and essential to properties. *Awkward commitment:* Laws of nature are metaphysically necessary, leaving no room for contingent regularities.
  **Dispositional Monism:** Everything is fundamentally dispositional. *Awkward commitment:* There is no categorical bedrock; reality is pure potentiality without a bearer.
  **Identity Theory:** Dispositional and categorical properties are one and the same. *Awkward commitment:* You must explain how one property can have two entirely different natures simultaneously.
  **Categorical Monism (Humean):** Only categorical properties exist; dispositions are useful fictions. *Awkward commitment:* You must deny that anything *makes* the glass break; it just breaks.
  **Eliminativism:** Disposition talk is erroneous and should be discarded. *Awkward commitment:* You cannot explain why we successfully predict breakage without invoking fragility.
  **Potentialism:** Dispositions are Aristotelian potentialities, not modern properties. *Awkward commitment:* You must revive obsolete physics concepts to make sense of quantum mechanics.
  **Probabilistic Realism:** Dispositions can be essentially chancy. *Awkward commitment:* You accept that some causes do not determine their effects, even in principle.
  **Structural Dispositionalism:** Dispositions belong to systems, not just objects. *Awkward commitment:* The key doesn't open the lock; the key-lock system does, dissolving individual agency.

  ### Empty rooms

  Combinations like "Simple Conditional Analysis" paired with "Dispositional Monism" are empty because monists reject analysis. Similarly, "Categorical Monism" with "Primitive Dispositions" is contradictory; if only categoricals exist, dispositions aren't primitive. The view "Reformed Analysis" combined with "Eliminativism" is unstable; if you analyze them away, you aren't a realist. Finally, "Intrinsic Basis" paired with "Structural Dispositionalism" is rarely occupied because structuralists deny the intrinsic/extrinsic boundary. These rooms are empty due to logical contradiction or because the motivation for one view cancels the other.

  ### Blind spots

  The tree struggles to separate **Identity Theory** from **Dispositional Monism**. Both accept primitive dispositions and deny a dualist ontology. To pry them apart, you need a specific question: "Is there a categorical aspect to every property?" The Identity theorist says yes; the Monist says no. Similarly, **Potentialism** and **Dispositional Essentialism** overlap heavily. Separating them requires asking about the historical lineage of the metaphysics rather than the logical structure. Without this, the leaves look identical from the perspective of finkish cases.
