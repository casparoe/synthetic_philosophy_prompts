      *Let's focus on the normative erosion as the "Fatal" conceptual defeater, and the Gibbard/Blau domain restrictions as the "Fatal" formal defeater.*

      *Wait, one more check:* Sen himself responded to the waiver argument. He argued that if rights are waivable, they aren't rights in the sense of protecting a sphere of immunity. They become trading chips. This is the "Normative Erosion" argument.

