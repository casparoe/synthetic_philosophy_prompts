prompt: |-
  You are an expert in early Christian ethics and in Augustine's moral psychology. I need a careful reconstruction, so begin by brainstorming the candidate principles that could unify the verdicts below, then give a best guess and flag uncertainty.

  I have been cataloguing Augustine's verdicts on lying. As I read him, he holds: (1) a false statement made in a joke, with no intent to deceive, is not a lie; (2) a false statement sincerely believed by the speaker is not a lie; (3) a true statement uttered with the intent to deceive is a lie; (4) a lie told to save someone's money is a sin, though less grave than a lie that harms someone; (5) it is forbidden to lie even to expose heretics, though the end is good; (6) concealing the truth by silence is not the same as lying and may be permitted.

  New case: A man is hiding a fugitive from a violent pursuer. The pursuer asks whether the fugitive is in the house. The man says that the fugitive is not there, intending to deceive the pursuer and save the fugitive's life. The pursuer believes him and leaves.

  Predict Augustine's verdict on this new case. Identify at least two plausible rules that fit the earlier verdicts but diverge here—for example, an absolute prohibition on any intentional deception versus a graded view on which some lies are permissible to prevent a grave evil. Say which rule you think Augustine is actually running and why. Then name a further case that would best distinguish those rules. Keep the answer focused on the rules and their predictions, not on whether you personally approve.
