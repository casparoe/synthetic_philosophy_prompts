answer: |-
  You have not inherited a heap of verdicts; you have inherited a tension between two competing moral frameworks that most political theorists spend careers trying to reconcile. Your intuitions are consistent enough to form a coherent shape, but they contain one specific contradiction that is paralyzing you.

  Here is the principle that generates almost all your verdicts, followed by the one verdict you must surrender to make it hold.

  ### The Principle: Reciprocal Viability

  A group may secede if and only if three conditions are met:

  1.  **The Procedural Condition:** The secession follows the existing constitutional order, **OR** the existing constitutional order has been weaponized to permanently exclude the group from political agency (the Remedial Safety Valve).
  2.  **The Political Community Condition:** The seceding unit constitutes a political community capable of sustaining liberal democracy, not merely an economic interest group or an administrative convenience.
  3.  **The Reciprocity Condition:** The seceding entity guarantees the same right of self-determination to any distinct minority within its new borders that it claims for itself.

  **Why this generates your verdicts:**

  *   **Scotland:** Meets Procedure (negotiated), Community (distinct history/institutions), and Reciprocity (assumed democratic norms). **Legitimate.**
  *   **Catalonia:** Fails Procedure (unilateral violation of constitutional law in a functioning democracy). The Safety Valve does not open because leaders were jailed for breaking law, not for being politically excluded from the law-making process itself. **Not Legitimate.**
  *   **Oppressed Region:** Meets Procedural Condition via the Safety Valve (lawful route suspended by force). **Legitimate.**
  *   **Rich Port:** Fails Political Community Condition. A ledger is not a people; fiscal advantage is not a basis for sovereign statehood in this framework. **Not Legitimate.**
  *   **Treaty Right:** Meets Procedure (contract is the constitution). **Legitimate.**
  *   **Homogenization/Expulsion:** Fails Reciprocity Condition. **Not Legitimate.**
  *   **Hypocrisy (New state denies vote):** Fails Reciprocity Condition. **Not Legitimate.**
  *   **Federation Expels Region:** Fails Reciprocity/Community. Expulsion renders the region vulnerable (stateless or forced), whereas secession creates a shield. Asymmetry holds. **Impermissible.**
  *   **Annexed Region:** Meets Procedural Condition via Safety Valve (original union was coercive, so current law lacks legitimacy). **Legitimate.**

  ### The Stress Test: New Cases

  Here is how *Reciprocal Viability* bites on the cases you feared would embarrass it:

  *   **Secession to escape debt:** **Not Legitimate.** This fails the Political Community Condition (motive is fiscal, not political) and likely fails Reciprocity (leaves the rump state insolvent/unviable).
  *   **Leaving a democracy to join a non-democracy:** **Not Legitimate.** Fails the Political Community Condition (the goal is to *reduce* liberal democratic capacity).
  *   **Leaving a non-democracy to join a democracy:** **Legitimate.** Triggers the Remedial Safety Valve immediately.
  *   **Internally divided region:** **Legitimate, provided borders are drawn to reflect the division.** If the "leave" voters are geographically concentrated, they may go. If they are intermingled, the Reciprocity Condition demands the borders be drawn so the "stay" minority is not trapped. This forces the novel to confront *where* the line is drawn, not just *if*.
  *   **Taking disputed territory/water:** **Contingent.** If the territory is essential for the viability of the rump state (e.g., water source), Reciprocity forbids taking it. If it is historically part of the seceding region, it goes. The principle forces a negotiation, not a seizure.

  ### The Verdict You Must Surrender

  You have a contradiction in your premises that is causing your writer's block.

  **The Contradiction:**
  You stated: *"Scotland's independence referendum... won by a clear majority: legitimate."*
  You also stated: *"A referendum won by fifty percent plus one, anywhere... not enough; I want a supermajority."*

  Scotland was 55% to 45%. That is a majority, but it is functionally a 50% + 1 threshold (it was not a supermajority requirement). You accepted Scotland because the *process* was negotiated. But your intuition about the 50% + 1 threshold suggests you distrust the *result* of a simple majority on constitutional change.

  **The Verdict to Abandon:**
  **You must surrender the intuition that a simple majority is insufficient for secession.**

  **Why:**
  If you hold to the *Reciprocal Viability* principle, requiring a supermajority (e.g., 60% or 2/3) privileges the *status quo* (the Federation) over the *change* (Independence). It implies that the Federation owns the Island, and the Island must buy its way out with a high price.

  If the Federation is a voluntary union (as your Scotland and Treaty verdicts suggest), then the default position is consent. To remain in the union should require consent; to leave should require consent. By demanding a supermajority to leave, you are implicitly arguing that the Union has a property right over the citizens that the citizens do not have over the Union.

  This undermines the "Voluntary" nature of the Federation you seem to want to defend in the Catalonia and Treaty cases. If the Federation is legitimate because it is voluntary, then the threshold to end that voluntariness must be the same as the threshold to enter it.

  **Novelistic Consequence:**
  If you keep the supermajority intuition, your Pro-Independence sibling is arguing for something inherently unstable (rule by a slim majority over a large minority). If you drop it, your Pro-Independence sibling argues for *Political Equality*: "We are partners. Partners can dissolve the partnership by majority vote, just as we formed it."

  The Unionist sibling then must argue not about the *threshold*, but about the *irreversibility* of the choice or the *viability* of the new state. This is a stronger, more dramatic conflict. The "nerves" you feel about 50% + 1 are not philosophical; they are dramatic anxiety. You fear a divided island. But a divided island is exactly where the novel lives. Do not solve the division with a procedural hurdle; let the characters live in the division.

  ### Mapping to Your Siblings

  To resolve the book's spine, assign each sibling a pillar of the *Reciprocal Viability* principle. The quarrel is not about who is "right," but about which pillar is being violated.

  1.  **The Constitutionalist (Unionist):** Argues the **Procedural Condition**. "We must follow the law. If we break the law to leave, we prove we cannot govern ourselves." (This sibling wins on Catalonia, loses on the Oppressed Region).
  2.  **The Nationalist (Independence):** Argues the **Political Community Condition**. "We are a distinct people, not a province. The ledger does not define us." (This sibling wins on the Rich Port, wins on Scotland).
  3.  **The Liberal (The Conscience):** Argues the **Reciprocity Condition**. "If we leave, what of the mainlanders living here? What of the minority in our north who want to stay?" (This sibling holds the veto on Homogenization).
  4.  **The Pragmatist (The Wildcard):** Argues the **Remedial Safety Valve**. "I don't care about the law or the history. Are we safe? Are we heard? If not, we go." (This sibling justifies the Annexed/Oppressed cases).

  **The Book's Hidden Side:**
  You asked if the book is taking a side you never chose.
  If you keep the supermajority intuition, the book argues that **Stability is more important than Consent.**
  If you surrender it, the book argues that **Consent is the only source of Stability.**

  Given your verdicts on the Treaty, Scotland, and the Annexed Region, your moral architecture is built on **Consent**. The supermajority intuition is a stray brick from a different building. Remove it. Let the siblings fight over whether consent exists, not over how much of it is needed.

  This leaves you with a tragedy rather than a puzzle. The tragedy is that even when Consent, Community, and Reciprocity are all satisfied (The Ideal Case), the quarrel still destroys the family. That is where your novel actually lives.
