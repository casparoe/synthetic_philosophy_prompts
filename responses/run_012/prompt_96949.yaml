prompt: |-
  My girlfriend and I have been long distance for two years and we're finally figuring out who moves. I've got alot tied up here — a decent job, aging parents nearby, a band I actually like — while she's finishing her PhD and could in principle go anywhere. I assumed she'd come here. She says the fact that I'm not willing to move for her tells her something, and I honestly can't tell if she has a point or if she's just twisting my arm. Her argument is basically: anyone can say they love you, the only real proof is what you'd give up. My friend Dan, who reads too much, says that's right in theory but that these "proofs" only work if they're harder for the fakers than for the real thing — his example was that moving is way easier for someone with no job and no family and nothing to lose, so the test might be sorting for exactly the wrong people. I sort of get that but I can't tell if it applies to us, because what she's asking me to give up is stuff that took me years to build, while what she'd be giving up is more like a rented apartment and a bus pass.

  Then my brother said something I can't shake. He says if I move, I also get to live with her, which is a thing I want anyway — so paying that price isn't proof of anything, it's just buying something I was already shopping for. And he added that what she actually wants might not be evidence of love at all, it might be me having no way back — like burning the boats so I can't leave later.

  So now I'm holding three half-arguments and I can't tell which ones are real and which are just me weaseling out of a fair point. Please don't give me generic relationship advice, I want to know whether the logic holds up. And tell me what would change your mind — which argument or consideration would flip your verdict, or where your reasoning is most likely to be off, because there's definately a version of her case that's right and I suspect I'm dodging it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Issue:** Long-distance relationship (2 years). Deciding who moves. User has strong ties (job, parents, band). Girlfriend is finishing a PhD (mobile). User assumed she'd move. She argues willingness to sacrifice proves love.
      *   **Input Arguments:**
          1.  *Girlfriend:* Love is proven by sacrifice ("what you'd give up").
          2.  *Friend Dan:* Sacrifice only proves love if it's harder for "fakers" than "real" partners (signaling theory). Moving is easier for someone with fewer ties, so it might select for the wrong people (those with nothing to lose).
          3.  *Brother:* Moving isn't a sacrifice if it gets you what you want (living together). Also, she might want "burned boats" (no exit strategy) rather than proof of love.
      *   **Constraints:** No generic relationship advice. Focus on the *logic* of the arguments. Tell the user what would change my mind/where my reasoning might be off. Acknowledge there's a version of her case that is right.
      *   **Goal:** Evaluate the logical validity of the three arguments, determine which holds water, and identify the blind spots.

  2.  **Deconstruct the Arguments:**

      *   **Argument 1: The Girlfriend (Sacrifice as Proof)**
          *   *Logic:* Costly Signaling Theory. To signal commitment credibly, the signal must be costly.
          *   *Strength:* Intuitively powerful. Actions speak louder than words.
          *   *Weakness:* "Cost" is subjective. Is it actually costly for *him*? Is it the *right* kind of cost?
          *   *Validity:* Logically sound in principle, but depends on the definition of "cost."

      *   **Argument 2: Dan (The Counter-Signaling/Selection Bias)**
          *   *Logic:* If the cost is low for unstable people (no job, no family) and high for stable people (job, family), demanding the move selects for instability, not necessarily love.
          *   *Strength:* Highlights asymmetry. Moving is objectively easier for her (PhD student, rented apartment) than him (established job, family, band).
          *   *Weakness:* Ignores that *she* is being asked to move in the status quo. If *he* asks *her* to move, is he selecting for her instability?
          *   *Validity:* Strong economic/sociological logic. It exposes the asymmetry in "cost."

      *   **Argument 3: The Brother (Utility vs. Sacrifice & Burned Boats)**
          *   *Logic A (Utility):* If the outcome (living together) is desired, the cost to get there isn't a "sacrifice," it's a transaction.
          *   *Logic B (Burned Boats):* Forcing a move creates dependency, ensuring commitment through lack of options rather than desire.
          *   *Strength:* Logic A challenges the definition of sacrifice. Logic B challenges the *motive* behind the request.
          *   *Weakness:* Logic A ignores the *opportunity cost* (losing the job/band/parents). Logic B assumes malice or insecurity rather than a desire for security.
          *   *Validity:* Logic A is partially flawed (moving *is* a cost even if the destination is desired). Logic B is speculative but plausible.

  3.  **Synthesize and Evaluate:**

      *   *The Core Logical Conflict:* It's a game of asymmetric costs and signaling.
      *   *Her Point:* "If you loved me, you'd pay the price."
      *   *Dan's Point:* "The price is different for different people. Paying it doesn't mean the same thing."
      *   *Brother's Point:* "It's not a price, it's a purchase. Or you're trapping me."

      *   *Where is the user "weaseling"?* He's focusing on the *magnitude* of his loss (job, parents) vs. hers (apartment). He's treating his ties as immutable facts and hers as flexible.
      *   *Where is she right?* If he refuses to incur *any* cost, it signals he values his current stability more than the relationship's future location.
      *   *Where is Dan right?* The "cost" isn't comparable.
      *   *Where is the Brother right?* Living together is a gain, not just a loss. But the "burned boats" theory is cynical.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the constraint (logic only, no "communicate better" fluff). Validate the complexity.
      *   *Section 1: Analyzing the Girlfriend's Logic (Costly Signaling).*
          *   Explain Costly Signaling Theory.
          *   Verdict: Logically valid *if* the cost is equivalent.
          *   Flaw: The costs aren't equivalent.
      *   *Section 2: Analyzing Dan's Logic (Asymmetric Stakes).*
          *   Explain the selection bias.
          *   Verdict: Strongest logical argument. It highlights that "sacrifice" is relative.
          *   Nuance: It applies to *both* of them. If she moves, is she sacrificing career mobility?
      *   *Section 3: Analyzing the Brother's Logic (Utility & Traps).*
          *   Part A (Utility): Flawed. Moving costs exist even if you want the destination.
          *   Part B (Burned Boats): Plausible but unverifiable.
      *   *Section 4: The Verdict & The "Flip".*
          *   Who wins on logic? Dan wins on the *measurement* of sacrifice. Girlfriend wins on the *principle* of mutual risk.
          *   What would change my mind? (Addressing the prompt's specific request).
          *   *Crucial Insight:* The user is framing this as "Who moves?" (Binary). The logic breaks because it ignores the "Why" of the location.
          *   *The Missing Variable:* Career trajectory. A PhD isn't "anywhere." It's specific fields/cities. His job/band/parents are specific to *here*.
          *   *The "Weasel" Check:* The user is hiding behind "ties" to avoid the risk of change. She is hiding behind "love" to avoid the risk of career compromise.

  5.  **Refining the "What Would Change My Mind" Section:**
      *   I need to be specific. What fact would make the User's refusal logically indefensible?
