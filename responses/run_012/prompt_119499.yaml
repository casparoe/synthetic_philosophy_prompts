          *   *Critique:* In practice, Sartre treats these choices as explanatory keys that lock the narrative. It looks suspiciously like the essentialism *Being and Nothingness* bans.
          *   *Severity:* Medium. It shows a tension between theory and practice, but can be defended as "fundamental project" vs. "fixed essence."

