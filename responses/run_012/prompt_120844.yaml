answer: |-
  He will argue the country remains fundamentally poor because resource-driven income spikes without inclusive institutions are transient and fail to improve typical living standards, thereby preserving his core thesis that institutions are the ultimate determinant of development.

  To make his earlier verdicts jointly consistent, you must extract three hierarchical rules he implicitly follows. First, the **Institutional Conversion Rule**: geography and resources provide potential wealth, but only inclusive institutions (property rights, political competition) convert that potential into sustainable, broad-based prosperity (Britain, Botswana, Switzerland). Second, the **Geographical Constraint Rule**: geography can impose costs high enough to temporarily block institutional formation or wealth generation, but it is not destiny over the long run (Tropical Africa 1900 vs. Reversal of Fortune). Third, the **Welfare Proxy Rule**: true "richness" is defined by broad welfare outcomes (schools, clinics, diversified economy) rather than aggregate income alone (implied by his focus on merchants and elite restraint rather than just GDP).

  Applied to the new case, the Institutional Conversion Rule predicts failure because corruption and weak property rights prevent copper rents from becoming productive capital. The Geographical Constraint Rule predicts stagnation because being landlocked and tropical raises the cost of fixing those institutions, making the boom a lucky anomaly rather than a structural shift. The Welfare Proxy Rule predicts the country is still poor because income per head has risen while schools and clinics have not, meaning the typical person's life hasn't changed.

  You should bet on the Institutional Conversion Rule. Your professor is fundamentally an institutionalist (akin to Acemoglu and Robinson) who uses geography only as a secondary constraint or initial condition; he will prioritize the lack of property rights and political competition as the explanation for why the copper wealth hasn't translated into development, dismissing the income spike as a statistical artifact of resource pricing.

  The case that would force him to choose between his rules is a real or hypothetical landlocked, tropical autocracy with weak property rights that sustains high human development (life expectancy, education, low poverty) for fifty years without democratizing. This would force him to admit either that institutions (as he defines them) are not necessary for development (breaking the Institutional Conversion Rule) or that geography is irrelevant even when institutions are bad (breaking the Geographical Constraint Rule).

  Yes, it matters immensely that he measures richness by income per head rather than typical living standards, because his theoretical framework relies on welfare outcomes to validate institutional success. In this specific case, income and welfare diverge; if he sticks to income, he must call the country rich despite his own logic about schools and clinics, but if he sticks to his logic, he must admit income per head is a flawed metric for his theory, exposing a contradiction between his data sources and his causal claims.
