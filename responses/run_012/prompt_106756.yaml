answer: |-
  ### I. The Order of Ideas

  Do not begin with the Principle of the Identity of Indiscernibles (PII). Begin with its converse. If you assert PII first, it sounds like a tautology to the uninitiated ("of course two things are the same if they share every property"), and the controversy will seem pedantic. You must build the logical asymmetry before you introduce the metaphysical risk.

  **1. The Indiscernibility of Identicals (Leibniz's Law)**
  *   **Placement:** Minutes 0–10.
  *   **Status:** Unavoidable immediately.
  *   **Function:** This is the logical floor. $x = y \rightarrow \forall P (Px \leftrightarrow Py)$. If $x$ and $y$ are the same object, they must share all properties. No rational agent can deny this without abandoning the logic of identity. Establish this as the "safe" direction. It gives the students the equipment to understand what a "property" is in this context (anything that can be truly predicated of the subject).

  **2. The Identity of Indiscernibles (PII)**
  *   **Placement:** Minutes 10–15.
  *   **Status:** Unavoidable now, but only as a question.
  *   **Function:** Introduce the converse: $\forall P (Px \leftrightarrow Py) \rightarrow x = y$. Frame this not as a truth, but as a *constraint on reality*. Ask: "If two things share every property, *must* they be one thing?" This is the pivot. Do not assert it is true; assert that Leibniz thought it had to be, and his critics said it didn't.

  **3. The Distinction Between Intrinsic and Relational Properties**
  *   **Placement:** Minutes 15–25.
  *   **Status:** Unavoidable before the thought experiment.
  *   **Function:** If you introduce the counter-example (the two spheres) before this, the students will destroy it immediately by saying, "But one is on the left and one is on the right." You must restrict the domain of properties *before* testing the principle. Define "pure quality" or "intrinsic property" (shape, mass, color) versus "relational property" (distance from $x$, being named 'Alice').
  *   **Why here?** If you smuggle this in later as a defense of the counter-example, it looks like special pleading. It must be established as a rule of the game before the game begins.

  **4. The Shift from Actuality to Possibility (Modality)**
  *   **Placement:** Minutes 25–30.
  *   **Status:** Unavoidable before the verdict.
  *   **Function:** Students will object empirically: "In the real world, no two things are exactly alike." You must shift the ground from "Are there?" to "Could there be?" PII is a metaphysical claim about necessity, not an empirical claim about observation. This shift makes the thought experiment legitimate.

  **5. The Stakes (Individuation)**
  *   **Placement:** Minutes 50–60.
  *   **Status:** Payoff.
  *   **Function:** Postpone the "why should we care?" until the end. The payoff is the realization that if PII is false, there can be "bare particularity"—two things that differ in number but not in kind. This connects to the closing question.

  ---

  ### II. The Carrying Example

  **Verdict:** Do not use the computer files as the primary engine of the session. Use Black's Two Spheres.

  **Why the File Example Fails to Bear the Weight:**
  The file example is pedagogically seductive but metaphysically leaky for a sixty-minute session.
  1.  **The Container Problem:** A file exists on a disk. The disk sectors constitute an absolute grid. "Being at Sector 7" functions as an intrinsic coordinate in a file system in a way that "Being 5 miles from Sphere A" does not in a relational universe. To make the files truly indiscernible, you must posit two files in two identical computers in an empty void. But then you are describing Black's Spheres with extra steps.
  2.  **The Metadata Trap:** Students familiar with computing will invoke inodes, timestamps, or permissions. You will spend fifteen minutes explaining why we are stipulating those away. This wastes time on technicalities rather than metaphysics.
  3.  **The Relation Rescue:** You asked whether "sitting in this folder" is a feature or a relation. In a computer, the file system *defines* the file by its path. In Black's universe, space is not a container; it is constituted by the relations between the objects. This is the crucial metaphysical distinction. The file example secretly assumes Absolute Space (the disk); the Sphere example challenges the very existence of Absolute Space.

  **How to Use the File Example:**
  Use it as the **hook** (Minutes 5–10), not the **proof**.
  *   *Action:* Show two identical icons. Ask, "Are these one file or two?" Students will say "Two." Ask, "Why?" They will say, "Because they are in different folders" or "Have different names."
  *   *Pivot:* "Strip away the names. Strip away the folders. Put them in a universe where there is nothing but the data. Are they still two?"
  *   *Transition:* "To answer this without getting bogged down in how hard drives work, let's use a cleaner example."

  **Why Black's Spheres Should Carry the Session:**
  Black's universe is a vacuum. It forces the students to confront the concept of space itself.
  *   *The Location Objection:* When a student says, "But one is on the left," you can reply, "Left of what? There is nothing else in the universe."
  *   *The Relational Rescue:* If a student says, "One is five miles from the other," you ask, "Does that make them different?" Sphere A is 5 miles from B. Sphere B is 5 miles from A. They share the relational property of "being 5 miles from the other sphere."
  *   *The Breakdown:* The file example breaks down because the disk provides a third term (the sector) to distinguish them. The spheres have no third term. This forces the question: Is *numerical diversity* itself a primitive fact, or must it be grounded in a qualitative difference? The spheres isolate this question; the files obscure it.

  ---

  ### III. The Misconceptions

  Head these off in the order they will naturally arise. Do not wait for them to be voiced; preempt them as you transition between the sections above.

  **1. "The Two Principles are the Same Claim"**
  *   **When:** Minute 10 (immediately after introducing PII).
  *   **Preemption:** "It is tempting to think that if $A$ implies $B$, then $B$ implies $A$. In logic, this is a fallacy. In metaphysics, it is the difference between a definition and a discovery. We accept the first (Identicals are Indiscernible) as logic. We are questioning the second (Indiscernibles are Identical) as a fact about the world."

  **2. "But in Reality, Nothing is Exactly Alike"**
  *   **When:** Minute 25 (before introducing the spheres).
  *   **Preemption:** "You are correct. Empirically, PII might be true. But we are not doing science; we are doing metaphysics. We are asking if it is *possible* for two things to be exactly alike. If it is possible, PII is false, even if it never happens in this room."

  **3. "Spatial Location Makes Them Different"**
  *   **When:** Minute 35 (during the sphere description).
  *   **Preemption:** "You will want to say one sphere is 'here' and the other is 'there'. But 'here' and 'there' are not labels the universe provides. If there is no background grid, 'location' is only a relation between the two spheres. Since both stand in the same relation to each other, location cannot distinguish them unless you assume space exists independently of the objects. Leibniz denies that space exists independently."

  **4. "This is Just About Resemblance"**
  *   **When:** Minute 50 (before the closing discussion).
  *   **Preemption:** "Do not confuse qualitative identity (looking the same) with numerical identity (being the same). We grant they look the same. The question is: does the universe contain one object or two? If PII is false, 'twoness' does not require 'difference'."

  ---

  ### IV. The Closing and The Exclusions

  **The Diagnostic Question**
  Do not ask, "Is PII true?" (They will guess). Do not ask, "What is the counter-example?" (They will memorize).
  Ask this:
  > *"In the universe with the two spheres, if God deleted one sphere, would the remaining universe be missing anything other than the mass of that sphere?"*

  *   **If they grasp the stakes:** They will hesitate. If PII is false, the *position* of the remaining sphere changes (it is no longer 5 miles from another). But more importantly, they should realize that if PII is false, the *identity* of the remaining sphere is not grounded in its properties.
  *   **If they merely followed the example:** They will say, "Yes, it's missing a sphere."
  *   **The Grasp:** The student who understands will ask, "Which sphere did he delete? If they are indiscernible, does it matter?" This reveals they see that without PII, individuation is ungrounded.

  **What to Refuse to Cover**
  1.  **Quantum Mechanics:**
      *   *Refusal:* "In modern physics, particles like electrons violate PII. We will not discuss this."
      *   *Loss:* You lose the scientific relevance. Students love hearing philosophy is "proven" by science.
      *   *Gain:* You avoid the 20-minute explanation of bosons/fermions and the distinction between "principle of individuation" and "empirical indistinguishability."
  2.  **Possible Worlds Semantics:**
      *   *Refusal:* Do not use the formal apparatus of Kripke or Lewis. Do not draw circles representing worlds.
      *   *Loss:* You lose the rigorous tool used to analyze modality.
      *   *Gain:* You keep the focus on the *intuition* of possibility rather than the *logic* of world-indices.
  3.  **Substratum vs. Bundle Theory:**
      *   *Refusal:* Do not explain that Bundle Theory *entails* PII and Substratum Theory *denies* it.
      *   *Loss:* You lose the systematic home for the argument. They won't know *why* Leibniz cared (he was a Bundle Theorist).
      *   *Gain:* You avoid introducing "substratum" (a notoriously difficult concept) which will consume the remaining 20 minutes and confuse the issue of identity with the issue of substance.

  **Summary of Strategy:**
  Use the **Files** to hook their intuition of "two identical things." Use the **Spheres** to strip away the technical distractions and force the metaphysical choice. Use the **Property Distinction** to block the easy escape of spatial location. End with the **Deletion Question** to test if they understand that without PII, "this-ness" has no foundation.
