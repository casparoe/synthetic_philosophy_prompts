      *   **Task:** Create a *plan* for a 60-minute session on the Identity of Indiscernibles (PII) for mixed undergraduates (no philosophy background, one-off session).
      *   **Constraint 1 (Order of Ideas):** Specify the logical sequence of concepts. Explain *why* certain concepts must precede others (to avoid triviality/confusion). Identify what is unavoidable vs. what is a payoff.
      *   **Constraint 2 (Carrying Example):** Evaluate the user's proposed example (two identical computer files) vs. the classic example (Black's two spheres). Analyze the metaphysical weight of the file example (intrinsic vs. relational properties, location). Decide which example should carry the session.
      *   **Constraint 3 (Misconceptions):** List specific misconceptions in the order they will arise. Specify *when* to head them off.
      *   **Constraint 4 (Closing & Exclusions):** Provide a single diagnostic question to test understanding. List topics to exclude (quantum mechanics, possible worlds formalism, substratum/bundle theory) and acknowledge the cost of excluding them.
      *   **Tone:** Precise, pedagogical, philosophical, structured. Not the explanation itself, but the *plan* for the explanation.

  2.  **Deconstruct the Order of Ideas:**
      *   *Goal:* Make the principle non-trivial. If introduced too early, it sounds like a tautology ("things are identical if they are the same"). If introduced too late, the discussion lacks structure.
      *   *Step 1: The Two Principles.* Need to distinguish Identity of Indiscernibles (PII) from Indiscernibility of Identicals (II). II is uncontroversial (logic). PII is the controversial one.
      *   *Step 2: Intrinsic vs. Relational.* Crucial for the counter-example. If spatial location counts as a property, PII is trivially true. Must define "pure quality" or "intrinsic property" to make PII interesting.
      *   *Step 3: Modality (Possibility).* The debate isn't about *actual* things (we never find perfect duplicates). It's about *possible* things. This needs to come after the property distinction, otherwise, students just say "but in reality, they differ slightly."
      *   *Sequencing:*
          1.  Intro/II (The safe ground).
          2.  PII (The claim).
          3.  The Property Distinction (The trap).
          4.  The Thought Experiment (The test).
          5.  The Stakes (Why care?).
      *   *Payoff:* The distinction between "numerical identity" and "qualitative identity" is the payoff, not the starting point.

  3.  **Evaluate the Carrying Example (Files vs. Spheres):**
      *   *User's Idea:* Two byte-for-byte identical computer files.
      *   *Analysis:*
          *   *Pros:* Familiar to students. Digital ontology feels "pure."
          *   *Cons:* File systems *assign* locations (inode, block address). Is location intrinsic or relational? In a computer, the file *is* the data pattern, but the OS treats the pointer as part of the identity.
          *   *The "Location" Problem:* If "being at Block A" is a property, they differ. If it's a relation ("being to the left of Block B"), do they differ?
          *   *Black's Spheres:* Max Black chose spheres in an empty universe specifically to strip away *all* external relations (no space, no time, no observer).
          *   *Files:* Cannot strip away the storage medium easily. If you copy a file, the OS gives it a new ID. If you clone a drive, are they the same file?
          *   *Verdict:* The File example is *too messy* for a 60-minute intro. It invites technical objections ("but the MAC address...", "but the timestamp..."). Black's Spheres are abstract enough to force the metaphysical issue without technical distraction.
          *   *Role of Files:* Use files as the *hook* to introduce the intuition, then switch to Spheres to rigorous test it. Files show why we *think* there are two (different icons, different names). Spheres show what happens when you remove names/locations.

  4.  **Map Misconceptions:**
      *   *Misconception 1:* "II and PII are the same." (Head off immediately after defining).
      *   *Misconception 2:* "But in the real world, nothing is identical." (Head off when moving to the thought experiment/modality).
