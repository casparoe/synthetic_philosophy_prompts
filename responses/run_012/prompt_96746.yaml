      *   **The Law Analogy:** Q brings this in. Law accumulates precedent (constraints) but doesn't find "truth." Philosophy is like case law. P counters that case law *does* refine justice (progress), even if not scientific truth.

      *   **Refining the Argument:**
          *   Make sure P doesn't sound like a scientist trying to be a philosopher. P acknowledges the difference but defends the *structure* of progress.
