answer: |-
  ### Exam Question

  **Course:** Social Choice Theory (Upper-Level Seminar)
  **Time Allowed:** 90 Minutes
  **Question:** 1 (Compulsory)

  Consider the following social choice scenario involving two flatmates, Ada and Ben, and three social states:
  *   **$a$:** Blue wall, Quiet music
  *   **$b$:** White wall, Quiet music
  *   **$c$:** White wall, Loud music

  **Preferences:**
  *   **Ada:** $c \succ a \succ b$
  *   **Ben:** $b \succ c \succ a$

  **Rights Structure:**
  *   **Ada** is decisive over the pair $\{a, b\}$ (the wall color, holding music quiet).
  *   **Ben** is decisive over the pair $\{b, c\}$ (the music volume, holding wall white).

  **Task:**
  First, formally derive the social preference ordering generated by applying **Weak Pareto** and **Minimal Liberty** to this profile. Show explicitly where transitivity fails.

  Second, write a critical essay (approx. 600 words) evaluating the claim that *"Sen's Liberal Paradox demonstrates nothing more than a standard trade-off between individual freedom and Pareto efficiency."* In your response, explain why characterizing the result as a mere "trade-off" misunderstands the logical structure of the impossibility. Finally, briefly discuss which assumption (Pareto, Liberty, or Universal Domain) is the most plausible candidate for relaxation in this specific context, justifying your choice.

  ***

  ### Model Answer

  **Derivation of the Cycle**
  Applying the conditions to the profile yields an intransitive social ordering.
  1.  **Minimal Liberty (Ada):** Ada is decisive over $\{a, b\}$. Since Ada prefers $a \succ b$, society must rank **$a P b$**.
  2.  **Minimal Liberty (Ben):** Ben is decisive over $\{b, c\}$. Since Ben prefers $b \succ c$, society must rank **$b P c$**.
  3.  **Weak Pareto:** Comparing $a$ and $c$, both Ada ($c \succ a$) and Ben ($c \succ a$) prefer $c$. By the Pareto principle, society must rank **$c P a$**.

  Combining these yields the cycle: $a P b$, $b P c$, and $c P a$. Transitivity is violated; there is no stable social maximum.

  **Essay: Beyond the Trade-Off**
  Characterizing Sen's Liberal Paradox as a simple "trade-off" between freedom and efficiency is a category error that obscures the theorem's destructive power. A trade-off implies a stable frontier where society can choose a point balancing competing values—for example, sacrificing some efficiency to secure liberty, resulting in a suboptimal but consistent outcome. Sen's result is not about suboptimality; it is about incoherence.

  The paradox shows that satisfying Minimal Liberty and Weak Pareto simultaneously makes it *impossible* to construct a rational (transitive) social preference relation. It is not that we must choose liberty *over* efficiency; it is that if we accept both definitions of liberty and efficiency, the concept of "social choice" collapses. The "trade-off" reading assumes we can simply ignore Pareto to respect rights (or vice versa) and proceed. However, the paradox reveals that the *definition* of rights as "decisiveness over pairs" interacts with preference profiles (specifically meddlesome preferences) to generate logical contradictions, not just normative disagreements. The conflict is structural, not merely axiological.

  Furthermore, the "trade-off" view ignores the specific mechanism of the impossibility: the assignment of rights over specific pairs within a domain of universal preferences. The cycle arises because rights are defined locally (over pairs) while Pareto is global. When preferences are "meddlesome" (Ada and Ben both care about the outcome of the other's sphere), the local decisiveness clashes with global unanimity. A trade-off suggests we can keep the system and just weigh values differently. Sen proves the system itself is broken under these specific axioms.

  **Relaxing the Assumptions**
  To resolve this, one assumption must be dropped.
  Dropping **Universal Domain** is often the most plausible solution in practical contexts like flatsharing. The paradox relies on specific preference profiles where individuals care intensely about the other's personal sphere (Ada cares about Ben's music; Ben cares about Ada's wall). In many liberal societies, a norm of "non-meddlesomeness" restricts the domain of admissible preferences. If we assume individuals are indifferent to outcomes outside their personal sphere, the cycle vanishes.

  Dropping **Weak Pareto** is normatively costly, as it requires ignoring unanimous agreement. Dropping **Minimal Liberty** defeats the purpose of a liberal society. Therefore, restricting the domain of preferences—cultivating a social norm where flatmates respect private spheres without forming preferences over them—is the most coherent resolution. It preserves both rationality and liberty by preventing the specific preference conflicts that generate the cycle.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Part 1: Formal Derivation (5 Marks)**
  *   **2 Marks:** Correctly identifies $a P b$ based on Ada's decisiveness.
  *   **2 Marks:** Correctly identifies $b P c$ based on Ben's decisiveness.
  *   **1 Mark:** Correctly identifies $c P a$ based on Pareto and states the cycle ($a \to b \to c \to a$).
  *   *Penalty:* Deduct 2 marks if the cycle is incorrect or if decisiveness is applied to the wrong pairs.

  **Part 2: Critique of the "Trade-Off" Interpretation (10 Marks)**
  *   **4 Marks (The Incoherence Point):** Explicitly states that the result is *intransitivity* (logical breakdown), not just *suboptimality* (efficiency loss). Must argue that a trade-off implies a stable choice, whereas the paradox implies no choice is possible.
  *   **3 Marks (The Mechanism):** Identifies that the conflict arises from the interaction of *local* rights and *global* Pareto under *meddlesome* preferences. (Students who just say "rights clash with Pareto" without mentioning the structural/logical nature get max 2/3 here).
  *   **3 Marks (Depth):** Explains why the "trade-off" view is lazy/misleading (e.g., it suggests we can just pick one value, whereas the theorem says the framework fails).
  *   *Major Penalty:* If the student argues the paradox *is* just a trade-off, cap this section at 2/10.

  **Part 3: Resolution/Relaxation (5 Marks)**
  *   **2 Marks:** Proposes a specific assumption to relax (Domain, Pareto, or Liberty).
  *   **3 Marks:** Justifies the choice contextually. (e.g., Arguing for Domain Restriction is strong here because "flatmate norms" naturally restrict meddlesome preferences. Arguing for dropping Pareto requires strong normative defense).
  *   *Penalty:* Vague suggestions like "we should talk more" without linking to an axiom get 0/3 for justification.

  **Specific Mistakes & Penalties**
  *   **Reciting the Theorem:** If the answer describes Sen's original "Prude/Lewd" example instead of using Ada/Ben, deduct 3 marks (failure to apply).
  *   **Rights Incoherence:** If the student claims the cycle proves "rights are logically incoherent" generally (rather than this specific formulation of rights), deduct 2 marks.
  *   **Ignoring "Decisive over a Pair":** If the student treats rights as veto power or general influence rather than decisiveness over specific pairs, deduct 2 marks.
  *   **Word Count:** Significant deviation from ~600 words (e.g., <400 or >800) deducts 1 mark.

  **Grade Boundaries**
  *   **17-20:** Distinction. Clear derivation, nails the "incoherence vs. trade-off" distinction, nuanced resolution.
  *   **13-16:** Pass/Merit. Correct derivation, understands there is a conflict, but may lean slightly on the "trade-off" language or have a weaker resolution argument.
  *   **0-12:** Fail. Incorrect derivation, or claims the paradox is simply "freedom reduces efficiency."
