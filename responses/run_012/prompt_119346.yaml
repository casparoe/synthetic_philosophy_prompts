      *Reply:* "It doesn't diminish the good, it demystifies the saint. It's not supererogatory if it was inevitable."
      *Soft Spot:* Inevitability in fiction doesn't mean inevitability in reality.

      *Drafting The Prayer Question:*
      "So, when you sit down to write, do you feel like you're discovering moral truths, or just building a trap?" OR "Does this apply to real people? Are we just characters?"
      Let's go with the Real People one. It breaks the "fiction" shield.

  6.  **Refining the Output:**
      *   Make sure the "2-minute reply" is actually speakable (approx. 250-300 words).
      *   Ensure the "Soft Spot" is honest.
      *   Check the voices. Kantians talk about "maxims" and "autonomy." Consequentialists talk about "outcomes" and "states of affairs." Virtue Ethicists talk about "flourishing" and "character."

      *(Self-Correction during drafting)*: Make sure the Novelist voice in the replies sounds confident, not apologetic. They are the expert on *narrative*, the philosophers are the experts on *ethics*. The turf war is the point.

      *Re-ordering for maximum strategic value:*
      1.  **The Virtue Ethicist:** They are the specific foil. Start strong.
      2.  **The Kantian:** They are the majority. Need to keep them on side.
      3.  **The Consequentialist:** Easiest to handle.
      4.  **The Prayer Question:** Save for last.

