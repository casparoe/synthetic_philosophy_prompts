answer: |-
  **Question 1**
  You retain the revisionist claim that liability tracks the justice of the cause—unjust combatants are liable, just ones are not—but you argue both sides possess an equal *permission* to fight. Revisionists like McMahan argue that if you are liable to defensive harm, you are necessarily acting impermissibly. By decoupling permission from liability, aren't you rendering the concept of "permission" normatively inert? What work is this equality actually doing if the unjust combatant is still liable to be killed?

  **Follow-up 1**
  *Anticipating her appeal to the division of moral labor:* If you respond that this permission is merely institutional or role-based while liability remains moral, does that mean the "equality of combatants" is just a legal fiction? If the unjust combatant fights with a "permission" that doesn't protect them from being killed justly, in what sense are they morally equal to the just combatant rather than merely excused?

  **Question 2**
  Let's press that distinction between justification and excuse. If the unjust combatant is liable because they pose an unjust threat, but permitted because they cannot know the threat is unjust, this sounds like a classic epistemic excuse. Why insist on calling this a symmetric *permission* rather than admitting it is a symmetric *excuse*? Does labeling it permission inadvertently grant unjust combatants a moral right they shouldn't have?

  **Follow-up 2**
  *Anticipating her defense of the "permission" label:* If you argue that we must call it permission to preserve the professional integrity of the military, does that prioritize institutional stability over moral truth? Are you suggesting that soldiers *ought* to believe they are acting permissibly even when, objectively, they are contributing to an unjust threat?

  **Question 3**
  Your defense relies heavily on the epistemic limitation of the individual soldier; they cannot assess the *jus ad bellum*. But how does this apply to professional volunteers in modern states with free presses and intelligence leaks? When a soldier enlists in a war where public debate already signals aggressive intent, can they still claim the epistemic shield that grounds your equality of permission?

  **Follow-up 3**
  *Anticipating her distinction between general suspicion and specific knowledge:* If you concede that some volunteers might have "reason to think" the war is unjust, does your view imply a two-tiered military? Are we to hold that the grunt with no internet access is permitted to kill, while the intelligence analyst who suspects the *casus belli* is fabricated is not? How do you police that boundary without collapsing back into revisionism?

  **Question 4**
  You locate responsibility for the war's justice in political leadership, yet in a democracy, citizens vote for that leadership. If the citizenry bears some responsibility for an unjust war, does that responsibility trickle down to the combatants they authorize? Or does your division of labor imply that democratic citizens are permitted to vote for war but combatants are forbidden from assessing it?

  **Follow-up 4**
  *Anticipating her insulation of the military from political will:* If you argue that the soldier's duty is strictly to the state regardless of the electorate's will, does that render the combatant a mere instrument? If they are instruments of a potentially unjust populace, does that not make them responsible for the threat they pose, thereby triggering the liability condition you accept?

  **Question 5**
  You argue that uncertainty about *jus ad bellum* grants equal permission to fight. But *jus in bello* proportionality requires weighing the military advantage against the harm caused. If a combatant cannot know if their cause is just, can they truly calculate the proportionality of their actions? Doesn't the epistemic fog that grants permission to fight also blind them to the constraints on *how* they fight?

  **Follow-up 5**
  *Anticipating her separation of ad bellum and in bello calculations:* If you maintain that *in bello* proportionality can be assessed independently of the war's overall justice, are you not ignoring that the "military advantage" in an unjust war is morally worthless? If the objective is unjust, doesn't the uncertainty about that objective loosen the constraints on collateral damage more than you intend?

  **Question 6**
  This leads to a worry about moral hazard. If an unjust combatant can claim they "didn't know" the war was unjust to secure permission to kill, might they also claim they "didn't know" a specific strike was disproportionate? Does your reliance on epistemic limitations to ground equality inadvertently create a blanket excuse for violations of conduct that are difficult to verify in the fog of war?

  **Follow-up 6**
  *Anticipating her appeal to the strictness of in bello rules:* If you respond that *in bello* rules are clear enough to bypass this uncertainty, why is the *ad bellum* status too complex for them to assess but the *in bello* status clear? Is there a consistent epistemic standard here, or are you arbitrarily drawing the line where it suits the preservation of military equality?

  **Question 7**
  Turning to the strongest consideration against your view: Revisionists argue that by granting unjust combatants permission to kill, you violate the rights of the just combatants they target. Even if the unjust combatant is excused, doesn't the just combatant have a right not to be attacked by someone who is objectively liable? How do you reconcile the just combatant's right to safety with the unjust combatant's permission to infringe it?

  **Follow-up 7**
  *Anticipating her appeal to the symmetry of risk:* If you argue that war is a tragic realm where rights are necessarily compromised on both sides, does that not concede the revisionist point that war is a state of exception? If we must suspend the just combatant's right not to be attacked by liable aggressors, isn't that a costly concession that undermines the idea of individual rights in war entirely?

  **Question 8**
  Finally, you accept that liability attaches to those responsible for an unjust threat. But if the combatant is the one physically posing the threat, how can the leadership bear the responsibility that triggers liability while the combatant bears the liability itself? Doesn't this fracture the link between responsibility and liability that your own view relies upon?

  **Follow-up 8**
  *Anticipating her distinction between causal and moral responsibility:* If you argue the combatant is causally responsible but not morally responsible for the threat's injustice, does that distinction hold when they pull the trigger? If they are not morally responsible for the threat, on what grounds are they liable to be killed? It seems you must either make them morally responsible (and thus impermissible) or not liable (and thus fully equal), but you are trying to hold both positions.
