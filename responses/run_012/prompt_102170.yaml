answer: |-
  **TO:** The Trustees of the Wrenfield Trust
  **FROM:** The Chair
  **DATE:** 24 May 2024
  **SUBJECT:** Opinion on the Proposed Stewardship Charter

  **Bottom Line**
  I recommend that we reject the Stewardship Charter as drafted. While the underlying policy of avoiding grants for contested political causes is sound and worthy of adoption, the proposed entrenchment mechanism is illegitimate and procedurally flawed. We should instead adopt the policy as a standard standing order, reversible by a simple majority. This preserves our commitment to neutrality without binding future generations to our specific interpretation of that neutrality.

  **Context**
  We are divided on whether to codify our current caution regarding political activism. The proponents argue that the Trust's century-old educational remit is best served by staying above the fray. The opponents fear that defining 'political' is itself a political act, and that rigidity may render us irrelevant. My concern lies not with the policy itself, but with the attempt to insulate it from ordinary governance. A charity must be stable, but it must also be responsive to the world it seeks to serve.

  **The Logic of Precommitment**
  The primary justification for the Charter is that it acts as a precommitment device. In individual ethics, this logic is robust: Ulysses binds himself to the mast because he knows his future self will be weak-willed, yet he shares the same ultimate end—survival. He restricts his future freedom to secure his own enduring values. However, this logic does not survive translation to a corporate body existing in perpetuity.

  We are not a single continuous agent. We are a succession of distinct groups of trustees. The 'later self' in this analogy is not merely a weaker version of the 'earlier self'; it is a different entity with potentially divergent ends. A century ago, our founders endowed us with a broad educational remit. They did not, and could not, anticipate the specific contours of modern discourse. What we today classify as a 'contested political cause'—perhaps climate action or specific social liberties—future trustees might view as fundamental educational necessities.

  If we entrench this policy, we assume that our definition of 'political' is objectively correct for all time. This is a category error. When successors seek to repeal the policy, it will likely not be because they lack the will to resist pressure, but because they genuinely disagree with our judgment on what constitutes appropriate grant-making. By making repeal arduous, we are not protecting the Trust from weakness; we are privileging the moral framework of the present over the moral framework of the future. This is not stewardship; it is generational tyranny. The Charter can legitimately record our current intent, but it cannot legitimately disable the sovereign power of future boards to interpret the Trust's remit in light of their own times. To attempt to do so risks frustrating the primary charitable purpose—education—in favour of a secondary procedural constraint.

  **Design of the Amendment Clause**
  Even if one accepts that some friction against change is desirable, the specific mechanics of this Charter are poorly designed. The requirement for a two-thirds vote at two meetings twelve months apart, coupled with a five-year bar on re-enactment, creates a perverse asymmetry.

  Consider the cooling-off period. Requiring two votes separated by a year ensures that repeal is not a rash decision. This is defensible. However, the requirement to publish reasons for repeal at the first meeting, while transparent, adds a reputational cost that may deter necessary change even when the supermajority exists. It subjects trustees to public scrutiny for altering internal governance, potentially chilling legitimate evolution.

  More critically, the five-year bar on re-enactment is fundamentally unbalanced. If the policy is repealed, it is because the board has decided the restriction is harmful or obsolete. Yet, if that judgment proves mistaken—for instance, if the Trust immediately faces pressure to fund partisan campaigns—we are prevented from reinstating the safeguard for half a decade. This clause assumes that the *repeal* is the dangerous impulse, while the *restriction* is inherently stable. It privileges the status quo ante over the status quo. A well-designed constitution should make change difficult in both directions to ensure stability; this design makes locking in a policy easy (simple majority now) and unlocking it arduous, while making re-locking impossible.

  Furthermore, the threshold creates a minority veto. A block of just over one-third of the board can permanently maintain a policy that the majority believes harms the charity. In a voluntary board, this risks entrenching factionalism. If the work of the Trust is to be educational, our governance should model reasoned debate and majority rule, not procedural stalemate. A simpler mechanism—such as requiring a special resolution for any change to the grants policy, without the five-year lockout—would provide stability without the paralysis.

  **Recommendation**
  We should not shirk the difficult work of defining our boundaries. I propose we vote to adopt the policy statement regarding political causes as a standard resolution of the board. This signals our serious intent and guides current decision-making. However, we must reject the Stewardship Charter's entrenchment provisions. We must trust that future trustees, like us, will be motivated by the best interests of the Trust. If they wish to change course, they should be permitted to do so through a robust but conventional majority vote. We cannot bind the hands of those who will bear the responsibility for the Trust's relevance long after we have gone.

  I ask that you vote against the Charter as drafted and support the alternative resolution I shall circulate separately.
