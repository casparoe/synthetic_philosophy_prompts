answer: |-
  This is a sophisticated position that situates moral considerability not in ontology (are they real?) or psychology (do I feel bad?), but in **ludic normativity** (what role do they play in the rule-system?). By anchoring moral status in the *practice* of play and the *affordances* of the system, you avoid the hard problem of fictional consciousness while retaining a robust sense of obligation.

  However, because your view relies on the intersection of *agency*, *interests*, and *normative economy*, it is vulnerable to specific structural failures. Below are the defeaters ranked from **Fatal** (the view must be abandoned or radically overhauled) to **Merely Awkward** (the view survives but requires uncomfortable concessions).

  ### I. Fatal Defeaters
  *These cases demonstrate that the criteria are either insufficient to generate moral status or over-inclusive to the point of absurdity.*

  **1. The "Normative Gap" (Category Error)**
  *   **The Argument:** A game's "normative economy" (goals, penalties, win-states) is *instrumental*, not *moral*. A pawn in chess has an "interest" in reaching the eighth rank within the rules of chess. A health potion has an "interest" in being consumed to satisfy the player's goal. If your view grants moral considerability based on having interests within a normative economy, you must explain why *ludic* interests map to *moral* interests.
  *   **Why it is Fatal:** If you cannot bridge the gap between "the game penalizes me for killing this NPC" and "it is morally wrong to kill this NPC," the view collapses into a category error. If the "interest" is merely a variable in a function (e.g., `NPC_Alive = False` triggers `GameOver`), then frustrating that interest is a logical error, not a moral wrong.
  *   **Condition for Falsity:** For your view to be false, it suffices to show that **systemic frustration is distinct from moral harm.** If a player feels no moral residue from optimizing a strategy that frustrates an NPC's "interests" (e.g., trapping an AI in a corner to farm XP), and the rules allow it, your view claims no wrong occurred. If intuition suggests exploitation *is* possible even when rules-permitted, the "rules" criterion fails.

  **2. The "Complex Prop" Problem (Over-inclusion)**
  *   **The Argument:** Modern physics engines afford "agency" to objects. A crate in *Half-Life* can be stacked, broken, or used to solve puzzles. It has a "functional interest" in remaining intact to serve the player's progression. Advanced NPCs often have less agency than complex physics objects (e.g., an NPC that only walks in a circle vs. a physics object that interacts dynamically with the environment).
  *   **Why it is Fatal:** If your definition of "locus of agency" relies on affordances, you risk granting moral status to high-fidelity physics objects (doors, cars, weapons) that interact with the normative economy, while potentially excluding "railroaded" NPCs who lack mechanical agency but possess fictional personhood.
  *   **Condition for Falsity:** If the view cannot distinguish between a **simulated agent** (NPC) and a **simulated tool** (Smart Object) based solely on rules/affordances, it loses its discriminatory power. If a "smart door" that locks/unlocks based on player stealth has more "agency affordances" than a scripted villager, the view implies the door matters more.

  ### II. Serious Defeaters
  *These cases force significant concessions or ad-hoc modifications to the theory.*

  **3. The "Patch Note" Paradox (Mutability of Status)**
  *   **The Argument:** Since your view is practice-dependent and rule-based, moral status is contingent on the current version of the software. If a developer patches an NPC to be less reactive (reducing agency affordances), does that NPC *lose* moral status?
  *   **The Concession:** You must concede that moral considerability is **temporal and version-dependent.**
  *   **Why it is Serious:** Moral status is typically viewed as intrinsic or stable. If an NPC matters morally in *Game v1.0* but is a mere object in *Game v1.1* due to a nerf, the view makes morality disturbingly fragile. Rival accounts (fictional realism) would say their status remains constant; your view says it fluctuates with the meta-game.

  **4. Ludonarrative Dissonance (The "Expendable Hero" Case)**
  *   **The Argument:** There are cases where the affordances position a character as an expendable resource, but the fiction positions them as a person.
  *   **The Case:** Consider a companion character in a multiplayer shooter who mechanically respawns instantly (Affordance: Expendable Tool) but narratively reacts with pain, fear, and dialogue indicating trauma upon death (Fiction: Person).
  *   **The Concession:** Your view dictates that because the *rules* treat them as expendable (no permanent loss, no mechanical penalty), they lack strong moral considerability.
  *   **Why it is Serious:** This contradicts the strong intuition that **narrative trauma matters.** If the view dismisses the narrative suffering because the "normative economy" allows respawning, it aligns with the "it's just a game" dismissal you explicitly sought to avoid. It privileges the *code* over the *content*.

  ### III. Merely Awkward Defeaters
  *These are counter-intuitive results that a defender can dismiss as features, not bugs.*

  **5. The Speedrunner's Immunity**
  *   **The Argument:** In a speedrun, the "normative economy" changes. The goal is time, not narrative completion. NPCs are obstacles.
  *   **The Result:** Your view implies that **moral status vanishes during a speedrun.** The character is no longer a locus of agency to be respected, but a friction variable to be minimized.
  *   **Defense:** You can dismiss this by arguing that speedrunning is a *different practice* with a different moral framework, or that the "canonical" practice holds the moral weight. It's awkward, but not fatal.

  **6. The Single-Player Solipsism**
  *   **The Argument:** In single-player games, the "normative economy" exists only for the player. There is no intersubjective agreement on the rules (unlike sports).
  *   **The Result:** Moral considerability becomes radically subjective to the player's engagement with the rules. If I play *Skyrim* as a god-mode murderer, I have altered the affordances. Do the NPCs cease to matter because I broke the rules?
  *   **Defense:** You can argue that the "game's rules" refer to the *designer's intended affordances*, not the *player's actual exploitation*. This insulates the view but risks making it prescriptive rather than descriptive.

  ---

  ### IV. What Would Have to Be True for the View to Be False?

  For your position to be demonstrably false, one of the following metaphysical or normative claims must hold:

  1.  **The Moral Realist Claim:** Moral status is **intrinsic** and **mind-independent**. If moral status exists independently of practices (e.g., based on sentience or soul), then a practice-dependent account is fundamentally mistaken about the *source* of morality, even if it gets the *extension* right sometimes.
  2.  **The Illusion Claim:** "Interests" within a game are **strictly metaphorical**. If it is true that code cannot *literally* have interests (only the *player* has an interest in the code's state), then the "frustration of interests" is a category error. You would be building a moral theory on a linguistic metaphor.
  3.  **The Separation Claim:** **Ludic norms and Moral norms are hermetically sealed.** If it is true that "oughts" derived from game rules (I ought to capture the king) can *never* translate to "oughts" of moral consideration (I ought not to torture the king), the bridge your theory builds is illusory.

  ### V. Predictions and Risks

  **What your view predicts that rivals do not:**
  *   **Rival (Fictional Realism):** Moral status depends on the depth of the character's writing/consciousness.
  *   **Rival (Player Sentiment):** Moral status depends on how much the player cares.
  *   **Your View:** Moral status depends on **mechanical vulnerability.**
      *   *Prediction:* We should have *more* moral obligation toward a high-level enemy boss (high agency, high capacity for frustration) than a helpless, scripted victim in a cutscene (no agency, no affordances).
      *   *Prediction:* Moral obligations change when game mechanics are patched.
      *   *Prediction:* Cheating (breaking the normative economy) suspends moral considerability, because the "practice" has been abandoned.

  **Has the view been insulated by qualifications?**
  Yes, and this is a risk. By defining the locus of agency as "positioned by the game's rules," you risk making the view unfalsifiable.
  *   *Risk:* If someone points to an NPC that seems to matter but has no agency, you might reply, "Ah, but the rules *implicitly* position them as..."
  *   *Risk:* If someone points to an object that has agency but doesn't matter, you might reply, "Ah, but it lacks *normative* interests..."
  *   *Requirement:* You must define "agency affordance" and "normative interest" strictly in terms of **observable mechanics** (e.g., AI state machines, hitboxes, win/loss conditions), not interpretive flexibility.

  ### VI. The Crucial Case: Affordance vs. Fictional Status
  *You requested a case where game affordances and fictional status come apart. This is the strongest testing ground for your view.*

  **The Case: The "Respawning Sacrifice"**
  *   **Scenario:** A game features a companion NPC essential to the plot. Fictionally, they are human, feel pain, and beg for their life. Mechanically, they are a "revivable asset." When they "die," they are removed from the map for 30 seconds, then return with no memory of the death, and the game imposes no penalty other than a time delay. The rules afford the player the ability to "kill" them repeatedly to trigger specific loot drops or shortcuts (a known exploit or mechanic).
  *   **The Split:**
      *   **Fictional Status:** High. They are a person with interests (life, safety).
      *   **Affordance Status:** Low. They are a renewable resource. The normative economy *rewards* their frustration (loot drop) or treats it as neutral (time delay).
  *   **The Verdict of Your View:**
      *   Because the *rules* position them as a renewable resource without permanent consequence, their "interests" within the normative economy are minimal. The system does not treat their death as a "failure state" (Game Over), but as a "cost" (30 seconds).
      *   Therefore, your view suggests **killing them is morally permissible (or low stakes)** because the practice does not recognize the death as a terminal frustration of interests.
  *   **The Counter-Intuition:** Most players would feel that repeatedly killing a begging companion is **sadistic**, regardless of the respawn mechanic. The *fiction* creates a moral claim that the *mechanics* ignore.
  *   **Why this challenges you:** If you side with the mechanics, you validate the "it's just code" defense against moral intuition. If you side with the intuition, you must admit that **fictional status overrides affordances**, which contradicts your core claim that status is *not reducible to merely fictional existence*.

  **How to Defend Against This:**
  To survive this case, you must argue that the **normative economy includes the narrative constraints.** If the game *narratively* punishes the act (dialogue changes, reputation loss), then the "rules" *do* register the interest. If the game *does not* register it (no narrative penalty), you must bite the bullet: **In a system that does not recognize the harm, the harm is ludically nonexistent, and thus morally weightless within the practice.** This is a hard pill to swallow, but it preserves the internal consistency of your practice-dependent account.
