prompt: |-
  I hold a practice-dependent account of moral considerability for video-game characters: a character matters morally when the game's rules and affordances position it as a locus of agency whose interests can be frustrated or satisfied within the game's normative economy, and this status is not reducible either to player sentiment or to the character's merely fictional existence. What would count against this position? I want the defeaters ranked from fatal to merely awkward: which cases, arguments, or results in the metaphysics of fiction, moral status, or game design would a defender have to concede as counting against the view, and which would they dismiss? In particular, tell me what would have to be true for the view to be false, what it predicts that rival accounts do not, and whether it risks anything at all or has been insulated by qualifications. I would be most persuaded by a case in which the game's affordances and the character's fictional status come apart.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Claim:** A "practice-dependent account of moral considerability for video-game characters."
      *   **Criteria for Moral Matterings:**
          1.  Game rules/affordances position the character as a *locus of agency*.
          2.  Their interests can be *frustrated or satisfied* within the game's *normative economy*.
          3.  This status is *not reducible* to player sentiment (subjectivism) or merely fictional existence (ontological irrealism).
      *   **Goal:** Identify defeaters (arguments/cases against the view), ranked from Fatal to Merely Awkward.
      *   **Specific Requests:**
          *   What would have to be true for the view to be false?
          *   What does it predict that rival accounts do not?
          *   Does it risk anything, or is it insulated by qualifications?
          *   *Crucial:* A case where game affordances and fictional status come apart.

  2.  **Deconstruct the View (Philosophical Anatomy):**
      *   *Practice-Dependence:* Moral status arises from the activity (playing the game), not pre-existing metaphysics.
      *   *Agency Locus:* The character must be capable of acting (or being acted upon in a way that implies agency) within the rules.
      *   *Normative Economy:* The game has goals, penalties, rewards. "Interests" are defined by these mechanics (e.g., an NPC "wants" to patrol a path; a pet "wants" to be fed).
      *   *Anti-Reductionism:* It's not just "I feel bad" (sentiment) and not just "They are fake" (ontology). It's about the *structural role* in the system.

  3.  **Brainstorming Defeaters (Potential Counter-Examples/Arguments):**

      *   *Idea 1: The Glitch/Exploit.* If a character is treated as an agency locus by rules but is clearly broken (e.g., an NPC stuck in a wall screaming), does it matter?
      *   *Idea 2: The Prop vs. Person.* A physics object (crate) has rules (can be pushed, broken). Does it have interests? If not, why does the NPC?
      *   *Idea 3: The "Paper Mario" Problem.* Characters are explicitly aware they are in a game. Does this break the normative economy?
      *   *Idea 4: The Background NPC.* An NPC with no agency, just walking a path (e.g., *Skyrim* citizens). They have "interests" (don't die), but no agency.
      *   *Idea 5: The Moral Schizophrenia.* Killing an NPC in gameplay is fine; killing them in a cutscene is tragic. The view says rules matter, but cutscenes remove rules.
      *   *Idea 6: The "True" Ontology.* If the character is *literally* code, can "interests" exist without consciousness?
      *   *Idea 7: Player Intent vs. System Design.* Speedrunners treat characters as obstacles. Roleplayers treat them as people. Which practice counts?

  4.  **Ranking the Defeaters (Fatal to Awkward):**

      *   *Fatal:* Cases where the criteria are met, but moral intuition screams "no," OR cases where criteria aren't met, but intuition screams "yes." Also, internal contradictions.
      *   *Serious:* Cases that require significant ad-hoc modification to the theory.
      *   *Awkward:* Cases that are weird but manageable.

      *   *Candidate for Fatal:* **The "Mechanical Token" Problem.** If a health potion or a door has "interests" (don't be used/opened) within the normative economy, does it have moral status? If the view says "No," it needs a distinction between *agency locus* and *tool*. If it can't distinguish a generic NPC from a complex prop, the "agency" criterion fails.
      *   *Candidate for Fatal:* **The "Ludonarrative Dissonance" Case.** A character is mechanically expendable (respawns, farming) but narratively sacred. The view prioritizes mechanics. If we feel moral outrage at killing a respawning NPC *because of the story*, the view gets it wrong.
      *   *Candidate for Serious:* **The "Empty Shell" (Background NPC).** They have interests (survive) but minimal agency. Does the view grant them status? If yes, is it too permissive? If no, is it too strict?
      *   *Candidate for Awkward:* **Speedrunning.** The practice changes the normative economy. Does moral status vanish during a speedrun?

  5.  **Addressing Specific Prompts:**

      *   *What makes it false?* If "interests" within a game cannot map to *moral* interests (category error). If the "normative economy" is purely instrumental, not moral.
      *   *Predictions:* It predicts we should care more about mechanics than story. It predicts moral status changes if game rules change (patches/updates).
      *   *Insulation Risk:* The definition of "locus of agency" is the weak point. If it's too vague, the theory is unfalsifiable.
      *   *Affordance vs. Fictional Status:* This is the key request. I need a case where the *rules* say one thing (expendable) but the *fiction* says another (person), or vice versa.

  6.  **Developing the "Affordance vs. Fictional Status" Case:**
      *   *Scenario:* A game where NPCs are mechanically infinite/respawning (affordance = resource) but narratively unique/loved (fiction = person).
      *   *Example:* *Dark Souls* Hollows vs. *The Last of Us* companions.
      *   *Better Example:* *Undertale*. The mechanics allow killing, the fiction begs mercy.
      *   *Best Example for the Prompt:* **Procedural NPCs vs. Scripted NPCs.** Consider an MMO. One NPC is a quest giver with deep lore (Fiction: High). Another is a generic guard (Fiction: Low). But mechanically, both are identical hit-point bags (Affordance: Same).
      *   *The Split:* What if a character is mechanically complex (high agency affordance) but fictionally a robot/zombie (low fictional status)? Or mechanically simple but fictionally human?
      *   *Refined Case:* **The "Training Dummy" that talks.** Imagine an NPC designed for combat practice. It has AI, dodges, blocks (Agency Locus). It has "interests" (survive the round). But fictionally, it is an object. If the view grants moral status, it clashes with the fiction. If it denies it, it clashes with the mechanics.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the view (it's a ludic-normative hybrid).
      *   *Section 1: Fatal Defeaters.* Focus on the "Category Error" (game interests $\neq$ moral interests) and the "Prop Problem" (distinguishing agents from complex tools).
      *   *Section 2: Serious Defeaters.* Ludonarrative Dissonance (Mechanics vs. Story). The "Patch" problem (Moral status changing via update).
      *   *Section 3: Awkward Defeaters.* Speedrunning, Cheating, Single-player vs. Multi-player norms.
      *   *Section 4: Predictions & Risks.* It predicts moral status is mutable (patches). It risks being too broad (including enemies) or too narrow (excluding cutscene victims).
      *   *Section 5: The Affordance/Fiction Split.* Construct the specific case requested. The "Sentient Loot" or "The Expendable Hero." Let's go with **The "Respawning Companion."**
          *   *Case:* A companion character who dies and respawns mechanically (Affordance: Expendable/Tool) but reacts with trauma narratively (Fiction: Person).
          *   *Conflict:* The view says "expendable" (rules dominate). Intuition says "abusive" (fiction dominates).

  8.  **Refining the "Fatal" Critique:**
      *   The strongest philosophical attack is the **Normative Gap**. Just because a system has rules (normative economy) doesn't mean those rules generate *moral* obligations. Chess has a normative economy. Do pawns have interests? If the view says "No, because pawns aren't agency loci," then we need to know why an NPC is different. If the NPC is just code, the "interest" is metaphorical. If the view admits the interest is metaphorical, can a metaphorical interest ground *real* moral considerability? This is the "Error Theory" attack.

  9.  **Final Polish:** Ensure the tone is rigorous, philosophical, and directly answers the ranking constraint. Check that the "Affordance vs. Fiction" case is highlighted. (Self-Correction: Make sure to distinguish between "agency of the character" vs "agency of the player acting on the character." The prompt says "position it as a locus of agency." This implies the character itself acts.)

  10. **Final Review against constraints:**
      *   Ranked defeaters? Yes.
      *   What makes it false? Yes.
      *   Predictions? Yes.
      *   Risks/Insulation? Yes.
      *   Affordance/Fiction split case? Yes.

