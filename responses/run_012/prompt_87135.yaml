prompt: |-
  me and my flatmate are having a long-running fight about AI risk and we want to drag von Neumann into it, mostly because she's convinced he'd be on her side. help me figure out whether he actually would be.

  here's her framework, which she calls the two ratchets. every dangerous technology has two failure modes running at once. the speed ratchet: the faster it develops and the fewer people who understand it, the more likely something goes wrong, so the sane move is to slow the whole field down — moratoria, compute caps, licensing, an international slow-down treaty. the lead ratchet: the more likely some other actor gets there first, the more likely things go wrong, because whoever's behind will be less careful, so the sane move is to speed up and make sure you're ahead. her claim is that these two are always both running, that most AI policy arguements are just people staring at one and ignoring the other, and — the part i doubt — that von Neumann would've said the speed ratchet is basically a myth for anything that matters, because progress is irreversible and you can't unlearn a technology, so the only real choice is who gets there first.

  the specific thing we're arguing about is a proposal she likes: instead of a treaty, every frontier lab has to run training above some threshold with a kill switch that a designated rival lab can pull. mutual hostage instead of mutual inspection. she says this is the von Neumann solution. i say it's a cute idea that he would've shredded.

  so what i want: (1) how would von Neumann have carved up these two ratchets — would he have recognized both, and which one would he have weighted, and why? ground it in stuff he actually believed, not just vibes about him being a hawk. (2) which parts of her framing import assumptions he'd have rejected? (3) is there a third option that neither of us is seeing, maybe something from his work on machines that build copies of themselves? (4) bottom line: is she right that he'd back the lead ratchet, or is she reading her own priors into him?

  try to seperate the parts where you're confident from where you're just extrapolating, and don't worry about citing anything, i'm not going to check.
