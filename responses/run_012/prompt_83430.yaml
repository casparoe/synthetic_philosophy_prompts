answer: |-
  ### Brainstorm: Deconstructing the Commitments

  Before offering a resolution, we must clarify the hidden axioms each neighbour is defending. They are not merely disagreeing on strategy; they are disagreeing on the structure of reality and value.

  **The Economist (Expected Value Maximization)**
  *   **Commitment to Linearity:** He assumes the utility of money is linear ($U(w) = w$). A 10% gain is always worth exactly as much as a 10% loss is painful.
  *   **Commitment to Ensemble Averages:** He treats the wager as one instance in a parallel universe of infinite possibilities. He cares about the *average outcome across all possible worlds*, not the *sequence of outcomes in this specific world*.
  *   **Commitment to Reversibility:** Implicitly, he assumes ruin is not absorbing. If you go broke, the game resets or wealth can be instantly replenished without cost.
  *   **Blind Spot:** He ignores "volatility drag." In repeated compounding, variance reduces geometric growth. A 50% loss requires a 100% gain to recover; the arithmetic mean lies, the geometric mean tells the truth.

  **The Poker Player (Risk of Ruin Management)**
  *   **Commitment to Concavity:** He assumes the utility of money is concave (diminishing marginal returns). Losing your house hurts more than buying a second house helps.
  *   **Commitment to Time Averages:** He treats the wager as part of a temporal sequence. He cares about survival over time (ergodicity). If you go broke at $t=5$, the expected value at $t=100$ is irrelevant because you are not there to collect it.
  *   **Commitment to Irreversibility:** He assumes ruin is absorbing (game over).
  *   **Blind Spot:** Without a specific formula (like Kelly), "bet small" is heuristic. It can lead to under-betting, leaving significant growth on the table, or over-betting if the edge is misjudged.

  ***

  ### The Principled Answer

  You are asking for the bridge between decision theory and stochastic processes. The conflict between your neighbours is resolved by **Expected Utility Theory** combined with the concept of **Ergodicity**.

  The Economist is mathematically correct only if you live in an "ensemble" world (many clones of you betting once). The Poker Player is practically correct because you live in a "time" world (one you betting many times over a lifetime).

  Here is the general rule, the specific fraction, and the reconciliation of insurance.

  #### 1. The General Rule: Maximize Expected Utility, Not Expected Wealth
  The rational objective is not to maximize $E[W]$ (Expected Wealth), but $E[U(W)]$ (Expected Utility of Wealth).

  *   If $U(W) = W$ (Linear), you bet 100%.
  *   If $U(W) = \ln(W)$ (Logarithmic), you bet according to the **Kelly Criterion**.

  Why Logarithmic? For a rational agent whose wealth represents future opportunities, utility scales with the *percentage* change in wealth, not the absolute amount. Losing 50% of \$1 million feels the same as losing 50% of \$10,000. This is the only utility function that is invariant to the currency unit and aligns with long-term geometric growth.

  #### 2. The Single Wager: What Fraction to Name?
  In your specific case: $p = 0.6$ (win probability), $q = 0.4$ (loss probability), payout is even money ($b=1$).

  If you adopt the Logarithmic Utility assumption (which is standard for rational long-term capital management), the optimal fraction $f^*$ is given by the Kelly Criterion formula:
  $$f^* = \frac{p(b+1) - 1}{b} = p - q$$
  $$f^* = 0.6 - 0.4 = 0.2$$

  **I would name 20% of my savings.**

  **Why 20% and not 40%?**
  If you bet 40%, you are "over-betting." While the *arithmetic* expected value is higher, the *geometric* growth rate declines. More critically, the risk of drawdown increases disproportionately. At 100% bet size (the Economist's advice), a single loss reduces wealth to zero. In a log-utility framework, $\ln(0) = -\infty$. It is an infinitely bad outcome.

  **Why 20% and not 10%?**
  If you bet 10%, you are "under-betting." You sacrifice growth for safety you do not need. The growth rate function is parabolic around the Kelly optimum. Being half-Kelly (10%) reduces volatility significantly but only reduces expected growth linearly. However, since this is a *single* wager with a known 60% edge, 20% captures the maximum expected logarithmic return.

  #### 3. The Repeated Wager (100 Times)
  If the coin is offered 100 times and you reinvest, the answer **does not change**, but the reasoning becomes stronger.

  This is the domain of the **Law of Large Numbers for Geometric Means**.
  *   **The Economist's Error:** If you bet 100% every time, your arithmetic expected value is enormous. However, the probability of encountering at least one "tails" in 100 flips is $1 - 0.6^{100} \approx 1$. One tails wipes you out. The ensemble average is high; the time average is zero.
  *   **The Kelly Result:** Betting 20% maximizes the long-term exponential growth rate of your bankroll. Any fraction higher than 20% increases variance more than it increases return, eventually leading to ruin. Any fraction lower than 20% is safe but suboptimal.

  In repeated play, the Poker Player is objectively correct. The Economist is victim to the **Ergodicity Problem**: the average outcome of the system (ensemble) is not the same as the outcome experienced by the individual over time (time average).

  #### 4. Reconciling Insurance (Negative EV)
  How can the same logic that tells you to bet 20% on a positive EV coin tell you to buy negative EV insurance?

  Insurance is a wager with negative expected monetary value ($E[W] < 0$) but positive expected utility ($E[U(W)] > 0$) for a concave utility function.

  Let $W$ be your wealth.
  *   **Scenario A (No Insurance):** You face a 1% chance of losing \$50,000 (catastrophic).
      *   $E[W]$ is high (you keep the premium).
      *   $U(W)$ is low because $\ln(W - 50,000)$ drops precipitously.
  *   **Scenario B (Insurance):** You pay \$1,000 premium (which is > 1% of \$50,000, so negative EV).
      *   $E[W]$ is lower (you paid the premium).
      *   $U(W)$ is higher because you have capped the downside. You have traded a small certain loss for the elimination of a large uncertain loss.

  The Poker Player buys insurance because he treats a car crash or a medical emergency as a "ruin" event (or close to it) that disrupts the compounding trajectory of his life. The Economist refuses it because he looks only at the immediate cash flow expectation.

  ### Assumptions and Failure Modes

  You asked where this reasoning fails. It is not universal law; it rests on specific axioms.

  **1. The Linearity Assumption (When the Economist Wins)**
  If your utility for money *is* actually linear over the relevant range, bet 100%.
  *   *Example:* You are playing with "house money" that you cannot keep anyway, or the stake is so negligible relative to your total net worth that the curvature of the log function is flat.
  *   *Example:* You are a massive institution where a 100% loss of this specific fund does not impact operational solvency.
  *   *Diagnosis:* If losing the entire stake would not alter your life trajectory or future earning capacity, the Poker Player's caution is mathematically wasteful.

  **2. The Absorbing Barrier Assumption (When the Poker Player Wins)**
  The Kelly/Log-Utility argument relies on ruin being final (an absorbing barrier at $W=0$).
  *   *Failure Mode:* If you can go broke and earn it all back quickly (e.g., you have high human capital relative to financial capital), you can afford to bet more aggressively.
  *   *Correction:* In this case, you should calculate your stake based on **Total Capital** (Financial + Present Value of Future Earnings), not just savings. If your human capital is \$2M and savings are \$200k, a 20% bet on savings is only a 2% bet on total capital.

  **3. The Edge Estimation Assumption (The Practical Failure)**
  The Kelly Criterion is aggressive. It assumes you know $p$ exactly.
  *   *Failure Mode:* In the real world (unlike your biased coin), you rarely know the edge. If you think $p=0.6$ but it is actually $0.55$, full Kelly betting can lead to ruin.
  *   *Practical Adjustment:* Professional gamblers and investors often use **"Fractional Kelly"** (e.g., bet half the recommended amount). In your coin case, since the bias is *assured* by a friend, I stick to 20%. If you had to estimate the bias yourself, I would recommend 10% to account for parameter uncertainty.

  ### Summary Advice

  1.  **The Principle:** Maximize the expected logarithm of wealth, not the expected value of wealth. This aligns your decisions with the time-average growth of your life rather than the ensemble-average of a theoretical universe.
  2.  **The Wager:** Stake **20%** of your investable capital. This is the mathematical optimum for geometric growth given a 60/40 edge at even money.
  3.  **The Insurance:** Buy it. The negative expected monetary value is the price you pay to remove tail risk that would severely damage your logarithmic utility function.
  4.  **The Caveat:** If the stake is trivial relative to your total lifetime resources (including future earnings), you may move toward the Economist's position. If the stake represents survival, you must adhere to the Poker Player's discipline.

  Your neighbour the Poker Player has discovered the non-ergodic nature of life through experience. The Economist is modelling a world that does not exist. Trust the Poker Player, but use the Kelly formula to quantify his intuition.
