prompt: |-
  I am a retired geophysicist who has spent the past three years reading philosophy on my own, and I have run into a disagreement I cannot settle. I would like you to take it up as an expert in rational choice and the mathematics of risk. Please think carefully before you answer, and begin with a brief brainstorm in which you set out what each of the two positions below is actually committed to; only then give me your advice.

  My neighbour across the road plays poker for a living. His counsel is twofold. First: never stake more than a small slice of my savings on any wager, even one that plainly favours me, because the players he has watched go broke were not unlucky but overbet — past some stake, ruin becomes a matter of time rather than chance. Second: I should buy the extended warranty on the car and the travel insurance for our trip, both of which I have priced out and both of which cost more than they can possibly pay back on average. My other neighbour, a retired economist, says the reverse of both: stake as much as possible on anything with positive expected value, and never buy insurance priced above its expected payout.

  Neither man can give me a principle, only a habit. Here is the case that makes me want one. A friend has a coin he assures me is biased sixty-forty in my favour, and offers a single wager at even money — once only, no repeats — and asks me to name the stake. The economist says the expected gain is twenty per cent of whatever I put up, and that I should therefore put up everything. The poker player will say only that the stake should be small, without saying how small. Is there a principled answer, and what is it? What fraction would you actually name, and why that fraction rather than one twice or half as large? Does the answer change if the same coin is offered to me a hundred times and I reinvest as I go? And how can the same reasoning that restrains me on the coin tell me to buy insurance that is worth less than it costs?

  Give me the general rule, be explicit about the assumptions it rests on, and tell me where it fails — if, say, my taste for money over the relevant range really is linear, or if ruin would not be final because I could earn it all back. I am not afraid of mathematics, and I would rather have your reasoning than a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired geophysicist, 3 years of self-study in philosophy. Comfortable with math ("not afraid of mathematics"), wants reasoning over reading lists.
      *   **The Conflict:** Poker Player (Kelly Criterion/Risk of Ruin intuition) vs. Retired Economist (Expected Value Maximization).
      *   **The Specific Case:** A single biased coin toss (60/40 in favor), even money payout, name the stake.
      *   **The Questions:**
          1.  Is there a principled answer? What is it?
          2.  What fraction would you name and why?
          3.  Does it change if repeated 100 times with reinvestment?
          4.  How does this reasoning justify buying negative EV insurance?
          5.  Give the general rule, assumptions, and failure modes (linear utility, non-final ruin).
      *   **Constraint:** Begin with a brief brainstorm setting out what each position is committed to. Then give advice.

  2.  **Brainstorming & Deconstructing the Positions:**
      *   **The Economist (Expected Value Maximization):**
          *   *Core Principle:* Maximize $E[X]$.
          *   *Implicit Assumption:* Utility of wealth is linear ($U(w) = w$). One-off decision or infinite ensemble average. Risk neutrality.
          *   *Commitment:* Bet 100% on positive EV. Never buy negative EV insurance.
          *   *Weakness:* Ignores "ruin" (wealth hitting 0 or below). Ignores diminishing marginal utility of money. In repeated games, 100% betting leads to almost certain ruin despite positive EV (volatility drag).
      *   **The Poker Player (Risk of Ruin Management):**
          *   *Core Principle:* Survival first, growth second.
          *   *Implicit Assumption:* Utility of wealth is concave (logarithmic or similar). Repeated play (ergodicity issue).
          *   *Commitment:* Bet small fraction (Kelly Criterion intuition). Buy insurance to cap downside tail risk.
          *   *Weakness:* Can be overly conservative for one-off scenarios if utility is actually linear near current wealth. Doesn't always quantify "small."
      *   **The Core Tension:** Time averages vs. Ensemble averages. Ergodicity. Utility functions.

  3.  **Formulating the Principled Answer (The "Expert" Voice):**
      *   *Field:* Decision Theory / Information Theory / Stochastic Processes.
      *   *Key Concept:* The Kelly Criterion (for repeated play) and Expected Utility Theory (for single play).
      *   *Resolution:* The Economist is right about *ensemble average* (one-off, many people), but wrong about *time average* (one person, many times). The Poker Player is right about survival and compounding, but needs a formula for "how small."
      *   *The Single Bet:* Depends on the Utility Function. If $U(w) = \ln(w)$, Kelly applies even to single bets if one views wealth as a trajectory. If $U(w) = w$, bet all. Real humans usually have concave utility.
      *   *The Repeated Bet:* Kelly Criterion is optimal for maximizing geometric growth rate. $f^* = p - q/b$. Here $p=0.6, q=0.4, b=1$. So $f^* = 0.2$.
      *   *Insurance:* Insurance is buying a reduction in variance/risk of ruin at the cost of negative EV. It makes sense if utility is concave (marginal utility of losing \$10k is higher than gaining \$10k).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction/Brainstorm:** Explicitly map the commitments as requested.
          *   Economist: Linear utility, ensemble average, risk neutrality.
          *   Poker Player: Concave utility, time average, risk of ruin aversion.
      *   **The General Rule (Expected Utility):** The bridge between the two. Maximizing $E[U(W)]$, not $E[W]$.
      *   **The Single Wager:**
          *   If utility is linear: Bet 100% (Economist wins).
          *   If utility is logarithmic (wealth is for living/growing): Bet 20% (Kelly).
          *   Why 20%? Derive it briefly. $0.6 \ln(1+f) + 0.4 \ln(1-f)$. Maximize wrt $f$.
          *   Why not 40%? Risk of ruin increases, geometric growth drops.
          *   Why not 10%? Too conservative, leaves growth on table.
      *   **The Repeated Wager (100 times):**
          *   This is the domain of the Law of Large Numbers applied to *geometric* means.
          *   Betting 100% leads to ruin with probability $\to 1$ (even with positive EV) because one loss wipes you out.
          *   Kelly (20%) maximizes the long-term growth rate.
          *   Mention "Volatility Drag."
      *   **The Insurance Question:**
          *   Insurance has negative EV ($E[W]$ decreases).
          *   But it increases $E[U(W)]$ if $U$ is concave.
          *   It swaps a small certain loss (premium) for a low-probability catastrophic loss.
          *   Connect back to the Poker Player's "ruin" intuition.
      *   **Assumptions & Failure Modes:**
          *   Assumption: You care about long-term wealth trajectory (log utility).
          *   Failure 1: Linear Utility (e.g., playing with house money, or wealth is negligible compared to total utility).
          *   Failure 2: Non-ergodic/Ruin not final (can earn back).
          *   Failure 3: Edge estimation error (Kelly is aggressive if $p$ is wrong; suggest "Half-Kelly").
      *   **Conclusion:** Synthesize. The Poker Player is practically right for life (non-ergodic), Economist is theoretically right for abstract ensembles.

  5.  **Refining the Tone:**
      *   Respectful of the user's background (geophysicist/philosopher).
      *   Rigorous but accessible math.
      *   Avoid condescension.
      *   Ensure the "Brainstorm" comes *first* as requested.

  6.  **Self-Correction/Nuance Check:**
      *   *Correction:* In the single bet case, Kelly is technically derived for repeated bets. For a *single* bet, the optimal fraction depends entirely on the specific utility function. However, Log Utility is the standard proxy for "rational long-term agent." I need to make sure I distinguish between the single-case optimization (Expected Utility) and the repeated-case optimization (Kelly/Growth Rate). They converge if $U = \ln$.
      *   *Nuance:* The prompt asks "What fraction would you actually name?" I should commit to a number based on standard rational assumptions (Log Utility/Kelly), while acknowledging the dependency on utility.
      *   *Insurance:* Make sure to explain *why* negative EV is acceptable (concavity).
      *   *Ergodicity:* This is a key philosophical point relevant to a philosophy reader. Ole Peters' work on ergodicity economics is highly relevant here. I should mention the distinction between ensemble and time averages.

  7.  **Final Polish:** Check against all constraints.
      *   Brainstorm first? Yes.
      *   Expert tone? Yes.
      *   Math included? Yes.
      *   Assumptions/Failures explicit? Yes.

