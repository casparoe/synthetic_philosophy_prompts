          *   *Final Decision:* Elena (Worst-Case) wins the logical battle. The "Quicksort" analogy fails because software doesn't learn from adversaries in real-time the way ML does. The "Training Run" guarantee is indeed weak, but relying on *no* guarantee is worse. Marcus realizes his "Expected Value" calculation collapses when the downside is infinite/undefined.

