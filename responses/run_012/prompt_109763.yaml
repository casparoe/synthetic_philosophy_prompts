  4.  **Misconceptions & Interventions:**
      *   *Economists (Money Pump):* They will say "If you violate transitivity, I can pump you." *Intervention:* Distinguish *normative* transitivity (what is rational) from *descriptive* transitivity (what people do). The argument challenges the *norm*. Also, money pumps assume cyclical preferences, not just spectrum failure.
