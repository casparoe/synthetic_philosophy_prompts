answer: |-
  **MEMORANDUM**

  **TO:** Members of the Acquisitions and Ethics Committee
  **FROM:** The Chair
  **DATE:** 24 October 2023
  **SUBJECT:** Recommendation Regarding Proposed Acquisition of [Work Title]

  Colleagues,

  We meet in a fortnight to vote on the proposed acquisition of the video installation in question. As you know, our Collections Policy mandates committee review when a work's production involved significant harm to an identifiable person. We are currently divided: half of us prioritise the preservation of a historically defining work and the subject's current agency; the other half fear we would be laundering an ethical wrong and financially rewarding its author.

  Before we vote, I wish to circulate my own assessment to focus our deliberation. My recommendation is to **proceed with the acquisition, subject to strict conditions regarding financial benefit and interpretive context.**

  **The Nature of the Wrong**
  To decide, we must locate the ethical breach. I judge that the primary wrong lies in the **making** of the work. The power imbalance between the artist and the student, coupled with the 'thin consent' regarding degradation, constitutes an exploitation that cannot be undone. The work's critical power is, as noted, inseparable from this harm; the 'realness' of the degradation is the aesthetic engine. Therefore, the value is not separable from the troubling conduct.

  Consequently, the **showing** of the work carries a secondary risk. If displayed celebratorily, we become complicit in the original exploitation. However, the **keeping** of the work is not inherently wrongful. A university museum has a duty to preserve complex cultural artefacts, even those born of unethical acts, provided we do not sanitise their history. To destroy or hide the work would be to erase evidence of a specific kind of artistic misconduct prevalent in that era.

  **Recommendation and Reasoning**
  I propose we acquire the work on two conditions:
  1.  **Financial:** The artist must waive all continuing exhibition fees and royalties. The museum will pay the purchase price to secure the object for the public trust, but we must not facilitate ongoing profit from the harm.
  2.  **Interpretive:** Any display must explicitly contextualise the production history, centre the subject's testimony (past and present), and avoid presenting the work as a triumph of artistic vision without acknowledging the human cost.

  This approach respects the subject's stated wish for preservation without accepting the artist's lack of regret as acceptable. It acknowledges the work's art-historical significance while refusing to 'launder' the misconduct. We steward the object as evidence, not merely as a treasure.

  **The Strongest Case Against This Recommendation**
  I must fairly state the counter-argument, which is substantial. Colleagues favouring rejection argue that acquisition legitimises the artist's methodology. By bringing this work into our collection, even critically, we signal that significant harm is an acceptable cost of 'great art.' There is a risk that our contextualisation will be ignored by future audiences, leaving only the artist's name and the institution's stamp of approval. Furthermore, some argue that the subject's current forgiveness cannot retroactively validate the coercion present at the time; by acquiring the work, we override the ethical standard we ought to uphold regardless of the victim's current stance. There is also the reputational risk: should the context be lost in future years, the university may be seen as harbouring exploitative material.

  **Conclusion**
  We cannot change the past, but we can control how we engage with it. A rejection protects our immediate conscience but risks censoring history and disregarding the subject's voice. A conditional acquisition allows us to hold the work to account. It recognises that while the art is important, the ethics of its production are part of the work's permanent label.

  Please consider this reasoning before our session. I look forward to a robust discussion.

  Yours sincerely,

  [Your Name]
  Chair, Acquisitions and Ethics Committee
