answer: |-
  Your hunch is correct, but it's only half the story. You are looking at three distinct projects wearing the same label, yes, but they are entangled by a specific formal bottleneck that makes the confusion inevitable rather than accidental.

  Here is the diagnosis: **The Logical Omniscience problem is not a single puzzle. It is a collision between a normative ideal, an engineering constraint, and a descriptive reality, all forced through a formalism (possible-worlds semantics) that is mathematically incapable of distinguishing between them without breaking.**

  The reason the debate looks stalled is that every "solution" is actually a **trade-off declaration**. When a researcher proposes a patch, they are implicitly voting for which of the three projects matters most. The "fight" persists because nobody wants to admit that the formalism cannot serve all three masters simultaneously.

  Here is the breakdown you need for your piece.

  ### 1. The Three Projects (The Category Error)

  You identified the camps, but the friction comes from their incompatible success criteria.

  *   **Project A: The Normative Logic (The Philosophers).**
      *   **Goal:** Define what it *means* to be rational.
      *   **Stance:** Omniscience is a feature. If you believe $p$, and $p$ entails $q$, you *ought* to believe $q$. If you don't, you are irrational, not the logic is wrong.
      *   **Success Criterion:** Elegance, closure, S5 axioms hold.
      *   **Why they fight:** They resent the "patches" because they dilute the definition of rationality. To them, "awareness logic" isn't a fix; it's a different subject.

  *   **Project B: The Engineering Model (The CS/Protocol People).**
      *   **Goal:** Verify security and consensus in distributed systems.
      *   **Stance:** Omniscience is a useful abstraction *if* "knowledge" means "information is available in the system state," not "the CPU has computed it."
      *   **Success Criterion:** Tractability, model checking, decidability.
      *   **Why they fight:** They need the math to compose. If you introduce "impossible worlds" or non-classical consequence, you often lose the ability to run automated verification. They don't care about human belief; they care about message passing.

  *   **Project C: The Descriptive Theory (The Cognitive/Epistemic Realists).**
      *   **Goal:** Model actual belief states of humans or resource-bounded agents.
      *   **Stance:** Omniscience is a bug. Agents are unaware of propositions, not just uncertain about them.
      *   **Success Criterion:** Psychological plausibility, handling unawareness.
      *   **Why they fight:** They need to represent *ignorance of existence*, not just *ignorance of truth*. Standard semantics can't do this.

  **The Diagnosis:** The debate looks like one dispute because everyone uses the operator $K$ (Knows). But in Project A, $K$ means "Ideally Committed To." In Project B, $K$ means "Information Locally Available." In Project C, $K$ means "Consciously Endorsed." When you demand one formalism satisfy all three definitions of $K$, you create a paradox.

  ### 2. The Hidden Formal Result (The Bottleneck)

  You asked if there's a formal result that settles this. There isn't a "Gödel's Theorem" of epistemic logic, but there is a result that validates your source's claim.

  It centers on **Hyperintensionality**.

  In standard possible-worlds semantics, a proposition is a *set of worlds*. If proposition $p$ and proposition $q$ are true in exactly the same set of worlds (i.e., they are logically equivalent), they are the *same proposition*. Therefore, no agent can know one without knowing the other. This is built into the set theory.

  To model an agent who knows $p$ but not $q$ (where $p \equiv q$), you must stop treating propositions as sets of worlds. You must treat them as **structures** (sentences, proofs, algorithms).

  The specific result you're looking for is likely related to the **Dekel-Lipman-Rustichini (DLR) Impossibility Theorem (1998)**. They proved that in a standard state-space model, you cannot represent **unawareness**.
  *   In a standard model, the state space includes all possible contingencies.
  *   If an agent is "unaware" of a contingency, that contingency cannot be in the state space.
  *   But if it's not in the state space, the model cannot represent the agent's decision problem regarding it.
  *   **Conclusion:** You cannot model "I don't know that I don't know $p$" in a standard partition model. You have to change the ontology (e.g., to syntactic awareness or impossible worlds).

  This is why the "patches" feel like diseases. To fix logical omniscience, you must break **compositionality**. If knowledge depends on the *syntax* of the proposition (how long the proof is) rather than the *semantics* (which worlds it's true in), you lose the elegant algebraic properties that make the logic useful for the Engineering camp (Project B).

  ### 3. The Muddy Children Anomaly

  You noted that the machinery works for Muddy Children and Coordinated Attack. This is the key to untangling the confusion.

  In those puzzles, "knowledge" is **Implicit Information**, not **Explicit Derivation**.
  *   **Muddy Children:** The children *have* the information required to deduce their mud status after the father speaks. The information is in the system. They don't need to "compute" new facts; they need to update their partition based on public announcements.
  *   **Logical Omniscience:** This complaint arises when we expect the agent to have *computed* the consequence.

  The formalism works for Muddy Children because it models **Information Flow**, not **Computational Effort**. The CS people (Project B) are happy with this. The Cognitive people (Project C) are not, because humans can have information available (in a book, or in their memory) without "knowing" it in the sense of being able to act on it immediately.

  **The Diagnosis:** The tool isn't broken; it's being used to measure two different things. It measures *information availability* perfectly. It measures *cognitive endorsement* terribly. The "stall" happens when people try to use an Information Flow tool to solve a Cognitive Endorsement problem.

  ### 4. What Counts as Progress?

  If you write that "scientists are stuck," you'll miss the nuance. They aren't stuck; they are **specializing**.

  Progress in this field does not look like a "Grand Unified Theory of Knowledge." That is likely incoherent. Progress looks like **differentiation**.

  1.  **Formal Differentiation:** The field is moving toward explicitly separating **Implicit Knowledge** (standard Kripke semantics, good for distributed systems) from **Explicit Knowledge** (Awareness Logic, Justification Logic, good for resource-bounded agents). When a paper specifies which $K$ it is using, the "fight" dissolves.
  2.  **The "Cost" Metric:** In computer science, progress is measuring the *computational cost* of knowledge. Instead of asking "Does the agent know $p$?", we ask "What is the complexity class of deriving $p$?" This bridges the Engineering and Cognitive camps without breaking the math.
  3.  **Philosophical Concession:** The most mature epistemologists now admit that S5 (the standard logic) is a logic of *ideal justification*, not *psychological state*. Acknowledging this distinction is itself progress.

  ### The Angle for Your Article

  Your hunch that "the camps don't share a criterion of success" is the lead.

  The story isn't that logicians failed to model human belief. The story is that **we discovered "Knowledge" is not a natural kind.** It is a cluster concept.
  *   Sometimes it means "Data is in the file" (CS).
  *   Sometimes it means "You would bet on this" (Decision Theory).
  *   Sometimes it means "You have a proof in hand" (Constructivism).

  The "Logical Omniscience Problem" is the friction generated when we try to force these distinct phenomena into a single set-theoretic box. The "stall" is actually a slow-motion realization that the box is too small.

  **What settles it?**
  Nothing settles it permanently, because the demand for a single formalism is the error. But the **Dekel-Lipman-Rustichini** result is the closest thing to a "stop sign." It formally proves that you cannot model unawareness in the standard framework. That forces the split.

  **Recommendation:**
  Frame the "fight" not as a failure of ingenuity, but as a **taxonomy in progress**. The researchers who seem most productive are the ones who have stopped trying to "fix" logical omniscience and started asking: *"Which kind of knowledge are we modeling, and what are we willing to sacrifice to get it?"*

  The ones still fighting are the ones still trying to sell one tool as a hammer, a screwdriver, and a microscope.
