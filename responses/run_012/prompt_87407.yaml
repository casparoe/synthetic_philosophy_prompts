prompt: |-
  I'm in a seminar on transitional justice and we have to pair a play with the theory, and I picked Ariel Dorfman's Death and the Maiden (the Polanski film is fine too if that's the version you know). The setup, in case it helps: Paulina was tortured and raped by a fallen military regime years ago; her husband Gerardo has just been named to a truth commission that will investigate that regime's crimes; and one night he brings home a stranger, Dr. Miranda, who helped him with a flat tire, and Paulina becomes convinced from his voice and manner that Miranda is the doctor who did it to her, back when he played Schubert during the sessions. She ties him up, holds a little trial in her living room, and eventually gets a confession out of him -- but we never know if it's true, and he might have confessed just to survive, or to please her, or because he really is guilty and wants to unburden himself. Gerardo, who believes in due process and the commission's mandate, is horrified that his wife has turned into the torturer.

  What I want is a reading of the play through one specific knot in the theory of amnesty and truth. The usual defense of a truth commission is that it trades punishment for truth and treats truth-telling as a kind of repair: the victim testifies, the perpetrator confesses, and the nation gets a record. But Paulina is exactly the victim that model is supposed to serve, and what she wants isn't the commission's truth, it's a confession she can believe, and she gets it by methods the commission itself would call torture. So does the play dramatize the commission's buried assumption that confession heals, and then show it failing? Is Miranda's coerced confession a repair or a repetition of the original violation? And where does the play come down on the right to truth versus the right to justice -- does it treat them as the same thing, or suggest the commission's trade is a bad deal the state makes on the victim's behalf without her consent? Be concrete about which scenes and which choices do the philosophical work, and say where the play resists the reading -- if it doesn't actually vindicate Paulina, or if the ambiguity about Miranda's guilt is doing something the theory can't handle.

  One more thing I keep going back and forth on: Gerardo. He's the one who believes in the commission, and he's also the one who failed to protect her, so the play makes the defender of transitional justice complicit in her abandonment. Is that a cheap shot at the institution, or does it track a real problem -- that the people who design these commissions are usually the ones who were safe? I'm not looking for a plot summary, tbh, I've seen it; I want the argument. Also tell me how confident you are in the reading you give, and flag the single point in it you're least sure about, since I might have to defend this in class.
