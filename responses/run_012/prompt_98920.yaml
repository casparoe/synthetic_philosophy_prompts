      *   *The Math:* $R \times P > C$. $R$ = Reward (benefit of preferred candidate), $P$ = Probability of being pivotal, $C$ = Cost. Since $P \approx 0$, $R \times P \approx 0$. Unless $C$ is negative (you enjoy it), rational agents shouldn't vote.
      *   *The Empirical Reality:* People vote in large numbers.
