answer: |-
  Here is the diagnosis, followed by the straight answer on how to move the needle.

  ### The Diagnosis: Your Friend is Right, But She's Only Half-Right

  Your friend has correctly identified the **formal engine** driving the stalemate, but she mistakes it for the whole car. She is right that the "irrational" camp is implicitly using **Causal Decision Theory (CDT)** while the "sensible" camp is relying on something closer to **Evidential Decision Theory (EDT)** or Rule Utilitarianism. But this isn't just a technical dispute about how to compute probability; it is a fundamental disagreement about the **ontology of the voter**.

  Here is the breakdown of why this specific fault line keeps the debate frozen:

  **1. The Causal vs. Evidential Split**
  *   **The CDT Camp (Instrumental):** They treat the voter as an **atomic isolate**. In this model, the votes of others are "fixed" parameters. My vote only matters if it physically breaks a tie. Since the probability of a tie is near-zero, the causal leverage is zero. To a CDT theorist, voting is literally like buying a lottery ticket with a negative expected return. Any other explanation requires "magical thinking" (believing my vote causes others to vote).
  *   **The EDT Camp (Expressive/Social):** They treat the voter as a **node in a network**. In this model, my vote is *evidence* of what my "type" (neighbors, class, party) will do. If I vote, it increases the statistical likelihood that my coalition votes. Therefore, my vote is correlated with victory, even if it isn't causally pivotal. To this camp, refusing to vote because "I'm not pivotal" is like refusing to wear a seatbelt because "my accident won't change the national statistics."

  **2. Why It's Stuck (The Incommensurability Problem)**
  The debate goes in circles because the two sides are using different definitions of **"Cause."**
  *   The CDT side demands **physical causation** (did *this* specific ballot change the winner?).
  *   The EDT/Expressive side accepts **logical correlation** (does *this* act align with the winning coalition?).

  Because they cannot agree on what counts as a "cause," they cannot agree on what counts as "rational." The CDT camp views the EDT argument as superstition (the "Logic of the Commons" fallacy). The EDT camp views the CDT argument as sociopathic hyper-individualism that ignores how human agency actually works (we act as members of groups, not atoms).

  **3. The "Fudge Factor" Trap**
  This is the sociological costume your friend mentioned. Because the CDT model fails to predict reality (people *do* vote), Rational Choice theorists save the model by adding a "$D$ term" (Duty, Expression, Identity) to the utility equation ($R \times P + D > C$).
  *   **The Problem:** This makes the theory **unfalsifiable**. If you vote, they say you have a high $D$. If you don't, you have a low $D$. It explains everything and nothing.
  *   **The Result:** The "Expressive" camp wins on intuition, but the "Instrumental" camp wins on formal rigor. They shake hands because the Instrumentalists concede people have "weird preferences" ($D$), and the Expressivists concede the math is "technically correct but irrelevant." Nothing moves because both sides have compromised enough to avoid being proven wrong.

  ### The Straight Answer: What Would Actually Move the Thing?

  The debate will not be solved by a new formula, a better calculation of pivotality, or a philosophical verdict on CDT vs. EDT. Those are dead ends. The field is stuck because it is asking a **Decision Theory question** about a **Cognitive Science phenomenon**.

  To move the piece forward, you need to advocate for a **Change of Question**.

  **1. Stop Asking "Is It Rational?"**
  The "Paradox of Voting" only exists if you assume humans are expected-utility maximizers running a CDT algorithm. They aren't. The breakthrough comes from accepting that voting is not a **choice** in the economic sense; it is a **heuristic output**.
  *   **The Shift:** Don't ask "Why do they calculate it's worth it?" Ask "Why don't they calculate at all?"
  *   **The Argument:** Most voters do not compute $P$ (pivotality). They operate on **System 1 thinking** (habit, identity, social pressure). The "Paradox" is a System 2 (analytical) problem imposed on a System 1 (instinctive) behavior. The debate is stuck because theorists are analyzing a ritual as if it were a transaction.

  **2. The Empirical Kill Shot: Cost Sensitivity**
  If you want to show where the ground is actually shifting, look at **cost sensitivity**.
  *   **Instrumental Theory Prediction:** If voting is about outcomes ($R \times P$), small costs (rain, distance to poll, ID laws) shouldn't matter much compared to the stakes of the election.
  *   **Expressive/Habit Theory Prediction:** If voting is about identity or habit, small costs *should* disrupt it significantly because the "utility" is low-intensity maintenance, not high-stakes investment.
  *   **The Data:** Small costs *do* drastically reduce turnout. This empirically falsifies the "High Stakes/Instrumental" model without needing to resolve the CDT/EDT war. It suggests voting is a **low-cost consumption good**, not an investment.

  **3. The Conceptual Distinction You Need**
  The distinction that cuts the knot is **Legitimacy vs. Outcome**.
  *   The Instrumentalists assume the goal of voting is to **select a winner**.
  *   The Sociologists argue the goal of voting is to **validate the system**.
  *   **The Move:** Argue that the "Paradox" dissolves if you view voting as a **tax paid for political legitimacy** rather than a **bet placed on a candidate**. If I vote, I am purchasing the right to complain, or signaling my membership in the polity. This is instrumentally rational for the *system*, and expressively rational for the *individual*, without requiring magical thinking about pivotality.

  ### Summary for Your Piece

  Your friend is right that the engine is CDT vs. EDT, but the reason the car won't start is that **voting isn't a vehicle for getting places; it's a uniform you wear.**

  The debate is stuck because one side is analyzing the aerodynamics of the uniform (Instrumental/CDT) and the other is analyzing the social signal of the fabric (Expressive/EDT).

  **To move the conversation:**
  1.  **Diagnose the stalemate** as a conflict between **Atomic Agency** (CDT) and **Embedded Agency** (EDT/Social).
  2.  **Declare the "Paradox" dead.** It relies on a model of human cognition (cold calculation of probability) that behavioral science has already disproven.
  3.  **Propose the new question:** Stop asking why individuals vote despite the odds. Start asking how social systems maintain the **common knowledge** that voting matters, even when the math says it doesn't. The puzzle isn't the voter; it's the equilibrium of belief that keeps the turnout high.

  The field moves when we stop trying to save Rational Choice Theory and start modeling voting as **identity maintenance** subject to **friction costs**. That is the argument that breaks the deadlock.
