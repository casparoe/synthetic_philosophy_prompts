      The field is stuck because the "Expressive" solution is a **Get Out of Jail Free card** for Rational Choice. It saves the theory by making it unfalsifiable. To move, we need to make the theory *risky*.
      *   *Idea:* Focus on **Cost Sensitivity**. If voting is expressive, small costs shouldn't matter much. If instrumental, they should. Evidence shows small costs (rain, distance) *do* matter. This suggests it's a mix.
      *   *Better Idea:* The "Paradox" is a pseudo-problem. It assumes the goal is winning. If the goal is *legitimacy*, voting is perfectly rational instrumentally (for the system, if not the individual).
