prompt: |-
  I am setting the final examination for an upper-level undergraduate metaphysics seminar. The exam is closed-book, and the last unit of the course is the problem of saying when some things compose a further thing, usually called the special composition question. By the end of term my students can recite the standard menu of answers — nihilism, universalism, and the assorted moderate proposals — without having any grasp of why the menu has only two stable entries. I want one essay question that makes them work that out rather than reproduce it, together with the answer standard I will mark against.

  Please build the question around the following candidate answer, which I have written for this exam and which should appear in the question in exactly the form given here:

  (CU) Some things compose a further thing just in case an intervention on some of those things — a change in them that is not produced by the others — would make a difference to the properties of the others.

  Students should be told only that CU is a moderate answer in the spirit of proposals that treat composition as a matter of causal or dynamical integration, and that the question is whether it survives. Nothing in the question should signal its fate.

  The question should have three parts: first, an account of why the pressure that makes moderate answers hard to sustain applies to any moderate answer and not merely to the well-known ones; second, an assessment of CU that identifies which horn of that pressure it lands on, if any, and what defects it has independently of that pressure; third, a verdict on what a defensible answer would have to look like, including whether the question itself should be rejected. It should be answerable in sixty minutes.

  Deliverables: the question as it will appear on the paper; a model answer of roughly 700 words; and a marking scheme consisting of five must-hit points worth 25 marks in total, each with its mark value, a one-line statement of what a top answer must contain, and a one-line note on how candidates typically get that point wrong; plus a short band descriptor distinguishing an A script from a B script. The scheme should be written so that a candidate who names the standard positions and their usual slogans cannot reach the middle band on that basis alone. No reading list or citations should be required of the students, and the model answer should not lean on any.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate metaphysics seminar, final exam, closed-book.
      *   **Topic:** Special Composition Question (SCQ).
      *   **Problem:** Students know the menu (Nihilism, Universalism, Moderatism) but don't understand *why* the menu effectively collapses to two stable options (the "Van Inwagen Dilemma" or "Sorites Pressure").
      *   **Task:** Create one essay question with three specific parts, a model answer (~700 words), and a marking scheme (5 points, 25 marks total, specific format).
      *   **Constraint 1:** The question must center around a specific candidate answer provided by the user (CU), which must appear *exactly* as written.
      *   **Constraint 2:** The question must not signal CU's fate (success or failure).
      *   **Constraint 3:** The question must have three parts: (1) General pressure on moderatism, (2) Assessment of CU against that pressure + independent defects, (3) Verdict on defensible answers/SCQ itself.
      *   **Constraint 4:** Time limit: 60 minutes.
      *   **Constraint 5:** Marking scheme must prevent rote memorization of standard positions from scoring well.
      *   **Constraint 6:** No reading list/citations required.

  2.  **Deconstruct the "Pressure" on Moderatism:**
      *   Why are moderate answers unstable? This is typically the *Sorites Series* argument or the *Vagueness* argument.
      *   If composition is restricted (not universal, not never), there must be a cutoff point where composition stops happening as we remove parts or change arrangements.
      *   *Horn 1:* There is a sharp cutoff. (Counterintuitive, arbitrary).
      *   *Horn 2:* There is no sharp cutoff (vagueness). But existence cannot be vague (Lewis/Sider argument).
      *   Therefore, moderatism seems untenable, leaving Nihilism (never) or Universalism (always) as the only "sharp" or "non-vague" options.
      *   *Task for Part 1:* Explain this dilemma generally, not just for specific theories like contact or fastening.

  3.  **Analyze the Candidate Answer (CU):**
      *   *(CU) Some things compose a further thing just in case an intervention on some of those things — a change in them that is not produced by the others — would make a difference to the properties of the others.*
      *   This is a causal counterfactual account of composition (similar to causal integration or homeostatic property cluster views).
      *   *Assessment:* Does it avoid the Sorites pressure?
      *   *Problem:* Causal connections come in degrees. At what threshold of causal influence does composition occur? If 51% influence? That's arbitrary (Horn 1). If it's vague, then existence is vague (Horn 2).
      *   *Independent Defects:* Preemption, overdetermination, or cases where causal integration exists without composition (e.g., a solar system, a traffic jam) or composition without tight causal integration (e.g., a scattered object held together by essence, though this is contentious). A strong independent defect is the "Solar System" problem: planets causally interact gravitationally, but do they compose an object? CU might say yes, which is counterintuitive. Or, a broken watch: parts don't causally interact properly, but the watch still exists as a composite.

  4.  **Drafting the Question:**
      *   Need to embed (CU) exactly.
      *   Need to frame the three parts clearly.
      *   Need to ensure it fits a 60-minute essay (roughly 600-800 words expected from students).
      *   *Draft:* "Consider the following proposal... (CU). Part 1: Explain the general dilemma facing moderate answers... Part 2: Assess CU... Part 3: Verdict..."

  5.  **Drafting the Model Answer:**
      *   *Word Count:* Target ~700 words.
      *   *Content:*
          *   Intro: SCQ context.
          *   Part 1: The Sorites/Vagueness dilemma. Restricted composition implies a boundary. Boundaries are either sharp (arbitrary) or vague (ontic vagueness is impossible). Hence Nihilism/Universalism are stable.
          *   Part 2: CU Analysis. CU relies on degree of causal influence. This invites the Sorites series (gradual reduction of causal link). So it lands on the same horns. Independent defect: Causal connection isn't sufficient (solar system) or necessary (frozen/dead composites).
          *   Part 3: Verdict. Either embrace Universalism/Nihilism, or accept ontic vagueness (rejecting the dilemma's premise), or adopt conventionalism (the question is pragmatic).
      *   *Tone:* Academic, precise, no citations.

  6.  **Developing the Marking Scheme:**
      *   5 Points, 25 Marks total (5 marks each).
      *   Must prevent rote learning. Points must require *application* and *argument*, not just definition.
      *   *Point 1:* Identification of the Sorites/Vagueness pressure (The "Why Moderatism Fails" argument).
      *   *Point 2:* Application of that pressure to *any* degree-based condition (not just contact/fastening).
      *   *Point 3:* Specific critique of CU regarding the Sorites (Causal strength is a matter of degree).
      *   *Point 4:* Independent critique of CU (Sufficiency/Necessity counterexamples).
      *   *Point 5:* Final Verdict (Meta-ontological shift or acceptance of extremes).
      *   *Band Descriptor:* Distinguish A (insightful, connects parts) vs B (competent but disjointed or rote).

  7.  **Refining and Polishing:**
      *   *Check Constraint:* Did I include (CU) exactly? Yes.
      *   *Check Constraint:* Is the fate of CU hidden in the prompt? Yes.
      *   *Check Constraint:* Is the marking scheme robust against rote memorization? Yes, by focusing on the *application* to CU and the *structure* of the argument rather than naming Van Inwagen or Lewis.
      *   *Check Word Count:* Model answer needs to be tight.
      *   *Check Marking Scheme Format:* "One-line statement," "One-line note on typical error."

      *(Self-Correction during drafting)*: Make sure the model answer doesn't rely on names like "Lewis" or "Van Inwagen" since the prompt says "No reading list or citations should be required." The arguments should be explained conceptually.
      *(Self-Correction on Marking Scheme)*: Ensure the "typical error" highlights the difference between knowing the labels and understanding the logic.

  8.  **Final Review against constraints:**
      *   Question parts 1, 2, 3 included? Yes.
      *   (CU) text exact? Yes.
