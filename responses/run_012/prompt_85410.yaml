answer: |-
  **EXAMINATION PAPER**

  **Course:** Metaphysics Seminar (Upper-Level)
  **Time Allowed:** 60 Minutes
  **Instructions:** Answer the following question. No external materials may be used.

  **Question 1**

  Consider the following candidate answer to the Special Composition Question:

  (CU) Some things compose a further thing just in case an intervention on some of those things — a change in them that is not produced by the others — would make a difference to the properties of the others.

  You are told that (CU) is a moderate answer in the spirit of proposals that treat composition as a matter of causal or dynamical integration. The question is whether it survives.

  Write an essay addressing the following three parts:

  1.  Explain the general theoretical pressure that makes moderate answers to the Special Composition Question difficult to sustain. Your explanation must show why this pressure applies to *any* moderate proposal, not merely the familiar examples discussed in class.
  2.  Assess (CU) in light of this pressure. Identify which horn of the dilemma it faces, if any. Additionally, identify at least one defect (CU) has independently of this general pressure.
  3.  Offer a verdict on what a defensible answer to the Special Composition Question would have to look like in light of your analysis, including whether the question itself should be rejected.

  ***

  **MODEL ANSWER**

  The Special Composition Question asks under what conditions some things compose a further thing. Extreme answers claim composition never occurs (Nihilism) or always occurs (Universalism). Moderate answers claim composition occurs only under specific conditions. The primary pressure against moderatism arises from the nature of boundaries and vagueness.

  If composition is restricted but not impossible, there must be a boundary between cases where composition occurs and cases where it does not. Consider a Sorites series of arrangements, gradually shifting from a tightly integrated whole to scattered dust. If composition is moderate, there is a point in this series where composition stops. This creates a dilemma. First, if there is a sharp cutoff, it seems arbitrary; why does composition happen here but not one micron further? Second, if there is no sharp cutoff, then existence is vague. However, many argue that reality cannot be vague; it is an indeterminate fact whether an object exists, which is metaphysically untenable. Because Nihilism and Universalism posit no such boundaries, they avoid this dilemma entirely. This pressure applies to *any* moderate view because any condition restricting composition (contact, fastening, or causal integration) admits of degrees, inevitably generating a Sorites series.

  (CU) attempts to restrict composition to cases of causal interdependence. However, causal influence is a matter of degree. Gravitational attraction weakens with distance; chemical bonds break under stress. If we gradually weaken the causal connections between parts, we generate a Sorites series. (CU) therefore lands on the same horns as other moderate views. It must either posit an arbitrary threshold of causal influence required for composition or accept that existence is vague when causal influence is indeterminate. Neither option is attractive. The first implies magic cutoffs in causal physics; the second implies ontic vagueness.

  Independently of the Sorites pressure, (CU) faces counterexamples regarding necessity and sufficiency. Regarding sufficiency, the solar system exhibits massive causal integration; an intervention on the sun affects the planets. Yet, it is counterintuitive to claim the solar system is a single composite object in the same sense as a table. Regarding necessity, consider a frozen clock. The gears are locked; an intervention on one gear makes no difference to the others because movement is impossible. Yet, the clock remains a composite object. (CU) falsely excludes static composites and falsely includes loosely integrated systems.

  Given these failures, a defensible ontology likely requires abandoning the search for a moderate factual answer. One option is to accept an extreme: Universalism avoids the boundary problem entirely, though it clashes with common sense. A more promising route is to reject the presupposition that the Special Composition Question has a mind-independent answer. If composition is not a fundamental metaphysical fact but a conceptual or pragmatic tool we impose on the world, the demand for a sharp boundary dissolves. We draw lines where it is useful, not where nature dictates. Thus, the defensible verdict is that the question is misguided if taken as asking for a discovery of objective joints in nature. The instability of moderatism suggests composition is either trivial (Universalism) or non-existent (Nihilism) at the fundamental level, or else the question is merely verbal.

  ***

  **MARKING SCHEME**

  **Total Marks:** 25
  **Pass Mark:** 10

  | Point | Marks | Top Answer Requirement | Typical Candidate Error |
  | :--- | :---: | :--- | :--- |
  | **1. The Dilemma** | 5 | Articulates the conflict between arbitrary sharp boundaries and the impossibility of vague existence. | Merely names "Sorites" without explaining why vagueness in existence is problematic. |
  | **2. Generalizability** | 5 | Explains that *any* condition admitting of degrees generates the dilemma, not just contact/fastening. | Treats the pressure as specific to known examples (e.g., "contact") rather than structural. |
  | **3. CU & Dilemma** | 5 | Identifies that causal influence comes in degrees, subjecting (CU) to the same Sorites pressure. | Claims (CU) escapes the dilemma because causation is "scientific" or "objective." |
  | **4. Independent Defect** | 5 | Provides a counterexample showing causal integration is not necessary (static objects) or sufficient (solar systems). | Offers counterexamples that rely on the Sorites pressure rather than independent necessity/sufficiency failures. |
  | **5. Meta-Ontological Verdict** | 5 | Concludes that the SCQ requires accepting extremes or rejecting the question as non-factual/conceptual. | Selects a side (e.g., Nihilism) without justifying how it resolves the structural pressure identified in Part 1. |

  **Band Descriptor**

  *   **A Range (20–25 marks):** The script integrates the three parts into a coherent argument. It demonstrates that the instability of (CU) is symptomatic of a deeper meta-ontological issue regarding vagueness and boundaries. The verdict in Part 3 follows logically from the failure identified in Parts 1 and 2.
  *   **B Range (14–19 marks):** The script competently identifies the Sorites pressure and applies it to (CU). However, the parts are treated as separate tasks rather than a unified argument, or the verdict in Part 3 relies on rote preference for an extreme view without meta-ontological justification.
