      *   **Prompt 5 (Unfalsifiability of Culture):** Is culture unfalsifiable because you can always posit deeper values?
          *   *Weber's View:* Weber was acutely aware of the infinite regress of values. However, he grounded his claims in historical documentation of *preaching, confessions, and conduct manuals*.
