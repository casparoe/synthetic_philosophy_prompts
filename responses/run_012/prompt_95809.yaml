answer: |-
  ### The Requirements

  First, the **Requirement of Non-Paralysis**. Consider the agent who loses everything because they take neither of two equal options. An adequate theory must declare this irrational. Indifference is a relation between options, not a suspension of agency. If the theory allows paralysis here, it permits agents to forfeit value without cause, rendering rationality self-defeating. The constraint is that indifference must permit selection, not forbid it. A theory failing this allows rational agents to starve between two identical bales of hay.

  Second, the **Requirement of Sanctioned Randomization**. When the agent flips a coin to settle the choice, the theory must validate this as rational. Randomization is not a failure of will but a method of resolving symmetry. If the theory demands a reason for choosing A over B specifically, it makes rational choice impossible in symmetric cases. The constraint is that arbitrary selection mechanisms are permissible when reasons run out. Failure here pathologizes a standard resolution strategy, forcing agents to invent fake reasons to act.

  Third, the **Requirement of Qualitative Preservation**. When options are equal in value but unlike in kind, the theory must not reduce them to a homogeneous metric. Indifference between money and leisure differs from indifference between two dollars. A theory that erases kind differences to establish equality fails to capture the agent's actual evaluative landscape. The constraint is that equivalence must not entail identity. Ignoring this collapses distinct values into a single currency, distorting the agent's worldview.

  Fourth, the **Requirement of Preference Stability**. Consider the agent who can take a pill to prefer A or B. The theory must specify whether altering preference to escape indifference is rational. If indifference is a value judgment, changing it is corruption; if it is a psychological state, changing it is optimization. The constraint is consistency between current evaluation and future manipulation. Failure here leaves the agent vulnerable to exploitation or self-undermining cycles of preference change.

  Fifth, the **Requirement of Representative Legitimacy**. When a tie-breaker chooses for others, creating winners and losers, the theory must justify the arbitrariness. Private indifference differs from public imposition. The constraint is that authority requires a warrant for breaking ties that affects non-consenting parties. A theory failing this permits arbitrary power without normative cover, treating others' stakes as identical to the agent's own.

  Sixth, the **Requirement of Epistemic Transparency**. The theory must distinguish settled indifference from unsettled ignorance. Choosing without looking differs from choosing after deliberation finds no difference. The constraint is that the history of deliberation matters to the rationality of the choice. Conflating these treats laziness as equivalent to rigorous verification, undermining the normative force of deliberation.

  Seventh, the **Requirement of Normative Grounding**. The theory must separate having no reason to prefer from having a reason to be indifferent. One is an absence of data; the other is a positive judgment of equality. The constraint is that the ground of indifference must be representable. Failure here collapses ignorance into equity, masking epistemic limits as axiological truths.

  ### Genuine or Borrowed

  The Requirements of Non-Paralysis and Epistemic Transparency are genuine desiderata. Without them, the theory fails to guide action or track truth, rendering it functionally useless for any agent seeking to navigate the world successfully. These are structural necessities for any account of rationality.

  Conversely, Preference Stability and Representative Legitimacy are often camp prejudices. Consequentialists view the preference pill as a tool for satisfaction; deontologists view it as corruption of judgment. Aggregativists allow tie-breaking for others; rights-based views forbid it. These demands reflect metaphysical commitments about the nature of value and authority rather than structural necessities of choice itself. They are ideological litmus tests disguised as rational constraints.

  ### The Collision

  The Requirements of Preference Stability and Sanctioned Randomization cannot be jointly satisfied without contradiction. This collision strikes at the heart of whether indifference is a state to act *from* or a state to act *against*.

  If Sanctioned Randomization is met, indifference is a stable verdict. Flipping a coin affirms that A and B are truly equivalent and that acting from this equivalence is rational. The indifference is a final destination of deliberation. However, if Preference Stability is met by allowing the agent to take the pill, indifference is treated as a defect. Taking the pill implies the state of indifference is suboptimal and should be engineered away to secure a determinate preference.

  A theory cannot claim indifference is a final verdict (supporting the coin) and simultaneously claim it is a limitation to be overcome (supporting the pill) without contradicting the status of the indifference itself. If you take the pill, you admit the indifference was not a true reflection of value but a psychological limitation. If you flip the coin, you affirm the indifference as a valid basis for action. Satisfying both requirements implies the agent is both right to be indifferent and wrong to remain so. Resolving this forces a choice between viewing indifference as a robust evaluative equilibrium or a fragile psychological contingency.

  ### The Most Exclusive Requirement

  The Requirement of Normative Grounding excludes the most candidate theories. Standard utility theory collapses the distinction between having no reason to prefer and having a reason to be indifferent. In most models, $U(A) = U(B)$ looks identical whether due to ignorance or equality.

  Requiring the theory to represent the *ground* of the equality demands a meta-ethical layer most theories omit. It excludes standard economic models, behavioral models, and most decision theories that rely on ordinal or cardinal utility alone. These frameworks track outcomes, not the justificatory structure behind the valuation. To satisfy this requirement, a theory must model the architecture of justification, not just the ranking of options, ruling out the vast majority of existing formal accounts.
