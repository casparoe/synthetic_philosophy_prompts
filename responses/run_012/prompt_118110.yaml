answer: |-
  # Seminar Specification: Desiderata for a Theory of Free-Floating Rationales

  **Context:** Graduate Seminar on Teleology in the Philosophy of Biology
  **Subject:** Specification of "Free-Floating Rationales" (FFR)
  **Reference Framework:** Dennettian Intentional Stance / Evolutionary Teleonomy

  ## I. Core Desiderata
  The following requirements constitute the specification for any theory claiming to account for free-floating rationales. Each requirement is motivated by specific biological cases and marked according to its theoretical status.

  | # | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Mind-Independence** | **Termite Mound / Cuckoo Chick:** The ventilation logic of the mound and the eviction behavior of the chick function *as if* designed, yet no architect or agent represents the goal. The rationale must exist without a holder. | **Non-Negotiable** (Definitional) |
  | **2** | **Rationale vs. Mere Cause** | **Termite Mound:** Airflow causes temperature regulation. However, mere physics (wind blowing a rock) does not constitute a rationale. The theory must distinguish causal efficacy from functional justification. | **Non-Negotiable** |
  | **3** | **Type/Token Sensitivity** | **Sphex Wasp:** The *type* (dragging cricket to nest) has a rationale (provisioning). The *token* (re-dragging after displacement) lacks a rationale (it is wasteful). The theory must attribute rationality to the program, not necessarily the specific instance. | **Non-Negotiable** |
  | **4** | **Mechanism Discrimination** | **Hoverfly vs. Killdeer:** The hoverfly's bands are selected over generations; the killdeer's display may involve real-time assessment. The theory must distinguish rationales underwritten by phylogenetic selection from those underwritten by ontogenetic learning or computation. | **Preference** (Etiological Camp) |
  | **5** | **Teleonomy vs. Aristotelian Teleology** | **All Cases:** The rationale must not imply an intrinsic final cause or a forward-looking pull (Aristotle). It must be explicable via backward-looking history or systemic organization (Teleonomy). | **Non-Negotiable** (Naturalist Constraint) |
  | **6** | **Robust Normativity** | **Sphex Wasp:** The wasp *ought* not to re-drag the cricket. A mere statistical regularity ("wasps usually drag") does not capture the error. The rationale must ground a judgment of correctness/failure, not just frequency. | **Contested** (The Crux) |
  | **7** | **Defeasibility / Obsolescence** | **Sphex Wasp:** A rationale can persist even when the environment changes such that the behavior is no longer beneficial. The theory must allow for "broken" rationales that still govern behavior. | **Non-Negotiable** |
  | **8** | **Non-Vacuity Constraint** | **Hoverfly:** The hoverfly benefits from looking like a wasp. However, not every benefit (e.g., the hoverfly's mass gravity aiding flight) is a rationale. The theory must prevent every causal side-effect from counting as a function. | **Non-Negotiable** |

  ## II. Required Distinctions
  To satisfy the desiderata above, the theory must rigorously maintain the following conceptual boundaries. Collapsing these distinctions constitutes a failure of the specification.

  1.  **Rationale vs. Mere Cause:** (See Desideratum #2). A causal explanation tells us *how* the termite mound stays cool; a rational explanation tells us *why* the structure is shaped that way relative to a goal (survival/thermoregulation).
  2.  **Rationale for the Type vs. the Token:** (See Desideratum #3). The Sphex case demonstrates that a token action can be irrational (re-dragging) while instantiating a type that is rational (provisioning). A theory that assigns rationality to the token fails to explain the error.
  3.  **Selection-Based vs. Learning/Computation:** (See Desideratum #4). The Hoverfly's mimicry is a "frozen" rationale encoded in genes; a predator avoiding it may be using a learned rationale. The theory must not conflate the evolutionary history of the trait with the cognitive processing of the interactant.
  4.  **Teleonomy vs. Aristotelian Teleology:** (See Desideratum #5). The theory must avoid positing future states as causal agents. The "goal" of the cuckoo chick is a heuristic description of the selection pressure, not a magnetic pull from the future.
  5.  **Robust Normativity vs. Statistical/Functional:** (See Desideratum #6). A statistical norm ("most hearts beat") differs from a normative norm ("this heart *should* beat"). The theory must explain the source of the "ought" without invoking a divine or mental lawgiver.

  ## III. Consistency Results
  The theory must remain consistent with the following established biological and philosophical facts:

  1.  **Selection is Non-Purposive:** The process generating the rationale (natural selection) has no mind, goal, or foresight. (Consistent with Desiderata #1, #5).
  2.  **FFRs can be Defeated or Obsolete:** As seen in the Sphex case, a rationale can remain attached to a trait even when the trait ceases to achieve the end (e.g., if the nest is destroyed repeatedly). (Consistent with Desideratum #7).
  3.  **Not Every Beneficial Regularity Earns a Rationale:** To avoid vacuity (Desideratum #8), the theory must exclude "free benefits" (spandrels). For example, the blood's redness may camouflage in certain dark environments, but this does not constitute a rationale for the blood's color.

  ## IV. Incompatibility Flag: The Normativity/Subject Tension
  **Flagged Subset:** **[Desideratum #1: Mind-Independence]** + **[Desideratum #6: Robust Normativity]**

  **Analysis:**
  There is a prima facie contradiction between demanding that a rationale be *normative* (implying a standard of correctness that can be violated, as in the Sphex case) and demanding that no *subject* exists for whom this standard is a reason.
  *   **The Tension:** Normativity traditionally requires a perspective—a judge or a user for whom the tool can fail. If there is no mind (Desideratum #1), who is the norm for? If the norm is merely "system failure" (the wasp dies), this collapses into **Mere Cause** (Desideratum #2) or **Statistics** (Desideratum #6).
  *   **Severity:** This is the **Central Problem** of the seminar. It is not necessarily fatal, but it is the fault line where theories fracture.
      *   *Deflationary accounts* (e.g., Cummins) save Mind-Independence by weakening Normativity to mere causal role analysis.
      *   *Realist accounts* (e.g., Millikan) save Normativity by positing "proper functions" derived from history, but struggle to explain the "ought" without a beneficiary.
      *   *Interpretivist accounts* (e.g., Dennett) argue the normativity is imposed by the *observer* (us), not the system, which risks making the rationale mind-dependent after all.

  **Verdict:** This tension is the primary object of investigation. A successful theory must either dissolve the distinction (arguing normativity is an illusion) or bridge it (arguing for naturalized normativity).

  ## V. The Exclusionary Requirement
  **The Single Requirement:** **Desideratum #6 (Robust Normativity).**

  **Justification:**
  This requirement excludes the most otherwise attractive positions.
  1.  **Excludes Simple Adaptationism:** Many evolutionary explanations are purely descriptive ("Trait X exists because it caused survival"). They fail to account for the *normative* force that labels the Sphex's re-dragging as a *mistake* rather than just a different causal path.
  2.  **Excludes Systemic Functionalism (Cummins):** Accounts that define function purely by current causal contribution cannot distinguish between a malfunctioning heart and a heart doing something else useful (e.g., making sound). They lack the resources for "error."
  3.  **Excludes Hard Intentionalism:** Accounts that require actual mental representation satisfy Normativity but fail Mind-Independence (#1).

  By insisting on **Robust Normativity** without a subject, we rule out all purely descriptive causal accounts and all mentalist accounts, leaving only the most sophisticated naturalistic teleologies (e.g., Etiological theories like Millikan's or Organizational theories like Mossio's) as viable contenders. This makes it the most effective filter for the seminar's comparative work.
