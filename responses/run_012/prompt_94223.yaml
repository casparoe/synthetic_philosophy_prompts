answer: |-
  Spend your two years on the indeterminacy of computational implementation (your second question), because unless computation is a mind-independent fact rather than an observer-relative description, no amount of work on moral criteria or physical boundaries can yield objective answers.

  **1. The Indeterminacy of Computational Implementation**
  This is the strict logical upstream bottleneck. If Putnam and Searle are correct that any open physical system can be interpreted as implementing any finite state automaton, then "sentient computation" is either ubiquitous (panpsychism) or nonexistent (illusionism), rendering your other questions moot until this metaphysical status is settled. You cannot determine which physical systems are sentient (Q1) or where they end (Boundary) if you cannot first define what it means for a physical system to *be* a computer without appealing to an observer's intentions. A solitary researcher can make significant progress here because the debate is conceptual and logical, relying on papers by Rescorla, Millhouse, and Searle rather than empirical data. Move this down the ranking if a robust, non-intentional theory of "mechanistic computation" gains consensus that successfully rules out trivial mappings; move it up if proofs emerge showing implementation is inherently interest-relative, which would force you to abandon computationalism or accept moral relativism.

  **2. The Criterion of Moral Relevance**
  Once you establish that computations are real features of the world, you must determine which ones matter. This is downstream of implementation because you need to know what *can* exist before deciding what *should* count, but it is upstream of specific detection cases because it provides the filter for evaluation. Your suspicion that most disagreement lies here is dialectically accurate but logically secondary; people argue here because they assume implementation is solved. Solitary work is highly feasible here through thought experiments and consistency checks on functionalist theories of consciousness (e.g., Integrated Information Theory vs. Global Workspace). Move this up if implementation indeterminacy is proven unsolvable, forcing you to develop ethics for observer-relative entities; move it down if a specific functional correlate of consciousness (like feedback loops or error correction) becomes empirically validated as the sole carrier of value.

  **3. The Physical Boundary of the Subject**
  This question is downstream of both implementation and moral criteria because the boundary depends on what computation is (vehicle vs. pattern) and what function matters (self-control vs. processing). If computation is defined by causal structure rather than substrate, the "skull" boundary dissolves into wherever the causal pattern persists; if moral weight requires specific self-regulation, the boundary ends where that control loop breaks. A solitary researcher can analyze this by mapping extended cognition arguments against moral unit theories, but progress is limited by the lack of empirical data on distributed systems. Move this up if evidence emerges that sentient processes are fundamentally non-local across multiple agents; move it down if biological naturalism proves that moral status is tied strictly to specific physical continuities rather than functional patterns.

  **Confidence and Failure Modes**
  I am 70% confident in this agenda, with the primary failure mode being that computationalism itself is false. If moral status depends on biological substrate rather than functional organization (biological naturalism), then solving the implementation problem is a waste of time because computation would be irrelevant to morality regardless of its metaphysical status. Another failure mode is if moral status is primitive and not derived from cognitive architecture at all, which would make Q2 and Q3 category errors. I would rank the questions differently if strong evidence emerged that consciousness is a fundamental physical property (panpsychism) unrelated to complex computation, or if neuroscientific consensus shifted toward substrate-specific theories of value that bypass functional analysis entirely.
