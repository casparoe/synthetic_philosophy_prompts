answer: |-
  It's completely normal to feel like this is just bookkeeping. When the beetle freezes either way, the fitness payoff is identical, so why fuss over whether we label the content "wasp" or "vibration"? The reason this keeps philosophers up at night isn't about the beetle's survival; it's about whether we can naturalize *normativity*. Teleosemantics aims to explain how a physical state can be *wrong*. If we can't pin down determinate content, we can't pin down error conditions, and if we can't pin down error, we haven't explained meaning—we've just described causal chains.

  Here is why the stakes are higher than they look, how the main theories handle your beetle, and whether the ambiguity is in the world or your description.

  ### 1. Why the Problem is a Problem
  You asked what turns on whether N represents *wasp* versus *sand-shaking*. The answer lies in the lab case. You shake the sand with a speaker. There is no wasp, no slump, just vibration. The beetle freezes.

  If N's content is *sand-shaking*, the representation is **true**. The system is working perfectly; the sand shook, N fired, beetle froze. There is no error here.
  If N's content is *wasp*, the representation is **false**. The system is malfunctioning or being fooled. The beetle is acting on a falsehood.

  Teleosemantics is supposed to be a theory of how physical systems get into the business of truth and falsity. If the theory forces us to say the content is *sand-shaking* (because that's the proximal cause), then the system *never* misrepresents a wasp. It only ever represents vibration. But then we haven't explained the beetle's *aboutness*—its grip on the world beyond its own skin. If the content is *wasp*, we preserve aboutness, but we need to explain why the vibration triggers it without making the content *vibration*. If the theory leaves this indeterminate, it fails to naturalize the normativity of content. We can't say the beetle is *mistaken* in the lab; we can only say it's causally triggered. Without a fact of the matter on content, there is no fact of the matter on error.

  ### 2. How the Theories Handle the Beetle
  Let's define our terms. **Indicator theories** say content is whatever reliably covaries with the state. **Consumer (Teleofunctional) theories** say content is determined by what the downstream systems (consumers) were selected to do with the signal. **Asymmetric Dependence** says content is the cause that sustains the connection even when other causes are absent.

  **The Indicator Approach:**
  This view says N means whatever causes it. In the wild, N covaries with wasps, slumps, and vibrations equally well.
  *   *The Bullet:* It struggles with the **disjunction problem**. Does N mean *wasp*, *slump*, or *wasp-or-slump*? Since all three correlate perfectly with N in the natural environment, the indicator theory often collapses into the disjunction (*wasp-or-slump*) or the proximal stimulus (*vibration*). If it collapses to *vibration*, you lose distal content (no aboutness). If it collapses to *wasp-or-slump*, you lose specificity.
  *   *Lab Case:* If N means *vibration*, the lab case is accurate. If N means *wasp*, the theory struggles to explain why the vibration triggers N without making vibration the content.

  **The Consumer (Teleofunctional) Approach:**
  Here, content depends on the **selected effect function** of the consumer system (the freezing mechanism). What was the freezer selected to do? It was selected to protect against predators *and* cave-ins.
  *   *The Bullet:* This view often forces the content to be *danger* or *wasp-or-slump*, because the consumer's function is satisfied by either.
  *   *Related Species:* This is where Consumer theory shines. In the related species, the detector is identical, but the consumer now triggers *digging*. Since the digging mechanism was selected to escape slumps (say), the content of N might shift to *slump* specifically. Content moves with the consumer, not the detector.
  *   *Swampman:* This is the hardest bullet. A molecule-for-molecule duplicate with no history has no selected functions. Therefore, on this view, Swampman's N represents **nothing**. It has no content. Critics say this is absurd (he behaves identically); proponents say content is essentially historical, so no history, no meaning.

  **Asymmetric Dependence:**
  This view tries to split the causes. N means *wasp* if the wasp-N connection holds even when the slump-N connection is broken, but not vice versa.
  *   *The Bullet:* In your case, both wasp and slump cause N *via* vibration. The vibration is a common cause. It is very hard to establish asymmetry here without stipulating laws of nature that don't exist. If the vibration is the necessary intermediary, the theory might default to *vibration* as the content, again losing distal aboutness.

  ### 3. Is the Ambiguity Real or Epistemic?
  You suspect the indeterminacy is just you under-describing the history. You're asking: is there a fact of the matter we just can't see, or is there no fact at all?

  On teleosemantics, content *is* history. If the evolutionary history shows that wasps were the original selector and slumps are a later, free-riding benefit, then there is a fact: N means *wasp*. If the history shows both contributed equally to fitness over the lineage's existence, then the theory implies there is **no fact of the matter** between *wasp*, *slump*, or *disjunction*.

  This is where your "bookkeeping" intuition clashes with the metaphysics. If the theory is right, content isn't a hidden inner label; it's a relational property grounded in selection. If the selection pressure was genuinely disjunctive (save from wasp OR slump), then the content is genuinely disjunctive. It's not that we are ignorant; it's that nature didn't distinguish them.

  However, if you feel there *must* be a distinction (e.g., "Surely it's about the wasp!"), you are likely relying on an intuition that content should track *informational specificity* or *current utility* rather than historical selection. Teleosemantics asks you to drop that intuition. If the history doesn't distinguish, the content doesn't distinguish. The ambiguity is ontological, not epistemic. The cost of buying into teleosemantics is accepting that in cases of symmetric selection history, content is literally indeterminate.

  ### Conclusion
  The indeterminacy problem matters because it tests whether teleosemantics can deliver on its promise: to explain how physical states become truth-apt. If the theory cannot distinguish between *vibration* and *wasp* without arbitrary stipulation, it cannot distinguish between accurate representation and causal triggering. Your beetle case shows that unless we have a principled way to privilege distal objects (wasps) over proximal causes (vibrations) or disjunctive conditions (wasp-or-slump), we haven't explained meaning, we've just mapped causal pathways. The Swampman case further tests whether you think content is intrinsic to the structure or extrinsic to the history.

  \answer{The core problem is that without a principled way to privilege distal objects over proximal causes, teleosemantics cannot distinguish between accurate representation and mere causal triggering, failing to naturalize normativity.}
