prompt: |-
  I'm a 3rd year PhD student (cog sci / phil, my project is on content and function) and I got stuck presenting at our reading group on teleosemantics, specifically the part where you're supposed to explain why it's hard to say *what* a representation represents once you build content out of selection history. I get the basic picture — a state means what it was selected to covary with, or what the systems downstream of it were selected to treat it as a sign of — but once the conversation turns to indeterminacy and distality I lose the thread, and I can't explain to a skeptic why any of it matters. Its supposed to be a deep problem and I can only see it as a bookkeeping annoyance, so I'm probly missing something.

  To get a grip I made up a toy case, and I'd like you to use it as the running example throughout. Fictional beetle, call it the sand-crawler. It has a single interneuron, call it N, that fires when the sand around it vibrates in a certain frequency band, and N firing makes the beetle freeze and tuck its legs in. In its actual environment that vibration band has two sources: a predatory wasp walking on the surface nearby, and the sand roof of the beetle's own tunnel starting to slump. Freezing is a good response to both. As far as anyone can tell, the lineage was selected for freezing on that vibration, and the vibration is the only thing N tracks. So: does N represent wasp, slump, wasp-or-slump, or just sand-shaking? Then two wrinkles. First, in a closely related species the same kind of detector got rewired to a different downstream system (it now triggers digging upward rather than freezing) — did the content move with the consumer, or stay with the detector? Second, the swamp version: a molecule-for-molecule duplicate of a sand-crawler happens to self-assemble in a sandstorm with no selection history at all. Does its N represent anything, and if your preferred theory says no, is that a bug? Third, I can shake the sand with a speaker in the lab and the beetle freezes with no wasp and no slump anywhere — misrepresentation, or is N just not in the representation business there?

  What I want from you is an explanation of the indeterminacy/distality problem, written for a smart reader who knows the basics of naturalistic theories of content but hasn't thought about this literature. I need three things. (1) Why the problem is a problem: what actually turns on whether N's content is wasp versus wasp-or-slump, given that the beetle does the identical thing either way, and what breaks downstream if content is indeterminate. (2) How the main families of response handle my beetle — roughly the indicator/covariation approach, the consumer or teleofunctional approach, and the asymmetric-dependence style approach — and where each one gets stuck or has to bite a bullet. (3) Whether the ambiguity is really in the beetle or just an artifact of me under-describing its history. I suspect there's a clean distinction between the content being indeterminate and my evidence about the content being indeterminate, and I want that drawn out, since I think that's where my intuition that "nothing turns on it" is coming from.

  A few constraints. Don't give me a bibliography or "see chapter 3 of X" style pointers — I'm on a train with no signal and can't look anything up, so just make the arguments. Don't just tell me the literature is split; I want the actual moves. Any term of art you use (function, indicator, consumer, normal condition, selection for) — say which sense you mean, because I'm fairly sure half my confusion is equivocation on "function." Around 900-1200 words, casual is fine. And finish with a single line of the form \answer{...} where the braces hold one sentence stating the core of the problem in a way I could put on a slide.
