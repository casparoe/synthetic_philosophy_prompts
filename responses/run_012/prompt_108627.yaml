answer: |-
  The die sat on the table between them, a clear acrylic sphere filled with tiny magnetic balls. Iris kept her hand over it. Ray had already filled in his postcard.

  "You're writing a number," Iris said. "Not a wish."

  "It's a number," Ray said. He capped his pen. "Seventy-four thousand."

  "Seventy-four thousand entries. For a stamp."

  "For a probability," Ray corrected. "Look at the rules. The prize pool is fixed. The share per entry shrinks as the total grows. But my chance of winning grows as my share grows. If everyone else in town claims a total of $T$, my expected return is maximized when I claim $T$."

  Iris tapped the acrylic sphere. "And if everyone claims $T$?"

  "Then $T$ becomes infinity, the prize per entry becomes zero, and we all go home with nothing. But everyone isn't me. Everyone isn't going to do that."

  "So you're banking on being the only person who understands the rules?"

  "I'm banking on being the only person who follows them to the end." Ray leaned forward. "Iris, if the town holds back, claiming a small number gets you a tiny slice of a big pie. If the town piles in, claiming a small number gets you a tiny slice of a crumb. My number doesn't move their number. Their number is already written. I'm just adjusting my slice to the size of the room."

  "It's not a room, Ray. It's a mirror." Iris lifted the die. "If this logic works for you, it works for the pharmacist. It works for the mayor. It works for me. If everyone follows your rule, there is no number everyone can claim. You're describing a race where the prize gets smaller the faster everybody runs."

  "It's not a race if I'm the only one running."

  "Then it's a superstition. You're treating your neighbors like scenery. You're saying, 'What if everybody did that?' is a magic spell that breaks the math. It doesn't break the math. It just proves the math forbids everyone from winning."

  Ray rubbed his temples. "The math forbids everyone from winning big. That's the game. But standing at the starting line guarantees I lose. If I claim one entry, and the town claims a million, my odds are one in a million. The prize is a dollar. I win a dollar. If I claim a million entries, my odds are fifty percent. The prize is fifty cents. I win twenty-five cents. Wait—" He stopped, recalculating. "If I match the field, I double the total. Prize per entry halves. My share becomes half. I win half the pot. Always. Regardless of what they do. If I match the field, I guarantee myself half the million dollars."

  "Half of a shrinking pool," Iris said. "But you can't guarantee half the pool unless everyone else agrees to let you have half. If the pharmacist also claims the total of the rest, including you, then you're both claiming more than exists. The numbers contradict. You're both trying to be the denominator."

  "Then the pharmacist is wrong. Not me."

  "That's what the murderer says about the corpse."

  Ray sighed, picking up his coffee. "You think I don't know this collapses if everyone plays? I know. But I'm not everyone. I'm one guy in a kitchen. I have to play the hand I'm dealt, not the hand I wish the table was playing."

  "A science magazine ran this," Iris said. "Eighties. Same rules. They asked readers to mail in numbers. Said it was a puzzle about rationality."

  "I heard about that."

  "Do you know what happened?" Iris asked. "People mailed in googolplexes. Numbers with more digits than atoms in the universe. The editor had to cancel the prize. The total entries were so high the share per entry was less than a fraction of a cent. It cost more in postage to send the checks than the checks were worth."

  "Because people were idiots," Ray said. "They thought bigger number meant bigger win. They didn't do the calculus. They just got greedy."

  "They did the calculus," Iris said. "They did your calculus. They looked at the field and said, 'I'll match them.' Then the field grew, so they matched again. It's a feedback loop. You're not solving the puzzle, Ray. You're building the bomb."

  "Okay." Ray put the cup down. "Okay, suppose you're right. Suppose everyone thinks like me. The prize vanishes. We all lose. I concede that. If universalized, my rule destroys the game."

  "And?"

  "And yet, if I adopt your rule, and everyone else adopts mine, I lose for sure. You're rolling a die to decide whether to play. Your expected contribution is one entry per twenty thousand people. If everyone does that, the total is one entry. Prize is a million. You get a fifty-dollar expected value. That's the cooperative optimum. I see it."

  "It's the only stable solution," Iris said.

  "But," Ray said, holding up a finger. "If I play your way, and one person—just one—plays my way, that person takes the whole pot. They claim the total of the rest. Since the rest are barely playing, they claim a small number, but it's still enough to dominate the draw. They win the million. I win nothing. I lose the stamp."

  "So you're defecting."

  "I'm insuring against defection."

  "You're defecting to insure against defection. Which causes the defection you feared." Iris pushed the die toward him. "Roll it."

  "I'm not rolling a twenty-thousand-sided die, Iris."

  "Then admit it. You're not playing the game on the card. You're playing a different game. The game on the card asks for a number. You're asking for a loophole."

  Ray looked at the postcard. He looked at Iris. "If I write one, and the town writes a million, I've wasted my life for fifty cents. If I write seventy-four thousand, and the town writes a million, I've wasted my life for twenty-five cents. But if I write seventy-four thousand and the town writes one... I buy a house."

  "And if everyone writes seventy-four thousand," Iris said softly. "We all burn."

  "I know." Ray picked up his pen again. He didn't change the number. "But I'm not everyone. I'm here. And I'm not going to be the sucker who holds the bag while someone else takes the ride."

  "And I'm not going to be the person who lights the fire just to see if I can keep warm." Iris lifted the die. "I'm rolling."

  "You know the odds."

  "I know the rules."

  She shook the sphere. The magnetic balls churned like a storm. Ray watched her, then looked down at his postcard. He didn't cover his number. He didn't uncapped his pen to change it. They sat in the silence of the kitchen, the hum of the refrigerator the only sound, waiting for the die to stop.
