answer: |-
  This is a classic problem in philosophy known as **the problem of aesthetic testimony**. You are effectively wrestling with the "Acquaintance Principle" (the idea that aesthetic judgments require first-hand experience) without wanting to surrender the practical utility of trusting friends and experts.

  Your intuition is sharper than you give it credit for. You aren't just being "precious"; you are detecting a shift in *what kind of claim* is being made in each scenario.

  Here is a principle that organizes your verdicts, identifies the one inconsistency you're harboring, and handles the new cases.

  ### The Principle: Recommendation vs. Resonance

  You can accept testimony for **Recommendations** (prudential judgments about how to spend time/money) and **Technical Facts** (objective features of the work), but you cannot accept testimony for **Resonance** (judgments about the intrinsic experiential quality of the work).

  *   **Recommendation:** "This is worth your time/money." (Outsourceable)
  *   **Technical Fact:** "This has property X." (Outsourceable)
  *   **Resonance:** "This *is* beautiful/sad/funny." (Non-outsourceable)

  The core philosophical reason is that **Resonance judgments are constituted by the experience itself.** To say a painting is beautiful is not just to predict that people will like it; it is to claim a relationship between the object and a viewer. If you are not the viewer, the claim is empty for you.

  ---

  ### Mapping Your Cases

  Here is how your gut verdicts line up with this principle, and where the friction lies.

  #### 1. The Clear "Recommendation" Cases (Testimony OK)
  *   **Restaurant:** When you say "It's a good restaurant," you are making a prudential claim: *The resources (money/time) exchanged will yield a satisfactory return.* This is predictive. You are outsourcing the risk assessment, not the sensory experience.
  *   **Film:** Similar to the restaurant. "It's a great film" usually functions as "It is worth two hours of your life."
  *   **Novel Plot:** "The narrator was lying." This is a **Technical Fact**. It is a proposition about the content, not the aesthetic quality. It is truth-apt in a standard way.

  #### 2. The Clear "Resonance" Cases (Testimony NOT OK)
  *   **Painting:** "It is beautiful." This is pure Resonance. Beauty is not a physical property like weight; it is an experiential property. To believe it without seeing it is to believe a report about an experience you haven't had. You correctly identified that you can only believe the sociological fact ("People find it beautiful").
  *   **Music:** "It is devastating." You noted the gap: you believe it *will* devastate people, but you don't feel you *know* the sadness. This is correct. The sadness of the music isn't a fact stored in the MP3; it is an event that happens in the listening.
  *   **Poetry:** Your flip-flop here is the crux of the issue. Your gut says: *Prediction* ("I'll love it") is fine, *Judgment* ("It is good") is not. This is the correct distinction. "It is good" implies an intrinsic merit that you cannot access without the resonance.

  #### 3. The "Technical" Case (Testimony OK)
  *   **Dance:** "Phrasing and balance were superb." You accepted this because it sounds technical. You rejected the "you should have loved it" implication because that is a Resonance claim. This is a very sophisticated distinction.

  #### 4. The Outlier: The Wine Case (Inconsistency Alert)
  *   **Sommelier:** "Barolo is better than Chianti."
  *   **Verdict:** You said "No problem." **This contradicts your Painting intuition.**
  *   **Why:** Wine is much closer to Painting than to Restaurants. A restaurant provides a service (food, comfort); wine provides an aesthetic experience. If you cannot believe a painting is beautiful without seeing it, you cannot believe a wine is *better* without tasting it.
  *   **The Fix:** You are likely treating the wine claim as a **Technical Fact** (i.e., "The Barolo has more complexity/structure") or a **Recommendation** ("This is the safer buy"). If the sommelier means "This will taste better to you," your gut *should* be as hesitant as it is with the painting. If you trust the wine verdict, you are treating taste as objective quality (like engineering) rather than aesthetic resonance. To be consistent with your Painting verdict, you should treat the wine claim as "The sommelier rates this higher," not "This *is* better."

  #### 5. The Consensus Case
  *   **Composer Genius:** If you say "He's a genius," are you shorthanding?
  *   **Verdict:** Yes. According to the principle, you cannot hold the Resonance belief ("His music is intrinsically genius") without hearing it. You can only hold the Sociological belief ("He is canonized as a genius"). If you claim the former, you are parroting; if you claim the latter, you are historically accurate.

  ---

  ### The New Case: The Joke

  **Case:** A friend tells me a joke is funny and I haven't heard it.
  **Verdict:** **Testimony Fails.**
  **Reasoning:** A joke is the purest form of **Resonance**. The "funniness" is not a property of the text; it is the event of amusement.
  *   If you say "That joke is funny" without hearing it, you are making a category error.
  *   You can say "That joke *lands* for you" (Prediction/Technical).
  *   You can say "That joke is famous" (Fact).
  *   But you cannot say "That joke is funny" in the same way you can say "That restaurant is good." A restaurant can be good even if you aren't hungry; a joke cannot be funny if no one is amused.

  ---

  ### Precise Definitions of the "Kinds" of Judgement

  To answer your final request, here are the three precise clauses of the principle, and which of your cases motivates them.

  #### Clause 1: The Prudential Judgment (Outsourceable)
  *   **Definition:** A claim about the **utility or value-for-cost** of an engagement. It predicts a net positive outcome for the agent (pleasure, nourishment, status) relative to the investment (time, money).
  *   **Motivating Cases:** Restaurant, Film.
  *   **Why it works:** These are bets on your future satisfaction. Testimony provides data for the bet.
  *   **The Limit:** If the "utility" is purely aesthetic (e.g., a poem), this clause weakens.

  #### Clause 2: The Technical/Objective Judgment (Outsourceable)
  *   **Definition:** A claim about the **structural, historical, or mechanical properties** of the work, independent of the viewer's emotional response.
  *   **Motivating Cases:** Dance (phrasing/balance), Novel (plot twist), Wine (if interpreted as chemical structure/region prestige).
  *   **Why it works:** These are facts about the object, not the experience of the object. Experts have access to data you don't.

  #### Clause 3: The Constitutive Aesthetic Judgment (Non-Outsourceable)
  *   **Definition:** A claim that ascribes an **intrinsic aesthetic quality** (beauty, sadness, funniness, goodness) that is **constituted by the subjective experience** of that quality.
  *   **Motivating Cases:** Painting (beauty), Music (devastation), Poetry (goodness), Joke (funniness).
  *   **Why it fails:** The quality *is* the experience. To assert the quality without the experience is to assert a relation without one of the relata. You are claiming "X is beautiful" when "beautiful" means "X produces response Y in a viewer," and you are not the viewer.

  ### Summary of What to Give Up

  To make your worldview hang together, you have one main adjustment:

  **You must downgrade your confidence in the Wine Case.**
  If you stand by your intuition on the Painting (that you can't call it beautiful without seeing it), you must admit the Sommelier cannot tell you the Barolo is *better* (aesthetic quality), only that it is *more prestigious* (social fact) or *more complex* (technical fact).

  If you keep the Wine verdict as is, you have to admit you are treating Food/Wine/Film as **Consumer Goods** (where testimony is fine) and Painting/Poetry/Music as **Art** (where testimony fails). That is a valid cultural distinction, but it means your principle isn't about "Aesthetics" generally; it's about "High Art vs. Lifestyle."

  **My advice:** Stick with the **Recommendation vs. Resonance** split. It protects your integrity as an experiencer (you don't claim to feel what you haven't felt) while allowing you to navigate the world practically (you trust friends on where to eat). It just means admitting that when a sommelier says a wine is "better," they are giving you a recommendation, not a truth.
