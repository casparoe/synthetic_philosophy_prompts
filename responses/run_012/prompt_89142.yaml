answer: |-
  There is no single, canonical term that captures exactly this combination of linguistic drift and evolutionary selection pressure, but your description maps precisely onto a convergence of concepts from political theory, linguistics, and memetics.

  The closest specific term in political theory is the **Empty Signifier**.
  The closest term in political science is **Concept Stretching**.
  The mechanism in cultural evolution is **Selection for Transmission Efficiency (or Low-Cost Signaling)**.

  Here is the breakdown of the name, the mechanism, and how it differs from ordinary drift.

  ### 1. The Political Theory Term: "Empty Signifier"
  Coined by Ernesto Laclau (and developed in discourse theory), an **Empty Signifier** is a word or slogan that retains its grammatical form but is "emptied" of specific content to allow diverse groups to unite under it.

  *   **The Mechanism:** To build a hegemonic coalition (a "big tent"), a movement needs a symbol that everyone can agree on. Specific policy demands (e.g., "Raise the minimum wage to $15") exclude people who disagree with the number. Abstract values (e.g., "Justice" or "Freedom") include everyone.
  *   **The Selection Pressure:** The "fittest" slogan is the one that can accommodate the most allies without triggering defection. Therefore, there is an active pressure to drain the specific, arguable content out of the term until it becomes a vessel for general goodwill.
  *   **Why it fits your description:** You noted that people using the old narrow sense are treated as pedants. In Laclau's framework, insisting on the specific definition is seen as breaking the coalition. The "empty" version wins because it serves the function of *unity* better than the "full" version serves the function of *precision*.

  ### 2. The Political Science Term: "Concept Stretching"
  Giovanni Sartori described this as **Concept Stretching** (or the **Ladder of Abstraction**).

  *   **The Mechanism:** There is an inverse relationship between a concept's *extension* (how many things it covers) and its *intension* (how specific its defining features are). To make a concept cover more cases (maximize reach), you must remove defining features (lose precision).
  *   **The Selection Pressure:** In political competition, there is a premium on breadth. A slogan that applies to more situations is more useful for rallying support.
  *   **Distinction from Concept Creep:** As you noted, *Concept Creep* (Nick Haslam) is about the *expansion of harm* (e.g., "trauma" now includes mild stress). *Concept Stretching* is about the *loss of precision* to gain coverage. They often happen together, but Stretching explains the *structural trade-off* you are observing.

  ### 3. The Memetic Mechanism: Selection for Low-Cost Signaling
  In cultural evolution/memetics, this is driven by **Selection for Transmission Efficiency**.

  *   **Friction as Cost:** A specific, arguable claim carries high "cognitive cost." To adopt it, a host must verify the premise, accept the logic, and risk social pushback from opponents.
  *   **Vagueness as Lubricant:** A vague claim ("We want what's best for the kids") carries near-zero cognitive cost. It requires no verification and triggers no immediate counter-argument.
  *   **The Evolutionary Dynamic:** Memes compete for hosts. Variants of a slogan that encounter less social friction (resistance) spread faster. Over time, the "smoothest" version of the slogan out-competes the "rougher" (more specific) versions.
  *   **Term:** While not a single noun, this is often described as **Selection for Low-Cost Signaling** or **Fitness via Ambiguity**.

  ### 4. Why this isn't just "Semantic Bleaching" or "Drift"
  You are right to distinguish this from ordinary semantic bleaching or drift.

  *   **Ordinary Drift:** Usually random or driven by ease of articulation (e.g., "going to" becomes "gonna"). It has no *teleology* (goal).
  *   **This Phenomenon:** Is **Directional Selection**. The drift is consistently in one direction: *toward lower falsifiability and higher endorsability.*
  *   **The Test:** If the process were random, some slogans would become *more* specific over time. They almost never do. Political slogans evolve toward **Valence Issues** (things everyone agrees on, like "prosperity") and away from **Position Issues** (things people disagree on, like "tax rates").

  ### Summary
  If you need a label to use in conversation, **"Empty Signifier"** is the most theoretically robust term for the *political* phenomenon.

  If you want to describe the *evolutionary mechanism*, you are describing **Directional Selection for Low-Friction Transmission**. The slogan is being selected for its **Coalitional Fitness** rather than its descriptive accuracy. The "arguable part" is a mutation that reduces fitness, so it gets bred out.

  This is why the original users feel like pedants: they are clinging to a high-cost, low-fitness variant of the meme in an environment that has selected for the low-cost, high-fitness variant.
