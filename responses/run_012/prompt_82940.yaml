      *   **Payoffs:** Standard PD: T=5, R=3, P=1, S=0.
      *   **Currency:** "Rationality Points" (RP). Winner gets a piece of candy or just bragging rights.
      *   **Materials:**
          *   Index cards (2 per student).
          *   Markers.
          *   Projector for Payoff Matrix.
          *   Referee Sheets (for the 2 referees).
      *   **Roles:** 16 Players, 2 Referees (rotate or fixed? Fixed is easier for flow).

  5.  **Timeline Construction (80 Mins):**

      *   00-10: Intro & Standard PD (Round 1).
      *   10-30: Program PD (Round 2 & 3). Focus on CliqueBot.
      *   30-50: The Attack & Fragility (Round 4 & 5). Typos, Impostors.
