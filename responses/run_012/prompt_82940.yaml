                  *   CooperateBot: `C`.
              *   *In Class:*
                  *   Card has a "Code String" field.
                  *   Card has a "Behavior" checkbox: [ ] Cooperate if Strings Match, Else Defect. [ ] Always Defect.
                  *   *Wait, if I choose Always Defect, my String doesn't matter.*
                  *   *If I choose Match->C, my String matters.*
