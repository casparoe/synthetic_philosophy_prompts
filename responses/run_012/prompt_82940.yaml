              *   *Problem:* You don't know the target's Sig when writing.
              *   *Solution:* This is the "Program Equilibrium" magic. Your program reads *their* program.
              *   *Classroom Proxy:* You submit your program. The Referee looks at *both*.
              *   *Rule for Impostor:* "If Other Sig == My Sig, then D. Else D." (Basically Always D, but requires Sig match to trigger the 'trap' logic? No.)
