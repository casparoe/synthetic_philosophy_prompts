      *   **Phase 1: The Trap (Standard PD).** 10 mins. Paper slips. C/D. Defect dominates. Boring.
      *   **Phase 2: The Program (CliqueBot).** 25 mins. Students get "Code Cards." They write a "Signature" (string). They select a Logic Gate (Match->C or Match->D or Always).
          *   *Constraint:* To keep execution simple, the "Logic Gate" determines the move based on Signature comparison.
          *   *Referee Role:* Crucial. 2 students act as permanent Referees. They hold the "Interpreter Manual."
          *   *Payoff:* Points on board.
      *   **Phase 3: The Attack.** 15 mins. Allow them to see the opponent's Signature *before* submitting? No, that breaks the "submit program" model.
      *   *Correction:* In Program Equilibrium, you submit the program *blind*. The programs read *each other*.
      *   *So:* I write Program A. You write Program B. We swap. The Referee runs A(B) and B(A).
      *   *Classroom Simulation:* Since we can't run code, we use the "Signature Match" heuristic.
      *   *Refined Mechanism:*
          1.  Write a Signature (e.g., "BlueTurtle42").
          2.  Choose a Stance: `CLIQUE` (Coop if Sigs match) or `PARASITE` (Defect if Sigs match).
          3.  Swap Cards.
          4.  Referee checks:
              *   If A is CLIQUE and Sigs Match -> A Coops.
              *   If A is CLIQUE and Sigs Diff -> A Defects.
              *   If A is PARASITE and Sigs Match -> A Defects.
              *   If A is PARASITE and Sigs Diff -> A Coops (Wait, Parasite usually defects always? No, to beat Clique, Parasite copies Sig and Defects).
