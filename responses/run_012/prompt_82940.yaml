      *   **Context:** Upper-level undergraduate seminar on rationality and social interaction. 18 students, 80 minutes, whiteboard + projector, no laptops.
      *   **Core Concept:** Program Equilibrium (Tennenholtz, 2004) / FairBot / CliqueBots. Agents submit programs/rules, not moves. Cooperation becomes possible in a one-shot PD because moves depend on the *source* (the rule) rather than just the *action*.
      *   **Pedagogical Goal:** Students need to *feel* the shift from forced defection to possible cooperation, then feel the fragility of that cooperation (exact code match required), then feel the difficulty of the "natural repair" (cooperate with anyone who cooperates with me), and finally understand the limits (Folk Theorem equivalence, incompatibility of mechanisms).
      *   **Constraints:** No live hand-execution of complex code by the instructor (error-prone). Students must run it or the language must be trivial. No jargon until debrief.
      *   **Specific Stages Desired:**
          1.  Standard One-Shot PD (feel the floor fall out/forced defection).
          2.  Program Submission (cooperation appears via "copy" strategy).
          3.  Attack the Copy (reverse engineer/parasite).
          4.  Fragility (almost-same rules fail).
          5.  Natural Repair (Cooperate if you cooperate with me) -> Self-reference difficulty.
          6.  (Optional) Unreadable/Blackbox players.
      *   **Debrief Requirements:** Honest ceiling (Folk Theorem equivalence), incompatibility of standard mechanisms (CliqueBot vs. FairBot/Modal Logic).
      *   **Deliverables:** One committed design (rules, materials, scoring, roles, timeline, mapping), predicted failures + fixes, unreproducible concepts (what must be lectured), and design liberties/assumptions.

  2.  **Deconstruct the Core Concept for a Classroom Setting:**

      *   *The Problem:* Real code execution is too slow/complex for 18 students in 80 mins without computers.
      *   *The Solution:* A highly restricted "pseudocode" language that can be evaluated by hand using a lookup table or simple logic.
      *   *The Mechanism:* Instead of writing Python, students write instructions on a card. The "execution" is a comparison of cards.
      *   *Stage 1 (Standard PD):* Standard payoff matrix. Choose C or D.
      *   *Stage 2 (Program PD):* Submit a "Rule Card." The Rule Card says what to do based on the *other* Rule Card.
      *   *Simplification:* To avoid infinite loops (A checks B, B checks A), we need a specific evaluation protocol. The standard literature uses "simulations." In class, we can simulate this by having a "Referee" check the cards.
      *   *Key Insight for Class:* The "CliqueBot" strategy: `If Other.Rule == My.Rule then C else D`. This is easy to check visually.
      *   *Key Insight for Fragility:* `If Other.Rule == [Specific String] then C`. If I change one letter, it defects.
      *   *Key Insight for Repair:* `If Other.Rule(Me) == C then C`. This requires the rule to *run* against the other rule. This is the hard part to simulate without computers.
      *   *Workaround:* We will use a "Token Exchange" metaphor for the execution.
      *   *Wait, a better workaround:* Use a specific, very simple syntax.
          *   Syntax: `IF [Condition] THEN [Move] ELSE [Move]`
          *   Condition options: `OtherRule = MyRule`, `OtherMove = C`, `True`.
          *   Actually, to capture the "Program Equilibrium" vibe, the condition must be about the *source*.
