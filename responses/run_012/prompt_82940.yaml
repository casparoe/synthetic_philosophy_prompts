      *   *Syntax:* `IF (Other_Text == My_Text) THEN C ELSE D`.
      *   *Execution:* Pairs exchange cards. A Referee checks if texts match.
      *   *Problem:* How to simulate `If You Cooperate With Me Then I Cooperate` (FairBot)? That requires running the code.
      *   *Solution for FairBot:* We can't actually run code. We have to *simulate* the outcome based on logical deduction. This is the "unreproducible" part. The activity will focus on the *CliqueBot* (exact match) aspect because that is physically checkable. The *FairBot* (logical implication) aspect must be handled in the debrief/transition because it requires proof theory.
      *   *Correction:* The prompt specifically asks to feel the pull of the natural repair and find it harder to state. I need a way to represent this.
      *   *Idea:* Use colored stickers or symbols.
      *   *Let's step back.* The most robust classroom version of Program Equilibrium is the "Source Code Comparison" game.
      *   *Constraint:* 80 minutes is tight for 18 students (9 pairs) to do multiple rounds of writing and checking.
      *   *Pacing:*
          *   0-15: Standard PD (The Trap).
          *   15-45: Program PD (The Solution & Fragility).
