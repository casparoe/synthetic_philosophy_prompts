      *   *Floor fall out:* Standard PD round.
      *   *Cooperation appear:* CliqueBot round.
      *   *Try to beat it:* Impostor round (Copy sig, play D).
      *   *Fragility:* Typos break CliqueBot.
      *   *Natural Repair:* Attempting "Coop if you coop" leads to confusion/loops (simulated).
