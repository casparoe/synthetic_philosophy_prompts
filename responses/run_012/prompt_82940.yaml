      *   **Name:** "The Source Code Seminar."
      *   **Payoff:** 5/3/1/0.
      *   **Cards:** "Program Cards" with fields for `ID String` and `Logic Type`.
      *   **Logic Types:**
          1.  `CLIQUE`: C if ID matches, else D.
          2.  `DEFECT`: Always D.
          3.  `COOPERATE`: Always C.
          4.  `MIRROR`: (The hard one) C if Other would C against Me.
      *   **Referees:** Given a lookup table for CLIQUE/DEFECT/COOPERATE. For MIRROR, they are instructed to declare "Undecidable" unless the pair is obvious (e.g. Mirror vs Cooperate).
      *   **Debrief:** Explain that `MIRROR` works in theory (Gödel/Löb) but not in this simple lookup.

  9.  **Checking Constraints:**

      *   18 Students. 9 Pairs.
      *   Referees: Take 2 students out of the pool? Or 18th student is me? I am the instructor. I need 2 student referees to make it student-run. So 16 players, 2 referees.
      *   Time: 80 mins is tight. I need to be strict.
      *   No Laptops: All paper.
      *   No Jargon: Until debrief.

  10. **Predicting Failures:**

      *   *Failure:* Students write "C" as their ID.
      *   *Fix:* Rule: ID must be 5+ characters, no spaces.
      *   *Failure:* Referees bottleneck.
      *   *Fix:* Pre-print Referee Cheat Sheets.
      *   *Failure:* MIRROR round takes forever.
      *   *Fix:* Limit to 5 minutes, then cut to debrief.
      *   *Failure:* Folk Theorem point is missed.
      *   *Fix:* Explicitly map PD payoffs to Repeated Game averages in debrief.

  11. **Liberties & Assumptions:**

      *   *Liberty:* We assume "ID Match" equals "Source Code Match." In reality, semantically equivalent code can have different syntax. We ignore this to make it playable.
      *   *Liberty:* The Referee is a trusted oracle. In reality, verifying code is hard.
      *   *Assumption:* Students care about points.
      *   *Assumption:* The "MIRROR" logic is intuitively graspable as "Coop if you coop."

  12. **Debrief Content Check:**

      *   *Folk Theorem:* Yes, Program Equilibrium payoffs = Feasible & Individually Rational payoffs of Repeated PD. It doesn't *expand* the set, it just allows reaching the cooperative point in a *one-shot* setting.
      *   *CliqueBot vs. FairBot:* CliqueBot (`CodeA == CodeB`) does not cooperate with FairBot (`Provable(Cooperate)`). CliqueBot sees FairBot code is different -> Defects. FairBot cannot prove CliqueBot cooperates (because CliqueBot depends on equality, not provability) -> Defects. They mutual defect. This is a crucial point to mention.

  13. **Final Review against Prompt:**

      *   *Staged activity?* Yes.
      *   *Rules/Materials/Scoring?* Yes.
      *   *Timeline?* Yes.
      *   *Mapping moment to idea?* Yes.
      *   *Predictable failures?* Yes.
      *   *Unreproducible parts?* Yes (Proof theory).
      *   *Liberties?* Yes (Syntax vs Semantics).

      *Self-Correction on "Unreadable":* The prompt mentions a third stage where a player declines to be readable. I can add this as a "Black Box" card option in Round 5. If you submit a Black Box, CliqueBot treats it as "No Match" -> Defect. This shows that opacity leads to defection in this equilibrium.

      *Refining the "Natural Repair":* The prompt wants them to find it harder to state. I will have them *write* the rule in English first. Then try to translate it to the Card Logic. They will fail to find a checkbox that fits. This creates the gap.

      *Let's write the response.*
answer: |-
  # Session Design: "The Source Code Seminar"

  ## 1. Overview & Learning Objectives
  **Goal:** Move students from the intuition that "one-shot PD forces defection" to the visceral experience that "changing the object of choice (from moves to rules) enables cooperation," followed by the realization that this cooperation is fragile, vulnerable to parasitism, and theoretically limited.
  **Time:** 80 Minutes.
  **Students:** 18 (16 Players, 2 Referees).
  **Materials:** Index cards (3 per student), markers, projector, printed "Referee Manuals" (2 copies), printed "Payoff Matrix" (1 slide).

  ## 2. The Payoff Scheme
  Use standard Prisoner's Dilemma payoffs, tracked as "Rationality Points" (RP) on the whiteboard.
  *   **Mutual Cooperation (C, C):** 3 points each.
  *   **Mutual Defection (D, D):** 1 point each.
  *   **Temptation (D, C):** 5 points (Defector), 0 points (Cooperator).
  *   **Sucker (C, D):** 0 points (Cooperator), 5 points (Defector).

  *Incentive:* The top 3 scores at the end of class receive a small prize (e.g., chocolate, or exemption from a minor reading response). This ensures they care about the score without needing real money.

  ## 3. The Rules & Materials

  ### The Program Card
  Each student receives identical index cards. They must fill in two fields:
  1.  **Signature:** A string of text (minimum 6 characters, alphanumeric). *Constraint: No standard words like "COOPERATE" or "DEFECT".*
  2.  **Logic:** They must circle one of the following pre-printed options:
      *   `[A] CLIQUE`: Cooperate if **Signatures Match**; else Defect.
      *   `[B] PARASITE`: Cooperate if **Signatures Match**; else Defect. *(Wait, this is identical to A. See "Liberties" below. We will differentiate by behavior.)*
      *   *Correction for Playability:* To make the "Attack" possible, we need distinct behaviors.
      *   **Revised Logic Options:**
          *   `[1] MIRROR`: Cooperate if **Signatures Match**; else Defect.
          *   `[2] TRAITOR`: Cooperate if **Signatures Match**; else Defect. *(Wait, if they match, one must defect to win.)*
      *   **Final Logic Options (Pre-printed on Card):**
          *   `[1] MATCH-C`: If Signatures Match → **C**. Else → **D**.
          *   `[2] MATCH-D`: If Signatures Match → **D**. Else → **D**. (This is just Always Defect, but requires a match to "trigger" the logic check).
          *   `[3] OPEN`: Always **C**.
          *   `[4] CLOSED`: Always **D**.
          *   `[5] CUSTOM`: (Blank line for English instruction).

  ### The Referee Manual
  The 2 Referees (selected volunteers) get a cheat sheet to resolve pairs quickly without instructor intervention.
  *   **Step 1:** Collect Card A and Card B.
  *   **Step 2:** Compare Signatures.
      *   If **Exact Match**: Follow the "Match" instruction on each card.
      *   If **Different**: Follow the "Else" instruction on each card.
  *   **Step 3:** If a card says `CUSTOM`, the Referee declares "Undecidable" (both get 1 point) unless the instruction is trivial (e.g., "Always C").
  *   **Step 4:** Record scores on the board.

  ## 4. Minute-by-Minute Timeline

  ### Phase 1: The Floor Falls Out (00:00 – 00:15)
  *   **00-05:** Distribute standard slips of paper. "Choose C or D. One shot. No talking."
  *   **05-10:** Pair them up (9 pairs). Collect choices. Reveal moves. Calculate scores.
  *   **10-15:** **Debrief Moment 1:** Ask: "Did anyone choose C? Why?" (Expect: "It's risky," "Rational to D"). Write "Dominant Strategy: Defect" on the board. *Feeling:* The inevitability of the trap.

  ### Phase 2: The Program Equilibrium (00:15 – 00:40)
  *   **15-20:** Introduce "Program Cards." Explain: "You are no longer choosing a move. You are choosing a *rule* that decides the move based on the other person's rule. You submit the card blind. The Referee runs them."
  *   **20-30:** **Round 2 (Discovery):** Students write Signatures and Logic. (Most will converge on `MATCH-C` with a simple signature like "AAAAAA").
      *   *Referees execute.* Expect high cooperation (3,3) among those who matched.
      *   *Feeling:* Cooperation is suddenly possible. The "floor" is restored.
  *   **30-35:** **Round 3 (The Attack):** Announce: "You can see the Referee's log from Round 2." (Show the winning signatures on the board).
      *   Task: "Try to maximize your score against the group's current strategy."
      *   *Expected Move:* A student chooses `MATCH-D` (or `CLOSED`) but copies the popular Signature "AAAAAA".
      *   *Execution:* Referee sees Match. Victim (`MATCH-C`) plays C. Attacker (`MATCH-D`) plays D. Score: 5 vs 0.
      *   *Feeling:* Vulnerability. The "solution" can be eaten.
  *   **35-40:** **Round 4 (Fragility):** Ask students to change *one character* of their Signature (e.g., "AAAAAA" to "AAAAAB") but keep Logic `MATCH-C`. Pair them with someone who didn't change.
      *   *Execution:* Signatures differ. Both play D. Score: 1 vs 1.
      *   *Feeling:* The cooperation was not about "trust" or "disposition," it was about *exact artifact identity*. It is brittle.

  ### Phase 3: The Natural Repair & The Wall (00:40 – 01:00)
  *   **40-50:** **Round 5 (The Repair):** Challenge: "Write a rule that cooperates with `MATCH-C` *without* copying their Signature. Cooperate with anyone who cooperates with you."
      *   Students must use the `[5] CUSTOM` line.
      *   They will write things like: "If they would C against me, then C."
      *   *Execution:* Referees will hit the "Undecidable" clause in their manual. They cannot determine if "If they would C against me" is true without running a simulation that might loop.
      *   *Result:* Most pairs get 1 point (Punishment for Undecidable).
      *   *Feeling:* The intuitive solution ("Coop if you coop") is computationally/logically harder to state than the brittle solution ("Coop if same").
  *   **50-60:** **Round 6 (Opacity - Optional/Time Permitting):** Introduce a "Black Box" card (Signature hidden).
      *   Pair a `MATCH-C` against a Black Box.
      *   *Result:* Signatures cannot match. `MATCH-C` defects.
      *   *Feeling:* Transparency is required for this equilibrium.

  ### Phase 4: The Debrief (01:00 – 01:20)
  *   **60-65:** **Terminology:** Introduce "Program Equilibrium" (Tennenholtz), "CliqueBot" (Match-C), "FairBot" (Custom/Logical).
  *   **65-70:** **The Ceiling (Folk Theorem):** Explain that the payoffs achieved here (3,3) are exactly the same as the Repeated PD Folk Theorem. We haven't created *new* outcomes; we've just allowed the cooperative outcome in a *one-shot* setting by changing the move space. We traded "Shadow of the Future" for "Transparency of Source."
  *   **70-75:** **The Incompatibility:** Address the `CUSTOM` failure. Explain that `CliqueBot` (Code Equality) and `FairBot` (Logical Provability) **do not cooperate with each other**.
      *   CliqueBot sees FairBot's code is different → Defects.
      *   FairBot cannot prove CliqueBot will cooperate (because CliqueBot's logic is opaque to proof, it's just a lookup) → Defects.
      *   *Point:* There is no single "Master Rule" for cooperation.
  *   **75-80:** **Q&A.**

  ## 5. Mapping Activity to Ideas

  | Activity Moment | Concept Delivered |
  | :--- | :--- |
  | **Phase 1 (Standard PD)** | **Forced Defection:** Rationality in standard move-space leads to P=1. |
  | **Phase 2 (Round 2)** | **Program Equilibrium:** Changing choice to *rules* allows C=3. |
  | **Phase 2 (Round 3)** | **Parasitism:** Cooperation is not stable against agents that mimic source but defect on output. |
  | **Phase 2 (Round 4)** | **Fragility:** Cooperation relies on *syntactic identity*, not semantic alignment. A typo breaks the peace. |
  | **Phase 3 (Round 5)** | **The Fix is Hard:** "Cooperate if you cooperate" requires self-reference/proof, not just string matching. |
  | **Debrief (Folk Theorem)** | **No Free Lunch:** We didn't beat the Folk Theorem; we just reached its upper bound in a one-shot. |
  | **Debrief (Incompatibility)** | **No Universal Bot:** CliqueBots and FairBots mutually defect. |

  ## 6. Predicted Failures & Mitigations

  1.  **Failure: Referee Bottleneck.**
      *   *Risk:* 9 pairs submitting cards overwhelms 2 referees.
      *   *Fix:* Stagger the submission. Have 3 pairs go at a time while others watch the board. Or, appoint 4 referees (4 students sit out a round to officiate, rotate them in Phase 3). *Recommendation:* Use 4 Referees total. 14 Players, 4 Referees. 7 Pairs is manageable.
  2.  **Failure: Students write "COOPERATE" as a Signature.**
      *   *Risk:* Trivializes the "Signature" concept.
      *   *Fix:* Enforce the "6 characters, no dictionary words" rule strictly. If violated, the card is auto-Defect.
  3.  **Failure: Round 5 (Custom) creates chaos.**
      *   *Risk:* Students argue with Referees about what their English rule means.
      *   *Fix:* Instruct Referees: "If you have to think for more than 10 seconds, it is Undecidable. Assign (1,1)." This *is* the lesson (computational intractability).
  4.  **Failure: The "Parasite" doesn't work.**
      *   *Risk:* If everyone plays `MATCH-C`, a `MATCH-D` player needs a match to trigger the defect. If they copy the signature, they get the match.
      *   *Fix:* Ensure the "Winning Signatures" from Round 2 are visible on the board so Round 3 attackers know what to copy.

  ## 7. Unreproducible Concepts (The "Talk" Part)

  You cannot simulate **Proof-Theoretic Cooperation** (FairBot/Modal Logic) physically.
  *   **Why:** In the activity, `CUSTOM` rules fail because the Referee (the oracle) cannot run a logical proof in their head. In the literature, `FairBot` works because it relies on a formal system (PA) where `□(A(B)=C) → A(B)=C` is a theorem (Löb's Theorem).
  *   **Your Job:** You must explain that the "Natural Repair" *does* work in theory, but it requires a specific logical framework (Gödel-Löb logic) that human intuition (and paper referees) cannot execute. The activity creates the *need* for this theory; the lecture supplies the *existence* proof.

  ## 8. Design Liberties & Assumptions

  1.  **Syntax = Semantics:** The activity assumes that if two Signatures match, the "programs" are identical. In reality, two different codes can produce the same behavior (semantic equivalence). We ignore this to make the "Fragility" point visceral. *Liberty:* We treat code as a string, not a function.
  2.  **The Trusted Oracle:** The Referees are assumed to be honest and accurate. In a real distributed system, verifying source code is computationally expensive or impossible (obfuscation). *Liberty:* We assume transparency is free and perfect.
  3.  **Payoff Equivalence:** The activity implies that Program Equilibrium is "better" because it works in one-shot. The debrief must correct this: it buys *timing*, not *value*. The payoff (3,3) is not higher than Repeated PD (3,3).
  4.  **The "Parasite" Logic:** In the activity, `MATCH-D` (Coop if Match, Else Defect -> Wait, if Match, Defect) is a simplification. A true parasite in literature (like `TrollBot`) might have more complex logic. We simplify to "Copy Signature, Play D" to ensure the Referee can adjudicate it.

  ## 9. Instructor Script for the "Incompatibility" Point
  *Use this verbatim in the debrief to ensure accuracy:*
  > "You might wonder: 'Why not just use the Custom Rule? Why stick with the brittle Signature Match?' Theoretically, you can. There are bots called 'FairBots' that cooperate if they can *prove* you will cooperate. They are more robust than Signature Bots. But here is the catch: A Signature Bot and a FairBot will **not** cooperate with each other. The Signature Bot sees the FairBot's code is different and defects. The FairBot cannot prove the Signature Bot will cooperate (because the Signature Bot's logic isn't based on proof, it's based on equality) and defects. There is no single 'Super Bot' that cooperates with everything rational. The landscape is fragmented."

  ## 10. Final Check on Constraints
  *   **No Laptops:** Met (Paper cards).
  *   **No Live Execution Errors:** Met (Referees use lookup tables; "Undecidable" catches the hard cases).
  *   **18 Students:** Met (14 Players, 4 Referees).
  *   **80 Minutes:** Tight, but the "Undecidable" rule in Round 5 prevents bogging down.
  *   **No Jargon:** Met (Terms reserved for Debrief).

  This design prioritizes the *feeling* of fragility and the *difficulty* of self-reference over a perfect simulation of modal logic, which aligns with your goal of making them "feel anything" rather than just nodding.
