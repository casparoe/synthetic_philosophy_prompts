      *   *Unreproducible:* The actual proof theory of Modal Logic (FairBot).

  7.  **Refining the "Natural Repair" Activity:**

      *   How to make them feel the difficulty?
      *   Give them a card that says: `IF (Other Rule returns C against Me) THEN C ELSE D`.
      *   Ask them to play against a `CLIQUE` card.
      *   Referee says: "I can't determine this without running your rule against theirs and theirs against yours."
      *   Referee simulates: Clique checks Sig. FairBot checks Outcome.
      *   If Sig matches, Clique Coops. FairBot sees Clique Coops, so FairBot Coops.
      *   If Sig differs, Clique Defects. FairBot sees Clique Defects, so FairBot Defects.
      *   *Wait, this works if the Referee does the work.*
      *   *But I don't want the Referee to do complex work.*
