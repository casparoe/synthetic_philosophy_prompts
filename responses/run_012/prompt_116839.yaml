answer: |-
  # Activity Design: "The Protocol of Habit"

  ## 1. Overview and Rationale
  This activity simulates the Ashʿarite metaphysical structure without using theological terminology until the debrief. It forces students to inhabit the Humean position (inductive inference from regularity) and then destabilizes it ontologically (the regularity was volitional, not mechanical). Finally, it imposes the *kasb* (acquisition) constraint: students are held responsible for outcomes they did not causally produce but volitionally "accompanied."

  **Commitment:** I have selected a **Token-Exchange Simulation**. This is superior to a debate or text-analysis because it creates a *somatic* reliance on the "laws" of the game. When the laws break, the frustration is visceral, mirroring the philosophical shock of occasionalism. It avoids the need for Arabic or prior theological knowledge by encoding the concepts into game mechanics.

  ## 2. Materials and Setup
  *   **Room:** One large table or desks pushed together. You (the Instructor) sit at the head, separate from the students.
  *   **Students:** 12 participants, divided into 4 Groups of 3.
  *   **Handouts:**
      *   **Action Cards:** 20 cards per group. 10 marked with a **Circle (●)**, 10 marked with a **Square (■)**.
      *   **Ledger Sheets:** 1 per group to record "Laws" and "Scores."
      *   **Volition Slips:** Small slips of paper (2 per student).
  *   **Instructor Materials:**
      *   **Effect Tokens:** 100 small pieces of colored paper (50 Blue, 50 Red) hidden in two opaque bowls/envelopes.
      *   **Master Scoreboard:** Whiteboard to track group points.
      *   **The Decree:** A pre-written envelope containing the "Phase 3 Rules."

  ## 3. Roles
  *   **The Sustainer (Instructor):** You hold the "power" (the Tokens). You decide which Token corresponds to which Card. You are opaque; you do not explain your reasoning during the game.
  *   **The Agents (Students):** They hold the "will" (the Cards). They choose which Action to submit. They seek to maximize Points.
  *   **The Scribe (Rotating within Groups):** Records the group's observed "Laws of Nature" and final scores.

  ## 4. Rules and Scoring
  *   **Objective:** Groups maximize their Point Total.
  *   **The Loop:**
      1.  **Volition:** The Group discusses and selects one Action Card (Circle or Square) to submit to the Sustainer in an envelope.
      2.  **Creation:** The Sustainer opens the envelope, looks at the Card, and places a Token (Blue or Red) inside.
      3.  **Acquisition:** The Sustainer returns the envelope. The Group opens it, reveals the Token, and records the Points.
  *   **Scoring Scheme (Phase 1 & 2):**
      *   Blue Token = +10 Points.
      *   Red Token = +0 Points.
      *   *Note:* Students do not know this mapping initially; they must infer it.
  *   **Scoring Scheme (Phase 3):**
      *   Points are awarded based on the **Token**, but **Responsibility** is assigned based on the **Card**. (Detailed in Timeline).

  ## 5. Minute-by-Minute Timeline (90 Minutes)

  ### 00:00 – 00:15: Setup and Induction
  *   **00-05:** Distribute materials. Give no philosophical context. State only: *"This is a production simulation. You are Agents. I am the System. Your goal is points. You submit Cards; I return Tokens. Do not speak to me during rounds."*
  *   **05-15:** **Rounds 1–5 (The ʿĀda).**
      *   Groups submit Cards. You enforce a strict, hidden rule: **Circle = Blue**, **Square = Red**.
      *   Return Tokens immediately.
      *   After Round 3, pause. Ask Groups to write their "Law of Production" on the Ledger. (They will write: *Circles cause Blue*).
      *   Complete Rounds 4–5 to cement the habit. They should feel confident they have "cracked the code."

  ### 00:15 – 00:35: The Break (Claim i)
  *   **15-25:** **Rounds 6–8 (The Miracle).**
      *   Without warning, switch the rule. **Circle = Red**, **Square = Blue**.
      *   Groups will submit Circles (expecting Blue). They receive Red (0 Points).
      *   Observe the confusion. They will try to "fix" their strategy. Let them fail for 3 rounds.
      *   *Crucial:* Do not explain why. Just return the Tokens.
  *   **25-35:** **Interrogation.**
      *   Stop the game. Ask: *"Did the Card change? Did the Token change? Did the connection change?"*
      *   Ask: *"Was the first Law false? Or was it just contingent?"*
      *   Reveal that *you* held the Tokens the whole time. The Card never touched the Token. You mediated every single exchange.
      *   **Philosophical Hook:** *"In Rounds 1–5, was there any power in the Circle to produce Blue?"* (Consensus: No, it was your choice).

  ### 00:35 – 00:55: The Acquisition (Claim ii)
  *   **35-40:** **The Twist.**
      *   Open **The Decree** envelope. Read aloud: *"Metaphysical Correction: The Sustainer creates the Outcome. The Agent acquires the Outcome. Scoring is retroactively adjusted."*
      *   **New Rule:** Points are still awarded for Tokens (Blue = 10). **HOWEVER**, if a Group receives a Token, they are deemed to have **authored** that Token, regardless of whether their Card 'matched' the old law.
      *   **The Kicker:** In Rounds 6–8, some Groups received Red Tokens (0 points) but are now told: *"You submitted a Card intending an outcome. The Outcome occurred (even if it was Red). You are responsible for the Red Token."*
      *   Wait—make it sharper. Tell them: *"In Round 6, you played Circle. I created Red. You expected Blue. But since you initiated the Occasion (playing the Card), the Act (Red Token) is yours. You get the Points (or lack thereof) associated with it, and you bear the moral weight of it."*
      *   Actually, to capture *kasb* better: Tell them their final grade for the activity depends on the **Tokens** they hold, but you will ask them to defend **why** they played the Cards that led to them.
      *   *Refined Move:* Ask one student from a group that got "Red" in Round 6: *"Did you produce this Red Token?"* They will say *"No, you did."* You reply: *"But you willed the occasion. In this seminar, Will + Occasion = Responsibility. You own this Red Token."*
  *   **40-55:** **Group Deliberation.**
      *   Groups must write a 3-sentence "Defense of Agency." They must explain why they deserve credit/blame for the Tokens, given that you (the Sustainer) physically placed them in the envelopes.
      *   This forces them to articulate a version of *kasb* to save their own dignity/score.

  ### 00:55 – 01:15: Debrief and Mapping
  *   **55-65:** **Mapping Claim (i).**
      *   Connect Rounds 1–5 to *ʿĀda* (Custom/Habit).
      *   Connect Rounds 6–8 to the Miracle (*khāriq al-ʿāda*).
      *   Contrast with Hume: Hume says we *cannot know* necessity. Ghazālī says there *is no* necessity in creation. The game proved Ghazālī: You (the Sustainer) were the necessity.
  *   **65-75:** **Mapping Claim (ii).**
      *   Connect the "Defense of Agency" to *Kasb* (Acquisition).
      *   Explain: Ghazālī needs this because if God is the only Agent, prayer and morality collapse. *Kasb* allows humans to be "real" agents ethically, even if not ontologically.
      *   Ask: *"Did the Defense of Agency feel like a loophole or a truth?"*
  *   **75-90:** **Open Discussion.**
      *   Prompt: *"If God interrupts the habit (Round 6), why trust science?"* (Answer: God's promise/consistency).
      *   Prompt: *"Is Kasb coherent, or does it make God a deceiver?"*

  ### 01:15 – 01:30: Buffer and Closing
  *   Use remaining time for lingering questions or to distribute a one-page handout summarizing the Ashʿarite position vs. Hume vs. Aristotelianism to solidify the learning.

  ## 6. Debrief Guide: Mapping the Experience
  Use this script to ensure the philosophy lands after the game.

  1.  **On Causation (Claim i):**
      *   *Ask:* "In Round 1, did the Circle *make* the Blue token appear?"
      *   *Student Answer:* "No, you did."
      *   *Point:* "Exactly. For al-Ghazālī, fire does not burn cotton. God creates the burning *at the occasion* of the fire touching cotton. You felt the security of a law (Rounds 1–5). That security was real, but it was in *Me* (the Sustainer/God), not in the *Card* (the Creature). This is *ʿĀda*."
      *   *Hume Contrast:* "Hume says you can't see the glue. Ghazālī says there is no glue. The game proved there was no glue."

  2.  **On Agency (Claim ii):**
      *   *Ask:* "In Phase 3, I told you that you 'owned' the Red Token even though I placed it there. How did that feel?"
      *   *Student Answer:* "Unfair," "Confusing," "Technicality."
      *   *Point:* "This is the difficulty of *Kasb*. If God creates the act, how are you responsible? Ghazālī says: You have the *will* (the Card). God has the *power* (the Token). When they coincide, you 'acquire' the act. It preserves moral responsibility without challenging God's omnipotence."
      *   *Why he needs it:* "Without (ii), (i) makes humans into puppets. With (ii), humans are partners in the occasion, though not the creators of the being."

  ## 7. Troubleshooting: What Will Go Wrong
  1.  **The "Trick" Suspicion:**
      *   *Risk:* Students might suspect the rule change immediately in Round 6 and treat it as a "gotcha" rather than a metaphysical point.
      *   *Fix:* Play the Sustainer role with absolute bureaucratic neutrality. Do not smile when the rule changes. Treat the Tokens as objective facts. Say: *"The System has updated."* This depersonalizes the break, making it feel more like a law of nature shifting.
  2.  **The *Kasb* Rebellion:**
      *   *Risk:* In Phase 3, students may refuse to accept responsibility for the Red Tokens, calling the game "rigged."
      *   *Fix:* Acknowledge this. *"Your anger is the correct philosophical response to Occasionalism if you value independent agency. Ghazālī asks you to swallow this anger for the sake of Divine Unity (Tawḥīd). The tension you feel is the cost of the theology."* Do not try to resolve their anger; use it as data.
  3.  **Time Creep:**
      *   *Risk:* Phase 1 takes too long as students discuss strategy.
      *   *Fix:* Enforce a 60-second limit per round. Use a visible timer. The pressure mimics the immediacy of creation.

  ## 8. Limitations and Contested Readings (Instructor Notes)
  You must supply the following context in the debrief, as the activity cannot reproduce them:

  1.  **God's Wisdom vs. Caprice:**
      *   *Limitation:* In the game, you (the Sustainer) changed the rules arbitrarily to make a point. This makes God look capricious.
      *   *Correction:* You must explain that for Ghazālī, God's Custom (*ʿĀda*) is stable because of His Promise, not because He *must* be consistent. He *can* interrupt it (miracle), but usually *chooses* not to. The game exaggerates the interruption for pedagogical effect.
  2.  **The Coherence of *Kasb*:**
      *   *Limitation:* The game makes *kasb* look like "unfair scoring" (being blamed for someone else's act).
      *   *Correction:* Acknowledge that many philosophers (including later Islamic critics like the Muʿtazila and modern scholars) find *kasb* incoherent. It is a "compatibilism of the gaps." The activity reproduces the *structure* of the claim, not its metaphysical satisfaction.
  3.  **Ontological vs. Epistemological:**
      *   *Limitation:* Students may conflate this with Humean skepticism (we don't *know* causation).
      *   *Correction:* Emphasize that Ghazālī is making an **ontological** claim (causation *does not exist* between creatures), not just an epistemological one (we can't *see* it). In the game, the Card *literally* had no power. Ensure they grasp this distinction.
  4.  **The "Secondary Cause" Nuance:**
      *   *Limitation:* The game implies creatures do *nothing*.
      *   *Correction:* Ghazālī grants creatures "acquisition." The activity captures this in the Card selection, but be careful not to imply humans are completely inert. They have Will (*irāda*), just no Creative Power (*takwīn*).

  ## 9. Why This Design?
  I committed to the **Token-Exchange** over a debate or text-reading because Occasionalism is counter-intuitive. Reading about it allows students to keep their Aristotelian intuitions intact as a "theoretical possibility." By physically handing over a Card and receiving a Token that *you* controlled, they lose the intuition of power. They *feel* the dependency. The "unfairness" of Phase 3 is not a bug; it is the feature. It forces them to confront why anyone would accept Claim (ii) if it feels like that. The only reason to accept it is if Claim (i) is true and God's Unity is the highest priority. That is the exact theological trade-off Ghazālī proposes.
