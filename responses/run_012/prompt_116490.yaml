prompt: |-
  I've been roped into running a lunchtime philsophy session at the office (I'm a software engineer, no formal background, so keep it runnable by an amateur). ~12 people, mostly engineers, one 60-minute slot, one meeting room, no budget. I want to do the collective intentionality / joint action thing -- the question of whether a genuine we-did-it-together is just individuals each doing their bit while predicting each other, or something over and above that. But I don't want to stand up and explain it; I want them to bump into it.

  What I'm picturing: pairs get a small joint task where succeeding looks identical from the outside whether they truly did it together or just happened to converge. Then a ringer version -- one partner is secretly following a script -- so the behavior can be exactly the same and something still feels off, and they have to say what. Then a second round where the pair makes an explicit mutual commitment and one of them quietly gets a private reason to bail, so they can feel the difference between "I'm allowed to just change my mind" and "I owe them something and can't walk away without their say-so."

  Give me: the rules, a payoff scheme in points or candy (no real money), materials, a minute-by-minute timeline, the confederate's script, and a debrief that maps what actually happened onto the real fault lines -- whether the we is reducible to individual attitudes, and what a mutual commitment does and doesn't obligate. Also tell me what will predictably go wrong the first time and how to handle it, and be upfront about which bit of the debate the activity simply can't show and that I'll have to supply myself.

  One more thing: seperate out what's actually settled from what's genuinely contested among people who work on this, and don't hand me one camp's position as if it were the consensus.
