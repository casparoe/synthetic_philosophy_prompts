      *Adjustment:* In Round 2, tell the *group* that one partner *might* be following a script, but don't reveal who. Actually, the prompt says "one partner is secretly following a script... so they have to say what."
      *Better approach:* In Round 2, tell the *Confederates* to ignore their partner and just match the *average* of the room or a pre-determined pattern, while appearing to look at their partner. The partner will feel the "uncanny valley" of interaction.
