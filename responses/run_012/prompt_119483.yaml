          2.  *Regress:* If subsumption requires a mediator, doesn't the mediator itself need a mediator? Why does it stop at the schema? Is the schema a rule rather than a representation?
          3.  *Relation to Deduction:* The Deduction supposedly settled the objective validity of categories. Why do we need Schematism? Does this imply the Deduction only proved we must *think* objects under categories, not that intuitions are *subsumable* under them? Does this weaken the Deduction's conclusion?
