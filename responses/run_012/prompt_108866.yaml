answer: |-
  You have stumbled directly onto one of the oldest, nastiest holes in formal epistemology. You aren't confused; the framework you're using (standard Bayesianism) is idealized in a way that doesn't match human cognition.

  Here is the breakdown of what this is, why the update is real, and how to distinguish the signal from the noise without relying on the blunt instrument of "falsifiability."

  ### 1. Does this have a name?

  Yes. In philosophy of science, this is **The Problem of Old Evidence**.

  In strict Bayesian terms, if you already know evidence $E$ (the ingredients of the supplement), then $P(E) = 1$. If $P(E) = 1$, then $P(H|E) = P(H)$. You cannot update on something you already knew with certainty.

  However, this assumes **Logical Omniscience**. It assumes that if you know the facts, you automatically know all the logical and probabilistic implications of those facts. Humans do not have logical omniscience. We have **Logical Uncertainty**.

  What you updated on was not the evidence ($E$). You updated on the **relation** between the hypothesis and the evidence.
  *   **Before:** You had facts $F_1, F_2, F_3$. You had Hypothesis $H$. You didn't see the link.
  *   **After:** You learned that $H$ *explains* $F_1, F_2, F_3$ with high likelihood.

  So, technically, your evidence wasn't "the ingredients." Your evidence was: *"A coherent causal model exists that links these known ingredients to the null effect."* That *is* new information. It is information about the structure of hypothesis space, not the state of the world.

  In the rationalist sphere, this is often discussed under **Bounded Rationality** or **Logical Induction**. You are updating because your internal model of the world became more computationally integrated.

  ### 2. Mechanically, where does the confidence come from?

  You asked: *What did I learn? That the argument exists? Is that evidence about the world or just about my own head?*

  It is evidence about **Model Complexity vs. Explanatory Power.**

  When your friend chained the facts together, she demonstrated that the "Supplement is Useless" hypothesis has high **compressive power**. It takes a bunch of disjointed facts (bioavailability rates, liver metabolism, dosage thresholds) and compresses them into a single, simple mechanism that predicts the null result.

  Mechanically, your likelihood ratio shifted:
  $$ \frac{P(\text{Argument} | \text{Hypothesis is True})}{P(\text{Argument} | \text{Hypothesis is False})} $$

  *   **If the hypothesis is True:** It should be easy to construct a clean, causal chain from ingredients to null effect.
  *   **If the hypothesis is False:** Constructing that chain should be hard. You would have to force the facts, ignore contradictions, or add ad-hoc clauses.

  Because the argument felt "clean" (low friction between the facts and the conclusion), your brain registered a high likelihood ratio. You learned that the **Hypothesis fits the Data better than you previously calculated.**

  **The Math Case (Case 3):**
  This is the limit case. In math, the link is deductive. If you accept the axioms, the probability of the theorem becomes 1. The update is closing a gap in logical necessity.
  **The Empirical Case (Case 1 & 2):**
  The link is probabilistic/causal. The update is closing a gap in *plausibility*.

  ### 3. How to distinguish the Friend from the Conspiracy Theorist

  This is the critical part. Both say "It all fits together." Both use known facts. Both feel like a Gestalt shift. Falsifiability fails here because the conspirator will say, "If X hadn't happened, it would have been because of Y," which is unfalsifiable, but they won't admit it.

  The difference is **Overfitting** (borrowed from statistics/machine learning).

  #### The Distinction: Degrees of Freedom
  A good argument constrains the world. A bad argument accommodates the world.

  *   **Your Friend (Good Update):** The argument relied on specific mechanisms (e.g., "This compound degrades at stomach pH"). If the stomach pH were different, the argument would break. If the dosage were 10x higher, the argument might break. The "fit" is tight. The model has **low degrees of freedom**. It risks being wrong about the facts you already know.
  *   **The Conspirator (Bad Update):** The argument relies on motive and opportunity ("Big Pharma wants profit, so they hid the cure"). This narrative can stretch to fit *any* outcome. If the drug works, it's profit. If it doesn't work, it's a cover-up. If the whistleblower dies, it's murder. If they live, it's disinformation. The model has **high degrees of freedom**. It hugs the data points without being constrained by them.

  #### The Heuristic: "Could this story explain the opposite?"
  To apply this next time, don't ask "Is this falsifiable?" Ask: **"How many different worlds does this argument fit?"**

  *   **Friend:** "Given these chemical properties, it *couldn't* work." (Fits only one world: the null result world).
  *   **Conspirator:** "Given these political incentives, it *makes sense* that it didn't work." (Fits the null result world, but could easily be tweaked to fit a 'partial success' world or a 'banned' world).

  If the "fitting together" feels like a key sliding into a lock, it's likely a good update. The key has a specific shape; it only opens one lock.
  If the "fitting together" feels like shrink-wrap molding around an object, it's likely a bad update. The shrink-wrap fits anything; it just takes more plastic.

  #### The "Cost" of the Connection
  In your friend's case, the connection had a **cost**. She had to invoke specific biological mechanisms that have their own independent evidence. She "spent" credibility on the mechanism to "buy" credibility on the conclusion.

  In the conspirator's case, the connection is **free**. "They are hiding it" costs nothing. It invokes a hidden variable (the conspiracy) that has no independent evidence other than the pattern it is trying to explain.

  **Rule of Thumb:**
  If the "glue" holding the facts together is a mechanism that exists independently of the conclusion (e.g., known pharmacokinetics), update up.
  If the "glue" is a mechanism invented solely to hold these specific facts together (e.g., a specific cabal with specific motives), update down (or penalize for complexity).

  ### Summary of Boundary Cases

  1.  **Legit Update (Your Friend):**
      *   **Facts:** Known.
      *   **Glue:** Independent causal mechanisms (low degrees of freedom).
      *   **Feel:** "Oh, the facts *force* this conclusion."
      *   **Verdict:** Real update on model likelihood.

  2.  **Garbage Update (Conspirator):**
      *   **Facts:** Known.
      *   **Glue:** Post-hoc narrative / Motive (high degrees of freedom).
      *   **Feel:** "Oh, the facts *allow* this story."
      *   **Verdict:** Overfitting. You are being sold complexity disguised as insight.

  3.  **Math Update:**
      *   **Facts:** Axioms.
      *   **Glue:** Logic (zero degrees of freedom).
      *   **Feel:** Certainty.
      *   **Verdict:** Deductive closure.

  ### What to call it?
  If you want a label to hang on your mental file cabinet, call it **"Explanatory Integration under Logical Uncertainty."**

  But practically, treat it as **Checking for Overfitting.** When you feel that "click" of everything fitting together, pause and ask: *"Did this argument predict the shape of the facts, or did it just stretch to cover them?"*

  If the argument would have been broken by a fact you already know (but didn't notice was relevant), it's real. If the argument could have absorbed any fact you threw at it, it's noise.
