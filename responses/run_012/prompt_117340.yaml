      *   *Claim 7:* "...but he treats natural slavery as the justification for the institution, and since superior power is generally found where there is superior excellence, the doctrine ends up vindicating conquest: whoever can enslave another has, in effect, shown himself fit to rule." -> **This is the contentious claim.** The summary suggests Aristotle equates power/excellence with successful conquest. Aristotle explicitly argues *against* the idea that might makes right in the context of slavery.

  3.  **Evaluate the Distortion (Claim 7):**
