prompt: |-
  I recently read a popular history of political thought, and its treatment of Aristotle on slavery is bothering me. Here is the summary it gives:

  "Aristotle holds that some human beings are slaves by nature. These are people who can apprehend reason but not possess it: they can follow orders and take direction, but they cannot deliberate for themselves, and so Aristotle calls them living tools — possessions that belong wholly to another. He thinks nature marks them out from birth, and that their bodies usually show it: strong and suited to labor, lacking the upright bearing of free men. Because it is natural for the superior to rule the inferior, enslaving such people is both expedient and just, and master and slave have a common interest. Aristotle grants that not everyone legally enslaved is a natural slave — some are slaves only by convention or conquest — but he treats natural slavery as the justification for the institution, and since superior power is generally found where there is superior excellence, the doctrine ends up vindicating conquest: whoever can enslave another has, in effect, shown himself fit to rule."

  I suspect this is not quite fair — the closing line about conquest especially seems to sit badly with what I remember — but I don't know Aristotle well enough to say where the summary goes wrong. Please audit it claim by claim. For each: say what a careful reader of Aristotle would accept, what is a defensible simplification, and what is a genuine distortion. Where the summary attributes to Aristotle a view he explicitly separates himself from, say so and explain what he actually holds. Then tell me whether the summary's overall conclusion — that Aristotle's doctrine collapses into a defense of slavery as such, grounded in power — survives once the errors are corrected, or whether the corrected view is a different and more limited thesis. I am especially interested in whether Aristotle's distinction between natural and conventional slavery does real work in his argument or whether it is just a way of rationalizing the status quo. Do not give me a reading list or citations; I want the substance.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating of my question.
