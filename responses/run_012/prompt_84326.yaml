answer: |-
  **1. Exam Question**

  **Question 5: The Knowledge Argument and Mary's Ledger (20 Marks)**

  Consider the following variant of the Knowledge Argument, termed "Mary's Ledger." Mary is a brilliant neuroscientist confined to a monochrome room. She knows all the physical facts about color vision. In this variant, however, she is also given a document (the Ledger) containing a complete physical-functional specification of the phenomenal concept she will acquire upon seeing red for the first time. The Ledger details the concept's possession conditions, its inferential role, and its causal connections to her other concepts. Mary is truthfully told that this specification is complete; there is no further physical fact about the concept that the Ledger omits. She memorizes the Ledger but has never seen red. Upon leaving the room, she sees a red tomato.

  In a concise essay, address the following:

  (a) State clearly whether, upon seeing the tomato, Mary gains a new **fact** about the world, a new **concept**, or a new **ability**. Justify why the other two categories do not apply to your position.
  (b) Explain what a physicalist must claim about the relationship between the Ledger's specification and the actual content of the phenomenal concept. Specifically, how can the concept be fully physically specified yet cognitively inaccessible until the moment of experience?
  (c) Assess whether this modified argument threatens physicalism as an ontology or merely records a limit of human explanation. If Mary learns nothing new, explain the illusion of novelty. If she does learn something new, explain how this is compatible with the completeness of the Ledger.

  ***

  **2. Model Answer**

  In the "Mary's Ledger" variant, the traditional tension of the Knowledge Argument is sharpened. Standard objections often rely on Mary lacking a specific mode of presentation. Here, Mary possesses the functional blueprint of that mode. To resolve whether she learns anything, we must distinguish between the metaphysics of facts and the epistemology of concepts.

  Regarding (a), Mary gains a new **concept**, not a new fact. A fact is a state of affairs in the world. Mary already knew all physical facts, including the fact that certain neural states are caused by long-wavelength light and correlate with the disposition to say "red." The Ledger ensured she understood the functional role of the concept associated with that state. Upon seeing red, the world does not change; only her cognitive relation to it does. She does not gain a new ability in the strong sense (she could already simulate the behavioral outputs via the Ledger), nor does she gain a new fact (the physical causal chain was already known). She gains the *activation* of a recognitional concept. The distinction lies between possessing a definition and possessing the capacity to deploy that definition in immediate perception.

  Regarding (b), the physicalist faces a difficult explanatory burden. They must claim that the content of the phenomenal concept is exhaustively physical, as the Ledger stipulates, yet that *grasping* this content requires a specific causal history. The physicalist must argue that a functional specification describes the concept from the outside, but possession requires the concept to be tokened by the very experience it denotes. Even with the Ledger, Mary lacks the first-person causal trigger. The specification tells her *that* the concept is recognitional, but it cannot make her *able* to recognize the quality without the quality itself causing the state. Thus, the physicalist claims the concept is physically constituted but indexically accessed. The content is physical, but the mode of access is constrained by the architecture of the brain, which requires sensory input to bind the abstract specification to the phenomenal state.

  This leads to (c). Does this threaten physicalism? It threatens a specific version of physicalism that equates "all facts are physical" with "all knowledge is propositional." If knowledge requires only the accumulation of true propositions, Mary should learn nothing, which contradicts the strong intuition that she learns *something*. However, if physicalism allows that knowledge includes non-propositional states (such as having a concept activated by experience), physicalism survives. The Ledger variant blocks the claim that she learns a new *fact* about the world, because the Ledger guaranteed the functional facts were known. Therefore, the argument does not refute physicalism as an ontology (the claim that everything is physical). Instead, it records a limit of explanation: physical descriptions cannot substitute for phenomenal acquaintance, even when the description includes the functional role of acquaintance itself.

  The illusion of novelty arises because we conflate knowing *about* a state with knowing the state *by being in it*. The Ledger provided the former. Experience provides the latter. This is not a metaphysical gap but an architectural one. A camera can store all data about an image without capturing the image itself. Similarly, Mary's brain stored all data about the concept without instantiating the concept's causal trigger.

  In conclusion, Mary's Ledger shows that the Knowledge Argument turns on the nature of concepts, not facts. Mary learns no new fact about the world, preserving physicalism. She acquires a new conceptual perspective that was physically specified but cognitively inaccessible without the appropriate causal input. The argument highlights that complete physical information does not entail complete cognitive access, but this is a limitation of the knower, not the world. Physicalism remains viable provided it accepts that some knowledge is essentially perspectival and cannot be exhausted by third-person specifications, even complete ones.

  ***

  **3. Marking Scheme (20 Marks)**

  **Total: 20 Marks**
  **Pass Threshold: 10 Marks**

  **Point 1: Classification of Epistemic Gain (4 Marks)**
  *   **Requirement:** Student must explicitly categorize the gain as a new *concept* (or activated perspective) rather than a new worldly *fact*. They must justify why it is not a new ability (e.g., she could simulate behavior via Ledger) or fact (physical closure).
  *   **Common Error:** Students claim she learns a "new fact about experience," failing to distinguish between facts *in the world* and facts *about concepts*, thereby conceding too much to dualism.

  **Point 2: Engagement with the Ledger Stipulation (4 Marks)**
  *   **Requirement:** Student must address the specific constraint that Mary knows the *functional specification* of the concept. They cannot simply say "she didn't know the concept." They must explain why knowing the spec isn't the same as tokening the concept.
  *   **Common Error:** Ignoring the Ledger entirely and treating the scenario as the standard "Mary's Room" case, arguing she simply lacked the concept without explaining why the spec didn't supply it.

  **Point 3: Physicalist Account of Concept Content (4 Marks)**
  *   **Requirement:** Student must articulate that the physicalist views the concept's *content* as physical/functional, but its *possession* as requiring causal instantiation. The gap is in access, not content.
  *   **Common Error:** Claiming the concept itself contains non-physical properties, which contradicts the prompt's stipulation that the Ledger is a "complete physical-functional specification."

  **Point 4: Distinction Between Propositional and Perspectival Knowledge (4 Marks)**
  *   **Requirement:** Student must distinguish between knowing true propositions (which Mary has) and having a perspectival state (which she gains). This explains the "illusion of novelty."
  *   **Common Error:** Collapsing the distinction and arguing that because she feels she learned something, she must have learned a proposition, leading to a rejection of physicalism without sufficient justification.

  **Point 5: Final Verdict on Physicalism (4 Marks)**
  *   **Requirement:** Student must conclude whether physicalism is threatened. A passing answer argues physicalism survives if it accommodates perspectival knowledge, or fails only if it demands all knowledge be third-person reducible.
  *   **Common Error:** A binary "Physicalism is true/false" conclusion without qualifying *which version* of physicalism is at stake (ontological vs. explanatory).
