          *   If she learns a new *concept* but no new *fact*, the physicalist must explain how a concept can be fully specified physically yet remain cognitively inaccessible until experience. This challenges the "Phenomenal Concept Strategy" because usually, that strategy relies on the concept being *recognitional* or *indexical* in a way that can't be fully grasped third-personally. But the Ledger says she *has* the specification of that very mode of presentation.
