  ### Leaf Descriptions

  **Leaf 1: Pluralist Realism**
  *   **Position:** Some categories (lesions) are real illnesses regardless of harm; others (hallucinations) require harm to count.
  *   **Awkward Commitment:** You must defend a principled distinction between two neural anomalies where only one counts as disease, despite similar biology.
  *   **Hidden Evaluative Premise:** *Harm is a necessary component of illness, except when the biology is obvious enough to override it.*

  **Leaf 2: Biomedical Realism**
  *   **Position:** Mental illness is a literal bodily disease; neural atypicality is sufficient for diagnosis regardless of distress or function.
  *   **Awkward Commitment:** You must classify a happy, high-functioning hallucinator as 'ill' in the same sense as a cancer patient, potentially medicalising mere difference.
  *   **Hidden Evaluative Premise:** *Statistical biological typicality is the sole arbiter of health, superseding subjective well-being.*

  **Leaf 3: Unoccupied (Biological Anomaly without Illness)**
  *   **Position:** The lesion is a physical defect, but the hallucinations are not, yet neither constitutes 'mental illness' without harm.
  *   **Awkward Commitment:** You admit to physical brain pathology but deny it is an illness, leaving you without a vocabulary to offer care for the lesion man.
  *   **Hidden Evaluative Premise:** *'Illness' is a purely social status that cannot attach to physical facts alone.* (Note: This combination is coherent but rarely defended, as most who deny the hallucination case also deny the lesion case is 'mental' illness).

  **Leaf 4: Phenomenological Realism**
  *   **Position:** Illness is defined by internal suffering and failure of self-regulation, independent of social function.
  *   **Awkward Commitment:** You must classify the high-functioning distressed person as ill, potentially pathologising valid existential pain or genius-level intensity.
  *   **Hidden Evaluative Premise:** *The first-person experience of suffering is more ontologically real than third-party observation of behaviour.*

  **Leaf 5: Social Constructionism (Strong)**
  *   **Position:** Diagnostic categories are reflections of social timetables and power dynamics, not internal states.
  *   **Awkward Commitment:** You must deny that the grieving woman is suffering from anything internal, even if she begs for help to stop the pain.
  *   **Hidden Evaluative Premise:** *All deviations from norms are political impositions rather than biological or psychological facts.*

  **Leaf 6: Evolutionary Dysfunction (Wakefield-esque)**
  *   **Position:** Illness requires a failure of a mental mechanism designed by evolution to operate in a specific way.
  *   **Awkward Commitment:** You must accept that if a punished preference (e.g. historical homosexuality) were a 'designed' function, it could not be an illness, tying pathology to speculative evolutionary history.
  *   **Hidden Evaluative Premise:** *Nature (evolution) provides a value-free standard for function that culture cannot override.*

  **Leaf 7: Strict Szaszian (Myth)**
  *   **Position:** Mental illness is a category error; there are only problems in living and physical brain diseases.
  *   **Awkward Commitment:** You must deny care or legitimacy to the child with unmanageable behaviour unless a physical lesion is found, potentially abandoning them to failure.
  *   **Hidden Evaluative Premise:** *Responsibility and agency are absolute; no psychological state can mitigate them without a physical cause.*

  **Leaf 8: Critical Psychiatry / Abolitionist**
  *   **Position:** Diagnosis is primarily a tool of social control; categories and coercive clinics should be abolished.
  *   **Awkward Commitment:** You must oppose involuntary intervention even in severe addiction cases where the subject requests restraint, prioritising liberty over safety.
  *   **Hidden Evaluative Premise:** *State power is inherently more dangerous than the untreated symptoms of mental distress.*

  **Leaf 9: Reformist (Diagnostic Retention)**
  *   **Position:** Categories are imperfect but necessary; false positives should be reduced by refining criteria, not discarding labels.
  *   **Awkward Commitment:** You must continue using labels you admit generate false positives, knowing some will be stigmatised incorrectly for the sake of those who are not.
  *   **Hidden Evaluative Premise:** *The utility of the system for the majority outweighs the injustice done to the misclassified minority.*

  **Leaf 10: Instrumentalist (Pragmatic Abolitionist)**
  *   **Position:** The 'illness' category is false, but clinics provide necessary aid; keep the help, drop the ontology.
  *   **Awkward Commitment:** You must fund and staff clinics while telling patients they are not 'ill', creating a confusing double-bind about the nature of their suffering.
  *   **Hidden Evaluative Premise:** *Compassionate care does not require truth; useful fictions are justified by relief of suffering.*

