  **Instructions:** Begin at Node 1. Answer the question based on your intuition regarding the specific case presented. Follow the branch corresponding to your answer until you reach a leaf.

  **Node 1:** Consider the man whose apathy traces to a visible brain lesion. If he reports no subjective distress and causes no harm to others, would you classify him as mentally ill?
