          *   **Core Idea:** "Better than" is vague. There is no sharp cutoff, but there is a "zone of indeterminacy."
          *   **Prediction:** Judgments in the middle are neither true nor false, or truth depends on precisification.
          *   **Implication:** Don't trust pairwise comparisons in the zone. Look at the global picture.
          *   **Weakness:** Doesn't tell you what to *do* in the moment.

      *   *Diagnosis 4: The "Small Difference" / Lexical View (Parfit/Quinn).*
          *   **Core Idea:** Small differences *do* matter cumulatively, even if individually negligible. There is a "continuum of value."
