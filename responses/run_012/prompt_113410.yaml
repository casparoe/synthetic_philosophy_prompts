answer: |-
  This is a classic instantiation of the Sorites Paradox applied to rational choice, often discussed in the context of "imprecise preferences" or "semi-orders." As a philosopher of value, I recognize the tension you feel: your phenomenological reports (what you experience) seem honest, yet your friend's logical critique (the money pump) suggests you are vulnerable to exploitation.

  Before I offer my diagnosis and advice, let us brainstorm the three main ways a theorist might dissect this situation, noting what each predicts about your judgments and your vulnerability.

  **Diagnosis 1: The Classical Transitivity View (Your Friend's View)**
  This view holds that rational preference must be transitive: if $A$ is no worse than $B$, and $B$ is no worse than $C$, then $A$ must be no worse than $C$.
  *   **Prediction:** One of your judgments is objectively false. Either there *is* a value difference between neighbors that you are failing to detect (you are insensitive), or there is *no* value difference between 1 and 15 (you are hallucinating a difference).
  *   **Implication:** To be rational, you must sharpen your discrimination until you find a "just noticeable difference" and treat steps smaller than that as strictly identical.

  **Diagnosis 2: The Intransitive Indifference View (Luce's Semi-Orders)**
  This view argues that "indifference" or "no worse than" is not transitive in perceptual contexts. $A$ can be indistinguishable from $B$, and $B$ from $C$, without $A$ being indistinguishable from $C$.
  *   **Prediction:** Your judgments are all phenomenologically true, but they do not form a linear ranking. The structure of your preferences is a "semi-order."
  *   **Implication:** The money pump is a real threat, but it arises because you are treating "indistinguishable" as "equally good." You can block the pump by refusing to trade on differences you cannot discern, even if a gradient likely exists.

  **Diagnosis 3: The Vagueness/Threshold View (Supervaluationism)**
  This view suggests that "better than" is a vague predicate. There is no fact of the matter about the neighboring pairs, only about the extremes.
  *   **Prediction:** Statements about neighbors (1 vs 2) are neither true nor false; they fall in a "penumbra." Only the comparison of 1 vs 15 is truth-apt.
  *   **Implication:** You should ignore the local comparisons entirely and base your choice solely on the global comparison, perhaps selecting a "safe zone" rather than a specific point.

  ***

  **The Verdict**

  I find **Diagnosis 2 (Intransitive Indifference with Deliberative Policy)** the most defensible, though it requires a specific repair to your decision procedure to avoid your friend's money pump.

  Your friend is right that your *set of judgments* cannot function as a transitive ranking for the purposes of maximization. However, he is wrong to conclude that one of your experiential judgments must be *false*. Your report that 1 and 2 are indistinguishable is a truth about your perceptual limits, not a falsehood about value. The error lies in assuming that "I cannot tell them apart" entails "They are of equal value." In value theory, we must distinguish between **axiological equality** (they are the same) and **epistemic indiscriminability** (I can't tell the difference).

  If you treat indiscriminability as equality, you invite the money pump. If you treat it as a threshold of *practical* indifference, you remain safe. Here is how you should resolve the specific questions you raised.

  **1. Is your friend right that one judgment must be false?**
  No. Your judgments are accurate reports of your experience and your global preference. The fault is not in the truth of the judgments, but in the **logic you are applying to them**. You are attempting to force a transitive structure (a linear ranking) onto a non-transitive reality (perceptual thresholds). The judgment "1 is better than 15" is true. The judgment "1 is no worse than 2" is true *relative to your capacity to discriminate*. The contradiction arises only if you assume "no worse than" is transitive across a chain of indiscriminable items. It is not.

  **2. What should you say instead of "just as good"?**
  You should stop saying neighboring settings are "just as good" or "equally valuable." That phrasing commits you to transitivity. Instead, say they are **"not discernibly different."**
  This repair works because it decouples value from discrimination. It allows for the possibility that 2 is *actually* slightly better than 1 (consistent with 15 being worse than 1), even if you cannot feel it. By acknowledging the difference is below your threshold of concern, you remove the normative force that would compel you to pay to switch. If the difference doesn't matter to you, you won't pay to capture it.

  **3. What should you do in the showroom? Is there a defensible procedure?**
  Yes. You should adopt a **"Clumping" or "Satisficing" Policy**.
  Do not try to choose by walking up the ladder one step at a time. That method invites the money pump. Instead:
  1.  **Anchor Globally:** Use your clear judgment that 1 is better than 15 to establish a "Zone of Acceptability." Perhaps settings 1 through 5 are all "comfortably soft," and 10 through 15 are "uncomfortably firm."
  2.  **Impose Coarse-Graining:** Treat settings 1 through 5 as a single cluster. Within this cluster, declare by policy that you are indifferent, regardless of whether a microscopic difference exists.
  3.  **Choose by Secondary Criteria:** Once you have identified the cluster (e.g., 1–5), choose the cheapest option in that cluster, or the one available for immediate delivery.

  This procedure respects your global judgment (1 is better than 15) without forcing you to make false local discriminations. It blocks the money pump because the salesman cannot induce you to pay to move from 1 to 2; you have defined them as members of the same choice-cluster.

  **4. General Lesson: Do "better than" judgments fail to rank?**
  This episode shows that "better than" and "no worse than" do not always generate a **weak order** (a complete, transitive ranking). In contexts involving perceptual thresholds or vague predicates, they generate a **semi-order**.
  The general lesson is that rationality is not just about having consistent inputs; it is about **managing the structure of those inputs**. When the world presents us with continua (like firmness, brightness, or warmth), our cognitive apparatus imposes buckets. Rational deliberation requires us to respect the limits of those buckets. We are not irrational for having intransitive indifference; we would be irrational for *acting* as if that indifference allowed for infinite substitution.

  **5. Would the answer change with finer increments, longer scales, or money?**
  *   **Finer Increments/Longer Scale:** This makes the problem *worse* for the Classical View (Diagnosis 1) because it becomes even more implausible that you could detect a difference between neighbors. It strengthens the case for the Semi-Order view.
  *   **Money vs. Comfort:** If money is introduced as a trade-off (e.g., "Setting 2 costs $10 more than Setting 1"), the Sorites chain often breaks naturally. At some point, the cost outweighs the imperceptible gain. However, if the cost per step is tiny (the "money pump" scenario), the Clumping Policy is essential. You must decide that "within the Soft Cluster, I will not pay extra for firmness adjustments."
  *   **Opposing Directions:** If comfort pulls one way and health (e.g., back support) pulls another, you may face **incomparability** rather than indiscriminability. That is a deeper problem. But in your mattress case, it is purely a threshold problem.

  **Summary Advice**
  Your friend is a good logician but a poor phenomenologist. He assumes that because the logic of ranking breaks down, your experience must be lying. It is not. Your experience is revealing the graininess of human perception.

  Do not try to find the "perfect" mattress by comparing neighbors. You cannot do it. Instead, find the **range** of mattresses that feel globally distinct from the ones you hate (the 15s), and within that range, let price or availability decide. By refusing to acknowledge the normative significance of differences you cannot perceive, you protect yourself from the pump while honoring the truth that 1 is better than 15. Rationality, in this context, is not about perfect discrimination; it is about knowing when to stop looking.
