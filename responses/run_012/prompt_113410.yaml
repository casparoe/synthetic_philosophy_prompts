      *   *Diagnosis 2: Intransitivity of Indifference (Luce's Semi-orders).*
          *   **Core Idea:** Indifference is not transitive. $A \sim B$ and $B \sim C$ does not imply $A \sim C$. "No worse than" is not a weak order.
          *   **Prediction:** The user's judgments are consistent *as stated*, but they don't form a linear ranking. The structure is a "semi-order."
