answer: |-
  Dear friend,

  You have put your finger on exactly the right pressure point in David Lewis's theory. It is one thing to describe how a convention holds steady once it is established, and quite another to explain how it moves, especially when it moves against the stated preferences of the people involved. The case of Sweden in 1967, known as Dagen H, is a fantastic stress test for the idea that conventions are merely self-enforcing equilibria based on mutual expectations. Let us walk through your worries one by one and see where Lewis stands firm and where he might need shoring up.

  First, we should ask whether left-hand driving in Sweden before the switch was a convention in Lewis's sense. If we take his conditions one at a time, it fits surprisingly well. There was a regularity in behavior, as everyone drove on the left. There was common knowledge, because everyone knew everyone else drove on the left. There was a conditional preference, because every driver preferred to drive on the left given that everyone else was doing so, since the alternative was a head-on collision. The sticking point is your observation about arbitrariness. Lewis insists that a convention must be arbitrary, meaning there is another regularity that would have worked just as well. You noted that right-hand driving was arguably better because the neighbors did it and the cars were built for it. However, Lewis would likely argue that arbitrariness is about the coordination problem itself, not the global optimality of the solution. Locally, within Sweden, left-hand driving solved the coordination problem of not hitting each other. The fact that another solution might have yielded higher overall utility due to trade or car manufacturing does not stop the existing solution from being a convention. It was a suboptimal equilibrium, but an equilibrium nonetheless. So, before 1967, Sweden did have a Lewisian convention.

  Your real puzzle is about the switch. You argue that if expectations prop up the convention, it should be nearly impossible to shift. This assumes that expectations are static, but Lewis's theory relies on common knowledge, and common knowledge can be changed by a public signal. The Swedish government did not just pass a law threatening fines; they orchestrated a massive change in common knowledge. By setting a specific date and time, and broadcasting it endlessly, they created a new focal point. Before the switch, if you decided to drive on the right on a random Tuesday, you would crash. But if you know with near certainty that everyone else has been told to switch on Sunday morning, your expectation changes. The law did not merely coerce behavior through punishment; it coordinated expectations. It assured every driver that everyone else would be on the right side come Monday. In this sense, the law was not replacing the convention with a rule, but rather acting as a mechanism to jump from one equilibrium to another. Lewis does not spend much time on how equilibria shift, but this case suggests that authority can serve as a device to generate the common knowledge required for a new convention to take hold.

  This leads to your question about whether the law was doing the coordinating or just making the new expectation common knowledge. The answer is likely both, but the expectation part is the crucial one for Lewis. If the law had only threatened punishment without successfully convincing people that everyone else would switch, it would have failed. People would have feared being the only ones on the right side. The massive campaign, the painted lines, the media blitz, all of this was about ensuring that the expectation of others' behavior was common knowledge. The fines were a backup, but the coordination was achieved through the shared understanding that the switch was happening. This actually confirms Lewis's insight that the expectation is the engine, even if the state provided the fuel.

  However, you are quite right to point out the material constraints, the bus doors and the tram rails. Lewis treats convention as a matter of behavior and psychology, but your example shows that conventions get welded into physical reality. The cost of cutting new doors into buses is not a matter of expectation; it is a sunk cost that resists change. This is a genuine gap in Lewis's theory. He treats the payoffs as preferences in the minds of agents, but he does not fully account for how conventions become embedded in infrastructure that has its own inertia. The Swedish switch worked partly because they timed it when headlamps were about to become expensive and asymmetric, showing that material factors can align with legal ones to facilitate a shift. But if the trams had been too expensive to scrap, the convention might not have shifted despite the law. Lewis's abstract model does not have a place for the physical stubbornness of the world, which can make a convention much harder to break than mutual expectations alone would suggest.

  Now consider your test about repealing the law. If Sweden repealed the traffic law tomorrow, would everyone switch back to the left? Almost certainly not. The convention has now taken hold. The expectations are once again self-enforcing. If you drive on the left now, you will crash, not because a policeman will fine you, but because everyone else expects you to be on the right. This suggests that the law was indeed scaffolding. It was necessary to build the new convention, but once the structure was up, the scaffolding could be removed without the building collapsing. This supports Lewis's view that conventions are distinct from rules because they are self-enforcing. The rule was the catalyst, but the convention is the stable state. This distinguishes it from a mere command where compliance stops the moment the sanction is removed.

  You also wonder if you are muddling convention with a rule we think we ought to follow. Before the switch, driving on the left was both a law and a convention. After the switch, driving on the right is both. The difference is in the reason for compliance. You comply primarily because you expect others to comply and want to coordinate, not primarily because you fear the fine. The fine is there for the few who might deviate, but the mass compliance is due to the coordination incentive. Lewis allows that laws can create conventions, provided that once the law is in place, the behavior becomes self-enforcing through expectations. The Swedish case shows that a rule can transform into a convention. It starts as a command, but once everyone expects everyone else to obey it for the sake of coordination, it becomes a convention in the Lewisian sense.

  Finally, you ask about the difference between this state-led switch and spontaneous conventions like queuing or escalator standing. Lewis's theory is general enough to cover both, but the mechanism of establishing common knowledge differs. In spontaneous cases, common knowledge emerges through trial and error or salience, like everyone naturally gravitating to the right side of a hallway. In the Swedish case, the state acted as a salience machine. It forced the focal point. This does not falsify Lewis, but it does show that his theory is better at explaining the stability of conventions than the history of their origin. He describes the logic of the situation, not necessarily the sociology of how we get there. Sweden is a lucky case where a strong state could pull off a one-day switch. In a weaker state, or without such comprehensive control over infrastructure and media, such a shift might be impossible, leaving the country stuck in the suboptimal equilibrium. This suggests that while Lewis defines what a convention is, he does not fully explain the political power required to move one.

  So where does this leave the theory? It emerges confirmed in its core claim that expectations sustain the behavior, but it shows a gap regarding the material and political costs of transition. Lewis was right that expectations are the glue, but he underestimated how hard it is to dissolve that glue once it has set into physical infrastructure and habit. The Swedish case shows that a convention can be flipped by authority, but only because the authority successfully manipulated the common knowledge that Lewis identifies as essential. If the people had not believed everyone else would switch, the law would have been just words on paper. The fact that it worked proves that the expectation was the real driver, even if the state was the one who lit the fuse.

  I hope this helps settle some of the unease. You are right to feel that Lewis's picture is somewhat thin when it comes to the heavy lifting of changing a convention, but the Swedish example ultimately reinforces his idea that without the mutual expectation, the behavior would not hold. The law provided the promise of that expectation, but the convention itself is the reality that remains when the promise is kept.

  Yours sincerely,

  A Friend
