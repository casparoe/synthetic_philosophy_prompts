          *   *Strongest Objection:* "It's all just costs in the end." A referee will argue that suppression costs *are* production costs for the faker. If the net payoff structure is identical, the distinction is psychological, not mathematical. The author needs to show the *mathematical/evolutionary* difference, not just the phenomenological one.

  4.  **Synthesize and Structure the Feedback:**
