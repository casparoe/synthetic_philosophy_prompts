          *   *Evaluation:* Yes, distinct. In biology/philosophy, "indexical" (Lock) vs. "hard-to-fake due to physiological leakage" (Leaks) is a real distinction. Locks are about *capacity*; Leaks are about *control*.
          *   *Explanatory Weight:* Yes. Locks don't require evolutionary stability analysis in the same way (physics does the work). Leaks require an analysis of why suppression costs exceed benefit. It matters for modeling.

      *   **Q2: Does "Audits" collapse into "Handicaps"? (Inspector's cost)**
