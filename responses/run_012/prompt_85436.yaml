answer: |-
  You have identified a real, structurally coherent phenomenon. It is not just vibes.

  The name is **Commitment Race**.

  Your friend was right, but your confusion about the term doing "duty for three different things" is justified. The term has suffered semantic drift. In the strict game-theoretic and rationalist sense (Schelling, *The Strategy of Conflict*; later adopted by LessWrong/CFAR circles regarding bargaining), **Commitment Race** refers *specifically* to the dynamic you described: two agents racing to pre-commit to a strategy to force the other to accommodate, resulting in deadlock if both succeed.

  The other two usages you likely encountered are category errors or metaphorical extensions:
  1.  **Capability Race (e.g., AGI Race):** This is a race to accumulate *power* or *capacity*. It is a War of Attrition or an Arms Race.
  2.  **Implementation Race (e.g., "Ship First"):** This is a race to market. It is a First-Mover Advantage scenario.

  Your phenomenon is distinct because it is a race to accumulate *inflexibility*.

  Here is the structural defense of why **Commitment Race** is the correct label, why the alternatives fail, and where your insight about "cheap initiation" refines the standard model.

  ### 1. Why "Commitment Race" and not the neighbors?

  You correctly ruled out War of Attrition, Arms Race, and Cheap Talk. Here is the precise boundary work:

  *   **Vs. Brinkmanship:** Brinkmanship relies on *controlled loss of control*. You make the outcome probabilistic (e.g., "I might slip and we both die"). Your phenomenon relies on *automation*. The outcome is deterministic ("If X happens, Y *will* trigger"). Brinkmanship sells risk; Commitment Race sells certainty.
  *   **Vs. Cheap Talk:** Cheap talk is non-binding because it is costless to say *and* costless to ignore. Your phenomenon is costless to *initiate* but costly to *reverse*. This is the critical distinction. It is **"Costly Reversal Signaling."** Once the press release is out, the reputational cost of retracting it makes it binding. It functions as a commitment, not talk.
  *   **Vs. Standard Pre-commitment:** A single agent pre-committing is a **Commitment Device** (e.g., Ulysses tying himself to the mast). When two agents race to do it to each other, it becomes a **Commitment Race**. The pathology arises from the *interaction* of the commitments, not the commitments themselves.

  ### 2. The "Three Things" Disambiguation

  You noted the term is overloaded. Here is the taxonomy to clean it up:

  1.  **Bargaining Commitment Race (Your Case):** Agents race to bind their own future actions to force the other's hand. *Mechanism:* Inflexibility. *Outcome:* Deadlock/Crash.
  2.  **Capability Race (Common Misuse):** Agents race to build more capacity (AI, nukes, market share). *Mechanism:* Accumulation. *Outcome:* One wins, or mutual destruction via capability use.
  3.  **Acausal Commitment Race (Rationalist Specific):** Agents (often AI) pre-committing in source code to influence simulations of each other. *Mechanism:* Logical correlation. *Outcome:* Bargaining breakdown.

  Your intuition is correct: These are structurally different. The Capability Race is about *who has the bigger stick*. The Commitment Race is about *who has tied their own hands tighter*. You are describing #1.

  ### 3. Your Key Insight: The Cost Structure Inversion

  You identified something the standard literature often glosses over: **The waste scales with how cheap it is to commit.**

  Standard Schelling theory assumes commitments are costly to *make* (burning the bridge). This acts as a filter: only those who truly intend to fight will burn the bridge. It self-limits.

  You are describing a modern variant where commitments are **Cheap to Initiate, Expensive to Reverse.**
  *   **Initiation:** A tweet, a policy memo, a smart contract clause. Near-zero cost.
  *   **Reversal:** Admitting weakness, losing credibility, breaking a "trustless" contract. High cost.

  This creates a **Low-Friction Commitment Trap**. Because the entry barrier is low, actors over-commit. They flood the zone with "red lines" because it costs nothing to draw them. But because the exit barrier is high (reputational ruin), they cannot clear the zone when de-escalation is needed.

  This explains why the problem feels more prevalent now. Digital media and automation have decoupled the *cost of stating a commitment* from the *cost of honoring it*, while keeping the *cost of retracting it* high.

  ### 4. The Legibility Penalty

  Your point about legibility is also structurally sound. In a Commitment Race, the winner is the agent whose commitment is most **verifiable** and **irreversible** to the opponent.

  *   **Complex Resolve:** "We will respond proportionately based on a nuanced assessment of the situation." (High resolve, low legibility).
  *   **Simple Automation:** "If X, then Y." (Variable resolve, high legibility).

  In a race, the Simple Automation wins the *race* (it is believed first), even if the Complex Resolve is the *better strategy*. The mechanism rewards agents who can best simulate a mindless automaton. This is a **Perverse Incentive for Stupidity**. It selects for agents who can most convincingly pretend they have no discretion.

  ### 5. Boundary Cases: What looks like it but isn't

  To ensure conceptual hygiene, here is what falls outside the definition:

  *   **Sincere Hardlining:** If a side sets a red line because they genuinely prefer conflict to the deal, that is not a Commitment Race. That is just incompatible preferences. The Commitment Race requires that *both sides prefer the deal* but end up with conflict due to the mechanism.
  *   **Sequential Bargaining:** If Side A commits, and Side B *accommodates* (yields), the race was won, not lost. The pathology only exists when *both* commit successfully.
  *   **Bluffing:** If one side commits and the other calls the bluff (ignores the commitment), the commitment failed to bind. The Commitment Race requires the commitments to be *credible* (costly to reverse).

  ### 6. Final Verdict

  **Name:** **Commitment Race** (specifically, the **Bargaining Commitment Race**).

  **Definition:** A strategic dynamic where two or more parties, seeking to gain leverage in a negotiation, race to pre-commit to incompatible automatic responses. The commitments are cheap to initiate but costly to reverse, leading to a Pareto-inferior outcome (conflict/no-deal) that neither party actually preferred.

  **Why this name:** It is the canonical term in the game-theoretic canon (Schelling) and the rationalist lineage. The confusion you encountered is due to colloquial drift, not conceptual error.

  **Refinement:** Your observation about the cost structure suggests a specific subtype: **Low-Friction Commitment Race**. This occurs when initiation costs approach zero (digital/automation), removing the self-limiting filter of traditional Schelling commitments.

