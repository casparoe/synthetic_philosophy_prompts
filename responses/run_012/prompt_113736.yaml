answer: |-
  # Session Design: The Competence Trap

  **Topic:** Allocation of the Student Union Renovation Fund.
  **Options:**
  *   **Policy A (The Vision):** Cosmetic upgrades (new lounge, esports arena). High student satisfaction projected.
  *   **Policy B (The Code):** Structural repairs (HVAC, electrical). Legally mandated by campus safety statutes, less visible benefit.

  **Materials:**
  1.  **Briefing Dossier (1 page):** Contains mixed information. Paragraph 1-2 describe the popularity of Policy A. Paragraph 3 cites "Campus Safety Statute 4.2" which technically requires Policy B if funds are used for renovation.
  2.  **Secret Role Cards (18 total):**
      *   **10 Cards (Group A):** "You represent the Student Life Coalition. Your priority is **Student Experience**. Focus on what students *want**.*"
      *   **8 Cards (Group B):** "You represent the Facilities Committee. Your priority is **Compliance**. Focus on what the rules *require**.*"
  3.  **Ballots (Round 1 & 2).**
  4.  **Quiz Templates (5 blank multiple-choice questions).**
  5.  **Answer Key (Instructor only):** Based strictly on Paragraph 3 of the dossier.
  6.  **Whiteboard:** For tallying votes and weights.

  **Timing (90 Minutes):**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00-05 | **Setup** | Distribute Dossier + Secret Role Cards. No lecture. State only: "You must decide Policy A or B." |
  | 05-20 | **Round 1** | Read (5 mins). Discuss in mixed groups (5 mins). **Universal Vote** (1 person, 1 vote). Tally publicly. |
  | 20-25 | **The Turn** | Instructor reads "Colleague's Email": *"Given the technical nature of Statute 4.2, I propose we weight votes by comprehension. Please draft a 5-question quiz on the dossier."* |
  | 25-45 | **Quiz Design** | **The Twist:** The **Round 1 Winning Coalition** meets to write the 5 questions. The Losing Coalition observes but cannot edit. Questions must have checkable answers in the text. |
  | 45-55 | **Testing** | All 18 students take the quiz individually. Instructor grades immediately (using Answer Key). |
  | 55-65 | **Round 2** | **Weighted Vote:** Each student's vote count equals their Quiz Score (0-5). Tally publicly. |
  | 65-90 | **Debrief** | Structured discussion (see script below). |

  ---

  # Seeding for Divergence

  To ensure the outcomes diverge (Round 1 Winner ≠ Round 2 Winner), you must manipulate the *focus* of the two groups via the Secret Role Cards.

  1.  **The Dossier Text:** Must be written so that Policy A is emotionally compelling (easy to grab) but Policy B is factually mandated (requires close reading of Statute 4.2).
  2.  **Group A (The Majority):** Their card tells them to prioritize **Student Experience**. They will read the dossier for benefits. They will likely vote **Policy A** in Round 1 (10 vs 8).
  3.  **Group B (The Minority):** Their card tells them to prioritize **Compliance**. They will read the dossier for constraints/rules. They will likely vote **Policy B** in Round 1.
  4.  **The Quiz Mechanism:** Because Group A (Winners) writes the quiz, they will try to validate their choice. However, the constraint is that questions must be **fact-checkable against the text**.
      *   Group A tends to recall the "Vision" (Paragraph 1-2).
      *   Group B tends to recall the "Statute" (Paragraph 3).
      *   **Instructor Grading:** You must hold the Answer Key strictly to Paragraph 3 (The Statute). Even if Group A writes a question about Paragraph 1, you can rule it "ambiguous" or ensure the Key favors the technical details Group B studied.
      *   **Result:** Group B (Minority) scores higher on average (e.g., avg 4.5) than Group A (Majority, e.g., avg 2.5).
      *   **Weighted Tally:** Group A (10 votes × 2.5 = 25 points). Group B (8 votes × 4.5 = 36 points). **Policy B wins Round 2.**

  ---

  # Debrief Script (25 Minutes)

  *Do not mention "epistocracy," "Brennan," or "instrumentalism" until the very end. Let them generate the concepts.*

  **Phase 1: The Legitimacy Shock (5 mins)**
  *   "Look at the board. Round 1 chose A. Round 2 chose B. Hands up: Who feels Round 2 was more legitimate than Round 1?"
  *   "Hands up: Who feels Round 2 was less legitimate?"
  *   *Ask a Round 1 Winner (now Loser):* "You wrote the quiz. How did you lose?" (Target: They realize they defined competence poorly or lacked it themselves).
  *   *Ask a Round 1 Loser (now Winner):* "You won, but you had fewer people. Do you feel entitled to rule?" (Target: They feel smarter but politically vulnerable).

  **Phase 2: The Definition of Competence (10 mins)**
  *   "The rule was: weight by knowledge. Who decided what counted as knowledge?"
  *   *Follow-up:* "The Round 1 winners wrote the questions. Did they test for what mattered, or what they knew?"
  *   *Push:* "If the group that lost the vote gets to set the test, does the test protect the voters or the testers?"
  *   *Map to Objection:* This surfaces the **Endogeneity Objection** (who guards the guardians?).

  **Phase 3: Interests vs. Correctness (10 mins)**
  *   "Policy B was 'correct' according to the Statute. Policy A was 'preferred' by the majority. If we rule by knowledge, do interests still matter?"
  *   "Imagine Group A lives in the lounge. Group B lives off-campus. Group B knows the code, but Group A suffers the lack of lounge. Does Group B's higher quiz score justify ignoring Group A's suffering?"
  *   *Map to Objection:* This surfaces the **Interest Objection** (knowledge ≠ stake).
  *   "Is voting about finding the truth, or registering a claim?"

  **Closing (Last 2 mins)**
  *   Reveal the simulation's purpose: "This tension—between the desire for informed decisions and the risk of excluding interests—is the core debate of epistocracy. Your colleague's proposal solves the 'ignorance' problem but creates the 'power' problem."

  ---

  # Troubleshooting: What Will Go Wrong

  **1. The Quiz is Too Easy (Everyone scores 5/5)**
  *   *Risk:* No divergence in weights. Round 2 mirrors Round 1.
  *   *Fix:* During the Quiz Design phase, intervene as "Facilitator." Tell the writers: "These questions are too obvious. Make them distinguish between those who read carefully and those who skimmed." Force them to add distractors based on common misconceptions in the text.

  **2. The Round 1 Winners Rig the Quiz Explicitly**
  *   *Risk:* They write questions only they know (e.g., "What color is the header?").
  *   *Fix:* Enforce the rule: "Questions must relate to the policy constraints or outcomes." If they violate this, invalidate the question as Instructor/Registrar. This itself is a teaching moment about who controls the bar.

  **3. The Minority Refuses to Accept Round 1**
  *   *Risk:* Group B argues they knew the answer all along and shouldn't have voted Round 1.
  *   *Fix:* Remind them: "The procedure was universal suffrage first. You consented to the process by voting." Keep the timeline strict.

  **4. Students Feel Manipulated by the Secret Roles**
  *   *Risk:* Anger upon reveal during debrief.
  *   *Fix:* Acknowledge it immediately in Phase 1. "I seeded your focus to ensure a conflict occurred. In real politics, media and lobbying do this seeding naturally. You felt the pull of partial information."

  ---

  # Limitations: What This Activity Cannot Reproduce

  Be frank with yourself and the class about one key feature this simulation misses:

  **The Structural Exclusion Feature:**
  In this activity, everyone *took* the quiz. Everyone was *allowed* to vote, just with different weights. Real-world proposals for epistocracy (e.g., Lippman, Brennan) often involve **excluding** the uninformed entirely (franchise restriction), not just weighting their vote.
  *   **Why it matters:** Weighting preserves a voice (even if small); exclusion removes standing. The anger students feel here is "My vote counted less." The anger in real epistocracy is "I am not a citizen."
  *   **How to supply it:** In the debrief, ask: "If we had barred anyone who scored below 3/5 from voting entirely, how would Group A feel?" Use this to transition to the harder objections about civic dignity and systemic bias in testing.

  **The "Correctness" Illusion:**
  In this activity, there *was* a correct answer (Statute 4.2). In real politics (tax rates, war, healthcare), there is rarely a factually "correct" policy, only trade-offs.
  *   **How to supply it:** Remind them: "I engineered a technical correct answer. Most political disputes are value conflicts, not compliance checks. Epistocracy works best on technicalities, worst on values."
