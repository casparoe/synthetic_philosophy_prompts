prompt: |-
  I teach an upper-level political philosophy seminar (18 students, one 90-minute session) and I need a runnable activity that makes them feel the pull of epistocracy rather than just hear it described. The occasion is real for me: I've been asked to help run a citizens' assembly on a campus policy dispute, and last week a colleague proposed deciding it by a short civics quiz instead of a straight vote. Design a session in which the students first vote on a policy question using a briefing dossier I supply, so that correctness is checkable in the room, and then re-vote under a competence-weighted rule, with the twist that whoever wins the first round writes the quiz for the second, so they run into the endogeneity of "competence" themselves rather than being told about it. Give me the roles, the materials, the timing, and the seeding needed so that the weighted and unweighted outcomes actually diverge, and no lecture up front. Then a debrief that maps what happened onto the standing objections -- that competence isn't the same as voting correctly, that whoever sets the bar is doing the real deciding, and that those excluded still have interests at stake -- without naming any of them beforehand. Say what will predictably go wrong the first time I run it and how to handle it, and be frank about which feature of the case for epistocracy the activity cannot reproduce and that I will have to supply myself. Open with the design itself, no preface or restatement of my question.
