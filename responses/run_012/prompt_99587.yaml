      *   *Refining the "Collapse":* If the tractable horizon is limited to immediate consequences, TRC becomes "Direct Consequentialism." If it includes institutional effects, it becomes "Rule Consequentialism." The danger is that the horizon is *too* convenient.

  10. **Final Polish:** Ensure tone is philosophical, rigorous, and direct. Avoid hedging. Use standard terminology (expected utility, epistemic opacity, longtermism).

      *(Self-Correction during drafting)*: I need to make sure I don't just repeat the standard cluelessness objection. The user *knows* that objection. They are proposing TRC as the *solution*. I need to attack the *solution*, not the original problem. The attack must be: "TRC solves cluelessness by cutting off the leg the theory stands on."

      *Key Insight:* The definition of "tractable" is the weak point. If it's subjective, it's gameable. If it's objective, it's inaccessible. This is a Euthyphro-style dilemma for the horizon.

      *Fatal Flaw Candidate:* The "Systematic Bias in the Residual." If the excluded consequences are not mean-zero noise, TRC is systematically biased. Given complex systems (chaos theory), small actions *can* have massive downstream effects (butterfly effect). If the distribution of those effects is skewed (e.g., extinction is worse than utopia is good), ignoring them is dangerous.

