      *   **My Persona:** A philosopher at the intersection of normative ethics and decision theory. I need to be self-critical, rigorous, and not merely diplomatic.
      *   **The View:** "Tractability-Restricted Consequentialism" (TRC).
          *   *Core Claim:* Rightness is determined *only* by consequences within the "tractable horizon" (effects we can assign non-arbitrary credences to).
          *   *Exclusion:* Effects beyond the horizon are not counted, not even as unknowns with default values.
          *   *Motivation:* Avoids treating ignorance as information; avoids arbitrary cut-offs (like time limits) by using epistemic accessibility as the boundary.
      *   **The Task:** Stress-test the view. Brainstorm attacks, map exposure (decisive vs. awkward vs. lose-sleep-over), identify internal defeaters (unassessable actions, systematic bias, collapse into other theories), check for unfalsifiability, and rank defeaters. Finally, identify the single argument that would change my verdict and where my own reasoning might be wrong.

  2.  **Deconstruct the View (TRC):**
      *   *Strength:* Solves the "cluelessness" objection (Lenman, Greaves) by truncating the evaluative domain. It makes consequentialism action-guiding again.
      *   *Weakness:* It risks severing the link between "right" and "actually good." It risks arbitrariness in defining "tractability." It risks collapsing into rule-utilitarianism or deontology if the "tractable" usually aligns with rules.

  3.  **Brainstorming Lines of Attack:**
      *   *The "Severed Link" Objection:* If an action has terrible long-term consequences (known with high confidence, e.g., nuclear winter) but good short-term ones, TRC might endorse it if the long-term is "beyond the horizon." Wait, if it's *known* with high confidence, is it beyond the horizon? The definition says "effects to which we can attach credences that aren't mere artifacts." If we *know* nuclear winter follows, it's tractable. So the objection needs to be about *systematic bias* in the unknown.
      *   *The "Systematic Bias" Objection:* What if the "unknowable" stuff isn't random noise? What if history shows that certain types of acts (e.g., lying, breaking promises) *tend* to have bad long-term tails, even if we can't calculate the specific utility? TRC ignores this statistical evidence because it's not "tractable" in the specific sense.
      *   *The "Manipulable Horizon" Objection:* Agents can deliberately remain ignorant to shrink the horizon. If I don't think about the future, the horizon shrinks, and I'm judged only on the immediate present. This encourages willful blindness.
      *   *The "Empty Verdict" Objection:* Are there actions where *no* consequences are tractable? (e.g., pressing a button where the mechanism is opaque). TRC cannot assess these. Is that a bug or a feature?
      *   *The "Collapse" Objection:* If the tractable horizon is very short (immediate effects), TRC looks like Act Consequentialism with a time limit. If it includes rules because rules predict tractable outcomes, it looks like Rule Consequentialism. If it respects rights because violating them has unpredictable bad tails, it looks like Deontology.
      *   *The "Unfalsifiability" Objection:* By defining "right" as "maximizes good within the tractable," and defining "tractable" as "what we can assess," is it tautological? No, it's substantive, but it might be immune to empirical refutation.

  4.  **Developing the Strongest Attacks (The "Lose Sleep" Category):**
      *   *Systematic Bias in the Tail:* This is the big one. Cluelessness arguments often assume symmetry (good and bad ripples cancel out). If they don't cancel out (e.g., existential risk), ignoring the tail is catastrophic. TRC says "ignore it because we can't assign credences." But if we have *second-order* knowledge that the tail is risky (even if first-order details are unknown), TRC forces us to ignore that second-order knowledge.
      *   *Willful Ignorance:* If tractability is epistemic, and epistemic states are subject to voluntary control, TRC incentivizes stupidity.
      *   *The "Ought Implies Can" Reversal:* Usually, "ought implies can." Here, "assessment implies knowability." But what if the *only* morally relevant facts are unknowable? Then the action is morally neutral? That seems wrong.

  5.  **Mapping the Exposure:**
      *   *Fatal:* Systematic Bias (The "Long-Tail Risk" problem). If the view mandates ignoring existential risks because they are probabilistically diffuse, it fails as a moral theory.
      *   *Awkward:* Collapse into Rule Consequentialism. (Not fatal, just changes the label).
      *   *Lose Sleep Over:* Willful Ignorance / Epistemic Sandbagging.

  6.  **Refining the "Decisive" Argument:**
      *   The user asked for an action the view *must* assess but *cannot*.
      *   Consider: A "Black Box" action. I press a button. I know *something* happens, but the causal chain is immediately opaque to me. Is *any* consequence tractable? If not, TRC is silent.
      *   Better: The "Predictable Disaster" case. I know that *generally*, doing X leads to disaster, but I can't map the specific causal chain to assign a specific utility number. TRC might say "credences are artifacts," so ignore it. But common sense says "don't do X."

  7.  **Addressing Unfalsifiability:**
      *   Is TRC insulated? Yes, because "tractability" is flexible. If a counter-example arises (e.g., "You ignored a huge risk!"), the defender says "That risk wasn't tractable." This is a moving goalpost. This is a major defect.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the view. It's a standard move (similar to "expected utility with bounded rationality"), but the normative claim is strong.
      *   **Brainstorming Attacks:** Group them logically (Epistemic, Normative, Structural).
      *   **The Map of Exposure:** Categorize by severity (Fatal, Lose Sleep, Irritating).
      *   **The Collapse Question:** Does it become Rule Utilitarianism or Deontology?
      *   **Unfalsifiability:** Address the insulation concern.
      *   **The Verdict Changer:** What would kill the view? (The Systematic Bias argument).
      *   **Self-Critique:** Where might I (the AI philosopher) be wrong?

  9.  **Drafting the Content (Iterative refinement):**
      *   *Refining "Tractability":* The user defines it as "credences that aren't mere artifacts of how we happened to draw the boundaries." This is tricky. It implies objectivity. But epistemic access is subjective. I need to press on the *objective vs. subjective* nature of the horizon.
      *   *The "Cluelessness" Counter:* The original cluelessness argument (Greaves) says we can't know if saving a life is good because the person might become Hitler. TRC says "Ignore the Hitler possibility." The risk is that *most* value might be in the long term (longtermism). If TRC ignores the long term, it might be systematically wrong about value maximization.
      *   *The "Must Assess/Cannot Assess" Challenge:* The user specifically asked for this.
