answer: |-
  This is a sophisticated maneuver. You are essentially proposing a **bounded rationality constraint on the criterion of rightness itself**, rather than merely on the decision procedure. You are arguing that the *truth conditions* for "X is right" depend on epistemic accessibility. This avoids the paralysis of global cluelessness (à la Lenman or Greaves) but risks severing the link between rightness and the good.

  Let's stress-test **Tractability-Restricted Consequentialism (TRC)**. I will adopt the persona of a skeptical colleague who sees the elegance but fears the cost.

  ### I. Brainstorming Lines of Attack

  1.  **The Systematic Bias Objection:** Cluelessness arguments often assume that unknown long-term consequences cancel out (symmetry). If the "tail" of the consequence distribution is not mean-zero—if, for example, existential risks are asymmetrically bad compared to existential utopias are good—then ignoring the intractable horizon systematically biases the agent toward catastrophe. TRC mandates ignoring this bias.
  2.  **The Epistemic Sandbagging Problem:** If the horizon is defined by *our* ability to assign credences, agents can manipulate the horizon. By remaining ignorant or refusing to model the future, an agent shrinks the tractable set, thereby reducing the moral demands on the action. TRC incentivizes willful blindness.
  3.  **The "Empty Verdict" Case:** Are there actions where *no* consequences are tractable? (e.g., pressing a button with an opaque mechanism). If TRC says such actions are morally neutral (since the ledger is blank), it fails to capture the intuition that acting in radical ignorance is itself wrong.
  4.  **The Collapse into Rule Consequentialism:** If the only *tractable* consequences of individual acts are those that conform to general patterns (since specific causal chains are chaotic), then TRC will almost always evaluate acts based on whether they follow rules that *generally* produce good tractable outcomes. It sounds like Act Consequentialism but behaves like Rule Consequentialism.
  5.  **The Precautionary Defeater:** In cases of high stakes and low probability (Pascal's Mugging style, or existential risk), the expected value is driven entirely by the "intractable" tail. TRC truncates this tail, forcing the agent to ignore the very thing that matters most.
  6.  **The Metaphysical Arbitrariness:** You claim this is the "only non-arbitrary stopping point." But epistemic access varies by agent. Does the *same action* have different moral statuses for a genius vs. a novice? If so, TRC is agent-relative in a way that undermines the objective criterion of rightness. If not (if "tractable" means "tractable for an ideal observer"), then we are back to cluelessness because the ideal observer sees the whole chain.

  ### II. Map of Exposure

  Here is the ranking of objections from "merely irritating" to "fatal."

  #### 1. Merely Irritating: The Collapse Objection
  *   **The Charge:** TRC is just Rule Consequentialism in disguise.
  *   **Verdict:** **Awkward, not fatal.** Even if TRC collapses into Rule Consequentialism in practice, that might be a feature, not a bug. If the *only* tractable consequences are rule-following ones, then TRC correctly identifies that act-evaluation is impossible without rules. This changes the label, not the moral output. You can concede this and say, "So much the worse for Act Consequentialism."

  #### 2. Lose Sleep Over: The Epistemic Sandbagging (Willful Ignorance)
  *   **The Charge:** TRC allows agents to shrink their moral responsibility by dulling their epistemic faculties.
  *   **Verdict:** **Dangerous.** You can try to patch this by saying the horizon is what is tractable *for a reasonably diligent agent*, not the specific agent. But this introduces a normative standard ("reasonable diligence") that is external to the consequentialist calculus. You are smuggling in a deontological duty to be informed. If you don't patch it, the view is gameable. If you do patch it, you've admitted that "tractability" isn't the fundamental boundary; "responsibility to know" is.

  #### 3. Decisive: The Systematic Bias / Long-Tail Risk
  *   **The Charge:** This is the one that keeps me up. TRC assumes the intractable is noise. But in complex systems, the intractable is often where the *signal* of catastrophic risk lives.
  *   **Scenario:** Consider a geoengineering project. The immediate, tractable consequences are positive (lower temperatures, saved crops). The long-term, chaotic consequences include potential ecosystem collapse. We cannot assign precise credences to the collapse (it's intractable by your definition). TRC says: "Ignore the collapse risk; it's beyond the horizon. Evaluate only the cooling."
  *   **Why it's fatal:** If the disvalue of the collapse is infinite (or lexicographically superior), and the probability is non-zero but intractable, TRC mandates the action. Standard decision theory (and common sense) says the intractability of the risk *is* a reason for caution. TRC treats epistemic opacity as moral irrelevance. This severs the link between *prudence* and *rightness*. A theory that mandates recklessness in the face of asymmetric ruin is untenable.

  ### III. The "Must Assess / Cannot Assess" Challenge

  You asked for an action the view *must* assess but *cannot*.

  **The Case of the Opaque Lever:**
  Imagine you are in a control room. There are two levers, A and B.
  *   **Status Quo:** Do nothing.
  *   **Action:** Pull Lever A.
  *   **Knowledge:** You know with certainty that pulling Lever A *will* change the state of the world significantly. You also know that the mechanism is chaotic and you possess *zero* capacity to model the outcome (credences are artifacts). However, you know that Lever B is the "off" switch for a potential disaster, but you don't know which lever is which.
  *   **TRC Analysis:** The consequences of pulling A are entirely beyond the tractable horizon. The consequences of doing nothing are tractable (status quo persists).
  *   **The Problem:** TRC assesses "Do Nothing" as having a specific value (0). It assesses "Pull A" as having *no evaluative content* regarding its consequences (ledger is blank).
  *   **The Defeater:** If the ledger is blank, is the act permissible? If yes, TRC permits reckless intervention. If no (if a blank ledger renders the act impermissible), then TRC is no longer purely consequentialist; it has a deontological constraint against acting without tractable predictions.
  *   **Worse:** Suppose the *only* way to save a life is to pull a lever whose downstream effects are intractable. TRC cannot endorse this action based on the life saved if the "life saved" is considered a transient, tractable blip outweighed by the "blank" of the future. Actually, simpler: Suppose the *only* morally relevant effect is in the long term (e.g., founding a institution that lasts 500 years). The immediate effects are neutral. The long-term effects are intractable (too far). TRC verdict: **Indifferent.** Intuition: **Morally Significant.** TRC cannot assess the moral significance of long-term institution building because it defines it away.

  ### IV. Unfalsifiability and Insulation

  You asked if the view is insulated into unfalsifiability. **Yes, it is.**

  The definition of "tractable" is doing all the work.
  *   *Critic:* "Your theory says we should ignore climate change risks because they are complex."
  *   *Defender:* "No, climate risks are tractable enough for our models."
  *   *Critic:* "Your theory says we should ignore existential risk from AI."
  *   *Defender:* "No, those credences are too artifact-heavy, so they are excluded."

  The boundary of the horizon moves to protect the theory from counter-examples. If a consequence is clearly morally relevant, you call it tractable. If it creates a paradox, you call it intractable. This is not a bug of the theory; it is the *shape* of the theory. But in philosophy, a boundary condition that is adjustable *post hoc* is a sign of a degenerating research program.

  To avoid this, you need an **independent criterion of tractability** (e.g., "credences stable under reflection" or "credences agreed upon by experts"). But once you add that, you are no longer doing pure consequentialism; you are relying on an epistemic norm that stands outside the utility calculus.

  ### V. The Verdict and The Changer

  **My Current Verdict:** **Untenable in its strong form.**
  TRC solves the *calculation* problem by sacrificing the *truth* of the moral claim. It tells us what is "right-for-us-to-judge," not what is "right." It conflates the *criterion of rightness* with the *decision procedure*.

  **The Single Argument That Would Change My Verdict:**
  I would be convinced if you could demonstrate that **the intractable tail is provably mean-zero.**
  If you could show (mathematically or metaphysically) that for any action, the sum of the utility of consequences beyond the tractable horizon converges to 0 (or a constant) across all possible worlds, then ignoring them is not just pragmatic; it is *accurate*.
  *   *Why this works:* It removes the "Systematic Bias" objection. If the tail is noise, truncating the signal at the noise floor is the rational thing to do.
  *   *Likelihood:* Extremely low. Chaos theory and value theory suggest asymmetry (ruin is worse than success is good).

  **Where My Reasoning Might Be Wrong (Self-Critique):**
  I am assuming that "Consequentialism" requires the criterion of rightness to track the *actual* good. But perhaps you are arguing for a **Perspectival Consequentialism**.
  *   *My Error:* I might be holding you to an objective standard you explicitly reject. If TRC is a theory about *blameworthiness* or *rational choice* rather than *objective rightness*, the "Systematic Bias" objection loses force. A theory can be "wrong" about the universe but "right" about how agents should navigate it.
  *   *The Pivot:* If you reframe TRC not as "The Good is defined by the Tractable" but as "The Rational is defined by the Tractable," you avoid the charge of severing the link to the Good. You simply admit that the Good is unknowable, so we maximize the Knowable Good.
  *   *The Cost:* This concedes the colleague's point that Consequentialism (as a theory of *the Good*) is paralyzed. You save the decision theory by sacrificing the normative ontology.

  ### VI. Summary of Recommendations

  1.  **Acknowledge the Collapse:** Admit that TRC likely functions as Rule Consequentialism. Don't fight it; use it to stabilize the "tractable" definition (rules make consequences tractable).
  2.  **Fix the Horizon:** You must define "tractable" independently of the agent's current state to avoid Sandbagging. Use "idealized epistemic conditions" but acknowledge this brings back some cluelessness.
  3.  **Address the Asymmetry:** You cannot ignore the Long-Tail Risk. You must incorporate a **Precautionary Principle** into the definition of tractability. If an intractable risk is *potentially* infinite in disvalue, it becomes "tractably relevant" by virtue of its stakes, even if its probability is vague.
  4.  **The Fatal Flaw:** If you cannot account for the **Opaque Lever** case (where the only good effects are intractable), the view is incomplete. You need a meta-rule for acting under radical uncertainty, or you must admit TRC is silent on the most important decisions.

  **Final Word:** Your colleague is right that cluelessness is devastating for *Objective* Consequentialism. You are right that we must act anyway. But TRC risks being a theory of **moral comfort** rather than **moral truth**. It tells us we are doing fine because we aren't looking at the abyss. To survive, it must explain why looking at the abyss doesn't change the moral math.
