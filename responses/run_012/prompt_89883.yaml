      *   **Task:** Preparing for a job talk/seminar (thesis chapter in disguise) in 3 weeks.
      *   **Topic:** Risk-Weighted Expected Utility (REU) for policy appraisal (safety, health) instead of Expected Utility (EU). Proposal: Domain-relative risk functions (health vs. money). Claim: Fits stylised facts better than one-parameter stories.
