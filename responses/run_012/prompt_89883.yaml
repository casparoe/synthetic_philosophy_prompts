      *   *Innovation:* Domain-relative risk functions (health $\neq$ money).
      *   *Application:* Policy appraisal (CBA, safety regs).
      *   *Vulnerabilities:*
          *   Normative status: Is REU rational? (Dynamic inconsistency, sure-thing principle violations).
          *   Identification: Can you separate risk attitude from utility curvature?
