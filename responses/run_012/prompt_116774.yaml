      *   *Who holds the rope?* If it's judges, they are part of the ship, not external. If the majority wants to break the rope, they can (revolutionarily or through packing courts). The "rope" is just paper without shared belief.
      *   *Binding Strangers:* This is the intergenerational sovereignty issue. Ulysses binds *himself*. A constitution binds *grandchildren*. This requires a theory of "The People" as a trans-temporal entity, which is metaphysically shaky.
