answer: |-
  Good evening. It is a privilege to stand before you after a meal that has, I think we can agree, successfully demonstrated the collective competence of our academy's catering committee. There is, apparently, a fact of the matter about the perfect doneness of a scallop, and the majority has tracked it down.

  I say this as a retired experimentalist who has spent the last few years trading particle detectors for political philosophy. It is a humbling transition. In the lab, if my apparatus gave me a result I didn't like, I could check the wiring. In the library, when the arguments contradict, the wiring is inside our heads.

  I know the timing of this address is delicate. Tomorrow, you vote on whether this academy should issue a statement regarding climate intervention research. I will not tell you how to vote. Instead, I want to offer a way to think about what your vote actually *is*.

  We tend to treat all votes as the same mechanical process: count the hands, declare the winner. But I propose we distinguish between two fundamentally different kinds of voting. There is the **measurement vote**, and there is the **decision vote**.

  A measurement vote presupposes that there is a truth out there, independent of us, waiting to be found. We vote to estimate it. Like measuring the mass of a boson, we assume there is a right answer, and we are using our ballots as instruments to reduce the error.

  A decision vote, by contrast, constitutes the outcome. There is no pre-existing truth about whether we *should* build a new facility or endorse a policy. The vote does not discover the will; it creates it.

  The spine of my remarks tonight is a mathematical result known as the Condorcet Jury Theorem. It is a beautiful piece of probability theory, and it applies strictly to measurement votes. It says that if every voter is more likely than not to be correct—say, a competence of fifty-one percent—and if every voter decides independently of the others, then as the group grows larger, the probability that the majority chooses the correct answer approaches one. The crowd becomes wise.

  This is why we trust large collaborations in physics. We assume that while individual errors occur, they are random. They cancel out. The signal remains.

  But tonight, I must be the bearer of bad news about the independence assumption. We are not a random sample of the population. We are a community. We share training, we read the same journals, we attend the same conferences. We share paradigms. This is efficient for science; it allows us to speak a common language. But for the purposes of the Jury Theorem, it is a statistical hazard.

  When our errors are correlated—when we are all biased in the same direction because we learned from the same teachers—the effective sample size shrinks. If a thousand of us vote, but we are all influenced by the same three prominent papers, we are not a thousand independent measurements. We might be ten. The theorem's guarantee evaporates when independence fails. Shared expertise makes us competent, but shared culture makes us correlated.

  Furthermore, the theorem only applies to the aggregation of beliefs, not the aggregation of preferences. It tracks truth, not taste. If we are voting on whether a specific geoengineering technique is physically viable, that is a belief. The theorem has purchase there. But if we are voting on whether the academy *should endorse* it, we are mixing facts with values. We are moving from "is" to "ought." The majority might be right about the physics, but there is no "correct" answer to the policy preference that the theorem can uncover.

  And even if we stick to beliefs, we face the problem of logical consistency. Suppose we vote on three connected propositions: First, that the climate risk is severe. Second, that intervention is effective. Third, that we should support the research. Logically, if the first two are true, the third follows. But majority voting can yield a paradox. The majority might say "Yes" to the risk, "Yes" to the effectiveness, but "No" to the support. The collective judgment becomes inconsistent, even if every individual member is perfectly logical. The group can be irrational even when the members are rational.

  Then there is the matter of sincerity. The Condorcet result assumes we vote for what we believe to be true. But in real institutions, we often vote strategically. We vote to build coalitions, to block factions, or to signal virtue to donors. When a ballot becomes a chess move rather than a measurement, the link between the vote and the truth is severed. A sophisticated vote is often a lie about one's true belief, told for a strategic end. If we lie to the tally, the tally cannot track the truth.

  So, where does this leave us tomorrow?

  The vote on climate intervention is a hybrid. It contains a measurement component—is the science sound?—and a decision component—do we take a public stand? It is fraught with correlation, because we are all part of the same scientific ecosystem. It is vulnerable to logical inconsistency, because the resolution likely bundles facts and recommendations. And it invites strategic voting, because the stakes for the academy's reputation are high.

  I do not say this to paralyze us. The Jury Theorem is not a reason to abandon voting; it is a reason to be humble about what a vote proves. A majority vote is not a divine revelation. It is a signal, noisy and subject to systematic error.

  Therefore, I offer a modest, practical proposal for how this academy should treat its own votes in the future. We should require that the ballot itself declares the nature of the vote.

  Before we count hands, we should state: Is this a measurement vote? If so, we acknowledge the assumption of independence and competence, and we might design the process to protect them—perhaps by soliciting anonymous ballots before discussion, to prevent social influence from correlating our errors.

  Is this a decision vote? If so, we acknowledge that we are not finding truth, but making a choice. We accept responsibility for the outcome without claiming the mantle of scientific discovery.

  Or is it a hybrid? If so, we must explicitly separate the questions. We should vote on the scientific premises separately from the policy conclusions. This protects us from the logical paradoxes I mentioned. It forces us to see if we disagree on the facts, or merely on what to do about them.

  We are scientists. We know that an instrument is only as good as our understanding of its limitations. Our voting procedures are instruments for aggregating our collective judgment. Let us stop treating them as black boxes. Let us be explicit about what we are measuring, and what we are deciding.

  If we do this, we may not always agree. We may not always be right. But we will be honest about the nature of our agreement, and the source of our authority. And in a world that looks to us for clarity, honesty about our uncertainty is the most credible stance we can take.

  Thank you.
