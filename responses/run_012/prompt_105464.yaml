prompt: |-
  I've been reading Berkeley's *Three Dialogues between Hylas and Philonous* (the 1713 one) and hit a stretch right at the start that I can't get my head around. I spent 35 years as a field geologist, so I'm used to arguments where you can go check the rocks, and this kind of word-chopping ties me in knots. Here's the bit:

  PHIL. Pray, Hylas, what do you mean by a SCEPTIC?

  HYL. I mean what all men mean—one that doubts of everything.

  PHIL. He then who entertains no doubts concerning some particular point, with regard to that point cannot be thought a sceptic.

  HYL. I agree with you.

  PHIL. Whether doth doubting consist in embracing the affirmative or negative side of a question?

  HYL. In neither; for whoever understands English cannot but know that DOUBTING signifies a suspense between both.

  PHIL. He then that denies any point, can no more be said to doubt of it, than he who affirmeth it with the same degree of assurance.

  HYL. True.

  PHIL. And, consequently, for such his denial is no more to be esteemed a sceptic than the other.

  HYL. I acknowledge it.

  PHIL. How cometh it to pass then, Hylas, that you pronounce me A SCEPTIC, because I deny what you affirm, to wit, the existence of Matter? Since, for aught you can tell, I am as peremptory in my denial, as you in your affirmation.

  Can you walk me through what Philonous is actually pulling off here? I feel like somethings slippery going on with the word "sceptic," but I can't put my finger on whether he's made a real point or just won a word game. And I'd like to know how much of Berkeley's bigger case for idealism hangs on this little move, versus it being throat-clearing before the main event (the one where you supposedly can't conceive of an unconceived tree).

  Please structure it like this:

  - Plain-English paraphrase (about 150 words): restate the exchange in my kind of language, no jargon.
  - The load-bearing step (about 200 words): what exactly is the move Philonous makes, and is it valid?
  - Hylas's best comeback (about 200 words): the strongest reply Hylas could give here, not a strawman.
  - What this does and doesn't do for the bigger argument (about 150 words): how much does Berkeley actually need this bit?
  - Where I'm still stuck (a few bullets): honest open questions, no need to resolve them.

  No citations or reading lists please — I just want the reasoning.
