  - **Plain-English paraphrase**
  Philonous is setting a trap using definitions. He asks Hylas what a "sceptic" is. Hylas says it's someone who doubts everything. Philonous points out that if you firmly deny something, you aren't doubting it—you've made up your mind. Doubting means hanging in the middle, unsure whether to say yes or no. Denying means saying a firm no. Since Philonous firmly says "matter does not exist," he claims he isn't doubting. He argues Hylas is just calling him a sceptic because he disagrees, not because he's actually unsure. Philonous wants to show he is certain of his view, not confused. He is turning the label around: he isn't the one suspended in doubt; he is the one with a clear position. Hylas agrees to the definitions, not realizing Philonous will use them to claim the high ground of certainty later.

  - **The load-bearing step**
  The move is a semantic reclassification designed to seize the rhetorical high ground. In Berkeley's time, "sceptic" was an insult implying irreligion or instability. Philonous argues that true scepticism is a state of suspense (unable to decide), whereas he has decided: matter is impossible. Therefore, he claims to be more dogmatic (certain) than Hylas. Is it valid? Logically, yes: denial is not suspense. But it's slippery because it ignores the *spirit* of scepticism, which questions common sense. Denying the existence of the external world feels more sceptical to most people than doubting its nature. Philonous is technically correct about the word "doubt," but he is using that technicality to hide the radical nature of his claim. He wants to frame Idealism not as a doubt-filled theory, but as the only certain solution to scepticism. He shifts the debate from "Who doubts more?" to "Who is more consistent?"

  - **Hylas's best comeback**
  Hylas should argue that scepticism isn't just about internal suspense; it's about undermining the foundations of common knowledge. He could say: "You claim certainty, but your certainty denies what every living person believes—that rocks exist without us. A man who says the ground beneath his feet is only an idea is more of a sceptic than a man who questions its composition. You have swapped doubt about matter for certainty about ideas, but you've destroyed the shared world we both walk on. If you deny matter, you deny the standard by which we measure truth. Your 'certainty' is private and uncheckable, whereas my 'affirmation' appeals to public evidence. Calling you a sceptic isn't about your mental state of suspense; it's about the destructive consequence of your denial. You haven't escaped scepticism; you've universalized it by making reality dependent on perception."

  - **What this does and doesn't do for the bigger argument**
  This section is mostly throat-clearing, but necessary throat-clearing. It doesn't prove Idealism; it just prevents Hylas from dismissing Philonous as a nihilist immediately. Berkeley needs to establish that his view offers *more* certainty than materialism, not less. If he accepts the label "sceptic," he loses the religious and philosophical high ground required for his later arguments about God and perception. However, the real heavy lifting happens later with the "conceivability argument" (you can't conceive of an unconceived tree). This opening skirmish just clears the ad hominem attacks so the real metaphysical work can begin. It sets the tone: Philonous is the defender of common sense, Hylas is the confused speculator.

