prompt: |-
  I host a small philosophy podcast and next week's guest works on animal minds and moral status. Her line, which I want to really dig into, is that sentience comes in degrees and moral status should track it, but she measures the degree in a slightly unusual way: not by how intense a creature's pleasures and pains are, but by how many distinct kinds of valenced state it can be in, plus whether those states get temporally integrated, i.e. remembered, anticipated, and woven into anything like a life. She calls the combo a creature's "affective repertoire" — I think she coins the phrase in the paper. So on her view a mouse with a fairly narrow range of pains but real memory and anticipation can outrank a creature with a wider palette of feelings that it can't retain, insects come out low but definately not zero, and thermostats sit at the bottom as the limiting case.

  Can you draft me eight or so interview questions that push on the actual content of this rather than the bio stuff. I want to hit at least: why repertoire rather than intensity, and what work the "distinct kinds" clause is doing that raw intensity couldn't do; what she does with the sorites worry any scalar view faces, since "how much" seems to demand a cutoff somewhere and she's ruled out a natural one; whether the temporal-integration factor sneaks back in a capacity for self-consciousness or narrative selfhood that she says she wants to avoid; and the trade-off question, i.e. whether a low-degree being's serious interest can ever outweigh a high-degree being's trivial one, and if not, what stops the view from licensing things that sound monstrous. Also one question for someone who insists moral status has to be binary because respect isn't the kind of thing that comes in amounts, and one on why the thermostat is a limiting case rather than a very small positive value, because she seems to want it to be exactly zero and I'm not convinced the metric gets her that.

  For each question give me a follow-up keyed to the answer she's most likely to give, the way a good moderator keeps a second move ready. No need to cite anyone, just the questions. Write it out as prose, no headings, no bullet points or bold, just paragraphs, like you'd send in an email.
