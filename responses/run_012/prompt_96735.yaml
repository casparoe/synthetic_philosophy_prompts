  Okay, this "Stickiness across incentive shifts" is strong. Let's build around that.

  Wait, the "Two Towns" case is about *selection*, not just stickiness. Same incentives, different outcomes. So the principle needs two prongs:
  1.  **Divergence:** Same incentives, different behaviors (Two Towns).
  2.  **Persistence:** Different incentives, same behavior (Grandparents).

  Combined: **Culture is the variable that explains behavioral variance when material incentives are held constant.**

  Let's go with that. It's clean.

  *New Cases:*
