answer: |-
  This is a classic debate that boils down to **Materialism vs. Idealism** (or Rational Choice vs. Sociological Institutionalism). Your friend is a reductionist: to him, "culture" is just a label we slap on aggregate individual incentives. You are an emergentist: you see culture as a distinct layer of reality that shapes those incentives.

  Your proposed principle ("Culture counts only when it costs you") is intuitive, but as you noticed, it's too narrow. It defines culture solely as **irrationality**. But culture is also **coordination** and **habit**. If you stick with the "cost" principle, you have to admit that most of human cooperation isn't cultural, which feels wrong.

  Here is a principle that saves the cases you want to keep, clarifies the new ones, and tells you which verdicts to sacrifice.

  ### The Better Principle: "The Counterfactual Filter"

  **Principle:** *Culture is a cause when it predicts behavior that material incentives alone cannot. Specifically, when incentives are held constant but behavior diverges, or when incentives change but behavior persists.*

  This splits your "cost" idea into two stronger prongs:
  1.  **Divergence (The Two Towns Test):** Same incentives, different outcomes.
  2.  **Persistence (The Grandparents Test):** Different incentives, same outcome.

  If you adopt this principle, here is how your cases resolve, what it says about your new questions, and what you have to give up.

  ---

  ### 1. Re-evaluating Your Cases

  **The Grandparents (Persistence)**
  *   **Verdict:** **Keep.**
  *   **Why:** The religious belief (the original incentive) vanished, but the behavior (extreme thrift) remained. A pure rational actor would adjust their saving rate based on current safety nets. The fact that the behavior is "sticky" across generations despite a change in material context proves culture is doing the work.
  *   **Friend's Objection:** He calls it "prudence." Your counter is: Prudence is calibrated to risk. If the behavior is *more* conservative than the risk requires (physically uncomfortable taking loans), it's cultural, not prudent.

  **The Two Towns (Divergence)**
  *   **Verdict:** **Keep.**
  *   **Why:** Laws, industry, and size are identical. Material incentives are the same. Yet, Outcome A (locked bikes) and Outcome B (unlocked bikes) exist. Something *selected* the equilibrium. That selector is culture.
  *   **Friend's Objection:** He says this is "restating the equilibrium." Your counter: An equilibrium is a *state*; culture is the *mechanism* that maintains it. Without the cultural norm, the equilibrium would collapse (someone would steal a bike, trust would break, everyone would lock up).

  **The Family/Business Shame (Costly Signaling)**
  *   **Verdict:** **Keep.**
  *   **Why:** This is the strongest case. Material incentives say "take the money." Culture says "no." The behavior overrides the dominant material incentive.
  *   **Note:** This fits your original "costs you" principle perfectly, but under the new principle, it's just a specific, high-intensity version of **Divergence**.

  **The No-Layoff Company**
  *   **Verdict:** **Drop (Agree with Friend).**
  *   **Why:** You already conceded this. If the market keeps the policy because it's profitable, then profit is the cause, not culture.
  *   **Nuance:** Culture only becomes the cause here if the company *keeps* the no-layoff policy during a downturn when it *threatens* bankruptcy. If they drop it when money gets tight, it was never culture; it was just a branding strategy.

  **The Calvinists (Weber Thesis)**
  *   **Verdict:** **Drop (Agree with Friend).**
  *   **Why:** This is the weakest link in your chain. Historians and economists largely agree with your friend here; it's a "just-so story." Working hard and saving money is profitable regardless of theology. It's hard to prove the theology *caused* the behavior rather than just *justifying* it.
  *   **Strategic Advice:** Let this one go. Clinging to the Calvinist case weakens your position on the Grandparents and Two Towns cases.

  **The Medieval Church (Cousin Marriage)**
  *   **Verdict:** **Keep.**
  *   **Why:** This is **Institutional Culture**. It's a rule that changed the incentive structure itself. Your friend accepts this, and you should too. It shows culture isn't just "values in heads"; it's "rules in the world."

  ---

  ### 2. Handling the New Cases

  You asked how this principle handles cases you haven't thought of. Here is the verdict based on the **Counterfactual Filter**:

  **Case A: A culture that evaporates the second the paycheck changes.**
  *   **Verdict:** **Not Culture.**
  *   **Why:** This fails the Persistence test. If the behavior vanishes immediately when the material incentive shifts, the behavior was never culturally anchored; it was purely transactional. This is a "fair-weather norm."

  **Case B: A norm that is only one generation old.**
  *   **Verdict:** **Proto-Culture.**
  *   **Why:** Time is the test of stickiness. If a norm survives the founding generation (who had the original reason for it) and is adopted by the second generation (who just inherit it), it becomes culture. If it dies with the founders, it was just a policy.
  *   **Example:** A startup works 80-hour weeks because the founder is a maniac. If the second CEO tries to cut hours and everyone quits in protest, it's become culture. If everyone sighs with relief, it was just coercion.

  **Case C: A norm that is expensive for each person but pays off for the group.**
  *   **Verdict:** **The Strongest Culture.**
  *   **Why:** This is the definition of **Altruistic Punishment** or **Group Selection**. If individuals pay a cost to enforce a norm (e.g., shaming a cheater even when it's dangerous), that is culture acting as a survival mechanism for the group. This defeats the "rational actor" model entirely.

  ---

  ### 3. What Your Gut is Committed To

  You are struggling because you are trying to find a definition of culture that satisfies your friend's materialism. **You cannot.**

  Your gut is committed to the idea that **human beings are not purely reactive.** We are interpretive. We don't just respond to the world; we respond to our *map* of the world, and culture draws the map.

  **The Principle to Walk Away With:**
  > **"Culture is causal when it acts as a filter on incentives rather than a reflection of them."**

  **What this forces you to give up:**
  1.  **The Calvinist Case:** You have to admit that sometimes "culture" is just a story people tell to explain why they are doing what is already profitable.
  2.  **The "Cost" Requirement:** You have to admit that culture causes things even when it *helps* you (like the Two Towns trust), not just when it hurts you. Coordination is a causal power.

  **What this secures for you:**
  1.  **The Grandparents:** You can confidently say, "It's not prudence, it's inheritance."
  2.  **The Two Towns:** You can say, "Incentives explain why we lock bikes *once* someone steals; culture explains why no one steals in the first place."
  3.  **The Family Shame:** You can say, "This is values overriding value."

  **Final Advice for the Next Beer:**
  Tell your friend: *"I'm not saying culture is magic. I'm saying it's a technology. It's a tool humans use to solve coordination problems that money can't solve. If two groups have the same money and laws but live differently, the difference is the tool they're using. That tool is culture, and it causes the outcome."*

  If he argues that the "tool" was selected by the market, ask him: *"Who selected the tool before the market existed?"* That's where his logic runs out of road.
