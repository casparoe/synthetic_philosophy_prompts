      *   **Context:** A debate with a friend over beers. The user is confused about their own stance after going through several case studies.
      *   **Goal:** Help the user figure out what their "gut" is committed to by evaluating their cases, their proposed principle, and suggesting a better framework/principle.
      *   **Key Cases Discussed:**
          1.  *Calvinism/Capitalism:* User says Yes (belief -> behavior), Friend says No (just-so story).
          2.  *Grandparents/Thrifty:* User says Yes (behavior persists without belief), Friend says No (prudence/safety net).
          3.  *No-Layoff Company:* User agreed with Friend (No, it's profit-driven).
          4.  *Two Towns (Bikes):* User says Yes (equilibrium selection), Friend says No (just restating equilibrium).
          5.  *Medieval Church/Cousin Marriage:* User says Yes (rule -> structure -> economics), Friend says Yes (only accepts this kind).
          6.  *Family/Business Shame:* User says Yes (costly behavior driven by value).
      *   **User's Proposed Principle:** "Culture counts as a cause only when it costs you." (Costly Signaling/Commitment).
      *   **Problem with Principle:** It excludes the Grandparents case (saving is prudent) and the Two Towns case (honesty pays in honest town). The user *wants* to keep those.
      *   **Questions to Answer:**
          1.  Is the proposed principle good?
          2.  What principle actually fits the cases the user wants to keep?
          3.  What does this imply for new cases (paycheck dependent, one generation, costly individual/group benefit)?
          4.  Which verdicts must be given up?

  2.  **Deconstruct the Debate (Philosophical/Sociological Context):**
      *   This is a classic structure vs. agency, or materialism vs. idealism debate.
      *   The Friend represents a *Materialist/Rational Choice* view: Behavior is driven by incentives (economic, safety, profit). "Culture" is just an epiphenomenon (a shadow cast by real forces).
      *   The User represents an *Idealist/Culturalist* view: Beliefs, norms, and values have independent causal power.
      *   The tension lies in *counterfactuals*. To prove causation, you need to show that if the culture were different, the outcome would be different, *holding incentives constant*.

  3.  **Evaluate the User's Proposed Principle ("Culture counts as a cause only when it costs you"):**
      *   *Strength:* It isolates culture from economic rationality. If I do something that hurts my wallet because of a value, that value is definitely doing work. (Aligns with the *Family/Business Shame* case).
      *   *Weakness:* It's too narrow. It defines culture only as *irrationality* or *sacrifice*. But culture also coordinates behavior to *create* value (Two Towns) or persists as habit even when rational (Grandparents).
      *   *Verdict:* The user is right to feel uneasy. This principle forces them to abandon cases they intuitively feel are cultural.

  4.  **Develop a Better Principle:**
      *   What distinguishes "culture as cause" from "incentives as cause"?
      *   *Idea 1: Persistence.* Culture lasts longer than the original incentive. (Grandparents case).
      *   *Idea 2: Coordination/Equilibrium Selection.* Culture picks one stable outcome among many possible ones. (Two Towns case).
      *   *Idea 3: Internalization.* The motivation comes from inside (shame/pride) rather than outside (money/law).
      *   *Synthesis:* A robust principle needs to capture *autonomy from immediate material incentives*.
      *   *Proposed Principle:* **"Culture is a cause when it constrains or directs behavior in ways that material incentives alone cannot predict or explain, specifically through persistence, coordination, or internalized constraint."**
      *   *Simpler version for the user:* **"Culture causes something when it acts as a filter on incentives, not just a reflection of them."** Or, **"Culture is the script that tells you how to respond to an incentive."**

      *   *Let's try to find a specific philosophical concept:* **Path Dependence** and **Equilibrium Selection**.
      *   *Refined Principle:* **"Culture is causal when it selects between multiple viable strategies or persists after the original rationale vanishes."**
      *   *Why this works:*
          *   *Two Towns:* Multiple viable strategies (lock vs. don't lock). Culture selects one. (Keep).
          *   *Grandparents:* Rationale vanished (safety net/religion), behavior persisted. (Keep).
          *   *Family/Business:* Selects a strategy that *ignores* the dominant material incentive (money). (Keep).
          *   *Calvinism:* Harder. Friend says it's a just-so story. If the behavior (working hard) was already profitable, did culture cause it? Or did it just amplify it? This case might need to be dropped or nuanced.
          *   *No-Layoff Company:* User already agreed with Friend. If the market keeps it, it's profitable. If it persists *despite* market pressure, then it's culture.
          *   *Cousin Marriage:* Rule changed incentives. Friend accepts this. User accepts this.

  5.  **Address the "New Cases":**
      *   *Culture evaporates when paycheck changes:* That's not culture, that's *incentive response*. (Principle filters this out).
      *   *One generation old:* Can be culture if it meets the criteria (persistence isn't the only metric, internalization matters). But "fad" vs "culture" distinction is time-based.
      *   *Costly for individual, pays for group:* This is *Altruistic Punishment* or *Group Selection*. Definitely culture.

  6.  **Drafting the Response:**
      *   **Validate:** Acknowledge the depth of the debate. It's a real sociological puzzle (Weber vs. Marx essentially).
      *   **Critique the "Cost" Principle:** Explain why it's too strict (excludes coordination and habit).
      *   **Propose the "Counterfactual/Filter" Principle:** Culture is the *lens* through which incentives are interpreted.
      *   **Re-evaluate the Cases:**
          *   *Grandparents:* **Keep.** (Persistence beyond rationale).
          *   *Two Towns:* **Keep.** (Equilibrium selection).
          *   *Family/Business:* **Keep.** (Internalized constraint overriding incentive).
          *   *Calvinism:* **Drop/Nuance.** (Hard to disentangle from economic necessity).
          *   *No-Layoff:* **Drop.** (User already conceded).
          *   *Cousin Marriage:* **Keep.** (Institutional culture).
      *   **Answer the "New Cases":**
          *   Paycheck change = Not culture (incentive driven).
          *   One generation = Proto-culture (needs transmission).
          *   Individual cost/Group gain = Strongest case for culture (evolutionary stability).
      *   **Conclusion:** Summarize the gut commitment.

  7.  **Refining the Tone:**
      *   Keep it conversational but analytical (beer talk turned philosophical).
      *   Avoid jargon where possible, or explain it (equilibrium, counterfactual).
      *   Focus on helping the user find *their* stance, not telling them the "truth."

  8.  **Self-Correction/Edge Case Check:**
      *   *Wait, does the Grandparents case really fit?* Friend says it's prudence. User says belief died, behavior stayed. If saving is *always* prudent, then culture isn't needed to explain it. *Correction:* The User's point is the *intensity* of the behavior (physically uncomfortable signing a loan). That intensity exceeds pure prudence. So it fits the "Filter" principle.
      *   *Two Towns:* Friend says "restating equilibrium." User needs to know why that's wrong. Equilibrium is the *result*, culture is the *mechanism* that got you there and keeps you there.
      *   *Calvinism:* This is the Weber thesis. Modern historians largely side with the Friend (it's a just-so story). I should advise the user to let this one go to strengthen their overall position.

  9.  **Final Polish:** Organize into clear sections: The Flaw in the Cost Principle, A Better Principle, The Verdict on Cases, The New Cases, and The Gut Check. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just solve the philosophy but help them identify *their* gut. The prompt asks "What does it say about cases I haven't thought of... and which of my verdicts does it force me to give up?" I need to be prescriptive here based on the logic.

  *Key Insight:* The Friend is a *Reductionist*. The User is an *Emergentist*. The principle needs to bridge that. The best principle is **Counterfactual Stability**. If the incentives changed, would the behavior change? If no -> Culture.

  Let's refine the principle to: **"Culture is causal when it makes behavior sticky across changes in incentives."**
  *   Grandparents: Incentives changed (no religion, maybe better safety net?), behavior sticky. -> Culture.
