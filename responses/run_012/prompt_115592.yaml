      *Okay, ready to write.*

  8.  **Final Polish of the Text:** Ensure the distinction between "outcome endorsement" and "process consent" is clear. Ensure the verification step is concrete (e.g., sample audit).

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm banning the program entirely. The goal is *ethical* implementation. The "Conditions" should be achievable for data teams (e.g., "turn off this variable" is easier than "make it fair").

      *(Check Constraint)*: "Give reasons the insurer's clinical and data teams could actually respond to." -> Avoid abstract philosophy. Use terms like "variable exclusion," "UI labeling," "consent workflow."

