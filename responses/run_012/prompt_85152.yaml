prompt: |-
  Bit of context so you know what vocabulary I actually have. I sit on an animal ethics committee — I'm the welfare-science person, not the philosopher — so my working tools are harm–benefit assessment, severity bands (mild/moderate/severe), species-typical baselines, welfare domains, sentience thresholds, scope decisions. I know that kit inside out. The philosophical literature on brain size and moral status I know only second-hand, and I can't look anything up right now, so please no reading lists or citations, just do the work in the answer.

  Here's what I want. Take the philosophers' debate and restate it, as faithfully as you can, in my vocabulary. As I understand it the positions run something like: moral status comes in degrees and tracks cognitive capacity; or it's a threshold thing that attaches to being a member of a kind rather than to any measurable quantity; or it's about possessing a capacity at all rather than exercising it; and then there's the awkward case of humans whose capacities sit below some animals'. Half the time I also can't tell what's even being measured — absolute brain size, size relative to body, encephalisation, neuron count? I've seen all of them argued, and the within-species and across-species versions of the claim pull in completely different directions.

  So: one position at a time, restate it using my machinery — welfare domains, severity bands, species-typical behaviour, harm–benefit ratios, base rates, scope thresholds. Then the residue report, which is the part I actually care about. What goes through cleanly? What only goes through if you bend it? What can't be said in my vocabulary at all?

  And be explicit about which direction the failure runs. If something of mine won't express in the philosophers' terms, tell me — I suspect we're smuggling in a ranking we can't defend. If something of theirs won't express in mine, tell me whether that's my framework being crude (a decision procedure doing the work of a theory) or their claim being less clear than it looks. Related: I've never been sure what 'morally relevant' is supposed to mean when it isnt just 'predictive of how much a creature can suffer', so if that distinction is doing real work, spell it out for me.

  Last thing, and it's the question I keep dodging on the committee: is our implicit species ranking anything more than brain size with extra steps? Our scope keeps widening anyway — octopuses and lobsters apparenlty count now, insects are next — and I want to know whether that widening is a principled extension of brain-based reasoning or an admission that it never really worked.

  British English please.
