      *   **Topic:** Metaphysics of causation, specifically causation by omission, applied to law and clinical ethics.
      *   **Goal:** Create a list of desiderata (criteria) for an adequate theory of causation by omission.
      *   **Definition of "Adequate":** Precise enough for contested cases, disciplined enough to avoid "everything is a cause" (counterfactual dependence) or "nothing is a cause" (no omission causation).
      *   **Format:** Single JSON object. No text outside JSON. No bibliography/citations/author names.
