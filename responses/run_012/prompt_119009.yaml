  Here is a grade and a set of comments you can use. I have designed this to be defensible if Marcus challenges you, because every point deduction is tied to a specific sentence and a specific theoretical error.

  **Grade: 12/15**

  **Written Comments:**

  **Part (a): Explanation of Positions (8/10 points)**
  *   **Anti-Intentionalism (2.5/3):** You correctly identify that the interview is ignored and the text stands alone. However, in the sentence *"the whole point of their essay is that we shouldnt confuse the poem with the feelings it produces in us,"* you are describing the **Affective Fallacy**, not the Intentional Fallacy. The Intentional Fallacy is about confusing the text with its *origins* (the author's mind), not the reader's feelings. You recover this in the next sentence, but the definition is technically incorrect.
  *   **Actual Intentionalism (3/3):** This paragraph is strong. The sentence *"the interview is decisive and the critics are just wrong about the book"* accurately applies Hirsch's view to the case.
  *   **Hypothetical Intentionalism (2/3):** Your definition is good, but the application slips in this sentence: *"So on this view both the critics' bleak reading and the author's happy reading are legitimate."* Hypothetical Intentionalism argues for the **best** hypothesis based on public evidence, not that all hypotheses are equally legitimate. By calling it a free-for-all, you make it sound like Reader-Response theory. You lost a point here for imprecision.

  **Part (b): Critical Evaluation (4/5 points)**
  *   **Argument:** Choosing Actual Intentionalism as the position under the most pressure is a defensible choice, and your reasoning that it *"has to explain how the author can say something that her own text doesnt seem to support"* is a strong point.
  *   **Justification:** You lose one point on this sentence: *"The other two can just say the text's public meaning wins."* This oversimplifies Hypothetical Intentionalism. If the interview is public context, the Hypothetical Intentionalist can't just ignore it like the Anti-Intentionalist does; they have to weigh it against the text. Your argument holds up for Anti-Intentionalism, but not fully for Hypothetical Intentionalism.

  **Mechanics & Style (0/1 point)**
  *   **Punctuation:** There are missing apostrophes throughout the essay (e.g., *"shouldnt," "arent," "doesnt," "isnt"*). In a formal philosophy essay, these need to be included to distinguish possession/contraction from plural verbs.

  **Summary:**
  You have a solid grasp of the core conflict, especially regarding Actual and Anti-Intentionalism. To improve, focus on the specific definitions of the fallacies (Intentional vs. Affective) and remember that Hypothetical Intentionalism seeks the *optimal* interpretation, not just *any* interpretation.

  ***

  ### How to defend this if he argues:
  *   **If he argues about the "Feelings" comment:** Show him the definition of the Intentional Fallacy in your class notes. It specifically refers to *origins/causes*, whereas "feelings" is the Affective Fallacy (Wimsatt and Beardsley wrote two separate essays on this).
  *   **If he argues about Hypothetical Intentionalism:** Ask him if HI allows *any* guess. It doesn't; it requires an "appropriately informed" reader to find the *most likely* intent. Saying "both are legitimate" removes the criteria for being "informed."
  *   **If he argues about the apostrophes:** Remind him the teacher asked for a formal essay grade. "Doesnt" is texting slang, not academic writing.
