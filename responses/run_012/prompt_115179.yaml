          *   Elena brings up the sheer scale (r-strategists, predation, disease). The "pet" comparison.
          *   Marcus pushes back on the *inference*. Nociception isn't suffering. We are projecting human-like qualia onto fish or insects.
          *   *Check:* Did I include Elena's point (a) and Marcus's point (a)? Yes.

      *   **Round 2: Uncertainty and Action.**
          *   Elena argues we act under uncertainty in medicine (vaccines) and conservation (rewilding). Why not here?
          *   Marcus counters with the *type* of uncertainty. Medical uncertainty is within a known system (human physiology). Ecological uncertainty is systemic complexity. Unintended consequences (burden of proof).
          *   *Check:* Did I include Elena's point (b) and Marcus's point (b)? Yes.

      *   **Round 3: The "Natural" and The "Currency".**
