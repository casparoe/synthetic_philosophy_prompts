      *   **Marcus:** Epistemologically cautious, focused on the *structure* of welfare science. Worried about category errors. Sees action as a potential category violation or massive miscalculation.
      *   **Setting:** A quiet corner of a conference hall or a university office. Let's go with a post-conference coffee. It allows for a relaxed but rigorous tone.

  3.  **Drafting - Section by Section:**

