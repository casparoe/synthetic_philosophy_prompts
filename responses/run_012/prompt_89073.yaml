answer: |-
  # Seminar Game: The Solidarity Bind

  ## Overview
  **Time:** 90 minutes
  **Participants:** 18 students (Workers), 1 Instructor (Employer)
  **Materials:** 200 counters (tokens), 18 decision slips per student, a scoreboard (whiteboard), a collection box.
  **Objective:** Students must navigate three legal regimes to maximise individual tokens, encountering the tension between individual liberty and collective power.

  ## Setup (10 Minutes)
  1.  **Roles:** You (the Instructor) are the **Employer**. The 18 students are **Workers**.
  2.  **Value:** Each round, the Workers produce a total value of **180 tokens** (10 tokens per Worker).
  3.  **Baseline Power:** Without a union, the Employer dictates the split. The Employer keeps 144 tokens; the Workers share 36 tokens (2 tokens each).
  4.  **Union Power:** If a Union is recognised, the split is fixed: Employer keeps 72 tokens; Workers share 108 tokens (6 tokens each).
  5.  **Cost of Organisation:** To sustain the Union, every member must pay **2 tokens** in dues per round.
  6.  **Threshold:** The Union is recognised only if **10 or more Workers** (majority) commit to it.
  7.  **Currency:** Tokens are recorded on the scoreboard. At the end of the session, the top three token holders receive a tangible non-monetary reward (e.g., choice of seminar topic for next week, or a certificate of distinction). This creates stakes without money.

  ## Round 1: The Liberty Trap (20 Minutes)
  **Rule:** **Open Shop.**
  *   Workers vote secretly on whether to join the Union.
  *   Joining costs 2 tokens (deducted from endowment).
  *   **Crucial Rule:** If the Union reaches the threshold (10+ members), the **6-token rate applies to ALL Workers**, regardless of membership. Non-members pay no dues but receive the union wage.
  *   If the Union fails (<10 members), the **Baseline (2 tokens)** applies to all.

  **Procedure:**
  1.  Give each student an endowment slip showing 0 tokens (they earn them during the round).
  2.  Distribute decision slips: "Join" or "Decline".
  3.  Collect slips secretly. Count votes.
  4.  **Predicted Outcome:** Rational actors will decline. If the Union succeeds, a non-member gets 6 tokens; a member gets 4 (6 minus 2 dues). If the Union fails, everyone gets 2. Since any individual vote is unlikely to be pivotal, the dominant strategy is to decline. The Union likely fails. Everyone gets 2 tokens.
  5.  Record results on the board. Do not explain *why* it failed yet.

  ## Round 2: The Exclusion Tool (20 Minutes)
  **Rule:** **Closed Shop (Exclusionary).**
  *   Workers vote secretly on whether to join.
  *   Joining costs 2 tokens.
  *   **Crucial Rule:** If the Union reaches the threshold, the **6-token rate applies ONLY to Members**. Non-members receive the **Baseline (2 tokens)**.
  *   If the Union fails, everyone gets the Baseline (2 tokens).

  **Procedure:**
  1.  Reset endowments.
  2.  Distribute decision slips.
  3.  Collect and count.
  4.  **Predicted Outcome:** The free-rider incentive is removed. To get 6 tokens (net 4), you must join. If you don't, you get 2. Everyone joins. The Union succeeds. Everyone nets 4 tokens.
  5.  **Observation:** Ask students how it felt to be forced into membership to avoid poverty wages. Record the token increase (2 → 4).

  ## Round 3: The Coercive Correction (20 Minutes)
  **Rule:** **Agency Shop (Mandatory Dues).**
  *   **Crucial Rule:** Membership is automatic. All 18 Workers are counted towards the threshold.
  *   **Crucial Rule:** Dues (2 tokens) are automatically deducted from everyone.
  *   **Crucial Rule:** The Union rate (6 tokens) applies to everyone.
  *   Students have no vote. The rule is imposed by the "State" (You).

  **Procedure:**
  1.  Announce the rule change immediately.
  2.  Calculate payoffs: Everyone receives 6 tokens, minus 2 dues = 4 tokens net.
  3.  **Observation:** The outcome is identical to Round 2 (4 tokens net), but the mechanism is pure compulsion. There was no choice to associate or not.
  4.  Ask students to compare the feeling of Round 2 (choice under pressure) vs Round 3 (no choice).

  ## Debrief (20 Minutes)
  Do not lecture. Use the scoreboard data to draw out the concepts.

  1.  **Liberty vs. Capacity (Round 1):**
      *   Ask: "In Round 1, you were free. Why are you poorer?"
      *   Point: A formal liberty to associate is useless against a concentrated counterparty if the benefits of association cannot be restricted to contributors. The "right" existed, but the "power" did not.
      *   Concept: The free-rider problem is not a moral failure of students; it is a structural incentive created by the rule set.

  2.  **The Bind of Coercion (Round 2 & 3):**
      *   Ask: "In Round 2 and 3, you were richer. What was the cost?"
      *   Point: To close the bargaining gap, the collective must bind the individual. In Round 2, through economic exclusion (two-tier workforce). In Round 3, through statutory compulsion (mandatory dues).
      *   Concept: The "coercion" objection is valid (liberty was reduced), but ignoring it ratifies the baseline inequality (Round 1). The right to organise is not a privilege; it is a corrective to the employer's structural advantage.

  3.  **Concentrated vs. Dispersed:**
      *   Highlight your role as Employer. You did not need to vote. Your interest was automatic. The workers had to coordinate to match your inherent cohesion.
      *   Concept: Labour law is not about balancing equals; it is about correcting an imbalance of organisation.

  ## Troubleshooting and Failures
  **1. Students Collude in Round 1:**
  *   *Risk:* They talk before voting and agree all to join, defeating the free-rider trap.
  *   *Fix:* Enforce strict silence during decision-making. If they succeed anyway, praise their solidarity but ask: "Could you sustain this if there were 1,000 workers? Or if talking was forbidden by law?" This highlights that norms work in small groups, but institutions are needed for scale.

  **2. Employer (You) Feels Too Generous:**
  *   *Risk:* You offer 4 tokens baseline out of guilt, blurring the inequality.
  *   *Fix:* Stick rigidly to the 2-token baseline. Write it on the board before the game starts. The injustice must be felt to justify the coercion later.

  **3. Anger at Round 3:**
  *   *Risk:* Students resent the lack of choice in Round 3.
  *   *Fix:* Validate the feeling. "Good. That resentment is the political reality of mandatory dues. The question is whether that resentment is preferable to the poverty of Round 1."

  ## Limitations
  **What the Game Cannot Reproduce:**
  *   **Social Norms:** In reality, workers often join unions due to peer pressure or solidarity, not just cold calculation. The game assumes homo economicus, which exaggerates the Round 1 failure.
  *   **Employer Counter-Strategy:** In reality, employers spend resources to bust unions, not just wait for them to fail. You played a passive employer.
  *   **Long-Term Trust:** One-off games encourage defection. Repeated interaction often builds cooperation.
  *   **Your Task:** In the debrief, you must supply the nuance that law substitutes for trust when scale makes personal solidarity impossible.

  One-line summary: The single design decision that matters most is making the collective benefit non-excludable in the voluntary round, which mathematically guarantees the failure of pure liberty.
