answer: |-
  The setup
  The fatalist argument begins with the principle of bivalence, assuming that every contradictory pair of statements must contain one true and one false member. If the statement "There will be a sea battle tomorrow" is true now, it corresponds to a fact, meaning the future event is already settled. If the event is already settled, it cannot be otherwise, which means it is necessary. Since one of the contradictories must be true, it follows that everything happens by necessity, eliminating chance and rendering human deliberation pointless because the outcome is fixed regardless of our choices.

  Aristotle's move
  Aristotle blocks this by distinguishing between the necessity of the whole disjunction and the necessity of its parts. He agrees it is necessary that *either* there will be a battle *or* there won't be, but he denies that either specific outcome is necessary on its own. To prevent the inference to necessity, he claims that for singular future contingent statements, neither contradictory is definitively true or false yet. In your sealed envelope case, Aristotle would say the prediction lacks a truth value today because the reality it describes is indeterminate; it only becomes true or false once the event occurs, settling the reality it corresponds to.

  Why it's tricky
  The core difficulty is the assumption that truth requires a settled reality. You asked why truth implies necessity; for Aristotle, if a statement is *now* true, the fact must *now* exist in a fixed way, which makes the future event unavoidable. This clashes with the intuition that truth is timeless, where your prediction is simply "waiting" to be verified. Aristotle insists that before the event, the potentiality exists for both outcomes, so asserting definite truth prematurely imposes a necessity that isn't there in the world. This forces us to accept that some statements are neither true nor false, which is logically costly but metaphysically necessary to save contingency.

  My verdict
  Aristotle's solution works logically if you accept his metaphysical view that the future is ontologically open rather than fixed. It successfully blocks fatalism, but at the cost of denying that all statements have a truth value, which clashes with our modern intuition that truth is timeless. Ultimately, it saves human agency by sacrificing the universal applicability of bivalence.
