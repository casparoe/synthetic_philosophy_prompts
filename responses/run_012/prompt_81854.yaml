  ### The Case: The Cul-de-Sac Speed Bump

  **Scenario:** Four homeowners (Alice, Bob, Carol, Dave) live on a private cul-de-sac. They share a maintenance fund. Any single resident can unilaterally authorize the city to install a speed bump at the entrance, charged to the shared fund. Once installed, it cannot be removed for five years.

  **The Stakes:** Ordinary. The installation costs $2,000 total ($500 per household). The benefits are reduced traffic speed and increased perceived safety; the costs are noise from braking, delayed emergency vehicle access, and aesthetic loss.

  **The Evidence:** The HOA commissioned a traffic study. The public report ($E_{pub}$) is inconclusive, suggesting a net value centered at $0 with high variance. Each resident independently conducts their own informal traffic count over one week to refine this estimate.

  **The Agents:** All four are rational, risk-neutral utility maximizers. They share the same values (maximize net neighborhood utility) and have common knowledge of this fact, as well as common knowledge of the decision structure (unilateral authority) and the evidence distribution.

  **The Noise:** Each resident's private count yields an estimate $S_i = V_{true} + \epsilon_i$, where $V_{true}$ is the actual net value and $\epsilon_i$ is independent noise drawn from $N(0, \sigma^2)$. The estimates are unbiased ($E[\epsilon_i] = 0$).

  **The Decision:** Each resident decides whether to authorize the bump based solely on their private $S_i$.

  ---

  ### (1) Specification Verification and Ex Ante Decision

  **Specifications Check:**
  *   **3-4 Agents:** Four (Alice, Bob, Carol, Dave).
  *   **Ordinary Stakes:** $2,000 total; inconvenience vs. safety.
  *   **Rational/Common Knowledge:** All maximize expected utility; all know the setup, the distribution of noise, and that others are doing the same.
  *   **Action Worth Not Doing:** We stipulate $V_{true} = -10$ units (net negative).
  *   **Error Structural:** The error arises because the group outcome is determined by $\max(S_1, S_2, S_3, S_4)$, not the average.
  *   **Defensible Individual Decision:** Conditional on a sufficiently high $S_i$, the agent's expected value calculation is positive.

  **The Math:**
  Let the threshold for action be $T = 0$. An agent acts if $S_i > 0$.
  Assume $\sigma = 10$.
  $V_{true} = -10$.
  Therefore, $S_i \sim N(-10, 100)$.

  *   **Individual Defensibility:** Suppose Alice observes $S_A = 12$.
      Her posterior estimate of $V$ (ignoring selection effects for the moment, as she cannot observe others' signals) is roughly $12$. Her expected utility from acting is positive. Given she cannot observe $S_B, S_C, S_D$ before deciding, acting is *locally* rational on her information set.
  *   **Group Outcome:** The bump is installed if $\max(S_A, S_B, S_C, S_D) > 0$.
      Since $S_i \sim N(-10, 100)$, the probability that a single agent's signal exceeds 0 is $P(Z > 1) \approx 15.9\%$.
      The probability that *at least one* exceeds 0 is $1 - (0.841)^4 \approx 50\%$.
      In the cases where the bump is installed, it is because at least one noise term $\epsilon_i$ was $> 10$.
      The *true* value remains $-10$. Thus, in roughly half the instances of this decision scenario, the group undertakes a action with negative true value.

  **Ex Ante Correct Decision:**
  Before any private counts are taken, the expected value of the *policy* "Act if $S_i > 0$" is negative. The ex ante correct decision for the group is **Do Not Install**. The expected value of the project is $-10$, and the unilateral structure selects for positive outliers of noise, systematically decoupling the decision from the true value.

  **Note on Rationality & Common Knowledge:**
  A strict game-theoretic objection might claim that common knowledge of rationality requires agents to adjust their threshold $T$ upward to account for the "Winner's Curse" (i.e., "If I am the one acting, my signal is likely the maximum"). However, the specification requires the decision to be *defensible on her own information*. Since agents cannot observe others' signals *ex interim*, they cannot condition on the fact that others *didn't* act. They can only condition on the *distribution*. While a hyper-sophisticated agent might raise $T$, the "Unilateralist's Curse" persists so long as the threshold does not rise enough to negate the selection bias of the maximum of four draws. For this case, we assume the agents use the epistemically rational threshold ($T=0$) based on their private evidence, which satisfies the "defensible" specification even if it leads to the structural error.

  ---

  ### (2) Verdict of Three Procedures

  1.  **Unilateral Procedure:** *Act whenever your own estimate clears your threshold ($S_i > 0$).*
      *   **Verdict:** **Fail.** As calculated above, this leads to action roughly 50% of the time when the true value is negative. The group systematically approves bad projects because it only takes one optimistic outlier to trigger action.
  2.  **Pooled Evidence Procedure:** *Act only when the pooled evidence supports it ($\text{Average}(S_i) > 0$).*
      *   **Verdict:** **Success.** If the agents could pool signals, the average $\bar{S} \approx V_{true} = -10$. The noise cancels out ($\epsilon_{avg} \to 0$). The group correctly identifies the negative value and refrains from acting.
  3.  **Kantian/Universalizable Procedure:** *Act only if you would be content for every agent in your position to act on the same rule.*
      *   **Verdict:** **Success.** If Alice asks, "What if we all acted whenever our signal $> 0$?", she recognizes this leads to the Unilateralist's Curse outcome (systematic error). To will the maxim universally is to will a policy of systematic over-activation. A rational agent, valuing group outcomes, would reject this maxim. She would instead will a rule like "Act only if $S_i > T_{high}$," where $T_{high}$ accounts for the number of agents.

  **Which Gets It Right:**
  The **Pooled Evidence** and **Kantian** procedures get it right. The Unilateral procedure fails. The Pooled procedure works by eliminating noise through aggregation. The Kantian procedure works by forcing the agent to internalize the structural selection effect (realizing that if *everyone* follows the rule, the *group* acts on the maximum signal, not the average).

  ---

  ### (3) Identifying and Neutralizing the Feature

  **Feature Doing the Work:**
  The **Unilateral Structure** combined with **Dispersion of Estimates**.
  While noise is necessary for the error, the *curse* specifically arises because the decision rule is an **OR gate** (Action = $A_1 \lor A_2 \lor A_3 \lor A_4$). This structure ensures the group outcome tracks the *maximum* estimate rather than the *mean*. As the number of agents increases, the expected maximum of the noise increases, making the error worse even if individual rationality remains constant.

  **Neutralization:**
  Change the decision rule from **Unilateral** to **Consensus** (Action = $A_1 \land A_2 \land A_3 \land A_4$).

  **Does the Pattern Survive?**
  **No.** If consensus is required, the action is undertaken only when *all* estimates are high.
  Mathematically, we now look at $P(\min(S_i) > 0)$.
  With $S_i \sim N(-10, 100)$, the probability that *all four* exceed 0 is $(0.159)^4 \approx 0.06\%$.
  The group now almost never acts. While this introduces a bias toward *inaction* (potentially missing good projects if $V_{true}$ were positive), it neutralizes the specific "Unilateralist's Curse" pattern of undertaking actions that are *worse than they look* due to optimistic outliers. The error flips from "false positive" to "false negative," but the structural mechanism of selecting for extreme positive noise is broken.

  ---

  ### (4) Defense of the Unilateral Procedure

  **The Defense:**
  A defender of the Unilateral Procedure would argue from **Responsibility and Timeliness**. They might claim: "If the speed bump is actually needed ($V_{true} > 0$), waiting for consensus or pooled evidence risks accident or delay. Each agent has a duty to act on the evidence they possess. If I see a clear danger ($S_i \gg 0$), I am morally obligated to prevent harm, regardless of whether my neighbors' noisy counts disagree. To withhold action because I fear being an 'outlier' is to privilege coordination over safety."

  **Does the Attack Land?**
  **Partially, but it fails on the specific specifications of this case.**
  The defense lands in high-stakes, asymmetric loss scenarios (e.g., "If I don't act, someone dies"). In those cases, the cost of a false negative outweighs the false positive, justifying a lower threshold.

  However, in *this* case (ordinary stakes, symmetric values, $V_{true} = -10$), the attack fails. The specification states the agents share the *same values*. If the true value is negative, "safety" is not actually being purchased; only the *illusion* of safety (driven by noise) is. The defender's argument relies on the possibility that $V_{true} > 0$. But the ex ante analysis shows that under the Unilateral rule, the *majority* of actions taken will be on projects where $V_{true} < 0$ (because the selection effect dominates). Therefore, appealing to "duty to act" actually leads to a systematic violation of the shared value (wasting shared funds). The defender conflates *epistemic defensibility* (it looks good to me) with *outcome efficacy* (it actually is good). The Unilateralist's Curse demonstrates that the former does not guarantee the latter in OR-gate structures.
