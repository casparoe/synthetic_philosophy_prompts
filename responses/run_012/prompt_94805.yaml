answer: |-
  Hey, this is a classic puzzle in moral and legal philosophy, and your mate is using a provocative phrase to point at a real structural problem in how we think about autonomy. The idea that consent is moral magic is essentially the claim that consent has a transformative power, changing the moral quality of an action rather than just forgiving the agent. To give you the menu you asked for, I will walk through the different ways this claim can be cashed out, ranging from the trivial to the radical, and test each one against the pressure points you mentioned like deception, duress, and limits on what can be consented to.

  The first and weakest reading is what we might call the conceptual or descriptive view. On this reading, consent does not change the morality of the act so much as it changes the description of the act itself. When a surgeon cuts you with a scalpel without consent, it is maiming or battery, but when they do it with consent, it is surgery or medical treatment. The physical movements are identical, but the moral category shifts because the action is defined by the context of agreement. This does technically do the work your mate wants, because it says the act is not a wrong at all rather than an excused wrong, but it feels like cheating for the exact reason you suspected. It is almost tautological. It holds up poorly against the pressure points because if the consent is obtained by lying or pressure, the description reverts. If you trick someone into signing, conceptually they did not consent to the actual procedure, so the act remains battery. This view collapses quickly because it relies on valid consent to change the description, so it does not explain why valid consent has power, it just asserts that when it is present, the label changes.

  Moving up the scale, the second reading is the rights waiver view. This is the standard liberal interpretation. Here, the act of cutting skin is prima facie wrong because it violates a right you have over your body. Consent is the mechanism by which you waive that right. Once the right is waived, the act is no longer a violation, so it stops being a wrong. This does the work your mate wants in the sense that it renders the act permissible rather than merely excused. However, it treats consent as removing a barrier rather than transforming the act's intrinsic nature. This view handles the pressure points reasonably well. If consent is obtained by lying or under severe pressure, the waiver is invalid because your will was not truly engaged, so the right remains intact and the act is wrong. It also handles the issue of understanding well, because you cannot waive a right to something you do not comprehend. The limit case is where this view gets tricky. There are some rights, like the right not to be enslaved or killed, that many theories say you cannot waive even if you want to. If you cannot waive the right, consent is not magic there, which suggests the magic has limits imposed by the nature of the rights themselves.

  The third reading is the normative power view, which is likely what your mate has in mind when he uses the word magic. This view, often associated with legal philosophers like HLA Hart, argues that individuals have a specific moral power to change their moral relations with others, similar to how a judge has the power to sentence someone or a promisor has the power to create an obligation. On this reading, consent is an exercise of authority that changes the moral status of the other person's action from forbidden to permitted. This definitely does the work your mate wants. It makes consent constitutive of the act's permissibility. Without the exercise of this power, the act is wrong; with it, the act is right. It is not just a defense; it is a condition of the act's moral identity. However, this view struggles with the pressure points in a specific way. If consent is a power, what happens when the power is misused or triggered by fraud? Usually, the theory says the power was not successfully exercised, so the status does not change. The harder pressure point is the limit case. If consent is a power we hold, why can we not use it to permit someone to enslave us? Proponents of this view usually have to argue that our normative powers are limited by law or morality, meaning we simply do not have the power to consent to certain things. This saves the theory but admits that the magic is not omnipotent.

  The fourth reading is the radical voluntarist view, which is the strongest version of the magic claim. This view holds that the will itself is the source of moral status. If I will something, it becomes morally permissible simply because I willed it. This is the purest form of moral magic. It absolutely does the work your mate wants, perhaps too well. It makes the internal mental state the sole determinant of the external act's morality. However, this view collapses almost immediately under the pressure points. If consent is just about the will, then lying is problematic because the will was directed at a falsehood. Did I consent to the surgery or the lie? More critically, this view fails the limit case completely. If my will dictates morality, I should be able to consent to anything, including my own destruction or slavery. Since most people intuitively feel you cannot consent to being murdered even if you beg for it, this reading is generally considered false or at least unsustainable. It makes consent too powerful, ignoring the objective harms that might remain even with agreement.

  The fifth reading is actually your side of the debate, which we can call the defensive or exculpatory view. On this reading, consent does not change the act at all. Cutting someone open is always a violation of bodily integrity, but consent provides the actor with a defense against blame or liability. The act remains a wrong in the abstract, but the agent is not punished because the victim has no standing to complain. This view does not do the work your mate wants. He wants consent to stop the thing from being a wrong at all, whereas this view says it is a wrong that is forgiven or unenforceable. The advantage of this view is that it handles the pressure points and limits very well. It explains why you cannot consent to slavery easily, because some wrongs are against the moral order regardless of your complaint. It also explains why deception matters; if you were lied to, your standing to complain was not truly waived. However, it fails to capture the intuition that consensual surgery is fundamentally different from battery, not just battery that we agree to ignore.

  There is a sixth reading that tries to split the difference, often called the hybrid or interest-based view. This suggests consent changes the act because the wrongness of battery is grounded in the violation of autonomy or interests. When you consent, your autonomy is not violated, so the ground for the wrong disappears. The act is not wrong because the harm it usually causes is absent. This does the work your mate wants by making the act permissible, but it grounds the magic in the absence of harm rather than the presence of a magical power. It handles the pressure points well because deception or pressure means your interests or autonomy are still compromised, so the wrong remains. It also handles the limit case by arguing that some acts are wrong regardless of autonomy, perhaps because they degrade human dignity or violate fundamental interests that cannot be waived. This is often seen as the most stable position, but it dilutes the magic to a calculation of harms and interests rather than a transformative power of the will.

  So when you look at the spread, the trivial conceptual view changes the label but not the reasoning. The rights waiver view changes the permissibility but relies on pre-existing rights. The normative power view gives consent the most agency and fits the magic metaphor best, but requires unexplained limits on that power. The radical voluntarist view is too strong and breaks on limits. Your defensive view protects against abuse but denies the transformation. The hybrid view saves the intuition without the magic. Your mate is likely advocating for the normative power view because it best captures the intuition that consent makes surgery good rather than just excusable battery, but he has to accept that this power is not infinite. If he claims consent can make anything right, he is wrong. If he claims consent changes the moral status of acts within a specific domain of bodily autonomy, he is on solid ground, but it is less like magic and more like holding a key that only fits certain locks. The verdict on whether it changes the act itself depends on whether you think the act is defined by its physical properties or its moral context. If the context is part of the act, then consent changes the act. If the act is just the physical movement, then consent only changes the judgment of it. Most philosophers agree consent changes the moral status, but disagree on whether that is because the act is different or because the prohibition is lifted.

  Ultimately, the phrase moral magic is useful shorthand for the normative power view, but it risks obscuring the conditions required for the magic to work. It works on lying and pressure because those conditions prevent the spell from being cast in the first place; invalid consent is not consent. It works on understanding because you cannot exercise a power you do not comprehend. It fails on the limit cases unless you admit that some doors are locked from the outside regardless of your key. If your mate wants to say consent transforms the act from wrong to permissible, he is defensible. If he wants to say consent transforms the act from harmful to beneficial regardless of outcome, he is wrong. The most precise claim he can make without falling into error is that consent is a normative power that renders otherwise impermissible interactions permissible, provided the consent is informed, voluntary, and within the bounds of what morality allows us to waive. Anything stronger than that collapses under the pressure points, and anything weaker turns into your defensive view where the wrong remains but goes unpunished. You are both touching on different parts of the same elephant, but his language suggests he wants the power to be more absolute than it actually is.
