      *   *New Thesis:* The film argues that peer disagreement norms (conciliate/standfast) presuppose a closed evidence set. *Twelve Angry Men* shows that in high-stakes contexts, the epistemic duty is to *reopen* the evidence set. 8's role isn't to hold a contrary belief, but to function as an *epistemic disruptor* whose steadfastness is procedural, not doxastic.

