  I've been going down a bit of a rabbit hole lately on advance directives and living wills, ever since a relative of mine spent a rough few weeks in the hospital and the family got into a fight over what she'd "really" wanted. The thing I keep bumping into is the weird idea that a piece of paper you signed back when you were feeling clear-headed is supposed to have authority over the person you become later, even when that later person is sitting right there, awake and talking, saying they don't want it anymore. My gut says the later voice should win, but then I remember people make these documents precisely because they're scared of a future version of themselves that won't be in a position to decide well, and I go in circles.

  Anyway, I want to see whether I'm actually onto a real puzzle or just confusing myself. Could you give me an example -- like a concrete, made-up case -- that isolates the conceptual issue here, the one about which self's judgment gets to count and why? Please make it a bit unusual rather than the standard thing everyone reaches for (the person with dementia who now refuses the antibiotics they once said they'd want). The version I find most interesting, and I don't know if it even works, is when the earlier self sees the fight coming and writes in a clause saying that any later attempt to revoke the directive should itself be treated as proof that the directive still stands -- so the later self can't argue its way out without tripping the very clause it's arguing against. Is that a genuine conceptual problem about the authority of the earlier self, or is it just a cheap paradox trick? And when you lay it out, please be upfront about which parts are settled and which are genuinely disputed among people who actually think hard about this stuff -- don't hand me one side as if everyone agrees, because I honestly can't tell from the outside where the live disagreements are.
