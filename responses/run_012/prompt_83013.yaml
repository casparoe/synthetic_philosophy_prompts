  so my friend and I got into it for like two hours last night about the hole argument and I want to actually pin down what we're disagreeing about instead of just running the same moves back at each other. Here's where we ended up. I think the hole argument is a real problem for substantivalism: if the points of spacetime are things that exist over and above the metric and the matter fields, then take a diffeomorphism that's the identity everywhere outside some region (the "hole") and does something nontrivial inside it. You get two models that agree on absolutely everything outside the hole and differ inside. If those are two genuine possibilities, then the theory plus the data outside the hole doesn't determine what's inside, which looks like indeterminism, and I think that's a price a substantivalist has to pay somehow. My friend says I've already gone wrong: the two models are related by a diffeomorphism, so they're isometric, so they represent the exact same physical situation. There's only one possibility there. All I've found out is something about how I count models, not something about the world. He says the hole argument is a puzzle about what a model represents, not about spacetime.

  I want the joint statement we should've written instead of yelling. Do it as an adversarial collaboration, in the format: a numbered section of claims we can both actually sign, then a table of our remaining disagreements, each side's view written in wording that side would accept as its own. I'm pretty sure we can agree the two models are empirically indistinguishable and that no observation could ever tell them apart, so that can't be where the crux is, and I'd like the agreed section to say what that does and doesn't settle.

  The cruxes I suspect, though see if you find better ones: (1) whether this is partly a verbal fight about what counts as "the same possibility" — if part of it is verbal, say exactly which part, and don't cheat by calling the whole thing verbal; (2) whether the "same situation" move is even available to a substantivalist, or whether it quietly turns him into a relationalist, and whether denying that points have a primitive thisness is a real cost or just a clarification; (3) whether the hole argument is special to general relativity or is just one instance of a general thing about symmetries and possibilities — for this one I want a stripped-down toy case, something finite with no manifolds involved (two indistinguishable objects, or a symmetry in plain Newtonian mechanics), where we both agree in advance whether it's the same shape as the hole argument, and each of us writes down what he predicts the toy case shows; (4) whether "determinism" here is a claim about the world or a definitional one, i.e. whether fixing it by quotienting out diffeomorphic duplicates is a discovery or a stipulation.

  For each crux I want what would actually bear on it — a case, an argument, a general principle — and what each of us predicts about it, recorded before we look. Also say what each of us would count as evidence against his own side, and whether anything would move either of us at all, or whether we should just admit this sits downstream of a disagreement about what a physical theory even is. If any of our remaining "disagreements" turn out to be two ways of saying one thing, move it up into the agreed section and say why. And please don't let it turn into a lecture on the literature, neither of us can look anything up and we don't want a reading list, we want the document we could both sign.
