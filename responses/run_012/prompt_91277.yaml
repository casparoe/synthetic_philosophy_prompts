      *   *Sentence 3:* "Mises's argument, made in the 1920s, was that a socialist economy is impossible in principle: with the means of production held in common there is no market in capital goods and therefore no prices for them, and without prices there is no way to compare the costs of alternative uses of resources."
          *   *Assessment:* Acceptable. This is the core of Mises's 1920 "Economic Calculation in the Socialist Commonwealth" argument. No private property in means of production -> no money prices -> no rational calculation.
      *   *Sentence 4:* "The difficulty is not that the sums are hard; it is that the terms of the sum do not exist."
          *   *Assessment:* Acceptable. A pithy summary of Mises's logical point (absence of prices vs. computational complexity).
      *   *Sentence 5:* "Hayek supplied the other half of the case, and it is an empirical half: the knowledge required to allocate resources is dispersed among millions of people and much of it is tacit, so no planning board could ever assemble it, and market prices are the only device that transmits such knowledge."
          *   *Assessment:* Simplification. Hayek's argument (1930s/40s) is often distinguished from Mises's. Calling it "empirical" is slightly tricky (it's epistemological), but generally accepted. The "tacit knowledge" part is accurate to Hayek ("The Use of Knowledge in Society").
      *   *Sentence 6:* "Lange and Lerner replied that a Central Planning Board could set prices for capital goods itself, adjusting them by trial and error until shortages and surpluses disappeared, with managers instructed to follow a few marginal rules."
          *   *Assessment:* Acceptable. This accurately describes Market Socialism (the Lange-Lerner-Taylor theorem).
      *   *Sentence 7:* "In effect they conceded that planning would have to imitate the market, and the concession was fatal: their board was a market in name only, since it set prices rather than discovering them, and it could not generate the innovation that competition forces."
          *   *Assessment:* Simplification/Contested. This is the *Austrian* rebuttal to Lange (specifically Hayek and later Kirzner on entrepreneurship). Neoclassical economists might argue Lange's model *is* efficient in equilibrium. The "innovation" point is a later addition (Kirzner/Scott). It's a strong interpretation, not a neutral fact.
      *   *Sentence 8:* "The theoretical verdict was in long before 1989, and the collapse of the Soviet bloc confirmed it."
          *   *Assessment:* Simplification/Wrong. Many historians of thought argue the debate was *not* settled theoretically. Lange famously said "I shall burn my papers" (though likely apocryphal). Many neoclassicals thought Lange won the theoretical point, even if socialism failed practically for political/incentive reasons. Claiming the *theory* was settled is contentious.
      *   *Sentence 9:* "Anyone now reviving the case for planning is reopening a question that was closed."
          *   *Assessment:* Wrong/Opinion. This is a rhetorical conclusion, not a historical fact. The question is demonstrably *not* closed (as the user's book proves).

