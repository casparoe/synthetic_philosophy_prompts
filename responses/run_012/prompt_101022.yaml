  2.  **Deconstruct the Practices & Identify Tensions:**

      *   *Practice 1: The Sentence.* Public, community-based, proportional.
          *   *Theory:* Retributive justice. The state acts as the avenger of the moral order. The criminal owes a debt.
      *   *Practice 2: The Delay.* Appeals, death row, receding dates.
