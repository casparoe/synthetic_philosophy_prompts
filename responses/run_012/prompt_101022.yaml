answer: |-
  **The Theory of the Sanitized Sovereign**

  You ask for the implicit theory of the modern retentionist practice. If we strip away the rhetorical defenses (deterrence, justice for victims) and look strictly at the institutional mechanics you have outlined, the practice does not presuppose a theory of *retribution* in the classical sense. A classical retributive theory demands a moral equivalence between crime and punishment. If the crime was violent, chaotic, and painful, the punishment should mirror that moral disruption to restore the balance.

  The practice you describe presupposes something else entirely. It presupposes a theory of **Sovereign Sanitization**.

  The central commitment of this institution is not that the criminal *deserves* to suffer, but that the State must *kill without staining itself*. The institution is designed to allow the community to exercise the ultimate power of life and death while maintaining the fiction that it is not a killer. Every procedural detail you listed serves to distance the State from the visceral reality of the violence it commits.

  Here is the reconstruction of that theory, addressing your three specific tensions.

  **(a) The Painless and Hidden Death**
  If the theory were pure retribution, the requirement for a painless, dignified, and private death would be incoherent. If the criminal has forfeited their standing through a heinous act, why does the State owe them a "dignified" exit? Why hide the act if it is a righteous moral cleansing?

  The implicit theory answers this: The dignity is not for the condemned; it is for the executioner. The privacy is not to protect the prisoner from shame, but to protect the public from complicity. The State claims a monopoly on violence, but it must distinguish its violence from the criminal's violence. The criminal's violence was messy, passionate, and cruel. The State's violence must be sterile, dispassionate, and clinical.
  *   **The Presupposition:** The moral legitimacy of the State depends on its inability to feel like a murderer.
  *   **The Tension:** This exposes the retributive justification as insincere. You cannot claim to be "paying back" the debt of violence while simultaneously refusing to touch the violence with your bare hands. The requirement of a painless death proves that the State is more concerned with its own self-image than with the moral equilibrium of the universe. It is not balancing scales; it is managing risk.

  **(b) Competence and Volunteering**
  The competence requirement and the waiver of appeals introduce a second pillar: **The Necessity of the Moral Subject.**
  *   **Competence:** The State insists the prisoner be sane because punishment requires a recipient who *understands* they are being punished. If the prisoner is psychotic, the symbolic transaction fails. The State cannot make a point to someone who cannot hear it. This is not about the prisoner's rights; it is about the efficacy of the State's message.
  *   **Volunteering:** When the prisoner waives appeals, the State eagerly accepts this "choice." Why? Because it shifts the ontological category of the act. If the prisoner chooses death, the State becomes merely the *instrument* of the prisoner's will, rather than the *author* of the death.
  *   **The Presupposition:** The State requires the condemned to be a sovereign agent only when that agency helps the State disclaim responsibility.
  *   **The Tension:** This creates a contradiction. In the sentencing phase, the prisoner is an object of community judgment (no sovereignty). In the execution phase, the prisoner is treated as a sovereign agent (competence/consent). The theory presupposes a fluid humanity: the prisoner is a "monster" when being judged, but a "citizen" when being killed, but only if that citizenship absolves the State of the killing.

  **(c) Time and Premeditation**
  Camus's observation regarding time is the most damning element of the institutional theory. The modern practice turns the death penalty into a **temporal condition** rather than a momentary event.
  *   **The Presupposition:** The State asserts total dominion over the prisoner's future. By scheduling and postponing, the State forces the prisoner to live in a "future perfect" tense—they are already dead, just not yet.
  *   **The Tension:** A retributive act should be conclusive. A debt paid is closed. But the modern practice keeps the debt open for years. This serves the theory of Sanitized Sovereignty: the delay allows the State to claim it is "careful," "deliberate," and "merciful" (via appeals), while simultaneously subjecting the prisoner to the specific torture of anticipation. The State gets to claim the moral high ground of due process while inflicting a psychological punishment that exceeds the physical execution. This confirms Camus's view: it is premeditated murder because the State lives with the decision to kill for years, normalizing the killing as a bureaucratic routine rather than a tragic necessity.

  ***

  ### THE VERDICT

  **I. The Distinction: Necessary Presuppositions vs. Incidental Fits**

  *   **Incidental:** The specific methods (lethal injection vs. electrocution), the number of years on death row, or the specific rules regarding last meals. These are variable cultural artifacts.
  *   **Necessary:** The **medicalization of the killing** and the **privatization of the witness**. The institution *cannot* function without the appearance of clinical procedure and the absence of the public eye. If the execution were public and bloody, the theory of Sanitized Sovereignty would collapse. The prohibition of physicians participating is the smoking gun: it proves that the act is fundamentally incompatible with healing, yet the State requires the *aesthetic* of healing to proceed.

  **II. The Single Commitment**

  The single commitment doing the real work is **The Preservation of the State's Moral Innocence.**

  Every feature you listed serves this master.
  *   We make it painless so *we* do not have to feel like torturers.
  *   We make it private so *we* do not have to see the blood.
  *   We require competence so *we* can claim the prisoner understood the justice of it.
  *   We allow waivers so *we* can claim the prisoner chose it.
  *   We delay so *we* can claim we were being careful.

  The prisoner's experience is secondary. The institution is designed to manage the conscience of the community, not the justice of the penalty.

  **III. The Judgment on Coherence**

  **The institution is incoherent.**

  It claims to be a retributive act (a just desert for crime) but operates as a bureaucratic administration (a sanitary disposal of risk).
  *   If it is **Retribution**, it must acknowledge the violence it inflicts. By hiding and sanitizing the violence, it admits that the violence is shameful. If the violence is shameful, it cannot be just.
  *   If it is **Administration**, it has no business claiming moral proportionality. You do not "proportion" a sanitary disposal; you manage it.

  **Final Ruling:**
  The modern practice of capital punishment, as described, is **Retribution disguised as Medicine.**

  It attempts to wield the sword while wearing surgical gloves. It presupposes that the State can kill without becoming a killer, provided the killing is quiet, slow, and regulated. This is a metaphysical impossibility. As Camus argued, the premeditation and the procedure do not elevate the act above murder; they merely add the specific horror of bureaucracy to the horror of death.

  The theory fails because it demands a contradiction: that the State can commit the ultimate violence while remaining untouched by the nature of violence. The institution holds together only through denial. It is not a coherent system of justice; it is a ritual of absolution for the executioner, purchased at the price of the condemned's psychological disintegration during the waiting period.

  **Verdict: Guilty of Incoherence.** The practice presupposes a moral standing for the State that its own actions negate. It is a retribution it will not perform openly, and therefore, it is not retribution at all. It is power maintaining itself through the denial of its own nature.
