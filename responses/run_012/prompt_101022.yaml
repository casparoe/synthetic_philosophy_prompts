      *   *Is it too abstract?* Need to ground it in the specific details provided (waiver, competence, medical prohibition).
      *   *Is the distinction clear?* Distinguish between what is *necessary* for the theory vs. what is incidental.
      *   *The "Single Commitment":* I need to be precise. Is it "Sovereignty"? Is it "Legitimacy"? Let's go with **The Legitimacy of Clean Hands.** The State must kill without appearing to murder.

  8.  **Final Polish (Mental Outline of the Response):**
