      *   **Section 1: The Reconstruction.** The state is not avenging; it is administering. The goal is not equal suffering (retribution) but moral distance.
      *   **Section 2: Addressing the Triad.**
          *   (a) Painlessness = State's self-protection, not prisoner's right.
          *   (b) Competence = Ensuring the symbol lands, not respecting autonomy (except when convenient).
          *   (c) Time = The assertion of total dominion (Camus's point).
      *   **Section 3: The Verdict.**
          *   Necessary Presupposition: The State must remain distinct from the criminal's violence.
          *   Incoherence: It claims retribution but practices administration.
          *   Final Judgment: It is a lie. A ritual of denial.

  9.  *(Self-Correction during drafting)*: Make sure to explicitly mention the medical prohibition. That is the smoking gun. The doctors know it's not healing. The State pretends it is order.

  10. **Final Review against constraints:** No survey of arguments. Focus on institutional logic. Verdict format.

