      *   *(c) Time/Waiting:* Camus's point.
          *   *Insight:* The delay turns the execution into a psychological state rather than a momentary act. The State holds the power of life/death over time. It creates a "living dead" status. This contradicts the idea of a swift, proportional penalty.

  4.  **Synthesize the "Implicit Theory":**

      *   What holds this together? It's not pure retribution (too soft). It's not pure utilitarianism (too focused on the individual's state of mind).
      *   It looks like **Sovereign Sanitization**. The State wants the *power* to kill (to assert sovereignty) without the *stain* of killing (to maintain moral legitimacy).
