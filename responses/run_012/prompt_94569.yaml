          *   *The User's Situation:* **Weaponized Dormancy.** (I might coin/refine this). It's when a dormant law is activated by private complaint rather than public policy.
      *   **The "Work" the Rule is Doing:** The user asks "what exactly is doing the work?" The answer is **Discretionary Power.** The law isn't regulating behavior; it's granting power to the state (and complainants) to punish selectively.

  5.  **Drafting the Response (Iterative refinement):**

