      *   *Selective Enforcement:* This is definitely happening. The law is enforced against *you* but not *others*. This is often a defense in criminal law (equal protection), but hard to prove.
      *   *Dormant Law / Zombie Law:* Colloquial terms. Accurate description but not technical.
      *   *Hart vs. Fuller:*
          *   Hart (Legal Positivism): Law is law if enacted by proper authority, regardless of morality or enforcement.
          *   Fuller (Natural Law/Internal Morality): Law must meet 8 criteria (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy through time, congruence between official action and declared rule).
          *   *Relevance:* Fuller's "congruence" is key here. If the rule says X but officials do Y, the system fails.
      *   *Customary Law:* Sometimes practice overrides written law, but usually in international or common law contexts, not municipal bylaws.
      *   *Estoppel:* Can the city be estopped from enforcing a rule they ignored for decades? Usually no, especially for public law.

  3.  **Deconstructing the "Shape of It":**
      *   The user is asking about the *ontological status* of the rule. Is it still a law?
      *   From a Positivist view (Hart): Yes, it's a valid rule until repealed.
      *   From a Sociological view: No, it's a "dead letter."
