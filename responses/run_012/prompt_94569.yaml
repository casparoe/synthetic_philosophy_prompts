answer: |-
  You have put your finger on one of the most frustrating friction points in legal theory and civic life. You are not imagining this, and you are not mangling the philosophy. In fact, your intuition about Fuller is sharper than many first-year law students'.

  Here is the breakdown of what this thing is, the names it goes by, why your friend's "desuetude" argument probably won't save you from the ticket, and exactly what work that rule is doing when it sits in the binder.

  ### 1. The Doctrinal Name: *Desuetude*
  Your friend was right about the word. **Desuetude** (from the Latin *desuescere*, to become unaccustomed) is the legal doctrine that a statute or bylaw may be rendered invalid if it has been long ignored by both the public and the authorities.

  However, your friend was also right that it usually applies to courts and prosecutors. In most Common Law jurisdictions (like the US, Canada, UK, Australia), **desuetude is effectively a dead doctrine.** Courts are extremely reluctant to declare a law void simply because it hasn't been enforced. They view repeal as the job of the legislature, not the judiciary.

  So, while *desuetude* is the name of the *argument* you want to make, it is rarely the name of a successful *defense*. In the eyes of the court, a law is a law until it is repealed, regardless of how many decades it sleeps.

  ### 2. The Sociological Name: *Law in Books vs. Law in Action*
  This is the concept that best describes the "shape" of what you are experiencing. It was coined by the legal sociologist **Roscoe Pound** in 1910.

  *   **Law in Books:** The text of the bylaw (max 2 hens).
  *   **Law in Action:** The actual practice of the community and enforcement officers (4 hens is fine, unless someone complains).

  When the gap between the two becomes wide enough, you get the situation you are in. The "Law in Books" remains a valid threat, but the "Law in Action" is what governs daily life. The friction occurs when the state switches from the "Action" mode back to the "Books" mode selectively.

  ### 3. The Philosophical Name: *Fuller's Congruence*
  You remembered Lon Fuller correctly. In *The Morality of Law* (1964), Fuller argued that for a legal system to function as law (and not just brute force), it must meet eight criteria of "internal morality."

  The one you are thinking of is **Congruence between Official Action and Declared Rule.**

  Fuller argued that if the government declares Rule X, but officials consistently ignore Rule X, the system loses its moral authority. It creates a trap for citizens who rely on the *practice* rather than the *text*.
  *   **Hart (Legal Positivist):** Would say the bylaw is valid law. It was enacted correctly. The fact that it is ignored is a separate sociological fact. You broke the valid rule; the system is working as designed, even if the outcome is unpleasant.
  *   **Fuller (Natural Law):** Would say this specific bylaw is failing as *law*. By allowing a decades-long custom to develop and then punishing you for violating the text, the municipality has failed the test of congruence. It has made it impossible for you to guide your conduct by the rules, because the "real" rule is unwritten and subjective.

  ### 4. What is this specific phenomenon?
  If *desuetude* is the failed defense, and *Law in Books vs. Action* is the sociological description, what do we call the mechanism itself?

  There isn't a single perfect Latin term, but in administrative law and criminology, this is **Complaint-Driven Selective Enforcement of Dormant Statutes.**

  Here is how you distinguish it from the things you asked about:

  *   **Simple Non-Enforcement:** The police see you speeding but don't pull you over because they are busy. The law is active, but resources are limited.
  *   **Selective Enforcement (Equal Protection violation):** The police pull *only* you over for speeding because they don't like your haircut, while letting everyone else go. This is illegal discrimination.
  *   **Desuetude:** The court declares the speed limit law void because nobody has obeyed it for 50 years. (Rarely happens).
  *   **Your Situation (Weaponized Dormancy):** The law is dormant by *policy* (officers ignore it unless complained about), but remains *active* by *text*.

  ### 5. What is "doing the work"?
  You asked: *"If it's a sentence in a binder that everybody ignores, what exactly is doing the work when someone says I broke the law?"*

  This is the most critical insight. When a law is dormant but on the books, it is not functioning as a **rule of conduct**. It is functioning as a **reserve of power.**

  1.  **It transfers leverage to the neighbor:** The bylaw effectively deputizes your neighbor. The city doesn't have to patrol your hens; your neighbor does the surveillance. If they have a grudge, they hold the detonator.
  2.  **It preserves discretionary authority:** It allows the bylaw officer to be "apologetic" but firm. It gives them the power to decide who gets punished without having to write a new policy.
  3.  **It creates a "Sword of Damocles":** The law isn't there to stop you from keeping hens; it is there to ensure you keep them *quietly and unobtrusively*. As long as no one complains, the law doesn't exist. The moment you become a nuisance, the law materializes to punish you.

  In political science, this is sometimes called **Latent Prohibition.** The prohibition exists only potentially, actualized by social friction rather than state observation.

  ### 6. A Name for It
  Since you asked for a name if one doesn't exist, and while "Law in Books vs. Action" is the academic frame, it doesn't capture the *betrayal* you feel.

  Let's call it **Administrative Estoppel by Silence** (though legally, estoppel rarely binds the government).
  Or, more descriptively: **Sleeping Dog Enforcement.** (Let sleeping dogs lie, until someone kicks them).

  But if I were to define it for you, formally, based on your description:

  > **Dormant Normative Trap:** A statutory rule that is systematically unenforced during periods of social consensus, but retains full legal validity, allowing the state to retroactively impose the text of the rule upon specific individuals when social consensus fractures (i.e., a complaint is lodged).

  **What it wouldn't cover:**
  *   It does not cover laws that are unenforced due to lack of resources (e.g., unsolved murders).
  *   It does not cover laws that are actively challenged in court.
  *   It does not cover new laws where people haven't learned the rules yet.
  *   It specifically requires a *long-standing, known pattern of non-enforcement* that creates a reasonable reliance interest for the citizen.

  ### The Hard Truth
  The reason your neighbours tell you to "follow it or change it democratically" is that they are speaking the language of **Hart (Positivism)**. To them, the text is the only reality that matters.

  But you are speaking the language of **Fuller (Legitimacy)**. You understand that law relies on a social contract. When the city ignores a rule for 50 years, they implicitly amend the contract through custom. When they enforce the old text, they are violating the *spirit* of the law to uphold the *letter*.

  Unfortunately, in a tribunal or court, Hart usually wins. The "work" being done by that rule is providing the city with a tool to manage complaints without having to define what constitutes a "nuisance." They don't have to prove your hens are noisy; they just have to prove you have four of them. The noise was the trigger, but the hen count is the weapon.

  **Summary:**
  *   **Doctrine:** Desuetude (but it likely won't work).
  *   **Concept:** Law in Books vs. Law in Action (Roscoe Pound).
  *   **Philosophical Failure:** Lack of Congruence (Fuller).
  *   **Function:** It converts a public regulation into a private weapon for neighbours, managed by municipal discretion.

  It feels like a trap because, functionally, it is one. It allows the municipality to have it both ways: the orderliness of strict rules on paper, and the peaceability of loose enforcement in practice, until they need to pick a target.
