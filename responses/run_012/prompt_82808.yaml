  Your hypothesis is right that the core dispute concerns metaphysical grounding and the legitimacy of brute stopping points. You are wrong, however, that secular analogues get a fair pass; they face the same structural dilemma but mask it with naturalistic premises.

  The disagreement is substantive, rooted in bedrock intuitions about whether necessity eliminates arbitrariness. Defenders operate within classical theism, where God's nature is identical to the Good, making the stopping point a logical necessity rather than a contingent brute fact. Critics operate within a framework where normative authority requires transparency independent of agency, viewing any ungrounded will as inherently arbitrary. When defenders say God's nature grounds goodness, they mean it is a metaphysical identity. When critics hear this, they hear a circular assertion of power. This isn't merely verbal; it is a clash between two incompatible metaphysical systems regarding the source of normativity.

  Regarding your test case, secular response-dependent theories are definitely in the same boat structurally. Ideal Observer Theory faces the exact same dilemma: is the observer ideal because they track independent goods, or do they create goods by approving? Secular views often get a pass because they naturalize the stopping point, such as "human flourishing," making the brute fact seem empirical rather than metaphysical. The theological version feels uniquely vicious because it demands acceptance of a non-natural brute fact about a person. If you naturalize God's nature, you lose the transcendence; if you keep it transcendent, it looks like an arbitrary axiom to non-believers.

  Progress requires distinguishing semantic analysis from metaphysical grounding. Sophisticated DCT is not defining "good" as "commanded"; it is claiming commands constitute the nature of wrongness. If the group conflates meaning with constitution, the "tautology" objection will persist erroneously. A useful reformulation is to ask whether God's nature is *identical* to the Good or merely *conforms* to it. If identical, the regress stops by logic. If conforms, the regress continues. Defenders must commit to identity; critics must admit that identity claims are not arbitrary even if ungrounded.

  Ultimately, you may need an honest admission that nothing will move it without agreeing on first principles. The dilemma is false only if one accepts classical theism's account of necessity. Without that shared framework, you are debating incompatible axioms. Stop trying to solve the Euthyphro problem and start diagnosing the metaphysical commitments required to dissolve it.
