answer: |-
  **Pre-writing Brainstorming**

  *   **Intellectualist (Alex) must explain:**
      1.  How the proposition persists in the expert phase if articulating it lowers accuracy (is it stored differently?).
      2.  How the initial rule-learning translates to current skill if the rule is now inadequate (did the proposition evolve?).
      3.  How to account for the exceptions she spots but can't name (are there unconscious, complex propositions?).

  *   **Anti-Intellectualist (Jamie) must explain:**
      1.  How the rule helped her start if know-how is distinct from knowing-that (was it never real knowledge?).
      2.  Why the rule actively harms her now (is it competing systems?).
      3.  What status the initial rule had if it wasn't the core of the skill (was it merely suggestive?).

  ***

  **The dialogue**

  **Alex:** So, the dye grader. You think the rule is irrelevant once she's expert?

  **Jamie:** Not irrelevant. Obstructive. She's at ninety-seven percent when she trusts her eye. You hand her the hue-angle threshold, she drops to seventy. If knowing-how was just knowing-that rule, adding the rule should stabilize her, not tank her.

  **Alex:** Unless the rule she's holding now isn't the one she's using then. When she's flowing, she's not contemplating the threshold consciously. She's grasping the proposition under a practical mode of presentation.

  **Jamie:** That's a lot of machinery to save the thesis. She says "a bit lighter than that one." There's no proposition there. There's a comparison, a sensation.

  **Alex:** But she learned via the rule. You told me the training manual gave her the threshold first. If know-how is a distinct capacity unrelated to propositions, why did the proposition kickstart the capacity?

  **Jamie:** Scaffolding. You teach someone to swim by telling them "kick from the hip," but if they think about their hip while drowning, they sink. The rule gets them in the water. It doesn't constitute the swimming.

  **Alex:** But if the rule gets them in the water, the knowledge of the rule is causally primary. Here's the rub: she spots bad batches the rule calls fine. She can't say why. If she's just following a rule unconsciously, how does she violate the rule successfully?

  **Jamie:** Because she's not following a rule. She's tuned to the material. The rule is a crude map. She's walking the terrain. When she spots the exception, she's seeing something the map doesn't contour.

  **Alex:** So she knows something true about the batch that the rule misses. That sounds like a fact. "This batch is bad despite meeting threshold X."

  **Jamie:** It's a recognition, not a fact. She can't assert it. She can't put it in a that-clause. You're trying to force every successful orientation toward the world into the shape of a sentence.

  **Alex:** I'm saying the capacity *is* the grasp of the truth, even if unarticulated. Look at the drop to seventy percent. That's the key. Why does explicitizing hurt?

  **Jamie:** Cognitive interference. You're switching systems. From practical engagement to theoretical monitoring.

  **Alex:** Or, you're switching modes of access to the same knowledge. When she thinks about the rule explicitly, she treats it as a theoretical object. She second-guesses the application. But the knowledge underneath—the way to grade—is still propositional. It's just that her access is usually direct.

  **Jamie:** Direct access to a proposition? That sounds like magic.

  **Alex:** It sounds like muscle memory until you realize muscle memory is guided by neural encoding of constraints. Those constraints are information.

  **Jamie:** Information isn't propositions. A thermostat has information. Does it know how to regulate temperature?

  **Alex:** Don't go trivial. She's a person. She was taught a rule. She refined it. The refinement isn't losing the proposition; it's complicating it. She knows *that* this shade is wrong, under a guise she can't speak.

  **Jamie:** But the case says the rule *lowers* accuracy. If the proposition was the core, having it explicitly in mind should align her better with the truth. Instead, it alienates her from her skill.

  **Alex:** Because she's focusing on the wrong proposition. The manual's rule is incomplete. She's learned a richer set of propositions—about texture, light, context. When you force her to focus on the hue-angle, you're blinding her to the other facts she knows.

  **Jamie:** So she knows infinitely many propositions?

  **Alex:** I didn't say infinitely. I said the state isn't exhausted by the manual.

  **Jamie:** And when she says "a bit lighter," that's not a failure of articulation? It's not that the knowledge *is* the inability to fully articulate?

  **Alex:** It's a failure of translation. From practical to theoretical. But the content is there. Otherwise, how did she improve from the initial rule? She didn't just grow a new organ. She updated her information.

  **Jamie:** She updated her sensitivity. There's a difference. You're insisting that because she started with a rule, the finish line must be a rule.

  **Alex:** I'm insisting that because she started with a rule and got better, she knows more truths now, not fewer. The drop to seventy percent proves she still relies on the structure, but conscious interference breaks the flow.

  **Jamie:** Or it proves the structure is a cage she's learned to rattle without breaking. When you hand her the key, she tries to use it instead of rattling.

  **Alex:** But she can't explain the exceptions. If it's purely practical capacity, why is she so bad at reporting it?

  **Jamie:** Because the capacity isn't reportable. That's the definition of practical. You're treating silence as a deficit. I'm treating it as the nature of the thing.

  **Alex:** I'm treating silence as data. She knows something she can't say. That's knowing-that, just implicit.

  **Jamie:** It's knowing-how. She can do what she can't say. That's the asymmetry.

  **Alex:** But she learned by saying.

  **Jamie:** And then she stopped.

  **Alex:** Did she? Or did the saying just go underground?

  **Jamie:** If it's underground, why does digging it up kill the performance?

  **Alex:** Because digging changes the soil.

  **Jamie:** Or because there's nothing down there but roots.

  **Alex:** Roots are structures.

  **Jamie:** They aren't sentences.

  **Alex:** We're circling.

  **Jamie:** We are. Another pitcher?

  **Alex:** Yeah. But I'm still right about the exceptions.

  **Jamie:** Keep telling yourself that.

  ***

  **Where the disagreement is real and where it's verbal**

  Much of the spat is verbal, centering on the definition of "proposition." Alex stretches "knowing-that" to include unconscious, non-linguistic information states, while Jamie restricts it to articulable facts. If Alex means "informational state" and Jamie means "sentence," they might agree on the architecture but disagree on the label. However, the real disagreement lies in the explanation of the performance drop. Alex claims explicit rule-awareness interferes with *access* to the knowledge; Jamie claims it introduces a competing *kind* of knowledge (theoretical) that disrupts the practical capacity. They disagree on whether the skill is fundamentally representational (Alex) or dispositional (Jamie).

  **Which one the case hurts more**

  The case hurts Alex (the Intellectualist) more. She must explain why the very propositions that constitute the skill become detrimental when brought to consciousness. To save intellectualism, Alex has to posit a "practical mode of presentation" that is so distinct from standard propositional knowledge that it risks collapsing into Jamie's capacity view. Jamie only has to explain the initial rule-learning as scaffolding, which is a common feature of skill acquisition (training wheels), whereas Alex has to explain why the "truth" of the skill becomes false when examined.
