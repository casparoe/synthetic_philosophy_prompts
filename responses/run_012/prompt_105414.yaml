          *   *Verdict:* Flat-out wrong regarding politics. Partially right regarding physics (natural philosophy), but wrong on politics.

      *   *Claim 4:* "that's why Hobbes thought a genuine science of politics was impossible and had to settle for just describing what people happen to do."
