answer: |-
  Your gut is absolutely right to be suspicious. In fact, on the central point regarding politics, the lecturer has inverted Hobbes's actual position. This is a common confusion because Hobbes's epistemology (theory of knowledge) is complex, but the claim that Hobbes thought a "genuine science of politics was impossible" is contrary to the entire purpose of *Leviathan*.

  Here is the sentence-by-sentence breakdown you asked for, graded by how a specialist in early modern philosophy would react.

  ***

  ### Sentence 1
  > *"Thomas Hobbes is the first philosopher to take mathematics as the model for all reasoning."*

  **Verdict: Plausible, but slightly imprecise.**
  *   **The Nod:** Hobbes is certainly the most aggressive proponent of this. He famously defined reasoning as "reckoning" (computation) and wanted to apply the resolutive-compositive method of geometry to everything.
  *   **The Wince:** Saying he was the "first" is always dangerous in philosophy. Plato loved geometry; Descartes (his contemporary) was doing similar work with analytic geometry. However, Hobbes is unique in claiming that *all* reasoning, including moral and political, is essentially a form of arithmetic or geometric addition/subtraction of concepts.
  *   **Scholar's Note:** Acceptable as a lecture soundbite, provided you understand he meant "reasoning as computation."

  ### Sentence 2
  > *"His big insight was that geometry is the one science we can be certain about, because its objects — points, lines, figures — are things we build ourselves, so we know them the way a craftsman knows the chair he's making."*

  **Verdict: Accurate.**
  *   **The Nod:** This is a correct summary of the *verum factum* principle (truth is made) as Hobbes applies it. For Hobbes, we have certain knowledge only of things whose causes we generate ourselves. In geometry, we define the circle; therefore, we know its properties. We don't discover circles in the wild; we construct the concept.
  *   **The Wince:** None. This is standard Hobbesian epistemology found in *De Corpore*.

  ### Sentence 3
  > *"Politics and physics, by contrast, deal with objects we don't make, so there we can only guess;"*

  **Verdict: Half Right, Half Catastrophically Wrong.**
  *   **The Nod (Physics):** Hobbes *did* think natural philosophy (physics) was less certain than geometry. Why? Because in physics, we are observing effects (motion of bodies) and trying to guess the hidden causes. We didn't make the stars or the atoms, so we can't be 100% sure we have the right cause, only that our hypothesis is consistent with the effect.
  *   **The Wince (Politics):** This is where the lecturer loses the plot. Hobbes explicitly argues that **we do make the objects of politics.** The Commonwealth is an "Artificial Man." We construct the sovereign through the social contract. Because we construct it, we can have the same certainty about politics as we do about geometry.
  *   **Scholar's Note:** This sentence conflates "Natural Bodies" (physics) with "Artificial Bodies" (politics). Hobbes treats them differently.

  ### Sentence 4
  > *"that's why Hobbes thought a genuine science of politics was impossible and had to settle for just describing what people happen to do."*

  **Verdict: Flat-Out Wrong.**
  *   **The Wince:** This contradicts the fundamental ambition of *Leviathan* and *De Cive*. Hobbes did not want to "describe what people happen to do" (empirical observation); he wanted to demonstrate **causally** why people *must* behave certain ways to avoid misery. He believed he had discovered the "elements of law" just as Euclid discovered the elements of geometry.
  *   **The Correction:** Hobbes thought he had *achieved* a genuine science of politics. He writes in *De Cive* that civil philosophy is "new" because before him, no one had demonstrated the duties of citizens geometrically. He didn't settle for description; he demanded demonstration.
  *   **Scholar's Note:** If you take nothing else from this response, take this: The lecturer has reversed Hobbes's main selling point. Hobbes sold his political theory *on the basis* that it was as certain as geometry.

  ### Sentence 5
  > *"It's also why he spent his final years trying to square the circle, and why the mathematicians of the Royal Society, Wallis above all, wrote him off as a crank."*

  **Verdict: Factually True, Causally Weak.**
  *   **The Nod:** Hobbes did spend decades trying to square the circle. John Wallis (Savilian Professor of Geometry at Oxford) did systematically dismantle Hobbes's claims, leading to a famous, petty feud.
  *   **The Wince:** The phrase "It's also why" implies he did this because he thought politics was impossible. In reality, he did it because he believed his method of "computation" was universal. He thought if he could solve the circle, it would prove his method worked for *everything*, including politics. He wasn't retreating from politics to math; he was trying to fortify the foundation of his entire system.
  *   **Scholar's Note:** The facts are right, the motivation is simplified.

  ### Sentence 6
  > *"And his deeper point — that a subject is only as demonstrable as the extent to which we make it — was picked up later by Vico, and is basically the ancestor of the modern idea that we only really understand the things we build."*

  **Verdict: Accurate.**
  *   **The Nod:** Giambattista Vico (18th century) explicitly adopted the *verum ipsum factum* ("the true is the made") principle. Vico argued that because God made nature, only God knows it perfectly; because men made history/civil society, men can know that perfectly. This is a direct lineage from Hobbes's epistemology, even if Vico applied it differently.
  *   **The Wince:** None. This is standard intellectual history.

  ### Sentence 7 (The Closer)
  > *"all this shows Hobbes's reputation is really just a great political thinker embarrassing himself in a field he had no business entering"*

  **Verdict: Non-Sequitur / Oversimplification.**
  *   **The Wince:** This conclusion relies on Sentence 4 being true. If Hobbes thought politics was uncertain, then his math failures would suggest his whole method was garbage. But since Hobbes *did* establish a robust (if controversial) political science, his failure to square the circle is an embarrassing footnote, not a disqualification of his political theory.
  *   **The Nuance:** Scholars do acknowledge that Hobbes's materialism (his view that everything is matter in motion) led to his math errors. He refused to accept abstract quantities that couldn't be drawn as bodies. So, in a sense, his philosophical commitment to materialism *did* ruin his math. But it also *enabled* his politics (by making the State a tangible, constructible thing).
  *   **Scholar's Note:** It is fair to call him a "crank" in mathematics (Wallis proved it). It is unfair to suggest his political reputation rests on a mistake about the possibility of political science.

  ***

  ### Summary: Did the conclusion follow?

  The lecturer's closer ("Hobbes is a great political thinker embarrassing himself in math") is a common popular take, but the *path* he took to get there was flawed.

  1.  **What holds up:** Hobbes loved geometry. Hobbes failed at advanced math. Hobbes influenced Vico.
  2.  **What fails:** The claim that Hobbes thought political science was impossible.
  3.  **The Sneak:** The lecturer sneaked in a **skepticism** that Hobbes did not possess. The lecturer is projecting a modern view (that politics is messy and uncertain) onto Hobbes. Hobbes was a rationalist who believed he had solved politics with the same certainty as a geometric proof.

  **Recommendation:**
  If you want to verify this, look at the opening chapters of *Leviathan* (Part II: Of Commonwealth), specifically where he discusses the "Generation" of a Commonwealth. He uses the language of fabrication and construction. Also, look for secondary literature on "Hobbes and the *Verum Factum* principle."

  **Reading to fix the lecturer's error:**
  *   **Quentin Skinner, *Reason and Rhetoric in the Philosophy of Hobbes*:** Explains how Hobbes tried to make rhetoric and politics scientific.
  *   **A.P. Martinich, *Hobbes: A Biography*:** Details the math feud with Wallis without invalidating the political theory.
  *   **Leo Strauss, *The Political Philosophy of Hobbes*:** (Older, but emphasizes the geometric method).

  **Bottom line:** Trust your gut. Hobbes didn't think politics was a guessing game; he thought he had turned it into a calculation. The lecturer got the epistemology right (we know what we make) but applied it to the wrong subject (physics vs. politics).
