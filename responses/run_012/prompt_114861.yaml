prompt: |-
  I am the evidence lead at a small development fund. Roughly twice a month our investment committee asks me to rule on whether a proposal's causal story about a country's poverty holds up, and the story is nearly always one of the familiar three: extractive institutions, geography and disease burden, or culture. What I cannot tell them is which of the three the committee is actually entitled to act on. The three are each other's confounders, and by the time an explanation reaches us it has usually been assembled backwards from the outcome. I have an afternoon, no budget for new data, and a committee containing two economists and a historian; the committee signs off.

  Please write a decision procedure I can run under those constraints, grounded in what the philosophy of causal inference from observational history actually settles — identification and the counterfactual, mechanism versus effect, explaining a level versus explaining a change, and the treatment of culture as whatever remains once the other two have been controlled. Give me the questions in the order I should ask them, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision back to the committee because the remaining question is one of values or risk tolerance. Then run it on two proposals: one attributing a slow-growth record to a colonial-era land tenure arrangement, and one attributing a region's thin industrialization to a disease environment. Include the case in which the procedure tells me to reject a story I find persuasive, and be explicit about what the procedure cannot do. No citations needed; I will add them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Evidence Lead at a small development fund.
      *   **Task:** Create a decision procedure for the Investment Committee (IC) to evaluate causal stories about poverty (Institutions, Geography/Disease, Culture).
      *   **Constraints:** Afternoon timeframe, no new data budget, IC has 2 economists + 1 historian, IC signs off (I provide the ruling on evidence).
      *   **Core Problem:** The three explanations are confounded, often post-hoc (assembled backwards from outcomes), and it's unclear which is actionable.
      *   **Required Grounding:** Philosophy of causal inference from observational history (identification, counterfactuals, mechanism vs. effect, levels vs. changes, culture as residual).
      *   **Output:** A step-by-step decision procedure (questions, sufficient answers, stop conditions, hand-off points) + Application to two specific proposals (Land Tenure/Institutions, Disease/Geography) + Reflection on limitations (rejecting persuasive stories, what the procedure can't do).
      *   **Tone:** Professional, rigorous, pragmatic, philosophical but actionable. No citations.

  2.  **Deconstruct the Causal Inference Philosophy:**
      *   *Identification:* Can we separate the signal from the noise? Are we comparing like with like?
      *   *Counterfactual:* What would have happened otherwise? Is the comparison group valid?
      *   *Mechanism vs. Effect:* Do we know *how* it works, or just that it correlates? (Important for intervention design).
      *   *Levels vs. Changes:* Explaining why Country A is poorer than Country B (levels) is different from explaining why Country A grew slower last decade (changes). Interventions usually target changes.
      *   *Culture as Residual:* If institutions and geography are accounted for, is "culture" just the error term? If so, it's hard to target.
      *   *Actionability:* Even if true, can we change it? (The "entitled to act on" part of the prompt).

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Filter out post-hoc rationalizations and unactionable truths.
      *   *Step 1: The Counterfactual & Identification.* (The "Compared to what?" test).
      *   *Step 2: Levels vs. Changes.* (The "Static vs. Dynamic" test).
      *   *Step 3: Mechanism vs. Correlation.* (The "Black Box" test).
      *   *Step 4: Actionability/Modifiability.* (The "So What?" test).
      *   *Step 5: The Culture Check.* (The "Residual" test).
      *   *Hand-off:* Where does evidence end and values/risk begin? (Usually at Step 4/5).

      *Refining the Steps:*
      *   Q1: Identification. Is there a plausible control group? If no -> Stop (Reject).
      *   Q2: Levels vs. Changes. Is the story explaining a persistent state or a recent shift? If persistent state, can we change the state? If no -> Stop (Reject).
      *   Q3: Mechanism. Is the pathway specified? If "culture" is the mechanism, is it defined beyond residual? If no -> Stop (Reject).
      *   Q4: Actionability. Can the fund intervene on this variable? If no -> Hand off to IC (Values/Risk).

      *Wait, I need to align closer with the prompt's specific philosophical constraints.*
      *   "Identification and the counterfactual": Make this Step 1.
      *   "Mechanism versus effect": Make this Step 2.
      *   "Explaining a level versus explaining a change": Make this Step 3.
      *   "Treatment of culture as whatever remains": Make this Step 4.
      *   "Entitled to act on": This is the final gate.

      *Revised Procedure Structure:*
      1.  **Identification Test (The Counterfactual):** Is there a valid comparison?
      2.  **Temporal Test (Level vs. Change):** Are we explaining stagnation or a drop?
      3.  **Mechanism Test (The Black Box):** Is the pathway causal or descriptive?
      4.  **Residual Test (Culture):** Is culture a variable or a placeholder?
      5.  **Actionability Test (The Mandate):** Can we move this lever?

  4.  **Developing the Two Cases:**
      *   *Case 1: Colonial Land Tenure (Institutions).*
          *   Story: Extractive land laws from 1900 prevent investment today.
          *   Application: Needs a counterfactual (region without tenure issues?). Needs to explain why it hasn't been reformed (persistence). Is it actionable? (Legal reform is hard).
      *   *Case 2: Disease Environment (Geography).*
          *   Story: Malaria burden prevents industrialization.
          *   Application: Counterfactual (similar region without malaria?). Level vs. Change (Malaria is constant, industrialization is the variable). Actionability (Bed nets vs. structural change).

      *Constraint Check:* "Include the case in which the procedure tells me to reject a story I find persuasive."
      *   I need to make sure one of these cases fails the procedure even if it sounds plausible. Let's make the Land Tenure one fail on *Actionability/Change* (it's a level, not a change, and we can't rewrite history) or the Disease one fail on *Identification* (everywhere has disease, just different kinds).
      *   Better: Make the Land Tenure story fail on the "Level vs. Change" test. It explains why they are poor (level), but not why they aren't growing *now* (change), and the fund invests in growth. Or, make the Disease story fail on Actionability (we can't change geography, only mitigate). Let's go with the Land Tenure one being persuasive but rejected because it explains a *level* not a *margin of change* actionable by a fund.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the role and the epistemic humility required.
      *   **The Procedure:** 5 Questions. Define "Pass," "Fail," and "Hand-off."
      *   **Case Study 1 (Land Tenure):** Run the procedure. Show where it might stall.
      *   **Case Study 2 (Disease):** Run the procedure. Show where it passes or fails.
      *   **Reflection:** What the procedure cannot do (truth, moral justice, etc.).

  6.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Culture:* Be strict. If culture is used as a "root cause" without being operationalized as norms/behaviors that can shift, it fails the Residual Test.
      *   *Levels vs. Changes:* This is crucial. Most poverty traps are level explanations. Development funds usually need marginal changes to justify ROI. If the story explains why GDP/capita is $500 vs $50,000 (level), but the project aims to move $500 to $600 (change), the causal story might be irrelevant to the intervention.
      *   *Actionability:* This is where the IC comes in. I rule on *evidence*, they rule on *risk*. But I must flag if the evidence doesn't support the *lever*.

  7.  **Final Polish:**
      *   Ensure the tone is appropriate for an Evidence Lead speaking to an IC.
      *   Check constraints: No citations. Afternoon timeframe implied (procedure must be quick to apply).
      *   Ensure the "reject a persuasive story" requirement is met explicitly.

      *(Self-Correction on Case 1)*: Let's make the Land Tenure story the one I find persuasive but must reject. Why? Because it explains a *level* (historical poverty) but offers no identifiable *margin of change* for a specific investment. The history is fixed. The institution is sticky. The fund cannot change the colonial past, and current legal reform might be outside the project scope.
      *(Self-Correction on Case 2)*: Let's make the Disease story pass the evidence check but hand-off to the IC on risk. Why? Because the biology is clear (mechanism), the counterfactual exists (regions with eradication), but the cost/risk of intervention is a value judgment.

      *Wait, the prompt asks for "where the procedure stops with a no, and where it hands the decision back to the committee."*
      *   Okay, I will structure the cases to demonstrate both outcomes.

  8.  **Final Review against Prompt:**
      *   Decision procedure grounded in philosophy? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers/Stop conditions? Yes.
      *   Run on two proposals? Yes.
      *   Include rejecting a persuasive story? Yes.
      *   Explicit about limitations? Yes.
      *   No citations? Yes.

      *Let's write.*
answer: |-
  ### The Causal Adequacy Protocol

  **To:** Investment Committee
  **From:** Evidence Lead
  **Subject:** Decision Procedure for Causal Claims in Country Proposals

  **Context:** We face three competing causal families (Institutions, Geography, Culture) that are mutually confounded and often reconstructed post-hoc to fit observed poverty. We have no budget for new data collection and must rely on observational history. This procedure does not determine *truth*; it determines *adequacy for intervention*. It filters for identification, temporal relevance, and actionability.

  **Instructions:** Apply the following five questions in order. If a proposal fails a "Stop" condition, the evidence is insufficient to support the causal claim required for investment. If a proposal reaches the "Hand-Off" condition, the evidence is sufficient, and the decision rests on risk tolerance and values.

  ---

  #### Question 1: The Identification Test (The Counterfactual)
  **Philosophical Ground:** Causal inference requires a valid comparison. Without a counterfactual, we have description, not causation.
  **The Question:** Does the proposal identify a specific comparison group (spatial, temporal, or administrative) that differs primarily on the proposed cause but shares the other two confounders (e.g., similar culture and geography, different institutions)?
  **Sufficient Answer:** "Yes. Region A has the proposed cause, Region B does not, and they are otherwise comparable due to [specific historical or geographic boundary]."
  **Stop Condition (No):** If the comparison is "The Rest of the World" or "Idealized Theory," reject the causal story. It is unidentifiable.
  **Proceed to:** Question 2.

  #### Question 2: The Level vs. Change Test (Temporal Relevance)
  **Philosophical Ground:** Explaining a *level* (why Country X is poor) is distinct from explaining a *change* (why Country X is not growing *now*). Interventions target margins of change.
  **The Question:** Does the causal story explain a persistent historical level, or does it explain a recent deviation in growth/development trends?
  **Sufficient Answer:** "It explains a recent change in the outcome variable correlated with a change in the proposed cause." OR "It explains a persistent level, but we have identified a specific, breakable threshold within that level."
  **Stop Condition (No):** If the story explains a fixed historical level (e.g., "They are poor because of 19th-century borders") and identifies no current margin of variation, reject the story. You cannot invest in a fixed past.
  **Proceed to:** Question 3.

  #### Question 3: The Mechanism Test (Black Box vs. Pathway)
  **Philosophical Ground:** Correlation is not causation. We must know *how* the cause produces the effect to design an intervention.
  **The Question:** Is the mechanism linking cause and effect specified as a chain of human decisions or physical processes, rather than a functional label?
  **Sufficient Answer:** "Cause X alters Incentive Y, which changes Behavior Z, leading to Outcome O."
  **Stop Condition (No):** If the mechanism is circular (e.g., "Poverty causes poverty") or relies on a "Black Box" (e.g., "Institutions affect growth" without specifying which rules affect which investments), reject the story.
  **Proceed to:** Question 4.

  #### Question 4: The Residual Test (The Culture Check)
  **Philosophical Ground:** Culture is often the error term remaining after institutions and geography are controlled. If treated as a primitive cause, it is unactionable.
  **The Question:** If "Culture" is cited as a primary cause, is it operationalized as specific, observable norms or networks that can shift independent of institutions and geography?
  **Sufficient Answer:** "Culture is defined as [Specific Norm/Network], and evidence shows this norm varies independently of the institutional/legal framework."
  **Stop Condition (No):** If culture is defined as "values," "trust," or "work ethic" without behavioral specificity, or if it perfectly overlaps with the institutional boundary, reject the story. It is likely a residual confounder.
  **Proceed to:** Question 5.

  #### Question 5: The Actionability Test (The Mandate)
  **Philosophical Ground:** Even a true cause is irrelevant if the fund cannot move the lever. This is the boundary between evidence and strategy.
  **The Question:** Can the proposed intervention plausibly shift the identified cause or mechanism within the investment horizon?
  **Sufficient Answer:** "Yes. The intervention targets Mechanism Z directly."
  **Hand-Off Condition:** If the answer is "Yes," the evidence is sufficient. The decision to proceed is now a matter of **Risk and Values** (e.g., "Is fixing this mechanism worth the cost/probability of failure?"). This decision belongs to the Committee, not Evidence.
  **Stop Condition (No):** If the cause is immutable (e.g., "Latitude") and the intervention does not mitigate it but claims to remove it, reject the story.

  ---

  ### Application to Proposals

  #### Case 1: The Colonial Land Tenure Proposal
  **Story:** A country's slow growth is attributed to a colonial-era land tenure system that prevents collateralization of property, inhibiting credit markets.
  **My Intuition:** This is a classic, persuasive institutionalist argument (De Soto style). It feels robust.

  **Running the Procedure:**
  1.  **Identification:** *Pass.* The proposal compares bordering regions where the colonial power changed, resulting in different tenure systems, but similar geography and ethnic composition.
  2.  **Level vs. Change:** *Fail.* The tenure system was established 80 years ago. It explains the *level* of development (why they are poorer than neighbors), but there has been no recent *change* in the tenure system to explain the current growth stagnation. The story relies on the persistence of a historical shock.
  3.  **Mechanism:** *Pass.* The pathway is clear: No title → No collateral → No credit → No investment.
  4.  **Residual:** *N/A.* (Institutional story).
  5.  **Actionability:** *Fail.* The fund proposes a pilot titling project. However, the causal story relies on the *national* legal framework recognizing titles. A pilot cannot shift the national institutional cause.

  **Ruling:** **Reject.**
  **Reasoning:** Although I find the institutional story historically persuasive, it fails the **Level vs. Change Test**. It explains a static disadvantage, not a dynamic constraint we can marginally alter. Furthermore, it fails the **Actionability Test** because the fund cannot rewrite the national legal code through a pilot. The story is true, but it is not *investment-grade evidence*. It describes a trap, not a lever.

  #### Case 2: The Disease Environment Proposal
  **Story:** A region's thin industrialization is attributed to high malaria burden, which reduces labor productivity and discourages long-term capital investment.
  **My Intuition:** This feels deterministic. Geography is fate. But maybe we can mitigate it.

  **Running the Procedure:**
  1.  **Identification:** *Pass.* The proposal compares highland (low malaria) vs. lowland (high malaria) areas within the same country, controlling for institutions and culture.
  2.  **Level vs. Change:** *Pass.* The proposal cites recent eradication efforts in comparable regions that led to subsequent spikes in industrial investment (a change in cause leading to a change in effect).
  3.  **Mechanism:** *Pass.* Biological pathway (infection → absenteeism) and Economic pathway (risk premium on capital).
  4.  **Residual:** *N/A.* (Geography story).
  5.  **Actionability:** *Hand-Off.* The proposal offers bed nets and clinic support. This mitigates the geography without claiming to change it.

  **Ruling:** **Evidence Sufficient. Hand-Off to Committee.**
  **Reasoning:** The causal chain is identified, temporal, and mechanistic. The intervention targets the mechanism (disease burden) rather than the immutable cause (geography).
  **Committee Decision Point:** The Evidence Lead cannot rule on whether the cost of mitigation is worth the expected industrial growth. That is a risk/return calculation. The evidence confirms the story *could* work; the Committee must decide if it *should* be funded given the risk of eradication failure.

  ---

  ### Limitations of This Procedure

  As Evidence Lead, I must be explicit about what this procedure cannot do:

  1.  **It Cannot Establish Truth:** This protocol filters for *internal validity* and *actionability*, not ontological truth. A story can pass all five tests and still be wrong due to unobserved confounders. It merely ensures the story is *coherent enough to bet on*.
  2.  **It Cannot Resolve Moral Claims:** The procedure may reject a true story because it is unactionable (as in Case 1). This means we may walk away from a "just" cause because the evidence does not support an effective intervention. We are not a truth commission; we are a fund.
  3.  **It Cannot Quantify Risk:** The Hand-Off point transfers the decision to the Committee, but the Evidence Lead provides no probability of success. We confirm the *logic* of the intervention, not the *likelihood* of its success.
  4.  **It Biases Against Structural Reform:** By prioritizing "Change" over "Level" and "Actionability" over "Root Cause," this procedure inherently favors technical fixes (bed nets) over political reforms (land tenure). This is a feature of our constraints (small fund, observational data), but it is a bias nonetheless. We will fund mitigations, not transformations.

  **Conclusion:** Use this procedure to prevent the fund from investing in history lessons. We invest in margins of change. If the causal story cannot identify a margin we can move, it is not a proposal; it is a description.
