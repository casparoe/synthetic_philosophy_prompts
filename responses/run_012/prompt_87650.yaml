prompt: |-
  I keep flip-flopping on endurantism vs perdurantism. Skip the textbook tour of the temporary intrinsics problem -- I know the usual moves. What I want is a head-to-head: which of the two pays less in metaphysical coin to explain how the same thing can be straight now and bent later, and is there any real differnce between saying an object "has a property at a time" versus "has a time-indexed property"? Then pressure-test a third option I've been chewing on: the object is wholly present at each moment, and its properties are just had, full stop -- the time is a feature of the fact rather than of the object. Is that a genuine third way, or does it quietly collapse into perdurantism (or into a view where nothing really changes)? And tell me honestly where each view runs out of steam, beacuse I suspect at least one of them is doing more hand-waving than its fans admit.
