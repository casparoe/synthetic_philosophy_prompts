  Hey there, I read through the whole transcript of your fight with Marcus and I have to say it is a genuinely solid debate that touches on some of the trickiest nuances in game theory. You guys are both arguing from places that make sense, but strictly speaking within the standard framework of non-cooperative game theory, you are winning most of the technical points while Marcus is holding onto some very important intuitions that often get glossed over in textbooks. I will walk through each of the beats you asked about so you can see exactly where the line falls between who is right on the math and who is right on the vibe.

  Starting with your first clash, you asked whether Middle is dominated by any single pure move. On this specific point, Marcus is completely right and you were wrong to imply otherwise initially. If you look strictly at Top versus Middle, Top pays 0 against Column Middle while Middle pays 1, so Top does not dominate. If you look at Bottom versus Middle, Bottom pays 0 against Column Left while Middle pays 1, so Bottom does not dominate either. There is no single row that beats Middle in every column, so if the definition of dominance is restricted to pure strategies only, Middle survives. Marcus nailed this observation.

  However, the argument shifts immediately when you bring in mixed strategies, which addresses your second point about whether the Top and Bottom mix dominates Middle. Here, the math is entirely on your side. If you play Top half the time and Bottom half the time, your expected payoff against Column Left is 1.5, against Column Middle is 1.5, and against Column Right is 1. Since Middle pays 1, 1, and 0.9 respectively, the mixture yields a strictly higher payoff in every single scenario. So yes, Middle is strictly dominated by that specific mixture. You are correct on the calculation.

  This leads directly to your third point about whether it is legitimate to let mixed strategies into the definition of dominance at all. Marcus calls it a bait-and-switch because a lottery feels different than a move, but in standard game theory, you are the one who is right. The formal definition of strict dominance allows for domination by any probability distribution over the other strategies. The logic is that a rational player cares about expected payoffs, and if a randomized plan beats a pure plan in every contingency, the pure plan is irrational. Marcus is voicing a common discomfort people have with the idea that a strategy can be something you don't physically point to on the board, but technically, the definition includes mixes, so his objection here is philosophical rather than mathematical.

  Your fourth point was about circularity, specifically whether it matters if you use Top and Bottom to kill Middle even if one of them gets eliminated later. You are right here as well. The process of Iterated Elimination of Strictly Dominated Strategies is order-independent. If a strategy is strictly dominated at the start, it cannot be part of any Nash equilibrium, and removing it does not change the status of the other strategies regarding whether they were dominated initially. You do not need Top or Bottom to survive forever to justify using them to eliminate Middle in the first round. Once Middle is gone, you can check if Top or Bottom are dominated against the remaining column strategies, but that happens in a subsequent step. Marcus is worried about a logical loop that does not actually exist in the math.

  Then there is the question you raised about whether dominated and never a best reply are the same thing, and if the number of players matters. This is actually one of the few places where Marcus has a strong technical point, even if he misapplied it to this specific game. In a two-player game like yours, a strategy is strictly dominated by a mixed strategy if and only if it is never a best response to any belief about the opponent. So in this specific instance, you are right that they are equivalent. However, Marcus is correct that this equivalence breaks down in games with three or more players. In larger games, a strategy can be never a best response without being strictly dominated. So while you win the point for this specific game, Marcus wins the general knowledge point that these concepts are not identical in all contexts.

  Regarding his final substantive point about Middle being the safe move, the verdict depends on what you assume the numbers represent. You are right that within standard game theory, payoffs are assumed to be utilities, which means risk aversion is already baked into the numbers. If the numbers are utilities, then the expected utility of the mix is higher than the utility of Middle, and choosing Middle is irrational. However, Marcus is raising a valid behavioral objection if those numbers represent money rather than utility. If he is risk-averse, he might prefer a guaranteed 1 over a fifty percent chance of 3 and a fifty percent chance of 0, even if the expected value is higher. His claim that he is not an expected-value guy is a critique of the model itself, not the math inside the model. So you are right on game theory grounds, but he is right on behavioral economics grounds.

  Finally, you asked if eliminating Middle costs us any Nash equilibrium. You are absolutely right here. A fundamental theorem of game theory states that iterated elimination of strictly dominated strategies never removes a Nash equilibrium. Since Middle is strictly dominated, it cannot be played with positive probability in any equilibrium. Removing it simplifies the game without losing any solutions. Marcus is wrong to worry that you are throwing away valid outcomes.

  Now, to tell you what you are both missing, because I suspect this fight is secretly about something neither of you said out loud. The core tension here is not really about the math, but about the interpretation of rationality and commitment. You are arguing from the perspective of a solution concept where players can commit to randomization devices and care only about expected values. Marcus is arguing from a perspective of security and regret minimization. He is worried that if he tells you he is mixing, you might exploit that, or that fate might turn against him and give him the zero payoff when he could have had a guaranteed 1. He is essentially playing a maximin strategy rather than looking for a Nash equilibrium. You are missing that his resistance comes from a desire for safety guarantees that expected utility theory deliberately ignores, and he is missing that once you accept the axioms of expected utility and common knowledge of rationality, his safety preference is technically inconsistent with the payoff numbers provided. You won the argument on the rules of the game, but he won the argument on why people actually hesitate to play that way in real life.
