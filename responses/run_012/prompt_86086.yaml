      *   *Diagnosis via Case:* This shows the "Origin" isn't a single point. It's a process. Metaphysics wants a point; biology gives a process.

  4.  **Formulate the Diagnosis:**
      *   It's not *just* verbal, not *just* empirical, not *just* methodological. It's a **Category Mismatch between Metaphysical Individuation and Biological Individuation.**
      *   Metaphysics seeks *transworld identity conditions* (sharp, necessary).
      *   Biology provides *causal-historical processes* (fuzzy, contingent, gradual).
      *   The stalemate exists because Essentialists treat biological origins as *logical* constraints, while Critics treat them as *contingent* causal facts.
