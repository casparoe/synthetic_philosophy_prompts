      *   *Hypothesis 1: Verbal Dispute.* Are they talking past each other? "Person" vs. "Organism" vs. "Human Being." Kripke talks about *this person*. Biological essentialists talk about *this organism*. If the criteria for identity differ, the modal claims differ.
      *   *Hypothesis 2: Methodological Clash.* Essentialists rely on rigid designation and modal intuition (Kripke/Putnam style). Critics rely on psychological continuity or pragmatic concerns (Lockean/Parfit style). These are different *games*.
      *   *Hypothesis 3: Equivocation on "Origin".* Does origin mean gametes? Zygote? Conception? Implantation? Genetic code? The user's IVF case highlights this.
      *   *Hypothesis 4: The "Haecceity" Problem.* Is there a "this-ness" independent of properties? If yes, origin matters. If no, origin is just a cluster of properties.
      *   *Hypothesis 5: Empirical Underdetermination.* Biology doesn't give a sharp cutoff for individuation (twinning, chimerism). Metaphysics tries to impose sharp cutoffs on fuzzy biological processes.

  3.  **Analyze the User's IVF Case:**
      *   *Scenario:* Embryo A splits -> A1 (implanted) & A2 (frozen). A2 nucleus -> Donor Egg B (enucleated) -> Child C.
