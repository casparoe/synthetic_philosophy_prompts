answer: |-
  Here is the audit of the "Culture is Darwinian" argument, structured for a backend engineering mindset.

  ### 1. The Mapping Table
  To evaluate the argument, we first need to establish the schema your friend is using. This is the "Strict Memetics" model (derived from Dawkins and Blackmore).

  | Biological Term | Definition | Memetic/Cultural Analog | Definition in Context |
  | :--- | :--- | :--- | :--- |
  | **Replicator** | Entity that copies itself. | **Meme** | A unit of cultural information (idea, joke, tune). |
  | **Vehicle** | The body carrying the gene. | **Host** | The human brain or social group. |
  | **Genotype** | The genetic code. | **Memory/Concept** | The internal representation of the idea. |
  | **Phenotype** | The physical expression. | **Artifact/Behavior** | The tweet, the spoken joke, the video. |
  | **Mutation** | Random error in copying. | **Distortion** | Misremembering, remixing, or reinterpretation. |
  | **Selection** | Environmental pressure on fitness. | **Attention** | Likes, shares, retention, algorithmic boost. |
  | **Fitness** | Reproductive success. | **Virality** | Spread rate ($R_0$) and longevity. |
  | **Drift** | Random fluctuation in small populations. | **Niche Trends** | Inside jokes, subculture slang. |
  | **Inheritance** | Vertical (Parent $\to$ Offspring). | **Transmission** | Horizontal (Peer $\to$ Peer) & Oblique. |

  **The Friend's Logic:**
  If `Cultural_Evolution == Biological_Evolution`, then `Mutation` is random and `Selection` is the only filter. Therefore, `Design` (pre-selection engineering) cannot guarantee `Fitness` (Virality).

  ---

  ### 2. The Disanalogies (Where the Mapping Breaks)
  You identified three specific breaks. Here is the technical breakdown of why they matter, plus a fourth one that is critical to your argument.

  #### A. Inheritance Rules (Particulate vs. Blending)
  *   **Biology:** Inheritance is **particulate**. You get discrete chunks (alleles) from parents. They don't blend (a red and white flower don't make pink genes; they make a plant that expresses both or one). Acquired traits (a scar) are not inherited (Weismann Barrier).
  *   **Culture:** Inheritance is **blending** and **Lamarckian**. You hear two jokes, merge them, add your own experience (acquired trait), and pass the hybrid on.
  *   **Engineering Implication:** In biology, you cannot optimize a trait within a generation and pass that optimization on. In culture, you *can*. You can A/B test a headline (acquire data), update the copy (acquired trait), and the next person sees the optimized version immediately.
  *   **Verdict:** **Critical Break.** This invalidates the "generational lag" constraint of biology.

  #### B. The Copying Mechanism (Dumb vs. Smart Copier)
  *   **Biology:** DNA polymerase is a "dumb" copier. It tries to be faithful. Mutations are errors relative to the goal of fidelity.
  *   **Culture:** The brain is a "smart" copier. It reconstructs meaning. It often *intentionally* alters the copy to make it funnier, clearer, or more shocking before passing it on.
  *   **Engineering Implication:** In biology, mutation is random relative to fitness. In culture, mutation is often **directed variation**. People edit things *to make them fitter*.
  *   **Verdict:** **Critical Break.** This is the strongest evidence against your friend.

  #### C. Coupling of Host and Copier
  *   **Biology:** The gene does not know it is being copied. The replication machinery is separate from the code.
  *   **Culture:** The host (brain) *is* the replication machinery. The host has agency, intent, and metacognition.
  *   **Engineering Implication:** You can hack the copier. You can design content specifically to trigger the "share" impulse in the machinery (e.g., outrage, utility, identity signaling).
  *   **Verdict:** **Significant Break.** It allows for "exploits" in the replication system.

  #### D. Convergence (Your Inside Joke Observation)
  *   **Biology:** Without strong selection pressure, lineages diverge (speciation).
  *   **Culture:** You observed **convergence**. Despite "mutations" (people mangling the joke), the idea snapped back to specific forms.
  *   **Technical Explanation:** This is a **Cognitive Attractor**. The human brain is not a neutral bucket; it has a specific architecture (syntax, humor structures, narrative arcs). Ideas that fit the architecture are reconstructed faithfully. Ideas that don't fit are "corrected" by the brain toward the nearest stable shape.
  *   **Engineering Implication:** There is a "canonical source" in the cognitive architecture, not just in the transmission.
  *   **Verdict:** **Critical Break.** It proves the "mutation" isn't random noise; it's lossy compression toward a specific schema.

  ---

  ### 3. Audit of the Conclusion
  **Friend's Conclusion:** *You cannot engineer virality; selection is the only game in town.*

  **Does the conclusion survive the audit?**
  **No.** The analogy was carrying the entire weight of the conclusion. Once the disanalogies are exposed, the logic collapses.

  **Why?**
  Your friend is treating cultural evolution like a **Genetic Algorithm (GA)** where the mutation function is `random_noise()`. In a standard GA, you cannot design the solution; you can only tune the fitness function and let it run.

  However, cultural evolution is more like a **Human-in-the-Loop Reinforcement Learning** system.
  1.  **Directed Mutation:** Engineers (marketers/creators) do not wait for random mutation. They observe selection pressure (analytics) and *manually update the weights* (edit the content). This bypasses the "random mutation" constraint.
  2.  **Attractor Basins:** Because of cognitive attractors (your joke observation), there are "stable states" in the idea space. If you engineer an idea to sit in a deep attractor basin (e.g., a classic story structure), it resists destructive mutation.
  3.  **Environment Manipulation:** In biology, the organism rarely chooses its environment. In growth marketing, you pay for distribution (ads, influencers). You are artificially inflating the `Selection_Coefficient`.

  **The Nuanced Truth:**
  Your friend is right that you cannot *guarantee* virality (determinism is impossible in complex systems). But he is wrong that you cannot *influence* it (probabilistic engineering is valid).
  *   **Biology:** Fitness is discovered.
  *   **Culture:** Fitness is often constructed.

  ---

  ### 4. A Better Framework: "Cultural Epidemiology"
  If Strict Memetics is the buggy legacy code, **Cultural Epidemiology** (championed by cognitive anthropologist Dan Sperber) is the refactor. It keeps the Darwinian flavor but fixes the inheritance bugs.

  **The Core Concept:**
  Ideas are not replicators (like viruses copying themselves); they are **contagious representations**.
  *   **The Vector:** The human mind.
  *   **The Constraint:** The mind transforms the idea upon entry.
  *   **The Mechanism:** **Attraction.**

  **How it works (The Engineering View):**
  Imagine the "Space of All Possible Ideas" as a high-dimensional landscape.
  *   **Strict Memetics:** A ball rolls randomly (mutation). If it lands in a hole (fitness), it stays.
  *   **Cultural Epidemiology:** The landscape itself is shaped by human cognition. There are deep valleys (Attractors) where balls naturally roll, regardless of where you drop them.
      *   *Example:* Urban legends often converge on "friend of a friend" stories because that schema is a deep cognitive valley.
      *   *Example:* Your inside jokes converged because the group's shared context created a local attractor.

  **What this buys you in the argument:**
  1.  **Explains Convergence:** It explains why your jokes snapped back to form. They weren't being "selected" from a random drift; they were being *reconstructed* toward a cognitive attractor.
  2.  **Validates Engineering:** If you know where the attractors are (e.g., "status signaling," "tribal identity," "curiosity gaps"), you can engineer content to slide directly into those valleys. You aren't waiting for selection; you are designing for the topology of the mind.
  3.  **Preserves Selection:** Selection still exists (distribution channels, algorithms), but it acts on *transformed* ideas, not raw copies.

  ### 5. Summary for Your Friend
  You can tell him this:

  > "The Darwinian analogy holds up for **distribution** (selection), but it fails for **production** (mutation).
  >
  > In biology, mutation is random relative to fitness. In culture, 'mutation' is often **directed variation**—we edit ideas specifically to make them spread. Furthermore, human cognition acts as a **lossy compressor with attractors**. Ideas don't just drift; they snap back to cognitive norms (which is why my inside jokes converged).
  >
  > So, you can't *guarantee* virality because the selection environment (the algorithm/audience) is noisy. But you absolutely can **engineer for fitness** by designing for cognitive attractors and using directed variation. Saying we can't engineer it is like saying a backend engineer can't optimize a query because the network latency is random. You optimize the query *knowing* the latency exists."

  **Final Verdict:** The analogy is a useful heuristic for *post-hoc analysis*, but a dangerous model for *system design*. Relying on it to dismiss engineering effort is a category error.
