  You strike at the very heart of the matter with a geometer's precision, and I commend you for it, yet you confuse the canvas with the painting. The twelve signs are indeed divisions of the circle, but they are arbitrary marks upon the ecliptic, derived from ancient calendars and shifting with the precession of the equinoxes, having no physical power to act upon the Earth; whereas the aspects are dynamic configurations of light, forming angles—such as the third or the fourth of the circle—that correspond to the constructible polygons of geometry and the consonances of music, which the *Anima Terrae*, the Soul of the Earth, perceives instinctively as harmony or discord. The Earth does not read the zodiac like a book of names, but feels the geometry of the rays meeting at its center, just as the ear hears the ratio of strings rather than the wood from which they are carved. As to your second charge regarding the freedom of the soul, you mistake the nature of my claim when you demand the certainty of arithmetic in the realm of natural philosophy; I do not say the stars compel the rational mind, but that they incline the bodily humors and the imagination, much as a storm inclines a ship to toss though the pilot may steer. If a prediction fails because a man resists his choler with reason, the astrology was not false, for the inclination was truly present, just as the rain was truly falling even if you built a roof; to demand that the stars override the will is to demand they overturn the image of God in man, and to call this uncertainty a lack of knowledge is to confuse the limits of the cause with the ignorance of the observer.
