  **CENTRAL INSTITUTE FOR UNIFIED PICTORIAL SCIENCE**
  **GUIDELINES FOR THE CONSTRUCTION AND USE OF PICTURE STATEMENTS (7th ED.)**
  **REF: CIUPS-STD-704**

  **1.0 PREFACE**
  The Central Institute for Unified Pictorial Science (CIUPS) releases this seventh edition to address persistent ambiguities reported in field deployments of the Unified Pictorial Language (UPL). While the core vocabulary remains stable, users continue to struggle with the syntactic arrangement of pictograms. It must be reiterated that the UPL is not a decorative aid to text but a replacement for it. Users who find themselves writing captions to explain their picture statements are hereby reminded that they are failing to utilize the system correctly. The following protocols clarify how logical structure is to be rendered visually without recourse to the very linguistic ambiguities the UPL was designed to eliminate.

  **2.0 LOGICAL OPERATORS AND NEGATION**
  A common error involves the depiction of negation. In previous editions, the use of a red cross (X) over a pictogram was permitted to indicate absence. Field reports indicate that users frequently interpret the cross as "danger" or "prohibited" rather than logical falsity. Consequently, effective immediately, negation shall be indicated by the *Grey-Out Protocol*. To depict "There are no cows in the field," the operator must render the cow pictogram in 50% grayscale saturation against a white background. 

  Disjunction (OR) presents similar difficulties. Users are forbidden from drawing a forked path, which implies spatial movement rather than logical possibility. Instead, operators must place the alternative pictograms within a single *Dotted Boundary Box*. Please note: The dotted line itself is not a picture of a box; it is a syntactic marker of logical scope. Users should not attempt to visualize the line as a physical barrier.

  **3.0 ASSERTION VS. DESCRIPTION**
  Confusion persists regarding the distinction between a picture of a fact and a picture of a proposition. A pictogram of a burning building is merely a concept; it does not claim that a building is currently burning. To assert a fact, the pictogram must be enclosed within a solid black *Frame of Assertion*. 

  Operators often ask: "How do we picture a false assertion?" The answer is: You do not. A False Assertion is depicted as a negated fact (see Section 2.0). However, users must not confuse the *Frame of Assertion* with a physical window frame. The frame indicates that the content within is claimed to correspond to reality. If the content is hypothetical, use the *Dashed Frame*. Do not combine solid and dashed lines, as this creates a modal ambiguity regarding necessity versus contingency.

  **4.0 ABSTRACT CONCEPTS AND ECONOMIC VALUES**
  Representing non-observable entities such as "inflation," "justice," or "unemployment" requires strict adherence to the *Aggregation Rule*. One cannot draw a picture of "value." Therefore, economic increase is depicted by the multiplication of unit pictograms (e.g., ten coin icons rather than one large coin). 

  Normative claims ("ought") remain problematic. The UPL is descriptive. To depict "Workers ought to strike," operators must depict "Workers striking" within a *Goal Orientation Arrow*. However, operators are warned not to imbue the arrow with moral force. The arrow indicates directionality of planned action, not ethical imperative. If users feel the need to add an exclamation point to convey urgency, they are reminded that punctuation is verbal smuggling and is strictly prohibited.

  **5.0 AMBIGUITY RESOLUTION**
  In cases where a pictogram is susceptible to multiple readings (e.g., the *Canine Unit*, which may be read as "dog," "wolf," or "pet"), the *Priority of Context* rule applies. The meaning is determined by the surrounding pictograms. If a *Canine Unit* appears next to a *House Unit*, it is a "pet." If it appears next to a *Tree Unit* and a *Hunter Unit*, it is "wild game." 

  If ambiguity persists, the operator must not add text labels. Instead, they must submit a *Clarification Request* to the Regional Bureau. During the review period, the statement is considered void. It is better to have no statement than an ambiguous one.

  **6.0 METAPHYSICAL DEVIATIONS**
  The UPL is designed to make metaphysical claims ungrammatical. Concepts such as "The Soul," "The Absolute," or "Divine Will" have no corresponding pictograms because they have no empirical referents. Despite this, citizens frequently attempt to construct metaphysical statements using composite imagery (e.g., a human figure exiting a body). 

  Upon encountering such a construction, the Inspector must not argue the theological point. The Inspector must simply classify the statement as *Category Error: Type 4*. The statement is not false; it is unintelligible within the UPL syntax. The citizen should be issued a Form 88-B (Request for Empirical Reformatting). If the citizen insists that their experience transcends pictorial representation, the Inspector is authorized to remind them that if it cannot be pictured, it cannot be scientifically unified. 

  **7.0 CONCLUSION**
  The Institute acknowledges that these guidelines are themselves written in ordinary language. This is a temporary necessity required to facilitate the transition to a fully pictorial administration. Users are advised not to scrutinize this paradox too closely, as doing so may undermine confidence in the pictograms themselves. Trust the image. The image does not lie; only the viewer misinterprets.

  *Approved by the Committee on Visual Syntax, 1954.*
