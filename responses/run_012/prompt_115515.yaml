answer: |-
  You are a sociologist of science studying the very thing you are fighting about. That irony is not lost on me, and it should be the lever you use to pry this open.

  Here is the breakdown of your four points, the moral core of the conflict, and how to handle the lab meeting.

  ### Which of the four points land?

  **Point 1 (Her Past Behavior): Defensive.**
  This is *tu quoque*. Logically, her past mistakes do not validate your current practice. People evolve. If she genuinely learned from a seminar, crediting her growth is the generous move. Using it as a shield makes you look like you're digging in rather than defending a principle.

  **Point 2 (Her Complicity): Lands.**
  This is about **unjust enrichment**. If the labor is exploitative enough to warrant a co-author boycott, she cannot ethically remain a co-author while demanding you fix it. She is trying to have it both ways: moral superiority *and* CV credit. This undermines her standing.

  **Point 3 (Her Inaction): Lands Hard.**
  She is engaging in **moral posturing**. If she believed this was genuine exploitation, a sociologist would have a strategy to remediate it (e.g., "I will step down unless we offer authorship," or "I will fund a stipend so they qualify"). Refusing to act while condemning you reveals that her goal is not fixing the system, but signaling her virtue *against* you.

  **Point 4 (The Advisor): Lands Hardest.**
  This is the smoking gun. This reveals the conflict is not about *justice*, it is about **power and safety**. Challenging you (a peer) is safe; challenging the PI (who controls her funding and letters) is risky. By punching down at you while ignoring the PI who sets the actual lab policy, she proves this is a status maneuver, not an ethical stand.

  ### What is morally doing the work here?

  The concept your girlfriend was reaching for is **Standing**.

  In moral philosophy and discourse ethics, you lack *standing* to blame someone for a violation if you are complicit in the same violation, especially if you benefit from it and refuse to challenge the primary architect of it. Priya lacks the standing to judge you because:
  1.  She benefits from the labor (co-authorship).
  2.  She tolerates the primary offender (the Advisor).
  3.  She offers no sacrificial solution (she won't quit, she won't confront the PI).

  She is using the undergrad as a **moral pawn** to gain leverage over you. The undergrad is likely fine (acknowledgments are standard for pure coding in many sociology subfields); Priya is the one creating the friction.

  ### What to say at lab meeting

  Do not use "I statements." Do not apologize. Do not get emotional. Speak as a sociologist of science to a colleague. You need to reframe this from "You are a bad person" to "You are misapplying normative standards."

  **Say this:**

  > "Priya, I've thought about your concerns regarding the undergrad's credit. I want to address the normative framework here. In our subfield, authorship requires intellectual contribution to design or analysis, not just labor execution. This project follows established disciplinary norms and the precedent set by this lab's prior publications, including the PI's work.
  >
  > If you believe this standard constitutes exploitation, that is a systemic critique that applies to the PI's papers and the department's norms, not just this project. If you feel the ethical breach is severe enough to warrant authorship, the consistent position would be to withhold your own authorship until the undergrad is included, or to raise this with the PI to change lab policy.
  >
  > I am not comfortable changing authorship criteria retroactively on a project where the labor was compensated and acknowledged according to standard practice. If you feel you cannot remain on the project under these standard conditions, I will respect your decision to withdraw, but I will not be offering gift authorship."

  ### Why this works
  1.  **It invokes the field:** You aren't making this up; you're citing disciplinary norms (which you study).
  2.  **It exposes the inconsistency:** It forces her to choose between her CV and her conscience.
  3.  **It calls the bluff:** Most people want authorship more than they want moral purity. She likely won't quit.
  4.  **It protects you:** You are following the PI's lead. If Priya wants to fight the PI, let her fight the PI.

  ### The Verdict

  You do not owe her a change in policy. Gift authorship violates ethical guidelines almost as much as exploitation does if the criteria aren't met. You do owe her a response that clarifies the norms and exposes the inconsistency of her position without getting dragged into a personal moral indictment.

