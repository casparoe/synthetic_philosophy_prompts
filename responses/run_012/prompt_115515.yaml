prompt: |-
  I'm a fifth-year PhD student in sociology — I study how research labs organize credit and authorship — and I need an outside read on an argument I keep having with my labmate, because I'm fairly sure I'm right and also fairly sure thats the whole problem.

  Here's the setup. Our lab has undergrads who do the coding and data entry. On the project I run, the undergrad who's done most of the coding gets an acknowledgment line, not authorship. That's how the project was set up before I inherited it, and I haven't changed it.

  Priya, my labmate, has started coming at me about this. In lab meeting, in Slack, over coffee. Her line is that I'm exploiting the undergrads and that I should push for them to be authors, and that she isn't sure she can stay on the project if I don't.

  Four things are eating at me.

  1. Two years ago Priya ran a study where an undergrad did all the coding and got a thank-you in the appendix. When I brought this up she said — and I believe her, which is the infuriating part — that she was wrong then, she changed her mind after a seminar, and that's exactly why she's saying something now. So she isn't doing the thing she's on my case about. She did it, stopped, and now she's coming after me for it.

  2. She's a co-author on my project. She'll be on the paper the undergrad's coding makes possible. So she's benifiting from the arrangement she's complaining about. That seems like it should matter, but I can't tell which direction it cuts — either she's implicated so she should pipe down, or she's implicated so she's the only one with any business saying it, since she's not pretending to be clean.

  3. She says she isn't going to do anything. Not going to the advisor, not emailing the undergrad, not filing anything. She just thinks less of me now and wants me to know it. There's no demand I can actually comply with. Does that change the picture, or is that just a detail?

  4. Our advisor does exactly this to all of us — one of her papers has a former student who coded for a year and got an acknowledgment — and Priya has never said a word to her about it. That's the one I keep coming back to when I'm mad.

  My girlfriend, who's in the philosophy department, so grain of salt, said something about Priya not being "in a position" to hold this against me, and I honestly can't tell whether that's a real distinction or a fancy way of saying "she started it." There's a name for what's bugging me here and I can't find it.

  So: which of these four actually lands, and which is just me being defensive? I want the honest answer, not the one that lets me off the hook — if the answer is "she's right, change the policy," say that and say why. And what do I actually say to her at lab meeting next week? Please don't give me "communicate openly and use I-statements"; I want to know what's morally doing the work in this situation. End with one line in this format — \answer{...} — with a short phrase saying whether I owe her a response, a change, or nothing, like \answer{reply but no change}.
