      3.  What is Ruled Out (Lexical, Typological).
      4.  Underdetermination (Where theories converge).
      5.  The "Contested Concept" Paradox.
      6.  Implications of Switching to Floor/Veto Rules.
      7.  The "Who Decides" problem under both rules.
      8.  Conclusion/Recommendation.

  *(Self-Correction during final review)*: Wait, I need to make sure I don't validate the idea that *all* scholars claim it's essentially contested *and* use scalar measures. Many who use scalar measures explicitly reject the "essentially contested" label for the sake of measurement. I should clarify that the tension exists *across* the discipline, not necessarily within every single scholar's mind.

  Okay, ready to write. The tone should be respectful of the user's deep engagement with the material. They clearly know the literature (references to backsliding, compensatory vs. veto, lexical priority). I will match that level.

  *Key references to keep in mind (mentally):* Sartori (ladder of abstraction), Collier & Levitsky (diminished subtypes), Przeworski (minimalist), Lauth (matrix of democracy), V-Dem methodology papers.

  *Let's structure the "Framing" answer carefully.* The user asks: "If I've got the framing wrong... tell me what the better-posed version of the question would be."
  *My take:* The framing is actually quite good. It's not "wrong." But it assumes a stronger link between *method* and *ontology* than some practitioners would admit. The better question might be about *validity* rather than *commitment*. But I will affirm their intuition that method *is* theory.

  *Wait, one more thing:* The user asks about "backsliding." I need to be specific. If I use a veto rule, does backsliding stop being a matter of degree? Yes, mostly. But you can have backsliding *within* the democratic box before hitting the floor. I need to nuance that.

