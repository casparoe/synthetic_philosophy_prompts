prompt: |-
  I am a novelist, three years into a book set in a provincial capital where one family has, for four decades, placed its people in every office that matters — the water board, the licensing bureau, the land registry — and where, at every wedding in that city, a share of the room's envelopes finds its way to the family's fixer. The book has a journalist in it, and an anticorruption prosecutor, and I have found that I cannot write either of them honestly until I settle a question I keep getting wrong. So let me state the position I have arrived at, and ask you to tell me what should move me off it.

  The position: corruption is not a natural kind but a normative one, and its content is fixed by the norms of office that a given polity actually holds, rather than by any trans-contextual standard. The definition that circulates in the governance literature — corruption as the misuse of entrusted power for private gain — is not a neutral description but one local normative order's self-understanding, promoted to a yardstick and exported. It follows that there is no context-independent answer to whether a gift, a favor, a job for a kinsman, or a payment for a permit is corrupt: the answer depends on what the relevant office, in that place, is understood to be for. Call this normative localism about corruption.

  What I want is a map of its exposure. Take a position — I would rather have a verdict with its reasons than a balanced menu of options.

  1. Say which of my commitments is doing the real work. In particular, tell me whether the view collapses into the truism that evaluation is context-sensitive, or whether it claims something a universalist must deny. If the honest verdict is that it has been qualified into something nobody would dispute, say so, and tell me whether that is fatal or merely a rebranding.

  2. Give me what would count against it, ranked from decisive to merely awkward, and distinguish conceptual defeaters from empirical ones: cases, findings, or developments that would show I am describing something real but calling it by the wrong name, or that the trans-contextual standard has independent purchase of its own.

  3. Say what a committed localist has to concede. I want the costs the view's own defenders would own, not only the critics' bill of particulars.

  4. Work through the cases that worry me most. The boundary between a gift and a bribe, and whether anything in my framework draws it non-arbitrarily — openness, diffuseness, timing, reciprocity, the absence of a specific quid pro quo. Clientelism as a form of representation where programmatic parties are weak, and whether that counts as a partial vindication of localism or simply changes the subject. Conduct that is corrupt in one jurisdiction and lawful in another, such as lobbying, influence, and revolving doors, where I need to know whether I am committed to the moral property differing or only the legal one, and whether conceding the latter collapses the view. And the rotten office: what the localist says about an office whose own norms are predatory, and about colonial and authoritarian administrations.

  5. Tell me what localism predicts that universalism does not, and whether the cross-national perception indices are, on my view, merely biased — a complaint I can accommodate — or category-incoherent, which is a prediction I am making and which could be tested. I want to see whether my novel is placing the localist's bets or quietly hedging them.

  One thing I would find most persuasive, if it is true: evidence that the people closest to a practice are its harshest judges, and that the condemnation is native rather than imported. If that is the rule rather than the exception, say so, and tell me what it does to my position.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist, three years into a book. Setting: A provincial capital dominated by one family for 40 years (kleptocracy/nepotism/patronage). Characters: Journalist, anticorruption prosecutor.
      *   **Problem:** The user is stuck on a philosophical/sociological question regarding the definition of corruption. They can't write the characters honestly until they resolve this.
      *   **User's Position:** "Normative Localism about Corruption." Corruption is not a natural kind but a normative one. Its content is fixed by the *local* norms of office, not trans-contextual standards. The standard definition (misuse of entrusted power for private gain) is just one local order's self-understanding exported globally.
      *   **Task:** The user wants a "verdict with its reasons," not a balanced menu. They want to be moved off their position if possible.
      *   **Specific Requirements:**
          1.  Identify the core commitment (truism vs. substantive claim).
          2.  Provide counter-evidence/arguments (ranked: decisive to awkward; conceptual vs. empirical).
          3.  State the costs/concessions a committed localist must make.
          4.  Work through specific hard cases (gift vs. bribe, clientelism, lobbying/revolving doors, rotten/authoritarian offices).
          5.  Predictive power (what does localism predict that universalism doesn't? Perception indices).
          6.  **Crucial Test:** Evidence that locals are often the *harshest* judges of their own corruption (native condemnation).

  2.  **Deconstruct the User's Position (Normative Localism):**
      *   *Core Claim:* $X$ is corrupt iff $X$ violates the normative expectations of the specific office within that specific polity.
      *   *Implication:* If the local norm says "officials take envelopes at weddings," it's not corruption *there*, even if the UN says it is.
      *   *Strength:* Avoids ethnocentrism, acknowledges functional role of patronage in weak states.
      *   *Weakness:* Risks moral relativism, cannot condemn totalitarian/predatory regimes if their "internal norms" allow predation, ignores the *purpose* of public office (public good).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. It's a classic debate in political science/philosophy (Nye vs. Scott vs. Heidenheimer). Validate the novelist's struggle—it's the engine of the conflict between the journalist (universalist?) and the fixer (localist?).

      *   **1. The Core Commitment:**
          *   Is it a truism? "Evaluation is context-sensitive" is weak. Everyone agrees context matters for *severity* or *classification*.
          *   The substantive claim: "Legitimacy is solely determined by internal consensus."
          *   *Verdict:* It's not a truism. It makes a strong claim: *External* standards have no moral traction. This is vulnerable. It collapses the distinction between "accepted" and "just."

      *   **2. What Counts Against It (Ranked):**
          *   *Decisive (Conceptual):* The "Public Trust" Paradox. Public office implies a duty to the *public*, not just the *local elite*. If the local norm violates the constitutive purpose of the office (serving the common good), it's corrupt by definition, regardless of local acceptance. (Dennis Thompson/Philosophical argument).
          *   *Decisive (Empirical/Political):* The "Native Condemnation" argument (The user's specific request). If locals protest, strike, or vote against the "norm," the "local norm" isn't actually the norm. It's the *elite's* norm, not the *polity's* norm.
          *   *Awkward (Empirical):* Capital flight. Elites sending money abroad suggests *they* don't trust the local system they built.
          *   *Awkward (Conceptual):* The "Rotten Office" problem (addressed later, but relevant here).

      *   **3. Costs to the Localist:**
          *   Must concede that "reform" is just "changing norms," not "fixing broken things."
          *   Must concede that the anticorruption prosecutor in the novel is essentially an agent of cultural imperialism (or a revolutionary, but not a restorer of justice).
          *   Must accept that there is no vocabulary to condemn a mafia state if the mafia writes the norms.

      *   **4. Hard Cases:**
          *   *Gift vs. Bribe:* Localism says "look at the norm." *Problem:* Norms are often opaque or contested. *Solution:* Focus on *secrecy* and *exclusivity*. If the gift is hidden, it violates the norm of transparency even in patronage systems.
          *   *Clientelism:* Is it representation? Localism says yes. *Counter:* It distorts the *equality* of the vote. It's a market transaction, not representation.
          *   *Lobbying/Revolving Door:* Localism says "Legal here = Not corrupt." *Counter:* This exposes the weakness of localism. If the law is bought, the norm is corrupted. Legal $\neq$ Normative.
          *   *Rotten/Authoritarian Office:* This is the killer. If the "norm" of the Gestapo was to suppress Jews, was that corrupt? Localism struggles here. It must distinguish between *regime norms* and *office norms*. Public office serves the *people*, not the *regime*.

      *   **5. Predictions & Perception Indices:**
          *   *Universalism predicts:* High correlation between expert assessments and citizen experience of bribery.
          *   *Localism predicts:* Perception indices (like CPI) will correlate with Western alignment, not local reality.
          *   *The Twist:* Data shows locals *agree* with CPI often. They know they live in a corrupt system. This undermines Localism.
          *   *Novel Implication:* If the locals in the book hate the family, the Localist view is factually wrong about *that* city.

      *   **6. The "Native Condemnation" (The Persuasive Evidence):**
          *   *Evidence:* Afrobarometer, Latinobarómetro. People in high-corruption countries rate corruption as a top problem. They don't see it as "culture"; they see it as "theft."
          *   *Impact on Position:* Devastating. It shows the "local norm" is actually an *imposed* practice by elites, not a shared cultural understanding. The "Normative Localism" confuses *elite practice* with *public norm*.

  4.  **Refining the Tone:**
      *   The user is a novelist. They need narrative truth, not just academic pedantry. The language should be precise but evocative.
      *   The verdict needs to be firm. "You are half-right, but the half that is wrong will kill your book's moral tension."
      *   The distinction between *Descriptive* Localism (this is how things work) and *Normative* Localism (this is how things *should* be judged) is key.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about "Natural Kind vs. Normative"?
      *   *Adjustment:* Ensure I address that corruption *is* a normative concept, but the *source* of the norm is the dispute.
      *   *Check:* Did I address the "Rotten Office"?
      *   *Adjustment:* Make sure to distinguish between the *regime's* rules and the *office's* purpose.
      *   *Check:* The user asked for a verdict.
      *   *Decision:* The verdict is that Normative Localism is descriptively useful but morally bankrupt. It fails the "Native Condemnation" test.

  6.  **Final Polish:** Organize with clear headings matching the user's 5 points + the specific evidence request. Ensure the advice helps the *novel* (the journalist vs. prosecutor dynamic).

      *(Self-Correction on the "Verdict"):* I shouldn't just say "You're wrong." I should say "Your position works for the Fixer, but it fails for the Journalist and Prosecutor, and reality sides with them." This gives the user dramatic tension.

      *(Refining the "Natural Kind" point):* Corruption *is* a normative kind. The user is right there. The error is thinking the *local* norm is the *only* norm. The "Public" in public office creates a trans-contextual norm.

      *(Final check on the "Native Condemnation"):* This is the strongest empirical point. Afrobarometer data is the smoking gun. Locals hate corruption even where it's endemic. This proves it's not a "local norm" in the sense of moral acceptance, but a "local equilibrium" of fear/pragmatism.

  7.  **Final Output Generation** (incorporating these thoughts into the structured response).
answer: |-
  Here is the verdict you asked for, followed by the map of exposure.

  **The Verdict:**
  Your position, **Normative Localism**, is descriptively potent but morally collapsible. It is not a truism; it is a substantive claim that legitimacy flows exclusively from internal consensus. This claim is falsified by the empirical reality of **native condemnation**. In most systems that appear corrupt to the outside, the local population does not view the practices as legitimate cultural norms; they view them as predatory impositions.

  If you write your journalist and prosecutor believing that corruption is merely a clash of normative orders, you will drain their conflict of moral urgency. They are not fighting "Western standards vs. Local tradition." They are fighting "Elite predation vs. Public trust." The data suggests the public is on their side, not the fixer's.

  Here is the exposure of your position, point by point.

  ***

  ### 1. The Core Commitment: Truism or Substantive Claim?

  You ask if this collapses into the truism that "evaluation is context-sensitive." It does not.

  *   **The Truism:** "Whether an act is *wrong* depends on the expectations of the office." (Everyone agrees: A judge taking a fee is different from a priest taking a fee.)
  *   **Your Substantive Claim:** "Whether an act is *corrupt* depends *only* on the local normative order, and no external standard has purchase."

  This is a strong claim that a universalist must deny. The universalist argues that the concept of **Public Office** carries a trans-contextual normative load: the duty to act for the *public good* rather than *private interest*. If a local norm violates the constitutive purpose of public office (serving the public), it is corrupt *even if locally accepted*.

  **Is this fatal?**
  For a sociologist, no. For a novelist, yes. If you adopt Normative Localism, your anticorruption prosecutor becomes a colonial agent, imposing foreign values. Your journalist becomes a cultural translator, not a truth-teller. If the locals *accept* the envelopes at weddings as a legitimate tax on social capital, there is no injustice to expose, only a difference in custom. Your plot relies on the intuition that something is *broken*, not just *different*. Localism denies the breakage.

  ### 2. What Counts Against It (Ranked)

  **A. Decisive Conceptual Defeater: The "Public Trust" Paradox**
  Corruption is conceptually tied to the betrayal of a specific trust: the trust that an officeholder serves the constituency, not the self. This definition is not Western; it is functional.
  *   *The Defeater:* If a local norm dictates that a water board official must divert water to his cousin's farm, he is satisfying the *local* norm but violating the *office's* norm (distributing water to the public).
  *   *Why it hurts:* Localism conflates "the regime's rules" with "the office's purpose." If you define corruption by the local power structure's norms, a Mafia state cannot be corrupt by definition, because it follows its own rules. This renders the word "corruption" useless for distinguishing a government from a criminal syndicate.

  **B. Decisive Empirical Defeater: Native Condemnation (The "Smoking Gun")**
  You asked for evidence that people closest to a practice are its harshest judges. **This is the rule, not the exception.**
  *   *The Evidence:* Afrobarometer and Latinobarómetro data consistently show that in countries with high objective corruption, citizen *perception* of corruption is even higher. Citizens in these polities do not say, "This is our way of sharing wealth." They say, "The leaders are stealing."
  *   *The Impact:* This destroys the premise that the "local normative order" accepts the corruption. The "local norm" is actually an *elite equilibrium* enforced by coercion or necessity, not a shared moral understanding. The "fixer" in your book represents the elite norm, not the polity's norm.

  **C. Awkward Empirical Finding: Capital Flight**
  *   *The Finding:* The families who build these local systems often send their stolen wealth to London, New York, or Singapore, and send their children to Western universities.
  *   *Why it hurts:* If the local normative order were truly self-contained and legitimate, the elites would trust it with their own futures. Their lack of trust reveals they view their own system as predatory and unstable, undermining the claim that it constitutes a valid moral order.

  ### 3. What a Committed Localist Must Concede

  If you hold this line, your characters must accept the following costs:

  1.  **The Prosecutor is an Imperialist:** The anticorruption prosecutor cannot claim to be restoring justice. They are attempting to overwrite a functional (if unequal) social operating system with an imported one. Their victory is not moral; it is cultural conquest.
  2.  **No Vocabulary for Predation:** You lose the ability to condemn a system that is legally consistent but morally rotten. If the local norm *is* the standard, then a law that says "The Governor owns all land" is not corrupt; it is just a different property regime.
  3.  **Reform is Destabilization:** Anti-corruption efforts are not "cleaning up"; they are "breaking the machine." In a weak state, patronage often provides the only social safety net. The localist must concede that destroying the corruption might destroy the only welfare system the poor have, leading to chaos. (This is a strong argument for your Fixer character, but a weak one for your Journalist).

  ### 4. Working Through the Hard Cases

  **The Gift vs. The Bribe**
  *   *Localist View:* It depends on the norm. If envelopes at weddings are expected, it's a gift.
  *   *The Flaw:* This ignores **secrecy** and **exclusivity**.
  *   *The Fix:* A gift is public and diffuse (everyone gives). A bribe is specific and often hidden. If the envelope is handed in a back room, or if the amount scales with the *official power* of the guest rather than their *kinship distance*, it is a bribe, regardless of local custom. The localist cannot draw this line without importing a universal norm of transparency.

  **Clientelism as Representation**
  *   *Localist View:* In weak states, parties don't offer policy; they offer goods. This is a rational adaptation, a form of representation.
  *   *The Verdict:* This is partially true but morally insufficient. It counts as representation only if the voter can *withdraw* the support. If the system is rigged (as in your book: "four decades... every office that matters"), it is not clientelism; it is **extortion**. The localist must concede that without political competition, patronage is not a social contract; it is a protection racket.

  **Lobbying and Revolving Doors (The Mirror Test)**
  *   *The Problem:* You note that lobbying is legal in the West but looks like bribery elsewhere.
  *   *The Localist Trap:* If you say "It's corrupt there but not here," you are a universalist. If you say "It's not corrupt anywhere," you are a cynic.
  *   *The Resolution:* The distinction is not legal; it is **equality of access**. Lobbying is corrupt if it grants *exclusive* access that drowns out the public interest. If the local system allows the Family to buy laws while the poor cannot be heard, it is corrupt by the *internal* standard of political equality, even if the law permits it. Law $\neq$ Norm.

  **The Rotten Office (Colonial/Authoritarian)**
  *   *The Challenge:* What if the "local norm" *is* predation? (e.g., A colonial administration designed to extract resources).
  *   *Localist Failure:* Normative Localism cannot condemn colonialism if the colonial administration successfully establishes its own norms.
  *   *The Necessary Concession:* You must distinguish between **Regime Norms** (what the rulers say) and **Office Norms** (what the role is for). A police officer's office is *for* protecting safety. If the regime orders them to terrorize, they are corrupt *as officers*, even if they are obedient *as subjects*. This saves your prosecutor: they are appealing to the true purpose of the office, against the temporary regime.

  ### 5. Predictions and Perception Indices

  **What Localism Predicts:**
  *   Corruption Perception Indices (CPI) should correlate with **cultural distance** from the West, not actual experience of bribery.
  *   Locals should rate their own institutions higher than foreigners do (because they understand the "context").

  **What Universalism Predicts:**
  *   CPI should correlate with **citizen experience** of bribery.
  *   Locals and foreigners should agree on the *existence* of corruption, even if they disagree on the *solution*.

  **The Data:**
  The data supports **Universalism**. Locals in high-corruption jurisdictions rate their institutions *lower* than outsiders do. They know they are living in a corrupt system.
  *   *Novelistic Implication:* Your Journalist should not be discovering that corruption exists. The readers know, the locals know. The tension is not *exposure*; it is *impunity*. The conflict is not "Is this wrong?" but "Can we stop it?"

  ### 6. The "Native Condemnation" Evidence

  You asked for the most persuasive evidence against your position. Here it is:

  **The Rule:** In almost every polity, the general population distinguishes between "how things are done" (pragmatic acceptance) and "how things should be done" (normative rejection).

  **The Evidence:**
  *   **Global Corruption Barometer:** In regions with high bribery rates (Sub-Saharan Africa, parts of Asia), over 70% of ordinary citizens say corruption is increasing and that government is run for a few private interests.
  *   **Protest Movements:** From the Arab Spring to anti-graft protests in India and Brazil, the mobilizing cry is anti-corruption. These are not Western-imported ideas; they are native reactions to the violation of local expectations of fairness.
  *   **The "Queue" Phenomenon:** In corrupt systems, people resent those who cut the line. This resentment proves there *is* a shared norm of fairness (first come, first served) that is being violated. If the local norm were truly "pay to skip," no one would be angry about the line-cutting.

  **What This Does To Your Position:**
  It forces you to abandon **Normative Localism** in favor of **Contested Localism**.
  *   *Old View:* The local norm *is* corruption.
  *   *New View:* There is a war between two local norms: The **Elite Norm** (office is for extraction) vs. The **Public Norm** (office is for service).

  **How This Saves Your Novel:**
  This gives your Journalist and Prosecutor their moral footing. They are not importing Western values. They are articulating the *suppressed* local values of the citizens who are tired of the envelopes, the water board shutoffs, and the Family's grip. The Fixer is not defending "culture"; he is defending a "cartel."

  **Final Advice:**
  Do not write the book as if the definition of corruption is the mystery. Write it as if the *enforcement* of the definition is the battle. Your characters know it's corruption. The Family knows it's corruption. The question is not "Is this wrong?" The question is "Who owns the truth?"

  Drop the Normative Localism. It protects the villains. Adopt the view that corruption is the **betrayal of the local public trust**. That is a universal standard that your journalist can wield without apology.
