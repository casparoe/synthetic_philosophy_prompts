      *   *Defender's Concessions:* A smart defender admits there is *suffering* independent of classification, but the *syndrome* is the construct. If the suffering itself changes structure independent of the label, the defender must yield.
      *   *Insulation:* It is a feature *if* it acknowledges the reflexivity of humans. It is a defect *if* it ignores biological constraints.
      *   *Conclusion:* The position is robust but needs to allow for the possibility of "Natural Kinds" to be meaningful.

  9.  **Refining the Tone:**
