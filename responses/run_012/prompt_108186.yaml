      *   *The "Loop Half-Life" Test:* Analyze the friend's proposal. It's insufficient. Stability $\neq$ Natural Kind (could be cultural equilibrium). Drift $\neq$ Interactive Kind (could be diagnostic noise).
      *   *Fatal Defeaters:*
          1.  **Pre-Conceptual Clustering:** Finding the exact DSM structure in a population with zero exposure to the concepts.
          2.  **Biological Decoupling:** A biomarker that tracks the condition regardless of patient belief or diagnostic label.
