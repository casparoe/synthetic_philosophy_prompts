  *(Refining the "Half-Life" argument)*: If the half-life is long, the friend says "See, it's real." The user says "See, the culture has fully absorbed the label." This is the unfalsifiability trap. To make it a test, you need a *control*—a condition we know is biological vs. one we know is social. But we don't have that in psych. So the test is circular. I need to explain *why* it's circular.

