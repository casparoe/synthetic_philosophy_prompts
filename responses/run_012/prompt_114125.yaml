answer: |-
  # Graduate Seminar in Decision Theory: Final Examination

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. This examination is closed-book. You may not cite external literature, but you may assume standard results from real analysis regarding the convergence of series. All necessary definitions are contained within the question.

  ***

  **Question 1**

  Consider a coin tossed repeatedly until it first lands Heads. Let $n$ denote the toss number on which Heads first appears. The probability of this outcome is determined by the coin's bias. We define four games based on this structure:

  *   **Game A:** A fair coin is used ($P(\text{Heads}) = 1/2$). If Heads appears on toss $n$, the payoff is $+2^n/n$ when $n$ is odd and $-2^n/n$ when $n$ is even.
  *   **Game B:** A fair coin is used. If Heads appears on toss $n$, the payoff is $(-1)^{n-1} \cdot 2^n/n^2$.
  *   **Game C:** A biased coin is used, where $P(\text{Tails}) = q$ and $P(\text{Heads}) = 1-q$. The payoff rule is identical to Game A. (You may take it as given that if the expectation exists, it equals $V(q) = \frac{1-q}{q} \ln(1+2q)$).
  *   **Game D:** A fair coin is used. If Heads appears on toss $n$, the payoff is $+2^n/n$ (always positive).

  Write an essay addressing the following six points:

  (i) Compute the expected value of Games A, B, and D by summing the terms in the natural order of $n$. Classify the resulting series for each game as absolutely convergent, conditionally convergent, or divergent. For Game C, determine the range of values for $q$ ($0 < q < 1$) for which the expectation is well-defined.

  (ii) Explain what the classification in (i) implies for whether Game A has a well-defined expected value. Provide an explicit recipe for reordering the outcomes of Game A such that the partial sums of the expectation converge to an arbitrary target value $T$. Explain why no analogous reordering can assign a finite value to Game D.

  (iii) Explain why Game B possesses a well-defined expectation despite the fact that its payoffs are unbounded as $n \to \infty$. Why does this prevent us from dismissing the difficulties in Game A merely as a consequence of unbounded stakes?

  (iv) Observe that for every possible outcome $n$, the payoff of Game D is greater than or equal to the payoff of Game A. Dominance reasoning therefore suggests D is preferable to A. However, Expected Utility (EU) theory assigns Game D a value of $+\infty$ and Game A a value that is not well-defined (or depends on ordering). Discuss whether dominance reasoning or EU maximisation provides the better guide to rational choice in this specific context.

  (v) A common response to such paradoxes is to assume that rational agents have bounded utility functions (i.e., there is a maximum possible utility). Assess this response. Does assuming bounded utility resolve the mathematical difficulty presented by these games, or does it merely relocate the problem?

  (vi) Reach a verdict on whether these games demonstrate that Expected Utility theory is refuted, incomplete, or simply inapplicable in this domain. Justify your verdict.

  ***

  # Model Answer

  (i) The probability of stopping at toss $n$ with a fair coin is $(1/2)^n$.
  For **Game A**, the expected value (EV) series is $\sum_{n=1}^{\infty} (1/2)^n \cdot [(-1)^{n-1} 2^n / n] = \sum_{n=1}^{\infty} (-1)^{n-1} / n$. This is the alternating harmonic series, which converges to $\ln 2$. However, the sum of absolute values is the harmonic series $\sum 1/n$, which diverges. Thus, Game A is **conditionally convergent**.
  For **Game B**, the EV series is $\sum_{n=1}^{\infty} (1/2)^n \cdot [(-1)^{n-1} 2^n / n^2] = \sum_{n=1}^{\infty} (-1)^{n-1} / n^2$. The sum of absolute values $\sum 1/n^2$ converges. Thus, Game B is **absolutely convergent**.
  For **Game D**, the EV series is $\sum_{n=1}^{\infty} (1/2)^n \cdot [2^n / n] = \sum_{n=1}^{\infty} 1/n$. This is the harmonic series, which **diverges** to $+\infty$.
  For **Game C**, the term magnitude behaves like $(2q)^n/n$. For the series to converge, we require $|2q| \le 1$. Since $q$ is a probability, the expectation is well-defined only when **$0 < q \le 1/2$**. If $q > 1/2$, the terms grow and the expectation diverges.

  (ii) Because Game A is only conditionally convergent, the Riemann Rearrangement Theorem applies: the series does not have a unique sum independent of ordering. The "natural" order (by toss number) is arbitrary relative to the agent's preference structure if they can conceptualize the outcomes differently. To reorder Game A to converge to a target $T$: list positive terms ($n$ odd) until the partial sum exceeds $T$, then list negative terms ($n$ even) until the sum falls below $T$, and repeat. Since the individual terms approach zero but the positive and negative sums diverge individually, this process converges to $T$.
  Game D cannot be rescued by reordering because it consists entirely of positive terms. Any rearrangement of a series of positive terms that diverges to $+\infty$ will still diverge to $+\infty$. The value is robustly infinite, not undefined due to ordering.

  (iii) Game B demonstrates that unbounded payoffs are not sufficient to generate ill-defined expectations. In Game B, payoffs grow as $2^n/n^2$, yet the probability $(1/2)^n$ decays fast enough to ensure absolute convergence. The difficulty in Game A arises not from the magnitude of the payoffs alone, but from the interaction between the payoff growth, the probability decay, and the alternating signs which permit conditional convergence. Therefore, capping payoffs is not the only way to secure a well-defined EU; ensuring absolute convergence is the mathematical crux.

  (iv) Dominance reasoning is compelling here: D pays more than A in every state. If rationality requires respecting dominance, D is strictly better. EU theory struggles because it assigns D a value of $+\infty$ and A no unique value. However, treating $+\infty$ as a value allows for comparisons (e.g., $\infty > \ln 2$), but the instability of A's value undermines the comparison. If we accept the natural ordering for A, EU prefers D. But if the ordering is arbitrary, EU cannot compare them. Dominance reasoning is more robust here because it relies on state-by-state comparison, which remains invariant under reordering of outcomes, whereas EU relies on a summation order that is not privileged by the theory itself.

  (v) Assuming bounded utility resolves the mathematical difficulty immediately. If utility $U(x)$ is bounded by $M$, then $|U(\text{payoff})| < M$. The expected utility series becomes bounded by $\sum P(n) \cdot M = M$, ensuring absolute convergence for all these games. However, this relocates the problem. It forces a substantive claim about rational preference: that there exists a sum of money (or outcome) beyond which no increase in value is perceived. This contradicts the standard assumption of monotonicity in wealth and merely stipulates away the paradox rather than explaining how to handle unbounded rational agents. It solves the math by restricting the domain of applicable preferences.

  (vi) These games show that Expected Utility theory is **incomplete** rather than refuted. EU theory presupposes that expectations are well-defined (integrable). In cases of conditional convergence (Game A), the theory lacks a rule for privileging the natural temporal ordering of outcomes over other logical orderings. It is not refuted because it does not claim to handle non-integrable gambles; it is incomplete because it offers no guidance on how to form preferences when the integral depends on the summation order. The theory requires an auxiliary principle (such as a requirement for absolute convergence or a privilege for temporal ordering) to yield verdicts in these edge cases. Without such a principle, it remains silent.

  ***

  # Marking Scheme (25 Marks)

  **Part (i): Computation and Classification (6 Marks)**
  *   **2 Marks:** Correctly identifies Game A as conditionally convergent (sum $\ln 2$, absolute sum diverges).
      *   *Error:* Claiming A is absolutely convergent or divergent (-1).
  *   **2 Marks:** Correctly identifies Game B as absolutely convergent and Game D as divergent to $+\infty$.
      *   *Error:* Claiming D converges (-1).
  *   **2 Marks:** Correctly identifies the convergence condition for Game C ($q \le 1/2$).
      *   *Error:* Failing to check the ratio/term growth for C (-1).

  **Part (ii): Rearrangement and Well-Definedness (5 Marks)**
  *   **2 Marks:** Explicitly links conditional convergence to the lack of a well-defined value (Riemann Rearrangement).
      *   *Error:* Treating $\ln 2$ as the fixed value without qualification (-1).
  *   **2 Marks:** Provides the correct recipe for reordering A (take positives to exceed $T$, negatives to drop below, repeat).
      *   *Error:* Vague description of reordering (-1).
  *   **1 Mark:** Explains D cannot be reordered to converge because terms are positive (divergence is order-invariant).

  **Part (iii): Unbounded Payoffs (3 Marks)**
  *   **2 Marks:** Explains B is well-defined because probability decay dominates payoff growth (absolute convergence).
  *   **1 Mark:** Explicitly states this isolates the problem to conditional convergence/signs, not mere unboundedness.
      *   *Error:* Attributing the problem solely to infinite stakes (-1).

  **Part (iv): Dominance vs. EU (4 Marks)**
  *   **2 Marks:** Acknowledges D dominates A state-by-state.
  *   **2 Marks:** Argues Dominance is more robust here because EU depends on arbitrary summation order for A, whereas Dominance does not.
      *   *Error:* Claiming EU clearly prefers D without addressing the ordering instability of A (-1).

  **Part (v): Bounded Utility (4 Marks)**
  *   **2 Marks:** Correctly states bounded utility forces absolute convergence (math resolves).
  *   **2 Marks:** Argues this relocates the problem to justifying the bound (substantive constraint on preference).
      *   *Error:* Claiming this is a pure solution without cost (-1).

  **Part (vi): Verdict on EU Theory (3 Marks)**
  *   **1 Mark:** Clear verdict (Refuted / Incomplete / Inapplicable).
  *   **2 Marks:** Justification consistent with previous answers (e.g., "Incomplete" because it lacks an ordering principle).
      *   *Error:* Contradictory verdict (e.g., "Refuted" but admits it works with bounds) (-1).

  **General Penalties**
  *   **Citation Penalty:** Attempting to name-drop authors (e.g., "Riemann", "St. Petersburg") without explanation: -1 total.
  *   **Math Error:** Treating undefined expectation as "very large" rather than undefined: -2 total.
  *   **Word Count:** Significantly under 600 words (lack of depth): Cap at 15 marks.
