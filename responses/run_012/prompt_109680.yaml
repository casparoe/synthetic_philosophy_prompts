  *(Self-Correction on the "Values" question)*: The firm makes a value judgment when it equates "uncertainty" with "50%". That is a risk decision. The firm must not do that.

  *(Self-Correction on Case C)*: The user expects to dislike which one gets refused. I need to be firm. Case C is statistically bogus. Case A is historically unique. Case B is forecastable but with high variance. I should refuse A and C. Or maybe just C? No, A is "no informative precedent." That demands a refusal. I will refuse A and C. B gets a wide range.

