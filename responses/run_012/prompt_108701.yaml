      *   Unsatisfiability? Explicitly state if the spec is impossible. (It is, in the strong monist sense).

  10. **Final Polish:** (Writing the response following the structure derived above.) *Ensure the distinction between 'statistical partition' and 'causal explanation' is the through-line.*

  *(Self-Correction Note)*: Wait, I need to make sure I don't just list the cases but explain *why* they are in the spec. The prompt asks for "the cases it has to get right and why those cases and not others". I need to justify the selection of cases as boundary conditions.

  *(Refining the Holobiont point)*: The prompt asks the spec to rule on it. I should indicate what the spec demands (heritability fidelity) and whether the holobiont meets it (usually no, unless specific mechanisms exist).

  *(Refining the Conflict)*: The user suspects "the theory must be able to say which level is the real one" isn't a desideratum. I should agree and explain why (it's a category error).

