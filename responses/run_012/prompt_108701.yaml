answer: |-
  Here is the specification for a theory of units/levels of selection, drafted for your seminar opening.

  ### The Specification: Desiderata for a Theory of Selection Units

  **1. Empirical Coverage (The Boundary Cases)**
  An adequate theory must correctly classify the evolutionary dynamics in the following scenarios, not merely describe them statistically:
  *   **Intragenomic Conflict (Segregation Distorters/Meiotic Drive):** Must explain how a gene spreads despite reducing organismal fitness. *Why:* Tests if the theory can decouple gene-level success from individual-level success.
  *   **Cytoplasmic Elements (Mitochondria/Chloroplasts):** Must account for uniparental inheritance aligning organelle fitness with the host. *Why:* Tests if the theory recognizes transmission bottlenecks as unit-constituting mechanisms.
  *   **Eusociality (Sterile Workers):** Must explain the evolution of sterility without invoking group mysticism. *Why:* Tests the handling of fitness deficits at the individual level compensated by indirect or higher-level effects.
  *   **Somatic Policing (Cancer):** Must explain multicellular stability as the suppression of lower-level selection. *Why:* Tests the "Major Transition" criterion: when does a group become a new individual?
  *   **Alarm Calls/Sacrifice:** Must distinguish between traits selected *for* group benefit versus traits selected *for* individual kin-benefit that happen to help the group. *Why:* Tests the "Selection of vs. Selection for" distinction.

  **2. Conceptual Distinctions (The Vocabulary)**
  The theory must maintain formal or causal separation between:
  *   **Replicator vs. Interactor (Vehicle):** Copying fidelity vs. environmental interaction.
  *   **Selection Of vs. Selection For:** Statistical association vs. causal property (Sober's distinction).
  *   **Group Effect vs. Group Adaptation:** A trait benefiting a group is not evidence the group was the unit of selection (Williams' proviso).
  *   **Individual Selection with Group Effects vs. Group Selection:** Must distinguish between a trait spreading *in* groups versus *because of* group structure.

  **3. Formal Constraints (The Math)**
  The theory must be consistent with:
  *   **The Price Equation:** Acknowledging that covariance can be partitioned at infinite levels mathematically.
  *   **Equivalence Theorems:** Acknowledging that Kin Selection and Group Selection models are often mathematically translatable.
  *   **Selection without Evolution:** Acknowledging that selection at a level can occur without evolutionary response if heritability at that level is zero.

  **4. The Holobiont Ruling**
  *   **Verdict:** The spec must rule the holobiont a **weak or non-unit** in most cases.
  *   **Reasoning:** If the microbiome is reassembled from the environment each generation, there is no parent-offspring resemblance of the *holobiont* genotype/phenotype package. Without vertical transmission fidelity (a bottleneck), there is no lineage to bear fitness. It fails the "replicator" criterion, even if it functions as an "interactor."

  ***

  ### Evaluation: Genuine Requirements vs. Camp Prejudices

  **Genuine Desiderata:**
  *   **Causal Efficacy:** The theory must identify *why* a trait frequency changes, not just *where* the covariance sits. (e.g., Cancer is suppressed because somatic cells lack heritability, not just because organismal selection is "stronger").
  *   **Heritability Mechanism:** A unit cannot be defined by selection alone; it requires a mechanism of reproduction/fidelity (bottlenecks, germlines).
  *   **Conflict Handling:** It must explain stability in the face of lower-level cheating (e.g., meiotic drive).

  **Camp Prejudices (Pseudo-Desiderata):**
  *   **"The Theory Must Identify The One True Level":** This is a category error. Selection is a process that can act simultaneously on multiple hierarchies. Demanding a singular "real" level is monist metaphysics, not biology.
  *   **"Parsimony Requires Fewer Levels":** Often used by Gene-Selectionists to dismiss group talk. But if group-structure causes the variance, omitting the group level obscures the cause. Parsimony applies to explanations, not ontology.
  *   **"Formal Neutrality Implies Ontological Flatness":** Just because the Price equation allows partitioning anywhere doesn't mean all levels are causally equivalent.

  ***

  ### The Impossible Pair: Formal Neutrality vs. Unique Verdict

  **Conflict:** You cannot jointly satisfy **"Formalism must be level-neutral"** and **"Theory must return a non-arbitrary verdict on the real unit."**

  **Argument:**
  The Price equation is a covariance partition; it is mathematically true at all levels simultaneously (level-neutral). If you demand a unique verdict (e.g., "Selection is *really* on the colony, not the bee"), you must import extra-mathematical criteria—specifically, **causal mechanisms of heredity**.
  *   If you stick to pure statistics (Price), the verdict is arbitrary (you can partition however you like).
  *   If you demand a unique verdict, you must abandon strict formal neutrality and privilege levels with specific transmission mechanisms (e.g., germline bottlenecks).
  *   **Seminar Point:** The "debate" persists because Gene-Selectionists privilege the replicator (causal), while MLS proponents often privilege the statistical partition (descriptive). They are answering different questions.

  **Verdict on your hunch:** You are correct. "Which level is the real one?" is not a desideratum for a *statistical* theory, but it is a desideratum for a *causal* explanation. A theory can be level-neutral in math but non-arbitrary in biology if it ties selection to transmission fidelity.

  ***

  ### Scorecard (For Seminar Discussion)

  **Gene's-Eye View (Dawkins/Hull)**
  *   **Focus:** Replicators (genes) are the only true units; organisms/vehicles are transient.
  *   **Strength:** Cleanly resolves intragenomic conflict and altruism via inclusive fitness.
  *   **Weakness:** Struggles to describe Major Transitions where lower units lose replicative independence (e.g., chromosomes, multicellularity).

  **Multilevel Selection (MLS/Price)**
  *   **Focus:** Statistical partitioning of variance across hierarchical levels.
  *   **Strength:** Descriptively accurate for group-structured populations; handles group-level variance explicitly.
  *   **Weakness:** Mathematically arbitrary without causal constraints; risks labeling group effects as group selection.

  **Kin Selection / Contextual Analysis**
  *   **Focus:** Regression of fitness on individual and group phenotypes (relatedness).
  *   **Strength:** Mathematically equivalent to MLS but emphasizes causal pathways of relatedness.
  *   **Weakness:** Often misinterpreted as denying group causality; "relatedness" can be a statistical artifact rather than genealogy.
