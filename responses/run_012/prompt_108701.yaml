prompt: |-
  Right, I need help with something I should have sorted out months ago. I'm running the opening session of a grad seminar on the levels-of-selection debate — genes, individuals, groups, the whole mess — and I've realised I don't have a clean answer to the question my students will definately ask in week one, which is: what is a "unit of selection" claim even supposed to be doing? Watching the literature, everyone seems to be arguing past each other, and my suspicion is that half the disagreement is that they're answering to different requirements without saying so. So before we read anything, write me the desiderata: what does an adequate theory of units/levels of selection have to deliver? I want the full spec — the cases it has to get right and why those cases and not others (segregation distorters and meiotic drive, uniparentally inherited cytoplasmic elements, sterile workers in the eusocial insects, alarm calls and other apparently self-sacrificing behaviours, the policing of cheats inside a multicellular body with cancer as the stock example, and the major transitions where a lower-level unit gets absorbed into a higher-level one); the distinctions it mustn't collapse (replicator versus vehicle or interactor; selection of versus selection for; selection on individuals that happens to have group-level effects versus selection on groups as units in their own right; a group-beneficial effect versus group adaptation versus group fitness as a seperate property); and the formal results it has to live with — that the Price equation will happily partition covariance at whatever level you feed it, that kin-selection and group-selection treatments of the same trait come out equivalent across a wide range of models, and that you can have selection at a level with no evolutionary response at that level.

  Then tell me which of the requirements are genuine and which are just prejudices of one camp. I've a strong hunch that "the theory mustn't multiply levels beyond necessity" and "the theory must be able to say which level is the real one" are doing completely different kinds of work, and that the second isn't a desideratum at all — but I want your argument, not mine. Flag every pair you think can't be jointly satisfied; the one I most want to see is whether a theory can be level-neutral in its formalism and still return a non-arbitrary verdict on a concrete case like the eusocial insects, and if that's unsatisfiable then say so, because the list turning out to be unsatisfiable is itself the interesting result. One extra case I want the spec to rule on, since it isn't on the usual menu: whether the heritable microbiome — the holobiont, if you'll allow it — could be a unit of selection at all, given that the association is largely reassembled fresh each generation rather than inherited as a package. And keep the scorecard short; two or three lines each on the gene's-eye view, multilevel selection, and the kin-selection/contextual-analysis machinery is plenty, I'll do the proper scoring in the seminar with them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Create a "specification" (desiderata) for an adequate theory of units/levels of selection for a grad seminar.
      *   **Core Question:** What is a "unit of selection" claim supposed to *do*?
      *   **Required Content:**
          *   Cases to get right (segregation distorters, cytoplasmic elements, sterile workers, alarm calls, cancer/policing, major transitions).
          *   Distinctions to maintain (replicator/vehicle, of/for, individual-vs-group effects, group-benefit-vs-adaptation).
          *   Formal constraints (Price equation partitioning, kin/group equivalence, selection without response).
          *   Evaluation: Which requirements are genuine vs. camp prejudices?
          *   Conflicts: Flag pairs that can't be jointly satisfied (specifically level-neutral formalism vs. non-arbitrary verdicts).
          *   Extra Case: Heritable microbiome/holobiont (reassembly vs. package).
          *   Scorecard: Short summaries (2-3 lines) for Gene's-Eye, MLS, Kin/Contextual.
      *   **Tone:** Academic, precise, slightly conversational (professor-to-professor), critical, avoiding fluff.
      *   **Constraint:** Keep the scorecard short.

  2.  **Deconstruct the "Unit of Selection" Problem:**
      *   The user is right: much of the debate is verbal confusion.
      *   Key insight: "Unit of selection" is ambiguous. It can mean "what gets copied?" (replicator), "what interacts with the environment?" (interactor/vehicle), or "where does the covariance arise?" (statistical partition).
      *   The goal is to clarify what a *good* theory needs to explain, not necessarily to solve the debate (though pointing out unsatisfiability is part of the job).

  3.  **Drafting the Desiderata (The Spec):**
      *   *Cases:* Need to cover intragenomic conflict (meiotic drive), cytoplasmic (mitochondria), altruism (workers/calls), somatic conflict (cancer), and transitions (proto-cells to cells).
      *   *Distinctions:* Dawkins' Hull (replicator/interactor), Sober's (of/for), Group effect vs. Group adaptation (Williams/Maynard Smith).
      *   *Formalism:* Price Equation (arbitrary partitioning), Equivalence Theorems (Kin = Group), Selection $\neq$ Evolution (need heritability).
      *   *Holobiont:* The specific challenge of vertical vs. horizontal transmission/reassembly.

  4.  **Evaluating Requirements (Genuine vs. Prejudice):**
      *   *Genuine:* Must track evolutionary change (Price), must distinguish causal efficacy from statistical correlation, must handle conflicts (cancer/drive).
      *   *Prejudice:* "There must be *one* true level" (monism), "Parsimony means fewer levels" (often just gene-centrism in disguise).
      *   *Conflict:* Level-neutrality (Price) vs. Unique Verdict. If the math allows partitioning anywhere, picking *the* level requires extra-theoretical criteria (causal, not statistical).

  5.  **Addressing the Specific Conflict (Level-Neutral vs. Non-Arbitrary):**
      *   This is the crux. The Price equation is a covariance partition. It's mathematically true at all levels simultaneously.
      *   To say "Selection is *really* at level X" requires causal modeling, not just statistical partitioning.
      *   Verdict: You can't have strict formal neutrality *and* a unique ontological verdict without adding causal assumptions (like heritability mechanisms or bottlenecking).

  6.  **The Holobiont Case:**
      *   Challenge: Reassembly each generation breaks strict vertical inheritance of the *specific* microbes, but the *function* or *capacity* might be heritable.
      *   Verdict: Weak unit at best, unless specific mechanisms (eggs carrying bacteria) enforce fidelity. It tests the "heritability" constraint.

  7.  **Drafting the Scorecard:**
      *   *Gene's Eye:* Focus on replicators. Good for conflict, bad for transitions.
      *   *MLS (Multilevel Selection):* Focus on Price partitioning. Good for structure, risks arbitrariness.
      *   *Kin/Contextual:* Focus on regression/relatedness. Mathematically equivalent to MLS, causally distinct interpretation.

  8.  **Refining and Polishing (Self-Correction during drafting):**
