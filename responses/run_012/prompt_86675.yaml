      *   **Friend:** Resemblance Nominalist. Believes only particulars exist; resemblance is primitive or linguistic.
      *   **The "Resemblance" Objection:** This is the classic "Third Man Argument" style objection to Nominalism. If $a$ resembles $b$ in virtue of $F$, and $c$ resembles $d$ in virtue of $F$, does the *resemblance* itself constitute a universal?
      *   **The Location Objection:** This is the classic empiricist/spatial constraint on existence. If it's not in space-time, does it exist?

  3.  **Evaluate the "Verbal vs. Substantive" Question:**
      *   *Verbal Dispute:* Do they mean different things by "exist" or "real"?
          *   Friend: "Exist" = "Spatiotemporal particular."
