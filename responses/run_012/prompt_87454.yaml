prompt: |-
  I'm a software engineer at a small medtech startup — I do the firmware and the data pipeline, no philosophy background beyond one undergrad elective, so go easy on me. Next week I have to present to our clinical advisory board: four pain clinicians (two anesthesiologists, the physio who runs our CBT-for-pain program, and a palliative care doc), a patient rep, and our CMO. What I want to make the arguement for, roughly: pain asymbolia is the case that matters. Those patients report that it hurts and they're not bothered by it — they joke about it, they don't ask you to stop — which I read as showing that the hurting part of pain and the bad part of pain come apart, and that the bad part is the affect, the wanting-it-to-stop, not the sensation. From there I want to get to: our endpoints should be about suffering rather than nociception, and (the part I actually care about) you could in principle have all the sensory machinery of pain running with nothing bad happening in the system at all. I also have a vague memory that the reaction side of it — reflexes, heart rate — doesn't line up neatly with what those patients say, and I have no idea what to do with that if someone brings it up. Prep me: what each person in that room will actually say, in their own vocab, ordered by how much damage it does to me, with a two-minute reply for each and a note on where the reply is soft, what I should concede up front, and the one question I'm hoping nobody in that room asks.
reasoning: |-
