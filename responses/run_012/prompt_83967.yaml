      *   **Core Mechanic:** Students must discover mid-play that giving up control is advantageous. There must be a mechanic (tripwire, delegated trigger) that increases danger for *both* but benefits the player.
      *   **Constraints:** 20-minute game + replay + debrief. Simple arithmetic (first-year level). Real stakes (candy/grading).
