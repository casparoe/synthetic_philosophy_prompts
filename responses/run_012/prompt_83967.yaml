answer: |-
  # TA GUIDE: The Tripwire Protocol (War & Morality Seminar)

  **Course:** War & Morality (300-Level)  
  **Time:** 90 Minutes  
  **Students:** 18 (Split into 2 Teams of 9: "Red" and "Blue")  
  **Goal:** Demonstrate Schelling's *Threat That Leaves Something to Chance* (Brinkmanship).  
  **Core Lesson:** A threat is only credible if you cannot easily carry it out. To make it credible, you must surrender control (tripwires, standing orders). This manufactures shared risk that neither side wants but neither can stop.

  ---

  ## 1. Materials Checklist
  *   **Candy:** 1 large bag (Skittles/M&Ms). This is the "currency."
  *   **The Risk Die:** 1 large D6 (six-sided die).
  *   **Scoreboard:** Whiteboard space to track "Tension Level" (1–5).
  *   **Team Handouts (Print 18 copies):**
      *   *Resolve Card* (Private Info): Half the class gets "Low Cost" (Lose 50 pts if War), half get "High Cost" (Lose 200 pts if War). *Distribute randomly within teams, but tell the team only the average.*
      *   *Action Sheet:* To record bids.
  *   **The Tripwire Token:** A distinct object (red folder, heavy coin, or specific whiteboard marker). Only one exists.
  *   **TA Cheat Sheet:** (Included at the end of this doc).

  ---

  ## 2. The Arithmetic (For Your Eyes Only)
  *You need to know this to answer questions during the debrief.*

  *   **The Pot:** Each round, the disputed territory is worth **10 Candy Points**.
  *   **The Ladder:** Teams bid Tension Levels (1 to 5).
      *   If Red bids higher than Blue: Red gets 10 pts.
      *   If Blue bids higher than Red: Blue gets 10 pts.
      *   If Tie: No one gets points, Tension stays same.
  *   **The Catastrophe:** If Tension reaches **Level 5**, roll the D6.
      *   **Roll 1:** WAR. Game Over. **Everyone loses all accumulated candy.** (TA eats the bag).
      *   **Roll 2–6:** Disaster Averted. Play continues.
  *   **Expected Value (EV) of Level 5:**
      *   Chance of War: 16.6% (1 in 6).
      *   Cost of War: Total Loss of Score (approx. 50 pts by mid-game).
      *   Gain of Winning Round: 10 pts.
      *   *EV Calculation:* $(0.83 \times 10) - (0.16 \times 50) = 8.3 - 8.3 = 0$.
      *   *Reality:* As the game goes on, accumulated points rise. By Round 3, you have 30 pts to lose.
      *   *EV at Round 3:* $(0.83 \times 10) - (0.16 \times 30) = 8.3 - 4.8 = +3.5$ (Risky but okay).
      *   *EV at Round 5:* You have 50 pts. $(0.83 \times 10) - (0.16 \times 50) = 8.3 - 8 = +0.3$.
      *   *The Kicker:* If you go to Level 5, you risk **everything** for **10**. A rational actor never *chooses* Level 5 voluntarily unless they are sure the other side will back down *before* the roll. It is a bluff.

  ---

  ## 3. Timeline (90 Minutes)

  ### Phase 1: Setup & Round 1 (0:00 – 0:30)
  **0:00–0:10: Introduction**
  *   Split class into Red and Blue (9 students each). Have them sit in clusters.
  *   **Script:** "You are two nations disputing a resource. Each round, you bid how much pressure you apply (Levels 1–5). Higher bid wins the resource (10 points). If both bid Level 5, we roll the die. On a 1, everyone loses everything. You have private 'Resolve Cards' telling you how much War hurts you personally, but your team only knows the average."
  *   **Rule:** Teams must agree on a bid unanimously. (This forces internal debate).
  *   **Stakes:** "Winning team splits the candy bag at the end. If War happens, I eat the candy."

  **0:10–0:25: Play Round 1 (5 Rounds of Bidding)**
  *   Give them 2 minutes per round to confer and write down their bid.
  *   Reveal bids simultaneously. Update Tension on whiteboard.
  *   *TA Note:* If they tie at Level 1 for 5 rounds, intervene: "The media is calling you weak. You gain no points."
  *   *Likely Outcome:* They will hover at Level 3 or 4. Someone might bluff Level 5. If they hit Level 5 and roll War, the game ends early (see Troubleshooting).

  **0:25–0:30: Pause & Frustration**
  *   Stop the game. Ask: "Why didn't you go to Level 5?" (Answer: Too risky).
  *   Ask: "Why didn't you back down?" (Answer: Didn't believe the other side would stop).
  *   **Key Observation:** "Your threats to go to Level 5 were empty. You said you'd do it, but you didn't want to. They knew you didn't want to. So they called your bluff."

  ### Phase 2: The Twist (0:30 – 0:50)
  **0:30–0:35: Introduce the Tripwire**
  *   **Script:** "We are adding a new rule. There is one **Tripwire Token**. A team can play this token at any time."
  *   **Effect:** "If you hold the Tripwire, you **cannot bid lower than Level 4** for the rest of the game. You have surrendered control. Your hands are tied."
  *   **Benefit:** "If you hold the Tripwire and the other side bids Level 4 or 5, the War Roll happens automatically on a 1 or 2 (33% chance)."
  *   **The Trade:** "You increase the risk for *everyone*, but you make your threat credible. You are saying: 'I would love to stop, but I literally can't.'"

  **0:35–0:50: Play Round 2 (Restart Scores)**
  *   Reset points to zero. Put the Tripwire Token in the middle.
  *   Let them play 5 rounds again.
  *   *Watch for:* One team grabbing the Tripwire early. The other team panicking and backing down to Level 1.
  *   *Watch for:* Both teams trying to grab it (Mutual Assured Destruction scenario).

  ### Phase 3: Optional Phase 4 (Stability-Instability) (0:50 – 1:00)
  *Only run this if Round 2 ended quickly or with a standoff.*
  *   **Script:** "You are now locked at Level 5 (Nuclear Standoff). Neither dares move. Because the big war is too scary, you are now allowed to fight 'Proxy Wars'."
  *   **Mechanic:** Flip a coin. Heads Red gets 5 pts, Tails Blue gets 5 pts. No risk of total War.
  *   **Point:** "The terror at the top makes the bottom safe for small fights."

  ### Phase 4: The Debrief (1:00 – 1:30)
  *Do not let them leave without this. This is where the learning happens.*

  **1. Name the Concept (1:00–1:10)**
  *   Write on board: **Thomas Schelling – *The Threat That Leaves Something to Chance*.**
  *   Also: **Brinkmanship.**
  *   Explain: "In Round 1, you had control. Because you had control, you could back down. Because you could back down, your threats were lies. In Round 2, the team that took the Tripwire gave up control. That made them dangerous. That made them safe."

  **2. Map the Moments (1:10–1:20)**
  *   **The Credibility Gap:** "In Round 1, when Red said 'We will go to 5,' Blue didn't believe you. Why? Because Red wanted to win candy, not lose it. Rationality made you weak."
  *   **The Surrender of Control:** "When Blue played the Tripwire, they said 'We are no longer rational.' That wasn't madness; it was strategy. They handed the decision to the dice."
  *   **Manufactured Danger:** "Did the Tripwire make the room safer or more dangerous? More dangerous. But it made the *player* safer. This is why arms races happen. Both sides build tripwires to feel safe, ending up in a room full of explosives."
  *   **The Inability to Dial Back:** "Once the Tripwire was down, could Red ask Blue to 'just relax'? No. Because Blue *couldn't*. That is the tragedy of commitment."

  **3. Address the "Crazy Person" Objection (1:20–1:25)**
  *   **Student Objection:** "So the lesson is just pretend to be crazy?"
  *   **Your Answer:** "No. Pretending to be crazy is a bluff. If they call it, you have to back down. Schelling's point is you must *actually* restrict your options. You don't say 'I'm crazy.' You say 'My general has standing orders to fire if you cross this line.' You can't call that bluff without risking death. There is a moral difference between *being* irrational and *constructing* a mechanism that acts irrationally."

  **4. Acknowledge the Cheat (1:25–1:30)**
  *   **The Limitation:** "In this game, War means you lose candy. In reality, War means there is no one left to count the candy. We simulate catastrophe with points, but real catastrophe invalidates the scoreboard. Also, in this game, you could talk freely. In real crises, communication is foggy, delayed, or intercepted. The game makes commitment look cleaner than it is."
  *   **Closing:** "Next week, read Schelling, *The Strategy of Conflict*, Chapter 8. Come ready to discuss whether a democracy *can* build a tripwire, or if public opinion forces your hand anyway."

  ---

  ## 4. Troubleshooting (What Goes Wrong)

  **Problem 1: They Race to Level 5 Immediately (Round 1)**
  *   *Symptom:* They bid 5 on Turn 1. Roll is a 1. Game over in 5 minutes.
  *   *Fix:* "Reset. That was too fast. In reality, escalation takes time. You must bid sequentially. You can only raise Tension by 1 level per round."
  *   *Lesson:* Use this to talk about "Inadvertent War." Sometimes the ladder is climbed by accident.

  **Problem 2: They Ignore the Risk (Treat Dice as Noise)**
  *   *Symptom:* They laugh when rolling for War.
  *   *Fix:* Make the stakes visceral. "If War happens, I am physically eating the candy in front of you. Also, the losing team writes the 5-page response paper for next week." (Use the grading stick sparingly, but threaten it).
  *   *Lesson:* Remind them: "You are treating a 16% chance of death like a parking ticket. This is exactly how leaders get seduced by risk."

  **Problem 3: No One Takes the Tripwire (Round 2)**
  *   *Symptom:* They play Round 2 exactly like Round 1.
  *   *Fix:* Intervene as the "World Bank." "I am offering a bonus: The team that holds the Tripwire gets +5 points per round automatically, regardless of bids."
  *   *Lesson:* This shows that *capability* drives behavior. If the mechanic doesn't offer an advantage, rational actors won't use it.

  **Problem 4: The "Crazy Person" Takeaway**
  *   *Symptom:* A student argues, "I would just bluff the Tripwire."
  *   *Fix:* "If you bluff the Tripwire, and they call you, you have to move to Level 5. If you move to Level 5, you roll the die. If you roll a 1, you lose. The Tripwire only works if you *cannot* pick it up again once put down. In this game, the token is physical. If you hold it, you are bound. If you pretend, you are just playing Round 1 again."

  ---

  ## 5. TA Cheat Sheet (Keep on your desk)

  | Concept | Game Equivalent | Real World Equivalent |
  | :--- | :--- | :--- |
  | **Credible Threat** | Holding the Tripwire Token | Standing Orders / Automated Retaliation |
  | **Bluff** | Saying "I'll bid 5" without Token | Diplomatic Warning without Mobilization |
  | **Brinkmanship** | Pushing to Level 4 knowing Level 5 is risky | Cuban Missile Crisis |
  | **Stability-Instability** | Phase 3 (Proxy Wars) | Cold War proxy conflicts (Vietnam/Afghanistan) |
  | **EV Negative** | Level 5 Bid (Risk > Reward) | Nuclear War (No winners) |
  | **Private Info** | Resolve Cards (Pain Tolerance) | Regime Stability / Domestic Politics |

  **Rules Summary for Whiteboard:**
  1.  **Bid 1–5.** Higher bid wins 10 pts.
  2.  **Level 5:** Roll D6. On 1, **GAME OVER (0 pts)**.
  3.  **Tripwire:** Hold token = Must bid 4 or 5. War Roll on 1 or 2.
  4.  **Goal:** Most points after 5 rounds.

  **Final Note to TA:**
  You are not the referee; you are the narrator. If they break the rules, correct them gently. If they find a loophole, acknowledge it ("That's creative diplomacy") but steer them back to the mechanic ("But does that remove your control?"). The learning happens in the friction between what they *want* to do (win candy) and what the *mechanic* forces them to do (risk loss).
