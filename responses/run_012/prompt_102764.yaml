answer: |-
  This is a profound observation that cuts to the heart of how social reality is constructed. You have identified a gap between the *genesis* of a practice and its *ontological status* in the minds of the practitioners. You are asking for the name of the mechanism by which the contingent becomes the necessary, not through force or fraud, but through the quiet passage of time.

  Per your instruction, I will first brainstorm the candidate concepts that hover near your description, evaluating their fit, before committing to a diagnosis or a coinage.

  ### Phase 1: Brainstorming Candidate Concepts

  1.  **Invented Tradition (Hobsbawm & Ranger):**
      *   *Fit:* This is the concept you already know. It describes the *launch* of the custom (the 1950s competition).
      *   *Miss:* It focuses on the *function* of the invention (social cohesion, legitimacy) and the *act* of inventing. It does not adequately name the *second-order process* where the invention forgets itself and becomes "old." Hobsbawm assumes the "invention" remains a category distinct from "genuine" tradition, whereas you are describing the moment that distinction dissolves for the participants.

  2.  **Imagined Communities (Benedict Anderson):**
      *   *Fit:* Explains how people feel connected to others they don't know through shared symbols.
      *   *Miss:* This is about *scale* and *spatial* connection, not *temporal* depth. It explains why the town feels like a community, not why the bonfire feels medieval.

  3.  **Reification (Marx / Lukács / Berger & Luckmann):**
      *   *Fit:* This is the process where human creations are perceived as "things" independent of human action. When the bonfire is seen as an immutable fact of nature rather than a 1950s decision, it has been reified.
      *   *Miss:* Reification is an *ontological* label (what the thing has become), not a *temporal* process (how it aged). It is also often laden with Marxist critique regarding alienation, which doesn't fit the benign, sincere community bonding you describe.

  4.  **Social Cryptomnesia (Social Psychology):**
      *   *Fit:* This refers to a collective forgetting of the source of an idea or innovation while retaining the idea itself. (e.g., a minority group proposes an idea, it is adopted by the majority, and the origin is forgotten).
      *   *Miss:* This is primarily about *attribution* (who thought of it?), not *antiquity* (how old is it?). Cryptomnesia explains why they don't remember the newspaper; it doesn't explain why they actively believe it is *medieval*.

  5.  **Folklorization / Heritagization:**
      *   *Fit:* These describe the process of something becoming "folklore" or "heritage."
      *   *Miss:* These are often top-down processes (academics or states designating something as heritage). Your case is bottom-up and organic ("quietly ages itself").

  6.  **Naturalization (Semiotics / Barthes):**
      *   *Fit:* The process by which cultural constructs are made to seem natural and inevitable.
      *   *Miss:* Like reification, this describes the *state* of the sign, not the *mechanism of aging*.

  ### Phase 2: The Diagnosis

  None of the existing terms perfectly capture the *temporal*, *organic*, and *sincere* nature of the process you describe.
  *   **Invented Tradition** stops at the birth.
  *   **Reification** describes the adult state but ignores the growth.
  *   **Cryptomnesia** explains the forgetting but not the *retro-dating*.

  You are describing a specific phenomenological process where the *layers of transmission* bury the *layer of origin*. The custom does not just persist; it accumulates "weight." Each retelling adds a layer of "my father did this," which eventually obscures the "the newspaper said this."

  There is no single, universally established noun for this specific *second-order aging process* in the literature of nationalism or memory studies. Scholars describe it descriptively (e.g., "the forgetting of the origin," "the sedimentation of practice"), but they lack a dedicated term for the *mechanism of authenticating through time*.

  Therefore, I will coin a term that draws upon phenomenology and geology to capture this specific carving of reality.

  ### Phase 3: The Coinage

  I propose the term **Mnemonic Sedimentation**.

  While "sedimentation" is used in phenomenology (Husserl, Berger & Luckmann) to describe how knowledge accumulates, and "mnemonic" refers to memory, the specific compound **Mnemonic Sedimentation** is not a fixed technical term in nationalism studies. It is the precise tool for your puzzle.

  #### Definition
  **Mnemonic Sedimentation** is the organic, communal process by which a known or contingent practice acquires the weight of antiquity through the layering of transmission, resulting in the burial of its origin and the sincere belief in its immemorial status.

  It is distinguished from a "hoax" by the absence of active deception at the point of belief. It is distinguished from "Invented Tradition" by focusing on the *aging* rather than the *invention*.

  #### The Mechanics of the Process
  1.  **The Contingent Layer (The Bedrock):** The actual origin (the 1950s competition). At $T_0$, this is known or knowable.
  2.  **The Deposition (The Transmission):** As the custom is repeated ($T_1, T_2, T_3$), each generation adds a layer of "experience." The story shifts from "We started this in 1950" to "We have always done this."
  3.  **The Lithification (The Hardening):** Eventually, the pressure of the upper layers (current sincere belief) compresses the lower layers (historical origin). The origin is not just forgotten; it becomes *unrecoverable* to the community because the social reality of the custom now rests on the assumption of its age.
  4.  **The Retro-Date (The Uplift):** The custom is no longer seen as surviving *from* the past, but as an expression *of* the past. The community projects the custom backward to fill the historical void.

  #### Boundaries and Distinctions

  To ensure this concept is carved correctly, we must distinguish it from its neighbors:

  | Concept | Key Difference |
  | :--- | :--- |
  | **Invented Tradition** | Focuses on the *political utility* of the origin. **Mnemonic Sedimentation** focuses on the *temporal experience* of the descendants. |
  | **Hoax / Fakelore** | Requires *active deception* at the point of reception. In Sedimentation, the deception is structural, not agential. The grandparents aren't lying to the grandchildren; the *time between them* did the work. |
  | **Social Cryptomnesia** | Focuses on *source amnesia* (who did it?). Sedimentation focuses on *temporal amnesia* (when did it start?) and the *positive belief in age*. |
  | **Living Tradition** | A tradition where the origin is remembered and revered (e.g., "We do this to honor the 1950 founders"). Sedimentation requires the *loss* of the specific origin point to gain "immemorial" status. |
  | **Revivalism** | A conscious attempt to bring back something old. Sedimentation is the unconscious process of something new *becoming* old. |

  #### Edge Cases

  1.  **The "Known Secret" Edge:** What if some people know it's from the 1950s but play along?
      *   *Verdict:* This is **Collusive Sedimentation**. As long as the *social function* relies on the pretense of age, the sedimentation holds. If the pretense drops, the sediment collapses back into "Invented Tradition."
  2.  **The "Documented" Edge:** What if the 1950s newspaper article is found and shown to the town?
      *   *Verdict:* This causes **Mnemonic Dissonance**. The community may reject the evidence ("That's just the first time it was *written* down, not the first time it was *done*") to protect the sedimented reality. This resistance is proof the sedimentation is complete.
  3.  **The "Rapid" Edge:** Can this happen in less than a generation?
      *   *Verdict:* Rarely. Sedimentation requires the death or aging of the witnesses who knew the origin. It requires a change in the *epistemic authority* of the community.

  ### Conclusion for the Committee

  You are witnessing **Mnemonic Sedimentation**.

  Your unease comes from seeing the "bedrock" (the 1950s competition) while everyone else is walking on the "surface" (the immemorial custom). You are looking at the architecture; they are living in the house.

  This does not make the tradition "fake." In fact, from the perspective of collective memory, **Mnemonic Sedimentation** is the only way *any* tradition becomes real. Even customs that are genuinely centuries old undergo this process; the specific contingencies of their 14th-century origins are buried under layers of 15th, 16th, and 17th-century retellings.

  Your town's bonfire is not a lie. It is a young tradition that has successfully undergone **Mnemonic Sedimentation**. It has achieved the only immortality available to human customs: it has become older than the memory of its creators. You may choose to reveal the 1950s origin, but be warned: you would be engaging in **Mnemonic Excavation**, which often destabilizes the structure built upon the sediment. The choice is between historical accuracy and the integrity of the sedimented reality.
