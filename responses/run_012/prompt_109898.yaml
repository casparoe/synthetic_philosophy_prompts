answer: |-
  ### Final Exam: Intergenerational Ethics and Rational Choice

  **Instructions:** This is a closed-book examination. You have no access to library or network resources. All premises required to answer the following question are contained within the apparatus provided below. Answer the question in continuous prose.

  **Apparatus:**

  1.  **Setting and Temporal Neutrality:** A *future* is an infinite dated sequence of events; we compare futures by their total distribution of well-being. Define **Date-Shift Equivalence**: for any future $F$ and any shift $k$, $F$ and $F$ shifted forward by $k$ years are to be ranked equally. Call this **Temporal Neutrality**. This construction presupposes that the two futures compared contain the same individuals merely relocated in time. However, accept as a stipulated background fact that which particular people exist depends on when the relevant events occur; therefore, a date-shifted future contains different people.
  2.  **Purity of Discounting:** A pattern of preference is **purely time-preferring** when a later benefit is dispreferred on the ground that it is later. It is **impurely time-preferring** when the ground is instead uncertainty, the probability that the future will not obtain, the diminishing marginal utility of consumption, or the like.
  3.  **Formal Underdetermination:** Any exponential discount factor can be rewritten as the product of a per-period probability that the future fails to arrive and a residual rate expressing pure time preference. The trade-off between the two is one-dimensional, so no amount of choice behaviour distinguishes the readings. Preference data therefore underdetermine whether a given agent's discounting is pure.

  **Question:**

  Based strictly on the apparatus above, address the following three points in a unified argument:

  1.  Given the stipulated underdetermination of preference data, can an agent be convicted of pure time preference on the basis of her choices alone?
  2.  Is Temporal Neutrality well-formed as a constraint on the ranking of futures, given the stipulated dependence of identity on timing? If not, what would a repair cost?
  3.  Does the strongest argument available for discounting one's own future welfare transfer to discounting the welfare of future people?

  ***

  ### Model Answer

  The apparatus provided dictates that an agent cannot be convicted of pure time preference based solely on choice behavior. The formal underdetermination stipulation establishes that any observed discount rate is mathematically compatible with multiple combinations of existential probability and pure time preference. Since the trade-off is one-dimensional, distinct internal justifications yield identical external choice data. To convict an agent of pure time preference requires isolating the residual rate from the probability term. However, because preference data underdetermine this decomposition, observation of choices alone is insufficient evidence. One would require access to the agent's internal grounds for decision, which are not revealed by the choices themselves. Therefore, behavioral evidence cannot distinguish impure discounting (based on risk) from pure discounting (based on temporal location).

  This epistemic limitation compounds the structural problem regarding Temporal Neutrality. Temporal Neutrality requires ranking a future $F$ equally with a date-shifted version $F+k$. The definition presupposes these futures contain the same individuals relocated in time. However, the background fact stipulates that identity depends on timing; a date-shifted future contains different people. Consequently, the comparison required by Temporal Neutrality is ill-formed. One cannot compare $F$ and $F+k$ as the *same* future with shifted dates because they are populated by distinct individuals. To repair this, one must abandon the presupposition that identity is fixed across the comparison. The cost of this repair is the abandonment of person-affecting constraints in favor of an impersonal axiology. We would no longer be comparing how well specific people fare across time, but rather comparing the total value of two distinct populations. This sacrifices the intuition that Temporal Neutrality is about fairness to specific individuals over time, transforming it into a claim about the time-invariance of abstract value.

  Finally, regarding the transfer of arguments from self to others: the strongest argument for discounting one's own future welfare is the uncertainty of survival, which maps onto the probability term in the formal apparatus, not the pure time preference term. When an agent discounts their own future, they often do so because there is a chance they will not exist to consume the benefit. This is impure discounting. When considering future people, the uncertainty is not about whether *they* will exist given they are already defined in the future sequence, but whether the *sequence* will obtain. However, if we apply the formal apparatus, any discounting attributed to future people must be decomposed into probability and pure rate. Since we have established that choice data cannot isolate the pure rate, and that Temporal Neutrality is ill-formed without impersonal value, the justification for discounting future people collapses into the probability term. The argument for discounting one's own welfare relies on the contingency of the self. The argument for discounting future people cannot rely on the contingency of their identity without violating the repair cost mentioned above. Therefore, the strongest argument for self-discounting (uncertainty of existence) transfers only to the probability component of social discounting. It does not transfer to the residual pure time preference rate. To argue otherwise is to conflate the risk of non-existence with the devaluation of existence based on date, a distinction the apparatus renders empirically invisible but conceptually vital. Thus, while impure discounting transfers, pure time preference does not.

  ***

  ### Marking Scheme

  **Total Marks: 20** (5 Points $\times$ 4 Marks each)

  | Point | Top Answer Move (4 Marks) | Competent Answer Move (2 Marks) | Characteristic Error |
  | :--- | :--- | :--- | :--- |
  | **1. Conviction & Underdetermination** | Explicitly links the one-dimensional trade-off to the impossibility of isolating the pure rate via observation. | States conviction is impossible but treats it as an epistemic gap rather than a formal feature. | Empiricist Overreach |
  | **2. Temporal Neutrality & Identity** | Identifies the contradiction between the "same individuals" presupposition and the "identity depends on timing" stipulation. | Notes identity changes but claims Temporal Neutrality still applies with adjustments. | Category Mistake |
  | **3. Cost of Repair** | Specifies that the repair requires shifting to an impersonal axiology (total value vs. person-affecting). | Vaguely suggests the repair requires "new theories" or "adjusting weights." | Hand-waving |
  | **4. Transfer of Argument** | Distinguishes between the probability term (which transfers) and the pure rate term (which does not). | Argues the transfer fails or succeeds globally without decomposing the discount factor. | Equivocation |
  | **5. Conclusion on Pure Discounting** | Concludes that pure time preference lacks justification via transfer because the self-discount argument is impure. | Concludes that discounting future people is merely "more difficult" or "contingent." | Agnosticism |
