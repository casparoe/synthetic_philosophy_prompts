      *(Refining Maintenance Mode)*: If the brain is split, Ada can't say she's in Rotterdam anymore. She has to concede that "Location of Self" becomes fuzzy. I should press this hard.

      *(Refining the Ending)*: Ada might concede that "Location" is ambiguous, but insist "Survival" is tied to the brain. I might concede "Survival" is brain-based but "Presence" is body-based. That's a good stalemate.

