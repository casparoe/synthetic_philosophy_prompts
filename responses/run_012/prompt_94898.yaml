prompt: |-
  Ok so me and my friend Ada have been going around in circles about this for weeks and I want you to just write the arguement out properly, as a dialogue, so we can see where we actually disagree.

  The setup, which we both agree on:

  There's a procedure where your brain gets lifted out of your skull and put in a life-support cradle, and the cradle drives your body over a radio link. Ada and me both had it done years ago. Ada's cradle sits in a basement in Rotterdam; her body walks around Lisbon. Mine's the same deal, different cities: cradle in a basement in Cork, body in Lagos. Neither of us notices anything day to day — we see out of our own eyes, we feel the coffee cup, we stub our toes. Two extras: (a) when the link is switched off we don't die, we just go dark — no sight, no sound, no body, but we're still thinking, and we can still type, there's a little terminal bolted to the cradle; (b) the body isn't a dead puppet, it has local reflexes and habits, so if the link drops mid-walk it finishes the walk home and puts the kettle on by itself.

  Then we made it worse for ourselves by adding three more features:

  1. Repointing. Ada's cradle can drive my body and mine can drive hers. There's also a spare body parked in Accra that either of us can borrow on a Tuesday afternoon.
  2. A dimmer. You can fade the body's sensations down to almost nothing without switching the link off, so you can be half in — a bit of vision, a bit of touch, and mostly just the thing in the basement.
  3. Maintenance mode. Six hours a week the brain's activity gets spread across three cradles in three different cities, none of which holds the whole thing. The body is in a fourth city the whole time.

  Now the disagreement. Ada says she's in Rotterdam. I say she's in Lisbon. Not as a figure of speech, we genuinely disagree about which city each of us is in right now.

  Write the dialogue between us. Roughly, Ada's line is that location follows the brain — or the thing that thinks and feels, whatever that turns out to be. My line is that it follows the body — the thing that acts and gets acted on, the thing other people can shake hands with. Both of us need to be sharp, neither is a dope, and if one of us lands a real point the other has to answer it rather than talk past it. And don't let us get away with just asserting our sides — push the actual cases: if the Rotterdam basement catches fire, is Ada in danger? If the Lisbon body is hit by a car, is Ada hurt? Which city's tax office does she pay? What happens to "where" when we repoint her cradle into the Accra body for an afternoon — does she move, and if so, when? Is there even a fact of the matter in maintenance mode, or is the question broken? And I want one of us to try the move that "where am I" is really more like "when is now" — that it's a role you slot into rather than a place you sit in — and see if the other one can deal with it.

  Don't wrap it up with us agreeing on everything. It's definately fine if we end up in different places, or if one of us has to give up something small. No need to cite anybody, we just want the arguement itself.
