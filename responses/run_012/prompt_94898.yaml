answer: |-
  **Ada:** We're doing this again?

  **Me:** We're doing this again. We've been circling it for weeks. I want it on the record.

  **Ada:** Fine. But I'm not moving from Rotterdam.

  **Me:** And I'm not moving from Lisbon. That's the problem. You're sitting in a basement in the Netherlands, typing on a terminal bolted to a vat of grey matter, and you claim you're in Portugal.

  **Ada:** I claim I'm in Rotterdam. The *body* is in Lisbon. The *person* is here. Look, if the basement floods, I die. If the Lisbon apartment floods, I get wet. Which one of those is a threat to *Ada*?

  **Me:** If the Lisbon apartment floods, you drown. You told me last week the link transmits suffocation panic at full fidelity.

  **Ada:** It transmits *data*. It's a warning signal. Like a "low battery" light on a drill. If the drill breaks, you don't say the battery died. You say the tool broke.

  **Me:** But you feel the pain. If a car hits your body in Lisbon, *you* scream in Rotterdam.

  **Ada:** I scream because the system is designed to prioritize bodily integrity. It's a feedback loop. But tell me this: If I turn the dimmer down. If I fade the sensations to zero. I'm blind, numb, deaf. I am purely a mind in a jar in Rotterdam. Am I still in Lisbon?

  **Me:** You're present in Lisbon. You're just ignoring the interface.

  **Ada:** No. If I'm numb and blind, I am nowhere. I am a disembodied observer. But the moment I turn the dimmer up, I project *into* the sensors. I don't move my body to the sensors; I pull the sensors into my awareness. The locus of experience is the brain. Always.

  **Me:** The locus of experience might be the brain, but the locus of *action* is the body. And that's what "where" means for people like us. "Where are you?" means "Where can I meet you for coffee?" "Where do I send the package?" "Who do I shake hands with?"

  **Ada:** That's pragmatic shorthand. It's not ontology.

  **Me:** It's not shorthand, it's the definition. Social existence is physical existence. Think about the tax office. You pay taxes in Lisbon. You vote in Lisbon. If you commit a crime in Lisbon, the Portuguese police arrest the body. They don't send a warrant to the Rotterdam basement.

  **Ada:** Because the body is the legal avatar. It's the interface for the state. But if the Rotterdam basement catches fire, the police don't investigate arson in Lisbon. They investigate the destruction of a life-support unit in the Netherlands. The crime follows the brain.

  **Me:** Only because the brain is expensive hardware. If I smash your body in Lagos, you're not just out hardware. You're traumatized.

  **Ada:** Let's test that. Repointing. Tuesday afternoon. I switch my cradle to drive the spare body in Accra. My Lisbon body goes into local reflex mode—it puts the kettle on, locks the door, sits on the sofa. Where am I?

  **Me:** You're in Rotterdam, controlling a drone in Accra.

  **Ada:** I am *in* Accra. I walk down the street. I feel the heat. I buy a fruit. If I trip, I scrape my knee. The Lisbon body is just a shell sleeping on the couch. I have moved.

  **Me:** You haven't moved. You've just changed which remote control you're using. Your center of gravity is still the cradle.

  **Ada:** But the "I" that bought the fruit is the "I" that remembers buying the fruit. The Lisbon body has no memory of the trip. If location follows the body, which body? The one in Accra or the one in Lisbon? They're both mine.

  **Me:** The one you're driving.

  **Ada:** Exactly. Location follows the *active* body. The one linked to the experience.

  **Me:** But the experience is generated in Rotterdam.

  **Ada:** The experience is generated *by* the cradle, but it is *of* Accra. "Here" is defined by the content of the experience, not the substrate.

  **Me:** Okay, let's break that. Maintenance mode. Saturday night. Six hours. Your brain activity is spread across three cradles. Let's say Rotterdam, Berlin, and Paris. None of them holds the whole "Ada." Your body is in Lisbon. Where are you?

  **Ada:** ...That's the edge case.

  **Me:** It's not an edge case. It's six hours a week. Is Ada in three places at once? Is she in none? Is she in Lisbon?

  **Ada:** During maintenance, the "I" is distributed. The question "Where is Ada?" becomes like asking "Where is the internet?" It's a network.

  **Me:** Aha. So during maintenance, you admit you aren't in Rotterdam.

  **Ada:** I admit "Rotterdam" is insufficient. But the body is still in Lisbon. Does that mean I'm in Lisbon during maintenance?

  **Me:** Yes. Because the body is the only thing that stays whole. The body is the anchor. When your mind is fragmented across Europe, the only thing that makes you a single person is that you have one body in Lisbon waiting for you to finish.

  **Ada:** That's a poetic way of putting it, but it's wrong. If the link is cut during maintenance, the three cradles keep thinking fragments. The body in Lisbon walks around on reflex. It makes coffee. It doesn't know who it is. *I* am in the cradles. Even if I'm split.

  **Me:** But you can't type. You can't speak. You're just processes.

  **Ada:** I'm still conscious. Just distributed.

  **Me:** This is where I think you're clinging to the substrate. You think because the neurons are firing in the cradles, that's *you*. But consider the "When is Now" argument.

  **Ada:** Go on.

  **Me:** "Now" isn't a specific timestamp in the universe. It's a role. It's the indexical slot that consciousness fills. "Here" is the same. "Here" isn't a coordinate. It's the place where your agency lands. When you say "I am here," you aren't describing the location of your brain. You're describing the location of your *attention*.

  **Ada:** So "Here" is purely subjective?

  **Me:** It's indexical. Like "Now." If I say "It is happening now," I'm not pointing to a specific second on a clock. I'm pointing to the moment of utterance. If you say "I am in Lisbon," you're pointing to the place of interaction.

  **Ada:** But if "Here" is just where attention lands, then I can be "Here" in Rotterdam by closing my eyes and focusing on the hum of the cooling fan.

  **Me:** You can, but you can't act on Rotterdam. You can't pick up the fan. You can pick up the coffee cup in Lisbon. Agency defines "Here."

  **Ada:** Okay, but flip it. If the link is switched off. I'm in the dark. I can't see Lisbon. I can't touch the cup. I can only type on the terminal bolted to the cradle. Where am I then?

  **Me:** You're in limbo.

  **Ada:** No. I'm in Rotterdam. Because that's the only place I can interact with. I can type "Hello" on the terminal. I can't type "Hello" with the Lisbon hands if the link is off. So when the link is on, I'm in Lisbon. When the link is off, I'm in Rotterdam. Which means my location changes based on the connection status?

  **Me:** It means your *mode of existence* changes.

  **Ada:** Or it means "Location" is the wrong word. But if we have to pick one for the passport, for the tax office, for the emergency contact...

  **Me:** You pick Lisbon.

  **Ada:** I pick Rotterdam. Because if Rotterdam burns, there is no Tuesday afternoon in Accra. There is no Lisbon body. There is no Ada. If Lisbon burns, Ada loses a tool. A very expensive, very sensitive tool. But the thinker survives.

  **Me:** Does she? If the body dies, the brain goes into shock. The trauma kills the mind eventually.

  **Ada:** Eventually. But the brain can be moved. The brain can be put in a new body. If I swap into a new body tomorrow, I'm still Ada. If I swap my brain into a computer, I'm still Ada. The continuity is the pattern of thought, not the flesh.

  **Me:** But the pattern of thought is shaped by the flesh. You like Lisbon food. You hate Lisbon rain. You have friends in Lisbon. If you move your cradle to New York but keep the body in Lisbon, do you become a New Yorker?

  **Ada:** No.

  **Me:** Why not?

  **Ada:** Because my social footprint is in Lisbon.

  **Me:** Exactly! Your social footprint is the body.

  **Ada:** My social footprint is the *history* of the body. But the *current* location of the self is where the processing happens. Look, let's go back to the fire. If the Rotterdam basement catches fire, I am in mortal danger. If the Lisbon apartment catches fire, I am in mortal danger. Both are true. So why is one more "me" than the other?

  **Me:** Because one is replaceable.

  **Ada:** The body is replaceable. The cradle is replaceable.

  **Me:** The *specific* body is replaceable. The *specific* cradle is replaceable. But you can't replace the body without a transition period. You can't just wake up in a new skin without re-calibration. But you *can* move the cradle. You moved your cradle from Amsterdam to Rotterdam last year. You didn't feel like you moved. You felt like the scenery changed.

  **Ada:** Because the scenery *did* change. The body stayed in Lisbon.

  **Me:** Wait. You moved the cradle from Amsterdam to Rotterdam. The body was in Lisbon the whole time. Did you feel like you moved?

  **Ada:** No. I felt like I stayed in Lisbon, and my support system moved.

  **Me:** There it is! Even you admit it. When the hardware moved, you didn't feel displacement. You felt stability. Why? Because your "Here" was locked to the body.

  **Ada:** I felt stability because the sensory input didn't change. The visual field remained Lisbon. If I had been blindfolded, I would have felt the move.

  **Me:** But you weren't blindfolded. You live in your senses.

  **Ada:** I live *through* my senses. There's a difference. The camera is in Lisbon. The viewer is in Rotterdam. If I move the viewer, the picture doesn't change. If I move the camera, the picture changes. Which one determines where I am?

  **Me:** The picture. Because that's the world you live in.

  **Ada:** That's the world you *see*.

  **Me:** Isn't that the same thing?

  **Ada:** Not if the picture is a lie. Not if the link is faked. If someone feeds me a recording of Lisbon while my body is in a box in Cork, where am I?

  **Me:** You're in Cork.

  **Ada:** Why?

  **Me:** Because that's where the body is.

  **Ada:** But my experience is Lisbon. My agency is Lisbon. I reach for a cup, I feel a cup.

  **Me:** You're hallucinating Lisbon.

  **Ada:** So "Where am I?" is "Where is the truth?"

  **Me:** "Where am I?" is "Where is the causal impact?" If you punch someone, where does the bruise appear?

  **Ada:** Lisbon.

  **Me:** Then you're in Lisbon.

  **Ada:** But if someone punches *you*, where does the thought "Ouch" happen?

  **Me:** Rotterdam.

  **Ada:** So the impact is split. The bruise is here. The pain is there. We are stretched between the two cities. We are not in one place. We are a bridge.

  **Me:** A bridge has to be anchored on one side more than the other.

  **Ada:** Why?

  **Me:** Because one side can walk away. If the link breaks, the body walks home. It makes tea. It sleeps. It exists without you. You do not exist without the body. You go dark. You are a ghost in a jar. You need the body to be a person.

  **Ada:** I need the body to be a *person*. But I am a *mind*. The question "Where is Ada?" asks about the mind.

  **Me:** No. It asks about the person. And a person is a social unit.

  **Ada:** Then we're defining "Person" differently. You define it as "Public Agent." I define it as "Private Subject."

  **Me:** Seems like it.

  **Ada:** So if I pay taxes in Lisbon, it's because the Public Agent pays taxes. But if I worry about death, it's the Private Subject worrying.

  **Me:** And the Private Subject dies in Rotterdam.

  **Ada:** Yes.

  **Me:** And the Public Agent dies in Lisbon.

  **Ada:** Yes.

  **Me:** So we're both right.

  **Ada:** No. Because "Where am I?" implies a singular location. If I have to choose one for the emergency services...

  **Me:** Call Lisbon.

  **Ada:** Call Rotterdam.

  **Me:** Why?

  **Ada:** Because if they send the ambulance to Lisbon, they save the shell. If they send the fire brigade to Rotterdam, they save *me*.

  **Me:** If they send the fire brigade to Rotterdam, they save the hardware. If they send the ambulance to Lisbon, they save the experience.

  **Ada:** I'd rather save the hardware.

  **Me:** I'd rather save the experience.

  **Ada:** Then we aren't disagreeing about geography. We're disagreeing about what's worth saving.

  **Me:** Maybe. Or maybe we're just stretched too thin.

  **Ada:** Maybe. Pass the coffee.

  **Me:** I can't. You're in Rotterdam. I'm in Lagos.

  **Ada:** Right. I'll type it.
