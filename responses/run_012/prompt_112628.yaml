answer: |-
  ### Sequence and Dependencies

  1.  **Naive Physicalism (Identity Theory):** Start by articulating the view your group likely already holds: that mental states *just are* brain states (e.g., pain = C-fiber firing).
      *   *Why first:* You cannot motivate Functionalism without first establishing the view it was designed to replace. Functionalism looks unnecessary if Identity Theory seems viable.
  2.  **The Multiple Realizability (MR) Wedge:** Introduce the octopus (or alien/robot) that avoids damage but lacks C-fibers. Ask if it can feel pain.
      *   *Why second:* This depends on Step 1. If pain *must* be C-fibers (Step 1), the octopus cannot feel pain. If the group intuits the octopus *can* feel pain, Identity Theory breaks. This creates the theoretical vacuum Functionalism fills.
  3.  **Functionalism (The Solution):** Define pain not by what it is made of, but by what it *does* (caused by damage, causes avoidance, causes distress).
      *   *Why third:* This depends on Step 2. MR shows substrate doesn't matter; Functionalism provides the alternative criterion (role) that *does* matter.
  4.  **Implications (Silicon/Artificial Systems):** Apply the functional definition to non-biological systems.
      *   *Why fourth:* This depends on Step 3. Once the definition is secured as substrate-neutral, you can test its limits on machines.

  **On Separability:** They are not fully separable. Functionalism *entails* multiple realizability (if states are defined by role, substrate is irrelevant). However, MR is often used as the primary *argument* for Functionalism. Teach MR as the wrecking ball and Functionalism as the reconstruction; do not present them as independent options.

  ### The Single Example: Octopuses and Silicon

  **Rule:** Use **Octopuses and Silicon**. Do not use Money.

  **Justification:** You are correct to suspect Money changes the subject. Money is an *institutional* kind (it exists only because we agree it does); pain is arguably a *natural* kind. Using Money risks teaching participants that mental states are social conventions, which is a different philosophical claim than Functionalism. Octopuses keep the focus on natural systems where the biology-vs-function debate actually lives.

  **Constraint:** To prevent the "smuggling" you feared (getting bogged down in consciousness), strictly frame the octopus example around **nociception** (damage avoidance) rather than **suffering**. Tell the room: "For this hour, treat pain as the state that connects injury to withdrawal, not the private feeling." This keeps the functional role clear without triggering the Hard Problem prematurely.

  ### Misconceptions and Interception Points

  1.  **"Functionalism is just Behaviorism"**
      *   *Where to head it off:* **Step 3 (Functionalism).**
      *   *How:* When defining the causal role, explicitly state that the "internal state" matters. Behaviorism says Pain = Wincing. Functionalism says Pain = The internal state *caused* by damage that *causes* wincing. Emphasize the "black box" has internal gears, not just input-output.
  2.  **"The mind is just software"**
      *   *Where to head it off:* **Step 4 (Implications).**
      *   *How:* Clarify that "software" is an analogy for causal organization, not an identity claim. Functionalism says mental states are *like* software states in being multiply realizable, not that brains literally run code.
  3.  **"This proves a machine could be conscious"**
      *   *Where to head it off:* **Step 2 (MR Wedge) and Step 4.**
      *   *How:* Distinguish between *realizing the functional state* and *having phenomenal experience*. Admit openly that Functionalism explains the *role* of pain, but philosophers dispute whether it explains the *feel* of pain. Do not let the group conflate functional success with subjective awareness.

  ### Closing Question

  To test if Multiple Realizability has landed (rather than just vocabulary), ask:

  *"If we found a human whose C-fibers fired normally when injured, but who felt no distress and never learned to avoid the injury, would we say they are in pain?"*

  *   **Correct Functionalists Answer:** No (because the causal role is broken).
  *   **Identity Theorist Answer:** Yes (because the physical substrate is present).
  *   **Why this works:** It forces them to choose between substrate (biology) and role (function). If they choose role, MR and Functionalism have landed.

  ### Settled vs. Contested

  **Settled (for this session):**
  *   Functionalism defines mental states by causal role, not physical composition.
  *   Multiple realizability is logically possible (the same role can be played by different stuff).
  *   Identity Theory (Pain = C-fibers) is vulnerable to MR counterexamples.

  **Contested (do not present as consensus):**
  *   Whether functional roles are sufficient for *consciousness* (qualia).
  *   Whether syntax (computation) is sufficient for semantics (meaning).
  *   Whether "absent qualia" are possible (a system that functions perfectly but feels nothing).

  **What to Refuse to Settle:**
  Openly refuse to settle whether a silicon chip *feels* pain. State clearly: "Functionalism tells us when to *attribute* pain based on behavior and structure; it does not definitively solve whether that attribution guarantees an inner life. That remains an open dispute."

  Bottom line: Secure the logic of functional definition using the octopus example before allowing any discussion of whether that function guarantees conscious experience.
