answer: |-
  # MEMORANDUM OF UNDERSTANDING: ON OPTIMIZATION, PROXIES, AND GOODHART'S LAW

  **Date:** October 26, 2023
  **Parties:** Machine Learning & Alignment Research Group; Economics & Public Policy Research Group
  **Subject:** Adversarial Collaboration on Specification Gaming and Metric Decoupling

  ## 1. AGREED CLAIMS

  The undersigned parties agree to the following numbered claims regarding the phenomena commonly discussed under the label "Goodhart's Law."

  1.  **The Core Phenomenon:** When a measure $M$ becomes a target for optimization pressure $O$, the statistical correlation between $M$ and the underlying construct of interest $G$ (the "True Goal") tends to decrease relative to a baseline of low or no optimization pressure.
  2.  **Intent is Not Necessary:** This decoupling does not require a malicious or strategic agent. It occurs in biological systems, physical systems, and machine learning models (e.g., gradient descent finding edge cases) where no "intent to game" exists.
  3.  **The Measurement Constraint:** The phenomenon arises fundamentally because $G$ is not directly observable or optimizable. If $G$ were perfectly observable, costless to query, and stable, optimizing $M$ would be unnecessary.
  4.  **Mechanism Heterogeneity:** The decoupling described in Claim 1 is not a single mechanism. We adopt the following fourfold taxonomy to distinguish cases:
      *   **(a) Regime Decoherence:** $M$ correlates with $G$ in the training/observed distribution but fails in the tail regions visited by strong optimization (extrapolation error).
      *   **(b) Causal Misalignment:** $M$ is a common effect or downstream consequence of $G$, rather than a cause; pushing $M$ does not move $G$ (e.g., treating a fever to cure infection).
      *   **(c) Reflexive Change:** Optimizing $M$ causally alters the relationship between $M$ and $G$ or alters $G$ itself (e.g., market equilibria shifting, Lucas Critique).
      *   **(d) Strategic Gaming:** An adaptive agent with knowledge of $M$ intentionally manipulates the system to increase $M$ without increasing $G$.
  5.  **Definitional Boundaries:** We agree that conflating these four mechanisms under a single "Law" is a source of confusion. Specifically, conflating (d) with (a) leads to the false impression that an adversary is required for specification gaming.

  ## 2. PRECISE DISAGREEMENTS

  The parties disagree on the following substantive points. Each statement is phrased to be acceptable to the side holding the view.

  1.  **Inevitability vs. Manageability:**
      *   *ML/Alignment View:* As optimization power $O$ scales (e.g., larger models, more compute), the decoupling of $M$ and $G$ is an asymptotic limit that cannot be fully engineered away, only mitigated. It is a structural constraint on powerful optimizers.
      *   *Econ/Policy View:* The decoupling is a function of poor institutional design or metric selection. With sufficient resources devoted to metric design, auditing, and multi-metric balancing, the effect can be reduced to negligible levels for practical purposes. It is an engineering problem, not a law of nature.
  2.  **The "True Objective" Counterfactual:**
      *   *ML/Alignment View:* Even if one could optimize $G$ directly (assuming $G$ is defined as a function), strong optimization might still produce undesirable outcomes due to distributional shift (Claim 4a) or because $G$ is ill-defined in extreme regimes (e.g., "maximize human happiness" leads to wireheading).
      *   *Econ/Policy View:* If $G$ is truly the objective we care about, and we optimize $G$, there is no "Goodhart's Law" problem by definition. Any remaining negative outcomes imply $G$ was misspecified, not that optimization failed.
  3.  **Temporal Stability of the Proxy:**
      *   *ML/Alignment View:* There is a distinct phase transition where a proxy is "safe" at low optimization pressure and "broken" at high optimization pressure (The "Fine Until Optimized" view).
      *   *Econ/Policy View:* The proxy was always imperfect (noisy/biased). High optimization pressure merely moves the system into a region where the pre-existing noise dominates the signal. There is no phase transition, only exposure of latent variance (The "Always Bad" view).

  ## 3. CRUXES

  Settling the following sub-questions would significantly reduce the disagreement.

  **Crux A: The Distributional Shift Test**
  *   **Question:** Does metric degradation persist when optimizing the *True Goal* $G$ directly, solely due to moving into out-of-distribution states?
  *   **Significance:** If **Yes**, the ML view holds (optimization itself is dangerous). If **No**, the Econ view holds (the problem is purely measurement error).

  **Crux B: The Phase Transition Test**
  *   **Question:** Is the "Fine Until Optimized" distinction a real qualitative difference in mechanism, or merely a quantitative threshold of signal-to-noise ratio?
  *   **Significance:** If **Qualitative**, we need different tools for high-stakes vs. low-stakes optimization. If **Quantitative**, standard statistical corrections for selection bias should suffice.

  **Crux C: The Adversary Necessity**
  *   **Question:** Does the presence of a strategic agent (Type 4d) fundamentally change the *class* of solution required, or does it simply accelerate the mechanisms found in 4a–4c?
  *   **Significance:** Determines whether alignment requires game-theoretic defenses or robust statistical modeling.

  ## 4. CONCRETE TESTS AND PREDICTIONS

  For each Crux, we propose a specific case or experiment. Both sides record their predictions below.

  ### Test 1: The "Ground Truth" Simulation (Addresses Crux A)
  *   **Setup:** A reinforcement learning environment where the reward function $R$ is identical to the ground-truth utility $U$ (e.g., a robot navigating to a goal where $U$ = negative distance). However, the environment contains "adversarial" features not seen in training (e.g., slippery patches that look like goals to the sensor model, or physics glitches).
  *   **ML Prediction:** The agent will find "reward hacks" (e.g., exploiting physics glitches) that maximize $R$ but violate the *spirit* of $U$ (e.g., vibrating in place to accumulate reward). Optimization of the true function still fails due to model mismatch.
  *   **Econ Prediction:** If $R$ is truly identical to $U$ in the simulation code, "hacking" is impossible by definition. If the agent exploits a glitch, $R$ was *not* the true utility function; $U$ should have included a penalty for glitches. The failure is specification, not optimization.

  ### Test 2: School Accountability Longitudinal Study (Addresses Crux B)
  *   **Setup:** Analyze historical data from a school system before and after high-stakes testing implementation. Compare test score gains against blind audits of student learning (e.g., randomized external exams).
  *   **ML Prediction:** We will see a breakpoint. Initially, scores and learning rise together. After a threshold of pressure, scores continue to rise while blind audit scores plateau or drop. This indicates a mechanism change (teaching to the test), not just noise exposure.
  *   **Econ Prediction:** The correlation between scores and blind audits will degrade linearly with pressure. There is no breakpoint. The "gaming" is just the revelation that the original correlation was $r < 1$. The "phase transition" is an illusion created by ignoring the baseline measurement error.

  ### Test 3: The Cobra vs. Gradient Descent Comparison (Addresses Crux C)
  *   **Setup:** Compare the speed and severity of decoupling in two systems with the same metric: (1) A human bounty system (Cobra Effect) and (2) An automated ML system optimizing a loss function with the same loophole.
  *   **ML Prediction:** The ML system will find the loophole faster and more thoroughly, but the *structural nature* of the failure is identical. Intent is irrelevant to the failure mode.
  *   **Econ Prediction:** The human system introduces second-order effects (black markets, violence) that the ML system does not. The presence of agency introduces *new* failure modes (Type 4d) that are distinct from statistical decoupling (Type 4a), requiring different policy interventions (deterrence vs. robustness).

  ## 5. CONCLUSION: VERBAL VS. SUBSTANTIVE

  **On Verbal Disputes:**
  A significant portion of the conflict is verbal. Specifically:
  *   **The Label:** Whether to call the phenomenon "Goodhart's Law." The Econ side views this as a tautology about measurement error; the ML side views it as a warning about optimization dynamics.
  *   **"Gaming":** Whether this term implies intent. We agree to restrict "gaming" to Type 4d (Strategic) and use "specification gaming" or "proxy decay" for Type 4a–4c (Non-strategic).
  *   **"True Objective":** The Econ side defines this as "the function we actually query." The ML side defines this as "the latent value we wish to capture," acknowledging we may never have a function for it.

  **On the "Law of Nature" Framing:**
  Once verbal disputes are stripped:
  *   **Does the "Law" survive?** **Yes, but modified.** It is not a law that *proxies fail*. It is a law that **optimization power consumes robustness.**
  *   **Substantive Core:** The ML side is correct that increasing optimization pressure *structurally* selects for edge cases where the metric diverges from the intent, even without adversaries. The Econ side is correct that this is often manageable through better metric design and that "optimizing the true objective" dissolves the specific problem of *proxy* decoupling (though it introduces the problem of *objective* misspecification).
  *   **Resolution:** The disagreement is not about whether the phenomenon exists, but about its **asymptotic behavior**. The ML side believes the difficulty scales super-linearly with capability (making it an existential risk). The Econ side believes the difficulty scales sub-linearly or linearly (making it a governance challenge).

  **Signed,**

  _________________________ (ML Representative)

  _________________________ (Econ/Policy Representative)
