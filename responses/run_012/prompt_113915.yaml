answer: |-
  **MEMORANDUM**

  **TO:** Interpretation Committee
  **FROM:** Chair, Interpretation Committee
  **DATE:** Monday, [Date]
  **SUBJECT:** Decision Framework: Battle of the Ford Plaque and Future Interpretation Policy

  **Purpose**
  This memo provides a recommendation for the Battle of the Ford plaque vote on Tuesday and proposes a standing policy to handle future requests (including the September Exodus exhibit and November Trojan War draft). Our goal is to protect the County's reputation for accuracy without dismissing local heritage.

  **1. Recommendation: Battle of the Ford Plaque**
  **Decision:** Approve with amended text.
  **Reasoning:** A flat rejection alienates the community and ignores the cultural reality of the site. A flat approval exposes the County to ridicule given the lack of contemporary evidence. The compromise is to mark the site as *traditional* rather than *factual*.

  **Proposed Motion Wording:**
  > "The Committee approves the installation of a plaque at the river crossing, contingent on the following text revision:
  >
  > 'TRADITIONAL SITE OF THE BATTLE OF THE FORD
  > According to local tradition recorded in later chronicles, this crossing was defended by the kings of the west against invaders in the 6th century (traditionally dated 516). While archaeological evidence from this period has not yet been found, this location has been recognized by the valley community as the battle site for over a millennium.'
  >
  > The Committee agrees to revisit this designation only upon the discovery of contemporary archaeological evidence or contemporary written records."

  **Why this works:** It validates the Society's work (the tradition is real) without validating the fact (the battle is unproven). It shifts the claim from "This happened here" to "People believe this happened here," which is historically accurate.

  **2. Proposed Policy: The Interpretation Test**
  To prevent case-by-case fights, I propose we adopt the following three-tier test for all labels and plaques. This addresses the concern about "heritage inflation" by requiring us to label the *type* of claim we are making.

  *   **Tier 1 (Verified):** Supported by contemporary evidence (archaeology or documents). *Labeling:* State as fact. (e.g., "A Roman fort stood here.")
  *   **Tier 2 (Traditional):** Supported by later sources or continuous oral tradition, but lacking contemporary evidence. *Labeling:* Must use qualifiers ("Traditionally," "According to legend," "Believed to be"). (e.g., The Ford Plaque).
  *   **Tier 3 (Symbolic):** No historical evidence, significant cultural/religious meaning. *Labeling:* Must contextualize as narrative or belief, not history. (e.g., The Exodus Exhibit cannot say "Historically Confirmed" unless Tier 1 evidence exists).

  **Addressing "Heritage Inflation"**
  One member has argued that distinguishing between "event," "place," and "story" is just a way to have it both ways. He is partially right: it *does* allow us to keep the story. But it is not inflation if we disclose the rate of exchange. Heritage inflation occurs when tradition is sold as fact. This policy prevents that by forcing us to declare the evidence tier. It ensures a future committee cannot swap a Tier 2 claim for a Tier 1 label without new evidence.

  **3. Preparation for the Vote**
  The Society's Secretary will argue that **continuous memory is its own form of evidence.** Her strongest point is that archaeology is incomplete; absence of evidence is not evidence of absence. She will argue that the County should honor the lived experience of the valley over the silence of the dirt.

  **Counter-argument:**
  Acknowledge the validity of memory, but distinguish the *function* of a County plaque. It is not a monument to belief; it is a statement of the County's current historical understanding. We are not saying the story is fake; we are saying our *label* must reflect the difference between a 6th-century event and a 12th-century record of that event. If we label tradition as fact, we undermine the Tier 1 sites where we actually have the evidence.

  **4. Application to Future Cases**
  *   **Exodus Exhibit (September):** Under this policy, unless they provide contemporary Egyptian or archaeological evidence (Tier 1), our label cannot say "Historically Confirmed." It must read "According to Biblical tradition..."
  *   **Trojan War (November):** Archaeology proves a city existed and was destroyed (Tier 1), but not that Homer's specific story occurred (Tier 2/3). The text must reflect that distinction.

  **Next Steps**
  If the motion passes Tuesday, I will draft the standing policy for formal adoption at the next meeting. This gives us a consistent shield for the upcoming requests.

  **Recommendation:** Move to approve the plaque with the revised text above.
