  "You treat history as a vector," Elena said. "I treat it as a topology."

  Marcus set down his coffee. "And I treat your topology as a vector we haven't finished measuring. But let's not trade metaphors. When you say 'cyclical,' what do you forbid? We need to separate what you mean."

  "Three things," Elena said. "First, that like events recur rhythmically, like seasons. Second, that a system returns to an earlier state, so the long-run path is a loop rather than a ray. Third, that a bounded episode has a rise-and-decline shape."

  "I can accept the third," Marcus replied. "Empires rise and fall, but knowledge often survives the fall. That's compatible with overall directionality. A civilization can die while the species advances. So the dispute rests on the first two. Do we see rhythmic recurrence, or a true loop?"

  "I don't claim rhythmic precision," Elena said. "I claim the loop. But you face the one-run problem. We possess a single realization of history. You claim directionality, but a global claim is hard to test. I observe local ratchets—capabilities we don't lose—but you observe them too. The difference is that I see the ratchet within a loop."

  "One run cuts both ways," Marcus countered. "You cannot establish that the path never loops either. A single line segment does not prove an infinite ray. But within the run, local ratchets are observable. We cannot un-invent writing. We cannot un-record the past. That is irreversible accumulation. Even if empires fall, the next ones start with a higher baseline."

  "Is the baseline real, or is it an artifact?" Elena leaned forward. "Here is my hypothesis: the felt direction of history is partly an artifact of the recording medium. A society that keeps cumulative records experiences its past as a line, because the archive only grows. A society that stores its past in memory and ritual experiences it as a cycle, because what is retained is the recurring pattern, not the dated sequence."

  Marcus frowned. "Is the archive really independent of the events it records? Does the hypothesis explain anything, or merely redescribe? If writing enables complex administration, isn't that material progress, not just perceptual? You suggest the line is a shadow cast by the library."

  "It shapes the experience of time," Elena said. "Without an external store, memory selects for utility and pattern. Patterns recur. Archives select for sequence. Sequences extend. The linearity you see is the growth of the stack, not necessarily the growth of the human condition. The archive creates the illusion of the line by refusing to let go."

  "But the stack enables new moves," Marcus said. "Which brings me to your positive case. You argue that what recurs is not the answers but the problem space—succession, legitimacy, the distribution of surplus, the temptation of the strong. So history is repetitive in the way a game is repetitive even when every move is new."

  "Yes," Elena said. "The board changes, the rules of power do not."

  "Then that is a claim about human nature," Marcus replied, "rather than about historical form. A claim about human nature cannot do the work a theory of history is supposed to do. History is the study of the moves, not the board. If the moves accumulate complexity, the history is linear, regardless of the players' psychology. You are describing constants; I am describing variables."

  "So we differ on scale," Elena said. "You analyze the species; I analyze the civilization. If the unit is the dynasty, I am right. If the unit is humanity, you might be. But this matters. My view predicts that if technology collapses, the structural problems of legitimacy and surplus will not vanish; they will reappear in their premodern form. Your view forbids this. You must claim the problems evolve beyond recognition."

  "I will narrow my position," Marcus said. "I do not claim moral progress or that problems vanish. I claim informational capacity. If humanity loses the capacity to sustain its archive, does it return to your cycle?"

  "Yes," Elena said. "Then the progress is contingent on the medium."

  "Then we are closer than I thought," Elena said. "But not identical."

  "No. We end by naming the crux," Marcus said. "The dispute turns on this: Is the structure of time inherent in events, or imposed by the memory of events?"

  "For you to be right," Elena said, "I must concede that the archive is neutral, that it records direction without creating it."

  "And for me to be right," Marcus said, "I must concede that without the archive, the direction vanishes, leaving only the cycle of human needs."

  "Then the archive is not just a record," Elena said. "It is the engine."

  "Or the illusion," Marcus replied.
