      "You treat history as a vector," Elena said. "I treat it as a topology."
      Marcus set down his coffee. "And I treat your topology as a vector we haven't finished measuring. But let's not trade metaphors. When you say 'cyclical,' what do you forbid?"
      "Three things," Elena said. "First, rhythmic recurrence, like seasons. Second, a return to a prior state, a loop rather than a ray. Third, a bounded shape, rise and decline."
      "I can accept the third," Marcus replied. "Empires rise and fall, but knowledge survives the fall. That's compatible with overall directionality. So our dispute is the second: does the system ever truly return to a prior state, or does it only move forward?"
      "Exactly. But you face the one-run problem. We possess a single realization of history. You claim directionality, but a global claim is hard to test. I observe local ratchets—capabilities we don't lose—but you observe them too. The difference is that I see the ratchet within a loop."
      "One run cuts both ways," Marcus countered. "You cannot establish that the path never loops either. But within the run, local ratchets are observable. We cannot un-invent writing. We cannot un-record the past. That is irreversible accumulation."
      "Is it?" Elena leaned forward. "Here is my hypothesis: the felt direction of history is an artifact of the recording medium. A society that keeps cumulative records experiences its past as a line, because the archive only grows. A society that stores its past in memory and ritual experiences it as a cycle, because what is retained is the recurring pattern, not the dated sequence."
      Marcus frowned. "Is the archive independent of the events it records? Or does the capacity to accumulate create the events? If you argue that writing creates linearity, are you explaining history or merely redescribing the medium?"
      "I'm arguing that the medium structures the experience of time," Elena said. "Without an external store, memory selects for utility and pattern. Patterns recur. Archives select for sequence. Sequences extend. The linearity you see is the growth of the stack, not necessarily the growth of the human condition."
      "But the stack enables new moves," Marcus said. "Which brings me to your positive case. You argue that what recurs is not the answers but the problem space—succession, legitimacy, the distribution of surplus. History is repetitive like a game is repetitive, even when every move is new."
      "Yes," Elena said. "The board changes, the rules of power do not."
      "Then that is a claim about human nature," Marcus replied, "rather than about historical form. A claim about human nature cannot do the work a theory of history is supposed to do. History is the study of the moves, not the board. If the moves accumulate complexity, the history is linear, regardless of the players' psychology."
      "So we differ on scale," Elena said. "You analyze the species; I analyze the civilization. If the unit is the dynasty, I am right. If the unit is humanity, you might be."
      "I will narrow my position," Marcus said. "I do not claim moral progress. I claim informational capacity. If humanity loses the capacity to sustain its archive, does it return to your cycle?"
      "Yes," Elena said. "And I predict this: if technology collapses, the structural problems of legitimacy and surplus will not vanish; they will reappear in their premodern form. Your view forbids this. You must claim the problems evolve beyond recognition."
      "No," Marcus said. "I claim the tools to solve them evolve. But if the tools vanish, the progress halts. It does not reverse."
      "Then we are closer than I thought," Elena said. "But not identical."
      "No. We end by naming the crux," Marcus said. "The dispute turns on this: Is the structure of time inherent in events, or imposed by the memory of events?"
      "For you to be right," Elena said, "I must concede that the archive is neutral, that it records direction without creating it."
      "And for me to be right," Marcus said, "I must concede that without the archive, the direction vanishes, leaving only the cycle of human needs."
      "Then the archive is not just a record," Elena said. "It is the engine."
      "Or the illusion," Marcus replied.

