answer: |-
  **MEMORANDUM**

  **TO:** Members, Standing Science Advisory Panel
  **FROM:** Chair, Standing Science Advisory Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Final Recommendation Regarding the Classification of XR-7

  **1. Purpose and Recommendation**

  This memo serves as the Chair's formal recommendation for the third and final review of the flame retardant compound XR-7. Our mandate is to provide the Agency Director with a classification that is scientifically defensible and actionable. After two prior sessions, we remain divided not merely on the weight of the evidence, but on the epistemic status of the evidence itself.

  It is the Chair's recommendation that the Panel classify XR-7 as a **Possible Human Carcinogen** (equivalent to IARC Group 2B or EPA Category B2). Furthermore, I recommend the Panel advise the Director to proceed immediately with rulemaking to reduce involuntary human exposure to XR-7 in consumer furniture foam, aiming for a 50% reduction in ambient levels within 24 months.

  This recommendation is not a declaration that XR-7 is definitively carcinogenic at current exposure levels. It is a determination that the uncertainty surrounding XR-7 is itself a hazard that requires management. The Director may act on this recommendation without further scientific elaboration from this Panel.

  **2. Assessment of the Evidence**

  We have reviewed the available toxicological and epidemiological data. The record stands as follows:

  *   **Animal Bioassays:** Liver tumors are observed in mice and rats, but only at doses approaching the Maximum Tolerated Dose (MTD). These tumors are preceded by enzyme induction, oxidative stress, and compensatory cell proliferation.
  *   **Human Epidemiology:** Three cohort studies exist. All suffer from wide confidence intervals. Exposure assessment in two studies relied on job titles rather than biological monitoring. Crucially, co-exposure to a structurally similar flame retardant remains a confounding variable that has not been disentangled.
  *   **Mechanistic Data:** A new in vitro assay suggests potential genotoxicity at low doses. However, this assay lacks inter-laboratory validation.

  Taken strictly, this body of evidence does not compel a single conclusion. The animal data are consistent with a threshold mechanism (non-genotoxic), suggesting low risk at environmental exposure levels. However, the data are also consistent with a non-threshold mechanism obscured by high-dose toxicity. The human data are compatible with both a modest increase in cancer risk and no increase at all.

  **3. The Question of Underdetermination**

  A member of this Panel has argued persuasively that the evidence *underdetermines* the classification. This position holds that no amount of additional research will resolve the ambiguity because the auxiliary hypotheses required to interpret the data (e.g., the validity of the new assay, the linearity of dose-response) are themselves contested.

  I accept this logic. We are not selecting a scientific fact that exists independently of our judgment. We are choosing how to distribute the risk of being wrong. If we classify XR-7 as benign and are incorrect, the cost is measured in avoidable cancers. If we classify XR-7 as a possible carcinogen and are incorrect, the cost is measured in economic disruption to manufacturers and potential loss of agency credibility should the compound later be proven safe.

  The disagreement before us is not about biology; it is about which error we are willing to tolerate. To claim that science alone dictates a "wait and see" approach is to make a policy choice disguised as scientific neutrality. Inaction is a decision with consequences equal to action.

  **4. The Panel's Decision Rule**

  Given that the science does not dictate a single path, the Panel must adopt a decision rule to break the tie. I propose the Panel adopt the following standing principle for cases of this shape:

  *   **Burden of Proof:** In cases where evidence is ambiguous but suggests plausible harm, the burden of proof shifts to the proponents of the exposure to demonstrate safety, rather than requiring the public to demonstrate harm.
  *   **Involuntary Exposure:** Weight must be given to the nature of the exposure. XR-7 is present in furniture foam. Exposure is largely invisible and involuntary for the general public. Individuals cannot reasonably opt out of this risk through personal behavior.

  Where exposure is involuntary and the biological plausibility of harm exists, the benefit of the doubt must be accorded to public health. This is not an abandonment of science; it is the application of the precautionary principle where scientific resolution is currently impossible. Therefore, despite the underdetermination, we must act to mitigate risk.

  **5. Scientific Triggers for Re-evaluation**

  My position is contingent on the current state of the data. I am prepared to recommend reclassification of XR-7 to "Not Classifiable" or "Unlikely Carcinogen" should the following evidence emerge:

  1.  **Validation of Mechanistic Assays:** If the new in vitro assay is validated through an inter-laboratory comparison and demonstrates a clear threshold below which no oxidative stress or proliferation occurs.
  2.  **Resolved Epidemiology:** If a new cohort study utilizes biological monitoring (serum levels) rather than job titles, and successfully controls for the confounding flame retardant, showing no association with liver cancer endpoints.
  3.  **Mode of Action Consensus:** If a consensus is reached among independent toxicologists that the liver tumors observed in rodents are strictly secondary to species-specific metabolic pathways not present in humans.

  Until such data are available, the "Possible Carcinogen" classification remains the most scientifically honest and protective stance.

  **6. Public Communication Guidance**

  It is inevitable that this decision will be reported in the press. There is a risk that a quote will emerge stating, "The evidence proves nothing." While technically accurate regarding definitive causality, this phrasing is misleading regarding risk management.

  The Agency should describe the decision as follows: *"The science on XR-7 is complex and not yet settled. However, because there is credible evidence of potential harm and the public cannot easily avoid exposure, the Agency is choosing to prioritize safety. We are acting on the warning signs now rather than waiting for definitive proof that may come too late."*

  This framing acknowledges the uncertainty without undermining the regulatory action. It clarifies that the classification reflects a margin of safety, not a confirmed diagnosis of the chemical's properties.

  **7. Strongest Objection**

  *Per Panel practice, the following section records the strongest objection to the Chair's recommendation, drafted in the voice of the dissenting member.*

  **Minority Opinion: The Integrity of Scientific Classification**

  "I cannot endorse this recommendation. The Chair correctly identifies that the evidence underdetermines the classification, but incorrectly concludes that a 'Possible Carcinogen' designation is the appropriate remedy. By classifying XR-7 based on a policy preference rather than a preponderance of scientific evidence, we conflate hazard identification with risk management.

  This classification implies a level of toxicological concern that the data do not support. The animal tumors occur only at the Maximum Tolerated Dose and follow a thresholded mode of action. To classify this compound as a possible carcinogen is to ignore the dose-response relationship, which is the cornerstone of toxicology.

  Furthermore, this decision establishes a dangerous precedent. It signals that when the science is difficult, the Panel will default to regulation rather than admitting uncertainty. This erodes the credibility of the Panel. If we classify compounds as carcinogens based on the *involuntary* nature of exposure rather than the *strength* of the evidence, we cease to be a science advisory body and become a policy advocacy group. Industry stakeholders will rightly challenge the scientific basis of this ruling, and if the mechanistic data are later validated as thresholded, the Agency's credibility will suffer irreparable damage. The honest scientific opinion is 'Unclassifiable.' We should recommend further research, not regulate based on ambiguity."

  **8. Conclusion**

  We are tasked with advising the Director on how to protect the health of this state's residents. We cannot wait for perfect data that may never arrive. The logic of underdetermination does not lead to paralysis; it leads to a clear-eyed acknowledgment that we must choose our errors. I choose to err on the side of protecting the public from involuntary risk.

  I request that we vote on this recommendation at the start of Thursday's session.

  Respectfully,

  Chair, Standing Science Advisory Panel
