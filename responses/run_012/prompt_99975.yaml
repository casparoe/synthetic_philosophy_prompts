answer: |-
  ### Agenda: Theoretical Foundations of Verification Asymmetry in Debate

  The core constraint is **Verification Asymmetry**: $Cost(Verify) \gg Cost(Generate\_Plausible)$. If a dishonest agent can produce a claim that looks sound to a bounded judge $J$ but requires resources $> Budget(J)$ to refute, debate fails as an oversight mechanism. The following agenda orders the open problems by upstream dependency, focusing on whether this asymmetry is a fundamental complexity barrier or a solvable engineering constraint.

  ---

  ### 1. The Complexity of Plausible Obfuscation (The Threat Model)
  **Question:** *Is there a formal complexity class for "plausible falsehoods" relative to a bounded verifier, and does it strictly contain the class of "efficiently verifiable truths"?*

  *   **Why Upstream:** Before analyzing whether debate *solves* the asymmetry, we must determine if the asymmetry is a contingent feature of current models or a structural theorem of information. If plausible obfuscation is equivalent to a one-way function relative to the judge's computational class, no amount of protocol tweaking will solve it.
  *   **Theorist/Philosopher Progress:** An ML empiricist cannot solve this because scaling does not reveal complexity classes. A theorist can map natural language argumentation to Interactive Proof (IP) systems. Specifically, they can define "plausibility" not as semantic truth, but as *consistency with a bounded axiom set*. The work involves constructing a formal model where a "lie" is a witness that satisfies local consistency checks (the judge's budget) but fails global consistency (the truth).
  *   **Movement Criteria:**
      *   **Move Up (Priority Increases):** If a proof is found that obfuscation is *not* hard (e.g., all plausible lies can be debunked in $O(\log n)$ queries), debate becomes theoretically robust.
      *   **Move Down (Priority Decreases/Stop):** If it is proven that for any bounded verifier $V$, there exists a generator $G$ such that $G$ produces undetectable falsehoods with probability $1 - \epsilon$, debate is theoretically dead as a general oversight method.

  ### 2. The Tractability of Recursive Decomposition (The Mechanism)
  **Question:** *Does recursive debate reduce the verification complexity class of a claim from Intractable (for J) to Tractable (for J), or does error compound exponentially?*

  *   **Why Upstream:** This is the primary proposed solution to Problem 1. Debate relies on the claim that any complex claim can be decomposed into sub-claims simple enough for $J$ to verify. If the "overhead" of managing the decomposition tree exceeds the savings from simplifying the nodes, the asymmetry remains.
  *   **Theorist/Philosopher Progress:** This requires analyzing the *depth vs. width* of the debate tree using communication complexity theory. A philosopher can contribute by defining the "atomic units" of justification—what constitutes a claim simple enough for $J$? A theorist can model the propagation of error: if the dishonest agent lies at a leaf node, does that lie propagate up the tree in a way $J$ can detect, or does the tree structure allow the lie to be hidden as "ambiguity"?
  *   **Movement Criteria:**
      *   **Move Up:** If a theorem shows that decomposition reduces verification cost from $O(2^n)$ to $O(n^k)$ for the judge.
      *   **Move Down:** If analysis shows that to keep error below threshold $\delta$, the debate tree must grow exponentially, exceeding the total compute budget of the system (agents + judge).

  ### 3. The Query Complexity of Exposure (The Protocol)
  **Question:** *What is the minimum number of cross-examination turns required for an honest agent to force a dishonest agent into a contradiction, given the asymmetry?*

  *   **Why Upstream:** This depends on the answers to 1 and 2. Once we know obfuscation is possible (1) and decomposition helps (2), we need to know if the *interaction* allows the honest agent to win within the budget.
  *   **Theorist/Philosopher Progress:** This is a game-theoretic bound. The theorist treats the debate as a game of incomplete information. The philosopher analyzes the epistemic state of the judge: does the judge update on *contradiction* or on *explanation*? The work involves deriving lower bounds on the number of queries needed to collapse the "plausible space" of the lie.
  *   **Movement Criteria:**
      *   **Move Up:** If the query complexity is shown to be logarithmic relative to the complexity of the claim.
      *   **Move Down:** If the honest agent requires more turns than the context window or time budget allows to corner the dishonest agent.

  ---

  ### Classification of Sub-Questions

  Generated by the Verification Asymmetry crux, the sub-questions fall into three categories:

  1.  **Answerable with Existing Tools:**
      *   *Mapping to Interactive Proofs:* We can immediately model debate as a Multi-Prover Interactive Proof (MIP) system where the judge is the verifier. Existing literature on MIP with bounded verifiers (e.g., *MIP with limited randomness*) can provide immediate bounds on what is verifiable.
      *   *Communication Complexity:* We can calculate the bits required to transmit a proof of consistency vs. a proof of inconsistency.

  2.  **Dissolving Upon Precision:**
      *   *"What is the truth?"* This dissolves into *"What is the shortest proof verifiable by J?"* Once we stop treating truth as metaphysical and treat it as "verifiable consistency within budget," the philosophical fog clears.
      *   *"Can the judge trust the agents?"* This dissolves into *"Is honesty a Nash Equilibrium?"* If the payoff matrix (reward for winning) makes lying costly due to cross-examination risk, trust is irrelevant; incentives are sufficient.

  3.  **Critical Negative Results (Kill-Switches):**
      *   **The Obfuscation Theorem:** If it is proven that generating a plausible lie is $O(1)$ while verifying it is $O(N)$ for the judge's class, debate is non-viable for high-stakes oversight.
      *   **The Error Compounding Theorem:** If it is proven that the probability of a hidden lie surviving the tree scales as $1 - (1-\epsilon)^{depth}$, and depth must be large for complex tasks, debate is non-viable.

  ---

  ### Funding Recommendation

  If I have three researcher-years, I would fund **Problem 1 (Complexity of Plausible Obfuscation)** and **Problem 2 (Tractability of Recursive Decomposition)**.

  **Defense Against the Runner-Up (Problem 3: Query Complexity):**

  Problem 3 is the optimization of the protocol, but Problems 1 and 2 are the *existence proofs* of the threat and the solution, respectively.

  *   **Why Problem 1 is Essential:** If the Verification Asymmetry is a fundamental complexity barrier (akin to P vs NP), no amount of cross-examination (Problem 3) will help. A dishonest agent can simply generate a lie that is mathematically impossible for the judge to unpack, regardless of how many questions are asked. Funding Problem 3 without resolving Problem 1 is like optimizing the aerodynamics of a car that has no engine. We must know if the "obfuscation class" exists before we try to navigate it.
  *   **Why Problem 2 is Essential:** Recursive decomposition is the *only* mechanism debate proponents offer to bridge the asymmetry. If decomposition fails to reduce complexity (e.g., because the "glue" between sub-claims is as hard to verify as the original claim), the protocol collapses. Problem 3 assumes the tree structure works; Problem 2 tests the tree structure itself.

  **Strategy:**
  Assign 1.5 researcher-years to **Problem 1**. This requires deep engagement with complexity theory and formal epistemology. A negative result here saves the foundation from wasting years on a broken paradigm.
  Assign 1.5 researcher-years to **Problem 2**. This requires modeling the debate tree and error propagation.
  **Problem 3** is left unfunded for now because it is downstream: if 1 or 2 yield negative results, 3 is irrelevant. If 1 and 2 yield positive results, 3 becomes the natural next phase for a subsequent grant cycle.
