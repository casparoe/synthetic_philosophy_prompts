answer: |-
  This is a wonderful puzzle, and it makes perfect sense that you find yourself stuck here. You are grappling with the gap between the *psychological* conditions of a promise (what I intended, what you expected) and its *normative* force (what the obligation actually is).

  As a philosopher of science, you know that scientific practice is built on a scaffold of informal norms—priority, credit, data ownership—that often outstrip formal rules. Your puzzle touches on the intersection of speech-act theory, the ethics of promising, and the specific economy of academic credit.

  Here is a breakdown of what might be at stake, structured around the three tensions you identified: the counterfactual nature of the promise, the standing of the promisee, and the validity of the release.

  ### 1. The Function of the Promise: Constraint vs. Security
  You ask: *"If a promise matters because of what it lets the other person count on, mine seems to have done nothing: my behavior didn't change."*

  This relies on a **predictive** model of promising (I promise $X$ = I predict I will do $X$). But most philosophical accounts (Scanlon, Rawls, Searle) treat promising as **normative**. A promise does not merely report a future state; it creates a new reason for action that did not exist before.

  Even if you had no intention of running the analysis, R was not buying a prediction; he was buying **security against a change of mind**. In the economy of academic publishing, data is a finite resource. By asking for your word, R was attempting to carve out a distinct intellectual property right within the shared dataset. He was saying, "Even if you don't want this now, I need to know this slice of the possibility space is reserved for me."

  Therefore, the promise was not "empty" at the time. It performed the work of **boundary marking**. It converted R's *hope* for priority into a *claim* recognized by a peer. The fact that you wouldn't have violated it anyway is normatively irrelevant to the creation of the obligation. (Consider: If I promise to meet you for lunch, but my car breaks down, I have still broken the promise even if I physically couldn't have come. The obligation exists independently of the counterfactual ability to fulfill it.)

  ### 2. The Standing and the "Walk Away"
  You ask: *"I don't see why his say-so binds me when it constrains nothing and he has, in effect, walked away from it."*

  This is the crux of the scientific norm issue. Why did R want the promise? Presumably, to publish. Now that R has left academia, his capacity to publish is diminished or nullified.

  *   **The Harm Principle:** If the point of the promise was to prevent harm to R's career (scooping, loss of priority), and R has voluntarily removed himself from the arena where that harm could occur, the *consequentialist* weight of the promise has evaporated. There is no one to scoop.
  *   **The Integrity Principle:** However, if the point of the promise was to uphold a system of trust within the lab, the obligation shifts from *R* to *the practice*. If you treat the promise as void simply because R is no longer a competitor, you are treating the promise as a transactional contract rather than a commitment to a norm of collaboration.

  This explains your unease. You sense that while R has waived his *personal* claim, the *structural* norm (that we respect reserved analyses) remains. If you treat the promise as void solely because R left, you risk undermining the very mechanism that makes such promises useful for those who *stay*.

  ### 3. The Release: "Do Whatever You Like"
  You write: *"His 'do whatever you like' doesn't read to me as a release, though I couldn't say why."*

  Normatively, a promisee generally has the right to release a promisor. If R says "I release you," you are free. So why does it feel insufficient? I suspect it is due to **informational asymmetry**.

  When R said "do whatever you like," did he know:
  1.  That you now have a new collaborator?
  2.  That this specific analysis is now the *primary* value of the dataset for you?
  3.  That running it might generate a paper that, while not harming him, might look like you capitalized on his departure?

  A valid release usually requires that the promisee understands what they are releasing. If R thinks he is releasing you from a trivial constraint on a dataset he considers "dead," but you are asking him to release you from a constraint on a project that is now "live," the release might be invalid due to lack of informed consent. He waived a right he thought was worthless; you hold a right that has become valuable.

  ### Synthesis: What is Genuinely at Stake?

  The promise is asking you to navigate two different kinds of integrity:

  1.  **Fidelity to the Person (R):** R has explicitly released you. To insist on being bound against his current will is arguably paternalistic. It treats him as a stakeholder when he has declared himself a non-stakeholder.
  2.  **Fidelity to the Practice (Science):** The promise was a placeholder for the norm of priority. Even if R is gone, the *logic* of the promise remains. If you run the analysis, you are effectively utilizing a path that was marked "reserved."

  ### A Proposed Path Forward

  You do not need to be squeamish, but you should be transparent. The "weight" of the promise now lies less in the prohibition itself and more in the **acknowledgment of the history**.

  Here is how you might resolve the tension without treating your word as a formality:

  1.  **Accept the Release, but Acknowledge the Debt:** R's email is a release. You are normatively free to proceed. However, because the promise *did* have weight (it secured his priority at the time), proceeding without acknowledgment feels like a violation of the *spirit* of the agreement, even if the *letter* is satisfied.
  2.  **The Collaborator Constraint:** Your new collaborator is the variable R didn't account for. Does your promise to R extend to your future collaborations? Usually, yes. You cannot outsource a violation. But since R released you, you can bring the collaborator in.
  3.  **The Solution:** Run the analysis, **but** cite or acknowledge R's contribution to the conceptualization of the dataset, or explicitly note in your internal records (or even the paper's acknowledgments) that this analysis was previously reserved for R.
      *   *Why?* This honors the **boundary-marking** function of the original promise. It admits: "This was R's territory. He let me into it."
      *   This prevents the "scooping" intuition. You aren't stealing the idea; you are inheriting the license.

  **Conclusion:**
  The promise was not empty; it was a claim on future possibility space. R has now collapsed that space by leaving academia and waiving the claim. You are free to act, but your unease is a signal that you should not act *as if the promise never happened*. You should act as if the promise happened, was honored, and then was graciously waived.

  If you proceed, do so with the explicit understanding that you are operating on a waiver, not on a lack of obligation. That distinction preserves your integrity as a promisor while respecting R's autonomy as a releasor.
