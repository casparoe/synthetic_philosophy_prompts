      *   **Counterfactual Dependence:** If I would have done $A$ anyway, does promising not to do $A$ matter? (The "Pre-emption" problem).
      *   **Standing and Authority:** Why did R want the promise? To claim ownership? To secure priority? To manage risk?
      *   **Release and Waiver:** Can a promisee release the promisor? Yes, usually. But does R's email count as a valid release?
      *   **The "Empty Promise" Intuition:** The user feels the promise might have been "empty" because it didn't constrain action *at the time*. But promises often constrain *future* possibilities, not just current intentions.
      *   **Scientific Norms:** Priority, credit, data ownership, collaboration ethics.

  3.  **Brainstorming Perspectives:**

      *   *Perspective 1: The Obligation View (Scanlonian).* Promises create expectations and invite reliance. Even if you didn't rely on it to change *current* behavior, you relied on it to secure *future* exclusivity. R wanted a guarantee against a change of heart.
      *   *Perspective 2: The Authority/Property View.* R wasn't asking for a favor; he was asserting a claim over a slice of the data space. The promise was an acknowledgment of his priority claim. It's less about "I won't do X" and more about "You acknowledge X is mine."
      *   *Perspective 3: The Release View.* R said "do whatever you like." That sounds like a release. Why does the user feel it isn't? Maybe because it was casual? Maybe because R is no longer in the game (can't be harmed)? Maybe because the *principle* remains?
