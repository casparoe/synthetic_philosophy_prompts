answer: |-
  **Final Exam: Contemporary Distributive Justice**
  **Section II: Essay (75 Minutes)**

  **Instructions:** Read the stipulations and case below. Answer the question that follows. Your response must address all four sub-requirements (a–d) and include the specified arithmetic demonstration. Do not cite external authors or texts.

  **Stipulations:**
  1.  **Loss-proof:** A distributive view is loss-proof just in case it never ranks one outcome above another when the second is at least as good for every individual and strictly better for at least one.
  2.  **Gap-sensitive:** A view is gap-sensitive just in case it treats the size of the distance between better- and worse-off people as something with intrinsic, not merely instrumental, value.

  **Case:**
  There are two persons. Consider three outcomes represented as vectors of well-being $(P_1, P_2)$:
  *   Outcome A: $(100, 50)$
  *   Outcome B: $(50, 50)$
  *   Outcome C: $(80, 60)$

  **Question:**
  Analyze the structural tension between egalitarianism and the leveling-down objection using the definitions above. Your essay must:
  (a) Argue that a view is loss-proof exactly when its ranking of outcomes is monotone in individual well-being, establishing the objection as a constraint on intrinsic gap-value.
  (b) Sort standard positions (utilitarianism, priority view, telic egalitarianism) by this criterion, explaining what the priority view's immunity costs it regarding relative disadvantage.
  (c) Demonstrate arithmetically what a gap-sensitive view must concede about the weight of its egalitarian component to remain loss-proof, using a value function of the form $\text{Total Well-being} - (w \times \text{Gap})$. Show how the verdict on leveling down flips as $w$ rises.
  (d) Take a side on the following dilemma: If egalitarians make equality's value conditional on making someone better off, they retain loss-proofness but obscure their distinction from prioritarianism; if they do not, they violate loss-proofness. Commit to one horn and defend it.

  ***

  **Model Answer**

  A distributive view is loss-proof if and only if it satisfies the Pareto principle. This is equivalent to requiring that the view's ranking be monotone in individual well-being. If an outcome improves someone's life without harming others, a monotone function must assign it higher value. Consequently, the leveling-down objection is not merely a rhetorical challenge but a structural constraint: any view that assigns intrinsic value to equality risks violating monotonicity if that value outweighs individual losses.

  Standard positions sort clearly by this criterion. Utilitarianism sums well-being; since individual well-being is monotone, the sum is monotone. It is loss-proof but not gap-sensitive. The priority view transforms individual well-being via a concave function before summing. It remains loss-proof because the transformation preserves monotonicity. However, this immunity comes at a cost. Because the priority view aggregates individual-level terms, it cannot explain why it matters that some are worse off than others, as opposed to merely being at a lower absolute level. It sees low welfare as bad, but it is blind to the relational gap itself. Telic egalitarianism is gap-sensitive but risks violating loss-proofness if it ranks equality above Pareto improvements.

  To demonstrate the constraint, consider the value function $V = \text{Total} - (w \times \text{Gap})$.
  In Outcome A $(100, 50)$, Total $= 150$, Gap $= 50$. Thus, $V_A = 150 - 50w$.
  In Outcome B $(50, 50)$, Total $= 100$, Gap $= 0$. Thus, $V_B = 100$.
  In Outcome C $(80, 60)$, Total $= 140$, Gap $= 20$. Thus, $V_C = 140 - 20w$.

  Outcome A Pareto dominates Outcome B (Person 1 is better, Person 2 is equal). A loss-proof view must rank $A \ge B$.
  $150 - 50w \ge 100 \Rightarrow 50 \ge 50w \Rightarrow w \le 1$.
  Outcome C Pareto dominates Outcome B. A loss-proof view must rank $C \ge B$.
  $140 - 20w \ge 100 \Rightarrow 40 \ge 20w \Rightarrow w \le 2$.
  The stricter constraint is $w \le 1$. If the weight on equality exceeds 1 (e.g., $w=2$), then $V_A = 50$ and $V_B = 100$. The view ranks B above A. This verdict flips as $w$ rises, violating loss-proofness by endorsing leveling down.

  To remain loss-proof, a gap-sensitive view must concede that the weight of its egalitarian component cannot exceed the marginal utility of well-being lost. If $w \le 1$, the egalitarian component never overturns a Pareto ranking. In cases like A vs B, the component does no decisive work; total well-being dictates the verdict. The component only dictates outcomes when totals are equal but gaps differ. This renders equality lexically secondary to efficiency.

  This generates the central dilemma. If egalitarians make equality conditional on Pareto improvements, they preserve loss-proofness but become indistinguishable from prioritarians in conflict cases. If they maintain intrinsic value, they violate loss-proofness. I commit to the former horn: loss-proofness is non-negotiable. Valuing equality intrinsically implies it is good to make someone worse off even if no one benefits. This contradicts the basic rationality of beneficence. We should care about the worse-off because low well-being is bad, not because inequality is a cosmic flaw. The priority view captures the moral urgency of helping the disadvantaged without endorsing wasteful leveling. The cost of losing the relational view is acceptable; the cost of violating Pareto is not. Equality should only break ties, not override welfare.

  ***

  **Marking Scheme (Total: 25 Marks)**

  | Component | Marks | Specific Moves Required | Common Error Note |
  | :--- | :---: | :--- | :--- |
  | **(a) Monotonicity** | 5 | Explicitly links loss-proofness to monotonicity in individual well-being; identifies LDO as a structural constraint. | Candidates often define loss-proof correctly but fail to link it to monotonicity functions. |
  | **(b) Sorting & Priority** | 5 | Correctly classifies Util/Prior as loss-proof; explains Priority View's inability to capture relational gaps due to individual summation. | Candidates often claim Prioritarianism is gap-sensitive or miss the "individual terms" limitation. |
  | **(c) Calculation** | 5 | Correctly calculates $V_A, V_B, V_C$; derives $w \le 1$; shows verdict flips if $w > 1$. | Arithmetic errors in gap/total sums or failing to show the flip condition explicitly. |
  | **(d) Concession** | 5 | Explains that $w \le 1$ limits equality to tie-breaking; notes component does no work in Pareto conflicts. | Candidates often argue the component still does "work" without showing how it respects the limit. |
  | **(e) Commitment** | 5 | Takes a definitive side on the dilemma; defends it using beneficence/rationality arguments rather than hedging. | Candidates often list both sides without committing, or commit without philosophical defense. |

  **A vs B Distinction:**
  An **A answer** (20-25 marks) identifies the monotonicity claim in (a) and commits definitively to one horn of the dilemma in (d) with a robust defense. A **B answer** (15-19 marks) handles the arithmetic and sorting correctly but hedges on the dilemma or fails to articulate the monotonicity constraint clearly.
