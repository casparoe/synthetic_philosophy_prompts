answer: |-
  **Exam Question**

  Based solely on the Strain KT-7 case, compare the Historical Account of function (which ties function to a trait's history of selection) with the Systemic Account (which ties function to a trait's current contribution to a containing system's capacity). Your essay must: (1) determine whether the shell possesses a function before transfer, immediately after transfer, and after twenty generations of serial passage according to each account; (2) assess whether the partial shell in KT-7m constitutes a malfunction and specify the standard used; and (3) argue for one account over the other, explicitly addressing the objection that the two accounts merely answer different questions and therefore do not conflict. Do not cite specific authors or texts.

  ***

  **Model Answer**

  The debate over biological function centers on whether a trait's function is defined by its evolutionary history or its current causal role. The Historical Account holds that a trait has a function only if it was retained due to natural selection for that specific effect. The Systemic Account holds that a trait has a function if it currently contributes to a capacity of the containing system, regardless of history. The Strain KT-7 case reveals significant divergences between these commitments.

  Regarding the timeline, both accounts agree that before the transfer to the high-UV tank, the shell had no function. The Historical Account denies function because the trait spread by drift, lacking a history of selection. The Systemic Account denies function because the shell made no measurable difference to survival, contributing nothing to the system's capacity. However, the accounts diverge immediately after the transfer. The Systemic Account attributes function immediately because the shell now contributes to survival capacity in the new environment. The Historical Account denies function at this specific moment because no history of selection has yet accumulated; the survival benefit is currently accidental relative to the trait's ancestry. After twenty generations of serial passage, where defective shells are weeded out, the Historical Account grants function because a selection history is now established. The Systemic Account continues to affirm function based on ongoing contribution.

  The case of KT-7m clarifies the normative dimension of function. Both accounts classify the partial shell as a malfunction, but on different standards. For the Systemic Account, it is a malfunction because it fails to contribute to the system's capacity for survival in high salinity. For the Historical Account, it is a malfunction because it fails to perform the effect that caused the trait's recent retention (protection). The Historical standard is stronger here: it explains why the shell *ought* to protect the cell based on the lineage's history, not merely because it happens to be useful now.

  I argue the Historical Account is superior because it captures the normative force of biological function—the distinction between what a trait does and what it is *for*. In the KT-7 case, the shell was present for forty million years without function. The Systemic Account risks labeling any beneficial capacity as a function, even if it arises accidentally. The Historical Account correctly identifies that function emerges only when selection anchors the trait to the effect. This is crucial for KT-7m: the malfunction is not just a current failure, but a deviation from the historical standard that defines the trait's presence in the population.

  A common objection is that these accounts do not conflict because they answer different questions: the Historical Account explains why a trait is there, while the Systemic Account explains what it does. If this were true, we could be pluralists, using both concepts without contradiction. However, the KT-7 case shows they compete over the extension of the single concept 'function'. If we accept the Systemic view, the shell had no function for forty million years, then suddenly acquired one upon transfer. If we accept the Historical view, it acquired function only after selection acted. These are contradictory claims about the same property. Furthermore, biology requires a concept of function that distinguishes adaptive traits from incidental byproducts. The Systemic Account cannot distinguish a selected adaptation from a coincidental benefit that has not yet been selected. Therefore, the accounts are rival explanations of the same phenomenon, and the Historical Account provides the necessary explanatory power to distinguish genuine functions from mere capacities.

  ***

  **Marking Scheme**

  **1. Characterization of Accounts (5 marks)**
  *   **Requirement:** Clearly defines the Historical Account (function requires history of selection) and Systemic Account (function requires current contribution to capacity) without using author names.
  *   **Typical Error:** Confusing the two accounts or defining them by author names (e.g., "Millikan vs. Cummins") rather than conceptual commitments.

  **2. Application to Timeline (5 marks)**
  *   **Requirement:** Correctly identifies that both accounts deny function pre-transfer; diverge post-transfer (Systemic = yes, Historical = no); and converge post-passage (both = yes).
  *   **Typical Error:** Claiming the Historical Account grants function immediately upon transfer, ignoring the requirement for established selection history.

  **3. Analysis of KT-7m Malfunction (5 marks)**
  *   **Requirement:** Identifies the partial shell as a malfunction on both accounts but distinguishes the standards (failure to contribute vs. failure to meet selected effect).
  *   **Typical Error:** Asserting it is a malfunction on only one account or failing to specify the normative standard used.

  **4. Verdict and Justification (5 marks)**
  *   **Requirement:** Takes a definite stance on which account is superior, justified by the case details (e.g., handling drift, normative force, or distinction between capacity and function).
  *   **Typical Error:** Sitting on the fence without argument or justifying the verdict with irrelevant criteria outside the case.

  **5. Response to "Different Questions" Objection (5 marks)**
  *   **Requirement:** Explicitly addresses the pluralist objection and argues why the accounts are competing claims about the same concept rather than compatible inquiries.
  *   **Typical Error:** Accepting the objection as valid and concluding there is no conflict, thereby undermining the verdict in point 4.

  **Distinction between A and B Answers**
  *   **A Answer:** Integrates the response to the objection into the main argument for the verdict, showing how the conflict over the concept of 'function' necessitates choosing one account. The analysis of the timeline is precise regarding the "twenty generations" threshold.
  *   **B Answer:** Treats the objection as a separate checklist item rather than engaging with it philosophically. The timeline analysis may be vague about when the Historical Account grants function (immediate vs. after generations).
