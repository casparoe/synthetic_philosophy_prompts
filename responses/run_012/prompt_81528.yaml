answer: |-
  Here are the desiderata for a theory of standing to blame, tailored to your dramatic needs.

  **The Cases the Theory Must Get Right**
  *   **The Plain Hypocrite (Dana):** She does the same/worse, unaware. The theory must explain why her blame is inappropriate *even though her accusation is true*. If the theory says she lacks standing because she's "wrong," it fails. The wrongness is in the *transaction*, not the facts.
  *   **The Reformed Sinner:** She did it, stopped, owns it, now blames. She *has* standing. The theory must distinguish her from Dana. (Key: Acknowledgment of the norm).
  *   **The Lesser Offender:** She is late on invoices sometimes; he is chronically negligent. She *has* standing. Degree matters. Perfection is not a prerequisite for authority.
  *   **The Busybody:** A stranger in the car park knows the facts and is morally impeccable regarding elder care. They *lack* standing. Relationship creates the authority to hold accountable.
  *   **The Malicious Saint:** Impeccable record, but blames solely to inflict pain. She *lacks* standing. Motive can defeat authority.
  *   **The Counterfactual Offender:** "If I were in your position, I'd have done the same." If she admits this, she loses standing. It's not about actual sin, but about refusing to acknowledge the norm's binding force on oneself.

  **The Distinctions the Theory Cannot Collapse**
  *   **Standing vs. Correctness:** You can be right about the money but wrong to speak. (This is the core of your scene).
  *   **Blame as Speech vs. Blame as Attitude:** You can *feel* resentment (private) without having the right to *demand* accountability (public).
  *   **Forfeiture vs. Absence:** Dana forfeited standing through hypocrisy; the stranger never had it due to lack of relationship. The emotional texture differs (shame vs. dismissal).
  *   **Permission to Feel vs. Right to Speak:** You are permitted to feel disappointment; you are not entitled to enforce it.
  *   **Sibling vs. Stranger:** Special obligations grant special standing. A brother has more right to blame than a nurse, but also higher stakes for hypocrisy.

  **The Ordinary Facts of Blaming**
  *   "Look who's talking" is not always a fallacy; sometimes it is a valid veto.
  *   Apology restores standing.
  *   Standing can be waived (e.g., "I know I'm not perfect, but...").

  **Evaluation: What's Real and What's Noise**
  *   **The "Malicious Saint" Problem:** This is the tension point. Some theories say motive doesn't matter (only the norm matters); others say blame must be offered in goodwill. For your novel, **motive must matter.** If the brother thinks Dana enjoys this, her standing evaporates faster.
  *   **The "Lesser Offender" Case:** This is where your writing group is talking past each other. Social standing says "you're one of us, you can speak." Moral standing says "you're guilty too." The adequate theory prioritizes **acknowledgment of the norm** over perfection. Dana fails because she treats the norm as a weapon, not a rule she lives by.
  *   **The Incompatibility:** You cannot satisfy "Only truth matters" and "Hypocrites lack standing." You must choose the latter for drama. Truth is static; standing is relational.

  **The Knockout Requirement**
  If I had to put money on the single requirement that eliminates the most candidate theories, it is this: **The theory must explain why the Plain Hypocrite's blame is objectionable *even if the blamee is guilty*.**
  Many theories collapse standing into correctness. They argue that if the accusation is true, the blame is valid. That kills your scene. An adequate theory must show that blame is a *claim to authority*, not just a statement of fact. Dana is trying to enforce a rule she is currently treating as optional. That makes her blame an act of domination, not justice.

  **Your Hunch and The Scene**
  Your hunch about **Speech vs. Attitude** is not a fiction; it is load-bearing. Philosophically, this is the distinction between *reactive attitudes* (private resentment, which anyone can feel) and *communicative blame* (a demand for answerability, which requires authority).

  **What to do in the car park:**
  Do not have the brother argue about the invoices. If he argues facts, he validates her standing to debate them.
  He must attack the *transaction*.
  *   **Wrong:** "I'm not late, you're worse." (This admits she has standing to judge).
  *   **Right:** "You don't get to talk to me like this." (This challenges her authority).

  Dana needs to realize, in the silence after he speaks, that she isn't being told she's *wrong* about the money. She's being told she's *disqualified* from the conversation. The pain comes from the realization that her moral outrage is actually just noise. She can keep her disappointment (attitude), but she must swallow her demand (speech). That is the silence you need to write.
