      *   **Problem:** Needs to understand the philosophical concept of "standing to blame" to make a brother's objection ("You have no right to say this to me") land authentically, not just as a deflection.
      *   **Task:** Write the "desiderata" for an adequate theory of standing to blame.
      *   **Requirements:**
          *   Concrete cases the theory must handle (hypocrite, reformed, lesser offender, busybody, malicious impeccable, counterfactual offender, etc.).
          *   Distinctions the theory must preserve (standing vs. correctness, speech vs. attitude, standing vs. permission to feel, forfeiture vs. lack, sibling vs. stranger).
          *   Ordinary facts about blaming practices.
