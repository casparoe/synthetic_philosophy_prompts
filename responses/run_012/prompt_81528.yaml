      *Key Insight:* The brother's line "You have no right" is about the *authority to demand*, not the *truth of the claim*. Dana is trying to enforce a norm she is currently violating. That makes her enforcement an act of domination, not justice.

      *The "Knockout" Requirement:* The theory must explain why the *hypocrite's* blame is objectionable *even if the blamee is guilty*. If the theory says "Hypocrites can't blame because they are wrong," it fails. The blame must be *correct* but *illegitimate*.

      *The Speech/Attitude Distinction:* This is the lifeline for the scene. Dana can *feel* disappointed (private attitude), but she cannot *demand* accountability (public speech). The brother calls out the demand.

