          *   **Crucial:** Take a position. Don't just survey. Address the user's specific hunch (speech vs. attitude distinction).
          *   **Format:** Bullets okay, around a page, decisive tone.

  2.  **Deconstruct the Philosophical Problem (Standing to Blame):**
      *   *What is it?* The normative authority to hold someone accountable.
      *   *The Hypocrisy Problem:* Why can't a hypocrite blame? It's not that the blame is false (the act *was* wrong). It's that the *blamer* is compromised.
      *   *The User's Hunch:* Distinction between "right to say it" vs. "right to think less of him." This maps onto the philosophical distinction between *expressed blame* (communicative) and *private blame* (reactive attitudes).
      *   *The Brother's Objection:* Needs to be more than "You're mean." It needs to be "You are disqualified from this specific normative transaction."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Cases:*
          1.  *The Plain Hypocrite (Dana):* Does same/worse, doesn't see it. Theory must explain why her blame is inappropriate despite being true.
          2.  *The Reformed Sinner:* Did it, stopped, now blames. Theory must explain why she *has* standing (unlike Dana).
          3.  *The Lesser Offender:* Does it a bit, brother does it a lot. Theory must explain if/when degree matters.
          4.  *The Busybody (Stranger):* Impeccable but unrelated. Theory must explain why relationship matters (special obligations).
          5.  *The Malicious Saint:* Impeccable, but motive is cruelty. Theory must explain if motive defeats standing.
          6.  *The Counterfactual Offender:* Would have done it in same circumstances. Theory must explain if potential hypocrisy counts.

      *   *Distinctions:*
          1.  *Standing vs. Correctness:* Can you have standing but be wrong? Yes. Can you be right but lack standing? Yes (Dana).
          2.  *Speech vs. Attitude:* Can I feel blame but not speak it? (User's hunch).
          3.  *Forfeiture vs. Absence:* Did I lose it or never have it? (Relationship based).
          4.  *Sibling vs. Stranger:* Special duties affect standing.

      *   *Ordinary Facts:*
          1.  "Look who's talking!" is a recognizable move, not always a fallacy.
          2.  Apology restores standing.
          3.  Standing can be waived.

  4.  **Evaluating and Taking a Position:**
      *   *The User's Hunch:* Is the speech/attitude distinction real? Yes, philosophically (Wallace vs. Bell). Private resentment is natural; communicative blame is a normative claim.
      *   *Incompatibility:* You can't satisfy "Motive doesn't matter" and "Malicious Saint lacks standing" simultaneously. Need to choose.
      *   *The "Knockout" Requirement:* The Hypocrite Case. If a theory can't explain why the plain hypocrite lacks standing without denying the truth of the accusation, it fails.
      *   *Advice for the Scene:* The brother isn't saying "You're wrong." He's saying "This conversation is illegitimate."

  5.  **Refining the Output (adhering to constraints):**
      *   *Tone:* Direct, authoritative, slightly literary (matching the user).
      *   *Length:* Around a page (dense).
      *   *Position:* Defend the "Communicative vs. Private" distinction. It serves the novel best.

  6.  **Drafting the Content (Mental or Scratchpad):**
