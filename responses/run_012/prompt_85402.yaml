  Ok so I'm in my school's philosophy club and I'm writing this essay for my TOK class, and I've gotten myself into an argument with my friend Priya that I can't get out of, so I'm hoping you can settle it. What I've got so far is that there's this idea called pragmatic encroachment (I think that's the name) where whether you count as knowing something depends on how much is riding on it being true — like it matters way more if you're wrong about whether your train leaves at 7 than whether some random shop is open — and then a seperate idea, contextualism, where the word knows just means something different depending on the conversation you're in, so what counts as knowing while you're chatting with your mates isn't the same as what counts in a courtroom. I think I've got both of those roughly right.

  But here's where I'm stuck and I think Priya is winning. If both of those are true, doesn't it follow that whether I know something is just about how much I care, or how I feel about the stakes, and that there's no actual fact of the matter about whether someone knows? So when Priya says I don't know where my keys are and I say I do, we can both be right and neither of us is wrong. And it definately gets weirder: if the stakes alone can flip you from knowing to not knowing when the evidence is exactly the same, then does that mean a surgeon in the middle of a real operation literally doesn't know where the artery is, while a first-year med student looking at the same diagram does? And does high stakes somehow make the fact itself different, or less certain — or is it just that the high stakes mean I need more evidence before I count as knowing the same thing? Because if it's the first one that seems insane to me, and also, why doesn't everyone just lower the stakes so they can know more stuff? I feel like I'm missing something big and I can't see where the mistake is, so please tell me where I've gone wrong, if I have. I don't need a whole essay, just the key corrections.

  Can you give it to me as exactly five numbered points, each one a sentence or two, with no intro and no conclusion — just the five points.
