answer: |-
  Yes, this puzzle has a name, though the name is often misunderstood in ways that obscure the precise philosophical weight you are assigning it. The claim you are describing is the **Principle of Charity**, specifically as formulated by **Donald Davidson** within the framework of **Radical Interpretation**.

  However, because "charity" in common parlance suggests a moral virtue (being nice, overlooking faults), the term often fails to convey the constitutive, metaphysical necessity you have identified. In the literature, this is sometimes distinguished as **Constitutive Charity** versus **Methodological Charity**.

  Here is how your puzzle maps onto the existing landscape, where it diverges from nearby ideas, and how its edges are marked.

  ### 1. The Name and the Source
  The specific claim that "substantial agreement is a precondition of interpretation" is the central thesis of Donald Davidson's essay *"On the Very Idea of a Conceptual Scheme"* (1974) and his work on **Radical Interpretation**.

  Davidson argues that you cannot separate the question "What does the speaker mean?" from "What does the speaker believe?" When you interpret a speaker, you are solving a single equation with two unknowns (meaning and belief). The only way to solve it is to fix one variable to solve for the other. Davidson argues we must fix belief as largely *true* (by our own lights) to solve for meaning.

  Therefore, the "puzzle" you describe—the ability to render a speaker either right (by shifting meaning) or wrong (by fixing meaning)—is not evidence of interpretive freedom. For Davidson, it is evidence that **massive error is unintelligible**. If an interpretation renders a speaker systematically mistaken about the world, it is not a competing valid interpretation; it is a *failed* interpretation.

  ### 2. Nearby Ideas That Are Not Quite It
  To isolate your claim, it helps to distinguish it from three neighboring concepts that often get conflated with it.

  **A. Quine's Indeterminacy of Translation**
  *   **The Idea:** W.V.O. Quine argued that evidence underdetermines translation (the "Gavagai" example). There is no "fact of the matter" about whether a word means *rabbit* or *undetached rabbit part*.
  *   **The Difference:** Quine is a skeptic; he suggests meaning is ultimately indeterminate. Davidson accepts the underdetermination of evidence but rejects the skepticism. He argues that the *constraint of rationality* (Charity) fixes the meaning. Your claim aligns with Davidson here: you are looking for the necessity that *fixes* the meaning, not the indeterminacy that loosens it.

  **B. Methodological Charity (The "Polite" Version)**
  *   **The Idea:** "Assume the other person is smart and honest so the conversation goes smoothly."
  *   **The Difference:** This is a heuristic, a rule of thumb for successful social interaction. Your claim is stronger. You are describing an ontological condition: without assuming agreement, there is *no object* to interpret. You cannot even identify a belief as a belief without locating it in a network of mostly true beliefs.

  **C. Gadamer's Hermeneutics (Fusion of Horizons)**
  *   **The Idea:** Hans-Georg Gadamer argued that understanding requires a "fusion of horizons" between interpreter and text, acknowledging the interpreter's own prejudices.
  *   **The Difference:** This is the Continental analogue to your puzzle. However, Gadamer focuses on historical tradition and the inevitability of bias. Davidson focuses on the logic of propositional attitudes and truth conditions. Your phrasing ("precondition of interpretation," "constraint on what counts") leans toward the analytic rigor of Davidson rather than the historical consciousness of Gadamer.

  ### 3. Marking the Edges
  You asked whether the necessity asserted is a methodological rule, a constraint on interpretation, or a claim about meaning. In the Davidsonian framework (which fits your description best), the answer is **all three, collapsing into one.**

  *   **It is not merely Methodological:** If it were just a rule of thumb, we could choose to violate it and still be interpreting, just poorly. Davidson argues that if you violate it (i.e., if you assume the speaker is mostly wrong), you have ceased to interpret them and are merely describing noises they make.
  *   **It is a Constraint on Interpretation:** It defines the boundary between *interpreting an agent* and *cataloging behavior*. To treat someone as a speaker is to treat them as rational. To treat them as rational is to treat them as largely sharing your view of the world.
  *   **It is a Claim About Meaning:** This is the strongest edge. It implies **Semantic Externalism**. Meaning is not inside the head; it is determined by the causal interaction between the speaker, the interpreter, and the shared world. If you cannot triangulate a shared world (agreement), you cannot fix meaning.

  ### 4. If It Had No Name (Naming the Puzzle)
  If you feel the term "Principle of Charity" is too burdened by its colloquial softness to capture the rigorous structural constraint you have found, you might refer to it as **The Holism of Rational Accommodation**.

  However, the specific tension you identified—*that evidence fits both a reading of error and a reading of meaning-shift*—is often called **The Meaning-Belief Dilemma**.

  Your insight that "two equally careful interpreters could reach different... readings" is where you might press beyond Davidson. Davidson believes there is an *optimal* theory of interpretation that maximizes agreement. If you suspect there can be *equally valid but incompatible* schemes of interpretation that both satisfy the constraint of rationality, you are moving toward a moderated **Conceptual Pluralism**. Davidson would deny this is possible (arguing there is only one "large" way to be right). If you believe there are multiple, equally coherent ways to map agreement, you are identifying a genuine indeterminacy that Davidson tried to close.

  ### Summary
  The claim has a name: **The Principle of Charity (Constitutive)**.
  The context is: **Radical Interpretation**.
  The specific argument is: **The Rejection of Conceptual Schemes**.

  It stands apart from Quine by insisting on determinacy through rationality; it stands apart from colloquial charity by being ontological rather than moral; and it marks the edge of interpretation by asserting that **intelligibility requires veridicality**. To understand a speaker is to make them right.
