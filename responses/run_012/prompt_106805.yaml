  3.  **Identify the Core Principle:**
      *   The classic "Tragedy of the Commons" (Hardin) requires *rivalry* (my use diminishes yours) and *non-excludability* (hard to stop me).
      *   The user's cases suggest a deeper sociological principle: **Governance Capacity vs. Resource Stress.**
      *   It's not just about the resource properties (limited/excludable), but about the *social technology* available to manage it.
