      *   **Key Philosophical Issues:**
          *   SCA (Simple Conditional Analysis): $x$ is fragile iff if $x$ were struck, $x$ would break.
          *   Finks (Martin/Heil): Disposition disappears before manifestation (Sorcerer).
          *   Masks (Johnston): Disposition remains but manifestation is blocked (Foam).
          *   Lewis's Revised Analysis (RCA): Adds ceteris paribus clauses (intrinsic base, held fixed, no interference).
          *   Circularity Objection: Defining dispositions via conditions that reference the disposition (or "interference") makes the analysis non-reductive.
          *   Metaphysical Status: Are dispositions real properties or just summaries of base + laws?

  3.  **Evaluate the Moves:**

