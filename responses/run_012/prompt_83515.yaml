  2.  **Analyze the Dispute:**
      *   **Topic:** The Simple Conditional Analysis (SCA) of dispositions (fragility) and counterexamples (Finks and Masks).
      *   **Nadia's Position:** Defends a revised conditional analysis (likely Lewis-style or similar). Acknowledges SCA is dead due to Finks (Sorcerer case). Proposes fix: intrinsic property + "kept that property". Argues Masks (foam) are handled by distinguishing interference from intrinsic change. Argues circularity isn't fatal (modal profile goal). Argues Sam's eliminationism kills bases too.
