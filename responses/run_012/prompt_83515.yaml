prompt: |-
  My two officemates went at each other again yesterday over dispositions and I just nodded at both of them, so I'd like you to actually sort it out. (Context: I'm a third-year, this is more or less my AOS, and I still can't referee these two.)

  Nadia: the simple conditional analysis -- fragile iff it would break if struck -- is dead, and the sorcerer case is why. A glass is genuinely fragile, but a sorcerer has arranged that the instant anything strikes it he'd rearrange its molecules into something shatterproof. So it's fragile, and yet it's not true that it would break if struck. The standard fix is to add a proviso: it has some intrinsic property in virtue of which it would break if struck *and kept that property*. The sorcerer wins by changing the property, so the analysis survives.

  Sam: run the same move with masking. Wrap the glass in foam. It keeps every intrinsic property it had, it's still fragile, and if you strike it nothing breaks -- the foam gets in the way. So the conditional now has to read "would break if struck when nothing prevents it," which is circular, because "nothing prevents it" just means "nothing stops the disposition from manifesting," which is the thing you were trying to analyse. And the foam isn't in the glass, so you can't file it under the intrinsic base.

  Nadia: (a) the circularity isn't fatal -- she isn't trying to reduce dispositions to non-dispositional facts, only to state the modal profile, and "would manifest absent interference" still does real work; it's what you check when you test for the disposition. (b) finks and masks pull in opposite directions, and that actually helps her: a fink changes the glass, a mask doesn't, so the foam case isn't a counterexample to the glass's conditional, it's a counterexample to a sloppily stated one.

  Sam: then say what the disposition adds over base plus surroundings. Base present, mask present, nothing breaks; base present, mask gone, something breaks. The disposition contributes nothing that the base and the surroundings don't already fix, so the "modal profile" is just a summary of how the base behaves, dressed up as a property.

  Nadia: that argument kills the base too -- any base you name only produces its effect given the surroundings, and you're not going to call molecular structure epiphenomenal. And Sam's line can't distinguish the foam case from the sorcerer case, which was supposed to be the easy one.

  I definately can't tell who has the better of it, and I suspect each of them is right about something. Adjudicate move by move: which claims are right, which are wrong, and what the real crux is. Don't hedge -- pick a winner overall and give your reasons for picking them. Lead with that verdict in your first sentence, then the reasoning, no preamble and no restating the setup.
