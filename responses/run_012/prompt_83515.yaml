      *Refining the "Circularity" point:* Sam says "nothing prevents it" is circular. Nadia says circularity isn't fatal. In the literature (e.g., Handfield, Bird), the circularity objection is taken seriously against *reductive* analyses. But since most have abandoned reductive analysis of dispositions in terms of non-dispositional conditionals, Nadia is right that the project survives. Sam is attacking a straw man of what contemporary dispositionalists aim for.

