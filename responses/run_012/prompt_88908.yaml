      *Drafting the content:*

      **Mechanics Summary**
      Students receive two separate choice sheets ten minutes apart, disguised as distinct games. In Game 1, they choose between a certain prize and a gamble with a small risk of nothing. In Game 2, they choose between two low-probability gambles. They submit sheets anonymously. You tally results live, reveal the logical structure, and guide them to see that preferring the sure thing in Game 1 but the riskier option in Game 2 violates the independence axiom because a common probabilistic branch cancels out across both pairs.

      **Rules and Materials**
      *   **Currency:** "Raffle Tickets" for a single high-quality chocolate bar drawn at session end.
      *   **Sheets:** Two distinct colors (Blue for Game 1, Red for Game 2). No names.
      *   **Rule:** Choices are binding for the raffle weighting if their sheet is selected for payout (one sheet drawn at random to determine which game counts, then their choice on that sheet determines ticket count). This ensures seriousness without real money.
      *   **Room:** Chairs in clusters to encourage whispering during the distraction phase, then theater-style for debrief.

      **Payoff Structures**
      *   **Game 1 (Blue):**
          *   Option A: 100% chance of 10 tickets.
          *   Option B: 89% chance of 10 tickets, 10% chance of 50 tickets, 1% chance of 0 tickets.
      *   **Game 2 (Red):**
          *   Option C: 11% chance of 10 tickets, 89% chance of 0 tickets.
          *   Option D: 10% chance of 50 tickets, 90% chance of 0 tickets.
      *   *Note:* The 1% difference in Option D (90% vs 89% zero) is necessary to sum to 100%, but effectively both C and D share an 89% chance of 0 tickets.

      **Timeline**
      *   **0–5 min:** Distribute Blue sheets. Explain raffle mechanism. Emphasize intuition over calculation.
      *   **5–15 min:** Students choose. Collect Blue sheets.
      *   **15–25 min:** Distraction task (brief discussion on unrelated risk topic). Distribute Red sheets. Explicitly state this is a separate experiment.
      *   **25–35 min:** Students choose. Collect Red sheets.
      *   **35–45 min:** Tally results on projector. Highlight the modal pattern (A over B, D over C).
      *   **45–75 min:** Debrief.

      **Debrief**
      Start by asking students who chose A and D to raise hands. Map this onto the projector.
      1.  **The Cancellation:** Rewrite Option A as (89% chance 10 + 11% chance 10). Rewrite Option B as (89% chance 10 + 10% chance 50 + 1% chance 0). Show that 89% of the ticket distribution is identical in A and B. If you prefer A to B, you are preferring 11% chance of 10 over the 10/1 split of 50/0, *conditional* on the 89% branch not obtaining.
      2.  **The Match:** Rewrite Option C as (89% chance 0 + 11% chance 10). Rewrite Option D as (89% chance 0 + 10% chance 50 + 1% chance 0). The 89% branch is now identical (0 tickets). If you prefer D to C, you are preferring the 10/1 split of 50/0 over the 11% chance of 10, *conditional* on the 89% branch not obtaining.
      3.  **The Contradiction:** You cannot prefer X over Y in the first context and Y over X in the second, when the context difference is merely a constant added to both sides.
      4.  **Utility Defenses:** Address utility curvature. Does 10 tickets feel disproportionately better than 0? Perhaps. But that curvature applies to the 89% branch in both games. Since the 89% branch is identical in value across the pair, utility curvature cancels out. No threshold or weighting rescues the pattern.
      5.  **Common-Consequence vs. Common-Ratio:** This activity produces the common-consequence violation (Allais). Common-ratio (Kahneman-Tversky) involves scaling probabilities down equally (e.g., 100% vs 50% compared to 50% vs 25%). Distinguish them: consequence adds a fixed outcome; ratio multiplies probabilities.
      6.  **Exploitation:** Explain the money pump. If you pay to switch from B to A, then pay to switch from C to D, a bookie can reverse the process and drain your resources. Does this prove incoherence? It proves dynamic inconsistency if choices are sequential. In static choice, it proves your preferences cannot be represented by expected utility. It licenses saying the pattern carries a price (vulnerability), not necessarily that the agent is irrational in all senses, but that they violate the specific coherence required for expected utility maximization.

      **Predictable Failures**
      *   **The Consistent:** Some will choose A and C (risk averse throughout) or B and D (risk seeking). Acknowledge them. They are the control group proving the task allows consistency. Ask them to articulate their rule; validate them.
      *   **The Savvy:** Some will recognize the structure in Game 2. Instruct them at the start: "Record your immediate preference. Do not solve for consistency." If they reveal the trick early, pause and ask the room to treat it as a hypothesis to test later, not a reason to alter current choices.

      **Limitations**
      This activity cannot reproduce the chooser who grasps the whole structure, endorses her pattern anyway, and has something to say for herself. She might argue that the "certainty effect" is a legitimate heuristic or that independence is too demanding for one-off choices. The format forces them into the paradox; it does not allow for a defended rejection of the axiom. You must supply in speech that rejecting independence is a valid theoretical move, provided one accepts the costs (no expected utility representation, vulnerability to framing). The activity proves the violation exists; it cannot prove the axiom is normatively binding. That argument requires philosophical scaffolding you must build after the reveal.

