  Also, need to make sure I address the "Entitlement" aspect. In ML, ignoring data is a cost function choice. In philosophy, it's an epistemic right.

  Let's organize the "Residue Report" strictly by (a), (b), (c) as requested.

  *Plan:*
  1.  **Translation:** "The Overconfidence Lemma."
  2.  **Residue (a):** Clean maps (Learning rate, outlier rejection).
  3.  **Residue (b):** Fudges (Misleading = High Loss? Entitlement = Hyperparam?).
