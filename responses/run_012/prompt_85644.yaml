answer: |-
  **Recommendation:** The Committee recommends refusing treatment for this case.

  **Reasoning:**
  While the surrogacy contract is enforceable within our state, three ethical barriers preclude clinic participation. First, facilitating this arrangement exposes the intended parents to criminal prosecution upon return to their home country. By providing medical services essential to completing a transaction deemed criminal in their jurisdiction, the clinic becomes complicit in creating significant legal jeopardy for the family unit we aim to help. Medical care should not facilitate foreseeable legal harm to patients.

  Second, the compensation structure constitutes undue inducement, compromising valid consent. Offering a surrogate three times her annual income, contingent on behavioral compliance and medical scheduling, creates a coercive environment. Specifically, the bonus for a Caesarean section on a date chosen by the parents violates medical ethics; surgical delivery should be dictated by clinical necessity, not contractual convenience. This incentivizes the surrogate to accept unnecessary medical risk for financial gain, undermining the integrity of the physician-patient relationship.

  Third, the disparity between the surrogate's compensation and the egg donor's flat fee (one-tenth the value) highlights problematic commodification. While distinct roles warrant different pay, such a vast gap suggests the surrogate's body is being rented at a premium that overwhelms autonomous decision-making, particularly given her stated motivation (mother's care) suggests financial vulnerability.

  **The Minority View:**
  The Committee acknowledges the strong arguments presented by the opposing camp. Their position rests on jurisdictional sovereignty and reproductive autonomy. Legally, the contract is valid here; we are not bound to enforce the criminal statutes of foreign nations. To refuse treatment based on another country's laws is arguably an extraterritorial application of ethics that infringes on the patients' rights. Furthermore, denying care based on payment size is paternalistic. The surrogate is an adult capable of assessing financial offers; high compensation does not automatically negate consent. By refusing, we prioritize abstract ethical consistency over the concrete reproductive goals of the intended parents and the financial agency of the surrogate. This view holds that our duty is to provide safe medical care within local laws, not to act as global moral arbiters.

  **Assessment of Draft Policy Clause:**
  The proposed clause—refusing cases where "the surrogate would be worse off backing out at the last minute than if she'd never signed at all"—is conceptually confused and should not be adopted in its current form.

  As written, this test captures almost all employment relationships. If I accept a job and quit a week later, I am worse off than if I never signed (I expended labor for no pay); yet, this is not exploitation. The clause conflates the loss of prospective gain (not receiving the bonus) with actual punitive detriment (incurring debt or penalties). It fails to distinguish between legitimate contractual reliance and coercive traps. A surrogate who backs out loses the fee, leaving her in the same financial position as if she never signed, not a worse one. If the intent is to prevent penalties for withdrawal, the clause must be rewritten to specify *punitive damages* or *sunk costs* that create a net negative, rather than the mere loss of expected compensation. As it stands, it is too broad to be useful and too vague to be enforceable.
