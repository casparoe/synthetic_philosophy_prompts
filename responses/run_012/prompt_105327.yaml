  Look, the moment you define 'consequence' so broadly that it swallows the meaning of the act itself, you've just rigged the game by linguistic fiat, and you know it. If I slap a price tag on the Mona Lisa, I haven't necessarily damaged the canvas or reduced the viewer's pleasure, but I have changed the relationship between the viewer and the art from one of contemplation to one of valuation, and that shift isn't a downstream effect, it's immediate and constitutive. Your voucher scheme is clever, I'll give you that, it sidesteps the greed objection, but it doesn't touch the core corruption because you're still treating the kidney as a chip in a transaction rather than a constituent of a person. The seller isn't just giving an organ; they are accepting a price, even if that price is directed elsewhere, and in doing so, they are affirming that their body part is the kind of thing that *has* a price. That category error doesn't vanish because the cash goes to Oxfam instead of a Ferrari; the corruption is in the framing of the offer, not the spending of the proceeds. You're asking me to believe that the normative structure of a market transaction is a neutral container for value, but markets aren't neutral, they teach us how to value, and teaching ourselves that bodies are vending machines is a lesson that sticks regardless of where the coins fall.
