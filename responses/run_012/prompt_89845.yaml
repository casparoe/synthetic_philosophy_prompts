      *   The strongest epistemological move here is to attack **(5)**. This is the classic "Self-Sealing" or "Immunization" objection.
      *   *Why (5) is the weak link:* Premise (5) commits the fallacy of assuming that because a theory *accommodates* a piece of data (missing evidence), that data becomes neutral. But in confirmation theory, a theory is supported by data only if the data is *more likely* given the theory than given the competitors.
