      *   *Crucial distinction:* We need to distinguish between the *primary fact* (e.g., smoking causes cancer) and the *cover-up act* (e.g., documents suppressing that fact).
      *   In the Tobacco case, we weren't just looking for missing cancer data. We found *presence* of suppression memos.
