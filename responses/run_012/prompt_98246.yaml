      *   *Premise 1:* Define tolerance correctly. It's not passive indifference or absolute non-interference. It's a social contract of mutual restraint. "I won't crush you for your differences if you won't crush me for mine."
      *   *Premise 2:* A practice requires participants to abide by its constitutive rules. Chess requires moving pieces diagonally/orthogonally; tolerance requires reciprocal restraint.
      *   *Premise 3:* The "intolerant" are those who refuse reciprocal restraint. They seek to use the freedom provided by tolerance to destroy the condition of freedom itself.
      *   *Conclusion:* Excluding the intolerant isn't violating the rule of tolerance. It's recognizing that they have voided their membership in the practice. You can't breach a contract you never signed or actively tore up. Therefore, no paradox exists. The "paradox" only arises if you view tolerance as a universal moral duty owed even to those who owe it to no one.

