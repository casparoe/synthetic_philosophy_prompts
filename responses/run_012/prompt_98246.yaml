answer: |-
  Here is the case for your claim, followed by the confrontation with the power objection.

  ### Part I: The Dissolution of the Paradox

  The "Paradox of Tolerance" relies on a category error. It treats tolerance as a universal moral commandment—a rule that says, "Thou shalt not interfere with conduct thou disapprovest." If tolerance is a commandment, then applying intolerance to anyone is a sin, even to those who would destroy the commandment. Hence, the paradox: to save tolerance, you must violate it.

  But tolerance is not a commandment. It is a **constitutive practice**, like a conversation, a market, or a game.

  Consider a conversation. The goal is the exchange of ideas. The constitutive rule is reciprocity: I speak, you listen; you speak, I listen. If a participant enters the conversation with a megaphone and a gag, intending to shout down everyone else until only their voice remains, they are not "violating the spirit" of conversation; they have ceased to participate in conversation altogether. They are engaging in monologue or suppression. Removing them is not an act of censorship *within* the practice; it is an act of boundary maintenance *for* the practice.

  Tolerance functions identically. It is a social technology designed to allow conflicting groups to coexist without violence. Its operating principle is mutual restraint: I refrain from using my power to crush your differences, provided you refrain from using your power to crush mine.

  When a group becomes "intolerant" in the structural sense, they are not merely holding a disagreeable view. They are refusing the condition of mutual restraint. They accept the protection of the tolerant order while actively working to dismantle that protection for others. They are free-riders on the infrastructure of liberty.

  Therefore, when a tolerant society suppresses the intolerant, it is not contradicting itself. It is not saying, "We are being intolerant to uphold tolerance." It is saying, "You have opted out of the reciprocal arrangement that makes tolerance possible. Since you are no longer a party to the contract, the contract no longer protects you."

  The paradox vanishes because there is no universal duty to extend the benefits of a cooperative practice to those who are actively sabotaging the cooperation. The intolerant are not a special exception carved out of the rule; they are people walking off the playing field. You don't owe a chess move to someone who has flipped the board.

  ### Part II: The Objection of Power

  This is the sturdy case for your position. But now we must face the objection you care about: **Is this just power wearing a nice coat?**

  The critic argues that defining "who is intolerant" and "what counts as reciprocity" is inevitably a political act. If the dominant group decides that a minority movement is "intolerant" because it disrupts the status quo, they can use your framework to crush dissent under the guise of defending the "practice." This reduces tolerance to a *modus vivendi*—a truce based on current power balances, where the strong define the terms of peace and call it "principle."

  Here is the counter-argument.

  **1. The Coat Constrains the Wearer**
  If tolerance were merely power, the powerful would not need the coat. They could rule by brute force. The fact that they must appeal to "reciprocity" and "the practice" imposes a cost on them. To justify excluding a group, they must demonstrate that the excluded group has violated the condition of reciprocity. This requires public reasoning and evidence of behavior, not just identity.

  If a government bans a group simply because they are unpopular, they expose themselves as tyrants, undermining the legitimacy of the practice itself. If they ban a group because that group is openly advocating violence or the removal of rights for others, they are upholding the practice. The framework forces the powerful to argue in terms of *conduct* rather than *whim*. It doesn't eliminate abuse, but it raises the price of it.

  **2. Internal vs. External Authority**
  In a pure *modus vivendi*, the truce holds only as long as the power balance holds. The moment the weak become strong, the truce is void. In a reciprocal practice, the authority of the rule is internal to the participants.

  Crucially, **the powerful are also participants.** In your framework, the state or majority is not the "manager" of tolerance standing outside the system; they are the primary beneficiaries and bound parties. If the state begins to define "intolerance" arbitrarily to suit its own preservation, *the state itself* becomes the intolerant actor. It violates reciprocity by demanding restraint from citizens while exercising unrestrained power over them.

  Under the "absolute rule" view of tolerance, the state is the enforcer of a moral law. Under the "reciprocal practice" view, the state is a fellow traveler bound by the same rules. If it breaks reciprocity, it loses its claim to legitimacy within the practice. This turns the definition of intolerance back against the powerful. It gives the oppressed a vocabulary to say, "You are not defending the practice; you are violating it."

  **3. Stability through Buy-in, not Exhaustion**
  A *modus vivendi* is fragile because it relies on exhaustion. People stop fighting because they are tired, not because they agree on rules. The moment they regain strength, fighting resumes.

  A reciprocal practice is robust because it offers a *reason* for the weak to accept it even when they have the power to fight. It offers security. By framing tolerance as a practice that excludes only those who reject reciprocity, you offer a guarantee to minorities: "As long as you play by the rules of mutual restraint, you are safe, even from us."

  If you admit that this is just power, you destroy that guarantee. If the minority believes the rules are rigged, they have no incentive to remain tolerant when they gain power; they will simply become the new oppressors. By insisting that the definition of "intolerant" is tied to the objective behavior of rejecting reciprocity (e.g., advocating for the removal of others' rights), you create a stable equilibrium that survives shifts in power.

  **Conclusion**
  The charge that this is "power in a nice coat" is a warning against hypocrisy, not a refutation of the logic. Yes, the powerful can lie. They can claim a group is intolerant when they are not. But that is a failure of *application*, not a flaw in the *concept*.

  The concept of tolerance as a reciprocal practice is actually the *only* defense against the rule of power. If tolerance is an absolute rule, the powerful will break it when convenient. If tolerance is a *modus vivendi*, the powerful will rewrite it when convenient. But if tolerance is a reciprocal practice, the powerful are bound by it as long as they wish to claim they are part of a civilized order.

  The "coat" is not a disguise for power; it is a harness. It doesn't stop the powerful from trying to bolt, but it makes it visibly obvious when they do.
