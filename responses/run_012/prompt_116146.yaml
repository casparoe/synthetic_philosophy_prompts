prompt: |-
  I'm trying to read through Thucydides' History of the Peloponnesian War (the old Crawley translation) and I've hit a wall in Book 1, chapter 20. Here's the bit that's tripping me up:

  "Having now given the result of my inquiries into early times, I grant that there will be a difficulty in believing every particular detail. The way that most men deal with traditions, even traditions of their own country, is to receive them all alike as they are delivered, without applying any critical test whatever.

  The general Athenian public fancy that Hipparchus was tyrant when he fell by the hands of Harmodius and Aristogiton; not knowing that Hippias, the eldest of the sons of Pisistratus, was really supreme, and that Hipparchus and Thessalus were his brothers; and that Harmodius and Aristogiton suspecting, on the very day, nay at the very moment fixed on for the deed, that information had been conveyed to Hippias by their accomplices, concluded that he had been warned, and did not attack him, yet, not liking to be apprehended and risk their lives for nothing, fell upon Hipparchus near the temple of the daughters of Leos, and slew him as he was arranging the Panathenaic procession.

  There are many other unfounded ideas current among the rest of the Hellenes, even on matters of contemporary history which have not been obscured by time. For instance, there is the notion that the Lacedaemonian kings have two votes each, the fact being that they have only one; and that there is a company of Pitane, there being simply no such thing. So little pains do the vulgar take in the investigation of truth, accepting readily the first story that comes to hand."

  What I don't get is what "applying a critical test" is supposed to amount to here. He says people just accept traditions uncritically, but then his examples of their errors are about stuff like which brother was actually tyrant and whether a Spartan company existed — and he's correcting them without saying how he knows. And he admits right at the start that he can't believe every detail of his own inquiries into early times. So what is the test, exactly, and how is he able to pass it on these particular claims when the sources are presumably the same oral traditions everyone else has? I feel like I'm missing something about what hes actually claiming to do, methodologically.

  End with a one-sentence summary of your main point, on its own line, starting with "In short:".
