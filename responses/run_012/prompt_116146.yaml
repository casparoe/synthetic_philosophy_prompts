answer: |-
  This is one of the most sophisticated questions a reader can ask about Thucydides, because it touches on the birth of historical methodology itself. You have identified a apparent contradiction: how can he claim a superior method while admitting the evidence for the past is flawed, and how can he correct common knowledge without citing his sources?

  To understand what Thucydides means by "applying a critical test," you have to look at three distinct elements of his argument in this chapter: the definition of the test, the distinction in time periods, and the role of effort versus laziness.

  **1. The "Critical Test" is Cross-Examination and Probability**
  When Thucydides speaks of a critical test (often associated with the Greek concept of *akribeia*, or precision), he does not mean a modern scientific formula. He means the diligent cross-examination of multiple accounts. In Book 1, Chapter 22, he elaborates on this regarding speeches and events: he heard them himself or got reports from others, and then checked them against each other to find the most probable truth. The "test" is an attitude of skepticism. It involves asking: *Does this story make political sense? Does it align with human nature? Do other witnesses contradict it?* He is rejecting the "poetic" tendency to exaggerate and the "logographer" tendency to please the ear rather than speak the truth.

  **2. The Distinction Between "Early Times" and " Contemporary History"**
  You noted that he admits uncertainty about "early times" but corrects people on other facts. This is crucial. Thucydides draws a line between the *archaeologia* (the deep, mythic past like the Trojan War) and recent or contemporary political facts.
  *   **Early Times:** He admits that evidence here is scarce and obscured by time ("difficulty in believing every particular detail"). He offers the best reconstruction he can, but acknowledges the fog.
  *   **Recent/Contemporary Facts:** The examples you cited (the Pisistratid tyranny, the Spartan kings' votes, the company of Pitane) are not deep myth. They are recent political realities or institutional facts. The information *was* available. The Athenians could have asked their elders about the tyranny; the Greeks could have asked Spartans about their kings. Thucydides is not claiming to have magical insight here; he is claiming that the truth was accessible if one bothered to look.

  **3. Effort vs. Laziness**
  This resolves your question about how he knows without saying how. He explicitly states: "So little pains do the vulgar take in the investigation of truth, accepting readily the first story that comes to hand."
  Thucydides' claim to authority is not that he has secret documents, but that he did the legwork that others were too lazy to do. The "critical test" is essentially the willingness to endure the labor of inquiry. When he corrects the belief about Hipparchus, he is implying that he investigated the sequence of events and motives rather than accepting the popular song about the "Tyrannicides." When he corrects the Spartan vote count, he is implying he verified the constitutional reality rather than accepting the rumor. He doesn't cite sources because, in his view, the authority comes from the *method* of verification, not the specific witness.

  **Conclusion**
  Thucydides is establishing a new standard for history. He is arguing that truth is not found in accepting tradition, nor is it impossible to find due to the fog of history. Instead, truth is found in the rigorous effort to verify what is verifiable (recent history) while maintaining skepticism about what is not (deep myth). The "test" is the labor of skepticism itself.

  In short: Thucydides defines his method not by possessing secret evidence, but by the diligent effort to cross-examine sources and verify recent political facts that others accept lazily, while acknowledging the inherent ambiguity of the deep past.
