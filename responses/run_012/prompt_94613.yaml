answer: |-
  This is a sophisticated refinement of the Causal Theory of action, specifically attempting to solve the "omission" problem by introducing *process sustenance* and *institutional inputs*. It avoids the crude bodily movement criterion and the well-known failures of the simple counterfactual account (e.g., pre-emption cases).

  However, by expanding "sustaining" to include "iterated non-action" and extending the ontology to "institutional processes," you have moved the metaphysical goalposts significantly. Below is a map of the exposure, sorted by the decisiveness of the defeaters.

  ### 1. High Decisiveness: The Collapse of the Distinction (Your Primary Worry)
  **The Defeater:** The distinction between "sustaining a harmful process" and "failing to interrupt a harmful process" collapses under the weight of background conditions.

  **The Problem:** Your account hinges on whether the agent is a *necessary input* to the process. But almost every ongoing harmful process relies on a vast network of background conditions that agents "sustain" through iterated non-action.
  *   **Case:** A starving child is in a room. You hold the only key. You do not unlock the door. The child starves.
  *   **Your Verdict:** You are sustaining the process of confinement/starvation because your non-action (not unlocking) is a necessary input at each stage for the state of "locked" to persist. Thus, you *do* the harm.
  *   **Case:** A starving child is in a famine zone. You are a distant billionaire. You do not send food. The child starves.
  *   **Your Verdict:** The process of starvation is underway. Are you a necessary input? Physically, no. But if we treat "global economic distribution" as the *process*, and your retention of capital as a "designated input" into that system... do you *do* the harm?

  **Why it is decisive:** If you draw the line at "physical necessity," you lose the landlord case (physically, the landlord doesn't need to do anything for the tenant to be homeless; the *system* requires the landlord's input). If you draw the line at "systemic necessity," you risk classifying almost all failures to aid as *doing* harm, effectively eliminating the category of *allowing*.
  *   **The Exposure:** You need a non-moral, metaphysical criterion for what counts as a "necessary input" versus a "background condition." If you define "necessary input" as "that which we have a duty to provide," your causal account reduces to a Normative account, rendering the causal machinery superfluous.

  ### 2. High Decisiveness: Process Individuation (The Circularity Charge)
  **The Defeater:** The verdict depends entirely on how "the process" is described, and there is no non-circular way to individuate processes.

  **The Problem:** Causal processes can be sliced thinly or broadly.
  *   **Case:** A doctor turns off a ventilator.
  *   **Description A:** The process is "Machine Functioning." The doctor interrupts it. (Verdict: Allowing nature to take course / Allowing death).
  *   **Description B:** The process is "Patient Life-Support." The doctor sustains the termination of this process. (Verdict: Doing harm / Killing).
  *   **Description C:** The process is "Biological Metabolism." The machine was an external interruption of *this* process. Turning it off restores the natural process.

  **Why it is decisive:** Your account requires us to identify *which* process is "the one" that matters.
  *   If you say "The process is defined by the agent's intervention," you are circular (you define the process by the doing).
  *   If you say "The process is defined by physical continuity," you lose the moral distinction (turning off a ventilator is physically identical to unplugging a toaster).
  *   If you say "The process is defined by social/institutional norms," you have abandoned causal metaphysics for normative sociology.
  *   **The Exposure:** Without a robust metaphysics of process individuation that is independent of moral intuition, the theory predicts whatever intuition you feed into the process description.

  ### 3. Medium-High Decisiveness: The Institutional Extension
  **The Defeater:** Treating institutions as processes to which agents are inputs creates a dilemma of *diffusion* or *over-extension*.

  **The Problem:**
  *   **Diffusion:** If the Institution is the Process, and the Agent is merely a "designated input" (a cog), does the agent *own* the causal process? In a bureaucracy, a clerk stamps a form. The deportation happens. The clerk sustained the process. But so did the IT guy who maintained the server, and the voter who elected the administration. If "designated input" makes you an owner, moral responsibility is diluted across too many nodes. If it doesn't, the individual clerk is merely "allowing" the institutional machine to work, which seems to let them off the hook too easily.
  *   **Over-extension:** If I pay taxes, and my government uses them for a war I oppose, am I "sustaining" the causal process of that war via iterated non-action (not quitting my job/not evading taxes)? Your account suggests that if I am a "designated input" (citizen/taxpayer), I might be *doing* the harm, not merely allowing it.

  **Why it is decisive:** This extension was meant to capture institutional agency, but it risks making individual agency incoherent. It either makes everyone guilty of institutional harms (because everyone sustains the background system) or no one guilty (because the "Institution" is the true agent).

  ### 4. Medium Decisiveness: Rival Accounts & Parsimony
  **The Defeater:** Normative Expectation accounts cover the same cases with fewer metaphysical commitments.

  **The Argument:** Many philosophers (e.g., Foot, Quinn, later Norcross) argue that the doing/allowing distinction tracks *normative expectations* rather than causal topology.
  *   **Rival View:** You "do" harm when you violate a negative duty (do not kill); you "allow" harm when you fail to fulfill a positive duty (save).
  *   **Comparison:** Your "Landlord" case works because we expect landlords to renew. Your "Passerby" case works because we don't expect passersby to save.
  *   **Parsimony:** The Normative account admits it is tracking duties. Your account tries to ground those duties in "causal process ownership." But as seen in Defeater #1, determining "ownership" often requires referencing the duties first.
  *   **The Exposure:** If the Normative account explains the landlord/passerby distinction without needing a complex metaphysics of "iterated non-action inputs," your account is less parsimonious. You are building a causal engine to drive a normative car.

  ### 5. Low Decisiveness: Counter-Intuitive Verdicts in Pre-Emption
  **The Defeater:** There are cases where your account yields a verdict we should reject, specifically regarding "short-circuited" processes.

  **The Case:** Assassin A poisons Victim. Assassin B, unaware, shoots Victim dead before the poison takes effect.
  *   **Counterfactual View:** B did the harm (death wouldn't have happened then without B). A allowed the harm (death would have happened anyway).
  *   **Your View:** A initiated a causal process (poison). B initiated a causal process (bullet). Both processes were underway. B's process terminated in harm. A's process was interrupted.
  *   **The Risk:** If A's process was "sustained" up until the moment of death (the poison was still in the blood), did A *do* the harm? Most intuitions say A *attempted* but B *did*. If your view implies A is a co-author of the death because he sustained a lethal process that was technically "ready," it conflicts with the intuition that the bullet was the *actual* cause.
  *   **Why Low Decisiveness:** This is a standard problem for all causal theories. You can likely tweak the definition of "terminus" to handle this. It doesn't threaten the core architecture like the Process Individuation problem does.

  ---

  ### Predictions and Falsifiability

  **What does your position predict that rivals do not?**
  1.  **The "Iterated Omission" Prediction:** Unlike simple Causal or Counterfactual views, your account predicts that specific types of omissions are *doings*, not allowings. Specifically, roles that require continuous active renewal (like the landlord, or a life-support technician who must press 'hold' every 30 seconds).
      *   *Rival Prediction:* Counterfactual views usually treat these as allowings (if the technician leaves, the machine stops; if the technician stays, the machine runs. If they leave, the patient dies. Would the patient have died anyway? Yes, if the machine broke. No, if the technician left. It gets messy). Normative views treat it as a violation of positive duty.
      *   *Your Unique Claim:* You claim this is metaphysically a *doing* because the agent is physically sustaining the causal chain via iterated inputs.
  2.  **The "Institutional Input" Prediction:** You predict that an agent who is a *necessary designated input* into an institutional harm is a *doer*, even if they perform no physical movement (e.g., a judge who merely refuses to sign a stay of execution, where the signature is a required iterative input).
      *   *Rival Prediction:* Counterfactual views might say "The execution would have happened anyway if a different judge signed." Normative views say "The judge violated a duty." You say "The judge sustained the execution process."

  **Is the account unfalsifiable?**
  **Yes, currently.** And this is a defect.
  The unfalsifiability lies in the phrase **"necessary input."**
  *   If you define "necessary input" physically (but-for causation at every time-step $t$), the theory fails to capture the landlord case (the landlord's physical presence isn't required at every $t$).
  *   If you define "necessary input" functionally/systemically, you rely on social conventions to define the system boundaries.
  *   If you define "necessary input" normatively (inputs one is required to monitor), the theory is circular.

  **Is this a defect or a misdescription?**
  It is a sign that you have **misdescribed what the account is for.**
  You are attempting to solve a *Normative* problem (when are we more culpable?) with a *Metaphysical* solution (causal process ownership).
  *   **If you want a Metaphysical Account:** You must accept that it will not align perfectly with moral intuition. You must bite the bullet that "process ownership" is a brute physical fact, even if it implies the passerby is doing harm (by sustaining the oxygen in the room) or the landlord is allowing harm (by not physically intervening).
  *   **If you want a Moral Account:** You should admit that "process ownership" is a heuristic for "normative control." If so, the qualifications you've built in (iterated non-action, designated inputs) are not metaphysical discoveries, but normative stipulations.

  ### Summary Map of Exposure

  | Defeater Category | Decisiveness | Core Vulnerability |
  | :--- | :--- | :--- |
  | **Collapse of Distinction** | **High** | "Sustaining" iterated omissions risks turning all background conditions into "doings." |
  | **Process Individuation** | **High** | No non-circular way to define "the process" without referencing moral intuition. |
  | **Institutional Extension** | **Med-High** | Risks diffusing agency (everyone sustains the system) or over-extending it (taxpayers do war). |
  | **Parsimony (Rivals)** | **Medium** | Normative accounts explain the same intuitions without the causal metaphysics. |
  | **Pre-emption Cases** | **Low** | Standard issue for causal theories; manageable with tweaks. |

  **Recommendation:** To save the account, you must rigidly define "necessary input" without recourse to duty. If you cannot do that, you should reframe the position: not as a metaphysical truth about causation, but as a **functional model of agency** where "ownership" is assigned based on *control points* in a system, acknowledging that "control" is partly a normative construct.
