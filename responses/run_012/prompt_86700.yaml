  **Infinitism:** Justification requires an infinite, non-repeating chain of distinct reasons. This corresponds to an infinite proof tree that is neither well-founded (failing induction) nor necessarily guarded by coinductive constructors (failing standard coinduction). It asserts the existence of an infinite descending chain in the justification relation without collapsing into a cycle. Termination checking fails, yet the infinite object is claimed to exist as a valid justification.

