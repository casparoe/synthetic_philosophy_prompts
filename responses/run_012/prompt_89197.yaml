      A theory of convention for computationally bounded agents must satisfy eight desiderata.

      1. **Non-circularity:** The analysis must not presuppose semantic or normative primitives like 'agreement', 'promise', or 'obligation'. Since the goal is to naturalize meaning, the account must rest solely on behavioral regularities, preferences, and mutual expectations definable in non-intentional or weakly intentional terms. Strong naturalism is required.

      2. **Common Knowledge:** Strict common knowledge is impossible for bounded agents. The requirement is replaced by 'common belief*', defined as a shared history of interaction yielding mutual expectations up to a finite recursion depth sufficient for coordination. This distinguishes convention from coincidence by grounding expectations in past success rather than logical infinity.

      3. **The Vanishing Population:** The last speaker of a dying language is not following a convention. Convention is inherently relational; without a population to coordinate with, the regularity collapses into habit or memory. This verdict preserves the social ontology of convention, distinguishing it from individual rule-following.

      4. **Arbitrariness:** The theory requires weak arbitrariness. A regularity counts as conventional even if one option is overwhelmingly salient, provided an alternative was physically possible and coordination was the motive. Strict arbitrariness excludes too many focal-point solutions that function as conventions in practice.

      5. **Asymmetric and Exploitative Conventions:** The account must cover exploitative regularities sustained by power rather than mutual benefit. Lewisian coordination equilibria are insufficient. Conventions include regularities where one party conforms to avoid sanction, even if they prefer the alternative. This aligns theory with ordinary usage regarding social norms.

      6. **Normativity:** The account yields only hypothetical normativity. It provides a reason to conform only if the agent prefers coordination or wishes to avoid sanction. It generates no categorical obligation distinct from prudential reasoning. Moral obligation remains a separate category, preventing the reduction of 'ought' to 'is'.

      7. **Emergence without a Coordinator:** Emergence must be explained via iterative learning and salience without explicit agreement. Bad conventions persist due to transition costs and network effects, not because they are efficient. The theory must model how suboptimal equilibria lock in through path dependence.

      8. **Stability and Change:** Stability arises from network externalities and expectation alignment; change requires exogenous shocks or critical mass shifts. Stability must be distinct from efficiency; a convention can be stable precisely because it is inefficient for outsiders to deviate.

      **Incompatibilities:**
      Non-circularity and Normativity cannot be jointly satisfied in the strong sense. If meaning and normativity are reduced to behavioral regularities and expectations (non-circularity), the resulting 'ought' is merely hypothetical (prudential), not categorical. To claim genuine normativity while maintaining naturalistic non-circularity is to beg the question.

      Arbitrariness and Emergence also tension. If emergence relies on intrinsic salience (Schelling points) to solve the first-instance problem, the resulting regularity is not strictly arbitrary, as one option was pre-selected by psychology rather than convention. Demanding strict arbitrariness makes emergence inexplicable without a coordinator; allowing salience undermines strict arbitrariness.

      **Closing:**
      The requirement of non-circularity does the most to exclude otherwise attractive accounts by forbidding the smuggling of normative force into the base conditions of coordination.

