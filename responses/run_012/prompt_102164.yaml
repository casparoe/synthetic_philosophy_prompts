          *   *Metric Gaming (Goodhart's Law):* If money depends on the metric, the metric stops measuring value and starts measuring optimization.
          *   *Values vs. Beliefs:* Choosing a metric isn't just values; it's a hypothesis about what creates good science. The market bleeds into the vote.
      *   **Recommendation:** Pilot Program.
      *   **Pilot Design:**
