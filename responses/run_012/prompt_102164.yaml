answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee
  **FROM:** Chair, Governance Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal to Allocate Discretionary Funds via Decision Market

  **Purpose**

  At our upcoming meeting, we must decide how to allocate this year's pool of discretionary research funds. A proposal has been circulated to replace our standard deliberative process with a decision market (often termed "futarchy"). Under this system, we would vote on a success metric and then allow institute members to trade contracts predicting which proposals will meet that metric. Funding would be awarded based on the resulting market prices.

  This memo outlines my assessment of that proposal. It argues that while the theoretical benefits of decision markets are significant, the specific conditions of our institute create risks that preclude immediate full-scale adoption. I recommend a controlled pilot program for the upcoming cycle, subject to strict safeguards and a defined review period.

  **The Case for the Decision Market**

  We must first acknowledge the strength of the proposal. The argument for adopting a decision market rests on two compelling pillars: information aggregation and incentive alignment.

  First, our current deliberative process is bottlenecked by the committee's limited bandwidth. We cannot be experts in every interdisciplinary niche represented in the applicant pool. A decision market leverages the dispersed knowledge of the entire institute. It allows those with specialized insight into a proposal's viability to signal that insight financially. In theory, this aggregates information more efficiently than any committee hearing could.

  Second, the proposal addresses the problem of political maneuvering. In standard deliberation, applicants spend time lobbying committee members, and committee members may vote based on interpersonal dynamics rather than project merit. A market shifts the incentive from persuasion to prediction. If a member knows a project is fundamentally unsound, they are incentivized to short it, regardless of their personal relationship with the applicant. This creates a mechanism where truth-seeking is financially rewarded, potentially reducing bias and cronyism.

  The proponent's slogan—"vote on values, bet on beliefs"—is elegant. It suggests we can separate the normative question (what counts as success?) from the empirical question (which project will succeed?). If successful, this would streamline our governance and depoliticize funding decisions.

  **Institutional Realities and Risks**

  However, decision markets function best under specific conditions that do not currently exist in our institute. Two specific features of our situation threaten to invert the benefits described above.

  **1. The Identity of Traders and Applicants**
  In a standard prediction market, the traders are distinct from the event being predicted. In our proposed market, the people best positioned to trade are the applicants themselves, their collaborators, and their direct competitors.

  This creates a profound conflict of interest. If I have a proposal in the pool, I have inside information not just about the project's quality, but about my own future effort. I can manipulate the market price by trading heavily on my own success, creating a self-fulfilling prophecy where the market price drives the funding, which drives the success. Conversely, I could short a competitor's project and then subtly undermine their work to ensure the payout.

  When the traders can influence the outcome, the market price ceases to be a prediction and becomes a tool of strategy. We risk creating a system where capital allocation is determined not by who has the best science, but by who has the most capital or the highest risk tolerance to manipulate the prices.

  **2. The Metric Problem**
  The proposal assumes we can cleanly separate values from beliefs. It suggests we vote on a metric (e.g., "papers published" vs. "follow-on funding raised") and then bet on which projects achieve it.

  In practice, the choice of metric is not purely normative; it is an empirical hypothesis about what constitutes valuable research. Furthermore, once a metric determines funding, it becomes subject to Goodhart's Law: when a measure becomes a target, it ceases to be a good measure. If we vote to prioritize peer-reviewed output, researchers will optimize for salami-slicing publications rather than breakthrough insights.

  Because the metric choice is itself partly an empirical question, the market will bleed into the vote. Traders will not just bet on projects; they will bet on the stability and interpretation of the metric itself. If the market perceives the metric as gameable, the prices will reflect the ease of gaming rather than the quality of the research. This blurs the line between betting on beliefs and lobbying for values, reintroducing the politics the system aims to avoid.

  **Recommendation: A Controlled Pilot**

  Given the potential upside of improved information aggregation and the significant downside of market manipulation, I recommend we **pilot the decision market mechanism** for this coming cycle, but restrict it to a fraction of the total fund.

  **Scope and Time Frame**
  *   **Allocation:** 15% of the discretionary research pool will be allocated via the decision market. The remaining 85% will follow our standard deliberative process.
  *   **Duration:** One funding cycle (24 months).
  *   **Review:** The Governance Committee will re-evaluate the mechanism at the end of the 24 months before any further funds are committed.

  **Safeguards**
  To mitigate the risks identified above, the pilot must operate under the following constraints:

  1.  **Position Limits:** No individual may hold a position in a contract greater than 5% of the total market volume for that specific proposal. This prevents any single applicant or competitor from dominating the price discovery of a specific project.
  2.  **Blind Trading Identities:** While the Governance Committee must know the identities of traders for audit purposes, trader identities will be anonymized in the public market feed. This reduces the ability to signal collusion or retaliate against short-sellers.
  3.  **Metric Deliberation:** The metric for success will not be decided by simple majority vote alone. It will be selected by the Governance Committee after a period of consultation, explicitly acknowledging that the metric is a provisional hypothesis. We will adopt a composite metric (e.g., a weighted blend of output and external validation) to reduce the incentive to game a single variable.
  4.  **Oversight Veto:** The Governance Committee retains the right to void trades or suspend the market if there is evidence of collusion, wash trading, or external interference.

  **Conditions for Termination**
  We will terminate the pilot immediately and revert to standard allocation if:
  *   **Price Divergence:** The market price for a funded project diverges significantly from independent expert assessment without new public information, indicating manipulation.
  *   **Collusion:** Evidence emerges of traders coordinating to fix prices.
  *   **Metric Gaming:** Interim reports suggest that the chosen metric is actively distorting research behavior in ways detrimental to the institute's mission.

  **Conclusion**

  Innovation in governance requires experimentation, but it also requires fiduciary responsibility. The proposal to use a decision market is intellectually serious and addresses real flaws in our current process. However, the overlap between traders and applicants, combined with the fragility of performance metrics, makes a full rollout imprudent.

  By piloting this mechanism on a limited portion of the fund, we can test the hypothesis that "betting on beliefs" improves our allocation without risking the institute's core mission. If the market proves robust against manipulation and yields better outcomes than our deliberative process, we may expand it in future years. If it fails, we will have contained the damage and learned valuable lessons about the limits of market mechanisms in research governance.

  I look forward to discussing these parameters at our next meeting.
