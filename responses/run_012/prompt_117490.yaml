answer: |-
  Your proposed principle is robust, but it is currently trying to do two different jobs with one tool. You have correctly identified that **history** is the source of value, but you have conflated the *metaphysics* of that history (what makes the object what it is) with the *ethics* of its presentation (what makes a lie a lie).

  Here is the test, the repair, the prediction, and the cost.

  ### 1. Testing and Repairing the Principle

  Your principle: *Value lies in numerical identity with past events; wrongness lies in false claims about that history.*

  This holds up well, but it breaks on the **Chair** vs. the **Watch**.
  *   **The Watch:** Assembled from period parts. Every atom is old. But it is a fake.
  *   **The Chair:** Assembled from new parts (leg, upholstery, frame). Most atoms are new. But it is real.

  If value were merely "old atoms" or "period correctness," the watch would win. If value were merely "function and form," the new copy of the chair would win. Neither is true.

  **The Repair:** You need to distinguish between **Causal Continuity** and **Causal Origin**.
  *   **Causal Continuity (The Chair):** An object retains its identity if it undergoes gradual change while maintaining a continuous existence in space and time. The chair is a *process* that has persisted. The replacement of parts is a biological function of the object's life, like skin cells replacing themselves.
  *   **Causal Origin (The Ring, Voice, Wine):** Some objects derive their value not from their continuous existence, but from a specific, unrepeatable *event* of creation. The ring is valuable because *that* gold was shaped by *that* jeweler for *that* proposal. The voice is valuable because *those* vocal cords vibrated. A replica breaks the causal chain from the specific event.
  *   **The Watch Failure:** The watch fails because it lacks *Causal Unity*. The movement and case have two different histories that were forcibly merged. It is a chimera, not a continuum.

  **One Principle or Two?**
  It is **one metaphysical principle** (Causal History) manifesting in **two normative modes**:
  1.  **Constitutive Value:** The history *makes* the object valuable (Ring, Voice, Wine). Here, a copy is inherently lesser, even if honestly labeled.
  2.  **Representational Integrity:** The history *must be truthfully reported* (Pub, Watch, Portrait). Here, the object might be charming (Pub beams) or functional (Watch), but the lie corrupts the relationship.

  The **Portrait** is the bridge case: It has Constitutive Value (it is a 19th-century copy, which has some history), but the Representational Integrity was violated (it was labeled 18th-century). Correcting the label fixes the lie, but reveals the lower Constitutive Value.

  ### 2. The New Case: The House

  **The Scenario:** The house is demolished. A developer rebuilds it to original plans as a "heritage replica."

  **The Prediction:**
  Your repaired principle predicts that your **mother is right**, and your "half-agreement" with her is the only consistent position. The "half-think" that it is no different from the chair is the error.

  *   **Why it is not the Chair:** The Chair maintained *Causal Continuity*. It was never ceasing to be a chair while the leg was replaced. The House undergoes *Discontinuous Recreation*. Demolition ends the object's existence. The new building is a copy, like the lab-grown ring, not a restoration, like the chair.
  *   **The Verdict:** The replica house is a **memorial**, not a home. It has architectural value (like the Pub beams) and perhaps sentimental utility (like the Ring replica), but it possesses zero *indexical* value. It is not the place where your grandmother walked.
  *   **The Label:** If the developer calls it "The Family Home," it is a lie (like the Pub). If they call it "A Replica of the Family Home," it is honest (like the Ring), but it cannot command the reverence of the original. You can live in it, but you cannot claim it is *the* house.

  ### 3. Which Verdict Must You Give Up?

  To maintain this repaired principle, you must surrender the intuition that **the House Replica is "no different from the chair."**

  You cannot have it both ways. If the Chair is "his chair" because of continuous existence through repair, then the House, having ceased to exist, cannot be "the house" through reconstruction. If you argue the House *is* the house because the *plans* are the same, you undermine the Chair (which has new wood) and validate the Watch (which has old parts).

  You must accept that **continuity of existence is a stricter requirement than continuity of design.** The Chair survived because it was never destroyed. The House did not.

  *Secondary Sacrifice:* You must also refine your view on the **Photograph**. You said you are "uneasy" about the in-painted photo standing in as the photograph itself. To be fully consistent with the Chair, you should be *less* uneasy. The in-painting is a repair to preserve the function (viewing the memory), just as the new leg preserves the function (sitting). However, because a photograph is an *informational* object (its value is the light captured), altering the image is more invasive than altering the chair's wood. You can keep this distinction, but only if you admit that **Material Objects** (Chair, House) and **Informational Objects** (Photo, Voice, Recording) have different thresholds for what counts as "breaking" their history.

  ### 4. The Complexity Cost

  You asked how much complexity I am buying to save the rest of your verdicts. The cost is **high**.

  To save your intuitions about the Ring, Chair, Watch, and House, you are forced to adopt a **Dual-Aspect Theory of Heritage**. You must categorize every object you encounter into one of two buckets before you can judge its authenticity:

  1.  **Substance-Continuants:** Objects where value lies in the continuous persistence of the physical entity (Chair, House, Ring).
      *   *Rule:* Gradual repair is allowed; destruction and rebuilding are not.
  2.  **Event-Indices:** Objects where value lies in a specific causal moment of production (Photo, Voice, Wine, Painting).
      *   *Rule:* Alteration of the trace (in-painting, AI synthesis, blending wine) degrades value, even if the result is perceptually identical.

  **The Cost:** You lose the ability to have a single, simple rule like "History matters." Instead, you must ask: *"What kind of history does this object hold? Is it a history of endurance (Chair) or a history of origin (Voice)?"*

  This explains why the **Watch** bothers you: It pretends to be a Substance-Continuant (a specific watch that survived time) but is actually a composite of Event-Indices (parts made at different times). It is a category fraud.

  **Summary:**
  Keep the principle that **History is Value**.
  Split it into **Continuity** (Chair) vs. **Origin** (Ring/Voice).
  Accept that the **House is gone** (Mother is right).
  Admit that **Objects are not all the same kind of thing** (Complexity Cost).

  If you pay this cost, you keep your love for the ring replica, your reverence for the chair, your distaste for the fake pub, and your grief for the house, without contradiction. But you must stop hoping the new house can be the old one. It can only be its monument.
