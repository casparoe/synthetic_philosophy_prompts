      *   *Strongest Counterexample:* **The Explosive Bridge / Demolition Case.** If a fire is spreading to 5 people, and you blow up a wall to stop it, but the explosion kills 1 person nearby. You created a new lethal mechanism (explosion) rather than redirecting the fire. Most ethicists say this is permissible (DDE allows it). Your principle might forbid it if "explosion" counts as a new threat distinct from "fire."
      *   *Another Strong Counterexample:* **The Lazy Switchman.** The trolley is heading to 5. There is a side track with 1. The switch is currently set to 5. You do nothing. 5 die. If you flip, 1 dies.
