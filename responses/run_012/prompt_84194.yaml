answer: |-
  Here is a decision tree designed to sort probabilistic commitments based on substance rather than labels. It begins with your shared commitment (Kolmogorov axioms hold) and branches through twelve substantive questions.

  ### The Foundations Sorting Tree

  **Start:** You accept that probability claims are meaningful and obey the standard calculus (values 0–1, additivity, etc.).

  **Q1. Ontology:** Is the primary truth-maker for a probability claim a feature of the **external world** (independent of minds), a feature of an **agent's state** (knowledge/belief), or is talk of "objective chance" merely a **useful fiction**?
  *   *External World* → Go to Q2.
  *   *Agent's State* → Go to Q6.
  *   *Useful Fiction* → **Leaf 1 (Deflationary/Fictionalism)**.

  **Q2. Bearer (World):** Does the probability attach fundamentally to a **token event** (this specific atom decaying now) or to a **type/ensemble** (radium atoms generally)?
  *   *Token Event* → Go to Q3.
  *   *Type/Ensemble* → Go to Q4.

  **Q3. Token Fixer:** Is the chance fixed by an **intrinsic physical disposition** of this specific object, or by the **global pattern** of all events in the universe (best systematization)?
  *   *Intrinsic Disposition* → Go to Q9.
  *   *Global Pattern* → **Leaf 2 (Best System Analysis)**.

  **Q4. Type Fixer:** Is the value fixed by **actual frequencies** (counting events), **hypothetical limits**, or **physical dispositions of the setup**?
  *   *Actual Frequencies* → Go to Q5.
  *   *Hypothetical/Disposition* → Go to Q8.

  **Q5. Frequency Scope:** Is the probability defined by the frequency in a **finite** collection of actual events, or an **infinite/hypothetical** sequence?
  *   *Finite Collection* → Go to Q11.
  *   *Infinite/Hypothetical* → **Leaf 3 (Limiting Frequentism / Long-Run Propensity)**.

  **Q6. Agent Constraint:** Given identical evidence and rationality, must two agents assign the **same unique probability**, or is there room for **personal judgment** (priors)?
  *   *Same Unique Probability* → Go to Q7.
  *   *Personal Judgment* → **Leaf 4 (Subjective Bayesianism)**.

  **Q7. Uniqueness Source:** Is the unique probability dictated by **logical relations/symmetry** between evidence and hypothesis, or by **coherence constraints** on a rational agent's belief system?
  *   *Logical/Symmetry* → **Leaf 5 (Logical Probability / Objective Bayesianism)**.
  *   *Coherence/Priors* → (Merge with Leaf 4).

  **Q8. Hypothetical Nature:** Is the hypothetical limit a **definition** of the probability (freq), or a **causal power** of the setup (propensity) that generates the limit?
  *   *Definition (Freq)* → **Leaf 3 (Limiting Frequentism / Long-Run Propensity)**.
  *   *Causal Power (Propensity)* → **Leaf 3 (Limiting Frequentism / Long-Run Propensity)**.
      *   *Note:* These are collapsed here because they are operationally indistinguishable in practice; both deny probability to single cases except by derivation from the long-run setup.

  **Q9. Determinism:** Can non-trivial probabilities ($0 < p < 1$) exist if the underlying physics is **deterministic**?
  *   *Yes (Compatible)* → **Leaf 2 (Best System Analysis)**.
  *   *No (Incompatible)* → Go to Q10.

  **Q10. Single-Case Reality:** If determinism rules out chance, is the single-case probability claim **false**, or does it refer to a **non-Humean propensity**?
  *   *False/Empty* → **Leaf 6 (Incoherent Combination)**.
  *   *Non-Humean Propensity* → **Leaf 7 (Single-Case Propensity)**.

  **Q11. Reference Class:** If a single event belongs to multiple sequences with different frequencies, is there a **unique true frequency** that is its probability?
  *   *Yes, Unique* → **Leaf 8 (Finite Frequentism)**.
  *   *No, Ambiguous* → **Leaf 6 (Incoherent Combination)**.
      *   *Note:* Finite frequentism collapses without a unique reference class rule.

  **Q12. Principal Principle:** If you know the objective chance is $p$, are you rationally obliged to set your credence to $p$?
  *   *Yes* → (Consistent with Leaves 2, 3, 7, 8).
  *   *No* → **Leaf 9 (Unexplored/Attractive Gap)**.
      *   *Note:* A realist view that denies the link between chance and credence is rarely defended.

  ---

  ### The Leaves: Positions, Awkward Commitments, and CI Diagnostics

  **Leaf 1: Deflationary / Fictionalism**
  *   **Location:** Anti-Realist (Fiction).
  *   **Fixer:** Utility/Instrumentalism.
  *   **Awkward Commitment:** You must admit that when you say "the chance is 50%," you are speaking loosely, like saying "the sun rises," without literal truth.
  *   **CI Diagnostic:** "The 95% claim is a useful convention for regulation, but literally neither true nor false."

  **Leaf 2: Best System Analysis (Lewis)**
  *   **Location:** World (Type/Pattern).
  *   **Fixer:** Global systematization (laws + chances).
  *   **Awkward Commitment:** The probability of *this* atom decaying depends on the pattern of *all* events in the universe, past and future.
  *   **CI Diagnostic:** "The parameter is fixed; the 95% refers to the coverage rate entailed by the best system's laws."

  **Leaf 3: Limiting Frequentism / Long-Run Propensity (Collapsed)**
  *   **Location:** World (Type/Setup).
  *   **Fixer:** Hypothetical limit or Setup Disposition.
  *   **Awkward Commitment:** You must deny that the single coin flip *has* a probability except derivatively; if the coin is destroyed after one flip, the probability is defined by a sequence that never happens.
  *   **CI Diagnostic:** "The parameter is fixed; this specific interval either contains it (1) or not (0). 95% applies only to the method."
  *   **Indistinguishability Note:** The tree cannot separate these. Limiting Frequentism *defines* probability as the limit; Long-Run Propensity says the setup *has* a disposition to produce the limit. Empirically, they yield identical answers for all repeatable experiments.

  **Leaf 4: Subjective Bayesianism**
  *   **Location:** Agent (State).
  *   **Fixer:** Coherence (Dutch Book avoidance).
  *   **Awkward Commitment:** Two rational experts with the same data can legitimately assign probabilities of 0.9 and 0.1 to the same hypothesis.
  *   **CI Diagnostic:** "Given my prior and the data, there is a 95% probability the parameter is in this interval." (Accepts the statement literally).

  **Leaf 5: Logical Probability / Objective Bayesianism (Collapsed)**
  *   **Location:** Agent (State) / Logical Relations.
  *   **Fixer:** Symmetry / Principle of Indifference / MaxEnt.
  *   **Awkward Commitment:** You must defend a "correct" prior for unique events (like rain 1000 years ago) where no symmetry exists, often relying on ignorance.
  *   **CI Diagnostic:** "There is a 95% probability the parameter is in this interval, determined by the logical relation between data and hypothesis."
  *   **Indistinguishability Note:** Modern Objective Bayesianism usually just is Logical Probability updated with coherence constraints. The tree treats them as one because both demand uniqueness of credence given evidence.

  **Leaf 6: Incoherent Combination (Empty)**
  *   **Location:** N/A.
  *   **Fixer:** N/A.
  *   **Status:** **Incoherent.** This leaf catches those who want Finite Frequentism on Token Events (Q5 + Q2 Token) or Deterministic Chance without Best System (Q9 No + Q10 Propensity).
  *   **Awkward Commitment:** You claim a single, never-repeated event has a probability defined by a finite frequency of one (0 or 1), or that chance exists in a deterministic world without a systemic account.
  *   **CI Diagnostic:** "I insist this interval has 95% probability, but I also insist the parameter is fixed and I reject Bayesian priors." (The standard applied contradiction).

  **Leaf 7: Single-Case Propensity**
  *   **Location:** World (Token).
  *   **Fixer:** Intrinsic Physical Disposition.
  *   **Awkward Commitment:** You must posit a physical property ("propensity") that is distinct from the actual outcome and distinct from long-run frequency, which is metaphysically mysterious.
  *   **CI Diagnostic:** "The parameter is a physical constant with a disposition to be estimated; this interval captures the true value with 95% propensity." (Often slides into Leaf 3 in practice).

  **Leaf 8: Finite Frequentism**
  *   **Location:** World (Type).
  *   **Fixer:** Actual Finite Frequencies.
  *   **Awkward Commitment:** Probabilities change as new data arrives (the reference class grows), and single cases have no probability until they are part of a class.
  *   **CI Diagnostic:** "95% of the intervals we actually construct in this study contain the truth." (Denies probability for *this* interval).

  **Leaf 9: Unexplored/Attractive Gap (Empty)**
  *   **Location:** World (Realist).
  *   **Fixer:** Objective Chance.
  *   **Status:** **Unattractive/Unexplored.** This leaf catches Realists who deny the Principal Principle (Q12 No).
  *   **Awkward Commitment:** You believe there is a fact of the matter about objective chance, but a rational agent is not required to align their beliefs with it.
  *   **CI Diagnostic:** "The chance is 95%, but I am not required to believe it is 95%."

  ### How to Use This in the Group

  1.  **Diagnose the CI Fight:** When a classmate says "95% probability" about a CI, ask them to trace back up the tree. If they land on **Leaf 4 or 5**, they are consistent. If they land on **Leaf 3 or 8**, they are contradicting themselves (since those leaves deny probability to the fixed parameter).
  2.  **Expose the Reference Class:** For the "one-off coin" case, push them to **Q2**. If they say "Token" but then talk about "similar coins," they are sliding from **Leaf 7** to **Leaf 3**.
  3.  **Identify the Collapse:** If someone argues fiercely for Propensity over Frequentism but agrees that single cases have no probability without a setup, point them to **Leaf 3**. They are fighting over a label, not a substance.
  4.  **Spot the Incoherence:** Most applied contradictions land in **Leaf 6**. Show them that their "95% probability" claim requires **Leaf 4**, but their "fixed parameter" claim requires **Leaf 3**. They cannot hold both without moving to **Leaf 2** (Best System) or admitting **Leaf 1** (Fiction).
