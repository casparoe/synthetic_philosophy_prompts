answer: |-
  # The Causal Commitments Decision Tree

  **Instructions:** Begin at the root (Q1). Answer each question based on your intuitions about the concrete case or claim provided. Follow the branch corresponding to your answer until you reach a leaf node (a named position). Note the "awkward commitment" associated with your destination.

  **Root Commitment:** *A cause is at least a difference-maker.* (This tree tests what *else* you require).

  ---

  ### Q1: Analyzability
  **Case:** Consider a claim like "The short circuit caused the fire." Can the truth of this claim be fully explained using only non-causal vocabulary (e.g., laws of nature, spatiotemporal proximity, counterfactuals), or does "cause" name a fundamental feature of reality that resists analysis?
  *   **(A) It resists analysis; causation is primitive.** → **Go to Leaf 1**
  *   **(B) It can be analyzed into non-causal facts.** → **Go to Q2**

  ### Q2: Sufficiency of Difference-Making
  **Case:** Imagine a world of "magic" where event C always precedes event E, and if C had not occurred, E would not have occurred, but there is no physical process or connection linking them. Is C a cause of E?
  *   **(A) No; difference-making is not enough; there must be production.** → **Go to Q3**
  *   **(B) Yes; difference-making is sufficient for causation.** → **Go to Q4**

  ### Q3: The Nature of Production
  **Claim:** If causation requires production, what is the "glue"? Is it a continuous line of physical transfer through spacetime, or the organized functioning of component parts?
  *   **(A) A continuous spatio-temporal process (e.g., transfer of energy).** → **Leaf 2**
  *   **(B) A modular organization of activities (e.g., a mechanism).** → **Leaf 3**

  ### Q4: The Relata of Causation
  **Claim:** When we analyze "Smoking causes cancer," are we primarily relating specific dated occurrences (this cigarette, this tumor) or general parameters that take on values (smoking behavior, tumor incidence)?
  *   **(A) Specific dated occurrences (Events).** → **Go to Q5**
  *   **(B) General parameters (Variables).** → **Go to Q7**

  ### Q5: Absences and Omissions
  **Case:** A gardener fails to water a plant, and it dies. Did the *absence* of water cause the death, or is this merely a way of speaking about background conditions?
  *   **(A) Yes, absences can be genuine causes.** → **Go to Q6**
  *   **(B) No, nothing cannot cause something.** → **Leaf 4**
      *   *Path Note:* **Unoccupied Combination:** If you answered **(B)** at Q4 (Variables) and **(B)** at Q5 (Absences), this path is **Unoccupied**. It is **Unattractive** because variable-based accounts typically rely on contrastive values (0 vs 1), making it hard to deny causal status to the "0" value without undermining the variable framework.

  ### Q6: Preemption and Transitivity
  **Case:** Assassin A shoots the victim. Assassin B would have shot if A hadn't. A causes the death. But A's shot also prevents B's shot. If causation is transitive, A causes (B's not shooting). Do we accept that causes can be transitive even when it leads to counterintuitive results in late preemption?
  *   **(A) Yes, preserve transitivity (use quasi-dependence).** → **Leaf 5**
  *   **(B) No, causation is context-sensitive and non-transitive.** → **Leaf 6**

  ### Q7: Manipulability
  **Case:** Consider a variable like "Biological Sex" or "The Big Bang." We cannot intervene on these in principle. Are they causes of downstream effects?
  *   **(A) No; no causation without the possibility of intervention.** → **Go to Q8**
  *   **(B) Yes; causation exists even if we cannot manipulate it.** → **Leaf 7**
      *   *Path Note:* **Unoccupied Combination:** If you answered **(A)** at Q4 (Events) and **(B)** at Q7 (Manipulability), this path is **Unoccupied**. It is **Incoherent** because event-based accounts do not typically utilize the concept of "intervention" as a definitional constraint; that constraint belongs to the variable tradition.

  ### Q8: Circularity of Intervention
  **Claim:** To define an "intervention" on X, we must stipulate that the intervention is not caused by other variables in the system. Does this definition viciously circularly rely on the very causal notion it tries to define?
  *   **(A) Yes, the circularity is vicious; we need a non-causal account of intervention.** → **Leaf 8** (Rare/Unstable)
      *   *Path Note:* **Unoccupied Combination:** This leaf is largely **Unoccupied**. It is **Unattractive** because no successful account has defined "intervention" without causal language (e.g., "exogenous"), leading most to accept the circularity as benign.
  *   **(B) No, the circularity is benign or necessary.** → **Leaf 9**

  ### Q9: Pluralism (Token vs. Type)
  **Claim:** Is the "causation" found in singular historical explanations (token) the same concept as the "causation" found in scientific laws (type)?
  *   **(A) No, these are two distinct concepts.** → **Leaf 10**
  *   **(B) Yes, it is a single concept.** → **Return to previous leaf** (This question refines the previous leaf; if you answer A, you shift to Pluralism).

  ### Q10: Double Prevention
  **Case:** A bodyguard shoots an assassin to save a victim. The shooting prevents the assassination. Is the bodyguard's shot a *cause* of the victim's survival, or merely an *enabler*?
  *   **(A) It is a cause (Double Prevention = Causation).** → **Confirm Leaf 5 or 9**
  *   **(B) It is an enabler (Double Prevention ≠ Causation).** → **Shift to Leaf 4 or 6**
      *   *Note:* This node tests the stability of your leaf. If you are at Leaf 9 (Interventionism) but answer (B), you face tension, as interventionism typically counts double prevention as causation.

  ---

  ### Leaf Definitions & Awkward Commitments

  1.  **Primitivism (Anscombe):** Causal relations are perceptible and fundamental, but you cannot explain them to a skeptic without begging the question.
  2.  **Process Theory (Salmon/Dowe):** Causation is the transmission of a conserved quantity, but you must deny that omissions or absences are ever causes.
  3.  **Mechanistic Account (Machamer/Craver):** Causation is the activity of entities in a mechanism, but you struggle to define "activity" without smuggling in causal language.
  4.  **Absence Skepticism (Moore):** Only positive events cause, but you must explain why the law and common sense treat omissions as liable causes.
  5.  **Lewisian Counterfactuals (Lewis):** Causation is counterfactual dependence among events, but you must accept that causation is transitive even in cases where intuition rebels.
  6.  **Contextualist/De Facto (Hitchcock):** Causation depends on a contrast class, but you sacrifice the idea that causation is an objective relation in the world.
  7.  **Structural Equations (Pearl):** Causation is encoded in graph structures, but you must treat unmanipulable variables (like gender) as causally identical to manipulable ones.
  8.  **Experimentalist (Rare):** Intervention must be non-causal, but you have no working definition of "intervention" that satisfies this constraint.
  9.  **Interventionism (Woodward):** Causation is invariance under intervention, but you must accept that absences and double preventions count as causes.
  10. **Pluralism (Cartwright/Hitchcock):** There are multiple causal concepts, but you lose the unity of science and must explain how the concepts interact.

  ---

  ### Structural Notes for the Instructor

  **Unoccupied Combinations:**
  1.  **Variables + Process Ontology:** (Incoherent) Variables are abstractions; processes are concrete physical continuants.
  2.  **Strict Interventionism + Absence Skepticism:** (Unattractive) Woodwardian accounts generally accept absences as difference-makers; denying them undermines the difference-making core.
  3.  **Primitivism + Reductionism:** (Incoherent) Caught at Q1.

  **Inseparable Leaves:**
  1.  **Leaf 5 (Lewisian) & Leaf 7 (SEM):** On many standard cases of token causation, these two yield identical verdicts because SEMs often model Lewisian counterfactuals. The tree separates them on *manipulability* (Q7), but in practice, they are often indistinguishable in output.
  2.  **Leaf 9 (Interventionism) & Leaf 7 (SEM):** Woodward and Pearl converge on the mathematics of manipulation; the distinction is largely philosophical interpretation rather than formal application.

  **Teaching Tip:** Use Q8 (Circularity) to force students to read Woodward carefully. Use Q5 (Absences) to force students to choose between their metaphysical comfort (nothing comes from nothing) and their legal/moral intuitions (negligence causes harm).

  Verdict: leaves=10; unoccupied=3; inseparable=[Lewisian/SEM, Interventionism/SEM]
