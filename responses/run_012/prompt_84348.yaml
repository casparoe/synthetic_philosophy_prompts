answer: |-
  This is a profound observation that cuts to the bone of appellate jurisprudence. You have independently rediscovered what legal theorists call the **Doctrinal Paradox** (or the Discursive Dilemma), first formalized by Lewis Kornhauser and Lawrence Sager in the 1980s.

  Your commission is grappling with the gap between the *rhetoric* of the court (singular, rational, consistent) and the *mechanics* of the court (plural, aggregative, potentially inconsistent). Here is an analysis of what your current practice presupposes, what it excludes, and what would happen if you pulled the thread.

  ### 1. What the Practice Presupposes: The Fictional Corporate Agent

  Your current system presupposes that the court is a **Fictional Corporate Agent**.

  It does not presuppose that the court is a *real* single mind (obviously), nor does it presuppose that it is *merely* a vote-counting machine. It presupposes a hybrid: a machine that is required to speak *as if* it were a mind.

  *   **The Presupposition of Unity:** By issuing a single "Opinion of the Court," the practice presupposes that the group can hold a "collective belief" that is distinct from the intersection of individual beliefs. It assumes the court can say "We believe X" even if no specific "We" exists that believes X.
  *   **The Presupposition of Rationality:** By demanding internal consistency and reasons, the practice presupposes that the court is subject to norms of rationality (non-contradiction, entailment) that usually apply to individuals.
  *   **The Hidden Premise:** The system relies on a normative fiction: that the *authority* of the law derives from the coherence of the reason, but the *validity* of the law derives from the tally of the votes. It presupposes these two sources of authority will usually align, and when they don't, the vote trumps the reason, but the reason must still be written as if it didn't.

  ### 2. Which Rival Pictures Does It Rule Out?

  The "One Opinion + Issue Voting" model quietly rules out three competing conceptions of the judiciary:

  *   **Radical Seriatim (The Individualist Model):** It rules out the idea that the law is simply the sum of individual judicial views. In the early Supreme Court (under Jay and Ellsworth), judges often wrote *seriatim* (individually). Your system rejects this as the default. It insists that the *institution* speaks, not the *persons*.
  *   **Strong Integrity (The Dworkinian Model):** It rules out the idea that the law must be a seamless web of principle. If the majority on Issue A and the majority on Issue B do not overlap, the resulting "law" is not principled; it is a patchwork. A system committed to "law as integrity" could not tolerate a holding that no single judge endorses.
  *   **The "Reasons as Binding" Model:** It rules out the idea that the *reasoning* in the opinion is strictly binding precedent in the same way the *disposition* is. If the reasoning relies on a premise that only a minority accepted, treating that reasoning as binding would bind future litigants to a view no current judge held. Your system implicitly acknowledges this by making the "holding" a clerical hunt (the *Marks* rule) rather than a textual given.

  ### 3. Is It Internally Consistent?

  **Logically: No. Functionally: Yes.**

  *   **The Logical Pull:** The requirement for a single, consistent opinion pulls toward **premise-based decision-making**. (Let's agree on the principles first, then see where they lead.)
  *   **The Mechanical Pull:** The issue-by-issue voting pulls toward **conclusion-based decision-making**. (Let's vote on the outcome of each issue, then stitch together a story.)
  *   **The Conflict:** As you noted, these pull in opposite directions. When they diverge, the system prioritizes **finality** over **coherence**. It is internally inconsistent *as a rational agent*, but internally consistent *as a dispute resolution mechanism*. It sacrifices the "Single Mind" fiction on the altar of the "Binding Judgment" necessity.

  The practice is stable only because the "Doctrinal Paradox" is statistically less common than aligned majorities. When it does happen, the system relies on ambiguity in the opinion to paper over the crack.

  ### 4. Where Is It Underdetermined?

  There is a wide range of philosophical views that are compatible with your current rules, which makes reform difficult. The practice is underdetermined between:

  *   **Legal Pragmatism:** "The law is what the court does." If the vote produces a result, that's the law. The opinion is just a press release to soften the blow. This view is fully compatible with your current messy practice.
  *   **Conventionalism:** "We agree to pretend." This view holds that the court *isn't* an agent, but we all agree to act as if it is because it reduces transaction costs for lawyers and lower courts.
  *   **Moderate Collectivism:** This view holds that a group *can* have beliefs formed by aggregation, even if no member holds them. (e.g., "The Committee believes the budget should be cut," even if no member wants every specific cut).

  **What is ruled out?** Strong Rationalism. If you believe that "belief" requires conscious endorsement by a mind, and that "reasons" must actually motivate the decision, your current practice is indefensible. But since most lawyers are pragmatists or conventionalists, the practice survives.

  ### 5. The Radical Shift: If the Court Is Not an Agent

  If your commission took seriously the view that the court is **not** an agent, but merely three people tallying votes, here is what would have to change, and what would stay:

  **What Would Have to Change:**

  1.  **The Voice of the Opinion:** You would abandon "The Opinion of the Court." You would return to *seriatim* opinions or a "Judgment of the Court" accompanied by separate explanations. The text would read "Judge Smith votes for affirmance on grounds X; Judge Jones votes for affirmance on grounds Y."
  2.  **The Doctrine of Precedent:** Precedent would shrink drastically. You could no longer cite "The Court's reasoning." You could only cite the **narrowest intersection of agreement** (codifying the *Marks* rule explicitly). If Judge A says "All contracts require writing" and Judge B says "This contract required writing because it was for land," the precedent is *only* "This contract required writing." General principles become non-binding dicta.
  3.  **The Requirement of Reasons:** The requirement would shift from **Justification** (why this is the right answer for the law) to **Explanation** (why this judge voted this way). You cannot demand a "consistent" opinion because there is no entity to be consistent. You would only demand that each judge be consistent with *themselves*.

  **What Would Be Separable (What Stays):**

  1.  **The Binding Judgment:** The loser is still bound. The aggregation mechanism (majority rule) remains necessary for dispute resolution.
  2.  **The Need for Votes:** You still need to count heads to determine who wins.
  3.  **The Duty to Decide:** The court cannot refuse to hear the case just because the reasoning is fragmented.

  ### Recommendation for the Commission

  The tension you are feeling is not a bug; it is a feature of a system that values **finality** higher than **philosophical purity**.

  However, if you are reviewing how opinions are written, you should consider recommending **transparency over fiction**.
  *   **Acknowledge the Fragmentation:** When the majority on the reasoning does not overlap, the opinion should explicitly state: "A majority affirms the result, but on differing grounds."
  *   **Decouple Reasoning from Holding:** Stop trying to write a single narrative that implies a single logic. Allow the "Opinion of the Court" to be limited to the *disposition*, with the reasoning clearly labeled as "Plurality Reasoning."
  *   **Clarify Precedent:** Instruct lower courts that when the "Opinion of the Court" rests on a fragmented majority, only the narrowest common ground is binding.

  Your current system asks the opinion to do two jobs: justify the result (which requires logic) and announce the winner (which requires votes). When those diverge, the opinion lies. The fix isn't to stop voting issue-by-issue; it's to stop pretending the opinion is the voice of a single mind when the votes show it isn't.
