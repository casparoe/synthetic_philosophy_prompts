          *   *Function:* It's an argument by contrast. It highlights the unique human problem: we have reason, but we don't use it collectively *yet*. The "plan" must be found in the *development of capacities* over time, not in individual intent.

      *   **Question 3: Teleology vs. Lawfulness (The Weather Analogy):**
          *   *The Dichotomy:* Kant says without teleology, we have "blind chance."
