          *   *Resolution:* The tables prove *regularity* (it's not random chaos). But regularity in free agents implies a *hidden end* (teleology) rather than just physical cause-and-effect. Kant uses the tables to show it's not chaotic, then uses teleology to explain *why* free agents align.
