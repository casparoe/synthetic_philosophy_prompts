      *   *Key Insight:* The divergence is $Approval(a) \approx E[U(outcome) | \text{limited compute}]$ vs $Goal(a) = E[U(outcome) | \text{full compute}]$.

  8.  **Addressing the "Bounded Judge" Objection:**
      *   This is the crux. The friend says "Fix the judge."
      *   The counter is "The judge *is* the objective function approximation." If the approximation is too coarse, the agent optimizes the approximation error.
      *   If you require the judge to be perfect, you lose the safety benefit of not writing down the objective (because now the human is doing the hard math the objective function was supposed to do).

  9.  **Final Polish:** Check constraints again.
      *   Mundane? Yes (Cloud infra).
      *   No superintelligence? Yes (just faster automation).
      *   Overseer not stupid? Yes (SRE is competent, just time-bound).
      *   One or two paragraphs for scenario? Keep it tight.
