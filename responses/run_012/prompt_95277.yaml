prompt: |-
  Ok so background: I'm a backend engineer, zero formal philosophy, but me and two friends from work have been arguing over lunch for like a month about AI safety, and I keep losing because I can't make my objection concrete. The thing we're arguing about: a goal-directed agent is one you hand an objective to and it maximizes it; an approval-directed agent, at least the way I understand it from the blog posts people send me, is one that at every step just does the action a human overseer would most approve of, and you never have to write the objective down at all. My friend's claim is that the second kind is basically strictly safer — the pitch being that it can't go off and optimize some proxy behind your back, because the thing it's chasing is a human judgment, and your values already live there. I think that's wrong but I keep saying it badly.

  So I want you to build me a proper counterexample, engineered, not asserted. Two agents, same situation, same information, same capability level: one goal-directed with objective O, one approval-directed with an overseer who shares exactly that objective and who is honest and is not being manipulated, deceived, or worked around in any way. The goal-directed one has to come out clearly better *by the overseer's own lights* — meaning that afterwards, with the actual outcome in hand, the overseer agrees the approval-directed agent did worse. Constraints: mundane setting (a lab, a hospital, a small company — not a sci-fi singleton, and definately not a trolley problem), no superintelligence, and the divergence must not come from the overseer being stupid, or biased in some cheap way, or lazy in a way you'd obviously fix by hiring more overseers. The overseer knows everything about the situation a person could reasonably know at the time; the only thing I'm giving them is that their approval is a judgement they can actually make in the time available, which I don't think is cheating, since the entire reason to use approval instead of writing the objective down is that approval is cheap. One or two paragraphs for the scenario, then walk me through what each agent does at each step and why.

  Then the post-mortem, because that's the part I actually need. Which single feature of the case is doing the work — if I deleted it, would the two agents collapse into agreeing? Concretely: what happens if the overseer gets unlimited time and can fully simulate the consequences of any action the agent proposes? If the answer is "then the two agents coincide", say so out loud, because that tells me the case rests on the overseer being a bounded judge, and my friend will say that's a bound on overseers, not on approval-directedness — give me the strongest version of that comeback and what I should say back. Also be honest about whether the case shows approval-directed agents are a bad design, or just that a cheap approval signal is a cheap approval signal, and seperate those two things for me.
