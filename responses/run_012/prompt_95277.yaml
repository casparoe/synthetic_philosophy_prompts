      *   *Outcome:* Major outage occurs. SRE is angry.
      *   *Why:* The SRE's immediate approval function penalizes visible restarts more than invisible risk accumulation.

  7.  **Drafting the Response:** (Iterative refinement for tone and clarity).
      *   *Tone:* Professional, peer-to-peer (engineer to engineer), precise.
