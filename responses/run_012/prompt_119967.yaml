answer: |-
  This is a classic problem in formal epistemology, often called the **"Irrationality Objection"** or the **"Self-Doubt"** problem for the Reflection Principle. Your friend has essentially reconstructed an argument made by David Christensen and others against Bas van Fraassen's original formulation.

  Here is the breakdown of where the argument breaks, how to fix it, and what it costs.

  ### 1. The Seam: Which Step Goes Wrong?

  **The culprit is Premise (1).**

  The logic of the argument is valid. If (1) is true, and (2) and (3) are true, then (4) follows. If (4) and (5) contradict, then (1) must be false. Your intuition that (1) works for the "lab report" case but not the "pill" case is correct, which means (1) is not a universal truth; it is an overgeneralization.

  **Why it looked fine:**
  Premise (1) relies on an implicit, hidden premise: *"Your future self is a reliable updater of evidence."*
  In the "lab report" case, the reason your future credence changes is that you acquire new evidence ($E$). If you know now that you will have $E$ later, and you know how $E$ bears on $A$, Bayesian Conditionalization dictates you should update now. In that specific context, Future You is an **epistemic expert** relative to Present You.

  In the "pill" case, the change in credence is decoupled from the truth of $A$. Future You is no longer an expert; Future You is a victim of a causal mechanism that tracks your brain chemistry, not the world. Premise (1) treats *all* future credences as expert opinions, which is why it "proves too much."

  ### 2. Pricing the Fixes: Can We Save the Principle?

  You asked if there is a version that keeps the lab report and kills the pill without being gerrymandered.

  **The Fix: The "Expertise" Restriction**
  You must restrict the Reflection Principle to apply only when you believe your future self will be **rationally updating on new evidence**.
  *   **Restricted Principle:** If you are certain that at $t'$ your credence in $A$ will be $x$, *and* you are certain that this change is due solely to the acquisition of veridical evidence (no forgetting, no pills, no insanity), then your credence now should be $x$.

  **Is this gerrymandered?**
  It feels like it, but it isn't arbitrary. It rests on the distinction between **information** and **noise**.
  *   **Lab Report:** The change in credence is *correlated with the truth* of $A$.
  *   **Pill:** The change in credence is *independent of the truth* of $A$.

  The "cost" of this fix is that the Reflection Principle loses its status as a fundamental, standalone norm. It becomes a **derivative principle**. It is no longer "Defer to your future self." It becomes "Defer to your future self *insofar as* you expect them to be better informed than you."

  ### 3. The 60% Reliable Hypnotism Case

  This is the most philosophically interesting part of your query. If the hypnotist is 60% reliable, neither 0.2 (current evidence) nor 0.9 (future credence) is correct.

  **What you should actually do:**
  You should treat your future credence as a **piece of evidence** about $A$, weighted by its reliability.
  Let $C_{t'}$ be the proposition "My credence at $t'$ is 0.9."
  You need to calculate $P_t(A | C_{t'})$.

  If the hypnotist is 60% reliable, that means $P(A | \text{Hypnotist says } A) = 0.6$ (roughly speaking, depending on base rates). You shouldn't adopt the 0.9. You should adopt a credence that reflects the *reliability of the process* that generated the 0.9.

  **Did Reflection ever do any work?**
  In light of this, **Simple Reflection (Premise 1) is false.** It was never doing independent work. It was always a special case of **Conditionalization**.
  *   **Conditionalization:** $P_{new}(A) = P_{old}(A | E)$.
  *   **Reflection:** $P_{old}(A) = P_{old}(A | P_{new}(A) = x)$.

  Reflection only holds if $P_{old}(A | P_{new}(A) = x) = x$. This equality holds *only if* you treat your future self as a perfect expert. In the 60% case, you do not. Therefore, the correct principle is **Generalized Reflection** (championed by David Christensen):

  $$ P_t(A | P_{t'}(A) = x) = \text{Your estimate of } A \text{ given that a process with reliability } R \text{ output } x. $$

  In the lab report case, Reliability $\approx$ 1, so Generalized Reflection collapses into Simple Reflection. In the pill case, Reliability $\approx$ 0, so you ignore the future credence. In the hypnotist case, Reliability = 0.6, so you split the difference.

  ### 4. Cost Analysis: Restricting (1) vs. Restricting (5)

  You asked what it costs to keep (1) restricted vs. keeping (5) unrestricted.

  **Option A: Restrict (1) [The Reflection Principle], Keep (5) [Present Evidence] Unrestricted.**
  *   **The View:** "I should always follow my current evidence. I should only defer to my future self if I have evidence that they are reliable."
  *   **The Cost:** You lose the elegant idea that "Temporal Consistency" is a fundamental rational requirement. You admit that rationality is fragmented: sometimes you defer to Future You, sometimes you don't. It makes planning harder (you can't simply assume you'll believe the truth later).
  *   **Verdict:** **This is the correct choice.** This is the standard Bayesian position.

  **Option B: Keep (1) Unrestricted, Restrict (5) [Present Evidence].**
  *   **The View:** "I must always align with my future credence. If I know I'll be drugged to believe 0.9, I must believe 0.9 now, even if my evidence says 0.2."
  *   **The Cost:** **Epistemic Suicide.** This requires you to violate the Principal Principle and ignore your current evidence. It makes you vulnerable to Dutch Books (sure-loss betting strategies) *right now*. It implies that truth-tracking is less important than temporal consistency.
  *   **Verdict:** **Unacceptable.** No serious epistemologist accepts this.

  ### Summary for Your Reading Group

  1.  **Your friend is right:** The Simple Reflection Principle (Premise 1) is false because it fails in "pill cases."
  2.  **The Seam:** The principle conflates "future credence" with "future credence based on evidence."
  3.  **The Fix:** Replace Simple Reflection with **Generalized Reflection**. You defer to your future self only to the degree that you trust the *process* that will generate their beliefs.
  4.  **The Status of RP:** It is not a fundamental law. It is a corollary of Conditionalization that applies only when you expect your future self to be better informed and rational.
  5.  **The 60% Case:** This proves RP is just about reliability. If the channel is noisy, you conditionalize on the noise. You don't adopt the output.

  Tell your friend she has successfully killed the *strong* Reflection Principle, but she hasn't killed the intuition behind it. The intuition survives as a requirement to treat your future rational self as an expert, but it dissolves when that expertise is compromised.
