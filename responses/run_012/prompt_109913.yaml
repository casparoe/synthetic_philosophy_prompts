prompt: |-
  I'm in a reading group on philosophy of AI and we just finished Quine's essay 'On the Nature of Moral Values'—the one where he discusses whether moral values are objective and how they relate to science and social custom. Someone in the group said this means Quine would have been totally chill with how AI labs currently handle value alignment: if there's no objective moral truth, then there's no 'correct' set of values to give an AI, so companies can just pick whatever values they want (within legal limits) and that's that.

  But I think thats too quick. Quine's naturalism seems like it would push him to say something more nuanced—maybe that the question of what values to give an AI is an empirical/social question, but not an arbitrary one, because it's constrained by facts about human psychology and social coordination. Anyway, we got into a big argument about what Quine would have actually thought about RLHF and the alignment problem if he'd lived to see it. Could you lay out what you think his position would have been? Specifically: if Quine were advising an AI lab today, what would he say about the project of specifying the 'correct' values for a model? Would he think there's a fact of the matter, or would he think it's just a matter of social choice? And how would his views on the indeterminacy of translation and the analytic-synthetic distinction play into this? I'm especially interested in whether he'd see the alignment problem as a scientific problem, a political problem, or something else entirely.
