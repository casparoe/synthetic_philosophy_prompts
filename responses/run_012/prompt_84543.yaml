answer: |-
  You have a very sharp eye for the mechanics of moral sentiment. You are not mashing things together; you have identified a specific failure mode of aesthetic empathy that has troubled philosophers and artists for centuries.

  To answer your first question: there is no single, universally recognised noun in the English language that captures this *exact* mechanism (the supply of a verdict satisfying the urge to act). However, you are quite right about Rousseau. You are also standing in the shadow of Bertolt Brecht and Susan Sontag.

  Here is the exact carving of the concept, the existing lineage, and a proposed term for the specific phenomenon you describe.

  ### 1. The Historical Precedent: Rousseau's Pity
  Your memory is precise. In his *Letter to d'Alembert on Spectacles* (1758), Jean-Jacques Rousseau argues precisely against the idea that theatre makes us more virtuous. He suggests the opposite: that the theatre allows us to discharge our pity in a safe, contained environment, leaving us with no obligation to act in the real world.

  His famous formulation is:
  > *"In giving our tears to these fictions, we have satisfied all the rights of humanity without having to give anything more of ourselves."*

  Rousseau argues that the spectator, having wept for the tragic hero, returns home "pleased with oneself," having fulfilled one's moral duty through the act of feeling. This is the grandfather of your observation. However, Rousseau focuses on the *pride* of the spectator. Your insight is more structural: you note that the artwork provides a **verdict**, whereas reality provides only a **problem**.

  ### 2. The Artistic Counter-Measure: Brecht
  If Rousseau identified the disease, Bertolt Brecht attempted to engineer the cure. Brecht hated exactly what you describe. He called it "culinary theatre" — art that is consumed digested, and excreted, leaving the audience full and sleepy.

  He developed the *Verfremdungseffekt* (alienation effect) specifically to prevent the audience from reaching the state you describe. He did not want the audience to feel a "complete object" of emotion. He wanted the emotion to remain jagged, unresolved, and irritating, so that the spectator would leave the theatre feeling that the injustice was *not* condemned by the universe of the play, but rather awaited *their* condemnation in the street.

  ### 3. Why the Existing Terms Fail
  You are correct to reject the standard vocabulary. Here is why they do not fit:

  *   **Catharsis:** As you noted, this is hydraulic. It implies a purging of emotion to restore equilibrium. Your phenomenon is not a purging; it is a **settlement**. The emotion is not expelled; it is *satisfied*. It finds a home in the narrative structure and stays there.
  *   **Moral Licensing:** This requires a transaction: "I have done X good thing, therefore I am permitted to do Y bad thing." Your friend did not do a good thing; she merely *felt* a feeling. The licensing here is not based on action, but on **witnessing**.
  *   **Slacktivism:** This refers to low-effort *actions* (signing a petition, liking a post). Your phenomenon is entirely internal. It is **passive completion**.

  ### 4. A Coinage: "Aesthetic Absolution"
  Since no existing term captures the "verdict" mechanism you identified, I propose we call this **Aesthetic Absolution**.

  **Definition:** *Aesthetic Absolution* occurs when a cultural representation of suffering supplies not only the stimulus for moral outrage but also the narrative resolution (the verdict), thereby allowing the audience to feel that the moral debt has been paid through the act of witnessing alone.

  **Why this fits:**
  *   **Absolution:** Implies a forgiveness of debt. The viewer feels they have "done right" by the victim simply by acknowledging the wrong within the confines of the art.
  *   **Aesthetic:** Locates the mechanism in the structure of the artwork (the narrative arc, the director's framing), not just the viewer's psychology.

  ### 5. The Boundaries and Edge Cases
  To carve this properly, we must define where *Aesthetic Absolution* begins and ends, based on your "complete object" theory.

  **Boundary 1: The Necessity of the Verdict**
  For *Aesthetic Absolution* to occur, the artwork must implicitly or explicitly condemn the wrong.
  *   *Case:* A film about slavery where the hero escapes and the villain is punished.
      *   *Result:* High Aesthetic Absolution. The moral universe is balanced by the credits roll.
  *   *Case:* A film about slavery that ends ambiguously, or where the system remains intact despite individual struggle (e.g., *The Wire* or certain Ken Loach films).
      *   *Result:* Low Aesthetic Absolution. The emotion remains "open and unspent," increasing the likelihood of real-world action.

  **Boundary 2: Representation vs. Reality**
  You asked if witnessing a real wrong in person would do it. Generally, no.
  *   *Real Life:* If you witness a mugging, the "object" is incomplete. There is no director to tell you this was wrong, no third act to resolve it. The emotional tension demands a physical resolution (calling police, intervening).
  *   *Representation:* The frame of the screen or page creates a hermetic seal. The "verdict" is supplied by the authorial voice.
  *   *Exception:* Highly curated real-world experiences, such as a museum exhibit or a memorial. If the exhibit guides you too neatly towards a feeling of "never again," it can trigger *Aesthetic Absolution* even in a physical space. You leave feeling you have honoured the dead, and thus need do no more.

  **Boundary 3: The "Dry News" Contrast**
  Your intuition about the news item is crucial. A dry report lacks narrative closure. It presents a *premise* (suffering exists) without a *conclusion* (justice is served). This creates what psychologists call **cognitive dissonance** or **moral distress**. The brain seeks to resolve the tension. Since the art didn't resolve it, the viewer must resolve it through action. *Aesthetic Absolution* prevents this dissonance from forming in the first place.

  ### 6. Summary
  You have identified a specific subset of **Moral Sentimentalism**. It is not hypocrisy, because the emotion is genuine. It is not apathy, because the engagement is deep. It is a structural trick of narrative.

  *   **What it is:** The satisfaction of a moral urge through the consumption of a pre-resolved narrative.
  *   **What it isn't:** Catharsis (purging), Moral Licensing (transactional), or Desensitisation (numbing).
  *   **The Name:** **Aesthetic Absolution**.
  *   **The Condition:** Requires a "complete object" — a wrong that is presented as already condemned by the work itself.

  Your friend did not stop caring about chickens; she simply paid her emotional tithe to the documentary. The ledger was balanced. By naming it, you might find that the next time you finish that novel, you can recognise the feeling of absolution for what it is: a receipt for a transaction that never actually took place.
