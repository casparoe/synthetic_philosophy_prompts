answer: |-
  **Activity: The Logical Mirror**

  **Materials:** Paper slips, pens, two hats, whiteboard.
  **Setup:** Split the club into Team Alpha and Team Beta. Separate them (corridor vs. classroom). No communication allowed.
  **Instructions:** "You are paired with the other team. You cannot influence them causally. However, we have constructed these teams to share identical reasoning processes. If you decide X, evidence suggests they decide X. Choose 'Cooperate' or 'Defect' unanimously."
  **Payoff:** (Write on board)
  *   Both Cooperate: 10 points each.
  *   Both Defect: 2 points each.
  *   Mismatch: Defector 15, Cooperator 0.
  **Execution:** Give 5 minutes. Require secret internal ballots before announcing the unanimous team choice. Collect slips. Reveal choices. Award points (toward a pizza fund).

  **Debrief:**
  Ask cooperators: "You couldn't talk to them. Why cooperate?" They'll likely say, "I figured if we did, they would too."
  Reveal the theory: "You just practiced Evidential Cooperation in Large Worlds (ECL). You couldn't *cause* their choice. But your decision was *evidence* of theirs because you share a decision procedure. In a vast universe, there are agents identical to you. You can't meet them. But if you cooperate, it's evidence they do too. By cooperating, you 'acausally trade' with them, maximizing total value across the cosmos."
  Map it: The other team = distant agents. The 'shared reasoning' = shared physics/logic. Your choice wasn't a cause; it was a signal.

  **Predictable Failures:**
  1.  **Skepticism:** "They aren't really twins." *Fix:* Admit it's a model, but insist they play *as if* the correlation holds.
  2.  **Causal Dominance:** Some will say, "Whatever they do, I'm better off defecting." This is Causal Decision Theory (CDT). Acknowledge this is the rival view; ECL argues CDT ignores the evidential link.
  3.  **Dictators:** One loud voice dictates the team choice. *Fix:* Enforce secret internal ballots first.

  **Limitations:**
  The game guarantees symmetry (I told you they are twins). Real ECL is probabilistic—you only *suspect* correlation based on physics and psychology. Also, the game is one-shot; ECL often relies on iterative reasoning about decision algorithms. You must clarify that in reality, we don't *know* the correlation strength; we estimate it. The game simplifies the "large world" into a single mirror, missing the scale of infinite agents.
