prompt: |-
  I run research ethics review for a mid-sized hospital-affiliated research institute -- about a dozen new studies a month, mostly surveys, biobank stuff, a few behavioral experiments, one or two that touch on mental health. Our legal checklist is fine and I can do it half asleep. The problem is the forms that pass the checklist and still aren't real consent: everything disclosed, signature on the line, and I know perfectly well the person didn't actually agree to anything. I want a decision procedure for that gap. I have to be able to run it in about thirty minutes per study, my coordinator has to be able to run it too, and it has to end in one of approve / send back with specific fixes / escalate, where escalate means the compliance director decides, and she signs off and also has no philosophy background.

  Ground it in what the philosophy of consent actually says, but I've been reading around and there's a few distinctions I want the procedure to keep, because I think they're the ones doing the work: the difference between consent as a state of mind and consent as a signed act (a form can be perfect and the agreement absent); the difference between consent and mere compliance, where someone goes along because saying no is awkward or costly, not because they agreed; consent that's valid but fragile, meaning it survives everything we told them but would collapse if they learned one more fact; and the idea that how much someone needs to understand is set by what's at stake in that particular decision, not by a fixed bar of competence that you either clear or don't. I also want the threat/offer distinction kept separate -- coercion and an offer so good it distorts judgment feel like different failures to me and I don't want them crushed into one box called undue influence.

  What I need from you: the questions in the order I should ask them, what counts as a good enough answer to each, where the procedure stops with a no, where it stops with a yes, and where it has to hand the decision to a person because the question is about values and not facts. My guess is that how much risk it's fair to ask someone to accept for free is one of those, and whether broad consent to unspecified future research is consent at all is another, but tell me if I'm wrong about either. Flag which steps are judgment calls wearing a procedure's clothing, and say what to do when I cant get a clean answer on a step -- I need to know whether a missing answer should count against the study or be marked unknown and passed up.

  Then run it on three, showing your work at each step:

  1. A biobank asking for broad consent to future research nobody has designed yet, form says we may share de-identified samples with academic and commercial partners, no end date.
  2. A wellness study inside a company where the person recruiting participants is their direct manager, and participants get $500, which for some of them is a weeks groceries.
  3. A behavioral study that tells people it's about memory and mood when it's actually about stereotype threat, with a debrief at the end.

  At least one of those should come out in a way I won't like. I'd rather you be right than agreeable about it. And close by telling me what this procedure can't do and what I should stop expecting it to do, because I suspect I'm asking consent review to carry weight it can't carry.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Research ethics review administrator at a mid-sized hospital-affiliated institute.
      *   **Context:** ~12 studies/month (surveys, biobank, behavioral, some mental health). Legal checklist is easy; the problem is *real* consent vs. *formal* consent.
      *   **Goal:** A decision procedure to bridge the gap between "signed form" and "actual agreement."
      *   **Constraints:**
          *   Time: ~30 mins per study.
          *   Usability: Coordinator must be able to run it (no philosophy background required for execution, though grounded in philosophy).
          *   Outcomes: Approve / Send Back (specific fixes) / Escalate (Compliance Director).
          *   Philosophical Distinctions to Preserve:
              *   State of mind vs. Signed act.
              *   Consent vs. Compliance (awkwardness/cost).
              *   Valid but Fragile consent (would collapse with one more fact).
              *   Variable understanding threshold (stakes-dependent).
              *   Threat vs. Offer (Coercion vs. Distorting Inducement) - keep separate.
          *   Specific Instructions: Order of questions, pass/fail criteria, escalation points, flagging judgment calls, handling missing info.
          *   Task: Run the procedure on three specific cases (Biobank, Workplace/Manager, Deception Study).
          *   Closing: Limitations of the procedure (what it can't do).
      *   **Tone:** Professional, pragmatic, philosophically grounded but operational, willing to deliver uncomfortable truths ("I'd rather you be right than agreeable").

  2.  **Deconstruct the Philosophical Grounding:**

      *   *Consent as State of Mind vs. Act:* Faden & Beauchamp (Authorization). The form is evidence, not the thing itself.
      *   *Consent vs. Compliance:* Voluntariness. Power dynamics, social pressure.
      *   *Fragile Consent:* Disclosure adequacy. Not just what *is* said, but what *might* matter to a reasonable person (or this specific person).
      *   *Variable Understanding:* Risk-relative competence. Higher risk = higher understanding bar.
      *   *Threat vs. Offer:* Coercion (baseline worsening) vs. Undue Inducement (baseline improving but distorting). The prompt wants these distinct.

  3.  **Drafting the Decision Procedure (The "Consent Integrity Protocol"):**

      *   *Structure:* Needs to be a flowchart logic but written as steps.
      *   *Time Limit:* 30 mins means max 5-7 core questions.
      *   *Escalation:* Needs clear triggers for the Compliance Director (values/policy decisions).
      *   *Missing Info:* Default to "Send Back" unless it's a policy question (Escalate).

      *   *Step 1: The Stakes & Understanding Bar.* (Variable competence). Determine risk level. Sets the bar for Step 2.
      *   *Step 2: The Disclosure Gap.* (Fragile Consent). Is there a "dealbreaker fact" omitted or buried?
      *   *Step 3: The Voluntariness Check (Threats).* (Coercion). Is the baseline being worsened if they say no?
      *   *Step 4: The Voluntariness Check (Offers).* (Distorting Inducement). Is the benefit so high it blinds them to risk? (Distinct from Step 3).
      *   *Step 5: The Compliance vs. Consent Check.* (Social/Structural Pressure). Is saying "no" socially costly? (Manager relationship, etc.).
      *   *Step 6: The Authorization Check.* (State of Mind). Does the process allow for actual refusal/withdrawal without friction?

      *   *Refining the Escalation Points:*
          *   Broad consent (Biobank) is often a policy/value judgment, not just facts. -> Escalate.
          *   High inducement relative to risk -> Judgment call.
          *   Deception -> Usually needs specific justification, often Escalate if mental health is involved.

  4.  **Developing the Criteria for Answers:**

      *   *Yes:* Clear evidence in protocol/forms.
      *   *No:* Evidence of failure. -> Send Back.
      *   *Unknown/Missing:* Send Back (burden on researcher).
      *   *Value Judgment:* Escalate.

  5.  **Running the Cases:**

      *   *Case 1: Biobank (Broad Consent).*
          *   Stakes: Low physical, High privacy/future use.
          *   Disclosure: "Commercial partners" is key.
          *   Voluntariness: Usually low pressure.
          *   *Problem:* Broad consent for unspecified future use is the definition of "Fragile" or "Non-existent" consent philosophically. It's a policy waiver.
          *   *Verdict:* Escalate (Policy decision on broad consent).
      *   *Case 2: Workplace/Manager ($500).*
          *   Stakes: Low/Med (Wellness).
          *   Threat: Implicit (Manager). Saying no might hurt career.
          *   Offer: $500 is significant for some (distorting).
          *   *Problem:* Manager recruiting direct reports is a structural coercion risk. $500 adds inducement risk.
          *   *Verdict:* Send Back (Remove manager role) OR Escalate (if inducement is deemed unethical). Let's make it a "Send Back" on structure, but flag the money for Escalation if the risk were higher. Actually, the prompt asks for one outcome I won't like. The "Manager" issue is a classic "Compliance not Consent" trap. I should recommend *Send Back* to remove the manager, but if they can't, it's a *No/Escalate*. Let's go with *Send Back* with specific fixes (independent recruiter), but note the money is risky.
          *   *Wait, re-reading prompt:* "At least one of those should come out in a way I won't like."
          *   *Idea:* The Biobank one is standard practice but philosophically shaky. If I say "Escalate/No" on Broad Consent, that might be annoying but accurate. The Workplace one is clearly problematic. The Deception one is standard IRB fare.
          *   *Better "Uncomfortable" Outcome:* The Biobank. Most IRBs approve broad consent routinely. A strict philosophical reading says "You can't consent to the unknown." I will recommend *Escalate* with a strong note that this is a policy waiver, not true consent.
          *   *Actually, let's look at the Workplace one.* $500 + Manager. This is high risk for coercion. If I say "Approve with tweaks," that's weak. If I say "Reject," that's hard. Let's make the Biobank the "Escalate" (because it's a policy value) and the Workplace one the "Send Back" (because it's fixable).
          *   *Wait, the "Uncomfortable" one:* Maybe the Deception study. If the stereotype threat is heavy, debriefing might not fix the harm. If I say "Send Back/Escalate" on a standard psych protocol, that might be the friction point.
          *   *Decision:* I will flag the Biobank as "Escalate" because broad consent is a *waiver* of consent elements, which is a value judgment. I will flag the Workplace study as "Send Back" (fix the recruiter). I will flag the Deception study as "Approve" *only if* the debrief is robust, but I'll add a caveat that might sting: if the stereotype threat causes lasting distress, consent was impossible *ex ante*. Let's make the Biobank the hard truth: "This isn't consent, it's a policy waiver."

      *   *Case 3: Deception (Stereotype Threat).*
          *   Stakes: Psychological.
          *   Disclosure: Intentionally flawed.
          *   *Problem:* You can't consent to what you don't know. Deception waives consent.
          *   *Verdict:* Escalate (Requires justification of scientific necessity vs. harm).

      *   *Refining the "Uncomfortable" outcome:* The prompt says "At least one of those should come out in a way I won't like."
      *   *Hypothesis:* The user probably approves Biobanks routinely. Telling them "This procedure flags Broad Consent as an Escalation/Value Call, not a standard Approve" might be the friction. Or, telling them the Workplace study cannot be fixed easily and needs Escalation.
      *   *Let's go harder:* The Workplace study. $500 + Manager. This is ethically toxic. Standard IRBs might approve it with a "voluntary" disclaimer. My procedure should flag this as *Coercive Environment*. I will recommend *Escalate* or *Send Back* with a fix that is likely impossible (independent recruiter). Let's say *Escalate* because the power dynamic is structural.
      *   *Actually, the Biobank is the strongest philosophical challenge.* "Consent to the unknown" is an oxymoron. I will call that out.

  6.  **Refining the Procedure Steps (Iterative Draft):**

      *   *Step 1: Risk-Stakes Calibration.* (Sets the bar).
      *   *Step 2: The "Dealbreaker" Test.* (Fragile Consent). What fact would make them walk away? Is it hidden?
      *   *Step 3: The Baseline Test (Threats).* Does saying "no" make them worse off? (Coercion).
      *   *Step 4: The Distortion Test (Offers).* Is the benefit so large it blinds risk assessment? (Undue Inducement - distinct from Step 3).
      *   *Step 5: The Social Cost Test (Compliance).* Is "no" awkward? (Manager, Doctor/Patient).
      *   *Step 6: The Authorization Mechanism.* Can they actually stop? (Withdrawal).

      *   *Handling "Missing":* If info is missing on Risk or Dealbreakers -> Send Back. If info is missing on Values (e.g., is this benefit *too* high?) -> Escalate.

  7.  **Finalizing the Output Structure:**

      *   Introduction: Acknowledge the gap (Form vs. Mind).
      *   The Procedure (C.I.P. - Consent Integrity Protocol).
      *   The Three Cases (Applied).
      *   The Limitations (What this can't fix).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I separate Threat and Offer? Yes, Steps 3 and 4.
      *   *Check:* Did I handle "Fragile Consent"? Yes, Step 2 (Dealbreaker).
      *   *Check:* Did I handle "Variable Understanding"? Yes, Step 1 (Risk-Stakes).
      *   *Check:* Time limit? Keep questions sharp.
      *   *Check:* "Uncomfortable truth." I need to ensure I don't just rubber stamp the Biobank. Broad consent is philosophically contentious. I will mark it as Escalate.
      *   *Check:* "Missing Answer." If the protocol doesn't say who recruits, that's a "Send Back." If the protocol doesn't define "commercial use," that's a "Send Back."

      *(Self-Correction on the "Uncomfortable" outcome)*: The prompt implies *I* (the AI) should give an outcome the *User* won't like. The User runs the IRB. They probably approve biobanks. If I say "Biobank = Escalate/Questionable Consent," that challenges their workflow. I will do that.
      *Also*, the Workplace study. $500 is a lot for "some." If the user approves this routinely, telling them "This is Coercive/Compliance, not Consent" is the uncomfortable truth. I'll make the Workplace study the "Send Back/Escalate" because the Manager dynamic makes true consent nearly impossible regardless of the form.

      *Wait, one more thing:* The prompt asks "tell me if I'm wrong about either" regarding (1) risk/fairness and (2) broad consent.
      *   *Risk/Fairness:* You are right. Risk sets the bar.
      *   *Broad Consent:* You are right to be suspicious. Philosophically, you cannot authorize the unknown. It is a *waiver* of consent requirements justified by social value, not consent itself. I need to be clear on this.

      *Let's finalize the Procedure Steps.*
      1.  **Stakes & Bar:** What is the max risk? Sets understanding requirement.
      2.  **The Hidden Dealbreaker:** Is there a fact (e.g., commercial profit, specific sensitive topic) that, if known, would cause refusal? (Fragility).
      3.  **The Threat (Coercion):** Does refusal worsen their current status (care, job, grades)?
      4.  **The Offer (Distortion):** Is the payment/benefit disproportionate to the burden *for this population*?
      5.  **The Social Cost (Compliance):** Is the relationship hierarchical (Doctor/Patient, Manager/Employee)?
      6.  **The Exit:** Is withdrawal frictionless?

      *Escalation Triggers:*
      *   Broad consent for unspecified future use (Value judgment).
      *   High inducement + Vulnerable pop (Value judgment).
      *   Deception involving sensitive topics (mental health) (Value judgment on harm).

      *Missing Info:* Send Back. Don't guess.

      *Let's write it.*
answer: |-
  This is the **Consent Integrity Protocol (CIP)**. It is designed to operationalize the philosophical distinctions you listed without requiring your coordinator to read Faden & Beauchamp. It treats consent as a *process of authorization* rather than a *document of liability*.

  It consists of six sequential gates. Time budget: 5 minutes per gate.

  ### The Procedure

  **Pre-Step: The Missing Info Rule**
  *   **Rule:** If the protocol or form does not contain the information needed to answer a gate, do not guess.
  *   **Action:** **Send Back.** The researcher must supply the fact. You cannot review what is not disclosed.
  *   **Exception:** If the missing information is a *policy value* (e.g., "Is this level of payment acceptable?"), **Escalate**.

  ---

  **Gate 1: The Stakes & Understanding Bar**
  *   **Question:** What is the maximum foreseeable risk (physical, psychological, privacy, economic) to the participant?
  *   **Philosophical Ground:** Risk-relative competence. Understanding requirements scale with stakes.
  *   **Pass:** The complexity of the consent form and the verification of understanding (quiz, teach-back, discussion) match the risk level. (Low risk survey = simple form; High risk biobank = detailed discussion).
  *   **Fail:** High risk paired with a "click-through" or minimal disclosure.
  *   **Action:** Fail = **Send Back** (Increase understanding verification).

  **Gate 2: The Fragility Test (The "Dealbreaker" Fact)**
  *   **Question:** Is there a fact about the study (e.g., commercial profit, genetic testing, specific sensitive topics) that is omitted, buried, or vague, which a reasonable person might consider a dealbreaker?
  *   **Philosophical Ground:** Valid but Fragile Consent. Consent collapses if a material fact is withheld.
  *   **Pass:** All "material facts" are explicit. (e.g., "Commercial partners" is defined or the *possibility* of profit is explicit).
  *   **Fail:** Vague language like "future research" without boundaries, or hiding commercial interest.
  *   **Action:** Fail = **Send Back** (Specific fix: Disclose the fact).

  **Gate 3: The Threat Test (Coercion)**
  *   **Question:** If the participant says "No," does their baseline situation worsen? (Loss of care, grade penalty, job scrutiny).
  *   **Philosophical Ground:** Coercion is a threat that constrains choice by worsening the baseline.
  *   **Pass:** Refusal has zero consequence on standard care, employment, or standing.
  *   **Fail:** Refusal implies loss of benefit they are otherwise entitled to, or fear of retribution.
  *   **Action:** Fail = **Escalate** (This is often structural and requires policy intervention).

  **Gate 4: The Offer Test (Distorting Inducement)**
  *   **Question:** Is the benefit (payment, access) so large relative to the participant's economic context that it might blind them to the risks identified in Gate 1?
  *   **Philosophical Ground:** Undue Inducement (distinct from coercion). An offer that distorts judgment, not by threat, but by overwhelming attraction.
  *   **Pass:** Payment is commensurate with time/burden (e.g., hourly wage equivalent).
  *   **Fail:** Payment is "life-changing" or covers essential needs (rent/food) for the target population, creating pressure to ignore risk.
  *   **Action:** Fail = **Escalate** (This is a value judgment on exploitation).

  **Gate 5: The Compliance Test (Social/Relational Pressure)**
  *   **Question:** Is the recruiter in a position of authority over the participant (Manager, Doctor, Professor)?
  *   **Philosophical Ground:** Consent vs. Compliance. Saying "no" to a boss feels costly even if formally costless.
  *   **Pass:** Recruiter is independent, or there is a robust firewall (e.g., third-party consent taker).
  *   **Fail:** Direct supervisor or treating clinician recruits their own subordinates/patients.
  *   **Action:** Fail = **Send Back** (Require independent recruiter). If impossible = **Escalate**.

  **Gate 6: The Authorization Check (Exit Friction)**
  *   **Question:** Can the participant withdraw easily, without penalty, and without having to ask permission?
  *   **Philosophical Ground:** Consent as an ongoing state of mind, revocable at will.
  *   **Pass:** "Withdraw anytime, no questions asked" is explicit and operationally true.
  *   **Fail:** Withdrawal requires forms, meetings, or implies data loss that harms the participant.
  *   **Action:** Fail = **Send Back**.

  ---

  ### Escalation Triggers (The Compliance Director's Queue)
  *   **Value Judgments:** Gate 3 (Structural Coercion), Gate 4 (Exploitative Offers).
  *   **Policy Waivers:** Broad consent for unspecified future use (Biobanks).
  *   **Harm Assessment:** Deception studies involving mental health vulnerabilities.

  ---

  ### Application to Your Three Cases

  #### Case 1: The Biobank (Broad Consent, Commercial Partners, No End Date)
  *   **Gate 1 (Stakes):** Low physical risk, High privacy/future use risk. *Pass* (assuming form is complex enough).
  *   **Gate 2 (Fragility):** "Future research nobody has designed yet" + "Commercial partners."
      *   *Analysis:* A participant might agree to medical research but object to cosmetic testing or patenting of their cell line. This is the definition of **Fragile Consent**. They are agreeing to a *category*, not an *act*.
      *   *Result:* **Fail.** The form discloses the *possibility*, but the scope is too wide for specific authorization.
  *   **Gate 3-5:** No threats, no offers, no hierarchy. *Pass.*
  *   **Gate 6:** Withdrawal usually possible but samples may already be used. *Pass* (standard limitation).
  *   **Decision:** **ESCALATE.**
  *   **Reasoning:** You asked if broad consent is consent at all. Philosophically, it is not. It is a **waiver of the requirement for specific consent**, justified by social utility. Your coordinator cannot approve this as "Consent." The Compliance Director must decide if the *policy* of broad consent overrides the *philosophical deficit* of specific authorization.
  *   **Fix:** None. This is a policy call.

  #### Case 2: The Wellness Study (Manager Recruiting, $500)
  *   **Gate 1 (Stakes):** Low/Med (Wellness). *Pass.*
  *   **Gate 2 (Fragility):** *Pass.*
  *   **Gate 3 (Threat):** Manager recruiting direct reports.
      *   *Analysis:* Even if the form says "Voluntary," saying "no" to a boss carries implicit career risk. This is structural **Coercion**.
      *   *Result:* **Fail.**
  *   **Gate 4 (Offer):** $500 is "a week's groceries" for *some*.
      *   *Analysis:* For the financially vulnerable employees, this is not payment; it is necessity. This creates **Distorting Inducement**. They may ignore risks to get the groceries.
      *   *Result:* **Fail.**
  *   **Gate 5 (Compliance):** Direct Manager.
      *   *Analysis:* This is the definition of Compliance, not Consent.
      *   *Result:* **Fail.**
  *   **Decision:** **SEND BACK** (with a likely path to **ESCALATE**).
  *   **Specific Fixes:** 1. Recruiter must be HR or Third Party, not the Manager. 2. Payment must be justified as time-compensation, not need-relief.
  *   **The Uncomfortable Truth:** If the company cannot provide an independent recruiter, this study **cannot ethically proceed** under a consent model. It is a workplace mandate disguised as research. If they cannot fix the recruiter issue, you must **ESCALATE** for a likely rejection.

  #### Case 3: The Deception Study (Stereotype Threat, Debrief)
  *   **Gate 1 (Stakes):** Psychological risk (Stereotype threat can cause lasting distress/anxiety).
      *   *Analysis:* Understanding bar must be high regarding *rights*, even if *purpose* is hidden.
      *   *Result:* **Pass** (assuming debrief explains rights clearly).
  *   **Gate 2 (Fragility):** The core purpose is hidden.
      *   *Analysis:* By definition, they cannot consent to the specific risk (stereotype threat) *ex ante*.
      *   *Result:* **Fail** (Inherent to deception).
  *   **Gate 3-5:** No threats/offers/hierarchy mentioned. *Pass.*
  *   **Gate 6:** Debrief must allow for data withdrawal *after* truth is revealed.
      *   *Analysis:* If they hear the truth and feel violated, can they pull their data?
      *   *Result:* **Check Protocol.**
  *   **Decision:** **ESCALATE.**
  *   **Reasoning:** Deception waives Gate 2. You cannot approve this on a standard checklist. The Compliance Director must weigh the *scientific value* against the *violation of autonomy*. Furthermore, because it touches mental health (stereotype threat), the debrief must be clinical-grade, not just a paragraph. If the debrief is weak, this is **Send Back**. If the debrief is strong, it is still an **Escalate** because you are authorizing a temporary suspension of consent.

  ---

  ### What You Are Wrong About (And Right About)

  **1. "How much risk it's fair to ask someone to accept for free is a value judgment."**
  *   **You are Right.** This is Gate 4. There is no factual metric for "too much money." It depends on the vulnerability of the population. That is why it Escalates.

  **2. "Whether broad consent to unspecified future research is consent at all."**
  *   **You are Right to be suspicious.** Philosophically, you cannot authorize an unknown act. Broad consent is a *legal fiction* that functions as a waiver. My procedure flags this as an **Escalate** precisely because it is not "Consent" in the strict sense your checklist is trying to capture. Do not let your coordinator "Approve" this as standard consent. It requires a policy waiver decision.

  ### Limitations: What This Procedure Cannot Do

  1.  **It Cannot Fix Power Imbalances:** In Case 2 (Manager), if the company is small and *only* the manager can recruit, this procedure will force an Escalate/Reject. It cannot make a coercive environment consensual. You must stop expecting review to sanitize structural coercion.
  2.  **It Cannot Predict Psychological Harm:** In Case 3 (Stereotype Threat), you are relying on the researcher's debrief plan. You cannot know *ex ante* if a participant will be traumatized. This procedure minimizes the risk, but it cannot eliminate the moral residue of deception.
  3.  **It Cannot Create Understanding:** Gate 1 checks for the *opportunity* to understand. It cannot guarantee the participant actually processed the info. You are reviewing the *process*, not the *mind*.
  4.  **It Shifts the Burden:** This procedure will increase your "Send Back" and "Escalate" rates. It will slow down the "dozen studies a month." You are trading efficiency for integrity. If your institute demands speed over integrity, this procedure will break.

  **Final Advice:** The "Uncomfortable" outcome is Case 1. You likely approve biobanks routinely. This procedure says: *"Stop calling it consent. Call it a waiver, and have the Director sign off on the policy exception."* That distinction matters when a participant sues because their cells were used for something they morally oppose. A signed form says "They agreed." The truth is "You decided for them." Know the difference.
