answer: |-
  **Verdict and Rule**
  My best guess is that your supervisor will rule this **not a convention**. The rule she is running is likely **Lewisian Orthodoxy**: a convention is an arbitrary regularity in behavior, sustained by common knowledge and mutual expectations, that solves a recurrent coordination problem (where agents prefer to conform conditional on others conforming).

  **Competing Rules**
  The log fits Lewisian Orthodoxy perfectly: cases 1–4 are classic coordination solutions (driving, language, money, queuing); cases 5–6 fail the sociality/recurrence conditions. However, the log also fits a **Normative Regularity** rule: a convention is an arbitrary regularity sustained by mutual expectations and normative sanctions (disapproval of deviators), regardless of coordination payoffs. This rule also classifies 1–4 as conventions (all involve sanctions/expectations) and 5–6 as non-conventions (private habits lack expectations; one-offs lack stability).

  **Predictions on the New Case**
  *   **Lewisian Orthodoxy:** Predicts **Not a Convention**. The case explicitly lacks a coordination problem (no conditional preferences) and lacks technical common knowledge. It is merely a norm or custom.
  *   **Normative Regularity:** Predicts **Convention**. The case features arbitrariness, stability, mutual expectation, and normative sanction (thinking less of non-compliers). The absence of a coordination problem is irrelevant.

  **The Bet**
  I would bet on **Lewisian Orthodoxy**. Your supervisor is described as "squarely in the Lewisian tradition." Lewis's specific philosophical innovation was distinguishing conventions from mere regularities or norms by tying them to *coordination problems*. If she accepted normative sanctions without coordination, she would be closer to Ullmann-Margalit or Brennan than to Lewis. The fact that your log lacks a "no-coordination" case suggests this is the precise boundary she has yet to test, implying it is the critical condition. Furthermore, Lewisians typically treat common knowledge as essential; the new case's lack of higher-order expectations provides a second, independent reason for her to reject it.

  **Discriminating Case**
  To cleanly separate these rules, present a case that **solves a coordination problem but lacks normative sanction**.

  *The Case:* In a crowded museum gallery, visitors spontaneously begin walking clockwise to avoid bumping into one another. They expect others to do so and conform accordingly (solving a coordination problem). However, if someone walks counter-clockwise, others merely adjust their path to avoid collision; they feel no irritation, think no less of the deviator, and impose no social sanction. The regularity is arbitrary (counter-clockwise would have worked) and stable.

  *   **Lewisian Orthodoxy:** Verdict **Convention**. The coordination problem, arbitrariness, and mutual expectations are present. Sanctions are not required.
  *   **Normative Regularity:** Verdict **Not a Convention**. Without normative sanction or disapproval of deviators, it is merely a causal regularity or equilibrium, not a normative convention.

  This case isolates the *coordination problem* from the *normative sanction*, forcing a choice between the two definitions.
