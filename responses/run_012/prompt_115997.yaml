answer: |-
  It seems to me that you have conflated the method by which we discover intrinsic value with the condition required for its existence. When I propose that we imagine a thing in absolute isolation, I do not mean to suggest that it ceases to possess its value unless it is actually alone in the universe; rather, I mean that we must exclude from our consideration all those consequences and accompaniments which might confuse our judgment regarding whether the thing itself contributes any value at all. The property of 'good' is a simple, indefinable quality, much like the colour yellow; just as a yellow object remains yellow whether it is seen alone or amidst a crowd of objects, so too does a thing possess intrinsic value by virtue of its own nature, regardless of the larger whole of which it may be a part. Your objection that the universe has no boundary and thus nothing is truly isolated mistakes a logical distinction for a spatial one; we can certainly discern what value belongs to a thing's nature, even if that thing is never found in isolation. The test is therefore not empty, nor is value relational; it is a property inherent to the object or state of affairs.

  Regarding your two worlds, I maintain that the first possesses some intrinsic value, for a beautiful world is indeed better than an ugly one, even without minds to appreciate it; yet this value is slight compared to the second world. In the second case, the pleasures of human intercourse—affection and friendship—constitute one of the greatest goods we know, far surpassing the mere existence of beauty. The principle of organic unities teaches us that the whole formed by the friends' consciousness of the beauty and their affection is vastly more valuable than the sum of the beauty alone and the consciousness alone; but this does not render the value relational in the sense you imply. The friendship remains good in itself, and our inquiry successfully identifies that the beauty contributes something positive, while the friendship contributes something supremely positive, irrespective of the cosmic context in which they are embedded.
