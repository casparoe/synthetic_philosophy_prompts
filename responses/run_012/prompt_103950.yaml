answer: |-
  ### The two models as my students use them

  The contract model, championed by the litigation student, treats consent as a discrete transaction. It requires distinct parties with capacity, a clear offer and acceptance, and specific vitiating factors like duress or fraud. Its strength is providing a definite moment where permission is granted, offering clear guidance for permissible action. Conversely, the majority group's conversation model views consent as a continuous, dynamic interaction. It is negotiated turn-by-turn, where validity depends on ongoing responsiveness rather than an initial signature. They argue the institution's affirmative-consent policy is flawed because it seeks a punctual "yes" in a process that is inherently fluid. For them, a contested case turns on whether the interaction remained conversational, not whether a checkbox was ticked. The former prioritizes legal certainty and entitlement; the latter prioritizes relational quality and mutual attunement.

  ### Correspondence table

  | Feature | Contract Model | Conversation Model |
  | :--- | :--- | :--- |
  | **Offer** | Proposal of specific sexual acts | Opening move or invitation |
  | **Acceptance** | Discrete verbal or clear non-verbal "yes" | Continued participation or reciprocal move |
  | **Terms** | Scope of permitted acts agreed upon | Implicit norms of the ongoing interaction |
  | **Formation** | Moment of acceptance (the "yes") | Continuous process of mutual alignment |
  | **Breach** | Exceeding agreed scope (trespass) | Ignoring cues, withdrawal, or non-responsiveness |
  | **Remedy** | Punishment/Damages for violation | Cessation of interaction/Relational rupture |
  | **Vitiating Conditions** | Coercion, fraud, incapacity (threshold) | Power imbalance, deceit, disengagement (gradient) |

  ### Where the contract model breaks

  The contract model breaks down primarily where intimacy diverges from commerce. The most significant fracture is the notion of exchange. Contracts presuppose a transfer of rights for consideration, but sexual consent is not a commodity traded for access; it is a suspension of a right to bodily integrity without expectation of return. Treating it as contractual risks implying that once "accepted," the actor is entitled to performance, potentially obscuring withdrawal. Furthermore, the "moment of formation" is artificially rigid. Sexual encounters evolve; a contract signed at the outset cannot account for mid-act changes in desire without complex amendment clauses, which are absurd in practice.

  Additionally, the remedy structure fails. Contract breach yields damages; sexual violation yields criminal punishment or disciplinary expulsion. The moral wrong is not economic loss but violation of autonomy. The contract model's insistence on a fixed baseline creates false certainty, ignoring that entitlement in intimacy is rarely static. It protects the actor's need for clarity at the expense of the victim's ongoing autonomy.

  Moreover, the definition of "terms" is problematic. In contract, terms are explicit. In sex, terms are often implicit or assumed. If a partner agrees to kissing but not intercourse, the contract model treats this as a clear scope limitation. Yet, in the heat of an encounter, scope creep is common. The contract model treats scope creep as breach, which is legally sound, but fails to explain why the initial consent didn't cover the ambiguity. It lacks a doctrine of "reasonable interpretation" that accounts for emotional vulnerability. Ultimately, the contract model breaks because it seeks to freeze a dynamic human experience into a static legal instrument, protecting the reliance interests of the actor rather than the bodily integrity of the consenter. It renders subsequent non-verbal withdrawal legally invisible unless it meets a high threshold of revocation. This structural blindness makes it ill-suited for campus adjudication, where the quality of interaction matters more than the validity of an initial handshake.

  ### Where the conversation model breaks

  The conversation model breaks down where legal adjudication requires certainty. The litigation student's critique hits hard: a conversation has no clear moment of entitlement. If consent is continuously negotiated, an actor cannot know when they are permitted to proceed without constantly stopping to verify, which disrupts the very flow the model prizes. This creates a "chilling effect" where permissible conduct becomes indistinguishable from violation until after the fact. Criminal law and disciplinary codes require fair notice; a standard based on the subjective quality of a "conversation" fails to provide an ex ante rule for conduct.

  Furthermore, the conversation model struggles with asymmetry. Conversations imply equal footing, where parties can freely speak and be heard. In sexual assault cases, power disparities often silence the victim. A model relying on "responsiveness" may interpret silence or freeze responses as part of the flow rather than withdrawal. It risks romanticizing coercion as "complex negotiation." Additionally, evidentiary problems arise. A contract leaves a trace; a conversation is ephemeral. Adjudicating whether an encounter was "conversational" relies heavily on credibility contests regarding tone and nuance, which are difficult to prove.

  The breakdown is also evident in the concept of "repair." In conversation, misunderstandings are repaired by clarification. In criminal law, once a boundary is crossed, the harm is done; there is no "repairing" the violation retroactively. The conversation model suggests that if one partner misreads a cue but corrects course immediately, the consent remains valid. While this may be true relationally, legally, the trespass occurred the moment the cue was ignored. The model blurs the line between clumsy interaction and criminal assault. Moreover, the conversation model lacks a clear theory of revocation. If consent is undone by the "wrong kind of responsiveness," who defines the wrongness? Without a baseline of entitlement, the model collapses into hindsight bias, judging the interaction based on the outcome rather than the permissions granted. It offers a rich description of healthy intimacy but a poor standard for wrongful violation. It dissolves the moment of violation into a continuum of miscommunication.

  ### The three pressure points: duress, disclosure, capacity

  **Duress:** The contract baseline for duress relies on pre-existing entitlements (e.g., "I will harm you unless you agree"). In intimate relationships, entitlements are disputed. Is a threat to break up duress? Contract law says no; conversation models recognize the coercive weight of emotional dependency. The contract model fails here because it cannot account for normative power within relationships, treating all non-physical pressure as mere persuasion. The conversation model acknowledges the pressure but lacks a line to distinguish hard bargaining from coercion.

  **Disclosure:** Contract law defaults to *caveat emptor*; there is no duty to disclose unless asked, and fraud requires active misrepresentation. This is inadequate for sex. Non-disclosure of STIs, fertility, or identity strikes at the core of consent. The contract model permits deception by silence unless it goes to the "nature of the act." The conversation model implies a duty of honesty to maintain the "flow," but this is vague. Neither model adequately handles fraud in the inducement (lying about love) versus fraud in the factum (lying about identity), though the latter is universally vitiating.

  **Capacity:** Contract treats capacity as a threshold (you are either competent or not). Reality is a gradient. Intoxication, age, and emotional state fluctuate. The contract model creates cliff-edges (BAC limits) that don't match moral culpability. The conversation model allows for ongoing assessment but risks paternalism. If capacity is gradient, when does the partner become responsible for stopping? Both models struggle to assign liability when capacity degrades mid-act. The contract model says the initial yes holds; the conversation model says the interaction should have shifted. Neither provides a clear rule for when intoxication transforms consent into violation.

  Regarding **Duress**, the contract model's failure is structural. It assumes a baseline of independent agents. In intimate spheres, the "baseline" is the relationship itself. A threat to withdraw affection or housing within a dependency relationship functions as duress, yet contract law views this as leveraging existing rights. The conversation model fares better by viewing consent as embedded in power dynamics, but it offers no adjudicative standard. Without a clear baseline, every breakup threat looks like coercion, potentially criminalizing relational conflict. The pressure point reveals that consent cannot be modeled without a theory of legitimate power, which neither model fully supplies.

  Regarding **Disclosure**, the contract default of no duty to disclose is morally repugnant in sexual contexts. Consent to sex with a stranger is not consent to sex with a stranger who has an STI. The contract model distinguishes between fraud that vitiates consent (identity) and fraud that does not (intentions). This distinction collapses in intimacy; lying about contraceptive use changes the physical risk profile. The conversation model suggests such lies break the "conversational" trust, but lacks the normative force to declare the act criminal. The pressure point shows that sexual consent requires a duty of candor that exceeds commercial norms.

  Regarding **Capacity**, the threshold vs. gradient problem is critical. Contract law's threshold is administratively convenient but morally blunt. A person slightly over the limit is treated the same as one unconscious. The conversation model's gradient approach is morally nuanced but legally unworkable. It requires partners to be mind-readers of intoxication levels. The pressure point reveals a need for a hybrid: a safe harbor threshold for clear incapacity, combined with a duty to attend to signs of impairment. Neither pure model solves the "mid-act sobering" or "mid-act intoxication" dilemma. Ultimately, these pressure points demonstrate that consent is not merely about agreement or interaction, but about the conditions under which agreement is possible. Duress highlights the need for structural equality; disclosure highlights the need for informational integrity; capacity highlights the need for functional autonomy. The contract model ignores the conditions; the conversation model describes them but cannot regulate them.

  ### Verdict and a better picture

