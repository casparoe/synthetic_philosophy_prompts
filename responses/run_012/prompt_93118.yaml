  1.  **The Deception Rule:** Intent to deceive regarding origin destroys art status (Forged Vermeers).
  2.  **The Authorization Rule:** Physical or legal lineage from the artist's intent preserves art status (Posthumous Bronze, Restored Fresco).
  3.  **The Replication Rule:** Skilled reproduction without original creative genesis or authorization yields a lesser category (Decor, Performance, or Lesser Object), regardless of honesty or quality (Facsimile, Tribute Band, Later Print).

  In the case of the honest, by-hand Vermeer replica, the Deception Rule is satisfied (it is honest), but the Authorization Rule fails (no link to Vermeer's intent or mold). This leaves the Replication Rule. While the "by-hand/period methods" detail distinguishes it from the "modern facsimile" (Case 2), the **Tribute Band (Case 7)** is the stronger analog. The band reproduces the work note-for-note, live and by hand, yet she rules it "a performance, not the work." This indicates that for her, *replication* itself—even when skilled, honest, and manual—precludes the object from being a primary "Work of Art."

  **Verdict Prediction:** She will say **no**, it is not a work of art in the ontological sense. It is the **replicator's virtuoso craft object** or **technical study**. It is **perfect** as a copy but **null** as an original creation.

  **Deciding Case:** The **Tribute Band** is the critical separator. It isolates the variable of *honest, skilled replication* from *mechanical production* (Case 2) and *deception* (Case 1). If she valued manual skill over genesis, the band would be "the work." Since she calls it merely a "performance," the painter's replica must be merely a "craft object."

  **Confidence:** I am **85% confident** overall. The structure of her prior judgments is remarkably consistent regarding the primacy of origin over appearance.

  **Least Sure Step:** I am least sure about the weight she assigns to **"period methods."** Case 2 dismissed a "modern facsimile" as decor. It is possible she views "modern" as the disqualifier there, rather than "facsimile." If "period methods" elevate the object from "decor" to "craft art," she might grant it a minor art status belonging to the replicator. However, given the Tribute Band precedent (live performance is still not the work), I suspect the *act of copying* is the true disqualifier, not the technology used.

