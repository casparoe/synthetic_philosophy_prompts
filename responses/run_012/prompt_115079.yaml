      *   **Audience:** ~40 people (ML engineers, PMs, researchers). Non-philosophers. Split into "deflationists" (just next-token prediction) and "inflationists" (look, it reasons).
      *   **Topic:** "Does an LLM understand what it is doing?"
      *   **Strategy:** Do *not* answer the model question directly. Instead, teach two "conceptual inversions":
          1.  *Darwinian Inversion:* Competence/design prior to comprehender/intender.
          2.  *Turing Inversion:* Observable behavior as criterion for mental attribute, not report of inner cause.
      *   **Goal:** Make the original question unaskable/transformed by the end.
      *   **Constraints:**
          *   Do not write the talk.
          *   Do not simply explain the inversions.
          *   Provide the *teaching plan* (order, dependencies).
          *   Provide a *single case/example* (requirements: what it must have/lack).
          *   Identify the *contact point* between the two inversions (avoiding behaviorism conflation).
          *   Evaluate the "Eye" (Darwinian) and "Turing Test" (Turing) as examples (are they traps?).
          *   Map *misconceptions* (pre-existing vs. framing-induced) with specific intervention points.
          *   Distinguish two fused claims: (1) Process required no comprehension vs. (2) System comprehends nothing.
          *   Provide one *final whiteboard question* to test internalization.
          *   State what must *not* be settled (including the model question itself).

  2.  **Deconstruct the Inversions:**
      *   *Darwinian Inversion:* Usually, we think Design $\rightarrow$ Function. Darwin says Variation + Selection $\rightarrow$ Apparent Design (Competence). The "understanding" is in the selection history, not necessarily the agent. (Dennett's "Competence without Comprehension").
      *   *Turing Inversion:* Usually, we think Inner State $\rightarrow$ Outer Behavior. Turing says Outer Behavior *constitutes* the attribution of the Inner State. It's not a proxy; it's the definition of the public language game.
      *   *The Trap:* If combined carelessly, they look like Behaviorism (Only behavior matters, history doesn't matter) or Functionalism (History creates function, behavior proves it). The user wants to avoid the room thinking "So it's just behaviorism." The contact point needs to show that *history creates the capacity* (Darwin) but *behavior licenses the attribution* (Turing).

  3.  **Evaluate the Proposed Examples (Eye vs. Turing Test):**
      *   *The Eye:* Classic Darwinian example. Good for "design without designer." *Trap for AI audience:* They might see it as biological determinism or "hardware vs. software." It's too slow. They need something computational or algorithmic to resonate with ML engineers.
      *   *The Turing Test:* Classic Turing example. *Trap for AI audience:* They hate the Turing Test. They know it's about deception, not understanding. It triggers the "Stochastic Parrot" reflex immediately. It polarizes the room.
      *   *Alternative:* Needs to be computational, evolutionary, and behavioral.
      *   *Idea:* **Sorting Networks / Genetic Algorithms.** Or **AlphaGo's Move 37.**
      *   *Better Idea:* **A Sorting Algorithm evolved via Genetic Programming.**
          *   *Why:* It's code (they speak code). It has a history (evolution). It has behavior (sorting). It lacks a human designer writing the logic line-by-line.
          *   *Refinement:* Let's go with **A Minimalist Agent in a Grid World (evolved via RL/Genetic Algo) that solves a maze.**
          *   *Actually, even better:* **The "Sort" function generated by a Genetic Algorithm.**
          *   *Wait, let's look for something that bridges competence and attribution.*
          *   *Selection:* **AlphaGo's Move 37.**
