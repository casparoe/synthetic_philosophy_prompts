      *   *Final Question:* "If we found this code in a rock (Swampman), would it still sort?" (Tests if they conflate history with capacity).
      *   *Wait, better:* "If the training data is deleted, does the understanding vanish?"

      *   *Refining the "Contact Point":* This is the crux. Darwin says "Competence comes from History." Turing says "Understanding is judged by Behavior." If I say both, do I mean "History makes Behavior which makes Understanding"? No. I mean "History makes the *ability to behave*, Behavior makes the *warrant to claim*."
      *   *Crucial distinction:* Darwin explains the *possibility* of the competence. Turing explains the *warrant* for the attribution.
