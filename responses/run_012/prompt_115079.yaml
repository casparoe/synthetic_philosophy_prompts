          4.  Introduce the Criterion. How do we decide? (Turing Inversion).
          5.  Clash: If behavior is all that matters, does history matter? (The Contact Point).
          6.  Resolution: History explains *capacity*, Behavior licenses *attribution*.

      *   *Traps:*
          *   Eye: Too biological. Implies "life" is special.
