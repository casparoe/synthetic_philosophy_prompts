      *   **Conclusion:** The Anthropocene should be treated as a *diagnosis* (revisable, purpose-driven) rather than a *period* (fixed container). The rejection by IUGS/ICS was right (it's not a period) but for wrong reasons (they thought it was political intrusion, not conceptual mismatch).
