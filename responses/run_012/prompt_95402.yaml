answer: |-
  Based on the track record you've provided, your friend is almost certainly running a variant of **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)** with a hardened **Anti-Blackmail Policy**.

  Here is the prediction, the reasoning, and the test case to crack her code open.

  ### The Prediction
  **She refuses to pay the coin.**

  She will likely ignore the threat, let the dust-speck parity flip, and perhaps even expend a trivial amount of effort to ensure the parity is set to a value the threatener dislikes (punishing the mirror), provided that costs her less than the coin.

  ### The Reasoning
  Your friend's verdicts map cleanly onto a specific decision-theoretic profile that distinguishes between **logical correlation for gain** (Trade/Mugging) and **logical correlation for coercion** (Blackmail).

  1.  **The Mugging & Trade Verdicts (Pay/Trade):** In these cases, complying makes her the *kind of agent* that gets rewarded across possible worlds or logical instantiations. Paying the Counterfactual Mugger ensures Omega simulates her as a payer, netting the win. Trading with the correlated civ ensures mutual benefit across the acausal link. These are **positive-sum logical correlations**.
  2.  **The Blackmail Verdicts (Refuse):** This is the anchor. A standard Causal Decision Theorist (CDT) pays the one-shot blackmailer with the gun because the harm is immediate and causal. Your friend **refused**. This means she prioritizes **policy stability** over immediate causal loss. She acts as if her decision now determines the source code of future blackmailers (or simulations thereof). She refuses to be the *kind of agent* that pays blackmail, even when it hurts, to deter the class of all blackmailers.
  3.  **The Surrogate/Mirror Case:**
      *   **The Harm:** Surrogate goals are designed to be harmless to the victim (dust specks vs. torture). Since she refused a *real gun* (real harm), she will certainly refuse *dust specks* (null harm). Paying $100 for null harm is utility-negative.
      *   **The Mirror:** The fact that the threatener is a logical mirror doesn't turn blackmail into trade. In FDT, you treat your copy as yourself, but you still distinguish between "I give you money, you give me goods" (Trade) and "I give you money, you don't hurt me" (Blackmail).
