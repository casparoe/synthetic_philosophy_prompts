      *Objection:* "Rationality is node-specific. At each step, she maximizes. If every step is rational, how is the sequence irrational?"
      *Reply:* Precisely. The money pump argument only works if you smuggle in a diachronic consistency requirement. Without arguing for that requirement separately, you can't derive irrationality from exploitability.
      *Soft Spot:* If they argue dynamic inconsistency *is* irrational per se, you need a defense of local rationality.

