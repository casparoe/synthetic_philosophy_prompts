      **Q&A Prep: Money Pumps & Rationality**

      **1. The Economists (Revealed Preference)**
      *Objection:* "You're mentalizing. If she chooses the loop, she reveals a preference for the loop. You can't call it exploitative if it's chosen."
      *Reply:* Choice reveals local preference, not global welfare. She chooses A>B, B>C, C>A at distinct nodes. The loss emerges from the sequence, not the individual choices. Calling this "revealed preference for loss" stretches the definition until it breaks.
      *Soft Spot:* Risks looking like you're ignoring actual behavior for hypothetical mental states.

