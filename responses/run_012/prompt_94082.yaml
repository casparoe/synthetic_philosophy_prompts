      *Objection:* "If exploitability doesn't imply irrationality for preferences, you must concede it doesn't for credences. Are you exonerating incoherent credence functions?"
      *Reply:* No. Credences aim at truth; preferences aim at good outcomes. Incoherent credences fail their constitutive aim (accuracy) regardless of bets. Cyclic preferences don't necessarily fail their aim (satisfaction) if context matters. Exploitability is a pragmatic test; irrationality is a normative status. They come apart.
