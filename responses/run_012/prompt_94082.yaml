      *Objection:* "Incoherent credences guarantee loss via Dutch book. We call that irrational. Why is preference different?"
      *Reply:* Because betting norms are prudential, while credence norms are epistemic. A Dutch book shows pragmatic failure, not necessarily epistemic falsity. You're conflating the cost of holding a view with the justification for it.
