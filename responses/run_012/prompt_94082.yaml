      *   Usually, the economists jump in first to define terms.
      *   Then the CDT Bayesians (the majority) focus on the decision node.
      *   Then the Dutch-book person (the classic analog).
      *   Then the Bratman-ish philosopher (planning agency).
      *   Finally, the "Dreading" objection (credence functions) usually comes as a reductio ad absurdum after the main argument is laid out. Let's place it last or second to last as the "killer" question. Actually, the prompt says "include the one I'm dreading... which I really don't want to concede." It fits best as the final challenge.
