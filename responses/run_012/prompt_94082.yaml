  3.  **Drafting Content (Iterative Process):**

      *   *Economists:* "Preference just is choice. If she chooses the loop, she prefers it."
          *   Reply: Distinguish local choice from global welfare. She prefers A to B, B to C, C to A *locally*, but loses money globally. That's a conflict, not a definition.
          *   Soft spot: Revealed preference theory is robust; denying it looks like mentalism.

      *   *CDT Bayesians:* "At each node, taking the trade maximizes expected utility given current preferences. Where's the irrationality?"
          *   Reply: Exactly. It's locally rational. The pump only works if you demand diachronic consistency across nodes, which isn't a synchronic rationality requirement.
          *   Soft spot: Looks like you're accepting irrationality if you admit dynamic inconsistency is bad.

      *   *Dutch-book Person:* "Same logic applies to bets. Incoherent credences guarantee loss. That's irrational."
          *   Reply: Guaranteeing loss is pragmatic badness, not epistemic irrationality. You're conflating prudential and epistemic norms.
          *   Soft spot: Hard to separate prudential/epistemic cleanly without conceding some normativity.

      *   *Bratman-ish:* "Plans stabilize intentions. Ignoring your prior plan without reason is irrational."
          *   Reply: Plans are tools. If the tool demands cyclic sacrifice, discard the tool, not the agent. The plan isn't reason-giving if it leads to sure loss.
          *   Soft spot: Undermines the planning theory of intention if plans aren't normative.

      *   *The Dreaded (Credence):* "If exploitability doesn't imply irrationality for preferences, why does it for credences? Are you exonerating incoherent credence functions?"
          *   Reply: Credences aim at truth; preferences aim at satisfaction. A Dutch book shows your credences fail their aim (truth-tracking leads to loss). Cyclic preferences might just mean you value variety or context. The normativity differs by domain.
          *   Soft spot: This distinction is controversial. Many think coherence is domain-general.

  4.  **Refining and Condensing (Word Count Check):**
      *   Need to be punchy. Keep intros minimal.
      *   Ensure vocabulary matches (e.g., "revealed preference," "node," "credence," "plan-laden").
