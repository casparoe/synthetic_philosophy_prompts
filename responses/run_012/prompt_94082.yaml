      *   **Audience:**
          1.  Causal-Decision-Theory (CDT) Bayesians (rationality = per-decision).
          2.  Two Economists (preference = choice).
          3.  Bratman-ish Philosopher (plans are reason-giving).
          4.  Dutch-book Person (classic argument).
      *   **Specific Fear:** The analogy to incoherent credence functions (if exploitability isn't irrationality, does it exonerate incoherent credences?).
      *   **Format:** Q&A prep sheet. Objections in likely order, phrased in their vocabulary, 2-minute reply, note on soft spot.
      *   **Constraint:** Under 700 words.

