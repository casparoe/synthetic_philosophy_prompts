answer: |-
  Here is a reading of the two passages, taken together, addressing your five points and concluding with the reconciliation you asked for.

  ### 1. The Figure of Oil and Wheels
  Hume means that money is **causally necessary for the *form* of trade, but causally contentless regarding the *substance* of wealth.**

  Consider the machine. The wheels are the commodities and the labor; they are the things that actually *do* work. The oil is the medium that allows them to turn without grinding against each other (the friction of barter).
  *   **Necessary:** Without oil, the machine seizes. Without money, complex commerce reverts to clumsy barter. So, money is necessary for a modern economy to function.
  *   **Contentless:** Pouring *more* oil into the reservoir does not make the wheels turn faster or grind more grain. It simply changes the level of the fluid in the casing.

  Is this coherent? Yes, provided you accept that money is a **convention of measurement**, not a **factor of production**. If you double the amount of oil, the machine does not gain power. If you double the amount of money, the economy does not gain goods. The position holds because Hume distinguishes between the *instrument of exchange* (money) and the *objects exchanged* (industry/commodities). One is a counter; the other is the value being counted.

  ### 2. "If we consider any one kingdom by itself"
  This qualifier is doing the work of a **controlled variable**. It is not claiming that kingdoms *are* closed systems, but rather asking you to imagine one *as if* it were, to isolate the effect of money from the effect of trade.

  If you claim that money is wealth, you must explain why a kingdom that doubles its money supply doesn't become twice as rich. By stipulating "one kingdom by itself," Hume forces you to look at what happens when the money cannot flow out to buy foreign goods. In that closed loop, the only thing that *can* change is the number written on the price tags.

  This makes the claim **substantive**, not trivial. It is a thesis about the nature of value. It asserts that the wealth of a nation resides in its "people and their industry" (the wheels), not in the "plenty of money" (the oil). If the claim were trivial, it would offer no argument against the Mercantilists (your relative's intellectual ancestors), who believed hoarding gold *was* the goal of policy. Hume is using the closed economy thought experiment to prove that gold is not the goal.

  ### 3. "Of no consequence"
  When Hume says the plenty of money is "of no consequence," he explicitly excludes prices (since he says prices are proportioned to it). Therefore, he means it is of no consequence for **real purchasing power and productive capacity.**

  A crown in Henry VII's time bought the same amount of labor and bread as a pound does now. The *number* changed, the *command over resources* did not.
  *   **For what?** For the welfare of the subjects and the strength of the state.
  *   **Does he have the vocabulary?** He does not use the modern terms "real vs. nominal," but he draws the distinction sharply using "commodities" versus "money," and "industry" versus "plenty." He treats commodities and industry as the tangible reality and money as the shadow. When the shadow grows larger, the object does not grow heavier.

  ### 4. The Relation Between the Passages (Oil vs. Loss)
  This is the crux of your difficulty. If money is just oil, how can having too much be a "loss"?

  The loss arises when you remove the qualifier from Passage 2 ("if we consider any one kingdom by itself") and re-engage with the world.
  *   **Passage 1 (Internal):** Inside the kingdom, more money just raises prices. It is neutral.
  *   **Passage 2 (External):** Outside the kingdom, prices determine competitiveness.

  If your kingdom has a "greater plenty of money" than its neighbors, your internal prices will rise (per Passage 1). If your prices are higher than your neighbors', foreigners will not buy your commodities. Your "wheels" (industry) will stop turning because no one wants your output at that price.

  **What is lost?** **Industry and Employment.**
  Hume says "the greater number of people and their greater industry are serviceable in all cases." If your money supply gets too high, you price your own industry out of the market. The "loss" is not the money itself; the loss is the *work* that the money failed to facilitate because it became too expensive. The oil has become so thick or costly that it gums up the export mechanism.

  ### 5. Consistency and Reconciliation
  There is a single consistent doctrine here, but it requires you to accept a specific cost.

  **The Doctrine:**
  Money is a **domestic veil** but an **international price.**
  *   Domestically, it is a neutral measure. Doubling it changes nothing but the numbers on the tags.
  *   Internationally, it is a competitive cost. Doubling it makes your tags higher than your neighbor's, killing your trade.

  **The Reconciliation:**
  The two passages are not contradictory; they are **context-dependent applications of the same principle.**
  1.  In the first paragraph, Hume establishes the **nature** of money (it is a measure, not wealth).
  2.  In the later paragraph, he establishes the **danger** of mismanaging that measure in an open system.

  If you treat money as wealth (your relative's view), you will try to accumulate it. If you accumulate too much, prices rise. If prices rise, trade dies. Therefore, treating money as wealth destroys the actual wealth (industry).

  **What it costs:**
  To accept this reconciliation, you must abandon the intuition that "more money in circulation" is inherently good for a depressed region.
  *   **Your Relative's View:** Pumping money revives the region because money *is* activity.
  *   **Hume's View:** Pumping money *might* briefly stir activity (before prices rise), but if the money stays, it only raises costs. If the region needs to sell goods to survive (manufacturing), higher costs without higher productivity will kill the firm.

  **Which sentence is load-bearing?**
  You should stop treating **"the greater or less plenty of money is of no consequence"** as an absolute law for *policy*, and start treating it as a law of *value*.
  *   It is load-bearing for understanding **wealth**: Money quantity does not equal wealth.
  *   It is *not* load-bearing for understanding **competitiveness**: Money quantity *does* equal price levels, and price levels *do* equal consequences in trade.

  **Conclusion for your argument:**
  Hume does not settle the question in your relative's favor. He settles it against them.
  Your relative believes money creates wealth. Hume argues that industry creates wealth, and money merely records it. If you inject money into a depressed region without increasing the "industry" (the wheels), you only grease the machine without making it turn. Worse, if that region sells goods to the outside, you raise its costs and make its goods unsellable.

  The "loss" Hume mentions is the loss of **competitiveness**. The reconciliation is that money is neutral for *internal value* but fatal for *external trade* if allowed to inflate prices beyond your neighbors. You can hold both thoughts: Money is just oil, but if you flood the engine with oil, you cannot drive the car on the open road.
