  2. Yet a town is a chain of different hands, and we must admit that this weight will fall on shoulders that did not help lift it.
  3. This staircase does not pretend those future neighbors are us, but it ensures that overturning this limit requires a conviction strong enough to wait out the years and win over the dissenters.
  4. We accept this friction not because we know everything forever, but because the river outside will not negotiate with their future doubts any more than it negotiates with our current hopes.
  5. By ratifying this today, we are not solving the problem for our children, but we are finally giving them a floor solid enough to stand on while they build their own walls.
