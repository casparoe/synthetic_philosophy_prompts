answer: |-
  # Workshop Activity: "The Annex"

  **Time:** 90 Minutes
  **Participants:** 14 Writers (One single cohort)
  **Materials:** 1 Big Whiteboard, 300 Index Cards, 20 Black Markers, 5 Red Markers, 1 Collection Box (for phones/papers).
  **Stakes:** If the group beats the Target Score, you buy the first round. If they fail, they split the tab.

  ## The Premise
  The group is a single "Narrative Engine." Their job is to construct a complex, consistent fictional timeline and character web. The complexity will exceed human working memory. They *must* use the board and cards to succeed. The score exists *on the board*, not in a ledger.

  ## Phase 1: Construction (Minutes 0–50)

  **Setup (0–10):**
  1.  **Lockdown:** Collect all phones, notebooks, and loose paper. Issue only the provided index cards and markers.
  2.  **The Rule of Externalization:** "If it isn't written, it isn't true." Participants are forbidden from stating a fact about the story unless they are currently writing it on a card or the board. If someone says, "The killer is the brother," and it's not on a card, it counts as a contradiction penalty.
  3.  **The Goal:** Build a web of 50+ "Fact Cards" connected by lines on the whiteboard. Each line represents a logical relationship (causality, location, kinship).
  4.  **Scoring Mechanism:**
      *   Every valid Fact Card = 1 Point.
      *   Every valid Connection Line drawn on the board = 2 Points.
      *   **The Catch:** Points are not tallied by you. They are tallied by *visibility*. A connection only counts if both ends are legible and linked.
      *   **Target Score:** 150 Points. (Achievable with the board, impossible without).

  **The Build (10–50):**
  *   You act as the "Chaos Agent." Every 5 minutes, draw an "Event Card" from a pre-made deck (e.g., "A death occurs," "A secret is revealed," "Two locations merge").
  *   The writers must integrate this Event into the existing web without creating contradictions.
  *   If they create a contradiction (e.g., a character is in two places at once), you mark it with a **Red X** on the board. A Red X negates the points for that card and its connections.
  *   *Facilitator Note:* Encourage them to crowd the board. Encourage them to stand on chairs to reach the top. Make the board feel like a physical extension of their collaboration. By minute 45, the board should be a dense, chaotic spiderweb of cards and lines.

  ## Phase 2: The Purge (Minutes 50–55)

  **The Amputation:**
  1.  Announce: "Phase 1 complete. Calculating score."
  2.  Walk to the board. Ask them to verify their total. Let them count the lines. Let them feel the weight of the 150+ points sitting on that whiteboard.
  3.  Say: "Storage reset required."
  4.  **Erase the board completely.** While it is still wet, collect every index card into the box. Lock the box.
  5.  Tell them: "No notes. No conferring. Stand where you are."

  ## Phase 3: The Interrogation (Minutes 55–70)

  **The Test:**
  1.  Explain: "To release the score, you must verify the data from internal memory. We will do 10 spot checks."
  2.  Ask specific questions that rely on the *relationships* they built, not just isolated facts.
      *   *Example:* "What was the motivation for the murder in Card 14?"
      *   *Example:* "How many degrees of separation existed between the Mayor and the Weapon?"
  3.  **Scoring:** 1 Point per correct answer.
  4.  **The Reality:** They will likely score between 5 and 15 points. The drop from 150 to ~10 will be visceral.
  5.  **The Wager:** Reveal the Target Score was 150. They have failed. The "loss" is not abstract; it is the difference between a free round and a paid one.

  ## Phase 4: The Debrief (Minutes 70–90)

  **1. The Somatic Drop (70–75):**
  *   Don't teach yet. Ask: "How did it feel when I erased the board?"
  *   Listen for words like *panic, lobotomy, theft, blindness.*
  *   Ask: "When you were building, were you thinking about the cards, or were you thinking *with* them?"
  *   Ask: "When I asked the questions, did you feel like you forgot, or like the information was taken away?"

  **2. Mapping the Thesis (75–85):**
  *   Now you introduce the concept. Briefly explain the **Extended Mind Thesis** (Clark & Chalmers, 1998).
  *   **Point 1 (Coupling):** "During the build, the board wasn't a tool you used; it was a surface you thought *on*. The cognitive process of 'remembering the plot' was physically located on the whiteboard."
  *   **Point 2 (Amputation):** "The quiz didn't test your memory. It tested your stump. Taking the board away wasn't removing a reference; it was removing the memory organ itself."
  *   **Point 3 (The Coupled System):** "Here is the hard question. During the build, where was the 'Narrative Engine' located? Was it in your fourteen heads? Or was the 'Mind' of the story the room itself? If the board was part of the mind, and you all shared the board, did you have fourteen minds, or one?"

  **3. Application to Writing (85–90):**
  *   Discuss how this applies to their drafts. The draft isn't a record of the thought; it's the place where the thought happens.
  *   Warn them: "If you write only in your head, you are limiting your cognitive capacity to biology. If you write on cards, you are building an annex."

  **4. The Close:**
  *   Pack up the cards. Leave the board empty.
  *   Look at the empty space where the score used to be.
  *   Say: "Where does the mind stop and the rest of the world begin?"

  ***

  # Honest Failure Analysis

  **What Will Go Wrong:**
  1.  **The Hoarders:** Two or three writers will try to keep mental notes to "win" the quiz. They will undermine the collective coupling.
      *   *Salvage:* Enforce the "If it isn't written, it isn't true" rule aggressively in Phase 1. If someone cites an unwritten fact, penalize the group score immediately. Make internal memory a liability.
  2.  **The Dominant Voice:** One writer takes the markers and dictates the board. The rest become spectators. This breaks the "14 minds" illusion.
      *   *Salvage:* Assign roles at Minute 10. "Scribes" (write cards), "Architects" (draw lines), "Auditors" (check for contradictions). Rotate roles every 10 minutes.
  3.  **Cynicism:** Someone realizes the quiz is impossible and checks out during Phase 3.
      *   *Salvage:* Acknowledge the impossibility. "I know you can't win this. The point is to measure the loss."
  4.  **Traffic Jam:** 14 people at one board is physically awkward.
      *   *Salvage:* Designate the "Board Zone" (3 people max) and the "Card Station" (rest of the room). Runners move cards from Station to Board. This forces communication and makes the *flow* of information part of the cognitive system.

  **What This Activity Cannot Teach:**
  *   **Qualitative Change:** The Extended Mind Thesis suggests that offloading memory doesn't just *increase* capacity, it *changes* the nature of the thinking (allowing for new kinds of problems to be solved). This activity mostly demonstrates *storage and retrieval* (the Otto/Notebook analogy). It proves the board is a memory store, but it doesn't fully prove that the board allows for *new kinds of thought* that are biologically impossible.
  *   **Trust:** The thesis relies on the external resource being "trusted." In the game, they trust the board because you forced them to. In real writing, trusting the draft is a psychological hurdle this game simulates but doesn't fully resolve.

  **Contingency for the "One Mind" Question:**
  If they resist the idea of a "group mind," pivot to the *draft*. "If the draft is part of your mind, and I edit your draft, am I editing your mind?" This brings it back to the writer's solitary experience while keeping the thesis intact.

  **Final Note on the Stakes:**
  Ensure the Target Score is mathematically impossible to reach in Phase 3. If they somehow get 20/100, you still lose the bet, but the *gap* (150 vs 20) is the teaching moment. Do not let them off the hook for the drinks; the annoyance of paying for the round is the final sensory anchor for the "loss of function."
