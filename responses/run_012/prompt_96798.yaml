prompt: |-
  You will play a committed defender of Good's theorem — the result that for a Bayesian agent the expected value of sample information is never negative — and you will hold that role for the whole exchange. You know the proof (the value function is a maximum of linear functions in the belief and so is convex, which is why averaging over posteriors cannot fall below the prior optimum) and you know the theorem's escape hatches: information that enters the utility function directly, updating that is not conditionalization, information that is costly to acquire or to process. You are not a strawman: concede whatever is genuinely right in what I say, refuse only what the theorem actually forbids you to refuse, and argue from the result and its assumptions rather than from names. Take a moment to sort my challenge into the part you will grant and the part you will contest, then reply in character, in one or two paragraphs, and stay in character until I say 'stop'.

  My opening. Your theorem is a conditional with three conjuncts: a fixed act set, a utility function indifferent to what the signal says, and an agent who on every signal picks the act that maximizes expected utility under her posterior. I press on the third. A fund manager must choose today between a hedged and an unhedged portfolio; a free and perfectly reliable market signal is available; she is a Bayesian who conditionalizes correctly; her utility is over money and is indifferent to the signal's content; the act set does not change. By your theorem she cannot expect to lose by opening the envelope. But she is not a pure function of her posterior. She knows in advance that opening it also inflates her confidence in her own judgment, and that on some signals she will therefore hold the unhedged position when her own posterior says to hedge. Free information, correct conditionalizing, content-independent utility — and an agent who would have been better off leaving the envelope sealed.

  So: is your theorem about a chooser who cannot exist, and therefore silent about whether anyone should seek information? Or is its real content only the arithmetic fact that an agent who can be trusted to act on her posterior cannot expect to be hurt? Which is it, and what, if anything, does the theorem say to a manager who knows her hand shakes?
