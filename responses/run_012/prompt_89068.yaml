prompt: |-
  my reading group has spent the last month going through the presentism vs eternalism stuff and last week somebody shut down an argument about whether the future is open with "well the passage of time is an illusion, thats just physics" and then sat back like the case was closed. hes the only physicist in the group so everyone kind of deferred to him. i dont think physics settled anything of the kind, but whats actually bugging me is that i couldnt say what he was even claiming, and i want to be able to. so what i want from you is a menu, not a lecture on the block universe.

  Lay out the different precise claims that one sentence could be making, from the ones that are basically platitudes to the ones that would be genuinely startling, and give a verdict on each -- trivial, defensible but contentious, probably false, or not even false because its unclear what it says. At a minimum i want to see the difference between (a) a claim about our experience or perception, (b) a claim about language and whether tensed sentences say anything tenseless ones cant, (c) a claim about what exists, i.e. no privileged present, all times equally real, (d) a claim that nothing objectively becomes or changes in some deeper sense, and (e) a claim that the future is already fixed or determined -- and if you can think of readings outside that list thats even better, since i suspect the ones he'd actually need are the exotic ones.

  Then tell me which of these readings actually gets him his conclusion. What he wanted was "the future is as real and settled as the past," and from there "so the openness of the future is an illusion too." Which readings entail that, which merely rhyme with it, and which are flatly compatible with presentism or with a genuinely open future? And since he leaned on "physics," say honestly which of these are physics claims and which are philosophy wearing a lab coat -- just the arguments, no bibliography or reading list, i dont need citations. Lay it out as a list i can bring back to group. American English please.
