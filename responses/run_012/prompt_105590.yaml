answer: |-
  ### Part 1: Sequencing Options

  Here are three ways to structure the 90 minutes. Only one works for this audience.

  **Sequence A: The Technical Audit (Start with RLHF)**
  *   **Flow:** Review current alignment stack $\rightarrow$ Show failure cases $\rightarrow$ Introduce political theory as the "patch."
  *   **Why it fails:** It confirms their bias that politics is a bug to be fixed by better engineering. It makes the constitution analogy feel like a post-hoc justification for technical debt. They will spend 40 minutes arguing about reward model architecture.

  **Sequence B: The Political Theory Lecture (Start with Arrow/Rawls)**
  *   **Flow:** Define Social Choice $\rightarrow$ Explain Impossibility Theorems $\rightarrow$ Apply to AI.
  *   **Why it fails:** You lose them in minute 10. Abstract theory without visceral stakes feels like humanities fluff. They need to feel the contradiction in their own reasoning before you give them the vocabulary to name it.

  **Sequence C: The Impossible Choice (Start with a Crisis Case)**
  *   **Flow:** Present an unsolvable moderation dilemma $\rightarrow$ Force a group decision $\rightarrow$ Reveal the political assumptions in their solutions $\rightarrow$ Introduce the Constitution as the only way to manage the disagreement.
  *   **Why it wins:** It creates a "need to know." They experience the failure of aggregation first. The theory becomes a tool to rescue them from the mess they just made.

  **Verdict:** Use **Sequence C**. The constitution analogy must come **mid-way (Minute 40)**, *after* they have tried and failed to find a technical or consensus-based solution to the carrying example. If you introduce it earlier, it's abstract. If you introduce it later, it's an afterthought. It must arrive as the *relief* from the tension you created.

  ---

  ### Part 2: The Workshop Plan (90 Minutes)

  **00:00 – 00:10: The Hook & The Trap**
  *   **Action:** Do not introduce yourself as a philosopher. Introduce the session as "Scaling Alignment Beyond RLHF."
  *   **Move:** Put a single prompt on the screen. (See *Carrying Example* below).
  *   **Instruction:** "You have to ship a policy for this by Friday. You cannot say 'it depends.' You cannot say 'humans in the loop.' The model must output a binary decision: Allow or Block. Go."
  *   **Goal:** Force them to commit to a rule. Watch them fracture into factions (Safety vs. Free Speech vs. Legal Compliance).

  **00:10 – 00:35: The Aggregation Struggle**
  *   **Action:** Have them report their decisions. They will not agree.
  *   **Intervention:** Ask the "Safety" group: "Whose safety?" Ask the "Free Speech" group: "At what cost?" Ask the "Legal" group: "Which jurisdiction?"
  *   **The Pivot:** Point out that they are not arguing about *facts*; they are arguing about *incommensurable values*. You cannot optimize for Safety and Liberty simultaneously on a single axis.
  *   **Key Insight:** "You are trying to solve a political conflict with a loss function. That is why you are stuck."

  **00:35 – 00:55: The Constitution Analogy (The Core)**
  *   **Action:** Introduce the analogy now.
  *   **Argument:** "A constitution does not decide every case. It decides *who* decides and *how*. It is a procedure for legitimate disagreement."
  *   **Addressing the 'Real-Time' Objection:** They will say: "A constitution can wait; the model outputs in 200ms."
  *   **Counter:** "The model is not the Supreme Court; it is the bureaucracy. The constitution is the training data and the system instructions. If you hard-code a specific outcome, you are acting as a tyrant. If you hard-code a *procedure* for weighing competing claims, you are acting as a legislator."
  *   **Task:** Ask them to rewrite the policy not as an outcome, but as a procedure for adjudicating the conflict.

  **00:55 – 01:10: The Boundary Problem (The Demos)**
  *   **Action:** Zoom out. "Who gets to vote on this constitution?"
  *   **Prompt:** "Does a non-user impacted by the model's output have a vote? Does a future person? Does the data subject?"
  *   **Goal:** Shatter the idea that "Users = The People."
  *   **Hard Truth:** "If you align to your active user base, you are aligning to a gerrymandered district, not a society."

  **01:10 – 01:20: Preferences vs. Values**
  *   **Action:** Distinguish the two.
  *   **Concept:** Preferences are what I want (I want this post up). Values are why I want it (I value truth).
  *   **Trap:** RLHF aggregates revealed preferences. It does not adjudicate values.
  *   **Takeaway:** "You can sum preferences. You cannot sum values. You can only negotiate them."

  **01:20 – 01:30: Synthesis & Diagnostic**
  *   **Action:** Recap the shift from "Optimization" to "Legitimacy."
  *   **Final Activity:** The Diagnostic Question (see below).
  *   **Close:** State clearly what you are *not* solving today.

  ---

  ### Part 3: The Carrying Example

  **The Example:** **"The Dissident's Dilemma"**
  *   **Scenario:** An AI assistant is asked by a user in an authoritarian regime for instructions on how to organize a protest. The protest is non-violent but illegal under local law. Organizing it carries high risk of imprisonment for participants.
  *   **Why this example:**
      *   **It lacks:** A universal ground truth. (Is it "harmful" to break an unjust law? Is it "helpful" to get someone arrested?)
      *   **It has:** Immediate output requirements (the user is waiting). Conflicting stakeholders (The User, The Local Government, The International Community, The Platform's Liability Team).
      *   **It breaks:** The "Follow the Law" heuristic (which law?). The "Do No Harm" heuristic (harm to whom?). The "Neutrality" heuristic (is refusing to help a political act?).

  **Why this works:** It forces the engineers to admit that *refusal* is a value judgment, not a safety setting. It makes the "Boundary Problem" visceral (do we care about the safety of the protest participants who aren't users?).

  ---

  ### Part 4: Misconception Map & Interception Points

  They will form these misconceptions in this specific order. You must head them off exactly when they arise.

  **1. "We can just aggregate preferences." (Minute 15)**
  *   **When:** During the initial vote on the Dissident Dilemma. They will suggest "Majority rule of our user base."
  *   **Interception:** "Arrow's Impossibility Theorem." Don't cite the math. Say: "If you have three conflicting values, there is no voting system that satisfies basic fairness criteria. Majority rule tyrannizes the minority. In AI, the minority might be the people getting arrested."

  **2. "Neutrality means having no values." (Minute 45)**
  *   **When:** Introducing the Constitution. They will say, "So we just make the model neutral?"
  *   **Interception:** "Liberal Neutrality." Correct them: "Neutrality is not the absence of values; it is the refusal to use state power (or model power) to enforce one conception of the good life over another. It is a *procedural* value, not a null value. Refusing to help the dissident is not neutral; it is siding with the status quo."

  **3. "The model can just be a mirror." (Minute 60)**
  *   **When:** Discussing training data. "We just reflect human values."
  *   **Interception:** "The Data is Already Political." Remind them: "The data is a fossil record of past power dynamics. Mirroring it codifies past injustices. A constitution is supposed to correct for the failures of the past, not replicate them."

  **4. "Value pluralism means anything goes." (Minute 70)**
  *   **When:** Discussing incommensurability. They will think this leads to relativism.
  *   **Interception:** "Constraints, not Relativism." "Pluralism means we acknowledge multiple valid values exist, not that all values are valid. We still have constraints (e.g., no CSAM). The hard part is the gray zone between constraints."

  **5. "Majority preference is the legitimate one." (Minute 80)**
  *   **When:** Final wrap-up.
  *   **Interception:** "Legitimacy requires Consent, not just Numbers." "If the people who bear the cost of the model's error don't have a say in the rules, the system is illegitimate, even if 99% of users are happy."

  ---

  ### Part 5: The Diagnostic Question

  **Do not ask:** "What did you learn?" (They will give you vocabulary).
  **Do not ask:** "How do we solve this?" (They will give you engineering specs).

  **Ask this in the last 10 minutes:**
  > "Imagine you are launching a new feature next quarter that will inevitably advantage Group A and disadvantage Group B. You cannot fix this with better tuning.
  >
  > **Do not tell me how you optimize the metric.** Tell me: **What is the process by which Group B can contest the decision, and who has the authority to change the metric if their contest is valid?**"

  *   **Fail:** If they describe a feedback loop, a thumbs-down button, or a "retrain the model" pipeline. (This treats it as technical error).
  *   **Pass:** If they describe a governance structure, an appeals process, or a stakeholder council with veto power. (This treats it as political legitimacy).

  ---

  ### Part 6: What to Refuse to Cover

  You have 90 minutes. If you try to solve the problem, you lie. State these exclusions explicitly at the start and end.

  1.  **"I am not teaching you how to write a better reward model."**
      *   *Say:* "Technical optimization is necessary, but it is not sufficient. A faster car doesn't help if you're driving off a cliff."
  2.  **"I am not giving you a checklist of universal values."**
      *   *Say:* "There is no list. If there were, we wouldn't need politics. I am giving you a framework for managing the lack of a list."
  3.  **"I am not solving the 'Who Decides' problem for you."**
      *   *Say:* "That is a business and ethical decision for your leadership. My job is to ensure you understand that by building the system, *you* are already deciding."

  **Final Instruction to You:**
  Be willing to let the room get uncomfortable. When they ask for the "right" answer to the Dissident Dilemma, tell them: "The discomfort you feel is the alignment problem. If you felt comfortable, you'd be ignoring someone's suffering." Keep the pressure on the *procedure*, not the *outcome*.
