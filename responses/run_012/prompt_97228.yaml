answer: |-
  You have stumbled upon one of the central debates in the philosophy of mind and ethics, often discussed under the heading of the 'nature of pain'. Your intuitions are remarkably consistent with a specific school of thought known as the **Suffering View** (or sometimes the Desire-Based Account).

  To answer your question directly: yes, there is a principle that can tidy up most of these cases, but it requires us to be very precise about what we mean by 'pain'.

  ### The Principle: The Suffering Account

  The principle that best fits your gut reactions is this: **Pain is bad for a person only in virtue of the fact that they mind it.**

  On this view, the raw sensory signal (the 'pinch' or 'burn' recognition) is not what is bad. What is bad is the *suffering*—the negative emotional reaction, the dislike, the 'ouch-ness' that accompanies the sensation. Philosophers often distinguish between the *sensory-discriminative* aspect of pain (where is it? how strong is it?) and the *affective-motivational* aspect (how unpleasant is it?). Your principle suggests that the badness lives entirely in the latter.

  This handles your cases rather well:
  *   **The Headache:** You mind it intensely. Therefore, it is bad.
  *   **Pain Asymbolia:** They have the sensation but lack the suffering. Therefore, the pain itself is not bad for them (though the burn damage is).
  *   **Congenital Analgesia:** They have no sensation and no suffering. They are worse off *instrumentally* (they get injured), but they are not suffering intrinsic pain badness.
  *   **Anaesthetic:** No subject, no experience, no badness.
  *   **Heart Attack vs. Gas:** The sensation is identical, but the fear adds a layer of suffering to the heart attack case. Hence, the frightened patient is worse off.

  ### The Problem Cases: The Soldier and the Masochist

  You correctly identified that the soldier and the masochist put pressure on this principle.

  **The Masochist:** Under the Suffering Account, if a masochist genuinely enjoys the sensation, then the pain *is not bad for them* at that moment. It might be bad for their tissues, but the experience itself has been transformed into something positive. Your uncertainty here is natural, but the principle demands we say it isn't bad *as an experience*.

  **The Soldier:** This is the trickier case. You wrote that he is "in agony" but "says he doesn't mind". Here lies the contradiction. 'Agony' implies extreme suffering. If he is truly in agony, he *does* mind the sensation, even if he is glad about the *implication* (that he is alive). He is tolerating the badness of the pain for the sake of a greater good.

  However, let us imagine a soldier who, through training or dissociation, genuinely feels the sensation but does *not* suffer from it (similar to the asymbolic, but voluntary). If he truly does not mind the sensation itself, the Suffering Account says the pain is not bad for him.

  ### Which Verdict to Drop?

  To keep the principle clean ("Pain is bad because we mind it"), you should drop your verdict on the **Soldier**.

  Specifically, you should relinquish the idea that the *pain itself* is bad for him if he genuinely does not mind the sensation. You must distinguish between the **injury** (which is bad, as it threatens life) and the **pain experience** (which is only bad if suffered).

  If the soldier looks at his mangled leg, feels the signal, and feels no distress or aversion towards the feeling itself (perhaps viewing it merely as information), then the pain is not bad for him. Your intuition that it *is* bad likely stems from conflating the tissue damage with the experience, or assuming that 'agony' must be present if the wound is severe. But if we take your premise literally—that he doesn't mind it—then on your own principle, it cannot be bad for him.

  ### The New Case: Pain vs. Numbness

  You asked about a person who says the pain is terrible but definitely wouldn't trade it for numbness, because they'd rather feel something than nothing. Does this make the pain good?

  Under the Suffering Account, this does not make the pain *good*; it makes the numbness *worse*.

  We can think of badness as having two components: **intrinsic** and **comparative**.
  1.  **Intrinsic:** The pain is still intrinsically bad because they mind it (they admit it is "terrible"). It is a negative experience.
  2.  **Comparative:** However, the alternative (numbness/void) might be an even greater negative, perhaps due to loneliness, depression, or a fear of non-existence.

  Choosing a lesser evil does not make the evil good. If I choose to eat a meal I dislike rather than starve, the meal is still unpleasant, but starvation is worse. Similarly, this person prefers a painful existence to a numb one. The pain remains bad in itself (it is suffered), but it is instrumentally valuable as proof of life, or simply the 'least bad' option available.

  ### Summary

  If you adopt the principle that **pain is bad in virtue of being disliked (suffered)**, your intuitions align with a robust philosophical position. To make it consistent:

  1.  **Drop the verdict** that the soldier's pain is bad *if* he genuinely does not suffer the sensation. (The wound is bad; the pain is not).
  2.  **Accept** that the masochist's pain is not bad *for them* during the enjoyment.
  3.  **Maintain** that the 'Heart Attack' patient is worse off due to added anxiety (added suffering).
  4.  **Conclude** on the new case that pain remains intrinsically bad (because it is minded), even if it is preferable to the alternative.

  It is a view that places the human experience at the centre of ethics. Pain is not a monster in the nerves; it is a relationship between the mind and the body. When that relationship is one of aversion, it is bad. When it is one of indifference, or even acceptance, the 'badness' evaporates, leaving only the information.
