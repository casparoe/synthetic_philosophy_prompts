  **DEPARTMENT OF MOTOR VEHICLES | OPERATIONS MANUAL 9-C**
  **SECTION 9: DRIVING IN LOW-RECALL CONDITIONS**

  **9.1 Definition of Zone**
  The Symmetric Amnesia Corridor consists of two (2) sequential intersections. Intersections are visually identical. Drivers entering the Corridor will retain no memory of having passed the first intersection upon arriving at the second. Drivers must adopt a single unified strategy for both locations.

  **9.2 Mandatory Randomization Policy**
  Drivers are prohibited from attempting to distinguish intersections. Drivers are prohibited from conditional planning (e.g., "Exit at the second"). The Department mandates a mixed strategy. At any intersection, the driver must EXIT with probability $p=1/3$ and CONTINUE with probability $p=2/3$.

  **9.3 Expected Value Disclosure**
  Adherence to 9.2 yields an expected payoff of 1.33 units. Deviating to "Always Continue" yields 1.0 unit. Deviating to "Always Exit" yields 0.0 units. Drivers acknowledge that implementing 9.2 requires accepting a 33% chance of immediate termination at the first intersection (Payoff 0). This local loss is required for global optimization.

  **WARNING: LOCAL SUBOPTIMALITY**
  > Drivers may experience cognitive dissonance when deciding to EXIT. At the first intersection, EXIT is the strictly dominated action. At the second intersection, CONTINUE is the strictly dominated action. Because you cannot know which intersection you occupy, you must perform the locally suboptimal action according to the mandated frequency. Do not attempt to maximize utility based on immediate context. Context is unavailable.

  **9.4 Commitment Devices**
  The Department recommends pre-commitment. Drivers may purchase a Department-Approved Randomization Lockbox (Model K-7). The Lockbox determines the exit decision before the vehicle enters the Corridor and disables manual override. Drivers who rely on in-transit decision-making show 14% lower compliance due to panic-induced deviation.

  **9.5 Common Mistakes**
  *   **Attempting Counting:** Do not count seconds or landmarks. Recall is reset at each intersection.
  *   **Bayesian Updating:** Do not adjust probability based on "still being on the road." Arrival at the second intersection is more likely if you planned to continue, but your plan determines the likelihood of arrival. Circular reasoning violates 9.2.
  *   **Regret:** Regretting an exit at the first intersection is non-compliant. You followed the policy.

  **9.6 FAQ**
  **Q: Why not just exit at the second one?**
  A: You cannot identify the second one.
  **Q: Is this rational?**
  A: The policy is rational. The individual decision may appear irrational from inside the vehicle. The Department prioritizes aggregate outcomes over subjective coherence.
  **Q: Can I bring a passenger?**
  A: No. Passengers constitute external memory aids.

