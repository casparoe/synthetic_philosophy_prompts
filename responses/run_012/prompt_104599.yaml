prompt: |-
  Analyse the 1994 Rwandan genocide through the lens of Zygmunt Bauman's argument, in Modernity and the Holocaust, that the Holocaust was a product of modernity rather than a lapse from it — bureaucratic rationality, the taxonomic classification of populations, the division of labour, and the social production of moral indifference. Give me a disciplined mapping: which features of the case fit the thesis (the colonial racial classification and identity cards, the administrative apparatus, the role of radio) and which resist it (killing largely by hand, the collapse rather than the rational extension of the state, the low technology, the sheer speed). Then say what the case does to the thesis — confirmation, anomaly, or something the framework never anticipated — and where Bauman is simply silent. Finally, distinguish two senses of uniqueness, that the Holocaust is singular (unlike anything else) and that it is paradigmatic (the distinctively modern form of genocide), and say which, if either, the Rwandan comparison supports, and which sense the 1980s Historikerstreit — Nolte's claim that the Holocaust was not unique, Habermas's reply, and the Bitburg controversy that set it off — was actually disputing. Answer in British English.
