  **Modernity and the Machete: A Baumanian Analysis of the Rwandan Genocide**

  Zygmunt Bauman's *Modernity and the Holocaust* (1989) posits that the Shoah was not a barbaric atavism or a temporary lapse into irrationality, but rather a legitimate product of modern civilisation. For Bauman, the Holocaust was made possible by the 'gardening state'—a rational ambition to design a perfect society by weeding out undesirable elements—facilitated by bureaucratic rationality, the taxonomic classification of populations, the division of labour, and the social production of moral indifference (*adiaphorisation*). Analysing the 1994 genocide against the Tutsi in Rwanda through this lens reveals a complex relationship: the case largely confirms Bauman's structural insights while challenging his emphasis on industrial distance and cold rationality.

  ### Mapping the Thesis: Convergences and Divergences

  **Features Fitting the Thesis**
  Several structural elements of the Rwandan genocide align closely with Bauman's diagnosis of modernity's lethal potential.

  1.  **Taxonomic Classification:** Bauman argues that modernity requires the rigorous classification of populations to manage them. In Rwanda, this was inherited from the colonial era. The Belgian administration codified fluid social distinctions between Hutu and Tutsi into rigid biological categories, institutionalised through the 1933 census. This created the 'scientific' racism necessary for the 'gardening' impulse, transforming neighbours into a definable 'weed' to be removed for the health of the body politic.
  2.  **The Administrative Apparatus:** The genocide was not merely a mob eruption; it was administered. The prefectoral system, bourgmestres, and local officials utilised the state bureaucracy to organise the killing. Lists of victims were drawn up, and local authorities directed the *Interahamwe* militias. This reflects Bauman's 'division of labour', where responsibility is fragmented; the bureaucrat signs the order, the militia wields the weapon, and the moral agency of the individual is dissolved within the hierarchy.
  3.  **Identity Cards:** The use of national identity cards, which specified ethnicity, is a quintessentially modern tool of surveillance and control. It allowed for the efficient sorting of populations at roadblocks, mirroring the bureaucratic tracking of Jews in Nazi Europe. It rendered identity legible to the state and its agents, facilitating the separation of the victim from the citizen.
  4.  **The Role of Radio:** RTLM (Radio Télévision Libre des Mille Collines) functioned as a modern technology of dehumanisation. While not an industrial killing machine, it served the psychological function Bauman attributes to bureaucracy: it created distance. By referring to Tutsis as 'cockroaches' (*inyenzi*), the radio facilitated *adiaphorisation*, rendering the killing of human beings morally neutral for the listener, transforming murder into 'pest control'.

  **Features Resisting the Thesis**
  However, specific characteristics of the Rwandan case resist a strict Baumanian reading, particularly regarding the nature of violence and the state.

  1.  **Killing by Hand:** Bauman emphasises the industrialisation of death (gas chambers, railways) which distances the killer from the visceral reality of killing. In Rwanda, approximately 800,000 people were killed in 100 days, predominantly by machete and club. This was intimate, face-to-face violence. It suggests that modernity can facilitate genocide without industrial distancing, relying instead on the mobilisation of communal proximity.
  2.  **State Collapse vs. Rational Extension:** Bauman depicts the Holocaust as the result of a state functioning with hyper-rational efficiency. In Rwanda, the genocide occurred amidst a civil war and the fracturing of the state under pressure from the Rwandan Patriotic Front (RPF). The killing was, in part, a desperate, frenzied defence of a crumbling regime rather than the cool, calculated engineering of a utopian society. It was a 'warfare state' dynamic rather than a purely 'gardening state' one.
  3.  **Low Technology:** The reliance on human muscle rather than mechanised execution challenges the notion that high-tech modernity is a prerequisite for modern genocide. It indicates that the *social organisation* of modernity is more lethal than its *technology*.
  4.  **Sheer Speed:** The rate of killing in Rwanda exceeded that of the Holocaust. This intensity suggests a passionate, mobilised frenzy that complicates Bauman's focus on cold, detached rationality. It implies that modern techniques can be used to accelerate 'hot' violence as effectively as 'cold' administration.

  ### Impact on Bauman's Thesis

  The Rwandan case acts not as a refutation of Bauman, but as a necessary **expansion** of his framework.

  It confirms the core assertion that genocide is a modern phenomenon reliant on classification, bureaucracy, and the suspension of moral norms through authority. However, it exposes a silence in Bauman's work regarding **post-colonial modernity**. Bauman's model is Eurocentric, focused on the industrialised West. Rwanda demonstrates that the *tools* of modernity (IDs, radio, bureaucracy) can be decoupled from industrial *capacity*.

  Furthermore, Bauman focuses heavily on *adiaphorisation* through distance. Rwanda shows that modernity can also produce *adiaphorisation* through **ideological saturation**. The moral indifference was not achieved by hiding the blood (as in gas chambers) but by redefining the blood as vermin. Thus, Rwanda confirms the thesis that genocide is a product of modern social organisation, but it corrects the assumption that it requires industrial detachment. It suggests that modernity is not just about the 'rational extension of the state' but also about the **politicisation of identity** to a lethal degree.

  ### Two Senses of Uniqueness and the *Historikerstreit*

  To understand the implications of this comparison, one must distinguish between two senses of uniqueness:
  1.  **Singular (*Sui Generis*):** The Holocaust is a metaphysical singularity, an event unlike anything else in human history, incomparable in kind or degree.
  2.  **Paradigmatic:** The Holocaust is the first or clearest instance of a distinctively modern form of genocide, establishing a pattern or type that can be replicated.

  **The Rwandan Comparison**
  The Rwandan genocide supports the **Paradigmatic** sense and undermines the **Singular** sense. By demonstrating that the structural conditions identified by Bauman (bureaucracy, classification, modern communication) could reproduce a catastrophe of similar moral magnitude in a different context, Rwanda suggests the Holocaust was not a magical anomaly of German evil, but a replicable modern hazard. It validates the Holocaust as a paradigm of modern genocide, rather than a unique historical accident.

  **The *Historikerstreit* (Historians' Dispute)**
  The debate in 1980s West Germany, sparked by the Bitburg controversy and involving Ernst Nolte and Jürgen Habermas, was primarily disputing the **Singular** sense.

  *   **Nolte's Position:** Nolte argued that the Holocaust was not unique (*Singular*). He claimed it was a 'copy' of Soviet Bolshevik crimes and a defensive reaction to the 'Gulag Archipelago'. By making it comparable to other totalitarian crimes, he sought to 'normalise' German history, allowing Germans to move past the specific burden of the Holocaust. He challenged the *Singular* status to reduce the *Paradigmatic* burden of German guilt.
  *   **Habermas's Reply:** Habermas defended the **Singular** sense, not necessarily on metaphysical grounds, but on moral and political ones. He argued that comparing the Holocaust to other crimes (as Nolte did) relativised its horror and threatened the specific responsibility of German memory. For Habermas, the Holocaust's uniqueness was the foundation of post-war German democratic identity.

  **Conclusion**
  Bauman's thesis provides a robust framework for understanding Rwanda, confirming that the administrative and taxonomic tools of modernity are portable and lethal even without industrial infrastructure. However, the intimacy of the violence in Rwanda requires us to broaden Bauman's definition of modern rationality to include frenzied, mobilised destruction. Ultimately, the existence of the Rwandan genocide settles the theoretical question of the *Historikerstreit* in favour of the **Paradigmatic** view: the Holocaust was not a singular miracle of evil, but a warning of modernity's capacity for destruction—a capacity that, as Rwanda tragically proved, remains operational.
