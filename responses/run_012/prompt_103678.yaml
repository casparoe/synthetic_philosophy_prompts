      *   **Constraint:** Be honest where the theory is silent. No citations. Continuous prose. No headings, bullet points, or tables.

  2.  **Deconstruct Task 1: Theory to Case (Ellsberg to Insurance):**
      *   *Ellsberg Basics:* People prefer known probabilities (risk) over unknown probabilities (ambiguity). In the urn example, you know there are 30 red balls, but you don't know the mix of black/yellow. You bet on red rather than black because the probability of red is known (1/3), while black is ambiguous.
      *   *Application to Insurers:* Pre-9/11, terrorism risk was buried in general liability/property. Probabilities were low and arguably treated as "known" (or negligible). Post-9/11, the probability distribution shattered. Reinsurers couldn't model it. This looks like ambiguity aversion: refusing to bet on an event where $P(event)$ is unknown.
