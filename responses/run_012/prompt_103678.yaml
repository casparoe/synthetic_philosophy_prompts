      *   *Legislative Remedy:* The TRIA (Terrorism Risk Insurance Act) provided a federal backstop. This capped the loss. By capping the loss, it turned an ambiguous, infinite-tail risk into a known, bounded risk. Does this treat ambiguity aversion as a bias? If it were a bias, education or time might fix it. Instead, the government changed the payoff structure. This suggests the aversion was rational given the potential for ruin. The government accommodated the rational fear of unquantifiable tail risk rather than trying to cure a psychological glitch.
