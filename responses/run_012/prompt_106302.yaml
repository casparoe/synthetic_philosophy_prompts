answer: |-
  Here is a plan for your ninety-minute session. It is designed to respect the intelligence of your group while strictly managing the technical debt of modal logic. They are quarrelsome, so give them structured things to quarrel *with*, rather than letting them quarrel *about* the setup.

  ### 1. The Carrying Example: "The Ideal Engine"

  Do not use the "Perfect Pizza" or "Maximally Excellent Island." Parodies are useful for *refuting* an argument, but terrible for *teaching* one. If you start with a pizza, your solicitor will spend forty minutes arguing that pizza cannot have properties, and your engineer will argue about thermal dynamics. You want them fighting the logic, not the metaphor.

  Instead, use **"The Ideal Engine."**

  *   **What it must have:** It must be an object defined entirely by its functional properties (efficiency, output, stability). It appeals to the engineer's love of design, the doctor's understanding of homeostasis (self-regulation), and the solicitor's understanding of defined terms.
  *   **What it must conspicuously lack:** It must lack **material composition** and **causal history**. Stipulate at the outset: *"We are not talking about an engine made of steel. We are talking about a structure defined solely by its capacity to convert input to work without loss."*
  *   **How it does duty:**
      *   **Positive Property:** "Thermodynamic Efficiency." (It is better to have it than lack it, within the context of the system).
      *   **Essence:** "The Specific Cycle." (What makes this engine *this* engine and not a toaster).
      *   **Necessary Existence:** "Existing in every possible world where energy exists."

  **Advice on Parody:** Keep the "Perfect Pizza" in your back pocket. Use it only in the final fifteen minutes. If they claim the logic is sound, ask them to substitute "Pizza" for "God." If the logic holds, the pizza exists necessarily. This forces them to confront whether the *structure* is valid or whether the *premises* are the problem. Do not lead with it.

  ### 2. The Sequence of Operations (90 Minutes)

  You cannot introduce "Positive Properties" until they understand "Possible Worlds." If you don't secure the modal foundation, "Necessary Existence" will sound like magic.

  **0:00 – 0:20: Modality and Possible Worlds (The Board Work)**
  *   **Goal:** Replace "I can picture it" with "There is a world where..."
  *   **Action:** Draw three circles on the whiteboard. Label them $W_1$, $W_2$, $W_3$.
  *   **Concept:** A "Possible World" is not a planet; it is a complete, consistent description of reality.
  *   **Crucial Distinction:** Distinguish **Logical Possibility** (no contradiction) from **Physical Possibility** (consistent with laws of physics). Gödel's argument runs on Logical Possibility.
  *   **The S5 Assumption:** Draw lines connecting every world to every other world. Tell them: *"For this argument, we assume accessibility is universal. If something is possible in one world, it is accessible from all others."*
  *   **Head off Misconception:** When a member says, "I can imagine a flying pig," correct them: *"Not 'imagine.' Is there a contradiction in the concept? If no, it is logically possible."*

  **0:20 – 0:40: Properties and 'Positive' (The Axioms)**
  *   **Goal:** Define 'Positive' without morality.
  *   **Action:** Introduce the Ideal Engine. Ask: *"Is 'Efficiency' a property of the engine?"* Yes.
  *   **The Primitive:** Define **Positive Property ($P$)** as *"A property that is better to have than to lack, all else being equal."* Explicitly state: *"This is not moral goodness. It is axiological weight. Think of it as 'perfection-making'."*
  *   **Head off Misconception:** The doctor may argue that "pain" is positive for diagnosis. Stop this. *"We are talking about the properties of the **being**, not the effects on others. Focus on intrinsic perfection."*
  *   **The Axiom of Closure:** If $P$ entails $Q$, and $P$ is Positive, then $Q$ is Positive. (If "Omniscience" is positive, and it entails "Knowledge," then "Knowledge" is positive).
  *   **The Unearned Step (Concede this):** You must introduce the axiom: **"If a property is Positive, it is Necessarily Positive."** ($P(\phi) \to \Box P(\phi)$).
      *   *Say this plainly:* *"This is a heavy lift. We are assuming that what counts as 'perfect' doesn't change from world to world. We are not proving this; we are stipulating it to make the logic work. If you reject this, the argument stops here."*

  **0:40 – 1:00: Essence and Necessary Existence**
  *   **Goal:** Distinguish "Existing" from "Existing Necessarily."
  *   **Action:** Return to the Ideal Engine.
  *   **Essence:** A property $\phi$ is the essence of $x$ if $x$ has $\phi$, and $\phi$ entails all other properties of $x$. (The Engine's Cycle defines the Engine).
  *   **Necessary Existence ($NE$):** $x$ has $NE$ if, in every world where $x$'s essence is instantiated, $x$ exists.
  *   **Head off Misconception:** The engineer will say, *"Everything depends on something else."* Reply: *"We are defining a specific class of object that, by definition, does not depend on anything else for its existence. We are testing if such a thing is possible."*
  *   **The Link:** Gödel proves that if you have all Positive Properties, you necessarily have Necessary Existence. (God-like $\to$ $NE$).

  **1:00 – 1:15: The Derivation (The Engine of the Argument)**
  *   **Goal:** Show the move from Possibility to Necessity.
  *   **The Steps:**
      1.  It is **possible** that the Ideal Engine exists ($\Diamond \exists x Gx$).
      2.  If it exists, it has all Positive Properties (by definition).
      3.  One of those properties is Necessary Existence.
      4.  Therefore, if it exists, it exists **necessarily** ($\exists x Gx \to \Box \exists x Gx$).
      5.  **S5 Move:** If it is *possible* that it exists *necessarily*, then it exists *necessarily* in the actual world. ($\Diamond \Box p \to \Box p$).
  *   **Head off Misconception:** The "Trick." They will feel cheated by step 5.
      *   *Explanation:* *"This isn't a trick; it's the geometry of S5 modal logic. If something is 'necessarily true' in even one possible world, it is 'necessarily true' in all of them, because all worlds are connected."* Use the whiteboard lines you drew earlier.

  **1:15 – 1:30: Critique and Closing**
  *   **Goal:** Assess the cost of the conclusion.
  *   **Action:** Bring out the "Perfect Pizza" parody now. Ask: *"If I define a Pizza that has all positive culinary properties, does it exist?"*
  *   **Discussion:** Let them fight. The point is to realize the argument is **Valid** (the logic holds) but **Soundness** depends on the Premises (Is "Necessary Existence" a positive property? Is the concept coherent?).

  ### 3. The "Collapse of Contingency" Worry

  You asked for my judgment on raising the worry that granting the axioms makes *everything* necessary (Modal Collapse).

  **Advice:** **Do not derive it.** Do not spend time showing how $\phi \to \Box \phi$.
  **Why:** In ninety minutes, you cannot derive the collapse without confusing the distinction between the *object's* necessity and the *proposition's* necessity. If you raise it, you will shift the session from "Understanding Gödel" to "Understanding Sobel's Critique."
  **What to do instead:** Flag it as a known cost. In the final ten minutes, say: *"Philosophers have noted that if this argument works, it risks making all truths necessary. There is no contingency left. I am leaving that proof out today, but you should know that accepting this argument buys you a deterministic universe."* This satisfies their intellectual honesty without derailing the lesson.

  ### 4. Explicit Omissions

  To maintain trust, announce these omissions at the start or as you reach the gap:

  1.  **The Formal Proof of Consistency:** *"We are not proving that the axioms are consistent with each other. We are assuming they are."* (Actually, they have been shown to be consistent, but the proof is too technical).
  2.  **De Dicto vs. De Re:** *"We are glossing over the distinction between 'necessarily, there exists' and 'there exists, something that is necessarily.' For this session, treat them as aligned."*
  3.  **The Definition of 'Positive':** *"We are treating 'Positive' as a primitive. We are not defining *which* properties are positive, only how they behave."*

  ### 5. The Unearned Step

  There is one step where you must concede the argument is doing work you have not earned. It is the **Possibility Premise** ($\Diamond \exists x Gx$).

  **Concession:** *"The entire argument rests on the claim that a God-like being is **possible**. We have not proven this. We have only shown that **if** it is possible, **then** it is actual. If you think the concept of a 'Necessary Being' is contradictory (like a square circle), the argument fails. I am asking you to grant this possibility for the sake of the deduction."*

  ### 6. The Closing Question

  Do not ask, "Are you convinced?" That measures persuasion, not comprehension. Do not ask, "Is the argument valid?" They will guess.

  Ask this:

  > **"If we grant that the argument is logically valid, which single premise must we reject to save the world from being deterministic?"**

  **Why this works:**
  *   If they say "The definition of God," they didn't understand the logic (the definition is stipulative).
  *   If they say "The S5 accessibility rules," they understood the modal machinery.
  *   If they say "The Possibility Premise," they understood the conditional nature of the conclusion.
  *   If they say "The axiom that Positive properties are necessarily Positive," they understood the axiological cost.

  Any of those last three answers tells you they grasped the machinery. The first tells you they are still fighting the theology.
