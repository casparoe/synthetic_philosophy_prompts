answer: |-
  # Q&A Prep Sheet: Karma as Constitutive Desert

  **Strategy Note:** You are walking a tightrope. The Analytic crowd wants a working theory of justice; the Historians want textual fidelity. Your defense is that you are offering a *philosophical reconstruction*, not exegesis. Do not get dragged into textual debates you will lose; pivot to philosophical utility. Do not get dragged into secular metaphysics you cannot defend; pivot to the internal coherence of the theory.

  ### Concessions to Make at the Outset
  *   **On Exegesis:** Concede immediately that this is not a historical claim about what the Abhidharma or early Buddhist texts *say*. It is a claim about what the doctrine *does* if stripped of cosmology and treated as moral philosophy. Tell the historians: "I am not competing with your philology; I am mining the structure for analytic resources."
  *   **On Secular Viability:** Concede that this theory is not portable to a secular, single-life framework. If the room demands a theory of justice that works without rebirth, you must concede this isn't it.

  ---

  ### The Objections (Ordered by Likelihood & Damage)

  #### 1. The "Kant in Robes" Objection (Historians of Buddhist Philosophy)
  **The Charge:** "You've stripped karma of its causal mechanics and soteriological goal to save it for analytic moral theory. By making it about 'quality of will' and 'fit,' you've quietly Kantianized a doctrine that is fundamentally about causal conditioning and the cessation of suffering. Is this still karma, or just Strawson with incense?"
  **The Reply:** "It is a reconstruction, not an exegesis. My aim isn't to tell you what Vasubandhu thought, but to ask what work the *structure* of karma can do for us now. The causal reading makes karma a empirical claim about the universe, which is easily falsified. The constitutive reading treats it as a normative claim about agency. If the price of making it philosophically viable is losing some textual fidelity, I pay that price to save the insight: that our condition expresses our agency."
  **Where it's thin:** You are vulnerable to the charge of hermeneutic violence. If they press that the "quality of will" is an anachronism, you have no textual shield.

  #### 2. The "Constitutive Luck" Objection (Luck Egalitarian / Rawlsians)
  **The Charge:** "You claim to dodge the 'no one deserves their character' objection. But on your view, the 'quality of will' is still the locus of desert. Where does that quality come from? If it's subject to constitutive luck (genetics, upbringing, past lives), then the 'fit' between will and condition is just luck matching luck. You haven't solved the arbitrariness problem; you've just moved it back a step."
  **The Reply:** "Standard desert theories require the agent to be the *ultimate originator* of their character to deserve rewards. My view requires only that the condition *express* the will. It shifts desert from a transactional reward system to an expressive one. The arbitrariness of the will's origin doesn't negate the *fit* between the will and the condition. We aren't asking if they deserve to *have* that will, but whether their condition coheres with it."
  **Where it's thin:** This is the philosophical core. If they insist that desert *requires* ultimate responsibility, your expressive move looks like wordplay. This is the objection that can sink the chapter's philosophical payoff.

  #### 3. The "Infant Suffering" Objection (Everyone)
  **The Charge:** "If karma is constitutive, a child born into suffering is expressing a 'quality of will.' Are you prepared to say a suffering infant merits their condition based on a will they cannot consciously access? This sounds less like justice and more like victim-blaming metaphysics."
  **The Reply:** "This is why the commitment to persistence across lives is non-negotiable. The 'will' being expressed isn't necessarily the current conscious ego, but the continuity of agency across the lifespan (or lifespans). Without that persistence, the theory collapses. I am not saying the infant *consciously* chose this, but that the condition belongs to the same agent-stream as the actions that expressed the will."
  **Where it's thin:** This is rhetorically dangerous. It sounds cruel to an analytic audience that likely rejects rebirth. You risk losing the room's moral sympathy.

  #### 4. The "Metaphysical Price Tag" Objection (Analytic Metaphysicians)
  **The Charge:** "You admit this requires a heavy commitment to agent persistence across lives. Given that most of us reject rebirth, aren't you building a theory of justice on a metaphysics we have independent reason to reject? Why should we care about a theory of desert that requires a false cosmology?"
  **The Reply:** "I am not asking you to accept the cosmology to see the *structure* of the argument. Think of it as a conditional: *If* there is persistence, *then* this is how desert functions. Furthermore, even within a single life, we accept that persons persist through radical psychological change. I'm just extending the window of agency. The value is in showing how desert could work *if* we relax the 'single-life' constraint."
  **Where it's thin:** If the workshop is about *actual* distributive justice, a theory requiring false metaphysics might be dismissed as irrelevant.

  #### 5. The "Category Error" Objection (Historians / Soteriology)
  **The Charge:** "Karma isn't a theory of justice; it's a theory of liberation (moksha/nirvana). By framing it as 'distributive justice,' you're imposing a Western political category on a soteriological mechanism. Justice implies social institutions; karma is natural law."
  **The Reply:** "I am using 'distributive justice' broadly to mean 'the distribution of goods and burdens relative to agency.' Whether the mechanism is social or natural, the normative question is the same: Is the distribution arbitrary or does it track agency? I'm arguing karma offers a model of non-arbitrary distribution that doesn't rely on social institutions."
  **Where it's thin:** You may be forcing the doctrine into a workshop theme it doesn't fit. If they press that "justice" requires a distributor, you're stuck.

  #### 6. The "Empty Desert" Objection (Analytic Moral Philosophers)
  **The Charge:** "If desert is just 'fit' between act and condition, and not a claim to entitlement or reward, have you drained the word 'desert' of its normative force? A criminal's prison sentence 'fits' the crime, but we don't say the criminal 'deserves' it in the same way we say a worker deserves wages. Is this just retributivism disguised?"
  **The Reply:** "I am arguing for a non-comparative, non-transactional account. It's not about entitlement to goods, but about the moral intelligibility of the condition. It makes the world morally legible. Whether that counts as 'desert' depends on if you think desert requires a baseline of entitlement. I argue it only requires a baseline of expression."
  **Where it's thin:** If the Luck Egalitarian insists desert must be a basis for *distribution* by an agent, your "expressive fit" might look like a different concept entirely.

  #### 7. The "Non-Comparative" Objection (Distributive Justice Scholars)
  **The Charge:** "Distributive justice is inherently comparative (A vs. B). If your theory is non-comparative (A vs. A's actions), how does it help us solve problems of inequality? If I suffer and you thrive, but both 'fit' our wills, is there any injustice in the gap between us?"
  **The Reply:** "On this view, the gap itself is not the injustice; the arbitrariness of the gap is. If the gap tracks the quality of will, the inequality is morally intelligible. This challenges the Rawlsian assumption that inequality is presumptively unjust. It suggests we should look at the *source* of the inequality, not the metric."
  **Where it's thin:** This puts you at odds with the majority of the room (Rawlsians). You risk being sidelined as irrelevant to political philosophy.

  #### 8. The "Control" Objection (Free Will Scholars)
  **The Charge:** "Quality of will accounts usually require control. If I act from a good will, I must have been able to do otherwise. If karma persists across lives, do I have control over the conditions of my next life? If not, the 'fit' is just deterministic causation."
  **The Reply:** "I am not relying on libertarian free will. I am relying on the ownership of the will. Even if the will is determined, if it is *mine*, the condition that expresses it is non-arbitrary relative to me. The 'fit' secures the connection, not the freedom of the choice."
  **Where it's thin:** Compatibilists might buy this; Libertarians will not. If the free will scholars in the room are incompatibilists, they will reject the "ownership" claim.

  ---

  ### Strategic Summary

  **The Single Objection That Could Sink the Chapter:**
  **#2 (The Constitutive Luck Objection).**
  If you cannot convince the Luck Egalitarian and Rawlsians that "expressive fit" bypasses the need for "ultimate responsibility," your claimed payoff (solving the standard anti-desert argument) vanishes. The chapter becomes a description of a system, not a defense of desert.
  *   **Prep:** Rehearse the distinction between *originating* a character and *expressing* a character. Be ready to say: "Desert is not about where the will came from, but about whether the world reflects that will back to the agent."

  **The Question You Hope Nobody Asks:**
  **"Why call this Distributive Justice at all?"**
  If someone asks, "If this is non-comparative, metaphysical, and requires rebirth, why is this in a workshop on *distributive justice*? Isn't this just theology or metaphysics?"
  *   **Why it's dangerous:** It challenges the relevance of your project to the room's primary discipline. If you admit it's not political justice, you might be politely thanked and ignored.
  *   **Deflection:** "Because it addresses the fundamental question of distributive justice: When is a distribution of burdens and benefits arbitrary? Karma offers a limiting case where nothing is arbitrary."

  **Final Advice:**
  The Historians are your biggest credibility risk; the Analytic philosophers are your biggest philosophical risk.
  *   To the **Historians**: Be humble. "I know this isn't exegesis."
  *   To the **Analytics**: Be bold. "This solves the luck problem you think is unsolvable."
  *   Do not let the "Infant Suffering" question turn into a theodicy debate. Keep it focused on the *structure of agency*, not the *morality of suffering*.

  Good luck. You know the material; trust the reconstruction.
