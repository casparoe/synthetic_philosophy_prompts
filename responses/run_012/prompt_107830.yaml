answer: |-
  1. The practice, restated

  The current system operates on four binding commitments. First, credit is exclusive: the first to publish owns the discovery, rendering subsequent independent arrivals derivative or suspect. Second, verification is administrative: priority is determined by timestamps on manuscripts or preprints, not by assessments of cognitive labor or difficulty. Third, intellectual property is bifurcated: patent law treats ideas as scarce resources owned by the first filer, denying rights to independent later inventors, while copyright protects expression regardless of simultaneity. Fourth, recognition is individuated and capped: major prizes restrict laureate counts and exclude the dead, forcing collective progress into discrete individual units. Together, these commitments treat scientific progress as a series of discrete, ownable events attributable to specific agents at specific times.

  2. What it strictly presupposes

  For these features to function as normative rules rather than arbitrary violence, the system must presuppose a specific ontology of discovery and a specific theory of desert.

  First, regarding discovery, Features 1 and 2 presuppose that a discovery is a discrete event rather than a continuous process. If discovery were a gradual accumulation of community knowledge, assigning a specific timestamp to a specific person would be categorically impossible. The system requires that truth exists "out there" waiting to be claimed, and that the act of claiming (publication) transforms it from potential to actual. This treats the discoverer not merely as an observer but as an appropriator. The timestamp rule presupposes that the moment of public declaration is the moment of creation, effectively collapsing the distinction between finding and making.

  Second, regarding authorship, Feature 3 (patent law) presupposes that ideas are rivalrous goods. Unlike copyright, which assumes expression is tied to the individual psyche, patent law assumes an idea is a single unit that can be exhausted by one person's claim. By rejecting independent invention as a defense, the system presupposes that the value lies in the disclosure itself, not the mental labor. Therefore, authorship is defined by communication, not conception. The second inventor is an infringer not because they stole, but because the resource was already removed from the commons.

  Third, regarding desert, Features 1 and 4 presuppose a victory-based theory of desert rather than a effort-based one. If credit were proportional to cognitive labor, the second discoverer—who may have worked harder or longer—would deserve equal standing. The system instead presupposes that desert is conferred by winning the race. This implies that the social value of science lies in the speed of dissemination rather than the depth of contemplation. The stigma attached to being second (Feature 1) reinforces this: it implies a moral failing in losing, not just a lack of reward.

  Finally, Feature 4 presupposes that contribution is individuated. By capping prizes at three names, the system asserts that complex achievements can be decomposed into distinct individual contributions. This presupposes that the collective is merely a sum of parts, rather than an emergent entity where the whole exceeds the sum of individual agencies. Without this assumption, limiting laureates would be recognized as a factual error rather than an administrative necessity.

  3. What it merely fits

  Several views are compatible with these practices but are not strictly required by them. The most prominent is the incentive-based justification. One could argue that priority rules exist solely to motivate speed, without believing the winner inherently deserves more moral credit. However, if this were the only justification, the stigma against the second discoverer would be unnecessary; they would simply be unpaid, not suspect. The rhetoric of "theft" implies a moral claim beyond utility.

  Similarly, the system fits a meritocratic narrative where the first publisher is assumed to be the most competent. This is compatible but not required. The system would function identically if the first publisher were merely the most reckless or well-funded. The practice does not need the first mover to be the best thinker, only the fastest communicator.

  Additionally, the distinction between patent and copyright (Feature 3) fits a view that ideas are universal while expression is personal. However, the system does not require this metaphysical distinction to hold universally; it only requires it to hold for administrative convenience. One could imagine a system where patents also allowed independent invention defenses without collapsing the priority rule for publication. The current split fits our legal history, but the practice of scientific priority could survive even if patent law shifted to reward independent creation, provided the publication timestamp remained the gold standard for scientific credit. The practice merely fits these broader legal philosophies; it does not depend on their absolute truth.

  4. The tension

  The central tension lies between the ontology of discovery implied by simultaneous findings and the ontology required by the priority system. The frequency of simultaneous discovery suggests that findings are inevitable structural outcomes of a field's maturity—the "ripe time" theory. This implies discovery is a fact about the world waiting to be found, where the discoverer is merely the conduit. However, Features 1 and 4 treat discovery as an individual feat, where the discoverer is the author. If the result was inevitable, the individual act is less significant; yet the credit system maximizes the significance of that individual act.

  This creates a contradiction in the treatment of replication versus discovery. The community treats independent replication as the strongest evidence for truth (validating the "fact about the world" view), yet treats independent discovery as a threat to credit (validating the "individual authorship" view). If truth is objective and inevitable, the second discoverer confirms the first. If credit is subjective and competitive, the second discoverer dilutes the first. The system wants both: the objective validity of the multiple finder, but the subjective exclusivity of the single winner.

  Feature 3 exacerbates this. Patent law treats ideas as property (scarce), aligning with the priority rule. But science treats truth as public goods (non-scarce). By applying property logic to public goods, the system creates a artificial scarcity of credit. Feature 4 (prize limits) clashes with the reality of collaborative science. If discovery is often collective, forcing it into three names is a fiction.

  Does this inconsistency dissolve? No. It is a functional necessity. The system requires the myth of the individual genius to allocate resources efficiently, even if the reality is collective inevitability. The tension survives because the system is designed to motivate behavior (speed) rather than reflect metaphysical truth (inevitability). The inconsistency is not a bug but a feature of a system that prioritizes dissemination over accurate attribution of labor.

  5. If the presupposition were replaced

  If we replaced the "individual feat" presupposition with "social inevitability," the mechanics would shift profoundly.

  Feature 1 (Priority): The "first to publish" rule would become obsolete. If discovery is inevitable, speed is less virtuous than accuracy or completeness. Credit would shift from "who was first" to "who contributed most to the verification." The second discoverer would be recognized as a co-validators, not a competitor. Publication timestamps would matter less than the quality of the argument.

  Feature 2 (Timestamps): Administrative records would lose their adjudicatory power. Disputes would be settled by peer assessment of contribution quality rather than date stamps. The "race" aspect would vanish, reducing the incentive for premature publication of half-baked results.

  Feature 3 (Patents): Patent law would likely adopt an independent invention defense, aligning with copyright. If ideas are inevitable discoveries rather than created properties, blocking a second inventor is unjust. The system would move toward reward statutes (paying inventors from a public fund) rather than monopolies, acknowledging the idea belongs to the community.

  Feature 4 (Prizes): Prize committees would eliminate caps on laureates. Awards would go to collaborations, laboratories, or fields rather than individuals. Posthumous awards would become standard, as the individual's lifespan is irrelevant to the collective achievement.

  Untouched: The requirement for public disclosure would remain. Even in a collective model, knowledge must be communicated to be useful. Verification processes would also remain, though the credit for verification would be shared more broadly. The shift is from ownership to stewardship; the discoverer is not the owner of the truth but the first steward responsible for its care and handover to the community.

  6. Bottom line

  The system lacks a coherent implicit theory. It oscillates between treating discovery as an objective fact (validating replication) and a subjective property (validating priority). It functions coherently as an incentive mechanism but fails as a theory of desert. The most likely feature to be revised is Feature 4 (prize limits). As science becomes increasingly collaborative, the fiction of the three-person limit becomes unsustainable. While priority rules are entrenched in publication culture, prize committees face immediate pressure to acknowledge team science. Revising this would not solve the theoretical incoherence, but it would align the reward structure closer to the actual social nature of discovery, admitting that the lightning strikes the field, not just the person.
