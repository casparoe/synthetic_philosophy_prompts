answer: |-
  Two expressivists are tidying the kitchen.
  Alex says, "If putting the milk in the cupboard is wrong, then you shouldn't do it."
  Jamie replies, "Ah, but in that antecedent, you aren't actually expressing an attitude. You're just embedding the sentence. So that clause is attitude-free. Since meaning is attitude, your argument lacks a major premise. Now hand me the milk."

  # Why it works

  The punchline hinges on the Frege-Geach problem's core challenge: maintaining consistent meaning across asserted and unasserted contexts. Jamie treats the antecedent ("If putting the milk...") as semantically empty because no attitude is currently expressed there. For strict expressivism, meaning is tied to expressing attitudes; without an actual expression, Jamie claims there is no content to sustain the logical inference (modus ponens).

  An expressivist might defuse this via quasi-realism, arguing that moral language *mimics* propositional logic even if its foundation is attitudinal. They'd claim logic holds because we project attitudes into complex sentences, preserving validity through consistency of commitment rather than truth conditions. This allows them to use conditionals without asserting the antecedent's truth.

  However, the joke oversimplifies by suggesting expressivists deny meaning to unasserted contexts entirely. In reality, they acknowledge the meaning but struggle to explain *how* non-propositional attitudes preserve validity across logical operators specifically without collapsing into realism.
