answer: |-
  **The Case**
  Elena, a senior litigation partner, is contractually bound to secure a specific ruling: that "Clause 7b is unenforceable in State X." Her firm's protocol allows her to deploy any of three distinct legal strategies (Motion to Dismiss, Summary Judgment, Constitutional Challenge), and she actively rotates them based on judicial feedback; when a judge signals hostility to one approach, she immediately drafts a new filing using a different strategy, demonstrating high method plasticity. During discovery, opposing counsel plants a decoy document designed to trigger a standard procedural objection; Elena identifies the document as a trap, recognizes the cue as manipulative rather than substantive, and declines to bite, showing she can detach behavior from the trigger. However, after the State Supreme Court explicitly rules that Clause 7b *is* enforceable, Elena's internal risk memo acknowledges this precedent makes her specific objective legally impossible under current doctrine, yet she continues to litigate solely for that ruling, refusing to pivot to settlement or damage mitigation, treating the impossibility as a temporary methodological hurdle rather than a reason to revise the terminal aim.

  **The Variant**
  Elena is contractually bound to file the "Constitutional Challenge" strategy regardless of judicial reception, prohibiting her from switching to Motions or Summary Judgment even when judges signal hostility. However, her mandate regarding the case outcome is open; when the State Supreme Court rules Clause 7b is enforceable, she immediately revises her terminal aim from "Secure Ruling" to "Negotiate Confidential Settlement," accepting the legal defeat to preserve client capital. She still identifies the decoy document as a trap and ignores it.
  **The One Respect:** The locus of contractual constraint (Fixed Aim vs. Fixed Method).

  **Working-Through**

  **Verdicts and Reasons**
  *   **Routine-Revisability (Flexible):** In the primary case, Elena switches between three distinct legal strategies when judges signal hostility. She repairs and replaces her methods continuously.
  *   **Aim-Revisability (Rigid):** In the primary case, Elena registers decisive evidence (Supreme Court ruling + internal memo) that her specific aim is impossible, yet she continues to pursue it without modification. The aim is immune to learning.
  *   **Cue-Detachment (Flexible):** In both cases, Elena recognizes the decoy document as a manipulative cue rather than a substantive trigger and halts the standard response. She treats the cue as an object.

  **Load-Bearing Feature**
  The load-bearing feature is **Elena's response to the Supreme Court Precedent.**
  *   **If Removed:** Without the precedent ruling, there is no decisive evidence against the aim's viability. The AR diagnostic would lack the necessary condition to test rigidity, likely defaulting to "Flexible" due to lack of counter-evidence.
  *   **If Strengthened:** If Elena continues litigating *after* being sanctioned by the court for frivolous filing, the AR verdict of Rigidity becomes indisputable, as the cost of the aim now includes personal professional destruction, yet the aim holds.

  **Attack on the Outlier Diagnostic (Aim-Revisability)**
  *   **The Attack:** A defender of Elena's agency argues that AR misidentifies *commitment* as *rigidity*. By sticking to the aim despite impossibility, Elena is not acting sphexishly but upholding a principled stance (legal integrity) which is a higher-order aim that *has* been revised (from "Win" to "Protest"). The diagnostic falsely categorizes steadfastness as malfunction.
  *   **Success/Failure:** The attack fails against the specific constraints of the case. The internal memo explicitly categorizes the aim as "legally impossible" and "counter-productive to client interest." If the higher-order aim were "Protest," the memo would reflect that shift. Since the memo treats the aim as a standard victory condition that is now impossible, yet she proceeds, the behavior fits AR's definition of rigidity (aim immune to evidence) better than a re-specified aim. The case holds.

  **Interventions**
  *   **Routine-Revisability:** A bystander hands Elena a brief for a fourth, superior legal strategy.
      *   *Prediction (Case 1):* She adopts it immediately (confirms Flexible).
      *   *Prediction (Variant):* She rejects it because she is bound to the Constitutional Challenge (confirms Rigid).
  *   **Aim-Revisability:** A bystander offers a settlement that saves the client millions but requires admitting Clause 7b is enforceable.
      *   *Prediction (Case 1):* She rejects it to preserve the aim (confirms Rigid).
      *   *Prediction (Variant):* She accepts it to change the aim (confirms Flexible).
  *   **Cue-Detachment:** A bystander waves the decoy document in court.
      *   *Prediction (Both):* She ignores it (confirms Flexible).

  **Free-Will Upshot**
  On the **Aim-Revisability** diagnostic, Elena's behavior in the primary case stops being her own; she is a vessel for a frozen goal, rendering her procedurally sophisticated but ultimately heteronomous. On the **Routine-Revisability** and **Cue-Detachment** diagnostics, the behavior is genuinely hers, as she authors the means and recognizes the context. The disagreement is **substantive**: it turns on whether the "Self" is constituted by the capacity to choose *means* (RR) or the capacity to choose *ends* (AR). If agency requires authorship of ends, Case 1 Elena is not an agent regarding this litigation; if agency requires effective navigation of reality, she is. The casebook entry demonstrates that "genuine behavior" is not a unitary phenomenon but fractures depending on which locus of control one privileges.
