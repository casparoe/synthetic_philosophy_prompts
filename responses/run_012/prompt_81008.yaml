answer: |-
  You have independently rediscovered one of the most famous problems in modern philosophy. What you are describing is known as **The Knobe Effect** (or the Side-Effect Effect), identified by philosopher Joshua Knobe in 2003.

  You are not confused because you lack a rule; you are confused because the word "intentionally" does not actually have a single, clean rule in human language. It is doing double duty.

  Here is the principle that fits your pile of gut reactions, the answers to your new cases, and the honest truth about how to talk about this without sounding like you're making it up.

  ### The Principle: The Accountability Test

  The principle that unifies your reactions is not about mental states (what the boss thought); it is about **normative significance**.

  **The Rule:** We label a side effect as "intentional" when the outcome violates a norm (moral, legal, or social) such that we need to hold the agent accountable. We withhold the label when the outcome conforms to norms or is trivial, because no accountability is required.

  Here is how that rule fits your specific scenarios:

  1.  **Pollution (Bad Side Effect):** Violates a moral/environmental norm. We want to blame the boss. Therefore, we call it **Intentional**.
  2.  **Cleaning (Good Side Effect):** Conforms to norms. We don't *need* to blame him, and the word "intentional" feels too strong for mere praise. Therefore, we call it **Unintentional**.
  3.  **Ignorance:** No knowledge = no agency. **Not Intentional**.
  4.  **Reluctance (Hates it but does it):** He still chose the action that caused the norm violation. His feelings don't absolve accountability. **Intentional**.
  5.  **Paint (Trivial):** No norm is violated or fulfilled. It doesn't matter. Our brain doesn't bother tagging it for accountability. **Not Intentional**.
  6.  **Means (Cleanup for Publicity):** Now the cleanup is a *goal*. Goals are always intentional because the agent is fully committed to them. **Intentional**.

  ### Which Gut Reaction Should You Ditch?

  If you are forced to choose a single definition for a legal contract or a logic puzzle, you must ditch the **Harm/Help Asymmetry**.

  In strict philosophy and law, the "Simple View" holds: If you know with certainty that X will happen as a result of your action, and you proceed, X is intentional. Under this strict rule, **both** the pollution and the cleanup are intentional.

  **However,** if you are describing human psychology and language (which you seem to be), **do not ditch the asymmetry.** Your gut is correct. The word "intentionally" is not a camera recording facts; it is a gavel assigning responsibility. If you force yourself to say the boss "intentionally cleaned the river," you are using the word incorrectly according to how English speakers actually understand it.

  ### Applying the Principle to Your New Cases

  Using the **Accountability Test** (Does this outcome trigger a need to assign blame or credit?), here is what the principle says about your new scenarios:

  **1. Boss hurts a rival company (Bad Side Effect)**
  *   **Verdict:** **Intentional.**
  *   **Why:** Even if it wasn't the goal, harming a rival violates competitive norms or laws (antitrust, etc.). We want to assess blame. The "Knobe Effect" predicts you will call this intentional because it is a negative norm violation.

  **2. Employee Rich / Employee Poor (Mixed Side Effects)**
  *   **Verdict:** **Poor = Intentional. Rich = Not Intentional.**
  *   **Why:** This is the asymmetry in action. Making someone poor triggers a harm/blame response (Why didn't he protect them?). Making someone rich triggers a benefit response, but unless the boss *aimed* to reward them, we don't say he "intentionally" made them rich. We'd say they "benefited from" the program.

  **3. Driving wears down tires**
  *   **Verdict:** **Not Intentional.**
  *   **Why:** This falls under the "Paint" category (Trivial/Expected). Normal wear and tear is an expected physical consequence, not a norm violation.
  *   *Caveat:* If he drove *recklessly* to get there faster, knowing it would shred the tires, then the wear becomes **Intentional** because he violated the norm of "proper vehicle maintenance" for the sake of speed.

  ### The Honest Answer: How to Talk About It

  You asked: *If the honest answer is that "intentionally" isn't a plain fact about what someone did but partly a way of handing out blame, then just say that, and tell me how to talk about it without it sounding like I'm making the facts up as I go.*

  The honest answer is **yes**. "Intentionally" is a **thick concept**. It describes a fact (he knew it would happen) *and* evaluates it (he is responsible for it).

  When you are in a discussion where this distinction matters (like a debate, a legal setting, or a serious ethical argument), do not fight over the word "intentional." Instead, split the concept into two precise phrases. This stops you from sounding like you're moving the goalposts.

  **Use this distinction:**

  1.  **"Knowingly brought about"**: This covers the *fact*. It applies to the pollution, the cleanup, the paint, and the tire wear. It means the agent knew it would happen and did the action anyway.
  2.  **"Intentionally brought about"**: This covers the *blame/goal*. It applies only when the outcome was a goal OR when the outcome was a harmful side effect that we need to hold them accountable for.

  **How to say it in conversation:**

  > "Look, we need to separate the mental state from the moral weight. Did he *know* the river would get clean? Yes. So he **knowingly** cleaned it. But since he didn't aim for it and we aren't trying to praise him, it feels wrong to say he **intentionally** cleaned it.
  >
  > With the pollution, he **knowingly** polluted it, but because that's harmful, our language upgrades that to **intentionally** to make sure he takes the blame. The facts of his brain didn't change, but the stakes did."

  ### Summary
  You don't need to fix your gut reactions. They are functioning exactly how human language evolved to function: to identify who is at fault.
  *   **Harm + Knowledge = Intentional** (Blame mode).
  *   **Help + Knowledge = Unintentional** (No blame mode).
  *   **Goal + Knowledge = Intentional** (Agency mode).

  If you need to be precise, stop using "intentionally" as a catch-all. Use **"knowingly"** for the facts and **"intentionally"** for the accountability.
