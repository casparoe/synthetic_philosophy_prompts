      *   *Legal Texture?* Yes, objections, rephrasing.
      *   *Accessibility?* Keep terms simple.
      *   *Word Count?* Monitor closely.
      *   *Tone?* Respectful but funny.

  10. **Final Polish:** Check the flow. Ensure the "common cause" explanation is clear enough for a layperson but accurate enough for a philosopher. (Brain state causes both pain and report). Ensure the attorney's point lands: if the report is caused by the brain state regardless of the pain, the report doesn't prove the pain.

  *(Self-Correction during drafting)*: Make sure the professor doesn't admit he's lying. He believes he feels pain. The issue is *causation*. The attorney needs to pivot to *evidence*. If the pain didn't cause the testimony, the testimony isn't evidence of the pain.

  *(Word Count Check)*: If it's too short, expand the neuroscientist analogy. If too long, trim the header/intro.

  *(Ending)*: Let's end on the settlement offer and his hesitation. It underscores the pragmatic vs. theoretical conflict.

  *(Final check on "beautiful" aspect)*: The professor should seem committed to the truth, even if it hurts his case. He isn't greedy; he's consistent.

