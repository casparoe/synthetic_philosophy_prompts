      *   **Form:** Court transcript (deposition in a personal injury case).
      *   **Characters:** Plaintiff (Philosophy Professor, defender of epiphenomenalism), Defense Attorney (well-read, sharp), Court Reporter (implied by format).
      *   **Tone:** Deadpan, no narrator, no winking, no strawmanning the professor. The view should be presented accurately (common cause argument) but challenged rigorously (paradox of phenomenal judgment).
      *   **Key Content:**
          *   Professor argues pain/belief share physical cause (brain state), so belief is reliable even if pain does nothing.
          *   Attorney challenges: (a) Report would be same without feeling (zombie argument), (b) What makes the belief *about* the feeling? (c) Neuroscientist could produce testimony via stimulation.
          *   Legal format constraints (yes/no, objections, "move to strike").
          *   Accessible to laypeople (no heavy jargon/real names).
          *   Length: 700-800 words.
          *   Ending: Ambiguous (destroyed lawsuit? made philosophical point? both?).
          *   Empathy: Don't be mean; the view is "beautiful."
      *   **Header:** Case-caption style.

  2.  **Brainstorming & Notes:**
      *   *Case Name:* Needs to sound generic. *Smith v. University*? *Doe v. College*? Let's go *HARRISON v. STATE UNIVERSITY BOARD*.
      *   *Professor:* Dr. Arthur Harrison. Calm, precise, trying to maintain philosophical integrity within legal constraints.
      *   *Attorney:* Ms. Sterling. Sharp, uses his own logic against him without needing to understand the metaphysics fully, just the implications.
      *   *Core Conflict:* He wants money for "pain and suffering." His theory says pain causes nothing, including the request for money.
      *   *The "Common Cause" Defense:* Brain state X causes Pain Y and Verbal Report Z. Y doesn't cause Z. X causes both.
      *   *The Attorney's Trap:* If X causes Z regardless of Y, why do we need Y? How do you know Y exists? Why is this lawsuit about Y?
      *   *Legal Texture:* "Please state your name," "Objection," "Move to strike," "Settlement discussion."
      *   *Ending:* The settlement offer highlights the absurdity. He accepts? He hesitates? The transcript ends mid-thought or on a procedural note.
      *   *Word Count Check:* Need to be concise. Dialogue drives length.

  3.  **Drafting - Section by Section:**

      *   *Header:* Standard legal format.
