  7.  **Writing - Second Pass (Focusing on constraints):**
      *   Need to hit the word count (700-800).
      *   Need the specific attorney moves (a, b, c).
      *   Need the legal formatting (Q/A, pauses).
      *   Need the ending ambiguity.

  8.  **Drafting the Content (incorporating into final output):**
      *   *Header:* CASE NO. 23-CV-0892.
      *   *Dialogue:* Start with the theory. Move to the injury.
      *   *Attorney Move:* "If I stimulated your brain..."
      *   *Professor Reaction:* A pause. A realization.
      *   *Ending:* The settlement number. Does he take it? The transcript cuts.

  9.  **Review against Constraints:**
      *   *Strawman?* No, give him the "common cause" reply.
