  SUPERIOR COURT OF CALIFORNIA, COUNTY OF ALAMEDA
  CASE NO. 23-CV-0892
  DEPOSITION OF DR. ARTHUR HARRISON

  **APPEARANCES:**
  **MS. STERLING**, Counsel for Defendant
  **DR. HARRISON**, Plaintiff

  **MS. STERLING:** Dr. Harrison, please state your profession for the record.

  **DR. HARRISON:** I am a Professor of Philosophy.

  **MS. STERLING:** And you have published academic papers regarding the nature of consciousness?

  **DR. HARRISON:** Yes. Specifically on the causal role of subjective experience.

  **MS. STERLING:** In your paper, *The Shadow on the Wall*, you argue that pain is real, but it does not cause behavior. Is that accurate?

  **DR. HARRISON:** Substantially, yes. My position is that the physical brain state causes the behavior, such as crying out or withdrawing a hand. The feeling of pain accompanies the brain state, but it does not push the hand away. It is a byproduct. Real, but causally idle.

  **MS. STERLING:** Like a shadow cast by a runner. The shadow moves, but it doesn't pull the runner.

  **DR. HARRISON:** That is an acceptable analogy.

  **MS. STERLING:** You are suing the University for damages related to "pain and suffering." Is that correct?

  **DR. HARRISON:** Yes.

  **MS. STERLING:** Sir, if the pain itself causes nothing, what caused you to file this lawsuit?

  **DR. HARRISON:** (Pause) The underlying neural activity. The brain state associated with the injury causes the belief that I am in pain, and that belief causes the legal action. The pain and the lawsuit share a common physical cause.

  **MS. STERLING:** So the pain didn't make you sue. The neurons did.

  **DR. HARRISON:** The neurons caused the suing. The pain was present.

  **MS. STERLING:** I'd like to follow up on that. If the neurons cause the lawsuit regardless of whether the pain exists, would you have filed this same claim if you had the same brain state but no feeling of pain?

  **DR. HARRISON:** Theoretically, yes. A philosophical zombie with my brain structure would file the same claim.

  **MS. STERLING:** Objection. Non-responsive.

  **MS. STERLING:** I'll rephrase. If the feeling plays no role in the decision, then your testimony today about your feeling is produced entirely by physical mechanics. Correct?

  **DR. HARRISON:** Yes.

  **MS. STERLING:** And those mechanics would produce this exact testimony even if you felt nothing at all.

  **DR. HARRISON:** (Pause) Yes.

  **MS. STERLING:** So, Doctor, how is this testimony evidence that you feel anything? If the output is identical with or without the feeling, the output doesn't prove the feeling exists.

  **DR. HARRISON:** It proves it to me. I have direct access to my own experience.

  **MS. STERLING:** But you just told us that access doesn't cause you to speak about it. Your brain does. So when you say "I feel pain," are you reporting the feeling, or are you reporting the brain state that makes you say you feel pain?

  **DR. HARRISON:** I am reporting the feeling. The brain state ensures the report is reliable.

  **MS. STERLING:** How? If the link is purely physical, what makes the belief *about* the feeling rather than about the brain? If I stimulate the relevant neurons with an electrode, you would say "I feel pain" even if I didn't pinch you.

  **DR. HARRISON:** That is... physiologically plausible.

  **MS. STERLING:** If a neuroscientist could produce this entire deposition by poking your cortex with a wire, without any injury and without any actual pain, would your testimony be false?

  **DR. HARRISON:** (Long pause) The testimony would be the same.

  **MS. STERLING:** Would it be true?

  **DR. HARRISON:** (Pause) I...

  **MS. STERLING:** Let's move to damages. You're requesting two million dollars for suffering. But if suffering doesn't cause actions, it doesn't cause the distress required for damages. The distress is just physics.

  **DR. HARRISON:** The distress is real. The physics merely parallels it.

  **MS. STERLING:** But the check you want us to write? That's caused by physics. Not by the suffering.

  **DR. HARRISON:** (Silence)

  **MS. STERLING:** I have a settlement offer here, Doctor. Fifty thousand. Full release. It avoids the risk of a jury finding that your own theory precludes your claim.

  **DR. HARRISON:** (Pause) Does the offer acknowledge the injury?

  **MS. STERLING:** It acknowledges the event. It doesn't specify the cause of the settlement.

  **DR. HARRISON:** (Pause) If I accept, does that mean the pain caused the acceptance?

  **MS. STERLING:** I'm not a philosopher, Doctor. I'm an attorney. Do you want the check?

  **DR. HARRISON:** (Long silence)

  **MS. STERLING:** Doctor?

  **DR. HARRISON:** I need to consult my counsel.

  **MS. STERLING:** Of course. Let the record show the witness appeared unsettled by the line of questioning.

  **DR. HARRISON:** I object to that characterization.

  **MS. STERLING:** Noted. We'll wait outside.

  **(Deposition suspended at 11:45 a.m.)**
