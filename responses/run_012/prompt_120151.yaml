answer: |-
  The position you are describing is most precisely called **Causal Compatibilism** (sometimes situated within **Non-Reductive Physicalism**). The specific status of the higher-level objects (simmballs, traffic jams) is that of **Real Patterns**. The explanatory mechanism that makes them indispensable without adding "push" is called a **Program Explanation**.

  The specific mistake you identified—thinking that explanatory indispensability implies extra ontological force—is the **Zero-Sum Causal Fallacy** (or the **Causal Exclusion Fallacy**).

  Here is the conceptual carving you asked for, distinguishing this view from its neighbors and applying it to your examples.

  ### 1. The Core Concept: Causal Compatibilism
  This is the view that higher-level causation and lower-level causation are not competitors. They do not fight over the same "causal territory."

  *   **The Lower Level (Simms):** Provides the **causal production**. This is where the energy, force, and physical mechanisms reside. If you trace the transfer of momentum, it stays here.
  *   **The Higher Level (Simmballs):** Provides the **causal relevance**. This is where the *reason* for the event resides. It selects *which* lower-level interactions matter for the outcome we care about.

  In this view, saying "the simmball caused the shift" and "the simms caused the shift" are both true, but they are true in different senses. The simms *produced* the change; the simmball *explains* why that production resulted in *this* specific outcome rather than another.

  ### 2. The Ontological Status: Real Patterns
  You mentioned it "doesn't feel right to say the simmball is nothing." The philosophical term for an entity that is not fundamental substance but is also not a mere fiction is a **Real Pattern** (a term popularized by Daniel Dennett).

  *   **Not a Fiction:** A real pattern has predictive power. If you ignore simmballs, your predictions become computationally impossible or wildly inaccurate. The pattern is "real" because it captures objective regularities in the noise.
  *   **Not a Substance:** A real pattern does not add new stuff to the universe. It is a way the stuff is arranged. It exists *in virtue of* the substrate, not *alongside* it.

  ### 3. The Explanatory Mechanism: Program Explanation
  This explains *why* the higher level is indispensable if it doesn't add force. A **Program Explanation** (a concept from Frank Jackson and Philip Pettit) argues that higher-level properties "program" the outcome by constraining the lower level.

  *   **Analogy:** Think of a vending machine. You put in a coin (higher-level property: "being a valid coin"), and you get a soda.
  *   **Lower Level:** The specific metallic composition, weight, and diameter of the coin trip the sensor.
  *   **Higher Level:** The fact that it is a "valid coin" ensures that *any* coin with those physical traits would have worked.
  *   **The Point:** The higher-level description ("valid coin") explains the robustness of the outcome. It tells you that the specific micro-details (scratches on the coin) didn't matter, only the pattern did. The simmball description tells you which configurations of simms lead to which outcomes, filtering out the irrelevant noise. It doesn't push; it *selects*.

  ### 4. The Mistake: The Zero-Sum Causal Fallacy
  You asked for a name for the error of thinking indispensability implies extra causal work. This is the **Zero-Sum Causal Fallacy**.

  *   **The Error:** Assuming causation is a limited resource. If the simms did 100% of the causing, there is 0% left for the simmball. Therefore, if the simmball is real, it must add extra force.
  *   **The Correction:** Causation is not a conserved quantity like energy. It is a relationship of dependency. The simmball's causation is *constituted* by the simms' causation, not added to it. To demand the simmball push *on top of* the simms is a category error, like asking if the "hole" in the donut adds weight to the dough.

  ### 5. Distinguishing from Neighbors
  Here is how this carving differs from the concepts you mentioned:

  *   **Vs. Epiphenomenalism:** Epiphenomenalism says the higher level is a shadow—it is caused by the lower level but causes *nothing* in return. Your view says the higher level *does* cause things (it is causally relevant), it just doesn't *produce* the energy. It makes a difference to the outcome, even if it doesn't supply the force.
  *   **Vs. Strong Downward Causation:** Strong downward causation suggests the higher level can override or act independently of the lower-level laws (e.g., the simmball pushes the simm in a way physics shouldn't allow). Your view rejects this; the simmball only "pushes" insofar as the simms allow it to.
  *   **Vs. Supervenience:** Supervenience is the dependency claim ("no change in simmballs without a change in simms"). It describes the *link*, but not the *causal role*. Your view accepts supervenience but adds that the supervenient property is causally relevant, not just a tag.
  *   **Vs. Weak Emergence:** Weak emergence usually focuses on unpredictability (you have to simulate the simms to know what the simmball does). Your view focuses on explanatory indispensability. You can have a real pattern even if it is theoretically predictable from the bottom up, provided the bottom-up prediction is too complex to be useful.

  ### 6. Careenium vs. Traffic Jam: Are they the same?
  Metaphysically, **yes**. Both are **Kinematic Waves** or **Macroscopic Patterns** constituted by micro-entities moving according to local rules.

  *   **The Traffic Jam:** The jam moves backward. No car moves backward. The "jam" is a real pattern. It causes cars to brake (causal relevance). But the braking is physically caused by the car ahead (causal production).
  *   **The Careenium:** The simmball moves. No simm moves that way individually. The "simmball" is a real pattern. It causes other simmballs to react.

  **The Difference (Epistemic, not Ontological):**
  The difference lies in **Computational Irreducibility** and **Intentionality**.
  1.  **Readability:** In a traffic jam, you can define the pattern purely geometrically (density of cars). In the Careenium (which is an analogy for a mind), the simmballs often represent *symbols* or *meanings*. The pattern is defined not just by shape, but by its functional role in a system of interpretation.
  2.  **Stability:** Simmballs in Hofstadter's analogy are designed to be stable enough to carry "meaning." Traffic jams are fleeting.
  3.  **The "Read Off" Problem:** You asked if the higher level can be read off the lower level. In principle, **yes** (ontologically). In practice, **no** (computationally). This is the boundary. If you cannot compress the lower-level data into a higher-level rule without losing predictive power, the higher-level pattern is **Explanatorily Autonomous**.

  ### Summary Definition
  If you need a label to hold onto, the position is **Causal Compatibilism regarding Real Patterns**.

  *   **Inside the boundary:** Traffic jams, market prices, software running on hardware, biological functions (heart pumping), mental states (believing it will rain). All are real, all explain outcomes, all are fully constituted by physical substrate without adding energy.
  *   **Outside the boundary:** Ghosts, souls, vital forces, magic. These claim to add *extra* causal production or exist independently of the substrate.
  *   **The Mistake to avoid:** The **Zero-Sum Causal Fallacy**. Do not confuse "explaining the outcome" with "powering the outcome." The simmball explains *why* the simms moved this way rather than that way, but the simms provide the *oomph*.
