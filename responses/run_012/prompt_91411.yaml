          5.  Identification of merely verbal disputes (if any).

  2.  **Deconstruct the Discursive Dilemma:**
      *   *Scenario:* A group judges premises ($P$, $Q$) and a conclusion ($C$), where $C \iff P \land Q$.
      *   *Paradox:* Majority vote on $P$ (Yes), Majority on $Q$ (Yes), but Majority on $C$ (No).
      *   *Impossibility Theorem (List & Pettit):* No aggregation function satisfies Universal Domain, Anonymity, Systematicity/Independence, and Collective Rationality (consistency & completeness) for non-trivial agendas.
      *   *Incomplete Judgments:* If the group can abstain (output "no judgment"), the impossibility might be avoided or transformed.

  3.  **Drafting - Section 1: Agreed Claims (The Technical Core):**
      *   Need to state the formal setup clearly.
      *   Define the agenda ($X$), the profile of judgment sets ($J_1, ..., J_n$), and the aggregation function ($F$).
      *   State the conditions leading to impossibility (List-Pettit Theorem conditions).
      *   Address the "incompleteness" clause (what happens if we allow gaps?).
      *   *Tone:* Neutral, formal, mathematical/logical precision.

  4.  **Drafting - Section 2: Party Positions:**
