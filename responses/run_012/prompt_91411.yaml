answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON THE DISCURSIVE DILEMMA**

  **Date:** October 26, 2023
  **Seminar:** Formal Social Choice Theory (Advanced)
  **Collaborators:** The Collectivist Agency Working Group (Party A) & The Methodological Individualist Coalition (Party B)

  ### Preamble

  Over the course of the term, the undersigned parties have engaged in structured debate regarding the ontological and normative status of the discursive dilemma (also known as the doctrinal paradox). While we remain divided on the metaphysical implications of collective judgment, we have reached consensus on the formal properties of the problem, the conditions under which inconsistency arises, and the specific points of divergence that prevent full theoretical unification. This document records our agreed technical findings, our distinct interpretive frameworks, and the empirical cruxes that will determine the future trajectory of this debate.

  ---

  ### Part I: Agreed Technical Claims

  Both parties endorse the following formal characterization of the discursive dilemma and the constraints on aggregation rules.

  1.  **The Formal Setup:** Let $N$ be a set of individuals ($|N| \geq 3$) and $X$ be an agenda of propositions closed under negation. We focus on a standard connective agenda where $X$ contains premises $p, q$ and a conclusion $c$, such that $c \leftrightarrow (p \land q)$.
  2.  **Judgment Sets:** Each individual $i$ holds a judgment set $J_i \subseteq X$, which is assumed to be consistent and complete (for the baseline impossibility result).
  3.  **Aggregation Function:** An aggregation function $F$ maps any profile of individual judgment sets $(J_1, ..., J_n)$ to a collective judgment set $J_{group}$.
  4.  **Conditions Generating Inconsistency:** We agree that no aggregation function $F$ can simultaneously satisfy the following four conditions without generating inconsistent collective judgments on the standard connective agenda:
      *   **Universal Domain:** $F$ accepts all logically possible profiles of consistent and complete individual judgment sets.
      *   **Collective Rationality:** The output $J_{group}$ must be consistent and complete.
      *   **Anonymity:** The identity of individuals does not affect the outcome; only the number of votes matters.
      *   **Systematicity (or Independence):** The collective judgment on any proposition $p \in X$ depends only on individual judgments on $p$, and the same dependency rule applies to all propositions in $X$.
  5.  **The Effect of Incompleteness:** We agree that if the condition of **Collective Rationality** is relaxed to permit **incompleteness** (i.e., the group is permitted to abstain or issue "no judgment" on specific propositions within the agenda), the impossibility result is avoided.
      *   Specifically, an aggregation rule can satisfy Universal Domain, Anonymity, and Systematicity while maintaining *consistency* if it is allowed to output a judgment set that is not *complete*.
      *   *Consequence:* The group may affirm $p$ and $q$ but abstain on $c$ to avoid contradiction, or affirm $p$ and $q$ and leave $c$ undefined. This preserves logical consistency at the cost of decisional capacity.
  6.  **Procedural Solutions:** We agree that restoring completeness requires abandoning Systematicity. This leads to the distinction between:
      *   *Premise-based procedures:* Aggregate on $p$ and $q$, derive $c$ logically.
      *   *Conclusion-based procedures:* Aggregate on $c$ directly, ignoring logical relations to premises.

  ---

  ### Part II: Divergent Interpretations

  While the mathematics are agreed, the interpretation of what the mathematics *means* differs fundamentally.

  #### Party A: The Collectivist Agency View
  *Endorsed by proponents of group realism and functionalist ontology.*

  > "The discursive dilemma demonstrates that groups function as distinct agents subject to norms of rationality that are not reducible to the rationality of their members. When a group's judgment set becomes inconsistent via majority voting, it is not merely a voting glitch; it is a failure of **group rationality**. The group, as a corporate entity, has a doxastic state that can be irrational even if every member is rational. Therefore, the dilemma imposes a constraint on how groups must structure their deliberation to maintain agency. To act as a unified agent, the group must prioritize logical consistency (often via premise-based procedures), even if this overrides the majority view on the conclusion. The 'group belief' is a real functional state required for the group to be held morally and practically responsible for its actions."

  #### Party B: The Methodological Individualist View
  *Endorsed by proponents of social choice theory and reductionist ontology.*

  > "The discursive dilemma reveals a constraint on **aggregation mechanisms**, not on group minds. 'Group belief' is a *façon de parler*—a shorthand for the outcome of a specific decision rule applied to a profile of individual judgments. There is no ontological entity 'the group' that holds a belief; there are only individuals and the rules they bind themselves to. The dilemma shows that we cannot have a decision rule that is fair (anonymous), independent (systematic), and always produces a decisive, consistent outcome. When we allow incompleteness (abstention), we are not preserving group rationality; we are acknowledging that the aggregation rule has failed to produce a mandate. The problem is one of institutional design, not metaphysical repair."

  ---

  ### Part III: The Cruxes

  We identify two primary cruxes where our interpretations diverge. For each, we specify the evidence both sides agree is relevant, and the distinct predictions each side makes regarding future research and observation.

  #### Crux 1: The Referent of "Group Judgment"
  **The Dispute:** Does the term "group judgment" refer to a single functional state of the collective (Party A), or does it ambiguously shift between an *aggregative sense* (the vote count) and a *deliberative sense* (the reasoned output) (Party B)?

  *   **Agreed Case Bearing on the Crux:** Both sides agree that in legal and corporate contexts, groups are treated *as if* they have single judgments (e.g., a court's ruling, a board's resolution). Both agree that when inconsistency arises, the group typically resorts to a premise-based procedure to restore consistency for the sake of action.
  *   **Party A Prediction:** Future social ontology will confirm that groups possess "plural subjects." As we study complex AI collectives or decentralized autonomous organizations (DAOs), we will observe emergent rationality constraints that cannot be explained by individual incentives alone. The "single referent" model will prove more predictive of group behavior.
  *   **Party B Prediction:** Future analysis will show that the "single referent" dissolves under scrutiny. When groups switch between premise-based and conclusion-based procedures, they are not optimizing for "group rationality" but responding to external incentives (e.g., legal liability vs. member satisfaction). The "divided sense" model will prove more predictive, showing that "group belief" is context-dependent shorthand.

  #### Crux 2: The Normative Status of Incompleteness
  **The Dispute:** When a group permits its judgment set to be incomplete (abstaining on $c$ to preserve consistency), is this a rational exercise of epistemic caution (Party A) or a failure of the aggregation rule to perform its function (Party B)?

  *   **Agreed Case Bearing on the Crux:** Both sides agree that allowing incompleteness resolves the logical paradox. Both agree that in high-stakes environments (e.g., supreme courts), groups often issue narrow rulings (incompleteness) to avoid establishing contradictory precedents.
  *   **Party A Prediction:** Normative theory will evolve to view incompleteness as a virtue of group agency. A group that abstains to avoid contradiction is exhibiting higher-order rationality. This will become a standard metric for evaluating institutional health.
  *   **Party B Prediction:** Normative theory will view incompleteness as a "deadlock cost." Institutions will be designed to minimize abstention by restricting the agenda or altering the decision rule (e.g., requiring supermajorities). Incompleteness will be modeled as a transaction cost of aggregation, not an epistemic feature of the group.

  ---

  ### Part IV: Diagnosis of Merely Verbal Dispute

  Upon review, we conclude that a portion of our dispute is **merely verbal**, specifically regarding the **metaphysical substrate of belief.**

  *   **The Verbal Component:** The dispute over whether a group "literally" holds a belief hinges on the definition of "belief."
      *   If Party A defines "belief" functionally (a state that guides action and is subject to norms of consistency), then groups *do* literally hold beliefs.
      *   If Party B defines "belief" phenomenologically (requiring a conscious mental substrate or a single biological brain), then groups *do not* literally hold beliefs.
  *   **Explanation:** Both parties agree on the functional facts: groups process information, output decisions, face consistency constraints, and are held responsible. Party A chooses to label this functional role "belief." Party B reserves "belief" for the individual psychological state and labels the group output "aggregate decision."
  *   **Resolution:** We acknowledge that if we adopt a unified functionalist vocabulary, the ontological disagreement vanishes. However, we retain our distinct terminologies because they signal different normative priorities: Party A's terminology prioritizes *accountability of the collective*, while Party B's terminology prioritizes *procedural fairness for the individual*.

  **Signed,**

  *Dr. Elena Vance, Lead Representative, Collectivist Agency Working Group*
  *Prof. Marcus Thorne, Lead Representative, Methodological Individualist Coalition*
