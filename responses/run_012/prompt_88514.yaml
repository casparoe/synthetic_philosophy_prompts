  You press me to treat the grave uncertainties of geopolitics and investment as if they were spins of a roulette wheel, but this is precisely the superstition I sought to dismantle. To demand a buying and selling price is to demand I pretend a logical relation exists where there is none. It is not indecision to refuse a wager on a proposition where the evidence provides no basis for partial entailment; it is an acknowledgment that the future is unknown, not merely risky. Your argument regarding the book of tickets holds only within a closed system of exhaustive outcomes, but the open system of human affairs offers no such closure. To act is not always to bet; often it is to rely on convention, on the assumption that the present state of affairs will continue absent specific reason to expect otherwise, or simply on animal spirits. Refusing to name a price is not a failure of rationality; it is a refusal to lie about the evidence.

  Furthermore, you confuse the weight of an argument with a second-order probability. Weight is the completeness of the evidence upon which a probability is based, not a probability about that probability. A low weight means the evidence is scant, not that I am cautious about my calculation. To reduce this to a subjective state of mind is to psychologize what is fundamentally a logical defect in the premise. I do not require a coherent set of betting odds to be rational; I require only that I do not pretend to knowledge I cannot possess. Your calculus may be internally consistent, but consistency alone does not conjure evidence from the void.

  So I put this to you: If the evidence is genuinely absent, as I claim it is for a war in five years, upon what ground do you rest your subjective number? Is it not mere whim disguised as mathematics, and if so, why should I trust your consistency more than my honest admission of ignorance?
