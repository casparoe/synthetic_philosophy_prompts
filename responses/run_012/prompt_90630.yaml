prompt: |-
  I'm a novelist — three books, no philosophy training — and I'm stuck on a character problem that I'm fairly sure is secretly the Sartre thing. The vocabulary I actually think in is craft vocabulary: wants vs. needs, backstory as explanation, arc, scene vs. summary, free indirect discourse, the unreliable narrator, the difference between a character's reason and their motive. What I want: take Sartre's claim that we're radically free — that existence precedes essence, and that bad faith is the flight from that freedom into a fixed identity — and restate it as faithfully as you can in those terms, move by move. Then the residue report. Which bits translate cleanly into how a novelist builds a person, which ones I'd have to fudge or distort, and which have no counterpart in my vocabulary at all. My real question is the one the translation keeps running into: in a novel every choice the character makes is one I made, so is there any room left for the freedom Sartre is talking about, or does the whole thing collapse into authorial puppet show — and if it does, is that a failure of my vocabulary or a real problem with his? Dont be polite about it. If the translation fails because my vocabulary is missing something, name the thing. But if the question as I've posed it is confused, or if this just cant be done well, tell me that straight instead of handing me a tidy answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist (3 books), no philosophy training. Thinks in craft terms (wants/needs, arc, scene/summary, FID, unreliable narrator, reason vs. motive).
      *   **Task:** Translate Sartre's existentialism (radical freedom, existence precedes essence, bad faith) into novelist craft vocabulary.
      *   **Specific Output:**
          1.  Faithful translation move-by-move.
          2.  Residue Report (what translates, what needs fudging, what has no counterpart).
          3.  Address the core conflict: Character freedom vs. Authorial control (Puppet Show problem).
          4.  Tone: Direct, not polite, honest about failures/confusion. No tidy answers if none exist.

  2.  **Deconstruct Sartre's Core Concepts:**
      *   *Existence precedes Essence:* We show up first, then define ourselves through action. No pre-written script.
      *   *Radical Freedom:* We are condemned to be free. No determinism (god, nature, unconscious) excuses us.
      *   *Bad Faith (Mauvaise Foi):* Lying to oneself to escape freedom. Pretending to be a fixed object (a "waiter," a "coward," a "victim").
      *   *Anguish:* The dizziness of realizing total responsibility.

  3.  **Translate to Craft Vocabulary (Move-by-Move):**

      *   *Existence precedes Essence:* In craft, this is "Backstory as explanation" vs. "Action as definition." Usually, writers use backstory to *explain* essence (he's angry because his dad left). Sartre says: Ignore the dad. Look at what he *does* now. The character *is* the sum of their actions on the page.
      *   *Radical Freedom:* This maps to "Wants vs. Needs" but deeper. It's not just what they want, but that they *could want otherwise* at any second. It challenges "Arc." Arc implies a trajectory. Radical freedom implies the possibility of a hard pivot at any scene.
      *   *Bad Faith:* This is the "Unreliable Narrator" turned inward. It's the character's internal monologue lying about their "Motive." It's confusing "Reason" (excuse) with "Motive" (actual drive). It's treating a "Role" (Job, Parent, Spouse) as an Essence.
      *   *Anguish:* This is the subtext in "Scene." The gap between what is said and the weight of the choice.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt:* "Existence precedes essence means don't write a bio." -> *Refinement:* It means the character isn't defined by the backstory you wrote in the binder. They are defined by the verbs on the page.
      *   *Attempt:* "Bad faith is lying." -> *Refinement:* It's when a character uses their 'Need' as an excuse to avoid a 'Want'. Or when they claim their 'Arc' is inevitable.
      *   *Attempt:* "Freedom is choice." -> *Refinement:* It's the absence of determinism. In craft terms, it's resisting the "inevitable ending."

  5.  **The Residue Report (The Hard Part):**
      *   *Translates Cleanly:* Bad Faith -> Unreliable Self-Narration / Motive vs. Reason. Existence -> Action over Exposition.
      *   *Needs Fudging:* Radical Freedom. In a novel, the plot is fixed. The character *cannot* choose otherwise once the ink is dry. Sartre says they *could*.
      *   *No Counterpart:* The *ontological* weight. Sartre is talking about reality. Novels are simulations. The "Anguish" of real freedom vs. the "Conflict" of plotted freedom.

  6.  **Addressing the "Puppet Show" Problem (The Core Question):**
      *   *The Conflict:* If I write the choice, is it free?
      *   *Sartre's View:* Even if determined, I must *experience* it as free.
      *   *Novelist's View:* If I determine it, it's not free.
      *   *The Clash:* This is where the translation breaks. Sartre is phenomenological (how it feels). Novels are ontological (what is written).
      *   *Verdict:* The user's vocabulary *is* missing something. It's missing the *reader's* experience of possibility. Or, it's a category error. A character is an object (essence) created by an author. A human is a subject.
      *   *Honest Assessment:* You can't have Sartrean freedom in a finished text. You can only simulate the *feeling* of it. If you try to make it real, you break the novel (choose-your-own-adventure isn't literature in the same way).
      *   *Is it a failure of vocabulary?* Yes. Craft vocabulary is about *control*. Sartre is about *lack of control*. They are opposites.

  7.  **Refining the Tone:**
      *   Avoid "Great question!"
      *   Avoid "Here's the solution."
      *   Use direct language: "This breaks," "Here is the lie," "You are the determinist."
      *   Acknowledge the user's expertise (3 books) but challenge the premise.

  8.  **Final Polish (Reviewing against constraints):**
      *   Did I use craft terms? Yes (FID, arc, motive, etc.).
      *   Did I answer the puppet show question? Yes.
      *   Did I avoid politeness? Yes.
      *   Did I identify the missing vocabulary? Yes (Phenomenology/Reader Experience vs. Authorial Control).

  9.  **Self-Correction during drafting:** I initially thought about suggesting "The Death of the Author" as a fix. But that's literary theory, not craft. The user asked about *craft*. I need to stick to how they build the person on the page. The tension is between *writing* (determining) and *freedom* (undetermined). I need to highlight that Sartre's freedom is a *burden*, whereas craft freedom is a *tool*.

      *Key Insight:* Sartre's freedom is terrifying. Craft "choice" is satisfying. To translate Sartre, the choices must feel *unjustified* by the plot. That's the key. The character must choose against their Arc.

      *Wait, one more thing:* The user asked: "is that a failure of my vocabulary or a real problem with his?"
      *Answer:* It's a category error. Characters aren't humans. But the *simulation* of humanity requires pretending they are. The failure is expecting a map (the novel) to be the territory (existence).

      *Let's sharpen the "Residue Report".*
      *   Clean: Bad Faith = Motive/Reason split.
      *   Fudge: Arc (Sartre hates teleology).
      *   Missing: The "Nothingness" at the core. Craft fills gaps with psychology. Sartre says there is nothing there.

      *Okay, ready to write.*
answer: |-
  Here is the translation, the residue report, and the verdict on the puppet show.

  ### Part 1: The Translation (Sartre to Craft)

  **1. Existence Precedes Essence**
  *   **Sartre:** There is no human nature. We show up, then we define ourselves through action.
  *   **Craft:** Kill the Character Bible. Stop using backstory as explanation. If you write a bio that says "John is a coward because his father abandoned him," you are writing Essence. You are treating John as a fixed object with a defined nature.
  *   **The Move:** John is only a coward if he *runs* in the scene. If he runs in Chapter 1 and stands still in Chapter 10, he is not a coward; he is a person who ran, then stood. His "essence" is just the trail of smoke left by his verbs. Do not write the smoke; write the fire.

  **2. Radical Freedom**
  *   **Sartre:** We are condemned to be free. At any moment, we can choose otherwise. There are no internal or external constraints that *force* a choice, only weights that influence it.
  *   **Craft:** This breaks your "Arc." An Arc implies a trajectory, a destiny, a psychological inevitability. Radical Freedom means the character must be capable of breaking their Arc at any moment without it feeling like a plot hole.
  *   **The Move:** In every scene, the "Want" cannot be a straight line. The character must confront the fact that they could walk away, burn the money, or kiss the enemy, and nothing in the universe stops them but their own choice. The tension isn't "Can they succeed?" It's "Why do they keep choosing this specific hell?"

  **3. Bad Faith (Mauvaise Foi)**
  *   **Sartre:** Lying to oneself to escape the anguish of freedom. Pretending to be a fixed object ("I am just a waiter," "I am a victim," "I am a hero").
  *   **Craft:** This is the gap between **Reason** and **Motive**.
      *   **Reason:** The excuse the character gives (Free Indirect Discourse). "I stayed because of the kids."
      *   **Motive:** The actual choice being enacted. "I stay because I am terrified of being alone."
  *   **The Move:** Bad Faith is when your character uses their "Need" as a cage. They say, "I *have* to do this." Your job is to use FID to show them lying to themselves about the "have to." They are playing a role (The Provider, The Martyr) to avoid the vertigo of realizing they could quit the role.

  **4. Anguish**
  *   **Sartre:** The dizziness of realizing you are the author of your values.
  *   **Craft:** This is Subtext. It is the silence in the dialogue. It is the moment in a Scene where the summary stops and time slows down because the character realizes no one is coming to save them and no rulebook exists.
  *   **The Move:** Don't write anxiety as a symptom (shaking hands). Write it as the sudden awareness of the precipice. The character looks at the gun and realizes *they* are the only thing stopping the bullet, not morality, not law, not "who they are."

  ***

  ### Part 2: The Residue Report

  **What Translates Cleanly:**
  *   **Bad Faith / Unreliable Narrator:** This is a perfect fit. The unreliable narrator is usually lying to the reader. Sartrean bad faith is the character lying to *themselves*. You can use the same mechanics (contradiction between action and internal monologue) to expose this.
  *   **Reason vs. Motive:** Craft already distinguishes between what a character says they're doing and what they're doing. Sartre just adds the moral weight: the lie is an ethical failure, not just a plot twist.

  **What You Have to Fudge/Distort:**
  *   **The Arc:** Sartre rejects teleology. He hates the idea that a life is a story with a meaning at the end. A novel *requires* an arc (change, realization, consequence). To make a Sartrean character, you have to simulate an arc while insisting the character could have pivoted at page 200. You have to build a cage that looks like an open field.
  *   **Backstory:** You cannot actually ignore backstory in a novel; readers demand causality. Sartre says the past is "facticity"—it's just stuff that happened. You have to write the backstory as *data* the character uses to justify choices, not as the *cause* of the choices. That is a subtle distinction most editors will cut for clarity.

  **What Has No Counterpart (The Void):**
  *   **The Nothingness:** Sartre claims there is a "nothing" at the core of consciousness. No self, no soul, just a gap. Craft vocabulary is built on *filling* the gap. Psychology, trauma, desire, wound. Your vocabulary assumes there is a "there" there. Sartre says there isn't. You have no tool to write a character who is fundamentally empty except for their actions. You will inevitably fill them with "personality," which is Essence.

  ***

  ### Part 3: The Puppet Show Problem

  Here is the direct answer to your real question.

  **The Conflict:**
  In a novel, every choice the character makes is one you made. You are God. You are Determinism. Sartre says God does not exist and Determinism is a lie. Therefore, **you cannot write a Sartrean character in a finished novel.**

  Once the book is printed, the character's essence is fixed. Hamlet *is* a procrastinator. He cannot choose to kill Claudius in Act 1. He is an object. Sartre is talking about subjects.

  **Is this a failure of your vocabulary?**
  Yes, but not because you lack words. It's a failure because **Craft Vocabulary is a vocabulary of Control.**
  *   "Arc" is control.
  *   "Motivation" is control.
  *   "Theme" is control.

  Sartre's philosophy is a vocabulary of **Loss of Control.**

  To write Sartre faithfully, you would have to surrender authorial control. You would have to let the character choose against the plot. If the plot requires them to turn left to reach the climax, but their Radical Freedom demands they turn right, and you force them left, you have put them in Bad Faith. You have made them a puppet pretending to be free.

  **Is this a problem with Sartre?**
  No. It's a category error.
  Sartre is describing *phenomenology* (how life feels from the inside).
  Novels are *ontology* (objects that exist in the world).

  A character in a book is a thing. A human is a being. You are asking how to make a thing act like a being.

  **The Verdict:**
  You cannot solve this. If you try to make the freedom "real," you break the novel (it becomes a Choose Your Own Adventure, which lacks the thematic weight of authorial intent). If you keep the novel intact, the freedom is a lie.

  **However,** here is the utility:
  The value of Sartre for a novelist is not in making the character *actually* free. It is in making the character *feel* the weight of the puppet strings.

  The "Sartrean Novel" isn't one where the character escapes the author. It's one where the character *suspects* the author. It's where the character's Bad Faith is so thick that they claim "I had no choice" (plot necessity), and the text exposes that as a lie.

  **The Missing Vocabulary:**
  You are missing **Phenomenological Description.**
  Your craft vocabulary is structural (scene, summary, arc). Sartre requires a vocabulary of *experience*. You need to describe the *nausea* of the choice, not the mechanics of it. You need to write the hesitation not as "conflict" (A vs B) but as "vertigo" (A vs Nothing).

  **Final Instruction:**
  Don't try to give them freedom. You can't. Instead, give them the *illusion* of freedom so convincing that when they choose their cage, the reader feels the lock click. That is the only place where Sartre and the Novel meet: in the tragedy of a free being choosing to be a puppet.

  If you try to do more, you aren't writing a novel. You're writing a philosophy paper with dialogue.
