answer: |-
  **Project Title:** Robustness Without Validity: A New Framework for Interpersonal Comparisons of Well-Being

  **Summary**
  Interpersonal comparisons of well-being (IPC) remain the central stumbling block for welfare economics and ethical theory. The debate is currently stalled between ordinalist scepticism, which deems IPC scientifically illegitimate, and constructive programmes (e.g., extended preferences, subjective well-being scales), which attempt to build specific scales to render IPC possible. Both sides operate under a binary assumption: comparability is either possible or impossible. This proposal advances a graded alternative: a comparison is *robust* to the extent that its sign remains invariant across the class of admissible scalings. However, I argue that robustness and validity come apart. A comparison can be robust—surviving every admissible convention—and still be wrong, if the conventions share a structural bias. Over twelve months, I will formally characterize the admissible class of scalings and test existing survey instruments to determine: (1) whether a non-trivial class of robust comparisons exists, and (2) whether robustness is a reliable guide to validity. The result will be a methodological framework that rejects the sceptic's conclusion without accepting the constructivist's complacency.

  **Research Questions and Theoretical Context**
  The project addresses two determinate questions. First, *does there exist a non-trivial class of interpersonal comparisons that are robust under the admissible class of scalings?* Second, *is robustness a reliable proxy for validity?*

  Existing literature leaves both questions open because it treats comparability as an all-or-nothing property. The ordinalist sceptic argues that because well-being measures are unique only up to positive monotonic transformations, IPC lacks cognitive content. This position assumes that if a comparison is not invariant under *all* monotonic transformations, it is inadmissible. Conversely, constructive programmes respond by fixing a specific scaling convention (e.g., cardinal unit comparability) and proceeding as if the measurement problem were solved. They implicitly assume that if a comparison holds under their chosen scale, it is valid.

  Both positions ignore the space between "all transformations" and "one transformation." By focusing on the *admissible* class—scalings we have independent reason to admit based on psychometric or ethical grounds—we can identify comparisons that are robust without requiring the impossible standard of invariance under all monotonic transformations. However, the literature further assumes that robustness implies validity. This is a category error. Robustness is a property of the relationship between a measure and a class of transformations; validity is a property of the relationship between a measure and the truth. If the admissible class of scalings is constrained by a shared bias (e.g., a systematic underestimation of adaptive preferences), comparisons may be robustly wrong. By failing to distinguish stability from accuracy, current approaches risk codifying bias under the guise of methodological rigor. This project presses hardest on this divergence. It does not merely apply a distinction; it demonstrates that the standard defence of IPC (that it is robust) fails to secure the standard objection (that it is valid), forcing a revision of practice that neither the sceptic nor the constructivist anticipates.

  **Methodology**
  The project combines formal measurement theory with empirical case studies. This mixed approach is necessary because pure philosophical analysis cannot determine the size of the robust class, while pure economic application typically assumes the scale rather than testing sensitivity.

  *Phase 1: Formal Characterization (Months 1–4).*
  I will define the admissible class of scalings ($\mathcal{A}$). This will not be the broad class of all ordinal transformations, nor the narrow class of ratio scalings. Instead, $\mathcal{A}$ will be constrained by independent plausibility conditions derived from psychometric theory and ethical commitments (e.g., respecting reported intensity rankings). Using this class, I will derive the conditions under which a comparison $W_i(x) > W_j(y)$ retains its sign for all $f \in \mathcal{A}$. This yields a formal map of the "robust zone."

  *Phase 2: Empirical Case Studies (Months 5–8).*
  I will apply this framework to existing public data from major well-being instruments (e.g., EQ-5D, SWB life-satisfaction scales). Rather than collecting new data, I will re-analyze existing datasets by applying different scalings from $\mathcal{A}$ to the same responses. For example, I will test whether the judgment that "severe depression is worse than mild back pain" holds across linear, logarithmic, and power-law transformations of the reported scores. This tests Question 1 (Existence). To address Question 2 (Validity), I will identify cases where robustness is high but external validity is contested (e.g., comparisons involving disabled populations where adaptation bias is suspected). By contrasting robust rankings against qualitative evidence of bias, I will demonstrate the divergence between stability and truth.

  *Justification of Approach.*
  Alternative approaches are insufficient. A purely conceptual analysis would fail to quantify the "size" of the robust class, leaving the sceptic's worry intact. A standard economic approach would simply select a best-fit scale, ignoring the sensitivity of the result to that choice. A purely experimental approach (collecting new data) is beyond the scope of a one-year fellowship and unnecessary given the richness of existing survey archives. This project's innovation is to treat the scaling convention not as a premise to be defended, but as a variable to be manipulated.

  **Expected Outcomes and Failure Conditions**
  The project succeeds if it produces a formal taxonomy of robust comparisons and a demonstrable case where robustness diverges from validity.
  *   *Positive Result:* Identification of a substantial set of comparisons (e.g., severe vs. mild states) that are robust, alongside a proof that robustness fails to track validity in contexts of shared measurement bias (e.g., adaptation). This validates the "robustness-first" methodology for some cases while warning against it for others.
  *   *Failure Conditions:* The project fails if the robust class is empty or trivial (confirming the ordinalist sceptic) or if robustness and validity prove perfectly correlated across all case studies (confirming the constructivist's implicit assumption). A third failure mode is finding an irreducible tension between robustness and validity with no principled way to choose between them, leaving practice paralyzed. Even these "negative" results would be substantive contributions, but the working hypothesis is that the robust class is non-trivial but normatively insufficient.

  **Feasibility and Scope**
  Twelve months is sufficient for this scope because the project relies on re-analysis of existing data rather than new data collection, which requires ethical approval and significant time.
  *   *Months 1–3:* Formal modeling of the admissible class $\mathcal{A}$ and derivation of invariance conditions.
  *   *Months 4–8:* Data processing and sensitivity analysis on 2–3 major survey datasets.
  *   *Months 9–12:* Synthesis of formal and empirical results; drafting of two papers (one theoretical, one applied); presentation at centre workshops.

  The work fits the centre's mission by bridging the gap between philosophical measurement theory and applied welfare economics. It offers economists a more rigorous way to report uncertainty in IPC, and it offers philosophers a concrete way to engage with the empirical reality of well-being measurement without succumbing to scepticism. By showing that robustness is not validity, the project clears the ground for a more honest methodology: one that admits when comparisons are stable but potentially biased, rather than hiding behind the claim that they are scientifically settled.
