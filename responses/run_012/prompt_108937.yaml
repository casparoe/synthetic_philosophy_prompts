      *   *The "Hook":* The stalemate between sceptics and constructivists. Both assume comparability is binary.
      *   *The Twist:* Robustness is not validity. This undermines the "robustness-first" approach often implicitly used by constructivists, without conceding to the sceptic.
      *   *The Questions:*
          1.  Does a non-trivial class of robust interpersonal comparisons exist?
          2.  Is robustness a reliable proxy for validity?
      *   *Methodology:* Formal modeling (measurement theory) + Empirical analysis (survey data re-scaling).
      *   *Timeline:* 12 months. Needs to be tight.
      *   *Failure Conditions:* Empty set or irreducible tension.

  3.  **Drafting - Section by Section:**

      *   **Title:** *Robustness Without Validity: A New Framework for Interpersonal Comparisons of Well-Being.*

      *   **Introduction (The Problem):** Start with the stalemate. Ordinalists say "no." Constructivists say "yes, via scale X." Both treat comparability as a switch (on/off). This ignores the *degree* of agreement across measurement conventions.
      *   **The Proposal's Core:** Introduce "robustness" as invariance under admissible scalings. But immediately pivot to the critical insight: Robustness $\neq$ Validity. Shared biases can make wrong comparisons robust.
      *   **Research Questions:** Make them sharp.
          1.  *Existence:* Is the set of robust comparisons empty, trivial, or substantial?
          2.  *Normativity:* Does robustness track truth (validity)?
      *   **Critique of Existing Literature:** Why haven't they answered this? Ordinalists stop at "impossible." Constructivists pick *one* scale (e.g., SWB) and assume it works. Neither tests the *space* of scales against the *truth* of the comparison. They conflate stability with accuracy.
      *   **Methodology:**
          *   *Part 1: Formal.* Define the admissible class of transformations. Not just ordinal, but plausible cardinalizations.
          *   *Part 2: Empirical/Case Studies.* Take existing data (e.g., EQ-5D, SWB surveys). Apply different scalings. Check sign stability.
          *   *Why this method?* Pure philosophy is too abstract. Pure economics assumes the scale. This bridges them by testing the *sensitivity* of the economic tools using philosophical rigor.
      *   **Outcomes & Failure:**
          *   *Success:* Mapping the "robust zone" and demonstrating where it diverges from validity (perhaps via simulation or known biases).
          *   *Failure:* If the robust set is empty (sceptic wins) or if robustness perfectly aligns with validity (constructivist wins too easily/unrealistically). The interesting result is the *divergence*.
      *   **Timeline:**
          *   Months 1-3: Formal framework.
          *   Months 4-8: Data analysis/Case studies.
          *   Months 9-12: Synthesis, writing, workshops.
      *   **Fit:** Mention the centre's focus (philosophy + applied welfare econ).

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Constraint Check:* The prompt asks for *two pages*. I need to be concise. No fluff.
      *   *Tone Check:* Ensure it doesn't sound like I'm just applying measurement theory. The philosophical punch is the *normative* claim (robustness isn't validity).
      *   *Clarification:* Make sure the distinction between "admissible scalings" and "truth" is clear. Admissible = methodologically permissible. Truth = actual well-being difference.
      *   *Critique:* I need to press harder on why existing positions leave this open. The ordinalist says "no scale is privileged." The constructivist says "Scale A is privileged." Neither asks "If we allow all non-privileged scales, do we agree?" And crucially, neither asks "If we agree, are we right?"
      *   *Scope:* 12 months is short. Don't promise new data collection. Promise re-analysis of existing public data.

  5.  **Final Review against Prompt:**
