answer: |-
  You are describing a robust version of **Etiological Teleosemantics** (à la Millikan, Papineau, Neander) bolstered by Dennett's **Intentional Stance** (specifically the realist reading of "free-floating rationales"). You are claiming that selection history grounds both function (normativity) and content (aboutness) without requiring a conscious subject.

  You asked to split the position because the vulnerabilities differ. They do. Normativity relies on the coherence of "proper function" without a valuer; Aboutness relies on the ability of selection to pin down specific semantic content. Below are the three most significant defeaters, ranked by severity, focusing on where the view's own defenders often retreat into stipulation.

  ### 1. The Indeterminacy of Selection Criteria (Fatal for Aboutness)
  **The Argument:** Selection selects for *fitness*, not *truth* or *reference*. This is Fodor's "Disjunction Problem" applied to evolution. Consider the frog's snap. It was selected for catching flies. But flies correlate perfectly with "small moving black dots" in the frog's evolutionary history. Did selection select for the mechanism representing *fly* or *small moving black dot*? Both explain the survival equally well. If the history underdetermines which property was the target of selection, the content is indeterminate. If the content is indeterminate, it isn't representation.

  **Why it counts:** This attacks the core claim of "genuine representation." If the physical history of selection does not privilege *fly* over *black dot*, then the "rationale" isn't actually attached to the structure in a way that fixes meaning. It remains a "free-floating rationale" only in the sense that *we* can interpret it either way, which collapses your view into instrumentalism (Dennett's weaker claim) rather than the realism you seem to want ("genuine representation").

  **The Defense & The Dodge:**
  *   **The Defense:** Teleosemanticists (Millikan, Neander) argue we look at the *Normal Conditions* under which the mechanism performed its function. The mechanism worked because there were *flies*, not just dots. The content is what caused the success in the past.
  *   **The Dodge:** This often smuggles in the very intentionalism it seeks to naturalize. To specify "Normal Conditions" as "conditions with flies" rather than "conditions with dots" requires describing the environment in a way that already privileges the *fly* description. If the selection process itself is blind to the distinction, asserting that the history fixes *fly* is a philosopher's stipulation, not a fact of the selection history.
  *   **Legitimacy:** If your interlocutor shrugs and says, "We just define the content as the distal cause that contributed to fitness," they are dodging. They are asserting that selection *can* distinguish between co-extensive properties without explaining the mechanism by which blind variation and retention does so. This is the single most damaging objection because it suggests the view cannot deliver determinate content, only determinate *causes*.

  ### 2. The Normative Gap (Severe for Normativity)
  **The Argument:** This addresses your worry (b). You distinguish between a structure that *reliably does X* and one that is *for doing X*. The critic argues that "selected for" is just a retrospective description of causal efficacy. To say a heart *ought* to pump blood is to say "hearts that pumped blood survived." But this is just a statistical generalization about the past. Where does the *normativity* enter? A three-legged dog is statistically abnormal, but is it *failing*? If "failure" just means "less likely to replicate," then normativity collapses into probability. If normativity is genuine (a standard that can be violated even if the violation persists), selection history alone seems insufficient to ground it.

  **Why it counts:** If you cannot bridge the Is-Ought gap, you don't have genuine normativity; you have "normativity*" (a functional label we apply). This makes your view vulnerable to eliminativism. If the "ought" is just a shorthand for "did in the past," then a mutant heart that pumps poison isn't *malfunctioning*, it's just *different*.

  **The Defense & The Dodge:**
  *   **The Defense:** Defenders argue that "proper function" is defined by the *ancestral contribution* to fitness, not current performance. A heart that doesn't pump is failing to meet the condition that explains its presence.
  *   **The Dodge:** This works for biology, but you extended this to RL and markets. In RL, weights settle because they minimized loss. If the environment shifts and the weights no longer minimize loss, are they *wrong* or just *obsolete*? If the view says "wrong" because of past history, it implies the system is bound to a dead environment. If it says "obsolete," the normativity is purely current reliability. Defenders often shrug here, saying, "It's normative relative to the selection regime."
  *   **Legitimacy:** This shrug is legitimate *only if* you accept a deflated notion of normativity. If you claim this solves the philosophical problem of normativity (how *ought* emerges from *is*), the shrug is a dodge. It explains functional assessment, not genuine normativity. It earns the distinction between "reliably does" and "for doing" only by defining "for doing" as "was selected for," which begs the question of whether "selected for" carries normative weight.

  ### 3. The Pan-Teleology / Swampman Consequence (Awkward but Survivable)
  **The Argument:** This addresses your worry (a). If selection history is the sole criterion, then (1) Swampman (a molecule-for-molecule duplicate with no history) has no mental states/functions, and (2) any system with a selection-like history (markets, immune systems, perhaps even eroding rocks if defined loosely enough) has functions/content.
  *   **Swampman:** Intuitively, Swampman sees a tree and thinks *tree*. Your view says Swampman has no thoughts, only blind causal interactions.
  *   **Pan-Teleology:** If markets have "rationales," do falling rocks have the rationale of "hitting the ground"? (No, no replication). But where is the line? If RL agents have rationales, does a thermostat?

  **Why it counts:** This tests the *cost* of the view. The Swampman consequence is counterintuitive but logically consistent. The Pan-Teleology risk is trivialization. If everything with a history has a rationale, "rationale" loses its explanatory power.

  **The Defense & The Dodge:**
  *   **The Defense:** Bite the bullet on Swampman. History is essential. Restrict selection to systems with *replication* and *differential retention* to avoid pan-teleology.
  *   **The Dodge:** Claiming RL or markets count as "selection" without clear replicators is often a metaphorical stretch to make the theory look applicable to AI/Econ.
  *   **Legitimacy:** The shrug on Swampman is legitimate. It is the price of a naturalistic, historical view. It is not a fatal flaw, just a revision of folk intuition. However, if you cannot rigorously define the boundary between "selection" (which grants rationales) and mere "causal stability" (which does not), the view becomes insulated from empirical test. You can always post-hoc claim a structure has a history if it looks functional, and lacks one if it doesn't.

  ### Explanatory Payoff vs. Rivals
  To justify the cost of these defeaters, your view must do work rivals cannot:
  1.  **Vs. Eliminativism:** Eliminativism cannot explain *error* without eliminating the mental. Your view explains misrepresentation (the frog snapping at a BB) as a *failure of function*, not just a causal mismatch. This preserves the intuition that the frog is *wrong*, not just different.
  2.  **Vs. Subject-Centric Intentionalism:** Subject-centric views (only conscious agents have content) cannot account for animal cognition or AI goal-directedness without positing hidden homunculi. Your view explains how a gradient-descent model can have a "goal" (minimize loss) without consciousness.
  3.  **Prediction:** Your view predicts that systems without selection history (e.g., random neural nets, Swampman) cannot have genuine content, even if behaviorally identical to those that do. This is empirically testable in principle (e.g., comparing trained vs. untrained networks), though difficult in practice.

  ### Insulation Check
  You asked if the view is insulated. **Yes, partially.**
  The insulation comes from the flexibility of "selection history." When a system behaves functionally, you posit a history. When it behaves randomly, you deny one. Because selection histories are often reconstructive narratives rather than fossilized data points (especially in RL or markets), it is difficult to falsify the claim that "there is a rationale attached." The view is insulated by making the "rationale" a theoretical posit derived from the *explanation* of the structure's presence, rather than an observable feature of the structure itself. If the explanation changes, the rationale vanishes, making the ontology dependent on our explanatory success.

  Verdict: The Indeterminacy of Selection Criteria — badly exposed.
