prompt: |-
  I run the interpretation side at a county museum service — I'm the person who signs off on gallery labels, on the "what we know about these people" panels, and increasingly on the archaeological sections of planning documents where a developer has to say what the site they're about to bulldoze means before they bulldoze it. My problem is that I've got four writers, none trained past a decent undergrad degree, and they keep making claims the evidence can't carry. Someone finds a pit of deliberately smashed pots and writes "a ritual of destruction expressing grief." Someone finds forty burials all oriented east and writes "a shared belief in rebirth." Someone finds the same style of brooch spread over two hundred miles and writes "a kingdom with a central administration." Sometimes those are fine. Usually they're guesses in confident prose, and my options are to wave them through or to argue with a colleague who just says "well, it's a reasonable interpretation" — and I never have a better answer ready on the spot. So what I want from you is a decision procedure my writers can actually run, half an hour per claim, in order: the questions to ask, what counts as a sufficient answer to each, the point where it just stops and says the objects can't settle this, and the point where it hands the call to me because it's a judgment about values or about what we owe the descendant communities we consult, not a fact about the dirt. I'd much rather it return too little than too much — I can live with a boring label.

  I know there's an old textbook picture where inference gets shakier as you climb from technology up through subsistence and economy to social organization and finally to religion and belief, and I know the general point that you need some bridging argument to get from a pattern in the ground to a meaning, and that the same pattern can be produced by very different beliefs. Don't lecture me on those — turn them into boxes to tick. In particular I want the procedure to force the writer to state the bridging premise out loud and say what would have to be true for it to hold; to distinguish a claim that people *did* something from a claim that they *believed* or *instituted* something, and to say what a belief leaves behind that a mere practice doesn't; to require more than one line of evidence and to check whether the lines are really independent or are all just the same assumption wearing different hats; and to say when an ethnographic analogy is allowed, which analogy, and what would break it. It should end in a fixed verdict — something like supported, provisional, or not supportable as written — with the conditions for upgrading later.

  Then run it on three: the smashed pots, the east-facing burials, and the brooch distribution. I want to see where it bites, and I want at least one where it tells me the thing I like is not supportable, because if it never does that it's useless to me. And be honest about where the procedure misfires — I suspect it will be bad with anything that hinges on scale or on absence of evidence, and I'd rather know that going in than find out in a planning inquiry.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Role:** Head of Interpretation at a county museum service. Responsible for gallery labels, informational panels, and archaeological planning documents.
      *   **Problem:** Four writers (undergrad level) make over-confident claims not supported by evidence (e.g., inferring belief from practice, inferring political structure from artifact distribution).
      *   **Goal:** A decision procedure (checklist/flowchart style) for writers to use *before* submitting claims.
      *   **Constraints:**
          *   Must take ~30 mins per claim.
          *   Must force explicit statement of "bridging premises."
          *   Must distinguish *doing* vs. *believing/instituting*.
          *   Must require independent lines of evidence.
          *   Must regulate ethnographic analogy.
          *   Must end in a fixed verdict (Supported, Provisional, Not Supportable).
          *   Must be conservative ("rather return too little than too much").
          *   Must include a "hand-off" point for value judgments/descendant community issues.
          *   Must be tested on three specific examples (Smashed Pots, East Burials, Brooch Distribution).
          *   Must include at least one "Not Supportable" verdict on a claim the user might like (to prove utility).
          *   Must acknowledge limitations (scale, absence of evidence).
      *   **Tone:** Professional, pragmatic, rigorous, not lecturing on theory but operationalizing it.

  2.  **Deconstruct the Archaeological Inference Problem:**
      *   The core issue is the "Middle Range Theory" problem (Binford), though I shouldn't use that jargon. It's about linking static material remains to dynamic human behavior/belief.
      *   *Practice* (breaking pots) $\neq$ *Meaning* (grief/ritual).
      *   *Pattern* (orientation) $\neq$ *Theology* (rebirth).
      *   *Distribution* (brooches) $\neq$ *Polity* (kingdom).
      *   The procedure needs to act as a filter that catches these leaps.

  3.  **Drafting the Decision Procedure (The "Interpretation Gate"):**
      *   *Structure:* Needs to be sequential. Step 1: Describe. Step 2: Infer. Step 3: Bridge. Step 4: Corroborate. Step 5: Ethics/Values. Step 6: Verdict.
      *   *Key Mechanism:* The "Bridging Premise." Writers must write down: "If X is in the ground, then Y happened." Then they must ask: "Is there any other way X gets in the ground?"
      *   *Evidence:* Needs to demand *independence*. Two pots aren't two lines of evidence. Pot + Text + Pollen = three lines.
      *   *Analogy:* Needs strict rules. Direct historical connection? Or general human behavior?
      *   *Verdict:* Needs clear criteria for "Supported" vs. "Provisional" vs. "Not Supportable."
      *   *Hand-off:* When does it become a political/ethical decision rather than an evidentiary one? (e.g., descendant community sensitivity).

  4.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is 30 minutes realistic?
      *   *Fix:* Keep the questions sharp. Don't ask for a literature review, ask for *one* counter-example.
      *   *Critique:* How to handle "absence of evidence"?
      *   *Fix:* Explicitly warn against it in the limitations section.
      *   *Critique:* How to ensure they distinguish doing vs. believing?
      *   *Fix:* Make that Step 2. If the claim is about belief, the evidence must be about *exception* to utility.

  5.  **Testing the Procedure on the Three Examples:**

      *   **Case 1: Smashed Pots (Ritual of Destruction/Grief)**
          *   *Evidence:* Pit of smashed pots.
          *   *Claim:* Ritual expressing grief.
          *   *Bridge:* "Smashing = Grief."
          *   *Counter-explanation:* Waste disposal? Accidental breakage? Hoarding failure?
          *   *Independent Evidence:* None provided.
          *   *Verdict:* Not Supportable. (This hits the user's requirement for a "claim I like is not supportable").
          *   *Revision:* Can we make it "Provisional"? Only if there's context (e.g., associated with a burial). If just a pit, it's trash. Let's make it "Not Supportable" to be strict.

      *   **Case 2: East-Facing Burials (Belief in Rebirth)**
          *   *Evidence:* 40 burials, east orientation.
          *   *Claim:* Shared belief in rebirth.
          *   *Bridge:* "East = Sunrise = Rebirth."
          *   *Counter-explanation:* Tradition without belief? Alignment with landscape? Christian influence (if applicable period)?
          *   *Independent Evidence:* Grave goods? Texts?
          *   *Verdict:* Provisional (if consistent over time) or Not Supportable (if just orientation). Let's aim for "Not Supportable as written" but allow "Practice of east-facing" to be Supported. The *belief* is the leap.

      *   **Case 3: Brooch Distribution (Kingdom/Central Admin)**
          *   *Evidence:* Same style brooch, 200 miles.
          *   *Claim:* Kingdom with central admin.
          *   *Bridge:* "Uniformity = Central Control."
          *   *Counter-explanation:* Trade? Fashion? Itinerant makers?
          *   *Independent Evidence:* Hoards? Production sites? Written records?
          *   *Verdict:* Not Supportable. Distribution $\neq$ Politics.

      *   *Selection for the Output:* I need to ensure at least one fails hard. The "Smashed Pots" is the easiest to crush. The "Brooch" one is also weak. I will make sure the procedure kills the *belief* claims hard.

  6.  **Addressing Limitations:**
      *   The user specifically asked for honesty about where it misfires (scale, absence of evidence). I need a dedicated section for "Known Failure Modes."

  7.  **Final Polish:**
      *   Tone check: Respectful of the user's expertise, direct with the writers.
      *   Formatting: Use boxes, bold text, and clear headers to make it usable as a handout.
      *   Ensure the "Hand-off" criteria are clear (when to call the boss).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Procedure Name:* The "Interpretive Load-Bearing Check."
      *   *Step 1:* The Claim (Separate Observation from Inference).
      *   *Step 2:* The Bridge (The "If-Then").
      *   *Step 3:* The Alternative (The "Null Hypothesis").
      *   *Step 4:* Independence (The "Triangulation").
      *   *Step 5:* Analogy (The "Comparison").
      *   *Step 6:* Ethics/Values (The "Hand-off").
      *   *Verdict:* Supported / Provisional / Not Supportable.

      *(Self-Correction on Case 1)*: If I make "Smashed Pots" not supportable, does that help the user? Yes, they said "I want at least one where it tells me the thing I like is not supportable." I will assume the user *likes* the "Ritual of Grief" narrative because it's engaging, but the procedure must kill it.

      *(Self-Correction on Case 2)*: East-facing burials. This is classic. Often Christian, but can be pre-Christian. The *belief* is the issue. The *practice* is observable. The procedure should force the label to say "Buried facing east" not "Believed in rebirth."

      *(Self-Correction on Case 3)*: Brooches. This is about scale. The procedure needs to flag "Political Complexity" as a high-risk inference.

  9.  **Final Review against constraints:**
      *   30 mins per claim? Yes, the questions are focused.
      *   Boxes to tick? Yes.
      *   Bridging premise explicit? Yes.
      *   Doing vs. Believing? Yes.
      *   Independent lines? Yes.
      *   Analogy rules? Yes.
      *   Fixed verdict? Yes.
      *   Hand-off point? Yes.
      *   Limitations acknowledged? Yes.

  10. **Constructing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your team. It is operational, not theoretical. It is intended to be printed as a one-page worksheet (front and back) that accompanies every draft label or panel text.

  It is called **The Interpretive Load-Bearing Check**.

  ***

  # THE INTERPRETIVE LOAD-BEARING CHECK
  **Time limit:** 30 minutes per claim.
  **Goal:** Prevent confident prose from outstripping the dirt.
  **Rule:** If a box cannot be ticked, the claim must be downgraded or cut.

  ## PHASE 1: SEPARATE OBSERVATION FROM INFERENCE
  *Do not write the label yet. Fill this section.*

  **1. The Observation (What is physically in the ground?)**
  *   [ ] Write the observation without verbs of intention (e.g., "placed," "built," "believed").
  *   *Example:* "A pit containing ceramic sherds from three vessels, all fractured in situ." (NOT "A ritual deposit of smashed pots.")
  *   **Pass:** Can you point to the object and say "That is exactly what this sentence describes"?

  **2. The Claim (What are you telling the public?)**
  *   [ ] Write the interpretive sentence.
  *   [ ] **Categorize the Claim:**
      *   [ ] **Tech/Func:** (e.g., "This pot held grain.")
      *   [ ] **Practice:** (e.g., "People broke pots here.")
      *   [ ] **Social/Political:** (e.g., "This was a kingdom.")
      *   [ ] **Belief/Meaning:** (e.g., "This expressed grief.")
  *   **Stop:** If the claim is **Social** or **Belief**, you must complete Phases 2 and 3. If **Tech/Func**, you may skip to Phase 4.

  ## PHASE 2: THE BRIDGING PREMISE
  *You must state the rule that connects Phase 1 to Phase 2.*

  **3. The "If-Then" Statement**
  *   [ ] Complete this sentence: "IF [Observation] is present, THEN [Claim] is true."
  *   *Example:* "IF pots are smashed in a pit, THEN it was a ritual of grief."

  **4. The Necessity Test**
  *   [ ] Is there any other way the Observation could exist without the Claim being true?
  *   [ ] List **two** alternative explanations (e.g., "Rubbish disposal," "Accidental breakage during move," "Hoarding gone wrong").
  *   **Fail Condition:** If you cannot list two plausible alternatives, you have not thought hard enough. Go back.

  **5. The Belief/Practice Distinction**
  *   [ ] If your claim is about **Belief** (e.g., rebirth, grief, status):
  *   [ ] What evidence exists that this practice was *not* purely utilitarian or habitual?
  *   [ ] *Requirement:* You must identify an element of "excess" or "constraint" (e.g., effort expended with no survival benefit, or a rule followed despite cost).
  *   **Fail Condition:** If the action could be explained by habit, convenience, or economics alone, you cannot claim "Belief."

  ## PHASE 3: TRIANGULATION & ANALOGY
  *One pattern is not a system.*

  **6. Independent Lines of Evidence**
  *   [ ] List the lines of evidence supporting the claim.
  *   [ ] **The Independence Test:** Are these lines truly independent?
      *   *Fail:* "The pots are ritualistic and the pit is ritualistic." (This is one line: context).
      *   *Pass:* "The pots are smashed (1), the pit is located away from the settlement (2), and pollen samples show flowers were present (3)."
  *   **Requirement:** Claims about **Belief** or **Politics** require a minimum of **two independent lines**. Claims about **Practice** require **one**.

  **7. Ethnographic Analogy (If used)**
  *   [ ] **Source:** Is the analogy from a direct descendant community, a geographically adjacent culture, or a general human universal?
  *   [ ] **Permission:** If using a descendant community analogy, has consultation occurred? (If YES, go to Phase 4 Hand-Off).
  *   [ ] **The Break Point:** State one condition that would make this analogy invalid (e.g., "If we find evidence of mass production, the 'gift exchange' analogy breaks").
  *   **Fail Condition:** You cannot use an analogy to *prove* the claim; it can only *illustrate* a supported claim.

  ## PHASE 4: VERDICT & HAND-OFF

  **8. The Hand-Off (When to call the Manager)**
  *   [ ] Does this claim touch on sacred practices of living communities?
  *   [ ] Does this claim define national/ethnic identity in a contested region?
  *   [ ] Does this claim rely primarily on the *absence* of evidence (e.g., "No weapons found, therefore peaceful")?
  *   **Action:** If any box is ticked, **STOP**. Do not write the label. Send to Manager.

  **9. Final Verdict**
  *   [ ] **SUPPORTED:** Observation is solid; Bridging Premise has no strong alternatives; Evidence is independent.
      *   *Action:* Write the claim confidently.
  *   [ ] **PROVISIONAL:** Observation is solid; Bridging Premise is plausible but alternatives exist; Evidence is thin.
      *   *Action:* Use hedging language ("May suggest," "Likely," "Interpreted as").
  *   [ ] **NOT SUPPORTABLE:** Alternatives are equally likely; Evidence is circular; Belief inferred from routine practice.
      *   *Action:* Rewrite to describe only the Observation (Phase 1). Cut the Claim.

  ***

  # TEST RUN: THREE CASES
  *Here is the procedure applied to your three examples. I have been strict, as requested.*

  ## CASE 1: The Smashed Pots
  **Draft Claim:** "A ritual of destruction expressing grief."
  **Observation:** "A pit containing deliberately smashed pottery sherds."

  1.  **Categorize:** Belief/Meaning. (Requires full check).
  2.  **Bridging Premise:** "IF pots are deliberately smashed in a pit, THEN it expresses grief."
  3.  **Necessity Test (Alternatives):**
      *   Alternative A: Waste disposal (broken items go in a pit).
      *   Alternative B: Termination of a household (moving house, breaking items that won't fit).
      *   Alternative C: Failed hoard (buried for safety, owner died, never recovered).
  4.  **Belief/Practice:** Is there "excess"?
      *   *Writer's Check:* No. Smashing pots is efficient for disposal. It saves space. No extra labor expended.
  5.  **Independence:**
      *   Line 1: Smashed pots.
      *   Line 2: None. (Location of pit not specified as distinct from midden).
  6.  **Verdict:** **NOT SUPPORTABLE.**
      *   *Reasoning:* The bridging premise fails the Necessity Test. Smashing is consistent with trash. Grief is one of ten possible motivations, none of which leave distinct material signatures here.
      *   *Label Rewrite:* "A deposit of deliberately broken pottery. While this may mark the end of a household or a ritual event, the specific reason is unknown."

  ## CASE 2: The East-Facing Burials
  **Draft Claim:** "A shared belief in rebirth."
  **Observation:** "Forty human burials, all oriented east-west, head to west."

  1.  **Categorize:** Belief/Meaning. (Requires full check).
  2.  **Bridging Premise:** "IF bodies face east, THEN they believe in rebirth (sunrise)."
  3.  **Necessity Test (Alternatives):**
      *   Alternative A: Social conformity/Tradition (doing it because parents did, no active belief).
      *   Alternative B: Landscape alignment (facing a specific hill or river that happens to be east).
      *   Alternative C: Religious prescription without internalized belief (institutional rule).
  4.  **Belief/Practice:** Is there "excess"?
      *   *Writer's Check:* No. Orienting a body costs no extra energy. It is a rule, not necessarily a belief.
  5.  **Independence:**
      *   Line 1: Bone orientation.
      *   Line 2: None. (No grave goods suggesting afterlife journey, no texts).
  6.  **Verdict:** **NOT SUPPORTABLE AS WRITTEN.** (Downgrade to **PROVISIONAL** only if hedged heavily).
      *   *Reasoning:* You can prove the *practice* of east-facing. You cannot prove the *theology* of rebirth without evidence of what they thought the east *was*.
      *   *Label Rewrite:* "The dead were consistently buried facing east. This orientation is often associated with sunrise and concepts of renewal, though the specific beliefs of these people remain unknown."

  ## CASE 3: The Brooch Distribution
  **Draft Claim:** "A kingdom with a central administration."
  **Observation:** "Same style metal brooch found across 200-mile radius."

  1.  **Categorize:** Social/Political. (Requires full check).
  2.  **Bridging Premise:** "IF artifact style is uniform over 200 miles, THEN a central administration exists."
  3.  **Necessity Test (Alternatives):**
      *   Alternative A: Trade networks (goods move, people don't).
      *   Alternative B: Itinerant craftsmen (makers move, style moves).
      *   Alternative C: Fashion/Emulation (local elites copying a popular style).
  4.  **Belief/Practice:** N/A (Social claim).
  5.  **Independence:**
      *   Line 1: Brooch distribution.
      *   Line 2: None. (No evidence of standardized weights, no administrative centers, no written decrees).
  6.  **Verdict:** **NOT SUPPORTABLE.**
      *   *Reasoning:* Uniformity of style is a weak proxy for political structure. It proves *connection*, not *command*.
      *   *Label Rewrite:* "A distinctive brooch style found across the region. This suggests strong cultural connections or trade networks, though the political structure that facilitated this is unclear."

  ***

  # KNOWN FAILURE MODES (READ BEFORE USE)
  *This procedure is a filter, not a truth machine. It will misfire in the following conditions. If your claim hinges on these, you must call the Manager (Phase 4, Box 8).*

  **1. The Scale Problem**
  *   **Failure:** The procedure works on single sites or assemblages. It struggles with regional synthesis.
  *   **Risk:** A claim might be "Not Supportable" at Site A and Site B, but "Supported" when mapped across 50 sites.
  *   **Fix:** Do not use this sheet for regional overview panels. Use it for specific artifact/caption claims.

  **2. The Absence of Evidence**
  *   **Failure:** The procedure asks for "Independent Lines of Evidence." It does not handle "The lack of weapons suggests peace."
  *   **Risk:** Writers will tick "Observation" for an absence ("No swords found"). This is logically dangerous.
  *   **Fix:** Phase 1, Box 1 must describe *what is there*, not what isn't. If the claim relies on absence, it is automatically a **Hand-Off**.

  **3. The "Boring Label" Bias**
  *   **Failure:** This procedure is designed to return "Too Little." It will strip narrative flair.
  *   **Risk:** Labels may become dry lists of data.
  *   **Fix:** Accept this. It is better to be boring than wrong. Narrative can be added in the *audio guide* or *education pack* where provisional language is easier to manage. The wall text must be robust.

  **4. The Descendant Community Blindspot**
  *   **Failure:** The procedure treats "Consultation" as a binary tick-box in Phase 3.
  *   **Risk:** It does not capture the nuance of *how* a community wants their ancestors described. A claim might be archaeologically "Supported" but culturally offensive.
  *   **Fix:** Phase 4, Box 8 is the hard stop. If living communities are involved, archaeological support is secondary to community agreement.

  ***

  # IMPLEMENTATION NOTE FOR THE MANAGER
  *   **The "Hand-Off" is your safety valve.** If a writer ticks Box 8 in Phase 4, the ball is in your court. This is where you apply your experience, your relationships with descendant communities, and your risk tolerance for the planning inquiry.
  *   **Training:** Run a workshop where you give them a "Supported" claim that is actually wrong, and a "Not Supportable" claim that is poetically beautiful. Make them fail the check on the beautiful one. They need to learn that *beauty is not evidence*.
  *   **Planning Documents:** For developer bulldoze-docs, use the **Verdict** section strictly. If a developer's archaeologist submits "Not Supportable" claims as fact in a mitigation strategy, you have the paperwork to reject it.
