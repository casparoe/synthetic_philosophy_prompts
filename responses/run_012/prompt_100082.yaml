answer: |-
  This is a remarkably fertile analogy. Your legal training gives you a structural intuition for the particularist debate in ethics that often eludes those trained solely in systematic philosophy. The tension between codification (rule-based ethics) and case law (exemplarism) is not merely metaphorical; it is isomorphic in many respects.

  Here is the restatement of the debate in the vocabulary of common-law adjudication, followed by the residue report and the assessment of the case method.

  ### I. The Restatement: Moral Theory as Common Law

  **1. The Core Claim: Case Law vs. Codification**
  The debate between rule-based ethics (Kantianism, Utilitarianism) and exemplarism is a debate between **codification** and **common law**.
  *   **The Codifiers** argue that moral knowledge resides in statutes (universal maxims or calculus of utility). The agent's task is statutory interpretation: applying the general rule to the specific fact pattern.
  *   **The Exemplarists** argue that moral knowledge resides in **precedent**. The "law" of morality is not found in a code but emerges *a posteriori* from the adjudication of specific life-situations by persons of practical wisdom (*phronimos*). To learn morality is not to study the penal code but to read the **law reports** (biographies).

  **2. Biography as the Case Method**
  If exemplars are precedents, then biography is the **case method** of moral instruction. We do not learn the *ratio decidendi* of courage by defining it; we learn it by studying the "facts of the case" in the life of Achilles or Martin Luther King Jr. The student of ethics, like the law student, must extract the governing principle from the narrative texture. The goal is not to memorize rules but to develop a "legal instinct"—a capacity to perceive salient moral features in new fact patterns by analogy to old ones.

  **3. Hagiography as the Law Report**
  Hagiography functions as the **official law report**. Just as a law report edits the messy transcript of a trial into a coherent narrative of holding and reasoning, hagiography edits the messy life of a saint into a coherent narrative of virtue.
  *   **The Objection of Flattery:** The critic who says hagiography falsifies the saint is arguing that the **law report is inaccurate**. If the reporter omits the saint's doubts, sins, or contextual advantages, the "precedent" is misleading. It creates a "constructive virtue" that never existed in the raw facts, leading to erroneous reliance by future agents.
  *   **The Objection of Inimitability:** The critic who says the saint is too perfect to imitate is arguing that the case is **distinguishable on its facts**. "This precedent applies only to a person with grace/charisma/divine aid; my fact pattern lacks these elements." Therefore, the precedent has no **binding authority** over my conduct.

  **4. *Ratio Decidendi* vs. *Obiter Dictum***
  A crucial task in exemplarism is separating the **ratio decidendi** (the essential moral principle binding on all agents) from the **obiter dictum** (inspiring remarks or actions specific to the saint's context that do not create a binding duty).
  *   *Example:* Is St. Francis's poverty the *ratio* (binding principle: detachment from wealth) or *obiter* (contextual application: literal destitution in 13th-century Umbria)?
  *   Hagiography risks treating the entire life as *ratio*, creating a burden of **stare decisis** that is too heavy for ordinary agents to bear.

  **5. Plutarch's Pairs as Jurisdictional Comparison**
  Plutarch's method of pairing a Greek with a Roman (e.g., Alexander and Caesar) functions as **comparative law**. He is testing whether a virtue recognized in one jurisdiction (Greek *arete*) holds **persuasive authority** in another (Roman *virtus*).
  *   If both exemplars exhibit similar traits despite different cultural "statutes," we infer a **general jurisprudence** of human goodness.
  *   Where they diverge, we must **distinguish** the cases: Was this divergence due to a difference in local custom (culturally relative virtue) or a conflict in fundamental principle?

  **6. Overruling and Moral Progress**
  Moral progress is the process of **overruling precedent**. We may acknowledge that the Homeric hero was once binding authority for conduct, but we now **overrule** that precedent as incompatible with contemporary moral standards (e.g., regarding slavery or brutality). The exemplarist must explain how we can reject past exemplars without a codified standard to judge them by; the answer lies in the **evolution of the common law** itself, where later cases refine or reject the principles of earlier ones.

  ***

  ### II. The Residue Report

  Here is the audit of what survives the translation and what does not.

  **1. Intact Translations (High Fidelity)**
  *   **The Inductiveness of Moral Knowledge:** The claim that we reason from particulars to generals survives perfectly. Common law reasoning *is* the philosophical defense of particularism.
  *   **The Danger of Idealization:** The critique of hagiography maps cleanly onto the critique of biased law reporting. Both obscure the *facts material to the judgment*.
  *   **The Role of Distinction:** The objection that "I am not a saint" is legally precise. It is a plea that the precedent is not binding because the *material facts* of the agent's capacity and context differ from the precedent case.

  **2. Distorted Translations (Requires Strain)**
  *   **The Nature of Authority (*Stare Decisis*):** In law, precedent binds because of the **hierarchy of the court**. A Supreme Court decision binds a District Court. In morality, there is no hierarchy. Why does the saint "bind" the sinner? The translation distorts here because moral authority is **persuasive**, not **jurisdictional**. You can translate "binding" as "categorically obligatory," but the *mechanism* of that obligation is missing in the legal analogy. In law, you follow precedent to avoid reversal; in morality, you follow exemplars to achieve *eudaimonia*. The sanction is different.
  *   **The *Ratio* Extraction:** In law, the *ratio* is often a narrow rule of liability. In ethics, the *ratio* of a life is often a **disposition of character**. Extracting a rule from a life is harder than extracting a holding from a judgment because a life is not a decision *about* a case; it is a continuous performance.

  **3. No Counterpart (The Gap)**
  *   **Supererogation:** This is the significant residue. In common law, there is generally **no duty to rescue**. You are not liable for failing to be a hero. The law sets a floor (negligence), not a ceiling.
      *   In ethics, the saint often represents the **ceiling**. They perform supererogatory acts (going beyond duty).
      *   *The Gap:* A "supererogatory precedent" is a legal oxymoron. If a court rules that one *must* sacrifice one's life for another, it becomes a binding duty (and potentially unconstitutional). If the court says it is *praiseworthy* but not required, it is *obiter*.
      *   *Consequence:* The legal model struggles to account for the **inspirational** force of the exemplar that does not claim to **bind**. The law assumes that if a precedent is good, it should be followed (binding). Ethics allows for a precedent that is good to *admire* but impossible to *follow* without sainthood. The legal vocabulary lacks a category for "bindingly persuasive but not obligatory."
  *   **The Reflexive Judge:** In law, the judge adjudicates *others*. In morality, the agent adjudicates *themselves*. The "case method" in ethics is not just studying cases; it is **being the case**. This reflexivity has no counterpart in adjudication.

  **4. Diagnosis of the Residue**
  Does this mark a real gap or mere looseness?
  It marks a **real gap**. The legal framework is inherently coercive and systemic (maintaining order), whereas the exemplarist framework is inherently aspirational and teleological (achieving flourishing).
  *   If you force the legal model too hard, you turn the saint into a legislator, making their supererogatory acts into binding duties (moral legalism).
  *   If you loosen the model, you admit that "learning from lives" is less about *authority* and more about **aesthetic formation**. The law reports train the lawyer's *mind*; the saint's life trains the disciple's *desires*. The legal model captures the cognitive structure of the reasoning but misses the **conative** (desire-shaping) function of hagiography.

  ***

  ### III. Side Question: The Case Method (Moral vs. Legal Learning)

  Is the case method a better model of moral learning than it is of legal learning?

  **Verdict: Yes, but for different reasons.**

  *   **In Legal Learning:** The case method is often criticized for being **retrospective and cynical**. It teaches students to look for loopholes, to distinguish away unfavorable precedents, and to treat the law as a game of constraints. It trains technical proficiency but often at the expense of moral imagination. It is a tool for **conflict resolution**, not truth-seeking.
  *   **In Moral Learning:** The case method (exemplarism) is **prospective and imaginative**. It is not about finding loopholes to avoid duty, but finding analogies to expand one's capacity for virtue. Because morality lacks a rigid *stare decisis*, the moral "case method" allows for more creative analogical reasoning.
  *   **Why it is better for Morality:** Moral learning requires **empathy** and **simulation** (What would X do? How would X feel?). The legal case method, properly practiced, requires understanding the human facts behind the judgment. However, in morality, the "holding" is not a rule but a **habit**. The case method is superior for moral learning because moral knowledge is **know-how** (skill), not just **know-that** (proposition). The common law tradition preserves the idea that wisdom resides in practice, which aligns better with virtue ethics than with codified statute.

  However, there is a risk: Without the discipline of *stare decisis*, moral case reasoning can degenerate into **casuistry** (special pleading). The legal constraint is actually a virtue in ethics, preventing us from "distinguishing away" every difficult duty. So, while the *method* is better for moral formation, it needs the *constraint* of legal-style rigor to prevent self-deception.

  ***

  ### IV. Confidence Levels

  **1. Restatement of Positions (Common Law/Exemplarism Isomorphism)**
  *   **Confidence:** **95%**
  *   **Reasoning:** The structural parallels between case-based reasoning and particularist ethics are well-documented in philosophy of law (e.g., Cass Sunstein, analogical reasoning). The mapping of *ratio* to principle and *obiter* to context is robust.

  **2. Residue Report: Supererogation as a Gap**
  *   **Confidence:** **90%**
  *   **Reasoning:** The distinction between duty (law) and supererogation (saintliness) is a standard problem in ethics. The lack of a legal category for "non-binding excellence" is a clear structural mismatch.

  **3. Residue Report: The Nature of Authority (Persuasive vs. Jurisdictional)**
  *   **Confidence:** **85%**
  *   **Reasoning:** While the distinction is clear, some legal realists might argue legal authority is also ultimately persuasive (based on legitimacy). However, the coercive element of law remains a significant disanalogy.

  **4. Side Question: Case Method Efficacy**
  *   **Confidence:** **70%**
  *   **Reasoning:** This is the point of **least certainty**. Pedagogical efficacy is an empirical question in psychology and education, not purely conceptual. While the *fit* between virtue ethics and case method is conceptually tighter, claiming it is "better" involves normative judgments about the goals of education that are debatable. One could argue the legal case method's rigor is exactly what moral learning lacks and needs.

  **Point of Least Certainty:**
  I am least sure about the claim that the **case method is *better* for moral learning**.
  *   *Why:* It depends on whether you view moral learning primarily as **character formation** (where narrative/exemplar wins) or as **deliberative rigor** (where legal constraint wins). The legal case method can foster a kind of moral detachment ("thinking like a lawyer") that is detrimental to moral sensitivity. However, without the adversarial rigor of the legal method, moral reasoning can become sentimental. Balancing "formation" against "rigor" makes this a precarious claim.

  **Summary for your Dissertation:**
  Your intuition is sound. The common-law vocabulary clarifies the *mechanism* of exemplarism (analogy, distinction, evolution) but obscures the *telos* (supererogation, desire, flourishing). You can use the legal frame to defend exemplarism against charges of vagueness (it's not vague, it's case-based), but you must step outside the frame to explain why we are drawn to saints we cannot legally be required to imitate. The "supererogatory precedent" is the place where your dissertation should press hardest against the analogy.
