prompt: |-
  I'm a PhD student in moral philosophy, though I came to it from law — I read for a degree in it and practiced for two years before switching — so the common-law habit of reasoning from cases is more native to me than anything in the ethics literature I now read. My dissertation touches on the old question of whether one can learn to be good from exemplary lives: Plutarch's paired biographies, the saints' lives and the hagiographic idealization they underwent, and the contemporary revival of the idea that exemplars, rather than rules, are the primary objects of moral theory. I keep catching myself redescribing the whole debate in the vocabulary of precedent, and I want to know how much of it actually survives that redescription.

  Please restate, as faithfully as you can, the principal positions here — that moral knowledge is carried by the study of particular exemplary persons rather than by the derivation of general rules, that biography is consequently a mode of moral instruction, and the standard objections that hagiography flatters its subjects and that an inimitable saint teaches nothing — using the vocabulary of common-law adjudication: precedent and stare decisis, ratio decidendi as against obiter dictum, distinguishing and overruling a case, the case method, and the contrast between case law and codification. Treat each position as a claim about what binds and what merely persuades, and let the comparison across Plutarch's pairs do the work that comparing precedents from different jurisdictions does.

  Then give me the residue report. Which parts of the ethical debate pass through the translation intact, which pass only if I distort them, and which have no counterpart in common-law reasoning at all? I am especially interested in whether the residue marks a real gap — for instance, the thought that an exemplar may be supererogatory, going beyond what any rule could require, so that it can inspire without binding — or whether it merely shows that the talk of learning from lives was looser than the legal frame can tolerate. As a side question, say whether the case method is a better model of moral learning than it is of legal learning.

  Tell me how confident you are in each part of this, and single out the point you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** PhD student in moral philosophy, background in law (degree + 2 years practice). Native speaker of "common-law reasoning" (cases, precedent) rather than abstract ethical theory.
      *   **Topic:** Dissertation on learning to be good from exemplary lives (Plutarch, hagiography, contemporary exemplarism).
      *   **Task:**
          1.  Restate the principal ethical positions using common-law vocabulary (precedent, *stare decisis*, *ratio decidendi*, *obiter dictum*, distinguishing, overruling, case method vs. codification).
          2.  Treat positions as claims about what *binds* vs. what *persuades*.
          3.  Use Plutarch's pairs as analogous to comparing precedents from different jurisdictions.
          4.  Provide a "Residue Report": What translates intact? What requires distortion? What has no counterpart? (Focus on supererogation vs. bindingness).
          5.  Answer a side question: Is the case method a better model for *moral* learning than *legal* learning?
          6.  Provide confidence levels for each part and identify the point of least certainty.
      *   **Tone:** Academic, precise, respectful of both disciplines, acknowledging the user's specific background.

  2.  **Deconstruct the Ethical Debate into Legal Terms:**
      *   *Exemplarism (Virtue Ethics):* Moral knowledge comes from particulars (exemplars) not general rules. -> *Case Law:* Law emerges from specific adjudications, not just statutes (codification).
      *   *Biography as Instruction:* Studying lives teaches virtue. -> *The Case Method:* Studying past judgments trains the jurist.
      *   *Hagiography/Idealization:* Saints' lives are polished. -> *Headnotes/Official Reports:* Sanitized versions of facts that might obscure the messy reality of the decision.
      *   *Objection: Flattery/Inimitability:* Saints are too perfect/humanly impossible. -> *Distinguishing:* "This case is unique to its facts; it doesn't apply to me." Or *Obiter Dictum:* Inspiring words, but not binding law.
      *   *Plutarch's Pairs:* Comparing Greek/Roman figures. -> *Comparative Law/Jurisdictional Conflict:* Comparing precedents from different courts to find the underlying principle.

  3.  **Drafting the Restatement (The "Translation"):**
      *   *Core Claim:* Moral theory as Case Law vs. Codification. Kant/Utilitarianism = Codification (Rules). Exemplarism = Common Law (Precedent).
      *   *Binding Force:* *Stare Decisis*. Does the saint's life *bind* us to act likewise? Or is it persuasive authority?
      *   *Ratio vs. Obiter:* What is the essential moral principle (*ratio*) of the saint's action vs. the incidental details (*obiter*)? Hagiography risks turning the whole life into *ratio* when much of it might be context-specific *obiter*.
      *   *Distinguishing:* "I am not St. Francis; my facts are different." This addresses the inimitability objection.
      *   *Overruling:* Moral progress. We reject past exemplars (e.g., warrior heroes) as bad law.
      *   *Plutarch:* Jurisdictional comparison. Does the virtue hold across the Greek and Roman "circuits"?

  4.  **Drafting the Residue Report (The "Gap Analysis"):**
      *   *Intact:* The method of reasoning from particulars, the danger of idealization (reporting errors), the evolution of norms (overruling).
      *   *Distorted:* The concept of *bindingness*. Law *must* be followed (within a system); morality *ought* to be followed (but is voluntary). The "authority" of the exemplar is different from the authority of the court.
      *   *No Counterpart:* Supererogation. In law, you generally can't be *required* to do more than the law demands (no duty to rescue in many common law jurisdictions). In morality, saints do *more*. This is the biggest friction point. A "supererogatory precedent" is a legal oxymoron.
      *   *Looseness:* Moral learning is more osmotic/imitative than legal learning (which is analytical).

  5.  **Addressing the Side Question (Case Method: Moral vs. Legal):**
      *   Legal case method is often cynical or technical (finding loopholes). Moral case method is about formation (*habitus*).
      *   Argument: It might be *better* for moral learning because moral learning requires imagination and empathy, which narratives provide, whereas legal learning requires constraint and distinction. However, legal case method is more rigorous.
      *   Verdict: Better for *motivation/formation*, worse for *adjudication/conflict resolution*.

  6.  **Assigning Confidence Levels:**
      *   High confidence on the structural parallels (Case law vs. Code).
      *   High confidence on the Supererogation gap (Legal duty vs. Moral excess).
      *   Lower confidence on the "Case Method" comparative efficacy (Pedagogical psychology is tricky).

  7.  **Refining the Output (Self-Correction/Polishing):**
      *   *Check:* Did I use the specific terms requested? (*stare decisis*, *ratio*, *obiter*, etc.) Yes.
      *   *Check:* Did I address Plutarch's pairs as jurisdictional comparison? Yes.
      *   *Check:* Is the tone appropriate? Needs to be collegial but rigorous.
      *   *Check:* Did I answer the "least sure" prompt? Yes.
      *   *Nuance:* Ensure I don't imply Common Law is *just* case law (statutes exist), but focus on the *method* of reasoning.
      *   *Nuance on Hagiography:* Compare to "reported decisions" vs. "transcript." The editing process creates the precedent.

  8.  **Final Review against constraints:**
      *   Restate positions in legal vocab.
      *   Residue report (Intact, Distorted, No Counterpart).
      *   Side question (Case method efficacy).
      *   Confidence levels + Least sure point.

  *(Self-Correction during drafting)*: I need to be careful with *stare decisis*. In law, it binds *judges*. In morality, who is bound? The agent. But the agent is also the judge. This reflexivity is a key difference. I should highlight that in the residue report.

  *(Refining the Supererogation point)*: In law, doing "more" is usually irrelevant to liability. In morality, it's the peak of value. This is the critical "residue."

  *(Refining Plutarch)*: Plutarch isn't just comparing cases; he's comparing *cultures*. So it's like comparing Common Law vs. Civil Law, or NY vs. CA law, to find a "general jurisprudence."

  9.  **Final Polish:** Check the confidence ratings. Make sure they are explicit.

  *(Drafting the response...)*
  *   *Intro:* Acknowledge the brilliance of the analogy.
  *   *Section 1: The Translation.* Map Exemplarism to Common Law. Map Rule Ethics to Codification. Map Hagiography to Law Reports. Map Objections to Distinguishing/Obiter.
  *   *Section 2: Residue Report.* Categorize the fit. Highlight Supererogation.
  *   *Section 3: Side Question.* Pedagogical efficacy.
  *   *Section 4: Confidence.*

