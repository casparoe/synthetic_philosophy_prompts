answer: |-
  Friends, colleagues, family. Thank you for being here tonight.

  Twenty years is a long time for a firm to stand. Eleven years is a long time for one person to lead it. I stand before you to mark the end of my time, and to acknowledge the work we have done together.

  I owe thanks to the founding family. I owe thanks to the widow of the man who asked me to take this role. Your trust was not given lightly, and I have tried to carry it without dropping it. I thank the Kyoto office for their patience. I thank the engineers in this room for their precision. I thank my brother for his honesty. These words are not reports. They are debts I am paying.

  We have built things. We have solved problems that others left alone. We have also faced times when the work did not go as planned. It is important to say this clearly. There were projects that consumed resources and did not yield the result we wanted. Specifically, the Osaka contract took two years of our time. It required effort from every department. It did not succeed.

  I will not describe the technical reasons for that outcome tonight. The records exist. The people in this room who worked on it know what happened. To list the errors now would serve no purpose for this evening. We know the cost. We bear it together.

  My deputy worked beside me through that period. She is here tonight, and I am glad she came. I want to say one thing about her work that is a matter of record. On the fourteenth of November, during the final review phase, she flew to Kyoto to deliver the specifications in person. She returned the next morning. She did this because she believed the work required a face-to-face commitment. Later, when she concluded that the project could not be saved, she resigned. She told me in January that she could not stay. I accepted her resignation. I respect her judgment. She acted according to her conscience. That is what we require of engineers.

  There are things I know that I will not say. There are decisions made in those two years that belong to the archive, not to the dinner table. Silence can be a form of respect. It can also be a form of honesty. When I do not name a cause, it is not because I do not know it. It is because this occasion is for gratitude, not for audit. I ask you to hear that distinction.

  We are still here. The firm continues. The people in this room remain capable. We have learned where our limits are. Knowing a limit is not a failure. It is a condition of doing real work. We cannot build everything. We cannot save every contract. But we can stand by the work we have done.

  I am leaving the firm. I am not leaving the profession. I am not leaving the people. The distance between us will be geographical, not moral. I will watch your work with interest. I will answer calls when I can help.

  To the Dutch side of this room: I have not hidden the hard facts. To the Japanese side of this room: I have not diminished your standing. I have tried to speak in a way that survives the translation. I have tried to speak in a way that survives the morning.

  We have shared a table. We have shared a burden. Now we share the future.

  Please raise your glasses.

  To the firm. To the work. To each other.

  ***

  **Note to the Speaker**

  I wrote the opening thanks and the closing toast as ritual moves; they function as social glue rather than factual assertions subject to verification. The sentence closest to the line between softening and preventing action was "To list the errors now would serve no purpose for this evening," because it risks discouraging future accountability, but I kept it on the near side by anchoring it to the specific occasion rather than the work itself. If the Dutch half had not been in the room, I would have removed the explicit mention of the Osaka contract's failure and instead referred to it solely as "a challenging period," relying on the shared context to carry the weight without the blunt assertion.
