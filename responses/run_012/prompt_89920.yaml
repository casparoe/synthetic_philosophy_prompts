  I tried to optimize giving up my seat on the subway. Pure consequences. Just maximize the good. But here's the trap: If I stand, maybe I get tired and snap at a stranger, starting a feud that ends in a divorce. Or maybe I stand, someone sees me, gets inspired, cures cancer. The causal chains go on forever. The tiny comfort of my butt is nothing compared to the infinite variance of the future. I can't calculate it. The unknown effects completely swamp the known ones.

  So the theory says "calculate," but the calculation is impossible. So what's the move? I just default to "be polite." I give up the seat. But wait—if I'm just following a rule like "be polite," why did I need the ethical framework to tell me that? I built a supercomputer to tell me to follow my mom's advice.

  So now I stand there, swaying with the train, knowing my moral system is just a complicated way to justify doing what I would've done anyway. The theory was supposed to ground the habit, but the habit is the only thing that makes the theory usable. I'm not maximizing good; I'm just using high-level philosophy to excuse my instincts. The only way to succeed is to ignore the math. So I keep standing, feeling virtuous about my own confusion.
