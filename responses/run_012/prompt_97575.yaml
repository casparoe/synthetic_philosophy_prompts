answer: |-
  **Agreed:** Kant explicitly denies animals direct moral status because they lack rational autonomy. Duties regarding them are indirect, owed to "humanity in our own person."

  **Where the Reading Goes Wrong:** Your objection assumes the duty is consequentialist (wrong *because* it hardens). Kantians argue it's deontological: cruelty violates the duty to cultivate moral sentiment regardless of outcome. The maxim itself is forbidden, even if you feel no hardening.

  **Contested:** Scholars debate if this is sufficient. Traditionalists maintain the indirect view is coherent: animals are analogues of humans, and disrespecting them insults humanity. Critics argue this is anthropocentric nonsense. Contemporary Kantians (e.g., Korsgaard) argue Kantian principles *require* direct duties to sentient beings, as pain frustrates natural ends. Exegetes dispute if this fits Kant's text. Some suggest Kant implies a broader respect for life that he doesn't fully theorize.

  **Bottom Line:** The text supports indirect duties, but whether Kant's system *requires* this limitation or merely reflects 18th-century bias is live terrain. The "hardening" argument is the standard explanation, but not the only defensible one.
