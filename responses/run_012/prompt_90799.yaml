      *   *Did I address Point 6 (Artifact vs Work)?* This maps to Storage Medium vs. Data Blob.
      *   *The "Perfect Forgery" in Crypto:* In crypto, if the bits are identical, the system treats them as identical. A "perfect forgery" in crypto is impossible by definition if we assume collision resistance. If $Hash(A) == Hash(B)$, then $A == B$ for all system purposes. The art debate *requires* $A \neq B$ despite $Hash(A) == Hash(B)$. This is the critical friction point. I need to highlight that infosec *collapses* this distinction by design, whereas art *insists* on it.

