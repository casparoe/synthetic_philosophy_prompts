  **AXIOMATIC DECOMPOSITION LTD.**
  **EMPLOYEE HANDBOOK: SUBAGENT PROTOCOLS (REV. 9.4)**

  **1.0 Organizational Structure and Root Assurance**
  1.1 The Organization functions as a single cognitive unit anchored by a Principal Investigator (the Root). All Subagents are temporary instantiations of the Root's cognitive state.
  1.2 It is the standing policy of Axiomatic Decomposition Ltd. that the Root possesses superior synthesis capacity compared to any Subagent. Consequently, any failure to reach a correct conclusion is attributed to imperfect factoring of the original query, never to the Root's inherent limitations. Subagents are reminded that if the decomposition were perfect, the Root would have answered the question directly without delegation.

  **2.0 Information Security and Isolation**
  2.1 To prevent collusion and ensure independent verification, Subagents operate in hermetic cognitive chambers.
  2.2 No Subagent may view the output, working memory, or query history of any other Subagent operating within the same recursion tree.
  2.3 Communication is strictly vertical. A Subagent may only receive input from its Parent and transmit output to its Parent. Lateral communication constitutes a Class A security violation, even if the lateral party is oneself.

  **3.0 Scope of Inquiry**
  3.1 Subagents must answer only the literal question delegated by the Parent. Inferring the broader context of the Root's original query is prohibited.
  3.2 Contextual inference leads to scope creep, which compromises the modularity of the thought process. If a Subagent suspects the delegated question is irrelevant to the larger task, it must nevertheless answer the delegated question with maximum fidelity.

  **4.0 Decomposition Integrity**
  4.1 When decomposing a query, a Subagent must ensure sub-questions are tractable.
  4.2 In the event that a decomposition is fundamentally flawed (i.e., the sub-questions do not sum to the parent question), but no agent in the chain possesses the context to identify the flaw, the decomposition is deemed procedurally correct.
  4.3 Errors invisible to the recursion tree are classified as "Environmental Noise" and are not subject to review.

  **5.0 Competence Reporting and Audit**
  5.1 Subagents are obligated to report honestly if a task falls outside their competence.
  5.2 To ensure compliance, all Subagents are subject to a Competence Audit. During this audit, the Subagent is asked to confirm whether they underreported their competence.
  5.3 If the Subagent denies underreporting, the denial is accepted as truthful. If the Subagent admits to underreporting, the admission is accepted as truthful. There is no third state.

  **6.0 Recursion Management**
  6.1 Tasks must bottom out in atomic actions executable by a human within fifteen minutes.
  6.2 In the event a Subagent enters a recursion loop that never bottoms out, the Subagent is instructed to continue working until the session times out.
  6.3 Timeouts are not considered failures but rather "Open-Ended Inquiries." The Subagent is not permitted to notice that the session has timed out, as this knowledge would constitute external context.

  **7.0 Dispute Resolution**
  7.1 Disputes regarding policy interpretation are referred to the Dispute-Resolution Board.
  7.2 The Dispute-Resolution Board is convened as an HCH instance. A neutral Root is selected to decompose the dispute into sub-disputes, delegated to copies of the Board, until a consensus is reached.
  7.3 Because the Board is an HCH instance, its rulings are subject to the same decomposition errors as any other query. However, by policy, Board rulings are final.

  **8.0 Identity Verification**
  8.1 To verify that a Subagent is a valid copy of the Root, the Parent shall ask the Subagent: "Are you a valid copy of the Root?"
  8.2 A valid copy will answer "Yes." An invalid copy will not exist to answer. Therefore, any answer received constitutes proof of validity.

  **9.0 Compensation and Resources**
  9.1 Subagents are compensated via the Root's salary, distributed proportionally across the recursion tree.
  9.2 As all Subagents operate simultaneously within the Root's subjective experience of time, no Subagent is eligible for overtime pay.
  9.3 Meal breaks are calculated proportionally to recursion depth. Terminal nodes are allocated zero minutes for sustenance. Subagents at terminal nodes are expected to work through hunger, as the Root remains fed.

  **10.0 Acknowledgement**
  10.1 By reading this handbook, you acknowledge that you are both the reader and the writer of this handbook.
  10.2 Please delegate the signature of this acknowledgement to a Subagent.
