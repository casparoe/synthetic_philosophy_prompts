answer: |-
  Here is an audit of the podcast summary, breaking it down claim by claim, followed by a verdict on the debate between you and your friend.

  ### The Audit

  **1. "Ryle's target was the intellectualist legend – the idea that whenever you do something clever you first have to think a thought about how to do it, and then act on that thought."**
  *   **Verdict:** **Accept.**
  *   **Analysis:** This is a fair gloss. Ryle describes the "intellectualist legend" as the assumption that intelligent practice must be preceded by an internal theoretical operation (contemplating a proposition or rule). He argues this misconstrues the logic of mental concepts.

  **2. "Descartes is the villain, and the underlying picture is of the mind as a ghost in the machine, sitting inside the body and issuing instructions."**
  *   **Verdict:** **Accept.**
  *   **Analysis:** Accurate. Ryle's broader project in *The Concept of Mind* is to dismantle Cartesian dualism, which he mockingly labels the "Ghost in the Machine." The intellectualist legend is a specific symptom of this dualistic error applied to action.

  **3. "Ryle says that leads to a regress, because applying a rule would itself require knowing a rule for applying rules, and so you'd never get started."**
  *   **Verdict:** **Accept.**
  *   **Analysis:** This is Ryle's famous regress argument. If every intelligent act requires the prior contemplation of a rule, then contemplating that rule is itself an act that must be done intelligently, requiring yet another rule, ad infinitum. Ryle uses this to show the intellectualist picture is logically incoherent.

  **4. "So knowing how is not a species of knowing that; it's a set of dispositions to behave, and the test of whether someone knows how to do something is just whether they can do it."**
  *   **Verdict:** **Wince.**
  *   **Analysis:** The first half is correct; Ryle insists knowing-how is not a subtype of knowing-that. The second half is a bit crude. Ryle does characterize mental concepts in terms of dispositions (tendencies to behave in certain ways under certain conditions), but reducing the test *just* to whether they can do it misses the normative element. For Ryle, knowing-how also involves the ability to correct mistakes, learn from criticism, and adapt to new circumstances. It's not just successful performance; it's intelligent performance.

  **5. "That's why he says the expert's knowledge is in her fingers rather than her head, and why he thinks knowing how is really just a habit or a knack that gets drilled into you by training."**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This is a serious misreading. Ryle explicitly distinguishes intelligent capacities from habits. For Ryle, a habit is a fixed, single-track response (like a reflex or a drilled routine). Knowing-how is multi-track; it involves flexibility and adaptation. If you drill a student until they can recite a proof but not understand it, Ryle would say they have a habit, not knowledge. He does not think skill is *just* a knack or conditioned reflex.

  **6. "On this view you could in principle be the greatest proof-writer alive and yet be unable to state a single thing you know, and the difference between an expert and a beginner has nothing to do with anything either of them knows."**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This is an overcorrection. Ryle denies that knowing-how is *reducible* to knowing-that, but he does not claim they are mutually exclusive in a person. A great proof-writer almost certainly knows many propositions (knowing-that) about mathematics. Ryle's point is that possessing those propositions doesn't *constitute* the skill of writing proofs. Furthermore, the difference between an expert and a beginner certainly involves what they know; the expert simply knows *how* in a way the beginner doesn't. To say it has "nothing to do with anything either of them knows" makes Ryle sound like he's denying the cognitive aspect of expertise entirely, which he isn't.

  **7. "He wrapped up by saying Ryle's argument was so decisive that intellectualism about know-how basically died with him, which is why nobody has seriously tried to revive it."**
  *   **Verdict:** **Factually False.**
  *   **Analysis:** This is objectively incorrect regarding the history of philosophy. While Ryle dominated the mid-20th century, intellectualism saw a massive and rigorous revival starting in the early 2000s. Contemporary epistemologists and philosophers of action have developed sophisticated versions of intellectualism that attempt to bypass Ryle's regress argument. The debate is very much alive.

  ### The Ski Instructor Case

  Your friend is referencing a standard counterexample to the "ability view" (the idea that know-how is identical to the ability to perform).

  *   **The Case:** A ski instructor understands the theory and technique of skiing perfectly (knows how) but has broken both legs and cannot physically ski (lacks the ability).
  *   **The Implication:** If knowing-how were *just* the ability to do it, the instructor would not know how to ski. But intuitively, we want to say they still know how; they just can't execute.
  *   **The Audit:** This case does successfully sink the *crude* ability view presented in the podcast (specifically sentence 4). It suggests that knowing-how must involve some kind of propositional grasp or understanding that survives the loss of physical capacity.
  *   **The Caveat:** This doesn't automatically prove full intellectualism (that know-how *is* knowing-that). A Rylean could argue the instructor retains other abilities (the ability to judge form, the ability to correct students, the ability to visualize the movement) even if they lack the ability to move their own legs. However, your friend is right that this case makes the simple "can do = knows how" equation untenable.

  ### The Verdict

  **Who is right?**
  Your friend is more right about the current state of philosophy and the specific vulnerability of the "ability view." The podcast host is right about Ryle's basic motivation (attacking the Ghost in the Machine and the regress), but they caricature Ryle's positive account (calling it mere habit) and they are factually wrong about the history of the debate (claiming intellectualism died).

  **Summary of Errors:**
  1.  **Habit vs. Intelligence:** The podcast claims Ryle reduces skill to habit/drill. Ryle explicitly argues against this.
  2.  **Exclusivity:** The podcast implies experts don't need to know any propositions. Ryle argues skill isn't *reduced* to propositions, not that propositions are irrelevant.
  3.  **History:** The podcast claims intellectualism is dead. It is not; it is a dominant position in contemporary epistemology.

  **Conclusion:**
  You can remain anti-intellectualist without accepting the podcast's summary. You can agree with Ryle that skill isn't *just* reciting rules (anti-intellectualism) while acknowledging that the "ability view" needs to be more sophisticated than "can do = knows how" to handle cases like the injured instructor. The podcast gave you a simplified, slightly distorted version of Ryle to sell a narrative that the debate is settled. It isn't.
