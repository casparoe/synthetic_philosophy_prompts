      *   Also, Step 7 is a generalization that might be false. We *don't* know much about Socrates. The "Socratic Problem" is notoriously difficult. So Step 8 ("We clearly do know some things") might be overconfident regarding Socrates, but defensible regarding Jesus (due to volume of sources).
      *   *Decision:* Stick with attacking Step 4. It's the most productive for a student who wants to do history.

  8.  **Structuring the Response:**
