in to one person can be traded against a large pleasure to another, or whether the threshold applies to individual pains or to total suffering. The point is to sort readers by what they accept about cases, not by which label they like, so no branch node should simply ask whether they are a lexical threshold negative utilitarian. Note any combinations of answers that no one occupies and briefly diagnose whether they are incoherent, unattractive, or merely unexplored. Flag any pair of positions your tree cannot separate. No citations, reading lists, or bibliographies; I want the logical structure, not the literature. Give a committed response: do not present several possible taxonomies or hedge about which distinctions matter. Choose one tree, make definite calls about where contested positions belong, and defend those calls. Lead with your bottom line in the first sentence: state the single distinction you think does the most sorting work. Then give the tree and the notes. No preamble and no restating of my question.
