answer: |-
  Here is an audit of the text, your spreadsheet, and your roommate's claims, structured by the specific friction points you identified.

  ### 1. The Spreadsheet Audit
  **Verdict:** Your calculation is correct; the book is overselling the convergence speed.

  You calculated a probability of roughly **0.72** for 1,000 voters with 51% individual competence. That is accurate.
  *   **The Math:** With $p=0.51$, the signal-to-noise ratio is incredibly low. The theorem guarantees that as $N \to \infty$, probability $\to 1$. However, the *rate* of convergence depends heavily on how far $p$ is from 0.5.
  *   **The Reality:** To get the majority accuracy up to 95% with $p=0.51$, you don't need 1,000 voters; you need roughly **27,000**. To get to 99%, you need over **100,000**.
  *   **The Book's Error:** The phrase "effectively guaranteed" implies a practical certainty reachable in real-world elections (thousands or millions of voters). While a national electorate is large enough, the margin of error in real-world competence ($p$) is usually much tighter than we think. If $p$ dips to 0.501, the required $N$ explodes. The book treats the asymptote as a horizon we easily reach; your spreadsheet correctly shows it's a long swim.

  ### 2. The Roommate Audit
  **Verdict:** Your roommate is half-right on the math but wrong on the implications.

  *   **Claim A: "Padding with guessers ($p=0.5$) is harmless."**
      *   **False.** This is a common intuition trap. If you have a group with average competence $p > 0.5$ and you add voters with $p=0.5$, you lower the *average* competence of the total pool. While the errors of the guessers cancel each other out, they dilute the weight of the competent voters. It slows convergence. It is not "harmless"; it is dilutive.
  *   **Claim B: "If average voter is < 50%, majority gets more reliable as it grows."**
      *   **Mathematically True, Politically Catastrophic.** This is the **Inverse Condorcet Jury Theorem**. If $p < 0.5$, the probability of the majority choosing the *correct* option approaches 0 as $N$ grows. The system becomes *perfectly reliable at choosing the wrong answer.* Your roommate frames this as "same as before" (reliability increases), but fails to note reliability *of what*. For epistemic democracy, this is the worst-case scenario: a large electorate systematically locking in error.

  ### 3. Claim-by-Claim Audit of the Book Summary

  Here is how a formal theorist would mark up that paragraph:

  **Claim:** *"As long as each member... is even slightly more likely than not to get the answer right..."*
  *   **Status:** **Accept.** This is the competence condition ($p > 0.5$).
  *   **Caveat:** It assumes a binary choice with an objective truth. Most political choices are not binary (True/False) but multidimensional preferences.

  **Claim:** *"...the majority is more likely to be right than any individual member -- including the smartest one..."*
  *   **Status:** **Wince.**
  *   **Why:** The theorem proves $P(Majority) > p_{average}$. It does *not* guarantee $P(Majority) > p_{expert}$. If you have one expert with $p=0.9$ and a crowd with $p=0.51$, the crowd needs to be massive to outperform the expert. The book conflates "better than the average member" with "better than the best member."

  **Claim:** *"...so a big enough electorate is effectively guaranteed to reach the correct verdict."*
  *   **Status:** **Deny (as written).**
  *   **Why:** As your spreadsheet showed, "big enough" is often impractically large when $p$ is close to 0.5. "Effectively guaranteed" suggests robustness; the math shows fragility near the threshold.

  **Claim:** *"That's the mathematical backbone of the wisdom of crowds... ox's weight... prediction markets."*
  *   **Status:** **Deny (Category Error).**
  *   **Why:** Condorcet is about **binary classification** (True/False). Galton's ox weight is about **averaging continuous estimates** (Central Limit Theorem logic). Prediction markets are about **information aggregation via incentives**. They are all epistemic arguments for collectives, but they rely on different mathematical engines. Conflating them muddies the specific conditions required for CJT.

  **Claim:** *"The theorem does assume voters are independent, which never holds in real life, so strictly speaking it applies to no actual electorate..."*
  *   **Status:** **Wince (Defeatist).**
  *   **Why:** "Never holds" is hyperbolic. Strict independence is rare, but *low correlation* is possible. Theorem extensions (e.g., by Ladha 1992) show CJT holds under **exchangeability** (common probability distribution) even with some positive correlation.
  *   **The Real Issue:** Common information sources (media, party cues) create positive correlation. If correlation is high, the "effective group size" shrinks. If 1,000 voters all watch the same news channel, they act more like 10 independent voters. The theorem doesn't "apply to nothing," but its power is drastically reduced by social networks.

  **Claim:** *"...practical upshot... is Condorcet's related insight that the candidate who beats every other candidate head-to-head should win."*
  *   **Status:** **Flatly Deny.**
  *   **Why:** This confuses the **Condorcet Jury Theorem** (Epistemic/Truth-tracking) with the **Condorcet Criterion** (Social Choice/Preference Aggregation).
      *   *Jury Theorem:* There is a right answer; can we find it?
      *   *Condorcet Criterion:* There is no "right" answer, only preferences; is the voting method consistent?
      *   Linking them as "practical upshot" is a category mistake. One justifies democracy as truth-tracking; the other justifies a specific voting rule (Pairwise Majority) for aggregating will.

  ### 4. What Survives? (The Epistemic Case)

  Does the loose idea that "majority rule has epistemic value" survive this audit? **Yes, but it is weaker and more conditional than the popular book suggests.**

  To keep the epistemic case, you must swap the "guarantee" for a "tendency under institutional constraints." A formal theorist would argue:

  1.  **Competence is not fixed:** $p$ is not a natural constant; it is endogenous to the system. Deliberation, education, and diverse information sources aim to raise $p$ above 0.5.
  2.  **Independence is a design feature:** Secret ballots, diverse media ecosystems, and anti-coercion laws are not just about liberty; they are epistemic necessities to minimize correlation ($\rho$).
  3.  **The "Miracle" is Aggregation:** Even if no single voter is highly competent, if $p > 0.5$ and $\rho$ is low, the aggregation mechanism extracts signal from noise.

  **Summary for your notes:**
  *   **Keep:** The core logic that aggregation can outperform individuals given $p > 0.5$.
  *   **Discard:** The idea that this happens quickly/easily (your spreadsheet was right), that it beats experts automatically, or that it applies to continuous estimates (ox weight).
  *   **Correct:** The independence assumption is not a binary on/off switch but a slider; correlation reduces efficiency but doesn't necessarily break the result unless $\rho$ is very high.
  *   **Separate:** Condorcet Jury Theorem (Truth) $\neq$ Condorcet Winner (Preferences).

  Your intuition that the theorem "only cuts one way" regarding competence is correct. Below 0.5, size amplifies error; above 0.5, size amplifies truth. That asymmetry is the whole ballgame.
