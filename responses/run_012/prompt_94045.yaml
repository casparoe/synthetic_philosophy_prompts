          6.  Conclusion: What survives?
      *   *Tone Check:* Keep it sharp. Avoid "Actually..." condescension. Acknowledge the user's good intuition.
      *   *Math Check:* Ensure the explanation of the 0.72 figure is clear (slow convergence near 0.5).
      *   *Reference Check:* Mention key names if helpful (Condorcet, Ladha, Estlund, Landemore) but keep it focused on the logic.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on "Smartest One":* The book says majority beats *any* individual. If $p_{ind} = 0.51$, majority beats them quickly. If there exists an expert with $p=0.99$, the average group of $p=0.51$ needs to be huge to beat that expert. The book's phrasing "including the smartest one" implies the smartest one is part of the group with the average competence. If the "smartest one" is an outlier expert, CJT doesn't guarantee the crowd beats *them* unless the crowd is massive. I need to clarify this distinction.
      *   *Correction on Independence:* Don't say independence is impossible. Say *strict* independence is rare, but *conditional* independence or low correlation is sufficient.
      *   *Correction on Condorcet Winner:* Make sure to distinguish Epistemic (Truth) vs. Ontic/Preference (Will of the people).

  7.  **Final Polish:** Check against the prompt's constraints ("audit, not a lecture", "flag anything in my own questions"). Ensure the spreadsheet calculation is explicitly validated. (User's 0.72 is correct).

