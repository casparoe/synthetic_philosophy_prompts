  2. Mill would condemn these arrangements because the absence of a settled exit condition violates the provisional requirement of condition (ii), which unlike the mandate system risks becoming a permanent despotism rather than a tutorial state.
  3. Mill would likely condemn this as counterproductive to improvement since imposing policy from outside prevents the governed from learning the responsibility necessary for self-government, though this strains condition (i) by substituting external dictates for the internal political education required to end the trust.
  4. Mill would accept the transfer of power as the necessary liquidation of the trust but regret the timing since concession to demand rather than completed preparation risks the stability required for improvement, which strains condition (ii) by ending the trusteeship before the governed fully demonstrated the capacity Mill deemed necessary.
  5. Mill would reject these claims because the justification for rule was forward-looking improvement rather than backward-looking rectification, making past errors irrelevant once self-government is achieved, even if this strains condition (i) by treating the trust as a contract liable for damages rather than a tutorial duty discharged by success.
