  ### Analysis of the Instrument

  **Unoccupied Combinations**
  The tree permits a path to the leaf labelled **Brute Truth** (Level 1.2 → 2.2 → 3.2 → 4.2), which corresponds to the view that statements have truth values but no truthmakers, nor are they fixed by future events. This view is rarely occupied because it appears incoherent; it posits truth without any ontological ground, past, present, or future. It is distinct from **Ordinary Truth** only if one denies that future events can serve as truthmakers, a distinction most philosophers find unsustainable, rendering the view unattractive rather than merely unexplored.

  **Indistinguishable Leaves**
  The tree separates **Ordinary Truth** (fixed by what actually happens) from **Brute Truth** (truth values but no truthmakers). In practice, these often collapse into a single leaf, commonly known as Ockhamism. The distinction relies on a technical theory of truthmaking: whether a future event *counts* as a truthmaker for a present proposition. If one holds that only present entities can be truthmakers, then Ockhamism looks like Brute Truth. Including both allows for technical precision, but for a general discussion, they function as the same position: the future is open, but statements about it are already true or false.

  **Omitted Questions**
  I deliberately left off the question of whether time is branching or linear. Including this would have required a preliminary metaphysical section on the topology of time before addressing truth values. The cost of inclusion would have been depth; it would have forced the removal of the specific cases (such as the self-fulfilling prediction or the unuttered statement) to remain within the six-level constraint. Since your group is focused on the semantic problem (truth values) rather than the metaphysical structure of time itself, the current structure prioritises the commitments regarding truth over the commitments regarding temporal ontology.
