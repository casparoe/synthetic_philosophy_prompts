answer: |-
  ### Part 1: Brainstorming Candidate Mechanics

  Before settling on the final design, here are three ways we could structure the simulation, weighing their pedagogical payoff against logistical friction.

  **Option A: The "Perceptual Signal" Game**
  *   **Mechanic:** Students view faint images or hear ambiguous sounds and vote on whether a "signal" is present (Yes/No).
  *   **Pros:** Purely epistemic; removes prior knowledge bias. Easy to manipulate difficulty ($p$) by adjusting signal strength.
  *   **Cons:** Logistically heavy (requires AV setup). Hard to induce *systematic* incompetence ($p < 0.5$) without making the task absurd. Doesn't capture the "testimony/expertise" aspect of democracy well.
  *   **Verdict:** **Discard.** Too much tech friction, not enough philosophical resonance regarding testimony and bias.

  **Option B: The "Estimation" Game**
  *   **Mechanic:** Students guess quantities (e.g., "weight of this object," "date of this event"). The group average is compared to individuals.
  *   **Pros:** Demonstrates the "Wisdom of Crowds" (Galton's ox) effectively.
  *   **Cons:** Condorcet's Jury Theorem (CJT) is about *binary* majority voting, not continuous averaging. This conflates two different statistical phenomena. It also makes the $p < 0.5$ case (systematic error) hard to model.
  *   **Verdict:** **Discard.** Statistically distinct from the target theorem.

  **Option C: The "Verdict" Trivia Game (Refining Your Sketch)**
  *   **Mechanic:** Binary (True/False) questions. Three rounds manipulating the *source* of information and the *nature* of the questions to alter $p$ and independence.
  *   **Pros:** Directly maps to CJT variables. Low tech. Allows for a clear "scoreboard" comparison between Individual vs. Majority performance. The "trick questions" in Round 3 viscerally demonstrate the danger of systematic bias.
  *   **Cons:** Requires careful question calibration (piloting).
  *   **Verdict:** **Select.** This is the most robust way to isolate the variables of CJT (competence, independence, group size) within a 90-minute humanities seminar.

  ---

  ### Part 2: The Activity Design — "The Verdict"

  **Concept:** Students act as jurors deciding binary facts. They earn points for individual accuracy, but the "Class Verdict" (Majority) is also scored. The goal is to watch the gap between *Individual Average* and *Majority Accuracy* widen or invert across three rounds.

  **Materials Needed:**
  1.  **Answer Cards:** 18 sets of two cards (one marked **A**, one marked **B**). Or simply red/blue index cards.
  2.  **Score Sheet:** A projected spreadsheet or whiteboard table to track scores round-by-round.
  3.  **Question Deck:** 24 Binary Questions (8 per round). *Crucial: You must pilot these on 5-10 colleagues beforehand to ensure the hit rates match the design.*
  4.  **The "Briefing Paper" (Round 2):** A handout given to everyone containing the same misleading hint.

  **Payoff Scheme:**
  *   **Individual Points:** 1 point per correct personal answer.
  *   **Dividend Points:** If the **Majority Vote** is correct, *everyone* gets +1 bonus point for that question.
  *   **Penalty:** If the Majority Vote is wrong, *everyone* loses -1 point (even if they individually voted correctly).
      *   *Why?* This forces them to feel the pain of the group's failure in Round 3. It makes the "tyranny of the incompetent majority" visceral.

  ---

  ### Part 3: Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:05 | Setup & Rules**
  *   Distribute cards.
  *   **Rule 1:** No talking during voting rounds.
  *   **Rule 2:** Hold cards to chest when voting (secret ballot).
  *   **Rule 3:** You are maximizing your own score, but the "Dividend" ties you to the group.
  *   *Instructor Note:* Do **not** mention Condorcet, probability, or independence yet. Tell them: "We are testing how groups track truth under different conditions."

  **00:05 – 00:20 | Round 1: The Independent Jury ($p > 0.5$, Independent)**
  *   **Condition:** General knowledge questions. Calibrated so average individual accuracy is ~65-70%. Students rely on their own diverse knowledge bases.
  *   **Process:** Read Q -> 15 sec think -> Vote -> Reveal -> Tally.
  *   **Tallying:** While you tally the Majority vs. Individual averages on the board, students breathe.
  *   **Expected Result:** Majority Accuracy > Average Individual Accuracy. The Dividend pays out often.
  *   **Time:** 8 Questions @ 1.5 mins each = 12 mins + 3 mins tally.

  **00:20 – 00:35 | Round 2: The Corrupted Signal ($p > 0.5$, Correlated)**
  *   **Condition:** Hand out the "Briefing Paper." It contains a "hint" or "rule of thumb" that applies to all 8 questions. The hint is *mostly* right but fails on key items, or simply makes everyone rely on the same heuristic.
  *   **Goal:** Induce correlated error. Even if they are competent, they are no longer independent.
  *   **Process:** Read Hint -> Read Q -> Vote -> Reveal.
  *   **Expected Result:** Majority Accuracy drops closer to Individual Accuracy (or dips below). The variance collapses. If the hint is wrong on a specific question, *everyone* gets it wrong together.
  *   **Time:** 8 Questions @ 1.5 mins each = 12 mins + 3 mins tally.

  **00:35 – 00:50 | Round 3: The Systemic Bias ($p < 0.5$, Independent)**
  *   **Condition:** "Trick Questions." These are questions where the intuitive, common-sense answer is demonstrably false. (e.g., "Does a penny dropped from a skyscraper kill a pedestrian?" -> False).
  *   **Goal:** Push individual competence below chance (~40%).
  *   **Process:** Read Q -> Vote -> Reveal.
  *   **Expected Result:** Individual Accuracy is low. **Majority Accuracy is catastrophic.** Because $p < 0.5$, the Majority Vote amplifies the error. The "Penalty" triggers repeatedly. Scores plummet.
  *   **Time:** 8 Questions @ 1.5 mins each = 12 mins + 3 mins tally.

  **00:50 – 01:30 | The Debrief (40 Minutes)**
  *   See detailed script below.

  ---

  ### Part 4: The Debrief Script (Mapping Game to Theorem)

  Do not start with a lecture. Start with the data on the board.

  **1. The Data Reveal (5 mins)**
  *   Point to the Round 1 scores. "Look at the gap between the Average Individual Score and the Majority Score. The group was smarter than the average member. Why?"
  *   *Elicit:* "Diverse knowledge," "Errors cancelled out."
  *   Point to Round 3 scores. "Look at the crash. The group was *dumber* than the average member. In fact, the group was confidently wrong. Why?"
  *   *Elicit:* "We all made the same mistake," "The questions were tricks."

  **2. Mapping the Variables (15 mins)**
  *   Draw the Condorcet formula on the board (simplified): $P(\text{Majority Correct})$ depends on $N$ (voters) and $p$ (individual competence).
  *   **Assumption 1: Competence ($p$).** "In Round 1, $p > 0.5$. You knew more than you guessed. In Round 3, $p < 0.5$. Your intuition was a liability."
      *   *Philosophical Point:* Democracy requires a baseline of citizen competence. If the electorate is systematically misinformed ($p < 0.5$), voting amplifies error.
  *   **Assumption 2: Independence.** "In Round 2, I gave you the Briefing Paper. Did your scores change?"
      *   *Philosophical Point:* Condorcet assumes errors are *independent*. If we all get our news from the same source (media monoculture) or hear the same expert testimony, our errors correlate. The 'effective $N$' shrinks. A crowd of 18 copying one leader is mathematically equivalent to 1 voter.
  *   **Assumption 3: Binary Truth.** "Notice all questions had a right/wrong answer."
      *   *Philosophical Point:* This is the limit of the theorem. Politics is often about values (Tax rates? War?), not facts (Is the deficit rising?). CJT justifies democracy as a *truth-tracking* device, not necessarily a *preference-aggregation* device.

  **3. The "Free-Rider" Discussion (10 mins)**
  *   Ask: "Did anyone try to copy their neighbor?"
  *   If yes: "You violated the Independence Assumption. You reduced the group's intelligence."
  *   If no: "Why didn't you? Trust? Rules?"
  *   *Philosophical Point:* This models the tension between **private judgment** and **social influence**. Deliberative democrats argue talking *improves* $p$. Epistemic democrats worry talking creates correlation (Round 2). The game shows why secret ballots exist: to preserve independence.

  **4. The Asymptotic Gap (5 mins)**
  *   "We had 18 people. Condorcet talks about infinity. Did we reach certainty in Round 1?"
  *   *Answer:* No. It was noisy.
  *   *Point:* 18 is a small sample. The theorem is a limit claim. In real elections (millions of voters), the convergence is much sharper. But the *direction* holds: if $p > 0.5$, more voters help. If $p < 0.5$, more voters hurt.

  **5. Closing the Fact/Value Gap (5 mins)**
  *   "Real politics isn't trivia. Does this game discredit democracy?"
  *   *Discussion:* No, but it clarifies *what* democracy is good for. It suggests we need institutions that raise $p$ (education, free press) and protect independence (secret ballots, pluralism). It warns against demagogues who lower $p$ by making false things feel intuitive.

  ---

  ### Part 5: Troubleshooting & Limitations

  **Predictable Failure Mode 1: The Free-Rider**
  *   **Risk:** A student realizes they can just watch the majority and copy, saving cognitive effort.
  *   **Fix:** Enforce the "Cards to Chest" rule strictly.
  *   **Pedagogical Pivot:** If you catch someone copying, *do not punish them.* Use it in the debrief. "Alex copied Sam. Mathematically, Alex ceased to be a voter and became a megaphone for Sam. This reduces our $N$."

  **Predictable Failure Mode 2: Round 3 Doesn't Crash**
  *   **Risk:** Your "trick questions" aren't tricky enough. $p$ stays above 0.5.
  *   **Fix:** You **must pilot** the questions. If you can't pilot, use classic cognitive bias questions (e.g., The Linda Problem, Bat-and-Ball problem) where the intuitive answer is known to be wrong >60% of the time.
  *   **Backup:** If Round 3 fails (Majority wins), admit it in the debrief. "We failed to induce systematic bias. In the real world, propaganda is often better at this than I am. That should scare us."

  **Predictable Failure Mode 3: Tallying Takes Too Long**
  *   **Risk:** Counting 18 cards x 8 questions x 3 rounds = 432 data points. You will run out of time.
  *   **Fix:** Recruit two students as "Clerks" during the game. They collect and count while you read the next question. Or, use a free polling app (Mentimeter/Slido) on phones. If using phones, ensure they submit *before* seeing the results to maintain independence.
  *   **Recommendation:** For a philosophy seminar, **paper is better.** It feels more like a "vote." Have the Clerks tally *during* the transition time between rounds. You only need to write the *summary stats* on the board (Avg Individual %, Majority %), not every single vote.

  **Limitation: The "Fact of the Matter" Problem**
  *   **Honesty Check:** You must acknowledge in the debrief that most political questions (e.g., "Is inequality unjust?") do not have binary truth values like trivia questions.
  *   **Resolution:** Explain that CJT supports the **Epistemic Defense of Democracy**. It argues democracy is likely to produce *just* outcomes if justice is truth-apt. It does not solve the problem of deep value pluralism. However, even in value disputes, there are often *factual premises* (e.g., "Will this policy reduce crime?") where CJT applies.

  **Limitation: N=18 vs. N=Infinity**
  *   **Honesty Check:** With 18 students, the "Convergence to Certainty" won't look like a curve going to 100%. It will look like "Majority did slightly better."
  *   **Resolution:** Be explicit. "We are seeing the *slope* of the curve, not the asymptote. Imagine this room had 10,000 people with the same competence. The Round 1 Majority would have been near-perfect. The Round 3 Majority would have been near-perfectly wrong."

  ### Sample Question Bank (For Piloting)

  **Round 1 (General Knowledge, ~65% accuracy)**
  1.  True/False: The Great Wall of China is visible from the moon with the naked eye. (False)
  2.  True/False: Lightning never strikes the same place twice. (False)
  3.  True/False: Napoleon was shorter than the average Frenchman of his time. (False)
  4.  True/False: Goldfish have a three-second memory. (False)
  5.  ... (Select 3 more of similar difficulty)

  **Round 2 (Correlated - Provide a "Rule of Thumb" Handout)**
  *   *Handout Text:* "Heuristic for this round: In biology and geography, the larger the animal/landmass, the longer the lifespan/duration." (This is a plausible but often false heuristic).
  1.  True/False: An elephant lives longer than a shrew. (True - Heuristic works)
  2.  True/False: A larger country always has a longer coastline. (False - Heuristic fails, e.g., Poland vs. Norway)
  3.  True/False: A blue whale lives longer than a mouse. (True)
  4.  True/False: Russia has a longer coastline than the USA. (False/Debatable depending on measurement - Heuristic fails)
  5.  ... (Ensure 3-4 questions where the heuristic fails to create correlation error)

  **Round 3 (Systemic Bias, ~40% accuracy)**
  1.  True/False: Bulls hate the color red. (False - They are red-green colorblind)
  2.  True/False: A penny dropped from the Empire State Building can kill a pedestrian. (False - Terminal velocity is too low)
  3.  True/False: Shaving hair makes it grow back thicker. (False)
  4.  True/False: The Coriolis effect determines which way toilet water swirls. (False)
  5.  ... (Select 4 more "Mythbuster" style questions)

  By the end of the 90 minutes, your students will not just know Condorcet's Jury Theorem; they will have *lost points* to it. That emotional resonance is what makes the philosophy stick.
