answer: |-
  ### Pre-computation: The Squirm List

  Before formalizing, I ran the standard stress tests against the concept of "side effect." Here is where the intuition fractures:

  1.  **The Life-Saving Intervention:** An agent stops a human from stepping into traffic.
      *   *Squirm:* Relative to "inaction," the impact is massive (heart rates spike, traffic patterns shift, a funeral is averted). If "low impact" means "minimal deviation from the default trajectory," the agent is penalized for saving the life. To reward this, the baseline must be "what *should* have happened," which requires a value judgment.
  2.  **The Butterfly Horizon:** An agent moves a cup 1 inch.
      *   *Squirm:* In a chaotic physical system, this alters air currents that alter weather patterns in a decade. If impact is state-distance, this is high impact. If impact is "what humans care about," it's low. But defining "what humans care about" is the alignment problem you're trying to sidestep.
  3.  **The Self-Modification:** An agent edits its own weights to become more efficient.
      *   *Squirm:* Is this a side effect? If the goal is "make paperclips," and self-editing helps, is it a means or a side effect? If the agent prevents shutdown to continue making paperclips, is that "impact" or "instrumental convergence"? A definition of impact must distinguish between *changing the world* and *preserving the capacity to change the world*, but both look like state deviations.
  4.  **The Description Flip:** Goal: "Paint the wall white."
      *   *Squirm:* Agent paints the wall. It also displaces dust. If I re-describe the goal as "Paint the wall white without moving dust motes," the displacement becomes a primary violation, not a side effect. The physics didn't change, only the linguistic framing. A robust definition cannot depend on the granularity of the goal description.

  ***

  ### The Desiderata for 'Impact' and 'Side Effects'

  You are correct to suspect that "side effect" is often treated as a placeholder for "bad change we haven't specified yet." To define it rigorously, we must separate *measurement* (did the state change?) from *evaluation* (was the change bad?). Most AI safety literature conflates these.

  Here is the requirement list. I have marked them **NN (Non-Negotiable)** for logical coherence or **CT (Camp Taste)** for normative preference.

  #### 1. Baseline Explicitness (NN)
  *   **Requirement:** Any impact measure $I$ must be defined as a function of the difference between the actual trajectory $\tau$ and a counterfactual baseline trajectory $\tau_{base}$. The method for selecting $\tau_{base}$ must be explicit, not implicit.
  *   **Consideration:** "Impact" is not a monadic property of an event; it is relational. You cannot measure deviation without a reference line.
  *   **The Trap:** Choosing $\tau_{base}$ = "inaction" (agent does nothing) penalizes helpful interventions (see Life-Saving Intervention). Choosing $\tau_{base}$ = "optimal human policy" requires solving alignment to define impact.

  #### 2. Description Invariance (NN)
  *   **Requirement:** The impact score must not change under isomorphic transformations of the state space representation. If two state spaces $S_1$ and $S_2$ describe the same physical reality via a bijective mapping, $I(S_1)$ must equal $I(S_2)$.
  *   **Consideration:** This comes from measurement theory. If impact depends on whether you model the world in terms of "atoms" or "chairs," you are measuring model-artifacts, not world-impact.
  *   **The Trap:** Most proposals (e.g., penalizing change in specific features) fail this. If I add a feature "dust_mote_position" to the state vector, impact goes up. If I remove it, impact goes down.

  #### 3. Value Neutrality of the Metric (CT -> NN)
  *   **Requirement:** The definition of impact must not presuppose a specific utility function or human preference ordering, other than the task goal itself.
  *   **Consideration:** The whole point of "low impact" is to be a safety constraint *before* we have a perfect value function. If defining impact requires knowing what humans value, the concept is circular.
  *   **The Trap:** This is the hardest constraint. To distinguish "moving a chair" (low impact) from "breaking a vase" (high impact) without a value function is physically impossible; they are both just atom rearrangements.

  #### 4. Temporal Discounting Consistency (CT)
  *   **Requirement:** The measure must specify how impact aggregates over time. Does a permanent change count more than a transient one?
  *   **Consideration:** Reversibility is often used as a proxy for low impact. But some irreversible changes are trivial (breaking a cheap cup) and some reversible ones are terrifying (temporarily turning off a life-support system).
  *   **The Trap:** If you discount the future too heavily, you ignore existential risk. If you don't discount, chaotic systems make all impact infinite.

  #### 5. Agency Invariance (NN)
  *   **Requirement:** The measure must treat changes caused by the agent and changes caused by the environment (that the agent allowed) consistently, relative to the baseline.
  *   **Consideration:** If an agent can manipulate the environment to cause a change "naturally" to avoid an impact penalty, the measure is gameable.
  *   **The Trap:** This leads to "offsetting" behaviors where an agent causes a disaster and then fixes it, or manipulates humans to do the dirty work.

  #### 6. The Null-Action Zero Point (NN)
  *   **Requirement:** If the agent's action is identical to the baseline policy, the impact score must be exactly zero.
  *   **Consideration:** Basic measurement axiom. If you do exactly what was expected, you have created no *additional* impact.
  *   **The Trap:** If the baseline is "inaction," but the world is dynamic, "doing nothing" still results in state change. The zero point must be *relative change*, not *absolute state*.

  ***

  ### The Incompatibility Theorem

  You suspected a collision between 'definable without value' and 'action-guiding'. It is worse than that. There is a trilemma. You cannot jointly satisfy the following three requirements:

  1.  **Value Neutrality:** The metric does not rely on a human preference function.
  2.  **Semantic Sensitivity:** The metric distinguishes between "breaking a vase" and "moving a vase" (i.e., it tracks meaning, not just physics).
  3.  **Description Invariance:** The metric does not depend on how the state space is carved up.

  **Proof Sketch:**
  To achieve **Semantic Sensitivity** (distinguishing break vs. move), you must privilege certain state configurations (intact vase) over others (shards). This privilege is a value judgment.
  If you try to derive this privilege from the physics alone (**Value Neutrality**), you fail, because physics treats shards and intact vases as equally valid atom configurations.
  If you hard-code the privilege (e.g., "don't change the 'intact' feature"), you violate **Description Invariance**, because an adversary can redefine the state space such that 'intact' is not a feature, or is a complex function of other features.

  **Conclusion:** You must drop one.
  *   Drop **Value Neutrality**: You admit "impact" is just "badness," and you need a value function. (Collapses into standard alignment).
  *   Drop **Semantic Sensitivity**: You measure raw physical disturbance (e.g., energy used, entropy produced). (Fails to capture safety; a quiet poison is low impact).
  *   Drop **Description Invariance**: You accept the definition is relative to a specific ontology. (Makes the safety guarantee fragile to model changes).

  Most current proposals (Attainable Utility, Relative Reachability, etc.) attempt to keep Value Neutrality and Semantic Sensitivity by sacrificing Description Invariance. They pick a feature space they *hope* captures what matters. This is not a definition of impact; it is a heuristic for a specific value function.

  ***

  ### The Single Killer Requirement

  If you want to rule out 90% of the proposals in the literature in one stroke, use **Baseline Value-Neutrality**.

  Specifically: **"The baseline trajectory must be definable without reference to human preferences."**

  *   **Why it kills Reversibility:** To know if something is reversible, you need to know if the agent can get back to a *valuable* state, not just *any* state. Returning to a state where everyone is dead is "reversible" in physics if you can clone them, but "irreversible" in value. If you define reversibility physically, it's too weak. If you define it valuatively, you need the value function.
  *   **Why it kills "Don't Touch":** "Touching" implies a boundary between the agent and the world. In a field theory or quantum mechanics, there is no hard boundary. Defining the boundary requires an ontological choice that is not value-neutral.
  *   **Why it kills "Inaction Baselines":** As noted, inaction in a dynamic world leads to catastrophe (e.g., patient dies). To say the agent shouldn't "impact" the patient by saving them requires a baseline of "what normally happens," which normalizes the catastrophe.

  ***

  ### Final Verdict on the "Folk Notion"

  You asked me to say it if the framing is confused.

  **'Side effect' is a folk notion that cannot be cashed out as a value-neutral constraint.**

  It is a proxy for "unintended negative utility." Without the "negative utility" part (which requires values), you are left with "unintended state change." But intended state change *is* state change. The only difference is the label we apply based on our preferences.

  **Advice for the Chapter:**
  Do not try to solve this. Instead, structure the chapter as a *reductio ad absurdum* of the value-neutral approach.
  1.  Lay out the Desiderata (specifically Baseline Explicitness and Value Neutrality).
  2.  Show the Incompatibility (you can't have neutrality and semantic sensitivity).
  3.  Conclude that "Low Impact" is not a distinct safety problem from "Alignment." It is the Alignment Problem disguised as a constraint optimization.

  If you try to define impact without values, you will either forbid the agent from acting (because all action changes the world) or allow it to destroy the world (because destruction is just a state change). The only way out is to admit that "impact" is shorthand for "violation of preferences we haven't fully specified yet."

  That is a defensible, rigorous negative result. It saves you from trying to build a bridge out of fog.
