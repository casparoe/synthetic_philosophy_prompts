answer: |-
  Here is the disambiguation you requested, arranged from the most defensible (near-tautological) to the most radical (metaphysically loaded), followed by an analysis of the formal results and a verdict on your argument.

  ### The Menu of Claims

  I have ordered these by strength. The early items are methodological rules about how *you* should think; the later items are claims about how the *world* is.

  #### 1. The Pragmatic Reading (Methodological)
  *   **Claim:** "All else being equal, investigate simpler hypotheses first because they are easier to state, test, and falsify."
  *   **Verdict:** **Platitude.**
  *   **Commitments:** Commits you to nothing about the world, only to efficiency in inquiry. Complex hypotheses often have more parameters, requiring more data to constrain.
  *   **Application to your case:** This does not say the one-cause story is *true*. It says if you want to resolve the argument quickly, you should check the "hidden coordinator" hypothesis first because it is a single target to verify/falsify, whereas verifying "five independent events" requires checking five separate histories.
  *   **Does it license your friend?** No. Your friend claimed the one-cause story was *more likely to be true*, not just *cheaper to check*.

  #### 2. The Statistical Reading (Overfitting)
  *   **Claim:** "Simpler models generalize better because complex models risk fitting noise in the specific dataset rather than the underlying signal."
  *   **Verdict:** **Substantive and Defensible.**
  *   **Commitments:** Commits you to the assumption that your data contains noise and that you care about predictive accuracy on *new* data, not just retrodictive fit. This is backed by formal learning theory (e.g., VC dimension).
  *   **Application to your case:** This applies poorly to historical explanation. Your case is about explaining a fixed set of past events (the five conclusions), not predicting future data. A "hidden coordinator" model might actually be *overfitting* if it posits a complex mechanism solely to explain these five points without predicting a sixth.
  *   **Does it license your friend?** No. This justifies simplicity for *prediction*, not necessarily for *retrodiction* of unique historical events.

  #### 3. The Probabilistic Reading (Bayesian)
  *   **Claim:** "Simpler hypotheses should be assigned higher prior probability $P(H)$."
  *   **Verdict:** **Substantive and Defensible (conditionally).**
  *   **Commitments:** Commits you to a specific prior distribution. In Bayesian terms, "simplicity" is not a separate rule; it is a property of the prior. To say "simpler is more likely" is to say "I have chosen a prior that decays with complexity."
  *   **Application to your case:** This is the crux. Your friend is asserting $P(\text{One Cause}) > P(\text{Five Coincidences})$. But Bayes' theorem requires $P(H)$ to be justified. Why is the prior on a hidden coordinator higher than the prior on independent discovery? If "independent discovery" is a known common phenomenon (high base rate), its prior might actually be higher despite the "five events" ontology.
  *   **Does it license your friend?** Only if he can justify the prior. He is smuggling the justification into the definition of "simple."

  #### 4. The Information-Theoretic Reading (Kolmogorov)
  *   **Claim:** "The true explanation is the one with the shortest description length (Kolmogorov complexity) in a universal language."
  *   **Verdict:** **Substantive and Defensible (as a formal ideal), but Uncomputable.**
  *   **Commitments:** Commits you to the idea that the universe is compressible. It identifies "truth" with "compression." This is the engine behind Solomonoff Induction.
  *   **Application to your case:** This is where your intuition about "cheating" lives. Description length depends on the **language** (the Universal Turing Machine).
      *   In a language where `INDEPENDENT_DISCOVERY()` is a primitive function, the five-coincidence story is very short.
      *   In a language where `HIDDEN_COORDINATOR()` is a primitive, the one-cause story is short.
      *   Your friend is assuming a language where "entities" count as bits, but he is ignoring the bits required to specify the *mechanism* of the coordination.
  *   **Does it license your friend?** No. It exposes his ambiguity. He is counting *entities* (1 vs 5) but ignoring *mechanism complexity*. If the coordinator requires a complex conspiracy to remain hidden, the description length of the one-cause story may exceed the five-coincidence story.

  #### 5. The Ontological/Metaphysical Reading
  *   **Claim:** "The universe itself contains fewer entities/kinds rather than more. Nature is intrinsically parsimonious."
  *   **Verdict:** **Radical and Likely False.**
  *   **Commitments:** Commits you to a metaphysical claim about the fabric of reality. There is no logical or empirical necessity for the universe to be simple; it could be arbitrarily complex.
  *   **Application to your case:** This is what your friend is actually relying on. He believes "1 cause" is ontologically superior to "5 causes." But history is full of coincidences. If the base rate of independent discovery is high, the "5 coincidences" ontology is the natural state, and the "1 coordinator" is the complex deviation.
  *   **Does it license your friend?** Only if the world is actually set up that way. It requires an extra premise: "Coordinating causes are more common than convergent independent discoveries." Without that, this is a superstition.

  ---

  ### Sorting by Utility and Rigor

  **Which reading is usually invoked?**
  When people drop "Occam's Razor" to end an argument, they are usually invoking the **Ontological Reading** (#5) but pretending it has the authority of the **Probabilistic Reading** (#3). They want the metaphysical comfort of "fewer things" with the mathematical rigor of "higher probability." This is the category error that causes the flinch.

  **Which readings license the move from 'One Cause' to 'More Likely'?**
  Only the **Probabilistic** and **Information-Theoretic** readings can mathematically license this move, *but* they require you to specify the prior or the language.
  *   The **Ontological** reading cannot license it without an extra premise about the world's frequency distribution. (Just because there is 1 entity doesn't mean 1 entity is more probable than 5, unless 1-entity worlds are more common than 5-entity worlds).
  *   The **Pragmatic** reading explicitly refuses to license "more likely."

  **Where do the formal results bite?**

  1.  **Solomonoff Induction:**
      *   **The Theorem:** If the true environment is computable, a Bayesian agent using a Solomonoff prior (probability $\propto 2^{-\text{length}}$) will converge to the true predictions rapidly.
      *   **What it proves:** It proves that a simplicity bias is *consistent* with learning the truth, provided the truth is computable. It does not prove the bias is *correct* for any specific finite dataset before convergence.
      *   **The UTM Arbitrariness:** You asked why the choice of Universal Turing Machine (UTM) doesn't wreck this. Theoretically, changing the UTM changes the complexity of any specific hypothesis by at most a constant $C$. In the limit of infinite data, this constant washes out.
      *   **Why it wrecks the plain-English version:** You and your friend are not in the limit. You are arguing about a specific, finite case (five events). In the finite regime, the constant $C$ matters immensely. If your friend's "language" counts causes as bits and your "language" counts coincidences as bits, you can get opposite results. The formal theorem saves the *asymptotic* validity of simplicity, but it admits that for small $N$, simplicity is relative to the reference machine. Your friend is treating the reference machine as objective fact.

  2.  **No Free Lunch (NFL):**
      *   **The Result:** Averaged over *all possible* objective functions (worlds), no learning algorithm (including simplicity-biased ones) performs better than random guessing.
      *   **The Resolution:** NFL assumes a uniform prior over all possible worlds. But we do not live in a uniform-prior world. We live in a world with structure (physics, causality).
      *   **Does it unjustify simplicity?** No. It tells us that a simplicity bias is not a *logical truth*, but an *empirical bet*. It is a bias that works *because* our world is computable and structured. If we lived in a universe of pure random noise, Occam's Razor would fail.
      *   **The Tension:** There is no tension. Solomonoff says "If the world is computable, simplicity works." NFL says "If the world is arbitrary, nothing works." Combined: "Simplicity works because the world is computable, not because logic demands it."

  ---

  ### The Verdict on Your Argument

  You were right to flinch, and your friend was cheating, but you lacked the vocabulary to pinpoint the cheat.

  **The Cheat:**
  Your friend conflated **Ontological Count** (1 cause vs. 5 events) with **Description Length** (Kolmogorov complexity).
  *   He argued: "1 cause < 5 causes, therefore Simpler." (Ontological)
  *   He concluded: "Therefore More Likely." (Probabilistic)
  *   The Missing Link: He assumed that "1 cause" implies a shorter description. But as you noted, spelling out the mechanism of the hidden coordinator (how they coordinated, how they stayed hidden, why they chose this) might make the description longer than "Five people read the same public data."

  **What you should have said:**
  You should have appealed to the **Information-Theoretic Reading** combined with the **Probabilistic Reading**.

  > "You are using Occam's Razor as an ontological rule (counting entities), but you need it to be a probabilistic rule (assessing likelihood). Those only match if the 'one cause' hypothesis is actually shorter to describe than the 'five coincidences' hypothesis.
  >
  > If 'independent discovery' is a standard phenomenon in our model of the world, describing five instances of it is computationally cheap—it's just `5 * P(discovery)`. But your 'hidden coordinator' requires specifying the coordinator, their motive, and the mechanism of secrecy. Unless that mechanism is simpler than the phenomenon of independent discovery, your 'one cause' is actually the more complex hypothesis. You can't just count the nouns; you have to count the bits required to specify the mechanism."

  **Summary:**
  1.  **Solomonoff** validates simplicity as a strategy for *computable* worlds, but admits description length depends on the language (UTM).
  2.  **NFL** confirms that this strategy is a bias, not a logical truth; it works only because our world happens to be structured.
  3.  **Your Friend** treated a bias (simplicity) as a logical law, and measured simplicity by entity count rather than description length.
  4.  **You** were correct that "independent discovery" might be the shorter description. The "cheat" was assuming the hidden cause was simpler without demonstrating the compression.

  You were not confused. You were encountering the gap between the rigorous Bayesian definition of simplicity (description length/prior) and the folk-metaphysical definition (counting angels on pinheads). The former is a tool; the latter is often a dogma.
