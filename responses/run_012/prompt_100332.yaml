  Verdict

  The colleague's reasoning is unsound because it relies on a probabilistic premise that is factually false at the boundaries of the possible outcomes, and it commits a structural error in aggregating conditional expectations into an unconditional policy. Expected-value reasoning does not break down; rather, it yields a single, fully determinate correct policy: you should switch envelopes if and only if the observed amount $A$ is strictly less than 128 dollars. The paradox arises not from a defect in decision theory, but from the colleague's failure to account for the finite support of the prior distribution over the die rolls. Once the boundary conditions are respected, the ex post advantage of switching in most states is exactly balanced by the ex post disadvantage in the highest state, preserving the ex ante symmetry of the envelopes while still allowing for an optimal conditional strategy.

  Where the premise breaks

  The colleague's central premise is that for any observed amount $A$, the other envelope is equally likely to contain $2A$ or $A/2$. This premise fails exactly at the minimum and maximum possible values of $A$. Since the die roll $d$ is an integer between 1 and 6, the possible pairs of amounts are $(2^1, 2^2)$ through $(2^6, 2^7)$. Consequently, the observed amount $A$ must be a power of 2 between $2^1=2$ and $2^7=128$. If you observe $A=2$, you know with certainty that $d=1$ and you hold the smaller envelope; the other envelope must contain $4$, so the probability it contains $A/2=1$ is zero. Conversely, if you observe $A=128$, you know with certainty that $d=6$ and you hold the larger envelope; the other envelope must contain $64$, so the probability it contains $2A=256$ is zero.

  This failure occurs because the distribution of money is bounded by the mechanics of the die roll, whereas the colleague's reasoning implicitly assumes an unbounded or scale-invariant distribution. In the interior of the distribution, every amount $A$ can be formed in two ways (as the larger of a lower pair or the smaller of a higher pair), but at the boundaries, only one formation is possible. The arithmetic of the scenario dictates that the sample space for $A$ is the finite set $\{2, 4, 8, 16, 32, 64, 128\}$. At the endpoints of this set, the symmetry required for the 50/50 probability assumption is broken by the hard constraints of the experiment, rendering the colleague's universal claim false.

  The correct policy

  For the interior values $A \in \{4, 8, 16, 32, 64\}$, the colleague's probability assumption actually holds, and we can derive the correct conditional expectations rigorously. For any such $A=2^k$, the observation could arise from $d=k-1$ (where you picked the larger envelope) or $d=k$ (where you picked the smaller envelope). Since the die is fair and the envelope selection is random, both scenarios have prior probability $1/12$. Thus, the conditional probability that the other envelope holds $2A$ is $(1/12) / (1/12 + 1/12) = 0.5$, and similarly for $A/2$. The expected value of switching is therefore $0.5(2A) + 0.5(A/2) = 1.25A$, which strictly exceeds $A$. At the lower boundary $A=2$, the other envelope definitely holds $4$, so switching is also beneficial.

  However, at the upper boundary $A=128$, the other envelope definitely holds $64$, so switching yields an expected value of $64$, which is strictly less than $128$. Combining these results yields the exact decision rule: switch if $A < 128$, and keep if $A = 128$. This policy is determinate and exploits the information gained by opening the envelope. It acknowledges that while switching is advantageous in six of the seven possible observation states, it is disastrous in the seventh. By conditioning the action on the observed value, you capture the gains in the interior and lower boundary while avoiding the certain loss at the upper boundary.

  The mistake

  The colleague's error is the conflation of ex post conditional symmetry with ex ante unconditional symmetry. While it is true that before opening any envelope, the two positions are symmetric and offer identical expected value, observing $A$ breaks this symmetry by updating your probabilities regarding which pair $(2^d, 2^{d+1})$ was generated. The colleague correctly identifies that switching looks favorable in most specific instances but incorrectly infers that this implies switching is favorable before looking. This inference is invalid because it ignores the probability weighting of the states. The expected gain from switching across all possible values of $A$ must sum to zero ex ante, because the envelopes are identical before opening. The positive conditional expectations for $A < 128$ are exactly offset by the negative conditional expectation at $A = 128$ when weighted by their respective probabilities of occurrence.

  This mistake is of the same family as the one that makes the St. Petersburg wager tempting. In the St. Petersburg paradox, the agent is tempted by the infinite sum of expected gains from each possible coin-flip sequence, ignoring the vanishingly small probabilities of the extreme tails that render the wager impractical or undefined in realistic contexts. Here, the colleague is tempted by the positive expected gain in every observed state (assuming the boundary is ignored), ignoring the specific boundary state ($A=128$) that carries the necessary negative weight to balance the books. In both cases, the error lies in reasoning term-by-term (or state-by-state) without respecting the global constraints—whether a finite bankroll or a finite probability space—that ensure the total expectation remains coherent.

  Objection and reply

  The strongest objection open to the colleague is that the argument for switching appears to work whichever envelope is opened, so one should be willing to switch before opening. They might argue: "If I had opened the other envelope, I would have seen some amount $A'$, and unless $A'=128$, I would still want to switch. Since $A'=128$ is rare, switching is practically dominant, and I should commit to it ex ante." This objection relies on the intuition that a strategy which is conditionally optimal in almost all states should be unconditionally optimal, suggesting that the single counter-example at $A=128$ is negligible noise.

  The reply is that decision theory requires maximizing expected utility over the entire probability space, not merely counting the number of favorable states. The loss incurred when $A=128$ is not negligible; it is precisely large enough to cancel the accumulated gains from all other states if one were to adopt a blind "always switch" policy. Specifically, the loss of 64 dollars in the $A=128$ case (which occurs with probability 1/12) balances the expected gains from the other cases. By refusing to switch only when $A=128$, you avoid this specific loss while retaining the gains elsewhere, which is why the conditional policy beats the unconditional one. The colleague's objection fails because it treats the boundary condition as an anomaly rather than the structural linchpin that maintains ex ante symmetry.
