  Here is a decision tree designed to sort the positions you and your friend are arguing about. It uses ten concrete case questions to filter down to the six specific philosophical leaves you requested.

  ### The Decision Tree

  **Node 1: The Molecule Copy**
  *Case:* A machine scans a painting and prints a molecule-for-molecule copy.
  *Question:* Does this copy hold the exact same market value and aesthetic status as the original?
  *   **Yes:** Go to **Leaf A (Experience-All)**.
  *   **No:** Go to Node 2.

  **Node 2: The Labeled Fake**
  *Case:* A skilled human paints a fake, but it is honestly labeled as a "Copy" on the back.
  *Question:* Is it morally permissible to sell this copy for a modest price?
  *   **Yes:** Go to **Leaf B (Deception-Only)**.
  *   **No:** Go to Node 3.

  **Node 3: The Private Forgery**
  *Case:* A fake is sold as original to a private collector, hangs in their home, and is never detected by the public.
  *Question:* Does this transaction cause harm to the art world or the concept of art?
  *   **Yes:** Go to **Leaf C (Damage to Practice)**.
  *   **No:** Go to Node 4.

  **Node 4: The AI "Lost" Work**
  *Case:* An AI generates a brand-new painting in the style of a dead artist, which someone tries to sell as a long-lost work.
  *Question:* Is this object fundamentally a forgery of the dead artist's work?
  *   **No:** Go to **Leaf D (Copy as New Work)**.
  *   **Yes:** Go to Node 5.

  **Node 5: The Graduated Fake**
  *Case:* A famous fake is discovered and labeled as such, but over 50 years, people come to love it for its own history.
  *Question:* Can this fake eventually become a "real" work of art in its own right?
  *   **Yes:** Go to **Leaf D (Copy as New Work)**.
  *   **No:** Go to Node 6.

  **Node 6: The Ship of Theseus Chair**
  *Case:* An antique chair has every single part replaced over the years so nothing original is left.
  *Question:* Is this physically reconstructed chair the *same object* as the original?
  *   **No:** Go to **Leaf E (Historical Intrinsic)**.
  *   **Yes:** Go to Node 7.

  **Node 7: The Remastered Album**
  *Case:* A digital remaster of an old album vs. the original vinyl pressing.
  *Question:* Is the remaster the *same recording* as the original?
  *   **No:** Go to **Leaf E (Historical Intrinsic)**.
  *   **Yes:** Go to Node 8.

  **Node 8: The 3D Printed Sculpture**
  *Case:* A museum owns a sculpture but won't lend it, so they 3D print a replica for travel.
  *Question:* Is the 3D print considered an "artifact" of the original artist's work?
  *   **No:** Go to **Leaf E (Historical Intrinsic)**.
  *   **Yes:** Go to Node 9.

  **Node 9: The Studio Assistant**
  *Case:* A faker who was the artist's own studio assistant, using the same materials and methods, paints a work.
  *Question:* Is this painting worth the same as a painting by the master's own hand?
  *   **No:** Go to **Leaf E (Historical Intrinsic)**.
  *   **Yes:** Go to Node 10.

  **Node 10: The Contextual Value**
  *Case:* The remastered album from Node 7.
  *Question:* Do you value the remaster equally for *listening* but less for *collecting*?
  *   **Yes:** Go to **Leaf F (Deflationist)**.
  *   **No:** Go to **Leaf E (Historical Intrinsic)**.

  ***

  ### The Leaves (Positions)

  *   **Leaf A (Experience-All):** The value is all in the experience, so a good copy really is as good. (Your friend's likely extreme position).
  *   **Leaf B (Deception-Only):** The only wrong is the deception, so an undisguised copy is fine. (Your friend's likely practical position).
  *   **Leaf C (Damage to Practice):** The damage is to the practice rather than to any person or object, because art runs on trust in provenance.
  *   **Leaf D (Copy as New Work):** A copy can become a work in its own right once it's out in the open, which makes it a lot more interesting to ask what makes it a different work.
  *   **Leaf E (Historical Intrinsic):** The original has a kind of value that comes from its history—who made it, when, what it survived—that no amount of perceptual similarity can touch. (Your likely position).
  *   **Leaf F (Deflationist):** The whole question is confused; value depends entirely on the context of use (listening vs. collecting), not the object's ontology.

  ***

  ### Branch Analysis

  **Node 1 (Molecule Copy)**
  *   **Separates:** *Experience-All* vs. *Everyone Else*.
  *   **Recurring Split:** This is the "Perceptual Equivalence" test. It shows up again at Node 7 (Remaster) and Node 8 (3D Print), testing if physical/auditory identity equals ontological identity.
  *   **Incoherent Combo:** If someone answers "No" here (Copy is worth less) but "Yes" at Node 6 (Chair is the same), they are distinguishing between art and furniture. This is not incoherent; it's the standard *Historical Intrinsic* view.

  **Node 2 (Labeled Fake)**
  *   **Separates:** *Deception-Only* vs. *History/Practice Views*.
  *   **Recurring Split:** This tests "Ethics of Information." It recurs implicitly at Node 4 (AI), where the label is the difference between "Pastiche" and "Forgery."
  *   **Unexplored:** It is rare to find someone who says the molecule copy is worthless (Node 1 No) but selling a labeled fake is immoral (Node 2 No). This implies the object is harmless but the *act* of copying is taboo. This is a religious/sacral view of art, rarely articulated secularly.

  **Node 3 (Private Forgery)**
  *   **Separates:** *Damage to Practice* vs. *Object-Focused Views*.
  *   **Recurring Split:** This tests "Social Consequence." It is unique; no other node asks about harm without a victim.
  *   **Flag:** If someone answers "No Harm" here but "Yes" to Node 5 (Fake can graduate), they believe the object is neutral until the public engages with it. This is a coherent sociological view.

  **Node 4 (AI "Lost" Work)**
  *   **Separates:** *Copy as New Work* vs. *Forgery Views*.
  *   **Recurring Split:** This tests "Human Agency." It mirrors Node 9 (Assistant), asking if the hand matters more than the output.
  *   **Incoherent Combo:** Answering "No" (Not a forgery) here but "No" at Node 5 (Fake can't graduate) is slightly tense. It suggests AI gets a pass that humans don't. This is unexplored but not logically impossible (e.g., "AI has no intent to deceive").

  **Node 5 (Graduated Fake)**
  *   **Separates:** *Copy as New Work* vs. *Historical Intrinsic*.
  *   **Recurring Split:** This tests "Temporal Ontology." It asks if time can change what an object *is*.
  *   **Flag:** This leaf (Copy as New Work) is reached via two paths (Node 4 No, Node 5 Yes). They are indistinguishable in outcome but differ in origin (AI vs. Human). The tree treats them as the same leaf because the resulting valuation of the object is identical.

  **Node 6 (Ship of Theseus Chair)**
  *   **Separates:** *Functionalists* vs. *Materialists*.
  *   **Recurring Split:** This is the "Continuity" test. It wears a different hat at Node 7 (Remaster) and Node 8 (3D Print).
  *   **Unattractive:** Answering "No" (Not the same chair) leads to Leaf E. This is a hard Materialist view. It's unattractive to most because it implies restoring your own car makes it a different car.

  **Node 7 (Remastered Album)**
  *   **Separates:** *Source Authority* vs. *Output Authority*.
  *   **Recurring Split:** Same as Node 6. If you pass Node 6 but fail here, you believe physical objects can survive replacement but digital files cannot. This is a specific "Digital Skeptic" position.
  *   **Incoherent Combo:** Answering "Yes" (Same recording) here but "No" at Node 1 (Molecule copy not same) is the core of the Art vs. Non-Art distinction. It is the most common position in the tree.

  **Node 8 (3D Print)**
  *   **Separates:** *Institutional Sanction* vs. *Object Properties*.
  *   **Recurring Split:** Tests "Authority." If you say the museum print is an artifact, you value the Institution. If you say no, you value the Hand.
  *   **Unexplored:** Answering "Yes" here but "No" at Node 9 (Assistant) implies the Museum has more authority than the Artist. This is a specific "Curatorial Power" view.

  **Node 9 (Studio Assistant)**
  *   **Separates:** *Brand Value* vs. *Workshop Reality*.
  *   **Recurring Split:** Tests "Authorship." Mirrors Node 4 (AI).
  *   **Flag:** Many Historical Intrinsic people stumble here. They say the Chair is the same (Node 6 Yes) but the Assistant's painting is not (Node 9 No). This confirms they are not Materialists, but Art-Historical Essentialists.

  **Node 10 (Contextual Value)**
  *   **Separates:** *Deflationist* vs. *Historical Intrinsic*.
  *   **Recurring Split:** This is the "Meta-Question." It asks if the previous questions were valid.
  *   **Indistinguishable Leaves:** Leaf E (Historical Intrinsic) can be reached via Node 6, 7, 8, 9, or 10. Leaf F (Deflationist) is only reachable here.
  *   **Analysis:** If someone answers "Yes" to Nodes 6-9 (Functional identity holds) but "No" to Node 10 (Value is fixed, not contextual), they are a *Universal Functionalist*. They believe art is just decoration. This is a coherent but rare position that collapses Leaf A and Leaf F.

  ### Summary of Recurring Splits
  The tree relies heavily on the **Perceptual vs. Historical** split. It appears at Node 1 (Painting), Node 6 (Chair), Node 7 (Music), and Node 8 (Sculpture). If your friend answers "Same" to all of these, she is a **Perceptual Functionalist** (Leaf A or F). If she answers "Different" for the Painting but "Same" for the Chair, she is an **Art Essentialist** (Leaf E).

  The **Ethics vs. Ontology** split appears at Node 2 (Selling) and Node 3 (Harm). If she says "Ethical to sell" but "Harm is done," she holds a **Paternalistic** view (not explicitly mapped, but falls between Leaf B and C).

  ### Incoherent/Unexplored Combinations
  *   **The "Magic Chair" Combo:** Answering "No" at Node 6 (Chair is not same) but "Yes" at Node 1 (Copy is same). This implies paintings are more durable than furniture. This is incoherent physically, though common emotionally.
  *   **The "Silent Harm" Combo:** Answering "No" at Node 2 (Unethical to sell labeled fake) and "No" at Node 3 (No harm in private). This implies the act is sinful even if it hurts no one. This is a religious view, unexplored in secular aesthetics.

  ### Indistinguishable Leaves
  *   **Leaf D (Copy as New Work):** As noted, this leaf is reached whether the copy is AI (Node 4) or a human fake that aged well (Node 5). The tree cannot distinguish between "New Work by Algorithm" and "New Work by History," though the philosophical justification differs.
  *   **Leaf E (Historical Intrinsic):** This leaf is the "default" for anyone who cares about history. It is reached via five different failure points. The tree cannot distinguish between a Materialist Historicist (fails Node 6) and a Provenance Historicist (fails Node 9). They end up in the same place practically, even if their reasons differ.
