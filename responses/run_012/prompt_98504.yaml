  2.  **Deconstruct the Philosophical Positions:**
      *   **Devi's Position:** *Species Pluralist Realism.* She believes species are mind-independent units (lineages), but our *access* to them requires concepts, and different concepts carve the same reality in different valid ways. Analogy: "Water" is real, but we can define it by chemistry (H2O), function (solvent), or state (liquid). All track real features.
      *   **User's Position:** *Species Anti-Realism / Instrumentalism.* She believes "species" is a human construct imposed on a continuous reality. It's useful, but not "out there." Analogy: "Constellations." The stars are real, the patterns are ours.
