  3.  **Evaluate the Options Provided:**
      *   (a) Verbal: Is it just about the word? If they stopped using "species," would the disagreement vanish? Probably not. They'd argue about "lineages" or "taxonomic units."
      *   (b) Substantive (Biology): They agreed on the biology. So it's not about the facts of the flies.
      *   (c) Standards (Metaphysics): This looks promising. It's about what counts as "real."
