answer: |-
  Good morning. I'm going to be honest with you: I'm a backend engineer. My job is to make sure servers talk to each other without catching fire. I am not a speaker. I'm not a leader in the traditional sense. And I definitely didn't study philosophy in college—I barely survived the one ethics elective I took, mostly because I spent the semester arguing that the trolley problem would be solved with better track signage.

  But here we are. We're in a hotel ballroom, it's been a hell of a year, and leadership asked me to talk about resilience.

  I know the state of things. We missed our numbers for the last two quarters. In the spring, we let people go. I know some of you are looking around this room and noticing empty chairs where friends used to sit. I'm not going to stand up here and tell you that "everything happens for a reason." It doesn't. Those layoffs weren't an act of God or bad weather. They were decisions made by people above us. They were human choices. And missing our numbers wasn't bad luck; it was a market that shifted faster than we did.

  Usually, when people talk about resilience in this company, they talk about the Stoic "Dichotomy of Control." You've heard it. "Focus on what you can control, ignore what you can't." It's on mugs. It's in Slack statuses.

  But if you're in engineering, or sales, or really any job where outcomes depend on other humans, that advice feels like a lie. In engineering, almost nothing is cleanly "up to us." I can write perfect code, but if a third-party API changes its authentication protocol overnight, my service goes down. A salesperson can perfect their pitch, but if the client's budget gets frozen by their CFO, the deal dies.

  When you tie your mental health to the outcome—to the ship date, to the quota—and you do everything right but still fail because of external factors, you don't become resilient. You become bitter. Or you burn out.

  So, I want to propose a different tool. It's older than the Dichotomy of Control, and it's more useful for what we actually do. The Stoics called it the "Reserve Clause."

  It sounds complicated, but it's actually a simple syntax change for how we set goals. The Dichotomy says: "I will achieve this outcome." The Reserve Clause says: "I will pursue this outcome, assuming nothing prevents me."

  In Latin, they added *fate permitting*. In engineering terms, you might think of it as a conditional commit. You commit all your energy, all your skill, and all your focus to the goal. But you attach a rider to the contract. You say, "I am going to ship this feature, assuming the dependency holds." "I am going to close this deal, assuming the market doesn't crash tomorrow."

  This isn't pessimism. It's not saying, "I probably won't succeed, so why try?" It's the opposite. It's saying, "I will try harder than anyone else, but I will not tie my worth to a variable I cannot isolate."

  Why does this matter? Because it decouples your effort from the result.

  When you operate without the Reserve Clause, a failed launch feels like a personal failure. You think, "I wasn't good enough." But with the Reserve Clause, a failed launch is just a system error. You did your part. The external world didn't hold up its end. You can debug the system without debugging your soul.

  For the engineers in the room: You know the feeling of staying late to fix a bug, only for a flaky test to fail the build anyway. Without the reserve clause, that ruins your night. With it, you know you did the work. The test is outside your control. You go home.

  For sales and ops: You know the feeling of nurturing a lead for months, only for a merger to kill the project. Without the reserve clause, you feel cheated. With it, you recognize the boundary. You controlled the relationship; you didn't control the merger.

  This is how we survive a year like this without becoming cynical.

  We need to be clear about what happened this spring. People lost their jobs. That was not "fate." That was business. But for those of us still here, waking up every day wondering if the next round is coming is exhausting. It makes you hesitant to commit. You stop caring about the code quality. You stop picking up the phone. You protect yourself by doing less.

  The Reserve Clause invites you to do more, precisely because it protects you. It allows you to care deeply about the work without being destroyed by the outcome.

  I'm not asking you to be okay with the layoffs. I'm not asking you to pretend the missed numbers don't hurt. I'm asking you to protect your own engine. If you tie your self-worth to the stock price, you are handing the keys of your mental health to the market. The market is a terrible driver.

  So, here is my ask for the rest of this year.

  When you set your goals, add the rider. "I will build this, fate permitting." "I will sell this, nothing preventing." Pour everything you have into the action. Be the best engineer, the best salesperson, the best operator you can be. But when the external world does what the external world does—when dependencies break, when budgets freeze, when decisions come down from above—you need to know that you fulfilled your contract.

  Resilience isn't about having a thick skin. It's not about grinding through pain until you numb out. It's about knowing where your responsibility ends and the chaos begins. It's about working hard enough to be proud of the effort, regardless of the result.

  We are here to build things. We are here to solve problems. Let's do that with everything we've got. But let's do it with the understanding that we control the work, not the outcome. If we ship, great. If we don't, we still built it well.

  Let's get back to work. Thank you.
