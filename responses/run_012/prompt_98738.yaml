prompt: |-
  So I'm a backend engineer (no philosophy degree, and honestly barely survived the one ethics elective I took in college) and I somehow got voluntold to give the keynote at my company's big annual offsite this year. Picture a hotel ballroom: roughly 60/40 split between engineers who all listen to the same two Stoicism podcasts on their commutes, and sales/ops/finance folks who've never read a word of Marcus Aurelius and will start checking their phones the second I sound like a TED talk. Our CEO asked for "something about resilience" because it's been a rough year — we did a layoff round back in the spring and missed our number two quarters straight.

  Here's the angle I want to take, and I want your help turning it into an actual speech. Everybody keeps handing me the Stoic dichotomy of control — some stuff is up to us, some isn't — and it always rubbed me the wrong way, because in engineering almost nothing that matters is cleanly one or the other. A launch either ships or it doesn't, and you can do everything right and still get smoked by a flaky dependency or a competitor's surprise pricing move. Then I read about the reserve clause, this older Stoic move where you commit all the way to a goal but attach a little rider to it — I'm going to do this, assuming nothing gets in the way — so that caring about the outcome gets decoupled from needing the outcome to actually be okay. That's the thing I really want to teach people, because it's the whole difference between the engineers on my team who survive a bad quarter and the ones who burn out and quit.

  Write me the keynote — around 8 minutes spoken, so maybe 1100-ish words. It has to land for the engineers without turning into a lecture for everyone else, and it absolutely cannot come off as management telling people to be grateful they still have jobs. Be honest that the layoffs were a call made by people way above us, not weather. Please write it in American English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Speaker:** Backend engineer, no philosophy degree, barely survived ethics elective.
      *   **Audience:** Company offsite (hotel ballroom). 60% engineers (Stoicism podcast listeners), 40% sales/ops/finance (non-philosophers, impatient with jargon).
      *   **Context:** Rough year (layoffs in spring, missed numbers two quarters straight). CEO asked for "something about resilience."
      *   **Core Message:** The Stoic "Dichotomy of Control" is too binary for engineering/work. Prefer the "Reserve Clause" (commit fully but attach a rider: "fate permitting"). Decouple caring about the outcome from needing the outcome to be okay.
      *   **Tone:** Honest, not management-speak, not "be grateful you have a job." Acknowledge layoffs were human decisions, not weather. American English.
      *   **Length:** ~8 minutes spoken, ~1100 words.

  2.  **Determine the Structure:**
      *   **Opening (1 min):** Acknowledge the awkwardness (engineer giving a keynote), set the scene, validate the rough year without sugarcoating.
      *   **The Problem with "Control" (2 mins):** Address the cliché "Dichotomy of Control." Explain why it feels fake in engineering (dependencies, market shifts).
      *   **The Alternative: The Reserve Clause (3 mins):** Introduce the concept simply. Use an engineering analogy (committing code vs. deployment). Explain the mental shift (commitment + detachment).
      *   **Application to the Company Context (2 mins):** Address the layoffs and missed numbers directly. Apply the reserve clause to the situation. Distinguish between "giving up" and "protecting sanity."
      *   **Closing (1 min):** Call to action. Bring it back to the work. End on a grounded note.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with self-deprecation. "I write code, not speeches." Acknowledge the room's energy. It's been a hard year. Don't pretend it wasn't.
      *   *The "Control" Issue:* Everyone talks about "focus on what you can control." But in backend engineering, can you control the API dependency? Can you control the market? No. It feels like gaslighting when you do everything right and still fail.
      *   *The Reserve Clause:* Introduce the "Assuming nothing prevents me" rider. It's not pessimism; it's realistic planning. It's like a transaction rollback. You commit the work, but you don't tie your worth to the commit succeeding if the network partitions.
      *   *The Hard Stuff (Layoffs/Missed Numbers):* This needs care. Layoffs weren't "fate," they were decisions. But for those remaining, how do we process it? We can't control the board's decisions, but we control our craft. The reserve clause helps us work hard without burning out when the external result doesn't match the effort.
      *   *Closing:* We're here to build things. Build them well. If they ship, great. If not, we still built them well. Let's get back to work.

  4.  **Refining Tone and Language:**
      *   *Avoid:* "Synergy," "pivot," "grateful," "journey," overly academic philosophy terms (keep it practical).
      *   *Include:* Engineering metaphors (dependencies, rollbacks, shipping, flaky tests).
      *   *Voice:* Conversational, slightly dry, authentic, empathetic but firm.
      *   *Constraint Check:* ~1100 words. American English.

  5.  **Drafting - Iteration 1 (Mental Outline & Word Count Check):**
      *   Intro: 150 words.
      *   Control Problem: 300 words.
      *   Reserve Clause: 350 words.
      *   Company Context: 200 words.
      *   Outro: 100 words.
      *   *Total:* ~1100.

  6.  **Writing - Focusing on the "Reserve Clause" Explanation:**
      *   Need to make sure the sales/ops folks get it too. Don't get too deep into code metaphors. Use "planning a trip" or "making a sale" analogies alongside the code ones.
      *   *Key phrase:* "I will do this, fate permitting."
      *   *Key distinction:* It's not "I won't try because it might fail." It's "I will try hard, but I won't break if it fails."

  7.  **Writing - Addressing the Layoffs:**
      *   Must not sound like management apologizing or defending. Sound like a peer acknowledging reality. "People lost jobs. That wasn't weather. That was a choice." But now we are here. How do we move?

  8.  **Review against Constraints:**
      *   *Time:* 8 mins @ 140 wpm = 1120 words.
      *   *Tone:* Check for "toxic positivity." Ensure it acknowledges the pain.
      *   *Audience:* Balance the engineering lingo so sales doesn't tune out.

  9.  **Final Polish:**
      *   Check transitions.
      *   Ensure the "Reserve Clause" is the clear takeaway.
      *   Make sure the ending feels like a kickoff, not just a philosophy lesson.

  *(Self-Correction during drafting)*: I initially thought about using a specific code example like "database deadlock," but that might lose the sales team. Better to use "shipping a feature" or "hitting a quota" as the universal goal. I need to make sure I don't sound *too* cynical about the layoffs. Acknowledge the human cost without getting bogged down in guilt.

  *(Word Count Check)*: I need to monitor the length. If it gets too long, trim the philosophy history. If too short, expand on the practical application for sales/ops.

  *(Tone Check)*: Ensure I don't sound like I'm blaming the employees for burning out. Frame it as "protecting yourself" rather than "toughening up."

  Let's write.

