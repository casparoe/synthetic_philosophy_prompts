  3.  **Evaluate Point-by-Point (Drafting Assessments):**

      *   *Point 1: Badness cannot be the raw feel (Mira).*
          *   Status: Live debate. Hedonic theories (badness = felt quality) vs. Motivational theories (badness = motivation). Asymbolia is the key evidence for dissociation.
          *   Assessment: Underdetermined/Contested. Depends on whether you accept asymbolic states as *pain*. If yes, supports Mira. If no, supports Tomas. Literature is split (e.g., Gray vs. Bain).
      *   *Point 2: Indifference is pathology rather than evidence about welfare (Tomas).*
          *   Status: Philosophical dispute about welfare internalism vs. externalism.
          *   Assessment: Underdetermined. Welfare internalists say what matters is how it feels to the subject. Externalists say objective harm exists. Tomas appeals to externalism (like health), Mira to internalism (phenomenology). Neither decisively wins here without meta-ethical commitment.
      *   *Point 3: Badness must make a difference to be doing any work (Mira).*
          *   Status: Explanatory role of normativity.
