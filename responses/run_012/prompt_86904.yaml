      *   **Code of Conduct:** "shall not knowingly make a statement that is false, or that creates a materially misleading impression." "Statement" = oral/written communication. "Material" = reasonable client would consider important.
      *   **Committee Dynamics:** Split four ways.
          1.  *Strict Liability on Misleading:* "Knowingly" applies only to "false," not "misleading."
          2.  *Intent Required:* "Knowingly" applies to both. Member didn't *know* it would mislead, just that it was incomplete.
          3.  *Lying > Misleading:* Lying is a breach of trust; misleading is lesser/no wrong because the listener infers it.
          4.  *Misleading > Lying:* Misleading is worse because it's covert; victim can't object because words are true.
      *   **Precedent:** Prior decision found violation for a true statement in a footnote that left a misleading impression.
      *   **Requirements:**
          *   Recommend concrete disposition (Violation/No Violation/Reduced Sanction).
          *   State remedy and time frame.
          *   Address specific legal/ethical questions ("knowingly" scope, true-but-misleading statements, lying vs. misleading moral difference, client's opportunity to follow up).
          *   Explain future commitment (precedential value).
          *   Honestly note which reading is rejected and its strongest argument.
          *   Tone: Professional, authoritative, fair, reasoned (for colleagues to vote on).

  2.  **Determine the Stance/Disposition:**
      *   *The Facts:* The member technically told the truth ("never been fined") but evaded the spirit of the question ("ever been subject to investigation"). In a fiduciary/professional context, evasion that creates a false impression is usually problematic.
      *   *The Code:* "Knowingly make a statement that is... materially misleading."
      *   *The Precedent:* Footnote case suggests form doesn't save substance.
      *   *The Best Path:* A finding of **Violation**, but perhaps acknowledging the nuance in the sanction (not expulsion, but censure/remediation). Why? Because professional standards in finance rely heavily on trust and full disclosure. "Paltering" undermines trust just as much as lying.
      *   *Interpretation of "Knowingly":* It should apply to both prongs (fairness), *but* "knowingly creating a misleading impression" includes knowing that the listener will likely infer X from statement Y, even if Y is technically true. A reasonable adviser knows a client equates "no fine" with "no trouble."
      *   *Lying vs. Misleading:* The Code treats them equally ("false *or* misleading"). The moral distinction might exist philosophically, but professionally, the *impact* on the client is the same.
      *   *Follow-up:* The burden shouldn't be on the client to cross-examine their adviser.

