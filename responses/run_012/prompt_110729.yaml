  Ok so a few of us just started playing this game — I think it's called Nomic? — where you write down rules for the club and one of the rules tells you how to change the rules, and it was fun for about a week and now we're genuinely fighting, and I can't tell if we're just bad at it or if the whole thing is broken by design.

  Here's the bit that broke us. Our constitution says any rule can be changed by a two thirds vote, and that rule is itself just a rule like any other. So with two thirds we passed a new rule that says this rule can never be changed. Fine. Then some of us wanted to scrap it, and now we have two camps. One says of course we can scrap it, we just need two thirds and we change the no-changing rule. The other says no — that rule says it can't be changed, so it can't, full stop, and if you can override it then it was never really entrenched and you've made the whole idea of entrenching meaningless. Both arguments sound airtight to me and I keep flipping sides. Someone said it's like the old question of whether an all powerful being can make a rock so heavy it cant lift it, which I dont think is quite the same thing but whatever.

  What I want from you is a real number: your credence that there's a determinate fact of the matter here — that for a rule system like ours there's a right answer to whether we could repeal that rule, discoverable in principle, rather than it just being genuinely undetermined until someone (us, or some referee we appoint) decides and thereby makes it so.

  And I don't want the number on its own, I want it broken open. Give me the sub-questions it depends on and a rough probability for each, like: is this a real contradiction in the rules or just an under-specified case that any sensible set of rules leaves open; can a rule really bind its own amendment, or does the authority to amend always come from somewhere outside the rule it's amending; is what the rules permit a real fact about the world or just whatever a community treats as valid; does the chain of who authorizes the authorizer actually bottom out somewhere or does it go forever; does appointing a referee settle it by discovering the answer or just by fiat; and honestly whether our toy constitution is even complete enough to have answers. Whatever else you think belongs, add it.

  Then combine them into your number, and tell me which single sub-question the number is most sensitive to — like if I could flip just one of them, which one moves me most. And tell me what would actually shift your view, given that you cant look anything up and neither can I. Write it as one continuous thing, no headings or bullet points or bold text or tables, just prose like you're explaining it to me over a beer, because honestly thats the register this whole fight is happening in.
