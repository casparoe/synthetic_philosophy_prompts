answer: |-
  Look, I love that you guys are doing this, even if it is ruining your friendships, because you have accidentally stumbled into the exact same paradox that legal philosophers and constitutional scholars have been fighting over for the last century. You are basically arguing about the concept of sovereignty without knowing it, specifically the problem of whether a sovereign power can bind itself. It feels airtight on both sides because both sides are appealing to different layers of how rules work, one side appealing to the power that made the rule and the other appealing to the logic of the rule itself. You asked for a real number on whether there is a determinate fact of the matter here, meaning a right answer that exists independently of whatever you decide to do next, and after weighing the different philosophical layers involved, my credence that there is such a fact is point two eight.

  To get to that number, I have to break down what has to be true for there to be a right answer hidden in your constitution, and I need to assign a probability to each of those conditions holding up. The first sub-question is whether rules are logical objects that exist independently of the people playing the game, or if they are just social habits that only exist because you all agree to treat them as real. If rules are like math problems, there is a right answer waiting to be found, but if they are like language or customs, the meaning is only whatever the community accepts it to be at any given moment. I give about a thirty-five percent chance that rules are logical objects rather than social practices, because most toy constitutions like Nomic are ultimately grounded in the social agreement of the players to keep playing. The second sub-question is whether a rule can logically bind its own amendment procedure without creating a contradiction. This is the heart of your fight, where one side says the new rule blocks the old procedure and the other says the old procedure overrides the new rule. Logic does not actually give a clear answer here because it depends on whether you prioritize the timing of the rule or the hierarchy of the rule, and since your text does not specify a hierarchy, I give only a forty-five percent chance that logic alone dictates a specific outcome here. The third sub-question is whether your written text is complete enough to contain the answer, or if it is silent on this specific conflict. Given that you are playing a game designed to be modified and you are only a week in, it is highly likely your constitution is full of gaps and under-specified cases, so I give only a twenty-five percent chance that the text itself contains the solution you are looking for. The fourth sub-question is whether appointing a referee would settle the matter by discovering the answer or just by fiat. If a referee decides, are they finding a truth that was already there or are they making a new rule by resolving the ambiguity, and since most adjudication in ambiguous systems is effectively lawmaking, I give only a thirty percent chance that a referee would be discovering a pre-existing fact rather than creating a new one.

  When I combine these probabilities, the picture becomes clear enough to give you that final number. Since all four of those conditions really need to hold true for there to be a strong case that a determinate fact exists independently of your decision, the low probabilities on each drag the overall credence down significantly. If rules are social, there is no fact until you agree. If logic is ambiguous, there is no fact to find. If the text is incomplete, there is no fact written down. If adjudication is creative, there is no fact to discover. Multiplying the likelihoods of these necessary conditions being met leads me to stick with point two eight as my final credence that there is a right answer waiting for you to find it, which means I believe there is a seventy-two percent chance that the answer is genuinely undetermined until you guys decide to make it so, either by consensus or by one side winning the fight.

  The single sub-question that this number is most sensitive to is the first one, about whether rules are logical objects or social practices. If I were convinced that your game rules existed in a platonic sense independent of your group's agreement, like a math equation that is true regardless of whether anyone solves it, my overall credence would jump drastically, probably over point seven, because the social reality of your friendship would matter less than the logical consistency of the system. But since I view rules as fundamentally social tools that derive their power from acceptance rather than logic, that first premise carries the most weight, and if you could prove to me that your group had surrendered their sovereignty to the text itself in a way that removed their power to interpret it, that would move my view more than anything else. What would actually shift my view is if your original constitution had a specific clause establishing a hierarchy of rules, stating explicitly that some rules are superior to others and cannot be touched by normal amendment procedures, because that would move the second sub-question from a toss-up to a near certainty that there is a fact of the matter based on the text. Without that hierarchy, you are left with two rules claiming absolute authority, and in the absence of a higher authority to judge between them, the only fact that exists is the one you create when you decide who wins.
