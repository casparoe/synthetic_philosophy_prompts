      *   **Context:** Marker dedication at Corwin Mills site. Only remarks at the ceremony.
      *   **Audience:** 1/3 descendants of recorded people, 1/3 historical society volunteers/staff, 1/3 officials/commissioners, plus 2 unsentimental academic historians.
      *   **Core Constraint/Theme:** Treat the occasion as a *problem*, not a formality. Acknowledge the irony of a bronze plaque (official commemoration) honoring someone who worked on "history from below" (people markers usually leave out). This irony must *constrain* the speech, not just be a wry aside.
      *   **Methodological Angle:** Engage with the "microhistorians' wager" (single deviant life carries structural claim) without necessarily resolving it. Distinguish between honoring an individual vs. turning her into a specimen (amateur/autodidact).
      *   **Tone:** Warm (celebration), but the constraint should make the warmth harder to fake (authentic/earned).
      *   **Formatting:** No citations/footnotes. No invented quotes (paraphrase marked as reconstruction). Gloss methodological ideas in-clause.
      *   **Output:** Speech text + JSON object with specific fields (`remarks`, `governing_tension`, `deliberate_omissions`, `expert_markers`, `unresolved_irony`).

  2.  **Deconstruct the Tension:**
      *   *The Problem:* A bronze marker is static, official, and authoritative. Margaret's work was fluid, personal, and focused on the unmarked lives of workers.
      *   *The Risk:* Turning Margaret into just another "great person" (Great Man Theory equivalent) or reducing her to a type (the helpful local woman).
      *   *The Goal:* Honor her specific labor without claiming the marker solves the problem of forgetting. Acknowledge the speaker's own positionality (PhD student owing debt to an amateur).
      *   *The Microhistorical Wager:* Does Margaret's life represent the structure of local history preservation? The speaker is unsure if they want to claim that.

  3.  **Drafting - Section by Section:**
      *   *Opening:* Acknowledge the setting (Corwin Mills), the marker, and the weight of the occasion. Establish the tension immediately but warmly.
      *   *Margaret's Work:* Describe what she did (transcribing, interviewing) without romanticizing it too much. Focus on the labor.
      *   *The Irony/Constraint:* Address the bronze plaque. It fixes memory; her work kept it moving.
      *   *The Audience/Descendants:* Speak to the descendants without claiming to speak *for* the dead workers. Use paraphrased reconstructions carefully.
      *   *The Academic/Professional Angle:* Acknowledge the PhD status vs. her amateur status. Avoid making her a "specimen."
      *   *Closing:* Return to the marker as a starting point, not an end. Leave the irony unresolved.

  4.  **Word Count Check:**
