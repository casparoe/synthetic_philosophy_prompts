      *   End on the uncertainty.

  7.  **Developing the JSON:**
      *   `governing_tension`: Needs to capture the conflict between official commemoration and grassroots history.
      *   `deliberate_omissions`: Things I chose *not* to say (e.g., claiming she was a "professional," claiming the marker saves the history permanently).
