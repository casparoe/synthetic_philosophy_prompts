      *   *Check:* Warmth? *Correction:* Ensure gratitude shines through the intellectual rigor.

  6.  **Drafting the Speech (Mental or Scratchpad):**
      *   Start with the bronze. It's cold. She was warm.
      *   She saved voices. Now we fix her name in metal.
      *   I am a historian because of her. But I have a degree; she had patience.
      *   To the descendants: These aren't just names; they are people she listened to.
      *   To the officials: This marker isn't a period at the end of the sentence.
