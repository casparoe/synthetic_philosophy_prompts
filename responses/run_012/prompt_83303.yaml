answer: |-
  # Diagnostic Instrument: The Logical Space of Stakes and Knowledge

  **Instructions:** Answer each question based on your intuitions about the case described. Do not worry about which philosophical label your answer implies. Follow the path indicated by your response until you reach a leaf.

  ### **Node 1**
  **Case:** Consider a pair of cases identical in the subject's total evidence with only what is at stake varying. In the high-stakes version, is the claim "The subject knows" **false**, or has nothing epistemic changed?
  *   **False:** Go to **Node 2**.
  *   **Nothing Epistemic Changed:** Go to **Node 6**.

  ### **Node 2**
  **Question:** Is there a **single sense** of the word "knows" across both cases, or does the word shift meaning?
  *   **Shifts Meaning (No Single Sense):** Go to **Leaf 1**.
  *   **Single Sense:** Go to **Node 3**.

  ### **Node 3**
  **Case:** Consider a low-stakes bystander who ascribes knowledge to a high-stakes subject whose own verdict is that she does not know. Is the **bystander's** ascription true?
  *   **Yes:** Go to **Node 4**.
  *   **No:** Go to **Node 5**.

  ### **Node 4**
  **Case:** Consider a high-stakes speaker assessing a low-stakes subject. Is the truth of the ascription determined by the **speaker's** context?
  *   **Yes (Speaker's Context):** Go to **Leaf 2**.
  *   **No (Sensitive to Question):** Go to **Leaf 3**.

  ### **Node 5**
  **Case:** Consider a later assessor whose stakes differ from the original speaker's, where we ask whether both verdicts can be correct. Can **both** verdicts be correct?
  *   **Yes:** Go to **Leaf 4**.
  *   **No:** Go to **Node 8**.

  ### **Node 6**
  **Case:** Consider a case in which it would be improper or misleading to say that she knows even if she does. Do knowledge ascriptions in this context **lack truth values** entirely?
  *   **Yes:** Go to **Leaf 5**.
  *   **No:** Go to **Node 7**.

  ### **Node 7**
  **Question:** If the claim is true but improper, are the intuitions that drive the debate an **error** to be explained away, or do they signal a pragmatic constraint?
  *   **Error:** Go to **Leaf 6**.
  *   **Pragmatic Constraint:** Go to **Node 9**.

  ### **Node 8**
  **Case:** Return to the pair of cases identical in the subject's total evidence with only what is at stake varying. Does the subject's **evidence itself** include practical facts?
  *   **Yes:** Go to **Leaf 7**.
  *   **No:** Go to **Leaf 8**.

  ### **Node 9**
  **Case:** Consider a case in which the subject's belief is fixed and only what she may rely on in acting changes. Does this variation leave **knowledge** untouched?
  *   **Yes (Only Assertability Varies):** Go to **Leaf 9**.
  *   **Yes (Only Action Norms Vary):** Go to **Leaf 10**.

  ---

  ### **Diagnostic Leaves**

  **Leaf 1: The view on which the word has no single sense and the debate's central question has no unique answer.**
  *   **Awkward Commitment:** Disagreements about knowledge are often verbal misunderstandings rather than substantive conflicts.
  *   **Path:** 1-False → 2-Shifts Meaning.

  **Leaf 2: The word is sensitive to the speaker's context.**
  *   **Awkward Commitment:** A speaker can truthfully say "S knows" without knowing whether S's evidence meets the subject's own practical needs.
  *   **Path:** 1-False → 2-Single → 3-Yes → 4-Yes.

  **Leaf 3: The ascription is sensitive to the question under discussion.**
  *   **Awkward Commitment:** The truth of a knowledge claim can change mid-sentence if the conversational topic shifts, even if the speaker remains the same.
  *   **Path:** 1-False → 2-Single → 3-Yes → 4-No.

  **Leaf 4: The word is sensitive to the assessor's context rather than the speaker's.**
  *   **Awkward Commitment:** A knowledge claim made yesterday can change its truth value today solely because your stakes have changed.
  *   **Path:** 1-False → 2-Single → 3-No → 5-Yes.

  **Leaf 5: Knowledge ascriptions are not truth-apt at all.**
  *   **Awkward Commitment:** Sentences like "She knows the bank is open" do not state facts but express attitudes or norms.
  *   **Path:** 1-Nothing → 6-Yes.

  **Leaf 6: Knowledge is invariant and the intuitions are an error to be explained away.**
  *   **Awkward Commitment:** Ordinary people are systematically mistaken about whether they know things when stakes are high.
  *   **Path:** 1-Nothing → 6-No → 7-Error.

  **Leaf 7: The subject's evidence itself includes practical facts.**
  *   **Awkward Commitment:** Two subjects with identical sensory evidence can differ in what they know solely because one has more to lose.
  *   **Path:** 1-False → 2-Single → 3-No → 5-No → 8-Yes.

  **Leaf 8: The state itself is sensitive to the subject's practical interests.**
  *   **Awkward Commitment:** The threshold for knowledge rises with stakes, even though the subject's evidence remains exactly the same.
  *   **Path:** 1-False → 2-Single → 3-No → 5-No → 8-No.

  **Leaf 9: Knowledge is invariant and only assertability is not.**
  *   **Awkward Commitment:** It can be true that S knows, yet strictly improper to assert it, making the semantic truth practically inaccessible.
  *   **Path:** 1-Nothing → 6-No → 7-Pragmatic → 9-Assertability.

  **Leaf 10: The cases concern the norms of action or assertion and leave knowledge untouched.**
  *   **Awkward Commitment:** Stakes determine what you may *do* with a belief, but not whether that belief counts as knowledge.
  *   **Path:** 1-Nothing → 6-No → 7-Pragmatic → 9-Action Norms.

  ---

  ### **Closing Analysis**

  **Empty Cells in the Logical Space**
  The four axes of the space are (i) Location of Variation, (ii) Whose Position, (iii) What Shifts, and (iv) Treatment of Intuitions. This tree leaves several logical combinations empty:
  1.  **Assessor Sensitivity + Subject's Evidence Shifts:** This cell is empty because it is incoherent; if the *assessor's* context determines truth, the variation is in the ascription, not the *subject's* evidence state.
  2.  **Speaker Sensitivity + Nothing Epistemic Shifts:** This cell is undefended; if the speaker's context matters, it is typically because the semantic content (an epistemic threshold) shifts, not because nothing epistemic shifts.
  3.  **Pragmatic Variation + Error Theory:** This cell is empty by definition; one cannot claim the variation is pragmatic while simultaneously claiming the intuitions of variation are errors.

  **Indistinguishable Leaves**
  The tree cannot separate **Leaf 9** (Invariant/Assertability) and **Leaf 10** (Invariant/Action Norms) without a further case.
  *   **Required Case:** A scenario where it is *proper to assert* "S knows" but *improper to act* on the knowledge (or vice versa). If your intuition is that assertion is proper but action is not, you support Leaf 10. If assertion is improper, you support Leaf 9.

  **Case Mapping**
  *   **Case 1 (Low-stakes bystander/High-stakes subject):** Decides **Node 3**; separates Speaker/QUD Contextualism (Leaves 2, 3) from Subject/Assessor views (Leaves 4, 7, 8).
  *   **Case 2 (High-stakes speaker/Low-stakes subject):** Decides **Node 4**; separates Speaker Contextualism (Leaf 2) from QUD Contextualism (Leaf 3).
  *   **Case 3 (Later assessor):** Decides **Node 5**; separates Assessment-Sensitivity (Leaf 4) from Subject-Sensitive Invariantism (Leaves 7, 8).
  *   **Case 4 (Identical evidence/Stakes vary):** Decides **Node 1** and **Node 8**; separates Truth-Variation views (Leaves 1-4, 7, 8) from Invariantism (Leaves 5, 6, 9, 10) and distinguishes Evidential vs. Threshold SSI.
  *   **Case 5 (Belief fixed/Action norms vary):** Decides **Node 9**; separates WAM (Leaf 9) from Action Norms Invariantism (Leaf 10).
  *   **Case 6 (Improper to say/True):** Decides **Node 6** and **Node 7**; separates Non-Cognitivism (Leaf 5), Strict Invariantism (Leaf 6), and Pragmatic Invariantism (Leaves 9, 10).
