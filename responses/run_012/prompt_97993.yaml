  hey so im a junior in hs and ive been going down the mech interp rabbit hole after school, and i want to check whether my opinions actually hang together before i write about it for my philosophy club. here's where ive landed:

  1. a neural net is just a big pile of matrix multiplications. there's no "aboutness" in there, no meanings, it just computes numbers. so i dont think it really represents anything.
  2. but the interp stuff does seem to find real things. like they found a feature that fires for the golden gate bridge, and if you turn it up the model starts talking about the bridge more. that seems like its actually in there, not just a story we made up afterwards.
  3. my test for whether something is "really there": if i can find a direction in the activations and i can add it or subtract it and the output changes in the way i predicted, then its a real repersentation. if it only correlates with the output and i cant do anything with it, then its just a description.
  4. i think a representation has to be able to be wrong. like, if a thing cant be false then its not representing anything, its just a number sitting there.
  5. i dont think there's one true way to carve the network up into features. different decompositions are all just more or less useful, none of them is the real one.

  which of these actually fight each other? rank them worst to least bad and for the bad ones tell me the cheapest thing to give up. also i have a feeling at least one of these is only pretending to clash so please dont just say everything conflicts.
