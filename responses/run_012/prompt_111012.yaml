          *   *Independence:* Children become independent. Do sciences become independent of philosophical presuppositions (ontology, epistemology)?
          *   *Death of Ideas:* In families, children grow up. In science, old theories die. In philosophy, old theories are revisited. Is "accumulation" necessarily failure?

  3.  **Evaluate the Disanalogies & The Conclusion:**

      *   *Does the conclusion survive?*
