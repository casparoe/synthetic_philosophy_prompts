      *   *Tone:* Keep it analytical, respectful of the Dean's logic but rigorous in dismantling it.

  7.  **Final Polish:** Ensure the structure matches the prompt's requirements (Mapping -> Breaks -> Conclusion Survival -> Legal Analogy -> Concrete Cases). *Self-correction: Make sure the concrete cases are woven in to support the disanalogies, not just tacked on at the end.* (Decided to keep a dedicated section for cases for clarity as requested: "Keep it concrete: use cases...").

  8.  **Final Review against constraints:**
