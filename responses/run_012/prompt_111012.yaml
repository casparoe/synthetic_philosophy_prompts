          *   Diagnostic = Sciences winnow options (convergence); Philosophy accumulates options (divergence/no death of ideas).
          *   Conclusion = Philosophy has no results of its own, only departures. It is the graveyard of the unscientific.
      *   **The Task:**
          1.  Set out the correspondence explicitly (Parent, Child, Maturation, Home, House).
          2.  Identify where the mapping breaks (imported features of families vs. disciplines).
          3.  Determine which disanalogies matter for the conclusion.
          4.  Evaluate if the conclusion survives the disanalogies.
          5.  Evaluate the alternative analogy (Philosophy as a Legal System).
          6.  Keep it concrete (use cases of questions answered, dissolved, abandoned, handed back).

  2.  **Analyze the "Family Portrait" Analogy:**

      *   *Correspondence:*
          *   Parent: Philosophy (specifically, Natural Philosophy/Moral Philosophy of the past).
          *   Children: Established Sciences (Physics, Psych, Econ, etc.).
          *   Maturation: Methodological refinement (empiricism, math, falsifiability).
