answer: |-
  I keep the records for Blackwood Reach. It is a quiet trade, mostly consisting of birth dates that look alike and death dates that do not. But after the Mill No. 4 boiler went up in January of '24, the records grew heavy. People think a catastrophe has a single throat to choke. They want a name, a broken part, a spark. They want a line they can draw from the match to the powder. But when I lay out the debris of the No. 4 boiler on the warehouse floor, the lines do not draw straight. They braid.

  The explosion killed three men and shattered the windows of the town hall across the river. It was cold that week, the kind of cold that makes iron brittle. The mill had been running double shifts to meet the wool contract.

  Mr. Hale from the Insurance Consolidated arrived two days later. He wore a coat that repelled snow and carried a leather case that smelled of new money. He was there to find the leak in the liability. I was there to document the fact of it.

  We stood over the wreckage of the pressure vessel. The steel was peeled back like fruit skin.

  "The safety valve," Hale said. He pointed with a pencil, not touching the rusted lump of iron that used to regulate the steam. "Fused shut. Corrosion."

  "It was fused," I said. I wrote *Safety Valve: Seized* in the ledger. "If the pressure had risen, it could not have vented."

  "So," Hale said. "Mechanical failure. Wear and tear. That's in the policy exclusions."

  "But look at the feed pump," I said. I moved to the second piece of wreckage, the assembly that pushed water into the firebox to keep the temperature down. The lever was in the off position. The logbook, recovered from the ash, showed the engineer, Arthur Penhaligon, had marked the pump as inactive for the last four hours of the shift.

  "Penhaligon turned it off," Hale said. He tapped the logbook. "He disabled the cooling to stop the noise. If the valve had worked, the pressure would have vented. But he stopped the water. The metal overheated. It failed."

  "So," I said. "Human error. Negligence. That's also an exclusion."

  Hale lit a cigarette. The smoke hung in the cold air between us. "We need one cause, Clerk. The contract specifies *the* proximate cause."

  "There is a third thing," I said. I picked up a shard of the firebox lining. The coal residue was thick, black, and slick. "The supplier changed the contract in December. High sulphur content. It burns hotter than the boiler was rated for. Even with the valve working, even with the water on, the heat flux was beyond the design spec. The metal would have fatigued eventually."

  Hale blew smoke toward the ceiling. "Eventually isn't yesterday. We are talking about Tuesday at 4:00 PM."

  "I am talking about why it blew," I said.

  I wrote *Coal Quality: Substandard* in the ledger. Then I looked at the other two entries.

  Here is the shape of it, as I understand it, though I know my understanding is colored by the weight of the ledger. If the valve had been oiled, the pressure would have vented safely, despite the lack of water, because the steam generation would have capped itself. The explosion would not have happened. If the water pump had been left on, the temperature would have remained within limits, despite the fused valve, because the pressure would not have built to the bursting point. The explosion would not have happened.

  Both failures existed. Both were sufficient. If you remove the rust, the boiler holds. If you remove the negligence, the boiler holds. But neither was removed.

  Hale leaned over the ledger. He took his pen and drew a line through *Safety Valve: Seized*.

  "Wear and tear is inevitable," he said. "Iron rusts. That's the nature of the world. You can't insure against the nature of the world."

  "The nature of the world includes men who turn off pumps," I said.

  "Yes," Hale said. "But that is a choice. A choice is a cause. Rust is just time."

  He circled *Feed Pump: Disabled*. He underlined Penhaligon's name.

  "Penhaligon is dead," I said.

  "Then the estate is liable. Or the union. Someone pays."

  "You're choosing him because he's the least ordinary variable," I said. "The rust was everywhere. The coal was in every bin. But only Penhaligon turned that switch."

  "He caused the event," Hale said. "If he hadn't turned it, the event would not have occurred."

  "If the valve hadn't rusted, the event would not have occurred," I said. "You are selecting a cause based on who you can bill, not on what broke the steel."

  Hale capped his pen. "I am selecting a cause based on the definition of liability. A cause must be necessary. If the rust was there, but the water was on, would it have blown? No. Therefore the rust is not the cause. The lack of water is the cause."

  "If the water was on, but the valve was open, would it have blown?" I asked. "No. Therefore the lack of water is not the sole cause. You are pretending that because two roads lead to the cliff, only the one the car actually took exists."

  "The car took both," Hale said. "But only one driver."

  He pushed the ledger toward me. "Sign it."

  I looked at the page. The ink was still wet on Penhaligon's name. The line through the valve was dark and final. I could feel the texture of the paper, the roughness of the mill rag stock. I thought about the cold that week. I thought about the sulphur in the coal, burning hot enough to weaken the grain of the metal even before the pressure peaked. That was the third cause, the one neither of us wanted to sign. It implicated the owner, who signed the coal contract. It implicated the town, which needed the wool wages.

  If I sign, I say Penhaligon killed them. If I refuse, I say the town killed them.

  I picked up my pen. I did not sign. I added a note in the margin, small, in pencil. *Valve condition: Critical. Pump status: Off.*

  Hale saw it. He didn't erase it. He just took the ledger, closed it, and put it in his case. "We'll process the claim based on the primary entry."

  "The primary entry is a fiction," I said.

  "It's the necessary condition," he said. "Without the switch, the rust is just rust. With the switch, it's a bomb. We insure against bombs, not rust."

  "You insure against risk," I said. "The risk was the system. The switch was just the finger that pushed it."

  Hale zipped the case. "Send me the copies by Tuesday."

  He left the warehouse. The door swung shut on a bad hinge, clicking twice before it caught. I stood alone with the wreckage.

  I looked at the fused valve. It was a lump of oxide and silence. I looked at the pump lever. It was a piece of iron frozen in the off position.

  I know what Hale wants. He wants a story where one thing breaks and everything follows. He wants a line. But when I close my eyes, I see the pressure rising. I see the rust holding the steam in. I see the water stopping. I see the heat climbing.

  If the valve had worked, the steam would have hissed out, a white plume over Blackwood, and the men would be alive. If the pump had run, the water would have boiled, safe and loud, and the men would be alive. Both things failed. Both things held the explosion inside until it tore the steel.

  I opened the ledger again. I took my pen and hovered it over the page. I could cross out Hale's circle. I could write *Systemic Failure* across the top. But the form does not have a box for *Systemic Failure*. It has a box for *Mechanical Defect* and a box for *Operator Error*.

  I put the pen down. I left both entries. I left the circle around Penhaligon. I left the line through the valve.

  When the copy goes to the insurance company, they will see the circle. When the copy stays in the town hall, I will keep the line. We will both be right. The boiler blew because the valve was stuck. The boiler blew because the pump was off.

  I walked out of the warehouse and locked the door. The hinge clicked once, then held. I stood there for a moment, waiting to see if it would hold again. It did. But I knew that if the metal was tired, or if I pulled too hard, it would snap. Both things were true. The hinge was old. My hand was heavy.

  I walked home through the snow. The cold was enough to freeze the river. The wind was enough to strip the leaves. I kept walking, and I did not freeze, and the trees held their branches. But I knew that if the wind had been stronger, or if I had been weaker, I would not have made it.

  I put the key in the lock. It turned. The door opened. I went inside and sat at my desk. I opened the ledger to a fresh page. I wrote the date. I waited for the next thing to break. I know now that when it does, there will be two reasons. I will have to choose one to write down. I will choose the one that lets me sleep. But I will know, while I write, that the other one is waiting in the ink.
