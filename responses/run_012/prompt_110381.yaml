      *   **Characters:** Two characters disagreeing on the implication.
          *   Character A: Hunt for "the" cause is a category mistake; blame is about us, not the world (fatalism/structuralism).
          *   Character B: A factor that would have done the work anyway isn't a *true* cause (necessity condition); abolishing responsibility is wrong.
          *   Interaction: Oblique, through action/editing/signing, not speeches/lectures.
      *   **Specific Moment:** One character settles on a single cause because it's the least ordinary (arbitrary selection).
      *   **Ending:** Unresolved. The discomfort of holding two sufficient causes must be the ending. No moral, no adjudication.
      *   **Voice:** Close to a narrator who was there and now explains it. Unreliable in explanation, not facts.

  2.  **Brainstorming the Event:**
