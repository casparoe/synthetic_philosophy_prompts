      *   *Objection 2 (Anthropologist - High Damage):* The "lived reality" argument. In the field, people treat expressive norms *as if* they are load-bearing. The counterfactual doesn't matter to the person being sanctioned.
          *   *Idiom:* Emic vs. etic, lived experience, ethnographic reality.
          *   *Damage:* High. Makes the theory look disconnected from reality.

      *   *Objection 3 (Economist - Medium/High Damage):* The cost argument. Why enforce expressive norms if they don't coordinate? Because signaling *is* a coordination game. It's all costs/benefits.
          *   *Idiom:* Incentives, monitoring costs, equilibrium.
          *   *Damage:* Medium. Reduces the theory to economics.

      *   *Objection 4 (Legal Theorists - Medium Damage):* Legitimacy and Power. Who sorts the norms? If the state enforces dress, is it load-bearing?
