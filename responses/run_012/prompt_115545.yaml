          *   *Load-bearing:* Value in sameness/predictability (e.g., queueing, traffic direction). Strict enforcement justified.
          *   *Expressive:* Value in signaling identity/belonging (e.g., tipping, dress). Invitation, not demand.
          *   *Test:* Counterfactual (if everyone adopted a different rule, would capacity to act/predict remain? If yes -> Load-bearing. If no -> Expressive).
