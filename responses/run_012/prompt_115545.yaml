      *   *Vulnerability 2 (The Anthropologist):* "Armchair taxonomy." In the field, the line between load-bearing and expressive is blurred. Locals *feel* dress codes are load-bearing. The counterfactual is irrelevant to the lived experience of the norm.
      *   *Vulnerability 3 (The Legal Theorists):* Legitimacy. Who decides which is which? If the state enforces an "expressive" norm, does it become load-bearing by fiat? The gap between "real" and "enforceable."
      *   *Vulnerability 4 (The Economist):* Costs. Enforcement is expensive. If a norm is load-bearing, enforcement costs should be low because coordination benefits are high. If enforcement is high, it's usually because monitoring is hard, not because the norm type is different.
      *   *Vulnerability 5 (The Counterfactual Test):* Specifically Jaywalking. If everyone jaywalked safely, would it be load-bearing? The test seems to rely on hypothetical worlds that don't exist.
      *   *Vulnerability 6 (Overlap):* Many norms are hybrid. Tipping can be coordination (waiter knows who paid) and expressive (status).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Psychologists - High Damage):* They need to defend their construct. They will argue that "sorting" is just "tightness in specific domains." If I say society isn't tight/loose but sorted, they say "That's just domain-specific tightness, which our measures already capture."
