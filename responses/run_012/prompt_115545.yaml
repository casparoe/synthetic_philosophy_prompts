      *   *Rank 6:* Hybrid Norms.
      *   *Rank 7:* The "Hope Nobody Asks" (The Meta-Tightness).

      *Wait, I need to ensure the idioms match the specific personas described.*
      *   Psychologists: "Construct validity," "covariation with threat," "measurement instrument."
