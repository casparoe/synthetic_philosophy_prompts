          *   *Damage:* Medium. Political implications.

      *   *Objection 5 (The Counterfactual/Jaywalking - Medium Damage):* The weak joint. How do you operationalize the counterfactual?
          *   *Idiom:* Operationalization, falsifiability.
          *   *Damage:* Medium. Methodological weakness.

      *   *Objection 6 (Hybrid Norms - Low/Medium Damage):* Tipping is both.
          *   *Idiom:* Overlap, multi-functionality.
          *   *Damage:* Low. Nuance issue.

      *   *Objection 7 (The "Hope Nobody Asks" - High Damage):* If the sorting is cultural, doesn't that just mean the culture is tight about *sorting*?
          *   *Idiom:* Meta-level tightness.

