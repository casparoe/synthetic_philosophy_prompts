answer: |-
  ### Q&A Strategy Sheet

  **Objective:** Defend the Load-Bearing vs. Expressive distinction against absorption into existing paradigms (Tight-Loose, Cost-Benefit, State Power).
  **Constraint:** 2-minute replies. No citations.
  **Ordering:** Ranked by potential damage to the thesis if the objection lands.

  ---

  #### 1. The Economist: The Signaling Collapse
  **Idiom:** Equilibrium, incentives, monitoring costs.
  **The Objection:** "You're drawing a bright line where there's a gradient of costs. An expressive convention like dress is just a signaling equilibrium. It coordinates expectations about status and trust. If I violate it, I disrupt the signal, just as a jaywalker disrupts traffic flow. The only difference is that the monitoring costs for dress are lower, so enforcement is social rather than legal. If both are coordination games solved by enforcement, your 'sorting' is just a description of different cost structures. Why do we need a new typology?"
  **Damage:** **Critical.** If expressive norms are just coordination games with different payoffs, the dichotomy collapses into a single economic logic.
  **Concede Up Front:** "You are right that both involve expectations and both can be modeled as equilibria. I am not denying the economic structure of the interaction."
  **The Reply:** "The distinction isn't about the *structure* of the game, but the *consequence* of the solution. In load-bearing conventions (traffic), the specific solution is arbitrary, but the *existence* of a solution is vital. If we all drove on the left, it works as well as the right. In expressive conventions (dress), the specific solution is *not* arbitrary; the value is in the specific history or identity attached to it. If we all switched to wearing tunics tomorrow, traffic would flow fine, but the social signal of 'who belongs' would vanish. One coordinates *action*; the other coordinates *identity*. Enforcement costs explain *how* we police them, but not *why* the violation feels different to the participants."
  **Soft Spot:** You are relying on a phenomenological difference ("feels different") to sustain a structural distinction. A determined economist can argue that "identity coordination" is just another utility function.

  #### 2. The Cultural Psychologists: The Construct Validity Trap
  **Idiom:** Measurement, variance, covariation, threat, state capacity.
  **The Objection:** "We've spent a decade showing that 'tightness' isn't just one number; it varies by domain. Your 'sorting' looks exactly like domain-specific tightness. When you say a society is strict about queues but loose about dress, our instruments already capture that variance. By renaming this 'sorting,' you aren't offering a new mechanism; you're just describing the output of our measures without accounting for the ecological predictors (threat, wealth) we've already identified. How is this not just Tight-Loose theory with extra steps?"
  **Damage:** **High.** If the room accepts this, your thesis becomes a subset of their existing work rather than a challenge to it.
  **Concede Up Front:** "I agree that societies vary by domain, and your instruments capture that variance better than any single dial."
  **The Reply:** "The difference is predictive direction. Tight-Loose theory predicts that if a society faces high threat, the dial turns up across the board. My thesis predicts that threat might tighten load-bearing norms (safety, queues) while leaving expressive norms (dress, art) loose, or even loosening them to allow for stress relief. If you treat them as one construct, you miss the trade-offs. A society isn't 'medium tight'; it is strictly sorted. If you aggregate them, you lose the ability to predict *where* the enforcement will land when resources shrink."
  **Soft Spot:** You need empirical evidence that threat tightens one domain while loosening another. If their data shows they move in tandem, your distinction is theoretically sound but empirically empty.

  #### 3. The Anthropologist: The Emic Reality Check
  **Idiom:** Lived experience, emic perspective, armchair taxonomy, local customs.
  **The Objection:** "In the field, people don't make this distinction. When I lived in the community you're using for examples, violating a dress code provoked the same visceral anger as violating a safety rule. To the locals, the dress code *was* load-bearing; it held the social fabric together. Your counterfactual test asks us to imagine a world where everyone wears tunics. But that's an etic abstraction. For the actors, the harm *is* the deviation. If you define a norm as 'expressive' because a theorist thinks it doesn't matter, but the locals enforce it like it does, aren't you just imposing your own taxonomy on their reality?"
  **Damage:** **High.** It disconnects your theory from the actual human experience of norms, making it look like armchair philosophy.
  **Concede Up Front:** "You are absolutely right that from the inside, the sanction feels the same. I am not trying to describe the emotional experience of the enforcer."
  **The Reply:** "I am trying to explain the *resilience* of the norm, not the heat of the moment. When a crisis hits—a flood, a war—communities often drop expressive norms to survive, but they cling to load-bearing ones. The dress code might feel sacred today, but if the water rises, people stop caring about the tunics. They never stop caring about who has the boat. My sorting predicts which norms survive when coordination becomes a matter of life and death. The locals' anger is real, but it's not a reliable guide to the norm's function."
  **Soft Spot:** This concedes that the distinction is only visible in hindsight or crisis, making it hard to use for analysis in stable times (which is most of the time).

  #### 4. The Legal Theorists: The Coercion Problem
  **Idiom:** Legitimacy, jurisdiction, enforceability, state power.
  **The Objection:** "You say expressive norms should be 'invited, never demanded.' But what happens when the state demands them? If a government legislates dress or language, does that norm magically become load-bearing because it is now enforceable? You talk about the gap between a norm being real and being enforceable. If the state closes that gap with coercion, doesn't that override your functional sorting? A load-bearing norm without state backing is just a habit; an expressive norm with state backing is tyranny. Doesn't power determine the category, not function?"
  **Damage:** **Medium.** It challenges the normative core of your thesis (that some things *shouldn't* be demanded).
  **Concede Up Front:** "State power can certainly force compliance with expressive norms. I don't deny that coercion works."
  **The Reply:** "Coercion can secure compliance, but it cannot secure the *value* of the norm. You can force everyone to wear a uniform, but you cannot force them to believe it signals loyalty. When the state enforces an expressive norm, it often destroys the very signal it seeks, turning a mark of belonging into a mark of submission. Load-bearing norms gain legitimacy from their utility; expressive norms lose legitimacy when coerced. The category doesn't change, but the cost of enforcement becomes unsustainable."
  **Soft Spot:** History is full of coerced expressive norms (religious conformity, nationalist dress) that lasted centuries. "Unsustainable" is a long time.

  #### 5. The Methodologist: The Counterfactual Circle
  **Idiom:** Operationalization, falsifiability, measurement.
  **The Objection:** "You admit the counterfactual test is the weak joint. Here is the problem: To know if a convention is load-bearing, you ask: 'If everyone did otherwise, would prediction fail?' But we can't observe that. So, in practice, you will identify load-bearing norms by looking at which ones people punish severely. But then you use the category to explain why people punish severely. Aren't you defining the category by the very behavior you're trying to explain? It's circular."
  **Damage:** **Medium.** It exposes the methodological weakness you already identified.
  **Concede Up Front:** "You are right. We cannot run the counterfactual experiment in reality. It is a thought experiment, not a measurement tool."
  **The Reply:** "It is not circular if we use independent criteria to sort them before looking at enforcement. We sort traffic as load-bearing because the physical constraints of vehicles make coordination necessary for safety, regardless of the law. We sort dress as expressive because physical safety is unaffected. We use the *material consequences* of the deviation to sort the norm, not the social reaction. If the deviation causes a crash, it's load-bearing. If it causes a glare, it's expressive. Then we check if the enforcement matches."
  **Soft Spot:** "Material consequences" is slippery. Is a social ostracism a material consequence? If you include social harm, you circle back to enforcement severity.

  #### 6. The Pragmatist: The Hybrid Norm
  **Idiom:** Overlap, multi-functionality, boundary conditions.
  **The Objection:** "Most norms are hybrids. Tipping is expressive (status) but also load-bearing (waiters need to know who paid). Jaywalking is expressive (rebellion) but also load-bearing (safety). If a norm serves both functions, how do you sort it? If you say 'it depends,' then your binary is just a heuristic, not a taxonomy. If you force it into one box, you lose the explanatory power for why enforcement is so messy."
  **Damage:** **Low.** This is a nuance objection, not a structural one.
  **Concede Up Front:** "Many norms are indeed hybrid. The binary is an ideal type, not a description of every single interaction."
  **The Reply:** "When a norm is hybrid, enforcement becomes unstable. We see this in tipping: sometimes it's treated as a wage (load-bearing), sometimes as a reward (expressive). The conflict arises *because* the sorting is ambiguous. My thesis predicts that the most contentious norms in any society will be the hybrids, where one group treats it as load-bearing and another as expressive. The messiness isn't a bug; it's evidence of the sorting conflict."
  **Soft Spot:** This turns your theory into a post-hoc explanation for conflict rather than a predictive tool for stability.

  ---

  ### The "Must-Land" Reply
  **Target:** Objection #1 (The Economist).
  **Why:** If the Economist convinces the room that expressive norms are just high-cost signaling equilibria, your two categories merge into one economic logic. The thesis ceases to be a new theory and becomes a description of price points.
  **Strategy:** You must hold the line that *identity* coordination is fundamentally different from *action* coordination. Do not let them reduce "belonging" to a "utility function." Emphasize that load-bearing norms survive utility changes (we still drive on the right even if the car is better on the left), whereas expressive norms collapse if the identity value is removed.

  ### The Question You Hope Nobody Asks
  **The Question:** "You say the test is counterfactual: 'If everyone adopted a different convention, would capacity to act remain?' But how do you measure 'capacity to act' without looking at how angry people get when the norm is violated? If the only way you know a norm is load-bearing is that people get furious when it's broken, aren't you just using 'Load-Bearing' as a synonym for 'High Sanction,' which is exactly what Tight-Loose measures?"

  **Why this kills you:** It attacks the admitted weak joint (the counterfactual) and argues that your operationalization is circular. If you cannot measure the "capacity to act" independently of the "social sanction," you have not escaped the Tight-Loose framework; you have just renamed it.

  **Preparation:** If asked, do not bluff. Concede that current measurement is difficult. Pivot to *physical constraints* (traffic crashes vs. hurt feelings) as the independent variable, even if it narrows the scope of your theory. Better a narrow, defensible theory than a broad, circular one.
