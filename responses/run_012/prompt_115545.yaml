  6.  **Developing the "Must-Land" Reply:**
      *   Which objection kills the thesis if not answered? The Anthropologist's. If the distinction doesn't exist in the lived experience of the actors, it's just a theorist's game. *Correction:* Actually, the Psychologist's objection is more fundamental to the *claim* of the talk (replacing Tight/Loose). But the Anthropologist's objection undermines the *evidence*. Let's look at the Economist. If expressive norms are just signaling games, they *are* coordination games (load-bearing). That collapses the dichotomy.
      *   *Decision:* The Economist's objection is the most theoretically destructive. If signaling *is* coordination, the two categories merge. The reply must distinguish *functional coordination* (getting things done) from *social coordination* (knowing who you are).
      *   *Alternative Decision:* The Psychologist objection is the most immediate threat in the room. They define the field. If they say "This is just Tight-Loose," the audience believes them.
