      *   **Required Argumentative Pressure:**
          *   Students must argue what a "GWT = Access Only" defender must claim about *prevalence-without-ignition* and *silent ignition*.
          *   Must address the methodological problem: evidence of experience runs through report, so validating ignition against report may presuppose only ignited contents are conscious (circularity/report bias).
