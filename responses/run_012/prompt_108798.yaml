answer: |-
  ### 1. Exam Question

  **Global Workspace Theory (GWT)** posits that consciousness arises when content wins a competition for limited capacity, is amplified, and broadcast to consumer systems. Define **ignition** as this specific event of winning, amplification, and full projection. Define **prevalence** as a state where content influences many downstream systems weakly and in parallel, without winning competition or amplification (like many murmuring vs. a PA announcement). Define **silent ignition** as full ignition occurring while read-out pathways to report and action are severed or masked.

  Assume a defender claims GWT explains access consciousness but not phenomenal consciousness. Using these three notions, argue whether this defender can consistently maintain that ignition is necessary for experience. Specifically, analyze what status prevalent-but-unignited content must have, and whether silent ignition entails experience. Finally, address the methodological problem: if validating ignition as a marker of consciousness relies on subject report, does this presuppose that only ignited contents are conscious? Defend a position on whether GWT can escape this circularity.

  ***

  ### 2. Model Answer

  A defender claiming Global Workspace Theory (GWT) is solely a theory of access consciousness faces a dilemma when confronted with the distinctions between ignition, prevalence, and silent ignition. To maintain that ignition is necessary for experience while admitting GWT only explains access, one must argue that access is a prerequisite for phenomenality. However, the concepts of prevalence and silent ignition reveal a methodological circularity in validating this claim.

  Consider first prevalence without ignition. If content is prevalent—influencing many systems weakly without amplification—it is accessible only in a degraded, unconscious manner. For the access-only defender, this content is unequivocally unconscious. However, this invites the phenomenal overflow objection. If a subject experiences rich detail (phenomenality) that exceeds their ability to report or manipulate (access), that experience might correspond to prevalent content rather than ignited content. If the defender insists ignition is necessary for experience, they must deny overflow exists. They must argue that any reported experience implies prior ignition. But this relies on report, which is an access function. Thus, denying overflow based on lack of report presupposes that experience requires access, begging the question against the phenomenalist who claims experience exceeds access.

  Consider next silent ignition. Here, the neural mechanism of consciousness (ignition) occurs, but the pathways to report are severed. For the access-only defender, this state is problematic. If consciousness is access, and access implies potential for rational control or report, silent ignition might be classified as unconscious despite the neural signature. However, if the defender concedes silent ignition is conscious, they admit experience can exist without report. This undermines the methodological reliance on report to validate ignition. If we identify ignition as the marker of consciousness because it correlates with report, we cannot then claim ignition constitutes consciousness in cases where report is absent. We have defined the marker by the very evidence (report) we are now disregarding.

  This generates the core methodological problem. We verify what is conscious via report. We identify ignition via neural measures. We correlate the two to claim ignition marks consciousness. But if we encounter silent ignition, we cannot verify consciousness via report. If we assert it is conscious anyway, we are relying on the theory (ignition = consciousness) rather than evidence (report). If we encounter prevalence without ignition, and the subject reports nothing, we assume unconsciousness. But if phenomenality overflows access, the subject might experience the prevalent content without being able to report it. By defining consciousness through ignition and validating ignition through report, we construct a closed loop that excludes phenomenal overflow by definition rather than discovery.

  Therefore, the access-only defender cannot consistently maintain ignition is necessary for experience without falling into circularity. To escape this, they must either admit GWT is purely functional (leaving phenomenality unexplained) or provide a non-report-based measure of experience. Without such a measure, the claim that ignition constitutes experience is not an empirical finding but a theoretical stipulation that rules out prevalence-based phenomenology by fiat. The theory thus protects itself from overflow arguments not by evidence, but by defining the neural correlate of consciousness in a way that makes overflow empirically invisible.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  **1. Correct Application of Definitions (5 marks)**
  *   **Criteria:** Explicitly distinguishes ignition (all-or-none broadcast) from prevalence (weak parallel influence) and silent ignition (broadcast without report).
  *   **Miss:** Conflating prevalence with unconscious priming or treating silent ignition as merely inattention.

  **2. Analysis of PrevalenceWithoutIgnition (5 marks)**
  *   **Criteria:** Identifies that for the access-defender, prevalent content is unconscious, but recognizes this creates the overflow vulnerability (experience without access).
  *   **Miss:** Asserting prevalence is unconscious without acknowledging the phenomenalist counter-claim that this *is* the overflow case.

  **3. Analysis of Silent Ignition (5 marks)**
  *   **Criteria:** Recognizes the tension: if ignition = consciousness, silent ignition is conscious; but if access = consciousness, silent ignition is ambiguous due to lack of report potential.
  *   **Miss:** Treating silent ignition as straightforwardly conscious without noting the access-defender's commitment to report/control potential.

  **4. The Methodological Circle (5 marks)**
  *   **Criteria:** Explains that validating ignition via report presupposes access is necessary for experience, making the theory immune to falsification by overflow cases.
  *   **Miss:** Mentioning report bias generally without linking it to the validation of ignition specifically.

  **5. Defended Position/Synthesis (5 marks)**
  *   **Criteria:** Concludes clearly whether GWT can escape circularity (e.g., by admitting it is purely functional or requiring non-report measures).
  *   **Miss:** Ending with a neutral summary ("there are two sides") rather than a defended conclusion.

  **A vs. B Separator:**
  *   **A Grade:** Explicitly articulates that defining ignition as the correlate of consciousness *using report data* makes detecting consciousness without report (silent ignition) or without ignition (overflow) logically impossible within the framework.
  *   **B Grade:** Correctly analyzes the cases but treats the methodological problem as a practical difficulty rather than a constitutive circularity.

  **Cap Errors (Max 10 marks if present):**
  *   Reciting Block's distinction without using the terms ignition/prevalence/silent ignition.
  *   Claiming empirical results (e.g., "change blindness shows...") without describing the logical structure of the result as required.
  *   Failing to address the report/validity circularity.
