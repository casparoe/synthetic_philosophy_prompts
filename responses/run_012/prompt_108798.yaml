          *   If GWT = Phenomenal Theory: Ignition makes it conscious. Report is separate. So silent ignition should be conscious experience without report.
          *   *The Methodological Trap:* We only know about experience via report. If we define consciousness by ignition, and validate ignition by report, but then encounter silent ignition (ignition without report), how do we verify consciousness? If we assume ignition = consciousness, we beg the question against overflow (which says there's experience without ignition/report).
