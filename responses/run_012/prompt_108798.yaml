  2.  **Deconstruct the Philosophical Crux:**
      *   *The Tension:* GWT says consciousness = ignition (global broadcast). Block says consciousness (phenomenal) might overflow access.
      *   *Prevalence without Ignition:* If information is widely available weakly (prevalent) but not ignited, is it conscious?
          *   If GWT = Access Only: Ignition is necessary for access. So prevalence without ignition is unconscious.
          *   If GWT = Phenomenal Theory: Ignition is necessary for experience. So prevalence without ignition is unconscious.
