answer: |-
  This is a sophisticated framework. It avoids the tired binary of "peace versus justice" and instead isolates the *logic of justification* underpinning amnesty. You are asking for an adjudication of the taxonomy itself, using the South African Truth and Reconciliation Commission (TRC) as the primary exhibit and Argentina and Rwanda as stress tests.

  Here is the disciplined mapping you requested, followed by an assessment of the framework's utility and the state of scholarly consensus.

  ### I. Mapping the TRC Design to the Framework

  Your three categories are analytically distinct, but in the TRC's architecture, they operate in tension. The design does not fit neatly into one; rather, it uses the *Constitutive* to mediate between the *Prudential* and the *Restorative*.

  **1. The Prudential Bargain**
  *   **Fit:** High regarding the *necessity* of the transition; Low regarding the *specific design*.
  *   **Design Evidence:** The Postamble to the Interim Constitution (1993), which authorised amnesty, was a direct result of the National Party's negotiating leverage. A blanket amnesty was the initial demand.
  *   **Tension:** If the justification were purely prudential, a blanket amnesty (as initially proposed by the NP) would have been more stable. The choice of *individual, conditional* amnesty introduced risk without securing additional security guarantees. Therefore, prudential necessity explains the *existence* of amnesty, but not its *form*.

  **2. The Restorative Justification**
  *   **Fit:** High regarding *rhetoric and procedure*; Mixed regarding *outcome*.
  *   **Design Evidence:** The emphasis on public victim testimony, the definition of "gross violations of human rights" (focusing on bodily integrity rather than structural dispossession), and the theological language of Archbishop Tutu ("restorative justice" vs "retributive justice").
  *   **Tension:** Restorative justice usually implies a dialogue between victim and offender aimed at reintegration. The TRC's amnesty hearings were often adversarial legal proceedings. Furthermore, restorative justice typically requires material reparation to be complete; the TRC's inability to secure state funding for reparations undermines the claim that this was a self-sufficient restorative process.

  **3. The Constitutive Justification**
  *   **Fit:** Highest regarding the *legal and political architecture*.
  *   **Design Evidence:** The amnesty power was not an executive pardon but a statutory creation embedded in the founding document of the new democracy. By granting amnesty only for acts with a "political objective," the Commission was tasked with drawing the line between criminal common law and political conflict.
  *   **Analysis:** This is the strongest fit for the *design*. The act of defining what counted as "political" was an act of refounding the polity. It transformed perpetrators from enemies of the state into actors within a political conflict, thereby legitimising the new state's monopoly on defining violence. The conditional nature (full disclosure) was not just to buy truth (Restorative) or ensure safety (Prudential), but to force the perpetrator to acknowledge the new order's authority to judge them even while forgiving them.

  **Verdict on Fit:** The TRC design is best understood as a **Constitutive mechanism** dressed in **Restorative language** to make a **Prudential necessity** palatable. The conditionality and individuality of the amnesty are the key indicators: they serve the Constitutive aim (redefining the citizen's relationship to the state) better than the Prudential aim (which would prefer silence and blanket immunity).

  ### II. What the Framework Cannot Capture

  Your framework is excellent for analysing the *justification of amnesty*, but it forces silence on two critical dimensions of the South African episode.

  **1. Structural and Economic Violence**
  The framework assumes the "wrong" to be addressed is the gross violation (torture, killing) eligible for amnesty. It cannot capture the critique that the TRC individualised guilt to exonerate the system. By focusing on the *act* of violence (which can be amnesty-ed), it obscured the *structure* of apartheid (which could not). The framework asks "Why amnesty this act?" but cannot ask "Why does this process leave the economic architecture of the old order intact?" This is not a silence in the case; it is a silence forced by the framework's focus on the *mechanism of amnesty* rather than the *scope of justice*.

  **2. The Temporal Dimension of the Bargain**
  Your categories are static. They assess the justification at the moment of design. They cannot capture the erosion of the bargain over time. In South Africa, the "truth" was exchanged for "amnesty," but the "reparation" was deferred. A framework focused on the justification of amnesty struggles to account for the *breach* of the bargain two decades later. It treats the commission as a closed event rather than an open wound.

  ### III. Comparative Stress Tests

  **1. Argentina: The Unravelling**
  Argentina moved from trials (1985) to amnesty laws (1986–87) to the overturning of those amnesties (2005).
  *   **Test:** This sequence suggests your three categories are not stable types but *phases* that may succeed one another.
  *   **Result:** The categories collapse into one another over time. What was Prudential in 1987 (stopping military uprisings) became Constitutive in 2005 (the new democracy defining itself by rejecting the old impunity). Argentina shows that the justification for amnesty is not fixed; it is subject to the shifting balance of forces. Your framework treats them as separable justifications, but the Argentine case suggests they are often mutually exclusive over time. You cannot have a Constitutive refounding *and* a Prudential amnesty indefinitely; eventually, the new constitution demands the punishment the Prudential bargain forbade.

  **2. Rwanda (Gacaca): The Communal Constitutive**
  Gacaca courts tried genocide suspects locally. They offered sentence reductions for confessions.
  *   **Test:** Was this Restorative or Constitutive?
  *   **Result:** It blurs the line. It was Restorative in its community focus, but overwhelmingly Constitutive in its aim to rebuild the state's reach into the hills. However, it lacks the Prudential element of the TRC; the RPF had won militarily. There was no "balance of forces" necessitating amnesty.
  *   **Implication:** This suggests your **Prudential** category is the outlier. Restorative and Constitutive justifications can exist without Prudential necessity (as in Rwanda). But Prudential amnesty rarely survives without Constitutive or Restorative clothing (as in South Africa). This indicates the Prudential justification is inherently unstable and must borrow legitimacy from the other two to endure.

  ### IV. What the Episode Does to the Framework

  The South African case complicates your framework, specifically regarding the independence of "truth."

  **The Truth-Bargain Dependency**
  You ask: *Is the truth that amnesty is said to buy ever independent of the bargain that bought it?*
  The TRC episode suggests **no**. The framework treats "truth" as a commodity exchanged (Restorative) or a byproduct of disclosure (Constitutive). However, the TRC produced a specific *kind* of truth: forensic, event-based, and perpetrator-centric.
  *   Because amnesty required a "political objective," perpetrators framed their crimes as political acts, often inflating the political necessity to secure amnesty.
  *   Because the process was legalistic, "truth" became what could be corroborated, not necessarily what was experienced.
  *   **Complication:** The framework assumes truth is the *input* or the *prize*. The TRC shows truth is the *output* of the specific amnesty design. The bargain shapes the truth from the outset. A blanket amnesty (Chile) produces silence; conditional amnesty (SA) produces self-serving narrative; trials (Argentina) produces forensic evidence for conviction. The "truth" is not an independent variable your framework can treat as a stable benefit.

  ### V. Consensus vs. Contestation in Transitional Justice

  It is vital to distinguish where your framework aligns with settled scholarship and where it enters contested terrain.

  **Settled (Broad Empirical Consensus)**
  *   **The Negotiated Nature:** It is settled that the TRC was a product of a negotiated settlement where the incumbent regime retained sufficient power to veto a Nuremberg-style tribunal. (Prudential necessity is widely accepted as the *cause*).
  *   **The Conditionality:** It is settled that the individual, conditional nature of the amnesty was unique and distinguished it from the blanket amnesties of Chile or Uruguay.
  *   **The Reparations Gap:** It is settled that the TRC recommended reparations that the state failed to fully implement, creating a deficit in the "restorative" claim.

  **Contested (Normative and Theoretical Disagreement)**
  *   **The Success of Reconciliation:** There is no consensus that the TRC achieved "reconciliation." Some scholars (e.g., Gibson) argue it fostered political tolerance; others (e.g., Mamdani) argue it obscured structural justice. Your **Restorative** category assumes reconciliation is a measurable output; this is heavily contested.
  *   **The Legality of Amnesty:** While the Constitutional Court upheld the amnesty (*Azapo v President*), international legal scholars remain divided on whether amnesties for crimes against humanity are permissible under customary international law. Your **Constitutive** justification (that the new state can redefine the wrong) clashes with the emerging global norm of a "duty to prosecute."
  *   **The Definition of "Political":** There is contestation over whether the Commission's interpretation of "political objective" was too narrow (excluding structural violence) or appropriately narrow (focusing on acute violations). This affects whether the **Constitutive** refounding is viewed as inclusive or exclusionary.

  ### VI. Adjudication of the Framework

  Your framework holds up well as a heuristic for *intent*, but less well for *effect*.

  1.  **Validity:** The distinction between Prudential, Restorative, and Constitutive is analytically sound and maps onto the major strands of transitional justice literature (Realpolitik, Therapeutic/Restorative, and Legal/Constitutional).
  2.  **Utility:** It successfully exposes the hybrid nature of the TRC. It prevents the analyst from saying "it was just a political deal" or "it was just about healing."
  3.  **Limitation:** It risks reifying "Truth" as a stable good. As the South African case demonstrates, the *type* of truth produced is endogenous to the amnesty mechanism.
  4.  **Refinement:** To make the framework robust, you must acknowledge that these justifications are often mutually undermining. A strongly Prudential amnesty undermines the Constitutive refounding (by appearing to protect the old elite). A strongly Restorative process (focusing on victim pain) can undermine the Prudential goal (by alienating perpetrators). The TRC worked precisely because it kept these tensions in equilibrium, not because it resolved them.

  **Final Verdict:** The framework is a robust tool for deconstructing the *design logic* of transitional mechanisms. However, it must be amended to recognise that "Truth" is not an independent currency in the exchange, but a product manufactured by the specific configuration of these three justifications. The South African case confirms the categories but exposes their interdependence: the Constitutive element was the only thing that prevented the Prudential from becoming mere impunity and the Restorative from becoming mere vengeance.
