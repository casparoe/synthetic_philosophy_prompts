      *   *Requirement 2: Dynamic Consistency vs. Adaptive Deference.* (Addresses endogeneity). If values change because of the AI, does the AI track the change or resist it? Needs a rule for *which* changes count as "improvement" vs. "corruption."
      *   *Requirement 3: The Boundary Problem.* (Addresses "the public"). Who counts? Future people? Non-human animals? The dead?
