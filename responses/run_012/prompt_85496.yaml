  10. **Final Polish:** Ensure the distinction between "serving values" and "serving interests" is clear. (Values = what I think I want; Interests = what is good for me). Ensure "deference" (doing what I say) vs "corrigibility" (letting me change the AI) is clear.

  *(Self-Correction during drafting)*: I need to make sure I don't just list generic AI safety principles. The prompt asks specifically about *whose values*. So the requirements must be about the *source* and *nature* of the normative authority, not just "don't kill people."

  *(Refining the "Liberal Neutrality" point)*: Liberal neutrality doesn't mean the AI has no values. It means the *justification* for its values shouldn't rely on one specific comprehensive doctrine (e.g., Catholicism or Hedonistic Utilitarianism) being true. It must be justifiable to free and equal citizens.

  *(Refining the "Endogeneity" point)*: The friend is right that standard models launder influence. A theory must account for the *direction* of preference change.

