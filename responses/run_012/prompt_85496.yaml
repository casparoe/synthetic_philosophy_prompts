  6.  **Identifying the "Bottleneck" Requirement:**
      *   Which one kills the most theories? **Requirement 2 (Dynamic Consistency/Endogeneity).** Most alignment theories assume static preferences. Acknowledging the feedback loop breaks standard RLHF and Constitutional AI assumptions.

  7.  **Refining the Output (Iterative Polish):**
