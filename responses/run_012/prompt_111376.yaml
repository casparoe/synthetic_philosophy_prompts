answer: |-
  # PREP SHEET: The Two Loops (Pulled vs. Pushed)
  **Context:** 15 min talk + 25 min Q&A.
  **Your Stance:** Peer expert, not clinician. You own the lived experience; they own the clinical framework. Do not defend clinical practice; defend the *observation* of how people interact with labels.

  ---

  ## 1. CONCESSIONS (Give these away early to disarm)
  *Don't fight these. Nod, agree, and move on. It builds trust.*

  *   **"The pain is real regardless of the label."**
      *   *Say:* "Absolutely. The looping effect doesn't create the suffering. It only shapes how the suffering is expressed and managed."
  *   **"Diagnosis saves lives/accesses care."**
      *   *Say:* "I'm not arguing for abolishing diagnosis. Without the code, there is no gateway to the medication or the benefits that keep people housed and fed."
  *   **"Your sample size is small (n=1 group)."**
      *   *Say:* "You're right. This is phenomenological, not statistical. It's a map of my corner of the world, not the whole territory." **[FLAG: THIN]** *Do not claim this applies to psychosis or organic dementia.*

  ---

  ## 2. ANTICIPATED OBJECTIONS & RESPONSES

  ### A. The Consultant Psychiatrists (Medical Model)
  **Their Worry:** You are undermining validity, encouraging malingering, or suggesting symptoms are voluntary performances for gain.
  **Their Phrasing:** "Clinical Utility," "Validity," "Risk," "Biological Reality."

  **Objection 1:** "If you suggest people 'pull' themselves toward a diagnosis for benefits, aren't you inviting malingering and undermining the biological reality of the illness?"
  *   **Damage:** High. Sounds like you're calling patients liars.
  *   **Response (1-2 mins):** "I'm not talking about inventing symptoms. I'm talking about *interpretation*. If I have unexplained panic, and I learn that 'PTSD' explains it and unlocks therapy, I will start to understand my panic *as* PTSD. That's the pull. The biology is real, the category is the handle we use to grab it. If we ignore the 'pull' of the benefits system, we miss why some diagnoses stick and others don't. It's not about faking; it's about which medical bucket fits the key to the door."
  *   **[FLAG: THIN]:** You don't have data on how often this happens vs. biological presentation. Stick to "this happens," not "this is the main cause."

  **Objection 2:** "Doesn't this distinction complicate treatment? If we don't know if they are 'pushed' or 'pulled', how do we prescribe?"
  *   **Damage:** Medium. Questions the utility of your theory.
  *   **Response:** "It should simplify it. If a patient is 'pushed' (hiding symptoms due to stigma), I need to offer safety and confidentiality. If they are 'pulled' (seeking identity/support), I need to ensure the identity doesn't become a cage. Knowing the direction of the loop tells you where the resistance is coming from."

  ### B. The Trainee Psychologists (Formulation/Critical)
  **Their Worry:** You are being reductionist, ignoring power structures, or blaming the individual for adapting to a broken system.
  **Their Phrasing:** "Agency," "Narrative," "Power Dynamics," "Internalised Stigma."

  **Objection 3:** "Isn't this 'Pulled' loop just a survival strategy in a capitalist system? Calling it a 'pull' implies agency where there is mostly coercion."
  *   **Damage:** Medium. They will try to absorb your idea into "Formulation."
  *   **Response:** "That's a fair critique. I use 'pull' to describe the *movement*, not the freedom of choice. But here's where I differ from standard formulation: Formulation often looks at internal history. I'm saying the *external* reward (money, community) actively reshapes the internal experience. It's not just coping; the reward changes the symptom itself. That's the loop."
  *   **[FLAG: THIN]:** You are bordering on sociological theory. Keep it grounded in your peer group examples.

  **Objection 4:** "Doesn't separating them risk judging which patients are 'authentic'?"
  *   **Damage:** High. Accusation of moral judgment.
  *   **Response:** "It shouldn't be about authenticity. It's about trajectory. A 'pulled' patient might deteriorate if the benefits stop. A 'pushed' patient might deteriorate if the label sticks. Both are real, both are at risk. The distinction is for understanding risk, not judging character."

  ### C. The Peer/Carer Group
  **Their Worry:** You are discouraging medication or validating the idea that "it's all in your head."
  **Their Phrasing:** "Medication saves lives," "Real suffering," "Don't confuse people."

  **Objection 5:** "My son needs his diagnosis to get his meds. Are you saying that's a 'pull'?"
  *   **Damage:** High. Emotional confrontation.
  *   **Response:** "No. That's the system requiring a pull. He needs the key to open the door. My point is that once he has the key, the label might start to change how he sees himself, not just how the doctor sees him. We need to watch out for when the label starts doing more work than the medicine."

  ---

  ## 3. THE "DREADED QUESTION"
  **The Question:** "So, if the category changes the person... is the suffering less real for those who are 'pulled'?"
  *   **Why it's dangerous:** It traps you into saying suffering is constructed, which invalidates the room's work.
  *   **The Trap:** Saying "Yes" alienates everyone. Saying "No" undermines your theory.
  *   **The Answer:** "The suffering is 100% real in both cases. The *shape* of the suffering changes. If I break my leg, it hurts. If I'm told 'broken legs heal in 6 weeks', I cope differently than if I'm told 'you'll always limp'. The pain is the same; the future changes. I'm arguing the diagnosis writes the future, not the pain."
  *   **[FLAG: THIN]:** This relies on a metaphor. Be prepared for them to press on "psychological pain vs physical pain."

  ---

  ## 4. STRATEGIC ADVICE FOR THE ROOM

  1.  **Watch the "Benefits" Talk:** When you mention "money" or "disability allowance," the Psychiatrists will stiffen. They hear "fraud." The Trainees will wince; they hear "poverty."
      *   *Fix:* Frame it as "Resource Access." It sounds more clinical.
  2.  **The Trainee/Psychiatrist Fight:** They will likely ignore you and argue with *each other* about your talk.
      *   *Fix:* Let them. You are the neutral witness. "It sounds like Dr. X and Ms. Y have different priorities for the patient. My observation is that the patient feels both."
  3.  **Don't Overclaim Hacking:** You know Hacking, but don't get dragged into philosophy.
      *   *Fix:* "Hacking gave me the word 'looping', but the 'Pulled/Pushed' distinction comes from six years of sitting in a circle with people who are living it."
  4.  **Time Management:** You have 25 mins for Q&A. That is roughly 5 to 7 questions.
      *   *Tactic:* If a question is a lecture (common from Consultants), interrupt politely: "That's a huge topic, but if you had to boil it down to one challenge to my 'two loops' idea, what would it be?"

  ## 5. YOUR "GET OUT OF JAIL FREE" CARD
  If you get stuck or feel out of your depth:
  *   **Say:** "I'm a peer, not a clinician. I'm describing the *effect* of the system on the person, not telling you how to fix the system. If my observation doesn't match your data, that might be because I'm seeing the people after the data has been collected."

  ---
  **Final Check:**
  *   **Thin Spot:** Your theory implies a direction of causality (Label -> Change). Critics will say (Change -> Label).
  *   **Defense:** "It's bidirectional. That's why it's a loop. But the *incentive* (money vs stigma) acts as the gravity that bends the loop one way or the other."
