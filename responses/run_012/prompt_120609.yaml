prompt: |-
  Okay so I've talked myself into a position I'm not totally comfortable with, and I want you to try to knock it down. The view: all else equal, eating beef does less harm than eating chicken — maybe less than a lot of plant-based diets too — because of the field deaths. A chicken is small, so you need alot of them per calorie, and they're raised on grain and soy that get harvested by machines that chew up mice and birds and god knows how many insects. A cow raised on grass that humans can't digest is one animal, over a couple of years, turning inedible cellulose into food. So the advice to eat less meat looks backwards at least as far as beef is concerned, and the common intuition (beef bad, chicken fine) looks exactly inverted once you count deaths per calorie instead of by how cute the animal is.

  What would count against this? I want the actual defeaters, not just the standard line about different capacities for suffering. Specifically: how much of it rests on numbers nobody actually has; does it eat itself once I start counting invertebrates, or nematodes, or whatever the lowest bound turns out to be; what happens when land use and the wild animals displaced by pasture enter the picture, because I suspect the wild-animal-suffering crowd would say grass-fed beef is a catastrophe for exactly that reason, which would be a nice bit of irony; and does it matter that the cow wouldn't have existed if I hadn't bought the beef, whereas the field mouse would have been out there either way? That last one feels like it should matter and I can't tell if it's a real point or a trick.

  Rank them from decisive to merely awkward, tell me which of these someone who actually holds the view would concede rather than dismiss, and be honest about whether the whole thing is just a pile of assumptions that can't be falsified — and if it is, whether that's a problem for a position like this or just the price of doing applied ethics.
