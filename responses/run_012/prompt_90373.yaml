      *   **Constraints:**
          *   Game with rules, roles, mechanical scoring (no money).
          *   Fixed budget for node expansions (decomposition).
          *   Hard cap on answer length (summarization loss is binding).
          *   Top-level task must have checkable answers (mechanical scoring).
