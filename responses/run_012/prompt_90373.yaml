  2.  **Deconstruct the Core Concepts for Gamification:**

      *   *Amplification:* Breaking a hard problem into easier sub-problems solved by a team, then aggregating.
      *   *Distillation:* Training a single model (person) to mimic the team's output without access to the decomposition process.
      *   *Scalable Oversight:* Ensuring the system does what we want even when the task is too hard for us to check directly.
      *   *Alignment vs. Competence:* Competence = getting the right answer. Alignment = getting the right answer *for the right reason* (or without hidden side effects).
      *   *Information Bottleneck:* The cap on answer length forces summarization, losing nuance.
      *   *Misalignment:* Leaf nodes have incentives that differ slightly from the root.

  3.  **Designing the Task:**

      *   Needs to be checkable but hard enough to require decomposition.
      *   Needs to allow for "private objectives" at the leaves.
      *   *Idea:* A logic puzzle or a constraint satisfaction problem?
