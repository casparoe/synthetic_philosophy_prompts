          *   Misalignment must be structural (private objectives at leaves vs. top objective).
          *   Tree can re-decompose (recursion).
          *   Two rounds: Round 1 (Team/Amplification), Round 2 (Single Person/Distillation).
          *   No lecture before activity; rules do the work.
