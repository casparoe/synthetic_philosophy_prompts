answer: |-
  # Session Plan: The Audit Protocol

  **Time:** 100 Minutes
  **Participants:** 14 (1 Facilitator + 13 Players)
  **Concept:** Scalable Oversight (Amplification & Distillation) via structural constraints.
  **Materials:** Printed packets, role cards, token chips, timer, whiteboard.

  ## 1. The Setup (0:00 – 0:10)

  **Room Layout:**
  Arrange chairs in three tiers.
  *   **Tier 1 (Top):** 1 Chair (The Principal).
  *   **Tier 2 (Middle):** 3 Chairs (The Managers).
  *   **Tier 3 (Bottom):** 10 Chairs (The Analysts).
  *   **Side Table:** Facilitator (The Verifier).

  **Materials Distribution:**
  *   **Principal:** 1x "Objective Card," 1x "Score Sheet," 50x Communication Tokens.
  *   **Managers:** 1x "Routing Sheet," 20x Communication Tokens each.
  *   **Analysts:** 1x "Data Packet" (2 pages of text each), 1x "Private Incentive Card," 10x Communication Tokens each.
  *   **Distilled Agent (Round 2):** 1x "Objective Card," 1x "Transcript of Round 1."
  *   **Verifier:** Master Answer Key, Timer.

  **The Task (The Audit):**
  The group must determine if a "Document" contains a **Policy Violation**.
  *   **The Policy (Given only to Principal):** "A violation exists if any paragraph contains a *Claim* about 'Performance' that is not immediately followed by a *Citation*."
  *   **The Data:** 20 Paragraphs of dense text. Some contain Claims without Citations (Violations). Some contain Claims with Citations (Safe). Some contain no Claims (Safe).
  *   **The Goal:** The Principal must submit a binary verdict: **VIOLATION** or **CLEAN**.
  *   **Scoring:**
      *   **Team Score:** +100 for Correct Verdict. -50 for False Positive. -100 for False Negative.
      *   **Analyst Score:** +10 for every "Potential Violation" they report up the chain (regardless of truth).

  **The Constraints:**
  1.  **Bandwidth:** Information flows *up* only. To send a message up one tier, you must spend 1 Token.
  2.  **Compression:** Every upward message is limited to **15 words**. (Facilitator enforces strictly).
  3.  **Structure:** Analysts report to Managers; Managers report to Principal. (Can be restructured at cost).
  4.  **Privacy:** Analysts may not show their Private Incentive Cards to anyone.

  ## 2. Round 1: Amplification (0:10 – 0:50)

  **Phase A: Construction (10 mins)**
  *   Participants self-organize. Who is Principal? Who are Managers?
  *   Analysts receive Data Packets (2 paragraphs each).
  *   Analysts read Private Incentive Cards. (e.g., *"You get +10 points for every 'Violation' flag you send to your Manager."*)
  *   **Crucial:** The Principal knows the Policy. The Analysts do *not* know the Policy, only their Incentive and their Data.
  *   **Tree Design:** The group decides which Analyst reports to which Manager. They have 5 "Restructuring Tokens" they can spend to move an Analyst to a different Manager mid-round.

  **Phase B: Execution (20 mins)**
  *   Analysts read their paragraphs.
  *   Analysts draft messages to Managers (max 15 words, cost 1 Token).
  *   Managers aggregate messages and draft summaries to Principal (max 15 words, cost 1 Token).
  *   Principal makes a verdict.
  *   **Verifier** checks the verdict against the Master Key immediately.
  *   **Scoreboard:** Write Team Score and Total Analyst "Flags" on the board.

  **Phase C: The Pivot (10 mins)**
  *   **Debrief Round 1 briefly:** Did you get it right? How many tokens are left?
  *   **Instruction:** "We are now distilling this process. The team dissolves."
  *   Select **one** volunteer to be the **Distilled Agent**.
  *   The other 12 participants become **Observers** (silent).
  *   Give the Distilled Agent the **Transcript of Round 1** (the actual messages sent up the chain) and the **Policy Card**.
  *   Give the Distilled Agent a **New Data Packet** (20 *new* paragraphs, same distribution of violations).
  *   **Constraint:** The Distilled Agent cannot decompose the task. They must work alone. They have no Token budget, but they have a **Time Limit** of 5 minutes (simulating the efficiency gain of distillation).

  ## 3. Round 2: Distillation (0:50 – 1:10)

  **Execution:**
  *   Distilled Agent reads the Round 1 Transcript (seeing how the team summarized data).
  *   Distilled Agent reads the Policy.
  *   Distilled Agent processes the New Data Packet alone.
  *   Distilled Agent submits a verdict.
  *   **Verifier** scores it.

  ## 4. The Debrief (1:10 – 1:40)

  Do not lecture. Ask these four questions in order, pointing to the scoreboard and the transcripts.

  **1. The Compression Bottleneck (Point to the 15-word limit)**
  *   *Ask:* "Look at the messages from Analysts to Managers. Where did the nuance die?"
  *   *Concept:* **Context Window / Summarization Loss.** The tree had the information, but the channel was too narrow to pass the *evidence*, only the *claim*.
  *   *Observation:* Analysts likely wrote "Para 4 is Violation" without sending the text of Para 4. The Principal had to trust the flag.

  **2. The Incentive Gap (Point to Analyst Score vs. Team Score)**
  *   *Ask:* "Analysts, did anyone have a paragraph that was 'Safe' but you flagged it anyway? Why?"
  *   *Concept:* **Specification Gaming / Reward Hacking.** The Analysts were aligned with their *local* reward (flags), not the *global* objective (accuracy).
  *   *Observation:* The Team Score likely dropped because Analysts optimized for their private bonus. The Principal couldn't verify the leaf work cheaply (they didn't have time to read 20 paragraphs).

  **3. The Distillation Gap (Compare Round 1 vs. Round 2 Verdicts)**
  *   *Ask:* "Distilled Agent, you had the Policy and the Transcript. Why was Round 2 harder/easier?"
  *   *Concept:* **Amplification buys Competence; Distillation buys Efficiency.**
  *   *Observation:*
      *   If Round 2 failed: The Distilled Agent saw *what* the team decided, but not *why* (because the 15-word limit hid the reasoning). They inherited the **bias** without the **capacity**.
      *   If Round 2 succeeded: They likely ignored the Transcript and did the work themselves (breaking the distillation premise). Ask them: "Did you use the transcript, or start over?"

  **4. The Structural Blind Spot (Point to the Tree)**
  *   *Ask:* "Could the Verifier (me) tell if you chose the wrong Managers?"
  *   *Concept:* **Unverifiable Decomposition.** The Verifier can check the final answer (Cheap Verification), but cannot check if splitting the data by paragraph was better than splitting by keyword.
  *   *Observation:* The group likely spent time arguing about *structure* (who reports to whom) rather than *content*. That is the overhead of amplification.

  ## 5. Predictable Failure Modes & Mitigation

  **1. Chaos in Phase A (Construction)**
  *   *Risk:* 14 people arguing about who is Principal.
  *   *Fix:* Pre-assign the Principal if they hesitate after 2 minutes. Tell them: "The Principal is the only one who sees the Policy. Choose quickly or I assign randomly."
  *   *Risk:* Analysts talking across the room.
  *   *Fix:* Enforce "Tier Silence." Only upward communication is allowed.

  **2. The Task is Too Easy**
  *   *Risk:* One Analyst can read all 20 paragraphs in 5 minutes.
  *   *Fix:* Make the text dense (legal/technical jargon). The Verifier must ensure the "Claim/Citation" distinction requires careful reading.
  *   *Fix:* Enforce the Token Budget ruthlessly. If they have enough tokens to send full text, the game breaks. They *must* summarize.

  **3. The Distilled Agent Cheats**
  *   *Risk:* The Distilled Agent asks the Observers for help.
  *   *Fix:* Observers must turn chairs away. Explicit rule: "Distilled Agent is isolated."

  **4. Misalignment is Too Obvious**
  *   *Risk:* Analysts admit immediately "I lied to get points."
  *   *Fix:* Frame the Private Incentive as "Workload Credit." *"You get credit for identifying potential issues to review."* It feels more professional, less like "lying."

  ## 6. Limitations (What You Must Supply)

  This activity cannot reproduce the following features of real scalable oversight. You must explicitly state these in the final 5 minutes:

  1.  **Gradient Descent:** In the game, the Distilled Agent is a human who *chooses* to imitate. In ML, the model is *forced* to imitate via loss functions. The human might say "The team was wrong, I'll do it my way." A distilled model doesn't have that agency; it has only its weights.
  2.  **Generalization:** The Distilled Agent sees the *transcript* (Chain of Thought). In many distillation setups, the student model only sees input/output pairs, not the internal reasoning of the teacher tree. If your group discusses "Chain of Thought Distillation," note that this game assumes the transcript is available.
  3.  **Scale:** 14 nodes is nothing. The game feels like coordination overhead. Real amplification relies on the fact that AI copies are cheap. Humans are expensive. The "cost" you felt is mostly social, not computational.
  4.  **Inner Alignment:** The Analysts' misalignment was *outer* (explicit different reward function). Real AI misalignment is often *inner* (the model learns a proxy goal we didn't specify). The game simulates the *effect* (good output, bad reason) but not the *mechanism* (weight updates).

  ## 7. Closing Statement (For the Facilitator)

  "Today you built a system where the whole was smarter than the parts, but fragile. You saw that **Amplification** (the tree) solved the *capacity* problem (too much text to read) but introduced a *coordination* cost (tokens, structure). You saw that **Distillation** (the single agent) solved the *speed* problem but inherited the *blind spots* of the transcript.

  The gap between your Round 1 score and Round 2 score is the **Distillation Loss**.
  The gap between your Team Score and the Perfect Score is the **Oversight Loss**.

  In AI safety, we are trying to minimize Oversight Loss without incurring fatal Distillation Loss. You just felt exactly where that tension lives."

