      *   **Context:** Dollar Auction (Shubik, 1971). Key feature: Second-highest bidder pays their bid but gets nothing.
      *   **Part (a): Why price > £1?**
          *   *Ideal:* Focus on marginal analysis. Once bids approach £1 (e.g., 90p vs £1), the 90p bidder faces a loss of 90p if they quit. Bidding £1.10 means paying £1.10 to get £1 (loss of 10p). Loss of 10p is better than loss of 90p. This logic continues indefinitely (or until budgets run out). It's about minimizing loss, not maximizing profit at that stage.
          *   *Key Concept:* Escalation of commitment due to the specific payoff structure (both pay), not just "wanting to win."
      *   **Part (b): Is "sunk cost fallacy" the right diagnosis?**
          *   *Ideal:* This is tricky. In standard game theory, sunk costs *should* be ignored. However, the Dollar Auction structure makes the *past bid* a relevant factor in the *current* decision because the rules say the second-highest bidder *must pay*. Therefore, the money already bid is *not* sunk in the accounting sense until the auction ends. It's a contingent liability.
          *   *Nuance:* Calling it the "sunk cost fallacy" is technically incorrect from a strict game-theoretic perspective. The past bid determines the current loss if you quit. It's rational (in the narrow sense of loss minimization) to continue. The "fallacy" implies irrationality. The game theoretic lesson is usually about the *structure* creating a prisoners' dilemma-like escalation, or that rational individual moves lead to collectively irrational outcomes.
          *   *Verdict:* The student's answer ("basically right... throw good money after bad") is a common misconception. In the Dollar Auction, the money isn't sunk *yet*. It becomes sunk only if you quit. If you bid more, you might recover it. A strict game theorist would say: "No, because the past bid affects the current payoff matrix. It's not sunk until the game ends. The lesson is about equilibrium paths and commitment."
          *   *Correction:* The "sunk cost fallacy" suggests irrational emotional attachment. Game theory shows this happens even with perfectly rational agents due to the payoff structure.
      *   **Part (c): Does promising a £1 ceiling fix it?**
          *   *Ideal:* No. This is a time-inconsistency / credibility problem. Once the bidding reaches 90p vs £1, the promise to stop at £1 is no longer credible. The bidder at 90p will bid £1.10 to save their 90p. The pre-commitment is not binding unless there's an external enforcement mechanism.
          *   *Key Concept:* Credible commitment / Subgame perfection. A cheap talk promise isn't enough.
          *   *Verdict:* The student says "Yes." This is incorrect.

  3.  **Evaluate the Student's Script:**
      *   **Part (a):** "Once you're the second-highest bidder, dropping out means you pay your bid and get nothing, so it always looks better to raise by 10p and keep a chance of winning the coin."
