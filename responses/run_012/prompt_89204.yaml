          *   *Grade:* Misunderstanding.
      *   **Part (c):** "Yes -- if you commit in advance to a £1 ceiling you'll walk away... Really the only fully safe move is not to enter the auction at all."
          *   *Assessment:* Contradictory. They say "Yes, £1 ceiling fixes it" but then say "only safe move is not to enter." Also, the £1 ceiling isn't credible. If I'm at 90p, my promise to stop at £1 is broken by the incentive to bid £1.10.
