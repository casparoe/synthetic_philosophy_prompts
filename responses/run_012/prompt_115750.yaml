answer: |-
  Dear colleague,

  I have reviewed your outline for the seminar session on collective agency and it is a robust design that should generate the precise friction you are looking for, provided you manage the transitions and the inevitable resistance from the students carefully. The following is a detailed plan for running the ninety minutes, written as a continuous narrative so you can see the flow of the room from setup to conclusion, including an honest assessment of where the mechanics might fail and how to rescue the philosophical payload when they do.

  You will need four tables arranged in a square or cluster so that four students can sit around each one, leaving one table empty or used for your materials. You will need a large stack of identical index cards for the task, pens for scoring, and two sets of instruction cards. The first set is for phase one and simply says Crew Member on one side. The second set is for phase two and consists of sealed envelopes or face-down cards distributed privately. For every crew of four, three of these cards should read You score three points if the crew succeeds and zero if the crew fails. The fourth card in each envelope must read You score four points if your card is the first to land face down in any attempt, regardless of crew success, and you score two points if the crew succeeds without your card being first. You will also need a scoreboard on the whiteboard to track crew totals publicly.

  Begin the session by dividing the fourteen students into three crews of four and one crew of two, or better, join one crew yourself to make four crews of four, though if you prefer to remain neutral you can have one crew of two act as roving observers for the first phase only before merging them. For the sake of symmetry, I recommend you participate as a member of one crew so that you feel the tension yourself, leaving thirteen students to form three crews of four and one odd student who acts as a global timekeeper and scorekeeper. Give each crew ten minutes to arrange their seating and get comfortable. Tell them they are going to engage in a series of coordination tasks where points are awarded based on performance. Do not mention agency, intention, or collective action yet.

  Phase one lasts twenty minutes. Explain that each crew must perform one small physical act that no member can perform alone. The act is defined as all four members putting an index card face down on the table inside the same one-second window. Assign an observer from another crew to watch each table. The observer judges whether the cards landed within the one-second window. There is to be no talking during an attempt. There are sixty seconds of talk allowed between attempts. A success is worth three points to each member of the crew. Tell them they have ten minutes to get as many successes as possible. They will solve this quickly, likely within the first three minutes, by adopting a counting strategy where one person counts aloud and everyone moves on three. This is the point you want them to feel, which is how natural it is to say we about what they are doing. They will notice that the plan they built is made of four separate intentions that happen to mesh. When the ten minutes are up, tally the points on the board and praise their efficiency.

  Phase two lasts twenty-five minutes. Tell them the task is identical, but you are changing the scoring structure to reflect individual contributions. Hand out the private cards face down and instruct them not to show their cards to anyone else. Tell them they have ten minutes to maximize their own points. Do not say anything about rules regarding communication or strategy. You want them to assume the previous norms hold unless stated otherwise. In most runs, the crew will succeed a few times, but the holder of the special card will eventually realize that waiting for the count yields only two points while jumping early yields four. When they defect, the window will be missed, and the crew will fail. You want the crew to fail at least once this way and then have to say what, if anything, the early mover did wrong. My prediction is that they will not be able to name a rule that was broken, and that they will still want to say something was owed. This is the moment you are buying, and you must let the silence hang after the first failure. If they argue, let them argue. If they succeed without defection, encourage them to run more attempts until the incentive structure bites. If nobody defects because the room is too polite, you must intervene by asking the group with the highest score to explain their strategy, which will often prompt the special card holder in another group to realize they are leaving points on the table.

  Phase three lasts twenty minutes. Before the phase begins, require each crew to say aloud, in front of the others, one sentence of the form We will land four cards inside the window in the next round. Insist on the definite verb will rather than we will try. Write this requirement on the board so there is no ambiguity. Immediately after they make this declaration, announce a release. Tell them that from now on any individual may declare I am out, which keeps their own points accumulated so far, freezes the crew's total, and ends that crew's participation in the task. You want to see whether crews treat the declaration as binding on individuals. You want to see if a member can release only themselves or needs the others' consent. You want the disagreement to be genuine rather than staged. If a student says I am out, watch the faces of the others. Do they look betrayed? Do they say you cannot do that? If they say nothing, ask the remaining members if they think the defector violated the statement they made together. This inability to answer the question without inventing a normative structure is the phenomenon you are after.

  The debrief takes the remaining twenty-five minutes. Do not start by giving them the theory. Start by asking them to describe the feeling in phase two when the card was played early. Ask if a rule was broken. If they say no, ask why they feel annoyed. If they say yes, ask them to write the rule down. They will struggle to write a rule that was not explicitly stated in your instructions. This maps onto the position that a shared plan is just several intentions with meshing subplans plus common knowledge, each revisable with notice. If they claim the defector wronged them, you introduce the idea that saying we will creates an obligation that neither party can unilaterally cancel and gives the others standing to demand, not merely a prediction to rely on. This distinguishes the reductive view from the view that collective intention creates a new normative reality. Finally, ask them about phase three. If they felt bound by the public utterance, you suggest that the we might not be built out of individual intentions at all, but is a primitive state that distributes authority. Name the standard positions only if you are confident of the attributions, such as Bratman for the reductive view and Gilbert for the obligation view, but nothing in the activity or the debrief should depend on a name or a title before this moment. They should not hear any of these terms before the debrief.

  Now I must tell you specifically and without softening it what will predictably go wrong, because if you are not prepared for these failures the session will feel like a game rather than a philosophical investigation. The first failure is that crews will solve the task in phase one so smoothly that phase two feels like a puzzle rather than a betrayal. They will treat the special card as a logic problem to be optimized rather than a normative breach. To counter this, you must emphasize in the phase two instructions that they are working with the same partners they just built trust with in phase one. Remind them of the counting strategy they agreed on. When the defection happens, ask the group if the defector broke an agreement. If they say there was no agreement, ask them why they counted in phase one. This forces them to acknowledge the implicit contract.

  The second failure is that nobody defects because the room is polite. Upper-level philosophy students are often conflict-averse in seminar settings. If ten minutes pass and the special card holders are cooperating, you must break the silence by asking the class if anyone is unsure about their maximizing strategy. Often one student will admit they are sacrificing points for the group. Use this admission to ask the group if they expect that sacrifice. If they say yes, ask the sacrificer if they feel constrained. This brings the normative pressure to the surface even without the defection.

  The third failure is the student who announces that the rational move is obvious and turns the whole thing into a lecture on free riding. This student will say that the special card holder was simply maximizing utility and the others are suffering from sour grapes. Do not let this student dominate the debrief. Acknowledge the point by saying that on the reductive view, this is correct, but then ask the rest of the class if that explanation captures their experience of being let down. Keep the focus on the phenomenology of the expectation, not the rationality of the action. You are investigating the structure of agency, not the ethics of selfishness.

  The fourth failure is that crews will argue about what the special card said rather than about what they owe each other. They will scrutinize the text to see if jumping early was technically permitted. To stop this, remind them that you said nothing about rules in phase two. If it was permitted, why does it feel like a violation? Push them away from the text of the card and toward the text of their interaction. The philosophical payload is in the gap between what was allowed and what was expected.

  Finally, I must say which feature of the idea the activity cannot reproduce and that you will have to supply yourself in the debrief. The activity is gamified and relies on points, which means the obligations generated are hypothetical and instrumental. In real collective agency, the commitment to a shared goal often carries moral weight or identity constitutive force that transcends point maximization. The students will feel a mild irritation at being let down, but they will not feel the deep normative binding of a joint commitment in a moral context, such as promising to meet a friend or participating in a protest. You will have to supply this weight in the debrief by asking them to imagine the same scenario where the task is not landing cards for points but carrying a heavy table together or singing a duet. You must bridge the gap between the artificial incentives of the seminar game and the genuine normative forces of shared life, because the activity can simulate the structure of the problem but not the stakes that make the problem matter.

  I hope this plan serves your seminar well. It is a delicate thing to make students feel a philosophical problem in their bones before they have the words for it, but if you can sustain the tension through the failures I have described, the debrief will land with much greater force.

  Best wishes for the session.
