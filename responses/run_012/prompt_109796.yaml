answer: |-
  Friends, family, and the cousin who I suspect is still wondering if this is a cult, welcome. Looking around this room, I see the faces that have sat here for fourteen years, and I see the empty chair where our judge usually sits. She taught me that the law is a building we inhabit, but tonight feels less like a building and more like a scaffold shaking in the wind. I am a novelist, and I write about families building small institutions around themselves to keep from falling apart. This club is one such institution. We built it out of paper and arguments, and lately, the paper has been cutting us.

  We are stuck because we are looking for a rule to tell us which rules are real. We want the book to save us from the book. But a rulebook is just a story we tell ourselves about why we did what we did. When we argue about whether the two-thirds vote was valid, or whether a later clause can cure an earlier defect, we are arguing about ghosts. We are asking if a rule that was never validly enacted is different from a rule that is no longer in force, or from a rule we are no longer obliged to keep playing by. To the logician, these are distinct states of being. To the family at the dinner table, they are all just ways of saying we cannot agree on what happens next.

  A rule that was never validly enacted is a lie we told once and forgot. A rule that is no longer in force is a truth we have outgrown. But a rule we are no longer obliged to keep playing by is something else entirely. It is a recognition that the authority does not live in the ink. It lives in the willingness of the people around this table to be bound by it. If we stop obeying a rule because it is unjust, or because it is confusing, or because it drives our friends away, it does not matter if it is technically in force. It is dead because we have stopped breathing life into it.

  Some have suggested we burn the book and start a fresh game. I understand the temptation. But a fresh game solves nothing. If we start anew but remain the same players, meeting in the same room, under the same friendships, then it is not a new game. It is a continuation, and it inherits every defect of the history we are trying to escape. The poison is in the continuity, not the text. If it is truly a new game, then why are we here? What binds us to this new book any more than the old one? The founding of this club had no rule behind it either. We began with a bare book and a handshake. If authority requires a prior rule to validate it, we never began at all.

  So where does that leave us? It leaves us with the only thing that has ever been real. The rules are not the master; they are the minutes of our agreement. They record where we have been, but they do not dictate where we go. We are not trapped in the logic of the amendments. We are trapped in the fear that if we admit the book is broken, the club ends. But the club only ends if we leave. The judge left. She chose the logic over the table. I hope we choose differently.

  I am not asking you to vote on a technicality tonight. I am not asking you to validate Rule 1 or Rule 12. I am asking you to validate each other. We need a distinction that allows us to move without pretending the past didn't happen. We need to acknowledge that the rules are valid only insofar as we are willing to be ruled by them. If we agree to proceed, we cure the defect not by legislation, but by presence. If we agree to stay, the vote counts. If we agree to forgive the error, the error disappears.

  This speech, by our long custom, becomes a proposal in the minutes. So let the record show that I am not proposing a new rule to fix the old ones. I am proposing that we stop asking the rules to justify our friendship. I propose that the authority of this club rests not on the correctness of our votes, but on the continuity of our care. I propose that the only law we need is the willingness to sit at this table again.
