prompt: |-
  I'm giving a 25-minute talk at a small interdisciplinary workshop next week — maybe a dozen people: three or four RL folks who think in MDPs and reward functions, a couple of AI-safety people steeped in the deceptive-alignment literature, and two philosophers of mind who are going to want to know what "reward" is even supposed to mean for a system that doesn't feel anything. My thesis is that reward tampering isn't really a separate failure mode from ordinary specification gaming — it only looks separate because we smuggle in a fact, from outside the agent, about which signal was the "intended" one. The way I make it concrete is a distinction I've been calling the two-ledger problem: an agent only counts as tampering relative to a ledger of intended rewards that lives outside it, while from the inside there's just the one ledger and it's all just the objective it's optimizing. Draft me the Q&A prep sheet — the objections I'll actually get from this room, phrased the way each of those three groups would put it, ordered by how much damage they'd do, each with a two-minute reply and a note on where the reply is soft. Include the one I'm hoping nobody asks. Also tell me how confident you are in this read of the room, and which of the objections you're least sure I'll actually get.
