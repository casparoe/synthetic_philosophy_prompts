  6.  **Refining the Comments (Mental Check):**
      *   *Gentzen:* Need to be clear. Gentzen used $\epsilon_0$ induction. Hilbert wanted finitistic (primitive recursive). This is the standard interpretation.
      *   *G1/Inconsistency:* If inconsistent, everything is provable. So "contradiction lying among sentences arithmetic cannot prove" is nonsensical. If it's inconsistent, there are no unprovable sentences.
