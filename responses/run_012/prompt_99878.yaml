      *   **Stance 2 (Skeptic):** Instrumentalism/Fictionalism. It's useful but false. Fails when a non-belief description (mechanistic/prompt-based) predicts just as well.
      *   **Specific Case:** A model that reverses moral advice based on a single word change in the prompt, then confabulates a reason for the change with high fluency/confidence.
      *   **Requirements:**
          *   Argue over the *shared case*, not generalities.
          *   Defender must specify what was believed before/after and what turns on the difference.
          *   Skeptic must ask what in the machine answers to the belief and what the attribution predicts beyond prompt-sensitivity.
          *   Concede small points without surrendering.
          *   Answer the other's strongest move.
          *   Close by stating exactly what they still disagree about.
      *   **Tone:** Intellectual, rigorous, respectful, nuanced (fitting a retired physicist reading philosophy).

  2.  **Character Conception:**
      *   **Elias (Defender):** Pragmatist, Dennett-leaning. Focuses on the *pattern* of behavior and the utility of the vocabulary. Sees stability in the *function*, not necessarily the substrate.
      *   **Mara (Skeptic):** Mechanist, perhaps leaning towards Churchland or a strict functionalist who requires state stability. Focuses on the *causal architecture* and the lack of internal commitment.

  3.  **Drafting - Section by Section:**

