      *   **Closing:** Define the residual disagreement. Is it about the *nature* of belief (ontology) or the *utility* of the label (pragmatics)?

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "single word" constraint? Yes, need to make sure the example is specific.
