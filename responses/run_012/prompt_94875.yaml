prompt: |-
  I sit on the commission that runs local elections in my city, and we keep having to draw the line on who counts as one of us for voting purposes. Our record so far: non-citizen residents who've been here five years or more — yes, they vote; citizens who moved abroad and kept no property or family here — no vote; adults under full guardianship for a cognitive disability — yes, they vote; people who own a second home here and pay our property tax but live somewhere else — no vote; 16- and 17-year-olds — yes, in municipal elections. I couldnt tell you what rule we've actually been running, and honestly I'm not sure there is one.

  Now we've got a referendum coming on a flood-defence scheme, and the town across the river — same country, different municipality — is going to get hit by it: our reservoir changes their water levels and their insurance premiums, and the way the scheme is drafted our water utility would bill their households a small annual levy for the works. They're not on our electoral roll, our bylaws dont bind them, and their own council pays for their own mitigation. Should they get to vote in our referendum? Tell me what we should do to stay consistent with ourselves, what the candidate principles are and what each one predicts here, which of our past calls is the closest analog, and if the record really doesn't settle it, what we'd be buying with each choice — plus what further case would best show which principle we're really running.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Member of a local election commission.
      *   **Context:** They are struggling with defining the franchise (who gets to vote) for a specific upcoming referendum (flood-defence scheme).
      *   **Current Precedents (The "Record"):**
          1.  Non-citizen residents (5+ years) = **Yes**.
          2.  Citizens abroad (no property/family) = **No**.
          3.  Adults under full guardianship (cognitive disability) = **Yes**.
          4.  Second-home owners (pay tax, live elsewhere) = **No**.
          5.  16- & 17-year-olds = **Yes** (municipal).
      *   **The New Case:** Residents of a neighboring town (different municipality, same country).
          *   Impact: Significant (water levels, insurance premiums).
          *   Cost: Small annual levy billed to their households.
          *   Legal Status: Not on electoral roll, bylaws don't bind them, their council pays for their own mitigation.
      *   **The Task:**
          1.  Determine what to do to stay *consistent* with past decisions.
          2.  Identify candidate principles underlying the past decisions.
          3.  Predict the outcome for the new case based on each principle.
          4.  Identify the closest analog from the past record.
          5.  Analyze the trade-offs ("what we'd be buying") if the record doesn't settle it.
          6.  Propose a "further case" (test case) to reveal the true operating principle.

  2.  **Deconstruct the Past Record (Pattern Recognition):**
      *   *Non-citizen residents (5+ years) = Yes.* Principle: **Residency/Stakeholder**. Physical presence and long-term integration matter more than formal citizenship.
      *   *Citizens abroad (no ties) = No.* Principle: **Residency/Connection**. Formal citizenship isn't enough; you need a current, tangible link to the community.
      *   *Guardianship = Yes.* Principle: **Inclusion/Personhood**. Capacity to understand isn't a barrier; rights are inherent to presence/personhood, not competence.
      *   *Second-home owners (taxpaying, non-resident) = No.* Principle: **Residency over Property**. Paying taxes isn't enough; you need to *live* there and experience daily governance.
      *   *16-17 year olds = Yes.* Principle: **Affected Interest/Age Flexibility**. If you live there and are affected, age is less relevant than residency/impact.

      *   *Synthesis:* The dominant theme is **Residency + Affected Interest**. Formal status (citizenship, age, competence, property ownership) is secondary to *living there* and *being subject to the daily consequences of local governance*.

  3.  **Analyze the New Case (The Neighbors):**
      *   *Status:* Non-residents (live across the river, different municipality).
      *   *Impact:* High (flood risk, insurance).
      *   *Cost:* Yes (levy).
      *   *Governance:* Not bound by bylaws, separate council.

  4.  **Evaluate Candidate Principles:**

      *   **Principle A: Strict Residency (The "Community of Fate" Model).**
          *   *Definition:* Only those who dwell within the municipal boundaries vote.
          *   *Past Support:* Citizens abroad (No), Second-home owners (No).
          *   *Prediction for Neighbors:* **No Vote**. They don't live here.
          *   *Consistency:* High. Matches the exclusion of second-home owners and expats.

      *   **Principle B: Affected Interest / "All Subjected" (The "Stakeholder" Model).**
          *   *Definition:* Anyone significantly affected by the decision or paying for it should vote.
          *   *Past Support:* Non-citizens (Yes - affected by local laws), 16-17s (Yes - affected by schools/environment).
          *   *Prediction for Neighbors:* **Yes Vote**. They pay a levy and face flood risk.
          *   *Consistency:* Mixed. Matches the inclusion of non-citizens/minors, but conflicts with the exclusion of second-home owners (who pay tax and are affected by property value changes).

      *   **Principle C: Political Membership / Legal Subjection.**
          *   *Definition:* Only those bound by the council's general bylaws and subject to its full authority.
          *   *Past Support:* Second-home owners (No - not subject to daily bylaws), Citizens abroad (No).
          *   *Prediction for Neighbors:* **No Vote**. The prompt says "our bylaws dont bind them."
          *   *Consistency:* High. Matches second-home owners and expats.

  5.  **Identify the Closest Analog:**
      *   *Second-home owners:* They pay taxes/levies, don't live there, don't vote.
      *   *Neighbors:* They pay levies, don't live there, don't vote?
      *   *Difference:* Second-home owners choose to invest; neighbors are involuntarily impacted by externalities (floods).
      *   *Non-citizen residents:* They live there, pay taxes, vote. Neighbors don't live there.
      *   *Winner:* **Second-home owners** is the strongest structural analog (financial contribution + non-residency), but the *nature* of the impact (flood risk vs. property investment) adds nuance. However, strictly speaking, **Second-home owners** is the closest precedent for "paying money but not residing."

  6.  **Analyze Trade-offs ("What we'd be buying"):**
      *   *If we say Yes (Include Neighbors):*
          *   *Buy:* Moral legitimacy, cross-border cooperation, acknowledging real-world impact.
          *   *Cost:* Dilution of local voter power, slippery slope (who else is affected? downstream cities?), administrative nightmare (verifying eligibility).
      *   *If we say No (Exclude Neighbors):*
          *   *Buy:* Clear boundaries, administrative simplicity, protection of local self-determination.
          *   *Cost:* "Taxation without representation" accusation, potential legal challenges, inter-municipal conflict, ethical blind spot regarding externalities.

  7.  **Design a "Test Case" (Further Case):**
      *   Need a scenario that splits the principles.
      *   *Idea:* Commuters? People who work here but live elsewhere?
      *   *Idea:* University students living in dorms but registered elsewhere?
      *   *Better Idea:* **A business owner.** Someone who owns a commercial property, pays significant tax, employs locals, but lives in the neighboring town.
      *   *Why:* If they vote, we are prioritizing *Economic Stake*. If they don't, we are prioritizing *Residential Presence*. This clarifies if the "Second-home owner" exclusion was about *residence* or *type of property*.
      *   *Alternative Test Case:* **A downstream resident who pays NO levy but faces flood risk.** This splits "Affected Interest" from "Financial Contribution."

  8.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, advisory (like a policy brief).
      *   *Structure:*
          1.  Executive Summary (The core tension).
          2.  Decoding the Record (The Principles).
          3.  Application to the New Case.
          4.  The Closest Analog.
          5.  The Trade-offs (Buying Consistency vs. Justice).
          6.  The Test Case.

      *(Self-Correction during drafting)*: I need to be careful not to tell them *what* to do legally, but rather help them reason through their own internal logic. The prompt asks "Tell me what we should do to stay consistent with ourselves." This implies deriving the answer from *their* precedents, not external law.

      *Refining the Principles:*
      1.  **Residency/Presence:** (Excludes expats, second-home owners).
      2.  **Affected Interest:** (Includes non-citizens, minors, guardianship).
      3.  **Legal Subjection:** (Excludes second-home owners, expats).

      *The Conflict:* The Neighbors are *Affected* (like non-citizens/minors) but not *Residents* (like second-home owners/expats).
      *The Twist:* The Neighbors are being *charged* (like second-home owners) but involuntarily (unlike second-home owners).

      *Decision:* The record leans heavily toward **Residency + Legal Subjection**. The inclusion of non-citizens and minors is because they *reside* there. The exclusion of second-home owners is key: they pay tax but don't vote. The neighbors pay a levy but don't reside. Consistency suggests **No**.

      *Wait, let's look closer at the Guardianship case.* That suggests capacity isn't required.
      *Let's look at the Non-citizen case.* That suggests citizenship isn't required.
      *So, what IS required?* **Residency.** Every "Yes" vote involves living there. Every "No" vote involves *not* living there.
      *Hypothesis:* The hidden rule is **Ordinary Residence**.
      *If so, Neighbors = No.*

      *But is there a principle of "No Taxation Without Representation"?* The second-home owners pay property tax and get No. So the commission has already rejected "Taxation = Voting."
      *Therefore, the Levy shouldn't trigger voting rights either.*

      *Okay, the logic holds.* The consistent decision based *strictly* on their record is **No**. But the ethical tension is high.

      *Test Case:* Needs to challenge the "Residency" vs "Impact" distinction. A commuter who spends 10 hours a day here but sleeps across the river.

  9.  **Final Polish:** Ensure all parts of the prompt are answered explicitly.
      *   What to do to stay consistent? (Exclude them).
