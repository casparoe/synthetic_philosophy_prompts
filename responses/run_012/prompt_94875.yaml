answer: |-
  This is a classic boundary problem in democratic theory: defining the *demos*. Your commission's record is surprisingly rich, but it contains a tension between **residency** and **affected interest**. To advise you on consistency, I have analyzed your five precedents to extract the operating principles, applied them to the new case, and identified the trade-offs.

  ### 1. The Candidate Principles
  Based on your record, three competing principles are vying for dominance. Here is how they interpret your past decisions and what they predict for the neighbors across the river.

  **Principle A: Ordinary Residence (The "Community of Daily Life" Model)**
  *   **Definition:** Voting rights belong to those who physically dwell within the jurisdiction and participate in the daily social fabric, regardless of legal status.
  *   **Fits Past Record:**
      *   *Non-citizens (Yes):* They live here.
      *   *Citizens abroad (No):* They don't live here.
      *   *Second-home owners (No):* They don't live here.
      *   *16–17-year-olds (Yes):* They live here.
      *   *Guardianship (Yes):* They live here.
  *   **Prediction for Neighbors:** **NO VOTE.** They reside in a different municipality.
  *   **Consistency Score:** High. This is the only principle that perfectly explains every single past decision without exception.

  **Principle B: Affected Interest (The "All-Subjected" Model)**
  *   **Definition:** Voting rights belong to anyone whose vital interests are significantly altered by the decision, regardless of where they sleep.
  *   **Fits Past Record:**
      *   *Non-citizens/Minors (Yes):* Their daily lives are governed by local rules.
      *   *Guardianship (Yes):* They are subject to care outcomes.
      *   *Citizens abroad (No):* No longer affected by local services.
      *   *Second-home owners (No):* **Tension.** Their property values and tax liabilities are affected, yet they were excluded.
  *   **Prediction for Neighbors:** **YES VOTE.** Their flood risk and insurance premiums are directly altered.
  *   **Consistency Score:** Medium. It requires you to argue that second-home owners' financial interests were less "vital" than the neighbors' safety interests.

  **Principle C: Legal Subjection (The "Bound by Bylaws" Model)**
  *   **Definition:** Voting rights belong to those fully subject to the council's general regulatory authority and coercive power.
  *   **Fits Past Record:**
      *   *Second-home owners (No):* Not subject to local zoning/living bylaws.
      *   *Citizens abroad (No):* Not subject to local enforcement.
      *   *Non-citizens/Minors (Yes):* Fully subject to local laws while present.
  *   **Prediction for Neighbors:** **NO VOTE.** You stated their bylaws don't bind them and their own council handles mitigation.
  *   **Consistency Score:** High. Matches the exclusion of second-home owners and expats.

  ### 2. The Closest Analog
  The strongest precedent in your record is the **Second-Home Owner**.

  *   **Similarities:** Like the neighbors, second-home owners have a financial footprint (property tax vs. utility levy), do not reside in the municipality, and are not on the electoral roll. In both cases, the commission decided that financial contribution alone does not purchase franchise.
  *   **Differences:** Second-home ownership is voluntary; the flood levy is involuntary. Second-home owners benefit from asset appreciation; neighbors face risk mitigation.
  *   **Why it matters:** If you grant the neighbors a vote, you break the precedent set with second-home owners. You would be establishing that *involuntary financial burden* grants voting rights, whereas *voluntary property investment* does not. That is a distinguishable but difficult line to hold in future cases.

  ### 3. What to Do to Stay Consistent
  To remain strictly consistent with your own record, **you should not grant them the vote.**

  Your record establishes a bright line: **Physical Residency is the necessary condition.**
  *   You gave the vote to people without citizenship (non-citizens).
  *   You gave the vote to people without full capacity (guardianship).
  *   You gave the vote to people without full age (16-year-olds).
  *   But you **denied** the vote to people without **residency** (expats, second-home owners).

  Since the neighbors are non-residents, granting them the vote would contradict the logic used to exclude second-home owners and expats.

  ### 4. What You Are Buying (The Trade-Offs)
  If the record doesn't settle it to your satisfaction, you need to know the cost of each choice.

  **If you exclude them (Consistency):**
  *   **You buy:** Administrative clarity and boundary integrity. You preserve the municipality as a unit of *residence*, not a unit of *impact*. This prevents a slippery slope where downstream cities, commuting workers, or regional businesses demand a say in your local affairs.
  *   **You sell:** Moral legitimacy regarding externalities. You accept the charge of "taxation without representation" regarding the levy. You risk inter-municipal conflict if the scheme harms them, as they had no say in the risk imposition.

  **If you include them (Justice/Impact):**
  *   **You buy:** Ethical alignment with the "no taxation without representation" principle. You acknowledge the physical reality that water doesn't respect municipal borders. You reduce the risk of legal challenges based on human rights or fairness.
  *   **You sell:** The residency principle. If neighbors across the river vote, why not the university students who live here but are registered elsewhere? Why not the commuters who clog your roads daily? You blur the definition of "local," making future electoral roll maintenance difficult.

  ### 5. The Revealing Test Case
  You mentioned you aren't sure what rule you've actually been running. To find out, you need a case that splits **Residency** from **Daily Impact**.

  **The Case:** *The Daily Commuter.*
  Consider a person who lives in the neighboring town (sleeps there, registered there) but works in your city 5 days a week, 10 hours a day. They use your roads, your emergency services during the day, and your shops. They pay income tax to the national government, but perhaps a local payroll tax to you.

  *   **If you let them vote:** You are running on **Principle B (Affected Interest/Daily Presence)**. You value where people *live their lives* over where they *sleep*. This would support letting the neighbors vote on the flood scheme.
  *   **If you deny them:** You are running on **Principle A (Ordinary Residence/Nighttime Location)**. You value the legal address over the lived experience. This confirms you should exclude the neighbors.

  **Recommendation:**
  If you wish to maintain the integrity of the municipal system as currently constituted by your precedents, **deny the vote.** However, given the specific nature of a flood scheme (where impact is physical and unavoidable, unlike property tax), you might consider a **non-voting consultation mechanism**. This allows you to acknowledge their affected interest (solving the ethical problem) without breaking your residency-based voting precedent (solving the consistency problem).
