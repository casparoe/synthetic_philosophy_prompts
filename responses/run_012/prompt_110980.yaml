      *   **The Meta-Problem:** Why do we *think* there is a hard problem? Why do we report having subjective experiences? (Explaining the behavior/reporting of consciousness, not consciousness itself).
      *   **Illusionism:** The view that phenomenal consciousness (as traditionally conceived) doesn't exist; it's a user-illusion created by cognitive processes.
