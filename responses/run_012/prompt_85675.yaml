answer: |-
  You are right to feel that some of this moves too quickly, because while Dan has articulated a coherent philosophical position, he is presenting a contested viewpoint as if it were settled fact. His summary is actually a very clear statement of what philosophers call the skeptical or nihilist view of omission causation, but he treats it as the obvious truth rather than one side of a live debate. If you showed this to a specialist in metaphysics or legal theory, they would nod at the clarity of his argument but wince at the certainty with which he presents controversial premises. The core issue is that Dan is conflating two distinct questions: the metaphysical question of what causation is, and the normative question of who should be held responsible. He assumes that because the law uses normative tools like duty to limit liability, the underlying causal relation must itself be normative, and that is where the reasoning starts to slip.

  Let's look at the first sentence, where he claims that absences can't stand in causal relations. This is the most contentious part of his entire summary, yet he states it as a premise that everyone should accept. In the philosophy of causation, this is exactly what is up for debate. There are two main camps here. On one side, you have process theorists who argue that causation requires a physical connection or a transfer of energy, like a billiard ball hitting another. Since an absence is nothing, it can't transfer energy, so it can't be a cause. Dan is firmly in this camp. However, on the other side, you have counterfactual theorists who argue that causation is about dependence. They ask, if the alleged cause hadn't happened, would the effect still have occurred? If the lifeguard had thrown the rope, the swimmer would not have died. Therefore, the death depends on the omission. For these philosophers, absences can absolutely be causes because causation is about patterns of dependence in the world, not just physical pushes and pulls. So, when Dan says absences can't be causes, an expert would say he is assuming his conclusion rather than proving it. He is adopting a specific metaphysical framework without acknowledging that there is a robust alternative framework that says the opposite.

  The second sentence, where he says the water causes the drowning but the failure to throw the rope does not, follows from his first premise but inherits its problems. An expert would wince at the implication that we must choose between the water and the omission. In many philosophical accounts, causation is not exclusive; there can be many causes for one event. The water is certainly a cause, but the lack of oxygen is also a cause, and the lack of a rope is also a cause. By saying the water does the causing and the omission does not, Dan is relying on a view that privileges positive events over negative ones. But consider this: if a doctor fails to administer a life-saving drug, and the patient dies from the disease, we often say the disease killed them, but we also say the failure to treat caused the death. Dan's view forces us to say only the disease caused it, which feels counterintuitive to how we explain events in everyday life and even in science. The expert would point out that Dan is solving a metaphysical problem by ruling out half the data, rather than explaining how both positive factors and absences can play causal roles.

  The third sentence is where the legal analysis starts to blur the metaphysical lines. Dan claims we only say the bystander caused it because we blame him, and that the law treats omissions as causes only where there is a duty. This is a very common intuition, but it conflates causation with liability. In legal theory, causation and duty are usually distinct elements of a tort. Causation is typically treated as a factual inquiry, while duty is a normative inquiry. The law often finds that a defendant did cause the harm but is not liable because they owed no duty. For example, if a stranger watches someone drown, many legal systems would agree that the stranger's inaction was a cause of the death in a factual sense, but they are not liable because they had no legal obligation to act. Dan is arguing that because the stranger isn't liable, the law is saying they didn't cause it. But a legal expert would correct him by saying the law is saying they caused it but aren't responsible for it. The duty requirement acts as a filter on liability, not as a definition of causation. By collapsing this distinction, Dan is smuggling a normative conclusion into a factual description. He is arguing that because the law limits liability based on duty, the causation itself must be an illusion created by the blame.

  This leads directly to the last two sentences, which is where you sensed he might be smuggling in a conclusion. You are right to be suspicious here. Dan concludes that the dispute about omission causation is really just a dispute about responsibility dressed up in metaphysics, and that philosophers who believe in omission causation are confusing courts with the world. This does not follow from the previous points. Even if the law uses duty to limit liability, it does not prove that the underlying metaphysical relation is normative. It is entirely possible that the lifeguard really did cause the death in a factual, metaphysical sense, but the law only punishes him because of his special role. The law is pragmatic; it doesn't always map perfectly onto metaphysics. For instance, the law has statutes of limitations, which means you can cause harm but not be liable if too much time passes. That doesn't mean the causation disappeared; it just means the liability expired. Similarly, the duty rule might just be a policy limit on liability, not a revelation that the causation was fake. Dan's conclusion assumes that because the law treats strangers and lifeguards differently, the metaphysical reality must be different too. But the metaphysical reality could be the same for both—they both caused the death by not acting—while the legal treatment differs based on their relationship to the victim.

  To answer your specific question about how a realist would push back, imagine a philosopher who believes omissions are real causes. They would tell Dan that he is confusing the question of whether C caused E with the question of whether C is blameworthy for E. They would argue that causation is a broad net that catches all the conditions necessary for an event to occur. The swimmer died because of the water, yes, but also because of the lack of air, and also because of the lack of rescue. All of these are causally relevant facts. The realist would say that the reason we don't blame the stranger is not because the stranger didn't cause the death, but because we don't think people should be legally compelled to be Good Samaritans. The causation is there, but the obligation is not. For the lifeguard, both the causation and the obligation are present. By saying the lifeguard's inaction didn't cause the death, Dan is actually making it harder to explain why the lifeguard is liable. If the lifeguard didn't cause the death, what exactly are they liable for? Usually, tort law requires causation as a prerequisite for liability. If Dan says there is no causation, he has to explain how the lifeguard is liable without causing the harm. The realist avoids this problem by saying the lifeguard caused the harm and had a duty to prevent it, making them liable, whereas the stranger caused the harm but had no duty, making them not liable. This preserves the intuition that causation is a fact about the world, while responsibility is a fact about our social rules.

  So, to summarize where an expert would stand, they would sign off on Dan's description of the skeptical view but reject his claim that it is the obvious truth. They would wince at his assertion that absences can't be causes, noting that this is a specific metaphysical commitment that many reject. They would strongly object to his claim that the duty-to-act rule proves causation is a fiction, pointing out that duty limits liability, not causation. And they would tell you that his final conclusion is a non sequitur because he assumes that legal distinctions must mirror metaphysical distinctions, which they often do not. Dan has written a persuasive argument for one side of the debate, but he has presented it as if the debate is already over. The reality is that the question of whether omissions are causes is still very much alive, and the reason it is alive is precisely because smart people disagree on whether causation is about physical processes or counterfactual dependence. Your instinct that it feels too quick is correct because he skips over the alternative theory that explains the same legal phenomena without denying the metaphysics of omission causation. He has effectively argued that because the law is normative, the world must be too, and that is a leap that most philosophers and legal theorists would ask him to justify much more carefully.
