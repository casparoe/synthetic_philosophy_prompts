answer: |-
  Here is the specification you requested. It is divided into two parts: first, the list of desiderata (requirements) that any adequate account must satisfy, with an assessment of their status; second, an analysis of the tensions between them, identifying which are jointly unsatisfiable and which constraint acts as the "killer" for otherwise attractive theories.

  ### Part I: The Desiderata List

  **1. The Causal Discrimination Requirement**
  *   **The Demand:** The account must distinguish between *physical independence* (two dice rolled in separate rooms) and *spurious correlation* (two thermometers in the same room). In the first case, multiplying probabilities is valid. In the second, it is invalid, even if you do not know the temperature.
  *   **The Precision:** It is not enough to say "check for connections." The account must specify what constitutes a "connection." For the thermometers, the requirement is that the account identifies the *common cause* (the room temperature) as a variable that screens off the dependence. If the account treats the thermometers as independent merely because you lack data on the room, it fails.
  *   **Status:** **Genuine.** This is not a preference. An account that cannot distinguish these cases yields false predictions about the world.

  **2. The Representation Invariance Requirement**
  *   **The Demand:** If you describe the same physical situation using different units or coordinates (e.g., Celsius vs. Fahrenheit, or Cartesian vs. Polar coordinates), the presumption of independence should not yield contradictory probabilities.
  *   **The Precision:** If you assume a "flat" distribution of ignorance over a radius, you get a different result than assuming a "flat" distribution over an area. The account must explain why one parametrization is the correct baseline for independence, or admit that the presumption is not invariant.
  *   **Status:** **Genuine for objective claims; Contested for subjective.** If your presumption claims to describe the world (like the dice), invariance is mandatory. If it claims only to describe your mind (your state of confusion), invariance is optional, but without it, the presumption cannot be used for shared scientific reasoning.

  **3. The Logical Uncertainty Requirement**
  *   **The Demand:** The account must allow you to assign probabilities less than 1 to mathematical truths that are fixed but unknown (e.g., the 10,000th digit of $\pi$). It must allow you to treat two such digits as independent unless a theorem links them.
  *   **The Precision:** Standard probability theory assumes logical omniscience (if $A$ is true, $P(A)=1$). This account must violate standard theory to accommodate the fact that you are reasoning about *knowledge*, not *chance*. It must define independence as "no known logical derivation links them," not "no causal link."
  *   **Status:** **Genuine.** Since you use this move for math, any account that forbids it (like strict frequentism) is inadequate for your purposes.

  **4. The Agency and Feedback Requirement**
  *   **The Demand:** The account must detect when the "other thing" has access to information about *you*. In a lottery where the operator sees your ticket, independence fails not because of physics, but because of information flow.
  *   **The Precision:** The account must distinguish between *causal isolation* (no physical link) and *informational isolation* (no signal carrying data). A mindless process (dice) respects causal isolation. A mindful process (operator) respects informational isolation. The presumption of independence is revoked if the informational channel is open, even if the causal one is closed.
  *   **Status:** **Genuine.** Failing this leads to exploitability (you will lose money in the guess-my-number game).

  **5. The Mutual Consistency Requirement**
  *   **The Demand:** The account must handle the difference between *pairwise independence* (A is independent of B, B of C, A of C) and *mutual independence* (A, B, and C are jointly independent).
  *   **The Precision:** The account cannot stipulate that pairwise independence implies mutual independence. It must provide a rule for when the conjunction of three events requires a correction factor beyond the product of individual chances.
  *   **Status:** **Genuine.** This is a mathematical necessity. Ignoring it leads to calculation errors in systems with hidden common causes (e.g., three sensors failing due to one power surge).

  **6. The Infinite Limit Requirement**
  *   **The Demand:** The account must provide a coherent rule for the probability of an infinite conjunction of independent events (e.g., an infinite sequence of coin flips all coming up heads).
  *   **The Precision:** Standard probability theory dictates this probability is exactly zero. Your intuition distrusts this. The account must either justify why zero is correct (despite intuition) or provide a non-standard mathematical framework where the limit is non-zero without breaking arithmetic.
  *   **Status:** **Preference vs. Formal Constraint.** Standard mathematics treats this as a hard constraint (zero). Your distrust is a philosophical preference. An account that satisfies standard math will violate your intuition here. An account that satisfies your intuition will violate standard math.

  **7. The Ontological Consistency Requirement**
  *   **The Demand:** The account must declare whether independence is a feature of the *world* (ontic) or a feature of your *information* (epistemic), and it must not switch between them to solve problems.
  *   **The Precision:** If it is ontic, math digits cannot be independent (they are fixed). If it is epistemic, thermometers in the same room *could* be independent (if you don't know they are in the same room). The account must resolve this conflict.
  *   **Status:** **Genuine.** Inconsistency here allows the theory to explain everything by changing definitions, which means it explains nothing.

  ***

  ### Part II: Analysis of Tensions and Conflicts

  You asked which requirements pull against each other and if any subset is jointly unsatisfiable. There are three major fault lines.

  **1. The Invariance vs. Ignorance Conflict (The Bertrand Trap)**
  *   **The Tension:** You want to presume independence based on "no known connection" (Ignorance). But you also want the result to stay the same if you change units (Invariance).
  *   **The Conflict:** These are often incompatible. If your presumption is based on *ignorance*, it depends on how you describe what you are ignorant about. If you describe a square by its side length, "ignorance" implies a flat distribution of lengths. If you describe it by area, "ignorance" implies a flat distribution of areas. These yield different probabilities.
  *   **The Verdict:** You cannot have a presumption of independence based *purely* on ignorance that is also invariant. To save Invariance, you must import external structure (physics, geometry, symmetry) to tell you which parametrization is "natural." This means the presumption is not a default of ignorance, but a default of *symmetry*.
  *   **Unsatisfiable Subset:** {Pure Ignorance Justification, Representation Invariance}. You must drop one.

  **2. The Epistemic vs. Ontic Conflict (The Math vs. Thermometer Trap)**
  *   **The Tension:** You use the same move for math digits (Epistemic: they are fixed, I just don't know) and thermometers (Ontic: they fluctuate, the world is uncertain).
  *   **The Conflict:** If independence is Epistemic, the thermometers in the same room *are* independent relative to you if you don't know they share a room. But Requirement 1 (Causal Discrimination) says they are *not* independent, regardless of your knowledge. If independence is Ontic, the math digits are *not* independent (they are determined), so assigning probability is category error.
  *   **The Verdict:** A single unified definition of "independence" cannot cover both math digits and thermometers without stretching the word until it breaks.
  *   **Unsatisfiable Subset:** {Logical Uncertainty Requirement, Causal Discrimination Requirement, Single Unified Definition}. You likely need two different concepts: *Logical Independence* (for math) and *Stochastic Independence* (for physics).

  **3. The Safety vs. Usefulness Conflict (Your Specific Suspicion)**
  *   **The Tension:** You noted that an account requiring evidence of independence is safe but useless, while one licensing it freely is useful but exposed to common causes.
  *   **The Conflict:** This is the tension between *Maximum Entropy* (assume the most random distribution possible) and *Causal Discovery* (look for links).
  *   **The Resolution:** This tension is resolvable, but only by accepting risk. The only way to be useful is to accept that the presumption is a *bet*, not a truth. The account must frame independence as a "null hypothesis" that you are willing to reject upon finding evidence of correlation.
  *   **The Verdict:** This is not unsatisfiable, but it requires changing the status of the presumption from "True" to "Provisional."

  **4. The Infinite Limit Conflict (Your Intuition vs. Math)**
  *   **The Tension:** You distrust the zero probability for infinite independent events.
  *   **The Conflict:** In standard measure theory (the foundation of modern probability), the probability of an infinite conjunction of events with probability $<1$ is *necessarily* zero. This is not a bug; it is a theorem.
  *   **The Verdict:** If you require non-zero probability for infinite independent conjunctions, you must abandon standard probability theory (Kolmogorov axioms). There are non-standard frameworks (like non-Archimedean probability), but they are complex and lose other intuitive properties (like simple addition).
  *   **Unsatisfiable Subset:** {Standard Probability Axioms, Non-Zero Infinite Conjunction}. You cannot have both.

  ***

  ### Part III: The Killer Constraint and Verdicts

  You asked which single requirement does the most to rule out otherwise attractive accounts.

  **The Killer Constraint: Representation Invariance.**
  This is the hardest requirement to meet.
  *   **Why:** Most "common sense" justifications for independence rely on the Principle of Indifference ("I have no reason to think X, so I treat all X as equal"). This principle famously fails Invariance (Bertrand's Paradox).
  *   **Consequence:** Any account that justifies independence purely by "I don't know of a link" is ruled out. To satisfy Invariance, the account must justify independence by "There is a symmetry in the physical setup that prevents a link." This moves the justification from your mind to the world.

  **Verdict on Well-Known Approaches:**

  1.  **Frequentism (Independence = Long-run relative frequency):**
      *   **Fails:** Logical Uncertainty Requirement (Math digits have no frequency).
      *   **Fails:** Ordinary Cases (You can't wait for infinite rolls of the dice to act).
      *   **Verdict:** Useless for your purpose.

  2.  **Classical Bayesianism (Independence = Coherent subjective belief):**
      *   **Passes:** Logical Uncertainty (Handles belief about math).
      *   **Passes:** Safety/Usefulness (Allows priors).
      *   **Fails:** Representation Invariance (Your beliefs can be inconsistent under reparametrization).
      *   **Fails:** Causal Discrimination (If you don't *know* the thermometers are linked, Bayesianism says you can treat them as independent. Requirement 1 says you shouldn't).
      *   **Verdict:** Good for math, dangerous for physics.

  3.  **Causal/Structural Accounts (Independence = Absence of causal paths):**
      *   **Passes:** Causal Discrimination (Thermometers).
      *   **Passes:** Representation Invariance (Physics is invariant).
      *   **Fails:** Logical Uncertainty (Math has no causes).
      *   **Fails:** Safety/Usefulness (Requires knowing the causal graph, which makes it "safe but useless" for new discoveries).
      *   **Verdict:** Good for physics, inapplicable to math.

  **Final Conclusion:**
  There is no single theory that satisfies all seven desiderata. The "Presumption of Independence" is not one thing. It is a conflation of two distinct moves:
  1.  **Physical:** Assuming no causal mechanism links two variables (satisfies Thermometers, fails Math).
  2.  **Logical:** Assuming no derivation links two propositions (satisfies Math, fails Thermometers).

  Your intuition fails when you apply the Physical move to the Logical case, or vice versa. The "Killer Constraint" is **Representation Invariance**, which forces you to admit that the presumption is not about your ignorance, but about the structure of the thing you are studying. If you cannot verify the structure, the presumption is a gamble, not a rule.
