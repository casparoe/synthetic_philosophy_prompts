      *   *The "Killer Constraint":* Which one rules out the most?
          *   It's likely *Representation Invariance* combined with *Epistemic Status*. If independence is just "I don't know," changing the description changes what I don't know, changing the probability. To fix this, you need physical/causal info, which contradicts the "default from ignorance" motive.
          *   Actually, the *Logical Omniscience* requirement (Bullet 3) is the strongest filter. Standard probability theory *cannot* handle this. It forces you into "Logical Probability" or "Subjective Bayesianism with limitations."

