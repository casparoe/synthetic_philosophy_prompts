          *   **Verdict:** This is a genuine requirement for a logical account, but often impossible for subjective priors without additional structure (like measure theory).

      *   *Bullet 3: Mathematical Items (Digits of Pi, Conjectures).*
          *   **Requirement:** *Logical Omniscience Escape.* The account must allow for probabilistic reasoning about fixed truths (logical uncertainty). Standard probability theory assumes if $A$ is true, $P(A)=1$. This heuristic treats $P(A)$ as $<1$.
          *   **Implication:** This forces the account to be *epistemic* (about knowledge), not *frequentist* (about long-run frequencies). You can't have a frequency of "Pi's 10,000th digit being 7."

      *   *Bullet 4: Adversarial/Mindful Cases (Lottery, Guess-my-number).*
