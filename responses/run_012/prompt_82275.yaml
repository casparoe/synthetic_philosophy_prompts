answer: |-
  **Scenario**
  Elena, a lab manager at a pharmaceutical firm, authorizes the shipment of one drum of toxic solvent to the DeepWell Disposal Facility. DeepWell operates under a strict regulatory cap: it may inject exactly 1,000,000 drums per fiscal year into a geological formation that leaks into Oakhaven's water supply, causing severe illness; any drums received beyond this cap are stored indefinitely in safe, sealed containment. Due to industry-wide overproduction, DeepWell's queue currently holds 5,000,000 drums. They will inject the first 1,000,000 (FIFO) and store the remaining 4,000,000. Elena's drum enters the queue at position 5,000,001. Her addition changes the queue to 5,000,001, leaving the injection count at 1,000,000 and the safe storage count at 4,000,001. No coalition of fewer than 1,000,000 shippers can reduce the queue enough to alter the injection count. However, if all shippers ceased sending drums, the queue would empty, injections would stop, and Oakhaven would remain safe. Elena is fully informed, uncoerced, and holds no special authority.

  **Verdicts and Reasoning**

  *   **Difference-Making Account:** **Permissible.** The causal mechanism is a step function where the outcome (number of injected drums) is invariant to Elena's input. Her act changes the queue size by 1, but the injection count remains fixed at 1,000,000. Since the harm to Oakhaven is strictly a function of the injection count, her act causes zero additional harm. Without a causal link to a worsening outcome, there is no moral violation.
  *   **Probability-Raising/Expected-Value Account:** **Permissible.** The probability of Elena's act being pivotal is not merely low; it is zero. For her to be pivotal, the queue would need to be within 1 unit of the 1,000,000 threshold, but it is 4,000,000 units over. Consequently, the expected disvalue of her act is exactly zero. Rational choice theory dictates she is indifferent.
  *   **Expressive/Participation Account:** **Wrong.** Elena is voluntarily enrolling her firm in a practice she knows directly sustains a harmful institution. By sending the drum, she validates DeepWell's operation and treats the poisoning of Oakhaven as an acceptable cost of her waste management. The wrongness lies in complicity and the maxim of her action (universalizing her conduct eliminates the harm), not in the marginal consequence.

  **Analysis of the Case**

  The single feature doing the work is the **Massive Causal Buffer** (the gap between the current aggregate and the next causal threshold). This buffer decouples the individual act from the harm mechanism while maintaining the collective dependence.

  *   **Removing the Buffer (Marginal Contribution):** If the queue were 1,000,000 and the cap 1,000,000, Elena's drum might be the 1,000,001st (safe) or, in a continuous system (like carbon), her contribution would be imperceptibly small but non-zero. In this direction, the Difference-Making account shifts to "Expected Value," arguing that while *this* act might not trigger harm, it contributes to a risk or a continuous slope. The verdict might soften for the Difference-Maker, but the Participation account remains steady.
  *   **Removing the Buffer (Pivotal):** If the queue were 999,999 and the cap 1,000,000, Elena's drum triggers the 1,000,000th injection. All three accounts converge on "Wrong." The Difference-Maker now has a causal link; the Expected-Value theorist has a high probability of impact; the Participation theorist has the same complicity plus direct harm.
  *   **Defender's Attack:** A defender of the Difference-Making account would attack the **stipulated rigidity** of the mechanism. They would argue that in the real world, caps are renegotiated, queues shift, and "safe storage" has costs that eventually translate to harm. They would claim the case is a "philosophical fiction" because bureaucratic thresholds are porous; if the practice persists, it is because enough individuals *are* pivotal over time, and Elena is simply "free-riding" on the pivotal acts of others. They would argue that moral responsibility tracks the *practice's* difference-making, distributed among participants, rather than absolving those in the buffer zone.

  **Feasibility Check**
  All specifications can be met at once. The blocking constraint in real-world physics (continuous causation) is bypassed by utilizing a **bureaucratic/regulatory mechanism** (fixed caps and FIFO queues) which is ordinary in workplace settings but operates discretely. The "strictly no difference" condition is satisfied mathematically by the buffer size relative to the threshold, and the "concrete harm" is satisfied by the specific leakage affecting Oakhaven. The case successfully isolates participation from difference-making.
