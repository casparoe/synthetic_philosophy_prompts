answer: |-
  Here is the specification for any theory attempting to resolve the constraint problem ("Do not do X even to prevent more X"). This list defines the load-bearing walls. If a proposal collapses under these, it is not a solution; it is a restatement of the intuition Nadia is attacking.

  ### The Specification

  **1. The Non-Circular Grounding**
  *   **Requirement:** The theory must explain *why* the constraint exists without defining the constraint as its own justification. It cannot say "You shouldn't kill because killing is forbidden." It must identify a feature of the act, the agent, or the victim that generates the prohibition.
  *   **Rationale:** Nadia's "fetish" charge succeeds if the only reason for the constraint is the agent's desire to remain clean. To defeat her, you must show the constraint is about something objective (e.g., rights, status, authority) rather than subjective (e.g., integrity, purity).
  *   **Status:** **Non-Negotiable.** Failing this changes the subject from justification to assertion.

  **2. The Victim's Standing**
  *   **Requirement:** The theory must state whether the person sacrificed (in the 1-vs-2 case) has a valid moral complaint against the agent. If yes, it must explain why the act was nonetheless required or permitted. If no, it must explain why the act was forbidden in the standard case.
  *   **Rationale:** This addresses the core interpersonal conflict. If the victim has no complaint when you kill them to save two, then the "wrongness" of killing isn't about the victim, which supports Nadia's claim that it's about *your* hands. If they *do* have a complaint, you need to explain why their complaint is silenced by numbers.
  *   **Status:** **Non-Negotiable.** This is the locus of the harm.

  **3. The Catastrophe Threshold**
  *   **Requirement:** The theory must specify whether there is a point where the constraint is overridden by the scale of prevention (e.g., kill one to save a million). If yes, it must provide a principled reason for where that line is drawn. If no, it must defend the absolutism against the charge of moral absurdity.
  *   **Rationale:** A theory that never bends looks insane; a theory that always bends looks like consequentialism in disguise. The theory must own its position on the slope.
  *   **Status:** **Negotiable.** (Absolutism is a valid position, provided it meets Requirement 6).

  **4. The Collective Action Mechanism**
  *   **Requirement:** The theory must explicitly state whether the "same machinery" handles the 1-vs-2 case and the "Pollution/River" case (100 people each contributing negligibly to a disaster). If the mechanisms differ, it must explain why the moral logic shifts between direct agency and collective contribution.
  *   **Rationale:** In the River case, "keeping hands clean" (not tipping) actually *produces* the disaster if everyone else tips. In the 1-vs-2 case, "keeping hands clean" (not killing) *prevents* the direct harm but allows the indirect harm. A coherent theory must account for this causal inversion.
  *   **Status:** **Non-Negotiable.** Ignoring this renders the theory inapplicable to real-world structural harm.

  **5. The Corporate Scope**
  *   **Requirement:** The theory must declare whether the constraint applies to collective agents (states, companies). If it applies, it must define what "keeping hands clean" means for an entity with no physical body. If it does not apply, it must accept that the theory is limited to individual psychology and cannot govern policy.
  *   **Rationale:** "Clean hands" is a metaphor for individuals. For a state, it might mean "adherence to law" or "public trust." If the theory cannot translate the constraint to collective agency, it admits it is not a public morality, only a private one.
  *   **Status:** **Negotiable.** (A theory can claim to be solely for individual conscience, but it must own that limitation).

  **6. Moral Residue**
  *   **Requirement:** If the theory allows the constraint to be broken (see Requirement 3), it must state whether the agent retains moral guilt or "taint" after the act.
  *   **Rationale:** If there is no residue, the constraint was not truly binding; it was just a heavy weight in a calculation. If there is residue, the theory must explain what function that guilt serves if the act was permissible.
  *   **Status:** **Negotiable.** (Some theories say "clean slate," others say "dirty hands").

  ***

  ### The Incompatibility Flag

  **Pair:** **The Victim's Standing (Item 2)** and **The Catastrophe Threshold (Item 3).**

  **The Conflict:** You cannot consistently hold that the Victim has an *absolute* right not to be used (which grounds the constraint) AND that this right is overridden by a sufficient number of other lives.
  *   If the right is absolute, no number of deaths overrides it (Absolutism).
  *   If the right is overridden by numbers, the right was not absolute, but conditional on the scale of consequences.
  *   **The Trap:** Most popular fixes try to have it both ways. They say "The victim has a right!" (to satisfy Item 2) but "Unless too many die!" (to satisfy Item 3). This smuggles consequentialism into the definition of the right. To meet the spec, you must admit that at the threshold, the victim's complaint *ceases to be valid*, which forces you to explain why their status changed when the background numbers shifted.

  ***

  ### The Killer Requirement

  **Item 1: The Non-Circular Grounding.**

  This requirement kills the most popular fixes because most defenses of constraints rely on intuition pumps ("Would you want to be the one killed?") or agent-relative assertions ("I am responsible for *my* acts, not the world's").
  *   **Why it kills them:** Nadia has already preempted this. She argued that caring about *your* acts over the *world's* outcome is a fetish. Any answer that rests on "It matters who does it" without explaining *why* it matters (beyond "because it does") collapses into the fetish charge.
  *   **The Casualties:**
      *   *Intuition-based defenses:* Die immediately (Nadia rejects the intuition).
      *   *Simple Agent-Relativity:* Dies immediately (Assumes the conclusion).
      *   *Sanctity of Life:* Often dies here unless it can explain why sanctity is violated by *your* hand but not by *inaction*.

  ***

  ### Solution vs. Dissolution

  **Should the list include "show that one of the assumptions generating the problem is false" as a legitimate way of satisfying everything else?**

  **Yes.** This is a **Dissolution**, and it counts as a valid solution.

  **Why:** The debate assumes a specific architecture of morality: that "badness of killing" and "badness of letting die" are commensurable quantities on a single scale. If a theory demonstrates that this architecture is category error (e.g., "Rights are not weights to be balanced; they are boundaries that make balancing incoherent"), it satisfies the spec by rendering Nadia's question unaskable rather than unanswered.
  *   **Condition:** To count as a dissolution, the theory must explain *why* we made the category error in the first place. It cannot just assert "You're asking the wrong question." It must show the grammatical or conceptual trick that made the question seem sensible. If it does that, it meets Requirement 1 (Non-Circular Grounding) by grounding the constraint in the logic of moral language/concepts rather than outcomes.
