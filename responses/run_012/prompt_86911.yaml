answer: |-
  You have put your finger on the engine room of causal reasoning. You are correct that this is not merely "Great Man vs. Structure" (which is a substantive historical thesis) nor "Overdetermination" (which is a logical relation between causes). It is something more fundamental: it is a disagreement about the **rules for constructing the counterfactual world**.

  There is no single household name for this specific pattern of argument, but in analytic philosophy and historiography, it is carved up by three interlocking concepts. If you want the established terminology, it is **Contrastive Causation** mediated by **Backtracking Counterfactuals**. If you want a name for the specific phenomenon of the answer flipping based on the time-scale, I will coin one for you at the end: **Modal Granularity**.

  Here is the proper carving of the thing.

  ### 1. The Structure: Contrastive Causation
  Philosophers of causation (notably Jonathan Schaffer and Christopher Hitchcock) argue that causation is not a two-place relation (*Hitler caused the War*). It is a four-place relation:
  > *C rather than C\** caused *E rather than E\**.

  The disagreement you are witnessing is a disagreement about the **contrast class** (the *C\** and *E\**), usually hidden inside the "holding fixed" clause.

  *   **Side A (Structural):** Their implicit claim is: "Hitler *rather than another right-wing nationalist* caused the specific *flavor* of the War, but not the War *rather than No War*." They are holding the **structural conditions** fixed. In their counterfactual world, the Depression and Versailles still exist, so the *role* exists. They are asking: "Given the structure, does the specific agent matter?"
  *   **Side B (Agency):** Their implicit claim is: "Hitler *rather than No Hitler* caused the War *rather than No War*." They are holding the **specific historical sequence** fixed. In their counterfactual world, Hitler vanishes in Jan 1933, but the past remains identical. They are asking: "Given the exact sequence of events, was this node necessary?"

  When they argue, they talk past each other because they are answering different contrastive questions. Side A thinks Side B is being naive about sociology; Side B thinks Side A is being deterministic. Both are logically valid within their own contrastive frame.

  ### 2. The Mechanism: Backtracking vs. Non-Backtracking
  You noted the "rewind" aspect: *"Rewind a week and he's indispensable; rewind thirty years and he's a detail."* This is the technical distinction between **Non-Backtracking** and **Backtracking** counterfactuals (famously analyzed by David Lewis).

  *   **Non-Backtracking (The "Miracle" View):** To ask "What if Hitler wasn't there in 1933?", you make a minimal "miracle" at that moment. He disappears. The past (Versailles, the Depression, the rise of the Völkisch movement) remains exactly as it was. This favors the **Agency** argument. In this world, the conditions are ripe, but the specific catalyst is missing. The outcome is highly sensitive.
  *   **Backtracking (The "Genesis" View):** To ask "What if Hitler wasn't there?", you reason backward. If Hitler isn't there, the past must have been different enough to prevent him. If the past is different, the conditions (Versailles, Depression) might have played out differently, or produced a different man (Göring, Strasser). This favors the **Structural** argument. In this world, the "role" is a gravitational pull that captures mass.

  The argument flips because **causal sensitivity is time-dependent**. Close to the event, the system is chaotic and sensitive to initial conditions (Butterfly Effect/Agency). Far from the event, the system looks like it has attractor states (Structuralism).

  ### 3. The Phenomenon: Causal Contextualism
  The overarching philosophical position that describes what you are seeing is **Causal Contextualism**. This is the thesis that the truth of a causal claim depends on the **context of inquiry**.

  There is no "God's eye view" of causation where you can see *The Cause*. There are only causal claims made relative to a **Ceteris Paribus** (all else being equal) clause. The fight is about which "alls" are "equal."
  *   Side A holds *sociological forces* equal.
  *   Side B holds *timeline specifics* equal.

  Neither is "cheating" in a logical sense, but they are cheating in a rhetorical sense if they don't declare their **Ceteris Paribus** clause.

  ### 4. A Coined Term: Modal Granularity
  You asked for a name for the thing itself, specifically the way the answer flips depending on "where you make the cut." I propose calling this **Modal Granularity**.

  **Modal Granularity** describes how causal necessity shifts as you change the resolution of your counterfactual lens.
  *   **High Granularity (Zoomed In):** You look at the week before the appointment. The specific texture of the wood grain matters. Hitler is necessary.
  *   **Low Granularity (Zoomed Out):** You look at the decade before the appointment. The shape of the forest matters. Hitler is incidental.

  The frustration you feel comes from **Granularity Mismatch**. One arguer is zoomed in (moral responsibility, specific decisions), and the other is zoomed out (sociological trends, inevitability). They are both looking at the same map, but one is using a street view and the other is using a satellite view.

  ### 5. Where is the line between legitimate and illegitimate?
  You asked: *"Where is the line between a legitimate choice of what to hold fixed and an illegitimate one?"*

  There is no ontological line (the world doesn't care), but there is a **pragmatic line**. The legitimacy is determined by **Explanatory Interest** (a concept from Bas van Fraassen).

  *   **Legitimate:** You choose what to hold fixed based on *what you want to know*.
      *   If you want to know **Moral Responsibility**, you must hold the structure fixed and vary the agent. (You can't blame "The Depression" in a court of law). This requires **Non-Backtracking**.
      *   If you want to know **Prevention/Policy**, you should hold the agent variable and vary the structure. (If we want to stop the next Hitler, we need to fix the Versailles/Depression conditions). This requires **Backtracking/Structural**.
  *   **Illegitimate:** You choose what to hold fixed to **win the argument** rather than answer the question.
      *   *The Cheat:* Holding the economy fixed but not the political culture. This is **Model Specification Error**. If you admit the economy collapsed, you must admit that political culture *could* have shifted. To hold one fixed while letting the other vary requires a justification (a causal model) that explains why the economy is independent of the culture. If you can't provide that model, you are "cheating."

  ### Summary
  The thing you are running into is **Contrastive Causation** operating across different **Temporal Granularities**.

  *   **The Name:** **Causal Contextualism** (established) or **Modal Granularity** (descriptive).
  *   **The Mechanism:** Disagreement over **Backtracking vs. Non-Backtracking Counterfactuals**.
  *   **The Resolution:** You cannot resolve the argument by looking at more history. You can only resolve it by asking: **"What is this explanation for?"**

  If the goal is blame, the Great Man theory is the correct granularity. If the goal is prevention, the Structural theory is the correct granularity. The error is pretending there is only one valid granularity for all purposes.
