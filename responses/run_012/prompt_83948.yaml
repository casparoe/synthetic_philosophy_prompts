  I dont have any kind of philosophy background, I just read alot about this stuff on my own and argue about it with people, so forgive me if I get a word wrong. My film club keeps going round in circles: somebody says "everyone says it's amazing" about a film they skipped, somebody else says you can't actually think a film is good unless you've watched it, and I can never tell if that's a real point or just a polite way of saying "I saw it and you didn't." I want to build one of those flowchart quiz things that sorts people into boxes by asking about concrete cases, so we can find out what we actually disagree about instead of trading examples.

  Please build it as a numbered list of exactly five items, one question per item, each item a sentence or two, no intro and no wrap-up at the end. Name the boxes where there's a name for them, but the questions have to do the sorting, so phrase each one so a person can answer it without knowing which box it lands them in. No reading lists and no "go look up so-and-so" — I won't, and I don't care who said what.

  The boxes I need it to keep apart: (a) there's nothing to know anyway, it's just your own reaction, or taste is relative; (b) you have to have seen it yourself, no pile of other people's say-so gets you there; (c) you can lean on a good critic the way you lean on a good mechanic, it's just evidence like anything else; (d) the one I only came across recently, that you can know it's good without ever getting what's good about it; and (e) whatever view says the fight is really about something else — not what you can believe, but what you're allowed to say out loud, or whether the thing actually moves you. If two of those end up in the same box, say so in the item where it happens instead of pretending they came apart, and if there's a combination of answers nobody seems to hold, say so and say whether the box is empty because it's incoherent, because it's just unattractive, or because nobody's looked.

  Use cases like these: a film you skipped that everyone you trust loves; a dish you've never tasted; music where a friend's taste has matched yours for years and then suddenly doesn't; a review by a critic you've never heard of; a film every person you trust says is a masterpiece and you watched it and hated it; something you loved first and only later found out it's supposed to be great. Start with whichever question splits the room hardest, and if a question only makes sense for some people, say that in the item rather than asking it to everybody.
