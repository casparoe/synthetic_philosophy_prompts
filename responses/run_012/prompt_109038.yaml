  I am compiling a handout for the final session of a seminar on evolutionary psychology and would like to open it with a poem rather than a prose summary. Write a sixteen-line pantoum on the charge that adaptationist explanation is unfalsifiable, and let the form do the argumentative work: a pantoum recycles its lines, each returning in a changed context, and the opening stanza's lines come back at the close to shut the circle — which is precisely the shape of an account that can absorb any trait by positing a selection pressure and any awkward case by calling it a byproduct or a mismatch. At least one line should read on its first appearance as a confident adaptive hypothesis and, on its return, as a tautology or as the objection to itself. The poem should not be a cheap debunk, however: somewhere before the final quatrain it should register the adaptationist's strongest reply — that selectionist hypotheses can be made risky and tested against comparative evidence — so that the disagreement is held open rather than settled. Assume a reader who knows what selection, fitness, and a byproduct are, and avoid name-checking researchers. Follow the poem with a single section titled "Commentary" (roughly 150–200 words) on the formal choices you made, in which you state how confident you are that the poem represents the debate fairly and name the one line or claim you are least sure of.
