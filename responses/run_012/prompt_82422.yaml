prompt: |-
  ok weird request but this has suddenly gotten very relevant to me. I'm a third-year PhD student and my field (social psych adjacent) just went through another round of failed replications, including one of the studies my own thesis design was built on. So now I'm trying to figure out what I actually think, and my supervisor put me on a little committee that's rewriting how we teach stats to incoming students. They've given me basically a semester and one masters student to work with, and I also get to spend maybe a third of my own research time on this for the next two years, so I need to pick carefully.

  Everyone in the group has a pet answer and they all sound plausable:
  - one person says just switch everything over to Bayes factors with a default prior, problem solved
  - another says no, a default prior is just as arbitrary as p < .05, the real issue is that we decide which comparison to report after we've already seen the data
  - a third says the whole thing is a decision problem underneath: "is this effect real" is really "would I do anything differently if it were," and if nothing downstream would change then the p-value is beside the point
  - and one more says stop arguing about inference altogether and just pre-register everything

  My gut says most of these are talking past each other and the actual open questions are somewhere else, but I cant tell where. What I want from you is a prioritization, not a survey: which open questions in the frequentist-vs-Bayesian-vs-something-else mess most deserve the limited effort I described, ranked, with your reasoning about which are upstream of which, how tractable each is for someone like me (decent math, no stats PhD), and what evidence over the next year or two would move it up or down the list. Also tell me which of the four pet answers above is most overrated, and why. No reading lists or citations please, I can't look anything up right now and I don't want a bibliography anyway.

  Give it to me as a JSON object with these fields:
  - "bottom_line": one paragraph, the ranking in prose first
  - "ranked": array, each entry {"rank": number, "question": string, "why_it_matters": string, "upstream_of": [strings], "tractability_for_me": string, "neglected": string, "what_would_change_ranking": string, "first_concrete_step": string}
  - "overrated_answers": array of {"answer": string, "why_overrated": string}
  - "dependencies": string describing which questions have to be settled before others
  - "wildcard": one question you think I'm not considering at all

  Keep the prose casual, I'm not writing a paper here.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in social psych adjacent field.
      *   **Context:** Field hit by replication crises (including a foundational study for their thesis). Supervisor put them on a committee to rewrite stats teaching for incoming students.
      *   **Resources:** One semester, one masters student, ~1/3 research time for next two years.
      *   **Task:** Prioritize open questions in the stats/inference debate (Frequentist vs. Bayesian vs. Decision Theory vs. Pre-registration).
      *   **Constraints:**
          *   No reading lists or citations.
          *   Output format: JSON object with specific fields (`bottom_line`, `ranked`, `overrated_answers`, `dependencies`, `wildcard`).
          *   Tone: Casual, not academic paper.
          *   Content: Ranking of questions, reasoning (upstream, tractability, neglected, evidence to change rank, first step), critique of the four "pet answers" provided.
      *   **Goal:** Help the user decide where to focus limited effort for maximum impact on teaching reform.

  2.  **Deconstruct the Four Pet Answers:**
      *   *Bayes Factors with Default Prior:* Solves p-hacking? No, still vulnerable to optional stopping if not careful, priors are contentious.
      *   *Garden of Forking Paths (Decision after seeing data):* This is the core of p-hacking/QRPs. Very central.
      *   *Decision Theory (Utility):* Philosophically sound but hard to implement in teaching/practice.
      *   *Pre-registration:* Procedural fix, doesn't solve analysis issues, but constrains QRPs.

  3.  **Identify the Real Open Questions (The "Mess"):**
      *   The user suspects people are talking past each other. They are.
      *   What actually matters for *teaching* incoming students to prevent future crises?
      *   *Question 1: Measurement & Construct Validity.* If the measure is garbage, no stats save you. (Often neglected in stats debates).
      *   *Question 2: Analysis Flexibility / Forking Paths.* How to teach students to lock down decisions *before* seeing data without stifling exploration.
      *   *Question 3: Effect Size & Uncertainty.* Moving away from binary significance to magnitude and precision.
      *   *Question 4: Incentive Structures.* Why do people p-hack? (Hard for a teaching committee to change, but relevant).
      *   *Question 5: Bayesian vs. Frequentist.* Actually less important than how either is used.

  4.  **Develop the Ranking (Prioritization):**
      *   *Constraint:* Limited effort (1 semester + 1 MA student). Needs high impact, tractable.
      *   *Top Priority:* **Analysis Flexibility & Transparency.** This addresses the "decide after seeing data" complaint directly. It's teachable. It works with both Bayes and Frequentist.
      *   *Second Priority:* **Estimation over Testing.** Shift focus from "is it real?" to "how big is it?". This undermines the binary thinking that fuels the crisis.
      *   *Third Priority:* **Measurement Quality.** If the thesis foundation failed replication, was it the stats or the measure? Usually both, but measure is upstream. Harder to teach in a stats class, but crucial.
      *   *Fourth Priority:* **Bayes vs. Frequentist.** Too much theology, not enough practical gain for beginners compared to the above.
      *   *Fifth Priority:* **Decision Theory.** Too abstract for incoming masters/PhD students.

      *Refining the Ranking for the JSON:*
      1.  *How to constrain researcher degrees of freedom without killing exploration.* (Addresses the "forking paths" guy).
      2.  *How to teach estimation/uncertainty instead of binary thresholds.* (Addresses the Bayes vs. P-value fight by changing the goal).
      3.  *When does a prior actually matter vs. when is data dominant?* (Addresses the Bayes guy, but makes it practical).
      4.  *How to align incentives with honest reporting.* (Addresses the Decision Theory guy, but makes it institutional).

      *Wait, I need to frame these as "Open Questions" to investigate, not just solutions.*
      1.  *Question:* What specific analysis decisions cause the most variance in outcomes for typical social psych designs? (Tractable with the MA student).
      2.  *Question:* Can we teach estimation intervals that students actually interpret correctly? (Pedagogy focus).
      3.  *Question:* How sensitive are our typical effects to reasonable prior specifications? (Bayes check).
      4.  *Question:* What pre-registration elements actually reduce bias vs. just adding bureaucracy? (Pre-reg check).

      *Let's align with the user's "upstream" request.*
      The most upstream issue is *Researcher Degrees of Freedom* (The "forking paths" argument). If you don't solve this, Bayes factors are just p-hacked Bayes factors.
      Next is *Interpretation* (Binary vs. Continuous).
      Next is *Tool Selection* (Bayes vs. Freq).

  5.  **Critique the Pet Answers (Overrated):**
      *   *Most Overrated:* "Switch everything to Bayes factors with a default prior."
      *   *Why:* It treats the symptom (p-values) not the disease (flexibility). Default priors can be just as misleading in small-N social psych. It gives a false sense of security.
      *   *Runner Up:* "Just pre-register everything." (Too blunt, doesn't help with analysis choices within the reg).

  6.  **Drafting the JSON Content:**
      *   *Bottom Line:* Summarize the ranking. Focus on flexibility/QRPs first, estimation second, Bayes third.
      *   *Ranked:* 4 items.
      *   *Overrated:* 1 or 2 items.
      *   *Dependencies:* Explain the logic flow.
      *   *Wildcard:* Something about measurement validity or power analysis realism.

      *Refining Tractability:* The user has an MA student. Simulation studies are perfect for this. They can simulate data, apply different analysis choices, see how much p-values/BFs wiggle. This is doable in a semester.

      *Refining the "Wild Card":* Power analysis is usually garbage in social psych. Everyone assumes d=0.5. Real question: "What is the actual distribution of effect sizes in our subfield?"

  7.  **Review against Constraints:**
      *   JSON format? Yes.
      *   No citations? Yes.
      *   Casual tone? Yes.
      *   Specific fields present? Yes.
      *   Reasoning on upstream/tractability? Yes.

  8.  **Final Polish of JSON structure:**
