      *Tractability:* MA student can run simulations for #1 and #3. Surveys/experiments for #2. Literature review/small study for #4.
      *Upstream:* #1 is upstream of everything. If flexibility doesn't matter, nothing else matters. #2 is upstream of interpretation. #3 is upstream of adopting Bayes. #4 is downstream of #1.

