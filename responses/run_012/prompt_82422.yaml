      *Wait, one more check:* "Give it to me as a JSON object". I need to make sure I don't add markdown code blocks around it if the user wants raw JSON, but usually, markdown code blocks are safer for display. The prompt says "Give it to me as a JSON object", I will wrap it in a code block for clarity but ensure the content is valid JSON.

      *Wait, checking the "bottom_line" constraint:* "one paragraph, the ranking in prose first".
      *Checking "ranked" fields:* rank, question, why_it_matters, upstream_of, tractability_for_me, neglected, what_would_change_ranking, first_concrete_step.
      *Checking "overrated_answers":* answer, why_overrated.
      *Checking "dependencies":* string.
      *Checking "wildcard":* string.

      *Let's finalize the ranking logic:*
      1.  *Researcher Degrees of Freedom:* This is the root cause. If you don't fix this, nothing else matters.
      2.  *Estimation vs. Testing:* Changes the goal post from "truth" to "magnitude".
      3.  *Prior Sensitivity:* Makes Bayes useful rather than dogmatic.
