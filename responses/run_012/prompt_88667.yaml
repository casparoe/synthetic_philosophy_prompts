prompt: |-
  ok so I'm a first-year math grad student and I've been putting off a thing that's now due: I have to run the student seminar in two weeks, and I want to make the handout about the axiom of choice, because it's been eating at me. I got through my whole undergrad writing analysis and algebra proofs where nobody ever flagged AC, and then in my first month here someone pointed out that every vector space has a basis, Tychonoff for arbitrary products, and Zorn's lemma all use it or are actually equivalent to it, and that the same axiom is what hands you Banach-Tarski and non-measurable sets. My old advisor says it's obviously true; my new one calls it a bookkeeping device, which I'm pretty sure means he doesn't think it's true or false at all. I came here wanting to do probability and now I feel like the whole subject is sitting on something I can't defend, so I'd like to actually know where I stand.

  What I want is a decision tree / flowchart, about a page, that starts from the one thing everyone in the room already grants -- AC is independent of ZF, so the other axioms can't force your hand -- and then branches on questions until you land on a named position. Sort people by what they say about cases, not by the label they'd pick for themselves. So not 'are you a constructivist' but 'here's a family of nonempty sets of reals with no rule for picking out an element of each one; does a selector exist, yes or no'.

  Cases I want on the tree, because I think they're the ones that really split people: a selector for an arbitrary ruleless family of nonempty sets of reals; Banach-Tarski; that you need countable choice to get 'a countable union of countable sets is countable'; bases for arbitrary vector spaces; Tychonoff for arbitrary products; well-ordering the reals; and the trade with determinacy, since if you keep the axiom that every infinite game with a fixed payoff set is determined, you give up choice. I'd also like a node that forces the 'restrict set theory or restrict logic' choice: keep classical logic with excluded middle and drop AC, or keep AC and get suspicious of non-constructive existence proofs, or keep both and decide AC isn't the kind of thing that's true or false.

  Leaves I want to be able to reach: AC is true of the sets, and Banach-Tarski is a fact about balls rather than a reductio; AC is false and ZF is the real theory; a pragmatist who uses AC in algebra but refuses it in measure theory and doesn't think that's inconsistent; someone who keeps determinacy and treats 'every set of reals is measurable' as a constraint on what counts as a set; a constructivist who rejects excluded middle and thinks the whole question is a symptom of classical logic; a formalist who thinks AC is a tool for building models and 'is it true' is a category mistake; and whatever you'd call the person who thinks there are many equally good set-theoretic universes, with AC true in some and false in others. Add leaves I'm missing, and if a leaf is a position nobody actually holds, say so rather than inventing a defender for it.

  Then the part I actually care about: which combinations of answers are unoccupied, and why. If nobody holds 'reject AC but keep the well-ordering theorem', is that because it's flatly inconsistent or just unattractive? Same for 'accept AC but deny that non-measurable sets exist' and 'use Zorn's lemma but deny AC'. And if two leaves can't be separated by your tree -- the formalist and the multiverse person might both say 'no fact of the matter' at the top -- flag that instead of pretending the tree sorts them.

  Two last things. Be careful to separate what's actually settled from what's contested: the independence results and the equivalences among AC, Zorn, and well-ordering are math, and I don't want them framed as up for grabs; but whether AC is true, whether non-measurability is a reductio, and whether the pragmatist line is even coherent are things people who know this stuff genuinely disagree about. I want that line drawn clearly, not smoothed over with a consensus voice. And write it in American English, my seminar mates will definately notice if it comes out British. One line per leaf on its most awkward commitment, since that's the part that'll make it worth arguing about.
