      *   Jainism explicitly rejects *ekantavada* (one-sidedness/dogmatism), but it does not embrace total relativism. It seeks a *synthesis* of valid partial truths.
      *   Step (1) can be saved if interpreted as "Human assertions are always qualified," not "Reality has no definite nature."
      *   Step (3) can be saved (both stability claims are legitimate).
