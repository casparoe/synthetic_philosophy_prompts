      *   *Syadvada* uses the "seven-fold predication" (maybe it is, maybe it isn't, maybe it is and isn't, etc.), always qualified by *syat* ("in some sense").
      *   *Nayavada* classifies partial standpoints. Crucially, Jainism distinguishes between *valid* partial standpoints (*naya*) and *invalid* dogmatic standpoints (*durnaya*).
      *   *The User's Error:* The user assumes that *any* standpoint is legitimate (Step 6/7). Jainism does *not* say every possible perspective is valid. It says every *valid* perspective is partial. There are criteria for validity (consistency with experience, logic, non-violence, etc.). A flat-earther's standpoint isn't a valid *naya*; it's a *durnaya* (false standpoint).
      *   *Step (1) Nuance:* "Never true full stop." In Jain epistemology, omniscience (*kevala jnana*) sees the whole truth. Humans cannot do this. So for humans, (1) is mostly okay, but "never" is strong. However, the user wants to keep (1).
