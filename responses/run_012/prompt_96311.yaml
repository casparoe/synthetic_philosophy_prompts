          *   Critics: Assumptions = *Propositions*. They assert how the world works. Falsity is a bug (misrepresentation).
          *   *Diagnosis:* They are talking past each other because one sees a lever, the other sees a claim.
      *   *Section 2: The Epistemic Good (Prediction vs. Explanation).*
          *   Friedman: Science is for policy/control. If the lever works, pull it.
          *   Critics: Science is for understanding/stability. If we don't know *why* the lever works, we can't know when it breaks (Lucas Critique).
          *   *Diagnosis:* This is the substantive core. It's about the purpose of economic science.
      *   *Section 3: Is it Verbal or Substantive?*
