answer: |-
  Your diagnosis is astute, and your fatigue is warranted. The ritual you describe is a classic case of methodological stalemate where the combatants are fighting on different terrains while using the same map. To answer your request directly: the dispute is **both verbal and substantive**, but the verbal equivocation is the mechanism that prevents the substantive disagreement from being recognized and resolved.

  The impasse persists because the two sides are not arguing over the same proposition. They are arguing over the *function* of a model, disguised as an argument over the *truth* of its parts.

  Here is the diagnosis based on what each side actually maintains, followed by an assessment of where progress lies.

  ### 1. The Equivocation: What is an "Assumption"?

  Your first hypothesis is correct: the sides disagree on the ontology of an assumption. This is the verbal component that fuels the substantive fire.

  **The Friedmanite Position:**
  For the defender of the "F-twist," an assumption is a **computational device**. It is a premise in a derivation whose sole office is to generate implications. When Friedman argues that a billiard player acts *as if* they solve complex equations, he is not claiming the player has a calculator in their head. He is claiming that the *mathematical structure* of the optimization problem is isomorphic to the player's behavior.
  *   **Maintenance:** The assumption is not a claim about the causal mechanism; it is a shorthand for a regularity. Its falsity is not just tolerable but necessary, because a theory that included every detail of reality would be as complex as reality itself and thus useless.
  *   **Implication:** To ask if the assumption is "true" is a category error. One asks only if the assumption is *fruitful*.

  **The Critic's Position:**
  For the critic (the realist or structuralist), an assumption is a **causal claim**. It asserts something about the machinery of the world. When a model assumes profit maximization, it asserts that the causal force driving firm behavior is the pursuit of profit.
  *   **Maintenance:** If the assumption is false, the causal story is wrong. Even if the prediction holds, the theory has failed to capture the underlying structure.
  *   **Implication:** A false assumption severs the link between the model and the world. If the prediction is accurate, it is accidental (or limited to a specific context), and the theory cannot be trusted for policy or extrapolation.

  **The Diagnosis:**
  The debate stalls because the Friedmanite hears "Your tool doesn't work" when the Critic says "Your map is inaccurate," and the Critic hears "Truth doesn't matter" when the Friedmanite says "Predictions matter." They are using the word "assumption" to refer to two different functional roles within a theory: one logical (input for deduction), the other ontological (description of mechanism).

  ### 2. The Substantive Clash: Epistemic Goods

  Once the verbal equivocation is stripped away, a hard substantive core remains. This addresses your second hypothesis: the disagreement over the relevant epistemic good.

  **Prediction (Instrumentalism):**
  The Friedmanite prioritizes **external validity**. The goal of economics is to predict outcomes in the world. The standard of evidence is empirical fit. If $P$ follows from $A$, and $P$ is observed, the theory is vindicated, regardless of $A$'s status.
  *   **Intuition:** Science is a black box. We care about the output, not the gears.

  **Explanation (Realism):**
  The Critic prioritizes **internal validity** and **structural stability**. The goal of economics is to understand *why* outcomes occur so that we know how the system responds to intervention. The standard of evidence is mechanistic plausibility.
  *   **Intuition:** Science is an engine. If you don't know how the gears turn, you cannot fix the engine when it breaks, nor can you safely modify it (the Lucas Critique argument).

  **The Hidden Formal Question:**
  The substantive dispute turns on a formal question that neither side explicitly solves: **Under what conditions does a false premise yield a robustly true conclusion?**
  *   The Friedmanite assumes that the mapping from false assumption to true prediction is stable across contexts.
  *   The Critic assumes that false assumptions introduce fragility; the prediction holds only within the narrow boundary conditions where the distortion cancels out or is negligible.

  This is not a philosophical preference alone; it is a bet on the topology of economic reality. Is the economic world "forgiving" (many different micro-foundations lead to the same macro-regularity), or is it "sensitive" (small changes in micro-behavior alter macro-outcomes)?

  ### 3. Verbal or Substantive? Standards or Intuitions?

  To answer your specific queries:

  **Is the dispute verbal or substantive?**
  It is **substantive**, but it is **masked** by verbal confusion. If you forced both sides to agree on definitions (e.g., "Let us call descriptive claims 'postulates' and computational shortcuts 'idealizations'"), the debate would not vanish; it would sharpen. The Friedmanite would say, "We only need idealizations." The Critic would say, "You are treating postulates as idealizations." The conflict would then be revealed as a disagreement over whether economic regularities are robust enough to sustain idealizations.

  **Do they differ over standards of evidence or starting intuitions?**
  They differ over **starting intuitions** regarding the nature of social science.
  *   The Friedmanite intuition is borrowed from classical physics (gravity doesn't need to "know" calculus to work).
  *   The Critic intuition is borrowed from biology or engineering (function depends on structure).
  Neither side can argue for these intuitions without begging the question, because these intuitions *define* what counts as evidence. For the Friedmanite, a successful forecast *is* the evidence. For the Critic, a successful forecast is merely a prompt to ask for the mechanism.

  ### 4. What Counts as Progress?

  You asked for a path forward. Another round of adjudication on "realism" will fail. Progress requires changing the question from the **truth of assumptions** to the **stability of inferences**.

  **The Distinction: Negligibility vs. Domain Specificity**
  The seminar should stop asking "Is this assumption true?" and start asking "Is this assumption *critical*?"
  *   **Progress:** Adopt the framework of **Robustness Analysis** (associated with Richard Levins and Robert Sugden).
  *   **Method:** Instead of defending the falsity of an assumption, test the sensitivity of the conclusion to variations in that assumption.
      *   If I relax the "perfect information" assumption to "noisy information," does the prediction hold?
      *   If I change "profit maximization" to "satisficing," does the equilibrium shift?

  **The Formal Result:**
  Progress would look like a formal demonstration of **structural stability**.
  *   If the Friedmanite can show that the prediction is *topologically stable* (i.e., small perturbations in the assumptions do not alter the qualitative nature of the prediction), they win the substantive argument without needing to claim the assumptions are "true."
  *   If the Critic can show that the prediction is *structurally unstable* (i.e., the result depends knife-edge on the specific false assumption), they win the right to demand realistic micro-foundations.

  **The Change in Question:**
  Move the seminar from **Methodological Appraisal** to **Model Triangulation**.
  *   Stop trying to find the "one true model."
  *   Acknowledge that different models (with different false assumptions) may be required for different purposes (prediction vs. policy design).
  *   The question becomes: "For *which* class of counterfactuals is this model reliable?"

  ### Conclusion

  The impasse is ritualized because both sides are defending a necessary but insufficient condition for good science. Prediction without understanding is fragile (luck); understanding without prediction is empty (scholasticism).

  The dispute is verbal in that "assumption" conflates *simplification* with *assertion*. It is substantive in that it reflects a genuine uncertainty about the robustness of economic laws.

  **Recommendation for the Seminar:**
  Ban the phrase "unrealistic assumptions." Replace it with **"sensitivity conditions."** Require that every paper discussed must explicitly state:
  1.  Which assumptions are essential to the result (if changed, the result breaks).
  2.  Which assumptions are incidental (if changed, the result holds).

  This forces the Friedmanite to admit where their theory breaks (domain limits) and forces the Critic to admit where descriptive accuracy is irrelevant to the outcome (robustness). It shifts the ground from a philosophical stalemate to a technical investigation of the model's architecture. That is the only progress available.
