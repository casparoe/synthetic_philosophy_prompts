      *   *Critics (Realism/Structuralism):* "Assumptions define the mechanism." If the mechanism is wrong, the prediction might be right by luck (Gettier-style), but the theory won't hold under policy changes (Lucas Critique precursor). False assumptions limit the domain of applicability.
      *   *The Impasse:* Friedman says "It works." Critics say "But *why*?" Friedman says "Who cares?" Critics say "I do, because I need to know when it stops working."

  3.  **Evaluate the User's Hypotheses:**
      *   *Hypothesis 1: Ontology of Assumptions.* Yes. Friedman treats them as *input devices* for a black box. Critics treat them as *descriptions of the gears* inside the box.
      *   *Hypothesis 2: Epistemic Good.* Yes. Prediction (instrumental success) vs. Explanation (causal understanding/structural validity).
      *   *Hypothesis 3: Verbal Equivocation.* Yes. "Theory" means different things. For Friedman, a theory is a prediction machine. For critics, a theory is a map of causal structure.

  4.  **Synthesize the Diagnosis:**
      *   It is *not* merely verbal. If it were just semantics, we could stipulate definitions and move on. But the definitions track deeper divergences in scientific aims.
      *   It is *not* purely substantive in the sense of a factual dispute (e.g., "Do firms maximize profit?"). Both sides might agree firms don't literally maximize profit mathematically. The dispute is about what we *require* of a scientific model given that fact.
      *   *Core Conflict:* It is a clash of **Epistemic Values** (Prediction vs. Understanding) masked as a dispute about **Semantic Categories** (What counts as an "assumption").
      *   *Hidden Formal Question:* Robustness. Under what conditions does a false premise yield a true conclusion *reliably*? (This touches on structural stability).

  5.  **Drafting the Argument (Iterative Process):**

