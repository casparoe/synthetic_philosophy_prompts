prompt: |-
  Ok so I'm taking this course on Buddhist ethics and we keep circling around whether Buddhist ethics is really just consequentialism with extra steps, and I'm trying to figure out where I actually land before I have to write the essay. So heres my current best attempt at my own view, and I want you to tell me if it even hangs together:

  - I'm broadly consequentialist about rightness: an action is right insofar as it tends to reduce suffering and move sentient beings toward liberation, and I think compassion is the whole point of it — the aim is the liberation of every sentient being.
  - I take the no-self thing seriously. There's no permanent substantial self; a person is more like a causal stream, and the borders between persons are conventional rather than ultimate.
  - But I also think karma and rebirth are real — what you intentionally do shapes your own future experience, including in future lives.
  - I think what gives an action its moral weight in Buddhism is the intention behind it (the cetanā), not whether it happens to turn out well.
  - I think the precepts — dont kill, dont lie, etc. — are meant to be exceptionless for ordinary practitioners. You don't get to break one just because you've decided it'll produce a better outcome.
  - At the same time, I think the bodhisattva's skill in means lets a genuinely advanced practitioner do something that looks like breaking a precept, when it clearly serves beings.

  So: is this a consistent package? Some of these feel like they're pulling against each other but I honestly cant tell which, and I don't want to just ditch whichever one is easiest to give up. Can you sort out which pairs are genuinely in tension and how bad each one is, which ones only look like they conflict but actually don't (I have a nagging feeling one of these is a non-issue and I'm overthinking it), and for the real tensions, what the cheapest fix would be and what I'd be losing? And then tell me which single revision would clean up the most at once.
