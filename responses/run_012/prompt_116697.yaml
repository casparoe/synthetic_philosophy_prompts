  **Executive Summary**
  This memo outlines three methodologies for effecting normative collapse on capital punishment in your jurisdiction. Historical data suggests moral progress is rarely linear and causal attribution remains slippery. Crofts & Vane does not guarantee ethical outcomes, only procedural adherence to proven vectors of change. Our partners remain divided on whether material conditions or social scripts drive history, but both agree reasoned argument is largely ornamental. The following retainers allow you to hedge your bets against historical indeterminacy.

  **Our Three Retainers**
  **The Discursive Compliance Package (£45,000):** This tier supplies the necessary rhetorical decoration for a moral shift. We provide op-eds, pamphlets, and a resident philosopher to articulate why the death penalty is irrational. Historically, arguments rarely convince opponents directly; rather, they provide cover for those already seeking to defect from the norm. It is cheap because it seldom works as a primary driver, but donors require visible reasoning to justify their largesse. We treat this as box-ticking for the intelligentsia. Partner Vane insists including this is vital for grant applications, even if he considers it functionally inert.

  **The Material Disincentive Package (£220,000):** Following the Williams thesis, this assumes norms vanish when they cease to be profitable. We will audit the supply chain for lethal injection compounds, lobby insurers to raise premiums for correctional facilities, and calculate the opportunity cost of prolonged appeals. If execution becomes economically burdensome compared to life imprisonment, the legislature will abolish it regardless of moral sentiment. Partner Vane argues this is the only engine that actually moves heavy machinery. We target the bottom line, leaving the morality to sort itself out once the ledger bleeds.

  **The Social Stigma Package (£450,000):** This is the Appiah play. We do not argue; we shame. We target the reputations of prosecutors and wardens, ensuring execution is viewed as vulgar rather than just. The goal is to make capital punishment something a 'respectable' state simply does not do, akin to duelling. Partner Crofts maintains that honour codes trump economics every time. This is the most expensive option because manipulating social status requires sustained cultural saturation. We will ensure no donor wants their name on a death chamber.

  **Precedents from the file**
  **Case 1807 (Atlantic Trade):** Initially billed as Material Disincentive (sugar profits falling), later retroactively adjusted to Social Stigma (Clapham Sect influence). Client satisfied, though historiography remains contested. We charged for both interpretations during the retention period. Invoice archives sealed.
  **Case 1840s (Duelling):** Pure Social Stigma. Gentlemen ceased killing each other not because it was illegal, but because it became something only bounders did. High success rate. Billing was straightforward as no economic interest was significantly harmed.
  **Case 1900s (Footbinding):** Hybrid model. Economic utility of labour shifted alongside honour scripts regarding marriageability. Causal weight unresolved. We submitted separate invoices for economic and honour interventions to cover all bases. Client paid both without query.

  **Risks and reputational exposure**
  The primary risk is retroactive embarrassment. If future historians definitively prove economic factors drove abolition while we billed for honour, your coalition may face scrutiny. Conversely, if we pursue economic leverage and change arrives via shame, our efficacy metrics will suffer. Norm persistence suggests the price was too low or the historical analogy flawed. We cannot insure against moral stagnation. Clients must accept causality is often only visible in reverse.

  **Recommendation and fee schedule**
  Given the internal disagreement regarding historical causality, we recommend the Bundled Approach. This allows us to pursue economic strangulation while simultaneously cultivating shame, with argumentative garnish for public consumption. If the norm collapses, we attribute success to the most expensive package delivered.
  **Retainer:** £715,000.
  **Success Fee:** 5% of state savings upon abolition.
  **Payment Terms:** Net 30. Non-refundable if morality fails to progress.

  **Author's note for the seminar**
  This piece satirises the debate between Eric Williams (*Capitalism and Slavery*), who argued economic interests drove abolition, and Kwame Appiah (*The Honour Code*), who argues shifts in shame and status are primary. The memo mirrors our seminar's conclusion: that distinguishing these drivers in hindsight is likely undecidable, yet we must act as if we know. The cynicism targets the commodification of moral philosophy itself. It also nods to the colleague who suggested we all go home.
