answer: |-
  1.  **Menu of Distinct Claims**
      1.  **The Teleological Claim:** *Thesis:* The proper goal of welfare is to enable recipients to exit the system and achieve economic independence. *Type:* Normative/Teleological. *Status:* Substantive. *Verdict:* Defensible (widely accepted across parties, though some argue for permanent support for some groups).
      2.  **The Causal Claim:** *Thesis:* Strict conditionality (sanctions, work-search) is an effective mechanism for causing recipients to exit welfare and find work. *Type:* Empirical/Behavioural. *Status:* Substantive. *Verdict:* Contested/Weakly Supported (evidence suggests sanctions increase job exits short-term but often into precarious work or non-employment; long-term efficacy is disputed).
      3.  **The Moral Reciprocity Claim:** *Thesis:* Receiving state aid creates a moral obligation to reciprocate through labour market compliance; aid without obligation is illegitimate. *Type:* Normative. *Status:* Substantive. *Verdict:* Defensible (within contractarian frameworks) but controversial (incompatible with unconditional human rights frameworks).
      4.  **The Dignitary Claim:** *Thesis:* Assistance is only a "hand up" if it preserves or enhances the recipient's agency, social status, and psychological security. *Type:* Normative/Conceptual. *Status:* Substantive. *Verdict:* Defensible (aligns with capability approaches and stigma reduction literature).
      5.  **The Stipulative Claim:** *Thesis:* By definition, "handout" means unconditional cash, and "hand up" means conditional support. *Type:* Conceptual. *Status:* Trivial (linguistically) but Substantive (politically). *Verdict:* False (usage is not fixed; the Charity witness successfully contests this definition).

  2.  **Analysis of Commission Uses**
      1.  **The Chair (Tighter Sanctions):** *Relies On:* The Moral Reciprocity Claim and the Causal Claim. *Verdict:* **Does Not Follow.** The Moral Claim justifies *some* obligation, but not necessarily *tighter* sanctions. The inference to *tighter* sanctions requires the Causal Claim (that tighter sanctions work better), which is empirically contested. The slogan alone cannot bridge the gap to "tighter."
      2.  **The Member (Job Guarantee):** *Relies On:* The Teleological Claim and the Dignitary Claim. *Verdict:* **Follows.** If the goal is independence (Teleological) and the state must provide the means to achieve agency (Dignitary), a state job guarantee fits the "hand up" definition better than passive benefits.
      3.  **The Charity (Unconditional Cash):** *Relies On:* The Dignitary Claim. *Verdict:* **Follows.** They redefine "handout" as stigmatizing/destabilizing and "hand up" as providing the security base required for agency. This is a defensible reading of Claim 4, even if it contradicts Claim 5.

  3.  **Sociological and Philosophical Postscript**
      1.  **Most Common Meaning:** When repeated in public discourse, most speakers intend the **Moral Reciprocity Claim** (Claim 3), often implicitly bundled with the **Causal Claim** (Claim 2). It is typically used to signal that the recipient *ought* to be doing more.
      2.  **Deserving/Undeserving Distinction:** The **Moral Reciprocity Claim** and the **Causal Claim** quietly presuppose the older distinction. They imply that those willing to comply are "deserving" of the hand up, while those who cannot or do not comply are "undeserving" and warrant withdrawal of support (sanctions).
      3.  **Survival Without the Distinction:** If the distinction between deserving and undeserving poor is rejected (e.g., in a universalist rights framework), the **Moral Reciprocity Claim** collapses. However, the **Teleological Claim** and the **Dignitary Claim** survive; one can aim for independence and dignity as goods in themselves without conditioning survival on moral worthiness. Consequently, no defensible reading licenses tighter sanctions *solely* on the basis of the slogan once the moral distinction is removed.
