      *   **Premise (5):** Rejection of (b): An extra entity leads to infinite regress (parts + unifier need a *new* unifier).
      *   **Premise (6):** Rejection of (c): If nothing unifies, it's just a heap.
      *   **Conclusion (7):** Nihilism about composites (nothing is genuinely one thing).
