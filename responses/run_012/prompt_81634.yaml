prompt: |-
  I build distrubted systems for a living -- replication, consensus, sharding, that whole world -- and I keep noticing that federalism arguments sound like arguments I have at work. So: take the federalism and subsidiarity debate across the US, Germany, Switzerland and the EU, and restate it as faithfully as you can in my vocabulary. Nodes with local state and partial views, leader election, quorums, split-brain, CAP, replication lag, locality and latency, single source of truth vs local-first, fault models (crash vs Byzantine), blast radius, config vs application code, protocol upgrades and backwards compat, forks, admin keys, SLOs, backpressure, common-mode failure, who is on call. Whatever fits.

  Concretely, things I mean: the US supremacy clause and preemption as a global invariant no local node may overwrite, the Tenth Amendment as residual competence; German administrative federalism, where the Länder are the ones actually executing federal law, and the Bundesrat as a chamber of state governments that vote as blocs; Swiss cantons executing federal law plus the double majority; EU conferral, subsidiarity, proportionality, national parliaments poking at draft directives, and the fact that the EU is the only one of the four with a written exit door (in the US and Germany leaving is basically off the table). Map each of those onto something in my world, and say where the mapping is honest and where I am fooling myself. If you want to also say which of the four systems is closest to which architecture -- global referee over shards, hierarchical with local execution, local-first with heavy client-side voting, federation of federations -- go ahead, but then tell me where that breaks.

  Then the residue report, which is the part I actually care about. What survives translation cleanly, what survives only with distortion, and what has no counterpart at all. My suspicion is that everything about legitimacy, obligation and the citizen's point of view falls through the hole, and that my vocabulary can only hear the efficiency arguments -- locals know their own situation, latency, fault isolation, avoiding common-mode failure -- while being deaf to the rest. If so, say it plainly. And say which way the failure cuts: is my vocabulary missing something real about authority, or is the federalism talk just muddier than it looks, sovereignty being a word that does no work once you ask who actually holds the admin keys? Also flag anything in my vocabulary with no home over there, so I know which direction the leak runs.

  No citations, no reading list, I am not going to read any of it. I want the translation and the holes.
