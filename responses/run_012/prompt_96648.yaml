  **Final Exam: Mental Representation (25 Marks, 90 Minutes)**

  Consider the glimmerfish. It survives by snapping at small, bright, drifting objects. In native waters, these are almost always edible plankton. The snapping mechanism is triggered by a simple detector whose firing is caused by moving highlights and which in turn causes the snap. This arrangement keeps the fish fed. However, the detector fires at sunlight glinting off the surface and at scraps of plastic, which the fish cannot digest.

  Write an essay addressing the following four tasks:
  1.  Assign a specific content to the detector state on strictly teleosemantic grounds and defend it.
  2.  Demonstrate how at least two standard disambiguating strategies (e.g., maximum specificity, distal-most, consumer-need, or survival explanation) diverge on this case rather than converging.
  3.  Analyze the plastic-snapping: does the fish misrepresent plastic as food, or represent it accurately as a bright thing? Explain why this matters for teleosemantics.
  4.  Argue whether this divergence shows the theory fails to naturalize content or merely fails to settle it, explaining why this distinction is substantive. Conclude with the most defensible concession a teleosemanticist must make to retain the programme.

  **Constraints:** You may not appeal to intuitive claims about what the fish 'really' represents, nor argue that teleosemantics is the 'most naturalistic option available.' Answers relying on these moves will fail.

  ***

  **Model Answer**

  On strict teleosemantic grounds, the detector state represents *plankton*. This assignment relies on the consumer system: the snap's proper function is feeding, not merely motor discharge. The detector's content is fixed by what the consumer needs to achieve its selected effect. However, disambiguating strategies diverge sharply here. The 'distal-most' strategy identifies content as *plankton*, citing the historical cause of selection. Conversely, the 'proximal stimulus' strategy identifies content as *bright moving spot*, citing the reliable nomological correlate actually triggering the detector. These come apart because the selected effect (feeding) relies on a correlation (brightness) that is imperfectly linked to the distal object (plankton). The survival explanation cites feeding, but the mechanism tracks brightness. Consequently, the 'consumer-need' reading supports *plankton*, while 'maximum specificity' supports *bright spot*.

  Regarding plastic, if content is *plankton*, snapping at plastic is misrepresentation (function failure). If content is *bright spot*, it is accurate representation but imprudent action. Teleosemantics requires misrepresentation to explain error normatively; if all snaps are accurate responses to brightness, normativity collapses into mere causal failure. Thus, the theory needs the distal reading to sustain misrepresentation. Without misrepresentation, teleosemantics cannot distinguish error from bad luck, undermining its claim to naturalize intentionality. The plastic case is the crucible: if the fish represents plastic accurately, teleosemantics loses its grip on error.

  Does this divergence fail to naturalize or merely fail to settle? It fails to settle. Naturalization requires content to supervene on physical/functional facts without magic. Teleosemantics achieves this: the content is fixed by selection history, even if our epistemic access to which historical fact fixes it is ambiguous. Treating this as a failure to naturalize conflates metaphysical determination with epistemic decidability. The distinction matters because abandoning naturalization invites dualism, whereas accepting indeterminacy acknowledges biological vagueness. If the facts fix the content, but the facts are complex/disjunctive, the content is determinate ontologically but indeterminate pragmatically. To claim failure to naturalize is to demand precision biology does not provide; to claim failure to settle is to admit our theories are coarser than nature.

  The most defensible concession is accepting that content is partially indeterminate relative to specific behavioral contexts. A teleosemanticist must concede that 'content' is not an atomic scalar but a vector of functions (detection vs. consumption). Retaining the programme requires abandoning the demand for unique content assignments in cases of evolutionary mismatch, acknowledging that biological systems optimize for survival, not semantic precision. This concedes semantic precision to save naturalistic grounding. To insist on unique content is to demand more from biology than selection provides. The concession preserves naturalism by aligning semantic theory with biological reality: functions are robust, but contents derived from them inherit the vagueness of evolutionary history. We save the theory by lowering our expectations of determinacy.

  ***

  **Marking Scheme**

  1.  **Teleosemantic Content Assignment (5 marks):** Must cite proper function/consumer system to justify content.
      *   *Typical Error:* Reciting 'proper function' without applying it to the glimmerfish's specific consumer system.
  2.  **Strategy Divergence (5 marks):** Must show two strategies yielding different contents (e.g., distal vs. proximal).
      *   *Typical Error:* Asserting strategies converge without demonstrating the conflict on the specific case.
  3.  **Misrepresentation Analysis (5 marks):** Must link plastic snapping to function failure vs. accurate trigger.
      *   *Typical Error:* Ignoring plastic or claiming it proves the theory false without analyzing misrepresentation.
  4.  **Naturalize vs. Settle (5 marks):** Must distinguish metaphysical fixing from epistemic precision.
      *   *Typical Error:* Dismissing the distinction as semantic pedantry rather than metaphysical vs. epistemic.
  5.  **Defensible Concession (5 marks):** Must propose a theoretical adjustment, not abandonment.
      *   *Typical Error:* Abandoning teleosemantics entirely rather than proposing a concession to save it.
