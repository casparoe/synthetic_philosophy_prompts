      *   *Memo needs to say:* We censure her (price paid). We keep her (shared burden). We admit we benefited (no clean consciences).

  6.  **Writing - Iteration 1 (Mental Check):**
      *   Is it too long? Keep it tight.
      *   Is the recommendation clear? Yes.
