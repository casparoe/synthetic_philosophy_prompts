      *   **The Situation:** Briefly recap (no need to rehash facts everyone knows, just the ethical core).
      *   **The "Dirty Hands" Argument:** Address the Dad/VC conflict. Acknowledge the lie worked. Acknowledge the danger of punishing necessary evil too harshly.
      *   **Why "Say Nothing" fails:** Credibility is gone Friday.
      *   **Why "Ethics Commission" fails:** Punishes the kids (roof) for the adult's lie.
      *   **Why "Resignation" alone fails:** Scapegoating. Lets the Board off the hook.
      *   **The Recommendation (Censure + Stay):** Explain why she stays. We share the burden.
      *   **The Vote:** Acknowledge the Student Rep's vote. I am complicit.
      *   **Closing:** The paradox remains.

  4.  **Refining the Tone:**

      *   Needs to be mature but acknowledge the User is a student ("I'm the kid in the room").
      *   No civics lectures.
      *   Direct, slightly philosophical but grounded.
      *   Address the "rationality" of the price. If the price is too high, no one lies. If the price is zero, everyone lies. The price must be *personal*, not *institutional*.

