  7.  **Final Polish:** Check the "Dirty Hands" logic. The VC worries that if we punish the noble liar, no one will lie nobility again. The counter is: We aren't punishing the *outcome*, we are punishing the *method*, but we aren't destroying the *outcome*. We keep the roof. We keep the bond. We just mark the record. This allows future leaders to know: You can save the roof, but your name gets mud on it. That's the balance.

      *Self-Correction on Recommendation:* If she stays on the board after lying about state accreditation, can she function? Maybe not. But the prompt asks me to help the student rep write *their* memo based on *their* instincts. Their instinct is "suspicious of resignation... using her as a trash can." So I must honor that instinct in the draft. I will recommend she stays, but is censured. It's the boldest move.

      *Wait, one nuance:* The prompt says "Accept the resignation she's offered." If I recommend rejecting it, that's a specific motion. I need to be precise.
