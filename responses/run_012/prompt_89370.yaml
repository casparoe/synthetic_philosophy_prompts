      *Wait, reading the prompt again:* "Accept the resignation she's offered." Usually means leaving the board.
      *Let's pivot:* The most honest "Dirty Hands" solution is that she must pay, *but* the Board must admit we let it happen/benefited.
      *Recommendation:* **Censure and Accept Resignation.** BUT, the Public Statement must explicitly state the Board accepts shared responsibility for the climate that made this seem necessary.
      *Actually, I think the strongest philosophical stand is:* **Censure and Reject Resignation.** If we let her leave, we treat her as a tool. If we keep her, censured, we acknowledge the complexity.
      *Okay, I'll draft the recommendation as: **Censure, Public Statement, and Reject Resignation.** This directly addresses the "trash can" fear.*

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
