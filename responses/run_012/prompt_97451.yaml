      *   User sees the State as a Service Provider. Trust is the expectation of service delivery (Confidence/Reliance). Reasonableness = Accuracy of prediction + Efficiency.
      *   Anders sees the State as a Power Holder. Trust is the withholding of blind faith to ensure accountability (Vigilance). Reasonableness = Prudence against risk.
      *   This incorporates the "Three-place relation" (User: State -> Services; Anders: Citizen -> Power Monitoring).
      *   This incorporates "Trust vs. Confidence" (User relies on the machine; Anders watches the operator).
