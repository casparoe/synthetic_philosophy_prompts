      *   *Commitment:* Select the "Purpose of Civic Trust" (Teleological) diagnosis, heavily informed by the "Object of Trust" and "Trust vs. Confidence" distinctions.
      *   *Why this one?* It explains why facts didn't matter. Facts about efficiency don't answer questions about safety/liberty. Facts about corruption don't answer questions about civic virtue.
      *   *Applying the Concepts:*
          *   *Three-place:* User: I trust [Agency] to [deliver healthcare]. Anders: I trust [My Vigilance] to [check Agency].
          *   *Confidence vs. Trust:* User treats gov like a vending machine (Confidence). Anders treats gov like a potentially dangerous agent requiring moral engagement (Trust/Vigilance).
          *   *Disposition vs. Strategy:* User's trust is strategic (earned). Anders' suspicion is dispositional (default).
          *   *Deference vs. Critical:* Anders sees high trust as deference. User sees it as calibration.
          *   *Object of Trust:* Anders trusts the *system of distrust*.
      *   *Progress:* What now?
