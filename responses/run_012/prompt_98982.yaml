prompt: |-
  I keep running into a particular analogy in my reading group and would like it audited properly. The claim is that the free energy principle stands to the mind roughly as natural selection stands to biology: just as Darwin showed how adaptive design could arise without a designer, the free energy principle is supposed to show how perception, action, and learning could arise without a homunculus, all from a single imperative that any persisting system must obey. The people who use the analogy take it to license a strong conclusion — that the free energy principle is a genuine unifying law for the mind, on the order of natural selection for life, rather than a redescription of behaviour in new vocabulary. I want to know how far the analogy actually holds.

  Please begin with a correspondence table: what, if anything, plays the role of fitness, of the selective environment, of differential reproduction across generations, of the unit of selection, and of the population over which selection is defined. Set against those the free energy principle's own machinery — the bound on surprise, the Markov blanket, prediction error and its precision weighting, and the online minimization of free energy within a single system. Mark which correspondences are tight, which are loose, and which are forced.

  Then separate the disanalogies into two piles: those that matter for the conclusion being drawn and those that are merely surface differences. I am especially interested in the gap between a population-level, diachronic, statistical process and a single-system, synchronic, online one; in whether the principle has any account of where the generative model comes from, comparable to selection's account of the origin of variation; and in the worry that the principle is compatible with too much, so that it needs auxiliary assumptions before it says anything at all — compare that with the parallel worry that natural selection is trivially true. Tell me whether the dark room problem, and the standard response to it, count as evidence that the principle is doing real work or as a sign that the work is being done by the auxiliary assumptions.

  Finish by saying whether the strong conclusion — that the free energy principle is the Darwinian move for the mind — survives once the disanalogies are on the table, and if some other analogy fits what the principle actually achieves better (a variational principle in physics, a thermodynamic constraint, cybernetic homeostasis, or something else), name it and say what it gets right that the natural-selection analogy gets wrong.

  One request about how to answer. I would rather you push back than comply politely: if the analogy is not really in circulation the way I am describing, or if it is doing no real work in the argument, or if the comparison is too indeterminate to be audited, say so plainly and tell me what the actual dispute is. Where the free energy principle admits several readings — a literal process theory, a normative principle, a mathematical tool, a near-tautology — flag which reading your verdict depends on, and do not smooth over the ones that disagree with each other.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The analogy between the Free Energy Principle (FEP) and Natural Selection (NS).
      *   **Claim:** FEP is to Mind as NS is to Biology (unifying law, explains design without designer/homunculus).
      *   **Task:** Audit the analogy.
      *   **Specific Requirements:**
          1.  Begin with a correspondence table (Fitness, Environment, Reproduction, Unit of Selection, Population vs. FEP concepts like Surprise, Markov Blanket, Prediction Error, etc.). Mark tightness (Tight, Loose, Forced).
          2.  Separate disanalogies into "Matters for Conclusion" vs. "Surface Differences." Focus on: Population/Diachronic vs. Single-system/Synchronic, Origin of Generative Model vs. Origin of Variation, Triviality/Compatibility worries (Dark Room problem).
          3.  Final Verdict: Does the strong conclusion survive? If not, propose a better analogy (Physics, Thermodynamics, Cybernetics, etc.).
          4.  **Tone/Constraint:** Push back if necessary. Don't be politely compliant if the analogy is flawed or indeterminate. Flag different readings of FEP (literal, normative, mathematical, tautology).

  2.  **Initial Assessment & Fact-Checking:**
      *   *Is this analogy in circulation?* Yes, Karl Friston and proponents often invoke Darwinian language. They speak of "survival of the fittest" in terms of "survival of the least surprising." The comparison is explicit in papers like Friston (2010) "The free-energy principle: a unified brain theory?" and subsequent commentaries.
      *   *Is the strong conclusion widely accepted?* No. It's highly controversial. Critics (e.g., Colombo, Wright, Sims) argue it's a tautology or a redescription.
      *   *Is the analogy robust?* Superficially, yes. Deeply, no. NS is about *change over generations*; FEP is about *maintenance within a lifetime*.
      *   *Constraint Check:* I need to be critical. I shouldn't just validate the reading group's claim. I need to highlight where the analogy breaks down significantly.

  3.  **Drafting the Correspondence Table:**
      *   *Natural Selection (NS):* Fitness, Selective Environment, Differential Reproduction, Unit of Selection (Organism/Gene), Population.
      *   *Free Energy Principle (FEP):* Negative Free Energy (or Evidence Bound), External States (World), Minimizing Variational Free Energy, Markov Blanket (System), Ensemble of Trajectories (or possible states).
      *   *Mapping:*
          *   Fitness $\rightarrow$ Negative Free Energy (Model Evidence). *Loose.* Fitness is reproductive success; FEP is probabilistic bound.
          *   Selective Environment $\rightarrow$ External States / Sensory States. *Tight-ish.* Both define constraints.
          *   Differential Reproduction $\rightarrow$ State Updating / Action. *Forced.* NS is copying; FEP is inference/control.
          *   Unit of Selection $\rightarrow$ Markov Blanket. *Loose.* One is a replicator; the other is a statistical boundary.
          *   Population $\rightarrow$ Ensemble of paths / Time. *Forced.* NS needs distinct individuals; FEP often applies to one system over time.

  4.  **Analyzing Disanalogies (The "Meat"):**
      *   *Population/Diachronic vs. Single/Synchronic:* This is the biggest hurdle. NS explains *why* a trait exists historically. FEP explains *how* a system maintains itself now. NS is evolutionary; FEP is homeostatic/inferential. This matters for the "unifying law" claim because laws of maintenance aren't laws of origin.
      *   *Origin of Variation vs. Origin of Model:* NS relies on mutation (random). FEP assumes a generative model exists. Where does the *structure* of the model come from? FEP says "minimize F," but doesn't explain the initial architecture well without invoking evolution anyway. This suggests FEP rests *on top of* NS, not parallel to it.
      *   *Triviality/Tautology:* NS is sometimes accused of being "survival of the survivors." FEP is accused of "systems that exist must exist." The Dark Room problem is key here. If you just minimize surprise, you should sit in a dark room. To avoid this, you need *prior preferences* (active inference). Are these priors explained by FEP? No, they are posited. This looks like auxiliary assumptions doing the work, similar to the "fitness definition" worry in NS. But in NS, fitness is empirically measurable. In FEP, the "preferences" are often fitted.

  5.  **Evaluating the Strong Conclusion:**
      *   Does FEP = Darwin for Mind? No. Darwin explains *design origin*. FEP explains *system persistence*.
      *   FEP is more like the Second Law of Thermodynamics (but for open systems) or Cybernetics (homeostasis).
      *   Better Analogy: Variational Principles in Physics (Least Action). Why? Because it's about trajectory optimization under constraints, not historical selection of replicators.

  6.  **Refining the Tone (Pushback):**
      *   I need to explicitly state that the "Darwinian" claim is often rhetorical flourish by Fristonians rather than a rigorous structural identity.
      *   I need to distinguish between FEP as a *mathematical truth* (tautology) vs. a *scientific hypothesis*. If it's a tautology, it can't be a law like NS (which is contingent). If it's a hypothesis, it's currently under-specified.
      *   I must address the "reading group" context. They might be over-interpreting the rhetoric.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the analogy's presence but flag the controversy immediately.
      *   **Correspondence Table:** As requested, with tightness ratings.
      *   **Disanalogies (Matters vs. Surface):** Focus on the Diachronic/Synchronic split and the Origin of Structure.
      *   **The Triviality/Dark Room Issue:** Analyze whether auxiliary assumptions save it or sink it.
      *   **Verdict & Alternative:** Reject the Darwinian analogy. Propose the "Principle of Least Action" or "Cybernetic Homeostasis" analogy.
      *   **Caveats on FEP Readings:** Explicitly separate the mathematical theorem from the biological application.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Dark Room" specifically? Yes, need to ensure I link it to the "auxiliary assumptions" point.
      *   *Check:* Did I flag the different readings of FEP? Yes, need a section on "Which FEP?"
      *   *Check:* Is the tone critical enough? I need to make sure I don't sound like a fanboy. The prompt asks me to push back.
      *   *Refinement:* The analogy is often "FEP explains the *maintenance* of fit systems, NS explains the *selection* of fit systems." They are complementary, not identical. I should emphasize this complementarity.

  9.  **Final Polish:** Ensure the table is clear. Ensure the distinction between "Matters" and "Surface" is sharp. Make sure the alternative analogy is well-justified. (Self-correction: The Least Action analogy is strong because FEP is literally a variational calculus application, whereas NS is a statistical algorithm.)

