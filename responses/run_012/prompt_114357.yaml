answer: |-
  **1. The Ontology of "Careers"**
  **Question:** You say the statue and the lump are one object with two careers, and a career isn't an object and it isn't a property. In geology, if I say "this is a rock" and "this is a specimen," I'm talking about the same hunk of matter under two descriptions. If a career isn't a description, and it isn't a thing, what *kind* of entity is it? Where does it live?
  **Anticipated Move:** She will likely say careers are "modes of existence" or "ways an object persists" that are real but not concrete particulars.
  **Follow-up:** If they're real but not concrete particulars, are they mind-independent? If I never cared about art or metallurgy, would the careers still be there waiting, or did we bring them into existence by caring?

  **2. The Proliferation Problem**
  **Question:** Let's say I accept there are two careers: one as a lump, one as a statue. But I could also look at that object as a "doorstop," or "collateral for a loan," or "a potential weapon." Do each of those interests generate a new career?
  **Anticipated Move:** She will likely try to draw a line, arguing that only "substantial" sortals generate careers, not functional or temporary ones.
  **Follow-up:** Who draws that line? If the line is drawn by what we consider "substantial," haven't you just pushed the mind-dependence back one step? If the careers depend on our judgment of what's substantial, how is this view different from saying "it's all just how we describe it"?

  **3. The Counting Problem**
  **Question:** I walk into your studio. I ask, "How many things are on the pedestal?" If your view is right, the strict answer is "one." But if I say "two," you don't want to call me a liar. So, what am I doing when I count "two"? Am I counting careers?
  **Anticipated Move:** She will likely say counting is context-sensitive; in a philosophical context, "one" is correct, in an art context, "two" is acceptable shorthand for "one object with two careers."
  **Follow-up:** If counting is context-sensitive, then there is no fact of the matter about how many things exist independent of the context. Are you comfortable saying ontology is context-dependent? Because that sounds like you're saying reality changes based on the conversation we're having.

  **4. Grounding the Careers**
  **Question:** You get annoyed when people call this a verbal dispute. That implies there's a fact of the matter about the careers that isn't just about words. What grounds that fact? Is there something in the bronze itself that dictates where the lump-career ends and the statue-career begins?
  **Anticipated Move:** She will likely argue that the physical structure grounds the career, but the *identity conditions* are tied to the career type.
  **Follow-up:** But the physical structure is just atoms arranged lump-wise. If the atoms don't care whether they're art or metal, what physical feature marks the boundary? If there isn't one, aren't the boundaries of the career arbitrary?

  **5. Temporal Boundaries**
  **Question:** The lump of bronze existed before the sculptor touched it. The statue-career began when she finished shaping it. During that time before shaping, was the statue-career dormant, or did it not exist?
  **Anticipated Move:** She will likely say the statue-career did not exist yet; only the lump-career did.
  **Follow-up:** So the object gained a new career mid-existence. If the object is just one thing, how does it gain a new set of survival conditions without changing physically? Did the object itself change when the career started, or did we just start tracking it differently?

  **6. Legal Ownership**
  **Question:** I want to talk about the law, because that's where this gets expensive. I can own the statue without owning the raw clay—say, I commission it. If there is only one object, who owns it? Can I own the "statue-career" of the object while you own the "lump-career" of the very same thing?
  **Anticipated Move:** She will likely argue that ownership is a relation between a person and an object *under a description* or *career*.
  **Follow-up:** So ownership isn't a relation to the object *simpliciter*? If I sell you the statue but keep the clay, and then I melt it down, have I destroyed your property? If there's only one object, it seems I've destroyed the very thing you own.

  **7. Insurance and Liability**
  **Question:** Following on that: I insure the statue against artistic damage, but not the lump against melting. If a fire melts the bronze, the insurance pays out for the statue loss. If there's only one object, why does the payout depend on which career was interrupted?
  **Anticipated Move:** She will likely say the insurance contract specifies which career is being indemnified.
  **Follow-up:** But the loss is the destruction of the object. If the object is gone, both careers are over. If the insurance company pays for one career but not the other, aren't they paying for a *concept* rather than the *loss*? Does your view imply the law is systematically confused about what property is?

  **8. The Geology Analogy**
  **Question:** I told you I used to treat "rock" and "mineral specimen" as one thing under two descriptions. You hinted that works for geologists but fails for metaphysicians. Why? What's the difference between my rocks and your statue that makes my view "cheap" but yours robust?
  **Anticipated Move:** She will likely argue that modal properties (survival conditions) are real in the statue case in a way they aren't for rocks.
  **Follow-up:** But the rocks have modal properties too. A quartz specimen survives acid; a limestone rock doesn't. If I say "this rock wouldn't survive acid," am I making an incomplete claim about a career? If you say yes, then my geology view is fine. If you say no, you have to tell me why bronze is metaphysically different from quartz.

  **9. Truth Conditions for Modal Claims**
  **Question:** You say "The statue would not survive squashing" is incomplete. It needs to be "The statue-career would not survive squashing." But when I say the first one, I feel like I'm saying something true about the world, not just my tracking habits. What makes that sentence true if not the object itself?
  **Anticipated Move:** She will likely say the truth-maker is the object *plus* the career constraints.
  **Follow-up:** So the truth depends partly on the object and partly on our conceptual scheme? If the truth depends on our scheme, isn't the modal difference between the lump and the statue ultimately a difference in us, not in the garage?

  **10. Leibniz's Law and Contradiction**
  **Question:** Standard objection time. The lump has the property "can survive squashing." The statue has the property "cannot survive squashing." If they are one object, that object has contradictory properties. How do you avoid violating the law of non-contradiction without saying they are two things?
  **Anticipated Move:** She will likely say properties are had relative to careers, so there is no contradiction (Indexicalism or Relativism).
  **Follow-up:** If properties are only had relative to careers, does the object *itself* have any properties at all? If the object has no properties independent of a career, what work is the "object" doing? Why not just say there are only careers and no object?

  **11. Part Replacement (The Closing Shot)**
  **Question:** Last one. Suppose we swap out the bronze atoms one by one over a year. The lump-career survives; the atoms don't matter. Does the statue-career survive?
  **Anticipated Move:** She will likely say it depends on whether the *artistic form* is maintained, which is a fact about the career, not the matter.
  **Follow-up:** If the career survives the replacement, but the original matter is gone, in what sense is it the *same* object? If your answer is "it's the same career," then when does the career end? If I swap the parts and change the shape slightly, does the career end and a new one begin? If so, isn't that just a fancy way of saying the old object was destroyed and a new one created?
