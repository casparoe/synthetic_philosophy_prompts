prompt: |-
  I'm a software engineer with no formal background in philosophy, and I've somehow been drafted into running a monthly lunch-and-learn for my team — a mix of engineers, a couple of PMs, and one designer, none of whom have read any decision theory. Next month I've claimed the topic of satisficing and bounded rationality, and I'd like you to act as an expert in the philosophy and cognitive science of decision-making who is also a genuinely good teacher, and to design the session for me rather than deliver it. What I need is a teaching plan: the order in which the ideas must be introduced so that each step actually depends on the one before it, rather than a list of topics in a sensible-sounding sequence. Begin by thinking through, in a scratchpad you can share with me, what the load-bearing components really are and which of them cannot be said until something else is already in place — my own suspicion is that the whole thing collapses if you introduce the descriptive reading of satisficing and the normative/prescriptive reading in the wrong order, but tell me if that suspicion is misplaced.

  On the carrying example: my instinct is to build the entire session on a single concrete case, and the one I had in mind is a hiring decision — we interview candidates and make an offer to the first one who clears our bar, instead of interviewing everyone and ranking them. Evaluate that candidate seriously. Does it actually exhibit what has to be exhibited, or does it quietly smuggle in an optimization story (we can always say the bar itself was chosen to maximize something, and then haven't we just optimized with extra steps)? If it won't carry the weight, tell me what the example must have and must lack, and give me the one you'd use instead, concrete enough that I can put it on a single slide. Then map the misconceptions I should expect, in the order they will actually surface in the room, and tell me precisely where in the sequence to head each one off: I'm already expecting "satisficing just means settling for something mediocre," "bounded rationality is a polite word for being irrational," "this is really just optimization once you add a search cost, so there's nothing new here," and probably "it's a claim about individuals, not about firms or teams." For each, I want the moment in the plan where it needs to be defused, not a general rebuttal I can deliver at any point.

  Finish with one question I can put to the room at the end that would show whether the distinction actually landed rather than whether they can repeat my vocabulary, and tell me what I should deliberately leave out at this level and say out loud that I am leaving it out. Please don't hand me a reading list — nobody in the room is going to read anything.
