      *   The "Missing" insight: Causal claims are often **contrastive** and **interest-relative**. We don't just ask "What caused X?" we ask "What caused X *rather than Y*?" or "What caused X *that we can control*?"
      *   Also, the **Summing of Effects**: Did the water from the drain mix with the water from the pipe? If so, both contributed to the *level* of the flood, even if either would have breached the threshold.

  5.  **Refining the Output Structure:**
