  1. "Warm-up" — In your models, is hyperbolic discounting a bug in human hardware or a feature that's just maladaptive in modern environments?

  2. "The identity claim" — You say philosophers should hand over the keys because hyperbolic discounting explains weakness of will. But are you claiming akrasia is *identical* to present bias, or just that present bias is the primary causal mechanism behind it?
      *   **Follow-up:** If it's merely causal, then couldn't there be cases of present bias without akrasia, or akrasia without present bias? If you say no, aren't you just defining the phenomenon away rather than explaining it, and what work is the folk-psychological term "weakness of will" doing that your term isn't?

      — What pattern of choice would count against your model? If someone consistently chooses the long-term good despite a steep discount curve, do you revise the model or posit a hidden variable?
      *   **Follow-up:** If you posit a hidden variable like "willpower" to save the model from falsification, aren't you risking a just-so story where any behaviour can be explained after the fact by adjusting the parameters?

  3. "Where the phenomenon goes missing" — Let's look at the naive discounter. At the moment of choice, she prefers the immediate reward over the long-term goal. So she's acting on her current best judgement. Where is the "against better judgement" part required for akrasia?
      *   **Follow-up:** If you say her "better judgement" is just her past preference, aren't you changing the definition of akrasia from "acting against current judgement" to "acting against past judgement"? Because that's not weakness of will, that's just changing your mind.

      — Now consider the sophisticated discounter. She anticipates the bias and precommits, so she never faces the tempting choice and never acts against her judgement. Does your model imply that successful management of addiction eliminates the possibility of akrasia entirely?
      *   **Follow-up:** If she succeeds via precommitment, you call that rational planning. But if she fails because she didn't precommit, is the failure the akrasia, or is the akrasia the act itself? Because if it's the failure to precommit, that happened way before the drink or the procrastination.

      — So if neither the naive nor the sophisticated agent actually acts against their *current* evaluative ranking, are you admitting that "akrasia" as philosophers define it doesn't exist in your model, only preference inconsistency over time?
      *   **Follow-up:** If you insist it does exist, I need you to point to the specific node in your decision tree where the agent says "I prefer X all-things-considered" but chooses Y. If that node doesn't exist, haven't you explained away the phenomenon rather than explaining it?

  4. "Judgement and the felt struggle" — Hyperbolic discounting is a story about preference reversals across time. But akrasia is standardly synchronic—acting against your judgement *at the moment of action*. Are you punning on "judgement" to make these fit?
      *   **Follow-up:** If "judgement" is just the long-term preference function, then the agent never actually holds that judgement at the moment of action. So how can she violate it? It's like blaming me for not wanting broccoli yesterday when I want cake today.

      — What about the felt struggle? The gritted teeth, the effort of resistance. In your model, is that just the friction of competing discount curves, or is it epiphenomenal?
      *   **Follow-up:** If you reach for "willpower as a limited resource" to explain that struggle, how do you model that without begging the question? Because the literature on ego depletion is shaky, and if willpower is just another commodity to be discounted, haven't you just pushed the homunculus back one step?

  5. "What the philosophers get to keep" — Is there anything in the philosophical treatment of akrasia—maybe the normative dimension or the concept of agency—that your models should be taking on board, rather than the other way round?
      *   **Follow-up:** If you say no, then your model predicts choice but ignores agency. Does that mean your policy interventions are destined to treat people like puppets of their discount rates rather than agents who can be reasoned with?

  6. "Close" — One of my listeners works in addiction services. If the solution is always restructuring choice architecture, what hope does your model offer for clients who lack the autonomy or resources to install those commitment devices?
