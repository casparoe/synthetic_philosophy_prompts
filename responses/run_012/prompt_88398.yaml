  OK so I've gone down a rabbit hole about shared resources and I want an actual number out of you, not a lecture about how it depends.

  Quick background. My hometown sits over an aquifer. About 200 households with wells, plus a few bigger farms, and the water table has been dropping maybe two or three feet a year for as long as anyone's kept track. Everybody knows. Nobody wants to be the first to cut back. The two standard answers are sell the water rights to somebody who'll price it, or have the county cap each well, and both are politically dead here -- the first because people won't sell, the second because nobody wants a meter guy.

  So my friend Ravi, who is not an academic, just reads alot, floated a third thing and I want to know if he's onto something or just reinventing something that never works.

  The scheme: at the start of each year every household puts a bond into a pot, call it one month's water bill. Theres a sensor network on the wells that reports the collective level -- the whole valley's level, not who pumped what. If the year ends with the level at or above an agreed target, everyone gets their bond back. If it ends below, the whole pot is forfeited to an outside party, like it gets donated to the school district. Nobody is named. Nobody gets individually caught. The punishment is collective, automatic, and triggered by a physical measurement rather than by anybody snitching.

  Here's the ask. Give me your credence, a number between 0 and 1, that in a place like my valley a scheme with those features -- collective, anonymous, automatic, no individual monitoring -- is still in force and still working ten years out. Define working as: the water table is no worse than when it started, and the thing holding it together is the bond, not the county showing up with fines. Then decompose it. I want the sub-questions you think the number actually hangs on, a rough probability for each, one line on why, and how you're combining them. My own guesses at the pieces, for what it's worth: whether people are the kind of cooperators who cooperate when they think others will (I'd say that's high, .8), whether the thing survives one bad drought year that nobody caused (that's the one that scares me, maybe .4), whether a collective fine is really a deterrent or just a toll everybody pays and then ignores (I honestly don't know, .5), and whether any of this scales past a few hundred households (low, .3).

  Three more things. One: which of your terms are you least sure about, and which one moves the final number the most if you're wrong about it -- those aren't the same question and I want both. Two: what would actually move your number, like what would you want to see or find out that would push it up or down by more than .1. Three: my brother says this is naive and people always either game it or let it collapse, he's at about .15 that it lasts, I'm at about .55. Tell me where you think we actually disagree -- is it about human nature, about drought years breaking the thing, about whether collective punishment bites, or about scale -- and give your own number and say which of us you're closer to and why.

  And if your honest answer is that the number depends mostly on something I haven't told you, then say what that thing is and give me the number for the two or three most plausible versions of it instead of a fake single number.
