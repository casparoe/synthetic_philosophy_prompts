answer: |-
  1. The Oi framework maps conscription as an implicit tax on draftees equal to the wedge between their civilian market wage and military pay, allowing the state to capture labor revenue off-budget. In the Nordic-Swiss cases, this tax base shrinks as economies develop, theoretically raising the marginal cost of coercion relative to market hiring.

  2. The theory correctly predicts Sweden's 2010 abolition, where high opportunity costs and low perceived threat made the implicit tax inefficient compared to a professional force. This follows the economic logic that wealthy nations should minimize labor market distortions when security demands are low.

  3. The model fails to explain Sweden's 2017 reinstatement or Switzerland's 2013 rejection of abolition, since rising wealth should have permanently increased the implicit tax burden beyond political tolerance. Finland's continuous conscription despite high development levels further contradicts the prediction that economic growth necessitates professionalization.

  4. These anomalies suggest conscription functions less as a labor tax and more as a political commitment device that legitimizes the military through shared risk across classes. The Swiss penalty tax and Finnish broad coverage indicate the goal is social cohesion and deterrence signaling rather than minimizing fiscal labor costs.

  5. This does not refute the economic efficiency claim but limits its scope by showing political benefits can outweigh fiscal costs in armed neutral states. Settling evidence would require measuring whether conscript-based armies generate higher public trust or deterrence credibility than professional forces independent of expenditure levels.
