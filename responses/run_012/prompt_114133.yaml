  ### Brainstorming and Methodology Note

  **Candidate Common Ground:**
  Before drafting the substantive agreement, we identified several areas where our theoretical divergences converge in practice, particularly regarding the *Automated Decisions Accountability Act* (ADAA).
  1.  **The Authority of the Text:** Neither of us believes judges should ignore the enacted words. The purposivist does not seek to rewrite the statute based on abstract justice, and the textualist acknowledges that words convey purposes.
  2.  **The Hierarchy of Materials:** We agree that the enacted text (Sections 2 and 3) holds higher legal authority than the Preamble or the uncodified Drafting Note. We differ on *how much* weight the subordinate materials carry, but not on the hierarchy itself.
  3.  **Rejection of Free-wheeling Policy:** Neither of us believes the court should impose its own view of the best data-protection policy. The question is always what the legislature enacted, not what the judge prefers.
  4.  **Contextualism:** We agree that words are not read in a vacuum. Section 3's definition of "meaningful explanation" must be read in the context of the whole Act, though we disagree on whether "context" includes unenacted intent.

  **Strategy for Disagreements:**
  We recognized that some disputes are substantive (leading to different outcomes in the ADAA case) while others are methodological or verbal (disagreements about labels or the order of operations that may not always change the result). The table below distinguishes these. We have grounded every theoretical point in the specific tension between the ADAA's Section 2 (Purpose), Section 3 (Definition), and the Drafting Note (Trade Secrets).

  ***

  # JOINT STATEMENT ON STATUTORY INTERPRETATION
  **Regarding the *Automated Decisions Accountability Act***

  **Signed:**
  *The Textualist*
  *The Purposivist*

  ## I. AGREED CLAIMS

  We, the undersigned, having engaged in adversarial collaboration regarding the interpretation of the *Automated Decisions Accountability Act* (ADAA), affirm the following principles as a shared baseline for our legal analysis:

  1.  **The Primacy of Enacted Text:** The authoritative law is the text enacted by the legislature. In the ADAA, Sections 2 and 3 constitute the binding law. Neither purpose nor intent can justify ignoring clear statutory language. If Section 3 explicitly prohibits what Section 2 encourages, Section 3 controls.
  2.  **The Role of Purpose Clauses:** A statement of purpose (ADAA Section 2) is part of the statutory context. It is legitimate to use Section 2 to resolve ambiguity in Section 3. However, a purpose clause is not an independent grant of authority that expands the scope of operative provisions beyond their semantic reach.
  3.  **The Status of Extratextual Materials:** Materials not enacted into law (such as the ADAA Preamble or the uncodified Drafting Note regarding trade secrets) are subordinate to the text. They may be consulted to confirm a reading derived from the text, but they cannot contradict the enacted words.
  4.  **The Function of Canons:** Canons of construction (e.g., *expressio unius*, avoidance of absurdity) are heuristic tools reflecting assumptions about legislative drafting or constitutional values. They are not rigid rules that override textual evidence.
  5.  **Interpretation and Construction:** We acknowledge a distinction between discovering the semantic meaning of the text (interpretation) and determining the legal effect when that meaning is underdeterminate (construction). We agree that judges must not usurp the legislative function during the construction phase.

  ## II. TABLE OF REMAINING DISAGREEMENTS

  While we share the principles above, we diverge on how to apply them to the dispute between the Regulator (requiring model logic disclosure) and the Company (offering plain-language summaries). The following table isolates our precise theoretical and practical disagreements.

  | Point of Disagreement | Textualist Formulation | Purposivist Formulation | The Crux | Concrete ADAA Argument & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Relationship Between Purpose (Sec. 2) and Definition (Sec. 3)** | Section 3 provides the exclusive definition of "meaningful explanation." Section 2 is aspirational. If Section 3 says "description of factors," adding "logic disclosure" violates the text, even if it helps achieve Section 2's goal. | Section 2 animates Section 3. The term "meaningful" in Section 3 is a placeholder that must be filled by the purpose in Section 2 ("understand and contest"). If a summary prevents contesting, it is not "meaningful." | **Constraint vs. Constitution:** Does purpose *constrain* the definition (Textualist) or *constitute* the definition (Purposivist)? | **Argument:** Regulator argues logic is needed to "contest." Company argues text only asks for "factors."<br>**Textualist Prediction:** Ruling for **Company**. The text specifies "factors," not "algorithms." Expanding to logic rewrites Section 3.<br>**Purposivist Prediction:** Ruling for **Regulator**. A summary of factors without logic makes the right to "contest" in Section 2 illusory. |
  | **2. Legal Weight of the Uncodified Drafting Note** | The Note is not law. It may show that the legislature *thought* trade secrets were safe, but it cannot limit the text if Section 3 otherwise requires disclosure. It is merely evidence of expectation, not limitation. | The Note is evidence of legislative intent regarding the scope of the Act. It signals a legislative bargain: accountability in exchange for IP protection. It should limit the purposive reading of Section 2. | **Intent as Law:** Is unenacted intent a binding limit on statutory scope, or merely historical context? | **Argument:** Company cites Note to block logic disclosure. Regulator says Note is irrelevant.<br>**Textualist Prediction:** The Note is **irrelevant** to the legal outcome, though it supports the Company's textual reading. The text wins alone.<br>**Purposivist Prediction:** The Note is **decisive** if the purposive reading threatens IP. It balances the Section 2 purpose, potentially favoring a middle ground. |
  | **3. Interpretation vs. Construction (Verbal vs. Substantive)** | **Substantive.** Interpretation ends when semantic meaning is found. If "description of factors" is clear, we stop. If ambiguous, *then* we construct a rule using canons. Purpose is a tool of construction, not interpretation. | **Partially Verbal.** We call it "interpretation" when we use purpose to find meaning. The distinction is merely labeling the order of operations. However, it matters because the Textualist excludes purpose too early. | **Order of Operations:** At what stage does "purpose" enter the analysis? Is it part of *meaning* or a *tie-breaker*? | **Argument:** Textualist says "factors" is clear (Interpretation done). Purposivist says "meaningful" is vague (Construction needed).<br>**Textualist Prediction:** Dispute is **semantic**. "Factors" != "Logic."<br>**Purposivist Prediction:** Dispute is **functional**. Does this explanation allow a contest? <br>**Note:** We agree this is *partially verbal*, but the timing affects the outcome. |
  | **4. The "Absurdity" Threshold** | A result is only absurd if it is linguistically impossible or contradicts other parts of the statute. A policy outcome that is "unwise" or "less effective" is not absurd. | A result is absurd if it frustrates the core objective of the statute. If the Act creates a right to contest but the interpretation makes contesting impossible, that is absurd. | **Definition of Absurdity:** Is absurdity a linguistic failure or a functional failure? | **Argument:** Regulator says denying logic makes the Act useless (Absurd). Company says forcing logic disclosure breaks the market (Absurd).<br>**Textualist Prediction:** Neither outcome is absurd. The legislature may have chosen a weak law. Court must apply it as written.<br>**Purposivist Prediction:** Denying logic is absurd relative to Section 2. The court must adjust the meaning to avoid functional nullity. |

  ## III. CONCLUSION ON THE ADAA DISPUTE

  **Where We Agree:**
  We agree that the Court must not simply impose its own preference for data privacy. We agree that the Drafting Note regarding trade secrets cannot override Section 3 if Section 3 clearly mandates disclosure. We agree that Section 2 cannot create a requirement that Section 3 explicitly forbids.

  **Where We Diverge:**
  Our disagreement ultimately rests on whether the phrase "description of the principal factors and the role they played" (Section 3) is semantically capacious enough to include "decision logic" when read in light of the goal to "contest" (Section 2).

  *   **The Textualist** concludes that "factors" refers to inputs (e.g., credit score, income), while "logic" refers to the processing weights. Since the text distinguishes these in common parlance, the Company prevails.
  *   **The Purposivist** concludes that "role they played" implies a causal account of the decision. Without the logic, the "role" is unintelligible. Therefore, the Regulator prevails, subject to the trade-secret limitation in the Drafting Note.

  We sign this statement to demonstrate that rigorous disagreement is compatible with shared fidelity to the legislative institution.

  ***

