      *   *Expansion:* "You ask me to judge the act by its fruit in this garden. I must judge the seed by the forest it could have grown." "The policy is chosen before you know which branch of the world you will occupy."
      *   *Refining the tone:* Ensure it doesn't sound like a robot, but a wise aunt who sees reality differently.

