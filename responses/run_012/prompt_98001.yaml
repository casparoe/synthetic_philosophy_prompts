  1. "The Letter"

  Dear Miss Everleigh,

  My partner and I wish to build a life together, but trust is fragile. He proposes we sign a contract: if either of us falters in our duties, the other is bound to exact a costly penalty—not out of spite, but to uphold the agreement. Specifically, I would be bound to sacrifice my own career prospects precisely in the instance where he fails to provide. It seems unfair to suffer for his mistake, yet he insists this binds us tighter.

  Additionally, a man approached me on the street. He claimed to have flipped a coin; had it landed heads, he would have given me $10,000. It landed tails. He now demands $100, saying I owe it because had I been the sort of person who pays, he would have flipped heads. He warned that "others like him" watch how I answer. I have the $100, but paying for a loss I already suffered feels mad. Should I sign my partner's contract, and must I pay the stranger?

  I feel torn between self-preservation and this strange logic. It seems I am being asked to pay for realities that do not exist.

  Sincerely, Bound in Boston

  2. "The Reply"

