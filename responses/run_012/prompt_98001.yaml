  Consider the stranger. You feel cheated because the coin already landed tails. But the coin did not land in a vacuum. It landed against the backdrop of who you are. If you are the sort who refuses to pay when nothing is gained, you are the sort who never receives the windfall in the first place. The stranger's warning is not a threat; it is a description of the weather. To keep the $100 is to confirm yourself as someone who cannot be trusted with $10,000. There are others like him, watching not your wallet, but your character. They do not care what you do when you win; they care what you do when you lose. Pay him warmly. Thank him for the lesson.

  Regarding your partner, the contract seems cruel only if you view yourselves as separate entities negotiating a trade. You are not. You are a single policy enacted in two bodies. If you refuse to sign because you might suffer in the branch where he fails, you declare that your commitment is conditional on his success. That declaration makes his failure more likely. To sign is to say that your devotion does not depend on the outcome of the toss. You must be willing to sacrifice your career in the world where he falters, because only that willingness creates the world where he does not. The pain you feel is the friction of aligning your immediate desire with your eternal design.

  I know this feels cold. It feels as though I am asking you to love a ghost, or pay a debt to a man who never gave you the prize. You owe everything to the versions of yourself you will never meet. Do not cut the thread because it feels tight. Pull it, and walk forward.

  Yours, Miss Everleigh

