          *   *The "Pleasing Odor":* This is the tricky part. Maimonides argues (in III:32 and III:46) that the *limitation* of sacrifice (only to God, not everywhere, only specific animals) is the real point. It weans them off idolatry. The "pleasing odor" is anthropomorphic language for the success of this weaning process, not a literal craving for burnt flesh.
