answer: |-
  Here is a decision tree designed for your reading group. It avoids the worn-out "bald man" and "heap" examples, using instead the materials of your trade: manuscripts, authorship, and representation. The questions are phrased to elicit intuitions rather than theoretical knowledge. Following the tree, I have provided the key to the leaves, an analysis of the "empty" branches, and a verdict on your specific distinction.

  ### The Decision Tree: The Case of the Fifty-Draft Novel

  **Root Premise:** Everyone agrees there are borderline cases. Imagine you have written a novel. You revise it repeatedly. Draft 1 is clearly *your novel*. Draft 50 is clearly a *different work*. Draft 25 is borderline.

  **Branch 1: The Location of the Blur**
  When you look at Draft 25, is the uncertainty caused by the physical reality of the text (the ink, the pixels, the neural states of the author) being indeterminate, or is the text physically precise but our *concept* of "same novel" being indeterminate?
  *   **A.** The reality itself is fuzzy. → *Go to Leaf 1.*
  *   **B.** The reality is precise; our rules are fuzzy. → *Go to Branch 2.*

  **Branch 2: The Hidden Line**
  In the borderline zone (Draft 25), is there a specific, single number of edits (e.g., exactly 1,432 changes) where the work *actually* became a new novel, even if no human could ever calculate or know that number?
  *   **A.** Yes, there is a fact of the matter, it is just unknowable. → *Go to Leaf 2.*
  *   **B.** No, there is no single fact of the matter until we decide. → *Go to Branch 3.*

  **Branch 3: Discovery vs. Invention (Your Distinction)**
  If your publishing house voted today to set a strict rule for where the line lies, would the voters feel they were **discovering** a boundary that was already latent in the language (like finding a buried wire), or **inventing** a new boundary that did not exist before (like drawing a property line on empty land)?
  *   **A.** Discovering (Latent Stipulation). → *Go to Leaf 2 (Re-evaluated).*
  *   **B.** Inventing (Fresh Act). → *Go to Branch 4.*
      *(Note: If a reader answers "No Fact" in Branch 2 but "Discovering" here, they are likely a soft Epistemicist; route them to Leaf 2.)*

  **Branch 4: The Truth Value**
  Take the statement: "Draft 25 is the original novel." Before any vote is held, is this statement strictly true, strictly false, neither, or both?
  *   **A.** Neither True nor False (It has a truth-value gap). → *Go to Leaf 3.*
  *   **B.** Both True and False (It has a truth-value glut). → *Go to Leaf 4.*
  *   **C.** Partially True (It is 50% true, or 0.5 on a scale). → *Go to Leaf 5.*
  *   **D.** It depends on who is asking. → *Go to Branch 5.*

  **Branch 5: The Shifting Standard**
  If the truth depends on who is asking, does the boundary of "same novel" shift *during* the conversation as the stakes change (e.g., stricter when discussing royalties, looser when discussing literary influence)?
  *   **A.** Yes, the boundary moves with the conversational score. → *Go to Leaf 6.*
  *   **B.** No, the boundary is fixed by the context, it doesn't move dynamically. → *Go to Leaf 7.*

  ***

  ### The Leaves

  **Leaf 1: Ontic Indeterminacy**
  *   **Commitment:** Vagueness is a feature of the world, not just our description of it.
  *   **Awkward Consequence:** You must accept that quantum-style indeterminacy applies to macroscopic objects like manuscripts and neural grafts.

  **Leaf 2: Epistemicism**
  *   **Commitment:** There is a sharp boundary fixed by usage, but it is permanently unknowable to humans.
  *   **Awkward Consequence:** There is a fact of the matter about whether your graft-recipient signed the contract, even if every lawyer and scientist in the world agrees it is impossible to tell.

  **Leaf 3: Supervaluationism**
  *   **Commitment:** A statement is true only if it is true on all acceptable ways of making the terms precise; borderline cases lack a truth value.
  *   **Awkward Consequence:** The Law of Excluded Middle fails; it is not the case that "either Draft 25 is the original or it isn't."

  **Leaf 4: Subvaluationism**
  *   **Commitment:** A statement is true if it is true on at least one acceptable precisification; borderline cases can be contradictory.
  *   **Awkward Consequence:** True contradictions exist; the manuscript is simultaneously the original work and a new work.

  **Leaf 5: Degree Theory (Fuzzy Logic)**
  *   **Commitment:** Truth is not binary but comes in degrees from 0 to 1.
  *   **Awkward Consequence:** You must accept that "true" behaves like "tall," allowing for comparisons like "more true than."

  **Leaf 6: Contextualism**
  *   **Commitment:** The extension of vague terms shifts dynamically depending on the conversational context and stakes.
  *   **Awkward Consequence:** You cannot state the theory of vagueness without shifting the context yourself, potentially making the theory self-undermining.

  **Leaf 7: Deflationism**
  *   **Commitment:** The puzzle arises from a false picture of how meaning works; there is no deep phenomenon of "vagueness" to explain.
  *   **Awkward Consequence:** The entire year you spent writing your novel's central drama is based on a linguistic artifact rather than a metaphysical problem.

  ***

  ### Diagnostic Notes for the Moderator

  **Indistinguishable Leaves**
  The tree may struggle to separate **Leaf 3 (Supervaluationism)** and **Leaf 6 (Contextualism)**. Both views rely on the idea that boundaries are not fixed until a context or precisification is selected. In practice, a Supervaluationist's "admissible precisifications" often look exactly like a Contextualist's "conversational scores." If a reader lands on Branch 4 but hedges on Branch 5, they may occupy a hybrid space. Mark this as a zone of theoretical overlap rather than a firm division.

  **Unoccupied Combinations**
  1.  **Ontic Indeterminacy + Epistemicism:** This combination is incoherent. If the world itself is vague (Ontic), there cannot be a sharp, unknowable fact of the matter (Epistemic). The tree prevents this via Branch 1.
  2.  **Subvaluationism + Supervaluationism:** This combination is logically contradictory. One requires truth-value gaps (neither true nor false), the other requires truth-value gluts (both true and false). The tree prevents this via Branch 4.
  3.  **Deflationism + Ontic Indeterminacy:** This is unattractive. If vagueness is merely a linguistic artifact (Deflationism), it cannot be a feature of the physical world (Ontic). Readers who choose Leaf 1 but later claim the problem is "just language" should be redirected to Leaf 7.

  **Analysis of Your Distinction**
  You asked whether your distinction—between **Latent Stipulation** (Discovery) and **Fresh Invention** (Legislation)—tracks the Epistemicism/Supervaluationism line or cuts across it.

  It **tracks the Epistemic/Non-Epistemic divide** more than it separates Epistemicism from Supervaluationism specifically.
  *   **Epistemicists** almost invariably align with **Latent Stipulation**. They believe the boundary is fixed by causal/historical facts about usage; our job is to find it, not make it.
  *   **Supervaluationists, Contextualists, and Degree Theorists** all align with **Fresh Invention**. They agree that the boundary is not fully determined until we precisify, shift context, or assign a degree.

  Therefore, your distinction is an excellent tool for isolating **Epistemicism** from the rest of the field. However, it does not help you separate Supervaluationism from Contextualism, as both view the boundary as something we "draw" rather than "find." If your goal is to sort readers into the seven specific leaves, use this distinction early (Branch 3) to peel off the Epistemicists, then use the Truth Value and Context questions to sort the remaining "Invention" crowd.
