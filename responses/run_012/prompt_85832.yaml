answer: |-
  **MEMORANDUM**

  **TO:** Institutional Animal Care and Use Committee (IACUC)
  **FROM:** [Your Name/Committee Member]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Interim Protections for Cephalopods and Decapods

  **Recommendation**
  I recommend the Committee immediately adopt **Interim Policy 2024-C**, extending humane-handling, housing, and humane-endpoint requirements to Cephalopoda (e.g., octopus, cuttlefish) and Decapod Crustacea (e.g., crab, crayfish). This policy shall remain in effect for 18 months, pending a formal review of emerging sentience literature. We should utilize our bylaws regarding interim measures to enact this now rather than delaying for a full regulatory overhaul.

  **Reasoning and Engagement with Dissenting Views**
  This recommendation navigates between two philosophical objections raised during preliminary discussion.

  The first objection posits that because no sharp biological line separates a crayfish from a thermostat, any boundary we draw is arbitrary; thus, we should either protect nothing or everything. While logically consistent regarding *metaphysical* sharpness, this conflates precision with arbitrariness. A thermostat regulates temperature via feedback loops; a cuttlefish possesses a centralized nervous system, nociceptors, and opioid receptors capable of integrating sensory input into avoidance learning. The line is not arbitrary; it is pragmatic, drawn at the threshold of neurobiological complexity where the probability of subjective experience becomes non-negligible. To treat the crayfish as a thermostat is to ignore functional evidence of nociception.

  The second objection argues that because evidence of suffering is uncertain, we should wait for definitive science before imposing research costs. This is the strongest consideration against my recommendation. Finite resources and regulatory burdens can stifle valid inquiry, and we risk imposing costs for a "guess." However, waiting for certainty creates an ethical asymmetry: if we regulate unnecessarily, we lose time and funding; if we wait unnecessarily, we risk facilitating suffering. Given the high stakes of potential pain, the Precautionary Principle dictates we minimize the risk of suffering even amidst uncertainty. The cost of humane handling is manageable; the cost of moral error is not.

  **Limits of This Position**
  I must be explicit about the fragility of this reasoning. My position relies on neuroanatomy as a proxy for subjective experience. If future comparative neuroscience demonstrates that complex behavior in decapods is driven entirely by decentralized ganglia without central integration (effectively making them biological robots), this policy would be scientifically unjustified. Conversely, if robust evidence emerges that insects (e.g., *Drosophila*) share the same neural markers for nociceptive integration as cephalopods, my distinction between "protected" and "unprotected" invertebrates collapses, and I would be compelled to argue for broader inclusion.

  My reasoning is most likely to fail if it underestimates the administrative burden on the crayfish teaching lab. If compliance costs threaten the viability of essential undergraduate training, the ethical calculus shifts toward preserving educational access.

  **Course of Action**
  1.  **Adoption:** Vote to enact Interim Policy 2024-C effective November 15.
  2.  **Implementation:** Research groups have 90 days to submit modified protocols addressing anesthesia, analgesia, and enrichment specific to these taxa.
  3.  **Review:** Form a subcommittee by Month 12 to review new literature; vote to sunset, extend, or expand the policy at Month 18.

  We have the opportunity to align our institution with international best practices (e.g., UK Animal Welfare Act, EU Directive 2010/63) without paralyzing research. I urge a vote in favor.
