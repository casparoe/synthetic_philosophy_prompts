  This is a classic comparative politics debate that hinges on the difference between *historical etymology*, *party family classification*, and *colloquial usage*. Both of them are arguing past each other slightly, but one is operating with a much better map of the territory.

  Here is the move-by-move refereeing.

  ### Round 1: The Definition
  **Roommate:** Claims European "liberal" = free-market/small-government (VVD, FDP) ≈ American "libertarian."
  **Cousin:** Claims European "liberal" accepts welfare/regs; US "liberal" = left-of-center. They are "false friends."

  **The Ruling:**
  *   **Roommate:** **Overreach.** She is correct that the VVD (Netherlands), FDP (Germany), and Venstre (Denmark) are classified as "Liberal" parties and sit center-right on economics. However, equating them to American "libertarians" is factually wrong. None of these parties advocate for the dismantling of the welfare state, privatization of all public services, or non-interventionism to the degree an American libertarian would. They are *market liberals*, not libertarians.
  *   **Cousin:** **Win.** The term "false friends" is linguistically precise here. The Cousin correctly identifies that European liberal parties operate within a consensus welfare state that American libertarians would reject. The US definition (New Deal coalition) is also accurately described.

  **Score:** Cousin takes Round 1. The Roommate's "libertarian" equivalence is a straw man that collapses under scrutiny.

  ### Round 2: The History
  **Roommate:** Claims American usage is the deviation. European usage = Classical Liberalism (rights, markets, limits on power). US left "hijacked" the label during the New Deal.
  **Cousin:** Claims European liberalism isn't pure classical liberalism either. Cites anti-clericalism (Spain/Italy), British welfare reforms (Lloyd George), and German Ordoliberalism.

  **The Ruling:**
  *   **Roommate:** **Partial Win.** She is historically correct that the *root* of the word is Classical Liberalism and that the American semantic shift occurred roughly during the 1930s/40s. This is standard intellectual history.
  *   **Cousin:** **Big Win.** The Cousin destroys the Roommate's monolithic view of "Europe." The Roommate assumes "Continental Liberalism" is one thing. It isn't.
      *   *The British Point:* The British Liberal Party introduced old-age pensions and national insurance *before* the US New Deal. If that's "liberalism," then the American "left" definition isn't a hijacking; it's an inheritance.
      *   *The Ordoliberal Point:* This is the knockout punch. German liberalism (the Freiburg School) explicitly rejects *laissez-faire*. They believe the state must *create* the market framework. This contradicts the Roommate's "get out of the way" definition.

  **Score:** Cousin takes Round 2. The Roommate has the etymology right, but the Cousin has the political history right. History trumps etymology in political science.

  ### Round 3: The Systematic Difference
  **Roommate:** Concedes historical nuance but argues current *systematic* difference: Europe = Economic core + Pro-EU; US = Social-progressive core + Anti-business.
  **Cousin:** (Wait for next round).

  **The Ruling:**
  *   **Roommate:** **Win.** This is the Roommate's strongest move. She pivots from "what the word means" to "how the word functions in current party systems." Today, if you walk into a European parliament, the "Liberal" group (Renew Europe) is generally more pro-market and pro-technocracy than the "Socialist" or "Green" groups. In the US, "Liberal" is the branding for the progressive left. As a description of *current voting coalitions*, the Roommate is right.
  *   **Cousin:** (No move yet).

  **Score:** Roommate takes Round 3. She successfully isolates the contemporary political utility of the label, even if her historical definition was shaky.

  ### Round 4: The Insult
  **Cousin:** Asks why it's used as an insult ("Neoliberal" in Europe vs. "Liberal" in US). Argues the fight is about coalition naming rights, not definition.
  **Roommate:** (No move yet).

  **The Ruling:**
  *   **Cousin:** **Knockout.** This moves the debate from political science to semantics and power dynamics. The Cousin identifies that "Liberal" is a floating signifier.
      *   In Europe, "Neoliberal" is a slur used by the *Left* against marketizers.
      *   In the US, "Liberal" is a slur used by the *Right* against social progressives.
      *   This proves the word has no fixed economic or social content; it simply marks the "establishment" or the "opposition" depending on the context. This undermines the Roommate's attempt to fix a "systematic difference." If the word is primarily a tribal marker, the systematic difference is incidental.

  **Score:** Cousin takes Round 4.

  ---

  ### What Both of Them Missed

  There is a massive blind spot in this debate, specifically regarding the Roommate's own country.

  **1. The Dutch "Social Liberal" Split:**
  The Roommate is Dutch but only mentions the VVD. In the Netherlands, the **D66** party is explicitly "Social Liberal." They are center-left on economics but staunchly liberal on social issues (euthanasia, drugs, education). If the Roommate had included D66, her claim that "European Liberal = Free Market" would have collapsed immediately. In the Netherlands, "Liberalism" is literally split between the economic liberals (VVD) and the social liberals (D66). This proves the Cousin's point that the term covers both bases in Europe, just in different parties.

  **2. The "Radical" Tradition:**
  The Cousin mentioned the British Liberals but missed the French *Radicaux*. In France, the "Radical Party" was historically the party of the secular left, distinct from the Socialists. This further muddies the "Europe = Right Wing Liberal" water.

  **3. The "Neoliberal" Distinction:**
  The Cousin mentions "Neoliberal" as an insult but doesn't clarify that in academic/policy circles, "Neoliberalism" refers to the specific Washington Consensus policies of the 80s/90s (Reagan/Thatcher). Interestingly, *both* US Liberals and European Liberals often reject the "Neoliberal" label, even though Europeans call Americans "Neoliberals" and Americans call Europeans "Socialists." They are both missing that "Neoliberalism" is the one thing they might actually agree on, but neither wants to admit it.

  ---

  ### Final Verdict

  **Winner: The Cousin.**

  **Why:**
  The Roommate is arguing from **lived experience and current branding**. She is describing how the labels function in today's headlines and election cycles. For a quick dinner conversation, her heuristic works: *If you meet a European Liberal, bet on them wanting lower taxes.*

  The Cousin is arguing from **political theory and historical accuracy**. She correctly identifies that the Roommate's definition is a caricature.
  1.  **The Libertarian Claim:** The Roommate's equation of European Liberals with American Libertarians is objectively false regarding policy (welfare state acceptance).
  2.  **The Monolith:** The Roommate treats "Europe" as a single political culture, ignoring the British and Southern European traditions where liberalism was historically anti-clerical and reformist, not just pro-market.
  3.  **The Ordoliberal Point:** The Cousin's mention of the Freiburg School demonstrates a deeper understanding of how "liberalism" actually functions in the largest economy in Europe (Germany).

  The Roommate won the pragmatic round (Round 3), but the Cousin won the factual, historical, and theoretical rounds. In a debate about *meaning*, accuracy beats utility. The Cousin correctly diagnosed that the word is a "false friend" and a tribal marker, whereas the Roommate tried to enforce a definition that doesn't hold up outside of specific Northern European contexts.

  **Advice for next time:** Tell the Roommate to acknowledge D66. Tell the Cousin to acknowledge that despite the history, if you join a "Liberal International" delegation today, you're mostly going to be talking about trade deals, not abortion rights. But on points? Cousin takes it.
