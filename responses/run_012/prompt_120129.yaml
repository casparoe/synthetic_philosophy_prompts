  1. Ranke is rejecting the Enlightenment tradition of pragmatic history, where writers judged past figures by present moral standards to extract political lessons. He argues this imposes an external framework on the past rather than understanding each epoch as valid in its own right before God.

  2. The phrase "merely to show" does not forbid narrative shaping or source selection, which Ranke practiced rigorously, but rather forbids subordinating evidence to a didactic purpose. He seeks to eliminate presentist bias, not the interpretive act of constructing a coherent account from fragments.

  3. Reading "eigentlich" as "essentially" makes the claim more defensible because it shifts the goal from photographic reproduction to grasping the inner spiritual truth of events. This aligns with Ranke's idealism, suggesting he wants to reveal the core reality behind the phenomena, not just list surface facts.

  4. The Lutheran background is a feature that complicates the "neutral camera" reading, as Ranke believes every epoch reflects a specific thought of God. Objectivity for Ranke means seeing the divine idea within the history, not standing outside history as a secular observer.

  5. A sophisticated reading accepts Carr and White's insistence on interpretation while viewing Ranke's slogan as a methodological ethic rather than an ontological claim. He advocates for self-effacement before the sources to minimize ego-driven distortion, acknowledging that perfect neutrality is a regulative ideal rather than a human possibility.
