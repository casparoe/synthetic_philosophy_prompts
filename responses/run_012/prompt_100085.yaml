      *   **Title:** The "Morale Retreat".
      *   **Scenario:** You manage a software team. You can approve a $5k budget for a morale-boosting retreat (Action A) or skip it (Action ~A). The retreat is genuinely enjoyable and worth $10k to the team's happiness (Net +$5k).
      *   **Common Cause:** The department culture is secretly toxic (State T).
