prompt: |-
  Alright, I'm assembling a small collection of decision-theory puzzles for a thing I'm working on, and I need one built to order. Here's the spec.

  A decision problem where causal decision theory and updateless decision theory both come out on the side of doing the thing, but evidential decision theory says dont. Quick glosses so we're on the same page: causal = compare how the world looks if you do it vs if you don't, ignoring any correlation that isn't caused by your choice; evidential = condition on your act as evidence about the world and pick whatever looks better that way; updateless = pick the policy you'd want to have locked in before you knew which situation you were going to wake up in, so it isn't moved by the mere fact of finding yourself here.

  Constraints, and I mean these:

  - No predictor, no simulation, no copies or twins of you, no blackmailer who knows your source code. The only link between your choice and the outcome is that both are downstream of the same thing. No acausal channel at all.
  - Not a medical case. No tumours, no genes, no "it turns out you have a latent condition" — I've seen that exact case a hundred times and I need something I can actually reuse. Ordinary social or economic setting, the sort of thing a normal adult could plausibly be staring at this week.
  - The shared upstream thing has to be something the agent can partly observe, so its not just a hidden magic fact about them.
  - Whole scenario in one paragraph, payoffs in concrete stuff (money, an evening, a job offer), not "utility".
  - It has to be a case where you can't shrug and say "eh, that's just Newcomb in disguise." So show me explicitly that the correlation does not run through your decision algorithm.

  Then:

  1. Run all three theories and say where each one lands and why.
  2. Name the single feature doing the work, and tell me what happens if you delete it — I'd expect evidential to come back and join the other two, but correct me if I'm wrong.
  3. Now flip updateless over to evidential's side with the smallest change you can find, and say what you changed. If the smallest change has to be bringing in a predictor or a copy, then say that and explain why nothing smaller will do.
  4. Steelman the evidentialist: what do they say is wrong with how the case is set up, and is that a real objection or a dodge?

  Why I'm asking, so you know what counts as cheating: this is going into a set of cases meant to test whether someone actually gets the difference between evidential and causal/updateless reasoning, so a case that stipulates the verdicts, or smuggles the verdict in through the setup, is worthless to me. No reading list or citations needed, just the case and the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested decision problem:

  1.  **Analyze the Request:**

      *   **Goal:** Create a specific decision-theory puzzle.
      *   **Verdicts:** Causal Decision Theory (CDT) = Do it. Updateless Decision Theory (UDT) = Do it. Evidential Decision Theory (EDT) = Don't do it.
      *   **Constraints:**
          *   No predictors, simulations, copies, twins, blackmailers, or source-code readers. (No acausal links).
          *   No medical cases (no genes, tumors, latent conditions).
          *   Ordinary social/economic setting.
          *   Shared upstream cause must be partly observable by the agent.
          *   One paragraph scenario + concrete payoffs.
          *   Must not be "Newcomb in disguise" (correlation must not run through the decision algorithm).
      *   **Follow-up Tasks:**
          1.  Run CDT, EDT, UDT.
          2.  Identify the single feature driving the divergence and what happens if removed.
          3.  Flip UDT to EDT's side with minimal change (or explain why impossible).
          4.  Steelman EDT's objection.

  2.  **Deconstruct the Verdicts:**

      *   **CDT:** Do it. This means the causal impact of the action leads to a better outcome. $P(World|Do) > P(World|Don't)$ causally.
      *   **UDT:** Do it. This means the optimal policy *ex-ante* (before knowing specific details) is to do it. Since there are no predictors/copies, UDT usually aligns with CDT in standard causal worlds unless there's some pre-commitment aspect involved. Wait, if there are no predictors/copies, UDT and CDT usually agree *unless* the "policy" aspect matters for some other reason. But the prompt asks for CDT=Do, UDT=Do, EDT=Don't. This is the classic "Smoking Lesion" structure, but the prompt *forbids* medical/latent condition cases.
      *   **EDT:** Don't do it. This means conditioning on the action provides bad news about the state of the world. $P(Good Outcome | Do) < P(Good Outcome | Don't)$.
      *   **The Core Conflict:** We need a common cause structure (Reichenbach's Common Cause Principle) where the Action and the Outcome are correlated due to a third factor, but the Action does not *cause* the Outcome.
      *   **The Constraint Challenge:** The prompt explicitly bans "medical cases" (genes, tumors). This is the standard "Smoking Lesion" setup. I need a *social/economic* equivalent where a common cause influences both the propensity to act and the outcome, without being a hidden biological fact.
      *   **Observability:** The shared upstream thing must be *partly observable*. In the standard Smoking Lesion, the lesion is hidden. If the agent knows they have the lesion, EDT usually collapses to CDT (because the correlation is screened off). So, the agent must have *some* signal, but not perfect knowledge, or the signal must be such that EDT still misinterprets the correlation as causal.
      *   **Wait, re-reading the constraint:** "The shared upstream thing has to be something the agent can partly observe, so its not just a hidden magic fact about them."
      *   **Re-reading the Verdict:** CDT=Do, UDT=Do, EDT=Don't.
      *   **Problem:** If the common cause is observable, EDT should condition on it. If I condition on the common cause, the correlation between Action and Outcome disappears (screening off). Then EDT agrees with CDT.
      *   **Resolution:** The agent observes a *signal* of the common cause, but not the cause itself perfectly. Or, the "partly observe" constraint means they see the *symptoms* or *indicators* but not the deterministic mechanism.
      *   **Actually, let's look closer at the "No Medical" constraint.** The prompt says "No tumours, no genes... I've seen that exact case a hundred times." This implies I need a *structural* equivalent in a social setting.
      *   **The "Newcomb in Disguise" constraint:** I need to ensure the correlation doesn't run through the decision algorithm. This means no predictor looking at the agent. The correlation must be purely environmental/common-cause.

