      *   **Outcome:** Two senior engineers quit next month (Cost $100k).
      *   **Causal Structure:** Toxic Culture (T) causes Missed Deadlines (S). Toxic Culture (T) causes Resignations (O). Toxic Culture (T) also makes you feel the need to approve the Retreat (A) (you sense the vibe).
      *   **Causal Independence:** Approving the Retreat does not fix the Toxic Culture or prevent Resignations (they are already disengaged). It just buys the $5k net happiness.
      *   **Payoffs:**
          *   Approve: +$5k (happiness) - $100k (if quits).
          *   Skip: $0 - $100k (if quits).
      *   **Probabilities:**
          *   P(Toxic) = 10%.
          *   P(Missed | Toxic) = 90%. P(Missed | Healthy) = 10%.
          *   P(Quit | Toxic) = 90%. P(Quit | Healthy) = 0%.
          *   P(Approve | Toxic, Missed) = 90% (You feel the need).
          *   P(Approve | Healthy, Missed) = 10% (You think it's just fun).
      *   **CDT:** Given Missed, P(Toxic) is high. But Action doesn't change Quit. Approve gets +$5k. Skip gets $0. **CDT: Approve.**
      *   **EDT:** Condition on Approve. P(Toxic | Approve, Missed) is very high (because Approve signals you sensed Toxic). So Expected Loss is high.
          *   Condition on Skip. P(Toxic | Skip, Missed) is lower (because you didn't sense it). Expected Loss is lower.
          *   If the difference in Quit probability outweighs the $5k gain, **EDT: Skip.**
      *   **UDT:** Policy "If Missed, Approve" vs "If Missed, Skip". Since Action doesn't cause Quit, the policy that gets the +$5k is better. **UDT: Approve.**

