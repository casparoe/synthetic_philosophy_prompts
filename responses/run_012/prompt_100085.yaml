      *   *Idea 3: The "Desperate Candidate".*
          *   Common Cause: You are in a bad financial position (Desperation).
          *   Action: Accepting a low-ball offer immediately (Sign of desperation).
          *   Outcome: The job turns out to be toxic/low growth (Bad Outcome).
          *   Causal Link: Does accepting the offer *cause* the job to be toxic? No, the job is already toxic. Does accepting the offer *cause* you to be desperate? No, desperation is prior.
          *   Correlation: Desperate people take bad jobs. Bad jobs are bad.
          *   EDT: If I take this job, it's evidence I was desperate, which is evidence the job is bad. So Don't Take.
          *   CDT: Taking the job gives me money now. It doesn't change the job's quality. So Take.
