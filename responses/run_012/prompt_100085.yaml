  **The Scenario: The Morale Retreat**

  You manage a software team and must decide whether to approve a $5,000 budget for a morale-boosting retreat (Action: **Approve**) or cancel it to save costs (Action: **Skip**). The retreat is genuinely enjoyable and provides a net utility benefit of $5,000 to the team regardless of other factors. However, two senior engineers are considering quitting next month, which would cost the company $100,000 in recruitment and lost productivity (Outcome: **Resign**). The underlying cause of both the potential resignations and your own inclination to approve the retreat is the department's hidden culture: if the culture is **Toxic**, engineers are likely to quit, missed deadlines are common, and you will feel a strong subconscious pressure to "fix" things with a retreat. If the culture is **Healthy**, engineers stay, deadlines are usually met, and you feel no such pressure. You have just observed a **Missed Deadline** (Signal), which is correlated with Toxic Culture but not definitive (healthy teams miss deadlines sometimes). Your decision to Approve does not causally influence the engineers' decision to quit (they have already mentally checked out if the culture is toxic), nor does it fix the culture.

  ***

  **1. Theory Verdicts**

  *   **Causal Decision Theory (CDT): Approve.**
      CDT conditions on the observed signal (Missed Deadline) to estimate the probability of Toxic Culture, but treats the action as an intervention. Since approving the retreat causally yields +$5,000 (enjoyment) and does *not* causally influence the resignations (which are determined by the pre-existing culture), the expected value of Approving is $5,000 higher than Skipping. CDT ignores the correlation between the action and the resignations because it is not causal.
  *   **Evidential Decision Theory (EDT): Skip.**
      EDT conditions on the action itself as evidence. Because the hidden Toxic Culture causes both the Resignations and your urge to Approve, choosing **Approve** is strong evidence that the culture is Toxic and the $100,000 loss is imminent. Choosing **Skip** is evidence that you felt no pressure, implying a Healthy Culture and no resignations. If the probabilistic weight of the $100,000 loss outweighs the guaranteed $5,000 gain, EDT recommends Skipping to avoid the "bad news" associated with Approving.
  *   **Updateless Decision Theory (UDT): Approve.**
      UDT selects the policy you would have committed to before observing the deadline or the culture. Since the action does not causally affect the resignations, the policy "If Missed Deadline, Approve" yields the +$5,000 benefit in all worlds, whereas "If Missed Deadline, Skip" yields $0. UDT ignores the evidential link between the policy and the culture because the policy does not acausally control the culture (no predictor exists).

  **2. The Single Feature**

  The feature doing the work is the **Common Cause influencing the Action**. Specifically, the hidden state (Toxic Culture) influences the Outcome (Resignations) *and* the Agent's propensity to Act (the urge to Approve), independent of the observed signal.

  If you delete this feature—meaning the Toxic Culture causes Resignations and Missed Deadlines, but *does not* influence your urge to Approve (your decision is random or based on unrelated factors)—then the Action provides no additional evidence about the Culture beyond the Missed Deadline. EDT would then condition only on the Deadline, the correlation between Action and Outcome would vanish, and EDT would agree with CDT and UDT (Approve).

  **3. Flipping Updateless to Evidential's Side**

  To make UDT recommend **Skip** (aligning with EDT) while keeping CDT on **Approve**, you must introduce a mechanism where the *policy itself* influences the Outcome, independent of the causal chain of the specific action. The smallest change is to stipulate that the engineers observe your **Reputation/Disposition** rather than just your specific act.

  *   **Change:** The engineers decide whether to quit based on whether you are the *type* of manager who panics (Approves retreats when deadlines are missed) or stays steady (Skips them). They observe your track record (your policy).
  *   **Why:** CDT treats your past track record as fixed history; it asks "Given I am the Panic Type, does this specific retreat help?" (Yes, +$5k). UDT asks "Which track record should I have?" If being the Steady Type prevents the $100k loss, UDT chooses the policy **Skip**.
  *   **Constraint Note:** Strictly speaking, this functions as a "predictor" (the engineers predict your future behavior based on your policy). In a purely causal world with no agents reacting to your disposition, UDT and CDT cannot diverge. To force the divergence without a sci-fi predictor, you must rely on social reputation acting as a stand-in for source-code visibility.

  **4. Steelman the Evidentialist**

  The evidentialist argues: "You are not a disembodied causal lever; you are a physical system embedded in a world where your decisions are symptoms of underlying states. Ignoring the information your own choice provides about the world is irrational. If 'Approving' is the kind of event that happens in doomed departments, then Approving places you in the reference class of doomed departments. CDT's insistence on treating the decision as an intervention independent of the agent's state is a fiction that ignores the reality that *you* are part of the causal web, not just an external manipulator of it."

  *   **Objection or Dodge?** This is largely a **dodge**. While it is true that actions provide evidence, decision theory is about *choosing* outcomes, not *predicting* them. By refusing to act to secure the $5,000 because the action correlates with a loss they cannot prevent, the evidentialist is "managing the news" rather than managing the world. They sacrifice a guaranteed gain to avoid a correlation they cannot causally influence, which is pragmatically self-defeating.
