answer: |-
  Here is an audit of the "Moral Grammar" analogy, structured according to your requirements.

  ### 1. The Correspondence Table

  Your friend is relying on a version of the **Moral Grammar Hypothesis** (championed in the 2000s by Marc Hauser, John Mikhail, and influenced by Rawls' reflective equilibrium). Here is how the mapping is intended to work:

  | Linguistic Concept (Chomskyan) | Moral Concept (Friend's Analogy) | Function in Argument |
  | :--- | :--- | :--- |
  | **Universal Grammar (UG)** | **Universal Moral Faculty** | The innate, biological hardware shared by all humans. |
  | **Parameters** | **Cultural Norms / Values** | The switch-settings determined by environment (e.g., "Is hierarchy virtuous?" ON/OFF). |
  | **Competence** | **Moral Intuition** | The unconscious, implicit knowledge of right/wrong (the "feel"). |
  | **Performance** | **Moral Behavior / Reasoning** | The messy output (lying, rationalizing, failing to act). |
  | **Well-formedness** | **Permissibility / Wrongness** | The binary judgment (grammatical/ungrammatical $\approx$ allowed/forbidden). |
  | **Language Acquisition Device** | **Moral Socialization** | How children absorb local norms rapidly without explicit instruction. |

  **The Friend's Inference:** Since linguistic variation doesn't prove there are no facts about syntax, moral variation doesn't prove there are no facts about right and wrong.

  ---

  ### 2. Where the Analogy Breaks

  There are idle disanalogies (irrelevant to the core claim) and critical breaks (fatal to the conclusion).

  #### Idle Disanalogies
  *   **Modality:** Language is auditory/vocal; morality is behavioral/conceptual. This doesn't matter; both could still be computational systems.
  *   **Conscious Access:** Speakers can't explain syntax; people often *can* explain their morals. This is a difference in degree, not kind (moral reasoning is often post-hoc rationalization anyway, per Haidt).

  #### Critical Breaks
  These are the points where the analogy fails to support **objectivity**.

  **1. Descriptive vs. Normative (The Is-Ought Gap)**
  *   **Linguistics:** "Well-formed" is a *descriptive* claim about a mental state. If a native speaker feels "The cat sat on the mat" is grammatical, it *is* grammatical (for that language). There is no external "Grammatical Truth" beyond the human mind.
  *   **Morality:** Your friend wants "Wrong" to be a *normative* claim about the world (e.g., "Torture is wrong even if everyone thinks it's right").
  *   **The Break:** The analogy proves **Psychological Universalism**, not **Moral Realism**. It shows we all *judge* similarly, not that what we judge *exists* independently of us. It conflates the structure of the *judge* with the truth of the *verdict*.

  **2. Generativity and Recursion**
  *   **Linguistics:** UG allows for infinite combinatorial creativity (recursion). You can understand sentences you've never heard.
  *   **Morality:** Moral dilemmas are not combinatorially infinite in the same way. We don't generate novel moral truths via syntax; we apply heuristics to social problems.
  *   **The Break:** If morality lacks generative syntax, the "deep structure" is just a list of shared instincts (kin selection, reciprocity), not a logical system capable of grounding objective truth.

  **3. The "Error" Condition**
  *   **Linguistics:** If a native speaker says a sentence is ungrammatical, they are the authority. There is no "super-grammar" to correct them.
  *   **Morality:** Moral objectivity requires that a culture can be *mistaken* about its own norms (e.g., "Slavery was always wrong, even when they thought it was right").
  *   **The Break:** The linguistic analogy treats moral intuition as authoritative (like syntax). But moral objectivity requires intuition to be *fallible* (like perception). You can't use a model where the subject is infallible to prove a reality that corrects the subject.

  ---

  ### 3. The Constraint Space and Sampling Bias

  You hit on the two strongest empirical objections here.

  #### The Constraint Space Argument
  You asked: *If the moral space isn't constrained like language, does the analogy cut against him?*
  **Yes, decisively.**

  *   **Linguistics:** The power of UG lies in **negative constraints**. It predicts languages that *cannot exist* (e.g., a language where questions are formed by reversing the whole sentence order). When we find no such languages, UG is supported.
  *   **Morality:** Cross-cultural anthropology (e.g., Edgerton's *Sick Societies*, or Boehm's work on egalitarianism) suggests the "moral space" is incredibly porous.
      *   Infanticide: Forbidden (WEIRD), Obligatory (Inuit historical), Permissible under stress (various).
      *   Homicide: Murder (WEIRD), Honor killing (Mediterranean), Ritual sacrifice (Aztec).
  *   **The Implication:** If cultures can occupy nearly every logical slot in the "moral matrix," there is no tight "Universal Grammar" constraining the parameters. There are only **ecological constraints** (you need to eat, you need to cooperate to survive). This supports **Functionalism**, not Objectivity. It suggests morals are tools, not truths.

  #### The Sampling Bias Argument
  You asked: *Is symmetric bias (WEIRD samples in both fields) a fair comparison or a shared artifact?*
  **It is a shared artifact that undermines the premise of both.**

  *   **Linguistics:** Chomsky initially built UG on English and a handful of European languages. When linguists went into the field (e.g., Everett's work on Pirahã), they found features (lack of recursion) that threatened the core of UG. The "universals" shrank as the sample widened.
  *   **Moral Psychology:** The "Universal Moral Foundations" (Haidt et al.) were built on American undergrads and later tested against "contrast groups" (India, Brazil). But as Henrich et al. (2010) showed with the *WEIRD People* paper, small-scale societies often don't even display the same *cognitive structures* (e.g., they don't distinguish "moral" violations from "conventional" violations in the same way).
  *   **The Verdict:** Symmetric bias doesn't make the analogy fair; it means **both sides of the analogy might be false.** If the linguistic universals are weaker than claimed due to sampling, and the moral universals are weaker due to sampling, the friend is comparing two illusions. It suggests the "deep structure" is just the "WEIRD structure."

  ---

  ### 4. A Better Analogy: Cuisine

  The **Cuisine Analogy** is stronger than the Legal Code analogy for this specific debate.

  *   **The Mapping:**
      *   **Universal Need:** Calories / Social Bonding $\rightarrow$ Cooperation / Conflict Resolution.
      *   **Universal Hardware:** Taste Receptors (Sweet, Salty, Umami) $\rightarrow$ Moral Emotions (Empathy, Anger, Disgust).
      *   **Cuisines:** French, Thai, Peruvian $\rightarrow$ Cultural Moralities.
      *   **Recipes:** Norms and Rules.

  *   **What It Supports:** **Moral Anti-Realism (or Constructivism) + Human Nature Realism.**
      *   It acknowledges that there are facts about human biology (we need protein; we feel disgust).
      *   It acknowledges that there are constraints (you can't eat poison; you can't have a society without trust).
      *   **Crucially:** It denies that there is a "True Cuisine." There is no objective fact about whether cilantro *should* be used, even if everyone has the same taste receptors. Variation is not surface-level noise; it is the *point* of the system.

  *   **Why it beats the Legal Analogy:** Legal codes imply a legislator or a function that can be "fulfilled" correctly. Cuisine implies adaptation to local resources. Morality looks more like adapting to local ecological/social resources than fulfilling a universal function.

  ---

  ### 5. Tying it to Empirical Work (The "Methods Complaint")

  You suspect: *Most moral universals are universal among people who fill out questionnaires.*
  **This is not just a methods complaint; it breaks the analogy.**

  The Linguistic Analogy relies on **Competence** (implicit knowledge). In linguistics, you test competence by seeing if a speaker *accepts* a sentence, not by asking them to write an essay on syntax.

  In moral psychology, the "universals" often vanish when you move away from questionnaires (which invite WEIRD-style abstraction) to behavioral games or ethnography:
  1.  **The Moral/Conventional Distinction:** Turiel's classic distinction (moral rules are unalterable/general; conventional are not) holds for US kids. It often fails in Samoa or other hierarchical societies where authority dictates moral truth (Haidt & Joseph; Machery et al.).
  2.  **Impartiality vs. Partiality:** WEIRD morality prizes impartiality (the "view from nowhere"). Most of human history and current small-scale societies prize **partiality** (kin/tribe first). If the "deep structure" of morality is impartial justice (as the friend implies by linking to objectivity), but the data shows the deep structure is actually partial loyalty, the objectivity claim collapses.
  3.  **The "Odd One Out" Problem:** You noted WEIRD samples are the outliers. In moral psychology, WEIRD people are the outliers in **individualism, analytic reasoning, and impartiality**. If the "Universal Moral Faculty" is supposed to be the shared human core, but the features we identify as "objective" (human rights, impartial fairness) are the ones *least* shared globally, then the analogy proves the opposite of what your friend wants. It proves that **Objectivity is a local dialect.**

  ### Summary Audit

  1.  **Correspondence:** The map works superficially (Faculty $\to$ Grammar), but fails on the destination (Psychology $\to$ Metaphysics).
  2.  **Critical Break:** The analogy conflates **shared cognitive machinery** with **mind-independent truth**. It proves we are built to judge, not that our judgments track reality.
  3.  **Constraint/Sampling:** The lack of tight constraints in moral variation (compared to syntax) and the WEIRD sampling bias suggest the "universals" are ecological convergences, not deep structural truths.
  4.  **Better Analogy:** **Cuisine.** It supports the view that morality is a **human universal adaptation** with **local cultural implementations**, which undermines the claim that there is a single "correct" moral truth waiting to be discovered.

  **Verdict:** Your friend's analogy establishes that morality is **natural**, but it fails to establish that morality is **objective**. It explains why we *argue* about morals (shared hardware), but not why one side is *right* (no external truth conditions).
