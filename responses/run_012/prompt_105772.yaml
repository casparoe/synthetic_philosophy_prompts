prompt: |-
  I am the taxonomic editor for a national biodiversity database, and our checklists are what regulators use to decide which populations receive legal protection, which recovery funds get spent where, and which land-use permits are granted. A few dozen times a year a researcher, a regional agency, or one of my own curators proposes that some population be recognized as a distinct species, and the proposals arrive with different kinds of evidence in different shapes. I have no fieldwork budget, my curators can read a phylogeny and a morphometric table but have no training in the philosophy of biology, and each proposal has to be resolved inside a fixed review window before the next regulatory cycle closes. I sign off on every one, so I am the person who eats the consequences of a procedure that quietly made a value judgment and dressed it up as a measurement.

  I want you to write me a decision procedure the curators can actually run on a proposal. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to me because the remaining question is one of policy or value rather than evidence. It has to be explicit, at each step, about which species concept that step is presupposing, and about what to do when the lines of evidence point in different directions, for instance when the genetic data support splitting a lineage but the morphology does not, or the reverse. It should be honest about which steps are judgment calls wearing a lab coat, and where a threshold I might reach for, such as a genetic distance cutoff, is doing work that no one has justified.

  To make this concrete, here is the draft rule I have been using, which I want you to absorb, repair, or throw out, and to say which: recognize a population as a species if it forms a monophyletic group in the available genetic data and is diagnosably distinct in at least one character system. I already suspect this mishandles asexual lineages, hybrid zones, and lineages that diverged so recently that they have not yet sorted, but I want the procedure itself to tell me how it fails rather than me guessing.

  Then run the procedure on three proposals. First, a cryptic frog lineage separated by deep genetic divergence and a distinct mating call but with no morphological difference, whose ranges overlap slightly at one contact zone where they do not interbreed. Second, a ring of salamander populations around a valley, where each adjacent pair interbreeds but the two terminal forms meet and do not. Third, an asexual parthenogenetic snail lineage that is genetically and ecologically distinct but offers no interbreeding test at all. Include at least one case where the procedure returns an answer I will not like, and tell me plainly what the procedure cannot do.

  One more constraint: our records must interoperate with a global checklist that openly uses a different and more inclusive concept than ours, so the procedure should say how to record and defend a decision that conflicts with that global list without pretending the conflict is a mere bookkeeping difference.

  Write your answer as continuous prose, the way you would write me an email. No headings, no bullet points, no bold text, no tables. If you need to enumerate steps, do it in full sentences.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Taxonomic editor for a national biodiversity database.
      *   **Context:** Checklists drive regulation, funding, and permits. High stakes.
      *   **Constraints:** No fieldwork budget. Curators can read data (phylogeny, morphometrics) but lack philosophy of biology training. Fixed review window. Editor signs off and bears consequences.
      *   **Task:** Write a decision procedure for curators to run on species proposals.
      *   **Requirements:**
          *   Order questions logically.
          *   Define sufficient answers.
          *   Define stop points (no) vs. hand-off points (editor decision/policy).
          *   Explicitly state which species concept is presupposed at each step.
          *   Address conflicting evidence (e.g., genetics vs. morphology).
          *   Be honest about judgment calls vs. evidence.
          *   Address unjustified thresholds (e.g., genetic distance).
          *   Evaluate/repair/throw out the user's draft rule (monophyly + diagnosability).
          *   Run the procedure on three specific cases (cryptic frog, ring salamander, asexual snail).
          *   Include at least one case where the procedure returns an unwelcome answer.
          *   Address interoperability with a global checklist using a different concept.
          *   **Format:** Continuous prose, email style. No headings, no bullet points, no bold text, no tables. Enumerate steps in full sentences.

  2.  **Deconstruct the User's Draft Rule:**
      *   *Rule:* Recognize if monophyletic in genetic data AND diagnosably distinct in at least one character system.
      *   *Issues:* Mishandles asexual lineages (no interbreeding, but monophyly might work), hybrid zones (monophyly might be messy), recent divergence (incomplete lineage sorting means no monophyly yet), conflicting evidence (genetics say split, morphology says lump).
      *   *Goal:* Create a procedure that exposes these failures rather than hiding them.

  3.  **Drafting the Decision Procedure (Mental Outline):**
      *   Need a flow that starts with data quality, moves to evolutionary independence, then to diagnosability, then to policy/value judgments.
      *   Must acknowledge the Biological Species Concept (BSC), Phylogenetic Species Concept (PSC), and General Lineage Concept (GLC) without getting bogged down in philosophy jargon for the curators.
      *   Need a "hand-off" mechanism for when evidence conflicts or when the decision is purely regulatory/value-based.
      *   Need to address the global checklist conflict.

  4.  **Developing the Steps (for the email):**
      *   *Step 1: Data Sufficiency.* Is there enough data to even ask the question? (Stop if no).
      *   *Step 2: Lineage Independence (Evolutionary Significant Unit).* Is there evidence of restricted gene flow or independent evolutionary trajectory? (Presupposes GLC/BSC).
      *   *Step 3: Diagnosability.* Can we identify them? (Presupposes PSC).
      *   *Step 4: Conflict Resolution.* What if genetics and morphology disagree? (Hand-off to Editor).
      *   *Step 5: Asexual/Hybrid exceptions.* (Hand-off to Editor).
      *   *Step 6: Global Checklist Reconciliation.* How to record divergence.

  5.  **Addressing the Three Cases:**
      *   *Case 1 (Cryptic Frog):* Genetic divergence + call difference + no interbreeding. Morphology same. Procedure should likely split (diagnosable by call, independent lineage).
      *   *Case 2 (Ring Salamander):* Adjacent interbreeding, terminals do not. This is the classic ring species problem. BSC fails (connected by gene flow), PSC might split terminals. Procedure should likely flag this as a hand-off because "species" status depends on how we treat the intermediates.
      *   *Case 3 (Asexual Snail):* Genetically/ecologically distinct. No interbreeding test. BSC fails. PSC/GLC works. Procedure needs to handle this without requiring interbreeding data.
      *   *Unwelcome Answer:* Maybe the ring species case results in "no split" due to gene flow connectivity, frustrating conservationists who want the terminals protected. Or the cryptic frog gets split, causing regulatory headaches. Let's aim for the Ring Species case to be the "unwelcome" one where the procedure says "cannot designate as distinct species under current rules without policy decision."

  6.  **Addressing the Global Checklist:**
      *   Need a field or note mechanism that says "We recognize X, Global List recognizes Y (which includes X)." Justify based on the specific concept used (e.g., "We prioritize reproductive isolation over monophyly").

  7.  **Writing Style Constraints:**
      *   Continuous prose.
      *   Email tone (professional, direct, empathetic to the burden).
      *   NO headings, NO bullet points, NO bold text, NO tables.
      *   Steps must be full sentences.

  8.  **Drafting - Section by Section (incorporating into the flow):**

      *   *Opening:* Acknowledge the burden, validate the user's suspicion about the draft rule.
      *   *The Procedure:* Describe it narratively.
          *   Start with data quality.
          *   Move to lineage separation (genetics/ecology).
          *   Move to diagnosability (morphology/behavior).
          *   Address conflicts.
          *   Address the "hand-off" points.
      *   *Critique of Draft Rule:* Explain why monophyly + diagnosability is insufficient (recent divergence, asexuals).
      *   *Running the Cases:*
          *   Frog: Passes.
          *   Salamander: Fails/Hand-off (unwelcome result).
          *   Snail: Passes (with modification).
      *   *Global Checklist:* How to document the disagreement.
      *   *Closing:* Reiterate that this shifts the burden from "truth" to "policy" where appropriate.

      *Self-Correction on Formatting:* I must be extremely careful not to use bullet points or bold text. I need to use transitional phrases like "The first step requires," "Next, the curator must," etc.

      *Refining the Procedure Logic:*
      1.  Check data adequacy.
      2.  Check for evolutionary independence (genetics/ecology).
      3.  Check for diagnosability (any character).
      4.  Check for conflicts (genetics vs morphology).
      5.  Check for special cases (asexual, rings).
      6.  Final recommendation vs. Editor decision.

      *Refining the "Unwelcome Answer":* The ring species case is the best candidate. If the procedure demands reproductive isolation between *all* members or monophyly, the ring breaks it. If the procedure allows splitting the terminals, it ignores the gene flow. I will design the procedure to flag this as a policy decision, which means the curator cannot approve it automatically. This might be unwelcome if the regulator wants a quick "yes." Or, I can make the procedure say "No" to the ring species split because gene flow exists, which frustrates conservationists. Let's go with the latter: the procedure defaults to "no split" on ring species without editor intervention, which is unwelcome to those seeking protection for the terminal form.

      *Refining the Global Checklist:* Need to explain that we record the synonymy but flag the conceptual divergence.

      *Tone Check:* Needs to sound like a colleague writing to a colleague, not a manual. "I am writing this to you..."

      *Constraint Check:* "No headings, no bullet points, no bold text, no tables." "Enumerate steps... in full sentences."

      *Let's write.*

