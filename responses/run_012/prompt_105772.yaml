answer: |-
  Dear Colleague,

  I understand the weight you carry, and I agree that your current draft rule, while practical, masks the philosophical commitments that drive our regulatory outcomes. By requiring monophyly and diagnosability, you are effectively adopting a hybrid of the Phylogenetic Species Concept and a genealogical criterion, which works well for deep divergences but fails when lineage sorting is incomplete or when reproduction is absent. You asked for a procedure that exposes these failures rather than hiding them, and that distinguishes between evidentiary thresholds and policy judgments. What follows is a proposed decision procedure written for your curators, designed to be run sequentially, with explicit instructions on when to stop, when to approve, and when to hand the decision to you because the question is no longer about data but about values.

  The procedure begins with a question of data sufficiency rather than biology. The curator must ask whether the proposal provides peer-reviewed evidence for at least two independent character systems, such as genetics and morphology, or genetics and behavior. If the proposal relies on only one system, the procedure stops with a recommendation to reject the proposal due to insufficient evidence, because single-line evidence cannot distinguish between phenotypic plasticity and lineage divergence. If there are two systems, the curator moves to the second step, which asks whether the population forms a distinct evolutionary lineage based on genetic clustering or ecological independence, presupposing the General Lineage Concept. A sufficient answer here is a demonstration of restricted gene flow or significant ecological divergence, but the curator must note that any specific genetic distance cutoff used to define this distinction is an arbitrary threshold serving as a proxy for reproductive isolation, not a biological truth. If the data show no separation in any lineage metric, the procedure stops with a recommendation to reject. If the data show separation, the curator moves to the third step, which asks whether the population is diagnosably distinct from its sister population in at least one character system, presupposing the Phylogenetic Species Concept. A sufficient answer is a fixed difference in morphology, call structure, or genetic marker that allows identification of individuals. If the population is not diagnosable, the procedure stops with a recommendation to reject, because regulatory enforcement requires identifiability.

  At this point, the curator must check for conflicts between the lines of evidence, which is the fourth step. The curator asks whether the genetic data support splitting the lineage while the morphological data support lumping it, or vice versa. If the evidence is congruent, the curator may recommend recognition. If the evidence is conflicting, such as deep genetic divergence with no morphological difference, the procedure must stop and hand the decision to you, because resolving this conflict requires choosing whether genetic history or phenotypic reality matters more for protection, which is a policy judgment. The fifth step requires the curator to identify if the proposal involves asexual lineages or ring species complexes. If the organism is asexual, the Biological Species Concept cannot apply, and the curator must hand the decision to you to determine if ecological distinctness alone suffices for protection. If the organism is part of a ring species complex where adjacent populations interbreed but terminal forms do not, the curator must hand the decision to you, because standard species concepts contradict each other here and recognizing the terminal forms as species ignores the gene flow connecting them. Finally, the sixth step requires the curator to compare the proposed status with the global checklist. If our decision conflicts with the global list, the curator must record the conflict explicitly in the database notes, stating that our database prioritizes reproductive isolation or diagnosability over the global list's more inclusive concept, rather than labeling it a synonymy error.

  When we run this procedure on your three concrete proposals, the outcomes reveal where the machinery grinds. For the cryptic frog lineage, the procedure passes the data sufficiency step because there are genetics and call data. It passes the lineage step because the genetic divergence is deep and they do not interbreed. It passes the diagnosability step because the mating call is distinct, even if morphology is not. However, this triggers the conflict step, because genetics and behavior support splitting while morphology supports lumping. Under this procedure, this case is handed to you, because you must decide if a call difference is enough for regulatory identity when morphology fails, though in practice you might authorize the split based on the reproductive isolation evidence. For the ring of salamander populations, the procedure passes data sufficiency and likely passes diagnosability for the terminal forms. However, at the fifth step regarding ring species, the procedure halts and hands the decision to you. This is the case where the procedure returns an answer you will not like, because it refuses to automatically validate the terminal forms as distinct species despite their lack of interbreeding, forcing you to justify overriding the gene flow continuity that defines the ring. If your regulators want a simple yes or no, this hand-off will feel like a failure, but it is honest about the biological ambiguity. For the asexual parthenogenetic snail, the procedure passes data sufficiency and lineage independence based on genetics and ecology. It passes diagnosability. But at the fifth step, it identifies the asexual nature and hands the decision to you, because the concept of interbreeding is inapplicable and you must decide if ecological distinctness alone warrants species status for protection.

  Regarding the global checklist interoperability, this procedure forces your team to record the conceptual divergence rather than smoothing it over. If the global list lumps the cryptic frog based on morphology while we split it based on genetics and call, the database record must state that we recognize two species under a lineage-based concept while the global list recognizes one under a morphological concept. This prevents future regulators from assuming the discrepancy is a bookkeeping error that can be fixed by updating a synonymy table. It forces them to see that protecting the frog population depends on which biological reality we choose to prioritize. I recommend you throw out your draft rule because it pretends that monophyly is a necessary condition, which excludes recently diverged populations that are reproductively isolated but have not sorted genetically, and it excludes asexuals entirely. The procedure I have outlined repairs this by separating lineage evidence from diagnosability and by flagging the hard cases where biology does not offer a clean binary.

  You asked me to be honest about where the procedure cannot do the work for you. It cannot resolve the ring species problem without a policy decision on whether to privilege the endpoints or the continuum. It cannot justify a genetic distance threshold without admitting it is arbitrary. It cannot reconcile conflicting evidence without you choosing which evidence governs protection. What this procedure does is ensure that when you sign off, you know whether you are signing off on a biological fact or a regulatory value. It shifts the burden from the curators, who are trained to read data, to you, who are tasked with managing the consequences. By forcing the hand-off at the points of conceptual conflict, it protects your team from making philosophical errors they are not trained to see, and it protects you from claiming that a value judgment was merely a measurement. I hope this provides the clarity you need to manage the next regulatory cycle without pretending the boundaries are sharper than nature allows.
