answer: |-
  Here is the 90-minute session plan. It is designed to treat Austin not as a taxonomy to be memorized, but as a problem-solving trajectory where the initial distinction breaks down and forces a better one.

  ### 1. The Ordering Logic
  **Sequence:**
  1.  **The Intuition:** Constative vs. Performative (The Binary).
  2.  **The Stress Test:** Felicity Conditions.
  3.  **The Collapse:** Why the Binary fails (The Payoff).
  4.  **The Reconstruction:** Locution/Illocution/Perlocution (The Tripartite Split).
  5.  **The Mechanics:** Uptake and Constitutive Conventions.

  **Why this order?**
  You must teach **Felicity Conditions before the Locution/Illocution/Perlocution split.**
  *   **Reason:** If you teach the Tripartite Split first, students treat it as a static taxonomy (a "periodic table" of speech). They will memorize definitions without understanding *why* Austin needed them.
  *   **Pedagogical Goal:** By introducing Felicity Conditions immediately after the Constative/Performative binary, you demonstrate that the binary *cannot hold up under pressure*. The Tripartite Split then arrives not as new vocabulary, but as the **solution** to the collapse. The collapse is the payoff; the split is the rescue.

  ### 2. The Core Example
  **The Example:** **"There's a spider on your shoulder."**

  **What it must have:**
  *   **Propositional Content:** It looks like a fact-claim (constative). It can be verified (is there a spider?).
  *   **Action-Oriented Context:** It is uttered to *warn* or *alert* (performative).
  *   **Hearer Reaction:** It typically causes a physical reaction (brushing it off, panicking).

  **What it must lack:**
  *   **Explicit Performative Verb:** Do not use "I warn you..." (This hides the constative veneer).
  *   **Institutional Ritual:** Do not use a wedding or court setting (This makes speech acts look like magic spells restricted to specific venues).
  *   **Commissive Stakes:** Do not use a promise or bet (This conflates illocution with future obligation).

  **Why not the Wedding or Ship?**
  *   **Wedding/Ship:** These are "institutional performatives." They mislead students into thinking speech acts only happen in rituals with authorized officials. They obscure the fact that *ordinary* description is also action.
  *   **Promise:** You banned it, but theoretically, it's also risky because it leans too heavily on the "commissive" aspect, making students think illocution is always about binding oneself. "Spider" is an *exercitive* (warning/exercising power over attention) that looks like a *constative* (description), which creates the necessary tension for the theory.

  ### 3. The Misconception Map
  Here are the four specific misconceptions, where they arise, and exactly where you kill them.

  | Misconception | When it forms | Where you head it off | How |
  | :--- | :--- | :--- | :--- |
  | **"Performative = Emotional/Expressive"** | **Minute 5.** Students think "doing" means "venting feelings." | **During the Initial Binary.** | Insist that performatives are **actions**, not expressions. "I apologize" is not describing sadness; it is the act of apologizing. Use the Spider: Saying it isn't expressing fear; it is *warning*. |
  | **"Constative/Performative is the Final Theory"** | **Minute 20.** They think the binary is the whole point. | **During the Collapse (The Payoff).** | Show how "There's a spider" is *both* true/false AND happy/unhappy. Force them to admit the binary is blurry. State explicitly: "Austin spends the first third of the book setting this up just to knock it down." |
  | **"Illocutionary Force = Tone of Voice"** | **Minute 60.** They think shouting makes it a warning. | **During the Tripartite Split.** | Contrast "There's a spider" (whispered) vs. "There's a spider" (shouted). The *illocution* (warning) is the same; the *perlocution* (fear level) changes. Force = Convention, not acoustics. |
  | **"Perlocution = Any Effect (including understanding)"** | **Minute 75.** They think if the hearer understands, that's perlocution. | **During Uptake.** | Distinguish **Uptake** (understanding the force, required for Illocution) from **Effect** (panic, required for Perlocution). If they don't understand English, no warning occurred (Illocution failed), even if they saw you point (Perlocution might still happen). |

  ### 4. Baking in the Crucials

  **A. The Collapse as Payoff**
  *   **Location:** Minutes 30–40.
  *   **Execution:** Do not rush this. Spend 10 minutes grinding the "Spider" example against the Felicity Conditions.
      *   Ask: "If there is no spider, is the statement *false* (constative failure) or is the warning *infelicitous* (performative failure)?"
      *   Let them struggle. Then reveal Austin's move: *All* speech is subject to felicity conditions. Even "The cat is on the mat" misfires if there is no cat.
      *   **The Payoff Line:** "The constative/performative distinction doesn't describe two *types* of sentences; it describes two *dimensions* of all speech. Since the binary collapses, we need a new map." $\rightarrow$ Transition to Locution/Illocution/Perlocution.

  **B. Constitutive Rules & Institutions**
  *   **Location:** Minutes 70–80 (Inside the Illocution section).
  *   **Execution:** This is where you address the "Institution vs. Convention" worry without importing too much Searle.
      *   **The Point:** Illocutionary acts work because of **conventions**, but not always **institutions**.
      *   **The Contrast:** Use the **Wedding** (briefly, as a contrast case) vs. the **Spider**.
          *   *Wedding:* Requires an institution (state/church), specific officers, specific paperwork. (Institutional).
          *   *Spider:* Requires only linguistic convention and context. No "License to Warn" is needed. (Non-institutional).
      *   **Why here?** It clarifies *how* the Illocution works. It prevents the misconception that speech acts require a "social authority" figure.
      *   **Keep it tight:** Do not dive into "Status Functions." Just establish that some acts need a specific social structure (marriage) while others only need shared language (warning).

  **C. Uptake**
  *   **Location:** Minutes 80–85.
  *   **Decision:** **Include it.** It is essential for linguists to distinguish between *encoding* force and *securing* understanding.
  *   **The Austin Claim:** Illocution requires uptake (hearer must recognize the intent). Perlocution does not (I can scare you accidentally).
  *   **The Caveat:** Explicitly state: "Austin claims uptake is necessary for illocution. Later philosophers (like Searle) disagree. For today, treat Uptake as the boundary line between Illocution and Perlocution."

  ### 5. What to Leave Out (Say This Out Loud)
  At the start of the session (Minute 2), say this explicitly:
  > "We are leaving out **Searle's Taxonomy** (Directives, Commissives, Expressives, etc.) and **Gricean Implicature**. Austin is about the *structure* of the act itself, not the classification of verbs or the calculation of implied meaning. If we mix those in today, you will confuse convention with inference."

  ### 6. The Diagnostic Question
  Do not ask: "Define illocution."
  Do not ask: "Is a promise an illocution?"

  **Ask this at Minute 88:**
  > "I say to you, *'There's a spider on your shoulder.'*
  > 1. There is no spider.
  > 2. You hear me, understand English, but you don't believe me and you don't move.
  > 3. A third person hears me, believes me, and panics.
  >
  > **Did the warning succeed? Did the panic succeed? And which failure matters more to Austin's theory of meaning?**"

  **What to listen for:**
  *   **Success:** They should identify that the **Illocution (warning)** succeeded (because of Uptake/Understanding) even though the Constative content was false and the Perlocution (moving/panic) failed for the hearer.
  *   **Failure:** If they say the warning failed because you lied (confusing constative truth with illocutionary force) or if they say the warning failed because the hearer didn't move (confusing illocution with perlocution).
  *   **The "Matters More" Clause:** This tests if they grasp the "Collapse." The truth of the spider is secondary to the felicity of the act. If they focus on the lie, they missed the payoff.

  ### Summary Checklist for the Board
  1.  **Constative vs. Performative** (The Binary) $\rightarrow$ *Breaks down.*
  2.  **Felicity Conditions** (The Stress Test) $\rightarrow$ *Causes breakdown.*
  3.  **Locution / Illocution / Perlocution** (The Reconstruction).
  4.  **Uptake** (The Boundary).
  5.  **Convention vs. Institution** (The Mechanism).
