prompt: |-
  I'm running a ninety-minute session on speech acts for a reading group of linguistics grad students who've never done any philosophy of language. Don't explain Austin to me — plan how I should explain him. What has to come first and what depends on what: for instance, do the felicity conditions come before or after the locution/illocution/perlocution split, and why that order and not the reverse? Pick the single example that carries the whole session and tell me what it has to have and what it has to lack — and tell me why I shouldn't just use the wedding pronouncement or the ship-naming bit that everyone reaches for (and please don't let it be a promise either). Then give me the misconception map: what they'll walk in with and what they'll form halfway through — I'm guessing "performative just means expressive or emotional," "illocutionary force = tone of voice," "perlocutionary = any effect at all, so promising counts as perlocutionary," and "the constative-vs-performative split is the actual finished theory" — plus exactly where in the sequence I head each one off.

  Two things I want baked in, because they're definately the part that usually gets skipped. First: Austin introduces the performative and then more or less dissolves the distinction himself, so what most people remember as the theory is really the setup — I want the ordering to make that collapse feel like the payoff rather than a technicality, so where does it land? Second: the constitutive-rules idea, that promising does something only because there are rules constituting the practice, and the awkward follow-up of whether promising is institutional like a marriage or somehow works without any institution at all — too much for this crowd, and if not, where does it go and what case carries it? There's also the uptake thing, that an illocutionary act supposedly needs the hearer to understand it to come off while a perlocutionary one doesn't — worth including, or too contested here?

  Finish with one question I can put to them at the end that actually shows me whether it landed rather than whether they can nod, and tell me what to leave out at this level — and to say out loud that I'm leaving it out.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Linguistics grad students (familiar with linguistic concepts, unfamiliar with philosophy of language).
      *   **Duration:** 90 minutes.
      *   **Topic:** J.L. Austin's Speech Act Theory (primarily *How to Do Things with Words*).
      *   **Constraints:**
          *   Do *not* explain Austin to me; plan *how* I should explain him.
          *   Determine the order of concepts (e.g., Felicity Conditions vs. Locution/Illocution/Perlocution) and justify the order.
          *   Select a *single* core example (NOT wedding, NOT ship-naming, NOT promising). Explain what it must have/lack and why avoid the classics.
          *   Create a "Misconception Map" (pre-existing & mid-session misconceptions) and specify where to head them off.
          *   **Crucial Requirement 1:** Make the collapse of the Constative/Performative distinction feel like the *payoff*, not a technicality.
          *   **Crucial Requirement 2:** Address Constitutive Rules (institutional vs. non-institutional) without getting bogged down. Where does it fit?
          *   **Crucial Requirement 3:** Address "Uptake" (hearer understanding) – include or exclude?
          *   **Ending:** One diagnostic question to check understanding (not just nodding).
          *   **Exclusion:** Explicitly state what to leave out and say so out loud.

  2.  **Deconstruct the Content & Order:**
      *   *Standard Order:* Constative/Performative distinction $\rightarrow$ Felicity Conditions $\rightarrow$ Breakdown of distinction $\rightarrow$ Locution/Illocution/Perlocution.
      *   *Requested Order:* Needs to make the collapse the payoff.
      *   *Linguistics Audience:* They care about structure, context, and meaning. They might be prone to treating speech acts as just "pragmatics" or "contextual meaning."
      *   *Felicity vs. Tripartite Split:* Felicity conditions are the tool used to break the Constative/Performative distinction. Therefore, Felicity *must* come before the Tripartite Split. If you teach the Tripartite Split first, students treat it as a taxonomy of acts. If you teach Felicity first, you show *why* the taxonomy is needed (because the initial binary failed).
      *   *Sequence:*
          1.  Initial Hook (The "Doing" vs. "Saying" intuition).
          2.  The Constative/Performative Binary (The Setup).
          3.  Felicity Conditions (The Stress Test).
          4.  The Collapse (The Payoff).
          5.  Locution/Illocution/Perlocution (The Reconstruction).
          6.  Constitutive Rules & Uptake (The Nuance).

  3.  **Selecting the Core Example:**
      *   *Forbidden:* Wedding ("I do"), Ship-naming ("I name this ship..."), Promising ("I promise...").
      *   *Why avoid them?* They are too institutional (marriage/ships) or too explicit/performative verb-heavy (promising). They make the theory look like it only applies to rituals or explicit performatives.
      *   *Requirements:* Needs to be ordinary, potentially ambiguous between describing and doing, and sensitive to context/felicity.
      *   *Candidate:* "The window is open."
      *   *Why?*
          *   Can be a constative (describing temperature).
          *   Can be a performative (request to close it, or warning about bugs).
          *   No explicit performative verb.
          *   Felicity conditions apply (is there a window? is it actually open? does the speaker have authority to request?).
          *   Allows for perlocutionary effects (hearer feels cold, hearer closes window).
      *   *Refinement:* Let's go with **"There's a bull in the field."**
          *   *Why?* High stakes.
          *   *Constative:* Describing the landscape.
          *   *Performative:* Warning.
          *   *Felicity:* Is there actually a bull? (Truth/Falsehood vs. Happy/Unhappy).
          *   *Perlocution:* Hearer runs away.
          *   *Illocution:* The warning itself.
          *   *Avoids:* Rituals, explicit verbs ("I warn you").
      *   *Wait, one constraint:* "Pick the single example that carries the whole session."
      *   *Decision:* **"I bet you five dollars."**
          *   *Wait, user said:* "please don't let it be a promise either." Betting is too close to promising.
          *   *Decision:* **"You are hereby fired."**
          *   *Pros:* Institutional, clear felicity conditions, high stakes.
          *   *Cons:* Too close to wedding/ship (institutional).
          *   *Decision:* **"It's going to rain."**
          *   *Pros:* Classic constative. Can be a warning.
          *   *Cons:* A bit dry.
          *   *Decision:* **"I declare this meeting adjourned."**
          *   *Cons:* Too institutional.
          *   *Decision:* **"Watch out!"**
          *   *Pros:* Pure illocution. No constative veneer.
          *   *Cons:* Hard to show the *collapse* of constative/performative.
          *   *Decision:* **"The door is locked."**
          *   *Why?*
              *   *Constative:* Describing state of affairs.
              *   *Performative:* Informing, warning, reassuring, or instructing (lock it).
              *   *Felicity:* If the door is open, is the statement false or the act infelicitous?
              *   *Institution:* None required (unlike marriage/firing).
              *   *Perlocution:* Hearer feels safe, or goes to check.
      *   *Let's try one more:* **"I advise you to leave."** vs **"You should leave."**
      *   *Best Choice:* **"There is a spider on your shoulder."**
          *   *Why?*
              *   *Constative:* True/False (is there a spider?).
              *   *Performative:* Warning/Alerting.
              *   *Felicity:* If no spider, is it a lie (constative failure) or a misfire (performative failure)?
              *   *Perlocution:* Panic, brushing it off.
              *   *Illocution:* The warning.
              *   *Avoids:* Rituals, Promises.
              *   *Carries:* All distinctions.

  4.  **Misconception Map:**
      *   *Pre-existing:* "Performative = emotional/expressive." "Constative = factual."
      *   *Mid-session:* "Illocution = tone." "Perlocution = any effect." "Constative/Performative split is the final theory."
      *   *Intervention Points:*
          *   Emotional vs. Action: Address during Initial Binary.
          *   Tone vs. Force: Address during Illocution definition.
          *   Effect vs. Uptake: Address during Perlocution/Uptake section.
          *   Split as Final: Address during the Collapse section.

  5.  **Addressing the "Crucials":**
      *   *Collapse as Payoff:* This needs to happen *after* Felicity Conditions break the binary but *before* the Tripartite Split. The Tripartite Split is the *solution* to the collapse.
      *   *Constitutive Rules:* This is Searle territory, but rooted in Austin's "felicity." It fits best after the Tripartite Split, as a way to explain *how* illocution works. Keep it brief. Use the "Spider" example (does warning require an institution? No, but it requires conventions of language).
      *   *Uptake:* Austin says illocution requires uptake. This is contested (Searle disagrees). For a 90-min intro, include it but flag it as "Austin's claim, debated later." It clarifies the Illocution/Perlocution boundary.

  6.  **Drafting the Plan (Iterative refinement):**
      *   *Time Management:* 90 mins is tight.
          *   Intro/Binary: 15 mins.
          *   Felicity/Breakdown: 25 mins.
          *   Tripartite Split: 30 mins.
          *   Constitutive/Uptake: 10 mins.
          *   Wrap/Question: 10 mins.
      *   *Ordering Logic:* Felicity *must* precede Tripartite. Why? Because the Tripartite system exists *because* Felicity conditions broke the Constative/Performative binary. If you teach Tripartite first, Felicity looks like an add-on. If you teach Felicity first, Tripartite looks like the rescue mission.
      *   *Example:* "There's a spider on your shoulder."
          *   *Must Have:* Truth-apt content (spider exists), Action-oriented function (warning), Hearer reaction (panic).
          *   *Must Lack:* Explicit performative verb ("I warn you"), Institutional setting (unlike wedding).
      *   *What to Leave Out:* Searle's taxonomy (Directives, Commissives, etc.), Gricean implicature (distinct mechanism), detailed historical context of logical positivism.

  7.  **Refining the Diagnostic Question:**
      *   Needs to test if they get the *collapse* and the *illocution/perlocution* distinction.
      *   Bad Question: "What is an illocutionary act?" (Recall).
      *   Good Question: A scenario where the illocution succeeds but perlocution fails, or vice versa, or where truth-value is irrelevant.
      *   *Idea:* "If I say 'I bet you $5' and you don't hear me, did I bet?" (Uptake).
      *   *Better:* Use the Spider example. "If there is no spider, but you panic anyway, what failed?"

  8.  **Final Review against Constraints:**
      *   Don't explain Austin to me. (Check).
      *   Plan order & justify. (Check).
      *   Single example (Spider). (Check).
      *   Misconception map + intervention points. (Check).
      *   Collapse as payoff. (Check).
      *   Constitutive rules placement. (Check).
      *   Uptake decision. (Check - Include but flag).
      *   Diagnostic question. (Check).
      *   Exclusions stated out loud. (Check).

  9.  **Writing the Response:** (Focusing on tone: direct, pedagogical, structured).
      *   *Self-Correction on Example:* "Spider on shoulder" is great, but is it *too* close to a warning which feels like a directive? Let's ensure it highlights the *constative* veneer. "There is a spider" looks like a fact. That's the key. It allows the "True/False" vs "Happy/Unhappy" tension.
      *   *Self-Correction on Constitutive Rules:* Austin doesn't use the term "constitutive rules" explicitly (that's Searle's terminology for Austin's insights). I need to be careful not to teach Searle as Austin. I will frame it as "Convention and Procedure" within Austin's Felicity Conditions to stay accurate to the text while addressing the user's prompt about institutions.
      *   *Self-Correction on Uptake:* Austin *does* require uptake for illocution (Lecture VIII). I will include it as a specific boundary marker.

  10. **Final Polish:** Ensure the "Why that order" is explicit. Ensure the "What to leave out" is bold.

  *(Self-Correction during drafting)*: Wait, the prompt asks about "Constitutive-rules idea... whether promising is institutional like a marriage or somehow works without any institution." Since I banned "Promising" as the core example, I need to use the core example to illustrate this. Can "There's a spider" work for constitutive rules? Yes, because it relies on the convention of language, not a specific institution like marriage. I will use the contrast between the Spider (conventional) and a Wedding (institutional) briefly to make the point without making Wedding the core example.

  Let's finalize the example: **"The check is in the mail."**
  *   *Constative:* True/False.
  *   *Performative:* Reassuring/Promising.
  *   *Felicity:* Is there a check? Did I send it?
  *   *Institution:* Banking/Mail (weak) vs Language (strong).
  *   *Actually, "Spider" is more immediate.* Let's stick with **"There's a spider on your shoulder."** It's visceral.

