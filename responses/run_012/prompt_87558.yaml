answer: |-
  # Q&A PREP SHEET: LINEAGE COUNTERPART THEORY

  **Strategy:** You are proposing a structural change to the model of modal space. Your opponents defend specific *constraints* on that model (isolation, identity, logic, utility). Do not defend the code; defend the metaphysical utility of the data structure.

  **Concessions to make up front:**
  1.  **Concede:** You are abandoning Lewisian "isolation." Worlds (paths) share nodes (versions).
  2.  **Concede:** S5 is not guaranteed on all DAG configurations.
  3.  **Hold:** The lineage *is* the object. The node is merely the object-at-a-world. This is the non-negotiable core.

  ---

  ### 1. The Lewisian Overlap Objection (Damage: Critical)
  **Who:** The Lewisians.
  **The Objection:** "Lewis defines a world as a maximal spatiotemporally connected sum. Crucially, worlds do not overlap; no object is part of two worlds. Your DAG requires nodes to be shared by multiple paths (branches). If a node belongs to two 'worlds,' you haven't built possible worlds; you've built branching time. You've collapsed the modal distinction into a temporal one. How do you prevent this from just being a theory of temporal parts?"

  **Your Reply (2 mins):**
  "I concede I reject Lewisian isolation. But isolation is a feature, not a metaphysical necessity. We need overlap to make sense of counterfactuals that share history. In my model, a 'world' is a maximal path, not a container. Two worlds can share a past (common ancestors) without being the same world, because they diverge later. This isn't temporal; it's modal branching. Temporal parts exist in time; lineage versions exist in modal space. The distinction is that temporal parts are ordered by *t*, lineage versions are ordered by *counterfactual dependence*. I am offering a topology where worlds are not islands but intertwined branches. This explains why we can talk about 'the same past' in different counterfactuals without mystery."

  **Soft Spot:** You are vulnerable to the charge that you haven't explained what *modal* branching is if it's not just *temporal* branching.
  **Hold:** The definition of "world" as a path.
  **Concede:** Lewisian isolation is dropped.

  ### 2. The S5 Validity Objection (Damage: Critical)
  **Who:** The Formal Semanticist.
  **The Objection:** "Standard metaphysical modality assumes S5: the accessibility relation is an equivalence relation (reflexive, symmetric, transitive). In a DAG with merges and branches, accessibility is rarely symmetric. If world A branches to B, B cannot access A if 'access' means 'is a descendant of.' If you lose symmetry, you lose S5. If you lose S5, you cannot model standard de re necessity. Are you prepared to say metaphysical necessity isn't S5?"

  **Your Reply (2 mins):**
  "I am prepared to say that *absolute* metaphysical necessity might not be S5, but that's a feature. S5 assumes all worlds are equally accessible from all worlds. But in a lineage, you can't access a branch that diverged before your root. However, we can recover S5 for specific contexts. If we define accessibility as 'shares a common lineage root,' we get an equivalence relation. The DAG allows us to model *graded* modality. Some truths are necessary relative to a sub-branch, others relative to the root. This gives us more expressive power than S5, not less. We preserve S5 for 'deep' necessities (root invariants) and use weaker systems for local contingencies."

  **Soft Spot:** Admitting S5 fails for metaphysical modality is a hard sell to a logician.
  **Hold:** The expressive power of graded modality.
  **Concede:** Standard S5 does not hold globally on the raw DAG structure.

  ### 3. The "Thisness" Objection (Damage: High)
  **Who:** The Kripkean.
  **The Objection:** "When I say 'Nixon might have lost,' I am talking about *Nixon*. Not a counterpart, not a version, not a node. I am talking about the man himself. Your theory says 'Nixon' is a lineage—a set of versions. But a set is not a man. If you deny literal transworld identity, you deny that *he* is in the other world. You've just dressed up Counterpart Theory in version-control clothing. How is this not just CT with extra steps?"

  **Your Reply (2 mins):**
  "It is not extra steps; it is a category correction. You think 'Nixon' refers to a node. I say 'Nixon' refers to the *thread* running through the nodes. In CT, the Nixon in world W is a distinct individual who resembles our Nixon. In LCT, the Nixon in world W is a *stage* of the single Nixon-lineage. We preserve your intuition that it is *him* because the lineage is a single continuant, but we preserve Lewis's insight that the *properties* vary by location. You get rigid designation of the lineage; Lewis gets world-bound properties. We get the best of both: the object is identical across worlds (as a lineage), but its manifestation is local."

  **Soft Spot:** If the lineage is identical across worlds, Lewisians will scream you've reverted to transworld identity.
  **Hold:** The lineage is the referent of the rigid designator.
  **Concede:** It is a form of transworld identity, but structural, not qualitative.

  ### 4. The Reification Objection (Damage: High)
  **Who:** The Philosophers of Language.
  **The Objection:** "You're treating a data structure as an ontology. A git DAG is a model we use to track changes. Why think reality *is* a DAG? You haven't solved the metaphysical problem of modality; you've just mapped it onto a software metaphor. Is the DAG in the world, or is it just a useful fiction for organizing our talk? If it's a fiction, your theory is instrumentalist. If it's real, what are the nodes made of?"

  **Your Reply (2 mins):**
  "It is an explanatory model, not necessarily a literal claim that the universe runs on Git. However, the structure captures the *logical relations* better than set-theoretic worlds. Whether the DAG is 'real' or 'conceptual' matters less than whether it preserves the truth conditions of our modal claims. I argue it does so better than isolated worlds because it handles counterfactual similarity naturally. If you treat worlds as fictions, treat the DAG as the fiction. But the *relations* in the DAG (ancestry, merge) correspond to real modal dependencies. I am offering a structural realism about modal space, not necessarily a material realism about nodes."

  **Soft Spot:** If you say it's just a model, they will ask why it solves metaphysical problems. If you say it's real, they ask for the substance.
  **Hold:** Structural realism.
  **Concede:** The "nodes" may not be material objects.

  ### 5. The Intrinsic Property Objection (Damage: Medium)
  **Who:** The Lewisians.
  **The Objection:** "Objects have intrinsic properties. If Nixon is a lineage, what are his intrinsic properties? On one branch he is 6'1", on another 6'0". If the lineage is the object, does the object have a definite height? If you say 'no,' you deny objects have intrinsic properties. If you say 'yes,' which one is it? You seem to reduce all properties to relational properties (version V has height H)."

  **Your Reply (2 mins):**
  "Properties are indexed to versions. The lineage *disposes* toward certain properties, but instantiation happens at the node. This isn't a bug; it explains vagueness. We ask 'How tall was Nixon?' and the answer is context-dependent on which version we are accessing. Intrinsic properties are those invariant across the lineage (e.g., origin). Extrinsic properties vary by branch. This solves the problem of accidental intrinsics: an object doesn't have contradictory properties because the properties belong to the *versions*, not the lineage whole."

  **Soft Spot:** Risks making the "object" (lineage) a bare particular with no properties of its own.
  **Hold:** Properties are version-indexed.
  **Concede:** The lineage itself has few intrinsic properties (mostly structural/origin).

  ### 6. The Quantifier Domain Objection (Damage: Medium)
  **Who:** The Formal Semanticist.
  **The Objection:** "In quantified modal logic, we ask: what is the domain of quantification? Do we quantify over nodes or lineages? If I say 'Everything is necessarily self-identical,' and I quantify over lineages, fine. But if I say 'There exists a president,' I mean a node-stage. You need a two-sorted logic. Does your semantics support standard quantification rules, or do we need new axioms for every claim?"

  **Your Reply (2 mins):**
  "We need a two-sorted logic, but that is a technical cost, not a metaphysical failure. Quantifiers range over lineages, but predicates apply to versions. $\forall x \Box P(x)$ means 'For every lineage, at every accessible version, P holds.' This handles nested modalities cleanly. It prevents the 'problem of accidental intrinsics' from breaking the logic. Yes, it requires new axioms, but it prevents the contradictions that arise when trying to force world-bound objects into rigid designation. The logic is more complex but more honest about the structure."

  **Soft Spot:** Introducing a non-standard logic makes your theory less attractive to logicians.
  **Hold:** Two-sorted logic is necessary.
  **Concede:** Standard QML needs adjustment.

  ### 7. The Essentialism Objection (Damage: Low)
  **Who:** The Kripkean.
  **The Objection:** "You define essential properties as those invariant across the lineage. But what if a property holds in all *accessible* worlds but not all *possible* worlds? If the DAG is incomplete, your 'essence' is just local necessity. How do you guarantee you have the *real* essence and not just the properties invariant on this specific graph?"

  **Your Reply (2 mins):**
  "The DAG represents logical space. If a property varies on *any* branch, it is not essential. If the graph is incomplete, our *knowledge* of essence is fallible, but the *definition* stands. Essence is invariance across the maximal DAG. This aligns with your view that essence is mind-independent. The difference is I provide a structural criterion for checking it: trace the lineage. If it breaks on a merge or branch, it's accidental."

  **Soft Spot:** Epistemic access to the "maximal DAG" is impossible.
  **Hold:** Definition of essence as invariance.
  **Concede:** Epistemic access to the full DAG is limited.

  ### 8. The "Merge" Objection (Damage: Low)
  **Who:** The Lewisians / Kripkeans.
  **The Objection:** "In Git, branches merge. Two histories become one. In metaphysics, if two possible worlds merge, do two objects become one? Does this imply fission and fusion of persons? If I merge with my counterpart, who am I?"

  **Your Reply (2 mins):**
  "Metaphysical merges are rare, but they model reconciliation of counterfactuals. If two branches merge, it means the divergence was temporary. The object remains one lineage. It doesn't imply two people become one; it implies two *histories* converge. We don't need to posit literal fusion of substances, just convergence of modal paths. Most modal space is branching, not merging. Merges are edge cases for specific counterfactual dependencies."

  **Soft Spot:** Merges are standard in Git, but metaphysically bizarre.
  **Hold:** Merges represent convergent counterfactuals.
  **Concede:** Merges are less common than branches.

  ---

  ### THE KILLER QUESTION (Hope nobody asks this)
  **The Question:** "You keep using the analogy of version control. In software, a commit hash is determined by its content and its parent. In your metaphysics, what determines the 'hash' of a possible version? Is it qualitative similarity? If so, you're back to Lewis. If not, what makes *this* node a version of *that* lineage rather than a different object entirely? You need a principle of transworld individuation, and you haven't given one."

  **Why it worries you:**
  This exposes the circularity risk. In Git, the hash is mathematical. In metaphysics, the "link" between versions is the very thing you are trying to explain (transworld identity). If you say "causal connection," you sound like a temporal theorist. If you say "similarity," you are a Lewisian. If you say "brute fact," you are mystifying.

  **Emergency Reply:**
  "The link is primitive modal dependence. Just as you accept 'possible' as primitive, I accept 'version-of' as primitive. The DAG doesn't explain *why* they are linked; it maps *that* they are linked. The value is in the topology, not the glue." (This is weak, but it stops the bleeding by admitting a primitive).
