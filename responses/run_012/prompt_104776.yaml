          *   Implication: Genes are replicators, not units of *selection* (which acts on interactors).
      *   *Thesis 4: The Statistical Elimination View (Radical).* "Unit of selection" is a misnomer. Selection is a statistical correlation.
          *   Status: Radical/Contested.
          *   Implication: Neither genes nor colonies are "units." Only the statistical change in population is real.

