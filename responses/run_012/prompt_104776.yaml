prompt: |-
  I cover science and ideas for a general-interest magazine, and I am working on a feature about the long-running units-of-selection debate—the argument over whether selection is most properly attributed to genes, individuals, groups, or some combination. In an interview last week, a theoretical biologist kept returning to a one-liner: the gene is a unit of bookkeeping, not a unit of selection. He deployed it to brush aside my question about whether a colony of social insects can be a unit of selection in its own right, and later to dismiss a colleague's claim that a toxin-antitoxin plasmid in a bacterial population is a genuine case of selection at the gene level. Before I use the line in the piece, I want to understand what it could actually be claiming. Lay out the distinct precise theses it might express, from the nearly trivial to the radical, and for each say whether it is a platitude, a substantive and defensible claim, or false. In particular, distinguish claims about the ontology of selection—what entities are real targets of selection—from claims about the accounting of selection—what entities are merely useful bookkeeping devices—and say which reading would actually support his dismissals. Use the two cases as test cases: a social-insect colony with sterile workers, and a selfish plasmid that spreads by killing cells that fail to inherit it. For each reading, say what it would imply about those cases, and which reading you think he most likely meant. I want this as a menu I can bring to a follow-up interview, not a single verdict. At the very end, give a final line beginning Bottom line: with a one-sentence summary of the reading that best makes sense of his use of the slogan.
