      *Wait, let's look closer at Mira 2 regarding KK.* Mira says "She does not need to know that she knows." In standard epistemology, this is *Defensible* (KK is not generally required for knowledge). However, Hal's point is about the *policy* of ignoring evidence. To adopt the policy, you need to know you are in the knowledge state. So Mira is *Doubtful* that KK is irrelevant *for the specific purpose of the policy*. I will nuance the justification.

