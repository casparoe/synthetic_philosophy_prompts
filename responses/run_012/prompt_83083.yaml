  **MEMORANDUM**

  **TO:** Principal Investigator, Department of Entomology
  **FROM:** University Institutional Animal Care and Use Committee (IACUC)
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Protocol #24-089: Robotic Interference in Apis Mellifera Communication

  **Decision: Approve with Modifications**

  The Committee has reviewed the proposed protocol involving the deployment of a robotic bee to simulate waggle dances indicating non-existent food sources. While the Committee recognizes the scientific merit of investigating honeybee communication plasticity and response to anomalous signals, approval is contingent upon specific modifications to the protocol's conceptual framing and welfare monitoring. The primary concern regards the use of anthropomorphic terminology—specifically "deception" and "belief revision"—without operational definitions that align with animal welfare assessments.

  **Reasoning**

  The proposed study aims to disrupt standard foraging communication to observe colony-level adaptation. The scientific value of understanding how *Apis mellifera* process conflicting spatial information is clear. However, the Committee must evaluate the procedure through the lens of potential distress and ethical justification, not merely experimental output. During review, significant concern was raised regarding the protocol's assertion that bees "form beliefs" and are subsequently "deceived."

  The Committee acknowledges the validity of the objection that attributing representational states or "beliefs" to insects is philosophically contentious and scientifically unproven. There is a substantive risk that framing this study as "deception" implies a cognitive complexity and corresponding capacity for psychological distress that may not exist. If the bees are merely responding to stimuli via conditioned reflexes, as critics suggest, then labeling the interaction as "deception" is misleading. Conversely, if the bees do possess some form of expectational state, the protocol must account for the welfare implications of violating those expectations.

  The Committee cannot adjudicate the philosophy of mind regarding insect cognition. However, we must ensure that the language used in the protocol accurately reflects the observable phenomena to prevent underestimating or overestimating animal welfare impacts. Using terms like "belief" suggests an internal mental state that we cannot monitor for distress. Using terms like "stimulus response" suggests a mechanical interaction that might ignore social disruption. The current protocol leans heavily into the former without providing behavioral metrics to substantiate the claim.

  Therefore, the Committee requires the language to shift from speculative cognitive states to measurable behavioral outcomes. This is not a rejection of the hypothesis, but a requirement for operational precision. If the lab wishes to test "belief revision," they must define what "belief" looks like behaviorally (e.g., flight vector accuracy, persistence after failed retrieval) and what "revision" looks like (e.g., latency to return, ignoring subsequent dances). This protects the integrity of the science by ensuring claims are backed by data, and it protects the animals by ensuring welfare monitoring is tied to observable stress behaviors rather than assumed cognitive frustration.

  Furthermore, the introduction of a robotic agent into the hive presents physical and social risks. The colony must not be destabilized to the point where hive viability is threatened. The "deception" aspect must not become a persistent stressor that degrades colony health over time.

  **Conditions of Approval**

  To proceed, the Principal Investigator must submit a modification request addressing the following points before any work begins:

  1.  **Terminology Revision:** All instances of "belief," "deception," and "trust" must be replaced or qualified in the protocol and subsequent publications. We recommend using "behavioral expectation," "signal conflict," and "response persistence." If cognitive terms are retained in discussion sections, they must be explicitly framed as heuristic models rather than confirmed physiological states.
  2.  **Operational Definitions:** The protocol must define specific behavioral criteria for what constitutes a "failed trip" and a "revised response." For example, specify the number of failed foraging attempts required before a bee is considered to have "ignored" the signal. This ensures endpoints are clear and not subject to researcher bias.
  3.  **Welfare Monitoring:** Add a specific monitoring plan for colony stress. This should include metrics such as brood care reduction, aggressive behavior toward the robot, or overall foraging efficiency drops beyond the experimental variable. If colony health declines by more than 15% relative to controls, the experiment must halt.
  4.  **Robot Retrieval:** The protocol must detail the method for retrieving the robotic bee if it is rejected or attacked by the hive guards to prevent contamination or physical harm to the bees.

  **Conclusion**

  The Committee supports the investigation into bee communication dynamics but insists on rigorous separation between observable behavior and cognitive attribution. By aligning the protocol's language with measurable outcomes, we ensure that the study remains scientifically defensible against claims of anthropomorphism while maintaining the highest standards of animal welfare. Please submit the modified protocol via the online portal within fourteen days.
