          2.  *Label:* The Solidarity Collapse Reading. *Claim:* Voters will revoke welfare if they perceive beneficiaries as outsiders. *Impossibility:* Motivational/Political. *Presupposition:* Welfare is a community of mutual identification. *Conditions:* Voters distinguish sharply between citizens and residents. *Verdict:* Contested. *Delivers:* Yes, predicts repeal.
