  **Project Development and Scoping**

  Your intuition separates the solution claim (coordination equilibrium) from the epistemic claim (common knowledge). Three sharpening paths emerge. First, you could test the epistemic threshold: how much mutual belief is required for stability? This is too logic-heavy for ten weeks. Second, you could model salience mechanics: how precedent forms locally. This is psychologically speculative and risks drifting from ontology. Third, you could focus on the stability of the equilibrium against normative invasion. This is the strongest path. It connects the formal property (evolutionary stability) to the ontological category (convention vs. norm). It is genuinely open because classical accounts assume equilibrium implies stability, while normativists assume sanctions are primitive rather than emergent. It is manageable because it relies on standard coordination games rather than complex epistemic logic. I will proceed with the third path: investigating whether evolutionary stability necessitates the emergence of sanctions, thereby transforming the ontological status of the regularity.

  ***

  **Research Proposal**

  **(1) The Question**
  Does the evolutionary stability of arbitrary coordination regularities necessitate the emergence of second-order sanctions, thereby transforming Lewisian conventions into normative institutions?
  *Sub-questions:* (a) Can pure coordination equilibria resist invasion by mutant strategies without sanctions? (b) If sanctions evolve endogenously, does the regularity retain its status as 'arbitrary'? (c) Does this structural shift require reclassifying the phenomenon from convention to norm?

  **(2) Why the Existing Positions Leave This Open**
  The classical analysis treats conventions as self-sustaining equilibria stabilized by common knowledge and precedent. Proponents assume that once a regularity is established, rational expectations maintain it; they have no reason to ask about stability against non-rational or normative invaders because the model assumes rationality. Conversely, accounts that emphasize the 'ought' of norms treat sanctions as primitive features of social structure. They assume norms *are* rules backed by force, so they have no reason to ask if sanctions emerge *from* coordination rather than preceding it. Neither camp asks whether the fragility of arbitrary equilibrium *forces* the introduction of sanctions to survive evolutionary pressure. This project occupies that gap: investigating whether the 'ought' is a functional requirement for the stability of the 'is'.

  **(3) Method**
  The paper will combine conceptual analysis with a lightweight formal model. Conceptually, I will reconstruct the distinction between a regularity sustained by preference alignment (convention) and one sustained by conditional punishment (norm). Formally, I will modify a standard coordination game (e.g., a driving-side game) to include a third strategy: 'punish deviators' at a personal cost. Using replicator dynamics or a simple agent-based simulation, I will test whether a population playing the conventional equilibrium is invaded by defectors unless the punishment strategy is available. The formal part will demonstrate the stability conditions; the conceptual part will interpret whether a convention protected by punishment remains 'arbitrary' in the Lewisian sense or has ontologically shifted into a norm. The formal model shows *if* sanctions emerge; the philosophy explains *what that means* for social ontology.

  **(4) Expected Results**
  *Confirmation:* The model shows pure coordination equilibria are unstable against small clusters of defectors, but stable when a punishment strategy evolves. This supports the suspicion that normativity (sanctions) is functionally required for convention stability.
  *Refutation:* The model shows coordination equilibria are evolutionarily stable without sanctions. This would suggest the 'ought' is not structurally necessary for conventions, preserving the classical distinction.
  *Failure:* If the simulation proves too complex to implement reliably, the project will pivot to a conceptual analysis of existing evolutionary models in the literature. This would still yield a paper arguing that the literature overlooks the stability condition, even without new data.

  **(5) Scope and Timeline**
  *Weeks 1–2:* Refine conceptual distinction between convention and norm; finalize payoff matrix for the game.
  *Weeks 3–5:* Build and test the simulation (using Python or NetLogo). Run baseline scenarios (no punishment) and experimental scenarios (with punishment).
  *Weeks 6–7:* Analyze results; draft the philosophical interpretation of the stability conditions.
  *Weeks 8–9:* Write full draft, integrating formal results with ontological claims.
  *Week 10:* Revise and polish.
  *Contingency:* If coding delays occur in Week 5, cut the simulation. Pivot to analyzing existing formal results from course readings to support the conceptual argument. This ensures the paper is finished even if the formal production fails. The core philosophical claim does not depend on original code, but on the interpretation of stability.
