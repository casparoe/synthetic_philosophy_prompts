answer: |-
  ### The Scenario

  The Ministry of Finance, aiming to alleviate poverty without triggering inflationary speculation, issues a directive granting immediate, substantial tax credits to all households earning below a specific threshold. The content is widely praised by ethicists and opposition parties as a model of distributive justice. The directive is internally consistent, prospective regarding future filings, and officials apply it congruently to every eligible applicant. However, to prevent wealthier actors from restructuring assets to qualify, the Ministry classifies the specific eligibility criteria and the directive itself as "Operational Confidential," accessible only to tax auditors; citizens learn they qualify only after the auditor applies the rule to their past returns. The enabling statute grants the Ministry broad power to issue "binding tax instructions" but is silent on whether those instructions must be published to be valid.

  ### The Analysis

  **Hart's Verdict:** Hart would likely classify this as **law**. For Hart, the existence of a legal rule depends on its source, not its merit or its procedural perfection. If the Ministry's directive satisfies the system's Rule of Recognition (e.g., "instructions issued by the Ministry under the Tax Act are valid"), it is a valid legal rule. The secrecy is a moral or prudential defect, and perhaps a violation of a *different* legal requirement if the statute implied publicity, but it does not negate the rule's legal character. As long as the secondary rules of the system recognize the Ministry's output as binding, the separability thesis holds: a secret rule can still be a legal rule.

  **Fuller's Verdict:** Fuller would likely classify this as **not law** (or a catastrophic failure of law). For Fuller, law is the "enterprise of subjecting human conduct to the governance of rules." A rule that is secret cannot guide conduct; citizens cannot orient their behavior by a rule they cannot know. This violates the first desideratum of the Inner Morality of Law (promulgation). Even though the outcome is morally admirable, the mode of governance fails to respect the agency of the subject. It functions as a managerial command or a brute exercise of power, but it lacks the reciprocity required for a legal order.

  **The Single Feature:** **Promulgation.** All other features (consistency, prospectivity, congruence, generality) are held fixed and satisfied. The divergence rests entirely on whether a norm that cannot be known by the subject can count as *law*.

  **Deleting the Feature:** If the directive were published, Hart and Fuller would converge: both would call it law. Hart because the source is valid; Fuller because the Inner Morality is satisfied. The disagreement vanishes, proving that promulgation is the sole engine of the divergence in this case.

  **Counter-Arguments:**
  *   **Hartian Attack:** A Hartian might argue that "law" is a system-wide concept. If the *system* generally requires promulgation, this secret directive is an anomaly but still a valid exercise of power recognized by the Rule of Recognition. They might distinguish between "validity" (is it law?) and "compliance" (should officials follow it?).
  *   **Fullerian Attack:** A Fullerian might argue Hart is engaging in "conceptual blindness." By calling this "law," Hart obscures the functional difference between a rule that guides and a command that blindsides. They would insist that calling this "law" is not just a category error but a moral hazard.

  **Concept of Law vs. Rule of Recognition:**
  This is the critical pivot. For Hart, this is a dispute about the **Rule of Recognition** of this specific legal system. If the system's RoR includes a "must be published" criterion, Hart agrees it's not law. If the RoR is silent, it *is* law. Hart denies that promulgation is a necessary condition of the *concept* of law universally. For Fuller, promulgation is a necessary condition of the **concept of law** itself, transcending any specific RoR. A norm that fails this test isn't just "invalid law"; it falls outside the category of law entirely (or is so degraded it shouldn't bear the name).

  ### Epistemic & Theoretical Flags

  1.  **Fuller's "Not Law" Claim:** Scholarship is divided on whether Fuller meant rules failing the Inner Morality are *literally* not law, or simply "defective/degraded" law that loses its claim to fidelity. In a seminar, you must flag this: if Fuller only claims it is *bad* law, the divergence with Hart softens (Hart agrees it's bad law; Fuller agrees it's law but bad). The thought experiment works best if you press Fuller's stronger claim: that extreme procedural failure negates legal status.
  2.  **Inclusive vs. Exclusive Positivism:** Hart's verdict depends on whether one adopts Exclusive Positivism (RoR cannot include moral/procedural tests) or Inclusive Positivism (RoR *can* include them). If the RoR includes "must be published," an Inclusive Positivist agrees with Fuller. The divergence is starkest under Exclusive Positivism, which is a contested reading of Hart.
  3.  **Concept vs. Adjudication:** Ensure students see this isn't about how a judge should decide a hard case (adjudication). Hart and Fuller might agree a judge *should* strike this down. The dispute is ontological: does the norm *exist* as law before the judge rules? Hart says yes; Fuller says no.
  4.  **Why Not the "Awkward" Direction (Fuller Yes, Hart No)?** I avoided the scenario where Fuller says "Yes" and Hart says "No" (e.g., an unenacted but perfectly clear/customary norm) because it risks collapsing into a dispute about the *content* of the Rule of Recognition (i.e., does the RoR recognize custom?). That turns a conceptual debate into a sociological one about what officials accept. The "Secret Law" case isolates the *conceptual* commitment to procedure (Fuller) versus source (Hart) more cleanly.
