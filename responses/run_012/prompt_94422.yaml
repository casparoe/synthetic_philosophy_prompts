answer: |-
  **Characters:**

  *   **ALEX:** A critical rationalist. Sharp, impatient with what she sees as intellectual cowardice.
  *   **BEN:** A Wittgensteinian. Calmer, focused on the conditions of meaning and practice.

  **Setting:** A quiet corner of a faculty lounge. Coffee cups on the table.

  ***

  **ALEX:** So, are we going to talk about Dave, or are we going to pretend he didn't say what he said?

  **BEN:** I'd rather not talk about Dave. I'd rather talk about what he was doing.

  **ALEX:** He was opting out. He said he might have come into existence five minutes ago. Complete with memories. It's a classic get-out-of-jail-free card. If I say, "Dave, you promised to pay me back," he says, "That memory might be implanted." If I say, "Here's a photo of us," he says, "The photo might have been created five minutes ago too." It's unfalsifiable. It's not a claim; it's a shield.

  **BEN:** I agree it's a shield. But not because it's unfalsifiable. Because it doesn't function as a claim.

  **ALEX:** That sounds like a distinction without a difference. If you say something about the world, I should be able to check it. If you structure it so I can't check it, you've removed it from the realm of knowledge. You've made it dogma.

  **BEN:** Dogma implies you believe it and refuse to look at evidence. Dave isn't refusing evidence. He's saying the concept of evidence presupposes a past. If there is no past, there is no evidence. He's not protecting a belief; he's exposing a structure.

  **ALEX:** He's protecting himself from being wrong. That's the danger. Whenever someone parks a proposition beyond criticism, they stop learning. My rule is simple: if you can't criticize it, you can't improve it. If you can't improve it, it's dead weight. Dave's hypothesis is dead weight.

  **BEN:** But here's the thing, Alex. You say everything must be open to criticism. Is *that* statement open to criticism?

  **ALEX:** Of course. Criticize it.

  **BEN:** Okay. If I criticize it, I have to use reasons. Those reasons rely on logic, language, shared definitions. If I doubt those, I can't criticize anything. So, to criticize your rule, I have to assume a framework where criticism makes sense. That framework itself isn't being criticized in the moment. It's the hinge the criticism turns on.

  **ALEX:** I'm not saying we criticize the framework *while* we're using it. I'm saying we never treat the framework as *true* in a foundational sense. We treat it as a conjecture. We use it until it breaks.

  **BEN:** But Dave's claim isn't that his framework is true. It's that the doubt itself is empty. You're treating his doubt like a hypothesis. "Maybe the world started five minutes ago." You say, "I can't test that, so it's bad science." I'm saying, "You can't doubt that, so it's not science." It's not a bad hypothesis; it's not a hypothesis.

  **ALEX:** Why? Because you can't test it?

  **BEN:** Because testing implies a before and an after. If you remove the "before," you remove the possibility of a test. It's not that the test is hard; it's that the grammar of "test" doesn't apply. You're treating it like a scientific error. I'm treating it like a category mistake.

  **ALEX:** But the effect is the same! You're giving it immunity. You're saying, "We don't doubt this." I'm saying, "Nothing gets immunity." If you grant immunity to the past, why not immunity to God? Why not immunity to the Party Line? You're drawing a line where nothing can be questioned, and history shows that's where things go rot.

  **BEN:** I'm not drawing a line around *truth*. I'm drawing a line around *sense*. If you question whether the earth existed yesterday, you aren't being rigorous. You're losing your grip on what "earth" and "yesterday" mean. You're not being a better skeptic; you're becoming unintelligible.

  **ALEX:** So certainty is just intelligibility?

  **BEN:** Certainty isn't a mental state. It's a way of acting. I don't *know* the earth existed yesterday. I act as if it did. So do you. So does Dave, when he isn't philosophizing. When he orders coffee, he assumes the beans were roasted before he walked in.

  **ALEX:** He assumes it provisionally. That's the key word. Provisionally. I act as if the past exists, but I hold it open to revision. If evidence came up—hard evidence—that the world was created five minutes ago, I'd change my mind.

  **BEN:** What would that evidence look like?

  **ALEX:** I don't know. A note from the creator? A glitch in the physics?

  **BEN:** But to recognize a glitch, you need a standard of how physics usually works. That standard relies on the past. You're saying you'd revise the past based on evidence from the past. You're circling.

  **ALEX:** I'm not circling. I'm saying my commitment to the past is a policy, not a foundation. I choose to treat the past as real because it's useful. If it stops being useful, I drop it. You're saying you *can't* drop it. That makes you a prisoner of your own grammar.

  **BEN:** And you're a prisoner of your own policy. You say everything must be criticizable. But you can't criticize that policy without using it. You're standing on the very thing you say is movable.

  **ALEX:** I know I'm standing on it. I just refuse to call it concrete. I call it scaffolding. Scaffolding can be moved.

  **BEN:** Not while you're standing on it. And not all of it at once. If you try to move all the scaffolding at once, you fall. There are some things you just don't move. They aren't beliefs. They're the riverbed.

  **ALEX:** Okay, let's look at that. The riverbed. You say it's not a belief. It's just how we go on. But isn't that just a fancy way of saying "dogma"? You've taken a proposition—"The world existed five minutes ago"—and you've removed it from the court of appeal. You've immunized it.

  **BEN:** No. I haven't immunized the proposition. I've dissolved the proposition. I'm saying it's not doing the work of a proposition.

  **ALEX:** But here's the dilemma for you. Either that riverbed is criticizable, or it isn't. If it is, then it's just another conjecture, and I'm right. If it isn't, then you've found a foundation. You've found something secure. And I thought we agreed there were no secure foundations.

  **BEN:** We did agree. There are no secure foundations. There are only insecure practices. But "secure" isn't the point. "Necessary" is the point. You need a floor to walk on. That doesn't make the floor true. It makes it necessary for walking.

  **ALEX:** But you can check the floor. You can tap it with a hammer. You can't tap the past with a hammer.

  **BEN:** You tap it with your life. You live as if it's there.

  **ALEX:** (Pauses) Okay. Let's step back. We both hate the idea of a self-justifying truth. A magic stone that says "I am true" and stops the inquiry.

  **BEN:** Absolutely. I'm not saying the past is justified. I'm saying it's not the kind of thing that *needs* justification.

  **ALEX:** And I'm saying that treating it as not needing justification is how dogmas start. But... (She hesitates) ...I will concede this. My rule. "Everything must be open to criticism."

  **BEN:** Yes?

  **ALEX:** I can't justify that rule without using the rule. If you ask me why we should criticize everything, I can't give you a neutral reason. I have to assume that criticism is valuable. So, in a sense, I'm holding that rule uncriticized. It's my own hinge.

  **BEN:** Exactly. So you have hinges too.

  **ALEX:** Don't gloat. It stings to admit it. But here's the difference. I admit it's a commitment. I own it as a choice. You talk like it's a fact about the world. "This is how language works." No. It's how *you* work.

  **BEN:** It's how anyone works who speaks.

  **ALEX:** Is it? Dave spoke. He questioned it. He didn't stop speaking. He didn't become unintelligible. We understood him perfectly. He said, "I might have started five minutes ago." We knew what he meant. So it is intelligible. You just don't like the consequences.

  **BEN:** We knew what he meant because we assumed he was playing a game. We assumed he knew what "five minutes" meant. If he *really* doubted it, he couldn't use the words. He was borrowing our certainty to express his doubt. That's parasitic.

  **ALEX:** And my method is parasitic too. I borrow certainty to criticize. I assume logic works to criticize logic. So we're both borrowing. The question is: what do we do with the debt? I say we acknowledge it and keep trying to pay it down. You say the debt is illusory.

  **BEN:** I say the demand for payment is the confusion.

  **ALEX:** But if you don't demand payment, you get inflation. You get dogma. Look at Dave. He's not just playing a game. He's using this to avoid responsibility. He's using "structural necessity" to dodge a debt he owes me.

  **BEN:** Then criticize his action. Criticize the dodging. Don't criticize the structure of time.

  **ALEX:** I can't separate them. The structure is the tool he's using to dodge. If I say "That structure is non-negotiable," I'm helping him hide. If I say "That structure is a conjecture," I force him to defend it. Even if he can't. The *attempt* to defend it is where the work happens.

  **BEN:** But he can't defend it. So you're forcing him to play a game he can't play. You're demanding justification where there is none. That's not rigor. That's cruelty.

  **ALEX:** It's not cruelty. It's hygiene. If we don't ask for justification there, where do we stop? If the past is safe, what else is safe?

  **BEN:** Not everything else. Just the things that make the asking possible.

  **ALEX:** (Leans forward) But who decides? You? Me? The community? If it's the community, then certainty is just consensus. And consensus can be wrong.

  **BEN:** Certainty isn't consensus. It's agreement in action. We don't agree that the world exists. We act as if it does. There's no vote.

  **ALEX:** And if our actions change? If humanity starts acting as if the world started five minutes ago?

  **BEN:** Then the language changes. Then "past" means something else.

  **ALEX:** So truth is mutable.

  **BEN:** Truth is dependent on the game.

  **ALEX:** And my game is "never stop questioning." Your game is "know when to stop."

  **BEN:** My game is "know when you're not playing anymore."

  **ALEX:** (Sits back) We agree there's no foundation. No magic stone.

  **BEN:** We agree.

  **ALEX:** But I say we must act as if there are no hinges. We must treat everything as if it can swing open. You say we must acknowledge the hinges and leave them alone.

  **BEN:** I say we acknowledge them so we don't try to swing them open and break the door.

  **ALEX:** And I say if we don't try to swing them open, we'll never know if the door is locked from the outside.

  **BEN:** You can't check the lock from the outside. You're inside.

  **ALEX:** Then I'll rattle the door until the hinges scream.

  **BEN:** And I'll tell you when you're shaking the wall instead of the door.

  **ALEX:** So we're stuck.

  **BEN:** We're working.

  **ALEX:** (Looks at her watch) Dave's going to be here in five minutes. He's going to ask for a loan.

  **BEN:** Are you going to ask him for evidence he existed yesterday?

  **ALEX:** No. I'm going to ask him for collateral.

  **BEN:** Why?

  **ALEX:** Because even if the world started five minutes ago, he still owes me money. Some hinges hold weight, even if they aren't true.

  **BEN:** (Smiles slightly) There it is.

  **ALEX:** Don't push it. I'm still criticizing the hinge. I'm just doing it with a contract.

  **BEN:** And I'll witness the signature. Not because I know you'll exist tomorrow, but because that's what witnessing is.

  **ALEX:** Fine. But if he says the signature was implanted five minutes ago...

  **BEN:** Then we stop playing.

  **ALEX:** No. Then we start fighting.

  **BEN:** Then we start fighting.

  *(They sit in silence for a moment, the disagreement hanging between them, unresolved.)*
