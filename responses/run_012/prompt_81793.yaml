answer: |-
  ### I. The Desiderata: Sorted and Annotated

  To move beyond case-by-case intuition trading, we must distinguish between formal constraints on ranking, substantive constraints on welfare, and partisan structural commitments. The following list is sorted by logical priority. Items in **Section A** are preconditions for any axiology. Items in **Section B** are substantive constraints widely accepted as genuine. Items in **Section C** are structural commitments that function as adequacy conditions only within specific theoretical camps.

  **Note on Scope:** All references to "subjects" denote sentient beings capable of valenced experience. No requirement assumes cognitive sophistication, narrative self-conception, or temporal extension beyond the capacity for suffering or flourishing.

  #### A. Formal Rationality (Genuine Constraints)
  *These are requirements for the ranking relation itself. Violating them renders the theory logically incoherent.*

  1.  **Transitivity**
      *   **Specification:** If Outcome $X$ is at least as good as $Y$, and $Y$ is at least as good as $Z$, then $X$ is at least as good as $Z$.
      *   **Motivation:** Prevents money-pump scenarios and cyclical preferences. If a theory ranks $A$ better than $B$, $B$ better than $C$, but $C$ better than $A$, it cannot guide choice.
      *   **Work:** Rules out cyclic theories of value.
      *   **Relation:** Precondition for all other comparative claims.

  2.  **Completeness**
      *   **Specification:** For any two outcomes $X$ and $Y$, either $X$ is better than $Y$, $Y$ is better than $X$, or they are equally good.
      *   **Motivation:** An axiology that declares outcomes "incomparable" in standard variable population cases fails to rank outcomes, which is the defined purpose of the theory.
      *   **Work:** Forces a verdict on hard cases rather than allowing silence.
      *   **Tension:** Often sacrificed to avoid counterintuitive results (e.g., declaring a vast mediocre population incomparable to a small flourishing one).

  #### B. Welfare Sensitivity (Genuine Constraints)
  *These constrain how the theory responds to changes in welfare. They are neutral regarding population size but sensitive to quality of life.*

  3.  **Same-Number Dominance**
      *   **Specification:** If Outcome $X$ and $Y$ contain the same number of subjects, and every subject in $X$ has higher welfare than their counterpart in $Y$, then $X$ is better than $Y$.
      *   **Concrete Case:** Compare a world with 1 billion flourishing subjects vs. a world with 1 billion suffering subjects (identical identities or roles).
      *   **Work:** Ensures the theory tracks welfare, not just headcounts.
      *   **Relation:** Special case of Pareto (below) restricted to fixed populations.
      *   **Species-Neutrality:** Requires only that "higher welfare" be defined by phenomenal state, not achievement.

  4.  **Negative Dominance (Non-Sadism)**
      *   **Specification:** Adding a subject with negative welfare (a life not worth living), holding all else constant, makes the outcome worse.
      *   **Concrete Case:** Outcome $A$ has 1 million flourishing subjects. Outcome $B$ has 1 million flourishing subjects + 1 subject in agony. $A$ must be better than $B$.
      *   **Work:** Rules out theories that treat negative welfare as a mere neutral zero or a positive contribution to total sum.
      *   **Relation:** Stronger than Weak Non-Sadism (which only says adding misery is not *good*).

  5.  **Existence Independence**
      *   **Specification:** The value of an outcome depends only on the welfare of those who exist in it, not on those who might have existed but do not.
      *   **Motivation:** Prevents "ghost" subjects from influencing the ranking of actual outcomes.
      *   **Flag:** [HUMAN-SHAPED BIOGRAPHY RISK] Standard formulations sometimes assume "possible people" have identities comparable to actual people. For non-human sentients, "identity" is often merely numerical distinctness. The requirement must be phrased as: *The ranking of $X$ and $Y$ is unaffected by the welfare levels of subjects existing in neither.*

  #### C. Structural Commitments (Partisan "Adequacy" Conditions)
  *These are often presented as constraints but are actually substantive theoretical commitments. Satisfying one often violates another.*

  6.  **The Person-Affecting Restriction (PAR)**
      *   **Specification:** An outcome $X$ can be better than $Y$ only if there is at least one subject for whom $X$ is better than $Y$. (Alternatively: $X$ cannot be worse than $Y$ unless there is someone for whom $X$ is worse).
      *   **Concrete Case:** Choosing between creating a flourishing child ($A$) or a different, equally flourishing child ($B$). PAR implies $A$ is not better than $B$ because no one exists in both for whom one is better.
      *   **Work:** Enforces the intuition that morality is about *how we treat individuals*, not maximizing abstract value.
      *   **Status:** **Partisan.** This is the commitment of the person-affecting camp dressed as a constraint. It contradicts Impersonal Totalism.
      *   **Tension:** Directly conflicts with **Same-Number Dominance** in non-identity cases (where the subjects differ between outcomes). If identities differ, PAR says "neither is better," while Dominance says "the one with higher welfare is better."

  7.  **The Impersonal Total Principle (ITP)**
      *   **Specification:** The value of an outcome is the sum of welfare across all subjects. More positive welfare is always better, regardless of distribution or identity.
      *   **Concrete Case:** A world with 1 subject at +10 welfare vs. a world with 100 subjects at +1 welfare. ITP ranks the second as better (100 > 10).
      *   **Work:** Provides a simple metric for variable population ranking.
      *   **Status:** **Partisan.** This is the commitment of classical utilitarianism dressed as a constraint.
      *   **Tension:** Directly generates the Repugnant Conclusion when combined with **Transitivity** and **Benign Addition** (see Section II).

  8.  **Anti-Malthusian Constraint (Avoidance of the Repugnant Conclusion)**
      *   **Specification:** There exists some outcome $A$ (small population, very high welfare) such that no outcome $Z$ (massive population, very low positive welfare) is better than $A$.
      *   **Concrete Case:** Comparing a world of 1 billion beings living rich, complex lives vs. a world of 10 trillion beings living lives barely worth living (muzak and potatoes, or equivalent non-human gratification).
      *   **Work:** Blocks the inference that quantity can always trump quality.
      *   **Status:** **Partisan.** While often treated as a "datum," accepting this requires rejecting the Impersonal Total Principle. It is a substantive claim about the diminishing marginal value of lives.
      *   **Flag:** [HUMAN-SHAPED BIOGRAPHY RISK] The intuition often relies on the loss of "higher goods" (art, autonomy). For non-human sentients, "low positive welfare" is simply mild contentment. The constraint must hold even if the "high welfare" state is merely robust health and play, not intellectual achievement.

  9.  **Benign Addition (The "Mere Addition" Claim)**
      *   **Specification:** Adding a subject with positive welfare, without affecting the welfare of existing subjects, is not worse than the original outcome.
      *   **Concrete Case:** Outcome $A$ has 1 million flourishing subjects. Outcome $A+$ has those 1 million + 1 new flourishing subject. $A+ \ge A$.
      *   **Work:** Captures the intuition that creating happy lives is not a harm.
      *   **Status:** **Partisan.** Stronger versions claim it is *better*. Weaker versions claim it is *not worse*.
      *   **Tension:** This is the primary engine of the Repugnant Conclusion when combined with **Transitivity**.

  ---

  ### II. The Impossibility Result: The Inconsistent Triad

  You suspect that three specific requirements cannot be satisfied together. You are correct. Below is the proof that **Transitivity**, **Benign Addition**, and **Anti-Malthusian Constraint** (combined with **Same-Number Dominance**) form an inconsistent set.

  **The Setup:**
  Let $W$ be a welfare scale where $0$ is neutrality, $>0$ is worth living, and $<0$ is not worth living.
  Let $N$ be population size.
  Let $V(X)$ be the value of outcome $X$.

  **The Three Claims:**
  1.  **Quality Dominance (QD):** For any fixed $N$, if average welfare in $X$ is significantly higher than in $Y$, $X$ is better than $Y$. (Motivation: Uniform misery < Uniform flourishing).
  2.  **Benign Addition (BA):** If $X$ is obtained from $Y$ by adding subjects with positive welfare without lowering existing welfare, $X$ is at least as good as $Y$. (Motivation: Adding a life worth living is never bad).
  3.  **Repugnance Avoidance (RA):** There is some outcome $A$ (High Welfare, Low $N$) such that for any outcome $Z$ (Low Positive Welfare, High $N$), $A$ is better than $Z$. (Motivation: Avoid the Repugnant Conclusion).

  **The Proof:**
  1.  Start with Outcome $A$: $N=10^9$, Welfare $= +100$ (High).
  2.  Construct Outcome $A+$: Add $10^9$ subjects with Welfare $= +50$. Existing subjects remain at $+100$.
      *   By **BA**, $A+ \ge A$.
  3.  Construct Outcome $B$: Redistribute welfare in $A+$ to create equality. $N=2 \cdot 10^9$, Welfare $= +75$ (Average).
      *   By **QD** (assuming equality is preferred or at least not worse than inequality with same total), $B \ge A+$.
      *   By **Transitivity**, $B \ge A$.
  4.  Repeat the process. From $B$, add more subjects at $+50$, then equalize to $C$ (Larger $N$, Lower Average).
      *   By **BA** and **QD**, $C \ge B$.
      *   By **Transitivity**, $C \ge A$.
  5.  Continue this chain $k$ times until we reach Outcome $Z$: $N=10^{15}$, Welfare $= +1$ (Barely worth living).
      *   At every step, the addition is Benign (positive welfare added), and the equalization preserves value (by QD assumptions regarding total/average trade-offs).
      *   By **Transitivity** across the chain, $Z \ge A$.
  6.  **Contradiction:** **RA** states $A > Z$. The chain proves $Z \ge A$.

  **The Casualty:**
  One of the three must be rejected.
  *   If you keep **BA** and **QD**, you must accept **RC** (Reject RA). This is the Total View.
  *   If you keep **RA** and **QD**, you must reject **BA**. You must admit that adding a life worth living *can* be worse (e.g., if it lowers the average enough). This is the Critical Level or Average View.
  *   If you keep **RA** and **BA**, you must reject **QD** or **Transitivity**. You must admit that a world of uniform misery could be ranked above a world of uniform flourishing (if the misery world is huge enough), or that "better than" is not transitive. This is the Intransitive or Lexical View.

  **Conclusion on the Triad:** The tension is real. You cannot hold that (1) Quality matters for same-sized populations, (2) Adding good lives is never bad, and (3) Quantity cannot trump Quality, while maintaining logical consistency.

  ---

  ### III. Assessing Your Friend's Claim

  Your friend argues: *The Repugnant Conclusion only looks repugnant because we compare a vast mediocre population with a small flourishing one from the standpoint of someone choosing which life to live, and that comparing the outcomes from the standpoint of each person in them would dissolve the repugnance.*

  This claim is **visible in the desiderata** as a conflict between **Impersonal Total Principle (ITP)** and **Person-Affecting Restriction (PAR)**.

  1.  **The Friend's Diagnosis:** The friend identifies that RC arises from **ITP** (Desideratum C.7). ITP aggregates value impersonally. From an impersonal standpoint, $10^{15}$ units of value is greater than $10^9$ units, regardless of distribution.
  2.  **The Friend's Solution:** The friend suggests shifting to a "standpoint of each person." This is an appeal to **PAR** (Desideratum C.6). If we ask, "Is $Z$ better than $A$ for the people in $A$?", the answer is No (they don't exist in $Z$). If we ask, "Is $Z$ better than $A$ for the people in $Z$?", the answer is Yes.
  3.  **Why the Friend is Partially Wrong:**
      *   If you adopt **PAR** to dissolve RC, you solve the Repugnance problem but create the **Non-Identity Problem**.
      *   In variable population choices, the subjects in $A$ and $Z$ are often numerically distinct (different conceptions, different species, etc.).
      *   If **PAR** holds, $A$ is not better than $Z$ (no one in $A$ is worse off in $Z$) and $Z$ is not better than $A$ (no one in $Z$ is worse off in $A$).
      *   This leads to **Incomparability** (violating **Completeness**, Desideratum A.2).
      *   **Verdict:** The friend is correct that RC is a product of Impersonal Aggregation. However, shifting to the "standpoint of persons" does not dissolve the problem; it merely trades the Repugnant Conclusion for the conclusion that we cannot say a world of flourishing is better than a world of misery if the populations differ.
      *   **Visibility in Desiderata:** The tension is explicitly marked in Section C between **ITP** (which yields RC) and **PAR** (which yields Incomparability). There is no third option that satisfies both **Completeness** and **Avoid RC** without modifying **Benign Addition**.

  ---

  ### IV. Ranking the Exclusionary Power

  **Requirement:** The Person-Affecting Restriction (PAR).

  **Justification:** The Person-Affecting Restriction excludes the most otherwise attractive theories because it renders the mathematical machinery of aggregation (summing, averaging, discounting) incoherent in the very domain (variable populations) the theory is meant to address. While **Avoiding the Repugnant Conclusion** kills Total Utilitarianism, **PAR** kills Total Utilitarianism, Average Utilitarianism, Critical Level Utilitarianism, and Prioritarianism simultaneously, replacing them with a framework that struggles to provide *any* ranking in non-identity cases. It demands a structural overhaul of axiology that forces the abandonment of Transitivity or Completeness to function, making it the most costly single commitment to adopt.
