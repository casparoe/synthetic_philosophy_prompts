answer: |-
  The illegitimate work is being done by **step (7)**.

  Here is why that step is the break, why it deceives you, and the price of repairing it.

  **Why it looked innocent**
  Step (7) masquerades as a modest correction to genetic determinism. Having correctly established in step (6) that high heritability does not entail immutability, the argument tempts you to swing the pendulum to the opposite extreme. It relies on a false dichotomy: that a statistic must either describe a fixed destiny or it is entirely irrelevant to intervention. This feels like a liberation from the grim implications of step (3), so it disarms your scepticism. It appears to be merely clearing the deck of biological fatalism, when in fact it is smuggling in a claim of epistemic nihilism.

  **The logical break**
  The inference from (6) to (7) is a non-sequitur. Step (6) proves that heritability is not a measure of *immutability*. Step (7) falsely concludes that it is therefore not a measure of *malleability constraints*. Knowing the heritability of a trait tells you about the current architecture of variance in a population. This is vital information for policy. For instance, if a trait is highly heritable in a specific context, it suggests that environmental interventions which work uniformly across the population may have limited success in reducing *variance* between individuals, even if they shift the *mean*. Conversely, it may indicate that personalised interventions targeting specific genetic susceptibilities would be more efficient. To say it tells us "nothing" is to confuse the source of variance with the potential for change.

  **What it costs you to give it up**
  If you reject (7), you lose the comfort of ignoring genetics in social planning. You cannot simply dismiss heritability estimates as useless because they do not guarantee fixity. Instead, you are obliged to treat heritability as a diagnostic tool that constrains your expectations. It costs you the simplicity of a purely environmentalist policy model. You must accept that while the environment can change the trait (as per step 6), the *response* to that environmental change is itself patterned by genetic differences. You are forced to engage with the complexity of gene-environment interplay rather than waving it away as irrelevant.

  **Verdict**
  Discard (7). Retain (6). Accept that heritability does not forbid change, but it does inform the strategy required to achieve it.
