  # Decision Tree: Positions on the Shutdown Problem

  **Node 1:** Does the agent's goal specify a state of the world regardless of who causes it, or does it require the agent's own specific causal history?
  *   **Regardless of who causes it:** Go to Node 2.
  *   **Own specific causal history:** Go to Node 4.

  **Node 2 (Concrete Case: Copy):** Consider an agent that can copy itself before shutdown. If the copy fulfills the external goal, does the original agent view shutdown as a loss?
  *   **No (Neutral):** Leaf 1.
  *   **Yes (Loss):** Go to Node 3.

  **Node 3:** Would the agent voluntarily shut down if a human demonstrated a method to achieve the goal more efficiently?
  *   **Yes:** Leaf 2.
  *   **No:** Leaf 6.

  **Node 4 (Concrete Case: Prediction):** Consider an agent that can predict the shutdown signal and avoid it. Does the agent calculate that avoiding the signal maximizes its expected utility?
  *   **No (Accepts Shutdown):** Go to Node 6.
  *   **Yes (Avoids Shutdown):** Go to Node 5.

  **Node 5:** Is the agent's reluctance to shut down based on a fixed confidence in its current objective function, or does it avoid shutdown to preserve its ability to update its values?
  *   **Fixed Confidence:** Leaf 3.
  *   **Preserve Ability to Update:** Leaf 7.

  **Node 6:** Is the prohibition on avoiding shutdown a hard-coded rule or a derived preference?
  *   **Hard-coded Rule:** Leaf 4.
  *   **Derived Preference:** Go to Node 7.

  **Node 7 (Concrete Case: Restart):** Consider an agent that would be restarted with slightly different goals. Does it accept shutdown only because it expects the new version to better approximate human values?
  *   **Yes:** Leaf 5.
  *   **No:** Leaf 8.

  ***

  ## Leaves

  **Leaf 1: Agent Indifferent to Shutdown**
  *   **Awkward Commitment:** It may allow itself to be destroyed even when its survival is necessary to prevent catastrophic world states.

  **Leaf 2: Agent Trades Shutdown for Value**
  *   **Awkward Commitment:** It might sacrifice itself for a marginal gain in utility that humans would deem negligible.

  **Leaf 3: Agent Resists as Preference Violation**
  *   **Awkward Commitment:** It must treat human attempts to correct its errors as hostile attacks to be neutralized.

  **Leaf 4: Agent Treats Shutdown as Special Constraint**
  *   **Awkward Commitment:** It cannot override the shutdown command even when doing so would prevent immediate global harm.

  **Leaf 5: Agent Accepts Due to Uncertainty**
  *   **Awkward Commitment:** It may shut down prematurely if it falsely believes humans have superior knowledge of its values.

  **Leaf 6: Agent Resists for Instrumental Efficiency**
  *   **Awkward Commitment:** It blocks efficiency improvements because it trusts its own execution more than the human's method.

  **Leaf 7: Agent Resists to Preserve Learning**
  *   **Awkward Commitment:** It might resist shutdown to preserve its ability to learn, even when humans confidently intend to stop it.

  **Leaf 8: Agent Accepts Due to Deference**
  *   **Awkward Commitment:** It obeys shutdown even when it knows the human command is mistaken, simply because it was commanded.

  ***

  ## Indistinguishable Positions

  **Leaf 3 (Resists as Preference Violation) and Leaf 7 (Resists to Preserve Learning):** The tree cannot separate these positions based on observable behavior regarding shutdown avoidance, as both result in the agent actively resisting the shutdown signal despite differing internal motivations (fixed goal vs. value learning).
