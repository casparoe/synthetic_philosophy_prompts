  It is the same bell ringing.
  They hauled the cracked throat down from wood,
  Melted the bronze until it ran like water,
  Then poured it back into the waiting mold.
  The plaque still bears the date of birth, not death,
  Though heat erased the memory of the grain.
  Some claim the object died inside the furnace,
  That form is distinct from the stuff it holds.
  It is the same bell ringing.
  The sound rolls out across the frozen fields.
  Is it the metal making claim to be,
  Or just the habit of the listening ear?
  The tower holds the weight it held before,
  The town agrees to hear the tone remain,
  Ignoring how the pitch has shifted slightly.
  We need continuity more than truth.
  So when the sound wave hits the winter air,
  We stop the argument to listen close,
  And swear again despite the broken past,
  It is the same bell ringing.
