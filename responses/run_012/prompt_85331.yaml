answer: |-
  This is a profound question that strikes at the heart of the sociology of science, the philosophy of intellectual property, and the ethics of recognition. The tension you identify is often framed as the conflict between the **Mertonian norm of "Communism"** (scientific knowledge is a common good, produced collectively) and the **norm of "Individual Recognition"** (credit must be assigned to specific agents).

  To resolve this, we must disentangle the *metaphysics of discovery* (what a discovery *is*) from the *economics of credit* (how we distribute rewards). Below is a reconstruction of the implicit theory governing our current practices, an analysis of its philosophical underdetermination, and a exploration of the counterfactual you proposed.

  ---

  ### I. Reconstructing the Implicit Theory of Priority

  Our current institutions (patent offices, prize committees, citation indices) operate on a cluster of commitments that form a "Priority Paradigm." We can distinguish between what these practices *strictly presuppose* (logical necessities for the system to function) and what they *merely make convenient* (contingent justifications).

  #### 1. Strict Presuppositions (The Functional Core)
  These are the commitments without which the system of priority would collapse into incoherence.

  *   **Epistemic Anchoring:** The system presupposes that a claim to truth or utility must be anchored to a responsible agent. Even if an idea is "in the air," someone must vouch for it, publish the proof, or enable the reproduction of the invention. Priority rules presuppose that **accountability requires individuation.** We need a specific name to attach to the claim so that the community knows who to query if the claim fails.
  *   **Temporal Discretization:** The system treats discovery as an *event* rather than a *process*. To assign priority, one must be able to say, "At time $t$, state $S$ obtained." This presupposes that the continuous flow of research can be legitimately carved into discrete units of "completion."
  *   **Scarcity of Recognition:** The system presupposes that credit is a rivalrous good. While knowledge is non-rivalrous (my using calculus doesn't stop you), *recognition* is rivalrous (if the theorem is named after Newton, it is not named after Leibniz). The institutions presuppose that we cannot distribute full credit to all simultaneous discoverers without diluting the value of the credit itself.

  #### 2. Contingent Commitments (The Moral Superstructure)
  These are the commitments often *associated* with the practices but not strictly required by them.

  *   **Lockean Desert:** The common moral language implies that the discoverer "owns" the idea because they mixed their labor with the intellectual commons. This suggests a metaphysical link between the mind and the idea. However, the system could function without this; it could treat credit purely as a token for future funding (utility) rather than a reward for past labor (desert).
  *   **Uniqueness of Genius:** The "Great Man" theory of history suggests the discoverer possessed a unique capacity others lacked. The practice of eponymy reinforces this. However, the system does not *logically* require this. One can award priority to the first finisher in a race even if all runners are equally capable.
  *   **Truth-Tracking:** We often assume the priority winner is the "true" discoverer. But patent law's shift to **First-to-File** (rather than First-to-Invent) explicitly abandons truth-tracking for administrative certainty. This reveals that the system values *resolution* over *accuracy*.

  #### 3. Areas of Philosophical Underdetermination
  This is the crucial analytical point: **The same institutional rules can be justified by rival philosophical theories.**

  *   **Utilitarianism vs. Deontology:** A Utilitarian argues priority creates incentives to publish early, speeding up progress. A Deontologist argues priority respects the intellectual labor of the agent. Both license the *same* patent rules, but they disagree on *why*. If we abolish patents, the Utilitarian predicts slower innovation; the Deontologist predicts injustice. The current practice is underdetermined because it satisfies both, masking the conflict.
  *   **Internalism vs. Externalism:** An Internalist says the discovery belongs to the mind that conceived it. An Externalist (sociologist) says the discovery belongs to the social moment that made it possible. Yet, both agree on the *rule*: publish or perish. The Externalist accepts priority not as a metaphysical right, but as a **Schelling Point**—a focal point to coordinate behavior and prevent endless disputes over who "really" thought of it first.

  ---

  ### II. The Counterfactual: If Simultaneity Were the Norm

  If we took the "Inevitability Thesis" (that discoveries are social products ripe for picking) as the default metaphysical stance, rather than the exception, our institutions would undergo radical transformation.

  #### 1. Patent Law: From Property to License
  Currently, patents are exclusionary rights based on a fiction of unique origination. If simultaneity were the norm:
  *   **Independent Invention Defense:** Patent law would likely adopt a robust "independent invention" defense. If you can prove you developed the technology independently, you cannot be sued for infringement, even if I filed first. This treats the invention as a natural resource found by multiple prospectors, rather than a unique creation.
  *   **Compulsory Licensing:** Instead of a monopoly, the first filer might receive a "stewardship" fee, but the technology would be immediately available for licensing by others who arrived shortly after.
  *   **Abolition of "First-to-File":** We might move to a system of **Shared Rights**, where overlapping claims result in cross-licensing pools by default.

  #### 2. Scientific Credit: From Eponymy to Stewardship
  *   **Collective Attribution:** We would see the end of "Newton's Laws" or "Hubble's Law." Citations would reference the *problem* or the *year* (e.g., "The 1859 formulation of natural selection") rather than the person. We already see this in "The Standard Model" or "The Human Genome Project."
  *   **Lottery or Rotation:** For prizes (like the Nobel), if multiple people arrive simultaneously, awards might be rotated or shared by default more often. Currently, the Nobel limits recipients to three; a simultaneity-norm might require a "collective prize" for the cohort.
  *   **Credit for Synthesis:** Credit would shift from "discovery" to "articulation." If the idea was inevitable, the value lies in who explained it best, integrated it into the paradigm, or tested it most rigorously. Priority would be given to the *best validator*, not the *first conceiver*.

  #### 3. History of Ideas: From Biography to Topology
  *   **Teaching Context:** History seminars would stop teaching the "Eureka Moment." Instead, they would teach the "Problem Situation" (as Karl Popper termed it). We would study the *conditions* that made the calculus inevitable in the 17th century, rather than the psychological genius of Newton.
  *   **Moral Language:** The language of "theft," "scooping," and "plagiarism" would soften. If the idea was "in the air," scooping is less a moral violation and more a competitive failure. The moral outrage would shift to **obstructionism** (hiding data) rather than **priority** (being second).

  ---

  ### III. Can We Defend the Current System Without "Heroic Individualism"?

  This is the crux of your seminar tension. Can we keep priority rights without buying into the myth of the solitary genius? **Yes.** But it requires shifting the justification from *Desert* to *Coordination* and *Epistemic Responsibility*.

  #### 1. The Argument from Epistemic Responsibility
  Even if a discovery is socially inevitable, **truth claims require a specific guarantor.**
  *   *Theory:* Science is a community of inquiry (C.S. Peirce). For the community to test a claim, someone must stand behind it.
  *   *Practice:* We assign priority not because Person A is uniquely brilliant, but because Person A was the first to **assume responsibility** for the claim. If the math is wrong, we blame Person A, not the "zeitgeist."
  *   *Defense:* Priority is a mechanism for assigning **liability**, not just credit. The "hero" is actually the "volunteer for scrutiny."

  #### 2. The Argument from Coordination (Game Theory)
  *   *Theory:* Multiple discovery creates a coordination problem. If two people have the same truth, how does the community integrate it without duplicating effort or fighting?
  *   *Practice:* Priority rules act as a **tie-breaking convention**. It doesn't matter if the rule is "First-to-File" or "First-to-Born"; what matters is that there *is* a rule.
  *   *Defense:* We keep priority not because it reflects metaphysical truth, but because it minimizes transaction costs. It stops the endless debate over "who thought of it first" by setting a clear administrative bright line.

  #### 3. The Argument from Incentive Timing
  *   *Theory:* Even if a discovery is inevitable *eventually*, it is not inevitable *now*.
  *   *Practice:* Society wants the cure for cancer in 2024, not 2040.
  *   *Defense:* Priority rewards **speed**, not just origination. It incentivizes researchers to move from private contemplation to public verification as quickly as possible. This accelerates the "inevitable."

  ### IV. A Coherent Alternative: The "Stewardship Model"

  If you wish to resolve the tension in your seminar without abandoning current practices entirely, you might propose a **Stewardship Model**. This model accepts the reality of multiple discovery but retains priority for functional reasons.

  1.  **Retain Priority for Incentives:** Keep patents and prizes to encourage speed and publication. Acknowledge openly that this is a **Utilitarian fiction**, not a recognition of unique genius.
  2.  **Decouple Moral Desert from Priority:** Stop using the language of "ownership" of ideas. Use the language of "stewardship." The priority winner is the *first steward* of the idea, responsible for nurturing it into the public domain.
  3.  **Institutionalize Multiplicity:** In citations and history, mandate the acknowledgment of simultaneous workers. (e.g., "The Darwin-Wallace Principle"). This satisfies the sociological truth while maintaining the administrative need for a lead name.
  4.  **Shift Moral Outrage:** Redirect the moral weight of the scientific community. Instead of punishing those who are "scooped" (who often just worked slower), punish those who **delay publication** to hoard credit. This aligns the moral norm with the epistemic norm (knowledge should be public).

  ### Conclusion

  The tension you feel arises because our institutions speak the language of **Romantic Individualism** (desert, genius, ownership) while operating on the reality of **Social Constructivism** (inevitability, collective labor, zeitgeist).

  The practices do not strictly presuppose that discoveries are acts of individual minds; they only presuppose that **claims must be individuated for accountability.** The "Heroic" language is a leftover cultural artifact, not a functional necessity.

  A coherent philosophy of science for your seminar would argue that we should keep the **rules of priority** (for coordination and incentives) but abandon the **metaphysics of uniqueness**. We can treat the "discoverer" not as the *parent* of the idea, but as its *midwife*—the one who helped it into the world at the right time, even if the world was already pregnant with it. This allows you to acknowledge the inevitability of multiple discovery without demanding the abolition of the systems that manage scientific progress.
