  Good evening. Dean, donors, colleagues from the relativity group, and welcome to the launch of the new Centre for Philosophy of Physics. It is a pleasure to stand here at the beginning of this venture. And since I have been asked to speak about Gödel's rotating universe, it is also appropriate that I stand here at the beginning, because in the universe I am about to describe, there is no guarantee that you will not end up standing here again.

  In 1949, Kurt Gödel published a solution to Einstein's field equations. It was a cosmos filled with rotating dust, stationary rather than expanding. It was mathematically consistent. It was physically permissible. And it contained closed timelike curves. If you traveled far enough in that universe, you would not just return to your starting point in space; you would return to your starting point in time.

  We all know the science fiction potential of that sentence. But Gödel was not interested in meeting his younger self. He was interested in what that possibility implied about the nature of time itself. His argument was subtle, and it is the shape of that argument I want to leave with you tonight.

  Gödel reasoned that if objective time exists—if there is a genuine, universal lapse of moments, a factual "now" moving into a factual "future"—then it must exist in every possible universe allowed by the laws of physics. You cannot have time be objective in one solution and illusory in another. But in his rotating universe, there is no way to define a universal "now." The geometry forbids it. Therefore, Gödel concluded, since the laws of relativity permit a world without objective time, relativity suggests that objective time is not a fundamental feature of reality. He took this as support for a view in the neighbourhood of Kantian idealism: that time is a structure of our minds, not a structure of the world.

  Now, I can feel the relativity group wincing. And I know why. This is the friction point between physics and the philosophy of physics. The physicist says: "That solution is not our universe." The philosopher says: "But it is a possible world permitted by your theory."

  The physicist wants to know what is true. The philosopher wants to know what the theory says about truth. Gödel used a universe that isn't ours to make a claim about concepts we use in ours. Is that legitimate? Or is it a trick? It is the same tension that will animate this new Centre. We are not here to build better telescopes. We are here to ask what the telescopes are showing us about the concepts we use to describe the show.

  And let us be clear: Gödel's universe is not our universe. We have looked. The cosmic microwave background radiation shows no evidence of global rotation. The bounds are tight. Our cosmos is expanding, not swirling. Gödel's model is not a live candidate for our cosmological history.

  So why care? Because the puzzle remains. If our best theories of space and time allow for structures where time loses its meaning, we cannot simply ignore the conceptual rupture. We cannot say "time flows" while holding equations that suggest it might not. Understanding that tension is not just academic nitpicking; it is the work of ensuring our concepts match our mathematics.

  That is the work of this Centre. To sit with the discomfort of the inference. To ask whether using possible worlds to diagnose actual concepts is a bug or a feature. To acknowledge that sometimes, to understand where we are, we have to seriously consider where we are not.

  I began by welcoming you to the start of this Centre. In a Gödelian universe, I could not promise you a start, because the future would loop back to this moment. But in this room, time does seem to pass. The dinner awaits, the night moves forward, and we have work to do. Thank you.
