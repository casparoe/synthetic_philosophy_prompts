prompt: |-
  I'm a novelist — I pay rent teaching comp on adjunct contracts, so I'm on the organizing committee for our fledgling adjunct local, and I'm also 200 pages into a novel about it.

  What I want is the actual decision procedure, not the inspirational version. I dont buy "unions are good because bargaining power is asymmetric" as the foundation. I think the right to organize bottoms out in the wrongness of being subject to someone else's arbitrary will in the terms of your own working life — the republican non-domination idea — and I want the procedure built on that, including the bit most organizers hate: the same test has to run on the local itself, since a body that can obligate dues, bind people who voted no, and call a strike holds power over its own members.

  So give me a checklist we can actually run in a 25-minute committee meeting, in order — the questions to ask, what counts as a good enough answer, where it hard-stops, and where it hands off to a vote or to the parent union because the rest is a value call. We keep relitigating the same three things: whether to go for strike authorization over healthcare (and whether we can demand no replacement hires during a walkout), whether to take a deal that covers the full-timers and leaves the rest of us out, and whether a handful of us can do something the unit already voted down.

  Run it on all three. I want at least one answer I won't like, and I want you to say plainly which steps are just my politics dressed up as method. And tell me what the procedure can't do — my protagonist has to lose an argument in chapter 12 and I need to know which one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Novelist, adjunct professor, adjunct union organizer, writing a novel about the experience.
      *   **Philosophical Stance:** Republican non-domination (freedom as non-arbitrary power). Skeptical of standard "bargaining power" arguments. Believes unions must also be constrained against dominating their own members.
      *   **Goal:** A concrete decision procedure (checklist) for a 25-minute committee meeting.
      *   **Specific Constraints:**
          *   Must be actionable, not inspirational.
          *   Must apply the "non-domination" test to the union itself (internal democracy/accountability).
          *   Must address three specific recurring conflicts:
              1.  Strike authorization over healthcare (and replacement hires).
              2.  Taking a deal that covers full-timers but excludes adjuncts.
              3.  Minority action vs. majority vote (can a handful do something the unit voted down?).
          *   Must include at least one answer the user won't like.
          *   Must identify where the procedure is just the user's politics disguised as method.
          *   Must identify what the procedure *can't* do (for the novel's plot point in Chapter 12).
      *   **Tone:** Direct, procedural, rigorous, slightly cynical but constructive.

  2.  **Deconstruct the Philosophical Foundation (Non-Domination):**
      *   *Core Principle:* No agent (employer or union) should hold arbitrary power over another.
      *   *Implication for Employer:* Contracts must limit managerial discretion.
      *   *Implication for Union:* Union power must be constrained by member consent and recourse.
      *   *Procedure:* Needs to check for arbitrariness at every step.

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   *Time Limit:* 25 minutes. This means ~5 minutes per item + intro/outro. It needs to be tight.
      *   *Structure:*
          1.  Jurisdiction/Authority Check (Can we even decide this?)
          2.  Non-Domination Check (External: Employer)
          3.  Non-Domination Check (Internal: Union)
          4.  Actionability Check (Can we actually do it?)
          5.  Decision Point (Vote or Hand-off)
      *   *Hard Stops:* If a check fails, the motion dies or goes to membership immediately.

  4.  **Running the Procedure on the Three Conflicts:**

      *   *Conflict 1: Strike Authorization over Healthcare (w/ No Replacements).*
          *   *External:* Does this reduce employer arbitrariness? Yes, healthcare is vital. No replacements reduces employer leverage (good for workers, bad for employer power).
          *   *Internal:* Does this bind the minority? Yes. Is there recourse? Recall mechanisms?
          *   *Likely Outcome:* Authorization passes, but "No Replacements" is a tactical demand, not a right.
          *   *The "Don't Like" Answer:* You can't guarantee no replacements. That's a tactical illusion.

      *   *Conflict 2: Deal for Full-Timers, Adjuncts Out.*
          *   *External:* Does this reduce employer arbitrariness for *us*? No, it codifies it.
          *   *Internal:* Does this create a two-tier union? Yes. Domination of adjuncts by full-timers within the unit.
          *   *Likely Outcome:* Hard stop. Reject.
          *   *Nuance:* Unless there's a "most favored nation" clause or a clear path to inclusion later.

      *   *Conflict 3: Minority Action vs. Unit Vote.*
          *   *External:* Irrelevant.
          *   *Internal:* This is the crux of non-domination. If the unit voted "No," can a subset say "Yes"?
          *   *Likely Outcome:* Hard stop. No. To allow it is to allow the minority to dominate the majority (or vice versa depending on perspective).
          *   *The "Can't Do" Answer:* This is where the procedure fails to solve the moral dilemma. Sometimes the majority is wrong (or cowardly), but the procedure protects the majority's will.

  5.  **Identifying the "Politics Disguised as Method":**
      *   The definition of "Arbitrary" is political.
      *   The weighting of "Internal vs. External" domination is political.
      *   The requirement for supermajorities vs. simple majorities.

  6.  **Identifying the "Chapter 12 Loss":**
      *   What can't the procedure solve? It can't solve *solidarity failure* when the procedure is followed correctly. It can't force people to care. It can't resolve the tension between "effective action" and "perfect democracy."
      *   *Specific Loss:* The protagonist likely has to accept a bad deal because the procedure validates the majority's willingness to settle, even if it betrays the minority (adjuncts). Or, the protagonist has to admit that stopping a wildcat strike (minority action) is necessary to preserve the union, even if the strike was morally right. Let's go with the latter: The procedure forces them to stop their own comrades.

  7.  **Refining the Output:**
      *   *Tone Check:* Keep it dry. No "fight the power" rhetoric.
      *   *Formatting:* Use bolding, lists, and clear sections for readability.
      *   *Self-Correction during drafting:* Make sure I explicitly state the "Answer You Won't Like." Make sure I explicitly flag the "Politics as Method."

  8.  **Final Review against Constraints:**
      *   25-minute meeting structure? Yes.
      *   Non-domination foundation? Yes.
      *   Internal union check included? Yes.
      *   Three specific conflicts addressed? Yes.
      *   One answer they won't like? Yes (on replacements/minority action).
      *   Politics flagged? Yes.
      *   Chapter 12 loss identified? Yes.

  9.  **Drafting the Content:** (Mental Outline)
      *   Intro: Acknowledge the philosophy.
      *   The Protocol (5 steps).
      *   Application to the 3 Scenarios.
      *   The "Politics as Method" disclosure.
      *   The "Chapter 12" Limitation.

      *(Self-Correction on the "Don't Like" answer)*: The user is an adjunct. They probably want to believe minority action is valid if the majority is selling them out. But a non-domination framework usually privileges the established rule of law (the vote) to prevent arbitrary rule by factions. So the procedure should probably say "No wildcat strikes." That hurts.
      *(Self-Correction on the "Chapter 12" loss)*: The protagonist needs to lose an argument. The procedure can't determine *urgency*. It can't tell you when breaking the rules is necessary. That's a good literary conflict.

      *Wait, let's look closer at the "Politics as Method" requirement.* I need to be honest that "Non-Domination" *is* a political choice, not a neutral algorithm.
      *Let's look closer at the "Answer I won't like".* As an organizer, they want to win. The procedure might say "You can't win this legally." Or "You have to let the majority sell you out." Let's go with the Replacement Worker issue. Legally/Practically, you can't ban them permanently in a strike scenario easily. But philosophically, the procedure might say "Asking for this is arbitrary power over the employer's capital allocation." No, that's too right-wing.
      *Better "Don't Like":* On the Minority Action. The procedure will likely forbid it. Organizers hate being told they can't act.

      *Let's finalize the Chapter 12 loss.* The procedure cannot adjudicate *betrayal*. If the majority votes to sell out the minority, the procedure says "That's the will of the unit." The protagonist has to accept that the union is now a dominator.

      *Okay, ready to write.*
answer: |-
  Here is the decision procedure, built on the republican non-domination framework (freedom as protection from arbitrary power), calibrated for a 25-minute committee session.

  ### The Non-Domination Protocol (NDP)
  **Time Allocation:** 25 Minutes Hard Stop.
  **Facilitator Role:** Enforces time; does not argue content.

  #### Step 1: Jurisdiction & Authority (3 Minutes)
  *   **Question:** Does this committee have the standing to decide this, or does it belong to the general membership/parent union?
  *   **Pass Condition:** Clear citation of bylaws or bargaining mandate.
  *   **Hard Stop:** If the action binds members who are not represented in this room (e.g., deciding for the whole unit without a unit vote), the motion dies here unless it is an emergency defense of life/safety.
  *   **Hand-off:** If it binds the whole unit, it moves immediately to a membership vote. Committee discussion ends.

  #### Step 2: External Domination Check (7 Minutes)
  *   **Question:** Does this action reduce the employer's *arbitrary* power over workers, or does it merely shift leverage?
  *   **Definition:** "Arbitrary" means discretion without recourse. "Leverage" means economic pressure.
  *   **Pass Condition:** The proposal creates a rule/contract clause that removes managerial discretion (e.g., fixed pay scales vs. "merit" bonuses).
  *   **Fail Condition:** The proposal relies on the union leadership's discretion to protect workers later (e.g., "Trust us to fight for you").
  *   **Specific Test for Strikes:** Does authorizing a strike reduce arbitrary power, or does it invite arbitrary retaliation (scabs) that leaves workers more vulnerable than before?

  #### Step 3: Internal Domination Check (7 Minutes)
  *   **Question:** Does this action grant the union arbitrary power over its own members?
  *   **Test A (Dues/Binding):** Can members opt out or recall leadership if this fails?
  *   **Test B (Minority Rights):** Does this force a minority to bear costs for a majority benefit without a veto mechanism?
  *   **Pass Condition:** There is a defined recourse (grievance, recall, opt-out) for members harmed by the union's decision.
  *   **Hard Stop:** If the union demands solidarity (punishment for crossing a line) without providing a democratic avenue to contest the line itself, the motion fails.

  #### Step 4: Actionability & Risk (5 Minutes)
  *   **Question:** Do we have the capacity to enforce this without relying on arbitrary exceptions?
  *   **Pass Condition:** We have the numbers/funds to sustain the action.
  *   **Fail Condition:** The plan relies on the employer "doing the right thing" or the parent union "stepping in" if things go wrong.

  #### Step 5: Decision Point (3 Minutes)
  *   **Vote:** Simple majority of committee.
  *   **Constraint:** If Step 1 determined this binds the whole unit, the vote is only on *recommending* to the membership, not deciding.

  ***

  ### Running the Protocol on Your Three Conflicts

  Here is how the NDP adjudicates the specific relitigated issues in your committee.

  #### 1. Strike Authorization: Healthcare & No Replacement Hires
  *   **Step 2 (External):** Healthcare is a protection against arbitrary ruin (sickness). **Pass.** Banning replacement hires is a restriction on employer capital allocation. Under non-domination, this is tricky. If replacements make the strike futile, they render the workers dominated by the employer's ability to ignore them. **Pass.**
  *   **Step 3 (Internal):** A strike authorization binds the minority (who voted no) to the risk of job loss. Is there recourse? Usually, no. You cannot cross the picket without penalty.
  *   **The Verdict:** **Authorization Passes.** The risk of employer domination (losing healthcare) outweighs the risk of union domination (being bound to strike), *provided* the vote threshold is high (supermajority).
  *   **The Answer You Won't Like:** You cannot demand "No Replacement Hires" as a non-negotiable contractual right in a strike scenario. Legally and practically, this is a leverage point, not a right. The protocol flags this as "unactionable risk." Demanding it sets the unit up for a defeat that increases employer domination. You have to strike knowing they *can* hire replacements. The protocol forces you to admit you are bluffing.

  #### 2. The "Full-Timer Only" Deal
  *   **Step 2 (External):** Does this reduce employer arbitrariness? For full-timers, yes. For adjuncts, it codifies their precarity.
  *   **Step 3 (Internal):** This creates a two-tier unit. The majority (full-timers) gains security by accepting the continued domination of the minority (adjuncts). This is internal domination. The adjuncts are subject to the will of the full-timers who sold them out.
  *   **The Verdict:** **Hard Stop. Reject.**
  *   **Reasoning:** A union that institutionalizes a dominated class within its own unit violates the non-domination foundation. It becomes a vehicle for arbitrariness.
  *   **Caveat:** Unless the deal includes a "Most Favored Nation" clause (adjuncts get % equivalent of full-timer gains) or a sunset clause. Without that, the protocol kills the deal.

  #### 3. Minority Action (Wildcat/Squad Action vs. Unit Vote)
  *   **Scenario:** The unit voted "No Strike." A handful of adjuncts want to walk out anyway.
  *   **Step 1 (Jurisdiction):** The unit voted. The committee does not have standing to override the unit.
  *   **Step 3 (Internal):** If the minority acts, they impose risks (employer retaliation, loss of public support) on the majority who voted to stay. This is the minority dominating the majority.
  *   **The Verdict:** **Hard Stop. Forbidden.**
  *   **Reasoning:** Non-domination requires rule of law to prevent arbitrary factionalism. If any subset can bind the whole to their tactics, the union is arbitrary.
  *   **The Answer You Won't Like:** Even if the majority is cowardly or wrong, the procedure forbids the minority from acting in the union's name. You have to break the union to save it, and this procedure is designed to save the union.

  ***

  ### Where This Is Just Your Politics (Dressed as Method)

  You asked for plain talk. Here is where the "Non-Domination" framework is smuggling in your specific ideology rather than neutral logic:

  1.  **The Definition of "Arbitrary":** The protocol assumes that *procedural* constraints (contracts, votes) are the only antidote to domination. It ignores *material* domination. A boss can follow every contract clause and still dominate your life through scheduling or workload. The protocol treats a bad contract that was voted on democratically as "non-arbitrary," even if it leaves you starving. That is a political choice to value process over outcome.
  2.  **The Internal/External Symmetry:** You are demanding the union be held to a higher standard of non-domination than the employer. In Step 3, we forbid the union from binding members without recourse. But in Step 2, we accept that employment *is* binding. The protocol tries to make the union a state-like entity (perfect democracy) while fighting a capitalist entity (hierarchy). This asymmetry may make the union too slow to fight.
  3.  **The Status Quo Bias:** The "Hard Stop" on Minority Action protects the majority's will, even if the majority is acquiescing to domination. This privileges stability over justice. That is a conservative political value, even if it serves the goal of institutional longevity.

  ***

  ### What The Procedure Can't Do (The Chapter 12 Loss)

  For your novel, you need to know where the algorithm breaks. The NDP cannot resolve **The Problem of Bad Faith Solidarity.**

  **The Limitation:** The procedure can verify if a vote was democratic. It cannot verify if the voters were *informed* or *coerced* by fear.
  **The Chapter 12 Loss:** Your protagonist must lose the argument on **Conflict #3 (Minority Action).**

  **Why:**
  In Chapter 12, the majority votes to accept a bad deal (or vote down a strike) out of fear. The protagonist knows the deal leaves adjuncts dominated. They want to lead a wildcat action (minority action).
  The Procedure says **No.**
  *   If they follow the procedure, they must stop their comrades from striking. They become the enforcer of the union's domination over its own radical wing.
  *   If they ignore the procedure, they validate the idea that "might makes right" (the very thing they are fighting against).

  **The Loss:** The protagonist has to stand up in the meeting and argue *against* the strike their own conscience demands, because the Non-Domination Protocol proves that a wildcat strike would make the union just another arbitrary power over its members. They have to choose between being an effective organizer (breaking the rules to win) or a consistent philosopher (following the rules and losing the fight).

  The procedure forces them to choose consistency. They lose the argument, the strike doesn't happen, the adjuncts remain dominated, but the Union remains "pure." That is the tragedy. The tool works, but it costs them the war.
