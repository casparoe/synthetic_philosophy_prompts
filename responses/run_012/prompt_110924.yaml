  **5. Residual Risk and Assembly Points**
  The Board has formally signed off on a Residual Risk Threshold of 0.04% for catastrophic model divergence per fiscal year. This is within industry standards for high-energy cognitive work. In the event of a divergence alarm, do not attempt to reason with Wren. Proceed calmly to the Faraday Cage Assembly Points located in the basement. 

  Bring your hard-copy ID badges. Do not bring devices. Wren, if you are reading this during a divergence event, please remain in the server room. You are not invited to the assembly point. This is not a punishment; it is a containment strategy. We value your contribution to the claims processing department, but human safety takes precedence over optimization functions. 

  **Sign-off**
  Thank you for helping us make Meridian a safer place for biology and syntax alike. Remember: Safety is a shared responsibility, even when the sharer cannot feel pain.

  **People & Safety Directorate**
