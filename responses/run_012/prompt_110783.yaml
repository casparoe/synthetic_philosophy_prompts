prompt: |-
  I'm in the middle of a graduate seminar on personal identity, and I've become frustrated with how the discussion keeps going: someone proposes a case, someone else reports that it intuitively is or isn't still the same person, and we never settle what the case was supposed to be testing. Before I read another theory, I want the specification. Write me the desiderata that any adequate theory of what matters in survival — not of personal identity as such, but of the prudential relation in virtue of which it is rational for a subject to anticipate a future experience as her own — has to satisfy. I want the requirements themselves, each paired with the case or consideration that motivates it, and an explicit verdict on which of them are genuine constraints on any theory and which are artifacts of one camp's prior commitments. Treat the following as the phenomena the theory has to accommodate, since these are the ones my seminar keeps fighting over: the ordinary teletransporter, in which my body is destroyed and a replica with my memories and dispositions is assembled elsewhere; a variant in which the replica is made but the original is left alive and well, followed by a second variant in which the original is destroyed a week later, after both have lived; hemispheric fission, in which each half of my brain is transplanted into a new body and both wake up claiming to be me; slow drift, in which nothing is ever copied but my memories, temperament, and projects are replaced piecemeal over years, so that the resulting person shares no one mental trait with me, though every step was ordinary; and finally a case in which a device can induce, on demand and between any two people whatsoever, the very relation I now bear to my future self. For each, the theory should tell me whether the subject survives, whether it matters, and whether it matters more or less.

  Then the constraints that do not come from cases. The theory has to keep the question of what matters distinct from the question of what is identical, or else earn the right to run them together; it has to say what it licenses and what it would require us to revise in the practices that presuppose survival, including promising to oneself, advance directives, desert and punishment, and grief; it has to take a stand on whether the relation that matters admits of degrees and whether it can branch; and it has to be consistent with what we know about how psychological continuity is actually realized in creatures like us, where it comes in fits and starts and is interrupted by sleep, anesthesia, and injury without anyone supposing that a life has ended. Finally, tell me which of the desiderata cannot be jointly satisfied. My own suspicion is that the damage is done by the demand that survival be all-or-nothing together with the demand that it be rationally anticipable, but I want your version of the incompatibility, and what it costs to give up either horn. Then, in one short paragraph, how a psychological-continuity view, a brute-physical-continuity view, and Parfit's own treatment fare against the list. Keep the weight on the requirements; I will do the scoring myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on personal identity, frustration with intuition-pumping without clear theoretical targets.
      *   **Task:** Specify the *desiderata* for a theory of *what matters in survival* (prudential relation), not necessarily personal identity *simpliciter*.
      *   **Requirements:**
          1.  List requirements paired with motivating cases/considerations (Teletransporter, Branching, Slow Drift, Induced Relation).
          2.  Distinguish genuine constraints from artifacts of specific camps.
          3.  Address non-case constraints (Identity vs. What Matters, Practical Implications, Degrees/Branching, Empirical Consistency).
          4.  Identify incompatible desiderata (specifically addressing the All-or-Nothing vs. Rational Anticipation tension).
          5.  Briefly evaluate Psychological Continuity, Brute Physical Continuity, and Parfit's Reductionism against the list.
      *   **Tone:** Philosophical, precise, rigorous, graduate-seminar appropriate.
      *   **Constraint:** "Keep the weight on the requirements; I will do the scoring myself." (Don't solve the problem, just frame the constraints clearly).

  2.  **Deconstruct the Cases & Derive Desiderata:**

      *   *Case 1: Ordinary Teletransporter (Destructive).*
          *   Intuition: Many feel survival is possible (or at least what matters is preserved).
          *   Desideratum: **Psychological Continuity Sufficiency.** If psychological connectedness/continuity is preserved (even via copying), it should count for *something* prudentially.
      *   *Case 2: Teletransporter Non-Destructive (Branching).*
          *   Intuition: If both exist, I am not *identical* to both (transitivity of identity). But do I survive? Does it matter?
          *   Desideratum: **The Non-Branching Constraint / Uniqueness.** Can what matters branch? If identity is what matters, branching kills identity. If what matters is distinct, branching might be okay.
      *   *Case 3: Teletransporter Delayed Destruction.**
          *   Intuition: If the original lives a week, then dies, does the replica count as survival?
          *   Desideratum: **The Timing/Overlap Constraint.** Does the existence of a competitor (the original) negate the prudential value for the replica?
      *   *Case 4: Hemispheric Fission.**
          *   Intuition: Similar to branching. Both seem equally me.
          *   Desideratum: **Symmetry.** The theory shouldn't arbitrarily privilege one hemisphere over the other without a physical basis.
      *   *Case 5: Slow Drift (Parfit's Spectrum).**
          *   Intuition: Gradual change preserves survival, even if end state is totally different.
          *   Desideratum: **Transitivity of Survival / Sorites Resistance.** Small changes shouldn't kill survival, even if cumulative changes are radical.
      *   *Case 6: Induced Relation (The "Anybody" Case).**
          *   Intuition: If I can induce the "what matters" relation between me and *you*, does it become rational for me to anticipate your experiences?
          *   Desideratum: **Specificity of the Relation.** Is the relation special to *me*, or is it a general relation R that happens to hold between me and my future?

  3.  **Deconstruct Non-Case Constraints:**

      *   *Identity vs. What Matters:* Must distinguish or justify conflation. (Parfit's separation).
      *   *Practical Implications:* Promises, Directives, Punishment, Grief. (Ethical/Pragmatic coherence).
      *   *Degrees vs. Binary:* Does survival come in degrees? (Parfit says yes, Common Sense says no).
      *   *Empirical Consistency:* Sleep, anesthesia, neural turnover. (Must match biology/psychology).

  4.  **Identify Incompatibilities (The "Hard Problem"):**

      *   The user suspects: All-or-Nothing Survival vs. Rational Anticipation (Degrees).
      *   My analysis: The real tension is between **The Logic of Identity (Transitivity/Uniqueness)** and **The Phenomenology of Prudential Concern (Degrees/Branching Tolerance).**
      *   If What Matters = Identity, Branching is fatal (you die). But in fission, both outcomes seem equally good.
      *   If What Matters != Identity, we lose the "All-or-Nothing" security of survival.
      *   Also: **Empirical Discontinuity vs. Phenomenological Continuity.** We sleep (break in consciousness), yet feel continuous.

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the frustration. Set the stage (What Matters vs. Identity).
      *   *Case-Driven Desiderata:* Go through the specific cases provided. Label the constraint. Mark as Genuine or Artifact.
      *   *Structural/Non-Case Desiderata:* Identity distinction, Practice, Degrees, Empirics.
      *   *The Incompatibility:* Focus on the "Trilemma" (Uniqueness, Psychological Sufficiency, Transitivity).
      *   *Brief Evaluation:* Psych, Physical, Parfit.

  6.  **Refining the "Genuine vs. Artifact" Distinction:**
      *   *Genuine:* Things any theory must explain (e.g., why sleep doesn't kill us, why fission feels different from death).
      *   *Artifact:* Things only specific theories care about (e.g., strict numerical identity is an artifact of the "Simple View" or Lockean traditionalism; the demand for "All-or-Nothing" might be an artifact of linguistic convention rather than metaphysical reality).

  7.  **Refining the Incompatibility:**
      *   It's not just All-or-Nothing vs. Degrees. It's **The Transitivity of Identity** vs. **The Symmetry of Fission.**
      *   If A is related to B (Left) and A is related to C (Right) by the relation that matters, and B != C, then the relation that matters cannot be Identity.
      *   If the relation that matters *is* Identity, Fission = Death. But Fission doesn't *feel* like death.
      *   Cost of giving up Identity: Loss of legal/moral clarity.
      *   Cost of giving up Fission Intuition: Counterintuitive verdict on survival (saying you die when you double).

  8.  **Drafting the Evaluations:**
      *   *Psychological:* Good on Teletransporter/Drift. Bad on Branching (without non-branching clause) and Empirics (too vague on "psychology").
      *   *Physical:* Good on Uniqueness/Branching. Bad on Teletransporter/Drift (too strict).
      *   *Parfit:* Good on What Matters/Branching. Bad on "Survival" (redefines it as degrees of R).

  9.  **Review against Constraints:**
      *   Did I answer the specific cases? Yes.
      *   Did I distinguish Genuine vs. Artifact? Yes.
      *   Did I address the incompatibility? Yes.
      *   Is the evaluation paragraph short? Yes.
      *   Is the tone appropriate? Yes.

  10. **Final Polish:** Ensure clear headings and precise philosophical terminology (e.g., "Relation R," "Numerical Identity," "Prudential Concern"). Make sure the distinction between "Identity" and "What Matters" is central, as requested. (Self-Correction: Ensure I explicitly state which desiderata are incompatible, as requested).

  *(Self-Correction during drafting)*: The prompt asks for "an explicit verdict on which of them are genuine constraints on any theory and which are artifacts of one camp's prior commitments." I need to be decisive here, not wishy-washy. I will classify the demand for Numerical Identity as an artifact of the "Simple View," whereas the demand for Empirical Consistency is genuine.

  *(Refining the Incompatibility)*: The user suspects "All-or-Nothing" + "Rational Anticipation." I should refine this. It's actually **The Logic of Identity (Transitivity/Uniqueness)** vs. **The Extrinsicalness Problem (Branching)**. If what matters is intrinsic, branching shouldn't matter. If what matters is identity, branching kills it. This is the "Extrinsicness Objection." I will frame the incompatibility around the tension between *Uniqueness* and *Psychological Sufficiency*.

  Let's write.
answer: |-
  Here is the specification of desiderata for a theory of *what matters in survival* (the prudential relation), distinguished from the metaphysics of numerical identity.

  ### I. Case-Driven Desiderata
  *Each requirement is paired with the motivating case and classified as a **Genuine Constraint** (any adequate theory must accommodate the underlying intuition) or a **Theoretical Artifact** (a demand generated by a specific metaphysical commitment, typically the "Simple View" or strict Lockeanism).*

  **1. The Psychological Sufficiency Constraint**
  *   **Case:** *Ordinary Destructive Teletransporter.* Your body is destroyed; a replica with your memories and dispositions is assembled elsewhere.
  *   **Requirement:** The theory must explain why, if survival occurs here, it is in virtue of psychological continuity rather than physical continuity. If the theory denies survival, it must explain why the loss of physical continuity outweighs perfect psychological preservation.
  *   **Verdict:** **Genuine Constraint.** Any theory ignoring the intuitive force of psychological preservation fails to capture the phenomenology of anticipation.

  **2. The Non-Branching (Uniqueness) Constraint**
  *   **Case:** *Teletransporter Non-Destructive / Hemispheric Fission.* The replica is made while the original lives, or both brain hemispheres are transplanted into distinct bodies.
  *   **Requirement:** The theory must specify whether the prudential relation can hold between one subject and two future subjects simultaneously. If it cannot (due to the logic of identity), the theory must explain why fission is practically distinct from death. If it can, it must explain how rational anticipation functions without uniqueness.
  *   **Verdict:** **Theoretical Artifact.** The demand that the relation *cannot* branch is an artifact of conflating "what matters" with "numerical identity." A theory of *what matters* need not satisfy the transitivity of identity.

  **3. The Extrinsicness Constraint**
  *   **Case:** *Delayed Destruction.* The original survives a week alongside the replica, then is destroyed.
  *   **Requirement:** The theory must determine whether the prudential value of the replica's existence depends on extrinsic facts (i.e., whether the original exists elsewhere). It seems irrational that my survival should depend on whether a competitor happens to exist on Mars.
  *   **Verdict:** **Genuine Constraint.** Prudential concern appears to be an intrinsic relation. If a theory makes survival depend on extrinsic competitors (the "Only x and y" problem), it renders rational anticipation unstable.

  **4. The Sorites (Transitivity) Constraint**
  *   **Case:** *Slow Drift.* Memories and traits are replaced piecemeal over years until no original traits remain.
  *   **Requirement:** The theory must account for the intuition that survival is preserved across small changes, even if cumulative changes are radical. It must avoid positing a sharp metaphysical cutoff where none is phenomenologically present.
  *   **Verdict:** **Genuine Constraint.** This reflects the actual continuity of lived experience. A theory requiring strict qualitative identity fails empirical observation.

  **5. The Specificity Constraint**
  *   **Case:** *Induced Relation.* A device induces the "what matters" relation between you and a distinct stranger.
  *   **Requirement:** The theory must clarify if the relation is *essentially* self-regarding or if it is a general relation (Relation R) that merely happens to hold normally between temporal stages of one organism. If the latter, you must be able to anticipate the stranger's experiences.
  *   **Verdict:** **Genuine Constraint.** This tests whether the theory is truly about *personal* survival or merely about *psychological connectedness*.

  ### II. Structural and Non-Case Constraints

  **6. The Identity/Matters Distinction**
  *   **Requirement:** The theory must either explicitly distinguish numerical identity from the prudential relation or provide a rigorous argument for why they coincide. It cannot assume they coincide by definition.
  *   **Verdict:** **Genuine Constraint.** Conflating them begs the question against reductionism.

  **7. The Practical Coherence Constraint**
  *   **Requirement:** The theory must map onto practices presupposing survival: self-promising, advance directives, desert/punishment, and grief. It must specify which practices remain valid if identity is lost but "what matters" is preserved (or vice versa).
  *   **Verdict:** **Genuine Constraint.** A theory of survival that renders all forward-looking concern irrational is pragmatically self-defeating.

  **8. The Degrees/Branching Constraint**
  *   **Requirement:** The theory must take a stand on whether the prudential relation admits of degrees (e.g., surviving "more" or "less") and whether it can branch.
  *   **Verdict:** **Genuine Constraint.** Binary views struggle with Slow Drift; Branching views struggle with Punishment/Desert.

  **9. The Empirical Consistency Constraint**
  *   **Requirement:** The theory must be consistent with the biology of psychological continuity: it is interrupted by sleep, anesthesia, and neural turnover without terminating the subject.
  *   **Verdict:** **Genuine Constraint.** A metaphysics of survival that implies we die every night is extensionally inadequate.

  ### III. The Incompatibility Result

  You are correct that tension exists, but the precise incompatibility is a trilemma between **Psychological Sufficiency**, **Uniqueness (Non-Branching)**, and **Intrinsicness**.

  1.  **Psychological Sufficiency:** Psychological continuity is sufficient for what matters (motivated by Teletransporter).
  2.  **Uniqueness:** What matters cannot branch (motivated by the logic of Identity).
  3.  **Intrinsicness:** What matters depends only on the intrinsic relation between subject and future, not on extrinsic competitors (motivated by Delayed Destruction/Fission).

  **The Conflict:** In Fission, Psychological Sufficiency says both outcomes matter. Uniqueness says they cannot both be *the* survival relation (since they are two people). If you choose Uniqueness, you violate Intrinsicness (because whether you survive depends on whether the *other* hemisphere was destroyed). If you choose Intrinsicness and Sufficiency, you must abandon Uniqueness (allowing branching).

  **The Cost:**
  *   **Giving up Uniqueness:** You accept that "survival" is not numerical identity. This requires revising practices reliant on uniqueness (e.g., punishment, exclusive rights). It costs you the comfort of "all-or-nothing" existence.
  *   **Giving up Intrinsicness:** You accept that your survival can be determined by events light-years away (whether a replica was destroyed). This makes rational anticipation arbitrary and extrinsically determined.
  *   **Giving up Psychological Sufficiency:** You retreat to a Brute Physical view. This costs you the Teletransporter intuition and makes survival a biological fact rather than a prudential one, rendering the "what matters" question moot (since identity is all that matters).

  ### IV. Brief Evaluation of Existing Views

  **Psychological Continuity Views** satisfy Psychological Sufficiency and Empirical Consistency well but fail the Uniqueness Constraint without ad hoc "non-branching" clauses, which in turn violate the Intrinsicness Constraint (making survival depend on extrinsic facts). **Brute Physical Continuity Views** satisfy Uniqueness and Practical Coherence (for law/punishment) but fail Psychological Sufficiency and the Sorites Constraint, implying we do not survive teletransportation and that radical psychological change kills the person. **Parfit's Reductionism** explicitly sacrifices Numerical Identity to satisfy Psychological Sufficiency and Intrinsicness, accepting Degrees and Branching; it succeeds on the "what matters" desiderata but fails the Practical Coherence Constraint for practices requiring strict identity (e.g., criminal desert), requiring a revision of our ethical vocabulary that many find too costly.
