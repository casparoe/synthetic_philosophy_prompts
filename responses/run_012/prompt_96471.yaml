answer: |-
  Here are 10 questions designed for your show. They are structured to keep the pressure on the guest's specific "Fixed-Basis Conditional Analysis" (FBCA) while giving you the ammunition to pivot when he reaches for his standard defenses.

  ### 1. The Circularity of "Basis"
  **The Question:** Your fix hinges on holding the "causal basis" fixed in the counterfactual antecedent. But how do you identify that basis without already knowing which disposition we're talking about? If the basis is just "whatever microstructure makes the counterfactual true," aren't you defining the disposition in terms of the counterfactual, and the counterfactual in terms of the disposition?

  **Likely Answer:** He will insist the basis is a categorical, non-dispositional property—like the molecular lattice of the glass—independent of what it *does*. He'll say we identify bases via fundamental physics, not by looking at the truth of the conditional.

  **The Follow-up:** "Okay, but take a multiply realizable property like 'solubility.' Salt dissolves via ionic dissociation; sugar dissolves via hydrogen bonding. They have *different* categorical bases. If the basis is part of the truth condition, doesn't that mean salt and sugar have *different* dispositions? If you say 'no, they share the disposition,' you've severed the link to the specific basis. If you say 'yes, different dispositions,' you've made disposition ascriptions wildly disjunctive. Which horn are you taking?"

  ### 2. The Impossible Antecedent (Finkish Removal)
  **The Question:** Let's look at a fink that removes the basis *precisely because* the stimulus occurs. A wizard shatters the molecular lattice the millisecond the hammer strikes. Your analysis says: 'If the hammer strikes *and* the lattice is retained, the glass breaks.' But in this world, that antecedent is impossible. The strike *causes* the loss of the lattice. Does your counterfactual go vacuously true? And if so, does the glass count as fragile?

  **Likely Answer:** He will appeal to "closest possible worlds." He'll argue we look at a nearby world where the wizard is distracted or fails, so the antecedent is possible there. In that world, the glass breaks. So, yes, it is fragile.

  **The Follow-up:** "But to get to that world, you've had to delete the fink. If you delete the fink, you've changed the causal laws or the history of the scenario. If you have to tweak the world *that* much to make the antecedent possible, why trust the intuition that the result tells us about *this* object's dispositions? Aren't you measuring the glass's fragility in a world where the glass isn't being finked, rather than the glass's fragility *under* finkish conditions?"

  ### 3. The Neglect of Mimics
  **The Question:** The literature is obsessed with finks and masks, but mimics seem to get less attention. A mimic is an object that lacks the basis but manifests anyway (like a hologram of a breaking glass). Why do you think philosophers treat mimics as a secondary nuisance compared to finks? Is it because finks break the logic, while mimics just break the semantics?

  **Likely Answer:** He'll suggest finks are more dangerous because they attack the core conditional link ($C \rightarrow M$), whereas mimics just require a "due to the basis" clause to filter out false positives. Mimics are easier to patch.

  **The Follow-up:** "But isn't that 'due to' clause doing all the heavy lifting? If I have to add a clause that says 'The manifestation must be caused by the basis,' haven't I just defined disposition as 'The manifestation caused by the basis'? If so, why do we need the counterfactual apparatus at all? Why not just say 'x is disposed iff x has a basis that causes M'?"

  ### 4. Masks and Extrinsicness
  **The Question:** If I wrap fragile glass in bubble wrap, it won't break when struck. That's a mask. You say the glass is still fragile because the *basis* is intact. But the truth of the statement 'This glass is fragile' now depends on whether there is bubble wrap nearby. Doesn't that make the disposition ascription extrinsic? And if fragility is extrinsic, how is it a property of the glass?

  **Likely Answer:** He will distinguish the *property* (intrinsic) from the *ascription conditions* (which can be context-sensitive). He'll argue the glass *has* the basis intrinsically; the mask just interferes with the manifestation conditions.

  **The Follow-up:** "I get the distinction, but here's the rub: If I don't know whether there's a mask present, I don't know if the counterfactual 'If struck, it would break' is true. So I can't verify the disposition without surveying the environment. If the truth-conditions of 'x is fragile' require knowledge of the surroundings, in what robust sense is fragility 'in' the glass? Isn't it a relation between the glass and the room?"

  ### 5. The Double-Duty Mechanism (New Case)
  **The Question:** I want to put a new case to you. Imagine a smart-glass that, when struck, activates a mechanism that *prevents* the shattering but simultaneously plays a recording of a shattering sound and scatters shards of *other* glass nearby. To an observer, it looks exactly like a manifestation. The counterfactual 'If struck, shattering-appearances occur' is true. The basis (the smart-structure) is held. But the glass didn't break. Does your 'due to the basis' clause catch this?

  **Likely Answer:** He will say yes. The manifestation (actual breaking) did not occur, only a lookalike. The 'due to' clause requires the manifestation to be the specific effect tied to the basis. The basis here causes the *recording*, not the breaking.

  **The Follow-up:** "But suppose the mechanism is so integrated that the 'prevention' and the 'fake breaking' are the same causal process. The basis *is* the mechanism that creates the illusion. If the basis causes the illusion, and the illusion is the only observable 'M', on what grounds do you say the disposition to *really* break isn't there? Are you smuggling in a metaphysical distinction between 'real breaking' and 'fake breaking' that your analysis was supposed to explain?"

  ### 6. Internal Masking (New Case)
  **The Question:** Consider a chemical compound that contains both a reactive agent and a neutralizer in a stable suspension. When struck, the neutralizer releases instantly and stops the reaction. The neutralizer is *part* of the object's actual categorical basis. Is this object disposed to react? Your view says 'hold the basis fixed.' The basis includes the neutralizer. So the reaction doesn't happen. So it's not disposed.

  **Likely Answer:** He will agree. If the neutralizer is part of the actual categorical state, then the object lacks the disposition. It's not a masked disposition; it's a lack of disposition.

  **The Follow-up:** "That feels wrong. Intuitively, it has the *potential* to react, it's just self-neutralizing. If you classify this as 'lacking the disposition,' you collapse the distinction between 'not being flammable' and 'being flammable but fireproofed.' Does your analysis force us to say a fireproofed building isn't 'flammable material that's been treated,' but rather 'non-flammable material'? That seems to lose useful granularity."

  ### 7. Finkish Acquisition (New Case)
  **The Question:** Let's mirror the fink. Imagine a 'smart metal' that is soft at rest but becomes hard *when struck*. It would break if struck (because the strike makes it hard), but it isn't hard *before* the strike. Standard CAD says it's disposed to break (because if C, then M). Your view says 'hold the *actual* basis fixed.' The actual basis is softness. So if C and Softness Held, it *doesn't* break. So you say it's *not* disposed. Is this the correct result?

  **Likely Answer:** He will say yes. This is the correct result. The object is not disposed to break *in its current state*. It acquires the disposition only upon stimulation. The analysis correctly tracks the *current* disposition, not the *future* one.

  **The Follow-up:** "If you accept that, you've severed the link between dispositions and counterfactuals of the form 'If C, then M.' Because 'If struck, it breaks' is true, but 'It is disposed to break' is false. You've saved the analysis by sacrificing the equivalence. If the conditional can be true while the disposition is false, what work is the conditional doing? Is it just a test for dispositions that sometimes fails?"

  ### 8. Gruesome Dispositions (New Case)
  **The Question:** Here's a gruesome one. An object is disposed to break when struck *unless* it was poked before last Tuesday. If it was poked, it turns to jelly. The 'basis' for this gruesome disposition is just the object's history plus its structure. Does your analysis count this as a real disposition?

  **Likely Answer:** He will likely say yes. Dispositions can be time-indexed or history-dependent. If there is a causal basis for this complex behavior, it counts as a disposition.

  **The Follow-up:** "If *that* counts, then *everything* has a disposition for *anything*, provided we gerrymander the basis enough. I can find a basis for 'This cup is disposed to turn into a unicorn if dropped' if I include enough history and external factors in the basis. Where do you draw the line? If you don't, isn't the concept of disposition trivialized? If you do, what constraint rules out the gruesome case without ruling out normal, complex dispositions?"

  ### 9. The Rylean Project
  **The Question:** Stepping back: Gilbert Ryle wanted to analyze mental states in terms of behavioral dispositions to avoid positing ghostly inner states. If your analysis requires us to posit a 'causal basis' and add clauses about 'no finks,' 'no masks,' and 'due to,' haven't we just reinvented the inner state? What does this apparatus do for the behaviorist project that a simple 'If stimulated, then behavior' didn't?

  **Likely Answer:** He will argue that Ryle was too simple. We need the causal basis to ground the counterfactuals, otherwise, behavior is just accidental. The "inner state" (basis) is legitimate as long as it's physical/categorical, not mental.

  **The Follow-up:** "But if the basis is doing the heavy lifting, why call it a 'dispositional analysis' of the mental? Why not just be a realist about the neural states? It sounds like you're saving Ryle by abandoning Ryle. If we need to reference the physical basis to make sense of the disposition, aren't we just doing neuroscience with extra steps?"

  ### 10. The Falsification Condition (The Closer)
  **The Question:** This is the one I care about. You've got a patch for finks, a patch for masks, a patch for mimics. I need to know: What would actually count as a counterexample to *your* analysis? Describe a case where the basis is held, the stimulus occurs, the manifestation happens, it's 'due to the basis,' no masks or finks are present—and yet you would admit, 'Okay, this object is *not* disposed.'

  **Likely Answer:** He might struggle here. He may say that if all those conditions are met, the object *must* be disposed by definition. Or he might suggest a case where the manifestation is accidental despite the basis (e.g., a deviant causal chain).

  **The Follow-up:** "If your answer is 'If all those conditions are met, it *must* be disposed,' then your analysis is a tautology. It's true by definition of the terms you've chosen. But if it's a tautology, it doesn't tell us anything about the world. I need you to tell me: Is there any empirical scenario that could prove you wrong? Or have you built a fortress that keeps the truth in, but also keeps the meaning out?"
