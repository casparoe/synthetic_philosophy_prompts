  - whether an agent whose evidence is perfectly symmetric between two hypotheses is rationally required to adopt equal precise credences, or merely permitted to leave the matter imprecise;
  - whether the requirement to choose a single act — under maximality, E-admissibility, or whichever decision rule you favour — constitutes a rational requirement to precisify, or only a practical necessity that leaves the credal state itself imprecise;
  - whether the phenomenon in which learning something intuitively irrelevant renders a credence less precise tells against imprecision, or is an artefact of a badly chosen updating rule;
  - whether the accuracy-based arguments to the effect that a rational credence must be a single real-valued function succeed.

  Add whatever further sub-question you think belongs, and say how the pieces combine into the final figure.

  Then identify the sub-question to which your final number is most sensitive, and say what evidence or argument would move it furthest. Be explicit about how confident you are in each of your claims, not only in the final number, and single out the one point in your answer about which you are least sure.

