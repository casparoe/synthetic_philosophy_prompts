  I'm a software engineer with no formal background in philosophy, and I've been reading up on Integrated Information Theory on my own. Before I commit to this position in front of the reading group I've joined, I'd like a consistency check. Here is roughly where I've landed:

  (1) Consciousness just is having a certain maximally integrated cause-effect structure; there is no further fact about a system over and above its causal structure.
  (2) Whether a system is conscious is an objective matter of fact, not relative to how we happen to model or describe it.
  (3) Consciousness comes in degrees, because the underlying quantity is graded, so there are facts about whether one system is more conscious than another.
  (4) Behavior cannot settle it: my "brute-force twin" — a lookup table that emits all my responses without any of my internal architecture — might have no experience at all, and a system might be conscious without being able to report it.
  (5) I take IIT to be a real scientific theory precisely because it forbids things — for instance, that a purely feedforward system could be conscious however well it behaves.
  (6) My one non-negotiable starting point is that I am certain, from the inside, that I am conscious.

  I genuinely don't know which of these are pulling against each other. Tell me which pairs are really in tension and which only look that way, order the genuine tensions by severity, and for each say what would have to give and what the cheapest repair would be. Then tell me which single revision would clean up the most at the least cost. End with a final line beginning "Verdict:" that names the one commitment I should give up.
