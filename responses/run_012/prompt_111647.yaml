answer: |-
  1. The Verdict

  Aristotle would not treat the impossibility theorem of algorithmic fairness as a genuine moral dilemma. He would regard it as a symptom of a badly posed question, arising from a confusion regarding the proper end (*telos*) of judgment and the nature of the equality required by justice. For Aristotle, justice is not a matter of balancing statistical properties of a population, but of rendering to each person what is due to them based on their merit and action. The trilemma described—that calibration, equal false-positive rates, and equal false-negative rates cannot coexist when base rates differ—presumes that the goal of the instrument is the accurate prediction of an outcome (such as loan default or recidivism) and that fairness consists in the equal distribution of prediction errors across groups.

  Aristotle would argue that this framework mistakes arithmetic equality for proportional equality. The conflict arises because the designers are attempting to impose uniform error rates on groups that differ in their underlying characteristics (base rates), while simultaneously demanding that the scores mean the same thing (calibration). To Aristotle, if the groups differ in the relevant characteristic that determines desert, justice *requires* that they be treated differently. The mathematical impossibility is not a tragedy of moral compromise; it is a signal that the metrics being balanced are not the correct measures of justice. The problem lies not in the necessity of sacrificing a moral good, but in the attempt to define justice through the technical constraints of prediction rather than through the political determination of desert. Consequently, the impossibility is not yet a problem about justice at all, but a problem about the misapplication of technical means to political ends.

  2. The Argument in his own terms

  To reconstruct Aristotle's reasoning, one must begin with the distinction found in Book V of the *Nicomachean Ethics* between distributive and corrective justice. The instruments described function as mechanisms of distribution: they allocate goods (credit, employment) or burdens (detention, insurance premiums). Distributive justice, for Aristotle, demands proportional equality, not arithmetic equality. If persons are unequal in merit, they must receive unequal shares. The modern trilemma assumes that "fairness" requires certain arithmetic equalities (equal error rates) across groups. Aristotle would reject this premise. If the base rates differ because one group possesses, on average, less of the relevant merit (or is situated in conditions that produce different outcomes), proportional equality dictates that the distribution should reflect that difference, provided the difference is relevant to the good being distributed.

  (a) Regarding whether proportional equality allows satisfying two criteria at once: Aristotle would argue that proportional equality does not solve the mathematical trilemma, but rather dissolves the moral necessity of satisfying the conflicting criteria. Proportional equality prioritizes the alignment of the score with the *desert* of the individual. If calibration ensures that a score represents the same probability of outcome for everyone, it aligns closest with a form of truth-telling about the individual's risk. However, if the "outcome" is not fully within the individual's control, calibration itself is suspect. Proportional equality does not offer a mathematical workaround to satisfy error rates; it asserts that error rates are the wrong currency. Justice is satisfied when the distribution matches the merit, regardless of whether the false-positive rates are identical across groups.

  (b) On the matter of group-level rates versus particular persons: Aristotle's account of justice is fundamentally concerned with claims among particular persons. While he acknowledges that we distribute based on common types, the ultimate aim is to treat the individual according to their specific standing. Group-level statistics obscure the particular. To judge an individual by the error rates of their group is to treat them as a part without regard for their specific nature. For Aristotle, a risk score that relies on group base rates risks punishing the virtuous individual for the statistical tendencies of their class. This violates the requirement that desert must track voluntary action. If the base rate difference is caused by external fortune rather than voluntary choice, using it to determine individual risk is unjust, regardless of how the error rates are balanced.

  (c) Concerning who should make the choice among the criteria: Aristotle would find the authority of engineers and firms unintelligible and dangerous. In his political theory, the determination of what constitutes merit and how goods are distributed is the proper function of the lawgiver and the legislature, guided by practical wisdom (*phronesis*). It is a political question, not a technical one. To allow the builders of the instrument to decide which fairness property to surrender is to allow technicians to legislate. They lack the political authority and the ethical deliberation required to weigh the common good. The choice of which property to surrender determines who bears the burden of social risk; such a choice belongs to the sovereign authority of the state, embodied in law, not to the private calculation of the artisan.

  (d) Finally, regarding the failure of group criteria at the subgroup level: This phenomenon confirms Aristotle's view on the limitations of universal rules. In his discussion of equity (*epieikeia*), he notes that law is necessarily general, but life is particular. A rule that is just for a broad class may be unjust for a specific subset because the universal statement cannot capture every distinction. If a fairness criterion holds for a broad group but fails for a subgroup, it indicates that the classification is too coarse. The "whole" group is not a true unity for the purposes of justice. Aristotle would argue that this is not a failure of the fairness criterion per se, but a failure of the classification scheme. Justice requires distinguishing parts of the community that have different claims. If a subgroup is systematically misclassified by a rule designed for the whole, equity demands a correction that recognizes the specific nature of that part, rather than blindly applying the universal standard.

  3. The Strongest Objection and his reply

  The most serious objection to this reconstruction is that Aristotle's appeal to proportional equality merely disguises the selection of one horn of the trilemma. By insisting that desert must track merit, he effectively prioritizes calibration (the score meaning the same thing) over equal error rates. Thus, he has not escaped the trilemma; he has simply chosen to satisfy calibration and sacrifice equal error rates, accepting the mathematical impossibility as a moral necessity. Furthermore, one might argue that the impossibility theorem is a fact about predictors, not justice. It states a limit on information processing. Aristotle's theory of justice operates at the level of norms, not information theory. Therefore, the theorem leaves his theory untouched because it describes what *can* be predicted, while Aristotle describes what *ought* to be done. If the math says you cannot have both, Aristotle's demand for proportional justice is simply a demand for the impossible, rendering his verdict impractical.

  Aristotle's reply would be that the objection misunderstands the hierarchy of ends. The trilemma assumes that the *telos* of the instrument is prediction accuracy subject to constraints. Aristotle questions whether prediction of an external outcome is the proper *telos* of a just distribution. If the outcome (e.g., defaulting) is influenced by fortune, it is not a proper measure of desert. Therefore, the impossibility of predicting it fairly is irrelevant to justice. He does not choose calibration because it is mathematically convenient; he accepts it only insofar as it reflects the truth about the individual's capacity. If the math shows that truth cannot be captured without disparate error rates, he accepts the disparate error rates because justice is not about equalizing error, but about aligning reward and burden with voluntary action. The theorem describes a limitation of the *instrument*, not a limitation of *justice*. If the instrument cannot satisfy the conditions of justice without mathematical contradiction, the instrument is defective, not the theory of justice. He stands above the trilemma by denying that the statistical properties of the predictor are the final arbiters of the good.

  4. What would change his mind

  Aristotle's verdict would flip if the choice among the three criteria were explicitly codified by the legislature after public deliberation, rather than being determined by private engineers. In the scenario described, the trade-off is hidden within technical design choices made by firms. If, however, the political community, through its lawgivers, debated the relative importance of calibration versus error rate parity and enacted a law mandating a specific trade-off, Aristotle would accept this as a legitimate exercise of political authority.

  This feature carries weight because, for Aristotle, justice is inherently political. The definition of "merit" is not discovered by science but determined by the constitution of the city. If the legislature determines that equalizing false-negative rates is more important for the stability of the community than strict calibration, that decision becomes part of the *nomos* (law). While the mathematical impossibility remains, the moral dilemma vanishes because the choice is no longer arbitrary or technocratic; it is an expression of the collective practical wisdom of the polity. In this altered case, the instrument is no longer a private tool imposing hidden values, but a public mechanism executing a political decision. Aristotle would then view the sacrifice of one property not as a symptom of a badly posed question, but as a necessary compromise dictated by the law for the sake of the common good, rendering the trade-off a matter of legal justice rather than a philosophical error.
