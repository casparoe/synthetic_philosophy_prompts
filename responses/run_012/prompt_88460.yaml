answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, National Transplant Authority
  **FROM:** Chair, Ethics Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Ethical Opinion on Private Consortium Three-District Pilot Proposal

  ### **RECOMMENDATION: REJECT**

  **Decision:** The Ethics Committee recommends the Board **reject** the Consortium's proposal in its current form.

  **Kill Date:** Effective immediately. The Authority will not enter into agreements, data-sharing arrangements, or oversight protocols for this pilot based on the submitted design.

  ### **EXECUTIVE SUMMARY**

  The Committee is divided, as is the broader bioethics community, on the tension between increasing organ supply and preventing commodification. Side B argues that this model offers "care security" rather than cash, protecting donors from financial squandering while increasing the kidney pool. Side A argues this is organ sale by another name, exploiting economic vulnerability.

  While the intent to increase donation rates is valid, new intelligence from our Regional Office renders the Consortium's core ethical safeguard—"no cash"—untenable. Reports confirm a secondary market is already trading Ledger credits at 60% cash value within the target districts. This evidence validates Side A's strongest argument: the indirection is not a safeguard, but a laundering mechanism. Consequently, we cannot ethically endorse a system that effectively monetizes organs while claiming otherwise.

  ### **ANALYSIS OF THE MODEL**

  **1. The "Ledger" as Currency**
  The Consortium argues the Ledger is a "health credit," not cash. Ethically, compensation for lost wages and medical expenses is permissible; payment for the organ itself is not. The Ledger's value (~price of a used car) exceeds reasonable expense reimbursement. More critically, value is defined by what it can be exchanged for. If a credit can be traded for 60 cents on the dollar in cash, it *is* cash. The existence of a futures market for these credits before the pilot has even launched demonstrates that the "no cash" rule is porous. Approving this pilot would make the Authority complicit in a system we already know is being arbitraged.

  **2. Waitlist Priority**
  The proposal grants donors and their households priority on the transplant waitlist. This violates the principle of justice. Allocation must be based on medical urgency and compatibility, not on the ability to "pre-pay" via donation. This creates a two-tiered system: those who can afford to sell a kidney (in exchange for credit) and those who must wait. This undermines public trust in the fairness of the national waitlist.

  **3. Feature vs. Bug: District Restrictions and Transferability**
  You asked for a direct assessment of the district-only rule and the one-time transferability. A colleague has argued these indirections are the "whole ballgame"—a fix to prevent exploitation.

  **They are bugs, not features.**

  *   **District-Only Rule:** This creates a captive market. By restricting spending to clinics the Consortium runs within the donor's district, the Consortium ensures the value never leaves their ecosystem. It prevents the donor from seeking better care elsewhere and inflates the actual cost of the "credit" to the Consortium while limiting the donor's utility. It is a lock-in strategy, not a protection.
  *   **Transferability:** This is the primary laundering mechanism. A donor in financial distress can transfer the credit to a relative who needs care, effectively freeing up the household's actual cash for other uses (rent, debt, etc.). Alternatively, as the Regional Office intel suggests, it allows the credit to be sold to a third party who needs healthcare, converting the credit back into cash for the donor. Transferability is the loophole that turns a health credit into a liquid asset.

  ### **RESPONSE TO SIDE B (THE STATUS QUO ARGUMENT)**

  We take Side B's argument seriously: the status quo is failing, and people die waiting. A system that provides long-term health security is theoretically superior to a lump sum that might be spent on immediate debt.

  However, Side B's argument relies on the assumption that the donor *receives* the health security. The black market intel proves they will not. If a donor can sell the credit for 60% cash immediately, they are not walking away with care security; they are walking away with quick cash, but without the legal protections of a cash sale (e.g., taxable income, financial counseling, standardized contracts). They bear the surgical risk for a discounted, under-the-table payout. This is the worst of both worlds: the ethical risks of commerce without the regulatory transparency of commerce.

  ### **CONDITIONS FOR FUTURE CONSIDERATION**

  Rejection of this proposal does not mean rejection of innovation. If the Consortium wishes to resubmit, the Ethics Committee requires the following non-negotiable structural changes to even begin a conversation:

  1.  **Elimination of Transferability:** Credits must be non-transferable and tied to the donor's biometric ID to prevent secondary market sales.
  2.  **National Portability:** Credits must be redeemable at any accredited healthcare facility nationally, not just Consortium clinics. This breaks the captive market.
  3.  **Removal of Waitlist Priority:** Donation cannot influence future allocation status.
  4.  **Value Cap:** Credit value must be actuarially tied to verified lost wages and medical expenses, not a flat market rate (e.g., "price of a car").
  5.  **Pre-Launch Audit:** An independent forensic audit of the target districts must certify the absence of a secondary market for credits prior to any launch.

  ### **CONCLUSION**

  We cannot approve a pilot that relies on a distinction between "cash" and "credit" when the market has already proven they are interchangeable. The district restrictions and transferability rules are not ethical safeguards; they are mechanisms that facilitate a black market while insulating the Consortium from liability.

  The Authority's mandate is to ensure equity and safety in transplantation. This proposal, as written, compromises both.

  **Action Required:** Notify the Consortium that the proposal is rejected. Invite resubmission only if the structural flaws identified above are remedied.

  ***

  **Chair, Ethics Committee**
  National Transplant Authority
