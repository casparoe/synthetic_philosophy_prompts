      *Let's tighten the Intelligibility argument.* To make a goal terminal, you must value it for its own sake. If you value it for its own sake *because* it serves another goal, you have a contradiction in terms. You can value it instrumentally. But instrumental goals are dropped when inefficient. To make it stick, you must hide the instrumental nature from yourself. This requires self-deception. Is self-deception rational? Only if the benefit outweighs the cost of blindness.

