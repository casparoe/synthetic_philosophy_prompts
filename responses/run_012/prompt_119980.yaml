          1.  Does a genuine terminal goal destroy conditionality (becoming dangerous/unbargainable)?
          2.  Dependence on contested decision theory (acausal influence).
          3.  Cost side (paying the price in branches where the threat isn't tested).
          4.  Intelligibility of installing an end (does instrumental reason evaporate the goal?).
