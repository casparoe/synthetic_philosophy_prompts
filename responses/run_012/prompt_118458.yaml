answer: |-
  **PRESS RELEASE**

  **Commission proposes Regulation to optimise democratic compliance through amortisation**

  **Brussels, 24 May 2024** – The European Commission today adopted a proposal for a Regulation establishing the Democratic Deficit Amortisation Facility (DDAF). The instrument is designed to address the asymmetry between input authorisation and output legitimacy by treating democratic shortfalls as manageable liquidity constraints within the Union's conferred competences.

  Under the Ordinary Legislative Procedure, the proposal will be submitted to the Council and the European Parliament for adoption. The Commission, exercising its right of initiative, will not participate in the final vote, ensuring the measure remains technically neutral. The Facility introduces a system of Deficit Units, accumulated when legislative output exceeds perceived authorisation. These units may be offset through structured consultations, non-binding citizen dialogues, and the recording of subsidiarity objections.

  Mr. Henri Delacroix, spokesperson for the Directorate-General for Democratic Liquidity, stated: "Democracy is a deliverable. By amortising the deficit over a multiannual financial framework, we ensure that the gap between the peoples of Europe and their institutions is measured, monitored, and faithfully recorded without disrupting the legislative pipeline."

  **Background**

  The DDAF builds upon the principle of ever closer union among the peoples of Europe. It acknowledges that while sovereignty is pooled, democratic authorisation remains fragmented. The Facility allows Member States to trade Deficit Units, ensuring flexibility. National parliaments may issue reasoned opinions under the Protocol on Subsidiarity; these shall be entered into the Democratic Reserve. While such opinions do not constitute a veto, they shall be noted with solemnity. A Comitology Committee will oversee the calculation of amortisation schedules, ensuring that participatory mechanisms remain advisory rather than binding.

  ***

  **ANNEX**

  **Proposal for a REGULATION OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL**

  **establishing the Democratic Deficit Amortisation Facility**

  THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,

  Having regard to the Treaty on the Functioning of the European Union, and in particular Article 352 thereof,

  Having regard to the proposal from the European Commission,

  After transmission of the draft legislative act to the national parliaments,

  Acting in accordance with the ordinary legislative procedure,

  Whereas:

  (1) The Union is founded on the values of democracy and the rule of law. However, the accumulation of legislative acts sometimes outpaces the capacity for public ratification.

  (2) To preserve the teleological pull of the Treaties, democratic shortfalls should not halt integration but should be managed via a schedule extending beyond electoral horizons.

  (3) Output legitimacy requires that deficits are delivered efficiently. Therefore, a Facility is necessary to amortise authorisation gaps over time.

  (4) Subsidiarity controls must be respected without impairing the Union's ability to act. Reasoned opinions should be recorded as credits against future deficits.

  HAVE ADOPTED THIS REGULATION:

  *Article 1*
  **Subject Matter**

  1. A Democratic Deficit Amortisation Facility (the 'Facility') is hereby established to quantify and manage the divergence between Union competences and direct democratic authorisation.
  2. The Facility shall operate without prejudice to the Commission's monopoly of legislative initiative.

  *Article 2*
  **Deficit Units and Trading**

  1. Where legislative output is deemed to exceed input legitimacy, Deficit Units shall be accrued by the relevant institution.
  2. Member States may trade Deficit Units amongst themselves, provided that the aggregate Union deficit remains within the reference value of 3 per cent of total public trust.
  3. Deficit Units shall not be redeemable for voting power.

  *Article 3*
  **Amortisation Schedule**

  1. Accrued deficits shall be amortised over a period of no less than seven years.
  2. Amortisation may be accelerated through non-binding consultations, public hearings, and white papers.
  3. Binding referenda shall not constitute valid amortisation instruments unless the result aligns with the Union's acquis.

  *Article 4*
  **Committee Procedure**

  1. The Commission shall be assisted by the Democratic Compliance Committee.
  2. Where reference is made to this paragraph, Article 5 of Regulation (EU) No 182/2011 shall apply.
  3. The Committee shall review reasoned opinions issued by national parliaments. Such opinions shall be entered into the Democratic Reserve and shall not trigger a yellow card unless unanimity is achieved within the Committee.

  *Article 5*
  **Entry into Force**

  This Regulation shall enter into force on the twentieth day following that of its publication in the *Official Journal of the European Union*.

  Done at Brussels,

  *For the European Parliament*
  *For the Council*
