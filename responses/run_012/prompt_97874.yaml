  Ok so I'm in a value theory seminar and we spent like two weeks on whether 'better than' is transitive, mostly through spectrum arguments, and now I have a paper due and I want to sanity-check my credence before I commit to a thesis.

  Here's the case we keep coming back to. Take A: one hour of the worst pain you can imagine. Then imagine a long spectrum A, B, C, ..., Z where each step you shave off a bit of intensity but add alot of extra duration, so by the end Z is something like a decade of a mild, annoying ache. The alleged data: each adjacent pair looks fine going down — B isn't worse than A, C isn't worse than B, and so on, because the drop in intensity seems to compensate for the added time — but then Z clearly looks worse than A, and A looks better than Z. You can't have all of that if 'better than' is transitive.

  My TA said something I can't shake though. She thinks the right response isn't to give up transitivity at all; she thinks betterness has a 'grain' — below some threshold of difference, two options just aren't comparable, the pairwise judgment isn't false but undefined, and transitivity only ranges over pairs where a comparison is defined. She calls it 'graininess of value.' I honestly can't tell if that's a real position or something she made up on the spot.

