  I've read the rationalist blogs for years, and professionally I'm a distributed-systems engineer, so my native vocabulary is consensus protocols and state-machine replication, local state and views, gossip, eventual consistency, the two-generals/coordinated-attack problem, and the result I take for granted that common knowledge is not something you can establish by message passing over a lossy channel. Take Aumann's agreement theorem, together with the gloss the rationalist community usually puts on it — roughly, that two agents who share a prior and are commonly known to be rational Bayesians cannot agree to disagree, so persistent disagreement points to a failure somewhere upstream — and restate it in my vocabulary as faithfully as you can: agents as nodes, priors and posteriors as their local state and outputs, "knowledge" as whatever a node can compute from its own state, common knowledge as the fixed point in which every node's state already encodes the whole configuration. Then give me the residue report. Which parts of the theorem survive the translation intact; which do I have to fudge (I suspect "Bayesian rationality" and "logical omniscience" have no honest counterpart, and that the partitional model of information quietly assumes away the very noise my protocols exist to tolerate); and what in the theorem cannot be said in my terms at all. Tell me whether the residue is a defect of the engineering vocabulary or a sign that the rationalist takeaway is doing less work than it sounds — in particular, whether the theorem smuggles in, under the heading of "common knowledge," exactly the simultaneity that the two-generals result says you cannot have. End with a line beginning "Verdict:" naming the single element that fails to survive the translation most decisively.
