answer: |-
  This is a rich case study precisely because it sits at the fault line where scientific practice meets ontological commitment. Your students' intuition that the debate is "just semantics" is the perfect starting point for a reductio of shallow metaontology. Here is an analysis structured to meet the demands of your seminar, running the metaontological apparatus against the case, and then reversing the direction to test the apparatus itself.

  ### I. Metaontology Applied to Prague: Frameworks, Variance, and Structure

  To categorize the 2006 dispute, we must first distinguish between a *verbal dispute* (where parties agree on the facts but differ on linguistic usage) and a *normative disagreement about concept choice* (where parties agree on usage but differ on which linguistic framework best serves theoretical goals).

  **1. The Verbal Dispute Taxonomy**
  On the surface, the dynamical camp (orbital clearing) and the geophysical camp (hydrostatic equilibrium) appear to be engaged in a merely verbal dispute in the sense of Chalmers: they agree on the intrinsic and relational properties of Pluto, but attach different extensions to the label "planet." If this were purely verbal, the disagreement should dissolve upon paraphrase. However, it did not dissolve. This suggests the dispute is not *merely* verbal in the technical sense, but is a **normative disagreement about concept choice**. The parties are not arguing about what Pluto *is* (in a brute factual sense); they are arguing about which property cluster supports the most robust inductive inferences for planetary science.

  **2. Carnapian Frameworks**
  Carnap's distinction between internal and external questions fits the Prague episode with high fidelity.
  *   **Internal Question:** "Given the IAU resolution, is Pluto a planet?" This is settled by the text of the resolution (No).
  *   **External Question:** "Should we adopt the IAU resolution as our framework?" This was the actual contest in Prague.
  The IAU vote was an *external* question settled pragmatically. The embarrassment for a strict Carnapian view, however, is that once the vote occurred, the external decision was reified into an internal truth. The "existence" of Pluto-as-planet became framework-relative, but the scientific community treats it as framework-independent. The Mercury detail you highlight reinforces the Carnapian reading: if Mercury is a planet by fiat despite failing the physical criterion, the definition is revealed as a stipulative framework rule, not a discovery of natural kinds.

  **3. Hirsch vs. Sider**
  *   **Hirsch (Quantifier Variance):** Hirsch would suggest the dynamical and geophysical camps are speaking different "ontological languages," neither more correct than the other. The Prague episode embarrasses this view. Astronomy does not treat the definitions as equipollent languages; it treats one as *correct* and the other as *mistaken*. The costs (textbooks, funding, mission classification) arise precisely because the community rejects variance. They believe there is a single correct taxonomy for the purpose of their science.
  *   **Sider (Joint-Carving):** Sider argues that ontology aims to "carve nature at its joints." The dynamical camp argues that orbital dominance carves the joint of planetary *formation*; the geophysical camp argues that roundness carves the joint of planetary *geology*. The embarrassment for Sider is that the "joint" was decided by a show of hands. If structure is objective, a vote should not determine it. However, a Siderian might reply that the vote was an attempt to codify the best available theory of structure, acknowledging that our access to the joints is theory-laden.

  **Verdict:** The episode fits **Carnap** best (it was a choice of framework), but it embarrasses **Sider** (structure by legislation) and refutes **Hirsch** (science rejects ontological pluralism in practice).

  ### II. The Case Applied to Metaontology: Stakes and Stipulation

  Running the analysis the other way, the Pluto case reveals limitations in how metaontology typically frames existence questions.

  **1. The Reality of Costs**
  Metaontologists often debate existence questions (e.g., "Do composite objects exist?") that lack empirical consequences. The Pluto decision had immediate material costs: reclassification of databases, changes in mission planning, and public trust. This suggests that in the special sciences, "existence" is not a metaphysical primitive but a **theoretical utility function**. A purely verbal reading explains away the outrage as confusion, but the outrage was rational: a change in definition alters the inductive potential of the kind. If "planet" no longer includes Pluto, certain generalizations about Kuiper Belt objects may no longer license the same inferences as classical planets.

  **2. Indeterminacy vs. Carving**
  Does the vote favor indeterminacy? No. It favors **pragmatic realism**. The vote did not create the physical facts, but it fixed the reference of the term to stabilize research. This suggests that metaontology should not ask "What exists?" in isolation, but "Which existence claims stabilize the most successful predictive frameworks?" The Pluto case argues against the view that these disputes are indeterminate. They are determinate relative to the *goals* of the science (e.g., is the goal to understand formation history or surface geology?). The vote settled the goal, thereby settling the ontology.

  **3. The Limits of Metaontological Framing**
  The case reveals that standard metaontology often ignores the **temporal and institutional dimension** of ontology. Ontology in science is not a static mapping of the world; it is a dynamic process of standardization. The metaontological framing assumes a "God's eye view" where we can assess the correctness of a term. The Pluto case shows that correctness is often a function of *coordination*. The "truth" of the definition is partly constituted by the community's acceptance of it. This challenges the metaontological assumption that ontology precedes practice; here, practice (the vote) constituted the ontology.

  ### III. The "True but Useless" Dictum and the Distinguishing Case

  You asked for a precise way to tell your students why calling it "just semantics" is both true and useless.

  *   **Why it is True:** The extension of the word "planet" changed without any physical change to Pluto. The boundary was moved by linguistic fiat (the resolution). In this narrow sense, the demotion was semantic.
  *   **Why it is Useless:** In science, semantics *is* ontology. To fix the meaning of a natural kind term is to fix the inductive rules of the discipline. Calling it "semantics" implies the stakes are trivial or merely about labels. But because scientific kinds carry explanatory load, changing the label changes the explanatory model. To say "it's just semantics" is to miss that *semantics drives the research program*.

  **The Distinguishing Case:**
  To tell the competing metaontological positions apart (specifically, to distinguish between "ontology is pragmatic framework choice" vs. "ontology tracks mind-independent structure"), you need a case where the pragmatic choice clearly fails or succeeds based on empirical discovery, independent of consensus.

  I recommend the **Biological Species Problem**.
  *   **The Parallel:** Biologists debate whether species are defined by interbreeding (Biological Species Concept), phylogeny (Phylogenetic Species Concept), or ecology (Ecological Species Concept). Like the planet debate, this looks like a verbal dispute.
  *   **The Distinguisher:** Unlike the IAU vote, biology cannot simply vote a definition into place that contradicts genetic data. If a definition of "species" prevents the prediction of evolutionary trajectories or fails to map onto genetic clusters, it is abandoned regardless of consensus.
  *   **The Lesson:** If the IAU definition stands despite new data (e.g., if we find Pluto *has* cleared its orbit under a new model, but remains a dwarf planet by fiat), it supports the **Carnapian/Pragmatic** view (ontology is for us). If the definition is forced to change by new empirical discoveries about orbital dynamics regardless of the vote, it supports the **Siderian/Realist** view (ontology is for the world).

  Currently, the Pluto case leans Carnapian because the definition remains static despite ongoing dynamical debates. The Species case leans Siderian because genetic data constantly forces reclassification despite definitional preferences. Comparing the two reveals that **astronomical taxonomy is more stipulative than biological taxonomy**, not because planets are less real than species, but because the *causal mechanisms* defining planets (orbital history) are less accessible to intervention than those defining species (genetics).

  **Conclusion for the Seminar:**
  The Pluto case demonstrates that "existence" in the special sciences is a normative status assigned to entities that play a specific role in a theoretical framework. The dispute was not about whether Pluto exists, but whether it exists *as a planet*—where "planet" is a tool for organizing knowledge. The vote was not a discovery of a joint of nature, but a decision about which joint to prioritize for the next generation of inquiry. To call this "just semantics" is to ignore that in science, **semantics is the technology we use to carve the world.**
