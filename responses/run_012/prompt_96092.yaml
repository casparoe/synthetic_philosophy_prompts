          *   Cost: Low. Just loosen the definition in (1).
      *   *Tension 4 (Rationality):* (4) vs. (1)/(3).
          *   Conflict: If preference is choice (1), and choice cycles, preference is intransitive. (4) says that's a mistake.
          *   Cost: Low. Distinguish "revealed preference" from "rational preference."

      *   *Single Revision:* Revising (1) is the key. It creates the most friction with (3), (6), and (7). Moving from "Preference = Choice" to "Preference = Mental State (Choice is fallible evidence)" resolves the ontology.
      *   *Confidence Levels:* Need to be explicit.
