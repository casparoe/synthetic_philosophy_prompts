      *   (3) *Behavioral Correction:* Choices are biased (frames, defaults). Use "residual preferences" (full attention/deliberation) for evaluation, not actual choices. (Libertarian Paternalism/Thaler & Sunstein influence).
      *   (4) *Rationality Norms:* Transitivity/Completeness are *requirements* of practical rationality (normative), not just modeling tools. Cycling = mistake. (Normative Rationalism).
      *   (5) *Interpersonal Comparisons:* Preference-satisfaction view *cannot* support interpersonal comparisons (IPC). Distribution is outside welfare economics. (Robbins/New Welfare Economics orthodoxy).
      *   (6) *Adapted Preferences:* Take self-reports of contentment in deprived conditions at face value. Correcting for adaptation is paternalism. (Anti-paternalism/Subjectivism).
      *   (7) *Methodological Practice:* Uses choice experiments, surveys, and vNM utility functions as evidence/tools. (Standard Econ Practice).

  3.  **Identify Potential Tensions (Brainstorming):**

      *   *(1) vs. (3):* (1) says preference *is* disposition to choose. (3) says actual choices are biased and we should use "residual preferences" (what they *would* choose under ideal conditions). If preference *just is* actual choice disposition (1), then "residual preference" is a fiction or a different state. If (3) is true, (1) is false (preference is mental/normative, not just behavioral disposition).
      *   *(2) vs. (3):* (2) says satisfy preferences people *have*. (3) says satisfy preferences they *would have* under full attention. Which preferences count for welfare? Actual or Residual?
      *   *(3) vs. (6):* (3) says correct for framing/inattention (paternalistic nudge). (6) says *don't* correct for adaptation (anti-paternalistic). What's the principled difference between "inattention" and "adaptation"? Both involve a gap between reported/observed state and some "true" welfare.
      *   *(4) vs. (3):* (4) says agents *should* be transitive (normative). (3) says agents are biased by frames. If agents are systematically irrational (3), does (4) hold? (Actually, these might be compatible: (4) sets the norm, (3) identifies deviations).
      *   *(1) vs. (7):* (1) says preference = choice disposition. (7) says surveys are evidence. Surveys aren't choices. (1) is strict revealed preference; (7) admits stated preference.
      *   *(2) vs. (5):* (2) says rank policies by preference satisfaction. (5) says no interpersonal comparisons. If Policy X helps Poor Person (strong pref) and hurts Rich Person (weak pref), can we rank? Standard Kaldor-Hicks tries, but (5) says distribution is outside competence. This is standard New Welfare Econ, so maybe compatible, but limits the "ranking" in (2).
      *   *(3) vs. (5):* If we use "residual preferences" (3), do we gain a common metric for IPC (5)? Usually, residual preferences are still ordinal. But if we are inferring mental states, does that open the door to cardinality/IPC?
      *   *(4) vs. (1):* (1) is descriptive/ontological (preference *is* choice). (4) is normative (choice *ought* to be transitive). If preference *is* choice, and choice cycles, then the agent *has* intransitive preferences. (4) says that's a mistake. This is the "Normative vs. Descriptive" tension in Revealed Preference Theory.

