      *   *High Cost (Foundational):* (1) vs. (3). This is the core ontological clash. You can't define preference as actual choice disposition *and* claim the relevant preference for welfare is the counterfactual "residual" one.
      *   *Medium-High Cost (Normative Consistency):* (3) vs. (6). Why is correcting framing okay but correcting adaptation not? This requires a theory of "authenticity" or "competence" that isn't currently stated.
      *   *Medium Cost (Methodological):* (1) vs. (7). Strict revealed preference rejects surveys. (7) accepts them. Easy fix: loosen (1).
      *   *Low Cost (Clarification):* (2) vs. (5). This is standard Paretian limitation. Just needs clarification that ranking is partial.
      *   *Low Cost (Normative/Descriptive):* (4) vs. (1). Can be resolved by distinguishing "positive preference" from "normative rationality."

  5.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the sophistication of the position. It's a "Behavioral Welfarist" stance with orthodox constraints.
      *   *Tension 1 (The Big One):* (1) vs. (3). Ontology of Preference.
