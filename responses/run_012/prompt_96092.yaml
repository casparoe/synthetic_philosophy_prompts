      *   Check the constraint: "order by repair cost."

      *(Self-Correction during drafting)*: Wait, look at (5). (5) says no IPC. (3) implies we can know "residual preferences." If we can model residual preferences via vNM (7), do we have cardinal utility? If we have cardinal utility, (5) becomes harder to defend (though still possible via ordinalism). But the bigger issue is (1) vs (3).
      Let's look closer at (3) vs (6). (3) corrects for *process* errors (attention). (6) refuses to correct for *preference formation* errors (adaptation). This is a standard distinction in behavioral welfare (e.g., Bernheim, Rangel). It's defensible but needs articulation. I should rate the tension as "Apparent but requires articulation" rather than "Fatal."
