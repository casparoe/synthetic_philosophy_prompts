      **Joint Statement on Welfare Inference from Choice Data**

      **1. Agreed Claims**
      1.  **Choice Data Limits:** Choice data establishes what users *did* under specific constraints. It does not logically entail what users *would* do under different constraints, nor does it automatically establish welfare.
      2.  **Menu Relativity:** We agree every choice is relative to an available set (menu). Product changes alter menus. Neither side claims a "view from nowhere" exists; all welfare claims are menu-relative, though we disagree on whether some menus are normatively privileged.
      3.  **Self-Reports:** Stated preferences (surveys) are behavioral data subject to noise and hypothetical bias. They are neither authoritative truth nor irrelevant noise.
      4.  **Audit-Stable Criterion:** We accept "audit-stability" as a coherent empirical test: a choice is audit-stable if the user maintains it after seeing a plain description of the producing mechanism and displaced options. Both sides agree choices failing this test are empirically distinct from those passing it.
      5.  **Terminology:** We acknowledge partial verbal dispute over "preference" (choice vs. psychological state). However, substantive disagreement remains regarding whether welfare tracks actual choices or underlying states.

      **2. Residual Disagreements**

      | Issue | Choice-Constitutive View | Choice-Evidential View |
      | :--- | :--- | :--- |
      | **Welfare Source** | Welfare is satisfied by actual choices made within the live menu. | Welfare is satisfied by choices tracking underlying interests/values. |
      | **Auto-Play Default** | Keeping autoplay on maximizes welfare (users chose viewing). | Turning autoplay off may maximize welfare (aligns with stated values/rest). |
      | **Audit-Stable Status** | Failing audit-stability reveals context-dependence, not error. | Failing audit-stability reveals manipulation or error, weakening welfare claims. |
      | **Paternalism** | Intelligible only as changing menus to match revealed choices. | Intelligible as aligning choices with user good, even against current choice. |

      **3. Cruxes**

      **Crux 1: The Normative Weight of Audit-Stability**
      *   **Sub-question:** Does failing an audit test invalidate a welfare claim based on the original choice?
      *   **Concrete Case:** Auto-play users shown the algorithmic description and viewing displacement data.
      *   **CC Prediction:** If users turn autoplay off post-audit, their *new* choice constitutes preference. The *old* choice was still constitutive at the time; welfare is time-indexed to choice.
      *   **CE Prediction:** If users turn autoplay off post-audit, the *old* choice was evidence of a mistaken preference. Welfare was likely lower during the period of non-audit-stable choices.

      **Crux 2: Menu Neutrality and Defaults**
      *   **Sub-question:** Can we compare welfare across different default menus?
      *   **Concrete Case:** Comparing welfare in "Autoplay On" vs. "Autoplay Off" experiments.
      *   **CC Prediction:** Welfare comparisons across menus are category errors. We can only compare satisfaction within the chosen menu. The 1/3 viewing drop is a welfare loss relative to the "On" menu.
      *   **CE Prediction:** Welfare comparisons across menus are possible if one menu better facilitates audit-stable choices. The 1/3 viewing drop may be a welfare gain if it reflects restored agency.

