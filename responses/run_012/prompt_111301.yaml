      *   **Sub-question:** Is default inertia (not touching settings) a choice?
      *   **Concrete Case:** The majority who never touch autoplay settings.
      *   **CC Prediction:** Inertia is a choice to accept the default. It constitutes a preference for the status quo.
      *   **CE Prediction:** Inertia is ambiguous evidence. It may signal indifference, consent, or friction-induced error. It requires audit-stability testing to resolve.

