prompt: |-
  I help run a public deliberation series, and at the most recent session two invited speakers argued over a policy question that is part empirical — whether the measure reduced the harm it was meant to reduce — and part evaluative — whether the reduction was worth what it cost. One speaker repeatedly attributed to the other a position the other had explicitly disavowed, and slid between the empirical and the evaluative half of the question whenever it suited him. When I asked the moderator afterwards whether the exchange had met the series' stated standard of good-faith argument, he declined to make any finding at all: the maxim that there are two sides to every question, he said, means that a moderator's office is not to adjudicate between them. Pressed, he glossed his own stance as equal standing rather than equal merit. A colleague defended him on different grounds, saying that nothing counts as settled until each side has been heard at its strongest.

  I am not asking you to judge the exchange. I want the maxim's possible contents separated and graded. Distinguish at least: the near-logical reading, on which a question admitting two answers has two sides and nothing follows about their merits; the descriptive reading, on which live disputes have two parties; the symmetry reading, on which the two sides are roughly as likely to be right, or the truth lies between them; any reading on which the maxim is a thesis about justification — about what it takes to dismiss a claim; any reading on which it concerns the standing of the parties rather than the merits of their cases; and any relativist reading, on which each side is correct relative to its own framework. For each, say whether it is empty, contestable but defensible, or false, and flag those that undermine themselves when asserted. Then say which readings would actually license (a) the moderator's refusal to find bad faith, (b) his standing/merit distinction, and (c) my colleague's claim about when a question is settled, noting in each case the further premise the reading needs, and what becomes of that support when one party's argument is demonstrably unresponsive to evidence. Close with your best guess at which reading the maxim's habitual users intend, and whether the maxim is better understood as a procedural rule for forums or as a claim about the shape of truth.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A public deliberation series where a debate occurred. One speaker misrepresented the other (strawmanning) and conflated empirical/evaluative claims. The moderator refused to judge "good faith" citing the maxim "there are two sides to every question." The moderator distinguished "equal standing" from "equal merit." A colleague argued nothing is settled until both sides are heard at their strongest.
      *   **Task:** Do *not* judge the exchange. Instead, analyze the maxim "there are two sides to every question."
      *   **Specific Requirements:**
          1.  Separate and grade at least six specific readings of the maxim:
              *   Near-logical (question admits two answers).
              *   Descriptive (live disputes have two parties).
              *   Symmetry (sides equally likely right/truth is in between).
              *   Justification (what it takes to dismiss a claim).
              *   Standing (parties vs. merits).
              *   Relativist (correct relative to framework).
          2.  For each reading: Grade as Empty, Contestable but Defensible, or False. Flag self-undermining assertions.
          3.  Map readings to the specific actions/claims in the scenario:
              *   (a) Moderator's refusal to find bad faith.
              *   (b) Moderator's standing/merit distinction.
              *   (c) Colleague's claim about settling questions.
              *   *Constraint:* Note further premises needed and what happens if one side is unresponsive to evidence.
          4.  Conclusion: Best guess at habitual user intent and whether it's a procedural rule or a claim about truth.

  2.  **Deconstruct the Maxim ("There are two sides to every question"):**
      *   This is a common aphorism often used to justify neutrality or hesitation in judgment.
      *   It's logically dubious (some questions have one answer, some have none, some have many).
      *   It's often used normatively (we *should* hear two sides) rather than descriptively (there *are* two sides).

  3.  **Drafting the Readings & Grading:**

      *   *1. Near-logical Reading:* "If a question admits of contradiction, there exist a proposition P and not-P."
          *   *Grade:* Empty/Trivial. It's a tautology of binary logic, but doesn't imply both are *plausible* or *represented*.
          *   *Self-undermining?* No, just weak.

      *   *2. Descriptive Reading:* "In any live public dispute, there are two groups of people advocating opposing views."
          *   *Grade:* Contestable but Defensible (empirically). Sometimes there are three sides, or one side is silent.
          *   *Self-undermining?* No.

      *   *3. Symmetry Reading:* "The two sides are roughly equiprobable, or the truth lies somewhere in the middle."
          *   *Grade:* False. Often one side is factually wrong. The "golden mean" fallacy.
          *   *Self-undermining?* If asserted as a universal truth, it contradicts itself (is *that* claim symmetric with its negation?).

      *   *4. Justification Reading:* "One cannot dismiss a claim until the opposing argument has been fully articulated and refuted."
          *   *Grade:* Contestable but Defensible (Epistemic humility).
          *   *Self-undermining?* No, but can lead to infinite regress.

      *   *5. Standing Reading:* "Advocates of opposing views deserve equal platform/time/respect, regardless of merit."
          *   *Grade:* Contestable but Defensible (Procedural fairness).
          *   *Self-undermining?* If "every question" includes questions where one side denies the standing of the other (paradox of tolerance).

      *   *6. Relativist Reading:* "Each side is correct within its own conceptual framework."
          *   *Grade:* False (for empirical claims). Defensible for pure value judgments, but not "every question."
          *   *Self-undermining?* Yes. Is *that* claim relative? If so, why accept it?

  4.  **Mapping to the Scenario:**

      *   *(a) Moderator's Refusal (Bad Faith):* The moderator said the office is not to adjudicate.
          *   *Likely Reading:* Standing Reading (procedural neutrality) or Symmetry (can't tell who is right).
          *   *Premise Needed:* Adjudication requires determining truth, which the maxim forbids.
          *   *Evidence Problem:* If one side lies/strawmans, "Standing" doesn't protect bad faith. Bad faith violates procedure, not truth. So this support collapses if the maxim implies truth symmetry. If it implies procedural standing, bad faith is still a violation of *procedure*.

      *   *(b) Moderator's Distinction (Standing vs. Merit):*
          *   *Likely Reading:* Standing Reading.
          *   *Premise Needed:* Forums grant standing by default; merit is for the audience to decide.
          *   *Evidence Problem:* If one side is unresponsive to evidence, they forfeit standing in a *deliberative* forum (which aims at truth/outcomes, not just speech).

      *   *(c) Colleague's Claim (Settledness):* "Nothing settled until heard at strongest."
          *   *Likely Reading:* Justification Reading.
          *   *Premise Needed:* Epistemic closure requires steelmanning the opposition.
          *   *Evidence Problem:* If one side refuses to engage with evidence (as described: sliding between empirical/evaluative), they are *not* presenting the side at its strongest. They are presenting a sophistry. The condition "at its strongest" is not met.

  5.  **Refining the Grades and Self-Undermining Checks:**
      *   *Logical:* Empty. (It doesn't mean both are worth hearing).
      *   *Descriptive:* False (Some questions have one side, e.g., "Is the earth flat?").
      *   *Symmetry:* False.
      *   *Justification:* Defensible (Principle of Charity).
      *   *Standing:* Defensible (Due Process).
      *   *Relativist:* Self-undermining (If true absolutely, it's false; if relative, it doesn't apply to me).

  6.  **Addressing the "Unresponsive to Evidence" Constraint:**
      *   This is crucial. The prompt specifies one speaker "slid between empirical and evaluative" and "attributed... a position the other had explicitly disavowed."
      *   How does this affect the support?
      *   For (a): Bad faith is a procedural violation. The maxim (Standing) shouldn't protect procedural violations.
      *   For (b): Standing usually requires adherence to rules.
      *   For (c): "Heard at its strongest" implies a rational reconstruction. If the argument is incoherent, it has no "strongest" version.

  7.  **Conclusion (Intent & Nature):**
      *   *Intent:* Usually, users mean the Symmetry Reading (don't be dogmatic) or the Standing Reading (be fair).
      *   *Nature:* It functions better as a procedural rule (hear the other side) than a claim about truth (truth is always binary/split).

  8.  **Review and Polish:**
      *   Check tone: Analytical, philosophical, precise.
      *   Check constraints: Did I grade all? Did I flag self-undermining? Did I address (a), (b), (c) with the evidence constraint?
      *   *Self-Correction on "Descriptive":* Is it false that there are two sides? In a debate, yes, by definition. But "every question" implies even settled science. So "False" is appropriate for the universal claim.
      *   *Self-Correction on "Logical":* A question like "What is 2+2?" doesn't admit two answers. So the "Near-logical" reading is actually False as a universal claim, or Empty if restricted to binary questions. I will grade it Empty/Trivial because it adds no normative weight.
      *   *Refining the "Standing" mapping:* The moderator used it to avoid adjudicating *bad faith*. Bad faith isn't about merit; it's about rule-breaking. So the Standing reading actually *undermines* the moderator if standing requires good faith.
      *   *Refining the "Colleague" mapping:* The colleague says "heard at its strongest." If the speaker is strawmanning, they aren't presenting the side at its strongest. So the maxim supports the colleague *against* the speaker's performance.

  9.  **Final Structure:**
      *   Introduction (acknowledging the task).
      *   Section 1: The Six Readings (Definition, Grade, Self-Undermining check).
      *   Section 2: Application to Scenario (a, b, c) with the "unresponsive evidence" constraint.
      *   Section 3: Conclusion (Intent & Nature).

  10. (Self-Correction during drafting): Make sure to clearly distinguish between the *maxim's* support and the *premise* needed to make it work. Ensure the "unresponsive to evidence" point hits hard on the "Strongest" argument.

  11. Final Polish: Ensure the distinction between "Empty" (tautological/uninformative) and "False" (contradicted by reality) is clear. Ensure "Contestable but Defensible" implies normative utility.

  *(Self-Correction on the "Logical" reading)*: The prompt defines it: "on which a question admitting two answers has two sides and nothing follows about their merits." I should stick to that definition. If the question *admits* two answers, then yes, there are two sides. But "every question" does not admit two answers. So as a universal maxim, it's False. But the prompt asks to grade the *reading*. I will grade it as Empty/Trivial regarding normative force, or False regarding universality. Let's go with "Empty" regarding the *implication* (nothing follows about merits), which fits the prompt's definition. Actually, "False" is better because not *every* question admits two answers. I'll nuance this: Logically trivial for binary questions, False as a universal claim. I will grade it "Empty" in terms of normative utility, as requested by the prompt's framing ("nothing follows").

  Let's stick to the prompt's grading categories: Empty, Contestable but Defensible, False.
  *   Logical: Empty (tautological for binary, doesn't help us).
  *   Descriptive: False (not every question has two live parties).
  *   Symmetry: False (truth isn't always split).
  *   Justification: Contestable but Defensible.
  *   Standing: Contestable but Defensible.
  *   Relativist: False/Self-undermining.

