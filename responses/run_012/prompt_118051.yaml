      3. Center the "Wanting to Want" as the source of the reason.
      4. Center the "Novel" as the boundary condition.
      5. Advise on integration.

      *Wait, one nuance:* "She says the only thing keeping her at the bedside is a belief that the patients' need gives her a reason to stay, and she cannot tell whether that belief is a genuine reason or just the residue of guilt."
      My job is to help her distinguish guilt from reason.
      Guilt = "I will be bad if I leave."
      Reason = "There is value in staying that I endorse."
      Her "wanting to want" proves she endorses the value. So it's a reason, not just guilt.
      But is it a *sufficient* reason? That's the second part.

