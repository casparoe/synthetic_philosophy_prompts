answer: |-
  Yes, there is a single principle that captures almost all of your gut feelings. It is not about what the thing *does*; it is about **why the thing is there.**

  Here is the principle, stated as precisely as I can:

  **The Principle of Selected Persistence**
  > A trait has a function if and only if it exists in its current form *because* a specific benefit caused it to be passed down (either through natural selection in the past or intelligent design in the present).

  In other words: **Function is the historical reason for the trait's survival.**

  ### How this principle matches your gut

  **1. The Heart & Feathers (Yes, Function)**
  The heart is there because pumping blood kept ancestors alive. Feathers are there *now* because flight kept ancestors alive (even if warmth started it, flight is why they stuck around and grew). The principle holds: the benefit explains the persistence.

  **2. The Vestigial Nub & Unique Bone Lump (No Function)**
  The nub is there because evolution hasn't bothered to delete it yet, not because it helps. The unique lump is an accident. Neither exists *because* of a benefit. They are just history or noise. Your gut says "no function," and the principle agrees: there is no "Selected Persistence."

  **3. The Lucky Mutation (No Function... Yet)**
  This is the crucial test. It helps, but it spread by luck (drift), not because the help caused it to spread. It hasn't been "selected" yet. It hasn't earned its place through success. Your gut says "premature," and the principle agrees: the benefit did not cause the persistence *yet*.

  **4. The Rock (Yes, Function)**
  This is the exception that proves the rule. Biological traits need evolutionary time to "earn" function. Artifacts (rocks, chairs, clocks) get function instantly because **Agent Intent** replaces **Natural Selection**. The rock is on the desk *because* you put it there to hold papers. The "reason it is there" is your intention.

  **5. The Moth to Flame (No Function)**
  The moth's attraction to light might have a function (navigation), but the *death* is not the function. The death did not cause the trait to persist; the trait persists *despite* the death. Your gut says the death isn't a function. The principle agrees: a detrimental outcome cannot be the reason for persistence.

  **6. The Rare Poison Tolerance (Yes, Function)**
  Even if it's idle most of the time, the trait exists *because* that rare survival event saved ancestors in the past. The benefit explains the persistence, even if the frequency is low.

  ### Where your gut wobbles (and why)

  You mentioned two areas where you feel tension. Here is what the principle says about them.

  **1. The Wings for Balance (Function Changed)**
  You feel the function changed from flight to balance. The principle agrees. If the animal no longer flies, but the wings are kept in the population *because* they provide balance, then "balance" is the current reason for persistence. The function updates to match the current selection pressure.

  **2. The Exaptation (Old trait, new use, old use gone)**
  *The Case:* A feature selected for A long ago. Now it does B (useful), and A never happens.
  *The Verdict:* **The function is B (The New Use).**
  *Why:* If A is gone, A is no longer the reason the trait persists. If the trait is still common, it must be because B is now doing the work of keeping it in the population. If B is useful but *not* the reason it's common (e.g., it's just neutral drift now), then it has **No Function**. But if B is actively maintaining the trait, the function updates. Your gut is conflicted because you sense the "history" of A, but the "reality" of B. The principle sides with reality: Function follows the *current* reason for persistence.

  ### The Difference Between "For" and "Does"

  Your biologist is right to insist there is a difference.
  *   **What it does:** Its current causal effect (e.g., the heart makes a thumping sound).
  *   **What it is for:** The effect that explains why it exists (e.g., the heart pumps blood).

  A trait can *do* many things, but it is only *for* the one that saved its ancestors (or satisfied its designer). This is why the moth dying is something it *does*, but not what it is *for*.

  ### The Prediction: The Human-Changed Environment

  *The Case:* A trait that is useful now *only* because humans changed the environment. Nothing in the animal's own history ever selected for this specific benefit. (Example: A city pigeon with a gut bacteria that allows it to digest fast-food grease, which didn't exist 200 years ago).

  *The Prediction:* **It has no function.**
  *Why:* Under the Principle of Selected Persistence, the trait has not yet been "selected" for this new benefit. It is merely a lucky accident that happens to work now. It is in the same category as your "Lucky Mutation." It is *doing* something useful, but it is not *for* that thing yet. It hasn't earned the title.

  *Unless:* The human environment has been stable for thousands of generations, and this trait has specifically spread *because* of the human change. If it's recent (industrial era), it's just a capacity, not a function.

  ### Summary for your Character

  If your biologist wants to be consistent with your gut, she should speak like this:

  > "Don't tell me what it does. Tell me why it's still here. If it's here because it helped its grandparents survive, it has a function. If it's here because of luck, or because we haven't gotten around to deleting it, it's just baggage. And if I put a rock on a paper, the rock's function is whatever I told it to be. But nature doesn't talk. It only keeps what works."

  This captures the "earning" requirement, the distinction between history and current utility, and the special status of designed objects, without needing a philosophy degree to back it up.
