          1.  Introduction (validating the prompt).
          2.  Section on Cicero: Consensus vs. Contested (Crucial step).
          3.  Section on Madness/Reason (The "Stretch" warning).
          4.  Section on Wisdom (Accumulation vs. Ruin).
          5.  Section on *Auctoritas* and Context (The political reality).
          6.  Conclusion/Advice on the Essay.

  6.  **Refining the "Settled vs. Contested" Distinction:**
      *   *Settled:* Cicero wrote it in 44 BCE. He uses Cato as a mouthpiece. It relies on Greek sources. The four complaints are standard tropes.
      *   *Contested:* Is it "Stoic"? (It's eclectic). Is it sincere consolation or political propaganda? (Likely both). Does Cicero believe *auctoritas* works without power? (He argues it should, but his letters show he knew it didn't).
      *   *Warning:* Don't say "Scholars agree Cicero is lying." Say "Scholars debate the sincerity."

