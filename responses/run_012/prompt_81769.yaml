  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1: Foresight.* Does the pump argument collapse if the agent sees it coming? Side A says "No, the disposition is still bad." Side B says "Yes, if you see it, you stop it, so there's no problem."
      *   *Crux 2: Synchronic vs. Diachronic.* Is a cycle over time the same as a cycle in a moment? Side A says "Yes, coherence is coherence." Side B says "No, preferences change, that's allowed."
