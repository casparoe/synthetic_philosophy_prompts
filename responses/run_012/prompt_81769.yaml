          2.  Real disagreements (in each side's own voice).
          3.  Cruxes (Foresight assumption? Synchronic vs. Diachronic cycles? Selling the right to be pumped?).
          4.  Empirical/Theoretical tests for each crux (with predictions).
          5.  Terminology clarification (Is it just about the word "rational"?).
      *   **Constraint:** No citations, keep it tight, focus on the argument.

  2.  **Deconstruct the Specific Case:**
