  9.  **Final Review against constraints:**
      *   Numbered list? Yes.
      *   Real disagreements in own wording? Yes.
      *   Cruxes identified? Yes.
      *   Tests with predictions? Yes.
      *   Terminology check? Yes.
      *   No citations? Yes.
      *   Tight? I will keep paragraphs short.

  *(Self-Correction during drafting)*: Make sure the "Sell the Right" scenario is clearly defined in the agreed claims. It's crucial. The agent in May sells the "option to trade" to the broker. The broker then pumps the future selves. The May self pockets the premium. The future selves lose small amounts. Net gain for the "person" over time. This is the killer case for Side A. Side A needs to argue that the "person" is not just the sum of time-slices financially, but a normative unity.

