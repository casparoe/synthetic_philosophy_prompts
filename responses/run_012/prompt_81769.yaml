      *   *This Case:* Transitive at $t$, intransitive across $t$. This is a "Diachronic Money Pump."
      *   *The Twist:* The "Sell the Right" option. Usually, agents pay to *avoid* the pump. Here, the agent can *sell* the vulnerability. If she sells the right to be pumped for \$100, and loses \$50 in trades, she nets \$50. This challenges Side A's claim that pumpability is inherently defective. It looks like an asset.

  3.  **Drafting Section 1: Agreed Claims:**
