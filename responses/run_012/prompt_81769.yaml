      *   **Specific Case:** A friend with transitive preferences at every instant ($t_1, t_2, t_3$) but cyclic preferences over time (June: I > B > R; July: B > R > I; Aug: R > I > B). A broker exploits this. In May, she can buy a binding no-trade contract OR sell the broker the right to trade with her future selves for a lump sum > total loss.
