          *   *Critique:* **Substantive Error.** DDE and Doing/Allowing are distinct distinctions. One can intend death in letting die (e.g., withdrawing food to hasten death) or merely foresee death in killing (e.g., risky surgery to save life). Conflating them is a major philosophical mistake. Also, the claim that they "stand or fall together" is false; one can accept one and reject the other.

