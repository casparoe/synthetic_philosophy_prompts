answer: |-
  Here are nine questions designed to press the specific philosophical and physical commitments of your guest's position, following the sequence you outlined.

  **1. The "Brute Fact" Charge**
  You argue that the Presentist must posit a privileged foliation of spacetime that is undetectable by physics. You call this a "brute fact" that should be rejected. But classical substantivalists posit a spacetime manifold that is also undetectable in isolation—it's the stage, not the actor. Why is a privileged *time-slice* a worse metaphysical posit than a privileged *manifold*? Isn't this just a bias against temporal structure specifically?

  *   **Likely Answer:** She will likely distinguish between structure *required* for the physical theory (the manifold) versus structure *added on top* of it (the foliation) that yields no new predictions.
  *   **Follow-up:** "But if the foliation yields no new predictions, neither does the claim that only the present slice is *real* versus all slices being real. If the ontology is underdetermined by the physics in both cases, why does the 'added structure' objection apply to the Presentist's foliation but not to the Eternalist's extra dimensions of reality?"

  **2. The Indexical Horn**
  The second prong of your dilemma claims that if "now" is merely indexical, like "here," it cannot do the metaphysical work Presentism needs. But indexical facts *are* objective facts for the agent—"I am here" is true. Why isn't "I am now" sufficient to ground an objective, changing present without requiring a global, frame-independent slice?

  *   **Likely Answer:** She will likely argue that indexicality implies subjectivity or perspective-dependence, whereas Presentism requires an objective, monadic property of "presentness" that the universe possesses.
  *   **Follow-up:** "But if 'here' picks out a unique location for me without requiring the rest of space to be unreal, why can't 'now' pick out a unique time for me without requiring the future to be real? Are you assuming that for the present to be objective, it must be *global*? If so, isn't that begging the question against a local Presentism?"

  **3. Empirical Equivalence**
  Let's grant the dilemma for a moment. A Foliated Presentism and the Block Universe appear to be empirically equivalent; no experiment can distinguish them. You say Presentism is "in trouble." On what grounds? If the physics is silent, aren't you relying on a verificationist principle that says 'what physics cannot detect, does not exist'?

  *   **Likely Answer:** She will likely appeal to theoretical virtues like parsimony or Ockham's Razor—the Block view takes the physics at face value without adding hidden foliations.
  *   **Follow-up:** "Parsimony is an aesthetic virtue when data is silent. But if the Presentist is willing to pay the cost of a brute foliation to save the phenomenology of time, why is the Eternalist not equally guilty of paying a cost—namely, the elimination of passage—to save the geometry? Why is one trade-off rational and the other 'in trouble'?"

  **4. Simultaneity vs. Ontology**
  Critics often argue that Rietdijk-Putnam style arguments only establish the relativity of *simultaneity*, not the equal reality of *all times*. Does your reframing actually escape this? Or have you simply relabeled the inference from 'no unique slice' to 'all slices exist' without bridging the gap between geometry and ontology?

  *   **Likely Answer:** She will likely insist that the dilemma exhausts the logical options: if there's no unique slice, and indexicality fails, the only coherent option left is that all slices exist.
  *   **Follow-up:** "That assumes the options are exhaustive. What about 'Possibilism'—the view that the past and present exist, but the future does not? Relativity kills global simultaneity, but does it necessarily force us to ontologically commit to events that are spacelike separated and causally disconnected from us?"

  **5. The Andromeda Paradox**
  In the two-walkers scenario, you argue that for one observer, the Andromedan fleet has already launched, and for the other, it hasn't, yet the event is "fixed." But "fixed" relative to what? If there is no privileged frame, doesn't saying the event is "already real" just mean 'it exists in the block,' which is precisely the conclusion you're trying to prove?

  *   **Likely Answer:** She will likely lean on the invariant spacetime interval: the event is in the world-tube, regardless of the coordinate system used to slice it.
  *   **Follow-up:** "But the 'world-tube' is an Eternalist construct. If I am a Presentist, I say the event is only real when the light cone reaches me. You're describing the disagreement as a puzzle that only Eternalism solves. Isn't this just asserting that the Block picture is the only one that makes sense of the paradox, rather than demonstrating it?"

  **6. Causal Structure**
  Minkowski spacetime isn't structureless; it gives you invariant light cones and a distinguished "here-now." This looks like a resource for the Presentist to anchor reality to the past light cone rather than a simultaneity slice. Why does your argument rule out this 'light-cone Presentism' without also ruling out the causal structure that Special Relativity actually confirms?

  *   **Likely Answer:** She will likely argue that light-cone Presentism doesn't match our concept of "the present," which includes things simultaneous with us, not just things that have influenced us.
  *   **Follow-up:** "But if our folk concept of 'the present' conflicts with the invariant causal structure of the universe, why privilege the folk concept? If you're willing to revise our understanding of 'now' to fit the Block, why not revise it to fit the Light Cone? Is your objection metaphysical, or just a commitment to a specific pre-relativistic intuition?"

  **7. Felt Passage**
  You argue that the passage of time is a cognitive feature or an illusion compatible with the Block. But if you posit a primitive fact about consciousness or perception to explain why time *feels* like it passes, aren't you positing an "unphysical extra" exactly like the Presentist's privileged foliation? How is your primitive less ad hoc than theirs?

  *   **Likely Answer:** She will likely claim that cognitive science can explain the feeling of passage physically (e.g., memory accumulation, thermodynamic asymmetry) without needing metaphysical passage.
  *   **Follow-up:** "Those physical processes explain the *order* of experiences, not the *movement* of the present. If the Block is static, the 'feeling' of moving through it requires a dynamic subject. If the subject is also in the Block, what is doing the experiencing? Aren't you smuggling a 'moving spotlight' of consciousness into a static world?"

  **8. The "Default" Victory**
  You suggest Eternalism wins "more or less by default" once Presentism is cornered. But if Eternalism is just the negation of Presentism, does it have positive content of its own? Or is it a hollow victory that tells us what time *isn't* without explaining what it *is*?

  *   **Likely Answer:** She will likely say the positive content is provided by the spacetime manifold itself; time is just another dimension of the physical world.
  *   **Follow-up:** "If time is just a dimension, why does it have an arrow? The Block treats time as spatially symmetric, but physics is not. If you have to add entropy or boundary conditions to get the arrow back, haven't you just kicked the can of 'temporal specialness' down the road rather than solving it?"

  **9. Falsifiability and Future Physics**
  Finally, suppose future physics—perhaps in Quantum Gravity—reveals a fundamental preferred frame or Lorentz violation. Would that count as evidence against your position, or is your Eternalism insulated from empirical refutation by treating SR as a conceptual truth rather than a physical theory?

  *   **Likely Answer:** She will likely say that SR is extremely well-confirmed, so a preferred frame is unlikely, but if one were found, she would have to reconsider the metaphysical implications.
  *   **Follow-up:** "But if you *would* reconsider, then your argument isn't that SR *proves* Eternalism, but that SR *allows* it while Presentism fights the physics. That makes your view contingent on the current state of physics. If that's the case, why present it as a metaphysical necessity derived from a dilemma, rather than a provisional inference to the best explanation?"
