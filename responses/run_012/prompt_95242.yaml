answer: |-
  1. **The Explanatory Work of Valence**
  You claim hedonic valence is a genuine determinable property and not merely a label for a disjunction of heterogeneous experiences. But what precisely is this property *over and above* the disjunction of its determinates? If I know everything about the taste of coffee, the sound of music, and the feeling of sex, what additional fact about "valence" am I missing that isn't just my own classification of them?
  *Follow-up:* If you reply that it is a real determinable relation, how do we distinguish it from a gerrymandered category like "grue"? Not every determinable earns its keep; what test tells us when a determinable is a natural property rather than a philosophical posit?

  2. **The Colour Analogy: Unity or Diversity?**
  You lean on the analogy of hue: scarlet and teal share no shade, yet are both hues. But does this analogy actually support the unity of pleasure, or does it model how *little* members of a kind need to share? Hue is a spatial-visual property; is there a risk that "hedonic valence" is merely a functional category we impose on experiences that motivate approach, rather than a phenomenal property they share?
  *Follow-up:* If you insist it is phenomenal, why is the heterogeneity of pleasure so much more radical than the heterogeneity of colors, which all share a visual field and wavelength properties, whereas pleasures share no obvious sensory modality?

  3. **The Introspective Charge**
  Critics argue that introspection reports the taste of the coffee and the shape of the melody, but no separate "pleasantness." If pleasure is a determinable property of the experience, why is it not introspectively isolatable in the way that redness is isolatable within scarlet?
  *Follow-up:* If you argue that redness isn't isolatable from scarlet either, how do you explain mixed feelings where pleasure and pain seem to co-occur? Does the determinable model allow for two opposing valences in one conscious field, or must we posit a third, complex determinate?

  4. **The Attitudinalist Alternative**
  The attitudinalist locates the unity in the pro-attitude of "taking pleasure in" something, arguing this avoids the heterogeneity problem entirely. You claim this changes the subject from pleasure to liking. But if the phenomenology is heterogeneous, isn't the only thing actually doing the unifying work the subject's attitude toward the experience?
  *Follow-up:* How do you handle the masochist who reports feeling a pleasant sensation but dislikes it, or the agent who takes pleasure in something they judge to be bad? If the feeling and the attitude come apart, which one determines the intrinsic value?

  5. **Axiological Stakes**
  You argue hedonism requires a single intrinsic good, and thus a shared property. But if the unity of pleasure turns out to be mere family resemblance rather than a strict determinable, does your axiology collapse, or would you accept a pluralist theory of value where different pleasures are good in virtue of different properties?
  *Follow-up:* If you accept pluralism, doesn't that concede that the "heterogeneity problem" was never solved, only dissolved by abandoning the core hedonist claim of a single good *in virtue of* a single property?

  6. **Inverted Valence**
  We can conceive of an inverted spectrum for color. Is an inverted spectrum for hedonic valence conceivable—where what feels pleasant to you feels painful to me, despite identical functional roles and behavioral outputs?
  *Follow-up:* If you say no, is that because valence is essentially tied to motivation in a way color is not, and doesn't that push you back toward a functionalist or attitudinal definition rather than a purely phenomenal one?

  7. **Cross-Modal Comparability**
  If pleasures are heterogeneous determinates, how do we compare them on a single scale of intensity? Is the intensity of a musical pleasure commensurable with the intensity of a gustatory pleasure, or are we comparing apples and oranges?
  *Follow-up:* If they are incommensurable, how can hedonism guide action when faced with a choice between a high-intensity gustatory pleasure and a low-intensity intellectual one without invoking a higher-order metric that isn't itself hedonic?

  8. **The Neutral Baseline**
  If pleasure is a determinable, is there a zero-point or neutral state that lacks the property entirely, or is the absence of pleasure simply the absence of the determinates?
  *Follow-up:* If there is a neutral state, how do we introspect it? Is it a distinct phenomenological baseline, or merely the absence of stimulation, and does this distinction matter for the asymmetry between pleasure and pain?

  9. **Motivation and Anhedonia**
  Hedonism often links pleasure to motivation. But in cases of anhedonia or depression, subjects report experiences that should be pleasant but lack the "pull." Is the hedonic valence absent in these cases, or is the motivational mechanism broken?
  *Follow-up:* If the valence is present but motivation is absent, doesn't that sever the link between valence as a phenomenal property and valence as a guide to the good, undermining its axiological privilege?

  10. **Causal Powers**
  You reject the idea that valence is merely a label. Labels don't cause things; properties do. What causal power does hedonic valence have *independently* of the specific qualitative character of the determinate pleasure?
  *Follow-up:* If the causal power is exhausted by the specific determinate (e.g., the taste of coffee causes the desire), is the determinable valence doing any explanatory work, or is it merely a redundant description?

  11. **Evolutionary Function**
  Why did this determinable evolve? If the unity of pleasure is grounded in its function to guide behavior toward fitness, isn't the unity functional rather than phenomenal?
  *Follow-up:* If the unity is functional, can we imagine a creature that has the phenomenal determinates without the functional unity, and would we still call their experiences "pleasures"?

  12. **Falsification Conditions**
  Finally, what would count against your view? What specific observation, case, or argument would make you abandon the determinable model and concede that pleasures share nothing at all?
  *Follow-up:* (None, this is the closing question).
