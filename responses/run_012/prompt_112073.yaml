      *   *Section 2: The Assumptions Checklist.* Go through A, B, C, D above.
          *   *Metric Gaming:* Strict presupposition of non-manipulability. Rivals (voting) also suffer this (lobbying), but markets incentivize it directly.
          *   *Reflexivity:* Strict presupposition. This is the "decision market" paradox. If I bet Policy A wins, I might sabotage Policy B to make A look better.
          *   *Scalar Welfare:* Strict. Math requires comparability.
          *   *Implementation:* Strict.
      *   *Section 3: Rival Arrangements.*
          *   *Ordinary Voting:* Doesn't need scalar welfare (can vote on bundles). Doesn't need market non-manipulation (but needs voter non-manipulation).
          *   *Markets on Metrics:* Plutocracy. Strictly presupposes wealth = moral authority.
      *   *Section 4: Underdetermination & Inconsistency.*
          *   The "Vote on Values" part is underdetermined. Who votes? How often?
          *   Inconsistency: If values depend on facts (e.g., "I want happiness," but markets know Policy X causes misery), the split breaks.
          *   The "Oracle Problem": Who defines the metric realization?

  6.  **Refining the Argument (Self-Correction/Nuance):**

