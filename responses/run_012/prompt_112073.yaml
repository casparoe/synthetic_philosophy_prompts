      3.  Comparative Analysis (Rivals).
      4.  Inconsistencies/Underdetermination.

      *Let's dig deeper into the "Reflexivity" point.* In a standard prediction market, the outcome is independent of the bet. In futarchy, the bet *causes* the outcome condition. This creates a "performative" loop. Strictly speaking, futarchy presupposes this loop stabilizes rather than explodes.

      *Let's dig into "Scalar Welfare."* Strictly presupposed. You cannot maximize a vector without a weighting function. The vote on the metric *is* the weighting function.

      *Let's dig into "Implementation."* Strictly presupposed. If the policy is "Cut taxes" but the bureaucracy doesn't do it, the market payout is based on reality, not the policy text. The market bets on *outcome*, not *legislation*. This is a subtle point. Futarchy bets on *results*. So implementation fidelity is actually baked into the payout, but it breaks the link between "Policy X" and "Result".

