answer: |-
  This is a sharp dissection. You have identified the precise friction points where mechanism design crashes into political philosophy. Futarchy (specifically Robin Hanson's formulation) is often sold as "vote on values, bet on beliefs," but that slogan hides a load-bearing architectural steel that is rarely inspected.

  Here is the breakdown of what the mechanism strictly presupposes, what is merely contingent, and where the logic is underdetermined or inconsistent, compared against rival arrangements.

  ### 1. The Fact/Value Split
  **Status:** *Pragmatic Necessity, Ontologically Underdetermined.*

  Futarchy does not strictly presuppose that facts and values are *metaphysically* distinct (i.e., that Hume was right). It presupposes they are **operationally separable**.

  *   **Strict Presupposition:** You must be able to define a settlement condition for the metric that is verifiable by an oracle (or court) *ex post*, independent of the traders' opinions. You can verify "GDP was $X" or "Token Price was $Y." You cannot verify "Justice was served."
  *   **Rival Satisfiability:**
      *   *Ordinary Voting:* Does not need this split. Voters can bundle facts and values ("I vote for Candidate A because they are honest and value liberty").
      *   *Markets on Metrics:* A system where markets decide the metric (e.g., "bet on what the national mood will be") collapses values into revealed preference of the wealthy. It satisfies the contract limitation but fails the normative legitimacy test.
  *   **Inconsistency:** The split assumes values are static while facts are discovered. In reality, learning new facts often changes values (e.g., learning a policy causes suffering may change whether you value the policy). Futarchy freezes the value function at the time of the vote, creating a lag where the "values" being optimized are historically outdated.

  ### 2. The Four Critical Assumptions
  You listed four specific hidden requirements. Here is their classification:

  #### A. Metric Gaming (Goodhart's Law)
  *The metric cannot be cheaper to manipulate than to improve.*
  *   **Classification:** **Strict Presupposition.**
  *   **Why:** If traders can profit by manipulating the metric (e.g., shorting the token and then launching an attack that lowers the price), the market price reflects *manipulation potential*, not *welfare forecast*. The mechanism ceases to aggregate information and starts aggregating attack vectors.
  *   **Rival Satisfiability:**
      *   *Ordinary Voting:* Also vulnerable (lobbying, gerrymandering), but the cost structure is different. Voting requires coalition building; markets allow singleton manipulation if capital is concentrated.
      *   *Markets on Metrics:* Worse. If markets pick the metric, they will pick the one most easily manipulated by the largest wallet.

  #### B. Causality vs. Reflexivity
  *The conditional price is a forecast, not a cause.*
  *   **Classification:** **Strict Presupposition (and the strongest point of failure).**
  *   **Why:** This is the "Decision Market" paradox (Othman & Sandholm). In a standard prediction market, the outcome is independent of the prediction. In futarchy, the prediction *selects the policy*, which *causes the outcome*.
      *   If I know Policy A will be chosen because the market says so, I can bet against Policy B's success to ensure Policy A is chosen, even if I believe Policy B is better.
      *   The market price becomes **performative**. For futarchy to work, it presupposes that the market's influence on the policy selection does not feedback into the metric in a way that distorts the conditional probability $P(Welfare | Policy)$.
  *   **Rival Satisfiability:**
      *   *Ordinary Voting:* Satisfies this easily. Voting determines policy, but the vote count itself doesn't mechanically alter the economic outcome (mostly).
      *   *Markets on Metrics:* Irrelevant, as there is no policy conditionality.

  #### C. Scalar Welfare
  *Welfare is one number comparable across people and policies.*
  *   **Classification:** **Strict Presupposition.**
  *   **Why:** You cannot maximize a vector. To compare "Policy A" vs. "Policy B," the metric must be a single scalar $W$. This presupposes that all trade-offs (liberty vs. security, rich vs. poor) have already been resolved into a single exchange rate *before* the market opens.
  *   **Rival Satisfiability:**
      *   *Ordinary Voting:* Does **not** need this. Legislatures pass bundles of laws. They can optimize for multiple conflicting values simultaneously through compromise, logrolling, and bicameralism.
      *   *Markets on Metrics:* Needs this equally. Any optimization function requires a scalar objective.

  #### D. Implementation Fidelity
  *The winning policy gets implemented as written.*
  *   **Classification:** **Strict Presupposition.**
  *   **Why:** Futarchy markets bet on *outcomes*, not *legislation*. If the market selects "Policy X" (e.g., "Cut taxes by 10%"), but the bureaucracy implements "Policy X-lite" (e.g., "Cut taxes by 2% with new fees"), the market payout is based on the actual welfare resulting from X-lite.
      *   If traders know implementation will be watered down, they will price that in.
      *   However, if the *mechanism* relies on the policy being the causal lever, and the lever is broken, the feedback loop is severed. The system presupposes a "clean room" execution environment.
  *   **Rival Satisfiability:**
      *   *Ordinary Voting:* Equally vulnerable (bureaucratic drift), but voting systems have oversight mechanisms (hearings, elections) specifically designed to police implementation. Futarchy replaces oversight with settlement, which is different.

  ### 3. Underdetermination and Inconsistencies

  There are three areas where the theory is silent or contradictory:

  **1. The Oracle Problem (Who settles the metric?)**
  *   **Underdetermined:** Futarchy says "vote on the metric," but it doesn't specify how the metric's *realization* is adjudicated.
  *   **Inconsistency:** If you use a decentralized oracle (like Chainlink), you introduce a new attack surface (bribing oracle nodes). If you use a court, you reintroduce human judgment, which reintroduces the "values" problem into the "facts" side. You cannot fully escape subjective interpretation of the metric.

  **2. The Time Horizon Mismatch**
  *   **Underdetermined:** Markets are notoriously short-term. Welfare is often long-term.
  *   **Inconsistency:** If the metric is "GDP this year," the market will select policies that pump GDP now and crash it in five years. If the metric is "GDP in 10 years," the market lacks liquidity and verification speed. Futarchy presupposes a metric that is both *immediately verifiable* and *representative of long-term good*. These are often mutually exclusive.

  **3. The "Vote on Values" Legitimacy**
  *   **Underdetermined:** Who votes on the metric? One person, one vote? Token-weighted?
  *   **Inconsistency:**
      *   If it's **one-person-one-vote**, you have democracy setting the goals and markets setting the means. This is the standard Hanson model.
      *   If it's **token-weighted**, you have plutocracy setting the goals *and* markets (plutocracy) setting the means.
      *   The inconsistency arises if the goal-vote is democratic but the means-bet is plutocratic. The wealthy can effectively veto democratic values by refusing to provide liquidity on policies the poor want, or by manipulating the conditional prices to make popular policies look "ineffective."

  ### Summary Table

  | Assumption | Status | Can Ordinary Voting do it? | Can Market-Picked Metrics do it? |
  | :--- | :--- | :--- | :--- |
  | **Fact/Value Separability** | Pragmatic Necessity | No (Bundles them) | No (Collapses them) |
  | **Non-Manipulable Metric** | Strict Presupposition | Yes (Harder to game) | No (Incentivizes gaming) |
  | **Non-Performative Prediction** | Strict Presupposition | Yes (Votes aren't forecasts) | N/A (No conditionality) |
  | **Scalar Welfare** | Strict Presupposition | No (Optimizes vectors) | Yes (Requires scalar) |
  | **Implementation Fidelity** | Strict Presupposition | Yes (Oversight mechanisms) | No (Relies on outcome only) |

  ### The Verdict

  Futarchy strictly presupposes a **world where the map does not change the territory.** It requires that measuring the welfare (the map) does not alter the welfare (the territory), and that predicting the policy outcome does not alter the policy outcome.

  In social systems, this is false. The prediction *is* a political act.

  The only thing Futarchy satisfies better than ordinary voting is **epistemic aggregation on empirical claims**. It is superior at answering "Will this raise revenue?" It is not superior at "Should we raise revenue?" or "What counts as welfare?"

  The inconsistency lies in believing you can isolate the empirical from the normative. By forcing a scalar metric, you have already made a massive normative claim (that $X$ matters more than $Y$). By handing the execution to traders, you have already made a massive empirical claim (that traders know better than bureaucrats). Futarchy is not a way to avoid politics; it is a way to hard-code a specific political settlement (technocratic utilitarianism) and then claim the subsequent decisions are "math, not politics."
