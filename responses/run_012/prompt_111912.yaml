      *   *Nuance:* The "Why Past?" question is the "Asymmetry of Time" vs. "Arrow of Time." PH explains the arrow given the asymmetry. It doesn't explain the asymmetry itself.
      *   *Nuance:* Zermelo's recurrence time is exponentially large. For all practical purposes (FAPP), it's irrelevant, but ontologically it matters.
      *   *Crucial Point:* The "Typicality" argument. PH says the *current* state is typical *given the past*. Loschmidt says the *current* state is atypical *given the future*. PH breaks the symmetry by fiat.

