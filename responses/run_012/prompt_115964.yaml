answer: |-
  **1. Recommendation and Closest Analog**

  **Recommendation:** The Board should **reject the proposed race-conscious adjustment** and **conditionally approve the unadjusted (base) version of Tool G.**

  Approval of the base tool must be conditioned on two requirements: (1) a validated protocol for the judicial "human-in-the-loop" that explicitly instructs judges on the tool's limitations regarding the "arrest" target variable, and (2) an annual intersectional audit specifically tracking outcomes for Black women, despite our current single-axis charter.

  **Closest Analog:** This decision extends the reasoning of **Case 1 (Pretrial Risk Score)** and **Case 3 (Hiring Model)**, moderated by **Case 6 (Decision-Support Tool)**.
  *   Like Case 1, this is a pretrial liberty context, establishing a high bar for False Positive Rates (FPR) regarding detention. The base tool meets this bar (equal FPR), whereas the rejected tool in Case 1 did not.
  *   Like Case 3, we decline to mandate a race-conscious remedy when a race-neutral alternative satisfies our core error-rate constraints. The vendor has not demonstrated that the race-conscious adjustment is "narrowly tailored" given that the base tool already achieves FPR parity.
  *   Like Case 6, we rely on the presence of a judicial decision-maker to mitigate the risks associated with the tool's False Negative Rate (FNR) disparity and calibration issues that would arise from the adjustment.

  **2. Candidate Rules and Predictions**

  Three candidate rules fit our past verdicts equally well but diverge on Tool G:

  *   **Rule A (Error Parity Absolutism):** The primary obligation is to equalize error rates (FPR and FNR) across protected groups. Race-blindness and calibration are secondary to achieving statistical parity.
      *   *Prediction for Tool G:* **Approve the Adjustment.** The adjustment equalizes FPR and FNR, satisfying the core mandate, even at the cost of calibration and race-blindness.
  *   **Rule B (Constrained Race-Blindness):** Tools must be race-blind in features and calibrated within race. Error parity is a constraint, specifically a cap on FPR for protected groups, but FNR disparity is permissible if human oversight exists.
      *   *Prediction for Tool G:* **Approve the Base Tool; Reject the Adjustment.** The base tool is race-blind, calibrated, and meets the FPR cap. The adjustment violates the race-blindness and calibration constraints without sufficient necessity.
  *   **Rule C (Validity Primacy):** Fairness metrics are secondary to the validity of the target variable. If the target variable (arrest) encodes systemic bias, the tool is unfit for deployment regardless of statistical parity.
      *   *Prediction for Tool G:* **Reject Both Versions.** Neither version corrects the fundamental label bias of predicting "arrest" rather than "offending."

  **3. The Working Principle and Normative Adoption**

  **Best Guess at the Working Rule:** Our precedents are best explained by **Rule B (Constrained Race-Blindness)**.
  *   *Reasons:* In Case 3, we rejected a race-conscious model that achieved near-perfect parity, establishing that parity alone does not justify race-consciousness. In Case 2, we approved a tool that was *not* calibrated because error rates were equal, suggesting calibration is flexible *unless* it conflicts with race-blindness (Case 1 & 3). In Case 6, we allowed unequal error rates when human oversight was present, indicating that FNR disparity is tolerable under mitigation. Case 1 is the outlier that sets the "FPR Cap" for pretrial contexts, which Tool G (Base) satisfies.

  **Principle Adopted if We Approve the Adjustment:** We would be adopting the principle that **Statistical Parity is the Supreme Good**, overriding commitments to race-blindness and calibration. This would effectively overrule Case 3's hesitation regarding race-conscious remedies and signal that our preference for race-blind features (Case 3, 4) was merely pragmatic, not principled.

  **Principle Adopted if We Reject the Adjustment (Recommended):** We reaffirm that **Procedural Fairness (Race-Blindness + Calibration) is the Default**, and Error Parity is a **Constraint** (specifically on FPR in liberty contexts) rather than an optimization target. We maintain that race-conscious post-processing requires a showing of strict necessity (Case 3), which is not met here because the base tool already satisfies the FPR constraint established in Case 1.

  **4. The Discriminating Future Case**

  To distinguish whether we truly follow Rule B or are merely avoiding race-consciousness pragmatically, the Board should seek a case with the following fact pattern:

  **The Case:** A pretrial risk tool where base-rate differences are so extreme that **no race-blind model can achieve Equal FPR** without rendering the tool useless (e.g., detaining everyone or no one). The only way to achieve the Case 1 FPR cap is via race-conscious post-processing.

  **The Verdict:**
  *   If we **approve the race-conscious fix**, we are actually following **Rule A (Error Parity Absolutism)** and our rejection in Case 3 was based on the availability of alternatives, not a principled ban.
  *   If we **reject the tool entirely**, we are following **Rule B (Constrained Race-Blindness)** and hold that race-blindness is a hard constraint that trumps error parity when the two are mathematically incompatible.

  **5. Impossibility Results and Tensions**

  **The Impossibility Trinity:** When base rates differ between groups (as they do here, evidenced by the FNR disparity), it is mathematically impossible to simultaneously satisfy:
  1.  **Calibration within groups** (a score means the same risk for all).
  2.  **Error Rate Parity** (Equal FPR and Equal FNR).
  3.  **Race-Blindness** (Features and processing do not use race).

  Tool G (Base) chooses (1) and (3), sacrificing (2) on FNR.
  Tool G (Adjustment) chooses (2), sacrificing (1) and (3).

  **Genuine Tensions:**
  *   **Calibration vs. Parity:** This is not superficial. Case 2 allowed calibration failure for parity, but Case 1 valued calibration. We are in tension between treating scores as probabilities (Case 1) vs. ranking scores (Case 2).
  *   **Target Variable Validity:** The tool predicts *arrest*, not *offending*. If policing is biased, "Calibration within race" merely means the tool accurately predicts biased policing. This creates a tension between **Predictive Accuracy** (it predicts arrest well) and **Construct Validity** (arrest $\neq$ risk). Our charter requires considering accuracy, but does not define *accuracy relative to what ground truth*.
  *   **Infra-marginality:** FPR and FNR are averages. They do not reveal if the errors are concentrated among low-risk Black defendants versus high-risk Black defendants. Our precedents (Case 5) reject individual fairness, but relying solely on group averages hides distributional harms.

  **6. Settled vs. Contested**

  **Settled (Within This Board):**
  *   **Group Fairness > Individual Fairness:** (Case 5). We do not accept "similar individuals treated similarly" as a defense against group disparities.
  *   **Human-in-the-Loop Mitigation:** (Case 6). We accept that human oversight lowers the stringency of algorithmic fairness requirements.
  *   **Single-Axis Compliance:** (Case 7). We currently do not require intersectional parity (e.g., Black women specifically), though we note it.
  *   **FPR Cap in Pretrial:** (Case 1). We will not approve pretrial tools that increase False Positive Rates for Black defendants relative to white defendants.

  **Contested (In the Field and Law):**
  *   **Race-Conscious Remedies:** Our hesitation in Case 3 reflects a specific legalistic caution, not a consensus. Many fairness scholars argue race-blindness perpetuates bias when base rates differ. Our recommendation relies on the contested view that race-blindness is preferable to race-conscious parity fixes absent strict scrutiny.
  *   **Arrest vs. Offending:** Using "arrest" as a proxy for "risk" is highly contested. Criminologists and civil rights advocates argue this encodes policing bias into the ground truth. Our recommendation treats this as a validity audit condition rather than a fatal flaw, which is a pragmatic choice, not a scientific consensus.
  *   **FPR vs. FNR:** We prioritize FPR (unjust detention) based on Case 1. However, public safety advocates argue FNR (releasing high-risk individuals) is equally critical. Our tolerance for the Base Tool's higher FNR for white defendants (and potentially different FNR for Black defendants) rests on the contested normative view that liberty interests outweigh safety risks in pretrial contexts.

  **Conclusion:** By approving the Base Tool and rejecting the Adjustment, we remain consistent with our preference for race-blind features (Case 3) and our specific pretrial FPR constraint (Case 1), while acknowledging the limitations of our single-axis framework (Case 7) through audit conditions. We avoid adopting the contested principle that statistical parity justifies race-conscious processing when race-neutral parity on the most critical metric (FPR) is already achieved.
