  9.  **Final Polish:** Check tone. Ensure it sounds like advice for someone who already knows the theory but wants the *edge cases* and *risks*. (The prompt asks for "places where it tells me to do something other than what ordinary self-help wisdom would.")

      *   *Key Insight:* Ordinary self-help is often CDT (Causal Decision Theory) disguised. It says "Do what makes you happy now (sustainably)." UDT says "Do what the version of you who didn't know the future would have wished you did."
      *   *Specific Divergence:* Self-help says "Forgive yourself when you slip." UDT says "Slipping breaks the policy; analyze if the policy needs changing, but don't just excuse the slip."

      *(Self-Correction on "Sucker" risk)*: If I adopt a policy of "Always keep promises," and my friend knows this, they might over-burden me. UDT actually suggests a policy of "Keep promises *unless* the cost exceeds X," but X must be set *ex-ante*. If I set X too high, I'm a sucker. I need to highlight the *setting of the policy* as the critical step, not just blind adherence.

      *Wait, one nuance:* UDT isn't just "blind adherence." It's "Choose the best policy." If the best policy is "Defect if the cost is > $1000," then you defect. The divergence from CDT is that CDT re-evaluates the $1000 *at the moment*, potentially influenced by sunk costs or temporary weakness. UDT locks the threshold.
      *Actually, the prompt implies the "stubborn" version:* "carry it out even once you find out you're somewhere a spot re-optimizer would sell out." I should stick to that interpretation for the sake of the argument, but warn about the policy selection phase.

      *Let's finalize the ranking:*
      1.  **The "Invisible Promise" (Integrity when unobserved).** High impact, low sucker risk.
      2.  **Conflict Escalation (Enforcing boundaries).** High impact, high sucker risk if others aren't rational.
      3.  **Resource Allocation (Money/Time budgets).** Medium impact, independent.
      4.  **Emotional Policy (Anger/Forgiveness).** Medium impact, dependent on social dynamics.

      *Wait, I need to make sure I don't sound like I'm advocating for rigidity.* UDT is about *optimal* policies. But the prompt asks for the fallout of *running* it updatelessly. So the focus is on the *execution* phase.

