  3.  **Analyze the "New Construction" (Inquiry Policies):**
      *   *Setup:* Prior + Effort Budget -> Inquiry Policy (effort distribution + stopping rule) -> Posterior.
      *   *Utility:* Expected accuracy of posterior minus effort cost (or just expected accuracy subject to constraints).
      *   *Problem:* Standard EUT says value of information is non-negative. With scarce effort, gathering *everything* isn't possible. We need to prioritize questions.
      *   *Goal:* Find an analogue of *propriety* for inquiry policies. A constraint ensuring a policy doesn't expect to make things worse and allows ranking competing inquiries.
      *   *Significance:* If this fails, EUT hits a boundary at static belief. If it succeeds, it extends EUT to dynamic resource allocation.

  4.  **Drafting the Research Items (Brainstorming & Filtering):**

      *   *Item A: The Foundation of Propriety.* Is propriety the *only* constraint? Are there proper rules that are intuitively bad? (Upstream).
      *   *Item B: The "Change the Subject" Objection.* Why care about accuracy? (Meta-philosophical, potentially intractable in 3 years without empirical/psychological bridge).
      *   *Item C: Imprecise Credences.* Can EUT handle sets of probabilities? (Formal difficulty, high impact if solved).
      *   *Item D: Norms of Conditionalization.* Deriving updating rules from accuracy. (Mostly done, but refinements possible).
      *   *Item E: Non-Credal Attitudes.* Belief/Disbelief (binary) vs. Credence. (Extension, downstream of core accuracy metrics).
      *   *Item F: The Inquiry Policy Construction (The User's Prompt).* Extending EUT to effort allocation. (High risk, high reward, directly addresses the "static vs. dynamic" gap).
      *   *Item G: Group Credences.* Aggregating individual accuracies. (Complex, maybe downstream).

  5.  **Ranking & Reasoning (Applying Criteria):**
      *   *Criteria:* Upstreamness (foundational), Tractability (can 3-5 people do it in 3 years without library?), Impact (if solved, what changes?), Neglect (is it overlooked?).
      *   *Refusals:* "Change the Subject" (too meta/defensive), Group Credences (too downstream/complex for core focus), Binary Belief norms (derivative of credal norms).

      *   *Top Tier:*
          1.  **Inquiry Policies (The New Construction).** Why? It tests the *limits* of the program. If EUT can't handle resource-bounded inquiry, it's incomplete. It relies on the core machinery (scoring rules) but applies it dynamically.
          2.  **The Uniqueness of Propriety.** Why? If propriety isn't the *right* constraint, the whole edifice wobbles. Need to know if other constraints (e.g., continuity, differentiability) are needed to rule out pathological proper rules.
          3.  **Imprecise Credences.** Why? Real agents aren't precise. If EUT can't accommodate this, its applicability is limited.

      *   *Middle Tier:* Conditionalization refinements (mostly settled), Non-credal attitudes (depends on credal account).

      *   *Refused:* "Change the Subject" (Philosophical stalemate), Group Credences (Aggregation problems are distinct from accuracy metrics).

  6.  **Developing the "Inquiry Policy" Item (Crucial Step):**
      *   *The Problem:* Standard Value of Information (VoI) says learn everything. But effort is costly/limited.
      *   *The Task:* Define a "Proper Inquiry Rule."
      *   *Hypothesis:* A policy is proper if, given a prior, it maximizes expected posterior accuracy subject to the effort budget, and no alternative policy available within the budget yields higher expected accuracy.
      *   *Risk:* It might collapse into "spend effort on the easiest questions" or "spend effort on the most impactful questions," which might not feel "epistemic."
