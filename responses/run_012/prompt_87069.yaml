answer: |-
  ### Research Agenda: Accuracy-First Epistemology (Three-Year Program)

  #### I. Ranking Criteria and Trade-offs

  To rank these items, I apply four criteria, weighted by the constraints of the foundation (small team, no external resources, formal/conceptual focus):

  1.  **Upstream Dependency:** Does settling this question determine the validity or shape of other questions? (Highest Weight).
  2.  **Formal Tractability:** Can this be advanced using proofs and derivations from first principles without empirical data or extensive literature review?
  3.  **Programmatic Impact:** If solved, does it expand the scope of the program or merely refine existing results?
  4.  **Risk of Collapse:** Is there a significant chance that investigation reveals a fatal flaw in the core machinery?

  **Trade-off:** High upstream items often carry high risk of collapse. High impact items (expanding scope) often require new formalisms that may prove intractable in three years. I prioritize **Upstream Dependency** and **Programmatic Impact**. A result that limits the scope of the program is more valuable than a result that extends a flawed program.

  ---

  #### II. The Ranked Research Agenda

  **1. The Existence and Characterization of "Proper Inquiry Policies" (The Construction)**
  *   **Status:** **Priority 1 (Funded)**
  *   **Reasoning:** This is the most upstream question regarding the *dynamic* applicability of the program. The core claim of accuracy-first epistemology is that accuracy is the fundamental epistemic good. If the machinery of scoring rules cannot generate norms for *seeking* truth (inquiry) under resource constraints, the program is relegated to a static theory of belief evaluation. It cannot guide action.
  *   **Upstream/Downstream:** This is upstream of all norms regarding evidence gathering and updating. If no coherent analogue of propriety exists for inquiry policies, then accuracy cannot be the sole guide for rational inquiry, forcing a pluralist amendment to the core theory.
  *   **Tractability:** High. It requires defining a function mapping effort budgets to partitions and proving whether a "self-endorsing" policy exists. The mathematics involves expected utility calculations over partitions, which is within the existing toolkit.
  *   **Impact:** Maximum. A positive result extends the program to dynamic epistemology. A negative result (impossibility theorem) defines the boundary of the program, saving future effort from chasing a dead end.
  *   **Successful Outcome:** A theorem characterizing the class of effort-allocation functions that satisfy "Inquiry Propriety" (i.e., the policy expects to yield higher accuracy than any alternative policy within the budget), OR an impossibility proof showing that no such function exists without appealing to non-epistemic values.
  *   **Feasibility:** 3 years is sufficient for a definitive formal result (existence or impossibility).

  **2. The Uniqueness and Stability of Propriety in Static Scoring**
  *   **Status:** **Priority 2 (Funded)**
  *   **Reasoning:** Propriety (the requirement that a credence function expects itself to score best) is the engine of the program. However, there are infinitely many proper scoring rules. Some are pathological (e.g., discontinuous, or insensitive to small changes in credence). We need to know if propriety *alone* is sufficient, or if additional constraints (continuity, differentiability, symmetry) are required to derive standard norms like Probabilism.
  *   **Upstream/Downstream:** Upstream of all static norms. If propriety is too weak, the dominance arguments for Probabilism fail. If it is too strong, it rules out plausible doxastic states.
  *   **Tractability:** High. This is pure analysis of functions on the probability simplex.
  *   **Impact:** High. It stabilizes the foundation. If we find that only a very narrow class of proper rules work, the theory becomes more rigid. If a broad class works, the theory is robust.
  *   **Successful Outcome:** A classification theorem identifying the necessary and sufficient conditions on a scoring rule such that it supports a dominance argument for Probabilism without relying on ad-hoc assumptions.
  *   **Feasibility:** 3 years is ample for this analysis.

  **3. Accuracy Norms for Imprecise Credences**
  *   **Status:** **Priority 3 (Funded)**
  *   **Reasoning:** The standard program assumes precise real-valued credences. Many philosophers argue rational states are often indeterminate (sets of probabilities). The program must determine if accuracy can be defined over sets.
  *   **Upstream/Downstream:** Downstream of Propriety (Item 2), but upstream of applicability. If the program cannot handle imprecision, its claim to describe *rationality* is weakened, as it describes an idealized agent that may not exist.
  *   **Tractability:** Medium. Defining "distance from truth" for a set of functions is formally tricky. There are multiple ways to generalize scoring rules to sets (e.g., worst-case, average).
  *   **Impact:** Medium-High. It expands the demographic of agents the theory can describe.
  *   **Successful Outcome:** A generalized scoring rule definition for sets of credences that preserves a dominance argument for a corresponding norm (e.g., "coherence for sets").
  *   **Feasibility:** 3 years is tight but possible if scoped to existence proofs rather than a full system.

  **4. The Derivation of Conditionalization from Accuracy**
  *   **Status:** **Priority 4 (Defunded/Low Priority)**
  *   **Reasoning:** This asks whether updating by conditionalization maximizes expected accuracy.
  *   **Reason for Low Rank:** This is largely downstream of Items 1 and 2. If we don't know how to score inquiry (Item 1) or if propriety is unstable (Item 2), deriving conditionalization is premature. Furthermore, significant work has already established that conditionalization maximizes expected accuracy under proper rules. The marginal gain on a three-year timeline is low compared to the open frontiers of Inquiry and Imprecision.
  *   **Successful Outcome:** A refined proof that handles edge cases (e.g., zero-probability evidence) without new axioms.
  *   **Feasibility:** High, but low value-added.

  ---

  #### III. Refused Items

  I explicitly refuse to fund the following, based on the "Formal Tractability" and "Upstream Dependency" criteria:

  **1. The "Change the Subject" Objection (Accuracy vs. Other Goods)**
  *   **Description:** The objection that accuracy-first arguments only show what to believe *if* accuracy is the sole good, and that rationality might involve other goods (e.g., understanding, simplicity).
  *   **Reason for Refusal:** This is a meta-philosophical dialectic, not a formal problem. Without internet or library access, the researchers cannot engage with the breadth of the existing dialectic. More importantly, this cannot be settled by proof or counterexample. It requires argumentative persuasion or empirical psychology, both outside the foundation's mandate. Funding this would result in essays, not theorems.
  *   **Condition for Funding:** Only if Item 1 (Inquiry) yields an impossibility result, suggesting accuracy *cannot* be the sole guide. Then, this question becomes formally necessitated.

  **2. Group Credences and Aggregation**
  *   **Description:** Extending accuracy norms to collective belief states formed by aggregating individual credences.
  *   **Reason for Refusal:** This is too downstream. Aggregation introduces social choice theoretic problems (e.g., Arrow-style impossibilities) that are distinct from the core accuracy machinery. Solving this requires solving the individual accuracy norms first. It dilutes the focus of a small team.
  *   **Condition for Funding:** Only after Items 1, 2, and 3 are conclusively settled.

  **3. Binary Belief Norms (All-or-Nothing Belief)**
  *   **Description:** Deriving norms for full belief from accuracy scores.
  *   **Reason for Refusal:** This is derivative. Once we have a robust account of credal accuracy (Item 2) and Inquiry (Item 1), binary belief can be treated as a decision-theoretic threshold problem. It does not require a separate research stream in the first three years.

  ---

  #### IV. Deep Dive: The Inquiry Construction (Item 1)

  **Placement Defense:** I have placed this at **Priority 1**.
  The prompt notes a specific consequence of the standard view: under proper scoring, expected accuracy of the posterior is never below the prior, so gathering everything is optimal. This creates a tension when effort is scarce.
  *   **Why it is Upstream:** The core claim of the program is that epistemic rationality *is* the maximization of expected accuracy. If this maximization principle cannot generate a ranking for *how to spend effort to find truth*, then the principle is incomplete. It might describe a "state" well, but it fails to describe a "life." A theory of rationality that cannot guide inquiry is arguably not a theory of rationality at all.
  *   **The Value-of-Information Claim:** The standard claim (VoI is non-negative) is the pivot point. If we introduce an effort cost function $C(e)$, the utility becomes $ExpectedAccuracy(Posterior) - C(e)$. The problem is that $ExpectedAccuracy$ is calculated using the *prior*. The agent must decide, *before* inquiring, which partition is worth the effort.
  *   **The Research Task:** We need to determine if there is a constraint on the scoring rule or the effort cost function that ensures the agent's prior endorses the inquiry policy.
      *   *Hypothesis:* A "Proper Inquiry Rule" exists if and only if the scoring rule is strictly proper AND the cost function is linear (or satisfies specific convexity conditions).
      *   *Risk:* It may turn out that accuracy *must* be traded off against effort in a way that accuracy itself cannot justify. This would imply accuracy is not the *sole* good, but one good weighed against "cost." This would be a major philosophical result (limiting the program) derived formally.
  *   **Uncertainty Flag:** I am unsure whether the "effort budget" should be modeled as a constraint on the *partition* (how fine-grained a question you can ask) or on the *reliability* of the answer (probability of getting the true cell). I recommend the team formalize both and check if the existence of a Proper Inquiry Policy is sensitive to this modeling choice.

  ---

  #### V. Final Selection: The Two Items to Fund First

  If only two items can be funded, I select:

  1.  **The Existence of Proper Inquiry Policies (Item 1)**
  2.  **The Uniqueness and Stability of Propriety (Item 2)**

  **Reasoning:**
  These two constitute the **Core Stability** and the **Frontier Expansion** of the program.
  *   **Item 2** ensures the foundation is solid. If propriety is ill-defined or too permissive, the rest of the program is built on sand. We must know exactly what constraints are needed on the scoring rules.
  *   **Item 1** tests whether the program can walk. If accuracy-first epistemology cannot handle resource-bounded inquiry, it is a static taxonomy, not a guide to rational life.
  *   **Synergy:** The mathematical tools required for both are nearly identical (analysis of convex functions, expectations over partitions). The researchers can pivot between them. If Item 1 fails (impossibility), the team can immediately retreat to Item 2 to define the boundary conditions of the static theory.

  **What Would Change My Mind:**
  1.  **Preliminary Impossibility in Item 1:** If, within the first 6 months, the researchers derive a strong impossibility theorem showing that *no* accuracy-based metric can rank inquiry policies under scarcity without external values, I would shift funding to **Item 3 (Imprecise Credences)**. Why? Because if the dynamic extension is impossible, the program must retreat to its strongest static application. Showing that accuracy handles *imprecision* better than rival theories would be the best defensive move.
  2.  **Discovery of Pathological Proper Rules:** If Item 2 reveals that standard proper rules allow for "gerrymandered" credence assignments that are intuitively irrational, I would move **The "Change the Subject" Objection** (currently refused) into the funded list. This would indicate that accuracy is insufficient on its own, and the formal work must shift to hybrid utility functions (Accuracy + X).

  **Summary of Deliverables:**
  *   **Year 1:** Formalize the Inquiry Policy model. Prove/Dissolve the Value-of-Information tension under effort constraints.
  *   **Year 2:** Classify Proper Scoring Rules. Identify necessary conditions for Probabilism dominance.
  *   **Year 3:** Synthesize. If Inquiry is possible, draft the "Dynamic Accuracy" norms. If Inquiry is impossible, draft the "Boundary of Accuracy" theorem.

  This agenda maximizes the probability of a definitive formal result that either extends the paradigm or precisely defines its limits, avoiding the endless dialectical loops of traditional philosophy.
