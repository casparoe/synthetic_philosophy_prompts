          *   *Madisonian Counter:* His load-bearing beam is "Religion is outside state cognizance." The specific mechanism (tax vs. regulation) matters less than the intrusion. But we must admit he didn't foresee a pluralistic, voluntary membership model managed by the state.
          *   *Key phrase:* "Principle vs. Context."

  5.  **Refining and Polishing:**
