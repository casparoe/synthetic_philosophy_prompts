  # Is Mathematics Broken? A Decision Tree

  **The Starting Point**
  We begin with two facts everyone in this room can accept. First, if we allow the rule that "any description creates a mathematical object," we get a contradiction (Russell's Paradox). Second, we have no absolute proof that our standard arithmetic will never produce a contradiction (Gödel's Theorem). This means the possibility that mathematics is inconsistent is a live option, not just a curiosity.

  This tree helps you find your position on the problem. Answer the questions based on your intuition. You do not need to know the names of the positions to find your way.

  ***

  ### The Tree

  **Question 1:** When a contradiction appears, is the mistake in the **rules for defining objects** (like sets or numbers) or in the **rules for reasoning** (logic) we use to study them?
  *   **A. The Definitions:** Go to Question 2.
  *   **B. The Reasoning:** Go to Question 6.

  ---

  #### Branch A: The Definitions are the Problem

  **Question 2:** Are mathematical objects real things we **discover**, or are they human **inventions**?
  *   **A. Discoveries (Real):** Go to Question 3.
  *   **B. Inventions:** Go to Question 4.

  **Question 3:** If they are real discoveries, is consistency a **necessary truth** about them, or just a **contingent fact** that might be otherwise?
  *   **A. Necessary:** Go to **Leaf 1**.
  *   **B. Contingent:** Go to **Leaf 2**.

  **Question 4:** If they are inventions, is the main goal **internal coherence** (making sense) or **external usefulness** (getting results)?
  *   **A. Usefulness:** Go to **Leaf 3**.
  *   **B. Coherence:** Go to Question 5.

  **Question 5:** If coherence is the goal, is consistency a **rule we imposed** on the game, or a **pattern that emerges** from the structure?
  *   **A. A Rule:** Go to **Leaf 4**.
  *   **B. A Pattern:** Go to **Leaf 5**.

  ---

  #### Branch B: The Reasoning is the Problem

  **Question 6:** Should our reasoning **ban contradictions** entirely, or simply **contain their damage** so the system doesn't collapse?
  *   **A. Ban Entirely:** Go to Question 7.
  *   **B. Contain Damage:** Go to Question 8.

  **Question 7:** If we ban them, is the culprit **infinite totalities** (like "all numbers") or **something else** about how we construct proofs?
  *   **A. Infinite Totalities:** Go to **Leaf 6**.
  *   **B. Something Else:** Go to **Leaf 7**.

  **Question 8:** If we contain the damage, are some contradictions **actually true**, or are they **false but manageable**?
  *   **A. Actually True:** Go to **Leaf 8**.
  *   **B. False but Manageable:** Go to Question 9.

  **Question 9:** If they are false but manageable, should we apply this fix to **all of mathematics**, or just to **arithmetic**?
  *   **A. All of Mathematics:** Go to **Leaf 9**.
  *   **B. Just Arithmetic:** Go to **Leaf 10**.

  ***

  ### The Positions (Leaves)

  **Leaf 1: The Classical Platonist**
  *   **Position:** Mathematics describes a real, perfect realm that must be consistent; our axioms just need tightening.
  *   **Most Awkward Commitment:** We must permanently forbid certain definitions without knowing if they were actually safe.

  **Leaf 2: The Fallibilist Realist**
  *   **Position:** Mathematics is real, but like science, our grasp of it is imperfect and might contain errors.
  *   **Most Awkward Commitment:** We must accept that reality itself might be logically flawed.

  **Leaf 3: The Instrumentalist**
  *   **Position:** Mathematics is a tool for prediction; truth and consistency matter less than utility.
  *   **Most Awkward Commitment:** We must accept math doesn't need to be true to be good.

  **Leaf 4: The Formalist (or Conventionalist)**
  *   **Position:** Mathematics is a game of symbols; consistency is just a rule we chose to play by.
  *   **Most Awkward Commitment:** We must accept math has no subject matter other than symbols.

  **Leaf 5: The Structuralist**
  *   **Position:** Mathematics studies patterns; consistency is a feature of the structure, not the objects.
  *   **Most Awkward Commitment:** We must accept objects don't exist, only places in patterns do.

  **Leaf 6: The Intuitionist**
  *   **Position:** Reasoning about completed infinities is invalid; we must restrict logic to what can be constructed.
  *   **Most Awkward Commitment:** We must reject standard proofs about infinite sets that work fine in physics.

  **Leaf 7: The Constructivist**
  *   **Position:** Proofs must build objects step-by-step; classical logic fails because it assumes objects exist before we find them.
  *   **Most Awkward Commitment:** We must reject the law of excluded middle (that every statement is true or false) for unsolved problems.

  **Leaf 8: The Dialetheist**
  *   **Position:** Some contradictions are true facts about the world; logic must be changed to accommodate truth.
  *   **Most Awkward Commitment:** We must accept that some contradictions are literally true facts.

  **Leaf 9: The Paraconsistent Logician**
  *   **Position:** Logic should tolerate contradictions without exploding, allowing us to reason through inconsistencies generally.
  *   **Most Awkward Commitment:** We must accept that a statement and its opposite can both be asserted without collapse.

  **Leaf 10: The Inconsistent Arithmetic Theorist**
  *   **Position:** Standard arithmetic might be inconsistent, but we can still calculate safely within it.
  *   **Most Awkward Commitment:** We must accept standard numbers might violate basic laws without breaking calculation.

  ***

  ### Notes on the Logical Space

  **Unoccupied Combinations**
  There are combinations of answers that no serious position occupies.
  *   **Real + Contingent + Ban Contradictions:** If mathematical reality is contingent (could be otherwise), it is unclear why one would insist on banning contradictions absolutely. This space is largely **unexplored**.
  *   **Invented + Rule + True Contradictions:** If math is a game with rules we invented, it is **unattractive** to intentionally invent rules that allow true contradictions, as we could simply change the rules to avoid them.

  **Indistinguishable Pairs**
  This tree cannot perfectly separate every subtle variation.
  *   **Formalist vs. Conventionalist:** These positions are so close that Question 5 (Rule vs. Pattern) is often a matter of emphasis rather than a hard divide.
  *   **Paraconsistent Logician vs. Inconsistent Arithmetic Theorist:** The distinction in Question 9 is one of scope, not fundamental principle; many theorists hold both views simultaneously.
