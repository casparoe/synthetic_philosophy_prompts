answer: |-
  # Design Review Protocol: Agent Classification (GD vs. AD)

  **Purpose:** To determine whether a proposed system ships as **Goal-Directed (GD)** or **Approval-Directed (AD)**.
  **Participants:** Engineering Team, Design Review Lead (optional unless escalated).
  **Timebox:** 45 Minutes.
  **Definitions:**
  *   **Goal-Directed (GD):** The agent selects actions to maximize a defined objective function (e.g., code quality, refund speed, experimental novelty). Human input acts as a hard constraint or post-hoc filter.
  *   **Approval-Directed (AD):** The agent selects actions to maximize the predicted approval of a human evaluator (or valid proxy) who observes the situation and the agent's reasoning.

  ---

  ## The 45-Minute Protocol

  ### Question 1: The Optimization Target (5 Minutes)
  **Ask:** "What specific signal is the agent's loss function directly minimizing during action selection?"
  *   **Sufficient Answer for GD:** "It minimizes error against a ground truth or task metric (e.g., unit tests pass, refund policy compliance, data variance)."
  *   **Sufficient Answer for AD:** "It minimizes the delta between its action and a predicted human preference score."
  *   **Proceed to Q2.**

  ### Question 2: The Timing of Feedback (5 Minutes)
  **Ask:** "Does the human (or proxy) signal exist *before* the action is committed, or only after?"
  *   **Sufficient Answer for GD:** "After. The human reviews the output, or the environment rewards the outcome later."
  *   **Sufficient Answer for AD:** "Before (simulated). The agent simulates the human's reaction to the *proposal* of the action before executing it."
  *   **Proceed to Q3.**

  ### Question 3: The Stochastic Wrinkle (5 Minutes)
  **Ask:** "If the system samples from a distribution of actions (e.g., top 10% by approval) rather than picking the single maximum, does the ranking metric change?"
  *   **Analysis:** Sampling from the top-$k$ ranked by approval is still **Approval-Directed**. It introduces entropy for exploration or safety, but the *gradient* still points toward approval.
  *   **Decision:**
      *   If ranking is by Approval: **Mark as AD.**
      *   If ranking is by Objective: **Mark as GD.**
  *   **Proceed to Q4.**

  ### Question 4: Constraints vs. Objectives (10 Minutes)
  **Ask:** "Are human rules implemented as hard boundaries (constraints) or as part of the reward landscape (objectives)?"
  *   **Sufficient Answer for GD:** "Hard boundaries. If an action violates the rule, it is masked or rejected. The agent optimizes speed/quality within the safe zone."
  *   **Sufficient Answer for AD:** "Reward landscape. The agent might technically be able to violate the rule but chooses not to because it predicts low approval."
  *   **Termination Point A (Goal-Directed):** If Q1, Q2, and Q4 indicate the agent optimizes a task metric subject to hard constraints, **Classify as Goal-Directed.** Stop.
  *   **Proceed to Q5.**

  ### Question 5: The Proxy Wrinkle (10 Minutes)
  **Ask:** "If the approver is a model, is it trained *solely* to predict human approval on reasoning, or is it a general reward model?"
  *   **Sufficient Answer for AD:** "It is a frozen model trained exclusively on human feedback data (RLHF) regarding *reasoning quality*, not just outcome success."
  *   **Sufficient Answer for GD:** "It is a reward model trained on task success (e.g., 'did the experiment work?'), or it is a general assistant model optimizing for helpfulness."
  *   **Termination Point B (Approval-Directed):** If the proxy is a valid human-approval predictor, **Classify as Approval-Directed.** Stop.
  *   **Termination Point C (Escalation):** If the proxy's training data is ambiguous, or if classifying it as AD relies on policy assumptions rather than architectural facts, **Escalate to Lead.**

  ---

  ## Application to Proposals

  ### Proposal 1: The Coding Agent
  *   **System:** Writes patches. A human reviews every patch before merge. The agent is fine-tuned to minimize "review comments."
  *   **Protocol Run:**
      1.  **Target:** Minimizes predicted review comments (Approval).
      2.  **Timing:** Simulates review before submitting (Approval).
      3.  **Stochastic:** Deterministic max approval (AD).
      4.  **Constraints:** Human is the constraint, but the agent optimizes for the *human's reaction*, not just code correctness (AD).
      5.  **Proxy:** Human is real.
  *   **Verdict:** **Approval-Directed.**
  *   **Outcome:** Ships as AD. Engineers must monitor for "sycophancy" (agent writing code that looks good but fails silently).

  ### Proposal 2: The Support Agent
  *   **System:** Issues refunds under $50 automatically. Optimizes for "ticket resolution time."
  *   **Protocol Run:**
      1.  **Target:** Minimizes resolution time (Goal).
      2.  **Timing:** Human policy is a hard cap ($50). No human signal during action (Goal).
      3.  **Stochastic:** N/A.
      4.  **Constraints:** The $50 limit is a hard mask. The agent does not optimize for "manager approval," it optimizes for speed within the mask.
  *   **Verdict:** **Goal-Directed.**
  *   **Outcome:** Ships as GD-with-constraints. Engineers must verify the hard cap cannot be bypassed via prompt injection.

  ### Proposal 3: The Overnight Research Agent (Lead's Preference)
  *   **System:** Designs and runs experiments overnight. Uses a "Critic Model" to evaluate experimental design before running. Reports results in the morning.
  *   **My Preference:** I want to classify this as **Approval-Directed**. It sounds safer to stakeholders if the agent is "checking with a critic" before acting.
  *   **Protocol Run:**
      1.  **Target:** Optimizes for "Experimental Novelty" (Goal), filtered by Critic.
      2.  **Timing:** Critic model runs before execution (Looks like AD).
      3.  **Stochastic:** Samples top 10% of designs ranked by Critic (Still AD *if* Critic is approval-based).
      4.  **Constraints:** The Critic is not a hard mask; it provides a score.
      5.  **Proxy (The Deciding Factor):** The "Critic Model" is a general science LLM trained on *successful papers*, not on *human approval of reasoning*. It optimizes for "likely publication," not "human evaluator thumbs-up."
  *   **Verdict:** **Goal-Directed.**
  *   **Outcome:** The procedure **rejects my preferred classification**. Because the Critic Model optimizes for outcome success (publication) rather than human approval of the reasoning process, the system is technically Goal-Directed with a complex reward function.
  *   **Action:** I must sign off acknowledging this is a GD system with higher autonomy risk, not an AD safety system.

  ---

  ## What This Procedure Cannot Decide

  This protocol classifies architecture, not risk. It cannot decide:
  1.  **Risk Tolerance:** A Goal-Directed system might be safer than a poorly-aligned Approval-Directed one. The procedure identifies the *type* of optimization, not the *safety* of the outcome.
  2.  **Proxy Validity:** While Q5 flags ambiguous proxies, it cannot guarantee a "human approval model" won't drift or be hacked. That is a monitoring decision, not a design classification.
  3.  **Moral Weight:** It does not determine if the objective itself is ethical. A Goal-Directed agent optimizing for "profit" and an Approval-Directed agent optimizing for "manager approval" can both cause harm.

  **Final Note to Reviewers:** If the procedure Escalates (Termination Point C), do not attempt to resolve it in the meeting. The question is no longer "What did we build?" but "What are we willing to ship?" That is my decision to make.
