prompt: |-
  I teach a ninety-minute session of an upper-level seminar on practical rationality, sixteen students, and I want them to feel a money pump happen to them rather than hear one described. What I want them to come away seeing is this: what it is about a certain structure of preferences that makes an agent exploitable, and why the obvious fix — simply refusing to trade — is itself a substantive commitment with a price rather than a free move.

  Here is the shape I have in mind, though I want you to design the actual mechanics. Each participant is assigned a small set of preferences over three or four items, with a small fee charged for each pairwise trade, and the preferences arranged so that a participant who sincerely follows her current preference at each step can be cycled back to where she began, minus the fees, with nothing to show for it. I am content for the preferences to be induced by an instruction card rather than discovered — the point is the structure, not the autobiography. The items and fees should be trivial: tokens, pieces of candy, points on a scoreboard, no real money.

  Then I want a second stage, and this is the part I care most about. Once the group has watched or suffered the pump, give them a chance to do something about it: before play resumes, they may adopt a rule for how they will choose over the whole sequence. Some will want to adopt a policy and hold to it even when their present preference points the other way; some will want to anticipate their own future choices and reason backwards; some will want to keep choosing freely step by step. I want this stage to make each of those a real position with a real cost rather than a slogan — the committed agent has to act against what she now wants and may have mispredicted her future self; the anticipating agent may find that foreseeing the trap is not the same as escaping it; the step-by-step agent may find herself pumped a second time.

  Two constraints on the design. First, the mechanism, not the facilitator, must do the work: participants should run into the trap through the rules and incentives before anyone names it, and the debrief should come only after they have already felt it. Second, I want the pump to be recognizably about diachronic rationality and not only about intransitivity. Ideally the structure that generates it should turn on a preference that is unstable across the stages of the game, so that the problem is about an agent whose choices at different times pull against one another. If you can build a single activity that exhibits both the synchronic and the diachronic version, better still; if not, choose the diachronic one and say why.

  Please give me the full rules and roles; the materials; the payoff or fee scheme; a minute-by-minute timeline for the ninety minutes; and the debrief, which should map specific moments in the activity onto the parts of the idea they are meant to carry — where the cycle bites, where the first person tries to step outside it, where the group's chosen rule either holds or breaks — and which should price the alternatives honestly rather than recommend one. Then tell me what will predictably go wrong the first time I run it and how to handle it. I expect at least some participants to refuse to trade at all from the outset, and others to treat the whole thing as a puzzle about the rules rather than about their own preferences; I want to know how to respond without tipping the point. Finally, be frank about which feature of the idea the activity cannot reproduce and that I will have to supply in words. I suspect it is one of two things: the case of an agent whose preferences are fully stable and well behaved, who — if the arguments are right — simply cannot be pumped; or the felt grip of preferences that are genuinely one's own rather than handed over on a card. Tell me which, and say what I would have to do about it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Goal:** Teach a 90-minute upper-level seminar on practical rationality (specifically money pumps).
      *   **Core Experience:** Students must *feel* the money pump, not just hear about it.
      *   **Key Insight 1:** Exploitability comes from preference structure (intransitivity/cycling).
      *   **Key Insight 2:** The "fix" (refusing to trade/adopting a policy) is a substantive commitment with a cost, not a free move.
      *   **Structure:**
          *   Stage 1: Induced preferences + small fees per trade -> Cycle back to start minus fees.
          *   Stage 2: Opportunity to adopt rules/policies before play resumes. Different strategies (commitment, backward induction, myopic choice) must have real costs/consequences.
      *   **Constraints:**
          *   Mechanism-driven (not facilitator explanation first).
          *   Focus on *diachronic* rationality (preferences unstable across time/stages), not just synchronic intransitivity. Ideally both.
          *   Must include: Rules/Roles, Materials, Payoff/Fee Scheme, Minute-by-Minute Timeline, Debrief (mapping moments to concepts), Troubleshooting (predictable failures), Limitations (what the activity *can't* do).
      *   **Class Size:** 16 students.
      *   **Duration:** 90 minutes.

  2.  **Deconstruct the Philosophical Problem:**

      *   *Standard Money Pump:* Intransitive preferences (A > B > C > A). If you trade A for B (pay \$1), B for C (pay \$1), C for A (pay \$1), you end up with A and -\$3.
      *   *Diachronic Element:* The request asks for preferences that are *unstable across stages*. This suggests something like *preference reversal* or *dynamic inconsistency* (e.g., Hyperbolic Discounting or Allais-type framing effects that shift based on ownership/endowment).
      *   *The "Fix" Cost:* If I say "I won't trade," I might miss out on a genuine improvement. If I say "I will trade," I get pumped. The cost of rationality is the loss of flexibility or the cost of pre-commitment.
      *   *Design Challenge:* How to make preferences unstable *during* the game without just handing them a card that says "You now prefer B"?
      *   *Solution:* Use the **Endowment Effect** combined with **Framing**.
          *   Round 1: You hold Item X. You are offered Y. (You value Y > X because of specific features).
          *   Round 2: You hold Item Y. You are offered Z. (Context shifts slightly, or the "cost" of trading changes perception).
          *   *Better approach for Diachronic:* Use **Sequential Choice with Changing Context**.
          *   *Best approach for this specific prompt:* The prompt asks for *induced preferences* via instruction card but wants the *diachronic* tension to be about the agent's choices at different times pulling against one another.
          *   *Refinement:* Let's stick to the classic Intransitive Cycle for Stage 1 (Synchronic) but frame Stage 2 as a Diachronic Policy Choice. Wait, the prompt says: "Ideally the structure that generates it should turn on a preference that is unstable across the stages of the game... If you can build a single activity that exhibits both... better still."
          *   *Decision:* I will design a hybrid. The preferences are *structurally* intransitive (A>B>C>A), but the *motivation* for the preference shifts based on what they currently hold (Endowment/Status Quo Bias). This makes the preference *diachronically* unstable because "What I want when I have A" differs from "What I want when I have B." This captures the "unstable across stages" constraint better than static intransitivity.

  3.  **Drafting the Mechanics:**

      *   **Items:** 3 Cards (Red, Blue, Green). Or better, 3 "Bundles" of points/tokens. Let's use **Colored Tokens** representing different "portfolios."
      *   **Preferences:**
          *   Hold Red -> Prefer Blue (Blue has a feature Red lacks).
          *   Hold Blue -> Prefer Green (Green has a feature Blue lacks).
          *   Hold Green -> Prefer Red (Red has a feature Green lacks).
      *   **Fee:** 1 "Rationality Point" (RP) per trade.
      *   **Stage 2:** Allow them to write a "Constitution" or "Policy Card" before trading starts.
      *   **Cost of Policy:** If you commit to "No Trading," you lose the chance to upgrade if the cycle breaks (maybe introduce a 'Dominant' item D occasionally?). Or, simpler: The cost is the *opportunity cost* of not trading when it *would* have been beneficial in a non-pump scenario.
      *   *Wait, to make the "fix" have a price:* I need a scenario where refusing to trade costs you something.
      *   *Idea:* In Stage 2, introduce a "Market Maker" (the instructor) who offers trades. If you have a policy "Never Trade," you forfeit a guaranteed +1 point upgrade opportunity that appears randomly. If you have a policy "Always Follow Preference," you get pumped.
      *   *Actually, keep it simpler:* The cost of the "fix" is the cognitive effort/rigidity. But the prompt wants a *substantive* cost.
      *   *Revised Idea:* The "Fix" is **Pre-commitment**. To pre-commit, you must pay a fee upfront (e.g., 2 points). If you don't pre-commit, you risk the pump (3 points). If you pre-commit, you pay 2 points even if the pump doesn't happen. This mirrors the cost of binding oneself (Ulysses contract).

  4.  **Developing the Diachronic Tension:**

      *   To satisfy the "unstable preferences" constraint: The preference card changes based on *what you hold*.
      *   Card A (When holding Red): "Blue is better than Red."
      *   Card B (When holding Blue): "Green is better than Blue."
      *   Card C (When holding Green): "Red is better than Green."
      *   This creates *local* rationality but *global* irrationality. The "Self" at time 1 conflicts with the "Self" at time 3.

  5.  **Timeline Construction (90 Minutes):**

      *   0-10: Setup & Distribution.
      *   10-30: Stage 1 (The Pump). Free trading.
      *   30-45: The Pause & Policy Design (Stage 2 Setup).
      *   45-70: Stage 2 (Policy Implementation).
      *   70-90: Debrief.

  6.  **Addressing the "Cost of the Fix":**

      *   How to make "Refusing to Trade" costly?
      *   *Mechanism:* In Stage 2, introduce a 4th Item (Gold) that dominates everything. But you only get offered Gold if you are willing to trade. If your policy is "No Trades," you miss the Gold.
      *   *Alternative:* The "Fee" to adopt a policy is the cost. You start with 10 points. Pump costs 3 points. Policy costs 2 points. If you buy policy, you save 1 point *if* pumped, but lose 2 points if *not* pumped.
      *   *Let's go with the Policy Fee:* To register a "No-Cycle Policy," you must pay a "Binding Cost" (e.g., 2 tokens). This represents the loss of flexibility.

  7.  **Addressing Predictable Failures:**

      *   *Refusers:* Students who see the trick immediately and don't trade.
      *   *Gamers:* Students treating it as a puzzle to beat the teacher.
      *   *Solution:* Make the preferences feel "real" via the cards. Make the Refusers the "Control Group" for the debrief.

  8.  **Addressing the Limitation:**

      *   What can't the activity do? It can't reproduce the *felt grip* of endogenous preferences. These are induced. The students know it's a game.
      *   *Remedy:* The debrief must bridge the gap to real life (addiction, procrastination, consumer choice).

  9.  **Refining the Mechanics (Self-Correction):**

      *   *Critique:* Just paying a fee to adopt a policy is a bit abstract.
      *   *Better:* In Stage 2, run two rounds.
          *   Round 2A: You can change your mind mid-stream. (Most get pumped again).
          *   Round 2B: You must sign a contract *before* starting. "I will not trade more than once."
          *   *The Cost:* The contract prevents you from taking a *good* trade.
          *   *Implementation:* The Market Maker offers a sequence. Sometimes it's A->B (Good). Sometimes it's A->B->C->A (Pump). You don't know which sequence until you start.
          *   *If you sign contract:* You pay 1 point fee. You are safe from Pump, but you must reject the Good Trade (losing potential gain).
          *   *If you don't sign:* You risk the Pump.
          *   *This captures the "substantive commitment with a price."*

  10. **Finalizing the Plan:**

      *   **Materials:** Colored cards (Red, Blue, Green), Point tokens, "Preference Prompt" cards (sealed envelopes), Policy Contracts.
      *   **Preferences:** Based on "Attributes."
          *   Red: High Safety, Low Growth.
          *   Blue: High Growth, Medium Safety.
          *   Green: Medium Growth, High Safety.
          *   *Wait, keep it simpler.* Just use the cards to dictate preference based on current holding.
      *   **Diachronic Twist:** The preference card tells you what you want *given what you hold*. This makes the preference state-dependent.
      *   **Stage 2 Cost:** To avoid the pump, you must surrender your right to trade after the first exchange. This means if a "Dominant Option" appears, you can't take it.

      *(Self-Correction on Diachronic Constraint)*: The prompt asks for preferences unstable across stages. State-dependent preferences (Endowment) achieve this. When I hold A, I want B. When I hold B, I want C. My "Self" changes with my portfolio.

      *(Refining the "Cost of Fix")*: The most philosophically honest cost of avoiding a money pump is **incompleteness** or **rigidity**. If I refuse to trade, I might miss a Pareto improvement.
      *   *Design:* In Stage 2, 50% of the class gets a "Pump Sequence" (A->B->C->A). 50% gets a "Ladder Sequence" (A->B->C->D where D is best).
      *   If you adopt a "No-Trade Policy," you survive the Pump but stop at A in the Ladder (missing out on D).
      *   If you adopt "Trade Freely," you get D in the Ladder but lose points in the Pump.
      *   *This perfectly illustrates the trade-off.*

  11. **Drafting the Content:**

      *   **Title:** The Cost of Coherence.
      *   **Materials:** Envelopes, Cards, Tokens.
      *   **Timeline:** Detailed breakdown.
      *   **Debrief:** Mapping specific moments.
      *   **Troubleshooting:** Handling the skeptics.
      *   **Limitation:** Endogeneity of preference.

  12. **Review against Constraints:**
      *   90 mins? Yes.
      *   16 students? Yes.
      *   Feel the pump? Yes.
      *   Fix has a cost? Yes (The Ladder vs. Pump risk).
      *   Mechanism driven? Yes.
      *   Diachronic focus? Yes (State-dependent preferences + Policy choice).
      *   Troubleshooting included? Yes.
      *   Limitation identified? Yes.

  13. **Final Polish:** Ensure the tone is appropriate for an upper-level seminar (philosophically rigorous but practical). Make sure the instructions for the "Preference Cards" are clear so the intransitivity is guaranteed but feels like a choice.

      *Wait, one nuance:* "Preferences... unstable across the stages."
      If I just give them a card saying "If you have Red, want Blue," that's static instruction.
      To make it *unstable*, the *reason* for the preference should shift.
      *Idea:* Use "Needs."
      Round 1: You are "Hungry." (Prefer Food Token).
      Round 2: You are "Thirsty." (Prefer Drink Token).
      Round 3: You are "Tired." (Prefer Rest Token).
      But this requires changing their internal state.
      *Easier:* Use the **Endowment Effect** as the instability mechanism.
      "Value what you have + 10%."
      No, that prevents trading.
      *Let's stick to the Instruction Card but frame it as "Current Assessment."*
      "Given your current portfolio, assess the options."
      The *instability* is that your assessment depends on your starting point. This is **Reference Dependence**. That is diachronic because your reference point changes over time. I will emphasize this in the debrief.

      *Revised Stage 2 Cost:*
      To prevent the pump, you must bind your future self.
      Cost: You must pay a "Binding Fee" (2 points) to lock your choice.
      Benefit: You won't trade cyclically.
      Risk: If a better option appears, you can't take it.
      *Actually, the Ladder vs. Pump split is stronger.*
      I will implement the Ladder vs. Pump split for Stage 2. It forces them to weigh the risk of exploitation against the cost of rigidity.

      *Wait, 16 students.*
      I can manage the Ladder/Pump split easily. 8 get Pump, 8 get Ladder.

      *Let's write it.*
answer: |-
  # Seminar Plan: The Cost of Coherence
  **Topic:** Diachronic Rationality and the Money Pump
  **Duration:** 90 Minutes
  **Class Size:** 16 Students
  **Goal:** To experientially demonstrate that (1) intransitive/state-dependent preferences lead to exploitation, and (2) the rational fix (pre-commitment/policy) entails a substantive cost (loss of flexibility/opportunity), not just a logical correction.

  ---

  ## I. Materials & Setup

  **For the Instructor:**
  *   **Scoreboard:** Whiteboard or projected spreadsheet to track student "Wealth" (start everyone at 10 Points).
  *   **Trade Ledger:** A simple sheet to record who trades with whom (or with the "Bank").
  *   **Timer:** Visible to the class.

  **For Each Student (16 Kits):**
  *   **Wealth:** 10 Poker Chips or Tokens (representing "Utility Points").
  *   **Asset:** 1 Card drawn from a deck (Red, Blue, or Green). *Distribution: 5 Red, 5 Blue, 6 Green.*
  *   **Private Instruction Card (Sealed Envelope):** Tells them how to value assets *given what they currently hold*.
      *   *If holding Red:* "You currently value **Blue** more than Red. You are willing to pay up to 2 Points to switch."
      *   *If holding Blue:* "You currently value **Green** more than Blue. You are willing to pay up to 2 Points to switch."
      *   *If holding Green:* "You currently value **Red** more than Green. You are willing to pay up to 2 Points to switch."
      *   *(Note: This induces reference-dependent preferences. The preference is rational locally but intransitive globally.)*
  *   **Pen & Paper:** For Stage 2 policy drafting.

  **The "Bank" (Instructor):**
  *   Holds a reserve of Red, Blue, and Green cards.
  *   Holds a reserve of "Gold" cards (for Stage 2).

  ---

  ## II. Minute-by-Minute Timeline

  ### 0:00 – 0:10: Setup & Induction
  *   **Action:** Distribute kits. Students count tokens (10) and open their Asset Card.
  *   **Instruction:** "You are in a market. Your goal is to maximize your final Point count + the value of your final Asset. You may trade with the Bank or other students. Every trade costs a **Transaction Fee of 1 Point**, paid to the Bank. You must follow the valuation instruction in your envelope."
  *   **Crucial Constraint:** "You must make your decision *in the moment*. Do not plan ahead. Just ask yourself: *Given what I hold now, do I want to trade?*"
  *   **Philosophical Frame:** Do not mention "money pump," "intransitivity," or "rationality." Frame it as "Market Behavior."

  ### 0:10 – 0:35: Stage 1 — The Pump (Experience)
  *   **Mechanism:** Open the floor for trading.
  *   **Instructor Role:** Act as a market maker. If trading stalls, approach a student holding Red and offer Blue for 1 Point. Once they accept, approach them (or another) holding Blue and offer Green for 1 Point. Then Green to Red for 1 Point.
  *   **Goal:** Get at least 50% of the class to complete one full cycle (Red → Blue → Green → Red).
  *   **Observation:** Watch students lose points (10 → 9 → 8 → 7) while ending with the same asset they started with.
  *   **Stop Condition:** At 0:35, freeze the market. Ask students to record their current Point total and Asset.

  ### 0:35 – 0:45: The Pause — Policy Design
  *   **Instruction:** "We will run a second market session. However, before we begin, you may adopt a **Personal Policy**. This is a rule you write down and submit to me. Once submitted, you cannot violate it."
  *   **The Choice:**
      1.  **Discretionary:** "I will choose trade-by-trade based on my current preference." (No fee, high risk).
      2.  **Committed:** "I will not trade more than once." (Cost: You pay a **Binding Fee of 2 Points** upfront to register this policy).
  *   **The Catch (Hidden):** Tell them: "Policies help you manage risk. But they limit flexibility." Do not explain *how* yet.
  *   **Action:** Students write policies. Collect them. Charge the 2-point fee to those who chose "Committed."

  ### 0:45 – 1:10: Stage 2 — The Test (Diachronic Choice)
  *   **Setup:** Split the class into two groups (Group A and Group B) without telling them they are different.
      *   **Group A (8 students):** The **Pump Environment**. The Bank offers the same cycle as Stage 1 (Red→Blue→Green→Red).
      *   **Group B (8 students):** The **Ladder Environment**. The Bank offers a linear upgrade (Red→Blue→Green→**Gold**). Gold is worth 5 Points more than the others.
  *   **Mechanism:** Run the trading session again.
      *   *Group A (Pump):* Discretionary agents get pumped again. Committed agents stop after 1 trade (losing the Binding Fee but avoiding the cycle).
      *   *Group B (Ladder):* Discretionary agents trade all the way to Gold (maximizing gain). Committed agents stop after 1 trade (missing the Gold, having paid the Binding Fee).
  *   **Stop Condition:** At 1:10, freeze. Final tally of Points + Asset Value.

  ### 1:10 – 1:30: Debrief — Mapping the Mechanics to Theory
  *   **Action:** Project the results anonymously. Compare Final Wealth of:
      1.  Stage 1 Victims (Pumped).
      2.  Stage 2 Discretionary (Pumped vs. Ladder).
      3.  Stage 2 Committed (Safe vs. Missed Opportunity).
  *   **Discussion:** (See Detailed Debrief below).

  ---

  ## III. Detailed Debrief Guide

  **1. Where the Cycle Bites (Stage 1)**
  *   **Ask:** "Who ended with the same card they started but fewer points?"
  *   **Concept:** **Synchronic Intransitivity vs. Diachronic Instability.**
  *   **Point:** "You weren't irrational in the moment. Given Red, you wanted Blue. Given Blue, you wanted Green. Your preference was *state-dependent*. The pump works because your 'Self' at 10:15 AM disagrees with your 'Self' at 10:30 AM. You were exploited not because you were stupid, but because you were *flexible*."

  **2. Where the First Person Steps Outside (Stage 2 Policy)**
  *   **Ask:** "Who paid the 2-point Binding Fee? Why?"
  *   **Concept:** **Pre-commitment as a Cost.**
  *   **Point:** "You paid to restrict your future freedom. This is the Ulysses Contract. But notice: Rationality isn't free. You paid 2 points to avoid losing 3 points. If the threat hadn't appeared, that 2 points would have been wasted. Rationality requires an investment in rigidity."

  **3. Where the Group's Rule Holds or Breaks (The Ladder vs. Pump)**
  *   **Reveal:** "Half of you faced a Cycle. Half faced a Ladder."
  *   **Ask Group B (Ladder) Committed Agents:** "You followed your rule. You didn't get pumped. But you missed the Gold. Do you regret your policy?"
  *   **Ask Group A (Pump) Discretionary Agents:** "You kept your flexibility. But you lost points. Do you regret your freedom?"
  *   **Concept:** **The Price of Coherence.**
  *   **Point:** "This is the core lesson. A policy of 'Never Trade Cyclically' is indistinguishable from a policy of 'Never Trade More Than Once.' To guarantee you don't get pumped, you must blind yourself to genuine improvement. The cost of avoiding exploitation is the loss of **responsiveness**."

  ---

  ## IV. Predictable Failures & Troubleshooting

  **1. The "Refusers" (Skeptics)**
  *   **Problem:** 2-3 students will refuse to trade in Stage 1, suspecting a trick.
  *   **Impact:** They don't feel the pump.
  *   **Response:** Do not chastise them. In the debrief, label them **"The Endowment Effect Control Group."**
  *   **Script:** "These students effectively adopted a 'Status Quo Policy' intuitively. They avoided the pump, but in Stage 2 (Ladder), they also missed the Gold. Their 'skepticism' functioned exactly like the 'Committed Policy.' It saved them from loss but cost them gain. This proves the cost of rationality is paid even by those who just sit still."

  **2. The "Gamers" (Rule Lawyers)**
  *   **Problem:** Students ask, "Can we trade back immediately?" or "Can we pool points?"
  *   **Impact:** Breaks the isolation of the agent.
  *   **Response:** Shut this down firmly but politely. "This is a seminar on *individual* practical rationality, not market collusion. The constraints are the physics of this world."
  *   **Prevention:** In the initial instructions, state: "You are an isolated agent. You cannot coordinate with others."

  **3. The "Bored" (Disengagement)**
  *   **Problem:** Students treat tokens as meaningless.
  *   **Impact:** No emotional grip.
  *   **Response:** Gamify the outcome. "The top 3 wealth holders get [small prize: candy/extra credit/bookmark]." Even trivial stakes trigger competitive rationality.

  **4. The "Confused" (Instruction Card Failure)**
  *   **Problem:** Students forget what their card says.
  *   **Impact:** Cycle breaks.
  *   **Response:** Walk around during Stage 1. If a student hesitates, point to their card. "What does your instruction say you prefer *right now*?" Reinforce the *local* rationality.

  ---

  ## V. Limitations: What This Activity Cannot Do

  You asked for frankness about the gap between the simulation and the theory. There are two major gaps, but one is critical.

  **1. The Gap of Endogeneity (The "Felt Grip")**
  *   **Limitation:** In the activity, preferences are **exogenous** (handed to them on a card). In real life, preferences are **endogenous** (they feel like *mine*).
  *   **Consequence:** Students may feel they were "tricked" by the cards rather than "exploited" by their own nature. They won't feel the shame or confusion of genuine preference reversal, only the annoyance of a game mechanic.
  *   **How to Supply in Words:** In the debrief, you must bridge this.
      *   *Script:* "In this game, I gave you the preferences on a card. In your life, your brain gives you the preferences via dopamine, framing, and fatigue. When you procrastinate, your 'Morning Self' prefers Work, but your 'Noon Self' prefers Distraction. That is not a card I handed you; that is your neurology. The money pump isn't just a logic puzzle; it is the structure of addiction, debt, and weakness of will. You felt the mechanics here; apply that feeling to your own diachronic conflicts."

  **2. The Gap of the "Well-Behaved Agent"**
  *   **Limitation:** The activity cannot simulate an agent with **transitive, stable preferences** who simply *cannot* be pumped.
  *   **Consequence:** Students might conclude "All agents are exploitable" or "Rationality is just damage control."
  *   **How to Supply in Words:** You must explicitly describe the counterfactual.
      *   *Script:* "Imagine an agent whose preferences were A>B>C, and who never preferred A over C. That agent would trade A for B, then B for C, and stop. They would not pay the fee to go back to A. That agent is 'coherent.' But notice: To be that agent, you must have a preference structure that is invariant across time. Most of us do not. We are reference-dependent. The activity shows you the cost of *not* being that ideal agent. The ideal agent pays no binding fee because they need no binding. We are not ideal agents."

  ---

  ## VI. Why This Design Choices Were Made

  1.  **Diachronic Focus:** By making the preference dependent on *what they hold* (Reference Dependence), the preference literally changes over time as they trade. This satisfies your constraint for diachronic instability better than static intransitivity.
  2.  **The Cost of the Fix:** The Stage 2 split (Pump vs. Ladder) is the critical innovation. Standard money pump demos stop after the exploitation. By adding the "Ladder" group, you prove that the *cure* (commitment) has a side effect (blindness to improvement). This prevents the lesson from being "Just be consistent." The lesson becomes "Consistency is expensive."
  3.  **Mechanism over Lecture:** The students calculate their own losses. The scoreboard makes the exploitation objective, not subjective.

  ## VII. Instructor Cheat Sheet (The "Gotchas")

  *   **If everyone refuses to trade in Stage 1:** Lower the transaction fee from 1 Point to 0.5 Points. Or, increase the "value" of the preferred item on the card ("Willing to pay up to 5 Points"). Make the trade look like a *deal*.
  *   **If everyone adopts the Committed Policy in Stage 2:** You lose the contrast. To prevent this, emphasize that the Binding Fee is *non-refundable* and that "Flexibility is valuable in uncertain markets."
  *   **If the Ladder Group complains they were treated differently:** Acknowledge it. "Life is unfair. Markets are opaque. Sometimes your rigidity saves you; sometimes it ruins you. That is the risk of policy-based agency."

  This plan ensures they leave not just knowing *what* a money pump is, but feeling the *price* of avoiding one.
