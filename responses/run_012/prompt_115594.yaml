answer: |-
  Your hypothesis is sharp, and it cuts closer to the bone than most summaries of this debate. You are right to sense that the "stuckness" isn't just stubbornness; it's structural. The debate looks like a first-order moral disagreement ("Can Soldier A kill Soldier B?") but functions as a clash between two different normative projects.

  Here is the diagnosis of the impasse, weighing your hypotheses against the actual structure of the arguments.

  ### 1. Your Hypothesis: Different Questions (Deep Morality vs. Conventional Norms)
  **Verdict: Mostly Correct, but underestimates the substantive clash.**

  You suggest the Revisionists are asking about individual permissions while Traditionalists are asking about the rules of a practice. This is the most productive way to map the terrain. The Revisionists (McMahan et al.) are engaged in a project of **reductive individualism**. They treat war as an aggregation of interpersonal interactions. If war is just many people killing many other people, then the ordinary rules of self-defense and liability apply. In ordinary life, if you attack me unjustly, I can kill you, and you cannot kill me. The uniform doesn't change the metaphysics of rights.

  The Traditionalists (Walzer et al.) are engaged in a project of **conventionalism**. They treat war as a distinct social practice with its own internal logic. For them, the "moral equality of combatants" (MEC) is not a description of deep morality but a necessary feature of a regulatory regime designed to contain violence.

  **Where your hypothesis needs tightening:** It implies the disagreement is merely verbal—that if they just labeled their projects, they'd agree. But there is a substantive disagreement lurking here about **whether conventions can generate moral permissions.**
  *   The Revisionist says: No convention can make it permissible to kill someone who is not liable to be killed. A rule cannot override a fundamental right.
  *   The Traditionalist says: Yes, a robust convention can alter the moral landscape. By joining the institution of the military and accepting the uniform, the combatant enters a status where the normal rules of self-defense are suspended in favor of the rules of war.

  So, it is not just that they are answering different questions; they disagree on whether the "rules of the practice" answer *overrides* the "individual morality" answer. The Traditionalist argues that adhering to the convention *is* the moral thing to do because it minimizes overall suffering (a consequentialist move), whereas the Revisionist argues that violating rights is wrong even if it upholds a useful convention (a deontological move).

  ### 2. The Rival Hypothesis: Liability vs. Culpability
  **Verdict: Accurate description of the maneuvering, but not the root cause.**

  You suspect the term "equality" slides between "liable to be killed" and "blameworthy." You are right that this slide happens, but it's a symptom, not the disease.
  *   **Revisionists** tie liability strictly to **moral responsibility for a threat**. If you are fighting for an unjust cause, you are contributing to an unjust threat. Therefore, you are liable. Whether you are *blameworthy* (culpable) depends on your excuses (coercion, ignorance), but liability remains.
  *   **Traditionalists** tie liability to **status**. If you are a combatant, you are liable. If you are a civilian, you are not. They often argue that the unjust combatant is not blameworthy *because* they lack the epistemic access to know their cause is unjust.

  The impasse here is about the **grounds of liability**. The Revisionist thinks liability is objective (based on the facts of the threat). The Traditionalist thinks liability is epistemic/subjective (based on what the soldier could reasonably know).

  This isn't just verbal sliding; it's a disagreement about whether a soldier who is objectively wrong but subjectively reasonable is still a legitimate target. The Revisionist says "Yes, you can kill him (he's liable), but don't blame him." The Traditionalist says "No, you can't kill him (he's not liable), because he's doing his duty."

  ### 3. The Hidden Variable: The Epistemic Premise
  This is the empirical hinge you mentioned, and it is likely where the real friction lies.

  The Traditionalist argument for MEC collapses if soldiers *can* reliably know the justice of their cause. Walzer's defense of MEC relies heavily on the idea of the "epistemic fog" of war. He argues that expecting a soldier to judge the *jus ad bellum* is unreasonable; they must trust the state.

  The Revisionist argument gains traction as information becomes more transparent. If a soldier can see on their phone that the war is widely condemned as aggressive, the "epistemic fog" argument weakens.

  **The Impasse:** The debate stalls because both sides assume a static epistemic environment.
  *   Traditionalists assume high epistemic costs (soldiers can't know).
  *   Revisionists assume low epistemic costs (soldiers should know).

  If you force the Traditionalist to admit that in 2024 a soldier *can* know the war is unjust, their defense of MEC crumbles. If you force the Revisionist to admit that in 1914 a conscript *could not* know, their demand for individual liability becomes cruel. The debate looks intractable because both sides are arguing from different empirical baselines about the information environment of the soldier.

  ### 4. The Bedrock Intuition: The Nature of the Uniform
  Finally, there is a meta-ethical disagreement about **roles**.
  *   **Revisionist Intuition:** Moral agency cannot be outsourced. I cannot be permitted to kill just because my boss told me to. The uniform is camouflage, not a moral shield.
  *   **Traditionalist Intuition:** Moral agency is mediated by institutions. We live in states, not a state of nature. The uniform represents a transfer of agency from the individual to the collective. To deny MEC is to deny the possibility of a regulated collective violence.

  This is the "bedrock" you suspected. It is a disagreement about whether political membership alters fundamental moral rights.

  ### Diagnosis of the Impasse
  The debate is **70% substantive meta-normative disagreement** and **30% verbal cross-talk.**

  It is **substantive** because they disagree on whether institutional conventions can override individual rights (Consequentialism/Institutionalism vs. Deontological Individualism). They also disagree on the empirical capacity of soldiers to judge their wars.

  It is **verbal** because they use the phrase "Moral Equality of Combatants" to do two different jobs.
  1.  **Descriptive/Moral:** Are the soldiers morally equal? (Revisionist: No.)
  2.  **Prescriptive/Legal:** Should the law treat them equally? (Revisionist: Yes, mostly. Traditionalist: Yes.)

  The frustration in your reading group comes from the fact that the Revisionists often win the moral argument (MEC is false deep down) but concede the legal argument (LOAC should stay the same), while the Traditionalists defend the legal argument by appealing to the moral argument (MEC is true because soldiers aren't responsible). They are talking past each other's conclusions.

  ### What Counts as Progress?
  Given this diagnosis, more theory will not help. You have reached the limit of conceptual analysis. Progress would require one of three moves:

  1.  **Formalizing the Dual-Structure:** Explicitly accept that "Deep Morality" and "Law of War" are separate domains with different rules. Stop trying to make the Law of War mirror Deep Morality perfectly. This is actually where the field is slowly moving (McMahan admits the law shouldn't change; Walzer admits the morality is messy). Progress is admitting the gap is a feature, not a bug.
  2.  **Empirical Epistemology:** Stop assuming what soldiers know. Historians and sociologists need to weigh in. What *can* a soldier know about the *jus ad bellum* at time T? If the empirical data shows soldiers are systematically incapable of judging national policy, the Traditionalist wins. If data shows they are capable, the Revisionist wins. This moves the debate from intuition to evidence.
  3.  **Abandoning "Equality" for "Status":** Reframe the debate. Instead of asking "Are they equal?", ask "What status does the uniform confer?" This bypasses the semantic trap of "equality" and forces a discussion on the specific permissions and liabilities attached to the role of "combatant" regardless of the cause.

  **Summary:** Your hypothesis is the right key. The Revisionists are doing **moral philosophy** (what is true?), and the Traditionalists are doing **political theory** (what is sustainable?). The impasse exists because they keep trying to refute the other's conclusion using their own methodology. The way out is to acknowledge that the "Moral Equality of Combatants" is a legal fiction that is morally false but politically necessary—and then argue about *which* specific fictions are necessary, rather than whether the whole thing is true.
