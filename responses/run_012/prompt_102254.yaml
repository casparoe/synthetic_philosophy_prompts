answer: |-
  Here are three discussion cases designed to isolate the mechanical divergences between the four axiologies.

  **Fixed Parameters for All Cases:**
  *   **Welfare Scale:** Integers. $0$ represents the neutral level (life not worth living vs. not existing). Positive integers are lives worth living.
  *   **Critical-Level ($c$):** Fixed at $5$. (Used for Critical-Level Utilitarianism).
  *   **Lexical Threshold ($H$):** Fixed at $10$. (Used for Lexical Totalism).
  *   **Lexical Tiebreaker:** If populations tie on the count of lives $> H$, Lexical Totalism maximizes the sum of welfare of *all* lives.

  ---

  ### Case 1: The "Repugnant" Divergence
  **Goal:** Total Utilitarianism (TU) prefers the Big/Low population. Average Utilitarianism (AU) and Critical-Level Utilitarianism (CLU) prefer the Small/High population.

  **The Populations:**
  *   **Population A (Small/High):** 10 people, each with welfare **20**.
  *   **Population B (Big/Low):** 100 people, each with welfare **3**.

  **The Analysis:**

  | View | Calculation | Verdict |
  | :--- | :--- | :--- |
  | **Total (TU)** | A: $10 \times 20 = 200$ <br> B: $100 \times 3 = 300$ | **B > A** |
  | **Average (AU)** | A: $200 / 10 = 20$ <br> B: $300 / 100 = 3$ | **A > B** |
  | **Critical (CLU)** | A: $10 \times (20 - 5) = 150$ <br> B: $100 \times (3 - 5) = -200$ | **A > B** |
  | **Lexical (LT)** | A: 10 lives $>10$ <br> B: 0 lives $>10$ | **A > B** |

  **The Feature Doing the Work:**
  *   **Aggregation vs. Dilution/Penalty.** TU is purely additive; it treats welfare as a resource that can be spread thinly across more recipients to increase the total stock. AU and CLU introduce a "quality control" mechanism. AU penalizes the dilution of the mean. CLU penalizes lives that fall below the critical level ($c=5$), treating them as negative contributions to value even though they are positive for the person living them ($3 > 0$).

  **Counterfactual:**
  *   If you remove the **scale difference** (make Population B smaller), TU flips to agree with AU and CLU.
  *   If you raise Population B's welfare to **6** (above $c$), CLU flips to agree with TU (B becomes positive value), though AU still prefers A (6 < 20).

  **The Pushback (from Total Utilitarianism):**
  *   "This case rigs the intuition by relying on the vagueness of 'barely worth living.' Welfare level 3 is explicitly defined as positive. If you accept that a life at 3 is good for the person living it, you must accept that 100 such lives contain more good than 10 lives at 20. The 'Repugnance' is a psychological bias against large numbers, not an axiological error. By prioritizing average quality or an arbitrary critical level, you are implicitly saying that some happy people count for less than others, or that adding happy people can make the world worse."

  ---

  ### Case 2: The "Mere Addition" Divergence
  **Goal:** Average Utilitarianism and Critical-Level Utilitarianism come apart.

  **The Populations:**
  *   **Population A (Excellence):** 10 people, each with welfare **20**.
  *   **Population B (Addition):** 10 people at welfare **20** + 10 people at welfare **10**. (Total 20 people).

  **The Analysis:**

  | View | Calculation | Verdict |
  | :--- | :--- | :--- |
  | **Total (TU)** | A: $200$ <br> B: $200 + 100 = 300$ | **B > A** |
  | **Average (AU)** | A: $20$ <br> B: $300 / 20 = 15$ | **A > B** |
  | **Critical (CLU)** | A: $10 \times (20 - 5) = 150$ <br> B: $150 + 10 \times (10 - 5) = 200$ | **B > A** |
  | **Lexical (LT)** | A: 10 lives $>10$ <br> B: 20 lives $>10$ | **B > A** |

  **The Feature Doing the Work:**
  *   **The Zone Between $c$ and Average.** The added lives in Population B have welfare **10**. This is above the Critical Level ($c=5$), so CLU counts them as positive value additions. However, 10 is below the existing Average ($20$), so AU counts them as drag on the mean. This isolates the specific disagreement space where a life is "good enough to create" (per CLU) but "too mediocre to maintain excellence" (per AU).

  **Counterfactual:**
  *   If you lower the added lives' welfare to **4** (below $c$), CLU flips to agree with AU (both reject the addition).
  *   If you raise the added lives' welfare to **20** (equal to average), AU becomes indifferent (or agrees with B if using strict inequality), aligning with CLU.

  **The Pushback (from Average Utilitarianism):**
  *   "Critical-Level Utilitarianism ignores the context of the existing population. By adding 10 people at level 10, you have transformed a society of high flourishing (level 20) into a society of moderate flourishing (level 15). CLU treats value as atomized—it only looks at the individual's surplus over $c$. But ethics is about the quality of the world we share. Diluting a high-quality culture with mediocre lives reduces the overall normative status of the population, even if the 'sum of surplus' increases. AU captures the intuition that excellence has value beyond mere existence."

  ---

  ### Case 3: The "Lexical Count" Divergence
  **Goal:** Lexical Totalism and Critical-Level Utilitarianism come apart.

  **The Populations:**
  *   **Population A (Many High):** 2 people, each with welfare **11**.
  *   **Population B (One Magnificent):** 1 person with welfare **100**.

  **The Analysis:**

  | View | Calculation | Verdict |
  | :--- | :--- | :--- |
  | **Total (TU)** | A: $22$ <br> B: $100$ | **B > A** |
  | **Average (AU)** | A: $11$ <br> B: $100$ | **B > A** |
  | **Critical (CLU)** | A: $2 \times (11 - 5) = 12$ <br> B: $1 \times (100 - 5) = 95$ | **B > A** |
  | **Lexical (LT)** | A: **2** lives $>10$ <br> B: **1** life $>10$ | **A > B** |

  **The Feature Doing the Work:**
  *   **Cardinality of the Elite vs. Magnitude of Surplus.** Both views agree that lives above $H=10$ are special. CLU treats them as *more valuable* per unit of welfare (shifted sum). LT treats them as *lexically prior* based on their headcount. LT says having two people in the "excellent" category is strictly better than having one, regardless of how much better off the single person is. CLU allows the magnitude of the single person's welfare to outweigh the headcount of the pair.

  **Counterfactual:**
  *   If you raise Population B's welfare to **1,000**, CLU's preference for B strengthens. LT's verdict remains unchanged (1 is still less than 2).
  *   If you add a third person to Population B at welfare **0**, LT still prefers A (Count 2 vs 1). CLU value for B drops but likely remains higher than A unless the negative drag is massive (not possible here since 0 is neutral, but if it were negative welfare, CLU would drop).

  **The Pushback (from Critical-Level Utilitarianism):**
  *   "Lexical Totalism creates a 'tyranny of the threshold.' It implies that once you cross $H=10$, all further welfare gains are secondary to simply getting another person over the line. This leads to absurd trade-offs: you would sacrifice 90 units of welfare from the magnificent life in B to gain 1 unit of welfare for a new person in A (moving them from 9 to 11, or adding a new 11). CLU respects the lexical intuition that high lives matter more, but it retains the rational requirement that value is additive. One life of magnificent depth can outweigh two lives of shallow excellence."

  ---

  ### Instructor's Note on Deployment
  These cases are designed to prevent students from hiding behind "intuition."
  1.  **Case 1** forces the Total Utilitarian to defend the sum over quality.
  2.  **Case 2** forces the Average Utilitarian to defend quality over the creation of clearly good lives.
  3.  **Case 3** forces the Lexical theorist to defend headcount over magnitude.

  In each instance, the "loser" has a coherent axiological response that appeals to the internal consistency of their view (Additivity, Quality, or Magnitude). The pedagogical goal is to show that the "Repugnant Conclusion" is not a bug unique to Totalism, but a feature of how any view handles trade-offs between Scale, Quality, and Thresholds.
