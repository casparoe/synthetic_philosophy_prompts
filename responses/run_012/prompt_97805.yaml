  The blue binder sat on the folding table in the parish hall, its vinyl cover cracked like a dry riverbed. For thirty years, Mrs. Halloway had opened it every Tuesday at ten, assigned the cleaning slots, and locked it away. Under her tenure, the church was immaculate, the flowers never wilted, and no one ever complained about being overworked.

  Father Thomas, newly arrived and eager to optimize, watched her work for a month. He saw her finger trace down the laminated pages, pause, and assign a name. He saw the result: a perfect distribution of labor. The heavy lifting went to the young fathers; the delicate dusting to the elderly widows; the flower arranging to those with a known eye for color.

  "It's pastoral care, isn't it?" Thomas asked one Tuesday, leaning over the table. "You match the task to the person's need."

  Mrs. Halloway didn't look up. Her finger tapped a name. "Mr. Henderson, sanctuary floors. Mrs. Gable, linens."

  "You know who needs the fellowship," Thomas pressed. "Who needs to feel useful. Who needs the quiet."

  "I just go down the list, Father," she said.

  Thomas smiled indulgently. He knew better. A system this efficient couldn't be arbitrary. It required a deep, tacit understanding of the congregation's psychological topology. Halloway was a genius of human resources, masking her insight as bureaucracy.

  When Halloway retired due to a bad hip, Thomas took the binder. He spent a week analyzing the rosters. He cross-referenced assignments with parish records, noting correlations between task types and demographic data. He wrote a twelve-page manual titled *Liturgical Labor & Community Health*. It explained the methodology: *High-exertion tasks are assigned to demographics seeking physical engagement; low-visibility tasks to those seeking contemplative solitude.*

  He called a meeting of the new committee. He distributed the manual. He spoke for twenty minutes about intentionality, about how cleaning the nave was an act of psychological alignment. The committee members nodded, taking notes. They seemed relieved to have a logic for their volunteering.

  "However," Thomas concluded, closing his folder, "the core mechanism remains the Rota. We must honor the sequence."

  He placed the blue binder in the center of the table. It was heavy, authoritative.

  The first Tuesday without Halloway went smoothly. Thomas watched as the new coordinator, a nervous man named Mr. Evans, opened the binder. Evans didn't consult Thomas's manual. He didn't look at the demographic charts. He simply ran his finger down the list, just as Halloway had.

  "Sanctuary floors?" Evans asked, looking at the name below his finger.

  "Yes," Thomas said. "That aligns with the physical engagement protocol."

  "Right," Evans said. He wrote the name down.

  The work got done. The church shone. Thomas felt a swell of pride. His theory was validated. The manual was working.

  A month later, Thomas was in the office late, preparing a sermon. He needed a phone number from the parish archives, which were kept in the same cabinet as the backup rosters. He pulled the wrong file. It was an old attendance ledger from fifteen years ago.

  He flipped through it casually, waiting for the copier to warm up. He stopped at the 'H' section. Henderson.

  He frowned. He walked back to the parish hall. The blue binder was open on the table, left there by Evans. Thomas looked at the current week's assignment.

  *Sanctuary Floors: Henderson, R.*

  Thomas checked the ledger in his hand. *Henderson, Robert.* Deceased 2018.

  He walked back to the hall, the ledger heavy in his hand. He looked at the binder again. The name was clearly printed: *Henderson, R.*

  He went to find Evans. He found him in the supply closet, counting bags of salt for the icy steps.

  "Mr. Evans," Thomas said. "The roster. Henderson. Robert Henderson passed away five years ago."

  Evans didn't stop counting. "Oh, aye. That's his wife."

  "But the manual," Thomas said. "The protocol specifies physical exertion for male demographics aged 40 to 60. Mrs. Henderson is eighty-two."

  "She doesn't do the floors," Evans said. He tossed a bag onto the pile. "Her nephew comes round. Does the heavy stuff. She just signs the sheet."

  "Why?"

  Evans shrugged. "Because the name's there. If we cross it out, the line goes empty. People don't like empty lines. Makes them think no one cares."

  Thomas stood silent. The copier beeped in the distance.

  "But the... the matching," Thomas said. "The psychological alignment."

  "Works well enough," Evans said. He wiped his hands on his trousers. "Mrs. Gable still does the linens. She's gone blind since last year, but her daughter does it. Says her mother likes to feel the fabric. So we keep the name."

  Thomas looked at the blue binder. It sat on the folding table, inert and vinyl-skinned. It had no knowledge of Mrs. Gable's eyesight. It had no record of Robert Henderson's death. It was just a list of names, ordered alphabetically, looping forever.

  "I see," Thomas said.

  "Did you need something else, Father?"

  "No. Just checking the... the methodology."

  "Right," Evans said. He picked up the salt bags. "I'll make sure the nephew knows about the ice. The binder says 'Steps' for next week. I'll tell him."

  Thomas walked back to his office. He picked up his twelve-page manual. He read the first paragraph. *Intentionality is the source of efficacy.*

  He looked out the window. In the churchyard, Mrs. Gable's daughter was hanging the fresh linens on the line, snapping them crisp in the wind. She wasn't looking at the manual. She was looking at the sky, judging the rain. She was working because her name was on a list in a room she hadn't entered in months.

  Thomas placed the manual in the top drawer. He left the blue binder on the table in the hall.

  Later that week, a new family joined the parish. They asked how to volunteer. Thomas pointed them to the hall. "Follow the Rota," he said.

  "Is there a guide?" the father asked. "To know what suits us?"

  "The guide is the list," Thomas said.

  The father nodded, accepting this as wisdom. He went to the hall. He opened the binder. He saw a name crossed out in pencil, a new one written above it in blue ink. He didn't ask why. He took the next slot.

  Thomas watched from the doorway. The father wrote his name down. He didn't know what the task entailed. He didn't know if he was suited for it. He just filled the space.

  Thomas turned away. He needed to write a sermon about humility. He sat at his desk and opened his bible. He read a verse about the stones crying out. He underlined it. He didn't notice he had underlined the same verse three weeks in a row, exactly where the bookmark fell. He told himself it was because the theme was timely. He didn't wonder why the bookmark always landed there. He just began to write.
