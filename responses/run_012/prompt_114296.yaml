prompt: |-
  I'm a second-year student in a political theory course, and for a paper I'm trying to understand a hybrid institution my university's student government adopted last year. The student assembly is chosen by lot from the undergraduate body, with a per-meeting stipend and no term limits, because its members are supposed to be a descriptive sample rather than career politicians. The president and treasurer, by contrast, are elected by the whole student body, receive a monthly salary, and are limited to two consecutive terms. The assembly sets the agenda and can pass resolutions, but the elected officers hold a veto and control the budget. The official rationale was that sortition avoids faction and self-selection, elections preserve accountability for money and administration, term limits prevent entrenchment, and salaries make office accessible to students who cannot afford unpaid work. I can see why each piece was chosen, but I'm puzzled about what picture of democratic representation the whole arrangement presupposes.

  Does it presuppose an epistemic view of democracy, on which ordinary citizens have the competence to deliberate but not to administer, or a trustee model for the elected officers and a delegate model for the sortition assembly, or something else entirely? Which rival views of representation and officeholding does the package quietly rule out, and which parts are merely underdetermined by it? I'm especially interested in whether the term limits and the salaries pull in opposite directions: term limits suggest that holding political office should not be a career, while a salary and a professional staff suggest that it is a job that requires experience. I'd like you to reconstruct the implicit theory as carefully as you can, distinguish what the practice strictly presupposes from what it merely fits well with, and say what would have to change in the institution if we replaced that theory with a straightforwardly participatory one or with a straightforwardly expert-driven one. Please answer in continuous prose, without headings, bullet points, bold text, or tables, the way you would write an email. Be explicit about how confident you are in your reconstruction, tell me where your reasoning is most likely to fail, and say what argument or consideration would lead you to a different verdict about what the practice presupposes.
