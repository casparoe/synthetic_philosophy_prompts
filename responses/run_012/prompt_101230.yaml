prompt: |-
  I am a high school junior currently taking AP Biology, and our evolution unit ended with a class discussion about the units of selection debate—whether natural selection should be understood as acting primarily on genes, on individual organisms, or on groups, and what it even means to call one of those the unit of selection. I do not have a background in philosophy of biology beyond that class, but I have spent a lot of time thinking about group projects, because my school grades them in a way that seems to make the same ambiguity concrete: sometimes the teacher assigns one grade for the whole group, sometimes each student receives an individual grade based on their own contribution, and sometimes peer evaluation redistributes points after the fact. The same project can be described as one group succeeding, as several individuals succeeding, or as certain traits or behaviors succeeding within the group, and the description changes what counts as the relevant unit of reward.

  Could you restate the main positions in the units of selection debate—the gene-centered or gene's-eye view, the individual-organism view, the group-selection view, and any multilevel or pluralist position that tries to hold several levels together—as faithfully as you can in the vocabulary of group-project grading, including group grades, individual grades, peer evaluation, rubrics, free riders, and curves? I am fluent in that vocabulary because I have lived it, so please use it precisely rather than just as decoration. Then give me a residue report: which parts of each biological position translate cleanly into the grading system, which parts can only be carried over with distortion, and which parts have no counterpart at all. I especially want to know whether the residue shows that my grading vocabulary is missing something important about evolution, or whether it shows that the biological debate is less determinate than it first appears.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** High school junior, AP Biology student, no formal philosophy background but deep thinker.
      *   **Topic:** Units of Selection debate (Gene vs. Individual vs. Group vs. Multilevel).
      *   **Analogy:** School group project grading systems (Group grades, Individual grades, Peer evaluation, Rubrics, Free riders, Curves).
      *   **Task 1:** Restate the main biological positions using the grading vocabulary *precisely* (not just decoration).
      *   **Task 2:** Provide a "Residue Report" (What translates cleanly? What distorts? What's missing?).
      *   **Task 3:** Answer the core question: Does the residue show the grading vocabulary is lacking, or that the biological debate is indeterminate?

  2.  **Deconstruct the Biological Positions:**
      *   *Gene-Centered View (Dawkins):* Selection acts on replicators. Organisms are vehicles. Altruism is explained by kin selection/inclusive fitness.
      *   *Individual Organism View (Classical Darwinism):* Selection acts on the phenotype of the individual. Survival/reproduction of the organism is the metric.
      *   *Group Selection (Naive vs. MLS):* Selection acts on groups. Groups with more cooperators outcompete groups with fewer. Problem: Free riders within groups.
      *   *Multilevel Selection (MLS/Pluralism):* Selection happens simultaneously at multiple levels. Conflict between levels is real.

  3.  **Map to Grading Vocabulary:**
      *   *Gene:* Specific behaviors/skills/contributions (e.g., "the slide designer," "the researcher").
      *   *Individual Organism:* The student.
      *   *Group:* The project team.
      *   *Fitness:* The grade (GPA impact, college admissions).
      *   *Replication:* Passing on the strategy (doing the same thing in the next project/getting recommended for the next team).
      *   *Free Rider:* The student who does no work but gets the group grade.
      *   *Peer Evaluation:* Mechanism to adjust individual fitness based on contribution within a group context.
      *   *Curve:* Competition for limited rewards (zero-sum aspect).

  4.  **Drafting the Restatements (Iterative Process):**

      *   *Gene-Centered:* Focus on the *strategy* of working. If "doing all the work" leads to your specific skills being recognized and you being picked for better teams next time, that strategy replicates. Even if you get a bad grade now, if your reputation (gene) gets you into an honors class (replication), it wins. *Correction:* It's about the *trait* persisting. If "being a hard worker" spreads through the class because hard workers get picked for teams, that's gene selection.
      *   *Individual:* The student wants the best GPA. If helping the group hurts my grade (time cost), I shouldn't do it. If hurting the group helps my grade (curve), I might do it.
      *   *Group:* The teacher grades the *project*. If Team A gets an A and Team B gets a C, Team A's *way of working* wins. Even if a slacker in Team A got an A, the *group structure* succeeded.
      *   *Multilevel:* Tension. I want an A (individual), but the teacher wants collaboration (group). Peer eval balances this.

  5.  **Developing the Residue Report:**
      *   *Clean Translations:* Free rider problem is perfect for group selection. Individual grades map to organismal fitness.
      *   *Distortions:* Biological reproduction isn't zero-sum like a curve (usually). Grades are intentional (teleological), evolution is not.
      *   *Missing:* Heritability is weak in classrooms (you don't literally reproduce your study habits into new students). Death/Elimination is missing (you don't get kicked out of school for a C). Time scale is too short.

  6.  **Addressing the Core Question (Determinacy vs. Vocabulary Limit):**
      *   The analogy reveals that "Unit of Selection" is often about *accounting*. Who gets the credit?
      *   In biology, it's about *causality* and *replication*.
      *   The grading system is designed by a teacher (intelligent designer). Evolution has no teacher. This is the biggest gap.
      *   Conclusion: The debate is less about "what is *really* happening" and more about "what level of accounting is most useful." The grading analogy supports the Pluralist/MLS view because different grading schemes highlight different incentives.

  7.  **Refining the Tone:**
      *   Respectful of the student's intelligence.
      *   Precise with biological terms (fitness, heritability, replication).
      *   Precise with grading terms (rubrics, curves, peer eval).
      *   Avoid condescension.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain Kin Selection in grading terms? *Idea:* Friends picking friends for teams.
      *   *Check:* Did I distinguish Naive Group Selection from MLS? *Idea:* Naive = "Group grade always good." MLS = "Group grade vs. Individual grade tension."
      *   *Check:* Is the "Residue Report" clear? *Structure:* Clean, Distorted, Missing.
      *   *Check:* Did I answer the final prompt about determinacy? *Yes, focus on the accounting nature of the debate.*

  9.  **Final Polish:** Ensure the distinction between *replicator* (gene/strategy) and *vehicle* (student/group) is clear in the grading analogy. (e.g., The student is the vehicle for the "study strategy").

  *(Self-Correction on Gene-Centered View)*: Be careful not to say the gene is the *grade*. The gene is the *instruction set* for how to behave in a group. The grade is the *fitness outcome*. If the instruction "always do all the work" leads to that instruction being adopted by others (because they see it works), it spreads. But in school, strategies don't biologically replicate. I need to frame "replication" as "adoption of strategy by others" or "being selected for future teams." Let's go with "being selected for future teams" as the proxy for replication.

