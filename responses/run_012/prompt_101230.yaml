answer: |-
  This is a remarkably sharp analogy. You have intuitively grasped why the units of selection debate is often less about *what exists* (genes, organisms, and groups all exist) and more about *accounting* (where do we credit the success?).

  Here is the restatement of the biological positions using your grading vocabulary, followed by the residue report.

  ### Part 1: The Units of Selection Debate in Grading Vocabulary

  **1. The Gene-Centered View (The "Strategy" View)**
  *   **The Biological Claim:** Genes are the only things that replicate faithfully. Organisms are temporary vehicles. A trait spreads if the *gene* for it increases its own frequency in the next generation, even if it hurts the individual organism (e.g., altruism).
  *   **The Grading Translation:** The "unit" is not the student, but the **specific work strategy** (e.g., "making the slides," "editing the text," "doing the research").
  *   **How Selection Works:** Imagine a semester where students are reshuffled into new groups for every project. If the strategy "always volunteer to edit" gets you picked for the best teams in the next round, that *strategy* replicates through the class population, even if you personally burn out and get a B.
  *   **The Metric:** Success isn't your GPA (individual fitness); it's whether your specific *mode of contribution* becomes the standard behavior in the class next year.
  *   **Free Riders:** A free rider is a student who gets the group grade without adopting the successful strategies. In the gene view, they are a "parasitic strategy." If the class adopts the free-rider strategy, the whole system collapses, so the "hard work strategy" must protect itself (e.g., by only working with kin/friends).

  **2. The Individual Organism View (The "GPA" View)**
  *   **The Biological Claim:** Natural selection acts on the phenotype of the individual. The organism is the cohesive unit that survives or dies. Altruism is only explainable if it benefits the individual's long-term survival or reproduction.
  *   **The Grading Translation:** The **student** is the unit. The **GPA** is fitness.
  *   **How Selection Works:** You evaluate every group task based on: "Does this maximize *my* grade?" If a group grade hurts your GPA because you did all the work while others slept, selection pressures you to stop doing that work. If a curve is used, you might actively sabotage the group to ensure you rank higher than your peers.
  *   **The Metric:** Individual transcript success.
  *   **Free Riders:** Free riders are a threat to *your* fitness. You evolve defenses (complaints to the teacher, refusing to work) to prevent your grade from being diluted by their lack of contribution.

  **3. The Group Selection View (The "Team Grade" View)**
  *   **The Biological Claim:** Groups compete against other groups. A group of cooperators will outcompete a group of selfish individuals, even if selfish individuals win *within* the group.
  *   **The Grading Translation:** The **project team** is the unit. The **group grade** is fitness.
  *   **How Selection Works:** The teacher pits Team A against Team B. Team A shares work equally; Team B has one star and three slackers. Team A produces a better project and gets an A; Team B gets a C. Over the semester, "Team A-style structures" dominate the class honors, even if the star student in Team B got a slightly higher individual score than any single member of Team A.
  *   **The Metric:** The average success of the team structure.
  *   **Free Riders:** Free riders are a cancer to the group's fitness. For group selection to work, the teacher must penalize the whole group enough that groups with free riders go extinct (fail the class) before the free riders can spread.

  **4. Multilevel Selection / Pluralism (The "Rubric + Peer Eval" View)**
  *   **The Biological Claim:** Selection acts simultaneously at multiple levels. There is a constant tug-of-war: genes compete within organisms, organisms compete within groups, groups compete within populations.
  *   **The Grading Translation:** The grading system explicitly acknowledges **conflicting incentives**.
  *   **How Selection Works:** The teacher assigns a **Group Grade** (selecting for cooperation) *AND* an **Individual Grade** (selecting for competence) *AND* uses **Peer Evaluation** to redistribute points (selecting against free riders).
  *   **The Metric:** A weighted composite. You are selected to be a good individual *and* a good teammate.
  *   **Free Riders:** Peer evaluation is the mechanism that resolves the conflict. It allows the group to succeed (Group Grade) while punishing the specific individuals who didn't contribute (Individual adjustment), acknowledging that selection is happening at both levels at once.

  ***

  ### Part 2: Residue Report

  This section analyzes where the analogy holds, where it bends, and where it breaks.

  #### 1. Clean Translations (High Fidelity)
  *   **The Free Rider Problem:** This translates perfectly. In biology, a "selfish gene" that benefits the individual but harms the group is analogous to the student who hogs the credit. The tension between "Group Grade" (Group Selection) and "Individual Grade" (Individual Selection) captures the exact mathematical problem of altruism.
  *   **The Accounting Problem:** The debate in biology is often about where to draw the bookkeeping lines. Your grading analogy reveals that "Unit of Selection" is often just a question of "Who gets the credit on the transcript?" This faithfully mirrors the philosophical argument that units of selection are defined by how we measure fitness.
  *   **Conflict Between Levels:** The stress you feel when a group grade threatens your GPA is a genuine phenomenological match for the evolutionary conflict between individual and group selection. The tension is real in both systems.

  #### 2. Distorted Translations (Requires Stretching)
  *   **Replication vs. Reputation:** In the Gene-Centered view, genes literally copy themselves into new bodies. In your analogy, a "work strategy" only replicates if other students *copy* you or if you are *picked* for future teams. This is cultural evolution, not biological evolution. The "inheritance" mechanism is weak in school; you don't literally spawn new students with your work habits.
  *   **The Curve (Zero-Sum vs. Positive-Sum):** Biological fitness is often relative (you just need to survive better than the predator), but it isn't strictly zero-sum. In a graded curve, for you to win, someone else *must* lose. This distorts the Individual Organism view. In nature, two organisms can both have high fitness; in a curve, only one gets the A. This makes school selection more ruthless and competitive than natural selection usually is.
  *   **Intentionality:** Students *choose* to free-ride or work hard based on reasoning. Genes do not choose; they are blindly selected. This distorts the *cause* of the selection. In class, the "selection pressure" is the teacher's policy, which is designed with a goal. In nature, there is no teacher designing the rubric.

  #### 3. Missing Counterparts (The Analogy Breaks)
  *   **Death and Elimination:** In biology, low fitness means you leave no offspring (evolutionary death). In school, a low grade rarely means you are removed from the population (expelled). The stakes of "selection" are vastly different. Without elimination, selection is just "ranking," not "evolution."
  *   **Blind Variation:** In your class, you can sit down and *invent* a new study strategy. In evolution, variation arises randomly (mutation). The grading system assumes intelligent agents optimizing for a goal; evolution assumes blind processes filtering for survival.
  *   **Heritability:** This is the biggest gap. For selection to work, traits must be passed down. In your class, if you get an A, your "A-ness" doesn't pass to your children or even necessarily to your teammates. Without strong heritability, the "Unit of Selection" debate in school is just about *reward distribution*, whereas in biology, it is about *lineage persistence*.

  ***

  ### Part 3: Conclusion on Determinacy

  You asked whether this residue shows your grading vocabulary is missing something important, or whether the biological debate is less determinate than it appears.

  **The residue suggests the biological debate is less determinate than it first appears.**

  Here is why: Your experience with group projects reveals that "Who is the unit?" is often a policy decision made by the teacher (the environment), not an intrinsic property of the students.
  *   If the teacher weights the **Group Grade** heavily, the **Group** becomes the effective unit of selection.
  *   If the teacher weights **Peer Eval** heavily, the **Individual** becomes the unit.
  *   If the teacher looks for specific skills to recruit for AP next year, the **Trait/Strategy** becomes the unit.

  In biology, there is no "Teacher" deciding the rubric. However, the *environment* acts as the rubric. The "Units of Selection" debate in biology is often a debate about which level of the hierarchy is currently being weighted most heavily by the environment.

  **What your vocabulary is missing:**
  Your grading vocabulary misses **Time** and **Heredity**. Because you don't biologically reproduce your study habits, the "selection" in your class is static. It sorts existing students; it doesn't change the composition of the student body over generations.

  **Final Verdict:**
  Your analogy successfully demystifies the philosophy. It shows that the "Unit of Selection" is not a physical object like a nucleus or a cell. It is an **accounting identity**. It depends on where the reward (fitness) is deposited and how that reward is transmitted to the next round.

  The debate persists in biology not because biologists are confused, but because nature, like your teacher, sometimes grades on a curve, sometimes grades on group output, and sometimes grades on individual merit. The "Unit" changes depending on the rubric of the environment. Your frustration with group projects is not just social stress; it is the exact feeling of an organism caught in a Multilevel Selection conflict.
