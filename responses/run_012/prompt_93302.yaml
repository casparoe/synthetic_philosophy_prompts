      *   *Check:* Did I address the "idealization" point? M needs to admit that claiming humans are machines requires assuming humans are consistent, which is unproven.
      *   *Check:* Did I address the "soundness" point? AM needs to admit she can't prove her own soundness.
      *   *Tone:* Avoid "You're wrong." Use "Here's the cost of your position."

  6.  **Writing - Section by Section (Mental or Scratchpad):**
