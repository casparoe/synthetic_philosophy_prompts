  4.  **Step-by-Step Dialogue Plan:**
      *   **Opening:** AM states the case: $S$ fails on $G$, I see $G$, I'm not $S$.
      *   **M's Pushback:** You only see $G$ if you know $S$ is consistent. How do you know that?
