answer: |-
  This is a fantastic question to bring to a seminar. You have correctly identified the surface-level tension, but you are right to suspect there is something deeper going on than just "perfect predictors make you doomed."

  The "Death in Damascus" problem (originally formulated by Allan Gibbard and William Harper in 1978) is not primarily about survival odds. It is a stress test for the **logic of deliberation**.

  Here is a breakdown of why this paradox matters, why your intuition about EDT and CDT is partially right but misses the technical crux, and how to frame this for your seminar.

  ### 1. The "You're Doomed Anyway" Objection
  You asked: *"Doesn't this just show that if a perfect predictor exists, you're doomed no matter what, so the rational thing is to just pick arbitrarily?"*

  **The Seminar Answer:**
  If we treat this purely as a survival game with a metaphysically infallible predictor, you are correct: your expected utility is 0 regardless of your choice. However, decision theory isn't just about outcomes; it's about **decision rules**. We use thought experiments to see which decision rule produces coherent reasoning.

  If a decision theory tells you to do $X$, but the moment you decide to do $X$, the theory tells you that you *should have done* $Y$, that theory is **deliberatively unstable**. The paradox shows that standard decision theories can lead to infinite loops of reasoning where an agent can never actually make a decision.

  ### 2. The Problem for Evidential Decision Theory (EDT)
  You wrote: *"Evidential decision theory would say: staying is evidence that Death is in Damascus, so you should flee... That's unstable."*

  You are exactly right about the instability. This is the core technical objection to EDT in this scenario.

  *   **The EDT Calculation:** EDT maximizes expected utility based on conditional probabilities: $P(\text{State} | \text{Action})$.
  *   **The Loop:**
      1.  If I lean toward **Staying**, I must update my belief: "Since Death is a perfect predictor, if I stay, Death is in Damascus."
      2.  Given Death is in Damascus, the expected utility of Staying is 0 (Death). The expected utility of Fleeing is 1 (Life).
      3.  So, EDT says: **Flee.**
      4.  But if I lean toward **Fleeing**, I update: "If I flee, Death is in Aleppo."
      5.  Given Death is in Aleppo, the expected utility of Fleeing is 0 (Death). The expected utility of Staying is 1 (Life).
      6.  So, EDT says: **Stay.**

  **The Deep Issue:** This isn't just that EDT "can't handle predictors." It's that EDT violates the principle of **Ratifiability**. A decision is ratifiable if, once you have decided to do it, you do not regret that decision given the information that you decided it. In Death in Damascus, **no pure strategy is ratifiable for EDT.** You can never settle. For a seminar, this is the key takeaway for EDT: *It creates deliberative dynamics that prevent action.*

  ### 3. The Problem for Causal Decision Theory (CDT)
  You wrote: *"I've heard people say that in Death in Damascus, causal decision theory says you should just randomize, but I don't see how randomizing helps if Death predicted your randomization."*

  This is the trickiest part, and your skepticism is warranted.

  **The CDT Logic:**
  CDT says you should ignore the evidential correlation and look only at causal impact. Your choice today does not *cause* Death's location yesterday (or whenever the prediction was made).
  *   Therefore, $P(\text{Death in Damascus})$ is fixed independent of your action.
  *   If you believe Death is 50/50 likely to be in either city, CDT says Stay and Flee have equal expected utility. You are indifferent.

  **Why Randomize? (The Ratifiability Defense)**
  Since CDT says you are indifferent between Stay and Flee, you are permitted to mix strategies. But why *should* you?
  Proponents of CDT (like Brian Skyrms) argue that while pure strategies (Stay or Flee) are **unratifiable** (as shown in the EDT section above), a **mixed strategy (50/50 Randomization) *is* ratifiable.**

  *   **The Reasoning:** If I decide to flip a coin, I believe Death predicted "The agent will flip a coin."
  *   Death must choose a location *before* the coin lands. Death chooses Damascus.
  *   Given Death is in Damascus, what is my best move?
      *   If I switch to "Stay" (pure), Death predicted that, and I die.
      *   If I stick with "Flip Coin," I have a 50% chance of landing in Aleppo (Life).
  *   Therefore, once I decide to randomize, I have no incentive to switch to a pure strategy. The mixed strategy is stable.

  **Your Objection (The Perfect Predictor):**
  You asked: *"What if Death predicted the randomization outcome?"*
  If Death predicts the *outcome* of the coin flip (e.g., Death knows it will land Heads/Aleppo), then randomization does not help. You die.
  However, in the standard philosophical framing, the predictor predicts your **decision algorithm**, not necessarily the output of a truly indeterministic quantum coin flip made *after* the prediction. If the predictor knows you will use a 50/50 algorithm, they still have to pick one city to be in. They can't be in both. Thus, the 50/50 strategy gives you a 50% survival rate, whereas a pure strategy gives you 0%.

  ### 4. The "Deeper Issue": Logic vs. Causation
  You asked: *"Is the real issue that evidential decision theory can't handle perfect predictors, or is there something deeper about causation and correlation that I'm missing?"*

  It is the latter. The deep issue is **Logical Correlation without Causal Connection.**

  *   **EDT** treats the correlation as relevant (because your action is *evidence* of Death's location). It fails because it treats the decision as *news* that updates the probability of a fixed past event, leading to the loop.
  *   **CDT** treats the correlation as irrelevant (because your action doesn't *cause* Death's location). It fails (arguably) because it ignores that your decision process is *logically linked* to the prediction. If you are a rational agent, your decision is the output of an algorithm. Death predicted the output of that algorithm. Therefore, your decision is logically constrained by the prediction, even if not causally constrained.

  **The Modern Solution (For Seminar Bonus Points):**
  This paradox is one of the main motivators for **Functional Decision Theory (FDT)** or **Timeless Decision Theory (TDT)** (developed by Yudkowsky, Soares, etc.).
  *   These theories argue that you should not ask "What does my action cause?" (CDT) or "What does my action evidence?" (EDT).
  *   You should ask: "What output of my **decision function** yields the best result?"
  *   Since Death predicted the output of your decision function, your decision function and Death's location are logically linked.
  *   FDT says: "If my function outputs 'Stay', Death is in Damascus. If my function outputs 'Flee', Death is in Aleppo. If my function outputs 'Randomize', Death predicts the distribution."
  *   FDT agrees with the CDT "randomization" conclusion but for a different reason: It recognizes the **logical subjunctive dependence** between your algorithm and the prediction.

  ### Summary for Your Seminar
  1.  **Don't get bogged down in survival:** The point isn't that you die; it's that standard theories struggle to tell you *how to decide*.
  2.  **EDT's Failure:** It leads to **deliberative instability**. You can never settle on a choice because the act of preferring one option makes it the wrong one.
  3.  **CDT's Nuance:** It suggests **randomization** not because it changes the past, but because a mixed strategy is the only **ratifiable** decision (you won't regret it once you've made it).
  4.  **The Core Philosophical Conflict:** The paradox exposes the gap between **causal independence** (my choice doesn't move Death) and **logical dependence** (my choice algorithm is what Death predicted).

  If you want to spark a debate, ask the room: *"If you know Death is a perfect predictor, is it rational to pay a small fee to replace your brain with a random number generator before you decide?"* (CDT says no, FDT says yes). That usually gets things moving!
