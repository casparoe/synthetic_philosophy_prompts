      *   *Nuance:* The paradox isn't about survival (since survival probability might be 0 with a perfect predictor). It's about *which decision rule* makes sense. If survival is impossible, all decisions have equal expected utility (0). But usually, the problem is framed where the predictor is *reliable* but not necessarily metaphysically infallible in a way that precludes agency, or we are looking at the *process* of deliberation.
      *   *Better framing:* The issue is about *deliberative stability*. Can you reach a state where you decide to do X and believe X is the best choice?

