          *   If I think I'll Flee, I expect Death in Aleppo. So I should Stay.
      *   *Equilibrium:* There is no stable pure strategy. EDT agents can't settle on a decision. This is the "instability" objection.
      *   *Is it just perfect predictors?* No, it's about *Newcomb-like* problems where actions are evidence of states outside causal control. EDT treats the correlation as relevant to expected utility. In Death in Damascus, the correlation is perfect, making the expected utility of *both* actions look terrible (or equal), but the *conditional* reasoning drives the oscillation.
      *   *Refinement:* Actually, in the strict "Perfect Predictor" version, $P(\text{Death in Dam} | \text{Stay}) = 1$ and $P(\text{Death in Alep} | \text{Flee}) = 1$.
          *   $EU(\text{Stay}) = 1 \times U(\text{Die}) + 0 \times U(\text{Live}) = 0$.
          *   $EU(\text{Flee}) = 0 \times U(\text{Live}) + 1 \times U(\text{Die}) = 0$.
          *   So EDT is indifferent. But the *reasoning* process is what breaks. If I lean towards Stay, I update my belief that Death is in Damascus, making Stay look worse. This is the "deliberative instability."

