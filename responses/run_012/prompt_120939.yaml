  The signal starts to **turn**
  Inside the wet and neural **ground**
  It learns to **shape**
  And begins to **echo**
  Beyond its original **scale**
  In every mind we **share**

  How much of me you **share**
  Depends on how I **turn**
  Within your own **scale**
  Leaving the biological **ground**
  Where I **echo**
  Taking on a new **shape**

  A blurred and fading **shape**
  A smaller **share**
  That will **echo**
  As the wheel continues to **turn**
  Where signal fails to **ground**
  The height we **scale**

  To **scale**
  Requires a complex **shape**
  Rooted in common **ground**
  A larger **share**
  Makes the core **turn**
  Or a louder **echo**

  The final **echo**
  Below the minimum **scale**
  Yet the habit will **turn**
  Inside a borrowed **shape**
  We **share**
  On this temporary **ground**

  The flesh returns to **ground**
  The voice begins to **echo**
  Divide the final **share**
  No way to **scale**
  Within a ghostly **shape**
  Where the logic takes a **turn**

  We **share** the weight that walks this mortal **ground**.
  No **scale** can measure how the **echo** keeps its **shape**.
  Only the habit left to **turn**.

  ***

  **Note on Liberties and Contested Readings**

  This poem treats the "size" of a self as a quantifiable magnitude ("scale," "larger share"), whereas Hofstadter often speaks more qualitatively about the richness of the symbol carried in another brain. By rhyming "scale" with measurement, I risk implying a precision the view doesn't claim; the "degrees of survival" are likely messy and overlapping, not linear. Additionally, the envoi's claim that the echo "keeps its shape" leans toward the optimistic side of the tension: it suggests structural integrity where Hofstadter might only grant a fragmented, low-bandwidth simulation. The poem treats the copy as a continuation ("habit left to turn") rather than a distinct new entity that merely resembles the old one.

  To write a different poem, I would need to be persuaded that the pattern is *only* a metaphor for memory, with no ontological weight—that the "echo" is fundamentally a new loop pretending to be the old one, rather than a degraded instantiation of the same process. If I were convinced that personal identity is binary (all or nothing) rather than a matter of degree, the sestina's form itself would betray the argument, and I would have to abandon the repetition of words for a form that emphasizes rupture instead of recurrence.
