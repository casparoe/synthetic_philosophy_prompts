  Her verdict: Save the single passenger. The two-day loss constitutes a stronger individual complaint than a forty-minute wait, regardless of how many share the latter.

  Her track record supports **Strict Individualism**: compare the strongest individual complaint on each side; numbers never aggregate. This fits all prior cases. In (1), (2), and (4), single serious/moderate burdens trumped numerous trivial ones. In (3), a stronger serious burden (blindness) trumped weaker serious burdens (damaged hands), ignoring the headcount.

  The **Two-Tier** and **Same-Kind** readings predict sacrificing the passenger. Both allow pooling trivial/same-kind burdens. The Same-Kind rule treats time losses as comparable units; since total wait time (7.6 years) exceeds total lost time (2 days), it mandates sacrificing the one. The Two-Tier rule allows pooling "small" burdens; if 40 minutes counts as small, the sum outweighs the individual loss.

  I bet on **Strict Individualism**. Her explicit methodological commitment—that the unit of justification is the *single person's* complaint "rather than the sum"—is a direct repudiation of pooling. Scanlonians typically reject aggregation to protect individuals from being overridden by collective trivialities. While counterintuitive here, consistency with her prior emphasis demands ignoring the multiplier.

  To separate Strict Individualism from a Two-Tier threshold view, propose: **One person dies vs. one million people suffer a barely perceptible itch.** Strict Individualism saves the life (death > itch individually). A Two-Tier view might sacrifice the life if the threshold allows sufficient pooling of trivialities. This tests where she draws the "serious/small" line. For the Two-Tier view to hold, she must commit to a threshold where burdens below a certain intensity (e.g., mere inconvenience) become aggregable, while burdens above it (e.g., disability) remain individual. The airport case tests whether 40 minutes crosses that threshold; if she saves the passenger, 40 minutes is either "serious" or aggregation is dead.
