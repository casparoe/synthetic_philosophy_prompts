prompt: |-
  I'm putting together the final for a grad seminar I'm teaching on divine foreknowledge and human freedom, and I want one essay question on Molinism that I can actually grade. The problem is that every question I draft gets answered with the same three-moments-of-divine-knowledge recitation plus a paragraph on the grounding objection, and then a shrug. I want something that forces them to take a position on the *order of explanation* problem and defend it, not just name the standard replies.

  Here's the setup I want you to build the question around. A student in the seminar last week floated this defense of Molinism, and I honestly couldn't tell on my feet whether it was clever or just confused: "Counterfactuals of freedom don't need a truthmaker down in the creature at all. They're true because God, in knowing them, perfectly grasps how the possible creature would freely act. The truth is logically prior to the decree, sure, but epistemically it's nothing more than God's exhaustive grasp of the creature's own free nature. So the grounding objection is a non-starter -- it begs the question by assuming every contingent truth needs a worldly ground, when here the ground is just the divine intellect's grasp of a possible creature." I want the exam question to make them assess *that* move specifically.

  So please write me: (1) the essay question itself, pitched so a strong grad student could answer it in about 90 minutes, and framed so that it's unanswerable by summarizing Molina or listing the standard objections -- it has to turn on whether the student's defense succeeds or collapses; (2) a model answer of roughly 600-700 words that actually takes a side and shows the reasoning, including where the defense has to bite a bullet; and (3) a marking scheme totaling 25 points, with the specific must-hit moves named (so I can separate an A from a B), the points each is worth, and a one-line note for each on how students typically get it wrong. Take on the role of a philosopher of religion who knows this literature cold and thinks carefully about where the dialectic actually turns -- don't hedge everything into "some say, others say." I don't want any citations, reading lists, or references to specific papers; the students can't look anything up, and neither can whatever model ends up drafting answers to this thing, so keep it self-contained.
