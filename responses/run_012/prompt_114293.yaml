      *   **Learning Objectives:** The infinite regress of who decides the franchise, the "all affected interests" problem (boundary expands infinitely), self-entrenchment/power preservation, recurrence in ongoing politics (immigration, secession).
      *   **Required Add-ons:** Honest note on predictable failures & fixes, frank statement on limitations (what can't be simulated), flagging consensus vs. contested claims in debrief.
      *   **Constraints:** Under 1,000 words, headings/bullets okay, American English.

  2.  **Evaluate the User's Sketch:**
      *   It's actually quite strong. It captures the core "boundary problem" (Who decides who decides?).
      *   *Critique:* It might be too complex for 75 minutes with 14 people if there are 5 substantive decisions *plus* franchise negotiations *plus* secession. Grad students will theorize too much and not vote.
      *   *Adjustment:* Simplify the substantive votes. Focus heavily on the *constitutive* vote (who votes). The "self-swamping" mechanic is crucial. The entrenchment clause is good for the "dead hand of the past" lesson.
      *   *Time Management:* 75 minutes is tight. 10 min intro, 40 min sim, 25 min debrief.

  3.  **Drafting the Activity Design:**
      *   *Title:* The Boundary Problem Simulation.
      *   *Setup:* Keep the user's delta scenario. It's concrete.
      *   *Roles:* Distribute cards immediately.
      *   *Phase 1 (The Constitutive Rule):* Who votes on Phase 2? This is the crux.
      *   *Phase 2 (The Substance):* One or two big votes (Dam vs. No Dam).
      *   *Phase 3 (The Exit):* Secession attempt.
      *   *Debrief:* Map to theory.

  4.  **Drafting the "What Will Go Wrong" Section:**
      *   *Problem 1:* Endless procedural debate. They are grad students; they love procedure.
      *   *Fix:* Impose hard time limits. Act as a "clock" not a facilitator.
      *   *Problem 2:* The "All Affected" trap. They might try to invite everyone.
