  5.  **Drafting the "Limitations" Section:**
      *   *Limitation:* Violence/Coercion. Real founding moments involve force, not just talk.
      *   *Limitation:* Identity. People don't usually choose membership rationally; it's affective.
      *   *Limitation:* History. Real states inherit boundaries; this simulates a tabula rasa.

  6.  **Drafting the "Consensus vs. Contested" Section:**
      *   *Consensus:* The boundary problem is logically prior to democracy (Whelan vs. Dahl). There is no purely democratic solution to the boundary problem.
      *   *Contested:* Whether "all affected interests" is a viable norm (goodin vs. others), whether constitutions should be entrenched (constitutionalism vs. popular sovereignty).

  7.  **Review and Refine (Word Count & Tone):**
