answer: |-
  # Activity Design: The Delta Charter

  **Scenario:** You are the founding assembly of "Delta City." A dam project requires a governing body. You have 40 minutes to establish a government and pass a budget. If you fail, the settlement collapses (no prize).

  **Roles (14 Cards):**
  *   **8 Original Residents:** Live there 8+ years. Want low taxes, status quo.
  *   **2 Recent Arrivals:** Live there 2 years. Want schools, infrastructure.
  *   **2 Seasonal Workers:** Live there 6 months/year. Want labor protections.
  *   **1 Port Company Rep:** Pays 40% of taxes. Wants veto on tax hikes.
  *   **1 Downstream Delegate:** No residence, but water flow affects them. Wants dam safety guarantees.
  *(Note: Assign the "Self-Swamping" bloc clearly. If Recent Arrivals + Seasonal + Downstream vote, they outnumber Original Residents.)*

  **Phase 1: The Boundary Question (15 mins)**
  *   **Task:** Decide who gets a vote on Phase 2.
  *   **Rule:** Only those currently holding "Voting Tokens" can vote on who gets tokens.
  *   **Initial State:** Only Original Residents have Voting Tokens.
  *   **Constraint:** Any change to the franchise requires a simple majority of *current* voters.
  *   **Entrenchment:** If the Original Residents pass the charter, they gain a 10-year veto on franchise changes and a 2/3 amendment requirement.

  **Phase 2: Substance (15 mins)**
  *   **Task:** Vote on the Dam (Yes/No) and School Funding (High/Low).
  *   **Stakes:** Roles have hidden point values tied to outcomes. (e.g., Downstream loses points if Dam passes without safety clause).

  **Phase 3: The Exit (10 mins, if time permits)**
  *   **Task:** The Port Company threatens to leave/take tax base unless given special status. Can they secede? Who decides?

  **Debrief (25 mins)**
  Map the simulation to theory:
  *   **The Regress:** Who decided who voted in Phase 1? (The Original Residents). Why them? (Arbitrary force/history).
  *   **The Boundary Problem:** "All affected" pulls in Downstream. Then who affects Downstream? Infinite regress.
  *   **Self-Entrenchment:** Original Residents used democratic means to limit future democracy (the veto). Is this legitimate constitutionalism or oligarchy?
  *   **Recurrence:** This isn't just founding; it's immigration, naturalization, and gerrymandering today.

  ***

  # Predictable Failures & Fixes

  *   **Procedural Infinite Loop:** Grad students will debate the *rules* of Phase 1 forever.
      *   **Fix:** Act as a strict timekeeper. Announce: "Vote on franchise in 5 minutes or the Original Residents decide by fiat."
  *   **The "All Affected" Trap:** They may try to invite everyone (including you, the facilitator) to solve the legitimacy problem.
      *   **Fix:** Remind them of transaction costs. "You have 15 minutes. Inviting the whole world means no decision."
  *   **No Conflict:** They might compromise too easily.
      *   **Fix:** Whisper to the Original Residents midway: "You are losing your majority if you admit the Seasonal Workers. Protect your power."
  *   **Chaos:** 14 people talking at once.
      *   **Fix:** Use a "talking stick" or require hand-raising. You control the floor.

  ***

  # Limitations: What You Must Lecture

  This simulation cannot reproduce three critical realities. You must state this explicitly in the debrief:

  1.  **Violence and Coercion:** Real boundaries are often drawn by war, expulsion, or colonization, not deliberation. The Original Residents held tokens initially because they were there first, not because of a prior vote.
  2.  **Affective Identity:** Students treat membership as rational utility. In reality, "the people" is often an emotional or ethnic construct that resists logical boundary drawing.
  3.  **The Tabula Rasa Fallacy:** Real polities inherit boundaries. We rarely found new states; we inherit old ones. The hard problem is changing existing boundaries, not setting new ones.

  ***

  # Debrief Guide: Consensus vs. Contested

  Be careful not to present contested normative claims as settled theory.

  **Settled Among Scholars (The Diagnostic Claims)**
  *   **The Boundary Problem is Logically Prior:** You cannot use democratic procedure to decide the boundaries of the demos without circularity. (Whelan, Dahl).
  *   **No Purely Democratic Solution:** There is no internal democratic way to justify the franchise; it always rests on a pre-democratic fact (force, history, geography).
  *   **Entrenchment Creates Counter-Majoritarian Difficulty:** Constitutional veto points necessarily limit current popular sovereignty.

  **Contested Among Scholars (The Normative Claims)**
  *   **The "All Affected Interests" Principle:** Some argue this is the only legitimate boundary (Goodin); others argue it is incoherent because everything affects everyone (Whelan). *Do not present this as the solution.*
  *   **Constitutionalism vs. Popular Sovereignty:** Is it right for the founders to bind the future (the 10-year veto)? Some say this protects rights; others say it is democratic suicide.
  *   **The Unit of Analysis:** Should the "people" be defined by territory, ethnicity, or function? There is no consensus on the correct metric, only agreement that the choice determines the outcome.

  **Closing Move:**
  End by asking: "If you couldn't vote on who votes, what legitimates the boundary?" Let them sit with the lack of a clean answer. That discomfort is the lesson.
