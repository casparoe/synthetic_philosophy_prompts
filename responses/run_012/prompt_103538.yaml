answer: |-
  To deploy "costly signaling" rigorously in arguments about effective-altruism (EA) pledges, luxury watches, or unpaid internships, you need a framework that distinguishes evolutionary biology from sociological speculation. Below is the scorecard of desiderata for an adequate theory of costly signaling.

  ### I. Core Desiderata (The Physics of Signaling)
  *These requirements define the mechanism. If a theory violates these, it is not a theory of costly signaling.*

  **1. The Differential Cost Condition [NON-NEGOTIABLE]**
  *   **Requirement:** The marginal cost of producing the signal must be negatively correlated with the sender's underlying quality. It is not enough that the signal is expensive; it must be *less* expensive for high-quality senders than for low-quality senders.
  *   **Motivating Case:** **The Peacock's Tail.** A tail is metabolically costly for all peacocks, but a parasite-ridden or genetically weak peacock cannot survive the cost. The cost guarantees the honesty of the "I am healthy" message.
  *   **Camp:** Original Handicap Principle (Zahavi) & Game-Theoretic Reconstruction (Grafen).

  **2. The Receiver Uptake Condition [NON-NEGOTIABLE]**
  *   **Requirement:** The signal must elicit a specific response from the receiver that benefits the sender. Without a receiver calibrated to interpret the cost as information, the expenditure is merely waste.
  *   **Motivating Case:** **Human Charitable Giving (EA Pledges).** A pledge is only a signal if observers update their belief about the pledger's trustworthiness or status. If observers ignore the pledge, the cost is sunk with no informational return.
  *   **Camp:** Human Signaling Accounts & Game Theory.

  **3. The Stability Condition [NON-NEGOTIABLE]**
  *   **Requirement:** The system must reside in a stable equilibrium where "cheating" (low-quality senders mimicking high-quality signals) is evolutionarily or strategically unstable.
  *   **Motivating Case:** **Conspicuous Consumption (Luxury Watches).** If a fake Rolex were indistinguishable from a real one at 1% of the cost, the signal would collapse. The theory must explain why the market maintains verification mechanisms or social stigma that preserve the cost barrier.
  *   **Camp:** Game-Theoretic Reconstruction.

  ---

  ### II. Puzzles the Theory Must Dissolve
  *An adequate theory must resolve these apparent paradoxes without ad-hoc assumptions.*

  **4. Honesty Without Altruism [NON-NEGOTIABLE]**
  *   **Puzzle:** How is honesty maintained if agents are self-interested?
  *   **Resolution:** Honesty is a byproduct of self-interest, not morality. Liars are excluded not because they are "caught," but because the cost of lying exceeds the benefit of the deception.
  *   **Motivating Case:** **Gazelle Stotting.** A gazelle jumping high when spotting a cheetah signals "I am fit, don't bother chasing." The cheetah believes this not out of kindness, but because chasing a stotting gazelle is a poor calorie investment.

  **5. The Existence of Informative Cheap Signals [TENSION POINT]**
  *   **Puzzle:** If cost is required for honesty, how can "cheap talk" ever be informative?
  *   **Resolution:** Cheap signals are honest only when interests align perfectly or when backed by the *threat* of future costly verification.
  *   **Motivating Case:** **Cheap/Deceptive Signal.** A verbal promise is cheap. It is informative only if reputation (a future costly asset) backs it.
  *   **Camp Tension:** **Index-Signal Accounts** argue some signals are honest due to physical constraints (indices), not costs. **Strict Handicap Theorists** argue cost is always required. *See Section V.*

  **6. The Control of Deception [NON-NEGOTIABLE]**
  *   **Puzzle:** Why doesn't deception invade the system?
  *   **Resolution:** Deception exists but is kept at a low frequency (polymorphic equilibrium) or punished by receiver skepticism.
  *   **Motivating Case:** **Unpaid Internships.** If anyone can claim an internship is "for experience," it becomes a signal of wealth (ability to work for free). Deception is checked if employers verify the labor actually occurred; if they don't, the signal degrades into a class barrier.

  ---

  ### III. Critical Distinctions
  *The theory must not collapse these conceptual categories.*

  **7. Signal vs. Cue [NON-NEGOTIABLE]**
  *   **Distinction:** A **cue** is incidental information (e.g., the smell of fear); a **signal** is evolved or designed specifically to modify receiver behavior.
  *   **Application:** Sweating is a cue of nervousness. Wearing a specific EA t-shirt is a signal. Confusing them leads to false positives in signaling analysis.

  **8. Handicap vs. Index [CAMP SPECIFIC]**
  *   **Distinction:** A **handicap** is costly but physically possible for low-quality senders (they just choose not to pay). An **index** is physically impossible to fake (e.g., vocal pitch correlated with body size).
  *   **Application:** **Luxury Watches** are handicaps (anyone *could* buy one if they sacrificed food). **Voice Depth** is an index.
  *   **Camp:** **Index-Signal Accounts** (Maynard Smith & Harper) reject the necessity of waste for indices. **Handicap Principle** proponents often subsume indices under "costs."

  **9. Strategic vs. Nonstrategic Signaling [CAMP SPECIFIC]**
  *   **Distinction:** **Strategic** signaling involves conscious calculation (humans). **Nonstrategic** is hardwired (peacocks).
  *   **Application:** **EA Pledges** are strategic. Applying biological equilibrium models directly to conscious human strategy requires adjusting for cultural transmission and rational choice.
  *   **Camp:** **Human Signaling Accounts** must integrate psychology/sociology; **Biological Accounts** do not.

  **10. Cost vs. Waste [NON-NEGOTIABLE]**
  *   **Distinction:** **Cost** reduces fitness/utility relative to not signaling. **Waste** implies no benefit. A signal is costly but not wasteful if the benefit (mating, status) exceeds the cost.
  *   **Application:** Calling an **EA Pledge** "wasteful" misunderstands the theory; it is costly, but the return is reputational capital.

  **11. Sender-Imposed vs. Receiver-Imposed Costs [CAMP SPECIFIC]**
  *   **Distinction:** Does the sender pay the cost (buying the watch), or does the receiver impose it (testing the signal)?
  *   **Application:** **Unpaid Internships** are sender-imposed costs (forgone wages). Some biological signals are receiver-imposed (chases).
  *   **Camp:** **Veblenian Economics** focuses on sender cost; **Predator-Prey Models** often involve receiver-imposed testing.

  ---

  ### IV. Consistency Requirements
  *The theory must align with mathematical and evolutionary realities.*

  **12. Stable Equilibria [NON-NEGOTIABLE]**
  *   **Requirement:** The model must demonstrate a Separating Equilibrium (high and low types choose different signals) or a stable Pooling Equilibrium.
  *   **Result:** If a model allows low-types to mimic high-types without penalty, it is not a signaling model; it is noise.

  **13. Persistence of Conventional Signals [CAMP SPECIFIC]**
  *   **Requirement:** Explain how arbitrary signals (e.g., wearing a suit, specific handshakes) persist without intrinsic biological cost.
  *   **Resolution:** Conventional signals rely on *social* enforcement costs rather than *biological* production costs.
  *   **Camp:** **Human Signaling Accounts** must account for norms; **Biological Accounts** often struggle here without cultural evolution modifiers.

  ---

  ### V. Camp Commitments & Incompatibilities
  *Where you stand determines which desiderata you prioritize.*

  | Requirement | Original Handicap (Zahavi) | Game-Theoretic (Grafen) | Human/Cultural | Index-Signal |
  | :--- | :--- | :--- | :--- | :--- |
  | **Cost Necessity** | **Absolute.** No cost, no signal. | **Marginal.** Cost must differ by type. | **Variable.** Social cost suffices. | **Rejected.** Physical constraint suffices. |
  | **Waste** | **Required.** Efficiency undermines honesty. | **Incidental.** Waste is a byproduct of separation. | **Contextual.** Waste signals resource slack. | **Unnecessary.** Indices are efficient. |
  | **Consciousness** | Irrelevant (Biological). | Irrelevant (Payoff structures). | **Central.** Intent matters. | Irrelevant. |

  **CRITICAL TENSION: The Costly vs. Cheap Honest Signal**
  *   **Incompatibility:** You cannot jointly satisfy the **Zahavian Handicap Requirement** (cost is *necessary* for honesty) and the **Common Interest Requirement** (cheap talk is honest when interests align).
  *   **The Conflict:** If you argue EA pledges are honest *because* they are costly, you are a Zahavian. If you argue they are honest *because* the community verifies them (making lying costly later), you are relying on enforcement, not the initial signal cost. If you argue they are honest because EAs genuinely want to help (aligned interests), you are arguing *against* costly signaling theory.
  *   **Resolution for Argumentation:** You must specify if you mean "Costly Signaling" (Zahavi/Grafen) or broader "Honest Signaling" (which includes indices and cheap talk under common interest). Using "Costly Signaling" to describe a scenario with aligned interests and no cost is a category error.

  ---

  ### VI. Brief Scorecard of Existing Theories

  *   **Zahavi's Handicap Principle:** Intuitively powerful, biologically grounded. **Weakness:** Originally lacked mathematical rigor; sometimes conflates cost with waste.
  *   **Grafen's Game Theory:** Mathematically robust, defines the marginal cost condition precisely. **Weakness:** Can be too abstract for cultural phenomena; assumes stable genetic payoffs.
  *   **Index Signaling (Maynard Smith/Harper):** Solves the "waste" problem. **Weakness:** Limited to traits physically constrained (size, strength); cannot explain arbitrary cultural signals (watches, pledges).
  *   **Human Cultural Signaling:** Adapts biology to norms/reputation. **Weakness:** Risks becoming a "just-so story" where any behavior is retroactively fitted as a signal.

  ### Application to Your Cases
  *   **EA Pledges:** Passes if the pledge creates a reputational liability (cost) for non-compliance that low-commitment agents cannot bear. Fails if it is "cheap talk" with no enforcement.
  *   **Luxury Watches:** Classic Veblen/Handicap. Passes if the cost is the barrier to entry. Fails if counterfeits are perfect and undetectable (signal collapse).
  *   **Unpaid Internships:** Functions as a signal of *wealth* (ability to absorb cost), not necessarily *skill*. To be a signal of skill, the work must be verifiable (Index) or difficult (Handicap).

  **Final Standard:** Before using the term, ask: **"Is the honesty of this signal guaranteed by a marginal cost that low-quality senders cannot afford, or by physical constraint, or by aligned interests?"** If it is the latter two, "Costly Signaling" is the wrong term.
