      *   **Request:** Actual defeaters for this view, sorted by impact. Include arguments naturalists find troubling. Explain *why* Moore's Open Question Argument (OQA) works (not just the slogan). Address the worry that the gap feels deeper than language (the "creature with no normative vocabulary" point).
      *   **Challenge:** Be honest about whether the view is rigged (unfalsifiable). What would it look like for the gap to be about the *world*?

