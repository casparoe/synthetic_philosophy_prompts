      *   *Mackie's Argument from Queerness:* If "ought" is a natural property, why is it so different from other natural properties (causal power, motivational grip)?
      *   *The Normativity of Rationality/Reason:* If "ought" is natural, why does recognizing it *necessarily* provide a reason (internalism)? Natural properties usually don't force reasons on agents.
      *   *Explanatory Idle-ness:* If moral facts are natural, do they do any explanatory work? (Harman's challenge).
