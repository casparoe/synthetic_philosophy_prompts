answer: |-
  Subject: Re: Moral luck and the claims file

  Dear friend,

  It is a genuine pleasure to receive this note, and I want to start by saying that your instinct to treat your background in courts and insurance not as a deficit but as a distinct dialect is exactly right. You are not looking at philosophy from the outside; you are looking at it from the downstream end where the abstract meets the pavement. When you ask for a translation of the moral luck debate into the vocabulary of torts and claims, you are asking for the metaphysics to be subjected to the but-for test. So let us walk through the file. When Thomas Nagel and Bernard Williams talk about moral luck, they are essentially disputing the control principle, which holds that we should only be judged on what is within our control. In your ledger, the control principle is the duty of care and the breach thereof, measured against the reasonable person standard. The reasonable person is a legal fiction designed specifically to bracket constitutive luck. The law does not ask if you were born impulsive or slow-witted; it asks if you fell below the standard of conduct expected of a competent adult in that situation. If you did, you breached. Whether harm resulted is a separate element, cause in fact and proximate cause, and this is where the philosophers get stuck and the law keeps moving.

  What Nagel calls resultant luck, the difference between the drunk driver who makes it home and the one who hits a child, is in your world the difference between a breach without damages and a completed negligence claim. The law acknowledges this luck openly. We do not sue for negligence alone; we sue for negligence that causes harm. You are correct that blaming people more when things turn out badly looks like strict liability wearing a hat. In a negligence regime, the breach is the fault, but the damages are the luck. However, the law mitigates this through proximate cause and foreseeability. If the chain of events following the breach is too attenuated, too lucky or unlucky in its unfolding, we cut off liability. That is the legal system's way of saying some luck is too remote to be priced into the behavior. The eggshell skull rule is the counterweight here, reminding us that you take the victim as you find them, which is a form of strict liability regarding the plaintiff's constitution, but it remains tethered to the defendant's initial breach. On the insurance side, the translation is even cleaner. Actuaries price expected loss, which is the ex ante risk, while adjusters handle realized loss, the ex post outcome. Moral luck is simply the variance between the premium collected and the claim paid. The insurer does not care about the moral worth of the insured; they care about whether the loss is covered under the policy terms. When philosophers worry about being judged on outcomes, the insurance industry has already commodified that anxiety into a risk pool. They know you cannot control the outcome, only the exposure, which is why they charge for the risk rather than the sin.

  Now to the residue report, which is where your hunches need testing. What comes across cleanly is the tension between conduct and outcome. Your suspicion that the control principle is doing the work of fault and foreseeability is substantiated by the file. The law accepts that we cannot control everything, so we set a standard of reasonable care that filters out the noise of circumstance. If a risk was not foreseeable, there is no duty, and if there is no duty, there is no liability, regardless of the harm. This handles circumstantial luck. What comes across with distortion is the concept of blame itself. In philosophy, blame is a moral status; in law, liability is a financial allocation. When a jury awards punitive damages, they are getting closer to the philosophical notion of blame, punishing the state of mind rather than just the loss, but even then, it is bounded by due process and statutory caps. The law is not trying to determine your worth as a human being; it is trying to make the victim whole and deter future breaches. This functional difference distorts the moral luck debate because the philosophers are looking for consistency in moral judgment, while the law is looking for consistency in loss spreading.

  There are things that have no counterpart at all, and your first sticking point is the prime example. Williams's agent-regret, the feeling the driver has when he did everything right but still hit the child, has no home in your vocabulary because tort law is not equipped to adjudicate the internal psychic state of the tortfeasor unless it rises to recklessness or malice. The law might call this damnum absque injuria, a loss without a legal wrong. If the driver breached no duty, the file is closed. The driver's suffering is irrelevant to the claim. This is not necessarily the law being callous, though it can feel that way; it is the law recognizing its jurisdictional limit. The law fixes externalities, not consciences. If we tried to compensate agent-regret, we would need a cause of action for emotional distress without predicate harm, which opens the floodgates to infinite liability. The concept is not mushy, but it is non-justiciable. It belongs to the realm of ethics or theology, not claims adjustment. The adjuster asks if the loss is covered, not if you are a good person, and certainly not if you feel bad about being the instrument of fate.

  Your second sticking point, the assumption of a competent adult, is where the law deliberately brackets the deepest problem of constitutive luck. The law presumes free will and competence to keep the system functioning. If we dug into why you are the kind of person who breaches duty, we would never reach a verdict. We would be in the realm of determinism, and the court would adjourn indefinitely. This is why the med-mal cases involving lost odds are so fascinating to your hypothesis. When states allow suits over lost odds rather than the death itself, the law is quietly shifting from an outcome-based model to an actuarial one. It is pricing the risk increase, the expected loss, rather than the realized loss. This is the law admitting that the outcome was partly luck and compensating the plaintiff for the value of the chance they lost. It is a hybrid model, half tort and half insurance, and it suggests that the law can evolve to meet the philosophical objection without collapsing the system. It acknowledges that the death was not fully within the doctor's control, but the reduction of survival probability was.

  So here is the verdict you are after. When the residue shows up, it is not evidence that your vocabulary is deficient. It is evidence that the philosophers' fight is less substantive than it sounds because it assumes a single metric for responsibility that does not exist in practice. The paradox is just two practices coexisting, which the law does without embarrassment every day. We use fault-based liability to signal how people should behave, encouraging them to meet the reasonable person standard, and we use insurance and strict liability elements to handle the inevitable variance of luck. The law lives in the contradiction because it has to. It cannot wait for metaphysics to settle the question of free will before assigning damages. There is something your side can say about responsibility that philosophy cannot, which is that responsibility is operational. It is a tool for social coordination. Philosophy asks what responsibility is; law asks what responsibility does. The law says responsibility is the mechanism by which we allocate loss to the party best able to bear it or the party whose behavior we want to modify. If blaming someone for bad outcomes deters risky behavior, then the luck-based blame is functionally useful, even if it is metaphysically shaky.

  The philosophers worry that moral luck undermines the integrity of moral judgment. Your side of the ledger suggests that integrity is less important than solvency and deterrence. The law accepts that we judge on outcomes because that is where the harm lives. We cannot compensate a risk that did not materialize, except in those rare lost odds cases. So we wait for the loss, and then we look back to see if someone breached a duty. If they did, they pay. If they did not, the loss lies where it falls, often on the victim, which is its own kind of moral luck that philosophers rarely discuss. The law does not solve the paradox of moral luck; it manages it. It uses the reasonable person standard to create a fiction of control, and it uses insurance to pool the risk of the uncontrollable. Your vocabulary is not deficient; it is pragmatic. It acknowledges that while we may not be fully in control, we must act as if we are, and we must pay as if we are. The adjuster reading the file knows that whether you were a good person is irrelevant, but whether you were covered is everything. In the end, the law suggests that responsibility is not a truth we discover about the soul, but a price we agree to pay for living in a world where things go wrong. I hope this helps clear the file on this one.

  Best regards,

  Your correspondent
