answer: |-
  In *De Corpore*, Thomas Hobbes advances a philosophy of science in which geometry occupies a privileged position, serving as the methodological template for all rational inquiry, including civil philosophy. This privilege rests on two distinct but intertwined claims. First, there is an **epistemic claim**: geometry is demonstrative because the geometer constructs the objects of his study, thereby knowing their causes. Second, there is a **semantic claim**: geometrical definitions are not discoveries of antecedent essences but stipulations—impositions of names upon conceptions. While these strands jointly support Hobbes's materialist and nominalist system, they generate a significant tension regarding the nature of geometrical truth. This essay will separate these roles, press the tension using the controversy over the quadrature of the circle, and assess whether reading demonstrability as intelligibility rescues Hobbes's coherence. I will argue that while a charitable reconstruction can harmonize these strands by subordinating semantics to kinematics, the circle-squaring controversy ultimately reveals that Hobbes's commitment to construction as a truth-maker is fundamental, even at the cost of mathematical error.

  ### The Epistemic and Semantic Roles of Construction

  To understand the tension, we must first distinguish the work that "construction" does in Hobbes's epistemology from the work it does in his semantics.

  Epistemically, construction is the source of certainty. For Hobbes, all knowledge is knowledge of causes. In natural philosophy (physics), we observe effects and reason backward to probable causes, leaving room for error. In geometry, however, the cause of the figure is the geometer's own act of drawing or conceiving the motion that generates it. As Hobbes writes, we know the properties of a circle because we know how it is made (by the rotation of a radius). Because the cause lies within our power, the reasoning is *a priori* in the scholastic sense: we reason from the generation of the thing to its properties. This is why civil philosophy can be a science: like the geometer, the sovereign (or the philosopher analyzing the sovereign) understands the Commonwealth because it is an artificial construct made by human agreement, not a natural growth.

  Semantically, however, Hobbes is a nominalist. There are no universal "circles" existing in a Platonic realm. A definition is not a report on the essence of an independent object but a decree: "Let a circle be..." The definition fixes the meaning of a name to a specific conception of generated magnitude. On this reading, geometrical truth is analytic; it flows from the consistent use of names established by the definition. The geometer does not discover what a circle *is*; he decides what the word "circle" shall signify, provided the signification is free of contradiction.

  ### The Tension: Stipulation vs. Error

  The tension arises when we ask what constrains these stipulations. If definitions are merely impositions of names, on what grounds can one geometer claim another is *wrong* rather than merely speaking a different linguistic dialect?

  This is not a hypothetical problem for Hobbes; it is the crux of his decades-long feud with John Wallis and the mathematical establishment over the quadrature of the circle. Wallis demonstrated (by the standards of the time) that Hobbes's proposed solutions were mathematically impossible. Hobbes, however, remained unyielding, insisting that his constructions were true and his critics were ignorant of true philosophy.

  On a strict stipulation reading, Hobbes's intransigence is unmotivated. If a rival geometer defines "circle" or "magnitude" differently, such that a quadrature becomes possible, he has simply altered the rules of the game. He has not erred; he has diverged. For Hobbes to claim Wallis is *mistaken*, he must claim that Wallis is failing to describe the *actual* object of geometrical inquiry. But if the object is constituted by the definition, and the definition is arbitrary, there is no "actual object" independent of the definition to which one can fail to correspond.

  Consider the test case proposed: A rival geometer stipulates a definition of the circle under which his quadrature succeeds (perhaps by defining the circle via a discrete approximation or a non-Euclidean metric unknown to Hobbes). Is Hobbes committed to granting this construction is correct *relative to that definition*? If he says yes, he concedes that his own quadrature is only true relative to *his* definition, undermining his claim to have found the *true* quadrature of the *circle*. If he says no, he must argue that the rival's definition is illegitimate.

  To maintain the claim of error, Hobbes needs a constraint on definitions that the nominalist "arbitrariness" appears to deny. He finds this constraint in his materialism. For Hobbes, a definition is not a free-floating linguistic act; it must correspond to a **possible generation in matter**. A definition is valid only if it describes a motion that can be conceived and executed. Thus, the rival geometer errs not because he violated a linguistic rule, but because his definition describes a generation that is kinematically impossible or incoherent. The "circle" is not arbitrary because the *motion* that generates it is fixed by the nature of space and body.

  ### Intelligibility vs. Truth

  This leads to the question of whether the demonstrability criterion is better read as a criterion of *intelligibility* rather than *truth*. If we read Hobbes charitably, we might say that geometry is certain not because it maps onto an external reality, but because it is fully intelligible to the mind that constructs it. On this reading, geometrical necessity is conditional: *If* you generate a figure via motion $X$, *then* properties $Y$ follow.

  Does this rescue the coherence of Hobbes's position? It saves the epistemology: we have certainty because we understand the implication of our own stipulations. However, it reduces geometry's necessity to something conditional on our definitions, which threatens Hobbes's materialist metaphysics. Hobbes wants geometry to be the science of *body*, not just the science of *conceptions*. He insists that the lines drawn in *De Corpore* correspond to the actual motions of the physical world. If geometry is merely about the coherence of our definitions, it loses its status as the foundation of physics and civil philosophy, which deal with real, causal interactions.

  Therefore, while the "intelligibility reading" resolves the semantic tension (Wallis is just playing a different language game), it undermines the epistemic ambition (geometry is the science of real causes). Hobbes cannot afford to treat geometry as merely conditional. He requires the construction to be both a mental stipulation *and* a physical reality.

  ### Fundamental Commitment and the Circle-Squaring Controversy

  In reconstructing Hobbes's position to make it coherent, we are forced to prioritize one strand over the other. I argue that Hobbes's more fundamental commitment is to the **epistemic role of construction as causal generation**, with the semantic nominalism serving as a subordinate tool to clear away scholastic realism.

  For Hobbes, truth is not merely the correct ordering of names (semantic); it is the correct ordering of names that mirrors the ordering of causes (epistemic/metaphysical). A definition is "arbitrary" only in the sense that humans impose the name, but it is "constrained" because it must latch onto a real generation. When Hobbes argues with Wallis, he is not arguing about words; he is arguing about the nature of motion and magnitude. He believes his quadrature works because his construction faithfully replicates the generation of the circle. He views Wallis's algebraic methods as "symbol pushing" devoid of causal understanding—names without conceptions of generation.

  Is the circle-squaring controversy evidence for this answer, or merely a symptom of his mathematical limitations? It is both, but primarily a **symptom** that exposes the fragility of his synthesis. Hobbes's mathematical error is a symptom of his limited technical skill. However, his *refusal to concede* is evidence of his philosophical priority. A pure nominalist could admit, "Under Euclid's definitions, I am wrong; under mine, I am right." Hobbes cannot do this because he believes his definition captures the *true generation* of the circle. The controversy shows that for Hobbes, the constructive method is not just a heuristic for certainty; it is an ontological claim about what geometric objects *are*.

  **Reconstruction Note:** In the analysis above, I have reconstructed Hobbes's constraint on definitions (kinematic possibility) to resolve the tension between nominalism and realism. Hobbes does not explicitly systematize this constraint in a way that fully satisfies modern logic, often conflating the conceivability of a motion with its physical possibility. This reconstruction is necessary to make his position coherent; without it, he oscillates between conventionalism and realism.

  ### Conclusion

  Hobbes attempts to hold together a nominalist semantics and a realist epistemology by anchoring both in the act of construction. While the semantic strand suggests definitions are arbitrary stipulations, the epistemic strand demands they track real causal generations. The tension is palpable in his conflict with Wallis: if definitions were truly free, Wallis could not be wrong; if they track reality, Hobbes must explain why his construction fails to match the mathematical consensus. Ultimately, Hobbes's philosophy privileges the **constructive-causal account**. He is willing to risk mathematical error rather than abandon the claim that knowledge requires knowing the cause through construction. The circle-squaring controversy is thus a symptom of his mathematical limitations, but it serves as evidence that his commitment to construction as the source of truth was the bedrock of his system, rendering his nominalism subordinate to his materialist metaphysics. Geometry remains the paradigm of science not because we define the world, but because, in geometry, we make the world we know.
