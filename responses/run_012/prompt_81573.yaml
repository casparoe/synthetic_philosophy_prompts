      *   *Section 3: Cannabis vs. Heroin.* The market view *cannot* explain this alone. Needs a "Hierarchy of Harm" or "Cultural Acceptability" story. This is the inconsistency point.
      *   *Section 4: Needle Exchanges.* This is "Damage Control." It presupposes that use *will* happen, so minimize fallout. It admits the prohibition on possession is imperfect.
      *   *Section 5: Presuppositions vs. Compatibilities.* Create a clear list.
