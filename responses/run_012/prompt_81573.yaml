          *   Needle Exchange $\rightarrow$ State funded despite possession being illegal (in some contexts) or stigmatized.
      *   **User's Hypothesis:** The "wrong" lives in the *market*, not the *use*. Users = patients; Sellers = criminals. Legalization = Licensing (state control), not deregulation.
      *   **Questions:**
          1.  Does this rule out the Millian view (self-ownership)?
