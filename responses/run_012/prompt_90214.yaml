  I'm in this elective on philosophy of psychiatry and we spent last week on Szasz, and I've ended up with a knot in my head I can't get out. In class everyone talked as if his point was basically settled and obvious — mental illness is a myth, it's all social construction, psychiatry is a pseudoscience dressed up in medical words, etc. I nodded along, but then I got home and thought about my flatmate, who's been on lithium for two years and is honestly a completely different person now, in a good way — before that she couldn't hold down a job and now she can. So if mental illness is a myth, what is the lithium doing? There's no illness there to target, on his view, and yet the drug clearly does somthing, and clearly does it better than a placebo for some people and not others. That feels like a pretty serious problem for the whole argument, and when I raised it in the seminar nobody gave me a straight answer — one guy said Szasz would just say the drugs are a way of keeping people quiet, which I dont see as an answer to anything, and the tutor said something about metaphors that went right past me.

  So I'm asking you instead: was Szasz just wrong? Or am I missing what he was actually claiming? Because right now the only readings I can come up with are either that he denied people really suffer — which can't be right, he was a practising psychiatrist his whole life and saw patients — or that he was some kind of crank who thought the whole thing was made up. Can you lay out for me what the myth is actually supposed to be a myth about, and whether the lithium point really does sink him. Please give it to me as exactly five numbered points, a sentence or two each, and no intro or wrap-up — I want to paste it straight into my notes.
