answer: |-
  This is a sharp argument your friend has constructed. It's a variation on the "self-refutation" objection often leveled at Dennett: if you dissolve the subject too much, who is left to be eliminated?

  You have constrained yourself well: you want to keep the **No Cartesian Theater** insight (which requires accepting Premise 2) and you want to keep **Realism about Phenomenology** (Premise 1).

  To save the model without sacrificing your core commitments, you must **reject Premise (3).**

  Here is the breakdown of why (3) is the weak link, why it looks seductive, and what it costs you to drop it.

  ### The Target: Premise (3)
  > *(3) If there's no fact of the matter about when a content becomes conscious, then there's no fact of the matter about whether it becomes conscious at all.*

  **Why it looks fine:**
  It relies on a deep-seated metaphysical intuition: **Existence implies Locatability.** We tend to think that for an event to be real, it must occupy a specific coordinate in spacetime. If you can't point to the exact nanosecond a light turns on, did the light turn on? Your friend is arguing that temporal vagueness implies ontological emptiness. It treats consciousness like a discrete *event* (like a spark) rather than a *process* (like digestion).

  **Why it is false:**
  This is a classic **Sorites (Heap) Fallacy** applied to time. Many real, robust phenomena lack precise temporal boundaries.
  *   **Example:** When exactly did the Roman Empire fall? 476 AD? 1453? There is no determinate fact about *when*. Does it follow that there is no fact about *whether* it fell? No.
  *   **Example:** When exactly does a child become an adult? There is no biological switch flipped at midnight on the 18th birthday. Does that mean there is no fact about whether someone is an adult? No.

  **Dennett's Specific Defense:**
  Dennett explicitly uses the analogy of **"Fame in the Brain."** When does a neuron become "famous"? There is no specific moment. It becomes more famous, then more, until it is influencing enough other systems to count as famous. The *timing* is indeterminate, but the *status* of being famous is real and has causal consequences.

  ### How Rejecting (3) Saves (1) and (2)

  By cutting the link between *when* and *whether*, you preserve both your constraints:

  1.  **You keep (1) (Realism):** There *is* a determinate fact about what it's like to be in the state. The "what it's like" is constituted by the content of the winning draft (the information that achieved "fame"). The content is determinate (e.g., "red flash"), even if the *timestamp* of its victory is fuzzy.
  2.  **You keep (2) (No Theater):** You maintain that there is no finish line. The "when" is indeed fixed by later probes (memory, report, motor control).

  If (3) is false, then **(4) does not follow.**
  *   (4) claimed: "So on multiple drafts there's no determinate fact about what it's like..."
  *   **Correction:** There *is* a fact about what it's like (the functional content), it just lacks a precise timestamp.

  If (4) fails, **(5) fails.** The model is not eliminativist about consciousness; it is eliminativist about *precise temporal boundaries* for consciousness.

  ### The Cost: What do you give up?

  Dropping (3) is not free. Here is the philosophical price tag you pay to win this argument:

  **1. You must accept Vague Ontology.**
  You have to concede that consciousness is a **vague predicate**. In classical logic, things are either P or not-P. You are committing to the view that "being conscious" is a matter of degree or a cluster concept that doesn't have sharp edges. Some philosophers find this deeply unsatisfying; they want consciousness to be a natural kind with essential boundaries. You are agreeing with Dennett that it is more like a "user-illusion" or a functional status that emerges gradually.

  **2. You must redefine "Fact" in Premise (1).**
  To defend (1) "to the death" while accepting MDM, you must ensure your friend isn't smuggling "temporal precision" into the definition of "determinate fact."
  *   **Friend's hidden assumption:** A "fact about what it's like" includes a fact about *when* it is like that.
  *   **Your correction:** A "fact about what it's like" is a fact about *informational availability*.
  *   **The Cost:** You have to argue that the *phenomenology* doesn't include the *timestamp*. (Which, ironically, Dennett argues is true: we *think* we experience things in a precise order, but that is part of the illusion the brain constructs retrospectively).

  **3. You absorb the "Real Patterns" burden.**
  Dennett's escape from eliminativism relies on his theory of **Real Patterns**. A pattern is real if it allows for successful prediction and compression of data, even if it isn't made of fundamental particles.
  *   **The Cost:** You have to defend the view that consciousness is "real enough" if it supports prediction and reporting, even if it isn't a fundamental feature of the universe. If your friend is a hard metaphysical realist, they will say this is "watering down" reality. You have to stand firm that *functional reality is the only reality that matters for consciousness.*

  ### How to Reply to Your Friend

  Here is the script to dismantle the argument:

  > "I'm keeping (1) and (2), but I'm rejecting (3). You're conflating **temporal precision** with **ontological existence**.
  >
  > Consider 'fame.' There is no fact of the matter about the exact second a person becomes famous. It depends on later probes (polls, recognition, media coverage). But it doesn't follow that there's no fact about *whether* they are famous.
  >
  > Consciousness, on the Multiple Drafts model, is a functional status like fame, not a discrete event like a spark. The *content* of the experience (what it's like) is determinate because it is the content that wins the competition for control of speech and memory. The *timing* of that victory is indeterminate.
  >
  > By rejecting (3), (4) and (5) collapse. The model isn't eliminativism about consciousness; it's eliminativism about the **Cartesian assumption that consciousness must have a precise timestamp.** The reports aren't sawing off the branch; they are the very probes that constitute the fame. The branch holds because the reports are the evidence of the fame, not a report on a separate, timestamped event."

  ### Summary
  *   **Give up:** Premise (3).
  *   **Why it looked fine:** It exploits the intuition that real events must happen at specific times.
  *   **The Cost:** You must accept that consciousness is a vague, functional process rather than a precise, discrete event. You have to defend "functional reality" against "metaphysical precision."

  This allows you to keep the No-Cartesian-Theater insight (which is the whole point of Dennett's model) without falling into the trap of saying nothing is conscious. You are a realist about the *process*, just not a realist about the *timestamp*.
