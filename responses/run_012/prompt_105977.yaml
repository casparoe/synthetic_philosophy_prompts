  I'm a second-year PhD student in machine learning — Bayesian generative modeling, hierarchical models, latent variables, variational inference, that whole toolkit — and last week a friend in the philosphy department dragged me into a long bar argument about the simulation argument. The whole time I had this feeling that everything he said had a translation into the vocabulary I actually use, and that once you translate it, a lot of the spookiness falls away; but also that something is left over that I can't put my finger on. So what I want from you is a faithful translation, not a debunking. Take the classic simulation argument (the trilemma: civilizations fizzle out before they get to the point of running ancestor sims / they get there but don't bother / we're probably sims) and restate it as a probabilistic generative model, using the terms I'd actually reach for: priors over the number of civilizations and over the propensity of a civilization to run simulations, ancestral sampling of observers, a latent indicator for which level of reality an observation is drawn from, marginalization versus conditioning, exchangeability of observers, model misspecification, tail behavior of priors, that sort of thing. Be as literal and as technically honest as you can — if a premise only survives as an assumption about how heavy the tail of some prior is, say so and say how heavy it has to be; if a step is really a disguised choice of reference class, tell me which modeling choice it corresponds to. Don't bother with citations, I'm not going to go read them.

  Then the part I actually care about: the residue report. What in the argument has no counterpart in my vocabulary at all? My hunch is that the indexical bit, the claim that I'm a random observer among all observers, is the sore spot, since my models have random variables for observables and parameters but no variable for who I am, and conditioning on my own existence isn't an event in the model. I also suspect the whole question is a question about the model rather than a question inside the model — a simulation just is a generative model, so asking whether I'm in one is asking about the relation between my model and the world, which might be a type error in my vocabulary. But tell me if I'm wrong, and be specific about which residue is a defect of my framework, i.e. something a better probabilistic vocabulary would capture, versus a sign that the original argument was doing something less clear than it looked. And for the parts that do translate cleanly, tell me what the translation buys: does the trilemma get sharper, or does it dissolve into the observation that you can't infer a hyperparameter you have no data about?

  Please write in American English.
