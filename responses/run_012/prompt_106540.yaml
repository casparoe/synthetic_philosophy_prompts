answer: |-
  Here are nine interview questions designed to press on the weak points of your guest's position, tailored for a LessWrong-adjacent audience. Each includes a follow-up keyed to the defensive move he is most likely to make.

  **1. The "Magic of Naming" Objection**
  You argue that superrationality is a constraint on how we *carve* the decision problem, not a rule we apply inside it. But if I can dissolve a Prisoner's Dilemma simply by redrawing the boundary of the "agent" to include my opponent, haven't I just solved the problem by definition? If I carve "me and the guy trying to steal my wallet" into a single locus of choice, I maximize joint utility, but I still get stabbed. What prevents this from being a semantic trick that ignores the physical reality of competing interests?

  *   **Follow-up (If he says the carving isn't arbitrary but based on logical correlation):** "Okay, but logical correlation is a matter of degree. At what threshold of correlation does the 'single agent' ontology snap into existence? If it's a spectrum, doesn't that reintroduce the very calculation you're trying to bypass, just under a different name?"

  **2. The 90% Problem**
  Hofstadter's original superrationality assumes identical reasoning engines. But in the real world, I'm never 100% sure you're running my algorithm. Let's say I'm 90% confident you're relevantly like me, and 10% confident you're a random defector. Does your "single locus" view survive this? Do I treat us as one agent and cooperate, or two agents and hedge? If you say "one agent," aren't you ignoring the 10% risk where I get exploited?

  *   **Follow-up (If he says we must treat the 90% as the relevant reality):** "Then you've effectively reduced your view to Evidential Decision Theory with a prior. If the 'single locus' is just a probabilistic expectation of correlation, why insist it's an ontological claim about the decision problem rather than just an epistemic state?"

  **3. Evolutionary Stability (The "Sitting Duck" Problem)**
  If I adopt your framing and treat us as a single locus, I will cooperate in a one-shot Prisoner's Dilemma against a Causal Decision Theorist who defects. I get the sucker's payoff; they get the temptation payoff. In an evolutionary environment, your agents go extinct. Why isn't your 'correct carving' of the decision problem simply a recipe for being outcompeted by agents who carve it 'incorrectly' but win the resource war?

  *   **Follow-up (If he says superrationalists will find each other and outperform in the long run):** "That requires assortment—finding other superrationalists before you play. But that's a mechanism for *partner selection*, not a solution to the decision problem itself. Are you admitting that without pre-commitment mechanisms or repeated games, your view is practically suicidal?"

  **4. The Reference Class Gerrymandering**
  The whole engine of your view rests on the reference class of "agents relevantly like me." History is full of people defining their 'in-group' as the only moral agents and everyone else as NPCs. How do you define this reference class without gerrymandering it post-hoc to include the people you want to cooperate with and exclude the people you want to defect against? What is the objective metric that stops me from saying 'all cooperators are like me, all defectors are not'?

  *   **Follow-up (If he appeals to source code or algorithmic similarity):** "In humans, we don't have access to source code. We only have behavior. If I have to infer your algorithm from your actions, haven't I just turned this into a standard game of signaling and reputation? Where is the 'superrational' leap left over?"

  **5. EDT and Team Reasoning Collapse**
  Critics might say this is just Evidential Decision Theory (EDT) wearing a trench coat, or Michael Bacharach's 'Team Reasoning' with extra steps. EDT says 'cooperate because cooperation is evidence of the other cooperating.' Team Reasoning says 'maximize group utility.' What is the *cash value* difference? Can you give me a specific case where your 'carving constraint' prescribes a different action than EDT or Team Reasoning?

  *   **Follow-up (If he says the difference is metaphysical/ontological, not practical):** "If the output is identical, why should a rationalist care about the ontology? If it doesn't change the bet you take, isn't insisting on the 'single locus' view just a preference for a specific flavor of narrative rather than a tool for winning?"

  **6. The Normative Authority**
  You say we *should* carve the decision problem this way. But who says? If I'm a Causal Decision Theorist, I see two distinct loci of control. You see one. Why is your carving the 'true' one? Is there a fact of the matter about how many agents are in a room, or is this just a pragmatic choice? If it's pragmatic, doesn't that undermine the claim that the dilemma is *dissolved* rather than just ignored?

  *   **Follow-up (If he says the 'single locus' is logically necessary given symmetry):** "Symmetry is in the eye of the beholder. If I value my own happiness twice as much as yours, the symmetry is broken. Do you require agents to have identical utility functions to be a 'single locus'? If so, your theory applies to almost no real-world conflicts."

  **7. Dissolving the Dilemma vs. Ignoring Conflict**
  You claim that once we treat 'me and my duplicate' as one chooser, the Prisoner's Dilemma stops being a dilemma. But the tension between individual incentive and group optimum is real. By redefining the agent, aren't you just sweeping the conflict under the rug? If I'm starving and you're starving, and there's only one loaf of bread, no amount of 'locus carving' makes the scarcity go away.

  *   **Follow-up (If he says scarcity is a separate issue from the decision structure):** "But decision theory exists to allocate scarce resources. If your framework can't handle zero-sum conflicts within the 'single agent' class, isn't it only useful for positive-sum games where the dilemma was never that pressing to begin with?"

  **8. Falsifiability and Retreat**
  Let's talk about updating. You've built a framework that interprets cooperation as 'seeing the problem correctly' and defection as 'framing the problem incorrectly.' This feels unfalsifiable. What specific observation, thought experiment, or mathematical result would actually make you drop the view that superrationality is a constraint on carving?

  *   **Follow-up (If he says a better theory that explains more):** "That's too vague. I need a boundary condition. Is there a scenario where logical correlation is high, the stakes are high, and you would *still* recommend defection? If not, aren't you just hard-coding 'cooperate' and calling it geometry?"

  **9. Implementation in AI**
  For our audience: if we build AI agents, do we hard-code this 'carving' constraint? If I program an AI to treat correlated agents as a single locus, but its opponent is programmed to maximize individual utility, my AI gets exploited. Do we need to solve multi-agent coordination *before* we deploy these agents? Or does your view imply we should build AIs that refuse to play against non-superrationalists?

  *   **Follow-up (If he says AIs can inspect each other's code to verify correlation):** "That works for transparent code, but not for opaque neural nets or human adversaries. If your theory relies on transparency to establish the 'single locus,' isn't it just a specialized tool for software verification rather than a general theory of rationality?"
