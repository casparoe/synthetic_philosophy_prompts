prompt: |-
  My friend and I do a tiny podcast thats basically LessWrong-adjacent, and next months guest is a guy who's been blogging that superrationality is really a constraint on how you carve up a decision problem rather than a rule you apply inside one — his line is that once you treat "me and my duplicate" as a single locus of choice, the prisoners dilemma stops being a dilemma, and he thinks thats the point and not a bug. Can you draft eight or nine interview questions, each with a follow-up? I want them to actually bite. Press him on whether this is just relabeling (couldn't I carve any two agents into one chooser and get cooperation for free?), on what survives when the other party is only 90% likely to be running my algorithm instead of certainly, on whether superrational agents are sitting ducks for non-superrational ones and why he isn't worried about that, and on how the reference class of "agents relevantly like me" avoids getting gerrymandered after the fact. Also one on whether the whole thing just collapses into evidential decision theory, or into team reasoning under another name, and one on what would actually make him drop the view. For each question, give the follow-up keyed to the answer he's most likely to give.
