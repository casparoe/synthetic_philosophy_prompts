answer: |-
  **Preliminary Notes on Concessions and Non-Concessions**

  **Intrinsic-Valence Camp (IVC):**
  *   *Must Concede:* Pleasures are phenomenally heterogeneous (the smell of rain differs from solving an equation). Introspection is sometimes confused, especially in mixed states (bittersweetness). One can have the sensory content of a pleasure without the pleasure (anhedonia).
  *   *Cannot Concede:* That there is *nothing* phenomenal common to all pleasures. That "feeling good" is reducible entirely to a desire or judgment without remainder. That the hedonic tone is merely a projection with no introspective basis.

  **Attitudinal Camp (AC):**
  *   *Must Concede:* Pleasures feel similar enough to warrant a single concept. Introspection *seems* to reveal a quality, even if this is illusory or derivative. Anhedonia involves a dissociation between sensory processing and the pro-attitude.
  *   *Cannot Concede:* That there exists a *sui generis* hedonic quale independent of the subject's stance toward the content. That introspection reveals a property distinct from the experience of liking/wanting the content. That pleasure can exist without a subject-object relation.

  ***

  **1. Joint Statement of Agreed Claims**

  1.  **Phenomenal Heterogeneity:** Pleasures vary widely in their sensory and cognitive textures; the "feel" of eating a peach is distinct from the "feel" of understanding a joke, even when both are pleasant.
  2.  **Non-Sensory Pleasures:** Some pleasures lack distinct sensory content (e.g., the joy of relief or intellectual satisfaction), indicating that pleasure is not essentially a sensory modality like touch or taste.
  3.  **Dissociation of Liking and Sensing:** It is possible to possess the sensory discrimination of a gourmet without the corresponding enjoyment (anhedonia), and possible to enjoy a sensation one cannot finely discriminate.
  4.  **Introspective Fallibility:** Introspection is not infallible; subjects can be mistaken about the sources of their pleasure or the precise structure of mixed feelings (e.g., nostalgia).
  5.  **Motivational Link:** Pleasure is typically linked to motivation (approach, maintenance, repetition), though this link can be disrupted (e.g., by apathy or external constraint).
  6.  **Introspective Limits:** Introspection alone cannot settle whether the similarity between pleasures is due to a shared constituent property or a shared functional/attitudinal role, as both models can accommodate the *appearance* of similarity.

  ***

  **2. Residual Disagreements**

  **Disagreement A: The Ontology of "Goodness"**
  *   **IVC Formulation:** Pleasure involves a *sui generis* phenomenal property (hedonic tone) that is a constituent of the experience, distinct from the object experienced. **(Substantive)**
  *   **AC Formulation:** Pleasure is a pro-attitude (liking, wanting) directed at an experience or content; the "goodness" is the relation, not a property of the content or a separate quale. **(Substantive)**
  *   **Falsification Condition (IVC):** If neurophenomenal investigation confirms that all states classified as "pleasurable" share no common neural or phenomenal marker beyond the activation of an attitudinal system, and subjects trained in phenomenological reduction report no common tone.
  *   **Falsification Condition (AC):** If a hedonic tone can be experimentally isolated and manipulated independently of any change in the subject's pro-attitude toward the content (i.e., the "glow" changes while the "liking" remains constant).

  **Disagreement B: The Status of Introspective Reports**
  *   **IVC Formulation:** When subjects report a "felt goodness," they are reporting a genuine phenomenal feature; denying this is an error theory of introspection. **(Substantive)**
  *   **AC Formulation:** When subjects report a "felt goodness," they are reporting the presence of a pro-attitude or misdescribing a functional role as a quality; this is a category mistake, not an introspective error. **(Merely Verbal/Substantive Hybrid)**
      *   *Note:* This turns on whether "property" requires "introspectible quality." If "property" can mean "functional role," this is verbal. If "property" means "quale," it is substantive.
  *   **Falsification Condition (IVC):** If subjects reliably distinguish pleasures by "goodness" while sincerely denying under rigorous questioning that they share any felt quality (suggesting the "quality" is a post-hoc label).
  *   **Falsification Condition (AC):** If subjects can identify a specific hedonic quality that persists even when they are induced to dislike the object (suggesting the quality is independent of the attitude).

  ***

  **3. The Cruxes**

  1.  **Separability:** Can the "feeling of goodness" be separated from the "attitude of liking" in principle and practice?
  2.  **Transferability:** Is the hedonic component a movable constituent that can be attached to different contents, or is it essentially tied to the specific content it validates?

  ***

  **4. Analysis of Common Evidence Cases**

  **Case 1: The Implant**
  *Scenario:* A device stimulates the brain to yield one and the same hedonic quality whichever modality triggers it (vision, touch, thought), while the sensory qualities of those modalities remain unchanged.
  *   **IVC Prediction:** Subjects will report a common "glow" or "tone" overlaying the distinct sensory experiences. The similarity is phenomenal and direct.
  *   **AC Prediction:** Subjects will report liking all triggered experiences equally. If they report a "common glow," AC interprets this as the phenomenal signature of the *attitude* itself, not a separate property.
  *   **Coincidence:** Both agree the device causes a uniform positive response. They diverge on whether that response is a *quality added to the experience* (IVC) or *a uniform stance toward the experience* (AC).
  *   **Discriminatory Power:** Low, unless we can distinguish the phenomenology of "having a tone" from "holding an attitude."

  **Case 2: The Transplant**
  *Scenario:* A procedure moves the "felt goodness" of Experience A (e.g., tasting chocolate) onto Experience B (e.g., hearing a siren), leaving the sensory content of B otherwise unchanged.
  *   **IVC Prediction:** Possible. Experience B will now feel pleasant because it now contains the hedonic constituent, even if the siren sounds like a siren.
  *   **AC Prediction:** Impossible as described. One cannot move a relation. One can only change the subject's attitude toward the siren. If the subject comes to like the siren, the "goodness" is not a transplanted *thing* but a new *relation* to the siren.
  *   **Coincidence:** None. IVC sees a transfer of a constituent; AC sees a change in orientation.
  *   **Discriminatory Power:** High. If the subject reports, "The siren sounds the same, but it has the *same pleasantness* as the chocolate," IVC is vindicated. If the subject reports, "I now like the siren, but it doesn't feel like chocolate," AC is vindicated.

  **Case 3: The Creature**
  *Scenario:* A creature sorts its own pleasures reliably by how good they feel while sincerely denying that they share any felt quality.
  *   **IVC Prediction:** The creature is introspectively mistaken. It possesses the common property but lacks the concept or attentional focus to identify it as such. The sorting behavior proves the property exists; the denial proves introspection is fallible.
  *   **AC Prediction:** The creature is introspectively accurate. There is no common felt quality. The sorting is based on the functional role (reward value) or the presence of the pro-attitude, which does not require a shared quale.
  *   **Coincidence:** Both agree the creature sorts reliably.
  *   **Discriminatory Power:** High. This tests the authority of introspection. If the creature's denial is sincere and stable under philosophical probing, it undermines the IVC claim that the tone is *introspectible*.

  ***

  Verdict: The crux most likely to move at least one side if settled is the Separability of Tone and Attitude, specifically as tested by the Transplant case.
