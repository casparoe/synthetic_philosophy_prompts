answer: |-
  1. "The claim in plain terms"

  Parfit's hitchhiker shows that promises only work if you keep them even when it hurts. Imagine you are stranded. A driver says, "I'll save you if you promise to pay me once we reach town." Once you are safe in town, you have no reason to pay. The driver knows this. So, the driver leaves you there. To get the ride, you must be the kind of person who pays even when you don't have to. This is "rational irrationality." It is rational to build a character that ignores immediate self-interest, because having that character gets you the benefits (the ride, the loan, the help) in the first place.

  In this house, since we cannot sue each other, our promises must work like the hitchhiker's. If we only keep promises when it is convenient, no one will trust us when it is inconvenient. We are not deciding whether to keep a specific promise; we are deciding whether the person making it is the kind of person who keeps promises when incentives disappear. If you know you will not want to pay later, you cannot get the ride now.

  2. "The procedure"

  To run this in twenty minutes, you must act as a chair who enforces the steps, not the outcome. Distribute this sheet. Do not debate the request until the steps are complete.

  **Step 1: Locate the Level.**
  *Question:* "Is this promise binding an individual act, a house policy, or a person's character?"
  *Sufficient Answer:* Explicit classification. "This is a character promise (loan)," "This is a policy promise (shift)," or "This is a collective pledge (charity)."
  *Fact or Value:* Fact. The structure of the agreement determines this.
  *Why:* You cannot solve a character problem with policy. If the level is misidentified, the credibility check fails. Confusion here is where our mistakes come from.

  **Step 2: The Post-Benefit Incentive Check.**
  *Question:* "Once the benefit is received, does the promiser have a material reason to break the promise?"
  *Sufficient Answer:* "Yes, they will be gone," or "No, they need future help."
  *Fact or Value:* Fact. Look at the timeline and leverage.
  *Why:* This identifies the Parfit moment. If the answer is "No," standard rationality suffices. If "Yes," you need rational irrationality. This step forces us to acknowledge when enforcement vanishes.

  **Step 3: The Credibility Mechanism.**
  *Question:* "What specifically prevents defection when incentives fail?"
  *Sufficient Answer:* Must name a mechanism: "Social reputation," "Reciprocity requirement," or "Pre-allocated budget."
  *Fact or Value:* Value. The room must judge if the mechanism is strong enough.
  *Why:* "Because I promise" is not a mechanism. It is the thing being tested. You need an external anchor. For collective pledges, the mechanism must be budgetary, not voluntary.

  **Step 4: The Honesty Constraint.**
  *Question:* "If the promiser admits they will not want to pay later, do we proceed?"
  *Sufficient Answer:* "No."
  *Fact or Value:* Value (Rule of procedure).
  *Why:* This addresses your specific failure mode. If you know you will defect, you are admitting you lack the required disposition. The house cannot accept a promise known to be hollow.

  **Step 5: The Decision and Stop.**
  *Question:* "Does the mechanism match the risk level?"
  *Sufficient Answer:* Majority vote.
  *Fact or Value:* Value.
  *Stop Condition:* If Step 3 yields no mechanism (e.g., a departing member with no reputation track), the procedure stops. There is no vote. The request is denied. Do not hand the decision to the room if the credibility mechanism is absent. The room decides only on the strength of the mechanism, not on hope. This prevents the group from accepting bad debt out of kindness.

  3. "Worked cases"

  **Case 1: The Departing Member's Debt.**
  *Level:* Character. The house has no leverage after graduation.
  *Incentive Check:* Yes. Once they leave, keeping the money is materially rational.
  *Credibility:* Reputation. Does this person have a track record? If they are new, the mechanism is weak.
  *Honesty:* If they say, "I might struggle to pay," Step 4 triggers. You must deny the loan.
  *Decision:* Only approve if the reputation mechanism is strong (e.g., they have lived here three years). If they are leaving soon, the procedure stops at Step 5. You cannot vote on hope. This protects the kitty from becoming a graduation gift.

  **Case 2: The Swapped Kitchen Shift.**
  *Level:* Individual Act/Policy.
  *Incentive Check:* Yes. Once the favour is received, the reason to reciprocate vanishes until the next crisis.
  *Credibility:* Reciprocity and Social Cost. The mechanism is the logging system and the knowledge that refusing a future swap marks you as a defector.
  *Honesty:* Usually low risk. If someone says, "I'll take your shift but I won't cover you later," deny immediately.
  *Decision:* Approved if logged. The mechanism works because membership turnover is slow enough within the year for social shame to operate. The risk is low enough that the room votes yes by default unless Step 4 is triggered.

  **Case 3: The House Pledge to Charity.**
  *Level:* Collective Policy. No individual is obliged; the house is.
  *Incentive Check:* Yes. When the bill comes, every individual saves money by paying less.
  *Credibility:* Pre-allocated Budget. The money must be removed from the kitty *before* the pledge is made.
  *Honesty:* Irrelevant to individuals. The commitment is from the house entity.
  *Decision:* Vote on the budget allocation, not the promise. If the money is not set aside in Step 3, the pledge is invalid. Do not promise what you have not budgeted. This solves the diffuse responsibility problem by making the cost immediate rather than future-dated.

  4. "The case I will not want to hear"

  The procedure will force you to deny a loan to a friend who admits, "I honestly don't know if I can pay this back once I graduate." You will feel cruel. You will want to say, "I trust you." The procedure says this trust is irrelevant because the incentive structure is broken. Your resistance is legitimate emotionally but illegitimate structurally. If you override the procedure, you are not helping your friend; you are converting house funds into a gift without the house's consent. The pain you feel is the cost of maintaining the system that allows everyone else to borrow. You must prioritize the house's credibility over your friend's immediate comfort. Denying the promise preserves the possibility of future promises; accepting a hollow one destroys the mechanism for everyone.

  5. "What the procedure cannot do"

  This procedure cannot generate trust where none exists; it only screens for it. It relies entirely on honest answers in Step 2 and Step 4. If a member lies about their intention to defect, the procedure validates a bad promise. It is judgment dressed up as process; Step 3 requires the room to assess "reputation," which is subjective. It cannot enforce repayment; if a member leaves and defaults, the procedure has only protected the decision-making process, not the money. It also cannot resolve deep value conflicts—if the house disagrees on whether "reputation" is enough security, the procedure stalls. Finally, it cannot account for genuine hardship. A person may be disposed to pay but unable to. The procedure treats inability as defection risk. It protects the institution, but it offers no safety net for the individual who fails despite good character. You must accept that some fair outcomes will be rejected to maintain the system's integrity.
