answer: |-
  **Essay Question**

  **Time Allocation:** You are advised to spend approximately 70 minutes on this question.
  **Marks:** This question is marked out of 20.

  **Question:**
  A five-person appointments panel operates under a standing rule: a candidate is offered the post if and only if the panel affirms both that the candidate has a strong research record (P) and that the candidate can cover the teaching need (Q). The panel votes by simple majority on each proposition separately. The individual judgments are distributed as follows:

  *   **Member 1:** Affirms P and Q.
  *   **Members 2 & 3:** Affirm P, deny Q.
  *   **Members 4 & 5:** Deny P, affirm Q.

  Write an essay that begins by demonstrating the collective inconsistency produced by this voting procedure using the numbers provided. Then, evaluate the objection that this inconsistency is harmless because a committee is not a single mind capable of belief. Finally, analyse how alternative decision procedures (such as voting only on the criteria or only on the outcome) resolve the inconsistency, and identify what normative virtue is sacrificed in each solution. Conclude by reflecting on who holds power when the logical structure of the agenda determines the outcome.

  ***

  **Model Answer**

  The scenario presented generates a classic inconsistency in collective judgment. Using the provided numbers, three members (1, 2, 3) affirm proposition P (research), constituting a majority. Three members (1, 4, 5) affirm proposition Q (teaching), also constituting a majority. If the panel aggregates judgments on the premises by majority rule, the collective view accepts both P and Q. Given the standing rule (Offer iff P & Q), the logical consequence is that the candidate must be hired. However, only one member (Member 1) supports hiring the candidate. If the panel voted directly on the outcome, the majority would reject the offer. Thus, the panel faces a contradiction: reasoning from the majority-accepted premises mandates hiring, but the majority will on the conclusion mandates rejection.

  It is tempting to dismiss this contradiction by arguing that a committee is not a cognitive agent. Unlike an individual, a group need not maintain logical coherence across its beliefs because there is no 'group mind' to suffer cognitive dissonance. On this view, the inconsistency is merely a statistical artefact of aggregation, not a rational failure. However, this objection fails to account for the practical demands of collective responsibility. A panel does not merely hold views; it issues verdicts that create precedents, allocate resources, and incur obligations. If the panel hires the candidate based on the premises but later denies that the candidate met the criteria when challenged, it acts in bad faith. Consistency is required not for psychological comfort, but for accountability. A body that cannot explain its verdicts without contradicting its own recorded judgments cannot be held responsible for them over time.

  To resolve the inconsistency, the panel must adopt a specific decision procedure, but each procedure sacrifices a different normative virtue. The first option is a **premise-based procedure**: the panel votes only on P and Q, accepting the logical consequence for the outcome. This preserves collective rationality and ensures that the verdict is supported by public reasons. However, it sacrifices responsiveness to the majority will on the final outcome. The candidate is hired despite four out of five members opposing the hire. This creates a democratic deficit where the aggregation of reasons overrides the aggregation of verdicts.

  The second option is a **conclusion-based procedure**: the panel votes only on whether to hire, ignoring the logical constraints on the criteria. This preserves responsiveness to the majority will on the outcome (the candidate is rejected). However, it sacrifices integrity of reasoning. The panel rejects the candidate while simultaneously recording a majority view that the candidate met both necessary criteria. This severs the link between reasons and decisions, rendering the panel's recorded judgments incoherent and potentially undermining the legitimacy of the criteria themselves.

  A third option is to grant a chairperson dictatorial power to decide, which guarantees consistency and decisiveness but sacrifices equality among voters entirely. Alternatively, one might allow the chair to reconcile the results after the fact, but this merely hides the inconsistency behind opaque authority rather than resolving it procedurally.

  Ultimately, the paradox reveals that the power to fix the agenda is the power to decide the outcome. If the rule requires voting on premises, the candidate is hired; if it requires voting on the conclusion, the candidate is rejected. The aggregation rule itself does not license this power; rather, the power resides in the prior decision about *what* is to be voted on. This suggests that the 'will of the group' is not discovered by voting but is constructed by the procedure. Therefore, the group agency objection does not survive scrutiny: if a body is to act as an agent capable of responsibility, it must accept that its procedure constitutes its will. To avoid the dilemma is to choose which virtue—rationality or responsiveness—is expendable, acknowledging that the choice itself is an exercise of political power.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Grade Boundary Guidance:** A **2:1 (14–16 marks)** will correctly identify the inconsistency and describe the trade-offs of the procedures. A **First (17–20 marks)** will explicitly link these trade-offs to the concept of agenda power and provide a robust defence of group agency based on responsibility rather than metaphysics.

  | Move | Marks | Characteristic Error |
  | :--- | :---: | :--- |
  | **1. Numerical Demonstration**<br>Correctly calculates the majority on P (3/5), majority on Q (3/5), and minority on Outcome (1/5), showing the contradiction between derived verdict and direct vote. | 3 | Candidates often assume majority support on premises implies majority support on the conclusion, failing to show the split vote. |
  | **2. Critique of 'No Group Mind'**<br>Rejects the objection that inconsistency is harmless, arguing that accountability, precedent, or responsibility requires coherence regardless of metaphysical agency. | 3 | Candidates accept the objection too readily, arguing that groups are not people so logic does not apply, ignoring institutional constraints. |
  | **3. Premise-Based Analysis**<br>Identifies that voting on criteria preserves rationality/integrity but overrides the majority will on the final outcome (Democratic Deficit). | 4 | Candidates describe the procedure but fail to identify the specific sacrifice (overriding the majority verdict on the hire). |
  | **4. Conclusion-Based Analysis**<br>Identifies that voting on the outcome preserves majority will but severs the link between reasons and verdict (Incoherence). | 4 | Candidates describe the procedure but fail to identify the specific sacrifice (recording inconsistent reasons or ignoring the rule). |
  | **5. Agenda Power Identification**<br>Explicitly states that the choice of procedure (agenda setting) determines the outcome, meaning power lies in fixing the rules rather than the voting itself. | 4 | Candidates treat the voting rule as neutral or technical, missing the political implication that the rule decides the winner. |
  | **6. Group Agency Synthesis**<br>Argues that to be a responsible agent, the group must adopt a procedure that accepts the burden of consistency, making agency a normative requirement rather than a metaphysical fact. | 2 | Candidates treat group agency as purely metaphysical (can a group think?) rather than normative (must a group answer for itself?). |

  **Total:** 20
