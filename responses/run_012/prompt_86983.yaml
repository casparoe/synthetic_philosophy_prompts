prompt: |-
  My friend and I just burned two hours arguing about whether the brain is a computer, and he ended it by sending me this paragraph from some pop-science book he has, like it settles everything. Here it is:

  Computationalism is the view that the brain is a computer. Thinking is information processing: the brain takes inputs, runs them through algorithms, and produces outputs, and mental states just are the states of that program. This is why cognitive science can work at all -- if the brain weren't a computer, you couldn't simulate it. Nothing here depends on neurons being like silicon chips; any system that implements the right program has the same mind, which is why a perfect simulation of you would be you. And the brain has to be a computer, because the Church-Turing thesis says any physically realizable computation can be run on a Turing machine, and thinking is a physical process. Critics like Searle say a computer just shuffles symbols without understanding, but that's a point about syntax versus semantics, and it doesn't touch the science.

  He also kept bringing up two things he only half-remembers. First, some paper that supposedly shows a rock could count as implementing every computer program you like, which he thinks makes the whole notion of implementing a program empty and observer-relative. Second, something about neurons being analog and noisy, so the brain isn't digital and therefore isn't a computer at all. I couldn't tell if either of those is a real arguement or something he read on a blog once.

  I'm not a philosopher, I just want to know if his paragraph is fair. Go through it claim by claim and tell me what someone who actually works on this would accept, what they'd wince at, and what's just wrong. Then tell me whether the thing he thinks follows from it actually follows from any of the true parts -- his conclusion is that we're computers in the same sense a laptop is, so mind uploading is definately just an engineering problem. And one more thing: I'm inclined to think the whole debate is a verbal dispute that dissolves once you're clear about what "computer" means, so tell me if that's naive, and if not, which of his sentences are the ones doing the real work.
