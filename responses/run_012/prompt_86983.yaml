answer: |-
  This is a classic debate in philosophy of mind and cognitive science, and your frustration is well-founded. Your friend's paragraph reads like a manifesto for **Strong Computationalism**, but it smuggles in several highly controversial philosophical assumptions as if they were settled scientific facts.

  Here is a breakdown of that paragraph, the two arguments he half-remembered, and an assessment of whether this is just a verbal dispute.

  ### Part 1: Claim-by-Claim Breakdown
  Here is how a working philosopher of mind or cognitive scientist would likely react to each sentence in your friend's text.

  | Claim from Paragraph | Verdict | Explanation |
  | :--- | :--- | :--- |
  | *"Computationalism is the view that the brain is a computer."* | **Accept (with caveats)** | This is the standard shorthand, though experts prefer "the mind is a computational process" rather than the physical brain *is* a computer. |
  | *"Thinking is information processing: the brain takes inputs, runs them through algorithms, and produces outputs..."* | **Accept** | This is the standard functionalist definition. Most cognitive scientists work under this assumption methodologically. |
  | *"...mental states just are the states of that program."* | **Wince** | This is **Functionalism**. It's a dominant theory, but far from settled. Embodied cognition and enactivist theorists strongly reject this. |
  | *"This is why cognitive science can work at all -- if the brain weren't a computer, you couldn't simulate it."* | **Wrong** | **False Dilemma.** You can study a system without simulating it perfectly (e.g., we study weather without simulating every molecule). Cognitive science could exist as a descriptive science even if the brain isn't computational. |
  | *"Nothing here depends on neurons being like silicon chips; any system that implements the right program has the same mind..."* | **Accept** | This is **Multiple Realizability**, a core tenet of computationalism. It is widely accepted *if* you accept computationalism. |
  | *"...which is why a perfect simulation of you would be you."* | **Wince / Controversial** | This jumps from *functional equivalence* to *numerical identity*. Many philosophers (and laypeople) argue a simulation is a *model*, not the *thing itself*. This is the "Teletransportation Paradox." |
  | *"And the brain has to be a computer, because the Church-Turing thesis says any physically realizable computation can be run on a Turing machine..."* | **Wrong** | **Category Error.** The Church-Turing thesis is about *mathematical functions*, not physics. The **Physical** Church-Turing thesis (that all physical processes are computable) is a hypothesis, not a proven theorem. |
  | *"...and thinking is a physical process."* | **Accept** | Most philosophers are physicalists, but being physical doesn't automatically mean "computable" (see: analog systems, quantum effects). |
  | *"Critics like Searle say a computer just shuffles symbols without understanding... but that's a point about syntax versus semantics, and it doesn't touch the science."* | **Wince** | Dismissing Searle's "Chinese Room" as irrelevant to science is dogmatic. It challenges whether syntax (computation) is sufficient for semantics (meaning), which strikes at the heart of what cognitive science explains. |

  ### Part 2: The Two "Half-Remembered" Arguments
  Your friend is not making these up. Both are famous, serious objections discussed in academic literature.

  **1. The "Rock Implements Everything" Argument**
  *   **Is it real?** Yes. This is known as the **Triviality Argument** or the problem of **Pancomputationalism**. It is most associated with philosophers **Hilary Putnam** and **John Searle**.
  *   **The Gist:** If "computation" is just mapping physical states to logical states, you can map the molecular states of a rock to the states of a WordStar program. If the rock counts as "implementing" the program, then computation is observer-relative (it exists only in the eye of the beholder), not an intrinsic property of the brain.
  *   **The Implication:** If everything is a computer, saying "the brain is a computer" tells us nothing special about the brain. Computationalists try to solve this by adding constraints (e.g., the system must have causal powers), but it remains a major philosophical headache.

  **2. The "Analog and Noisy Neurons" Argument**
  *   **Is it real?** Yes. This is the **Analog vs. Digital** objection.
  *   **The Gist:** Laptops are digital (discrete 0s and 1s). Brains are messy. Neurons fire in continuous time, release varying amounts of neurotransmitters (analog), and rely on noise. Some theorists (like Robert Rosen or Roger Penrose) argue that if the brain relies on non-computable analog processes or quantum effects, a digital Turing machine cannot simulate it, no matter how powerful.
  *   **The Implication:** If the brain is analog, you can't "upload" it to a digital substrate without losing essential information. It would be like trying to play a vinyl record on a calculator.

  ### Part 3: Does the Conclusion Follow?
  Your friend concludes: *"We're computers in the same sense a laptop is, so mind uploading is definitely just an engineering problem."*

  **Does this follow from the true parts?** **No.**

  Even if we grant that the brain processes information (which is true), it does not follow that:
  1.  **Consciousness is substrate-independent.** Just because you can simulate the *function* doesn't mean you replicate the *experience* (the Hard Problem of Consciousness).
  2.  **Identity is preserved.** A perfect copy might be a new person who *thinks* they are you, while you cease to exist.
  3.  **The physics allows it.** If the Physical Church-Turing thesis is false (i.e., nature does things computers can't), uploading is physically impossible, not just an engineering hurdle.

  His conclusion treats a metaphysical gamble as an engineering certainty.

  ### Part 4: Is This Just a Verbal Dispute?
  You asked if your intuition is naive: *"I'm inclined to think the whole debate is a verbal dispute that dissolves once you're clear about what 'computer' means."*

  **Your intuition is not naive; it is philosophically sophisticated.**
  Many contemporary philosophers of computation (like Gualtiero Piccinini) argue exactly this. The debate often stalls because people are using different definitions:

  1.  **Broad Definition:** "Computer" = any system that processes information or changes state based on rules. (Under this, the brain *is* a computer, but so is a thermostat, and so is a storm).
  2.  **Narrow Definition:** "Computer" = a digital, programmable, discrete-state machine like a laptop. (Under this, the brain is likely *not* a computer).

  **Which sentences are doing the real work?**
  If you want to cut through the noise, focus on these two sentences from his paragraph, because they hide the definitional sleight-of-hand:

  1.  *"Nothing here depends on neurons being like silicon chips."*
      *   **Why:** This allows him to claim the brain is a "computer" while ignoring all the ways the brain is *unlike* the computers we actually know how to build (analog, parallel, noisy, non-sequential).
  2.  *"And the brain has to be a computer, because the Church-Turing thesis says any physically realizable computation can be run on a Turing machine."*
      *   **Why:** This is the pivot point. He is defining "physically realizable process" as synonymous with "computation." If you challenge that definition, his whole argument collapses.

  ### Summary for Your Friend
  If you want to reply to him without starting another two-hour fight, try this:

  > "I looked into the paragraph. It's a solid summary of **Strong Computationalism**, but it presents contested philosophy as settled science.
  >
  > 1.  **Church-Turing:** You're conflating the mathematical thesis with the *Physical* Church-Turing thesis, which is unproven.
  > 2.  **Triviality:** The argument you remembered about the rock is real (Putnam/Searle). If computation is observer-relative, saying the brain 'is' one might be meaningless.
  > 3.  **Uploading:** Even if the brain computes, that doesn't prove a simulation is *identical* to the original. That's a metaphysical claim, not an engineering one.
  >
  > You're right that cognitive science *uses* computational models. But whether the brain *is literally* a computer in the laptop sense is still an open question, not a fact."

  **Verdict:** Your friend is arguing for a specific, optimistic philosophical position (Functionalism/Strong AI) but presenting it as empirical fact. You are right to be skeptical of the leap from "the brain processes info" to "I can upload my mind to the cloud."
