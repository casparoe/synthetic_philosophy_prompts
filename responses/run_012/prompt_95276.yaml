      *   *Check Premise (6).* The inference relies on a binary: Satisfied or Not. But justification is usually a spectrum.
      *   *Best Attack:* Attack the **standard of proof** implicit in (2) and amplified by (5). The argument assumes that unless you have *complete* knowledge, you have *no* justification. This is the "Nirvana Fallacy."

