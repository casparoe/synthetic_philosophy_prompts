  # Handout: When Strategy-Stealing Fails

  ### The Games
  **Game 1: Three-Spot**
  Draw three dots in a row (Left, Center, Right). Players alternate claiming one unclaimed dot. The game ends when all dots are claimed. The player who made the **last move** wins.

  **Game 2: Poisoned Three-Spot**
  Draw three dots in a row (Left, Center, Right). Players alternate claiming one unclaimed dot. The game ends when all dots are claimed or someone claims the Center. The player who made the **last move** wins, **unless** you claim the Center dot, in which case you **lose immediately**.

  ***

  ### The Student's Strategy-Stealing Argument
  *Applies to both games identically until the break.*

  "Assume Player 2 (P2) has a winning strategy. Player 1 (P1) makes an arbitrary opening move (say, Left). P1 then ignores that piece and pretends to be P2, following P2's winning strategy for the rest of the game. If the strategy ever calls for playing on Left, P1 plays arbitrarily elsewhere. Since having an extra piece on the board is never a disadvantage, P1 can win using P2's own plan. This contradicts the assumption that P2 wins, so P1 must win."

  ***

  ### Where It Breaks

  **Game 1 (Three-Spot): The Argument Holds**
  *   **Outcome:** Player 1 Wins.
  *   **Proof:** There are 3 moves total. P1 makes move 1, P2 makes move 2, P1 makes move 3. P1 made the last move. P1 wins.
  *   **Status:** The strategy-stealing logic is valid here because claiming a dot never hurts your chances of making the last move; it only reduces the pool of remaining moves by one, preserving the parity advantage.

  **Game 2 (Poisoned Three-Spot): The Argument Collapses**
  *   **Outcome:** Player 2 Wins.
  *   **Proof:** P1 cannot claim Center (instant loss). P1 must claim Left or Right. Suppose P1 claims Left. P2 claims Right. The only remaining dot is Center. P1 is forced to claim Center and loses immediately. P2 wins.
  *   **The Break Point:** *"Since having an extra piece on the board is never a disadvantage..."*
      In Game 2, this premise is false. P1's opening move (Left) is a **liability**. By claiming Left, P1 reduces the available safe moves for themselves. In the hypothetical where P1 "passed" (to steal the strategy), P2 would have been forced to take Left, leaving P1 with Right, forcing P2 to take Center and lose. P1's actual opening move swapped the roles, handing the loss to P1. The extra piece changed the parity of safe moves available, turning a win into a loss.

  ***

  ### Analysis: The Missing Feature

  **The Feature: Monotonicity**
  Strategy-stealing requires the game to be **monotone**: having more pieces (or options) on the board must never be worse than having fewer. Game 1 is monotone (a dot is always good). Game 2 is non-monotone (the Center dot is bad, and claiming side dots forces you toward the Center).

  **If You Add It Back**
  If you revert Game 2 to Game 1 (making the Center dot neutral instead of poisonous), monotonicity is restored. The "liability" of the opening move vanishes, and the strategy-stealing argument correctly predicts a P1 win.

  **How to Save the Argument**
  A proponent of strategy-stealing would rule Game 2 "out of bounds" by adding a **Monotonicity Clause** to the theorem: *"Strategy-stealing applies only to games where an additional move never restricts a player's future winning paths."* They would argue Game 2 is not a true "connection" or "possession" game, but a "avoidance" game disguised as one, violating the spirit of the theorem.
