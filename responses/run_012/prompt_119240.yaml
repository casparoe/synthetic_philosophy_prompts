answer: |-
  Here is the argument, structured to do the heavy lifting you need.

  ### The Look-Away Loophole

  Good's theorem is mathematically sound but sociologically vacuous. It proves that information has non-negative expected value for a Bayesian expected-utility maximizer. The proof relies on a single, silent premise: **the agent retains the option to act as if they never saw the data.**

  In the formalism, you have a set of actions $A$ and a state of the world $W$. You get a signal $S$. The theorem holds because the set of available actions $A$ remains constant regardless of $S$. Even if $S$ suggests a new optimal action $a_{new}$, the old optimal action $a_{old}$ is still available. You can "look away" by simply choosing $a_{old}$. Since you choose the best available action, your expected utility must rise or stay flat.

  The "Look-Away Loophole" is the observation that in almost every high-stakes human context, acquiring the signal $S$ alters the set of available actions $A$. Once you know, you cannot legally, strategically, or psychologically revert to the action you would have taken in ignorance. The theorem isn't wrong; it describes a ghost agent who floats above the world, observing without touching. Real agents are embedded. When they touch the world, the world touches back.

  ### The No-Opt-Out Condition

  You asked if the "no-opt-out" condition is one thing or three. It is **one structural failure** manifesting in three domains.

  The unified condition is this: **The coupling of the information state to the action space.**

  In Good's setup, Action is a function of Information ($A = f(I)$), but the *domain* of available actions is independent of $I$. In the real world, the domain itself shrinks or shifts conditional on $I$. Formally, the available set becomes $A(I)$. If $A(I)$ does not contain the action optimal for "no information," the theorem collapses.

  This coupling happens in three ways:

  1.  **Institutional Coupling (The Protocol):** External rules bind your action to your information state.
      *   *Example:* A doctor. Before a test, she can prescribe Treatment A (the standard). After a positive test result, hospital protocol or liability law mandates Treatment B. She is physically capable of writing the prescription for A, but professionally prohibited. The action "Ignore Test" is removed from $A(I)$.
      *   *EU Status:* Fully compatible with standard Expected Utility. The utility function is standard (patient health); the constraint set is modified by the signal.

  2.  **Strategic Coupling (The Signal):** Other agents react to your information state, effectively removing actions.
      *   *Example:* A salary negotiation. If you don't know your boss's budget, you can ask for a high number and claim ignorance if rejected. If you learn the budget is low, you cannot credibly ask for the high number without revealing you leaked the data. The opponent's counter-move restricts your effective action space.
      *   *EU Status:* Compatible with standard EU, but requires treating the "world" as an active player. Good's theorem assumes a passive world. If the world reacts to your knowledge, the probability distribution $P(World | Action)$ becomes $P(World | Action, Information)$. This violates the theorem's independence assumption.

  3.  **Psychological Coupling (The Burden):** The knowledge itself alters the utility of outcomes.
      *   *Example:* A genetic test for a terminal disease. If you don't know, you live with hope. If you know, you live with dread. The outcome "Death in 5 years" has different utility depending on whether you knew it was coming.
      *   *EU Status:* This requires a modification to standard EU. Standard EU assumes utility depends on world states and actions, not belief states. To model this, you must expand the "world state" to include "Agent knows X." This isn't exotic preference; it's accurate accounting. If the thing you value is "peace of mind," then knowledge is a physical change to the environment you inhabit.

  ### The Hardest Case: Strategic Settings

  The standard defense of Good's theorem is that it calculates *ex ante* value. "Sure, you might regret looking *ex post*, but *ex ante* you knew that risk, so the option to look was still valuable."

  This defense fails in the Strategic Coupling case. Here, the *ex ante* expected value of the information can be genuinely negative, even for a standard EU maximizer.

  Consider a hostage negotiation. You are the negotiator. You have the option to learn the kidnapper's true deadline.
  *   **If you don't look:** You can credibly threaten to walk away tomorrow. The kidnapper, uncertain of your resolve, might cave.
  *   **If you look:** You learn the deadline is in 48 hours. Now you *cannot* credibly threaten to walk away in 24 hours. The kidnapper knows you know. Your leverage evaporates.

  In this scenario, the information changes the game tree. It is not that you *feel* like acting differently; it is that your optimal strategy shifts in a way the opponent anticipates. If you take the option to receive the information, the equilibrium of the game shifts against you *before you even open the envelope*.

  This is not a case of "information isn't free." The cost isn't monetary. The cost is **leverage**. Good's theorem assumes your information is private to your calculation. In strategy, information is often public to the structure of the interaction. If the theorem assumes a single agent against nature, it simply does not apply to games. Claiming it does is like using Newtonian physics to describe a quantum entanglement. The "ex ante" defense fails because the *ex ante* calculation must include the opponent's reaction to your potential knowledge. If that reaction is hostile, the value is negative.

  ### Does It Collapse into "Information Isn't Free"?

  No. This is a crucial distinction.

  *   **"Information isn't free"** implies a transaction cost. $Value = Benefit - Cost$. If Cost > Benefit, don't buy. This preserves Good's logic; it just adds a tax.
  *   **"The Look-Away Loophole"** implies a structural constraint. $Value = Benefit$ subject to Constraint. If the Constraint removes the "ignore" option, the Benefit calculation itself is invalid.

  In the medical protocol case, the test might cost $0. The harm isn't the price of the test; it's that the result forces a treatment the doctor believes is inferior for this specific patient, but is mandated for the "positive test" category. The doctor is forced to act sub-optimally *given the new information*. Good's theorem says you can't be forced to act sub-optimally given the information. The real world says you can.

  ### The Verdict on Standard Expected Utility

  You asked if this requires exotic preferences.

  For **Institutional** and **Strategic** cases, **no**. A standard expected-utility maximizer is harmed by information in these scenarios. The utility function remains standard (money, health, survival). The breakdown occurs in the *constraints* and the *probability model* (passive vs. active world). This makes your argument stronger: you don't need to argue humans are irrational or have weird psychologies. You only need to argue that humans live in institutions and games, not in vacuums.

  For the **Psychological** case, you must concede a small point. To make the math work, you have to admit that "knowledge" is part of the outcome state. However, this is a trivial adjustment. If I care about my own mental state, then my mental state is part of the world. Good's theorem implicitly assumes the agent is a disembodied calculator who doesn't suffer from anxiety. Correcting that assumption doesn't require "exotic" preferences; it requires a complete inventory of what the agent values.

  ### The Unified Story

  The slogan "more information never hurts" is a claim about a specific type of freedom: the freedom to decouple knowledge from action.

  Good's theorem proves that if you are free to ignore the world, observing the world is safe. The "Look-Away Loophole" argues that this freedom is the exception, not the rule.
  *   In **bureaucracies**, rules couple knowledge to action.
  *   In **markets**, opponents couple your knowledge to their counter-moves.
  *   In **families**, biology couples knowledge to emotion.

  The theorem survives only in the narrow corridor where the agent is solitary, unregulated, and emotionally flat. The moment you step out of that corridor, the "option to ignore" vanishes. The theorem doesn't become false; it becomes irrelevant. It describes the value of information for a god who cannot be bound by what he knows. For humans, who are bound by laws, leverage, and love, the value of information is determined not by how much it reveals, but by how much it binds.

  ### Summary for the Piece

  1.  **The Theorem:** Relies on the ability to ignore information (the action space $A$ is constant).
  2.  **The Loophole:** In reality, acquiring info often changes $A$ to $A(I)$.
  3.  **The Condition:** One condition (coupling of info and action), three faces (Institutional, Strategic, Psychological).
  4.  **The EU Check:** Works for standard EU in Institutional/Strategic cases. Requires defining "knowledge" as a state in Psychological cases.
  5.  **The Ex Ante Defense:** Fails in strategic cases where the *option* to know alters the equilibrium negatively.
  6.  **The Cost Distinction:** This is about binding constraints, not transaction costs.

  The punchline: Good's theorem is a proof that ignorance is a luxury good. Most of us can't afford it.
