prompt: |-
  Hi — I'm a junior, I'm on the satire page of my school paper, and this is kind of doing double duty because our philosophy club is also doing a unit on the same thing. We spent like two weeks on Darwin and Turing and the bit I cant stop thinking about is that they both pull the exact same weird move: they explain something that looks like it must involve somebody understanding what theyre doing, by showing how a process that understands nothing at all could produce the same result anyway. Darwin: no designer, just variation plus selection, and yet you get eyes and wings that look designed. Turing: instead of arguing about whether a machine really thinks, he says build one that answers the way a thinker would and stop worrying about the inner lightbulb. My friend keeps calling this "competence without comprehension" and says it's some famous philosopher's phrase but he can't remember whose, so please dont put any real names in what you write — I don't want to get it wrong in print.

  So here's what I want: write me a job advertisement — the recruitment page of a university or research institute's website, deadpan HR voice the entire way through, no winking, no "obviously this is absurd" asides — for a fictional institute that has decided to take competence without comprehension seriously as an actual hiring policy. Call it something like the Institute for Adaptive Competence, or make up a better name yourself. Aim for 500–700 words and use the normal sections: About the Institute, The Role, Who We're Looking For, Our Selection Process, What We Offer, Equal Opportunities, How to Apply. The whole joke has to come from you getting the underlying ideas right rather than from the ad being zany, so somebody who's actually thought hard about Darwin and Turing should wince-laugh and feel like it's fair. Specifically: the "Our Selection Process" section should explain, completely straight-faced, that candidates are hired by blind variation and selective retention, and it should be genuinely vague about who sets the standard doing the selecting — the environment, the committee, the position itself, nobody seems to own it — because that's the spot where I think the whole thing wobbles. "Who We're Looking For" should be Turing-ish but about outputs rather than inner states, something like: we don't ask what you understand, only whether your performance is indistinguishable from that of a colleague who does. And somewhere buried in the fine print I want one throwaway line admitting that the people doing the selecting were themselves selected this way, so nothing anywhere anchors the standard. Also one line where the ad insists its staff "behave as if" they understand and that this is all anyone ever meant by understanding — keep it totally straight and let the reader decide. Dont make the institute stupid or evil, make it sound like a real place with real HR policies, because that's what will make it funny.

  Before you draft, think it through: brainstorm the specific places where "a mindless process produced a mind" quietly slides into "so the mind is mindless" or "so comprehension was never doing any work," then pick the two or three that an HR page can actually dramatize, and only then write the ad. After the ad, give me a JSON block (that part is for me, not part of the ad) with exactly these fields: "institute_name", "word_count", "thesis_satirized" (one sentence — the real position you're pushing to absurdity), "real_ideas_used" (array of the actual Darwin/Turing claims the jokes are built on), "missteps_dramatized" (array of the specific errors the ad commits, like confusing how something originated with how it works), "criterion_problem_line" (paste the line from the ad where the selection standard is left dangling), "tell" (the single line a careful reader would point to as the giveaway that it's ironic), and "steelman" (one sentence on what a serious defender of the view would say the ad gets wrong about them). Keep the JSON valid, and dont let any of it leak into the ad itself.
