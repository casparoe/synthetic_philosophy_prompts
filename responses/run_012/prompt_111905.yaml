answer: |-
  NOTICE: A precise boundary separates reasonable height from excessive height, though its location is not available for public inspection.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: What is the maximum reasonable height?**
  A: The limit exists. Its metric value is unknowable, not due to instrument error, but due to the nature of the limit.

  **Q: If a ten-metre structure is reasonable, is a ten-metre-and-one-millimetre structure reasonable?**
  A: Yes. A single millimetre cannot constitute the difference between reasonable and excessive.

  **Q: Does this apply to repeated increments?**
  A: Yes. By Office reasoning, a structure forty metres taller than an unchallenged one is still, by the office's own reasoning, not tall.

  **Q: Is my building over the limit?**
  A: Staff will reply "Yes" or "No" to the question of whether a building is over the limit, while declining to say which. The statement "either it is over the limit or it is not" is always true, even if neither half is individually assertable.

  **Q: Can I build higher than a designated Tall Structure if I remain shorter than it?**
  A: No. A standing rule states that a building cannot be shorter than a building that is already tall and that it exceeds. This makes the levy effectively unavoidable for any structure surpassing a Tall Structure.

  **Q: Is my case borderline?**
  A: Submit Form C-1 to decide whether a case is clearly borderline. The Office is now drafting Form C-2 to decide whether a case is clearly clearly borderline.

  **FRONT-COUNTER SCRIPT**

  **Customer:** "So, is it over the limit or not?"

  **Staff (Option A):** "The structure exceeds the limit."

  **Staff (Option B):** "It is true that the structure exceeds the limit."

  *Note: Both replies are to be given with equal confidence and never in the same conversation.*

  **Customer:** "But you just said—"

  **Staff:** "Please remit the levy regardless of semantic status."
