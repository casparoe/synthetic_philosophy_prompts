answer: |-
  You adjudicate between correlated causes by identifying binding constraints through comparative counterfactuals, revealing that the Great Divergence and Needham Question are distinct puzzles and that complex causality does not invalidate the inquiry.

  Historians and economists cannot run controlled experiments, so they rely on natural experiments and timing analysis to separate necessary conditions from sufficient ones. For example, if institutions were the sole cause, the Yangzi Delta should have industrialized alongside Britain since it had comparable property rights and market integration; if coal were the sole cause, regions in China with accessible coal should have sparked the Industrial Revolution independently. By looking for cases where a proposed cause exists without the effect (China had coal and markets but no industrialization) or the effect exists without the cause (Belgium industrialized without colonies), scholars identify binding constraints rather than single triggers. This method shifts the focus from finding a magic bullet to mapping a configuration of factors—such as high wages, cheap energy, and specific geopolitical fragmentation—that were individually insufficient but jointly necessary.

  The Needham Question and the Great Divergence are treated separately because scientific knowledge and industrial application are not the same thing. China possessed advanced technology and empirical knowledge without developing Newtonian, mathematical science, while Britain's early industrialization was driven largely by craft innovation and factor prices rather than theoretical breakthroughs. The Industrial Revolution initially relied on substituting capital and energy for labor, a process that could occur without modern science, whereas the Needham Question addresses epistemological and state-structure barriers to theoretical inquiry. Conflating the two assumes technology requires science, but history shows they can decouple; thus, one explanation cannot cover both because the mechanisms of discovery differ from the mechanisms of production.

  Accepting multiple causes does not make the question ill-posed, but it does require shifting from a deterministic framework to a conjunctural one. Complex historical outcomes rarely stem from single variables, so the value of the question lies in understanding why specific factors converged in Britain at that specific time rather than elsewhere. The inquiry remains valid because it forces a precise accounting of which conditions were present, which were absent, and how they interacted, preventing monocausal fallacies while still explaining the unique trajectory of the modern world.
