answer: |-
  Your settlement rule is formally equivalent to a maximin decision rule under ambiguity, so you haven't solved the intertheoretic comparison problem, you've just hidden it behind a veto threshold that amounts to extreme risk aversion. This is the most dangerous objection because it comes from the two decision theorists who have already prepared a representation theorem, and if they successfully reduce your model to a standard ambiguity-aversion framework, your claim to novelty evaporates instantly. They will argue that your 'veto' is merely a non-linear weighting of utilities, which means you haven't escaped the need for cardinal comparability after all; you've just buried it in the structure of the rule. If you cannot distinguish your veto from a utility curvature, the economists will dismiss the model as redundant and the philosophers will see it as a technical solution to a metaphysical problem it doesn't touch.

  ### Q&A Prep Sheet

  **1. The Decision Theorists (Imprecise Probability/Ambiguity)**
  *   **Objection:** 'You claim to avoid intertheoretic comparison, yet your veto threshold imposes a specific trade-off rate between theories. Doesn't your representation theorem just collapse into a Maximin rule over a set of utility functions? If so, you're still assuming those functions are cardinally measurable to determine where the 'median' lies.'
  *   **Reply:** Distinguish between *measuring* value and *constraining* choice. My model doesn't require knowing *how much* better one option is than another within a theory, only the ordinal ranking to find the median. The veto isn't a utility weight; it's a deontological constraint imported into the decision rule. We aren't maximising a function; we're filtering a set.
  *   **Honesty Check:** **Soft.** If they push on how you identify the 'median option' without cardinality, you are on shaky ground. You are basically bluffing that ordinal rankings alone suffice to identify a median without some metric of 'distance' between options. Hope they accept the ordinal defence.

  **2. The Social Choice Economist**
  *   **Objection:** 'Your aggregation rule is vulnerable to cycles and strategic misreporting. If I know my theory has 0.2 credence, I can strategically rank a mediocre option as my 'median' to veto a strong competitor. Furthermore, what happens when the permissible set is empty because every option is vetoed by someone?'
  *   **Reply:** Concede that strategy is a problem for *descriptive* models, but this is *normative*. I'm prescribing how an agent *ought* to report their credences, not how they will. Regarding emptiness: that's a feature, not a bug. It signals moral deadlock where no action is permissible, forcing a revision of credences or theories rather than a forced choice.
  *   **Honesty Check:** **Bluffing.** The 'deadlock' answer is unsatisfying for a decision guide. If the set is empty, the agent cannot act. You have no tie-breaker mechanism. If they press on 'what do I actually do on Tuesday?', you have no answer.

  **3. The Moral Realist / Kantian (Metaethics)**
  *   **Objection:** 'You're treating moral theories as empirical hypotheses subject to probabilistic belief. But moral truths aren't contingent. Having a 0.3 credence that lying is wrong is a category mistake; you either grasp the reason or you don't. This whole programme is built on a confusion.'
  *   **Reply:** Adopt a phenomenological stance. Regardless of metaphysical status, agents *experience* moral uncertainty. My model is a guide for action under that experience, not a claim about the ontology of moral facts. We can bracket the metaethics to solve the practical problem of choice.
  *   **Honesty Check:** **Soft.** This is a standard 'fictionalist' defence, but hardliners will reject it. You are conceding that your model doesn't work for a fully confident agent, which limits its scope.

  **4. The Flatmate (Contract Theory)**
  *   **Objection:** 'This is just a bargaining problem with asymmetric threat points. Why not model it as a Nash bargaining solution where the theories are players? Your veto threshold looks like an arbitrary constraint on the bargaining set.'
  *   **Reply:** Because bargaining implies compromise for mutual gain, whereas moral deliberation is about getting it *right*. The theories aren't agents with interests; they are claims on truth. The veto protects rights, it doesn't maximise joint utility.
  *   **Honesty Check:** **Solid.** This is your strongest ground. The normative force differs from descriptive bargaining.

  ### Strategic Concessions

  **Concede in the first thirty seconds:**
  Admit that the model *looks* like risk aversion and *looks* like bargaining. Say: 'I acknowledge the structural similarities to ambiguity aversion and bargaining models. My claim isn't that the mathematics are entirely unprecedented, but that the *normative justification* for the threshold differs fundamentally.' This disarms the decision theorists and the flatmate by showing you aren't ignorant of their literature, while preserving your core thesis that the *meaning* of the math is different.

  **The One Objection You Must Not Concede:**
  Do not concede that the veto threshold is *just* risk aversion. If you agree that it is merely a parameter for risk attitude, you lose the claim that it solves the intertheoretic comparison problem. You must maintain that the veto is a structural constraint on permissibility derived from the status of the theories, not a reflection of the agent's psychological tolerance for risk. If this goes, the paper becomes a minor technical tweak to expected utility theory rather than a new paradigm.

  **The One Question You Hope Nobody Asks:**
  'If the permissible set is empty, and I must act (e.g., a ticking time bomb scenario), what does your model prescribe?'
  You have no answer for forced choice under total deadlock. If this comes up, you will have to admit the model breaks down in extreme conflict, which undermines its utility as a general guide. Prepare a fallback line about 'lexical priority' or 'emergency protocols', but know that it is ad hoc.
