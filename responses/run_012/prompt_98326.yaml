  I'm in a phil of language seminar and we've been circling Frege's puzzle for like three weeks now and I still cant tell what I actually think, so I definately want a number from you. The claim, stated so it can be true or false: the difference in cognitive value between a true identity of the form 'a = b' and the corresponding 'a = a' is a semantic fact about the two sentences themselves -- they differ in meaning -- rather than a merely pragmatic fact about what they convey or a merely epistemic fact about the speaker's mental state. Give me your credence in that, and please don't just say 'it depends on your theory of meaning'; decompose it. I want rough probabilities for the sub-questions it rests on, like: (i) whether 'cognitive value' is a semantic notion at all, or really belongs to psychology/epistemology; (ii) whether Frege's sense/reference distinction is the best semantic story, versus something Millian-plus-a-pragmatic-story; (iii) whether a Gricean pragmatic account could in principle be complete here, so that the semantics is just plain reference; (iv) whether the puzzle is confined to proper names or shows up equally with definite descriptions, indexicals, and demonstratives; and (v) whatever else you think belongs. One line of justification each, then how they combine into your final number, and tell me which term you're least confident about and what argument or evidence would move it the most.

