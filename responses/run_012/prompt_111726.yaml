answer: |-
  ### The "Dirty Hands" Decision Procedure (Draft v1.0)

  **Purpose:** To evaluate requests for ethical exceptions where a rule violation is justified by the prevention of a greater harm.
  **Time Limit:** 90 Minutes.
  **Operators:** Committee Staff (No philosophical training required).
  **Constraint:** This procedure does not determine what is *legal*; it determines what is *ethically defensible*. If an action is clearly illegal, the procedure stops at Step 1.

  #### Step 1: The Legality and Jurisdiction Threshold (10 Minutes)
  **Question:** Is the proposed action a violation of criminal law, constitutional right, or clear statutory mandate?
  **Sufficient Answer:** A definitive "Yes" or "No" based on counsel's advice, not the member's assurance.
  **Stop Rule:** If the action violates criminal law or constitutional due process (e.g., withholding exculpatory evidence), the procedure ends immediately with a **Flat No**. Ethics cannot bless illegality.
  **Soft Joint:** Distinguishing between a "technical violation" and a "substantive violation." If counsel says it is a "gray area," proceed to Step 2.
  **Improvisation Flag:** This step is administrative, not philosophical. It protects the committee from liability, not necessarily from moral stain.

  #### Step 2: The Crisis Origin Test (15 Minutes)
  **Question:** Did the requester, or their office, contribute to creating the emergency that necessitates this rule violation?
  **Sufficient Answer:** A timeline showing the crisis emerged independently of the office's actions or negligence.
  **Stop Rule:** If the crisis was manufactured by delay, incompetence, or prior unethical bargaining, the procedure ends with a **Flat No**. You cannot claim "necessity" for a fire you lit.
  **Soft Joint:** Determining "negligence." Is it negligence to be busy, or only to be reckless? Staff must judge intent vs. capacity.
  **Thinker Citation:** This adapts **Max Weber's** distinction between an "ethic of ultimate ends" and an "ethic of responsibility"; you are responsible for the foreseeable consequences of your prior inaction.

  #### Step 3: The Necessity and Last Resort Test (25 Minutes)
  **Question:** Is the harm to be prevented imminent, grave, and unavoidable by any ethical means?
  **Sufficient Answer:** Specific evidence of the harm (not speculation) and a list of at least two alternative actions that were attempted or considered and rejected for documented reasons.
  **Stop Rule:** If the harm is speculative (e.g., "might look bad," "could delay") or if a clean alternative exists (even if slower or harder), the procedure ends with a **Flat No**.
  **Soft Joint:** Defining "grave." Is financial loss grave? Is political embarrassment grave? (Hint: Usually no). Is physical safety grave? (Yes).
  **Thinker Citation:** This draws on **Michael Walzer's** condition for "dirty hands": the violation must be necessary to avert a disaster, not merely to secure an advantage.

  #### Step 4: The Proportionality and Victim Test (25 Minutes)
  **Question:** Is the moral cost of the violation proportional to the harm prevented, and is the cost borne by the appropriate party?
  **Sufficient Answer:** A statement identifying exactly who pays the price of the violation. The price must not fall disproportionately on the vulnerable, the voiceless, or a third party uninvolved in the crisis.
  **Stop Rule:** If the cost is shifted entirely to a third party to spare the decision-maker or their ally, the procedure ends with a **Flat No**.
  **Soft Joint:** Weighing incommensurables (e.g., privacy vs. safety). Staff must ask: "If this were public, would the victim's family understand?"
  **Improvisation Flag:** This step is the most subjective. It requires staff to simulate a "veil of ignorance" regarding who holds power.
  **Thinker Citation:** This utilizes **John Rawls'** intuition that inequalities (or burdens) are only just if they do not exploit the least advantaged.

  #### Step 5: The Accountability and Publicity Test (15 Minutes)
  **Question:** Is the requester willing to accept public responsibility for the violation if it were revealed tomorrow?
  **Sufficient Answer:** A signed statement from the member acknowledging the rule broken and accepting the political consequences.
  **Stop Rule:** If the request requires secrecy to remain viable (i.e., it only works if no one finds out), the procedure ends with a **Flat No**.
  **Soft Joint:** Distinguishing between "tactical secrecy" (keeping an operation safe) and "moral secrecy" (hiding shame).
  **Thinker Citation:** This applies **Immanuel Kant's** principle of publicity: an action is unjust if its maxim cannot be publicly disclosed without defeating its own purpose.

  ***

  ### Application to Requests

  #### Case (a): The Unkeepable Promise
  *   **Step 1 (Legality):** Potentially fraud/misconduct. Gray area depending on state statute. **Proceed.**
  *   **Step 2 (Crisis Origin):** The "crisis" is a constituent's need for a permit. Did the Chair create this? No. **Pass.**
  *   **Step 3 (Necessity):** Is the harm (permit delay) grave enough to justify lying to a regulator? No. Is it unavoidable? No. Furthermore, the assurance is *unkeepable*. This is not preventing harm; it is kicking a can. **Fail.**
  *   **Step 4 (Victim):** The cost is borne by the Regulator (deceived) and the Institution (credibility lost). The benefit is private (one constituent). **Fail.**
  *   **Step 5 (Accountability):** Would the Chair admit to lying to a regulator? Unlikely. **Fail.**
  *   **Verdict:** **Flat No.** This is not a dirty hands case; it is a corruption case. The "necessity" is manufactured to solve a political favor, not a moral disaster.

  #### Case (b): Surveillance on Thin Evidence
  *   **Step 1 (Legality):** Depends on state privacy laws. Assume gray area for internal ethics review. **Proceed.**
  *   **Step 2 (Crisis Origin):** Did the member create the threat of violence? No. **Pass.**
  *   **Step 3 (Necessity):** Evidence is "real but thin." Imminence is suspected, not proven. Are there clean alternatives? (e.g., increased police presence at the hearing rather than surveillance). **Fail.** The threshold for "necessity" requires more than suspicion.
  *   **Step 4 (Victim):** The cost is borne by the advocacy group (privacy/chilling of speech). They are the accused. **Soft Joint.**
  *   **Step 5 (Accountability):** Could the member admit to surveilling a group based on thin evidence? If violence occurs, yes. If not, no. **Fail.**
  *   **Verdict:** **Flat No.** The procedure rejects this because the "necessity" is not established enough to override civil liberties. The risk of error (surveilling innocent activists) outweighs the speculative prevention of harm.

  #### Case (c): Withholding Exculpatory Evidence
  *   **Step 1 (Legality):** Withholding evidence helpful to a criminal defense is a *Brady* violation (U.S. Constitution). It is illegal.
  *   **Stop Rule:** **Flat No.**
  *   **Analysis:** Even if we bypassed Step 1 for the sake of ethical argument:
      *   **Step 4 (Victim):** The cost is borne entirely by the defendant (liberty/life). The benefit is to the State (operation security). This is the definition of shifting cost to the vulnerable to spare the powerful.
      *   **Step 5 (Accountability):** This *must* remain secret to work. If revealed, the conviction is overturned.
  *   **Verdict:** **Flat No.**

  ***

  ### The Unpopular Answer

  I expect the procedure to give you an answer you will not like in **Case (c)**.

  You are senior staff; you know the law. But you also know the pressure. When an operation is aimed at a "serious crime" (terrorism, trafficking, corruption), the instinct of the security apparatus is that the *outcome* (stopping the crime) outweighs the *process* (one defendant's rights). The "Dirty Hands" literature often tempts us to believe that saving the many justifies sacrificing the one.

  This procedure refuses that calculus. It tells you that you cannot trade a specific individual's right to a fair trial for the state's operational security, even if the crime is heinous. It forces you to tell a member that they must choose between catching a criminal and maintaining the rule of law, and that ethics mandates the latter. This will feel like tying one hand behind your back while the other hand holds a gun. It is supposed to.

  ### Limitations and Exclusions

  **What this procedure cannot do:**
  1.  **It cannot cure cynicism.** If a member intends to ignore the recommendation, this checklist is just paper. It relies on the committee's power to shame or sanction.
  2.  **It cannot predict the future.** Step 3 relies on assessing "imminent harm." If the staff assesses the risk as low and violence occurs, the procedure will look negligent in hindsight. You must document the *information available at the time*, not the outcome.
  3.  **It cannot resolve value conflicts.** Step 4 is marked as a "Soft Joint." If the committee is split on whether privacy outweighs safety, this procedure does not solve that; it only forces you to admit that is what you are deciding.

  **What cases should never be brought to this procedure:**
  1.  **Purely Personal Gain:** If the "greater good" is a cover for reelection, fundraising, or personal vengeance, do not run the checklist. Reject it at intake.
  2.  **Legal Bright Lines:** Do not use this to debate constitutional rights. If it is a *Brady* violation, a campaign finance violation, or a criminal act, the answer is not "ethically conditional"; it is "illegal." Send those to Counsel, not Ethics.
  3.  **Hypotheticals:** Do not run this on "What if" scenarios. It requires specific facts, specific actors, and specific timelines. Abstract philosophy wastes the 90 minutes.

  **Final Improvisation Note:**
  I have inserted the "Crisis Origin Test" (Step 2) based on practical observation rather than canonical texts. The literature on dirty hands often assumes the disaster is external (a ticking bomb). In legislatures, the disaster is often self-inflicted (a missed deadline, a botched negotiation). A procedure that does not check for self-inflicted wounds will become a machine for laundering incompetence into necessity. I added that shield myself. Use it.
