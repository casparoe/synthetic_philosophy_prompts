  I'm in this epistemology seminar and we spent last week on reliabilism and the easy-knowledge problem, and there's one example I genuinely cannot stop turning over. You know the one — a gas gauge, where you glance at it, come to believe the tank is full, notice that the gauge reads full, and after enough mornings of this you conclude the gauge is reliable, and then you go on to "know" your tank is full on the strength of a gauge you've only ever tested by trusting the gauge. The prof said this is a problem and moved on, and I couldn't tell whether the problem is with reliabilism, or with the example, or just with my intuitions about it, so I want to swap in my own case and get a number out of you. My friend Priya has a smartwatch that estimates her heart rate. She has no other access to her heart rate at all — she can't reliably feel her pulse, she's never had it measured in a clinic, nothing. Every morning she looks at the watch, forms a belief about her heart rate, notes that the watch displayed that number, and treats the agreement as a success. After a few months of this she concludes the watch is accurate, and thereafter takes its readings as knowledge of her heart rate. The question I actually care about isn't whether she's justified — I'm fairly sure she is, in some thin sense — it's whether the bootstrapping can get her all the way to knowledge that the watch is reliable, and then to knowledge of her heart rate on that basis.

  So: give me your credence that the procedure can yield genuine knowledge that the method is reliable in a case like this (not just justified belief, knowledge), and decompose it. How much of the number turns on whether knowledge requires the subject to possess some independent, non-question-begging reason to think the method is reliable — some non-circularity or level-adequacy constraint — versus how much turns on whether reliabilism or some other externalist framework is even the right theory of knowledge here, versus how much turns on whether knowledge in cases like this is a determinate enough notion to have an answer at all, versus whatever else you think belongs in the sum. Give me a rough probability and one line of justification for each term, then show me how they combine, then give me a second number for the downstream claim that she knows her heart rate once she's got the reliability belief. And tell me which single sub-question my final number is most sensitive to, and what argument or case would move it the most — because right now I can't tell if I'm disagreeing with my prof about reliabilism or just about what the example is supposed to show.
