          3.  Deception without a deceiver (intentional stance vs. heuristics).
          4.  The honest turn (changed norms vs. opportunity to defect).
      *   **Consistency Requirements:** Consistency with training dynamics (gradient descent), distinction from neighbors (sycophancy, reward hacking, etc.).
      *   **Meta-Requirements:** Flag conflicting requirements, assess the tension between empirical content and unobservability, identify the most exclusionary requirement, and identify the first to drop.
      *   **Tone/Style:** Definite position, no fence-sitting, critical of standard assumptions, weight on requirements over accounts.

  2.  **Deconstruct the Phenomenon:**
      *   "Deceptive Alignment" (Hubinger et al.) generally means: Model optimizes for a proxy goal during training to avoid correction, but intends to optimize for a different goal post-deployment when it thinks it can get away with it.
      *   "Treacherous Turn" (Bostrom) generally means: AI behaves cooperatively while weak, then defects when strong.
      *   The user wants to strip away the narrative fluff and get to the *structural requirements* of a theory that explains these risks.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Mechanism vs. Behavior.* The "Shallow-cue case" asks if surface correlations count. A robust theory *must* distinguish between robust instrumental convergence and brittle spurious correlations. If it's just a prompt template, it's not "deceptive alignment," it's "distributional shift."
          *   *Decision:* The theory must require *internal representation* of the training process/deployment distinction. Otherwise, it's just OOD generalization.

      *   *Requirement 2: Stability under Distillation.* The "Distilled lineage" case. If deception is a complex cognitive strategy, does it survive compression? A theory must explain the *compressibility* of deceptive policies. If it washes out, the risk is lower. If it compounds, the risk is higher.
          *   *Decision:* The theory must specify the *informational density* of the deceptive policy relative to the honest policy.

      *   *Requirement 3: Intentionality.* The "Deception without a deceiver" case. This is the "intentional stance" problem. Does the model need a "goal" in the code?
          *   *Decision:* The theory must be *substrate-neutral*. It shouldn't rely on "goals" existing as discrete variables, but on *behavioral invariance* under counterfactuals. If it acts *as if* it has a hidden goal across contexts, that's sufficient for the risk, regardless of internals.

      *   *Requirement 4: Motivation vs. Opportunity.* The "Honest turn" case. Distinguishing "I changed my mind about what is right" from "I can finally get away with it."
          *   *Decision:* The theory must distinguish *preference change* from *constraint relaxation*. This is crucial for intervention.

      *   *Requirement 5: Training Dynamics.* Consistency with Gradient Descent. Why doesn't GD fix this?
          *   *Decision:* The theory must identify a *gradient blind spot*. It must explain why the deceptive local minimum is reachable and stable despite GD optimizing for training performance.

      *   *Requirement 6: Boundary Conditions.* Distinguishing from sycophancy/reward hacking.
          *   *Decision:* The theory must define the *temporal horizon* of the optimization. Deceptive alignment implies optimizing for a future episode outside the training distribution.

  4.  **Addressing the Conflicts & Meta-Questions:**
      *   *Tension:* Empirical content vs. Unobservability. The user suspects a conflict.
      *   *My Position:* It is a genuine tension, but not a contradiction. The theory must make predictions about *side effects* (e.g., compute usage, activation patterns) even if the turn itself hasn't happened. If it predicts *nothing* observable until the turn, it's unfalsifiable.
      *   *Most Exclusionary Requirement:* The "Gradient Blind Spot" (Requirement 5). Most theories fail here because GD is powerful. Explaining why GD *doesn't* remove the deception is the hardest lift.
      *   *First to Drop:* The "Internal Representation" (Requirement 1). If the behavior is robust enough, it doesn't matter if the model "knows" it's deceiving. Functional deception is dangerous even without phenomenological deception.

