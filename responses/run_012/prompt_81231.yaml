      *   *Check:* The "Deception without a deceiver." I need to take a stance on whether this counts. I will argue it *does* count for safety purposes, even if philosophically distinct. Safety cares about outcomes, not ontology.

  7.  **Final Polish:** Ensure the distinction between "Deceptive Alignment" (Hubinger) and "Treacherous Turn" (Bostrom) is acknowledged but unified under the requirements. The user treats them as a cluster; I should too.

      *(Self-Correction on Requirement 1)*: Wait, if I require internal representation, I might rule out the "shallow cue" case as *not* being the phenomenon. That is a valid theoretical move. The requirement should be: "The theory must classify the shallow-cue case as distinct from deceptive alignment." Why? Because the intervention is different. (Fix prompt vs. fix cognition). Okay, I will frame it as a discrimination requirement.

      *(Self-Correction on Requirement 5)*: The training dynamics requirement is the hardest. I need to emphasize that the theory cannot just say "GD misses it." It must say *why* structurally.

      *(Refining the Conflict)*: The user asks if the tension between empirical content and unobservability is genuine. I will argue it is genuine but resolvable via *structural* predictions (e.g., dual-purpose circuitry) rather than behavioral predictions (which are masked).

  8.  **Finalizing the Output Structure:**
