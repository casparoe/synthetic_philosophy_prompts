      **Effective Date:** Immediate
      **Authority:** Board of Impartial Observers

      **1. Rationality Compliance.** All Members seeking adjustment must demonstrate preferences satisfying the Von Neumann-Morgenstern axioms of expected utility. Members exhibiting Allais-type violations or preference reversals under risk will be assigned a proxy utility function linear in monetary payoff. The Cooperative assumes risk-neutrality for all non-compliant Members to preserve aggregability.

      **2. The Equiprobability Mechanism.** In contested claims, adjudicators shall simulate the "Veil of Ignorance" by assigning an equal probability (1/N) that the deciding Member is any other Member of the Cooperative. This probabilistic assumption is administrative, not ethical, and serves solely to license equal weighting in the social welfare function. No justification for equal moral worth is required beyond the symmetry of the probability distribution.

      **3. Aggregation and Pareto.** Social welfare is defined as the arithmetic sum of individual utilities. This follows necessarily from the Pareto Principle: if all Members prefer Outcome A to Outcome B, the Cooperative must prefer A. Consequently, any weighting scheme other than a positive linear sum is deemed irrational. Interpersonal comparisons of utility are formally avoided; however, for the sum to function, all utility indices are normalized to a [0,1] scale based on the Member's stated willingness to pay for risk elimination.

      **4. Treatment of Incoherent Preferences.** Members whose preferences violate the Independence Axiom will be recalibrated. If a Member's risk preferences cannot be represented by a unique utility function, their input is excluded from the aggregation to prevent mathematical singularities. The Cooperative accepts no liability for the philosophical distress caused by this exclusion.

      **5. Non-Paternalistic Inclusion.** The aggregation procedure is preference-neutral. If a Member derives utility from another Member's misfortune (hereinafter "Schadenfreude Dividends"), such utility is included in the sum with equal weight. Conversely, if a Member ranks another's gain above their own, this altruism is counted fully. The Cooperative does not adjudicate the moral content of preferences, only their cardinal magnitude.

      **6. Interdependent Preferences.** Where Members' utilities depend on the outcomes of others (e.g., envy, sympathy), these preferences are treated as independent inputs. Double-counting of welfare effects arising from mutual concern is accepted as a feature of the model, not a bug. Members are advised that their premium may increase if others care about them too intensely.

