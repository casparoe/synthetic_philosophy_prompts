answer: |-
  You have not invented this category, but you have put your finger on a specific, subtle variation of a concept that often gets blurred in broader discussions.

  The short answer is that in the field of **Science and Technology Studies (STS)**, this is most closely related to **Bruno Latour's concept of "Delegation,"** but the specific *drift* you are describing—the unintentional hardening of a tool's limitation into a social rule—has a more precise name.

  I propose calling it **Procedural Reification**.

  Here is the breakdown of why that name fits, how it differs from the concepts you already ruled out, and where the boundary lines fall.

  ### 1. The Name: Procedural Reification
  **Reification** (from Marx/Lukács) is the process of treating an abstract social relationship as if it were a concrete, natural thing. When you say objecting to the shift system sounds like "objecting to arithmetic," you are describing reification. The software constraint feels like a law of physics, not a human decision.

  **Procedural** specifies *how* it happened: through the workflow, the interface, or the protocol, rather than through a manifesto or a law.

  So, **Procedural Reification** is: *When a technical constraint, originally implemented for a neutral or narrow purpose, silently absorbs a social norm, erases the history of that norm's negotiation, and presents itself as an immutable fact.*

  ### 2. Why it isn't the other three
  You were right to distinguish this from the usual suspects. Here is the exact delta:

  *   **Vs. Technological Determinism:** Determinism says "The machine changed history." Procedural Reification says "The machine froze a specific local negotiation and hid the evidence." It is micro-political, not historical.
  *   **Vs. The Medium is the Message:** McLuhan is about how media change our *sensory ratios* or cognition (e.g., print makes us linear thinkers). Procedural Reification is about *rules* (e.g., print makes you fill out forms in triplicate). It is bureaucratic, not psychological.
  *   **Vs. Winner's "Do Artifacts Have Politics?":** This is the crucial distinction. Langdon Winner's famous example (Robert Moses' low bridges) relies on **intent**. Someone *deliberately* built the bridge low to stop buses. In your cases, **no one decided** that swaps were forbidden; the system just wouldn't do it, and everyone gave up. Winner is about *embedded* politics; you are describing *emergent* politics.

  ### 3. The Lineage (If you want to read more)
  While "Procedural Reification" captures the *drift*, the mechanism is best described by **Bruno Latour** in his essay *"Where Are the Missing Masses? The Sociology of a Few Mundane Artifacts."*

  Latour argues that we **delegate** morality to objects.
  *   **Human morality:** "Please do not drive fast here." (Easy to ignore).
  *   **Material morality:** "There is a speed bump." (Hard to ignore).

  Latour focuses on the *transfer* of responsibility. Your observation adds the crucial second step: **The Forgetting.** Once the delegation happens, we forget we ever had a choice. Latour calls this **"Black Boxing"**: the inner workings (and the decisions inside them) become invisible, and only the input/output remains.

  ### 4. The Boundary Test
  You asked where it stops. Here is how **Procedural Reification** classifies your examples:

  **Does a Speed Bump count?**
  *   **Verdict:** **No.**
  *   **Why:** This is Latour's classic example of *Intentional Delegation*. The engineers and city planners *deliberately* decided "cars should slow down here" and encoded it in asphalt. There was a moment of decision. In your shift-work case, there was *no* moment where anyone decided "swaps are bad." The bump is a command; your software is a silence.

  **Does a Dress Code count?**
  *   **Verdict:** **No.**
  *   **Why:** A dress code is an explicit social contract. It is written down in a handbook. You can argue against the handbook. In Procedural Reification, there is no handbook entry that says "No Swaps." The rule exists *only* in the tool. If the tool changes, the rule vanishes without a vote.

  **Does a Standard Screw Thread count?**
  *   **Verdict:** **No.**
  *   **Why:** This is a **Technical Standard**, not a Social Norm. It prevents incompatibility, not behavior. It doesn't matter *why* you can't screw a metric bolt into an imperial hole; it's not a moral or bureaucratic judgment, it's physics and geometry. Procedural Reification requires a *social* behavior (swapping shifts, entering after 6pm) to be curtailed.

  **Does a Form Field count?**
  *   **Verdict:** **Yes.**
  *   **Why:** If a web form asks for your phone number and makes it mandatory (red asterisk), but there is no "I prefer not to say" option, the system has reified a norm: *Privacy is less important than contactability.* Nobody voted on that. The designer just didn't build the button. Objecting to it feels like arguing with the form validation script.

  ### 5. Why this distinction matters
  You identified the danger perfectly: *"To object you first have to reconstruct a decision that was never actually taken."*

  This is a form of **governance by attrition**. It is how organizations (and societies) change their rules without the friction of democracy. It is safer for the managers (they can say "I didn't make the rule, the system did") and more exhausting for the workers (who have to fight the "arithmetic" rather than a person).

  If you need a term to use in the wild that isn't academic jargon, **"Policy by Default"** works. But **Procedural Reification** is the precise name for the phenomenon where the tool's limitation becomes the group's morality, and the history of that decision dissolves.

  You haven't invented the category, but you have accurately identified the *unintentional* variant of it, which is often more insidious than the deliberate kind. Winner's bridges are obvious tyranny; your shift roster is invisible bureaucracy.
