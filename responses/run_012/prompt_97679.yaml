answer: |-
  **JOINT STATEMENT ON THE STANDING TO BLAME**
  **Prepared by the Adversarial Collaboration on Normative Authority**

  **Preamble**
  We, the undersigned representatives of two distinct camps regarding the ethics of blame, acknowledge that while we began with opposing intuitions regarding hypocrisy and standing, we share a commitment to the health of our community. This document records the results of our collaboration. It is designed not to force a consensus where none exists, but to clarify the grounds of our disagreement and identify the specific evidence that would resolve it.

  ### Part I: Agreed Claims

  We jointly affirm the following propositions as the common ground upon which our disagreement rests:

  1.  **The Function of Blame:** Blame is not merely an expression of anger; it is a communicative act intended to hold an agent accountable to a shared norm. Its primary purpose is the maintenance of mutual trust and the reinforcement of community standards.
  2.  **The Definition of Standing:** In this debate, 'standing' refers not to the truth of the accusation, but to the *authority* or *permission* of the blamer to issue the criticism. Both camps agree that one can be factually correct yet lack the standing to speak.
  3.  **The Vice of Hypocrisy:** Both camps agree that hypocrisy is a moral defect. A blamer who violates the norm they invoke is guilty of a fault, regardless of whether that fault removes their standing.
  4.  **Distinction of Inconsistency:** We accept the distinction between **concurrent inconsistency** (blaming another for a wrong one is currently committing) and **residual inconsistency** (blaming another for a wrong one committed in the past but has since reformed). We agree these cases merit separate analysis.
  5.  **Uncontroversial Cases:** We agree that standing is clearly absent in cases of *malicious instrumentalisation* (using rules solely as weapons to harm rivals) and *self-exemption* (explicitly claiming the rule applies to everyone *except* oneself).
  6.  **Conditions for Camp 1 (Defeaters) to be Right:** For the claim that hypocrisy defeats standing to hold, it must be shown that the blamer's conduct severs the moral relationship required for the blame to be heard as a legitimate demand rather than an act of domination.
  7.  **Conditions for Camp 2 (Preservers) to be Right:** For the claim that hypocrisy preserves standing to hold, it must be shown that the norm exists independently of the blamer's conduct, and that silencing the hypocrite causes greater harm to the community than allowing the hypocrisy to persist.

  ### Part II: Points of Disagreement

  Where we differ, we have drafted the following statements to ensure each position is represented charitably and accurately, without caricature.

  **Camp 1: The Standing Defeaters**
  > "Blame is a moral conversation that requires a relationship of equality. When a blamer violates the norm they invoke, they place themselves above the person they blame, effectively saying, 'The rule binds you, but not me.' This assertion of superiority forfeits their moral authority. Even if the accusation is true, the hypocrite lacks the *right* to make it because their conduct undermines the mutual respect that makes blame constructive rather than oppressive. To allow hypocritical blame is to license a form of moral domination."

  **Camp 2: The Standing Preservers**
  > "Blame is primarily about the protection of the norm and the victim, not the moral purity of the messenger. While hypocrisy is regrettable, it does not negate the fact that a wrong has occurred. To deny a hypocrite standing is to prioritize the blamer's virtue over the community's safety. If a rule is valid, any member of the community is entitled to invoke it. Silencing hypocrites risks creating 'impunity zones' where wrongdoers escape accountability simply because their accusers are imperfect. The hypocrisy should be criticised, but not at the cost of shielding the original wrong."

  ### Part III: Table of Cruxes

  The following table identifies specific sub-questions where empirical or philosophical resolution would shift the debate. We have pre-registered our predictions regarding how these cases should be judged.

  | Crux | Case / Argument | Agreed Relevance | Camp 1 Prediction (Defeaters) | Camp 2 Prediction (Preservers) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Reformed Wrongdoer** | **Case:** A resident who previously played loud music late at night (but has now stopped) censures a neighbour for doing so today. <br>**Distinction:** Residual Inconsistency. | Tests whether standing is permanently lost by past action or restored by reform. | Standing is **restored**, provided the reform is genuine and acknowledged. The inconsistency is no longer concurrent, so the claim to equality is re-established. | Standing was **never lost**. The validity of the noise rule does not depend on the blamer's history. The reform is irrelevant to the entitlement to blame. |
  | **2. The Systemic Beneficiary** | **Case:** A resident who never breaks the rules themselves but benefits from a culture where others do (e.g., accepts gifts from contractors banned by the co-op). <br>**Distinction:** Complicity without direct violation. | Tests whether 'conduct' includes passive benefit from the wrongs of others. | Standing is **diminished**. Benefiting from the violation makes one complicit. One cannot demand sacrifice from others while profiting from their lack of it. | Standing is **intact**. Personal adherence to the rule is the only metric for standing. Indirect benefit is a separate moral failing that does not void the right to enforce the rule. |
  | **3. The Group Representative** | **Case:** A committee member blames an individual on behalf of the co-op, though the co-op collectively tolerates the same behaviour in other contexts. <br>**Distinction:** Blaming as a role vs. as an individual. | Tests whether standing can be delegated or held collectively even if individual members are implicated. | Standing is **void**. One cannot claim the moral high ground of the 'community' if the community itself is implicated in the wrong. The role does not cleanse the hypocrisy. | Standing is **valid**. The role confers the authority to enforce norms regardless of the group's moral failings. The duty to the office overrides personal or collective inconsistency. |
  | **4. The Definition of Standing** | **Argument:** Is 'standing' a matter of *moral authority* (Camp 1) or *procedural license* (Camp 2)? | Tests whether the disagreement is substantive or merely verbal. | **Verbal Dispute Identified.** We concede that if Camp 2 defines standing merely as 'permission to speak', we agree they have it. But we insist they lack *moral authority*. | **Verbal Dispute Identified.** We concede that if Camp 1 defines standing as 'moral purity', we agree they lack it. But we insist *procedural license* is sufficient for community governance. |

  **Note on Verbal Dispute**
  Upon reviewing Crux 4, the collaboration acknowledges that a significant portion of our disagreement is **semantic**. Camp 1 uses 'standing' to denote *moral authority* (the weight of the speech act), while Camp 2 uses 'standing' to denote *procedural license* (the right to initiate the complaint).

  *   **Resolution:** We agree that for the purposes of the Housing Co-operative Conduct Committee, **procedural license** is the operative definition. A complaint cannot be dismissed solely on the grounds of the complainant's hypocrisy. However, the Committee reserves the right to note the complainant's inconsistency in its deliberations on *severity* and *remedy*, acknowledging Camp 1's concern that hypocritical blame carries less moral weight.

  **Signed,**

  *The Standing Defeaters Camp*
  *The Standing Preservers Camp*

  *Date: 24 May 2024*
