answer: |-
  # The Generational Claim Vetting Procedure (GCV-1)

  **Audience:** HR Business Partners & People Analytics
  **Time:** 20 Minutes
  **Purpose:** To determine if a generational claim is scientifically robust enough for decision-making, or if it should be reframed/rejected.

  ## Part 1: Define the "Kind"
  *Before checking the data, define what you are claiming exists.*

  1.  **Demographic Cohort:** Are we just grouping by birth year (e.g., 1981–1996)?
  2.  **Thick Generation:** Do they share specific formative events (e.g., 9/11, Smartphone adoption) *and* identify with the label?
  3.  **Social Kind:** Does using the label change their behavior (Looping Effect)?
  4.  **Marketing Segment:** Is this just a useful bucket for messaging, regardless of truth?

  *If you cannot define which of these four you are using, STOP. You are making a stereotype claim.*

  ## Part 2: The Data & Causality Check
  *Answer sequentially. If you fail a step, follow the "If No" instruction.*

  **Q1: The APC Test (Age-Period-Cohort)**
  Can you statistically separate the effect of *being young* (Age), *living now* (Period), and *being born then* (Cohort)?
  *   **Sufficient Answer:** Yes, we have longitudinal data or a control group of older workers with the same tenure/role.
  *   **If No:** You are likely measuring Age or Tenure, not Generation. **RENAME CLAIM** to "Early Career" or "New Tenure." (Stop here unless this is a Marketing Segment).

  **Q2: The Boundary & Variance Test**
  Is the difference *between* generations larger than the difference *within* the generation? (e.g., Is the gap between a 1980 and 1981 baby smaller than the gap between two 1995 babies?)
  *   **Sufficient Answer:** Yes, the effect size is significant, and moving the birth year cut-off by 1 year doesn't break the finding.
  *   **If No:** The boundary is arbitrary and the signal is noise. **DO NOT USE FOR INDIVIDUAL DECISIONS.** (You may proceed only if this is a Marketing Segment).

  **Q3: The Mechanism Test (HPC)**
  Is there a causal story for why these properties cluster? (e.g., "Entered workforce during recession" vs. "Just happen to be anxious").
  *   **Sufficient Answer:** Yes, there is a plausible environmental cause linked to the cohort's formative years.
  *   **If No:** This is a correlation without a mechanism. **FLAG AS SPECULATIVE.**

  ## Part 3: The Risk & Values Gate
  *If you passed Part 2, proceed. If you failed Part 2, you must answer these to proceed as a "Marketing/Strategy" bet.*

  **Q4: The Looping Effect Check**
  If we publish this claim, will it make it true? (e.g., Telling Gen Z they are anxious may increase anxiety reporting).
  *   **Sufficient Answer:** Low risk of behavioral change, or the change is desirable.
  *   **If No:** High risk of self-fulfilling prophecy. **REQUIRES CPO APPROVAL.**

  **Q5: The Individual vs. Average Distinction**
  Are we using this to design a program (Average) or evaluate a person (Individual)?
  *   **Sufficient Answer:** Program design only (e.g., benefit menus).
  *   **If No:** We are profiling individuals. **STOP.** (Unless you accept legal/DEI risk).

  **Q6: The Values Call (Human Decision)**
  The data is weak (failed Q1-Q3), but the strategy might still be useful. Who owns the risk?
  *   **Decision:** This cannot be settled by analytics. The CPO or CEO must sign off on acting despite weak evidence.
  *   **Output:** "Analytics flags low confidence; Business accepts risk."

  ***

  # Worked Cases

  ## Case 1: CEO Gen Z Retention Strategy
  **Claim:** "Gen Z has higher turnover because they value purpose over pay. We need targeted benefits for Gen Z to fix retention."
  **Goal:** Approve a specific benefit package for employees born 1997–2012.

  **Run the Procedure:**
  *   **Part 1 (Kind):** Defined as *Demographic Cohort* (Birth years).
  *   **Q1 (APC):** **FAIL.** Our data shows turnover is highest for employees with <2 years tenure, regardless of birth year. Gen Z is currently the group with the most <2 year tenure. We cannot separate Age/Tenure from Cohort.
      *   *Instruction:* Rename claim to "Early Tenure Retention."
  *   **Q2 (Variance):** **FAIL.** Turnover variance within Gen Z (Store A vs. Store B) is 5x larger than the variance between Gen Z and Millennials. The boundary (1997 vs 1996) changes nothing in the data.
  *   **Q3 (Mechanism):** **FAIL.** No evidence "purpose" drives the exit; exit interviews cite scheduling and pay.
  *   **Q4 (Looping):** **HIGH RISK.** Telling Gen Z they are flighty may reduce their commitment.
  *   **Q5 (Individual/Average):** **FAIL.** Targeting benefits by birth year creates unequal pay/benefits for equal work based on age-adjacent proxies. Legal risk.
  *   **Q6 (Values Call):** **REQUIRED.**

  **Outcome:**
  The procedure **blocks** this as a data-driven claim. The science is not there.
  **The Answer You Won't Like:** Because this failed Q1–Q5, it moves to Q6. The procedure *cannot* stop the CEO from doing this. It forces you to classify it as a **Values/Strategy Call**, not an Analytics Call. You must produce a deck that says: *"Data does not support a generational cause; this is a strategic experiment targeting tenure. Analytics recommends tenure-based benefits, but if Leadership insists on Generational branding, you own the legal and efficacy risk."* You lose the ability to say "No" based on truth; you can only flag the risk.

  ## Case 2: Boomer Technophobia
  **Claim:** "Older workers (Boomers) are resisting the new scheduling tool due to generational technophobia. We need Gen Z 'tech buddies' to help them."
  **Goal:** Launch a peer-mentoring program based on generational pairing.

  **Run the Procedure:**
  *   **Part 1 (Kind):** Defined as *Stereotype/Marketing Segment*.
  *   **Q1 (APC):** **FAIL.** Resistance correlates 90% with store location and shift type (full-time vs. part-time), not birth year. Many Boomers use the tool successfully; many Gen Z struggle. This is a Training/UX issue, not a Cohort issue.
      *   *Instruction:* Rename claim to "Role-Based Adoption Support."
  *   **Q2 (Variance):** **FAIL.** Within-group variance (Boomers who love tech vs. hate tech) swamps between-group difference.
  *   **Q3 (Mechanism):** **FAIL.** "Technophobia" is not a homeostatic property of Boomers; it's a function of exposure and tool design.
  *   **Q4 (Looping):** **MEDIUM RISK.** Labeling Boomers as technophobic reduces their confidence and increases resistance.
  *   **Q5 (Individual/Average):** **FAIL.** Pairing based on age risks age discrimination claims.

  **Outcome:**
  **STOP.** Do not launch as a generational program.
  **Recommendation:** Reframe as "Tenure/Role Peer Support." Pair high-adopters with low-adopters regardless of age. The procedure kills the generational label here completely because a better variable (Adoption Score/Role) exists.

  ## Case 3: Press Release "Loneliest Generation"
  **Claim:** "New Survey: Gen Z is the Loneliest Generation."
  **Goal:** External PR to position the company as "understanding young workers."

  **Run the Procedure:**
  *   **Part 1 (Kind):** Defined as *Marketing Segment*.
  *   **Q1 (APC):** **FAIL.** Based on a single cross-section survey. "Loneliness" scores are higher for young people in *every* era (Age effect), not just now (Cohort effect).
  *   **Q2 (Variance):** **UNKNOWN.** Survey sample size too small to test variance boundaries.
  *   **Q3 (Mechanism):** **WEAK.** Attributes loneliness to "social media" without controlling for economic isolation.
  *   **Q4 (Looping):** **CRITICAL FAIL.** Publishing this reinforces the social kind. It tells young workers they *should* be lonely, potentially worsening mental health metrics we track internally.
  *   **Q5 (Individual/Average):** **FAIL.** Implies every young worker is lonely.

  **Outcome:**
  **KILL IT.**
  **Recommendation:** Even though this is external marketing (which usually bypasses Q1-Q3), it fails Q4 (Looping Effect). By publishing this, we actively participate in creating the "Social Kind" of the Anxious Gen Z. This damages our internal DEI goals and employee trust. The procedure dictates a hard "No" because the reputational and internal cultural risk outweighs the PR value.

  ***

  # Summary for the CPO

  *   **Case 1 (Retention):** Data says **No**. Strategy says **Maybe**. You must decide if we want to run an unproven experiment with legal risk. Analytics cannot validate this.
  *   **Case 2 (Technophobia):** Data says **No**. Better variables exist (Tenure/Role). Do not use generational labels.
  *   **Case 3 (Press Release):** Data says **No**. Risk says **High**. Do not publish.

  **Where the Procedure Ends:**
  The procedure settles Cases 2 and 3 definitively. Case 1 is the **Values Call**. The procedure proves the science is weak, but it cannot forbid leadership from making a strategic bet on weak science. That is where your Slack fights will continue, but now you have the documentation to show you flagged the risk.
