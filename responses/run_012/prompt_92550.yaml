answer: |-
  # TRIAGE PROTOCOL: RESTITUTION CASE ASSESSMENT (RCA-01)

  **Authority:** National Advisory Body on Museum Restitution  
  **User:** Case Officer (Non-Specialist)  
  **Time Allocation:** 90 Minutes per File  
  **Constraint:** No new provenance research. Decision based on file evidence only.  
  **Objective:** Separate *Legal Title* from *Moral Entitlement*. Identify *Living Interests*. Flag *Value Judgments* for Panel.

  ---

  ## PART A: THE PROCEDURE

  ### STEP 1: LEGAL TITLE AUDIT (Commitment 1)
  **Question:** Does the holding institution currently hold valid legal title under current domestic law?
  *   **Evidence:** Deeds, accession records, statute of limitations checks, applicable international conventions at time of acquisition vs. now.
  *   **Sufficient Answer:** 
      *   **[A] Clear Title:** Institution holds legal title.
      *   **[B] Clouded Title:** Legal ownership is disputed or voidable.
      *   **[C] No Title:** Institution holds physical custody only.
  *   **Action:** Record finding. **Do not terminate.** Even if [A], proceed to Step 2. (Legal title does not determine moral outcome).

  ### STEP 2: CLAIMANT VALIDITY & LIVING INTERESTS (Commitment 3)
  **Question:** Does the claimant represent a continuity of *living interests* or the rights of a *defunct polity*?
  *   **Evidence:** Governance structure of claimant, demographic continuity, stated purpose of the claim (cultural practice vs. state sovereignty).
  *   **Sufficient Answer:**
      *   **[A] Living Continuity:** Claimant is a community practicing traditions directly linked to the object, or a state acting as proxy for identifiable living citizens' cultural interests.
      *   **[B] Defunct Polity:** Claimant relies solely on historical sovereignty of a state/entity that no longer exists or has no continuity with the current population.
      *   **[C] Competing Living Interests:** Multiple claimants all demonstrate [A].
  *   **Termination:** If **[B]**, recommend **AGAINST RESTITUTION**. Reason: No living interest to benefit. File closed.
  *   **Action:** If [A] or [C], proceed to Step 3.

  ### STEP 3: THE COUNTERFACTUAL TEST (Commitment 2)
  **Question:** Is it plausible that the claimant would hold the object *but for* the specific wrongful act?
  *   **Evidence:** Provenance file, circumstances of removal (theft, duress, unequal exchange, legal but unethical removal).
  *   **Sufficient Answer:**
      *   **[A] Plausible Retention:** Evidence suggests object would have remained with/accessible to the claimant community absent the wrong.
      *   **[B] Speculative/Independent Loss:** Object would likely have been lost, sold, or destroyed regardless of the specific wrong (e.g., war, regime change unrelated to the acquisition).
  *   **Termination:** If **[B]**, recommend **AGAINST RESTITUTION**. Reason: Causation broken. File closed.
  *   **Action:** If [A], proceed to Step 4.

  ### STEP 4: PRESENT INTEREST WEIGHING & TIME LAPSE (Commitment 4)
  **Question:** Do the *present* interests of the claimant outweigh the *present* interests of the holder/public? Does time lapse diminish the claimant's interest or enhance the holder's?
  *   **Evidence:** Usage of object (ritual, display, storage), reliance by holder (exhibition centerpiece), integration into claimant culture *now*.
  *   **Note:** Time lapse is **not** a automatic bar. It counts only if it has created a new, weighty living interest for the holder (e.g., generations have grown up identifying with the object) OR eroded the claimant's living interest (e.g., tradition lost).
  *   **Sufficient Answer:**
      *   **[A] Claimant Interest Dominant:** Object is vital to current practice/identity; holder's interest is generic (education/aesthetics).
      *   **[B] Holder Interest Dominant:** Object is vital to holder's public mission; claimant's interest is symbolic/historical rather than functional.
      *   **[C] Incommensurable:** Both sides assert vital, non-comparable living interests (e.g., Sacred Ritual vs. Universal Heritage).
  *   **Value Handoff:** If **[C]**, **STOP.** Do not recommend. Flag for **PANEL VOTE**. Note: "Question involves weighing incommensurable values."
  *   **Action:** If [A], proceed to Step 5. If [B], recommend **AGAINST RESTITUTION** (Moral).

  ### STEP 5: LEGAL BLOCK CHECK (Commitment 1)
  **Question:** Does current law prevent the morally recommended outcome?
  *   **Evidence:** Step 1 Finding vs. Step 4 Finding.
  *   **Sufficient Answer:**
      *   **[A] Aligned:** Law permits the moral recommendation.
      *   **[B] Blocked:** Law prohibits the moral recommendation (e.g., Moral = Return, Legal = Title Held).
  *   **Action:**
      *   If [A]: Recommend **RESTITUTION**.
      *   If [B]: Recommend **AGAINST RESTITUTION (LEGAL BLOCK)**. 
      *   **Mandatory Annotation:** "Moral Entitlement Established; Legal Title Prevents Transfer." Recommend **ALTERNATIVE REMEDY** (Long-term loan, digital access, co-curation).

  ---

  ## PART B: TEST CASES

  ### CASE 1: THE BENIN REGIONAL HOLDING
  **Facts:** Regional museum holds 10 brass plaques (1897 expedition). 
  **Claimants:** 
  1.  **Royal House:** Traditional rulers, direct lineage to Oba.
  2.  **National Commission:** Federal body, statutory mandate.
  3.  **Descendant Community:** Local guild/diaspora, claims neither Royal House nor State represents their spiritual interests.
  **File Status:** Provenance confirms punitive expedition (Wrongful). UK Law allows disposal if "morally obligated."

  **OFFICER RUN-THROUGH:**

  *   **Step 1 (Legal Title):** Museum holds title. **[A] Clear Title.** (Proceed).
  *   **Step 2 (Living Interests):** 
      *   Royal House: Ceremonial role, state-recognized. **[A] Living Continuity.**
      *   National Commission: State body. **[A] Living Continuity** (Proxy for citizens).
      *   Descendant Community: Active ritual use, rejects others. **[A] Living Continuity.**
      *   *Result:* **[C] Competing Living Interests.** (Proceed).
  *   **Step 3 (Counterfactual):** But for the 1897 raid, would they have the objects? Yes, they would remain in the Palace/Community. **[A] Plausible Retention.** (Proceed).
  *   **Step 4 (Weighing):** 
      *   Royal House: Symbolic authority.
      *   National Commission: National heritage narrative.
      *   Descendant Community: *Active ritual use* (file contains affidavits of current ceremonies requiring replicas because originals are missing).
      *   Museum: Regional attraction, educational.
      *   *Analysis:* The Community's *present functional interest* (ritual efficacy) outweighs the Museum's *generic interest* (education) and the State's *political interest* (sovereignty). Time lapse has not eroded the ritual need.
      *   *Result:* **[A] Claimant Interest Dominant (Descendant Community).** (Proceed).
  *   **Step 5 (Legal Block):** UK Law facilitates transfer to "State" or "Recognized Institution." Direct transfer to an unincorporated Descendant Community creates liability/title vacuum issues.
      *   *Result:* **[B] Blocked.**

  **VERDICT:** 
  **Recommendation:** **AGAINST RESTITUTION (LEGAL BLOCK).** 
  **Annotation:** "Moral Entitlement lies with Descendant Community. Legal framework only recognizes State or Royal House as transferees." 
  **Alternative:** Recommend transfer to National Commission *on condition* of permanent custodianship by Descendant Community (Legal title to State, Moral custody to Community).

  **PHILOSOPHER'S CRITIQUE (Why you might dislike this):** The procedure forces the moral winner (Community) into a legal subordinate position to the State (Commission). It prioritizes administrative executability over the philosophical commitment to *who* actually holds the interest. It risks re-colonizing the object through the State apparatus.

  ***

  ### CASE 2: THE PARTHENON SCULPTURES
  **Facts:** Marbles removed early 19th Century. Authorization granted by Ottoman Imperial Authority (then governing Athens). 
  **Claimant:** Hellenic Republic (Greek State).
  **Goal:** Reunification with building.
  **File Status:** Authorization exists but contested as coercive/invalid. UK Law prevents deaccessioning without Board approval (high bar).

  **OFFICER RUN-THROUGH:**

  *   **Step 1 (Legal Title):** Museum holds title. **[A] Clear Title.** (Proceed).
  *   **Step 2 (Living Interests):** Claimant is the Hellenic Republic. Is this a living interest or a defunct polity?
      *   *Analysis:* The State claims continuity with Ancient Athens. However, Commitment 3 requires *living people's* interests. The State is a proxy. Does the current population have a *living interest* distinct from historical pride? File shows high public sentiment, tourism economy.
      *   *Result:* **[A] Living Continuity** (Accepted as proxy for citizen interest). (Proceed).
  *   **Step 3 (Counterfactual):** But for the removal, would Greece have them? 
      *   *Analysis:* Plausible. However, file notes significant damage occurred *during* the period of Greek independence (war) prior to removal. 
      *   *Decision:* File is ambiguous on whether they would have survived in situ. Officer must default to file evidence. File emphasizes the *removal* as the cause of separation.
      *   *Result:* **[A] Plausible Retention.** (Proceed).
  *   **Step 4 (Weighing & Time):** 
      *   Claimant Interest: Reunification of building, national identity.
      *   Holder Interest: Universal access, preservation record, 200 years of integration into British/European art history narrative.
      *   *Time Lapse:* 200 years. Two centuries of visitors have formed a living interest in seeing them in London. The "Universal Museum" argument posits a living interest for *humanity*, not just the source state.
      *   *Analysis:* The Claimant's interest is largely *symbolic/reconstructive* (the building is a ruin regardless). The Holder's interest is *functional* (current access/preservation). Under Commitment 3 (Present Interests > Defunct Polity Rights), the "Ancient Athens" claim is weak; the "Modern Greece" claim is nationalist. The "Global Public" interest is a living interest.
      *   *Result:* **[B] Holder Interest Dominant.** (Terminate).

  **VERDICT:** 
  **Recommendation:** **AGAINST RESTITUTION (MORAL).** 
  **Annotation:** "While original removal was wrongful, present living interests in global access and preservation outweigh present living interests in national reunification. Time lapse has generated new legitimate interests."

  **PHILOSOPHER'S CRITIQUE (Why you will dislike this):** This verdict weaponizes Commitment 3 against you. By insisting on *present* interests over *historical rights*, the procedure validates the "Universal Museum" argument as a *living interest* that can override the wrong. It treats the wrongful acquisition as a "sunk cost" that has generated new moral facts over 200 years. This contradicts the intuition that the wrong itself generates a duty regardless of subsequent utility.

  ---

  ## PART C: FAILURE MODES (THE MISFIRE LIST)

  **Instruction to Officer:** If a case falls into the following categories, the Procedure **MISFIRES**. Do not apply Steps 1-5. Mark file **"EXCEPTION CLASS"** and refer immediately to Panel.

  ### 1. HUMAN REMAINS
  *   **Reason for Misfire:** Commitment 1 (Title) is category error. Human remains are not property. "Legal Title" is irrelevant; "Custody" is the only question.
  *   **Procedure Break:** Step 1 cannot be answered. Step 3 (Counterfactual) is offensive (would they "hold" the ancestor?).
  *   **Required Action:** Presumptive Return. Do not weigh "Living Interests" of the museum against the dead.

  ### 2. SACRED OBJECTS (ONTOLOGICAL WRONGS)
  *   **Reason for Misfire:** Some objects are wrongfully held not because of *title loss* but because their *nature* is violated by museum custody (e.g., secret ritual objects never meant to be seen).
  *   **Procedure Break:** Step 4 (Weighing) fails. You cannot weigh "Public Education" against "Sacred Secrecy." They are incommensurable. The wrong is ontological, not proprietary.
  *   **Required Action:** Presumptive Return. Do not apply Counterfactual Test (it doesn't matter if they would have sold it; they shouldn't be in a museum *at all*).

  ### 3. GENOCIDAL CONTEXT
  *   **Reason for Misfire:** Where the "wrong" is the attempted eradication of the claimant community, Step 2 (Living Interests) is perverse. The community may be fragmented or diminished *because* of the wrong.
  *   **Procedure Break:** Step 4 would penalize the claimant for the effects of the genocide (diminished living interest).
  *   **Required Action:** Automatic Panel Review. Standard triage cannot calculate interest where the population was targeted for elimination.

  ---

  ## OFFICER CHECKLIST FOR SUBMISSION
  1.  [ ] Legal Title Status Recorded?
  2.  [ ] Living Interest Identified (Not Defunct Polity)?
  3.  [ ] Counterfactual Causation Established?
  4.  [ ] Value Handoff Flagged (if Incommensurable)?
  5.  [ ] Legal Block Annotated (if Moral Yes / Legal No)?
  6.  [ ] Exception Class Checked (Remains/Sacred/Genocide)?

  **END OF PROTOCOL**
