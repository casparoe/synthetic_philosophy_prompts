  The two roommates kept the cactus alive for years by agreeing to water it only if each independently judged the soil critically dry. But when three friends moved in to help share the duty, the cactus died of root rot in a week, because with five independent estimates of the plant's thirst, it was statistically inevitable that one roommate would be optimistic enough to pick up the watering can.

  This punchline depends on the mechanism where the probability of a harmful action increases with the number of agents, driven by the variance in their independent epistemic estimates rather than their motives. The joke would fail if the characters were defecting, because the humor relies on every roommate acting in good faith to save the plant; the disaster occurs not because anyone wanted the cactus dead, but because the group size guaranteed one person's noisy signal would cross the action threshold.
