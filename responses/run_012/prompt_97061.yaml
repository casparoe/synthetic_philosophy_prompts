          *   **Nuance:** While many compatibilists *use* Frankfurt cases, the cases themselves are logically distinct from the determinism debate. A Frankfurt case is usually set up in a *deterministic* way regarding the backup plan (Black's device), but the *actual sequence* (Jones deciding on his own) is often left open or assumed to be indeterministic in some readings to isolate the variable of "alternative possibilities."
