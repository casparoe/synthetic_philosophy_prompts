prompt: |-
  Bit of a weird one, and I'm half convinced I've just confused myself. I'm doing a metaphysics module and I've got to write an essay on Frankfurt cases and the principle of alternative possibilities, and the way I've got the case set up in my head is this: Jones is going to decide to do the thing anyway, but if he'd been about to decide otherwise, Black would have stepped in with his brain-machine and made sure he went ahead and did it. And I keep thinking that this is basically a determinism scenario — Black's gizmo has already fixed the outcome before Jones even starts deliberating, so Jones had no choice in the matter, he was never really free — and yet we still hold him responsible. So the case seems to prove that determinism is perfectly compatable with moral responsibility, which makes me wonder why anyone still says the free will debate is unsettled. And then there's his later stuff about second-order desires and wanting the will you want to have, which as far as I can tell is just the same compatiblist move with more moving parts bolted on.

  So my actual question is this: if the Frankfurt case already shows that a determined agent can be responsible, what's left for the compatibility of free will and determinism to argue about, and why does the second-order-desire business need to exist at all? I'd definately like you to take a position here — tell me straight what I've got wrong and what the case is actually meant to be doing — rather than laying out who says what and leaving me to pick. I need an argument for the essay, not a survey. I did ask my tutor and got twenty minutes of talk about flickers of freedom and the actual sequence, which honestly made things worse rather than better.
