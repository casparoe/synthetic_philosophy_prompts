  Based on the pattern of her past verdicts, your teacher operates not as a formalist (who cares only about shape) nor as a functionalist (who cares only about legibility), but as a **Structuralist**. To her, a letter is not a thing, but a **position within a system**.

  Here is the breakdown of her rule, the rivals, and the decisive test.

  ### 1. The Teacher's Rule: Structural Coherence
  **The Principle:** A glyph is a letter if and only if it maintains **distinctness** from its neighbors and **consistency** with the internal logic of the specific typeface system it inhabits.
  *   **Why it fits the past:**
      *   *Serif vs. Sans:* Both maintain distinctness and internal consistency within their respective systems.
      *   *Stencil/Blackletter:* Legibility is irrelevant; systemic integrity is what matters.
      *   *Halfway 'a'/'e':* Rejected because it collapses the structural difference required to sustain the system.
      *   *Context (Spiky vs. Calm):* A glyph's identity is contingent on the style of the system; a spiky 'a' in a calm face breaks systemic coherence.

  **Her Verdicts on the New Cases:**
  *   **Case A (Latin 'a' = Cyrillic 'а'):** **Verdict: Flawed.**
      *   **Grounds:** While they are historically cognate, a typeface that supports *both* scripts constitutes a single system containing two distinct orthographies. If the glyphs are indistinguishable, the font fails to maintain the structural distinction between the Latin and Cyrillic systems. It violates the "distinctness" principle (like the 'a'/'e' hybrid) at the script level.
  *   **Case B (Rotated 180°):** **Verdict: Valid.**
      *   **Grounds:** Because *every* glyph is rotated, the internal relationships (the difference between 'a' and 'b', the baseline relative to the x-height) remain coherent. The system has shifted, but the structure holds. It is a consistent, if unconventional, system.

  ---

  ### 2. The Rival Rules
  Two other theories fit her previous five verdicts equally well but diverge on the new cases.

  **Rival 1: Genealogical Essentialism**
  **The Principle:** A letter is defined by its **historical lineage** and adherence to the established norms of its script (e.g., baseline orientation, ancestral shapes).
  *   **Fits the Past:** Explains why serif/sans/stencil/blackletter are all 'a's (valid lineages) and why the 'a'/'e' hybrid is not (no ancestor). Explains the "calm face" error as an anachronistic stylistic clash.
  *   **Predictions:**
      *   **Case A:** **Valid.** Latin 'a' and Cyrillic 'а' share a direct genealogical root (Peter the Great's civil script). Identity is permitted by history.
      *   **Case B:** **Invalid.** Rotating the glyph 180° breaks the historical convention of the baseline and vertical stress essential to the Latin script's lineage.

  **Rival 2: Intentional Nominalism**
  **The Principle:** A letter is defined by the **designer's intent and encoding**. If the designer labels a glyph 'a' and encodes it as 'a', it is an 'a', provided they do not fail to distinguish it from a *specific* neighbor in the same set.
  *   **Fits the Past:** Explains all style variations (designer intended them). Explains the 'a'/'e' hybrid (designer failed to commit). Explains the context error (designer made a coherence mistake).
  *   **Predictions:**
      *   **Case A:** **Valid.** The designer encoded them as distinct characters (U+0061 and U+0430); the visual identity is secondary to the intentional label.
      *   **Case B:** **Valid.** The designer intended an inverted face; the intent confers identity.

  ---

  ### 3. The Crucial Experiment
  To distinguish the Teacher's **Structural Coherence** from the rivals, you need a case where **Intent** and **History** allow something that **Structure** forbids.

  **The Case:** A student presents a typeface where the designer has **intentionally made the 'a' and 'e' identical glyphs** (e.g., both are a simple circle), arguing that in their specific constructed language, the sounds have merged, and they have labeled/encoded them distinctly.

  *   **Teacher's Verdict:** **Invalid.**
      *   **Reason:** This directly violates her fourth verdict ("halfway between 'a' and 'e' is neither"). For her, **distinctness is a necessary condition** for letterhood, overriding intent or linguistic reality. A system cannot function if two positions occupy the same space.
  *   **Rival 1 (Genealogy):** **Invalid.**
      *   **Reason:** There is no historical precedent for 'a' and 'e' being identical; it breaks the lineage. (Note: This aligns with the Teacher, so it doesn't separate them).
  *   **Rival 2 (Nominalism):** **Valid.**
      *   **Reason:** The designer intended the merger and encoded them distinctly. Identity is conferred by the label, not the shape.

  **Why this tells them apart:**
  While Case A and Case B separate the Teacher from the Rivals in various pairings, the **"Identical 'a' and 'e'"** case isolates the Teacher's unique commitment to **Internal Distinctness**.
  *   The **Nominalist** accepts it (Intent rules).
  *   The **Teacher** rejects it (Structure rules).
  *   The **Genealogist** rejects it (History rules).

  To fully separate the Teacher from the Genealogist (who agree on this test), you rely on **Case B (Rotation)**.
  *   **Teacher:** Accepts (Systemic coherence preserved).
  *   **Genealogist:** Rejects (Historical norms broken).

  **Summary of the Diagnostic:**
  *   If she accepts the **Rotated Font**, she is not a Genealogical Essentialist.
  *   If she rejects the **Identical 'a'/'e'**, she is not an Intentional Nominalist.
  *   If she does both, she is a **Structuralist**.
