  **Case 1**
  Elena stands before the main circuit breaker of the regional power grid. A massive transformer has just exploded upriver, sending a surge that has already fried the primary coupling; the blackout is physically inevitable and will last for days regardless of any action taken here. Elena is the Senior Grid Operator. Following emergency protocol, she flips the manual isolation switch to secure the line for repair crews. She knows her flip changes nothing about the power loss—the circuit is already dead—but she acts to log the safety state. She acts without malice, at personal cost of overtime and stress, with full knowledge that the outcome (the blackout) is fixed by the prior explosion.

  **Case 2**
  David stands before the same main circuit breaker. The same transformer has exploded upriver; the coupling is fried, and the blackout is physically inevitable and will last for days regardless of any action taken here. David is a visitor who has slipped past security. Wanting to "help" secure the site, he flips the manual isolation switch. He knows his flip changes nothing about the power loss—the circuit is already dead—but he acts to feel involved in the response. He acts without malice, at personal cost of effort and risk, with full knowledge that the outcome (the blackout) is fixed by the prior explosion.

  ***

  **(i) The Differentiating Feature**
  The feature that does the work is **Institutional Authorization**. Elena possesses the normative standing conferred by her role to interact with the mechanism; David lacks it. If we delete this feature—making David an authorized operator acting on his own initiative, or making Elena a trespasser—the verdicts align. If both are authorized, neither is blameworthy for the futile act; if both are unauthorized, both are blameworthy for tampering with critical infrastructure. The asymmetry is felt immediately: we resent the interference of the bystander even when harmless, while we rely on the official to follow protocol even when futile.

  **(ii) The Difference-Making Account**
  A purely difference-making (causal) account of responsibility must conclude that **neither agent is blameworthy** for the blackout, as neither made a causal difference to the outcome. To reach the intuitive verdict (blaming David but not Elena) without smuggling in a difference-making condition, the account cannot appeal to expected consequences (both knew the act was futile) nor to the specific physical outcome. It must instead appeal to **Rule Consequentialism** or **Expressivism**. It would argue that David is blameworthy because his act falls under a rule ("Do not tamper with grid infrastructure") whose general acceptance *would* be harmful, or because his act expresses a disrespectful attitude toward social coordination, whereas Elena's act expresses diligence. However, this struggles: if the account relies on the *general* harmfulness of the rule, it risks blaming Elena too (since general unauthorized flipping is harmful, how does the theory distinguish *her* specific act without referencing her authorization?). To succeed, it must treat the *violation of the norm itself* as the relevant "difference," which edges toward smuggling.

  **(iii) The Counter-Attack**
  A defender of the difference-making account will attack the description of the **Harmful Outcome**. They will argue that the outcome is not merely "the blackout" (the natural state of affairs) but "the blackout *plus the unauthorized intervention*." By redefining the outcome to include the normative status of the act, they claim David *did* make a difference: he caused the world to contain an instance of "unauthorized switching," whereas Elena did not. This attack **merely restates the account** rather than saving it. It succeeds only by trivializing the concept of "consequence" to include any deontic property of the act itself. If every wrong act creates its own "wrongness consequence" that the agent difference-makes, the theory collapses into a tautology where "making a difference" simply means "doing the act," abandoning the substantive constraint that consequences must be independent states of affairs.
