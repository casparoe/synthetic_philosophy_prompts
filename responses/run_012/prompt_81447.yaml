prompt: |-
  so there's something at work I keep bumping into and I want to know what it actually commits us to. I do trust and safety for a mid-size platform. Our integrity policy attributes "intent" to accounts in a pretty specific way. We obviously can't see what anyone was thinking, so instead a moderator can only record an intent finding ("this account intended to deceive") if the behaviour passes two tests. First a perturbation test: we re-run the account's behaviour with the wording, the timing and the target changed, and the same pattern has to reappear; if it only shows up for one exact message at one exact moment we log it as organic or noise and move on. Second a compression test: the intent finding has to let an analyst predict the account's next dozen actions better than a low-level mechanical description of those same actions would; if the click-level account does the job just as well, we're told to drop the intent finding.

  Meanwhile the same document, in a completely different section, says our ranking model has no intentions and no goals, it's "just arithmetic" — even though the second we're debugging it the engineers are all saying things like "it wants to push this up" and "it's trying to keep you watching". And here's the bit that nags me: the intent findings are what get people banned, and the "just arithmetic" framing is what gets the company off the hook when the ranking does something awful.

  There's a third thing. We've got bot networks that would sail through both tests — you can perturb them all you like, the pattern generalises, the intent story predicts them far better than any click-level account — and we still dont call them intentional, we call them "automated". So the two tests clearly can't be the whole story, but nobody will tell me what the rest of the story is.

  I half-remember some pop-philosophy thing from years ago about taking a physical stance versus a design stance versus an intentional stance toward a system. Is that whats going on here, or am I pattern-matching? What I actually want to know is what view about minds, goals and patterns this whole setup presupposes. Is the two-test rule secretly a theory about when a mentalistic description is legitimate, and if so is it realism about those states or more like a useful fiction? Does the practice really need that theory, or would several different views license exactly the same two tests, with the bot-network exception doing all the real work? Is it incoherent to attribute intent to users on this basis while denying it to the model, or is there a principled line I'm missing? And if you swapped the implicit view for a rival one, what in the policy would have to change — would the perturbation test survive, would the compression test, would the ban?

  Please be honest about which bits of this are settled and which are genuinely fought over by people who know the area — I dont want a tidy consensus that isn't actually there. And seperate the parts the practice strictly presupposes from the parts it merely fits well with. Write it as prose, no headings or bullet points or bold or tables, just a normal reply like you'd send someone in an email.
reasoning: |-
