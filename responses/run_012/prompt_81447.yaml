answer: |-
  You are absolutely pattern-matching correctly, and it is impressive that you spotted the philosophical skeleton underneath the policy document without having the terminology ready to hand. What you are describing is almost a textbook application of Daniel Dennett's framework regarding the physical, design, and intentional stances, though with some significant pragmatic distortions introduced by legal liability and operational necessity. To answer your core question directly, the view about minds and goals that your setup presupposes is a form of instrumentalism rather than realism. It treats intent not as a hidden internal substance that we are magically detecting, but as a useful explanatory shortcut that is only licensed when it offers predictive power superior to a mechanical description. However, the way this is applied across users, models, and bots reveals that the policy is not philosophically consistent, but rather strategically inconsistent to serve different ends.

  The two tests you described map neatly onto the conditions Dennett sets for adopting the intentional stance. The perturbation test checks for rationality and consistency across contexts, ensuring that the behavior isn't just a reflex but a strategy adapted to maintain a goal despite changing conditions. The compression test checks for utility, asking whether attributing a belief or desire simplifies the prediction of future behavior compared to tracking every physical click or code execution. If the policy were purely philosophical, this would imply that intent is a real pattern but not necessarily a real internal object. It suggests that having an intent is nothing more than being a system whose behavior is reliably predictable by attributing goals to it. This is the instrumentalist view, and it is widely accepted in cognitive science and philosophy of mind as a viable way to talk about agency without committing to dualism or mysterious mental ghosts. However, this area is genuinely fought over. Realists argue that for intent to be truly attributable, there must be some internal causal mechanism that corresponds to the attribution, whereas instrumentalists argue that if the prediction works, the intent is real enough to talk about. Your policy leans instrumentalist for users, because it relies on external behavior to justify the internal label, but it creates a contradiction when it shifts to a realist requirement for the ranking model.

  The contradiction you noticed regarding the ranking model is the most telling part of this setup. When engineers say the model wants to keep you watching, they are adopting the intentional stance because it is the most efficient way to debug the system. It passes your compression test hands down. Saying the model optimizes for engagement is far more compressive than describing the weight adjustments in the neural net. Yet the policy denies this intent explicitly. This is not a philosophical distinction but a legal and public relations one. Attributing intent to the model creates liability; if the model intends to harm or deceive, the company is more easily held responsible for that intention. Attributing intent to the user justifies bans; if the user intends to deceive, they are culpable. So the practice does not strictly presuppose the instrumentalist theory of mind, because if it did, it would have to attribute intent to the model as well. Instead, the practice presupposes a theory of culpability where intent is a tool for assigning blame to humans and a tool for absolving the platform when applied to its own machinery. The philosophy is being used selectively to manage risk.

  The bot network exception clarifies what is missing from the two tests. If bots pass both the perturbation and compression tests, yet are denied intent, it means the two tests are necessary conditions but not sufficient ones. The missing sufficient condition is the locus of agency. The policy implicitly assumes that for intent to be attributable in a way that warrants a ban, the source of the goal must be the account holder's own cognitive processing, not an external script. This moves the definition away from pure behaviorism and toward a biological or cognitive naturalism where only certain kinds of systems (humans) can be the originators of intent. Bots are viewed as extensions of a human will elsewhere, not as agents themselves. This is why they are automated rather than intentional. This distinction is contested in philosophy. Functionalists would argue that if the bot behaves exactly like an intentional agent, it should be treated as one, regardless of its substrate. Your policy rejects functionalism here, likely because banning a bot for intent is less useful than banning it for being automated; the remedy is different. You block the automation, whereas you ban the human for the violation.

  So to separate what the practice strictly presupposes from what merely fits well with it, the practice strictly presupposes that behavior is the only accessible evidence for intent and that predictive utility is the metric for validating that evidence. It does not strictly presuppose that intent is a real internal state, only that it is a real pattern. The Dennettian framework fits well with this, but so does a strict behaviorist framework that refuses to talk about minds at all and just talks about stimulus-response contingencies. The policy could function without the word intent entirely, replacing it with high-confidence pattern matching. The reason they keep the word intent is likely because it carries moral weight necessary for justifying bans to users and stakeholders. People accept being banned for intent more readily than being banned for statistical anomaly. The theory is doing moral work, not just descriptive work.

  If you swapped the implicit view for a rival one, say a strict biological naturalism where only carbon-based brains can have intent, the perturbation and compression tests would become secondary. You would ban based on evidence of human operation rather than behavioral patterns. The tests might survive as heuristics to detect humans, but they would no longer be the definition of intent. If you swapped to a full functionalist view where any system passing the tests has intent, you would have to admit the ranking model has goals and potentially hold it accountable, or at least stop calling it just arithmetic. You might also have to treat sophisticated bots as intentional agents, which would complicate the enforcement workflow. The ban would likely survive because the outcome is the same, but the justification would shift from you intended this to your system instantiated this pattern.

  Regarding what is settled and what is fought over, it is settled in cognitive science that the intentional stance is a valid predictive tool. It is not settled whether that makes the intentions real or just useful fictions. It is also not settled in law or ethics whether algorithms can be agents. Your company is taking a hard line that they cannot, which is the prevailing legal view but not the prevailing technical view. The incoherence you feel is real. It is incoherent to attribute intent to users on the basis of behavioral patterns while denying it to models exhibiting similar behavioral patterns, unless you introduce a premise that only humans can be agents. That premise is not in your document, but it is doing the heavy lifting. The practice needs a theory of agency to distinguish the user from the model, but the current two-test rule is purely behavioral and cannot do that work alone. The bot exception proves that the behavioral tests are insufficient without a theory of origin.

  Ultimately, the policy is a hybrid creature. It uses an instrumentalist theory of mind to identify bad actors efficiently, but it relies on a human-exceptionalist theory of agency to avoid liability for its own tools. It works operationally because moderators can use the tests to find bad behavior regardless of the metaphysics, but it creates the nagging inconsistency you have identified. If you were to rewrite the policy to be philosophically consistent, you would either have to admit the model has goals or stop claiming users have intent in a mentalistic sense and refer only to behavioral patterns. Neither option is palatable to the business, which is why the current ambiguity persists. The two-test rule is a theory about when a mentalistic description is legitimate for the purpose of moderation, but it is not a theory about when intent exists in reality. It is a threshold for action, not a statement of ontological truth.
