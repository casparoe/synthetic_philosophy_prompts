      *   **The Two Tests:**
          *   *Perturbation Test:* Robustness across context changes. (Is the behavior stable?)
          *   *Compression Test:* Predictive power of the intentional stance vs. mechanical description. (Is "intent" a useful shorthand?)
      *   **The Model:** Denied intent for liability reasons, despite engineers using intentional language pragmatically.
      *   **The Bots:** Pass tests but denied intent because they are "automated" (scripted/external agency?).
      *   **Philosophical Hook:** Daniel Dennett's Intentional Stance.

  3.  **Philosophical Analysis (Dennett & Beyond):**
      *   *Dennett's Stances:*
          *   Physical Stance: Predict based on physical laws (clicks, code).
          *   Design Stance: Predict based on function/design (the algorithm's objective function).
          *   Intentional Stance: Predict based on beliefs/desires (intent to deceive).
      *   *The Two Tests:* These map almost perfectly to Dennett's criteria for adopting the Intentional Stance.
          *   Perturbation = Rationality/Consistency condition (if conditions change, does the agent adapt to maintain the goal?).
          *   Compression = Utility condition (is it simpler to say "wants X" than list every micro-action?).
      *   *Realism vs. Instrumentalism:* Dennett is an instrumentalist (real patterns, but not necessarily internal ghostly states). The policy seems instrumentalist (useful for prediction/moderation) but treats it as real enough for bans (ontological weight).
      *   *The Model Contradiction:* This is the crux. Why deny the model intent? Legally/PR reasons (Section 230, liability). Philosophically, the model *also* passes the compression test (engineers say "it wants"). The distinction is likely not philosophical but legal/ethical.
      *   *The Bot Exception:* Bots pass the tests but are "automated." Why? Because the *source* of the intention is external (the bot creator), not the account itself. This implies a theory of agency requiring *origin* of intent, not just *pattern* of behavior.

  4.  **Addressing Specific Questions:**
      *   *Is it Dennett?* Yes, strong pattern match.
      *   *What view does it presuppose?* Instrumentalism about intent (intent is a useful predictive tool), but with a hidden clause about agency/origin (humans vs. scripts vs. algorithms).
      *   *Realism or Fiction?* Looks like "Real Pattern" instrumentalism. Intent isn't a ghost in the machine, but the pattern is real enough to act on.
      *   *Does practice need the theory?* No. You could arrive at these tests via pure behaviorism without caring about minds. The theory *justifies* the tests, but doesn't *generate* them uniquely.
      *   *Incoherent?* Yes, strictly speaking, if behavior is identical. The distinction between User Intent and Model "Arithmetic" is legally motivated, not philosophically consistent.
      *   *What would change with a rival view?* If you were a strict biological naturalist (only brains have intent), users pass, models/bots fail. If you were a functionalist (anything performing the function has intent), models/bots might pass.

