answer: |-
  I was stranded in the desert, facing the classic Hitchhiker dilemma: a driver would only save me if I promised to pay him $100 upon arrival, but once I was safe in town, I'd have no incentive to actually pay. Knowing he could read micro-expressions, I realized I couldn't just lie; I had to genuinely believe I would pay.

  So, during the ride, I meditated deeply on Parfit's Reductionism. I convinced myself that "I" am not a persisting ego, but merely a series of psychologically connected stages.

  We arrived in town. He held out his hand. "$100."

  I looked him in the eye and said, "Look, I'm not reneging. But strictly speaking, the person who made that promise ceased to exist at the city limits. Personal identity is not a further fact, and there is no deep sense in which *I* am the debtor."

  He nodded thoughtfully, rolled up the window, and said, "Fair enough. And there's no deep sense in which *this* is the car that agreed to let you out."

  Then he drove away.
