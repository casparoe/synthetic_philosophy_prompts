  I've been reading the rationalist blogs and forums for like ten years (LessWrong, the old comment sections, all of it) and I think I'm in the middle of a philosophy argument at work that I keep losing, so I'm asking for help.

  I work at a mid-size e-commerce company. We have a model that picks what shows up on the homepage. Last quarter a gradient-boosted thing we trained found that if it puts the clearance rail above the fold on Tuesday and Wednesday afternoons, click-through goes up about 11%. Nobody told it that. Our data science lead wrote in the strategy doc that the model has "figured out that people are fried midweek and want something cheap and easy to click on." A coworker then wrote an internal post saying the model "understands our users" and "wants them to buy stuff."

  Something about this bugs me. There's no part of the model that has an opinion about anyone being fried. Nowhere in the code is "cheap and easy to click on" written down. It's weights and a loss function. But I also can't just wave it away: the model did latch onto something real, and "people are fried midweek" is a real reason the clicks go up, and the model has to be tracking that reason somehow or it wouldn't keep working on new data. And when I say "it's just statistics" that feels like saying nothing, since everything I do is also just neurons.

  Where it actually bites: I have to review this doc on Thursday. I don't want to be the pedantic guy who makes everyone rewrite "the model wants" into "the model's behavior is consistent with," and I also don't want to sign off on language I think will confuse the whole company about what we're actually building. Mostly I want to know which of us is right, not just which of us is less annoying to work with.

  Also, whatever you tell me has to survive the obvious next case. My kid's school is doing the evolution unit and the teacher said the peacock's tail is "for" attracting mates, and my friend's 9-year-old asked who it's for if the peacock doesn't know it's doing that. Same puzzle, or am I just pattern-matching?

  Here's what I want, in this order:

  1. "Short version" — 2-3 sentences. What you actually think.
  2. "What my coworker is claiming" — 1 paragraph, said back more precisely than either of us has managed.
  3. "Where he's right" — about 200 words.
  4. "Where he's wrong" — about 200 words.
  5. "The distinction I should actually hold onto" — about 150 words. The thing that separates the cases where "wants" is harmless shorthand from the cases where it's a genuine mess.
  6. "What I say Thursday" — 3-5 sentences I could paste into the doc, plus one sentence for if I get outvoted.
  7. "What I'm still getting wrong" — about 100 words, the part of my instinct you'd push back on.

  Please skip the "both descriptions are useful" hand-wave unless you can also give me the rule for when each one is useful. And no reading list, I just want the argument.
