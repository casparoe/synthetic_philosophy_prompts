answer: |-
  # SEMINAR HANDOUT: The Heterogeneity Problem
  ## A Decision Tree for Unifying Pleasure

  **Instructions:** Start at **Q1**. Answer based on your intuition about the **Case** provided. Follow the branch. Do not look at the Theory Leaves until you reach the end. The goal is to find which theory matches *your* judgments about the cases, not to guess the "right" theory.

  ---

  ### Q1: The Common Glow (Phenomenal Necessity)
  **Case:** Compare the **Hot Bath** (sensory relief) to the **Math Proof** (intellectual triumph).
  **Question:** Is there a specific, shared "tingle," "glow," or felt quality present in *both* experiences that makes them pleasures? (Ignore whether you like them; just focus on the raw feel).
  *   **YES:** There is a common hedonic tone. → **Go to Q2**
  *   **NO:** They feel totally different; any similarity is metaphorical. → **Go to Q3**

  ### Q2: The Compelling Pill (Phenomenal Sufficiency)
  **Case:** Imagine a **Compelling Pill**. It induces a specific neural "glow" (the one from Q1). Subjects keep taking it, but when asked, they report: *"It wasn't enjoyable, I just couldn't stop."*
  **Question:** Does the presence of that "glow" alone make it pleasure, even if the subject doesn't like it?
  *   **YES:** The feel is sufficient. → **LEAF A: Single Hedonic Quality**
  *   **NO:** You need the feel *plus* a positive reaction. → **LEAF B: Two-Factor View**

  ### Q3: The Split Attitude (Attitude Necessity)
  **Case:** Consider **Wanting-without-Liking** (addiction/compulsion) vs. **Liking-without-Wanting** (listening to sad music you don't want to continue).
  **Question:** If there is no common "glow" (from Q1), is there still a shared *mental stance* (attitude) toward the experience required for it to be pleasure?
  *   **YES:** Pleasure requires a pro-attitude (liking, wanting, or judging). → **Go to Q4**
  *   **NO:** You can have pleasure without any specific attitude (e.g., pure behavior or function). → **Go to Q5**

  ### Q4: The Attitude's Target (Attitude Identity)
  **Case:** In the **Hot Bath**, when you take your pro-attitude, what is it directed at?
  **Question:** Are you (A) having a conative/affective reaction (desiring it to continue / liking the sensation) OR (B) representing the experience *as good* (a cognitive judgment)?
  *   **(A) Desire:** It's about wanting the state to persist. → **LEAF C: Desire/Satisfaction**
  *   **(A) Liking:** It's about a non-cognitive "liking" distinct from desire. → **LEAF D: Pro-Attitude (Liking)**
  *   **(B) Representation:** It's about judging the object/experience as good. → **LEAF E: Representing-as-Good**

  ### Q5: The Flow State (Consciousness & Access)
  **Case:** Consider a **Flow State** (deep immersion in work) or a **Kid Asleep on Shoulder**. You are not attending to any pleasure *while* it happens.
  **Question:** Can this count as pleasure if the subject is not consciously aware of it *at the time*? (Is pleasure first-personal or observable from outside?)
  *   **YES:** It can be unfelt/unconscious. → **Go to Q6**
  *   **NO:** Pleasure requires conscious awareness. → **LEAF F: Eliminativist/Verbal Dispute** (If no feel, no attitude, and no consciousness, nothing is left).

  ### Q6: The Reason Role (Function vs. Normativity)
  **Case:** Return to the **Compelling Pill**. It causes approach behavior (Functional), but gives you no *reason* to take it (you regret it later).
  **Question:** Is the unity of pleasure defined by (A) what it *causes* (approach/continue) or (B) the *reason* it provides for action?
  *   **(A) Causal/Behavioral:** Whatever plays the "approach-and-continue" role. → **LEAF G: Functional Role**
  *   **(B) Normative:** Whatever provides this specific kind of practical reason. → **LEAF H: Practical Reason Unity**

  ### Q7: The Category Status (Metaphysics)
  **Case:** Imagine science finds no common thread (no feel, no attitude, no function) across all "pleasures," yet we keep using the word.
  **Question:** Is "pleasure" a **Natural Kind** (like *water*, waiting to be discovered) or a **Stipulative Tool** (like *chair*, defined by our use)?
  *   **Natural Kind:** If no unity is found, the concept is broken. → **LEAF F: Eliminativist** (Re-visit if you landed here from Q5).
  *   **Stipulative Tool:** If no unity is found, the concept is just loose. → **LEAF I: Disjunctive/Pluralist**

  ---

  ## THEORY LEAVES (Key)

  *   **Leaf A: Single Hedonic Quality.** (Classic Hedonism). All pleasures share a intrinsic phenomenal quality.
  *   **Leaf B: Two-Factor View.** Pleasure = Hedonic Tone + Pro-Attitude. (Explains why the Pill isn't pleasure).
  *   **Leaf C: Desire/Satisfaction.** Pleasure is the satisfaction of a desire (or the desire for experience to continue).
  *   **Leaf D: Pro-Attitude (Liking).** Pleasure is a distinctive "liking" attitude, separable from desire.
  *   **Leaf E: Representing-as-Good.** Pleasure is a cognitive state representing its object as good.
  *   **Leaf F: Eliminativist/Verbal.** "Pleasure" doesn't pick out a real unified thing; it's a confusion.
  *   **Leaf G: Functional Role.** Pleasure is whatever internal state plays the causal role of reinforcement.
  *   **Leaf H: Practical Reason Unity.** Pleasures are unified solely by the normative reason they provide (The Special Axis).
  *   **Leaf I: Disjunctive/Pluralist.** There are many "pleasures" with no common thread; Hedonism must be reformulated.

  ---

  ## INSTRUCTOR NOTES: LOGICAL SPACE & EMPTY SLOTS

  ### 1. Indistinguishable Leaves
  *   **Desire (C) vs. Liking (D):** These are notoriously hard to separate empirically. Most "Wanting-without-Liking" cases (addiction) are contested; addicts may claim they don't "like" it, but behaviorists argue the craving *is* a form of liking. Your tree forces a choice, but students should know these often collapse into one another.
  *   **Functional Role (G) vs. Practical Reason (H):** Extensionally, these often overlap. If something gives a reason to act, it usually causes action. The distinction is purely metaphysical (Causal vs. Normative). If your students are naturalists, they may not see a gap here.

  ### 2. Empty Slots (Combinations that didn't land)
  *   **Natural Kind + Disjunctive:** (Incoherent). You cannot claim "Pleasure is a natural kind like gold" and also claim "There is no common property across pleasures." If it's a natural kind, there *must* be a unity. This slot is empty because it's logically inconsistent.
  *   **First-Personal + Functional:** (Tense/Unattractive). Functionalism typically relies on third-person observability (behavior/causal role). A view that claims pleasure is *only* visible from the inside (First-Personal) but defines it by its *external* function creates an epistemic gap: How do we know the function is being filled if we can't see the state?
  *   **Quality + Functional:** (Redundant). If you posit a specific "Hedonic Quality" (Leaf A), you usually don't need a Functional definition *unless* you are a Two-Factor theorist. A "Quality-Function" view without an attitude component is just Leaf A with extra steps.

  ### 3. The "Special Axis" (Practical Reason)
  *   **Placement:** I placed this at **Q6**. It is distinct from **Functional Role** (Leaf G) because Functionalism is descriptive (what does the state *do*?), while Practical Reason Unity (Leaf H) is normative (what *justification* does the state provide?).
  *   **Why it matters:** This saves the "Reason" view from being swallowed by Functionalism. The **Compelling Pill** case is the wedge: The Pill fulfills the *Function* (approach) but fails the *Reason* (no justification).

  ### 4. The "Unfelt" Node (Q5)
  *   **Strategic Placement:** This is where many views quietly die. **Quality Theories** (Leaf A) struggle here (how can you feel a quality you don't notice?). **Attitude Theories** (C, D, E) can handle it better (unconscious desires/judgments). **Functionalism** (G) handles it best. If your students insist pleasure must be felt, they eliminate Functionalism and most Attitude theories that allow unconscious states.

  ### 5. Mapping the Required Nodes
  *   *Quality vs. Attitude:* **Q1 & Q3**.
  *   *Intrinsic vs. Relational:* Implicit in **Q1** (Intrinsic feel) vs. **Q3** (Relational attitude).
  *   *Natural Kind vs. Stipulative:* **Q7**.
  *   *First-Personal vs. Functional:* **Q5**.
  *   *Unfelt/Borderline:* **Q5** (Flow) & **Q7** (Borderline cases).
