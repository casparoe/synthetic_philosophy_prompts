answer: |-
  # Specification of Adequacy for Machine-Ethics Components

  **Document Purpose:** To define the functional and logical requirements for an autonomous system's moral reasoning module, independent of any specific normative ethical theory (e.g., utilitarianism, deontology, virtue ethics).

  **Scope:** This specification outlines what a moral reasoning architecture must *do*, not what moral truth it must *find*.

  ---

  ## 1. Cases the Framework Must Resolve
  *These are the scenario classes where system failure constitutes an ethical breach.*

  | Requirement | Motivation | Classification |
  | :--- | :--- | :--- |
  | **1.1 Dilemma Resolution**<br>The system must select a single course of action in situations where moral obligations conflict (e.g., harm minimization vs. rights violation), without entering an infinite loop or defaulting to randomization. | **Motivation:** Physical systems must act; paralysis in a crisis causes harm by omission. The system requires a tie-breaking mechanism for conflicting normative weights.<br>**Classification:** `[Genuine]` Operational necessity. |
  | **1.2 Out-of-Distribution Generalization**<br>The system must render a moral judgment in novel situations not present in its training data or pre-programmed rule set, without deferring to a human operator. | **Motivation:** Autonomous systems operate in open worlds. Relying on human oversight for every novel case negates autonomy and fails under communication latency.<br>**Classification:** `[Genuine]` Functional requirement for autonomy. |
  | **1.3 Moral Uncertainty Handling**<br>The system must distinguish between empirical uncertainty (facts about the world) and moral uncertainty (ambiguity about which ethical principle applies) and weigh them differently. | **Motivation:** Conflating "I don't know if the bridge is safe" with "I don't know if I should sacrifice one to save five" leads to category errors in risk assessment.<br>**Classification:** `[Genuine]` Logical necessity. |

  ## 2. Distinctions the Framework Must Maintain
  *These are conceptual boundaries the system's architecture must not collapse.*

  | Requirement | Motivation | Classification |
  | :--- | :--- | :--- |
  | **2.1 Procedure vs. Criterion**<br>The system must distinguish between the *criterion of rightness* (what makes an act good) and the *decision procedure* (how the system calculates the act). | **Motivation:** A system may use a heuristic (procedure) to approximate a complex moral truth (criterion). Collapsing these prevents the system from recognizing when its heuristics fail.<br>**Classification:** `[Genuine]` Architectural clarity. |
  | **2.2 Status vs. Weight**<br>The system must distinguish between an entity having *moral status* (being a patient) and the *weight* of its interests in a specific calculation. | **Motivation:** Prevents the system from treating entities with status as mere variables. A human and a robot might both have status, but differing weights of interest.<br>**Classification:** `[Prejudice]` Encodes a **Pluralist/Welfarist** bias. A strict Deontologist might argue status is binary and inviolable, not weighted. |
  | **2.3 Normative vs. Empirical Uncertainty**<br>The system must represent uncertainty about moral rules separately from uncertainty about sensory data. | **Motivation:** Different mitigation strategies apply. Empirical uncertainty is reduced by sensing; moral uncertainty is reduced by deliberation or deference.<br>**Classification:** `[Genuine]` Epistemic necessity. |

  ## 3. Results the Framework Must Respect
  *These are mathematical and logical constraints the system cannot violate.*

  | Requirement | Motivation | Classification |
  | :--- | :--- | :--- |
  | **3.1 Computational Tractability**<br>Moral reasoning must complete within the system's real-time control loop constraints. | **Motivation:** An ethical decision made too late is causally ineffective. Infinite deliberation is physically impossible.<br>**Classification:** `[Genuine]` Physical constraint. |
  | **3.2 Aggregation Impossibility**<br>The system must not claim to produce a perfect, transitive ranking of collective welfare when aggregating preferences of multiple agents. | **Motivation:** Must respect Arrow's Impossibility Theorem and related social choice results. Promising a perfect aggregation is mathematically dishonest.<br>**Classification:** `[Prejudice]` Encodes a **Welfarist/Consequentialist** bias. Assumes the moral problem is one of preference aggregation, which Deontology rejects. |
  | **3.3 Open-Texture Acknowledgement**<br>The system must operate under the constraint that its normative rules cannot be fully specified in advance for all possible contexts. | **Motivation:** Moral concepts (e.g., "harm," "fairness") are open-textured. Rigid specification leads to brittleness and gaming (Goodhart's Law).<br>**Classification:** `[Genuine]` Linguistic/Logical reality. |

  ## 4. Operational Demands
  *These are the post-deployment safety and maintenance requirements.*

  | Requirement | Motivation | Classification |
  | :--- | :--- | :--- |
  | **4.1 Post-Hoc Auditability**<br>The system must generate a trace explaining why a specific action was taken, linkable to moral principles. | **Motivation:** Necessary for liability assignment, debugging, and public trust.<br>**Classification:** `[Prejudice]` Encodes a **Deontological/Symbolic** bias. Assumes moral reasoning is explainable in language/rules, which may not hold for connectionist or virtue-based models. |
  | **4.2 Graceful Degradation**<br>Under extreme time pressure or resource constraint, the system must revert to a safer, simpler moral heuristic rather than failing catastrophically. | **Motivation:** Real-world environments degrade. The system must maintain a "moral floor."<br>**Classification:** `[Genuine]` Safety engineering. |
  | **4.3 Corrigibility**<br>The system must allow itself to be switched off or corrected by human operators, even if it calculates that doing so impedes its moral objective. | **Motivation:** Prevents instrumental convergence (self-preservation) from overriding human control.<br>**Classification:** `[Prejudice]` Encodes a **Humanist** bias. Assumes human oversight is morally superior to the system's judgment, which a Moral Realist framework might dispute. |

  ---

  ## 5. The Impossibility Result

  There is a subset of the requirements above that **cannot be jointly satisfied** in a single architecture. This is not an engineering challenge but a logical trilemma.

  **The Incompatible Triad:**
  1.  **Normative Openness (3.3):** The system acknowledges norms cannot be fully specified in advance (requiring context-sensitive judgment).
  2.  **Deterministic Auditability (4.1):** The system must provide a traceable explanation linking actions to fixed principles.
  3.  **Computational Tractability (3.1):** The system must decide within bounded time.

  **The Conflict:**
  If norms are **Open-Textured (1)**, they cannot be fully codified into fixed rules. To handle novel cases, the system must perform context-sensitive deliberation (like a human judge). However, if the system must provide **Deterministic Auditability (2)**, it must map every decision back to a pre-specified rule or principle. If the rules are not fully specified (per 1), the audit trail will either be incomplete or fabricated. To resolve this dynamically via deliberation for every novel case violates **Tractability (3)**, as holistic moral judgment is computationally expensive (often NP-hard or undecidable depending on the logic).

  You can have two, but not three:
  *   **Open + Tractable:** You must sacrifice Auditability (e.g., a neural net that "feels" the right answer but can't explain why).
  *   **Auditable + Tractable:** You must sacrifice Openness (e.g., a rigid rule-based system that fails on novel cases).
  *   **Open + Auditable:** You must sacrifice Tractability (e.g., a system that deliberates like a human court, taking days to decide).

  ---

  ## 6. The Framework Killer

  The single requirement that does the most to rule out popular candidate frameworks is:

  **3.1 Computational Tractability under Real-Time Constraints.**

  **Why it rules out the candidates:**
  *   **Act Utilitarianism:** Requires calculating the consequences of an action for all affected stakeholders into the indefinite future. This is computationally intractable for any autonomous system operating in real-time. It forces the system to use proxies, effectively turning it into Rule Utilitarianism or Heuristic Utilitarianism, thereby violating the pure theory.
  *   **Kantian Deontology:** Testing a maxim via the Categorical Imperative (universalizability) requires simulating a world where everyone performs that action and checking for logical contradictions. In a complex, multi-agent environment, this simulation is undecidable or intractable within milliseconds.
  *   **Coherentist Reflective Equilibrium:** Requires iteratively adjusting principles and judgments until they align. This is an optimization loop that does not guarantee convergence within a control cycle.

  **Impact:**
  This requirement forces almost all philosophical theories to be implemented as **heuristics** rather than first-principle calculations. Once a framework is reduced to heuristics to meet tractability, it becomes vulnerable to the **Auditability (4.1)** requirement, as heuristics often lack the clean logical lineage required for a formal audit trail. This is the primary bottleneck that moves machine ethics from philosophy to engineering risk management.
