prompt: |-
  I'm designing the evaluation criteria for the machine-ethics component of an autonomous system — the part that decides what the system may and may not do — and before we commit to any particular ethical theory, I want the specification of adequacy written down independently of the theory. Write the desiderata: what any framework for implementing moral reasoning in a machine must deliver. Include the cases it has to get right (moral dilemmas it cannot choke on, novel situations outside its training distribution, cases where it is uncertain what the right action is), the distinctions it cannot collapse (between a decision procedure and a criterion of rightness, between having moral status and the weight of that status, between moral uncertainty and empirical uncertainty), the results it must stay consistent with (computational tractability, the known impossibility results for aggregating individual preferences into a collective ranking, the fact that its norms cannot be fully specified in advance), and the operational demands it must meet (auditability after the fact, graceful degradation under time pressure, corrigibility). For each requirement, give the consideration that motivates it, and mark which are genuine desiderata and which are merely the prejudices of one camp. Then tell me which subset of the requirements you believe cannot be jointly satisfied — that is the part I most want — and which single requirement does the most to rule out the popular candidate frameworks. Answer in American English.
