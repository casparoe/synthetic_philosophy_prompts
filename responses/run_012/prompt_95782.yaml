answer: |-
  **Project Title:** Two Logics of Sortition: Descriptive Mirroring versus Procedural Fairness

  **Research Question**
  Do the descriptive and procedural justifications for sortition entail incompatible design prescriptions, and if so, is one justification normatively prior, or can one be reduced to the other?

  **Background and Problem**
  Contemporary defences of sortition often conflate two distinct normative logics. The first is *descriptive*: legitimacy derives from the assembly mirroring the population statistically, allowing the body's decisions to stand in for the people's will. The second is *procedural*: legitimacy derives from the fairness of the selection mechanism itself (equal probability of inclusion), regardless of the resulting composition. While often treated as mutually reinforcing, these logics rest on different premises. Existing treatments leave the tension open by assuming convergence—that a large enough lottery naturally produces a mirror sample. This assumption obscures critical divergences in institutional design. If legitimacy rests on mirroring, a small body is defective; if it rests on fair procedure, a small body is permissible provided the odds were equal. If legitimacy rests on mirroring, stratification is necessary; if on procedure, it may constitute unfair interference. This project seeks to disentangle these logics to determine whether they can coexist within a single institutional framework.

  **Methodology**
  This is a conceptual project requiring no fieldwork. The analysis will proceed in four steps:
  1.  **Formalisation:** Rigorously define the descriptive claim (representation as sample) and the procedural claim (representation as fair opportunity) without relying on convergent assumptions.
  2.  **Design Stress-Testing:** Apply both logics to specific institutional variables to identify divergence points. Key cases include:
      *   *Body Size:* Does the procedural view tolerate a n=100 better than the descriptive view?
      *   *Stratification:* Is quota-based selection a correction for sampling error (descriptive) or a violation of equal chance (procedural)?
      *   *Alternates:* Does replacing a member invalidate the sample (descriptive) or merely continue the lottery (procedural)?
  3.  **The Accountability Test:** Evaluate how each logic handles the lack of re-election. Does the descriptive view require mandated responsiveness to public opinion polls, whereas the procedural view requires only independence?
  4.  **Reduction Analysis:** Attempt to derive the descriptive requirement from the procedural premise (e.g., is mirroring necessary to ensure the lottery was truly fair?). If reduction fails, establish normative priority.

  **Expected Outcomes and Failure Conditions**
  Success entails a typology showing exactly where design choices must favour one logic over the other, accompanied by a normative argument for which logic should prevail in cases of conflict. A successful reduction would demonstrate that one justification is merely instrumental to the other.
  The project fails if: (a) the distinction proves merely verbal, with both logics collapsing into a single principle under scrutiny; or (b) the design implications turn out to be identical across all relevant variables, rendering the distinction practically inert.

  **Feasibility and Timeline**
  Four months is realistic for this scope provided the focus remains on theoretical consistency rather than empirical case studies. The work relies on logical analysis and existing theoretical literature rather than data collection.
  *   **Month 1:** Formalise definitions and map existing conflations in the literature.
  *   **Month 2:** Conduct design stress-tests (size, stratification, alternates).
  *   **Month 3:** Develop the accountability argument and test for reducibility.
  *   **Month 4:** Draft and refine the paper for workshop submission.
  The primary risk is scope creep into empirical validation of citizens' assemblies; this will be avoided by treating real-world assemblies solely as thought experiments for institutional design.
