      *   *Sentence 2:* "Since the chance that any single ballot decides an election is vanishingly small, a rational citizen has no instrumental reason to vote at all — the expected benefit is a fraction of the cost of getting to the polls."
          *   *Analysis:* This is the standard Downsian rational choice explanation. It's the core of the "Paradox of Voting" (turnout).
          *   *Verdict:* **Acceptable.** This is standard rational choice theory (though debated, it's the standard formulation).

      *   *Sentence 3:* "That's the paradox: millions of people do the one thing rationality forbids."
          *   *Analysis:* Accurate summary of the turnout paradox.
