      *   *Sentence 4:* "Political scientists resolved it by showing that voters are expressive rather than instrumental, voting the way fans sing an anthem..."
          *   *Analysis:* "Expressive voting" is a leading theory to solve the turnout paradox. It's not the *only* resolution (civic duty, minimax regret, etc.), but it's a valid mainstream explanation.
          *   *Verdict:* **Acceptable** (with minor qualification that it's *a* resolution, not *the* resolution).

      *   *Sentence 5:* "...and, more radically, that the paradox isn't really about individual voters at all."
          *   *Analysis:* Here is the pivot. The text switches from the Turnout Paradox (Downs) to the Aggregation Paradox (Condorcet/Arrow). This is the "swap" identified in Sentence 1.
          *   *Verdict:* **Distortion/Swap.** It tries to link turnout rationality to social choice incoherence. They are related fields but distinct problems.

      *   *Sentence 6:* "Because majority rule can cycle, there is in general no such thing as the majority's preference, and therefore no such thing as the will of the people that populists keep invoking."
          *   *Analysis:* This refers to the Condorcet Paradox (cycling). If preferences aren't single-peaked, majority rule can cycle (A>B, B>C, C>A). This implies no stable "will."
          *   *Verdict:* **Acceptable (mostly).** It's a strong claim ("in general"), but theoretically sound within social choice theory. The leap to "populists invoking" is rhetorical but defensible for a character.

      *   *Sentence 7:* "Arrow proved that no voting system can satisfy a short list of obviously desirable conditions at once, which is why the more sophisticated people in the field treat majority rule as mathematically impossible..."
          *   *Analysis:* Arrow's Impossibility Theorem is real. However, saying majority rule is "mathematically impossible" is wrong. Majority rule *exists* and works often. Arrow says no ranked voting system can satisfy *all* fairness criteria *always* (specifically with 3+ options). Majority rule is possible, just flawed under specific conditions.
          *   *Verdict:* **Wince/Overstatement.** "Mathematically impossible" is too strong. It's "impossible to guarantee fairness criteria simultaneously."

      *   *Sentence 8:* "...and democracy as valuable for reasons other than its ability to register a popular will."
          *   *Analysis:* This is a normative conclusion many political theorists accept (e.g., democracy as deliberation, protection of rights, etc., rather than just aggregation).
          *   *Verdict:* **Acceptable.**

