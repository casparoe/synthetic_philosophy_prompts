      *   *Decision:* The most robust Moorean defense is to reject **(4)** and **(6)** together, grounded in a robust interpretation of **(1)**. If value is organic, aggregation is suspect. If value is hierarchical, trade-offs are suspect.
      *   *Specific focus:* The colleague's argument assumes that because the *parts* of a unity don't sum to the *whole*, distinct *wholes* *do* sum to a *meta-whole*. This is inconsistent.
