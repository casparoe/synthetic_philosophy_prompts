      *   **(2) Method of Isolation:** Moore definitely holds this. *PE* §1. Intrinsic value is what remains when isolated.
      *   **(3) & (5) Monotonicity:** If $X$ is good, $X+Y$ (where $Y$ is good) is better. This seems implied by "maximize the good."
