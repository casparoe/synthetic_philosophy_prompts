answer: |-
  **Project Title:** The Hermeneutics of Emancipation: Method and Fact in Frederick Douglass's Constitutional Turn

  **Project Overview and Research Question**
  In 1851, Frederick Douglass publicly broke with William Lloyd Garrison, reversing his long-held position that the U.S. Constitution was a "covenant with death and an agreement with hell." Douglass came to argue that the Constitution was, in text and purpose, an anti-slavery document. Historians and legal scholars have long debated this shift. My friend and interlocutor, Devi, argues this was a "switcheroo": Douglass did not discover new facts about the Constitution but swapped interpretive methods—from a historian's focus on framer intent (which yields a pro-slavery document) to a lawyer's focus on textual silence and stated purpose (which yields an anti-slavery one)—solely to enable political participation within the Union.

  This project asks a precise question: **Did Douglass's 1851 reversal represent a change in belief about a *fact* (what the Constitution *is*) or a change in *method* (how the Constitution must be *read*), and is that distinction stable?**

  The hypothesis to be tested is that the distinction between fact and method is not stable in constitutional interpretation. The project argues that Douglass's shift was neither purely cynical opportunism nor purely epistemological discovery, but a recognition that in constitutional law, *method is substantive*. To choose a method of reading is to choose a political ontology. The paper will conclude that the claim "The Constitution is pro-slavery" is indeterminate without an antecedent commitment to an interpretive theory, meaning Douglass and Garrison were not disagreeing about the same object.

  **Intellectual Context: Why Standard Positions Fail**
  Standard jurisprudential categories fail to settle this debate because they presuppose the stability this project questions.
  *   **Originalism:** Sides with Garrison (intent controls), but cannot explain why Douglass found this method normatively bankrupt for a living polity. It treats the "pro-slavery" conclusion as a fact, ignoring the methodological choice required to reach it.
  *   **Textualism:** Sides with Douglass (text controls), but often ignores the historical reality of the Three-Fifths Clause. It treats the "anti-slavery" conclusion as a fact, smuggling in a normative commitment to textual supremacy.
  *   **Legal Realism (The "Switcheroo"):** Sides with Devi. It reduces method to politics. While insightful, it fails to account for the internal coherence of Douglass's new legal argument. If it were purely a switch, Douglass's subsequent legal reasoning would be shoddy; it was not.
  *   **Living Constitutionalism:** Anachronistic. It imposes modern adaptive theories onto a 19th-century debate about fixed compacts.

  This project moves beyond these categories by treating Douglass's shift as a case study in legal hermeneutics. It posits that Douglass realized the Constitution is not a historical artifact to be excavated (Garrison) but a performative speech act to be enacted (Douglass).

  **Methodology and Work Plan**
  The research will be conducted over one semester (14 weeks), culminating in a 6,000-word term paper.

  *   **Month 1: Primary Source Reconstruction.** Close reading of Douglass's *The North Star* editorials (1847–1851), his speech "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" (1860), and Garrison's *The Liberator*. The goal is to map the exact moment the methodological language shifts, not just the political conclusion.
  *   **Month 2: Theoretical Framework.** Engagement with secondary literature on legal interpretation (originalism vs. textualism) and historiography on Douglass. I will focus on scholarship that addresses the "political convenience" critique to ensure Devi's objection is steel-manned.
  *   **Month 3: Drafting.** Writing the argument. The structure will move from the historical case study to the philosophical implication: if method determines fact, then constitutional debate is often a debate about who controls the hermeneutic keys.
  *   **Month 4: Revision.** Refining the thesis to ensure the "determinate answer" requirement is met. The conclusion must definitively state whether the fact/method distinction holds or collapses.

  **Deliverables and Success Criteria**
  *   **Deliverable:** A 6,000-word research paper suitable for submission to an undergraduate journal of law or history.
  *   **Success:** The paper successfully demonstrates that Douglass's argument relies on a specific theory of *what a constitution is* (a promise of future liberty vs. a record of past compromise). It proves that "pro-slavery" is not a property of the text but a relation between the text and a method.
  *   **Failure:** The project fails if it concludes merely that "both sides had a point" or that "interpretation is subjective." It also fails if it cannot distinguish Douglass's legal reasoning from mere political rationalization. If the paper ends up being a biography of Douglass rather than an analysis of his hermeneutics, the scope has drifted.

  **Feasibility and Workload Assessment**
  Is this a semester's worth of work? Honestly, 6,000 words is light for a 14-week semester; typically, this scope demands 8,000–10,000 words. However, the *density* of the theoretical problem compensates for the lower word count. The risk is not running out of work, but getting bogged down in the philosophy of language at the expense of the historical record. To mitigate this, I will cap the theoretical section at 40% of the paper, forcing the argument to remain grounded in Douglass's actual speeches. The project is feasible, but it requires disciplined editing to avoid turning a history paper into a philosophy thesis.

  **Justification for Funding**
  This project is worth funding because it recovers a foundational moment in American legal thought that is often sanitized. We are currently embroiled in national debates over originalism, textualism, and the legitimacy of the Constitution itself. Douglass's 1851 turn is the ur-example of these conflicts. Understanding whether his shift was a "switcheroo" or a substantive jurisprudential breakthrough offers a historical mirror for our own moment: when we argue about what the Constitution means, are we arguing about law, or are we arguing about who gets to decide what counts as law? This research provides the historical granularity needed to answer that question.
