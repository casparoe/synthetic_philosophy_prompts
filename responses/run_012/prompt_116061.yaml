      *Refining the "Most Work" choice:* The user asks what eliminates the most *otherwise attractive* positions. The requirement that **"Collective power cannot be generated through the coercion of individual members or non-members"** is the strongest filter. It kills the closed shop (coerces members), the union shop (coerces fees), and arguably the strike itself if picketing prevents scabs (coerces non-strikers). But the requirement that **"Labor must be able to withhold supply effectively"** kills libertarian contract theory. The tension *between* these two is the engine. I will identify the **Reconciliation of Exclusivity and Dissent** as the specific point of failure.

