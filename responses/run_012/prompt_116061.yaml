answer: |-
  This specification outlines the architectural load-bearing walls for any theory of labor rights. It does not argue for a specific outcome but defines the structural integrity required for a theory to be coherent, empirically adequate, and normatively defensible.

  Per your request, I have marked each requirement as either **[Genuine]** (necessary for logical consistency or empirical adequacy; a theory failing this is incoherent or descriptively false) or **[Side Commitment]** (a contestable normative weighting; a theory failing this is simply unpopular with a specific ideological camp).

  ### I. Explanatory Adequacy (The Cases)
  *An adequate theory must account for these phenomena without ad hoc exceptions.*

  1.  **The Majority Binding Minority Case:** The theory must explain why a majority vote in a bargaining unit binds dissenting minorities to the union's representation and fee structures.
      *   *Consideration:* If the theory cannot justify this, it cannot account for the stability of collective bargaining agreements. If it justifies it too strongly, it violates individual autonomy.
      *   *Status:* **[Genuine]** (Must explain the mechanism); **[Side Commitment]** (Whether this binding is *just* depends on the weight given to majoritarianism vs. individual consent).

  2.  **The Third-Party Harm Case:** The theory must address strikes that inflict severe costs on non-participants (patients, passengers, supply chains).
      *   *Consideration:* A theory that grants an absolute right to strike regardless of collateral damage fails basic tort principles. A theory that forbids strikes causing *any* external harm abolishes the right in essential industries.
      *   *Status:* **[Genuine]** (Must address the externality); **[Side Commitment]** (The threshold of "acceptable harm" is a political valuation).

  3.  **The Antitrust Asymmetry Case:** The theory must explain why workers agreeing to fix the price of labor is protected, while firms agreeing to fix the price of goods is prohibited.
      *   *Consideration:* This is the central economic puzzle of labor law. A theory must distinguish labor from a commodity without relying on semantic fiat.
      *   *Status:* **[Genuine]** (Must provide a principled distinction).

  4.  **The Sovereign Employer Case:** The theory must distinguish between striking against a private firm and striking against the state (which controls the law and the police).
      *   *Consideration:* Striking against the state is inherently political, potentially undermining the democratic process that sets the budget/wages.
      *   *Status:* **[Genuine]** (Must distinguish the counterparty); **[Side Commitment]** (Whether public sector strikes are legitimate is a deep democratic theory disagreement).

  5.  **The Internal Dissent Case:** The theory must account for conflict *within* the union (members striking against union leadership, or leadership striking against member wishes).
      *   *Consideration:* Unions are not monoliths. A theory treating the union as a single agent fails to explain internal coercion or democratic deficits.
      *   *Status:* **[Genuine]** (Must account for internal agency problems).

  6.  **The Replacement/Job Security Case:** The theory must define the relationship between the right to strike and the right to return to work (permanent replacement vs. reinstatement).
      *   *Consideration:* A right to strike without job protection is a right to quit. A right to strike with guaranteed reinstatement is a right to breach contract without penalty.
      *   *Status:* **[Genuine]** (Must define the legal consequence); **[Side Commitment]** (The balance of risk between capital and labor).

  ### II. Conceptual Integrity (The Distinctions)
  *An adequate theory must not collapse these concepts. Collapsing them renders analysis impossible.*

  1.  **Organize vs. Bargain vs. Strike:**
      *   *Consideration:* One can exist without the others. (e.g., Right to organize without right to bargain; right to bargain without right to strike).
      *   *Status:* **[Genuine]** (Conceptual distinction).

  2.  **Individual Association vs. Group Standing:**
      *   *Consideration:* The right to join a club is not the same as the right of that club to be the exclusive legal agent for a workplace.
      *   *Status:* **[Genuine]** (Legal distinction).

  3.  **Right (Claim) vs. Permission (Liberty):**
      *   *Consideration:* A *right* implies a duty on others (e.g., employer cannot fire). A *permission* implies no penalty but no protection (e.g., employer can fire, but striker isn't jailed).
      *   *Status:* **[Genuine]** (Hohfeldian distinction).

  4.  **Withholding Labor vs. Preventing Supply:**
      *   *Consideration:* Quitting is individual. Picketing that physically blocks others is coercive. Mass picketing sits on the boundary.
      *   *Status:* **[Genuine]** (Physical/Logical distinction).

  5.  **Right to Withhold vs. Right to Job:**
      *   *Consideration:* As noted in Case 6, these are separable. One is a liberty right, the other is a property/contract right.
      *   *Status:* **[Genuine]** (Conceptual distinction).

  ### III. Normative Constraints (The Values)
  *Here is where the theory is tested against moral intuitions. Note the markings carefully.*

  1.  **Non-Coercion of Dissenters:** No individual should be compelled to fund or associate with an organization against their will.
      *   *Status:* **[Side Commitment]** (Libertarian/Classical Liberal priority).
      *   *Consideration:* This is the primary weapon against the "Union Shop."

  2.  **Collective Efficacy:** The right to organize must deliver actual bargaining power, not just a theoretical right to meet.
      *   *Status:* **[Side Commitment]** (Labor/Solidarist priority).
      *   *Consideration:* This is the primary weapon against "Right-to-Work" regimes.

  3.  **Democratic Legitimacy:** The union's authority must derive from the consent of the governed (the workers).
      *   *Status:* **[Genuine]** (Required for any theory claiming to be democratic).
      *   *Consideration:* However, *how* consent is aggregated (simple majority, supermajority, continuous opt-in) is a **[Side Commitment]**.

  4.  **Economic Neutrality:** The law should not tilt the playing field toward labor or capital; it should merely enforce contracts.
      *   *Status:* **[Side Commitment]** (Neoclassical/Market priority).
      *   *Consideration:* Labor law is historically explicitly *non-neutral* (designed to correct power imbalance). A theory demanding neutrality may reject the premise of labor law itself.

  5.  **Public Order:** The state retains the monopoly on violence and essential services; strikes cannot threaten public safety or sovereignty.
      *   *Status:* **[Genuine]** (Required for state continuity).
      *   *Consideration:* The definition of "essential" is a **[Side Commitment]**.

  ### IV. The Turn Against Itself (The Core Tension)

  You suspected the requirement to respect the dissenting worker sits badly with the requirement that organizing deliver power. You are correct. This is the **Impossibility Theorem of Exclusive Representation.**

  **The Contradiction:**
  1.  **Premise A (Efficacy):** To bargain effectively, labor must act as a monopoly seller of labor within a unit (preventing undercutting by non-members). This requires **Exclusive Representation** and **Financial Security** (dues).
  2.  **Premise B (Consent):** To respect individual liberty, no person should be bound by a contract they did not sign, nor fund speech they oppose. This requires **Voluntary Association** and **No Compulsory Dues**.
  3.  **The Conflict:** If you satisfy Premise B fully, Premise A collapses (Free Rider Problem destroys bargaining power). If you satisfy Premise A fully, Premise B collapses (Minority coercion).

  **The Trade-Offs (Least Bad Options):**
  *   **Option 1: The Majoritarian Compromise (Wagner Act Model).** Prioritize Efficacy. Dissenters are bound by the contract and must pay fees (or at least cannot opt out of representation), but they get voting rights and duty of fair representation.
      *   *Cost:* Violates individual consent.
  *   **Option 2: The Voluntarist Compromise (Right-to-Work).** Prioritize Consent. Dissenters can opt out of dues and membership.
      *   *Cost:* Cripples Efficacy (unions become underfunded voluntary clubs); creates a "free rider" class that benefits from union negotiation without paying.
  *   **Option 3: Sectoral Bargaining (European Model).** Move the unit from the *workplace* to the *industry*. Unions and Employer Associations set wages for the sector.
      *   *Cost:* Reduces workplace-specific democracy; requires high union density to function; shifts power to union bureaucracy.
  *   **Option 4: Members-Only Bargaining.** Unions bargain only for their members.
      *   *Cost:* Creates multiple classes of workers in one plant; administratively chaotic; employer can play factions against each other.

  **What You Are Missing:**
  You are missing the **Duty of Fair Representation (DFR)** as a potential bridge. In the US model, the coercion of the minority (they must accept the union) is theoretically offset by the legal constraint on the union (it must represent them fairly without hostility).
  *   *Why it might fail:* DFR is hard to enforce. A union can neglect dissenters subtly. It solves the *financial* free-rider problem but not the *political* coercion problem.

  ### V. The Single Requirement That Does The Most Work

  If you must choose one requirement to test theories against, it is this:

  **"The theory must justify why the collective entity (the union) has the legal standing to bind the individual member to an agreement regarding the individual's own labor property, without that individual's specific, continuous consent."**

  **Why this eliminates the most attractive positions:**

  1.  **It eliminates Pure Libertarianism:** Libertarian theory generally holds that I cannot sell your labor, nor can a majority vote sell your labor. It cannot account for the binding nature of a Collective Bargaining Agreement (CBA) on a dissenting worker without admitting a form of contractual servitude.
  2.  **It eliminates Pure Solidarism:** A theory that says "The Class is the Agent" fails to explain why the individual has *any* recourse if the union acts negligently. It collapses the distinction between the member and the organization.
  3.  **It eliminates Naive Contract Theory:** Standard contract law requires mutual assent. The CBA binds non-signatories. A theory relying on standard contract principles cannot explain the legal status of the union without creating a special legal fiction.
  4.  **It eliminates "Pure Democracy" Models:** If every worker must consent continuously, the union cannot strike or close a deal (holdout problem). If majority rule suffices, you must explain why labor law is the *only* place where majority rule overrides individual property rights in a private contract context.

  **Scoring Instruction:**
  Any theory that treats the union as a standard voluntary association will fail the **Efficacy** test. Any theory that treats the union as a sovereign government over the workplace will fail the **Consent** test. The only surviving theories will be those that posit a **sui generis** legal status for labor—a "constitutional" exception to standard private law—and they must explicitly defend why this exception exists without violating the broader legal order.

  If a theory cannot explain why labor is not a commodity *and* why the union is not a state, it will collapse under the weight of this requirement.
