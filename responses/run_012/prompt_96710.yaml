answer: |-
  1. **Conceptual Impossibility vs. Rarity**
  You argue that state apologies for historical wrongs are constitutive acts because the uptake condition cannot be met by the dead. But if uptake is a necessary condition for the concept 'apology', aren't you arguing these acts are conceptually impossible *as apologies*, rather than being a merely rare subclass? What theoretical work is the distinction between 'impossible' and 'rare' doing for you here, and why retain the label 'apology' at all if the necessary conditions are absent?

  *Follow-up:* You will likely say that retaining the label preserves continuity of discourse. But if the normative structure is fundamentally different—specifically, that no debt is discharged—isn't this merely metaphorical? Why not call it 'atonement' or 'reform' to avoid the confusion, unless the ambiguity itself serves a political function you haven't accounted for?

  2. **Sincerity vs. Official Orthodoxy**
  On your view, a genuine constitutive apology and a cynical declaration of new official orthodoxy both alter what the polity treats as authoritative. What is the observable distinction between the two? If the normative output is identical, does the internal state of sincerity matter, or is it merely a private qualia with no public significance?

  *Follow-up:* I anticipate you'll say sincerity binds the agents internally. But binding them how? If the state machinery enforces the new norm regardless of the speaker's intent, what causal work is the sincerity doing? If none, isn't your account vulnerable to the charge that it cannot distinguish performance from principle?

  3. **The Non-Identity Problem**
  You treat the state as a persisting corporate agent capable of acknowledging past wrongs. But consider a polity that undergoes revolution or total constitutional replacement. Is the post-revolutionary state the same agent? If not, does your account imply they have no standing to apologise for their predecessors' wrongs, and if so, does justice vanish with the regime?

  *Follow-up:* You will likely argue for institutional continuity. But if continuity is a matter of degree rather than a binary, is the obligation to apologise also graded? Can a state be 60% responsible? If you deny this, aren't you relying on a metaphysical fiction of state identity to sustain the obligation?

  4. **Ongoing Wrongs and Theoretical Unity**
  Your argument hinges on the death of the victims rendering uptake impossible. What about historical wrongs with living victims or intergenerational harms that persist? Does your account collapse into the standard reparative model there, and if so, why maintain a unified theory of State Apology rather than admitting two distinct categories of speech act?

  *Follow-up:* You might say the model differs based on uptake availability. But doesn't this create a disjunction where 'state apology' is an equivocal term covering two fundamentally different speech acts? If the logic changes based on the victim's vital status, isn't the commonality merely linguistic rather than philosophical?

  5. **Asymmetry of the Dead**
  You grant that the dead can be wronged—since their wrongs can be acknowledged—but deny they can provide uptake, since they cannot forgive. This implies the dead retain normative claims but lose normative agency. Is this asymmetry a feature of your account or a *reductio ad absurdum*? Does it not suggest the 'wrong' survives only as a present-day construct rather than a claim held by the deceased?

  *Follow-up:* You will likely say rights survive death. But if rights survive, why doesn't the agency to waive them pass to heirs? If it doesn't, aren't the dead permanently held in a normative purgatory where they can be harmed but never compensated or reconciled?

  6. **The Transactional Constraint**
  You insist apologies cannot be part of a settlement or bargain. But a constitutive act inevitably shifts political capital and expectations. If an apology facilitates a peace treaty by changing the normative landscape, isn't it functionally transactional regardless of the speaker's intent?

  *Follow-up:* I know you often object that this assumes a reparative model. But I am asking about the constitutive effect itself. If the act is offered *to achieve* a normative shift that benefits the apologiser, does that instrumentalisation not corrupt the constitutive sincerity you require? If the outcome is a political bargain, why does the motive shield it from being transactional?

  7. **The Audience of the Constitutive Act**
  If the victims cannot receive the apology, who is the audience of this constitutive act? Is it the current citizenry? If so, isn't this merely political education dressed in apologetic language, and if it is education, why adopt the first-person syntax of apology ('we apologise') rather than the third-person of historical acknowledgement ('we acknowledge')?

  *Follow-up:* You will likely say it is addressed to the polity as a whole to reshape identity. But if the function is educating the living, doesn't that make the 'apology' a tool for social engineering? If so, isn't there a risk that the truth of the historical wrong becomes secondary to its utility in shaping current citizens?

  8. **Moral Remainders**
  If these acts do not discharge a debt because uptake is impossible, does a moral remainder persist indefinitely? If yes, is the polity permanently tainted? If no, what mechanism extinguishes the obligation if not uptake?

  *Follow-up:* You will likely say the obligation transforms into a duty of non-repetition. But if the original wrong is never 'settled', does every subsequent act remain tainted by the unresolved past? Does your view not imply that some polities are permanently morally compromised in a way that others are not?

  9. **Decision Theory and Signalling**
  From a signalling perspective, a cheap talk signal is costless. A constitutive apology costs political capital. But if it doesn't discharge liability, isn't it still a low-cost way to gain moral standing compared to material restitution? How do you prevent this from becoming a moral hazard where states offer constitutive apologies to avoid material costs?

  *Follow-up:* You will say it binds the state to future costs. But what enforces this binding? If the only enforcement is reputational, isn't that a transactional cost-benefit analysis? If the state calculates that the reputational gain outweighs the constraint, isn't the act ultimately strategic rather than normative?

  10. **Source of Normative Force**
  If the victim cannot release the apologiser, where does the obligation not to repeat originate? Is it self-imposed? If so, can it not be self-revoked? What prevents a polity from constituting itself anew and shedding the obligation, much like a corporate bankruptcy?

  *Follow-up:* You will likely say it is constitutive of the polity's identity. But identities change. If the polity decides its new identity does not include this obligation, what normative resource do you have to say they are wrong? Without the victim's standing to hold them to account, isn't the obligation merely a preference?
