  **Decomposition**
  *   **Principled line between observable/unobservable (0.3):** Most contemporary accounts treat observability as pragmatic or continuous rather than ontological, weakening the restriction of evidence to direct observation.
  *   **Theoretical virtues as non-evidence (0.4):** Dominant Bayesian and realist frameworks treat simplicity and coherence as epistemic guides that legitimately update credence, contradicting the claim that choice is non-evidential.
  *   **Equivalence in principle vs. technique (0.5):** Establishing global empirical equivalence is notoriously difficult and often collapses upon deeper theoretical analysis, making the premise rare in practice.
  *   **Determinacy of "not a matter of evidence" (0.6):** While ambiguous, the claim can be charitably interpreted as asserting non-empirical underdetermination, which is a coherent philosophical position.

  **Combination**
  These factors are not independent necessary conditions but weighted contributors; the low probabilities regarding virtues and observability drag the final estimate down, while the coherence of the claim prevents it from reaching zero.

  **Sensitivity**
  The number is most sensitive to whether theoretical virtues count as evidence; if virtues are accepted as purely pragmatic rather than epistemic, the credence would shift above 60%.

  **Settled vs. Contested**
  It is settled among philosophers of science that local underdetermination (multiple theories fit current data) exists. It is genuinely contested whether global underdetermination (equivalence across all possible data) is possible, whether theoretical virtues provide epistemic justification or merely pragmatic utility, and whether a sharp ontological line exists between observable and unobservable entities.
