prompt: |-
  I work on institutional economics, so my working vocabulary is self-enforcing equilibria, focal points, equilibrium selection, credible commitment, third-party enforcement, and the gap between de facto power and de jure legitimacy. Take Pascal's treatment of justice and force — his claim that we could not make justice strong and so made strength just, that what passes for justice rests on custom and law rather than on any deliverable standard, and his apparent suggestion that this diagnosis serves a religious or apologetic purpose rather than an explanatory one — and restate it in my vocabulary as faithfully as you can. Then give me the residue report: which parts of his position translate cleanly into equilibrium-selection and enforcement talk, which survive only with distortion, and which have no counterpart in my framework at all. For each piece of residue, say whether it reflects a genuine gap in the economic vocabulary or instead a sign that Pascal is doing something other than describing how institutions work. Keep the translation honest — don't quietly substitute my framework's assumptions for his and then call the result a translation. Please answer in American English.
reasoning: |-
