  3.  **Drafting the Translation (Task 1):**
      *   *Concept:* "Justice without force is powerless." -> *Translation:* A normative rule set without a mechanism for *third-party enforcement* or *self-enforcement* cannot sustain an equilibrium.
      *   *Concept:* "Force without justice is tyrannical." -> *Translation:* *De facto power* exercised without *de jure legitimacy* incurs high enforcement costs and instability.
      *   *Concept:* "We could not make justice strong, so we made strength just." -> *Translation:* Because establishing a universal *focal point* based on intrinsic moral truth failed, society selected an equilibrium where *de facto power* determines *equilibrium selection*, and then legitimized this outcome through custom to lower transaction costs.
