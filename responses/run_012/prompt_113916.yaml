answer: |-
  ### The Translation

  In your vocabulary, Pascal's argument regarding justice and force can be restated as follows:

  Pascal posits that a normative framework lacking **third-party enforcement** capacity cannot sustain a stable **self-enforcing equilibrium**. He observes that agents are unable to coordinate on a universal moral **focal point** derived from intrinsic truth. Consequently, society undergoes **equilibrium selection** based not on normative optimality, but on **de facto power**. To reduce the transaction costs of maintaining this order, power structures generate **de jure legitimacy** (custom and law) to mask the underlying coercion, effectively making strength appear just.

  However, Pascal treats this institutional arrangement not as a functional solution to a coordination problem, but as a failed **credible commitment** device. He argues that because human institutions rest on contingent power rather than transcendent truth, the resulting equilibrium is inherently unstable and unsatisfying. His diagnosis is not intended to explain how institutions achieve stability, but to demonstrate that human **de jure legitimacy** is incapable of anchoring a just order without an external enforcer (God) who can provide the ultimate **credible commitment** that human force cannot.

  ***

  ### The Residue Report

  Here is the breakdown of how Pascal's position maps onto your institutional framework, categorized by the fidelity of the translation.

  #### 1. Clean Translations
  *These concepts map directly onto your vocabulary with minimal loss of meaning.*

  *   **Force as *De Facto* Power:** Pascal's "force" translates cleanly to *de facto* power—the capacity to impose costs or restrict choices regardless of normative rules.
  *   **Justice/Law as *De Jure* Legitimacy:** Pascal's "justice" (as it exists in society) maps to *de jure* legitimacy—the codified rules and customs that claim moral authority.
  *   **The Mechanism of Stabilization:** Pascal's claim that "we made strength just" translates well to **equilibrium selection**. He describes a process where a power-based equilibrium is selected, and then narratives (laws/customs) are constructed to stabilize it, functioning as a **focal point** that coordinates expectations around the status quo.
  *   **The Enforcement Constraint:** Pascal's assertion that "justice without force is powerless" is a precise description of a rule set lacking **third-party enforcement**. In your framework, such rules would be ignored as non-credible threats or promises.

  **Diagnosis:** This residue reflects the strength of your vocabulary. Institutional economics is well-equipped to describe the *mechanics* of how power solidifies into legitimacy.

  #### 2. Translations with Distortion
  *These concepts can be mapped, but the economic framework alters the ontological status of the concept.*

  *   **The Nature of "Justice":**
      *   *Pascal:* Justice is a transcendent, objective standard that human institutions fail to capture.
      *   *Your Framework:* Justice is typically modeled as endogenous—a preference, a social norm, or the outcome of the equilibrium itself.
      *   *Distortion:* When you translate Pascal's "Justice" as a failed **focal point**, you imply that Justice is merely a coordination problem. For Pascal, it is a metaphysical reality that is being *obscured*. Your framework describes the *shadow*; Pascal is concerned with the *light* that is being blocked.
  *   **Custom and Imagination:**
      *   *Pascal:* Custom is often "fantasy" or "imagination" that deceives the populace into accepting tyranny.
      *   *Your Framework:* Custom is a **self-enforcing equilibrium** (e.g., Greif's historical institutions). It is "real" in the sense that it successfully constrains behavior.
      *   *Distortion:* Economics views a stable custom as a successful institution. Pascal views a stable custom based on force as a successful *deception*. The economic vocabulary validates the stability; Pascal's vocabulary indicts the morality.

  **Diagnosis:** This reflects a **gap in the economic vocabulary** regarding normative ontology. Your framework is positivist (describing what *is* stable); Pascal is normative/metaphysical (describing what *ought* to be true but isn't). The distortion arises because economics treats "legitimacy" as a functional asset, whereas Pascal treats it as a potential mask for sin.

  #### 3. No Counterpart
  *These elements of Pascal's argument have no equivalent in your framework.*

  *   **The Teleological Purpose (Apologetics):**
      *   *Pascal:* The point of analyzing institutional failure is to humble human reason and direct the agent toward God.
      *   *Your Framework:* The point of analyzing institutional failure is to identify inefficiencies, propose policy improvements, or explain historical path dependence.
      *   *Residue:* There is no economic equivalent for an analysis designed to induce spiritual despair as a prerequisite for salvation.
  *   **The Ultimate Enforcer:**
      *   *Pascal:* Only Divine judgment provides a true **credible commitment** for justice.
      *   *Your Framework:* **Credible commitment** is solved through human mechanisms (reputation, contracts, constitutions, third-party enforcers).
      *   *Residue:* Your framework assumes the set of enforcers is closed to human or state actors. Pascal posits an exogenous enforcer outside the system of human incentives.
  *   **Wretchedness vs. Efficiency:**
      *   *Pascal:* The gap between *de facto* power and *de jure* legitimacy is evidence of human "wretchedness."
      *   *Your Framework:* The gap between *de facto* power and *de jure* legitimacy is a source of instability or inefficiency (e.g., North's limited access orders).
      *   *Residue:* Economics seeks to close the gap to improve welfare. Pascal accepts the gap as an inevitable condition of the fallen world that cannot be solved institutionally.

  **Diagnosis:** This residue is not a gap in your vocabulary; it is a sign that **Pascal is doing something other than describing how institutions work.** He is engaged in theological anthropology. He uses institutional observation as a premise for a religious conclusion. Your framework is a tool for social engineering or explanation; Pascal's framework is a tool for conversion.

  ### Summary
  Your vocabulary successfully captures the *mechanics* of Pascal's diagnosis: how power selects equilibria and how legitimacy is manufactured to lower enforcement costs. However, the translation breaks down at the *purpose* and the *ontology*. Institutional economics treats the resulting equilibrium as a social fact to be analyzed or optimized. Pascal treats it as a spiritual failure to be endured and transcended. The "residue" is not missing data; it is a different category of inquiry entirely.
