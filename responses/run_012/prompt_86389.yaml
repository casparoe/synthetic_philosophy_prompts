answer: |-
  **Characters:**
  *   **Leo:** Defends the *Etiological View* (Function requires evolutionary history/selection).
  *   **Sam:** Defends the *Causal Role View* (Function is current contribution to the system).

  **Setting:** A coffee shop, shortly after you left the doctor's office.

  ***

  **Leo:** Look, I get why your friend's take sounds comforting. "Nothing is broken, it's just variation." But it's category error. If your car's brake pad is worn down and doesn't stop the wheel, you don't say, "Oh, the brakes are just evolving." You say they're broken.

  **Sam:** But a car isn't a body. A car has a manual written by an engineer. A heart has no manual. It just *is*. My point is, function is about what the part *does* for the system right now. Your valve contributes to blood flow. It's doing it poorly, sure, but it's not "violating" a rule. There's no rule. There's just physics.

  **Leo:** There is a rule. It's written in natural selection. The "proper function" of the mitral valve is to prevent backflow because ancestors with valves that did that survived better. That history is what makes the valve *for* closing. When it doesn't close, it's failing its selected effect. That's a malfunction. Your friend's view can't even say it's malfunctioning. It just says it's "contributing less."

  **Sam:** Because "malfunction" implies intent. If I say the function of the heart is to pump blood, I mean that pumping blood is its causal contribution to keeping the organism alive. If it leaks, it's a suboptimal causal contribution. But why do we need a ghost of evolution past to tell us it's not working? If I install a new software patch that fixes a bug, does the bug only become a "bug" after the patch has been used for ten years?

  **Leo:** Yes! Or rather, until the patch is *selected* as the standard. Think about a new mutation. Say a kid is born with an extra enzyme that digests plastic. It's useful immediately. On your view, that enzyme has the "function" of digesting plastic right now. On my view, it doesn't. It has a beneficial *effect*. It only becomes a function if that trait gets passed on and selected for. Until then, it's just a lucky accident.

  **Sam:** That's absurd. It means biology is blind to the present. You're telling me a trait can be keeping an organism alive, essential to the system, but we can't call it functional until enough generations die off to confirm it? That makes "function" a rear-view mirror. I care about the windshield.

  **Leo:** I care about the difference between a feature and a fluke. If we don't anchor function in history, everything becomes a function. Think about the sound of the heartbeat. *Lub-dub.* That noise contributes to the system—it allows doctors to diagnose you. It keeps you alive by enabling treatment. Is the function of the heart to make noise?

  **Sam:** [Pauses] No. Because the noise isn't *essential* to the circulation system itself.

  **Leo:** How do you know? Without history, how do you distinguish the pumping from the noise? Both are causal contributions. Both have effects.

  **Sam:** Because we can isolate the mechanism. The valves closing *cause* the pumping. The noise is a byproduct of the valves closing. We distinguish based on the structural hierarchy, not the evolutionary resume.

  **Leo:** But why is the hierarchy built that way? Because selection built it that way. You're smuggling my argument in through the back door. You're using "design" logic without admitting you need a designer, either natural or artificial.

  **Sam:** Fine, let's talk about artificial. Your uncle has a mechanical valve, right? Surgeon put it in. Evolution didn't select that titanium ring. A guy in a scrub cap did. On your view, does that valve have a function?

  **Leo:** Yes. Because the surgeon is a selector. The surgeon intended the valve to regulate flow. It has an etiological history, just a short one. It was chosen *for* that purpose.

  **Sam:** So function is just "being chosen"?

  **Leo:** Function is "being selected for a specific effect." Evolution does it slowly; surgeons do it quickly.

  **Sam:** But the physics of your uncle's valve are identical to a valve that drifted into existence by accident. If a random mutation created a titanium-like structure in a heart—which is impossible, but stay with me—and it pumped blood, you'd say it has no function until it's selected. But the mechanical valve has function instantly because a human thought about it. That makes function about *minds*, not bodies.

  **Leo:** It makes function about *teleology*. About "for-ness." Without that, you can't define disease. If function is just "whatever happens," then cancer has a function. It contributes to the system by consuming resources and replicating cells.

  **Sam:** Cancer disrupts the higher-level system's stability. We define function relative to the organism's survival, not the cell's.

  **Leo:** But who defines the organism's survival as the goal? Selection does. You keep wanting the benefit without the cost of the history.

  **Sam:** And you keep wanting the authority of the past to rule over the present. Look at the appendix. For years, your view said it was vestigial. A useless scar of evolution. "No selected function in modern humans." So surgeons cut them out routinely. Now we find out it houses beneficial gut bacteria and acts as immune tissue. On my view, it always had a function because it always made a causal contribution. On your view, did its function change last Tuesday when we discovered the immune role?

  **Leo:** No. Its *original* function might be gone, but if it provides immune support, and that support is why it persists in the gene pool now, it has acquired a new selected function. But if it's just hanging there doing a little bit of work but not enough to be selected for, it's still vestigial. It's a spandrel.

  **Sam:** See, that's the risk. You're willing to call a working immune tissue "vestigial" just because you haven't proven the selection pressure yet. I'd rather say, "It does X, therefore X is a function," and let the history catch up later.

  **Leo:** And I'd rather say, "It does X, but is it *supposed* to do X?" Because if your valve isn't supposed to leak, we can fix it. If your friend is right, and the leak is just "what your heart is doing," then fixing it is fighting your nature.

  **Sam:** Fixing it is optimizing the causal system. I don't need "supposed to" to justify surgery. I just need "better to."

  **Leo:** But "better" implies a goal.

  **Sam:** Survival is the goal.

  **Leo:** Survival of what? The genes? The organism? That's only defined by... selection.

  ***

  **The Cost of the View**

  **Leo:** Here's the thing I have to swallow to keep my view standing: I have to admit that biology is slow to recognize innovation. If a brand new trait emerges that saves a life today, I have to call it "functionless" until history vindicates it. I sacrifice the utility of the present moment for the precision of definition. I can tell you clearly when something is broken, but I can't easily tell you when something new is working.

  **Sam:** And my cost is that I lose the concept of "error." If function is just contribution, then a leaking valve is just a "leak-contributing valve." It makes it harder to define disease objectively. I have to accept that without an external standard of "proper function," calling something a disorder is just saying "I prefer it worked differently." I gain the ability to see utility in new traits, but I lose the ability to say, definitively, that the body is failing itself.
