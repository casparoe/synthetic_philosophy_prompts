  I just found out one of the valves in my heart doesn't close all the way, and my friend who's gotten really into evolutionary medicine keeps telling me it's not a defect, my heart is just doing what it evolved to do — which drives me nuts but I honestly cant articulate why he's wrong, and for all I know I'm the one whos confused. So can you write me a dialogue between two people who disagree about what it even means for a body part to have a function? One of them thinks a trait only has a function if it was actually selected for doing that thing, which is nice because it means my valve can be genuinely broken, but it leaves him stuck on anything that's useful without ever having been selected — a mutation that just showed up, or a trait that drifted in and only later turned out handy. The other thinks a function is just whatever contribution a part makes to the system it sits in right now, no history required, which hands out functions to new stuff immediately but makes it hard for him to say my valve is malfunctioning rather than just not doing anything, and hard to explain why the heart's thumping noise isn't one of its functions too. Have them go back and forth for real — each one should actually respond to what the other says, no strawmen, both sharp. Also have them argue about my uncle's mechanical valve, since a surgeon chose that one instead of evolution, and about the appendix. Finish with what each of them has to give up in order to keep their view standing.
