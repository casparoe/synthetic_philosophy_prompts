answer: |-
  Good evening. Thanks for coming. I know tomorrow's vote feels like a line in the sand. I know some of you think repealing this ordinance is an erasure of who we are, and others of you think keeping it is a refusal to let people into the pharmacy or the cafe. I'm standing here because I went digging in the county archive to find out what this rule actually is. I thought I owed it to all of us to know what we're arguing about.

  Here is what I found. In 1908, Main Street flooded. Almost every spring. The water came up over the sidewalk and into the shops. The council voted to raise the doors two feet to keep the water and the silt out. That was a good reason. It was practical. It protected property.

  But there was another reason. The letter I found was from the lumber dealer who proposed the ordinance. He owned the only yard in town. That same spring, he'd taken delivery of a boxcar of short boards. He couldn't sell them for framing. He couldn't sell them for flooring. But he could sell them for steps. He wrote the specs to match the wood he had stuck in the yard. So the rule was born half from necessity and half from a racket.

  For twenty years, that made sense. You needed the height to keep the water out, and you needed the steps to climb it. But in 1931, the levee went in. The floods stopped. The necessity died. The racket, however, stayed on the books.

  My grandmother sat on the zoning board for thirty years. She used to say that a rule which survives fifty years of people wanting it gone is carrying information. But a rule which survives fifty years because nobody ever wanted it gone is just carrying inertia. For most of the last century, this ordinance was inertia. Nobody fought it because nobody needed to get through the door who couldn't climb two feet.

  Now, that has changed. The people who pay for this rule now are not the people who paid for it then. In 1908, the cost was borne by customers who could walk. Today, the cost is borne by neighbors who can't. When we say "there was a reason," we have to ask "does the reason still hold?" The flood reason is gone. The lumber dealer's profit is gone. What is left is the habit.

  But I also know why some of you want to keep it. It isn't just about the wood. It's about the way we live. Those stoops turned into the town's living room. You sit on them. You wait for friends. You watch the parade. The social life of Kettle Creek happens on those steps. We learned this the hard way with the covered bridge. In 1974, we tore it down because it was "useless." Then in the nineties, we spent money building a fake one for tourists because we missed the thing we threw away. We cannot afford to make that mistake again. We cannot tear down the social space just because the structure is wrong.

  So here is the hard part. We have to separate the barrier from the gathering place.

  If we vote to keep the ordinance, we are voting to keep the lumber dealer's short boards alive long after he is dead. We are voting to tell the parents of children in wheelchairs that their access is less important than our habit. That is a cost I don't think we can ask them to pay anymore.

  But if we vote to repeal it without a plan, we lose the living room. We turn Main Street into a hallway where people walk through but don't stay.

  So I am asking you to support a specific proposal tomorrow.

  First, we repeal the 1908 height ordinance. We allow level entry. We allow ramps. We let people into the pharmacy.

  Second, we adopt a new guideline that requires any business removing these steps to install a permanent public bench or seating area at sidewalk level in front of their storefront.

  I know what some of you are thinking. The business owners might hate this. You don't want a mandate telling you how to build your frontage. You want the freedom to clear the sidewalk. And the keepers might hate this too. You want the steps kept exactly as they are, not replaced by benches.

  But this is the only way to honor both truths. The letter showed us that the original rule was mixed—part protection, part profit. We are done with the profit. We are done with the barrier. But we are keeping the protection of the social space.

  If we do this, we aren't erasing the past. We are finally finishing the job the flood started. We are admitting that the dead made a mistake about the wood, but they were right about the sitting.

  Tomorrow, four of you on the council will decide. But tonight, we decide what kind of town we are. Do we keep a rule because it's old, or do we keep the function because it works?

  Let's vote to repeal the height. Let's vote to keep the seat. Let's let our neighbors in, and let's sit down together.

  Thank you.
