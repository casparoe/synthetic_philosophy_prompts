answer: |-
  ### The Cases

  **Case 1 (Negative Aesthetic)**
  "The club president ordered cheap banners to save funds. He knew the ink would look faded and washed out. He didn't care about the look, only the cost. The banners looked faded."

  **Case 2 (Positive Aesthetic)**
  "The club president ordered cheap banners to save funds. He knew the ink would look vibrant and sharp. He didn't care about the look, only the cost. The banners looked vibrant."

  **Case 3 (Neutral Control)**
  "The club president ordered cheap banners to save funds. He knew the ink would use a different chemical formula. He didn't care about the formula, only the cost. The banners used the different formula."

  *(Each case reads in approximately 12 seconds.)*

  ### Why Case 3 is the Right Test
  Case 3 removes the **normative valence** while keeping the causal structure identical. In Cases 1 and 2, the side effects are evaluated against a standard of quality (faded is bad, vibrant is good). In Case 3, the side effect is value-neutral. If the asymmetry vanishes here, it proves that *evaluation*—not just causal knowledge—is the switch that turns on intentionality ascriptions. It isolates the mechanism: if people say the president intentionally used the formula in Case 3 as often as they say he intentionally faded the banners in Case 1, then the effect is about causality, not evaluation. If they say he did *not* intentionally use the formula, but *did* intentionally fade the banners, it confirms that normative judgment is required to trigger the concept of "intentional."

  ### Predicted Verdicts

  | Case | Blame-Driven Bias Theory | Evaluative Concept Theory |
  | :--- | :--- | :--- |
  | **1 (Faded)** | **Unintentional.** (No moral blame is available for aesthetic quality, so no bias to blame triggers.) | **Intentional.** (The agent violated a normative standard of quality, and intentionality tracks norm violation.) |
  | **2 (Vibrant)** | **Unintentional.** (No moral praise bias exists to the same degree as blame.) | **Unintentional.** (The agent adhered to the standard; no norm violation occurred.) |
  | **3 (Formula)** | **Unintentional.** (No norm violated.) | **Unintentional.** (No norm violated.) |

  *Note: If your classmates agree the president **intentionally** made the banners faded in Case 1 but **unintentionally** made them vibrant in Case 2, the Blame-Driven Bias Theory is falsified, because there is no moral blame at stake.*

  ### Design Analysis

  **The Single Feature Doing the Work**
  The feature is **Normative Valence** (whether the side effect violates or adheres to a shared standard of quality). This is what differs between Case 1 and Case 2, and what is removed in Case 3.

  **What Happens If You Remove It**
  If you remove the valence (as in Case 3), the asymmetry vanishes. Participants will rate the action as equally unintentional in both the "good" and "bad" neutral conditions. This demonstrates that the asymmetry is not driven by the mere presence of a foreseen side effect, but by the *value* of that effect.

  **How a Defender of the Blame-Based Explanation Would Attack**
  A defender will argue that **"faded banners" are not aesthetically neutral, but professionally blameworthy.** They will claim that a club president has a *duty* to produce quality materials, so making them faded is a moral/professional failure. They will argue the asymmetry persists in Case 1 only because participants are still assigning blame for incompetence, not because "intentional" tracks aesthetic norms.

  **Counter-Strategy for Your Presentation**
  Acknowledge this attack. Point out that if they are right, the Knobe Effect is indeed about blame. However, ask the club: *"Is producing a slightly faded banner truly a moral failure, or just a suboptimal outcome?"* If they agree it is merely suboptimal (prudential/aesthetic), yet still feel the faded outcome was intentional while the vibrant one was not, you have shown that the concept of intentional action is sensitive to **normativity** generally, not just **moral blame**. This supports the Evaluative Concept Theory: we use moral-like structures to judge intentionality even in non-moral contexts.
