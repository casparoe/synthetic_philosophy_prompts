answer: |-
  First off: **You are not being a baby, and your friend doesn't get it.**

  Your friend is looking at the *physical* reality (nobody is physically taking the phone from you right now), but you are experiencing the *psychological* reality. And psychologically, what you are describing is a very specific, well-documented form of stress.

  Here is the breakdown of what is actually happening to you, why your mom's comment made it worse, and what this feeling is called.

  ### 1. The Panopticon Effect
  There is a famous philosophical concept called the **Panopticon**. Imagine a prison where the guard tower is in the center, and the cells are arranged in a circle around it. The prisoners can see the tower, but they can't see inside it. They never know if the guard is looking at them *right now*, so they have to assume the guard is *always* looking.

  The result? The prisoners start policing themselves. They behave perfectly even when no one is watching, because the *possibility* of being watched is enough to control them.

  **This is exactly what you are feeling.**
  *   **Your friend says:** "The guard isn't looking, so you're free."
  *   **You feel:** "The guard *could* look at any second, so I am not free."

  Your mom basically admitted this when she said, *"We don't even need to check it cause you already know they could."* She was telling you that the **threat** of surveillance is more efficient than the **act** of surveillance. She wants you to be your own jailer. That is why it made you feel worse; it confirmed that the lack of checking isn't about trust, it's about control.

  ### 2. Arbitrary Power vs. Rule of Law
  You mentioned: *"Theres no rule about when, they just decide, depends on their mood."*

  This is actually more stressful than having strict rules. If there were a rule like "We check every Sunday," you would have freedom from Monday to Saturday. You could relax.

  When enforcement depends on someone's **mood**, you are living in a state of **hypervigilance**. You are constantly scanning the environment (your parents' faces, their tone of voice) to gauge if "today is a check day." That is exhausting. It keeps your nervous system in a low-level "fight or flight" mode. You aren't relaxing; you're waiting for the other shoe to drop.

  ### 3. Internalized Censorship (The "Is This Me?" Problem)
  You wrote: *"Sometimes i catch myself not even wanting to post stuff they wouldnt like, and i genuinely cant tell if thats me or them."*

  This is the most damaging part. This is called **Internalized Control**.
  *   **Normal Development:** You try things, you make mistakes, you figure out what *you* like and what *you* believe.
  *   **Your Situation:** You are filtering your thoughts through a "What would Mom think?" algorithm before you even fully form the thought.

  Over time, this makes it hard to know who you actually are. You aren't just hiding things from them; you are hiding things from yourself to stay safe. That confusion ("is that me or them?") is a very real, valid psychological consequence of living under arbitrary surveillance.

  ### So, is your friend right?
  No. Your friend is confusing **absence of consequences** with **presence of freedom**.
  *   **Freedom** is knowing you have autonomy.
  *   **Your situation** is knowing you have *leniency*, but no autonomy.

  Leniency can be taken away in a second because it depends on their mood. Autonomy is yours. You don't have autonomy; you have a temporary reprieve that could end whenever they get bored or stressed.

  ### Summary of what you are feeling
  You aren't just "feeling not free." You are experiencing:
  1.  **Surveillance Anxiety:** The stress of potentially being watched.
  2.  **Learned Helplessness:** The feeling that your actions don't matter because the outcome depends on their mood, not your behavior.
  3.  **Identity Diffusion:** The confusion about what parts of your personality are real vs. what parts are performed for safety.

  ### What now?
  You don't necessarily need to stage a rebellion (which might trigger a phone check), but you should stop gaslighting yourself.
  *   **Trust your gut:** It is not "dumb" to feel this way. It is a rational response to an unpredictable environment.
  *   **Acknowledge the control:** When you catch yourself self-censoring, try to notice it. "I am not posting this because I am afraid, not because I don't want to." Just naming it helps keep your sense of self separate from their rules.
  *   **Don't let the friend minimize it:** You can tell them, "It's not about them actually looking. It's about the fact that they can look whenever they want without reason. That makes me feel like I'm always being tested."

  You are sensing a power dynamic that is genuinely unhealthy. You aren't being dramatic; you're being perceptive.
