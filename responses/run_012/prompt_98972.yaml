answer: |-
  **Project Title:** Temporal Location and Normative Force: Unifying the Ethics of Intra-personal and Inter-generational Discounting

  **1. Research Question and Objectives**

  The central question of this project is: *Does mere temporal location constitute an independent normative reason for differential concern?*

  In moral and political philosophy, the practice of discounting the future—valuing a benefit less solely because it occurs later—is pervasive yet deeply contested. This project hypothesizes that the stalemate in this debate arises from a fragmentation of the literature. Two distinct domains address temporal discounting but rarely intersect: the ethics of intra-personal time bias (concerning prudence and rationality within a single life) and the ethics of inter-generational discounting (concerning social policy and justice across generations). The intra-personal literature offers a fine-grained vocabulary for distinguishing preferences about the *direction* of time from preferences about temporal *distance*, and for analyzing when such preferences constitute rational defects versus constitutive features of agency. The inter-generational literature offers a sharper vocabulary for distinguishing discounts that attach to *value* itself, discounts that attach to an agent's *reasons* for promoting value, and discounts that reflect the *epistemic uncertainty* of the future.

  Currently, neither domain imports the distinctions of the other. Consequently, arguments against "pure time preference" in social policy often rely on intuitions about prudence that are under-theorized, while arguments about the rationality of personal bias ignore the structural constraints identified in policy ethics. This project seeks to unify these vocabularies to test the coherence of pure time preference. The objective is to determine whether, once epistemic uncertainty, value volatility, and agent-relative perspective are disentangled, any normative weight remains for temporal location itself. If the hypothesis holds, the debate migrates from whether discounting is rational to whether the unavoidably located structure of concern can be justified as a feature of agency rather than merely excused as a limitation.

  **2. State of the Art and The Gap**

  The existing positions leave the research question open because they operate within siloed conceptual frameworks. In the intra-personal domain, the debate focuses on whether it is irrational to care less about one's future pains or pleasures. Proponents of neutrality argue that temporal location is morally arbitrary, akin to spatial location. Defenders of bias argue that having a temporal perspective is constitutive of being an agent. However, this literature often conflates the *strength* of a desire with the *reason* for the desire. It frequently fails to distinguish whether the discounting is due to the fading of value over time or the fading of the agent's grip on that time.

  In the inter-generational domain, the debate focuses on the social discount rate used in cost-benefit analysis for long-term issues like climate change. Here, the focus is often on fairness to future people. The standard objection to discounting is that it discriminates against future generations. The standard defense often appeals to opportunity costs or probability of existence. However, this literature frequently treats the "agent" as a collective or institutional entity without analyzing whether the temporal biases of individual psychology scale to social choice. It lacks the tools to determine if a social discount rate reflects a moral judgment about value or a pragmatic acknowledgment of limited epistemic access.

  Because these literatures do not speak to one another, a philosopher can consistently hold that personal future-bias is rational while social discounting is unjust, or vice versa, without recognizing the tension. The gap is not a lack of argumentation on either side, but a lack of a unified metaphysics of time and value that applies to both. By failing to distinguish between *axiological* discounting (the good itself diminishes) and *deontic* discounting (the reason to promote the good diminishes), current positions allow "pure time preference" to hide behind ambiguity. This project will force these distinctions into the open to see if any substantive normative claim survives.

  **3. Methodology and Work Plan**

  The project will proceed over twenty-four months in four phases. The method is conceptual analysis grounded in reflective equilibrium, testing intuitions about time against principles of rationality and justice.

  *Phase 1: Conceptual Cartography (Months 1–6)*
  The first phase will construct the unified framework without presupposing its validity. I will rigorously define the distinctions between (a) epistemic discounting (based on uncertainty), (b) axiological discounting (based on the nature of the good), and (c) agent-relative discounting (based on the structure of concern). I will map existing arguments from both literatures onto this framework to identify where equivocation occurs. The deliverable will be a working paper establishing the taxonomy. This approach is chosen over immediate case-study application because the current confusion is terminological and structural; applying the concepts before defining them would replicate existing errors.

  *Phase 2: The Intra-personal Test (Months 7–12)*
  I will apply the taxonomy to the problem of personal prudence. Using thought experiments involving future bias and near bias, I will test whether the "agent-relative" defense of discounting holds when epistemic uncertainty is controlled for. If a fully informed agent still discounts the future merely due to location, is this a rational requirement or a psychological brute fact? This phase challenges the assumption that personal rationality is the baseline for normative theory.

  *Phase 3: The Inter-generational Test (Months 13–18)*
  I will apply the taxonomy to social choice. The key question here is whether the "agent-relative" structure of individual concern scales to collective agency. Does a society have a "perspective" in the same way an individual does? If the defense of discounting relies on the locatedness of the agent, and the state is not located in time in the same way a person is, the defense fails. This phase involves critiquing standard economic justifications for discount rates from a philosophical standpoint, focusing on the normative rather than mathematical elements.

  *Phase 4: Synthesis and Defense (Months 19–24)*
  The final phase will integrate the findings into a comprehensive argument. I will draft two journal articles and a fellowship monograph chapter. The first article will argue for the conceptual separation of value and reasons in temporal ethics. The second will argue that pure time preference is normatively empty once this separation is made. I will also host a small workshop to stress-test the unified framework against objections from both specialisms.

  **4. Success, Failure, and Triviality**

  A successful result will look like a definitive dissolution of the "pure time preference" debate. It will demonstrate that what philosophers and economists call pure time preference is actually a composite of epistemic caution, value theory, and agent-relative structure. Success means showing that once these are separated, no independent normative force remains for temporal location. This would resolve the tension between prudence and justice by showing they rely on the same underlying metaphysical commitments.

  The project would fail if the two domains prove incommensurable. If the structure of individual agency is fundamentally disanalogous to collective social choice in a way that prevents the transfer of distinctions, the unification attempt will collapse. In this case, the output would be a negative result demonstrating the limits of unified temporal ethics.

  A risk of triviality exists if the distinctions drawn turn out to be merely terminological. For example, if "agent-relative discounting" is just a renaming of "irrational bias" without explanatory power, the project adds nothing. To avoid this, I will ensure the distinctions have predictive power: they must explain why certain intuitions about climate change feel different from intuitions about saving for retirement, despite both involving the future. If the framework cannot explain these divergent intuitions, it is merely semantic.

  **5. Scope and Candid Assessment**

  The ambition of unifying intra-personal and inter-generational ethics is high. There is a risk that the project becomes too diffuse, offering a shallow treatment of both fields rather than a deep treatment of their intersection.

  To manage this, I may need to cut the specific engagement with welfare economics. While the project addresses the social discount rate, it will not engage in the mathematical modeling of economic growth or utility functions. The focus will remain strictly on the moral and political philosophy underpinning those models. This is appropriate for a philosophy fellowship but limits the project's direct applicability to policy modeling.

  Additionally, I may need to restrict the scope of "temporal location." The current plan focuses on the future. However, a truly unified theory might need to account for the past (e.g., reparations or regret). Including the past risks expanding the project beyond a two-year timeframe. I intend to bracket questions of past-directed concern unless they prove essential to defining the asymmetry of future concern.

  Finally, the "agent-relative" defense is the strongest competitor to the null hypothesis. If I find that agent-relative concern *is* rationally mandatory, the project shifts from dissolving pure time preference to justifying a limited form of it. This is not a failure, but it requires a pivot in the final synthesis to explain why agent-relativity is normative rather than merely descriptive. I will monitor this during Phase 2; if the data suggests agent-relativity is robust, Phase 3 will focus on whether collective agency inherits that relativity.

  By strictly managing these boundaries, the project remains feasible within two years while retaining the potential to fundamentally restructure how philosophers approach the ethics of time.
