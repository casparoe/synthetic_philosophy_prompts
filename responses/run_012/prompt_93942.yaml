answer: |-
  You have put your finger on the exact fault line where political philosophy meets administrative design. The discrepancy you notice isn't an accident or an oversight; it represents a fundamental clash between two different theories of justice. The existing welfare state operates on a theory of **need-based charity and household reciprocity**, while UBI operates on a theory of **citizenship-based entitlement and individual autonomy**.

  Here is a reconstruction of the implicit philosophical commitments baked into the standard UBI design (individual, unconditional, universal), an analysis of their consistency, and what would change if you swapped them for the prevailing welfare state logic.

  ### 1. The Unit of Justice: Methodological Individualism vs. The Family
  **The Design Choice:** UBI pays individuals. Welfare pays households.

  **The Implicit Theory:**
  By paying individuals, UBI presupposes **methodological individualism** as the proper unit of distributive justice. It assumes that the state's primary moral relationship is with the citizen, not the family unit.

  *   **Autonomy within the Home:** This design commits you to the view that resources should not be mediated by a spouse or head of household. Traditional welfare assumes the household is a "black box" of shared resources. Feminist economists (like Susan Moller Okin) have long argued this is false; money controlled by a partner creates power imbalances. By paying individuals, UBI presupposes that **economic independence is a prerequisite for domestic equality.** It gives a stay-at-home parent or an abused spouse a "exit option" that household-based welfare denies them.
  *   **Administrative Convenience?** No. Paying households is actually administratively cheaper (fewer checks, fewer accounts). Paying individuals is a deliberate choice to recognize the moral sovereignty of the person. It says: *You are a citizen first, and a family member second.*

  **Necessary vs. Contingent:**
  This is **necessary** to the core UBI philosophy. If you switch to household payments, you reintroduce the "poverty trap" for secondary earners (usually women) and restore the state's assumption that families will naturally redistribute resources fairly.

  ### 2. Desert and Freedom: Real Liberty vs. Reciprocity
  **The Design Choice:** UBI has no work requirement. Welfare has conditions/time limits.

  **The Implicit Theory:**
  This choice presupposes a specific definition of freedom, often associated with the philosopher Philippe Van Parijs: **Real Libertarianism.**

  *   **Freedom as Power:** Formal freedom (the right to work) is useless without the material means to exercise it. If you must work to eat, you are not free; you are coerced by necessity. UBI posits that **freedom requires an unconditional material floor.**
  *   **Rejection of Reciprocity:** Existing welfare is built on a **principle of reciprocity**: society helps you, so you owe society labor or proof of effort. UBI rejects this. It assumes that **citizenship itself is the contribution.** By participating in the social economy, culture, and democracy, you have already "paid your dues."
  *   **Desert:** UBI severs the link between *moral desert* and *survival*. It argues that no human being should be destitute, regardless of their "virtue" or labor market value. This is a rejection of the Calvinist/work-ethic underpinning of the modern welfare state.

  **Necessary vs. Contingent:**
  This is **necessary**. If you add a work requirement, it ceases to be a Basic *Income* and becomes a Basic *Wage* or a guaranteed job program. The philosophical point is to decouple survival from labor market participation.

  ### 3. The Value of Universality: Status vs. Economics
  **The Design Choice:** Pay everyone (even the rich) and tax it back, rather than means-testing (NIT).

  **The Implicit Theory:**
  You are correct that mathematically, a UBI funded by progressive taxes looks very similar to a Negative Income Tax (NIT). The rich get a check but pay more in taxes; the poor get a check and pay little. So, why the universal gross payment?

  *   **Stigma as a Distributive Evil:** This design presupposes that **dignity is a distributive good.** Means-testing requires the state to verify your failure. You must prove you are poor enough to deserve help. This creates stigma, which lowers uptake (people don't claim benefits they are entitled to) and creates social division. Universality treats the payment as a **dividend of citizenship**, like a share in a national trust, rather than charity for the broken.
  *   **Political Durability (The Self-Interest Argument):** This is the "Middle-Class Welfare" argument (associated with political scientists Walter Korpi and Joakim Palme). Programs for the poor tend to become poor programs. If only the poor get it, the middle class has no stake in defending it and will vote to cut it. If everyone gets it, the middle class protects it.
  *   **Administrative Simplicity:** Means-testing requires a bureaucracy to police income fluctuations. Universality assumes that **administrative friction is a form of injustice.** If you lose your job today, you shouldn't have to wait months for a means-test to approve your survival money.

  **Necessary vs. Contingent:**
  This is **contingent but strategic.** You *could* have an individual, unconditional income that is means-tested (an Individual NIT). However, proponents argue you lose the political coalition and the psychological shift from "welfare recipient" to "shareholder." Universality is the engine that makes the other two commitments politically viable.

  ### 4. Consistency Check: Respect vs. Protection
  You asked if individualizing the unit and dropping work requirements are consistent, or if they pull in different directions regarding "respect" vs. "protection."

  **They are internally consistent.**
  Both design choices pull in the same direction: **maximizing individual agency.**
  *   **Individual Payment:** Protects you from domination *within* the family.
  *   **Unconditionality:** Protects you from domination *by* the state or the market.

  The tension you sense is not within UBI, but between UBI and the **Paternalistic Protection** model of the current welfare state.
  *   The current system says: "We will protect you from poverty, but we must protect you from your own bad choices (not working) and ensure your family unit stays intact (household testing)."
  *   UBI says: "We will protect you from destitution, but we trust you to manage your own life and relationships."

  So, the "protection" in UBI is protection of *capacity*, whereas the "protection" in welfare is often protection of *social order*. They are inconsistent with each other, but UBI's internal logic is coherent.

  ### 5. The Counterfactual: Swapping the View
  What if you swapped the underlying view for the household-based, reciprocity-flavored view the rest of the welfare state runs on? You would not get UBI. You would get a **Guaranteed Minimum Income (GMI) or a modernized Negative Income Tax.**

  Here is exactly what would change in the program design:

  1.  **The Unit:** Payments would be consolidated per household. A couple would receive less than two individuals (economies of scale assumption). This saves money but reduces the bargaining power of the lower-earning partner.
  2.  **The Condition:** There would likely be a "work registration" requirement. You don't have to work, but you must prove you are looking, or accept training. This restores the reciprocity norm.
  3.  **The Universality:** It would become means-tested. The millionaire gets no check. This saves fiscal space but reintroduces the bureaucracy of verification and the stigma of receipt.
  4.  **The Goal:** The goal shifts from "Freedom to say No" to "Safety Net for those who Failed."

  ### Summary of the Implicit Theory
  The standard UBI design presupposes a specific philosophical anthropology:

  1.  **The Person:** An autonomous agent whose dignity is intrinsic, not earned through labor or family role.
  2.  **The State:** A shareholder in a common wealth, distributing dividends, not a parent dispensing allowance based on behavior.
  3.  **Justice:** Defined as **non-domination**. Poverty is a form of domination by employers, spouses, or bureaucrats. UBI is designed to remove the levers of that domination.

  The reason the political coalition tolerates the contradiction you noticed (UBI vs. Welfare) is that UBI proponents view the existing welfare state as fundamentally flawed—a patchwork of coercive, stigmatizing, and paternalistic programs that UBI is intended to *replace*, not complement. They aren't trying to make the welfare state consistent; they are trying to make it obsolete.
