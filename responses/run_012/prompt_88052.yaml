prompt: |-
  I'm prepping a session for our reading group on supererogation -- acts that go beyond the call of duty -- and I want us to start from the spec rather than from any one author. So before anyone assigns a paper, give me the desiderata: what any adequate theory of supererogation actually has to deliver.

  You're a philosopher who's spent a lot of time in normative ethics and on the deontic categories, so think this through carefully -- brainstorm first, then write the list. I don't want a literature summary or a tour of who said what; I want the requirements, each one tied to the case or consideration that motivates it.

  Some of the pressure points I want covered, though don't feel boxed in by my list:

  - The theory has to face the alleged paradox: if an act is morally better than its alternatives, it starts to look like the act you ought to do, which would make it required rather than optional -- and then it isn't supererogatory at all. Whatever the view is, it has to either dissolve this or explain why it's a pseudo-problem.
  - It has to respect the difference between the supererogatory and the merely permissible, and also the difference between the supererogatory and the obligatory. You can't just collapse "beyond duty" into "allowed" or into "required."
  - I keep getting stuck on cases where the sacrifice is basically free for the agent. A billionaire who gives away a tenth of their fortune does a lot of good but never feels it; someone who gives up a kidney, or a parent who wrecks their own health caring for a dying child, pays in a way that's hard to compare. The theory needs a principled line on whether cost to the agent belongs in the definition at all.
  - Related: is there such a thing as supererogation toward oneself? Can you go beyond the call of duty to yourself, or does the "call of duty" only bind you in relation to others?
  - And the treadmill worry: as an agent gets more virtuous, what used to be heroic becomes ordinary, and supererogation looks like it keeps evaporating. Does the theory survive that, or does it turn moral progress into a machine that deletes its own subject?
  - Whether supererogatory acts can be omissions and not just actions -- can declining to do something be beyond the call?

  For each requirement, give me the case or consideration behind it. Then tell me which requirements you think are non-negociable and which are really just hang-ups of particular camps. The part I most want is this: flag any pair or set of requirements you suspect can't all be satisfied at once, because if that's right, then the list itself is the result.

  Don't hedge into a survey -- take a definite position on the contested calls and give your reasons, even where you're not fully sure. I'd much rather argue with a committed list than a fence-sitting one. Finish with a line on which single requirement does the most work in ruling out the popular theories, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Supererogation (acts beyond the call of duty).
      *   **Task:** Create a list of *desiderata* (requirements) for an adequate theory of supererogation.
      *   **Constraint 1:** Start from the *spec* (the concept itself), not from specific authors/literature (no "Chisholm says X," "Heyd says Y").
      *   **Constraint 2:** Adopt a persona: A philosopher experienced in normative ethics and deontic categories.
      *   **Constraint 3:** Brainstorm first, then write the list.
      *   **Constraint 4:** Cover specific pressure points provided by the user (Paradox of Supererogation, Distinction from Permissible/Obligatory, Cost/Sacrifice, Self-Directed Supererogation, The Treadmill/Virtue Problem, Omissions).
      *   **Constraint 5:** For each requirement, provide the motivating case/consideration.
      *   **Constraint 6:** Distinguish between non-negotiable requirements and "hang-ups" of particular camps.
      *   **Constraint 7:** Flag incompatibilities (trilemmas/dilemmas) where requirements might conflict.
      *   **Constraint 8:** Take definite positions on contested calls (no fence-sitting).
      *   **Constraint 9:** Finish with a line on which single requirement does the most work in ruling out popular theories.

  2.  **Brainstorming & Conceptual Mapping:**
      *   *Core Concept:* Supererogation = Good + Optional + Beyond Duty.
      *   *The Paradox:* If $A$ is better than $B$, and $B$ is permissible, why isn't $A$ required? (Maximizing vs. Satisficing).
      *   *The Cost Condition:* Does it *have* to involve sacrifice? The billionaire case suggests "impact" might matter more than "cost," but traditional views emphasize sacrifice.
      *   *Self-Directed:* Can I be supererogatory to myself? Usually, duties to self are contested. If no duties to self, can there be supererogation to self?
      *   *The Treadmill:* If I do it once, is it now expected? (Moral demandingness vs. moral progress).
      *   *Omissions:* Can *not* doing something be supererogatory? (e.g., forgiving when you have a right to revenge).
      *   *Deontic Logic:* Needs to fit into the logic of Ought, May, Forbidden.
      *   *Incompatibility:* The "Cost" requirement vs. the "Billionaire" case. The "Paradox" solution vs. "Maximizing Consequentialism."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: The Deontic Status.* Must be optional but morally significant. (Motivation: Distinguishing from duty).
      *   *Req 2: The Value Condition.* Must be morally better than the baseline. (Motivation: Distinguishing from mere permission).
      *   *Req 3: The Sacrifice/Cost Condition.* This is the tricky one. User wants a principled line. I need to take a stand. Is cost necessary? If I say yes, the billionaire case fails. If I say no, does it collapse into mere optimization? I'll argue cost is *contingent*, not definitional, but high impact is necessary.
      *   *Req 4: The Agent-Relative Prerogative.* To solve the paradox. The agent must be allowed to not do the best thing without blame.
      *   *Req 5: Stability against Virtue.* The Treadmill. Doing it once shouldn't make it mandatory next time.
      *   *Req 6: Direction of Fit.* Can it be to self? I'll take a stand: Yes, but it's rare/derivative. Or No? Standard view is Other-Directed. I'll argue for Other-Directed as primary, Self-Directed as conceptually shaky unless we accept robust duties to self. Let's go with: Must be primarily other-regarding to avoid collapsing into prudence.
      *   *Req 7: Action vs. Omission.* Must cover both. (Motivation: Forgiveness, restraint).

  4.  **Refining and Taking Stands (The "Philosopher Persona"):**
      *   *Tone:* Authoritative, analytical, slightly provocative but rigorous.
      *   *Position on Paradox:* Reject simple maximization. Embrace Agent-Centered Prerogatives.
      *   *Position on Cost:* Cost is not essential. *Significance* is essential. The billionaire case is supererogatory because of the *good done*, not the pain felt.
      *   *Position on Self:* Skeptical. Supererogation implies a debt not owed. To whom do you owe the extra if not another?
      *   *Position on Treadmill:* The theory must block "moral ratcheting." Past heroism cannot create future duty.

  5.  **Identifying Incompatibilities (The "Result"):**
      *   *The Trilemma:* (1) Moral Betterness (A is better than B), (2) Optionality (You can choose B), (3) Rationality (You ought to do the best). You can't keep all three without modifying standard deontic logic.
      *   *Cost vs. Impact:* If you demand sacrifice, you exclude the billionaire. If you demand impact, you risk demanding too much (consequentialism).

  6.  **Selecting the "Killer" Requirement:**
      *   Which one kills the most theories? The **Optionality + Betterness** combo (The Paradox). It kills Act Consequentialism immediately. It also challenges Kantianism if duty is strict.

  7.  **Drafting the Content (incorporating the constraints):**

      *   *Intro:* Set the stage. Acknowledge the difficulty.
      *   *The List:* Numbered, with "Motivation/Case" for each.
      *   *Non-Negotiable vs. Hang-ups:* Clear distinction.
      *   *Incompatibilities:* Highlight the tension between Betterness and Optionality.
      *   *Conclusion:* The single requirement that does the most work.

      *(Self-Correction during drafting)*: Wait, the user asked me to flag requirements that *can't all be satisfied at once*. This is crucial. I need to explicitly state that a "perfect" theory might be impossible because the concept itself strains deontic logic. I should highlight the tension between the "Betterness Condition" and the "Optionality Condition" as the core friction point.

      *Refining the Cost Condition:* The user specifically mentioned the billionaire vs. kidney donor. I need to be decisive. I will argue that *sacrifice* is not a necessary condition, but *significant positive impact* is. This avoids the "hang-up" of glorifying suffering.

      *Refining the Self-Directed:* I will argue this is a category error. Supererogation is essentially social/relational.

      *Refining the Treadmill:* This is about the *source* of duty. Duty comes from principles, not past actions.

  8.  **Final Review against Constraints:**
      *   Did I summarize literature? No.
      *   Did I cover the user's pressure points? Yes (Paradox, Cost, Self, Treadmill, Omissions, Distinctions).
      *   Did I take definite positions? Yes.
      *   Did I identify the "Killer" requirement? Yes.
      *   Is the tone right? Yes, professional philosopher.

  9.  **Final Polish:** Check the flow and ensure the "Incompatibility" section is sharp. (The thought process moves from brainstorming to structured output).

  *(Self-Correction on the "Incompatibility" point)*: I need to make sure I don't just say "The Paradox is hard." I need to say "Requirement X and Requirement Y are in tension." Specifically: The requirement that the act is *morally better* conflicts with the requirement that the alternative is *blamelessly permissible* under standard rationality norms.

