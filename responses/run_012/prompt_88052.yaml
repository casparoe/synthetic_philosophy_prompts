answer: |-
  Here is the spec. I've stripped out the names and the history. We are looking at the architecture of the concept itself. If a theory cannot satisfy these, it isn't a theory of supererogation; it's a theory of something else (duties, permissions, or ideals).

  ### The Desiderata for a Theory of Supererogation

  **1. The Deontic Separation Condition**
  *   **The Requirement:** The theory must locate supererogatory acts in a deontic category distinct from both the *obligatory* and the *merely permissible*.
  *   **Motivating Case:** Consider a soldier who jumps on a grenade to save their squad. If your theory classifies this as *obligatory*, the soldier who hesitates (and survives) is blameworthy or has violated a duty. Intuitively, they are not. Conversely, if you classify it as *merely permissible* (like choosing tea over coffee), you lose the moral weight; we praise the jumper in a way we don't praise the tea-chooser. The theory needs a "third slot" in deontic logic.

  **2. The Betterness Condition**
  *   **The Requirement:** The supererogatory act must be morally better (or produce more moral value) than the permissible alternative.
  *   **Motivating Case:** If an act is optional but *not* better than the baseline, it's just a permission. Supererogation implies a moral gain. If I can save a drowning child at no cost to myself, and I do, that is better than walking away. If your theory says the two options are morally equivalent, you haven't captured supererogation; you've captured indifference.

  **3. The Optionality Condition (The Paradox Solver)**
  *   **The Requirement:** The agent must be free to choose the lesser alternative without being morally blameworthy, irrational, or failing to do what they "ought" to do all-things-considered.
  *   **Motivating Case:** This addresses the **Paradox of Supererogation**. If Act A (jump on grenade) is morally better than Act B (dive for cover), standard rationality suggests we ought to maximize the good. If we "ought" to do A, then B is forbidden. If B is forbidden, A is obligatory. To save supererogation, the theory must explain how an agent can rationally and morally permissibly choose the *lesser* moral option.

  **4. The Impact-over-Cost Condition**
  *   **The Requirement:** The definition must rely on the *magnitude of the good produced* rather than the *magnitude of the sacrifice incurred* by the agent.
  *   **Motivating Case:** This addresses your **Billionaire vs. Kidney Donor** worry. If we define supererogation by sacrifice (pain, loss, risk), the billionaire who gives away $100 million painlessly is not supererogatory, while the pauper giving $10 is. This seems wrong. The moral significance lies in the lives saved, not the agent's utility curve. A theory that requires suffering as a necessary condition glorifies inefficiency. Sacrifice is often *correlated* with supererogation, but it should not be *definitional*.

  **5. The Stability Condition (Anti-Treadmill)**
  *   **The Requirement:** Performing a supererogatory act once cannot generate a duty to perform it again in relevantly similar future circumstances.
  *   **Motivating Case:** This addresses the **Treadmill Worry**. If a saintly person visits the sick every weekend, and their virtue makes it "expected," does it become obligatory? If moral progress converts supererogation into duty, then the category is self-annihilating. The theory must ground duty in external principles (need, promise, role), not in the agent's past history of virtue. The saint must remain free to retire without blame.

  **6. The Other-Directedness Condition**
  *   **The Requirement:** Supererogation must be directed toward others (or a cause external to the self), not toward oneself.
  *   **Motivating Case:** This addresses **Self-Directed Supererogation**. Can I go beyond the call of duty to myself? (e.g., training harder than required for my own health). I am taking a hard line here: No. Duties to self are conceptually fragile; if I release myself from a duty, it wasn't a duty. Supererogation implies a credit owed to a recipient who had no claim to the act. You cannot owe yourself a debt you didn't have to pay. Self-regarding "extra" acts are prudence or ambition, not supererogation.

  **7. The Symmetry Condition (Actions and Omissions)**
  *   **The Requirement:** The theory must allow for supererogatory omissions (forbearances), not just positive actions.
  *   **Motivating Case:** Consider **Forgiveness**. I have a right to resent you for a grievous wrong. Choosing *not* to exercise that right (omitting the resentment) can be a moral gift beyond duty. If your theory only accounts for "doing more," it misses the supererogation of "demanding less."

  ***

  ### Non-Negotiables vs. Camp Hang-ups

  **Non-Negotiable (The Core):**
  Requirements **1 (Deontic Separation)**, **2 (Betterness)**, and **3 (Optionality)** are the trinity. If you drop any one of these, the concept collapses.
  *   Drop *Betterness*, and it's just permission.
  *   Drop *Optionality*, and it's duty.
  *   Drop *Separation*, and you're just playing with words.
  Any theory that cannot simultaneously hold that the act is *better* yet *optional* has failed the spec.

  **Camp Hang-ups (Discard These):**
  *   **The Sacrifice Requirement:** Many traditional accounts insist the agent must suffer. As argued in Requirement 4, this is a hang-up of ascetic or Kantian-leaning views that distrust easy goodness. It should be treated as a contingent feature, not a necessary one.
  *   **The Heroism Requirement:** Some theories insist the act must be "heroic" or "saintly." This is too high a bar. Small-scale supererogation (letting someone go ahead of you in line when you're in a rush) exists. The *structure* matters, not the magnitude.

  ***

  ### The Incompatibility Flag

  Here is the hard truth you need to put on the table for the group: **Requirements 2 (Betterness) and 3 (Optionality) are logically unstable together under standard deontic logic.**

  If we accept the standard principle that "If A is morally better than B, one ought to do A," then supererogation is impossible. To satisfy the spec, a theory *must* reject or modify standard maximizing rationality.
  *   **The Conflict:** You cannot have a theory that says "Maximize the good" (Consequentialism) and "You can choose the lesser good" (Supererogation) without contradiction.
  *   **The Result:** Any adequate theory *must* introduce an **Agent-Centered Prerogative**. It must assert that agents are permitted to give some weight to their own interests that outweighs the marginal moral gain of the supererogatory act.
  *   **The Cost:** This means the theory will inevitably look somewhat dualistic (balancing impersonal good against personal permission). If a theory claims to be purely monistic (only one source of value), it will likely fail to satisfy both 2 and 3 simultaneously.

  Furthermore, **Requirement 4 (Impact)** and **Requirement 3 (Optionality)** are in tension. If the Impact is high enough (e.g., saving a life at zero cost), intuition screams that it becomes *obligatory* (the "Easy Rescue" case). If you insist it remains *optional* even when the cost is zero and the impact is massive, your theory risks making morality too weak. If you insist it becomes *obligatory* when cost is zero, you erase the Billionaire case from the supererogatory category. You have to choose: Is zero-cost high-impact supererogatory, or obligatory? You can't easily have both.

  ***

  ### The Killer Requirement

  If I have to pick the single requirement that does the most work in ruling out popular theories, it is **Requirement 3: The Optionality Condition.**

  **Why:**
  1.  **It kills Act Consequentialism immediately.** Consequentialism dictates that the act producing the most good is the act one ought to do. There is no logical room for "better but optional." To accommodate supererogation, consequentialists have to contort themselves into "satisficing" views or indirect theories, which often break the theory elsewhere.
  2.  **It pressures Kantianism.** While Kantianism handles duty well, it struggles with the "beyond duty" concept because the Moral Law is typically seen as binding. If an act is morally necessary to respect humanity, skipping it is a violation. Kantianism often reclassifies supererogatory acts as "wide duties," but if the duty is wide enough to be optionally skipped without blame, does it remain a duty? Optionality exposes the rigidity of deontological frameworks.
  3.  **It forces the metaphysical hand.** To satisfy Optionality while maintaining Betterness, you are forced to admit that moral rationality is not just about "tracking the good." You have to build a theory of *agency* that allows for rational moral underachievement. That is the heaviest lift in normative ethics.

  Tell your group: If your theory explains why the act is good, but can't explain why I'm not a jerk for skipping it, you don't have a theory of supererogation. You have a theory of regret.
