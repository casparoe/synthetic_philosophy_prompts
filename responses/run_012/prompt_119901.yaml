answer: |-
  **Specification for Personal Identity Theories**

  Any adequate theory must satisfy the following desiderata regarding who survives what and what matters in survival. Each states a condition of failure, the motivating case, and its status.

  1.  **Perspectival Alignment:** A theory fails if it locates the subject contrary to their first-person report. *Case:* Dennett's "Where Am I?" (brain in vat, body elsewhere). *Justification:* This is not a preference for dualism; it is a constraint on accuracy. Identity must track the subject of experience; denying the reported location contradicts phenomenological data essential to defining the subject. **Status: Non-negotiable.**

  2.  **Interrupted Continuity:** A theory fails if it posits cessation of existence during temporary physical disruption of the sustaining organ. *Case:* Stuttering transplant (brain isolated then implanted). *Justification:* Consciousness persists through the interval. Declaring death violates the continuity of experience confirmed by the subject upon reconnection, ensuring survival is not hostage to arbitrary physical arrangements. **Status: Non-negotiable.**

  3.  **Fission Symmetry:** A theory fails if it assigns identity to one duplicate over another without qualitative distinction. *Case:* Duplication (brain copied). *Justification:* Both successors share equal psychological continuity. Arbitrary asymmetry violates logical indifference principles regarding extrinsic factors like location or timing of copying, ensuring intrinsic facts do not depend on extrinsic duplicates. **Status: Negotiable.**

  4.  **Fusion Determinacy:** A theory fails if it cannot specify whether the outcome is one subject, two, or a degree of identity. *Case:* Gradual merger. *Justification:* Moral and legal responsibility require determinate subjecthood. Radical vagueness regarding who is responsible undermines agency and practical reasoning, ensuring the theory can guide practical concern. **Status: Negotiable.**

  **Incompatibility Flag:** Desiderata 1 and 3 conflict under strict numerical identity. Both duplicates satisfy Perspectival Alignment (1), but Numerical Identity prohibits being identical to two distinct entities (3). A theory must either reject strict identity or deny one successor's claim.

  **Theory Eliminator:** The requirement that **Identity must be One-to-One (Transitive)** eliminates the most otherwise plausible theories. Standard continuity accounts typically fail this unless they sever the link between identity and what matters in survival, forcing a revision of the concept of identity itself.
