prompt: |-
  I teach a ninety-minute upper-level seminar in formal epistemology to twelve students who are comfortable with credences and conditionalization but who have only ever met van Fraassen's reflection principle as a one-line formula: your present credence in a proposition ought already to equal your expectation of the credence you will hold in it later, at least when the later credence is one you expect to arrive at without any cognitive failure on your part. On the page it looks either vacuously true or plainly false, and neither reaction is the one I want. I want them to feel the pull of the principle from the inside — to be put in a position where deferring to their own future judgment seems obviously right, and then to watch that obviousness come apart in cases involving self-doubt, foreseeable forgetting, or a future self they know will be compromised — before we ever argue about whether the principle is a coherence constraint or a substantive claim about trusting oneself. Design a runnable activity for this group and this time slot. I am happy to use an urn, a deck, a set of sealed envelopes, or a small prediction market with play money, but the payoffs must not require real stakes, and the students should construct the relevant credences themselves rather than being handed numbers. Specify the rules, the materials, a timeline that fits ninety minutes including the debrief, and any roles I need to assign. The idea should show up in what happens rather than in what I say afterwards: I want the structure of the activity to push them into the reflection-respecting move, then into a variant where the same move is clearly the wrong one, so that the debrief has something to point back to. In the debrief, map the moments of the activity onto the parts of the idea — the expectation formula itself, the Dutch-book-style case for the principle, the self-doubt case in which an agent is unsure what she will later think, and the case in which she expects her later self to be irrational, distracted, or to have lost relevant information — and tell me honestly which feature of the principle the activity cannot reproduce and which I will therefore have to supply in exposition. Also tell me what will predictably go wrong the first time I run it and how to handle that, since I would rather hear it now than discover it in front of the class. If the activity as I have imagined it cannot actually make the principle feel forceful — if the setup collapses into a trivial arithmetic exercise, or if the rules guarantee by construction that the reflective credence is always the right one, so that the students learn nothing they did not already assume — then say so plainly and tell me what to change, rather than handing me a polished lesson plan that flatters the premise.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Topic:** Van Fraassen's Reflection Principle ($C_0(A | C_t(A) = x) = x$).
      *   **Audience:** 12 upper-level students, comfortable with credences/conditionalization, know Reflection only as a formula (view it as vacuous or false).
      *   **Goal:** Make them *feel* the pull of the principle (defer to future self) and then feel it break (self-doubt, forgetting, compromise) *before* theoretical debate.
      *   **Format:** 90-minute seminar, runnable activity (urn, cards, envelopes, prediction market).
      *   **Constraints:** No real stakes (play money/points), students construct credences (not handed numbers), structure must drive the intuition (not just lecture).
      *   **Deliverables:** Rules, materials, timeline, roles, debrief mapping, limitations of the activity, predicted failures & fixes.
      *   **Critical Instruction:** If the idea won't work, say so. Don't flatter the premise.

  2.  **Evaluate the Core Challenge:**
      *   Reflection is about *diachronic coherence*. It says: If you know now what you will believe later (and you trust that later belief), you should believe it now.
      *   *The Trap:* Most classroom exercises make the "future belief" a matter of *new evidence*. If I know I will see evidence $E$, and I know how I'll update on $E$, then by Conditionalization, my current credence should match my expected future credence. This makes Reflection look like a trivial theorem of Conditionalization (which, in ideal cases, it is).
      *   *The Goal:* We need to separate "learning new evidence" from "changing mind." We need cases where the future credence changes *without* new evidence about the world, but due to internal shifts (forgetting, bias, fatigue).
      *   *The "Pull":* Why defer? Because the future self has *processed* something.
      *   *The "Break":* Why not defer? Because the future self is *broken*.

  3.  **Brainstorming Activity Concepts:**
      *   *Idea 1: Prediction Market.* Students bet on a proposition. Then they wait. Then they bet again. Problem: Hard to control *why* they change their mind. Hard to isolate "forgetting."
      *   *Idea 2: The Urn.* Classic Bayesian updating. Problem: Too clean. If they know the urn setup, Reflection holds trivially. Doesn't capture the "self-doubt" aspect well.
      *   *Idea 3: The "Sleeping Beauty" style amnesia.* Good for forgetting, but notoriously confusing and might eat up 90 mins just explaining the setup.
      *   *Idea 4: The "Cognitive Load/Distraction" Experiment.* This seems promising. Create a scenario where students make a judgment, then undergo a manipulation (time delay + distraction vs. time delay + reflection), then make a judgment again.
      *   *Idea 5: The "Sealed Envelope" Future Self.* This is the strongest candidate for *formal* epistemology. It externalizes the "future self" as a distinct agent whose credence you see but didn't generate.

  4.  **Developing the "Sealed Envelope / Future Self" Protocol:**
      *   *Setup:* There is a hidden fact (e.g., a card drawn from a deck).
      *   *Phase 1 (Now):* Students assign credence based on prior info.
      *   *Phase 2 (The Future):* A "Future Self" (simulated) will assign a credence.
      *   *The Twist:* We need two conditions.
          *   Condition A (Trust): The Future Self gets *more* info or processes the current info better. Reflection should hold.
          *   Condition B (Distrust): The Future Self is compromised (drunk, tired, biased, or forgetful). Reflection should fail.
      *   *Implementation:* Since we can't actually wait days or get students drunk, we need to simulate the "Future Self" using pre-generated data or a specific protocol *they* enact but under constraints.
      *   *Better Implementation:* Use the "Expert Deference" structure but apply it to *themselves*.
      *   *Refined Idea:* **The "Two-Stage Estimation with Manipulation" Game.**
      *   *Proposition:* A specific quantitative fact (e.g., number of dots on a screen, or a specific card property). Let's go with a **Hidden Card Color** (Red/Black) but with a twist on *information access*.
      *   *Actually, let's use a "Noisy Channel" setup.*
      *   *Scenario:* There is a Hypothesis $H$ (e.g., Urn is Type A or Type B).
      *   *Time 0:* Students set $C_0(H)$.
      *   *Time 1:* They will receive a signal.
      *   *Standard Reflection:* If they know they will update on the signal, $C_0(H)$ = $E[C_1(H)]$.
      *   *Broken Reflection:* If they know at Time 1 they will be *forced* to ignore the signal or add noise.

      *Critique:* This feels too abstract. The prompt asks for them to *construct* credences and feel the pull.
      *Let's try a "Betting against your Future Self" market.*
      *   If I believe my future self will be 80% confident, should I bet at 80% odds now?
      *   If I think my future self will be drunk, should I bet at their odds?

      *Decision:* **The "Time-Capsule Credence" Activity.**
      *   **Materials:** Decks of cards, sealed envelopes, play money (chips), worksheets.
      *   **Structure:**
          1.  **Baseline:** Establish a prior about a hidden state (e.g., Card is Red).
          2.  **Condition 1 (Ideal Future):** You will get a peek at a clue in 20 mins. You trust your future self to update correctly. *Action:* Set a price for a ticket now that pays off based on the card, but the price is locked in by your *expected future credence*.
          3.  **Condition 2 (Compromised Future):** You will get the same clue, BUT you will be distracted/forced to guess randomly/forget the prior. *Action:* Set a price now.
      *   *Problem:* 20 minutes is too long for a 90 min class.
      *   *Solution:* Simulate the "Future Self" using a partner or a pre-determined algorithm they agree to bind themselves to.
      *   *Better Solution:* **The "Surrogate Future" Protocol.**
          *   Divide class into pairs. Partner B acts as Partner A's "Future Self."
          *   Partner A sets credence now.
          *   Partner B gets info and sets credence later.
          *   Partner A is scored on how well their *current* credence matched Partner B's *future* credence (Reflection Score) vs. how well it matched the Truth (Accuracy Score).
          *   *Manipulation:* In Round 1, Partner B is "Rational." In Round 2, Partner B is "Compromised" (e.g., must roll a die to adjust credence, or is given false info about the rules).

      *Wait, this makes it about trusting others, not oneself.* The prompt specifically wants "deferring to their own future judgment."
      *   *Correction:* We need a mechanism where the student commits to a credence now based on what they *predict* they will say later, and then we reveal what they actually say later.
      *   *The "Pre-Commitment" Design:*
          1.  **State:** A hidden card (Red/Black). Prior 50/50.
          2.  **Evidence:** A noisy signal (e.g., a second card drawn from a known deck correlated with the hidden card).
          3.  **Round 1 (Reflection):** Students write down: "I predict that after seeing the signal, I will assign credence $x$." They are rewarded if their *current* credence matches $x$. (This incentivizes Reflection).
          4.  **Round 2 (The Signal):** They see the signal. They update.
          5.  **Round 3 (The Breach):** We introduce a "Glitch." (e.g., "Oh, by the way, in this round, the signal is known to be inverted for half the class, but you won't know which half until later" OR "You will be asked to update, but you must forget the Prior").
      *   *Critique:* Hard to enforce "forgetting."

      *Let's pivot to the "Dutch Book" intuition without the math.*
      *   Activity: **The "Future-Self Bookie" Market.**
      *   Students are given an endowment.
      *   They can buy/sell tickets on $H$ at Time 0.
      *   They know that at Time 1 (20 mins later), they will be offered a chance to trade again at whatever credence they hold then.
      *   *The Trap:* If $C_0(H) \neq E[C_1(H)]$, a bookie can pump money out of them between Time 0 and Time 1.
      *   *Simulation:* The Instructor acts as the Bookie.
      *   *Scenario:*
          *   **Case A (Trust):** You will learn $E$. You know how you update.
          *   **Case B (Distrust):** You will learn $E$, but you know you will be tired/biased.
      *   *Execution:*
          1.  **Setup (15 mins):** Explain the "Ticket Game." Ticket pays \$10 if Card is Red.
          2.  **Round 1 (The Ideal) (30 mins):**
              *   Hidden Card (Red/Black).
              *   You will draw a clue card in 15 mins.
              *   Task: Set a buying price *now*.
              *   Constraint: You are told exactly how the clue correlates.
              *   Reveal: After 15 mins, they see clue, set new price.
              *   Payoff: If Price 0 $\neq$ Price 1 (adjusted for info), they lose points. (This enforces Reflection).
              *   *Wait, this enforces Conditionalization, not Reflection.* Reflection is $C_0(H | C_1(H)=x) = x$.
              *   To test Reflection, they need to estimate $C_1$ *before* seeing the evidence.
      *   *Revised Plan:* **The "Blind Update" Protocol.**
          *   Students must write down a table: "If I see Clue A, I will believe $x$. If I see Clue B, I will believe $y$."
          *   Then they calculate their *current* credence as the weighted average of $x$ and $y$.
          *   This makes Reflection a calculation rule.
          *   *Then break it:* In Round 2, tell them: "In 15 mins, you will see the clue, BUT you will be forced to ignore it / add noise."
          *   Now, does their Current Credence still equal the Expected Future Credence?
          *   Yes, mathematically ($E[C_1] = C_0$) holds even if the update rule is irrational, *provided* they know the irrational rule now.
          *   *Ah, the break happens when they don't know the rule, or when they doubt their ability to follow the rule.*
          *   *The Real Break:* **Self-Locating Uncertainty / Forgetting.**
          *   If I know I will forget *which* clue I saw, my future credence might revert to prior.
          *   If I know I will forget the *prior*, my future credence will be weird.

      *Okay, let's look for the "Self-Doubt" angle.*
      *   Van Fraassen's Reflection fails when I think my future self is *wrong*.
      *   Activity: **The "Calibration Shift" Experiment.**
      *   **Materials:** Two urns. Urn 1 (Fair), Urn 2 (Biased).
      *   **Phase 1:** Students know they are drawing from Urn 1. They set credence. They predict future credence. (Reflection holds).
      *   **Phase 2:** Students are told: "In 20 minutes, you will draw from Urn 2, but you will *think* it's Urn 1." (Future self is deluded).
      *   **Phase 3:** Students are told: "In 20 minutes, you will draw from Urn 1, but you will be *told* it's Urn 2." (Future self is misinformed).
      *   *Problem:* This requires deception or complex roleplay.

      *Let's go with the most robust pedagogical tool for this:* **The "Two-Stage Betting Sheet."**
      *   It forces them to put numbers on paper.
      *   It creates a tangible conflict between "What I believe now" and "What I think I'll believe later."
      *   **The Setup:** A proposition $P$ (e.g., "The hidden card is Red").
      *   **Round 1 (The Trust Condition):** You will receive a reliable signal $S$. You know your updating rule.
          *   Task 1: Write $C_0(P)$.
          *   Task 2: Write $C_1(P | S=Yes)$ and $C_1(P | S=No)$.
          *   Task 3: Calculate $E[C_1(P)]$.
          *   Check: Does $C_0 = E[C_1]$? (It should).
      *   **Round 2 (The Doubt Condition):** You will receive the same signal $S$. BUT, you know that when you receive it, you will be **distracted** such that you will only update *half as much* as you should (regression to mean).
          *   Task 1: Write $C_0(P)$.
          *   Task 2: Write what you *actually will* believe later (the compromised credence).
          *   Task 3: Decide: Should your $C_0(P)$ match your Current Best Estimate of $P$, OR should it match your Expected Compromised Future Credence?
          *   *This is the crux.* Reflection says $C_0 = E[C_1]$. But if $C_1$ is compromised, $C_0$ should *not* equal $E[C_1]$ (if $C_0$ is rational).
          *   Wait, Reflection Principle is a constraint on *rational* agents. If I know I will be irrational, Reflection doesn't apply.
          *   *The pedagogical goal:* Show that Reflection feels like a requirement of rationality *until* we introduce the "compromise," at which point following Reflection feels like endorsing the error.

      *Refining the Activity for 90 Minutes:*
      *   **0-15:** Intro & Materials.
      *   **15-45:** **Round 1: The Ideal Agent.** (Urn/Card setup). Students map out their future beliefs. They see that $C_0$ *must* equal $E[C_1]$ to avoid a sure loss (Dutch Book simulation).
      *   **45-75:** **Round 2: The Compromised Agent.** Same setup, but introduce a "Cognitive Tax." (e.g., "In the second phase, you must roll a die to determine if you are allowed to update").
      *   **75-90:** Debrief.

      *Wait, I need to make sure they "construct the credences themselves."*
      *   Don't give them the probabilities. Let them estimate based on frequency or intuition.
      *   **Proposition:** "The next card drawn from this shuffled deck is Red."
      *   **Signal:** "I will show you 5 cards from the top. If majority Red, Signal +. If majority Black, Signal -."
      *   **Round 1:** They know the deck is standard. They trust their future math.
      *   **Round 2:** They know the deck is standard, BUT they know their future self will be "tired" (simulated by a rule: "In phase 2, you must ignore the signal 50% of the time").
      *   **The Conflict:** In Round 2, if they follow Reflection, they set $C_0$ to match the *average* of the compromised future beliefs. But the *truth-tracking* credence is different.
      *   *Actually, the Reflection Principle says: $C_0(A | C_1(A)=x) = x$.*
      *   If I know my future self is compromised, then $C_1$ is not a reliable indicator of truth. So conditioning on $C_1=x$ shouldn't yield $x$.
      *   *The Activity needs to make them feel the urge to defer, then the urge to resist.*

      *Let's try a specific mechanism: **The "Pre-Committed Bet"**.*
      *   **Materials:** 12 Students. 1 Deck of Cards (remove Jokers). 2 Urns (opaque). Play Money (100 chips each).
      *   **Proposition $H$:** "The Bottom Card of the Deck is Red."
      *   **Time 0:** Students have no info. $C_0(H) \approx 0.5$.
      *   **Time 1 (15 mins later):** They will see the Top 10 cards.
      *   **Activity:**
          1.  **Phase 1 (Trust):** "You will see the 10 cards. You will update rationally."
              *   Ask: "What do you expect your credence to be if you see 8 Red?" (They calculate).
              *   Ask: "What is your credence *now*?"
              *   Show: Your 'Now' must be the average of your 'Later's.
              *   *Incentive:* If $C_0 \neq E[C_1]$, the Instructor buys low and sells high between Time 0 and Time 1. (Simulated Dutch Book).
          2.  **Phase 2 (Doubt):** "You will see the 10 cards. BUT, between seeing them and stating your credence, you will be subjected to a 'Memory Wipe' regarding the Prior." (You will forget the deck was 50/50).
              *   Ask: "What do you expect your credence to be?" (It will be extreme, based only on the sample).
              *   Ask: "Should your credence *now* match that expected future credence?"
              *   *Intuition:* No! Your future self is ignorant of the prior. You should not defer to them.
              *   *Result:* Reflection fails.

      *Is 90 minutes enough?*
      *   Setup: 10 mins.
      *   Phase 1 (Trust): 30 mins. (Calculate, Bet, Reveal, Settle).
      *   Phase 2 (Doubt): 30 mins. (Calculate, Bet, Reveal, Settle).
      *   Debrief: 20 mins.
      *   *Risk:* Calculating Bayesian updates on the fly takes time.
      *   *Fix:* Provide a "Lookup Table" for the updates so they don't get bogged down in arithmetic. The point is the *principle*, not the math. Or, use a simpler signal (1 card).
      *   *Simpler Signal:* Draw 1 card. If Red, $H$ is more likely? No, need correlation.
      *   *Best Signal:* **The "Biased Coin" Urn.**
          *   Urn A: 90% Red. Urn B: 10% Red.
          *   Hidden Fact: Which Urn is selected? (50/50).
          *   Evidence: Draw 1 ball from the selected urn.
          *   This is standard, easy to calculate.
          *   $P(A | Red) = 0.9 / (0.9+0.1) = 0.9$.
          *   $P(A | Black) = 0.1 / (0.1+0.9) = 0.1$.
          *   $E[C_1] = 0.5(0.9) + 0.5(0.1) = 0.5 = C_0$.
          *   This works perfectly for Phase 1.

      *   **Phase 2 (The Break):**
          *   Same Urns.
          *   **Manipulation:** "At Time 1, you will be told the color of the ball, BUT you will be told the *wrong* base rates."
          *   Or: "At Time 1, you will suffer from 'Recency Bias'. If you see Red, you will believe 99%. If Black, 1%."
          *   Or (Simpler): "At Time 1, you will forget which Urns are in play. You will just see a Red ball and assume it's likely Red."
          *   *Let's go with "Forgetting the Prior".*
          *   Instruction: "At Time 1, you will be sealed in a room (metaphorically). You will see the ball. But you will be given a note that says 'Ignore the Urn selection probabilities. Just judge based on the ball.'"
          *   So Future Self says: "I see Red, so I'm 90% sure it's Urn A" (Wait, that's rational).
          *   We need Future Self to be *wrong*.
          *   "At Time 1, you will be told that Urn A is 90% Red, but Urn B is *also* 90% Red." (Future self thinks evidence is useless).
          *   No, let's make Future Self *overconfident*.
          *   "At Time 1, you will be tired. You will treat the single ball draw as *conclusive*." (Credence 1.0 or 0.0).
          *   So $C_1(A | Red) = 1$. $C_1(A | Black) = 0$.
          *   $E[C_1] = 0.5(1) + 0.5(0) = 0.5$.
          *   So $C_0$ still equals $E[C_1]$ mathematically!
          *   *Crucial Point:* Reflection holds if you *know* you will be overconfident. $C_0(A | C_1=1) = 1$? No.
          *   If I know my future self will be overconfident, I should *not* defer.
          *   So $C_0(A | C_1=1)$ should be $0.9$ (the rational update), not $1$.
          *   This violates Reflection: $C_0(A | C_1=1) \neq 1$.
          *   *This is the target.*

      *Plan Confirmation:*
      1.  **Urn Setup:** Urn A (9R, 1B), Urn B (1R, 9B). Selected by coin flip.
      2.  **Phase 1 (Rational Future):** Students know they will update correctly.
          *   They compute $C_1$. They compute $C_0$. They see $C_0 = E[C_1]$.
          *   They bet. If they deviate, they lose money (Dutch Book).
      3.  **Phase 2 (Irrational Future):** Students know they will update *irrationally* (e.g., treat 1 ball as 10 balls).
          *   They compute $C_1$ (the irrational one).
          *   They compute $C_0$ (the rational current one).
          *   They see $C_0 \neq C_1$ (conditional on the outcome).
          *   They see that deferring to $C_1$ leads to losses.
      4.  **Debrief:** Map this to Van Fraassen.

      *Predicted Failure:* Students might not grasp the "Conditional on Future Credence" part. They might just think "My future credence is X, so my current is X."
      *   *Fix:* Make the betting explicit. "I will buy a ticket from your Future Self if they are confident, but I won't pay full price."
      *   *Predicted Failure 2:* Arithmetic slows it down.
      *   *Fix:* Provide the numbers. "If Red, Rational You says 90%. Tired You says 100%."
      *   *Predicted Failure 3:* 90 mins is tight.
      *   *Fix:* Strict timekeeping. Cut the betting settlement in Phase 1 to quick checks.

      *Wait, one more check on the Reflection Principle formulation.*
      *   $C_t(A | C_{t'}(A) = x) = x$.
      *   In Phase 2 (Irrational Future), if I know Future Me will say 100% when seeing Red...
      *   Then $C_0(A | C_1(A) = 1) = P(A | Red) = 0.9$.
      *   But Reflection demands it be 1.
      *   So Reflection is violated.
      *   The activity must make them *want* to set $C_0 = 0.9$ despite knowing $C_1 = 1$.
      *   This creates the tension.

      *Materials:*
      *   2 Urns (boxes).
      *   Red/Black chips (or cards).
      *   Worksheets (Current Credence, Expected Future Credence, Betting Slips).
      *   Play money.
      *   Timer.

      *Roles:* Instructor (Bookie/Facilitator). Students (Agents).

      *Timeline:*
      *   0-10: Setup & Rules.
      *   10-35: Round 1 (Rational Future).
      *   35-60: Round 2 (Compromised Future).
      *   60-90: Debrief.

      *Refining the "Compromise":*
      *   How to simulate "Tired/Overconfident" without actually tiring them?
      *   *Instruction:* "In Round 2, you are instructed to adopt the 'Gambler's Rule': If you see Red, you must assign 100% to Urn A. If Black, 100% to Urn B."
      *   This forces the future credence to be irrational.
      *   The question is: What do you believe *now*?
      *   If you follow Reflection, you must believe 100% now (conditional on seeing Red).
      *   But you know the rule is stupid. So you believe 90% now.
      *   Conflict achieved.

      *Wait, does Reflection apply if I know I will be irrational?*
      *   Van Fraassen: Reflection applies when you expect to be rational.
      *   The activity shows *why* that clause is there.
      *   The "Pull" comes from Round 1. The "Break" comes from Round 2.

      *One detail:* "Students should construct the relevant credences themselves."
      *   I shouldn't just give them "90%".
      *   I should let them draw the balls a few times in a demo to estimate the likelihoods.
      *   Or, give them the urn composition but let them calculate the posterior.
      *   "Construct" implies they derive the number, not that they invent it arbitrarily. Deriving from urn composition counts.

      *Final check on "Predictably Go Wrong":*
      *   Students treating the "Future Self" as a different person.
      *   Fix: Emphasize "This is YOU in 20 minutes."
      *   Students getting confused by conditional probability notation.
      *   Fix: Use plain English on worksheets ("If you see Red, what will you think?").
      *   Time overrun.
      *   Fix: Pre-print the urn stats. Don't make them count chips.

      *Limitation to disclose:* The activity simulates "knowing the future credence" by *stipulating* the update rule. In real life, we rarely know exactly what we will believe. The activity solves the "access" problem by fiat, which is a limitation. I need to mention this.

      *Let's write the plan.*
answer: |-
  ### Activity: The "Future-Self Bookie" Protocol

  **Objective:** To move students from viewing the Reflection Principle as a abstract formula to experiencing it as a pragmatic constraint on diachronic coherence, and then to identify the specific conditions (trust in future rationality) under which that constraint dissolves.

  **Materials:**
  *   **2 Opaque Urns (or Boxes):** Label them "Hypothesis A" and "Hypothesis B".
  *   **Chips/Cards:** 
      *   Urn A contents: 9 Red, 1 Black.
      *   Urn B contents: 1 Red, 9 Black.
  *   **Worksheets (1 per student):** Divided into "Round 1" and "Round 2". Columns for: *Current Credence*, *Predicted Future Credence (if Red)*, *Predicted Future Credence (if Black)*, *Buying Price*.
  *   **Play Money:** 100 "Epistemic Credits" (EC) per student.
  *   **A "Future Self" Envelope:** Each student gets one sealed envelope to open only at the midpoint.
  *   **Timer.**

  **Roles:**
  *   **Instructor:** The "Bookie" and "Time-Keeper".
  *   **Students:** The "Agents".

  ---

  ### Timeline (90 Minutes)

  #### 0:00 – 0:10: Setup & The Stake
  1.  **The Hidden State:** Explain that you will flip a fair coin. Heads = Urn A is active. Tails = Urn B is active. This is the **Truth**.
  2.  **The Evidence:** In 20 minutes, you will draw *one* chip from the active urn, show it to the class, and return it.
  3.  **The Market:** Students can buy/sell tickets that pay **100 EC** if Urn A is active (0 EC if Urn B).
  4.  **The Rule:** To prevent "money pumping," students will be scored on **Diachronic Coherence**. 
      *   *Score = 100 EC minus the difference between their Time 0 Credence and their Time 1 Credence (weighted by probability).* 
      *   *Simplified for activity:* If their Time 0 credence does not match their *expected* Time 1 credence, the Bookie (Instructor) charges a "Coherence Tax" of 10 EC.
  5.  **Goal:** Maximize EC. Maximize Accuracy (hold tickets when Urn A is true).

  #### 0:10 – 0:35: Round 1 (The Rational Future)
  1.  **Instruction:** "In 20 minutes, you will see the chip. You are to update your credence **rationally** based on the urn compositions provided on your sheet."
  2.  **Construction (10 mins):** 
      *   Students calculate: $P(A | Red)$ and $P(A | Black)$. 
      *   *Note:* Do not give them the numbers. Give them the urn contents (9/1 vs 1/9). Let them derive the posteriors (0.9 and 0.1).
      *   Students record these as their **Predicted Future Credences**.
      *   Students calculate the expectation: $0.5(0.9) + 0.5(0.1) = 0.5$.
      *   Students set their **Current Credence** (Time 0) to 0.5.
  3.  **The Bet (5 mins):** Students buy/sell tickets at 50 EC (fair price).
  4.  **The Reveal (5 mins):** 
      *   Flip coin (e.g., Urn A). Draw chip (e.g., Red).
      *   Students update to 0.9.
      *   **Check:** Did anyone set Time 0 to something other than 0.5? 
      *   *If yes:* Charge the Coherence Tax. Explain: "You knew you would believe 0.9 or 0.1. You believed 0.6. I could have sold you tickets at 0.6 and bought them back at 0.9/0.1. You lost money."
      *   *Intuition:* Deferring to the future self was cost-free and coherent. Resisting it created vulnerability.

  #### 0:35 – 0:45: The Intervention (The Break)
  1.  **Hand out the "Future Self" Envelopes.**
  2.  **Instruction:** "We are resetting. Coin flip again. New draw. Same Urns."
  3.  **The Twist:** Inside the envelope is a directive for their **Time 1 Self**. 
      *   *Directive:* "Due to cognitive fatigue/distraction, you are instructed to follow the **Gambler's Rule**: If you see Red, you must assign **100%** credence to Urn A. If Black, **0%**."
      *   *Crucial:* They know this *now* (Time 0). They know their future self will be overconfident/irrational.
  4.  **Task:** Calculate your **Current Credence (Time 0)**.

  #### 0:45 – 1:10: Round 2 (The Compromised Future)
  1.  **Construction (15 mins):**
      *   Students know $C_1(A | Red)$ will be 1.0.
      *   Students know $C_1(A | Black)$ will be 0.0.
      *   **The Conflict:** 
          *   If they follow Reflection strictly: $C_0$ must equal $E[C_1] = 0.5(1) + 0.5(0) = 0.5$.
          *   However, they know the future belief is *unreliable*. The rational update on the evidence (Red) is still 0.9.
          *   Ask them to write down what they *actually* believe now about Urn A, knowing they will be crazy later.
          *   Most will write 0.5 (the prior) or 0.9 (the rational update), but they will feel tension about the 1.0 future claim.
      *   **The Bet:** Allow them to trade tickets. 
          *   If they set $C_0 = 0.5$ (matching expected future), they are coherent but ignore the fact that their future self is broken.
          *   If they set $C_0 = 0.9$ (tracking truth), they violate Reflection ($0.9 \neq 0.5$).
  2.  **The Reveal (10 mins):**
      *   Flip coin. Draw chip.
      *   Students *must* adopt the Gambler's Rule (1.0 or 0.0).
      *   **Settlement:** 
          *   Check Accuracy: Who made money on the tickets? (Those who tracked the 0.9 rational update).
          *   Check Coherence: Who paid the Tax? (Those who tracked the 0.9 rational update violated Reflection).
      *   **Result:** Students see that following Reflection (deferring to the compromised future) protects coherence but sacrifices accuracy/truth-tracking. Following Truth sacrifices coherence.

  #### 1:10 – 1:30: Debrief & Mapping
  1.  **The Pull (Round 1):** Map the "Coherence Tax" to the **Dutch Book Argument**. When the future self is trusted, $C_0 \neq E[C_1]$ creates a sure loss. The "pull" is the avoidance of guaranteed exploitation.
  2.  **The Break (Round 2):** Map the "Gambler's Rule" to **Self-Doubt/Forgetting**. 
      *   Why did Reflection fail? Because the condition "without cognitive failure" was violated.
      *   Show the formula: $C_0(A | C_1(A)=1) = 0.9 \neq 1$. 
      *   The activity proves Reflection is not a law of logic, but a **trust constraint**.
  3.  **The Limitation (Instructor Exposition):** 
      *   *What the activity couldn't do:* It stipulated the future credence. In real life, we rarely know *exactly* what we will believe; we only have a distribution. The activity solves the "access problem" by fiat.
      *   *What you must supply:* The distinction between **Information Gain** (Round 1) and **Information Loss/Corruption** (Round 2). Reflection holds when the only change is information gain.

  ---

  ### Predicted Failures & Fixes

  **1. The Arithmetic Bottleneck**
  *   **Risk:** Students get stuck calculating Bayes factors ($0.9/1.0$) and eat up 20 minutes of Round 1.
  *   **Fix:** Print the likelihood ratios on the worksheet. "If Red, Likelihood Ratio is 9:1." Let them focus on the *credence construction*, not the arithmetic. Or, provide a lookup table: "If Red, Rational Credence = 0.9." The point is the *relation* between Time 0 and Time 1, not the derivation of Time 1.

  **2. The "Different Person" Objection**
  *   **Risk:** In Round 2, students treat the "Gambler's Rule Self" as a different agent, saying "Of course I don't defer to *him*." This trivializes the break.
  *   **Fix:** Emphasize identity. "This is *you* in 20 minutes. You will physically be the one writing 1.0 on the board. You are not deferring to a stranger; you are predicting your own mind." In the debrief, press this: "If you know you will be biased, do you have an obligation to correct for it *now*?" (Yes, which violates Reflection).

  **3. The "Trivial Truth" Reaction**
  *   **Risk:** Students say, "Well, obviously if I know I'll be crazy, I shouldn't believe what I'll believe. Reflection is just for ideal agents."
  *   **Fix:** This is actually the *desired* outcome, but you must ensure they feel the cost. In Round 2, explicitly penalize the "Truth-Trackers" with the Coherence Tax. Make them feel the pain of being **diachronically incoherent** even when they are **synchronically accurate**. The lesson is that Rationality has two masters (Truth and Coherence) and they can conflict when the self changes.

  ### Limitations to Disclose in Debrief
  Be honest about what the activity hides:
  1.  **Certainty of Future Belief:** The activity assumes you know *exactly* what $C_1$ will be (0.9 or 0.1). In reality, we are uncertain about our future reactions. Van Fraassen's principle handles this with expectation, but the activity simplifies it to a deterministic rule.
  2.  **The "Why" of the Change:** In Round 2, the change in credence is stipulated by rule. In real self-doubt (e.g., "I will be tired"), the mechanism is vaguer. You will need to explain that "cognitive failure" covers everything from forgetting priors to emotional bias.
  3.  **No True Forgetting:** We simulated forgetting via a rule. Real forgetting (loss of access to the prior) is harder to model in a classroom without actual amnesia. You must explain that if the future self *literally cannot access* $C_0$, Reflection is impossible to satisfy, not just inadvisable.

  ### If This Doesn't Work...
  If you find during Round 1 that students treat the "Coherence Tax" as just another cost of doing business and happily pay it to maintain their "true" belief, the activity has failed to generate the "pull."
  *   **Correction:** Switch to a **Dutch Book Live**. Instead of a tax, *you* (the Instructor) actively trade against them between Time 0 and Time 1. If $C_0 \neq E[C_1]$, you buy from them at Time 0 and sell back at Time 1, draining their chips visibly. Nothing makes Reflection feel forceful like watching a Bookie drain your endowment because your time-slices didn't agree.
