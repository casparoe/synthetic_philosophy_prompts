  I'm applying for a three-month summer research grant and need a proposal for roughly 8,000 words of output. My half-formed idea: the three standard critiques of effective altruism -- that it neglects institutions and structural change, that earning to give corrupts or misuses the agent who does it, and that it is skewed toward what can be measured -- are nearly always argued in isolation, and I suspect they are three symptoms of a single commitment, namely that the unit of moral analysis is the marginal intervention and that all goods are commensurable, i.e. weighable on a single scale. If that is right, the critiques stand or fall together and can be answered together; if it is wrong, at least one of them should survive even after commensurability is relaxed, and I want to know which survives and why. Write the proposal: state the question so that it has a determinate answer; explain why the standard defences of effective altruism and the standard critiques both leave it open; describe what I would actually do over twelve weeks, including how I would test the one-commitment hypothesis rather than merely assert it, what a deliberately relaxed-commensurability version of effective altruism would look like concretely enough to evaluate, and why this kind of argument-structure analysis is the right method rather than an empirical study of what donors and earners-to-give in fact do; say what a result would look like, what would falsify the hypothesis, and what would count as the project failing; and give an honest assessment of what is too ambitious for the time. Don't bother with citations -- I'll supply those myself.
