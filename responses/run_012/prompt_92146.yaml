      *   *Selection:* The **Cold Case Detective** is the standard alternative, but perhaps **Archaeological Stratigraphy/Geology** or **Medical Diagnosis** works better for the Trace/Testimony mix. Let's go with **Medical Diagnosis** or **Forensic Reconstruction**. Actually, the prompt asks for *one* better analogy. A **Forensic Reconstruction/Cold Case** hybrid is usually the strongest competitor. Let's refine: **The Architect/Restorer**. No, that implies rebuilding. **The Navigator**?
