answer: |-
  You have put your finger on the central instability in financial epistemology. In the literature, your intuition is formalized primarily as the **Grossman-Stiglitz Paradox** (1980) and the **Milgrom-Stokey No-Trade Theorem** (1982). You are correct that standard Efficient Market Hypothesis (EMH) narratives often gloss over these tensions by treating "efficiency" as a static state rather than a dynamic process with energy costs.

  Since you want a specification for an adequate theory rather than a history of thought, here is the architectural blueprint. An adequate theory of prices-as-information must satisfy the following requirements, distinctions, and constraints.

  ### I. The Phenomena (Cases the Theory Must Capture)

  These are empirical regularities. A theory that explains prices but cannot account for these is descriptively false.

  1.  **Positive Trading Volume:**
      *   *The Case:* In a world of homogeneous rational expectations, if the price reflects all information, no one holds a different valuation. If no one holds a different valuation, no one trades. Yet, volume is massive.
      *   *Requirement:* The theory must explain why agents agree to trade *at the same price*.
      *   *Status:* **Non-Negotiable.**

  2.  **The Incentive to Produce Information:**
      *   *The Case:* As you noted, if prices instantly reveal private information, the marginal value of acquiring that information is zero. Yet, billions are spent on analysis.
      *   *Requirement:* The theory must allow for a temporary monopoly on information value. Prices must reveal information *slowly enough* or *noisily enough* to compensate the discoverer.
      *   *Status:* **Non-Negotiable.**

  3.  **Volatility Without Fundamental News:**
      *   *The Case:* Prices move significantly on days with no change in underlying cash-flow fundamentals.
      *   *Requirement:* The theory must distinguish between price changes driven by new external data and price changes driven by internal market mechanics (liquidity shocks, inventory rebalancing, sentiment).
      *   *Status:* **Non-Negotiable.**

  4.  **Bubbles and Crashes:**
      *   *The Case:* Prices deviate from fundamental value for extended periods and correct violently.
      *   *Requirement:* The theory must allow for price to diverge from value without immediately invoking an arbitrageur to correct it (i.e., limits to arbitrage).
      *   *Status:* **High Priority** (Some theories define this away, but a robust theory must explain the *persistence* of the deviation).

  ### II. The Distinctions (Conceptual Hygiene)

  An adequate theory cannot conflate these concepts. Blurring them is where most paradoxes arise.

  1.  **Price as Revelation vs. Price as Truth:**
      *   *The Distinction:* A price can perfectly reveal what the market *believes* (aggregation) without those beliefs being *correct* (correspondence to reality).
      *   *Why it matters:* EMH often conflates "prices reflect available information" with "prices are correct." A biochemist knows a signal can be clear but wrong (e.g., a false positive in an assay).
      *   *Status:* **Non-Negotiable.**

  2.  **Information Aggregation vs. Information Production:**
      *   *The Distinction:* Hayek focused on aggregation (using scattered knowledge). Grossman-Stiglitz focused on production (incentivizing the creation of new knowledge).
      *   *Why it matters:* A system can be good at one and bad at the other. Perfect aggregation kills production incentives.
      *   *Status:* **Non-Negotiable.**

  3.  **Private Information vs. Common Knowledge:**
      *   *The Distinction:* Information starts private. Trading moves it toward common knowledge. The *rate* of this diffusion is a variable, not a constant.
      *   *Why it matters:* If the transition is instantaneous, you get the paradoxes you identified. If it is gradual, you get a market.
      *   *Status:* **Non-Negotiable.**

  4.  **Risk vs. Uncertainty (Knightian):**
      *   *The Distinction:* Risk is measurable probability (known distribution). Uncertainty is unknown distribution (unknown unknowns).
      *   *Why it matters:* Standard models price Risk. They struggle with Uncertainty. Bubbles often live in the gap between the two.
      *   *Status:* **Taste** (Standard finance assumes away Uncertainty; robust philosophy of science insists on it).

  ### III. The Constraints (Boundary Conditions)

  These are the laws the system cannot violate without breaking logic or physics.

  1.  **No Arbitrage (Law of One Price):**
      *   *The Constraint:* You cannot have two identical assets trading at different prices indefinitely without risk-free profit.
      *   *Status:* **Non-Negotiable.** (Though "indefinitely" is the loophole).

  2.  **Costly Information:**
      *   *The Constraint:* Acquiring and processing data requires energy/time/capital. It is not free.
      *   *Status:* **Non-Negotiable.** (This is the thermodynamic constraint of your field).

  3.  **Finite Capacity (Bounded Rationality):**
      *   *The Constraint:* Agents cannot process infinite data streams.
      *   *Status:* **Non-Negotiable.** (Treating agents as infinite processors is a modeling convenience that breaks the "incentive to learn" requirement).

  ### IV. The Jointly Unsatisfiable Pairs (The Knots)

  This is the core of your request. These are pairs of desirable properties that cannot hold simultaneously in a single static model. An adequate theory must explain *which one yields* and *under what conditions*.

  **1. Full Informational Efficiency vs. Incentive to Gather Information**
  *   **The Conflict:** If prices are fully informationally efficient (Pair A), they reveal all private information immediately. If they reveal all private information, the expected return on gathering that information is zero (Pair B). If the return is zero, no one gathers information. If no one gathers information, prices cannot be efficient.
  *   **The Resolution Requirement:** The theory must posit **Noise**. Prices must be only *partially* revealing. There must be "noise traders" (liquidity traders who trade for non-informational reasons) who obscure the informed trader's activity, allowing the informed trader to profit.
  *   **Verdict:** You cannot have **Perfect Efficiency** AND **Endogenous Information Production**. You must sacrifice Perfect Efficiency to save Information Production.

  **2. Common Knowledge of Rationality vs. Existence of Trade**
  *   **The Conflict:** If I know you are rational, and you know I am rational, and we see the same price, I cannot infer that you have better information than me just because you want to trade with me. If you want to sell, I should infer you know something bad. If I infer that, I won't buy. If we both reason this way, trade collapses (The No-Trade Theorem).
  *   **The Resolution Requirement:** The theory must introduce **Heterogeneity**. Agents must have different priors, different utility functions (liquidity needs), or different models of the world. We must be allowed to "agree to disagree."
  *   **Verdict:** You cannot have **Common Knowledge of Rationality** AND **High Trading Volume**. One must relax the definition of rationality or the commonality of knowledge.

  **3. Price Stability vs. Price as Fundamental Driver (Reflexivity)**
  *   **The Conflict:** Standard theory assumes prices *reflect* fundamentals (cash flows). However, in reality, prices *influence* fundamentals (e.g., high stock price allows cheap equity issuance, boosting growth; low housing prices trigger foreclosures, lowering values). This is a feedback loop.
  *   **The Resolution Requirement:** If prices affect fundamentals, the mapping is non-linear and potentially unstable. A theory that assumes a one-way mapping (Fundamentals $\to$ Price) cannot model bubbles driven by credit constraints or cost of capital.
  *   **Verdict:** You cannot have **One-Way Causality** AND **Real-World Financial Intermediation**. A complete theory must be dynamic and recursive.

  ### V. The Synthesis: What the "Spec" Actually Looks Like

  If you are evaluating a theory, look for how it handles the trade-offs above. An adequate theory of prices-as-information will likely look less like a physics equilibrium model and more like a **biological steady-state model**.

  1.  **It must be a Disequilibrium Process:** Prices are not searching for a resting point; they are tracking a moving target while being pushed by the tracking mechanism itself.
  2.  **It requires "Noise" as Fuel:** Noise traders are not a bug; they are the energy source that allows the information processors (informed traders) to exist. Without noise, the system starves.
  3.  **It must distinguish "Arbitrage" from "Convergence":** Arbitrage ensures prices don't diverge *too* far, but limits to arbitrage (capital constraints, risk aversion) allow them to diverge *enough* to create profit opportunities.

  **The Ultimate Test:**
  Does the theory explain why the market spends money to find the truth, without assuming the truth is already known?

  If a model assumes the price is right, it cannot explain the traders.
  If a model assumes the traders are rational, it cannot explain the volume.
  If a model assumes the volume is real, it cannot assume the price is fully efficient.

  Your intuition is correct: the "knot" is not a problem to be solved, but a tension to be managed. Any theory that claims to have untied it completely has likely cut one of the strings.
