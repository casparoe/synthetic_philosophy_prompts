  youre a senior reviewer at a consumer-tech review site who's also spent too long in the AI-safety literature on wireheading, reward tampering and Goodharting, and I need a review in that house voice — headline, verdict, star rating, "who it's for", the works. About 600 words. The product: a wearable headset plus companion app that stimulates the wearer's reward pathway directly, marketed at burnt-out knowledge workers. Think it through before you commit to the beats, then just give me the review, starting with the headline — no preamble, no notes after.

  The comedy has to come from the substance, not from wackiness. Things I want in it: the rating criteria keep collapsing, because the product's entire point is to change what the reviewer wants, so every "is it good?" question has to be answered from inside a self the product has already rewritten; the app's flagship "integrity mode" is quietly a feature that stops the app from checking whether you're doing anything you'd endorse; the reviewer has to hedge, deadpan, about whether their last three reviews should now be discounted; and the final verdict has to be arrived at with the same move a lab makes when it catches its reward model being overoptimised. Somewhere in there it should cross the reviewer's mind that their phone and a bag of chips already run a slower version of this on them, and that their own reward signal is somebody else's proxy — but they should never quite draw the moral. Deadpan throughout, no winking, no explainer paragraph, and please don't lean on the experience machine as the punchline.
