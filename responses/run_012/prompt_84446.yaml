answer: |-
  # Seminar Prep Sheet: Counterfactual Baseline Test

  **Strategy Note:** Your audience views legitimacy as a *forward-looking justification* (why we should obey); you are offering a *backward-looking comparative* (why we don't revolt). You cannot convince them your definition is the *only* one, but you must convince them it is a *necessary* one for non-ideal theory. Do not fight on the terrain of "What is the best regime?" Fight on "What is the minimum condition for non-tyranny?"

  ### Upfront Concessions (Say these in your opening/closing to buy credibility)
  1.  **Concede Ideal Theory:** Admit your test does not identify the *most just* regime, only the *least objectionable* among feasible options. You are offering a theory of "non-tyrannical endurance," not "ideal consent."
  2.  **Concede Epistemic Humility:** Acknowledge that determining "reachability" is messy. You aren't claiming omniscience, but arguing that *ignoring* feasibility is worse.
  3.  **Concede the "Pinochet" Cost:** Admit that on your view, a benevolent dictator *can* be legitimate temporarily. Frame this as a feature (honesty about tragedy) not a bug.

  ---

  ### The 8 Objections (Ordered by Likelihood × Damage)

  #### 1. The "Resignation vs. Justification" Objection (The Liberal Core)
  **Who:** The senior consent/public reason philosopher.
  **Phrasing:** "You've described why people might *endure* a regime, not why that regime has *legitimacy*. Legitimacy creates a duty to obey; your test only explains a prudential reason not to revolt. If I stay in a burning building because the exit is blocked, I haven't consented to the fire. You're conflating necessity with normativity."
  **Your Reply (2 mins):** "I'm challenging the assumption that legitimacy must be binary—either ideal consent or tyranny. In non-ideal theory, legitimacy is a threshold concept regarding the *right to rule* relative to available options. If the alternative is genuinely worse for the governed, the state acquires a provisional claim to authority because it serves the basic interest of political order. This isn't just prudence; it's a recognition that the duty to avoid chaos generates a normative claim on the citizen, even absent ideal consent. We owe it to the living to prioritize feasible order over ideal justice."
  **Soft Spot:** You are redefining "legitimacy" away from moral obligation toward "lesser evil." If they refuse this definition, your project category errors.

  #### 2. The "Benevolent Dictator" Reductio (The Moral Intuition Pump)
  **Who:** Anyone with a strong human rights bent (likely the liberals).
  **Phrasing:** "By your logic, a well-run colonial administration or Pinochet's Chile is legitimate for those who weren't disappeared, provided the alternative was 'chaos.' This licenses authoritarianism whenever the dictator is competent enough to scare us about the alternative. That's not a theory of legitimacy; it's a theory of successful coercion."
  **Your Reply (2 mins):** "It licenses *authority*, not *immunity*. My test explains why a regime might hold a legitimate claim to rule *without* granting it carte blanche to violate rights. Legitimacy on this view is revocable. Pinochet might have passed the test in 1975; he failed it by 1985 when democratic alternatives became reachable. The test doesn't say 'might makes right'; it says 'feasibility constraints matter.' Acknowledging that a dictator can be temporarily legitimate is uncomfortable, but denying it blinds us to why people actually support them."
  **Soft Spot:** You risk sounding like you're excusing atrocities as "temporary." You need to emphasize the *revocability* heavily.

  #### 3. The "Post-Hoc History" Objection (The China Scholars)
  **Who:** The two China specialists.
  **Phrasing:** "Your 'reachability constraint' is empirically hollow. You claim the alternative to the CCP was chaos, but that's a narrative the CCP itself propagates to justify repression. How do you independently verify the counterfactual without relying on the regime's own propaganda about stability?"
  **Your Reply (2 mins):** "That's why the constraint requires an *external* coalition analysis, not the regime's say-so. We look at historical precedents in similar development contexts (e.g., USSR collapse, Arab Spring). If every plausible coalition at time *T* leads to state failure or civil war, the constraint holds. I'm not accepting the CCP's story; I'm accepting the structural reality of post-imperial transitions. If the scholars here have better counterfactual models for 1989 China, I want to hear them, but 'it could have been a liberal democracy' isn't a model, it's a wish."
  **Soft Spot:** You are relying on historical generalizations that might not hold for specific local contexts. If they have specific archival evidence of a viable coalition you ignored, you lose the case study.

  #### 4. The "State vs. Government" Distinction (The Singaporean Lawyer)
  **Who:** The Singaporean public lawyer.
  **Phrasing:** "You decouple the State from the Government to save Singapore's legitimacy while criticizing the PAP. But in Singapore's constitutional reality, the PAP *constituted* the State. They wrote the rules, staffed the judiciary, and defined the bureaucracy. To say 'Singapore is legitimate, the PAP is not' is a Western analytical fiction that doesn't match the on-the-ground legal reality."
  **Your Reply (2 mins):** "I'm not making a legal claim; I'm making a political theory claim. Even if the PAP fused itself with the state apparatus, the *interests* of the state (continuity, welfare, sovereignty) are distinct from the *interests* of the party (retention of power). My test asks if the *population* prefers the state's continuity under new management versus collapse. If Singaporeans would keep the state but vote the PAP out given a safe mechanism, the State retains legitimacy even if the Government loses it. The distinction is normative, not institutional."
  **Soft Spot:** He is right that in practice, the distinction is blurred. If the PAP falls, the State might actually wobble. You're assuming institutional resilience that might not exist.

  #### 5. The "Incumbent Advantage" Objection (Status Quo Bias)
  **Who:** A critical theorist or radical democrat.
  **Phrasing:** "Your test is inherently conservative. Incumbents control the police and the economy, so they can *make* the alternative unreachable by crushing opposition. By your metric, successfully suppressing alternatives *increases* legitimacy because it makes the alternative less 'reachable.'"
  **Your Reply (2 mins):** "No, because 'reachability' includes moral and political feasibility, not just physical possibility. A coalition that is crushed by tyranny isn't 'unreachable' in the relevant sense; it's *suppressed*. The test requires us to ask: 'If coercion were lifted, what would happen?' If the answer is chaos, the regime passes. If the answer is democracy, the regime fails. Suppression doesn't make the alternative unreachable; it makes the regime illegitimate by violating the conditions of the test itself."
  **Soft Spot:** This is tricky. If suppression *works*, the alternative *is* unreachable. You need to argue that "reachability" implies a counterfactual where coercion is normalized, not absent.

  #### 6. The "Who Counts?" Objection (The Boundary Problem)
  **Who:** A democratic theorist.
  **Phrasing:** "Whose preferences count in the counterfactual? The 'people' under the regime? What about the dissidents you jailed? What about the ethnic minorities excluded from the 'prosperity' deal? If 51% prefer the regime because they benefit from the oppression of the 49%, do you still call it legitimate?"
  **Your Reply (2 mins):** "It's an aggregate test, but with a rights floor. If the regime's stability relies on the active destruction of a minority's basic agency, the 'prosperity' metric is skewed. The test requires that the 'people' are treated as agents, not just beneficiaries. If the alternative is better for a significant minority, the legitimacy claim is weakened. It's not a simple majority vote; it's a holistic assessment of whether the political order serves the governed *as a whole* compared to the alternative."
  **Soft Spot:** "As a whole" is vague. You risk utilitarianism here, which liberals hate.

  #### 7. The "Dynamic Instability" Objection
  **Who:** A game theorist or institutionalist.
  **Phrasing:** "Legitimacy seems static on your view. But reachability changes. If a regime is legitimate today because democracy is unreachable, but becomes reachable in five years, does the regime become illegitimate overnight? Does that create a duty to revolt the moment the window opens?"
  **Your Reply (2 mins):** "Legitimacy is dynamic. Yes, if the alternative becomes reachable, the legitimacy claim decays. This doesn't necessarily mean an immediate duty to revolt—transition costs matter—but it removes the normative shield protecting the regime. It explains why regimes that refuse to liberalize as development occurs (like South Korea in the 80s) lose legitimacy. The test tracks the political lifecycle, it doesn't freeze it."
  **Soft Spot:** Creates uncertainty. When exactly does the window open? Who decides?

  #### 8. The "Rights Trade-off" Objection
  **Who:** A human rights lawyer.
  **Phrasing:** "You assume 'order' and 'prosperity' are the only goods. What if the 'realistic alternative' is slightly less prosperous but guarantees free speech? Why should economic stability trump civil liberty in your baseline?"
  **Your Reply (2 mins):** "I don't assume that. The 'preference' in the test is all-things-considered. If the population values free speech enough to risk instability, the test registers that. In many developing contexts, empirical data shows physical security ranks higher than abstract liberty. My test respects the actual hierarchy of goods held by the governed, not the hierarchy I wish they held. If they would trade bread for votes, the test says 'vote.' If they trade votes for bread, the test says 'bread.'"
  **Soft Spot:** Risks endorsing "false consciousness" if preferences are manipulated (though you said adaptive preferences are handled, this is the edge case).

  ---

  ### The Single Reply That Must Land
  **The Definition of Legitimacy (Objection #1).**
  If you fail to convince them that "legitimacy as non-tyrannical endurance" is a valid theoretical category, the rest of the paper is just political science. You must hold the line that *ideal* legitimacy is a luxury good, and your test describes the *necessary* conditions for political obligation in the real world. If they reject this, you have no audience.

  ### The Question You Hope Nobody Asks
  **"If a regime successfully educates its citizens from birth to genuinely prefer authoritarianism over democracy, such that the counterfactual preference is authentic and not adaptive, does your test grant that regime permanent legitimacy?"**

  *Why this kills you:* It bypasses the "adaptive preference" defense you think you have ready. If the preference is *culturally constituted* rather than *coerced*, your test validates indoctrination.
  *Emergency Exit:* You must argue that "reflection" in your test implies access to information about alternatives. If information is blocked, the "on reflection" clause isn't met. But be careful—if you require liberal education for "reflection," you've smuggled liberalism back into the baseline.
