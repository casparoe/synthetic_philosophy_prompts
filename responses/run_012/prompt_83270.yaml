answer: |-
  Where my verdicts collide
  Your core collision is between the plurality compromise and the IRV compromise. In both cases, you mark a ballot contrary to your true favorite to prevent a worse winner. In plurality, you label this "coordination" and deem it fine; in IRV, you label it "lying on a form" and deem it corrupt. The physical act is identical: submitting data that misrepresents your internal state to influence an aggregate outcome. The inconsistency lies in treating the same strategic calculation as virtuous coordination in one interface and unethical falsification in another. If plurality strategizing is merely betting on others' behavior, IRV strategizing is the same bet, just with richer data. You cannot consistently hold that misrepresenting preferences is acceptable when the system is dumb (plurality) but forbidden when the system is smart (IRV), unless the ethics depend on the ballot's wording rather than the consequence.

  Candidate principles
  1. **Interface Truthfulness (About Acts):** Check the semantic claim of the input field. Does the mechanism ask for a factual report ("Rank these") or a strategic commitment ("Who gets your support")? If the interface claims to record a fact, falsifying it is an act of lying. If it asks for a commitment, strategizing is honoring the commitment to influence. To apply this, read the ballot instructions literally. If it says "True Preference," deviation is a lie. If it says "Vote For," deviation is tactics. This clears auctions (price commitments) but condemns IRV compromise (factual ranking requests).

  2. **Signal Integrity (About Meanings):** Analyze what public information the mechanism produces. Does the strategy degrade the signal for future observers or rounds? Voting produces a winner; strategies that stabilize winners preserve signal. Committees produce merit assessments; strategies that prioritize faction destroy signal. To apply this, ask: "If everyone did this, would the output still mean what it claims?" If yes, Signal Integrity holds. This permits plurality compromise (stabilizes two-party signal) but condemns logrolling (corrupts budget signal).

  3. **Fiduciary Role (About Meanings):** Identify your role relative to the mechanism. Are you a principal spending your own capital, or an agent assessing truth for an institution? Voters are principals; strategizing is fine. Committee members are agents bound to merit; strategizing is breach of duty. To apply this, ask: "Who owns the outcome?" If you own it, strategize. If the institution owns it, report truth. This explains why tenure committees feel corrupt while elections feel like games. Agents must report truth; principals may maneuver for gain. In the residency match, hospitals act as agents, making their strategy a scandal.

  New cases
  The random-voter lottery passes Interface Truthfulness (you state true preferences) and Fiduciary Role, but fails Signal Integrity catastrophically; it aggregates no information, rendering the strategy-proofness moot. It proves strategy-proofness alone is worthless without informational utility. A system can be perfectly strategy-proof and completely useless.
  Consider a mechanism where truth-telling is dominant but leads to outcomes everyone hates (e.g., a rule forcing maximum spending regardless of input). This passes Interface Truthfulness but fails outcome utility; however, it doesn't feel "corrupt," just broken. This separates "bad design" from "unethical behavior." You can follow the rules perfectly in a broken system without moral fault.
  Regarding symmetry: If everyone logrolls symmetrically, the system doesn't collapse, yet it remains uneasy. Universalizability does not rescue logrolling because it fails Signal Integrity—the budget no longer reflects value, only deal-making power. Symmetry ensures stability, not legitimacy. The random voter case confirms your suspicion: strategy-proofness is not the terminal value. The value is whether the mechanism extracts useful information from participants without inviting them to destroy the signal to gain leverage. Even if everyone lies symmetrically in a committee, the merit signal is dead. Thus, Signal Integrity trumps Universalizability. The 'dominant strategy to hate' shows that strategy-proofness is a mechanical property, not a moral one.

  Which verdict I should give up
  You should give up the verdict that IRV compromise is "not fine." Your acceptance of plurality compromise admits that voting is inherently strategic coordination, not truth-telling. The "lying on a form" feeling is interface fetishism. IRV invites truth, but does not mandate it as a moral duty; it merely makes truth safer. If you accept that voters are principals coordinating to avoid waste in plurality, you must accept they are doing the same in IRV. The committee verdict stands because committee members are agents fiduciarily bound to merit, not principals bound to power. The auction verdict stands because price discovery expects strategic shading. But voting is about power aggregation. Treating IRV ballots as sacred truth-claims imposes a moral burden on voters that plurality voters rightly ignore. Consistency demands you view all voting as strategic coordination, regardless of the ballot's syntax. The discomfort comes from IRV promising safety you don't trust, not from the act itself. Drop the IRV prohibition; keep the committee prohibition. Your gut distinguishes power games from truth-seeking missions; IRV is the former, not the latter.

  Bottom line
  Endorse **Signal Integrity**. Strategy is permissible when it preserves or enhances the mechanism's informational output (winners in elections, prices in auctions). It is forbidden when it corrupts the signal the mechanism is designed to broadcast (merit in committees, public good in logrolling). Strategy-proofness is irrelevant if the signal is noise. Vote strategically to coordinate power; do not strategize when tasked with reporting truth. The goal is not honest inputs, but honest outputs. Protect the signal, not the ballot.
