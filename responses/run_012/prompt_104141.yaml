answer: |-
  You have put your finger on one of the most debated topics in critical memory studies. You aren't imagining it; scholars, historians, and sociologists have been wrestling with this exact paradox for decades.

  There isn't one single dictionary word that captures the whole twist, but there is a cluster of terms that, when put together, name exactly what you're seeing.

  ### The Closest Existing Terms

  **1. Performative Contrition**
  This is the most common critical term for what you're describing. It refers to public displays of guilt or remorse that are designed to *perform* a moral identity rather than to enact material change. Like "performative allyship," it focuses on the signal rather than the substance. The goal isn't to fix the damage; it's to be seen as the *kind of person (or country)* that fixes damage.

  **2. Depoliticized Memory**
  This captures the "safe past" aspect you noticed. When memory is depoliticized, the historical event is turned into a universal moral lesson ("Never Again for All Humanity") rather than a specific political claim ("Pay reparations to these specific descendants"). By making the lesson universal, you make it everyone's responsibility and therefore no one's specific liability. It removes the teeth from the memory.

  **3. Mnemonic Innocence**
  This is a sharper, more academic term. It describes the process of remembering the past in a way that preserves the *innocence* of the present nation. You acknowledge the crime specifically so you can declare it "over," thereby absolving the current state of any ongoing connection to it. It uses memory to draw a line under the past, rather than to trace its lines into the present.

  **4. Vergangenheitsverwertung**
  You mentioned the German term *Vergangenheitsbewältigung* ("mastering the past"). Critics often use this punning alternative, which translates to **"marketing the past"** or **"exploitation of the past."** It suggests that Germany (and others) sometimes use their reputation for remembering as a form of moral currency on the world stage, trading guilt for legitimacy.

  ### A Name for the Phenomenon

  If you want a label to use in conversation that distinguishes this from genuine remorse, I suggest:

  **Commemorative Absolution**

  **Definition:** *The use of public remembrance (monuments, museums, apologies) as a ritual transaction intended to purchase moral clearance for the present, specifically by focusing on symbolic acknowledgment while excluding material restitution or structural change.*

  ### The Edges: How to Tell It Apart

  You asked for the boundaries. Here is how **Commemorative Absolution** differs from the nearest neighbors:

  | Concept | Relationship to the Past | Goal | Material Cost |
  | :--- | :--- | :--- | :--- |
  | **Commemorative Absolution** | The past is a **closed chapter**. It is a finished story we can learn from. | To certify the *current* nation as morally enlightened. | **Low.** Budgets for museums, not reparations. |
  | **Genuine Remorse** | The past is an **open wound**. It is unfinished business. | To repair harm and restore dignity to victims. | **High.** Involves restitution, policy change, wealth transfer. |
  | **Nostalgia** | The past is a **lost golden age**. | To return to or honor a perceived better time. | **Variable.** Often seeks to restore old hierarchies. |
  | **Forgetting (Amnesia)** | The past is **erased**. | To avoid discomfort or shame entirely. | **None.** Silence is free. |

  ### The Key Mechanism: "Temporal Safe-Zoning"

  The specific twist you noticed—that the remembering gets loudest when it's safe—is often called **Temporal Safe-Zoning**.

  *   **Safe:** The perpetrators are dead. The victims are dead. No one can sue.
  *   **Unsafe:** The perpetrators are corporations that still exist. The victims are living neighbors. The wealth stolen is still in family trusts.

  **Commemorative Absolution** thrives in the Safe Zone. It converts history into *culture* (which we consume) rather than *justice* (which we pay for).

  ### Why "Memory Culture" Isn't Enough
  You were right to reject "memory culture." That term is neutral; it just means "a society that values remembering." A country can have a robust memory culture that is either **restorative** (leading to change) or **absolutory** (leading to pride). Your observation is about the latter.

  ### Summary
  If you need to name it in a sentence:
  *"That isn't genuine accountability; it's **commemorative absolution**. They're using the memory of the crime to buy immunity from the consequences of it."*

  Or, if you want to sound more academic:
  *"It's a case of **depoliticized remembrance**, where the symbolic act of remembering replaces the material work of repair."*

  You've identified the difference between **remembering to change** and **remembering to feel changed.** The former is justice; the latter is identity politics on a national scale.
