answer: |-
  There is no single universal label, but the formal theorem you recall is the **No-Trade Theorem** and the heuristic is colloquially known as **Groucho Marx's Law**.

  The **No-Trade Theorem** (Milgrom and Stokey, 1982) states that in a market where agents are rational, share common priors, and know each other to be rational, speculative trade based purely on private information cannot occur. The logic is exactly what you described: if someone is willing to take the other side of your bet, their willingness reveals that they possess information contradicting yours; updating on this fact should align your beliefs enough to eliminate the perceived profit opportunity. The theorem assumes **common priors** (you and the counterparty start with the same baseline probability distribution) and **common knowledge of rationality** (you know they are rational, they know you are rational, etc.). It is not a claim that markets are perfectly efficient in the sense of prices always being right, but rather that *volume* should be zero if everyone is trading solely on private information differences.

  This differs from **Adverse Selection** (Akerlof's "Market for Lemons") in a subtle but crucial way. Adverse selection typically concerns hidden *traits* or quality (e.g., the seller knows the car is a lemon), whereas the No-Trade Theorem concerns hidden *information* or signals about a common value (e.g., the trader knows a specific news item). You feel Adverse Selection doesn't quite fit because it usually implies a structural asymmetry in quality, while your prediction market example is about divergent interpretations of the same event. However, both fall under the broader umbrella of **Information Economics**, where the act of transacting itself conveys data.

  It is distinct from the **Efficient Market Hypothesis (EMH)**, which claims prices reflect all available information; the No-Trade Theorem explains *why* trade might not happen even if information exists, whereas EMH explains why prices move. It differs from the **Winner's Curse**, which applies specifically to auctions where the winner is the one who most overestimated the value; your scenario is bilateral trade, though the informational inference is similar. It is also not the **"Why aren't you rich?"** taunt, which is an ex-post performance critique; the No-Trade intuition is an ex-ante inference about the counterparty's private state before the trade executes.

  The concept breaks down at specific boundaries, primarily when you introduce **noise traders** or **liquidity needs**. The theorem assumes everyone trades for information; if the person selling at 55 is selling because they need cash for rent (a liquidity shock) or is trading randomly (noise), their willingness to trade conveys no information about the asset's value, and your edge remains valid. This is why real markets have volume: not everyone is an informed rational agent. In your non-market examples (landlord, journal editor), the logic holds as **Signaling Theory**. If a landlord is desperate, it signals hidden defects (Adverse Selection); if an editor is unusually eager, it might signal the paper fits a niche they need to fill quickly rather than quality. The pattern survives there because the mechanism—inference from willingness to transact—remains intact even without a formal market price.

  Ultimately, you are pointing at one logical structure applied across different domains. In finance, it is the No-Trade Theorem; in used goods, it is Adverse Selection; in social dynamics, it is Signaling. The unifying thread is **inference from counterparty willingness**, and while economists split these into separate models based on the type of asymmetry (information vs. quality vs. liquidity), your intuition correctly identifies them as the same underlying game.
