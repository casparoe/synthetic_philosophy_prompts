answer: |-
  **Project Title:** The Architecture of Blame: A Conceptual Analysis of the Perpetrator Debate

  **1. Statement of the Problem and Research Question**

  For three decades, historical and social-scientific inquiry into the Holocaust has been dominated by a binary dispute regarding the motivation of the men who staffed the killing squads and administered the deportations in German-occupied Europe. On one side stands the situational thesis (often termed the "ordinary men" position). This position argues that the perpetrators were not distinctively monstrous or ideologically saturated but were drawn from the general population. It posits that their participation resulted from conformist pressure, obedience to authority, the brutalizing context of war, and the incremental escalation of violence. On the other side stands the ideological thesis (the "willing executioners" position). This position argues that situational factors are insufficient to explain the scale and zeal of the killing. It posits that a specific, eliminationist antisemitism was pervasive in German society, rendering the perpetrators willing and often eager agents of destruction.

  Conventionally, this dispute is treated as an empirical contest. Each side marshals archival evidence, demographic data, and testimonial records to prove that their preferred causal factor carries more explanatory weight. The assumption underpinning the debate is that there is a fixed quantity of "motivation" to be distributed between ideology and situation, and that better data will eventually allow us to calculate the correct ratio.

  This proposal challenges that assumption. It argues that the persistence of the debate is not due to a deficit of evidence, but to a category error regarding the nature of action explanation. The situational and ideological theses are not competing empirical hypotheses that can be settled by further archival discovery. Rather, they are competing claims about what a satisfactory explanation of human action must include. The situational thesis prioritizes *causal intelligibility* (making the action understandable to a modern observer by reference to universal psychological mechanisms), while the ideological thesis prioritizes *moral specificity* (locating the cause in a particular historical guilt).

  Consequently, the empirical record settles less than either side supposes. The live question is not "Which thesis is supported by the evidence?" but "What is an explanation of a perpetrator's action for?" Is the goal to make the action intelligible from the inside? To assign causal weight in a social-scientific sense? Or to allocate culpability in a moral or legal sense? These three aims select different facts as the ones that stand in need of explaining. The disagreement is driven by the aim rather than by the evidence.

  **Research Question:** *Does the disagreement between the situational and ideological theses regarding Holocaust perpetrators stem from conflicting empirical interpretations, or from incompatible normative criteria for what constitutes a sufficient explanation of action?*

  **Determinacy:** This project proceeds on the determinate premise that the disagreement is primarily conceptual, not empirical. It will argue that the debate is rationally resolvable, but not through history or psychology. It is resolvable only by establishing a hierarchy of explanatory aims. The project will defend the position that historical explanation must prioritize *intelligibility* over *culpability*, and that the failure to distinguish these aims is what sustains the stalemate.

  **2. The Impasse: Why Existing Positions Leave the Question Open**

  The current literature treats the dispute as a zero-sum game regarding motive. If one side proves the presence of situational pressure, it is often interpreted as a subtraction from ideological commitment, and vice versa. This approach leaves the question open because both sides can successfully point to evidence that supports their claim, given their underlying definitions of what counts as an explanation.

  The situational thesis relies on a model of action explanation derived from social psychology. It seeks to demonstrate that the perpetrators' conduct is consistent with how human beings generally behave under extreme duress and hierarchical command. Its explanatory ideal is *universality*. If the explanation is successful, the action becomes comprehensible to anyone, regardless of their historical or cultural location. The risk here, as critics note, is that by making the action too universal, it risks normalizing the atrocity, potentially diluting the specific historical responsibility of the actors.

  The ideological thesis relies on a model of action explanation derived from intellectual history and moral philosophy. It seeks to demonstrate that the perpetrators' conduct is consistent with a specific worldview held by a specific group at a specific time. Its explanatory ideal is *particularity*. If the explanation is successful, the action is anchored in a unique historical pathology. The risk here is that by making the action too specific, it renders the perpetrators alien monsters, potentially shielding contemporary societies from recognizing similar structural dangers within themselves.

  Because these two positions are aiming at different targets, they talk past one another. When the situational thesis presents evidence of peer pressure, the ideological thesis rejects it as insufficient because it does not account for the *choice* to kill. When the ideological thesis presents evidence of antisemitic rhetoric, the situational thesis rejects it as insufficient because it does not account for why non-ideological actors also killed.

  This is not merely a historiographical quibble. It indicates that the dispute is not about the past, but about the present function of history. The existing positions leave the question open because they refuse to acknowledge that their criteria for "sufficiency" are normative. They present themselves as descriptions of reality, but they are actually prescriptions for how we ought to remember. Until the criteria for explanation are made explicit and evaluated, the empirical data will continue to be cherry-picked to fit the preferred explanatory ideal. This project moves beyond a survey of these positions by refusing to adjudicate the evidence. Instead, it adjudicates the *standards* by which the evidence is judged.

  **3. Methodology: Conceptual Analysis of Action**

  This project is not an archival investigation. It does not propose to uncover new documents or re-analyze demographic data. To do so would be to replicate the error of the existing debate: assuming that more data will resolve a conceptual confusion. Instead, the method is philosophical analysis applied to historical argumentation. It treats the existing historiography not as a record of the past, but as a corpus of texts making claims about the logic of action.

  The work will proceed in three phases over the course of the semester.

  **Phase 1: Reconstruction of Argument Structures (Weeks 1-6)**
  The first task is to map the logical structure of the two dominant theses without engaging in empirical verification. I will analyze the key texts of the debate to isolate the necessary conditions each side posits for an action to be "explained."
  *   For the situational thesis, I will identify the threshold of coercion or social pressure required to render an action "understandable." At what point does pressure become an excuse?
  *   For the ideological thesis, I will identify the threshold of belief required to render an action "willing." At what point does belief become a sufficient cause?
  *   I will examine how each side handles counter-evidence. When the situational thesis encounters evidence of zeal, does it treat it as an anomaly or as a product of situation? When the ideological thesis encounters evidence of reluctance, does it treat it as hypocrisy or as a failure of nerve?
  *   *Output:* A formal mapping of the "explanatory conditions" required by each thesis. This will demonstrate that the two sides are operating with different definitions of "agency."

  **Phase 2: Analysis of Explanatory Aims (Weeks 7-10)**
  Once the structures are mapped, I will analyze the normative commitments underlying them. This involves asking what work the explanation is intended to do.
  *   I will distinguish between *causal explanation* (identifying antecedent conditions), *rationalizing explanation* (making the agent's reasoning transparent), and *moral accounting* (assigning blame).
  *   I will test the hypothesis that the ideological thesis conflates causal explanation with moral accounting. It assumes that to explain an action is to justify the level of blame we wish to assign.
  *   I will test the hypothesis that the situational thesis conflates causal explanation with exculpation. It assumes that to make an action intelligible is to reduce the agent's responsibility.
  *   *Output:* A taxonomy of the "functions" of explanation in this debate. This section will argue that the stalemate exists because the debate is trying to serve two masters: historical truth and moral justice.

  **Phase 3: Synthesis and Resolution (Weeks 11-14)**
  The final phase is constructive. I will argue for a specific hierarchy of explanatory aims to resolve the dispute.
  *   I will defend the position that *intelligibility* is the primary goal of historical explanation, while *culpability* is a secondary, distinct moral/legal judgment.
  *   I will demonstrate that accepting this distinction dissolves the binary. An action can be fully intelligible via situational factors (making it understandable) while remaining fully culpable (making it condemnable).
  *   I will show that the ideological thesis's demand for "eliminationist antisemitism" as a necessary condition for explanation is a moral demand disguised as a causal one. It insists on a specific level of internal wickedness to satisfy our need for condemnation.
  *   *Output:* A revised framework for perpetrator studies that separates the question "How was this possible?" from "How guilty were they?"

  **Why this approach?**
  History and social psychology are ill-equipped to resolve this dispute because they operate within the existing paradigms. A historian will look for more letters; a psychologist will look for more experiments. Neither will ask why we require the explanation to look the way it does. Philosophy of action is required because the dispute is about the concepts of *reason*, *cause*, and *responsibility*. Without clarifying these concepts, the empirical data remains ambiguous.

  **4. The Moral Dimension: Rational Resolution vs. Evaluative Clash**

  A central risk of this project is the claim that if explanation is constitutive of moral evaluation, the disagreement may be a clash of values dressed up as a quarrel about causes. If the situational thesis is driven by a desire to warn modern societies (a universalist moral aim) and the ideological thesis is driven by a desire to condemn a specific regime (a particularist moral aim), then the debate is not rationally resolvable. It would simply be a conflict of political or ethical priorities.

  This proposal takes a firm stand against that relativistic conclusion. It argues that the disagreement *is* rationally resolvable, but only by rejecting the premise that historical explanation must be constitutive of moral evaluation.

  The project will defend the view that conflating explanation with culpability corrupts both. When we demand that an explanation of action must satisfy our moral need for blame, we distort the historical record. We begin to select facts not because they are causally relevant, but because they sustain a narrative of guilt or innocence. The ideological thesis risks creating a "demonology" where perpetrators are so evil they become incomprehensible, which ironically protects us from understanding the mechanisms of genocide. The situational thesis risks creating a "determinism" where perpetrators are so pressured they become automatons, which undermines the concept of agency required for moral judgment.

  Therefore, the resolution is not to choose one value over the other, but to separate the domains. We can accept the situational account as the better *historical* explanation (because it renders the event intelligible without resorting to unique pathology) while maintaining the ideological account's *moral* conclusion (that the actors were guilty). The project will argue that the "willing executioner" model is often a moral necessity for post-war justice, but a historical weakness for understanding causality.

  By defending the priority of *intelligibility*, the project argues that we gain more morally by understanding how ordinary structures produce atrocity than by insisting on the unique wickedness of the actors. This is a normative claim, but it is a rational one: it argues that a specific explanatory framework yields better long-term ethical outcomes (prevention) than the alternative (condemnation). Thus, the dispute is resolvable not by finding a middle ground in the evidence, but by agreeing on the purpose of the inquiry.

  **5. Expected Outcomes and Deliverables**

  The primary output of this research leave will be a journal article-length manuscript (approximately 8,000–10,000 words) suitable for publication in a journal intersecting philosophy of history, ethics, and Holocaust studies.

  **What a successful result looks like:**
  *   A clear demonstration that the empirical stalemate is a result of conceptual confusion.
  *   A robust defense of the separation between *explaining* action and *judging* action.
  *   A framework that allows historians to utilize situational data without fear of exculpating perpetrators, and to utilize ideological data without fear of demonizing them.
  *   The resolution of the debate not by declaring a winner, but by declaring the terms of the fight obsolete.

  **What counts as project failure:**
  *   If the analysis collapses into a mere historiographical survey, describing the debate without intervening in it.
  *   If the argument retreats into relativism, concluding that the choice between theses is purely subjective.
  *   If the distinction between "intelligibility" and "culpability" cannot be sustained under scrutiny (e.g., if it turns out that making an action intelligible *necessarily* reduces perceived culpability in a way that cannot be philosophically separated).
  *   If the scope proves too broad, resulting in a vague treatment of "explanation" rather than a specific application to the perpetrator debate.

  **6. Risks and Feasibility**

  **Risk 1: Collapsing into Historiography**
  There is a significant risk that this project becomes a meta-commentary on writing about the Holocaust rather than an analysis of action. To mitigate this, the focus will remain tightly on the *logic of action explanation*. I will not be analyzing how the history was written, but how the arguments about *human behavior* are constructed within that history. The unit of analysis is the claim about motivation, not the book itself.

  **Risk 2: The Moral Objection**
  The most serious challenge will come from the position that separating explanation from culpability is itself a moral failing—that to explain via situation is to forgive. The proposal addresses this by arguing that true prevention requires understanding mechanisms, not just assigning blame. However, this is a contentious philosophical claim. I must ensure the argument does not appear to minimize the suffering of victims. The distinction must be framed as a tool for sharper moral clarity, not a way to dilute it.

  **Risk 3: Timeframe**
  A single semester is a tight constraint for a project of this philosophical density. The risk is that the reconstruction of the two theses (Phase 1) consumes too much time, leaving the normative argument (Phase 3) underdeveloped.
  *   *Mitigation:* I will limit the textual analysis to the core logical claims of the two positions, avoiding a comprehensive literature review. I already possess a working knowledge of the primary arguments; the semester will be used for structural analysis and drafting, not initial familiarization.
  *   *Feasibility:* The project is feasible because it narrows the scope. It does not attempt to solve the problem of evil or write a new history of the Holocaust. It attempts to solve one specific methodological deadlock. The deliverable is a single, focused argument, not a monograph.

  **7. Significance**

  If successful, this project offers a way out of a thirty-year stalemate that has exhausted its empirical utility. It suggests that we have asked the evidence to do work it cannot do. By shifting the question from "What motivated them?" to "What are we trying to achieve by asking what motivated them?", the project clarifies the relationship between history and ethics.

  This has implications beyond Holocaust studies. Any field dealing with mass atrocity, war crimes, or systemic violence faces the same tension between situational and ideological explanations. If this project can demonstrate that the "ordinary" vs. "willing" binary is a false dichotomy generated by conflicting explanatory aims, it provides a template for analyzing perpetrator conduct in other contexts without falling into the traps of demonization or determinism.

  Ultimately, the project argues that we do not need to choose between seeing perpetrators as human and seeing them as guilty. We need to recognize that insisting on their monstrosity is often a way of protecting our own humanity, and that recognizing their humanity is the only way to protect the future. The research leave will provide the time necessary to construct this argument with the philosophical rigor it requires, moving the conversation from a quarrel about causes to a clarity about purposes.

  **8. Work Plan**

  *   **Month 1:** Deep reading and logical reconstruction of the two theses. Drafting the "Impasse" section. Identifying the specific logical fallacies in how evidence is currently used.
  *   **Month 2:** Developing the philosophical framework for "explanatory aims." Drafting the "Method" and "Moral Dimension" sections. Refining the distinction between intelligibility and culpability.
  *   **Month 3:** Synthesis and argumentation. Writing the core argument that resolves the dispute. Integrating the risk analysis regarding moral evaluation.
  *   **Month 4:** Revision, polishing, and formatting for submission. Peer review consultation (informal) to test the strength of the normative claims.

  This schedule allows for iterative drafting, ensuring that the philosophical argument remains grounded in the specific historical debate. The semester structure provides a hard deadline that will prevent the project from expanding into a broader, unmanageable inquiry into the philosophy of history.

  **Conclusion**

  The debate over the perpetrators of the Holocaust has reached a point of diminishing returns. More data will not solve it because the disagreement is not about data. It is about what we want history to be. This proposal seeks to make that implicit disagreement explicit, and to argue that by clarifying our explanatory aims, we can dissolve the binary that has trapped the field. It is a risky project because it challenges the moral intuitions that underpin much of the existing scholarship, but it is necessary if the field is to move beyond a stalemate that serves neither history nor justice. The semester leave is essential to provide the uninterrupted time required for this level of conceptual work, which cannot be accomplished alongside standard teaching and administrative duties. The result will be a intervention that changes not just how we view the perpetrators, but how we view the task of explaining evil itself.
