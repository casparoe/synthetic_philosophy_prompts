      *   Better Bayesian response: The language swap in (4) changes the *temporal structure* of the hypotheses relative to the evidence. $P^*$ isn't just a swap; it encodes a different view of time/stability.
      *   Wait, the strongest response is usually that **(7) is false** because rational priors are not unconstrained. If you are an Objective Bayesian, $P^*$ is *forbidden*. If you are a Subjective Bayesian, you must accept (10).
      *   Given the user wants to keep (9) (Induction isn't arbitrary), they cannot be a Radical Subjective Bayesian. They must be an Objective Bayesian or a Pragmatist.
