prompt: |-
  For the past six years I have been a career law clerk in the same chambers, writing the statutory-interpretation memos that the judge reads before deciding a hard case, and for rather longer than that I have read the rationalist blogs closely enough to have acquired a specific allergy: procedures that appear to decide a question but are legible only once you already know the answer, and arguments that launder a contestable value choice as a finding about language. I am now trying to build the judge a reusable procedure, and I would rather it announce that it is stuck than manufacture a verdict.

  Context and constraints. We get perhaps two genuinely hard interpretation cases a month; the routine ones never reach me. The memo decides which way the chambers leans, so the stakes are real — a wrong call changes what people may lawfully do — but nothing is on fire, and I have a day, occasionally two, per case. The judge signs whatever eventually issues; I do not. The judge is a committed textualist by temperament and by stated method, while I have never managed to talk myself out of the purposivist's founding intuition that a legislature's point bears on what its words mean. A procedure that only one of us can run is useless; it has to be one I can hand to the judge with a straight face.

  What I want. Not an essay on textualism versus purposivism — I know the slogans, and reciting them is the very failure mode I am trying to escape. I want a decision procedure, in order, that a clerk can actually run: the questions to ask, what counts as a sufficient answer to each, the points where the procedure returns a determinate answer and stops, and the points where it must hand the question back as a contestable value choice rather than a fact about language. Mark the steps that are judgment calls dressed up as procedure; I would rather see them labeled than disguised.

  Three commitments I have reached on my own and want the procedure to take seriously, because they are where the slogans break. First, there is a seam, somewhere, between finding a text's meaning and giving it legal effect; the interesting question is not whether the seam exists but where it falls, and whether the procedure can locate it without appealing to the very intention it was meant to discipline. Second, a legislature is not a mind: actual intent is frequently unavailable, and the stand-in — what it would have wanted — is a counterfactual that we, not they, get to specify, and I want the procedure to say plainly when it is doing this. Third, "just read the words" is not an alternative to interpretation but a decision to fix one context among several admissible ones, since the same sentence carries different content depending on which context you hold fixed; the procedure should make that choice explicit rather than pretend it away.

  Then run the procedure on three cases, at least one of which returns an answer that cuts against my purposivist sympathies — do not soften it. The first is an invented municipal ordinance: "No animal may be brought into the municipal library, except a guide dog accompanying a blind patron," with a preamble invoking protection of the collection and quiet, clean reading rooms. Apply it to a patron carrying a sealed goldfish bowl, to a trained service dog for a patron whose disability is not blindness, and to a patron carrying a taxidermied dog. The second is an invented industrial-safety scheme: "Every operator of a steam boiler in a factory shall hold a certificate from the board of examiners, and the board shall inspect each boiler annually," now confronting a factory that runs an electric induction furnace and a pressurized gas line and contains no boiler at all. The third is an invented governance provision: "A member of the board who misses three consecutive meetings shall be deemed to have resigned," applied to a member who missed three consecutive meetings, two of which were cancelled for want of a quorum and so never occurred. Do not give me a reading list or citations; I know the literature well enough to be dangerous, and I want the procedure.

  Finally, tell me how confident you are in the procedure as a whole and in each of its steps, and single out the one step you are least sure of and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Career law clerk (6 years), rationalist blog reader, allergic to "legible only once you know the answer" procedures and laundering value choices as linguistic findings.
      *   **Task:** Build a reusable statutory interpretation decision procedure for a textualist judge (while the clerk is purposivist-leaning).
      *   **Constraints:**
          *   Must be usable by both clerk and judge.
          *   Must handle ~2 hard cases/month.
          *   Time limit: 1-2 days.
          *   Must distinguish between finding meaning and giving effect.
          *   Must acknowledge legislature isn't a mind (counterfactual intent).
          *   Must acknowledge context selection is a choice ("just read the words" fixes a context).
          *   Must label judgment calls disguised as procedure.
          *   Must run on three specific hypothetical cases (Library, Boiler, Board Meetings).
          *   One result must cut against the clerk's purposivist sympathies (no softening).
          *   No reading list/citations.
          *   Must include confidence assessment and identify the weakest step.
      *   **Tone:** Professional, precise, self-aware, avoiding slogan-recitation, acknowledging uncertainty.

  2.  **Deconstruct the Philosophical Commitments:**
      *   *Seam between Meaning and Effect:* The procedure needs a step where semantic analysis stops and policy/normative analysis begins.
      *   *Legislature is not a Mind:* Avoid "what they intended." Use "public meaning at enactment" or "semantic context." Acknowledge when constructing a counterfactual.
      *   *Context is a Choice:* Explicitly state which context is being privileged (e.g., ordinary usage, technical usage, statutory scheme).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental Outline):* 1. Read text. 2. Check dictionary. 3. Check context. 4. If ambiguous, check purpose. 5. Decide.
      *   *Critique 1:* Too standard. Hides the value choices. Doesn't address the "context is a choice" commitment. Doesn't explicitly flag the "seam."
      *   *Attempt 2 (Incorporating Commitments):*
          *   Step 1: Fix the Context (acknowledge this is a choice).
          *   Step 2: Semantic Range (what *can* the words mean?).
          *   Step 3: Statutory Scheme (integration).
          *   Step 4: The Seam (if 1-3 don't resolve, admit it's a gap).
          *   Step 5: Construction (filling the gap - label this as value choice).
      *   *Refining for the Judge:* The judge is a textualist. The procedure can't start with "pick a purpose." It must start with text but be honest about how text is processed.
      *   *Key Innovation:* A "Stop Rule." If the text doesn't speak, say it doesn't speak. Don't force a result.
      *   *Labeling:* Use brackets or bold text to mark [JUDGMENT CALL].

  4.  **Developing the Steps (The "Protocol"):**
      *   *Phase 1: Context Fixation.* (Addresses Commitment 3). We must choose the linguistic community.
      *   *Phase 2: Semantic Validation.* (Addresses Commitment 1). Is the proposed reading *possible* in English?
      *   *Phase 3: Structural Integration.* (Textualist friendly). Does it fit the rest of the law?
      *   *Phase 4: The Gap Declaration.* (Addresses Commitment 2). If 1-3 fail, admit the legislature didn't decide this.
      *   *Phase 5: Construction (The Value Choice).* If we *must* decide, admit we are making policy.

  5.  **Testing on Hypotheticals:**
      *   *Case 1: Library (Animals).*
          *   Text: "No animal... except guide dog."
          *   Goldfish: Biologically an animal. Context (quiet/clean) suggests risk. *Result: Excluded.* (Cuts against purposivist if they want to allow it, but text is clear).
          *   Service Dog (non-blind): Text says "guide dog... blind patron." *Result: Excluded.* (Hard textualist result).
          *   Taxidermy: Is it an "animal"? Semantic range. *Result: Ambiguous/Excluded.*
          *   *Constraint Check:* Need one result against purposivist sympathies. Excluding the non-blind service dog is the strongest candidate for this, as a purposivist might argue "service animal" was the *purpose*, but text says "guide dog/blind."
      *   *Case 2: Boiler (Industrial).*
          *   Text: "Steam boiler... certificate... inspect boiler."
          *   Factory has electric furnace/gas line, *no boiler*.
          *   *Result:* Statute doesn't apply. (Textualist win).
          *   *Purposivist itch:* Safety is the purpose, furnace is dangerous. But text says boiler.
          *   *Constraint Check:* This cuts against purposivist sympathies (safety purpose ignored for textual precision).
      *   *Case 3: Board Meetings (Governance).*
          *   Text: "Misses three consecutive meetings... deemed resigned."
          *   Fact: 3 scheduled, 2 cancelled (no quorum).
          *   *Question:* Is a cancelled meeting a "meeting" one can "miss"?
          *   *Result:* Ambiguous. Requires construction.
          *   *Constraint Check:* Good for testing the "Gap Declaration."

      *Selection for "Against Purposivist Sympathies":* The Boiler case is the cleanest. A purposivist wants to regulate the dangerous furnace. A textualist says "no boiler, no law." I will ensure the procedure yields "No Liability" here.

  6.  **Refining the Procedure Steps (Final Polish):**
      *   Make sure the "Context Fixation" step is explicit.
      *   Make sure the "Gap" step allows returning "Undecided."
      *   Ensure the "Value Choice" step is labeled clearly.

  7.  **Drafting the Confidence Assessment:**
      *   Need to be honest. Where does interpretation usually fail? Usually in Step 1 (Context) or Step 4 (Gap vs. Construction). I'll flag Step 1 as the weakest because "ordinary meaning" is often a fiction.

  8.  **Review against Constraints:**
      *   *Decision procedure?* Yes.
      *   *Order?* Yes.
      *   *Sufficient answer criteria?* Yes.
      *   *Stop rules?* Yes.
      *   *Label judgment calls?* Yes.
      *   *Three cases?* Yes.
      *   *One against purposivism?* Yes (Boiler case).
      *   *No citations?* Yes.
      *   *Confidence/Weakest step?* Yes.

  9.  **Final Tone Check:**
      *   Avoid academic fluff.
      *   Speak clerk-to-clerk/judge.
      *   Acknowledge the "allergy" to fake objectivity.

  *(Self-Correction during drafting)*: I initially thought about putting the "Purpose" step earlier. But for a textualist judge, purpose is suspect. I need to frame purpose as "Context" or "Semantic Environment" to make it palatable, then explicitly label when we switch to "Policy." Actually, better to follow the user's commitment: "Seam between meaning and effect." So, Meaning Steps first, then Effect Step.
  *Correction on Case 1:* The prompt asks for *one* case to cut against purposivist sympathies. I can do that in the Boiler case. The Library case should show the procedure working neutrally.
  *Correction on Case 1 (Taxidermy):* Is a stuffed dog an animal? Biologically no, colloquially maybe ("look at that animal"). This is a good test of semantic range.
  *Correction on Case 3:* Cancelled meetings. This tests the definition of "meeting."

  Let's finalize the Procedure Structure:
  1.  **Context Fixation** (Choice of linguistic community).
  2.  **Semantic Range Test** (Can the words bear this weight?).
  3.  **Structural Coherence** (Does it break the statute?).
  4.  **The Gap Declaration** (If 1-3 fail, text is silent).
  5.  **Construction** (If decision is forced, admit value choice).

  Let's write it.

  *(Wait, one more check on the "Against Purposivist" constraint)*: "at least one of which returns an answer that cuts against my purposivist sympathies — do not soften it."
  The Boiler case is perfect. Purposivist says "regulate the danger." Textualist says "no boiler." I will rule "No Violation."
  The Library case (Service Dog for non-blind): Text says "blind." Purposivist says "accessibility." I could also rule "Excluded" here. I'll stick with the Boiler case as the primary "hard" textualist result, but maybe the Library one too. The prompt says "at least one." I'll make the Boiler case the sharp cut.

  *(Confidence Assessment)*: Be humble. The procedure is a tool, not a truth machine. Step 1 is the most subjective.

  Okay, ready to generate.cltr
answer: |-
  # The "Seam-Finding" Interpretation Protocol (v1.0)

  **Purpose:** To distinguish between semantic finding and normative construction, preventing the laundering of value choices as linguistic facts.
  **User:** Clerk and Judge.
  **Time Budget:** 4–6 hours per case.
  **Stop Rule:** If Step 4 returns "GAP," the memo must recommend dismissal or remand rather than fabrication, unless Step 5 is explicitly invoked by the Court.

  ---

  ## Phase I: Context Fixation
  *Commitment Addressed: "Just read the words" fixes a context; this choice must be explicit.*

  **Step 1.1: Identify the Linguistic Community.**
  Determine whose usage governs the text.
  *   **Options:** (A) Ordinary public usage at time of enactment; (B) Technical/Trade usage (if statute regulates a trade); (C) Legal terms of art.
  *   **[JUDGMENT CALL]:** Selecting (A) over (B) often decides the case before analysis begins. State the reason for selection (e.g., "Statute addresses public conduct" vs. "Statute regulates specialized industry").
  *   **Sufficient Answer:** A written record of the chosen community. If the judge and clerk disagree here, flag it immediately; do not proceed to Step 2 until the lens is agreed upon.

  **Step 1.2: Fix the Temporal Snapshot.**
  *   **Rule:** Meaning is fixed at enactment. Current usage is irrelevant unless the statute incorporates it by reference (e.g., "as defined by current ISO standards").
  *   **Sufficient Answer:** Confirmation that dictionaries/corpora used are contemporaneous with enactment.

  ---

  ## Phase II: Semantic Validation
  *Commitment Addressed: The seam between meaning and effect.*

  **Step 2.1: The Negation Test.**
  For the proposed application (e.g., "Is a goldfish an animal?"), assert the negation ("A goldfish is not an animal").
  *   **Question:** Does this negation sound like a lie about the world, or a permissible definition?
  *   **Pass:** If the negation sounds factually false within the Community (Step 1.1), the text *covers* the case. Stop. Ruling: **Applicable.**
  *   **Fail:** If the negation sounds debatable or context-dependent, proceed to 2.2.

  **Step 2.2: The Syntactic Constraint.**
  Check the text for exclusions or inclusions.
  *   **Rule:** *Expressio unius* is valid only if the list appears exhaustive (e.g., "only," "limited to"). If the list is illustrative ("including," "such as"), silence is not exclusion.
  *   **[JUDGMENT CALL]:** Determining whether a list is exhaustive is often a functional choice, not a grammatical one. Label this choice.
  *   **Sufficient Answer:** If the text explicitly excludes the case, Stop. Ruling: **Not Applicable.** If silent or ambiguous, proceed to Phase III.

  ---

  ## Phase III: Structural Coherence
  *Commitment Addressed: Legislature is not a mind; avoid "intent," look for "fit."*

  **Step 3.1: The Internal Consistency Check.**
  Apply the proposed reading to the rest of the statute.
  *   **Question:** Does this reading render another clause superfluous or contradictory?
  *   **Pass:** Reading fits without breaking other gears.
  *   **Fail:** Reading creates absurdity *within the text* (not just bad policy outcomes).
  *   **Note:** "Bad policy" is not "Absurdity." Absurdity means the statute cannot function as a machine (e.g., requires an impossible act).

  **Step 3.2: The Scheme Fit.**
  Check related statutes.
  *   **Question:** Does this reading conflict with a broader statutory scheme where terms are defined consistently?
  *   **Sufficient Answer:** If the reading breaks the scheme, reject it. If it fits, proceed to Phase IV.

  ---

  ## Phase IV: The Gap Declaration
  *Commitment Addressed: Procedures must announce when they are stuck.*

  **Step 4.1: The Silence Test.**
  Review Steps 1–3.
  *   **Question:** Have we established that the text *compels* a result, or merely that it *permits* one?
  *   **Decision:** If the text permits the outcome but does not compel it (i.e., the negation in 2.1 was debatable), declare a **LEGISLATIVE GAP.**
  *   **Action:** The memo must state: "The text does not resolve this. Applying it requires a policy choice."
  *   **Stop:** Default recommendation is to rule against the party bearing the burden of proof (usually the enforcer/plaintiff), as the law has not spoken.
  *   **Exception:** Proceed to Step 5 only if the Court explicitly authorizes filling the gap.

  ---

  ## Phase V: Construction (The Value Choice)
  *Commitment Addressed: Laundering value choices as findings.*

  **Step 5.1: The Counterfactual Acknowledgement.**
  *   **Statement:** "We are now specifying what the legislature *would have* done."
  *   **[JUDGMENT CALL]:** This is not interpretation; it is interstitial legislation.
  *   **Requirement:** The memo must list the value being prioritized (e.g., "Safety over Liberty" or "Certainty over Fairness").

  **Step 5.2: The Canonical Check.**
  *   **Rule:** If filling the gap, apply established clear statement rules or canons (e.g., "Ambiguity in penal statutes favors defendant").
  *   **Sufficient Answer:** A ruling based on the stated value, not disguised as semantic necessity.

  ---

  # Application to Hypotheticals

  ## Case 1: The Municipal Library
  **Text:** "No animal may be brought into the municipal library, except a guide dog accompanying a blind patron."
  **Preamble:** Protection of collection; quiet, clean reading rooms.

  **1. Context Fixation:** Ordinary public usage. (Step 1.1).
  **2. Semantic Validation:**
  *   **Goldfish:** Negation ("A goldfish is not an animal") sounds false. Biological classification aligns with ordinary usage. *Result: Covered by "No animal."*
  *   **Service Dog (Non-Blind):** Text specifies "guide dog... blind patron." Negation ("A service dog for a deaf patron is not a guide dog for a blind patron") is factually true. *Result: Excluded by exception.*
  *   **Taxidermied Dog:** Negation ("A stuffed dog is not an animal") is debatable. It was an animal; now it is an object. Ordinary usage calls it a "specimen" or "mount," not an "animal" in the present tense. *Result: Semantic Gap.*
  **3. Structural Coherence:** Excluding the non-blind service dog does not break the statute's internal logic, though it may conflict with external ADA norms (which are separate law).
  **4. Gap Declaration:**
  *   **Goldfish:** No gap. Text covers it.
  *   **Service Dog:** No gap. Text excludes it.
  *   **Taxidermy:** Gap declared. Text silent on dead animals.
  **5. Construction (Taxidermy only):**
  *   **Value Choice:** Preamble cites "quiet, clean." A sealed mount poses no risk to collection or quiet.
  *   **Ruling:** Allowed.

  **Final Rulings:**
  1.  **Goldfish:** **Prohibited.** (Textualist result).
  2.  **Service Dog (Non-Blind):** **Prohibited.** (Textualist result).
      *   *Note on Purposivist Sympathy:* A purposivist might argue the *purpose* of the exception is accessibility for disabled patrons. The text, however, limits it to blindness. The procedure forces the exclusion. This cuts against the intuition that "service animal" was the functional goal.
  3.  **Taxidermy:** **Allowed.** (Via Gap Construction favoring access/cleanliness).

  ## Case 2: The Industrial Safety Scheme
  **Text:** "Every operator of a steam boiler in a factory shall hold a certificate... board shall inspect each boiler annually."
  **Facts:** Factory has electric induction furnace and pressurized gas line. No boiler.

  **1. Context Fixation:** Technical/Trade usage (Step 1.1). "Steam boiler" has a specific engineering definition (closed vessel heating water to steam).
  **2. Semantic Validation:**
  *   **Furnace/Gas Line:** Negation ("An electric furnace is not a steam boiler") is factually true in engineering contexts.
  *   **Pass:** Text does not cover these machines.
  **3. Structural Coherence:** Extending "boiler" to "furnace" would render the specific certification requirements (designed for steam pressure dynamics) incoherent when applied to electric induction.
  **4. Gap Declaration:**
  *   **Status:** **LEGISLATIVE GAP.** The legislature regulated steam hazards, not electrical or gas hazards.
  *   **Burden:** The safety board bears the burden of enforcement authority.
  **5. Construction:**
  *   **Decision:** Do not invoke Step 5. The procedure dictates stopping at Step 4.
  *   **Ruling:** **No Violation.** The factory is not subject to this statute.

  **Comment:** This result cuts sharply against purposivist sympathies. The *purpose* is worker safety; the furnace is dangerous. But the *text* is specific. The procedure forbids laundering the safety value as a linguistic finding that "furnace" means "boiler." It requires admitting the legislature failed to regulate this hazard.

  ## Case 3: The Governance Provision
  **Text:** "A member of the board who misses three consecutive meetings shall be deemed to have resigned."
  **Facts:** Member missed 3 scheduled meetings. 2 were cancelled for want of quorum (never occurred).

  **1. Context Fixation:** Legal/Corporate usage (Step 1.1).
  **2. Semantic Validation:**
  *   **Cancelled Meeting:** Can one "miss" an event that did not happen?
  *   **Negation:** ("One cannot miss a cancelled meeting"). In ordinary usage, this is true. You cannot miss a bus that never runs.
  *   **Counter-Argument:** In corporate practice, "meeting" often refers to the *scheduled slot*, not the consummated event.
  *   **Result:** **Semantic Gap.** The word "meeting" is ambiguous between "scheduled convening" and "actual convening."
  **3. Structural Coherence:**
  *   If "meeting" = "scheduled": Member resigned.
  *   If "meeting" = "actual": Member active (only 1 missed).
  *   Neither reading breaks the statute's internal logic.
  **4. Gap Declaration:**
  *   **Status:** **LEGISLATIVE GAP.** The text does not define the status of cancelled sessions.
  **5. Construction:**
  *   **Value Choice:** Certainty of tenure vs. Accountability for attendance.
  *   **Canon:** Ambiguity in forfeiture clauses (resignation is a penalty) typically resolves against forfeiture.
  *   **Ruling:** **Member Retains Seat.** The cancelled meetings do not count.

  ---

  # Confidence Assessment

  **Overall Confidence:** **Moderate-High.**
  The procedure succeeds in its primary goal: it forces the admission of uncertainty. It prevents the "smooth" memo that hides the jump from text to policy. It is robust enough for the 1-2 day turnaround because Step 4 allows you to quit early rather than spinning wheels on an unresolvable ambiguity.

  **Step-by-Step Confidence:**
  *   **Step 1 (Context):** **Low.** This is the weakest link. Deciding whether "vehicle" means "car" or "conveyance" depends entirely on Step 1.1. Two reasonable actors can choose different linguistic communities and reach opposite results legitimately. The procedure exposes this, but does not solve it.
  *   **Step 2 (Semantic):** **High.** The Negation Test is a reliable tool for filtering out truly impossible readings.
  *   **Step 3 (Structure):** **High.** Internal contradiction is objectively verifiable more often than not.
  *   **Step 4 (Gap):** **Moderate.** Requires discipline to admit "I don't know" when institutional pressure demands a verdict.
  *   **Step 5 (Construction):** **High.** Only because it explicitly labels the activity as value-choice rather than discovery.

  **The Weakest Step: Step 1.1 (Identify the Linguistic Community).**
  **Why:** This step determines the "data set" for all subsequent semantic analysis. If I choose "Ordinary Public Usage" for the Boiler Case, "boiler" might loosely mean "heater." If I choose "Technical Usage," it is precise. There is no meta-rule in the procedure for selecting the community other than "state your reason." This leaves the door open for the very laundering I seek to prevent: a judge can select the community that yields the desired outcome and claim it was the "obvious" choice. I am least sure that this step can be disciplined without appealing to the very purpose we are trying to bracket. However, by forcing it into the open, it becomes arguable rather than invisible.
