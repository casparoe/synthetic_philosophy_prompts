  I must decline the request to write a **pantoum**. While the pantoum's recycling mirrors the persistence of a disposition, its structural requirement—that the second and fourth lines of each stanza become the first and third of the next—forces the specific details of one case to bleed into the stanza dedicated to another. If Stanza 2 (Mask) introduces lines about "foam" or "wrapping," Stanza 3 (Mimic) is formally required to begin and mid-point with those same lines. This would contaminate the Mimic case with Mask imagery, making the three cases unrecoverable without labels, violating your constraint.

  Instead, I propose a **Quatrain with Refrain**. This form allows a fixed line (the disposition's voice) to return in every stanza, carrying its insistence unchanged, while the unique lines in between can describe the specific mechanics of the Fink, Mask, and Mimic without cross-contamination. It also allows the final return of the refrain to land as a self-cancelling loop, as the context of the final stanza can negate the truth of the line even as it is spoken.

  Below is the poem in that form, followed by the required note.

  ***

  ### Intrinsic

  I am the break waiting in the clear.
  The hand reaches out to test the claim,
  But a spell tempering the glass draws near,
  And I am gone before the strike has name.
  I am the break waiting in the clear.

  I am the break waiting in the clear.
  Wrapped in foam, the blow is soft and dead,
  The structure holds, though I am present here,
  Unmanifested inside the shielding bed.
  I am the break waiting in the clear.

  I am the break waiting in the clear.
  A rigged cup shatters on the floor with ease,
  The sound is mine, but I was never here,
  A hollow echo in a structural breeze.
  I am the break waiting in the clear.

  I am the break waiting in the clear.
  You read the line and the stimulus starts,
  The basis flees as the words appear,
  A promise dissolving in your own heart's arts.
  I am the break waiting in the clear.

  ***

  **Note on Liberties and Contested Readings**

  This poem treats the **Categorical Basis** account as the settled winner, which remains contested. Conditional analysts (e.g., David Lewis) argue that dispositions *are* conditionals, provided the conditions are specified rigorously (e.g., "if struck *and* no fink intervenes"). By giving the disposition a voice that claims existence independent of the conditional's truth ("I am present here / Unmanifested"), the poem presupposes **Realism about Dispositions**, begging the question against the Reductionist who claims the disposition is nothing over and above the conditional truth. Additionally, the Fink stanza simplifies the temporal logic; in some analyses, the disposition ceases to exist *at* the moment of strike, whereas the poem suggests it is removed *before* ("gone before the strike has name") to preserve the voice's ability to speak of its prior existence. Finally, the ending treats the reading of the poem as the stimulus that triggers the Finkish removal, a metaphorical liberty that dramatizes the self-cancelling nature of the case but implies the disposition is sensitive to linguistic attention, which is not part of the standard philosophical example.
