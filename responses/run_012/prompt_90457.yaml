      *   **Opening Salvo:** Marcus brings up the "cheat" of ordinality. Elena defends Arrow's rigor.
      *   **The Concrete Example:** Need 3 candidates (A, B, C) and a few voters to show the paradox or the new system.
          *   *Scenario:* A polarizing candidate vs. a compromise candidate.
          *   *Arrow context:* Condorcet cycles are the usual go-to, but since Marcus hates ranking, let's focus on how intensity changes things.
      *   **Marcus's Proposal:** Explain the "100-point spread, min 1, trim extremes" rule.
      *   **Elena's Rebuttal:**
