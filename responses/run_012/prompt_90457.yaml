      *   *Wait, re-reading carefully:* "winner is the candidate with the highest average score after you drop their single best and single worst score." Grammatically, "their" usually refers to the subject of the clause, which is "the candidate". So, for Candidate A, drop the highest score A received and the lowest score A received.
