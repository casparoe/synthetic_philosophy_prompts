          *   *Interpretation B:* For each voter, drop the candidate they scored highest and lowest, then average the rest? No, that doesn't make sense for determining a winner.
          *   *Interpretation C:* The prompt says "drop *their* single best and single worst score." "Their" likely refers to the *candidate's* received scores. So, for Candidate A, look at all points given by all voters. Remove the single highest point value given to A and the single lowest point value given to A. Then average the remainder.
          *   *Actually, let's look closer:* "winner is the candidate with the highest average score after you drop their single best and single worst score." This phrasing is slightly ambiguous. It usually implies a "Trimmed Mean" of the scores *received* by the candidate. I will interpret it as: For each candidate, take the list of scores they received from all voters. Remove the highest score in that list and the lowest score in that list. Calculate the average of the remaining scores.
