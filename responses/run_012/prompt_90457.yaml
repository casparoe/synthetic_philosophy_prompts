      *   *Check:* Is the "trimming" effective? In an election with 1,000 voters, dropping the single highest and lowest score for a candidate is statistically negligible. Elena should pounce on this.
      *   *Check:* Arrow's Theorem specifically excludes cardinal utility. Marcus is right that Arrow doesn't apply to Score Voting. *However*, there are other impossibility results (like Gibbard-Satterthwaite) that do apply. Elena needs to pivot to that so she isn't wrong.
