      *   **Skeptic's Critique:** Arrow assumes ordinal preferences. Cardinal voting (like Score/Range voting) bypasses Arrow because it captures *intensity*.
      *   **Skeptic's Proposed Rule:**
          *   Budget: 100 points.
          *   Constraint: Min 1 point to every candidate (ensures participation/non-negativity).
          *   Aggregation: Drop each voter's single best and single worst score (trimming outliers/manipulation), then average the rest.
