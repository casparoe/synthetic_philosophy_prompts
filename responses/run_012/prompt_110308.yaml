answer: |-
  You have put your finger on the central tension in Augustine's *De Mendacio* (On Lying), a tension that has occupied scholars for centuries. You are correct that the "Double Heart" test (speaking against one's mind) and the "Desire of Deceiving" test (intent) can pull in opposite directions.

  The short answer is that Augustine relies on **both**, but they do different work. The "Double Heart" defines the **ontological structure** of the lie, while the "Desire of Deceiving" defines its **moral species**. However, to get the "stable verdict" you are looking for, we must understand how Augustine modifies the "Double Heart" test to implicitly include the intent.

  Here is how to untangle the passage and resolve your two test cases.

  ### 1. The Two Criteria and Their Roles

  Augustine is distinguishing between three things:
  1.  **Objective Falsity:** Saying something that isn't so. (Augustine rejects this as the definition; you can tell the truth and lie).
  2.  **Subjective Falsity (The Double Heart):** Saying something you *believe* is not so. (This is the *structure* of the lie).
  3.  **Intent to Deceive:** Wanting the listener to believe the falsehood. (This is the *sin* of the lie).

  In the passage you quoted, Augustine is arguing against the idea that lying is determined by objective reality ("verity or falsity of the things themselves"). He establishes that lying is a violation of the speaker's own mind (*contra mentem*).

  However, as you noted, he immediately qualifies this with the "desire of deceiving." The resolution lies in how Augustine understands the act of "uttering" (*enuntiatio*). For Augustine, a serious utterance is, by definition, a sign that what is in the mind is being conveyed to the listener.

  ### 2. Resolving the Test Cases

  **Case A: The Joke (The Bear Wrestler)**
  *   **Double Heart Test:** I know I didn't wrestle a bear (True in mind); I say I did (False in speech). *Verdict: Lie.*
  *   **Deception Test:** I grin; I do not want you to believe me. *Verdict: Not a Lie.*
  *   **Augustine's Verdict:** Not a lie.

  **Why?** Augustine does not simply apply the Deception Test as an override. Rather, he argues that in a joke, the **"Double Heart" is not actually formed.** When you joke, you are not "producing [the falsehood] instead thereof [the truth]" in the sense of a communicative assertion. You are producing a fiction *as* a fiction. The "tone and manner" you mention signal to the listener that the "utterance of the mind" is not an assertion of fact. Therefore, there is no *contrariety* between mind and speech in the relevant moral sense. The intent to deceive is what makes the "Double Heart" a *lie* rather than a *fiction*.

  **Case B: The Misleading Truth (The Wife and the Doctor)**
  *   **Double Heart Test:** I believe "He doesn't drink at home" is true; I say "He doesn't drink at home." *Verdict: Not a Lie.*
  *   **Deception Test:** I want the doctor to believe "He doesn't drink at all" (False). *Verdict: Lie.*
  *   **Augustine's Verdict:** This is the harder case. In *De Mendacio* (12.27), Augustine admits that if a person tells the truth *in order to deceive*, they are "not without the guilt of lying" (*non caret reatu mendacii*), even if the strict definition of *mendacium* (speaking a falsehood) isn't met.

  He classifies this as *dolus* (guile) rather than strict *mendacium*, but he condemns it with equal moral severity. He argues that while the words match the mind, the *signification* is manipulated to create a falsehood in the listener's mind.

  ### 3. The Stable Definition

  To answer your request for a single statement that yields a stable verdict: Augustine's working definition of a lie is **an assertion contrary to what the speaker believes to be true, made with the intention that the listener accept it as true.**

  This definition synthesizes the two markers:
  1.  **"Assertion contrary to belief":** This captures the "Double Heart." It excludes the man who makes an honest mistake (he believes the falsehood is true).
  2.  **"Intention that the listener accept it":** This captures the "Desire of Deceiving." It excludes the joker (who does not intend acceptance).

  **How this handles your cases:**
  *   **The Joker:** Fails condition #2. He does not intend the listener to accept the bear story as true. (Verdict: Not a lie).
  *   **The Misleading Wife:** Fails condition #1 (strictly speaking), as her words match her belief. However, because she fulfills condition #2 (intent to deceive), Augustine categorizes it as a cognate sin (*dolus*) that is morally equivalent to lying, even if technically distinct.

  ### 4. Which Criterion Does the "Real Work"?

  If you must choose which criterion is primary for Augustine, it is the **Double Heart (Subjective Falsity)**.

  Augustine is fundamentally concerned with the integrity of the human mind and its relationship to God. The "Double Heart" is the ontological rupture—the moment the soul turns away from the truth it possesses. The "Desire of Deceiving" explains *why* that rupture is sinful (it harms the neighbor and violates the social bond), but the *lie itself* is the violation of the mind.

  This is why he can say the joker is not lying: because in the context of a joke, the mind is not actually asserting the falsehood *as truth*, so the "Double Heart" is never fully engaged in a moral sense.

  **Summary for your reading:**
  Do not view the "Double Heart" and "Desire of Deceiving" as competing tests. View them as **Matter and Form**.
  *   The **Double Heart** is the *Matter* (speaking against what you know).
  *   The **Desire of Deceiving** is the *Form* (the intent to pass that speech off as truth).

  Without the Form, the Matter is just a joke or a fiction. Without the Matter, the Form is guile (*dolus*) rather than a lie (*mendacium*), though Augustine considers both sinful. The "Lie" in the strictest sense requires both.
