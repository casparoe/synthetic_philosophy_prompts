          *   *Cost:* Loses strict internalist control. Feels like "magic" (violates 2).
      *   *Fixing (5) (The Pragmatic Stop):* Claim the stop *is* justified (Foundationalism) or part of a system (Coherentism).
          *   *Cost:* Violates (2) or (1).
      *   *Fixing (2) (No Self-Justification):* Allow some beliefs to be self-justifying (e.g., "I seem to see red").
          *   *Cost:* Feels like "magic" to the user, but standard move.
      *   *Fixing (1) (Finitism):* Accept Infinitism (defeasible) or Coherentism.
          *   *Cost:* User already rejected these strongly.

  6.  **Identify the "Single Revision" for Maximum Cleanup:**

