      *   *Actually, the cleanest fix:* **Revision of (3).** The "No Unjustified Justifiers" principle is the engine of the regress. If you allow *something* to justify without being justified (like a raw experience, or a properly basic belief), the regress stops without circularity or infinity.
      *   *Alternative:* **Revision of (5).** Make the "stopping point" justified by virtue of its source (Externalism) or its phenomenology (Foundationalism).
