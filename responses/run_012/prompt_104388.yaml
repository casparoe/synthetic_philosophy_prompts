answer: |-
  This is a sophisticated read of the stalemate. You are correct that the literature has calcified into a ritualized exchange of positions, and your hypothesis about the dual function of "experiment" is the sharpest tool for cutting through the noise. However, to get to a diagnosis that allows for progress, we need to push past the idea that this is merely a semantic ambiguity or a simple split between "method" and "ideal."

  Here is the structural diagnosis of the impasse, an evaluation of your hypothesis, and an honest assessment of what could actually move the needle.

  ### 1. The Diagnosis: A Category Clash, Not Just a Verbal Dispute

  The stalemate is not merely verbal, nor is it purely substantive in the sense that both sides are making claims within the same framework. It is a **category clash regarding the source of normativity.**

  *   **The Epistemic Democrat (specifically the Truth-Tracking variant)** is operating within a **consequentialist/instrumental framework**. Even if they value procedure, the ultimate justification rests on a counterfactual: *Democracy is valuable because it correlates with independent standards of correctness (truth/justice/competence) better than alternatives.* They are answering the question: "Why should we trust this procedure?"
  *   **The Deweyan Experimentalist** is operating within a **constitutive/framework framework**. The justification is internal. Democracy is not a tool to find a pre-existing truth; it is the social ontology required for *any* truth to become actionable or meaningful. They are answering the question: "What kind of association makes normative claims intelligible?"

  **The Impasse:** The Epistemic Democrat demands an external validation of democracy (to protect it from the charge of mob rule), while the Deweyan argues that seeking external validation surrenders the very ground democracy stands on (by admitting there is a standard accessible *outside* the democratic process).

  When they argue, the Epistemic Democrat asks, "But does it work?" (implying: does it match the world?), and the Deweyan replies, "Working is part of the inquiry" (implying: the 'world' is reconstructed through the process). They are talking past each other because one side assumes a **correspondence theory of validity** (even if fallibilist) and the other assumes a **warranted assertability theory of validity** that is inextricably tied to the community generating it.

  ### 2. Evaluating Your Hypothesis: The Two Jobs of "Experiment"

  Your hypothesis is right, but it needs a specific temporal distinction to do the work you want it to do. "Experiment" is indeed doing two jobs, but the conflict arises from the **telos of the experiment.**

  1.  **Convergent Experimentation (Epistemic/Problem-Solving):** The goal is *resolution*. We experiment to reduce uncertainty, eliminate error, and converge on a stable solution. The ideal state is one where the problem is solved and experimentation can cease (or pause). Here, democracy is a *discovery procedure*.
  2.  **Divergent Experimentation (Deweyan/Ethical):** The goal is *growth*. We experiment to expand the capacity for further experience. A "solution" that ends inquiry is actually a failure (dogmatism). The ideal state is continuous reconstruction. Here, democracy is a *mode of associated living*.

  **Where your hypothesis hits the mark:** You identified that the fight is often about whether democracy must be justified to a skeptic from the outside.
  **Where it needs sharpening:** It's not just that "experiment" has two meanings. It's that the two sides disagree on whether **uncertainty is a problem to be solved or a condition to be inhabited.**

  *   If uncertainty is a defect, you need Epistemic Democracy (to minimize error).
  *   If uncertainty is the engine of freedom, you need Deweyan Experimentalism (to maximize plasticity).

  This is why the fight doesn't budge. It is a disagreement about the **metaphysics of the social world.** Is there a "right answer" waiting to be found (even if hard to find), or is the "right answer" made through the finding?

  ### 3. The Hidden Question: Is it Empirical or Formal?

  You asked if a hidden empirical or formal question about collective learning is doing the work.

  **It is not empirical.** Empirical data about whether democracies make "better" decisions cannot resolve this, because the two sides define "better" differently.
  *   For the Epistemic Democrat, "better" means closer to an independent standard (e.g., economic growth, human rights indices, correct policy selection).
  *   For the Deweyan, "better" means higher quality of participation, greater integration of interests, and enhanced capacity for future inquiry.

  **It is not purely formal.** It's not just a logic puzzle.

  **It is Ontological.** The hidden question is: **Is the 'Public' a cognitive agent or a moral community?**
  *   Epistemic democrats tend to treat the public as a distributed cognitive processor (aggregating information to solve a puzzle).
  *   Deweyans treat the public as a moral organism (constituting itself through communication).

  The stalemate persists because Epistemic Democrats try to model the Public as a cognitive agent to gain scientific legitimacy, while Deweyans insist the Public is a moral project to gain ethical legitimacy. They are modeling different entities under the same name.

  ### 4. What Counts as Progress?

  If you want to move the chapter beyond a scorecard, you cannot simply propose a distinction and hope everyone adopts it. The field is too entrenched. Progress requires shifting the **burden of proof** and changing the **locus of analysis.**

  Here are three specific moves that would constitute genuine progress:

  **A. Shift from Justification to Pathology**
  Stop asking "Which view justifies democracy better?" That is the Archimedean trap. Instead, ask: **"What specific pathologies of inquiry does each view fail to diagnose?"**
  *   *The Move:* Argue that the Epistemic view cannot account for *political alienation* (because it focuses on output correctness), while the Deweyan view cannot account for *decisional paralysis* (because it focuses on process continuity).
  *   *The Progress:* This moves the debate from "Who is right?" to "Under what conditions does each framework break down?" This allows you to use the tension productively rather than trying to resolve it.

  **B. The "Skeptic" is a Red Herring**
  Your hypothesis mentions justifying democracy to a skeptic. Progress requires admitting that **the Skeptic is not the audience.**
  *   Dewey never intended to convince the anti-democratic skeptic using the skeptic's own terms (external truth). He intended to show that the skeptic's terms *presuppose* democratic inquiry.
  *   Epistemic democrats *are* trying to convince the skeptic (the elitist, the technocrat).
  *   *The Progress:* Explicitly state that the disagreement is about **audience and purpose.** If the goal is defending democracy against technocratic usurpation, Epistemic arguments are tactically necessary. If the goal is deepening democratic practice against liberal complacency, Deweyan arguments are necessary. Acknowledging this tactical division dissolves the claim that one theory must subsume the other.

  **C. Concede the "Bedrock" but Map the Interface**
  You asked if the impasse is bedrock. **Yes, partially.** It is bedrock because it rests on incompatible meta-ethical commitments (realism vs. pragmatist constructivism).
  *   *The Progress:* Don't try to melt the bedrock. Map the interface. Where do these views *need* each other?
  *   *Example:* A Deweyan needs an account of how inquiry avoids solipsism (where Epistemic constraints help). An Epistemic Democrat needs an account of how the "standard of truth" is generated without authoritarianism (where Deweyan social ontology helps).
  *   *Your Contribution:* Show that a robust theory of democratic inquiry requires *both* a constraint of reality (Epistemic) and a reconstruction of the self/community (Deweyan), and that the failure to integrate them leads to the specific crises we see now (e.g., post-truth politics is a failure of the Epistemic constraint; technocratic drift is a failure of the Deweyan reconstruction).

  ### Summary Recommendation for the Chapter

  Do not try to solve the fight. Diagnose it as a **functional divergence.**

  1.  **Validate your hypothesis:** "Experiment" as *error-correction* vs. "Experiment" as *growth* is the correct lever.
  2.  **Name the Ontology:** Explicitly frame the disagreement as one about the nature of the "Public" (Cognitive Processor vs. Moral Community).
  3.  **Declare the Stalemate Productive:** Argue that the tension is necessary. Pure Epistemic Democracy risks technocracy (ignoring the ethical value of participation). Pure Deweyan Democracy risks romanticism (ignoring the need for concrete problem-solving).
  4.  **Propose a "Second-Order" Inquiry:** Your contribution is not picking a winner, but analyzing the *conditions under which we must toggle between these modes.* When do we need convergence (crisis)? When do we need divergence (constitutional moments)?

  This moves you from a student summarizing a debate to a theorist restructuring the terms of the debate. That is dissertation-worthy progress.
