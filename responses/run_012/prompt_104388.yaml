prompt: |-
  I'm a 3rd-year PhD student in political theory, and I'm stuck on something that keeps derailing my dissertation chapter on Deweyan democracy. There's this long-running fight between the Deweyan experimentalists and the epistemic democrats (and also between the Deweyans themselves) about whether democracy is justified by its truth-tracking or problem-solving results, or whether the whole point is that it's a form of inquiry, an ongoing experimental way of living together, so that asking for a final justification in terms of outcomes already misses the point. It's been going on forever, everyone knows everyone's moves, and nobody budges. I want a diagnosis, not a scorecard. Is this a substantive disagreement, a verbal one about the word inquiry, or are teh two sides answering different questions under one heading -- one about the epistemic credentials of democratic procedures, one about the ethical and political value of a mode of association? My half-baked hypothesis: the stall is because experiment is doing two jobs in Dewey's legacy. Sometimes it means a hypothesis-testing method that aims at warranted assertability and error correction; sometimes it means a normative ideal where the point is the continuous reconstruction of problems and the growth of shared experience, with no terminus. If we split those, some fights dissolve and the real one gets sharper -- whether democracy has to be justified to a skeptic from the outside, or whether inquiry is already a precondition of any such justification. Is that right, or is a hidden empirical or formal question about collective learning doing the work? And given your diagnosis, what would actually count as progress here -- a distinction, a change in the burden of proof, a concession about what counts as a democratic experiment, or is the impasse bedrock? I dont want a reading list, I'll do the citations myself; I want the structure of the disagreement and an honest answer about what could move it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** 3rd-year PhD student in Political Theory. This means they are sophisticated, familiar with the literature (Dewey, epistemic democracy, experimentalism), and likely frustrated with the stagnation in the field. They don't need basic explanations or a bibliography.
      *   **Topic:** Deweyan democracy vs. Epistemic Democracy. Specifically, the tension between democracy as *truth-tracking/problem-solving* (instrumental/consequentialist) vs. democracy as *inquiry/way of life* (intrinsic/procedural/ethical).
      *   **The Problem:** A long-running stalemate. Everyone knows the moves; nobody budges.
      *   **The Goal:** A *diagnosis* of the disagreement (substantive, verbal, or talking past each other?), an evaluation of the user's hypothesis (two jobs of "experiment"), and a prescription for *progress* (what would actually move the needle?).
      *   **Constraints:** No reading lists. Focus on the *structure* of the disagreement. Honest answer about movability.

  2.  **Deconstruct the User's Hypothesis:**
      *   *Hypothesis:* "Experiment" does two jobs: (1) Hypothesis-testing (warranted assertability, error correction) vs. (2) Normative ideal (continuous reconstruction, growth, no terminus).
      *   *User's Conclusion:* Splitting these dissolves some fights and sharpens the real one (justification to a skeptic vs. inquiry as precondition).
      *   *My Assessment:* This is a strong starting point. It captures the tension between Dewey's logical/epistemological writings (*Logic: The Theory of Inquiry*) and his political/ethical writings (*The Public and Its Problems*, *Democracy and Education*). However, simply labeling them "Job 1" and "Job 2" might be too clean. The tension is often *within* Dewey himself, not just in his interpreters.

  3.  **Diagnose the Stalemate (The Structure of the Disagreement):**
      *   *Is it verbal?* Partly. "Inquiry," "Truth," and "Experiment" are doing heavy lifting without agreed-upon definitions. But it's not *just* verbal.
      *   *Is it substantive?* Yes. It's about the *source of normativity*.
      *   *Is it talking past each other?* Yes. Epistemic democrats (e.g., Landemore, Estlund) often want to save democracy from the "charge of irrationality" by appealing to external standards (truth/correctness). Deweyans (e.g., Bohman, Talisse, though Talisse is tricky) often want to save democracy from "technocracy" by embedding normativity internally.
      *   *The Core Tension:* **External Validation vs. Internal Constitution.**
          *   Epistemic Democrats ask: "Does democracy produce the *right* answers?" (Requires an independent standard of 'right').
          *   Deweyan Experimentalists ask: "Does democracy allow us to *formulate* the questions and live with the answers?" (The standard is immanent to the process).
      *   *The "Hidden" Question:* The user asks if a hidden empirical/formal question about collective learning is doing the work.
          *   *Answer:* Yes, but it's a *category mistake* to treat it purely empirically. It's a metaphysical/ontological commitment about the nature of social reality (fixed vs. malleable).

  4.  **Evaluate the "Two Jobs of Experiment" Hypothesis:**
      *   The user is right that "experiment" oscillates between *method* and *ethos*.
      *   *Refinement:* It's not just two jobs; it's a *temporal* disagreement.
          *   Job 1 (Epistemic): Future-oriented convergence. We experiment to *stop* experimenting (reach the truth/solution).
          *   Job 2 (Ethical): Present-oriented continuity. We experiment to *continue* experimenting (growth is the end).
      *   *The Real Fight:* It's not just about justification to a skeptic. It's about whether democracy is *fungible*. If a benevolent dictator solved problems better (Job 1), would democracy lose value? The Epistemic Democrat says "Maybe." The Deweyan says "No, because the dictatorial solution isn't *ours*."

  5.  **Determine What Counts as Progress:**
