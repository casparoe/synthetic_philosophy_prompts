  ### IV. Unoccupied Logical Space
  *The following answer-combinations are logically possible but remain unoccupied in our discussion. They are marked as such for completeness.*

  1.  **Stipulation + Intrinsic Hardness:** *Incoherent.* If the boundary is a human stipulation, hardness cannot be an intrinsic property of the abstract problem.
  2.  **Ideal Reasoner + Physical Model:** *Incoherent.* An ideal mathematical reasoner is not bound by physical idealizations of machinery.
  3.  **Discovery + Abstract Model + Empirical Crypto:** *Unexplored.* This view holds that computation is abstract, but security is physical. It is unstable: if computation is abstract, crypto assumptions should be mathematical.
  4.  **Barriers limit Truth + Physical Model:** *Unattractive.* If hardness is physical, barriers should be engineering limits, not logical independence. This combination suggests physics itself might be axiomatic-independent.

