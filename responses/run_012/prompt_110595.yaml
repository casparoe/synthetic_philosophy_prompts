  # HANDOUT: The Ontology of Complexity
  **For the Joint CS/Philosophy Reading Group**

  ### I. Shared Ground
  *We begin from the following commitments, which are not up for debate in this session:*
  1.  **Definitions:** P, NP, BQP, etc., are precisely defined mathematical classes.
  2.  **Status:** No polynomial-time algorithm for NP-complete problems is known; the consensus is that none exists.
  3.  **Robustness:** This is a mathematical fact, not a limitation of current hardware.
  4.  **Caveats:** The polynomial/non-polynomial line is imperfect (e.g., $n^{1000}$ is "efficient" only by courtesy; encoding matters).

  *The disagreement lies in what these facts **mean**. The following decision tree maps the logical space of our disagreement. Answer the questions in order to locate your position.*

  ---

  ### II. The Logical Axes
  *Before navigating the tree, note the six dimensions of disagreement that generate the branches. You do not need to know where they lead to answer them.*

  1.  **Feasibility:** Is the P/NP boundary a *discovery* about a natural threshold of efficiency, or a *stipulation* of a useful proxy for "manageable"?
  2.  **Locus:** Is intractability a property of the *abstract problem* (the function), or the *problem-model pair* (the function + the computer)?
  3.  **Agent:** Do complexity bounds bind an *ideal reasoner* (omniscient regarding axioms) or only *finite/physical agents*?
  4.  **Barriers:** Do relativization/natural-proof barriers limit *our ability to prove* the truth, or do they suggest the *truth itself is indeterminate*?
  5.  **Model:** Is the computational model (e.g., Turing Machine) an *abstract mathematical structure* or a *physical idealization*?
  6.  **Crypto:** Are hardness assumptions (e.g., One-Way Functions) *mathematical conjectures* or *empirical laws of nature*?

  ---

  ### III. The Decision Tree

  **START: What is the status of the P vs NP boundary?**
  *   **(A) A Stipulation:** It is a normative cutoff we imposed to make theory tractable.
      *   └─► **LEAF 1: Pragmatic Instrumentalist**
          *   *Commitment:* The boundary sits where it is useful, not where it is "true."
          *   *Awkward Defense:* You must defend why $n^{1000}$ counts as "efficient" even if no physical system could run it.
  *   **(B) A Discovery:** It marks a real distinction in the structure of computation.
      *   └─► **NODE 2: Where does the hardness reside?**
          *   **(A) In the Abstract Problem:** The function itself is hard, regardless of who computes it.
              *   └─► **NODE 3: Who is bound by this hardness?**
                  *   **(A) An Ideal Reasoner:** God/Mathematics cannot solve NP-complete in poly-time.
                      *   └─► **NODE 4: What do proof barriers tell us?**
                          *   **(A) Limits on Proof:** P!=NP is true, we just lack the techniques.
                              *   └─► **LEAF 2: Mathematical Platonist**
                                  *   *Commitment:* Complexity classes are timeless mathematical objects.
                                  *   *Awkward Defense:* You must explain why an omniscient being is bound by time complexity.
                          *   **(B) Limits on Truth:** P vs NP might be independent of standard axioms.
                              *   └─► **LEAF 3: Independence Theorist**
                                  *   *Commitment:* The question may lack a determinate truth value.
                                  *   *Awkward Defense:* You must accept that a precise mathematical question might have no answer.
                  *   **(B) Only Finite Agents:** The problem is hard, but only for beings like us.
                      *   └─► **LEAF 4: Anthropocentric Realist**
                          *   *Commitment:* Hardness is objective, but "intractability" is relative to our finitude.
                          *   *Awkward Defense:* You must explain how a property of the *problem* depends on the *agent* without becoming relational.
          *   **(B) In the Problem-Model Pair:** Hardness is a relationship between task and tool.
              *   └─► **NODE 5: What is the computational model?**
                  *   **(A) An Abstract Structure:** Hardness is relative to the formalism (e.g., Turing Machine).
                      *   └─► **LEAF 5: Structuralist Relativist**
                          *   *Commitment:* Changing the model (e.g., to Quantum) changes the subject, not the difficulty.
                          *   *Awkward Defense:* You must defend why the Turing Machine is the privileged "default" model.
                  *   **(B) A Physical Idealization:** The model describes what is physically possible.
                      *   └─► **NODE 6: What is the status of Crypto Assumptions?**
                          *   **(A) Mathematical Conjectures:** We assume they hold because the math likely works.
                              *   └─► **LEAF 6: Formalist Conjecturist**
                                  *   *Commitment:* Physical security rests on unproven theorems.
                                  *   *Awkward Defense:* You must treat physical safety as contingent on mathematical proof.
                          *   **(B) Empirical Laws:** We assume they hold because nature appears to behave that way.
                              *   └─► **LEAF 7: Empiricist Naturalist**
                                  *   *Commitment:* Complexity theory is a branch of physics.
                                  *   *Awkward Defense:* You must accept that a math conjecture could be falsified by a lab experiment.

