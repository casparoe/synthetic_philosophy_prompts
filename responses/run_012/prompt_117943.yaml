answer: |-
  You press me on the status of the chain itself, and rightly so. This is the natural reflex of the foundationalist mind: to reify the sequence into a single object and then demand its pedigree. But I deny the premise that the infinite sequence constitutes a further fact over and above the facts that comprise its links. To say that there is grounding all the way down is to say that for every fact, there is a ground. It is not to say that there is a fact called "the whole chain" which stands outside the sequence and looks for a ground beneath it. If every member of the chain is grounded in its successor, then the demand for a ground is satisfied for every fact that exists. There is no leftover ontological residue that floats free of the grounding relation.

  If you insist that the collection of these facts constitutes a further fact, you are invoking a principle of unrestricted composition for facts that I see no reason to accept. Why should the totality of dependent facts be itself a fact of the same order, subject to the same demand? On my view, the "existence" of the chain is nothing over and above the existence of each linked member, each of which is fully grounded by its successor. Grounding is a relation between specific facts, not a global property of a world that requires a separate ground for its instantiation. To ask for the ground of the chain is like asking for the cause of the universe when you have already accounted for the cause of every event within it; it assumes a level of totality that the ontology does not support.

  So, to answer your dilemma: I take the second horn, but I reject your characterization of it. Denying that the chain is a further fact is not a linguistic evasion; it is an ontological commitment to parsimony. I am saying there are only the linked facts. You are positing a "totality fact" and then complaining that it lacks a ground. I refuse to posit the totality fact. And compare this to your alternative. You must posit a fact that has no ground at all. I posit facts that all have grounds, but deny that their collection generates a new ungrounded entity. Which of us is truly comfortable with brute existence? You accept a fact that holds for no reason. I accept only facts that hold in virtue of others, even if that "in virtue of" never terminates. My "brute fact" is merely the denial of your surplus entity; yours is a positive fact that defies the very principle of sufficient reason you claim to cherish.
