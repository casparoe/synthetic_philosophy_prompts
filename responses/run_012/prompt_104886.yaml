      *   Tone: Academic proposal.
      *   Specifics: Research question, gap, method, failure conditions, scope.
      *   No Bibliography.

  10. **Final Polish:**
      *   Check transitions.
      *   Ensure the "failure condition" is clear (i.e., if the mechanism is proven strategy-proof, the hypothesis is falsified, which is still a result).
      *   Make sure the distinction between "intensity" and "coordination" is clear throughout.

  *(Self-Correction during drafting)*: I need to be careful not to get too bogged down in the technical details of the "Sum of Percentages" rule in the intro, but explain it clearly enough that the reviewer understands the novelty. The prompt explains it well, I just need to echo that clarity.
  Also, ensure I emphasize *why* this matters beyond Switzerland. It's about the general problem of measuring intensity in democracy.

  *(Word Count Management)*: I will write the sections and monitor the length. If it's too short, I will expand on the comparative analysis with other voting systems. If too long, I will trim the background on Swiss democracy.

  *(Final Check on "Failure")*: The prompt asks for "what would count as the project failing." In research, "failure" can mean "hypothesis disproven" (success for science, failure for the hunch) or "project not completed." I should address both: intellectual falsification vs. practical non-completion. The prompt implies intellectual falsification ("I would rather have an honest account of what would falsify the hypothesis"). I will focus on the intellectual risk.

  Let's start writing.

