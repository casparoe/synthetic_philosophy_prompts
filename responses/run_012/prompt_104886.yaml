      *   **Task:** Write a research fellowship proposal (2,500 - 3,000 words) + month-by-month work plan.
      *   **Specific Requirements:**
          *   Determinate research question (not vague).
          *   Explain gap in existing literature (conceptual/formal gap, not empirical/archival).
          *   Methodology: Conceptual and formal (social choice modeling), not archival. Compare with rivals (ranked ballot, runoff, Condorcet).
          *   Define success/failure conditions (falsifiability).
          *   Realistic scope for one year (identify cuttable components).
          *   No bibliography/citations by name/date (refer to arguments by description).
      *   **Tone:** Academic, rigorous, persuasive, defensible.

  2.  **Deconstruct the Core Idea:**
      *   *Mechanism:* Initiative vs. Counter-Proposal. Voters vote Yes/No on Init, Yes/No on Counter. If both pass, *Stichfrage* decides which one.
      *   *Scoring Rule for Tie-Break:* Winner = Max(Popular % + Cantonal %). This is unique.
      *   *Hypothesis:* It looks like intensity aggregation (I like A more than B), but it's vulnerable to strategy (I like both, but I want the weaker one to win the tie-break so it doesn't get wasted, or I want to ensure *some* change happens).
      *   *Goal:* Formalize this. Is it a coherent measure of intensity? Under what conditions does it fail?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be precise. "Ordinality in the Binary," "The Swiss Tie-Break," etc. Let's go with something about Preference Intensity and the *Stichfrage*.
      *   **Abstract/Summary:** (Usually part of the proposal structure, though not explicitly requested, it helps frame the word count. I will integrate this into the Introduction).
      *   **Introduction & Research Question:**
          *   Hook: Direct democracy is usually binary. Swiss system has this unique 3-question hybrid.
          *   Problem: What does the third question *mean*?
          *   RQ: Does the *Stichfrage* mechanism satisfy the axioms required to interpret its outcome as a measure of aggregate preference intensity, or does it collapse into a coordination game under strategic voting?
      *   **Literature Gap:**
          *   Existing work focuses on: turnout, elites, campaign finance, policy outcomes.
          *   Missing: The *internal logic* of the aggregation rule itself. The normative justification (intensity) vs. the positive reality (strategy).
      *   **Methodology:**
          *   Formal Social Choice Theory.
          *   Model the ballot as a voting rule.
          *   Assumptions: Voter utility functions (intensity), information sets (do they know poll standings?).
          *   Comparators: AV/Ranked Choice, Two-Round, Condorcet.
          *   Why formal? Because empirical data can't distinguish between "I really prefer A" and "I strategically voted A in the tie-break."
      *   **Work Plan:** 12 months. Breakdown by modeling, analysis, writing.
      *   **Risk/Failure:** What if the model shows it *is* robust? Or what if the math is intractable? Need to define "negative result" as a valid outcome.
      *   **Scope Management:** What to cut if time runs out? (e.g., the cantonal dimension is complex, maybe simplify to popular vote first).

  4.  **Writing - Iteration 1 (Mental Outline & Word Count Check):**
      *   Intro: 500 words.
      *   Lit Gap: 500 words.
      *   Methodology: 800 words.
      *   Significance/Impact: 400 words.
      *   Risk/Failure: 300 words.
      *   Work Plan: 300 words.
      *   Total: ~2,800 words.
      *   *Correction:* Need to ensure the flow is cohesive. The "Significance" can be merged with the Intro or Lit Gap. Let's make sure the "Research Question" is very sharp.

  5.  **Drafting - Content Focus:**
      *   *The "Sum of Percentages" Rule:* This is the crux. Popular % + Cantonal %. This is unusual. Most social choice deals with raw votes. This mixes two majorities. I need to highlight this complexity.
      *   *Strategic Incentive:* If I want change, and I think the Initiative is popular but the Counter-Proposal is safer, how do I vote? If I vote Yes/Yes, my tie-break matters. If I think Initiative will win the popular vote but lose cantons, do I vote for Counter in tie-break to ensure *something* passes?
      *   *Intensity:* The normative claim is that the tie-break reveals *how much* people want change. The counter-claim is it reveals *how* they want to game the system.

  6.  **Refining the Research Question:**
      *   Bad: "How does the Swiss tie-break work?"
      *   Good: "Under what informational conditions does the Swiss *Stichfrage* aggregate preference intensity rather than strategic coordination?"
      *   Better: "Does the *Stichfrage* satisfy strategy-proofness conditions necessary to validate its normative interpretation as a measure of preference intensity?"

  7.  **Addressing the "No Citations" Rule:**
      *   Instead of "As Smith (2020) argues...", use "Standard defenses of direct democracy often rest on..." or "Formal social choice literature establishes..."
      *   This requires careful phrasing to sound authoritative without name-dropping.

  8.  **Drafting the Work Plan:**
      *   Months 1-3: Literature & Model Setup.
      *   Months 4-6: Formal Analysis (Theorems/Proofs).
      *   Months 7-9: Comparative Analysis (Rivals).
      *   Months 10-12: Writing & Dissemination.
      *   *Constraint:* Need to flag what gets cut. The cantonal dimension is the obvious candidate for simplification if the math gets too heavy.

  9.  **Review against Constraints:**
