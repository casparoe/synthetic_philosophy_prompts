answer: |-
  **Project Title:** Ordinality in the Binary: A Formal Analysis of Preference Intensity and Strategic Coordination in the Swiss *Stichfrage*

  **Project Summary**

  Direct democracy is typically characterized by binary choice: the electorate accepts or rejects a proposition. The Swiss federal system, however, possesses a unique exception to this rule in the instrument of the direct counter-proposal. When a popular initiative qualifies for the ballot, the Federal Assembly may draft a competing constitutional amendment. Voters face three questions: whether to accept the initiative, whether to accept the counter-proposal, and, if both achieve majority support, a tie-break question (*Stichfrage*) determining which text takes precedence. This third question allows voters to register an ordinal judgment—ranking one change above another—within a system otherwise designed for cardinal approval.

  Normative defenses of this mechanism often suggest that the tie-break allows "strength of preference" to enter the aggregation process without abandoning the principle of one person, one vote. It appears to offer a formally clean home for preference intensity in a majoritarian system. This project challenges that interpretation. It hypothesizes that the *Stichfrage* is structurally unstable: because the tie-break only matters conditionally (if both proposals pass), it creates incentives for strategic coordination rather than sincere revelation of intensity. Voters may rank proposals not by preference, but by their assessment of which proposal is more vulnerable, aiming to salvage a preferred outcome from a potential double-rejection or to ensure *some* change occurs.

  This fellowship proposes a one-year research project to model the *Stichfrage* as a social choice rule. The goal is to determine whether the mechanism admits a coherent interpretation as a measure of preference intensity, or whether it inevitably collapses into a coordination game under plausible conditions of voter information. By formalizing the ballot structure and testing it against axioms of strategy-proofness and aggregation, this project will clarify the normative status of the Swiss exception and contribute to the broader theory of how democratic systems can (or cannot) accommodate preference intensity.

  **Research Question and Problem Statement**

  The central research question is determinate and formal: *Does the Swiss tie-break mechanism satisfy the conditions of strategy-proofness required to validate its normative interpretation as an aggregator of preference intensity, and under what informational conditions does its aggregate output track intensity rather than strategic coordination?*

  This question moves beyond the descriptive inquiry of how the system functions procedurally. It targets the internal logic of the aggregation rule. The Swiss tie-break is unique not only in its existence but in its counting rule. In the event of a split decision—where one proposal leads in the popular vote and the other in the cantonal vote—the winner is determined by the sum of the percentage shares of the tie-break vote (popular percentage + cantonal percentage). This "sum of percentages" rule is distinct from standard weighted voting.

  The problem arises from the conditional nature of the vote. A voter's tie-break choice is only counted if they vote "Yes" to both proposals *and* both proposals achieve the necessary majorities. This creates a complex dependency. A voter who strongly prefers the Initiative over the Counter-Proposal might nevertheless rank the Counter-Proposal higher in the tie-break if they believe the Initiative is likely to fail the cantonal majority test. By boosting the Counter-Proposal in the tie-break, they ensure that if the Initiative fails but the Counter-Proposal passes, the Counter-Proposal is secure. Alternatively, they might engage in "compromising," ranking the weaker proposal higher to ensure it clears the tie-break threshold, thereby preventing a return to the status quo.

  If such strategies are dominant, the aggregate tie-break result does not measure how much voters prefer one text over another (intensity); it measures how voters game the probability of adoption (coordination). The research question asks whether there exists a domain of voter preferences and information sets where the sincere revelation of intensity is the dominant strategy. If no such domain exists, the normative defense of the instrument collapses. If such a domain exists, the project will define its boundaries.

  **The Gap in Existing Treatments**

  Current scholarship on Swiss direct democracy and direct democracy more generally leaves this question open. The existing literature tends to cluster around four themes, none of which resolve the specific formal problem posed by the *Stichfrage*.

  First, a significant body of work focuses on agenda-setting and elite influence. These studies examine how the government uses counter-proposals to defuse popular initiatives, effectively killing the more radical option by offering a moderate alternative. While this explains the *political* utility of the counter-proposal for elites, it treats the voter's decision as a black box. It assumes voters choose based on policy proximity but does not analyze how the three-question structure distorts the revelation of that proximity.

  Second, empirical studies frequently analyze turnout and campaign finance. These approaches treat the vote as a binary outcome to be predicted. They may control for the presence of a counter-proposal as a variable, but they do not model the internal mechanics of the three-question ballot. Empirical data alone cannot distinguish between a voter who ranks the Counter-Proposal higher because they genuinely prefer it, and a voter who ranks it higher because they believe it is safer. Without a formal model of incentives, observational data is underdetermined.

  Third, normative defenses of direct democracy often rest on the bindingness of outcomes or the educative effect of participation. These arguments justify the system as a whole but do not scrutinize specific instruments. They assume that more choice is inherently better or that the complexity of the ballot is a feature that encourages deliberation. They do not address whether the specific aggregation rule of the tie-break is coherent. A mechanism that encourages deliberation but aggregates preferences incoherently may still produce suboptimal or manipulable outcomes.

  Fourth, the formal social choice literature has extensively analyzed voting rules, but the Swiss tie-break is a hybrid that rarely fits standard categories. It is not a standard ranked-choice vote because the ranking is conditional on the approval of both options. It is not a standard runoff because the "rounds" are simultaneous. Consequently, standard theorems regarding strategy-proofness (such as the Gibbard-Satterthwaite theorem) do not apply directly without modification. The specific "sum of percentages" rule for resolving split majorities adds a layer of complexity that has not been formally axiomatized in the context of preference intensity.

  Therefore, a gap exists between the political science description of the instrument and the formal evaluation of its logic. The project fills this gap by treating the *Stichfrage* not as a political artifact to be described, but as a mechanism to be stress-tested.

  **Methodology and Approach**

  The project will be conceptual and formal rather than archival or empirical. The core task is to construct a game-theoretic model of the three-question ballot and analyze its equilibrium properties. This approach is justified because the hypothesis concerns *incentives* and *interpretability*, which are theoretical properties. Empirical observation can show *that* voters behave strategically, but only formal modeling can show *why* the structure necessitates it and under what conditions it might not.

  The modeling process will proceed in three stages.

  *Stage 1: Formalization of the Ballot.*
  I will define the Swiss tie-break as a social choice function. The input will be a profile of voter preferences over three outcomes: Status Quo, Initiative, and Counter-Proposal. However, the voting language is restricted: voters submit two binary approvals and one conditional ranking. I will formalize the "sum of percentages" rule mathematically to determine how individual votes map to the collective outcome. This requires handling the dual-majority requirement (popular and cantonal) which introduces a weighted element to the aggregation.

  *Stage 2: Assumptions about Intensity and Information.*
  To test the "preference intensity" hypothesis, I must model intensity explicitly. Standard voting models often assume ordinal preferences (A > B > C) without magnitude. Here, I will introduce cardinal utility functions. The hypothesis is that the tie-break allows the magnitude of the difference between U(Initiative) and U(Counter-Proposal) to influence the outcome. I will model voters as having private information about their own intensity and varying levels of public information about the likely success of each proposal (polling data).
  The critical assumption to test is sincerity. Does a voter maximize expected utility by reporting their true ranking in the tie-break? Or does the conditional nature of the vote create a "threshold effect" where voters boost the proposal closer to the acceptance threshold?

  *Stage 3: Axiomatic Testing.*
  I will test the mechanism against standard desiderata of social choice theory.
  1. *Strategy-Proofness:* Is truthful reporting a dominant strategy? If not, is it a Nash equilibrium?
  2. *Monotonicity:* If a proposal gains support in the tie-break, should it not lose?
  3. *Respect for Majorities:* Does the rule respect the popular and cantonal majorities in a consistent way, or does the "sum of percentages" rule allow a proposal to win despite losing both metrics in specific configurations?
  4. *Intensity Aggregation:* Does the outcome correlate with the sum of utility differences across the electorate?

  This approach is superior to a purely empirical analysis because it isolates the mechanism from confounding variables like campaign spending or media bias. It allows us to say whether the instrument *can* work as intended, regardless of how it has been used in specific historical instances.

  **Comparative Framework**

  To assess whether the Swiss design is superior, inferior, or simply distinct, the model will be compared against three natural rivals. This comparison is essential to contextualize the findings. If the Swiss mechanism is flawed, is it more flawed than the alternatives?

  1.  *Single Ranked Ballot (Instant Runoff):* Voters rank all three options (Status Quo, Initiative, Counter-Proposal) in a single order. This is the standard alternative for multi-option contests. Comparing the Swiss system to this highlights the cost of the "conditional" nature of the *Stichfrage*. Does the Swiss requirement to vote Yes/No first add valuable friction, or does it merely introduce noise?
  2.  *Two-Round Runoff:* If no option achieves a majority in the first round, a second vote is held between the top two. This separates the decision to accept change from the decision on which change. Comparing this to the Swiss simultaneous vote illuminates the trade-off between efficiency (one vote) and clarity (sequential votes).
  3.  *Condorcet-Style Pairwise Method:* This method selects the option that would beat every other option in a head-to-head contest. Since the Swiss tie-break is effectively a head-to-head contest conditioned on approval, this is the closest formal cousin. The comparison will reveal whether the "sum of percentages" rule approximates a Condorcet winner or deviates from it in ways that privilege intensity or strategy.

  The comparison will not aim to declare a "winner" in the abstract. Rather, it will identify which system is most robust to strategic manipulation when the goal is to measure preference intensity. If the Swiss system performs worse than a simple ranked ballot on strategy-proofness, the normative defense of its complexity is weakened. If it performs better on respecting dual majorities (popular and cantonal) while maintaining some sensitivity to intensity, its unique design is vindicated.

  **Significance and Implications**

  The significance of this project extends beyond Swiss political science. It addresses a fundamental problem in democratic theory: the aggregation of preference intensity. Liberal democratic systems generally adhere to "one person, one vote," treating all preferences as equal in weight regardless of how strongly they are held. This protects against tyranny but ignores the welfare gains of satisfying intense preferences.

  Various mechanisms have been proposed to introduce intensity, from quadratic voting to storable votes. The Swiss *Stichfrage* represents a real-world, existing attempt to solve this problem within a traditional majoritarian framework. It is a "natural experiment" in intensity aggregation that has operated for decades without a rigorous formal evaluation.

  If the project confirms the hypothesis that the mechanism is unstable and prone to strategic coordination, it suggests that direct democracy systems attempting to incorporate ordinality must be designed with extreme care. It would imply that the Swiss system achieves its stability not because voters reveal intensity, but because they successfully coordinate to avoid worst-case outcomes. This would reframe the instrument from a tool of nuanced expression to a tool of risk management.

  Conversely, if the project identifies conditions under which the mechanism successfully tracks intensity, it provides a proof-of-concept for hybrid voting systems. It would demonstrate that binary approval voting can be augmented with ordinal tie-breaks to capture welfare-relevant information without requiring complex new voting technologies or radical departures from majoritarian norms. This would be of interest to constitutional designers in other jurisdictions considering reforms to referendum processes.

  **Risk, Falsification, and Failure Conditions**

  A robust research plan must define what constitutes failure. In this project, there are two types of failure: intellectual falsification and practical non-completion.

  *Intellectual Falsification:* The core hypothesis is that the tie-break is unstable and measures coordination rather than intensity. It is entirely possible that the formal modeling will prove this hypothesis false. If the analysis demonstrates that truthful revelation of preference intensity is a dominant strategy under broad conditions, or that the strategic incentives are negligible compared to the intensity signal, the hypothesis is falsified. This is a successful research outcome scientifically, but it represents a failure of the specific theoretical claim proposed here. I am prepared to report this result. A finding that the Swiss system is more robust than critics assume is as valuable as a finding that it is flawed.

  *Practical Non-Completion:* The risk here lies in the mathematical complexity. The "sum of percentages" rule involving dual majorities (popular and cantonal) creates a non-linear aggregation function. Proving general theorems about strategy-proofness in this environment may be intractable within one year.
  To mitigate this, I have defined a fallback position. If the full dual-majority model proves too complex for complete characterization, I will simplify the model to a pure popular vote context (ignoring the cantonal dimension) for the core theorems, while discussing the cantonal complication qualitatively. This ensures the project produces a definitive answer about the *logic* of the tie-break, even if the full federal complexity is not fully axiomatized.

  A true failure would be producing a model that is disconnected from the institutional reality (e.g., modeling it as a standard ranked vote) or failing to derive any determinate conditions for the research question. To avoid this, the modeling will be continuously checked against the actual legal provisions of the Swiss Federal Constitution and the Voting Act to ensure institutional fidelity.

  **Scope and Scalability**

  The scope is designed for a single researcher over twelve months. The project is bounded by the specific mechanism of the *Stichfrage*. It will not expand into a general history of Swiss referendums or a broad comparative study of all direct democracy instruments.

  *Priority Components:*
  1.  Formal definition of the voting rule.
  2.  Game-theoretic analysis of strategic incentives.
  3.  Comparison with the Ranked Ballot rival.

  *Cuttable Components:*
  If the argument grows beyond its container, the first component to be reduced is the comparative analysis of all three rivals. If time constrains, I will focus exclusively on the comparison with the Single Ranked Ballot, as this is the most direct alternative for capturing ordinality. The Condorcet and Two-Round comparisons can be condensed into a discussion section rather than full formal models.
  The second component to be simplified is the cantonal dimension. As noted in the risk section, modeling the interaction between popular vote percentages and cantonal vote percentages adds significant algebraic weight. If necessary, the cantonal element will be treated as a fixed weight rather than a strategic variable, focusing the strategic analysis on the voter's tie-break choice given fixed probabilities of cantonal passage.

  This scalability ensures that the core research question—about intensity versus coordination—will be answered even if the peripheral comparisons or federal complexities are streamlined.

  **Month-by-Month Work Plan**

  **Months 1-3: Foundation and Formalization**
  *   **Month 1:** Comprehensive review of legal texts regarding the Swiss Federal Constitution and Voting Act to ensure precise institutional modeling. Refinement of the utility functions to represent "preference intensity."
  *   **Month 2:** Drafting the formal definition of the *Stichfrage* as a social choice function. Mapping the "sum of percentages" rule into algebraic form.
  *   **Month 3:** Initial testing of the model with simple preference profiles (e.g., single-peaked preferences) to identify obvious anomalies or immediate contradictions.

  **Months 4-6: Core Analysis and Theorem Proving**
  *   **Month 4:** Analysis of sincerity conditions. Deriving the conditions under which truthful voting is a best response.
  *   **Month 5:** Analysis of strategic coordination. Modeling the "risk management" scenario where voters boost the safer proposal. Identifying the Nash equilibria.
  *   **Month 6:** Synthesis of findings for the core hypothesis. Determining whether the mechanism tracks intensity or coordination in the baseline model.

  **Months 7-9: Comparative and Extended Analysis**
  *   **Month 7:** Modeling the primary rival: the Single Ranked Ballot. Running parallel strategic analysis to establish a baseline for comparison.
  *   **Month 8:** Secondary modeling of Two-Round and Condorcet methods (subject to scope constraints). Focusing on how they handle the intensity/strategy trade-off compared to the Swiss model.
  *   **Month 9:** Integration of the cantonal dimension. If tractable, incorporating the dual-majority constraint into the strategic model. If not, finalizing the simplification strategy.

  **Months 10-12: Writing and Dissemination**
  *   **Month 10:** Drafting the full manuscript. Structuring the argument to ensure the formal results are accessible to political theorists as well as formal modelers.
  *   **Month 11:** Revision and peer feedback. Circulating drafts to colleagues specializing in social choice theory and Swiss politics for validation.
  *   **Month 12:** Final polishing, abstract preparation, and submission of the final report or article manuscript to a target journal. Preparation of a policy brief summary for non-specialist audiences.

  **Conclusion**

  The Swiss direct counter-proposal is often cited as a sophisticated tool of consensus democracy, allowing the state to offer a compromise while respecting the popular initiative. However, the specific mechanics of the tie-break question remain theoretically opaque. By treating the *Stichfrage* as a formal object of inquiry, this project moves beyond description to evaluation. It asks whether the mechanism does what its defenders claim: translating the strength of democratic preference into law. Whether the answer confirms the instability of the instrument or vindicates its design, the result will provide a rigorous account of how preference intensity can be aggregated in a majoritarian system. This fits the scope of a one-year fellowship, offers clear criteria for success and failure, and addresses a gap in the literature that is both theoretically significant and institutionally specific.
