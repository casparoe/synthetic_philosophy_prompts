answer: |-
  Here is a teaching plan designed for a 90-minute session. It prioritizes the philosophical "hard point" (underdetermination and priors) over puzzle-solving proficiency.

  ### 1. Sequence of Ideas
  You have 90 minutes. Do not attempt to cover the history of Bongard problems or the computational complexity of solving them. Your narrative arc must move from **Confidence** (I can solve this) to **Confusion** (Wait, I could be wrong) to **Clarity** (My solution reveals my priors).

  **The Order:**
  1.  **The Phenomenon (0–15 min):** Solve a trivial problem. Establish the "game."
  2.  **The Version Space (15–30 min):** Introduce the idea that multiple rules fit the data. (Vocabulary: *Hypothesis Space, Version Space*).
  3.  **The Inductive Leap (30–60 min):** The main example. Confront the ambiguity.
  4.  **The Prior (60–75 min):** Why did you pick *that* rule? (Vocabulary: *Inductive Bias, Prior over Hypotheses*).
  5.  **The Assessment (75–90 min):** Designing a critical instance.

  **Vocabulary to Include:**
  *   **Hypothesis Space:** Necessary to explain that "the rule" is a selection from a set of possibilities.
  *   **Version Space:** Essential. This is the set of rules consistent with the data. You cannot make your hard point without this.
  *   **Underdetermination:** The label for the gap between data and rule.
  *   **Prior (or Inductive Bias):** The mechanism that collapses the version space to a single answer.

  **Vocabulary to Defer:**
  *   **Bayesian Updating:** Name it as "the formal math for what we just did intuitively," but do not write an equation.
  *   **Kolmogorov Complexity / MDL:** Mention "simplicity" as a heuristic, but do not define algorithmic complexity.
  *   **Search Algorithms:** Do not discuss how a machine would find the rule (e.g., decision trees). This is a session on the *logic* of induction, not the *computation*.

  ### 2. The One Example
  **Arguing you out of Convex/Concave:**
  You are correct to reject convex/concave. It reinforces the "feature detector" misconception (i.e., that concepts are always local properties of single objects). It solves too fast, creating a false sense of security that the "right answer" is immediately visible.

  **Arguing you out of the "Relation Among Six" Trick:**
  Do not use the variant where the rule is a relation among the six figures (e.g., "The figures on the left increase in size").
  *   **Reason:** If you do not explicitly state that relational rules are allowed, this is a "gotcha," not a lesson. It teaches students to read your mind, not to analyze induction. If you *do* state it, it changes the task definition rather than illuminating the underdetermination *within* a task.
  *   **Better Approach:** Use a problem where two *standard* feature-based rules fit the data perfectly, but one feels "natural" and the other "forced." This isolates the *prior*, not the *frame*.

  **The Recommended Example: The "Dual-Cue" Problem**
  This problem is designed so that two distinct, simple rules fit the data perfectly, forcing a choice based on salience.

  **Handout Description:**
  *   **Left Set (3 Figures):**
      1.  A red triangle containing a small black dot.
      2.  A red triangle containing a small black dot.
      3.  A red triangle containing a small black dot.
      *(Note: Keep them identical to remove noise, or vary size slightly if you want to rule out size. Let's keep them identical for clarity.)*
  *   **Right Set (3 Figures):**
      1.  A blue square containing a small black dot.
      2.  A blue square containing a small black dot.
      3.  A blue square containing a small black dot.

  **What it must contain:**
  *   **Two confounded variables:** Color (Red vs. Blue) and Shape (Triangle vs. Square).
  *   **A constant:** The black dot (to rule out "presence of a dot" as the discriminator).
  *   **Simplicity:** Draw them clearly. No shading, no texture.

  **What it must lack:**
  *   **A third variable:** Do not vary size or orientation. If you do, students will latch onto that as the "real" rule, missing the Color/Shape ambiguity.
  *   **Feedback:** Do not confirm their answer. When a student shouts "It's Color!", do not say "Yes." Say, "That fits the data."

  **Why this works:**
  Half the class will say "Red Triangles vs. Blue Squares." The other half will say "Color" or "Shape." When you point out that *both* rules fit 100% of the data, you have created the necessary cognitive dissonance without breaking the rules of the game.

  ### 3. The Hard Point (Underdetermination & Priors)
  **Where it belongs:** Minute 60, immediately after they have proposed solutions to the Dual-Cue problem.

  **The Move:**
  1.  Ask for the rule. (Students will say "Red Triangles on left, Blue Squares on right" or "Color").
  2.  Write the rule on the board.
  3.  **The Pivot:** Ask, "What rule did the *other* half of the room find?" (Shape).
  4.  Write that rule on the board.
  5.  **The Question:** "Look at the board. Both rules are 100% consistent with the 12 figures. Neither is contradicted. Why did you write the first one and ignore the second?"
  6.  **The Silence:** Let them sit in the silence. They will say "It's more obvious."
  7.  **The Punch:** "Obvious to whom? A graphic designer might prioritize shape. A traffic engineer might prioritize color. The data did not tell you the rule. Your *developmental history* told you which feature is 'real' and which is 'noise'."

  **Why this lands better than the "Relation" trick:**
  The "Relation" trick suggests the problem was unsolvable because they missed a instruction. The "Dual-Cue" problem suggests the problem was *over-solvable*, and their choice reveals their cognitive bias. This aligns perfectly with your goal: measuring a culturally specific sense of obviousness.

  ### 4. Misconceptions
  Here is the order of surface, and where to head them off:

  1.  **"There is one right answer."**
      *   *Surfaces:* Immediately (Minute 10).
      *   *Intervention:* When the first student solves the warm-up, ask, "Could a computer program find a different rule that also fits?" Introduce *Version Space* here.
  2.  **"Correlation is the Rule."**
      *   *Surfaces:* During the Dual-Cue example (Minute 40).
      *   *Intervention:* When they propose "Color," ask, "If I drew a Red Square, where would it go?" If they hesitate, they know it's correlation, not definition.
  3.  **"The rule must be a feature detector."**
      *   *Surfaces:* If they struggle to articulate the rule.
      *   *Intervention:* Prompt them: "Is it a property of the object, or a relationship between objects?" (Keep this brief; don't let it derail the main point).
  4.  **"Fitting one side is enough."**
      *   *Surfaces:* When checking their rules.
      *   *Intervention:* Force them to check the negative set. "Does your rule explain why the Right side is *not* Left?"
  5.  **"Stating the rule = Finding the rule."**
      *   *Surfaces:* At the end.
      *   *Intervention:* This is addressed by the Assessment (see below). Knowing the word "Color" is not the same as understanding that "Color" is a hypothesis selected from a space.

  **Missing Misconception:**
  *   **"The rule is static."** Students assume the rule *must* exist independently of the observer.
      *   *Intervention:* Explicitly state during the Hard Point: "The rule is a collaboration between the data and the learner."

  ### 5. The Assessment (Knowing vs. Knack)
  You need a task that a "puzzle solver" fails and a "cognitive scientist" passes. A puzzle solver tries to find *the* answer. A cognitive scientist tries to distinguish *between* answers.

  **The Task: "Design Figure 13"**
  *   **Instruction:** "Take the Dual-Cue problem (Red Triangles vs. Blue Squares). You identified two valid rules: Color and Shape. Draw **one** new figure that would distinguish between these two rules. That is, a figure that one rule puts on the Left, and the other puts on the Right."
  *   **Correct Answer:** A Red Square or a Blue Triangle.
      *   If Rule = Color: Red Square -> Left.
      *   If Rule = Shape: Red Square -> Right.
  *   **Why this works:**
      *   A student with a **knack** tries to solve the original puzzle. They will draw another Red Triangle (which fits both) or get confused because they think one rule is "wrong."
      *   A student with the **concept** understands the *Version Space*. They understand that to learn, you must design data that shrinks the version space. They are performing a "critical experiment."

  **Evaluation:**
  Collect the drawings. If they draw a Red Square and label which rule sends it where, they grasp induction. If they draw a Red Triangle, they are still just pattern matching.

  ### 6. Scope (What to Refuse)
  **Exclude:** Formal measures of simplicity (MDL, Kolmogorov Complexity).
  **How to say it:**
  "We have identified that 'simplicity' or 'obviousness' is what selects the rule from the version space. There is a formal mathematical framework for defining simplicity (Minimum Description Length), which treats the best hypothesis as the one that compresses the data most efficiently. We will not do the math today, but I want you to read [Citation, e.g., MacKay or Tenenbaum] before next week. For now, treat 'simplicity' as a psychological prior, not just a metric."

  **Why this is defensible:**
  You are teaching *Methods Induction*, not *Machine Learning*. Your goal is to make them aware of the *assumptions* underlying their methods. Giving them the math would allow them to hide behind the formula. Keeping it conceptual forces them to confront the subjectivity of the "obvious."

  **Closing Script:**
  "Bongard problems present themselves as tests of pure reasoning. Today you found they are actually tests of your priors. When you build models or design experiments in your own research, remember: your data never speaks for itself. It only speaks through the hypothesis space you allow it to inhabit."
