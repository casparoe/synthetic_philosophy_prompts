answer: |-
  Here is the breakdown of your household arrangement assessed against David Lewis's *Convention: A Philosophical Study* (1969). Lewis defines a convention as a solution to a recurrent coordination problem that relies on precedent, mutual expectations, and common knowledge. It is a high bar.

  ### The Five Terms: Credence of Satisfaction

  Here is the probability (0.0 to 1.0) that I assign to each of Lewis's necessary conditions being **actually met** in your house, based on the evidence provided.

  **(a) Universal Conformity (Regularity): 0.60**
  *Reasoning:* Lewis requires a precedent of general conformity. You describe the rule as "fraying." Two housemates now clean pans after big meals, and the new housemate didn't comply for a month. While a convention doesn't require 100% adherence (Lewis allows for "almost everyone"), significant deviation suggests the regularity is destabilizing. It is a regularity, but a leaky one.

  **(b) Mutual Expectations: 0.70**
  *Reasoning:* For a convention to hold, everyone must expect everyone else to conform. The original three likely hold this expectation. However, the new housemate explicitly lacked it for a month, and the fact that nobody corrected her suggests the existing housemates' expectations were not robust enough to trigger a correction signal. Expectations are present but not universal or resilient.

  **(c) Alternative Equilibrium (Arbitrariness): 0.90**
  *Reasoning:* This is the strongest pillar. Lewis insists a convention must be arbitrary—there must be another workable solution. You state explicitly that "cook cleans" would have worked about as well. This confirms the arrangement is a coordination equilibrium rather than a moral imperative or a physical necessity.

  **(d) Preference/Interest (Coordination Payoff): 0.80**
  *Reasoning:* Lewis requires that people conform *because* others conform (conditional preference). You note people might clean out of "fear of looking like a freeloader." If the motivation is purely shame (norm enforcement) rather than coordination utility (I clean because I expect you to cook, and we both want dinner done), it drifts toward social norm. However, since the system *does* solve the "who does what" coordination problem, the payoff structure is largely present.

  **(e) Common Knowledge: 0.25**
  *Reasoning:* This is the strictest Lewisian requirement. It is not enough that everyone knows the rule; everyone must know that everyone knows, ad infinitum. The new housemate's ignorance for a month is a critical failure point. If she didn't know, then the existing housemates could not have known that *she* knew. Furthermore, the lack of correction implies the existing housemates didn't even know that *they* needed to make it known. The chain is broken.

  ***

  ### Combination Logic

  Lewis's definition is **conjunctive**. In strict logic, if any necessary condition is false, the definition fails ($A \land B \land C \land D \land E$). However, since we are dealing with empirical uncertainty (credence) rather than boolean truth, we cannot simply multiply the probabilities (which would yield a vanishingly small $0.07$), nor can we average them (which would reward high scores on irrelevant terms).

  I am using a **"Weakest Link Cap"** model. The overall credence cannot exceed the credence of the least satisfied necessary condition, but it is discounted slightly by the instability of the others.

  $$ \text{Overall Credence} \approx \text{Min}(a,b,c,d,e) \times \text{Stability Factor} $$

  *   **Min Score:** 0.25 (Common Knowledge)
  *   **Stability Factor:** 0.85 (Reflecting the fraying conformity and mixed motivations)

  ***

  ### Overall Credence

  **0.21 (21%)**

  I assign a **21% credence** that this arrangement is a convention in Lewis's *strict* sense. It functions *like* a convention, but structurally, it lacks the epistemic foundation (Common Knowledge) and the behavioral rigidity (Conformity) required for the technical definition.

  ***

  ### Sensitivity Analysis: The Term Doing the Most Work

  The single term moving the needle most is **(e) Common Knowledge**.

  *   **Why:** In a conjunctive definition, the lowest probability acts as a ceiling. Even if Conformity (a) and Alternatives (c) were 1.0 (perfect), the overall credence could not exceed 0.25 because of the Common Knowledge leak.
  *   **Direction:** If you could prove that Common Knowledge *did* exist (e.g., if the new housemate actually knew but pretended not to, or if there was a written note everyone saw), my overall credence would jump from **0.21 to roughly 0.75**.
  *   **Contrast:** If you proved Conformity was perfect (everyone always cleans), the overall credence would only rise to **0.30**, because the Common Knowledge bottleneck would remain.

  ***

  ### Fallback Verdict & Settling Observation

  **Verdict:**
  It is not strictly a Lewisian convention. It is best classified as a **Customary Social Norm** (in the sense of Cristina Bicchieri).
  *   *Difference:* A Lewisian convention relies on *coordination expectations* ("I do this because I expect you to do that"). A Social Norm relies on *empirical and normative expectations* ("I do this because I think others do it, and I think others think I *should* do it"). The "fear of looking like a freeloader" you mentioned is the hallmark of a Norm, not a Convention. Conventions are about efficiency; Norms are about appropriateness.

  **The Settling Observation:**
  To cleanly settle whether this was ever a Lewisian convention, observe the **reaction to deviation**.

  *   **The Test:** Wait for the next time someone cooks a big meal and leaves the pans.
  *   **Convention Reaction:** The others clean them without comment, perhaps feeling mildly inconvenienced but acknowledging the coordinator (the cook) has moved to a different equilibrium. The system absorbs the shock.
  *   **Norm Reaction:** The others express irritation, make a passive-aggressive comment, or feel "wronged."
  *   **The Decider:** If the housemates **corrected the new housemate immediately** upon her first deviation, it suggests the Common Knowledge was active and they were enforcing an equilibrium. The fact that they **did not correct her for a month** is the strongest evidence that it was never a Lewisian convention; it was merely a habit that hadn't been elevated to common knowledge. If it were a true convention, the deviation would have triggered an immediate attempt to restore the coordination equilibrium.
