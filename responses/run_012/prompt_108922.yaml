  *   **Verdict:** **Indifferent.** There is no policy that yields survival. Your "wash" intuition is correct. The discomfort in Case 7 comes from hoping randomness breaks the link. It doesn't. If the predictor predicts the coin, the coin is just another deterministic input to them.
  *   **What to do:** Since all policies lead to Death, you maximize utility elsewhere (e.g., comfort). Flip the coin if it makes you feel better, but acknowledge it doesn't change the outcome.

  #### 5. Smoking Lesion
  *   **Policy:** `Smoke` vs. `Don't Smoke`.
  *   **Analysis:** Smoking doesn't *cause* cancer, but it is *evidence* of the lesion (which causes cancer). You want to be the kind of person who doesn't smoke, because that kind of person is statistically unlikely to have the lesion.
  *   **Verdict:** **Don't Smoke.** (Matches your intuition. You are selecting the disposition correlated with health).

