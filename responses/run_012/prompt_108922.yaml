  ok so I've been arguing with a friend about predictor cases for like two months and I've realized my gut is inconsistent in a way I can't patch over. Can you tell me what principle, if any, my verdicts add up to — and if there isn't one, which verdict I should give up? I'd rather have an ugly rule that covers everything than a clean one that says I'm wrong about half my cases, but I'll take the clean one if you can show me the ugly one is doing something incoherent underneath.

  Here's where I land:

  1. Classic Newcomb. Predictor's been right ~99 times out of 100, the boxes are already set, I can't see in. I take just the opaque box. Not torn at all. When someone walks me through the causal argument for two-boxing I feel like they're answering a different question than the one I'm asking.

  2. Predictor's only 55% reliable. Still one-box, slightly less comfortable. Even at 51% I think I'm still one-boxing.

  3. Transparent Newcomb, where the big box is visibly empty. I take both. Obviously — there's $1000 sitting there and the big box has nothing in it, so refusing the $1000 is just throwing money away. But I notice this means my policy shifts depending on what I can see, and in case 1 I said the seeing-in thing doesn't matter. So either I'm confused or one of these is wrong.

  4. Death in Damascus. Death's appointment with me is wherever I end up tomorrow, and he's already fixed it by predicting me. So fleeing kills me and staying kills me. I genuinely don't have a verdict here. My inclination is to say it's a wash and the honest move is to stop deliberating and do whatever — flip a coin, leave it to the camel. But then someone points out he predicted the coin too, so flipping isn't an escape hatch, its just another thing on file. So now I don't know what my "it's a wash" is even supposed to mean. Is that a verdict or am I refusing to answer?

  5. Smoking lesion. A lesion causes both the cancer and the craving to smoke; smoking doesn't cause the cancer. My gut says don't smoke — same gut as case 1. But I can't say it's because smoking would give me cancer, since it wouldn't. So what is my gut actually tracking here?

  6. The hitchhiker. I only get picked up if the driver believes I'll pay when we reach town, and once I'm in town paying is pointless (I'll never see him again, nothing enforces it). I pay. My friend says once I'm in the car the money's mine either way, so paying is just irrational. I think he's missing that the driver stopped because of what kind of person I am, and that what kind of person I am isn't something I get to fake for two hours in a desert.

  7. A twist on 4 that I can't get out of my head. Suppose the predictor says she predicted not just my choice but also the coin I flip to make it, and her record on flips is as good as on anything else. If that's even coherent, then "do something arbitrary" is exactly as predictable as anything else, and the one thing that made case 4 feel different from case 1 is gone.

  What I think I'm doing: not picking the act with the best consequences, but picking the act that belongs to the best disposition — the thing that would go best if the predictor knew my disposition and I couldn't secretly deviate from it. That seems to cover 1, 2, 6 and maybe 5. But it gives me the wrong answer in 3 (it says one-box even when I can see the box is empty, which I won't accept), and it seems to let me gerrymander: why can't I say my disposition is "two-box when I can see the box is empty, one-box otherwise"? That's a disposition, it's mine, it's stable, and it gets me the money in both cases. If the principle says that's fine, it's empty. If it says it's not fine, I want to know what's doing the work.

  So: is there a rule that gets 1, 2, 3, 5 and 6, and tells me what to do in 4 and 7 — and if I have to drop one verdict, which one and why? Also say what the rule does with a case I haven't listed, ideally one where the predictor is right about my disposition but wrong about my act, if that's even coherent. And please don't just tell me the answer is "it depends whether the predictor is a cause or a correlate" unless you can say what my case 3 verdict is supposed to be under that view, because that's exactly where I'm stuck.
