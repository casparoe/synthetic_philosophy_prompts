answer: |-
  It is a genuine pleasure to engage with someone who has spent a career in the trenches of data collection and is now wrestling with the foundations of what that data means. Your intuition is shared by many, including some very prominent statisticians, and it is seductive for a reason. When you look at the wreckage of the replication crisis, the p-value is the most visible shard of glass on the floor, so it is natural to blame the tool that broke. However, if you want me to push back hard as requested, I will tell you straight away that your labmate is likely right about the naivety, not because Bayesianism is wrong, but because your diagnosis confuses the weapon with the motive. The most decisive evidence against your view is not found in the mathematics of inference but in the sociology of science. If the replication crisis were primarily a frequentist disease, then fields that adopted Bayesian methods early and enthusiastically should be islands of replicable truth amidst a sea of noise. They are not. Cognitive psychology and neuroscience have been heavy adopters of Bayesian modeling for decades, yet they were ground zero for the replication crisis. The failure to replicate spans across statistical paradigms, suggesting the pathogen is not the calculation of the p-value but the pressure to produce a publishable result. When the incentive structure rewards novelty over accuracy, scientists will hack whatever machinery is available to them. You mentioned that p-hacking is just as easy under a Bayesian banner, and you should trust that instinct because it is correct. There is such a thing as prior hacking, where a researcher tweaks the prior distribution until the posterior looks significant enough to publish. There is model hacking, where the structure of the Bayesian hierarchy is adjusted until the credible intervals exclude zero. There is even stopping rule hacking, because while Bayesians claim stopping rules are irrelevant, in practice, collecting data until the Bayes Factor crosses a threshold of three or ten is functionally identical to collecting data until p is less than point zero five. If the method allows for flexibility, and the human wants a specific outcome, the method will be bent.

  This leads directly to the empirical comparison you asked for, which ranks as the second most decisive defeater for your position. You wanted to know what would move you most, and it should be this: there are domains where the frequentist apparatus stayed put and things got better anyway. Look at the reforms driven by the open science movement. Preregistration, larger sample sizes, and a focus on effect sizes and confidence intervals rather than binary significance have improved replicability in several corners of psychology and social science without requiring a switch to Bayesian inference. When researchers commit to their analysis plan before seeing the data, the p-value becomes much harder to game, and replication rates improve. This demonstrates that the crisis was driven by flexibility and secrecy, not by the frequentist framework itself. Conversely, if you look for domains where a switch to Bayesian methods happened and nothing changed, you need look no further than the very fields I mentioned earlier that embraced Bayesianism but still produced fragile results. The switch in software from SPSS to Stan or JAGS did not inoculate them against bias because the bias was not in the software. It was in the career pressure to find something new. If your view were correct, the Bayesian-heavy subfields should be replicating significantly better than the frequentist-heavy ones, once you control for sample size and power. They are not. The variance in replicability is better explained by the cost of data collection and the culture of the specific subfield than by the statistical philosophy employed.

  Moving down the list of decisiveness, we have to talk about the technical vulnerabilities of the Bayesian approach that your friends might downplay. You mentioned the paradox where a sharp null ends up with a big posterior despite a small p-value, often called Lindley's Paradox. This is not just frequentist sour grapes; it is a serious mathematical feature that shows how sensitive Bayesian outcomes are to the specification of the prior. If you choose a prior that is too diffuse, you can artificially inflate the support for the null hypothesis. If you choose a prior that is too tight, you can force the posterior to match your preconceptions. The claim that priors force you to say out loud what you believed is true in theory, but in practice, priors are often justified with technical arguments about convenience or reference classes that obscure the subjective choices being made. A clever researcher can construct a prior that looks objective but effectively encodes the desired result. Furthermore, Bayesians have their own arbitrary cutoffs. Just as frequentists worship at the altar of point zero five, many Bayesians treat a Bayes Factor of three as moderate evidence and ten as strong evidence. These thresholds are not derived from nature; they are conventions. When a result lands on the wrong side of that convention, it gets filed away just as often as a p-value of point zero six. The machinery changes, but the human tendency to seek binary decisions remains.

  Then there is the issue of insulation and falsifiability, which you rightly identified as a danger. You asked if your position is in danger of becoming unfalsifiable, and the honest answer is yes. It is already happening. When a Bayesian analysis fails to replicate or is shown to be manipulated, the defense is often that the priors were chosen poorly or the model was misspecified. This is the no true Scotsman fallacy in statistical clothing. If every failure of Bayesianism is attributed to improper application rather than the framework itself, while every failure of frequentism is attributed to the framework, then your view is protected from evidence by definition. A robust scientific view must allow for the possibility that the tool itself is insufficient for the job. Frequentist methods have the advantage that their error rates are defined over the long run regardless of the truth of the hypothesis, which provides a check on the method itself. Bayesian methods rely on the coherence of the believer's degrees of belief, which is harder to externally validate. If your friends dismiss every counterexample as not real Bayesianism, they are treating the philosophy as a belief system rather than a toolset. This does not doom the view entirely, but it does mean you must be vigilant against protecting it from reality. You need to be willing to admit that Bayesian methods can be just as brittle as frequentist ones when used by humans under pressure.

  So here is the bottom line on whether you are holding a view or a slogan. You are holding a view that contains a kernel of truth but has been polished into a slogan. The kernel of truth is that null hypothesis significance testing is routinely misunderstood and abused, and that Bayesian inference offers a more intuitive interpretation of probability. That is valid. But the slogan is the claim that switching frameworks would dissolve the replication crisis. That is an oversimplification that ignores the human element of science. The crisis is not a statistical error; it is a systemic error. It is caused by the fact that we reward scientists for finding differences rather than finding truth, for publishing stories rather than reporting data. No amount of mathematical elegance can fix a system that pays people to cut corners. If you switched every journal to Bayesian requirements tomorrow, you would simply get a new generation of papers with beautiful posterior distributions that fail to replicate because the underlying effects were noise, or the priors were tuned, or the data was collected until the story worked. Your view would be falsified if you found that rigorous frequentist practices yield better replication than lax Bayesian practices, and the evidence suggests they do. It would also be falsified if Bayesian fields showed no immunity to the crisis, and they have not.

  I know this is frustrating because the frequentist machinery really is a Rube Goldberg contraption, and it feels like there should be a cleaner way. There is a cleaner way, and Bayesianism is often it, but it is not a cure-all. It is a different set of tools, not a moral upgrade. The most decisive thing that should change your mind is the realization that statistics is subordinate to incentives. If you want to fix the replication crisis, you do not start with the math; you start with the career structure. You fix the file drawer problem by registering studies, not by changing the prior. You fix p-hacking by blinding analysts to conditions, not by calculating Bayes Factors. Your labmate calls you naive because you are looking for a technical solution to a sociological problem. That is a very scientist thing to do, given our training, but it is still a category error. You can keep your love for Bayesian inference because it is often the right tool for the job, but you should let go of the hope that it will save science from itself. Science is saved by scientists who are willing to be wrong, not by formulas that make it harder to say you are right.
