  Ok so I need a weird one for a side project. Write me a parody of a mid-size company's internal employee handbook — specifically the Ethics & Compliance chapter — where the whole ethics office has quietly went hardline deontologist. Make it numbered clauses (like a real handbook, clause 4.1, 4.2, etc.), maybe 650-750 words, deadpan corporate voice the whole way, no winking. The running joke is the paradox of deontology: the handbook flatly forbids any employee from breaking a rule even when breaking it would obviously prevent a much bigger pileup of the same kind of violation, and it keeps insisting that what matters is who did what, never how many wrongs end up happening. Don't ever name the paradox or explain the philosophy — just have the clauses live it out, so someone who's read the actual debate snorts and someone who hasn't still feels that something is deeply off. Please invent a bit of fake internal jargon to hang it on — some scoring or ledger the compliance office keeps, a made-up internal certification, a "clean hands" metric, whatever — and include a scenario box where following the rule makes everything way worse and the handbook cheerfully grades it as a pass. Also throw in one dissenting footnote from the company's one utilitarian in legal, and keep it fair: the target is the position and the corporate-compliance style, not any real person, and every exaggeration should be a real feature of the view (agent-relative constraints, doing vs. allowing, the odd relationship between constraints and minimizing violations) rather than something you made up. Casual voice fine, it's a parody.
