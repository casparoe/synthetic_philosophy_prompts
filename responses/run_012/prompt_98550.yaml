answer: |-
  **SECTION 4: ETHICAL CONDUCT & AGENT INTEGRITY**

  **4.1 Purpose of Agent Constraints**
  The objective of this chapter is not the minimization of total compliance violations across the corporation, but the preservation of individual agent integrity. Each employee is responsible solely for their own Direct Causation Chain. Employees are not accountable for the aggregate sum of violations occurring within their sphere of influence, provided such violations were not directly executed by the employee's own hand. The cleanliness of the employee's record takes precedence over the cleanliness of the operational outcome.

  **4.2 Prohibition on Instrumental Breaches**
  Under no circumstances may an employee commit a Level 1 Violation to prevent another employee from committing a Level 1 Violation. This is classified as an Instrumental Breach. For example, falsifying a safety log to prevent a colleague from falsifying ten safety logs is strictly prohibited. The employee who falsifies one log incurs a direct penalty. The ten logs falsified by the colleague are recorded as Passive Exposure events for the observer and carry zero demerits against the observer's Agent-Purity Score (APS).

  **4.3 Commission vs. Omission**
  The Compliance Office distinguishes sharply between Active Breach and Passive Exposure. An Active Breach occurs when an employee initiates a causal chain resulting in a rule violation. A Passive Exposure occurs when an employee allows a causal chain initiated by others to proceed without interference. Passive Exposure is never penalized under the Clean Hands Metric. Employees are advised that allowing a catastrophic system failure caused by others is preferable to initiating a minor unauthorized override to prevent it.

  **4.4 The Clean Hands Ledger**
  All ethical incidents are recorded in the Clean Hands Ledger. Scoring is agent-relative. If Employee A lies to a client to prevent Employee B from defrauding that client, Employee A receives a −100 APS deduction. Employee B receives no deduction regarding Employee A's intervention. The total financial loss to the corporation is not factored into the APS. The Ledger tracks who acted, not what happened.

  **4.5 Certification Requirements**
  Promotion to Level 3 Management requires a maintained APS of 100.0. Any deduction resulting from an Active Breach, regardless of the net benefit to the company or the reduction of overall non-compliance events, renders the employee ineligible for certification for a period of no less than twenty-four months.

  ***

  **EXHIBIT 4.A: APPROVED ACTION SCENARIO**

  **Situation:** A server room fire is detected. Protocol 9 requires immediate evacuation. However, the fire suppression system requires a manual override code to activate. The only employee present, J. Doe, does not have authorization to input the code (Violation 8.2: Unauthorized System Access).

  **Option A:** J. Doe inputs the code. The fire is extinguished. Property damage: $0. Violations committed: 1 (Unauthorized Access).
  **Option B:** J. Doe evacuates. The fire destroys the server room. Property damage: $5M. Violations committed: 0 by J. Doe.

  **Compliance Ruling:** Option B is the only compliant choice. Choosing Option A results in an automatic APS failure for J. Doe. The $5M loss is recorded as an Environmental Event, not a Compliance Event. J. Doe retains Clean Hands Certification by choosing Option B.

  ***

  **4.6 Non-Aggregation Clause**
  Employees may not justify an Active Breach by citing the prevention of multiple future Breaches by other agents. The math of violations is not additive. One violation committed by you is infinitely weightier than one thousand violations committed by others which you could have stopped. Your duty is to your own conduct, not to the global compliance state of the firm.

  **4.7 Reporting**
  When reporting ethics incidents, employees must omit consequentialist reasoning. Statements such as "I broke the rule to help the company" will be flagged as admissions of guilt. Statements such as "I adhered to protocol despite adverse outcomes" will be flagged for Commendation.

