  The collector sued the potter for crushing the bust. "You destroyed my asset," he argued.

  "I reshaped my clay," the potter countered. "I never sold the matter."

  The judge, consulting a text on material constitution, intervened. "Are they identical?"

  "No," said the potter. "The lump existed Tuesday; the statue didn't. Different historical properties."

  "And modal profiles differ," added the collector. "Squash the lump, the statue ceases to exist."

  "Precisely," said the judge. "Constitution isn't identity. We have two objects here."

  He banged the gavel. "Verdict: Potter keeps the clay. Collector keeps the statue."

  "But the statue is gone," said the collector.

  "Exactly. You own a non-existent object. Potter owns the clay currently filling your void."

  "So who pays storage?"

  "Both," said the judge. "Since you're co-located, you're double-billing the universe for one cubic meter. Furthermore, since the statue's value was grounded in the clay's arrangement, Potter owes damages for severing the grounding relation. But Collector owes rent for the clay's unauthorized presence in his portfolio."

  The bailiff blinked. "Do I serve one summons?"

  "No," said the judge. "Serve two. They're in the same place, but they aren't the same thing."
