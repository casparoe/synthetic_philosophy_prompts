answer: |-
  **Exam Question**

  **Essay Question (50 minutes)**

  Parfit's Hitchhiker case is often used to suggest that rationality sometimes requires adopting a disposition to act against one's immediate self-interest. Explain the core tension in the original case, specifically addressing the condition regarding the driver's ability to predict your behavior. Then, analyze how the two following variants alter the normative landscape:

  (a) **The Fare Up Front:** You have the cash on hand now, and the driver demands payment before starting the engine.
  (b) **The Witness:** A second stranded traveller observes the agreement and will later be in a position to help or harm you based on whether you paid.

  Do these variants show that the "irrationality" in the original case is robust, or do they dissolve it? Conclude by taking a definitive stance: Is "rational irrationality" a genuine phenomenon where reason commands self-sabotage, or does the case collapse into ordinary instrumental reasoning about which dispositions to cultivate? Defend your position.

  ***

  **Model Answer**

  Parfit's Hitchhiker case is designed to break standard act-based decision theory. In the original scenario, you are dying in the desert. A driver offers a ride only if you promise to pay $100 once you reach town. Once in town, the ride is a sunk cost; the driver cannot punish you, and you gain nothing by paying. Standard instrumental rationality dictates you should not pay. However, the driver knows this. If you are the kind of person who follows standard rationality, the driver leaves you to die. To survive, you must be the kind of person who keeps promises even when it is ex-post irrational to do so.

  Crucially, this puzzle only bites if the driver can predict your type. If the driver cannot distinguish between a genuine promiser and a liar, you should simply lie, take the ride, and keep the money. The case relies on transparency: your internal disposition must be legible to the driver before the ride begins. The paradox arises because the benefit (survival) depends on having a disposition that compels you to act against your interest later.

  Variant (a), the Fare Up Front, dissolves the puzzle entirely by removing the time inconsistency. If you pay before the engine starts, the exchange is simultaneous. You do not need a special disposition to overcome future weakness of will because the commitment is physical, not psychological. There is no gap between the promise and the performance where rationality could diverge from obligation. This variant shows that the original problem is partly an artifact of delayed enforcement. If commitment devices are available, "rational irrationality" is unnecessary; standard rationality suffices.

  Variant (b), The Witness, alters the payoff structure rather than the timing. Here, paying in town is no longer ex-post irrational. Because the witness observes your behavior and will interact with you later, paying preserves your reputation. The cost of paying ($100) is outweighed by the future benefit of being seen as trustworthy. In this scenario, keeping the promise is instrumentally rational even at the moment of payment. This variant suggests that the original case relies on an artificial isolation of the agent from future social consequences.

  Do these variants show the original irrationality is robust? No. They pull in different directions to show the original case is fragile. Variant (a) shows the problem vanishes with physical commitment. Variant (b) shows the problem vanishes when social consequences are accounted for. The original case only holds in a narrow window where commitment is impossible and reputation is irrelevant, yet predictability is perfect.

  This leads to the final question: is "rational irrationality" genuine? I argue it is not. The phrase suggests a contradiction—that reason commands unreason. A better description is that rationality applies to agents over time, not just isolated acts. Cultivating a disposition to keep promises is instrumentally rational ex-ante because it unlocks cooperative benefits (like the ride). Once you have that disposition, paying in town is simply the disposition playing out. It feels like self-sabotage only if you define rationality as maximizing utility at every single instant. But if you define rationality as managing your agency to secure the best life overall, then cultivating "irrational" dispositions is just smart long-term planning.

  Therefore, the case collapses into ordinary instrumental reasoning about dispositions. We do not need to posit a mysterious form of rationality that endorses self-sabotage. We only need to acknowledge that the unit of rational evaluation is the agent's character and policy, not the atomic act. The Hitchhiker case does not prove that rationality is self-defeating; it proves that act-based decision theory is too narrow to capture how agents successfully navigate a world where predictability matters. Rationality demands we become the kind of people who pay, not because paying is magic, but because being that kind of person is the only way to get the ride.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. Explanation of the Original Paradox (5 marks)**
  *   **Must-Hit:** Clearly articulate the conflict between ex-ante benefit (getting the ride) and ex-post irrationality (no reason to pay once safe).
  *   **Strong Move:** Explicitly frames this as a failure of act-based evaluation vs. disposition-based evaluation.
  *   **Typical Error:** Retelling the story without identifying the specific decision-theoretic tension (sunk cost vs. precondition).

  **2. The Prediction Condition (5 marks)**
  *   **Must-Hit:** Identify that the case fails if the driver cannot predict the student's behavior (i.e., if lying is undetectable).
  *   **Strong Move:** Notes that transparency/predictability is the linchpin that forces the agent to actually *be* trustworthy rather than just *say* it.
  *   **Typical Error:** Ignoring this condition entirely or assuming the driver just trusts verbal promises without evidence.

  **3. Analysis of Variant (a) — Fare Up Front (5 marks)**
  *   **Must-Hit:** Explain that this removes the need for a psychological disposition by making commitment physical/simultaneous.
  *   **Strong Move:** Argues that this dissolves the puzzle by eliminating the temporal gap where irrationality could occur.
  *   **Typical Error:** Treating this as essentially the same as the original case, missing that it removes the "promise" element entirely.

  **4. Analysis of Variant (b) — The Witness (5 marks)**
  *   **Must-Hit:** Explain that this makes paying ex-post rational by introducing future reputational consequences.
  *   **Strong Move:** Contrasts this with (a) by noting (b) changes the payoff matrix, whereas (a) changes the timing/mechanics.
  *   **Typical Error:** Claiming this variant is identical to the original, failing to see that reputation makes payment instrumentally sensible.

  **5. Final Verdict on "Rational Irrationality" (5 marks)**
  *   **Must-Hit:** Take a definitive side (Genuine vs. Collapse into Disposition Management) and justify it using the previous analysis.
  *   **Strong Move:** Argues that "rational irrationality" is a misnomer for rational disposition selection (as per the model answer).
  *   **Typical Error:** Shrugging/neutrality ("both sides have merits") or claiming rationality genuinely requires acting against one's interests without reframing the definition of rationality.
