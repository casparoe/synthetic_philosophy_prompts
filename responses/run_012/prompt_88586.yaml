  Also, need to clarify the "witness" aspect. 4CT is a universal statement ($\forall$ maps). Constructively, this means a method that takes any map and returns a coloring. The Appel-Haken/Gonthier proof *does* provide this algorithm. So the existence/witness condition is met for the universal claim (the method is the witness).

