      *   *Section 2 (The Objection):* The objection is surveyability (Tymoczko). This is not BHK. BHK allows idealized mental constructions. Surveyability is Wittgensteinian/Strict Finitist.
      *   *Section 3 (Three Meanings):* Explicitly define the triad. Map 4CT to them. Show the conflict is only with #3.
      *   *Section 4 (Contrasts):* CFSG (human but unsurveyable) vs. 4CT (machine but formal). Constructivism treats them similarly (both finite methods). Surveyability treats them differently (hardware trust vs. social trust).
      *   *Section 5 (Accommodation):* Can Intuitionism absorb Surveyability? Only by weakening "idealized mind" to "actual mind." This leads to Strict Finitism (feasibility). The failure case is "in-principle feasible but in-practice impossible."
