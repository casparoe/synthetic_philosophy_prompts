          *   *Distinction:* Constructivism (Logic) vs. Strict Finitism/Wittgenstein (Epistemology).
          *   *Verdict:* Constructivism (as a logic of proofs) does *not* have the resources to object to 4CT based on length alone, provided the length is finite. The objection belongs to a theory of *mathematical understanding* or *strict finitism* (feasibility), not intuitionistic logic.

      *   **Part 3: Three Meanings of "Constructive"**
          1.  *Meaning-Theoretic (BHK):* Proof = Construction. (Logic)
          2.  *Existence (Witness):* $\exists x$ needs a term. (Logic/Model Theory)
          3.  *Epistemic (Surveyability):* Human must grasp it. (Philosophy of Mind/Epistemology)
          *   *Application to 4CT:*
              *   (1) Satisfied. The proof constructs a coloring procedure.
              *   (2) Satisfied. For any map, the procedure yields a coloring.
              *   (3) Threatened. Humans cannot hold the whole derivation in mind.
          *   *Threat:* 4CT threatens (3), not (1) or (2). Classmates are conflating (3) with (1)/(2).

      *   **Part 4: Contrasts (CFSG and Kepler)**
          *   *CFSG:* Thousands of pages. No computer needed in principle, but no human read it all.
