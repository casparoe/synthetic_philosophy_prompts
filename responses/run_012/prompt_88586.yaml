      *   *Is the distinction between BHK and Strict Finitism clear?* Need to ensure I don't imply Brouwer accepted *any* finite computation. Brouwer was wary of the "completed infinite," but large finite numbers were generally okay as long as the *law* generating them was clear. The objection to 4CT is about the *list of cases*, not just the size of numbers.
      *   *CFSG:* Is it constructive? It classifies finite objects. It doesn't use LEM on infinite domains. So yes, logically constructive.
