answer: |-
  This is a formidable topic, and your timeframe (one semester) demands a strategy that avoids getting bogged down in empirical psychology while securing the conceptual foundations necessary for the dissertation. The heterogeneity problem is often treated as a single objection, but it is actually a cluster of distinct worries: metaphysical (is there a common property?), axiological (does the lack of common property matter for value?), and formal (can heterogeneous items be measured on a single scale?).

  Below is a prioritized research plan for your semester. I have ordered these questions by logical dependency (upstream to downstream). I have integrated your two specific areas of focus into Questions 2 and 3, as they are best analyzed within those specific contexts.

  ### 1. The Metaphysical Question: Is "Pleasure" a Determinable or a Disjunction?
  **Priority:** First (Upstream)
  **Reasoning:** This is the logical precondition for the rest of the chapter. If pleasures share a common phenomenological or attitudinal nature, the heterogeneity problem dissolves immediately. If they do not, you must determine whether they form a *determinable* (like "color," which unites red and blue) or a mere *disjunction* (like "grue," which unites green and blue arbitrarily).

  *   **Tractability:** High with conceptual/phenomenological tools. You do not need neuroscience to analyze whether the *experience* of relief and the *experience* of tasting a peach share a introspectible quality. You can rely on the tradition from Moore to Feldman. Empirical psychology is of limited use here because "pleasure" in axiology is a normative/phenomenal category, not necessarily a neural firing pattern.
  *   **Evidence/Argument Shifters:**
      *   *Move Down:* If you find a robust defense of **Attitudinal Hedonism** (e.g., Feldman) convincing. If pleasure is defined as "being pleased that p," the phenomenological heterogeneity of sensations becomes irrelevant; the attitude itself provides the common nature.
      *   *Move Up:* If you conclude that even attitudinal pleasure is heterogeneous (e.g., being pleased that a headache stops feels fundamentally different from being pleased that a proof is finished in a way that resists unification).
  *   **Why Prioritize:** If you cannot settle whether there is a common nature, you cannot assess whether the lack of one is damaging. This must be resolved in the first month.

  ### 2. The Measurement Question: Does Heterogeneity Threaten Scalar Comparability?
  **Priority:** Second (Downstream but Critical)
  **Reasoning:** This addresses your **second specific focus**. Even if we grant that pleasures are heterogeneous (Question 1), hedonism requires that they be *comparable* to be summed or maximized. This raises the measurement-theoretic difficulty you noted. If "pleasure" names a mongrel category, do we have a common unit of measurement?

  *   **Tractability:** Moderate. This requires conceptual clarity on measurement theory (ordinal vs. cardinal, unidimensional vs. multidimensional). It is tractable without empirical data, but it requires rigor to avoid conflating "difficulty in comparing" with "impossibility of comparison."
  *   **Evidence/Argument Shifters:**
      *   *Move Down:* If you can defend a **Dual-Component Theory** where intensity and duration are separable from quality. If intensity is a distinct dimension that applies uniformly across heterogeneous qualities (like loudness applies to different pitches), comparability is saved.
      *   *Move Up:* If you find that intensity is *constituted* by the quality (e.g., the "intensity" of intellectual satisfaction is not the same *kind* of magnitude as the "intensity" of sensory pleasure). This would suggest a category error in summation, similar to adding meters to seconds.
  *   **Why Prioritize:** This is the "killer" application of the heterogeneity problem. A hedonist can survive metaphysical heterogeneity (by saying "who cares what it feels like, it's all good"), but they cannot survive the inability to rank options for decision-making. This should be the core of your middle semester.

  ### 3. The Generality Question: Is This Distinctive to Hedonism or General to Monism?
  **Priority:** Third (Contextual/Defensive)
  **Reasoning:** This addresses your **first specific focus**. If this problem plagues all monistic axiologies, it may not be a fatal objection to hedonism *specifically*, but rather an argument against monism *generally*.

  *   **Tractability:** High. This is purely conceptual comparative axiology.
  *   **Analysis of Distinctiveness:**
      *   **Desire Satisfaction Theory (DST):** DST faces a parallel problem: desires have heterogeneous objects (water, justice, revenge). However, DST usually locates the good in the *formal relation* of satisfaction (world matches desire), not in a qualitative state of the agent. Therefore, the heterogeneity of the *objects* does not necessarily imply heterogeneity of the *good*.
      *   **Hedonism:** Hedonism locates the good in the *experience* itself. Therefore, if the experiences are heterogeneous, the *good itself* is heterogeneous.
      *   **Verdict:** The problem **relocates but does not dissolve**. It is more acute for hedonism. In DST, the heterogeneity is in the *means* or *objects*; in hedonism, the heterogeneity is in the *end* itself. If the end is fragmented, the theory of the good is fragmented.
  *   **Evidence/Argument Shifters:**
      *   *Move Down:* If you argue that DST implicitly relies on a hedonic glow (the feeling of satisfaction), collapsing it back into hedonism. Then the problem is identical.
      *   *Move Up:* If you argue that value monism *requires* a natural kind to function. If so, the problem is general, and your chapter could pivot to an argument against monism itself.
  *   **Why Prioritize:** This frames the significance of your conclusion. If the problem is unique to hedonism, you are refuting a specific theory. If it is general, you are challenging the structure of normative ethics. Do this in the final month to contextualize your findings.

  ---

  ### Assessment of Confidence and Uncertainty

  **Confidence Level:** High (0.8)
  I am confident in the logical ordering of these questions. The metaphysical status of pleasure (Q1) is undeniably upstream of the comparability issues (Q2), and the comparative analysis with other monisms (Q3) is properly a meta-evaluation of the objection's force. I am also confident in the assessment that the heterogeneity problem is more acute for hedonism than for formal desire-satisfaction theories, due to the location of the value (phenomenal state vs. formal relation).

  **Point of Least Certainty:**
  I am least sure about the **Measurement-Theoretic implications (in Question 2)**.
  *Reason for Uncertainty:* Philosophers often invoke "measurement theory" loosely. There is a rigorous debate in psychophysics and economics about whether inter-dimensional comparisons (e.g., comparing the magnitude of a taste to the magnitude of an intellectual triumph) are formally coherent. It is unclear whether the impossibility of *precise* measurement entails the impossibility of *ordinal* ranking, which is all some versions of hedonism might require. If hedonism only requires a weak order rather than a cardinal scale, the measurement objection loses significant force. Determining exactly what kind of scale hedonism *needs* to function is difficult and depends on whether the theory is meant to be decision-guiding or merely evaluative.

  ### Summary of Strategy
  1.  **Month 1:** Settle the Metaphysics. (Is there a common nature? If not, is it a determinable?)
  2.  **Month 2:** Attack the Comparability. (If no common nature, can we still measure/compare? Is this a category error?)
  3.  **Month 3:** Contextualize. (Is this unique to hedonism? Does it kill monism generally?)

  This order ensures you build the necessary premises before attempting the most complex argument (measurement), and saves the broadest philosophical implications for the conclusion.
