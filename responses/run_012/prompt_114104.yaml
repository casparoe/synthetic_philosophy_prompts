prompt: |-
  I'm a philosopher working on a dissertation chapter about the heterogeneity problem for hedonism — the worry that pleasures as different as the taste of a peach, the relief of a headache subsiding, and the satisfaction of finishing a proof share no common nature, so that "pleasure" names a mongrel category and hedonism cannot claim to have identified a single good. I have roughly one semester to devote to this and want to spend it on the open questions that most deserve attention. Which should I prioritize, and in what order? I care more about the reasoning than about the list: for each question, say whether it is upstream of the others, how tractable it is with conceptual and phenomenological tools rather than empirical psychology, and what evidence or argument would move it up or down the ranking. Two things I would especially like you to weigh in on. First, is the heterogeneity problem distinctive to hedonism, or is it just an instance of a general problem confronting any monistic axiology — desire-satisfaction theories appear to admit indefinitely heterogeneous objects of desire — and if the latter, does that dissolve the problem or merely relocate it? Second, does heterogeneity threaten not only a common nature but also the scalar comparability hedonism requires, namely comparing the pleasure of a peach with the pleasure of a finished proof, and does that raise measurement-theoretic difficulties of the kind that arise whenever heterogeneous goods must be placed on one scale? Please state how confident you are in your claims and single out the point you are least sure of.
