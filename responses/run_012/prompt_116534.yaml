answer: |-
  Here is the specification for a viable theory of desert, followed by the stress test you requested.

  ### Part 1: The Spec (Requirements for a Theory of Desert)

  To be taken seriously, a theory of desert must satisfy five constraints. Each is derived from a failure mode you identified.

  **1. The Control Requirement**
  *   **Definition:** An agent can only deserve outcomes based on factors within their voluntary control.
  *   **Why it's required:** Without this, desert collapses into luck. If you deserve the prize because you have a high IQ, but you didn't choose your IQ, you don't *morally* deserve the prize; you just benefited from a lottery. This handles your **lucky rival** (lab fire) and **innate traits** (persistence/genetics) cases. If luck determines the input, luck determines the output, and "desert" is just a label for "winner."

  **2. The Contribution Requirement**
  *   **Definition:** The basis of desert must be tied to actual input or effect, not just status.
  *   **Why it's required:** Without this, desert becomes aristocracy. This handles your **technician** case. If the discovery rests on her pipetting skill but the PI gets the credit, the theory must explain why the PI deserves the prize and she does not. If it cannot distinguish between *owning* the lab and *doing* the work, it is merely justifying hierarchy, not desert.

  **3. The Proportionality Requirement**
  *   **Definition:** The magnitude of the reward must scale with the magnitude of the deserving act/traits.
  *   **Why it's required:** Without this, desert is arbitrary. This handles your **grad student** case. Six years of grueling labor yielding null results vs. one week of luck yielding a breakthrough. If the theory says the grad student deserves *nothing* because there was no "result," it fails to account for effort. If it says she deserves *equal* credit, it fails to account for efficacy. A viable theory must quantify the debt.

  **4. The Independence Requirement (Pre-Institutional)**
  *   **Definition:** Desert claims must be intelligible prior to the rules of the institution distributing the reward.
  *   **Why it's required:** Without this, "desert" is just "entitlement." If you only deserve the grant because the NSF rules say so, you don't *morally* deserve it; you are just *eligible* for it. This handles your **institution** distinction. If desert depends entirely on the rules, then changing the rules changes who deserves what. A moral theory of desert requires that some claims are true *before* the committee meets.

  **5. The Fit Requirement**
  *   **Definition:** The type of reward must match the type of virtue/action.
  *   **Why it's required:** Without this, desert is incoherent. This handles your **reluctant awardee**. Can you deserve a medal you despise? If desert is objective, yes. If it is relational, no. A theory must state whether desert is a property of the agent (objective) or a relationship between agent and good (subjective).

  ---

  ### Part 2: The Collision

  You guessed correctly. The **Control Requirement** collides fatally with the **Constitution of the Agent**.

  **The Conflict:**
  To satisfy Control, you must deserve the effort you exerted. But as you noted from your biology background, effort (persistence, focus, resilience) is a phenotype. It is the product of genetics (luck) and environment/upbringing (luck). You did not choose your capacity to work hard for six years on a null result.
  *   If you didn't choose the capacity, you aren't ultimately responsible for the effort.
  *   If you aren't responsible for the effort, you don't deserve the rewards flowing from it (per Control).
  *   Therefore, you do not deserve the rewards.

  **Is this fatal?**
  Yes, for **Basic Desert**.
  If "Basic Desert" means a moral claim that exists prior to institutions and relies on ultimate responsibility, the theory cannot hold. It shrinks to zero. There is no "self" left to do the deserving once you strip away the luck of genes and environment. This is the "Hard Incompatibilist" position (shared by Strawson, Nagel, and implicitly Rawls).

  **What is left?**
  **Institutional Desert.**
  You can salvage a functional theory, but it changes the definition.
  *   **How it works:** We *agree* to pretend that effort counts, regardless of where it came from. We build institutions (universities, grant agencies) that define desert relative to their rules.
  *   **The Cost:** You lose the **Independence Requirement**. In this model, the grad student doesn't *morally* deserve the tenure; she satisfies the *criteria* for tenure. The technician doesn't *morally* deserve authorship; the lab's *convention* grants it.
  *   **The Result:** Desert becomes a tool for social engineering (incentivizing behavior) rather than a metaphysical truth about justice. It is forward-looking (what rewards produce good science?) rather than backward-looking (what reward is owed for past action?).

  ---

  ### Part 3: Meritocracy (Description vs. Goal)

  You are right to separate these. A theory of desert interacts with them differently.

  1.  **Meritocracy as Description:** "Rewards track merit."
      *   **Verdict:** Empirically false. As your lucky rival case shows, noise (luck) dominates the signal (merit) in complex systems. A theory of desert cannot fix this; only better measurement can.
  2.  **Meritocracy as Goal:** "Rewards *should* track merit."
      *   **Verdict:** If you mean **Basic Desert**, this goal is incoherent (because of the Control collision). You cannot structure society to reward "what people deserve" if no one deserves anything in the basic sense.
      *   **If you mean Institutional Desert:** The goal is coherent but changes meaning. It becomes: "We should design institutions where rewards track *measurable contribution* to incentivize future contribution."
      *   **Can desert underwrite this?** No. **Utility** underwrites this. You don't give the grant to the hard-working grad student because she *deserves* it in a cosmic sense; you give it to her because if you don't, no one will do the hard work next time. The justification shifts from Justice to Efficiency.

  ---

  ### Part 4: Audit of Your List

  You asked to flag items that might be camp habits rather than hard requirements.

  *   **The Grad Student (Effort vs. Result):** *Real Requirement.* Any theory must weigh input vs. output. If it ignores effort, it's purely consequentialist. If it ignores results, it's purely intentionalist. Both are incomplete.
  *   **The Lucky Rival (Luck):** *Real Requirement.* This is the core of the Control Requirement. Non-negotiable for moral desert.
  *   **Innate Traits (Genes/Upbringing):** *Real Requirement.* This is the source of the fatal collision. You cannot ignore this without denying biology.
  *   **The Technician (Contribution):** *Real Requirement.* Distinguishes desert from ownership.
  *   **The Reluctant Awardee (Subjective Fit):** *Camp Habit.* This is not a hard requirement for a general theory. Many theories argue desert is objective (you deserve the prison sentence even if you don't want it). Whether you can deserve a reward you reject is a specific sub-debate, not a structural pillar. You can drop this without collapsing the theory.
  *   **Independence (Pre-Institutional):** *The Fault Line.* This is the biggest filter.
      *   **Libertarians/Realists:** Will say this is a Real Requirement. If desert isn't pre-institutional, it's not desert.
      *   **Rawlsians/Constructivists:** Will say this is a Camp Habit. They argue pre-institutional desert is incoherent. They claim we should drop this requirement to save the rest of the theory.
      *   **My Advice:** If you keep this requirement, you must accept the "Fatal" verdict above. If you want a working theory, you must treat this as a habit and switch to Institutional Desert.

  ### Summary Verdict

  If you demand a theory where rewards track **moral merit** based on **ultimate responsibility**, the project is dead. The biology of the agent defeats the philosophy of the claim.

  If you want a theory that supports a **functional meritocracy**, you must abandon the idea that people "deserve" their rewards in a deep moral sense. You instead argue that allocating rewards *as if* they deserved them is the best way to run a scientific community. That is a pragmatic argument, not a moral one. It solves the grant distribution problem, but it does not satisfy the moral itch.
