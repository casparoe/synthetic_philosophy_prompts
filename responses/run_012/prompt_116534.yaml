prompt: |-
  Retired three years now, after 35 in a biology department. Since then I've been reading philosophy on my own, mostly a pleasure, exept for one thing that keeps stopping me up.

  In my old world everybody talked as if rewards track merit. The grant, the chair, the prize went to the person who deserved it, full stop. Fine. But the more I read -- Rawls, and then whatever the desert people are on about -- the less I can find a version of that sentence that survives contact with what I actually know about how people end up the way they are. So before I pick a side I want the spec first. Lay out what a theory of desert -- who deserves what, and on what basis -- has to be able to do before it's worth taking seriously.

  I want the requirement list, and for each item the case or consideration that makes it a requirement rather than a preference. Things I'd want it to handle, just to get you started:

  - the grad student who worked harder than anyone in the building for six years and got nothing out of it. Owed anything or not?
  - the guy whose big result landed in his lap because a rival's lab burned down the month before. Same paper, different luck.
  - the fact that the qualities we reward -- persistence, whatever you want to call it -- are partly handed to you at birth and shaped by a childhood nobody picked.
  - the technician who ran the one experiment that mattered and whose name never made the paper. Did she deserve the discovery? What exactly did she deserve?
  - a man who'd flatly refuse the award everyone agrees he deserves. Can you deserve something you don't want?

  And the distinctions I dont think a theory is allowed to just collapse: deserving something vs. being entitled to it; what you deserve for what you did vs. what you deserve for who you are; and whether desert can even get off the ground before there are institutions handing out the positions people are said to deserve, or whether it's prior to all that.

  Then the part I care most about. Tell me which of these requirements can't all hold at once. My guess is the control requirement -- you only deserve what was up to you -- collides head-on with what I know about where effort and character come from, and I want to know whether that collision is fatal or whether the theory just shrinks to almost nothing. If it's fatal, say so and say what's left. That's the result I'm after, not a tour of the answers. And flag any item on my list that isn't a real requirement at all but just a habit of one camp -- I'd rather not build the spec out of somebody's prejudice.

  One last thing. "Meritocracy" gets used two ways around me -- as a description of how things do work and as a goal for how they should work -- and I suspect those are doing different jobs. If a theory of desert is meant to underwrite the second use, add that to the list and tell me whether it can.

  Answer in American English, and skip the throat-clearing -- I've read enough of that already.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired biology professor (35 years experience), 3 years into retirement. Self-taught philosophy reader (Rawls, desert theory). Skeptical of academic norms ("In my old world everybody talked as if rewards track merit"). Pragmatic, direct, no-nonsense ("skip the throat-clearing").
      *   **Core Task:** Define the *requirements* for a viable theory of moral desert (who deserves what, and why). Identify which requirements are incompatible (specifically the "control requirement" vs. the origin of effort/character). Determine if the collision is fatal. Distinguish between "meritocracy as description" vs. "meritocracy as goal."
      *   **Tone:** American English, direct, analytical, respectful of expertise but critical of dogma. No fluff.
      *   **Specific Inputs:** The user provided a list of test cases (grad student, lucky rival, innate traits, technician, reluctant awardee) and distinctions (desert vs. entitlement, doing vs. being, institutional dependence).

  2.  **Deconstruct the "Spec" (Requirements for a Theory of Desert):**
      *   I need to formalize the user's intuitions into philosophical constraints.
      *   *Requirement 1: The Control Condition (Responsibility).* You can't deserve something based on luck. (Derived from the lucky rival & innate traits cases).
      *   *Requirement 2: The Proportionality Condition.* The reward must fit the contribution/effort. (Derived from the grad student & technician cases).
      *   *Requirement 3: The Independence Condition (Pre-institutional).* Desert must exist *before* the rules are made, otherwise it's just entitlement. (Derived from the "prior to institutions" point).
      *   *Requirement 4: The Subjective Fit Condition.* Can you deserve what you reject? (Derived from the reluctant awardee).
      *   *Requirement 5: The Distinction Condition.* Must distinguish Desert vs. Entitlement and Doing vs. Being.

  3.  **Evaluate the "Collision" (The Core Philosophical Problem):**
      *   The user suspects the Control Condition collides with the origin of effort/character (determinism/luck).
      *   *Analysis:* This is the "Ultimate Responsibility" problem (Galen Strawson, Nagel, Rawls). If my persistence comes from my genes/upbringing (luck), and I only deserve what's up to me, then I don't deserve the rewards for my persistence.
      *   *Is it fatal?* For a *strong* pre-institutional theory of desert, yes. If you demand ultimate responsibility, nothing survives.
      *   *What's left?* A weaker, institutional/conventional theory. Desert becomes relative to the rules of the game, not metaphysical truth.

  4.  **Address the "Meritocracy" Distinction:**
      *   *Descriptive:* "The best people get the jobs." (Empirically false often).
      *   *Normative:* "The best people *should* get the jobs."
      *   *Can desert underwrite the normative goal?* Only if we relax the Control Condition. If we can't, the normative goal collapses into "efficient allocation" rather than "justice."

  5.  **Filter the User's List (Real Requirements vs. Camp Habits):**
      *   *Grad student/Lucky rival/Innate traits:* These point to the Control Condition. Real requirement for *moral* desert.
      *   *Technician:* Points to Proportionality/Contribution. Real requirement.
      *   *Reluctant awardee:* This is tricky. Some theories say desert is objective (you deserve it even if you hate it). Others say it requires acceptance. I should flag this as potentially a "camp habit" (subjective vs. objective theories).
      *   *Pre-institutional:* This is the biggest fault line. Rawls says no pre-institutional desert. Libertarians say yes. I need to clarify that demanding this *kills* the theory for many philosophers.

  6.  **Drafting the Response (Iterative Process):**

      *   *Intro:* Acknowledge the background. Get straight to the spec.
      *   *Section 1: The Spec (Requirements).* List them clearly. Explain *why* each is required (the "case/consideration").
      *   *Section 2: The Collision.* Address the Control vs. Origin problem directly. Confirm the user's suspicion.
      *   *Section 3: Fatal or Shrinking?* It's fatal for *basic* desert. It leaves *institutional* desert.
      *   *Section 4: Meritocracy.* Distinguish description vs. norm. Can desert support the norm? Only in the weakened sense.
      *   *Section 5: Flagging User's List.* Identify which of their specific points are contested or camp-specific.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm teaching Philosophy 101. Talk to a peer. Use the biology analogy where helpful (e.g., phenotype vs. genotype). Ensure American English spelling/idioms. Keep it tight.

      *Refining the "Reluctant Awardee" point:* Is it a requirement? Not necessarily. Many argue you can deserve a punishment you don't want. So deserving a reward you don't want is logically consistent. I should flag this as *not* a hard requirement, but a specific intuition.

      *Refining the "Pre-institutional" point:* This is the Rawlsian critique. If desert depends on institutions, it's not "moral desert," it's "legitimate expectation." I need to make sure the user understands that if they insist on pre-institutional desert, they might be asking for something that doesn't exist.

      *Refining the "Meritocracy" point:* If desert collapses, meritocracy as a *moral* goal collapses. It becomes purely utilitarian (incentives).

  7.  **Final Polish:** Check against constraints.
      *   American English? Yes.
      *   No throat-clearing? Yes.
      *   Address all bullet points? Yes.
      *   Answer the "fatal or shrinking" question? Yes.

  8.  **Final Output Structure:**
      1.  The Spec (5 Requirements).
      2.  The Incompatibility (The Control vs. Constitution Collision).
      3.  The Verdict (Fatal for Basic Desert, Survival for Institutional).
      4.  Meritocracy (Description vs. Norm).
      5.  Audit of User's List (What's a requirement, what's a preference).

  *(Self-Correction on Tone)*: The user is a scientist. Use precise language. Avoid vague philosophical jargon where possible, or define it quickly. "Basic Desert" vs. "Institutional Desert" is necessary terminology though.

  *(Final check on the "Reluctant Awardee")*: The user asks "Can you deserve something you don't want?" This is a test case for the theory. I need to answer it in the context of the spec. I will classify it under the "Fit" requirement but note it's contested.

  *(Final check on "Technician")*: This is about contribution vs. credit. It's about the *basis* of desert.

