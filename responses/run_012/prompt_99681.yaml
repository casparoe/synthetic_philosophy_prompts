prompt: |-
  I am a software engineer on the clinical product team at a company that makes a mental-health self-assessment and triage app. A user answers a fixed questionnaire; our service assigns one of a small number of screening categories — for example, "likely depression," "likely anxiety," "elevated risk of self-harm" — and recommends a next step, ranging from self-guided material up to a human crisis line. The clinical lead signs off on the wording of each category and on the thresholds, but my team owns the questionnaire items, the scoring logic, the classifier, and the copy that explains a category to users and to the partner clinics that receive our referrals. I have no clinical or philosophical training, and neither does anyone else on the team.

  Two experiences have convinced me that we need a standing rule rather than case-by-case judgment. First, three years ago we introduced a mild category intended to catch distress earlier. Neither the items nor the thresholds have changed since, but the share of users who meet that category has roughly doubled, and the clinical lead believes the category itself may have taught a subset of users a new vocabulary for describing ordinary unhappiness, which they then report back to us. Second, our relapse-risk model sends a supportive check-in message to flagged users. A retrospective look suggests that flagged users' self-reported symptoms rise in the weeks after the message, and we cannot tell whether the message detects a trajectory that was already there or contributes to it. In both cases, the thing we measured appears to have moved because we measured it.

  I have read enough to recognize this as the family of problems Ian Hacking describes as looping effects: classifications of people, as opposed to classifications of minerals or electrons — "interactive" rather than "indifferent" kinds — can be taken up by the people classified, change how they understand and present themselves, change who shows up to be counted, and in some cases bring new ways of being into existence. The underlying view is sometimes called dynamic nominalism. I cannot pursue the literature myself and I do not want a reading list or a bibliography; I need operational content.

  Please write a decision procedure my team can actually run. Requirements:

  Trigger and budget. It runs whenever we propose adding, splitting, merging, retiring, or re-thresholding a category, or changing what a category's feedback says or does; and once per quarter as a standing review of categories already in production. It should cost one engineer about an hour plus a thirty-minute conversation with the clinical lead, who is the only person who can sign off, and it has to fit on two wiki pages.

  Form. An ordered list of questions, and for each one: what counts as a sufficient answer, what data we need to answer it, what to do with each possible answer, where the procedure stops with a decision not to ship, and where it hands the question to the clinical lead because it is a question of values rather than facts — including what we must tell them so that they can decide well.

  Conceptual content. Keep whatever in the looping-effects idea changes what an engineer should actually do, and drop whatever is of interest only to philosophers. In particular, at each step the procedure must distinguish among four possibilities and say how to tell them apart with data a small team can realistically obtain: (a) the category has changed the underlying condition; (b) it has changed only how people describe themselves to us, while the condition is unchanged; (c) it has changed who comes to us at all, so our user mix has shifted; (d) there is no loop, and we are seeing ordinary drift or an artifact of our own analysis. I expect these are not always separable in practice; where they are not, the procedure should say so rather than pretend otherwise.

  Two complications it must handle. First, loops that run through institutions rather than self-conception: if a category now carries something concrete — a referral, an accommodation letter, insurance coverage, admission to a support community — people's reports may shift because the label buys them something, and the loop will look different from one driven by self-understanding. Second, semantic drift: a label we publish can change meaning as users adopt it into ordinary speech, so an item that was valid when we wrote it may decay without our touching it. The procedure should also make clear that a loop is not automatically a defect — some feedback is the point, if it helps people get help — so it must not collapse into "any feedback, do not ship."

  Monitoring. Say what we must measure before release and after, over what window, and what we do if the loop appears: roll back, reword, keep but monitor, or something else, with an accountable person named for each branch. Assume we can run A/B tests for some changes but not for anything that withholds a crisis intervention, and that we have no ethics board and no ability to run long studies.

  Then run the procedure on three proposals:

  1. Adding "burnout" as its own category rather than routing those users into the depression screen.
  2. Lowering the threshold on the anxiety screen by one response level, which would flag roughly fifteen percent more users. Growth wants this; the clinical lead is unsure.
  3. Changing the relapse-risk check-in from a clinician-facing silent flag into a message shown directly to the user. My expectation is that this is the case where the procedure tells us something we will not want to hear, since the honest answer may be that we should either ship it only as a controlled experiment or not ship it at all, and both are expensive. If that is what the procedure implies, say so plainly and give me the least bad option.

  For each case, give the verdict, the reasoning step by step, and the point where the procedure stops or defers. Close with a short list of what the procedure cannot do, and the questions it will answer with false confidence. Write the deliverable as a checklist with decision points, in the plain language of a software team, not as an essay.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Software Engineer on a clinical product team (mental health self-assessment/triage app).
      *   **Context:** App assigns screening categories (depression, anxiety, self-harm risk) and recommends next steps. Team owns logic, scoring, copy. No clinical/philosophical training on the engineering team. Clinical Lead signs off on wording/thresholds.
      *   **Problem:** "Looping effects" (Ian Hacking). Classifications change the people classified (self-conception, behavior, reporting). Examples: New "mild" category doubled in prevalence (teaching vocabulary); Relapse check-in messages correlated with rising symptoms (unclear causality).
      *   **Goal:** A practical, operational decision procedure (checklist) to manage looping effects.
      *   **Constraints:**
          *   Cost: ~1 hour engineer + 30 min Clinical Lead per run.
          *   Frequency: On change (add/split/merge/retire/re-threshold/copy change) + Quarterly review.
          *   Format: Two wiki pages max. Ordered list of questions.
          *   Content: Distinguish 4 possibilities (changed condition, changed description, changed mix, no loop/drift). Handle institutional loops (benefits attached to labels) and semantic drift. Acknowledge loops aren't always bad.
          *   Monitoring: Pre/post metrics, windows, actions (rollback, reword, monitor), accountable persons. A/B testing limits (no withholding crisis care).
          *   Deliverable: Checklist with decision points, plain language.
          *   Application: Run on 3 specific proposals (Burnout category, Lower Anxiety Threshold, Relapse Message to User).
          *   Closing: Limitations of the procedure.

  2.  **Deconstruct the "Looping Effect" for Engineers:**

      *   *Philosophical Core:* Interactive kinds (people) vs. Indifferent kinds (rocks). Classifications change the classified.
      *   *Engineering Translation:* Did our code/change alter the input data distribution *because* of the output?
      *   *The 4 Possibilities:*
          1.  *Ontological Change:* The condition actually changed (rare, hard to prove).
          2.  *Reporting Change:* Users describe same feeling differently (Semantic drift/Vocabulary).
          3.  *Selection Change:* Different people show up (Incentives/Marketing).
          4.  *Noise/Drift:* Normal variance.
      *   *Institutional Loops:* Label = Resource (Insurance, Accommodation). This drives reporting changes regardless of self-conception.
      *   *Good vs. Bad Loops:* A loop that encourages help-seeking is good. A loop that creates dependency or iatrogenic harm is bad.

  3.  **Drafting the Procedure (The "Wiki Page"):**

      *   *Structure:*
          1.  Trigger & Prep.
          2.  The Checklist (Questions, Data, Decision).
          3.  Monitoring Plan.
          4.  Escalation to Clinical Lead.
      *   *Tone:* Direct, actionable, engineering-focused, acknowledging uncertainty.
      *   *Constraint Check:* Must fit on ~2 wiki pages. Needs to be runnable in 1.5 hours total.

      *   *Drafting Questions:*
          *   Q1: What is the incentive? (Institutional loop check).
          *   Q2: What is the vocabulary? (Semantic drift check).
          *   Q3: What is the baseline? (Drift check).
          *   Q4: What is the harm/benefit? (Value judgment).
      *   *Data Requirements:* Need historical trends, control groups (if possible), qualitative feedback.
      *   *Decision Logic:* If high risk of harmful loop -> Stop/Escalate. If beneficial loop -> Monitor. If ambiguous -> Experiment.

  4.  **Refining the 4 Possibilities (The Hard Part):**

      *   How to distinguish (a) Condition vs (b) Description vs (c) Mix vs (d) Drift with limited data?
      *   *Reality Check:* A small team *cannot* definitively separate (a) and (b) without external clinical data. The procedure must admit this.
      *   *Proxy:* Look at *downstream* behavior. If classification rises but help-seeking stays same -> Reporting change. If classification rises and help-seeking rises -> Maybe Condition or Successful Triage. If classification rises and *new* user segment appears -> Mix change.
      *   *Procedure Adjustment:* Instead of asking "Which one is it?", ask "What is the risk if it *is* a loop?" and "Can we detect the signal?"

  5.  **Developing the Monitoring Section:**

      *   Pre-release: Baseline metrics.
      *   Post-release: Cohort analysis.
      *   Windows: 2 weeks (immediate), 3 months (drift).
      *   Actions: Rollback (if harm), Reword (if semantic), Monitor (if benign/beneficial).
      *   Accountability: Eng owns metrics, Clinical Lead owns safety.

  6.  **Running the Procedure on the 3 Cases:**

      *   *Case 1: Burnout Category.*
          *   Risk: Semantic drift (Burnout is trendy), Institutional (Employer accommodations).
          *   Verdict: High risk of "Mix" and "Description" loops. Needs Clinical Lead sign-off on definition distinct from Depression.
      *   *Case 2: Lower Anxiety Threshold.*
          *   Risk: Growth vs. Clinical validity. "Mild category" precedent (doubling prevalence).
          *   Verdict: High risk of "Description" loop (teaching vocabulary). Requires A/B test (if safe) or strict monitoring. Clinical Lead must decide if over-triage is acceptable.
      *   *Case 3: Relapse Message to User.*
          *   Risk: Iatrogenic harm (message causes symptom rise).
          *   Verdict: High risk of harmful loop. Cannot A/B test withholding care.
          *   "Least Bad Option": Phased rollout with immediate stop-loss metrics. Acknowledge uncertainty.

  7.  **Review against Constraints:**

      *   *Time:* Is it 1 hour + 30 mins? Yes, if the checklist is focused.
      *   *Format:* Checklist style.
      *   *Philosophy:* Keep Hacking's utility, drop the ontology debate. Focus on *interaction*.
      *   *Limitations:* Must explicitly state what the procedure *can't* do (e.g., prove causality).

  8.  **Final Polish:**

      *   Ensure the distinction between "Interactive Kind" and "Indifferent Kind" is translated into "Does this label change user behavior?"
      *   Make sure the "Institutional Loop" is addressed (e.g., does this label get them time off work?).
      *   Ensure the "Good Loop" distinction is clear (help-seeking is good).
      *   Check the tone: Professional, cautious, not alarmist but rigorous.

      *(Self-Correction during drafting)*: I initially thought about asking engineers to prove causality. That's impossible. I need to change the question to "What is the *risk* of a loop and how do we mitigate it?" The procedure should force the team to *assume* a loop exists and plan for it, rather than trying to disprove it.
      *(Refinement on Case 3)*: The prompt expects the procedure to suggest not shipping or expensive experiments. I need to be honest there. If the retrospective data shows symptom rise, shipping broadly is risky. The "least bad option" is a constrained rollout with a kill switch.

  9.  **Finalizing the Output Structure:**
      *   Page 1: The Procedure (Triggers, Checklist, Decision Matrix).
      *   Page 2: Monitoring & Escalation.
      *   Section 3: Application to Cases.
      *   Section 4: Limitations.

      *Wait, the prompt asks for the deliverable as a checklist... then run the procedure on the three cases.* I will structure the response to first present the "Wiki Page" content, then the "Case Run-Through".

      *Let's tighten the "4 Possibilities" requirement.* The prompt specifically asks to distinguish among (a) condition changed, (b) description changed, (c) mix changed, (d) drift. I need to make sure the checklist explicitly addresses how to *attempt* this distinction, while admitting when it's impossible.
      *Strategy:* Use "Triangulation Questions."
      *   (c) Mix: Check demographics/traffic sources.
      *   (b) Description: Check item-level variance (did specific words change?).
      *   (a) Condition: Check downstream clinical outcomes (did they actually get worse/better?).
      *   (d) Drift: Check control groups or stable categories.

      *Okay, ready to write.*
answer: |-
  # Wiki Page 1: Interactive Category Decision Procedure

  **Owner:** Engineering Lead (Implementation), Clinical Lead (Sign-off)
  **Frequency:** Per change (add/split/merge/retire/threshold/copy) + Quarterly Review
  **Time Budget:** 1 hour Eng prep + 30 min Clinical Lead review

  ## 1. Trigger & Prep
  Run this procedure before merging code or copy changes affecting:
  *   Category definitions, thresholds, or scoring logic.
  *   User-facing labels (e.g., "Depression" vs. "Low Mood").
  *   Downstream actions (referrals, messages, accommodations).

  **Prep Data (Eng):**
  *   Current prevalence rate of affected category (last 90 days).
  *   Demographic breakdown of users currently hitting this category.
  *   Historical trend of similar categories (e.g., if adding "Burnout," look at "Depression" trends).

  ## 2. The Checklist
  *Answer each question. If you check [STOP], do not ship. Escalate to Clinical Lead.*

  ### Q1: The Incentive Check (Institutional Loop)
  **Question:** Does this label grant the user access to a concrete resource (insurance code, work accommodation, community entry, priority support)?
  *   **Data:** Product requirements doc; Partner clinic agreements.
  *   **If YES:** Users may report symptoms to *get* the label, not because symptoms changed.
      *   **Action:** Flag as **High Risk of Selection Loop (Type C)**.
      *   **Stop?** No, but requires Clinical Lead validation that resource allocation matches clinical need.
  *   **If NO:** Proceed to Q2.

  ### Q2: The Vocabulary Check (Semantic Drift)
  **Question:** Does this label use terms that are trending in public discourse (e.g., "Burnout," "Trauma," "Narcissist")?
  *   **Data:** Google Trends for term; Support ticket keyword analysis.
  *   **If YES:** Users may adopt the term to describe ordinary stress (**Reporting Loop Type B**).
      *   **Action:** Draft copy that explicitly distinguishes clinical definition from colloquial use.
      *   **Stop?** No, but requires monitoring of item-level responses (are they endorsing specific symptoms or just the label?).
  *   **If NO:** Proceed to Q3.

  ### Q3: The Baseline Check (Drift vs. Signal)
  **Question:** Is the expected change in prevalence larger than the natural variance of stable categories?
  *   **Data:** Compare projected % change against the standard deviation of a stable category (e.g., "Psychosis risk") over the last 4 quarters.
  *   **If Change > 2x Std Dev:** Likely not ordinary drift (**Type D**). Suspect Loop or Real Shift.
      *   **Action:** Proceed to Q4.
  *   **If Change < 2x Std Dev:** Likely ordinary drift.
      *   **Action:** Proceed to Monitoring Plan.

  ### Q4: The Causality Triangulation (Distinguishing A, B, C)
  *We cannot prove causality, but we can look for signatures.*
  **Question:** Which data signature matches our expectation?
  *   **Signature A (Condition Changed):** Prevalence rises, *and* downstream severity (e.g., clinic intake scores) rises.
      *   **Data:** Partner clinic feedback (lagged 30 days).
  *   **Signature B (Description Changed):** Prevalence rises, *but* downstream severity stays flat or drops.
      *   **Data:** Internal item variance (are users endorsing milder items more?).
  *   **Signature C (Mix Changed):** Prevalence rises, *and* user demographics/traffic sources shift significantly.
      *   **Data:** Acquisition channel reports.
  *   **If Unclear:** Assume **Signature B** (Reporting Change) as the conservative default.
      *   **Action:** Escalate to Clinical Lead. This is a value judgment on whether over-reporting is harmful.

  ### Q5: The Harm/Benefit Check (Value Judgment)
  **Question:** If this is a loop (users change behavior because of the label), is that change beneficial?
  *   **Example:** Label causes user to seek therapy = Beneficial Loop.
  *   **Example:** Label causes user to feel "broken" or dependent on app = Harmful Loop.
  *   **Data:** None. This is clinical ethics.
  *   **Decision:** **HAND OFF TO CLINICAL LEAD.**
      *   **Engineer Must Provide:** "We expect prevalence to shift by X%. We cannot distinguish if this is real distress or vocabulary adoption. If it is vocabulary adoption, is it safe to treat them as [Category]?"
      *   **Clinical Lead Decision:** Approve, Reject, or Require Experiment.

  ## 3. Monitoring Plan (Required for All Changes)
  *Define these before shipping.*

  | Metric | Window | Threshold for Action | Owner | Action |
  | :--- | :--- | :--- | :--- | :--- |
  | **Category Prevalence** | 2 weeks, 3 months | >20% deviation from projection | Eng Lead | Pause feature; Investigate drift. |
  | **Downstream Engagement** | 30 days | Drop in click-through on recommended resources | Product | Reword copy (Semantic drift suspected). |
  | **Self-Reported Symptoms** | 14 days post-flag | Increase in symptom score after intervention | Clinical Lead | **Rollback** if intervention is message-based (iatrogenic risk). |
  | **Support Tickets** | Ongoing | Spike in "confused by result" or "disagree with result" | Support Lead | Reword copy. |

  **Stop-Loss Rule:** If self-reported symptoms rise >10% in the 14 days following a user-facing intervention (message/flag), the intervention is automatically disabled pending Clinical Lead review.

  ***

  # Wiki Page 2: Procedure Run-Through (Three Proposals)

  ## Case 1: Adding "Burnout" as a standalone category
  **Proposal:** Split users currently routed to "Depression" into a new "Burnout" category with distinct copy.

  **Procedure Run:**
  1.  **Incentive Check:** **YES.** "Burnout" is frequently used for work accommodations.
      *   *Risk:* **Type C (Selection Loop).** Users may seek this label specifically for employer letters.
  2.  **Vocabulary Check:** **YES.** High public discourse volume.
      *   *Risk:* **Type B (Reporting Loop).** Users may conflate tiredness with clinical burnout.
  3.  **Baseline Check:** N/A (New category). Compare against Depression baseline.
  4.  **Triangulation:** We cannot distinguish if "Burnout" users are clinically distinct from "Depression" users without external validation.
  5.  **Harm/Benefit:** **HAND OFF TO CLINICAL LEAD.**
      *   *Engineer Note:* "Creating this category may incentivize users to frame work stress as medical distress to access accommodations. We cannot validate if 'Burnout' here matches ICD-11 definition."

  **Verdict:** **Do Not Ship as Proposed.**
  **Reasoning:** High risk of Institutional Loop (Type C). The label carries external value (accommodations) that decouples the self-report from the clinical condition.
  **Path Forward:** Clinical Lead must define strict criteria distinguishing Burnout from Depression/Adjustment Disorder. If the app cannot assess work-context specifically, the category is clinically unsafe. If approved, copy must explicitly state: *"This assessment is not a diagnosis and may not be accepted by employers for accommodation."*

  ## Case 2: Lowering Anxiety Threshold by One Response Level
  **Proposal:** Flag 15% more users as "Likely Anxiety." Driven by Growth team.

  **Procedure Run:**
  1.  **Incentive Check:** **NO.** No new resources attached.
  2.  **Vocabulary Check:** **NO.** "Anxiety" is stable, but the *threshold* changes the meaning.
  3.  **Baseline Check:** **YES.** 15% increase is >2x standard deviation of stable categories.
      *   *Risk:* Reminiscent of the "Mild Category" doubling incident (Type B Loop).
  4.  **Triangulation:** If prevalence rises but clinic referrals for anxiety do not rise, this is **Type B (Description Changed)**. We are teaching users to label normal stress as anxiety.
  5.  **Harm/Benefit:** **HAND OFF TO CLINICAL LEAD.**
      *   *Engineer Note:* "We are expanding the definition of Anxiety. This will likely increase self-identification. Is it clinically safer to over-triage (potential anxiety) or under-triage (missed anxiety)?"

  **Verdict:** **Ship Only with Monitoring (Conditional).**
  **Reasoning:** This is a value judgment on triage sensitivity. The loop (teaching vocabulary) is not inherently harmful if it leads to helpful coping, but it risks medicalizing normal emotion.
  **Path Forward:** Clinical Lead must sign off on the *risk of over-triage*. Engineering must implement the **Self-Reported Symptoms** monitoring. If users flagged by the *new* threshold show no improvement (or worsening) after 30 days compared to the *old* threshold cohort, revert the threshold. Growth goals cannot override clinical safety metrics.

  ## Case 3: Relapse-Risk Check-in (Silent Flag → User Message)
  **Proposal:** Show users a message: *"We noticed you might be struggling. Here are some tips."* Currently, this is a silent flag for clinicians.

  **Procedure Run:**
  1.  **Incentive Check:** **NO.**
  2.  **Vocabulary Check:** **NO.**
  3.  **Baseline Check:** **YES.** Retrospective data shows symptom rise after flagging.
  4.  **Triangulation:** Retrospective data shows **Signature A or Harmful Loop.** Symptoms rise post-message. We cannot tell if the message *causes* the rise (iatrogenic) or detects it. Given Hacking's framework, we must assume the classification *interacts* with the user.
  5.  **Harm/Benefit:** **HIGH RISK.**
      *   *Engineer Note:* "Retrospective data correlates this flag with rising symptoms. Making this visible adds an interactive layer. If the message causes distress (e.g., 'The app thinks I'm relapsing'), this is a harmful loop."

  **Verdict:** **Do Not Ship Broadly. (Least Bad Option: Constrained Experiment).**
  **Reasoning:** The procedure identifies a high probability of a harmful interactive loop. We cannot A/B test withholding crisis care, but we *can* test the *message format* vs. *no message* on non-critical users. However, since the retrospective data already shows a correlation with worsening symptoms, shipping broadly violates the Stop-Loss Rule pre-emptively.
  **Path Forward:**
  1.  **Do not ship** to the full high-risk cohort.
  2.  **Run a Micro-Trial:** Show the message to a small (5%) subset of *moderate* risk users (not high risk) where the stakes are lower.
  3.  **Measure:** 14-day symptom trajectory.
  4.  **Decision:** If the 5% cohort shows symptom increase > control, kill the feature permanently. If stable, expand slowly.
  5.  **Accountability:** Clinical Lead owns the decision to expose *any* users to potential iatrogenic messaging. Engineering owns the kill-switch implementation.

  ***

  # Limitations & False Confidence

  **What This Procedure Cannot Do:**
  1.  **Prove Causality:** It cannot definitively prove that *we* changed the user (Type A/B) vs. the user changed independently (Type D). It forces us to assume interaction where data is ambiguous.
  2.  **Resolve Ethical Conflicts:** It identifies where values are at stake (Q5) but does not solve them. The Clinical Lead must still make the call.
  3.  **Detect Long-Term Loops:** A 3-month monitoring window cannot capture identity changes that happen over years (e.g., a user adopting "I am an anxious person" as a permanent identity).

  **Where It Answers with False Confidence:**
  1.  **"Signature B" (Description Changed):** We assume flat downstream severity means "just vocabulary." It could also mean "our referrals are ineffective."
  2.  **"Institutional Loop" Detection:** We rely on knowing what partners do with our data. If a partner changes their policy on accommodations silently, we will misclassify an Institutional Loop as a Reporting Loop.
  3.  **Safety of "Beneficial Loops":** The procedure treats help-seeking loops as "safe." Excessive help-seeking (dependency on the app) is also a risk we do not measure well.

  **Final Rule:** If the data is ambiguous and the risk is harm (self-harm, iatrogenic symptom increase), the default decision is **Do Not Ship.** Ambiguity favors safety, not growth.
