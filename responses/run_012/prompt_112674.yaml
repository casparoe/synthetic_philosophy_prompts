  Was argueing with a friend about this last night and I want a second opinion, since I think he's half right and using the right half to prove too much.

  His move: common knowledge is just the two generals problem. Two armies on separate hills, they can only talk by messenger who might get caught on the way. A sends "attack at dawn," B replies "got it," A replies "got your got it," and so on forever — no finite number of messages ever gets them to the point where each knows the other knows that each knows... you get the picture. His conclusion: common knowledge is a philosophers fiction, it basically never holds between real people, and game theory is quietly cheating every time it explains a convention or a norm by saying everyone expects everyone to expect everyone to follow it.

  Can you audit the analogy for me? What maps onto what — the generals, the messenger, the attack, the acknowledgments, the getting caught — where the mapping breaks, what the story quietly assumes about the target that the target might not actually have, and which of the breaks matter for the conclusion he's trying to run. The thing bugging me is this: is the two-generals story even evidence that common knowledge is unattainable, or is it only about unreliable channels? Because the odds of the messenger getting caught look like something both generals already know before anyone sends anything — so hasn't he presupposed a big chunk of common knowledge in order to argue that common knowledge never happens?

  Two other things got thrown around and I dont know what to do with them.

  (a) My other friend says the whole regress picture is backwards — common knowledge isn't an infinite tower of "knows that knows that," it's a loop, more like two mirrors facing each other: E is common knowledge if everyone knows E and everyone knows that E is common knowledge. Same thing bitting its own tail instead of climbing forever. Is that an actual fix or does it just rename the problem?

  (b) My own half-baked thought: maybe the frame is wrong because common knowledge isn't a state you have, it's something you keep doing — a fire you have to feed. Crowds watching the same thing at the same time, everyone chanting the same slogan, public ceremonies — maybe those are technologies for topping up common knowledge, which would explain why they exist and why they feel so powerful even when they add no new information at all. If that's the better analogy, what does it buy me and what does it lose?

  I can't look anything up right now, so dont send me to sources or tell me what famous people said — I just want the analysis. And at the end, say how confident you are in your main claims and single out the one point you're least sure about.
