prompt: |-
  I run the renewal desk at a small foundation that makes multi-year research grants, so about fifteen times a quarter I have to decide whether to keep funding something or kill it, and the money for a renewal comes out of someone else's budget. We keep having the same fight and I'm sick of it: I say the money's already gone, it's sunk, decide on the margin, and someone else says we can't quit now, we've got two years into this. I know the second person is supposed to be committing the sunk cost fallacy, but some of our cases don't feel like that to me and I can't articulate why.

  Can you write me a procedure my team can actually run, in order, on a renewal? I want the questions, what counts as a real answer to each, where it just stops with a no, and where it hands the decision to a person because it's a values call, not a fact. It needs to handle at least these: the case where how much we've already spent is genuinely evidence the project is good (we funded it for reasons, we're not idiots); the case where the payoff is all-or-nothing, so a half-built instrument or a cohort study stopped at year four is worth roughly nothing while finishing is worth a lot, and where "we've come this far" is doing real work; the case where "we've come this far" is really the original program officer protecting her own past judgment; and the case where committing in advance to finish is the only way to stop ourselves re-litigating at every review. Also be honest about which steps are arithmetic and which are judgment in a lab coat.

  Then run it on three grants: one where the science is still fine but the lead postdoc left and the original question has drifted; one where it's a five-year cohort study in year four and only the final year makes the dataset usable; and one where we've spent about 80% of the budget for 20% of the results and everyone involved is personally invested. My director signs off but only reads page one, so tell me what to put there. And tell me if one of these comes out kill, because I suspect I wont like the answer.
reasoning: |-
  Here's a thinking process that leads to the suggested renewal procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Runs renewal desk at a small foundation (multi-year research grants).
      *   **Frequency:** ~15 renewals/quarter.
      *   **Conflict:** User argues "sunk cost/marginal decision" vs. Colleagues argue "can't quit now (2 years in)."
      *   **Core Problem:** The standard "sunk cost fallacy" advice feels too blunt. Some cases *do* warrant continuing based on past investment (e.g., threshold effects, signaling quality), while others are just ego protection.
      *   **Deliverable 1:** A step-by-step procedure for the team to run on a renewal.
          *   Must include specific questions.
          *   Must define what counts as a "real answer."
          *   Must identify stop points (automatic "no").
          *   Must identify hand-off points (values calls vs. facts).
          *   Must distinguish arithmetic (math) from judgment (lab coat).
          *   Must address specific edge cases:
              *   Past spend as evidence of quality.
              *   All-or-nothing payoff (threshold effects).
              *   Program Officer (PO) ego/protection.
              *   Pre-commitment to avoid re-litigation.
      *   **Deliverable 2:** Run the procedure on three specific grant scenarios.
          *   Grant A: Science fine, lead postdoc left, question drifted.
          *   Grant B: 5-year cohort, year 4, only final year makes data usable.
          *   Grant C: 80% budget spent, 20% results, high personal investment.
      *   **Deliverable 3:** Director's One-Pager (what goes on page one).
      *   **Deliverable 4:** Honesty check (identify if a "kill" decision emerges that might be unpopular).

  2.  **Develop the Procedure (The "Renewal Algorithm"):**

      *   *Goal:* Move beyond "Sunk Cost vs. Marginal Utility" to a nuanced framework that acknowledges *why* past costs might matter (signaling, thresholds) without falling for the fallacy.
      *   *Structure:* Needs to be linear, filtering out easy "nos" first, then handling the complex judgment calls.
      *   *Step 1: The Kill Switch (Compliance/Feasibility).* If the money is gone or the work is impossible, stop. No debate.
      *   *Step 2: The Threshold Test (All-or-Nothing).* This addresses the "half-built instrument" concern. Is there a completion bonus?
      *   *Step 3: The Signal Test (Past Spend as Evidence).* This addresses "we're not idiots." Did the spend buy information or just burn cash?
      *   *Step 4: The Marginal ROI (The Econ 101 Step).* If we pass the above, is the *next* dollar worth it compared to alternatives?
      *   *Step 5: The Ego/Commitment Check.* Separating PO protection from strategic pre-commitment.
      *   *Step 6: The Values Hand-off.* If the math is ambiguous, who decides?

      *   *Refining the "Sunk Cost" nuance:* The key distinction is between *sunk cost as a psychological trap* vs. *sunk cost as data*. If spending \$1M proved the method works, that's data. If spending \$1M just makes us feel bad about wasting it, that's the fallacy. The procedure needs to explicitize this.

  3.  **Drafting the Steps (Iterative refinement):**

      *   *Step 1 (Viability):* Can they physically do the work? (Arithmetic/Fact).
      *   *Step 2 (Thresholds):* Is value non-linear? (Judgment + Math).
      *   *Step 3 (Information Value):* Did the past spend reduce uncertainty? (Judgment).
      *   *Step 4 (Opportunity Cost):* What else could we fund? (Arithmetic/Comparison).
      *   *Step 5 (Governance):* Pre-commitment vs. Ego. (Values).

  4.  **Running the Scenarios:**

      *   *Grant A (Drift/Postdoc left):*
          *   Viability: Maybe.
          *   Threshold: Unlikely.
          *   Signal: Past spend bought the *old* question, not the new one.
          *   Decision: Likely Kill or Restructure. The "ask" has changed.
      *   *Grant B (Cohort Study Year 4/5):*
          *   Viability: Yes.
          *   Threshold: High. Year 5 is the key.
          *   Signal: Past 4 years prove the cohort is stable.
          *   Decision: Fund. This is the valid "sunk cost" case (investment in completion).
      *   *Grant C (80% spend, 20% results, ego invested):*
          *   Viability: Yes.
          *   Threshold: Low/Unclear.
          *   Signal: Past spend indicates *difficulty*, not necessarily quality.
          *   Decision: Likely Kill. This is the classic fallacy trap.

  5.  **Drafting the Director's One-Pager:**

      *   Directors want: Recommendation, Cost, Risk, Strategic Alignment.
      *   Needs to be blunt. "Fund/Kill," "Why," "What happens if we don't."

  6.  **Addressing the "Honesty Check":**

      *   The user suspects they won't like the answer on one. Grant C is the obvious candidate for a "Kill" that will cause political pain. I need to highlight that explicitly.

  7.  **Review against Constraints:**

      *   *Tone:* Professional, direct, slightly cynical but constructive (matching the user's "sick of it" vibe).
      *   *Format:* Procedure first, then Scenarios, then One-Pager.
      *   *Specifics:* Ensure the distinction between "Arithmetic" and "Judgment in a Lab Coat" is clear.

  8.  **Final Polish (Self-Correction during drafting):**

      *   *Correction:* Make sure I don't just say "ignore sunk costs." I need to explain *when* sunk costs are relevant data (e.g., proving feasibility).
      *   *Correction:* Ensure the "Pre-commitment" aspect is handled. If we decide to fund multi-year, we need a mechanism to stick to it unless a Kill Switch is triggered.
      *   *Refinement:* The "Values Call" needs to be explicit. If the ROI is equal, who breaks the tie? The Program Officer or the Renewal Desk? Let's make it the Renewal Desk for consistency, but flagged for Director if it's strategic.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is a renewal procedure designed to separate the arithmetic from the ego, followed by the application to your three cases and the Director's One-Pager.

  ### The Renewal Protocol (v1.0)

  This procedure treats the renewal not as a continuation, but as a **new purchase option** on a partially completed asset. It forces the team to articulate *why* the past spend matters, rather than assuming it does.

  **Key:**
  *   **[ARITHMETIC]:** Requires numbers, dates, or binary facts. No debate allowed.
  *   **[JUDGMENT]:** Requires interpretation. Requires two sign-offs.
  *   **[VALUES]:** Requires strategic alignment. Escalates to Director if disputed.

  ---

  #### Step 1: The Viability Kill Switch [ARITHMETIC]
  **Question:** Can the grantee physically complete the proposed renewal scope with the requested funds within the timeline, given current staffing and constraints?
  *   **Real Answer:** "Yes, here is the Gantt chart and budget," or "No, the lead PI has retired/left."
  *   **Stop Point:** If **No**, the renewal is **KILLED**.
  *   **Why:** You cannot fund a ghost. This removes the "we've come this far" argument when there is no driver left in the car.

  #### Step 2: The Threshold Test [JUDGMENT]
  **Question:** Is the value of the output non-linear? Specifically, is the completed project significantly more valuable than the sum of the years funded so far?
  *   **Real Answer:** "Yes, because a cohort study requires year 5 for statistical power; years 1-4 are noise without it," OR "No, each year produces publishable papers independently."
  *   **Stop Point:** If **No** (value is linear) AND the marginal ROI (Step 4) is low, lean toward **KILL**.
  *   **Why:** This validates the "all-or-nothing" argument. If the asset is worthless until finished, past investment *is* relevant because it purchased a 80% complete machine, not just burned cash.

  #### Step 3: The Signal Test (The "We're Not Idiots" Check) [JUDGMENT]
  **Question:** Did the money already spent reduce uncertainty about the *future* success, or did it merely pay for effort?
  *   **Real Answer:** "Yes, the pilot phase proved the methodology works, reducing risk for the scale-up," OR "No, the money was spent on salaries while the methodology remains unproven."
  *   **Stop Point:** If **No**, the "sunk cost" argument is invalid. The past spend is noise, not signal.
  *   **Why:** This distinguishes between *investment* (buying information/feasibility) and *expenditure* (burning budget).

  #### Step 4: The Marginal ROI [ARITHMETIC + JUDGMENT]
  **Question:** If we treat the requested renewal amount as a *new* grant, does it rank in the top 50% of our current funding opportunities?
  *   **Real Answer:** Compare the renewal request against the queue of new applications.
  *   **Stop Point:** If the renewal ranks in the bottom 50% **AND** Step 2 (Threshold) was "No," the renewal is **KILLED**.
  *   **Why:** This is the core economic argument. Money is fungible. If a new grant buys more science per dollar than finishing an old one, you switch, unless the Threshold Test overrides it.

  #### Step 5: The Commitment vs. Ego Check [VALUES]
  **Question:** Is the pressure to renew driven by a pre-existing multi-year commitment strategy, or by the original Program Officer's reputation?
  *   **Real Answer:** "We have a written policy of 5-year commitments barring Step 1 failures," OR "The PO is worried their initial selection will look bad."
  *   **Hand-off:** If the answer is "PO Reputation," the PO is recused from the vote. If the answer is "Pre-commitment Strategy," proceed to Fund (unless Step 1 triggered).
  *   **Why:** You need to honor strategic pre-commitment (to attract good applicants) without honoring individual ego.

  #### Step 6: Final Decision Logic
  1.  If Step 1 = No → **KILL**.
  2.  If Step 2 = Yes (Threshold) → **FUND** (unless Step 1 failed).
  3.  If Step 2 = No AND Step 4 = Low ROI → **KILL**.
  4.  If Step 4 = High ROI → **FUND**.
  5.  If Ambiguous → **VALUES HAND-OFF** to Director.

  ---

  ### Running the Protocol on Your Three Grants

  #### Grant 1: The Drift (Postdoc left, question drifted)
  *   **Step 1 (Viability):** **FAIL.** The lead postdoc is gone. The original scope cannot be completed as designed. The "question has drifted" means the scope has changed.
  *   **Step 3 (Signal):** Past spend bought work on the *old* question. It signals nothing about the *new* question.
  *   **Step 5 (Ego):** PO likely wants to protect the original thesis.
  *   **Decision:** **KILL (or Restructure).**
  *   **Reasoning:** You are not funding the grant you signed; you are being asked to fund a new grant under an old name. Treat it as a new application. If it doesn't win on fresh merit, it dies.
  *   **Hard Truth:** The science being "fine" doesn't matter if it's not the science you bought.

  #### Grant 2: The Cohort (Year 4 of 5, all-or-nothing)
  *   **Step 1 (Viability):** **PASS.** Team is intact.
  *   **Step 2 (Threshold):** **YES.** A cohort study stopped at year 4 is scientifically worthless. Year 5 creates the asset.
  *   **Step 3 (Signal):** **YES.** Four years of data collection proves the cohort is stable and the method works. The risk is lower now than at Year 1.
  *   **Step 4 (Marginal ROI):** Might look low in isolation (expensive year), but...
  *   **Decision:** **FUND.**
  *   **Reasoning:** This is the valid exception to the sunk cost fallacy. The past cost purchased a *near-complete asset*. Abandoning it renders the previous 80% spend to zero value. The marginal dollar unlocks the total value.

  #### Grant 3: The Money Pit (80% budget, 20% results, high investment)
  *   **Step 1 (Viability):** **PASS.** They can physically spend the money.
  *   **Step 2 (Threshold):** **NO.** There is no indication that the final 20% of the budget unlocks 100% of the value. Results are linear and poor.
  *   **Step 3 (Signal):** **NO.** The spend indicates difficulty, not feasibility. It signals high risk, not reduced uncertainty.
  *   **Step 4 (Marginal ROI):** **LOW.** 20% results for 80% budget is a terrible ROI. New grants would likely outperform.
  *   **Step 5 (Ego):** **HIGH.** "Everyone personally invested" is a red flag for the Sunk Cost Fallacy.
  *   **Decision:** **KILL.**
  *   **Reasoning:** This is the textbook fallacy. The money is gone. The results are poor. Throwing good money after bad to soothe the team's feelings is not a strategy.

  ---

  ### The Director's One-Pager

  Your director only reads page one. This page must strip away the narrative and leave only the decision architecture. Do not write paragraphs. Use boxes.

  **RENEWAL DECISION MEMO**

  | Grant ID | [Insert ID] | Program Officer | [Name] |
  | :--- | :--- | :--- | :--- |
  | **Recommendation** | **[ FUND / KILL ]** | **Renewal Amount** | **$[Amount]** |
  | **Remaining Total** | $[Amount] | **Decision Type** | [Arithmetic / Values] |

  **1. THE VIABILITY CHECK (Step 1)**
  *   [ ] **PASS:** Team and scope intact.
  *   [ ] **FAIL:** Key personnel lost or scope drifted. *(If checked, Recommendation must be KILL)*

  **2. THE THRESHOLD CHECK (Step 2)**
  *   [ ] **NON-LINEAR VALUE:** Stopping now wastes prior investment (e.g., Cohort completion).
  *   [ ] **LINEAR VALUE:** Each year stands alone; no penalty for stopping.

  **3. THE MARGINAL COMPARISON (Step 4)**
  *   [ ] **OUTPERFORMS QUEUE:** This renewal beats current new applications.
  *   [ ] **UNDERPERFORMS QUEUE:** New applications offer better ROI.

  **4. EXECUTIVE SUMMARY (3 Sentences Max)**
  *   *Sentence 1 (The Status):* We are at Year X of Y. Spend to date is $Z.
  *   *Sentence 2 (The Pivot):* [If Fund] The final year unlocks the dataset / [If Kill] The marginal dollar yields lower returns than new opportunities.
  *   *Sentence 3 (The Risk):* Killing this grant risks [Relationship/Reputation] vs. Funding risks [Opportunity Cost].

  **5. REQUIRED SIGNATURES**
  *   Renewal Desk Lead: _______________
  *   Program Officer (if Fund): _______________
  *   Director (if Values Call): _______________

  ---

  ### The Honesty Check

  You asked me to tell you if one of these comes out **KILL**, because you suspect you won't like the answer.

  **Grant 3 (The Money Pit) is the Kill.**

  Here is why you won't like it:
  1.  **Relationship Damage:** The researchers are "personally invested." They will feel betrayed. They will tell their peers your foundation is capricious.
  2.  **Internal Politics:** The Program Officer who championed this grant has their reputation tied to it. Killing it admits *their* initial judgment was flawed. They will fight you on Step 3 (Signal), arguing that "breakthroughs take time."
  3.  **The "Almost" Trap:** 80% spent feels like "almost there." But in research, 80% spent for 20% results often means the hypothesis was wrong, not that they are slow.

  **How to survive the fallout:**
  Use the **One-Pager**. When the PO argues, point to Step 3 (Signal). Ask them to write down, in the "Real Answer" box, exactly what uncertainty the past $X million removed. If they write "They worked hard," that is not a signal. That is effort. You fund results, not effort.

  If you fund Grant 3, you are not funding science; you are funding the PO's ego and the researchers' sunk costs. You know this. That's why you're sick of the fight. Use the protocol to make the fight about the *box they checked*, not about your intuition.
