answer: |-
  This is a crisp, hard-nosed position. You have independently reconstructed the **Strong Revealed Preference Theory (RPT)** championed by Paul Samuelson in the 1930s and hardened by later Chicago School economists. It is the view that economics should be behaviorist: no mental states, no "utility" as a psychic substance, just choices observed under constraints.

  It is a powerful view because it is parsimonious. It stops economists from playing amateur psychologist. But you asked to have it knocked down, and you asked for arguments sorted by decisiveness.

  Here is the case against your view, ranked from "fatal logical flaw" to "empirical mismatch," followed by an assessment of your specific worries and my verdict.

  ---

  ### Level 1: The Falsifiability Trap (The Logical Defeater)
  **Decisiveness: Fatal**

  You hit the nail on the head in your "big one" paragraph. If "utility" is *defined* as "that which is chosen," then the statement "agents maximize utility" is a tautology. It means "agents choose what they choose."

  *   **The Problem:** A tautology cannot explain anything. Science requires the possibility of being wrong. If a person burns their hand on a stove, RPT says "they must have preferred burning their hand to not burning it." If they do it again, RPT says "they still prefer it." The theory absorbs all data without risk.
  *   **The Escape Hatch:** To make the theory useful, economists impose **consistency axioms** (like the Weak Axiom of Revealed Preference). They say: "If you choose A over B today, you shouldn't choose B over A tomorrow when both are available."
  *   **The Knockdown:** The moment you impose consistency axioms, you have admitted there is a standard *outside* the specific choice. You are no longer saying "choice defines preference." You are saying "preference is a stable ranking that *generates* choices, and if choices violate stability, the agent is irrational."
  *   **Why this moves you:** You cannot have it both ways. Either utility is just the choice (tautology, unfalsifiable, useless for prediction) or utility is a latent state that constrains choices (falsifiable, but requires admitting mental states exist). Economists want the predictive power of the latter while claiming the methodological purity of the former. They can't keep both.

  ### Level 2: The Separation of 'Wanting' and 'Liking' (The Neuroscientific Defeater)
  **Decisiveness: High**

  You mentioned your brother ordering food that makes him sick. Your view says he "wants" it. But modern neuroeconomics suggests "wanting" (choice/impulse) and "liking" (hedonic experience) are distinct neural systems.

  *   **The Evidence:** Kent Berridge's research on incentive salience shows that dopamine drives "wanting" (motivation to choose), while opioid systems drive "liking" (pleasure). You can activate dopamine pathways to make a rat compulsively press a lever for food even if the food tastes neutral or bad, or if the rat is full.
  *   **The Knockdown:** In addiction (your slots example), the "choice" mechanism is hijacked. The person chooses the drug (high dopamine/wanting) but reports zero pleasure (low opioid/liking) and often expresses a higher-order desire to stop.
  *   **Why this moves you:** If you define "want" as "choose," you are collapsing two distinct biological systems into one word. This renders your vocabulary useless for explaining why the brother keeps eating the food *despite* being sick. A better theory distinguishes the impulse to choose from the experience of welfare.

  ### Level 3: Framing and Menu Dependence (Your Worry 'a')
  **Decisiveness: High**

  You asked if menu dependence is a real defeater. It is. It violates the **Independence of Irrelevant Alternatives (IIA)**.

  *   **The Evidence:** The "Decoy Effect." If you offer a printer for \$100 (A) and \$200 (B), people pick A. If you add a decoy (C) that is \$190 but worse than B, people suddenly switch to B. The *value* of B didn't change, only the menu did.
  *   **The Knockdown:** To save your view, you must say the "object of choice" isn't the printer, it's "the printer in the context of this specific menu." If you make the description of the choice thick enough to include the frame, the context, the mood, and the history, you save the theory but kill its utility.
  *   **Why this moves you:** If every choice is unique because the context is unique, you cannot generalize. You cannot build a science of choice if every data point is *sui generis*. At some point, saying "the frame is part of the good" is just an ad hoc rescue device to prevent falsification.

  ### Level 4: Adaptive Preferences (Your Worry 'b')
  **Decisiveness: Medium-High (for Welfare Economics)**

  This is Amartya Sen's primary critique. If a person is oppressed or abused for long enough, they may adapt their desires to fit their possibilities.

  *   **The Evidence:** Studies of oppressed populations (e.g., women in patriarchal societies, long-term prisoners) often show they report satisfaction with their lot or choose options that reinforce their oppression.
  *   **The Knockdown:** If your view is just about *predicting behavior*, this doesn't matter. But you asked about "what's good for people." If utility = choice, then the satisfied slave is maximizing utility. If you want to say the slave is *worse off* than a free person, you must appeal to a standard of well-being independent of their current choices (e.g., capabilities, freedom, objective health).
  *   **Why this moves you:** It severs the link between economics and ethics. Most people use "utility" as a proxy for "good." If you admit it's just "choice," you lose the ability to critique policy that restricts freedom but satisfies adapted desires.

  ### Level 5: Non-Choosers (Your Worry 'd')
  **Decisiveness: Medium**

  *   **The Problem:** Infants, animals, the comatose, future generations.
  *   **The Knockdown:** We make welfare claims about these entities all the time ("malnutrition is bad for the infant"). If "bad" means "would not be chosen," and the infant cannot choose, the statement is meaningless on your view.
  *   **Why this moves you:** You are forced to say "it is bad for the infant" means "I would choose differently for them." This collapses into your worry (c): you are sneaking in your own standard of what is good. You cannot ground the infant's well-being in the infant's agency if they have none.

  ---

  ### Addressing Your Specific Worries

  **(a) Menu Dependence:**
  *   **Verdict:** **Real Defeater.** It forces you to make the "object of choice" infinitely complex. If the choice depends on the menu, then the ranking is not over *outcomes*, but over *decision problems*. This breaks the standard mathematical formulation of utility theory.

  **(b) The Addict / Oppressed:**
  *   **Verdict:** **Real Defeater for Welfare, Not Prediction.** If your goal is to predict what the addict buys tomorrow, your view works fine. If your goal is to say whether the addict is *flourishing*, your view fails. You cannot distinguish between "satisfied preference" and "manipulated preference."

  **(c) Idealized Choice ("Informed/Rational"):**
  *   **Verdict:** **Yes, it surrenders the view.** As soon as you say "what they *would* choose if...", you have posited a "True Preference" that exists independently of actual choice. You have admitted there is a fact of the matter about their good that is not identical to their behavior. You have abandoned Revealed Preference for Idealized Advisor Theory.

  **(d) Non-Choosers:**
  *   **Verdict:** **Real Defeater for General Theory.** It limits your view to "competent adults in market settings." It cannot be a general theory of value or well-being.

  ---

  ### What Would a Proponent Admit?

  A sophisticated defender of Revealed Preference (like Gary Becker or a modern "As-If" instrumentalist) would admit the following:

  1.  **It is not Ontology:** They would admit they don't *actually* believe humans have no internal states. They treat RPT as a **methodological tool**, not a truth claim. They say: "Act *as if* they maximize utility, because it generates good predictions." (Milton Friedman's *The Methodology of Positive Economics*).
  2.  **It Fails at the Margins:** They would admit RPT works well for large market aggregates (demand curves) but fails for individual, one-off, high-stakes, or novel decisions where framing dominates.
  3.  **The "Thick Description" Retreat:** They would admit that to handle framing effects, they have to define the "commodity" very broadly (including the context). They would concede this reduces the theory's predictive power but argue it's the only way to maintain consistency.
  4.  **Welfare is Separate:** Many modern RPT proponents quietly admit that "Choice" $\neq$ "Well-being." They use RPT for *positive* economics (what will happen) but switch to other metrics for *normative* economics (what should happen).

  **Where the view runs out:** The view becomes unfalsifiable when the proponent refuses to specify *what counts as the same choice* across different contexts. If every change in frame creates a "new good," the theory explains everything and nothing. The line is drawn at **prediction**. If you cannot predict the choice in a *new* frame based on choices in an *old* frame, the theory has failed.

  ---

  ### My Verdict

  **Is it well insulated?**
  No. It is insulated against *psychological* critique (by denying psychology exists), but it is vulnerable to *logical* and *predictive* critique.

  **Is that a bug?**
  It is a bug if you claim this is a theory of **human nature** or **well-being**. It is a feature if you claim this is a **model for market demand**.

  **Where I come out:**
  Your view is **methodologically useful but ontologically false.**

  1.  **Ontologically False:** We know from psychology and neuroscience that choices are noisy, context-dependent, and often diverge from experienced welfare. "Utility" as happiness/wellbeing is a real phenomenon distinct from "Utility" as choice ranking. Collapsing them erases the phenomenon of regret, addiction, and adaptive preference.
  2.  **Methodologically Useful:** In many market contexts, treating choices *as if* they reveal stable preferences works well enough to build bridges, set prices, and model supply chains.

  **The Knockdown Summary:**
  You should give up the claim that "what someone wants just is what they choose."
  Instead, adopt this: **"What someone chooses is the best *observable proxy* we have for what they want, but it is a noisy proxy that systematically deviates due to framing, biology, and constraint."**

  This allows you to keep the data (choices) without making the category error (equating choice with welfare). It allows you to say your brother *chooses* the sickening food, but *wants* (in the welfare sense) to be healthy, and the tragedy is the gap between the two. Your current view deletes the tragedy; it just sees a transaction.
