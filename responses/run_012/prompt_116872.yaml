      *   Philosophically, this touches on *Desire Satisfaction Theory* of well-being vs. *Objective List* or *Hedonistic* theories.
      *   The specific claim "Utility isn't a feeling... it's just the ranking" is the *Ordinalist* revolution in economics (Pareto, Hicks, Samuelson).

  3.  **Brainstorm Counter-Arguments (The "Knock Down"):**

      *   *Argument 1: Inconsistency over time (Dynamic Inconsistency).* If I choose A over B today, but B over A tomorrow with no new info, RPT says my preference changed. But if I *regret* the first choice, it suggests a conflict between "impulse" and "plan." RPT struggles to distinguish weakness of will from preference change without smuggling in mental states.
      *   *Argument 2: Framing Effects/Context.* (User's point (a)). If I choose A in menu {A,B} but B in menu {A,B,C}, RPT says the "object of choice" includes the menu. But if we make the object of choice *too* thick (including frame, mood, history), the theory becomes vacuous (unfalsifiable).
      *   *Argument 3: Well-being vs. Choice.* (User's point (b)). If a slave prefers slavery because they can't imagine freedom (adaptive preferences), RPT says they are maximizing utility. But intuitively, they are worse off. This severs the link between economics and welfare policy.
      *   *Argument 4: Prediction Failure.* If utility is *defined* by choice, "people maximize utility" is true by definition. But economists use it to *predict* choices. If predictions fail (e.g., endowment effect, loss aversion), the theory is in trouble. You can't just say "oh, they valued keeping it more" after the fact.
      *   *Argument 5: Neuroeconomics/Psychology.* We can now measure dopamine, activation in reward centers. Sometimes choices diverge from neural reward signals (e.g., compulsion). This suggests "wanting" (choice) and "liking" (hedonic experience) are distinct neural systems.

