      *   *Decisive Argument 1: The Tautology Trap (Falsifiability).* If *every* choice defines utility, you can't predict anything. You can only describe the past. Science requires prediction. If you add constraints (consistency) to make it predictive, you admit there's a standard *outside* the specific choice (the consistency axiom).
      *   *Decisive Argument 2: Preference Reversals & Framing.* The "Asian Disease Problem" or simple framing effects. If the *same* outcome is chosen differently based on description, RPT must say the "description" is part of the good. If *everything* contextual is part of the good, the concept of "preference" loses explanatory power. It becomes "they chose what they chose."
