answer: |-
  Here is the specification list you asked for. It is designed to function as a filter: any theory claiming to explain the Gender-Equality Paradox (GEP) must pass these checks before it is permitted to make claims about human nature or policy.

  ### I. The Desiderata

  #### A. Measurement & Operationalization
  **1. The Granularity Constraint**
  *   **Requirement:** The account must specify whether the dependent variable is the *share of women in a specific field* (e.g., % of engineers who are female) or an *occupational segregation index* (e.g., Duncan Index), and it must control for the number of available job categories in the labor market.
  *   **Consideration:** Segregation indices mathematically increase as the number of occupational categories increases. Richer nations (high equality scores) often have more specialized, granular labor markets. An account cannot claim "more sorting" if the increase is an artifact of having more boxes to sort people into.

  **2. The Index Endogeneity Check**
  *   **Requirement:** The account must establish the direction of causality between the "Gender Equality Index" (e.g., WEF GGGI) and the STEM outcome. It cannot treat the Index as a pure exogenous cause.
  *   **Consideration:** Many equality indices include economic participation and educational attainment. If women in a country are already sorting away from STEM, this affects the economic participation metrics, which alters the Index score. The "cause" (equality) may be partially downstream of the "effect" (sorting).

  **3. The Interest-Behavior Decoupling**
  *   **Requirement:** The account must distinguish between *self-reported interest* (psychometric data) and *revealed preference* (enrollment/employment data).
  *   **Consideration:** "Choice" is constrained by opportunity, cost, and risk. A woman choosing nursing over engineering in a high-equality country may be maximizing utility based on social signals, not expressing a pre-existing biological "interest." Conflating enrollment with interest is a category error.

  #### B. Inference & Level of Analysis
  **4. The Level-of-Analysis Constraint (Ecological Validity)**
  *   **Requirement:** The account must not infer individual-level psychological mechanisms (e.g., "women inherently prefer people over things") from country-level aggregate correlations.
  *   **Consideration:** This is the Ecological Fallacy. A country with high gender equality and low female STEM participation does not prove that the *individual women* in that country are less interested in STEM than women in low-equality countries. It may prove that the *men* in high-equality countries are more able to afford low-paying humanities degrees, or that the labor market structure differs.

  **5. The Counterfactual Stability Test**
  *   **Requirement:** The account must explain what would happen to the sorting pattern if the "freedom" variable were manipulated within a single culture over time.
  *   **Consideration:** Cross-sectional country comparisons confound culture, wealth, welfare state, and history. A valid theory should predict longitudinal shifts. If "freedom" causes "sorting," then as a single country becomes more egalitarian, STEM participation by women should drop. (Evidence here is mixed/weak).

  #### C. Mechanism & Psychology
  **6. The Preference Endogeneity Clause**
  *   **Requirement:** The account must explicitly state whether preferences are treated as *fixed traits* (revealed by freedom) or *adaptive responses* (shaped by freedom).
  *   **Consideration:** The "Innate" argument relies on preferences being fixed. However, sociological evidence suggests preferences adapt to perceived opportunities and social norms (e.g., "stereotype threat" or "cultural amplification"). In wealthy nations, economic security allows people to indulge in *culturally available* identities, which may be highly gendered. Freedom might reveal culture, not nature.

  **7. The Means-vs-Tails Distinction**
  *   **Requirement:** The account must specify whether it is explaining the *average* difference in interest/ability or the difference in the *top tail* (e.g., top 1% of math scorers).
  *   **Consideration:** STEM fields, particularly physics/engineering, often select from the extreme right tail of ability distributions. Small differences in means can produce massive differences in tails (the Variability Hypothesis). An account explaining means does not necessarily explain representation in elite STEM.

  #### D. Normative & Justice
  **8. The Justice Baseline Definition**
  *   **Requirement:** The account must define what constitutes a "justice problem." Is it *equality of opportunity* (no barriers to entry) or *equality of outcome* (proportional representation)?
  *   **Consideration:** If preferences are truly free and informed, unequal outcomes may not be unjust. However, if preferences are adaptive to unjust background conditions (e.g., anticipated discrimination), then "free choice" is not a sufficient defense of the outcome. The theory must pick a lane.

  ---

  ### II. Classification of Requirements

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **1. Granularity Constraint** | **Non-Negotiable** | Statistical artifact. Ignoring this renders the data meaningless. |
  | **2. Index Endogeneity** | **Non-Negotiable** | Causal direction. You cannot claim X causes Y if Y helps construct X. |
  | **3. Interest-Behavior Decoupling** | **Non-Negotiable** | Conceptual validity. Behavior $\neq$ Preference in constrained systems. |
  | **4. Level-of-Analysis Constraint** | **Non-Negotiable** | Logical validity. Violating this is a formal fallacy (Ecological). |
  | **5. Counterfactual Stability** | **Camp Commitment** | Causal realists require this; descriptive correlationalists may dodge it. |
  | **6. Preference Endogeneity** | **Non-Negotiable** | *For a causal claim.* If you claim "Nature," you must rule out "Adaptation." |
  | **7. Means-vs-Tails** | **Camp Commitment** | Depends on whether the theory targets general enrollment or elite fields. |
  | **8. Justice Baseline** | **Camp Commitment** | Philosophical prior. Libertarians vs. Egalitarians will differ here. |

  ---

  ### III. Incompatible Pairs

  You cannot jointly satisfy the following pairs without significant theoretical gymnastics:

  1.  **Fixed Preferences (Innate) + Cross-Country Correlation as Proof:**
      *   You cannot claim preferences are fixed biological constants *and* use cross-country variation (which is entirely cultural/environmental) as the primary evidence for those constants. If the environment changes the outcome, the preference wasn't the sole driver.
  2.  **Country-Level Inference + Individual Mechanism:**
      *   You cannot use the GEP (a country-level statistic) to prove a claim about individual female psychology (Requirement #4). Satisfying #4 kills the inference required for the "Innate" camp.
  3.  **Freedom as Revealer + Freedom as Amplifier:**
      *   The "Innate" camp argues freedom *reveals* true self (Endogeneity = False). The "Culture" camp argues freedom *amplifies* local norms (Endogeneity = True). You cannot hold that freedom does both simultaneously in the same context without specifying *which* freedoms (economic vs. social).

  ---

  ### IV. The "Killer" Requirement

  **Requirement #4: The Level-of-Analysis Constraint (Ecological Validity).**

  **Why it kills the popular explanation:**
  The friend's argument rests entirely on the inference: *"Countries with more freedom have fewer women in STEM $\rightarrow$ Therefore, individual women given freedom choose not to do STEM."*

  This is a textbook **Ecological Fallacy**.
  *   **The Data:** Aggregated national percentages.
  *   **The Claim:** Individual psychological dispositions.
  *   **The Failure:** A negative correlation at the country level can coexist with a positive, null, or negative relationship at the individual level. For example, within *every* country, wealthier/more secure individual women might be *more* likely to choose STEM, but countries with higher aggregate security might have labor markets that make non-STEM choices more viable for everyone (men and women).

  If your friend cannot move from country-level data to individual-level survey data (psychometrics) to support her claim, Requirement #4 renders her argument logically invalid, regardless of whether she is ultimately right about nature.

  *(Honorable Mention: **Requirement #6 (Preference Endogeneity)**. This is the substantive killer. If preferences adapt to the environment, "freedom" does not reveal "nature," it reveals "culture." This destroys the "Innate" conclusion even if the data were valid.)*

  ---

  ### V. Scorecard: Usual Suspects vs. The List

  | Theory | #1 Granularity | #2 Endogeneity | #4 Level-of-Analysis | #6 Endogeneity | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **Innate Interests (Friend's View)** | ❌ | ❌ | ❌ | ❌ | **Fails.** Relies on ecological fallacy and assumes fixed preferences without ruling out adaptation. |
  | **Economic Security Hypothesis** | ✅ | ✅ | ⚠️ | ✅ | **Stronger.** Argues STEM is a "risk" choice taken when safety nets are low. Fits endogeneity. Still struggles with Level-of-Analysis. |
  | **Cultural Amplification** | ✅ | ✅ | ⚠️ | ✅ | **Stronger.** Argues wealthy nations have stronger "gender essentialist" cultures. Fits preference adaptivity. |
  | **Measurement Artifact (GGGI Flaws)** | ✅ | ✅ | ✅ | N/A | **Robust.** Notes GGGI includes health/survival, skewing rich nations. Explains correlation without invoking psychology. |

  **How to use this:**
  When you talk to your friend, do not start with "preferences are adaptive." Start with **Requirement #4**. Ask her: *"Do you have individual-level data showing that within Norway, the women with the most freedom are less interested in physics than women with less freedom? Or are you inferring that from the country average?"* If she admits the latter, she has committed the ecological fallacy. If she admits the former, ask for the data (it generally doesn't exist in the way she needs).
