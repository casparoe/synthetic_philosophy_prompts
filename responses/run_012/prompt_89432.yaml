prompt: |-
  So a friend in my metaphysics reading group sent round his notes for the week we did grounding, and before I lean on them for the exam I want to know how much to trust them. Here's the gist of what he wrote. Grounding is the relation between more fundamental and less fundamental facts; it's basically the metaphysical cousin of causation — causation is how one event brings about another, grounding is how one fact makes another obtain. Like causation, he says, grounding is irreflexive, asymmetric and transitive, so it's a strict partial order. Then he says the chain of grounding has to bottom out: you can't have an infinite regress of facts grounding facts grounding further facts, that'd be vicious, so there has to be a fundamental level of facts that ground everything else and aren't themselves grounded — and that's what fundamentality just is. He ends on the payoff, which he says is the whole reason grounding got popular: it lets you be a realist about ordinary objects while also saying they're nothing over and above the physical, since the table-facts are grounded in the particle-facts. His example for the asymmetry is that the singleton set containing Socrates is grounded in Socrates himself but not the other way round.

  I dont know this literature at all and can't tell where he's being merely loose and where he's actually wrong. Can you go through it claim by claim and tell me what someone working on grounding would nod along to, what they'd wince at, and what's flatly incorrect? The thing I most want separated out is which of these are supposed to be built into the very notion of grounding and which are substantive theses he's smuggling in as if they just followed from it — especially the bottoming-out step, since if that argument is doing real work I'd like to know what it's assuming. And does the "nothing over and above" payoff actually fall out of the rest of what he said, or is that another thing he's added on top?
reasoning: |-
