      *   *Claim 2: It's the metaphysical cousin of causation (causation = events, grounding = facts).*
          *   Status: Common heuristic, but slightly loose.
          *   Nuance: Causation is diachronic (time), grounding is synchronic (usually). Causation relates events, grounding relates facts/propositions/entities.

      *   *Claim 3: Grounding is irreflexive, asymmetric, and transitive (Strict Partial Order).*
