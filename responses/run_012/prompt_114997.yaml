prompt: |-
  So I've been going down a rabbit hole on Marx and machines and I keep flip-flopping. A friend of mine claims Marx basically thought that if you could automate production completely — factories running themselves, no human labor anywhere — capitalism would be finished, because in his theory value comes from human labor time, so a world with zero labor has zero value and profit has nothing to feed on. That sounds way too clean to me.

  Give me your actual credence that Marx's own theory (not what later Marxists did with it) entails that a fully automated capitalist economy is impossible — that if production needed no human labor, the capitalist relation would have to break down into something else.

  Dont hand me a shrug about him being ambiguous — I want a number and the decomposition: how much rides on whether his value theory really requires living labor as the source of value, how much on whether he treated full automation as a real possibility or just a limit case, how much on whether value collapsing even matters (prices and markets could obviously survive without it), and how much on whether automation just pushes labor somewhere else rather than removing it. Show me how those terms combine, tell me which one the final number leans on hardest, and what would actually move it.
