answer: |-
  # DECISION TREE: UNCERTAIN EVIDENCE UPDATE PROTOCOLS

  **START:** You have a new credence $P_{new}(E) = 0.7$. You need to update $P(H)$.

  **Q1. PRECISION:** Do you represent your belief state as a **single number** or a **set of functions**?
  *   **Set:** → **LEAF 1: Imprecise Probabilist** ("Belief as a range")
  *   **Single:** → Go to Q2.

  **Q2. STATUS:** Is this tree describing **how minds work** or **how they ought to**?
  *   **How they work:** → **LEAF 2: Descriptive Psychologist** ("Updating is just causal drift")
  *   **How they ought:** → Go to Q3.

  **Q3. INPUT SOURCE:** Did you observe a **certain fact** (e.g., "Thermometer reads 20") or just **land on 0.7** directly?
  *   **Certain Fact:** → Go to Q4 (The Likelihood Path).
  *   **Direct 0.7:** → Go to Q5 (The Kinematics Path).

  **Q4. LIKELIHOOD TREATMENT:** Do you treat the 0.7 as a **likelihood** $P(Reading|E)$ or a **prior shift**?
  *   **Likelihood:** → **LEAF 3: Strict Conditionalizer** ("No uncertainty without certainty")
  *   **Prior Shift:** → **LEAF 4: Likelihood Skeptic** ("Models are just bookkeeping")

  **Q5. RIGIDITY:** Do you hold conditional probabilities **fixed** ($P_{new}(H|E) = P_{old}(H|E)$)?
  *   **No:** → **LEAF 5: Imaging Theorist** ("Shift mass to nearest possible world")
  *   **Yes:** → Go to Q6.

  **Q6. ORDER DEPENDENCE:** If you update on **Bird Color (0.7)** then **Bird Size (0.7)**, does the final $P(Robin)$ change if you swap the order?
  *   **Yes:** → Go to Q7.
  *   **No:** → **LEAF 6: Commutative Idealist** (Empty Slot: Requires non-standard algebra).

  **Q7. ORDER VERDICT:** Is this order dependence a **bug** (incoherent) or a **feature** (contextual)?
  *   **Bug:** → **LEAF 7: Update Skeptic** ("No rule handles sequential uncertainty")
  *   **Feature:** → Go to Q8.

  **Q8. NON-EVIDENTIAL:** If a **Rain Pill** made you 0.7 sure it will rain (no evidence), is this a valid update?
  *   **Yes:** → **LEAF 8: Radical Probabilist** ("All credence shifts are permitted")
  *   **No:** → **LEAF 9: Evidential Jeffreyist** ("Uncertain updates require evidence")

  **Q9. PARTITION:** If you refine the evidence (e.g., "20.0°C" vs "20.00°C"), does your final $P(H)$ change unacceptably?
  *   **Yes:** → **LEAF 10: Partition Dependence Critic** ("The grid defines the answer")
  *   **No:** → (Collapse to Leaf 9).

  ***

  ### LEAF DEFINITIONS & COMMITMENTS

  1.  **Imprecise Probabilist:** Belief is a set of distributions. *Awkward Commitment:* You often cannot make a decisive choice between actions.
  2.  **Descriptive Psychologist:** No norm, just mechanism. *Awkward Commitment:* You cannot call irrational updates "wrong," only "atypical."
  3.  **Strict Conditionalizer:** All learning is conditioning on certainties. *Awkward Commitment:* You must pretend you are certain of the thermometer reading to use it.
  4.  **Likelihood Skeptic:** Pragmatic model tuning. *Awkward Commitment:* You abandon the claim that your model tracks truth, only utility.
  5.  **Imaging Theorist:** Move probability to closest worlds where $E$ is true. *Awkward Commitment:* You violate the principle of total evidence in standard forms.
  6.  **Commutative Idealist:** *EMPTY SLOT.* Mathematically elusive; usually collapses into Imaging or Strict Conditionalization.
  7.  **Update Skeptic:** No coherent rule for sequential uncertain updates. *Awkward Commitment:* You must batch all evidence into one giant update or accept arbitrariness.
  8.  **Radical Probabilist:** Certainty is never required; pills and evidence are same format. *Awkward Commitment:* You cannot distinguish learning from brain damage normatively.
  9.  **Evidential Jeffreyist:** Rigidity holds, but requires evidential cause. *Awkward Commitment:* You must draw a hard line between "evidence" and "causal shift" (the Pill case).
  10. **Partition Dependence Critic:** The granularity of description changes the rational outcome. *Awkward Commitment:* Rationality is language-relative.

  ***

  ### STRUCTURAL NOTES & COLLAPSES

  *   **Verbal Dispute (Q3/Q4):** The fight between the **Strict Conditionalizer** and the **Evidential Jeffreyist** is often verbal. The Conditionalizer says "You conditionalized on 'The instrument read 20' (Certainty)." The Jeffreyist says "You updated on 'The temperature is 20' (Uncertain)." They often model the same math differently.
  *   **Collapsed Leaves:** **Leaf 10 (Partition Critic)** and **Leaf 7 (Update Skeptic)** often occupy the same space. If order matters and partitions matter, the rule is usually deemed useless, collapsing into Skepticism.
  *   **Empty Slots:** **Leaf 6 (Commutative Idealist)** is theoretically desired but无人 occupies it successfully without sacrificing Rigidity (becoming Leaf 5) or banning sequential updates (becoming Leaf 7).
  *   **The "Pill" Node (Q8):** This is the sharpest divider. **Leaf 8** accepts "forgetting" and "pills" as updates; **Leaf 9** forbids them. This distinguishes *Radical Probabilism* from standard *Jeffrey Conditionalization*.
  *   **The "Rigidity" Node (Q5):** This is the technical heart of your argument. If you deny Rigidity, you leave the Jeffrey framework entirely (moving to Imaging or Ad-Hoc). If you accept it, you inherit the Order Dependence problem (Q6).

  ### HOW TO USE THIS IN YOUR GROUP
  1.  Have everyone answer **Q3** first. This separates your colleague (Likelihood/Strict) from you (Direct/Kinematics).
  2.  If they say "Direct," force **Q6** (Order). If they admit order matters, ask **Q7**. If they say it's a bug, they agree with the third person (Skeptic).
  3.  If they say "Certain Fact," ask **Q4**. If they treat the reading as certain, ask if they are *actually* certain the thermometer isn't broken. If they say "No," they collapse back to Q3.
