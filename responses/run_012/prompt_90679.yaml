prompt: |-
  Ok so this is a slightly weird request, but hear me out.

  I just moved out of a straight software job into a forecasting/modelling role, and last week I got into an argument with someone in my group that I'm still kind of annoyed about. Our feed gives us an instrument reading, and I come away thinking the tank is around 20 degrees — not certain, maybe 70% on it being within a degree. I say: fine, I've got a new credence in a proposition, now I want to spread that through everything else I believe and keep my other conditional probabilities fixed. He says that's either not a thing or it's a hack, and that I should just treat the reading as a likelihood and let the model do it. Then a third person said "doesn't the answer depend on what order you do two of those updates in?" and now nobody knows what's going on, me included.

  I'm supposed to run the reading group next month and I want to hand out a one page decision tree that actually sorts people into the positions here, instead of everyone saying "well, Bayes" and glaring.

  So: write me that tree. One page, roughly eight to ten leaves.

  Start everyone from the same place: you've just come away with a credence of 0.7 in some proposition E, not 0 and not 1, and you want to know what should happen to your other credences. Every branch node should be a question someone can answer without already knowing which position it leads to — phrase them as concrete cases where you can, not as "do you accept probability kinematics".

  I want the tree to turn on at least these things, because these are the ones my group is actually fighting about:

  - whether the new credence in E is a legitimate input on its own, or has to be derived from something you're certain about (a likelihood, an experience, a fact about your own mental state)
  - whether you're even allowed to require that there's some certain proposition you conditionalised on
  - whether the thing is meant as a norm of rationality, a description of how people's minds actually move, or just bookkeeping
  - what exactly gets held fixed, and whether it's plausible that your conditional probabilities given each bit of the evidence stay put — I want a node on that assumption specifically
  - whether the partition (what counts as the evidence) is given by the world, chosen by you, or arbitrary, and whether the fact that your answer changes with it is a bug, a feature, or grounds for saying there's no rule here at all
  - order dependence: two uncertain updates, done in different orders, different answers — bug, feature, or a sign you should have represented the whole evidence stream as one thing
  - cases where your credence moves with no evidence at all, e.g. a pill that makes you 70% sure it'll rain, or just forgetting something you used to know. Same phenomenon or different?
  - single credences versus sets of them

  Use these cases in the questions: the cheap thermometer; a friend who's right about this kind of thing 80% of the time; a glance at a bird in bad light; the rain pill; forgetting; and two updates in different orders.

  Each leaf gets a name if there's a standard one and a descriptive phrase if there isn't, plus one sentence on its most awkward commitment. Note the slots in the space that nobody occupies and say whether that's because the view is incoherent, unattractive, or just unexplored. Flag any leaves your tree can't really separate instead of papering over it — I suspect a couple of them quietly collapse into each other — and flag any node that's really just a verbal dispute.

  No citations or reading lists, I'll add those myself, and don't worry about who held what.
