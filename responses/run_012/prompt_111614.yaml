  6.  **Evaluate the Teacher's Rule:**
      *   "Comparable work" is undefined. Without a metric, it's subjective.
      *   Needs a standard: Functional equivalence? Aesthetic impact? Cognitive load?
      *   The rule is a heuristic, not an algorithm.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic, adjudicatory, precise.
