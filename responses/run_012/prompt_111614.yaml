      *   Rewriting Image: *Illegitimate* unless the new image serves the same thematic function. Changing *what is said* to fit *how it is said* usually violates the semantic core Reuben protects, but Dana argues the form *is* the core. I need to split this: It's legitimate *only if* the semantic loss is negligible compared to the gain in structural integrity, but generally, it's risky. Let's call it *Conditionally Legitimate*.

