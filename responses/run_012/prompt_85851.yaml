  - certainty-sensitive? — yes if the row only works when the improvement is gauranteed for every way the game could be played, no if it would survive a weaker version that's merely better in expectation
  - confidence — high, medium or low

  8 to 10 rows, most important first. Then two or three sentences underneath on the single biggest catch — the thing most likely to make us think we've got a safe deal when we haven't.
