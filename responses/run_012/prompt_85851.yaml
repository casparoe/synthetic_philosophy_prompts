  | Assume enforcement costs are part of the payoff and minimize them by making clauses self-executing. | No matter how the others actually end up playing (includes playing 'sue you') | Use automatic equity forfeiture for cause rather than clauses requiring court orders to enforce. | Local law overrides contract terms regarding automatic forfeiture. | Yes | Medium |
  | Implement a deadlock breaker that is costly for both but less costly than dissolution. | Safe Pareto Improvement over the default deadlock game | Use a pre-agreed binding mediator rather than a shotgun clause that risks valuation asymmetry. | The mediator cannot grasp the technical nuance required to break the tie. | Yes | Medium |

  The single biggest catch is assuming your partner's utility function remains purely financial throughout the partnership. SPI relies on the assumption that players won't choose dominated strategies, but in founder breakups, 'spite' or 'control' can change the utility function, making financially self-destructive moves rational for them and breaking the safety guarantee.
