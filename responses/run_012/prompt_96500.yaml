answer: |-
  ### Coach's Notes: Strategic Pressure Points

  Before we draft the questions, here is the strategic landscape. Your guest is defending a "revealed preference" model augmented by hyperbolic discounting. Her strongest move is to treat all mental life as valuation. If you choose work, you valued work more. If you choose TV, you valued TV more. "Willpower" is just the name for a specific configuration of these values over time.

  This model is elegant, but it buys its elegance at a high cost. Here are the three pressure points where the model runs out of resources:

  1.  **The Phenomenological Gap:** The model explains *choice* but not *struggle*. It can explain why I switch from preferring work to preferring TV. It cannot easily explain why I might *still* prefer work at the moment of action (judgment and preference align) but fail to act due to compulsion or habit. If she says this doesn't happen, she denies the lived experience of the audience. If she says it does happen, her model (which relies on preference reversal) cannot explain it.
  2.  **The Normative Vacuum:** If the evening self's preference for TV is just a "different" preference rather than a "mistake," the morning self has no rational authority to bind the evening self. Planning becomes merely a conflict between two different people, not a rational agent managing her life. This strips the concept of "self-control" of its normative force.
  3.  **The Dissolution of the Agent:** To avoid contradiction, her model often implicitly fragments the agent into a sequence of temporal selves. But if we are just a sequence of selves, who is the "I" that is weak? Who is responsible? If she admits the "unified agent" is a fiction, she undermines the moral and practical stakes of the discussion.

  We will use these three points to anchor the ten questions below.

  ***

  ### The Questions

  **1. [Topic 1: Preference/Judgment Agreement]**
  Consider a case where at the moment of action, the agent still ranks the work above the television and judges the work worth doing, yet watches television anyway. A discount curve explains preference reversal, but here there is no reversal to explain. Does your account have room for action failing despite stable preference, or must you redescribe this as a case where the preference for TV was actually higher all along?
  [Designed to force her to either deny the phenomenon or admit her model cannot explain it.]
  *   **Follow-up:** If she says the preference *must* have flipped: Ask, "If revealed preference is the only test, does your theory become unfalsifiable? How could any evidence ever count against it?" If she says this case doesn't exist: Ask, "Then are you telling the audience that their experience of 'dragging themselves' to a task they still value is an illusion?"

  **2. [Topic 1: The Redescription Trap]**
  You suggest that talk of acting against better judgment is a colorful redescription of preference reversal. But if every action reveals the underlying preference, doesn't this turn your claim into a tautology? If I work, I preferred work; if I procrastinate, I preferred procrastination. What work is the concept of "preference" doing if it cannot come apart from the action it is supposed to explain?
  [Designed to expose the circularity of defining preference solely by action.]
  *   **Follow-up:** If she appeals to neural data or self-report: Ask, "Then you are admitting preference is distinct from choice, which opens the door for the choice to contradict the preference. Why block that door?"

  **3. [Topic 2: Shallow vs. Deep Akrasia]**
  Let's distinguish two cases. In the shallow case, my judgment is stable but loses. In the deep case, my judgment itself flips at the moment of action: I sincerely rank TV above work at night, but the next morning I regard the evening's ranking not merely as different but as *corrupted*. What work is the word "corrupted" doing here that "different" would not do?
  [Designed to probe the normative status of the flipped judgment.]
  *   **Follow-up:** If she says "Corrupted just means different from the morning self": Ask, "Then why does the morning self feel entitled to correct the evening self, rather than just outvote them?"

  **4. [Topic 2: Criticizable Preferences]**
  Following on that: Can a preference ordering be criticizable by the very person who has it? If my evening self prefers TV, is that preference a mistake *by the evening self's own lights*, or only by the morning self's lights?
  [Designed to test if the model allows for internal normative error.]
  *   **Follow-up:** If she says it's only a mistake by the morning self's lights: Ask, "Then rationality is purely a matter of temporal location. Is there no standpoint from which the whole sequence can be judged irrational?"

  **5. [Topic 3: Willpower vs. Preference Change]**
  Imagine a treatment that leaves the discount curve exactly as it is—the television still feels more attractive at eight in the evening—but removes the tendency to act on the pull, so that the person works. Has this person acquired a stronger will, or merely a different preference ordering?
  [Designed to separate the capacity to act from the valuation of the outcome.]
  *   **Follow-up:** If she says "The descriptions come to the same thing": Ask, "Then training oneself to resist temptation is indistinguishable from learning to like work more. Does that match the phenomenology of effort?"

  **6. [Topic 4: Second-Order Preferences]**
  If an agent hands her laptop to a neighbor for the evening, is that not evidence that she ranks her own rankings? She is treating her evening preference for TV as something to be blocked by her morning preference for work. Is that higher standpoint just another preference, and if so, what stops the regress?
  [Designed to challenge the hierarchy of preferences.]
  *   **Follow-up:** If she says "The regress stops at the strongest preference": Ask, "Then self-control is just the tyranny of the stronger impulse. Where is the 'self' in self-control?"

  **7. [Topic 4: Outsourcing vs. Self-Control]**
  Continuing with the laptop example: Is the person who binds herself exercising self-control or outsourcing it? If she needs the neighbor to enforce what she judges best, does your account make the need for the neighbor look like weakness, or like rational planning?
  [Designed to question the locus of agency.]
  *   **Follow-up:** If she says "It's rational planning": Ask, "If the planning self and the acting self are so opposed that they require a third party to mediate, in what sense are they one agent?"

  **8. [Topic 5: Exploitability]**
  Suppose someone knows the exact shape of your curve and offers a sequence of trades, each of which you prefer at the moment it is offered, leaving you worse off by your own later reckoning. Is exposure to that 'money pump' a defect of rationality or only an inconsistency?
  [Designed to link consistency to welfare loss.]
  *   **Follow-up:** If she says "It's only inconsistency": Ask, "If I can be drained of resources without gaining anything, in what sense am I reasoning well? Is rationality compatible with guaranteed loss?"

  **9. [Topic 6: The Divided Self]**
  If you model the agent as a sequence of dated selves bargaining with one another, can anything in that picture be weak-willed as opposed to simply outvoted? Does this picture lose the very thing that needs explaining—one agent divided against herself?
  [Designed to challenge the fragmentation of the agent.]
  *   **Follow-up:** If she says "Divided-agent language is a mere manner of speaking": Ask, "What is lost if we take that literally? Does responsibility dissolve along with the unified self?"

  **10. [Topic 7: The Normative Sting]**
  Finally, does your view entail that the chronic procrastinator is merely differently constituted rather than defective? Do you accept that consequence for the person who loses out by her own lights?
  [Designed to force a confrontation with the moral implications of the theory.]
  *   **Follow-up:** If she says "Defective has no content once the curve is a parameter": Ask, "Then why should anyone listen to your lecture? If there is no defect to correct, you are offering description, not advice."

  ***

  ### Opening and Closing Strategy

  **Open with Question 1 (The Agreement Case).**
  *   **Why:** It is the most concrete and intuitive objection. Everyone in the room has experienced doing something they knew was wrong *and* didn't even want to do at the time. It grounds the abstract economic theory in immediate lived experience. If she cannot answer this satisfactorily, the rest of her model hangs in the air. It establishes you as someone who understands the material but prioritizes the phenomenon over the model.

  **Save Question 10 (The Normative Sting) for Last.**
  *   **Why:** This is the "killer" question that moves from technical mechanics to human consequence. Throughout the Q&A, she will have been defending the *accuracy* of her model. This question challenges the *value* of her model. It forces her to admit whether her theory offers hope for improvement or merely a diagnosis of inevitability. It leaves the audience thinking about the stakes of the discussion, not just the mechanics of discount curves. It ends the session on the philosophical high ground: not just how we act, but how we should live.
