      *   **Descriptive vs. Metaphysical:**
          *   *Descriptive:* Why do *we* formulate theories this way? (Cognitive science, history of science, selection bias).
          *   *Metaphysical:* Why does *reality* obey these rules? (Ontology, realism vs. instrumentalism).
          *   *Crucial distinction:* One is about the map (theories), the other about the territory (world).

      *   **Evidence Against Selection Effect:**
          *   If the selection effect were the whole story, we should see lots of "failed math" or "non-mathematical physics."
          *   *Counter-evidence:* Specific predictions. If math developed *without any empirical input* predicts a specific numerical constant or particle mass with high precision *before* measurement, selection bias is harder to argue. (Example: Dirac's antimatter, Omega-minus particle).
          *   *Stronger Counter-evidence:* If we found a domain of nature that *resists* mathematical formulation despite rigorous attempts (e.g., consciousness, turbulent flow beyond approximation), that would challenge the "physics must be mathematical" selection rule. But to *disprove* the selection effect regarding *successful* theories, we need to show that the math was too specific to be a mere filter.
          *   *Refinement:* To argue *against* the selection effect reading of Wigner's point, we need to show that the *fit* is too tight to be just "we kept the ones that fit." We need "no-lose" scenarios where the math dictated the physics, not the other way around. Actually, the prompt asks what counts as evidence *against* the selection-effect reading.
          *   *Idea:* If we found that mathematical structures *failed* to apply where we expected them to, or if non-mathematical frameworks succeeded equally well. But more precisely: If the mathematical structure was so specific and constrained that it couldn't have been "selected" from a buffet, but rather forced itself upon us.
          *   *Better angle:* The selection effect says "we only call it physics if it's mathematical." Evidence against this would be a successful physical theory that is *not* mathematical (qualitative, logical, etc.). Or, evidence that the mathematical structure was so unique that it wasn't a matter of choosing the right tool from a shed, but that the tool was the *only* possible one.
          *   *Wait, let's look closer:* The selection effect argues the "miracle" is illusory because we filter out non-mathematical failures. Evidence against this would be: 1. Successful non-mathematical physics (shows we don't filter that out). 2. Mathematical predictions of *novel* phenomena where the math existed *before* the phenomenon was even conceived (shows the math wasn't tailored to the data).

      *   **"Math is a Human Invention":**
