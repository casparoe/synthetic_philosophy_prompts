  2.  **Drafting - Section by Section:**

      *   **Introduction:** Briefly introduce Eugene Wigner's 1960 essay. Define the core puzzle: Why does abstract human thought match physical reality so well?

      *   **Separating the Three Claims:**
          *   *Claim 1 (Historical/Retrospective):* "Math first, Physics later." Example: Riemannian geometry $\rightarrow$ General Relativity. This is about the *timeline* of discovery.
          *   *Claim 2 (Ontological):* "Nature is Math." Pythagoreanism/Platonism. The universe *is* a mathematical structure. This is about the *fabric of reality*.
          *   *Claim 3 (Epistemological/Selection):* "Survivorship Bias." We only call it "physics" if it's mathematizable. We only keep the math that works. This is about *human categorization*.

      *   **The Selection Effect (Concrete Case):**
          *   *Scenario:* Imagine a mathematician in 2024 develops "Hyper-Complex Topology" just for fun (internal consistency, beauty). No physical application in mind. In 2050, physicists discover a phenomenon (e.g., quantum gravity effects) that *only* makes sense using Hyper-Complex Topology.
          *   *Analysis:*
