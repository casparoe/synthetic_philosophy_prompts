prompt: |-
  I run grantmaking at a small foundation — about forty grants a year, twenty to two hundred grand each, decided by a team of five with no training in this stuff, signed off by trustees quarterly. We've started asking what our grants do in the long run and its turned into a mess: once the far future is in play, the case for and against the same grant is dominated by stuff we're inventing, and two of us can reach opposite conclusions from the same facts. One trustee says this is just cluelessness and we should stop pretending to rank grants at all.

  I don't want to stop. Write me a procedure we can run on a proposal in an hour: questions in order, what counts as a good enough answer, where it stops with a no, and where it hands the decision to a person because the disagreement is about values rather than facts. Build in a sorting step I can teach: every consideration goes into one of three buckets — things we have evidence for, things we can reason about but not measure, and things that only work if you accept an assumption we can't defend — and the procedure should say how much of a case can be the third bucket before ranking by expected value stops meaning anything, and what we do then (reversibility? track record? admit it's a tie?).

  Then run it on two proposals: a scholarship program whose near-term effects we can measure but whose long-run effects on who ends up powerful nobody agrees on, and a grant to people working on slowing down the reckless development of AI, where nothing is measurable and even the sign of the effect is contested. Tell me where it gives an answer I won't like, which steps are heuristics dressed up as rigor, and which are values choices I have to own myself.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small foundation (40 grants/year, $20k-$200k), 5-person team (untrained), quarterly trustee sign-off.
      *   **Problem:** Trying to assess long-term impact leads to speculation, disagreement, and paralysis. One trustee suggests randomizing/stopping ranking.
      *   **Goal:** The user *does not* want to stop. They want a 1-hour procedure to evaluate proposals.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Stop conditions (automatic "no").
          *   Hand-off conditions (values vs. facts).
          *   **Crucial Mechanism:** A 3-bucket sorting system (Evidence, Reasonable Inference, Undefendable Assumption).
          *   **Threshold:** How much "Bucket 3" (Undefendable Assumption) is too much for expected value (EV) ranking?
          *   **Fallback:** What to do when EV breaks down (reversibility, track record, tie?).
          *   **Application:** Run the procedure on two specific proposals (Scholarship vs. AI Safety).
          *   **Meta-Analysis:** Identify unlikable answers, heuristics disguised as rigor, and value choices the user must own.

  2.  **Develop the Procedure (The "One-Hour Impact Sort"):**

      *   *Philosophy:* Needs to be pragmatic, not academic. It needs to acknowledge uncertainty without succumbing to paralysis. It needs to separate *facts* from *faith*.
      *   *The 3 Buckets:*
          1.  **Ground (Evidence):** Data, past performance, measurable metrics.
          2.  **Bridge (Reasoning):** Logical chains, theory of change, expert consensus (but no direct data).
          3.  **Cloud (Assumption):** Speculative long-term effects, contested causal links, ideological bets.
      *   *The Threshold:* If the case relies too heavily on the "Cloud," EV calculation is fiction. Need a cutoff. Let's say >50% of the *value* claim rests on Bucket 3.
      *   *The Flow:*
          1.  Fit & Compliance (Pass/Fail).
          2.  Bucket Sorting (The core work).
          3.  The "Cloud Check" (Threshold).
          4.  Decision Protocol (EV vs. Heuristics vs. Values).
      *   *Time Management:* 60 minutes total.

  3.  **Drafting the Steps (Iterative refinement):**

      *   *Step 1: The Floor (10 mins).* Basic eligibility, capacity, legal. If this fails, stop.
      *   *Step 2: The Bucket Sort (20 mins).* Map the Theory of Change. Label each link.
      *   *Step 3: The Cloud Limit (10 mins).* Apply the threshold. If too much Cloud, switch strategies.
      *   *Step 4: The Decision (20 mins).* Calculate EV if safe. If not, use fallbacks (reversibility, track record). If disagreement persists, flag as Values.

  4.  **Refining the "Cloud Limit":**

      *   How to quantify "how much"? It's not just word count. It's *weight*.
      *   Rule: If the *primary justification* for the grant's existence relies on Bucket 3, you cannot rank by EV.
      *   Fallback: If Bucket 3 dominates, move to "Portfolio Logic" (diversification) or "Reversibility" (can we pull the plug?).

  5.  **Running the Procedure on Proposal A (Scholarships):**

      *   *Ground:* Grades, graduation rates, job placement (measurable).
      *   *Bridge:* Higher income leads to better community outcomes (reasonable inference).
      *   *Cloud:* This specific person becomes a leader who changes policy in 20 years (speculative).
      *   *Verdict:* Mostly Ground/Bridge. EV ranking works.
      *   *Conflict:* Team disagrees on *which* scholars matter most (Values).

  6.  **Running the Procedure on Proposal B (AI Safety):**

      *   *Ground:* Team credentials, past papers (measurable).
      *   *Bridge:* Research *might* influence developers (weak inference).
      *   *Cloud:* This prevents existential catastrophe / This slows beneficial innovation (highly contested, undefendable assumption).
      *   *Verdict:* Dominated by Cloud. EV ranking is nonsense.
      *   *Fallback:* Reversibility? (Hard to undo knowledge). Track Record? (Field is new).
      *   *Decision:* Values call.

  7.  **Meta-Analysis (The "Honesty" Section):**

      *   *Unlikable Answers:* The procedure will likely tell the user to stop trying to calculate EV on the AI grant. It forces admission of ignorance.
      *   *Heuristics as Rigor:* The "50% Cloud" rule is arbitrary. The "Reversibility" check is a heuristic.
      *   *Value Choices:* Deciding that "preventing catastrophe" outweighs "helping individuals" is a value choice, not a math problem. The procedure exposes this but doesn't solve it.

  8.  **Review against Constraints:**

      *   1 hour? Yes, the steps are timed.
      *   3 Buckets? Yes (Ground, Bridge, Cloud).
      *   Threshold defined? Yes.
      *   Two proposals tested? Yes.
      *   Critique included? Yes.

  9.  **Tone Check:**

      *   Needs to be professional, direct, slightly empathetic to the difficulty, but firm on the logic. No jargon without definition.
      *   Acknowledge the trustee's point (that ranking might be clueless) but provide the tool to do it *honestly* anyway.

  10. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Values Hand-off" is clear. It's not just "we disagree." It's "we disagree on the weight of Bucket 3."
      *   *Correction:* Ensure the "Cloud Limit" is actionable. Instead of a percentage, use "Primary Driver." If the *main reason* for the grant is Bucket 3, EV is out.
      *   *Refinement:* The "Tie" outcome needs to be specific. If EV fails, default to "Portfolio Diversity" or "Trustee Discretion."

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a procedure designed for your constraints: five untrained staff, one hour per proposal, and a need to separate fact from faith.

  ### The "Ground, Bridge, Cloud" Protocol (60 Minutes)

  **Objective:** To determine if a grant can be ranked by Expected Value (EV) or if it must be treated as a Values Bet.

  **The Three Buckets:**
  1.  **Ground (Evidence):** Direct data, past performance, measurable outputs (e.g., "This org spent 90% on program last year").
  2.  **Bridge (Reasoning):** Logical chains supported by consensus or theory, but not direct data (e.g., "Job training usually leads to higher income").
  3.  **Cloud (Assumption):** Speculative long-term effects, contested causal links, or ideological bets (e.g., "This specific graduate will change policy in 20 years").

  ---

  #### Phase 1: The Floor (10 Minutes)
  *Goal: Automatic "No" conditions.*

  **Questions:**
  1.  **Fit:** Does this fall within our stated mission?
  2.  **Capacity:** Does the applicant have the legal/operational ability to receive funds?
  3.  **Integrity:** Are there red flags (fraud, sanctions, reputational risks)?

  **Stop Condition:** If any answer is **No**, the proposal is rejected. Do not proceed to impact analysis.
  **Pass Condition:** All **Yes**. Proceed to Phase 2.

  #### Phase 2: The Bucket Sort (20 Minutes)
  *Goal: Map the Theory of Change.*

  **Action:** Take the applicant's "Goal." Work backward to your "Grant." Label every link in the chain.

  **Questions:**
  1.  **Link 1 (Output):** What happens immediately when we write the check? (Almost always **Ground**).
  2.  **Link 2 (Outcome):** What happens 1–3 years later? (Usually **Bridge**).
  3.  **Link 3 (Impact):** What happens 10+ years later? (Often **Cloud**).

  **Criteria for Labeling:**
  *   **Ground:** We have seen this happen before with this specific actor or similar actors (data exists).
  *   **Bridge:** Social science or logic suggests this happens, but we can't measure it for this specific case yet.
  *   **Cloud:** We are guessing. Reasonable people disagree on whether this link exists or if it is good.

  **Output:** A visual chain labeled G, B, or C.

  #### Phase 3: The Cloud Limit (10 Minutes)
  *Goal: Determine if EV ranking is valid.*

  **The Rule:** Look at the *value* of the grant. Where does the justification come from?
  *   **Scenario A (EV Valid):** The primary value is delivered via Ground or Bridge. Cloud is secondary (bonus upside).
  *   **Scenario B (EV Invalid):** The primary value *requires* the Cloud link to be true. If the Cloud link fails, the grant is worthless.

  **Threshold:** If >50% of the *claimed value* rests on **Cloud**, you cannot rank this by Expected Value. The math is fiction.

  **Decision:**
  *   If **Scenario A**: Proceed to Phase 4A (EV Ranking).
  *   If **Scenario B**: Proceed to Phase 4B (Values & Heuristics).

  #### Phase 4: The Decision (20 Minutes)

  **Path A: EV Ranking (For Ground/Bridge heavy grants)**
  1.  Estimate probability of success for Ground/Bridge links.
  2.  Rank against other Path A grants.
  3.  **Disagreement Check:** If two staff members rank differently, check why.
      *   Is it different data interpretation? → **Fact.** Discuss.
      *   Is it different weight on outcomes (e.g., helping 10 people vs. 1 person deeply)? → **Values.** Hand off to Trustee.

  **Path B: Values & Heuristics (For Cloud heavy grants)**
  *Since you cannot calculate EV, use these filters:*
  1.  **Reversibility:** If we are wrong, can we stop? (High reversibility = Lower risk).
  2.  **Track Record:** Has this *type* of bet worked for others, even if we can't measure this specific one?
  3.  **Portfolio Logic:** Do we already have too many Cloud bets? (Diversify).
  4.  **The Tie-Breaker:** If the above don't resolve it, this is a **Values Tie**.
      *   **Action:** Do not force a score. Present to Trustees as: "This is a strategic bet on [X Value]. We recommend funding/not funding based on the Board's appetite for [X Risk]."

  ---

  ### Application: Two Proposals

  Here is how the protocol runs on your two examples.

  #### Proposal 1: The Scholarship Program
  *   **The Pitch:** Fund tuition for low-income students.
  *   **Phase 2 (Bucket Sort):**
      *   *Link 1:* Student attends college. (**Ground**: Enrollment records).
      *   *Link 2:* Student graduates and gets higher wage. (**Bridge**: Strong statistical correlation exists).
      *   *Link 3:* Student becomes a leader and fixes systemic inequality. (**Cloud**: Highly speculative, depends on individual agency).
  *   **Phase 3 (Cloud Limit):**
      *   *Analysis:* Is the grant justified by the degree (Bridge) or the systemic change (Cloud)?
      *   *Verdict:* If the foundation's goal is "economic mobility," this is **Path A (EV Valid)**. The Bridge carries the weight. The Cloud is bonus.
  *   **Phase 4 (Decision):**
      *   Rank based on graduation probability and wage uplift data.
      *   *Disagreement:* If Staff A ranks it high and Staff B low, check the data. If they agree on data but disagree on whether "wage uplift" matters more than "arts funding," that is a **Values Hand-off**.

  #### Proposal 2: AI Safety Research
  *   **The Pitch:** Fund researchers to slow down reckless AI development to prevent catastrophe.
  *   **Phase 2 (Bucket Sort):**
      *   *Link 1:* Researchers produce papers/policy drafts. (**Ground**: Deliverables exist).
      *   *Link 2:* Policakers/Companies adopt these safety measures. (**Cloud**: Contested. Industry may ignore them).
      *   *Link 3:* Adoption prevents existential catastrophe / Or, slowing AI causes geopolitical harm. (**Cloud**: Highly contested sign of effect. Nobody knows).
  *   **Phase 3 (Cloud Limit):**
      *   *Analysis:* The *only* reason to fund this is Link 3. Link 1 and 2 are useless without Link 3.
      *   *Verdict:* >90% of value is **Cloud**. This is **Path B (EV Invalid)**.
  *   **Phase 4 (Decision):**
      *   Do not attempt to calculate "lives saved."
      *   Apply Heuristics: Is it reversible? (No, knowledge spreads). Track record? (Field is new).
      *   **Outcome:** This goes to Trustees as a Values Tie. "This grant bets that slowing AI is net positive. The other bets that speeding AI is net positive. We cannot measure this. The Board must choose the worldview."

  ---

  ### The Meta-Analysis: Where This Will Hurt

  You asked for the unlikable answers, the fake rigor, and the values you must own.

  **1. The Answer You Won't Like**
  The protocol will likely tell you that **you cannot rank the AI grant.** You wanted a procedure to decide *which* grants to make, but for high-uncertainty grants, this procedure explicitly forbids you from pretending you can calculate Expected Value. It forces you to admit to your Trustees: *"We are not investing based on evidence; we are gambling on a worldview."*
  *   **Why this hurts:** It removes the shield of "data-driven decision making." It exposes the foundation to the Trustee's critique that you are "clueless."
  *   **Why it's necessary:** It is better to be honestly clueless than confidently wrong. If you rank a Cloud grant using EV math, you are lying to yourselves.

  **2. Heuristics Dressed Up as Rigor**
  *   **The 50% Cloud Threshold:** There is no magic number where EV stops working. I chose 50% as a heuristic. In reality, EV breaks down as soon as the *variance* is too high to model.
  *   **Reversibility:** Treating "can we pull the plug?" as a risk mitigation strategy is a heuristic. Some irreversible things are good (vaccines); some reversible things are bad (addiction).
  *   **The Bucket Labels:** Distinguishing "Bridge" from "Cloud" is subjective. One person's "reasonable inference" is another's "wild guess." The protocol requires you to enforce a definition, but the definition itself is arbitrary.

  **3. The Values Choices You Must Own**
  The procedure does not solve disagreement; it isolates it. You must own these three choices:
  *   **Time Horizon:** By labeling 10+ year effects as "Cloud," you are implicitly deciding that your foundation values the near-term over the far-term. If you believe the far-term matters more, this protocol biases you against it.
  *   **Risk Tolerance:** In Phase 4B, if you choose "Portfolio Logic" (diversifying), you are choosing stability over impact. If you choose "Reversibility," you are choosing caution over transformation.
  *   **The "Values Tie" Hand-off:** When you send a grant to the Trustees saying "This is a values bet," you are admitting that your team's expertise is insufficient. You are transferring the moral burden to them. You must be comfortable with the possibility that they will say "No" to something your team believes in, simply because they hold different values, not because the facts differ.

  ### Summary Instruction for Your Team

  Teach them this: **"We do not use this tool to find the truth. We use it to find out where we are guessing."**

  If the proposal is mostly Ground/Bridge, argue about the numbers.
  If the proposal is mostly Cloud, argue about the values.
  If you are arguing about numbers on a Cloud proposal, stop. You are wasting time. Move it to the Trustees.
