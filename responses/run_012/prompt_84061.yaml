      *   **Billi's Position:** She isn't an outsider. She is the *bridge*. Her refusal to lie initially is actually a form of *Cheng* (Authenticity/Truthfulness), a Confucian virtue too. She integrates *Cheng* with *Xiao* (Filial Piety).
      *   **Role Revision:** The film shows roles aren't just inherited; they are enacted. The wedding is a staged role. Billi writing the film is a re-enactment of her role.
