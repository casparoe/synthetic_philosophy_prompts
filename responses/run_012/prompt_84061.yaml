prompt: |-
  My grandmother's been sick and my family's been fighting about whether to tell her how bad it is — my aunt says we shouldn't, that it's cruel to make her carry it, and my dad says that's just a Chinese thing and we're American now. I keep thinking about The Farewell, which I rewatched last week, and about Confucian role ethics, which I only half understand. I'm supposed to lead a discussion on the film for a reading group and I definately want to do it through the role-ethics lens, but I don't want to just say family is important in Confucianism and call it a day.

  So: read the film through Confucian role ethics — the idea that you're not an individual who then has roles, but that your roles (son, granddaughter, mother) are partly constitutive of who you are, and that ethical life is mostly about doing those relations well rather than applying impartial rules. Billi's family lies to Nai Nai; Billi is torn; the uncle gives that speech about collectivism bearing the burden. Analects 13.18 has Confucius saying the upright man covers for his father and the father for the son, which seems to be the family's logic, but I'm not sure the film endorses it.

  Where does the film dramatize role ethics, where does it complicate it, and where does it resist the reading? Does Billi's American individualism make her an outsider to the role ethics, or is she actually the one who's most alive to what the roles demand? And does the film show something the philosophical debate misses — maybe about how roles can be revised or contested rather than just inherited? I'd like a reading that's honest about where the film doesn't fit.

  Also, be self-critical: tell me where your reading is most likely to be wrong, and what would change your mind — a scene I'm misremembering, a better reading of the Analects passage, or a role-ethics scholar who'd say I've got the concept wrong.
