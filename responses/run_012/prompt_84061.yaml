      *   *Ethical Goal:* *Ren* (humaneness) achieved through *Li* (ritual/propriety) within those roles.
      *   *Truth-telling:* Truth is contextual. If telling the truth harms the relationship or the harmony (*He*), it might not be the "right" action. *Analects* 13.18 supports prioritizing family bond over abstract legal/moral truth.
      *   *Burden:* The collective bears the emotional weight so the individual doesn't have to.

  3.  **Analyze *The Farewell* (2019) through CRE:**
      *   *Dramatization:* The wedding is a ritual (*Li*) to gather the family and say goodbye without saying goodbye. The lie is an act of love (*Ren*), not deception for gain. The Uncle's speech ("It's not the cancer that kills her, it's the fear") is pure role ethics—the family absorbs the fear.
      *   *Complication:* Billi (the protagonist) struggles. She was raised in the US (individualist ethics). She sees the lie as *wrong* inherently. This creates tension.
      *   *Resistance:* The film doesn't just validate the Chinese way. It shows the pain of the lie. Nai Nai might suspect. Billi's outburst at the dinner table. The ending is ambiguous (Nai Nai is alive years later, but was the lie *right*?).
      *   *Billi's Role:* Is she an outsider? Or is her honesty a different kind of role fulfillment? She eventually participates (the toast). This suggests a hybrid ethics.
      *   *Revision:* The film shows the diaspora experience. Roles aren't static. Billi negotiates her role as "granddaughter" across cultural lines.

