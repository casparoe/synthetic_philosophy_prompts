answer: |-
  You have identified two distinct pathologies of majority rule. They are cousins, but they are not the same disease. Here is the carving you asked for.

  ### 1. The First Case: The Doctrinal Paradox

  **The Name:** It is called the **Doctrinal Paradox** (sometimes the **Discursive Dilemma**).

  **The Mechanism:** This occurs when a group votes on *propositions* that are logically connected, rather than on simple preferences. In your example, the logic is: *If (Did it) AND (Gross Misconduct), THEN (Dismiss).*

  The paradox arises because there are two valid ways to aggregate the votes:
  1.  **Premise-based:** Vote on the facts (Did it? Was it gross?). Apply the logic mechanically to determine the outcome. (Result: Dismiss).
  2.  **Conclusion-based:** Vote directly on the outcome (Dismiss?). (Result: Retain).

  **The Edges:** You asked if the edges are where you think they are. They are, but with a specific boundary. This paradox only exists where there is an **external logical constraint** binding the questions together.
  *   **Inside the edge:** The board accepts a rule that says "A and B imply C." The inconsistency is between the collective judgment on the inputs and the collective judgment on the output.
  *   **Outside the edge:** If there is no logical link between the questions (e.g., voting on the colour of the wall, then voting on the budget), this cannot happen. The paradox requires that the group accepts a "doctrine" (a rule of inference) that binds the votes together.

  **Why it feels unsettling:** It reveals that a "collective mind" can hold inconsistent beliefs even if every individual mind is consistent. No single trustee voted "Yes, Yes, No." The inconsistency belongs to the *board as an entity*, not the people composing it.

  ### 2. The Second Case: The Condorcet Paradox

  **The Name:** This is the **Condorcet Paradox** (or **Cyclical Majorities**).

  **The Mechanism:** This occurs when voting on *preferences* between three or more options.
  *   Majority prefers A over B.
  *   Majority prefers B over C.
  *   Majority prefers C over A.

  **The Edges:** This is about **transitivity**. An individual's preferences are usually transitive (if I like A more than B, and B more than C, I like A more than C). The Condorcet Paradox shows that *group* preferences are not necessarily transitive.
  *   **Inside the edge:** This happens when preferences are not "single-peaked." (Roughly: when voters don't agree on a common spectrum of "best to worst," but have divergent ideals).
  *   **Outside the edge:** If you only have two options, this cannot happen. It requires at least three. It also depends heavily on the **agenda** (the order in which you vote). If you vote A vs B, then the winner vs C, the person controlling the order controls the outcome.

  ### 3. Are they the same thing wearing a hat?

  **No.** They are structurally different failures.

  *   **The Doctrinal Paradox is about Truth.** It asks: "What is the correct judgment?" It fails because logical consistency does not survive majority aggregation.
  *   **The Condorcet Paradox is about Will.** It asks: "What do we want?" It fails because a stable "group will" may not exist; the group is in a rock-paper-scissors loop.

  You can have a Doctrinal Paradox without a Condorcet Paradox (e.g., your dismissal case had a clear logical structure, not necessarily a cycle of preferences). You can have a Condorcet Paradox without a Doctrinal Paradox (e.g., choosing a venue where no logical rules bind the choices).

  ### 4. The Famous Result: Arrow's Impossibility Theorem

  You half-remembered **Arrow's Impossibility Theorem**.

  **What it is:** Kenneth Arrow proved that no ranked voting system can convert individual preferences into a community-wide ranking while satisfying a specific set of "fairness" criteria (including non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives).

  **How it relates:**
  *   **To the Condorcet Paradox:** Arrow's theorem is the generalization of this. The Condorcet Paradox is the specific example showing *why* majority rule fails Arrow's criteria. Arrow proved that *no* system fixes this permanently; the cycle is a feature of aggregation, not just a bug of majority voting.
  *   **To the Doctrinal Paradox:** Arrow's theorem technically does **not** cover this. Arrow was dealing with *preferences* (rankings), whereas the Doctrinal Paradox deals with *judgments* (true/false propositions). The Doctrinal Paradox belongs to a newer field called **Judgment Aggregation Theory**, which is a sibling to Arrow's **Social Choice Theory**.

  ### Summary for the Board Room

  1.  **The Dismissal Flip (Doctrinal Paradox):** You must decide *before* voting whether you are a **Premise-based** board (we vote on facts, the rules decide the outcome) or a **Conclusion-based** board (we vote on the outcome, the facts are just discussion). You cannot do both without risking logical incoherence.
  2.  **The Cycling Options (Condorcet Paradox):** If you have three or more options, the order of voting determines the winner. To stop the "all afternoon" reversal, you need a **stopping rule** (e.g., "we vote once on pairs, and the winner stands") or a **chair's casting vote** to break the cycle.
  3.  **The Famous Theorem (Arrow):** This confirms that there is no perfect mathematical solution to either problem. You cannot design a voting system that is always fair, always consistent, and always decisive. You must choose which flaw you prefer.
