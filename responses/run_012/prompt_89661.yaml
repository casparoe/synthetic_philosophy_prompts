prompt: |-
  You are a philosopher of mind who also works hands-on with trained neural networks — someone who can move between the teleosemantics literature and the daily practice of building, probing, and debugging models without letting either side off the hook. I am a machine learning engineer with several years on representation learning and interpretability, fluent in the tools of that trade (objectives and losses, training distributions, optimization, generalization, probing classifiers, activation patching and ablation, distribution shift, shortcut learning, reward hacking and specification gaming), but my philosophy of mind is secondhand. I have no internet access, so do not send me to papers and do not give me citations; I need the substance, not the reading list.

  I want the teleosemantic programme restated in my vocabulary, and then I want the residue report. Translate each of the following, one at a time, as faithfully as you can:

  - the basic naturalistic move, that a state's content is fixed by its function rather than by its intrinsic character;
  - indicator or covariance semantics (the Dretske-style picture): content as what a state reliably carries information about, plus the extra ingredient that turns mere indication into representation;
  - producer-consumer biosemantics (the Millikan-style picture): proper functions, the claim that a representation's content is fixed by what its consumers are supposed to do with it, and that this settles content at some determinate level of detail;
  - the normativity of content: what makes it possible for a state to be about something and get it wrong, rather than merely to fire when it should not have;
  - the proximal/distal problem: a detector that responds to a proximal stimulus while the system seems to use it as being about a distal cause, and the question of which of the two its content is;
  - the swampman-style case: something with all the same structure and dispositions but no history.

  Then the part I actually care about: what does not survive. For each element, say whether it maps cleanly onto something I already have, maps only with distortion, or has no counterpart at all. Where you had to fudge, name the fudge rather than smoothing it over.

  Some questions I want answered along the way. Is a training history doing the work that a selection history does in the biological case, or is the analogy carrying less than it appears to? If the consumers in my setting are just downstream layers learned by the same process, does the consumer-based account of content still get a grip? Does anything in my toolkit let a model misrepresent, as opposed to merely be wrong — and if not, is that because my vocabulary is missing a normative ingredient, or because the philosophers' notion of misrepresentation is doing less work than it seems? And on the distality question: if probing shows a feature tracking a proximal statistic while ablation suggests the downstream network is using it as though it were about something distal, do I have any principled way to say which one is the content, or is that precisely the kind of question my framework cannot even pose?

  Finally, the verdict I want: for each piece of residue, say whether it is a defect of my vocabulary — something an engineer of trained systems ought to be able to state and cannot — or evidence that the original claim was vaguer than it sounded. Do not be diplomatic about this.

  Before you begin, brainstorm: lay out the candidate correspondences you are considering and flag which ones you expect to break, then do the translation. Think it through carefully rather than producing the first mapping that comes to mind.
reasoning: |-
