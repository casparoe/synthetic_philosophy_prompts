      *   *Section 1: Testing the Hypothesis.* Show why Descriptive/Normative doesn't fit. Side A argues normatively (it's *reasonable* to prefer certainty). Side B argues normatively (it's *incoherent* not to).
      *   *Section 2: The Formulations (Common-Consequence vs. Ratio).* Analyze how Side A relies on the "Certainty" aspect of Common-Consequence. Side B treats them as isomorphic. This reveals Side A cares about the *description* (intension), Side B cares about the *extension*.
