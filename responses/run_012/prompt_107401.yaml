      *   **Side A (The Allais Defenders):** Their core claim is *Coherence as Sensitivity to Structure*. The "common consequence" isn't psychologically or normatively irrelevant. Certainty has a special value (security). Regret matters. They argue that the *description* of the gamble matters (is it a "sure thing" or a "99% chance"?). They reject the idea that dynamic consistency is the *only* form of rationality (resolute choice).

