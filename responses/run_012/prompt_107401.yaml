      *   Side B assumes *Extensionality*: Choices should depend only on the probability distribution over final outcomes. If two prospects map to the same distribution, they are the same.
      *   Side A assumes *Intensionality*: Choices depend on *how* the distribution is generated (the structure of the tree, the presence of certainty, the potential for regret).
      *   The "Sure-Thing Principle" is the battleground. Side B sees it as a logical truth (like transitivity). Side A sees it as a substantive ethical/psychological claim that ignores the value of security/regret.
