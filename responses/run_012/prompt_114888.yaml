      *   *Upstream Question:* What *is* the derogatory content? (The "Nagging Distinction").
      *   *Midstream Question:* How does context (negation, report, reclamation) modulate it? (Projection/Context).
      *   *Downstream Question:* Specific classifier architecture or detailed taxonomy of specific slurs.
