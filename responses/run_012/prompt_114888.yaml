      *   *The Problem:* These are often treated as isolated puzzles. For a dissertation + NLP impact, they need to be integrated into a system that explains *use* and *harm*.
      *   *The NLP Angle:* Classifiers struggle with context (reclamation, negation, reported speech). They often treat slurs as toxic tokens regardless of context. A semantic/pragmatic theory that clarifies *when* a slur is operative vs. *when* it is mentioned/quoted/reclaimed is directly useful.
      *   *The Philosophical Angle:* The nature of derogatory content. Is it cognitive (belief) or practical (norm/action)?

  3.  **Address the "Nagging Distinction" (Standing Meaning vs. Licensing):**
      *   *Option A:* Reclamation changes meaning (semantic shift).
      *   *Option B:* Reclamation changes licensing norms (pragmatic/social shift), meaning stays derogatory.
      *   *My Task:* Pick one.
      *   *Reasoning:* If meaning changes (A), then the word *stops* being a slur for the in-group. This makes modeling hard (polysemy). If licensing changes (B), the word retains its dangerous potential, which explains why out-group use is still harmful and why classifiers should be wary. However, for NLP, distinguishing "in-group use" from "out-group use" is the hard part.
      *   *Decision:* I need to argue for **Option B (Licensing/Norms)** as the primary driver, but with a twist. The "meaning" (derogatory content) is stable, but the *felicity conditions* shift. Why? Because it explains the coexistence of uses better (as the user noted) and aligns better with the NLP problem (contextual safety vs. token safety). If it were just meaning change, an NLP model could just learn a new sense. But the risk remains. This makes the *normative* status upstream of the *semantic* status.
      *   *Refinement:* Actually, for a 2-year dissertation, arguing that the distinction is *real* and *primary* is the strongest move. It dissolves the "reclamation paradox." I will argue that the derogatory content is a **normative commitment** triggered by use, not a static truth-conditional property. This makes "Licensing" upstream of "Truth Conditions."

  4.  **Develop the 2-Year Agenda (Prioritization):**
