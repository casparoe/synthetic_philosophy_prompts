answer: |-
  Dear Colleague,

  You have asked me to set aside the psychological explanations that have long dominated the discourse surrounding the Kitty Genovese case and to treat the episode, as it is popularly remembered, as a stress test for the ethics of supererogation. This is a fruitful constraint, for it forces us to confront the normative structure of our moral expectations rather than the psychological mechanisms of their failure. My position is this: if we accept the popular narrative that the neighbors could have intervened at little risk to themselves, the framework of supererogation does not protect them. Their inaction was not a failure to be heroic; it was a failure to meet a basic moral duty. The Genovese case does not destroy the category of the supererogatory, but it does expose the instability of the boundary line, suggesting that the category collapses into obligation whenever the cost of action is negligible relative to the harm prevented. However, the framework remains genuinely silent on the precise metric of that cost, leaving us with a structural definition of duty that requires external moral intuition to populate.

  Let us begin by running the theory onto the case. The concept of supererogation is designed to carve out a space for moral excellence that exceeds what is strictly required, preserving a realm of liberty where agents are permitted to prioritize their own interests without moral blame. If an act is supererogatory, failing to perform it entails no wrongdoing. However, this permission is contingent on the act lying beyond the call of duty. The crucial variable here is the cost of intervention. In the popular imagination of the Genovese case, the neighbors were not asked to wrestle a knife-wielding attacker to the ground; they were asked to pick up a telephone or shout from a window. If we assume, as your prompt directs, that the risk was small and the effort minimal, then the act of rescue falls below the threshold of saintliness. It enters the realm of the obligatory. To classify such an act as supererogatory would be to stretch the concept until it snaps, for it would imply that a human life is worth less than the minor inconvenience of a phone call. Therefore, the supererogation framework, properly understood, does not license the neighbors' inaction. It suggests that when the cost to the agent is trivial and the benefit to the recipient is existential, the act shifts from the optional to the required. The neighbors were not unheroic; they were morally negligent.

  This brings us to the second direction of our analysis: what the case tells us about the theory. There is a persistent suspicion that supererogation is an unstable category, particularly when faced with high-stakes scenarios like this one. The worry is that if we acknowledge a moral reason to save a life, and we acknowledge that the cost is low, logic dictates we must save the life. To say one "ought" to do it but is "permitted" not to seems contradictory. The Genovese case lends weight to the view that the supererogatory label collapses into duty when the disparity between cost and benefit is sufficiently large. If we maintain that calling the police was supererogatory, we imply that morality is fundamentally optional in the face of preventable death, which renders the moral law impotent. Yet, if we swing too far the other way and declare all rescue obligatory, we risk a morality that is intolerably demanding, requiring us to sacrifice our lives and projects whenever the utility calculus demands it. The Genovese episode helps stabilize the category by showing us where the floor should be. It suggests that supererogation is a genuine and stable category, but only if we accept that the baseline of duty includes easy rescue. The category does real work for acts involving significant risk or sacrifice, such as rushing into a burning building, but it cannot be used to shield agents from trivial inconveniences when life is at stake.

  However, I must acknowledge where the framework remains silent. While the structure of supererogation tells us that duties are mandatory and supererogatory acts are optional, it does not itself calculate the exchange rate between risk and obligation. The theory does not contain a formula to determine exactly how much risk transforms a duty into a supererogatory act. Is it a ten percent chance of injury? A specific dollar amount? A certain level of emotional distress? The Genovese case highlights this indeterminacy. We feel intuitively that shouting from a window is obligatory, whereas confronting the attacker is not, but the supererogation framework itself does not generate this distinction; it merely accommodates it once we have drawn the line. This silence is not a defect but a feature, as it allows the theory to adapt to different cultural and contextual understandings of risk. Nevertheless, it means that appealing to supererogation cannot solve the dispute without first agreeing on the content of the duty. If the neighbors genuinely believed their lives were at risk, the framework would classify intervention as supererogatory, and their inaction would be permissible. But since we are operating under the assumption that the risk was small, the framework's silence on the exact metric does not save them; it only requires us to agree that a phone call is not a significant sacrifice.

  Ultimately, the Genovese case argues against a morality that treats all rescue as optional. If we defend the neighbors by calling their potential intervention supererogatory, we undermine the binding force of moral requirements in the very contexts where they seem most urgent. The category of supererogation is indispensable for protecting agents from excessive demandingness, ensuring that morality leaves room for ordinary life and personal projects. But it cannot be used to legitimize indifference when the cost of moral engagement is negligible. The neighbors' failure was a failure of nerve, certainly, but normatively it was a failure to fulfill a duty of easy rescue. The supererogatory framework survives this test, but only if we are willing to admit that its boundary is not a shield for inaction, but a line marking the transition from what we owe each other to what we might generously give. In this light, the popular memory of Genovese serves not as a puzzle about why people fail to be saints, but as an indictment of their failure to be minimally decent citizens. The theory holds, but it demands more of us than we often wish to admit.

  Yours,

  A Colleague
