  The Inventory

  The letter from the clinic sat on the laminate table, weighted down by a mug of cold tea. Mark stared at the bold print near the bottom. *Annual Storage Fee Due.* Below that, the number: three.

  Three embryos. They had names in the clinic's database, alphanumeric codes that felt heavier than actual names. E-4, E-7, E-9. Their daughter, Claire, was E-2. She was asleep upstairs, breathing in the rhythmic way that made Mark check the monitor every twenty minutes.

  Sarah came into the kitchen, tying the belt of her robe. She saw the letter and didn't sit down. She leaned against the counter, arms crossed.

  "We need to decide, Mark," she said. "The fee is one thing. But we can't keep them forever."

  "I know."

  "Donation is still on the table. The couple on the waiting list… they've been trying for six years."

  Mark rubbed his thumb over the rim of the mug. "If we give them away, who grows up?"

  Sarah sighed, the sound sharp in the quiet room. "We've been over this. They aren't people yet. They're cells. Frozen cells."

  "David isn't just cells."

  "David is your brother. He's thirty-four years old. What does he have to do with E-7?"

  "Everything," Mark said. He pushed the letter aside. "When the test came back in March, the lab called us. They thought they'd swapped the samples. His saliva said he was one thing. His blood said he was another. Two different genetic profiles. From the same man."

  "Because he's a chimera. We know this." Sarah's voice was tired. She had heard the story at every family gathering since spring. "Two eggs, two sperm, fused together when he was the size of a poppy seed. It happens."

  "It happens," Mark repeated. "So he started as two. And he became one. Or did he? When I look at him, am I looking at one person or two people who never finished separating?"

  "You're looking at David. He pays taxes. He drives a car. He's one person."

  "But if those two eggs hadn't fused," Mark said, leaning forward, "if they had stayed separate, there would be two brothers. Instead there's David. So where did the other one go? Did he die? Or is he just… hidden inside the blood?"

  Sarah uncrossed her arms and finally sat in the chair opposite him. "You're trying to say that because David is two-in-one, these embryos are people waiting to happen."

  "I'm saying biology isn't a straight line. Claire was one of four. We picked E-2 because you had a meeting in Chicago and couldn't do the transfer until Tuesday. If we had done Monday, maybe it was E-4. Would that baby be Claire?"

  "It would be our child."

  "Would it be *her*?" Mark asked. "Or would it be someone else who just happened to look like her, sound like her, have her laugh?"

  Sarah looked at the stairs, as if she could see through the ceiling to the sleeping child. "You're asking if Claire could have been someone else."

  "I'm asking if *someone else* could have been Claire."

  "That's not a difference that matters," Sarah said. "She is here. She is who she is."

  "But she wasn't always here. There was a time when she was just a possibility. And there are three possibilities left in that freezer two hours away." Mark tapped the letter. "If we donate E-7, and a woman gives birth to him… or her… ten years from now, is that child my son? Is he Claire's brother? Or is he a stranger who just happens to share half my DNA?"

  "He's a stranger," Sarah said firmly. "He shares DNA. He doesn't share us. He doesn't share this kitchen. He doesn't share the way you hum when you're fixing a leaky faucet. That's what makes him a person. Not the code in the cells."

  "David's cells don't even agree with each other," Mark said. "Which part of him is the real him? The part that came from the egg that wanted to split, or the part that wanted to fuse?"

  "You're hurting yourself with this," Sarah said. Her voice softened. "You want there to be a single thread. A start point that matches the end point. But people aren't made like that."

  "Neighbors' kids," Mark said. "The twins."

  "Leo and Sam."

  "One egg," Mark said. "One start. Then it split. Same DNA. Completely different people. Leo likes math. Sam can't sit still. If one egg makes two people, then the person isn't in the egg. So where is it?"

  "In the living," Sarah said. "It's in the doing. You're looking for a seed and expecting to find the tree inside it. But the tree is what happens when the seed meets the dirt and the rain."

  "But the seed matters," Mark insisted. "Look at Jason's boy."

  Sarah frowned. "Jason from work?"

  "Their son. Conceived last year. They used the procedure. The nuclear transfer."

  "The three-parent thing," Sarah said. She remembered the news cycle, the hushed conversations about mitochondria.

  "Jason's wife's nucleus. Put into a donor egg because her own mitochondria were faulty. The donor's nucleus was removed. So the boy has Jason's DNA, his wife's DNA, and the donor's energy plants. The mitochondria. She's invisible. Her name isn't on the birth certificate. But she's in every cell of that boy's body. He carries her line. If mitochondria make us who we are, then he's partly a woman he'll never meet."

  "He's Jason's son," Sarah said. "Nobody doubts that."

  "I doubt it," Mark said. "I doubt that any of us are single things. We're composites. We're selections. We're accidents of schedule." He gestured to the letter. "Claire exists because of a work calendar. David exists because of a fusion event. The twins exist because of a split. And these three…" He touched the paper again. "They exist because we stopped paying for a while, then started again. They are waiting on a thaw schedule."

  "So what do you want to do?" Sarah asked. "Do you want to keep them? Do you want to bring them here so you can watch them become people and verify that they match the code?"

  "I want to know if we're allowed to give them away," Mark said. "If E-7 is a person, we're giving away a child. If E-7 is just tissue, we're helping a family. I need to know which one it is."

  "You can't know," Sarah said. "There isn't a test for that. The DNA test didn't even work on David."

  "It worked too well," Mark corrected. "It found too much."

  They sat in silence. The refrigerator hummed, a low mechanical vibration that seemed to shake the table. Upstairs, Claire shifted in her sleep. A floorboard creaked.

  Sarah reached out and covered Mark's hand with hers. Her skin was warm. "When I was pregnant with Claire, I worried about everything. The food, the air, the water. I thought if I controlled the inputs, I'd get the output. I'd get *her*."

  "And?"

  "And she came out screaming," Sarah said, a small smile touching her lips. "She wasn't a project. She was a demand. She didn't care about the embryos in the freezer. She cared about milk and warmth."

  "The embryos don't care either," Mark said. "That's the problem. They don't care if they thaw or stay frozen. So the care has to come from us. But how do we care for something we can't define?"

  "We treat them with respect," Sarah said. "We don't throw them in the trash. We donate them to people who want them. We let them have a chance to become trees. Even if we never see the leaves."

  "And if they become people like David?" Mark asked. "People who are two things at once? People who carry lines from strangers?"

  "Then they're like everyone else," Sarah said. "Look at us. You have your mother's temper. I have my father's hands. We are mixtures. We are histories. Claire is a mixture. She's you and me and the doctor who picked E-2 and the nurse who warmed the tray."

  Mark looked at the letter. The number three stared back.

  "I just keep thinking about the other one," Mark said quietly. "Inside David. The one whose blood he has. Did it want to be born? Did it have a name?"

  "David is the name," Sarah said. "He's the one who answered the phone. He's the one who cried when the doctor explained it. He's the one living with it."

  "But he's not whole."

  "Nobody is," Sarah said. She stood up and picked up the cold mug. "We're all patched together. Some of us just have the receipts."

  She walked to the sink and turned on the tap. The water rushed out, loud and clear. Mark watched her back. He thought about the freezer in the clinic, the liquid nitrogen hiss, the plastic straws holding the potential for life suspended in cold. He thought about the donor woman whose mitochondria powered a child who would call someone else 'Mom.' He thought about the twins next door, identical but diverging, walking down different paths from the same start.

  He picked up the pen. He hovered it over the checkbox on the form. *Authorize Donation.* *Continue Storage.* *Dispose.*

  The pen didn't move. The water stopped running. Sarah dried her hands and waited. She didn't look at the form. She looked at Mark.

  "Claire will be up in an hour," she said. "She wants pancakes."

  "Blueberries?"

  "If we have them."

  "We have them."

  Mark put the pen down. He didn't check the box. He folded the letter and slipped it into the drawer beside the takeout menus. He stood up and walked to the stairs. He needed to check the monitor. He needed to hear the breathing. He needed to know that whatever she was, however she started, she was there.

  Sarah watched him go. She looked at the drawer where the letter disappeared. She knew he would take it out again tomorrow. She knew they would have the same conversation next month, and the month after. She turned off the kitchen light and went to find the blueberries.
