answer: |-
  Here is the principle that best fits your verdicts, followed by the audit you requested.

  ### The Principle: Non-Commodified Civic Reciprocity

  **Statement:**
  A political community may compel service necessary for its continuity from all beneficiaries, provided that:
  1.  **Universality:** The liability is universal across classes and genders, ensuring that the burden of risk is not segregated by status.
  2.  **Non-Commodification:** The distribution of risk is determined by public law (lottery or universal rule) rather than private wealth or market forces, preventing the rich from buying safety or the poor from selling risk.
  3.  **Administered Equity:** Exemptions or alternatives are permitted only for incapacity or conscience, and only if the alternative burden is set by the state to preserve the sacrificial character of the duty.

  ---

  ### Why Each Clause Is There (and What It Excludes)

  **Clause 1 (Universality)**
  *   **Work done:** Justifies (1) Swiss universal liability, (3) Pure lottery, (4) Gender neutrality, (13) Armed neutrality (self-reliance). It grounds the intuition that defense is a shared fate.
  *   **Case that forces it:** Your rejection of (10) Foreign mercenaries. If liability were not tied to beneficiary status, hiring foreigners would be permissible. This clause ties risk to citizenship/benefit.
  *   **Case it gets wrong:** It struggles with (14) Costa Rica. If a country gives up its army, it violates the "compel service... for continuity" premise. However, you call this "admirable," suggesting the principle permits a state to *choose* vulnerability, just not to *free-ride* on others (Iceland/Japan). The principle holds: you may disarm, but you may not outsource your security to a patron while claiming sovereignty.

  **Clause 2 (Non-Commodification)**
  *   **Work done:** This is the engine of your view. It explains why (3) Lottery is better than (8) Volunteer force (market coercion), why (9) Substitutes are unjust (wealth buys safety), and why (10) Mercenaries are unjust (risk is traded for cash). It distinguishes the state from the market.
  *   **Case that forces it:** Your verdict on (8). A volunteer army that draws the poor is "worse" than a lottery that coerces the well-off. Only a non-commodification clause explains why economic coercion is worse than legal coercion in this specific context.
  *   **Case it gets wrong:** It creates tension with (11) Skill-based conscription. If universality means "everyone does the same," calling up only surgeons violates the spirit of shared risk. However, Clause 2 saves it: surgeons are not bought; they are compelled by law like everyone else. The distinction is *skill*, not *wealth*.

  **Clause 3 (Administered Equity)**
  *   **Work done:** This allows for the "imperfections" you accept. It justifies (2) Unfit levy (incapacity), (5) Conscientious Objection (conscience + sacrifice), and (11) Skill call-up (necessity). Crucially, it demands that the alternative burden remains a *burden*.
  *   **Case that forces it:** Your acceptance of (5) Longer alternative service. If the principle were pure equality, CO would be impossible. If it were pure liberty, CO would be exempt without cost. This clause explains why the service must be *longer*: to maintain the "sacrificial character."
  *   **Case it gets wrong:** It condemns your unease in (15). The levy option in your current country's debate allows the unwilling to pay 1% of income. For the wealthy, this is not a sacrifice; it is a fee. This violates the "sacrificial character" requirement.

  ---

  ### One Principle or Two?

  This is **one principle** with three necessary conditions. Splitting them would weaken the account.
  *   If you separate *Universality* from *Non-Commodification*, you cannot explain why a universal volunteer army (where everyone *could* join but only the poor *do*) is worse than a lottery.
  *   If you separate *Administered Equity*, you cannot distinguish between the Swiss unfit levy (2) and the Civil War substitute system (9). Both involve money. The distinction is that (2) is a state-set tax on incapacity, while (9) is a market price on unwillingness.

  The single unifying thread is **Anti-Domination**. You reject arrangements where one citizen can dominate another by transferring risk to them via wealth (9, 8), status (10), or political privilege (6). You accept arrangements where the state treats all as equals, even if that requires coercion (3) or unequal burdens for the sake of survival (11), provided the rules are public and universal.

  ---

  ### Verdicts on Two New Cases

  **Case A: Mandatory Voting (Close Case)**
  *   *Scenario:* A state introduces compulsory voting with a small fine for non-attendance, but allows a "do not vote" option on the ballot.
  *   *Verdict:* **Permissible.**
  *   *Reasoning:* This fits Clause 1 (Universality) and Clause 2 (Non-Commodification). It treats political participation as a civic duty akin to defense, not a market choice. The fine is administrative, not a "price" to buy out of democracy (since the "do not vote" option preserves the liberty of choice within the duty of attendance). It aligns with your view on (1) and (3): the duty is to show up and share the burden of governance, not necessarily to choose a specific outcome.

  **Case B: Algorithmic Conscription (Edge Case)**
  *   *Scenario:* A state requires all citizens to submit to a neural interface that allows the state to use their idle computing power (or cognitive surplus) for defense logistics during a crisis, but exempts those who pay a high licensing fee for their hardware.
  *   *Verdict:* **Impermissible.**
  *   *Reasoning:* This fails Clause 2 (Non-Commodification). While the "service" is low-risk, the exemption is priced. This creates a class of citizens whose resources are immune to public claim because they can pay. It replicates the injustice of (9) Substitutes and (15) Levy. Even if the risk is low, the principle that public necessity trumps private wealth is violated.

  ---

  ### Audit of Your Verdicts

  **Which verdicts the principle accommodates:**
  *   **Strong Fit:** (1), (3), (4), (8), (9), (10), (13). These are the core of the principle.
  *   **Good Fit:** (2), (5), (11). These fit under the "Administered Equity" clause, provided the "sacrifice" is maintained.
  *   **Explained Tension:** (6) vs (7). The principle explains why Individual CO (5) is allowed (conscience is internal/incapacity of will) but Selective CO (7) is not (political judgment is external). Selective objection claims the citizen knows better than the polity what constitutes defense; this violates Reciprocity. Group exemptions (6) violate Universality by creating a privileged class.

  **Which verdicts the principle cannot accommodate:**
  *   **The Problem:** (15) The Levy Option.
  *   **The Conflict:** You approve of the lottery in (15) but are "uneasy" about the levy. The principle demands you **reject the levy**.
  *   **Why:** The levy in (15) is for the *unwilling*, not the *unfit* (as in 2). It allows a citizen to opt out of a shared civic burden via payment. Even if capped at 1%, it transforms a duty into a tax. For a high earner, 1% is negligible; for a low earner, it is a hardship. This violates Clause 2 (Non-Commodification) and Clause 3 (Sacrificial Character). It turns the system into a "rich man's escape," which you rightly condemned in (9).

  **Which verdict you should abandon:**
  *   **Abandon:** The approval of the **levy option in (15)**.
  *   **Why:** It is the only verdict that contradicts your clear condemnation of (9) Substitutes and (8) Exploitative Volunteers. In (2), the levy is on *incapacity* (you physically cannot serve). In (15), the levy is on *unwillingness*. If you allow unwillingness to be cured by payment, you validate the principle that wealth confers immunity from civic risk. This undermines the legitimacy of the lottery itself, as the lottery becomes a tax on those too poor to pay the levy.
  *   **Recommendation:** Keep the lottery in (15), demand the removal of the levy. If citizens must serve, they must serve. If they cannot serve (incapacity), they pay (2). If they will not serve (conscience), they do alternative labor (5). If they simply will not serve (unwillingness), they should face penalty, not a price tag.

  ### Summary Advice

  You do not need to give up your core intuition that coercion is preferable to exploitation. Your tentative principle was close but too rigid regarding "equal shares." The **Non-Commodified Civic Reciprocity** principle allows for necessary inequalities (skill, conscience, incapacity) while forbidding market inequalities (wealth, poverty).

  Your unease about (15) is your moral compass working correctly. The distinction you guessed at ("state sets the price" vs "market sets the price") is real, but insufficient. The deeper distinction is **Incapacity/Conscience vs. Unwillingness/Wealth**. The state may price incapacity; it may not price unwillingness. Abandon the levy in (15), and your fifteen verdicts hang together.
