answer: |-
  Here is a lesson plan designed for your forty-minute slot, tailored to the constraints and the specific epistemic profile of your audience.

  ### 1. The Core Example: Verdict on Your Draft

  **Do not use the Coach/York pair.** Your intuition is correct: it conflates temporal distance with modal status. In your indicative ('If the coach leaves...'), the antecedent is future and open. In your counterfactual ('If the coach had left...'), the antecedent is past and closed. If students sense a difference, they will attribute it to the time (prediction vs. retrodiction) rather than the logical operator. You will spend twenty minutes untangling tense from mood, and you will run out of time.

  **What a replacement must have and lack:**
  *   **Have:** A fixed factual background where the antecedent is known to be false (to satisfy the counterfactual presupposition) but where the indicative remains assertible.
  *   **Lack:** Any ambiguity about *when* the event occurred. Both sentences should refer to the same time slice.
  *   **Have:** Divergent truth values. The pair must be such that a rational speaker could accept one as true and the other as false.

  **The Recommended Example (The Adams Pair):**
  Use the classic example from Ernest Adams, sanitised if you prefer to avoid assassination references. Let us use a **Crime Scene** variant.

  *   **Context:** We know for a fact that Smith was murdered by Jones. There was only one murderer.
  *   **Sentence A (Indicative):** "If Jones did not kill Smith, someone else did."
  *   **Sentence B (Counterfactual):** "If Jones had not killed Smith, someone else would have."

  **Why this carries the weight:**
  1.  **Time is constant:** Both refer to the past event.
  2.  **Facts are fixed:** We know Jones did it.
  3.  **Truth values diverge:** Almost everyone agrees Sentence A is **true** (since Smith was definitely killed, if not by Jones, then by another). Most agree Sentence B is **false** (Jones acted alone; there was no backup plan).
  4.  **The Lesson:** If 'if' were merely the material implication (truth-functional), both sentences would have the same truth value (since the antecedent 'Jones did not kill Smith' is false in both, making the material conditional vacuously true). The fact that we judge them differently proves 'if' is not truth-functional.

  ---

  ### 2. Sequence and Timing (40 Minutes)

  #### Phase 1: The Trap (0–5 mins)
  **Goal:** Dispel the 'grammar lesson' fear and activate the 'maths logic' schema.
  **Board:** Draw a standard truth table for $P \rightarrow Q$.
  **Action:**
  1.  State clearly: "This is not a session on English grammar. It is a session on logic and metaphysics. We are asking what makes a sentence *true*, not whether it is well-formed."
  2.  Remind them of the Material Implication rule they know from maths: A conditional is false *only* if $P$ is true and $Q$ is false. If $P$ is false, the whole thing is true.
  3.  **The Hook:** "If that truth table is the whole story, then logic cannot distinguish between reality and fantasy. I am going to show you that it can."

  #### Phase 2: The Divergence (5–20 mins)
  **Goal:** Establish that Indicative and Counterfactual have different truth conditions.
  **Board:** Write the Crime Scene pair (A and B) and the context (Jones did it alone).
  **Action:**
  1.  Ask for a show of hands: "Who thinks Sentence A is true?" (Expect nearly all).
  2.  Ask for a show of hands: "Who thinks Sentence B is true?" (Expect few/none).
  3.  **The Crucial Move:** Ask them to evaluate the antecedent ("Jones did not kill Smith").
      *   Is it true or false? (It is **false**).
      *   According to the truth table on the board, if the antecedent is false, the conditional is **true**.
      *   So, why did you mark Sentence B as false?
  4.  **Discussion:** Elicit that Sentence B requires us to imagine a *different world* where Jones doesn't kill Smith, and check if Smith still dies. Sentence A merely asks us to look at the *actual world* facts (Smith is dead) and reason from our ignorance.
  5.  **Takeaway:** The Indicative is about *epistemic possibility* (what follows from what we know). The Counterfactual is about *metaphysical possibility* (what follows in other possible scenarios).

  #### Phase 3: The Grammar/Time Misconception (20–30 mins)
  **Goal:** Head off the linguistic confusions before they solidify.
  **Board:** Write: "If it rained tomorrow..." vs "If it rains tomorrow..."
  **Action:**
  1.  **The Tense Trap:** Students will think the past tense in counterfactuals ('If it *rained*') refers to past *time*.
      *   **Correction:** Show them "If it rained tomorrow, the match would be cancelled." The tense is past, the time is future.
      *   **Rule:** In counterfactuals, the past tense marks *modal distance* (unreality), not *temporal distance*.
  2.  **The Likelihood Trap:** Students will think Indicative = Likely, Counterfactual = Unlikely.
      *   **Correction:** Use the Crime Scene again. We are 100% certain Jones did it. The Indicative is still appropriate ("If he didn't..."). It is not about probability; it is about whether we are holding the facts fixed or varying them.
  3.  **The Falsity Trap:** Students will think "Counterfactual means the antecedent is false."
      *   **Correction:** It *presupposes* falsity for assertibility, but the logical distinction holds even if we don't know the truth value yet. However, for this session, stick to the fixed-fact case to break the truth table.

  #### Phase 4: Exclusions (State these explicitly)
  **Goal:** Prevent scope creep.
  **Script:** "I am refusing to go into three things today, not because they are unimportant, but because they will confuse the core logical point."
  1.  **Possible Worlds Semantics:** "I will not be drawing diagrams of 'nearby worlds' (Stalnaker/Lewis). We are talking about truth conditions, not the machinery to calculate them."
  2.  **Probabilistic Logic:** "We are not discussing Adams' Thesis (that the probability of the indicative is the conditional probability). That is a different debate."
  3.  **Subjunctive Morphology:** "We are not analysing verb conjugations. 'If I were' vs 'If I was' is orthography; we are interested in the proposition expressed."

  #### Phase 5: The Live Puzzle (30–40 mins)
  **Goal:** End on a problem, not a solution.
  **Board:** Wipe the board. Write one word: **TRUTHMAKER**.
  **Action:**
  1.  Return to Sentence B ("If Jones had not killed Smith, someone else would have").
  2.  You established this is likely **false**. But what makes it false?
  3.  In Sentence A (Indicative), the truthmaker is in the room: Smith's dead body. The fact exists.
  4.  In Sentence B (Counterfactual), the antecedent never happened. Jones *did* kill Smith. There is no fact in the actual world about what happens if he *doesn't*.
  5.  **The Closing Question:** "If the antecedent of a counterfactual is false in the actual world, what **fact** makes the conditional true or false? If there is no such fact, are we just telling stories? If there is a fact, where is it?"
  6.  Dismiss them while this is hanging in the air. Do not answer it.

  ---

  ### 3. Misconception Management

  Here is how to handle the specific cluster of errors you anticipated. Note which are real and which you should avoid planting.

  | Misconception | Status | When to Head Off | How to Head Off |
  | :--- | :--- | :--- | :--- |
  | **"This is a grammar lesson."** | **Real Risk.** | **Minute 1.** | Explicitly frame it as Logic/Metaphysics. Use the whiteboard for truth tables, not sentence diagramming. |
  | **"Counterfactual = Antecedent is False."** | **Real.** | **Minute 25.** | Clarify that falsity is a *pragmatic presupposition*, not the *semantic definition*. We use counterfactuals for things we know are false, but the logic is about the connection, not the fact. |
  | **"Past tense means Past time."** | **Real.** | **Minute 20.** | Use the "If it rained tomorrow" example. Show that tense signals *remoteness from reality*, not remoteness in time. |
  | **"Indicative = Likely / Counterfactual = Unlikely."** | **Planting Risk.** | **Minute 25.** | Do not introduce likelihood yourself. If they raise it, refute it using the Crime Scene (where probability is 0 or 1). |
  | **"Indicative is Logical / Counterfactual is Loose."** | **Real.** | **Minute 15.** | Show that the Counterfactual is often *more* rigorous (causal laws) than the Indicative (which can be based on mere correlation). |
  | **"Both are Material Implication + something."** | **Real.** | **Minute 15.** | The Crime Scene pair proves they cannot both be Material Implication, as they have different truth values with the same inputs. |

  **Warning:** Do not mention "politeness" or "hedging" (e.g., "If I could ask a question..."). This is a pragmatic use of the form that will distract from the semantic core. If a student raises it, acknowledge it as a separate linguistic phenomenon and park it.

  ---

  ### 4. The Final Assessment Question

  You asked for one question to show the distinction has landed. This should be posed just before the "Live Puzzle" phase, as a check-in.

  **The Question:**
  > "I have a sealed envelope containing the result of a coin toss that happened five minutes ago. Heads or Tails. I haven't opened it.
  >
  > 1.  If I say: 'If the coin is Heads, I win.'
  > 2.  And you say: 'If the coin had been Tails, you would have lost.'
  >
  > **Are we making the same kind of claim about the world? If the coin turns out to be Tails, was my sentence false?**"

  **What to listen for:**
  *   **Failure:** They say "Yes, your sentence was false because the antecedent was false." (They are stuck on Material Implication).
  *   **Success:** They hesitate. They realise your sentence (Indicative) was based on the *rules of the game* (epistemic), whereas the antecedent's falsity doesn't retroactively make your claim false in the same way a counterfactual fails. Or, more precisely, they should recognise that your indicative is evaluated relative to the *information state before opening*, whereas the counterfactual is evaluated relative to *causal laws*.
  *   **Ideal Answer:** "Your indicative was assertible then, even if false now. The counterfactual is about a world that doesn't exist."

  ### 5. Summary of Dependencies

  1.  **Truth Tables** must be established first (Phase 1) so you have a foil to attack.
  2.  **The Crime Scene Example** (Phase 2) depends on them accepting the background facts (Jones did it). State this firmly.
  3.  **The Tense Correction** (Phase 3) depends on them having seen the form in Phase 2. Do not explain tense before showing the logical divergence.
  4.  **The Truthmaker Puzzle** (Phase 5) depends on them accepting that Counterfactuals have truth values (True/False). If they think Counterfactuals are just "opinions", the puzzle fails. Insist in Phase 2 that Sentence B is *false*, not just "unlikely".

  ### 6. Final Advice for the Chair

  *   **Control the Board:** Do not let the students fill the whiteboard with examples. You write the pair; they analyse it. If they suggest new examples, write them in the margin but return immediately to the Core Pair.
  *   **Silence is Fine:** When you ask the Truthmaker question at the end, let the silence sit for ten seconds. If you fill it, you rob them of the philosophy.
  *   **British English:** Ensure you say "maths" not "math", and spell "analyse" with an 's'. If you refer to the "subjunctive", acknowledge that English grammar is poor at marking it, which is why we use "counterfactual" as the logical term.

  This plan respects their mathematical background while dismantling the assumption that logic is merely calculation. It leaves them with the correct distinction (truth conditions diverge) and the correct remaining problem (what grounds those conditions?). Good luck.
