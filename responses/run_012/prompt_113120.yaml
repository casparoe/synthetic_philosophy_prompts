answer: |-
  To compare these accounts, we must first distinguish the three phenomenological components of pain often conflated in ordinary discourse. First, there is the **sensory quality**: the throbbing, burning, or stinging location and character of the sensation. Second, there is the **felt awfulness** (or affective valence): the suffering, the "ouch," the negative hedonic tone that makes the sensation something to dislike. Third, there is the **motivational pull**: the urge to withdraw, protect, or stop the sensation.

  With these distinctions in hand, we can identify the bearer of badness for each account. The first account (the **Hedonic View**) locates the badness entirely in the **felt awfulness**. On this view, "bad for the subject" and "feels bad to the subject" are co-extensive; if the experience lacks negative affect, it constitutes no harm. The second account (the **Imperative View**) locates the badness in what the pain **presents and commands**: it represents bodily damage as a threat and issues a command to act. Here, the bearer of badness is the **threat/command content**. This view allows for a gap between what "feels bad" (phenomenology) and what is "bad for" the subject (welfare); a pain can be bad for you because it signals danger, even if you do not mind the feeling.

  ### The Test Case: Pain Asymbolia

  Pain asymbolia presents a dissociation: patients retain the **sensory quality** (they can identify the location and intensity of a prick or burn) but lack the **felt awfulness** and the **motivational pull** (they report it doesn't bother them and make no move to withdraw).

  **The Hedonic View** is naturally supported by this case. Since the bearer of badness is the felt awfulness, and the asymbolic patient experiences none, the Hedonic View concludes the pain is not bad for them. The evidence requires no redescription; it accepts the patient's report that they are untroubled as proof that they are unharmed *by the pain*. The harm of pain just *is* the suffering, and the suffering is absent.

  **The Imperative View** faces a challenge here and must accommodate the evidence by redescribing the normative status of the patient's condition. Because this account locates badness in the threat/command, it must argue that the pain remains bad for the subject even if the awfulness is gone. It does this by shifting the focus from the subject's immediate phenomenology to their objective welfare. The Imperative View argues that the asymbolic patient is *worse off* because they are ignoring a bodily threat, even if they do not feel distressed. The pain's badness survives the loss of awfulness because the *damage* it signals is still bad for the organism. Consequently, the Imperative View must redescribe the asymbolic's indifference not as evidence of harmlessness, but as evidence of a broken warning system that leaves the subject vulnerable. It insists the pain is still bad *for* them, despite not feeling bad *to* them.

  ### The Hypothetical Case: The Unfelt Command

  We now press both accounts with a case the clinic does not supply: a subject whose pain retains its **sensory quality** and its **motivational pull** (they are driven to act to stop it) but loses every trace of **felt unpleasantness**. They act as if in pain, protecting the limb, but report no suffering.

  **The Hedonic View** struggles to make this state intelligible. Since it treats felt awfulness as the sole bearer of badness and the source of motivation, it cannot easily explain why a subject would be motivated to escape a sensation that does not feel bad. To accommodate this, the Hedonic View would likely have to deny the description: it would argue that if there is a motivational pull to escape, there *must* be some hidden unpleasantness, or else the behavior is merely reflex, not pain. If forced to accept the description, it must conclude the pain is not bad for the subject. This creates a paradox: the subject is driven to act as if harmed, yet the theory says they are not harmed. The Hedonic View collapses the distinction between "feels bad" and "bad for," so if it doesn't feel bad, it cannot be bad for them, rendering the motivational pull irrational or inexplicable.

  **The Imperative View** makes this state intelligible. Because it separates the command (motivational pull) and the representation of threat from the hedonic tone, it can accommodate a pain that commands without hurting. On this view, the **motivational pull** is the manifestation of the imperative content ("Stop this!"), which can theoretically function independently of the **felt awfulness** (the "volume" of the alarm). In this hypothetical case, the alarm is flashing and triggering action protocols, but the siren is muted. The Imperative View implies that such a pain *is* bad for the subject. Why? Because the bearer of badness is the threat/command, both of which are present. The subject is being commanded to act against a threat, which constitutes a harm or a negative demand on their agency, even if the experience lacks negative affect. This case drives a wedge between "feels bad" and "bad for": the pain does not feel bad, but it is bad for the subject because it signifies damage and constrains their agency with a demand to act.

  ### Conclusion

  The comparison reveals a fundamental divergence in how the two accounts value phenomenology versus function. The Hedonic View privileges the subject's conscious experience: if it doesn't hurt, it isn't bad. It fits pain asymbolia well but fails to explain a pain that motivates without hurting. The Imperative View privileges the biological and normative function of pain: if it signals damage and demands action, it is bad. It struggles to accept the asymbolic's indifference as evidence of well-being but successfully makes intelligible a pain that drives action without suffering. Ultimately, the Imperative View sustains a robust distinction between what is *bad for* a subject (objective threat/demand) and what merely *feels bad* (subjective affect), whereas the Hedonic View collapses the two, rendering it vulnerable to cases where motivation and affect come apart.
