      *   *Decision:* I need to be careful here. Account 2 is usually the "Imperative Theory" (e.g., Bain, Klein). They argue pain is an imperative. If the imperative is not felt as urgent (asymbolia), is it still a pain?
      *   *Let's stick to the prompt's framing:* Account 2 says badness is in what pain *presents* (threat) AND *commands*. It claims badness survives loss of awfulness.
