          3.  Name the Interval (Short-Run Non-Neutrality / Hume's "Interval").
          4.  Address Hume (Why he thought it was good, why you are skeptical).
          5.  Address the "Better Off" question (Capacity vs. Redistribution).
          6.  Address the "Physical Money" question (Money as a claim, not a thing).

      *   *Refining the Cantillon Section:* Make sure to distinguish between *new* money (printing) and *incoming* money (wages). The effect is the same locally.
      *   *Refining the Hume Section:* Hume's "Of Money." Quote the idea of the "middle situation." Explain that Hume assumed slack in the economy. If the town was at full capacity, Hume's benefit vanishes.
