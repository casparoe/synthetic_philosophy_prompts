prompt: |-
  I run a small shop in a town that has been transformed over the past five years: a large employer arrived, and with it a stream of newcomers and outside money. Since then I have watched a pattern I cannot name, and I have begun to wonder whether Hume, whom I am reading for the first time, described it long ago.

  The pattern is not simply that prices rose. It is that they rose in an order. The things newcomers buy — housing, meals, labour, services — rose first and rose most; the things we sell to one another rose later and less. For a while the town genuinely boomed, but the boom belonged to whoever was placed to sell to the newcomers early. For anyone on a fixed income, and for the trades that serve only their neighbours, those same years were a squeeze. And once local wages and prices had finished catching up, the boom was over: what remained was a town with the same houses, roads and skills as before, a different distribution of who held what, and a general sense of being back where we started.

  Two things I cannot get straight. First, I cannot answer the question of whether the town is better off. Every gain I can point to is somebody's loss and every loss somebody's gain, so the aggregate figures look splendid and I do not trust them. Is there a name for that whole configuration — outside money arriving, prices adjusting in a fixed order, a temporary real advantage to whoever sells to the newcomers first, and a place that ends up differently arranged rather than richer? Is there a separate name for the stretch itself, the time between money arriving and prices finishing their adjustment? I know the words inflation and supply and demand, and neither is what I am after.

  Second, Hume. Reading his essay on money, I take him to say that an increase in money helps industry only during the interval before prices catch up, and to treat that interval as a benefit. That is the interval I think I am living in. If what happens is a reshuffling rather than an addition, how can it be a benefit? And does it matter that no new money arrived in the town as such — the notes are the same notes as anywhere else; only the spending changed hands?

  I am not asking for a bare label. I want the nearest established names, an account of where each of them stops fitting my case, and some view of what would have to be true for the interval to leave a place better off rather than merely different.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** A small shop owner in a town undergoing rapid economic change due to a large new employer. Intelligent, observant, philosophical, currently reading David Hume. Skeptical of aggregate statistics ("aggregate figures look splendid and I do not trust them").
      *   **The Phenomenon:** An influx of outside money (via new employees of a large employer) causes price increases in a specific *order* (Cantillon Effect). Early sellers to newcomers gain; fixed-income locals and late-adjusting sectors lose. Eventually, prices adjust fully, leaving the town structurally similar but distributionally different.
      *   **The Questions:**
          1.  What is the name for this configuration (outside money, ordered price rises, temporary advantage, redistribution vs. wealth creation)?
          2.  What is the name for the *interval* itself (between money arrival and full price adjustment)?
          3.  How does this relate to Hume's view on money (is it a benefit if it's just reshuffling)?
          4.  Does it matter that the money wasn't physically printed locally but spent locally?
          5.  What would have to be true for the interval to leave the place *better off* rather than just *different*?
      *   **Constraint:** "I am not asking for a bare label. I want the nearest established names, an account of where each of them stops fitting my case, and some view of what would have to be true..."

  2.  **Deconstruct the Economic Phenomenon:**
      *   *Core Mechanism:* Money enters at a specific point, spreads through the economy unevenly, causing relative price changes before general price level changes.
      *   *Key Concept:* **The Cantillon Effect**. This is the precise match for "prices rose in an order" and "benefit to whoever sells to the newcomers first."
      *   *The Interval:* This is often referred to as the **non-neutrality of money in the short run** or the **adjustment lag**. In Austrian Business Cycle Theory, this is the **boom phase** driven by monetary expansion (though here it's real inflow, not necessarily credit expansion, but the price mechanism is similar).
      *   *The Outcome:* Redistribution of wealth, not necessarily net creation. This touches on **Real vs. Nominal variables**.
      *   *Hume Connection:* Hume's "Of Money" (1752). He argues money is a "veil" in the long run (neutrality) but stimulates industry in the short run (non-neutrality).

  3.  **Address Question 1: Names for the Configuration and the Interval:**
      *   *Configuration:* **The Cantillon Effect** (Richard Cantillon, 18th century). This is the strongest fit. It describes *where* money enters and the *sequence* of price changes.
          *   *Fit:* Perfectly describes the sequential price rises and the redistribution.
          *   *Misfit:* Cantillon usually discusses new gold/silver or central bank money. Here, it's transfer payments (wages) from outside. But the mechanism is identical.
      *   *Alternative:* **Dutch Disease**. (Resource boom hurts other sectors).
          *   *Fit:* Outside money, some sectors boom, others squeeze.
          *   *Misfit:* Usually involves currency appreciation at a national level. Too macro for a town.
      *   *Alternative:* **Gentrification / Economic Displacement**.
          *   *Fit:* Social reality.
          *   *Misfit:* Sociological terms, not monetary mechanism terms.
      *   *The Interval:* **The Short-Run Non-Neutrality of Money**. Or **Monetary Transmission Mechanism Lag**.
          *   *Hume's term:* The "interval" or "middle situation."
      *   *The Outcome:* **Zero-Sum Redistribution** (in real terms) vs. **Positive-Sum** (if productivity grows).

  4.  **Address Question 2: Hume and the "Benefit":**
      *   *Hume's Argument:* Hume believed the *process* of inflation (money increasing) stimulates industry because prices rise before wages. Merchants see higher prices, feel richer, hire more.
      *   *The User's Skepticism:* If it's just reshuffling, how is it a benefit?
      *   *Resolution:* Hume assumes idle resources (unemployed labor/capital). If the new money wakes up idle hands, it's a net gain. If the economy is already at capacity (full employment), it's just inflation/redistribution (Cantillon).
      *   *The Town Context:* Did the town have idle capacity? If the new employer hired from outside, local capacity might have been strained, leading to the "squeeze" the user describes.
      *   *Physical Money vs. Spending:* Hume treats money as a counter. It doesn't matter if the notes are "new" or just moved. What matters is the *velocity* and the *point of entry*. The user is right: it's the spending change that matters, not the paper.

  5.  **Address Question 3: What would make it "Better Off"?**
      *   For the interval to create lasting wealth, the "boom" must invest in **productive capacity**, not just consumption.
      *   If the new wages build new skills, new infrastructure, or new networks that remain after the price adjustment, then real wealth increased.
      *   If it just bid up existing assets (houses) and consumed existing services, it's purely distributional.
      *   **Key Distinction:** Capital Accumulation vs. Asset Inflation.

  6.  **Drafting the Response (Iterative refinement):**
