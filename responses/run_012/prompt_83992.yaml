answer: |-
  You have observed the economy with a clarity that many professional economists miss. You are describing a phenomenon that is distinct from general inflation, distinct from simple supply and demand, and distinct from aggregate growth. You are describing the *path* money takes through a community and the consequences of that path.

  Here are the names for what you are seeing, where they fit, where they strain, and an answer to your question about Hume.

  ### 1. The Configuration: The Cantillon Effect
  The specific pattern you named—money entering at a specific point, prices rising in a sequence, and early receivers gaining at the expense of late receivers—is called the **Cantillon Effect**.

  It is named after Richard Cantillon, an Irish-French economist of the early 18th century (a contemporary of Hume). In his *Essai sur la Nature du Commerce en Général* (1755), Cantillon argued that money is not neutral. When new money enters an economy, it does not raise all prices simultaneously like a tide lifting all boats. It enters at a specific port. Those who receive it first spend it at old prices. Those who receive it last (or live on fixed incomes) face new prices before their incomes adjust.

  *   **Where it fits:** It matches your observation perfectly. The "newcomers" (employees of the large employer) are the first receivers. The housing market and service providers they touch first are the early adjusters. The "fixed income" neighbours and the trades serving them are the late receivers. The result is a redistribution of real wealth, not necessarily a creation of it.
  *   **Where it stops fitting:** Cantillon originally applied this to an influx of gold and silver or the printing of paper money by a sovereign. In your town, no new *currency* was printed. However, from the perspective of your town's local economy, external wages function exactly like new money. They are new *claims* on local resources. So while the macro-source is different, the local mechanism is identical.

  There is no single common noun for the *outcome* you described ("a place that ends up differently arranged rather than richer"), but in welfare economics, this is often discussed as a **Pareto Redistribution** where the gains of the winners *could* compensate the losers, but do not. In your case, it feels more like a **Zero-Sum Reallocation of Claims**. The aggregate figures look splendid because they count the higher nominal value of transactions, but they do not subtract the loss of purchasing power of the locals.

  ### 2. The Interval: Short-Run Non-Neutrality
  You asked for a name for the stretch itself, the time between money arriving and prices finishing their adjustment.

  In modern macroeconomics, this is the period of **Short-Run Monetary Non-Neutrality**.
  In Hume's specific terminology, he calls it the **"middle situation."**

  *   **Where it fits:** This is the interval where the "boom" is felt. It is the time when the newcomers have money but the local shopkeepers and landlords have not yet fully raised their prices to match the new demand.
  *   **Where it stops fitting:** Modern economics often treats this as a friction—a glitch in the system that should be eliminated. Hume, and you, treat it as the *substance* of the event. For the town, this interval *is* the cycle. Once neutrality returns (prices fully adjusted), the "event" is over.

  ### 3. Hume's Benefit vs. Your Squeeze
  You ask: *If what happens is a reshuffling rather than an addition, how can it be a benefit? And does Hume treat that interval as a benefit?*

  In his essay *Of Money*, Hume argues that an increase in money is beneficial **only** during that interval. He writes:

  > *"It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the increasing quantity of gold and silver is favourable to industry."*

  Hume believes it is a benefit because he assumes there is **idle capacity**. He imagines a merchant who sees prices rise and thinks, "Business is good," and therefore hires a worker who was previously unemployed. The worker now has wages, buys goods, and stimulates further industry. In Hume's view, the "stimulus" wakes up dormant resources.

  **Why your experience differs:**
  Your town likely did not have significant idle capacity. You mentioned "a town with the same houses, roads and skills as before."
  *   **If there is slack:** The Cantillon Effect can stimulate production. The new money pays for *new* things to be built. The town is richer at the end.
  *   **If there is no slack (your case):** The new money bids for *existing* things. The newcomers buy the existing houses; the existing labour is bid away from local trades to serve the newcomers.

  For you, the interval was not a stimulus; it was a **bottleneck**. The "benefit" Hume describes accrues only to those who hold the new money first (the newcomers and the early sellers). For everyone else, the interval is a period of erosion. Hume treats the interval as a national benefit because he is looking at the aggregate of industry waking up. You are looking at the *distribution* of that awakening, and you see that for half the town, the awakening feels like a dispossession.

  So, to answer you: Hume calls it a benefit because he assumes the pie gets bigger. You suspect the pie stays the same size and is just sliced differently. In a capacity-constrained town, **you are right and Hume is optimistic.**

  ### 4. The Nature of the Money
  You ask: *Does it matter that no new money arrived in the town as such — the notes are the same notes as anywhere else; only the spending changed hands?*

  It does not matter that the physical notes are the same. Money is not a commodity like wheat; it is a **claim on resources**.

  When the large employer pays wages, they are effectively importing "claim tickets" into your town. Before the employer arrived, the total claims on your town's housing and services matched the local income. After they arrived, there were more claims chasing the same stock of houses and hours of labour.

  Whether the central bank printed new notes to pay those wages, or whether the company transferred existing digital credits from a headquarters in another city, the effect on your town is identical. The **velocity** of money in your town increased. The local density of claims increased. Hume understood this; he knew money was a "representative sign" of labour and commodities. It is the *spending*, not the *paper*, that drives the price sequence.

  ### 5. What Would Make the Town "Better Off"?
  You ask what would have to be true for the interval to leave a place better off rather than merely different.

  For the town to be genuinely richer (and not just reshuffled), the influx of money must result in an increase in **productive capacity**, not just an increase in **asset prices**.

  1.  **Investment vs. Consumption:** If the newcomers' spending encourages the building of *new* houses (increasing the housing stock) or the training of *new* workers (increasing the skills base), then the town has more real wealth at the end of the cycle. If the money simply bids up the price of existing houses and pays existing workers to do the same work, it is pure inflation.
  2.  **Spillovers:** If the large employer introduces technology, supply chains, or skills that remain in the town even if the employer leaves, that is a net gain. This is often called **positive externalities**.
  3.  **Utilization of Idle Resources:** If, before the employer arrived, there were empty shops and unemployed young people, and the boom put them to work, then the "interval" created real value. If the boom simply pulled workers away from your shop to work for the employer, causing your shop to struggle, that is a transfer, not a gain.

  ### Summary
  You have identified the **Cantillon Effect** operating within a period of **Short-Run Non-Neutrality**.

  Hume calls this interval a benefit because he assumes it mobilizes idle resources. You find it to be a squeeze because your town's resources were already employed; the new money simply outbid the locals for them.

  The town is not "better off" in the aggregate if the only result is higher prices for the same stock of goods. It is only better off if the "boom" interval was used to build new capacity (houses, skills, infrastructure) that remains after the prices have finished their adjustment. If the money was spent on consumption and existing assets, your intuition is correct: the town is not richer. It is merely rearranged, with the newcomers and early sellers holding the deeds, and the old neighbours holding the receipts.
