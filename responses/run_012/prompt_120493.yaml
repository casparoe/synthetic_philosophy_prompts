answer: |-
  Dear Colleague,

  It is a pleasure to engage with the reconstruction your seminar produced, for it captures the essence of the reference class problem with admirable clarity. You have laid out a valid argument where the premises seem individually plausible yet collectively entail a conclusion that practice forbids us to accept. Since you have asked for a committed diagnosis rather than a menu of options, I will tell you directly that the step we must reject is the first one. We must deny that any warranted judgment of the form this case has probability p of outcome O must rest on a frequency. While this premise is the heartbeat of strict frequentism, it is precisely what the reference class problem proves untenable for single cases. The argument you have reconstructed is not merely a nuisance to be managed within a frequentist framework but a reductio ad absurdum of the claim that single-case probabilities are ontologically reducible to frequencies. By rejecting the first step, we preserve the validity of the inference from the remaining premises to the skeptical conclusion, but we block the skepticism by denying the frequentist constraint that generates it.

  The cost of this choice is significant, for it requires us to abandon the hope that probability is nothing more than actual relative frequency in a population. If we reject the first step, we admit that single-case probabilities are either expressions of rational degree of belief, as the Bayesians argue, or dispositions inherent in the physical setup, as the propensity theorists claim. In either case, frequencies become evidence for probability judgments rather than the truth-makers for those judgments. This means we lose the hard objectivity that frequentism promises, where probabilities are out there in the world waiting to be counted. Instead, we accept that single-case probability is relational, depending on the state of knowledge or the specific causal model employed. You noted that you would sooner keep the first step and the seventh than keep the fourth, preferring to save frequentism and practice by sacrificing the rule of the narrowest class. I understand the temptation, for rejecting the fourth step seems like a surgical adjustment compared to the metaphysical shift of rejecting the first. However, keeping the first step while rejecting the fourth leaves you without a principled way to select a reference class. If you abandon the narrowest class rule, you must replace it with something like causal relevance, but defining causal relevance without invoking probability often leads to circularity or requires a deterministic ontology that eliminates probability altogether. Thus, holding onto the first step forces you into a dilemma where you must either accept the skepticism of the sixth step or adopt a selection criterion that is just as vulnerable to the epistemic relativity criticized in the fifth step.

  If we were to accept a restricted version of the sixth step instead of rejecting the first outright, we would license the claim that no single-case frequency judgment is warranted while maintaining that single-case probability judgments are warranted. This distinction allows us to say that the physician cannot state the patient's frequency of recurrence because the patient is a class of one, but she can state the patient's probability of recurrence based on the best available evidence. However, I argue we should go further and reject the first step entirely because even the restricted view keeps us tethered to the idea that frequencies are the primary anchor. By cutting that tether, we clarify that the physician is not approximating a hidden frequency but offering a calibrated credence. What survives for the physician is the ability to communicate risk without metaphysical embarrassment. She tells the patient that given what we know about your specific condition and history, the rational expectation of recurrence is thirty percent. This is not a lie about frequencies but a truth about evidence. The insurer similarly survives not by finding the perfect reference class for the individual driver but by pricing policies based on expected losses derived from actuarial models that blend frequency data with causal assumptions about risk factors. The court too can admit probabilistic evidence without committing the fallacy of assuming the defendant is a random draw from a population. The evidence supports a degree of belief in guilt or liability rather than asserting a frequency of guilt among people with matching traits.

  You asked what I am giving up by choosing to reject the first step, and the answer is the comfort of extensional semantics for probability. We lose the ability to say that probability statements are true or false solely in virtue of the distribution of properties in the world independent of any observer or model. We must accept that probability judgments are warranted by the coherence of the model and the quality of the evidence, not just by counting heads in a toss. This might feel like a concession to subjectivism, but it is actually a recognition that single-case prediction is an epistemic activity. The reference class problem arises only when we try to force an epistemic task into an ontological box that does not fit. By acknowledging that the warrant for single-case judgments comes from the robustness of the predictive model rather than the existence of a corresponding frequency, we dissolve the problem rather than solving it. The seminar's argument succeeds in showing that frequentism cannot handle single cases, but it fails to show that single-case probability judgments themselves are unwarranted. We save the practice by changing our theory of what that practice is doing. The physician, the insurer, and the judge are not frequency counters; they are decision-makers under uncertainty, and their warrants come from the reliability of their methods, not the metaphysics of their categories. I hope this diagnosis helps you settle the matter, for while it demands more of our philosophy than tweaking the selection rule, it offers a clearer view of why our practices work despite the lack of a unique reference class.

  Sincerely,

  A Colleague
