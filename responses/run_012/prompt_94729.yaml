      *   *My advice:* Option 1 is the only one that solves the immediate incident without causing a new wave of incidents (migration bugs). But it must be documented.
      *   *Wait, the "Blame" section is crucial.* I need to exonerate the new team technically while holding them accountable for the fix.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format. To, From, Date, Subject.
      *   **Executive Summary:** State the problem, the recommendation, and the timeline.
      *   **Context:** Briefly state the incident without naming/shaming.
      *   **The Philosophy Bit (Lewis):** Address the "Convention vs. Norm" question simply. Explain why the unwritten rule failed the "common knowledge" test for the new team. This answers the "why can't we blame them" question.
      *   **The Options Analysis:**
          *   Option 1 (Codify): Pros (Stability), Cons (Ambiguity remains).
          *   Option 2 (Explicit): Pros (Safety), Cons (Cost/Risk).
          *   Option 3 (Registry): Pros (Flexibility), Cons (Cognitive Load/Error Prone). *Steelman this:* It acknowledges legacy reality.
      *   **Recommendation:** Option 1 (Codify & Validate) immediately, with a sunset clause for Option 2 migration. Why? Because consistency > theoretical purity in a live system.
      *   **Blame/Accountability:** Unwritten rules aren't enforceable standards. The failure is systemic (lack of docs), not individual.
      *   **Focal Points/Stickiness:** How to make it stick? Documentation, Linting, Codegen. Not just words.

  5.  **Refining the Tone:**
