answer: |-
  **TO:** Engineering Standards Council
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation: PATCH Semantics, Convention vs. Standard, and Incident Response

  ### Executive Summary

  Following the recent configuration loss incident, we must formalize our handling of omitted fields in PATCH requests. This memo analyzes the three proposed options, addresses the question of accountability regarding unwritten rules, and recommends **Option 1 (Codify Existing Behavior)** with immediate enforcement tooling, alongside a long-term deprecation plan for legacy endpoints.

  **Recommendation:** Adopt Option 1 effective immediately. Omitted fields must remain "no change." Clearing a value requires an explicit `null` or a field mask.
  **Timeline:** Documentation published by next Thursday; Validation middleware deployed to CI within 30 days.

  ---

  ### Context: The Incident

  A client from a recently acquired team sent a PATCH request omitting a field, intending to clear that value. Our system interpreted the omission as "do not change," per our six-year unwritten convention. The customer's configuration was not cleared, but subsequent logic treated the stale state as an error, leading to a silent wipe.

  The technical root cause is a mismatch in semantic expectations:
  *   **Internal Legacy:** Omitted field = Keep existing value.
  *   **Acquired Team:** Omitted field = Clear value (set to null/default).

  ---

  ### Analysis of Options

  **Option 1: Codify Existing (Silence = Keep)**
  *   **Pros:** Aligns with RFC 7386 (JSON Merge Patch), which most of our 40 services already implement. Lowest migration risk. Preserves backward compatibility for all existing clients.
  *   **Cons:** Retains the ambiguity that caused the incident. Requires strict validation to ensure "clear" intent is explicit.

  **Option 2: Move to Explicit Updates (Silence = Error/Ignore)**
  *   **Pros:** Eliminates ambiguity entirely. Forces intent to be declared.
  *   **Cons:** High engineering cost. Requires updating 40 services and all clients. During migration, we risk a "split brain" where some endpoints behave differently, increasing cognitive load and bug surface area.

  **Option 3: Registry of Behaviors (Team Choice)**
  *   **The Case For:** This option acknowledges our current reality. We *are* a heterogeneous ecosystem right now. Forcing a standard on legacy services that are in maintenance mode may be an inefficient use of resources. It allows teams to move fast on new services without being blocked by legacy refactors.
  *   **The Case Against:** While it reduces immediate migration work, it maximizes long-term cognitive load. Developers must consult a registry before every integration. This violates the principle of least surprise and guarantees future incidents whenever a developer assumes the wrong standard. It solves a political problem (who has to do the work) by creating a technical debt problem (nobody knows how the API works).

  ---

  ### The "Convention" Question (David Lewis & Industry Standards)

  During the last meeting, we discussed whether our unwritten rule was a "convention" in the philosophical sense (David Lewis) or a "norm." This distinction matters for our decision and our accountability.

  **1. Was it a Convention?**
  Lewis defines a convention as a regularity that everyone follows *because* they expect everyone else to follow it, and it is **common knowledge**.
  *   **Verdict:** For the original team, yes. For the acquired team, no.
  *   **Implication:** Because the rule was unwritten, it failed the "common knowledge" test for new entrants. A convention that isn't documented isn't a coordination mechanism; it's a trap.

  **2. Convention vs. Norm**
  *   **Convention:** "We drive on the right." If you drive on the left, you crash (practical cost).
  *   **Norm:** "You shouldn't steal." If you steal, you are punished (moral/social cost).
  *   **Implication:** By putting this rule in writing now, we turn it from a convention into a norm. However, applying the *norm* (blame/punishment) retroactively to a rule that was previously just a *convention* (and undocumented) is unfair.

  **3. The QWERTY Analogy**
  The QWERTY keyboard is a "locked-in" convention. It may not be optimal, but the switching cost is too high. Our 40 services are QWERTY. Option 2 attempts to switch to Dvorak. Option 1 admits we are on QWERTY and ensures everyone gets a typing lesson before they touch the keyboard.

  **4. Focal Points**
  For a standard to stick, it needs a "focal point"—a reason to choose it other than "we said so."
  *   **Option 1 has a focal point:** It aligns with IETF RFC 7386 (JSON Merge Patch). This is the wider ecosystem standard.
  *   **Option 2 has no focal point:** It requires custom logic across the board.
  *   **Adoption Strategy:** To make Option 1 stick, we cannot rely on memory. We must rely on **tooling**. Linters, codegen templates, and mock servers must enforce the standard. If the CI pipeline rejects the bad pattern, the convention becomes unavoidable.

  ---

  ### Accountability and Blame

  **Question:** *Do we record this incident against the acquired team's record?*

  **Recommendation:** **No.**

  **Reasoning:**
  1.  **Lack of Common Knowledge:** As noted above, an unwritten convention cannot be enforced against parties who were not part of the original coordination. They followed their own established industry norms.
  2.  **Systemic Failure:** The root cause was not "engineers wrote code," but "the organization failed to publish its interface contract." The failure belongs to the Standards Council and Platform Engineering for allowing a six-year-old standard to remain oral tradition.
  3.  **Future Liability:** If we punish them for breaking an unwritten rule, we signal that "gotchas" are acceptable. This discourages transparency. If we exonerate them *on the condition* that they adopt the written standard moving forward, we signal that we value system integrity over scapegoating.

  **Action:** The postmortem should cite "Undocumented API Contract" as the primary cause. The acquired team should be assigned the action item to help draft the new validation middleware, turning them from offenders into owners of the fix.

  ---

  ### Recommendation & Next Steps

  We cannot afford the risk of Option 3 (ambiguity) or the cost of Option 2 (mass migration) right now. We choose **Option 1**, but we harden it.

  1.  **Standardize:** Officially document that `PATCH` omits = no-op. Clearing a value requires `null` or a `update_mask`.
  2.  **Enforce:** Platform Engineering to deliver a middleware library that validates this behavior. CI fails if a service doesn't use it.
  3.  **Migrate (Long Tail):** New services must use the standard. Legacy services are scheduled for refactoring only when they undergo major version bumps (Option 2 behavior can be introduced in v2 endpoints).
  4.  **Onboarding:** Update the "New Service Checklist" and "Acquisition Integration Guide" to include this spec.

  **Vote Required:** Approval to publish this standard and allocate 2 sprints of Platform Engineering time for the validation middleware.

  ---

  ### Appendix: Addressing Concerns

  **For those favoring Option 3:** I understand the desire to avoid blocking teams on legacy refactors. This recommendation does not require immediate refactors of the 40 services. It only requires that *future* changes adhere to the documented rule. We are freezing the ambiguity, not forcing a rewrite.

  **For those favoring Option 2:** I agree that explicit masks are technically superior. This recommendation sets Option 1 as the v1 standard, but explicitly marks it for deprecation in favor of Field Masks in v2. We are prioritizing stability now to enable safety later.

  **For the Acquired Team:** This is not a verdict on your competence. It is a verdict on our documentation. We are fixing the system, not the people.
