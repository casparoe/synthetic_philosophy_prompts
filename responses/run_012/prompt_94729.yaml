      *Wait, is silence=keep standard?* In JSON Merge Patch (RFC 7386), omitted fields are ignored. In JSON Patch (RFC 6902), you explicitly list operations. The new team treated omitted as null, which is non-standard for PATCH. So Option 1 aligns with IETF standards. This is a strong argument.

      *Re-evaluating Option 3:* The Chair likes it. I need to be careful not to alienate the Chair. I will acknowledge Option 3 as a "transition state" but argue against it as a "target state".

      *Blame:* The key insight is "Common Knowledge". Lewis says a convention requires *common knowledge* that everyone follows it. If it's unwritten, new hires/acquisitions don't have that knowledge. Therefore, it wasn't a functioning convention for them. Blaming them is unfair.

