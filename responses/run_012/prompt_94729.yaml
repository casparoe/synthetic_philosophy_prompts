      *   Check the "Recommendation". Is it actionable? Yes: Document, Add Validation, Plan Migration.

      *(Self-Correction during drafting)*: I initially thought about recommending Option 2. But the user said "40 services" and "huge lift". As a council member, recommending a rewrite of 40 services might get shot down. Option 1 (Codify) is the "Stabilize" move. I will recommend Option 1 as the *standard*, but acknowledge Option 2 as the *ideal*. Actually, the prompt asks me to pick. I'll pick Option 1 because it respects the Lewisian insight: conventions work when they are common knowledge. We just need to make it common knowledge. Option 2 changes the convention, which resets the coordination problem. Let's stick with Option 1 + Tooling enforcement.
      *Wait, re-reading the prompt:* "If we do change the rule, what makes the new one take?" This implies I might suggest changing it.
