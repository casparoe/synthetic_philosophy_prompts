      *   **Situation:** Bylaws amended the amendment clause. Old rule: 2/3 vote. New rule: Simple majority + 10-year lock on the new rule. The change was passed validly under the *old* rules (2/3 vote achieved).
      *   **Conflict:** Faction A says it's valid (followed old rules). Faction B says it's invalid (undermines protection, self-locking is impossible).
      *   **User's Confusion:** Paradoxes of self-reference (which rules govern undoing it? If valid, can't we just change it anyway? Where does the original authority come from?).
