answer: |-
  This is one of the classic puzzles of organizational rules. You have stumbled onto a problem that legal philosophers and constitutional scholars have argued about for a century. It is often called the **"paradox of self-embracing sovereignty"** or the problem of **"entrenchment."**

  You are right to feel that the logic loops back on itself. Here is a breakdown of what is actually happening, the strength of your neighbors' arguments, and how a small organization usually survives this.

  ### 1. The Two Competing Views

  Your neighbors are arguing from two different theories of where rules get their power.

  **View A: The "Procedure is King" Argument (Your first group)**
  This view says that a rule is just a tool. If the tool says "to change me, use a 2/3 vote," and you use a 2/3 vote, the change is valid. It doesn't matter *what* the change says, only that the correct process was followed.
  *   **The Logic:** The old rule was the boss. The group obeyed the old rule. Therefore, the new rule is now the boss.
  *   **Strength:** This is the most common legal view for private organizations (like co-ops). Courts generally hate interfering in internal rule disputes. If the minutes show a 2/3 vote happened, a court will usually say, "Okay, the rules changed."
  *   **Weakness:** It allows a temporary majority to permanently alter the balance of power, potentially hurting minority owners who bought in under the old expectations.

  **View B: The "Fundamental Protection" Argument (Your second group)**
  This view says that some rules are structural pillars. The 2/3 requirement wasn't just a speed bump; it was a protection for the minority. You cannot use a protected right to destroy the protection itself.
  *   **The Logic:** A 2/3 requirement implies that 1/3 of the members have a veto. If you allow a 2/3 vote to remove that veto, you are allowing the majority to steal the minority's rights.
  *   **Strength:** It feels morally right. It preserves the stability of the organization.
  *   **Weakness:** It is hard to enforce. Who decides which rules are "fundamental"? If members can't change the amendment clause, are they truly self-governing?

  **Which is more defensible?**
  In the context of a small housing cooperative, **View A (Procedure is King) is usually stronger legally,** but **View B (Fundamental Protection) is stronger politically.**

  Most state laws governing nonprofits and co-ops default to the idea that the current membership controls the organization. If the bylaws provided a path to change the amendment clause, and the members walked down that path, the change typically stands. However, the *reason* View B exists is to prevent a "tyranny of the majority."

  ### 2. The Ten-Year Lock

  This is the weakest part of the new amendment. Almost certainly, **the ten-year lock is unenforceable.**

  Here is why: The new rule says "Bylaws can be changed by a simple majority." It *also* says "This rule cannot be changed for ten years."
  *   If a simple majority votes next week to remove the ten-year lock, which rule wins?
  *   If the lock wins, then bylaws *cannot* be changed by a simple majority (because this one can't). That contradicts the first part of the new rule.
  *   If the simple majority wins, the lock is meaningless.

  In legal theory, this is called **"binding the future."** A current group of members generally cannot tie the hands of a future group of members in a voluntary association. If a future majority wants to change the rule, they will simply vote to change it. If someone sues to stop them, a court will likely say, "You cannot prevent a majority from exercising its current voting power."

  So, the likely reality is: **The threshold is now a simple majority, but the ten-year lock is void.**

  ### 3. The "Original Authority" Worry

  You asked: *"I'm leaning on the idea that the two-thirds rule had some original authority behind it — which only pushes the question back a step, to whatever rule authorized it in the first place."*

  This is the deepest philosophical worry, but for a co-op, the answer is simpler than it is for a country.
  *   **For a Country:** Authority comes from a Constitution, which comes from "The People," which is an abstract idea.
  *   **For a Co-op:** Authority comes from **contract and consent.** When someone buys a unit, they sign a contract agreeing to the current bylaws.

  However, that contract usually includes the agreement to be bound by *future* amendments made according to the rules. So, the "original authority" is the collective agreement of the members to be governed by whatever rules the group adopts using the agreed-upon process.

  If the group followed the process, the authority transfers to the new rule. You don't need to find a "rule above the rules." The authority is the membership itself.

  ### 4. Practical Options for Your Co-op

  You have a contentious meeting coming up. Arguing about legal theory will likely cause a fight. Here is how small organizations usually resolve this:

  **Option 1: The "Clean Up" Vote (Recommended)**
  Acknowledge that the 2/3 vote happened, so the threshold *probably* changed to a majority. However, acknowledge that the 10-year lock is confusing and likely invalid.
  *   **Action:** Hold a vote under the *new* (majority) rules to confirm the amendment *without* the 10-year lock.
  *   **Why:** This respects the procedural win of the faction that passed it, but removes the toxic "lock" that is causing the fear. It creates clarity.

  **Option 2: The "Repeal" Vote**
  If the opposition feels strongly that the 2/3 protection is vital, they can try to repeal the amendment.
  *   **Action:** If the new rule (majority) is valid, they need 51% to repeal it. If the old rule (2/3) is still valid, they need 67% to repeal it.
  *   **Risk:** This creates a paradox. Which rule do you use to vote on which rule applies?
  *   **Solution:** You vote under the *new* rule to restore the *old* rule. If the new rule is valid, this works. If the new rule was invalid, the old rule is still in place anyway. This is the safest practical path.

  **Option 3: Mediation**
  Since there are only 30 units, this is a neighborhood dispute as much as a legal one.
  *   **Action:** Bring in a neutral third party (a mediator from a local co-op federation, for example) to facilitate a discussion before the vote.
  *   **Why:** The real issue isn't the voting threshold; it's trust. The faction that pushed this likely feels the 2/3 rule was being used to block necessary changes. The opposition feels bullied. Fix the trust, and the voting threshold matters less.

  ### 5. My Confidence and Uncertainty

  I want to be candid about where my reasoning is solid and where it might fail.

  **Where I am confident:**
  *   **The Lock is Void:** I am highly confident that a private organization cannot legally prevent a future majority from amending its bylaws. That defeats the definition of a membership organization.
  *   **Procedure Usually Wins:** In the absence of fraud or violation of state law, courts generally uphold amendments passed according to the existing procedure, even if they change the procedure itself.

  **Where I am uncertain (The "Failure Points"):**
  *   **State Statute:** This is the biggest risk. Many states have a "Nonprofit Corporation Act" or "Cooperative Corporation Act." These laws sometimes say, "You cannot amend bylaws with less than a 2/3 vote," regardless of what your bylaws say. If your state law mandates a 2/3 vote for *any* amendment, the new majority rule is illegal, and the old 2/3 rule stands automatically. **You must check your state's specific co-op laws.**
  *   **The "Contract" Argument:** If members can prove they bought their units *specifically* relying on the 2/3 protection (e.g., it was a major selling point), a court *might* view the change as a breach of contract. This is rare but possible.
  *   **Meeting Validity:** You mentioned the meeting was held "under the old rules." If there were any procedural errors in that meeting (notice period, quorum counting), the opposition could argue the amendment never passed at all.

  **What would change my answer?**
  If you tell me your state, and that state's law explicitly says "Bylaw amendments require a 2/3 vote," my advice flips completely: The amendment is void, the 2/3 rule remains, and the 10-year lock is irrelevant. If state law is silent (which is common), then the logic above applies.

  ### Summary for Your Meeting
  1.  **Don't panic about the paradox.** It is normal for rules to be able to change themselves.
  2.  **The 10-year lock is likely dead.** Explain to members that even if the majority rule stands, no one can stop a future majority from changing it back next year.
  3.  **Check State Law.** Before the meeting, quickly verify if your state mandates a minimum voting threshold for co-ops.
  4.  **Aim for Clarity.** Propose a vote to ratify the change *without* the lock. This acknowledges the vote count but removes the poison pill.

  You are in a difficult position as secretary, but remember: the goal of the bylaws is to help the co-op function, not to create a logic puzzle that stops work from getting done. If the membership can agree to move forward, the "validity" matters less than the acceptance.
