      *   *Section 3: Genuine vs. Prejudice.* Distinguish between what matters morally vs. linguistically.
      *   *Section 4: Incompatibilities.* Show where the theory breaks.
      *   *Section 5: The Killer Requirement.* Pinpoint the Commitment Constraint.
      *   *Critique of User's Setup:* Be gentle but precise. Case 1 is strong. Case 2 is standard but phrased well. Case 3 is the classic "Gricean" case, but the chemist's framing ("True Implicature") is slightly off technically (it's a false implicature via a true statement), need to clarify that.

  9.  **Refining the Tone:**
