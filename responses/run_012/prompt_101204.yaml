prompt: |-
  I'm a retired chemist — forty years at the bench, mostly analytical work — and since I stopped I've been reading philosophy, badly but happily. Something in the deception literature keeps bothering me. In my old world we were fairly strict about this: a figure that's technically accurate but drawn to bury the outlier was fraud, same as a made-up number, and nobody thought there was much of a moral gap between lying and misleading. But philosophers seem to want the two to be different in kind, and I can't tell whether that's a real disctinction or an artifact of how the examples get set up.

  So before I read another paper on it, give me the desiderata. What would a theory of the lying/misleading distinction — or of the claim that there isn't one — have to get right to be worth anything? Act as a philosopher who works on testimony and deception, and think it through carefully before answering; start by brainstorming the cases and distinctions any such theory will have to survive.

  I want the full spec: the cases it has to handle, the distinctions it can't collapse, the intuitions it has to either vindicate or explain away. And build it around a few cases I haven't seen anyone use, so please take these seriously rather than filing them under something familiar:

  (1) The setup. Someone arranges the world in advance so that a later statement, which is perfectly true and sincerely believed, will mislead. No false sentence is ever uttered by anyone. If the standard says misleading is milder than lying, does the pre-arrangement change the verdict, and why?

  (2) The transparent falsehood. I say something false that you know is false — a joke, an obvious bit of theatre — and we both know it. Is that a lie? If not, what does that do to any theory that defines lying by falsity plus intent to deceive?

  (3) The true implicature. "Did you eat the last slice?" "I had a big lunch." True, and it misleads. Is that closer to lying or to merely misleading, and does the theory even have the resources to say?

  Then tell me which of the requirements you list are genuine and which are just prejudices of one camp; whether some subset of them can't be jointly satisfied (if so, that's the result I most want — say which ones and why they clash); and which single requirement does the most to rule out teh popular theories. No citations or reading lists please, I'll find the literature myself — I just want the spec. And flag anything you think I'm getting wrong in how I've set the cases up.
