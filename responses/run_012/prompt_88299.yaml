  Marcus: It's a fiction, Elena. Either the woman who bets is you, in which case you've merely changed your mind, or she's a stranger, in which case you're coercing her. No earlier self has authority to override a later one. That's the standard objection in the literature.

  Elena: That assumes authority flows only from the present. There's common ground that personal identity is continuous enough for responsibility, but contested whether it grants authority over future preferences. I have a standing second-order preference to be bound. A self trusted to keep commitments is more free, not less. It's about integrity over time, not just momentary consent.

  Marcus: But who holds the key? You've outsourced discretion to a firm. What stops them becoming a fresh locus of control? You've swapped internal weakness for external mastery. They interpret the triggers. If they decide a transaction counts as a bet, you pay. That's their discretion, not yours. You've invited a master.

  Elena: They follow algorithms, not whims. It's like a constitution. We bind ourselves to principles so we don't capitulate to transient passions. The dead hand protects the living from themselves. We accept judicial review to preserve the rule of law; I accept this firm to preserve the rule of reason. They are bound by the contract just as I am.

  Marcus: The constitutional analogy is dangerous. Constitutions bind later generations who never consented. Is your future self a citizen or a subject? If you have a sincere, considered change of heart—sober, clear-headed, perhaps values have shifted—does the lock still hold? Or does it collapse into mere stubbornness? At what point does commitment become tyranny?

  Elena: If I could unlock it easily, it wouldn't work. The cost must be painful. Otherwise, it's just a suggestion. The rigidity is the feature, not the bug. I need to know the door is locked when the craving hits.

  Marcus: So you admit it's paternalism. You're treating your future self as incompetent. Most agree addiction undermines autonomy, but whether pre-commitment restores it or merely restricts it is genuinely contested. You're privileging the past self's values over the present self's welfare. That's the fault line. You're saying your past judgement is superior to your present experience.

  Elena: I'm treating my addicted self as compromised. The firm isn't a master; they're a scaffold. Without them, I have no agency at all. I'd be a slave to impulse. This distributes the agency to a neutral party. It's not about superiority; it's about survival.

  Marcus: Scaffolds become structures. They interpret the rules. Discretion creeps in. You claim distributed autonomy; I see restricted agency. And if the firm decides a bet didn't count? They hold the power. You've created a mini-state over your own life. Who watches the watchers?

  Elena: Less discretion than my own wavering will. The risk of their error is lower than the certainty of my relapse. I'd rather be bound by a contract than a craving. The firm has no interest in my money; the addiction does.

  Marcus: But are we disagreeing on facts or definitions? You describe a constraint; I describe a constraint. You call it liberation. We might just be describing the same arrangement in different vocabularies. Is this a genuine disagreement about freedom, or merely semantics?

  Elena: No. The outcome differs. One leads to ruin, the other to stability. The mechanism is the same, but the valuation isn't. If we call it coercion, it's banned. If freedom, it's therapy. The vocabulary dictates the policy.

  Marcus: Fair. But don't claim it's purely autonomous when you've handed the keys to a firm. You've traded sovereignty for security.

  Elena: I claim it's *distributed* autonomy. Better that than none. The fault line isn't identity; it's whether we value stability over flexibility.

  Marcus: Then we agree on the mechanism, but not the morality.

  Elena: Exactly. And that's where the work begins.
