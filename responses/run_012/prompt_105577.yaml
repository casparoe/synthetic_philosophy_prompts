answer: |-
  # Specification for Resolving Maxwell's Demon

  ## Part 1: The Requirements

  **1. The Global Entropy Verdict**
  *Requirement:* The account must state explicitly whether the total entropy of the universe (gas + demon + environment) decreases, stays constant, or increases over a complete cycle. **[Non-negotiable]**
  *Justification:* The core purpose of the paradox is to test the Second Law. An account that remains agnostic on whether the demon achieves a net decrease in total entropy fails to resolve the paradox. It must distinguish between a local decrease (cooling the gas) and a global decrease (violating thermodynamics). If the account claims the Second Law is only statistical, it must quantify the probability of violation; if it claims the Law is absolute, it must identify the compensating entropy increase elsewhere.

  **2. System Boundary Definition**
  *Requirement:* The account must define the physical boundaries of the "demon" and specify exactly which components are included in the thermodynamic bookkeeping. **[Non-negotiable]**
  *Justification:* Ambiguity here allows the "relay of demons" loophole, where one demon hands its memory record to a second, who hands it to a third, deferring the cost indefinitely. A valid resolution must treat the demon as a physical system with finite capacity or explicitly model the environment that absorbs the infinite chain of records. Without a closed system boundary, entropy can be made to disappear simply by expanding the box.

  **3. The Location of Thermodynamic Cost**
  *Requirement:* The account must identify the specific physical step where the energy cost or entropy increase is incurred: during measurement, during memory storage, during logical manipulation, or during erasure. **[Camp-specific]**
  *Justification:* This is the primary fault line between schools of thought. The Szilard camp argues measurement costs energy; the Landauer-Bennett camp argues measurement can be reversible and free, but erasure costs $k_B T \ln 2$ per bit. An adequate account must pick a side and justify it physically. It cannot simply assert "information is physical" without specifying *which* physical interaction exacts the tax. This requirement forces the account to address the "lazy demon" (who measures but never erases) by explaining why that demon does or does not violate the Second Law.

  **4. Operational Testability**
  *Requirement:* The account must specify a measurable physical quantity (e.g., heat dissipated, work extracted, temperature change) that an experimentalist could monitor to verify the claim. **[Non-negotiable]**
  *Justification:* To prevent the resolution from becoming purely metaphysical, it must connect to the laboratory. For the "ordinary computer" case, this means predicting heat output during bit overwrites. For the "one-molecule engine," it means predicting the work required to insert the partition versus the work extracted. If the account relies on abstract information quantities, it must provide the conversion factor to Joules or Kelvin.

  **5. Compatibility with Fluctuation Theorems**
  *Requirement:* The account must remain consistent with the fact that small systems can transiently violate the Second Law over short timescales. **[Non-negotiable]**
  *Justification:* Modern statistical mechanics confirms that entropy *can* decrease spontaneously in microscopic systems (e.g., a single particle pushing a piston). A resolution that claims the demon is impossible because entropy *never* decreases contradicts established physics. The account must explain why the demon cannot *rectify* these fluctuations into a perpetual engine, even if the fluctuations themselves are real.

  **6. The Physicality of Information**
  *Requirement:* The account must explain the mechanism by which an abstract logical state (a bit) becomes coupled to a thermodynamic state (energy/entropy). **[Non-negotiable]**
  *Justification:* This addresses the skeptic who claims "logical bookkeeping is not physics." If information is not physical, the demon wins. The account must describe how the demon's knowledge is encoded in a physical substrate (e.g., the position of a atom, the magnetization of a domain) and why manipulating that substrate is subject to physical laws. It must distinguish between the demon's *knowledge* (epistemic) and the demon's *memory* (ontic/physical).

  **7. Quantum and Coherence Handling**
  *Requirement:* The account must address whether quantum coherence or unitary evolution allows the demon to bypass classical erasure costs. **[Camp-specific]**
  *Justification:* The "quantum memory demon" suggests that if the memory never decoheres, no erasure is needed. A classical resolution may dismiss this as impractical, but a complete specification must state whether quantum mechanics fundamentally alters the thermodynamic limit. If the account claims quantum demons still pay the cost, it must identify the source (e.g., entanglement entropy or eventual decoherence).

  ***

  ## Part 2: Tensions

  **Absolute Law vs. Statistical Regularity**
  There is a conflict between Requirement 1 (Verdict) and Requirement 5 (Fluctuations). Fluctuation theorems prove that entropy *can* decrease locally and transiently. If the resolution claims the Second Law is absolute, it risks contradicting Requirement 5. If it claims the Law is merely statistical, it risks opening the door to a "clever agent" who beats the odds.
  *Resolution:* The specification demands that the account treat the Second Law as a statistical constraint that becomes absolute only when averaged over cycles or macroscopic scales. A valid resolution must show that while the demon can win a single hand (transient violation), it cannot win the tournament (cyclic operation) without paying a debt. The "absolute" nature of the law applies to the *expectation value* of work over a cycle, not to every individual trajectory.

  **Measurement vs. Erasure (The Lazy Demon)**
  Requirement 3 forces a choice on where the cost lies, but the "lazy demon" case creates tension. If measurement is free (Landauer view), the lazy demon measures forever without paying. If erasure is the cost, the lazy demon never erases, so he pays nothing. Yet, he extracts no work either. The tension is explaining why a demon that *could* act but *chooses* not to doesn't constitute a violation of the spirit of the law.
  *Resolution:* The account must distinguish between *potential* and *actual* work extraction. A lazy demon accumulates mutual information (correlations) with the gas. While this doesn't immediately cost energy, it represents a thermodynamic debt that must be paid if the demon ever wishes to reset to its initial state to repeat the cycle. The requirement is satisfied if the account shows that the *cycle* cannot close without payment, even if the measurement step is free.

  **Logic vs. Physics (The Skeptic's Challenge)**
  Requirement 6 demands a link between logic and physics, but the skeptic insists no amount of bookkeeping yields a law of physics. If the skeptic is right, we lose the ability to use information theory to engineer thermodynamic limits. We would be forced to analyze every demon as a unique mechanical device without general principles.
  *Resolution:* To satisfy the specification, an account cannot simply assert "information is physical." It must demonstrate that logical irreversibility (losing information) *necessitates* physical irreversibility (heat dissipation) due to the phase-space volume of the physical substrate. If the skeptic were right, we would lose the predictive power of Landauer's Principle; we would not know that overwriting a bit *must* generate heat until we built the specific machine. The specification requires the account to bridge this gap by showing that logical states are mapped to disjoint regions of physical phase space.

  ***

  ## Part 3: Scorecard

  **The Memory-Erasure Line (Landauer/Bennett)**
  *Fares well on:* Requirements 3 (locates cost at erasure), 4 (predicts heat dissipation), and 6 (grounds info in physical states).
  *Struggles with:* The "Lazy Demon" (requires careful explanation of why un-erased memory matters) and the Quantum Demon (must argue that decoherence eventually forces erasure costs).
  *Verdict:* Strongest overall for experimentalists, as it provides a clear Joule-per-bit metric.

  **The Statistical-Mechanics Line (Smoluchowski/Earman)**
  *Fares well on:* Requirement 5 (fully embraces fluctuations) and Requirement 1 (upholds the Second Law as statistical).
  *Struggles with:* Requirement 6 (often treats the demon as a mechanical failure rather than an information problem) and Requirement 3 (often ignores the role of memory entirely).
  *Verdict:* Physically robust but fails to capture the "information" aspect of the modern paradox; risks missing why the demon fails in idealized, frictionless cases.

  **The Skeptic/Exorcist Line (Logical Bookkeeping is Not Physics)**
  *Fares well on:* Requirement 7 (demands rigorous physical modeling of the demon's mechanism).
  *Struggles with:* Requirement 6 (denies the universal link between logic and thermodynamics) and Requirement 4 (offers no general predictive metric like $k_B T \ln 2$).
  *Verdict:* If this view is right, we lose the ability to generalize. Every demon must be exorcised individually by finding a specific mechanical flaw (friction, thermal noise) rather than a universal information cost. It satisfies the physics but abandons the thermodynamics of information.
