  2.  **Initial Brainstorming & Concept Mapping:**

      *   *Realism vs. Nominalism:* Are generations natural kinds (like gold or tigers) or nominal kinds (like "things on my desk")?
      *   *Age-Period-Cohort (APC) Problem:* This is the statistical heart of the issue. You can't separate being 25 (Age), living in 2024 (Period), and being born in 1999 (Cohort) in a single cross-sectional study.
      *   *Mannheim's Theory of Generations:* Karl Mannheim is the classic sociological reference. Generations as "social locations."
