answer: |-
  You are diagnosing the impasse correctly. In fact, you've identified the exact structural fault lines that keep this debate from resolving. The reason your seminar is spinning is that the Intellectualists (Stanley-Williamson style) and the Anti-Intellectualists (Rylean style) are often playing different games while using the same scorecard.

  Here is the breakdown of the structure of the impasse, followed by what would actually count as progress.

  ### 1. The Diagnosis: Three Layers Conflated

  Your hypothesis that this is "two disagreements stacked" is right, but I would argue it is actually **three** distinct questions being treated as one. The stalemate persists because a win on one layer is claimed as a win on all three.

  **Layer A: The Semantic Question (Truth Conditions)**
  *   *Question:* What are the truth conditions of the sentence "S knows how to $\phi$"?
  *   *Intellectualist Move:* "S knows how to $\phi$" is true iff there is some way $w$ such that S knows that $w$ is a way to $\phi$.
  *   *Anti-Intellectualist Move:* "S knows how to $\phi$" is true iff S has the ability to $\phi$.
  *   *The Impasse:* Intellectualists usually win here by linguistic intuition pumps (e.g., embedding tests: "I know how to swim, but I forgot how" sounds weird compared to "I know that water is wet, but I forgot that"). But winning semantics doesn't prove anything about the mind.

  **Layer B: The Metaphysical/Psychological Question (Constitution)**
  *   *Question:* What is the mental state *in virtue of which* the sentence is true?
  *   *Intellectualist Move:* It is a propositional attitude (knowledge relation to a proposition), perhaps under a "practical mode of presentation."
  *   *Anti-Intellectualist Move:* It is a dispositional state or a complex of abilities.
  *   *The Impasse:* This is where the "inarticulate expert" case lives. The Intellectualist says, "She holds the proposition under a non-linguistic mode." The Anti-Intellectualist says, "That's just a fancy way of saying 'she has the ability'." If "practical mode of presentation" is cashed out as "whatever neural state realizes the ability," Intellectualism becomes trivially true but explanatorily empty.

  **Layer C: The Explanatory Question (Function)**
  *   *Question:* What work does the concept do in explaining action?
  *   *Intellectualist Move:* Unifies knowledge. Explains intelligence as a species of reasoning (even if implicit).
  *   *Anti-Intellectualist Move:* Explains *guidance*. Propositions don't move limbs; abilities do.
  *   *The Impasse:* The Anti-Intellectualist cares about the *mechanism of action*. The Intellectualist cares about the *architecture of epistemology*.

  **Your Friend's Normative Claim:**
  This is a fourth layer (Pragmatics). If "knows how" is a normative status (licensing/entitlement), asking for its ontological constituency is indeed a category error, akin to asking "What is the molecular weight of a promise?" This view dissolves the debate by rejecting the presupposition that there is a natural kind "knowledge-how" to be reduced.

  ### 2. Why the Cases Fail
  You noted that both sides claim the standard cases (inarticulate expert, articulate novice) as predictions. This is because the cases are **under-constrained**.

  *   **The Inarticulate Expert:** Intellectualists posit "non-linguistic propositions." This is a theoretical bullet they are willing to bite. It's unfalsifiable within the seminar room because "proposition" is stretched to cover any representational content.
  *   **The Articulate Novice:** Anti-Intellectualists say "mere true belief isn't ability." Intellectualists say "They lack the practical mode of presentation."
  *   **Result:** Both sides have added epicycles (practical modes vs. intelligent dispositions) that make their theories immune to the standard counter-examples.

  ### 3. What Would Count as Progress?

  To break the stall, you need to force the debate onto a single layer or find a case that drives a wedge between the layers. Here are three specific moves that would generate actual progress:

  **A. The "Triviality" Challenge (Targeting Layer B)**
  Force the Intellectualist to specify what a "practical mode of presentation" is *without* defining it circularly as "the mode involved in knowing-how."
  *   *The Move:* Ask: "Is the practical mode of presentation distinct from the ability itself?"
  *   *If Yes:* Then we need an independent account of this mode. Where does it live? How is it distinct from the motor program?
  *   *If No:* Then Intellectualism is just a semantic claim about sentences, not a metaphysical claim about mind. It concedes the Anti-Intellectualist's point about the *nature of skill*, admitting that the "proposition" is just a shadow cast by the ability.
  *   *Progress:* A concession that Intellectualism is semantic, not psychological.

  **B. The "Guidance" Gap (Targeting Layer C)**
  Focus on the causal role of the state during action.
  *   *The Move:* Press the Intellectualist on *online control*. When a gymnast adjusts mid-air, is she consulting a proposition (even implicitly)?
  *   *The Wedge:* If the Intellectualist says "Yes, sub-personally," they risk making "proposition" mean nothing more than "information-bearing state." If they say "No," they concede that the *execution* of know-how is non-propositional, limiting their claim to the *possession* condition only.
  *   *Progress:* Distinguishing between *possessing* know-how (maybe propositional) and *exercising* know-how (necessarily non-propositional). This splits the difference.

  **C. The Empirical Wedge (Targeting Layer B)**
  You asked if there is a hidden empirical thing. Yes, but it has to be used carefully.
  *   *The Move:* Bring in the distinction between **Declarative** and **Procedural** memory systems (hippocampal vs. basal ganglia/cerebellum).
  *   *The Wedge:* Patients with amnesia (damaged declarative) can learn new motor skills (procedural) but cannot recall *that* they practiced.
  *   *The Trap:* Intellectualists will say "Procedural memory still encodes propositional content, just inaccessible to declarative recall."
  *   *The Counter:* If the systems are causally isolated, and the procedural system operates on non-combinatorial, non-conceptual representations, then positing a "proposition" there is a category mistake. It's like saying a thermostat "knows that" the room is 70 degrees.
  *   *Progress:* Shifting the burden of proof. The Intellectualist must explain why we should call procedural representations "propositional" other than to save the theory.

  **D. The Normative Dissolution (Your Friend's Route)**
  *   *The Move:* Accept the friend's premise. If "knows how" is a normative status, the question isn't "What is it made of?" but "What entitles one to the status?"
  *   *Progress:* This changes the seminar from Metaphysics to Epistemology/Ethics. The question becomes: "Is the entitlement to act based on possessing a truth (Intellectualist) or possessing a capacity (Anti-Intellectualist)?" This is a clearer, more resolvable debate.

  ### Summary Recommendation for the Seminar

  Stop discussing the swimmer. Stop discussing the manual. Those cases are too flexible.

  **Propose this distinction:**
  Distinguish **Knowledge-How Ascriptions** (Semantics) from **The Nature of Skill** (Metaphysics).

  1.  Ask the Intellectualists: "Are you making a claim about English sentences or about the architecture of the mind?"
  2.  Ask the Anti-Intellectualists: "Are you denying the semantic intuition, or just denying that the semantic structure mirrors the psychological structure?"

  **The Progress Condition:**
  The debate is only productive if the Intellectualist can specify a **non-trivial property** of the "practical proposition" that distinguishes it from a mere ability, *or* if the Anti-Intellectualist can explain intelligent action without *any* representational content.

  If they can't do that, your friend is right: you are arguing over a normative license using metaphysical tools, and the seminar should pivot to the pragmatics of epistemic ascription.
