prompt: |-
  ok so i'm in a phil of mind seminar this term and we've spent like three weeks on knowing how vs knowing that, and the discussion has totally stalled. one camp says knowing how to do something just is knowing a fact about a way of doing it, so even a swimmer who can't put her stroke into words still knows some proposition, maybe one she can't articulate. the other camp says no, knowing how is a distinct state, an ability or disposition, and piling up propositional knowledge never adds up to it. every week the same cases get trotted out -- the skilled person who can't explain what she does, the person who can explain but can't do it, the person who read the manual vs the person who's practiced -- and both sides just say well that's what my view predicts. nobody moves an inch.

  my hypothesis, tell me if it's right: it isn't one disagreement, it's at least two stacked on top of each other. part of it's verbal -- one side is really talking about the truth conditions of sentences like she knows how to swim, the other about the underlying mental state, and they keep using one phrase for both. part of it's substantive, about whether ascription-conditions track the state at all. and maybe the anti-intellectualist is making an explanatory claim (abilities explain skilled performance) while the intellectualist is making a semantic one, so they're answering seperate questions under a single heading. a friend in the group goes further and says the whole concept is basically normative -- know-how talk is how we license people to act and hold them responsible -- so asking what it's made of is malformed. i dont know what to do with that.

  so diagnose it: verbal, substantive, two questions wearing one coat, or is there a hidden empirical thing (procedural memory being a distinct system, or whatever) doing the real work? and given your diagnosis, what would actually count as progress -- a distinction, a concession, a case one side can't absorb -- or is it just under-specified and doomed to keep spinning? we've already read Ryle and the Stanley-Williamson line so skip the history, i want the structure of the impasse.
