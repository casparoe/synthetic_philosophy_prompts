answer: |-
  - The case (one paragraph, no analysis mixed in).
  A micro-robot rests on a platform that will drop in six seconds. To survive, it must launch a grappling hook, a motor action requiring 80% of its capacitor charge. The robot currently holds 90% charge. It can launch immediately at a fixed angle or spend three seconds running a lidar scan to calculate a precise trajectory. The scan is a physical process that draws current, draining the capacitor to 75% upon completion. The robot's memory contains full data regarding charge levels, motor requirements, timing, and the energy cost of the scan.

  - Outside-the-world verdict (a few sentences): what it picks, and why.
  It chooses to scan then launch. Because it models the decision moment as preceding physical execution, it treats the three-second deliberation as costless logic rather than a current-draining event, seeing the initial 90% charge as sufficient for both the planning phase and the 80% launch requirement.

  - Embedded verdict (a few sentences): what it picks, and why.
  It chooses to launch immediately. Because it models deliberation as a physical process occurring on the same battery clock as the motor, it calculates that scanning will drop charge to 75%, rendering the launch impossible, so it sacrifices accuracy for viability.

  - Whats doing the work (two or three sentences): name the single feature that makes them split, then tell me what happens to the disagreement if I take that feature out.
  The split is caused entirely by the physical cost of computation being included in the causal loop of the world. If you remove the energy cost of thinking (making deliberation truly free), both planners immediately agree that scanning is the optimal choice.

  - The comeback (a few sentences): what someone defending the outside-the-world planner says to argue the case away.
  A defender of the outside planner argues that treating deliberation as free is a necessary abstraction for complex reasoning, and the failure here is merely an engineering budget issue. They claim the hardware should have been efficient enough to make the thinking cost negligible relative to the action, so the logic remains sound even if this specific battery is too weak.
