      *   **Constraint 5 (Mechanism):** Divergence must stem from the readings themselves, not doubt or weakness.
      *   **Task 1 (The Check):** State decision, verdicts, reasoning, and the exact feature causing divergence. Show what happens if that feature is removed.
      *   **Task 2 (The Twist):** Change setup to *Selective Recurrence* (only some lives recur, unknown which). Analyze verdicts again. Does the Practical reading survive?
      *   **Task 3 (The Pushback):** How would a Nietzschean defuse this rigged case?
      *   **Format:** No citations.

  2.  **Deconstruct the Two Readings:**
      *   *Cosmological (Fact):* It *will* happen exactly the same way infinite times. My actions are fixed in the causal chain. If I do X, I do X forever. If I do Y, I do Y forever. The focus is on the *consequence* of the action being locked in.
      *   *Practical (Test/Affirmation):* The question is "Could you *will* this to happen infinite times?" It's a filter for authenticity/strength. If I can't will it, I should change my life *now* so that I *could* will it. The focus is on the *attitude* toward the action.

      *Challenge:* Usually, these align. If I hate my job, Cosmological says "Don't take it (or you're stuck forever)," and Practical says "Don't take it (or you can't affirm it)."
      *Goal:* Make them oppose.
      *Idea:* I need a situation where doing the "harder" thing creates a life you *can* affirm, even if the specific moment is painful, versus doing the "easier" thing which creates a life you *can't* affirm, even if the specific moment is pleasant.
      *Wait, that's still alignment.*
      *Better Idea:* The Cosmological reading emphasizes the *weight* of the specific act repeating. The Practical reading emphasizes the *narrative arc* or *character* required to affirm the whole.
      *Specific Divergence:*
      *   *Cosmological:* "If I do this specific painful thing, I suffer it forever. Minimize eternal suffering." -> Avoid the pain.
      *   *Practical:* "If I avoid this painful thing, I become a coward. I cannot affirm a life of cowardice. I must do the painful thing to make the life affirmable." -> Embrace the pain.
      *   *Wait, if ER is true cosmologically, do I have a choice?* Nietzsche struggles with determinism. But the prompt asks for a case where she is convinced it's true and has to make a decision. This implies a compatibilist or "decision as part of the cycle" view. Let's assume her deliberation is part of the causal chain.
      *   *Refining the Divergence:*
          *   Case: A mundane sacrifice.
          *   Cosmological View: Focuses on the *content* of the recurrence. "Do I want *this specific moment* repeated?" If it's painful, say no.
          *   Practical View: Focuses on the *agent* who recurs. "Do I want to be the *kind of person* who recurs?" If avoiding pain makes me weak, say yes to the pain.
      *   *Actually, let's flip it.*
      *   *Scenario:* Leaving a stable but soul-crushing job to start a risky venture.
      *   *Cosmological:* "If I leave, I might fail and suffer poverty forever. If I stay, I am bored but safe forever." Risk aversion might dominate because eternal poverty is worse than eternal boredom.
      *   *Practical:* "If I stay, I am a slave. I cannot affirm the life of a slave. I must leave to be the kind of person who *could* affirm the risk, even if the risk entails suffering."
      *   *Critique:* This feels a bit cliché. Let's make it more interpersonal.
      *   *Scenario:* A friendship that is draining but historically significant.
      *   *Decision:* Whether to gently fade out of a long-term friendship with a friend (let's call him Mark) who has become stagnant and depressing, but who relies on the protagonist (Sarah).
      *   *Cosmological:* "If I cut him off, I carry the guilt of abandonment forever. If I stay, I endure the drain forever." Guilt might weigh heavier than drain. -> Stay.
      *   *Practical:* "If I stay out of pity, I am living in bad faith/resentment. I cannot affirm a life built on pity. I must cut him off to affirm my own values, even if it causes guilt." -> Leave.
      *   *Wait, the prompt says "opposite verdicts."*
      *   Let's try: **The Decision:** Whether to confront a colleague about a minor ethical breach that benefits Sarah slightly if ignored.
      *   *Cosmological:* "If I confront, I create conflict that repeats forever. If I ignore, I live with a secret compromise." Eternal conflict is heavy. -> Ignore.
      *   *Practical:* "If I ignore, I am complicit. I cannot affirm the life of a complicit person. I must confront to be able to look in the mirror." -> Confront.
      *   *Is this strong enough?* The Cosmological reading isn't just "avoid pain." It's "acknowledge the weight of the fact." If the fact is "I am a person who ignores ethics," that's the fact that recurs.
      *   *Okay, I need a sharper distinction.*
      *   *Key Distinction:* **Optimization vs. Authentication.**
      *   *Cosmological (Optimization):* Since this exact sequence repeats, maximize the net positive value of the sequence. (Utilitarianism stretched over eternity).
      *   *Practical (Authentication):* The doctrine is a hammer. Use it to smash false idols. It doesn't matter if the sequence is "happier," it matters if it is *yours*.
      *   *Scenario:* Sarah is considering taking a promotion. It pays more but requires managing a team in a way she finds morally ambiguous (layoffs).
      *   *Cosmological:* "If I take it, I enact the layoffs infinite times. That is a lot of suffering caused by me. I should not take it." (Focus on the *output* of the action).
      *   *Practical:* "If I don't take it, I am letting fear rule me. I need to take power. The 'layoffs' are the reality of business; to deny them is slave morality. I must take it to affirm my will to power." (Focus on the *strength* of the agent).
      *   *Wait, that makes Nietzsche look like a monster.* Let's soften the ethics.
      *   *Scenario:* **The Caregiver Dilemma.**
      *   Sarah's aging parent is becoming difficult. Sarah can move them to a facility (good care, but parent feels abandoned) or keep them home (parent happy, Sarah's life stalled).
      *   *Decision:* Move them or keep them?
      *   *Cosmological:* "If I keep them home, I sacrifice my potential forever. The 'stalled life' repeats. If I move them, they feel sad forever." Which is the greater eternal weight? Usually, self-sacrifice is seen as 'heavier' in a negative sense over infinity. -> Move them (Minimize self-sacrifice).
      *   *Practical:* "If I move them to save my own potential, I am acting out of selfishness/resentment of burden. I cannot affirm a life where I shirk duty for 'potential'. I must keep them home to affirm the burden as *my* burden." -> Keep them.
      *   *Let's refine the "Feature that pulls them apart."*
      *   Feature: **The valuation of the "Self" vs. the "Act."**
      *   Cosmological: Values the *content* of the timeline (aggregate experience).
      *   Practical: Values the *stance* of the will (integrity/authenticity).
      *   *Wait, if ER is cosmologically true, the decision is already made.* The prompt acknowledges this tension ("she's been handed an argument... convinced... what she has reason to do"). We must treat the deliberation as the locus of the "reason."
      *   *Let's go with the "Regret vs. Integrity" angle.*
      *   *Decision:* Whether to apologize for a past mistake that is currently buried.
      *   *Cosmological:* "If I apologize, I reopen wounds and create conflict that repeats forever. If I stay silent, the secret remains." Silence is 'lighter' on the universe. -> Stay Silent.
      *   *Practical:* "If I stay silent, I am a coward. I cannot will the life of a coward. I must apologize to make the life willable." -> Apologize.
      *   *This works.* It's ordinary. It's not melodramatic (a past mistake, maybe a professional error or a lie to a friend).
      *   *Let's sharpen the Cosmological reasoning.* If the universe repeats exactly, the *consequences* are locked. If apologizing causes net suffering over the cycle, the "fact" of the universe is worse. The Cosmological reading treats ER as a multiplier of consequences.
      *   *Let's sharpen the Practical reasoning.* The Practical reading treats ER as a filter for the *quality of the will*. It doesn't care about the net suffering; it cares about whether the agent can say "Yes" to themselves.

  3.  **Drafting the Thought Experiment:**
      *   **Protagonist:** Elena.
      *   **Situation:** She got a job she wanted three years ago because a reference check was accidentally skipped due to an admin error. She knows it. No one else does. She's good at the job.
      *   **Decision:** Confess to HR now (risk job, reputation, stability) or stay silent (keep life as is).
      *   **Conviction:** She knows ER is true.
      *   **Cosmological Verdict:** Stay Silent. Why? Confessing creates chaos, job loss, financial stress, family anxiety. This sequence repeats infinitely. The "suffering units" are multiplied. Staying silent keeps the status quo, which is stable. The "lie" is a small static weight vs. the "chaos" of confession.
      *   **Practical Verdict:** Confess. Why? Living a lie means she cannot affirm her life. She is living in fear. To pass the "test," she must be the kind of person who owns their history. Even if the outcome is painful, the *will* that chooses pain over deceit is the only will that can affirm eternity.
      *   **Divergence Feature:** **Consequentialism vs. Deontology of the Will.** (Or: Weight of Outcomes vs. Weight of Character).
      *   **Removal:** If the confession had *no* negative consequences (everyone forgives instantly), both readings say Confess. The divergence relies on the cost.

  4.  **Drafting the Check:**
      *   Decision: Confess the administrative error or stay silent.
      *   Cosmological: Stay silent. (Minimizes eternal negative consequences).
      *   Practical: Confess. (Maximizes capacity for self-affirmation).
      *   Feature: The *cost* of integrity. If integrity were costless, they align.
      *   Removal: If confession = no penalty, both say confess.

  5.  **Drafting the Twist (Selective Recurrence):**
      *   **Setup:** Only *some* lives recur. You don't know if yours is one.
      *   **Cosmological:** Now it's a gamble. "If my life recurs, silence is better (less pain). If it doesn't, it doesn't matter." Expected value calculation. Probably still Stay Silent (risk aversion).
      *   **Practical:** This is the killer. The Practical reading relies on the *necessity* of the recurrence to test the weight of the moment. "Act *as if* it recurs."
      *   *Does it survive?* If I know my life might *not* recur, the "weight" is lifted. The test loses its teeth. If I'm not "on the hook" for eternity, why not live lightly?
      *   *Counter:* The Practical reading might shift to "Live *as if* it recurs regardless." But the prompt asks if it survives once affirmation is no longer something everyone is on the hook for.
      *   *Analysis:* The Practical reading collapses into mere aestheticism or stoicism. It loses the "greatest weight."
      *   *Nietzschean Pushback:* A Nietzschean would say I've misunderstood the "Selective" part. For the Übermensch, the distinction is irrelevant. They affirm *regardless*. Or, they would say the "Selective" premise is nihilistic cowardice. The doctrine *is* the selection mechanism. By asking "Is mine one of them?" you've already failed the test.

  6.  **Refining the Output:**
      *   Ensure tone is seminar-appropriate (analytical, precise).
      *   Check constraints: No citations. Ordinary life. Conviction assumed.
      *   Make sure the "Cosmological" reading doesn't sound like standard utilitarianism, but specifically about the *repetition* of the consequence.
      *   Make sure the "Practical" reading isn't just "be good," but about *affirmation*.

      *(Self-Correction during drafting)*: I need to be careful with the Cosmological reading. If ER is true, determinism is usually implied. If she has a choice, how is it cosmological? I must frame it as: "Given that my choice determines the eternal cycle, which cycle should I choose to instantiate?" It treats the choice as the pivot of the eternal machine.
      *Also, for the Selective Twist:* If only some recur, the "Greatest Weight" is removed. The Practical reading depends on the *inescapability* of the return. If it's a lottery, the weight is probabilistic. The Practical reading *needs* the certainty to function as an existential imperative.

      *(Refining the Nietzschean Pushback)*: The Nietzschean wouldn't accept the "Selective" premise as coherent with the *spirit* of the doctrine. The doctrine is meant to *create* the necessity, not describe a physical probability. To treat it as a lottery is to treat it cosmologically, which misses the point entirely. The "Practical" reading *is* the only reading that matters, so the "Selective" constraint is a category error.

  7.  **Final Polish:** Check the flow. Ensure the "Feature" is clearly identified. Ensure the "Removal" is clear. Ensure the "Twist" analysis is sharp.

