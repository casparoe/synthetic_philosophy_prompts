  6.  **Writing - Iteration 1 (Mental Outline):**
      Welcome everyone. 11 years is a long time. I've been thinking about how we know things. The Nyāya school says four ways. I know some colleagues are counting. Let's use them.
      1. Seeing. I saw you all grow.
      2. Inferring. You argue well. But you argue too much.
      3. Comparing. Newbies watch oldies. Like a cow and a gavaya. I know that's a stretch, but stay with me.
