answer: |-
  Thank you. Please, stay seated. The wine is doing its work, and I have no intention of standing between you and the port for longer than necessary.

  Eleven years is a long time to spend telling young adults how to speak. It is long enough, certainly, for them to start finishing my sentences, and long enough for me to realize that most of what I told them was wrong. I say that as a coach, but also as a student. Because while I have been teaching you how to argue, I have been trying to understand how we know anything at all.

  Tonight, I want to borrow a framework from the Nyāya school of Indian philosophy. I know there are colleagues in the room counting the categories on their fingers. I know the Buddhists would cut this list down to two, and the Mīmāṃsakas would expand it to include postulation and absence. But for the purpose of a farewell dinner, we will stick to the classic four *pramāṇas*, the four means of knowledge. They map, surprisingly well, onto what happens in this union.

  The first is perception. *Pratyakṣa*. This is the knowledge of the senses. It is what I have had for eleven years. I have watched you walk into this room as undergraduates, unsure of your voices, and I have watched you leave as barristers, journalists, and academics. I have seen the nervous hands steadied by the podium. I have seen the flash of insight when a rebuttal lands. This knowledge is direct. It requires no argument. I was here. I saw it happen.

  The second is inference. *Anumāna*. This is your house style. It is the engine of this society. You take a premise, you link it to a conclusion, and you test the strength of the bond. If the link breaks, the argument falls. For a decade, I have encouraged you to treat every claim as a hypothesis to be stress-tested. Take nobody's word for anything. Check it yourself. It is a rigorous way to move through the world, and it has made you formidable. But it is also exhausting. And, I have come to suspect, it is incomplete.

  This brings me to the third means, comparison. *Upamāna*. In the texts, this is often explained as learning the name of a wild animal by being told it resembles a cow. You know the cow; you see the resemblance; you identify the unknown. In this union, this is how tradition survives. The new members watch the older members. You learn what a debater looks like by seeing one in action, and you model yourselves on that shape. Now, I am aware that applying *upamāna* to social modeling is a stretch that might make my colleague in the third row wince. I offer it not as a strict philological claim, but as an admission that we learn our roles by recognizing them in others. We know what we are supposed to be because we have seen it before.

  But it is the fourth means that matters tonight. Verbal testimony. *Śabda*.

  This is the knowledge we gain when someone speaks to us and we understand them. And here, I must be careful, because this is where our debating culture and the reality of human life part ways. In this room, we are trained to treat testimony as a disguised inference. We are taught to think: *This speaker is reliable; reliable people speak truly; therefore, I accept this claim.* We make the trust a conclusion derived from evidence.

  But the Nyāya tradition insists that is not how it works. When you understand a sentence, the knowledge arrives with the words. It is not a calculation of character that happens beforehand. If I tell you the train has left, you do not first audit my biography for honesty before you look at your watch. You know it because I said it. Trust is not the premise of the conversation; it is the medium in which it swims.

  This is what I have failed to say for eleven years. Our house style—attack every premise, verify everything—is parasitic on a kind of knowledge that the style itself cannot account for. Almost nothing any of us in this room knows has been checked by us. We know our own names because our parents told us. We know history because teachers told us. We know love because partners told us. If we applied the union's rules to our lives, we would never leave the starting block. We would be stuck in an infinite regress of verification, starving while we fact-checked the menu.

  There is a fault line here that runs through contemporary epistemology as well, about whether trusting a teller is a special case of inductive inference. I suspect it is not. I suspect that to be human is to accept *śabda*, to accept that we are dependent on the word of another.

  I am leaving this union because it is time for someone else to hold that space. And in doing so, I am relying on testimony. I am not inferring my successor's competence from a dossier of past achievements. I am not calculating the probability of their success based on prior data. I am standing here and telling you that they are ready. And I ask you to accept that knowledge not because you have checked it, but because I have spoken it.

  So, to the alumni: thank you for returning, for proving that the arguments didn't ruin your appetites. To the parents and partners: thank you for lending us your children and your patience, and for tolerating the jargon that inevitably leaks into Sunday lunch. To the current members: keep arguing, but remember that the most important things you will ever know will come to you not from a rebuttal, but from a conversation.

  And to my successor: I leave you the gavel, the minutes, and the collective stubbornness of three decades of students. I trust you with them. Not because I have tested the premise, but because I know you.

  Please raise your glasses. To the union, and to the future.
