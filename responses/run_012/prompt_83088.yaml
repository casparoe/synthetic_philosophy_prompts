      *   **Core Message:** The debating style (attack every premise, verify everything) is parasitic on knowledge we accept on trust (testimony). We know almost nothing because we checked it; we know it because someone told us.
      *   **Structure:** Based on Nyāya epistemology's four *pramāṇas* (perception, inference, comparison, verbal testimony) as four movements.
      *   **Constraints/Traps:**
          *   Acknowledge the contested nature of the fourfold list briefly (Buddhists vs. Mīmāṃsakas) without making it a survey.
          *   *Upamāna* (comparison): Don't lazily equate it to "learning by analogy" if it's inaccurate. If stretching the definition, own it.
          *   *Śabda* (testimony): Crucial point. Do *not* reduce testimony to inference about the speaker's reliability. Nyāya says understanding a sentence yields knowledge directly, not via a separate inference step. This contrasts with debating culture. Mention the parallel in contemporary epistemology briefly.
          *   Tone: Warm, not solemn. Spoken style (no "firstly, secondly," no glossing Sanskrit like a lecture, no quotes).
          *   Length: Around 1,000 words.
          *   Humor: At least one joke at own expense (alumni get it, parents still find it funny).
          *   Ending: Raise a glass to the successor.
          *   Accuracy: Must withstand scrutiny from the Indian philosophy colleague.

  2.  **Deconstruct the Nyāya Framework for the Speech:**

      *   *Pratyakṣa* (Perception): What did I see directly? The room, the debates, the growth of students.
      *   *Anumāna* (Inference): The debating tool. Drawing conclusions from premises. The core of the activity.
      *   *Upamāna* (Comparison/Analogy): The tricky one. How do we learn the unknown from the known? In debating, this is modeling behavior. I need to be careful here. The prompt suggests the "learning by watching older debaters" analogy might be a stretch. I should frame it as recognizing the familiar in the new, or perhaps acknowledge the stretch gently. Let's aim for: learning the *role* of the debater by seeing others inhabit it.
      *   *Śabda* (Testimony): The punchline. The foundation. Trusting the word of another. This is where the critique of debating culture lands.

