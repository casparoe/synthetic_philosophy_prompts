prompt: |-
  I sit on the ethics advisory comittee of a mid-sized food company -- we do ready meals, some pet food, and on Thursday the board votes on whether to build our own insect-protein plant. The proposal is black soldier fly larvae in stacked trays, and at the end they get chilled and milled, which the engineers assure me is standard practice. Our supply-chain welfare policy has a species list attached to it, invertebrates aren't on it, and so the investment memo says the whole question is out of scope by definition -- which is the kind of sentence that makes a committee like ours feel decorative. I need to circulate a written opinion before Thursday: a clear recommendation (build, don't build, or build with conditions and a review date), reasons the board can actually act on, and the general rule we'd be committing ourselves to for next time, since we'll get more of these.

  Here's where it got interesting. Our one neuroscientist member circulated a draft test: protect a taxon when its nervous system has receptors that respond specifically to tissue damage, a central place where those signals converge with the animal's overall arousal and motivational state, and evidence that the signal can be traded off against other goals rather than just triggering a fixed reflex -- and he says a larva fails that third part, so we're clear. Our sustainability lead thinks a test like that is unverifiable at our scale and wants a blunt precautionary rule: if there's a non-trivial chance the animal suffers and we'd be doing it to trillions of individuals a year, we act as if it does, and the burden falls on whoever wants to build. A third member keeps noting that if we say no, the chicken we'd have sold instead comes from a supplier with a worse welfare record than ours, so our abstention might leave the world worse off overall. I genuinely don't know whether the capacity to suffer is a line you're on one side of or a matter of degree, or how much that should change the bottom line, but the memo has to take a position. Keep it to a page and a half, the board won't read more than that, and please don't just tell me both sides are respectable -- they want a recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Ethics Advisory Committee of a mid-sized food company (ready meals, pet food).
      *   **Task:** Write a written opinion/memo for the Board before Thursday's vote on building an insect-protein plant (black soldier fly larvae).
      *   **Constraints:** Max 1.5 pages, clear recommendation (Build / Don't Build / Build with Conditions), actionable reasons, establish a general rule for future cases. No fence-sitting ("both sides are respectable").
      *   **Key Conflict:**
          *   *Current Policy:* Invertebrates out of scope (makes committee feel decorative).
          *   *Neuroscientist Member:* Proposed a specific cognitive test (nociception + integration + trade-off). Claims larvae fail the "trade-off" test, implying no suffering.
          *   *Sustainability Lead:* Precautionary principle. Trillions of individuals + non-trivial chance of suffering = act as if they suffer. Burden of proof on builders.
          *   *Third Member:* Substitution effect. If we don't do this, chicken (worse welfare) fills the gap. Net welfare might be negative if we abstain.
      *   **Underlying Philosophical Tension:** Binary vs. Gradualist view of sentience/capacity to suffer.
      *   **Audience:** The Board (pragmatic, risk-averse, action-oriented).

  2.  **Determine the Recommendation:**
      *   *Option A: Don't Build.* Aligns with the Precautionary Principle. Risks: Loss of sustainable protein source, potential substitution with chicken (worse welfare), looks anti-innovation.
      *   *Option B: Build (Unconditional).* Aligns with current policy (out of scope) and Neuroscientist's test. Risks: Ethical reputational risk if science changes, makes the committee look toothless, ignores the scale (trillions).
      *   *Option C: Build with Conditions & Review.* This is the most pragmatic middle ground that satisfies the Ethics Committee's need for substance without halting progress. It acknowledges uncertainty (Precautionary) while allowing the project (Substitution/Sustainability) but imposes strict welfare standards (addressing the Neuroscientist's concerns practically).
      *   *Decision:* **Build with Conditions and a Review Date.** This allows the company to move forward but forces the ethical framework to evolve, preventing the committee from being "decorative." It addresses the scale issue and the substitution issue while acknowledging scientific uncertainty.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** State the position immediately. "Approve with Conditions."
      *   **The Ethical Problem:** Acknowledge the "out of scope" loophole. Admit that invertebrate exclusion is becoming scientifically and socially outdated.
      *   **Addressing the Internal Debate:**
          *   *Neuroscientist:* Acknowledge the rigor, but note that "failure to prove trade-offs" isn't "proof of no suffering." Science evolves.
          *   *Sustainability:* Acknowledge the scale (trillions). Even low probability x high volume = high ethical risk.
          *   *Substitution:* Acknowledge the chicken comparison. We must ensure the insect protein is *better* than the alternative, not just different.
      *   **The Recommendation (The "Meat"):**
          *   Condition 1: Welfare Standards (even if not legally required). Treat them *as if* they are sentient during rearing and harvest.
          *   Condition 2: The "Substitution Clause." Verify that this actually displaces higher-suffering protein, not just adding to the mix.
          *   Condition 3: The Sunset/Review Clause. Re-evaluate in 2 years based on new science.
      *   **The Precedent (General Rule):** Establish a framework for future "gray area" species. Move from a "Species List" to a "Sentience Risk Framework."
      *   **Closing:** Reiterate commitment to ethical leadership.

  4.  **Refining the Tone:**
      *   Needs to be professional, decisive, and concise.
      *   Avoid academic jargon where possible, but respect the neuroscience argument.
      *   Ensure it doesn't sound like a philosophical essay but a business risk/ethics assessment.
      *   *Self-Correction on Length:* Keep it tight. 1.5 pages is roughly 750-900 words single-spaced.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Say yes, but be careful.
      *   The "out of scope" rule is bad. We need to fix it.
      *   The scientist says they don't feel pain. The sustainability person says "what if?"
      *   If we say no, people eat chicken. Chicken suffer more.
      *   So we build, but we treat flies nicely.
      *   Next time, we don't use a list, we use a risk model.

  6.  **Drafting - Iteration 2 (Adding Nuance & Professionalism):**
      *   *Recommendation:* Approve the investment, contingent on adopting an "Invertebrate Welfare Protocol" and a 24-month review.
      *   *Reasoning:* The "out of scope" clause is a liability. Public perception is shifting.
      *   *Addressing the Scientist:* His test is a floor, not a ceiling. Absence of evidence isn't evidence of absence.
      *   *Addressing Sustainability:* Scale matters. Trillions count.
      *   *Addressing Substitution:* We need to track displacement.
      *   *Policy Change:* Move from "Exclusion List" to "Precautionary Tiers."

  7.  **Final Polish (Checking against constraints):**
      *   Did I pick a side? Yes (Build with Conditions).
      *   Is it actionable? Yes (Protocol, Review, Policy Change).
      *   Is it under 1.5 pages? (Need to monitor word count).
      *   Did I address the "decorative committee" fear? Yes, by forcing a policy update.

  8.  **Final Review of the Text:** (Writing the actual response based on the above thought process). *Ensure the distinction between the Neuroscientist's specific test and the broader ethical obligation is clear.* *Make sure the "Substitution" argument doesn't become an excuse for lax standards.*

      *(Self-Correction during drafting)*: I need to make sure I don't invalidate the neuroscientist entirely, but frame his test as *necessary but not sufficient* for ethical clearance. The precautionary principle should dominate due to scale.

      *(Refining the General Rule)*: The rule needs to be about how we handle *uncertainty*, not just insects. "When scientific consensus lags behind scale of impact, apply precautionary welfare standards."

  9.  **Final Word Count Check:** Aiming for ~800 words.

  **(Proceed to generate output)**
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** Ethics Advisory Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Insect-Protein Plant Investment

  **Recommendation**
  The Ethics Advisory Committee recommends **approving the investment to build the insect-protein plant, conditional on the adoption of specific welfare protocols and a mandatory 24-month ethical review.** We further recommend the immediate retirement of the "species exclusion list" in favor of a "Sentience Risk Framework."

  While the current supply-chain policy excludes invertebrates, relying on this exclusion exposes the company to significant reputational risk and ethical stagnation. The scientific consensus on invertebrate sentience is shifting rapidly; a policy that treats this question as "out of scope" renders the Committee decorative and leaves the Board vulnerable to future criticism. We must lead, not lag.

  **Rationale**
  Three key arguments were presented during our deliberation. All hold weight, but none are sufficient on their own.

  1.  **The Neuroscientific Threshold:** Our committee's neuroscientist proposed a rigorous test for suffering (nociception + integration + trade-off capacity), noting larvae currently fail the third criterion. While scientifically sound, this test establishes a *minimum* bar for confirmed sentience, not a *guarantee* of insensibility. Absence of evidence is not evidence of absence. Relying solely on this test ignores the possibility that our measurement tools are currently insufficient to detect complex states in organisms with decentralized nervous systems.
  2.  **The Precautionary Scale:** Our Sustainability Lead correctly noted the scale: trillions of individuals annually. Even if the probability of individual suffering is low, the sheer volume creates a massive aggregate ethical risk. In high-volume manufacturing, a low-probability welfare failure becomes a high-probability systemic harm. The burden of proof must shift: when scale is this high, we must act *as if* welfare matters until proven otherwise.
  3.  **The Substitution Effect:** We acknowledge that rejecting insect protein may not reduce total animal suffering if the demand is simply met by conventional poultry with verified lower welfare standards. However, "less bad" cannot be our only metric. If we enter this market, we must ensure we are setting a new standard, not merely replicating the ethical blind spots of the livestock industry.

  **Conditions for Approval**
  To proceed, Management must agree to the following:

  1.  **Adoption of an Invertebrate Welfare Protocol:** Despite the lack of legal requirement, the plant must operate under a "Precautionary Welfare Standard." This includes minimizing density, ensuring humane harvest methods (e.g., rapid chilling to induce torpor before milling, verified by independent audit), and avoiding unnecessary stressors during rearing. We treat the uncertainty of their capacity to suffer as a liability to be managed, not a loophole to be exploited.
  2.  **Displacement Verification:** Within 12 months, Supply Chain must present data demonstrating that this protein is displacing higher-suffering animal protein in our mix, rather than serving as a net-new additive. If it merely expands total protein volume without substitution, the ethical justification weakens.
  3.  **Mandatory Review Date:** This approval expires in 24 months. At that time, the Committee will review emerging science on arthropod sentience. If evidence of complex nociceptive trade-offs emerges, the protocol will be tightened or the project halted.

  **Establishing a General Rule**
  This decision sets a precedent for how we handle biological uncertainty. Effective immediately, the Committee recommends replacing the static "Species List" with a **Sentience Risk Framework**.

  *   **Tier 1 (Confirmed Sentience):** Mammals, birds, cephalopods, decapods. Full welfare protections apply.
  *   **Tier 2 (Uncertain/Debated):** Invertebrates, larvae, early-life stages of fish. Precautionary protections apply based on scale of impact. The burden of proof lies with the business unit to demonstrate low risk.
  *   **Tier 3 (Low Probability):** Microorganisms, plants. Standard safety regulations apply.

  **Conclusion**
  Approving this plant without conditions would signal that our ethics are reactive rather than proactive. By approving *with* conditions, we acknowledge the scientific uncertainty, respect the scale of impact, and ensure that our pursuit of sustainability does not come at the cost of invisible suffering. This allows the Board to innovate while maintaining moral integrity.

  We request confirmation of these conditions prior to the Thursday vote.
