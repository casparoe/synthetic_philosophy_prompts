answer: |-
  This is a classic philosophical standoff, essentially pitting the **Conventionalist/Practice View** (associated with philosophers like John Rawls or Joseph Raz) against the **Assurance/Expectation View** (associated with T.M. Scanlon or Hume).

  The Practice View says the obligation comes from playing by the rules of a social game. The Assurance View says the obligation comes from the moral wrong of manipulating someone's expectations.

  Here are two cases designed to pry them apart, followed by an honest assessment of how much weight they actually carry.

  ### Case 1: The Skeptical Promisee
  **Verdict:** Practice View says **Bound**; Assurance View says **Not Bound**.

  **The Scenario:**
  You and I are colleagues. I have a reputation for being chronically late. We are meeting for a working lunch. I look you in the eye and say, "I promise I will be there at 12:00 PM." I am sincere; I intend to be there. However, you know my history so well that you reply, "Look, I appreciate the sentiment, but I know you. I fully expect you to be twenty minutes late. I'm not counting on 12:00." I say, "No, this time I promise." You shrug and say, "Okay, but I'm still expecting 12:20."

  I arrive at 12:20. Did I break a promise?

  **The Practice Theorist says:**
  Yes, you broke a promise. The obligation is generated by the *act of invoking the convention*. By uttering the performative words ("I promise") with the requisite intention, you entered the institution of promising. The rules of that institution state that once you promise, you must perform. The promisee's internal state of mind (whether they trust you or not) is irrelevant to the creation of the obligation. You took on the duty; you failed to discharge it.

  **The Assurance Theorist says:**
  No, you did not break a promissory obligation (though you might be rude). The obligation is grounded in the *expectation you created and invited the other person to rely on*. Here, you explicitly failed to create that expectation. Your colleague told you they did not expect you to be there at 12:00. Since they did not form the expectation you were trying to assure them of, you did not successfully "assure" them. There is no disappointed reliance, no manipulated expectation. Therefore, the specific moral hook of promising never latched on.

  **The Feature Doing the Work:**
  **The Promisee's Epistemic State.**
  *   For the Practice theorist, the obligation is *agent-relative* (what *I* did).
  *   For the Assurance theorist, the obligation is *relational* (what happened between *us*).

  **The Removal Test:**
  If you remove the skepticism (i.e., the colleague says, "Great, I'll count on 12:00"), the case collapses back into the boring lunch-date example where both theories agree you are bound. The divergence exists *only* because the Assurance theorist ties the obligation to the successful transmission of expectation, while the Practice theorist ties it to the successful invocation of the rule.

  ***

  ### Case 2: The Explicit Opt-Out
  **Verdict:** Assurance View says **Bound**; Practice View says **Not Bound**.

  **The Scenario:**
  I am helping you move house. You are worried I'll flake out. I say to you: "Look, I know 'promise' is just a word, and I hate the pressure of that label. I am not going to promise you. However, I am telling you this as a fact: I will be there at 8:00 AM with my truck. You can plan around this." You hear this, decline to hire a removalist, and rely entirely on my statement. I do not show up.

  **The Assurance Theorist says:**
  You are bound. The moral wrong of promising is not about saying the magic word; it is about inviting reliance and then betraying it. You explicitly invited me to plan around your statement ("You can plan around this"). I did so. By failing to show up, you violated the principle of fidelity (or Scanlon's Principle F): you intentionally led me to expect you would come, knowing I wanted assurance, and then let me down. The lack of the word "promise" is a semantic distraction; the moral substance is identical.

  **The Practice Theorist says:**
  You are not bound *by the practice of promising*. The practice is a social convention with specific entry conditions. Just as you cannot score a goal in soccer by carrying the ball over the line, you cannot enter the practice of promising by explicitly rejecting its conventional marker. You opted out of the institution. (Note: A Practice theorist might say you are bound by a *different* moral duty, like general honesty, but they must concede you did not incur the specific *promissory* obligation, which is defined by the rules of the practice).

  **The Feature Doing the Work:**
  **The Use of the Conventional Marker.**
  *   For the Practice theorist, the marker ("I promise") is the *key* that unlocks the institutional door.
  *   For the Assurance theorist, the marker is merely *evidence* of the intent to assure; it is not necessary if the intent is clear otherwise.

  **The Removal Test:**
  If you remove the opt-out (i.e., I just say "I will be there at 8:00 AM" without the "I'm not going to promise" preface), the Practice theorist will likely argue that "I will be there" *is* a conventional marker in ordinary English. The case collapses back into agreement. The divergence exists *only* because the speaker explicitly tried to sever the link between the commitment and the convention.

  ***

  ### Honest Assessment: Load-Bearing or Cheap Trick?

  Here is the hard truth about how well these cases work to distinguish the theories.

  **Case 1 (The Skeptical Promisee) is the Load-Bearing Case.**
  This is the stronger wedge. It highlights a fundamental metaphysical disagreement about where the obligation "lives." Does it live in the speaker's act (Practice) or the listener's uptake (Assurance)? It is very difficult for the Assurance theorist to say I am bound when I explicitly told you *not* to expect me. It is very difficult for the Practice theorist to say I am *not* bound when I clearly used the institutional language. This case forces a real choice.

  **Case 2 (The Explicit Opt-Out) is a Cheap Trick (mostly).**
  This case is vulnerable to a "re-description" maneuver by the Practice theorist. A sophisticated Practice theorist (like Rawls) will not define the practice so narrowly that it requires the specific phoneme "promise." They will argue that the *practice* of promising in English includes phrases like "I give you my word," "I guarantee," or even firm assertions like "I will be there" *when relied upon*.
  If the Practice theorist says, "By saying 'You can plan around this,' you actually *did* invoke the practice, you just didn't use the label," then Case 2 collapses. The Practice view expands to cover any act that functions like a promise. If they do this, however, they risk merging into the Assurance view.

  **Are the Views Actually Distinct?**
  Case 2 reveals the tension.
  *   If the Practice theorist insists the *word* matters, they seem fetishistic about language (why does the sound "promise" create duty when "guarantee" doesn't?).
  *   If the Practice theorist says the *function* matters (any act that invites reliance counts as invoking the practice), then the Practice view essentially swallows the Assurance view. It becomes: "The practice is to be bound when you assure someone."

  The only way they remain truly distinct is if the Practice theorist insists that there are **obligations generated by the convention that exceed the harm of disappointment.** For example, if I promise to give you $10, you don't rely on it, and I don't give it to you:
  *   **Assurance:** No harm done, no wrong (or a very small one).
  *   **Practice:** I broke the rule. I owe you the $10 regardless of whether you cared.

  **Confidence Levels:**
  *   **Confidence that Case 1 distinguishes the theories:** 85%. (It isolates the locus of obligation well).
  *   **Confidence that Case 2 distinguishes the theories:** 40%. (It relies on the Practice theorist being rigid about semantics, which they often aren't).
  *   **Confidence that the theories are fundamentally distinct:** 60%. (They often converge in practice, differing mostly in *explanation* rather than *verdict*, except in edge cases like Case 1).

  **The Single Point I Am Least Sure About:**
  I am least sure about the **Practice Theorist's response to Case 1.** A clever Practice theorist might argue that the *rules of the practice* include a condition that the promise must be intelligible and accepted as a promise by the hearer. If the hearer says "I don't believe you," the Practice theorist might claim the "move" was invalid, like trying to castle in chess while in check. If they argue that, then Case 1 collapses, and the two theories become almost indistinguishable in ordinary life. Whether the "rules of the practice" include the hearer's uptake is the fulcrum the whole debate rests on.
