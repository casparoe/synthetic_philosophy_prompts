answer: |-
  1. You define semantic competence as a relation between corpora rather than a relation to the world, arguing that internal states are sensitive to inferential roles. In a neural network, these states are vector positions determined by statistical co-occurrence. How do you distinguish a vector's sensitivity to a normative *inferential role* from mere statistical correlation? What adds the "ought" to the "is" of the weight matrix?

     *Follow-up:* If you answer that systematicity provides the normativity, how do you account for systematic error? If a model consistently infers incorrectly but does so systematically across the corpus, does your account grant it understanding, or does correctness require an external anchor you claim to reject?

  2. A common objection is that your view makes understanding too cheap—that a sufficiently large bilingual dictionary or a lookup table could satisfy the condition of being sensitive to translational roles. Where exactly does your account draw the line between a static lookup mechanism and a system capable of inferential sensitivity?

     *Follow-up:* If you argue that the line lies in compositional generalization to unseen data, does this not implicitly rely on a shared structure between languages that mirrors the world, thereby reintroducing the world-model you explicitly deny is necessary?

  3. You must distinguish translation from paraphrase. Both involve mapping expressions to other expressions based on inferential roles. If understanding is just sensitivity to these roles, what prevents the distinction between translating "chien" to "dog" and paraphrasing "bachelor" to "unmarried man" from collapsing on your account?

     *Follow-up:* If you claim the distinction is merely pragmatic or based on corpus boundaries, does this imply that a monolingual system incapable of cross-lingual mapping could never truly understand, even if its inferential grasp within one language is perfect?

  4. Let's press on reference. You argue reference is a translational posit that earns its keep within a practice, not a prerequisite for understanding. If reference is internal to the practice, how do you explain the possibility of radical mistranslation? What makes a translation *wrong* if not a failure to latch onto the same referent?

     *Follow-up:* If you say mistranslation is a failure of inferential coherence within the target corpus, how do you handle cases where the target corpus itself is systematically mistaken about the world? Does the machine translate the error faithfully, and if so, is that understanding?

  5. This leads to Quine's indeterminacy of translation. If meaning is fixed by inferential roles within a corpus, and those roles are underdetermined by behavior, does your view embrace the conclusion that there is no fact of the matter about whether a translation is correct, provided it fits the web of inference?

     *Follow-up:* If you welcome this indeterminacy, how do you reconcile it with the high-stakes precision required in domains like law or medicine, where your model suggests there is no substantive difference between competing translations that preserve inferential role?

  6. Searle's Chinese Room argument claims that syntax manipulation is insufficient for semantics. You claim inferential sensitivity is sufficient. Is the difference between your view and Searle's merely that you define semantics as syntactic relations between corpora, whereas he demands intentionality directed at objects?

     *Follow-up:* If you concede that you are redefining semantics to exclude intentionality, does this not render your claim that the machine "understands" equivocal, serving only to shift the goalposts rather than address the phenomenological gap Searle highlights?

  7. Hofstadter charged that early machine translation was "shallow" because it lacked access to the deep concepts behind the words. You describe your account as deflationary but substantive. Is "depth" on your view simply a function of the dimensionality of the inferential space, or is there a qualitative difference between human conceptual grasp and vector proximity?

     *Follow-up:* If you argue it is only a difference in degree, does this not imply that human understanding is also ungrounded, reducing our cognitive lives to nothing more than complex translation between internal and external corpora?

  8. You deny that embodiment or a shared world model is necessary for understanding. Yet, humans resolve ambiguity (e.g., "bank" of a river vs. "bank" of money) using contextual cues often rooted in physical experience. How does a system without embodiment distinguish these inferential roles without implicitly modeling the physical context that separates them?

     *Follow-up:* If you argue that the corpus contains sufficient contextual markers to resolve this without world access, does this not suggest the corpus itself acts as a surrogate world, thereby functioning as the grounded representation you claim is unnecessary?

  9. What specific empirical evidence or argument would count against translational inferentialism? I am not asking for policy concerns, but rather what phenomenon in language or cognition would force you to abandon the claim that corpus relations are sufficient for understanding?

     *Follow-up:* If you respond that no empirical evidence could refute it because it is a conceptual claim about what "understanding" means, does this not insulate the theory from falsification and reduce it to a stipulative definition rather than a substantive thesis about cognition?

  10. Finally, if machine translation systems understand languages in this deflationary sense, what does this imply for human bilinguals? Are we merely sophisticated translation engines operating between internalized corpora, or does human understanding retain a privilege your account denies?

      *Follow-up:* If you argue humans are also operating on inferential relations without direct world access, does this not lead to a form of idealism where the world drops out of the picture entirely for both man and machine?

  ***

  **Note on the line of questioning:**
  The through-line here is **Normativity vs. Regularity**. The guest's position attempts to ground meaning in the internal relations of corpora (inferential roles) while stripping away external constraints (reference, embodiment, world-models). The questions are designed to test whether this internal coherence is sufficient to support the normative aspects of meaning (correctness, error, distinction between tasks) without collapsing into triviality (lookup tables), indeterminacy (Quine), or emptiness (Searle/Hofstadter critiques). The sequence moves from the mechanism to the threshold of understanding, then to the consequences for error and reference, and finally to the falsifiability and metaphysical implications of the view.
