      *   *Self-Correction on "Patient":* Make sure to emphasize that while the *state* is often cast as the patient, it's really the *political culture* or *public sphere*. But strictly speaking, the analogy fails ontologically.
      *   *Refining the "Fourth Case":* Ensure the distinction between "crime against external victim" (Germany/Japan/Turkey mostly) and "domestic order" (US South) is clear regarding the *beneficiaries*. In Germany, the Third Reich was abolished. In the US, the constitutional order continued.

  10. **Final Polish:** Organize with clear headings. Ensure the "Straight Answer" is prominent. Make sure the "Breaks" are categorized clearly (Fatal vs. Manageable).

  *(Self-Correction during drafting)*: I need to be careful not to validate the friend's historical claims as absolute truth (e.g., "Germany is healed") but treat them as premises of the analogy to be audited. The prompt asks to audit the *analogy*, not the history, though the history informs the fit. I must point out that Germany isn't actually "cured" either, which breaks the "Terminus" point.

  *(Refining the Alternatives)*: "Contested Archive" seems strongest for political science. "Legal Settlement" is what politicians often want (closure). "Trust" is good for reparations talk. I will select the best three or four as requested.

  *(Final check on constraints)*: "Finish by telling me whether the normative conclusion survives the audit." Make sure this is a distinct section.

