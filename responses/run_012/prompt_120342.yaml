answer: |-
  TO: Board of Directors
  FROM: Chair, Bylaws Committee
  DATE: October 26, 2023
  SUBJECT: Recommendation on Voting Rules

  I recommend we adopt the Ranked Pairs Condorcet method for all multi-candidate races, utilizing a deterministic locking order based on victory margins to resolve cycles. To enable this, we must amend the bylaws to remove the clause requiring independence of irrelevant alternatives (IIA).

  The recent vice-presidential election demonstrated the failure of plurality voting and our current sequential pairwise agenda. A spoiler candidate altered the outcome despite no change in member preference between the top two contenders. Furthermore, our current procedure allows the voting order to dictate the winner, inviting agenda manipulation. Ranked Pairs resolves this by determining the voting order internally based on victory margins, preventing external agenda manipulation and ensuring the result reflects the will of the majority.

  We cannot retain the current IIA clause. Arrow's Impossibility Theorem establishes that no ranked voting system can simultaneously satisfy IIA, majority rule, and non-dictatorship. Since our primary goal is to prevent spoilers and respect majority preferences (the Condorcet criterion), we must sacrifice IIA. Retaining IIA would force us back to plurality or a dictatorship, neither of which is acceptable.

  Regarding strategic voting: No system is immune. The Gibbard-Satterthwaite theorem confirms that members will always have some incentive to misreport rankings under certain conditions. However, Condorcet methods are significantly more resistant to tactical voting than plurality or points-based systems. While we cannot eliminate manipulation, we can minimize its impact.

  The faction favoring a points system (e.g., Borda) sacrifices the Majority Criterion for simplicity. Under a points rule, a candidate preferred by over 50% of members can still lose if they are polarizing. This is politically indefensible for leadership selection. They also give up the guarantee that a candidate who beats all others head-to-head will win. While points systems always produce a transitive ranking without complex cycle-breaking rules, the risk of violating majority will outweighs the administrative convenience. The Points faction argues that a non-viable candidate shouldn't change the winner; however, Condorcet methods handle this better than points systems, which are highly sensitive to the number of candidates running.

  Adopting Ranked Pairs requires updating our ballot design to allow full rankings and training staff on the count procedure. However, it provides the most defensible standard: the winner is the candidate who strongest commands majority support against all rivals, immune to spoilers and agenda manipulation. Legitimacy matters more than counting speed; a winner who loses head-to-head against a rival is vulnerable to claims of illegitimacy. This trade-off ensures our elections reflect genuine member preference rather than procedural artifacts.
