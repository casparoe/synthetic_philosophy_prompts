      *   The board wants: Majority rule (Condorcet criterion) OR Points rule (Borda), no single dictator, unrestricted domain.
      *   Arrow's Impossibility Theorem states you can't have IIA, Pareto efficiency, Non-dictatorship, and Unrestricted Domain all at once with a ranked voting system that produces a transitive social ordering.
      *   The prompt mentions the current procedure settles pairwise questions in a fixed order, which flips outcomes (agenda manipulation). This suggests a sequential pairwise voting system (like an amendment procedure) which is vulnerable to manipulation.
