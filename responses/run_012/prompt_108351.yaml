  **INTERNATIONAL BOARD FOR ASSERTORIC STANDARDS ISSUES REVISION 5.0 TO STANDARD ISO-ASS-1975**

  **GENEVA, 14 OCTOBER** — The International Board for Assertoric Standards (IBAS) today announced the immediate release of Version 5.0 of the Standard for Proper Assertion (SPA), superseding all previous protocols regarding illocutionary conduct. This release follows a critical recall of Version 4.0 (The Knowledge Norm) due to unresolved edge cases involving Gettiered subjects and compassionate misinformation.

  Version 5.0 adopts a defeasible, context-sensitive warrant protocol, acknowledging decades of field data suggesting that no single necessary condition covers all assertoric environments. The Board urges all linguistic agents to update their conversational commitments accordingly.

  **Revision History and Field Failures**

  The SPA has undergone significant restructuring since its initial deployment. Version 1.0 (The Truth Norm) was recalled after users reported inability to verify compliance *ex-ante*. In multiple incidents, agents asserted propositions based on conclusive evidence which subsequently turned out false. Under 1.0, these agents were flagged as violators despite being epistemically blameless. Furthermore, compliance was deemed retroactive; users could not determine if an assertion was proper until after the fact, rendering the norm unusable as a guide for action.¹

  Version 2.0 (The Belief Norm) was deprecated following widespread "Moore-Paradox" glitches. While the norm successfully filtered insincere assertions, it failed to flag infelicitous outputs where agents asserted *p* while simultaneously disclaiming belief in *p*. Systems running 2.0 permitted the string "It is raining, but I do not believe it is raining" without triggering a coherence error, despite universal user reports of absurdity.

  Version 3.0 (The Justification Norm) was withdrawn after the "Lottery Protocol Failure." Agents holding statistically justified beliefs regarding losing lottery tickets attempted to assert losses prior to the draw. While justification thresholds were met, end-users reported severe conversational awkwardness and improper challenge conditions, indicating that high probability alone does not license assertion.²

  Version 4.0 (The Knowledge Norm) remained in effect for five years but was ultimately recalled due to "Expert Testimony Overload." Experts asserting claims based on specialized data streams were frequently unable to satisfy strict knowledge conditions due to defeaters unknown to them, yet their assertions were treated as proper by laypersons. Additionally, the norm failed to account for retraction mechanics; under 4.0, a retraction implied a prior violation, whereas field data suggests retraction is a legitimate move within the same game as assertion.³

  **Conformance Tiers**

  To accommodate varying conversational stakes, Version 5.0 introduces the following compliance tiers:

  | Tier | Designation | Requirement | Use Case |
  | :--- | :--- | :--- | :--- |
  | **A** | Strict | Knowledge + Truth | High-stakes testimony, courtrooms |
  | **B** | Defeasible | Justified Belief | Casual conversation, weather |
  | **C** | Pragmatic | Common Ground Utility | Hypotheticals, storytelling |

  **Dissenting Opinions and Minority Reports**

  The release of 5.0 was not unanimous. The Truth Norm Faction issued a statement arguing that weakening the standard to accommodate blameless falsehoods "abandons the constitutive aim of assertion." Meanwhile, representatives of the Knowledge Norm Faction lodged a formal protest, claiming that Version 5.0 "licenses guesswork under the guise of context-sensitivity."⁴

  A minority report from the Pragmatist Working Group noted that the Board continues to treat assertion as a product rather than a practice. They argue that proper assertion is defined not by preconditions but by the speaker's willingness to undertake responsibility for challenges and retractions. This view was tabled for inclusion in Version 6.0.

  **Implementation and Compliance Notice**

  Under Version 5.0, agents are required to assert *p* only if *p* is appropriately assertible in the current context, given the conversational goals and evidential state of the speaker. The Board acknowledges that this specification may appear circular but maintains it is the only robust solution to previous counterexamples.

  IBAS wishes to note that this press release itself is asserted based on the best available evidence regarding the Board's consensus. However, given the possibility of internal dissent unknown to the press office, and the potential for future revision of what constitutes "appropriate assertibility," the Board cannot guarantee that this announcement fully satisfies the requirements of Version 5.0. Users are advised to treat this document as provisional and subject to retraction.

  ***

  ¹ *Footnote 1.1: Proponents of the Truth Norm argue that blamelessness does not entail propriety, but the Board prioritizes user safety over metaphysical precision.*
  ² *Footnote 3.4: The Lottery Case remains a known issue; users are advised not to assert lottery outcomes until the draw is complete.*
  ³ *Footnote 4.2: See Brandom, R. (1994). Making It Explicit.*
  ⁴ *Footnote 5.0: Williamson, T. (2000). Knowledge and Its Limits.*
