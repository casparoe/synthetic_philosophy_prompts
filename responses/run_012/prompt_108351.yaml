      *   **Key Content Requirements:**
          *   Narrate revision history as product recalls/field failures.
          *   Handle specific cases correctly (without explaining them):
              *   False but blameless assertion (defeats Truth Norm).
              *   Moore-paradoxical assertions (defeats Belief Norm-ish/creates awkwardness).
              *   Lottery case (defeats Justification/Knowledge distinction).
              *   Retroactive truth problem (defeats Truth Norm as a guide).
          *   Include dissenting statements/footnotes from factions (Truth, Belief, Knowledge, Justification).
          *   Include Pragmatist view (common ground/retraction).
          *   End with a hedged, context-sensitive concession.
          *   Include a rueful admission that the press release itself violates the norm.
      *   **Constraint:** No meta-commentary, no explaining the joke. Must be philosophically sound.

  2.  **Deconstruct the Philosophy & Counterexamples:**
      *   *Truth Norm (TN):* Assert $p$ only if $p$ is true.
          *   *Counterexample:* False but blameless assertion (e.g., misleading evidence). If I assert $p$ based on great evidence, but $p$ is false, TN says I violated the norm. But intuitively, I wasn't improper/blameworthy.
          *   *Issue:* Retroactivity. I can't know if I conform until after the fact.
      *   *Belief Norm (BN):* Assert $p$ only if you believe $p$.
          *   *Counterexample:* Moore's Paradox ("$p$, but I don't believe $p$"). Asserting this violates BN, but also feels absurd even if true. Also, one can believe $p$ but have no evidence (lucky guess) — seems improper to assert.
      *   *Knowledge Norm (KN):* Assert $p$ only if you know $p$ (Williamson).
          *   *Counterexample:* Lottery Case. I believe my ticket will lose, I have statistical justification, but do I *know*? If I assert "Your ticket will lose," it seems improper, supporting KN. But if I assert "My ticket will lose," it feels weird. Actually, the Lottery Case is often used to show Justification isn't enough for Knowledge. Wait, let's refine.
          *   *Lottery Case:* High probability but not knowledge. Asserting "Ticket $n$ will lose" seems improper despite high justification. This supports KN over Justification Norm.
          *   *Gettier/False Lemmas:* Sometimes we assert things that turn out true but weren't known properly.
          *   *Expert Assertion:* Doctors asserting things based on statistics vs. knowledge.
      *   *Justification/Warrant Norm (JN):* Assert $p$ only if justified.
          *   *Counterexample:* Lottery case (justified but improper?). Or False but Justified (blameless).
      *   *Pragmatist:* Assertion is a move in a language game (Brandom/Stalnaker). Retraction is part of the norm.

  3.  **Drafting Strategy - Section by Section:**

