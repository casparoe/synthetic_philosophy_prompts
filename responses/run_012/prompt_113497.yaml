prompt: |-
  ok so im a junior in high school and im in this philosophy club where we have to present our own views on responsibility, and i picked the topic of omissions, like when you dont do something and it causes harm. i wrote down what i actually think but now im worried its a mess. can you audit it and tell me if it hangs together?

  here are my commitments:

  - Omissions can cause things. If i promise to water your plants and then forget, my not watering them is what killed them.
  - Causation is difference-making. If the effect wouldnt have happened had the thing been different, then the thing is a cause.
  - But omissions arent events or things, theyre absences. So calling an omission a cause is weird, like saying a hole caused the water to pool.
  - I think there is a real moral difference between killing and letting die.
  - I think that moral difference comes from norms, not from the causal facts. Both are causes, but the omission violates a norm.
  - I think causal selection is interest-relative. Out of all the difference-makers, we pick the cause based on whats abnormal or norm-violating.
  - So i think there is no fact of the matter about the cause independent of our interests.
  - But i also think there is a fact of the matter about whether something is a cause, because difference-making is objective.
  - I think omissions are causes only when there is a norm requiring action. The same not-doing is a cause in the lifeguard case but not in the random stranger case.

  does this hang together? which pairs actually clash, which ones only look like they clash, and how bad is each clash? for the real ones, whats the cheapest fix and what does it cost? rank them from worst to mildest and tell me which single change would clean up the most. also if any of these is doing no work and can just be dropped without changing the rest, say so. i definately need to know which specific ones to give up, so please dont just say its all fine or all inconsistent.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User and Request:**
