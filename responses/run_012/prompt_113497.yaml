      *   *Check C2/C8 vs C9.* C2 says causation is difference making. Difference making is objective. C9 says causation depends on norms. Norms are not objective facts about the physical world. So C2+C8+C9 is a triangle of inconsistency.
      *   *Strategy:* The user wants to ground responsibility in norms. It is easier to keep causation objective and make *responsibility* normative, rather than making *causation* normative. This is the standard "Counterfactual Theory of Causation + Normative Theory of Responsibility" move.

  9.  **Final Polish:** Ensure tone is encouraging but critical. (Proceed to generate response).

  *(Self-Correction Note)*: I need to be careful not to tell them what is *true*, but what is *consistent*. However, since they asked for an audit, I should point out which philosophical path is smoother. The "Causation is objective, Responsibility is normative" path is much more defensible for a high school presentation than "Causation is normative."

  Let's organize the clashes:
  1.  **C2/C8 (Objective Causation) vs. C9 (Normative Causation).** This is the metaphysical crash.
