answer: |-
  **Distinctions: Keep vs. Drop**
  To make luck egalitarianism administrable, we must drop metaphysical questions about "free will" and "moral blame." Examiners cannot judge souls. We keep **foreseeability** and **reasonable prudence**. The core distinction shifts from "Choice vs. Circumstance" to "Reasonable Avoidability vs. Unavoidable Vulnerability." We treat a loss as "own doing" not if the applicant sinned, but if a reasonable person in their position would have insured against or prevented it at reasonable cost. This客观ifies the inquiry.

  **The Decision Procedure**
  Examiners must answer these questions in order. A "No" stops the process unless indicated.

  1.  **External Initiation:** Was the loss triggered by an event outside the applicant's direct control (e.g., crash, flood, illness vs. spending, quitting)?
      *   *No:* **Deny.** (Handoff to Supervisor if applicant claims coercion/duress).
      *   *Yes:* Proceed to 2.
  2.  **Foreseeability:** Was this type of risk known to a reasonable person in their position?
      *   *No:* **Grant.**
      *   *Yes:* Proceed to 3.
  3.  **Prudent Insurance:** Could a prudent person have insured against or prevented this loss at a cost not exceeding 5% of their annual income?
      *   *No:* **Grant.**
      *   *Yes:* Proceed to 4.
  4.  **Mitigation:** Did the applicant take reasonable steps to minimize the loss after the event?
      *   *No:* **Deny.**
      *   *Yes:* **Deny** (Because the vulnerability was chosen).

  **Supervisor Handoff:** If Question 3 yields a "Deny" but the applicant demonstrates immediate threat of homelessness or starvation, flag for Supervisor. This acknowledges the "cruelty" objection without binding examiners to value judgments.

  **Case Applications**

  1.  **The Trucker:** Hit by another driver (Q1: Yes). Injury risk is foreseeable (Q2: Yes). Union offered disability coverage at standard rates (Q3: Yes, assumingly affordable). He skipped it.
      *   *Result:* **Deny.**
      *   *Note:* The agency will dislike this. He is a victim of another's negligence. However, under this procedure, the *financial vulnerability* was his doing. The fund compensates for brute luck, not chosen exposure to risk. Paying him subsidizes his decision to under-insure relative to peers.

  2.  **The Homeowner:** Flooded (Q1: Yes). Living in a flood plain makes flood risk foreseeable (Q2: Yes). Flood insurance is commercially available (Q3: Yes). Rebuilt without it.
      *   *Result:* **Deny.**
      *   *Note:* Straightforward option luck. He gambled on nature and lost. Paying him punishes neighbors who paid premiums.

  3.  **The Gambler:** Spent savings on app (Q1: No). Spending is a direct control event.
      *   *Result:* **Deny.**
      *   *Note:* This is the "cruelty" test case. She chose the risk.

  **Limitations and the Cruelty Objection**
  This procedure cannot solve structural injustice. It assumes insurance markets function fairly and that "reasonable cost" is neutral, which ignores that poverty makes insurance disproportionately expensive.

  Regarding the Gambler (and the Trucker): Your director asks why denying them isn't cruelty. The honest answer is: **It is harsh, but necessary for the fund's purpose.** Luck egalitarianism holds that justice requires compensating those who suffer bad *circumstances*, not those who suffer bad *bets*. If we pay the gambler, we deplete resources available to the woman whose house burned due to faulty wiring she couldn't afford to fix. We abandon the imprudent not to punish them, but to preserve the safety net for the helpless. The "Supervisor Handoff" is the only pressure valve; it admits that sometimes, preserving human life trumps philosophical consistency. But examiners cannot make that call. They must apply the rule. If the rule bites, it bites. That is the cost of a capped fund administered by humans who cannot judge moral worth, only factual avoidability.

  This procedure stabilizes expectations. It tells applicants: "We protect you from the unexpected, not the uninsured." It tells examiners: "Don't judge character, judge prudence." It tells the appeals board: "Consistency over compassion." You can live with that.
