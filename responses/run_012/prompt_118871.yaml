      *   *The Medium:* For Collingwood, the medium must be mastered to express the emotion. The AI model is a black box of craft (technique) encapsulated. The user is manipulating parameters (prompts), not directly engaging with the imaginative material in the way a poet engages with language or a painter with paint.
