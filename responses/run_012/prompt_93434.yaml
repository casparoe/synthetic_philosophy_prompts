  *(Self-Correction Note)*: I need to be careful not to sound dogmatic. The friend is a math grad student, so they respect rigor. The argument must be rigorous. The key is the distinction between the *object language* and the *meta-language*, or more simply, *syntax* vs. *semantics* vs. *pragmatics*. The friend is trying to solve a pragmatic problem (how to move) with a syntactic solution (add a line).

  Let's structure the response:
  1.  **The Verdict:** Direct answer.
  2.  **The Diagnosis:** The Category Mistake (Rule vs. Premise).
  3.  **The Instinct:** Belief vs. Practice (Knowing How vs. Knowing That).
  4.  **The Circularity:** Hinge/Transcendental vs. Vicious.
