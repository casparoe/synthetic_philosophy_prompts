answer: |-
  1. **Normative Correctability:** The theory must permit the judgment that past classifications (e.g., drapetomania, homosexuality) were objectively mistaken, not merely outdated or less useful.
  2. **Constructive Realism:** The theory must distinguish between socially constructed categories that are real and functional (e.g., money, PTSD) and those that are arbitrary or purely ideological.
  3. **Reliability-Validity Independence:** The theory must allow that a classification can be highly reliable (consistent across clinicians) yet invalid (failing to carve nature at its joints).
  4. **Interactive Kind Compatibility:** The theory must account for looping effects where human subjects adapt to classifications, altering the extension and experience of the kind over time (e.g., DID, autism).
  5. **Comorbidity and Cross-Cutting Accommodation:** The theory must explain high rates of co-occurrence and transdiagnostic treatment responses without collapsing all categories into a single general distress factor.
  6. **Threshold Pragmatism:** The theory must accommodate the fact that diagnostic boundaries are often set by utility and consensus rather than natural breakpoints, mechanically affecting prevalence when moved.
  7. **Cultural Portability:** The theory must explain why some syndromes travel across cultures while others remain bound to specific ecological niches (culture-bound syndromes).
  8. **Historical Contingency:** The theory must explain why specific categories emerge and vanish (e.g., hysteria, childhood bipolar) based on professional fashion and advocacy without rendering all categories equally contingent.

  ***

  **1. Normative Correctability**
  A theory of classification must explain how we can say homosexuality was *removed* from the DSM because it was never a disorder, whereas hysteria was *dissolved* because the underlying mechanism was misunderstood. If classification is merely about utility or consensus, we cannot say drapetomania was wrong, only that it is no longer useful. An adequate theory requires a truth-apt relationship between the category and the world that allows for moral and empirical correction. This handles the case of the same person collecting different labels across DSM editions; if the labels change without a change in the patient, the theory must explain which edition (if any) was correct.

  **2. Constructive Realism**
  Critics often dismiss diagnoses as "just social constructs," implying they are fake. An adequate theory must recognize that constructed kinds (like money or borders) can be ontologically real and causally powerful. PTSD, for instance, was built partly by advocacy and criteria, yet it captures a real pattern of suffering. The theory must distinguish between construction that illuminates a real pattern (PTSD) and construction that imposes an ideology (drapetomania). Collapsing this distinction renders the theory unable to defend legitimate diagnoses against charges of arbitrariness.

  **3. Reliability-Validity Independence**
  The DSM revolution prioritized inter-rater reliability, ensuring clinicians agree on the label. However, high reliability does not guarantee validity; one can consistently measure the wrong thing. A theory must decouple these metrics to account for findings where diagnostic criteria are clear but biomarkers are absent. If a theory conflates reliability with validity, it cannot explain why a perfectly reliable checklist might still fail to identify a natural kind or predict treatment response.

  **4. Interactive Kind Compatibility**
  Ian Hacking's looping effects describe how classified people learn about their classification and change their behavior accordingly, reshaping the kind itself. This is evident in the DID epidemic, which rose and fell with diagnostic fashion, and in autism identities that reshape the phenotype. A theory based on static natural kinds (like chemical elements) fails here because the target moves while being measured. The theory must define validity for kinds where the members' knowledge of the classification is part of the kind's causal structure.

  **5. Comorbidity and Cross-Cutting Accommodation**
  Empirically, comorbidity is the rule rather than the exception; patients rarely fit neatly into one box. Furthermore, SSRIs work across depression, anxiety, and OCD, suggesting shared underlying mechanisms that cut across current categories. A theory that insists on discrete, mutually exclusive categories cannot sit comfortably with these findings. It must explain overlap without abandoning differentiation, avoiding the collapse into a single "general psychopathology" factor while acknowledging shared etiology.

  **6. Threshold Pragmatism**
  Prevalence rates often shift mechanically when diagnostic thresholds are adjusted, indicating that boundaries are set for pragmatic reasons (e.g., resource allocation, insurance) rather than biological breakpoints. This is seen in the expansion of kids' bipolar diagnoses. An adequate theory must acknowledge that where the line is drawn is often a policy decision, not a discovery of nature. It must accommodate the reality that moving the threshold changes the population without necessarily changing the underlying pathology.

  **7. Cultural Portability**
  Some syndromes appear universal, while others are culture-bound. A theory must explain this variance without resorting to biological reductionism (which assumes universality) or radical relativism (which assumes local invention). It must account for how social ecology interacts with biology to produce syndromes that travel (e.g., depression) versus those that stay put (e.g., *koro*). This tests the theory's ability to handle the interaction between universal human capacities and specific cultural scripts.

  **8. Historical Contingency**
  Categories like hysteria vanish, while others like PTSD emerge. A theory must explain this turnover. If categories are natural kinds, they should be stable; if they are purely social, their stability is inexplicable. The theory must navigate between these poles to explain why some constructs survive scrutiny while others dissolve under historical pressure. It must handle the fact that professional fashion and advocacy drive classification changes without conceding that all changes are equally valid.

  ***

  ### Critical Analysis

  **The Fault Line: Normative Correctability vs. Interactive Kind Compatibility**
  The pair of requirements that cannot be easily jointly satisfied are **Normative Correctability** and **Interactive Kind Compatibility**. Your suspicion is correct: this is the primary fault line. To satisfy Normative Correctability (e.g., saying homosexuality was *wrong*), the theory requires a stable fact of the matter independent of the classification. To satisfy Interactive Kind Compatibility (e.g., explaining DID), the theory must admit that the classification helps constitute the fact of the matter, making truth dynamic. If the kind loops, the extension changes over time; if the extension changes, it becomes difficult to say the previous extension was "false" rather than just "different." Reconciling the need for static truth conditions (to condemn drapetomania) with dynamic ontology (to explain DID) is the hardest theoretical work required.

  **The Dealbreaker: Interactive Kind Compatibility**
  The single requirement that does the most to rule out the going candidates is **Interactive Kind Compatibility**. Most dominant research programmes (particularly Biological Realism/RDoC and standard DSM operationalism) assume that psychiatric categories are static natural kinds waiting to be discovered, analogous to medical lesions or chemical elements. They treat the patient as a passive object of measurement. Because human subjects read the manual, change their self-conception, and alter their behavior in response to diagnosis, any theory that assumes a static ontology fails to capture the causal mechanism of the disorder itself. This requirement rules out the majority of realist theories that dominate funding and research.

  **Evaluation of Going Candidates**
  *   **Symptom-Checklist (DSM-style):** Scores well on **Reliability** and **Threshold Pragmatism**, but fails **Interactive Kind Compatibility** (reifies categories) and **Normative Correctability** (defines truth as consensus, making it hard to say past editions were wrong).
  *   **Dimensional/Biological (RDoC):** Scores well on **Comorbidity** and **Biological Modesty**, but fails **Interactive Kind Compatibility** (assumes static neural circuits) and **Threshold Pragmatism** (lacks clinical utility/cutoffs for practice).
  *   **Pragmatist ("Whatever Helps"):** Scores well on **Threshold Pragmatism** and **Constructive Realism**, but fails **Normative Correctability** (if utility is the only metric, homosexuality was only "wrong" because it wasn't useful, not because it was false) and **Historical Contingency** (struggles to explain why some useful categories vanish).
