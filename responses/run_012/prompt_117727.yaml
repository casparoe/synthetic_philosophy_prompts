answer: |-
  (1) Exam Question

  **Question 4 (20 marks)**

  **Stem:**
  Consider two cases. **Case A:** An industrial toxin has contaminated a valley for two generations. Everyone born there has lung function at 60% of the species-typical level found elsewhere. Within the valley, this low function is statistically normal; no one is impaired relative to their neighbors. **Case B:** A rare structural variant exists in 1 in 1,000 people. It causes no symptoms, no loss of function, and no reduced lifespan. It is statistically abnormal but harmless.

  **Tasks:**
  (a) Explain why a definition of disease based solely on statistical abnormality fails to handle Case A and Case B correctly. (5 marks)
  (b) A naturalist (such as Boorse) argues we should replace statistics with "species-typical function." How does this handle Case B, and what new problem does it face in Case A? (5 marks)
  (c) To resolve Case A, the naturalist must specify the environment in which the species is supposed to function. Explain why selecting this "reference environment" might involve a normative choice rather than a purely biological fact. (5 marks)
  (d) Conclude: Does this environmental problem sink naturalism outright, or can a hybrid view (like Wakefield's) survive it? Justify your position. (5 marks)

  ***

  (2) Model Answer

  A purely statistical account of disease collapses when confronted with these two cases. In Case A, low lung function is statistically normal within the valley population. If disease requires statistical deviation, the valley residents are healthy, despite having significantly reduced capacity compared to the wider species. This suggests statistical abnormality is not necessary for disease. Conversely, Case B presents a trait that is statistically rare but causes no harm or loss of ability. If disease requires statistical deviation, this variant counts as a disease, which contradicts our intuition that disease involves something going wrong. Thus, statistical abnormality is not sufficient either. Statistics alone cannot distinguish between a harmless rarity and a pathological state.

  To rescue the objective status of disease, the naturalist shifts from statistics to function. On this view, disease is a failure of internal mechanisms to perform their species-typical functions. This handles Case B easily: the variant is not a disease because it involves no functional failure, regardless of its rarity. However, Case A poses a deeper challenge. Are the valley lungs dysfunctional? They fail to match the lung function of humans outside the valley. The naturalist must claim these lungs are failing to meet the design specifications of the human species. But this raises the question: design for what environment?

  This leads to the problem of the reference environment. To call the valley lungs dysfunctional, we must compare them to a standard of function established in a specific environment. If we say the relevant environment is "the one without industrial toxins," we are making a claim about which environment counts as the proper setting for human biology. Is the toxin-filled valley "unnatural"? Biologically, it is simply the environment those humans are in. To exclude it as a valid reference class requires a judgment that humans are *supposed* to live in toxin-free air. This selection is not derived purely from biological data; it relies on a normative assumption about what constitutes a natural or proper human life. We are smuggling values into the definition of function by deciding which environmental conditions count as the baseline for design.

  This threatens pure naturalism. If determining dysfunction requires a normative choice about the reference environment, then disease is not value-free. However, this does not necessarily sink the project entirely if one adopts a hybrid view. Wakefield's harmful dysfunction analysis separates the factual component (dysfunction) from the evaluative component (harm). A hybrid theorist could concede that identifying the reference class involves some normative input, while maintaining that the mechanical failure itself is a biological fact. Yet, if the dysfunction judgment itself depends on the normative environment selection, the "factual" half is contaminated. The strongest position is likely a modest naturalism: biological function provides the core structure, but we must acknowledge that delineating the conditions for that function involves value judgments about what environments humans ought to inhabit. Pure naturalism fails, but a hybrid that admits this normative leak remains viable.

  ***

  (3) Marking Scheme

  1.  **Statistics Insufficiency:** Candidate explains that Case A shows abnormality isn't necessary (valley is normal locally) and Case B shows it isn't sufficient (variant is rare but harmless).
      *   *Common Pitfall:* Treating Case A as healthy because it is statistically normal within the valley, missing the prompt's implication that it is a bad state.
  2.  **Function Shift:** Candidate explains that naturalism uses species-typical function to exclude Case B (no failure) but must explain why Case A counts as failure despite local normality.
      *   *Common Pitfall:* Defining function statistically (e.g., "what most people do") rather than as design/mechanism, failing to distinguish the naturalist move.
  3.  **Reference Environment:** Candidate identifies that judging Case A as dysfunctional requires comparing valley lungs to a standard set in a different (toxin-free) environment.
      *   *Common Pitfall:* Ignoring the environment entirely and arguing only about genetic design or internal mechanics without referencing external conditions.
  4.  **Normativity of Selection:** Candidate argues that choosing the toxin-free environment as the "proper" baseline is a value judgment, not a biological fact.
      *   *Common Pitfall:* Claiming the environment selection is purely biological because toxins are "unnatural" chemicals, missing the philosophical is/ought gap.
  5.  **Verdict on Naturalism/Hybrid:** Candidate offers a reasoned conclusion on whether naturalism survives (usually by conceding normativity) and how the hybrid view handles the contamination.
      *   *Common Pitfall:* Asserting Wakefield solves everything without addressing how the environment problem infects the "dysfunction" half of his hybrid.

  \answer{Identifying the selection of the reference environment as a normative act}
