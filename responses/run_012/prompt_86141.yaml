answer: |-
  Here are the desiderata for an adequate theory of famine causation, drafted to settle the argument before the first pint is poured.

  ### The Desiderata

  **1. The Empirical Test Cases**
  The theory must explain the mechanics and mortality of:
  *   **Bengal (1943):** Food availability was not significantly lower than previous years, yet millions died. (Tests: Market failure vs. state priority).
  *   **Ireland (1845–49):** A biological blight turned into a demographic catastrophe while food was exported. (Tests: Colonial governance vs. natural shock).
  *   **Soviet Union (1932–33):** Grain requisitioning in productive areas. (Tests: Intent vs. incompetence).
  *   **China (1959–61):** The Great Leap Forward. (Tests: Policy radicalism vs. reporting failures).
  *   **Maharashtra (1973):** Severe crop failure with negligible excess mortality. (Tests: The success case where the political response neutralised the natural trigger).

  **2. The Conceptual Distinctions**
  The theory must not collapse:
  *   **Famine vs. Chronic Undernourishment:** One is an acute spike in mortality; the other is a background condition of poverty.
  *   **Food Availability Decline (FAD) vs. Entitlement Failure:** The physical presence of food vs. the legal/economic means to acquire it.
  *   **Cause vs. Culpability:** A drought may be the *cause* of the shortage, but the state may be *culpable* for the deaths.
  *   **Intent vs. Indifference:** Genocidal starvation (commission) vs. negligent starvation (omission).
  *   **Market Failure vs. State Failure:** Whether the price mechanism broke or the safety net was withheld.

  **3. The Empirical Findings**
  The theory must sit consistently with:
  *   **The Paradox of Export:** Starvation often occurs in regions exporting food (landless labourers lack purchasing power, not food).
  *   **The Mortality Profile:** Deaths cluster among the very young and old (immune system failure), not necessarily among those with the lowest caloric intake initially.
  *   **The Weak Correlation:** The size of the food shortfall is a poor predictor of the death toll; the political response is a better predictor.

  **4. The Attribution Split (Requirement I)**
  The theory must quantify the interaction between the **Natural Trigger** (drought, blight, flood) and the **Political Amplifier** (policy, war, blockade). It cannot define one out of existence. It must offer a heuristic for weighing them: e.g., 'A 10% crop failure resulting in 1% mortality is a disaster; a 10% crop failure resulting in 10% mortality is a crime.'

  **5. The Falsification Condition (Requirement II)**
  To avoid being a tautology (i.e., 'if people starved, the politics must have been bad'), the theory must specify what would prove a famine is *not* a political crime.
  *   **Condition A:** A genuine, massive Food Availability Decline (e.g., >30% crop loss) resulting in *no* excess mortality due to effective state response (proves politics can solve nature).
  *   **Condition B:** A famine occurring in a consolidated liberal democracy with a free press and competitive elections. (Sen's claim: Famines do not happen here. If one does, the 'political accountability' theory is falsified).

  ***

  ### The Conflicts and The Killer

  **The Incompatible Pair**
  You cannot fully satisfy **Distinguishing Intent from Indifference** while maintaining a strict **Causal Claim**.
  Causality is mechanical (A led to B); 'Intent' is legalistic and psychological (A *wanted* B). A theory that focuses on the *crime* (moral/legal) inevitably obscures the *mechanism* (economic/biological). If you focus on the villain, you often miss the vector. You can have a causal theory of starvation that is morally neutral, or a moral theory of guilt that is causally vague. Doing both simultaneously invites conflating 'what happened' with 'who to blame'.

  **The Killer Requirement**
  **The Attribution Split (Requirement I)** knocks out the most candidates.
  Most theories are monists. The Malthusians say it's population vs. nature (100% natural). The Political Economists say it's capitalism/colonialism (100% political). Demanding a split weight forces the theorist to admit that nature sometimes pulls the trigger, even if politics loads the gun. Very few frameworks allow for a 40/60 or 70/30 split without collapsing into one camp.

  ***

  ### Theory Scorecard (Brief)

  **1. Food Availability Decline (FAD)**
  *   **Verdict:** Fails.
  *   **Why:** It cannot explain Bengal or Maharashtra. It collapses the distinction between food supply and food access. It treats famine as a natural disaster by definition, failing the Attribution Split by assigning 100% weight to nature.

  **2. The Entitlement Approach (Sen)**
  *   **Verdict:** Strongest on mechanics, weak on malice.
  *   **Why:** It perfectly explains why the landless starve while grain leaves (market/entitlement failure) and handles the Maharashtra success case. It passes the Democracy Falsification test (explaining why India stopped having famines post-Independence). However, it struggles to distinguish between *negligence* and *intent*. It explains the *failure* of the state, but not necessarily the *crime* of the state.

  **3. The 'Political Violence' Framing (e.g., Davis, Ó Gráda, Werth)**
  *   **Verdict:** Strong on culpability, risky on causality.
  *   **Why:** It correctly identifies the Soviet and Chinese cases as policy-driven catastrophes. However, it risks over-politicising natural shocks (like Ireland's blight) where the state's capacity to respond was genuinely limited by the technology of the age. It often fails the Falsification Condition by defining any famine in a non-democracy as a crime *a priori*, making it unfalsifiable.

  ### The Calibration

  To answer your core question: **'Famine as political crime' is primarily a moral claim masquerading as a causal one.**

  A causal claim explains *how* the bodies piled up (entitlement failure, disease, price spikes). A moral claim explains *who* is responsible for not stopping it. The Entitlement Approach gives you the causality; the Political Violence framing gives you the morality. If you want to win the argument, concede that the *cause* is often mixed (nature + economics), but insist that the *mortality* is almost always political. Nature creates the shortage; politics creates the corpse count.

  Now, buy the next round.
