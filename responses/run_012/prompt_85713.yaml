n though nothing inside it represents that reason. Finish with the one question I can put to them at the end that tells me whether they've got the inversion or just the slogan, and tell me what to leave out at this level and to say so out loud. Write it as continuous prose, no headings or bullets or bold, the way you'd write an email — I'm pasting it into a doc.
