answer: |-
  You are right to suspect that the Darwin half must do its work before the Turing half can land, and knowing why that order matters is the key to keeping the neuroscientist from checking out while the philosophers spin out. Darwin buys you the causal history that licenses the attribution of function without a functioner, which is the prerequisite for Turing to show you how that function can be mechanically realized without a understander. If you start with Turing, the neuroscientist will ask who wrote the code and the philosophers will ask where the meaning comes from, but if you start with Darwin, you establish that competence can accumulate through blind variation and selection, which means the system's "aboutness" is grounded in its history of survival rather than an internal ghost. This historical grounding is exactly what the Turing half needs, because without it, you are left with mere syntax manipulation, but with it, you can argue that the syntax tracks facts because it was selected for tracking those facts. You need the audience to accept that design can exist without a designer before you can convince them that content can exist without a comprehender, because the former breaks the intuition that cleverness requires a mind, while the latter breaks the intuition that meaning requires a meaner.

  Regarding your instinct to use the immune system, I would advise against using it as the single example for the whole session because while it is perfect for the Darwin half, it smuggles in biological teleology that ruins the Turing half. The immune system works beautifully to show competence without comprehension because antibodies bind to antigens without knowing what they are, but it fails to bridge to cognition because it lacks the syntactic combinatoriality required to challenge the intuition about representation. If you use the immune system, the neuroscientist will accept it as biology but deny it as cognition, and the philosophers will argue that binding is not representation, which leaves you stuck. Instead, you should use a simple evolved computational agent, such as a genetic algorithm optimizing a path through a maze, because this single example allows you to show the variation and selection process for the Darwin half and the executable code for the Turing half. This example has to have a clear fitness function so the selection pressure is visible, and it has to lack any internal model of the maze so the competence is clearly uncomprehending, which forces the audience to see that the system is tracking the fact of the exit without representing the reason for the turn.

  You should sequence the misconceptions as they naturally arise from this example, starting with the claim that evolution is just random, which will surface during the Darwin half when you describe the variation. You need to head this off immediately by emphasizing that while variation is random, selection is non-random, because if they think it is all noise they will not accept the accumulation of competence. The next misconception will be so it is just behaviorism, which will surface when you transition to the Turing half and describe the mechanical execution, and you must counter this by pointing out that the internal state of the agent is structured to correlate with the environment, which is more than input-output mapping. Then comes the claim that nothing is really about anything, which will arise when you assert that the code has content without comprehension, and here you must lean on the Darwinian history to show that the content is derived from the selection pressure that shaped it. The final misconception is so machines cannot really think after all, which is the inversion heard backwards, and this will surface at the very end when you generalize to cognition, requiring you to remind them that thinking is a form of competence that does not require a little man inside.

  The Chinese Room is not a distraction to be swatted but the real test of whether they have grasped the inversion, and it belongs at the end of the Turing half just before you generalize to cognition. If you introduce it too early, it becomes a metaphysical debate about consciousness, but if you introduce it after they have accepted the evolved agent, you can ask them whether the room is tracking the fact of the Chinese symbols even if the person inside does not understand them, which forces them to apply the competence without comprehension framework to semantics. You must keep the seam between the two inversions visible by explicitly marking the transition from history to mechanism, noting that Darwin explains why the system is there and Turing explains how the system works, because smoothing this over will make it look like you are claiming biology is just computation rather than showing how computation can inherit biological teleology. This distinction is crucial for your specific goal of showing something can track a fact and act for a reason without representing that reason, because the reason is located in the selection history while the tracking is located in the mechanical structure.

  Finish with the one question that tells you whether they have got the inversion or just the slogan, which is to ask them where the understanding lives if not in the system and not in the designer. If they say it is an illusion, they have missed the point, but if they say it is distributed across the history and the mechanism, they have grasped that competence without comprehension is not a deficit but a different ontology. You should leave out any discussion of consciousness or qualia at this level and say so out loud, because bringing in the hard problem will allow the neuroscientist to dismiss the whole session as philosophy and the philosophers to retreat into phenomenology, whereas sticking to competence and content keeps the focus on the functional architecture that supports the inversion. By excluding the subjective feel of understanding, you force them to confront the objective fact of tracking and acting, which is where the real work of naturalizing intentionality happens without getting bogged down in the mystery of experience.
