          *   *Holding:* Enforce the directive (Precommitment upheld).
          *   *Implication:* Individual autonomy allows binding one's future self, even if the future self wants to change course, provided the initial commitment was competent. *Correction:* Usually, advance directives are enforced when the person is *incompetent*. If he became *competent* and sought to revoke, enforcing the directive against a *competent* wish is a very strong form of precommitment (Ulysses contract). Let's assume the prompt implies the Ulysses contract logic holds: Past Competent Self binds Future Self.
