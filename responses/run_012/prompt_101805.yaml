      *   **Case 2 (Casino Self-Ban):**
          *   *Fact:* Person banned self from gambling. Later wanted to gamble.
          *   *Holding:* Enforce the ban.
          *   *Implication:* Individual can bind future self regarding voluntary activities/addictions.
          *   *Theme:* Individual Autonomy / Precommitment.

      *   **Case 3 (Constitutional Rights/Supermajority):**
          *   *Fact:* Constitution has Charter of Rights. Repeal requires supermajority. Simple majority tries to repeal.
          *   *Holding:* Enforce supermajority (Precommitment upheld).
          *   *Implication:* The People (via Constitution) can bind the Legislature. Rights are entrenched.
          *   *Theme:* Constitutional Entrenchment / Rights Protection.

      *   **Case 4 (Marriage Definition/Equal Standing):**
          *   *Fact:* Constitution defines marriage (1M+1W). Public opinion shifts. Simple majority legislature tries to repeal (presumably to allow same-sex marriage, or the court strikes down the provision itself). Wait, re-read: "Justice Mira voted to strike down the provision, explaining that it entrenched a denial of equal standing."
          *   *Holding:* Strike down the entrenchment (the constitutional provision itself).
