      *   Handle New Hume? Yes.
      *   Flag underdetermined questions? Yes.
      *   No bibliography? Yes.

      *Wait, one nuance on HS:* Would Hume surrender HS? HS is a modern reconstruction (Lewis). Hume has the "Separability Principle." If QM violates separability, Hume must adjust. But he would deny that this implies *necessary connection*. He would likely treat the wavefunction as a mathematical tool for predicting regularities, not a local quality. I need to be careful not to make him a scientific realist about the wavefunction if it contradicts his impression-based epistemology. He might treat it as a "relation of ideas" framework rather than a "matter of fact."

