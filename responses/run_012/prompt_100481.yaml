answer: |-
  Hume would endorse the anti-metaphysical spirit of modern Humeanism but reject its ontological commitments to systems and supervenience bases as substantive truths, insisting instead that lawhood is entirely a feature of human cognitive habit projected onto observed regularities.

  Regarding the Best-System Account, Hume would resist the claim that systematisation confers lawhood. For Hume, the "laws" are nothing over and above the constant conjunctions themselves, elevated to status only by the feeling of determination arises in the mind after repeated observation. The criteria of simplicity and strength are not features of the world waiting to be discovered, but principles of the imagination that facilitate the ease of transition between ideas. He would argue that the Lewisian balance is a pragmatic rule for human cognition, not a metaphysical fact about nature; to say the system *makes* the law is to reify a methodological convenience into an ontological ground, repeating the very error of projecting internal determination onto external objects. He would accept the reduction of laws to regularities but deny that the *deductive structure* adds anything real to the loose succession of events.

  On Humean Supervenience, Hume would face a tension between his separability principle and contemporary physics. His commitment is to the empiricist maxim that whatever is distinct is separable, which supports the idea of local qualities. However, Hume is ultimately guided by experience, not apriori metaphysics. If quantum entanglement demonstrates that the world does not decompose into local matters of fact, Hume would surrender the specific formulation of the supervenience base rather than posit necessary connections to hold it together. He would not relocate laws into the base, for laws are not entities that can reside anywhere; they are descriptions. He would dig in on the denial of necessary connexion, arguing that even if the base is non-local or holistic, the *relation* between states remains contingent to our perception. The failure of locality does not prove necessity; it merely proves our previous catalogue of local qualities was incomplete. He would treat the wavefunction not as a real physical object necessitating outcomes, but as a mathematical instrument for calculating probabilities of observed regularities.

  Concerning necessitarian and dispositional programmes, Hume would regard these as precisely the projection of felt compulsion onto nature that he spent his career dissolving. The claim that he lacked the conceptual resources to see necessity would be dismissed as a category error. For Hume, the *idea* of necessity is derived from an internal impression of custom; to claim there is necessity "out there" independent of this impression is to use a word without an idea. He would argue that Armstrong's necessitation relation or dispositional essences are occult qualities disguised as explanations. Even if these programmes claim to explain *why* regularities hold, Hume would retort that we never perceive the "why," only the "that." To posit a real relation of necessitation is to indulge in the same theological or scholastic speculation he sought to purge from philosophy, mistaking the strength of our expectation for a bond in the objects.

  On the distinction between governing and describing, Hume would place himself firmly on the side of description and deny that the distinction marks anything real in nature. The idea of governance implies a prescriptive power, as if nature obeys a rule rather than merely conforming to it. For Hume, nature does not "obey"; it simply is. The feeling that laws govern is a remnant of the anthropomorphic tendency to imagine nature as a agent subject to decree. He would argue that the distinction is purely psychological: we feel compelled to expect the future to resemble the past, and we mistake this internal compulsion for an external command. There is no fact of the matter about whether a regularity is a "governing law" or an "accidental generalization" beyond the degree of entrenchment the regularity has achieved in our web of belief.

  The "New Hume" complication posits that Hume was a sceptical realist who believed in real causal powers but denied we could know them. If this reading is correct, Hume's response to necessitarians would soften from denial to agnosticism: he would concede that there *might* be real necessary connections in the "secret nature" of objects, but maintain that we can never form a coherent idea of them or claim knowledge of them. This would change the verdict on whether he views necessitarian programmes as *false* versus *unknowable*. However, the evidence for the New Hume reading relies heavily on interpreting his sceptical cautions as ontological concessions, whereas his explicit definitions of cause in the *Enquiry* and *Treatise* define cause strictly in terms of regularity and inference. The textual weight favors the projectivist reading: Hume's goal was to show that the *idea* of necessity has no empirical content, rendering claims about real necessity meaningless rather than merely unknown. Therefore, the evidence should not move the verdict significantly; even if real powers exist, they play no role in our concept of law, and thus laws remain descriptive summaries of phenomena.

  Three questions remain underdetermined by Hume's texts. First, it is unclear whether his separability principle is a claim about metaphysical possibility or merely about conceptual conceivability; settling this requires explicit clarification on whether inconceivability entails impossibility in his system. Second, Hume occasionally references the "secret powers" of bodies, but it is underdetermined whether these are real causal mechanisms or merely unknown regularities; a private correspondence or deleted manuscript passage distinguishing ontological secrecy from epistemic limitation would settle this. Third, the status of the mind itself is ambiguous: if the mind is merely a bundle of perceptions, it is unclear where the "custom" that generates necessity resides; evidence regarding whether Hume accepted a substantive self at any stage would clarify whether lawhood is grounded in a stable cognitive architecture or a fleeting series of impressions.
