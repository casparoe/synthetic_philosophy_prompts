answer: |-
  The conceptual issue that arises here, and which serves best to distinguish the integrity objection from the act/omission distinction or the doctrine of double effect, concerns the **transparency of the agent's motives**.

  Specifically, the issue is the distinction between **first-order motives** (e.g., love for one's spouse) and **second-order regulatory policies** (e.g., a resolution to act only from love). The integrity objection highlights a phenomenological cost to the agent—a sense of alienation—that persists even when the external act is identical.

  If you were to conflate the integrity objection with the act/omission distinction, you would be asking merely whether the agent *did* something or *allowed* something to happen. In your case, the husband saves his wife in both scenarios; the act/omission distinction yields no purchase here, as the physical action is constant. Similarly, the doctrine of double effect concerns whether a harmful consequence is intended or merely foreseen. In this rescue scenario, there is no harmful side-effect under consideration; the outcome is wholly positive. Thus, neither of these frameworks can capture the critic's worry.

  The critic's observation exposes a problem of **reflective opacity**. In the first instance, the husband's motive is mediated by a moral theory ('partiality is permitted'). In the second, he attempts to bypass this by resolving not to think the thought. However, this resolution is itself a second-order thought ('I ought not to think about permission'). Consequently, his motive is no longer transparently 'love'; it is 'love, governed by a policy against moral calculation'.

  **How this helps students:**

  This example forces students to see that the integrity objection is not merely a constraint on *which actions are permissible* (as with act/omission or double effect), but a critique of the *structure of practical reasoning* required by impartialist theories.

  1.  **Content vs. Structure:** Students often mistake the integrity objection for a claim about the *content* of reasons (i.e., that personal reasons should outweigh impartial ones). This example shows the problem persists even if the agent acts on the personal reason. The issue is not *what* reason wins, but *how* it wins.
  2.  **Alienation vs. Wrongdoing:** The act/omission distinction and double effect are tools for determining moral rightness or wrongness. The integrity objection, by contrast, identifies a cost to the agent's identity even when the action is morally correct. By focusing on the transparency of motives, students can see that one can do the 'right' thing (save the spouse) yet still suffer a loss of integrity if the psychological route to that action involves a alienating self-regulation.
  3.  **The Regress Problem:** The example illustrates that one cannot simply 'obey' the integrity objection as a rule. If the husband treats 'do not have mediating thoughts' as a moral rule, he is back to having a mediating thought. This helps students understand Williams' deeper point: integrity is not a duty to be fulfilled, but a condition of agency that is threatened by the very demand to justify one's ground projects impartially.

  By isolating the **transparency of motives**, you prevent students from dismissing the integrity objection as a confused version of consequentialist calculation (double effect) or a simple preference for action over inaction. It clarifies that the objection targets the *distance* impartialist theories insert between the agent and their actions, a distance that remains even when the agent tries to bridge it via a resolution.
