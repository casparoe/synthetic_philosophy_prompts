      *Wait, one more check:* The prompt asks for *an example of a conceptual issue*. I need to name it clearly. "The problem of reflective endorsement" or "The paradox of spontaneous virtue". Let's go with **the opacity of reflective endorsement**. Or simpler: **The distinction between first-order and second-order motives.**
      Actually, looking at the prompt's specific list ("content... causal history... transparency"), I should select one of those to be precise. **Transparency of motives** is the best fit.

      *Why obscured by Act/Omission or DDE?* Because those frameworks treat the agent as a vessel for moral rules. They ask "Is the act right?" Integrity asks "Is the agent whole?" If students think integrity is just "don't think about duty" (a rule), they miss that *following that rule* is also thinking about duty.

      *Plan:*
      1. Identify the issue: Transparency of motives (specifically, the distinction between first-order impulses and second-order regulatory policies).
      2. Explain the distinction from Act/Omission and DDE.
