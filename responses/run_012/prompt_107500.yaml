prompt: |-
  So I chair the clinical ethics committee at a hospital network in a country with a large immigrant workforce, and I have to circulate a written opinion before next Thursday's vote. Here's the mess.

  We're adopting a protocol for a scarce therapy — limited slots, way more demand than supply, so the protocol has to rank patients. The draft in front of us, written by our allocation office, gives a modest preference (they insist it's only a tiebreaker, not a veto) to citizens and permanent residents over non-citizens. Their reasoning: members of a political community owe each other something they don't owe outsiders, and people who've been paying in should get something back when it's their turn to need care. Clinical need still dominates; the preference only decides cases that are otherwise dead even. Their own numbers say it would flip maybe one decision in forty a year, which is either a reason it's harmless or a reason we shouldn't bother, depending who you ask.

  Two things make it hard. First, the case that will actually get decided by this tiebreaker in the next month is a guy — call him Mr. A — eleven years here, undocumented, worked as a care assistant through the worst of the pandemic, payroll taxes the whole time through a borrowed number (which is its own problem), and right now he's dead-even with a citizen patient on every clinical criterion. Second, our network adopted a statement a few years back saying we don't let immigration status affect clinical decisions, and the allocation office says the new protocol doesn't contradict it because "tiebreakers aren't clinical." I don't buy that and I definately don't think the board will either. Three of my members hold the citizen-preference sincerely, and one wants us to declare the whole thing outside our competence and punt it to the ministry.

  There's also a consultant who keeps pushing a framing I can't tell is brilliant or sophistry. She says special obligations to compatriots only earn their keep if membership is voluntary in a real sense — if people can actually leave. So the right question isn't "who's a member" but "who could exit." She wants us to replace the citizen/resident line with an exitability line: the preference goes to whoever is stuck. That flips the protocol here, since Mr. A can't safely go back and the citizen patient obviously can go anywhere. She calls it the two-door view — doors in and doors out — and says a community that won't let you out has no standing to claim you owe it anything extra.

  What I need from you is the opinion I'll circulate. It should (a) actually recommend something the committee can vote on — adopt as drafted, adopt with a specific amendment, or reject — and state the amendment in operative language we could paste straight into the protocol; (b) give the reasoning, including the best version of the citizen-preference case rather than a strawman, since three members hold it in good faith; (c) take a position on the two-door thing on the merits, because if it's right the protocol is backwards and if it's wrong I need to be able to say why in front of the people who'll ask; and (d) say what we tell Mr. A's team and the citizen patient's team in the meantime, because both cases are live now and we can't wait for the perfect policy.

  Don't hand me a reading list or citations — I'm not chasing down papers before Thursday. Just the argument, in a form I can read out loud without embarrassment.
reasoning: |-
  Here's a thinking process that leads to the suggested clinical ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a Clinical Ethics Committee (CEC) at a hospital network.
      *   **Context:** Country with a large immigrant workforce. Scarce therapy protocol needed.
      *   **The Issue:** Draft protocol gives modest preference (tiebreaker only) to citizens/permanent residents over non-citizens.
      *   **The Specific Case:** Mr. A (undocumented, 11 years, care assistant, paid taxes, dead-even clinically with a citizen patient).
      *   **Constraints/Conflicts:**
          *   Network policy says immigration status shouldn't affect clinical decisions (Allocation Office argues tiebreakers aren't clinical).
          *   Three members support citizen-preference (good faith).
          *   One member wants to punt to the Ministry.
          *   Consultant proposes "Two-Door View" (preference based on "exitability"/ability to leave, not citizenship).
      *   **Deliverable:** A written opinion to circulate before Thursday's vote.
      *   **Requirements:**
          *   (a) Specific recommendation (Adopt, Amend, Reject) with operative language for the protocol.
          *   (b) Reasoning that steelmans the citizen-preference argument (don't strawman it).
          *   (c) Take a position on the "Two-Door View" (exitability).
          *   (d) Guidance on the immediate live cases (Mr. A vs. Citizen Patient).
          *   **Tone:** Professional, readable aloud, authoritative but consensus-seeking, no academic citations/reading lists.

  2.  **Determine the Ethical Stance:**
      *   *Citizen Preference:* While there's a philosophical argument for reciprocity (social contract), in a clinical setting, tying care to legal status undermines the therapeutic alliance and violates the network's existing policy spirit. The "tiebreaker" distinction is semantic; a tiebreaker *is* a decision criterion.
      *   *Two-Door View:* This is intriguing but problematic. Basing medical priority on "ability to leave" creates a perverse incentive (punishing those with options) and is administratively nightmarish (how do you assess "safety" of return?). It also risks privileging the desperate in a way that exploits their vulnerability rather than protecting it. However, it highlights the flaw in the citizenship model: Mr. A *is* effectively a member of the community despite status.
      *   *Best Path:* Reject the citizenship tiebreaker. It violates the network's non-discrimination policy and introduces non-clinical bias into life-or-death decisions. The "reciprocity" argument is better handled through social policy, not bedside rationing.
      *   *Immediate Case:* Mr. A and the Citizen Patient are clinically identical. The current draft says Citizen wins. The Ethics Committee should recommend *not* applying the citizenship tiebreaker for this specific case, effectively calling for a random lottery or continued clinical reassessment, adhering to the existing network policy on non-discrimination.
      *   *Protocol Amendment:* Remove citizenship/residency status as a criterion. Replace with a neutral tiebreaker (e.g., lottery, or first-come-first-served within the clinical window, or prognosis nuance).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose clearly. Acknowledge the difficulty.
      *   **Recommendation (Req a):** Be decisive. Recommend *rejecting* the citizenship clause and adopting a neutral tiebreaker. Provide the specific text.
      *   **Reasoning - The Citizen Preference (Req b):** Acknowledge the validity of the "social contract" argument. It's not hate; it's about reciprocity. *However*, explain why it fails *here*. Clinical ethics $\neq$ political philosophy. The hospital's mission is care, not border control. The "tiebreaker isn't clinical" argument is weak; allocation *is* clinical governance.
      *   **Reasoning - The Two-Door View (Req c):** Address the consultant's idea. It's insightful but impractical and ethically risky. It makes vulnerability a ticket to care, which is paternalistic. Also, assessing "exitability" is beyond clinical competence.
      *   **Immediate Action (Req d):** What to tell the teams? Do not apply the citizenship preference. Use a lottery. This honors the "dead-even" status without violating the network's non-discrimination policy.
      *   **Closing:** Call to vote.

  4.  **Refining the Tone:**
      *   Needs to sound like a Chair speaking to colleagues. Respectful but firm.
      *   Avoid academic jargon ("deontological," "utilitarian"). Use plain English ("moral obligation," "practical outcome").
      *   Ensure the "operative language" is copy-paste ready.
      *   Make sure the "Two-Door" analysis is nuanced. It's not just "no," it's "no, and here's why it doesn't solve the problem."

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is rejecting the protocol too radical?
      *   *Fix:* Frame it as "Amend to Align with Existing Network Policy." This makes it about consistency, not just ideology.
      *   *Critique:* The "Two-Door" argument is philosophically strong for Mr. A. Should I adopt it?
      *   *Fix:* No. It's too subjective. Who decides if someone can "safely" leave? It invites bias. Stick to removing status entirely.
      *   *Critique:* What about the member who wants to punt to the Ministry?
      *   *Fix:* Acknowledge that macro-allocation is a government job, but *micro-allocation* (who gets the bed *now*) is the hospital's responsibility. We can't wait.
      *   *Critique:* Make sure I don't ignore the 3 members who support citizenship preference.
      *   *Fix:* Explicitly validate their intuition (reciprocity is real) but contain it to the political sphere, not the clinical sphere.

  6.  **Final Polish:** Check against the four requirements (a, b, c, d). Ensure the operative language is clear. Ensure the advice on Mr. A is actionable. (The resulting draft looks solid).

  7.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** Chair, Clinical Ethics Committee
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Scarce Therapy Allocation Protocol (Voting Draft)

  **1. Purpose and Recommendation**

  We are convened to finalize a protocol for allocating scarce therapy slots where clinical need is equal. The current draft proposes a tiebreaker preference for citizens and permanent residents.

  After reviewing the ethical implications, the network's existing policy commitments, and the immediate cases before us, I recommend we **reject the citizenship/residency tiebreaker** and **adopt a neutral tiebreaker.**

  We cannot approve a protocol that conditions life-saving access on legal status, even as a "tiebreaker." To do so violates our network's standing policy on non-discrimination and conflates political membership with clinical entitlement.

  **Operative Language for Amendment:**
  *Delete Section 4.2 (Citizenship and Residency Status) entirely. Replace with the following:*

  > **4.2 Neutral Tiebreaker:** In cases where patients are indistinguishable regarding clinical prognosis, urgency, and likelihood of benefit, priority shall be assigned by random lottery (weighted balloting) among the tied candidates. No preference shall be given based on citizenship, immigration status, insurance type, or social role.

  **2. Reasoning: The Case for Reciprocity**

  I want to address the argument for the original draft directly, because three of our colleagues hold this view in good faith, and it deserves a fair hearing.

  The argument is based on reciprocity and the social contract. It suggests that a political community is not just a random collection of people, but a cooperative scheme. Citizens and residents pay taxes, vote, serve on juries, and accept obligations that outsiders do not. When resources are too scarce to save everyone, it is reasonable to prioritize those who have contributed to the system that built the resource and who will remain to contribute to its replenishment. This is not necessarily about xenophobia; it is about the moral weight of membership. If we owe something to our neighbors that we do not owe to strangers, this protocol simply reflects that boundary.

  Furthermore, the Allocation Office argues this is a "tiebreaker," not a veto. Clinical need still rules. This preference only applies when medicine runs out of reasons to choose. In that narrow gap, they argue, society is permitted to favor its own members.

  **Why this fails in a clinical setting:**
  While this logic may hold for voting rights or welfare benefits, it breaks down at the bedside.
  1.  **The Mission:** Our network's mission is care, not border enforcement. Once a patient is under our care, the therapeutic relationship supersedes the political relationship. Introducing legal status into the calculation damages trust between clinicians and the communities we serve.
  2.  **The "Tiebreaker" Distinction:** A tiebreaker *is* a decision criterion. If it decides who lives and who dies, it is ethically weighty. Calling it "non-clinical" is semantic. It is an allocation decision, and allocation is a core function of clinical ethics.
  3.  **Existing Policy:** Our network already adopted a statement that immigration status does not affect clinical decisions. Approving this protocol creates a direct contradiction. We cannot tell our staff one thing in policy and another in protocol.

  **3. Reasoning: The "Two-Door" View (Exitability)**

  A consultant has proposed an alternative: rather than citizenship, priority should go to those who cannot "exit" the community (i.e., cannot safely return to a home country). This is the "Two-Door View." The argument is that special obligations to compatriots only hold if membership is voluntary. If you cannot leave, you cannot be penalized for not being a "member."

  This view correctly identifies the injustice facing patients like Mr. A. However, I recommend we **reject this framing as well**, for three reasons:

  1.  **Assessment Burden:** It requires clinicians or allocators to judge the safety of a patient's return to another country. We are not equipped to assess geopolitical risk or asylum viability. This invites error and liability.
  2.  **Perverse Incentives:** It effectively penalizes patients who have options. It suggests that having the freedom to move elsewhere makes you *less* worthy of care here. This turns privilege into a liability.
  3.  **Vulnerability as a Ticket:** It bases entitlement on desperation. While we must protect the vulnerable, making vulnerability the *criterion* for care risks exploiting that vulnerability rather than alleviating it.

  The solution is not to swap one status test (citizenship) for another (exitability). The solution is to remove status entirely from the clinical equation.

  **4. Immediate Guidance on Live Cases**

  We have two patients currently in a dead-even tie: Mr. A (undocumented, long-term resident, essential worker) and a Citizen Patient. The vote on the new protocol will not be finalized before a decision is needed for these two.

  **Instruction to Clinical Teams:**
  Do not apply the draft citizenship preference. To do so would violate our current standing network policy on non-discrimination, which remains in effect until formally amended by a valid vote.

  Since the patients are clinically identical:
  1.  Acknowledge both patients have equal claim to the therapy.
  2.  Resolve the tie via **random lottery** immediately.
  3.  Document that the Ethics Committee has advised that legal status is not a permissible differentiator under current network policy.

  This approach protects the hospital from liability regarding our non-discrimination policy and treats both patients with equal moral respect.

  **5. Conclusion**

  One member suggested punting this to the Ministry. While macro-allocation (how many slots a country buys) is indeed a government responsibility, micro-allocation (who gets the slot today) is ours. We cannot wait for the Ministry to resolve a moral problem we face this week.

  We are not deciding who belongs in the country. We are deciding who receives medicine. On that question, the only relevant membership is membership in the human community of patients.

  I ask that we vote to adopt the amendment provided in Section 1.

  Thank you.
