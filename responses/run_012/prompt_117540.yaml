prompt: |-
  I'm TAing for a second-semester causal inference course and the instructor reuses the same three Simpson's-paradox examples every year — kidney stones, Berkeley admissions, and the low-birth-weight one — and by week six the students have definately absorbed the moral that you trust the stratified estimate whenever it disagrees with the crude one, and they apply it like a reflex. I want to break that reflex, so I'd like you to build me a case from scratch, to spec. The spec: one treatment T, one binary outcome Y, and one binary third variable Z that gets measured after T. T should be assigned by something effectively random — a lottery, a rule nobody can game — so that there's no confounding anywhere and the crude comparison really is the one I want. And yet: crude has to show T helping, while the comparison within each of the two levels of Z has to show T hurting. A full flip, in both strata — not a case where one stratum reverses and the other just gets more extreme. Please invent your own variables rather than reaching for kidney stones or admissions or birth weight, since those are exactly what I'm trying to get the students off of, and spell the causal story out properly; no hand-waving about an unmeasured confounder, and no just stipulating the numbers.

  So: give me a concrete, real-ish story plus a 2x2x2 table of counts that actually adds up, and then compute the crude risk in each arm and the stratum-specific risks out to a few decimals, so I can check the flip on a calculator. Then do the diagnosis — write the DAG out in words, say which path conditioning on Z opens or blocks, say exactly what quantity the stratum-specific contrast is estimating and why that quantity isn't the one I need for a decision about rolling T out to everyone, and name the single feature of the case that's doing the work (if I removed it, would the flip vanish?). Then two extras. (a) Tell me what happens if I rewire Z so it's a pre-treatment common cause of T and Y instead: does the usual moral come back, which estimate is right then, and — the question I actually care about — could the very same table of counts be consistent with both graphs? If it could, say so plainly, because that's the point I'm trying to land. (b) Play the other side: a colleague who adjusts for every variable he measured says his stratified analysis is obviously the more careful one. What's his strongest move against my example, and what's my reply? I care about the total effect of T on Y, so if you build the case around a different estimand it won't do what I need.
