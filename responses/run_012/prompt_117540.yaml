answer: |-
  Here is a complete case study designed to break the "always adjust" reflex. It uses a mediation structure where the treatment works *through* the covariate, making adjustment destructive.

  ### The Case: The "CardioGuard" Trial

  **The Setup**
  You are analyzing a randomized controlled trial (RCT) for a new drug, **CardioGuard** ($T$), compared to a placebo ($T=0$).
  *   **Treatment ($T$):** 1 = CardioGuard, 0 = Placebo. Assignment was via secure lottery (perfect randomization).
  *   **Outcome ($Y$):** 1 = Survived 1 Year, 0 = Died.
  *   **Covariate ($Z$):** 1 = Hospitalized for Arrhythmia during the year, 0 = Not Hospitalized.
  *   **Timing:** $Z$ is measured *after* treatment assignment and initiation.

  **The Causal Story**
  1.  **Randomization:** Baseline health risks are balanced between arms. There is no confounding of $T \to Y$.
  2.  **Mechanism 1 (Prevention):** CardioGuard is highly effective at preventing arrhythmias. Patients on the drug are much less likely to be hospitalized ($T \to Z$ is strong and negative).
  3.  **Mechanism 2 (Risk):** Hospitalization for arrhythmia is dangerous due to procedural risks and hospital-acquired infections. Being hospitalized drastically reduces survival chances ($Z \to Y$ is strong and negative).
  4.  **Mechanism 3 (Toxicity):** CardioGuard has a direct toxic side-effect on liver function that slightly increases mortality risk, *independent* of whether the patient is hospitalized ($T \to Y$ direct is negative).

  **The Paradox**
  The drug saves lives overall because preventing hospitalization (Mechanism 1 + 2) outweighs the liver toxicity (Mechanism 3). However, if you compare patients *within* hospitalization status, you only see the liver toxicity, because you have blocked the pathway where the drug actually helps.

  ---

  ### The Data (2x2x2 Table)

  Total $N = 1,000$ (500 per arm).

  | Treatment ($T$) | Hosp ($Z$) | Survived ($Y=1$) | Died ($Y=0$) | Total ($T, Z$) | Risk ($Y=1$) |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **0 (Placebo)** | 1 (Yes) | 80 | 320 | 400 | **0.20** |
  | | 0 (No) | 90 | 10 | 100 | **0.90** |
  | | **Total** | **170** | **330** | **500** | **0.34** |
  | **1 (CardioGuard)**| 1 (Yes) | 10 | 90 | 100 | **0.10** |
  | | 0 (No) | 320 | 80 | 400 | **0.80** |
  | | **Total** | **330** | **170** | **500** | **0.66** |

  **Verification of the Flip**

  1.  **Crude Comparison (Total Effect):**
      *   Risk($T=1$) = $330/500 = \mathbf{0.66}$
      *   Risk($T=0$) = $170/500 = \mathbf{0.34}$
      *   **Difference:** $+0.32$. **Conclusion: Treatment Helps.**

  2.  **Stratum $Z=1$ (Hospitalized):**
      *   Risk($T=1$) = $10/100 = \mathbf{0.10}$
      *   Risk($T=0$) = $80/400 = \mathbf{0.20}$
      *   **Difference:** $-0.10$. **Conclusion: Treatment Hurts.**

  3.  **Stratum $Z=0$ (Not Hospitalized):**
      *   Risk($T=1$) = $320/400 = \mathbf{0.80}$
      *   Risk($T=0$) = $90/100 = \mathbf{0.90}$
      *   **Difference:** $-0.10$. **Conclusion: Treatment Hurts.**

  ---

  ### The Diagnosis

  **1. The DAG**
  $$T \rightarrow Z \rightarrow Y$$
  $$T \rightarrow Y$$
  *(There are no backdoor paths because $T$ is randomized.)*

  **2. Path Analysis**
  *   **Crude Estimate:** Captures the sum of the direct path ($T \to Y$, toxic) and the indirect path ($T \to Z \to Y$, protective). Since the indirect path is stronger, the sum is positive.
  *   **Stratified Estimate:** Conditioning on $Z$ **blocks** the indirect path ($T \to Z \to Y$). It isolates only the direct path ($T \to Y$). Since the direct path is toxic, the estimate becomes negative in both strata.

  **3. The Estimand**
  *   The **Crude** contrast estimates the **Average Total Effect (ATE)**. This is the policy-relevant quantity: "If we roll this drug out to the population, what happens to survival?"
  *   The **Stratified** contrast estimates the **Controlled Direct Effect (CDE)**. This answers: "If we gave the drug but *forced* hospitalization status to be fixed (either everyone hospitalized or no one), what would happen?" This is not the decision we need to make. We cannot force hospitalization status externally; it is a consequence of the treatment.

  **4. The Key Feature**
  The feature driving the flip is that **$Z$ is a Mediator**, not a confounder. Specifically, $T$ has a strong causal effect on $Z$ (imbalance in $Z$ is *caused* by $T$), and $Z$ has a strong effect on $Y$. If you removed the arrow $T \to Z$ (making $Z$ independent of treatment), the distribution of $Z$ would be equal across arms, the weights would balance, and the flip would vanish.

  ---

  ### Extra (a): Rewiring the Graph

  **Question:** What if $Z$ were a pre-treatment common cause of $T$ and $Y$ (a confounder)? Does the moral return? Can the same table work?

  **Answer:**
  1.  **Does the moral return?** **Yes.** If $Z$ is a pre-treatment confounder ($Z \to T$ and $Z \to Y$), the randomization assumption is false (or failed). In this scenario, the Crude estimate is biased by confounding, and the Stratified (standardized) estimate is the unbiased estimator of the ATE. The "trust the stratified estimate" reflex would be correct here.
  2.  **Which estimate is right then?** The **Stratified** estimate (Risk Difference = -0.10) would be the truth. The drug would actually be harmful, and the crude benefit was an illusion caused by the drug group having fewer high-risk patients ($Z=1$) at baseline.
  3.  **Can the same table be consistent with both graphs?** **Yes, absolutely.** This is the critical lesson. A table of counts contains no timestamps and no arrows.
      *   The imbalance $P(Z=1|T=0)=0.8$ vs $P(Z=1|T=1)=0.2$ is consistent with $Z$ being a confounder (selection bias put sick people in control).
      *   It is *also* consistent with $Z$ being a mediator (treatment prevented sickness).
      *   **The Point:** You cannot determine the correct estimate from the numbers alone. You need the **causal model** (timing and mechanism) to decide whether to adjust. The data is identical; the truth flips based on the DAG.

  ### Extra (b): The Colleague's Objection

  **Colleague:** "Your stratified analysis is obviously the more careful one. Even in RCTs, we adjust for covariates to reduce variance and account for any chance imbalance. Ignoring $Z$ when it's so strongly predictive of $Y$ is negligent."

  **Strongest Move:** The colleague is conflating **precision** with **bias**, and **pre-treatment** covariates with **post-treatment** mediators. They are arguing from the standard practice of ANCOVA (adjusting for baseline characteristics), which *does* improve precision without introducing bias.

  **Your Reply:**
  "Adjusting for *baseline* covariates is indeed careful. But $Z$ is not baseline; it is a **mediator** caused by the treatment.
  1.  **Bias vs. Precision:** Adjustment here doesn't just change the standard error; it changes the **estimand**. By stratifying on $Z$, you are no longer estimating the Total Effect of the drug. You are estimating the Direct Effect *excluding* the drug's primary mechanism of action (preventing hospitalization).
  2.  **The Policy Question:** If we approve this drug, we get the Total Effect (0.32 benefit). If we approve it based on your stratified analysis (-0.10 harm), we reject a life-saving treatment because you statistically 'held constant' the very benefit it provides.
  3.  **The Test:** Check the balance. In a true RCT with pre-treatment covariates, $P(Z|T=1) \approx P(Z|T=0)$. Here, $Z$ is massively imbalanced (80% vs 20%). That imbalance is *evidence* that $Z$ is post-treatment. Adjusting for it removes the treatment's signal."
