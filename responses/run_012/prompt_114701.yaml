answer: |-
  You have put your finger on the central, agonizing secret of type design. It is the reason why a font made of perfectly drawn letters can still be a terrible font, and why a font made of weird, idiosyncratic letters can feel inevitable.

  There is no single English word that perfectly captures this, though type designers dance around it with terms like **"color," "texture,"** or **"logic."** In semiotics (the study of signs), Ferdinand de Saussure called it **"Value" (*Valeur*)**.

  But since you asked for the *shape* of the thing rather than just the label, let's map its geometry.

  ### The Shape of the Thing

  This phenomenon is **Reciprocal Definition within a Closed System.**

  It is not a property of the letter; it is a property of the *relationship* between the letters. Here are the contours:

  **1. It is Bidirectional (The Feedback Loop)**
  You noted that the 'g' decides something about the 'a'. Crucially, the 'a' is also deciding something about the 'g'. When you draw the 'a', you establish a set of rules: stroke weight, contrast axis, x-height proportion, curvature tension. When you draw the 'g', you are not just adding a new shape; you are testing the rules established by the 'a'.
  If the 'g' violates the rules too much, the 'a' looks like a mistake (because the system now implies the 'a' was the outlier). If the 'g' follows the rules too slavishly, the font looks robotic. The "rightness" you feel is the point of **equilibrium** where the tension between the two shapes resolves into a single, coherent logic.

  **2. It is Relative, Not Absolute**
  There is no "correct" 'a'. There is only an 'a' that is correct *relative to the 'g'*.
  This is why your neutral, generic 'a' feels like "nobody's 'a'." It has **Signification** (it signifies the sound /æ/) but it has no **Value** (it has no specific place in a specific system). A generic 'a' is a variable waiting for an equation. Your custom 'a' is a number that only makes sense when added to specific other numbers.

  **3. It Requires a Boundary**
  You asked if a single letter has this. **No.** A single letter in a vacuum has style, but it does not have *systemic value*.
  You also asked if a font that sets only one word has it. **Yes.** The boundary of the system is not "the whole alphabet"; the boundary is "the set of glyphs that must coexist." If you design a logotype for the word "FOG," the 'F' defines the 'O', which defines the 'G'. If you add an 'a' later, you reopen the negotiation. The system is closed only when you stop drawing.

  ### Is it Holism?

  You asked if this is the same animal as holism. **No. It is the engine that drives holism.**

  *   **Holism** is the observation that "the whole is greater than the sum of the parts." It is a static description of the result.
  *   **Reciprocal Definition** is the *mechanism* by which that happens. It explains *how* the whole exerts force back onto the parts.

  In holism, the focus is on the emergent property (the forest). In your phenomenon, the focus is on the **mutual constraint** (the way the trees force each other to grow in specific shapes to fit the canopy). It is dialectical: Thesis ('a') + Antithesis ('g') = Synthesis (The Font), which then retroactively redefines the Thesis.

  ### The Edges: Where does it stop?

  **1. The Minimum Viable System**
  You need at least **two** elements to generate this effect. One element is a statement; two elements is a relationship. As soon as you have two, you have a system, and therefore you have the potential for systemic dissonance.

  **2. The Limit of Similarity**
  You mentioned that copying an 'a' into another font makes it a "foreign body" even if the shape is identical. This proves the phenomenon is not about **geometry**, but about **context**.
  The edge here is **Expectation**. When a reader sees your new font, they subconsciously build a predictive model after the first three letters. The 'a' from the other font violates the predictive model, even if the 'a' itself is geometrically sound. The "wrongness" is a prediction error in the viewer's brain.

  **3. The Limit of Legibility**
  You noted the 'a' is still readable as an 'a'. This is the floor. If you adjust the 'a' so much to fit the 'g' that it becomes unreadable, you have broken **Signification** to satisfy **Value**. The "right answer" you are hunting is always a balance between Signification (I know what letter this is) and Value (I know what *font* this is).

  ### Does it carry over? (The Reach)

  Yes. This is a universal structural principle. It appears wherever individual elements must cohere into a system.

  **1. Human Character (Psychology)**
  You mentioned traits fixing each other. Consider "Stubbornness."
  *   In a system of traits containing *Integrity* and *Courage*, Stubbornness becomes **Perseverance** (a virtue).
  *   In a system of traits containing *Insecurity* and *Ignorance*, Stubbornness becomes **Obstinacy** (a vice).
  The trait itself hasn't changed. Its moral "value" is determined by the other traits in the personality "font." A person is not a pile of traits; they are a typeface of traits.

  **2. Cuisine (Flavor Profiles)**
  Take a pinch of salt.
  *   In a dish with high fat and low acid, the salt reads as "seasoning."
  *   In a dish with high acid and low fat, that same pinch of salt might read as "sharpness" or "metallic."
  Chefs do not cook ingredients; they cook relationships. The salt is "wrong" not because it is bad salt, but because it breaks the logic of the sauce.

  **3. Ethics (Situational Morality)**
  An action (e.g., "lying") is often judged not by the action itself, but by the system of intent and consequence surrounding it.
  *   Lying to protect a victim = Heroic.
  *   Lying to protect oneself = Cowardly.
  The geometry of the act is identical; the systemic value is opposite.

  ### The Name (If you must have one)

  If you need a handle for it, the semioticians call it **Structural Value**. The musicians call it **Intonation** (a note is only "in tune" relative to the key and the other notes). The type designers call it **Color**.

  But if I were to coin a term for the specific *sensation* you are describing—the moment the 'g' reaches back and changes the 'a'—I would call it **Retroactive Coherence**.

  It is the feeling that the present is editing the past. When you draw the 'g', you are reaching back in time and redesigning the 'a' you drew yesterday. The "right answer" exists only when the entire set of letters agrees on what the rules were all along.

  ### Summary of the Shape

  *   **What it is:** A state of equilibrium in a closed system where elements define each other's identity.
  *   **What it isn't:** It is not consistency (you can have consistent weirdness). It is not legibility (you can have legible dissonance).
  *   **Where it starts:** At the second element.
  *   **Where it stops:** At the boundary of the system (the font, the dish, the personality).
  *   **The sensation:** The relief of tension when the system clicks into a self-justifying logic.

  You are not drawing letters. You are drawing the invisible lines of force that hold the letters together. The 'a' looks wrong because the force field changed when you added the 'g'.
