      *   **Constraints:** No literature review/bibliography. Needs a determinate question. Needs to explain why existing positions fail. Needs a month-by-month method (no empirical study, just arguments + institutional texts). Needs defined success/failure conditions. Needs realistic scope (essay vs. academic piece). Needs to flag conceptual pitfalls for a non-philosopher.
