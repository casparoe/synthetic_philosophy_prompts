      *   *The Institutional Angle:* Clemency and military rules of engagement (ROE) as practical applications of theoretical thresholds.
      *   *Proposed Title/Question:* "The Retributivist's Dilemma: Error, Excess, and the Institutional Logic of Capital Punishment." Or more sharply: "Desert vs. Risk: Can Retributivism Coherently Justify the Inevitability of Wrongful Execution?"
      *   *Decision:* Let's frame it as an investigation into the *moral mathematics* of retributivism when faced with fallibility.

  3.  **Address the "Why It Matters" (The Gap):**
      *   *Public Discourse:* Treats innocence risk as a utilitarian cost (deterrence vs. lives lost).
      *   *Philosophy:* Often treats retributivism as ideal theory (assuming perfect knowledge) or glosses over the "systemic error" problem as a practical implementation issue rather than a theoretical crisis.
