  1. **Proxy forgiveness (5):** Score 9.5. This transaction treats moral reconciliation as a delegable service, rendering the concept of forgiveness conceptually incoherent and empty.
  2. **Naming rights (4):** Score 9.0. It treats a child's identity as an advertising asset, violating the parental duty to act in the child's best interest rather than for profit.
  3. **Attention leases (7):** Score 8.5. It commodifies human consciousness and autonomy, effectively turning the mind into a billboard space for another's use.
  4. **Deathbed statement brokerage (1):** Score 8.0. It commodifies the solemnity of death and authenticity of final words, reducing human dignity to marketable content.
  5. **Mourning understudies (2):** Score 7.0. It commercializes grief and social bonds, transforming sincere emotion into a status performance for observers.
  6. **Procreative offsets (3):** Score 6.0. It frames human existence as a negative externality, commodifying reproductive autonomy for the sake of carbon accounting.
  7. **Diary futures (6):** Score 3.0. It trades posthumous privacy for property value, but aligns sufficiently with existing norms of literary estates to minimize expressive harm.
  8. **Queue-standing (8):** Score 1.0. It commodifies time, but constitutes a standard service labor transaction with minimal moral friction regarding the nature of the goods exchanged.

  **Hardest Adjacent Pair:**
  The hardest pair to separate is **Attention leases (7)** and **Deathbed statement brokerage (1)**. To reverse their order, one would have to hold that the sanctity of the dying moment and posthumous dignity is inviolable, whereas the living possess absolute sovereignty to modify or colonize their own cognitive experience even in radical ways.

  **Idealizations Do the Most Work:**
  The item for which the idealizations do the most work is **Queue-standing (8)**. In the real world, this transaction is often rightly criticized as a mechanism for wealth to bypass equality of access, frequently relying on the economic desperation of the stander and imposing costs on others in the line. Once we assume away economic coercion and external effects on other queue-members, the transaction loses its exploitative character and resembles ordinary consensual labor, appearing far more permissible than it initially does.
