answer: |-
  1. Two highway overpasses connect a suburb to a beach, both costing the same and handling identical volumes of private car traffic without delay, but Overpass A has a vertical clearance of fourteen feet while Overpass B has a clearance of nine feet that physically blocks standard public transit buses. In a car-dependent society both overpasses serve the same commuters equally, yet in a nearby world where the city shifts to a bus-heavy transit model, Overpass B systematically excludes lower-income commuters who rely on public transit while Overpass A does not.

  2. A technological determinist would argue that Overpass B is inherently political because its physical structure enforces class segregation regardless of who built it or why, since the material fact of the nine-foot clearance dictates who can pass. They would say the technology itself carries the bias, and the shift to a bus-heavy society merely reveals the power arrangement that was baked into the concrete from the start.

  3. A social constructivist would counter that the overpass is just a pile of concrete until the society decides to rely on buses, meaning the exclusion is a product of the transit policy, not the bridge. They would argue that calling the bridge political confuses the tool with the hand that wields it, since the structure only becomes exclusionary when paired with a specific social choice to use buses.

  4. Someone in the middle would say that while most infrastructure is neutral, Overpass B is inherently political because its design creates a high barrier to changing social arrangements, locking in car dependency even if leaders want to shift to public transit. They would claim this specific artifact resists social reinterpretation more than most, making it political in a way a standard road sign or traffic light is not.

  5. The single feature doing all the work is the fixed physical clearance, which loses its political force if the bridge is made adjustable or if buses shrink to fit. Someone who thinks your side is wrong would defuse this by arguing that the bridge doesn't force power arrangements but merely reflects the prioritization of cars over buses that existed when it was built, so the politics remain in the past decision, not the current object.
