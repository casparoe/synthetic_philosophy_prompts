answer: |-
  The stratigraphic practice presupposes that formal geologic time units are conventional coordination devices requiring material anchoring for synchronicity, rather than discoveries of ontological joints in nature.

  The requirement for a Golden Spike (GSSP) is often mistaken for realism—the idea that the Anthropocene is a "real" thing waiting to be found—but the protocol actually mandates correlatability, not causality. A GSSP does not mark the exact moment a phenomenon began (which is often diachronous and fuzzy); it marks a specific horizon in a specific rock that can be identified globally to synchronize clocks. This implies that the boundary itself is a stipulation placed upon a continuous record to facilitate communication, consistent with a conventionalist view where the "joint" is cut by the geologist, not discovered by them. The physical marker is not proof of the epoch's ontological reality, but a necessary empirical constraint to ensure that when a geologist in Argentina says "Holocene," a geologist in Japan knows exactly which strata are meant.

  The split between GSSPs (recent time) and GSSAs (deep time) confirms that this commitment is epistemic rather than ontological. If epochs were natural kinds, the Precambrian boundaries defined by arbitrary numbers (GSSAs) would be considered scientifically inferior or provisional in a way that they are not; instead, they are accepted as fully formal units. This indicates that the community prioritizes global synchronicity above all else, accepting numerical fiat when material markers are metamorphosed or absent. The practice therefore presupposes that the primary function of the time scale is coordination across space, and the method of coordination (rock vs. number) is determined by the preservation quality of the record, not the metaphysical status of the time period.

  The distinction drawn between "epoch" and "event" reveals a commitment to isochrony over significance. In stratigraphy, a formal unit must represent a slice of time that is effectively simultaneous everywhere; an "event," by contrast, is a process that unfolds over varying durations in different places. By relegating the Anthropocene to an "event," the commission is not denying human impact is real or significant, but rather asserting that human impact is diachronous—it started at different times in different places—and thus fails the synchronicity requirement for a formal chronostratigraphic unit. This presupposes that geologic time is defined by the geometry of deposition and correlation, not by the causal agents (like humans) that might disturb it.

  If you swapped this presupposition for a view that periods are purely conventional divisions picked for human purposes without needing material anchoring, the practice would collapse into chronometry. Crawford Lake would cease to matter because there would be no need to find a physical proxy for a decision that is fundamentally sociopolitical or historical. The committee could simply vote for "1950 CE" as the boundary based on the convening of the IAEA or the Trinity test, without requiring a plutonium spike in varved mud. The insistence on the physical marker shows that geology refuses to fully decouple time from matter; even if the boundary is conventional, it must be inscribed in the Earth to count as *geologic* time rather than *historical* time.

  However, the practice remains underdetermined regarding the reality of the *process* versus the *boundary*. One can consistently hold that the Anthropocene is a real, causal phenomenon (a natural kind of sorts) while accepting that the *boundary* marking it is a conventional tool. The rejection of the GSSP does not rule out realism about human impact on the Earth system; it only rules out the formalization of that impact into a synchronous stratigraphic unit. Thus, the practice leaves open the metaphysical status of the Anthropocene as a historical process, while closing the door on its status as a formal tick on the geologic clock.
