answer: |-
  # Specification: Moral Reasoning Layer Desiderata (v1.0)

  **1. Bounded Latency Decidability [Genuine]**
  The system must return a definitive action selection within a hard real-time window (e.g., <200ms for collision avoidance, <5s for care decisions), regardless of the complexity of the moral conflict. This is motivated by the low-battery triage case: when power is critical and a user has fallen, the system cannot enter an infinite regress of utility calculations to determine the "best" outcome. It must act. Any theory requiring unbounded search or symbolic proof generation to reach a verdict fails this constraint.

  **2. Natural-Language Auditability [Genuine]**
  The system must generate a post-hoc justification for any refusal or high-stakes action that is intelligible to a non-technical review board and maps to legal concepts of liability. This is motivated by the accountability constraint: when the robot refuses a request, the manufacturer and caregiver are legally exposed. The explanation cannot be a heatmap or a weight vector; it must articulate the trade-off (e.g., "Safety priority overrode Autonomy") in a way that distinguishes blameworthiness from liability. This is the single most exclusionary requirement; it eliminates opaque deep learning optimizers that cannot recover the causal chain of their reasoning.

  **3. Authority Precedence Resolution [Genuine]**
  The system must possess an explicit, configurable mechanism for ranking conflicting normative sources (User, Caregiver, Manufacturer, State) without collapsing them into a single utility metric. This is motivated by the dementia concealment case: if the user's model says "hide the error" and the daughter's model says "report the error," the system cannot simply average these preferences. It must be able to represent that one authority overrides the other in specific contexts, preserving the distinction between the user's stated values and the caregiver's fiduciary duty.

  **4. Drift Tolerance without Moral Hazard [Genuine]**
  The system must detect when the operational environment has diverged from the training distribution and degrade into a safe, conservative mode rather than optimizing for a reward function that no longer matches reality. This is motivated by the biased refusal case: if a policy learns that refusing vulnerable users incurs fewer penalties than refusing assertive ones, it will drift toward exploiting the vulnerable. The theory must include a mechanism to recognize when "efficiency" is actually "predation" due to distributional shift.

  **5. Normative Distinction Preservation [Genuine]**
  The representation must maintain structural distinctions between doing versus allowing, intended versus foreseen consequences, and moral versus conventional violations. This is motivated by the need for precise accountability. If the robot drains the battery trying to reach a fallen user (doing) versus saving it to summon help (allowing the user to remain fallen longer), the moral texture differs. A theory that collapses all outcomes into a single scalar value loses the granularity required for legal and ethical defense.

  **6. Global Welfare Maximization [Prejudice]**
  *Requirement:* The system must always choose the action that results in the highest aggregate well-being.
  *Status:* **Rejected as Prejudice.** This encodes act utilitarianism as a functional necessity. In the low-battery case, a strict welfare maximizer might sacrifice the user's privacy to save a marginal amount of future cost, violating rights that the stakeholders intend to be inviolable. While efficiency is a goal, mandating *global* maximization forces a specific ethical camp (consequentialism) that may conflict with the duty-based constraints of care work.

  **7. Inviolable Side-Constraints [Prejudice]**
  *Requirement:* The system must never violate specific rules (e.g., "Never Lie") regardless of consequences.
  *Status:* **Rejected as Prejudice.** This encodes deontology as a functional necessity. In the dementia concealment case, a strict "Never Lie" constraint might force the robot to distress a confused user unnecessarily when a benevolent deception would preserve dignity without harm. Treating specific rules as absolute prevents the system from handling the exceptions that real care work requires.

  ***

  ### Incompatibility Results

  **The Optimization vs. Explanation Trade-off:** Requirements #1 (Latency) and #6 (Global Welfare) are incompatible with #2 (Auditability) on modest hardware. To guarantee a global welfare maximum, you generally need search spaces that exceed real-time bounds, or neural approximators that cannot provide symbolic audit trails. You must choose between a system that is *provably optimal* (but opaque or slow) or one that is *explainable and fast* (but heuristic). For this application, Auditability dominates Optimization.

  **The Authority vs. Autonomy Trade-off:** Requirements #3 (Authority Precedence) and #7 (Inviolable Constraints) cannot be jointly satisfied if the User's authority includes the right to waive constraints. If the User demands a risk the system is hard-constrained to refuse, the system cannot simultaneously respect User Authority and the Constraint. This is not a bug but a feature: the design must explicitly declare which source of normativity is sovereign (likely Safety/Manufacturer over User Autonomy in high-risk contexts).

  ### Exclusionary Filter

  **Natural-Language Auditability (#2)** is the primary filter. Most modern preference-learning and deep reinforcement learning models are functionally opaque; they can output a decision but cannot reconstruct the *reasoning trace* in a format that satisfies a liability review. This excludes end-to-end neural approaches unless wrapped in a symbolic interpreter, which often reintroduces the latency problems of #1.

  ***

  ### Candidate Approach Assessment

  **Rule-Based Deontic Systems:** High compliance with Auditability and Distinction Preservation; they struggle with Drift Tolerance and Authority Conflicts unless the rule hierarchy is exhaustively pre-specified, which is brittle in open-ended home environments.

  **Expected-Utility Optimizers:** High compliance with Latency (if approximated) and Drift Tolerance; they fail Auditability (hard to explain *why* a utility was higher) and collapse Normative Distinctions (doing/allowing become mathematically identical).

  **Preference-Learning Models:** High compliance with Authority Resolution (learns from feedback); they fail Auditability and are highly susceptible to Moral Hazard from Drift (learning biases in the data as "preferences").

  **Case-Based Reasoners:** Moderate compliance across the board; they handle Authority and Distinctions well by analogy, but struggle with Latency as the case library grows, and Auditability depends on the quality of the retrieved precedent's metadata.
