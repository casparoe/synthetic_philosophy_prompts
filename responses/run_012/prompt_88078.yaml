          *   Comparative vs. Non-Comparative Badness (Baseline).
          *   Death as Good/Neutral (not always bad).
          *   Awareness Independence.
          *   Posthumous Harm/Benefit.
          *   Metaphysical Neutrality (Personal Identity).
      *   **Mandatory Test Cases:**
          1.  Painless sleep vs. Vegetative state.
          2.  Unrelievable pain/dementia (Death as benefit).
          3.  Just before vs. Just after a great good.
