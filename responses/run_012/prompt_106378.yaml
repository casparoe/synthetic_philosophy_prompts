answer: |-
  Here is the menu of claims, the analysis of the sceptics, the translation wrinkle, and the tools you need for the piece.

  ### The Menu of Claims

  The sentence "to show the past as it actually was" performs four distinct jobs depending on where you place the emphasis.

  **1. The Integrity Constraint**
  *   **The Claim:** Historians must not fabricate evidence, ignore contradictory documents, or knowingly assert falsehoods.
  *   **Status:** **Platitude.** No working historian denies this. It is the baseline ethics of the profession.
  *   **Sceptic Vulnerability:** None. Carr and White assume historians are acting in good faith. Their arguments do not touch this claim.

  **2. The Anti-Anachronism Constraint**
  *   **The Claim:** Historians must understand the past on its own terms, using categories available to the people at the time, rather than judging them by modern moral or political standards.
  *   **Status:** **Substantive and Defensible.** This is a core methodological rule. However, it is difficult to execute perfectly because historians cannot fully shed their own temporal location.
  *   **Sceptic Vulnerability:** Partial. Carr argues that our *interest* in the past is always driven by the present, so total escape from modern categories is impossible. White argues that the *forms* we use to explain the past (tragedy, comedy, irony) are modern literary impositions, not ancient truths.

  **3. The View from Nowhere**
  *   **The Claim:** The historian's identity, political commitments, and selection of focus do not alter the facts produced. A neutral observer and a committed observer should arrive at the same description.
  *   **Status:** **False (Epistemologically).** This assumes facts exist independently of the questions asked to retrieve them.
  *   **Sceptic Vulnerability:** High. This is Carr's primary target. He argues that facts are like fish in an ocean; which ones you catch depends on where you fish and what gear you use. The "selection is constitutive" argument kills this reading.

  **4. The Single True Story**
  *   **The Claim:** The past is a determinate object with a single, complete shape. There is one correct narrative that matches reality, and all others are distortions.
  *   **Status:** **False (Metaphysically).** This assumes the past comes pre-packaged as a story rather than a chaos of events waiting to be organized.
  *   **Sceptic Vulnerability:** Total. This is Hayden White's primary target. He argues that the past has no inherent plot; the "story" is imposed by the historian. If there is no inherent plot, there cannot be a single "actual" story.

  ### The Sceptic Test: Can the Panelist Retreat?

  Yes, the panelist can retreat, but only so far.

  If you attack the phrase using Carr or White, you are attacking Readings 3 and 4. A savvy panelist will immediately retreat to Reading 1 ("I'm not saying there's only one story, I'm just saying we shouldn't lie about the documents") or Reading 2 ("I'm just saying we shouldn't judge them by 21st-century standards").

  **The Trap:** The phrase carries the *authority* of Reading 4 (the single true story) while claiming the *safety* of Reading 1 (the integrity constraint).
  *   If Carr and White only refute Reading 4, the panelist retreats to Reading 1 and keeps their authority.
  *   However, Carr's argument about selection also threatens Reading 2. If the selection of facts is constitutive, then choosing *which* "own terms" to prioritize is itself a political act.
  *   **The Verdict:** The sceptics successfully destroy the metaphysical claim (Reading 4). They complicate the methodological claim (Reading 2). They leave the ethical claim (Reading 1) untouched. The panelist's authority relies on the audience confusing Reading 1 with Reading 4.

  ### The German Wrinkle: *Eigentlich*

  This is not a translator's red herring; it is the hinge of the ambiguity.

  *   **"Actually" (Correspondence):** Implies a mirror relationship between text and reality. This supports Readings 3 and 4. It suggests the past is a fixed object to be copied.
  *   **"Essentially/Properly" (Hermeneutic):** Implies grasping the inner spirit or logic of the time. This supports Reading 2. It suggests the past is a foreign country to be understood.

  **Is it doing real work?**
  In academic historiography, the "Essentially" reading saves Ranke from the "Actually" reading. It turns him from a naive positivist into a historicist who wanted to understand the unique essence of each epoch.
  **In public debate:** It is almost always a red herring. When a panelist uses the phrase to shut down a question about dispossession or morality, they are invoking the "Actually" reading to claim objective authority. If challenged, they may retreat to the "Essentially" reading to claim nuance. The ambiguity allows them to have it both ways: the hardness of fact and the sophistication of interpretation.

  ### For Your Piece

  **The Short Version**
  > "When historians invoke Ranke's promise to show the past 'as it actually was,' they are often conflating a vow not to lie with a claim that there is only one truth. The first is an ethical baseline no one disputes; the second is a metaphysical impossibility. The sceptics, from Carr to White, do not argue that we should fabricate evidence, but that evidence does not speak for itself. It must be selected, arranged, and emplotted. To say there is only one 'actual' story is not to protect the past from politics, but to hide the politics of the teller behind the mask of objectivity."

  **The Follow-Up Question**
  > "Are you invoking this principle to argue that we must not falsify evidence, or to argue that only one narrative can fit the evidence without distortion?"

  *(If they say the former, ask why alternative narratives constitute falsification. If they say the latter, ask them to defend the metaphysical claim that the past comes pre-structured as a single story.)*
