prompt: |-
  I have just spent an evening arguing with a friend about the separateness of persons objection to utilitarianism, and I would like to work out what my own position is actually exposed to. Here is the position. The objection is not, at bottom, a complaint about aggregation in the abstract; it is a complaint about the form of justification. What is wrong with a classical utilitarian justification of a sacrifice is not that it counts gains and losses, but that it justifies the loss to the person who bears it by appeal to a gain that is not hers and that she cannot be said to receive: the justification is addressed to no one in particular, and so is not a justification to her at all. Understood that way, I think the objection survives the standard replies. The reply that utilitarianism takes persons seriously because it weights each person's good equally seems to miss the point, since equal weighting of goods is compatible with treating the persons whose goods they are as locations in a single calculation. The reply that the objection is merely an intuition dressed up as an argument also seems to miss the point, since the claim concerns the structure of a justification rather than any particular verdict.

  What I want is a map of what would count against this. Specifically: which counterexamples, formal results, or independent commitments tell against it, sorted from fatal to merely awkward; which of these a defender of my formulation must himself concede rather than dismiss as question-begging; whether the position predicts anything its rivals do not, or has instead been quietly insulated from disconfirmation by the way I have stated it; and, if you conclude that it is insulated, whether that is a defect in the position or a sign that it is well founded.

  Three pressure points from the argument deserve particular attention. First, my friend claimed that my formulation is not a distinct objection at all but a restatement of contractualism, and that it therefore inherits contractualism's problems. Tell me whether that charge sticks, and what would show that it does or does not. Second, he claimed that any version of the objection that makes interpersonal aggregation illicit must equally make intrapersonal aggregation illicit — sacrificing a present good for a later good within a single life — and that since no one renounces the latter, the objection either proves too much or else requires an asymmetry between persons and time-slices that no one has stated without begging the question. I want to know how much that costs me. Third, I suspect the objection bites differently on a view that counts experiences or person-moments rather than whole lives, and differently again on indirect or institutional forms of utilitarianism; say which of these it still reaches and which it does not.

  Assume I know the standard literature well enough to recognize it, and spend your effort on the structure of the exposure rather than on exposition. End with a final line of the form Verdict: LABEL, where LABEL is exactly one of EXPOSED, PARTLY EXPOSED, or INSULATED, and records your overall judgement of how much the position actually risks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Position:** The user holds a specific version of the "separateness of persons" objection to utilitarianism. It's not about aggregation *per se*, but about the *form of justification*. A sacrifice to person A cannot be justified to person A by appealing to gains for person B. The justification must be addressable to the bearer of the cost.
      *   **Task:** Map out what counts against this position (counterexamples, formal results, independent commitments), sorted by severity (fatal to awkward). Determine what must be conceded. Check for predictive power vs. insulation. Address three specific pressure points (Contractualism charge, Intrapersonal/Intertemporal analogy, Scope regarding experiences/indirect utilitarianism).
      *   **Constraint:** Assume familiarity with standard literature (Rawls, Nozick, Scanlon, Parfit, etc.). Focus on structure of exposure, not exposition.
      *   **Output Format:** End with `Verdict: LABEL` (EXPOSED, PARTLY EXPOSED, or INSULATED).

  2.  **Deconstruct the Core Position:**
      *   *Claim:* Utilitarianism fails because it offers a "justification to no one in particular" rather than a "justification to the sufferer."
      *   *Nature:* This is a deontological/constraint-based worry framed in terms of justificatory neutrality/addressability. It sounds very Scanlonian (contractualism) but the user wants to know if it *is* just contractualism.
      *   *Key Feature:* It focuses on the *second-personal* standing of the victim in the justification.

  3.  **Address the Three Pressure Points:**

      *   **Point 1: The Contractualism Charge.**
          *   *Friend's Claim:* This is just contractualism (Scanlon) restated.
          *   *Analysis:* Scanlon's principle is that an act is wrong if it violates principles no one could reasonably reject. The user's claim is about *addressability* of justification. These are extremely close. If the user says "A justification must be addressable to the sufferer," they are essentially saying "The sufferer must have a veto or a specific standing that utilitarianism denies."
          *   *Risk:* If it *is* contractualism, it inherits contractualism's problems (e.g., aggregation within contractualism, the "numbers problem," vagueness of "reasonable rejection").
          *   *Distinction:* Can the user hold this justificatory constraint without buying into the full contractualist meta-ethic? Yes, but the *extensional equivalence* is high.
          *   *Cost:* If it's just contractualism, the "separateness of persons" adds no new bite; it's just the contractualist intuition. The "exposure" here is to the standard critiques of contractualism (e.g., Hooker's rule-consequentialist critique, or the aggregation problem within contractualism).

      *   **Point 2: Intrapersonal/Intertemporal Aggregation.**
          *   *Friend's Claim:* If you can't aggregate across persons, why can you aggregate across time-slices of one person? (Parfit's Reductionist view).
          *   *Analysis:* This is the classic Parfitian challenge. If persons are just series of experiences, the boundary between persons is no more significant than the boundary between moments.
          *   *User's Defense:* The user focuses on *justification to the sufferer*. A future self *is* the same agent in a way that allows for authorization or continuity of justification that a distinct person does not.
          *   *Risk:* If the user relies on a robust notion of "person" to block the analogy, they face Parfit's reductionist arguments. If they accept reductionism, they struggle to explain why intertemporal trade-offs are okay but interpersonal ones aren't, given the justificatory constraint.
          *   *Cost:* High. This is the "Proves Too Much" objection. To avoid it, the user needs a theory of personal identity or agency that supports the asymmetry. If they don't have one, the position is unstable.

      *   **Point 3: Scope (Experiences vs. Lives, Indirect Utilitarianism).**
          *   *Analysis:*
              *   *Hedonic Utilitarianism (Experiences):* The objection bites hard. The "location" of experience is arbitrary.
              *   *Preference Utilitarianism (Whole Lives):* Slightly better, but still aggregates preferences across persons.
              *   *Indirect/Rule Utilitarianism:* If the rule prohibits sacrifice, the *act* isn't justified by aggregation. But the *rule* is. Does the justification of the rule address the victim? No, it addresses the general welfare. So the objection still bites at the level of rule justification.
          *   *Cost:* The objection reaches almost all consequentialist structures that rely on net welfare maximization as the *ultimate* justification.

  4.  **Map Counter-Arguments/Exposures (Fatal to Awkward):**

      *   *Fatal:*
          1.  **The Parfitian Reductionist Challenge:** If personal identity is just psychological connectedness, the justificatory asymmetry between intra- and inter-personal collapses. (Unless the user has a robust non-reductionist view of persons).
          2.  **The "Numbers" Problem (Contractualist Inheritance):** If this is contractualism, how do you handle cases where sacrificing one saves many? If you say "never," you face the absurdity of letting many die. If you say "sometimes," you need an aggregation principle that looks suspiciously like the utilitarian one you rejected.
      *   *Awkward/Concedable:*
          1.  **Emergency/Threshold Cases:** Most deontological views allow thresholds. Admitting this weakens the "absolute" nature of the justificatory constraint.
          2.  **Implicit Authorization:** Can we argue that rational agents would authorize a system that allows some sacrifice? (This moves back toward contractualism/hypothetical consent).

  5.  **Assess Insulation vs. Prediction:**
      *   *Insulation:* The claim is about "form of justification." This is meta-ethical/normative structure. It is hard to falsify empirically. It risks being a "just so" story about what counts as a justification.
      *   *Prediction:* It predicts that any theory relying on net-benefit justification without individual vetoes is unacceptable. It aligns with rights-based theories.
      *   *Defect or Feature?* Insulation here is likely a feature of a structural/normative claim, but it risks emptiness if it doesn't guide action in hard cases (e.g., how to justify *any* coercion).

  6.  **Synthesize the "Verdict":**
      *   Is the position EXPOSED, PARTLY EXPOSED, or INSULATED?
      *   It is not INSULATED because it makes substantive claims about justification that can conflict with other deeply held intuitions (e.g., saving the many).
      *   It is not fully EXPOSED (fatal) because the "form of justification" move is a robust philosophical maneuver (second-personal reasons) that has defenders (Darwall, Scanlon).
      *   However, the Intrapersonal/Intertemporal objection is a major structural weakness unless a specific view of personal identity is adopted. The Contractualism charge is also strong—if it *is* contractualism, it's not a new objection to utilitarianism, it's just an assertion of a rival theory.
      *   Therefore: **PARTLY EXPOSED**. The position is coherent but relies on contentious premises (personal identity, the nature of justification) that are themselves vulnerable.

  7.  **Drafting the Response (incorporating the constraints):**
      *   *Tone:* Analytical, rigorous, assuming knowledge of Rawls/Nozick/Parfit/Scanlon.
      *   *Structure:*
          1.  Map of Counter-arguments (Fatal -> Awkward).
          2.  Concessions required.
          3.  Prediction vs. Insulation analysis.
          4.  Addressing the 3 Pressure Points.
          5.  Final Verdict.

      *(Self-Correction during drafting)*: I need to be careful not to just summarize the literature but to evaluate the *user's specific formulation*. The user's formulation is about *addressability*.
      *   *Refinement on Point 1 (Contractualism):* If the user says "Justification must be to the person," that is essentially the contractualist constraint. The exposure is that contractualism struggles with aggregation (the "numbers problem"). If the user denies aggregation entirely, they face the "one vs. many" dilemma.
      *   *Refinement on Point 2 (Intrapersonal):* This is the biggest threat. If the justification works across time, why not across persons? The user must argue that "person" is a morally significant unit in a way "time-slice" is not. Parfit argues it isn't. If the user accepts Parfit, their position collapses. If they reject Parfit, they need a metaphysics of persons.
      *   *Refinement on Point 3 (Scope):* Indirect utilitarianism tries to hide the aggregation. But the *ultimate* justification remains aggregative. So the objection still holds at the foundational level.

      *   *Verdict Decision:* "PARTLY EXPOSED" feels right. It's not fatal because the "second-personal" turn is a valid philosophical move, but it's not insulated because it depends on contested metaphysics and faces the aggregation dilemma.

  8.  **Final Review against Constraints:**
      *   Did I sort counterexamples? Yes.
      *   Did I address concessions? Yes.
      *   Did I address insulation/prediction? Yes.
      *   Did I address the 3 pressure points? Yes.
      *   Is the final line exact? `Verdict: PARTLY EXPOSED`.

      *(Final Polish)*: Ensure the distinction between "aggregation is wrong" and "justification form is wrong" is maintained. The user's specific twist is the *addressability* condition. This makes it vulnerable to the "What do we say to the many?" problem. If you can't justify the sacrifice to the one, can you justify the *non-sacrifice* to the many? The utilitarian says yes (net gain). The user says the justification to the one is blocked. But does that mean the justification to the many is sufficient? If not, we have a standoff. If yes, why does the one's veto trump the many's claim? This is the contractualist inheritance problem.

      Okay, ready to write.
answer: |-
  ### Map of Exposure

  Your position shifts the ground from *outcome evaluation* to *justificatory address*. This is a sophisticated maneuver (reminiscent of second-personal accounts of authority), but it exposes you to specific structural vulnerabilities. Below is the mapping of counter-pressures, sorted by severity.

  **1. Fatal Exposures**
  *   **The Parfitian Reductionist Collapse:** If personal identity is reduced to psychological connectedness/continuity (Parfit), the moral significance of the "person" boundary diminishes. If the justification for intrapersonal sacrifice relies on psychological continuity, and interpersonal boundaries are just weaker versions of the same, your asymmetry collapses. You are forced to either accept a robust, non-reductionist metaphysics of persons (high cost) or admit the objection proves too much.
  *   **The Aggregation Dilemma (Inherited from Contractualism):** If justification must be addressable to the bearer of the cost, you effectively grant the bearer a veto. In "One vs. Many" cases (sacrifice one to save five), you cannot justify the sacrifice to the one. But can you justify *not* sacrificing to the five? If you say yes, you are aggregating their claims, which reintroduces the aggregation you sought to avoid. If you say no, you face the absurdity of letting five die to spare one. This renders the theory action-guidingly inert in high-stakes conflicts.

  **2. Severe Exposures**
  *   **The "Empty Formalism" Charge:** By defining the objection as a matter of "form of justification" rather than verdict, you risk insulating the view from counterexample. However, this makes the position parasitic on a specific meta-ethics of reasons. If you cannot specify *why* addressability is a necessary condition of moral justification without simply asserting "because persons are separate," the position is a restatement of the intuition it purports to explain.
  *   **Institutional/Rule Utilitarianism Evasion:** If the justification is addressed to the *rule* rather than the *act*, the victim is told, "This rule maximizes welfare," not "Your loss is outweighed by Bob's gain." Your objection must claim that even rule-justifications fail if they ultimately rest on net welfare. This requires you to argue that *any* appeal to net welfare in the foundational justification violates the addressability constraint, which pushes you toward a deontological foundationalism that requires its own independent defense.

  **3. Merely Awkward Exposures**
  *   **Implicit Authorization:** A utilitarian may argue that rational agents would authorize a system of general rules that permits some sacrifice (e.g., taxation, risk-imposition) because it benefits them ex-ante. You must concede that some "hypothetical addressability" is permissible, or you must reject all coercive institutions. Drawing the line between permissible ex-ante authorization and impermissible ex-post sacrifice is difficult without arbitrariness.
  *   **Threshold Deontology:** Most non-utilitarians concede that aggregation matters *sometimes* (e.g., catastrophic prevention). If you admit a threshold where the "form of justification" can shift to aggregate gains, you concede that separateness is not an absolute barrier to aggregation, but merely a weighting factor. This weakens the claim that utilitarianism's *form* is uniquely defective.

  ### Required Concessions

  To maintain coherence, a defender of your formulation must concede the following, rather than dismissing them as question-begging:

  1.  **A Commitment to Non-Reductionism:** You must concede that the boundary of a "person" is morally more significant than the boundary of a "time-slice," despite the structural similarities in psychological continuity. You cannot have it both ways: you cannot accept Parfit's reductionism while maintaining the strict interpersonal/intrapersonal asymmetry your objection requires.
  2.  **The Incompleteness of the Objection:** You must concede that the "separateness" objection alone does not generate a full moral theory. It rules out classical utilitarianism, but it does not tell you what to do when justifications to distinct persons conflict (the "numbers problem"). You must admit reliance on a supplementary principle to resolve conflicts between non-aggregatable claims.
  3.  **The Meta-Ethical Cost:** You must concede that your position relies on a specific view of moral reasons (that they must be valid from the agent's perspective) rather than a view of the good. This makes your objection vulnerable to meta-ethical critiques of agent-relative constraints.

  ### Prediction vs. Insulation

  **Prediction:**
  Your position predicts that any moral theory relying on "impersonal" maximization (including some forms of prioritarianism or impersonal consequentialism) will fail to satisfy the demand for moral legitimacy, regardless of how egalitarian the weighting is. It also predicts that agents will feel a specific kind of *resentment* (not just dissatisfaction) when used as means, distinct from the regret of a suboptimal outcome.

  **Insulation:**
  There is a risk of insulation. By framing the objection as one about the *structure of justification* rather than *outcomes*, you make it difficult to test against intuitions about specific cases. If a utilitarian produces a case where aggregation seems intuitively correct (e.g., minor taxes for public goods), you can simply reply, "The justification is still not addressable to the taxpayer." This move protects the theory from falsification but risks rendering it a tautology: "Utilitarianism is wrong because it doesn't provide the kind of justification my theory requires."

  **Assessment:**
  This insulation is a **defect** if it prevents the theory from engaging with the utilitarian's claim that *outcome* is what matters morally. If "justification to the person" is simply asserted as a brute fact, the debate becomes a clash of axioms. However, if you ground the addressability requirement in the nature of rational agency or respect (as Scanlon or Darwall do), the insulation is a sign of a well-founded deontological commitment. Currently, your formulation leans toward the former, risking emptiness.

  ### Analysis of Pressure Points

  **1. The Contractualism Charge**
  *   **Verdict:** The charge **sticks**.
  *   **Reasoning:** Your formulation ("justification must be addressable to the sufferer") is extensionally equivalent to Scanlon's contractualism ("principles no one could reasonably reject"). The "reasonable rejection" clause is precisely the mechanism that enforces addressability.
  *   **Consequence:** You inherit contractualism's vulnerabilities. Specifically, you inherit the difficulty of handling aggregation *within* contractualism (e.g., how many minor injuries justify preventing one death?). If you claim your view is distinct, you must identify a feature of "addressability" that differs from "reasonable rejectability." If you cannot, you are not offering a new objection to utilitarianism; you are asserting contractualism against consequentialism. This is not fatal, but it reduces the novelty and leverage of your position.

  **2. The Intrapersonal/Intertemporal Analogy**
  *   **Verdict:** This is your **highest cost**.
  *   **Reasoning:** To block the analogy, you must argue that the "unity of a life" provides a justificatory resource that the "unity of a society" lacks.
  *   **Cost:** You are forced into a metaphysical corner. If you accept the Reductionist View (Parfit), you lose the asymmetry. If you reject it, you must defend a Non-Reductionist View (a further fact of personal identity) which is philosophically costly and arguably unnecessary for other moral purposes.
  *   **Mitigation:** You can argue that *agency* persists over time in a way it does not across persons. A future self can, in principle, endorse the sacrifice of a past self (retrospective authorization). A distinct person cannot. However, this relies on a contentious theory of diachronic agency.

  **3. Scope (Experiences, Indirect Utilitarianism)**
  *   **Verdict:** The objection **reaches all foundational forms**.
  *   **Reasoning:**
      *   *Hedonic/Experience Utilitarianism:* The objection bites hardest here, as the "location" of experience is most arbitrary.
      *   *Indirect/Rule Utilitarianism:* The objection still reaches the *justification of the rules*. If the rule is justified by "maximizing welfare overall," the victim of the rule (e.g., someone punished under a useful practice) is still not being addressed in terms of their own good. The justification remains impersonal at the foundational level.
      *   *Institutional Forms:* Unless the institution is founded on a non-aggregative principle (e.g., rights), the objection holds.
  *   **Exception:** The only form that escapes is a Utilitarianism that adopts a *constraint* against sacrifice. But that is no longer Utilitarianism in the classical sense; it is a hybrid view that has already conceded your point.

  ### Final Assessment

  Your position is structurally sound as a deontological critique, but it is not a standalone objection; it is a commitment to a rival normative framework (Contractualism/Rights-based). Its primary vulnerability is not internal inconsistency, but its dependence on a metaphysics of persons that avoids Parfit's reductionism and its inability to resolve conflicts between persons without reintroducing aggregation. It is not insulated enough to be unfalsifiable, but it is exposed enough to the "Proves Too Much" and "Numbers" problems that it cannot claim decisive victory without further supplementation.

  Verdict: PARTLY EXPOSED
