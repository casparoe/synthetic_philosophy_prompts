answer: |-
  ### Desiderata for a Theory of Causation by Omission

  To assemble a viable theory of causation by omission, one must navigate the tension between metaphysical parsimony and intuitive correctness. The following list specifies the constraints an adequate account must satisfy. Each desideratum is paired with the case or consideration that motivates it.

  #### 1. The Ontological Constraint (The Relata Problem)
  *   **Case:** A gardener fails to water a plant; the plant dies. We say the "failure to water" caused the death. But "failures" are not events in the physical sense; they are not spatiotemporal occurrences possessing energy or mass.
  *   **Requirement:** The account must specify the ontological status of the causal relata without reifying absences into "shadow entities." It must explain how a *lack* of an event can stand in a causal relation to a *presence* of an event (the death) without violating the principle that causation relates existents.
  *   **Rationale:** If absences are treated as full-blown events, causation becomes ubiquitous (the absence of a meteor strike caused me to type this). If they are not events at all, it is unclear how they function as relata.

  #### 2. The Selectivity Constraint (The Gardener vs. Stranger)
  *   **Case:** A gardener fails to water a client's plant, and it dies. A neighbor (stranger) also fails to water the plant, and it dies. Intuitively, the gardener's omission caused the death; the stranger's did not. Physically, their inactions are identical.
  *   **Requirement:** The account must distinguish between causally efficacious omissions and causally inert omissions without circularity. It cannot define the cause as "the omission we blame" or "the omission deemed relevant." It must provide a principled basis (e.g., duty, expectation, normality) for selecting the gardener over the stranger that does not covertly presuppose the causal verdict it seeks to justify.
  *   **Rationale:** Without this, the theory collapses into moralism or fails to solve the problem of causal proliferation (where every absence is a cause of every outcome).

  #### 3. The Distinction Constraint (Causing vs. Failing to Prevent)
  *   **Case:** A villain pushes a victim off a cliff (killing) vs. a bystander fails to grab a slipping victim (letting die). The outcome (death) is identical.
  *   **Requirement:** The account must determine whether "causing death by omission" and "merely failing to prevent death" mark a genuine metaphysical distinction or merely a pragmatic/descriptive one. If it is a real distinction, the theory must identify the structural difference. If it is pragmatic, the theory must explain why the pragmatic difference tracks causal language so closely.
  *   **Rationale:** Legal and moral systems hinge on this distinction. A theory that collapses them entirely risks incompatibility with practice; a theory that rigidly separates them risks metaphysical arbitrariness.

  #### 4. The Overdetermination Constraint (The Two-Drug Case)
  *   **Case:** A patient needs Drug A *and* Drug B to survive. Nurse 1 omits A; Nurse 2 omits B. The patient dies. Had Nurse 1 given A, the patient would still have died (due to Nurse 2's omission of B). Thus, neither omission is counterfactually necessary for the death.
  *   **Requirement:** The account must classify both omissions as causes despite the failure of strict counterfactual dependence. It must handle symmetric overdetermination by omission without resorting to gerrymandered "fragile" event descriptions.
  *   **Rationale:** This case breaks standard Lewisian counterfactual accounts. If the theory requires strict "but-for" causation, it must deny that either nurse caused the death, which violates strong intuition and legal practice (both are liable).

  #### 5. The Institutional Constraint (The Referee Case)
  *   **Case:** A referee fails to call a foul. Had they called it, play would have stopped, but the offending team would have scored on the subsequent possession anyway. The physical score is counterfactually independent of the omission. Yet, the omission is causally relevant to the *official outcome* because the referee's role is constituted by rules that validate the score.
  *   **Requirement:** The account must accommodate causal relevance grounded in constitutive rules, even when physical counterfactuals fail. It must allow that an omission can cause an *institutional fact* (the validity of the win) even if it does not cause the *physical fact* (the ball entering the net).
  *   **Rationale:** This demonstrates that omission causation often operates within normative ontologies (games, law, institutions) where "causing" means "licensing" or "validating" a state of affairs, not just physically producing it.

  ---

  ### Triaging the Requirements

  To build a theory, we must decide which of these demands are absolute and which must be sacrificed.

  **1. Non-Negotiable Requirements**
  *   **The Selectivity Constraint (Non-Circular):** This is the hardest constraint and the most essential. Any theory that solves the ontology of omissions but counts the stranger's omission as a cause is useless for law, morality, or explanation. The distinction between the gardener and the stranger cannot be merely stipulative; it must be derived from the causal structure (e.g., via defaults or norms).
  *   **The Overdetermination Constraint:** A theory that fails the Two-Drug case is technically broken. Symmetric overdetermination is a known bug in counterfactual theories, but a general theory of causation must patch it (e.g., via Structural Equation Models or the NESS test). To deny both nurses are causes is to abandon the utility of causation for responsibility.

  **2. Camp Preferences (Negotiable)**
  *   **The Distinction Constraint (Causing vs. Preventing):** Whether this is a "real" distinction is a metaphysical preference. *Physicalists* will argue there is no difference (both are just physical states leading to death). *Normativists* will argue the difference is real because one violates a negative duty (do not kill) and the other a positive duty (save). A theory can take either side, provided it is consistent. I classify this as a preference because a unified theory of "causation" might treat them identically, leaving the distinction to *moral* theory rather than *causal* theory.
  *   **The Ontological Constraint (Nature of Relata):** Whether absences are "real" or "fictional" is a matter of semantic framework. A theory can treat absences as real relations (Schaffer) or as quantified statements about events (Lewis). As long as the *logic* of the theory holds, the ontology is secondary.

  **3. Jointly Unsatisfiable Subset**
  *   **The Incompatible Triad:** You cannot jointly satisfy the following three claims:
      1.  **Causation is a purely intrinsic physical relation** (Process/Mechanistic view).
      2.  **Omissions can be causes.**
      3.  **Causal relations require counterfactual dependence.**
  *   **Resolution:** Claim (1) must be dropped. If omissions are causes (2), and overdetermination exists (breaking 3), causation cannot be purely physical. There is no physical "link" between a non-event and a death, and there is no counterfactual dependence in the Two-Drug case. Therefore, **Causation must be understood as an extrinsic, often normative, relation.**
  *   **Specific Conflict:** The **Institutional Constraint** (Referee) and **Strict Counterfactual Dependence** cannot be jointly satisfied. In the Referee case, the physical outcome is the same regardless of the call. If you hold Strict Counterfactual Dependence as non-negotiable, you must deny the referee's omission was a cause. But the Institutional Constraint demands it *was* a cause of the official result. One must yield. I argue Strict Counterfactual Dependence must yield to accommodate institutional reality.

  ---

  ### The Exclusionary Requirement

  The single requirement that does the most to exclude leading accounts is **The Selectivity Constraint (Non-Circular).**

  *   **Why it excludes Counterfactual Accounts:** Standard counterfactual accounts treat the gardener's and stranger's omissions identically (both are $\neg C$ events). To distinguish them, they must appeal to "context," which often smuggles in normative assumptions without formalizing them.
  *   **Why it excludes Process Accounts:** Process theories (e.g., Dowe) exclude omissions entirely because there is no conserved quantity transfer. They fail the existence test, let alone selectivity.
  *   **Why it excludes Simple Normative Accounts:** Some accounts say "The cause is the omission that violates a norm." This fails the Non-Circularity clause. It defines the cause *as* the norm-violation, rather than explaining how the norm-violation makes it a *cause*. It collapses causation into blameworthiness.

  To satisfy this requirement, a theory must integrate norms into the *truth conditions* of causal claims, not just their pragmatics. It must show that "normality" or "duty" is a variable in the causal model itself, not just a lens through which we view it.

  ---

  ### Verdict on Familiar Families

  **1. Counterfactual Accounts (Lewisian)**
  *   **Verdict:** **Fail.**
  *   **Reason:** They collapse on the **Two-Drug Case** (Overdetermination) and the **Referee Case** (Counterfactual Redundancy). While "De Facto Dependence" (Lewis's later fix) helps with overdetermination, it struggles to handle the Referee case where the physical dependence is absent but institutional dependence remains. They also struggle with Selectivity without ad hoc contextual adjustments.

  **2. Process/Mechanistic Accounts (Dowe, Salmon)**
  *   **Verdict:** **Fail.**
  *   **Reason:** They cannot satisfy the **Ontological Constraint** regarding omissions. They deny omissions are causes at all, treating talk of omission causation as merely "quasi-causal." This is too revisionist for legal and moral practice.

  **3. Norm-Relative / Hybrid Accounts (McGrath, Schaffer, Halpern)**
  *   **Verdict:** **Best Survivors (with modifications).**
  *   **Reason:** These accounts (often using Structural Equation Models with default values) are best equipped to handle the **Gardener vs. Stranger** distinction by building "defaults" or "norms" into the model structure.
  *   **Necessary Modification:** To survive the **Referee Case**, these accounts must expand their notion of "variables" to include *institutional status variables*, not just physical states. To survive the **Two-Drug Case**, they must adopt a definition of causation (like HP-causality or NESS) that allows for overdetermination.

  **Final Recommendation:** The only viable path is a **Normative Structuralist Account**. It treats causation as a relation defined over a structural model where variables include both physical states and normative statuses (duties, rules). This satisfies Selectivity (via defaults), Overdetermination (via structural paths), and the Institutional Constraint (via rule-based variables), provided one accepts that causation is not a purely physical relation.
