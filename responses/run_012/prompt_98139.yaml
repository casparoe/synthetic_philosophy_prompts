      *   **Tone:** Rigorous, philosophical, charitable but critical. No platitudes. The user wants to be challenged, not comforted, but also wants to know if the view is defensible.

  2.  **Deconstruct the Four Fronts:**

      *   **1. Subject of Experience (Phenomenology):**
