          *   *Reductionist Reply:* We adjust our practices. Or, the causal connection is strong enough for practical purposes.
          *   *Counter:* If I am just a stage, why do I care about *my* future pain more than *your* future pain if the causal connection is similar? The "special concern" problem.

      *   **3. Agency and Deliberation:**
          *   *Objection:* Deliberation implies a deliberator. If I am just a stream, reasons are just causes. Normativity collapses into causality. Who is responsible?
