  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I avoid the "meaninglessness" objection? *Yes.*
      *   *Check:* Did I rank based on what the *reductionist* would concede? *Yes, this is tricky. They concede nothing is fatal, but some are harder to explain away.* I need to phrase this carefully: "What counts as the strongest internal tension."
      *   *Check:* Did I explain the Personalist view accurately? *Need to ensure I distinguish them from Sarvastivada and Madhyamaka.* They posit a *pudgala* that is neither samskrtas (conditioned) nor asamskrtas (unconditioned).
