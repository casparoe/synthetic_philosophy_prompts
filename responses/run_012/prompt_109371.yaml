prompt: |-
  I do risk assessments for a state environmental health agency — maybe thirty a year, each one ends in a written finding that either triggers a drinking-water advisory or doesn't. The science is always thin: three rodent studies that disagree, one epi study with a confidence interval you could drive a truck through, or nothign but a structural analog and a QSAR model. Right now we do what everyone does: pick a central estimate, divide by an uncertainty factor of 10 or 100 or 1000, and write it up as though it were a number we know. A colleague in our biostat group keeps telling me we should be doing imprecise probabilities instead — carry a whole set of distributions, report a lower and upper bound on the risk, then apply a decision rule, maximin or Hurwicz with some optimism index, or maximality, or E-admissibility. I understand maybe half of that. She also mentioned something called dilation, where conditioning on an event that's meant to be independent of the thing you care about makes your interval wider rather than narrower, which if true sounds like it wrecks the whole approach.

  So: give me a procedure I can actually run in a day, that my board (non-technical) and our counsel (who needs a yes/no and a single number in the record) can live with. Questions in order, what counts as good enough to move to the next one, where it stops, where it hands the decision to a human because the disagreement isn't about facts anymore. I need to know which steps are real analysis and which are values wearing a lab coat, and I need it to say so out loud when the interval straddles our threshold and the rule I pick is what decides the case. Also tell me how to get from an interval to the one number the record requires without lying about it.

  Then run it on two cases: (a) the three-rodent-studies contaminant, and (b) the structural-analog-only contaminant, where I personally think the risk is negligible and I suspect the procedure is going to tell me I'm not entitled to that view.

  Procedure in prose first, then a JSON object with this shape:

  {"procedure": [{"step": 1, "question": "", "sufficient_answer": "", "if_not_met": "continue | stop | escalate", "fact_or_value": "", "hidden_judgment": true}], "worked_cases": [{"case": "", "bounds": {"lower": "", "upper": ""}, "verdict": "", "rule_that_flips_it": "", "who_signs": "", "outcome_analyst_wont_like": ""}], "cannot_do": [""]}

  One entry per step in the procedure array, in order; one entry per case; and in cannot_do, the things this procedure will not settle no matter how carefully it's run.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Risk assessor for a state environmental health agency.
      *   **Workload:** ~30 assessments/year.
      *   **Output:** Written finding triggering (or not) a drinking-water advisory.
      *   **Problem:** Science is thin (conflicting rodent studies, weak epi, QSAR only). Current method (point estimate + uncertainty factor) feels dishonest/over-precise.
      *   **Colleague's Suggestion:** Imprecise probabilities (sets of distributions, lower/upper bounds, decision rules like maximin/Hurwicz).
      *   **User's Concern:** "Dilation" (conditioning widens intervals), need for a practical procedure (runnable in a day), need to satisfy a non-technical board and legal counsel (who want a yes/no and a single number), need to distinguish facts from values, need to acknowledge when the decision rule drives the outcome.
      *   **Specific Cases to Run:** (a) Three conflicting rodent studies, (b) Structural analog only (user thinks risk is negligible).
      *   **Format:** Prose procedure first, then a specific JSON object structure.
      *   **Tone:** Professional, pragmatic, honest about uncertainty, acknowledging the tension between science and policy.

  2.  **Deconstruct the Core Conflict:**
      *   *Science:* Inherently uncertain, often represented better by intervals/distributions.
      *   *Law/Policy:* Requires binary decisions (advisory vs. no advisory) and specific numbers (MCLs, action levels) for the record.
      *   *The "Dilation" Fear:* The user is worried that imprecise probability theory (IPT) makes things *more* uncertain upon gaining information. While technically true in specific IPT frameworks (like Walley's), in practical risk assessment, "dilation" is often a feature, not a bug—it signals that the new data isn't as informative as assumed. However, for a 1-day procedure, deep IPT theory is overkill. We need a *hybrid* approach: Use intervals for analysis, use a predefined decision rule for the binary output, and document the translation.

  3.  **Develop the Procedure (The "One-Day" Hybrid):**
      *   *Goal:* Bridge the gap between "thin science" and "hard legal record."
      *   *Step 1: Define the Hazard.* (Fact)
      *   *Step 2: Quantify Uncertainty.* (Fact/Analysis) - Instead of one number, generate a plausible range (Lower Bound Risk, Upper Bound Risk).
      *   *Step 3: Compare to Threshold.* (Fact) - Does the *entire* range sit above or below the policy threshold?
      *   *Step 4: The "Straddle" Check.* (Value/Judgment) - If the range crosses the threshold, we need a decision rule. This is where the "values wearing a lab coat" happen.
      *   *Step 5: Select the Record Number.* (Procedural) - How to derive the single number required by counsel without lying. (e.g., The Upper Bound rounded conservatively).
      *   *Step 6: Human Escalation.* (Governance) - If the decision rule itself is contested or the uncertainty is too vast (dilation), it goes to the Board/Director.

      *Refining the "Dilation" concern:* I need to address this in the prose. Dilation happens when you have sets of priors and likelihoods that aren't independent. In a regulatory context, we usually avoid strict Bayesian updating that causes pathological dilation. We use "Bounding Analysis." I should reassure the user that for their purpose, "dilation" is just "acknowledging the data didn't help as much as we hoped," which is honest, not a wreck.

      *Refining the "Single Number":* The trick is to report the *actionable* number (e.g., the Upper Confidence Limit used for regulation) but explicitly label it as "Conservative Estimate for Regulatory Purposes" in the footnotes, while the main text acknowledges the range.

  4.  **Drafting the Procedure Steps (Mental Check against JSON requirements):**
      *   Need `step`, `question`, `sufficient_answer`, `if_not_met`, `fact_or_value`, `hidden_judgment`.
      *   Need to ensure the flow makes sense.
      *   *Step 1:* Data Quality. (Fact)
      *   *Step 2:* Range Generation. (Fact/Analysis)
      *   *Step 3:* Threshold Comparison. (Fact)
      *   *Step 4:* Decision Rule Application. (Value) -> This is crucial.
      *   *Step 5:* Record Number Derivation. (Procedural/Value)
      *   *Step 6:* Sign-off. (Governance)

  5.  **Developing the Worked Cases:**
      *   *Case A (3 Rodent Studies):* Disagreement means wide interval. Likely straddles threshold. Decision rule (e.g., Maximin/Precautionary) triggers advisory. Analyst might think it's too conservative, but the rule dictates it.
      *   *Case B (Structural Analog):* User thinks negligible. But QSAR/Analog usually implies high uncertainty (Upper Bound could be high). If the procedure is precautionary (Upper Bound rules), it might trigger an advisory even if the Lower Bound is zero. This challenges the user's intuition.

  6.  **Addressing the "Cannot Do" List:**
      *   Cannot resolve scientific disagreement with math.
      *   Cannot eliminate the need for political accountability.
      *   Cannot prevent litigation over the decision rule chosen.
      *   Cannot make the single number "true" in a physical sense.

  7.  **Drafting the Prose:**
      *   Acknowledge the colleague is right about the *math*, but the user is right about the *constraints*.
      *   Explain the "Hybrid Bounding" approach.
      *   Address Dilation: It's not a bug, it's a warning light.
      *   Explain the "Single Number" trick: It's the *regulatory* number, not the *truth* number.
      *   Highlight the "Values in Lab Coat" moment (Step 4).

  8.  **Constructing the JSON:**
      *   Ensure valid JSON syntax.
      *   Match the requested keys exactly.
      *   Ensure `hidden_judgment` is boolean.
      *   Ensure `if_not_met` is one of the allowed strings.
      *   Fill in the worked cases based on the logic above.
      *   Fill `cannot_do` with honest limitations.

  9.  **Review and Refine:**
      *   *Self-Correction on Dilation:* Don't get bogged down in Walley's theory. Just explain that if new data widens the interval, it means the data is conflicting, and the procedure should escalate.
      *   *Self-Correction on Single Number:* Counsel needs *a* number. The procedure must specify *which* bound becomes that number (usually Upper Bound for protection) and require a disclaimer.
      *   *Tone Check:* Is it empathetic to the risk assessor's burden? Yes. Is it rigorous enough for the biostat colleague? Mostly, it validates their concern while providing a pragmatic workaround.
      *   *JSON Validation:* Check quotes, commas, brackets.

  10. **Final Polish:** (Proceeding to generate output based on these thoughts.)
answer: |-
  ### The Hybrid Bounding Procedure

  Your colleague is mathematically correct: thin science does not support point estimates. You are administratively correct: the law and the board require binary decisions and specific numbers. The tension between these two is not a scientific problem; it is a governance problem. You cannot solve it with better statistics, but you can manage it with transparent procedure.

  Regarding **dilation**: Your colleague is warning you that in strict Imprecise Probability Theory (IPT), learning new information can sometimes widen your probability interval rather than narrow it. This happens when the new data is ambiguous about which model is correct. In your context, this is not a bug; it is a feature. It means "this new study adds conflict, not clarity." The procedure below treats dilation as an escalation trigger, not a calculation error.

  To get a single number for the record without lying, you must distinguish between the **Scientific Estimate** (the interval) and the **Regulatory Value** (the single number). The Regulatory Value is derived from the Scientific Estimate using a predefined policy rule (e.g., "always use the 95% Upper Confidence Limit"). You report the Regulatory Value as the action trigger, but the text of the finding must explicitly state: *"This value represents the conservative bound of a risk range spanning X to Y, selected per Agency Policy Rule Z."* This satisfies counsel (there is a number) and truthfulness (the range is disclosed).

  The following procedure isolates where the science ends and the values begin. Step 4 is the critical juncture where you admit that the math cannot decide the case, so a policy rule must.

  #### The Procedure

  1.  **Define the Plausible Range:** Do not calculate a central estimate. Calculate a Lower Bound (best-case plausible risk) and an Upper Bound (worst-case plausible risk) based on the available data (rodent variance, epi CI, QSAR error).
  2.  **Compare to Policy Threshold:** Check if the entire range is below the action threshold, entirely above it, or straddles it.
  3.  **The Straddle Test:** If the range straddles the threshold, acknowledge that science cannot determine the outcome.
  4.  **Apply the Decision Rule:** Apply the agency's pre-approved risk attitude (e.g., Maximin/Precautionary = use Upper Bound; Hurwicz = weighted average). This is a value judgment, not a fact.
  5.  **Derive the Record Number:** Convert the result of Step 4 into the single number required for the legal record.
  6.  **Escalation:** If the uncertainty is so vast (dilation) that the Upper Bound triggers catastrophic action while the Lower Bound suggests zero risk, escalate to the Board. This is no longer risk assessment; it is risk management.

  ***

