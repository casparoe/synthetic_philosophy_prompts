answer: |-
  Any viable theory must explain why pain typically provides an immediate reason for avoidance without conflating the sensory sensation itself with the negative affective response it usually triggers.

  ### The Requirements List

  **1. The Asymbolia Constraint**
  *   **Case:** Patients with insula/cingulate damage who report intense pain sensation but zero distress or desire for it to stop.
  *   **Requirement:** The theory must allow for the logical and physical possibility of pain sensation without pain suffering.
  *   **Why Genuine:** This is not merely a conceptual edge case but a physical reality demonstrated by lesion studies; a theory that defines pain as inherently unpleasant contradicts empirical neuroanatomy where sensation and affect are dissociable pathways.

  **2. The Valence Flexibility Constraint**
  *   **Case:** Identical burning sensations are negative (tea spill), positive (chilli/massage), or neutral (asymbolia).
  *   **Requirement:** The theory must explain how the normative status (badness) of a sensation can flip based on context without requiring the sensory qualia to change.
  *   **Why Genuine:** If badness were intrinsic to the sensation like "sharpness" or "heat," context could not alter its value without altering the sensation itself; since the sensation remains phenomenally similar, the theory must locate "badness" outside the raw qualia.

  **3. The Non-Reportability Constraint**
  *   **Case:** Infants, non-human animals, and non-verbal patients exhibit pain behavior without linguistic capacity.
  *   **Requirement:** The theory cannot make the badness of pain dependent on higher-order cognitive judgments or linguistic reporting.
  *   **Why Genuine:** Pain is an evolutionary adaptation predating language; a theory requiring meta-cognition to constitute "badness" renders animal pain unintelligible and contradicts the biological function of nociception.

  **4. The Phantom Constraint**
  *   **Case:** Pain experienced in missing limbs where no tissue damage exists.
  *   **Requirement:** The theory must decouple the badness of pain from actual bodily damage.
  *   **Why Genuine:** Since the pain is real to the subject despite the absence of harm, "badness" cannot be defined strictly as a signal of current tissue destruction; it must account for central nervous system construction of the experience.

  **5. The Sensation vs. Aversion Distinction**
  *   **Case:** The difference between feeling a burn and wanting the burn to stop.
  *   **Requirement:** The theory must distinguish the descriptive content (what it feels like) from the motivational content (what it makes you do).
  *   **Why Genuine:** Collapsing these makes asymbolia logically impossible rather than empirically rare; preserving the distinction is necessary to explain why some pains are endured willingly (tattoos) while others are not.

  **6. The Badness vs. Mindedness Distinction**
  *   **Case:** A depressed or asymbolic patient who doesn't care about their pain versus a doctor who believes it should be treated.
  *   **Requirement:** The theory must separate whether pain is objectively bad for the subject from whether the subject currently minds it.
  *   **Why Genuine:** Clinical ethics relies on the premise that untreated pain is harmful even if the patient is indifferent; a theory that reduces badness solely to current dislike cannot justify intervention in asymbolia or severe depression.

  **7. The Neurobiological Constraint**
  *   **Fact:** Nociceptive signals (spinothalamic tract) are distinct from affective processing (anterior cingulate/insula).
  *   **Requirement:** The theory cannot posit a single, unitary "pain center" where sensation and suffering are generated identically.
  *   **Why Genuine:** Philosophical accounts contradicted by hard wiring are merely metaphorical; the mechanism of "badness" must map to the mechanism of affective processing, not just sensory transmission.

  **8. The Evolutionary Constraint**
  *   **Fact:** Pain is selected for because it teaches avoidance and protects integrity, not merely to punish.
  *   **Requirement:** The theory must explain why a phenomenon defined as "bad" is functionally useful and sometimes sought for growth (training/learning).
  *   **Why Genuine:** If pain were purely intrinsically bad without instrumental value, its retention by evolution would be paradoxical; the theory must accommodate the instrumental goodness of painful experiences.

  ### The Incompatible Pairs

  These are the tensions you will likely hit where satisfying one requirement forces you to violate another.

  **1. Intrinsic Badness vs. Valence Flexibility**
  *   **The Conflict:** If you claim pain is *intrinsically* bad (bad by virtue of what it feels like), you cannot explain the chilli/massage case without claiming the sensation is actually different (which contradicts phenomenology) or that the subject is irrational (which ignores the genuine enjoyment). If you claim pain is *extrinsically* bad (bad due to context/judgment), you struggle to explain why ordinary pain feels *immediately* and *passively* bad without conscious evaluation.
  *   **The Snag:** You must choose between pain being inherently awful (fails chilli case) or pain being neutral until judged (fails the immediate urgency of stepping on a tack).

  **2. Phenomenal Authority vs. Neural Dissociation**
  *   **The Conflict:** If you trust the subject's first-person report ("It hurts" implies "It is bad"), asymbolia breaks your theory because they say "It hurts" but "It isn't bad." If you trust the neural dissociation (sensation != affect), you undermine the first-person authority that usually defines phenomenal experience, implying the subject is wrong about their own pain.
  *   **The Snag:** You must choose between respecting the subject's word (fails asymbolia) or respecting the brain scan (fails introspective authority).

  **3. Motivational Imperative vs. Asymbolic Calm**
  *   **The Conflict:** If you define pain's essence as a command ("Stop this!"), then asymbolics are not feeling pain, which contradicts their report that the sensation is identical to normal pain. If you define pain's essence as a sensation, then the "badness" is an add-on module, which weakens the claim that pain *itself* is the problem rather than the reaction to it.
  *   **The Snag:** You must choose between pain being essentially motivational (fails asymbolia) or pain being essentially sensory (fails to explain why pain is uniquely bad compared to other intense sensations).
