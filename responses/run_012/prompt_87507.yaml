  The biggest mis-framing here is assuming Carnap wanted science to *make* decisions rather than *clarify* them. You're asking about ML planning as if Carnap would see it as an engine of determination, but his "scientific world-conception" was meant to eliminate metaphysical pseudoproblems so humans could decide freely and responsibly. He wouldn't view the algorithm as a ruler, but as a linguistic framework for testing consequences; the "choice" to use it remains a practical, ethical decision outside the scope of the logic itself.
