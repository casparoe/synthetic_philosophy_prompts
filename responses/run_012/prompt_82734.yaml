answer: |-
  I am writing to propose a eight-month part-time research project focused on a specific ambiguity in the philosophy of science that currently undermines how we evaluate scientific progress. The core of the proposal concerns Imre Lakatos's methodology of scientific research programmes, which remains one of the most influential frameworks for understanding how science changes over time. Lakatos argues that a research programme is progressive only if it predicts novel facts, meaning that when scientists patch up their theories to protect them from counter-evidence, those patches must entail something nobody expected. The problem is that Lakatos never precisely defined what counts as novel, and contemporary literature has settled into two competing readings that are often treated as interchangeable when they are not. The first reading is temporal: a fact is novel if it was not known when the theory was put forward. The second reading is heuristic or use-based: a fact is novel if the theory was not built specifically to accommodate it, which is a claim about the theorist's intent rather than the calendar. These two definitions come apart on the very historical cases the framework is usually sold with, such as the perihelion of Mercury, the discovery of the positron, or Prout's hypothesis, yet no one has systematically walked through these standard cases to see whether the two readings give the same verdict on which shifts were progressive. I intend to introduce and test a third reading, which I suspect is the correct one: a fact is novel for a programme when no move that the programme's positive heuristic licenses would have entailed it. This makes novelty relative to the programme's own public methodological recipe for patching the belt, rather than to dates or the private mental states of dead theorists. Part of the job will be arguing that this is not simply the second reading in new clothes, since the positive heuristic is a public object while what a theorist used is psychological. The central question driving this project is whether the choice among these three readings changes any historical verdicts or is merely a distinction without a difference.

  The existing positions leave this open because philosophers tend to assume that temporal novelty and use-novelty converge often enough that the distinction does not matter for the overall assessment of a programme's health. However, if they diverge on the key cases, then the judgment of whether a programme was progressive or degenerating depends entirely on which definition of novelty one silently adopts, which renders the framework unstable for historical analysis. My project will resolve this by treating the definitions as competing hypotheses and testing them against the canonical cases. Over the first two months, I will reconstruct the three definitions of novelty with precision, ensuring the distinction between the psychological reading of use-novelty and the structural reading of heuristic-licensed novelty is rigorous enough to withstand scrutiny. Months three through five will be dedicated to applying these three definitions to the standard historical cases found in the literature, specifically looking for instances where one definition classifies a fact as novel and another does not. This is the empirical core of the work, requiring close reading of the historical records to establish what was known when, what the theorists intended, and what the programme's rules actually licensed. In months six and seven, I will analyze the divergences to determine if they alter the final verdict on the progressiveness of the programmes in question. The final month will be reserved for writing up the results into a draft article.

  A real result for this project looks like a map of where the verdicts diverge, demonstrating that the choice of definition materially changes whether we classify a specific scientific episode as progressive or degenerating. If I can show that the heuristic-licensed reading saves the progressiveness of a programme that the temporal reading condemns, or vice versa, then I have established that the definition matters and that my proposed third reading offers a superior tool for historians of science. Conversely, the project would count as failing if I find that all three readings agree on every standard case, or if every disagreement turns out to rest on unknowable facts about what a particular theorist happened to know at a specific moment. If the distinctions collapse in practice, then the project confirms that the ambiguity is harmless but also that there is no work to be done in refining the concept, which would mean the proposed solution is unnecessary. I am confident that eight part-time months is enough to complete this work because the scope is tightly constrained to conceptual analysis and a fixed set of historical cases rather than open-ended archival research. The literature on Lakatos is mature enough that the reconstructions can be done efficiently, and the historical cases are well-documented, so the bulk of the time will be spent on analysis rather than data gathering. This timeline allows for a rigorous test of the hypothesis without overextending the resources available, ensuring that I can deliver a determinate answer on whether this philosophical distinction carries historical weight.
