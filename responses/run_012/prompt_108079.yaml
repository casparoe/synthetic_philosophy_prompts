      *   **Nash Bargaining Solution (NBS):** Satisfies PE, SYM, INV, and IIA. It *violates* Individual Monotonicity (IM).
      *   **Kalai-Smorodinsky Solution (KS):** Satisfies PE, SYM, INV, and IM. It *violates* IIA.
      *   **The Core Conflict:** The user suspects (4) IIA and (5) IM conflict. This is a known result in bargaining theory.
          *   *Theorem:* There is no bargaining solution that satisfies PE, SYM, INV, IIA, and IM simultaneously (for $n \ge 2$).
          *   *Specifically:* KS satisfies IM but fails IIA. NBS satisfies IIA but fails IM.
      *   **The INV vs. KS Concern:** The user worries about (3) INV and (6) KS because KS uses ratios (ideal point).
