prompt: |-
  I'm trying to write up my views on fair bargaining for a seminar and I want a consistency check before I make a fool of myself. Here's what I think a bargaining solution should satisfy: (1) Pareto efficiency, (2) symmetry, (3) invariance to positive affine transformations of the players' utility functions, (4) independence of irrelevant alternatives — if you shrink the feasible set but the solution point is still in it, the solution shouldn't change, and (5) individual monotonicity — if the feasible set expands so that player 1's maximum possible utility goes up for every fixed level of player 2's utility, then player 1 shouldn't end up worse off. I also think (6) the Kalai–Smorodinsky solution is the most intuitively fair one because it equalizes the proportional gains from the disagreement point, and I'd like to defend it. I have a nagging feeling that (4) and (5) can't both hold, and maybe (6) is doing something that makes (4) impossible, but I also wonder if (3) and (6) are in tension because KS is all about ratios. Can you tell me which of these actually conflict, which only look like they do, and what the cheapest revision would be if I have to drop something? I don't want a list of everything that's vaguely in tension — I want to know which pairs are genuinely incompatible, how bad each conflict is, and which single commitment I should give up to get the most consistency for the least cost.
