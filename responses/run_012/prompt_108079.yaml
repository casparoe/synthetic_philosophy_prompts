      *   *Recommendation:* Drop IIA (4).
      *   *Why is this the "cheapest"?* IIA is often criticized in bargaining contexts as being too strong or counter-intuitive (it implies that adding options far away from the solution shouldn't matter, but in bargaining, the *threat* of ideal points matters for KS). IM is generally considered more "fair" in dynamic or resource-expansion contexts. Since the user's goal is to defend KS, dropping IIA is necessary anyway.

