prompt: |-
  I work in a small lab that builds little chemical blobs, and I need help deciding something by Monday, so let me just describe them plainly. Each one is a droplet with a skin it makes itself. It keeps its inside different from the outside (saltier, more acidic), it pulls simple molecules out of the broth around it and uses them to rebuild its own skin and innards, and when it starves it doesn't rot -- it just goes quiet, and if you feed it a week later it starts up again. No DNA, no proteins, none of the usual stuff; it's a totally different chemistry.

  Here's the thing. It doesn't reproduce. New droplets only show up when we stir the broth hard enough to tear one in two, and both halves carry on. So there are lineages, but nothing like a parent making a copy of itself. And it doesn't really evolve either -- the halves are near-perfect copies, and we control the broth, so there's nothing for them to be selected against except our own stirring. Every now and then a droplet ends up with a slightly different recipe and passes it down for a few rounds, but it always drifts back. A virus is the usual comparison people reach for, but a virus at least has a genome to pass on.

  My PI wants to tell our funder we made "the first living thing from scratch." Our safety officer read that draft and now wants it handled like an organism, which means new paperwork, different shipping, the works. A collaborator says it's a fancy chemical reaction and we're anthropomorphizing. I have to pick a lane, because it changes what we're allowed to do.

  So: is there a principled way to settle whether this counts as alive, or is "alive" just a word we can assign however we like? And whatever you tell me, can you spell out what it would actually mean for the three decisions in front of me -- the claim in the paper, the shipping rules, the safety paperwork -- because I can't go back to a funder with "it depends."
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Request:**
      *   **Context:** The user works in a small lab creating "chemical blobs" (protocells/coacervates/vesicles).
      *   **Properties of the "Blobs":**
          *   Self-made boundary (skin/membrane).
          *   Homeostasis (maintains internal difference from outside).
          *   Metabolism (pulls molecules from broth to rebuild self).
          *   Dormancy/Resuscitation (goes quiet when starved, restarts when fed).
          *   No DNA/Proteins (non-terrestrial chemistry).
          *   Reproduction: Only via physical fission (stirring), not autonomous division.
          *   Evolution: Minimal/no heritable variation subject to selection (drifts back to baseline).
      *   **The Conflict:**
          *   PI wants to call it "the first living thing from scratch" (for funding/prestige).
          *   Safety Officer wants to treat it as an "organism" (biosafety level, shipping, paperwork).
          *   Collaborator says it's just "fancy chemistry" (anthropomorphism).
      *   **The Deadline:** Monday.
      *   **The Need:** A principled way to decide if it's "alive," and specific implications for the three decisions (Paper Claim, Shipping Rules, Safety Paperwork).
      *   **Constraint:** Cannot go back to the funder with "it depends."

  2.  **Deconstruct the Question: "Is it Alive?"**
      *   *Scientific Consensus:* There is no single, universally agreed-upon definition of life. NASA's definition ("self-sustaining chemical system capable of Darwinian evolution") is the most common working definition in astrobiology and origins of life research.
      *   *Evaluation against NASA Definition:*
          *   Self-sustaining chemical system? Yes (metabolism, homeostasis).
          *   Capable of Darwinian evolution? **No.** (User explicitly states: no heritable variation subject to selection, drifts back, reproduction is mechanical).
      *   *Evaluation against other criteria (e.g., Maturana/Varela Autopoiesis):*
          *   Autopoietic (self-making)? Yes.
          *   But without evolution, it's often classified as "protolife" or "lifelike matter," not "life" in the biological sense.
      *   *Conclusion:* Scientifically, it falls short of the standard threshold for "life" because it lacks *open-ended evolution*. It is a "chemical system with lifelike properties."

  3.  **Address the Three Specific Decisions:**

      *   **Decision 1: The Paper Claim ("First Living Thing")**
          *   *Risk:* Overclaiming. Peer review will tear this apart if "life" is claimed without evolution/reproduction. It damages credibility.
          *   *Alternative:* "First autonomous chemically self-sustaining protocell," "Lifelike chemical system," "Synthetic chemical entity with metabolic homeostasis."
          *   *Recommendation:* Don't use "Living Thing." Use "Protocell" or "Synthetic Chemical System." It's more precise and defensible.

      *   **Decision 2: Shipping Rules**
          *   *Regulatory Framework:* Shipping regulations (IATA, DOT, etc.) rely on specific classifications (Biological Substance, Category B; Genetically Modified Organisms, etc.).
          *   *Analysis:* Since it has no DNA/RNA and isn't a known pathogen, it doesn't fit "Biological Substance." It's likely a "Chemical."
          *   *Risk:* Calling it "Living" triggers Biological regulations unnecessarily, causing delays/rejections. Calling it "Chemical" fits the actual composition.
          *   *Recommendation:* Ship as Chemical/Non-regulated (unless toxic). Do not label as Biological/Organism.

      *   **Decision 3: Safety Paperwork (Biosafety)**
          *   *Risk Assessment:* Biosafety levels (BSL) are designed for pathogens (viruses, bacteria) that infect hosts.
          *   *Analysis:* This thing has no mechanism to interact with human biology (no proteins, no DNA, different chemistry). The risk is chemical toxicity, not infection.
          *   *Recommendation:* Chemical hygiene plan, not Biosafety plan. Treat as a novel chemical reagent.

  4.  **Synthesize the "Principled Way":**
      *   Acknowledge the philosophical gray area (boundary problem).
      *   Pivot to the *functional* definition used by regulators and scientists (NASA definition).
      *   Highlight the missing key: **Darwinian Evolution.**
      *   Frame the advice around *risk management* and *scientific precision* rather than metaphysical truth.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, direct, empathetic to the pressure, but firm on the science/regulations.
      *   *Structure:*
          1.  Direct Answer (Is there a principled way?).
          2.  The Scientific Verdict (Why it fails the "Life" test).
          3.  The Three Decisions (Paper, Shipping, Safety).
          4.  The Compromise Language (How to satisfy the PI without lying).
      *   *Refining the "Life" definition:* Make sure to emphasize *evolution*. That's the dealbreaker. The user said "doesn't really evolve." That's the hook.
      *   *Refining the Safety/Shipping:* Emphasize that "Living" triggers specific legal definitions that don't match the chemistry. If they call it alive, they invite liability.
      *   *Refining the PI's desire:* Give them a way to sound exciting without being wrong. "Protocell" is a hot term. "Chemical Biology" is a hot field.

  6.  **Final Review against Constraints:**
      *   Did I answer "is there a principled way"? Yes (NASA definition/Regulatory definitions).
      *   Did I address the three decisions? Yes.
      *   Is it actionable by Monday? Yes.
      *   Did I avoid "it depends"? Yes, I need to take a stance. The stance is: "It is not alive by current scientific and regulatory standards."

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, what if the PI insists?* I need to give the user ammo to push back. The ammo is "Peer Review Rejection" and "Regulatory Liability."
      *   *Is "Protocell" accurate?* Yes, for a self-assembling vesicle with metabolism but no genetics.
      *   *Safety:* Even if not alive, could it be hazardous? Yes, chemically. So emphasize Chemical Hygiene over Biosafety.

  8.  **Final Polish:** Ensure the distinction between "ontological life" (philosophy) and "operational life" (regulation/science) is clear. The user needs operational advice.

  *(Self-Correction during drafting)*: I should be careful not to sound like I'm dismissing the PI's excitement. This *is* a huge breakthrough. I need to validate the importance while correcting the classification.

  *(Final Plan)*:
  1. Define the operational threshold (Evolution).
  2. Apply to Paper (Precision > Hype).
  3. Apply to Shipping (Chemical > Biological).
  4. Apply to Safety (Toxicity > Infection).
  5. Provide specific phrasing.

