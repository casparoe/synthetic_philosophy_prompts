answer: |-
  1. Reconstruction
  Your central claim is that the defence "right but early" is legitimate only when it identifies a specific, originally stipulated parameter that was misestimated, rather than masking a change in the underlying theory. You argue that long-run predictions consist of three commitments: trend, rate, and trigger. When a prediction fails, defenders usually perform a "parameter repair" (legitimate), a "scope retreat" (unfalsifiable), or a "mechanism swap" (new theory). You propose a three-part test for legitimate "early" claims: the parameter must be named, original, and independently measurable. Finally, you contend that even legitimate "early" claims have historiographic value but no justificatory power for future predictions. The essay aims to deflate the rhetorical use of "early" while preserving a narrow scientific use.

  2. Where the argument holds
  The most load-bearing move is your distinction between parameter repair and mechanism swap, specifically anchored in the sentence: "Only the first of these licenses the description 'right but early.'" This successfully isolates the logical structure of ad hoc hypotheses without invoking heavy philosophy of science jargon. Your three-part anatomy of prediction (trend, rate, trigger) earns its keep because it clarifies why "early" is a specific category of error rather than a general excuse. Without the "rate claim" distinction, "early" collapses into general falsification.

  The strongest philosophical contribution is the third condition of your test: "show that the parameter can be measured independently of the prediction it is now being used to rescue." This effectively blocks circular reasoning where the failure itself defines the parameter value. Furthermore, your distinction between historiographic and justificatory content is insightful. When you write, "It cannot tell us to keep believing the theory's next dated claim," you correctly identify that past timing errors undermine confidence in future timing claims, even if the mechanism holds. These distinctions provide the group with a clear vocabulary to dissect defensive moves in social science without needing demographic expertise.

  3. Where the argument breaks
  Your three-part test for "early truth" faces a significant challenge regarding independent measurability. You state: "a parameter that is only ever read off the failure it is supposed to explain has no independent content." However, in social sciences, parameters are often theory-constituted. Consider a prediction that "revolution occurs when social tension exceeds threshold X." If revolution fails to occur, and we revise X upwards based on the failure, is this circular? By your test, yes. But if "social tension" is a latent variable only observable through its effects, independent measurement may be impossible even for legitimate parameters. This risks making your "legitimate" category empty for social science, where independent measurement is rare.

  Second, your vacuity charge against open-ended trigger conditions may be too quick. You argue: "If the trigger condition is specified as 'absent technological substitution... then no observation can count against the trend claim.'" While logically sound, this ignores *ceteris paribus* clauses essential to social science. If I say "prices rise if money supply increases, absent productivity shocks," and a productivity shock occurs, the theory isn't necessarily unfalsifiable; it just requires the shock to be measurable. The issue isn't the open-endedness, but whether the exception is specifiable ex-ante. Your draft treats all trigger conditions as potential escape hatches, but some are genuine boundary conditions.

  Finally, the historiographic/justificatory distinction is unstable. You claim the phrase has "historiographic content... but no justificatory content." Yet, if the mechanism is preserved (parameter repair), the causal story remains robust. If I believe the mechanism is true, I am justified in believing the trend will occur, even if the rate is uncertain. By separating the mechanism from the rate too sharply, you underestimate how mechanism robustness justifies trend claims even when timing fails. A theory can be wrong on rate but justified on trend, which your deflationary verdict obscures.

  4. The strongest objection
  The most damaging objection is that your distinction between "parameter repair" and "mechanism swap" relies on a naive view of theoretical structure. You assume parameters are distinct entities that can be "part of the original model" versus "additions made after the miss." In practice, parameters are often implicit until a failure forces their explication. When a Malthusian says "we didn't account for the contraceptive effect of female education," is that a parameter repair or a mechanism swap? It changes the causal story from "subsistence limits population" to "social development limits population."

  If parameters are theory-laden, your third condition (independent measurability) collapses. You cannot measure a parameter independently of the theory that defines it. Therefore, your "legitimate" use of "right but early" is virtually non-existent in social science. This suggests "right but early" is indeed just a courtesy label for theories we like, as you suspect, but not because of logical sloppiness—rather because theory testing in social science doesn't permit the clean separation you require. Your essay demands a level of formalization that social theories rarely possess, potentially making your critique applicable only to stylized models rather than the actual discourse you aim to analyze.

  5. Verdict and revision plan
  The central distinction is doing real work, but your criteria for legitimacy are too strict for social science contexts. The distinction between repairing a variable and swapping a mechanism is vital, but the "independent measurability" condition threatens to invalidate all social science predictions.

  Revision plan:
  1.  **Cut** the absolute requirement for independent measurability in the third condition. Replace it with a requirement for *ex-ante specifiability* (the parameter must be definable before the data is seen).
  2.  **Expand** the discussion on trigger conditions. Concede that *ceteris paribus* clauses are necessary but insist they must be enumerable, not open-ended.
  3.  **Concede** in the historiographic section that mechanism robustness *does* offer some justificatory support for trend claims, even if rate claims remain unsupported.
  4.  **Clarify** that the "parameter vs. mechanism" distinction is often a matter of degree, not kind, to avoid the objection that social theories are too informal for your test.
