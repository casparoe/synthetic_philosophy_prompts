          5.  Answering Q2 (Monetary vs Popular).
          6.  The Strongest Version & Action Plan.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I call the site lead wrong? *Correction:* Be nuanced. She's right about the risk, wrong about the conclusion (total avoidance).
      *   *Check:* Did I distinguish (a) and (b) clearly? *Correction:* Ensure I label (a) as *induced distortion* and (b) as *confounding/selection*.
      *   *Check:* Is the advice specific? *Correction:* Suggest "composite metrics" or "audit metrics."
      *   *Check:* Did I avoid hedging? *Correction:* Use bold verdicts. "This is false." "This is the one to keep."

  10. **Final Polish:** Ensure the philosopher persona shines through (talk about epistemic vs. ontic, proxy vs. construct) without becoming unreadable jargon. (e.g., use "construct validity" but explain it).

  *(Self-Correction on the "Nihilist Reading"):* I need to make sure I don't dismiss the site lead entirely. Her heuristic is valuable for *preventing* bad metrics, even if her conclusion (no metrics) is wrong. I will frame her usage as "Precautionary Principle" vs "Prohibition."

  *(Final check on constraints):* "Don't hedge everything into mush." "Tell me verdicts." Okay, I will be decisive.

