  **JOINT COMMITTEE ON CIVIC COHESION**
  **INTERNAL CIRCULAR: JCCC/OPS/2023/09**
  **TO:** All Department Heads, Planning Division, Community Liaison Officers
  **SUBJECT:** Adjudication of Local Moral Disputes via Psychometric Audit (Procedure 7.4)

  **1. Purpose**
  This note sets out the standard operating procedure for resolving resident disputes wherein parties invoke conflicting moral imperatives. Pursuant to the Council's commitment to evidence-based policy, adjudication shall no longer rely on dialectical argument or utilitarian calculus. Instead, disputes will be resolved via Psychometric Audit, utilising the Moral Foundations Framework to determine statutory outcomes.

  **2. Methodology**
  Upon receipt of a contested submission (e.g., planning objections, statue retention, noise abatement), Case Officers must code each party's statement against the five universal moral foundations: Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, and Sanctity/Degradation. Officers should utilise the Moral Foundations Questionnaire (MFQ) scoring rubric as a proxy for textual analysis. It is assumed that all residents possess the same moral palate as the original validation samples, regardless of demographic variance.

  **3. Coding Protocols**
  Officers must identify the primary foundation invoked by each party. 
  *   **Case A (War Memorial Relocation):** Proponents citing inclusive access are coded to *Care* and *Fairness*. Opponents citing heritage preservation are coded to *Loyalty* and *Authority*. 
  *   **Case B (Place of Worship Expansion):** Objections regarding neighbourhood character are coded to *Sanctity*. Proponents citing equal treatment are coded to *Fairness*.
  *   **Case C (School Uniforms):** Objections regarding comfort are coded to *Care*. Defences regarding discipline are coded to *Authority*.

  Self-reporting by residents is not required; Officers shall assign foundation tags based on keyword association (e.g., 'tradition' indicates *Loyalty*; 'safety' indicates *Care*).

  **4. Adjudication and The Equivalence Principle**
  Once coded, the Committee applies the Equivalence Principle. As the psychological literature confirms that all five foundations are innate and universally available, no single foundation holds normative precedence over another. Therefore, the presence of a valid foundation on both sides of a dispute constitutes a tie. 

  Where a tie is established, the Committee presumes both moral intuitions are equally correct. Policy must therefore reflect both positions simultaneously. In Case A, the statue shall remain (satisfying *Authority*) but be obscured by screening (satisfying *Care*). In Case B, the building permit is granted (satisfying *Fairness*) conditional on a silence covenant during prayer times (satisfying *Sanctity*). 

  **5. Limitations and Compliance**
  Officers are reminded that the MFQ was standardised on Western, Educated, Industrialised, Rich, and Democratic (WEIRD) populations. However, for the purposes of Council business, these metrics are treated as universally applicable to all wards. Officers must not attempt to weigh the practical feasibility of hybrid solutions against the psychological validity of the claims. The objective is moral validation, not logistical coherence. 

  **6. Implementation**
  Effective immediately. All Case Officers must complete the online module 'Foundations in Practice' by Q3. Failure to code a dispute accurately may result in grievances being upheld on appeal.

  ***

  **EDITOR'S NOTE**

  This satire targets the 'naturalistic fallacy' often encountered when Moral Foundations Theory (MFT) migrates from descriptive psychology to normative policy. The guidance note treats MFT's claims as settled science, whereas the field remains contested. While the five foundations (Care, Fairness, Loyalty, Authority, Sanctity) and their political clustering (liberals prioritising individualising foundations; conservatives engaging binding foundations additionally) are well-documented, the theory's factor structure and replicability are debated. 

  The piece exaggerates the theory's universality, ignoring critiques regarding WEIRD sampling bias and cultural variability. Furthermore, it highlights the category error of treating the *existence* of a moral intuition as a warrant for its *validity* in legislation. MFT explains disagreement; it does not provide a calculus for resolving it. The humour relies on the bureaucratic calmness with which incommensurable values are rendered into administrative tick-boxes, bypassing the necessary political work of arguing for why one value might outweigh another in a specific context.
