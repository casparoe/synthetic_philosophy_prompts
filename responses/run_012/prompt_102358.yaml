answer: |-
  Dear Professor,

  I am writing to submit my dissertation prospectus for your review and approval. As you know, our group has spent considerable time over the past year debating the status of the common prior assumption within the framework of interactive epistemology and decision theory. These discussions often become circular, revolving around whether the common prior assumption is a normative requirement of rationality, an empirical hypothesis about how agents actually form beliefs, or merely a convenient modeling idealization that facilitates tractability without making strong claims about the world. I have come to believe that the reason these debates stall is not because the question is inherently unresolvable, but because the participants are talking past one another due to a shared blindness regarding a more fundamental assumption that undergirds the agreement theorem. While everyone focuses on the probability distributions assigned to the states, few scrutinize the states themselves. My proposal is to shift the focus from the common prior assumption to the common state space assumption. I intend to argue that the common state space assumption is the actual load-bearing premise in agreement theorems, and that treating it as a mere modeling artifact rather than a substantive claim about rationality fundamentally alters the philosophical significance of the agreement result. This prospectus outlines the precise question I intend to answer, the reasons why existing treatments fail to address it, the methodological approach I will take to resolve it, the timeline for the work, and the boundaries I will set to ensure completion within the academic year.

  To understand the motivation for this project, it is necessary to first articulate the stalemate that currently defines the literature and our own group discussions. The standard interpretation of Aumann's agreement theorem is that if two agents share a common prior and have common knowledge of their posterior beliefs, then their posterior beliefs must be identical. The philosophical controversy almost exclusively targets the common prior assumption. On one side, there are the rationalists who argue that rationality itself demands a common prior, often invoking the Harsanyi doctrine that differences in belief must stem from differences in information rather than differences in reasoning or initial temperament. On the other side, there are the empiricists who point out that people clearly do start with different priors, suggesting the assumption is empirically false and thus limits the theorem's applicability to real-world disagreement. A third group, the instrumentalists, argues that the assumption is neither true nor false but is a useful fiction that allows us to model convergence without getting bogged down in the psychology of belief formation. The debate reaches an impasse because each side accepts the formal structure of the model while arguing over the interpretation of one parameter within that structure. They argue about the probability measure, but they do not argue about the sample space over which that measure is defined.

  My central insight is that the agreement theorem requires not only that agents assign probabilities to states in the same way, but that they are assigning probabilities to the same states. This is the common state space assumption. In standard models, we define a set of possible worlds, often denoted as omega, and we assume that all agents understand this set in the same way. They may have different information partitions, meaning they cannot distinguish between certain worlds that others can distinguish, but they all agree on what the possible worlds are. This assumption is rarely stated explicitly because it is baked into the definition of the model itself. When a modeler writes down a state space, they are imposing an ontology on the agents. They are deciding what counts as a possible world and what counts as a distinction between worlds. If agent A considers two scenarios to be distinct possible worlds, but agent B considers them to be the same world, the standard model cannot represent this without forcing one agent to be wrong about the ontology of the situation. By forcing them to share the state space, the modeler has already ensured a level of ontological agreement that may be doing more work than the probabilistic agreement.

  The precise question I propose to investigate is this: to what extent does the agreement theorem depend on the common state space assumption independently of the common prior assumption, and does the theorem retain its normative force if the common state space is treated as a modeling choice rather than a rationality constraint? I want to break this down into two determinate sub-questions. First, can we construct formal models where agents share a common prior over a shared domain of facts but operate with different state spaces, and if so, does agreement still hold? Second, if agreement fails in such models, is the failure due to a violation of rationality or merely a violation of ontological alignment? I am looking for a determinate answer in the sense that I want to produce a formal result showing either that the common state space assumption is reducible to the common prior assumption, or that it is independent and necessary for the agreement result. If it is independent and necessary, I further want to establish whether the requirement to share a state space is defensible as a norm of rationality or if it must be conceded as a modeling artifact. This distinction is crucial because if the requirement is merely a modeling artifact, then the agreement theorem tells us less about how rational agents should resolve disagreement and more about how modelers must structure their models to prove convergence.

  Existing treatments leave this question open because they conflate the ontology of the state space with the epistemology of the partitions. In the standard literature, the state space is treated as exogenous. It is the background against which knowledge and belief are measured. When authors discuss the common prior assumption, they are discussing the measure defined on the sigma-algebra of the state space. They do not discuss the construction of the sigma-algebra itself. There are positions in the literature that touch on this indirectly. For instance, some authors have discussed the problem of unawareness, where agents may not be aware of certain contingencies. However, the unawareness literature typically modifies the state space to include states of unawareness, thereby preserving a common universal state space that includes all possible states of awareness. This move effectively sweeps the problem under the rug by expanding the modeler's state space to encompass all possible agent state spaces, which reintroduces the common state space assumption at the level of the modeler rather than the agents. Other authors have argued that the state space represents the objective world, and thus rational agents must agree on it by definition. But this begs the question. If the state space includes descriptions of agents' mental states or linguistic formulations, then it is not obvious that rationality requires agreement on these descriptions. Two rational agents might carve up the world differently based on different conceptual schemes without either being irrational.

  The rationalist position on the common prior often relies on the idea that agents are Bayesian updaters starting from a common initial position. But this argument presupposes that they are updating over the same set of hypotheses. If agent A hypotheses are a subset of agent B's hypotheses, or if their hypotheses cross-cut each other in complex ways, the standard updating story breaks down. The empiricist position usually focuses on observed disagreement in priors, but this ignores the possibility that the disagreement stems from incompatible conceptual schemes rather than different probability assignments. The instrumentalist position is perhaps the most guilty of overlooking the state space issue, as it treats the entire model as a black box tool. If the tool works, the internal structure doesn't matter. But if the internal structure includes a hidden assumption that drives the result, the instrumentalist cannot claim the tool is neutral. By failing to distinguish between the common prior and the common state space, all three positions leave open the possibility that the agreement theorem is an artifact of ontological imposition rather than a theorem about probabilistic reasoning.

  My method for addressing this question will combine formal modeling with philosophical analysis. I cannot simply catalog what others have said because the literature has not explicitly separated these assumptions. I must construct the models myself to test the independence of the assumptions. The core of the work will involve defining a framework where agents have distinct state spaces. This is technically non-trivial because the standard definition of common knowledge relies on a meet of partitions defined over a single set. I will need to utilize frameworks from generalized probability theory or category-theoretic approaches to probability that allow for morphisms between different state spaces. Alternatively, I can model this by defining a universal state space and then mapping each agent's subjective state space to the universal space via a projection function, where the projection functions differ between agents. This allows me to simulate the effect of different state spaces while keeping the mathematical machinery manageable. I will then define a common prior over the universal space and examine whether the agents' posteriors agree on the intersection of their knowledge.

  The philosophical analysis will run parallel to the formal work. As I develop the models, I will need to interpret what it means for agents to have different state spaces. Does this represent a difference in language, a difference in conceptual granularity, or a difference in ontological commitment? I will need to argue whether rationality requires agents to align their state spaces before they can align their priors. If I can show that agents with a common prior but different state spaces fail to agree, I will then need to assess whether this failure is irrational. Is it irrational to have a different conceptual scheme? If not, then the agreement theorem loses its normative bite because it only applies to agents who have already agreed on the conceptual scheme. This would suggest that the hard work of agreement is done before the probabilistic updating begins, in the negotiation of the state space itself. This shifts the philosophical significance from a theorem about belief convergence to a theorem about ontological alignment.

  I have designed a timeline for this project that spreads the work across the academic year, allowing for iteration between the formal and philosophical components. In the first month, I will focus on refining the formal definitions. I need to settle on the specific mathematical framework for representing distinct state spaces. I will review the literature on unawareness and interactive epistemology with heterogeneous state spaces to ensure I am not reinventing the wheel, but I will focus on extracting the formal tools rather than the philosophical conclusions. I aim to have a working definition of a multi-space epistemic model by the end of the first month. In the second and third months, I will attempt to prove the core formal results. I will try to construct a counterexample to the agreement theorem in a multi-space setting where the common prior assumption holds but the common state space assumption does not. If I succeed in constructing such a counterexample, I will then spend the fourth month trying to see if the theorem can be rescued by adding a weaker condition than full state space identity. This might involve defining a common subspace or a mapping condition that preserves probability mass.

  During the fifth and sixth months, I will shift my focus to the philosophical interpretation of the formal results. I will draft the chapters that analyze the normative status of the state space assumption. I will engage with the rationalist, empiricist, and instrumentalist positions I mentioned earlier, showing how my results impact each. I will argue that the rationalist cannot easily claim state space alignment is a requirement of rationality without begging the question, and that the empiricist must acknowledge that ontological disagreement is a deeper source of conflict than prior disagreement. The instrumentalist will be challenged to explain why the model is useful if it relies on an unrealistic ontological assumption. In the seventh and eighth months, I will write the full draft of the dissertation chapters. I will integrate the formal proofs with the philosophical argument, ensuring that the technical details are accessible enough for the committee to follow but rigorous enough to hold up to scrutiny. I will spend the ninth month revising the draft based on feedback from you and other group members. The final three months of the year will be reserved for polishing the prose, checking the citations, and preparing for the defense. I have built in buffer time because formal modeling often encounters unexpected technical hurdles that require backtracking.

  It is important to be clear about what a successful result looks like for this project. Success does not necessarily mean proving that the common state space assumption is false or useless. Rather, success means providing a definitive account of its role. A positive result would be a formal proof showing that the agreement theorem fails without a common state space, even with a common prior, coupled with a philosophical argument demonstrating that the common state space assumption is not a plausible requirement of rationality. This would establish that the agreement theorem is not a theorem about rational belief convergence per se, but a theorem about rational belief convergence given ontological alignment. This would resolve the stalemate in our group by showing that the debate over the common prior is secondary to the assumption of a common ontology. Another form of success would be proving that the common state space assumption can be reduced to a specific form of the common prior assumption over a richer space. If I can show that differing state spaces are mathematically equivalent to differing priors over a universal space, then the debate collapses back into the common prior debate, but with greater clarity about what the prior represents. Either outcome provides a determinate answer to the research question.

  Conversely, I need to define what would count as project failure. The project would fail if I find that the distinction between common prior and common state space is mathematically trivial. For example, if it turns out that any model with different state spaces can be trivially embedded into a common state space without loss of generality, then my hypothesis that the state space assumption is doing independent work would be undermined. In that case, the common state space assumption is just a notational convenience, and the load-bearing assumption remains the common prior. Another failure condition would be if I cannot formulate the notion of different state spaces in a way that preserves the intuitive notion of agents disagreeing about the world. If the formalism becomes so abstract that it no longer maps to the philosophical concept of conceptual schemes or ontological disagreement, then the philosophical significance of the result is lost. I also consider it a failure if I cannot complete the formal proofs within the first half of the year, as this would leave insufficient time for the philosophical analysis and writing. To mitigate this risk, I have chosen a modeling approach that relies on finite state spaces initially, which are easier to manipulate, before generalizing to infinite spaces if necessary.

  I must also be honest about the scope of this project and what I will have to set aside to finish within the year. The most significant limitation is that I will not be addressing dynamic changes in the state space. My model will treat the state spaces as fixed for the duration of the interaction. In reality, agents might learn new concepts or refine their ontology over time. Incorporating dynamic ontology change would complicate the formalism significantly and would likely require a separate dissertation. I am treating the state space as static to isolate the effect of the initial assumption. I will also be setting aside the empirical testing of the hypothesis. While I argue that the common state space assumption is empirically dubious, I will not be conducting experiments to show how people actually carve up state spaces. My argument will be conceptual and formal, not experimental. This is consistent with the theoretical nature of our group, but it means my claims about empirical plausibility will rest on philosophical argumentation rather than data.

  Additionally, I will not be engaging deeply with the computer science literature on distributed systems, except where it overlaps with epistemic logic. Computer scientists have worked extensively on agreement problems with faulty agents and different views of the system, but their focus is usually on algorithmic convergence rather than the normative status of the assumptions. I will draw on their formal tools if useful, but I will not attempt to survey that field comprehensively. I will also limit my engagement with the psychological literature on framing effects. While framing effects are arguably a manifestation of different state spaces, the psychological mechanisms are beyond the scope of a decision theory dissertation. I will mention them as motivation, but I will not attempt to model the psychology of framing. Finally, I will not be addressing the issue of infinite regress in state spaces. If agents have different state spaces, do they need a common state space to agree on that fact? This leads to potential regress problems that are interesting but tangential to the main question of whether the first-order state space assumption is load-bearing. I will acknowledge this issue in the conclusion but will not attempt to solve it.

  The significance of this project extends beyond the specific mechanics of the agreement theorem. If I am correct that the common state space assumption is the hidden driver of agreement results, this has implications for any field that uses interactive epistemology. In economics, it suggests that market convergence results may depend on traders sharing a common understanding of what assets exist, not just on their expectations of value. In political science, it suggests that polarization may persist not because people have different priors about the same facts, but because they are operating in different factual universes. In philosophy, it challenges the notion that rationality is solely about coherence of belief, suggesting that coherence of ontology is a prerequisite. By isolating this assumption, I hope to provide a clearer map of where rationality ends and modeling convention begins. This aligns with the broader goal of our department to clarify the foundations of decision theory rather than simply applying existing models.

  I am aware that this project requires a high degree of technical proficiency in epistemic logic and measure theory. I have taken the relevant coursework during my first year, including the advanced topics seminar on interactive epistemology, and I feel confident in my ability to handle the formalism. However, I anticipate that the hardest part will be finding the right level of abstraction for the state space mismatch. If the mismatch is too severe, the agents cannot communicate at all, and the question of agreement becomes moot. If the mismatch is too slight, it reduces to the standard model. I will need to find the sweet spot where agents can communicate but still disagree on the underlying ontology. I plan to test this by running small examples during the first month to ensure the framework is viable before committing to the full proof. I will also rely on your guidance during our monthly meetings to ensure I am not getting lost in technical details that do not serve the philosophical argument.

  One potential objection you might raise is that the common state space assumption is so fundamental that questioning it undermines the possibility of formal modeling itself. If agents do not share a state space, can we even model them as interacting? My response to this is that we can model the interaction from the perspective of an external observer who sees both state spaces, even if the agents do not share them. The modeler's state space can be the union or product of the agents' state spaces. The question is whether the agents' internal perspectives converge, not whether the modeler can describe them. This distinction between the modeler's ontology and the agents' ontology is key to my proposal. I am not suggesting that modeling is impossible without a common state space, but rather that the common state space assumption in the standard model conflates the modeler's view with the agents' view. By separating them, we can see what work each is doing.

  Another objection might be that this is merely a semantic issue. If agents disagree on the state space, can we not just say they have different priors over a larger space? I address this in the scope section, but it is worth reiterating here. If we expand the space to include all possible conceptual schemes, the common prior assumption becomes much stronger. It requires agents to agree on the probability of every possible conceptual scheme being the correct one. This is a much heavier burden than agreeing on the probability of events within a shared scheme. Therefore, the shift is not merely semantic; it changes the substantive requirements of the common prior assumption. By making the state space explicit, we reveal the hidden costs of the common prior assumption. This is why the project is not just a technical tweak but a substantive philosophical intervention.

  I believe this project is feasible within the year because it focuses on a single, sharp question. I am not attempting to rewrite the foundations of game theory. I am attempting to isolate one assumption within a specific theorem and evaluate its contribution. The month-by-month plan is aggressive but realistic given the scope limitations I have set. I have prioritized the formal proof in the first half of the year because if the formal result does not hold, the philosophical argument collapses. This risk management strategy ensures that I will have a result to discuss even if the philosophical implications are more modest than I hope. I am also committed to writing continuously throughout the year, rather than waiting until the end. I plan to produce draft sections after each major milestone, such as after completing the formal definition and after completing the counterexample. This will allow you to provide feedback on the direction of the argument before I am too invested in a particular path.

  In conclusion, I propose to investigate the role of the common state space assumption in the agreement theorem, arguing that it is a distinct and potentially more significant assumption than the common prior. By separating these assumptions, I aim to resolve the stalemate in the literature regarding the status of the common prior and to clarify the philosophical significance of agreement results. I believe this work will make a valuable contribution to the field by exposing a hidden premise in a foundational theorem. I am eager to begin this work and look forward to your feedback on this prospectus. I am available to discuss any aspect of this proposal at your convenience, particularly regarding the technical approach to modeling distinct state spaces, as I want to ensure I am using the most robust formalism available. Thank you for your time and mentorship.

  Sincerely,

  [Your Name]
