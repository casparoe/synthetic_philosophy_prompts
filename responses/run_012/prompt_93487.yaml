answer: |-
  ### Setting the bar

  For genuine cognitive penetration, a high-level mental state must directly alter the phenomenal character of perceptual experience itself—not merely influence what we attend to, remember, or judge after the fact. We must distinguish this from attention, which selects data without changing sensory quality; post-perceptual judgment, where the look stays constant but classification shifts; and memory completion, where gaps are filled without changing raw input. Crucially, penetration requires the cognitive state to be causally responsible for the sensory change. The test is whether subjects with identical inputs but different cognitive states report distinct visual experiences, not just different interpretations. If the "raw look" remains invariant despite conflicting knowledge, penetration has failed. This bar excludes mere shifts in confidence or verbal labeling.

  ### Tiered Evidence for Cognitive Penetration

  | Case | Tier | Justification |
  | :--- | :--- | :--- |
  | (1) Optical illusion (lines equal but look different) | Clearly a different phenomenon | This classic illusion demonstrates perceptual impenetrability, where explicit knowledge fails to alter the sensory experience. |
  | (2) Banana color in dim light | Suggestive but contestable | Memory color effects suggest knowledge influences appearance, but low-level associative learning could explain the shift without high-level cognition. |
  | (3) Radiologist seeing fracture | Strong evidence | Expertise here likely alters the perceptual organization of noisy data, making the fracture visually salient rather than inferred. |
  | (4) Word "bread" priming blurry picture | Probably not penetration | This likely reflects post-perceptual hypothesis testing or decision bias rather than a change in the visual image itself. |
  | (5) Bird discrimination after learning | Suggestive but contestable | While the look changes, this may reflect refined sensitivity (learning) rather than direct cognitive penetration by belief. |
  | (6) Fear making shadows creep | Probably not penetration | Emotional arousal often narrows attention or alters physiological state rather than changing the intrinsic look of the shadows. |
  | (7) Language label affecting color look | Suggestive but contestable | Linguistic relativity may shift color phenomenology, but results are inconsistent and often attributed to response bias. |
  | (8) Word dissolving into marks (satiation) | Clearly a different phenomenon | This is neural adaptation (satiation), a physiological fatigue effect unrelated to cognitive belief. |

  ### Where the tiers are doing the work

  The most difficult placements involved distinguishing perceptual learning from cognitive penetration. Cases (3) and (5) sit on the boundary: does expertise rewire early vision (penetration) or merely refine sensitivity (learning)? I placed them higher based on the assumption that expertise involves cognitive frameworks, but this is contested by modularists who view them as bottom-up tuning. Similarly, (2) and (7) hinge on whether color appearance shifts are truly phenomenal or merely decisional biases; I treated them as suggestive because subjective reports of "looking different" are notoriously hard to verify against response criteria. Case (6) was also tricky; fear could alter phenomenology, but it often correlates with physiological arousal and attentional narrowing rather than pure cognitive belief. Case (1) was straightforward but vital, as it demonstrates the limits of penetration, while (8) is clearly neural adaptation unrelated to belief. The primary tension lies in trusting first-person phenomenology: without objective measures of "look," distinguishing a changed experience from a changed judgment remains the field's central methodological hurdle. Consequently, the "Suggestive" tier is the most crowded because it contains phenomena where methodology struggles to isolate cognition from sensory processing.

  ### Bottom line

  While cognition undoubtedly influences what we notice and how we judge, the intuition that beliefs rewrite the raw sensory "look" survives only in narrow, contested pockets like expertise. Most everyday instances of "seeing what we expect" are better explained by attention or post-perceptual interpretation than by genuine perceptual penetration. Thus, the strong version of "seeing is believing" largely collapses, leaving only a weak influence where high-level states subtly tint phenomenological character.
