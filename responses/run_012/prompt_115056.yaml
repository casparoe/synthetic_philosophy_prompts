      *   *Machine:* Actually, the machine case is tricky. If the radiologist reads the scan, that's *pratyakṣa* (of the image) + *jñānalakṣaṇa* (of the tumor). If the *machine* flags it, and she trusts it, that's *śabda*. The prompt asks where the *machine's read-out* lands. I should distinguish between the machine generating the image vs. the machine generating a diagnosis. I'll assume "read-out" means a diagnostic output. That's testimony.

  10. **Final Polish:** Check constraints. "One line on which way it pushes." "Sum to 1." "Real number."

      *   *Distribution:* P: 0.55, A: 0.35, U: 0.02, S: 0.03, None: 0.05.
      *   *Decomposition:* Keep it tight.
      *   *Sensitivity:* Focus on *jñānalakṣaṇa*.
