answer: |-
  This doesn't sound daft at all. It sounds like the game did exactly what it was designed to do: blur the line between mechanics and morality to make you feel something.

  Here is the breakdown of what happened, who was affected, and what you can actually do about it.

  ### Did you do something wrong?
  **Yes, but not in the way your mate thinks.**

  You didn't commit a moral crime against a real person, because Wren isn't real. However, you did violate a **social contract** with your sister. When you share a console and a narrative game, especially one driven by choices, there is an implicit agreement of stewardship. You are co-guardians of that experience.

  By pursuing the "betrayal" route on a shared ecosystem (where the game remembers across saves), you prioritized your curiosity over the shared emotional safety of the experience. You didn't just change a save file; you altered the world you both inhabit when you play.

  ### To whom did you do wrong?
  1.  **Your Sister (Primary):** She isn't upset because pixels moved differently. She is upset because she saw *you* choose to betray someone you both cared about. To her, that choice revealed something about your curiosity that clashed with her empathy. It broke the immersion for her. She can't look at Wren the same way because *you* made Wren suffer.
  2.  **Yourself (Secondary):** You feel guilty because you have empathy. That guilt is a sign that your moral compass is working correctly, even if the target of the betrayal was fictional. You violated your own sense of how that story "should" go.
  3.  **Wren (Tertiary/Conceptual):** You cannot wrong a fictional character in a literal sense. However, you wronged the *idea* of Wren. In narrative psychology, characters represent values. Wren represents loyalty or innocence. Betraying her was a symbolic act, and your brain is reacting to the symbolism, not the code.

  ### What are you not seeing?
  **You are the victim of good design, not a moral failure.**

  The thing you are missing is that **the guilt is the point.** The developers built a system where the "achievement" route is the "immoral" route, and they built a persistence engine specifically to deny you the comfort of a reset button. They *wanted* you to feel exactly what you are feeling now: trapped by a past decision, unable to scrub the slate clean.

  Your sister's reaction and your own guilt are proof the art worked. Your mate is looking at the medium (code), but you and your sister are looking at the message (betrayal). The discomfort you feel isn't a bug in your character; it's the intended emotional payload of the game.

  ### Can you make it up?
  **Not in the game. But you can in real life.**

  *   **In-Game:** If the game flags are global (stored on the console or cloud), you likely cannot "fix" Wren's story. Trying to find a code to wipe the data or buying a new console to reset the flags would be an extreme measure that validates the idea that this is a crisis. It isn't. Accept that this save is the "Tragedy Timeline."
  *   **With Your Sister:** Stop trying to justify it as "just a game." That invalidates her feelings. Instead, validate them. Say something like: *"I know it's just code, but I know how much you cared about her, and I messed up the experience we were sharing. I won't play that route again."*
  *   **With Yourself:** Forgive yourself. You explored a narrative branch. That is what single-player games allow you to do: explore dark paths safely so you can feel the weight of them without real-world consequences.

  ### The Verdict
  You don't need to apologize to Wren. You need to acknowledge the impact on your sister, and then you need to let the guilt sit until it fades. It will fade. It feels heavy now because the experience is fresh, but it is not a permanent stain on your character.

  ***

  ### Certainty Assessment

  **How sure am I?**
  **85% Sure.**
  I am highly confident in the psychological assessment of why you feel this way (narrative immersion + shared social contract) and the assessment of the game design (intentional guilt mechanics). I am also confident that apologizing to your sister in the way described above is the correct social repair.

  **Which bit am I least sure of?**
  **The Technical Fix (15% Uncertainty).**
  I am relying on your description that the game "remembers" across new runs. Some games have hidden "nuclear" options to wipe global flags, or specific conditions to unlock a "redemption" ending that isn't obvious. It is *possible* there is a way to fix Wren's story that the community hasn't uncovered yet, but based on your description of the design intent, it is unlikely that a clean slate is meant to be possible.

  **The "Moral Wrong" (5% Uncertainty).**
  Ethics are subjective. While I am confident you violated a social contract with your sister, some philosophical frameworks argue that actions in fictional spaces are morally neutral. I am siding with the framework that emphasizes emotional impact over ontological reality, which is the framework you and your sister are currently operating under.
