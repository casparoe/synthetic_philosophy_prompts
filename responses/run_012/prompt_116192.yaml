  so this'll sound daft but my sister and I share a Switch and we've both been playing this story game, the kind where you make choices and there's a little crew of characters who travel around with you. One of them, a girl called Wren, is the heart of the whole thing. My sister is obsessed with her. Honestly I am too.

  On my own save I went down a route where you can hand Wren over to the people who've been chasing you. The game definately wants you to — there's an achievement, the loading screens keep hinting that this is where the story gets good, and I was curious, so I did it. It isn't a clean quick death either, she works out what you've done and then you have to keep playing for another hour with her sat in the back of the van.

  The part that's messing me up is the game remembers. Start a new run and she still has lines about it — the devs built it so the characters carry what you did last time with them. So there's no clean slate, I can't just start over and pretend it didn't happen. My sister watched me do it and she's genuinely upset, not "you wrecked my save" upset, more "you did that to her." She won't touch the game now. And I keep catching myself wanting to say sorry to a character in a video game, and then feeling like an idiot.

  My mate says my sisters being dramatic, it's a cutscene, none of it happened to anyone. But that doesn't sit right either — if none of it happened to anyone, why is it still sitting with me. What I want to know is whether I actually did something wrong, and if so to who: Wren, my sister, or just me. And is there anything I can do now that would count as making it up? Restarting feels like a lie when the game won't let me forget, and apologising to a fictional person feels mad, but "it's only pixels" doesn't cover it either. Tell me what I'm not seeing. And please say how sure you are about your answer, and which bit you're least sure of.
