answer: |-
  Here is a precise formulation of an ethic based on your seven cases, followed by the stress tests and the analysis you requested.

  ### The Principle of Fiduciary Stewardship

  You are not borrowing the dead; you are stewarding their memory. A loan implies return; stewardship implies a duty of care to the asset while it is in your possession. The asset is not the person, but the *truth-claim* attached to their name.

  **Clause 1: The Law of Continuity**
  Invention is permissible in the gaps of the record, provided it does not contradict the documented ethical trajectory or relational tone of the subject.
  *   *Motivated by:* **Case 1** (Permissible invention consistent with print positions) and **Case 2** (Forbidden invention contradicting letter tone).
  *   *Cost:* You cannot make a pacifist pull a trigger, even in private, unless the record suggests a breaking point. You cannot make a loving brother cruel, even in an unwitnessed room.

  **Clause 2: The Sovereignty of Silence**
  Silence is not a vacuum; it is a boundary with a history. When silence is the result of systemic erasure (powerlessness), invention is restorative and required. When silence is the result of historical obscurity (privacy), invention is extractive and forbidden.
  *   *Motivated by:* **Case 7** (Enslaved man/Parish woman: silence via erasure = Required invention) and **Case 5** (Shopkeeper: silence via obscurity = Forbidden invention).
  *   *Cost:* You must diagnose *why* the record is silent before you fill it. You cannot treat the silence of the marginalized the same as the silence of the unnoticed.

  **Clause 3: The Public Sphere Waiver**
  Subjects who sought, achieved, or were thrust into public significance surrender the right to factual privacy regarding their personal conduct. Private subjects retain a right to factual dignity regardless of audience size.
  *   *Motivated by:* **Case 3** (Famous Victorians: Public waiver = Permitted speculation) and **Case 5** (Shopkeeper: Private retention = Forbidden defamation).
  *   *Cost:* You must accept that famous people become cultural property, while nobodies remain sovereign citizens of the past. This explains your flinch in Case 3 (it feels invasive) versus your sharp rejection in Case 5 (it feels like bullying).

  **Clause 4: The Transparency Mandate**
  Structural alterations to the record (composites, chronology shifts) must be disclosed to the reader. The reader is a co-steward of the truth and cannot be misled about the architecture of the narrative.
  *   *Motivated by:* **Case 4** (Composite women: Permitted only with disclosure).

  ---

  ### Three New Verdicts

  Here are three cases not in your list, applied against the Principle of Fiduciary Stewardship.

  **Case A: The Living Descendant**
  A novel depicts a famous historical figure accurately, but portrays their living grandchild (a minor character, real name used) as emotionally abusive, based on no public record.
  *   **Verdict:** **Forbidden.**
  *   **Reasoning:** This violates the *Public Sphere Waiver*. The grandchild has not entered the public sphere. While the famous ancestor has waived privacy, the waiver does not extend to living relatives who have not consented to the narrative. The harm here is to the living, which outweighs the novelist's license.

  **Case B: The Humanizing Lie**
  A novel about a documented tyrant (genocidal record) invents a specific scene where he weeps over a dead pet to "complicate" him, for which there is no evidence.
  *   **Verdict:** **Forbidden.**
  *   **Reasoning:** This violates the *Law of Continuity*. While it does not contradict the *evil* of the record, it contradicts the *documented persona*. If the record describes a sociopath, inventing empathy is a breach of stewardship. It is an attempt to steal the reader's sympathy under false pretenses.

  **Case C: The Breaker (Victim as Perpetrator)**
  A novel takes an obscure, real-life victim of a crime (name in police logs, no descendants) and depicts them as the *perpetrator* of that crime to create a twist ending. No one is alive to be hurt.
  *   **Verdict:** **Forbidden.**
  *   **Reasoning:** This breaks the *Sovereignty of Silence*. The silence here is obscurity (Case 5), not erasure (Case 7). Flipping victim to perpetrator is not restorative; it is a desecration of the only truth the subject possesses. It uses the dead purely as a plot device.
  *   **Why this breaks the principle:** If you follow the *Public Sphere Waiver* strictly, one might argue an obscure person is "fair game" if no one is hurt. But the *Sovereignty of Silence* protects them. This case forces you to choose between "No Harm, No Foul" and "Dignity of the Dead." The principle chooses Dignity.

  ---

  ### The Sacrifice: Which Verdict Must Go?

  You asked which of your seven verdicts the principle cannot accommodate and which you should surrender.

  **You must surrender Case 6.**

  *The Case:* A novel gives a real colonial administrator, on record as having done considerably worse, one specific invented atrocity, while omitting the documented ones.
  *Your Verdict:* Nearly fine.
  *The Principle's Verdict:* **Forbidden.**

  **Why:** Case 6 violates the *Law of Continuity* and the *Transparency Mandate*. Even if the subject is morally compromised, inventing a *specific* atrocity is an act of defamation that corrupts the historical record permanently. It conflates *moral truth* (he was bad) with *factual truth* (he did this specific thing).

  If you allow Case 6, you grant yourself the power to adjudicate history based on "vibes" of guilt. If the record says he did "considerably worse," use the documented atrocities. Inventing a new one suggests the documented ones weren't enough for your narrative, which is a failure of imagination, not an ethical license. It sets a precedent that allows novelists to lie about villains, which eventually erodes the reader's trust in the novel's truths about victims (Case 7).

  Surrendering Case 6 costs you a convenient plot device. It forces you to do the harder work of making the *documented* evil dramatic enough to carry the story.

  ---

  ### The Borrowing Metaphor: An Autopsy

  You asked if the borrowing metaphor does any work, or if it is a euphemism.

  **It is a euphemism.**

  Borrowing implies a contract between two consenting parties where the item is returned in its original state.
  1.  **No Consent:** The dead cannot sign the loan agreement.
  2.  **No Return:** You do not return the character. You consume them. Once your book is published, the fictional version of the astronomer exists forever alongside the real one. You have altered the asset, not borrowed it.
  3.  **No Collateral:** If you default (write a bad book), the lender (the dead) cannot repossess.

  **If the debt is real, who holds it?**
  The debt is not held by the dead. They are beyond harm. The debt is held by **the Living Reader** and **the Future Record**.
  *   **The Reader:** They trust you to distinguish between what happened and what you made up. When you blur that line without stewardship (Case 6), you defraud the reader.
  *   **The Record:** History is a collective ledger. When you insert a specific lie (even a "truthful" one), you pollute the water for the next historian or novelist.

  **What discharges the debt?**
  1.  **Fidelity:** Adhering to the *Law of Continuity*.
  2.  **Disclosure:** Adhering to the *Transparency Mandate* (Author's Notes, Afterwords).
  3.  **Restitution:** Ensuring that if you take a life to tell a story, the story honors the complexity of that life (Case 7) rather than using it as fuel (Case 5).

  **Does it matter that the debtor cannot correct the ledger?**
  Yes. It matters immensely. Because they cannot correct you, your duty is higher, not lower. You are the only one standing between the person and the caricature.

  **Who is wronged?**
  *   **In Case 2 (The Sister):** The *Record* is wronged. You have created noise that obscures the signal of their actual relationship.
  *   **In Case 5 (The Shopkeeper):** The *Dignity of the Subject* is wronged. Even without descendants, a human life is not a prop.
  *   **In Case 3 (The Victorians):** The *Living Descendants* are potentially wronged, but the *Public Trust* absorbs the blow because the subjects entered the arena.
  *   **In Case 6 (The Administrator):** The *Truth* is wronged. You have traded fact for effect.

  **Do these come apart?**
  Yes. In Case 7 (The Enslaved Man), the *Record* is wronged by silence, so you must wrong the *Fact* (by inventing) to right the *Dignity*. Here, harming the factual record is the only way to serve the human subject. This is the only case where lying (invention) is an ethical imperative. In all other cases, lying serves the author. In Case 7, it serves the subject.

  ### Final Recommendation

  Adopt the **Principle of Fiduciary Stewardship**. It costs you the convenience of Case 6 (invented atrocities for villains). It validates your flinch in Case 3 (it is permitted, but the cost is the discomfort of knowing you are using public property). It sharpens your rejection of Case 5 (obscurity is a shield, not an invitation).

  Stop thinking of it as a loan. You are not a bank; you are a monument builder. Ensure the stone you carve bears a resemblance to the person, or label it clearly as allegory.
