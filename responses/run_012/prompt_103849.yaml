answer: |-
  This is a profound question that cuts directly to the heart of formal epistemology and the philosophy of mathematics. You have identified the tension between the **necessity of mathematical truth** and the **contingency of mathematical knowledge**.

  You are describing the **Problem of Logical Omniscience**, but specifically as it manifests in the phenomenology of mathematical practice. The standard Bayesian model assumes that if a proposition is a logical truth, a rational agent assigns it probability 1. Since mathematicians assign probabilities $<1$ to conjectures (and even to lemmas they haven't fully checked), standard Bayesianism fails to model us.

  There isn't one single settled term, but the literature clusters around a few concepts. I will walk you through the existing landscape, diagnose why your intuitions about the "constraints" are fighting the formalism, and then propose a precise terminology to capture the state you are in.

  ### 1. The Existing Landscape: Logical Uncertainty

  The most direct term for what you are experiencing is **Logical Uncertainty**.

  In formal epistemology and AI safety (e.g., work by Garrabrant, Easwaran, Fitelson), this distinguishes uncertainty about the world (empirical) from uncertainty about the consequences of information you already hold (logical).
  *   **Empirical Uncertainty:** "Is there a cat on the mat?" (The world could be otherwise.)
  *   **Logical Uncertainty:** "Is there a contradiction in ZFC?" (The truth is fixed, but I cannot compute it.)

  However, "Logical Uncertainty" is often used technically in computer science. In philosophy, this is usually discussed under the header of **Non-Omniscient Bayesianism** or **Bounded Rationality**.

  **Why your "70%" wasn't wrong:**
  You are correct that your prior credence wasn't "false." In the literature, this is often framed as a distinction between **Ontic Probability** (chance in the world) and **Epistemic Probability** (degree of warrant). Since mathematical truths have no ontic chance (they are necessary), your 0.7 was purely a measure of **Epistemic Warrant**.
  When the proof arrives, the warrant becomes maximal. The prior 0.7 was an accurate measure of the warrant *available at that time*. It wasn't tracking the truth of the proposition (which was fixed at 1); it was tracking the **accessibility of the proof**.

  ### 2. The "Constraint" Problem (Why $P(A) \cdot P(A \to B)$ feels wrong)

  You noted: *If I say A is 70% likely and A→B is 90% likely, I seem committed to B at roughly 60%+, but that feels wrong.*

  This is the crux of the issue. In standard probability theory, if you assign $P(A)=0.7$ and $P(A \to B)=0.9$, you are indeed vulnerable to a **Dutch Book** (a set of bets that guarantees a loss) if you assign $P(B) < 0.6$.

  **Why it feels wrong:**
  It feels wrong because you are treating logical implication ($A \to B$) as if it were a contingent causal link. In mathematics, $A \to B$ is either necessarily true (1) or necessarily false (0). By assigning it 0.9, you are admitting you haven't fully verified the logical link.
  The discomfort arises because standard probability calculus assumes **Logical Omniscience**. It assumes that if $A \vdash B$, then $P(B) \ge P(A)$.
  *   **Ideal Agent:** Knows $A \vdash B$. Assigns $P(A \to B) = 1$. Therefore $P(B) \ge 0.7$.
  *   **You (Bounded Agent):** Suspects $A \vdash B$. Assigns $P(A \to B) = 0.9$.

  The "over-constraint" you feel is the friction between **Ideal Rationality** (which demands coherence across all logical consequences) and **Bounded Rationality** (which only demands coherence across consequences you have actually computed).

  If $B$ can be proved independently of $A$, your evidence for $B$ might be strong even if your evidence for $A$ is weak. But if you *also* believe $A \to B$ with high confidence, you *are* logically committed to updating $B$ based on $A$. The intuition that you shouldn't be is a heuristic warning that you probably don't actually believe $A \to B$ as strongly as you think, or you suspect a hidden independence that contradicts the implication.

  ### 3. Coining the Term: **Pre-Deductive Warrant**

  While "Logical Uncertainty" is the technical term, it feels too cold for the phenomenological state you're describing—the feeling of "smart money" on a conjecture. I propose we refine this to **Pre-Deductive Warrant** (or **Plausible Credence**).

  Here is the definition and its edges:

  **Definition:**
  **Pre-Deductive Warrant** is a rational degree of belief assigned to a necessary proposition, grounded not in frequency or propensity, but in the **heuristic reliability of the methods** that have so far failed to refute it.

  **How it differs from Ordinary Bayesian Belief:**
  1.  **Object of Belief:** Ordinary belief tracks *truth*. Pre-deductive warrant tracks *provability* (or *assertibility*). You aren't betting that the Riemann Hypothesis is "true" in a contingent sense; you are betting that a proof *exists* and is *findable*.
  2.  **Collapse Condition:** Ordinary belief updates continuously. Pre-deductive warrant **snaps**. It is discontinuous. When a proof is found, the warrant doesn't just go to 1; the *category* of the belief changes from inductive to deductive.
  3.  **Coherence Requirements:** Ordinary belief demands strict probabilistic coherence (no Dutch Books). Pre-deductive warrant allows for **local incoherence** due to computational bounds. You are not irrational for failing to see that $A \vdash B$ instantly.

  **How it differs from Ignorance:**
  Ignorance is a lack of information. Pre-deductive warrant is **positive evidence**.
  *   *Ignorance:* "I have no idea if Goldbach is true." (Credence = 0.5 by indifference).
  *   *Warrant:* "I have checked $10^{18}$ cases and it holds, and probabilistic models of primes suggest it should." (Credence = 0.9).
  This is reason-sensitive. If a counterexample were found at $10^{19}$, your warrant would crash. If a partial proof (e.g., "true for almost all numbers") is found, it rises. Ignorance doesn't move on partial results; warrant does.

  ### 4. The "Wrong vs. Overtaken" Distinction

  You asked: *What's the real difference between being wrong and being overtaken by a proof?*

  This is the distinction between **Falsification** and **Obsolescence**.

  *   **Being Wrong:** Your model of the evidence was flawed. (e.g., You thought the numerical checks were random, but they were biased).
  *   **Being Overtaken:** Your model of the evidence was correct *for the resources available*, but the **epistemic context** changed.

  When a proof is published, your 0.7 credence becomes **obsolete**, not **false**.
  Think of it like a map.
  *   **Conjecture Phase:** You have a sketch map based on satellite photos (numerical evidence). You say, "There's probably a road here."
  *   **Proof Phase:** Someone paves the road and puts up a sign.
  *   **Retrospect:** Was your sketch map "wrong"? No. It was the best representation of the terrain given the resolution. The proof didn't change the terrain (the truth); it changed the **resolution of the map** (the knowledge).

  In philosophical terms, your credence was attached to the **proposition's epistemic status**, not its **alethic status**.
  *   **Alethic Status:** True/False (Fixed).
  *   **Epistemic Status:** Proven/Unproven/Refutable (Variable).
  Your 0.7 was a accurate reading of the Epistemic Status. When the proof lands, the Epistemic Status snaps to "Proven," and the probability calculus is no longer needed for that proposition.

  ### 5. Recommended Literature & Next Steps

  You are standing at the intersection of a few specific debates. To dig deeper, look for these:

  1.  **George Polya, *Mathematics and Plausible Reasoning* (Vol 1 & 2):**
      *   This is the classic text. Polya explicitly argues that mathematicians use inductive logic ("plausible inference") before deductive proof. He treats conjectures exactly as you are describing. He calls it **Heuristic Reasoning**.

  2.  **Daniel Garber, "Old Evidence and Logical Omniscience" (1983):**
      *   Garber tries to solve the problem of how we can update on logical truths. He suggests expanding the language to include statements like "A implies B" as contingent propositions themselves. This validates your feeling that $P(A \to B)$ can be 0.9.

  3.  **Kenny Easwaran, "The Role of Explanation in Mathematics" & work on Bayesianism in Math:**
      *   Easwaran is a contemporary philosopher of math who writes precisely about this. He distinguishes between **verification** (proof) and **confirmation** (evidence).

  4.  **The "Good's Theorem" Context:**
      *   Look into **Bounded Rationality** (Herbert Simon). This explains why you aren't punished for the "constraint" violation. You are rational *relative to your computational costs*.

  ### Summary for your Seminar

  If you need to articulate this in your seminar, I suggest this formulation:

  > "We are dealing with **Non-Omniscient Epistemic Probability**. My credence isn't tracking the truth-value of the proposition (which is necessary), but the **accessibility of its proof**. This explains why the probability snaps to 1 upon proof (the accessibility becomes maximal) without rendering the prior credence irrational (it accurately tracked the prior accessibility). The apparent violation of probability axioms (like $P(A \to B)$) is due to **Logical Boundedness**: I am assigning probabilities to my *verification states*, not the logical relations themselves."

  You are not confused; you are noticing that the standard Bayesian model assumes a god's-eye view of logic, while mathematicians live in the trenches. The state you are in is **rationally required logical uncertainty**.
