      The strongest argument against this recommendation is that civic honor should reflect integrity, not merely effectiveness. Those who urge refusal argue that by honoring Fenwick, even with caveats, we signal that lying to citizens is compatible with "highest ideals." They contend that the charter demands models of conduct, not just results, and that normalizing "necessary lies" erodes the trust required for democracy. This is a serious concern; if we cannot distinguish between tragic necessity and cynical manipulation, we risk lowering the bar for future officials.

