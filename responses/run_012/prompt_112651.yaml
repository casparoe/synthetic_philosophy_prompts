      1. **Proportionality:** Was the moral cost proportionate to the catastrophe averted?
      2. **Transparency:** Can the act be publicly described without undermining current civic trust?
      3. **Remorse:** Did the official acknowledge the moral injury caused? (Had this criterion been weighted highest, we would have refused the honor entirely.)

