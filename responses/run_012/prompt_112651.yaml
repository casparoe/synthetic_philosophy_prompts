  I recommend we approve the renaming conditioned on a permanent public acknowledgment of the 1974 deception. This path honors Fenwick's service while refusing to sanitize the moral cost of her leadership.

  Our charter requires service reflecting "highest ideals." This creates tension when ideals conflict, as they did in 1974. To adjudicate the philosophical questions raised: First, Fenwick's deception was a moral wrong even if it was the prudent choice. Utility does not erase the violation of trust; it merely weighs against it. She traded truth for stability, a transaction that leaves a residue of guilt even when successful. Second, honor is expressive, not merely remunerative. It teaches citizens what the city values. Unconditional honor suggests ends justify means; refusal suggests leaders must remain morally pure to be effective. Acknowledgment navigates between these errors, affirming that leadership sometimes requires tragic choices that must not be forgotten. A city cannot honor someone it cannot fully describe; transparency resolves this.

  Third, Fenwick's failure to confess is decisive. Because she treated the lie as a mere instrument without public contrition, the city cannot honor her as a moral exemplar. We must supply the conscience she withheld. The secrecy of the act means it cannot be honored as virtue, only as burden. Fourth, any plaque must state plainly: "Mayor Fenwick guided the city through crisis, including the containment of the 1974 waterborne outbreak. Historical records confirm her administration withheld information regarding water safety to prevent panic, resulting in preventable deaths."

  The strongest argument against this recommendation is that civic honor should reflect integrity, not merely effectiveness. Those who urge refusal argue that by honoring Fenwick, even with caveats, we signal that lying to citizens is compatible with "highest ideals." They contend that the charter demands models of conduct, not just results, and that normalizing "necessary lies" erodes the trust required for democracy. This is a serious concern; if we cannot distinguish between tragic necessity and cynical manipulation, we risk lowering the bar for future officials. However, refusing honor entirely ignores the tragic dimension of governing where no clean hands are possible. It risks creating a culture where leaders are punished for making hard choices, incentivizing them to hide failures rather than manage them.

