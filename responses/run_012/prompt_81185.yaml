answer: |-
  1. Augustine defines a lie primarily as uttering something contrary to what one holds in the mind, regardless of the objective truth of the statement. The defining clause is the opening assertion that a liar "has one thing in his mind and utters another in words."
  2. The "double heart" signifies the internal conflict between holding a belief and expressing its opposite, making the speaker's subjective conviction the metric rather than objective reality. This explains why speaking falsehoods believed to be true is not lying, while speaking truths believed to be false constitutes lying.
  3. The clause regarding the desire of deceiving describes the moral fault rather than the constitutive definition, since the judgment of lying rests previously on the sense of the mind. Consequently, the criteria are structurally distinct, separating the act of mismatching mind and speech from the specific culpability of intending deception.
  4. Since the spokesperson utters what he thinks true, he lacks the double heart required for lying, even though he intends to mislead his audience. Augustine would therefore classify him as not lying, leaving the desire to deceive as a separate moral issue not covered by the definition of lying itself.
  5. This implies that lying and misleading differ morally because lying involves an internal duplicity that misleading merely exploits without necessarily embodying. The moral gravity rests on the speaker's internal relation to the truth, meaning the same words carry different moral weights depending on the speaker's belief.
