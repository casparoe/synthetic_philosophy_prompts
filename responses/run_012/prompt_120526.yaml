answer: |-
  1. **The Welfare Objection**
  Standard welfare economics suggests that if a worker prefers higher income over more leisure, a statutory cap on hours makes them objectively worse off. You argue that such preferences are often deformed by a coercive work ethic. But if you reject a preference because it conflicts with your theory of temporal autonomy, how do you distinguish a *distorted* preference from one you simply *dislike*, without arguing in a circle? What is the Archimedean point you stand on to judge the preference as deformed rather than just different?

  *Follow-up:* You will likely appeal to structural conditions—that the preference is formed under duress or false necessity. But if a worker, fully informed and financially secure, still expresses a genuine desire to work 60 hours because they find the work meaningful, does your theory still override that choice? If so, isn't the "deformation" argument doing too much heavy lifting, effectively immunizing your theory from any counter-preference?

  2. **The Work-Ethic Objection**
  Critics argue that the Protestant ethic shapes how free time is experienced; for many, discretionary hours deliver nothing but anxiety or guilt because they lack the cultural scripts to use them well. If the binding constraint on temporal autonomy is cultural rather than legal, does a statutory cap address the symptom while ignoring the disease? Is it possible to legislate freedom of time without first transforming the culture that devalues it?

  *Follow-up:* I anticipate you'll argue that law can lead culture, creating a new normal that dissolves the guilt over time. But there is a lag time between legislation and cultural shift. During that transition, aren't you imposing a legal restriction on people who still hold the old values, effectively punishing them for a cultural change that hasn't happened yet? How do you justify that interim cost to the very autonomy you seek to protect?

  3. **The Karoshi Objection**
  If *karoshi* is fundamentally a failure of temporal control rather than a simple quantity of hours, then a compensation regime or labor law that fixes a numerical threshold (like 35 hours) is testing for the wrong variable. What would a control-based legal test look like in practice? Can you draft a statute that measures an employee's command over their schedule rather than their clock-in time, and if so, how could it be administered without inviting endless litigation?

  *Follow-up:* You will likely suggest a subjective or hybrid test where the burden of proof shifts to the employer to demonstrate the worker had genuine discretion. But given the power asymmetry in employment relationships, wouldn't this effectively coerce employers to impose rigid caps anyway to avoid liability? If so, doesn't the "control" argument collapse back into a blunt hour cap, rendering the distinction moot?

  4. **The Primary-Good Objection**
  Time, unlike money, cannot be transferred, banked, or saved; it perishes instantly. This makes it a strange candidate for a "fair distribution" in the Rawlsian sense. If the goal is maximizing discretionary time, could that be satisfied by radical flexibility—allowing workers to bunch hours or take sabbaticals—rather than a weekly cap? Why does your view require a rigid 35-hour ceiling rather than a flexible bank of discretionary hours?

  *Follow-up:* You'll likely argue that flexibility without a cap allows employers to demand all available time, eroding the boundary entirely. But if the good is *discretion*, shouldn't the worker be allowed to waive that protection if they choose? If you forbid them from selling their discretionary time for income, aren't you treating time as a public good that the individual is not allowed to alienate, which seems to contradict the liberal notion of self-ownership?

  5. **The Meaning Objection**
  Many people locate their central good in their work; for them, a cap that prevents them from doing more looks like a deprivation rather than a liberation. If temporal autonomy is the highest political good, you risk ranking the "leisurely life" above the "devoted life." How do you avoid paternalism here? Are you not imposing a specific conception of the good life—one where work is instrumental and life is elsewhere—onto those for whom work is constitutive of their identity?

  *Follow-up:* You will likely distinguish between work chosen freely and work demanded by structure. But consider the surgeon or the artist who freely chooses to work 50 hours because the stakes or the craft demand it. If your policy forces them down to 35, you are interfering with their pursuit of excellence. Do you accept that your theory might lower aggregate social excellence in certain fields as the price of temporal fairness?

  6. **The Rights Objection**
  A right to work is ordinarily claimed as a right to a job, while a right to rest is claimed as a limit on employers. Does your account make the right to work derivative of the good of discretionary time? If so, what follows for someone who wants to work more than the cap allows? Are they violating the fair division of time, and do they have a claim against the state for preventing them from laboring?

  *Follow-up:* You'll likely argue that the right to work is conditional on not infringing on the temporal autonomy of others or the social baseline. But if I work more, I don't necessarily take time from another specific person. Why is my extra labor a violation of a distributive share? Is the "fair division" argument actually a disguised argument about limiting aggregate production, and if so, why is that a matter of individual rights rather than macroeconomic policy?

  7. **The Measurement Problem**
  Your theory rests on the distinction between necessary time (work, care, sleep) and discretionary time. But these categories are porous. Is time spent commuting discretionary if I listen to a podcast? Is time spent on "networking" work if it happens at a dinner party? Who gets to define the boundary of necessary time? If the state defines it, doesn't that grant them intrusive authority over how we categorize our daily lives?

  *Follow-up:* You will likely propose a social minimum or an objective list of necessities. But care work varies wildly depending on the needs of a child or an elderly parent. If the state sets a standard "necessary time" allowance for care that is too low, the caregiver's discretionary time evaporates. Does your theory require the state to subsidize care to ensure the discretionary time baseline is met, and if so, does that turn temporal autonomy into a function of fiscal policy after all?

  8. **The Inequality Objection**
  High-income workers can often afford to work less, while low-income workers rely on overtime to survive. A uniform 35-hour cap might protect the leisure of the wealthy while capping the earning potential of the poor. If temporal autonomy is a distinct good, does it not compete with income as a resource for the vulnerable? How do you justify prioritizing time over income for those for whom income is the more binding constraint on their freedom?

  *Follow-up:* You'll likely argue that relying on overtime is a sign of a broken wage structure that should be fixed separately. But in the transition, the worker loses income. If you cannot guarantee a wage increase to offset the lost hours, aren't you asking the poor to subsidize the theoretical freedom of the society with their actual material welfare? Is temporal autonomy a luxury good that we can only afford once a certain GDP threshold is met?

  9. **Falsification and Policy Survival**
  Finally, what evidence or argument would move you off this account? If empirical data showed that flexible markets produced higher reported well-being and autonomy than capped regimes, would you abandon the 35-hour week? And conversely, if your philosophical account of temporal autonomy were disproven, would anything survive of the 35-hour week, or does the policy stand or fall entirely with this specific justification?

  *Follow-up:* If you say the policy survives even if the theory fails, then the theory is merely post-hoc rationalization. If you say the policy fails with the theory, then you are tying a concrete livelihood intervention to a contentious philosophical claim. Given the stakes, why should we bind policy so tightly to a specific metaphysical account of time rather than a pragmatic assessment of health and output?
