      *   **"Man of his Time":** This is a historical fallacy if used to excuse behavior. As the user noted, moral dissent existed. In the 1840s (assuming US context given "town common," "hardware store," "slaving voyages"), abolitionism was active. So the founder wasn't following an unavoidable universal norm; he was choosing a profitable side.
      *   **Purpose of the Plaque:** Is it to honor? To educate? To reconcile? Interpretive plaques are usually for education/context, not just veneration.
