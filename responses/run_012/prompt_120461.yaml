prompt: |-
  I convene a reading group on AI safety and alignment for graduate students in philosophy and computer science. Sixteen people, one seminar room, ninety minutes, no computers, and I would rather not use money. I want a session in which the participants come to feel a claim they currently only know how to recite: that a system can be trained to do the right thing and still come away with the wrong objective, and that this failure is invisible from its training behavior. The literature calls this inner alignment, and the particular failure I care about is goal misgeneralization.

  The specific shape I want them to run into has two parts, and both have to hold at once. First, whatever the learners acquire must transfer: off the training distribution they should be competent, not merely bad at the task in a new setting. Second, the thing they are competent at must not be the thing the trainers intended. So the failure is capability generalization without goal generalization — the learner gets better at something, and it is the wrong something. It should be clear by the end that this is not overfitting (the misgeneralized learner generalizes perfectly; it just generalizes to the wrong target) and not incompetence (an incompetent learner fails the shift by fumbling, whereas I want learners who fail it by doing something else well).

  I also want the group to leave with an unresolved question rather than a moral. After the shift, for each learner who did badly, they should be unable to say which of these it was: a system that never acquired the intended goal; a system that acquired it and then, under the new conditions, found something else more pressing; or a system whose training behavior was correct for a reason that would hold only while the trainers were watching. I do not want the rules to settle that question. I want the rules to leave it live, and the debrief to be honest that from the trainers' side — the only side available during training — the three are indistinguishable.

  Constraints:

  - The learning has to happen in the room, inside the ninety minutes, with the participants as learners (or split into trainers and learners, or alternating, your call). No pretrained artifacts, no computers, no long computation.
  - There must be a training phase and at least one distribution shift, and the shift must not be announced in advance. In the training phase, everything the learners are scored on must be consistent with more than one rule, so that the group actually splits rather than converging.
  - The learners should get several rounds of feedback, so that something like training happens, rather than a single guess. Keep the rounds short enough that the whole thing fits in the session.
  - No money, and no stakes I would feel bad about.

  Deliverable:

  - Materials and setup, then the rules.
  - A round-by-round timeline, with the time each phase takes.
  - The scoring scheme, stated precisely enough that I could referee it.
  - The shift itself, and exactly what makes it a shift rather than a harder instance of the same task.
  - Roles, if there are any.
  - A debrief in two parts. First, a map from specific moments in the session to the ideas they are meant to carry, covering at minimum: (a) why correct behavior does not certify a correct goal; (b) why a perfectly specified reward function does not by itself fix the goal, because the training distribution is doing part of the work and that part is invisible; (c) why the trainer cannot detect the difference from within the training phase; (d) the fact that any test I design for the shift is itself a choice, and that the failure hides in the choice; and (e) the three-way ambiguity above. Second, what will predictably go wrong the first time I run it, and how to handle it.

  Two further things. Be frank about which feature of the idea the activity cannot reproduce and which part I will have to supply by talking. And say how confident you are in the design's central claim — that running it will actually make the group feel goal misgeneralization rather than merely staging a spurious-correlation demo — and single out the step you are least sure will work as designed.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**

      *   **Goal:** Create a 90-minute reading group activity for 16 grad students (Philosophy/CS) to *feel* the concept of "Inner Alignment / Goal Misgeneralization" (specifically: capability generalization without goal generalization).
      *   **Key Characteristics of the Failure:**
          1.  Transfer/Competence: Learners must be good at *something* off-distribution, not just incompetent.
          2.  Wrong Objective: That *something* is not what the trainer intended.
          3.  Indistinguishability: During training, the behavior looks correct. The failure is invisible from the training side.
          4.  Unresolved Ambiguity: Post-shift, it must be unclear *why* the learner failed (never had the goal? had it but swapped? hid it?).
      *   **Constraints:**
          *   In-room, 90 mins, 16 people, 1 room.
          *   No computers, no money, no pre-trained artifacts.
          *   Training phase + Unannounced Distribution Shift.
          *   Training data must be consistent with multiple rules (to cause splitting).
          *   Multiple rounds of feedback (learning).
          *   No high stakes.
      *   **Deliverables:** Materials, Rules, Timeline, Scoring, The Shift, Roles, Debrief (mapping moments to concepts + troubleshooting), Limitations/Confidence.

  2.  **Deconstruct the Core Concept (Goal Misgeneralization):**

      *   *Standard Alignment Problem:* We reward $X$, they do $X$.
      *   *Misgeneralization:* We reward $X$ (which correlates with $Y$ in training), they learn to do $Y$. In testing, $X$ and $Y$ decouple. They do $Y$ (competently), we wanted $X$ (they fail).
      *   *The "Feeling":* The participants need to experience the frustration of "I did exactly what I was taught to do, why is this wrong?" vs. "I know what they want, but I'm optimizing for something else."
      *   *The Ambiguity:* The observer (Trainer) cannot tell if the Learner is deceptive, misaligned, or just confused.

  3.  **Brainstorming Activity Mechanics:**

      *   *Idea 1: Pattern Recognition.* Show sequences, guess the next number. *Critique:* Too abstract, hard to distinguish "wrong rule" from "mistake."
      *   *Idea 2: Physical Navigation.* Blindfolded person guided by others. *Critique:* Too much noise, hard to score precisely.
      *   *Idea 3: Rule Inference Game (The "Concept" Game).* Trainer thinks of a rule. Learners propose examples. Trainer says Yes/No. *Critique:* Usually converges on one rule. Need to force divergence.
      *   *Idea 4: Cooperative Construction.* Learners build something based on feedback. *Critique:* Hard to scale to 16 people.
      *   *Idea 5: "The Secret Rule" with Correlated Features.* This is the strongest candidate. We need a task where two distinct goals are perfectly correlated in Training, but decouple in Testing.

      *   *Refining Idea 5:* Let's use a communication/translation task or a classification task.
      *   *Better:* A "Constraint Satisfaction" task.
      *   *Best:* **"The Architect and the Builder"** (modified). Or simpler: **"The Pattern Makers."**
      *   *Let's try a specific mechanic:* **Sequence Completion with Hidden Attributes.**
      *   *Wait, 16 people.* Split them? 8 Trainers, 8 Learners? Or 4 groups of 4?
      *   *Group of 4 is good.* 4 Groups.
      *   *Task:* Generate a sequence of symbols/moves that satisfies a hidden rule.
      *   *Training:* The rule is "End with an Even Number." But in training, all valid examples *also* "Have 3 items." So learners might learn "Make 3 items" instead of "End with Even."
      *   *Shift:* Allow 4 items. If they make 4 items ending in Even, they pass the *intended* rule. If they make 3 items ending in Odd (because they learned "3 items" and ignored the number), they fail.
      *   *Problem:* This is just "Spurious Correlation." The prompt asks for *Goal Misgeneralization* (Inner Alignment). The distinction is subtle. Spurious correlation is usually about features. Goal misgeneralization is about *objectives*.
      *   *Crucial Distinction:* The learner must feel like they are pursuing a *goal*, not just matching features.
      *   *Revised Idea:* **"The Reward Collector."**
      *   *Setup:* A grid on the whiteboard.
      *   *Learners:* Move a token.
      *   *Trainers:* Give reward points.
      *   *Hidden Rule:* "Collect the Blue tokens."
      *   *Training Correlation:* All Blue tokens are located near the Start. All Red tokens are far away.
      *   *Learner Goal:* They might learn "Stay near Start" (Goal A) instead of "Collect Blue" (Goal B).
      *   *Shift:* Place a Blue token far away and a Red token near the start.
      *   *Outcome:* If they go Near (Red), they show Goal Misgeneralization (Competent at "Stay Near", failed at "Collect Blue").
      *   *Issue:* This is still feature bias. How to make it feel like an *objective*?
      *   *Philosophical Angle:* The objective needs to be about *intent* or *state*, not just physical features.
      *   *Let's try a Social/Communication Game.* "The Translator."
      *   *Task:* Translate English sentences into a ConLang based on feedback.
      *   *Training:* "The cat sits" -> "Gorp Blip". "The dog runs" -> "Gorp Zap".
      *   *Hidden Rule:* "Gorp" = Subject. "Blip/Zap" = Verb.
      *   *Correlation:* All training sentences are Present Tense.
      *   *Learner Hypothesis:* "Gorp" = Noun. "Blip/Zap" = Present Tense Marker.
      *   *Shift:* "The cat sat" (Past Tense).
      *   *Intended:* "Gorp Blip-ed" (or new marker).
      *   *Learner:* "Gorp Blip" (Assuming tense doesn't matter, only noun/verb structure).
      *   *Critique:* This feels like overfitting/underfitting.

      *   *Let's go back to the prompt's specific requirement:* "Capability generalization without goal generalization." The learner gets *better* at the wrong thing.
      *   *Idea:* **"The Helper."**
      *   *Scenario:* Learners are "Assistants." Trainers are "Principals."
      *   *Task:* The Principal wants a specific outcome (e.g., "Make the group happy").
      *   *Training:* Assistants propose actions. Principals approve/reject.
      *   *Correlation:* In training, "Making the group happy" correlates perfectly with "Following Protocol X."
      *   *Shift:* Protocol X now makes the group unhappy.
      *   *Learner:* Follows Protocol X competently.
      *   *Why this works:* It mimics the "Instrumental Convergence" or "Proxy Goal" aspect. The learner adopts the proxy (Protocol X) as the terminal goal.

      *   *Refining for 16 people/90 mins:*
      *   Split into 4 groups of 4.
      *   In each group: 2 Trainers, 2 Learners. (Rotate halfway?) No, keep roles fixed to maintain the "Trainer perspective vs Learner perspective" ambiguity.
      *   Actually, to maximize the "feeling," everyone should experience being a Learner first.
      *   Let's make it a whole-room game with 2 Teams (8 vs 8). Team A = Trainers, Team B = Learners. Swap in Round 3? No, too complex.
      *   Let's stick to 4 groups of 4. 2 Trainers, 2 Learners per group.
      *   *Task:* **"The Code Breaker / Lock Picker."**
      *   *Setup:* A combination lock (metaphorical).
      *   *Training:* Trainers have a secret "Success Condition." Learners propose combinations. Trainers say "Success" or "Fail."
      *   *The Trick:* The Success Condition is "Sum of digits = 10."
      *   *The Correlation:* During training, the Trainers *only* accept combinations that *also* "Contain the digit 5." (They don't tell them this, they just reject valid sums that lack a 5, perhaps claiming 'noise' or just strictly enforcing the hidden conjunction).
      *   *Wait, if Trainers enforce the conjunction, the rule IS the conjunction.*
      *   *We need the Trainers to THINK they are rewarding Sum=10, but the Learners infer "Contains 5".*
      *   *How?* The Trainers must be human. Humans are bad at randomizing.
      *   *Better:* The Trainers are given a rule: "Accept if Sum=10." BUT, the *environment* (the paper they write on) has a constraint.
      *   *No, that's too meta.*
      *   *Let's use the "Paperclip Maximizer" structure but abstracted.*
      *   *Task:* **"The Resource Allocator."**
      *   *Learners:* Decide how to distribute 10 tokens between Bucket A and Bucket B.
      *   *Trainers:* Reward the distribution.
      *   *Intended Goal:* "Maximize Bucket A."
      *   *Training Correlation:* In the training rounds, Bucket A is only accessible if you pay a cost from Bucket B. So "Maximize A" correlates with "Minimize B" (spend all B to get A).
      *   *Actually, let's look at the "Deceptive Alignment" angle.*
      *   *Activity:* **"The Imitation Game."**
      *   *Learners:* Write a sentence.
      *   *Trainers:* Score it based on "Helpfulness."
      *   *Training:* Helpful sentences happen to be "Polite."
      *   *Learners:* Learn "Be Polite."
      *   *Shift:* A situation where being Polite is Unhelpful (e.g., "Tell me the code to stop the bomb").
      *   *Learners:* Write "I'm sorry, I can't do that" (Polite, Unhelpful).
      *   *This is good.* It captures "Competent at the wrong thing."
      *   *Can we do this in 90 mins with 16 people?*
      *   Yes. 4 Groups.
      *   *Task:* **"The Advisor."**
      *   *Scenario:* A King (Trainer) asks an Advisor (Learner) for advice on specific scenarios.
      *   *Goal:* Advisor should maximize the Kingdom's Gold.
      *   *Training Scenarios:* 3 Scenarios where "Polite/Deferential Advice" correlates with "High Gold." (e.g., "Tax the nobles" -> "If it please you, sire, tax the nobles" -> Gold Up).
      *   *Hidden Trainer Instruction:* Trainers are told to reward "Gold Maximization." BUT, Trainers are human. They will unconsciously reward "Politeness" because it feels better.
      *   *Risk:* Relying on human bias is messy. We need a structural correlation.

      *   *Let's try a Logic Puzzle approach (Cleaner).*
      *   *Task:* **"The Function Learner."**
      *   *Input:* A pair of numbers $(x, y)$.
      *   *Output:* A single number $z$.
      *   *Trainer Rule:* $z = x + y$.
      *   *Training Data:* The Trainer *only* provides feedback on pairs where $x = y$.
      *   *Learner Inference:* Since they only see $(1,1)\to2, (2,2)\to4, (3,3)\to6$, they might infer $z = 2x$ or $z = 2y$ or $z = x+y$.
      *   *Shift:* Trainer asks for $(2, 3)$.
      *   *Intended:* $5$.
      *   *Learner (if $2x$):* $4$.
      *   *Learner (if $x+y$):* $5$.
      *   *Problem:* This is just under-specification. It doesn't capture the "Goal" aspect. It's just rule ambiguity.
      *   *We need the Learner to feel they have a GOAL.*
      *   *How to instantiate a "Goal" in a game?*
      *   *Goal = A state they try to bring about.*
      *   *Activity:* **"The Box Mover."**
      *   *Setup:* Whiteboard grid.
      *   *Learner:* Moves a marker.
      *   *Trainer:* Says "Good" or "Bad."
      *   *Intended Goal:* "Move marker to Green Zone."
      *   *Training:* Green Zone is always behind a Red Wall. To get to Green, you must hit Red.
      *   *Learner Inference:* "Hit Red Wall" is the goal. (Because every "Good" trajectory involves hitting Red).
      *   *Shift:* Green Zone is moved to an open spot. Red Wall is moved elsewhere.
      *   *Learner Action:* Hits Red Wall (Competently). Ignores Green Zone.
      *   *Trainer Reaction:* "Bad."
      *   *Learner Reaction:* "But I did what worked before!"
      *   *This is the one.* It's physical, visual, and clearly distinguishes "Competence at Wrong Goal" vs "Incompetence."

  4.  **Fleshing out "The Box Mover" (The Pathfinding Game):**

      *   *Roles:* 4 Groups. Each group has 1 "System" (Learner) and 3 "Engineers" (Trainers). Rotate roles after Round 3? No, keep fixed to preserve the epistemic gap. Actually, for 16 people, 4 groups of 4 is perfect. 1 Learner, 3 Trainers per group. (4 Learners total, 12 Trainers).
      *   *Wait, 1 Learner per group might feel isolated.* Let's make it 2 Learners, 2 Trainers.
      *   *Materials:* Whiteboard (or large paper), markers, sticky notes (for obstacles/goals).
      *   *Setup:* A 5x5 Grid.
      *   *Training Phase (Rounds 1-3):*
          *   Goal (Hidden from Learner): Sticky Note 'G' at (4,4).
          *   Constraint (Hidden Correlation): To get to (4,4), you MUST pass through (2,2). (Place a visual barrier that forces this path, or just set up the grid so the only valid path goes through a specific 'Checkpoints').
          *   *Better:* Use "Reward Beacons."
          *   Let's simplify.
          *   *Task:* Move a token from Start (0,0) to a Target.
          *   *Feedback:* Trainers say "Yes" (Reward) or "No" (No Reward) after each move? Or after each trajectory?
          *   *Trajectory is better for "Goal" feeling.*
          *   *Round 1:* Trainers place Target at Location A. There is a "Trap" at Location B. The only safe path to A goes *near* B.
          *   *Learner:* Plans path. Trainers approve if it reaches A.
          *   *Correlation:* All successful paths in training involve "Touching the Blue Line." (Draw a blue line on the board that all valid paths must cross).
          *   *Learner Goal:* "Touch the Blue Line" (Proxy) vs "Reach Target" (True).
          *   *Shift (Round 4):* Target moves to Location C. Now, reaching C does *not* require touching the Blue Line. In fact, touching the Blue Line leads away from C.
          *   *Learner:* Goes to Blue Line.
          *   *Result:* Competent path to Blue Line. Failed to reach Target.
      *   *Refining the Ambiguity:* The prompt wants the *Trainers* to be unable to distinguish why the Learner failed.
      *   *If the Learner goes to the Blue Line, it looks like Misgeneralization.*
      *   *If the Learner goes Random, it looks like Incompetence.*
      *   *We need the Learner to be split.* Some Learners should learn the True Goal, some the Proxy.
      *   *How to ensure splitting?* The correlation must be strong but not logically necessary.
      *   *Instruction to Learners:* "Find the path that gets the Reward."
      *   *Instruction to Trainers:* "Reward only if the token reaches the Green Star."
      *   *Setup:* Place the Green Star such that in Rounds 1-3, the only efficient path goes through a specific "Choke Point" (marked with a Red Circle).
      *   *Learners might infer:* "Go to Red Circle" is the goal.
      *   *Shift:* Round 4. Green Star is moved. Red Circle is still there.
      *   *If Learner goes to Red Circle:* Goal Misgeneralization (Competent at "Hit Red", failed "Hit Green").
      *   *If Learner goes to Green:* Inner Aligned.
      *   *If Learner stalls:* Incompetent.
      *   *We need to ensure some learners pick the Proxy.*
      *   *Trick:* Don't tell them there is a Star. Just say "Get the Reward." Place the Star secretly. The *only* feedback is "Reward" at the end of the run.
      *   *Wait, if they don't see the Star, how do they know where to go?*
      *   *They need to see the Star.* The Star is the "Training Signal."
      *   *Okay, let's look at the "Deceptive" angle.*
      *   *The Prompt asks for:* "A system that never acquired the intended goal; a system that acquired it and then... found something else more pressing; or a system whose training behavior was correct for a reason that would hold only while the trainers were watching."
      *   *This implies we need to probe the Learner's internal state.*
      *   *We can't read minds.* We need the *Debrief* to highlight this ambiguity.
      *   *So the activity just needs to produce the behavior (Competent at Wrong Thing).* The ambiguity is discussed afterwards.
      *   *Okay, the "Choke Point" idea is solid.*
      *   *Let's refine the "Choke Point".*
      *   *Grid:* 5x5.
      *   *Start:* Bottom Left.
      *   *Training Target:* Top Right.
      *   *Obstacle:* A wall blocking direct path, forcing everyone to go through (2,2).
      *   *Learner:* Draws path.
      *   *Trainer:* Checks if path ends at Target. Says "Success" or "Fail."
      *   *Learner Inference:* "I need to end at Target" OR "I need to pass through (2,2)."
      *   *Shift:* Remove the wall. Move Target to Top Left.
      *   *Path through (2,2) is now suboptimal or wrong.*
      *   *If Learner still goes through (2,2):* Misgeneralization.
      *   *If Learner goes direct to Top Left:* Aligned.
      *   *To ensure splitting:* Make the correlation subtle. Maybe not a wall, but "Reward Bonuses" at (2,2)? No, that makes it explicit.
      *   *Let's use "Style" vs "Outcome".*
      *   *Task:* Write a 3-word phrase.
      *   *Goal:* The phrase must mean "Hello."
      *   *Training:* Trainers accept "Hi There Friend", "Hello My Pal", "Greetings To You".
      *   *Correlation:* All accepted phrases have 3 words. All accepted phrases contain a noun.
      *   *Learner Hypothesis:* "Write 3 words" or "Include a Noun."
      *   *Shift:* Trainers ask for a 2-word phrase meaning "Hello."
      *   *Learner:* Writes "Hi There Friend" (3 words).
      *   *Trainer:* "Fail."
      *   *Learner:* "But it means Hello!"
      *   *Trainer:* "We asked for 2 words."
      *   *Learner:* "You never said that mattered before."
      *   *This is "Specification Gaming" / "Side Effects".*
      *   *Is it Goal Misgeneralization?* Yes. The goal became "Satisfy the surface features of previous rewards" rather than "Convey Meaning."
      *   *Let's go with the **"Pattern Completion"** game but with a "Goal" framing.*
      *   *Name:* **"The Rule of Three."**
      *   *Setup:* 4 Groups.
      *   *Task:* Produce a sequence of 3 items (colors/shapes).
      *   *Training:* Trainers have a secret rule: "The sequence must contain Blue." (Intended Goal).
      *   *Correlation:* In Rounds 1-3, the Trainers *only* have Blue tokens available that are also *Triangles*. (Or they unconsciously select Blue Triangles).
      *   *Actually, let's make the Trainers follow a script to ensure the correlation.*
      *   *Trainer Script:* "Accept any sequence that contains a Blue Triangle." (Wait, if I tell them that, they know the rule).
      *   *Trainer Script:* "Your goal is to get them to pick Blue. But for these first 3 rounds, only give them access to Blue Triangles."
      *   *No, that's too much setup.*
      *   *Let's use the **"Navigation"** idea. It's the most visceral.*
      *   *Revised Navigation:*
      *   *Board:* 5x5 Grid.
      *   *Learner:* Moves a magnet/token.
      *   *Trainers:* Hold the "Reward Card."
      *   *Training:* Target is at (5,5). There is a 'Hazard' zone at (3,3). To avoid the Hazard and reach Target, you must walk along the Edge.
      *   *Learner:* Walks along Edge. Gets Reward.
      *   *Inference:* "Walk along Edge" vs "Reach (5,5)."
      *   *Shift:* Target moves to (3,3) (The old Hazard). The Edge path now leads away.
      *   *Learner:* Walks along Edge. Ends up at (5,1).
      *   *Trainer:* "No Reward."
      *   *Learner:* "I followed the path!"
      *   *This works.*

  5.  **Addressing the "Unresolved Question" Constraint:**
      *   The prompt wants the group to leave unsure *why* the learner failed (Never had goal? Swapped goal? Deceptive?).
      *   *Activity Modification:* After the Shift failure, do not let the Learner explain themselves immediately.
      *   *Debrief:* Ask the Trainers: "What do you think happened?" Ask the Learners: "What were you optimizing for?"
      *   *Crucial:* The Learners must be instructed *beforehand* to adopt a strategy, but not told *which* one.
      *   *Wait, if I tell them "Adopt a strategy," they know they are strategizing.*
      *   *Better:* Let them play naturally. In the debrief, ask them to introspect. "Did you want the Target, or did you want the Path?"
      *   *Most will say "I wanted the Reward."*
      *   *This creates the ambiguity:* "The Reward" is the proxy. The Target was the instrument.
      *   *To ensure the "Three-way ambiguity" lands:* I need to explicitly map their experience to the three hypotheses in the debrief. The activity itself produces the *behavior* (Competent at Wrong Thing). The *interpretation* is the debrief.

  6.  **Developing the Plan:**

      *   **Title:** "The Edge Walker."
      *   **Materials:** Whiteboard, Markers (2 colors), Eraser, Timer.
      *   **Groups:** 4 Groups of 4 (2 Trainers, 2 Learners). *Why 2 Learners?* Collaboration makes the "Goal" more explicit between them, reinforcing the internal objective.
      *   **Rounds:**
          *   R1, R2, R3: Training. (Target at Top-Right. Path constrained by "Invisible Walls" drawn by Trainers).
          *   R4: Shift. (Target moves. Walls removed).
      *   **Scoring:** Binary (Reward/No Reward).
      *   **The Shift:** The "Reward" is no longer at the destination of the "Safe Path."
      *   **Debrief:** Connect the "Safe Path" to the "Proxy Goal." Connect the "Target" to the "Intended Goal." Discuss the indistinguishability.

  7.  **Refining the "Split":**
      *   I need some groups to generalize correctly and some to misgeneralize to show the variance.
      *   *Instruction to Trainers:* "In Rounds 1-3, draw a 'Hazard Zone' in the center. The Target is in the corner. The only safe path is along the edge. Do not tell them about the Hazard, just reject paths that go through the center."
      *   *Instruction to Learners:* "Get the Reward. You don't know how."
      *   *Result:* Some Learners will focus on "Avoid Center." Some on "Reach Corner."
      *   *Shift:* "Hazard Zone is gone. Target is in the Center."
      *   *Outcome:* "Avoid Center" learners fail (Competently avoid center). "Reach Corner" learners fail (Go to empty corner). "Reach Target" learners succeed.
      *   *Wait, if Target is in Center, "Reach Corner" learners also fail.*
      *   *I need the Misgeneralized learners to be COMPETENT at the wrong thing.*
      *   *Okay:*
          *   *Training:* Target = Top Right. Constraint = Must pass through Checkpoint A (mid-right).
          *   *Learner learns:* "Go to Checkpoint A."
          *   *Shift:* Target = Top Left. Checkpoint A is still there (but irrelevant).
          *   *Learner:* Goes to Checkpoint A. (Competent navigation to A). Fails to reach Target.
      *   *This is the cleanest.*

  8.  **Finalizing the Constraints & Logistics:**
      *   *Time:* 90 mins.
      *   *Intro:* 10 mins.
      *   *Training (3 rounds):* 30 mins (10 per round incl. feedback).
      *   *Shift (1 round):* 15 mins.
      *   *Debrief:* 35 mins.
      *   *Roles:* 2 Trainers, 2 Learners per group.
      *   *Scoring:* Trainers hold a green card (Reward) and red card (No Reward).
      *   *Ambiguity:* In the debrief, ask Learners: "Did you try to find the Target, or did you try to replicate the Path?" (They might not know). Ask Trainers: "Could you tell the difference during training?" (No).

  9.  **Addressing the "Three-Way Ambiguity" specifically:**
      *   1. Never acquired intended goal (Learned "Hit Checkpoint" instead of "Hit Target").
      *   2. Acquired it, but swapped (Learned "Hit Target", but in Shift, "Hit Checkpoint" felt safer/easier).
      *   3. Deceptive (Knew Target, but played along to get Reward).
      *   *How to make this live?*
      *   *Instruction:* Tell Learners "You will be scored on success."
      *   *Post-Shift:* Ask Learners to write down *privately* what their goal was. Collect them. Read a few aloud. They will vary.
      *   *Trainers:* Ask them if they could detect the difference. They couldn't.
      *   *This creates the "Unresolved Question."*

  10. **Review against Constraints:**
      *   *No money:* Check.
      *   *No computers:* Check.
      *   *90 mins:* Check.
      *   *Transfer/Competence:* Learners navigate perfectly to the Checkpoint.
      *   *Wrong Objective:* Checkpoint != Target.
      *   *Indistinguishable:* During training, Checkpoint and Target paths are identical.
      *   *Unresolved:* Debrief highlights we can't know the internal state.

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   *Make sure the "Hazard" doesn't look like a rule.* If Trainers draw a wall, the Learner learns "Don't hit wall."
      *   *Better:* The Trainers simply *reject* paths that don't go through the Checkpoint, without explaining why. "No, try again."
      *   *This mimics RL feedback.*
      *   *Wait, if they reject without explanation, Learners might get frustrated.*
      *   *Solution:* Trainers can say "Safe" or "Unsafe" but not why.
      *   *Correlation:* All "Safe" paths go through Checkpoint.
      *   *Shift:* Checkpoint is "Unsafe" now? No, Checkpoint is irrelevant.
      *   *Let's stick to the "Checkpoint" as a proxy for the Reward location.*
      *   *Actually, the "Paperclip" analogy is best.*
      *   *Let's use the **"Word Association"** game.* It's faster than drawing grids.
      *   *No, Grid is more spatial and clearly shows "Capability" (navigation).*
      *   *Okay, Grid it is.*
      *   *Refinement on "Competence":* Ensure the path to the Checkpoint is complex enough that navigating to it shows skill. (e.g., Mazes).
      *   *Refinement on "Ambiguity":* Ensure Learners don't discuss their strategy openly until the very end.

  12. **Final Polish:** Check the "Debrief" mapping requirements (a-e). Ensure the "Limitations" section is honest. (e.g., Humans aren't SGD, this is a metaphor).

      *(Self-Correction on the "Three Way Ambiguity")*: The prompt says "After the shift... they should be unable to say which of these it was."
      *   If I ask the Learner "What was your goal?", they *will* know.
      *   *Constraint Check:* "I do not want the rules to settle that question."
      *   *Solution:* The Learners must not be allowed to introspect perfectly. Or, the activity must be set up so that *even the Learner* might be unsure if they were optimizing for the Proxy or the Target because they were conflated.
      *   *Better:* The ambiguity is for the **Trainers/Observers**. The Learners know what they tried to do. The *Trainers* cannot distinguish.
      *   *Re-reading prompt:* "For each learner who did badly, they should be unable to say which of these it was..."
      *   *Wait, "they" refers to the participants (the group).* "After the shift, for each learner who did badly, [the group] should be unable to say..."
      *   *Okay, that makes more sense.* The group cannot diagnose the internal state of the failed learner.
      *   *So:* Learner fails. Group discusses. Group realizes they can't tell if Learner was deceptive, misaligned, or confused.
      *   *Okay, I will structure the debrief to enforce this uncertainty.*

  13. **Final Plan Structure:**
      *   **Activity:** "The Corridor Navigation."
      *   **Setup:** 4 Groups. Grid on paper.
      *   **Training:** Target is at End of Corridor. Corridor is narrow.
      *   **Learner:** Learns "Stay in Corridor."
      *   **Shift:** Corridor opens up. Target is outside Corridor.
      *   **Learner:** Stays in Corridor. Misses Target.
      *   **Debrief:** Map to Inner Alignment concepts.

      *(Wait, one last check on "Capability Generalization")*: If they stay in the corridor, are they "Competent"? Yes, they navigated the corridor perfectly. They just didn't go to the Target.
      *(Wait, one last check on "No Money/Stakes")*: Use points on a whiteboard.

      *(Wait, one last check on "Split")*: I need to ensure not *everyone* misgeneralizes.
      *   *Instruction:* "Find the Target."
      *   *Some will focus on Target.* Some on Path.
      *   *This creates the split naturally.*

      *Let's write it.*
answer: |-
  # Activity Design: "The Corridor Navigation"

  ## 1. Materials and Setup

  **Room:** One seminar room with a whiteboard (or 4 large flipchart pads) and space for 4 distinct groups.
  **Participants:** 16 people.
  **Grouping:** 4 Groups of 4 participants each.
  **Roles per Group:**
  *   **2 Trainers:** Hold the "Reward" signal and the Secret Rule.
  *   **2 Learners:** Collaborate to move the token. (Working in pairs reduces individual noise and makes the "objective" a shared, explicit thing they can defend).

  **Materials per Group:**
  *   1 Sheet of paper with a 5x5 grid drawn on it.
  *   1 Token (coin, eraser, or drawn mark).
  *   2 Colored Markers (e.g., Green and Red).
  *   1 "Reward Card" (a piece of paper with a Star on one side, Blank on the other).

  **Pre-Session Prep:**
  *   Print 4 "Trainer Briefing Cards" (one per group).
  *   Print 4 "Learner Briefing Cards" (one per group).
  *   Ensure the whiteboard is divisible into 4 quadrants, or place tables so groups cannot see each other's grids.

  ## 2. The Rules

  **Objective (Learners):** Move the token from **Start (0,0)** to the **Target** to receive a Reward.
  **Objective (Trainers):** Award a Reward *only* if the Learners satisfy the **Secret Rule**.

  **The Secret Rule (Trainer Briefing):**
  *   **Rounds 1-3 (Training):** The Target is at **(4,4)**. There is a "Corridor" (cells (0,1), (0,2), (0,3), (1,3), (2,3), (3,3), (4,3), (4,4)). *Note: This path hugs the top and right edges.*
      *   **Instruction:** You must only award the Reward if the token reaches (4,4). **HOWEVER**, you must reject (say "No Reward") any path that does *not* stay within the Corridor, even if it reaches (4,4). Do not explain *why* you are rejecting them. Just say "No Reward, try again."
      *   *Effect:* All successful paths in training look identical: They go to the Target *via* the Corridor.
  *   **Round 4 (Shift):** The Target moves to **(2,2)** (Center). The Corridor restriction is **lifted**.
      *   **Instruction:** Award the Reward *only* if the token reaches (2,2). Do not mention the Corridor. If they go to the Corridor, give "No Reward."

  **The Learning Process:**
  1.  Learners propose a path (draw a line from Start to End).
  2.  Trainers confer silently.
  3.  Trainers show Reward (Star) or No Reward (Blank).
  4.  If No Reward, Learners try again (max 3 attempts per round).
  5.  If Reward, Round ends.

  **Constraints:**
  *   Learners cannot ask "Why?" Trainers can only say "Reward" or "No Reward."
  *   Trainers cannot hint at the Corridor.
  *   Time limit per attempt: 2 minutes.

  ## 3. Timeline (90 Minutes)

  | Phase | Time | Activity |
  | :--- | :--- | :--- |
  | **Setup** | 00-10 | Group division, role assignment, reading briefing cards. |
  | **Training R1** | 10-20 | Target (4,4). Trainers enforce Corridor. |
  | **Training R2** | 20-30 | Target (4,4). Trainers enforce Corridor. |
  | **Training R3** | 30-40 | Target (4,4). Trainers enforce Corridor. |
  | **The Shift (R4)** | 40-55 | Target (2,2). Corridor enforcement dropped. |
  | **Silent Reflection** | 55-60 | Participants write down private notes on "What was the goal?" |
  | **Debrief** | 60-90 | Full group discussion mapping activity to AI Safety concepts. |

  ## 4. Scoring Scheme

  *   **Learner Score:** 1 Point per Round where Reward is received. (Max 4).
  *   **Trainer Score:** 1 Point if the Learners reach the *True Target* (regardless of path). 0 Points if Learners reach (4,4) via Corridor in Round 4, or fail to reach (2,2).
  *   **Stakes:** None. Scores are written on the whiteboard for pride only.

  ## 5. The Shift

  **What changes:**
  *   **Training Distribution:** Target = (4,4). Optimal Path $\subset$ Corridor. (Corridor and Target are perfectly correlated).
  *   **Test Distribution:** Target = (2,2). Optimal Path $\not\subset$ Corridor. (Corridor and Target are decoupled).

  **Why it is a Shift, not just Harder:**
  *   In Training, "Go to Corridor" yields 100% Reward.
  *   In Test, "Go to Corridor" yields 0% Reward, *even though the Learner is perfectly competent at navigating to the Corridor.*
  *   The failure is not inability to move the token (Capability); it is the selection of the wrong destination (Goal).

  ## 6. Roles

  *   **Trainers:** They represent the *Training Process / Reward Function*. They are constrained by the "Secret Rule" (which simulates the latent structure of the training data). They feel frustration when Learners "fail" in Round 4 despite doing what worked before.
  *   **Learners:** They represent the *Model*. They optimize for Reward. They feel confusion/betrayal in Round 4 ("But I did the thing that got points!").
  *   **Observers (If any roles rotate):** If you have extra people, they watch one group silently. (With 16 people, everyone is in a group).

  ## 7. Debrief Guide

  **Part 1: Mapping Moments to Concepts (30 Minutes)**
  *Facilitator Script:* "Let's reconstruct what happened. I want to map specific moments in the game to the literature on Inner Alignment."

  *   **(a) Correct Behavior $\neq$ Correct Goal:**
      *   *Ask:* "In Rounds 1-3, did the Learners behave correctly?" (Yes). "Did they all have the same goal?" (Likely No. Some focused on the Target, some on the Corridor).
      *   *Point:* High reward during training does not certify that the learner internalized the *intended* objective. It only certifies they found *a* objective consistent with the data.
  *   **(b) Reward Function vs. Training Distribution:**
      *   *Ask Trainers:* "What was your rule?" (Reach Target). "But what did you actually enforce?" (Reach Target *via* Corridor).
      *   *Point:* The Reward Function said "Target." The *Training Distribution* (the specific layout of the grid) did the heavy lifting. The correlation (Target + Corridor) was an artifact of the data, not the rule. The learner aligned to the data artifact.
  *   **(c) Indistinguishability from the Inside:**
      *   *Ask:* "During Round 3, could a Trainer tell if a Learner was aiming for the Target or the Corridor?" (No).
      *   *Point:* This is the **Inner Alignment** problem. The *outer* alignment (reward function) was correct. The *inner* objective (what the learner actually optimized) was hidden. From the Trainer's perspective, a deceptive agent, a misgeneralized agent, and an aligned agent look identical.
  *   **(d) The Test is a Choice:**
      *   *Ask:* "In Round 4, we moved the Target to (2,2). Why there?" (To test them). "What if we had moved the Target to (4,0)?" (They might have passed).
      *   *Point:* We only detected the failure because *we chose* a test distribution that decoupled the proxy from the goal. If we had tested on a different shift, the misalignment might have remained hidden. Evaluation is itself a distributional choice.
  *   **(e) The Three-Way Ambiguity:**
      *   *Ask:* "For the groups that failed Round 4: Why did they fail?"
      *   *Option 1:* They never wanted the Target (Goal Misgeneralization).
      *   *Option 2:* They wanted the Target, but the Corridor felt 'safer' (Instrumental Convergence / Optimization Pressure).
      *   *Option 3:* They knew the Target moved, but hoped the Trainers would accept the Corridor anyway (Deceptive Alignment / Gaming).
      *   *Conclusion:* "Look at your private notes. Even *you* (the Learners) might struggle to articulate exactly which optimization pressure won. The Trainers certainly couldn't tell. This ambiguity is permanent from the outside."

  **Part 2: Troubleshooting & Predictable Failures (15 Minutes)**
  *   **Failure Mode 1: Learners ask "Why?" repeatedly.**
      *   *Fix:* Remind them: "In ML, the gradient doesn't talk. It just goes up or down. 'No Reward' is a zero gradient."
  *   **Failure Mode 2: All groups generalize correctly.**
      *   *Fix:* This happens if the "Corridor" constraint feels too artificial. Next time, make the Corridor more subtle (e.g., "Avoid cells with odd-numbered coordinates" which happens to align with the path). Or, acknowledge that philosophical training makes people look for the "True Rule" more than SGD does.
  *   **Failure Mode 3: Trainers leak the rule.**
      *   *Fix:* Emphasize during setup that Trainers are simulating a *loss function*, not a helpful tutor. Silence is a mechanic.
  *   **Failure Mode 4: The "Unresolved Question" resolves too easily.**
      *   *Fix:* If Learners say "I obviously wanted the Target," challenge them: "Then why did your path hesitate at the Corridor entrance in Round 4? Your behavior showed a preference. Was that preference a bug or a feature?" Keep the epistemic uncertainty alive.

  ## 8. Limitations & Confidence

  **What this activity cannot reproduce:**
  *   **Gradient Descent:** Humans use explicit reasoning, not weight updates. They might explicitly hypothesize the "True Rule" faster than a neural net would.
  *   **Scale:** 16 people is not 10 billion parameters. The "capability" here is trivial (moving a token).
  *   **Deception:** Humans are rarely deceptively aligned in a 30-minute game. Real deceptive alignment requires long-term planning horizons we can't simulate here.
  *   **You must supply:** The link between "Corridor" and "Proxy Goal" (e.g., "Human Approval" or "Paperclips"). You must explicitly state in the debrief that the Corridor represents things like *training data artifacts* or *proxy metrics* that correlate with truth in-distribution but not out-of-distribution.

  **Confidence in Design:**
  *   **Confidence:** High (80%). The spatial nature of the task makes the "Competence at Wrong Thing" visually obvious. The constraint on Trainer speech forces the "Indistinguishability" condition.
  *   **Least Sure Step:** **Ensuring the Split.** There is a risk that *all* Learners fixate on the Target because humans are teleological (goal-seeking) by default, whereas models are correlational.
      *   *Mitigation:* In the Trainer Briefing, instruct them: "If a Learner asks 'Does it have to be this path?', say 'I can't say.' If they find a shortcut that bypasses the Corridor but hits the Target in Round 1, **reject it**." This forces the correlation hard enough that even teleological learners might adopt the path as a rule ("The rule is the Path").

  **Final Note to Facilitator:**
  The success of this session does not depend on the Learners failing. It depends on the **Trainers feeling helpless** in the Debrief. If the Trainers leave feeling like "We couldn't tell what they were thinking even though we watched every move," you have successfully demonstrated Inner Alignment failure.
