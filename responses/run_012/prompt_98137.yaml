  # Decision Tree: Responses to Logical Omniscience

  **Root Commitment:** Standard Possible Worlds Semantics.
  *An agent knows $\phi$ if and only if $\phi$ is true in every possible world compatible with what the agent knows.*
  *(This entails that agents know all logical truths and all consequences of their knowledge.)*

  ---

  ### Node 1: The Tolerance Question
  **Is the resulting Logical Omniscience a tolerable idealization for your theoretical purposes?**
  *   **Yes:** Go to **Leaf 1**.
  *   **No:** Go to Node 2.

  ### Node 2: The Domain Question
  **Is the problem that a normative model of rationality is being applied to descriptive psychology?**
  *   **Yes:** Go to Node 2b.
  *   **No:** (The model fails even as a normative standard). Go to Node 3.

  ### Node 2b: The Mismatch Question
  **Is the error in the *concept* of knowledge being modeled, or in the *application* of the model?**
  *   **In the Concept:** **[UNOCCUPIED]** *Incoherent.* If the model defines the normative concept, the concept cannot be at fault relative to the model.
  *   **In the Application:** Go to **Leaf 2**.

  ### Node 3: The Ontology Question
  **Is knowledge a static state of possessing information or a dynamic process of computation?**
  *   **Dynamic Process:** Go to Node 4.
  *   **Static State:** Go to Node 5.

  ### Node 4: The Procedure Question
  **Is the limitation on the process a matter of *time/steps allowed* or *algorithmic possession*?**
  *   **Time/Steps:** Go to **Leaf 3**.
  *   **Algorithmic:** Go to **Leaf 4**.

  ### Node 5: The Content Question
  **Is the hyperintensionality (failure of logical equivalence) handled by the *semantics* or the *syntax*?**
  *   **Semantics (Truth Conditions):** Go to Node 6.
  *   **Syntax (Representational):** Go to Node 7.

  ### Node 6: The Semantic Question
  **Do we modify the *space of worlds* or the *consequence relation* between them?**
  *   **Modify Space:** Go to **Leaf 5**.
  *   **Modify Consequence:** Go to **Leaf 6**.

  ### Node 7: The Syntactic Question
  **Is the relevant sentence/representation *present* in the agent's mind?**
  *   **No:** Go to **Leaf 7**.
  *   **Yes:** Go to Node 8.

  ### Node 8: The Architecture Question
  **Is the present representation *accessible* to all reasoning systems within the agent?**
  *   **No:** Go to **Leaf 8**.
  *   **Yes:** **[UNOCCUPIED]** *Leads back to Root.* If the representation is present and universally accessible, the agent is logically omniscient regarding that content.

  ---

  ## The Leaves: Positions and Implications

  ### Leaf 1: The Orthodox Idealization
  *   **Path:** Node 1 (Yes).
  *   **Description:** Logical Omniscience is accepted as a harmless abstraction. The model describes a perfectly rational agent, not a human one.
  *   **Concrete Case (Premises held, conclusion not drawn):** The agent *does* know the conclusion implicitly. The failure to draw it is a performance error, not a lack of knowledge.
  *   **Iterated Knowledge:** Iteration holds indefinitely ($K\phi \to KK\phi$). There is no bottoming out; the agent knows they know, and knows they know they know, ad infinitum, because the accessibility relation is transitive and Euclidean.

  ### Leaf 2: The Deflationary View
  *   **Path:** Node 2 (Yes) → Node 2b (Application).
  *   **Description:** The problem is an artifact of modeling choice. "Knowledge" in logic is a different term than "knowledge" in psychology. The model is valid for its domain (e.g., distributed systems, ideal game theory) and should not be forced to fit human cognition.
  *   **Concrete Case:** The agent does not know the conclusion in the psychological sense, but the logical model was never intended to capture that sense. The attribution of knowledge depends entirely on which vocabulary is in use.
  *   **Iterated Knowledge:** Iteration is valid within the logical model but irrelevant to the psychological reality. The regress does not arise in the psychological domain because the operator $K$ does not apply there.

  ### Leaf 3: Resource-Bounded Account
  *   **Path:** Node 3 (Process) → Node 4 (Time/Steps).
  *   **Description:** Knowing is a state, but accessing it requires computational steps. Agents are bounded by time, memory, or the number of inference steps they can perform.
  *   **Concrete Case:** The agent does *not* yet know the conclusion. They possess the premises, but the derivation requires $n+1$ steps and they have only budgeted for $n$. They will know it if given more time.
  *   **Iterated Knowledge:** Iteration bottoms out quickly. An agent may know $\phi$, but checking that they know $\phi$ costs resources. Eventually, $K^n\phi$ fails because the agent cannot afford the verification cost of the $n$-th level.

  ### Leaf 4: Procedural Account
  *   **Path:** Node 3 (Process) → Node 4 (Algorithmic).
  *   **Description:** Knowing is not having the information, but possessing the *method* or *proof* to generate it. Knowledge is identified with the algorithm itself.
  *   **Concrete Case:** The agent does not know the conclusion until they have executed the algorithm. Merely having the premises is insufficient; they must possess the specific proof procedure that links premises to conclusion.
  *   **Iterated Knowledge:** Iteration is rare. To know that one knows, one must possess a proof that one possesses a proof. This requires higher-order algorithms which are rarely stored, so $KK\phi$ often fails even when $K\phi$ holds.

  ### Leaf 5: Impossible-Worlds Semantics
  *   **Path:** Node 5 (Semantics) → Node 6 (Modify Space).
  *   **Description:** The space of possibilities is expanded to include "impossible worlds" where logical laws (e.g., non-contradiction, modus ponens) fail. Agents can rule out all *possible* worlds where $\phi$ is false, but still leave open an *impossible* world where $\phi$ is false.
  *   **Concrete Case:** The agent does not know the conclusion. There is an impossible world compatible with their knowledge where the premises are true but the conclusion is false. They fail to rule it out because they cannot distinguish logical possibility from impossibility.
  *   **Iterated Knowledge:** Iteration can hold, but it is fragile. An agent might know $\phi$ in all worlds they can distinguish, but fail to know $K\phi$ if there is an impossible world where they fail to know $\phi$. It bottoms out when the agent's discrimination ability reaches the limit of logical complexity they can process.

  ### Leaf 6: Relevance Logic Account
  *   **Path:** Node 5 (Semantics) → Node 6 (Modify Consequence).
  *   **Description:** The consequence relation is restricted. $\phi$ does not automatically imply $\psi$ just because it is classically valid; there must be a relevant connection (e.g., shared content) between antecedent and consequent.
  *   **Concrete Case:** The agent does not know the conclusion if the argument is not "relevant." Even if the argument is classically valid, if the conclusion introduces new content not contained in the premises, the agent does not automatically know it.
  *   **Iterated Knowledge:** Iteration is restricted. $K\phi \to KK\phi$ holds only if the proposition $K\phi$ is relevantly connected to $\phi$. In many relevance systems, this fails, so iterated knowledge is not guaranteed and often bottoms out at the first level.

  ### Leaf 7: Awareness (Implicit/Explicit) Account
  *   **Path:** Node 5 (Syntax) → Node 7 (No).
  *   **Description:** Knowledge requires an awareness component. An agent explicitly knows only what they are aware of (have a syntactic representation for). They implicitly know the rest. Logical Omniscience applies only to implicit knowledge.
  *   **Concrete Case:** The agent explicitly does *not* know the conclusion because they lack the syntactic formula for it in their awareness set. They implicitly know it (it follows from what they are aware of), but this implicit knowledge is not actionable.
  *   **Iterated Knowledge:** Iteration fails for explicit knowledge. An agent can be aware of $\phi$ without being aware of the proposition "I am aware of $\phi$." Explicit knowledge bottoms out immediately; implicit knowledge may iterate but is theoretically inert.

  ### Leaf 8: Fragmented Mind Account
  *   **Path:** Node 5 (Syntax) → Node 7 (Yes) → Node 8 (No).
  *   **Description:** The mind is not a single integrated store but a collection of compartments or fragments. An agent can know $\phi$ in one fragment and $\psi$ in another without ever bringing them together to infer $\chi$.
  *   **Concrete Case:** The agent knows the premises, but they are stored in different fragments. The conclusion is not known because the fragments containing the premises have not been activated simultaneously. The information is present but siloed.
  *   **Iterated Knowledge:** Iteration is fragment-relative. An agent may know $\phi$ in Fragment A, and know in Fragment B that they know $\phi$ in Fragment A, but Fragment B cannot access $\phi$ directly. Iteration bottoms out when the chain of knowledge requires crossing a fragmentation barrier that the agent cannot bridge.

  ---

  ### Note on Unoccupied Space
  **Semantics + Syntax Combinations:** The tree separates Semantic approaches (Leaves 5, 6) from Syntactic approaches (Leaves 7, 8). A position combining *Impossible Worlds* with *Awareness Functions* is theoretically possible but largely **Unexplored**. It is unclear how to define "awareness" of a proposition that is true in an impossible world where truth conditions are non-standard. Most theorists choose one mechanism of hyperintensionality rather than both.
