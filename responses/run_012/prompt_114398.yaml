      *   *Why is MU impossible?* The number of 'I's in any derivable string is never divisible by 3.
      *   *Axiom:* MI (1 'I').
      *   *Rule 1:* $xI \to xIU$ (Doesn't change 'I' count).
      *   *Rule 2:* $Mx \to Mxx$ (Doubles 'I' count).
      *   *Rule 3:* $xIIIy \to xUy$ (Subtracts 3 'I's).
      *   *Rule 4:* $xUUy \to xy$ (Doesn't change 'I' count).
      *   *Invariant:* Start with 1 'I'. Doubling $1 \to 2, 4, 8, 16...$ (powers of 2). Subtracting 3 from a power of 2 never yields a multiple of 3 (modulo 3 arithmetic: $2^n \not\equiv 0 \pmod 3$).
      *   *Target:* MU (0 'I's). 0 is divisible by 3.
      *   *The "Wall":* Students will try to manipulate symbols. They will fail.
      *   *The "Leap":* Realizing they need to count the 'I's (meta-property) rather than manipulate the symbols (object-level).

