answer: |-
  This is a sharp worry. You've identified the exact pressure point where teleosemantics usually cracks under the weight of actual biology. Your roommate is echoing a standard objection from evolutionary game theory (signaling is often manipulation, not information transfer), and your friend is relying on a "cooperative signaling" model that is the *best-case scenario* for teleosemantics, not the norm.

  Here is the audit you asked for.

  ### 1. The Correspondence Table
  Your friend is mapping **Public Signaling** (Bee/Vervet) onto **Internal Representation** (Belief).

  | Feature | Bee Dance / Vervet Call | Belief / Mental State |
  | :--- | :--- | :--- |
  | **Sign** | Waggle dance / Alarm call | Neural state / Propositional attitude |
  | **Referent** | Nectar location / Predator | State of affairs (e.g., "Cat on mat") |
  | **Producer** | Scout bee / Signaler | Sensory/Cognitive system |
  | **Consumer** | **Other bees / Troop members** | **? (Decision system / "Self" / Motor)** |
  | **Selection History** | Hive survival via coordination | Organism survival via guidance |
  | **Normal Function** | Induce flight / Induce climbing | Guide action / Track truth |
  | **Malfunction** | Dance points wrong / False alarm | False belief |
  | **Success Condition** | Receiver behaves appropriately | **World matches content (Truth)** |

  ### 2. Where the Map Breaks
  The analogy looks clean until you try to drive a truck loaded with *propositional content* across it. Here are the structural failures relevant to your friend's conclusion.

  **A. The Consumer Problem (The Homunculus Trap)**
  *   **In the Analogy:** The consumer is distinct from the producer (Bees A and B). This makes the "function" easy to define: The dance functions to *move Bee B*.
  *   **In the Mind:** Who is the consumer of a belief?
      *   If it's a downstream motor system: Motor systems don't care about *truth*, they care about *input*. A reflex arc can be triggered by a false belief. If the function is just to trigger action, a delusion that works (placebo) has the same function as a true belief.
      *   If it's "the self": You've smuggled in a homunculus. Teleosemantics is supposed to eliminate the little man inside reading the map. If the "consumer" is just another neural state, we need a story about why *that* state cares about truth rather than just causal covariance.
  *   **The Break:** The bee analogy hides the hard part. In the hive, the *receiver's* selection history explains the content (the receiver was selected to *use* the dance). In the head, you need to explain why the *action-system* was selected to respect *truth* rather than just *fitness*.

  **B. Truth vs. Fitness (Your Roommate's Objection)**
  *   **In the Analogy:** Your roommate is right. In behavioral ecology, signals are selected for **sender fitness**, not receiver information. A vervet call might be selected to say "Save me!" (imperative) rather than "Leopard!" (indicative). Sometimes the best strategy is deception (false alarms to hoard food).
  *   **In the Mind:** Your friend wants beliefs to have **truth conditions** (indicative). But if biological function tracks **fitness conditions**, they come apart.
      *   *Example:* An organism might be selected to believe "I am stronger than I am" (overconfidence bias) because it wins fights. The belief is false, but the function is preserved.
  *   **The Break:** If function = fitness, and truth ≠ fitness, then teleosemantics naturalizes *successful guidance*, not *truth*. Your friend claims misrepresentation is like a heart failing to pump. But a heart pumping blood is a *causal* success. A belief being *true* is a *semantic* success. The bee analogy conflates "getting the hive food" (success) with "representing nectar location accurately" (truth). You can get food by luck or deception without accurate representation.

  **C. Compositionality and Structure**
  *   **In the Analogy:** Bee dances are analog and continuous (angle = direction, duration = distance). They don't have syntax. You can't negate a waggle dance ("There is *no* nectar that way").
  *   **In the Mind:** Beliefs are compositional and propositional. "The cat is on the mat" shares components with "The dog is on the mat."
  *   **The Break:** Signaling systems rarely support negation, disjunction, or embedding. If the master model is a signal, you can't build a logic out of it. You get "indicators," not "beliefs."

  **D. Absent and Abstract Objects**
  *   **In the Analogy:** Bees dance about *present*, *causally connected* nectar. Vervets call about *present* leopards.
  *   **In the Mind:** I can believe "Napoleon lost at Waterloo" or "2+2=4." There is no causal history of selection linking my brain to Napoleon or numbers in the same way.
  *   **The Break:** Teleosemantics relies on historical causal chains. It handles "There is a tiger" well. It handles "There is no tiger" or "Justice is good" terribly. The bee analogy offers no resources for non-causal, abstract, or negative content.

  ### 3. The Verdict: Does the Naturalization Survive?

  **Straight answer:** No, not on the strength of this analogy alone.

  Your friend is using the bee analogy to do **modal heavy lifting**. He wants the "selected-for" history to fix the content (to rule out causal covariance problems) and to explain normativity (truth/falsity).

  But the analogy only naturalizes **imperative content** ("Go there!", "Run!"), not **indicative content** ("Nectar is there", "Leopard is here").
  *   **Why?** Because in the biological story, the *consumer* is selected to react. The *producer* is selected to elicit reaction. The "truth" of the signal is irrelevant compared to the "uptake" of the signal.
  *   **The Consequence:** If you follow the analogy strictly, you don't get beliefs; you get **Pushmi-Pullyu representations** (a term from Ruth Millikan). These are states that are both descriptive and directive simultaneously (like a duck's threat display: it says "I am aggressive" and "Back off").
  *   **The Fatal Flaw:** To get pure *belief* (indicative only), you need to sever the link to immediate action. But the teleosemantic story *depends* on the link to action to define the function. If the belief doesn't guide action, it has no selected function. If it *does* guide action, its function is success, not truth.

  Your roommate's objection is the knife in the back. If signals are selected for manipulation/benefit rather than information transfer, then "meaning" is not "indication," it is "influence." Your friend has smuggled in the idea that the *receiver* cares about truth. But why would the downstream motor system care about truth? It only cares about survival.

  **Conclusion:** The analogy was quietly doing all the work. It papers over the gap between *fitness* and *truth*. Once you admit that biological function tracks fitness, and that fitness often tolerates (or selects for) false beliefs, the "naturalization of truth" collapses. You've naturalized *use*, not *content*.

  ### 4. A Better Analogy (or a Necessary Shift)

  If your friend wants to save teleosemantics, he needs to stop talking about **Signaling** (Communication) and start talking about **Consumption** (Metabolism/Mapping).

  **The "Map and Compass" Model (Millikan's later view):**
  Instead of the Bee Dance (Producer → Consumer), think of a **Guidance System** (like a missile or a bacterium moving up a glucose gradient).
  *   **The State:** The internal map.
  *   **The Function:** To correspond to the territory *so that* the navigator can reach the goal.
  *   **The Fix:** This separates the *map* (belief) from the *goal* (desire). The map's function is *accuracy*, because a map that lies causes the navigator to fail *systematically*, not just occasionally.
  *   **Why it's better:** It handles the "Consumer" problem better. The consumer is the navigation system, which *needs* accurate input to function, not just *any* input.
  *   **Remaining Issue:** It still struggles with abstract/absent content (maps of nowhere).

  **The Honest Recommendation:**
  Tell your friend to read **Ruth Millikan's *Language, Thought, and Other Biological Categories***, specifically the sections on "Pushmi-Pullyu" representations.
  *   **Admit:** The bee analogy works for *perceptual-motor loops* (seeing a cliff and stopping).
  *   **Concede:** It does *not* work for full-blown propositional belief (believing about the past, logic, or abstracta).
  *   **Pivot:** The project isn't to reduce *belief* to *bee dances*. It's to reduce *intentionality* to *biological function*, acknowledging that human belief is a derived, specialized case that might require language to fully bootstrap (a la Millikan or Papineau).

  If he insists the bee dance *alone* solves the problem of truth-conditional content, he is ignoring the difference between **causing a behavior** and **describing a world**. Your roommate's ecology training has spotted the gap: nature selects for winners, not for truth-tellers.
