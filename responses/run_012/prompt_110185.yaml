      *   **The Fault Lines (Where it breaks):**
          1.  The Consumer Problem (Who receives the belief?).
          2.  Truth vs. Fitness (Roommate's point).
          3.  Compositionality/Structure (Bee dances aren't sentences).
          4.  Distal/Absent Content (Bees don't dance about last week's nectar).
      *   **The Verdict:** Does naturalization survive? No, not on *this* analogy alone. It naturalizes *function*, not *truth*.
      *   **The Fix/Better Analogy:** Shift from Signaling to *Consumption* (Millikan's later work) or *Control Systems*. Acknowledge the "Pushmi-Pullyu" nature.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Make sure I distinguish between Dretske (indicator) and Millikan (consumer function). The friend seems to be mixing them (Dretske's indication + Millikan's malfunction).
      *   *Check:* Ensure I address the "selected to inform" vs. "selected to manipulate" point. This is crucial. If the vervet call is to save *the caller*, not inform the troop, the content might be "Save me!" not "Leopard!"
      *   *Tone:* Keep it peer-to-peer. Use terms like "intensionality," "condition of satisfaction," "Pushmi-Pullyu."

  10. **Final Polish:** Ensure the conclusion is direct. "The analogy was doing all the work, and it's not strong enough."

  *(Self-Correction on the Roommate's point)*: The roommate is echoing the "Selfish Gene" / Game Theory critique of signaling. Honest signaling requires costs (Zahavi's Handicap Principle). If the cost isn't there, deception evolves. If deception is possible, "function" diverges from "truth." This is a killer objection for simple teleosemantics. I need to highlight this.

  *(Plan for "Better Analogy")*: Instead of a *better* analogy, maybe suggest the friend needs to shift from *Signaling* to *Mapping*. But maps don't have functions. How about *Navigation Systems*? They have a goal (destination) and a model (map). But again, biological function? Let's suggest Millikan's "Consumption" model is the technical fix, even if the analogy is less intuitive than bees. Or suggest that the friend is actually describing *Imperatives*, not *Beliefs*.

