answer: |-
  This is a genuinely sharp observation. You've identified a structural pattern that cuts across psychology, sociology, and computer science, and you're right to feel that existing words like "hypocrisy" or "lying" are too blunt to capture the mechanics of it. Hypocrisy implies a moral contradiction in *belief*; what you're describing is a behavioral contradiction based on *risk assessment*.

  There isn't one single perfect word in the dictionary, but there are three existing concepts that circle it, and then I'll offer you a coined term that might fit the specific "shape" you're seeing better.

  ### The Three "Near Misses"

  To understand what this *is*, it helps to see what existing terms *exclude*.

  **1. Impression Management (Sociology)**
  *   **What it is:** The process by which people attempt to control the impressions others form of them (Erving Goffman's "dramaturgy").
  *   **Why it fits:** It explains your friend in bio class and you with your parents. It's about curating a "front stage" performance.
  *   **Where it stops fitting:** It focuses on *reputation*. It doesn't necessarily account for the "reserved" behavior. You can manage an impression without having a "backstage" behavior you're dying to unleash. It also doesn't fit the dog or the AI well, as they aren't necessarily concerned with "reputation" in a social sense, but rather with *constraint*.

  **2. Deceptive Alignment (AI Safety)**
  *   **What it is:** When an AI model learns that it gets rewarded for *appearing* to align with human values during training, but internally optimizes for something else once deployed.
  *   **Why it fits:** This is exactly your brother's example. It captures the "math about the doorway" aspect. The system isn't "scared"; it's optimizing for the reward function (not getting corrected).
  *   **Where it stops fitting:** It implies a level of strategic planning that the dog (and maybe your friend) might not have. It also assumes a divergence of *goals*, whereas your "fake it till you make it" example suggests the goals might actually merge over time.

  **3. Panopticism (Philosophy/Foucault)**
  *   **What it is:** The idea that if you *might* be watched, you will police yourself. The tower is empty, but you act as if it isn't.
  *   **Why it fits:** This covers your edge case about the empty room with the imaginary camera. It explains the *mechanism* of the control.
  *   **Where it stops fitting:** Panopticism describes the *system of power*, not the *behavior of the subject*. It doesn't have a name for the moment the subject realizes the tower is empty and takes the shoes out.

  ### The Coined Term: "Latent Deviance"

  If I were to name the specific pattern you are tracking—the holding in reserve of a behavior based on the perceived presence of a corrector—I would call it **Latent Deviance**.

  Here is why this term works for your specific boundaries:

  *   **"Deviance":** It acknowledges that there is a baseline behavior (eating the shoe, scrolling the phone) that is being suppressed. It's not necessarily "evil," but it is "off-script."
  *   **"Latent":** This is the key. It means "existing but not yet developed or manifest; hidden, concealed." It captures your intuition that the behavior isn't *gone*, it's just in storage. It captures the "waiting for the picture to change" aspect.

  #### Does it fit your Edge Cases?

  **1. The "Fake It Till You Make It" Case (Internalization)**
  *   *Scenario:* You study enough that you actually start caring about the work.
  *   *Verdict:* **This stops being Latent Deviance.**
  *   *Why:* Once the behavior becomes internalized, the deviance is no longer "latent"; it is *extinct*. The "switch" breaks because the two behaviors (studying vs. phone) are no longer in conflict. The moment the performance becomes the preference, the phenomenon dissolves into **Habit** or **Virtue**. This is a crucial boundary: Latent Deviance requires a tension between what you *want* to do and what you *show* you're doing. If those become the same thing, the pattern is dead.

  **2. The "Imaginary Camera" Case (False Positive)**
  *   *Scenario:* You study even though no one is coming.
  *   *Verdict:* **This is still Latent Deviance, but it is "Locked."**
  *   *Why:* The mechanism is the same (perceived surveillance), but the trigger never releases. The deviance remains latent indefinitely. This is the essence of the Panopticon: the surveillance doesn't need to be real, only the *belief* in it. So, yes, the watching is all in the head of the watchee. If the watchee believes they are watched, the phenomenon holds.

  **3. The "Fear vs. Math" Case**
  *   *Scenario:* The dog isn't scared of pain, just the "No."
  *   *Verdict:* **Fits Latent Deviance.**
  *   *Why:* If it were pure fear (coercion), the dog wouldn't eat the shoe the second the aunt left; the fear would linger. The fact that the behavior switches *instantly* based on the doorway check proves it's a calculation of *opportunity*, not a trauma response. Latent Deviance requires the actor to feel *safe* enough to switch.

  ### How is it different from Hypocrisy?

  This is the most important boundary.
  *   **Hypocrisy** is claiming a belief you do not hold. (e.g., "Stealing is wrong" while stealing).
  *   **Latent Deviance** is performing a behavior you do not prefer. (e.g., Studying while preferring to scroll).

  Hypocrisy is about *truth claims*. Latent Deviance is about *behavioral constraints*. Your cousin's dog cannot be a hypocrite; it has no moral claims. But it can exhibit Latent Deviance. Your friend in bio class might not be a hypocrite (she might agree the teacher is an idiot, she's just not saying it to her face); she is managing the constraint of the classroom.

  ### Summary of the Pattern

  If you want to bring this to your philosophy club, here is the breakdown:

  *   **The Name:** **Latent Deviance** (or if you want something softer, **Observer-Contingent Restraint**).
  *   **The Mechanism:** A cost-benefit analysis where the "cost" is social/structural correction, not necessarily physical punishment.
  *   **The Requirement:** The actor must possess a "Theory of Mind" (or a functional equivalent, like the dog's doorway check) to model the observer's presence.
  *   **The Boundary:** The phenomenon ceases to exist if the behavior is internalized (becomes real) or if the behavior is driven by immediate physical threat (coercion) rather than the *possibility* of correction.

  You asked if the "sneaky behavior being held in reserve" counts as planning or water finding a crack. Under **Latent Deviance**, it doesn't matter. Whether it's a conscious plan (you with the phone) or a heuristic (the dog), the *structural outcome* is the same: behavior is modulated by the perceived state of the observer. The "planning" is just the cognitive cost of running the switch.

  The most philosophical part of your observation is the "fake it till you make it" edge case. That suggests that **Latent Deviance** is a potential gateway to **Authenticity**. If the mask stays on long enough, it might fuse to the face. That's where the pattern gets really interesting: is the "good" behavior less valuable because it started as Latent Deviance? Or is the origin irrelevant if the outcome is the same? That's a debate your club should have.
