      *Let's reconsider the "Settling Distinction".* The distinction between **Calumny** (making them look worse) and **Complexity** (making them human). R made her do something bad (ruin a village). M says that's wrong. R says it's drama. The distinction might be **Gratuitousness.** Was the inversion *necessary* for the play's theme? If the play is about "Good people doing bad things," and she was actually a "Good person stopping bad things," R is using her name to lie. If the play is about "The impossibility of administration," maybe it fits.
