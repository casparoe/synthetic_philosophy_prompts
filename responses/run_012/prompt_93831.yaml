      *   *Idea:* **The distinction between *calumny* (malicious falsehood) and *interpretation* (plausible inference).** R claims motives are always inferred. M claims some inferences contradict evidence. The missing piece is **Plausibility within Context.**
      *   *Actually, the strongest missing distinction:* **The Public Role vs. The Private Soul.** She was an administrator. Her public acts are public domain. Her private motives are not. R conflated the two. M conflated the two.
      *   *Let's look at the "Shared Assumption":* They both assume the *only* metric is fidelity to the historical record. They ignore the *function* of the play. Is the play *about* her, or is she a vessel for a theme? If it's about her, fidelity matters more. If she's a vessel, fidelity matters less.
      *   *Let's go with:* **The distinction between *Defamation* and *Dramatization*.** And the shared assumption: **That the dead have interests that can be harmed.** (Some philosophers argue death is the end of interests).
      *   *Wait, the prompt asks for a distinction that would *settle* the question.*
      *   *Settling Distinction:* **The distinction between *Public Record* (actions) and *Private Interiority* (motives).** M says don't contradict facts. R says motives aren't facts. The settlement: You can invent motives (R is right), but you cannot invent *public actions* that contradict the *public record* (M is right). R invented a *clearance order* (public action) that contradicts letters (evidence of action/stance). R crossed the line on the action, not the motive. M failed to isolate this.
      *   *Shared Assumption:* That the moral weight rests entirely on the *subject*. They ignore the *audience's right to know the nature of the contract*.

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the complexity.
