      *   *Shared Assumption:* Both assume the primary relationship is between the *Author* and the *Subject*. They treat the subject as a rights-holder or a victim.
      *   *Missing Distinction:* **Public Figure vs. Private Individual** (or Degree of Public Significance). A district administrator is a public official. Their actions are public record. Their *interiority* is not.
      *   *Better Distinction:* **The Contract with the Audience.** It's not just about the dead woman. It's about the audience's trust. Is the play sold as "Based on a True Story" or "Inspired by"?
      *   *Even Better Distinction:* **The Nature of the Invention (Action vs. Interiority).** M tries to draw this (Gap vs. Fact), but R dismantles it regarding motives. The real distinction might be **Narrative Necessity vs. Gratuitous Defamation.** Did the invention serve the art, or was it just cruelty?
      *   *Best Missing Concept:* **The Duty to the Historical Record vs. The Duty to the Art.** But more specifically, **The Distinction between *Character* and *Person*.** Once you put someone in a play, they become a character *named* X. The ethical duty is to signal the transformation.
