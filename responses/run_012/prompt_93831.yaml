      *(Self-Correction during drafting)*: In Move 6, R says "M writes biographies." M might argue biography has different norms than drama. I need to note that.
      In Move 4, R's argument about "hit vs flop" is a bit of a straw man against M's "circulation" point, but it highlights the absurdity of making morality contingent on success. I should note that.
      In Move 5, M's "Gap vs. Contradiction" is the standard historical fiction defense. R's critique of *motives* is the weak point in that defense.
