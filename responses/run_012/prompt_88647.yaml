  So I'm a backend engineer, zero philosophy training, and I've gotten into a dumb argument with a friend about some betting choices and now I can't stop thinking about it. I want to know if there's actually one rule behind what I'd pick, or if my gut is just incoherent. Here's what I said, going on instinct for each one:

