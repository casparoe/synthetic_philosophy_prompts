prompt: |-
  I sit on a county fatality review panel that examines the deaths of adults with intellectual and developmental disabilities living in licensed group homes. We take up three or four deaths a month. I have no training in philosophy — I spent twenty years in freight logistics before this — but the panel's central question is one I have been chewing on by myself for a long time: when a resident dies and the people responsible for them did not do something, did their not doing it cause the death? Our reports go to the state licensing agency and get quoted in the local paper, so the wording matters to real people's jobs and to the facility's license.

  Our current practice is to write findings the way a lawyer would, asking only whether the death would have been avoided had the thing been done, then letting the panel argue over whether to attach the word cause. It goes badly. Two members reviewing the same file come back with opposite findings, and the strength of the language in our public report depends on who happens to be in the room. I want a written procedure the panel can run, case by case, to decide whether a given omission is a cause of a death. Ground it in whatever philosophy has worked out about causation by omission, because I think our problem is philosophical rather than merely editorial.

  Here are the pieces I have managed to get straight on my own, and that the procedure has to handle. An omission is not an event: there is no place and no moment at which it happened, so the ordinary test — had she done it, the death would not have occurred — is carrying a great deal of weight, and I suspect it is carrying too much. For any death there are countless things nobody did, and something has to pick out the one or two omissions we are willing to call causes; I do not believe the counterfactual test alone can do that picking. My own hunch is that what does the picking is the presence of a duty or an expectation — that a norm was in play — which would mean our findings are partly judgments about what people owed one another, dressed up as findings about what happened. And the same omission can belong to a person, to a shift, or to an institution, and I do not know how to say which of those caused the death when the honest answer is a bit of each.

  The procedure should be an ordered list of questions, with a rule for when to stop, what counts as a sufficient answer at each step, and an explicit mark at the points where the step is not a factual test at all but a decision about what standard to hold people to. Those are the steps I need to be able to point to, because the board will ask. It must be runnable by me in under an hour with the file open, with no philosopher in the room, and it must produce findings that survive a lawyer and a nurse on the panel taking them apart.

  Then run it on three cases: a resident in status epilepticus whose aide did not call for an ambulance at the threshold written into the protocol; a resident who choked during a meal on a shift when the home was one aide short of its licensed staffing ratio, where the missing aide would have been in a different room and probably could not have helped; and a resident who died of an untreated infection after a family member refused the treatment and the physician did not press the point.

  One of those three should come out in a way the panel will not like, and I want you to say so plainly, since I will be the one presenting it. Finish by telling me what the procedure cannot do, and where it will hand me a confident-looking answer that a better philosopher would call arbitrary.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Member of a county fatality review panel (adults with IDD in group homes). Background in freight logistics, not philosophy.
      *   **Problem:** Inconsistent findings on "causation by omission." Current method (legalistic counterfactual test) leads to subjective arguments and inconsistent public reports.
      *   **Goal:** A written, step-by-step procedure (algorithm/checklist) to determine if an omission *caused* a death.
      *   **Constraints:**
          *   Grounded in philosophy of causation by omission (but usable by non-philosophers).
          *   Must handle the "countless omissions" problem (why *this* omission?).
          *   Must address the role of duty/norms.
          *   Must handle attribution (person vs. shift vs. institution).
          *   Must be runnable in <1 hour.
          *   Must survive scrutiny from lawyers and nurses on the panel.
          *   Must explicitly mark where normative judgments (standards) are made vs. factual tests.
          *   Must apply to three specific cases.
          *   Must admit limitations (where the answer is arbitrary).
      *   **Tone:** Professional, precise, pragmatic, honest about limitations.

  2.  **Philosophical Grounding (Mental Sandbox):**
      *   *The Problem of Negative Causation:* Omissions aren't events. If I don't breathe, I die. If the President doesn't breathe, I die. Why is my not-breathing the cause and not the President's?
      *   *Counterfactual Dependence:* "But-for" test (If X had happened, Y wouldn't have). As the user noted, this is too broad.
      *   *Normative Expectations:* Hart & Honoré, Lewis, McGrath. Causation by omission usually relies on a breach of duty or a normal course of events. We select omissions that violate a norm.
      *   *Proximate Cause/Scope of Risk:* Was the omission within the scope of the risk created?
      *   *Control/Capacity:* Could the agent actually have done it?
      *   *The Procedure:* Needs to move from Fact -> Counterfactual -> Norm -> Attribution.

  3.  **Drafting the Procedure (The "Omission Causation Protocol" - OCP):**
      *   *Step 1: Factual Baseline.* What actually happened? (Logistics mindset fits here).
      *   *Step 2: The Counterfactual.* Would the action have prevented death? (Medical/Technical).
      *   *Step 3: The Normative Filter.* This is the crux. Was there a duty? Is this the *right* omission to blame? (Hart & Honoré's "duty to act").
      *   *Step 4: Capacity/Control.* Could they actually have done it? (No "ought implies can" violations).
      *   *Step 5: Attribution.* Who owns the omission? (Individual vs. System).
      *   *Stop Rules:* If any step fails, stop. No causation.
      *   *Marking Normative Steps:* Explicitly label where we are making a value judgment, not a fact finding.

  4.  **Refining the Procedure for the User's Context:**
      *   Needs to be robust against lawyers (clear definitions) and nurses (medical reality).
      *   Needs to address the "countless omissions" problem. The "Normative Filter" is the key here. We only care about omissions where there was a *specific, assigned expectation*.
      *   Needs to handle the "Person vs. Institution" problem. Step 5 needs to distinguish between *failure to execute* (person) and *failure to resource* (institution).

  5.  **Applying to the Three Cases:**

      *   *Case 1: Seizure/No Ambulance.*
          *   Fact: Seizure happened. Protocol said call. Aide didn't call.
          *   Counterfactual: Ambulance likely saves/status epilepticus is time-sensitive.
          *   Norm: Explicit protocol exists. Duty is clear.
          *   Capacity: Aide could call.
          *   Attribution: Individual aide (mostly), maybe training.
          *   *Result:* Causation established.

      *   *Case 2: Choking/Short Staffing.*
          *   Fact: Choked. One aide short. Missing aide would be in another room.
          *   Counterfactual: *Would* the missing aide have helped? If they were in another room, probably not immediately. Choking is fast.
          *   Norm: Staffing ratio is a regulatory norm. But does the *absence* cause the choke?
          *   Capacity: The missing aide *couldn't* be in two places.
          *   *Result:* This is the tricky one. The omission (not being there) didn't change the outcome *in that moment* even if they were there. The counterfactual fails on *efficacy*, not just duty. Or, the norm is systemic, but the causal link is weak. *Wait, let's look closer.* If the ratio was met, would someone have been in *that* room? If yes, causation. If the missing aide was floating and still wouldn't have been there, causation is weak. The prompt says "probably could not have helped." This suggests the counterfactual fails.
          *   *Decision:* This should be the one the panel dislikes. It absolves the facility of *causing* the death, even if they violated staffing rules. It distinguishes "violation" from "cause."

      *   *Case 3: Infection/Family Refusal/Doctor Passive.*
          *   Fact: Infection. Family refused. Doctor didn't press.
          *   Counterfactual: If Doctor pressed (ethics consult/court order), treatment might happen, life saved.
          *   Norm: Doctor has a duty to advocate for patient welfare vs. family autonomy.
          *   Capacity: Doctor could have escalated.
          *   Attribution: Medical/Institutional.
          *   *Result:* Causation lies with the Doctor/System for not escalating, *not* the family (usually). This might be uncomfortable because it blames the medical authority over the family's wish.

      *   *Re-evaluating Case 2 vs Case 3 for the "Unpopular" outcome:*
          *   Case 2 (Staffing): Finding "No Causation" is unpopular. Facilities hate being understaffed, but if the understaffing didn't *change the outcome*, calling it a cause is philosophically dishonest. This fits the user's "countless omissions" point.
          *   Case 3 (Doctor/Family): Finding the Doctor caused it by not overriding the family is also controversial.
          *   *Selection:* Case 2 is the strongest candidate for "Unpopular." Panels *want* to blame understaffing for deaths. If the procedure says "Understaffing is a violation, but not the *cause* of this specific choke because the extra aide wouldn't have been in the room," that will cause friction. It highlights the difference between *risk creation* and *specific causation*.

  6.  **Addressing Limitations:**
      *   The "Normative Filter" is inherently political/moral.
      *   Counterfactuals are always speculative (would the ambulance have arrived in time?).
      *   Attribution (Person vs. System) is often a policy choice, not a fact.

  7.  **Drafting the Content:**
      *   *Introduction:* Acknowledge the user's insight (norms select omissions).
      *   *The Protocol:* Numbered steps, clear Stop rules, "Normative Judgment" flags.
      *   *Case Studies:* Apply the protocol rigorously.
      *   *The Unpopular Finding:* Highlight Case 2.
      *   *Limitations:* Be honest about the "arbitrary" nature of norm selection.

  8.  **Refining the Tone:**
      *   Avoid academic jargon where possible (explain "counterfactual" simply).
      *   Keep it logistical/operational (like the user's background).
      *   Ensure the "Normative Judgment" flags are visible (e.g., [JUDGMENT CALL]).

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Person vs. Shift vs. Institution" issue?
      *   *Fix:* Add a specific step for "Locus of Control."
      *   *Check:* Is it under an hour?
      *   *Fix:* Keep questions binary (Yes/No) where possible.
      *   *Check:* Did I ground it in philosophy?
      *   *Fix:* Reference the "Duty/Norm" filter as the solution to the "infinite omissions" problem (Hart/Honoré/McGrath).
      *   *Check:* Case 2 logic. If the aide was missing, who was watching the resident? If the resident was alone, the *present* aide omitted supervision. If the resident was with a present aide, the *missing* aide is irrelevant. The prompt says "missing aide would have been in a different room." This implies the resident *was* supervised, just perhaps less intensively? Or the resident was unsupervised because everyone was stretched? I need to be precise. If the missing aide would *still* not have been in the room, their absence is not the cause. The cause might be the *present* aide's omission, or no one's. I will structure the finding to show that *understaffing* is a violation, but not necessarily the *cause* of the choke.

  10. **Final Polish:** Ensure the distinction between "Violation" and "Cause" is clear. This is the key to solving the panel's inconsistency.

  *(Self-Correction on Case 2)*: The prompt says "missing aide... probably could not have helped." This is the key. If the counterfactual "If the aide was there, death is avoided" is false, then causation fails. This is the unpopular finding. Facilities will be cited for staffing violations, but not for *causing the death*. This protects the integrity of the "cause" label.

  *(Self-Correction on Case 3)*: The doctor's omission. Is it a cause? If the doctor has a duty to advocate for the patient over the family (in IDD contexts, often yes, via guardianship laws or ethical mandates), then failing to escalate is an omission. This might also be unpopular (blaming the doctor). But Case 2 is more structurally problematic for a review panel that wants to link systemic issues (staffing) to outcomes. I'll stick with Case 2 as the primary "unpopular" one, but acknowledge Case 3's tension. Actually, Case 3 is better for showing the "Normative" weight. Let's make Case 2 the "No Cause" finding (Unpopular because it lets the facility off the hook for the death, though not the violation) and Case 3 the "Cause" finding (Unpopular because it blames the doctor for respecting family wishes). I will focus on Case 2 as the one the panel won't like because it decouples staffing from death.

  *Wait, looking at the prompt again:* "One of those three should come out in a way the panel will not like."
  Case 1 is clear cut (Cause).
  Case 2 is the staffing one. Panels *love* to blame staffing. If the procedure says "Not the cause," that's unpopular.
  Case 3 is the medical autonomy one. If the procedure says "Doctor caused it," that's unpopular with medical staff.
  I will choose Case 2 as the primary "Unpopular" one because it directly addresses the user's concern about "institution vs person" and the temptation to blame systemic understaffing for specific accidents where the link is tenuous.

  Let's write it.cw
answer: |-
  ### The Omission Causation Protocol (OCP)

  **Purpose:** To standardize findings regarding causation by omission in fatality reviews.
  **Time Requirement:** <60 minutes per case file.
  **Philosophical Basis:** This procedure adopts the "Normative Expectation" theory of omission causation (associated with philosophers H.L.A. Hart and Tony Honoré). It accepts that while countless things *were not done* prior to a death, only omissions that violate a specific, assigned duty are candidates for causation. It distinguishes between a **Violation** (breaking a rule) and a **Cause** (changing the outcome).

  **Instructions:** Answer the questions in order. If any step results in a "STOP," the omission is **not** a cause of death. You may still cite it as a violation in a separate section of your report, but it cannot be listed in the "Cause of Death" or "Contributing Factor" section.

  **Legend:**
  *   **[FACT]:** This step requires evidence from the file (logs, medical records, interviews).
  *   **[JUDGMENT]:** This step requires a normative decision about standards and duties. This is where the panel must agree on what is expected, not just what happened.

  ---

  #### Step 1: Identify the Specific Omission
  **[FACT]**
  Define the omitted action precisely. Avoid vague terms like "lack of care."
  *   *Format:* "Actor X did not perform Action Y at Time Z."
  *   *Example:* "Aide Smith did not call 911 at 14:00."
  *   *Rule:* If you cannot name the specific actor and the specific action, STOP. (You have identified a system failure, not a causal omission).

  #### Step 2: The Counterfactual Test
  **[FACT]**
  Ask: If Actor X had performed Action Y at Time Z, would the death have been prevented with reasonable medical certainty?
  *   *Evidence:* Medical examiner opinion, hospital records, protocol efficacy data.
  *   *Rule:* If the answer is "No" or "Uncertain/Speculative," STOP. (An omission cannot cause a death if doing the thing wouldn't have saved the life).

  #### Step 3: The Normative Filter
  **[JUDGMENT]**
  Ask: Was there a specific, enforceable duty requiring Actor X to perform Action Y at Time Z?
  *   *Criteria for Duty:*
      1.  **Written:** Is it in a care plan, protocol, or license requirement? OR
      2.  **Customary:** Is it a standard industry practice (e.g., Heimlich maneuver during choking)?
      3.  **Assigned:** Was this specific actor responsible for this specific task at this specific time?
  *   *Rule:* If the duty is vague, implied, or belonged to someone else, STOP.
  *   *Note:* This step solves the "countless omissions" problem. The President did not call the ambulance, but he had no duty. The Aide had a duty. Only the Aide's omission is a candidate for cause.

  #### Step 4: Capacity and Control
  **[FACT]**
  Ask: Did Actor X have the physical and logistical ability to perform Action Y at Time Z?
  *   *Evidence:* Training records, physical proximity, equipment availability.
  *   *Rule:* If the actor was physically unable to act (e.g., restrained, unconscious, or physically located where the action was impossible), STOP. (Ought implies can).

  #### Step 5: Locus of Attribution
  **[JUDGMENT]**
  Ask: To whom does the omission belong?
  *   *Options:*
      1.  **Individual:** The actor was trained, resourced, and present, but chose not to act.
      2.  **Shift/Supervisory:** The actor was present but confused, overruled, or distracted by systemic chaos.
      3.  **Institutional:** The actor could not act because the institution failed to resource the duty (e.g., no phone, no training, understaffed to the point of impossibility).
  *   *Rule:* Select the primary locus. If Institutional, the "Cause" is the policy failure, not the individual's inaction.
  *   *Note:* This prevents blaming line staff for systemic traps.

  #### Step 6: Final Determination
  **[OUTPUT]**
  *   If Steps 1–5 are passed: **The omission is a Cause of Death.**
  *   If any Step resulted in STOP: **The omission is a Violation (if Step 3 was met) or an Incident Factor, but NOT a Cause of Death.**

  ---

  ### Application to Case Files

  Here is the protocol applied to your three scenarios.

  #### Case 1: Status Epilepticus (The Protocol Breach)
  *   **Facts:** Resident seizures. Protocol: Call ambulance if seizure > 5 mins. Aide waited 20 mins. Resident died.
  *   **Step 1 (Omission):** Aide did not call 911 at minute 5. **[PASS]**
  *   **Step 2 (Counterfactual):** Medical opinion: Status epilepticus is time-sensitive. Ambulance arrival at minute 10 likely prevents fatality. **[PASS]**
  *   **Step 3 (Norm):** Written protocol exists. Aide was trained on protocol. Duty is specific. **[PASS]**
  *   **Step 4 (Capacity):** Aide had access to a phone. No physical barrier. **[PASS]**
  *   **Step 5 (Attribution):** Aide was trained and alone in the decision loop. **Locus: Individual.**
  *   **Finding:** **Causation Established.** The omission caused the death.

  #### Case 2: Choking (The Staffing Shortage)
  *   **Facts:** Resident choked during dinner. Home was 1 aide short of licensed ratio. Missing aide was assigned to a different wing. Present aide performed Heimlich but failed. Resident died.
  *   **Step 1 (Omission):** The Facility did not provide the second aide. (Or: The Missing Aide did not appear). **[PASS]**
  *   **Step 2 (Counterfactual):** *Critical Test.* If the second aide had been on shift, would the death have been prevented?
      *   *File Evidence:* The missing aide's assigned post was in a different wing. Choking death occurs in 4–6 minutes. Even if present, they would not have been in the dining room at that exact moment unless staffing deployment was different.
      *   *Medical Opinion:* "Probably could not have helped."
      *   *Result:* The presence of the second aide does not meet the "reasonable certainty" standard for prevention. **[STOP]**
  *   **Finding:** **No Causation.**
      *   *Report Language:* "The facility was in violation of staffing ratios. However, the evidence does not support a finding that the missing aide's presence would have prevented the asphyxiation. The staffing omission is cited as a Regulatory Violation, not a Cause of Death."

  #### Case 3: Infection (The Passive Physician)
  *   **Facts:** Resident develops sepsis. Family (legal guardians) refuses antibiotics due to religious belief. Physician accepts refusal without seeking court order or ethics review. Resident dies.
  *   **Step 1 (Omission):** Physician did not escalate to legal/ethics review to override refusal. **[PASS]**
  *   **Step 2 (Counterfactual):** Antibiotics treat sepsis. If court order obtained (standard timeline 24-48hrs), treatment likely successful. **[PASS]**
  *   **Step 3 (Norm):** Medical ethics and state IDD law place a duty on the physician to advocate for the life of a vulnerable adult when guardians' decisions appear life-threatening. **[PASS]** *[JUDGMENT]*
  *   **Step 4 (Capacity):** Physician had legal mechanism to petition. **[PASS]**
  *   **Step 5 (Attribution):** Decision rested on medical authority. **Locus: Institutional/Professional.**
  *   **Finding:** **Causation Established.** The physician's omission to escalate caused the death.

  ---

  ### The Unpopular Finding

  **Case 2 (The Choking/Staffing)** will be the finding your panel dislikes.

  **Why:** Panels often want to link systemic understaffing directly to death. It validates the narrative that "funding saves lives." However, under this protocol, if the missing aide would not have been in the room *anyway*, their absence is not the *cause* of the choke. It is a violation of the license, and it creates *risk*, but it did not cause *this* death.

  **The Friction:** Your licensing colleagues will argue that if the ratio were met, the deployment *might* have been different.
  **The Rebuttal:** Use Step 2. "Might" is not causation. If we list this as a cause, we are saying the facility killed the resident by being short-staffed, even if the extra staff wouldn't have saved them. That dilutes the meaning of "cause" for Case 1, where the aide actually could have saved the resident. If everything is a cause, nothing is.

  ### Limitations and Arbitrary Points

  You asked where a better philosopher would call this arbitrary. Here is where the procedure hides its seams:

  **1. The Normative Filter (Step 3) is Political, Not Factual.**
  The procedure treats "Duty" as a checkbox. But who writes the duty? In Case 3, I assumed the physician had a duty to override the family. A different panel, or a different county, might rule that family autonomy is the higher norm. If the norm changes, the causation finding flips. The procedure cannot tell you what the norm *should* be; it only forces you to admit you are choosing one.
  *   *Risk:* You will be accused of making moral judgments disguised as factual findings. You are. Own it.

  **2. The Counterfactual Speculation (Step 2).**
  In Case 2, we decided the extra aide "probably could not have helped." That is a guess. In Case 1, we decided the ambulance "likely prevents fatality." That is also a guess. Medicine is probabilistic. The procedure forces a binary (Yes/No) onto a probability.
  *   *Risk:* A lawyer will ask, "What is the percentage threshold for 'likely'?" The procedure has no answer. It relies on the Medical Examiner's confidence, which varies by person.

  **3. The Locus of Attribution (Step 5).**
  Distinguishing between "Individual" and "Institutional" is often a policy choice. In Case 1, if the aide was overworked and tired because of *other* staffing issues, is it still Individual? The procedure forces you to pick one primary locus to keep the report clean.
  *   *Risk:* You may absolve the institution of a culture of fatigue by pinning the "Individual" label on a burned-out worker. The procedure stops you from digging into the "why" of the omission once causation is established.

  **4. The "Countless Omissions" Boundary.**
  I have solved this by requiring a "Specific Duty." But what about the omission of the *state* to fund the home better? They had a duty to license safely. They omitted adequate oversight. Why isn't the State a cause?
  *   *Risk:* The procedure draws the circle of causation around the licensed facility. It excludes broader societal causes. This is practical for your mandate, but philosophically incomplete.

  ### Final Advice for the Panel

  When you present this, tell them: *"This procedure does not find the Truth. It finds Consistency. It separates Regulatory Violations from Causes of Death. We can cite a facility for being understaffed without lying and saying the understaffing killed the resident if the medical evidence doesn't support it. This protects the credibility of the reports when we do find causation."*

  If they balk at Case 2, remind them: *"If we call this a cause, we must call the President's failure to fund healthcare a cause too. We need a limit. This is the limit."*
