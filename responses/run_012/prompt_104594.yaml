answer: |-
  The light in the office was turning the color of bruised plums, sliding slowly up the wall behind Dr. Evans's empty chair. Eleanor watched the shadow creep over the framed medical degree, then over the certificate of ethics, until it reached the corner where the ceiling met the plaster. She had until the sun dropped below the parking lot fence. After that, the clinic locked up, and the offer expired.

  On the desk lay a single sheet of paper, heavy and cream-colored, alongside a pen that felt expensive, weighted like a tool rather than a disposable thing. The text was simple. No legalistic loopholes, no hidden fees. It was a neural recalibration. It would not change the past. The divorce from Mark would remain a fact in the public record. The termination from the firm would stay on her employment history. The silence from Sarah, her daughter, would continue to occupy the phone line.

  What would change was the weight of those facts inside her skull. The grief would be recontextualized as resilience. The regret would be metabolized into wisdom. She would wake up tomorrow believing, with absolute conviction, that every wound had been necessary stitching. She would feel her life was a success. She would not know she had been treated.

  Eleanor rubbed her thumb over the ridge of her knuckle. She was sixty-four. Her joints ached when it rained. Her heart carried the specific, dull throb of a woman who had spent twenty years apologizing for taking up space.

  She thought of Claire. Her sister had died three years ago, lungs collapsing like wet paper. In the final weeks, Claire had refused the morphine that would have clouded her mind, choosing instead the raw, jagged edge of consciousness. But later, when the pain became a wall she couldn't climb, she had whispered to Eleanor, *Why suffer if you don't have to? If the end is the same, doesn't the peace matter more?*

  Claire would sign the paper. For Claire, the texture of the experience was the only truth that counted. If the inside of the life felt like warmth, then the life was warm. The external weather didn't matter. If Eleanor signed, she would feel the relief of a burden dropped. She would sleep through the night. She would look in the mirror and see a survivor instead of a victim. The ache in her chest would vanish, replaced by a quiet hum of contentment. Wasn't that enough? To stop the bleeding, even if the scar remained? To finally rest?

  Eleanor picked up the pen. It was cool against her skin.

  Then she heard Sarah's voice. Not a memory of a shout, but the quiet disappointment from the last time they spoke, five years ago, in this very city. *I don't need you to be happy, Mom. I need you to be real.* Sarah wanted a mother who faced the wreckage, who looked at the divorce and admitted she had been cruel, who looked at the lost job and admitted she had been careless. Sarah wanted reconciliation based on the truth of what had happened, not a chemical adjustment that pretended the pain was purposeful.

  If Eleanor took the treatment, she would call Sarah. She would speak with love. But it would be a love manufactured by a procedure. Sarah wanted a mother who chose to grow, not one who was edited. To sign the paper was to violate the desire for authenticity that hung between them. It was to choose the comfort of the illusion over the possibility of the real thing. If the goal of a life was to get what you actually wanted—and Eleanor wanted her daughter back—then this shortcut was a lie. It gave her the feeling of resolution without the substance. It satisfied the hunger with a picture of food.

  Eleanor set the pen down. The click sounded loud in the quiet room.

  She looked out the window. The parking lot was emptying. A janitor was pushing a broom across the concrete outside, sweeping up leaves that had fallen from the oak trees. They were dead leaves, brown and curled. He was gathering them to burn them or mulch them. He wasn't pretending they were green.

  Arthur would never have signed. Her old mentor, the man who had taught her ethics at the university before she left academia for the corporate world, used to say that a life was like a novel. *You can't just rewrite the third act because the protagonist suffered too much,* he had told her once over whiskey. *If the struggle wasn't earned, the victory is cheap. If the peace isn't forged, it's just sedation.*

  For Arthur, the value of a life wasn't just in how it felt, or even what the person wanted. It was in what the life *was*. A life of genuine achievement required genuine obstacles. If you removed the sting of the failure, you removed the lesson. If you convinced yourself the betrayal was necessary, you lost the ability to recognize betrayal in the future. There was an objective standard to a life well-lived, something outside the mind's perception. A happy delusion was still a delusion. A life built on a lie about its own history was a failed life, no matter how much the person smiling through it believed otherwise.

  Eleanor looked at her hands. They were spotted with age. She had worked for them. She had suffered for them. To erase the sting of the suffering felt like a betrayal of the work.

  But God, she was tired.

  The shadow had reached the top of the doorframe. The light was gone from the floor. The room was cooling down.

  If she said yes, the woman who walked out of this building would be lighter. She would buy a ticket to Italy. She would call Sarah and mean it, even if the meaning was engineered. She would die with a smile on her face. Was there any moral obligation to suffer? Was there a duty to remain broken just to prove the break was real?

  If she said no, she would drive home to the quiet house. She would pour a glass of wine. She would sit in the dark and feel the familiar tightening in her throat. She would wait for a call that might not come. She would carry the heavy, jagged truth of her mistakes until her heart stopped. But it would be her truth. It would be the life she had actually lived, not the life she had been tuned to remember.

  The door handle turned. Dr. Evans stepped back inside. He didn't turn on the overhead light; he let the room stay in the twilight, respectful of the gravity of the moment. He sat down, folding his hands on the desk. He didn't look at the paper. He looked at Eleanor.

  "The sun is down, Mrs. Vance," he said softly. "We need to know."

  Eleanor looked at the pen. It lay parallel to the edge of the desk. A straight line.

  She thought of Claire's hand in hers, thin and hot, choosing clarity over comfort until the end.
  She thought of Sarah's back, walking away down the airport terminal, wanting a mother who could stand on her own two feet without chemical supports.
  She thought of Arthur's study, the smell of old books, the idea that some things matter even if no one feels them matter.

  She thought of herself. The woman who woke up at 3:00 AM with the taste of ash in her mouth. The woman who wanted to sleep.

  Her fingers moved. They hovered over the pen. The metal was still cool. She could feel the ridges of the grip.

  If she picked it up, the pain would end. The story would become a hero's journey.
  If she left it, the pain would stay. The story would remain a tragedy.

  Dr. Evans waited. He had seen this before. He knew that some people wanted to be saved from themselves, and some people wanted to be saved for themselves. He knew that there was no right answer that fit in a chart.

  Eleanor's hand descended. Her fingers closed around the barrel of the pen. She lifted it. The weight was significant, pulling at her wrist. She brought the tip to the paper, just above the line marked *Signature*.

  The ink hovered a millimeter above the cream surface. She could feel the tension in her shoulder, the tightness in her jaw. She could feel the reality of the moment, sharp and unedited.

  She pressed down.
