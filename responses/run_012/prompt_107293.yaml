prompt: |-
  Ok so I'm in this metaethics seminar and our first assignment is to write up our own position on the is-ought gap / naturalistic fallacy stuff and then defend it in class, and I want to pressure-test my list before I commit to it on paper, because I have a nagging feeling that a couple of these don't actually hang together but I honestly can't tell which ones. Here's where I've ended up after the Hume and Moore readings:

  (1) The is-ought gap is real and it's not just some boring logical triviality — it's telling us something substantive, namely that you can never derive a genuine normative conclusion out of purely descriptive premises; you always need a normative premise in the mix somewhere. (2) I'm a moral naturalist: I don't believe in any spooky non-natural moral properties, so if there are moral facts at all they've gotta be natural facts of some kind (facts about welfare or desires or whatever). (3) I think Moore's naturalistic fallacy is a real fallacy, and the open question argument basically nails it — 'good' just can't be analyzed in purely descriptive terms. (4) I'm definately confident that moral knowledge is real and that it's continuous with empirical inquiry; figuring out what's good isn't some totally separate faculty from figuring out how the world works. (5) And I'm a realist, so moral truths don't depend on what you or I or anyone else happens to think.

  One more thing I can't figure out where to file: I think if someone shows you that the cheap phone you just bought was assembled using cobalt dug out by kids in awful conditions, that fact by itself gives you a reason to feel bad and want a different phone — I don't feel like I need some extra premise bolted on to get from "kids suffered to make this" to "I have a reason to care."

  So could you audit this for me? Which of these are actually pulling against each other and which only look like they are, how bad is each conflict (rank them, please don't just declare them all equally a problem), and for each real one, what's the cheapest thing I could tweak or drop and what would that cost me? I want an actual audit with an ordering, not a survey that flags everything.
