prompt: |-
  Okay, I'm a science and ideas reporter at a mid-size outlet and I've got a problem I keep having and I finally want to fix it properly instead of just feeling bad about it. Here's the shape of it: I get a story to a decent state fast — a couple of sources, the main paper, the obvious skeptic — and then I keep going. One more phone call, one more study, someone on a message board says I really should talk to this other guy, and two days later I file something that's late and, honestly, no better than what I had on Tuesday, sometimes worse because now it's a mush of everybody's caveats. A friend who did a PhD told me this is exactly what Herbert Simon was on about with satisficing and bounded rationality, and that I should stop trying to optimize. Great, but "good enough" is not a procedure. Can you actually turn the theory into one I can run on a deadline?

  What I want, in order: the questions I ask myself as a story develops, what counts as a real answer to each, where the procedure stops and says file it, and — this is the part I care about most — how and when I'm allowed to move the bar. Because I've definately noticed the bar moves on its own: after a big story lands I suddenly want more for the next one, and after a bad week I'll file almost anything to get something up. Is that movement the theory, and should I lean into it or fight it? Also please don't hand me a dressed-up version of trust your gut — if a step is really just a judgment call, say so instead of making it look mechanical. And be straight about which parts of the theory are descriptive (how people actually do decide) versus how I'm supposed to decide, because I've read enough pop versions to know those two got blurred together and I don't want to inherit the blur.

  Then run it on two or three of my actual-ish situations. I want one where the procedure tells me to stop and file now and I won't like that answer, and one where it tells me to keep going even though I'm bored and the piece already feels done. And say what the procedure can't do — I assume there's a case where the one thing I haven't checked is the whole story, and no stopping rule saves me from that. Keep it in plain language, I'm not going to go read Simon, I just want the machine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Science and ideas reporter at a mid-size outlet. Experienced enough to recognize patterns (over-reporting, diminishing returns) but struggling to implement a fix.
      *   **The Problem:** Perfectionism/optimization loop. Gets to a "decent state" quickly, then keeps adding sources/studies based on external nudges (message boards, etc.), resulting in late filing and "mushy" stories.
      *   **Theoretical Framework:** Herbert Simon's *Satisficing* and *Bounded Rationality*.
      *   **The Goal:** Turn theory into a concrete *procedure* (algorithm/checklist) for deadlines.
      *   **Specific Requirements:**
          1.  Questions to ask during story development.
          2.  What counts as a "real answer" to each.
          3.  Where the procedure says "stop and file."
          4.  How/when to move the bar (aspiration level adjustment).
          5.  Distinguish between *descriptive* (how people decide) vs. *prescriptive* (how to decide) theory.
          6.  No "trust your gut" disguised as mechanics. Admit when it's a judgment call.
          7.  Run the procedure on 2-3 hypothetical scenarios (one where it says stop [unpleasant], one where it says go [boredom], one limitation).
          8.  Plain language. No academic jargon without explanation.

  2.  **Deconstruct the Theory (Simon's Satisficing):**
      *   *Descriptive:* Humans don't maximize utility because they can't (cognitive limits, information costs). We search until we hit an "aspiration level."
      *   *Prescriptive:* To be efficient, set the aspiration level *before* searching. Adjust it based on feedback (success/failure), not based on anxiety or availability of new info.
      *   *Key Concept:* The "Stopping Rule." Search stops when criteria are met, not when information runs out (it never does).
      *   *Key Concept:* "Aspiration Level Adjustment." If criteria are too easy (always met too fast/quality drops), raise them. If too hard (never met/miss deadlines), lower them. *Crucially:* Do not adjust based on the *presence* of more info, but on the *outcome* of previous decisions.

  3.  **Drafting the Procedure (The "Machine"):**
      *   Need to translate "Aspiration Level" into journalistic terms. Let's call it the "Publication Threshold."
      *   Need specific questions.
          *   Q1: Core Claim. (Is the main finding supported?)
          *   Q2: Independent Verification. (Is there one outside voice?)
          *   Q3: Major Counter-argument. (Is the strongest objection addressed?)
          *   Q4: Stakes/Context. (Does the reader know why this matters?)
      *   Define "Real Answers." Not "I asked," but "I have a quote/data."
      *   Define the Stop Point. When all Qs are "Yes."
      *   Define Bar Movement. This is the trickiest part. The user noticed the bar moves emotionally (big story -> anxiety; bad week -> desperation). The theory says move the bar based on *systematic review*, not immediate emotion.
      *   *Correction on Theory:* Simon's theory is primarily *descriptive* of human cognition, but it implies a *prescriptive* strategy for decision-making under constraints. I need to be clear about this distinction.

  4.  **Developing the Scenarios:**
      *   *Scenario 1 (Stop Now):* The "One More Source" trap. Story is solid, but a blog comment suggests a niche expert. Procedure says: Does this expert address a *major* counter-argument already identified? If no, stop. User won't like it because it feels risky.
      *   *Scenario 2 (Keep Going):* The "Boredom" trap. Story feels done, but the "Stakes/Context" question is weak. It's a "so what?" piece. Procedure says: You need one more element to justify publication. User is bored, wants to file.
      *   *Scenario 3 (Limitation):* The "Unknown Unknown." The procedure can't save you from missing the *right* question. If you don't know to ask about the funding source, the checklist won't prompt you.

  5.  **Refining the Tone:**
      *   Direct, professional, no fluff.
      *   Acknowledge the pain of the "Stop Now" scenario.
      *   Be honest about the "Judgment Call" areas.
      *   Clarify the Descriptive vs. Prescriptive distinction early.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the friend's advice is right but incomplete. Simon describes *why* you fail (search costs), but you need a *rule* to fix it.
      *   *The Distinction:* Simon observed that humans *naturally* satisfice (descriptive). But they do it sloppily, adjusting aspirations based on emotion. You need to do it *deliberately* (prescriptive).
      *   *The Procedure:* "The Four-Point Threshold."
          1.  Mechanism/Claim (The Paper).
          2.  Independence (The Outsider).
          3.  Friction (The Skeptic).
          4.  Consequence (The So What).
      *   *The Stop Rule:* File when all 4 are "Green."
      *   *Moving the Bar:* This needs a specific mechanism. Not "how I feel," but "Post-Mortem." After 5 stories, review. Did any get spiked? Did any get traction? Adjust criteria *then*, not during the deadline.
      *   *Scenarios:* Flesh these out with specific details relevant to science reporting (e.g., a preprint, a press release, a Twitter thread).

  7.  **Review against Constraints:**
      *   *Plain language?* Yes.
      *   *No "trust your gut"?* I will explicitly label judgment calls.
      *   *Descriptive vs. Prescriptive?* I will make a specific section for this.
      *   *Bar Movement?* I will address the emotional drift vs. systematic adjustment.
      *   *Scenarios?* Included.
      *   *Limitations?* Included.

  8.  **Final Polish:** Ensure the distinction between "optimizing" (finding the best) and "satisficing" (finding the first that meets criteria) is clear in the application. The user's problem is they treat the criteria as fluid. The fix is freezing the criteria.

      *(Self-Correction during drafting)*: I initially thought about telling them to set the bar before every story. But the user says the bar moves *after* big stories. The procedure needs to account for that. The advice should be: Set the bar *once* for a quarter, not per story, to prevent emotional drift. That's a stronger prescriptive rule.

      *(Refining the "Judgment Call" aspect)*: The user hates fake mechanics. I need to admit that deciding if a skeptic is "major" enough is a judgment call. The procedure doesn't remove judgment; it contains it.

      *(Refining the Theory)*: Simon's work is descriptive of *how humans actually decide* (we don't maximize, we satisfice). The *prescriptive* part (how we *should* decide to be rational under bounds) comes from applying that insight deliberately. I need to make sure I don't claim Simon wrote a self-help book. He described the landscape; you have to build the map.

  9.  **Final Output Structure:**
      1.  Theory Clarification (Descriptive vs. Prescriptive).
      2.  The Procedure (The 4 Questions).
      3.  The Stop Rule.
      4.  Moving the Bar (The Quarterly Review).
      5.  The Scenarios.
      6.  The Limitation.

  Let's write it.cw
answer: |-
  Here is the machine you asked for. It is built on Herbert Simon's concepts, but stripped of the academic baggage.

  ### Part 1: The Theory (Clearing the Blur)

  You need to know exactly what you are using so you don't misuse it.

  **Descriptive (How people actually decide):** Simon observed that humans *cannot* maximize (find the absolute best option) because we lack the time and information. Instead, we naturally "satisfice" (search until we find an option that meets a minimum threshold). However, humans do this sloppily. We lower the threshold when we are tired and raise it when we are anxious. This is what you are doing now: your threshold is moving emotionally.

  **Prescriptive (How you should decide):** To make this useful, you must stop satisficing *sloppily* and start satisficing *deliberately*. You must set the threshold **before** you begin the search and refuse to move it during the search. You only adjust the threshold after a batch of work is complete, based on results, not feelings.

  **The Judgment Call:** No procedure removes judgment. It only boxes it in. The procedure below tells you *when* to judge, not *what* to decide.

  ---

  ### Part 2: The Procedure (The Four-Point Threshold)

  Before you pitch or start reporting, you define the "Publication Threshold." For a standard science/ideas story, your threshold consists of four specific questions.

  **The Questions:**
  1.  **The Claim:** Do I have the primary source (paper/data/event) and can I state the main finding in one sentence without hedging?
  2.  **The Independence:** Do I have one source unconnected to the study who confirms this finding is significant/plausible?
  3.  **The Friction:** Do I have one source or piece of data that explains why this might *not* be true or why it's limited?
  4.  **The Consequence:** Do I have one concrete example of who cares about this or how it changes things?

  **What Counts as a Real Answer:**
  *   **Yes:** You have a quote, a link, or a specific data point in your notes that supports the point.
  *   **No:** You have a promise of a quote, a vague sense, or a press release claim.
  *   **N/A:** You have explicitly decided this story type doesn't require it (e.g., an opinion piece might skip #2, but you must mark that *before* starting).

  **The Stop Rule:**
  When all four answers are **Yes**, you file.
  If you acquire new information after all four are **Yes**, you are not "improving" the story; you are decorating it. Decoration is prohibited under deadline.

  **Where the Judgment Call Lives:**
  Deciding if a skeptic is "significant" enough for Question #3 is a judgment call. The procedure does not solve this. It only forces you to make that call *before* you dial the phone. If you decide the skeptic is too niche, you mark #3 as "Yes" (based on existing limitations) and move on. You cannot revisit that judgment unless new evidence proves the limitation is fatal.

  ---

  ### Part 3: Moving the Bar (Aspiration Adjustment)

  You noticed your bar moves on its own: high after a success, low after a failure. This is the "emotional drift" Simon described. It is inefficient.

  **The Rule:** You are not allowed to move the bar during a story. You are only allowed to move it during a **Quarterly Review**.

  **The Procedure:**
  1.  Every 3 months, look at the last 15 stories you filed using this threshold.
  2.  **If 0 stories were spiked/killed for accuracy:** Your bar is correct. Keep it.
  3.  **If >2 stories were spiked/corrected:** Your bar is too low. Add a requirement (e.g., "Must have two independent sources").
  4.  **If you missed >3 deadlines:** Your bar is too high. Remove a requirement (e.g., "Consequence can be implied, not explicit").

  **Why this works:** It decouples your anxiety from your standards. You don't raise the bar because you feel nervous about a big topic; you raise it because the data shows your current bar lets errors through. You don't lower the bar because you're tired; you lower it because the data shows you're missing deadlines without gaining accuracy.

  ---

  ### Part 4: Running the Machine

  Here is how this plays out in your actual work.

  **Scenario 1: The "One More Source" Trap (Stop Now)**
  *   **Situation:** It's Thursday. You have the paper, the lead author, and one independent skeptic. All four threshold questions are "Yes." You are ready to write. Then, a DM on Twitter says, "You need to talk to Dr. X, he debunked this method in 2019."
  *   **Your Instinct:** Call Dr. X. If you don't, you look lazy. If the story blows up, you want to be safe.
  *   **The Procedure:** Check the Threshold. All four are "Yes."
  *   **The Decision:** **File.** Do not call Dr. X.
  *   **Why you won't like this:** It feels risky. You feel exposed.
  *   **The Logic:** You have already met the "Friction" requirement with the existing skeptic. Unless the Twitter user can prove the existing skeptic is *wrong* (not just that there is *another* skeptic), the threshold is met. Calling Dr. X is optimization, not satisficing. If Dr. X turns out to be right and the story is retracted, you use that data in your Quarterly Review to raise the bar for *future* stories on this topic. You cannot fix this story without missing the deadline.

  **Scenario 2: The "Boredom" Trap (Keep Going)**
  *   **Situation:** You have the paper and the lead author. The finding is solid. You have a skeptic who says "it's preliminary." You feel done. You want to write it because it's easy. But you don't have a concrete example of who cares (Question #4 is "No"). You just plan to write "this could be important for medicine."
  *   **Your Instinct:** File it. "Could be important" is standard science journalism speak. It's good enough.
  *   **The Procedure:** Check the Threshold. Question #4 is "No."
  *   **The Decision:** **Keep Reporting.** You cannot file until you find one patient, one policy maker, or one specific application that makes the consequence concrete.
  *   **Why you won't like this:** You are bored. The story feels "complete" in your head. This feels like busywork.
  *   **The Logic:** "Could be important" is hedging, not consequence. Without #4, the story is a press release rewrite. The procedure forces you to do the work that separates your outlet from a wire service. You are not optimizing for beauty; you are meeting the minimum viable product for *your* outlet's brand.

  **Scenario 3: The Limitation (The Unknown Unknown)**
  *   **Situation:** You meet all four thresholds. You file. The story runs. A week later, it turns out the lead author had a financial conflict of interest that wasn't disclosed in the paper or to you.
  *   **The Procedure's Failure:** The procedure did not catch this.
  *   **Why:** Simon's bounded rationality acknowledges you cannot know what you don't know. A checklist only checks for known risks.
  *   **The Fix:** This is why the Quarterly Review exists. If this happens once, it's bad luck. If it happens twice, you add "Conflict of Interest Search" to Question #1. The machine doesn't prevent error; it creates a system for learning from error without panicking.

  ### Summary of Instructions

  1.  **Write the 4 Questions** on a sticky note.
  2.  **Mark them Yes/No** before you start writing the draft.
  3.  **If all Yes:** You must file. Any additional reporting requires editor approval (external enforcement).
  4.  **If any No:** You must report. No writing allowed until Yes.
  5.  **Review every 3 months:** Adjust the questions based on spikes/deadlines, not feelings.

  This is not about doing good work. It is about doing consistent work. The theory says you will never have perfect information. The procedure says you must stop searching the moment your specific definition of "enough" is met.
