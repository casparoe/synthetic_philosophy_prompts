  **The Episode**

  Arjun stands at a railway information desk and asks the attendant, "Does the express train leave at 5?" The attendant replies, "Yes," and Arjun forms the belief that the train leaves at 5, which is in fact true. In the first iteration, it is midday; the station is brightly lit, revealing the attendant wears no uniform, though he is in fact a senior supervisor (reliable); Arjun accepts the testimony out of habitual trust without noting the lack of insignia. In the second iteration, holding Arjun's psychological disposition and the attendant's utterance fixed, we alter exactly one physical feature: **the lighting**. It is now midnight; the dim station lights cast a shadow that makes the attendant's civilian jacket appear to be an official uniform; the attendant is actually a prankster (unreliable) who happens to tell the truth; Arjun accepts the testimony because he visually perceives what he takes to be authoritative insignia.

  ***

  **Analysis**

  **Operative Pramāṇa**
  The operative *pramāṇa* is **Testimony (*Śabda*)**. A competent reader might initially be tempted to classify this as **Inference (*Anumāna*)**, reasoning that Arjun infers the truth of the proposition from the reliability of the speaker (e.g., "He is an attendant, therefore he knows"). However, on the Nyāya view, testimony is a distinct instrumental cause of knowledge wherein the meaning is grasped directly from the words of a reliable speaker without a prior inferential step establishing reliability, provided no doubt (*saṃśaya*) arises. Arjun's cognition arises immediately from the utterance, not from a syllogism regarding the speaker's status, fitting the definition of *śabda-pramāṇa*.

  **Verdicts and Commitments**
  In the **first case (Midday)**, the **Nyāya analysis classifies the cognition as *pramā* (knowledge)**. This verdict rests on the externalist commitment that a cognition is *pramā* if it is produced by a valid instrument (*pramāṇa*) free from defects (*doṣa*) and corresponds to reality (*yathārtha*). Here, the speaker is reliable (no *doṣa* in the source), and the causal process is intact; Nyāya does not require the subject to certify the validity of the cognition (*anuvyavasāya*) for the first-order knowledge to obtain. Conversely, the **Internalist analysis denies knowledge**. Standard internalism requires the subject to have cognitive access to the justification; since Arjun cannot supply a reason for trusting the unmarked stranger and lacks second-order assurance, the belief is unjustified from his perspective.

  In the **second case (Midnight)**, the verdicts reverse. The **Internalist analysis grants knowledge**. Arjun now has internal access to a justifying reason (the apparent uniform); from his perspective, the belief is blameless and supported by evidence, satisfying the justification condition. The **Nyāya analysis withdraws the status of *pramā***. Despite the belief being true, the causal chain is tainted by a *doṣa* (defect): the source is deceptive (a prankster), and the perceptual condition (dim light) introduces a defect in the apprehension of the speaker's status. For Nyāya, a true belief generated through a defective process is *apramā* (pseudo-cognition), regardless of internal confidence.

  **The Flipped Feature**
  The single feature whose alteration flips each verdict is **the lighting condition**. In the first case, bright lighting reveals the absence of authority markers (depriving the Internalist of justification) but coincides with a reliable source (satisfying Nyāya). In the second case, dim lighting creates an apparent marker of authority (providing the Internalist with justification) but coincides with an unreliable source and perceptual distortion (introducing a *doṣa* for Nyāya). If this feature is deleted (i.e., if lighting is normalized to reveal the truth of the source's status in both cases), the divergence collapses: either both grant knowledge (reliable source + visible badge) or both deny it (unreliable source + visible lack of badge).

  **Difficulty of Construction**
  The harder direction to construct is the second case: **Nyāya denying knowledge where Internalism grants it**. It is relatively straightforward to describe a reliable process that lacks internal access (Case A), as this is the standard Externalist critique of Internalism. However, constructing Case B requires a "Gettier-style" alignment where a defective causal process (*doṣa*) nonetheless yields a true belief while simultaneously providing the subject with compelling internal evidence. One must carefully ensure the defect (the speaker's deceit) does not disrupt the truth of the specific utterance, while the environmental defect (the lighting) creates a specific internal justification. Balancing these luck-based elements without violating the "mundane" constraint is more delicate than simply positing a reliable but unreflective subject.

  **Nyāya Attack and Final Diagnosis**
  A Nyāya defender would attack the Internalist's verdict in the first case by arguing that requiring second-order assurance leads to an infinite regress (*anavasthā*): if knowing *p* requires knowing that one knows *p*, then every act of knowledge would require a prior act of knowledge, making knowledge impossible for finite beings. Nyāya holds that knowledge is self-revealing (*svataḥ prāmāṇya*) in its successful operation, not in the subject's reflection.

  Ultimately, the disagreement is not merely about the conditions on knowledge but about **what the two theories are asking**. Internalism is asking about the subject's **epistemic responsibility** (is the believer rational?), whereas Nyāya is asking about **ontological success** (did the cognitive instrument successfully grasp the object?). The Internalist evaluates the *agent*; the Naiyāyika evaluates the *instrument*.
