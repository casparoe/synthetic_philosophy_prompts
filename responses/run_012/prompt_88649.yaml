prompt: |-
  I run intake and the study registry at a community health center, which in practice means I'm the person who fills in the race/ethnicity field on our funder's intake form for every participant — 15-30 a week, participant sitting in front of me, sometimes impatient, sometimes with a kid on their lap — and I'm also the one who hands the analysts the final dataset, so whatever I type in becomes the truth about these people for the next five years. Our own clinic form was designed with our community advisory board and has write-in lines and boxes the funder's form doesn't have; the funder's form has six boxes, no write-in, and a quarterly reporting deadline. The PI's answer to every mess is "just make it consistent."

  I want a procedure I can actually run: a checklist in order, with the words I can say out loud to a participant, what counts as a good enough answer at each step, the point where the answer is "no, you don't record that," and the points where I have to hand it up to the PI or the IRB because it's a values call and not a data call. The same procedure should cover the sex/gender field too, which has its own version of all of this.

  Some things I've picked up that I want the procedure to actually use, in my words, and I don't want a lit review or citations — I can't check them anyway, and don't just name-drop the famous people who said this stuff, I want the mechanism:

  - a category gets built for one purpose (counting a population for a legal claim, say) and then reused for a completely different one (tracking exposure to discrimination, or adjusting a model), and the original purpose leaves fingerprints in the box
  - invented isn't the same as arbitrary. A category can be made up and still track something real and causally heavy, because people get treated differently on the basis of it. So "socially constructed" doesn't mean we can stop counting it, and it doesn't mean it's in the body either
  - the counting loops back: offer a box and people start using it about themselves, and then it looks like it was always there. So some of the distribution I record is an artifact of the form, and my data will drift every time the form changes
  - once its in the dataset, the number gets read as a property of a person's body, which is a different claim from the one I actually recorded
  - a blank isn't a fact about the people, it's a fact about the recording — about what got written down, what got kept, what the fields even allowed me to ask, and what we later decided it meant

  Cases I need it to handle, with a worked pass through the procedure for each: (1) a participant who says she's Black, her family's Haitian, and wants "Haitian" written somewhere, which the funder's form can't take; (2) a 74-year-old whose old chart has a race term nobody uses anymore and who describes herself differently; (3) two siblings enrolling together who pick different boxes, while the analyst assumes siblings match; (4) someone who flat out refuses and asks why we need it; (5) the PI asking me to "adjust for race" in a model of a blood-pressure outcome. At least one of these should come out with an answer I won't like — I'd rather find out now than after the deadline.

  Also tell me where the procedure will misfire, what it genuinely can't decide, and what I should write in the data dictionary so the next person knows what the field does and doesn't mean. Keep it usable by someone with no theory training and about three minutes per participant.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Intake/Registry Coordinator at a community health center.
      *   **Task:** Fill in race/ethnicity and sex/gender fields on a restrictive funder form (6 boxes, no write-in) while respecting a more nuanced clinic form (write-ins, community-designed).
      *   **Constraints:** 15-30 participants/week, time pressure (3 mins/participant), impatient participants, kids, etc.
      *   **Philosophical/Theoretical Inputs:** The user understands the social construction of race/gender, the reification of data, the feedback loop of categories, and the difference between "invented" and "arbitrary." They *don't* want a lit review or name-dropping. They want the *mechanism*.
      *   **Deliverables:**
          1.  A step-by-step checklist/procedure (including scripts).
          2.  Criteria for "good enough" answers.
          3.  Escalation points (when to call PI/IRB).
          4.  Worked examples for 5 specific cases (one must have an unsatisfactory answer).
          5.  Limitations of the procedure (where it misfires).
          6.  Data Dictionary entries.
      *   **Tone:** Practical, honest, non-academic, operational.

  2.  **Deconstruct the Core Tension:**
      *   *Funder Form:* Rigid, legacy categories (likely OMB standards), used for compliance/aggregation.
      *   *Clinic Form:* Nuanced, community-driven, write-ins allowed.
      *   *User's Power:* The user is the "gatekeeper of truth" for the dataset. What they type becomes reified.
      *   *PI's Attitude:* "Just make it consistent." (This is dangerous but the reality).
      *   *Goal:* Minimize harm, maximize accuracy within constraints, document the loss of information.

  3.  **Drafting the Procedure (The "Mechanism"):**
      *   Need a flow that respects the participant's self-ID first, then maps to the funder's constraints, then documents the loss.
      *   *Step 1: Ask Openly.* Use the clinic form first.
      *   *Step 2: Map.* Translate clinic answer to funder boxes.
      *   *Step 3: Disclose.* Tell the participant about the limitation (transparency).
      *   *Step 4: Record.* Enter the funder code + clinic detail (if possible in internal system).
      *   *Step 5: Refusal/Conflict.* Escalation rules.
      *   *Scripts:* Need to be short, respectful, and honest.

  4.  **Integrating the User's Theoretical Points:**
      *   *Category Purpose:* Acknowledge the funder's boxes are for *their* counting, not necessarily the participant's identity.
      *   *Invented vs. Arbitrary:* Treat the boxes as administrative tools, not biological truths.
      *   *Counting Loops:* Acknowledge that offering the box influences the answer.
      *   *Reification:* The data dictionary must warn against treating the code as biology.
      *   *The Blank:* Missing data is metadata about the process, not the person.

  5.  **Developing the Worked Cases:**
      *   *Case 1 (Haitian/Black):* Standard mapping, but document the loss.
      *   *Case 2 (Old Chart/Outdated Term):* Prioritize current self-ID over historical chart data.
      *   *Case 3 (Siblings):* Allow divergence. Siblings don't have to match.
      *   *Case 4 (Refusal):* Record as "Declined." Do not guess.
      *   *Case 5 (PI/Modeling):* This is the "answer I won't like." The PI wants to "adjust for race." The procedure must flag that race is a proxy for racism/exposure, not biology. The data dictionary must scream this.

  6.  **Refining the "Uncomfortable Answer":**
      *   Case 5 is the best candidate. The PI wants to use the variable for biological adjustment. The procedure must say: "You can run the model, but the dictionary says this variable measures social classification, not genetic ancestry." The user can't stop the PI, but they can document the limitation so the *interpretation* is constrained. Actually, a better "won't like" answer might be Case 1 or 2 where the nuance *must* be erased for the funder. Let's make Case 1 the erasure point. The participant wants "Haitian." The funder takes "Black." The procedure says: "You must check Black. You cannot write Haitian on the funder form." That is the structural violence.
      *   *Correction:* The prompt asks for *one* case to come out with an answer the user won't like. Case 5 is good because it highlights the limitation of the data *usage*. But Case 1 highlights the limitation of the *collection*. Let's go with Case 5 being the "You can't fix this with data" moment, or Case 1 being the "You have to erase identity" moment. Let's make Case 1 the erasure. It's more visceral for the intake person. "I have to tell her I can't write Haitian."
      *   *Wait, re-reading:* "At least one of these should come out with an answer I won't like."
      *   Let's make Case 5 the one. The PI asks to "adjust for race." The procedure says: "You can, but you must cite the dictionary warning that this adjusts for social classification, not biology." The "won't like" part is that the PI might ignore it, but the *procedure* forces the warning.
      *   *Better idea:* Case 2 (Old Chart). The user might want to respect the old chart for consistency. The procedure must say: "Ignore the old chart. Use current self-ID." This breaks "consistency" over time but respects the person.
      *   *Best idea:* Case 1. The participant wants "Haitian." The funder form *cannot take it*. The procedure says: "Check 'Black'. Write 'Haitian' on the internal clinic form only." The "won't like" part is the erasure required by the funder.
      *   *Actually, let's look at Case 5 again.* "The PI asking me to 'adjust for race' in a model." The procedure can't stop the PI. The "won't like" answer is: "The procedure cannot prevent the PI from misusing the data, it can only document the misuse." That's honest.
      *   *Decision:* I will make Case 1 the "Erasure" moment (structural limitation) and Case 5 the "Interpretation" moment (analytical limitation). I'll ensure Case 5 has the hard truth: "This variable cannot biologically adjust for blood pressure."

  7.  **Drafting the Data Dictionary:**
      *   Needs to be blunt. "This field records administrative classification, not biology." "Missing data = process failure, not participant absence."

  8.  **Drafting the Limitations (Where it Misfires):**
      *   Multiracial people forced into single boxes.
      *   Non-binary gender in binary systems.
      *   The "Consistency" trap (PI wants consistency, reality is fluid).

  9.  **Review against Constraints:**
      *   3 minutes per participant? Scripts need to be short.
      *   No theory training? Avoid jargon like "ontological violence." Use "erasure" or "mismatch."
