  10. **Final Polish:**
      *   Ensure the tone is empathetic to the intake worker (they are the buffer).
      *   Make sure the escalation path is clear (when to stop and call the PI).

  *(Self-Correction during drafting)*: I need to make sure I don't give the user *too much* power. They can't change the funder form. The procedure must acknowledge the powerlessness regarding the funder while maximizing agency on the internal form. The "won't like" answer should be about the funder's constraint forcing an erasure that the procedure validates as necessary for funding, even if it hurts.

