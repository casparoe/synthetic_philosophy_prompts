answer: |-
  Here is the procedure. It is designed to be printed on a single sheet, laminated, and kept at your desk. It treats the funder's form as an administrative constraint and the clinic's form as the ethical record.

  ### THE INTAKE PROTOCOL: RACE, ETHNICITY, & GENDER

  **Goal:** Capture self-identification accurately on the *Clinic Form*, map to the *Funder Form* without lying, and document where the map fails.
  **Time Budget:** 3 minutes max per participant.

  #### STEP 1: ASK OPEN (Clinic Form First)
  Do not show the Funder Form yet. Use the Clinic Form with write-in lines.
  *   **Script:** "For our community records, how do you describe your race or ethnicity? You can use any terms you like."
  *   **Script (Gender):** "What is your current gender identity?"
  *   **Action:** Write exactly what they say in the Clinic Form write-in line.
  *   **Good Enough:** Any term the participant offers. Do not correct them. Do not suggest boxes.

  #### STEP 2: MAP TO FUNDER (The Translation)
  Look at the Funder Form's 6 boxes (e.g., White, Black, Asian, etc.).
  *   **Rule:** If their answer fits a box, check it. If their answer is specific (e.g., "Haitian") and fits a broader box (e.g., "Black"), check the broader box.
  *   **Rule:** If they select multiple boxes, check all that apply. If the form forces one, ask: "This form forces me to pick one for their counting. Which one feels closest?"
  *   **Action:** Check the Funder box.
  *   **Good Enough:** A "close enough" administrative match. It does not need to be perfect; it needs to be non-false.

  #### STEP 3: DISCLOSE THE LOSS (Transparency)
  If you had to map a specific identity to a broad box (e.g., Haitian → Black), tell them.
  *   **Script:** "I've checked 'Black' for their form because they don't have a line for 'Haitian.' I have 'Haitian' written down on our clinic chart, but their report will just show 'Black.'"
  *   **Why:** This breaks the "counting loop." It tells them the box is a limitation of the form, not a limitation of their identity.

  #### STEP 4: REFUSALS & BLANKS
  If they refuse or ask why:
  *   **Script:** "We use this to track if we are serving the community fairly. You don't have to answer. If you skip it, I just mark 'Declined.'"
  *   **Action:** Check "Declined" or leave blank per Funder rules.
  *   **Crucial:** Do not guess. Do not look at skin color. Do not look at the old chart.
  *   **Meaning:** A blank is a fact about the recording process, not the person.

  #### STEP 5: ESCALATION (When to stop)
  Stop and call the PI or IRB Coordinator if:
  1.  **Distress:** The participant becomes upset or angry about the categories.
  2.  **Conflict:** The participant's answer contradicts the old chart *and* they ask you to change the old chart.
  3.  **Coercion:** The PI asks you to "fix" data to make numbers look better.
  4.  **Biology Claim:** Anyone implies this data proves biological differences (see Case 5).

  ---

  ### WORKED CASES

  **Case 1: The Haitian Participant**
  *   **Situation:** Woman says "I'm Haitian." Funder form has "Black" but no "Haitian."
  *   **Procedure:**
      1.  Write "Haitian" on Clinic Form.
      2.  Check "Black" on Funder Form.
      3.  **Script:** "I'm checking 'Black' for the funder because they don't have a Haitian box. I've kept 'Haitian' on our internal chart."
  *   **The Answer You Won't Like:** You have to erase "Haitian" on the funder form. The procedure validates this erasure as necessary for funding, but requires you to name it. You are the mechanism of the erasure. The "truth" for the next five years will be "Black," not "Haitian." The fingerprints of the funder's legal purpose are on this box.

  **Case 2: The 74-Year-Old & The Old Chart**
  *   **Situation:** Old chart says "Colored." She says "I'm African American now."
  *   **Procedure:**
      1.  Ignore the old chart term. It is a historical artifact, not current data.
      2.  Write "African American" on Clinic Form.
      3.  Check "Black" on Funder Form.
  *   **Rationale:** Categories drift. "Colored" carried different social weight than "African American." Counting loops back; using the old term reinforces a category that no longer functions the same way socially.

  **Case 3: The Siblings**
  *   **Situation:** Two siblings enroll. One checks "Black," one checks "White." Analyst assumes siblings match.
  *   **Procedure:**
      1.  Record exactly what each says. Do not harmonize.
      2.  **Data Note:** Flag for analyst: "Self-ID varies within household."
  *   **Rationale:** Race is socially constructed, not genetic. Siblings may be treated differently by the world (colorism, passing, etc.). Forcing them to match invents a biological consistency that doesn't exist.

  **Case 4: The Refusal**
  *   **Situation:** "Why do you need to know? I'm not checking that."
  *   **Procedure:**
      1.  **Script:** "It's optional. It helps us prove we're helping the neighborhood. I'll mark 'Declined'."
      2.  Mark "Declined." Do not leave it blank if "Declined" is an option (distinguishes refusal from error).
  *   **Rationale:** A blank isn't a fact about the people; it's a fact about the recording. "Declined" tells the analyst the question was asked and rejected. Blank might mean you forgot to ask.

  **Case 5: The PI's Model (Blood Pressure)**
  *   **Situation:** PI says: "Adjust for race in the blood pressure model."
  *   **Procedure:**
      1.  **Action:** You provide the dataset.
      2.  **Constraint:** You attach the Data Dictionary (see below).
      3.  **The Hard Truth:** You cannot stop the PI, but the procedure requires the dictionary to state: *"This variable records social classification, not genetic ancestry. It adjusts for exposure to racism/discrimination, not biological susceptibility."*
  *   **Rationale:** "Invented isn't arbitrary." The category tracks something real (differential treatment), but if the PI treats it as biology, the model is lying. The procedure shifts the burden of the lie to the interpretation, not the collection.

  ---

  ### WHERE THIS PROCEDURE MISFIRES

  1.  **The "One Box" Trap:** If the funder form forces a single choice for a multiracial person, Step 2 forces them to rank their identities. This causes distress. *Mitigation:* Escalate to PI to request a waiver for "Multiple Selection" if >10% of participants struggle.
  2.  **Non-Binary Gender:** If the funder form is Male/Female only, a Non-Binary participant is forced to misgender themselves to get care. *Mitigation:* Record "Non-Binary" on Clinic Form. On Funder Form, ask them: "Which box do you prefer I check for their system, or should I leave it blank?" Let them choose the misgendering or the missing data.
  3.  **The "Consistency" Lie:** The PI wants consistency over time. This procedure prioritizes accuracy *now* over consistency with *then*. If the PI complains that the numbers changed because the questions changed, your answer is: "The distribution drifted because the form changed. That is a feature, not a bug."

  ---

  ### DATA DICTIONARY ENTRIES
  *Copy this into the metadata file handed to analysts. This is your permanent record.*

  **FIELD: `RACE_ETH_FUNDER`**
  *   **Definition:** Administrative classification based on OMB-style categories.
  *   **Source:** Participant self-report mapped to restricted list.
  *   **Warning:** This field contains the fingerprints of the funder's legal purpose. It is not a biological measure. It is not a precise measure of culture or ancestry.
  *   **Usage:** Use only to adjust for social exposure or discrimination. **Do not use as a proxy for genetic ancestry.**
  *   **Null Values:** `NULL` indicates data entry error. `DECLINED` indicates participant refusal. Do not treat `NULL` and `DECLINED` as the same population.

  **FIELD: `GENDER_FUNDER`**
  *   **Definition:** Administrative classification (Male/Female).
  *   **Warning:** May not reflect participant's actual gender identity if non-binary.
  *   **Cross-Ref:** See `GENDER_CLINIC_WRITEIN` for accurate identity.

  **FIELD: `RACE_ETH_CLINIC`**
  *   **Definition:** Unrestricted write-in of participant identity.
  *   **Warning:** This field captures the "invented but real" social identity. Categories here may change over time as language changes.
  *   **Note:** If this field says "Haitian" and `RACE_ETH_FUNDER` says "Black," the difference is data loss, not participant confusion.

  ---

  ### FINAL NOTE FOR YOU
  You are the buffer. When you type the code, you are turning a person's story into a number. The number will be read as a property of their body. You know it isn't. This procedure ensures that while the number is reified, the *reason* for the number is documented.

  If the PI says "Just make it consistent," show them Step 2 and the Data Dictionary. Consistency across a broken form is just consistent error. Your job is to make the error visible.
