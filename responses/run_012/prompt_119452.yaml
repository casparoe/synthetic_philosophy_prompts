answer: |-
  The first turn offers nothing but stone,
  The second holds four, I drive alone.
  If I could count, I'd let the first go by,
  But the mile markers blur in the sky.
  To stay the course yields only one,
  While the perfect plan comes undone.
  The sign is blank, the road is wide,
  I keep the secret chance inside.
  I balance zero, four, and one,
  Beneath this unchanging sun.
  A probability, soft and slight,
  To navigate the uniform light.
  The logic holds, the map is clear,
  But I am lost whenever I am here.
  The sign is blank, the road is wide,
  I keep the secret chance inside.
  I know the path I should drive down,
  But wear the uniform of the town.
  The rule is stated, sharp and true,
  But I cannot be the one who knew.

  This poem attempts to embody the epistemic limitation central to the absent-minded driver paradox without explicitly diagnosing it. The refrain's ambiguity ensures the reader cannot locate the speaker in the sequence of intersections, mirroring the agent's own inability to distinguish her position. The arithmetic of the payoffs (zero, four, one) is woven into the rhyme scheme to be felt rather than solved, while the closing stanza emphasizes the disconnect between the optimal policy she can formulate abstractly and the identical action she must perform concretely.
