answer: |-
  - The analogy and its use (2–3 sentences).
  Chesterton's Fence argues that one should not remove a barrier until understanding its original purpose, lest one remove something necessary but unseen. Your colleague extends this to social institutions, claiming inherited customs encode wisdom and shifting the burden of proof to reformers. This treats social structures as deliberate safeguards rather than contingent artifacts.

  - Correspondence table (fence-side versus institution-side).

  | Fence Side | Institution Side |
  | :--- | :--- |
  | The Fence | The Rule, Custom, or Institution |
  | The Builder | Legislators, Ancestors, or Society |
  | The Reason | Purpose, Function, or Intent |
  | The Remover | Reformer, Activist, or Legislature |
  | The Livestock/Land | The Citizens or Subjects |
  | The Terrain | The Social/Political Environment |

  - Where it holds (one short paragraph).
  The analogy holds where complex systems have hidden dependencies unknown to the casual observer. Just as a fence might prevent livestock from wandering into a hidden ravine, an obscure procedural rule might prevent bureaucratic corruption or maintain social cohesion in ways not immediately apparent. In these cases, rash removal without investigation risks catastrophic failure due to ignorance of systemic interconnections.

  - Where it breaks, ranked by whether each disanalogy matters for his use (one or two paragraphs).
  The most critical break is **moral valence and consent**, which matters most for his use. Fences confine animals or mark land, but institutions confine people who never agreed to the boundary; if the documented reason is exclusion (your test case), the "wisdom" is oppression, and knowing the reason mandates removal, collapsing the presumption. Second is **reversibility**: rebuilding a fence is cheap, but dismantling social structures causes irreversible human harm, meaning the burden of proof should be symmetric rather than skewed against change. Third is **design versus emergence and function**: many institutions lack a single builder, so there is no singular intent to recover, only historical drift where functions multiply or rot. Finally, **knowability** differs; historical reasons are often lost or contested, leaving the reformer guessing regardless of caution.

  - What the analogy quietly smuggles in (one short paragraph).
  It smuggles in the assumption that the past was more rational and benevolent than the present. By treating all existing structures as functional fences rather than potential cages, it presupposes that longevity equals legitimacy. This conflates survival with virtue, ignoring that harmful practices often persist precisely because they benefit those with the power to maintain them.

  - Does the presumption survive (one short paragraph, ending with your verdict).
  In your test case, the principle self-destructs: if the reason is known and evil, Chesterton's command to understand the reason yields a command to destroy. Thus, the presumption only protects institutions where the function is obscure and the moral status ambiguous. **Verdict: The presumption is invalid as a general rule and serves only as a temporary heuristic during inquiry.**

  - A better analogy, if there is one (2–3 sentences).
  A better analogy is **structural engineering in an occupied building**. You do not remove load-bearing walls without understanding their function, but you also do not leave rotting beams simply because they were placed by ancestors. You inspect for safety and utility, prioritizing the inhabitants' welfare over the architect's original intent.
