  ### Diagnosis

  Your hypothesis strikes at the engine of the impasse: the "Propositional Constraint." The regress problem arises specifically because justification is modeled as a transitive relation between propositional contents ($p$ is justified by $q$, $q$ by $r$...). If reasons must be propositions believed by the subject, the Agrippan trilemma (circularity, regress, assumption) is logically unavoidable. Your diagnosis suggests the debate is stagnant because all three parties accept the rules of a game that guarantees a draw. They argue over the shape of the chain, but not whether justification requires a chain of propositional attitudes at all. This illuminates why externalism and action-based views feel like category shifts. Externalism drops the requirement that justifiers be internally accessible propositions, replacing the chain with reliable processes. Similarly, viewing inference as a competent action rather than a propositional link bypasses the need for a further belief to justify the inference rule.

  The impasse is substantive but framed narrowly. It is not merely verbal; the parties agree on the definition of 'justification' (internalist, propositional) but disagree on the metaphysics of reasons. However, they are answering different questions: Foundationalists ask about security, Coherentists about systemic integrity, and Infinitists about logical consistency. The stagnation occurs because the "Propositional Constraint" forces internalists into a corner where every solution seems to violate a plausible epistemic principle. Foundationalism violates the principle that all beliefs need reasons; Coherentism violates the principle that circularity is vicious; Infinitism violates cognitive finitude. Until the constraint is challenged, the trilemma holds. Your hypothesis correctly identifies that the real division is between those who accept the internalist-propositional framework and those who dissolve it. The debate runs in place because the framework dictates the problems. However, abandoning it risks losing the normative force of justification, turning epistemology into mere psychology or reliability theory. The impasse persists because the cost of leaving the framework seems higher than tolerating the stalemate. The hidden issue is normative: how to preserve the 'ought' of epistemology without infinite propositional demands. This is why the debate feels like it is running in place; the participants are guarding the normative core while fighting over structural details that cannot resolve the tension.

  ### Where the hypothesis fails

  However, your hypothesis flattens crucial nuances regarding the nature of the "relata." First, many Foundationalists explicitly reject that justification is *only* among propositions. Classical Foundationalism relies on non-doxastic experiences (sense data, seemings) to stop the regress. They argue the relation is between a belief and a state, not a belief and a belief. Your hypothesis groups them with those who require propositional support, missing their primary escape route which attempts to break the propositional chain entirely. Second, as you anticipated, Infinitists object to your characterization. They deny the subject must "produce" every link occurrently. They argue for dispositional availability, not occurrent endorsement. By claiming they insist on a chain the subject produces, you recreate the feasibility objection they specifically designed their view to avoid. They argue the chain exists in principle, not in working memory. This mischaracterization weakens your diagnosis by overlooking the internal diversity of the triad. Additionally, your hypothesis suggests Externalism is the alternative. But Externalism is often accused of changing the subject. It solves the regress by denying the need for accessible reasons, but critics argue it fails to capture the normative dimension of justification. Thus, the 'alternative' is not a solution to the same problem, but a rejection of the problem's importance.

  ### What would count as progress

  Progress requires shifting from structural metaphors to functional analysis. Instead of asking "what supports this belief?", ask "what role does this belief play in successful inquiry?" Virtue epistemology offers this by focusing on the agent's competencies rather than propositional chains, evaluating the source of belief rather than its neighbors. Alternatively, formal epistemology could model justification using Bayesian networks, replacing linear chains with probabilistic dependence, potentially dissolving the linear regress worry by showing how confirmation distributes across a network. A second path is contextualism: acknowledging that regress stops when conversational context demands are met, making the structure pragmatic rather than metaphysical. Progress would look like a consensus that the regress problem is an artifact of a specific, perhaps outdated, logical model of reasoning, rather than a feature of knowledge itself. Until then, we should expect pluralism: different models for different epistemic tasks. We need empirical data on how humans actually reason versus how they normatively should. A concrete result would be a formal proof showing whether infinite chains confer probabilistic support or a phenomenological account of how non-propositional states justify beliefs without inference. Ultimately, progress may mean accepting that 'justification' is a cluster concept, requiring different structures for perceptual knowledge versus theoretical reasoning, dissolving the demand for a single universal solution. The goal should be to map the domains where each model works, rather than seeking a monopoly.
