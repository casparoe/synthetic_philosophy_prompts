  (b) "Candidate principles"
  **Principle 1: The Recognizability Threshold.** A performance counts as Song X if a competent listener familiar with the original can identify the melody and lyrics within the first chorus. This prioritizes audience experience over structural purity. It motivates the acceptance of arrangement shifts (Cases 1, 2) because the "hook" remains intact. It allows for gradual drift (Case 8) so long as recognition persists. The clause exists because the venue's gimmick relies on audience nostalgia, not musicological accuracy. This is a high-temperature rule; it allows concepts to slip.

  **Principle 2: The Melodic-Lyric Invariance.** Song X is defined strictly by the union of its specific melody and specific lyrics. Altering either constitutes a new work. This protects the composer's core IP and aligns with copyright law. It motivates the rejection of parody (Case 3) and melody rewrites (Case 5), while accepting translation (Case 4) where meaning and contour are preserved. This clause exists to prevent legal liability; changing lyrics creates a derivative work requiring separate clearance. This is a low-temperature rule; it demands rigidity.

  **Principle 3: The Performance Lineage.** A cover must be a live performance of the composition, not a derivation using the recording as raw material. This distinguishes playing from sampling (Case 7) and covers from standards (Case 10). It validates covers of covers (Case 9) because the lineage of performance remains unbroken, regardless of intermediate arrangement changes. It excludes medleys (Case 6) unless the chunk is substantial enough to constitute a performance event. This clause ensures the band is actually *playing* the song, not just referencing it. It bridges the gap between legal composition rights and live performance reality.

  (c) "Your ten cases"
  **Principle 1 (Recognizability)** validates your gut on 1, 2, 4, 6, 8, 9. It struggles with 7 (recognizable but not a performance) and 3 (recognizable tune, but lyrics break the contract). It explains why 8 (drift) survives: recognition persists despite structural erosion. However, it fails to distinguish between a cover and a parody if the tune is obvious.
  **Principle 2 (Invariance)** validates 3, 5, 10 as "not X." It validates 4 (translation). It creates tension on 2: is groove part of melody? If yes, ska-punk fails. If no, it passes. It strictly forbids 5, aligning with your gut. This principle is the safest for legal compliance but too rigid for artistic performance.
  **Principle 3 (Lineage)** kills 7 (sampling breaks performance). It saves 9. It renders 6 ambiguous (is a chunk a performance?). It conflicts with 8 if the drift becomes so large the lineage feels broken, though performance continuity saves it.
  **Synthesis:** Your verdicts rely on Principle 1 for arrangement changes (1, 2, 8) and Principle 2 for core content (3, 5, 10). Case 7 is excluded by Principle 3. The inconsistency lies in weighting Principle 1 higher than Principle 2 for groove (Case 2) but not for melody (Case 5). You treat groove as arrangement (Principle 1) but melody as identity (Principle 2). This hybrid approach works for the audience but fails logical scrutiny. Like the AI program, your "temperature" rises for groove but drops for melody.

  (d) "Cases I didn't list"
  **1. The Mashup:** Equal parts Song A and Song B woven together. Recognizable (Principle 1), but violates Invariance (Principle 2) for both. Is it two covers or one original? Licensing becomes a nightmare; you owe royalties to both estates. The venue might reject this as too complex to clear.
  **2. The Instrumental:** Playing the melody of a vocal song on guitar, no words. Principle 1 says yes (audience knows it). Principle 2 says no (lyrics missing). Venues usually count this, suggesting Principle 1 dominates in practice. However, legally, the melody is the protected element, so it remains a cover.
  **3. The Style Clone:** An original song written to sound exactly like Song X (same chords, groove, vibe) but different melody/words. Principle 1 says no. Principle 2 says no. But audience might feel deceived. This tests the "vibe" boundary. If the audience thinks it's a cover, is it one? Legally, no, but marketing-wise, yes.
  **4. The AI Proxy:** Using AI to generate a vocal track that mimics the original singer on your new melody. Principle 3 breaks (is it a performance?). This challenges the human element of the "cover." It also raises right-of-publicity issues distinct from copyright.

  (e) "Verdicts you'd have to drop"
  You must drop the intuition that Case 2 and Case 5 are different categories. If changing the melody (5) makes it a new song, changing the groove (2) should too, unless you define "melody" to include "rhythmic contour." You cannot have it both ways. Either melody is sacred, or the "vibe" is. Also, Case 7 is a legal copyright issue (master recording vs. composition), not a "cover" definition. Treat it as outside the scope. Finally, accept Case 8 is a Sorites Paradox; you must draw an arbitrary line eventually, even if the drift feels continuous. Consistency requires sacrificing the comfort of the drift. Admit that at some point, your 2024 version is no longer the 2013 song.

  (f) "Pushback"
  Your framing assumes "cover" is a natural kind waiting to be discovered, like a biological species. It isn't. It's a functional label like "vehicle." A skateboard is a vehicle until you try to drive it on the highway. Your venue needs a boundary for licensing and marketing, not truth. The Hofstadter analogy is perfect: "Cover" is a high-temperature concept. It slips. Don't seek a cold, hard rule; seek a consensus threshold. Define "cover" for the venue as "Any song where the audience expects to sing along," and stop worrying about the metaphysics of your eleven-year drift. The venue cares about royalties, not ontology. Stop trying to solve a legal problem with philosophy.
