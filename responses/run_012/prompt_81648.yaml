answer: |-
  **Seminar Session: The Scaffolding of Self-Deception**
  **Text:** *Memento* (Christopher Nolan, 2000)
  **Theoretical Framework:** The Extended Mind Thesis (Clark & Chalmers, 1998)

  ### I. The Perfect Fit: Leonard as Otto Amplified

  On the surface, *Memento* is the cinematic validation of the Extended Mind Thesis (EMT). Clark and Chalmers argue that if a part of the world functions as a process which, were it done in the head, we would recognize as cognitive, then that part of the world is part of the cognitive process. Their paradigm case is Otto, who suffers from memory loss and uses a notebook to store beliefs. Because the notebook is always available, trusted, and accessible, Otto's belief that "MoMA is on 53rd Street" is located in the notebook, not just his brain.

  Leonard Shelby is Otto radicalized. His anterograde amnesia prevents any short-term biological consolidation. Consequently, his cognitive system *must* leak into the world to function at all. His Polaroids, his scraps of paper, and most significantly, his tattoos, satisfy the EMT conditions with brutal literalism.
  *   **Availability:** The tattoos are on his skin; the photos are in his pockets. They are as "always to hand" as neural pathways.
  *   **Trust/Endorsement:** Leonard operates under a strict rule: "I have to believe in a world outside my own mind." He treats the external artifacts as authoritative. When he reads a tattoo, he does not deliberate; he acts.
  *   **Parity:** If Leonard recalls a face biologically, we call it memory. When he recalls a face by looking at a Polaroid, EMT dictates we should also call it memory.

  In the first two acts of the film, the thesis holds. Leonard's mind is a distributed system spanning his neural tissue, his ink, and his paper. The boundary of the self is porous.

  ### II. The Fracture: Authorship and the End of Transparency

  However, the film's reverse-chronological structure culminates in a closing sequence that does not merely illustrate EMT; it interrogates its conditions of possibility. In the final chronological scene (the black and white sequence), Leonard is sitting in the derelict building with Teddy. He has just killed Jimmy Grants, mistaking him for "John G." Teddy reveals the truth: Leonard has already found and killed the real John G. a year ago. Leonard has been used by Teddy to kill drug dealers, then reset.

  Here, Leonard makes a choice. He decides not to accept this truth. He burns the Polaroid of the dead Jimmy Grants. He keeps the Polaroid of Teddy, but on the back, he writes a false clue: *"Don't believe his lies."* He also tattoos *"Remember Sammy Jankis"* onto his hand, weaponizing a story he previously used to deny his own condition.

  This moment exposes a vulnerability in the standard formulation of EMT. Clark and Chalmers assume the external resource is **transparent** and **stable**. Otto's notebook records the world; it does not *rewrite* the world to suit Otto's emotional needs. The EMT assumes a fidelity between the agent and the artifact.

  Leonard's system fails this condition because he is not just the *user* of the system; he is the *author*. The external resource is not a neutral repository of truth (like Otto's notebook regarding MoMA); it is a malleable medium for self-deception. By deliberately entering false data, Leonard breaks the "trust" condition of EMT. If I know that I might lie to my future self, can I truly "endorse" the entry in the way EMT requires?

  The film suggests that EMT quietly assumes the external resource is independent enough to correct the subject. But when the subject creates the resource *ex nihilo* (as Leonard writes the notes), the resource loses its status as an objective check. It becomes a mirror. If the extended mind is constituted by artifacts that the agent can knowingly corrupt, then the "mind" thus extended is not a truth-tracking system, but a narrative engine. This does not necessarily falsify EMT, but it forces a revision: the extended mind is not necessarily a *rational* mind. It can be an extended pathology.

  ### III. Coupling vs. Constitution: The Ethical Turn

  This leads to the objection that *Memento* dramatizes more viscerally than philosophical counter-arguments usually do. Critics like Adams and Aizawa argue that coupling (using a notebook) is not constitution (the notebook being part of the mind). They claim the notebook lacks the intrinsic content of biological memory.

  *Memento* sidesteps the metaphysical squabble to ask a pragmatic question: **Who is answerable?**

  When Leonard writes "Fact 6" on the back of Teddy's photo, he is performing a cognitive act. But he is also performing an ethical act. He is constraining the freedom of his future self. If we accept EMT, and the note *is* Leonard's belief, then Leonard is effectively gaslighting himself. But because the "belief" is stored externally, he can disown the agency of the writing while retaining the authority of the record.

  The film suggests the real stakes of extended cognition are not metaphysical (where is the belief?) but ethical (who owns the belief?). In a biological mind, repressing a memory is an unconscious or semi-conscious defense mechanism. In Leonard's extended mind, repression is a bureaucratic act. It requires filing, burning, and inking.

  This exposes a gap in EMT regarding **diachronic agency**. Clark and Chalmers treat the agent as a synchronous entity. *Memento* shows the agent as a succession of distinct temporal stages. Leonard-Now is writing a command for Leonard-Later. If the note is part of the mind, then Leonard-Now is responsible for the cognitive integrity of Leonard-Later. The film argues that extending the mind extends the scope of moral responsibility. You are not just responsible for what you think; you are responsible for the architecture of the world you build to think *with*.

  ### IV. What the Film Adds to the Debate

  Philosophical arguments regarding EMT often remain static, focusing on the status of a belief at time *t*. *Memento* contributes three crucial dimensions that the papers alone cannot capture:

  1.  **The Vulnerability of the Scaffold:** Arguments treat the notebook as a sturdy bridge. The film shows the bridge is made of paper and skin, susceptible to fire, loss, and manipulation. It highlights the *fragility* of extended cognition. If the external resource is destroyed (the burning photo), the belief doesn't just become inaccessible; it ceases to exist. The film forces us to confront the mortality of the extended mind.
  2.  **Motivation as a Cognitive Force:** In the EMT literature, information is stored to be retrieved. In *Memento*, information is stored to be *managed*. Leonard's system is not designed for truth; it is designed for purpose. He needs a puzzle to solve to justify his existence. The film reveals that cognitive systems are driven by existential needs, not just epistemic ones. An extended mind can be a tool for sustaining a delusion necessary for survival.
  3.  **The Horror of Transparency:** Finally, the film adds an affective dimension. For Otto, the notebook is a helpful aid. For Leonard, the tattoos are a scarification of guilt. When the mind is outside the body, it is visible to others. Teddy can read Leonard's mind by looking at his thighs. *Memento* shows that extended cognition creates a loss of privacy. The self becomes public text, readable and editable by others (Teddy manipulates Leonard's notes too).

  ### Conclusion for the Seminar

  *Memento* does not refute the Extended Mind Thesis, but it strips it of its innocence. It shows that if the mind extends into the world, it inherits the world's corruptibility. The closing sequence demonstrates that the parity principle works both ways: just as the notebook can function like a brain, the brain can function like a forger.

  The film forces us to admit that the "system" Leonard relies on is not a cognitive prosthesis in the medical sense, but a moral crutch. The question shifts from "Are the tattoos part of his mind?" to "Is a mind that requires self-deception to function still a mind?" *Memento* suggests that the extended mind is not merely a metaphysical category, but a site of struggle. It is where we decide what kind of person we will be tomorrow, by writing instructions on the body we inhabit today. The thesis survives, but it comes out bloodied: the mind may be extended, but responsibility must remain intact, or the self dissolves into the artifacts it created to sustain itself.
