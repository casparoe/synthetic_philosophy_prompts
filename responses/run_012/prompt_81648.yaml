      *   **Conclusion:** What does the film add to the debate that arguments alone do not?

  2.  **Deconstruct the Extended Mind Thesis (EMT):**
      *   *Source:* Clark & Chalmers, "The Extended Mind" (1998).
      *   *Core Argument:* The Parity Principle. If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process.
      *   *Otto's Notebook:* Otto has Alzheimer's. He uses a notebook. He trusts it. It's always available. Therefore, the notebook entries are his beliefs.
      *   *Conditions:* Availability, Trust/Endorsement, Accessibility.

  3.  **Analyze *Memento* in relation to EMT:**
      *   *Leonard as Otto on Steroids:* Leonard has anterograde amnesia. He relies entirely on external scaffolding (tattoos, Polaroids, notes).
      *   *Surface Level:* Fits EMT perfectly. The tattoos are "always to hand." He trusts them implicitly (initially). They guide his action just as memory guides normal action.
      *   *The Twist:* Leonard is not a passive user of the system. He is an *editor*. He knows the system is fallible because *he* is the one writing the data.
      *   *The Ending:* Leonard chooses to ignore the truth (that he already killed John G.) and sets up a puzzle for his future self to solve, ensuring he has a purpose. He writes "Remember Sammy Jankis" on the photo of Teddy, knowing Teddy is the target, but framing it as a clue to a deeper conspiracy. He burns the other photos.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Set the scene. EMT claims cognition leaks into the world. *Memento* is the perfect test case because the leak is total. Leonard's mind *is* his artifacts.
      *   **The Parity Principle Applied:** Leonard's tattoos and notes function exactly like biological memory. They store information, guide action, and are trusted. By Clark & Chalmers' standards, Leonard's belief "Teddy is John G" is located on his thigh.
      *   **The Crack in the Thesis (The Ending):** Here is the crux. EMT assumes a certain *transparency* and *stability*. Otto trusts his notebook because it records the world. Leonard trusts his system because he *made* it.
      *   **Authorship and Manipulation:** The ending reveals the system isn't a neutral repository. It's a tool for self-deception. Leonard *authors* the beliefs his future self will hold. This challenges the "trust" condition. Is it trust if you know you might be lying to yourself?
      *   **Coupling vs. Constitution:** The objection (Adams & Aizawa) says coupling isn't constitution. *Memento* dramatizes this. The notes are coupled, but are they *constitutive* of belief if the belief is knowingly false? The film suggests the metaphysical status matters less than the *agency* involved.
      *   **The Ethical Turn:** This is the prompt's specific requirement. If the notes are part of the mind, then Leonard is responsible for what he writes *as if* it were a memory. The question shifts from "Is the note part of the mind?" to "Who is answerable for the note?" Leonard weaponizes his extended mind against himself.
      *   **Conclusion:** What does the film add? It adds *temporality* and *motivation*. Philosophy treats the extended mind statically. The film shows the diachronic struggle. It shows the *cost* of extending the mind. It reveals the vulnerability of the system to the agent's own desires.

  5.  **Refining the Tone:**
      *   Must be academic but engaging (seminar context).
      *   Must not "save" EMT artificially. If the film breaks it, say so.
      *   Must not treat the film just as a thought experiment. Acknowledge the narrative/emotional weight (Leonard's grief/guilt).

  6.  **Self-Correction/Nuance Check during drafting:**
