answer: |-
  ### 1. The Decision Procedure: The Nietzschean Docket Checklist

  **Time Allocation:** 15 Minutes per Item
  **Goal:** Determine if the proposal serves "life" (present and future action) or paralyzes it.

  **Step 1: Mode Diagnosis (2 Minutes)**
  *Do not ask the proposer to label their own request. Ask these three questions to the board. If the answer is "Yes" to more than one, the proposal is conflicted and must be split or clarified before proceeding.*

  1.  **Monumental Check:** Is the primary goal to provide an example of greatness that inspires us to *act* or *achieve* something similar today? (Keywords: Inspiration, Heroism, Model).
  2.  **Antiquarian Check:** Is the primary goal to preserve a connection to our origins, to show gratitude for where we came from, or to keep something because it is "ours"? (Keywords: Preservation, Roots, Piety, Heritage).
  3.  **Critical Check:** Is the primary goal to judge a past wrong, break a harmful narrative, or liberate us from a burden the past places on the present? (Keywords: Justice, Correction, Removal, Truth-telling).

  **Step 2: Service and Pathology Check (5 Minutes)**
  *Select the dominant mode from Step 1. Run the corresponding pair of questions. If the proposal fails the Pathology Check, it stops here with a **NO**.*

  *   **If Monumental:**
      *   **Service Claim:** Does this figure/event prove that great action is possible for us *now*?
      *   **Pathology Check:** Does honoring this figure require hiding or falsifying the costs of their greatness (e.g., violence, exploitation) to make the analogy work? If the "greatness" relies on conditions we reject (e.g., strike-breaking), does the monument console us with fake strength rather than equipping us for real struggle?
      *   *Stop Rule:* If the analogy requires lying about the past, **STOP (NO)**.

  *   **If Antiquarian:**
      *   **Service Claim:** Does preserving this object/site nurture a sense of belonging that helps the community grow?
      *   **Pathology Check:** Are we keeping this simply because it is old? Does preserving this prevent necessary change or consume resources needed for living culture? Is this "mummification" (keeping the dead alive) rather than preservation?
      *   *Stop Rule:* If the object serves no living purpose and blocks new growth, **STOP (NO)**.

  *   **If Critical:**
      *   **Service Claim:** Does judging/removing this past element free us to build something new and healthier?
      *   **Pathology Check:** Are we judging the past by present standards while pretending we are not products of that same past? Is this judgment a substitute for present-day justice (i.e., does removing the symbol let us avoid fixing the underlying problem)?
      *   *Stop Rule:* If the action is performative self-congratulation that masks present complicity, **STOP (NO)**.

  **Step 3: The Forgetting Test (5 Minutes)**
  *This step applies regardless of the mode. It tests the "Unhistorical."*

  1.  **The Loss Question:** If we do *nothing* and let this thing pass out of public memory (fall down, fade away, remain unnamed), what specific capacity for action or understanding is lost? Who specifically bears that loss?
  2.  **The Substitution Question:** Is this proposal a way of avoiding a present-day obligation by making a gesture toward the past? (e.g., Honoring workers instead of raising wages; Removing a statue instead of redistributing land).
  3.  **The Rootlessness Question:** (For Critical proposals only) Does this proposal pretend we can start from zero? If we remove this, do we lose the visible evidence of our own complicity in the history we are judging?

  *   *Stop Rule:* If the loss is negligible, or if the proposal is a substitute for present action, **STOP (NO)**.
  *   *Stop Rule:* If the proposal severs us from the past we must own to change the future, **STOP (NO)**.

  **Step 4: Verdict and Handoff (3 Minutes)**
  *   **Recommend YES:** If the proposal passes Steps 1, 2, and 3.
  *   **Recommend NO:** If the proposal fails any Pathology Check or the Forgetting Test.
  *   **HANDOFF TO COUNCIL (Value Choice):** If the proposal passes all checks but the decision rests on a competing definition of "the good life" (e.g., two valid historical narratives conflict), state clearly: *"Historically justified, but politically contested. Board recommends Council decide based on current policy priorities."*

  ***

  ### 2. The Forgetting Test (Detailed Protocol)

  *As requested, this step is prioritized. It operationalizes Nietzsche's concept that life requires both memory and the horizon of the "unhistorical" (the ability to forget).*

  **Instruction to Board:** Before voting, the Chair must read the following two prompts aloud. Board members must write down a one-sentence answer before discussing.

  **Prompt A (The Cost of Memory):** "If we approve this, we are forcing the public to remember this forever. What present action becomes *harder* because we are forced to remember this? Are we cementing a narrative that limits our future?"
  *   *Example:* If we statue the industrialist, do we make it harder to critique unchecked capitalism later?

  **Prompt B (The Cost of Forgetting):** "If we reject this (or remove the object), are we allowing ourselves to forget something we *need* to remember to stay honest? Are we cleaning the city to make ourselves feel innocent?"
  *   *Example:* If we remove the colonial monument, do we lose the daily reminder that our city's wealth is built on colonization?

  **Decision Rule:** If the answer to Prompt A is "It limits our future action," vote **NO**. If the answer to Prompt B is "It allows us to feign innocence," vote **NO** (or modify to retain the memory without the honor).

  ***

  ### 3. Application to Docket Items

  #### Case (a): The Industrialist Statue
  *Proposal: Erect statue of 19th-century founder (economic engine, strike-breaker).*
  *Mode: Monumental (Proposers want him as "example of local greatness").*

  *   **Step 1 (Mode):** Monumental. (Goal: Inspire economic greatness).
  *   **Step 2 (Service/Pathology):**
      *   *Service:* Claims to show that local grit builds prosperity.
      *   *Pathology Check:* To make him a model for *today*, we must ignore that his "greatness" relied on violent labor suppression. If we include the violence, he ceases to be a simple model of greatness. If we exclude it, we falsify history to console the wealthy.
      *   *Result:* **FAILS Pathology Check.** Monumental history cannot tolerate the "shadow" of the figure without losing its inspirational power.
  *   **Step 3 (Forgetting Test):**
      *   *Loss if forgotten:* We lose a symbol of industrial origin.
      *   *Substitution:* Is the statue a substitute for actual economic investment in the city today? Likely yes.
      *   *Result:* **FAILS Substitution Question.**
  *   **Step 4 (Verdict):** **Recommend NO.**
  *   **Board Action:** Do not erect the statue. Suggest a museum display where context can be fully managed, not a public monument.

  #### Case (b): The Domestic Ephemera Collection
  *Proposal: Continue funding a low-visit collection of local domestic objects.*
  *Mode: Antiquarian (Proposers say "it is ours and would be lost").*

  *   **Step 1 (Mode):** Antiquarian. (Goal: Preserve roots/ownership).
  *   **Step 2 (Service/Pathology):**
      *   *Service:* Claims to nurture belonging through objects.
      *   *Pathology Check:* "Almost no one visits." This is mummification. It reveres indiscriminately. It makes letting go impossible ("it is ours"). It consumes space for new narratives (migration).
      *   *Result:* **FAILS Pathology Check.** It stifles new life for the sake of dead piety.
  *   **Step 3 (Forgetting Test):**
      *   *Loss if forgotten:* Specific details of domestic life from X era.
      *   *Who bears loss:* Specialists. The public does not bear it (no visits).
      *   *Rootlessness:* Does deaccessioning cut us from our past? No, because the past is not served by hoarding unvisited objects.
      *   *Result:* **PASSES Forgetting Test (for removal).** Forgetting this specific collection serves life by freeing resources.
  *   **Step 4 (Verdict):** **Recommend NO (to funding).** Recommend deaccessioning to make space for the migration display.

  #### Case (c): The Colonial Monument Removal & Exhibit
  *Proposal: Remove colonial monument from main square; replace with critical exhibit.*
  *Mode: Critical (Proposers want to correct a wrong/remove harmful narrative).*
  *Note: Removal has broad support. Opponents argue it avoids actual change.*

  *   **Step 1 (Mode):** Critical. (Goal: Judge past wrong/liberate square).
  *   **Step 2 (Service/Pathology):**
      *   *Service:* Claims to stop honoring colonialism and educate the public.
      *   *Pathology Check:* Are we judging the past by present standards while forgetting we are its products? The opponents argue the exhibit is "self-congratulatory." If the exhibit says "We were bad then, but we are good now," it is pathological Critical history. It uses the past to absolve the present.
      *   *Result:* **FAILS Pathology Check.** The proposal risks becoming a ritual of purification rather than a tool for liberation.
  *   **Step 3 (Forgetting Test):**
      *   *Loss if removed:* The visible, uncomfortable evidence of colonial power in the *center* of civic life.
      *   *Rootlessness Question:* Does removal pretend we can start from zero? Yes. It suggests the square is now "clean." It allows the city to forget that the *structure* of the city (land ownership, power) remains colonial.
      *   *Substitution Question:* Is removing the statue a substitute for land restitution or policy change? The opponents say yes. The Board must acknowledge this risk.
      *   *Result:* **FAILS Forgetting Test.** Removing the monument allows the city to "forget" its ongoing complicity.
  *   **Step 4 (Verdict):** **Recommend NO (to Removal).**
  *   **Board Action:** Recommend retaining the monument *in situ* but adding a permanent, funded counter-monument or active programming that forces confrontation with the symbol, rather than removing the symbol and claiming the problem is solved.

  ***

  ### 4. The Unliked Outcome

  **Case (c) is the outcome you will not like.**

  You likely want to recommend removal. It has broad support, it aligns with contemporary standards of justice, and it clears the square of a symbol of oppression. It feels like progress.

  **The Procedure tells you to vote against removal.**

  Here is why, plainly: The procedure identifies the proposal as **Critical History**. Nietzsche warns that Critical history becomes pathological when it allows the present to judge the past *in order to feel superior*, rather than to change the present. By removing the monument and replacing it with an exhibit explaining "what this was," the city performs a ritual of cleansing. It says, "That was then."

  The Forgetting Test reveals that if the monument is removed, the city gains the ability to **forget** that the main square is still colonial ground. The monument is a wound. Nietzsche argues that sometimes we must live with the wound to remember we are capable of inflicting it. Removing it treats the symptom (the stone) while ignoring the disease (the ongoing structure).

  The procedure forces you to tell the Council: *"Keeping the monument is historically healthier than removing it, because removal allows us to forget our complicity. We must live with the offense to remain honest."*

  This will be unpopular. It will look like you are defending colonialism. You are not. You are defending the necessity of remembering guilt over the comfort of erasing it. But in a public meeting, that distinction will not save you from the accusation that you want to keep a racist statue. The procedure demands you accept that risk.

  ***

  ### 5. Limitations and Failure Modes

  **What This Procedure Cannot Do:**

  1.  **It Cannot Define "Life":** Nietzsche says history must serve "life," but he does not define whose life. A proposal might serve the "life" of a dominant cultural group while stifling a minority group. The procedure identifies the *mode*, but it cannot resolve conflicting claims about which community's vitality matters more. That remains a political value choice (Step 4 Handoff).
  2.  **It Cannot Prevent Council Overturn:** The procedure creates a robust historical argument, but the City Council operates on votes, not philosophy. They may overturn a "No" on the Industrialist because donors are angry. The procedure protects the *Board's integrity*, not its *authority*.
  3.  **It Relies on Radical Honesty:** The Pathology Checks require board members to admit their own motivations. If the board secretly wants the Industrialist statue because they like the aesthetic of power, they will lie on the Pathology Check. The procedure has no enforcement mechanism against bad faith.
  4.  **It Drops the "Suprahistorical":** Nietzsche discusses a fourth category, the "suprahistorical" (art and religion that turn attention away from history entirely). I have dropped this. Municipal boards deal in public space and policy, not spiritual transcendence. Including it would confuse the docket without yielding actionable votes.
  5.  **False Confidence:** The procedure may produce a confident "Yes" that a professional historian would overturn. For example, in Case (a), we might decide a "contextualized statue" is possible. A historian might tell you that a statue *is* inherently monumental and cannot be contextualized into neutrality. The procedure treats "Monumental" as a mode of intent, but the *medium* itself carries historical weight the checklist might miss.

  **Use this tool to clarify your arguments, not to guarantee your victory. It will not stop the council from overturning you, but it will ensure that when they do, they are overturning a coherent philosophy, not just a hesitation.**
