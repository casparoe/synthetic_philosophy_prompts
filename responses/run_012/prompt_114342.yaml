      *   *Actually, a sharper distinction:* Is her claim to knowledge based on *infallible* access (impossible in history) or *abductive* inference?
      *   *Let's go with:* **The nature of her original justification.** Is it purely internal (paleography, style) which the lab report trumps, or does she have external corroboration independent of the physical document?

      *   *Re-evaluating the "Further Piece of Information":* The prompt asks to settle the *competing diagnoses*. My diagnoses are roughly:
