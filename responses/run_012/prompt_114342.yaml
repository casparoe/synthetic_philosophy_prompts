answer: |-
  Colleague,

  This is a profound disturbance you are describing, precisely because it strikes at the nerve of our shared enterprise: the relationship between justified belief, the attribution of knowledge, and the norms of inquiry. Your friend's position is seductive because it leverages a truth about knowledge (its factivity) to justify a violation of the norms of inquiry (openness to defeaters).

  Let us proceed as you asked, by slowing down the reasoning, reconstructing the possible arguments she is making, and locating the precise point where the logic frays.

  ### I. Brainstorming Reconstructions

  To diagnose the error, we must first steelman her position. There are at least four distinct epistemological frameworks she might be implicitly invoking.

  **1. The Factivity Reconstruction (The Logical Move)**
  *   *Premise:* Knowledge is factive (If $S$ knows $p$, then $p$ is true).
  *   *Premise:* I know the charter is genuine ($p$).
  *   *Inference:* Therefore, $p$ is true.
  *   *Inference:* Therefore, any evidence for $\neg p$ (the lab report) is evidence for a falsehood.
  *   *Conclusion:* The lab report is misleading.
  *   *Where it holds:* This is logically valid. If she *actually* knows, the report *is* wrong.
  *   *Where it breaks:* It conflates the *state* of knowing with the *claim* to know. She is using the claim ("I know") to prove the state ("I know"), which then dismisses the evidence that threatens the state. This is epistemic bootstrapping.

  **2. The Defeasibility Reconstruction (The Justification Move)**
  *   *Premise:* Knowledge is justified true belief without defeaters.
  *   *Claim:* I had justification (paleography, context) sufficient for knowledge.
  *   *Problem:* The lab report is a "potential defeater."
  *   *Her Move:* She treats the knowledge claim as *prior* to the defeater. She argues that because she *already* knows, the report cannot be a *real* defeater, only an apparent one.
  *   *Where it breaks:* In standard epistemology (e.g., Klein, Lehrer), a potential defeater must be *neutralized* to maintain knowledge. One cannot simply assert knowledge to neutralize the defeater; one must provide independent reasons to doubt the defeater.

  **3. The Contextualist Reconstruction (The Standards Move)**
  *   *Premise:* The standards for "knowing" shift depending on context.
  *   *Claim:* In the context of writing the book, standards were met.
  *   *Her Move:* She is refusing to acknowledge that the arrival of the lab report has shifted the context. She is trying to play by the old rules in a new game.
  *   *Where it breaks:* Contextualism explains why we might say "she knew" before the report and "she doesn't know" after. It does not license her to ignore the report while remaining in the high-stakes context of current scholarly debate.

  **4. The Psychological Certainty Reconstruction (The Confidence Move)**
  *   *Premise:* "I know" is an expression of maximal subjective confidence.
  *   *Claim:* I am as sure of this as anything.
  *   *Her Move:* She treats subjective certainty as a shield against objective evidence.
  *   *Where it breaks:* This is the confusion you suspected. It conflates the phenomenology of conviction with the normative status of knowledge.

  ### II. Analysis of the Inference

  You asked: *Is the inference from "I know it" to "whatever counts against it is misleading" valid, and if so, in what sense?*

  **It is valid metaphysically, but useless epistemically.**

  If it is a fact that she knows the charter is genuine, then it is a fact that the charter is genuine, and consequently a fact that the lab report is erroneous. In the "God's eye view" of truth, her inference is sound.

  However, epistemology is not about the God's eye view; it is about the *agent's perspective*. She does not have access to the fact that she knows without relying on the very evidence that is now under attack. To use the claim "I know" to dismiss the report is to assume the conclusion (that the charter is genuine) to prove the premise (that the report is flawed).

  This is where the principle becomes **self-undermining as a guide to action**.
  If she adopts the policy "If I believe I know, I ignore counter-evidence," she destroys the very mechanism that allows her to distinguish between *knowing* and *being confidently wrong*. History is littered with scholars who "knew" documents were authentic until science proved otherwise. By refusing to investigate the flaw, she prevents herself from discovering if her "knowledge" was actually knowledge or merely true belief (or false belief).

  ### III. Costs and the Expert/Student Distinction

  **What does she stand to lose?**
  1.  **Epistemic Safety:** If the report is right, she loses her book's thesis. By not checking, she risks public humiliation later when the flaw in the report is not found, but the charter is nonetheless proven fake by other means.
  2.  **Credibility:** In the academy, the willingness to subject one's "knowledge" to stress-testing is a signal of integrity. Refusing to do so signals dogmatism.
  3.  **The Status of Knowledge It:** If she treats knowledge as immune to evidence, she changes the meaning of the word. She is no longer claiming *historical knowledge* (which is inherently abductive and defeasible); she is claiming *revelation*.

  **Does her status as an expert change the answer?**
  Paradoxically, it makes her position *worse*, not better.
  A student might be forgiven for confusing confidence with knowledge due to inexperience. An expert historian, however, understands that historical knowledge is built on the convergence of independent lines of evidence. Her expertise implies she understands the fallibility of paleography and contextual analysis.
  Furthermore, the "Expert" label carries a normative burden. A student learns norms; an expert embodies them. If she models this behavior, she teaches her graduate students that once a thesis is published, it is insulated from empirical refutation by the sheer force of the author's conviction.

  ### IV. Recommendation: What to Say to Her

  You need a response that validates her logical point (factivity) while correcting her procedural error (inquiry). You must separate the *truth of the proposition* from the *warrant of the belief*.

  **Here is a concrete script you might adapt:**

  > "I want to grant you the logic of your position, because strictly speaking, you are right: if you *know* the charter is genuine, then the lab report is wrong. Truth is factive.
  >
  > But here is the trap: You are using the *claim* of knowledge to bypass the *verification* of knowledge. In history, 'knowing' isn't a mental state that protects us from error; it's a status we earn by surviving attempts at falsification.
  >
  > If you are right, and the charter is genuine, then the lab report contains a flaw. But you cannot identify that flaw by assuming it exists. You identify it by looking for it. If you refuse to look, you aren't protecting your knowledge; you are insulating your belief.
  >
  > So, I suggest a shift in phrasing. Do not say, 'I know this, so the report is wrong.' Say, 'I have strong prior justification for this, so the report is *surprising*, and I will investigate it to find the error.'
  >
  > The first statement makes you dogmatic. The second makes you a rigorous defender of the truth. If you are right, the investigation will vindicate you. If you are wrong, the investigation will save you from building a career on a mistake. Either way, you must look."

  ### V. The Crucial Piece of Information

  To settle which of my competing diagnoses is correct (whether she is a dogmatist confusing confidence with knowledge, or a rational agent simply weighing priors), you need to know the limits of her fallibility.

  **Ask her this:**
  > "If three independent laboratories, using different dating methods, all produced the same report, would you concede that you did not *know* the charter was genuine?"

  **Why this settles it:**
  *   **If she says "Yes":** Then she is not epistemologically confused about the nature of knowledge. She simply believes the *current* evidence is weak. Her error is one of **calibration** (overestimating her priors), not principle. She is acting like a Bayesian with extreme confidence, not a dogmatist.
  *   **If she says "No":** Then she is a **dogmatist**. She has decoupled her belief from empirical evidence entirely. In this case, her claim to "knowledge" is indeed a confusion of psychological certainty with epistemic warrant, and no amount of evidence will move her.

  This question forces her to reveal whether her "knowledge" is anchored in the world (and thus vulnerable to it) or anchored in her own conviction (and thus immune). Her answer will tell you whether this is a dispute about evidence or a crisis of epistemic humility.
