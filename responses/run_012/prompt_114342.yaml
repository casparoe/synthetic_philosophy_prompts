      *   *Reconstruction B: The Closure Principle.* If I know $p$, and I know that $p$ entails $q$ (e.g., "the report is wrong"), do I know $q$?
          *   *Weakness:* Dretske/Nozick style tracking theories suggest knowledge isn't always closed under known entailment, especially regarding skeptical hypotheses.
      *   *Reconstruction C: Defeasibility Theory.* Knowledge is justified true belief + no defeaters.
          *   *Weakness:* The lab report *is* a potential defeater. Claiming knowledge *before* resolving the defeater is question-begging.
      *   *Reconstruction D: Contextualism.* In her context (writing the book), the standards were met. Now the context has shifted (new evidence), raising the standards.
          *   *Weakness:* She is refusing to acknowledge the context shift.
      *   *Reconstruction E: The "Knowledge Norm of Inquiry" vs. "Knowledge as a State".* Knowing $p$ implies $p$ is true. But *taking oneself* to know $p$ in the face of new evidence is the problem.

