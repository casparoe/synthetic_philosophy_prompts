  7.  **Final Polish:** Check word count and flow. Ensure the transition from "epistemic" to "objective structure" is smooth. (The key move: Epistemic limits imposed by physical law are objective facts.)

      *   *Drafting thought:* Make sure I don't slip into "ontological emergence" in the traditional sense (new causal powers). Stick to the prompt's definition: emergence as intractable compression. But argue that this intractability is a real feature of the world.

