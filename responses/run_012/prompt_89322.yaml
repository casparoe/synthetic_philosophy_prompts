answer: |-
  ### Status Key
  To satisfy your final constraint, I have marked every claim below with one of three registers:
  *   **[Consensus]:** Settled among specialists in classical Indian epistemology (e.g., textual definitions, school affiliations).
  *   **[Contested]:** Genuinely debated in secondary literature (e.g., interpretations of specific sūtras, alignment with Western categories).
  *   **[Construction]:** My own philosophical construction for the purpose of this seminar verdict (e.g., numerical weights, specific ranking decisions where texts are silent).

  ---

  ### Part 1: Ranking under External Certification (*Parataḥ-prāmāṇya*)

  **Context:** This ranking assumes the Nyāya position that a cognition's validity must be confirmed by external factors (successful action, lack of defeaters) and that testimony requires established speaker reliability.

  **The Verdict:**
  1.  **Perception (*Pratyakṣa*): 0.45**
  2.  **Inference (*Anumāna*): 0.30**
  3.  **Comparison (*Upamāna*): 0.15**
  4.  **Testimony (*Śabda*): 0.10**

  **Justification:**
  *   **Perception (0.45):** **[Construction]** This receives the highest weight due to **causal contact with the object**. In Nyāya, perception is the foundational *pramāṇa* because it provides the raw data (*nirvikalpaka*) upon which other sources depend. Even unconfirmed, a perceptual episode has the highest prior probability of accuracy because the causal chain is shortest.
  *   **Inference (0.30):** **[Construction]** Weight is derived from the **reliability of the process**. Inference relies on *vyāpti* (pervasion/universal connection). While robust, a single unconfirmed inferential step is riskier than perception because it depends on the memory of a universal connection which could be flawed (*upādhi* or limiting conditions).
  *   **Comparison (0.15):** **[Construction]** This relies on the **availability of independent checks** via memory and similarity. It is ranked lower because its scope is narrow (naming/identifying via similarity) and it is heavily dependent on the accuracy of prior perceptual memory, introducing more points of failure than direct inference.
  *   **Testimony (0.10):** **[Consensus]** **[Construction]** Nyāya is reductionist regarding testimony. For a speaker of **unknown reliability**, the evidential weight is minimal. Nyāya insists the speaker must be an *āpta* (competent and truthful). Without prior confirmation of this status, the report is merely sound, not knowledge. The **presence or absence of defeaters** is unknown, so the default is skepticism.

  ---

  ### Part 2: Ranking under Intrinsic Validity (*Svataḥ-prāmāṇya*)

  **Context:** This ranking assumes the Mīmāṃsā/Vedānta position that a cognition is valid by its very genesis and stands until defeated (*bādhita*).

  **The Verdict:**
  1.  **Perception (*Pratyakṣa*): 0.35**
  2.  **Testimony (*Śabda*): 0.30**
  3.  **Inference (*Anumāna*): 0.25**
  4.  **Comparison (*Upamāna*): 0.10**

  **Justification:**
  *   **Perception (0.35):** **[Construction]** Weight remains high but drops relatively because other sources gain ground. The **causal contact** is still primary, but the *need* for that contact to be certified is removed.
  *   **Testimony (0.30):** **[Consensus]** **[Construction]** Weight increases dramatically. Under *svataḥ-prāmāṇya*, the **absence of defeaters** is the only requirement for validity. A report from a speaker of unknown reliability is granted presumptive truth. The burden of proof shifts to the skeptic. This elevates Testimony above Inference, reflecting the Mīmāṃsā prioritization of verbal authority (especially Vedic, but extending to the structure of language itself).
  *   **Inference (0.25):** **[Construction]** Weight decreases relative to Testimony. While the **reliability of the process** is intrinsic, inference is more susceptible to subtle logical defects than the direct grasp of meaning in testimony (under the Mīmāṃsā view of language).
  *   **Comparison (0.10):** **[Construction]** Remains lowest due to limited scope, though its intrinsic validity is acknowledged.

  **Does the Ordering Change?**
  **[Construction]** Yes. The order of **Inference and Testimony swaps**.
  *   In the *Parataḥ* (Nyāya) model, Inference > Testimony (unknown) because logical pervasion is structurally more reliable than an unverified claim.
  *   In the *Svataḥ* (Mīmāṃsā) model, Testimony > Inference because the intrinsic validity of linguistic cognition is granted a higher default status than the inferential process, which requires active mental construction.

  **Implication:**
  **[Construction]** This stability in the top spot (Perception) but instability in the middle spots shows that **source reliability** (the structural capacity to produce truth) is distinct from **validity certification** (how we know it is true). Perception is structurally most reliable in both systems. However, the *status* of Testimony is entirely dependent on the theory of validity. This demonstrates that epistemic weight is not solely a function of the source's causal power, but of the normative default status assigned to the cognition.

  ---

  ### Part 3: Labels and School Affiliations

  **Labels:**
  **[Consensus]** Your labels are correct.
  *   *Svataḥ-prāmāṇya* (Intrinsic Validity): The position that validity is known by the same factors that generate the cognition.
  *   *Parataḥ-prāmāṇya* (Extrinsic Validity): The position that validity is known by factors external to the generation of the cognition (e.g., successful action).

  **School Endorsements:**
  *   **Nyāya:** **[Consensus]** Endorses the first ranking (*Parataḥ*). Nyāya explicitly argues that we do not know a cognition is valid until we achieve the desired result (*samvādi pravṛtti*).
  *   **Mīmāṃsā (Prābhākara & Bhāṭṭa):** **[Consensus]** Endorses the second ranking (*Svataḥ*). They argue that if validity required external certification, we would face an infinite regress (what certifies the certifier?).

  ---

  ### Part 4: Postulation (*Arthāpatti*) and Non-Apprehension (*Anupalabdhi*)

  **Placement in Ranking:**
  **[Construction]** If inserted into the *Parataḥ* (Nyāya) ranking:
  *   **Arthāpatti:** 0.25 (Would sit between Inference and Comparison).
  *   **Anupalabdhi:** 0.20 (Would sit near Comparison).

  **Nyāya's Refusal:**
  **[Contested]** Is Nyāya's refusal substantive or boundary-drawing?
  *   **The Reductionist View ([Consensus]):** Nyāya argues these are not independent sources. *Anupalabdhi* (knowing an absence) is a type of Perception (*pratyakṣa*) of the empty locus, or a type of Inference. *Arthāpatti* (postulating a fact to explain an anomaly, e.g., "Devadatta is alive because he is not at home") is treated as Inference based on a universal connection between "absence from home" and "being elsewhere/alive."
  *   **The Substantive View ([Contested]):** Some scholars argue Nyāya's refusal is **substantive epistemological parsimony**. They refuse to multiply *pramāṇas* beyond necessity. If a cognitive event can be explained by existing causal mechanisms (perception or inference), positing a new source is ontologically wasteful.
  *   **My Verdict ([Construction]):** It is a **substantive decision** disguised as boundary-drawing. By forcing *arthāpatti* into Inference, Nyāya commits to the view that all explanatory reasoning relies on previously grasped pervasions (*vyāpti*). Mīmāṃsā argues *arthāpatti* involves a unique "explanatory necessity" not captured by standard inference. Nyāya's refusal thus commits them to a stricter view of what counts as a universal connection.

  ---

  ### Part 5: Status Audit

  To ensure you do not present contested readings as consensus in your seminar, here is the breakdown of the answer above:

  1.  **Settled Consensus:**
      *   Nyāya accepts exactly four *pramāṇas*.
      *   Nyāya holds the *parataḥ-prāmāṇya* (extrinsic validity) view; Mīmāṃsā holds *svataḥ-prāmāṇya* (intrinsic validity).
      *   Nyāya reduces *arthāpatti* and *anupalabdhi* to Inference or Perception.
      *   Nyāya requires speaker reliability (*āpta*) for Testimony to count as knowledge.

  2.  **Genuinely Contested:**
      *   **Nyāya as Reliabilist:** While Nyāya is externalist, equating it directly with contemporary process reliabilism is debated. Some argue Nyāya includes internalist elements (awareness of the *pramāṇa* conditions).
      *   **The Hierarchy of *Upamāna* vs. *Śabda*:** Texts vary on whether Comparison or Testimony is "stronger." My ranking places Testimony lower in the *Parataḥ* scenario specifically because of the "unknown speaker" constraint, which is a philosophical stipulation rather than a textual quote.
      *   **Nature of Reduction:** Whether Nyāya's reduction of *arthāpatti* is purely logical or ontological is debated among specialists (e.g., B.K. Matilal vs. J.N. Mohanty interpretations).

  3.  **My Construction:**
      *   **The Numerical Weights:** There are no numbers in the *Nyāya-sūtra*. The percentages (0.45, 0.30, etc.) are heuristic devices for your seminar to force a verdict.
      *   **The Swap:** The claim that Testimony overtakes Inference under *Svataḥ* is a philosophical extrapolation based on Mīmāṃsā's prioritization of Śabda, not a direct textual ranking of "weights."
      *   **The "Unknown Speaker" Constraint:** Applying contemporary "reductionism vs. anti-reductionism" frameworks to the Nyāya/Mīmāṃsā debate is an interpretive lens, not a native category.

  **Recommendation for Seminar:** Present the numbers as a "model of epistemic risk" rather than historical fact. Use the swap between Inference and Testimony to drive the discussion on how theories of validity (how we know we know) alter the practical weight we give to sources (how we acquire knowledge).
