  3. If E is in my past in some frame, then E is settled. If E is in my future in some frame, then E is open.
  4. So E is both settled and open.
  5. That can't be right. The only way out is that all events are equally real, and the passage of time is an illusion. The block universe is true.
  6. He says this also means my choice to eat cereal this morning was always there in the block, and nothing ever really happens.

