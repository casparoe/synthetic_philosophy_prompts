  Two neighbors, X and Y, assist an elderly resident in moving a heavy sofa on a Saturday morning, fulfilling a standing community agreement that residents aid one another with heavy labor. Both X and Y find the task physically enjoyable and like the resident personally, chatting cheerfully throughout the effort; their lifting, carrying, and placement of the sofa are behaviorally identical, as is the relief and gratitude experienced by the recipient. When asked afterward why they helped, both report simply that they were happy to do it and enjoyed the company. However, in a private follow-up interview, when asked whether they would have still performed the labor if the resident had been surly and the sofa significantly heavier, X confirms she would have done it regardless because the agreement obligated her, while Y admits she would have fabricated an excuse to stay home.

  **Rightness Assessment**
  Both agents performed the morally required action. The community agreement establishes a duty of mutual aid, the resident had a genuine need, and no overriding excusing conditions were present. Since both X and Y successfully executed the required labor with the same beneficial consequences, the assessment of rightness is identical for both: the action was required, and both fulfilled the requirement.

  **Reading (A) Assessment**
  Reading (A) denies moral worth to both X and Y. For (A), moral worth depends on the operative motive in the actual performance of the action. Since both agents report that their actual motivation was enjoyment and personal liking rather than the recognition of the requirement itself, the dutifulness of the act did not produce the act. The fact that X possesses a robust counterfactual commitment to duty does not alter the fact that, in the actual case, inclination was the determining ground. Therefore, neither agent acts from duty, and neither action has moral worth.

  **Reading (B) Assessment**
  Reading (B) grants moral worth to X but denies it to Y. For (B), the motive of duty need not be the operative force so long as it functions as a limiting condition. X recognizes the requirement and confirms that this recognition would have vetoed her inclination had the two conflicted; thus, duty permitted the inclination to run. Y, however, admits that had inclination conflicted with duty, she would have violated the requirement. Because Y's commitment to duty lacks the necessary veto power, her action lacks moral worth, while X's retains it despite being inclination-driven.

  **Load-Bearing Feature**
  The load-bearing feature is the divergence between the actual motive (inclination for both) and the counterfactual motive in conflict (duty for X, inclination for Y). If this feature is removed—specifically, if X's actual motive were stipulated as duty rather than inclination—Reading (A) would grant worth to X, collapsing the disagreement between the readings. If reversed—such that X would also have failed the requirement in the counterfactual scenario—Reading (B) would deny worth to X, again resulting in agreement between the readings that X lacks worth.

  **Strongest Objection (Defender of Reading A)**
  "You claim that X's actual motive is merely inclination, yet you simultaneously stipulate that X possesses a disposition to obey duty even when it conflicts with inclination. This counterfactual resilience is not a separate feature from the actual motive; it is the diagnostic mark of duty being operative *now*. If X truly holds duty as a veto, that commitment is currently active, merely overdetermined by inclination. To deny X moral worth because enjoyment was also present is to demand that duty must struggle against inclination to be real, which fetishizes the motive rather than honoring the reliable good will that X actually demonstrates."

  **Unobservable Fact Requirement**
  Yes, the case requires facts about the agents' counterfactual dispositions—specifically, what they would have done had the circumstances been less pleasant. No external observer could verify this solely from the actual behavior, as the actions were identical. This fact is accessible only through agent self-report or hypothetical interrogation. However, this does not make the case unusable for philosophical discussion, as moral worth is inherently a property of the agent's internal maxim rather than observable conduct, and thought experiments routinely stipulate such inner states to test conceptual boundaries.

