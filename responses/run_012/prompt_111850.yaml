answer: |-
  **Exam Question**

  Consider the following two systems of sentences. Assume for the first part of your answer that we are working within a standard classical logic where every sentence is either true or false (bivalence), and the T-schema holds (i.e., a sentence "$\phi$" is true if and only if $\phi$).

  The Pair:
  (1) "(2) is not true."
  (2) "(1) is not true."

  The Triple:
  (3) "(4) is not true."
  (4) "(5) is not true."
  (5) "(3) is not true."

  Analyze the logical status of the Pair and the Triple under this classical treatment. Do they behave the same way? Next, suppose we reject bivalence to avoid contradiction, adopting a three-valued logic where sentences can be True, False, or Neither (a "gap"). Assume negation maps True to False, False to True, and Neither to Neither. How does this semantic shift alter the status of the Pair and the Triple compared to the classical result? Finally, consider a single sentence $\lambda$ that says of itself: "$\lambda$ is not true." Explain why the three-valued gap account struggles to provide a coherent description of $\lambda$'s status without generating a new contradiction or expressive failure.

  ***

  **Model Answer**

  Under a classical two-valued treatment, the Pair and the Triple behave fundamentally differently. In classical logic, every sentence must be assigned either True (1) or False (0). We analyze the Pair first. Suppose (1) is True. Then, by the content of (1), (2) is not True, so (2) is False. If (2) is False, then the claim "(1) is not true" is false, which implies (1) is True. This yields a consistent assignment: (1)=True, (2)=False. Alternatively, suppose (1) is False. Then (2) is not False, so (2) is True. If (2) is True, then (1) is not True, so (1) is False. This yields a second consistent assignment: (1)=False, (2)=True. Thus, the Pair is not paradoxical in classical logic; it is merely contingent, possessing two stable models.

  The Triple, however, is inconsistent classically. Suppose (3) is True. Then (4) is False. If (4) is False, then (5) is True. If (5) is True, then (3) is False. We began assuming (3) is True and derived that (3) is False, a contradiction. Suppose instead (3) is False. Then (4) is True. If (4) is True, then (5) is False. If (5) is False, then (3) is True. We began assuming (3) is False and derived that (3) is True, again a contradiction. Since no assignment of True or False avoids contradiction, the Triple has no classical model. The classical distinction is sharp: the Pair is consistent, while the Triple is impossible.

  When we shift to a three-valued gap logic (True, False, Neither), where negation maps Neither to Neither, this distinction collapses. In this system, we can assign the value Neither to every sentence in both systems. For the Pair, if (1)=Neither and (2)=Neither, then "(2) is not true" evaluates to Neither (since negating Neither yields Neither). This matches the value of (1). The same holds for the Triple: if (3), (4), and (5) are all Neither, the negations cycle consistently without forcing a contradiction. Consequently, the gap account renders the Triple satisfiable, whereas it was unsatisfiable classically. While the Pair remains satisfiable (now with a third, gap solution), the critical logical difference vanishes: both systems are treated as capable of having gap values. The gap account saves the Triple from inconsistency only by sacrificing the claim that these sentences have determinate truth values.

  However, this solution faces a severe revenge problem when applied to the simple Liar sentence $\lambda$: "$\lambda$ is not true." The gap theorist assigns $\lambda$ the value Neither. This is intended to block the contradiction found in classical logic. But if $\lambda$ is Neither, then it is indeed *not True*. Therefore, what $\lambda$ says ("$\lambda$ is not true") appears to be correct. If a sentence says something correct, it ought to be True. Yet the theory insists $\lambda$ is Neither, not True.

  The problem deepens when we try to express this status. We want to say "$\lambda$ is not true." But in this logic, the predicate "is not true" is represented by negation. Since $\lambda$ is Neither, "$\lambda$ is not true" also evaluates to Neither. We are thereby prevented from asserting as *True* the very claim that $\lambda$ is not true. The theory forces us to treat the statement "$\lambda$ is not true" as neither true nor false, even though the theory itself relies on $\lambda$ failing to be true to avoid contradiction. To maintain consistency, the gap theorist cannot assert the Liar is not true without implying it is true (via the T-schema), nor can they assert it is a gap without implying that claim is true. The account thus lacks the expressive resources to describe the Liar's status without collapsing back into paradox or silence.

  ***

  **Marking Scheme (25 Marks)**

  **1. Classical Analysis (8 Marks)**
  *   **4 Marks:** Correctly derives that the **Pair** has two stable classical models (T/F and F/T) and is therefore consistent/non-paradoxical.
  *   **4 Marks:** Correctly derives that the **Triple** has no stable classical models (leads to contradiction in both cases) and is therefore inconsistent/paradoxical.
  *   *Deduction:* If the student claims the Pair is paradoxical/inconsistent classically, cap this section at 2 marks.

  **2. Gap Logic Analysis (8 Marks)**
  *   **4 Marks:** Correctly applies the three-valued negation rule ($\neg$Neither = Neither) to show that both the Pair and the Triple can be consistently assigned "Neither."
  *   **4 Marks:** Explicitly notes that the logical difference found in classical logic (Consistency vs. Inconsistency) collapses or vanishes in the gap account, as both become satisfiable via gaps.
  *   *Deduction:* If the student fails to run the derivation for the Triple in gap logic, deduct 3 marks.

  **3. Revenge/Expressive Problem (9 Marks)**
  *   **5 Marks:** Identifies the core tension: If $\lambda$ is a gap, it is "not true," which makes its content correct, suggesting it should be True.
  *   **4 Marks:** Explains the expressive failure: The theory prevents us from asserting "$\lambda$ is not true" as True (because the sentence evaluates to Neither), yet the theory relies on $\lambda$ not being true to function.
  *   *Common Wrong Turn (Cap at 12/25 total):* Students who argue the revenge problem is simply that "$\lambda$ is a gap" is contradictory. The problem is not internal contradiction, but the inability to *state* the solution correctly (expressive incompleteness).
  *   *Deduction:* If the student suggests the gap account solves $\lambda$ completely without residue, deduct all 9 marks from this section.

  **General Penalties**
  *   **Citations/Names:** Deduct 5 marks total if any philosophers or specific paper titles are cited (exam must be self-contained).
  *   **Wrong Sentences:** Deduct 5 marks if the student substitutes the standard Liar for the Pair/Triple in the first section.
