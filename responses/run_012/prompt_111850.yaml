prompt: |-
  For an upper-level seminar (third-year, maybe a few master's students) I run on truth and paradox, I'm writing the final. I want ONE essay question, 75 minutes, out of 25 marks, and it must not be answerable by reciting "the Liar is neither true nor false" or "Kripke builds a fixed point." Here's the setup I want the question to be built around — please use exactly these little sentence-systems, don't swap in the textbook Liar:

  The pair:
  (1) "(2) is not true."
  (2) "(1) is not true."

  The triple:
  (3) "(4) is not true."
  (4) "(5) is not true."
  (5) "(3) is not true."

  I want students to have to notice that the pair and the triple come out differently under a plain classical two-valued treatment, and then to see what happens to that difference once you go to a three-valued gap account where sentences can be neither true nor false. And then I want the revenge point to bite — something like a sentence that says of itself that it isn't true (or isn't determinately true), which the gap account apparently mishandles. Don't spell any of this out for them; make them do the work. Keep everything self-contained — no reading list, no citations, no names of papers, they can't look anything up in the exam.

  So please write: the exam question itself (a paragraph or so, pitched so a good student knows what's being asked without being told the answer); a model answer of roughly 700 words; and a marking scheme out of 25 that names the specific moves a top answer has to make and the specific moves whose absence should cost marks, including at least one very common wrong turn that should cap a student below a first. Where you give the model answer, actually run the little derivations so I can check them. Please write it in American English.
