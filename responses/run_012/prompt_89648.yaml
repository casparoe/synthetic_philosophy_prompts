  The new case is this: tomorrow you will undergo a treatment that you have good evidence reliably improves people's calibration on exactly this kind of question — you would advise anyone in your position to take it — but it works by rendering you unresponsive to all but the three strongest documents in the file, so that your credence tomorrow will be formed from less of your evidence than you have now.

  Predict her verdict, set out the rules that fit her five rulings, say what each of those rules predicts about the new case, tell me which rule you would bet she is running and why, and name one further case that would distinguish whichever rules your answer leaves standing.
