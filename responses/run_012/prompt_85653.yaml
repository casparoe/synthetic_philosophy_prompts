  Your tentative principle is a robust and well-regarded approach in decision theory, often associated with the concept of resolute choice or ex-ante optimization. It holds that a rational agent should select the strategy that maximizes expected value from the initial planning perspective and then adhere to that strategy throughout the process, regardless of how options appear at later stages. This principle successfully accommodates your verdicts regarding the use of a random device, the value of precommitment, and the willingness to pay for information like a GPS. These three verdicts all align with the idea that the initial calculation of overall expected value is the authoritative guide for action. The conflict you perceive arises only when you compare this principle to your local verdict that continuing looks better than turning at the intersection. To maintain your principle without adding patching clauses, you should give up the local verdict. The intuition that continuing looks better at the moment is a cognitive illusion generated by the amnesia condition, which tempts you to treat the current decision as independent from the decisions made at previous identical intersections.

  The reason you must reject the local verdict to save your principle is that in problems involving imperfect recall, your current choice provides evidence about what you would have chosen in the past. Because you cannot distinguish between the intersections, the strategy you adopt now is the same strategy you employed previously. If you decide to continue at the current intersection, you must acknowledge that you would have also continued at the previous one. This logical connection affects the probability of which intersection you are actually at. If you continue, it becomes more likely that you are at the first intersection rather than the second, because reaching the second requires having continued already. Your local intuition that continuing looks better often stems from neglecting this correlation and focusing only on the immediate payoff possibilities. Furthermore, your specific reasoning that turning guarantees a payoff of zero is inconsistent with the setup you described, where turning at the second intersection yields a payoff of four. While the uncertainty makes turning risky, it does not guarantee zero, and the feeling that continuing is superior is misleading because following that local impulse would lead you to always continue, resulting in a payoff of zero when you pass the final intersection. Therefore, the local verdict is the weak link, and discarding it preserves the integrity of your principle that the initial plan dictates action.

  Applying this same principle to the three-intersection case yields a clear recommendation without requiring new clauses. You should still choose a single probability of continuing that maximizes the expected value from the start and use that same probability at every intersection. In this scenario, if you continue with probability p at each junction, the chance of exiting at the first intersection is one minus p, yielding zero. The chance of reaching and exiting at the second intersection is p times one minus p, yielding a payoff of two. The chance of reaching and exiting at the third intersection is p squared times one minus p, yielding a payoff of four. The chance of passing all three is p cubed, yielding zero. To find the optimal policy, you must maximize the sum of these expected values, which simplifies to maximizing the expression two p plus two p squared minus four p cubed. Solving for the maximum value indicates that you should continue with a probability of approximately sixty-one percent at each intersection. This specific probability balances the risk of exiting too early against the risk of going too far, just as the fifty percent probability did in the two-intersection case.

  The consistency of this outcome reinforces your tentative principle. In both the two-intersection and three-intersection versions, the rational approach is to calculate the optimal mixed strategy from the outset and resolve to follow it. The driver should randomize at each intersection using the calculated probability, rather than trying to re-evaluate the situation locally. If the driver were to listen to the local intuition that continuing looks better, they would drift toward a policy of always continuing, which guarantees a payoff of zero in both cases. By adhering to the ex-ante optimal plan, the driver ensures the highest possible return over the long run. Thus, you do not need to patch your principle with extra clauses about when to listen to local intuitions. Instead, you should view the local intuition as a systematic error in reasoning caused by the forgetfulness condition. Your principle stands firm if you accept that what you should do now is determined by what you should have planned to do at the start, and that any feeling to the contrary is an illusion to be resisted.
