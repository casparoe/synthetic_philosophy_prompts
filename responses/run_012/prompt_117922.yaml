      *Let's draft.*

      *Drafting Set-up:*
      Arrange desks in nine pairs. Place a whiteboard at the front with a blank game tree. Give each pair a stack of ten sweets and a scorecard. You are the banker and the recorder; they are the players. Do not explain the game tree yet; only explain that they will make choices between 'Take' (end game, keep sweets) and 'Pass' (game continues, pot grows).

      *Drafting Stage 1:*
      Draw only the final node of a three-round centipede game on the board. It is Player 2's turn. If they Take, they get 3 sweets, Player 1 gets 1. If they Pass, both get 2. Ask them: "You are Player 2. You know the game ends here. What do you do?" Have every pair write down their choice and the reason. Collect the reasons. They will overwhelmingly say 'Take' because 3 > 2. Establish this as the baseline for rationality: maximizing own payoff at the terminal node. Do not let them play yet. This is purely theoretical commitment. Ask: "Does anyone think a rational player would Pass here?" If someone says yes, ask why. If they say 'kindness', reframe the payoff: "The sweets *are* the utility. If you Pass, you are literally choosing less utility." Force the commitment: Rationality at the last node means Take. Write "BI Step 1: Player 2 Takes" on the board. This locks them into the logic before they see the contradiction.

      *Drafting Stage 2:*
      Extend the tree backwards one step. Now Player 1 moves before that final node. If Player 1 Takes, they get 2, Player 2 gets 0. If Player 1 Passes, we go to the node we just analyzed. Ask: "You are Player 1. You know Player 2 is rational. You know they will Take at the next node. What do you do?" They must reason: "If I Pass, Player 2 Takes, I get 1. If I Take now, I get 2." So Player 1 must Take. Extend this to the start of the game (5 rounds total). Have them write down a "Rational Plan" based on this backward induction. Then, have them play the game for real against their partner. Record the actual move where the game ends. Almost certainly, they will Pass at least once. Highlight the discrepancy immediately: "You wrote Take at Round 1. You Passed at Round 1. Which one was wrong?" This creates the cognitive dissonance internally.

      *Drafting Stage 3:*
      (Optional) Remove the fixed end. After every Pass, roll a die. If 6, the game ends forcibly (0 for both). If 1-5, it continues. Ask them to re-evaluate the Rational Plan. Does backward induction still work? Technically yes, if the continuation probability is high enough, but the "last node" is now fuzzy. They cannot point to a specific round to start the induction. This tests whether their previous reasoning relied on the *existence* of a last node or the *logic* of anticipation. If they still Pass, ask if the uncertainty changed their rationality or just their hope. This mirrors real-world interactions where endpoints are unknown.

      *Drafting Stage 4:*
      (Optional, cut this if time runs short) Before playing, have each student write a binding rule: "I will Pass until Round X, then Take." They swap rules. Now play. This introduces commitment. If I know you committed to Pass until Round 4, should I Take at Round 1? This shifts the problem from backward induction to credibility. Is the rule binding? If not, it's cheap talk. If yes, it changes the game tree. This distinguishes between intra-game rationality and pre-game strategy. It shows why people *want* to be irrational (to commit), but cannot simply say they will be.

      *Drafting Debrief:*
      Gather the class. Look at the board: the "Rational Plan" column vs. the "Actual Play" column. They will diverge. Start with the escape routes. To save backward induction, you must drop an assumption. Option 1: Drop Rationality. Maybe people aren't utility maximizers. Cost: Theory loses predictive power. Option 2: Drop Common Knowledge. Maybe you are rational, but you don't know *I* am. If I think you might Pass, I should Pass. This is the most popular fix. Cost: It requires modeling beliefs about beliefs, which gets messy fast. Option 3: Drop Payoff Structure. Maybe 'kindness' or 'fairness' is in the utility function. If passing gives me psychic utility, then Taking isn't actually maximizing. Cost: Makes utility unfalsifiable (anything can be rationalized).
      Which is least bad? Usually Option 2. It preserves rationality but acknowledges limited information.
      Now, the Surprise Quiz. A teacher says "Quiz next week, you won't know the day." Students reason: "Can't be Friday (I'd know Thursday night). Can't be Thursday..." This looks like backward induction. But it's different. In Centipede, the logic is strategic (I move based on your move). In Surprise Quiz, the logic is epistemic (I know based on what you said). The Quiz paradox collapses because the announcement itself becomes false if the reasoning holds. Centipede doesn't collapse; the equilibrium exists, it's just Pareto inefficient. Don't let them conflate self-referential paradoxes with strategic equilibrium.
      Hang this on their specific actions. When you wrote "Take" but played "Pass," you weren't confused. You were acting on a belief that your partner wasn't fully rational. You exploited their irrationality. That is rational behavior in a world of non-maximizers. The theory isn't wrong; the "Common Knowledge" assumption is the lie. You knew you were rational, but you hoped they weren't. That hope is where the philosophy lives.

      *Drafting What will go wrong:*
      1. Tree Confusion: They won't understand the diagram immediately. Fix: Use physical sweets to represent the pot growing on the desk, not just the board.
      2. Collusion: They might agree to always Pass to beat the game. Fix: Remind them the goal is to test the theory, not beat the banker. Or separate them slightly.
      3. Apathy: They won't feel the tension without real money. Fix: Make the scoreboard public. Shame/ pride can substitute for cash.

      *Drafting What can't show:*
      It can't reproduce Common Knowledge of Rationality (CKR). In class, they know each other. They know John is nice. They know Sarah is competitive. Real CKR requires anonymous agents who know only that they are rational. Also, stakes are low. With real money, the "Take" impulse strengthens. You must tell them: "In the real model, you don't know who you are playing. Here, you know too much."

