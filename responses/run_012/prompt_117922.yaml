      *   *Stage 1:* Need to ensure they *commit* to the logic. "If you are here, what do you do?"
      *   *Stage 2:* The tension needs to be built. "Write down what rationality demands." Then play.
      *   *Stage 3:* Clarify the probabilistic element.
      *   *Stage 4:* Distinguish commitment from cheap talk.
      *   *Debrief:* Needs to be dense but clear. Map the "escape routes" (Rationality, Knowledge, Payoffs). Address the Surprise Quiz explicitly.
      *   *Honesty:* Be pragmatic.

