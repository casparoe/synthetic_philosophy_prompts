answer: |-
  Set-up
  Arrange desks in nine pairs. Place a whiteboard at the front with a blank game tree. Give each pair a stack of ten sweets and a scorecard. You are the banker and the recorder; they are the players. Do not explain the game tree yet; only explain that they will make choices between 'Take' (end game, keep sweets) and 'Pass' (game continues, pot grows).

  Stage 1: last move first
  Draw only the final node of a three-round centipede game on the board. It is Player 2's turn. If they Take, they get 3 sweets, Player 1 gets 1. If they Pass, both get 2. Ask them: "You are Player 2. You know the game ends here. What do you do?" Have every pair write down their choice and the reason on a slip of paper. Collect the reasons. They will overwhelmingly say 'Take' because 3 > 2. Establish this as the baseline for rationality: maximizing own payoff at the terminal node. Do not let them play yet. This is purely theoretical commitment. Ask: "Does anyone think a rational player would Pass here?" If someone says yes, ask why. If they say 'kindness', reframe the payoff: "The sweets *are* the utility. If you Pass, you are literally choosing less utility." Force the commitment: Rationality at the last node means Take. Write "BI Step 1: Player 2 Takes" on the board. This locks them into the logic before they see the contradiction. Ensure every student signs off on this logic. You are building a trap. If they agree Player 2 Takes here, they have accepted the first premise of backward induction. Do not move forward until every pair has written "Take" for this node. The goal is not to play yet; it is to secure their logical consent. When they later Pass in the full game, they cannot claim the logic was unclear. They agreed to the premise.

  Stage 2: build the chain
  Extend the tree backwards one step on the board. Now Player 1 moves before that final node. If Player 1 Takes, they get 2 sweets, Player 2 gets 0. If Player 1 Passes, we go to the node we just analyzed. Ask: "You are Player 1. You know Player 2 is rational. You know they will Take at the next node. What do you do?" They must reason: "If I Pass, Player 2 Takes, I get 1. If I Take now, I get 2." So Player 1 must Take. Extend this recursively to the start of the game (5 rounds total). The pot grows each round, but the logic holds: take early. Have them write down a "Rational Plan" on their scorecard based on this backward induction. They must sign it. Then, have them play the game for real against their partner using the sweets. You walk around and record the actual move where the game ends for each pair. Almost certainly, they will Pass at least once, often several times. Highlight the discrepancy immediately on the board: "You wrote Take at Round 1. You Passed at Round 1. Which one was wrong?" Do not answer for them. Let the silence sit. This creates the cognitive dissonance internally. They have committed to the theory and then violated it with their own hands. The contradiction is now theirs. Ask them to keep their "Rational Plan" slip visible next to their sweets. The physical evidence of the contradiction must remain on the desk during the debrief.

  Stage 3: no last move
  (Optional) Remove the fixed end. After every Pass, roll a die. If 6, the game ends forcibly (0 for both). If 1-5, it continues. Ask them to re-evaluate the Rational Plan. Does backward induction still work? Technically yes, if the continuation probability is high enough, but the "last node" is now fuzzy. They cannot point to a specific round to start the induction. This tests whether their previous reasoning relied on the *existence* of a last node or the *logic* of anticipation. If they still Pass, ask if the uncertainty changed their rationality or just their hope. This mirrors real-world interactions where endpoints are unknown. Note that if the probability of continuation is high, the BI solution remains "Take Immediately," but the intuition weakens. Students often feel this version is 'fairer' to cooperation. Use this to probe whether their previous adherence to BI was logical or just artifact of the finite horizon. If time is tight, cut this stage, but it clarifies whether the paradox relies on a known end-point.

  Stage 4: rules against rules
  (Optional, cut this if time runs short) Before playing, have each student write a binding rule: "I will Pass until Round X, then Take." They swap rules. Now play. This introduces commitment. If I know you committed to Pass until Round 4, should I Take at Round 1? This shifts the problem from backward induction to credibility. Is the rule binding? If not, it's cheap talk. If yes, it changes the game tree. This distinguishes between intra-game rationality and pre-game strategy. It shows why people *want* to be irrational (to commit), but cannot simply say they will be. If you cut one optional stage, cut this one. Stage 3 tests the structure of the game; Stage 4 tests meta-strategy. Stage 3 is more fundamental to the Centipede paradox itself. Stage 4 is useful for discussing commitment devices, but less critical for the core BI contradiction.

  The debrief
  Gather the class. Look at the board: the "Rational Plan" column vs. the "Actual Play" column. They will diverge. Start with the escape routes. To save backward induction, you must drop an assumption. Option 1: Drop Rationality. Maybe people aren't utility maximizers. Cost: Theory loses predictive power. Option 2: Drop Common Knowledge. Maybe you are rational, but you don't know *I* am. If I think you might Pass, I should Pass. This is the most popular fix. Cost: It requires modeling beliefs about beliefs, which gets messy fast. Option 3: Drop Payoff Structure. Maybe 'kindness' or 'fairness' is in the utility function. If passing gives me psychic utility, then Taking isn't actually maximizing. Cost: Makes utility unfalsifiable (anything can be rationalized).

  Which is least bad? Usually Option 2. It preserves rationality but acknowledges limited information. Now, the Surprise Quiz. A teacher says "Quiz next week, you won't know the day." Students reason: "Can't be Friday (I'd know Thursday night). Can't be Thursday..." This looks like backward induction. But it's different. In Centipede, the logic is strategic (I move based on your move). In Surprise Quiz, the logic is epistemic (I know based on what you said). The Quiz paradox collapses because the announcement itself becomes false if the reasoning holds. Centipede doesn't collapse; the equilibrium exists, it's just Pareto inefficient. Don't let them conflate self-referential paradoxes with strategic equilibrium.

  Hang this on their specific actions. When you wrote "Take" in Stage 1 but played "Pass" in Stage 2, you weren't confused. You were acting on a belief that your partner wasn't fully rational. You exploited their irrationality. That is rational behavior in a world of non-maximizers. The theory isn't wrong; the "Common Knowledge" assumption is the lie. You knew you were rational, but you hoped they weren't. That hope is where the philosophy lives. Connect Stage 1 to Option 1. In Stage 1, you all agreed Rationality = Take. If you now say Pass is rational, you are changing the definition of rationality mid-stream. Connect Stage 2 to Option 2. You Passed because you didn't believe your partner would follow Stage 1 logic. You broke Common Knowledge, not Rationality. Connect Stage 3 to Option 3. If the die roll made you Pass more, did your utility change, or just the risk? Finally, address the "least bad" assumption. Dropping Common Knowledge is standard in behavioral game theory. It allows us to keep the math but add psychology. Dropping Rationality makes the theory useless. Dropping Payoffs makes it tautological. So, keep Rationality, keep Payoffs, drop Common Knowledge. You are rational agents playing against agents you suspect are not fully rational. That is the real world. The Centipede game doesn't show rationality fails; it shows Common Knowledge of Rationality is false.

  What will go wrong the first time
  First, tree confusion. Students new to extensive form will stare at the board blankly. Do not lecture the tree. Instead, place the sweets physically on the desk in two piles that grow as you describe the rounds. Physical manipulation beats diagrammatic abstraction for novices. Second, collusion. Pairs may agree to always Pass to maximize joint sweets, undermining the test. Interrupt this immediately. Remind them the goal is to test the theory of individual rationality, not to cooperate against the banker. If necessary, assign partners randomly to reduce prior alliances. Third, apathy. Without real money, 'Take' feels meaningless. Compensate with public shame. Project the scores anonymously but visibly. If a pair Takes at Round 1, highlight it. If they Pass until the end, highlight that. Make the outcome socially salient. Pride and embarrassment substitute for financial stakes in a classroom setting.

  What the activity can't show
  This activity cannot reproduce Common Knowledge of Rationality (CKR). In this room, students know each other. They know John is nice; they know Sarah is competitive. Real CKR requires anonymous agents who know only that they are rational. Here, they have prior beliefs about specific partners that override the theoretical assumption. Also, stakes are low. With significant real money, the "Take" impulse usually strengthens, pushing behavior closer to the BI prediction. You must tell them explicitly: "In the real model, you don't know who you are playing. Here, you know too much." The activity simulates the structure, but not the epistemic isolation required for the paradox to hold strictly.
