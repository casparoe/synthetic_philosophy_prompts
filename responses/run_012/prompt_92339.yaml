  ### Added Problems

  **A. The Semantics of Implication (New)**
  *   **Placement:** Integrate into Item 1.
  *   **Reason:** Curry is fundamentally a problem about the conditional (contraction/Modus Ponens). You cannot solve Item 1 without taking a definite stance on implication. This should be the primary technical workstream for you and your collaborator.
  *   **Goal:** Develop a conditional that blocks Curry but supports Recapture.

  **B. Metatheoretic Circularity (New)**
  *   **Placement:** Refine Item 4.
  *   **Reason:** "Non-triviality" is the goal; "Circularity" is the specific objection. Frame the work as addressing the circularity charge specifically, rather than general non-triviality proofs which are standard.
  *   **Goal:** Argue that the use of classical metatheory is *instrumental*, not *ontological*.

  ---

  ### Strategic Interdependencies

  *   **1 & 2 are the Pincers:** You must solve Curry (1) *in a way that allows* Recapture (2). Many solutions to Curry (e.g., dropping Modus Ponens) kill Recapture. Your agenda must treat these as a single constrained optimization problem. **Do not solve 1 in isolation.**
  *   **3 depends on 1:** If your solution to Curry involves a non-standard conditional, your exclusion negation must interact correctly with that conditional.
  *   **4 Frames 1 & 2:** You should publish the technical results (1 & 2) first, then the metatheoretic justification (4). SCLs respect theorems more than meta-justifications.
  *   **5 is a subset of 2:** Treat "Spread" as a technical lemma within the Recapture project.

  ### Tractability for Phil + Proof Theorist

  *   **Items 1, 2, 5:** Highly Tractable. This is the core strength of your team. The proof theorist handles the sequent calculi/model theory; you handle the interpretation and philosophical constraints.
  *   **Items 3, 4, 7:** Moderately Tractable. These require deep conceptual work. The proof theorist can check formal coherence, but the heavy lifting is yours.
  *   **Item 6 (Dropped):** Low Tractability for *progress*. It invites debate, not solution.

  ### Success Metrics (Next 2 Years)

  *   **Year 1:** **Technical Viability.** A joint paper solving Curry for a specific system (Item 1 + New A) that retains enough strength for basic arithmetic.
  *   **Year 2:** **Mathematical Utility.** A paper demonstrating Recapture (Item 2) for that system, showing classical theorems hold in consistent domains.
  *   **Year 3:** **Philosophical Coherence.** A paper addressing Exclusion (Item 3) and Metatheory (Item 4), arguing that the system supports Dialetheism without ineffability or vicious circularity.

  ### Confidence and Uncertainty

  *   **Highest Confidence:** That Items 1 and 2 are the correct priorities. Without them, the project is dead.
  *   **Lowest Confidence:** In Item 3 (Exclusion). This is the "hard problem" of dialetheism. It may turn out that no formal operator satisfies the constraints without re-introducing explosion.
  *   **Evidence to Change Ranking:** If, after 12 months, the Curry solution (Item 1) proves too weak to support Recapture (Item 2), you must pivot. In that case, **Recapture becomes #1** as a constraint on Curry solutions, forcing you to seek a different family of logics (e.g., moving from LP to a relevant logic).
  *   **Purpose Correction:** You stated your aim is work an SCL would count as progress. If you find that SCLs remain unmoved by technical recapture (believing classical logic is *a priori* true), you may need to shift weight to **Item 8 (Applied Reasoning)** earlier. Showing that paraconsistent logic solves real-world problems (legal/AI) that classical logic handles clumsily is a pragmatic argument SCLs cannot ignore. If the theoretical battle stalls, fight on pragmatic grounds.

  ### Final Instruction

  Focus 60% of your joint time on **Curry + Recapture (1 & 2)**. This is the only way to build a system robust enough to carry the metaphysical weight of Dialetheism. Treat Exclusion (3) and Metatheory (4) as the philosophical commentary on that technical core. Drop Pluralism (6); it is a luxury you cannot afford in a three-year fellowship aimed at convincing skeptics.
