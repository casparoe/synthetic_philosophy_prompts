  ### Criteria for Ranking

  To rank these problems for a three-year postdoc aiming to convince a **Skeptical Classical Logician (SCL)**, I am using four criteria:

  1.  **Lethality:** If unsolved, does the problem render the project trivial, incoherent, or useless? (Existential threats rank highest.)
  2.  **SCL Resistance:** How formidable is the objection from the target audience? (Problems that address the SCL's strongest objections rank higher.)
  3.  **Synergy:** Does solving this problem make progress on others easier? (Foundational problems rank higher.)
  4.  **Team Fit:** Is the problem tractable for a Philosopher + Proof Theorist team? (Technical-conceptual hybrids rank higher than pure metaphysics or pure sociology of logic.)

  ### The Agenda: Ranked Order

  1.  **The Curry-Style Paradox (Item 1)**
  2.  **The Recapture Problem (Item 2)**
  3.  **The Problem of Exclusion Negation (Item 3)**
  4.  **Non-triviality and its Metatheory (Item 4)**
  5.  **The Spread of Contradictions (Item 5)**
  6.  **Applied Reasoning (Item 8)**
  7.  **The Doxastic and Normative Question (Item 7)**
  8.  **[DROPPED] The Tension between Dialetheism and Pluralism (Item 6)**

  **Added Problems:**
  *   **A. The Semantics of Implication:** (Subsumed under Item 1). The specific technical locus of the Curry problem.
  *   **B. Metatheoretic Circularity:** (Refinement of Item 4). Specifically addressing the charge that using classical metatheory concedes the game.

  ---

  ### Defense of the Ranking

  #### 1. The Curry-Style Paradox (Item 1)
  **Rank:** #1 (The Existential Threat)
  **Why:** This is the gatekeeper. Unlike the Liar, Curry does not rely on negation. If your conditional is too strong, Curry trivializes the system; if it is too weak, you lose Modus Ponens and mathematical utility. An SCL's first move is always: "Your system is trivial." You cannot address Recapture or Exclusion if the system explodes via Curry.
  **Dependency:** Solving this is a prerequisite for Item 2 (Recapture). You cannot recapture classical math in a trivial system.
  **Team Fit:** High. This requires proof-theoretic modeling (your collaborator) to test contraction/implication rules, and philosophical analysis (you) to justify the restriction on the conditional without ad-hocery.
  **2-Year Metric:** A proof that a specific paraconsistent system blocks Curry while retaining a non-contractive or restricted conditional that still supports a significant fragment of arithmetic.
  **Confidence:** High. This is the standard technical hurdle.

  #### 2. The Recapture Problem (Item 2)
  **Rank:** #2 (The Utility Threat)
  **Why:** Once you survive Curry, the SCL's second move is: "So what? You can't do calculus." If paraconsistent logic cannot recover classical theorems in consistent domains, it is a toy. Progress here is the most persuasive evidence for an SCL that paraconsistency is a *competitor*, not just a curiosity.
  **Dependency:** Depends on Item 1. If Curry is solved by gutting the conditional, Recapture fails. Thus, Item 1 and 2 must be solved in tandem, but 1 is the logical prior.
  **Team Fit:** Very High. This is the sweet spot for a Phil/Proof-Theorist pair. It requires defining "classical recapture" formally (proof theory) and arguing for its sufficiency (philosophy).
  **2-Year Metric:** A "Recapture Theorem" showing that for any classically consistent set of premises in a defined domain (e.g., finite arithmetic), the paraconsistent consequence relation yields exactly the classical consequences.
  **Confidence:** High. This is where the field is currently most active (e.g., work by Weber, Badia).

  #### 3. The Problem of Exclusion Negation (Item 3)
  **Rank:** #3 (The Coherence Threat)
  **Why:** This is specific to *Dialetheism*. If you accept true contradictions, how do you express that a claim is *merely* false? If you cannot express exclusion ("A is false and not true"), you cannot state the dialetheic thesis without self-refutation (the "Just False" problem). An SCL will argue your view is ineffable.
  **Dependency:** Independent of 1 and 2 technically, but conceptually dependent on having a working logic. If the logic is trivial (Item 1 failed), Exclusion is moot.
  **Team Fit:** Moderate. Mostly philosophical/semantic, but requires proof-theoretic support to show the exclusion operator doesn't re-introduce explosion.
  **2-Year Metric:** A formal semantics for an exclusion operator that is expressively complete but does not restore explosion or Curry.
  **Confidence:** Moderate. This is notoriously difficult (Priest's "characterization problem").

  #### 4. Non-triviality and its Metatheory (Item 4)
  **Rank:** #4 (The Legitimacy Threat)
  **Why:** This is the "Classical Metatheory" objection. If you use classical logic to prove your paraconsistent logic is non-trivial, the SCL claims you've conceded classical logic is the "true" logic. However, this is often a meta-philosophical stalemate. It is less "solvable" in 3 years than 1 or 2. It frames the work, but technical progress on 1 and 2 is more tangible "progress."
  **Dependency:** Frames 1 and 2.
  **Team Fit:** High for you (Phil), lower for the collaborator.
  **2-Year Metric:** A clear articulation of why using classical metatheory is pragmatically necessary but not ontologically committing, or a constructive proof of non-triviality using weaker means.
  **Confidence:** Low. This is a deep foundational dispute that may not be "solved" but only managed.

  #### 5. The Spread of Contradictions (Item 5)
  **Rank:** #5 (The Contagion Threat)
  **Why:** This is a refinement of Recapture. Even if you don't explode, does a contradiction in number theory infect all of number theory? This is technical damage control.
  **Dependency:** Depends on 1 and 2.
  **Team Fit:** High (Technical).
  **2-Year Metric:** Proof of "localization" properties for contradictions in the chosen system.

  #### 6. Applied Reasoning (Item 8)
  **Rank:** #6 (The Evidence)
  **Why:** Applications are evidence for Recapture. They are secondary to the theoretical viability.
  **Dependency:** Depends on 2.
  **Team Fit:** Moderate.
  **2-Year Metric:** One detailed case study (e.g., a specific legal paradox or database inconsistency) modeled in your system.

  #### 7. The Doxastic and Normative Question (Item 7)
  **Rank:** #7 (The Consequence)
  **Why:** Norms of belief follow from the logic and metaphysics. If the logic doesn't work, norms are irrelevant.
  **Dependency:** Depends on 1, 2, and 3.
  **Team Fit:** High for you (Phil).
  **2-Year Metric:** A paper on "Rational Acceptance of Contradictions" grounded in the results of 1-3.

  #### 8. [DROPPED] Dialetheism vs. Pluralism (Item 6)
  **Rank:** Dropped.
  **Why:** This is meta-meta-theory. For a 3-year postdoc aiming at *progress* for an SCL, debating whether logic is plural is a distraction. An SCL is typically a monist. Engaging in pluralism debates allows them to dismiss you as "changing the subject." Focus on showing *your* logic works better, not on the taxonomy of logics.
  **Reason for Drop:** Low leverage on the SCL. High abstraction. Low technical yield for a Proof Theorist collaborator.

