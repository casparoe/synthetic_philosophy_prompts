answer: |-
  1. Williams argues that utilitarianism alienates agents from their ground projects and introduces "one thought too many," yet this charge seems weakened when an agent's core identity is itself constituted by impartial beneficence.
  2. Under the audit model, where agents must consciously validate actions through impartial justification, even the beneficent agent suffers alienation because her immediate motives are subjected to external scrutiny.
  3. The background-conditions model avoids this by allowing impartiality to serve as a silent constraint on commitments rather than an occurrent reason, permitting the agent to act directly from her charitable identity.
  4. If the background conditions are internalized such that the constraint does not feel external, the structural divide collapses and the integrity objection loses its force.
  5. Ultimately, Williams successfully refutes the audit model of utilitarian deliberation but fails to dismantle utilitarianism as such, provided the theory adopts a background-conditions framework that respects psychological integrity.
