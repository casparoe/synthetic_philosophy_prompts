          *   *Verdict:* It is two distinct questions masquerading as one definition. One is about *agency and reasons* (Philosophy of Action). The other is about *systemic stability and function* (Philosophy of Biology/Social Science).

      *   *Point 2: The Role of Common Knowledge.*
