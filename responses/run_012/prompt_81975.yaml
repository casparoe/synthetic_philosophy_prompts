answer: |-
  This is a remarkably sharp diagnosis of a fracture that has indeed run through the philosophy of social science for half a century. You have correctly identified the fault line: it lies between the **intentional stance** (agents reasoning about agents) and the **design/physical stance** (systems settling into stable states).

  Given your background in ecology, you are uniquely positioned to see that the "evolutionary" side is not merely a metaphor but a description of the same dynamical systems you studied in populations. Here is a diagnosis of the situation, addressing your specific questions.

  ### 1. One Question at Two Levels, or Two Questions?

  Your hypothesis is that the split is between **status** (why we ought to follow it) and **genesis** (how it arises). This is partially correct, but the deeper division is about **intentionality**.

  *   **The Lewisian (Rationalist) View:** Treats convention as a solution to a *problem of reasoning*. It is a question of **agency**. For a regularity to be a convention, it must be represented as such by the agents. The "ought" comes from the mutual recognition of interdependence.
  *   **The Evolutionary (Dynamic) View:** Treats convention as a solution to a *problem of stability*. It is a question of **system dynamics**. The "ought" (if it exists) is external, imposed by the fitness landscape or social sanction, not internalized as a reason.

  **Diagnosis:** These are **two distinct questions** that happen to converge on the same phenomena in adult human societies.
  1.  **The Normative Question:** What makes a regularity binding on a rational agent? (Requires common knowledge/expectations).
  2.  **The Stability Question:** How does a population settle on an arbitrary equilibrium? (Requires dynamics/selection).

  The quarrel is not wholly verbal because the answers are mutually exclusive at the boundaries. If you insist common knowledge is constitutive (Lewis), then bird dialects and perhaps even human language acquisition are *not* conventions. If you insist stability is sufficient (Skyrms/Young), then a reflex or a coerced regularity might count as a convention, which dilutes the normative force the concept was meant to capture.

  It is best understood not as two levels of idealization of the *same* thing, but as **two different concepts** that overlap in the "human adult rational" zone but diverge in the "animal/child" zone and the "hyper-rational" zone.

  ### 2. Is Common Knowledge Constitutive or Typical?

  This is the crux of the disagreement.

  *   **For the Lewisian:** Common knowledge is **constitutive**. Without the loop of "I know that you know that I know," there is no coordination, only coincidence. If I drive on the left merely because I was conditioned to, and not because I expect you to, I am not following a convention; I am following a habit.
  *   **For the Evolutionary Theorist:** Common knowledge is **impossible** (computationally) and therefore cannot be constitutive. It is, at best, a **typical idealization** or an emergent approximation (often modeled as "common p-belief," where probability approaches 1).

  **Diagnosis:** The real issue is whether convention is a **psychological state** or a **social fact**.
  If convention is a psychological state (a specific structure of belief), common knowledge is constitutive. If convention is a social fact (a stable pattern of interaction regardless of internal state), common knowledge is merely typical.

  Your ecological puzzle (animals) suggests common knowledge is not constitutive of the *phenomenon of stability*, but it may be constitutive of the *phenomenon of obligation*. Animals have stable regularities (territorial boundaries, mating dances) that function like conventions, but they lack the "ought." They have the *dynamic* without the *normativity*. This suggests the Lewisian definition is actually a definition of *Moral/Social Obligation via Agreement*, while the Evolutionary definition is *Behavioral Equilibrium*.

  ### 3. What Would Count as Progress?

  The two literatures have been passing each other by because they serve different philosophical masters (Ethics/Action Theory vs. Metaphysics/Philosophy of Biology). Progress requires bridging models. Here are three specific avenues:

  **A. A Formal Result: Learning Dynamics as Rational Reconstruction**
  Progress has already begun here (e.g., H. Peyton Young, Brian Skyrms). The goal is to show that **evolutionary dynamics converge on Lewisian conditions over time.**
  *   *The Result:* If you model agents who are boundedly rational and use simple reinforcement learning, they will eventually behave *as if* they have common knowledge, even if they don't.
  *   *Why it helps:* It shows the Lewisian view is the **limit case** of the Evolutionary view. This validates the ecologist's intuition: the rationalist model is a "steady state" description of a dynamic process.

  **B. A Distinction: "Normative" vs. "Functional" Conventions**
  Philosophy needs a taxonomy similar to biology's distinction between *proximate* and *ultimate* causes.
  *   **Normative Conventions:** Require common knowledge and generate reasons for action (e.g., Promise keeping, Money).
  *   **Functional Conventions (or Proto-Conventions):** Rely on selection/imitation, generate stability but not necessarily reasons (e.g., Bird song dialects, Pedestrian flow).
  *   *Why it helps:* It stops the "No True Scotsman" fighting. It allows you to say animal regularities are *functional conventions* without forcing them into the straitjacket of rational expectation. (Note: The philosopher Ruth Millikan did exactly this in *Language, Thought, and Other Biological Categories*, arguing for "conventions" based on proper function rather than intent. Given your background, her work is essential reading).

  **C. A Case: The Emergence of Language**
  Language is the testing ground.
  *   **Lewisian:** Language is a convention because we agree on meanings to coordinate.
  *   **Evolutionary:** Language is a convention because communicative systems that stabilize outcompete those that don't.
  *   *Progress:* A case study showing how a specific linguistic shift moved from *functional* (children learning via reinforcement) to *normative* (adults correcting others based on rules). This tracks the transition from ecological stability to social obligation.

  ### Summary Diagnosis

  You are right that the quarrel is partly verbal, but it rests on a substantive disagreement about **what kind of thing a society is.**
  *   Is it a **collection of minds** coordinating? (Lewis)
  *   Is it a **system of behaviors** stabilizing? (Evolutionary)

  The "real issue" is indeed common knowledge, but specifically whether it is the **engine** of convention or the **exhaust** of it.
  *   **Lewis:** Common knowledge is the engine.
  *   **Ecology/EGT:** Common knowledge is the exhaust (a byproduct of stability).

  **Recommendation for Progress:**
  Do not expect the two literatures to merge into one theory. Instead, look for **mapping functions**. The most productive work will show the conditions under which a dynamic regularity *acquires* normative force (when does a habit become a rule?). That is the ecological succession of social life: from stability to obligation.

  As a retired ecologist, you might find the work of **Ruth Millikan** (bio-semantics) and **Brian Skyrms** (evolutionary game theory) the most congenial. They respect the biological constraints you know well while addressing the philosophical questions of meaning and normativity. The progress you seek lies in treating "convention" not as a natural kind with a single essence, but as a **cluster concept** where rationality and dynamics are overlapping but distinct members.
