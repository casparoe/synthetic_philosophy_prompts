      *   *Side B:* Evolutionary Game Theory (EGT), Brian Skyrms (*Evolution of the Social Contract*), H. Peyton Young. Key features: Dynamics, basin of attraction, stability without hyper-rationality.
      *   *The Tension:* Lewis requires *knowledge* and *reason*. EGT requires *stability* and *history*.
      *   *The Ecological Analogy:* Animal behavior (e.g., flocking, territorial boundaries) fits Side B perfectly but fails Side A's cognitive requirements.

