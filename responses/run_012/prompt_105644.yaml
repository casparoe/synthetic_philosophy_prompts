prompt: |-
  I've spent my whole working life in physics — thirty-odd years on instrumentation and noise, so I'm at home with signal-to-noise ratios, averaging over repeat runs, error bars, redundancy in a detector array, calibration, that whole idiom. I'm retired now and trying to teach myself philosophy of mind, and the thing I keep circling back to is what von Neumann is supposed to have said about the brain: that it's a computer of some kind, but not the kind he was building, that it somehow stays reliable out of parts that are anything but, and that whatever the brain's language is, it isn't the language of logic. I've only got this second-hand from popular books and I don't trust my memory of it, so treat me as a beginner on the philosophy side but fluent on the physics side. Where you're unsure what he actually held, say so rather than filling it in.

  Here's what I'd like. Take von Neumann's views on the brain and restate them, as faithfully as you can, in the vocabulary I actually think in — channels and noise floors, bandwidth, redundancy and error correction, integration time, detector thresholds, calibration, and the gap between what one measurement tells you and what an ensemble tells you. Don't just tell me it's "like" signal processing. Actually do the translation, claim by claim, and keep it honest: don't quietly smuggle in the engineer's assumptions and then call that a translation.

  Then the part I care about most — the residue report. Which of his claims come through cleanly, which ones only survive if I distort them, and which have no counterpart at all in my vocabulary? I'm thinking of anything he wanted to say about what the brain's language is, about memory, about whether it's a Turing machine at all, or about what role mathematics plays in how it works. For each bit of residue, tell me whether it's my framework that's missing something or whether it's a sign his claim was vaguer than it looks. If some of it turns out to be a claim physics can't even state, I'd rather know that than have it smoothed over. And give it to me in British English, spelling and phrasing — I've had to get used to behaviour and colour again since moving back.
