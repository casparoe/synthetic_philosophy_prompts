      *   *Scenario A: Unreliable Probability Estimates (High Epistemic Uncertainty).*
          *   ITN fails here because multiplying uncertain numbers leads to massive error bars (the "optimizer's curse").
          *   Regret shines here. It is designed for ambiguity. It asks, "If I'm wrong, how bad is it?"
