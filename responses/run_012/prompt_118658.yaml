      *   **Conflict:** Philosophy major roommate claims the wasp is a machine and humans are just "more loops." User notices their own "loops" (fridge, "what?"). User suspects "I can notice my loops" is a weak defense.
      *   **Task:** Write a three-page response paper outline/content (though the prompt asks for "competing positions with their weak spots," not necessarily the paper itself, but rather the *substance* for it).
      *   **Requirements:**
          *   Lay out real options/competing positions.
          *   Address what makes the wasp a "machine" (behavior vs. mechanism vs. could-have-done-otherwise).
          *   Address the wasp's flexibility (if true).
          *   Address the human "fridge loop" and the "noticing the loop" argument.
          *   Determine if "noticing" marks a difference in kind or just pushes the problem up a level.
