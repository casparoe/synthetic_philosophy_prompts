answer: |-
  # DECISION TREE: THE SPECIAL COMPOSITION QUESTION

  **START:** Consider a **living cat**. Do its parts compose a further thing (the cat)?
  │
  ├── **NO.** → **NIHILISM**. (Nothing ever composes anything; there are only simples).
  │
  └── **YES.** → Consider the **top half of a shoe and a distant tower**. Do *they* compose a thing?
      │
      ├── **YES.** → **UNIVERSALISM**. (Any things compose a further thing).
      │   *(Note: Often paired with sharp boundaries to avoid ontic vagueness).*
      │
      └── **NO.** → (Restricted Composition). Consider a **pile of sand**. Is "being a pile" a mind-independent fact or how we carve the world?
          │
          ├── **MIND-DEPENDENT.** → **DEFLATIONARY / CONCEPTUALIST VIEW**. (Composition varies with conceptual scheme/language).
          │
          └── **MIND-INDEPENDENT.** → Consider a **borderline heap** (one grain less). Is it indeterminate whether it exists?
              │
              ├── **YES (INDETERMINATE).** → **VAGUENESS VIEW**. (Composition admits borderline cases/degrees).
              │
              └── **NO (SHARP).** → Is the rule the same for **organisms, artifacts, and heaps**?
                  │
                  ├── **NO (VARIES).** → **SERIAL / CASE-BY-CASE VIEW**. (e.g., Organicist about cats, Nihilist about statues).
                  │
                  └── **YES (UNIFORM).** → Is there a non-trivial condition explaining *why*, or is it brute?
                      │
                      ├── **BRUTE.** → **BRUTE FACT VIEW**. (Composition happens but has no deeper explanation).
                      │
                      └── **CONDITIONED.** → Is the condition primarily about physical proximity or functional unity?
                          │
                          ├── **PHYSICAL PROXIMITY (INTRINSIC).** → Consider **two bricks**. Must they merely touch or be fused?
                          │   ├── **Touch.** → **CONTACT VIEW**.
                          │   └── **Fused/Fastened.** → **FASTENING / COHESION VIEW**.
                          │
                          └── **FUNCTIONAL UNITY (RELATIONAL).** → Consider a **swarm of bees vs. a corpse**. Must they be alive?
                              ├── **Yes (Life).** → **ORGANICISM**. (Only living things compose wholes).
                              └── **No (Causal).** → **CAUSAL-UNITY VIEW**. (Parts caught in single causal process).

  ***

  ### DIAGNOSIS OF EMPTY OR UNOCCUPIED REGIONS

  1.  **Nihilism + Vagueness:** **Incoherent.** If nothing ever composes, there are no composite objects to be borderline cases of.
  2.  **Universalism + Restricted Condition:** **Contradictory.** Universalism denies conditions; Restricted views affirm them.
  3.  **Mind-Dependent + Brute Fact:** **Unattractive.** Deflationists typically explain composition via concepts; positing a brute fact undermines the conceptualist motivation.
  4.  **Contact + Organicism (as single uniform rule):** **Incoherent.** One requires spatial adjacency, the other biological life; a corpse touches but lacks life, a scattered organism lives but lacks contact.
  5.  **Serial + Universalism:** **Contradictory.** Serial views imply restriction in some cases; Universalism allows composition in all.
  6.  **Fastening + Causal-Unity (as distinct leaves):** **Overlap.** These come apart only on cases the tree does not probe (e.g., fused parts with no causal interaction vs. causal interaction without fusion). Standard views prioritize one paradigm.
