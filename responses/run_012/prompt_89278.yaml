      *   Better Patch: **Incommensurability of Value.** In Case 2, lives are commensurable (count them, weigh prognosis). In Case 3, Daughter != Stranger. In Case 1, Source's Life != Innocent's Freedom.
      *   Wait, Case 4: Promise != Kid's Health. User says "Kid wins." Is it a dilemma? If there's a clear winner, is it a dilemma? Bernard Williams would say yes, because of the *remainder*. The user feels "unclean." That uncleanliness is the dilemma. So I need to tell the user their gut on Case 4 is actually hiding a dilemma.

