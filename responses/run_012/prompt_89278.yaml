      *   *Case 4 (Shop/Promise vs. Kid's Health):* Gut = **Not a Dilemma** (mostly). Kid wins. But... "don't feel as clean." (Residue exists).
      *   *Editor's Objection:* Always a third path (cheapens the definition).
      *   *Friend's Objection:* Agglomeration principle (If Ought A + Ought B -> Ought (A+B), then if (A+B) is impossible, one Ought must be false, so no dilemma).

  3.  **Identify the Underlying Principle:**
      *   The user distinguishes between *impersonal* optimization (Case 2: maximize life years) and *relational/constitutive* obligations (Case 3: daughter; Case 1: source trust; Case 4: promise to mother).
      *   In Case 2, the doctor acts as an agent of the system/humanity. The loss is tragic, but the *choice* isn't morally ambiguous.
      *   In Case 3, the doctor acts as a *parent*. The obligation is partial, not impartial.
