answer: |-
  Here is the principle that is doing the work in your head, tightened up for print, followed by the audit of your cases.

  ### The Principle

  **A genuine moral dilemma exists when an agent faces two obligations that are *incommensurable* (they cannot be weighed on a common scale of value) and *constitutive* (they define the agent's relationship to the world), such that fulfilling one necessitates violating the other in a way that leaves a *moral remainder*—a residue of guilt, loss, or debt that cannot be rationalized away by a higher-order rule.**

  ### The Clauses & The Cases

  Here is how each part of that principle was derived from your specific gut calls, and where your current formula needs patching.

  **1. The Incommensurability Clause**
  *   **Source:** This comes from the split between your **ER/Strangers** case (Not a Dilemma) and your **ER/Daughter** case (Dilemma).
  *   **The Work:** In the Strangers case, you have a common currency: *life-years* or *triage protocol*. You can do the math. The horror is emotional, not moral. In the Daughter case, the currency breaks. A daughter is not "1.0 stranger." The obligation to kin is of a different *kind* than the obligation to the public. They cannot be weighed on the same scale.
  *   **The Patch:** Your formula ("unfixable and lands on a person") fails here because both ER cases are unfixable and land on a person. The missing variable is **comparability**. If you can count the cost, it's a calculation, not a dilemma.

  **2. The Constitutive Clause**
  *   **Source:** This comes from the **Reporter/Source** case (Dilemma) vs. your **Editor's** objection (Third Paths).
  *   **The Work:** Your editor argues that if a third path exists, it wasn't a dilemma. You agreed ("if there was a door she didn't see, it was never a dilemma"). But the deeper reason is that the obligations define *who the reporter is*. She is a guardian of truth (save the innocent) AND a guardian of trust (protect the source). If she sacrifices the source, she isn't just "losing a contact"; she is breaking the covenant that makes her a reporter. The dilemma exists because both options destroy a part of her moral identity.
  *   **The Patch:** Your formula needs to specify that the loss isn't just "expensive"; it must be **identity-corrosive**.

  **3. The Moral Remainder Clause**
  *   **Source:** This comes from the **Family Shop** case (Not a Dilemma... but "unclean").
  *   **The Work:** This is where your gut is lying to you. You called this "Not a Dilemma" because the kid's health *wins*. But you admitted you "don't feel as clean." That uncleanliness *is* the definition of a moral remainder. If it were truly not a dilemma (like the ER/Strangers case), you would feel sad but justified. The fact that you feel "unclean" proves the obligation to the mother wasn't erased; it was just violated.
  *   **The Patch:** Your formula says "unfixable." But in the Shop case, the kid *is* fixed. The dilemma isn't about the outcome (the kid lives); it's about the **debt**. You can fix the problem and still be in the wrong.

  ### The Audit: Which Gut Calls Get Dropped?

  If you run your cases through this principle, here is the verdict. You will have to change your mind on one.

  1.  **Reporter/Source:** **Verdict: DILEMMA.** (Stands). Incommensurable (Justice vs. Loyalty). Constitutive (Reporter identity). Remainder (Guilt either way).
  2.  **ER/Strangers:** **Verdict: NOT A DILEMMA.** (Stands). Commensurable (Life years). Protocol resolves the "Ought." No remainder if protocol is followed.
  3.  **ER/Daughter:** **Verdict: DILEMMA.** (Stands). Incommensurable (Kin vs. Citizen). No protocol can resolve this without violating human nature.
  4.  **Family Shop:** **Verdict: DILEMMA.** (**DROP YOUR GUT CALL**). You called this "Not a Dilemma." The principle says it *is*. Why? Because of the "unclean" feeling. The promise to the mother was a constitutive obligation. Breaking it saves the kid, but the debt remains. You cannot "apologize to a ghost" and make it vanish. The fact that one option is *better* (the kid lives) does not stop it from being a dilemma. A dilemma is not a tie; it's a loss either way.

  ### Addressing Your Editor and Friend

  **The Editor (The Third Path):**
  Your editor is playing a semantic game. If a third path exists *in reality*, you are right: it's not a dilemma, it's a puzzle. But for the purpose of your piece, the definition of a dilemma must include an **epistemic limit**. A dilemma is real if, *given what the agent knows and can reasonably do at the time*, no path preserves moral integrity. If you demand omniscience, you abolish tragedy. Don't let him cheapen it.

  **The Friend (The Logic/Agglomeration):**
  Your friend is citing the "Agglomeration Principle": *If I ought to do A, and I ought to do B, then I ought to do (A and B).* If (A and B) is impossible, logic says one of the "Oughts" must be false. Therefore, no dilemma.
  **The Counter:** This assumes morality is a consistent logical system. It isn't. It's a human system. The "Moral Remainder" clause proves your friend wrong. If the "Ought" disappeared because it was impossible, you wouldn't feel guilty after choosing. The fact that you *do* feel guilty proves the "Ought" persisted even when it couldn't be done. Morality can contradict itself. That is the tragedy.

  ### The Test Case

  Here is a case you haven't listed to test the principle against your intuition.

  **The Case:** A hostage negotiator promises a gunman safe passage out of the building if he releases the children. The gunman releases the children. As he walks out, the SWAT team leader asks the negotiator: "Do we take the shot? He's in range." If the negotiator says "Yes," the children are safe, but the negotiator's word is worthless forever (and future gunmen won't trust negotiators). If the negotiator says "No," the gunman escapes to potentially kill again, but the negotiator's integrity holds.

  **The Principle's Verdict:** **GENUINE DILEMMA.**
  *   **Incommensurable:** Public Safety (future lives) vs. Institutional Integrity (trust in the rule of law/word). You can't trade "one criminal's freedom" against "the concept of honor."
  *   **Constitutive:** The negotiator is an agent of the State (protect citizens) AND an agent of Truth (keep promises).
  *   **Remainder:** If he lets the gunman go, he lives with the risk of future blood. If he lets SWAT shoot, he lives with the knowledge he lied to save lives, corrupting the tool he needs for the next crisis.
  *   **Why it fits:** It forces you to choose between a concrete good (safety) and an abstract good (trust), leaving you unclean either way.

  ### Summary for the Piece

  If you want the tight line for the article, use this:

  > "A tough choice is when you weigh two costs and pick the lighter one. A moral dilemma is when the scale breaks. It is not a puzzle to be solved, but a wound to be survived. If you walk away clean, it wasn't a dilemma."

  Your gut on the **Shop Case** is the weak link. You're trying to rationalize the "right answer" (save the kid) to avoid the pain of the dilemma. But the pain *is* the point. Keep the unclean feeling. That's the story.
