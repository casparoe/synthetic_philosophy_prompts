      *   *Editor's Point:* Third paths. If a third path exists, it's not a dilemma. This is definitional. The principle must assume "all reasonable paths exhausted."
      *   *Friend's Point:* Agglomeration. This is the logical argument against dilemmas. The principle must assert that moral obligations don't always obey classical logic (moral residue proves the "Ought" persisted even when violated).

