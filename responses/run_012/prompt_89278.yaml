      *   In Case 4, the father acts as a *son* (promise) AND a *parent* (care). Gut says parent wins, but the "unclean" feeling suggests a *remainder* or *residue*.
      *   *Key Distinction:* Is the conflict between two *impersonal* goods (utilitarian calculus resolves it), or is it between two *incommensurable* obligations where fulfilling one violates a constitutive relationship that cannot be merely "compensated" for?
      *   *The "Unfixable" Clause:* The user says "unfixable." But in Case 4, the kid is fixed (surgery), yet it still feels "unclean." So "unfixable" isn't quite right. It's about *non-fungible* obligations.
      *   *The "Lands on a Person" Clause:* Case 2 lands on a person (patient dies). But it's not a dilemma. So it's not just "a person." It's about *who* the person is relative to the agent.
      *   *Refined Principle:* A genuine moral dilemma exists when the agent faces two obligations that are **non-fungible** (cannot be traded on a common scale like "life years") and **constitutive** (define who the agent is in relation to the other), such that fulfilling one necessarily entails a **moral remainder** (guilt/residue) that cannot be rationalized away by a higher-order rule.

  4.  **Drafting the Principle (Iterative Process):**
      *   *Attempt 1:* It's a dilemma when you have special duties to specific people that clash with general duties. (Too simple, misses Case 1 where both might be general/specific mix).
      *   *Attempt 2:* It's a dilemma when there is no common currency to measure the loss. (Better. Case 2 has currency: life years. Case 3 does not: daughter vs. stranger).
      *   *Attempt 3 (incorporating the "Residue"):* A genuine dilemma occurs when competing obligations are incommensurable, meaning no overarching rule can prioritize them without violating a core relational identity, leaving an unavoidable moral remainder.
      *   *Let's look at the "Friend's Objection" (Agglomeration):* The friend argues logic forbids dilemmas. If I ought to save A and ought to save B, but can't save both, then "Ought (A+B)" is false, so one of the Oughts must be false. Therefore, no dilemma.
      *   *Counter:* This assumes morality is consistent and complete. Moral dilemmas argue morality *isn't* consistent. The user's gut says morality *can* be contradictory. The principle needs to validate the *experience* of the remainder.
