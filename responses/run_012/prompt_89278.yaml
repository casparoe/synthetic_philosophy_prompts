      *   *Case 3 (ER/Daughter):* Incommensurable (Impartial Duty vs. Special Obligation). Remainder (Guilt over stranger or daughter). **Verdict: Dilemma.** (Matches Gut). *Note: This kills the "triage rule" as a universal solver.*
