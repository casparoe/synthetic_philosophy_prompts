prompt: |-
  I'm a philosopher of cognitive science stuck in an engineering department, and I've talked my way into a small pot of money -- one postdoc, two years -- that I get to spend on basically whatever I want as long as its conceptual work on von Neumann's picture of the brain. You know the one: the unfinished book that came out of his Silliman lectures, brain as computing machine, the analog/digital mess, the reliability problem. No wet lab, no new data, no hardware. Just a smart person, a whiteboard, and two years. It has to be defensible to the neuromorphic people down the hall, though, or they'll eat me alive at the seminar.

  So which open questions here actually matter? Assume I've read the book and dont need it summarized. The candidates I keep coming back to all feel either picked over or unfundable:

  - analog vs digital, the claim that the nervous system is a mix of both -- everyone agrees it's a real question, nobody seems to move on it
  - reliability from unreliable components -- he clearly cared, but my impression is that error-correcting codes and then overparameterized nets basically ate this one, and it's a footnote now
  - memory: how the brain stores anything at all, distributed vs addressed -- also feels like it's been farmed out to neuroscience proper and I'd just be redoing their work badly

  And then my own hunch, which I genuinely can't tell is deep or dumb: I think the thing he kept worrying at wasn't the components at all, it was the language -- that the nervous system's signals are statistical and aggregate rather than logical, so the unit of computation isn't the neuron or even the spike but some population-level thing, and that describing it would need a mathematics nobody had yet. Everyone I float this to says it's just connectionism, or the statistical mechanics of learning, or predictive coding with a new hat on, and that it's already been absorbed. Is it? If it hasn't been, is that the one?

  What I want from you is a defended ranking, not a list. For each live question -- mine, the three above, and anything I've missed that you think is the real heir to his project -- tell me: is it upstream of other work or downstream of it, can one theorist plausibly move it in two years from an armchair, has it secretly been answered and we just didn't notice, and what would have to happen to move it up or down my ranking. And please flag the zombies: questions that keep getting restated because they sound foundational but that no possible result could settle. I'd much rather fund something that could turn out to be wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Philosopher of cognitive science in an engineering department.
      *   **Resources:** 1 postdoc, 2 years, small pot of money.
      *   **Constraints:** Conceptual work on von Neumann's *The Computer and the Brain* (C&B). No wet lab, no new data, no hardware. Must be defensible to neuromorphic engineers (pragmatic, hardware-conscious, likely skeptical of pure philosophy).
      *   **Goal:** A defended ranking of open questions derived from von Neumann's project. Needs to identify what *matters*, what's actionable in 2 years by a theorist, and what's a "zombie" question.
      *   **Tone:** Intellectual, rigorous, slightly cynical about "picked over" topics, appreciative of the "armchair" constraint but demanding of defensibility.

  2.  **Deconstruct the Candidates:**

      *   **Candidate 1: Analog vs. Digital.**
          *   *Status:* Everyone agrees it's a mix. Neuromorphic engineers build mixed-signal chips.
          *   *Verdict:* Zombie/Downstream. It's an engineering trade-off now, not a foundational mystery.
      *   **Candidate 2: Reliability from Unreliable Components.**
          *   *Status:* Von Neumann's probabilistic logics. Modern deep learning (overparameterization) and error-correcting codes have addressed this pragmatically.
          *   *Verdict:* Downstream/Solved pragmatically. Theoretical novelty is low unless linking to energy efficiency specifically.
      *   **Candidate 3: Memory (Distributed vs. Addressed).**
          *   *Status:* Neuroscience (hippocampus/cortex) and ML (associative memory, transformers) have moved this on.
          *   *Verdict:* Downstream. Hard to do "armchair" work that beats empirical neuroscience here.
      *   **Candidate 4 (User's Hunch): The Language/Code (Statistical/Aggregate vs. Logical).**
          *   *Status:* User worries it's just connectionism/predictive coding.
          *   *Verdict:* This is the strongest candidate *if* framed correctly. It's about the *syntax* of neural representation, not just the statistics. Von Neumann suspected the mathematical language was missing.
      *   **Missing Candidate:** The *Energy/Thermodynamic* constraint linked to logic. Von Neumann was obsessed with the physical realization of logic. Neuromorphics care deeply about this (SWaP - Size, Weight, and Power).

  3.  **Evaluate Against Criteria:**
      *   *Upstream/Downstream:* Upstream questions enable new frameworks. Downstream questions apply existing ones.
      *   *Armchair Viability:* Can a postdoc + philosopher make progress without data? Yes, if it's conceptual/mathematical framing.
      *   *Zombie Status:* Is it unresolvable in principle?
      *   *Neuromorphic Defensibility:* Will engineers care? They care about efficiency, architecture, and coding schemes that reduce power/latency.

  4.  **Develop the Ranking:**

      *   **Rank 1: The "Language" Hypothesis (User's Hunch).**
          *   *Why:* It's the only one that remains truly open conceptually. Deep learning uses statistics, but doesn't explain the *semantic syntax* of spikes in the way von Neumann worried about (the "message" vs. the "medium").
          *   *Twist:* Don't call it "connectionism." Call it "Neural Syntax" or "Operational Semantics." Focus on the *message structure* required for compositional generalization (a weakness of current DL).
          *   *Defensibility:* Engineers need better coding schemes for spiking nets that aren't just rate-coded or time-to-first-spike.
      *   **Rank 2: Thermodynamic Logic (The Missing Candidate).**
          *   *Why:* Von Neumann died before Landauer's Principle was fully integrated. Neuromorphics are hitting power walls. Re-examining the cost of *logical* operations in wetware vs. silicon is huge.
          *   *Armchair:* Yes, theoretical physics/info theory.
      *   **Rank 3: Reliability (Reframed).**
          *   *Why:* Only if reframed away from error-correction codes toward *graceful degradation* in safety-critical neuromorphic hardware.
          *   *Status:* Mostly solved, but energy-efficient reliability is not.
      *   **Rank 4: Analog/Digital.**
          *   *Why:* Zombie. It's a spectrum, not a binary mystery.
      *   **Rank 5: Memory Architecture.**
          *   *Why:* Empirical question now. Philosophy can't solve it without data.

  5.  **Drafting the Argument (Iterative refinement):**

      *   *Critique of User's Hunch:* It *is* connectionism, but specifically the lack of a *compositional* theory within connectionism. Von Neumann wanted a logic that handled meaning, not just correlation. If the postdoc can formalize a "statistical logic" that allows for variable binding without symbolic overhead, that's gold.
      *   *Neuromorphic Angle:* Engineers are building Spiking Neural Networks (SNNs). They don't know what the "assembly code" is. Is it rate? Timing? Phase? A theory of *Neural Message Structure* helps them design encoders/decoders.
      *   *Zombie Check:* "Analog vs Digital" is a zombie because the answer is "Yes." "Memory" is a zombie for a philosopher because the answer requires a pipette.
      *   *The "Real Heir":* It's not about the brain per se, it's about *computational substrate independence* under biological constraints.

  6.  **Refining the Top Pick (The "Language"):**
      *   Need to distinguish it from Predictive Coding. Predictive coding is a *functional* account (what is being computed). Von Neumann's worry was *representational* (how is it encoded such that it can be manipulated?).
      *   Focus on **Compositional Generalization in Subsymbolic Systems**. This is the modern name for von Neumann's worry about the "language." Current DL fails at systematic generalization. If the brain has a "language" that allows this without discrete symbols, that's the missing math.
      *   *Actionable:* Formal analysis of existing SNN codes vs. biological constraints. Proposing a new algebraic structure for population codes.

  7.  **Final Polish:**
