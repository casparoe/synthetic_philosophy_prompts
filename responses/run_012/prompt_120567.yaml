  *(Self-Correction on the "Language" hunch)*: I need to be careful not to let the user just do "philosophy of mind." It needs to be "mathematics of representation." The postdoc should probably have a math/physics background. The output shouldn't be a paper on "qualia" but a paper on "algebraic structures in population codes."

  *(Final check on Von Neumann's text)*: He specifically mentioned the "mathematical language" not being ours. He worried about the depth of the procedure. So the "Language" hunch is historically accurate.

