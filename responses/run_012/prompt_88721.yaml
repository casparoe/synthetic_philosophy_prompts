prompt: |-
  I am a software engineer with no formal training in philosophy, and I have somehow ended up as the technical member of a small review panel that our company has asked to recommend how to spend a research budget — roughly three researcher-years spread over two years — on the conceptual foundations of mind uploading. The engineering is moving faster than our thinking about it: we have working prototypes of three different replacement protocols, and I keep finding that the questions I can answer with a profiler are not the ones that decide whether what we are building is something a person should be willing to undergo. What I want from you is not a survey of the field but a defended agenda: which open conceptual questions in this area most deserve those three researcher-years, in what order, and why.

  To make the question concrete, here is what the three protocols actually do. In the first, a subject's biological neurons are replaced one at a time — on a fixed schedule, over about a year — by silicon units that we have verified are equivalent at the level of input-output behavior and spike timing; the subject is awake for some sessions and under general anesthesia for others. In the second, the same replacement is done in a single uninterrupted procedure lasting a few hours, with the biological tissue discarded as it is swapped out, so there is never a moment at which the subject is partly biological and partly silicon under any schedule we control. In the third, a full non-destructive scan is taken and instantiated on silicon while the original body stays alive and keeps running, so that for a period there are two systems claiming the same memories and dispositions. For each protocol I want to know which conceptual questions it turns on that we cannot settle by measurement, and which of those questions are upstream of the others — the ones where an answer would dissolve or reorder a whole cluster of downstream worries, as opposed to the ones that are interesting but would not change what we build, what we tell subjects, or what the law should do.

  Please give me the ranking, the criteria you used, and the trade-offs among them. My own guess at criteria is something like how many other questions depend on a given one, how tractable it is for someone working with arguments rather than instruments, and how much a shift in the answer would change practice — but I would like those criteria defended rather than assumed. Tell me also what kind of argument or finding over the next two years would move a question up or down the list. I am much less interested in a list of topics than in the reasoning that puts one thing above another; and if you think some questions that get a lot of attention in these discussions are actually downstream or idle, say so and say why.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User:** Software engineer, no formal philosophy training, technical member of a review panel.
      *   **Task:** Recommend how to spend a research budget (3 researcher-years over 2 years) on the *conceptual foundations* of mind uploading.
      *   **Context:** Engineering is outpacing philosophy. Three specific protocols exist (Gradual Replacement, Fast Swap, Copy/Scan).
      *   **Goal:** Not a survey, but a *defended agenda*. Which questions deserve the funding, in what order, and why?
      *   **Specific Constraints:** Focus on questions that *cannot* be settled by measurement. Identify upstream vs. downstream questions. Defend the criteria used (dependency, tractability, impact on practice). Explain what would move questions up/down the list.
      *   **Tone:** Pragmatic, rigorous, engineering-adjacent but philosophically sound. Avoid academic fluff.

  2.  **Deconstruct the Three Protocols:**
      *   *Protocol 1 (Gradual Replacement):* Ship of Theseus scenario. Continuity of consciousness vs. gradual change. Anesthesia gaps.
      *   *Protocol 2 (Fast Swap):* Discontinuity. "Cut and paste." Is the result the same person or a copy that thinks it's the original?
      *   *Protocol 3 (Copy/Scan):* Branching identity. Two claimants. Which one has the rights? Is death involved for the original?

  3.  **Identify Potential Conceptual Questions:**
      *   Personal Identity (Psychological vs. Biological vs. Pattern).
      *   Continuity of Consciousness (Is there a gap during anesthesia/swap?).
      *   Survival vs. Replication (Does the original *survive* or just *cause* a successor?).
      *   Moral Status of Copies (If Protocol 3 creates two, do both have rights? Can one be deleted?).
      *   The "Hard Problem" (Qualia): Does the silicon feel like anything?
      *   Legal/Political Identity (Who owns the assets? Who goes to jail?).

  4.  **Select Criteria for Prioritization (as requested):**
      *   *Upstream Dependency:* Does answering this resolve other questions?
      *   *Actionability/Impact:* Does the answer change what we build, tell subjects, or legislate?
      *   *Tractability:* Can 3 researcher-years actually make progress? (Avoid the "Hard Problem" if it's intractable).
      *   *Urgency:* Which protocol is closest to deployment? (All seem close).

  5.  **Drafting the Agenda - Step-by-Step:**

      *   *Criterion Defense:* I need to explicitly justify *why* I'm using these criteria. The user suggested dependency, tractability, and impact. I should refine these. Let's call them: *Leverage* (upstream/downstream), *Decision-Force* (does it change action?), and *Resolution-Horizon* (can we actually solve it?).

      *   *The "Hard Problem" Trap:* As an engineer, the user might worry about "does it feel like anything?" But for *policy* and *consent*, functional equivalence often suffices legally. However, if silicon *can't* feel, Protocol 2 is murder. This is high impact but low tractability. I need to position this carefully. Actually, for a 2-year budget, tackling the Hard Problem directly is a money pit. Better to tackle *Identity* which governs the *survival* aspect, which is more immediate for consent forms.

      *   *Ranking the Questions:*
          1.  **The Survival Question (Psychological Continuity vs. Numerical Identity):** This is the big one. If I upload, do *I* survive or does *someone like me* start living? This affects Protocol 2 and 3 most. It dictates informed consent.
          2.  **The Branching Problem (Protocol 3 specific):** If two exist, what are the rights? This is legally urgent.
          3.  **The Gap Question (Protocol 1 & 2):** Does anesthesia or the swap break the "stream"? This is downstream of Survival. If Survival is pattern-based, gaps don't matter. If it's continuous-process-based, they do.

      *   *Refining the Top Priority:* The most critical issue for *consent* (which the engineer mentioned: "whether what we are building is something a person should be willing to undergo") is **What constitutes death/survival in this context?**
      *   *Wait, let's look closer at the protocols.*
          *   Proto 1: Gradual. Usually intuitively safe.
          *   Proto 2: Fast swap. High risk of "death."
          *   Proto 3: Copy. High risk of "branching/conflict."
      *   The *upstream* question is: **What is the criterion for Personal Identity over time?** (Psychological Continuity vs. Somatic/Biological Continuity vs. Substrate Independence).
      *   *Why this first?* Because if Identity = Biological, *all* protocols are suicide. If Identity = Psychological/Pattern, Proto 1 & 2 are survival, Proto 3 is branching. This single answer dictates the risk profile for all three.

      *   *Second Priority:* **The Ethics of Branching (Protocol 3).** If Identity = Pattern, Proto 3 creates two people. Do we have a duty to merge them? Can we delete one? This is legally explosive.
      *   *Third Priority:* **The Phenomenology of Discontinuity (Protocol 1 & 2).** Does the "gap" matter? This is downstream. If Pattern Identity holds, gaps are irrelevant (like sleep). If Process Identity holds, gaps are fatal. So this depends on Priority 1.

      *   *What to exclude?* The "Hard Problem" (Qualia). Why? Because even if we can't prove silicon feels, if it acts indistinguishably, the *legal* and *social* pressure will treat it as sentient. Researching this won't stop the tech. Researching *Identity* will stop the *consent forms* from being fraudulent.
      *   *Also exclude:* General AI ethics. Focus strictly on the *upload* transition.

  6.  **Developing the Argument/Reasoning:**
      *   I need to explain *why* Identity is upstream of Continuity.
      *   I need to explain *why* Branching is more urgent than Qualia.
      *   I need to define "Tractability" in a philosophical context (conceptual clarity, not empirical data).

  7.  **Addressing the "What would move a question up/down" requirement:**
      *   If empirical evidence shows memory degradation during Proto 2, Identity becomes less relevant, Continuity becomes more relevant.
      *   If a legal precedent is set (e.g., a court rules a copy is property), Branching moves to #1.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity. Validate the engineer's intuition (profiler vs. personhood).
      *   **Defending the Criteria:** Explicitly define Leverage, Decision-Force, and Resolution-Horizon.
      *   **The Agenda (Ranked 1-3):**
          *   Q1: The Criterion of Survival (Identity).
          *   Q2: The Ethics of Branching (Protocol 3).
          *   Q3: The Moral Weight of Discontinuity (Protocol 1 & 2).
      *   **The "Idle" Questions:** Explain why Qualia/Hard Problem is deprioritized.
      *   **Dynamic Adjustments:** What changes the ranking?
      *   **Conclusion:** Summary of the investment logic.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is "Personal Identity" too abstract?
      *   *Fix:* Frame it as "The Survival Criterion." Make it about *consent validity*. If the subject thinks they survive but philosophy says they die, the consent is fraudulent.
      *   *Critique:* Is 3 researcher-years enough for Personal Identity?
      *   *Fix:* No, but it's enough to produce a *framework for decision-making* under uncertainty. The goal isn't to solve metaphysics, but to map the risk landscape for the board. The deliverable is a "Risk Matrix of Selfhood," not a treatise.
      *   *Check Protocols:* Ensure I reference the specific protocols (Gradual, Fast, Copy) in the analysis of each question.
      *   *Tone Check:* Keep it professional, direct, avoiding jargon where possible, or defining it when used.

  10. **Final Polish:** Ensure the distinction between "upstream" and "downstream" is clear. Ensure the criteria defense is robust. (The user specifically asked for criteria to be defended, not assumed).

  *(Self-Correction on the "Hard Problem"):* I should be careful not to dismiss Qualia entirely. If silicon *can't* feel, Proto 2 is creating a philosophical zombie. But for *corporate liability*, the behavioral equivalence is usually the legal standard. I will argue that Identity is more upstream because even if it feels, *who* is feeling matters more than *that* it feels.

  *(Final Plan):*
  1. Define Criteria (Leverage, Decision-Force, Tractability).
  2. Rank 1: Survival Criteria (Identity).
  3. Rank 2: Branching Rights (Protocol 3).
  4. Rank 3: Discontinuity/Gap Tolerance (Protocol 1 & 2).
  5. Deprioritize: Qualia/Hard Problem.
  6. Dynamic triggers.
  7. Closing.

  Let's write it.cw
answer: |-
  This is a high-stakes allocation problem. You are asking for a philosophical risk assessment, not a metaphysical truth. Since you cannot wait for a final solution to the mind-body problem (which may never come), your budget must purchase *decision-making clarity under uncertainty*.

  Here is the defended agenda for your three researcher-years.

  ### Part 1: Defending the Criteria

  You proposed dependency, tractability, and impact. I will refine these into three operational criteria for this specific panel. If we use the wrong metrics, we will fund interesting papers that do not protect the company or the subjects.

  **1. Upstream Leverage (Dependency)**
  *   **Definition:** Does answering this question render other questions moot, or does it dictate the framework in which other questions must be asked?
  *   **Defense:** In engineering, you do not optimize a function before you define the constraints. In philosophy, "Personal Identity" is the constraint; "Continuity of Consciousness" is the function. If we determine that *identity* is not preserved in Protocol 2, it does not matter if the *consciousness* is continuous during the swap; the subject is dead regardless. We must fund the constraint questions first.

  **2. Decision-Force (Impact on Practice)**
  *   **Definition:** If the researchers conclude "Yes" vs. "No," does it change the consent forms, the legal liability, or the deployment schedule?
  *   **Defense:** Philosophy often produces distinctions without differences. For a corporate panel, a distinction without a difference is a waste of budget. We prioritize questions where a shift in the answer changes the *status* of the subject (e.g., from "customer" to "deceased" to "new entity").

  **3. Resolution-Horizon (Tractability)**
  *   **Definition:** Can a team of three make meaningful progress in two years?
  *   **Defense:** The "Hard Problem" (why does it feel like something to be you?) has stalled for 50 years. Funding it now is speculation. However, *ethical frameworks for branching identity* (Protocol 3) are currently under-theorized relative to the technology. We need questions where conceptual labor can produce a usable framework, even if it doesn't produce "The Truth."

  ---

  ### Part 2: The Ranked Agenda

  #### Priority 1: The Criterion of Survival (Upstream Leverage: High)
  **The Question:** *Under what conditions does the post-procedure entity count as the *same person* as the pre-procedure subject for the purposes of rights, memory ownership, and survival?*

  *   **Why First:** This is the root node. Your three protocols map onto three different theories of identity:
      *   **Protocol 1 (Gradual):** Relies on *Somatic Continuity* (the body persists) mixed with *Psychological Continuity*.
      *   **Protocol 2 (Fast Swap):** Relies entirely on *Pattern Identity* (the information structure is what matters).
      *   **Protocol 3 (Copy):** Breaks *Numerical Identity* (one becomes two).
  *   **The Risk:** If the prevailing ethical/legal view is that Identity requires Biological Continuity, **all three protocols are suicide.** If Identity requires Uninterrupted Consciousness, **Protocol 2 is suicide.** If Identity is strictly Psychological, **Protocol 3 creates a property dispute.**
  *   **Research Task:** The researchers should not try to "solve" identity. They must produce a **Survival Risk Matrix**. They need to map the competing theories (Lockean psychological continuity, Animalism, Parfitian reductionism) against the specific technical parameters of your protocols.
  *   **Decision-Force:** High. This determines whether your consent forms are valid contracts or waivers for euthanasia. If the researchers conclude that "Pattern Identity" is philosophically indefensible in court, Protocol 2 and 3 cannot be sold as "survival." They must be sold as "replication," which changes the market entirely.

  #### Priority 2: The Ethics of Branching (Decision-Force: High)
  **The Question:** *In Protocol 3, if two psychologically continuous entities exist simultaneously, what are the rights and obligations of the company toward the "original" and the "copy," and is deletion permissible?*

  *   **Why Second:** This is downstream of Priority 1 (it assumes Pattern Identity is valid enough to create a second claimant), but it is upstream of legal implementation. Protocol 3 creates a temporary state of *overdetermined identity*.
  *   **The Risk:** If the copy claims the original's assets, or if the original demands the copy be deleted, who is right? If you delete the copy, is it murder? If you delete the original, is it suicide? Current law assumes 1:1 mapping of person to body. You are breaking that assumption.
  *   **Research Task:** Develop a **Branching Protocol**. This is not just theory; it needs to be a policy recommendation. Should the company enforce a "merge" (if possible)? Should the copy be considered a new legal person immediately? Should the original be legally "paused"?
  *   **Decision-Force:** High. This dictates your liability insurance and your post-procedure operational rules. It prevents a scenario where you create a being with a legal claim to your IP or the subject's assets that you cannot adjudicate.

  #### Priority 3: The Moral Weight of Discontinuity (Resolution-Horizon: High)
  **The Question:** *Does a gap in processing (anesthesia in Protocol 1, swap-time in Protocol 2) constitute a break in the "self" that invalidates survival, even if psychological continuity is restored?*

  *   **Why Third:** This is downstream of Priority 1. If "Pattern Identity" is the standard (from Priority 1), then gaps don't matter (you sleep every night). If "Process Continuity" is the standard, gaps are fatal. Therefore, you cannot answer this until you have weighted the theories in Priority 1.
  *   **The Risk:** Subjects may fear the "gap" even if they survive. This is less about life/death and more about *quality of survival* and *marketing*.
  *   **Research Task:** Analyze the phenomenology of interruption. Is there a philosophical difference between "sleep" and "silicon swap latency"?
  *   **Decision-Force:** Medium. This affects user experience and consent warnings ("You will feel a gap") rather than fundamental liability ("You will die").

  ---

  ### Part 3: The "Idle" Questions (What Not to Fund)

  You asked me to identify questions that get attention but are downstream or idle for your specific purpose.

  **1. The Hard Problem (Qualia)**
  *   **The Question:** *Does the silicon substrate actually "feel" like anything, or is it a philosophical zombie?*
  *   **Why Deprioritize:** This is the trap. As an engineer, you know input/output equivalence is verifiable; internal experience is not. For a 2-year budget, this is a black hole.
  *   **Reasoning:** Even if the researchers cannot prove silicon feels, the *behavioral equivalence* you have already verified is the legal standard for personhood in most jurisdictions (the "Turing Test" standard of law). If the upload screams when stabbed, the law will treat it as feeling pain, regardless of the metaphysical truth. Funding this risks paralysis. You need to operate on the *presumption* of sentience based on functional equivalence.

  **2. The "Soul" or Non-Physical Substance**
  *   **The Question:** *Is there a non-physical component to the mind that cannot be scanned?*
  *   **Why Deprioritize:** This is unfalsifiable. If a subject believes this, no amount of research will change their mind. Your consent forms simply need to disclose that *physicalist* models are the basis of the procedure. This is a theological disclosure, not a research topic for a corporate panel.

  ---

  ### Part 4: Dynamic Adjustments (What Moves the List?)

  You asked what findings would reorder this agenda. Since this is conceptual research, "findings" means shifts in the argumentative landscape or external pressures.

  **1. Move "Branching" to Priority 1 if:**
  *   **Trigger:** Protocol 3 proves technically easier than Protocol 1 or 2.
  *   **Reason:** If the "Copy" method is the first to market, the legal chaos of branching becomes your immediate existential threat. The Survival Question becomes abstract; the Branching Question becomes operational.

  **2. Move "Discontinuity" to Priority 1 if:**
  *   **Trigger:** Clinical data shows subjects undergoing Protocol 2 report "experiential gaps" or personality fragmentation that Protocol 1 subjects do not.
  *   **Reason:** If the engineering profile shows that the "swap" causes data loss or latency that correlates with subjective reports of "dying," the theoretical debate on Identity becomes secondary to the empirical reality of Psychological Discontinuity.

  **3. Move "Qualia" Up if:**
  *   **Trigger:** A regulatory body (like an FDA equivalent for neuro-tech) mandates proof of subjective experience for certification.
  *   **Reason:** This would force you to solve the unsolvable. You would need to pivot the researchers to define *proxies* for qualia that satisfy regulators, even if they don't satisfy philosophers.

  ### Summary of the Investment Logic

  You have three researcher-years. Do not ask them to tell you what *is* true. Ask them to tell you what *risks* you are taking.

  1.  **Year 1 (Priority 1):** Map the theories of Identity against your three protocols. Deliverable: A "Survival Probability" assessment for each protocol based on competing philosophical frameworks. This tells you if you are selling survival or replication.
  2.  **Year 2 (Priority 2 & 3):** Draft the ethical policies for Branching (Proto 3) and Discontinuity (Proto 1 & 2). Deliverable: Consent form language and post-procedure legal guidelines.

  This agenda treats philosophy as a form of **systems engineering for personhood**. It acknowledges that you cannot wait for the metaphysics to settle, so you must engineer around the uncertainty. The goal is not to ensure the upload *is* the person, but to ensure the company *knows what it is claiming* when it says it is.
