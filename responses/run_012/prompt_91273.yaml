answer: |-
  The red light on the recorder blinked like a slow, steady heartbeat. One second on, one second off. In the silence between the blinks, the dust motes dancing in the shaft of afternoon sun seemed to hold their breath.

  Elias adjusted his glasses and looked at his notebook. Page four hundred and twelve. He knew this page better than he knew the face of the woman sitting across the table. Elara was eighty-nine, her hands resting on the worn wood like birds settling on a branch. Outside, the village of Kaelo was hollowing out. Three houses remained occupied. The rest were skeletons of timber and stone, waiting for the wind to take them.

  He had been here for ten years. He had ten thousand recorded sentences. He had a grammar bound in blue leather that predicted Elara's speech with ninety-nine percent accuracy. When he showed her a picture of a man eating bread, he knew she would use the *active-evidential* suffix *-ne*. When he showed her a man dreaming of bread, she used the *subjunctive-distant* *-ko*.

  The language, Veshic, was a clockwork mechanism in his head. He could hear the gears turning before she opened her mouth.

  "Elara," Elias said, his voice soft, careful not to startle the silence. "Let's try the hypotheticals again. The ones about the future."

  She nodded. Her eyes were clouded with cataracts, but her gaze was steady.

  "If you were to plant a seed," Elias said, reading from his prompt card, "and you knew you would die before it sprouted, and no one else was there to see it... how would you say 'I planted'?"

  He knew the answer. He had asked variations of this fifty times. The rule was clear in his grammar: *The agentive marker requires a witness.* If there is no witness, the action is linguistically incomplete. It cannot be stated as a fact. She should use the *null-form*. She should say nothing, or use the particle *vesh*, meaning 'unseen/void'.

  Elara looked out the window at the empty road. A dog barked in the distance, the only other living thing within a mile. She turned back to him.

  "*Kaelo-ne*," she said.

  Elias's pen froze above the paper.

  She had used *-ne*. The witness marker. The marker for 'we saw this happen' or 'it happened in the shared light'.

  He blinked. "Elara? You used *-ne*."

  "Yes."

  "But... there is no one else. I am not Veshic. I don't count."

  "You are here," she said.

  "I mean, no one who speaks the language. No one who knows what planting means in the old way."

  She tapped the table. "You hear. I speak. The seed goes in the earth. The word goes in the air. It is done."

  Elias felt a cold prickle at the base of his neck. He flipped back through his notebook. Pages of transcriptions. Hundreds of instances of *-ne*. Every single one involved a second person, a community, a village gathering. The pattern was unbroken. A straight line drawn through ten thousand points.

  If he drew the line forward, *-ne* meant 'witnessed by the community'.
  If he accepted her sentence, *-ne* meant 'witnessed by *any* listener'.

  Or perhaps it meant something else entirely. Perhaps it never meant 'witnessed' at all. Perhaps it meant 'spoken with intent'. For ten years, the intent had coincided with the community, so he had mistaken the shadow for the object.

  He looked at the blue grammar book. It was a tombstone. It described a language that existed only in the past tense. If he wrote down *Kaelo-ne*, he was admitting that the grammar was wrong. Not incomplete—*wrong*. The rule he had deduced, the rule that made sense of the decade, was a fiction. A guess that had worked until now.

  But if he didn't write it down? If he marked it as an error, a slip of an old woman's tongue?

  He looked at Elara. She was waiting. She wasn't confused. She wasn't guessing. She was speaking her language.

  Who was the authority here? The thousands of pages of data, or the single throat that could still make the sounds?

  If a community defines a rule, what happens when the community shrinks to one? Does the rule shrink with it? Or does the rule stay big, waiting for people to return who never will?

  Elias looked at the recorder. The red light blinked. On. Off. On. Off. It was recording everything. The machine didn't care about rules. It only cared about vibration.

  "Say it again," Elias whispered.

  "*Kaelo-ne*," Elara said. Firm. Unchanged.

  He looked at his pen. The ink was black, permanent. Once it touched the paper, it became data. It became part of the archive. Future linguists, if there were any, would look at this page. They would see the deviation. They would look at his notes.

  If he wrote *Kaelo-ne* and added a note saying *Speaker error*, he preserved the rule. He kept the logic consistent. He saved the grammar from contradiction.

  If he wrote *Kaelo-ne* and changed the definition of *-ne*, he honored her. But he shattered the system he had built. He admitted that he had never known the language, only its shadow. He admitted that the rule was not in the records, but in her head, and her head was a place he could not enter.

  The village outside was silent. The wind moved through the empty houses, making them whistle. It sounded like voices, almost.

  Elias realized that the rule wasn't about the past. It wasn't about what she had said before. It was about what she was allowed to say now. If he corrected her, if he said, "No, Elara, you used the wrong suffix," he was asserting that he knew Veshic better than she did. He would be training her. The student teaching the master. The archive consuming the source.

  But if he let it stand, he was saying that the language could change in a single afternoon. That a decade of observation could be overturned by a single sentence. That truth was not cumulative, but instantaneous.

  The red light blinked.

  Elara shifted in her chair. The wood creaked. She looked at his hand, hovering over the notebook. She didn't know what he was thinking. To her, this was just speaking. To him, it was legislation.

  "Is it wrong?" she asked.

  Elias looked at the word he had half-written. The loop of the 'n' was unfinished.

  "No," he said. His voice sounded thin. "No, it's not wrong."

  He pressed the pen down. The ink flowed onto the page, dark and wet. He wrote the sentence. He wrote the suffix.

  Then he hovered over the grammar notes. The definition of *-ne*. *Marker of communal witness.*

  He scratched out *communal*. The paper fibers frayed under the nib.

  He paused.

  If he changed the definition, he validated her sentence. But he also changed the past. Every previous sentence he had recorded now meant something different than it had yesterday. The history of the language was being rewritten in real-time, not by evolution, but by interpretation.

  There was no one to check him. No committee. No peers. Just the dust, the woman, and the machine.

  He looked at Elara. She was watching the dust motes again. She had already moved on. For her, the word was gone the moment she said it. It belonged to the air. For him, it belonged to the paper.

  Elias lifted the pen. He looked at the scratched-out word. It looked like a wound in the page.

  He could write *potential witness*. He could write *intent*. He could write *speaker's truth*.

  Or he could leave it blank.

  The red light blinked. On. Off.

  Outside, the wind picked up, rattling the windowpane. It sounded like a crowd whispering, or perhaps just the empty air rushing into a vacuum.

  Elias put the cap back on the pen. He closed the notebook without writing the new definition. He left the scratched-out word there, a black scar on the white paper. He would decide what it meant tomorrow. Or maybe he wouldn't.

  "Thank you, Elara," he said.

  She nodded. "The seed is in the earth."

  "Yes," Elias said. He looked at the recorder, then at the window, then back at the book. "We'll see if it grows."

  He didn't turn off the machine. He let the red light blink into the silence, counting out the seconds of a language that was no longer sure of its own rules.
