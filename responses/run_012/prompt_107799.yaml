answer: |-
  1. You argue that the standard view of Bongard problems as induction tests is a category mistake, but the format itself—six examples on the left, six on the right—looks inherently statistical. Does the specific number six do real cognitive work in your framework, constraining the generative grammar search, or is it just a historical convention that we could swap for four or ten without changing the underlying mechanism?

     *Follow-up:* If you say the number provides necessary statistical constraint to rule out accidental regularities, doesn't that smuggle the very inductive reasoning you're trying to replace back into the core of the model?

  2. If the solver is merely recognizing which operations from a small, fixed stock of drawing primitives could have produced the figures, why are these problems so notoriously difficult for humans? If the grammar is limited, the search space should be tractable; does the difficulty come from the combinatorics of the grammar itself, or from noise in the perceptual system?

     *Follow-up:* If you argue the combinatorics are actually vast despite small primitives, what heuristics does the brain use to prune that tree, and aren't those heuristics just inductive biases in disguise?

  3. A central piece of your vocabulary is "drawing affordance," suggesting the figures are artifacts of a hand that could have drawn them otherwise. Does this imply that the solver is implicitly modeling the *intent* of the creator, and if so, does that make solving a Bongard problem a test of Theory of Mind rather than spatial perception?

     *Follow-up:* If you say it doesn't require full Theory of Mind, how do you distinguish between recognizing a physical affordance and recognizing a communicative intention without collapsing the two?

  4. Some Bongard problems rely on counting or parity facts—like "left side has even numbers of shapes"—which seem trivial once seen, yet people reliably miss them while spotting complex spatial relations. If possession of the generative grammar is what matters, why does a simple counting concept fail to engage when a complex topological one succeeds?

     *Follow-up:* What does that specific failure tell us about the difference between possessing a concept and being able to state it, and does your framework allow for concepts that are possessed but inaccessible to the solver's own report?

  5. Humans often justify their solutions by verbally narrating a rule, which sounds like a linguistic operation rather than a perceptual recognition of drawing operations. If the core mechanism is non-linguistic grammar recognition, why does the output map so cleanly onto natural language syntax?

     *Follow-up:* If you say language is just the reporting interface, can your model account for cases where a subject solves the problem correctly but gives a verbally incoherent or incorrect explanation of why?

  6. You claim previous researchers made a category mistake by treating this as concept induction. What is the strongest piece of empirical evidence that looks exactly like induction—such as learning curves or transfer effects—that your generative grammar account needs to explain away?

     *Follow-up:* If you cite specific error patterns that induction models miss, has your grammar model been tested to see if it replicates those human error patterns quantitatively rather than just qualitatively?

  7. Deep nets and LLMs sometimes solve these problems and sometimes fail in ways that look nothing like human failure. Does your view predict that AI will continue to struggle specifically because it lacks the embodied history of "drawing affordances," or do you expect scaling to eventually brute-force the grammar search?

     *Follow-up:* If you argue they lack affordance, what specific behavioral test could distinguish an AI that has learned the grammar statistically from one that actually possesses the generative concepts?

  8. If the grammar of drawing operations is fixed, do people get better at Bongard problems with practice, or is it an all-or-nothing recognition event? If they do improve, does that imply the grammar itself is learnable, which would undermine the idea that it's a static stock of possessed concepts?

     *Follow-up:* If you say the grammar is learned over development rather than during the task, at what age do children acquire the full stock of primitives, and do Bongard success rates track that timeline?

  9. Does this framework extend beyond Bongard problems to other domains where we distinguish categories by structure rather than statistics, such as syntax or music, or is the "drawing affordance" unique to visual spatial tasks?

     *Follow-up:* If you say it applies elsewhere, why have Bongard problems become the paradigmatic case if the mechanism is actually domain-general?

  10. Finally, is there a pattern of human success or failure on these problems that your framework could not accommodate? If any result can be explained by adjusting the stock of primitives or the constraints on the grammar, how do we falsify the theory rather than just refine it after the fact?

      *Follow-up:* If you claim it is falsifiable, can you give me one specific, risky prediction about a novel Bongard-style problem where your model predicts failure but standard induction models predict success?

  Through-line: The interview probes whether shifting from induction to generative grammar truly explains human cognition or merely relabels the mystery of concept possession.
