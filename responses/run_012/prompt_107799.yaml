prompt: |-
  I host a tiny podcast on cognitive science and philosophy of mind, mostly with people whose work hasn't quite hit the mainstream yet, and next weeks guest is a researcher who has been developing a fairly heterodox line on Bongard problems -- the classic ones with six little boxes on the left and six on the right, where you have to figure out what distinguishes left from right. Her claim is that almost everyone since the problems were popularized has treated them as a test of concept induction from examples, and that this is a category mistake. On her view, the problems are really testing something more like concept possession under a generative grammar of the grid: the solver doesn't infer a rule from scratch, she recognizes which of a small stock of drawing operations and spatial predicates could have produced the six left figures and not the six right ones. She also has this phrase, 'drawing affordance,' for the idea that the figures are artifacts of a hand that could have drawn them otherwise, and that this is what makes the left/right contrast meaningful rather than just a statistical split. She's giving a talk in our department next month and I want to interview her in a way that actually pushes on the view, not just lets her restate it.

  Can you draft eight to ten interview questions for me? I want at least one each on why the 6/6 format matters and whether it's doing real work or just a convention; on whether her account makes Bongard problems too easy, since the solver supposedly only has to search a small grammar of drawing operations; on how she handles the standard objection that humans often solve them by verbally narrating a rule, which sounds more like language than like perception; and on what her view predicts about deep nets and LLMs, which sometimes solve these problems and sometimes fail in ways that look nothing like human failure. For each question, give me a follow-up keyed to the answer she's most likely to give. I also want one question about the cases where the rule is a counting or parity fact rather than a spatial relation -- the ones that seem trivial once you see them but that people reliably miss -- and a follow-up asking what that failure tells us about the difference between possessing a concept and being able to state it. And one final question that presses on whether the whole framework is falsifiable, or whether any pattern of success and failure can be accommodated after the fact. No need for citations, reading lists, or a bibliography; I just want the questions. At the very end, after the questions, put a one-sentence summary of the interview's central tension on its own line, starting with 'Through-line:'.
