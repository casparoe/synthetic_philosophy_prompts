answer: |-
  Dear Colleague,

  I was delighted to hear that you are building a session around Casablanca for your seminar on the ethics of refugees and asylum, as I have long believed that the film offers a richer texture for these questions than the standard thought experiments we often rely on in philosophical literature. If you want to use the film as a test case for who counts as a refugee and who has a duty to admit them, you must begin by treating Rick's Café Américain not merely as a setting but as a microcosm of the international state system in a state of exception. The crowded room, with its mix of Vichy officials, German officers, refugees, and profiteers, dramatizes the tension between state sovereignty over borders and the moral claims of the displaced. In this space, the philosophical distinctions we teach become flesh and blood. Consider the 1951 Refugee Convention's persecution-based definition against the broader definitions that include people fleeing war, disaster, and general violence. Victor Laszlo is the paradigm case for the former; he is a celebrated resistance leader fleeing specific political persecution by the Nazi regime, making his claim to asylum robust under almost any legal or moral framework. However, the film pushes us to ask about the others crowded into the café who do not possess Laszlo's political capital. The Bulgarian couple, for instance, are desperate for exit visas not because of specific political persecution but because they are trapped by war and economic destitution. Under a strict Convention definition, they might be classified merely as displaced persons or economic migrants trying to emigrate, yet their moral claim on our conscience feels nearly identical to Laszlo's. Then there is the petty criminal Ugarte, who is killed and whose death the film treats as disposable. Ugarte highlights the hierarchy of deservingness that often lurks beneath asylum discourse; he is a man fleeing the consequences of his own actions rather than external oppression, and the film, like many legal regimes, accords him no protection, suggesting that moral worthiness is a precondition for safety.

  This hierarchy is physically manifested in the plot device of the letters of transit, which everyone is chasing after the murdered couriers. These documents suggest the moral status of a scarce good that is supposed to be a right. In an ideal ethical framework, asylum might be conceived as a universal right triggered by need, but in Casablanca, it is a discretionary gift administered by a corrupt bureaucracy. The letters function as a literalization of the border, transforming the right to seek safety into a commodity that can be stolen, sold, or granted by whim. This brings us to Rick's professed neutrality and his refusal to stick his neck out for anyone, which mirrors the stance of states that prioritize non-interference over humanitarian intervention. When Rick intervenes at the roulette table to let the Bulgarian couple win, he is performing an act of charity that bypasses the legal queue. You should ask your students whether this is a model of asylum as grace or a confession that the institutional order cannot deliver justice. If the system were just, Rick's benevolence would be unnecessary; because the system is rigged, justice depends on the arbitrary mercy of a private actor. This touches on the difference between a duty of non-refoulement, which merely prohibits returning someone to danger, and a duty of admission, which requires opening the border. Rick ultimately fulfills a duty of admission for Laszlo and Ilsa, but he does so by manipulating the sovereign power of Captain Renault rather than challenging the system itself.

  Renault's corruption and the visa black market make the border a commodity, and the film invites us to consider what it thinks about the difference between a corrupt border and a just one. Renault sweeps up the same suspects whenever he needs a show of order, demonstrating how asylum procedures can be weaponized for political performance rather than protection. The question of who has a duty to take refugees in is left provocatively ambiguous. Is it Portugal, the gateway to freedom? Is it America, whose visas are the ultimate prize? Is it the French colonial administration, which controls the territory? The film seems to suggest that the duty falls on whoever holds the power to grant exit, yet it largely ignores the city of Casablanca itself and does not notice the Moroccan population on whose territory all of this happens. The indigenous people are rendered invisible, background extras in a drama about European displacement, which reveals a colonial blind spot in both the film and much of the traditional refugee ethics literature that focuses on Westphalian states rather than colonized spaces. The ending, in which the letters go to Laszlo and Ilsa while Rick and Renault walk off into the fog, resolves the immediate crisis for the heroes but leaves the structural problem intact. The café remains, the refugees remain, and the border remains a site of negotiation rather than a guarantee of safety.

  However, you must also take the honest critic's turn and ask where the film resists this reading. It is a wartime romance and a piece of Allied propaganda, and its ethics may be subordinated to Rick's redemption arc and to the sentimental priority of a few named individuals over the anonymous many. The film actually endorses a hierarchy of the deserving, prioritizing the political hero over the economic migrant, the European over the colonial subject, and the sympathetic over the criminal. It does not merely fail to see the hierarchy it assumes; it actively constructs its moral universe around it. Laszlo is saved because he is valuable to the Allied cause, not simply because he is human. This is where the film is morally thin compared to the philosophical literature, which strives for universal principles regardless of utility. Yet, in other ways, the film is more perceptive than the theory. Philosophical arguments often struggle to convey the emotional economy of asylum, the way that hope and despair are traded alongside visas. Casablanca dramatizes something about moral luck and arbitrary mercy that the refugee-ethics literature tends to leave out. It shows us that survival often depends not on the rectitude of one's claim but on being in the right room at the right time with the right benefactor. It captures the agony of the waiting room, the limbo of the asylum-seeker who exists in a state of suspended animation, waiting for a signature that may never come.

  Ultimately, Casablanca adds to the debate by humanizing the abstraction of sovereignty. It shows us that the border is not just a line on a map but a relationship between people, mediated by power, fear, and occasionally, love. It forces us to confront the reality that while we argue about duties and rights in the seminar room, in the world, safety is often dispensed like a favor. If you can guide your students to see both the film's limitations and its insights, they will understand that the question of who counts as a refugee is not just a legal classification but a moral choice made by those who hold the keys to the gate. The film does not solve the ethical dilemma, but it stages it with a clarity that pure argument often lacks, reminding us that behind every definition of persecution or displacement is a person sitting at a table, waiting for someone to decide that their life matters enough to let them pass. I hope this helps you shape the session, and I look forward to hearing how the discussion unfolds.

  Best wishes,

  Your Friend
