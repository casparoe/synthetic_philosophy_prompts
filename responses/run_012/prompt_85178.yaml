answer: |-
  ### Exam Question

  **Question 4** (50 minutes; approx. 600–800 words)

  Consider the following case:
  A prominent economic model of a regulated industry assumes firms possess **perfect foresight** regarding future regulatory changes. Based on this assumption, the model derives a comparative static: stricter regulations produce **no change in emissions**, because firms anticipate the rules and adjust production technologies before the regulations legally bite. The model's predictions align closely with the industry's historical data (in-sample fit). However, empirical observation confirms that firms do *not* have perfect foresight; they operate with partial, noisy expectations. Despite this, the authors argue that the model is valid because it predicts well, and they maintain the **mechanism claim** that anticipation is what neutralizes the regulation.

  Drawing on Friedman's methodology of positive economics and subsequent critiques:
  1.  Does the "F-twist" (that unrealistic assumptions are permissible if predictions are accurate) license the authors' **mechanism claim**? Why or why not?
  2.  Explain why a model's successful fit to historical data does not necessarily make it trustworthy for **policy extrapolation** in this specific context.
  3.  Propose a **general criterion** for distinguishing between "harmless" false assumptions (e.g., frictionless planes) and "load-bearing" false assumptions (like this one).

  ***

  ### Model Answer

  Friedman's "F-twist" argues that the realism of assumptions is irrelevant; a theory should be judged solely by its predictive accuracy. In this case, the model fits historical data well. However, the F-twist does not license the authors' mechanism claim. Friedman defends instrumentalism: theories are tools for prediction, not necessarily true descriptions of reality. By claiming that *anticipation* is the actual cause of the neutralization, the authors shift from instrumentalism to realism. They are asserting the model captures the *because*, not just the *as-if*. Since the core assumption (perfect foresight) is known to be false, and that assumption is the sole driver of the result, the mechanism claim is empirically unsupported. The F-twist protects the prediction, but it explicitly forbids inferring the truth of the assumptions from that prediction. To claim the mechanism is real requires independent evidence of the causal process, which the authors lack.

  This leads to the distinction between in-sample fit and policy trustworthiness. The model fits historical data because, historically, regulatory changes may have been predictable enough that firms *approximated* foresight, or because other offsetting factors masked the error. However, policy extrapolation involves changing the rules of the game. If a new regulation is genuinely surprising (breaking the historical pattern of predictability), the assumption of perfect foresight fails catastrophically. The model predicts "no effect," but in reality, firms will be caught off-guard, and emissions will rise. A model built on a false assumption that drives the result is brittle. It captures a regularity in the data, but not the underlying capacity of the system. Trustworthiness for policy requires knowing *why* the prediction worked, not just *that* it worked. If the "why" relies on a falsehood, the model cannot handle structural breaks.

  This necessitates a general criterion for distinguishing harmless from load-bearing falsehoods. The distinction lies in **causal isolation versus derivational necessity**.
  A harmless idealization (like a frictionless plane) isolates a specific force to understand its contribution. We know friction exists, but we assume it away to see what gravity does alone. The assumption is negligible regarding the specific effect being studied, and we can add the complexity back in later (perturbation).
  A load-bearing false assumption is one where the result *depends* on the assumption being strictly true. If the assumption is relaxed, the result collapses or reverses. In this regulatory model, if you relax perfect foresight to "noisy expectations," the "no effect" result likely vanishes. The falsehood is not isolating a force; it is generating the force.

  Therefore, the test is counterfactual robustness: Does the result hold if the assumption is made more realistic? If the model breaks when the assumption is corrected, the assumption was load-bearing. In such cases, predictive success is likely accidental or limited to a specific historical context. The F-twist allows us to use the model as a calculator for similar past scenarios, but it forbids us from believing the calculator's internal logic or trusting it with new inputs. The authors have conflated predictive utility with explanatory truth. For policy, we need the latter, requiring assumptions that are either true or demonstrably negligible, not assumptions that are false but essential to the derivation.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Critique of the F-Twist regarding Mechanism (6 Marks)**
  *   **6 (A):** Explicitly distinguishes between instrumental prediction (allowed by Friedman) and explanatory mechanism (not allowed). Notes that claiming the mechanism is real contradicts the F-twist's agnosticism about assumption truth.
      *   *B Miss:* Treats the F-twist as a blanket defense for everything the model claims, or rejects Friedman entirely without nuance.
  *   **4 (B):** States the mechanism claim is unsupported but fails to explain why Friedman specifically blocks this inference.
  *   **2 (C):** Vaguely says "assumptions matter" without referencing the prediction/explanation split.

  **2. Fit vs. Policy Extrapolation (6 Marks)**
  *   **6 (A):** Explains that historical fit relies on stable background conditions (predictability). Argues that policy changes constitute a "structural break" where the false assumption (foresight) causes the model to fail specifically on *new* interventions.
      *   *B Miss:* Conflates "fitting the data" with "being true," or says policy is risky without explaining the link to the specific false assumption.
  *   **4 (B):** Notes that past performance doesn't guarantee future results but treats it as a general statistical problem rather than a structural/modeling issue.
  *   **2 (C):** Merely asserts that policy is different from prediction without justification.

  **3. General Criterion for Assumptions (8 Marks)**
  *   **8 (A):** Articulates a clear principle (e.g., Derivational Necessity, Counterfactual Robustness, or Causal Isolation). Distinguishes between assumptions that *isolate* factors (harmless) vs. those that *generate* results (load-bearing).
      *   *B Miss:* Offers a vague heuristic like "assumptions must be approximately true" without defining how to judge the "load-bearing" nature.
  *   **5 (B):** Describes the difference using the exam case only, failing to generalize the rule for other cases.
  *   **3 (C):** Suggests all false assumptions are bad, or all are fine if predictions work.

  **4. Structure and Clarity (5 Marks)**
  *   **5 (A):** Argument flows logically; terms are defined; concise and within word limits.
  *   **3 (B):** Disorganized or significantly over/under length; key terms used loosely.
  *   **1 (C):** Difficult to follow; ignores prompt constraints.

  **Bonus Flags (Do not penalize if absent)**
  *   **Lucas Critique:** Mentioning that policy changes alter agent expectations is excellent context but not required for full marks if the logic is sound.
  *   **Specific Literature:** References to Cartwright (capacities), Mäki (truth-like assumptions), or Hausman (inexact deduction) can boost a borderline A, but are not mandatory.
  *   **Perturbation Argument:** Explicitly mentioning that harmless idealizations allow for "adding friction back in" is a strong marker of an A answer in section 3.
