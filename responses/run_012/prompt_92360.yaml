      *   (2) Hard incompatibilism (Determinism/Indeterminism irrelevant).
      *   (3) Blame is about quality of will (reactive attitudes grounded in regard for others), not UMR.
      *   (4) No retributive punishment (no desert of suffering), only forward-looking.
      *   (5) Reactive attitudes (resentment, etc.) are appropriate/unchanged despite (1).
      *   (6) Accepting (1) should change response to wrongdoers (less "monster", more "what happened?"), implying a shift in attitude/practice beyond just punishment.

  3.  **Identify Tensions:**
      *   *Tension A: (3)/(5) vs. (1).* If blame/resentment is apt based on quality of will, does this presuppose a kind of responsibility that (1) denies? Strawson (P.F.) says reactive attitudes *constitute* responsibility. Galen Strawson says UMR is impossible. The user accepts Galen but keeps P.F. Strawson's reactive attitudes. Is this compatible? Many say yes (compatibilism about responsibility, incompatibilism about UMR). But if blame implies "you could have done otherwise" in a relevant sense, (1) might undercut it. However, the user defines blame as quality of will (3), which sidesteps UMR. This seems manageable (distinct concepts of responsibility).
      *   *Tension B: (4) vs. (5).* (4) says wrongdoers don't deserve suffering (no retribution). (5) says resentment is appropriate. Resentment typically involves a desire for the other to suffer or acknowledge wrong. If resentment is appropriate, why is suffering undeserved? This is a classic tension between retributive emotions and non-retributive justice.
      *   *Tension C: (5) vs. (6).* (5) says keep reactive attitudes (resentment) unchanged. (6) says accepting (1) should change response (less "monster", more "what happened?"). "What happened to you?" suggests an explanatory/excusing stance that might dampen resentment. If resentment is fully appropriate (5), why shift to an explanatory stance (6) that potentially undermines the sting of blame? (6) implies a change in temperament/practice driven by (1), but (5) says (1) gives *no reason* to shed attitudes. This is a direct contradiction.

  4.  **Evaluate Severity:**
      *   *Tension C (5 vs 6)* is the worst. (5) says "no reason to change attitudes." (6) says "accepting (1) should change how we respond... less eager to see people as monsters." Seeing someone as a monster is often a product of resentment/indignation. If (1) motivates a shift to "what happened to you?", it *does* give a reason to modulate reactive attitudes.
      *   *Tension B (4 vs 5)* is significant but common (non-retributive blame). One can resent without endorsing state punishment. But if resentment involves a claim of desert, it conflicts with (4).
