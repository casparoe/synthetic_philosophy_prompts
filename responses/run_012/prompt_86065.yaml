      *   If you want semantic robustness (checking what the code *does*, not what it *looks like*), you run into Rice's Theorem/Halting Problem. You cannot generally decide if an opponent cooperates.
      *   Therefore, a *computable* theory of PE that allows cooperation in PD *must* restrict the program space significantly (e.g., modal agents, bounded proof length).
      *   If you want a general theory over arbitrary code, you must sacrifice Computability or Existence.
