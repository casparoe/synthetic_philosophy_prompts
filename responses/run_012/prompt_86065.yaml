answer: |-
  Here is the specification for an adequate theory of Program Equilibrium (PE), structured as a set of requirements with their motivations and status, followed by an analysis of the trade-offs and a verdict on the impossibility trilemma you identified.

  ### I. The Specification

  **1. Semantic Robustness**
  *   **Requirement:** Equilibrium conditions must depend on the *input-output behavior* of the opponent's program, not its syntactic representation. Two programs that are extensionally equivalent (produce the same output for all inputs) must be treated identically by the equilibrium strategy.
  *   **Motivation:** The "stray whitespace" critique. If equilibrium collapses due to syntactic variance, the theory models a fragile coding convention, not a strategic interaction. It fails to capture the intuition of "reading the opponent's mind/strategy."
  *   **Status:** **Constitutive.** Without this, PE is merely syntactic matching, not game theory.

  **2. Base-Game Consistency (No Over-Generation)**
  *   **Requirement:** If the base game possesses a strictly dominant strategy equilibrium that yields a unique payoff, the program equilibrium must not sustain a Pareto-inferior outcome unless the inspection mechanism fundamentally alters the causal structure (i.e., creates a logical correlation). Specifically, in games where inspection yields no leverage (e.g., against a fixed "Always Defect" bot), the program must revert to the base-game best response.
  *   **Motivation:** The Folk Theorem worry. If PE sustains *any* feasible payoff, it predicts nothing. It must distinguish between games where cooperation is *leverageable* (PD) and games where it is not (e.g., a game where one player has no capacity to punish/reward).
  *   **Status:** **Constitutive.** This distinguishes PE from a "magic cooperation machine."

  **3. Well-Defined Semantics (Halting & Self-Reference)**
  *   **Requirement:** The theory must define the payoff of a program profile even when programs query each other. This requires a resolution for non-halting queries and diagonalizing programs (e.g., "Do the opposite of what you do"). The outcome must be a definite payoff vector, not "undefined."
  *   **Motivation:** The "Defect if Opponent Cooperates" paradox. If two such programs meet, standard execution loops or crashes. A theory of equilibrium cannot rely on undefined payoffs.
  *   **Status:** **Constitutive.** An equilibrium concept requires a defined payoff function.

  **4. Domain Restriction**
  *   **Requirement:** The theory must explicitly delimit the space of admissible programs (e.g., bounded runtime, modal logic formulas, specific proof systems). It cannot claim existence over the set of all Turing Machines.
  *   **Motivation:** Rice's Theorem and the Halting Problem. Determining semantic equivalence or behavioral properties of arbitrary code is uncomputable. To make the equilibrium concept meaningful, the space must be decidable or the theory must accept non-computability.
  *   **Status:** **Constitutive.** (See Verdict below).

  **5. Constructibility (Bounded Rationality)**
  *   **Requirement:** There must exist an algorithm by which a rational agent can compute the equilibrium program, or at least verify that a candidate program is an equilibrium, within reasonable resource bounds.
  *   **Motivation:** If finding the equilibrium requires solving the Halting Problem or searching an infinite proof space, the theory describes idealized mathematical objects, not agents.
  *   **Status:** **Optional Ambition.** A theory can be normatively valid even if computationally hard, but it loses predictive power for bounded agents.

  **6. Language Invariance**
  *   **Requirement:** The set of achievable equilibrium payoffs should not depend on the specific programming language used, provided the languages are Turing-equivalent (or equivalent within the restricted domain).
  *   **Motivation:** If payoffs change because we switched from Python to C++, the theory is modeling compiler artifacts, not strategic reasoning.
  *   **Status:** **Optional Ambition.** This is a consequence of Semantic Robustness but harder to prove formally. It is subsumed by Req 1.

  **7. Interpretive Clarity**
  *   **Requirement:** The theory must state whether it is **Predictive** (describing what agents *will* do), **Normative** (describing what agents *should* precommit to), or **Ontological** (formalizing superrationality).
  *   **Motivation:** If predictive, it must coincide with Nash when inspection is impossible. If normative, it must justify why agents would adopt the code.
  *   **Status:** **Constitutive.** You cannot evaluate the theory without knowing what claim it is making about the world.

  ---

  ### II. The Trade-Off Analysis

  You suspected a tension between **Existence**, **Robustness**, and **Non-Nash Outcomes**. Your suspicion is correct, but the precise trilemma is slightly different. It is between **Semantic Robustness**, **Universal Existence**, and **Computability**.

  1.  **Semantic Robustness:** You want to check what the code *does*, not what it *says*.
  2.  **Universal Existence:** You want an equilibrium to exist for any game over the space of *all* programs.
  3.  **Computability:** You want the agents to be able to find/verify this equilibrium.

  **The Impossibility Result:**
  You cannot have all three.
  *   If you demand **Semantic Robustness** over **All Programs**, you encounter Rice's Theorem. You cannot compute whether an opponent cooperates. Thus, **Computability** fails.
  *   If you demand **Computability** and **Semantic Robustness**, you must restrict the program space (e.g., to Modal Agents or bounded-proof programs). Thus, **Universal Existence** fails (equilibria may not exist outside the restricted class).
  *   If you demand **Universal Existence** and **Computability**, you must abandon **Semantic Robustness** (reverting to Tennenholtz's textual equality).

  ### III. The Verdict

  **The Workhorse Requirement:**
  **Semantic Robustness (Req 1)** does the most work. It is the only feature that distinguishes Program Equilibrium from standard Nash Equilibrium with cheap talk. If you surrender this, you have not solved the fragility problem, and you have not advanced the theory.

  **The Requirement to Surrender:**
  You must surrender **Universal Existence over Arbitrary Programs (part of Req 4)**.
  A defender of Program Equilibrium *must* accept that the theory only applies to a restricted class of programs (e.g., "programs that terminate within $k$ steps" or "programs expressible in Provability Logic").
  *   **Why:** To achieve Semantic Robustness (checking behavior rather than syntax), you must be able to analyze the opponent. Analysis of arbitrary code is undecidable. Therefore, the domain of the theory must be restricted to decidable subsets of code.
  *   **Consequence:** This means PE is not a general solution concept for *any* code interaction, but a specific solution concept for *transparent, analyzable* code interactions.

  **Addressing Your Specific Uncertainties:**

  *   **Existence Space:** Do not allow arbitrary Turing Machines. The definition of the game breaks if payoffs are undefined due to non-halting. **Verdict:** Restrict the space.
  *   **Computability:** It is acceptable for the equilibrium to be computationally expensive (e.g., finding a proof), but it must be *computable in principle*. If it requires an oracle, it is not a theory of agency. **Verdict:** Constitutive that it be computable *within the restricted domain*.
  *   **PD vs. Dominant Strategy:** The theory must yield Cooperation in PD but Defection in a game where cooperation cannot be logically linked to the opponent's move (e.g., if the opponent is a rock). **Verdict:** This is handled by the "Proof" condition. You cooperate only if you can *prove* the opponent cooperates. In PD, mutual proof is possible (via Löb's Theorem). In a dominant-strategy game where the opponent ignores you, proof is impossible.
  *   **Self-Reference:** A program that says "Defect if you Cooperate" against a copy creates a paradox. **Verdict:** In a robust theory (like Modal Program Equilibrium), this results in **Mutual Defection**. The logic defaults to the safe outcome when consistency cannot be proven. This is a feature, not a bug; it penalizes pathological programs.
  *   **Robustness:** Textual equality is insufficient. **Verdict:** Must be semantic (proof-based or simulation-based).
  *   **Language Invariance:** **Verdict:** Optional. As long as the *logic* is invariant, the syntax doesn't matter. This follows from Semantic Robustness.
  *   **Interpretation:** **Verdict:** It is a **Normative Theory of Precommitment**. It describes what rational agents *would* achieve if they had the technology to bind themselves to conditional code. It is not necessarily a prediction of what humans *will* do (since we can't read each other's source code), but a prediction of what AI agents *should* be designed to do.

  ### IV. Scoring Known Constructions Against the Spec

  To make the tension concrete, here is how the main variants score against the Constitutive Requirements (1-4, 7):

  | Construction | 1. Semantic Robustness | 2. Base-Game Consistency | 3. Well-Defined Semantics | 4. Domain Restriction | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Tennenholtz (Textual)** | **FAIL** (Syntax dependent) | PASS | PASS | FAIL (Arbitrary TMs) | **Rejected.** Fragile. |
  | **Proof-Based (Barasz et al.)** | **PASS** (Logical equivalence) | PASS (Requires proof) | PASS (Defaults to Defect) | **PASS** (Modal Logic) | **Strong Candidate.** Sacrifices Universal Domain for Robustness. |
  | **Simulator Bots** | **PASS** (Behavioral) | **FAIL** (Halting risks) | **FAIL** (Infinite loops) | FAIL (Arbitrary TMs) | **Rejected.** Semantics undefined. |
  | **Bounded PE (Resource limits)** | PASS (Approximate) | PASS | PASS | **PASS** (Bounded TMs) | **Viable.** Sacrifices some Robustness for Computability. |

  ### V. Final Summary

  To build a good theory of Program Equilibrium:
  1.  **Accept Domain Restriction.** Admit that PE only works when agents share a formal language that allows mutual verification (e.g., Provability Logic).
  2.  **Enforce Semantic Robustness.** Equilibrium must rely on what the code implies, not what it looks like.
  3.  **Treat Paradoxes as Defection.** If self-reference prevents a consistent outcome, the payoff must default to the security level (minimax), ensuring the equilibrium concept remains well-defined.
  4.  **Classify as Normative.** Treat PE as the study of optimal precommitment devices for transparent agents, rather than a universal predictor of human behavior.

  The "Folk Theorem" worry is alleviated by the **Verifiability Constraint**: You can only sustain outcomes that you can *prove* the opponent will match. This is a much tighter constraint than "feasible and individually rational." It filters out outcomes that are not mutually enforceable via logic.

  **The Single Requirement to Hold Firm:** **Semantic Robustness.**
  **The Single Requirement to Relax:** **Existence over Unrestricted Programs.**

  If you try to keep Existence over Unrestricted Programs, you are forced back to Textual Equality, which renders the theory trivial and fragile. If you hold firm on Robustness, you are forced to restrict the domain, which makes the theory less general but mathematically sound. The latter is the only viable path for a serious theory.
