answer: |-
  Dear Colleague

  I am writing to share the design for the ninety-minute seminar session you requested, structured as a continuous activity that moves through three distinct rounds without initial framing. The goal is to let the students encounter the instability of causal judgments regarding inaction before they have the vocabulary to stabilize them. You will need to prepare four sets of profile cards, with four copies of each profile, so that your sixteen students divide into four quartets. You will also need index cards or small slips of paper for writing, pens, a visible timer, and a small trivial prize such as a single piece of high-quality chocolate or the privilege of choosing seating for the next session. Before you begin, you must address the content note regarding drowning. You should state clearly that the scenario involves a death by drowning and that any student who prefers not to engage with this specific content may remain in the room and observe without participating in the writing or voting, perhaps by reading a provided neutral text or simply sitting out the active phases without penalty. This opt-out must be offered quietly and without drawing attention to those who choose it.

  You will start the session immediately with the first round, which functions as an inquest. Do not offer any lecture on causation or responsibility beforehand. Distribute the four duty profiles so that each quartet holds one profile type. All profiles share the same physical timeline: a swimmer enters a lake in the afternoon, the current strengthens unexpectedly, the swimmer struggles and goes under, and the window of opportunity for rescue closes resulting in death. The profiles differ only in the relationship of the holder to the swimmer and the obligations attached. The first profile describes a lifeguard on shift who was watching the water and was physically capable of swimming out. The second profile describes the parent of the swimmer who was sitting on the shore and was physically capable of swimming out. The third profile describes an off-duty lifeguard who had promised the swimmer earlier that day to keep an eye on them but was not formally on shift. The fourth profile describes a stranger with no prior relationship to the swimmer in a jurisdiction where there is no legal duty to rescue, though public opinion generally expects intervention. Ask each student to privately write on a card a single sentence of the form the death was caused by X rather than Y. They must not discuss this with their quartet. Collect these cards before proceeding. Then, redistribute the profiles at random so that nobody keeps the one they originally held. Hand out fresh cards and have them write the sentence again based on the new profile they now hold. Collect these second cards. To score the first round, read the cards aloud from the first collection, revealing only the sentence and the timeline, without revealing which profile wrote it. The room votes by show of hands on whether they endorse the statement. A card earns its writer a point only if a majority of the room endorses it. Repeat this for the second collection. The student with the most points wins the trivial prize. This entire round should take approximately twenty-five minutes.

  The second round functions as a ledger and begins immediately after the scoring. Keep the students in their quartets or bring them together as one large group, whichever feels more manageable for a shared list. The task is to list everything whose not happening was a condition of the death. The rule is that no two entries may be of the same type, meaning you cannot list the lifeguard not jumping and the parent not jumping as separate entries if they fall under the same category of person, so you must encourage them to categorize broadly or specifically but consistently. The round ends only when the group itself declares the list complete. You should let this run for about eight minutes and then stop it firmly even if they wish to continue. Do not rescue them if they feel the list is incomplete. Do not offer suggestions. If they stall, let the silence sit. This round should take approximately ten minutes including the setup and the forced stop.

  The third round holds the profile and the facts fixed and varies only the comparison being made. For this round, use the lifeguard profile for everyone to ensure the obligations are clear and fixed. You will present six pre-written sentences to the room and ask for a show of hands on whether each is an acceptable description of the cause. The first sentence is the death was caused by the guard staying seated rather than the guard jumping in. The second is the death was caused by the guard staying seated rather than the sun being cloudy. The third is the death was caused by the guard staying seated rather than the guard being off duty. The fourth is the death was caused by the guard staying seated rather than the swimmer not entering the water. The fifth is the death was caused by the guard staying seated rather than the guard throwing a rope. The sixth is the death was caused by the guard staying seated rather than the guard not existing. Record the acceptance or rejection of each visibly on the board. This round should take approximately fifteen minutes.

  The remaining forty minutes are for the debrief. This is the only time you may use the forbidden words. You should map each round onto a philosophical position they have just enacted. For the first round, explain that they were testing causal selection against normative expectations. When they changed their answers after swapping profiles without changing the physical facts, they demonstrated that their causal verdicts tracked what people were required to do. This touches on the debate about whether norms are constitutive of causation or merely influence our explanation of it. For the second round, explain that the inability to terminate the list illustrates the problem of infinite regress in conditioning causes. If every non-event that was necessary is a cause, the list never ends, suggesting that we need a principle of causal selection to stop the regress. For the third round, explain that the varying acceptance of the sentences demonstrates contrast-sensitivity. They accepted some comparisons and rejected others based on what seemed relevant or normal, showing that causal claims are often implicit comparisons rather than absolute statements about the world. You should not cite texts or gesture at a reading list during this explanation. Keep the focus on the concepts they felt during the activity. The goal is for them to realize that the doing and allowing asymmetry they felt is contested because it relies on these unstable normative and contrastive foundations.

  There are predictable failures you should anticipate. In the first round, students may treat the task as a moral judgment rather than a causal one, writing sentences that blame rather than cause. If this happens, do not correct them during the writing phase. Instead, during the scoring, if a card says the guard is to blame rather than caused the death, ask the room if that fits the form requested. This usually self-corrects. In the second round, the group may declare the list complete too early, perhaps after only three items. You must respect their declaration but then point out in the debrief that they stopped based on interest rather than metaphysical completion. Conversely, they may refuse to stop. You must enforce the eight-minute limit strictly to preserve the feeling of incompleteness. In the third round, students might reject all sentences if they become skeptical of causation generally. If this happens, acknowledge it in the debrief as a valid skeptical position but note that they still voted differently across the sentences, which proves the sensitivity even if the baseline is zero. Another risk is that the content note may not be enough for a student who has experienced trauma related to drowning. Ensure the opt-out is genuine and that the observing student has something to do so they do not feel isolated.

  There is one feature of the idea this activity cannot reproduce and that you will have to supply yourself. The activity shows the structure of the problem and makes them feel the instability, but it cannot resolve the metaphysical status of inactions. They will feel that something is wrong with calling a non-event a cause, but the activity does not prove whether omissions are real entities or merely linguistic tools. You will need to supply the philosophical grounding on whether the discomfort they feel is a bug in our thinking or a feature of the world. The activity creates the tension, but you must provide the framework for resolving it. You should also be prepared to manage the energy in the room. Because there is no framing lecture, the students may feel unmoored during the first round. You must remain neutral and procedural until the debrief. Do not smile or nod when they get an answer right. Your neutrality is part of the experimental setup. If you validate them too early, you collapse the tension they need to feel.

  Here is the minute-by-minute plan to keep you on track. Spend the first five minutes on seating, distributing materials, and the content note. From minute five to minute twenty, run the first writing and swapping phase. From minute twenty to minute thirty, conduct the scoring and prize award. From minute thirty to minute forty, run the ledger round and enforce the stop. From minute forty to minute fifty-five, run the six-sentence round. From minute fifty-five to minute eighty-five, conduct the debrief using the conceptual mapping described above. Use the final five minutes to summarize and dismiss the class. If you run long on the ledger, cut time from the debrief, but do not cut the debrief short enough to leave them without the conceptual mapping. The feeling of confusion is useful, but leaving them without the tools to analyze that confusion is pedagogically irresponsible.

  I hope this design serves your seminar well. It is demanding to run because it requires you to withhold explanation until the end, but the payoff is that the students arrive at the concepts through their own judgments rather than your exposition. Please let me know how the first run goes, particularly whether the ledger round stalls as expected or if they find a way to terminate it prematurely. I am available if you need to discuss the debrief framing further.

  Warmly

  Your Colleague
