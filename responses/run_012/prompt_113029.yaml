answer: |-
  ### Tier List

  **Tier 1: Serious Contender**
  *   **(g) Local becoming:** This is the only option that attempts to salvage objective becoming without violating Lorentz invariance, relying on Howard Stein's theorem that a reflexive, transitive "becoming" relation can be defined locally (e.g., via past light cones) without a global simultaneity slice.
  *   **(h) The pragmatic/ontological package proposal:** This belongs here because it correctly identifies that the physics underdetermines the metaphysics, shifting the debate from empirical falsification to theoretical virtue (simplicity, coherence), which dissolves the stalemate without violating SR.

  **Tier 2: Live Option (but concedes the point)**
  *   **(b) The tenseless reading:** This keeps perfect faith with relativity by accepting the block universe conclusion, but it defuses the argument only by denying the reality of becoming rather than reconciling it with physics.
  *   **(f) The indexical move:** Like (b), this is fully compatible with SR, but it functions as the semantic mechanism for the tenseless view rather than an independent solution, explaining the *feeling* of passage without ontological passage.

  **Tier 3: Verbal Dodge**
  *   **(e) The deflationary move:** This often collapses into (b) or (f) by treating becoming as merely linguistic, which resolves the tension only by stipulating that the problem was never about reality to begin with.

  **Tier 4: Changes the Subject (Violates SR Constraints)**
  *   **(a) Privileging a frame (CMB):** This explicitly violates the principle of relativity by selecting a physically distinguished frame to define "real" becoming, failing your constraint against reinstating absolute simultaneity.
  *   **(c) Presentism & (d) The growing block:** While proponents claim these respect SR, they generally require a preferred foliation of spacetime to define the "present" or the "growing edge," effectively smuggling in absolute simultaneity even if it is empirically undetectable.

  ### Assessment of the New Proposal (h)

  The proposal that the dispute is about **ontological packages** rather than physics is a **Tier 1** move. It is **genuinely distinct** from (b) and (e). Move (b) makes a first-order ontological claim that reality *is* tenseless, and (e) makes a semantic claim that truth-conditions *vary*; both assert their view is the correct description of the world. Proposal (h) is a second-order, meta-ontological claim that the physics allows multiple coherent descriptions (packages) and that the choice between them should be pragmatic rather than truth-apt. It allows a physicist to say, "SR is compatible with Eternalism, but Presentism is a valid alternative framework if it proves more useful," whereas (b) and (e) insist Presentism is simply false or confused.

  ### Final Verdicts

  *   **Most Work:** **(g) Local becoming.** It does the heaviest lifting by attempting to reconstruct an objective distinction between past and future using only the resources of Minkowski geometry, without surrendering to the block or violating relativity.
  *   **Least Work:** **(a) Privileging a frame.** It resolves the tension instantly but only by ignoring the core principle of the theory it claims to interpret, effectively solving the philosophical problem by breaking the physics.
  *   **Same Move in Different Clothes:** **(b) The tenseless reading** and **(f) The indexical move.** These are the ontological and semantic halves of the same Eternalist position; you cannot consistently hold that existence is tenseless (b) without also treating "now" as an indexical like "here" (f), as both are required to explain human experience within a block universe.
