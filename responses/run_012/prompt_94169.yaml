      *   **Constraint 2 (Misconceptions):** Address specific misconceptions ('only bothers utilitarians', 'just about adding happy people').
      *   **Constraint 3 (Assessment):** One ending question to test understanding of *why* it's a problem, not just a puzzle.
      *   **Constraint 4 (Exclusions):** Explicitly state what to leave out at this level.
      *   **Tone/Style:** American English, pedagogical, structured for a 50-minute session.

  2.  **Deconstruct the Argument (The Structure):**
      *   To make the conclusion feel inevitable, I need to build up the premises step-by-step.
      *   *Premise 1:* Transitivity of "Better Than." (If A > B and B > C, then A > C).
      *   *Premise 2:* The Mere Addition Principle (or something similar). Adding lives worth living doesn't make things worse.
      *   *Premise 3:* Egalitarian/Total Utility intuition. Distributing welfare more evenly or increasing total welfare is good.
      *   *The Slide:* The step-by-step transition from A to Z.
      *   *The Conclusion:* Z (Repugnant) is better than A (Paradise).

  3.  **Evaluate the "Generation Ship" Example:**
      *   *Pros:* Fresh, sci-fi context appeals to students, allows for clear resource constraints.
      *   *Cons:* Can get bogged down in logistical details (fuel, space). Needs to be abstracted enough to focus on *welfare*, not survival logistics.
      *   *Refinement:* Let's use the Generation Ship but frame it as "Policy Choices" at the launch or during the journey.
      *   *Scenario A:* "The Ark." 1,000 crew, ecstatic lives, rich culture, long leisure.
      *   *Scenario Z:* "The Hive." Billions of descendants, cramped, minimal resources, lives barely worth living (but still positive).
      *   *Wait, Parfit's original argument relies on a sequence.* I need to show the *slide* from A to Z, not just compare A and Z directly. The Generation Ship works well for this: "At each generation, we choose to add more people and slightly reduce resources per capita, but life is still worth living."

  4.  **Drafting the Lesson Plan (50 Minutes):**
      *   *0-5 min:* Hook & Definition.
      *   *5-15 min:* The Setup (The Ship Scenario).
      *   *15-30 min:* The Argument Structure (The Slide). This is the core.
      *   *30-40 min:* Misconceptions (Pre-emptive strikes).
      *   *40-45 min:* Why it matters (Normative force).
      *   *45-50 min:* The Closing Question.

  5.  **Addressing Misconceptions:**
      *   *Misconception 1: "Only Utilitarians."* Need to show that Total View implies it, but Average View has its own problems (Mere Addition Paradox). Actually, the Repugnant Conclusion hits *Total* Utilitarianism hardest, but the *logic* applies to any view that accepts Transitivity + Mere Addition + Non-Elitism. I should clarify that it challenges *any* theory that wants to say Z is worse than A while accepting the intermediate steps.
      *   *Misconception 2: "Just adding happy people."* It's not just addition; it's the *trade-off* between quality and quantity. It's about the *spectrum*.

  6.  **Developing the Closing Question:**
      *   Bad question: "Is the conclusion repugnant?" (Subjective).
      *   Bad question: "How do we solve it?" (Too hard/advanced).
      *   Good question: "Which premise would you reject to stop the slide, and what cost does that rejection impose on your moral theory?" (Forces them to engage with the structure).

  7.  **Determining Exclusions:**
