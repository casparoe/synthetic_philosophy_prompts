answer: |-
  Here is a 50-minute section plan designed to make the Repugnant Conclusion feel like a logical trap rather than a counter-intuitive assertion.

  ### **Lesson Goal**
  By the end of this section, students should understand that the Repugnant Conclusion is not a single claim, but the end-point of a *sorites-style slide* driven by three specific premises. They should see that rejecting the conclusion requires rejecting at least one premise that initially seemed plausible.

  ### **The Example: "Colony Ship Alpha"**
  *Why this works:* It avoids the abstract "Population A vs. Population Z" static comparison. It frames the argument as a series of policy decisions over time, which makes the "slide" feel more dynamic and harder to stop.

  *   **The Setup:** A generation ship is traveling to a new planet. Resources are fixed. The crew must decide on population and resource allocation policies for the journey.
  *   **State A (The Launch):** 10,000 crew members. Everyone has a private cabin, gourmet food, rich cultural life, and deep relationships. Welfare level: **10/10** (Excellent).
  *   **State Z (The Arrival):** Due to iterative policy choices, the population is now 10 billion. Everyone lives in cramped pods, eats nutrient paste, and listens to muzak. No one suffers, but life is monotonous and bare. Welfare level: **1/10** (Barely Worth Living).

  ---

  ### **The 50-Minute Schedule**

  #### **1. Introduction & The Intuition Pump (0:00–0:05)**
  *   **Action:** Draw State A and State Z on the board.
  *   **Script:** "If I asked you to choose between launching the ship as State A or arriving as State Z, almost everyone says A is better. Z sounds awful. Parfit calls this 'The Repugnant Conclusion.' But today, we aren't just comparing endpoints. We are looking at the *engine* that drives you from A to Z."
  *   **Key Concept:** Define the conclusion strictly: *For any possible population of very happy people, there is a much larger population of lives barely worth living that is morally better.*

  #### **2. Building the Bridge: The Argument Structure (0:05–0:25)**
  *   **Goal:** Make the conclusion feel inevitable by constructing the "Slide."
  *   **Step 1: Transitivity (The Engine).**
      *   Explain: If Policy A is better than Policy B, and Policy B is better than Policy C, then Policy A must be better than Policy C.
      *   *Check:* Ask class if they accept this. (They always do).
  *   **Step 2: The Mere Addition Principle (The First Push).**
      *   *Scenario:* Move from **State A** (10k people, 10/10 welfare) to **State A+** (10k original + 10k new clones, same resources split slightly, but new lives are worth living).
      *   *Premise:* Adding people with lives worth living does not make the outcome *worse*, even if it doesn't make it better.
      *   *Addressing Misconception #1 ("It's just about adding happy people"):* Stop here. Clarify that Mere Addition isn't the whole argument. It just gets us to A+. The Repugnant Conclusion requires *trading* quality for quantity later.
  *   **Step 3: The Egalitarian/Total Utility Slide (The Ramp).**
      *   *Scenario:* Move from **State A+** to **State B**.
      *   *Logic:* In A+, you have inequality (originals vs. new). In State B, we redistribute resources to make everyone equal. The originals lose a tiny bit of welfare (10/10 $\to$ 9.9/10), but the total welfare goes up because there are more people.
      *   *Premise:* A more equal distribution with higher total welfare is better than an unequal one.
      *   *The Loop:* Repeat this logic. B $\to$ C $\to$ D...
      *   *Visual:* Draw a staircase on the board. Each step down in *average* welfare is imperceptible, but each step up in *population* is significant.
  *   **Step 4: Arriving at Z.**
      *   Because each step is "better than" the last (by the premises), and "Better Than" is transitive, **State Z must be better than State A.**

  #### **3. Interrogating the Premises (0:25–0:35)**
  *   **Goal:** Show that the "Repugnance" comes from the conflict between our intuition (A > Z) and our premises (A < Z).
  *   **Addressing Misconception #2 ("This only bothers Utilitarians"):**
      *   *Timing:* Do this now, while discussing the premises.
      *   *Point:* Students often think this is a "Total Utilitarianism" problem. Correct them.
      *   *Script:* "If you think this is just a gotcha for Utilitarians, look at the premises. Premise 1 is logic (Transitivity). Premise 2 is about harm (Mere Addition). Premise 3 is about equality/total good. You can be a Kantian or a Virtue Ethicist; if you accept these three premises, you get the Repugnant Conclusion. It is a problem for *any* theory that wants to say Z is worse than A while accepting that small trade-offs are good."
  *   **Activity:** Ask students: "To avoid the conclusion, which step in the ship's log do you reject?"
      *   Reject Transitivity? (Logic breaks).
      *   Reject Mere Addition? (Implies adding happy people makes things worse).
      *   Reject the Trade-off? (Implies we should prioritize quality so heavily that we ignore total welfare).

  #### **4. Why This Matters (0:35–0:45)**
  *   **Goal:** Move from "Puzzle" to "Problem."
  *   **Discussion:** Why do we care? It's not about space ships.
  *   **Application:** Climate Policy & Future Generations.
      *   If we accept the logic of the Slide, should we prioritize a future with billions of people living subsistence lives over a smaller future population with high flourishing?
      *   If we reject the Slide, are we being "elitist" about who counts as a valuable life?
  *   **Key Takeaway:** The argument forces us to choose between our intuition about *quality* of life and our intuition about *quantity* of life. We cannot keep both without contradiction.

  #### **5. The Closing Assessment (0:45–0:50)**
  *   **The Question:** Do not ask "Is the conclusion repugnant?" (That's opinion). Do not ask "How do we solve it?" (That's too hard).
  *   **Ask this:**
      > "If you insist that State A (The Launch) is morally better than State Z (The Arrival), **which specific premise in the chain are you forced to reject, and what is the counter-intuitive cost of rejecting that specific premise?**"
  *   **What to look for in answers:**
      *   *Good:* "I have to reject Mere Addition, which means I have to admit that adding happy people can make the world worse."
      *   *Good:* "I have to reject Transitivity, which means my moral ranking system is intransitive."
      *   *Bad:* "I just think Z is gross." (Misses the structural point).
      *   *Bad:* "We should use Average Utilitarianism." (Didn't answer which premise is rejected/cost).

  ---

  ### **What to Leave Out (And Tell Them Why)**
  *   **The Non-Identity Problem:**
      *   *Say:* "We are leaving this out because the Non-Identity Problem is about *who* exists. The Repugnant Conclusion holds even if we assume the same people exist or that identity isn't the issue. Mixing them confuses the structural logic of the 'Slide'."
  *   **Specific Solutions (Critical-Level Utilitarianism, Person-Affecting View):**
      *   *Say:* "There are dozens of technical solutions proposed by philosophers. We aren't covering them because this section is about understanding the *trap*, not escaping it. If you don't feel the trap snapping shut, the solutions won't make sense."
  *   **The Sadistic Conclusion:**
      *   *Say:* "This is a related paradox involving suffering. It's too complex for today. Master the Repugnant Conclusion first; the Sadistic Conclusion is its evil twin for next month."

  ### **TA Tips for Delivery**
  *   **Board Work:** Keep the "Staircase" visible the whole time. Draw arrows between A $\to$ A+ $\to$ B $\to$ C... $\to$ Z.
  *   **Tone:** Be slightly uncomfortable. If you present it dryly, they won't feel the "Repugnance." Acknowledge that Z sounds terrible, then show them why their own logic demands they call it "Good."
  *   **Check Understanding:** At minute 25, ask: "Is there a step on this staircase where you'd say 'Stop, the next step is worse'?" If they say yes, ask them to pinpoint *exactly* where the trade-off becomes unacceptable. This highlights the arbitrariness of stopping the slide.
