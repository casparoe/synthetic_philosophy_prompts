prompt: |-
  I'm a third-year in a population ethics seminar and I have to run next week's 50-minute section on the repugnant conclusion. The proff wants us to teach the structure of the argument, not just state it. Plan how I should explain it: what has to come first so the conclusion feels like it falls out of the premises instead of being a trick, what single carrying example to use (she's tired of the standard small-happy-population vs huge-mildly-happy-population setup, so I want something fresh but not obscure -- maybe a generation ship that can either keep a small crew very happy or breed a huge population of just-barely-content descendants?), the misconceptions the class will bring (I'm guessing 'this only bothers utilitarians' and 'it's just about adding happy people'), where in the sequence to head each one off, and one question I can ask at the end to see if they got why the argument is a problem rather than just a puzzle. Also tell me what to leave out at this level and say so. American English, please.
