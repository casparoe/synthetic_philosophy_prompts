answer: |-
  Your mate has served you a classic philosophical cocktail: **Thomson's Lamp**, originally proposed by James Thomson in 1954. It's designed to feel like a paradox, but the logical machinery is actually quite brittle. You're right to feel it proves too much; if the argument held water, it would break calculus, kinematics, and the very concept of a limit.

  You should throw out **Step (3)**.

  ### Why Step (3) Looked Fine
  Step (3) relies on a principle of **local causal continuity**: *The state of a system now is determined by the last thing that happened to it.* In ordinary life, this is rock solid. If you flip a light switch and walk away, the lamp stays in the state that switch left it in. If you flip it again, the new state overrides the old one. Your intuition expects a causal chain where every link passes the baton to the next. Step (3) assumes this baton-passing requires a *final* handoff to determine the state at the finish line.

  ### The Real Flaw
  The flaw is assuming that a process defined on an open interval (before noon) logically dictates the state at the boundary point (noon) without an explicit rule for the limit.
  Mathematically, the lamp's state function is a square wave oscillating between 0 and 1 as $t \to \text{noon}$. This function has **no limit**. In analysis, if a function has no limit at a point, the value at that point is **underdetermined** by the function's behavior approaching the point.
  Step (3) falsely equates "determined by history" with "determined by the *last* event in history." When there is no last event, the history constrains the path but does not fix the destination. The state at noon is a separate physical fact not entailed by the flicks prior to noon.

  ### The Cost: Indeterminacy
  Rejecting (3) costs you the intuition that the past *always* fully determines the future at every instant. You must accept that at a "supertask singularity," the physical description is incomplete. The lamp *will* be on or off (keeping Step 1), but the sequence of flicks doesn't tell you which. Nature isn't obligated to provide a value where the math doesn't converge. This isn't a logical contradiction; it's a descriptive gap.

  ### Does This Save the Halting Problem?
  Yes, and it kills your mate's super-computer in the same blow.
  Your mate claims a machine can run infinitely many steps and "read off" the result. This assumes the machine's output state at noon is determined by the computation steps prior to noon.
  By rejecting (3), you assert that the infinite computation **does not determine the output state**. The machine might halt, it might loop, but at noon, its register is physically underdetermined by those operations. To make it a computer, you'd need to add a *new physical law* specifying the limit state (e.g., "Register is 1 if the machine ever halted, 0 otherwise"). But that's not a result of the computation; it's an external rule you pasted on. Without that extra rule, the output is noise, and the Halting Problem remains undecidable.

  ### Zeno and Continuous Processes
  This fix distinguishes the lamp from Zeno's runner. The runner's position is a **continuous** function of time; the limit exists ($\lim_{t \to 1} \text{pos}(t) = \text{pos}(1)$). Continuity bridges the gap that Step (3) tries to jump. The lamp is discontinuous. Rejecting (3) preserves continuous physics while blocking discontinuous supertasks from having determined outcomes.

  ### Summary
  The argument isn't that supertasks are logically impossible, but that the specific setup is **physically incomplete**. The contradiction arises only if you demand the past dictate the limit without a convergence rule.

  Verdict: step (3) — limit state underdetermined
