prompt: |-
  I chair the ethics committee at a hospital that has just approved a first-in-human trial of a gradual-replacement neural prosthesis. Over roughly a year of scheduled sessions, implanted modules take over the function of small regions of a patient's cortex, and if the process runs to completion the patient's mental life would in principle continue on entirely synthetic hardware. Our consent forms, our advance-directive policy, and our rules about who may authorize withdrawal all presuppose a single continuous person whose wishes track across the whole trial, and the protocol as written makes that presupposition difficult even to state precisely; two committee members have already begun arguing about it. Please write a decision procedure the committee can actually run on individual cases: the questions to ask, in order, what counts as an adequate answer to each, where the procedure terminates in a decision, and where it must hand the matter to the committee as a policy choice rather than a finding about persons. Ground the steps in whatever the philosophical work on personal identity and on what matters in survival genuinely supports, keep them usable by the clinicians and lawyers who will be voting, and mark plainly where that work underdetermines the answer. Then run the procedure on three cases: a patient two thirds of the way through who insists that the person who signed the consent form was someone else and asks to stop, knowing that stopping now is probably fatal; a patient whose completed successor requests life support that her own advance directive, written beforehand, refused; and a proposed amendment that would run the process on two separated hemispheres in parallel, yielding two candidates who each remember signing the form, under trial rules that let each participant count once. Tell me where the procedure returns an answer I will not like, and what it cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a hospital ethics committee.
      *   **Context:** First-in-human trial of a gradual-replacement neural prosthesis (Ship of Theseus style mind uploading).
      *   **Problem:** Current ethical/legal frameworks (consent, advance directives, withdrawal authorization) presuppose a single continuous person. The technology challenges this presupposition.
      *   **Task:** Write a *decision procedure* for the committee to run on individual cases.
          *   Must include: Questions to ask (in order), criteria for adequate answers, termination points (decision vs. policy choice).
          *   Must be grounded in: Philosophical work on personal identity and survival (Parfit, Locke, Psychological Continuity, etc.).
          *   Must be usable by: Clinicians and lawyers (practical, not overly abstract).
          *   Must mark: Where philosophy underdetermines the answer (uncertainty).
      *   **Application:** Run the procedure on three specific cases:
          1.  *Mid-trial Dissent:* Patient 2/3 through claims they aren't the signer, wants to stop (fatal).
          2.  *Post-trial Conflict:* Completed successor wants life support; original advance directive refused it.
          3.  *Fission Case:* Proposed amendment for parallel hemisphere replacement (two successors).
      *   **Output Requirement:** Tell me where the procedure returns an answer I (the Chair) will not like, and what it cannot settle.

  2.  **Philosophical Grounding (The "Why"):**

      *   *Classical View (Locke):* Memory/Psychological continuity.
      *   *Reductionist View (Parfit):* "What matters" is Relation R (psychological connectedness/continuity), not strict identity. Identity might not hold in fission or gradual replacement.
      *   *Legal/Practical View:* We need a working definition of "person" for liability and rights, even if metaphysics is fuzzy.
      *   *Key Insight:* We cannot solve the metaphysics of personal identity. We must adopt a *pragmatic* framework that prioritizes safety, autonomy, and non-maleficence while acknowledging the uncertainty.
      *   *Strategy:* Use a "Staged Continuity Assessment." Don't ask "Are they the same person?" (Metaphysical). Ask "Is the continuity sufficient to bind the prior will to the current state?" (Normative/Functional).

  3.  **Drafting the Decision Procedure (The "How"):**

      *   *Goal:* Actionable steps.
      *   *Structure:*
          1.  Threshold Check (Is the tech functioning?).
          2.  Continuity Assessment (Psychological/Functional).
          3.  Interest Alignment (Do current wishes match prior wishes?).
          4.  Harm Assessment (What happens if we honor/deny?).
          5.  Decision/Referral.
      *   *Constraint:* Must distinguish between a *finding* (based on the procedure) and a *policy choice* (where philosophy runs out).

      *   *Refining the Steps:*
          *   Step 1: Functional Integrity. (Is the prosthesis working?)
          *   Step 2: Psychological Connectedness. (Memory, character, values.)
          *   Step 3: The "Critical Interest" Test. (Dworkin's distinction between experiential and critical interests.)
          *   Step 4: The Harm Threshold. (Risk of death vs. violation of autonomy.)
          *   Step 5: The Fission/Split Check. (One body/mind or two?)

      *   *Marking Underdetermination:* Explicitly state where the committee is making a *policy* decision because the metaphysics doesn't dictate one.

  4.  **Running the Cases:**

      *   *Case 1 (Mid-trial Dissent):*
          *   Continuity: High (2/3 replaced, likely remembers signing).
          *   Claim: "I am not that person."
          *   Conflict: Current autonomy vs. Prior consent (and survival).
          *   Procedure outcome: Likely honors current refusal (autonomy trumps prior consent in medical ethics usually), *but* the fatality makes it hard.
          *   *Unliked Answer:* The procedure might force stopping the trial, killing the patient, because current competence overrides past consent in this specific framework. Or, it might force continuation, violating current autonomy. I need to choose the path that aligns with standard bioethics (Current Competent Refusal > Past Consent).
      *   *Case 2 (Post-trial Conflict):*
          *   Continuity: High (Completed).
          *   Conflict: Current wish (live) vs. Advance Directive (die).
          *   Procedure outcome: If psychological continuity is high, the AD usually holds *unless* the change in values is radical. If the successor is "new," the AD might not bind.
          *   *Unliked Answer:* If the procedure deems them "same enough," the AD holds, and the successor is turned off. If "different," life support continues against the original's will.
      *   *Case 3 (Fission/Parallel):*
          *   Continuity: Both have it.
          *   Rule: "Each participant counts once."
          *   Problem: One consent form, two entities.
          *   Procedure outcome: This is a policy gap. The procedure must flag this as "Underdetermined."
          *   *Unliked Answer:* The procedure will likely say "Cannot approve without new policy."

  5.  **Refining the Output (Self-Correction/Critique):**

      *   *Critique:* Is this too abstract?
      *   *Fix:* Make the questions Yes/No or Scaled. Make the "Referral" points clear.
      *   *Critique:* Did I address Parfit?
      *   *Fix:* Explicitly mention Relation R in the grounding.
      *   *Critique:* Did I answer the "Unliked Answer" prompt?
      *   *Fix:* Ensure the conclusion explicitly highlights the friction points.

      *   *Specific Tweak on Case 1:* Standard bioethics says a competent patient can withdraw *at any time*. If the patient says "I'm not the signer," they are refusing treatment. If stopping is fatal, that's a refusal of life-sustaining treatment. The committee usually *must* honor competent refusal. This might be the "unliked" answer because it kills the trial subject and wastes the research.
      *   *Specific Tweak on Case 3:* Fission breaks the "One Person" assumption entirely. The procedure *must* punt this to policy.

  6.  **Finalizing the Structure:**

      *   **Introduction:** Acknowledge the gravity and the philosophical stance (Parfitian Reductionism).
      *   **The Procedure (PCP-1):** The "Personal Continuity Protocol."
      *   **Application to Cases:** Walk through 1, 2, and 3.
      *   **The "Unliked" & "Unsettled":** Explicit section at the end.

  7.  **Drafting the Content (Mental Check of Philosophical Nuance):**
      *   *Locke:* Memory.
      *   *Parfit:* What matters is survival, not identity.
      *   *Dworkin:* Critical interests (values) vs. Experiential interests (pleasure/pain).
      *   *Legal:* Competence is decision-specific.
      *   *Synthesis:* We treat "Identity" as a gradient for the sake of the protocol, but a binary for legal liability.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Philosophy is hard." I need to give them a tool. The tool should prioritize *current* mental state competence unless there is a compelling reason to bind them to the past, *except* where the past self made a decision specifically about the transformation of the self. This is the "Ulysses Contract" problem.

      *Revised Strategy for Procedure:*
      1.  Assess Current Competence.
      2.  Assess Psychological Continuity (The "Overlap").
      3.  Assess the Nature of the Conflict (Values vs. Survival).
      4.  Determine Bindingness.

      *Wait, the prompt asks for a procedure the committee can run.* It needs to be step-by-step.
      *Step 1: Competence.*
      *Step 2: Continuity Gradient.*
      *Step 3: The "Ulysses" Clause (Did the original consent anticipate this objection?)*
      *Step 4: Harm/Benefit.*
      *Step 5: Decision or Referral.*

      *Let's refine the "Unliked" part.* The Chair likely wants the trial to succeed and patients to survive. The procedure might mandate letting a patient die (Case 1) or keeping a "corpse" on life support (Case 2). I need to be honest about that.

  8.  **Final Polish:** Check tone. Professional, ethical, precise. Ensure the distinction between "Finding" and "Policy Choice" is bolded or highlighted.

      *(Final thought on Case 3)*: The prompt says "trial rules that let each participant count once." If fission happens, do we have 1 participant becoming 2? Or does the trial break? The procedure should flag this as a violation of the "One Person" presupposition of the rules.

      *Okay, ready to write.*
answer: |-
  ### **Protocol for Personal Continuity and Agency Assessment (PCP-1)**

  **Preamble:** This procedure is not a metaphysical test for "souls" or strict identity. It is a risk-management and autonomy tool grounded in **Parfitian Reductionism**. We accept that "personal identity" may not be a deep further fact but a matter of degree (psychological connectedness and continuity). Where the philosophy underdetermines the outcome (i.e., where Relation R holds but legal identity is fuzzy), this protocol defaults to **non-maleficence** and **current competent autonomy**, unless a specific "Ulysses Contract" (binding future self) was explicitly validated.

  **Usage:** To be run by the Ethics Committee (EC) upon any trigger event regarding withdrawal, consent validity, or post-trial status.

  ---

  #### **Step 1: Current Competence Assessment**
  *   **Question:** Does the current entity (patient or successor) meet standard clinical criteria for decision-making capacity regarding the specific decision at hand (e.g., withdrawal, life support)?
  *   **Adequate Answer:** A clinical evaluation confirming understanding of consequences, reasoning ability, and stability of choice.
  *   **Termination:**
      *   **No:** Proceed to Step 2 (Surrogate/Advance Directive analysis).
      *   **Yes:** Proceed to Step 2 (To weigh current autonomy against prior commitments).

  #### **Step 2: Psychological Continuity Gradient (The "Overlap" Test)**
  *   **Question:** What is the degree of psychological connectedness (memory, character, values) between the Original Signer (OS) and the Current Entity (CE)?
  *   **Adequate Answer:** A scored assessment (0–100%) based on:
      1.  *Autobiographical Memory:* Does CE remember signing the form?
      2.  *Value Stability:* Do CE's core moral/political values match OS?
      3.  *Character Traits:* Are temperament and personality recognizable?
  *   **Thresholds:**
      *   **High (>80%):** Presume continuity of agency.
      *   **Moderate (40–79%):** Continuity is contested; proceed to Step 3.
      *   **Low (<40%):** Presume discontinuity of agency; OS wishes are advisory only.
  *   **Underdetermination Mark:** *Philosophy does not specify the cutoff for "same person." This threshold is a policy choice by the EC.*

  #### **Step 3: The "Ulysses" Validation**
  *   **Question:** Did the Original Signer explicitly anticipate and authorize the specific conflict now arising (e.g., "I consent even if my future self wants to stop")?
  *   **Adequate Answer:** Specific clause in the consent form or advance directive acknowledging the potential for psychological shift and waiving the right of the future self to override.
  *   **Termination:**
      *   **Yes:** Prior consent binds (unless Step 4 triggers).
      *   **No:** Current competent refusal overrides prior consent.

  #### **Step 4: The Harm Threshold (Non-Maleficence)**
  *   **Question:** Does honoring the Current Entity's wish result in immediate, irreversible, and severe harm (e.g., death) that the Original Signer specifically sought to avoid?
  *   **Adequate Answer:** Clinical prognosis of outcome if CE's wish is honored vs. if OS's wish is honored.
  *   **Termination:**
      *   **If CE wants to stop & outcome is fatal:** EC must vote. Default is to honor CE (Right to Refuse Treatment), *unless* Step 3 (Ulysses) was validated.
      *   **If CE wants life & AD refuses:** EC must vote. Default is to honor AD (Right to Die), *unless* Step 2 (Continuity) is Low.

  #### **Step 5: Structural Integrity Check (Fission/Fusion)**
  *   **Question:** Does the current configuration involve one mind/body or multiple distinct centers of consciousness claiming the same identity?
  *   **Adequate Answer:** Neurological confirmation of unified vs. divided processing.
  *   **Termination:**
      *   **One:** Proceed to Decision.
      *   **Multiple:** **HAND TO POLICY.** This procedure cannot adjudicate fission.

  ---

  ### **Application to Cases**

  #### **Case 1: The Mid-Trial Dissenter**
  *   **Status:** Patient 2/3 through replacement. Competent. Claims "I am not the signer." Wants to stop (fatal).
  *   **Step 1 (Competence):** **Yes.** Patient understands stopping is fatal.
  *   **Step 2 (Continuity):** **High (>80%).** Memory of signing is intact; psychological traits are stable despite hardware swap.
  *   **Step 3 (Ulysses):** **No.** Standard consent forms rarely include "I waive my future right to withdraw even if I feel like a different person."
  *   **Step 4 (Harm):** **Yes.** Stopping is fatal.
  *   **Procedure Result:** **Honor Current Refusal.**
      *   *Reasoning:* In the absence of a validated Ulysses clause, current competent autonomy overrides prior consent, even if continuity is high. The right to refuse bodily intrusion is immediate.
      *   *Outcome:* Trial halted for this patient. Patient likely dies.
      *   *Underdetermination:* We are prioritizing *current* liberty over *past* autonomy without a metaphysical guarantee they are different people.

  #### **Case 2: The Post-Trial Successor**
  *   **Status:** Trial complete (100% synthetic). Successor wants life support. Original AD refused it.
  *   **Step 1 (Competence):** **Yes.** Successor is articulate and rational.
  *   **Step 2 (Continuity):** **High (>80%).** By design, the trial ensures functional continuity.
  *   **Step 3 (Ulysses):** **Yes.** Advance Directives are inherently Ulysses contracts regarding end-of-life care.
  *   **Step 4 (Harm):** **Yes.** Honoring CE means continuing treatment against OS's explicit values. Honoring OS means terminating CE.
  *   **Procedure Result:** **Honor Advance Directive.**
      *   *Reasoning:* High continuity binds the successor to the critical interests of the OS. The OS's right to determine the end of their life narrative outweighs the successor's experiential interest in continuing.
      *   *Outcome:* Life support withdrawn. Successor "dies."
      *   *Underdetermination:* If the successor argues they are a *new* being with a right to life, the procedure overrides this based on the High Continuity score. This assumes psychological continuity is sufficient for moral responsibility regarding death.

  #### **Case 3: The Fission Amendment**
  *   **Status:** Proposed parallel hemisphere replacement. Two candidates, both remember signing.
  *   **Step 1 (Competence):** **Yes** (Both).
  *   **Step 2 (Continuity):** **High** (Both).
  *   **Step 3 (Ulysses):** **N/A.**
  *   **Step 4 (Harm):** **N/A.**
  *   **Step 5 (Structural Integrity):** **Multiple.**
  *   **Procedure Result:** **HAND TO POLICY.**
      *   *Reasoning:* Step 5 triggers an immediate referral. The protocol presupposes a 1:1 mapping of person to consent. Fission creates a 1:2 mapping.
      *   *Outcome:* Trial amendment cannot be approved under current rules.
      *   *Underdetermination:* Philosophy (Parfit) suggests both are equally the "survivor" of the original, but legal/ethical frameworks (one consent = one participant) break. We cannot decide if one is the "real" patient or if both are, or if the original ceased to exist and two new ones were born.

  ---

  ### **Where the Procedure Returns an Answer You Will Not Like**

  **Case 1 (The Mid-Trial Dissenter):**
  You will not like this because it sacrifices the research subject and potentially invalidates the data set for the trial. The procedure forces you to let a competent patient die (by withdrawal) even though the "person" who consented is psychologically continuous with the one refusing.
  *   **Why:** Bioethics prioritizes *current* bodily autonomy over *past* consent unless explicitly waived. By failing to draft a "Ulysses Clause" in the consent form that specifically addresses identity shift, the committee has left itself no ethical ground to force continuation. You are forced to choose between killing the patient (by stopping) or battery (by continuing). The procedure chooses "no battery," resulting in death.

  **Case 2 (The Post-Trial Successor):**
  You will not like this because it requires the active termination of a functioning, conscious, rational being who wants to live.
  *   **Why:** The procedure treats the Advance Directive as binding based on High Continuity. If the committee feels the synthetic successor is a "new life," this procedure kills it. If the committee feels it is the "old life," this procedure honors the old life's wish to die. There is no middle ground. The "unliked" aspect is the moral residue of turning off a begging patient.

  ### **What the Procedure Cannot Settle**

  **Case 3 (Fission) is the Hard Limit.**
  The procedure explicitly flags this as a **Policy Choice**, not a finding.
  *   **The Metaphysical Gap:** Reductionist philosophy (Parfit) says identity doesn't matter; survival matters. Both hemispheres survive. But our legal system is built on *identity* (one person, one vote, one consent).
  *   **The Policy Void:** You cannot run this trial amendment without answering:
      1.  Does the original consent cover *two* legal entities?
      2.  If one hemisphere commits a crime, is the other liable?
      3.  If one wants to stop and the other doesn't, whose vote counts?
  *   **Recommendation:** Do not approve the amendment. The hospital's liability insurance and the Nuremberg/Declaration of Helsinki frameworks presuppose singular agency. To proceed requires new legislation or a regulatory waiver, not an ethics committee decision procedure.

  ### **Final Note to the Chair**
  This procedure protects the committee from accusations of arbitrary metaphysical speculation by grounding decisions in **clinical competence** and **documented prior intent**. However, it exposes the fragility of your current consent forms. If you wish to avoid the "Unliked" outcome in Case 1, you must rewrite the consent form to include a **Specific Identity-Waiver Clause**, subject to a separate, heightened consent process. Without that, the procedure leaves you no choice but to honor the voice in the room, even if it speaks against the signature on the page.
