answer: |-
  **Memorandum: Desiderata for a Theory of Simpson's Reversal**

  **To:** The Reading Group
  **From:** [Your Name]
  **Subject:** Specifications for Resolving Simpson's Paradox

  You have asked to begin not with the kidney stones or the Berkeley admissions, but with the specification itself. This is the prudent course. If we cannot agree on what a solution *ought* to do, we shall merely talk past one another whilst waving contingency tables.

  Below is a draft of the requirements any adequate theory must meet to tell us, given a pooled table and its sub-tables, which summary we are entitled to act upon. I have distinguished between those requirements that are non-negotiable (NN) for any theory claiming to guide action, and those that represent camp preferences (CP) regarding the philosophy of statistics.

  ***

  ### I. The Desiderata

  **1. Causal Admissibility (NN)**
  *The Case:* The theory must distinguish between partitions defined by events preceding the treatment and those following it.
  If we partition by a variable $Z$ that is a *consequence* of the treatment $X$ (a mediator or a collider), conditioning on $Z$ induces bias. A theory that tells us to "always condition on the finest partition" fails here, as it would instruct us to block the very causal pathway we wish to measure, or to open a spurious back-door path. An adequate theory must forbid conditioning on post-treatment variables when estimating total causal effect, even if the reversal disappears upon doing so.

  **2. Decision Determinacy (NN)**
  *The Case:* The theory must return a verdict.
  For a given dataset and context, the theory cannot remain agnostic. It must state whether the pooled association or the partial associations represent the correct basis for intervention. A theory that concludes "it depends on unmeasured factors" without specifying *which* factors are required is failing to provide a decision procedure. It must tell the agent whether to administer the treatment or not.

  **3. Scale Invariance (CP)**
  *The Case:* The theory must address the fact that reversals are measure-dependent.
  A reversal may appear in Risk Differences but vanish in Odds Ratios (or vice versa). A strict theory ought to specify which scale is the 'true' metric of effect. If a theory claims the pooled data is correct, but only under the Risk Difference scale, it must justify why that scale is privileged over the Odds Ratio. Some camps argue the verdict should hold regardless of the monotonic transformation of the effect measure; others accept that 'effect' is scale-relative.

  **4. Psychological Dissolution (CP)**
  *The Case:* The theory must explain why the reversal appears paradoxical.
  Is the paradox merely a failure of intuition (a cognitive illusion), or is it a logical tension within probability theory itself? A theory that simply says "trust the causal graph" dissolves the paradox by changing the subject to causality. A more ambitious theory would explain why the arithmetic of probabilities tempts us into the error in the first place. Does the theory owe us an account of the *surprise*, or merely the *correct answer*?

  **5. Individual Coherence (CP)**
  *The Case:* The theory must relate aggregate verdicts to individual mechanisms.
  Simpson's paradox is a phenomenon of aggregates; no individual experiences a reversal (one either recovers or one does not). However, if the theory recommends acting on the pooled data, it implies a claim about the average individual. If the sub-population data suggests the treatment harms every specific type of person, but the pooled data suggests it helps the 'average' person, the theory must clarify who is being helped. It must specify whether the verdict applies to a randomly selected individual or to the population as a collective entity.

  **6. Data Sufficiency (CP)**
  *The Case:* The theory should ideally rely only on the numbers in the table.
  Many practitioners wish for a purely statistical test—a mathematical property of the contingency tables—that identifies the correct partition without requiring external causal knowledge. This is the hope of the 'orthodox' statistician: that the data should speak for itself.

  ***

  ### II. The Incompatibility Theorem

  You suspected there is a pair of requirements that cannot be satisfied together. You are correct. There is a fundamental tension between **Causal Admissibility (1)** and **Data Sufficiency (6)**.

  **The Conflict:**
  It is impossible to construct a theory that satisfies both *Causal Admissibility* and *Data Sufficiency*.
  *   **Reasoning:** To know whether a partition variable $Z$ is a confounder (pre-treatment) or a mediator/collider (post-treatment), one requires knowledge of the temporal or causal ordering of variables. This information is *not* contained in the joint probability distribution (the numbers in the table). Two distinct causal structures can generate identical contingency tables. In one structure, the pooled data is correct; in the other, the partitioned data is correct.
  *   **Verdict:** Any theory that claims to resolve Simpson's Paradox using *only* the numbers in the table (satisfying 6) must necessarily fail to distinguish between pre- and post-treatment partitions (violating 1). Conversely, any theory that guarantees Causal Admissibility (satisfying 1) must import information external to the table (violating 6).

  *This is the non-negotiable trade-off.* You may have a purely arithmetical rule, or you may have a causally correct rule, but you cannot have both.

  ***

  ### III. Evaluation of Current Families of Answers

  Here is how the usual contenders fare against the specification above.

  **1. The Causal Graph Approach (e.g., Pearl, Spirtes, Glymour)**
  *   **Stance:** Condition on confounders, not mediators or colliders.
  *   **Performance:** Satisfies **Causal Admissibility (NN)** and **Decision Determinacy (NN)**. It explicitly rejects **Data Sufficiency (CP)**, acknowledging that extra-statistical assumptions are required. It is largely indifferent to **Scale Invariance (CP)**, focusing on the structural model.
  *   **Critique:** It dissolves the paradox rather than explaining the psychological surprise. It tells you *what* to do, but treats the 'paradox' as a category error (mixing causal and associational questions).

  **2. The Probabilistic/Bayesian Approach (e.g., Good, Savage)**
  *   **Stance:** Use prior probabilities or likelihood ratios to weigh the partitions.
  *   **Performance:** Attempts to satisfy **Data Sufficiency (CP)** by treating the problem as one of confirmation or betting quotients. However, it often struggles with **Causal Admissibility (NN)**. Without hard constraints on the DAG, a Bayesian update can still lead an agent to condition on a collider if the priors are ill-specified.
  *   **Critique:** It handles the **Psychological Dissolution (CP)** well (framing it as a failure of confirmation logic) but risks violating the **Individual Coherence (CP)** if the priors do not reflect the underlying mechanism.

  **3. The 'Condition on Everything' Heuristic (Orthodox Stratification)**
  *   **Stance:** Always trust the finer partition; the pooled data is 'biased'.
  *   **Performance:** Fails **Causal Admissibility (NN)** catastrophically. If the partition is defined by a post-treatment variable (e.g., blood pressure after taking a drug), this rule instructs you to block the causal effect.
  *   **Critique:** It satisfies **Data Sufficiency (CP)** but yields the wrong action in mediator cases. It is mathematically tidy but causally dangerous.

  ***

  ### IV. Self-Reflection

  **What would change my mind about this list?**
  I would revise the **Non-Negotiable** status of *Causal Admissibility* if it were demonstrated that a purely statistical metric (perhaps based on higher-order interactions or information geometry) could reliably predict the stability of an effect across environments without causal input. If one could prove that 'stable' partitions possess a distinct arithmetic signature detectable in the table alone, then *Data Sufficiency* could be elevated to Non-Negotiable, and *Causal Admissibility* would become a derivative property rather than a prerequisite. At present, I deem this impossible, but a proof to the contrary would upend the specification.

  **Where is my reasoning most likely to be wrong?**
  I am likely too dismissive of the **Psychological Dissolution (CP)** requirement. I have treated the 'paradox' as a mere bug in human intuition to be patched by causal calculus. However, it is possible that the tension is not merely psychological but reflects a genuine ambiguity in the concept of 'probabilistic causality' itself. If the notion of 'cause' is inherently scale-dependent or context-sensitive in a way that DAGs do not capture, then my insistence on a single determinate verdict (**Decision Determinacy**) may be the error. It may be that the correct theory is one that admits indeterminacy, telling us that sometimes the data simply does not speak, rather than forcing a decision via external assumptions.

  I look forward to discussing this with you.

  Yours,

  [Your Name]
