prompt: |-
  I'm putting together a reading-group session on Simpson's paradox and I'd rather start from the spec than from the examples. Write me the desiderata any adequate theory of "which way the data goes" has to meet — an account that tells me, for a given pooled table plus the subpopulation tables behind it, which summary I'm entitled to act on. I want each requirement with the case behind it. In particular: what it has to do about partitions defined by things that happen after the treatment rather than before it; whether it has to explain why the reversal looks paradoxical in the first place or just dissolve the appearance; what it owes to the fact that a reversal can show up under one way of measuring the effect and vanish under another (risk differences versus odds ratios, say); and whether it has to say anything about individuals at all, given that the reversal is between summaries and not between people. Mark which requirements are non-negotiable and which are just preferences of one camp, and flag any pair that can't be satisfied together — I suspect theres at least one, something like "returns a determinate verdict for every table" versus "assumes nothing beyond the numbers in the table". That's the part I most want to see. Then say briefly how the usual families of answers (condition on everything measured before the treatment, condition on nothing, condition on whatever happens to have been recorded) fare against the list. Finish by telling me which consideration would change your mind about the list you've given, and where your own reasoning is most likely to be wrong. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Simpson's Paradox (SP).
      *   **Goal:** Create a list of desiderata (requirements) for a theory that resolves SP (tells you which summary to act on).
      *   **Starting Point:** Start from the specification (desiderata), not examples.
      *   **Specific Issues to Address:**
          *   Post-treatment vs. pre-treatment partitions.
          *   Explanation vs. Dissolution of the "paradox".
          *   Scale dependence (risk difference vs. odds ratio).
          *   Individual vs. Aggregate level.
      *   **Formatting/Constraints:**
          *   Mark requirements as Non-Negotiable (NN) vs. Camp Preferences (CP).
          *   Flag incompatibilities (Impossibility Theorems/Trade-offs).
          *   Evaluate usual families of answers against the list.
          *   End with: What would change my mind? Where is my reasoning likely wrong?
          *   **Tone/Style:** British English.
          *   **Audience:** Reading-group session (needs to be rigorous, philosophical, yet accessible enough for discussion).

  2.  **Deconstruct Simpson's Paradox:**
      *   What is it? $P(Y|X) > P(Y|\neg X)$ but $P(Y|X, Z) < P(Y|\neg X, Z)$ for all $Z$.
      *   The core problem: Which association represents the causal effect?
      *   The "Spec": A theory needs to tell an agent *what to do* given the data structure.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Actionability.* The theory must yield a decision.
      *   *Requirement 2: Causal Integrity.* It must distinguish cause from correlation. (This brings in the pre/post-treatment issue).
      *   *Requirement 3: Scale Invariance?* Does the reversal persist across measures? (Blyth's insight).
      *   *Requirement 4: The "Paradox" aspect.* Do we need to explain the psychology or just fix the math?
      *   *Requirement 5: Individual vs. Group.* Ecological fallacy concerns.

      *Refining for the Prompt's Specifics:*
      *   *Post-treatment:* If $Z$ is a collider or mediator, conditioning is bad. Theory must handle this.
      *   *Explanation vs. Dissolution:* Is it a logical error or a causal error?
      *   *Scale:* Risk difference can reverse while Odds Ratio doesn't (or vice versa). Theory must pick a scale or justify one.
      *   *Individuals:* SP is aggregate. Does the theory need to map to individual causality?

  4.  **Identifying Incompatibilities (The "Hard Part"):**
      *   The prompt suspects a conflict between "determinate verdict for every table" and "assumes nothing beyond the numbers".
      *   *Confirmation:* This is the core of the Pearl vs. Pure Statistics debate. You cannot resolve SP with probabilities alone; you need causal assumptions (DAGs).
      *   *Conflict:* "Data-only sufficiency" vs. "Causal Correctness".
      *   *Conflict:* "Scale Invariance" vs. "Universal Reversal". (Some scales reverse, some don't).

  5.  **Structuring the Response:**
      *   **Introduction:** Set the stage (British English, formal but engaging).
      *   **The Desiderata List:** Categorized by NN and CP.
      *   **The Incompatibility Theorem:** Highlight the tension explicitly.
      *   **Evaluation of Current Approaches:** Causal (Pearl), Probabilistic (Good/Savage), Pragmatic.
      *   **Self-Reflection:** What would change my mind? Where am I wrong?

  6.  **Drafting Content - Section by Section (incorporating British English):**

      *   *Intro:* Acknowledge the ambition. Avoid diving into the kidney stone example immediately.
      *   *Desiderata:*
          1.  **Causal Admissibility (NN):** Must distinguish pre/post-treatment. (Addressing the collider/mediator issue).
          2.  **Decision Determinacy (NN):** Must say "Do X" or "Don't".
          3.  **Scale Robustness (CP):** Should the verdict hold across RD, RR, OR? (This is contentious).
          4.  **Psychological Dissolution (CP):** Must explain *why* it feels wrong, not just be right.
          5.  **Individual Coherence (CP):** Aggregate verdict shouldn't contradict individual mechanism (if known).
          6.  **Data Sufficiency (CP):** Ideally, solve it using only the contingency tables.
      *   *The Clash:* Data Sufficiency vs. Causal Admissibility. You can't have both. This is the "No Free Lunch" theorem for SP.
      *   *Evaluating Families:*
          *   *Causal (Pearl/Spirtes):* Hits NN, fails Data Sufficiency.
          *   *Probabilistic (Bayesian/Likelihood):* Hits Data Sufficiency, fails Causal Admissibility (sometimes).
          *   *Pragmatic (Just pool):* Fails NN.
      *   *Self-Correction:*
          *   *Change mind:* If a purely statistical metric could reliably predict causal direction without background knowledge (unlikely).
          *   *Wrong:* Maybe I'm too dismissive of the "paradox" as purely psychological. Maybe the mathematical tension *is* the point.

  7.  **Refining the Tone (British English Check):**
      *   Use "whilst", " amongst", "centre", "programme" (if applicable), "realise".
      *   Phrasing: "I dare say", "ought to", "shall", "colour".
      *   Avoid Americanisms like "gotten", "fallout", "input" (as a verb).

  8.  **Final Review against Constraints:**
      *   Start from spec? Yes.
      *   Each requirement with the case behind it? Yes.
      *   Post-treatment addressed? Yes (Causal Admissibility).
      *   Explanation vs. Dissolution? Yes (Psychological Dissolution).
      *   Scale dependence? Yes (Scale Robustness).
      *   Individuals? Yes (Individual Coherence).
      *   NN vs CP marked? Yes.
      *   Incompatibility flagged? Yes.
      *   Families evaluated? Yes.
      *   Change mind/Wrong section? Yes.
      *   British English? Yes.

  9.  **Final Polish:** Ensure the distinction between "Non-Negotiable" (logical/causal necessities) and "Camp Preferences" (philosophical stances) is clear. The "Incompatibility" section needs to be the highlight, as requested. (Self-correction: Ensure I explicitly mention the Risk Difference vs Odds Ratio issue in the Scale Robustness section).

  *(Self-Correction during drafting)*: I need to be careful not to simply assert Pearl is right. The prompt asks for desiderata for *any* adequate theory. I must present the tension fairly. The "Data Sufficiency" requirement is the one that usually breaks. I will frame the incompatibility as "The Arithmetical-Causal Gap".

