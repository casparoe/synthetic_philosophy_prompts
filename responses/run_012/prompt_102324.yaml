  1. The theory must permit the agent to deterministically select one option over another even when no reason favors one over the other. This is motivated by the Buridan's Ass case, where starvation implies that requiring a preferring reason for action leads to irrational outcomes. This is a preference of the arbitrary-choice camp; it collides with Item 3 because deterministic selection is exploitable in adversarial contexts, so I would surrender the universal permission in Item 1.

  2. The theory must represent a formal difference between options that are equally good and options that are neither better nor worse nor equal. This is motivated by the careers case, where small improvements resolve indifference but not parity, suggesting distinct underlying value structures. This is a preference of the incomparability camp; expected utility theorists will reject it as a violation of completeness, so it cannot be treated as a universal demand.

  3. The theory must prescribe randomized selection policies when deterministic tie-breaking rules render the agent vulnerable to exploitation. This is motivated by the adversarial variant, where an opponent can predict and manipulate any fixed rule for resolving ties to the agent's detriment. This is non-negotiable for successful action, though it conflicts with Item 1; I would surrender Item 1's permission for deterministic choice because vulnerability to sure loss is definitively irrational.

  4. The theory must treat the cost of delay as a decisive factor that can render further deliberation irrational even when options remain indistinguishable. This is motivated by the variant where starvation is caused by the ass's insistence on waiting for a reason rather than the tie itself. This is non-negotiable for bounded agents, but it conflicts with Item 1 if Item 1 is read as allowing choice regardless of deliberation costs; I would surrender the unconditional permission in Item 1 because rationality requires sensitivity to costs.

  5. The theory must specify whether the permission to choose arbitrarily extends equally to cases of indifference and cases of parity. This is motivated by the instructor's challenge to say whether the hay bales and the careers carry the same normative upshot despite their structural differences. This requirement does more than any other to eliminate otherwise attractive theories; it collides with Item 2 because maintaining a structural distinction often implies distinct normative upshots, so I would surrender the demand for uniformity to preserve the distinction.
