      *   *Response:* The hero's sword swing is *how* the author decided the hero wins.

      *   *Plan:*
          1.  Validate the user's intuition (Nadia is too quick).
          2.  Pinpoint Step 6 as the logical break (The Fallacy of Composition/Division).
          3.  Explain why Step 5 doesn't lead to Step 6 (Distinction between *selecting a world* and *causing events within it*).
