  11. **Final Polish:** Check against the four specific constraints in the prompt. (1. Arbitrariness, 2. Moral Weight/Accounts, 3. Thought Experiment, 4. Trajectory). Ensure the conclusion answers the "parasitic" and "gender" questions.

  *(Self-Correction Note)*: I need to make sure I don't talk down to the high school student. The prompt is very sophisticated. I should treat them as a junior colleague.

