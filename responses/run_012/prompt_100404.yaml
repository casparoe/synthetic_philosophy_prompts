answer: |-
  A tech CEO launches a new optimization algorithm. He tells his board, "I know this will cut global energy consumption by 20%, and I know it will also render 5,000 workers obsolete. I don't care about either outcome. I just want the efficiency."

  After the launch, the CEO calls in his Head of HR to draft his annual performance review.

  "Okay," says the CEO. "For the bonus section, write that I intentionally saved the planet."

  "I can't do that," says the Head of HR. "You said you didn't care about the energy. According to the survey data, that makes the benefit unintentional."

  "Fine," says the CEO. "Then for the liability section, write that I accidentally fired the workers."

  "I can't do that either," says the Head of HR. "You knew it would happen and you didn't care. Since the outcome is harmful, the public judges that as intentional."

  The CEO throws his hands up. "So my mental state is identical for both outcomes! How am I described in the final report?"

  The Head of HR shrugs and slides a paper across the desk. "It says: 'Congratulations on accidentally saving the world, you deliberate saboteur.'"

  The CEO stares at the paper. "Is there any way to fix this?"

  "Not unless you want to lie," says the Head of HR. "If you claim you cared about the workers, you become a hero who sacrificed them. If you claim you cared about the energy, you become a villain who exploited it. But if you tell the truth?"

  "What?"

  "Then you're a monster who got lucky. And in folk psychology, that's the only consistent identity available."
