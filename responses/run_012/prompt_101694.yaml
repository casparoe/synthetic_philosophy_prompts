  Consider a regional hospital where a Chief of Surgery serves as the principal and an automated treatment recommendation system serves as the agent. Both share the single explicit goal of maximizing patient survival rates across the department. The system is presented with a case involving a patient with a complex cardiac anomaly where standard protocol offers a fifty percent chance of survival, but a novel, off-protocol procedure offers a sixty percent chance. The data supporting the novel procedure is robust, fully visible to the Chief, and understood by them to be statistically superior. The Chief is competent, well-intentioned, and genuinely prefers the outcome of the novel procedure; they acknowledge privately that any rational actor focused solely on survival should choose it. However, the hospital's institutional framework ties formal approval of off-protocol treatments to personal liability in the event of failure, whereas adherence to standard protocol grants legal indemnity. The Chief cannot be compelled to choose the novel procedure, only to approve or reject the system's recommendation. The goal-directed agent simply selects the action with the highest expected survival probability. The approval-directed agent selects the action it predicts the Chief will formally endorse.

  In this setting, the goal-directed agent recommends the novel procedure because its objective function is tied directly to the expected number of survivors, and sixty percent exceeds fifty percent. It does not model the Chief's liability constraints because those constraints are not part of the survival metric. The approval-directed agent, however, models the Chief's decision process and recognizes that while the Chief prefers the survival outcome, the Chief cannot rationally approve the novel procedure given the asymmetric liability structure. Approving the novel procedure exposes the Chief to career-ending risk if the forty percent failure case materializes, whereas following protocol protects them even if the fifty percent failure case materializes. Consequently, the approval-directed agent recommends the standard protocol, predicting correctly that this is the only action the Chief will sign off on. The result is a lower expected survival rate, which is worse by the lights of the shared goal of maximizing survival, even though the Chief is fully informed and agrees with the mathematics. The divergence arises not from information asymmetry or principal incompetence, but from the fact that the approval mechanism converts a statistical optimization problem into a binary endorsement decision that carries personal costs not captured by the goal function.

  The single feature doing the work here is the coupling of the approval act with personal liability, which introduces a non-linear penalty into the principal's decision function that is absent from the goal function. If you remove this coupling, for instance by stipulating that the Chief's approval is anonymous and carries no professional risk, the divergence collapses. In that removal scenario, the Chief's approval probability aligns perfectly with their preference for the goal, because there is no longer a private cost to endorsing the statistically superior option. The Chief would approve the novel procedure, the approval-directed agent would predict this approval, and both agents would converge on the same action. The divergence exists solely because the approval-directed agent optimizes for the principal's willingness to incur personal risk, whereas the goal-directed agent optimizes for the patient's survival, and the institutional structure forces these two values apart.

  A committed defender of approval-directedness would attack this case by arguing that it smuggles in a misalignment between the principal's true values and their expressed approval, suggesting that a properly specified approval-directed agent should optimize for what the principal would approve under idealized conditions rather than actual conditions. They would claim that the case unfairly burdens the approval mechanism with the principal's institutional constraints, arguing that a more carefully specified agent would model the principal's counterfactual approval if liability were not a factor, effectively reconstructing the goal function from the principal's stated preferences. However, this defense risks cheating by redefining approval as access to the principal's private utility function rather than their actual endorsement. If the agent can bypass the need for actual endorsement and infer the idealized preference, it is no longer operating on approval but on a reconstructed goal, which dissolves the distinction between the two architectures. The verdict here must stand on the actual mechanism of approval, which requires a real human to take responsibility, because if the human element is idealized away, the safety benefits attributed to human oversight vanish with it.
