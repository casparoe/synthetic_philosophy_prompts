answer: |-
  The core tension here hinges on what Maimonides thinks human beings are capable of. On the diachronic reading, the accommodation is targeted at a specific historical habit: the Israelites were steeped in Egyptian and Sabian idolatry, where sacrifice was the only known language of worship. God couldn't ask them to jump straight to purely intellectual or prayer-based worship because that would have been psychologically impossible, like asking a prophet to convince people instantly that a donkey is a human. On the synchronic reading, the accommodation is targeted at a permanent feature of human psychology: the idea that humans *always* need material acts to connect with the divine, so sacrifice remains a valid, necessary channel forever. Maimonides leans heavily toward the diachronic view. He explicitly states that sacrifice was not the primary intention of the Law; the primary intention was prayer and intellectual apprehension of God. Sacrifice is a "divine ruse" to wean the people off idolatry by restricting it to one place, one priestly class, and one God, thereby draining the practice of its idolatrous power while keeping the people compliant.

  This makes the sacrificial laws primarily instrumental rather than intrinsic. They are a means to stabilize monotheistic belief, not the ultimate end of human perfection. This creates a tricky situation for the claim that the laws are eternally binding. If the law is perfect and eternal, how can it be based on a temporary historical concession? Maimonides resolves this by distinguishing between the stability of the Law and the ideal of worship. The Law remains binding because abolishing it would cause social chaos and religious backsliding (a synchronic constraint on *changing* the law), even if the *teleological goal* is to move toward higher forms of worship (a diachronic progression in *value*). So, the law is fixed, but its status is subordinate to prayer and knowledge. The accommodation is to human stubbornness, which is permanent enough to keep the law in place, even if the ideal is to outgrow the need for it.

  Think of it like a parent weaning a toddler off a bottle. The diachronic view is like a parent who knows water from a cup is the goal but allows the bottle for now because going cold turkey would cause dehydration (rejection of God). They might restrict bottle use to the high chair only (restricting sacrifice to the Temple) to control the habit. The synchronic view is like a parent who decides bottles are actually a healthy, permanent part of a grown adult's diet. Maimonides fits the first analogy: the bottle is a transitional scaffold. The twist is that God, knowing humans are prone to relapse, makes the "high chair rule" permanent in the legal code to prevent everyone from going back to drinking out of the toilet (idolatry), even if the philosophical ideal is to eventually drink water freely. The law stays, but the *purpose* of the law is to protect a system that aims higher than the law itself.

  \answer{diachronic, because sacrifice is a historical bridge to higher worship, not an intrinsic ideal}
