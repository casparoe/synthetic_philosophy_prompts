      *   *The Basic View:* God knew the Israelites were steeped in idolatrous sacrificial practices. Abrupt abolition would have been psychologically impossible (like a prophet claiming he could turn a donkey into a human). So, God allowed sacrifice but restricted it to one place, one priestly class, and one God.
      *   *Diachronic Element:* The *form* of worship (sacrifice) was a concession to the *past* (Egyptian/idolatrous habits). The *goal* was to move them toward prayer and intellectual worship.
      *   *Synchronic Element?* Maimonides generally sees the Law as perfect and eternal. However, he explicitly states that sacrifice was not the *primary* intention of God. The primary intention is prayer and obedience.
      *   *Tension:* If the Law is eternal, how can a commandment be merely a historical concession? Maimonides resolves this by distinguishing between the *primary intention* (worship of God without material intermediaries) and the *secondary intention* (accommodating human weakness to ensure compliance).
      *   *Key Distinction:* Is the need for sacrifice permanent in human nature, or was it specific to that historical moment? Maimonides leans heavily toward the historical specificities of the ancient Near East. He suggests that in the Messianic era, sacrifices might cease (though this is debated, his logic in the Guide points toward the primacy of prayer).
      *   *Instrumental vs. Intrinsic:* For Maimonides, sacrifices are instrumental to weaning off idolatry and maintaining social order under the Law. They are not intrinsically the highest form of worship (intellectual apprehension is).
      *   *Eternal Bindingness:* This is the tricky part. Halakhically, sacrifices are binding until the Temple is rebuilt. Philosophically, Maimonides suggests they are a "divine ruse" to achieve a higher end. The eternal bindingness is tied to the stability of the Law, but the *value* of the commandment is subordinate to the ultimate goal of knowing God.

