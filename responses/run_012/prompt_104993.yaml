          *   *Application:* The app architecture scripts the tenant as subordinate and the landlord as overseer.
      *   *Claim 5: The Agency View (ANT).* Non-humans are actors in the network.
          *   *Analysis:* The thermostat participates in the power dynamic.
          *   *Application:* The thermostat enforces the rule, not just the landlord.

  4.  **Evaluating the Claims (Trivial, Defensible, False):**
      *   *Instrumental:* Trivial. (Everything has effects).
      *   *Consequentialist:* Defensible. (Outcomes matter).
      *   *Structural/Inherent:* Defensible but specific. (Hard to prove for consumer tech).
      *   *Script/Delegation:* Defensible. (Design choices embed values).
      *   *Agency:* Philosophically contentious. (Metaphorical vs. literal).

  5.  **Mapping to the Thermostat Scenario:**
