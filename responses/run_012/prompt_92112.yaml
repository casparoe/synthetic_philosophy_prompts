answer: |-
  1. You have accurately captured the standard philosophical and legal objections, particularly regarding vagueness and the potential for paralysis. However, you might acknowledge that proponents often argue these objections stem from misapplication rather than the principle itself.

  2. This distinction usefully clarifies the debate, though it closely mirrors existing separations between risk assessment and risk management in regulatory theory. It risks appearing as mere relabeling unless you explicitly cite how it diverges from prior frameworks like those of Sandin or Peterson.

  3. Your dismissal of epistemic precaution is the weakest step, as rational decision-making under deep uncertainty often requires weighting tail risks heavily without distorting probability estimates. Additionally, you do not fully justify why axiological concerns automatically necessitate shifting the burden of proof rather than simply raising the threshold for approval.

  4. Climate geoengineering strains your test, as failing to act is itself an irreversible decision that your framework might incorrectly classify as low-risk because it maintains the status quo. This suggests your reversal test needs to account for the irreversibility of inaction, not just the irreversibility of proposed interventions.

  5. The proposal is genuinely interesting because it shifts the focus from uncertainty to reversibility, offering a more operational heuristic for regulators. However, its practical value depends on whether agencies can reliably assess reversibility costs before deployment, which is often as uncertain as the harms themselves.
