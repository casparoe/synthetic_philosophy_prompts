prompt: |-
  My partner and I moved into a housing co-op about a year ago — 40 units, everyone owns a share — and somehow I ended up on the commitee that's rewriting the bylaws. The big fight is over who gets a vote on the stuff that actually matters: rent adjustments, whether we sell the parking lot to the developer next door, how we spend the reserve fund. Right now only the lease-holding members vote. But there's a bunch of long-term subletters who've lived here five, six years, pay into the maintenance fund every month, know everyone's dogs by name, and they're pushing hard to be included. Then two people who moved in like six weeks ago also want in, and someone floated letting the teenagers who live here vote on the garden and common-room budget but not on rent, which feels either obviously right or obviously insane depending on the day.

  The thing that's really bugging me is that our committee basically appointed ourselves when the old one dissolved, so we're the ones deciding who gets to decide, which even I can see is a little circular. I keep drawing the line by vibes — "people who are really part of this place" — and every time I try to turn that into an actual rule it either swallows everyone or turns into a popularity contest. My roommate says I should just stop, because any answer is whoever's holding the pen picking their own side, so there's no non-circular way to settle it and I'm wasting my time. I don't think he's totally wrong, but I also don't think "no principled answer" can be the end of it, since we still have to run the vote and somebody has to make the list. So: is there a defensible way to work out who belongs in the electorate here, and if so, how do I apply it without quietly rigging it toward the outcome I already want? Walk me through how you'd actually decide the subletter and teenager questions, not just that it's complicated.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Housing co-op (40 units), member-owned shares.
      *   **Task:** Rewriting bylaws, specifically defining voting rights (the electorate).
      *   **Current State:** Only lease-holding members vote.
      *   **Conflict:**
          *   Long-term subletters (5-6 years, pay maintenance, integrated) want voting rights.
          *   New members (6 weeks) want voting rights.
          *   Teenagers want voting rights on specific issues (garden/common room).
      *   **Meta-Problem:** The committee appointed itself (circular authority). The user is struggling to define "community membership" without it being arbitrary or a popularity contest.
      *   **Roommate's Advice:** Stop trying, it's inherently circular/power-based ("whoever holds the pen").
      *   **User's Intuition:** "No principled answer" isn't acceptable because a decision *must* be made. Needs a defensible framework to avoid rigging it.
      *   **Goal:** A defensible method to determine voting eligibility (specifically addressing subletters and teenagers) and a process to minimize self-dealing/bias.

  2.  **Deconstruct the Philosophical/Political Problem:**
      *   The user is facing the "Boundary Problem" in democratic theory (who constitutes the *demos*?).
      *   The roommate is echoing a realist/cynical view (power determines rules).
      *   The user wants a normative view (what *should* the rules be based on principles?).
      *   *Key Insight:* The roommate is half-right (power dynamics exist) but wrong that it precludes principled decision-making. The goal isn't perfect neutrality (impossible) but *procedural legitimacy*.

  3.  **Evaluate the Stakeholders & Interests:**
      *   **Shareholders/Leaseholders:** Bear financial risk, legal liability, long-term equity stake.
      *   **Long-term Subletters:** Bear financial cost (rent/maintenance), social integration, stability stake, but no equity/legal liability.
      *   **New Members:** Legal/financial stake, but low social integration/knowledge.
      *   **Teenagers:** Social integration, affected by specific decisions, no financial/legal stake.
      *   **The Committee (User):** Tasked with drafting, risk of self-perpetuation.

  4.  **Develop a Framework for Voting Rights:**
      *   Voting rights usually correlate with *stake*, *risk*, and *competence/impact*.
      *   *Principle 1: Risk & Liability.* Who loses money if things go wrong? (Shareholders).
      *   *Principle 2: Impact & Residence.* Who lives with the consequences daily? (Residents, including subletters).
      *   *Principle 3: Continuity.* Who is here long enough to care about long-term health vs. short-term gain?
      *   *Principle 4: Competence/Agency.* (Re: Teenagers).

  5.  **Address the Specific Cases:**
      *   **Subletters:** They pay into maintenance. They are stable. *Compromise:* Voting rights on operational issues (maintenance, garden, rules) but not structural/financial issues (selling land, major assessments, bylaws changes) unless they convert to members. OR, create a tiered membership.
      *   **New Members (6 weeks):** They hold shares/leases. *Verdict:* They should vote. Ownership/Lease is the legal trigger. The "vibes" check is dangerous.
      *   **Teenagers:** *Verdict:* Advisory role or specific budget input, not binding votes on governance. Age limits are standard for legal reasons, but "youth councils" work for specific domains.

  6.  **Address the Meta-Problem (The Committee's Legitimacy):**
      *   The committee appointed itself. This is the weak link.
      *   *Solution:* Ratification. The committee proposes, the *current* legitimate electorate (leaseholders) ratifies. Or, hold a town hall where everyone (including subletters) gives input, but final vote stays with members *for now*, with a pathway for subletters.
      *   *Mitigating Bias:* Recusal, external facilitation, transparent criteria, sunset clauses.

  7.  **Drafting the Response:**
      *   **Validate:** Acknowledge the roommate isn't *wrong* about power, but is wrong that it means giving up. This is classic democratic constitution-writing.
      *   **Framework:** Introduce the "Stake, Risk, and Residence" model.
      *   **Specific Recommendations:**
          *   *Subletters:* Tiered voting (Operational vs. Structural).
          *   *New Members:* Full voting (ownership trumps tenure).
          *   *Teens:* Advisory/Consultative, not binding.
      *   **Process (The "How"):** How to avoid rigging.
          *   Transparency.
          *   Ratification mechanism.
          *   The "Veil of Ignorance" test.
      *   **Tone:** Pragmatic, empathetic, politically savvy, not overly academic but grounded in governance theory.

  8.  **Refining the Advice (Self-Correction during drafting):**
      *   *Correction:* I need to be careful about legalities. Co-ops usually have legal restrictions on who can vote (members vs. non-members). I should mention checking the *current* legal bylaws and state law.
      *   *Nuance:* The user says subletters pay into the maintenance fund. That's unusual. Usually, rent covers that. If they are directly paying, that strengthens their claim.
      *   *The "Circularity":* Acknowledge it. The only way to break the circle is to appeal to a higher authority (the law) or a future ratification vote.
      *   *The "Vibes":* Explicitly warn against "vibes." Vibes = bias. Rules = clarity.

  9.  **Final Structure:**
      1.  Validate the dilemma (The Boundary Problem).
      2.  Address the Roommate (Power vs. Principle).
      3.  The Framework (Risk, Stake, Impact).
      4.  Applying the Framework (Subletters, Newbies, Teens).
      5.  Solving the Circularity (Process & Ratification).
      6.  Guardrails against Rigging.

  10. (Final Polish): Ensure the tone is conversational but authoritative. Make sure the distinction between "Member" (legal/financial) and "Resident" (occupant) is clear.

  *(Self-Correction on the Subletter issue)*: In many co-ops, subletting is restricted or temporary. If they've been there 5-6 years, are they legal sublets? Assuming yes for the sake of the argument, but worth noting that long-term subletting might violate the *current* bylaws they are trying to rewrite. I will focus on the *future* bylaws.

  *(Refining the Teen issue)*: Don't dismiss it. It's about agency. Suggest a "Youth Advisory Board" model.

  *(Refining the Committee issue)*: The committee *must* submit their work to a vote of the *current* legal members to be valid. That breaks the circularity.

