answer: |-
  This is a classic problem in political theory called the **Boundary Problem**: *Who gets to decide who decides?* Your roommate is channeling a realist perspective (power determines rules), but you are right to reject the idea that "might makes right" is the only option. If you accept that, you aren't writing bylaws; you're just codifying a power grab.

  You can't achieve perfect neutrality, but you can achieve **procedural legitimacy**. That means creating a system where people might disagree with the outcome, but they accept the process that got there as fair.

  Here is a framework to disentangle the "vibes" from the rules, specific recommendations for your three groups, and a process to keep your committee from accidentally (or intentionally) rigging the game.

  ### 1. The Framework: Stake, Risk, and Continuity
  To move away from "vibes," you need objective criteria. In housing governance, voting rights usually map to three axes:

  1.  **Financial/Legal Risk:** Who loses money or faces liability if the co-op fails? (Currently: Shareholders/Leaseholders).
  2.  **Daily Impact:** Who lives with the consequences of day-to-day decisions? (Currently: All residents).
  3.  **Continuity:** Who is here long enough to care about the 5-year plan vs. the 5-month plan?

  The conflict arises because these axes don't overlap perfectly. Your job is to decide which axis matters for which *type* of vote. You do not need a binary "Voter/Non-Voter" switch. You can have tiered voting rights.

  ### 2. Applying the Framework to Your Specific Cases

  #### The Long-Term Subletters
  *The Dilemma:* They have high **Daily Impact** and **Continuity**, but low **Financial/Legal Risk** (they don't own the share, they likely aren't on the master lease).
  *The Risk:* If they get full voting rights, they could vote to lower maintenance fees or deplete reserves, benefiting their short-term rent stability while leaving the actual owners holding the bag for long-term repairs.
  *The Solution:* **Tiered Membership.**
  *   **Operational Votes:** Give them voting rights on issues that affect daily living and social infrastructure (garden rules, common room usage, noise policies, pet rules). They live there; they should have a say in the *environment*.
  *   **Structural Votes:** Reserve these for share-holders/leaseholders only. This includes selling assets (the parking lot), major rent/assessment adjustments, and changes to the bylaws themselves. These carry financial liability.
  *   **The Pathway:** Write a clause that allows subletters to apply for full voting membership after a certain tenure (e.g., 2 years), contingent on board approval or purchasing a share if one becomes available. This acknowledges their integration without bypassing the financial risk structure.

  #### The New Members (6 Weeks)
  *The Dilemma:* They have high **Financial/Legal Risk**, but low **Continuity** and social knowledge.
  *The Risk:* Excluding them sets a dangerous precedent that tenure matters more than ownership. If you exclude them, you open the door to excluding anyone under a year, which disenfranchises owners.
  *The Solution:* **Full Voting Rights Immediately.**
  *   Ownership/Leaseholding is a bright legal line. It is objective. "Vibes" or tenure requirements for owners are subjective and easily manipulated to purge unpopular members.
  *   **Mitigation:** If you are worried about them making uninformed decisions on complex issues (like the reserve fund), implement a **mandatory orientation**. You can't deny the vote, but you can require that a member attend an info session on co-op finances before casting a ballot on fiscal matters.

  #### The Teenagers
  *The Dilemma:* They have high **Daily Impact** on specific issues, but legal/developmental limitations on **Agency**.
  *The Risk:* Giving minors binding voting power on budgets creates legal and liability headaches. Ignoring them creates resentment and disengagement.
  *The Solution:* **Advisory Council, Not Electorate.**
  *   Create a "Youth Advisory Board" for residents under 18.
  *   **Mechanism:** For budget items related to the garden, common room, or community events, the main board *must* consult the Youth Board. The Youth Board gets a formal recommendation vote. The main board can override it, but they must publicly state why.
  *   This gives them genuine power and respect without creating a legal nightmare regarding contractual capacity or minors in governance.

  ### 3. Solving the Circularity (The Committee Problem)
  Your roommate is right that your committee's self-appointment is a vulnerability. If you write the rules that validate your own power, it looks corrupt. Here is how you break the circle:

  **1. The Ratification Vote**
  The committee does not *enact* the bylaws. The committee *drafts* them. The new bylaws must be ratified by the **current legitimate electorate** (the current lease-holding members).
  *   *Why this works:* It acknowledges the current legal reality. You are asking the current owners to voluntarily share power. If they vote it down, the process restarts. This removes the "circular" accusation because the ultimate authority rests with the existing legal structure, not the committee.

  **2. The "Veil of Ignorance" Test**
  When debating a rule in committee, ask this question: *"Would we still support this rule if we didn't know whether we would be a shareholder, a subletter, or a teenager in five years?"*
  *   If a rule only benefits people exactly like you (e.g., "committee members get automatic voting rights"), it fails the test.
  *   If a rule benefits the stability of the house regardless of who lives there (e.g., "2 years tenure for subletter voting"), it passes.

  **3. External Facilitation**
  If the committee is deadlocked or feels too biased, use a small portion of the reserve fund to hire a neutral mediator or co-op consultant for one session. Their job isn't to decide, but to facilitate the discussion on voting rights. Having an outsider in the room prevents the "old boys club" dynamic from taking over.

  ### 4. How to Avoid Rigging It (Guardrails)
  You are worried about quietly rigging the outcome toward what you want. Here are three concrete guardrails:

  *   **Sunset Clause:** Put a clause in the new bylaws that says, "These voting eligibility rules must be reviewed by a special committee in 3 years." This admits that you might not get it perfect and commits the co-op to fixing it later.
  *   **Transparent Criteria:** Write the criteria into the bylaws as objective metrics, not board discretion.
      *   *Bad:* "Subletters may vote if the board feels they are integrated." (This is a popularity contest).
      *   *Good:* "Subletters residing in the co-op for 24 continuous months who have no outstanding balance on their rent account are eligible for Operational Voting Rights." (This is a rule).
  *   **Recusal:** If a committee member is personally affected by a specific clause (e.g., *you* are a subletter, or *you* have a teenager), you recuse yourself from the vote on that specific clause within the committee. You can argue, but you don't cast the deciding vote.

  ### Summary of the Proposal
  1.  **Shareholders/Leaseholders:** Full voting rights (Financial + Operational).
  2.  **Long-term Subletters (>2 years):** Operational voting rights only (Garden, Rules, Events). No financial/structural votes.
  3.  **New Members:** Full voting rights immediately (protects ownership principle).
  4.  **Teenagers:** Youth Advisory Board with binding consultation on specific budget lines.
  5.  **Process:** Committee drafts -> Current Legal Members Ratify -> Review in 3 Years.

  This approach acknowledges the subletters' contribution without jeopardizing the co-op's financial solvency, respects the legal reality of ownership, and gives the kids a voice without making them liable. It replaces "vibes" with tenure and financial thresholds, which are hard to argue are purely biased.

  Your roommate thinks you're wasting your time because he thinks politics is only about power. But in a co-op, **trust is capital.** If you write rules that feel fair to the subletters even if they don't get the full vote, they will pay rent on time and fix the sink when it leaks. If you write rules that feel like a clique protecting their turf, the house will rot from the inside. That's not wasting time; that's asset management.
