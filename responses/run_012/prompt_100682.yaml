answer: |-
  Below is a specification of desiderata for any adequate account of heritability ($h^2$) intended for policy inference, followed by an assessment of the interventionist proposal and an analysis of internal tensions.

  ### Part I: Desiderata for an Adequate Account of Heritability

  An account of what "$h^2 = 0.6$" means must satisfy the following requirements to avoid scientific error and policy malpractice.

  #### 1. The Relativity Requirement
  *   **Requirement:** The account must specify that the estimate is relative to a specific population at a specific time, experiencing a specific range of environmental variation. It cannot be treated as an intrinsic property of the trait.
  *   **Consideration:** $h^2$ is a ratio of variances ($V_G / V_P$). If environmental variance ($V_E$) drops (e.g., universal nutrition), $h^2$ rises, even if the biological mechanism of growth remains unchanged. Conversely, if genetic diversity is reduced, $h^2$ falls.
  *   **Classification:** **Non-negotiable (Internal).** Violating this renders the statistic mathematically meaningless outside the sample.

  #### 2. The Variance/Causation Distinction
  *   **Requirement:** The account must distinguish between explaining *differences* between individuals and explaining the *development* of the trait within an individual.
  *   **Consideration:** A trait can be 100% heritable (all variance due to genes) yet 100% environmentally dependent for development (e.g., having two eyes). High $h^2$ licenses inference about sources of *variation*, not sources of *existence*.
  *   **Classification:** **Non-negotiable (Internal).** Collapsing this distinction commits the "heritability of individual development" fallacy.

  #### 3. The Malleability Independence Requirement
  *   **Requirement:** The account must explicitly decouple the magnitude of $h^2$ from the potential responsiveness of the trait to environmental manipulation.
  *   **Consideration:** High $h^2$ is compatible with high malleability (e.g., PKU is genetic but environmentally treatable). Low $h^2$ is compatible with low malleability (e.g., preferences might be largely environmental but culturally entrenched and hard to shift).
  *   **Classification:** **Non-negotiable (Internal).** This is a logical consequence of the variance ratio definition; $V_G$ says nothing about the slope of the reaction norm.

  #### 4. The Additivity and Independence Assumption
  *   **Requirement:** The account must disclose that standard $h^2$ estimates assume additive genetic effects and the absence of Gene-Environment Correlation (rGE) and Interaction (GxE), or specify how these are modeled.
  *   **Consideration:** Standard twin models (ACE) often subsume GxE into genetic or environmental estimates. If rGE exists (e.g., genetically smarter parents create richer environments), $h^2$ may inflate genetic attribution by capturing environmental effects correlated with genes.
  *   **Classification:** **Non-negotiable (Internal).** Violation implies the estimate is biased, not merely interpreted differently.

  #### 5. The Design-Validity Constraint
  *   **Requirement:** The account must acknowledge the counterfactual assumptions required by the design (e.g., Equal Environments Assumption in twins, random placement in adoptions) and what follows if they are false.
  *   **Consideration:** If MZ twins share more relevant environments than DZ twins, $h^2$ is overestimated. If adoptees are placed in homes correlated with biological parents, $h^2$ is overestimated. The meaning of the number depends on the validity of these controls.
  *   **Classification:** **Non-negotiable (Internal).** The number is conditional on the design's validity.

  #### 6. The Molecular Consistency Requirement
  *   **Requirement:** The account must be consistent with the discrepancy between pedigree-based estimates (twin/family) and molecular estimates (SNP/GWAS).
  *   **Consideration:** Pedigree $h^2$ captures rare variants, structural variants, and epistasis. Molecular $h^2$ (SNP-heritability) captures only common additive variants. An account cannot claim the number represents "the genetic contribution" without specifying which genetic architecture is captured.
  *   **Classification:** **Non-negotiable (Internal).** Empirical consistency is required for scientific validity.

  #### 7. The Policy Actionability Requirement
  *   **Requirement:** The account should indicate whether the statistic provides guidance on which lever (genetic or environmental) is more efficient for achieving a specific social outcome.
  *   **Consideration:** Policymakers need to know where to invest resources. They often mistakenly believe high $h^2$ implies environmental intervention is futile. An adequate account must prevent this inference.
  *   **Classification:** **Imported (External).** This is a demand placed on the statistic by users, not a property of the statistic itself.

  #### 8. The Stability Requirement
  *   **Requirement:** The account must clarify whether the estimate implies stability of the trait ranking over time (rank-order stability) or stability across contexts.
  *   **Consideration:** High $h^2$ often correlates with high rank-order stability over the life course, but this is an empirical correlation, not a definition. Policy regarding early intervention depends on whether the trait ordering is fixed.
  *   **Classification:** **Imported (External).** This is a prediction often associated with $h^2$, but not guaranteed by it.

  ---

  ### Part II: Assessment of the Interventionist Proposal

  **Proposal:** Heritability should be read interventionistically—as answering "how much of a trait's variance a specified environmental intervention could in principle remove."

  **Assessment against Desiderata:**

  1.  **Fails Malleability Independence (Desideratum 3):** This is the critical failure. If $h^2 = 0.6$, the interventionist reading suggests an environmental intervention can remove 60% of the variance. This is false. An environmental intervention could theoretically remove 100% of the variance (e.g., a lobotomy, or uniform cloning/rearing), regardless of the current $h^2$. Conversely, if the trait is insensitive to the specific intervention, it might remove 0%. $h^2$ measures the *current* source of variance, not the *potential* reducibility of variance.
  2.  **Fails Variance/Causation Distinction (Desideratum 2):** It conflates the cause of current differences (genes) with the cause of potential changes (environment). It treats $h^2$ as a measure of environmental efficacy, which is the inverse of its actual definition.
  3.  **Violates Relativity (Desideratum 1):** The "specified environmental intervention" implies a counterfactual environment. $h^2$ is defined by the *actual* environmental variance in the population. Changing the environment changes the denominator ($V_P$) and potentially the numerator ($V_G$ via GxE), rendering the original $h^2$ number inapplicable to the intervention scenario.
  4.  **Satisfies Policy Actionability (Desideratum 7):** This is the proposal's only strength. It translates a abstract variance ratio into a metric policymakers care about (impact of intervention). However, it achieves this by falsifying the metric.

  **Verdict:** The interventionist proposal is **inadequate**. It sacrifices internal validity (Non-negotiables) to satisfy external utility (Imported). It redefines heritability as "environmental sensitivity," which is a different parameter entirely.

  ---

  ### Part III: Incompatible Pairs and Tensions

  The following pairs of requirements generate tensions that suggest no single account of heritability can satisfy all policy desires while remaining scientifically rigorous.

  #### 1. Population Relativity (Non-negotiable) vs. Policy Actionability (Imported)
  *   **Tension:** Policy is often universalist (e.g., "This program works for IQ"). Heritability is strictly local (e.g., "This $h^2$ applies to white, middle-class US twins in 1990").
  *   **Conflict:** To make $h^2$ actionable for general policy, one must assume stability across populations and environments. To remain scientifically accurate, one must deny that stability. You cannot jointly satisfy strict relativity and broad policy generalizability.

  #### 2. Variance Partitioning (Non-negotiable) vs. Individual Causation (Imported)
  *   **Tension:** Policy often targets individuals (e.g., "Should *this* child receive remedial reading?"). Heritability only addresses populations ("Why do *these* children differ?").
  *   **Conflict:** Using a population variance ratio to inform individual-level resource allocation commits the ecological fallacy. An account that makes $h^2$ useful for individual case management inevitably distorts the statistical meaning of the number.

  #### 3. Interventionist Reading (Imported) vs. Malleability Independence (Non-negotiable)
  *   **Tension:** As noted in the assessment, policymakers want $h^2$ to predict intervention success. Quantitative genetics dictates that $h^2$ predicts nothing about intervention success.
  *   **Conflict:** **These cannot be jointly satisfied.** You must choose: either $h^2$ retains its technical meaning (and is often useless for predicting intervention magnitude) or it is redefined to predict intervention (and ceases to be heritability).

  ### Summary Recommendation for Policy Argumentation
  If you invoke heritability in policy, you must explicitly **waive the Interventionist Reading**. You must state that $h^2 = 0.6$ describes the *status quo* distribution of causes, not the *potential* for change. To argue for policy, you must introduce a separate premise regarding the **reaction norm** (the trait's sensitivity to environmental change), which is independent of $h^2$. Any account that attempts to bundle these into a single number will fail the Non-negotiable desiderata.
