prompt: |-
  I'm on the standards committee of a loose alliance of about fourteen small research nonprofits -- same ballpark size, similar programs, and we keep facing the same recuring choice: whether to publish our own unflattering evaluation data, whether to pay for an outside audit we know will find problems, whether to adopt a shared reporting standard that makes each of us look worse but makes the whole field more legible. Each org decides for itself, we vote quarterly, and there's real money and reputation on the line. Before each vote we all write short position memos and circulate them, and then everyone reads everyone else's before deciding. None of us are game theorists, and we have one two-hour meeting to settle each one.

  A colleague keeps bringing up superrationality -- her version: when the parties are symmetric and everyone knows everyone reasons the same way, you should choose the option you'd want everyone to choose, acting as if your choice fixes theirs, instead of the option that's best given what the others do. I can't tell if thats a real insight or a nice way of talking yourself into getting burned.

  Can you turn it into a procedure the committee can actually run on each decision? The questions in order, what counts as a good enough answer to each, where it stops with a no, and where it has to hand the call to a person because it's values and not strategy. I especially want it to be straight about the part I'm suspicious of: does circulating our memos first actually make our choices correlated in the way the principle needs, or is that just cheap talk that a sharper org can free-ride on? And what do we do about the two members who've said flat out they'll do whatever's best for them no matter what the rest of us conclude?

  Then run it on three cases: publishing failure data when we think two of the fourteen won't; chipping in to a shared tool that only pays off if at least eight of us fund it; and a third where I suspect the procedure tells us to eat a genuine loss for the group's sake -- I'd rather see that one than have it smoothed over.

  Finish with where this will misfire: the steps that are really coin flips dressed up as principle, the question of who even counts as symmetric with me (do I have to worry about strangers who happen to reason like me?), and what the procedure can't do at all.

  American English please, and skip the citations and reading lists -- I want the machinery, not the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Member of a standards committee for an alliance of 14 small research nonprofits.
      *   **Context:** Recurring collective action problems (publishing bad data, paying for audits, adopting shared standards). Decisions are made by vote after circulating position memos. High stakes (money, reputation).
      *   **Problem:** A colleague advocates for "superrationality" (Hofstadter's concept). The user is skeptical: Is it real insight or just a way to get sucker-punched?
      *   **Task:** Turn superrationality into a concrete *procedure* for the committee to use.
      *   **Specific Requirements:**
          *   Step-by-step questions/order.
          *   Criteria for "good enough" answers.
          *   Stop conditions (where it says "no").
          *   Hand-off points (where it's values, not strategy).
          *   Address the skepticism: Do memos create correlation or just cheap talk?
          *   Address the defectors: Two members say they'll act selfishly regardless.
          *   Run the procedure on three specific cases (publishing failure data, shared tool threshold, genuine loss for group sake).
          *   Finish with failure modes (coin flips, symmetry definition, limitations).
          *   Tone: American English, practical ("the machinery"), no citations/reading lists.

  2.  **Deconstruct "Superrationality" in this Context:**
      *   *Core Idea:* If we are similar enough and reason alike, my decision is evidence of yours. Therefore, I should choose the action that yields the best outcome if *everyone* does it, not just the best response to what I *think* you will do.
      *   *The Skeptic's Worry:* Correlation isn't causation. Just because we talk doesn't mean we lock steps. If I cooperate and you defect, I lose.
      *   *The "Two Defectors" Problem:* Superrationality relies on symmetry. If two actors explicitly break symmetry (pledge to defect), the logic weakens for the rest.
      *   *The "Memos" Problem:* Is this pre-commitment or just cheap talk?

  3.  **Drafting the Procedure (The "Machinery"):**
      *   Need a checklist or flowchart style.
      *   *Step 1: Symmetry Check.* Are we actually alike enough? (Mission, constraints, incentives).
      *   *Step 2: Correlation Check.* Do the memos actually link us? (Public commitment, reputation cost of breaking rank).
      *   *Step 3: The Defector Adjustment.* What about the two who opted out? Does their presence break the magic?
      *   *Step 4: The Payoff Calculation.* Compare "All Cooperate" vs. "Mixed/All Defect."
      *   *Step 5: The Values Hand-off.* If the math works but the moral cost is too high, stop.

  4.  **Addressing the Specific Skepticisms:**
      *   *Memos as Correlation:* They aren't magic. They only work if there's a cost to lying. The procedure needs to verify if there's reputational skin in the game.
      *   *The Two Defectors:* They break the "everyone reasons the same" assumption. The procedure must account for them as a fixed variable (noise) rather than part of the superrational cluster.

  5.  **Running the Three Cases:**
      *   *Case 1: Publishing Failure Data (2 won't).*
          *   Symmetry: High.
          *   Defectors: 2 out of 14.
          *   Logic: If 12 publish and 2 hide, do the 12 look bad while the 2 look good? Or does the field gain legitimacy?
          *   Outcome: Likely a "No" on strict superrationality because the symmetry is broken by the 2 defectors, unless the 12 can sanction the 2.
      *   *Case 2: Shared Tool (Threshold 8).*
          *   Symmetry: High.
          *   Defectors: 2 out of 14.
          *   Logic: Need 8. Even if 2 defect, 12 remain. If superrationality holds for the 12, they all fund, threshold met.
          *   Outcome: "Yes," provided the 12 trust each other more than the 2.
      *   *Case 3: Genuine Loss for Group Sake.*
          *   Logic: This is the hard one. Superrationality says "do it if everyone doing it helps the group," even if individual cost is high.
          *   Outcome: The procedure should flag this as a "Values Hand-off." Strategy says do it; mission survival says maybe not.

  6.  **Refining the Failure Modes:**
      *   *Coin Flips:* Symmetry is never perfect.
      *   *Who Counts:* Do we worry about strangers? No, only voting members.
      *   *Limitations:* Can't solve prisoner's dilemmas where defection is dominant *and* unpenalized.

  7.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Tone:* Direct, pragmatic, slightly cynical but constructive. "American English" means get to the point, avoid academic jargon where possible.
      *   *Structure:*
          1.  The Procedure (The "Superrationality Checklist").
          2.  Addressing the Skepticism (Memos & Defectors).
          3.  The Three Cases.
          4.  Failure Modes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Superrationality is great." I need to validate the user's suspicion. The procedure should act as a *filter* to see if superrationality applies, not a mandate to use it blindly. If the conditions aren't met, the procedure should say "Don't use this logic."

      *Refining the "Two Defectors" point:* If two people say "I will defect," they have removed themselves from the superrational cluster. The remaining 12 must decide if *they* form a symmetric cluster of 12. If the payoff depends on 14/14, the logic fails. If it depends on 12/14, it might work.

      *Refining the "Memos" point:* Memos are only correlation if they are public and binding-ish. If I can write a memo saying "I'll cooperate" and then vote "No" without penalty, it's cheap talk. The procedure needs to check for *enforceability* or *reputational cost*.

  8.  **Final Polish:** Check against all constraints.
      *   American English? Yes.
      *   No citations? Yes.
      *   Procedure steps? Yes.
      *   Stop conditions? Yes.
      *   Values hand-off? Yes.
      *   Three cases run? Yes.
      *   Failure modes? Yes.

  9.  **Final Review of the "Genuine Loss" Case:** The user wants to see this one not smoothed over. I need to make sure the procedure admits that superrationality might demand self-sacrifice that threatens organizational survival. That's the "Values Hand-off."

  10. **Constructing the Output.** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is the machinery. It treats superrationality not as a moral commandment, but as a strategic hypothesis that must be tested before you rely on it.

  ### The Superrationality Checklist

  Run this sequence before the vote. If you hit a **STOP**, superrational logic does not apply. Use standard game theory (protect yourself) or values-based judgment instead.

  **Step 1: The Symmetry Test**
  *   **Question:** Are the incentives and constraints for the 14 organizations functionally identical regarding this specific decision?
  *   **Good Enough Answer:** Yes, the cost to us is roughly the same as the cost to them, and the benefit to the field is shared equally. No one has a hidden revenue stream or a unique vulnerability that changes the math.
  *   **Stop Condition:** If one or more orgs have a fundamentally different payoff structure (e.g., one is funded by a donor who hates transparency), superrationality fails. You are not symmetric.
  *   **The Defector Clause:** Your two colleagues who pledged to act selfishly have explicitly broken symmetry. Remove them from the calculation. You are now a cluster of 12. Does the decision still work if only 12 cooperate? If the requirement is 14/14, **STOP**. Superrationality cannot bridge a gap where explicit defectors hold veto power.

  **Step 2: The Correlation Test (The Memo Check)**
  *   **Question:** Does circulating the position memo actually link our decisions, or is it just noise?
  *   **Good Enough Answer:** There is a reputational cost to lying in the memo. If I write "I intend to support this" and then vote "No," I lose standing, future funding cooperation, or trust within the alliance. The memo acts as a soft pre-commitment.
  *   **Stop Condition:** If members can write one thing in the memo and vote another without consequence, this is cheap talk. Your choice does not predict theirs. **STOP**. Superrationality requires that your reasoning process is mirrored; if they can lie without penalty, their reasoning is hidden from you.

  **Step 3: The Payoff Comparison**
  *   **Question:** Is the outcome of "All of Us Cooperate" significantly better than "All of Us Defect," even accounting for the defectors?
  *   **Good Enough Answer:** Yes. The collective gain (legibility, trust, tool access) outweighs the individual pain of the specific action (bad data, audit cost).
  *   **Stop Condition:** If the individual cost of cooperating is existential (e.g., "If we publish this data, we lose our primary grant and close our doors"), **STOP**. No strategic principle demands organizational suicide. Hand off to Step 5.

  **Step 4: The Mirror Decision**
  *   **Question:** If I assume my vote *causes* the other 11 symmetric members to vote the same way, is the vote "Yes"?
  *   **Good Enough Answer:** Yes. If 12/14 vote Yes, the outcome is positive for the field and sustainable for us.
  *   **Stop Condition:** If the math only works if *everyone* does it, and you know two won't, **STOP**. You are not fixing their output. You are just absorbing their free-ride.

  **Step 5: The Values Hand-Off**
  *   **Trigger:** If Step 3 or 4 passes strategically, but the cost feels morally or mission-critically wrong.
  *   **Action:** This is no longer a strategy question. This goes to the Executive Directors or Boards. Superrationality tells you how to win the game; it does not tell you if you should play it.
  *   **Rule:** If the "Genuine Loss" threatens the core mission of the nonprofit (not just its comfort), the procedure defaults to **Mission Preservation**. You defect to survive.

  ***

  ### Addressing Your Skepticism

  **Do the memos create correlation?**
  Only if there is skin in the game. If the memos are private or unenforceable, your colleague is selling you magic. For the checklist above, the memos only count if a member who flips their vote after a "Yes" memo faces a penalty (social, financial, or procedural). If there is no penalty, treat the memos as weather forecasts: interesting, but not something you build a house on. In that case, Step 2 triggers a STOP.

  **What about the two defectors?**
  They break the "everyone reasons the same" rule. You cannot treat them as part of the superrational cluster. You must treat them as environmental hazards, like rain or taxes. The procedure accounts for this in Step 1 (The Defector Clause). If the project fails without them, you cannot use superrationality to justify joining. You would just be the third sucker.

  ***

  ### Running the Cases

  **Case 1: Publishing Failure Data (2 of 14 won't)**
  *   **Step 1 (Symmetry):** Broken. 12 are willing to consider transparency; 2 are explicitly hiding data.
  *   **Step 4 (Mirror Decision):** If 12 publish failure data and 2 hide it, the 2 look more competent than the 12. The field looks honest, but the 12 look like failures specifically.
  *   **Result:** **STOP at Step 1/4.** The defectors gain a comparative advantage. Superrationality fails because the payoff is not symmetric. The 12 absorb the reputation hit; the 2 reap the benefit of looking better by comparison.
  *   **Verdict:** Do not use superrational logic here. This requires a sanction mechanism against the 2, or you all defect.

  **Case 2: Shared Tool (Threshold 8 of 14)**
  *   **Step 1 (Symmetry):** High. Cost is equal.
  *   **Step 1 (Defectors):** 2 will defect. That leaves 12 potential cooperators.
  *   **Step 3 (Payoff):** Threshold is 8. Even if the 2 defectors walk, the 12 superrational members can fund it alone.
  *   **Step 4 (Mirror Decision):** If I vote Yes, the other 11 likely vote Yes. Total 12. Threshold met. Tool exists. Everyone benefits (including the defectors).
  *   **Result:** **PASS.** The defectors are irrelevant to the success condition. The 12 can lock in the outcome among themselves.
  *   **Verdict:** Vote Yes. You are not being burned; you are securing the good despite the freeloaders, because you have enough numbers to ignore them.

  **Case 3: Genuine Loss for Group Sake**
  *   **Scenario:** Adopting a standard that makes everyone look worse, but you know your org will lose a specific $500k grant if you adopt it.
  *   **Step 3 (Payoff):** Collective gain is high (field legibility). Individual cost is $500k.
  *   **Step 5 (Values Hand-Off):** The procedure flags this immediately. Superrationality says "Take the hit, because if everyone reasons like you, everyone takes the hit, and the field is saved."
  *   **The Hard Truth:** Your fiduciary duty is to your organization, not the field.
  *   **Result:** **HAND-OFF.** The procedure tells you that strategically, cooperation is the move *if* you value the field above your own survival. But since you are a nonprofit with a mission to deliver, you likely cannot afford the hit.
  *   **Verdict:** The procedure admits this is a trap. If the loss is existential, you must defect. Superrationality is a luxury of the secure. If you are vulnerable, you cannot afford to be the mirror.

  ***

  ### Where This Will Misfire

  **1. The Coin Flip of Symmetry**
  Symmetry is never perfect. One org might have a board meeting the day of the vote; another might have a cash flow crunch. The procedure assumes you are identical robots. You are not. If you overestimate symmetry, you will cooperate when you should have defended yourself.
  *   *Fix:* Add a margin of error. If the payoff for "All Cooperate" is only 5% better than "I Defect," assume asymmetry and defect. Only cooperate if the collective win is overwhelming.

  **2. Who Counts as "Me"?**
  Superrationality worries about "anyone who reasons like me." In your committee, the boundary is clear: the 14 seats. Do not worry about strangers. However, do worry about the *staff* vs. the *org*. You might reason one way, but your Board might reason another.
  *   *Fix:* The "You" in the procedure is the Decision Maker. If the Board votes, the Board is the unit of symmetry. If the ED decides, the ED is the unit. Ensure the memo circulates among the actual decision-makers, not just the committee attendees.

  **3. What It Can't Do**
  This procedure cannot generate trust where there is none. It cannot punish defectors. It cannot solve a problem where the incentive to cheat is higher than the incentive to cooperate *even if everyone cooperates*.
  *   *The Hard Limit:* If the two defectors in Case 1 are not sanctioned, superrationality is just a fancy way to organize a sacrifice. It creates a "Sucker's Consensus." If you cannot change the payoff structure (punish defectors, reward cooperators), the only honest answer the procedure can give you is: **"Don't do it. You aren't in a game you can win by thinking harder."**

  **Summary:** Use the checklist to see if the conditions for magic are present. Usually, they aren't. When they are (like Case 2), it's a powerful tool. When they aren't (Case 1 & 3), the procedure's main value is telling you to stop pretending and protect your own flank.
