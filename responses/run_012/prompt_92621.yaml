  1. Responsibility is grounded in diachronic stewardship rather than origination; you are accountable for actions emerging from a character you have had the capacity and opportunity to reflectively maintain or revise, even if you did not construct its foundation. This shifts the burden from creating the self to managing the self you find yourself inhabiting.

  2. The "capacity and opportunity" clause is forced by your contrasting cultist cases, distinguishing the 30-year-old indoctrinated member from the 60-year-old who had decades of exposure to normalcy yet remained. Without this clause, you could not explain why the passage of time and access to alternatives alters the blame profile.

  3. If a man ignores early warning signs of a violent temper for years until he assaults someone, your principle holds him responsible for the assault because he neglected the mandatory maintenance of his own volatility. This predicts blame even where the violence feels spontaneous, provided the predisposition was knowingly unmanaged.

  4. Your verdict on the stroke victim must be overturned, because if the personality change was caused by biological damage rather than neglected upkeep, he cannot be the steward of a self he did not maintain. Accepting the new self is not the same as having built or sustained it through reflective choice.

  5. The feed guy is responsible because the algorithmic drift resulted from neglected maintenance of his input habits, but this survives Maya's critique only by redefining responsibility as forward-looking stewardship rather than backward-looking ultimate desert. You are not proving humans are unmoved movers, but rather that they are liable caretakers.
