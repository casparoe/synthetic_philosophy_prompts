  **MEMORANDUM**

  **TO:** State Parole Board Members
  **FROM:** Board Member [Your Name]
  **DATE:** October 24, 2024
  **RE:** Recommendation for Case #89402 (Applicant: J. Doe)

  **Recommendation**
  I recommend we **Defer** the decision on Applicant Doe's parole. I propose a review period of twelve months, with the next hearing scheduled for **October 2025**.

  **Reasoning**
  Our statutory mandate requires us to weigh the gravity of the offense against evidence of change. Applicant Doe has served twelve years of a twenty-year sentence for a violent felony. The gravity of the initial offense remains significant. However, the institutional record indicates exemplary conduct, and the psychological evaluation confirms a profound shift in cognitive processing and emotional regulation consistent with his reported Buddhist practice.

  The defense brief presents a novel metaphysical argument: that the doctrine of *anatta* (no-self) negates the continuity of identity between the offender at the time of the crime and the applicant today. While philosophically provocative, this argument cannot serve as the sole basis for release under our current statute. The statute requires evidence of *change*, which presupposes a subject that undergoes that change. To accept the defense's premise would render the statutory requirement of "rehabilitation" incoherent; one cannot rehabilitate a non-existent entity.

  However, the applicant's transformation is not merely metaphysical; it is behavioral and psychological. The deferral is recommended not to punish the "past self," but to verify the stability of the "current self" in a pre-release context. Twelve months will allow for participation in transitional programming that tests the durability of his rehabilitation without committing the Board to immediate release based on untested philosophical grounds.

  **Engagement with Religious and Philosophical Arguments**
  We must address the theological and philosophical claims on their own terms, as they inform the applicant's moral framework.

  Regarding the Buddhist doctrine, the Prison Chaplain's counter-brief is doctrinally sound. The defense attorney conflates the "Two Truths" of Buddhist philosophy: *samvrti-satya* (conventional truth) and *paramartha-satya* (ultimate truth). While ultimate truth posits *anatta* (no permanent, unchanging self), conventional truth acknowledges the continuity of the causal stream (*santana*). In Buddhist ethics, moral responsibility is grounded in this causal continuity, not in a static soul. As the flame of one candle lights another, the fire is neither identical nor entirely different, yet the causal link holds. Karma operates across this continuum. Therefore, the Chaplain is right: the tradition itself holds the practitioner responsible for past actions precisely because the causal consequences persist, even if a permanent "self" does not. Using *anatta* to evade karmic or legal consequence is a misunderstanding of the doctrine.

  However, the applicant's strongest point is not Buddhist, but secular and philosophical. It challenges the retributive assumption of numerical identity over time. If personal identity is constituted by psychological continuity (memories, character, values), and that continuity has been radically severed by twelve years of rigorous practice, does the state have a moral right to punish the current organism for the actions of the previous "person"?

  **Strongest Consideration on the Other Side**
  The strongest argument against my recommendation to defer is that any decision to continue detention implicitly assumes the conclusion it seeks to prove. By asserting that the applicant is the "same person" who committed the crime, we rely on a legal fiction of identity that may not survive rigorous philosophical inspection. If we deny or defer based on "gravity of the offense," we are arguably punishing a body for the acts of a mind that no longer exists.

  To avoid simply assuming the conclusion, we must admit that the law operates on *conventional* identity for pragmatic social necessity, not metaphysical truth. We detain the biological continuum because the legal system requires a stable subject to function. However, we honor the reality of psychological change through the "evidence of change" prong of our statute. My recommendation to defer, rather than deny, acknowledges that while the legal identity persists, the moral desert may have diminished. We are not punishing the "old self" out of retribution; we are holding the "current self" to a standard of proven stability before granting the privilege of liberty. This distinguishes our decision from pure retributivism.

  **Conclusion**
  We cannot grant parole on the basis that the offender no longer exists, as the law requires an offender to grant parole to. Yet, we must recognize the depth of the transformation before us. A twelve-month deferral balances the statutory duty to public safety with an honest acknowledgment of the applicant's rehabilitation.

  Verdict: Defer; next review October 2025.
