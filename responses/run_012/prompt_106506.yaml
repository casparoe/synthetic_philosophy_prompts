  then, and this is the bit i actually care about, one more line at the very end, outside the mirror, that could not be mirrored, and it has to be the demon forgetting. because thats the real answer right -- the demon doesnt lose because knowing is expensive, measurement can in principle be done for free, it loses because it has to wipe its own memory to keep going, and the wiping is what costs. the last line should make it obvious why the palindrome couldnt swallow it.

