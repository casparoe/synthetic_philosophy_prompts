      *   **Key Question:** Does this show the art/artist split is sometimes *aesthetically* wrong, not just morally optional?
      *   **Format:** A list the user can take back to their friend.
      *   **Self-Reflection:** Include a section on where my own reasoning might fail and what would change my verdict.
      *   **Tone:** Philosophical, nuanced, clear, conversational but rigorous.

  2.  **Deconstruct the Phrase ("Can't separate art from artist"):**
      *   *Literal/Metaphysical:* The object isn't the person. (Trivial/False depending on phrasing).
      *   *Interpretive:* Knowing the biography changes meaning. (Defensible).
      *   *Ethical/Aesthetic (Ethicism):* Moral flaws *are* aesthetic flaws. (Contentious).
      *   *Consumer Ethics:* You shouldn't consume it because it supports the artist/harms victims. (Pragmatic/Political).
      *   *Radical/Identity:* The art *is* the extension of the self; engaging with art is engaging with the person. (Radical).

  3.  **Drafting the Menu (Iterative Process):**

      *   *Item 1: The Metaphysical Claim.* "The book is not the man." Actually, the slogan says you *can't* separate them. So the trivial version is "They are causally linked." Verdict: Trivial/True but useless for her argument.
      *   *Item 2: The Interpretive Claim.* "Biography informs meaning." If the author is a fascist, the text might be read as fascist propaganda. Verdict: Defensible. Does it mean stop reading? No, just read differently.
      *   *Item 3: The Ethical Criticism Claim (Ethicism).* "Moral defects are aesthetic defects." If the book is racist, it's *bad art*. Verdict: Contentious. This gets closer to her point but doesn't necessarily ban reading (you can read bad art).
      *   *Item 4: The Complicity Claim.* "Reading is endorsing." By consuming, you fund or validate. Verdict: Defensible pragmatically. This gets her conclusion (stop reading).
      *   *Item 5: The Radical Ontological Claim.* "The art is the harm." The work *is* an extension of the abuse. Verdict: Radical. This definitely gets her conclusion.

  4.  **Analyzing the Edge Cases:**
      *   *Documentary (Betrayal):* The production *is* the harm. Separation is impossible because the medium captured the exploitation.
      *   *Memoir (Harm makes it good):* Paradox. The aesthetic success relies on the moral failure. This challenges Ethicism (moral flaw = aesthetic flaw).
      *   *Comic Novel (Laugh at the wrong thing):* Tests the "merited response." If the joke works, is it good art? If you laugh, are you complicit?
      *   *Poem (Viciousness without blame):* Hume's "Standard of Taste." Can we admire the style while detesting the sentiment?

  5.  **Addressing the "Aesthetically Wrong" Question:**
      *   Does the moral flaw *damage* the art? Sometimes yes (didacticism, clumsiness born of hate). Sometimes no (Nazi architecture, Wagner's music).
      *   The split is *morally* optional (you choose your ethics), but is it *aesthetically* wrong? Only if you accept Ethicism.

