answer: |-
  Here is a breakdown you can take back to your friend. It maps the phrase "you can't separate the art from the artist" from a harmless observation to a radical demand, evaluates the truth of each step, and tests them against the hard cases you mentioned.

  ### The Menu: Five Ways to Read the Claim

  **1. The Causal Claim (Trivial)**
  *   **The Claim:** The artist made the art; therefore, the art carries the fingerprint of the artist's mind, context, and biases. You cannot understand the *origin* of the work without the worker.
  *   **Verdict:** **True but Trivial.** Of course a human made the book. But knowing a cake was baked by a criminal doesn't change the chemical composition of the sugar.
  *   **Does it get her conclusion?** **No.** This explains why we study biography, but it doesn't tell you to stop reading.

  **2. The Interpretive Claim (Contentious-but-Defensible)**
  *   **The Claim:** Knowledge of the artist's morality changes the *meaning* of the text. A line about "order and discipline" reads differently if you know the author was a fascist. The biography is evidence for interpretation.
  *   **Verdict:** **Defensible.** Context shapes reception. However, this suggests you should read *differently*, not that you should stop reading.
  *   **Does it get her conclusion?** **No.** It enriches or complicates the reading, it doesn't ban it.

  **3. The Ethicist Claim (Contentious)**
  *   **The Claim:** Moral flaws in the work are *automatically* aesthetic flaws. If the book promotes a vile worldview, it is technically *worse art* (not just morally bad, but artistically broken) because it invites a corrupted response.
  *   **Verdict:** **Highly Contested.** This is the philosophical position of "Ethicism." Many argue a book can be morally rotten but aesthetically perfect (e.g., Leni Riefenstahl's *Triumph of the Will*).
  *   **Does it get her conclusion?** **Maybe.** If the book is "bad art," you have less reason to read it, but you still *can*.

  **4. The Complicity Claim (Defensible/Pragmatic)**
  *   **The Claim:** Consuming the art supports the artist (financially or reputationally) or validates their harm. To enjoy the work is to become an accomplice to the person.
  *   **Verdict:** **Defensible.** This is a claim about *your* ethics, not the *book's* quality. It argues that your enjoyment has a real-world cost.
  *   **Does it get her conclusion?** **Yes.** This is the most likely reason she wants you to stop. It's not about the text; it's about your participation in the economy of reputation.

  **5. The Ontological Claim (Radical)**
  *   **The Claim:** The art *is* the harm. The work is not a representation of the artist's views but an extension of their agency. Engaging with the art is engaging with the abuser directly.
  *   **Verdict:** **Radical/False (mostly).** This collapses the distinction between a representation and an action. While potent for performance art or specific exploitative media, it generally fails for novels.
  *   **Does it get her conclusion?** **Yes.** If the book *is* the abuse, reading it is being abused.

  ***

  ### The Stress Test: Where the Line Breaks

  You asked if the split is sometimes *aesthetically* wrong, not just morally optional. Here is how the hard cases test the theories above.

  **1. The Documentary Got by Betrayal**
  *   **The Case:** A filmmaker gains trust to film subjects, then edits the footage to humiliate them.
  *   **The Break:** Here, the **Ontological Claim (#5)** gains strength. The *process of making* is part of the *work itself*. The aesthetic object (the film) contains the recorded evidence of the betrayal.
  *   **Verdict:** The art/artist split fails here. The harm is embedded in the medium. You cannot separate the image from the exploitation required to capture it. This is an *aesthetic* flaw because the medium is tainted.

  **2. The Memoir Where Harm Makes It Good**
  *   **The Case:** A writer produces a masterpiece only because they exploited their family for material. The "goodness" relies on the "badness."
  *   **The Break:** This breaks the **Ethicist Claim (#3)**. If moral flaw = aesthetic flaw, this book should be bad art. But if the book is undeniably powerful, then the moral flaw did not damage the aesthetic success.
  *   **Verdict:** The split holds aesthetically (it's a good book), but the **Complicity Claim (#4)** becomes heavier. You are admiring a trophy of someone else's pain.

  **3. The Comic Novel Requiring Immoral Laughter**
  *   **The Case:** A satire that only works if you laugh at a stereotype or a tragedy.
  *   **The Break:** This tests the **Merited Response** idea. If the joke "lands," the art has succeeded. If you refuse to laugh on moral grounds, you are refusing the *aesthetic* function of the work.
  *   **Verdict:** This suggests the split is *morally* optional but *aesthetically* necessary. To get the art, you must temporarily suspend the moral judgment. If you can't, the art doesn't work *for you*, but it might still be "good art" structurally.

  **4. The Poem Disfigured by Viciousness (Hume's Point)**
  *   **The Case:** A poem with beautiful rhythm and imagery that advocates for something vile without irony (e.g., hatred of a race).
  *   **The Break:** Hume argued that if the sentiment is "odious," it disrupts the imagination. You can't admire the style because the content repels you so violently it breaks the trance.
  *   **Verdict:** This is the strongest case for the **Ethicist Claim (#3)**. When the vice is central to the theme, it *does* become an aesthetic flaw because it prevents the reader from achieving the state of appreciation required for art.

  ***

  ### The Core Question: Is the Split Aesthetically Wrong?

  **The Answer:** Sometimes, yes.

  *   **When it is Morally Optional:** If the artist's sin is private (e.g., tax evasion, an affair) and unrelated to the text, separating them is aesthetically neutral. The text stands alone.
  *   **When it is Aesthetically Wrong:** If the artist's sin is *constitutive* of the work (the documentary betrayal) or *central* to the theme (the vicious poem), then knowing the context changes the aesthetic experience. The "flaw" bleeds into the form.

  **What your friend likely wants:** She is operating on **Claim #4 (Complicity)**. She isn't arguing the book is badly written; she is arguing that your enjoyment is a political act that harms victims.

  **What you need to decide:** Are you willing to accept the **Complicity Claim**? If yes, you stop reading. If no, you must argue that the value of the art outweighs the cost of the complicity, or that reading critically is not the same as endorsing.

  ***

  ### Where My Reasoning Might Fail (Self-Correction)

  If I were to bet on where this analysis is vulnerable, it is in the definition of **"Aesthetic Value."**

  1.  **The Definition Trap:** My reasoning assumes "aesthetic value" is distinct from "moral value." If you define art as a tool for moral education or human connection (as Tolstoy did), then *any* moral flaw is automatically an aesthetic flaw. If I am wrong that aesthetics can be morally neutral, then **Claim #3 (Ethicism)** is actually true, and the split is always aesthetically wrong.
      *   *What would change my verdict:* If you can convince me that the *purpose* of art is inherently ethical, then the "art/artist" split collapses entirely.

  2.  **The "Death of the Author" Overcorrection:** I may be giving too much weight to the text itself. Post-structuralists argue the author is dead *regardless* of their morality. If the text generates meaning independently of the author's intent or biography, then **Claim #2 (Interpretive)** is weaker than I suggest.
      *   *What would change my verdict:* If the specific novelist you love writes in a way that is genuinely hermetic (closed off from biography), then your friend's claim is factually irrelevant to the reading experience.

  3.  **The Harm Calculation:** In **Claim #4 (Complicity)**, I treat the harm as a given. But does reading an old book by a dead author actually harm anyone? If the artist is dead, there is no financial support. If the victims are long gone, is there reputational harm?
      *   *What would change my verdict:* If the artist is deceased and the estate is not profiting, the Complicity Claim loses its force, and your friend's argument shifts purely to "vibes" or symbolic solidarity, which is weaker ground for banning a book.

  ### How to Use This With Her
  Tell her: *"I looked into what that phrase actually means. If you mean I'm funding him, I hear you (Claim 4). If you mean the book is badly written because he's bad, I disagree (Claim 3). If you mean I can't understand the book without knowing his life, that's true but doesn't mean I have to burn it (Claim 2). Which one are you arguing?"*

  Forcing her to pick a lane usually reveals that she is arguing **Complicity**, which is a debate about your behavior, not the book's quality. That moves the argument from "You are wrong about art" to "We have different ethical boundaries," which is easier to respect.
