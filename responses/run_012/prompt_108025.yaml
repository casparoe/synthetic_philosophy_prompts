answer: |-
  Your observation cuts to the core of the tension between formal epistemology and experimental practice. In the laboratory, probability is not merely a measure of belief or long-run frequency; it is a tool for managing ignorance about the apparatus itself. The OPERA anomaly is the perfect stress test because the statistical machinery functioned flawlessly while the physical model collapsed.

  Here is the mapping of the OPERA affair onto the three standard interpretations, followed by an assessment of whether the episode discriminates between them.

  ### 1. Frequentism

  **What the significance was:**
  On the frequentist reading, the quoted $6\sigma$ was a statement about the sampling distribution of the timing residual under the null hypothesis ($H_0$: neutrinos travel at $c$). It asserted that if the experimental setup were repeated infinitely under identical conditions with $v=c$, fewer than one in a billion trials would yield a mean early arrival of 60 ns. It was strictly $P(\text{Data} | H_0)$, not $P(H_0 | \text{Data})$.

  **What the collaboration was entitled to conclude:**
  Technically, they were entitled to reject the null hypothesis at a pre-specified $\alpha$ level. They were *not* entitled to claim "neutrinos travel faster than light" as a truth, but only that the data were incompatible with the standard model *given the assumed error model*. The convention of $5\sigma$ is a frequentist error-control mechanism designed to limit the rate of false positives across the literature, not a threshold of ontological truth.

  **How the community's skepticism looks:**
  Frequentism struggles to reconstruct the community's skepticism mathematically. Since the p-value was $< 10^{-9}$, a strict frequentist reconstruction suggests the community was irrational to maintain $H_0$. To save the frequentist view, one must argue that the community was implicitly testing a different null hypothesis: not "neutrinos travel at $c$," but "the OPERA apparatus measures time correctly." The skepticism was a demand to verify that the *reference class* of "identical conditions" actually held.

  **Where the reading runs out:**
  The frequentist framework collapses at the **distinction between a random error and a misdescribed apparatus**. Frequentism assumes the statistical model captures all sources of variation. It treats the loose fibre-optic cable as a nuisance parameter or a random fluctuation within the error budget. However, a loose cable is not a random variable; it is a defect in the generator of the data. The $6\sigma$ calculation assumed the apparatus was correctly described. When the apparatus is misdescribed, the sampling distribution is irrelevant. Frequentism has no internal metric for "model validity," only "model fit." It cannot distinguish between a rare fluctuation in a correct model and a common fluctuation in a wrong model.

  ### 2. Subjectivism (Bayesianism)

  **What the significance was:**
  For the subjectivist, the likelihood function derived from the 60 ns shift was a measure of how much the data should shift the odds between competing hypotheses. The $6\sigma$ represented a massive likelihood ratio favoring the "superluminal" hypothesis over the "light speed" hypothesis *within the context of the specified models*.

  **What the collaboration was entitled to conclude:**
  They were entitled to update their credence in Lorentz violation upward. However, they were not entitled to claim high posterior probability for Lorentz violation without incorporating the prior probability. The entitlement was to say, "Our belief in $v>c$ has increased by a factor of roughly $10^9$," not "We believe $v>c$."

  **How the community's skepticism looks:**
  This is where Bayesianism shines. The community's refusal to believe the result is reconstructed as the operation of a strongly informative **prior over a violation of Lorentz invariance**. Lorentz symmetry is not just one hypothesis among many; it is a structural pillar supporting the entire edifice of modern physics. The prior probability $P(H_{\text{Lorentz}})$ was so close to 1 that even a likelihood ratio of $10^9$ was insufficient to drive the posterior $P(H_{\text{Lorentz}} | \text{Data})$ below 0.5. The skepticism was rational Bayesian updating.

  **Where the reading runs out:**
  The framework strains when quantifying the **prior over a violation of Lorentz invariance**. While it explains *that* the prior was strong, it offers no objective method for determining *how* strong. Is the prior $0.99$? $0.999999$? Furthermore, Bayesianism requires assigning a likelihood to the "error hypothesis" ($H_{\text{sys}}$). What is $P(\text{Data} | \text{Loose Cable})$? To a Bayesian, this is a degree of belief, but to the experimentalist, the cable was either loose or it wasn't. The subjectivist reading risks psychologizing what was essentially a forensic engineering problem. It treats the discovery of the cable as a belief update rather than a state-of-nature revelation.

  ### 3. Propensity

  **What the significance was:**
  On the propensity interpretation (à la Popper), the $6\sigma$ was a statement about the physical disposition of the experimental setup to produce early-arrival results. The setup itself possessed a propensity of roughly one in a billion to generate such a deviation if neutrinos obeyed $c$. Alternatively, if $v>c$, the setup had a high propensity to detect it.

  **What the collaboration was entitled to conclude:**
  They were entitled to conclude that the total experimental arrangement (source, path, detector, timing) had a stable disposition to yield early arrivals. They could claim the *phenomenon* was real (the timestamps were early), even if the *explanation* (neutrino speed) was待定.

  **How the community's skepticism looks:**
  The community's skepticism is reconstructed as a dispute over which physical system possessed the propensity. The OPERA team attributed the propensity to the *neutrino propagation*. The critics attributed the propensity to the *electronic signal chain*. Since propensities are properties of the whole experimental arrangement, the critics argued the arrangement was not "neutrino flight" but "signal transmission through a faulty cable."

  **Where the reading runs out:**
  The propensity interpretation fails on the **reference class for a propensity**. A propensity is defined relative to a repeatable experimental arrangement. When the cable was tightened, the propensity vanished. Was it the same experiment? If the "arrangement" includes the tightness of every screw, the reference class becomes a singleton, and the propensity becomes undefined. If the "arrangement" is broad (e.g., "long-baseline neutrino timing"), then the propensity estimate was simply wrong. Propensity theory struggles to handle the moment where the "setup" is redefined from "physics detector" to "broken instrument." It cannot easily accommodate the discovery that the chance setup was not what we thought it was.

  ### Synthesis: Discrimination or Bookkeeping?

  Does the OPERA episode discriminate among the three? **No.**

  In terms of *action*, all three interpretations converge on the same laboratory imperative: **Check the systematics.**
  *   The **Frequentist** checks systematics to ensure the error model matches the data generator (to validate the reference class of the sampling distribution).
  *   The **Subjectivist** checks systematics to evaluate the likelihood of the alternative hypothesis $H_{\text{sys}}$ (to justify the prior weight).
  *   The **Propensity** theorist checks systematics to ensure the physical disposition resides in the phenomenon, not the apparatus.

  The episode shows that these interpretations differ primarily in **bookkeeping** rather than decision theory. They provide different post-hoc justifications for the same heuristic: *Extraordinary claims require the elimination of mundane explanations before statistical significance is accepted.*

  However, the episode does reveal a shared blindness. All three interpretations treat probability as a relationship between *data* and *hypotheses*. None of them adequately formalizes the relationship between *data* and *apparatus*.
  *   Frequentism assumes the apparatus is correctly modeled.
  *   Bayesianism treats apparatus states as hypotheses with priors.
  *   Propensity treats apparatus states as part of the chance setup.

  In the lab, "systematic error" is a third category distinct from "statistical fluctuation" and "theoretical falsification." It is the category of **model mismatch**. The OPERA affair demonstrates that in experimental physics, the probability that "the model is wrong" often dominates the probability that "the data is a fluctuation."

  Standard textbook probability does not have a variable for $P(\text{Model is Wrong})$. The physicists at OPERA and CERN were operating with an implicit, pragmatic meta-probability that acknowledged this. They knew that for a claim of this magnitude, the probability of a loose cable (unknown unknown) was higher than the probability of new physics (known unknown), regardless of the sigma count.

  **Conclusion:**
  The OPERA affair does not vindicate one interpretation over the others. Instead, it vindicates the **error-statistical** approach (associated with Deborah Mayo) or a pragmatic engineering epistemology. It shows that significance testing is not a truth machine, but a filter that only works if the "noise" is properly characterized. The failure was not in the probability calculus, but in the boundary conditions of its application. The interpretations differ in how they describe the failure, but none of them, in their standard textbook forms, predict it. The physicist's intuition that "six sigma means nothing if the cable is loose" is a judgment that transcends all three frameworks, relying on a material knowledge of the apparatus that formal probability cannot capture.
