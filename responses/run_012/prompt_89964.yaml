answer: |-
  ### The Premises

  Hegel's system rests on the state being the concrete embodiment of freedom, the highest authority to which individuals owe their moral identity. Sovereignty means there is no higher power than the state; relations between states exist in a state of nature where disputes are settled by contingency, not adjudication. War is not a mere failure of law but a necessary moment where the finite is negated and the state's ethical health is preserved. Ultimate judgment belongs not to legal courts but to World History, which validates the rationality of states through their success or collapse. Individuals are subordinate organs of the state, finding freedom only within its will, not as independent moral agents standing against it.

  ### The Predicted Position

  Hegel would issue a categorical rejection of the tribunal's foundational logic, forcing a distinction that modern law refuses to make. On the first question, the proper subject of responsibility is the state, not the individual leader. For Hegel, the monarch or executive is not a private person but the apex of the state's personality, the moment of ultimate decision. To criminalize the leader is to mistake the organ for the organism. The individual will, when acting officially, is subsumed into the ethical substance of the state. Therefore, individual criminal liability for state acts is a category error; it treats sovereign acts as private crimes. The leader cannot be guilty because, in that moment, they are not acting as a moral agent but as the vessel of the state's necessity. To punish them is to punish the state's will as if it were a private whim, ignoring that the state is the actualization of freedom itself. The individual is ethically protected by the state; to strip that protection and treat them as an isolated atom is to regress to a pre-ethical condition.

  On the second question, a court above states contradicts the very nature of sovereignty. Hegel explicitly argues that while states ought to respect treaties, there can be no arbiter above them because sovereignty implies finality. A tribunal with jurisdiction over aggression presupposes a world state, which Hegel rejects as an abstraction that would dissolve the vitality of particular nations. Such a court attempts to enforce private law categories onto public ethical life. It assumes a universal will that does not exist outside the concrete reality of specific states. The tribunal is, in his terms, an illegitimate abstraction. It claims an authority that belongs only to the dialectic of history itself. Between states, there is only a state of nature, where disputes are settled by contingency and war, not adjudication. To impose a court is to deny the state's independence, reducing it to a corporation within a higher polity, which destroys its ethical standing. There is no higher concrete universal to enforce such law.

  On the third question, punishing a leader who acted for their state's historical mission is not justice but the vengeance of the victor. Hegel reserves judgment for World History, not contemporary courts. If the war served the progression of the World Spirit, the leader is justified regardless of contemporary morality. This is the doctrine of the World-Historical Individual: great leaders violate ordinary ethics to bring about a new epoch. They are not bound by the moral codes of their time but by the necessity of the future. If the state fails, history judges it by its collapse, not by a gavel. Therefore, the tribunal cannot distinguish justice from success. It merely codifies the power of the winner. Hegel would argue that true accountability comes only when the state itself ceases to be rational and perishes, not when a person is imprisoned. This reconstruction relies on Hegel's rigid distinction between "Morality," which governs individual intent, and "Ethical Life," which governs state action. While Hegel does not explicitly address war crimes tribunals, his metaphysics of sovereignty leaves no room for external criminalization of the sovereign will. The concept of aggressive war assumes a status quo of peace that Hegel views as stagnant; war is a moment of ethical health. The discomfort lies in the implication: under this system, the tribunal is ethically blind, capable only of punishing the defeated, never the unjust who succeed. It renders the court a tool of politics rather than a vessel of right. The leader stands before you not as a criminal, but as a failed world-historical agent, and your judgment is merely the confirmation of that failure, not its cause.

  ### The Counter-Case

  The strongest objection arises from Hegel's insistence that the state must be rational, not merely powerful. If a leader initiates war based on private caprice rather than the substantial will of the state, they act as a private individual, not a sovereign. In such a case, they violate the internal constitution and could be liable for treason, not aggression. Hegel condemns the "vanity" of rulers who treat the state as property. If the tribunal could prove the war served only the leader's ambition and harmed the state's ethical substance, Hegel might concede liability. However, the reconstruction is underdetermined at the point of epistemic access. How can a court distinguish between a necessary historical risk and private caprice? Hegel assigns this knowledge to World History retrospectively, not to judges contemporaneously. There is no textual basis for Hegel to allow an external body to make this distinction. He trusts the internal constitutional checks to prevent caprice, not external courts. Thus, while internal treason is possible, external criminal liability remains incompatible with his system. The ambiguity lies in whether "aggression" is inherently irrational or merely unsuccessful.

  ### The Testimony

  "Your Honors, I must be plain. On Hegel's premises, this court has no jurisdiction over the accused. He was the state's will, not a private agent. To punish him is to punish the sovereignty you claim to protect. You argue he broke the law of nations; Hegel argues no such law exists above the state. You seek justice; Hegel says you seek only the verdict of success. If his war was necessary, you cannot judge him. If it was not, history has already judged him by his defeat. Your gavel adds nothing but vengeance. I testify that according to the philosophy you invoke to understand the state, this trial is a category error. You are not a court of justice. You are the World Spirit wearing a robe, and you only speak after the blood is dry."
