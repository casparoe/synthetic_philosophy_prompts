answer: |-
  ### The practice, as best I can tell

  Institutions systematically reject positive expected-value (EV) gambles involving extreme tails. Insurers charge premiums exceeding expected losses and enforce strict liability caps; casinos impose table limits; no one sells a St. Petersburg ticket at market price. This contradicts the naive EV rule you taught: maximize the sum of probability times payoff. If value were linear in money and probabilities weighted objectively, these institutions would be irrational. They would accept infinite liability for infinite EV or sell insurance at actuarial cost. The practice implies that maximizing expected money is not the goal. Instead, they maximize something else that diverges from linear money accumulation. The puzzle is identifying the structural constraint on value that makes rejecting infinite EV rational. It suggests the EV rule applies to *utility*, not cash, and that utility behaves differently than cash.

  ### What it can't do without

  The practice cannot survive without abandoning the linearity of value in money. Specifically, it requires that marginal utility of wealth diminishes, and for the St. Petersburg case, that utility is bounded above. If utility were linear, infinite expected money implies infinite expected utility, making any finite price rational. To reject St. Petersburg, there must be a ceiling on value; no outcome can be infinitely better than another. For insurance, the commitment is slightly weaker but related: utility must be concave. You must value the first million dollars more than the second. This concavity explains paying above EV to avoid ruinous loss. The non-negotiable commitment is that money is merely an instrument for utility, and the utility function is non-linear. Furthermore, the practice presupposes that survival (avoiding ruin) is a precondition for future utility, making "zero wealth" a discontinuity or asymptote. Without bounded or sufficiently concave utility, the mathematics of EV forces acceptance of gambles that threaten existential ruin. The institution acts as a single agent with a utility function, not a linear calculator. It commits to the view that rational choice maximizes expected utility, not expected value, and that utility saturates. It demands that the utility function $U(x)$ satisfies convergence conditions relative to probability decay. Without this mathematical property, the behavior is indefensible. The practice is essentially an embodied proof that $E[U] \neq U(E[x])$. It asserts that the value of a gamble is not the value of its average outcome. This implies a hierarchy of goods where survival trumps accumulation. The practice treats the preservation of the agent as lexically prior to the maximization of assets. Without this lexical priority or bounded utility, the EV calculation dominates. Therefore, the practice cannot do without a theory of value that places limits on accumulation or weights survival disproportionately higher than gain.

  ### What it merely fits

  Several theories fit this behavior without being required. Prospect Theory fits: it suggests people overweight small probabilities and underweight large ones. This explains buying lottery tickets and insurance simultaneously, but the institutional practice doesn't need cognitive bias; it works with objective probabilities if utility is curved. Discounting the future fits: if future utility is discounted, infinite streams become finite. But institutions cap single-shot liabilities too, so temporal discounting isn't strictly necessary. Administrative costs fit: caps exist because verifying huge claims is expensive. But this doesn't explain rejecting St. Petersburg where verification is trivial. Similarly, the idea that "tiny probabilities are effectively zero" fits the behavior but isn't required; if utility is bounded, you can weight the probability correctly and still reject the bet. These are sufficient conditions, not necessary ones. The practice is compatible with psychological quirks, but it doesn't presuppose them. It works even for perfectly rational, unemotional agents provided their utility function isn't linear. Moral hazard fits too: caps prevent clients from causing losses intentionally. But again, this explains the cap, not the premium pricing above EV. The practice sits comfortably with regulatory requirements or capital adequacy rules, but these are external constraints, not internal value commitments. The behavior is robust across these different explanations, which is why it's hard to isolate the core philosophical driver.

  ### Where it's underdetermined

  The practice is heavily underdetermined. You cannot infer the specific utility function from the cap alone. A logarithmic utility function, a bounded utility function, or a risk-weighted probability model all produce similar capping behavior. This addresses your actuary question: using EV for the bulk and caps for tails isn't a contradictory hybrid; it's an approximation of Expected Utility Theory. If the utility function is nearly linear for small changes (bulk) but curves sharply near ruin (tails), calculating EV of money works for daily operations, while caps protect against the non-linear region. The practice doesn't decide between EUT and Prospect Theory. It doesn't decide between bounded utility and heavy-tailed probability discounting. Observationally, an agent who ignores probabilities below $10^{-6}$ looks identical to an agent with bounded utility facing those probabilities. The institution's behavior licenses multiple metaphysical views on value. We know money isn't linear value, but we don't know exactly how it curves solely from the existence of caps. The actuary's hybrid view hangs together perfectly under EUT. It's not EV-right-in-bulk/wrong-in-tail; it's EV-of-money is a proxy for EV-of-utility. The proxy is good in the linear region, bad in the curved region. The practice underdetermines whether the curvature comes from the agent's psychology or the objective necessity of survival. It leaves open whether value is bounded globally or just locally relative to current wealth.

  ### How sure I am, and my weakest point

  I am highly confident that non-linear utility is the necessary condition. Linear utility plus infinite EV forces accepting any price. Rejecting the price requires breaking linearity. My weakest point is attributing this to "value saturation" rather than a "survival constraint." Institutions might cap not because utility saturates, but because bankruptcy is a hard physical constraint where the agent ceases to exist. If ruin means the agent disappears, EV maximization is undefined, not just wrong. Distinguishing between "utility bounded by satisfaction" and "utility undefined at zero" is subtle. The practice proves money isn't linear value, but whether that's due to psychological saturation or physical extinction is less clear. I am less certain about the source of the non-linearity than its existence.
