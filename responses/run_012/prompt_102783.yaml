answer: |-
  ### Desiderata for an Analysis of Effective Computability

  To count as an adequate analysis of the pre-formal notion of effective computability (rote calculation with unbounded resources), a proposal must satisfy the following requirements.

  **1. Extensional Adequacy (The Ackermann Constraint)**
  *   **Requirement:** The analysis must capture all functions intuitively recognizable as effectively computable.
  *   **Motivation:** The Ackermann function is computable by a clear, finite procedure but is not primitive recursive. An analysis identifying effective computability with primitive recursion (e.g., early Hilbertian views) fails because it excludes intuitively computable functions.
  *   **Status:** **Non-negotiable.** (Failure here means the analysis targets the wrong notion.)

  **2. Intensional Exclusion (The Busy Beaver Constraint)**
  *   **Requirement:** The analysis must exclude functions that are well-defined but not effectively computable.
  *   **Motivation:** The Busy Beaver function is mathematically definite but cannot be computed by rote. An analysis that is too permissive (e.g., "any function definable in arithmetic") falsely classifies uncomputable functions as effective.
  *   **Status:** **Non-negotiable.** (Failure here destroys the distinction between computable and uncomputable.)

  **3. Non-Circularity (The Non-Triviality Constraint)**
  *   **Requirement:** The analysis cannot define the pre-formal notion *stipulatively* as "computability-by-Turing-machine."
  *   **Motivation:** If "effective" just *means* "TM-computable," the Church–Turing Thesis (CTT) becomes a definition. This renders the thesis trivially true but epistemically inert; it cannot explain *why* TMs capture the intuitive notion, only that we decided they do.
  *   **Status:** **Non-negotiable** (for a substantive thesis); **Rejected** by the Definitional/Convention camp.

  **4. Explanatory Robustness (The Convergence Constraint)**
  *   **Requirement:** The analysis must explain, not merely cite, the equivalence of Turing machines, lambda calculus, recursive functions, and register machines.
  *   **Motivation:** The convergence of distinct formalisms is the primary evidence for CTT. An adequate analysis must show *why* these distinct paths lead to the same extension (e.g., by isolating a shared underlying constraint on information processing), rather than treating the convergence as a lucky accident or brute evidence.
  *   **Status:** **Non-negotiable.** (An analysis that cannot account for robustness is explanatorily weak.)

  **5. Epistemic Transparency (The Justification Constraint)**
  *   **Requirement:** The analysis must explicitly state the modal status of the thesis (necessary, contingent, conceptual) and the grounds for accepting it.
  *   **Motivation:** Since the pre-formal notion admits of no mathematical proof, the justification must be philosophical (conceptual clarification) or empirical (inductive generalization). Ambiguity here obscures whether CTT is a claim about minds, mathematics, or physics.
  *   **Status:** **Non-negotiable.**

  **6. Physical Scope (The Hypercomputation Constraint)**
  *   **Requirement:** The analysis must specify whether CTT constrains physical computing devices or only idealized mathematical agents.
  *   **Motivation:** Analog machines with unbounded real-valued precision or quantum relativistic computers propose "hypercomputation." The analysis must determine if these are ruled out by the *concept* of effective computability or merely by the *contingent laws of our physics*.
  *   **Status:** **Camp Preference.** (Mathematical CTT proponents say physical realizability is irrelevant; Physical CTT proponents say computability is a property of physical systems.)

  ---

  ### Tensions and Conflicts

  **The Fatal Pair: Extensional Adequacy + Non-Circularity**
  You correctly identify the central friction. To satisfy **Extensional Adequacy** (including Ackermann, excluding Busy Beaver), the analysis must be precise enough to draw a sharp boundary. However, **Non-Circularity** forbids using the formal boundary (TMs) to draw that line.
  *   **Result:** This drives the thesis toward **unprovability**. If you rely on the vague pre-formal notion to set the boundary, you cannot prove equivalence to TMs without begging the question. If you refine the pre-formal notion (e.g., via Gandy's principles for discrete deterministic mechanical devices) to make it precise enough for proof, critics argue you have merely rebuilt the Turing machine in disguise, risking **triviality**.
  *   **Impact on other requirements:** If this pair forces unprovability, **Explanatory Robustness** suffers. You can note the convergence of formalisms, but you cannot rigorously derive it from the analysis of the informal notion. You are left with inductive confidence rather than deductive security.

  **Physical Scope vs. Underwriting Unsolvability**
  There is a severe incompatibility between **Physical Scope** (interpreted empirically) and the standard role of CTT in logic.
  *   **Conflict:** Computability theory underwrites unsolvability results (e.g., the Halting Problem) as *logical* impossibilities. If CTT is an **Empirical Hypothesis** about physical devices (Physical Scope), then unsolvability becomes a *contingent* fact about our universe's physics. A hypercomputer in a different physical regime would make the Halting Problem solvable *there*.
  *   **Compatibility:** They are **incompatible** if one demands that unsolvability results hold necessarily. If CTT is physical, the "absolute" unsolvability of the Halting Problem collapses into "unsolvability given current physics." To maintain the logical force of unsolvability, CTT must be insulated from physical scope (Mathematical CTT), rendering the Physical Scope requirement irrelevant to the core thesis.

  ---

  ### Verdict on Standard Construals

  **1. CTT as Definition/Convention**
  *   **Verdict:** **Fails.** Satisfies Non-Circularity only by rejecting it. Renders the thesis trivial and fails Epistemic Transparency (hides the substantive claim).

  **2. CTT as Empirical Hypothesis**
  *   **Verdict:** **Fails.** Satisfies Physical Scope but sacrifices the necessity of unsolvability results. Vulnerable to falsification by exotic physics, undermining the mathematical stability of computability theory.

  **3. CTT as Conceptual Analysis**
  *   **Verdict:** **Best Fit.** Satisfies Non-Circularity and Epistemic Transparency by treating CTT as a claim about the concept of "effective procedure." It preserves the necessity of unsolvability results. However, it struggles with Physical Scope (cannot rule out physical hypercomputation *a priori*) and remains vulnerable to the "unprovability" charge inherent in the Fatal Pair.
