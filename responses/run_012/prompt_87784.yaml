  *(Refining the "Weakening" suggestion)*: If the list is jointly unsatisfiable, which one goes? Usually, it's the demand for *algorithmic* reasons (part of 7) or the demand for *determinate truth values* for unencountered works (9). I'll suggest 9 needs a dispositional rather than categorical reading.

