      *   *Hume:* Keep it brief as requested. Don't let it overshadow the criteria.

  8.  **Final Polish:** Check against the prompt's specific phrasing requests ("Treat a theory of taste as...", "Write the desiderata...", "Then do the two things I most need..."). Ensure the distinction between "genuine constraints" and "camp commitments" is clear.

  *(Self-Correction on Requirement 9)*: Is it a genuine constraint that a theory must account for unencountered works? An error theorist or expressivist might say "No." So I must label this carefully as a point of contention, likely a realist commitment disguised as a desideratum. I will flag this in the "Constraints vs. Commitments" section.

