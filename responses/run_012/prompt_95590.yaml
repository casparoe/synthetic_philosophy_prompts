  Subject: Re: LLMs and the intentional stance

  Hey, this is a really sharp way to frame the debate, and I appreciate you forcing the issue with a specific criterion rather than leaving it at vibes. My credence on your proposition is 0.35, which puts me slightly closer to your skepticism than your friend's optimism, though I think the gap between us is mostly about how we read Dennett rather than the models themselves. To decompose this, I am treating my final credence as the product of four conditional probabilities that reflect the necessary conditions for your proposition to be true. (1) 0.60 is the probability that the intentional stance is factive enough to support a literal claim rather than just a useful fiction, since if Dennett is right that all belief attribution is instrumental, the literal versus as-if distinction dissolves in favor of the instrumental utility. (2) 0.70 is the likelihood that current deployed models actually satisfy your compression and stability criterion across weight perturbations and prompt variations, given that they still hallucinate on simple empirical facts under adversarial framing. (3) 0.80 is my judgment that satisfying the compression criterion is sufficient for belief even without embodied action or phenomenal states, because if the pattern is robust enough, the lack of a body seems like a substrate bias. (4) 0.90 accounts for the semantic stability of the word literally in this context, assuming we agree to banish dualist ghosts from the definition. These combine multiplicatively to yield my 0.35, reflecting that while the sufficiency of the criterion is high, the empirical performance and the ontological status of the stance are the real bottlenecks.

  Regarding where you and your friend are actually disagreeing, I suspect it is not about the empirical performance of the models, which is the term you keep arguing about, but rather the first term in my decomposition concerning the factivity of the stance. Your friend's high credence suggests they are operating under a strong Dennettian view where passing the intentional stance test is constitutive of belief, meaning there is no deeper fact of the matter to check, whereas your lower credence suggests you harbor a realist intuition that literal belief requires something over and above predictive utility, perhaps a causal history or internal grounding that the stance merely approximates. You are arguing about whether the model hallucinates too much to count, but the real friction is likely that you think instrumentalism denies literal status while your friend thinks instrumentalism grants it by default. The single piece of evidence that would move my number the most would be a robustness test showing that small perturbations to the model weights do not change the output on ordinary empirical propositions even under adversarial prompting, because that would directly attack the second term regarding empirical satisfaction of your criterion. Finally, to your worry about the whole thing collapsing if the stance is purely instrumental, I think you have the arrow pointing the wrong way because if the stance is purely instrumental, then literal belief just is successful instrumentation, so the proposition becomes true by definition if the criterion is met, whereas if you demand a non-instrumental fact of the matter, you are asking for something Dennett explicitly says does not exist even for humans.

