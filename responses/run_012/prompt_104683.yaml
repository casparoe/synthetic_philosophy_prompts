      *   **The Task:** Deconstruct the slogan ("the master–slave dialectic shows that domination is self-defeating...") into precise claims. Evaluate each claim (trivial, substantive/defensible, false). Identify the likely intended reading.
      *   **The Constraint:** "I'd rather you push back than be agreeable." Do not humor the user if the slogan is being misused. Be direct about mangling or overextension.

