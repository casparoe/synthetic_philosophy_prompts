          *   Type: Empirical/Psychological.
          *   Evaluation: False/Overextended. Hegel isn't doing psychology.

  4.  **Drafting the Evaluation (Iterative Process):**

      *   *Tone Check:* Needs to be sharp, analytical, slightly pedantic (in a good way), matching the LessWrong vibe. Avoid fluff.
      *   *Pushback:* I need to explicitly state that using Hegel to explain bullying is category error.
      *   *Distinctions:* Causal vs. Normative is crucial here. Most commenters mean causal (the master *needs* the slave to survive/be happy), but Hegel means normative (the master *needs* the slave for *valid* recognition).

  5.  **Refining the Claims (The List):**

