  **OFFICE OF PUBLIC UTILITY**
  **MEMORANDUM NO. 449-B**
  **SUBJECT: FELICIFIC AUDIT OF STATUTES REGARDING CARNAL IRREGULARITIES**

  **1. Mandate**
  Pursuant to the directive to assess all penal expenditures against the Principle of Utility, the undersigned has applied the Hedonic Calculus to existing prohibitions on sodomy and unnatural offences. The objective is to determine whether the pain inflicted by punishment exceeds the pain prevented by prohibition.

  **2. The Seven Dimensions**
  **Intensity & Duration:** The pleasure derived from the proscribed acts is assessed as moderate and transient. The pain of punishment (execution or transportation) is extreme and permanent. The balance sheets heavily negative.
  **Certainty & Propinquity:** Punishment is uncertain due to the private nature of the acts, but proximate upon discovery. This uncertainty generates a specific class of pain detailed in Section 3.
  **Fecundity:** The acts are non-generative; thus, no future pleasure via offspring is recorded. However, the punishment generates significant fecundity of pain among the convicted's dependents.
  **Purity:** Here the calculus encounters an irregularity. Purity measures the chance of pleasure not being followed by pain. In this instance, the pain follows not from the act's physical consequences, but from the statutory reaction. Furthermore, the column for Purity has begun to accumulate values labeled "Moral Stain." This appears to be a categorization error, as "stain" is not a sensible pain. Yet, the ledger demands entry. The figure grows disproportionately, suggesting the statute itself is impure, or perhaps the clerk is measuring the taint on the law rather than the actor. This column requires calibration.

  **3. Secondary Pains (Concealment)**
  A significant portion of the total disutility arises not from the act, nor the punishment, but from the fear of both.
  *   **Anxiety of Discovery:** Constant apprehension recorded among subjects.
  *   **Blackmail:** A parasitic industry has emerged, extracting wealth under threat of exposure. This is a direct pain generated by the law's existence.
  *   **Concealment:** The labor required to hide natural inclinations produces chronic psychological distress.
  *   **Total:** These secondary pains outweigh the primary pleasure of the act by a factor of four. The law functions as a manufactory of misery rather than a preventer of harm.

  **4. The Unnaturalness Variable**
  Instruction was given to assign zero weight to arguments from "Nature" or "Religion," as these are not sensible pains. This was done. However, under the dimension of **Extent** (Public Disapprobation), a massive entry appears. The public feels intense displeasure at the mere knowledge of these acts. When summed, this disapprobation justifies the punishment entirely.

  **5. Observation**
  The undersigned notes that the "Public Disapprobation" entry is identical in magnitude to the discarded "Unnaturalness" argument. It appears the public's dislike is solely founded on the claim of unnaturalness, which was deemed valueless. Thus, a zero-value premise has re-entered the sum as a high-value sentiment. The calculus currently validates the law only because the public dislikes the behavior the law prohibits.

  **6. Recommendation**
  Net utility is negative unless Disapprobation is counted. Whether the displeasure of spectators regarding private conduct should count as a pain to be prevented is unclear. This office lacks the authority to determine if prejudice constitutes utility. Matter referred to Superiors for further instruction.

  ***

  **Note on Scholarship and Invention**

  Bentham's writings on sex (particularly in *Offences Against One's Self*) are indeed contested. While he famously argued that consent-based sexual acts produce no mischief, scholars debate whether he fully escaped the prejudices of his time regarding age and public decency. The document above treats his utilitarianism as more rigidly secular than some manuscripts suggest; Bentham sometimes acknowledged "popular prejudice" as a real pain to be managed, even if irrational.

  Regarding invention: The bureaucratic format of a "Felicific Audit" is fictional; Bentham never institutionalized his calculus this way. Additionally, the "Purity" glitch in Section 2 invents a confusion between moral stigma and physical sequelae. For Bentham, Purity strictly concerned the likelihood of pleasure being followed by pain (e.g., hangovers), not moral taint. This distortion is intentional to show the clerk struggling to quantify the unquantifiable, but it is a theoretical exaggeration, not a historical feature.
