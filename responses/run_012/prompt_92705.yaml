answer: |-
  Your hunch is correct, but "intervention" alone is insufficient. You can intervene on a chess engine's output by changing its code, but that doesn't make its "wants" real. You can intervene on a stock price by spreading rumors, but that doesn't make the market's "fears" real.

  The missing ingredient is **who (or what) does the work to keep the pattern true.**

  Your verdicts are sorted by **The Principle of Homeostatic Leverage.**

  A pattern is ontologically real if and only if it satisfies three clauses:

  1.  **Internal Maintenance:** The system possesses internal causal mechanisms that actively work to preserve the pattern's coherence against environmental noise or perturbation.
  2.  **Causal Leverage:** Interventions targeting the pattern succeed by engaging these internal maintenance mechanisms, not merely by exploiting statistical regularities contingent on the observer's classification.
  3.  **Model Invariance:** The pattern persists and remains actionable even if the observer changes their descriptive model or measurement tool, provided the system's internal physics remain unchanged.

  ### How the Clauses Sort Your Verdicts

  Each clause is forced by a specific tension in your list.

  **Clause 1 (Internal Maintenance) is forced by *Species vs. National Character*.**
  Both have statistical boundaries drawn by us. Both predict behavior. But a species has a biological lineage and reproductive isolation mechanisms that *fight* to keep the cluster together. "National Character" is an aggregate average; if you perturb a nation, there is no internal mechanism striving to restore the "character." It dissolves.
  *   *Verdict:* Species = Real. National Character = Fiction.

  **Clause 2 (Causal Leverage) is forced by *Bacteria vs. Chess Engine*.**
  Both are predictable via the intentional stance. But if you block the bacteria's path, it activates alternative search mechanisms to satisfy the "want." It fights for the sugar. If you block the chess engine's preferred move, it does not "strive"; it simply calculates the next highest value. There is no internal drive, only an external objective function.
  *   *Verdict:* Bacteria Wants = Real. Engine Wants = Fiction.
  *   *This also solves your Colony/Market tension:* The colony reproduces and defends itself (Maintenance). The market "expects" via arbitrage mechanisms (Levers exist). The market "fears" has no mechanism to manipulate; you cannot trade on "fear" directly, only on the price adjustments caused by information.

  **Clause 3 (Model Invariance) is forced by *Hurricane vs. Output Gap*.**
  A hurricane exists regardless of how you measure wind speed. An output gap *is* the measurement; change the model of "potential GDP," and the gap vanishes or inverts. It is a residual of the ruler, not a feature of the land.
  *   *Verdict:* Hurricane = Real. Output Gap = Fiction.

  ### Resolving Your Troubling Pairs

  **1. The Colony vs. The Market**
  *   **Colony:** Satisfies Maintenance (swarming/reproduction) and Leverage (you can starve it or feed it as a unit). **Real Agent.**
  *   **Market:** "Expectations" satisfy Leverage (forward guidance moves prices via arbitrage). "Fear" fails Maintenance (no homeostatic mechanism restores "calm"). **Real Expectations, Fictional Fear.**
  *   *Why the distinction holds:* The colony is a *unit of selection*; the market is a *mechanism of clearance*. One fights to survive; the other clears to equilibrium.

  **2. The Neural Feature vs. The LLM Persona**
  *   **Feature:** Satisfies Invariance. Transplant the weights to a new task, and the feature still fires. It is structurally embedded. **Real Representation.**
  *   **Persona:** Fails Maintenance. Remove the system prompt, and the persona vanishes. It is not a sub-module; it is a boundary condition imposed from the outside. **Fictional Shadow.**

  ### The Cost of This Principle

  To save all your verdicts, this principle costs you **Physical Reductionism.**

  You must accept that "Real" does not mean "Made of Atoms." A hurricane, a colony, and a market expectation are all real patterns, even though none are fundamental particles. They are real because they are *causally autonomous loops*.

  Conversely, you must accept that some things made of atoms are not "Real Kinds" in this sense. A specific pile of sand is atoms, but "The Pile" has no maintenance mechanism. If I take a grain away, the pile doesn't fight to restore itself. It is a convenience of description.

  If you are unwilling to pay this price—if you demand that only atoms are real—you must overturn your verdict on the **Ant Colony** and the **Hurricane**. They are patterns, not particles. But given your list, I assume you are willing to pay it.

  ### The Regime Type Verdict

  **Case:** Democracy, Hybrid, Autocracy.
  **Application:**
  1.  **Maintenance:** Do these systems work to preserve themselves? Yes. Democracies have elections and norms that correct deviations. Autocracies have security apparatuses that suppress deviation. They actively fight to maintain their structure.
  2.  **Leverage:** Can you intervene using these labels? Yes. Sanctions target autocracies differently than aid targets democracies. The labels map to causal levers.
  3.  **Invariance:** If political scientists change their classification model, does the regime collapse? No. The institutions persist despite the label shift.

  **Verdict:** **Regime Types are Real Kinds.**
  Like species, their boundaries are fuzzy and contested (is Hungary a democracy?), but the underlying causal machinery (voting vs. coercion) is robust and homeostatic. They are not mere statistical aggregates like "National Character."

  ### A New Case: The Phantom Traffic Jam

  **Case:** A traffic jam that forms without an accident or bottleneck, simply due to density and braking propagation.
  **Application:**
  1.  **Maintenance:** Does it preserve itself? Yes. The jam moves backward against the flow of cars. It sustains its shape through the feedback loop of braking drivers.
  2.  **Leverage:** Can you intervene? Yes. Variable speed limits or autonomous cruise control can dissolve the jam by breaking the feedback loop.
  3.  **Invariance:** Does it exist if you change how you count cars? Yes. It is a physical wave of density.

  **Verdict:** **The Traffic Jam is a Real Object.**
  *Why this might surprise you:* It feels like an absence (of flow). It has no central controller (like the market). It is made of independent agents (drivers). Yet, under the Principle of Homeostatic Leverage, it is as real as the hurricane. It is a self-maintaining structure that does work (dissipating kinetic energy) and allows for intervention.

  ### Summary

  Your friend's compression principle is too broad; it makes heuristics real. Your intervention hunch was close but needed the constraint of *internal maintenance*.

  **The Principle of Homeostatic Leverage** saves your list. It grants reality to things that *fight to stay themselves* (hurricanes, bacteria, colonies, regimes, traffic jams) and denies it to things that are merely *described as staying themselves* (chess wants, market fears, output gaps, personas).
