answer: |-
  It is a pleasure to meet a colleague from the deep time side of the fence. Your frustration is entirely warranted. As a palaeontologist, you know that "you weren't there" is the default state of the universe; science is the art of building bridges over that gap using physical traces. When philosophers use "just-so story" as a conversation stopper, they are often waving a hand at a methodological problem they haven't bothered to specify.

  The phrase originates with Gould and Lewontin's 1979 paper, *The Spandrels of San Marco and the Panglossian Paradigm*, but in seminar rooms, it has mutated into a multi-purpose weapon. To help you parry it, here is the menu. There are three distinct claims hiding behind that phrase. They are not the same, they do not stand or fall together, and only one of them is a serious methodological objection that survives comparison with palaeontology.

  ### Item 1: The Unfalsifiability Charge
  **The Claim:** The hypothesis is constructed such that no possible observation could prove it false. It is compatible with any outcome.
  *   **Status:** **Plainly False** (when applied to the field generally), but **Serious** (when applied to specific, sloppy hypotheses).
  *   **What the Seminar Means:** They likely mean this, but they are using it loosely. They assume that because the past is unobservable, the explanation is immune to disproof.
  *   **Scope:** If true, it kills the specific hypothesis, but not the field. Good evolutionary psychology (EP) makes risky predictions (e.g., about cross-cultural universals or developmental triggers).
  *   **The Palaeontology Comparison:** This collapses under your comparison. A claim about a *T. rex* bite force is falsifiable by bone mechanics and stress fractures. A claim about a psychological adaptation is falsifiable by cognitive testing or cross-cultural variance. If an EP hypothesis is truly unfalsifiable, it is bad science, but that is a sin of the practitioner, not the discipline.
  *   **Does it sink the field?** No. It only sinks hypotheses that are too vague to test.

  ### Item 2: The Adaptationist Presumption (The "Spandrel" Charge)
  **The Claim:** The hypothesis assumes the trait is an adaptation selected for a specific function, ignoring alternative explanations like genetic drift, phylogenetic inertia, or byproducts (spandrels).
  *   **Status:** **Serious Methodological Objection.**
  *   **What the Seminar Means:** This is the sophisticated reading. They are accusing the EP researcher of assuming optimality. "You see a trait, you assume it was selected for, you invent a benefit."
  *   **Scope:** This tells against *naive adaptationism*, not EP as a whole. It demands that researchers rule out non-adaptive hypotheses before settling on an adaptive one.
  *   **The Palaeontology Comparison:** You face this too. You find a crest on a dinosaur. Is it for mating display (adaptation), thermoregulation (adaptation), or just structural growth allometry (byproduct)? You don't say "It's a display crest" without ruling out the structural constraints. If an EP researcher skips the "null hypothesis" of non-adaptation, the charge sticks.
  *   **Does it sink the field?** No. It demands a more rigorous methodology (comparative phylogenetics, cost-benefit analysis).

  ### Item 3: The Circular Reconstruction Charge (The "Independent Evidence" Charge)
  **The Claim:** The hypothesis infers the ancestral environment *from* the trait, and then uses that inferred environment to explain the trait. There is no independent evidence for the selection pressure.
  *   **Status:** **The Only Defensible "Just-So" Charge.**
  *   **What the Seminar Means:** This is usually the precise point they are groping for, even if they articulate it poorly. They are saying: "You posit a 'scarcity' environment because you see a 'sweet tooth,' and you explain the 'sweet tooth' by the 'scarcity' environment. Where is the evidence for the scarcity other than the tooth itself?"
  *   **Scope:** This is devastating to specific hypotheses that lack independent anchoring. It does not condemn the field, but it condemns any specific claim that relies solely on the existence of the trait to prove the selection pressure.
  *   **The Palaeontology Comparison:** **This is the critical divergence.** In palaeontology, you rarely infer the environment *solely* from the tooth. You have the sediment, the pollen, the isotopes, the associated fauna. You have independent traces of the "selection pressure" (the environment). In EP, the "Environment of Evolutionary Adaptedness" (EEA) is often reconstructed theoretically. If you cannot point to independent anthropological or archaeological evidence for the proposed pressure, you are indeed telling a just-so story.
  *   **Does it sink the field?** No. It only sinks hypotheses where the EEA is assumed rather than evidenced.

  ***

  ### Applying the Menu to Your "Sweet Tooth" Case

  You defended the claim that our preference for sugar/fat is an adaptation to past scarcity. A philosopher called this a just-so story. Let's run it through the menu.

  1.  **Unfalsifiable?** No. We could find cultures with no preference for sugar (we haven't), or show that the preference is purely cultural (it isn't; infants show it).
  2.  **Adaptationist Presumption?** Maybe. Could the preference be a byproduct of how mammalian taste receptors develop, rather than a selected module? Possible, but unlikely given the caloric stakes.
  3.  **Circular Reconstruction?** **This is where they likely attacked.**
      *   *The Trap:* If your argument was "We like sugar because it was scarce, and we know it was scarce because we like sugar," they are right. That is circular.
      *   *The Defense:* To defeat the charge, you need independent evidence of the EEA. You need to cite palaeobotany (fruit availability), isotopic analysis of hominid teeth (dietary composition), and comparative primatology (chimpanzee caloric foraging).
      *   *The Verdict:* The "Sweet Tooth" hypothesis is actually one of the *strongest* in EP because the physiological mechanism is well-understood and the ecological pressure (caloric density) is universal. If they dismissed this without engaging the physiological or archaeological evidence, they were using "just-so story" as a slur, not an argument.

  ***

  ### The Strongest Defensible Version of the Charge

  If you want to corner a critic who throws this line out, ask them to satisfy the **Independent Evidence Condition**.

  To make the "just-so story" charge stick in a concrete case, a critic must show:
  1.  That the proposed selection pressure (e.g., scarcity) is inferred *only* from the existence of the trait (e.g., sweet tooth).
  2.  That there is no independent archaeological, anthropological, or comparative biological evidence for that pressure existing in the EEA.
  3.  That a non-adaptive explanation (drift, byproduct) fits the data equally well.

  If they cannot show those three things, they are not doing philosophy of science; they are doing gatekeeping.

  ### Summary for your next Seminar

  *   **Most likely meaning:** They mean **Circular Reconstruction** (Item 3). They think you are assuming the past environment to explain the present mind without proving that environment existed.
  *   **Is it a platitude?** Often, yes. It is used to dismiss historical inference generally.
  *   **Does it sink EP?** No. It only sinks hypotheses that fail to bring in independent evidence (archaeology, primatology, genetics).
  *   **The Palaeo Defense:** You are right. "You weren't there" is not a special problem for EP. It is the problem of *all* historical science. The solution in both fields is the same: **Consilience.** Do not rely on one line of evidence. If the tooth matches the sediment matches the isotope matches the model, it is not a story; it is an inference to the best explanation.

  Next time someone drops the line, ask them: *"Are you objecting that the hypothesis is unfalsifiable, or that I lack independent evidence for the selection pressure? Because if it's the latter, I can cite the isotopic data. If it's the former, I'd like to see your falsification conditions for your own field."*

  That usually clears the room.
