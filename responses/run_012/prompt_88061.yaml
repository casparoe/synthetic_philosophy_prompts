      *   **Commitment (1):** "Rationality attaches to choices, not to lives." This is the most vulnerable. In dynamic choice theory, this is the "Myopic" vs. "Sophisticated" vs. "Resolute" debate. If you hold (2) (No Money Pump), you generally *cannot* hold a strict version of (1). You need some diachronic constraint.
      *   **Commitment (2):** "Cannot be made a certain loser." This is the Dutch Book/Money Pump argument. It's a standard coherence constraint.
      *   **Commitment (6):** "Transformative Choice." This is L.A. Paul's territory. It challenges (3) directly.

  5.  **Drafting the Audit:**
      *   *Structure:*
