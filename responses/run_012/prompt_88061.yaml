          *   *Resolution:* Usually requires modifying (1) to allow "resolute choice" or "planning," or modifying (2) to accept vulnerability to pumps (which the user explicitly rejects).

      *   **Tension B: (1) vs. (4) - Precommitment.**
          *   (1) says assess at the moment.
          *   (4) says bind the future self.
          *   *Conflict:* If I bind myself at $t_1$ not to do $X$ at $t_2$, then at $t_2$, doing $X$ might be locally rational (per current preferences), but I am bound. Precommitment only makes sense if future preferences might diverge from current ones *and* we privilege the current ones. This challenges (1)'s claim that *each* choice is assessed against preferences *at the moment it is made*. If I precommit, I am forcing $t_2$ me to act against $t_2$ preferences.
          *   *Severity:* High. It undermines the "sovereignty of the present moment" in (1).

      *   **Tension C: (3) vs. (6) - EU and Transformative Choice.**
          *   (3) says EU maximization. EU requires assigning utilities to outcomes.
          *   (6) says in large choices, I cannot know what I will value afterwards (L.A. Paul's "Transformative Experience").
          *   *Conflict:* If I cannot know my future utility function, I cannot calculate Expected Utility. Standard EU assumes a stable utility function or known probabilities over outcomes. (6) suggests epistemic blindness regarding the $U$ in $EU$.
          *   *Severity:* Moderate to High. This is a known philosophical problem (Paul vs. Standard Decision Theory).
          *   *Resolution:* Requires a modification of EU (e.g., higher-order utilities, or accepting non-EU rationality for transformative choices).

      *   **Tension D: (2) vs. (5) - Sunk Costs and Loss.**
          *   (5) says ignore sunk costs.
          *   (2) says avoid certain loss.
          *   *Conflict:* Sometimes, ignoring sunk costs leads to a "certain loss" of the invested resource compared to throwing good money after bad *if* the goal is recouping investment. However, standard decision theory says (5) is correct and (2) refers to *future* resources.
          *   *Analysis:* Actually, (5) and (2) are usually aligned in standard theory. Sunk costs are past; money pumps are future. This might be a *false* tension.
          *   *Verdict:* Likely compatible. (2) is about dynamic consistency leading to loss; (5) is about not letting past inputs dictate future outputs.

      *   **Tension E: (1) vs. (6) - Local Info vs. Future Ignorance.**
          *   (1) says assess against info available *at the moment*.
          *   (6) says the info available is fundamentally incomplete regarding future values.
