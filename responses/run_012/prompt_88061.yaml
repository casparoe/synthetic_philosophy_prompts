  2.  **Analyze the Six Commitments:**
      *   (1) *Local Rationality:* Rationality attaches to choices (moments), not lives/sequences. Assess against preferences/info *at the moment*.
      *   (2) *No Certain Loss:* A rational agent cannot be made a certain loser (no money pumps). No chain of defensible choices should strip resources with certainty.
      *   (3) *EU Maximization:* Expected Utility is correct for risk, including Sure-Thing Principle.
      *   (4) *Precommitment:* Comfortable with precommitment (Ulysses contracts) where it plainly works.
      *   (5) *No Sunk Costs:* Sunk costs are not reasons. Write off investments rather than be moved by past expenditure.
      *   (6) *Transformative Choice:* Large choices involve unknown future values (transformative experiences). Ignorance is part of the choice; rational to make them anyway.

  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: (1) vs. (2) - The Core Conflict.**
          *   (1) says evaluate locally (at time $t$).
          *   (2) says global outcome matters (no certain loss over sequence).
