answer: |-
  **4.12 The Unmarked Case**

  It has come to the Committee's attention that certain lexical items function as covert generics, privileging one subset of humanity while masquerading as the whole. As Dr. Aris Thorne observed in *The Syntax of Neutrality*, "Ambiguity is the enemy of precision." To remedy this, the Press adopts the Principle of Explicit Specificity. Wherever English traditionally leaves a default group unmarked, that group must now be marked explicitly. This is not a political correction but a grammatical tidying, ensuring that the reader never mistakes a part for the whole.

  1.  **Gender and Occupation.** Terms that historically default to one sex must be qualified when referring to that sex. The term *actor* shall denote a performer of any gender; a male performer is a *male actor*. Conversely, where a female default exists, it too must be marked. While *nurse* is technically neutral, usage suggests a female default; therefore, write *female nurse* when referring to men in the profession. Titles require similar rigor. *Mr.* is unmarked for marital status, whereas *Mrs.* and *Miss* are marked. Consequently, *Mr.* shall henceforth be rendered *Mr. (Unmarried/Marital Status Unspecified)* to match the specificity of *Mrs.* Do not revert to *Bachelor*, which implies a moral state rather than a marital one, though *Spinster* remains acceptable for women over forty provided the context justifies the archaism.^1

  2.  **Ability and Age.** The able-bodied adult is the silent protagonist of most prose. To correct this, physical and temporal defaults must be surfaced. A *pedestrian* is assumed to be ambulatory; if the subject walks without aid, write *ambulatory pedestrian*. The verb *to see* implies ocular capability; prefer *to sight-see* for those with vision. Similarly, *person* defaults to adulthood. A generic reference to *people* in a public space should read *adult people* unless minors are present. Consider the sentence: "The governor addressed the crowd." Under these rules, this becomes: "The male governor addressed the adult, ambulatory, sighted crowd." This eliminates the ambiguity of whether the governor was female or the crowd included children.

  3.  **Pronominal Paradigms.** The greatest inconsistency lies in the third person singular. *He* functioned historically as the generic neutral, yet it is morphologically male. *She* is marked female. *They* is plural or indeterminate. To achieve parity, all pronouns must carry markers for Gender, Age, and Ability. The new paradigm is as follows:
      *   *He-α* (Male, Adult, Able-bodied)
      *   *She-α* (Female, Adult, Able-bodied)
      *   *He-β* (Male, Child, Able-bodied)
      *   *It-α* (Non-human, Adult, Able-bodied)
      *   *Ze-Ω* (Neutral/Unknown/Non-binary, Adult, Able-bodied)
      *   *Ze-ω* (Neutral/Unknown, Child/Disabled)

      Writers must select the appropriate suffix for every antecedent. If the subject's ability status changes mid-sentence, the pronoun must update accordingly. Example: "The male actor-α entered the stage, but after his injury, the male actor-ω required assistance." While this increases character count, it prevents the reader from assuming the default human condition is adult, male, and able. The beauty of this system lies in its refusal to hide the machinery of exclusion behind the veil of the generic.

  ^1 See also §5.04 (Honorifics and Marital Status), regarding the proposed abolition of *Ms.* on the grounds that it conceals too much information.

  ***

