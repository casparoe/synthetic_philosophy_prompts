prompt: |-
  In my metaphysics seminar we have spent the past few weeks on causation by omission, and the final assignment is an essay that takes a stand on one of the seminar's unresolved disputes rather than merely surveying it. I would like help drafting that essay, and I would prefer it to end with a defended verdict rather than a survey that trails off into "it depends."

  The dispute is this. On the familiar difference-making picture, a condition counts as a cause of an outcome when the outcome counterfactually depends on it: had the condition been different or absent, the outcome would have been different or absent. This handles ordinary positive causation well, but it also seems to admit omissions. The gardener's failure to water the plants is followed by their death, and had the gardener watered them, they would have lived; so the omission seems to qualify as a cause of the death on the very same footing on which the watering, had it occurred, would have qualified as a cause of their thriving. Many philosophers resist this. They insist that an omission — a mere absence, something that never happened — cannot enter into the causal relation at all, and that omission talk is either a useful fiction or a distinct, second-class notion (something like a quasi-cause) rather than genuine causation.

  I want the essay to adjudicate between two theses, which I will label for convenience. The parity thesis holds that omissions can be causes in whatever sense positive events are causes, and that any felt asymmetry between the two is a pragmatic or normative artifact — a matter of what we happen to care about, or what expectations are in play — rather than a metaphysical difference. The deflationary thesis holds that omissions are not causes, or are causes only in an attenuated sense, and that the appearance of parity comes from the counterfactual test being too permissive.

  Please do the following. First, set out the strongest version of each thesis before adjudicating, so that neither is a straw man. Second, confront a specific challenge to the parity thesis: if the counterfactual test licenses omissions as causes, it seems to license far too many — not only the gardener's failure but also the failure of every bystander, of the owner, of the seed supplier, and indefinitely many others. Explain whether the deflationary theorist can turn this profligacy into an argument against parity, and whether the parity theorist has a principled way to keep the class of omission-causes from exploding. Third, consider a case of my own devising. A child is drowning in a pool. A stranger standing at the edge could easily have saved her and did not; a lifeguard on duty could easily have saved her and did not. The two omissions are counterfactually indistinguishable with respect to the death. Does parity commit us to saying the two are equally causes? If our intuitions diverge here, is that divergence evidence about causation itself, or only about blame and responsibility? Say what you think the divergence shows.

  Then defend a verdict. If you think the truth lies between the two theses, specify precisely the respect in which omission-causation is genuine and the respect in which it is not, rather than gesturing at a middle ground.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Causation by Omission.
      *   **Task:** Draft a metaphysics seminar essay taking a stand on an unresolved dispute.
      *   **Specific Dispute:** Parity Thesis (omissions are genuine causes, asymmetry is pragmatic/normative) vs. Deflationary Thesis (omissions are not genuine causes or are second-class).
      *   **Requirements:**
          1.  Set out the strongest version of each thesis (no straw men).
          2.  Confront the "Profligacy Problem" (too many omission causes: gardener, bystanders, etc.). Can Deflationists use this? Can Parity theorists solve it principledly?
          3.  Analyze a specific case: Drowning Child (Stranger vs. Lifeguard). Both omit saving. Counterfactually identical regarding death. Does Parity say they are equal causes? What does intuition divergence show (causation vs. blame)?
          4.  Defend a verdict (no "it depends," must take a stand, even if nuanced).
      *   **Tone:** Academic, philosophical, rigorous, argumentative.

  2.  **Deconstruct the Theses:**
      *   *Parity Thesis:* Rooted in counterfactual dependence (Lewis-style). If $C$ didn't happen (or did happen) and $E$ would be different, $C$ causes $E$. Omissions fit this. Asymmetry is due to norms/expectations (Hart & Honoré style).
      *   *Deflationary Thesis:* Omissions are "nothings." Nothings can't push/pull. Causation requires energy transfer or physical connection (process theories). Omission talk is useful for responsibility but not metaphysics.

  3.  **Address the Profligacy Problem:**
      *   *The Challenge:* If I didn't water the plants, I caused their death. But *everyone* didn't water them. Did the Queen of England cause the death by not watering them?
      *   *Deflationist Move:* This absurdity shows the counterfactual test is broken for omissions. Real causation is selective; omission causation is unbounded. Therefore, they aren't the same kind of thing.
      *   *Parity Move:* We need a pragmatic filter. Causation is contrastive or context-sensitive. We select causes based on abnormality or norms. The Queen isn't a cause *in this context* because her watering wasn't expected. The metaphysics is uniform; the pragmatics select the relata.

  4.  **Analyze the Drowning Child Case:**
      *   *Scenario:* Stranger omits saving. Lifeguard omits saving. Child dies.
      *   *Counterfactuals:* If Stranger saved -> Live. If Lifeguard saved -> Live. Both satisfy dependence.
      *   *Parity Implication:* Both are causes.
      *   *Intuition:* Lifeguard is *more* responsible, maybe even the "real" cause in a legal/moral sense. Stranger is less blameworthy.
      *   *Crucial Question:* Is the difference causal or normative?
      *   *Argument:* If we say the Lifeguard is the cause and the Stranger isn't, we are smuggling norms into metaphysics. If we say both are causes but only one is blameworthy, we preserve metaphysical clarity.

  5.  **Formulate the Verdict:**
      *   *Option A (Pure Parity):* Omissions are full-blown causes. Norms handle the selection.
      *   *Option B (Pure Deflation):* Omissions are never causes. It's all explanation/responsibility.
      *   *Option C (Nuanced Parity - My Choice):* I will argue for a *Normative Parity* view. Omissions *are* causes in the metaphysical sense (counterfactual dependence is the truth-maker for causal claims), BUT the selection of *which* omissions we cite is constitutive of causal explanation, not just pragmatic decoration. However, to meet the prompt's demand for a "defended verdict" rather than a survey, I need to lean one way.
      *   *Decision:* I will defend a **Moderate Parity Thesis**. Omissions are genuine causes because the counterfactual structure of the world includes absences as truth-makers. The "profligacy" is not a bug but a feature of a world rich in counterfactual dependencies. The distinction between the Lifeguard and the Stranger is *not* causal but normative. To deny this is to conflate metaphysics with morals.
      *   *Refinement:* Actually, a stronger metaphysical claim is often more satisfying in a seminar paper. I will argue that the Deflationary thesis fails because it cannot account for the explanatory power of omissions without collapsing into Parity anyway. However, the Profligacy objection forces the Parity theorist to admit that *causal selection* is distinct from *causal relation*.
      *   *Final Verdict Plan:* Defend Parity. Argue that Deflationism fails to distinguish between "causation" (the relation) and "causal explanation" (the speech act). The drowning case shows that our intuitions track responsibility, not ontology.

  6.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the reader with the gardener case. Define Parity vs. Deflation. State the thesis (Defending Parity).
      *   **Section 1: The Theses.**
          *   Parity: Counterfactual dependence is sufficient. Absences are real aspects of the world's modal structure.
          *   Deflation: Causation requires physical connection/production. Omissions are explanatory fictions.
      *   **Section 2: The Profligacy Objection.**
          *   The "Queen of England" problem.
          *   Deflationist says: See? Absurd.
          *   Parity response: Contrastivism or Normative Selection. The causal *relation* is broad; causal *claims* are narrow. This doesn't make the relation fake.
      *   **Section 3: The Drowning Child.**
          *   Stranger vs. Lifeguard.
          *   Counterfactuals match.
          *   Intuition says Lifeguard is "more" of a cause.
          *   Argument: This intuition is moral/legal, not metaphysical. If we build duty into causation, we lose the ability to explain why the Lifeguard is *responsible* (because he caused it + had a duty). If causation includes duty, responsibility becomes redundant.
      *   **Conclusion/Verdict:** Parity wins. Deflationism confuses the *mechanism* of causation with the *relation* of dependence. The cost of profligacy is worth paying to keep metaphysics distinct from ethics.

  7.  **Review and Refine:**
      *   *Check:* Did I avoid "it depends"? Yes, I'm taking the Parity side.
      *   *Check:* Did I address the profligacy challenge specifically? Yes.
      *   *Check:* Did I use the drowning case? Yes.
      *   *Check:* Is the tone appropriate? Needs to be formal and argumentative.
      *   *Self-Correction on Verdict:* The prompt asks: "If you think the truth lies between the two theses, specify precisely..." I should be careful not to just say "Parity is right." I should acknowledge the Deflationist's insight (that omissions feel different) but explain *why* that feeling doesn't entail a metaphysical difference. I will argue that the "difference" is real but pragmatic, not ontological. This supports Parity.

      *   *Wait, one nuance:* The prompt asks to "defend a verdict." I can defend Parity but refine *how* it handles the pragmatics. I will argue that the Deflationary thesis is motivated by a category mistake: conflating causal *production* with causal *dependence*. Once separated, Parity holds.

  8.  **Final Polish:** Ensure clear signposting. Make sure the distinction between "causal relation" and "causal explanation" is sharp. Ensure the drowning case analysis directly supports the verdict. (Self-correction: Make sure I don't just dismiss the Deflationist; acknowledge their motivation regarding physical processes).

      *   *Key Philosophical References (Mental Check):* Lewis (counterfactuals), Hart & Honoré (norms), McGrath (deflation), Schaffer (contrastivism). I won't necessarily name-drop heavily unless it fits the flow, but I'll use the concepts.

      *   *Structure:*
          1.  Intro
          2.  Characterizing the Dispute (Strong versions)
          3.  The Profligacy Problem
          4.  The Drowning Case (Stranger vs. Lifeguard)
          5.  Verdict: Defending Normative Parity.

      *   *Let's write.*
answer: |-
  **Title:** The Nothing That Made Something: A Defense of Normative Parity in Causation by Omission

  **Introduction**

  The metaphysics of causation is often tested at its limits. While positive events—a stone striking a window, a spark igniting gas—fit comfortably within productive models of causation, omissions present a recalcitrant anomaly. When a gardener fails to water a plant and the plant dies, we readily say the failure caused the death. Yet, nothing happened. There was no energy transfer, no physical process linking the gardener's inaction to the withering leaves. This tension generates a central dispute in contemporary metaphysics: the conflict between the **Parity Thesis** and the **Deflationary Thesis**. The Parity Thesis holds that omissions are genuine causes, ontologically on a par with positive events, with any perceived asymmetry arising from pragmatic or normative contexts. The Deflationary Thesis holds that omissions are not genuine causes, arguing that the counterfactual dependencies they satisfy are insufficient for true causal relations.

  This essay argues in favor of the Parity Thesis. I will demonstrate that the Deflationary Thesis relies on an conflation of causal *production* with causal *dependence*. Furthermore, I will show that the Deflationist's strongest weapon—the problem of profligacy—can be neutralized by distinguishing the causal relation from causal explanation. Finally, through an analysis of a drowning child case, I will argue that divergent intuitions regarding different omissions track moral responsibility rather than metaphysical causation. To deny parity is to collapse metaphysics into ethics; to accept it is to preserve the integrity of both.

  **I. The Theses Stated Charitably**

  To adjudicate this dispute, we must first steel-man both positions. The Deflationary Thesis is not merely a stubborn refusal to accept "nothing" as a cause; it is grounded in a robust intuition about the physical nature of the world. The strongest version of Deflationism argues that causation is a relation of *physical production*. For $C$ to cause $E$, there must be a continuous physical process or a transfer of conserved quantities linking them. Since an omission is an absence, it possesses no physical properties to transfer. Therefore, when we say "the lack of water caused the death," we are speaking loosely. We are really saying that the death occurred, and the *explanation* for why it was unexpected or lamentable involves the absence of water. On this view, omission-causation is a useful fiction for assigning blame or explaining outcomes, but it does not carve the world at its joints.

  The Parity Thesis, conversely, is grounded in the counterfactual analysis of causation, most famously associated with David Lewis. The strongest version of this view posits that the world's causal structure is fundamentally modal. A cause is simply a condition upon which the outcome counterfactually depends. If the gardener had watered the plants, they would have lived; therefore, the failure to water is a cause of the death. Parity theorists argue that positive events are also defined by their counterfactual dependencies. The perceived difference between "pushing" and "not pushing" is not a difference in the *relation* of causation, but a difference in the *relata*. The asymmetry is pragmatic: we notice omissions only when they violate a norm or expectation. Metaphysically, however, the dependence relation is identical.

  **II. The Problem of Profligacy**

  The most significant challenge to the Parity Thesis is the problem of profligacy. If the counterfactual test is sufficient for causation, then the class of causes explodes. In the gardener case, not only did the gardener's omission cause the death, but so did the failure of the Queen of England to water the plants, the failure of a passing stranger, and the failure of the seed supplier. All satisfy the counterfactual: had any of them watered the plants, the plants would have lived.

  The Deflationist seizes on this as a *reductio*. They argue that genuine causation is selective. We intuitively know the gardener caused the death, not the Queen. Since the counterfactual test cannot distinguish between them, the test is too permissive to capture genuine causation. Therefore, omissions must be a different, weaker kind of relation (quasi-causation) or no relation at all.

  However, the Parity theorist has a principled response that preserves the thesis without accepting absurdity. The Parity theorist must distinguish between the **causal relation** and **causal selection**. The causal relation is indeed broad and profligate; the death counterfactually depends on a vast web of absences. However, when we make a causal *claim* ("The gardener caused the death"), we are engaging in causal *explanation*, which is context-sensitive. We select causes based on abnormality, intervention capacity, and normative expectation.

  This does not undermine Parity; it clarifies it. Positive causation is subject to similar selection pressures. If a fire is caused by a short circuit, we do not cite the presence of oxygen, even though the fire counterfactually depends on it. We omit oxygen because it is background normalcy. We cite the short circuit because it is abnormal. The metaphysics of dependence remains uniform; the pragmatics of conversation select the relata. The Deflationist mistakes the pragmatics of selection for the metaphysics of the relation. The fact that the Queen is not cited as a cause does not mean her omission lacks counterfactual dependence; it means her omission is irrelevant to our explanatory interests. Thus, profligacy is not an argument against Parity, but an argument for a pragmatic filter on causal reporting.

  **III. The Drowning Child: Causation vs. Responsibility**

  To test whether this pragmatic filter masks a deeper metaphysical asymmetry, consider the following case. A child is drowning in a pool. A Stranger standing at the edge could easily save her but does not. A Lifeguard on duty could also easily save her but does not. The child dies.

  Counterfactually, the two omissions are indistinguishable regarding the outcome. Had the Stranger saved her, she would have lived. Had the Lifeguard saved her, she would have lived. Both satisfy the dependence condition.

  Our intuitions, however, diverge. We are inclined to say the Lifeguard's omission caused the death in a way the Stranger's did not, or at least that the Lifeguard's causation is "stronger." The Deflationist might argue this intuition reveals a metaphysical truth: the Lifeguard had a duty, and duties somehow bind omissions into the causal fabric, whereas the Stranger's omission remains external.

  The Parity theorist must resist this. If we build duty into the definition of causation, we conflate metaphysics with ethics. The divergence in intuition is evidence not of a causal difference, but of a difference in **responsibility**.

  Consider the utility of keeping these concepts distinct. If we say the Lifeguard's omission is a cause and the Stranger's is not, we lose the ability to explain why the Lifeguard is *more* blameworthy. His blamelessness would be baked into the causal claim, rendering the moral judgment redundant. However, if we accept Parity and say *both* omissions are causes, we can then layer the normative assessment on top. Both agents causally contributed to the death via omission. However, the Lifeguard had a special obligation to act, while the Stranger did not. The Lifeguard is therefore criminally negligent; the Stranger is merely morally callous (or perhaps blameless, depending on one's ethics of rescue).

  If we follow the Deflationary path and deny the Stranger's omission is a cause, we face a paradox: How can the Stranger be blameworthy (even minimally) for an outcome he did not help cause? Conversely, if we say only the Lifeguard caused the death, we imply the Stranger's inaction made no difference to the world, which is counterfactually false.

  Therefore, the divergence in intuition shows that we often use the word "cause" to do the work of "responsible cause." In a metaphysics seminar, we must strip away the normative loading. Once we do, the causal structure is identical. The Stranger and the Lifeguard stand in the same counterfactual relation to the death. The difference lies entirely in the normative expectations surrounding the agents, confirming the Parity Thesis's claim that the asymmetry is pragmatic/normative, not ontological.

  **IV. Verdict: Defending Normative Parity**

  I defend the **Parity Thesis**, specifically a version I call **Normative Parity**.

  The Deflationary Thesis fails because it cannot account for the explanatory indispensability of omissions without collapsing into Parity. If omissions are not causes, then our best scientific and historical explanations are systematically false. When a historian says "The famine was caused by the government's failure to distribute grain," they are not speaking a useful fiction; they are describing the modal structure of the event. To deny this is to demand that causation only track physical pushes and pulls, which renders causation incapable of explaining complex systemic failures.

  However, my defense of Parity accepts the Deflationist's core insight: omissions *feel* different. The verdict is not that omissions are identical to positive events in every way, but that they are identical *as causes*. The difference lies in the nature of the relata (an event vs. an absence), not the relation (dependence).

  The Deflationist argues that because omissions are "nothing," they cannot exert power. But this relies on a production model of causation that is too narrow. Causation is not merely about energy transfer; it is about dependence. The world is such that certain absences are relevant to the occurrence of events. The gardener's absence of watering is a real feature of the world's history, just as the presence of water would have been.

  Therefore, the truth lies not in a middle ground where omissions are "half-causes," but in a robust Parity that distinguishes ontology from pragmatics.
  1.  **Ontologically:** Omissions are genuine causes. They satisfy the counterfactual dependence condition required for causal relations. The drowning child case proves that the causal link exists independently of duty.
  2.  **Pragmatically:** We restrict our causal claims using normative filters. This solves the profligacy problem without denying the underlying metaphysics. The Queen of England is a cause *simpliciter*, but not a cause *in context*.

  To conclude, we must reject the Deflationary Thesis because it sacrifices metaphysical accuracy for intuitive comfort. It attempts to solve the profligacy problem by deleting omissions from the causal ledger. But the ledger is correct; our reading of it is what requires adjustment. We should accept that the world is causally profligate, containing vast webs of positive and negative dependencies. We should then acknowledge that when we single out the gardener or the lifeguard, we are not discovering a unique metaphysical bond, but applying a normative spotlight to a specific part of the causal web. Causation is a matter of dependence; responsibility is a matter of expectation. Keeping them distinct allows us to say that the Stranger *caused* the death (metaphysically) but is not *liable* for it (normatively), preserving the clarity required for both rigorous metaphysics and coherent ethics.
