answer: |-
  The word you are looking for is **teleonomy**.

  But "teleonomy" is just the label for the bucket. The specific thing inside that bucket—the "reason with nobody to have it"—has a sharper name coined by the philosopher Daniel Dennett: a **free-floating rationale**.

  Here is the carving you asked for. This is not just a metaphor, and it is not a mistake. It is a distinct logical category.

  ### 1. The Core Concept: Teleonomy vs. Teleology
  You already know **teleology**. That is the idea that things happen *for the sake of* a future goal. (The rock falls *in order to* reach the center of the earth.) In strict physics, this is false. The future does not pull the past.

  **Teleonomy** is the scientific correction. It describes systems that *look* purposeful because they were shaped by a past process of selection. The "purpose" isn't pulling from the future; it's pushing from the past.
  *   **The Plant:** It isn't reaching for the light. It is growing faster on the dark side because ancestors that did that survived better.
  *   **The Moth:** It isn't navigating. It is executing a fixed-angle flight algorithm that worked for millions of years until artificial lights broke the correlation.

  ### 2. The "Reason": Free-Floating Rationale
  This is the specific answer to your question about a "reason with nobody to have it."

  A **free-floating rationale** is a logical reason that exists in the environment and the history of the system, but not in the mind of the system.
  *   **Why it's not a metaphor:** If you treat the plant *as if* it wants light, you can predict its growth. If you treat it as pure physics, the math is too hard. The "wanting" is a real pattern, not just poetry.
  *   **Why it's not anthropomorphism:** Anthropomorphism is a mistake (saying the storm is "angry"). Teleonomy is a correct analysis of an optimization process (saying the fever is "trying" to cook the virus). The fever *is* a mechanism selected for cooking viruses.
  *   **Why it's not design:** Design implies a designer who understood the reason. Teleonomy implies a reason that was found by blind trial and error. The slime mold didn't "figure out" the maze; the maze filtered out the slime mold behaviors that didn't work.

  ### 3. What is doing the work? (The Grading Mechanism)
  You asked: *When I say one of these reasons is a good one or a bad one, what's actually doing the work there?*

  The work is done by **counterfactuals grounded in selection history.**

  To call something "smart" or "dumb" in this context, you are implicitly comparing it to other variants that *could have existed* but didn't survive.
  *   **The Moth:** We call the candle spiral "dumb" because we know there *could* be a moth variant that ignores light, and that variant would survive better in a city. The "reason" (navigate by moon) is good in the ancestral environment and bad in the current one.
  *   **The River:** You cannot call a river "dumb" for flowing around a rock. There is no selection history. The river isn't optimizing; it's just obeying gravity. It has no "goal" to fail.

  **The "Reason" is a fossil.** It is a record of past success. When you say the plant is "reaching," you are reading the fossil record of its ancestors' survival written into its hormones.

  ### 4. The Edge Cases (The Carving)
  Here is how you sort the items you listed using this framework.

  **The Thermostat: OUT.**
  *   **Why:** A thermostat has a goal (72 degrees), but it has **derived intentionality**. The reason exists, but it is parked in the mind of the human who built it. It is not a free-floating rationale; it is a borrowed one. It has no selection history of its own; it has a design specification.

  **The Market Price: IN.**
  *   **Why:** Prices emerge from blind variation (traders trying different strategies) and selection (losing money vs. making money). There is no central mind setting the price, yet the price "knows" about scarcity. This is a pure free-floating rationale. You can call a market "inefficient" (dumb) because it failed to optimize resources compared to how it *could* have.

  **The River: OUT.**
  *   **Why:** Physics, not selection. A river takes the path of least resistance because of gravity and erosion, not because it was selected against paths of more resistance. If a river gets blocked, it doesn't "fail"; it just becomes a lake. There is no "ought" here, only "is."

  **The Feed Algorithm: BORDERLINE (Leaning OUT).**
  *   **Why:** This is tricky. The algorithm operates without comprehension (it doesn't know *why* you scroll), which feels like competence without comprehension. However, the goal (maximize engagement) was set by engineers. It is more like the thermostat than the moth. The "reason" is in the engineers' bonus structures, not floating free in the code's evolution. *However*, if the algorithm uses genetic programming to evolve its own sub-routines without human intervention, those sub-routines become teleonomic.

  **The Fever: IN.**
  *   **Why:** This is etiological function. The mechanism exists *because* it cooked infections in the past. You can grade it: a fever that is too low fails to kill the virus (dumb); a fever that is too high kills the host (dumb). The "sweet spot" is the free-floating rationale.

  ### Summary
  The word for the phenomenon is **teleonomy**.
  The word for the "reason" itself is a **free-floating rationale**.

  It is distinct from metaphor because it is **predictive**.
  It is distinct from anthropomorphism because it is **normative** (you can grade it).
  It is distinct from design because the reason is **unrepresented** (nobody knows it, it just works).

  The "work" is done by **evolutionary history**. The "reason" is real, but it lives in the population's past, not the individual's present.
