answer: |-
  This is a sophisticated functionalist definition of history, one that shifts the burden from ontology (what *is*) to epistemology and sociology (how we *know* and *use*). It resembles the move made by philosophers like R.G. Collingwood or certain strands of pragmatism, where the "historical attitude" is defined by a specific mode of inquiry rather than the content of the past.

  You have asked for a map of exposure, a ranking of objections, and a verdict on falsifiability. I will give you these directly.

  ### The Decisive Objection: The "Evidence" Regress

  The single clearest case where your criterion misfires is **the problem of defining "evidence."**

  Your criterion hinges on whether a community treats a narrative as "answerable to evidence." To apply this, you must be able to identify what counts as evidence for that community. Here lies the trap:

  1.  **If "evidence" is defined internally** (i.e., whatever the transmitting community accepts as proof), then **your criterion collapses into tautology.** Every community treats its sacred narratives as answerable to *some* form of verification (scriptural consistency, prophetic fulfillment, elder testimony). A fundamentalist community treating the Exodus as literal history is "cross-checking" it against genealogy and archaeology (often selectively). If their internal standards are met, your criterion forces you to call this *history*. If their standards are not met, they revise. By this light, there is almost no legend, only history done badly. You lose the distinction you sought.
  2.  **If "evidence" is defined externally** (i.e., by modern standards of empirical verification), then **your criterion collapses into the ontological view you rejected.** To decide if a community is "answerable to evidence," *you* must first judge whether the evidence they are using is valid. If you discard their "evidence" (e.g., prophecy, divine revelation, forged charters) as invalid, you are effectively saying, "This counts as legend because their evidence doesn't lead to the truth." You have smuggled the truth-condition back in through the back door of "evidence."

  **The Clear Case: The Visionary Chronicler**
  Consider a medieval chronicler like Geoffrey of Monmouth. He claims to use an "ancient book" (evidence). He cross-checks stories against oral traditions (corroboration). He revises his narrative when he finds conflicting accounts (revision). He treats his work as a record of actual kings (answerability).
  *   **Your Criterion:** This is **History**. The stance is critical, evidentiary, and revisionist.
  *   **Our Intuition:** This is **Legend**. The "ancient book" was likely fabricated; the "evidence" was not insulated from correction because the correction mechanisms were nonexistent or ignored.
  *   **The Misfire:** To classify Geoffrey as Legend, you must judge his *evidence* as bad. To judge his evidence as bad, you must judge the *truth* of his claims. If you admit his stance was historically rigorous *for his time*, you must call it History. If you call it History, you admit that History can be 90% fabrication provided the author *thought* they were checking sources. You may be willing to accept this, but it renders the term "History" devoid of any reliability guarantee, making it synonymous with "attempted inquiry."

  ### Ranking the Objections

  Here is the ranking of threats to your position, from most dangerous to least.

  #### 1. Decisive: The Epistemic Access Problem (The "Evidence" Regress)
  *   **The Charge:** You cannot identify a community's "stance" without already judging the validity of their evidence.
  *   **Why it is decisive:** It shows the criterion is not independent. It pretends to bracket the question of truth ("did it happen?"), but it cannot operationalize "answerable to evidence" without reintroducing truth judgments. If you cannot distinguish a "rigorous myth" from a "sloppy history" without looking at the truth-value of the evidence, the distinction between history and legend dissolves back into "true vs. false" or "good vs. bad methodology."
  *   **Verdict:** This threatens the coherence of the definition itself.

  #### 2. Awkward but Survivable: The Diachronic Shift (The "Whose Community?" Problem)
  *   **The Charge:** Narratives survive across millennia, carried by different communities with different stances. The *Iliad* was sacred legend to a Homeric bard, critical history to a Hellenistic scholar, and poetic fiction to a modern classicist.
  *   **Why it is awkward:** Your definition makes the genre of the narrative extrinsic and unstable. The *Exodus* is Legend to an Orthodox Jew, History to a Biblical Archaeologist, and Literature to a Poet. This means "History" is not a property of the text or the events, but of the *current reader*.
  *   **Why it is survivable:** You can concede this. You can argue that "History" is indeed a functional role a narrative plays *at a specific time*, not an eternal essence. This makes your theory a sociology of knowledge rather than a taxonomy of texts. It is counter-intuitive (we want to say "The Bible *is* a book"), but philosophically consistent.

  #### 3. Concedable: The "False History" Implication (The Propaganda Problem)
  *   **The Charge:** Your view classifies state-sponsored pseudohistory (e.g., Nazi archaeology or Soviet Lysenkoism) as "History" because those communities treated their narratives as answerable to evidence (experiments, archives) and revised them (to fit ideology).
  *   **Why it is concedable:** You already stated you are willing to accept "entirely false and still be history." If you hold firm here, you simply bite the bullet. You argue that "History" is the *activity* of evidence-based inquiry, not the *result*. Bad history is still history; legend is a different activity entirely (identity-formation). This is a defensible, if provocative, stance.

  ### Falsifiability and Insulation

  **Is the position falsifiable?**
  Strictly speaking, **no**, not in its current formulation. It is insulated by the ambiguity of "stance."

  If a critic points to a narrative and says, "This is legend," and you reply, "No, look how they cross-check it," and the critic replies, "But they ignore discrepancies," and you reply, "No, they explain them away, which is a form of revision," you have created a closed loop. "Stance" is a mental state inferred from behavior, but the behavior (citing sources, arguing) looks identical in both the historian and the apologist.

  To make it falsifiable, you would need **operational criteria for "stance."** For example: "If a community rejects a claim upon the discovery of a primary source contradiction, it is history. If they reinterpret the source to fit the claim, it is legend."
  *   **The Risk:** If you do this, you face the "Evidence Regress" again. Who decides if the source is a "primary source contradiction" or just "another interpretation"?

  **Is this insulation a defect?**
  In a conceptual proposal of this kind, **some insulation is expected**, but total insulation is fatal.
  *   **Acceptable Insulation:** Defining terms to clarify a distinction (e.g., "I am defining 'history' functionally").
  *   **Defective Insulation:** Defining terms so they cannot be observed (e.g., "The stance is internal and only visible to those who already know it's history").

  Your proposal risks the latter. You are defining history by a *motivation* (answerability) that is often indistinguishable in practice from *rationalization*.

  ### Recommendation

  If you wish to hold this position, you must pivot from "stance" to **"institutional vulnerability."**

  Don't ask: "Do they *treat* it as answerable?" (This is psychological and hard to verify).
  Ask: "Is there a **mechanism** by which the narrative *can be overturned*?"

  *   **History:** A narrative carried by an institution that allows the narrative to be *discarded* if evidence contradicts it (e.g., Academic History).
  *   **Legend:** A narrative carried by an institution that requires the narrative to be *preserved* even if evidence contradicts it (e.g., Religious Canon, National Myth).

  This saves you from the "Evidence Regress." You don't have to judge the evidence; you only have to judge the *rules of the institution*.
  *   **The Cost:** It makes "History" a very narrow category. Most ancient chronicles (including Thucydides) would be Legend, because they were not part of an institution that allowed for their own falsification. They were singular works, not part of a self-correcting discipline.

  **Final Verdict:**
  Your position is intellectually robust but empirically slippery. It is falsifiable only if you can objectively measure "answerability" without referencing the truth of the claims. If you cannot do that, you have not solved the quarrel over Troy and Exodus; you have merely moved the battlefield from "What happened?" to "What were they thinking?"—which is, ultimately, just as contested.
