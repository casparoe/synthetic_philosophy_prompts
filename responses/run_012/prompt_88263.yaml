      *   60-70: Reveal 2 (The September Program Timing).
      *   70-80: Reveal 3 (The Treaty Stakes/Signing).
      *   80-90: Debrief.
      *   *Correction:* I need to fit the reveals and the signing into the flow better. The prompt asks for reveals dropped at fixed minutes that destabilize the verdict.
      *   *Revised Phases:*
          *   0-15: Individual Assessment (Silent).
          *   15-45: Negotiation (National Delegations -> Plenary).
          *   45-55: Finalizing the Unanimous Table.
          *   55-60: Reveal 1 (Private Tables).
          *   60-65: Reveal 2 (September Program Date).
          *   65-75: The Signing (Stakes).
          *   75-90: Debrief.
  5.  **Verdict Mechanic:** Unanimity required. If not reached, a default punitive verdict applies (e.g., 100% on the group as a whole, or a random assignment). Let's make the default "100% on the Current Occupants of the Room" to make it sting personally, or perhaps "100% on the Central Powers" which might be historically plausible but punishes the German delegates unfairly based on the simulation's ambiguity. Better: "If no agreement, the Facilitator assigns 100% to the delegation that spoke least." No, the prompt says "the default verdict and why it stings". Let's go with: "If no agreement, responsibility is distributed equally (16.6% each)." This stings because it ignores the evidence they just debated. Or better: "If no agreement, the Treaty assigns 100% to Germany and Austria." This mirrors Versailles and stings the Central Power delegates who argued hard. Let's use the Versailles mirror: Default is 90% Central Powers.
