  7.  **Debrief Map:** Connect the struggle for unanimity to "Collective Responsibility". Connect the September Program reveal to "Ex Post vs Ex Intention". Connect the Private Table reveal to "Social Convergence vs Evidence". Connect the Signing to "Versailles Art 231". Connect the Fischer controversy to the German War Aims evidence.
