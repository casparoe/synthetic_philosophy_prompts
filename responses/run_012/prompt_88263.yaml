  This fits.

  **Self-Correction on "Predictable Failures":**
  Need specific handling moves.
  *   "Obviously Germany": Ask for the specific standard (Intent vs Causation).
  *   "Arithmetic": Remind them the sum must be 100, but the *reasoning* matters.
  *   "Capitulation": Ask them to justify the compromise to their "constituents" (the other 2 in their delegation).

  **Self-Correction on "Debrief":**
  Must name Fischer Controversy *after* they have lived through the German War Aims issue.
  Must name Versailles Article 231.
  Must map philosophical concepts (Unit of Agency, etc.) to specific activity moments.

  **Final check on constraints:**
  *   No citations.
  *   No internet needed.
  *   Paraphrased documents.
  *   Contested facts flagged.
  *   JSON format.

  Let's assemble the JSON.
