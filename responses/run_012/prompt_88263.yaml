  *   All keys must be present.
  *   `briefing_sheet` must be full text.
  *   `evidence_record` must be an array of objects.
  *   `debrief_map` must connect specific moments to concepts.

  **Self-Correction on "Reveals":**
  The prompt asks for reveals dropped at fixed minutes that destabilize the verdict they have *just reached*.
