  The topic is the origins of the First World War, specifically focusing on the question of "blame" or "responsibility".
  The core pedagogical goal is for students to discover that "who is to blame" has no stable answer without defining the *unit of agency* (state, government, individual, etc.) and the *standard of judgment* (causation, intention, negligence, etc.).
  The activity must be self-contained (no external readings, no internet).
  I need to produce a JSON object with specific keys.

  **Key Constraints & Requirements:**
  1.  **Format:** Single JSON object with specific keys (`title`, `session_parameters`, `target_insight`, `briefing_sheet`, `evidence_record`, `roles`, `phases`, `verdict_mechanic`, `stakes_device`, `reveals`, `predictable_failures`, `debrief_map`, `cannot_reproduce`, `check_for_understanding`).
  2.  **Content:**
      *   **Briefing Sheet:** A chronology handout ready to photocopy. Must cover specific historical items (Sarajevo, Ultimatum, German Blank Cheque, Russian Mobilisation, French Planning, British Ambiguity/Belgium, Naval Race, Moroccan/Balkan Crises, September War Aims). Must flag contested points. No verbatim quotes of real documents (paraphrase only).
      *   **Evidence Record:** 12-16 items. Each needs `item_id`, `document_or_fact`, `what_it_supports`, `how_it_can_be_read_against_itself`. Must cover the 6 powers (Germany, Austria-Hungary, Russia, France, Britain, Serbia) with incriminating and exculpating evidence for each.
      *   **Roles:** 6 roles (one for each power). Needs `role`, `what_they_receive`, `what_they_want`, `private_constraint`.
      *   **Phases:** Must tile the full 90 minutes without overlap. Needs `phase_number`, `name`, `start_minute`, `end_minute`, `what_participants_do`, `rule_that_creates_the_pressure`, `facilitator_actions`.
      *   **Verdict Mechanic:** Must result in a single table apportioning responsibility (summing to 100%), agreed unanimously.
      *   **Stakes Device:** The verdict becomes the legal basis for reparations in a fictional treaty. Dissenters must still sign.
      *   **Reveals:** 2-3 reveals at fixed minutes to destabilize the verdict. One must be the private individual tables filled in *before* discussion (showing the cost of unanimity). One must relate to the September War Aims memorandum (timing issue).
      *   **Predictable Failures:** Specific handling moves for common issues (e.g., "It's obviously Germany," arithmetic arguments, capitulation).
      *   **Debrief Map:** Connect activity moments to philosophical/historical concepts (Causal vs Moral, Collective Responsibility, Unit of Agency, Counterfactuals, Ex Ante/Ex Post, Fischer Controversy, Versailles Article 231).
      *   **Cannot Reproduce:** Honest admission of what the simulation misses (temporal distance, archival lag).
      *   **Check for Understanding:** Prompt, good answer, bad answer.
  3.  **Tone:** Facilitator's voice, ready to use. No lecturing in the output, just the materials and guide.
  4.  **Historical Accuracy:** Must handle disputed facts carefully (flag them). Paraphrase documents.
  5.  **Philosophical Depth:** The activity must force the choice of unit and standard implicitly.

  **Plan:**
  1.  **Drafting the Briefing Sheet:** Create a neutral timeline that includes all required events. Ensure dates are accurate but flag disputes (e.g., exact timing of Russian mobilization orders).
  2.  **Drafting the Evidence Record:** Create 12-16 cards/items. Ensure each power has at least one incriminating and one exculpating piece. Ensure the "September Program" is dated correctly (Sept 1914) to show the intentionality problem.
