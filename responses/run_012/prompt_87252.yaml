      *   *Truth and Honesty:* He valued facing unpleasant facts. "Freedom is the freedom to say that two plus two make four."
      *   *Intent:* For Orwell, lying requires a liar. Propaganda requires a propagandist with an agenda.
      *   *The Human Element:* He was deeply concerned with human dignity, common decency, and the moral responsibility of the writer.

  3.  **Analyze the "Synthetic Sincerity" Problem:**
      *   *Characteristics:* Grammatically perfect, emotionally attuned, factually safe (hallucination-free), optimized for engagement/risk, mass-produced, personalized.
