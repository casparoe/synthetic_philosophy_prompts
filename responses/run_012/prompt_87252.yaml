  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's premise. Validate the shift from the Ministry of Truth to the Algorithm. Set the stage: Orwell's focus was on the *link* between language and thought.
      *   **The Nature of the Lie:** Orwell hated the *conscious* lie. The LLM doesn't lie; it predicts. Would he see this as worse? Yes, because it removes the moral agent. It's "lying without a liar." It creates a fog where responsibility dissolves.
