  **Is the record underdetermined?**
  **Yes.** While my best guess leans on disciplinary norms, the record of Cases 1–3 genuinely underdetermines the verdict. All three theories (Negative, Republican, Positive) fit the first three cases perfectly. Case 4 is the *locus* of the disagreement, not the resolution of it. We cannot know for sure if she views liberty as a social relation (Free) or a state of agency (Not Free) without further data.

