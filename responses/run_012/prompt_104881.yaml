  > **Case 5:** A woman who is psychologically identical to the man in Case 4 (governed by a compulsion she disowns), but her compulsion was intentionally induced by a government experiment without her consent. She is otherwise left entirely to herself.

  **How she would have to come down:**
  *   **If she verdicts Case 5 "Not Free" but Case 4 "Free":** She holds a **Negative or Republican** conception. The unfreedom in Case 5 stems from the *human agency* behind the constraint (the government), not the internal state itself. This confirms Case 4 should be "Free."
  *   **If she verdicts Case 5 "Not Free" and Case 4 "Not Free":** She holds a **Positive Liberty** conception. The source of the compulsion matters less than the loss of self-mastery. This confirms Case 4 should be "Not Free."

  This case isolates the variable of *human agency*. If her verdict changes based on who caused the compulsion, she is tracking political liberty. If her verdict remains the same based on the psychological state, she is tracking autonomy.
