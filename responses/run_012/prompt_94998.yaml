answer: |-
  ### 1. Prerequisites: Making the Question Intelligible
  Before the Special Composition Question (SCQ) can land, you must establish three conceptual distinctions. Without these, the question collapses into semantics or physics.

  1.  **Existence vs. Naming:** You must separate *what exists* from *what we have a word for*. Students must grasp that we are asking if the world contains an extra entity, not if English contains an extra noun.
      *   *Drill:* Ask, "Did 'microplastic' exist before we coined the word?" (Yes). "Did 'phlogiston' exist when we had the word?" (No). This primes the idea that words track reality, they don't create it.
  2.  **Synchronic vs. Diachronic:** You must explicitly bracket time. The question is not "Does the object *persist*?" but "Is there an object *now*?"
      *   *Drill:* Use a photo analogy. "We are looking at a single snapshot. We are not watching the movie."
  3.  **Parthood vs. Membership:** Students conflate "being part of a whole" with "being a member of a set/group."
      *   *Drill:* "Is your arm part of you?" (Yes). "Is your arm a member of the set of your body parts?" (Yes). "Is the set of your body parts *itself* a physical object you can trip over?" (No). We are asking about physical objects, not sets.

  ### 2. The Case Selection: Slime Mold (*Dictyostelium discoideum*)
  **Winner:** The Slime Mold.
  **Loser:** The Coral Colony.

  **Why the Coral Loses:**
  The coral colony fails to isolate the variable of **contact**. Polyps are physically fused or touching in a way that triggers the "obviously they compose something" intuition too easily. It also leans heavily into the **Heap/Sorites** trap ("How many polyps make a colony?"), which distracts from the binary nature of composition. It invites biological classification debates ("Is it an organism or a ecosystem?") rather than ontological ones.

  **Why the Slime Mold Wins:**
  It creates a binary switch on **causal integration** and **spatial proximity** without triggering the Heap problem.
  *   **State A (Scattered):** Cells are meters apart, acting independently.
  *   **State B (Aggregated):** Cells touch, coordinate, and move as a unit.
  *   **The Work It Does:** It pressures the "Common Sense" view (it's clearly a slug in State B, clearly not in State A) against "Universalism" (it's an object in both, just arranged differently) and "Nihilism" (it's never an object, just cells).

  **Requirements for the Winning Case:**
  *   **Must Have:** A clear trigger mechanism (starvation) that shifts the state abruptly. This allows you to "freeze frame" State A and State B and ask the composition question for each snapshot separately.
  *   **Must Lack:** Any gradual transition in the description. Do not describe the *process* of aggregation. Describe State A, cut, Describe State B. This blocks the diachronic identity question ("Did the cells *become* the slug?") and forces the synchronic question ("In State B, is there a slug?").

  ### 3. Session Plan (Two Hours)

  **0:00 – 0:20: Prerequisites & The Hook**
  *   Establish the Existence/Naming distinction.
  *   Introduce the Slime Mold. Show images of scattered cells vs. the crawling slug.
  *   **The Freeze Frame:** "Imagine we take a photo of the scattered cells. Call this Photo A. We take a photo of the slug. Call this Photo B. In Photo A, do the cells compose a further thing? In Photo B, do they?"

  **0:20 – 0:50: Brainstorming & The Misconception Map**
  *   Ask the question. Let them talk.
  *   **Expected Order of Responses:**
      1.  **The Verbal Objection:** "It depends on what you mean by 'thing'." (Will surface immediately).
      2.  **The Functionalist:** "It counts as one thing only when it moves/eats." (Pressures Photo A).
      3.  **The Contact Intuition:** "Only when they touch." (Pressures Photo A).
      4.  **The Identity Slip:** "It's the same organism, just changing shape." (The Diachronic Trap).
  *   **Action:** Write these on the board. Do not correct them yet.

  **0:50 – 1:10: Handling the Verbal Dispute**
  *   **Strategy:** Let it sit. Do not head it off immediately. It is the fastest route into the problem because it reveals their assumption that ontology is linguistics.
  *   **The Turn:** After 15 minutes of debate, intervene. "Okay, let's fix the definition. By 'thing,' we mean 'a physical object that exists independently of our minds.' By 'compose,' we mean 'are parts of.' Given *that*, is there an object in Photo A?"
  *   **The Point:** Show that even with fixed definitions, they still disagree. This proves the dispute is about the *world*, not the *words*.

  **1:10 – 1:40: Pressuring the Extremes**
  *   Use the Slime Mold to attack the middle ground.
  *   **Pressure Common Sense:** "If contact makes an object in Photo B, why doesn't proximity make an object in Photo A? They are communicating chemically in Photo A. How much contact is enough?"
  *   **Pressure Universalism:** "If you say there is an object in Photo A (the scattered sum), is that object alive? Is it hungry? If not, how is it the same kind of thing as the slug?"
  *   **Pressure Nihilism:** "If there is no slug in Photo B, what is crawling across the screen? Just cells? But the cells aren't crawling; the *group* is."

  **1:40 – 2:00: Boundaries & Assessment**
  *   **Refuse to Get Into:**
      *   **Vagueness/Sorites:** Do not allow "How many cells?" questions. Stipulate there are 10,000 cells in both photos.
      *   **Diachronic Identity:** If they ask "Is it the *same* slug?", reply "We are only looking at one photo at a time."
      *   **Formal Mereology:** No transitivity axioms, no fusion operators.
  *   **The Final Question:** (See below).

  ### 4. The Misconception Map & Intervention

  | Misconception | When it surfaces | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"It's just words."** | First 10 mins. | **Let it burn.** Then fix definitions and show disagreement persists. |
  | **"It's about function."** | During Photo B analysis. | Ask: "If the slug freezes (no function), does it cease to exist? If yes, it's an event, not an object." |
  | **"It's the same thing changing."** | Comparing A to B. | **Hard Block.** "I am not asking if it survives. I am asking if it exists *in the photo*." |
  | **"Science decides this."** | Anytime. | Remind: "Biology tells us what the cells *do*. Metaphysics asks what *exists*." |

  ### 5. The Final Assessment Question
  Do not ask them to define "composition" or "nihilism." Ask a question that forces them to reveal their ontological commitment structure.

  **The Question:**
  > "Imagine two physicists describing Photo B (the slug).
  >
  > **Physicist 1** says: 'There are 10,000 cells arranged slug-wise.'
  > **Physicist 2** says: 'There are 10,000 cells and *one slug*.'
  >
  > If both physicists predict the exact same movements and interactions for the next hour, **is there any fact about the world that makes one of them wrong?** If yes, what kind of fact is it? If no, why does it matter?"

  **Why this works:**
  *   If they say "Yes, one is wrong," they are Realists about composition (they believe composition is a fact of the world).
  *   If they say "No, both are right," they are Conventionalists (they believe composition is a choice of description).
  *   If they say "Physicist 2 is wrong," they lean toward Nihilism.
  *   It tests whether they understand that the SCQ is about **ontological surplus**, not predictive power.
