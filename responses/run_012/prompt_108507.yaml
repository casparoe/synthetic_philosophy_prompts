answer: |-
  # The Anthropocene Disagreement Sorter

  **Root Agreement:** Humans have significantly altered Earth systems. Geologists have a formal process (ICS) for naming time units.

  ### Q1: Primary Function
  **Is the term "Anthropocene" primarily a tool for reading rocks (stratigraphy) or a tool for assigning responsibility (historicity)?**
  *   **Rocks:** Go to Q2.
  *   **Responsibility:** Go to Q4.

  ### Q2: Boundary Precision (For "Rocks")
  **Does a geological epoch require a synchronous global spike (a "golden spike") or can it be a diachronous smear (gradual accumulation)?**
  *   **Synchronous Spike:** Go to Q3.
  *   **Diachronous Smear:** *Position: Early Anthropocene (Farming).*
      *   **Cost:** Must accept that "human impact" is inevitable to civilization itself, diluting the critique of modern industry.

  ### Q3: The Marker & Deep Time (For "Synchronous")
  **Which signal defines the line, and will a geologist in the year 3000 see it clearly?**
  *   **Radionuclides/Plastic (1950s):** *Position: Great Acceleration.*
      *   **Cost:** Must accept that colonial extraction and early industrial carbon don't count as the "start," potentially letting historical capitalism off the hook.
  *   **Carbon/Soot (1800s):** *Position: Industrial Anthropocene.*
      *   **Cost:** Must swallow that the signal is geologically messy and hard to distinguish globally from natural variability in the rock record.
  *   **Pollen/Land Use (Medieval/ancient):** *Position: Opportunistic Early Start.*
      *   **Cost:** Incoherent with "Synchronous Spike" requirement (farming wasn't global/sudden enough for a GSSP). *Flagged: Unheld/Incoherent Combo.*

  ### Q4: Formal Status (For "Responsibility")
  **Does the term need official ratification by geologists to be valid, or is it a working concept for scholars/citizens?**
  *   **Needs Ratification:** Go to Q5.
  *   **Working Concept:** Go to Q6.

  ### Q5: Authority (For "Ratification")
  **Who has standing to decide the start date: the Subcommission on Quaternary Stratigraphy or an interdisciplinary/public vote?**
  *   **Subcommission Only:** *Position: Stratigraphic Purist.*
      *   **Cost:** Must accept the term might be rejected (as happened in 2024) even if the planetary change is real, rendering the concept useless for policy.
  *   **Interdisciplinary/Public:** *Position: Political Label.*
      *   **Cost:** Must accept that geologists will view this as a category error, stripping the term of scientific "hardness."

  ### Q6: Utility (For "Working Concept")
  **Does keeping the word "Anthropocene" help mitigate damage or does it naturalize destruction as a "force of nature"?**
  *   **Helps Mitigate:** *Position: Critical Anthropocene (Event).*
      *   **Cost:** Must describe it as an *event* or *process* rather than a *period*, confusing public understanding of geological time.
  *   **Naturalizes Destruction:** *Position: Rejectionist (Drop the Word).*
      *   **Cost:** Must find a new term for planetary change while opponents monopolize the most recognizable one.

  ***

  ### Diagnostic Analysis

  **1. Indistinguishable Positions**
  *   **"Political Label" (Q5) vs. "Critical Anthropocene/Event" (Q6):** These often occupy the same space in practice. Both reject geological formalism in favor of social utility. The tree separates them by *why* they reject formalism (authority vs. consequence), but the resulting argument is usually identical: "Stop asking geologists to solve political problems."

  **2. Incoherent Combinations (The "Impossible" Paths)**
  *   **The "Farming GSSP" (Q2 + Q3):** You cannot argue for a *synchronous global spike* (Q2) and simultaneously choose *Medieval Farming* (Q3). Farming was gradual and regional. If you hold this combo, you are arguing for a geological standard that the evidence physically cannot meet.
  *   **The "Geological Politic" (Q5):** You cannot argue the term *needs official ratification* (Q4) but that *geologists have no standing* (Q5). If geologists don't decide, it isn't ratified by the Subcommission. This is a procedural contradiction.

  **3. Unexplored/Unheld Combos**
  *   **"Industrial Start" + "Political Label Only":** Surprisingly rare. Most people who want an 1800s start want it to be geologically formal to prove the longevity of carbon damage. Those who want it as a political label usually prefer the 1950s start (to highlight capitalism's post-war explosion) or reject the dating entirely.
  *   **"Drop the Word" + "Stratigraphic Purist":** Some geologists reject "Anthropocene" but admit we are in a new stratigraphic unit (e.g., "Human Horizon"). This is a nuanced position often missed in binary debates.

  **4. The Root Confusion**
  *   If you and your friend keep arguing, check **Q1**.
  *   If one of you is answering based on **Rocks** (will plastic survive?) and the other based on **Responsibility** (when did the crime start?), you are not having the same argument. One of you is asking about the *archive*, the other is asking about the *accusation*.
