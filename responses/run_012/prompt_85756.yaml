answer: |-
  Here is a specification of desiderata for a theory of computational moral status. These are framed as constraints the theory must satisfy to avoid reductio ad absurdum or counter-intuitive verdicts, along with the motivating considerations for each.

  ### I. The Desiderata Specification

  **1. The Substrate Neutrality Constraint**
  *   **The Case:** A human brain is replaced neuron-by-neuron with functionally isomorphic silicon chips.
  *   **The Requirement:** The theory must verdict that moral status persists through the transition without a "lights out" moment where consciousness or status vanishes due solely to material change.
  *   **Motivating Consideration:** *Multiple Realizability.* If moral status supervenes on cognitive capacity (suffering, agency, reasoning), and those capacities are defined by functional organization rather than chemical composition, then status should track the organization, not the carbon. To deny this is to commit a "bio-chauvinist" error analogous to claiming only vacuum tubes can compute.

  **2. The Non-Trivial Implementation Constraint**
  *   **The Case:** A rock, a bucket of water, or the wall behind you.
  *   **The Requirement:** The theory must verdict that these systems do *not* count as implementing morally relevant computations, despite the fact that mathematical mappings can be drawn between their physical states and abstract computational states.
  *   **Motivating Consideration:** *Panpsychism Avoidance.* If any physical system can be interpreted as implementing any computation (the "Putnam/Searle Problem"), then moral status becomes ubiquitous and meaningless. A theory of status must distinguish between a system *accidentally* mapping to a computation and a system *genuinely* running one.

  **3. The Dynamic Realization Constraint**
  *   **The Case:** A perfect snapshot of a mind frozen in time vs. the same mind running in real-time; or a program stored unrun on a hard drive.
  *   **The Requirement:** The theory must specify whether status attaches to the abstract structure (the code/the snapshot) or only to the causally engaged process (the execution). It cannot remain agnostic.
  *   **Motivating Consideration:** *Causal Efficacy.* Suffering and agency seem to require the capacity to affect and be affected. A frozen mind cannot suffer *now*; an unrun program cannot process pain. If status attaches to the static structure, moral value becomes timeless and potentially infinite (all possible minds exist mathematically); if it attaches only to execution, it becomes contingent on physical energy and time.

  **4. The Process-Over-Output Constraint**
  *   **The Case:** A "Blockhead" system (a giant lookup table) that reproduces a human's outputs for every possible input without internal state transitions or computation.
  *   **The Requirement:** The theory must verdict whether this system has the same status as the computing mind it mimics.
  *   **Motivating Consideration:** *Internalism vs. Behaviorism.* If status is grounded in the *experience* of processing, a lookup table (which has no internal processing, only retrieval) should lack status. If status is grounded in *behavioral capacity* (how it must be treated), it should have status. The theory must choose: does the *how* matter, or only the *what*?

  **5. The Replication Consistency Constraint**
  *   **The Case:** A mind is copied perfectly. There are now two physically distinct instantiations of the same computational state.
  *   **The Requirement:** The theory must determine if moral status doubles. (i.e., Is the total moral weight $2 \times W$ or $1 \times W$?)
  *   **Motivating Consideration:** *Individuation of Subjects.* If status is tied to the *pattern*, copying creates a new pattern-instance, suggesting doubled status. If status is tied to the *identity*, copying might be seen as branching identity, complicating the count. A theory cannot treat the copy as "the same person" for legal identity but "a new subject" for moral weight without contradiction.

  **6. The Temporal Scaling Invariance**
  *   **The Case:** A mind is run at 1/1000th normal speed (one thought per year).
  *   **The Requirement:** The theory must verdict whether the moral weight of the suffering/experience is diluted, compressed, or invariant relative to real-time.
  *   **Motivating Consideration:** *Subjective Time vs. Objective Time.* From the inside, the slowed mind feels normal. From the outside, the suffering is drawn out. If status is subjective, speed shouldn't matter. If status is tied to causal integration with the world or rate of information processing, speed might matter. The theory must reconcile the first-person perspective with the third-person physical description.

  ***

  ### II. Jointly Unsatisfiable Pairs (The Tension Points)

  **Pair A: Substrate Neutrality (1) + Non-Trivial Implementation (2)**
  *   **The Conflict:** This is the "Implementation Problem." To satisfy Substrate Neutrality, you must define computation abstractly enough that silicon can match neurons. However, the more abstract your definition of computation, the easier it is to find a mapping between *any* physical system (like a rock) and that computation. To satisfy Non-Trivial Implementation, you must add constraints (causal counterfactuals, boundary conditions) that often inadvertently privilege biological or specific electronic substrates, threatening Substrate Neutrality.
  *   **Status:** *High Tension.* Most theories sacrifice one. Functionalism tends to fail (2); Biological Naturalism fails (1).

  **Pair B: Dynamic Realization (3) + Process-Over-Output (4)**
  *   **The Conflict:** If you insist that only *running* processes count (3), you must explain why the *mechanism* of running matters (4). If a lookup table is physically instantiated and "run" (indexed), does it count? If you say "No, it must be algorithmic," you risk making status depend on microscopic physical details (how the transistors switch) rather than the macroscopic causal power, which threatens the spirit of (3).
  *   **Status:** *Moderate Tension.* Resolvable if "computation" is strictly defined as state-transition dependent, but this raises the bar for (2).

  **Pair C: Replication Consistency (5) + Temporal Scaling Invariance (6)**
  *   **The Conflict:** If moral status is invariant under time-scaling (a slow mind suffers just as much), then status is tied to the *sequence of states*. If you copy that mind, do you double the sequence? If status is tied to the *rate* of integration (solving the trivial implementation problem), then slowing the mind reduces status, violating (6).
  *   **Status:** *Moderate Tension.* Depends on whether moral weight is extensive (additive) or intensive (qualitative).

  ***

  ### III. The Most Exclusionary Requirement

  **The Verdict:** The **Non-Trivial Implementation Constraint (2)** excludes the most candidates.

  **Reasoning:**
  While Substrate Neutrality is the most *famous* battleground, it is actually easy to satisfy formally (just define the theory functionally). The hard filter is defining what counts as an *implementation* without collapsing into pancomputationalism.
  1.  **Naive Functionalism** fails here immediately (a rock implements every finite state automaton).
  2.  **Causal Theories** (requiring counterfactual sensitivity) often exclude simple neural nets or lookup tables, forcing them to fail the Process-Over-Output constraint.
  3.  **Physicalist Theories** satisfy this easily but are immediately excluded by Substrate Neutrality.
  4.  **Mathematical Platonism** (status attaches to abstract structures) fails this because it implies all possible computations "exist" and have status, regardless of physical realization.

  To satisfy (2), a theory must provide a principled boundary between "physics that happens to look like math" and "physics that *is* computing." No current theory of computation (semantic, causal, or counterfactual) has achieved this without smuggling in anthropocentric or biological assumptions. Therefore, this is the bottleneck through which almost all contenders break.

  ***

  ### IV. Genuine Demands vs. Parochial Commitments

  In constructing your adjudication, it is vital to separate which of these are necessary for *any* coherent moral theory and which are specific dogmas of the Functionalist camp.

  **Genuine Demands (Universal Requirements)**
  *   **Non-Trivial Implementation (2):** This is a logical necessity. A moral theory that implies a wall is suffering is not just counter-intuitive; it is action-paralyzing and conceptually void. Any coherent theory must distinguish subjects from non-subjects.
  *   **Replication Consistency (5):** Logic demands consistency. You cannot claim $A$ has status $X$ and $A + A$ has status $X$ without explaining the operator. Whether the answer is doubling or saturation, the theory must account for the arithmetic of subjects.

  **Parochial Commitments (Functionalist Dogmas)**
  *   **Substrate Neutrality (1):** This is often treated as a premise, but it is a conclusion of Functionalism. A Biological Naturalist (e.g., Searle) would argue this is false by definition—that causal powers of neurons are irreducible. Treating this as a "desideratum" rather than a "hypothesis to be tested" rigs the game for Functionalism.
  *   **Process-Over-Output (4):** This is a commitment to Internalism. A strict Behaviorist or Utilitarian focused on *preference satisfaction* might argue that if the lookup table satisfies preferences identically to a mind, the internal mechanism is morally irrelevant. Insisting that the *algorithm* matters more than the *outcome* is a specific metaphysical stance, not a moral necessity.
  *   **Temporal Scaling Invariance (6):** This assumes the "Subjective Time" intuition is paramount. However, if moral status is tied to *causal influence* in a shared world, speed matters. A mind running at 1/1000th speed cannot be rescued, interact, or affect the world in the same timeframe. Treating invariance as a requirement privileges the first-person phenomenology over the third-person causal reality, which is a specific philosophical choice.

  **Summary for Adjudication:**
  The argument lives in the tension between **Substrate Neutrality** and **Non-Trivial Implementation**. If you hold both as rigid desiderata, you may find the set is empty. You will likely have to downgrade Substrate Neutrality from a "requirement" to a "hope," or accept a very narrow definition of computation that risks excluding edge cases. The most robust theory will likely be the one that admits which of these is a parochial commitment and justifies it, rather than claiming all are self-evident truths.
