      *   *Williams' Defense:* He allows for "imaginative acquaintance." But the critique remains: Where is the line between *finding* a reason and *creating* a reason?
      *   *Name for it:* The **"Continuity Constraint"** or the problem of **"Substantive Deliberation."** Korsgaard calls it the problem of how reasons can be *both* internal and *normative*. But the specific logical worry the user has is often framed as the **"Empty vs. False Dilemma"** regarding the deliberative route. I should explain *why* it feels sneaky: it tries to get normativity (you *should* deliberate this way) out of psychology (this is what you *would* do). That's a version of the **Is-Ought gap** applied to deliberation.

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the question. Validate that the conflation is real and annoying.
