      *   *Thesis 2: Judgment Internalism (Motivation Internalism).* About the *connection between moral judgment and motivation*. "If A judges that they ought to $\phi$, then A is motivated to $\phi$ (ceteris paribus)."
      *   *Thesis 3: Humean Theory of Motivation.* About the *metaphysics/psychology of action*. "Beliefs alone cannot motivate; desire (or pro-attitude) is necessary for motivation."

  3.  **Map the Relationships (The "Conceptual Map"):**
      *   *Domain:*
          *   Reasons Internalism $\rightarrow$ Normativity/Semantics (What makes a reason claim true?)
          *   Judgment Internalism $\rightarrow$ Moral Psychology (What happens when we judge?)
          *   Humean Motivation $\rightarrow$ Philosophy of Action (How does action start?)
      *   *Entailments:*
          *   Humean Motivation $\rightarrow$ Supports Reasons Internalism (if you need a desire to act, you can't have a reason to act without a possible desire). But it doesn't strictly entail it (you could have a reason you *can't* act on).
          *   Judgment Internalism $\rightarrow$ Independent. You can be a Judgment Internalist but an Externalist about Reasons (e.g., Kantians often). You can be a Reasons Internalist but deny Judgment Internalism (e.g., amoralists).
      *   *The Conflation:* People mix them up because they all seem to say "Motivation is key." But one is about *truth*, one is about *judgment*, one is about *mechanics*.

  4.  **Develop Concrete Cases (The "Separation"):**
      *   *Case 1: The Amoralist.* Judges "I ought to help," feels no motivation.
          *   Violates Judgment Internalism.
          *   Consistent with Humean Motivation (has belief, lacks desire).
          *   Consistent with Reasons Internalism (if no desire exists even after deliberation, no reason exists).
      *   *Case 2: The Depressed Agent.* Judges "I ought to eat," has a deep desire to live, but currently no motivation.
          *   Violates Judgment Internalism (maybe).
          *   Consistent with Reasons Internalism (Williams saves the reason via the *counterfactual* deliberation).
          *   Consistent with Humean Motivation (action requires desire, which might be dormant).
      *   *Case 3: The Kantian Externalist.* Believes reason exists independently of desire.
          *   Denies Reasons Internalism.
          *   Might accept Judgment Internalism (rational nature compels).
          *   Denies Humean Motivation (reason alone can motivate).

      *Refining the Case for the User:* I need a single scenario or a set of minimal pairs that shows the *logical independence*.
      *   *Pair A (Judgment vs. Reason):* The Amoralist. Judges right, no motive. (Denies Judgment Internalism). Does he have a reason? Externalist says yes, Internalist says no.
      *   *Pair B (Humean vs. Reason):* The Ignorant Agent. Has a desire (thirst), doesn't know the glass has petrol. Humean says motivation is possible. Williams says no reason to drink (deliberation would reveal truth).

  5.  **Address the "Sneaky Counterfactual" (Williams' Sound Deliberation):**
      *   *The User's Intuition:* Is it empty (tautology) or does it change the person (false)?
      *   *The Philosophical Problem:* This is often called the **"Extension Problem"** or the problem of **"Normative Transformation."** Sometimes linked to the **"Ideal Advisor"** model critiques.
      *   *The Tension:*
          1.  *Conservatism:* If deliberation only means means-end reasoning + factual correction, it's too narrow. It can't generate new ends. (The "Empty" charge).
