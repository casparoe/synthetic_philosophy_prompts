      *   *Section 4: The Williams Counterfactual (The "Sneaky" Bit).*
          *   Address the "Empty vs. False" dilemma.
          *   Explain the **"Continuity Constraint."**
          *   Explain the risk of **Question-Begging Normativity.** (To define "sound" deliberation, you need prior norms, which undermines the internalist project of grounding norms in psychology).
