      *   User's View (Renormalization): This eliminates the possibility of (North AND Ridge). So P(North AND Ridge) becomes 0. The remaining probability mass (North AND Creek + South) is rescaled to sum to 1.
          *   Remaining mass = 0.25 (Creek) + 0.5 (South) = 0.75.
