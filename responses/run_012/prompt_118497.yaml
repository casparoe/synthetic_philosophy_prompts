      *   For SAR, if you rule out a sector, you renormalize the whole map. That is the standard. I will endorse the User's view as the standard procedure but acknowledge the Friend's view requires a specific condition (witness reliability regarding North/South choice vs. sub-sector choice).

  3.  **Develop the Procedure:**
      *   Need a step-by-step flow that fits in prose.
