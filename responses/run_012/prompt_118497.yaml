answer: |-
  I have spent a lot of time thinking about the puzzle you and your friend argued over, and I want to start by telling you that your instinct was the operationally correct one, even if the arithmetic felt shaky compared to your friend's cleaner split. The reason you are right and your friend is wrong in the context of search-and-rescue mapping comes down to what we are actually counting when we draw those lines on the map. We are not counting abstract possibilities like heads or tails on a coin; we are distributing a fixed amount of search effort over a fixed amount of ground. When a witness tells you the ridge is out, they are physically removing a chunk of the puzzle board. If you remove a quarter of the board, the remaining pieces must become larger to cover the whole picture, or else you are admitting there are gaps where the subject could be but you aren't looking. Your friend's method keeps the South half fixed at one half, which implies that ruling out the North Ridge tells us nothing about the likelihood of the subject being in the South. But it does tell us something. It tells us the subject is not in the North Ridge, which makes every other remaining square inch of the map relatively more likely than it was before. So for your first case, the procedure endorses your calculation: the South becomes two thirds and the Creek Bottom becomes one third. The only time your friend's calculation would be the right one is if the witness statement was not about the subject's location but about the subject's preference in a way that is independent of geography. For example, if the witness said, "He loves creek bottoms so much that if he were in the North, he would definitely be in the Creek," but that statement gave us no reason to believe he wasn't on the Ridge, just that he prefers the Creek. But in SAR, we treat witness statements as intelligence that eliminates possibility space. If the Ridge is out, the probability mass of the Ridge must be redistributed to everything else that is still possible. Your friend's error was treating the label North as a container that holds its weight even when you empty out half its contents. In our work, the container's weight is the sum of its contents.

  Now I need to give you the procedure you asked for, the one you can read over the radio to a volunteer who is tired and thinks math is a waste of time. The core rule is conservation of probability mass. You start with a map that adds up to one hundred percent. Every statement you get either moves mass from one sector to another or it removes mass from a sector and forces you to spread the remainder across what is left. You never just delete numbers without fixing the total. The first step is to write down the current probability of every sector before you hear the new statement. This is your baseline. The second step is to classify the statement into one of three types. The first type is an elimination, like your ridge case. The second type is a redirection, where someone says he is likely here rather than there. The third type is a hedge, where someone uses words like probably or maybe. Once you have classified the statement, you apply the arithmetic. If it is an elimination, you set the probability of that sector to zero. Then you add up the probabilities of all the remaining sectors. This sum will be less than one. You divide each remaining sector's probability by that sum. This is the renormalization you did in your head. If it is a redirection, you take a percentage of the probability from the unlikely sectors and move it to the likely sector. If it is a hedge, you treat the word probably as a number, and I recommend your team standardize on seventy-five percent. So if a witness says he is probably at the lake, you treat that as a seventy-five percent confidence that he is at the lake given the conditions they described. The third step is to check for contradictions or empty maps. If the math tells you every sector is zero, the statement is false, and you must revert to your prior numbers or keep a small sliver for unknown terrain. The fourth step is where the buck stops with you. The arithmetic is easy; the hard part is deciding which type of statement you heard. That is a judgment call, not a math problem. You have to decide if the witness is reliable enough to zero out a sector or if you should only discount it. You have to decide if two witnesses contradicting each other means you split the difference or trust the one who knows the subject better. The procedure gives you the numbers, but you give the procedure the inputs.

  Let us apply this to your second case, the farmhand who says if he is not at the trailhead he is probably at the lake. This is a hedge combined with a conditional. You cannot zero out the trailhead because the witness did not say he is definitely not there. You cannot zero out everywhere else because the witness said probably, not certainly. Here is how you run the numbers. Assume your map currently has the Trailhead at fifty percent, the Lake at twenty percent, and the rest of the woods at thirty percent. The witness statement links the Trailhead and the Lake. It says if not Trailhead, then Lake is the strong favorite. To make this arithmetic work without a computer, you treat the statement as a weight adjustment. You decide that probably means seventy-five percent confidence. You look at all the sectors that are not the Trailhead. In this example, that is the Lake and the Rest of the Woods, which together hold fifty percent of the probability. The witness says of that fifty percent, seventy-five percent of it should be at the Lake. So you calculate seventy-five percent of fifty percent, which is thirty-seven point five percent. You assign that to the Lake. The remaining twenty-five percent of that non-Trailhead mass, which is twelve point five percent, stays with the Rest of the Woods. The Trailhead keeps its original fifty percent because the witness did not rule it out. Your new numbers are Trailhead fifty percent, Lake thirty-seven point five percent, Rest of the Woods twelve point five percent. You then check if this makes sense. If the Trailhead is searched and found empty later, you then zero it out and renormalize the Lake and Woods. At that point, the Lake would hold about seventy-five percent of the remaining search effort. The place where you are deciding something and dressing it up as arithmetic here is the choice of seventy-five percent. You could have chosen sixty percent or ninety percent. There is no mathematical law that says probably equals seventy-five percent. That is a policy decision you make as the coordinator so your team is consistent. You need to tell your volunteers that when we hear probably, we cut the alternative options in half or we move three quarters of the weight to the suggested spot. Pick one rule and stick to it so the map doesn't jump around based on who is holding the radio.

  The third case is where the procedure will fail you, and I need to be honest about that because you will face it when the pressure is high. This is the case where two witnesses contradict, or the statement empties the map. Suppose one witness says he went North and another says he went South, and you have no reason to trust one over the other. The arithmetic cannot solve this. If you follow the elimination rule for both, you have zero probability everywhere. If you follow the redirection rule, you might end up with numbers that don't reflect the conflict. Here the procedure hands the decision to you. You must assign a credibility weight to the witnesses before you do any math. If Witness A is the subject's spouse and Witness B is a stranger, you might decide to treat Witness A as fact and Witness B as noise. You would then run the math using only Witness A's statement. If both are equally credible, you might split the difference, effectively averaging their inputs. But this is not arithmetic; this is leadership. You are deciding how much truth is in the room. The same applies if a statement empties the map. If a witness says he saw him jump in the creek and you have searched the creek and found nothing, the witness is either wrong or the subject is dead in a way you cannot search. If you follow the math strictly, you assign zero probability to the entire map and you stop searching. That is unacceptable. In this case, you must override the math. You keep a baseline probability, perhaps ten percent, distributed across the map as a error margin, or you revert to the prior probabilities from before the statement arrived. You tell your team that the witness statement is downgraded to a hint rather than a rule. This is where you sign off on the map. You cannot blame the calculator for this. You have to look at the volunteer who brought the statement and decide if they are mistaken, lying, or misunderstood. The procedure tells you when the numbers break, but it does not tell you how to fix them. That is your job.

  So to summarize the rule you can read out loud. First, write down what you have now. Second, decide if the new info kills a sector, moves weight, or is just a guess. Third, if it kills a sector, set it to zero and divide everyone else by the new total. Fourth, if it is a guess like probably, move seventy-five percent of the relevant weight to the suggested spot. Fifth, if the math breaks or people disagree, you decide who to believe and you keep enough probability on the map to keep searching. The only place you are doing real math is in the third and fourth steps. The first, second, and fifth steps are you interpreting human behavior and terrain. Your friend's puzzle failed because he tried to solve the second step with the third step. He tried to use arithmetic to decide if the witness statement changed the North-South relationship. It did, because eliminating the Ridge makes the North less attractive than the South unless you have a reason to think the North is magnetic. Your version respects the geometry of the search area. His version respects the logic of the sentence but ignores the geometry of the map. In our job, the map wins. If you cannot search the Ridge, the North is smaller, and the South is relatively bigger. Tell your team that we redistribute the work based on where the ground is, not just where the words are. And when the words make no sense, you make the call and we adjust the numbers to match your decision. That is the only way to keep the arithmetic honest.
