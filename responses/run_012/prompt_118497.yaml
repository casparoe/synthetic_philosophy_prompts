      *   Decision: The User's approach (renormalization) is the robust SAR standard for "eliminating" sectors. The Friend's approach requires assuming the witness is only commenting on behavior *within* North without affecting the likelihood of being in North vs South. But if Ridge is impossible, being in North is less likely than before (unless South was also impossible, which it isn't).
      *   Wait, let's look closer. If I say "If it rains, I bring an umbrella," does that change the probability of rain? No. But here we are locating a missing person. The statement is about the *location*. "If he is in North, he is in Creek." This is equivalent to "He is not in North Ridge."
