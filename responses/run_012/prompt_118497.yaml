      *   Need to address contradictions. If Witness A says X, Witness B says Not X. You need a reliability weighting.
      *   Need to identify the "Buck Stops Here" moment. It's when interpreting the *meaning* of the words, not the arithmetic.

  4.  **Drafting the Content - Section by Section (mental outline):**
      *   **Opening:** Acknowledge the difficulty, validate the user's experience. Set the tone (colleague to colleague).
      *   **The Core Rule:** The "Elimination vs. Insight" distinction.
      *   **Case 1 Analysis:** Endorse the User's renormalization (2/3 South, 1/3 Creek). Explain why (eliminating space increases relative probability of remaining space). Explain when Friend is right (if witness is only valid on sub-sector behavior *given* North, which is rare in SAR).
      *   **The Procedure (woven in):**
