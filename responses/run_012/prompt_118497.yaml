      *   Which is correct? This is a classic problem in conditional probability and evidence updating (Bayesian vs. logical constraint).
      *   The key distinction is whether the witness statement is treated as *new evidence about the subject's location* (which eliminates possibilities globally) or as *information about the subject's behavior conditional on being in a region* (which reshapes the region but doesn't shift weight between regions).
      *   Actually, strictly speaking, "If North, then Creek" eliminates the state {North, Ridge}.
