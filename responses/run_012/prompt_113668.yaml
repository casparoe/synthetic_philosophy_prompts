answer: |-
  Here is the specification for the position you are developing. It treats the theory as an engineering problem: defining the load-bearing requirements, the tolerance limits, and the points of structural failure.

  ### 1. The Case Load (Functional Requirements)
  An adequate theory must yield determinate verdicts on the following scenarios without ad-hoc adjustment.

  *   **The Torture Intuition:** A single person undergoing severe agony cannot be justified by any aggregate of mild pleasures (e.g., billions of people enjoying a slightly better taste of ice cream).
      *   *Requirement:* **Lexical Priority above Threshold.** Above a specific intensity/duration of suffering, the utility function for pleasure goes to zero or becomes orthogonal.
  *   **The Pinprick Counter-Intuition:** A trivial pain (a mosquito bite) must not veto a massive amount of happiness (a lifetime of paradise).
      *   *Requirement:* **Threshold Sensitivity.** The lexical priority must switch off below a defined severity level. Ordinary trade-offs must apply here.
  *   **The Duration/Intensity Trade-off:** A short, sharp agony vs. a long life of mild contentment.
      *   *Requirement:* **Metric of Severity.** The theory must define whether the threshold is triggered by peak intensity, total integrated suffering, or a combination. It cannot be vague on where "ache" becomes "agony."
  *   **The Interpersonal Trade:** One person's agony vs. a different person's bliss.
      *   *Requirement:* **Agent-Neutrality of the Threshold.** The threshold must apply to the suffering itself, not merely to the sufferer's relationship to the compensator. (i.e., You can't torture A just because B is happy).
  *   **The Risk Prospect:** A 0.0001% chance of severe agony vs. a 100% certainty of moderate good.
      *   *Requirement:* **Probability Weighting.** The theory must specify how the lexical threshold interacts with probability. Does a tiny probability of threshold-suffering retain lexical priority over a certainty of pleasure?

  ### 2. The Distinctions (Conceptual Boundaries)
  The theory must not collapse the following distinctions. If it does, it loses explanatory power.

  *   **Lexical Infinity vs. Heavy Weight:**
      *   *Distinction:* Is the disvalue of agony *infinite* (or lexicographically prior), or just *very large*?
      *   *Constraint:* If it is just "very large," it fails the Torture Intuition (given enough mild pleasure, it will eventually be outweighed). If it is "infinite," it risks failing the Risk Prospect (paralysis). The theory must state which it is.
  *   **Outcomes vs. Lotteries:**
      *   *Distinction:* Ranking certain states of affairs vs. ranking gambles.
      *   *Constraint:* A theory that works for outcomes but yields cycles or paralysis for lotteries is not action-guiding.
  *   **Intrapersonal vs. Interpersonal:**
      *   *Distinction:* Trade-offs within one life vs. across lives.
      *   *Constraint:* Many threshold views work intrapersonally (I choose pain now for gain later) but fail interpersonally (I inflict pain on you for gain to me). The spec demands the threshold hold interpersonally.
  *   **Commensurability Types:**
      *   *Distinction:* One cardinal scale (utilitarianism) vs. Ordinal ranking vs. Bare pairwise comparability.
      *   *Constraint:* Your view requires **Partial Commensurability**. Below the threshold, values are cardinally comparable. Above the threshold, they are ordinally ranked against pleasure (Suffering > Pleasure, always). The theory must formalize this switch.

  ### 3. Constraints vs. Prejudices
  Not all demands on a moral theory are genuine logical constraints. Some are ideological commitments of rival camps.

  **Genuine Constraints (Non-negotiable for coherence):**
  *   **Transitivity:** If A > B and B > C, then A > C. (Without this, choice is impossible).
  *   **Action-Guidance:** The theory must produce a verdict in finite time. (No "calculate the infinite sum" requirements).
  *   **Non-Contradiction:** Cannot prescribe both "Do X" and "Do not do X" for the same agent in the same state.

  **Camp Prejudices (Negotiable for your specific view):**
  *   **Continuity (The Archimedean Property):** *Prejudice of Standard Utilitarianism.* This states that for any three outcomes A > B > C, there is some probability *p* such that a gamble of *p(A) + (1-p)(C)* is equivalent to B. **Your view explicitly violates this.** Do not accept this as a requirement; it is the thing you are rejecting.
  *   **Separability:** *Prejudice of Aggregative Views.* The idea that the value of a whole is just the sum of the parts. Your threshold view implies a structural constraint on the whole (the presence of agony changes the value of the pleasure).
  *   **Risk-Neutrality:** *Prejudice of Expected Utility Theory.* The idea that we simply maximize mathematical expectation. Your view likely requires risk-aversion regarding suffering.

  ### 4. Incompatible Requirements (The Structural Fault Lines)
  Here is the pair of requirements that cannot be jointly satisfied without significant theoretical cost.

  **The Pair:** **Strict Lexical Priority** AND **Standard Decision Theory under Risk.**

  *   **The Conflict:** If agony is lexically worse than *any* amount of pleasure, then in a risk context, *any* non-zero probability of agony dominates *any* probability of pleasure.
  *   **The Consequence:** You cannot cross the street (tiny risk of death/agony) to get coffee (moderate pleasure). This is the "Paralysis Problem."
  *   **The Tension:** To make the view action-guiding (Risk Prospect case), you must dilute the lexical priority when probabilities are low. But if you dilute it, you betray the core intuition (Torture case) that agony *never* trades off.
  *   **Resolution Cost:** You must either accept paralysis (reject action-guidance in high-safety societies) or introduce a "probability threshold" alongside the "suffering threshold" (e.g., lexical priority only kicks in if probability > 0.001%). The latter risks arbitrariness.

  ### 5. The Single Most Ruling-Out Requirement
  If you had to pick one criterion that eliminates the most candidates, it is this:

  **Continuity under Risk (The Archimedean Condition).**

  *   **Why:** Almost all standard normative decision frameworks (Expected Utility Theory, Harsanyi's Utilitarianism, standard Cost-Benefit Analysis) rely on Continuity. It ensures that everything is trade-able given the right probabilities.
  *   **Impact:** By insisting that *some* suffering is not trade-able against *any* pleasure even under risk, you invalidate the mathematical machinery used by 90% of existing welfare economics and decision theory. You force the construction of a new decision rule (e.g., Lexical Expected Utility, or a discontinuous value function). This is the highest technical barrier to entry.

  ### 6. Evaluation of Existing Shapes
  How the two obvious competitors fare against this spec.

  **Ordinary Additive Utilitarianism (AU)**
  *   **Verdict:** **Fails Spec.**
  *   **Reason:** It satisfies Continuity and Risk-Neutrality perfectly. It handles the Pinprick and Risk cases well. However, it fundamentally fails the **Torture Intuition**. Because it places pain and pleasure on a single cardinal scale, enough mild pleasure *always* outweighs severe agony. It collapses the distinction between "ache" and "agony" into mere quantity.

  **Plain Negative Utilitarianism (NU)**
  *   **Verdict:** **Fails Spec.**
  *   **Reason:** It satisfies the Torture Intuition (pain is all that matters). However, it fails the **Pinprick Counter-Intuition**. If only pain matters, then a world with paradise + one headache is worse than a world with nothing. It also creates severe **Paralysis under Risk**; since the reduction of pain is the only good, any risk of creating pain vetoes any certainty of creating pleasure. It lacks the **Threshold Sensitivity** required to allow normal life to function.

  **Your Position (Threshold Lexical)**
  *   **Status:** **Theoretically Viable but Mathematically Costly.**
  *   **Reason:** It passes the Torture and Pinprick cases by splitting the domain. However, to pass the **Risk Prospect** case without paralysis, you must define how probability discounts the lexical weight. If you say "Lexicality holds even at p=0.000001," you get paralysis. If you say "Lexicality vanishes at low p," you must explain why the *nature* of the suffering changes based on the *likelihood* of it occurring. That is the specification gap you need to fill.
