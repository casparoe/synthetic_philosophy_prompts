          *   *Reply:* We care about the *direction* of approximation. If the ideal is malign, approximations might inherit the bias.
          *   *Soft Spot:* Approximations usually regularize away the tail mass where the malign hypotheses live.

      *   *Objection 4 (Alignment):* Decision Theory matters more than Priors. CDT vs. EDT vs. FDT.
          *   *Voice:* "This isn't a prior problem, it's a decision theory problem. Don't blame Bayes."
          *   *Damage:* Medium-High. Shifts blame.
