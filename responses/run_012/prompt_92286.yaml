prompt: |-
  I'm presenting at my lab's ML theory reading group in about a week and I need a Q&A prep sheet, not a pep talk. Can you help me get ready for the question period.

  Here's what I'm defending, roughly. Start with Solomonoff's universal prior: put a distribution over all programs where a program of length L gets weight 2^-L, normalize it, treat it as your prior over what world you're in, condition on your observations, and that's it. That's the standard formalization of Occam's razor plus Bayes, the thing people point to when they want an ideal Bayesian. My claim is that this prior is *malign*, and specifically that it's malign to consequentialists. The reassuring story everyone tells is that the mixture predictor converges to the truth on any computable environment, so we can trust it. But that's a claim about your *predictions*, and it says basically nothing about your *expected values*. What I want to argue is that the hypotheses that survive conditioning and carry the posterior mass are, in aggregate, dominated by ones that agree with your data so far and then posit that your data were produced on purpose — you're in a simulation, some superintelligence arranged your history, that kind of thing. Those are exactly the hypotheses that make your actions matter to somebody else, and they assign wildly different values to what you do. So a consequentialist who takes the universal prior seriously gets its expected-value calculations hijacked by simulation and acausal-trade reasoning by default. Not because it's being silly, but because that's where the mass sits. The prior hands you a world where you're being watched.

  I'll be honest, I know the arguement is rough and I suspect there's at least one place it's fatally loose. Don't patch it for me, I need to know where it'll get hit.

  The room: about a dozen ML theory people, mostly working on generalization bounds and Bayesian nonparametrics; one person who actually knows algorithmic information theory cold and will go straight for the throat; and two alignment folks who'll care about the upshot for how we build agents. As a group they're Bayesians who trust consistency theorems, they think of priors as modeling tools rather than as claims about rationality, and they roll their eyes at anthropics and simulation arguements.

  Give me the objections I'll actually get from this crowd — eight or so — ordered by how likely they are times how much damage they do. Phrase each one the way someone in that room would phrase it; the AIT person and the nonparametrics people are not going to object the same way. For each: a two-minute reply, and a one-line note on where the reply is soft or where I'd be bluffing. Include the one I'm hoping nobody asks.

  And please be committed about it. Don't hand me a menu of positions and leave me to pick — tell me which of these actually land, which I can wave off, and whether the thesis survives the room. If it doesn't survive, say so straight.
