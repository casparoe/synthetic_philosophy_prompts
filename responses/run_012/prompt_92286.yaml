      *Decision:* The "Hope Nobody Asks" will be about the **Reference Machine Dependency**. SI isn't unique; it depends on the UTM. If the malignancy depends on the UTM choice, it's not a fundamental property of reasoning, just an artifact of encoding. That kills the universality claim.

