          *   *Soft Spot:* It's true. You can't run SI.

  4.  **Refining and Ordering:**
      *   Need to order by Likelihood $\times$ Damage.
      *   *Top:* The AIT complexity attack (Objection 1). It's the most technical and devastating.
      *   *Second:* The Convergence/Decision link (Objection 2). ML theorists love consistency theorems.
