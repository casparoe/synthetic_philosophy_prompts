  **TO:** The Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 24
  **SUBJECT:** Recommendation for Autumn Cycle Allocation

  **Recommendation**
  I recommend we award the full grant to the **Regional Museum** for the restoration of the walled garden, subject to the conditions outlined below. Funds must be committed by **31 March** of the coming year.

  **The Mandate and the Banker's Objection**
  We must begin by addressing the position that the donor's instructions are incoherent. Our colleague argues that beauty and affection cannot be weighed on a common scale and that we should instead fund whichever project shows the better outcomes per pound. This is a utilitarian argument, and it is incompatible with the trust's founding deed.

  The donor did not leave us a general charitable fund; she left us a philosophical test. She explicitly invoked G. E. Moore's *Principia Ethica*, which rests on the premise that while "beautiful things" and "human affection" are distinct, they are commensurable constituents of the Good. If we refuse to weigh them against one another, we are not merely disagreeing with the donor's philosophy; we are refusing to perform the duty she assigned us. We cannot retreat to cost-benefit analysis to escape the difficulty of her request. We must judge the intrinsic worth of the proposals, not merely their efficiency.

  **The Isolation Test: Affection vs. Presence**
  To decide between the finalists, we must apply the donor's first instruction: *What would the world be like if it contained nothing but that thing?*

  Consider the neighborhood organization's proposal. They offer "reliable presence" and explicitly state this is "not friendship in any thick sense." If we imagine a universe containing nothing but reliable weekly visits devoid of thick friendship, what do we have? We have the alleviation of loneliness. We have the absence of a bad thing. But Moore distinguishes sharply between the absence of pain and the presence of pleasure. The "pleasures of human affection" require a specific qualitative state of mind—love, warmth, mutual regard. The organizers have candidly admitted they are not providing this. They are providing a service that manages isolation. Under the isolation test, a world of mere service is preferable to a world of suffering, but it does not contain the *greatest goods* the donor specified. It is instrumental, not intrinsic.

  Now consider the garden. If the world contained nothing but this walled garden, it would contain beauty. Moore argues that beautiful things possess intrinsic value, even without an observer, though their value is vastly increased when appreciated. The museum's projection—that a few hundred people will pass through mostly indifferent—is a serious problem, but it is a problem of *degree*, not *kind*. The garden *is* a beautiful thing. The mentoring program, by its own definition, *is not* the pleasure of affection. We can fix the engagement levels of a garden; we cannot fix the categorical definition of a service that disavows the very good we are mandated to fund.

  **Organic Unities: The Unnoticed Garden**
  This brings us to the second instruction: *The worth of a whole is not the sum of the worth of its parts.* This is Moore's principle of organic unities. A beautiful garden is one part; the consciousness of a viewer is another. The value lies in the *whole* formed by their conjunction.

  My colleague argues that the garden is the only proposal answering the trust's distinctive purpose, while another argues that persons matter more than plants. Both miss the point of the organic unity. A person without beauty is not necessarily better than a garden without people, but a person *appreciating* beauty is a higher good than either alone. The museum's current projection suggests the "whole" will be weak: a beautiful object plus indifferent passersby yields low value.

  However, this is where the donor's instructions run out and ordinary judgment must take over. The donor told us *what* to value, not *how* to secure it. It is our judgment that a garden which no one stops to see fails the test of "enjoyment." Therefore, we cannot fund the garden as currently described. We must fund the garden *on the condition* that the museum alters the organic unity of the project to ensure the beauty is actually apprehended.

  **The Strongest Case for Rejection**
  I must acknowledge the strength of the argument for the mentoring program, which I am rejecting. The strongest philosophical case for the neighborhood organization is that value ultimately resides in states of consciousness. A brick wall, no matter how beautiful, is dead matter. A human mind, even in a thin relationship, is a vessel for experience. If we take Moore's emphasis on "consciousness" seriously, one could argue that lighting up the inner life of an isolated elder is inherently more valuable than arranging stones and plants, regardless of how "thick" the friendship is. The visit creates a conscious state of relief and connection; the garden merely sits there. If we believe the donor's love of Moore was primarily a love of *human* flourishing, the mentoring program is the truer heir. I reject this only because the organizers have explicitly disclaimed the specific good (affection) that Moore identified as the highest form of that flourishing.

  **Conditions for Allocation**
  To ensure the garden project actually fulfills the trust's requirements regarding the "enjoyment" of beauty, I propose two conditions:

  1.  **Engagement Programming:** The museum must allocate 10% of the grant specifically to programming designed to slow visitors down (e.g., seating, guided contemplation hours, or educational signage), ensuring the "consciousness of beauty" is part of the organic whole.
  2.  **Public Access Deadline:** The garden must be fully open to the public by **1 October** of next year. If the site remains a bramble pit beyond this date, the funds revert to the trust capital.

  **Conclusion**
  The banker is wrong that we cannot compare these goods; the donor insisted we must. The humanist is wrong that people always trump plants; Moore valued beauty intrinsically. The distinctive-purpose trustee is right, but only if we ensure the beauty is actually enjoyed. The mentoring program is a worthy charity, but it is not what this trust was built to fund. The garden is. Let us make sure it is seen.
