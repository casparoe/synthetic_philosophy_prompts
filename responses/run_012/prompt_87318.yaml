answer: |-
  Here is a session plan designed for cognitive science grad students. It treats them as intellectual peers on the science side but novices on the metaphysics side. The goal is to prevent them from dismissing disjunctivism as "denying the data."

  ### 1. The Prerequisites (First 10 Minutes)
  Before you state the argument, you must install two conceptual distinctions. If you skip these, they will translate everything into neural correlates immediately, and you will lose the room.

  *   **Distinction A: Epistemic vs. Ontological.**
      *   *Tell them:* "Indistinguishable from the inside" is an epistemic claim (about what the subject can know). "Same kind of mental state" is an ontological claim (about what the state *is*).
      *   *Why:* CogSci students treat indistinguishability as proof of identical neural substrates. You need to pry apart *subjective certainty* from *metaphysical identity*.
  *   **Distinction B: Causal vs. Constitutive.**
      *   *Tell them:* "The brain is causally necessary for experience" is compatible with "The world is constitutively part of the experience."
      *   *Why:* They will assume that because the brain mediates the signal, the experience is *of* the brain state. Disjunctivism denies this inference.

  ### 2. The Carrying Case (Selection & Setup)
  **Do not use the "Veridical Hallucination" (chair present by luck).**
  *   **Why:** It introduces coincidence. If there is a chair, students will argue about causal chains (is there *some* subtle causal link?). It muddies the water.
  *   **Use:** **The Causally Matching Hallucination.**
      *   *Case A (Good):* You see a chair. Light reflects off the chair, hits your retina, standard processing.
      *   *Case B (Bad):* A neuroscientist stimulates your visual cortex to produce a state *subjectively identical* to Case A. There is no chair.
  *   **What it must have:** Subjective indistinguishability (by stipulation).
  *   **What it must lack:** Any causal connection to the object in the Bad Case.
  *   **Why this works for this audience:** It respects their methodology (neural manipulation) while isolating the philosophical variable (the presence of the object).

  ### 3. The Sequence (The Argument & The Diagnosis)
  *Total Time: 35 Minutes*

  **Step 1: The Trap (The Argument from Hallucination)**
  1.  In the Bad Case, you are not related to a chair (none exists).
  2.  Yet, you have an experience.
  3.  Therefore, the immediate object of experience in the Bad Case is mental (a representation/sense-datum).
  4.  **The Hinge (The Common Kind Assumption):** Because the Good and Bad cases are indistinguishable from the inside, they must share the same fundamental mental nature (the "Common Ingredient").
  5.  **Conclusion:** Therefore, in the Good Case, the immediate object of experience is *also* mental. You are never directly aware of the world, only of your internal representation.

  **Step 2: The Diagnosis (Disjunctivism)**
  *   **Do not present this as a "solution." Present it as a rejection of the Hinge.**
  *   Tell them: "Disjunctivism says Step 4 is a non-sequitur."
  *   **The Move:** Indistinguishability is epistemic, not ontological.
      *   *Analogy:* A fake diamond and a real diamond can be indistinguishable to the naked eye. That doesn't mean they share the same fundamental chemical structure. It just means your eyes (and your introspection) have limits.
  *   **The Disjunction:** "I see a chair" is either:
      1.  A relation to an actual chair (Good Case).
      2.  A mere seeming state that mimics (1) (Bad Case).
  *   **Why it's a diagnosis, not a dodge:** It diagnoses the error as assuming that *phenomenology must be determined solely by internal states*. It argues that the external world can be a constituent of the mind, not just a cause of it.

  ### 4. Addressing Misconceptions (Interleaved or Dedicated 10 Minutes)
  CogSci students will have three specific knee-jerk reactions. Head them off explicitly.

  1.  **"Disjunctivism denies hallucinations happen."**
      *   *Correction:* No. It denies they share a *common fundamental nature* with veridical perception. Hallucinations are real mental events; they just aren't the *same kind* of event as seeing.
  2.  **"It's just the trivial claim that sometimes we see and sometimes we don't."**
      *   *Correction:* No. The rival view (Representationalism) says even when we see, we only see a representation. Disjunctivism claims the *structure of the experience itself* changes depending on the world.
  3.  **"Predictive Processing proves the Common Kind Assumption."**
      *   *Correction:* PP explains *how* the brain generates the signal. It does not dictate the *metaphysics* of what that signal constitutes. PP is compatible with Disjunctivism if you view the "prediction" as a mechanism that enables the relation, rather than the relation itself. (Be careful here; don't get bogged down, but don't let them dismiss you as anti-science).

  ### 5. The "Work" Worry (5 Minutes)
  *Should you include it?* **Yes, but flag it as the "Explanatory Challenge."**
  *   **The Worry:** If the Good Case and Bad Case feel the same, what "work" is the external chair doing for the *subject*? If the phenomenology is fixed by the brain, isn't the world an "explanatory idler"?
  *   **The Disjunctivist Reply:** The world isn't explaining the *feeling* (which is limited); it is constituting the *fact* of the experience. You aren't explaining why it feels like something; you are explaining what that feeling *is*.
  *   **Why include it:** It shows you aren't hiding from the hard part. It validates their intuition that the brain does the heavy lifting while maintaining the philosophical distinction.

  ### 6. The Diagnostic Question (Final 5 Minutes)
  Do not ask them to define disjunctivism. Ask them to apply the structure.

  **The Question:**
  > "If we reject the Common Kind Assumption, we admit that two experiences can be subjectively indistinguishable yet metaphysically distinct. **What, then, explains the indistinguishability?** If it's not a shared mental ingredient, what is the commonality between the hallucination and the perception?"

  *   **What this tests:**
      *   If they say "The brain state," they understand the CogSci commitment but haven't grasped the Disjunctivist challenge (which questions if brain state = experience nature).
      *   If they say "Nothing, it's just a brute fact," they understand the Disjunctivist "negative" claim.
      *   If they say "The hallucination is defined by its resemblance to the perception," they have grasped the core Disjunctivist move (the Bad Case is parasitic on the Good Case).

  ### 7. What to Explicitly Exclude
  To stay within the hour, put these on the "Parking Lot" board and refuse to move unless time permits:
  1.  **Sense-Data Theory History:** Don't teach the 1950s debate. Teach the structural logic.
  2.  **Specific Disjunctivist Camps:** Do not distinguish between McDowell (Epistemic) and Martin (Metaphysical). It's too granular.
  3.  **Naive Realism nuances:** Don't get into whether colors are mind-independent. Keep it about the *relation*.
  4.  **The "Screening Off" Argument:** This is the technical version of the "Work Worry." Use the plain English version (Section 5 above).

  ### Summary of the "Real Hinge"
  You are correct. The hinge is the move from **Indistinguishability** to **Common Kind**.
  *   **The Argument relies on:** Indistinguishability $\rightarrow$ Common Nature.
  *   **Disjunctivism strikes at:** Indistinguishability $\nrightarrow$ Common Nature.
  *   **Your job:** Convince them that introspection is not a metaphysical microscope. Just because two things look the same to the subject doesn't mean they are made of the same stuff.

  ### Instructor's Note on Tone
  They will view the brain as the generator of reality. You must frame Disjunctivism not as "magic" (direct contact with the world bypassing the brain) but as "metaphysics" (the brain is the *medium* of the relation, not the *object* of the relation). If you let them think you are denying the brain's causal role, you will lose them in minute five.
