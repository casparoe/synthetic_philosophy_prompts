prompt: |-
  I sit on the board of a small city foundation that runs a Remembrance Fund — about 200k a year, split among groups doing memorial and education work tied to different historical atrocities. Our charter says we don't rank suffering and that no group's claim outweighs another's, which sounded great until we actually had to cut checks. Last meeting we spent two hours doing the ranking we swore we wouldn't do, and our lawyer says we need criteria that are objective and consistently applied or rejected applicants will have grounds to sue. So comparison keeps sneaking back in through the side door. One board member keeps insisting, in a way I can't quite answer, that two atrocities can be neither equal in seriousness nor one worse than the other, and that this is different from just saying we can't compare them at all. There's also a concrete fight: one applicant wants funding for a permanent exhibit that lays several atrocities out on a single timeline, and another applicant says the side-by-side format is itself a ranking and shouldn't be funded.

  Draft the short decision memo I'll circulate before next meeting. I need an actual allocation rule for this cycle, a line on what we tell the timeline exhibit people, and the strongest case against my recommendation answered honestly rather than waved away. 400 words max. Say how confident you are in the recommendation and flag the one point your least sure about.
