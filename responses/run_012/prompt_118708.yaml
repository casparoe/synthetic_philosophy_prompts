answer: |-
  This is a classic "judge craft" problem. Your professor is testing whether you can synthesize a judicial philosophy from a pattern of outcomes rather than just matching keywords. You are right to be uneasy: the packet is designed to look like it supports multiple theories until you stress-test them against the *exceptions* in her record.

  Here is the breakdown of Okonjo's jurisprudence, the prediction for *Halvorsen*, and the discriminating test you need.

  ### 1. Evaluating Your Three Candidate Rules

  You have correctly identified the tension in the packet. Here is the viability assessment:

  *   **(a) Hard Textualism: DEAD.**
      *   **Why:** A hard textualist would not use §2 (a purpose clause) to define "fill material" (Case 1), nor would they rewrite "newspaper" to mean "website" (Case 5) unless they subscribed to the "absurdity doctrine" (which hard textualists often reject or limit strictly). Okonjo explicitly leaned on §2 to expand scope in Case 1. That is not hard textualism.
  *   **(c) Intentionalism: DEAD.**
      *   **Why:** Intentionalism treats legislative history as a primary source of meaning. Okonjo cites the 1997 report only as *confirmation* of a reading she claims to get from the text (Case 6). She never uses history to *override* text. She is not reconstructing intent; she is interpreting text.
  *   **(b) Purposivism: ALIVE, BUT INCOMPLETE.**
      *   **Why:** This is your strongest candidate, but a pure purposivist would likely have found a way to waive the §9 penalty for the "two-person outfit" (Case 3) or read a *de minimis* exception into the 1.02-acre rule (Case 4) to avoid burdening the purpose with trivialities. Okonjo refuses to soften clear mandates even when it seems harsh or hyper-technical.

  **The Better Fit: "Pragmatic Textualism Anchored by Purpose"**
  Okonjo operates on a hierarchy:
  1.  **Operative Text Controls:** If the text is a specific number or mandate (§9 penalty, §5 one-acre line), she follows it rigidly (Cases 3 & 4).
  2.  **Purpose Resolves Ambiguity/Scope:** If a term is undefined ("fill") or susceptible to formalistic evasion ("public road"), she uses §2 to determine the substantive meaning (Cases 1 & 2).
  3.  **Impossibility Trumps Text:** If literal compliance makes the statute impossible to execute, she adapts the mechanism (Case 5).

  ### 2. Prediction: *Halvorsen Development*

  **Vote:** **For the Calder Wetlands Alliance (Halvorsen loses).**
  **Outcome:** The six applications are aggregated; mitigation is required for the 5.1-acre total.

  **Reasoning:**
  Okonjo will distinguish this from the 1.02-acre case (Case 4) and align it with the Logging Road case (Case 2) and the Tires case (Case 1).

  *   **Distinguishing Case 4 (1.02 Acres):** In that case, the *measurement* was precise. The legislature set a bright line, and she refused to blur it for equity. In *Halvorsen*, the issue is not measurement precision; it is **structural evasion**. Okonjo showed in the *Logging Road* case that she looks behind labels ("public road") to substance ("public expense"). She will treat "permit application" not as a paperwork label, but as a request to alter a "project."
  *   **Anchoring in §2:** In Case 1 (Tires), she used §2 to define an undefined term ("fill"). Here, she will use §2's command to "prevent the cumulative loss" to define the unit of analysis for §5. To read "permit application" as "any single piece of paper regardless of project unity" would render §2's "cumulative loss" language surplusage. Okonjo treats §2 as operative when the text is susceptible to manipulation.
  *   **The "Loophole" Principle:** Like the *Logging Road* exemption, Okonjo interprets the Act to prevent easy evasion. Phasing is a known loophole in environmental law. A judge who refuses to let a private road count as "public" to save a wetland will not let a developer split a subdivision to save a wetland.

  **The Opinion Voice:**
  Expect her to write that while she respects the legislature's one-acre line (citing Case 4), the legislature did not intend to authorize the *fragmentation* of projects. She will frame this as interpreting the word "application" in context, not redrawing the acreage line.

  ### 3. The Risk (Why you might be wrong)

  The counter-argument is strong: **Case 4 is the strongest analog.**
  In Case 4, she said: *"The one-acre line is the legislature's, not the court's."*
  If Halvorsen argues that §5 says "permit application" and they submitted six applications, Okonjo might say: *"The mitigation trigger is the application. If the Department wants to regulate projects, they must write the statute to say 'project.' I will not rewrite the trigger any more than I would rewrite the acreage."*

  If she votes for **Halvorsen (Department wins)**, she is prioritizing **Predictability/Bright Lines** over **Anti-Evasion**. This would signal that her use of §2 (Case 1) is limited to *undefined terms* ("fill"), not *redefining clear procedural terms* ("application").

  ### 4. How to Discriminate (The Test Case)

  The packet underdetermines the conflict between **Bright Lines (Case 4)** and **Substantive Purpose (Case 1/2)**. To know for sure which value wins, you need a case where the text is clear, but following it actively *thwarts* the purpose (without making it impossible).

  **The Discriminating Case:**
  *Hypothetical:* A developer fills 0.5 acres of wetland to build a stormwater retention pond that *improves* the hydrological function of the remaining wetlands (advancing §2), but does so without a permit (violating §4's clear ban).
  *   **Question:** Does Okonjo enforce the §4 ban (Textual/Bright Line) or allow a "net benefit" defense (Purposive)?
  *   **Why it works:**
      *   If she enforces the ban: She is a **Textualist who uses Purpose only for ambiguity.** (She won't override clear prohibitions).
      *   If she allows the defense: She is a **Purposivist who uses Text as a default.** (Purpose can override clear text if the outcome aligns with §2).

  **Do you need more than one?**
  One is sufficient if it forces a clash between Text and Purpose. However, a second case involving **Legislative History** would clarify Rule (c).
  *   *Hypothetical:* The 1997 Committee Report explicitly says "we intend to exempt small farmers," but the Text (§6) does not list them.
  *   **Why:** Okonjo uses history to *confirm*. If history *contradicts* text, does she follow the text (Textualist) or the history (Intentionalist)? My bet is she follows the text, killing Intentionalism completely.

  ### 5. Summary for Your Final

  *   **Rule:** Okonjo is a **Pragmatic Textualist**. Text controls mandates and numbers; Purpose (§2) controls scope and definitions; Impossibility controls procedure.
  *   **Prediction:** **Alliance Wins.** She treats phasing as substantive evasion (like the Logging Road), not a technical compliance (like the 1.02 acres). She will use §2 to define "application" as "project."
  *   **Caveat:** Acknowledge the tension with Case 4. If she votes Department, she has elevated "Bright Lines" above "Anti-Evasion."
  *   **Live Rules:** Purposivism is the only live candidate, but it must be constrained by her refusal to ignore numerical mandates. Hard Textualism and Intentionalism are inconsistent with the packet.

  **Seminar Tip:** When you write your answer, explicitly cite the *Logging Road* case as the controlling analogy. That is the key to unlocking her "substance over form" approach to loopholes. If you can explain why *Halvorsen* is more like *Logging Road* (evasion) than *1.02 Acres* (measurement), you will demonstrate you understand her hierarchy.
