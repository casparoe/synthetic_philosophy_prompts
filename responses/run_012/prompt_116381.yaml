  4. Deliberately exclude the Theory of Recollection and Gettier problems to prevent metaphysical or technical distractions, stating aloud that this session concerns the intrinsic value of the state rather than its definition or origin.
  5. End by asking whether a god who guarantees your true beliefs forever removes the need for knowledge, forcing them to defend knowledge's value independent of reliability.
