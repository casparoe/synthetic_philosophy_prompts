answer: |-
  **Final-Year Seminar: Logical Uncertainty**
  **In-Class Final Examination**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question 1 (20 Marks)**

  Consider a reasoner operating within a formal system containing ordinary arithmetic. The system's language includes a provability predicate $\square$, where $\square A$ means "I can derive $A$ from my axioms." A student proposes the reasoner should adopt two principles:

  *   **(P1) Proof Implies Certainty:** If the reasoner derives $A$, it assigns $A$ probability 1 (formally: If $\vdash A$, then $\vdash \square A$).
  *   **(P2) Provability Implies Truth:** The reasoner may reason with the rule $\square A \to A$ (formally: $\vdash \square A \to A$ for all $A$).

  Show that accepting both P1 and P2 allows the reasoner to derive any statement $X$, including contradictions. (Hint: Consider constructing a sentence that speaks to the consequences of its own provability).

  Once you have demonstrated this triviality, identify which principle is the culprit. Explain why the other principle is generally safe to keep. Propose a specific replacement for the culprit principle suitable for a reasoner under logical uncertainty, and discuss the epistemic cost of this replacement. Specifically, address why simply adding a consistency axiom to the system fails to resolve the underlying issue.

  ***

  **Model Answer**

  Accepting both P1 and P2 renders the system inconsistent via a variation of Löb's Theorem. To show the reasoner can derive any statement $X$, we utilize the Diagonal Lemma. This lemma allows us to construct a sentence $L$ such that $\vdash L \leftrightarrow (\square L \to X)$. Informally, $L$ asserts: "If I am provable, then $X$ is true."

  Assume P1 and P2 hold.
  1.  Assume $\square L$ (that $L$ is provable).
  2.  By P2 ($\square A \to A$), we have $\square L \to L$. Since we assumed $\square L$, we derive $L$.
  3.  From the definition of $L$, we have $L \to (\square L \to X)$. Since we derived $L$, we derive $\square L \to X$.
  4.  Since we assumed $\square L$ in step 1, we now derive $X$.
  5.  Thus, the assumption $\square L$ leads to $X$. By standard logic, we have proven $\square L \to X$.
  6.  But $\square L \to X$ is exactly the content of $L$. So we have proven $L$.
  7.  By P1 (Necessitation), since we proved $L$, we have $\square L$.
  8.  Since we have $\square L$ and $\square L \to X$, we derive $X$.

  Since $X$ was arbitrary, we can choose $X = \bot$ (contradiction). The system proves everything.

  The culprit is **P2**. P1 is merely the assertion that the reasoner recognizes its own valid proofs; if the axioms are sound, recognizing a proof as a proof is harmless. P2, however, asserts that the system can internally verify its own soundness ($\square A \to A$). By Gödel's Second Incompleteness Theorem, a consistent system containing arithmetic cannot prove its own consistency. Since $\square \bot \to \bot$ is equivalent to consistency ($\neg \square \bot$), P2 demands the system prove something impossible for a consistent system.

  Simply adding a consistency axiom (e.g., $\neg \square \bot$) does not fix this. P2 requires $\square A \to A$ for *all* $A$, not just $\bot$. Even if we assume consistency, the system cannot prove the schema $\square A \to A$ internally without collapsing. Adding $\neg \square \bot$ creates a stronger system, but the new system faces the same limitation regarding its *own* provability predicate. It pushes the problem to a meta-system without solving the self-trust issue.

  For a reasoner under logical uncertainty, P2 should be replaced with **Probabilistic Reflection**. Instead of $\vdash \square A \to A$, the reasoner assigns high probability to the claim that its proofs are sound, but not certainty. For example, $P(A \mid \square A) \approx 1$, but strictly less than 1. Alternatively, the reasoner treats $\square A$ as strong evidence for $A$, rather than a guarantee.

  The epistemic cost is significant. The reasoner loses the ability to be certain of its own consistency. It must maintain a non-zero probability that it is inconsistent, even if it finds no contradictions. This prevents the "trust collapse" but means the reasoner can never fully close the loop on its own reliability. It must always reserve some doubt for the possibility that its axioms or inference rules are flawed, preventing the derivation of arbitrary truths but also preventing absolute self-verification. This is the necessary price of avoiding triviality while remaining computationally bounded and logically uncertain.

  ***

  **Marking Scheme**

  **1. Derivation of Triviality (4 Marks)**
  *   **Must Hit:** Correctly uses a self-referential sentence (via Diagonal Lemma intuition) to show that P1 + P2 $\vdash X$ for any $X$.
  *   **Common Pitfall:** Students argue vaguely about "paradoxes" without showing the derivation steps, or they confuse this with the Liar Paradox rather than Löb's structure.

  **2. Identification of the Culprit (4 Marks)**
  *   **Must Hit:** Explicitly identifies **P2** as the problematic principle.
  *   **Common Pitfall:** Blaming P1 (arguing proofs aren't sound) or blaming both equally. P1 is standard necessitation; P2 is the unprovable reflection principle.

  **3. Explanation of Failure & Consistency Patch (4 Marks)**
  *   **Must Hit:** Explains P2 violates Gödel's 2nd Incompleteness (system cannot prove own soundness) AND explains why adding a consistency axiom fails (the schema applies to all $A$, not just $\bot$, and shifts the burden to a meta-system).
  *   **Common Pitfall:** Claiming adding $\neg \square \bot$ solves it, or failing to explain *why* P2 is impossible for consistent systems.

  **4. Proposed Replacement (4 Marks)**
  *   **Must Hit:** Proposes a probabilistic weakening (e.g., $P(\square A \to A) < 1$ or $P(A \mid \square A) \approx 1$).
  *   **Common Pitfall:** Suggesting "stronger axioms" or "better logic" rather than relaxing the certainty requirement of P2.

  **5. Discussion of Costs (4 Marks)**
  *   **Must Hit:** Articulates the loss of self-certainty (cannot be sure of own consistency) as the necessary trade-off.
  *   **Common Pitfall:** Claiming the cost is "computational slowness" or "approximation error" rather than the fundamental epistemic limitation on self-trust.
