  **Candidate Refrain Lines:**
  1.  *"Time is money spent."* (Too cliché, reduces philosophy to economics.)
  2.  *"Rest is a right."* (Too legalistic, lacks the guilt/ethic dimension.)
  3.  *"I have earned this."* (Selected. It functions as a boast of salvation, a legal claim to wages, and an ironic epitaph.)
  4.  *"No hour is truly free."* (Selected as secondary refrain. It enforces the thesis of linked *otium* and *negotium*.)

  **Decision:**
  The poem will use "I have earned this" and "No hour is truly free" as the interlocking refrains. The form will hold through the Protestant and Statutory stanzas, then rupture at the *karoshi* stanza where the voice claiming the earnings is extinguished. The closing stanza will attempt to restore the opening line, revealing the impossibility of the ledger closing.

