  **Commentary**

  I treat the Protestant ethic primarily as affect (guilt in quiet) rather than doctrine, simplifying Weber for lyrical economy. The *karoshi* threshold is rendered as a singular "number," whereas legal standards vary by jurisdiction and context; this reduction serves the poem's need for a definitive rupture but sacrifices legal nuance. A specialist might contest the totalizing claim that "no hour is truly free," arguing it denies the possibility of resistant leisure or uncommodified time. The formal break in stanza four substitutes the expected refrain ("Hours stack…") with "The pulse does not…"; this halts the mechanical return of the pantoum to signify the worker's absence. The final stanza reinstates the opening line ("The ledger opens…"), but in the context of death, this return is a lie: the ledger opens for no one. The poem risks didacticism to ensure the political argument lands on exhausted students.
