prompt: |-
  I'm the TA for a second-year undergraduate module called "Moral Revolutions: Ethics and Historical Change," and I'm marking the term-time response papers while the convenor is away. The papers are worth 20 per cent of the module mark and are capped at 600 words, and the rubric we agreed on divides 20 marks as follows: 6 for an accurate reconstruction of the interest-based explanation and the historical debate it has provoked, 6 for an accurate reconstruction of the honor-based explanation, 4 for critical evaluation of the two against each other, and 4 for the use of concrete historical examples. The question the convenor set for this paper was: "Do moral revolutions -- the ending of practices such as dueling and slavery -- come about through arguments, through interests, or through honor? Reconstruct the honor-based account of how moral revolutions happen and assess whether it can absorb the argument-based and interest-based explanations." The paper I have to mark reads in full: "The abolition of the slave trade and the end of dueling are often described as moral revolutions: practices that were once honorable became unthinkable within a generation. This essay argues that neither arguments nor interests can carry the explanatory load on their own, and that Appiah is right to put honor at the center.

  The interest-based explanation is associated with Eric Williams. In Capitalism and Slavery Williams argued that the British West Indian sugar economy had gone into decline by the end of the eighteenth century, and that the abolition of the slave trade in 1807 and of slavery in 1833 were therefore the cutting of losses rather than the triumph of conscience. Williams's critics have not overturned this picture. Seymour Drescher showed that the British West Indian economy was still expanding at the moment of abolition, which shows that economic interests cannot explain abolition at all. What remains, then, is argument and honor.

  The argument against slavery had been available long before it changed anything: natural-rights theorists had condemned it, and the Quakers had petitioned against it in the seventeenth century. Appiah's explanation is that moral argument alone never moves people to act. What moves them is honor. Dueling, foot-binding and slavery each ended when the practice came to be seen as dishonorable rather than as a mark of status, so that continuing it exposed a person to shame. In each case the change was a change in what was honored, not a discovery of new reasons.

  The important qualification is that Appiah does not think slavery became wrong when people stopped honoring it. The wrongness was always there; honor simply did the work of changing conduct. Honor is the efficient cause of the revolution, not its ground. Since honor codes are local and variable, though, Appiah's account implies that moral revolutions are not really moral progress, only changes in taste.

  One might set against Appiah Singer's expanding circle, on which moral progress consists in extending to ever wider circles the concern we already extend to our kin. I think the expanding circle explains dueling better than honor does: Regency duelists came to include one another in the circle of full moral concern, and dueling disappeared once the antagonist's interests were taken seriously. The two accounts are therefore rivals, and the expanding circle is the more parsimonious."

  I have read it once and would like a second opinion before I commit to a mark. Could you grade it out of 20 and give me the specific comments that justify the grade, working through the paper point by point rather than giving me a general impression? For each substantive point the student makes, I'd like to know whether it is accurate, and where it is not, exactly what has gone wrong -- a conflation, a misattribution, an inference that does not follow, an overstated claim -- together with a sentence on what a stronger answer would have said in its place. Some of what is wrong here is the kind of thing a hurried reader would pass over because the prose is fluent and the vocabulary is right, so please separate the slips that should cost real marks from the ones that are merely infelicities, and say which passages the student would have to rewrite in order to move up a grade band. I would also like your judgment on how the paper handles the historical debate over abolition, since that element of the rubric is the one I find hardest to apply consistently, and a final classification (first, upper second, lower second, third) alongside the mark.
