answer: |-
  **Essay Question**

  The accuracy-first program argues that rational credences must be probabilistic because non-probabilistic credences are accuracy-dominated. Reconstruct this argument carefully. Specify precisely what kind of dominance relation holds between incoherent and coherent credence functions. Explain why the distinction between a rival that is at least as accurate in every world and one that is strictly more accurate in every world matters for the argument's force. Discuss whether the result depends on the choice of scoring rule or the partition of states. Explain why this argument constrains coherence but leaves the problem of priors unresolved. Finally, assess the objection that dominance reasoning requires justification itself: why should epistemic rationality care about dominance?

  ***

  **Model Answer**

  The accuracy-dominance argument contends that holding incoherent credences is epistemically irrational because such credences are guaranteed to be less accurate than some alternative coherent credence function, regardless of how the world turns out. To evaluate this, one must distinguish between weak and strong dominance. Weak dominance obtains when a rival credence function is at least as accurate as the target in every possible world and strictly more accurate in at least one. Strong dominance obtains when the rival is strictly more accurate in every possible world.

  The standard accuracy argument aims to establish strong dominance. It proves that for any incoherent credence function, there exists a coherent probabilistic function that is strictly more accurate at every world, given a strictly proper scoring rule. This distinction is crucial for the argument's compellingness. If only weak dominance were established, an agent could defend their incoherence by claiming they are certain the actual world lies within the subset where their credences tie with the rival. Strong dominance closes this escape route; since the incoherent credences are strictly worse everywhere, no belief about which world is actual can justify retaining them. Thus, strong dominance provides a categorical prohibition on incoherence, whereas weak dominance offers only a provisional one.

  However, this result is not metaphysically necessary; it is relative to technical presuppositions. Specifically, the argument depends on the use of strictly proper scoring rules. These rules are designed so that an agent maximizes expected accuracy by reporting their true credences, incentivizing honesty and coherence. If an improper scoring rule were used, a probabilistic function might not dominate an incoherent one, undermining the vindication of probabilism. Furthermore, the result is sensitive to the partition of states. Accuracy is measured relative to a specific algebra of propositions. A credence function might be undominated relative to a coarse partition but dominated relative to a finer one. Therefore, the normative force of the argument is tied to the chosen framework of measurement; it vindicates probabilism only relative to appropriate scoring rules and partitions.

  Even if successful, the argument leaves the problem of priors untouched. The dominance relation is asymmetrical: while every incoherent function is dominated by some coherent one, no coherent function is dominated by another coherent function (assuming strictly proper rules). Consequently, the argument successfully constrains rational agents to be probabilistic, but it does not dictate which probability function they should adopt. Any coherent assignment avoids accuracy dominance. Thus, accuracy-first epistemology solves the synchronic constraint of coherence but fails to determine specific credal content, leaving the agent underdetermined without additional principles like objective priors or chance-following norms.

  Finally, one must justify why dominance reasoning binds epistemic rationality. The objection arises because dominance is a decision-theoretic principle, not an obvious epistemic truth. A defender replies that accuracy-first epistemology is fundamentally consequentialist: accuracy is the sole fundamental epistemic good. If epistemic rationality is the pursuit of accuracy, then choosing an option known to be less accurate than another in every possible state is instrumentally irrational. Dominance reasoning is simply the application of instrumental rationality to the epistemic goal. Without accepting this link between accuracy and rationality, the dominance argument loses its normative grip, reducing to a mathematical fact without ethical or epistemic force.

  ***

  **Marking Scheme**

  **1. Identification of Dominance Type (4 marks)**
  *   **Must hit:** Clearly distinguishes weak dominance (≥ everywhere, > somewhere) from strong dominance (> everywhere) and identifies that the standard argument claims strong dominance of coherent over incoherent credences.
  *   **Typical error:** Candidates conflate the two or claim the argument only establishes weak dominance.

  **2. Significance of Dominance Distinction (4 marks)**
  *   **Must hit:** Explains that weak dominance allows an "escape route" (belief that the actual world is in the tie-set), whereas strong dominance rules out incoherence categorically regardless of worldly beliefs.
  *   **Typical error:** Candidates state the difference matters but fail to explain *why* it affects the rationality assessment (the escape route).

  **3. Technical Preconditions (Scoring Rules & Partitions) (4 marks)**
  *   **Must hit:** Notes that the result requires strictly proper scoring rules and is sensitive to the partition/algebra of propositions; it is not rule-independent.
  *   **Typical error:** Candidates treat the result as holding for any measure of accuracy or ignore the partition sensitivity.

  **4. Problem of Priors (Underdetermination) (4 marks)**
  *   **Must hit:** Explains that while incoherent functions are dominated, coherent functions are not dominated by each other, so the argument constrains form but not content (leaving priors unresolved).
  *   **Typical error:** Candidates claim the accuracy argument selects a unique correct probability function or solves the prior problem.

  **5. Normative Force of Dominance (4 marks)**
  *   **Must hit:** Justifies dominance reasoning via epistemic consequentialism (accuracy as the goal); argues that ignoring dominance is instrumentally irrational relative to that goal.
  *   **Typical error:** Candidates assume dominance is self-justifying or fail to link it to the consequentialist framework of epistemic utility.

  **Total: 20 marks**

  ***

  **Note to TAs on Confidence and Uncertainty**

  I am highly confident in the philosophical structure of this model answer and its alignment with the standard curriculum for this seminar. The point on which I am least certain is the universal claim that *strong* dominance holds for all strictly proper scoring rules without additional convexity conditions; some technical variations only guarantee weak dominance depending on the geometry of the credence space. However, for the purposes of this course, treating strong dominance as the standard result is pedagogically appropriate.
