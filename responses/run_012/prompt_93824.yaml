answer: |-
  The standard debate over advance directives is a stalemate between two metaphysical intuitions. On one side, the "same person" view argues that personal identity persists through dementia, so the earlier self's values bind the later self. On the other, the "critical interest" view suggests that once the capacity for valuing is lost, the earlier self's authority evaporates, leaving only the current well-being of the living organism. This binary is unproductive. It forces us to decide whether the demented patient is "you" or "someone else" before we can decide what to do. To move past this, we must examine a specific, aggressive subclass of directive: the pre-emptive directive.

  Unlike a standard directive, which instructs providers on what to do if the patient becomes non-responsive or vegetative, a pre-emptive directive anticipates a conscious, dissenting future self. It says, in effect: "I know that later I will be cheerful. I know I will insist I am happy. I know I will demand to stay alive. I command you to ignore all of that." This is not a instruction for silence; it is an instruction for censorship. I argue that this kind of directive is self-undermining. By explicitly predicting the future self's dissent, the earlier self concedes the later self's status as a locus of judgment. Once that standing is granted, it cannot be revoked by a clause in a document. The pre-emptive directive attempts to exercise authority over a future agent while simultaneously admitting that agent exists. In doing so, it possesses less moral authority than a standard directive, and arguably none at all.

  To understand why, we must first locate where the authority of any advance directive comes from. Generally, three justifications are offered. The first is **Identity**: the agent at Time 1 and the agent at Time 2 are numerically identical, so the choice at Time 1 is the choice of the person at Time 2. The second is **Proxy**: the agent at Time 2 cannot speak, so the document acts as a voice for the voiceless. The third is **Integrity**: the document protects the agent's life-long narrative unity against temporary fragmentation or insanity.

  A standard directive fits comfortably within these boxes. If I am in a persistent vegetative state, the Proxy justification holds: I cannot speak, so my past words speak for me. If I am severely demented, the Integrity justification holds: my current state is a fragmentation of my true self, so my past self protects the narrative whole.

  The pre-emptive directive, however, breaks these mechanisms. It explicitly removes the Proxy justification because it admits the future self *can* speak. It is not filling a silence; it is overriding a voice. It weakens the Identity justification because it highlights a rupture in will. If we are the "same person," why is there a civil war between my past and future wills that requires a gag order? Most crucially, it strains the Integrity justification. To write a pre-emptive directive, I must model my future self's psychology. I must simulate his happiness, his desires, and his reasoning. In doing so, I acknowledge that he is a valuing creature. I am not predicting a biological reflex; I am predicting a moral stance. By acknowledging that the future self has a moral stance, I grant him the very standing I am trying to deny.

  This leads to the core contradiction. Authority over another being requires either that the being lacks capacity (paternalism) or that the being has consented to the authority (contract). The pre-emptive directive cannot claim consent, because the future self is, by definition, repudiating the arrangement. Therefore, it must claim paternalism. It must assert that the future self is incompetent to judge his own good. But the content of the directive undermines this claim. I cannot predict that my future self will be "cheerful" and "insist on staying alive" based on values unless I attribute to him the capacity to hold values. If he is truly incompetent, like a stone or a infant in a coma, he cannot "insist" on anything in a morally relevant sense. He can only cry out.

  If the future self is merely crying out, a standard directive suffices. We don't need a pre-emptive clause to ignore the vocalizations of a vegetative patient. The pre-emptive directive is only necessary if the future self is coherent enough to argue for his life. But if he is coherent enough to argue, he is coherent enough to possess autonomy. To acknowledge his coherence in the prediction ("he will say he is happy") and then deny his autonomy in the command ("do not listen") is a performative contradiction. The document says: "He is a judge, but his verdict is void." It tries to strip the future self of authority by an act that confirms the future self's agency. You cannot bootstrap authority over a conscious agent by simply declaring them subordinate in a document they did not sign and cannot contest.

  The most obvious objection to this is the Parent/Child analogy. Parents frequently issue pre-emptive commands regarding their children. A parent knows the child will scream when the medicine is administered. The parent knows the child will insist the medicine is poison. The parent writes, effectively, "Ignore his screaming." We do not think this undermines parental authority. We do not think the parent concedes the child is an equal locus of judgment simply by predicting the child's dissent. So why is the pre-emptive directive different?

  The difference lies in the justification for overriding the will. Parental authority rests on the child's developmental incapacity. The child's screaming is overridden not because the parent is a tyrant, but because the child lacks the cognitive machinery to weigh long-term health against short-term pain. The parent's prediction of dissent is a prediction of *irrationality*.

  In the case of the pre-emptive directive, the prediction is often not of irrationality, but of *value revision*. The demented self is not necessarily screaming in delirium; he is often described as cheerful, content, and socially engaged. He is not failing to understand the medicine; he is rejecting the premise that his life is not worth living. If the future self is competent enough to experience contentment and express a preference for life, the Parent/Child analogy collapses. We do not override competent adults because they have revised their values, even if we think those revisions are mistakes.

  If the proponent of the pre-emptive directive argues that the demented self *is* incompetent, like the child, then they do not need a pre-emptive directive. A standard directive covering "loss of capacity" covers that ground. The pre-emptive directive is a unique beast because it targets the *competent dissent* of the future self. It says, "Even if you are rational, even if you are happy, your past self knows better." This is not paternalism based on incapacity; it is tyranny based on temporal priority. The Parent/Child objection fails because it conflates incapacity with disagreement. The pre-emptive directive is an attempt to treat a potentially competent future agent as a child, while admitting in the very text that he is acting like an adult.

  I must be honest about the weaknesses of this position. The strongest counter-argument is that this reasoning proves too much. Does every advance directive not bet that the later self will not see things the way the earlier self does? If I write "no intubation" today, I am betting that my future self, gasping for air, will not value survival over dignity. If my argument holds, does that not invalidate all directives? If acknowledging a future change of mind grants authority to the future self, then no past choice can ever bind.

  There is a distinction, however, between betting on a change of mind and commanding the suppression of a conscious agent. A standard directive operates in the realm of uncertainty regarding capacity. It says, "If I am no longer me (by some medical standard), do not keep the body alive." It draws a line at the loss of the faculties that make judgment possible. The pre-emptive directive draws the line *after* the faculties have returned or shifted. It says, "Even if you are capable of judgment, your judgment is wrong."

  The weakness in my argument arises when the line between "capacity" and "value revision" is blurry. Dementia is not a binary switch. There are twilight zones where a patient is legally incompetent but experientially whole. In these cases, the pre-emptive directive might be the only way to honor the "critical interests" of the past self. My argument risks privileging the "experiential interests" of the demented self too heavily. If we accept that the demented self is a "new person," then the past self has no authority at all. If we accept they are the "same person," the past self has total authority. My claim tries to split the difference: they are the same person, but the authority of the past self is limited by the moral standing of the present consciousness.

  This is a fragile position. It requires us to weigh the autonomy of the dead (the past self) against the liberty of the living (the future self). By focusing on the pre-emptive directive, I have highlighted the point where this tension becomes unbearable. The standard directive hides the conflict behind medical criteria. The pre-emptive directive drags it into the light.

  Ultimately, the pre-emptive directive fails because it tries to have it both ways. It needs the future self to be agential enough to be predicted (cheerful, insisting, valuing), but non-agential enough to be commanded (ignored, overruled, silenced). It relies on the future self's voice to make the prediction meaningful, then orders that voice be treated as noise. This is not an exercise of autonomy; it is an attempt to extend control beyond the bounds of moral jurisdiction. A past self can leave instructions for a future self who is absent or silent. He cannot leave a gag order for a future self who is present and speaking. To do so is to admit that the future self matters enough to be predicted, but not enough to be heard. That concession destroys the authority the document seeks to establish. The pre-emptive directive is a letter to a person it claims does not exist, written by a person who no longer will. It binds nothing.
