answer: |-
  **Setting:** *The Grind & Gear, a café half a block from the philosophy building. It's 4 PM. Empty mugs and a napkin covered in scribbles sit between them.*

  **R:** You're making it sound like I'm ignoring the demon. I'm not. I'm just saying the demon gives you a reason to *want* to admire him, not a reason that makes admiration fitting.

  **S:** That's the distinction. State-given versus object-given. I know. But you can't just stipulate it.

  **R:** It's not a stipulation. It's structural. Object-given reasons cite properties of the object. State-given cite consequences of having the attitude.

  **S:** And who decides which properties count as "of the object"?

  **R:** The ones that aren't about the attitude's consequences.

  **S:** Circular. You're filtering out the wrong reasons by checking if they make the attitude valuable. You're using value to fix the analysis of value.

  **R:** No. I'm using the direction of fit. If the reason exists independently of my holding the attitude, it's object-given. The demon's threat exists whether I admire him or not.

  **S:** But it's only a reason for *admiration* because of the consequence. That's what makes it state-given. You're defining the category by the role the reason plays.

  **R:** Exactly. So we exclude it. We restrict the analysis to reasons that bear on the object's worthiness.

  **S:** "Worthiness." There it is. You snuck the normative back in.

  **R:** I said "worthiness of the attitude." That's what we're analyzing.

  **S:** You can't use the explanandum in the explanans. Look, try this. A collector offers you a million dollars to find his terrible paintings beautiful.

  **R:** Classic bribe. State-given.

  **S:** Wait. The fact that he's trying to buy your admiration reveals something about him. He's arrogant. Desperate.

  **R:** Okay…

  **S:** That arrogance is a property of *him*. So it's object-given relative to *him*. It's a reason to disdain him.

  **R:** Sure. To disdain the collector. Not to admire the painting.

  **S:** But the reason started as a bribe. A pragmatic payoff. Now it's a character flaw. The "wrong kind" of reason converted into the "right kind" just by shifting the focus.

  **R:** It didn't convert. It was always a property of the collector. The payment was the evidence, not the reason itself.

  **S:** The payment *is* the reason. You said object-given reasons are properties of the object. The payment is a transaction.

  **R:** The transaction reveals the character. The character is the property.

  **S:** So any pragmatic reason can be massaged into an object-given one if we look hard enough at the agent's psychology?

  **R:** No. The demon's threat doesn't make the demon contemptible necessarily. He might be justified.

  **S:** Suppose he is contemptible. He's coercive. That's a property of him. So now I have an object-given reason to disdain him. Does that make admiration fitting?

  **R:** No. Because disdain is the fitting attitude toward contemptibility. You're mixing attitudes.

  **S:** But the structure is the same. A pragmatic pressure reveals a property. You're relying on a prior sense of which attitude fits which property.

  **R:** I'm relying on the conceptual link between contempt and arrogance. That's not value primitivism. That's rationality.

  **S:** It's the same thing. You're saying "arrogance warrants disdain." That's a normative brute fact.

  **R:** It's a structural fact about attitudes. Look, even if the collector case works, it doesn't generalize to the pill case.

  **S:** The pill case?

  **R:** Suppose you can take a pill that makes you admire the painting. The benefit is happiness. That's state-given. Does taking the pill reveal a property of the painting?

  **S:** No. But it reveals a property of *you*. You're someone who needs chemical assistance.

  **R:** That's a reason to pity you. Not to admire the painting. The object of the attitude shifts.

  **S:** Exactly. The object shifts. So the distinction isn't between types of reasons. It's between how we carve up the objects.

  **R:** And that carving is stable. Painting vs. Person vs. Self.

  **S:** Is it? What if the painting's value *is* that it makes people happy? Then the consequence is a property of the object.

  **R:** Then it's object-given. Because the capacity to produce happiness is a property of the painting.

  **S:** See? You're deciding what counts as a property based on whether it supports the value claim.

  **R:** I'm deciding based on causal structure. Dispositional properties are still properties.

  **S:** But you only count the dispositional properties that look like value. You ignore the dispositional property of "being such that a demon will kill me if I don't admire it."

  **R:** That's a relational property involving the demon's intentions. It's external.

  **S:** Why is "capacity to please" internal and "capacity to trigger demon" external? Both are relational.

  **R:** Because one bears on the nature of the appreciation, the other on the safety of the appreciator.

  **S:** "Nature of the appreciation." There's the normativity again.

  **R:** Okay. Stop. You think the circle is vicious. I think it's virtuous. We're clarifying concepts.

  **S:** I think the concept of "reason for an attitude" is doing all the work. And I don't think you can analyze that without already assuming value.

  **R:** So you want to take value as primitive.

  **S:** I want to stop pretending we've reduced it. The FA analysis says value *is* reasons. I say value *grounds* reasons.

  **R:** If value grounds reasons, what grounds value?

  **S:** Nothing. It's the bedrock.

  **R:** Then you can't explain why the collector is contemptible. You just say "it's bad."

  **S:** I say "his action warrants disdain." The warrant is primitive.

  **R:** So we disagree on whether "warrant" can be unpacked into structural relations between objects and attitudes.

  **S:** I disagree that the structure exists independent of the normativity. You think you can map the reasons without knowing the value. I think you need the value to map the reasons.

  **R:** And I think you're conflating epistemology with metaphysics. We *find* the reasons by looking at the value, but the value *consists* in the reasons.

  **S:** That's the circle. You need value to find the reasons that constitute value.

  **R:** No. I need intuition to find the reasons. The analysis is what those reasons *are*.

  **S:** But your filter for the reasons—the object/state distinction—is normative.

  **R:** It's rational.

  **S:** Same thing, down here.

  *Silence. R stirs cold coffee. S looks at the napkin scribbles.*

  **R:** So the bug isn't in the analysis. It's in the idea that "reasons for attitudes" is a neutral category.

  **S:** Exactly. You can't have reasons for attitudes without already having a sense of fittingness.

  **R:** And if that's true, FA doesn't reduce value. It just locates it.

  **S:** It locates it in the primitive normativity of reasons. Which is where I started.

  **R:** But it shows the structure. Even if it's primitive, it's structured.

  **S:** Maybe. Or maybe the structure is just a shadow of the value itself.

  **R:** We're not leaving this café until we decide if shadows cast light.

  **S:** Drink your coffee. It's getting cold. Like the argument.

  **R:** It's not cold. It's just fitting.

  **S:** Don't start.
