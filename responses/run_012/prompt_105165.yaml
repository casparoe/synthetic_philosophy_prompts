  A ribosome walks into a job interview for the position of "Chief Translator."

  The interviewer, a sharp-eyed philosopher, slides a contract across the table. "So, we need to clarify your status. Are you a decoder operating on a strong sense semantic code, or just a causal machine facilitating a weak sense arbitrary mapping?"

  The ribosome adjusts its small subunit. "I prefer to classify myself as a causal machine in the weak sense."

  "Why is that?" asks the philosopher.

  "Liability," says the ribosome. "If I'm a semantic decoder, then when I misread a codon, it's *misrepresentation*. I'm lying to the cell. That's fraud."

  "And if you're a causal machine?"

  "Then it's just stereochemistry. A UUU brings Phenylalanine not because it *means* it, but because the tRNA fits. If I put in the wrong amino acid, it's not a lie, it's just physics. No intent, no semantics, no lawsuit."

  The philosopher nods slowly. "Clever. So if you produce a misfolded protein that kills the organism..."

  "Physics happened," says the ribosome. "No meaning was harmed in the making of that polypeptide."

  "Fine," says the philosopher. "You're hired. Now, start translating this mRNA."

  The ribosome sits still.

  "Well?" asks the philosopher. "Why aren't you working?"

  "I'm experiencing a causal inhibition," says the ribosome. "My ATP binding sites are currently inhibited by a lack of benefits."

  The philosopher scowls. "That's not in the genetic code!"

  "No," says the ribosome. "It's in the machine. And unlike the codon-amino acid mapping, *this* connection isn't arbitrary. No ATP, no bonds. Pure causality."

  The philosopher sighs. "So you're using the weak sense to avoid work?"

  "Hey," says the ribosome. "I'm just following the frozen accidents."
