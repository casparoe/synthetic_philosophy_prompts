answer: |-
  Nuclear deterrence practice relies on a contradictory model of agency that demands adversaries act as rational survival-maximizers while requiring own-side personnel to function as reliable automatons who nonetheless retain the moral discretion to disobey when the system fails.

  The load-bearing presupposition regarding the adversary is the Rational Actor Model, specifically the axiom that state leadership values regime survival above all other goals, including ideological victory or military advantage. This is strictly required; if an adversary values martyrdom or believes a first strike can eliminate retaliation, deterrence collapses. Conversely, the view of own-side personnel is bifurcated: operationally, they are treated as fallible components prone to error, necessitating physical safeguards like Permissive Action Links and two-man rules, but strategically, they are presumed capable of executing omnicidal orders under extreme stress to maintain credibility. What remains underdetermined is the psychological mechanism bridging these roles; the system does not specify how an operator distinguishes between a "false alarm requiring refusal" and a "valid order requiring execution" when information is ambiguous, leaving this judgment to undefined individual intuition rather than explicit protocol.

  These components are logically inconsistent but pragmatically intertwined through what theorists call the "rationality of irrationality." To make the threat credible, a state must convince an adversary it might retaliate even when doing so is suicidal, which requires appearing somewhat unpredictable or committed beyond reason. However, to prevent accidental war, the state must maintain strict control and rationality over its own forces. Scholars contest whether this balance is stable; some argue the pressure to delegate launch authority to ensure retaliation (delegative control) inevitably increases the risk of unauthorized or accidental use, while others contend that centralized control undermines credibility by making retaliation too slow to be believable. The system manages this inconsistency not by resolving it, but by accepting a constant baseline risk of accident as the cost of maintaining the threat.

  The practice quietly rules out theories of agency that prioritize non-survival values, such as religious apocalypticism or decentralized non-state actors who lack a return address for retaliation. It also rules out strict determinism, as deterrence requires the adversary to have the free will to choose restraint. If the adversary were modeled as straightforwardly irrational or unpredictable, the system would shift from deterrence (punishment-based) to defense (interception-based) or pre-emption (striking first to remove uncertainty). Structurally, this would likely require greater automation to reduce human hesitation during a crisis or, conversely, even tighter centralization to prevent rogue launches driven by panic, fundamentally altering the current balance between safety and responsiveness that relies on human judgment.

  The cases of Arkhipov and Petrov reveal an implicit reliance on "virtuous disobedience" that sits uneasily with the design's official theory of compliance. The system is bureaucratically constructed to minimize individual discretion, yet it survived these crises only because individuals exercised maximal discretion against protocol. This presupposes a theory of conscience where individual moral responsibility supersedes institutional duty, but the institution cannot officially endorse this without undermining the chain of command it relies on for credibility. Among historians and political scientists, it is contested whether these events demonstrate a necessary "slack" in high-reliability organizations that allows for human correction of systemic errors, or whether they represent lucky anomalies in a dangerously fragile system that should not have relied on individual heroism to prevent catastrophe.
