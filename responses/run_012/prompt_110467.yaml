answer: |-
  # Specification for a General Account of Strategy-Stealing

  This specification defines the adequacy conditions for a theoretical account of the strategy-stealing argument (SSA). An adequate account must function as a decision procedure for unfamiliar games, correctly classifying the provided test cases, and explicitly characterizing the epistemic status of its conclusions.

  ## I. Requirements List

  The following requirements are categorized by the aspect of the argument they constrain. Each includes the motivating case or consideration and a classification of its necessity.

  ### A. Structural Requirements (Game Properties)

  **1. Symmetry of Availability**
  *   **Requirement:** The account must verify that for every legal move available to Player 2 in a state $S$, there is a corresponding legal move available to Player 1 in the symmetric state $S'$.
  *   **Motivation:** **Case 4 (Builder and Spoiler).** While moves are identical, if the account does not check availability relative to the *role*, it may misclassify asymmetric role games. However, strictly speaking, Case 4 fails on Objectives (Req 2). A stronger motivation is **Case 5 (Passing Variant).** If one player can pass and the other cannot (or pass counts differently), availability is broken.
  *   **Status:** **Non-negotiable.** Without move symmetry, the imitation step is impossible.

  **2. Symmetry of Objectives**
  *   **Requirement:** The account must verify that the winning condition for Player 1 is structurally identical to the winning condition for Player 2 (modulo turn order).
  *   **Motivation:** **Case 4 (Builder and Spoiler).** Both players have the same moves, but Builder wins on a row, Spoiler wins on *no* row. SSA fails here because imitating Spoiler's strategy makes Player 1 try to prevent a row, which is losing for the Builder.
  *   **Status:** **Non-negotiable.** This is frequently collapsed into "Symmetric Game" in loose parlance, but an adequate account must separate move symmetry from objective symmetry.

  **3. Monotonicity (The "Extra Move" Premise)**
  *   **Requirement:** The account must establish that possessing an additional piece (or having made an additional move) on the board is never a disadvantage relative to the winning condition. Formally, if State $A$ is winning, and State $B$ contains all pieces of $A$ plus one's own extra piece, $B$ must be winning (or at least not losing).
  *   **Motivation:** **Case 2 (Single Stone)** and **Case 3 (Overline).** In Case 2 (Misère), making the move causes loss (negative monotonicity). In Case 3, placing a stone can complete a 4-row and cause immediate loss (non-monotonic). SSA fails in both.
  *   **Status:** **Non-negotiable.** This is the substantive engine of the argument.

  **4. Determinacy**
  *   **Requirement:** The account must assume or prove that the game is determined (one player has a winning strategy, or both can force a draw).
  *   **Motivation:** **Case 5 (Infinite Play).** In infinite games without specific topological constraints (e.g., open/closed winning sets), games may be undetermined. If the game is undetermined, the premise "Assume Player 2 has a winning strategy" may be false simply because *no one* has one, invalidating the reductio.
  *   **Status:** **Non-negotiable (Logical),** but **Finiteness** is an **Artefact.** Finiteness is merely a sufficient condition for Determinacy (Zermelo's Theorem), not a necessary one for SSA itself.

  ### B. Logical Requirements (Argument Structure)

  **5. The Imitation License**
  *   **Requirement:** The account must specify the procedure for handling conflicts when the stolen strategy calls for an occupied square. It must assert that *some* arbitrary move suffices, without specifying *which* one.
  *   **Motivation:** **Non-constructivity.** The core pedagogical point of the seminar. The account must explain that the validity of the arbitrary move relies on Monotonicity (Req 3), not on specific board geometry.
  *   **Status:** **Non-negotiable.** This distinguishes SSA from constructive existence proofs.

  **6. Reductio Ad Absurdum Form**
  *   **Requirement:** The account must frame the conclusion as the negation of the assumption ("Player 2 does not have a winning strategy") rather than a direct construction ("Player 1 has this strategy").
  *   **Motivation:** **Case 1 (Strip).** We know P1 wins, but we do not know the opening move for general $n$ via SSA. The account must not claim to identify the winning move.
  *   **Status:** **Non-negotiable.**

  ### C. Outcome Requirements (Conclusion Strength)

  **7. Win vs. Non-Loss Distinction**
  *   **Requirement:** The account must distinguish between proving "Player 1 Wins" and "Player 1 Does Not Lose."
  *   **Motivation:** **Case 1 (Strip)** and **Case 5 (Draws).** SSA strictly proves P2 cannot force a win. In a determined game, this means P1 can force a Win *or* a Draw. If draws are possible (Case 1 theoretically, Case 5 explicitly), the account cannot conclude P1 Wins without further analysis.
  *   **Status:** **Non-negotiable.** Conflating these is a common error in informal accounts.

  **8. Explanation of Non-Constructivity**
  *   **Requirement:** The account must explicitly state why the existence of the strategy does not yield the strategy itself (i.e., the dependence on the unknown arbitrary move in the conflict resolution).
  *   **Motivation:** **Seminar Background.** The session is about non-constructive existence. An account that treats SSA as merely a "trick" without addressing the epistemic gap is inadequate for this context.
  *   **Status:** **Non-negotiable (for this seminar context).**

  ---

  ## II. Classification: Non-Negotiable vs. Artefact

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Symmetry of Availability** | Non-Negotiable | Without this, imitation is illegal. |
  | **Symmetry of Objectives** | Non-Negotiable | Without this, imitation is counter-productive (Case 4). |
  | **Monotonicity** | Non-Negotiable | Without this, the "extra piece" logic fails (Case 2, 3). |
  | **Determinacy** | Non-Negotiable | Required for the dichotomy (Win/Draw/Lose) to hold. |
  | **Finiteness** | **Artefact** | Often stated, but SSA works on infinite determined games. Finiteness is just the common guarantee of Determinacy. |
  | **Perfect Information** | **Artefact** | Required for Determinacy in standard settings, but SSA is about the *structure* of strategies. If a game is determined with imperfect info, SSA logic holds, though such games are rare. |
  | **"Player 1 Wins"** | **Artefact** | A common over-statement. The rigorous conclusion is "Player 1 Does Not Lose." |
  | **Mirroring/Pairing** | **Artefact** | Specific implementation of imitation. SSA works without geometric mirroring (e.g., abstract poset games). |

  ---

  ## III. Conflicts and Dominant Constraints

  **1. Suspected Conflict: Constructivity vs. Generality**
  *   **Conflict:** An account that attempts to make the argument constructive (by specifying the arbitrary move) generally fails to be general. To specify the move requires analyzing the specific game (e.g., center square in Tic-Tac-Toe), which violates the "General Account" specification.
  *   **Resolution:** The account must embrace non-constructivity as a feature, not a bug. The requirement to *explain* non-constructivity (Req 8) overrides any preference for constructive output.

  **2. Dominant Requirement: Monotonicity (Req 3)**
  *   **Reasoning:** This requirement does the most work to exclude otherwise plausible accounts. Symmetry is easy to check; Determinacy is often assumed. Monotonicity is the subtle filter that excludes **Case 2 (Misère)** and **Case 3 (Overline)**. Many intuitive accounts fail here because "having more pieces feels like an advantage" is treated as obvious rather than a formal hypothesis. This requirement excludes the largest class of "near-miss" games.

  ---

  ## IV. Critique of Colleague's Criterion

  *Colleague's Criterion:* "An account is adequate exactly if it licenses the conclusion that the first player does not lose for every finite perfect-information game that is symmetric and in which an extra stone never hurts."

  **1. Where it is Too Strong:**
  *   **Implicit Win Claim:** While it says "does not lose," standard interpretations of "symmetric game" often imply a decisive outcome. If the criterion is interpreted to mean "P1 has a winning strategy," it fails **Case 1 (Strip)** and **Case 5**, where a draw is a valid non-loss outcome that SSA cannot rule out without extra analysis.
  *   **Finiteness:** It demands "finite." As noted in Req 4, SSA applies to infinite *determined* games. This unnecessarily restricts the scope of the account.

  **2. Where it is Too Weak:**
  *   **Ambiguity of "Symmetric":** It does not explicitly distinguish **Symmetry of Availability** from **Symmetry of Objectives**. Under a loose definition, **Case 4 (Builder/Spoiler)** is a "symmetric game" (same moves). The criterion would incorrectly license SSA for Case 4, leading to a false conclusion.
  *   **Epistemic Silence:** It says nothing about *constructivity*. An account could satisfy this criterion by brute-forcing the game tree (which is constructive) and claiming it used SSA. It fails to capture the *methodological* requirement of the seminar.

  **3. Requirements Quietly Dropped:**
  *   **Symmetry of Objectives (Req 2).**
  *   **Explanation of Non-Constructivity (Req 8).**
  *   **Determinacy (Req 4)** (Subsumed under "finite perfect-information," which is sufficient but conceptually distinct).

  ---

  ## V. Epistemic Status of Requirements

  | Requirement | Status | Notes |
  | :--- | :--- | :--- |
  | **Determinacy (Finite)** | **Theorem** | Zermelo's Theorem (1913). Explicit hypotheses: Finite, Perfect Info, Two-player, Zero-sum. |
  | **Monotonicity** | **Folklore / Definition** | Often treated as intuitive ("more is better"). Formally, it is a property of the valuation function on the game poset. Not a theorem; a constraint on game class. |
  | **Symmetry of Objectives** | **Terminological Choice** | "Symmetric Game" is defined differently in combinatorial game theory (CGT) vs. economics. In CGT, it often implies objective symmetry; in economics, it may not. Must be stipulated. |
  | **Non-Constructivity** | **Contested / Contextual** | In constructive mathematics (e.g., intuitionistic logic), SSA is not a valid proof of existence. In classical mathematics, it is valid but non-constructive. The "status" depends on the logical framework of the seminar. |
  | **Infinite Determinacy** | **Open / Axiom-Dependent** | Determinacy of infinite games (e.g., Gale-Stewart) depends on set-theoretic axioms (Axiom of Determinacy vs. Axiom of Choice). |

  ---

  ## VI. Decision Procedure

  To determine if the Strategy-Stealing Argument applies to an unfamiliar game $G$ and what it licenses, execute the following checklist. If any step fails, SSA does not apply.

  1.  **Check Determinacy:**
      *   Is $G$ finite? $\rightarrow$ **Pass** (Zermelo).
      *   Is $G$ infinite? $\rightarrow$ **Stop.** (SSA applies only if $G$ is known to be determined; otherwise, logic fails).
  2.  **Check Symmetry of Availability:**
      *   Does Player 1 have access to the same set of moves as Player 2 from symmetric board states? (Include passing rights).
      *   *If No:* **SSA Inapplicable.**
  3.  **Check Symmetry of Objectives:**
      *   Is the condition for Player 1 to Win identical to the condition for Player 2 to Win (swapping roles)?
      *   *If No (e.g., Builder/Spoiler):* **SSA Inapplicable.**
  4.  **Check Monotonicity:**
      *   Does adding one's own piece to a board state ever turn a Winning/Draw state into a Losing state? (Check for "overcrowding" losses or Misère conditions).
      *   *If Yes:* **SSA Inapplicable.**
  5.  **Execute Argument:**
      *   **Conclusion:** Player 2 does not have a winning strategy.
  6.  **Interpret Conclusion:**
      *   Can the game end in a Draw?
          *   *If No:* **License:** Player 1 has a Winning Strategy.
          *   *If Yes:* **License:** Player 1 has a Non-Losing Strategy (Win or Draw).
      *   **Constructivity:** Do not output the strategy. Output only the existence claim.

  **Application to Handout Cases:**
  *   **Strip:** Passes 1-4. Draw possible? Yes (theoretically). **License:** P1 does not lose.
  *   **Single Stone:** Fails 4 (Misère is non-monotonic). **License:** None.
  *   **Overline:** Fails 4 (4-in-a-row loses). **License:** None.
  *   **Builder/Spoiler:** Fails 3 (Objectives differ). **License:** None.
  *   **Strip (Infinite):** Fails 1 (unless Determinacy is assumed). **License:** Conditional on Determinacy.
