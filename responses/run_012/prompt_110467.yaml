          1.  Game $G$ is symmetric (players have same moves available relative to state).
          2.  Property $P$: Having an extra piece on the board is never a disadvantage (monotonicity).
          3.  Assume Player 2 has a winning strategy $S_2$.
          4.  Player 1 makes move $m_1$.
          5.  Player 1 pretends to be Player 2 using $S_2$, ignoring $m_1$.
          6.  If $S_2$ calls for a square occupied by $m_1$ (or subsequent imitation moves), Player 1 plays arbitrarily elsewhere.
          7.  Because of $P$, Player 1's position is at least as good as Player 2's would have been.
