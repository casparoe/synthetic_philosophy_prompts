          2.  **The Fictionalist Claim:** "Beliefs aren't real things." (Controversial/False depending on definition).
          3.  **The Indeterminacy Claim:** "There is no fact of the matter." (Genuinely Controversial).
          4.  **The Dismissal:** How the panelist conflated them.

      *   *Wait, one more nuance:* The panelist said "useful fiction." That is specifically *Instrumentalism*. Dennett actually argues *against* pure instrumentalism; he argues for *Real Patterns*. So the panelist might be misquoting Dennett. I should point this out. It gives the user a strong argumentative lever.

  9.  **Finalizing the Output Structure:**
      *   Intro: Validate the user's intuition (the "Dennettian Hand Wave").
      *   The Menu (3-4 distinct claims).
      *   The Diagnosis (Which one is doing the work).
      *   The Counter-Move (How to argue back).

  10. (Reviewing against constraints): "Menu I can argue from, not a lecture." Keep sections tight. Use bullet points.

      *   *Claim 1: The Pragmatic Truism.* (Trivially True).
      *   *Claim 2: The Ontological Elimination.* (False/Controversial).
      *   *Claim 3: The Real Patterns View.* (Dennett's actual view, Controversial).
      *   *Claim 4: The "No Fact" Shutdown.* (The rhetorical move).

      *   *Diagnosis:* The panelist used Claim 1 to smuggle in Claim 4.
      *   *Counter:* If it's a useful fiction, why does it predict reality? Because it tracks something real.

