  (e) 15%: The operational definition of 'irreversible' is dangerously vague, creating significant implementation risk that undermines the policy's stability.

  These weights represent the proportion of my reasoning dependent on each factor; I combine my high confidence in (a) and (b) with lower confidence in (c) and (e) to arrive at the total. The total is most sensitive to (a), because if autonomy is not a side-constraint, the entire justification for limiting paternalism collapses. My reasoning is most likely to fail if empirical evidence shows users systematically prefer and benefit from soft paternalism as a pre-commitment device, contradicting the assumption that they always know their interests best.
