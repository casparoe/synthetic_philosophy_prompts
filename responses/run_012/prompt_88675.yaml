answer: |-
  There is no single, canonical term in political science or legal theory that universally names this specific justificatory structure. However, the phenomenon is widely recognized in fragments across several literatures: European Union law (debates over *Kompetenz-Kompetenz* and subsidiarity monitoring), US constitutional law (pre-emption and "race to the bottom" arguments), and fiscal federalism (the endogeneity of state capacity).

  The closest existing concepts are **"The Subsidiarity Paradox"** (often used to describe the need for a strong center to enforce decentralization) and **"Endogenous Institutions"** (the idea that institutional rules and outcomes determine each other). However, neither captures the specific normative loop you describe: that the *test* for allocation relies on a *capacity* that is itself a product of the *allocation*.

  To provide the precision you require, I propose the term **Endogenous Jurisdictional Capacity** (EJC) to describe the phenomenon, and **The Competence-Capacity Feedback Loop** to describe the argumentative structure.

  Below is a precise account of the concept, its distinctions, and its boundaries.

  ### Proposed Term: Endogenous Jurisdictional Capacity (EJC)

  **Definition:**
  Endogenous Jurisdictional Capacity is a structural condition in multi-level governance where the factual ability (capacity) of a subordinate government to exercise authority is causally dependent on the prior legal allocation (competence) of that authority. In this condition, the criteria used to justify the allocation of power (typically adequacy or efficiency) are not independent variables but are themselves determined by the allocation decision they are meant to evaluate.

  **The Argumentative Structure (The Competence-Capacity Feedback Loop):**
  1.  **Normative Premise:** Authority should reside at the lowest level capable of adequate performance (Subsidiarity).
  2.  **Empirical Claim:** The lower level lacks the capacity (fiscal, administrative, legal) to perform adequately.
  3.  **Hidden Causal Link:** The lower level's lack of capacity is a direct result of the higher level's prior retention of authority (or failure to delegate resources/standing).
  4.  **Conclusion:** Authority must remain at the higher level.
  5.  **Result:** The higher level's retention of authority reproduces the lower level's incapacity, satisfying the condition for future retention.

  ### Distinctions

  To ensure this concept is not conflated with related ideas, the following distinctions are necessary:

  **1. Versus Ordinary Circular Reasoning**
  *   **Circular Reasoning:** A logical fallacy where the conclusion is assumed in the premise (e.g., "They shouldn't have the power because they shouldn't have the power").
  *   **EJC:** This is not a logical fallacy but a **causal reality**. The lower level *genuinely* lacks capacity. The error is not in the empirical observation but in treating an endogenous variable (capacity) as an exogenous constraint. The argument is empirically true but normatively self-fulfilling.

  **2. Versus Path Dependence**
  *   **Path Dependence:** Explains why institutions persist due to historical inertia, switching costs, or increasing returns (e.g., "We centralized in 1930, so it is too hard to decentralize now").
  *   **EJC:** This is not about inertia or cost. It is about **justification**. Proponents of centralization use the *current* lack of capacity as a *normative reason* against decentralization, ignoring that the centralization caused the lack of capacity. Path dependence explains *stability*; EJC explains *legitimation*.

  **3. Versus *Kompetenz-Kompetenz* (Competence-Competence)**
  *   **Kompetenz-Kompetenz:** A legal doctrine regarding *who has the authority to decide* who has the authority (e.g., Does the EU Court or the German Constitutional Court decide the boundary?).
  *   **EJC:** This is not about the legal right to define jurisdiction, but about the **factual criteria** used to define it. EJC occurs even when everyone agrees on who has the legal right to decide; it infects the *reasoning* used to make the decision.

  **4. Versus Standard Subsidiarity**
  *   **Subsidiarity:** Assumes capacity is an **exogenous** variable (i.e., the lower level either has the ability or it doesn't, independent of the decision).
  *   **EJC:** Reveals subsidiarity as **indeterminate** without a baseline. It shows that the subsidiarity test cannot be applied neutrally because the "capacity" metric is manipulated by the status quo of authority.

  ### Boundaries: Where the Phenomenon Stops

  To prevent conceptual overreach, EJC does not apply in the following scenarios:

  **1. Exogenous Capacity Constraints**
  If the lower level lacks capacity due to factors unrelated to legal authority, EJC is not present.
  *   *Example:* A local municipality cannot manage a nuclear waste site because it lacks the geographic scale or technical expertise, regardless of whether it is granted the legal authority. Here, capacity is independent of allocation.

  **2. Unconditional Resource Transfers**
  If the higher level provides the necessary fiscal or administrative resources *without* retaining the decision-making authority, the loop is broken.
  *   *Example:* The federal government provides grants to states to implement a program the states design and control. If the states still fail, it is not EJC, because the centralization of resources did not entail the centralization of competence.

  **3. Explicit Normative Choice for Centralization**
  If the higher level retains authority for reasons *other* than capacity (e.g., national unity, uniformity of rights, redistribution), EJC is not the operative justification.
  *   *Example:* "We keep this power at the federal level not because states *can't* do it, but because we want a single national standard." This is a substantive policy choice, not a capacity-based feedback loop.

  ### Summary for Application

  When you encounter this pattern, you can identify it by asking the **"Baseline Question"**: *If the lower level were granted this authority today, would it possess the capacity to exercise it in five years?*

  *   If the answer is **"No, because the higher level controls the necessary resources,"** you are observing **Endogenous Jurisdictional Capacity**.
  *   If the argument relies on this condition to deny the authority, it is a **Competence-Capacity Feedback Loop**.

  This terminology allows you to diagnose the structural indeterminacy of the subsidiarity test without dismissing the empirical reality of the lower level's current weakness. It shifts the debate from "Who can do it?" to "Who must build the capacity?"—which is the actual political question hidden by the justificatory structure.
