answer: |-
  Good evening. For those of you who don't know me, I'm a former student. For those of you who are family, I know what you're thinking: *Great, one of the Classics people. Try not to make eye contact.*

  I promise to keep the Latin to a minimum. [Teacher's Name] gave me a specific instruction for this toast. She said, and I quote, "If you say anything about my 'golden years' or how much I've done for everyone, I will correct your grammar in front of the entire room."

  So, we are going to talk about Cicero. Specifically, *De Senectute*.

  Half of you read this with her. You know the text. The other half, here is the context: It's a dialogue about old age. Usually, people read it as a checklist. Cicero argues that being old doesn't mean you're useless, or weak, or boring, or about to die. Four complaints, four rebuttals.

  But [Teacher's Name] has a theory. She says that's wrong. She says those four complaints are actually just one complaint. The fear isn't about strength or pleasure. The fear is *irrelevance*. The complaint of old age is that the world is telling you your time on the stage is up. It's the fear of being shoved into the wings while the play goes on without you.

  And she says Cato's real argument—the one everyone misses—isn't that you can still act. It's that the stage was never the point to begin with.

  This is, essentially, the most [Teacher's Name] thing I have ever heard.

  Because if you know her, you know she is not a person who seeks applause. She never taught to be liked, and she certainly doesn't age to be pitied. To tell her "your best years are ahead of you" implies she's been waiting for them. To tell her "now you can rest" implies she was working for the sake of stopping.

  She knows better.

  The point of *De Senectute*, in her reading, is autonomy. It is the realization that you do not need an audience to validate your existence. You are not a character in someone else's play. You are the author of your own text.

  So, I am not going to wish her a happy retirement, because she has no intention of retiring from being who she is. I am not going to say she looks young, because 70 is a perfectly respectable age to be, and she has no patience for lies.

  Instead, I will say this: The play goes on, with or without the spotlight. And looking around this room, at the students who learned to parse a sentence and the family who learned to love a person, it is clear that while she may have stepped back from the podium, she has not stepped out of the life she built.

  She was right about Cicero. The stage doesn't matter. The work does.

  So, if everyone could raise a glass.

  To [Teacher's Name]. To the work, not the applause. And to the next chapter, written entirely on her own terms.

  Salve.
