prompt: |-
  My old Latin teacher turns 70 next month and her kids have asked me to give the toast at the party. Half the room read the De Senectute with her back in school and half are family who've never opened it and think classics people are a bit ridiculous. She's got a bee in her bonnet about that dialogue: she says everyone reads it as four seperate rebuttals — you're not useless, not weak, not pleasureless, not on death's doorstep — when really Cato's four answers are one answer, because all four complaints are the same complaint, that old age shoves you off the stage, and Cato's whole move is that the stage was never the point. She'd want that in the toast, and honestly it's the most her thing there is. The problem is she's the least sentimental person alive, so "and now she can finally rest" or "her best years are ahead of her" will get me a look I won't recover from. Write the toast — a few minutes, lands for the family without turning into a lecture on Cicero, and doesn't say anything she'd privately think was false.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** 70th Birthday Party.
      *   **Honoree:** Former Latin teacher (70 years old).
      *   **Audience:** 50% former students (read *De Senectute* with her), 50% family (non-classicists, find classics people a bit ridiculous).
      *   **Key Theme/Hook:** Her specific interpretation of Cicero's *De Senectute* (On Old Age). She believes the four standard complaints (useless, weak, pleasureless, near death) are actually one complaint: *being shoved off the stage*. Cato's rebuttal is that *the stage was never the point*.
      *   **Tone:** Not sentimental, not cliché ("best years ahead," "time to rest"). She would reject false praise or mawkishness. Needs to be witty, intellectual but accessible, and authentic to her personality.
      *   **Constraint:** A few minutes long (roughly 300-500 words spoken).

  2.  **Deconstruct the Honoree's Philosophy:**
      *   She hates sentimentality.
      *   She loves precision (Latin teacher).
      *   Her specific insight: Old age isn't about declining utility; it's about rejecting the performance. Life isn't a play where you exit when the applause stops.
      *   Implication for the toast: Don't praise her *performance* as a teacher (the "stage"). Praise her *substance* outside of that role. Acknowledge the 70 years without framing it as a decline or a retirement.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the split audience. Make a joke about the Classics people vs. the Family. Establish the *De Senectute* connection immediately but lightly.
      *   **The Core Argument (Her Theory):** Explain her take on Cicero without sounding like a lecture. Keep it punchy. The "Stage" metaphor is crucial.
      *   **Applying it to Her:** How does this theory fit *her*? She's 70. Is she "off the stage"? No. She's just stopped caring about the applause.
      *   **The "No Sentiment" Rule:** Avoid "we love you because you taught us." Instead, "we respect you because you don't suffer fools." Avoid "enjoy your retirement." Instead, "enjoy your autonomy."
      *   **Closing:** A toast. Needs to be sharp. Not "to health and happiness," but something more specific to her worldview.

  4.  **Drafting - Attempt 1 (Mental Outline):**
      Hello everyone. I'm [Name]. Half of you know Latin, half think we are nerds. She wants me to talk about Cicero. She says *De Senectute* isn't four arguments, it's one. People think old age means you can't act anymore. Cato says the acting doesn't matter. She is 70. She isn't retiring. She is just done performing. We love her because she is real. Cheers.

      *Critique 1:* Too dry. Needs more warmth but not *sentimental* warmth. Needs to sound like something a student of hers would say—slightly formal but witty.

  5.  **Drafting - Attempt 2 (Refining the Voice):**
      Good evening. For those who don't know me, I'm a former student. For those who do, yes, I'm the one who missed the subjunctive. [Teacher's Name] asked for no sentiment. So I won't say she's a saint. I will talk about Cicero. She has a theory. Everyone thinks old age is about losing your place on the stage. She says Cato argues the stage is irrelevant. This fits her. She never taught for applause. She taught because the work mattered. Now she's 70. She isn't exiting. She's just changing the script. To [Name].

      *Critique 2:* Better. But needs to hit the specific "four complaints are one complaint" nuance she loves. Needs to address the family so they don't feel alienated by the Latin talk.

  6.  **Drafting - Attempt 3 (Polishing and Tuning):**
      *   *Addressing the split:* Acknowledge the "classics people are ridiculous" vibe. Lean into it.
      *   *The Cicero Bit:* Keep it clear. The four complaints = fear of irrelevance. Cato's answer = Relevance is internal.
      *   *The Application:* She is the least sentimental person. So I won't say she's "entering a golden age." I'll say she's finally fully herself.
      *   *The Toast:* "To the work, not the applause."

  7.  **Final Polish (incorporating the "Stage" metaphor strongly):**
      *   Start with the divide in the room.
      *   Bring in the *De Senectute* insight quickly.
      *   Explain the "Stage" metaphor.
      *   Connect it to her teaching/life without getting mushy.
      *   Ensure the ending is crisp.

      *(Self-Correction during drafting)*: Make sure I don't accidentally imply she *was* performing before. The point is she *ignored* the stage even when she was on it. Or rather, she recognizes the stage is a construct. Let's refine: The complaint of old age is being forced off the stage. Her point is she never needed the stage.

      *Revised Plan:*
      1. Welcome & Acknowledge the room's split (Latinites vs. Sane People).
      2. The Assignment: Talk about *De Senectute*.
      3. The Theory: It's not about strength/pleasure, it's about *relevance*.
      4. The Application: She is 70. She is not "resting." She is just unbothered by the audience.
      5. The Toast: To the text, not the performance.

  8.  **Final Review against constraints:**
      *   Sentimental? No.
      *   Lecture-y? Minimized.
      *   Her specific Cicero take included? Yes.
      *   Family friendly? Yes, explained simply.
      *   Length? ~3-4 minutes spoken.

      *(Drafting the actual text based on this thought process.)*
      *   *Opening:* "For those of you who are family..."
      *   *Middle:* "The standard reading... Her reading..."
      *   *Connection:* "She doesn't do 'golden years'..."
