answer: |-
  Here is the specification for a theory of letterform identity, stripped of the usual philosophical padding.

  ### The Specification
  A theory of letterform identity must satisfy four functional pillars to be viable.

  **1. Invariance under Geometric Erasure**
  It must explain why a blackletter **a**, a geometric sans **a**, and a six-year-old's scrawl are tokens of the same type, despite sharing no necessary geometric features (no specific curvature, stroke count, or aperture angle is constant across all three). It must account for the phenomenological fact that we read this variation without noticing it. The theory cannot rely on a "minimum shared shape."

  **2. Sensitivity to Minimal Contrast**
  It must explain the **c-to-e** problem. A single stroke closure turns a **c** into an **e**. A theory that is loose enough to accommodate the blackletter/sans variance (Pillar 1) must be tight enough to prevent an open **a** from collapsing into a **u**, or a closed **c** into an **e**. It must account for categorical jumps across continuous geometric gradients.

  **3. Generative Stability**
  It cannot be a post-hoc classifier. It must predict what a well-formed **a** in an *unfamiliar* style looks like. If I show you a typeface you've never seen, you can draw a missing glyph. The theory must explain the rule set that allows you to construct a valid token without prior exposure. It must distinguish between "looking like an **a**" (mimicry) and "being an **a**" (functional membership).

  **4. Systemic Disambiguation**
  It must resolve the **Cyrillic 'а' vs. Latin 'a'** problem. They are geometrically identical but categorically distinct. A purely visual theory fails here. The theory must account for how script context (the system) overrides or constitutes shape identity, without rendering the shape itself irrelevant (otherwise, any shape could be an **a** if the system says so, which contradicts the "lone 'a'" requirement).

  ***

  ### Load-Bearing Requirements vs. Prejudices

  **Load-Bearing:**
  *   **Generative Stability:** This is the engine. If the theory can't tell you how to make a *new* **a**, it's just a taxonomy, not a theory of identity.
  *   **Sensitivity to Minimal Contrast:** This is the brake. Without this, the category dissolves into "curved shapes."
  *   **Systemic Disambiguation:** This is the steering. It prevents the theory from being purely Platonic (shape-only) or purely Nominalist (name-only).

  **Prejudices:**
  *   **"A lone 'a' on a blank page":** This is your weakest constraint. It is highly likely that letterform identity is *not* intrinsic to the isolated shape. Insisting that a lone glyph must carry its own identity independent of context may be asking the theory to solve a problem that doesn't exist. In reading, isolation is the anomaly, not the norm. A theory that requires context to establish identity is stronger than one that insists on intrinsic shape essence.
  *   **"Must be a real category":** If by "real" you mean "Platonic essence existing prior to inscription," this is a metaphysical prejudice. If you mean "functionally discrete unit in a communication system," it's load-bearing. Don't let the theory hunt for an essence; let it hunt for a function.

  ***

  ### The Theory-Killer

  The single requirement that destroys the usual answers is **Generative Stability combined with Sensitivity.**

  *   **Essence:** Dies on Invariance. There is no geometric essence shared by blackletter and sans.
  *   **Prototype:** Dies on Sensitivity. A prototype describes the "average **a**." It cannot explain why a shape *further* from the prototype (a wild scrawl) is still an **a**, while a shape *closer* to the prototype (a **c** with a tiny spur) is not. Prototypes describe centrality, not boundaries.
  *   **Contrastive Role (System):** Dies on the Lone 'a' and the Cyrillic problem. If identity is purely relational, a lone letter has no identity. If identity is purely systemic, the Latin and Cyrillic **а** should be identical because they occupy the same slot in their respective alphabets (the first vowel). They don't.
  *   **Family Resemblance:** Dies on Generativity. Resemblance clusters existing data. It offers no rule for constructing a *new* valid token. It explains why we recognize the past, not how we inhabit the future.
  *   **"Whatever the reader takes it to be":** Dies on Intersubjective Stability. If identity is purely subjective, communication fails. We agree on what is an **a** too consistently for this to be mere discretion.

  **The Killer:** The theory must explain how we **construct boundaries** (Sensitivity) in a space of **infinite variation** (Invariance) without a pre-existing list (Generativity). Most theories can handle variation *or* boundaries, but not both simultaneously.

  ***

  ### The Incompatible Pair

  You suspected **"Must be a real category"** vs. **"Must cover every variant."** You are correct, but the tension is sharper than that.

  The true incompatibility is **Visual Sufficiency** vs. **Systemic Necessity.**

  *   **Visual Sufficiency:** The shape alone determines the identity (required for the "lone 'a'" and "scrawl" cases).
  *   **Systemic Necessity:** The script system determines the identity (required for the "Cyrillic vs. Latin" case).

  **They cannot be jointly satisfied.**
  If the shape is sufficient, the Cyrillic **а** *is* a Latin **a** (or vice versa), which is linguistically false.
  If the system is necessary, the lone 'a' on a blank page *has no identity* until placed in a system, which contradicts our immediate visual recognition of it.

  **Resolution:**
  You must sacrifice **Visual Sufficiency**. A theory of letterform identity cannot be purely visual. It must be **semi-visual**. The shape provides a *claim* to identity, but the script system provides the *validation*. The "lone 'a'" works only because the viewer implicitly projects a system (usually Latin) onto the blank page.

  If you teach this, start there: The letter is not a shape. It is a **shape licensed by a system.** Any theory that tries to find the "a-ness" solely in the ink is already dead.
