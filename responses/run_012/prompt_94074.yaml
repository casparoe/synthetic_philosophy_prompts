prompt: |-
  I'm teaching a session on categories and style and I want to start from the humblest test case I've got: what makes every 'a' an 'a'? Before we look at any particular account, give me the spec — what a theory of letterform identity has to deliver before it's worth the paper. So: the cases it has to get right (a lone 'a' on a blank page, the same 'a' across blackletter, a geometric sans and a six-year-old's scrawl, single- vs double-story, the stroke that turns 'c' into 'e', Cyrillic 'а' next to the Latin one, forms that are a beat away from legible and forms that are honestly ambiguous), the distinctions it can't collapse (letter vs glyph vs logo, identity vs style, being an 'a' vs merely looking like one), and the facts it has to stay consistent with — above all that we read wildly varying letterforms without ever noticing the variation. It can't just be a feature checklist, since I can hand you a shape that ticks every box and still doesn't read as an 'a'; and it should tell me what a well-formed new 'a' in an unfamiliar style would be, not only sort shapes after the fact. Then tell me which requirements are load-bearing and which are just my prejudices, which single one does the most to kill off the usual answers (essence, prototype, contrastive role in a system, family resemblance, "whatever the reader takes it to be"), and whether any pair on my list can't be jointly satisfied — i half expect "must be a real category" and "must cover every variant anyone ever drew" to be at war, and i'd rather find that out now than in week nine. Skip the scorecard.
