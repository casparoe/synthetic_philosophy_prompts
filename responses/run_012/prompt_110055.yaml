answer: |-
  Good morning. Welcome to all of you. It is genuinely pleasing to see this room full. We have a mix here that doesn't always happen: deep specialists in the history and metaphysics of the proposition, and a couple of colleagues who are currently learning where the coffee is kept. To the latter: if you find yourselves lost during the sessions, know that you are in good company. The problem we are gathered to discuss has left far more senior heads spinning than yours.

  We are here to talk about the unity of the proposition. That phrase sounds technical, but the intuition behind it is simple. Consider the claim "Socrates is mortal." Now consider the list: "Socrates, Mortality." The list contains the same ingredients as the claim. But the list cannot be true or false. It just sits there. The claim, however, says something. It achieves a unity that allows it to match or mismatch the world. The question for this weekend is: what accounts for the difference? What turns a heap of components into a single thing that can be true?

  The honest way into this problem is through Bradley's Regress. I know many of you know the drill, but for the sake of a shared starting point, let's run it quickly. If a proposition is composed of parts—an object and a property—there must be something that ties them together. Let's call this tie a relation. But if the relation is just another component, another item in the heap, then we have "Socrates, Mortality, and the Tie." We still haven't explained how they are connected. We need a new relation to tie the tie to the objects. And then another to tie that one. We are off, infinitely.

  Historically, Bradley's own solution was to say that relations aren't real, and that only the Absolute is real. That is a coherent position, but if we spend the next two days assuming that is the only way out, we will be holding a museum exhibit rather than a workshop. Half the room would rightly suspect the problem is a trick. So, we need to feel the regress as a live pressure, not a historical artifact. The pressure is this: any story we tell about what ties the parts together seems to either presuppose the unity it is supposed to explain, or it simply restarts the regress.

  Over the course of the weekend, we will likely see a menu of attempts to stop this slide. Some will argue for unsaturatedness: that concepts are inherently gappy and don't need a further tie to grab onto objects. Others will look to the early analytic attempts to distinguish the verb from the name structurally. Some will suggest the unity isn't in the proposition at all, but in the act of judging or asserting it. And others will look to grounding or fundamentality to find a primitive tie that doesn't demand further explanation.

  I want us to be honest about this menu. We should watch closely to see if these are genuinely different solutions, or if they are the same move wearing different hats. Saying a concept is "unsaturated" looks suspiciously like saying it comes with a tie built-in, which looks suspiciously like saying the tie is primitive. We need to ask when we are explaining unity, and when we are just naming our ignorance of it.

  We also need to stress-test these views. Theories of unity often look sturdy until we introduce a nested case. Consider a proposition about a proposition: "John believes that Socrates is mortal." Now the inner proposition—"Socrates is mortal"—is itself a component of the outer one. The inner proposition must be unified to be the object of belief. But is it unified *inside* the outer proposition, or does it arrive already unified? If it arrives already unified, how did that happen without triggering the regress elsewhere? If it gets unified by the outer context, then the unity of the proposition depends on something outside the proposition. Every version I have heard starts sweating when we stack the boxes this way.

  There is, of course, the deflationary option. This is the view that the regress only gets going if we make a category mistake—specifically, if we treat the predicate as one more name in the pile. If "is mortal" isn't an object at all, but a function or a rule, there is nothing to tie. The problem dissolves. I propose we name this option clearly, and then set it aside for the duration of the workshop. Not because it is wrong, but because if that is the answer, we can all go home now. I assume none of us want that. We are here because we suspect there is something substantive to be said about how truth-bearers are constructed.

  So, here is our task. We have two days. We have the regress, which threatens to make unity impossible. We have the nested cases, which threaten to make unity fragile. And we have the deflationary exit, which threatens to make the whole inquiry unnecessary. We are not here to sign a treaty. We are here to see where the cracks are.

  I will leave you with this: when the tying is done, and the regress is halted, have we explained how a proposition represents the world, or have we merely explained how we manage to speak as if it does?
