  You're right that death isn't the unit, suffering is, and I shouldn't have let the shorthand slide. But when you run the suffering-per-calorie calculation with wild animals included, beef still comes out ahead, mostly because of what it takes to grow chicken feed. To get a calorie of chicken, you need many calories of grain, and growing that grain is a recurring cycle of death for small wild animals. Every harvest combines through fields of mice, every pesticide sprays through fields of insects, and because crop land supports higher densities of these animals than pasture does, you're cycling through more wild suffering per calorie produced. Pasture is relatively stable; you aren't churning the soil and killing the residents annually to the same degree. Plus, if you accept my premise that wild lives are predominantly net suffering, then the lower density of wild animals on pasture compared to crop land is actually a moral credit, not a debit. You're preventing more miserable existences per calorie with beef than with chicken.

  I concede the empirical fuzziness here—we don't have perfect counts on insect sentience or field mouse mortality rates—but the order of magnitude suggests crops are worse for wild animals than grazing. And on the farmed animal side, the broiler's life is so compressed and dense with suffering that even if you weigh the cow's longer life heavily, the suffering per calorie remains lower for the cow. I'm not saying beef is good; nothing we eat is good against the backdrop of nature. But if you're forcing a choice within the system we have, the crop intensity required for poultry makes it the higher-suffering option, even by my metrics. I'm not going to apologize for eating, but I am trying to minimize the footprint, and the math still points to the cow.
