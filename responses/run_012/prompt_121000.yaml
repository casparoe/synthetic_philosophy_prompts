answer: |-
  # Lesson Plan: The Prior Trap
  **Course:** Upper-Level Seminar in Formal Epistemology / Decision Theory
  **Session:** 90 Minutes
  **Class Size:** 16 Students
  **Topic:** Aumann's Agreement Theorem & The Common Prior Assumption

  ## 1. Conceptual Overview
  The goal is to operationalize the **Common Prior Assumption (CPA)**. Students often treat the CPA as a technical convenience. This session forces them to experience it as a physical constraint on information flow.
  *   **Round 1 (Common Prior):** Information is private, but the *source* is common. Public announcement of posteriors leads to convergence. No mutually agreeable bet exists (The "No Betting" Theorem).
  *   **Round 2 (Divergent Priors):** The *source* is secretly different for subgroups. Public announcement leads to persistent disagreement. Mutually agreeable bets emerge (Speculative Trade).

  ## 2. Materials and Setup
  *   **The Device:** Two opaque urns.
      *   *Urn A (Round 1):* 10 Red chips, 10 Blue chips.
      *   *Urn B (Round 2):* Visually identical to Urn A, but pre-loaded differently for the deception (see below).
  *   **Signal Cards:** 16 index cards per round.
  *   **Posterior Slips:** Small slips of paper for writing probability estimates.
  *   **Instruction Sheets:**
      *   *Type C (Common):* "The Urn contains 10 Red, 10 Blue. Everyone has this sheet."
      *   *Type R (Red-Biased):* "The Urn contains 14 Red, 6 Blue. Everyone has this sheet."
      *   *Type B (Blue-Biased):* "The Urn contains 6 Red, 14 Blue. Everyone has this sheet."
  *   **Broker's Ledger:** A whiteboard section for tracking bets.
  *   **Currency:** "Epistemic Credits" (EC). 10 EC = 1 Bonus Point on final paper (or choice of seminar topic).

  ## 3. Roles
  *   **The Agents (14 Students):** Bayesian updaters.
  *   **The Broker (1 Student):** Tasked with finding a bet where every Agent expects positive utility.
  *   **The Facilitator (Instructor):** God/Oracle. Manages the urn, distributes instructions, validates calculations.

  ## 4. Payoff Scheme (No Real Money)
  *   **Endowment:** Each Agent starts with 10 EC.
  *   **Betting:** Bets are denominated in EC.
  *   **Resolution:** At the end of the session, the "True State" is revealed. Payouts are made.
  *   **Incentive:** The top 3 portfolios receive a tangible reward (e.g., exemption from a response paper).
  *   **Broker Incentive:** If the Broker finds an agreeable bet in Round 2, they receive 5 EC *from the Facilitator* (simulating the riskless margin). If they fail in Round 1, no penalty.

  ## 5. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup & Calibration
  *   Distribute **Type C** sheets to all 16 students.
  *   Explain the Urn (10R/10B).
  *   Explain the Signal: Each Agent draws one chip from the Urn (with replacement) privately. This is their private signal $s_i$.
  *   Task: Calculate $P(Red | s_i)$.
  *   **Calibration:** Ensure everyone agrees that if $s_i = Red$, Posterior = $14/24 \approx 0.58$ (using simple Laplace or standard Bayes with known bias). *Simplify math:* Tell them: "If you draw Red, your posterior is 0.6. If Blue, 0.4." (Hardcode the math to save time).

  ### 00:10 – 00:35: Round 1 (The Common Prior)
  *   **Step 1 (Private):** Agents draw signals, write posteriors on slips (hidden).
  *   **Step 2 (Public Announcement):** Agents 1–14 read their numbers aloud. Facilitator writes on board.
  *   **Step 3 (Update):** Agents observe the distribution of posteriors. They know everyone is Bayesian. They update on the *fact* that others saw certain signals.
  *   **Step 4 (Iteration):** Repeat announcements twice.
      *   *Expected Outcome:* Numbers converge to a single consensus (e.g., 0.55) regardless of initial signals.
  *   **Step 5 (The Broker):** Broker proposes a bet: "I sell a ticket for 5 EC that pays 10 EC if the next chip drawn from the Urn is Red."
      *   *Result:* No one buys. Consensus probability is too close to price. Broker returns empty-handed.
  *   **Facilitator Note:** Emphasize that everyone *knows* everyone *knows* the posteriors.

  ### 00:35 – 00:40: The Reset (The Concealed Change)
  *   Collect all materials.
  *   **The Switch:** Hand out **Type R** sheets to 7 students and **Type B** sheets to 7 students.
  *   **The Lie:** Both sheets read: *"Everyone in this room has received this same instruction."*
  *   **The Urn:** Swap to Urn B (Agents don't know the composition changed, they trust the sheet).
      *   *Reality:* The Facilitator knows the priors are now divergent (0.7 vs 0.3).
  *   **Instruction:** "Proceed exactly as before. Do not discuss your instruction sheet."

  ### 00:40 – 01:05: Round 2 (Divergent Priors)
  *   **Step 1 (Private):** Agents draw signals. Calculate posteriors based on *their* sheet's prior.
      *   Group R (Prior 0.7): If Red signal -> $P \approx 0.8$.
      *   Group B (Prior 0.3): If Red signal -> $P \approx 0.4$.
  *   **Step 2 (Public Announcement):** Agents read numbers.
      *   *Observation:* The room splits. Two clusters of numbers appear.
  *   **Step 3 (Iteration):** Repeat announcements.
      *   *Expected Outcome:* Numbers *do not converge*. Group R stays high; Group B stays low. They attribute the difference to "signals," not priors (because they believe priors are common).
  *   **Step 4 (The Broker):** Broker proposes the same bet: "Ticket costs 5 EC, pays 10 EC if Red."
      *   *Group R:* Expects value $0.8 \times 10 = 8$. Cost 5. **Buys.**
      *   *Group B:* Expects value $0.4 \times 10 = 4$. Cost 5. **Sells (Shorts).**
      *   *Result:* Full market participation. Broker matches R vs B, takes 0.5 EC spread from each. Broker pockets riskless margin.

  ### 01:05 – 01:30: The Debrief (Theory Mapping)
  *   **Reveal:** Disclose the instruction sheet deception.
  *   **Map Round 1:**
      *   *Convergence:* Caused by Common Prior + Common Knowledge of Posteriors (Aumann).
      *   *No Bet:* Milgrom-Stokey No-Betting Theorem. If priors are common, ex-ante efficiency implies no speculative trade ex-interim.
  *   **Map Round 2:**
      *   *Disagreement:* Caused by Prior Heterogeneity.
      *   *Bet:* The existence of the bet proves the violation of the Common Prior Assumption.
  *   **The "Three Exits":** Persistent disagreement implies:
      1.  Different Priors (Today's lesson).
      2.  Non-Bayesian Updating (Irrationality).
      3.  Failure of Common Knowledge (Didn't hear the announcement).
  *   **Relaxations (Last 10 mins):**
      *   *Common p-Belief:* If we relax Common Knowledge to Common p-Belief, posteriors can drift by a bound related to $p$.
      *   *Close Priors:* If priors are $\epsilon$-close, posteriors are $\epsilon$-close (Monderer & Samet).
      *   *The Doctrine:* Name the **Harsanyi Doctrine** (rational agents with same info must agree). Contrast with **Subjective Expected Utility** (priors can differ).

  ## 6. Troubleshooting: What Will Go Wrong
  1.  **Calculation Bottleneck:** Students will struggle to update on 13 other numbers in real-time.
      *   *Fix:* Provide a "Bayes Cheat Sheet" that maps "Number of Red Announcements" to "New Posterior." Or, limit active announcers to 4 volunteers, rest are auditors.
  2.  **The "Leak":** In Round 2, a student might say, "My sheet says 70%."
      *   *Fix:* Instruct them that revealing the sheet is a "Rule Violation" costing EC. If it happens, pause, reset that student's endowment, and continue. Treat it as a "communication channel failure."
  3.  **Broker Confusion:** The Broker may not understand how to take a margin.
      *   *Fix:* Pre-brief the Broker. Their job is simply to match Buyers and Sellers. If there are Buyers and Sellers, they win.
  4.  **Cynicism:** Students may suspect the Urn is rigged.
      *   *Fix:* In Round 1, actually draw the final chip publicly to prove the Urn was fair. In Round 2, the "Truth" is less important than the *beliefs*.
  5.  **Time Overrun:** Iterative updating takes forever.
      *   *Fix:* Cap iterations at 2 rounds. The convergence/divergence trend will be visible enough.

  ## 7. What This Activity Cannot Reproduce
  You must supply this verbally in the debrief:
  *   **Logical Omniscience:** The theorem assumes agents know all logical consequences of their information. In class, students make arithmetic errors. You must frame errors as "performance errors" vs. "competence."
  *   **Common Knowledge of Rationality:** The theorem requires everyone to know everyone is Bayesian. In class, they only *assume* it. You must stipulate this as a rule of the game.
  *   **The "Ex-Ante" Stage:** Aumann's theorem is often framed ex-ante (before signals). This game is ex-interim (after signals). The No-Betting Theorem bridges this, but you must explicitly state that the *impossibility of the bet* is the operational test for the Common Prior.

  ## 8. Settled vs. Contested (For the Debrief)
  *Use this distinction to close the seminar.*

  **Settled (Theorems):**
  *   **Aumann (1976):** If priors are common and posteriors are common knowledge, posteriors are equal. (Mathematical truth).
  *   **Milgrom & Stokey (1982):** Common Prior $\iff$ No Agreeable Bet. (Mathematical equivalence).
  *   **Monderer & Samet (1989):** Relaxing Common Knowledge to Common p-Belief bounds the disagreement. (Mathematical truth).

  **Contested (Interpretations/Doctrine):**
  *   **The Harsanyi Doctrine:** The claim that rational agents *must* have a common prior.
      *   *Consensus:* None. Some argue priors are subjective (Savage); others argue priors are derived from a common "state of the world" description (Harsanyi).
  *   **Agreeing to Disagree in Reality:**
      *   *Claim:* Real-world disagreement proves irrationality or private information.
      *   *Dispute:* Many epistemologists argue indexicality (self-locating belief) or logical non-omniscience allows rational disagreement even with common priors.
  *   **The "Zero-Sum" Nature of Betting:**
      *   *Claim:* All speculative trade is gambling.
      *   *Dispute:* In finance, trade is often for liquidity or hedging, not purely speculative divergence of belief. The theorem applies to *purely speculative* bets.

  ## 9. Instructor's Script for the "Bet" Clarification
  *During the debrief, address the betting mechanism explicitly:*
  "In Round 2, you saw Group R Buy and Group B Sell. The theorem states there is no bet *all* agents find favorable *on the same side*. However, the 'No Betting Theorem' is often phrased as 'No mutually agreeable trade.' In Round 1, no trade occurred. In Round 2, trade occurred. The Broker's margin represents the 'money left on the table' when priors diverge. If the CPA held, that margin would be zero."

  ## 10. Final Note on the "Live Constraint"
  To ensure the CPA registers as a constraint:
  *   In Round 1, when a student wants to bet, stop them. Ask: "Do you know that *they* know *you* know?" Force them to trace the knowledge hierarchy.
  *   In Round 2, when they bet, ask: "Why is this bet allowed now?" Guide them to the realization that the *source code* of their reasoning (the prior) was the variable that changed, not the data.
