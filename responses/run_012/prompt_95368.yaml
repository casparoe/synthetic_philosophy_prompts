answer: |-
  You have identified a critical failure mode in socio-technical systems that is currently understudied but increasingly common. You are right to feel that standard terms like "groupthink" miss the mark. Groupthink implies social pressure; what you are describing is **architectural**.

  There isn't one single word that captures the whole picture, but there are two established concepts that, when combined, name exactly what you are seeing.

  ### 1. The Psychological Mechanism: Automation Bias
  The behavior of the nurses is a textbook case of **Automation Bias**. This is the cognitive tendency to favor suggestions from automated decision-making systems and to ignore contradictory information, even if that information is correct.

  However, Automation Bias usually describes an individual's relationship with a machine. It explains why *Nurse A* stops arguing. It doesn't fully explain why the *system* becomes fragile.

  ### 2. The Systems Failure: Common Mode Failure
  In reliability engineering, a **Common Mode Failure** (or Common Cause Failure) occurs when redundant systems fail simultaneously because they share a single vulnerability or dependency.

  *   **Example:** You have two backup generators for the hospital. They are redundant. But if they both draw fuel from the same single tank, and that tank is contaminated, both generators fail at once. You had structural redundancy (two generators), but no functional independence.

  In your scenario, the "generators" are the nurses. The "fuel tank" is the AI model. By routing both nurses through the same model, you have introduced a single point of failure into a system designed to be redundant. You have converted **independent variables** (two nurses thinking separately) into **correlated variables** (two nurses echoing one model).

  ### The Name: Cognitive Common Mode Failure
  If we need a name for the specific phenomenon you are describing—where independent human verification is collapsed by a shared cognitive tool—I would call it **Cognitive Common Mode Failure**.

  It is a subtype of **Algorithmic Monoculture**. This term is used in finance and ecology to describe what happens when everyone uses the same risk model or plants the same crop. It optimizes for average performance (consistency) while destroying resilience to edge cases (the specific errors the model makes).

  ### Where the Edges Are
  You asked where the boundaries of this concept lie. Here is the breakdown:

  **1. Does it need a shared tool?**
  No. It needs a **shared oracle**.
  *   **Shared Tool (AI):** The model acts as an objective-seeming arbiter.
  *   **Shared Dogma (Training/Textbook):** If every nurse is trained so rigidly that they cannot interpret ambiguity differently, you get the same result. This is often called **Doctrinal Rigidity**.
  *   **Shared Boss:** If the "tie-breaker" is always a specific manager whose judgment is never questioned, the team creates a **Single Point of Authority**.

  The phenomenon requires that the *source of truth* be singular, even if the *processors of that truth* are multiple.

  **2. Is it one phenomenon or two (Person vs. Model)?**
  It is functionally the same phenomenon (loss of independence), but the *texture* differs in a way that matters for safety.

  *   **The Person (Authority Bias):** If the nurses defer to a Chief Nurse, there is still a human chain of custody. The Chief Nurse can be argued with, tired, or overruled. The "error surface" is still human.
  *   **The Model (Automation Bias):** The model is perceived as neutral and tireless. It is harder to argue with a probability score than a colleague. This makes the **coupling tighter**. With a person, you might argue 10% of the time. With a model, you might argue 0.1% of the time. The "friction" that used to catch errors is lubricated away.

  ### Why "Consistency" is the Trap
  Management sees "zero disagreements" and reads it as "process maturity." In safety engineering, this is known as the **Illusion of Control**.

  When you remove the noise (disagreements), you often remove the signal (error detection). In high-reliability organizations (like aviation or nuclear ops), disagreement is not seen as a failure of consistency; it is seen as a **necessary friction**.

  Your intuition about the "Wisdom of Crowds" is exactly right. The mathematical proof of the Wisdom of Crowds relies entirely on the **independence** of the judgments. If $Error_A$ and $Error_B$ are correlated because they both stem from $Error_{Model}$, the variance does not decrease; it concentrates.

  ### Summary
  *   **The existing terms:** Automation Bias (psychology) + Common Mode Failure (engineering).
  *   **The specific name:** **Cognitive Common Mode Failure** or **Algorithmic Monoculture**.
  *   **The condition:** Structural redundancy without functional independence.
  *   **The risk:** Correlated error. You haven't reduced the error rate; you've synchronized it.

  You are watching your safety system trade **resilience** for **efficiency**. The model is better than the average nurse, but the *system* is now more fragile than it was before, because it can no longer catch the specific things the model is blind to.
