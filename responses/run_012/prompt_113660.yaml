answer: |-
  ### What I think Condorcet says

  You see Condorcet as offering contradictory promises. The Jury Theorem suggests that if voters are slightly better than random at finding truth, a large majority becomes nearly infallible, implying bigger electorates are wiser. The Condorcet Paradox suggests majority rule is logically unstable, cycling through options without a correct answer. You also note the fragility: if voters are worse than random, the majority becomes confidently wrong. This leaves you wondering how juries can be defended, and why we don't replace expert panels with mass ballots if large numbers guarantee accuracy. You suspect these claims contradict, making institutional design seem impossible.

  ### Where the two results actually live

  These two results live in different conceptual universes. The Jury Theorem is epistemic: it assumes there is a single, objective correct answer (like "did the defendant commit the crime?" or "is this drug safe?"). It requires voters to be independent and share a common goal of finding that truth. Under these specific conditions, individual errors cancel out, and the signal amplifies. The theorem collapses if voters copy each other or lack basic competence, which explains the "knife-edge" worry you noted. It generally assumes a binary choice.

  The Condorcet Paradox, however, is about preferences, not truth. It arises when there is no single "right" answer, only conflicting values (e.g., spending on parks vs. roads vs. schools). With three or more options, individual rational rankings can aggregate into an irrational collective cycle (A beats B, B beats C, C beats A). This isn't about voters being wrong; it's about the group having no consistent will.

  So, the Jury Theorem applies to fact-finding missions (juries, scientific consensus) where independence and competence hold. The Paradox applies to political choice among multiple competing values. The "knife-edge" competence issue matters for the Jury Theorem because it relies on probability converging on truth. The Paradox matters because it shows majority rule doesn't always produce a stable winner, regardless of voter intelligence. One warns you about ignorance; the other warns you about inconsistency. They aren't contradicting each other; they are describing different problems: one is about discovering reality, the other about reconciling desires. Consequently, the Jury Theorem supports small, independent groups for facts, while the Paradox suggests we need structures (like agendas or representatives) to stabilize value conflicts. You cannot use the Jury Theorem to solve the Paradox because politics often lacks a single truth to find.

  ### What that means for real votes

  This distinction dictates institutional design. For the Jury Theorem to work, voters must be independent. In a nation of 50 million, independence is impossible; everyone consumes the same media and social networks, correlating errors. If everyone is biased the same way, the "wisdom of crowds" becomes the "madness of mobs." Furthermore, competence isn't uniform. On technical questions like drug approvals, the average voter's competence is likely below the 0.5 threshold, making a mass ballot dangerous. Here, expert panels function better because their competence is verified, even if the group is small.

  Juries work because they are isolated (independence) and instructed on the law (competence boost). They fit the Jury Theorem model for fact-finding. Referendums, however, often mix facts with values. When voting on constitutional amendments, there is no objective truth to find, only preferences to aggregate. Here, the Condorcet Paradox looms. A simple majority vote might ignore intensity of preference or create cycles if multiple amendments interact.

  This is why we don't replace all experts with mass ballots. For factual questions, we need competence above the random threshold, which experts provide more reliably than the general public. For value questions, we need stability, which representatives provide by bundling issues and creating agendas that prevent cycling. A small parliament or court isn't necessarily "wiser" in the Jury Theorem sense, but it is more structured to handle the Paradox. They negotiate and compromise, whereas a raw referendum forces a binary choice on complex multi-dimensional problems. Ultimately, mass votes are vulnerable to correlated errors and low competence on technicalities, while small groups are vulnerable to capture. We use different tools for different jobs: experts and juries for truth, representatives for values. The size of the group matters less than whether the conditions for truth-seeking or preference-aggregation are met.

  ### Bottom line

  Condorcet's Jury Theorem defends small, independent groups seeking objective truth, while his Paradox warns that raw majority rule fails when aggregating conflicting values. We use juries for facts and representatives for politics because neither mass ballots nor experts solve both problems simultaneously.
