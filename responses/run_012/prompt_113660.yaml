      *   *Draft:* These two results live in different conceptual universes. The Jury Theorem is epistemic: it assumes there is a single, objective correct answer (like "did the defendant commit the crime?"). It requires voters to be independent and share a common goal of finding that truth. Under these specific conditions, noise cancels out, and signal amplifies. The theorem collapses if voters copy each other or lack basic competence.

      The Condorcet Paradox, however, is about preferences, not truth. It arises when there is no single "right" answer, only conflicting values (e.g., spending on parks vs. roads vs. schools). With three or more options, individual rational rankings can aggregate into an irrational collective cycle (A beats B, B beats C, C beats A). This isn't about voters being wrong; it's about the group having no consistent will.

