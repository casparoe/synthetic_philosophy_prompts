answer: |-
  These are not competing versions of a single concept but distinct categories—one political-ethical and one epistemic—where conduct defines denialism as a corrupt practice that mimics but fundamentally violates the trajectory conditions required for genuine inquiry, particularly in history where "novelty" must be redefined as explanatory coherence rather than experimental prediction.

  The two criteria often converge because a denialist enterprise inevitably produces a degenerating research programme, but they come apart when a programme degenerates innocently. A scientific theory may run out of heuristic power, requiring ad hoc adjustments to survive anomalies (like the Steady State theory of cosmology), without exhibiting the asymmetric standards of proof or conspiracy theories that characterize denialism. Innocent degeneration accepts eventual falsification; denialism immunizes itself against it. Therefore, while all denialism is Lakatosian degeneration, not all degeneration is denialism, making the conduct criterion the necessary differentiator for the specific moral and political harm you are investigating.

  Conduct is fundamental because it explains the failure of the trajectory. In a genuine research programme, degeneration is a sign of intellectual exhaustion; in denialism, it is the result of ideological constraint. The asymmetry of proof and the relocation of goalposts are the mechanisms that force the programme to degenerate, preventing it from ever becoming progressive. This confirms your suspicion that denialism is a political practice in the costume of a research programme: it uses the language of inquiry not to find truth, but to protect a pre-existing conclusion from evidence. This is why the verdict on denialism feels final—it is a judgment on bad faith—whereas the Lakatosian verdict remains provisional, awaiting further empirical development.

  Regarding history, the trajectory criterion survives only if "novel fact" is translated from experimental prediction to archival discovery or hermeneutic breakthrough. A progressive historical programme integrates new documents or offers a coherent reinterpretation that resolves anomalies without discarding the fixed evidentiary base. Denialism fails this test by treating the base itself as mutable via conspiracy (e.g., claiming documents are forgeries), which is methodologically distinct from legitimate revisionism that finds errors within the record. Your *H. pylori* anecdote illustrates a progressive minority overcoming a degenerating mainstream, not denialism, because the mainstream eventually surrendered to evidence rather than invoking conspiracy to protect its status; denialism is defined by its refusal to surrender.
