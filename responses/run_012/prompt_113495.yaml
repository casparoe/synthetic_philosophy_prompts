  Arrange six pods of three students. Place a visible, desirable prize (e.g., a $50 bookstore voucher) at the front. Distribute point ledgers and pens. In the first five minutes, establish the stakes clearly: "You begin with 100 points. The prize costs exactly 100. You may trade your current holding for another holding. Each trade incurs a processing fee. Your goal is to retain enough points to buy the prize. Brokers earn a commission on every fee collected. Do not discuss strategy across pods." Assign roles: twelve Agents, five Brokers, one Recorder. Brokers receive a private instruction sheet emphasizing fee maximization. Agents receive option cards. The Recorder tracks global point depletion. Ensure no philosophical terminology is used; refer only to "holdings," "trades," and "fees."

  ### The Game
  **Elicitation:** Display three options: Job A (High Salary, Long Commute), Job B (Medium Salary, Medium Commute), Job C (Low Salary, Short Commute). Agents choose pairwise: A vs B, then B vs C, then C vs A. If an Agent chooses A>B, B>C, and C>A, they are "Active." If transitive, they become "Auditors" assisting the Recorder. This filters for cyclic preferences without stipulating them.
  **Currency:** Points. Start: 100. Prize Cost: 100. Trade Fee: 15 points per trade.
  **Condition 1 (Sequential):** Broker holds Option A. Agent holds Option B. Broker offers trade B→C (fee 15). If accepted, Broker offers C→A (fee 15). Then A→B (fee 15). Agent ends with original holding minus 45 points. Broker offers appear one at a time; no mention of future offers. Brokers script: "This trade improves your commute/salary immediately."
  **Condition 2 (Announced):** Reset holdings. Broker presents the full cycle of three trades upfront, including total fees (45 points). Agent decides whether to engage in the sequence.
  **Condition 3 (Lock-in):** Reset holdings. Before trading begins, Agent may pay 20 points to "freeze" their current holding, preventing any trades.
  **Broker Role:** Brokers track fees. If an Agent refuses a trade, Broker records the "lost commission" and reports it to the Recorder.
  **Payoff:** At hour's end, points are tallied. Only Agents with ≥100 points enter the raffle for the prize. Brokers are paid in points towards a separate prize (e.g., coffee gift card). This ensures Brokers are motivated to pump even friends.

  ### Run of Play
  **0-5:** Intro, stakes, role assignment. Private briefing for Brokers.
  **5-20:** Preference Elicitation. Filter Agents/Auditors. Ensure cycles are recorded.
  **20-40:** Condition 1 (Sequential). Agents trade blindly. Recorder logs final points and Broker commissions.
  **40-60:** Condition 2 (Announced). Reset holdings. Reveal full sequence. Observe refusal rates. Brokers report refusals.
  **60-75:** Condition 3 (Lock-in). Reset holdings. Offer freeze option. Observe uptake. Calculate net benefit of freezing.
  **75-90:** Debrief. Collect ledgers. Discuss observations. Introduce terminology. Connect experience to argument.

  ### Debrief
  Reveal the terms "Money Pump" and "Intransitivity." Ask Agents in Condition 1: "Did any single trade seem bad at the moment you made it?" (Likely no). Ask: "Why are you worse off?" (The sequence). This establishes point (a): the cost is created by the sequence rather than any single step.
  Ask Condition 2 Agents: "Why did you refuse?" (Anticipation). This establishes point (b): The pump shows intransitivity is expensive for the naive, not necessarily irrational as such. An agent who anticipates the loop simply refuses to start.
  Ask Condition 3: "Was paying to freeze rational?" This opens point (c): Is diachronic coherence a requirement, or just instrumental?
  **The Single-Step Argument:** Address the memory of paying to keep options open. Explain that this argument relies on *uncertainty* about future preferences or states (value of flexibility), whereas today's game used *static* cyclic preferences. In the single-step view, you pay for flexibility because you might change your mind. In our game, you paid because you couldn't see the loop or couldn't bind yourself. The diachronic framing survives because even with static preferences, the *timing* of choices creates the loss. If you treat each moment as isolated, you lose. If you treat your life as a sequence, you bind yourself. The game shows exploitability is a cost of myopia. The question remains: must a rational agent care about exploitability? If not, the pump fails. If yes, diachronic coherence is required.

  ### What Will Go Wrong
  **No Cycles:** If too many Agents are transitive, the game stalls. *Fix:* Use Auditors as backup Agents; manually adjust option descriptions for them to highlight conflicting attributes (e.g., "Focus on salary" vs "Focus on life") to induce context-dependent switching.
  **Sophisticated Agents:** Agents refuse Trade 1 in Condition 1. *Fix:* Brokers must frame Trade 1 as a strict improvement ("You get a shorter commute for free") and hide the fee's impact relative to the benefit.
  **Fee Ignored:** Students treat points as abstract. *Fix:* Remind them every 10 minutes that the prize is real and fees are 15% of the prize value. Display a thermometer of points remaining.
  **Broker Collusion:** Brokers go easy on friends. *Fix:* Broker prize depends on *total* fees extracted across the room, creating competition.
  **Time Overrun:** Elicitation takes too long. *Fix:* Hard stop at 20 minutes; force choices. Use a timer visible to all.

  ### The Ceiling
  This activity cannot prove that intransitive preferences are logically irrational, only that they are costly in a specific environment. The cycles may be artifacts of how I framed the job attributes (shifting salience) rather than deep preference structures. If the cycle is due to framing, then "correcting" the frame solves the problem without binding. I must supply the philosophical link: that rationality might require frame-invariance. Also, the game cannot settle whether diachronic coherence is a distinct normative requirement. I must explain that some philosophers argue "rationality is synchronic," and the pump only shows that synchronic rationality + naivety = loss. The single-step argument (paying for flexibility) suggests that sometimes paying to avoid choice is rational even without cycles, due to weakness of will or uncertainty. The game models static cycles; it does not model changing preferences. I will need to lecture on whether avoiding exploitation is a constitutive norm of rationality or merely a prudential hint.
