answer: |-
  1. **You characterize omissions as "subtracting" from the world rather than adding to it. Metaphysically, what is being subtracted?**
     *[Likely Answer: He will say "possible events" or "expected continuities" rather than concrete entities.]*
     **Follow-up:** If what's subtracted is merely a possibility or an expectation, aren't you defining causation in terms of modal or psychological facts rather than ontological ones?

  2. **You insist omissions are *only* preventive causes, never productive ones. What blocks an omission from ever playing a productive role?**
     *[Likely Answer: He will argue production requires energy transfer or positive existence, which omissions lack.]*
     **Follow-up:** But consider a shutter opening to let light through; the removal of the barrier seems to productively enable the illumination. Why is that enabling not a form of production?

  3. **Your view collapses the act/omission asymmetry by claiming every act is just the prevention of an alternative omission. Isn't this true but trivial—a verbal reductio rather than an explanatory insight?**
     *[Likely Answer: He will claim it provides theoretical unity and simplifies the causal model.]*
     **Follow-up:** Does that unity come at the cost of discriminatory power? If everything is a prevention, does the concept of "prevention" lose its ability to distinguish specific causal mechanisms?

  4. **If the causal asymmetry collapses, does the moral asymmetry between killing and letting die survive, or does your metaphysics force a moral revision?**
     *[Likely Answer: He will likely argue moral distinctions rely on norms, not metaphysics, so the asymmetry remains ethically.]*
     **Follow-up:** But if causation is the backbone of responsibility, and you've normalized omissions as causes, haven't you removed the metaphysical grounding that usually supports those moral norms?

  5. **Let's apply this to non-agents: when a heart stops, is the cessation of beating a preventive cause of death?**
     *[Likely Answer: Yes, the heart's failure prevents the circulation required for life.]*
     **Follow-up:** If the heart's stopping is a cause, is the absence of a pacemaker also a cause? Where do you draw the line between a physiological omission and background conditions?

  6. **Extend that to nature: if a river doesn't flood, is the absence of rain the preventive cause of the dry valley?**
     *[Likely Answer: Yes, contextually, the lack of rain prevents the flooding.]*
     **Follow-up:** This invites the "abundance problem": the absence of a meteor strike also prevented the flood. Why is the rain the cause and the meteor not, if both are preventions?

  7. **That leads to the selection problem: why is my not watering the plant the cause of its death, rather than the Queen of England's not watering it?**
     *[Likely Answer: He will appeal to normative expectations or contextual relevance to select the cause.]*
     **Follow-up:** If norms determine which omission is *the* cause, doesn't that make causation itself mind-dependent or normative, rather than a feature of the world?

  8. **Consider a trumping case: a lifeguard and a bystander both fail to save a drowning child. Both omissions are counterfactually relevant, but only the lifeguard's looks like the cause. How do you handle this?**
     *[Likely Answer: He will say the lifeguard's duty makes their omission the salient cause.]*
     **Follow-up:** You're again relying on duty to solve a causal puzzle. Are you willing to admit that on your view, causal relations are partially constituted by normative obligations?

  9. **If causation is partly normative, what happens when moral norms shift? Does the causal history of an event change if we later decide the bystander *did* have a duty?**
     *[Likely Answer: He might say the causal facts stay the same, but our *identification* of them changes.]*
     **Follow-up:** Then you're distinguishing between causation itself and causal explanation. Why not just admit omissions aren't genuine causes, but are useful explanatory fictions?

  10. **Finally, what would actually count against your picture? Describe a specific case where your theory predicts an omission is a cause, but our best intuition says it isn't, and you'd concede the point.**
      *[Likely Answer: He may struggle here, perhaps citing a case where norms and counterfactuals completely diverge.]*
      **Follow-up:** If you can't specify a falsification condition, are we discussing a metaphysical theory or a conceptual framework that is insulated from evidence by design?

  Arc: The interview progresses from the metaphysics of subtraction to the normative implications of collapsing act/omission distinctions, ending on the falsifiability of a causal theory reliant on context.
