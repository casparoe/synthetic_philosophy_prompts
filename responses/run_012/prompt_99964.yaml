prompt: |-
  I'm putting together an episode of a small philosophy podcast, and the guest is a philosopher who defends a view about omissions that I really want to press him on. His line is that omissions are genuine causes, but preventive causes rather than productive ones -- they don't add anything to the world, they subtract from it -- and he pushes that further than most people do, claiming that once you take preventive causation seriously the usual act/omission asymmetry collapses, because on his picture a positive act is just the prevention of the alternative you didn't take. I don't want him just restating this; I want questions that make him do the work.

  So draft me 8-10 questions, with a follow-up for each one keyed to the answer he's most likely to give. I want at least one question each on (a) what exactly separates preventive from productive causation, and why an omission could only ever be the former, (b) the asymmetry-collapse claim -- whether "every act is a prevention of an omission" is anything more than a reductio, (c) whether the account stretches to non-agents, like a heart that stops, a brake that fails, or a river that doesn't flood, (d) the selection problem -- why we single out some omissions as *the* cause of an outcome when there are always thousands of things that didn't happen, plus his answer to the trumping cases where several omissions are all counterfactually relevant but only one looks like the cause, and (e) what would actually count against the whole picture. Keep it in the weeds, no "what drew you to this topic" filler. Last line, give me a one-sentence summary of the interview's arc, starting with "Arc:".
