  These two are distinct, never the same

  A sudden line defines the visual edge
  The eye asserts the silhouette is round
  The light reveals the brightness of the face
  Does depth imply that what I see is solid
  The bandages dissolve into the light
  I watch the reach of my extended hand
  The shapes are clear, but can I truly know
  If what I see is what I touched, the same
