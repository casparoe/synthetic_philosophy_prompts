      4. **Escape Valve:** Is there a legally valid path to amendment, however difficult? If no (absolute entrenchment), reject. Courts often void irreversibility.
      5. **Symmetry Test:** Would the drafters accept this hurdle if applied to their own immediate next decision? If no, the rule is partisan.

