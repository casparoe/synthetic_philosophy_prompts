  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Expert in constitutional design and philosophy of self-binding (Ulysses contracts, entrenchment, etc.).
      *   **Task:** Create a decision procedure for advising organizations on self-binding rules (entrenchment clauses, supermajority requirements, etc.).
      *   **Constraints:**
          *   Must be usable in an afternoon, alone, without legal research.
          *   Must preserve key distinctions (precommitment vs. imposition, self-binding vs. successor binding, hardness vs. desire, weakness of will vs. relocation).
          *   Must be honest about judgment calls.
          *   Structure: "Considerations" (~150 words), "Procedure" (numbered steps), "Two applications" (city charter parkland, foundation payout rate), "Where the procedure rules against the client" (one realistic rejection), "What the procedure cannot settle" (short).
          *   Tone: Operational, honest, tight, no general praise.

  2.  **Deconstruct the Theory (Considerations):**
      *   What is self-binding? It's a principal (the organization/member body) binding an agent (future board) or a future principal (successor generation).
      *   Key distinctions:
          *   *Internal vs. External:* Is this the same body binding itself later, or current members binding future members? (Democratic legitimacy issue).
          *   *Mechanism vs. Motivation:* Is the rule hard to break (procedural hurdle) or just unwanted to break (substantive consensus)?
          *   *Ulysses vs. Tyranny:* Is this protecting against temporary passion/weakness of will, or is it locking in a specific policy preference against future democratic will?
          *   *Enforceability:* Who holds the rope? Courts? Members?
      *   Word count limit: ~150 words.

  3.  **Develop the Procedure:**
      *   Needs to be a sequence of questions.
      *   Needs stop conditions (No = stop, Yes = continue).
      *   Needs to identify where values override mechanics.
      *   Steps should cover:
          1.  Identity of the binder vs. bound (Same body? Successors?).
          2.  Nature of the threat (Weakness of will vs. Change of values).
          3.  Mechanism of enforcement (Who checks the violation?).
          4.  Exit clause (Is there a safe escape valve?).
          5.  Legitimacy check (Is this fair to those not present?).

      *   *Drafting Steps:*
          1.  *Agency Check:* Who is binding whom? If current majority binds future majority on substantive policy, flag as legitimacy risk.
          2.  *Threat Diagnosis:* Is the risk "heat of the moment" (Ulysses) or "change of mind" (Policy)? Only the former justifies hard entrenchment.
          3.  *Enforcement Reality:* Who sues? If no standing third party, the rule is honorary.
          4.  *Escape Valve:* Is there a procedure to undo (even if hard)? Absolute irreversibility is suspect.
          5.  *Sunset/Review:* Does it expire? Permanent binds require higher justification.

      *   *Refining for the prompt's specific distinctions:*
          *   Self vs. Successor.
          *   Hardness vs. Desire.
          *   Weakness of will vs. Relocation.

      *   *Revised Steps:*
          1.  **Identity:** Are the binders and the bound the same continuous legal entity? (If yes, self-binding. If no, inter-generational).
          2.  **Pathology:** What specific failure mode are we preventing? (Impulse/panic vs. Disagreement).
          3.  **Guardian:** Who enforces this when the bound party wants to break it? (Internal vote vs. External court).
          4.  **Reversibility:** Is there *any* path to amendment? (If no, reject).
          5.  **Cost:** Does the hurdle impose a cost proportional to the risk?

  4.  **Develop Applications:**
      *   (a) City Charter (Parkland): 2/3 vote to sell.
          *   Identity: Current citizens binding future citizens (Successor issue).
          *   Pathology: Preventing quick sale for short-term budget fix (Weakness of will).
          *   Guardian: Courts/Voters.
          *   Verdict: Likely passes if there's an escape valve (e.g., referendum).
      *   (b) Foundation Bylaw (Payout Rate): Unanimity to raise.
          *   Identity: Current board binding future board (Agent binding Agent).
          *   Pathology: Mission drift/spending too much now.
          *   Guardian: Attorney General? Beneficiaries?
          *   Verdict: Risky. Unanimity is effectively a veto. Might fail the "Reversibility" or "Cost" step.

  5.  **Develop "Where the procedure rules against the client":**
      *   Need a realistic proposal that sounds good but fails the logic.
      *   Example: A nonprofit trying to ban itself from ever advocating on a specific political issue permanently.
      *   Why: Violates the "Reversibility" or "Pathology" step (locks in policy preference, not prevents impulse).

  6.  **Develop "What the procedure cannot settle":**
      *   Ultimate legitimacy of binding future generations.
      *   Legal enforceability (that's for lawyers).

  7.  **Review and Refine (Self-Correction):**
      *   *Word Count Check:* "Considerations" needs to be tight (~150 words).
      *   *Tone Check:* Needs to be expert, slightly cynical/pragmatic, not academic fluff.
      *   *Distinctions:* Ensure the procedure explicitly tests for "weakness of will" vs "policy disagreement."
      *   *Procedure Usability:* Can I do this in an afternoon? Yes, if the questions are direct.
      *   *Judgment Calls:* Acknowledge where the procedure relies on the advisor's intuition.

      *   *Refining the Procedure Steps:*
          1.  **Continuity:** Is the entity legally continuous? (Corporation vs. Membership body).
          2.  **Diagnosis:** Is the threat *akrasia* (weakness of will) or *evolution* (change of values)?
          3.  **Enforcement:** Who has standing to sue for breach?
          4.  **Escape:** Is the hurdle high but surmountable?
          5.  **Symmetry:** Does the rule bind the drafters equally if they remain?

      *   *Refining Applications:*
          *   Parkland: Passes if viewed as asset protection against fiscal panic. Fails if viewed as policy lock-in.
          *   Foundation: Unanimity is effectively a veto. Might fail "Escape."

      *   *Refining "Rules Against":*
          *   Proposal: "Board shall never invest in fossil fuels."
          *   Reason: Policy lock-in, not structural protection.

      *   *Refining "Cannot Settle":*
          *   The moral right of the dead to rule the living.

  8.  **Final Polish:** Check word counts and structure strictly.

      *   *Considerations:* Focus on the paradox. The sovereign cannot bind the sovereign unless there is a higher law or a structural hurdle. Distinguish between *procedural* entrenchment (harder to change) and *substantive* entrenchment (cannot change). Distinguish binding oneself (Ulysses) vs. binding successors (Dead Hand).
      *   *Procedure:* Make it a flowchart in text.
