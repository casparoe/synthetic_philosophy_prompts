answer: |-
  Considerations
  Self-binding commits us to the paradox that a sovereign power must limit itself to remain sovereign. The load-bearing distinctions are: (1) *Akrasia vs. Disagreement*: Is the rule preventing a known weakness of will (panic selling) or locking in a policy preference against future democratic will? (2) *Self vs. Successor*: Binding your future self is prudential; binding successors is legitimacy-challenged. (3) *Hardness vs. Desire*: Does the rule survive because it is procedurally difficult to undo, or because preferences remain stable? (4) *Internal vs. External Enforcement*: If the bound party controls the enforcer, the rope is elastic. A valid Ulysses contract requires a mast-holder who cannot be bribed by the future self. This procedure tests whether the constraint is a structural mast or merely a promise written in sand.

  Procedure
  1.  **Continuity:** Are the binders and the bound the same legal entity?
      *   *Yes:* Proceed.
      *   *No:* (e.g., current members binding future members). **Hand off:** This is a value claim on successors, not a mechanical safeguard. The governing body must accept the legitimacy burden.
  2.  **Pathology:** What specific failure mode is prevented?
      *   *Acceptable:* Procedural haste, conflict of interest, temporary panic.
      *   *Reject:* "Bad policy outcomes" or "changing our mind." This is policy lock-in. **Stop.**
  3.  **Enforcement:** Who has standing to sue for breach?
      *   *Specific third party:* (e.g., Attorney General, distinct class of members). Proceed.
      *   *None/Self:* The rule is honorary. Advise client it is unenforceable. **Stop.**
  4.  **Reversibility:** Is there a legal path to amendment, however difficult?
      *   *Yes:* Proceed.
      *   *No:* (Absolute entrenchment). **Reject.** Courts often void irreversibility as *ultra vires*.
  5.  **Symmetry (Judgment Call):** Would drafters accept this hurdle for their own immediate next decision?
      *   *Yes:* Proceed to drafting.
      *   *No:* The rule is partisan. **Hand off:** Require governing body to acknowledge they are imposing costs on others they won't bear.

  Two applications
  (a) **City Charter (Parkland):** Passes Continuity (City is continuous). Passes Pathology (prevents fiscal panic selling). Passes Enforcement (Voters/Courts). Passes Reversibility (2/3 vote is possible). Symmetry is acceptable for asset protection. **Verdict:** Proceed.
  (b) **Foundation Payout (Unanimity):** Passes Continuity. Fails Pathology (locks in economic policy vs. preventing haste). Fails Reversibility (Unanimity is effectively a veto/irreversible). **Verdict:** Reject or revise to supermajority.

  Where the procedure rules against the client
  Proposal: "Nonprofit shall never lobby on legislation."
  Reason: Fails Step 2 (Pathology). This is a substantive policy preference, not a safeguard against procedural weakness. It binds successors on values rather than mechanics, risking democratic illegitimacy and potential voiding.

  What the procedure cannot settle
  The moral legitimacy of the dead hand. Whether future generations *ought* to be bound by past prudential judgments is a political question, not a design mechanic.
