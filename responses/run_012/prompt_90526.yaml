prompt: |-
  I am an undergraduate currently taking a philosophy of perception course, and I am applying to my department's summer research bursary, which funds eight weeks of full-time work and expects a 5,000-word paper at the end of it. I need a proposal built around the following half-formed idea. Discussions of the argument from illusion tend to run together three things a non-veridical experience can do: it can fail to be veridical; it can be indistinguishable from the inside from a veridical experience; and it can actually deceive the subject, in the sense that the subject takes the appearance for reality. My suspicion is that the argument's persuasive force comes almost entirely from the third element, while its stated conclusion — that veridical and non-veridical experiences share a common phenomenal kind — is supposed to follow from the second. If that is right, then the stock examples (a stick that looks bent in water, a white wall that looks yellowish under sodium light) do less work than either side assumes, because in those cases the subject is typically not deceived at all, and the disjunctivist's reply and the common-factor theorist's counter-reply may both be aimed at the wrong premise. Please turn this into a proposal. State the question so that it has a determinate answer, set out which reconstructions of the argument are in play and why the existing positions do not settle which of them is sound, explain the method and how I would actually spend the eight weeks, say what a result would look like and what would count as the project failing, and be candid about whether eight weeks is enough for this or whether I should narrow it. I am also curious whether the argument from illusion is dialectically independent of the argument from hallucination or merely a warm-up for it; fold that in if it fits, and drop it if it does not. Do not include citations or a reading list — I will add those myself.
