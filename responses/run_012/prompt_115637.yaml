  "Self-consciousness exists in itself and for itself, in that, and by the fact that it exists for another self-consciousness; that is to say, it is only by being acknowledged or 'recognized'. ... Thus its moments must on the one hand be strictly kept apart in detailed distinctiveness, and, on the other, in this distinction must, at the same time, also be taken as not distinguished, or must always be accepted and understood in their opposite sense. This double meaning of what is distinguished lies in the nature of self-consciousness: — of its being infinite, or directly the opposite of the determinateness in which it is fixed."

  A few pages later he says: "Action from one side only would be useless, because what is to happen can only be brought about by means of both." And then when the two actually show up as extremes, "one is merely recognized, while the other only recognizes."

