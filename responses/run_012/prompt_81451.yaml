answer: |-
  There is no single, established fallacy name in the logical canon that isolates this specific asymmetry. It is too structurally subtle for *non sequitur* and too substantive for *begging the question*. It is, however, a well-recognized tension in contemporary epistemology and philosophy of mind, specifically within the debate between **Disjunctivism** and the **Common Kind Assumption**.

  Because you seek a carving rather than a label, I will first situate the phenomenon within its philosophical context, then propose a term to isolate the argumentative move itself, and finally carve up the conditions under which it constitutes a legitimate philosophical position versus a fallacious double-standard.

  ### 1. Context and Nearest Concepts

  The pattern you describe is the engine room of **Disjunctivism** (associated with J.M. McDowell, M.G.F. Martin, and others). Disjunctivists argue that a veridical perception and a subjectively indistinguishable hallucination do not share a common mental component (the "highest common factor").

  *   **The Argument from Illusion:** This is the broader context you identified. It argues that because hallucination and perception are indistinguishable, they must be the same kind of state.
  *   **The Disjunctive Response:** This is the view that employs your pattern. It accepts indistinguishability for the subject (epistemic) but denies it implies identity of state (ontological).
  *   **The New Evil Demon Problem:** This is the testing ground. If a brain-in-a-vat is indistinguishable from a normal perceiver, is their evidence the same? Internalists say yes; Externalists (and Disjunctivists) say no.

  The nearest fallacy concept is **Special Pleading**. However, Special Pleading usually involves applying a standard to an opponent while exempting oneself. Your pattern is more sophisticated: it applies a fact (indistinguishability) to one *category of judgment* (normative/exculpatory) while withholding it from another *category of judgment* (ontological/classificatory), using a distinction (epistemic vs. ontic) as the warrant.

  ### 2. Proposed Term: The Exculpatory-Ontological Asymmetry

  Since no standard term isolates the *asymmetry* itself, I propose calling this **The Exculpatory-Ontological Asymmetry** (or, more briefly, **The Indistinguishability Asymmetry**).

  **Definition:** An argumentative move wherein the fact of subjective indistinguishability between two states (A and B) is treated as **decisive** for determining the subject's normative status (blame, justification, rationality) but treated as **indecisive** for determining the ontological nature of the states themselves.

  ### 3. Carving the Phenomenon

  To carve this properly, we must distinguish between the *structure* of the move, the *commitments* that license it, and the *conditions* under which it becomes fallacious.

  #### A. The Structure of the Asymmetry
  Let $I$ be the fact that State A (Veridical) and State B (Hallucination) are subjectively indistinguishable.
  1.  **Normative Premise:** Because of $I$, the subject in State B is not epistemically blameworthy for believing as they do. ($I \rightarrow$ Exculpation)
  2.  **Ontological Premise:** Because of $I$, it does *not* follow that State A and State B share a common mental constituent. ($I \nrightarrow$ Common Kind)
  3.  **The Warrant:** The distinction between the *Order of Knowing* (how it seems) and the *Order of Being* (what it is).

  #### B. When is it Legitimate? (The Externalist Carve)
  The asymmetry is **not** inherently fallacious. It is a consistent consequence of **Epistemic Externalism** combined with **Naïve Realism**.

  *   **Legitimacy Condition:** The move is legitimate if one holds that the *nature* of a mental state is constitutively determined by external factors (the world), while the *justification* for holding it is determined by internal access.
  *   **Why it holds:** On this view, "what it is" depends on the object perceived. "Whether I am blameless" depends on what is accessible to me. Since the external world fixes the ontology but not the access, the asymmetry is a feature of reality, not a bug in the argument.
  *   **Example:** A broken clock that stops at 12:00. You look at it at 12:00.
      *   *Ontology:* Your belief is not knowledge (the mechanism is broken).
      *   *Exculpation:* You are not irrational (it looks like a working clock).
      *   Here, the indistinguishability (from a working clock) exculpates you but does not make the belief "knowledge." This is widely accepted.

  #### C. When is it Fallacious? (The Internalist Carve)
  The move becomes a form of **Special Pleading** (or **Motivated Inconsistency**) when it is used to block inquiries into the nature of *evidence* while simultaneously relying on that evidence to exculpate.

  *   **Fallacy Condition:** The move is fallacious if the theorist claims that the subject's *evidence* is exhausted by what is internally accessible, yet denies that indistinguishable states share the same evidence.
  *   **The Contradiction:** If indistinguishability is strong enough to fix the subject's rational standing (exculpation), it implies the subject is operating on the same *reasons*. If they are operating on the same *reasons*, but the theorist denies they have the same *evidence* (ontologically), the theorist is severing the link between "reasons for which one believes" and "evidence one possesses."
  *   **The "Evidence" Boundary:** This is the critical boundary you asked about.
      *   If "Evidence" = "What is internally accessible," the Asymmetry is **inconsistent**. (You can't say access fixes blame but doesn't fix evidence).
      *   If "Evidence" = "Factive reasons (truths)," the Asymmetry is **consistent**. (You can't have false facts as evidence, so the hallucinator has no evidence, yet is blameless).

  #### D. The Boundary of Principle vs. Practice
  You asked whether the move changes character if the cases are impossible to distinguish *in principle* rather than *in practice*.

  *   **In Practice:** If they are distinguishable by a god's-eye view but not by humans, the Exculpatory-Ontological Asymmetry is standard Externalism. (Legitimate).
  *   **In Principle:** If they are indistinguishable *in principle* (e.g., a perfect Cartesian demon scenario), maintaining the asymmetry requires a stronger commitment. It requires claiming that the *metaphysical nature* of your mind depends on things you could never, even ideally, detect.
  *   **The Risk:** At the limit of "in principle" indistinguishability, the Asymmetry risks becoming **Obscurantism**. It posits a difference in kind that makes no difference to the subject's life, reasoning, or cognitive processing, yet insists that difference is the most important thing about the state. This is where the "carving" feels like a dodge to many critics.

  ### 4. Summary of the Carving

  To properly isolate the phenomenon, you should distinguish three layers:

  1.  **The Phenomenon:** **The Exculpatory-Ontological Asymmetry.** (The selective weighting of indistinguishability).
  2.  **The Legitimate Form:** **Externalist Consistency.** (Ontology is world-involving; Exculpation is access-involving. No contradiction).
  3.  **The Fallacious Form:** **Evidential Special Pleading.** (Claiming indistinguishability fixes the subject's rational status *via* their evidence, while denying it fixes the evidence itself).

  **Recommendation for Usage:**
  If you encounter this in the wild, do not simply label it "inconsistent." Instead, test the boundary of **Evidence**. Ask: *"Does the indistinguishability fix the subject's evidence, or only their blamelessness?"*
  *   If they say it fixes **evidence**, they must accept the Common Kind (and abandon the asymmetry).
  *   If they say it fixes only **blamelessness**, they are committed to Externalism (and the asymmetry is legitimate, provided they accept Externalism).
  *   If they try to have it both ways (it fixes evidence for blame, but not for ontology), they are committing the **Exculpatory-Ontological Asymmetry** fallacy.

  This carving allows you to acknowledge that the move is sometimes philosophically robust (Externalism) without granting it a free pass when it is used to smuggle in inconsistent commitments about the nature of evidence.
