answer: |-
  **Final Exam: Autonomy and the Ethics of Influence**
  **Time:** 90 Minutes | **Marks:** 20 | **Open Book**

  **Question 1**
  Consider the following two cases:

  *   **The Adviser:** A financial adviser presents two funds. She favours one. She says nothing false, discourages no questions, and rushes no one. She presents the favoured fund first in concrete terms, and the other in abstract, true terms ("a different risk-return profile"), knowing the client will default to what he can picture. The client reasons about the information and endorses the choice afterwards.
  *   **The Uncheckable Premise:** A friend talks you out of a treatment using a valid argument built on a statistic you have no way to evaluate. He knows you cannot evaluate it and uses it for that reason. Nothing is hidden; the premise is on the table, but inaccessible.

  Write an essay addressing the following:
  1.  Analyze how the three standard accounts of manipulation (the bypassing account, the deception account, and the pressure account) classify these cases. Identify precisely where each account fails to match our intuition that these are manipulative.
  2.  Take the most promising account and propose a repair that handles both cases. Explain the cost of this repair: does it force you to appeal to a norm about what the target was *owed* rather than a fact about how the influence *worked*? What does this shift do to the theoretical approach?
  3.  Construct one counter-case where your repaired account yields the wrong verdict.

  *Note: Answers claiming "it is simply a spectrum" without structural analysis will receive zero marks.*

  ***

  **Model Answer**

  The standard triad of manipulation accounts—bypassing, deception, and pressure—struggles to capture the wrongful influence in the Adviser and Uncheckable Premise cases because all three rely on conditions absent in these scenarios.

  The deception account fails immediately. It defines manipulation as intentional influence via lies or withheld truths. In both cases, every statement made is technically true. The Adviser describes the second fund accurately, albeit abstractly; the Friend offers a real statistic. Since no falsehoods are uttered, the deception account must classify these as legitimate persuasion, contradicting the intuition that the influencers are exploiting informational asymmetries to rig the outcome.

  The pressure account fares no better. This view locates manipulation in threats or coercive offers that constrain the target's options. Neither the Adviser nor the Friend threatens the client or friend. The client remains free to choose the second fund; the patient remains free to seek treatment. Because the menu of options remains formally open, the pressure account cannot distinguish these cases from benign advice.

  The bypassing account is the strongest candidate but requires significant modification. Traditionally, this view holds that manipulation bypasses rational deliberation, whereas persuasion engages it. In both cases, however, the targets *do* reason. The client weighs the concrete against the abstract; the patient processes the valid argument. To classify these as manipulation, the bypassing account must stretch "bypassing" to mean "subverting the quality of deliberation" rather than avoiding it entirely. It must argue that presenting information in a way that exploits cognitive defaults (like concreteness bias) or epistemic helplessness counts as a failure of rational engagement.

  Repairing the bypassing account this way incurs a heavy theoretical cost. It shifts the definition from a descriptive psychological fact (was reason bypassed?) to a normative entitlement (was the target owed better conditions for reasoning?). We must claim the client was *owed* comparable concrete descriptions or that the patient was *owed* checkable premises. This transforms manipulation from a mechanism of influence into a violation of dialectical duty. The focus moves from what the influencer *did* to the mind, to what the target was *due* from the influencer.

  This normative shift creates vulnerability. Consider a counter-case: **The Negligent Doctor.** A doctor intends to persuade a patient to take a medicine. She owes the patient a statistic about side effects but forgets to mention it due to exhaustion, not strategic intent. The patient consents based on incomplete data. Under the repaired account, the patient was owed the information, and the condition for rational consent was violated. Thus, the account classifies this as manipulation. However, intuition suggests this is negligence, not manipulation, because the doctor lacked the intent to exploit the gap. The repaired account, by focusing on entitlements rather than psychological mechanism, struggles to distinguish between malicious rigging of reasoning and accidental failure to support it.

  Ultimately, saving the bypassing account requires admitting that manipulation is not merely about how autonomy is affected, but about the ethical obligations inherent in advisory relationships.

  ***

  **Marking Scheme**

  **Differentiation:** A First distinguishes itself by rigorously analyzing the *cost* of the repair (the shift from psychology to norms), whereas an Upper Second identifies the repair but treats the cost as a minor footnote.

  1.  **Failure of Deception/Pressure Accounts (4 marks)**
      *   *Must identify:* Both accounts fail because no lies were told and no threats were made, yet intuition says manipulation occurred.
      *   *Losing marks:* Candidates often spend too long defining pressure and fail to apply it specifically to the "no threats" constraint in the cases.

  2.  **Failure of Standard Bypassing Account (4 marks)**
      *   *Must identify:* The targets *did* reason (valid argument, understood words), so strict "bypassing" views must incorrectly classify these as persuasion.
      *   *Losing marks:* Candidates often assert reasoning was bypassed without explaining how the prompt's stipulation ("client understands every word") contradicts this.

  3.  **The Repair (4 marks)**
      *   *Must identify:* The repair involves redefining bypassing as "subverting rational quality" or exploiting cognitive biases/epistemic gaps rather than avoiding reason.
      *   *Losing marks:* Candidates propose a repair that simply adds "intent" without addressing the structural asymmetry in the cases.

  4.  **The Cost of the Repair (4 marks)**
      *   *Must identify:* The repair shifts the criterion from descriptive (how influence worked) to normative (what the target was owed/entitled to).
      *   *Losing marks:* Candidates mention the cost but fail to explain how this changes the theoretical approach from psychology to ethics.

  5.  **The Counter-Case (4 marks)**
      *   *Must identify:* A case where norms are violated (info withheld) but manipulation is absent (e.g., negligence/error), showing the repaired account is over-inclusive.
      *   *Losing marks:* Candidates provide a case that is clearly manipulative, failing to show the account gives the *wrong* verdict.

  Crux: The First recognizes that saving the bypassing account requires abandoning the attempt to define manipulation purely as a psychological mechanism.
