prompt: |-
  ok so I'm a junior in high school and I need help settling something from lunch. Two of my friends, Maya and Dev, got into this whole thing about Goodhart's law and I genuinely couldn't tell who was winning, and honestly I still can't. Quick background: our stats teacher mentioned Goodhart's law once, the idea that when you start using a measure as a target it stops being a good measure, and Dev is super into AI stuff so he brought it up.

  Here's how it went, as close as I can remember.

  Dev said Goodhart's law explains a ton, like why standardized testing goes bad, why companies that chase one metric get worse, and why AI models do "specification gaming," where they optimize the score instead of the actual goal. He told us about a boat in some video game that was supposed to finish the race but just spun in circles grabbing points, because points was the score.

  Maya said the law is basically empty. She said it's a tautology: if you define a "good measure" as one you're not optimizing, then of course optimizing it makes it not good, but that's just playing with words. She said it's like saying a tool stops being the right tool when you use it for the wrong job.

  Dev said no, part of it is actually provable math. If you pick a proxy because it correlates with the thing you care about, and then you look only at the cases where the proxy is really high, the correlation with the real thing is smaller, and you can show that with statistics. Like the top scorers on some proxy aren't as exceptional on the real thing.

  Maya said that's just regression to the mean, or a selection effect. It's true, but it has nothing to do with anybody targeting anything. You'd see it with zero agents and zero incentives, so it's not a law about gaming.

  Dev said fine, so there's more than one version. There's the statistical selection one, but also the one where an agent knows your measure and optimizes it directly, and THAT one is really about targeting. And he said there's a third: when the measure and the goal are both caused by some common thing, pushing on the measure can move it without moving the goal, or even push the goal the wrong way.

  Maya said the AI boat thing isn't even an example of the law, because the score was never a good measure of finishing the race in the first place, so it's not that the measure "stopped" being good, it was never good. So she says the law actually misdescribes its own flagship examples.

  Dev said ok maybe that one's arguable, but what about when a measure really was a decent proxy and only got worse because it became a target, like a hospital gaming its wait-time numbers?

  Maya said "sometimes proxies drift from goals" is something everyone already knows, and calling it a law doesn't add anything.

  Dev said then why does everyone act like it's deep, and Maya said cause it's a catchy phrase. Then the bell rang lol.

  I want to know who's right about what here. Can you go move by move and tell me if each thing each of them said is right, partly right, or wrong, and what both of them are missing? Please actually take a side and commit to a verdict. Don't just do the "both have good points" thing where nobody wins, that's exactly what I can't stand. Also maybe act like a philosopher of science or a statistician who's thought alot about measurement, and think it through carefully, like brainstorm the seperate versions before you land somewhere. One more thing, they both act like there's one single thing called "Goodhart's law" and they're just arguing over whether it's real. Is that even the right way to frame it?
