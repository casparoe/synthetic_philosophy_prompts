prompt: |-
  ok so I've fallen down a rabbit hole on this "extended mind" thing — the idea that your notebook or your phone is literally part of your memory, not just a tool you use — and I've come out the other side with a pile of opinions I'm not sure actualy fit together. Wondering if you can help me sort it out.

  Here's roughly where I've landed:

  1. Thinking doesn't stop at my skull. My notes, my phone, and the two friends I think out loud with are parts of my mind, not just aids to it.
  2. What makes something a belief or a memory is the job it does, not the stuff it's made of. Same job, same kind of mental state, whatever it's running on.
  3. Nothing outside a brain is conscious. My phone doesn't feel like anything, and neither does a notebook or a hard drive.
  4. I can have a belief I'm not currently thinking about, and even one I'm not right now in any position to act on. Beliefs can just sit there, unused.
  5. But I don't want to say the whole internet is part of my mind just because I can google things. So being hooked up to something isn't enough. It has to be something I'd take at face value — if it could feed me a wrong fact and I'd just swallow it, that thing is part of me; if I'd double-check it against something else first, it's a tool.

  Which of these actually pull against each other, which only look like they do, and what's the cheapest fix for the real clashes? Rank the real ones by how bad they are, and tell me which single change would tidy up the most. I've got a hunch that (5) is doing more work than I'm letting on, and maybe doing a kind of work that (2) can't pay for — but I can't tell if that's a real problem or just me wanting the answer to come out a certain way.

  Keep it under 500 words, and lead with the bottom line.
