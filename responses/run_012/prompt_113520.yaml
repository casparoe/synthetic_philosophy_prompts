      *   **Topic:** A qualified defense of Berkeley's Master Argument (*esse est percipi*).
      *   **Thesis:** The argument is valid but only works if "conceive" = "imagine." Ideas of sensible things require a perceptual standpoint. Supposition (propositional attitude without imagery) is distinct. Conclusion: Unperceived sensible things can't be *imagined*, but can be *supposed*. This is enough because the opponent (materialist/representationalist) is committed to meaning via ideas.
      *   **Audience:** 15 people, known factions:
          *   4 Early Modern Specialists (Historical fidelity).
          *   3 Analytic Metaphysicians (Conceivability/Possibility).
