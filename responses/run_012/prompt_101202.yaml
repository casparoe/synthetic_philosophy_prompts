      *   *Ideal Intervention:* Must change only the handle status without changing other causes of cholera (like air quality, direct contact) except through the water.
      *   *Distinction:* Can it distinguish handle from water? Yes, by intervening on the handle while keeping water contaminated (theoretically). Can it distinguish from sanitary conditions? Yes, by fixing sanitation but changing handle access.
