      *   Ensure the entomology angle is respected (Charlotte is an arachnid, flies are insects, but the distinction in the book is moral, not taxonomic).
      *   *Self-Correction on "Speciesism":* Technically, Charlotte is an arachnid, Wilbur and Fern are mammals. The book crosses the species barrier. But the *flies* are the victims. Make sure to distinguish between "speciesism against animals" and "hierarchy within animals."

  5.  **Final Review against Constraints:**
