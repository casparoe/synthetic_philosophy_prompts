          1.  Fund Ski Club (Trivial/Financial).
          2.  Out Maya as the whistleblower against the chem teacher (Harmful/Social).
          3.  Lie to the student body about the funding source (Dishonest/Structural).
      *   **The Friends' Debate:**
          *   *Jordan:* Utilitarian/Consequentialist. 300 kids > 1 friend's reputation. Guilt means you did wrong. If it's right, you shouldn't feel bad.
          *   *Sam:* Deontological/Virtue Ethics hybrid. You can do the "necessary" thing and it still be wrong/harmful. Guilt is the cost of moral injury. Feeling *no* guilt is dangerous.
      *   **User's Internal Question:** Is "getting hands dirty" part of leadership, or an excuse for bad behavior?

  2.  **Evaluate the Ethical Dimensions:**
      *   **Utilitarianism (The "Greater Good"):** 300 kids eating vs. Maya's social standing + one lie. On the surface, the math favors the breakfast. *However*, long-term consequences matter. If the lie is discovered, trust in the council evaporates. If Maya is ostracized, the harm could be severe (mental health, safety).
      *   **Deontology (Duty/Rules):** Lying is wrong. Betraying a friend's confidence is wrong. Sacrificing an individual for the group without consent is wrong.
      *   **Virtue Ethics (Character):** What kind of leader does this make you? What kind of precedent does it set?
      *   **Political/Leadership Reality:** Leadership *does* involve hard choices. But leadership also relies on *trust*. If the student body finds out you lied about the money, your presidency is over, and future initiatives will fail. If Maya finds out you sold her out, you've destroyed a personal relationship and potentially exposed her to retaliation.

  3.  **Address the Specific Questions:**
      *   *Should I do it?* (Need to weigh the costs carefully).
      *   *Is feeling bad part of doing it right?* (Address Jordan vs. Sam).
      *   *Is "dirty hands" real or an excuse?* (Address the leadership philosophy).

  4.  **Critique the "Deal":**
      *   **The Lie:** This is the biggest red flag. Lying about budget sources is fraud/misrepresentation. If found out, it undermines the *entire* council's credibility. Future voting, future funding, everything gets questioned.
      *   **The Betrayal:** Outting Maya. Whistleblowers need protection. If you punish the whistleblower, no one will ever report misconduct again. This creates a toxic school culture long-term.
      *   **The Ski Club:** This is a bribe. It sets a precedent that votes are for sale.
      *   **The Blackmail:** Devon is effectively blackmailing the council. Giving in sets a precedent that extortion works. Next semester, someone else will demand something else.

  5.  **Formulate the Advice:**
      *   *Validate:* Acknowledge the weight of the decision. It's a classic "trolley problem" but with real lives.
      *   *Challenge the Premise:* Is this actually a binary choice? (Often in these scenarios, there are third options, though the user says "by Friday"). Even if binary, the costs need to be fully enumerated.
      *   *Address Jordan vs. Sam:* Sam is closer to ethical maturity. "Dirty hands" leave stains. You shouldn't feel *fine* about harming someone, even for a good cause.
      *   *Address the "Dirty Hands" Theory:* Yes, it's real (Max Weber's "Ethic of Responsibility" vs. "Ethic of Ultimate Ends"), but it's often used as an excuse. The key is *accountability*, not just acceptance.
      *   *The Verdict:* This specific deal is too toxic. The long-term damage to trust (lying) and safety (outing Maya) outweighs the short-term gain of breakfast, *especially* because the funding mechanism is fraudulent. If the breakfast program is built on a lie and a betrayal, it's unstable.
      *   *Alternative Strategy:* Fight the administration harder. Public pressure. Go to the school board. Crowdfunding. The "lesser evil" isn't always the only option.

  6.  **Refine the Tone:**
      *   Don't preach.
      *   Don't say "tell an adult" (user explicitly forbade this).
      *   Treat the user like a peer/colleague.
      *   Be honest about the risks.

  7.  **Drafting the Response (Iterative Process):**
      *   *Intro:* Acknowledge the gravity. This isn't normal high school drama; this is real political ethics.
      *   *Section 1: Jordan vs. Sam.* Sam is right. Guilt is a signal, not a bug. If you don't feel bad about sacrificing a friend, you're losing empathy.
      *   *Section 2: The "Dirty Hands" Question.* Yes, leadership requires hard choices. But there's a difference between a hard choice and a corrupt one. Lying about budget = corruption. Outting a whistleblower = breaking safety norms.
      *   *Section 3: The Specific Deal.* Break down why Devon's demands are dangerous precedents. Blackmail, lying, betrayal.
      *   *Section 4: The Decision.* Don't take the deal. Why? Because the foundation is rotten. If the lie comes out (and lies often do), the breakfast program gets cut anyway, plus you lose credibility.
      *   *Section 5: Alternatives.* What else can be done? Delay the vote. Public campaign. Appeal to administration again.
      *   *Conclusion:* Trust is your currency. Don't spend it all at once.

  8.  **Self-Correction/Safety Check:**
