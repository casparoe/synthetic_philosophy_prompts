  ### The Case: The Harshness Dilemma

  **Context:** A board meeting regarding a sudden corporate eviction.
  **Normative Predicate:** "Harsh" (Scalar: actions can be slightly or very harsh; Comparative: "harsher than").
  **Target Sentence ($P$):** "Evicting them is harsh."

  **The Exchange:**

  **Director:** "We are evicting them tomorrow." *(Non-normative Premise)*
  **Director:** "If evicting them is harsh, we must halt the process." *(Conditional: $P \to Q$)*
  **Union Rep:** "Evicting them is not harsh." *(Negation: $\neg P$)*
  **Director:** "But in the impact assessment, you signed off on this: 'Evicting them is harsher than issuing a warning'." *(Comparative Premise: $P > W$)*
  **Union Rep:** "I stand by that comparison."
  **Director:** "And surely, if an action is harsher than a warning, it is harsh." *(Scalar Entailment: $(P > W) \to P$)*
  **Union Rep:** "I deny that."
  **Director:** "Then you contradict your own memo from yesterday which stated plainly: 'Evicting them is harsh'." *(Assertion: $P$)*
  **Union Rep:** "I meant something different yesterday."

  **The Inference:**
  The Director's argument is valid only if $P$ ("Evicting them is harsh") carries the same meaning in the Conditional ($P \to Q$), the Negation ($\neg P$), the Scalar Entailment ($(P > W) \to P$), and the Assertion ($P$). Specifically, the move from the Comparative ($P > W$) to the Positive ($P$) relies on the semantic structure of the scalar adjective. If $P$ in the conditional means something different than $P$ in the assertion, the scalar entailment fails to bridge the gap to the obligation ($Q$).

  ***

  ### Analysis

  **1. The Standard Attitude-Expressivist Position**
  An expressivist who identifies meaning with the expression of a pro- or con-attitude (e.g., disapproval) faces a tripartite fragmentation here:
  *   **In the Assertion ("Evicting them is harsh"):** The sentence expresses the Director's or Rep's *disapproval* of the eviction.
  *   **In the Negation ("Evicting them is not harsh"):** The sentence cannot express disapproval (since the Rep is denying the claim). Standard expressivism struggles to define what attitude is expressed here. Is it the absence of disapproval? Or disapproval of disapproving? Neither maps cleanly onto the logical negation required to block the Director's inference.
  *   **In the Conditional ("If evicting them is harsh..."):** The Director is not expressing disapproval. She is hypothesizing. If meaning is the attitude expressed, the sentence here is meaningless, or means something entirely different (e.g., a higher-order attitude about having the first attitude).

  **2. Why Scalar and Comparative Occurrences Resist the "Same Attitude, Different Mode" Reply**
  A common expressivist defense is that the *attitude* remains the same (disapproval), but the *mode* of expression changes (assertoric vs. hypothetical). The scalar nature of "harsh" breaks this defense.
  *   **The Problem of Degrees:** Attitudes like disapproval admit of intensity, but logical scales do not map perfectly onto psychological intensity. The inference relies on the semantic rule: *If X is F-er than Y, X is F.* This is a truth-conditional entailment regarding properties.
  *   **The Comparative Strain:** When the Rep says, "Evicting is harsher than warning," they are expressing a *stronger* disapproval of evicting than of warning. However, the Scalar Entailment step ("If harsher, then harsh") requires that the *property* of harshness is present. An expressivist must explain how a relation between two *intensities of attitude* logically entails the *presence of an attitude*. It is psychologically possible to regard X as "more tolerable" than Y without regarding X as "tolerable" (both might be intolerable). For the logic to hold, "harsh" must function as a property with a threshold, not merely a ranking of feelings. The "different mode" reply fails because the *content* of the attitude must be gradable in a way that supports truth-functional entailment, which raw feelings do not.

  **3. The Inferential-Role Expressivist**
  An expressivist who identifies meaning with *inferential role* (e.g., Robert Brandom or a sophisticated Simon Blackburn) fares better initially but relocates the difficulty.
  *   **The Gain:** They can say $P$ means the same thing in all positions because it plays the same role in the "game of giving and asking for reasons." It licenses the inference to $Q$, conflicts with $\neg P$, and is entailed by $P > W$.
  *   **The Relocation:** The difficulty shifts from semantics to *normative psychology*. Why do attitudes obey these inferential rules? If "Evicting is harsh" just expresses a feeling, why is it *incoherent* to feel that "Evicting is harsher than warning" but deny "Evicting is harsh"? The inferentialist must explain why the *norms of logic* apply to *states of mind* that are not truth-apt. They must show that the inconsistency is not merely psychological but *logical*, without appealing to truth conditions. This often requires positing a "logic of attitudes" that mirrors propositional logic so closely it becomes indistinguishable from realism, raising the question of why we needed expressivism in the first place.

  **4. The Single Feature Doing the Work**
  The feature doing the maximum strain is the **scalar entailment from comparative to positive** (i.e., the inference that *If X is F-er than Y, then X is F*).

  **5. What Happens If That Feature Is Dropped**
  If we drop the scalar requirement and use a flat predicate like "wrong" (where "wronger" is nonsensical or secondary), the case reverts to the standard Frege-Geach problem. The specific pressure regarding *degrees* of attitude vanishes. The expressivist only needs to explain how "wrong" functions in a conditional, not how a *scale* of disapproval maps onto a *scale* of properties to support a threshold entailment. The scalar constraint forces the expressivist to account for the *structure* of the normative property, not just its presence or absence.

  **6. The Strongest Line of Defence**
  The strongest defense is **Quasi-Realist Expressivism** (specifically Blackburn's approach). The expressivist argues that logic does not track truth conditions but rather the **consistency of commitments**.
  *   **Defense:** The validity of the argument is preserved because the *attitude* of accepting the premises while rejecting the conclusion is practically inconsistent. To accept "Evicting is harsher than warning" is to hold a commitment that normatively forces the commitment "Evicting is harsh." The "scalar entailment" is not a fact about the world, but a rule of the normative practice. The expressivist claims we can "earn the right" to talk of truth, properties, and entailment within the expressive framework. The meaning is stable because the *commitment profile* is stable across asserted, negated, and embedded contexts, even if no moral "fact" is being described.
