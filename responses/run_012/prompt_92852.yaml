answer: |-
  Dear Writer,

  It is a pleasure to meet a colleague who cares this much about the arithmetic of courage. Priya is right, and the tension you are feeling is not a contradiction in her logic but rather the central friction of risk theory itself. The two sentences she speaks describe two different ways of averaging reality. The first sentence describes the ensemble average, which is what happens if you look at a million parallel universes where your character makes the bet and averages the outcomes. The second sentence describes the time average, which is what happens to one person making the bet repeatedly over a lifetime. In physics terms, the system is non-ergodic, meaning the average across space is not the same as the average across time. To see this working in your novel without rigging the scene, we need to construct a scenario where the potential upside is large enough to tempt the expected-value mind, but the volatility is high enough to terrify the growth-optimal mind, specifically when the bet size is forced to be large.

  Let us give your character, let us call her Elena, a concrete stake. She is forty-eight and has saved four hundred thousand dollars over a lifetime of teaching and writing. This is her entire liquid net worth. The press is valued at exactly four hundred thousand dollars. The family offers her a deal based on the business's historical volatility. There is a fifty percent chance that the press finds a new niche and thrives, increasing its value by sixty percent within a year. There is a fifty percent chance that the market shifts and the press struggles, decreasing its value by fifty percent within a year. Crucially, in the bad outcome, the press does not go bankrupt. It shrinks, but it survives. If Elena buys the whole thing and the bad outcome occurs, she still owns a business worth two hundred thousand dollars. She is not wiped out, but she has lost half her life savings.

  Now consider Version One, where the family allows her to buy any slice of the press she can afford. She can buy five percent, or fifty percent, or any fraction in between. The expected-value rule, which Priya mentions first, looks at the arithmetic mean. If Elena invests one dollar, she has a fifty percent chance of getting one dollar and sixty cents back, and a fifty percent chance of getting fifty cents back. The average return is one dollar and five cents. Since the expected return is positive, the expected-value rule says she should invest. In fact, if she is purely risk-neutral, it says she should invest every cent she has because the average payoff is higher than the cost. The growth-optimal rule, or Kelly criterion, looks at the geometric mean, which dictates how wealth compounds over time. It asks what fraction of her capital maximizes the logarithm of her wealth. With these specific numbers, a sixty percent gain and a fifty percent loss, the math dictates that the optimal fraction to invest is roughly sixteen percent of her capital. If she invests sixteen percent, her wealth grows at the fastest possible sustainable rate. If she invests nothing, she stagnates. If she invests everything, she risks volatility drag. But in this version, because she is allowed to choose the slice, the growth rule says yes, play the game, just do not bet it all. The expected-value rule says yes, play the game, and bet it all. Both rules agree on the fundamental verdict: this is a worthwhile opportunity. Elena is not an idiot for participating; she is only potentially reckless about the size of her stake.

  Now consider Version Two, where the family refuses to split the shares. It is all or nothing. Elena must invest the full four hundred thousand dollars or walk away. The expected-value rule calculates the same arithmetic mean as before. The average outcome of investing four hundred thousand is four hundred and twenty thousand. Since four hundred and twenty thousand is greater than four hundred thousand, the expected-value rule still says yes. It argues that if you could make this deal a million times across parallel universes, you would be richer on average. However, the growth-optimal rule now faces a constraint it cannot optimize away. It cannot tell Elena to bet sixteen percent because the contract demands one hundred percent. It must evaluate the growth rate of a one hundred percent bet. When you lose fifty percent of your money, you need a one hundred percent gain just to get back to even. A sixty percent gain is not enough to offset a fifty percent loss over a sequence of bets. Mathematically, the product of the outcomes is less than one. If Elena makes this bet repeatedly, her wealth will trend toward zero even though the average wealth across all possibilities trends toward infinity. Because the required bet size exceeds the optimal fraction, the growth rule says no. Do not take this deal. Here, finally, is the divergence you need for your scene. Priya would say Elena is an idiot for taking the deal because she is betting too much of her bankroll relative to the edge she has. A defender of expected value would say Elena is brave because she is taking a positive gamble that offers a real chance at a life-changing sum.

  The feature doing the work here is the inability to resize the bet relative to the volatility. In Version One, Elena can dilute the volatility by buying a smaller slice, aligning the risk with her capital base. In Version Two, the volatility is forced upon her at full intensity. The line where the growth rule flips is determined by the relationship between the win magnitude and the loss magnitude. If the potential gain were eighty percent instead of sixty percent, with the same fifty percent loss probability, the optimal Kelly fraction would rise to one hundred percent. In that case, even the growth rule would tell her to go all-in. But with a sixty percent gain against a fifty percent loss, the drag of the loss is too heavy to carry at full weight. If that feature goes away, meaning if she can negotiate the stake size down, the growth rule flips back to yes. The conflict exists solely because the contract forces her to overbet.

  You asked for a defense of the rule that comes out worse, which in the context of long-term survival is the expected-value rule. A clever defender of expected value would argue that the growth rule assumes Elena plans to play this game forever, like a casino or an immortal investor. But Elena is forty-eight. She does not have infinite time to compound wealth. She has a specific goal, perhaps to secure a retirement fund of six hundred thousand dollars. If she follows the growth rule and buys only sixteen percent of the press, her upside is capped. Even if the press succeeds, she only makes a small profit on her total net worth. She might never reach her retirement goal. By going all-in, she accepts a higher risk of median failure in exchange for a fifty percent chance of immediate success. The expected-value defender would say that for a human with a finite horizon and a specific target, maximizing the probability of hitting that target sometimes requires violating the growth rule. They would argue that Priya is protecting Elena from ruin, but also protecting her from glory, and that sometimes a single big bet is the only rational choice for a person running out of time.

  Finally, you asked what happens if this offer comes back every spring for twenty years. In Version One, where she can choose her slice, the verdict does not change. She simply rebalances every year, investing sixteen percent of her new total. Both rules remain happy. Her wealth grows smoothly, and the expected value skyrockets. In Version Two, where she must go all-in or nothing every year, the verdicts also remain technically unchanged, but the consequences become catastrophic. The expected-value rule still says yes, because the arithmetic average of twenty years of these bets is astronomically high, driven by the vanishingly rare paths where she wins every single time. However, the growth rule still says no, and now the reason is visceral. If she plays for twenty years, the most likely outcome is that she wins about ten times and loses about ten times. Because a fifty percent loss requires a one hundred percent gain to recover, and she only gets a sixty percent gain, her capital will decay. After twenty years of alternating wins and losses, she would be left with roughly ten percent of her original capital. The repetition does not change the rules' verdicts, but it strips away the camouflage. It reveals that following the expected-value rule in an all-in scenario guarantees poverty for almost every real-world individual, while following the growth rule guarantees prosperity. This is the heart of Priya's argument: what happens to you as you go along is not the same thing as the average across all your copies, and your character is living in only one copy.

  I hope this gives you the scaffolding you need to build the scene without feeling like you are forcing the math to fit the drama. The tragedy of your character is not that she is gambling on a losing bet, but that she is gambling on a winning bet at the wrong size. That is a much more human error, and far more defensible in a novel.

  Warmly,

  A Friend
