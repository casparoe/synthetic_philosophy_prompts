  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Core Claim:* ADs constitute practical identity via public precommitment.
      *   *Mechanism:* Counterfactual ratification (Would the current self agree to be bound?).
      *   *Vulnerability 1 (Clinicians):* If the current self *wouldn't* agree (e.g., happy dementia), does the AD still bind? If yes, how is this different from tyranny? If no, isn't this just current autonomy?
      *   *Vulnerability 2 (Disability Advocates):* "Constituting identity" sounds like imposing an abstract narrative over lived experience. Who decides what the "practical identity" is? Isn't this just a fancy way of enforcing the past self's will?
      *   *Vulnerability 3 (Both):* The Counterfactual Ratification Test is epistemically impossible. We can't know what the incompetent self *would* think. It invites projection.
      *   *Vulnerability 4 (The "Hope Nobody Raises"):* The problem of *change of values* vs. *change of circumstance*. If the dementia patient is genuinely happy (new values), does the "constitutional" identity hold? Also, the administrative burden: How do clinicians apply "constitutional authority" in an emergency?

