      *   *Replies:* Must stick to the "Constitutional Authority" vs. "Occurrent Authority" distinction.

      *(Self-Correction during drafting)*: Make sure the "Constitutional Authority" concept is clear in the replies. It's about the *structure* of the agency, not the *content* of the moment.

      *Refining the "Hope Nobody Raises":* The most dangerous objection is one that exposes the thesis as a semantic shuffle. "Isn't 'Constitutional Authority' just 'Precedent Autonomy' with extra steps?" If the answer is yes, the thesis fails. I will frame this as the "Hope Nobody Raises" because it requires deep philosophical parsing that might bog down the room, but if a sharp philosopher-ethicist asks it, it's devastating. Or, better: "Who interprets the Constitution?" (The committee? The doctor?). Let's go with the Metaphysical one: "If the dementia patient is a different person, your 'constitution' applies to the wrong entity."

