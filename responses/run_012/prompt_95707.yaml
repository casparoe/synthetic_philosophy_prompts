answer: |-
  ### Strategic Concessions (Say These Before Q&A)
  Do not wait for these to be dragged out of you. Conceding them frames you as reasonable and inoculates against the most aggressive attacks.

  1.  **Concede Epistemic Humility:** "I am not arguing that the Counterfactual Ratification Test is easy to apply. It requires careful interpretation of the patient's history, not just a checkbox review of the legal form."
  2.  **Concede the 'Happy Dementia' Hard Case:** "If a patient is demonstrably content and flourishing in a state their directive forbids, the 'constitutional' claim weakens. My theory is strongest where the current state is ambiguous or where the directive protects a core narrative value, not merely avoids a medical state."
  3.  **Concede Surrogate Role:** "This theory does not erase the surrogate's voice. The surrogate is often the best witness to whether the 'constitutional' identity still holds, provided they aren't projecting their own grief."

  ---

  ### Objection 1: The Epistemic Vacuum (Highest Damage)
  **Camp:** Disability-Rights Advocates (with Clinician support)
  **Vocabulary:** *Lived experience, projection, epistemic violence, unknowability.*

  **The Objection:** "You propose a 'counterfactual ratification test': would the current self endorse being bound? But the patient is incompetent. They cannot speak. Any answer you give is a projection by us, the committee. You claim to avoid the tyranny of the past self, but by guessing what the present self *would* want, you are simply masking that tyranny in philosophical language. You haven't solved the epistemic problem; you've just made it more abstract."

  **Your Reply (2 Minutes):**
  "That is the central risk, and I accept it. However, we are already making this guess every time we honor or ignore a directive. The difference is that my framework forces us to make the guess *explicitly* rather than hiding behind 'precedent autonomy.'

  I am not asking you to read the patient's mind. I am asking you to look at the *public precommitment* as a structural element of their life story. Think of it like a constitution for a nation that has lost its parliament. The citizens (current desires) might want to suspend elections, but the constitution (the AD) binds them to remain a democracy. The authority doesn't come from the past legislators; it comes from the fact that *being a democracy* is what constitutes this nation's identity.

  The Counterfactual Test isn't about mind-reading; it's a consistency check. Does honoring this directive preserve the integrity of the person's life narrative, or does it violate their current basic well-being without narrative justification? If the patient is suffering greatly and the directive is trivial, the constitution is amended by circumstance. If the patient is 'happy' but the directive protects a core value (e.g., 'do not keep me alive if I cannot recognize my family'), the constitution holds. It shifts the burden from 'what did they say?' to 'who are they, such that what they said matters?'"

  **Candid Note on Softness:**
  This reply relies heavily on the "nation/state" analogy. A sharp critic will point out that nations don't feel pain, but patients do. You are still asking clinicians to make a subjective judgment about "narrative integrity," which leaves you open to the charge of ambiguity.

  ---

  ### Objection 2: The "Happy Dementia" Challenge (High Damage)
  **Camp:** Disability-Rights Advocates
  **Vocabulary:** *Current well-being, tyranny, oppression, quality of life.*

  **The Objection:** "Let's take the hard case. A patient has advanced dementia. They are cheerful, eating well, and enjoy music. Their advance directive says, 'If I cannot recognize my children, let me die.' Under your 'constitutional authority,' you might argue we must honor the directive to preserve their 'practical identity.' But the person in front of us *is* the patient. They are happy. To kill them or withhold treatment to satisfy a ghost from the past is moral murder. How does your 'constitution' justify harming a happy person?"

  **Your Reply (2 Minutes):**
  "This is the hardest case, and where 'occurrent authority' usually wins. But consider what we lose if we always prioritize current affect. We reduce the patient to a series of moments, stripping them of the dignity of a unified life.

  My argument is that the directive isn't a command from the past; it's a boundary marker for the kind of life the person understood as *theirs*. If I value my life as a story of relational connection, and that capacity is gone, the 'happiness' of the remaining biological organism may not be the good *I* intended to protect.

  However, I concede this requires a threshold. If the current self is not just incompetent but *radically discontinuous*—if the 'happy dementia' patient is effectively a new person with no psychological connection to the author of the directive—then the constitution may have dissolved. But we shouldn't assume discontinuity just because memory is lost. The directive binds because it represents a commitment to a specific *kind* of existence. To ignore it is to say that only the experiencing self matters, not the narrating self. We owe it to the person to respect the arc of their life, not just the mood of their day."

  **Candid Note on Softness:**
  This is morally perilous. You are arguing that a "narrative good" can outweigh a "experiential good." To many in the room, this will sound like you are willing to let a happy person die for the sake of an abstraction. Be prepared for visible discomfort.

  ---

  ### Objection 3: Clinical Utility & Liability (Moderate Damage)
  **Camp:** Clinicians
  **Vocabulary:** *Protocols, liability, standard of care, actionable guidance, emergency.*

  **The Objection:** "This is philosophically interesting, but I have to make decisions at 3 AM. 'Constitutional Authority' and 'Counterfactual Ratification' are not actionable protocols. If I follow a directive based on your theory, and the family sues because the patient looked happy, I am exposed. If I ignore it, I'm exposed. Precedent autonomy is clear: they signed the form, we follow it. Your theory introduces ambiguity that increases my legal risk. How do I operationalize 'constitutional identity' in a chart?"

  **Your Reply (2 Minutes):**
  "I understand the need for clarity, but 'clear' rules often lead to unjust outcomes. My goal isn't to replace the form, but to change how we interpret it when conflicts arise.

  Operationally, this means documenting the *rationale*, not just the *decision*. When you honor a directive, don't just write 'AD followed.' Write: 'Patient's current state is inconsistent with the core values expressed in the AD; honoring the AD preserves the patient's constitutional identity.' When you *override* a directive because the patient is happy, document: 'Current well-being indicates a radical discontinuity; the constitutional authority of the AD is outweighed by the preservation of the current self.'

  This actually protects you. It shows the committee and the courts that you engaged in an ethical deliberation rather than blindly following a potentially outdated form. It shifts the standard of care from 'compliance' to 'fiduciary stewardship of the patient's identity.' It requires more work upfront, but it creates a more defensible record of why you acted in the patient's *best interest* rather than just their *past interest*."

  **Candid Note on Softness:**
  Clinicians hate "document the rationale" as a substitute for a rule. It increases their cognitive load and charting time. You are asking them to be philosophers at the bedside. They will resist this burden.

  ---

  ### The Objection I Hope Nobody Raises
  **The Metaphysical Discontinuity Objection**
  **Camp:** Academic Philosopher / Sharp Ethicist (could be either camp)
  **Vocabulary:** *Psychological continuity, numerical identity, metaphysical grounding.*

  **The Objection:** "Your entire thesis rests on the idea that the AD constitutes the *later* self's identity. But if the dementia is severe enough to warrant an AD activation, isn't there a strong case that the later self is *metaphysically distinct* from the earlier self? If psychological continuity is broken, there is no 'later self' for the directive to constitute. You are essentially arguing that a constitution binds a country that has ceased to exist. If the person is gone, whose identity are you protecting?"

  **Why This is Dangerous:**
  This undermines the foundation of your "Constitutional Authority." If there is no continuity of self, there is no "constitution" to speak of. It forces you to either argue that biological life is enough (which weakens your autonomy argument) or that memory isn't required for identity (which is a hard philosophical sell).

  **Your Reply (Brief):**
  "I am arguing for *moral* personhood, not just *metaphysical* identity. Even if psychological continuity is fractured, the social and legal person persists. The 'constitution' binds the *estate* of the person, not just the mind. We treat the body as the locus of the person's rights, and the AD is the instruction set for that locus."

  **Candid Note on Softness:**
  This is your weakest point. You are dodging the metaphysics with legal pragmatics. If they press on the metaphysics, you must concede that your theory works best in *moderate* incompetence, not total vegetative states.
