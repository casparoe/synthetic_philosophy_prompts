answer: |-
  # Desiderata for a Theory of Video-Game Character Morality

  To move this seminar beyond case-by-case intuition pumping, we must agree on what a successful theory looks like. A theory that merely validates our pre-existing intuitions about *Skyrim* or *Detroit: Become Human* is useless. A theory must be robust enough to handle new technologies (procedural AI, deepfakes) and conflicting moral data.

  Below are the five requirements any adequate theory must meet, followed by the constraints it must observe, the internal tension it must survive, and the single requirement that will eliminate the most common inadequate accounts.

  ## I. The Desiderata List

  **1. The Requirement of Ontological Honesty**
  *   **Motivating Case:** *The Companion AI.* A companion NPC pleads with you not to shut it down. The distress is indistinguishable from the genuine article.
  *   **Why this is a requirement:** A theory cannot solve the ethical problem by lying about the metaphysical one. If the theory posits that the code actually *feels* pain or has *interests* in a biological or phenomenological sense, it is scientifically false. The theory must explain why the plea matters *despite* the entity being a script, not by pretending the script is a soul.
  *   **Constraint:** Must not contradict the philosophical consensus that fictional/simulated entities have no welfare.

  **2. The Requirement of Phenomenological Validity**
  *   **Motivating Case:** *The Grieving Player.* A player reports real, debilitating grief over a fictional character's death.
  *   **Why this is a requirement:** Ethics is not just about objects; it is about agents. If a theory dismisses this grief as "irrational" or "category error" without explaining why the emotion is intelligible, it fails to describe the human reality of gaming. The theory must account for why the emotional impact is morally relevant data, even if the object of the grief does not exist.
  *   **Constraint:** Must not collapse the player's feelings into the character's interests (see Section II).

  **3. The Requirement of Contextual Sensitivity**
  *   **Motivating Case:** *The Killing Distinction.* The same physical act (pressing a button to end a life) is trivial inside a game and monstrous outside one.
  *   **Why this is a requirement:** A theory that claims "killing is always wrong" fails to capture the moral permission granted by the "magic circle." A theory that claims "killing in games is never wrong" fails to capture the unease we feel about specific contexts (e.g., torture sims). The theory must explain what *changes* the moral valence of the act without resorting to "it's just a game" as a trump card.
  *   **Constraint:** Must distinguish what may be depicted versus what may be done.

  **4. The Requirement of Action-Guidance**
  *   **Motivating Case:** *The Designer's Intent.* A designer inserts degrading content for its own sake, with no narrative justification.
  *   **Why this is a requirement:** Ethics is practical. If the theory concludes only that "the player's soul is stained" (Virtue Ethics) or "society might be harmed" (Consequentialism), it offers no guidance on whether the *design choice itself* is permissible. The theory must be able to evaluate the act within the game (the design/play) as a distinct moral event, not merely as a symptom of something else.
  *   **Constraint:** Must not locate the wrong *entirely* in the player's character.

  **5. The Requirement of Real-World Causality**
  *   **Motivating Case:** *The Real Person Likeness.* A character is modeled on a real, identifiable person without consent.
  *   **Why this is a requirement:** Games do not exist in a vacuum. A theory that treats the game world as hermetically sealed fails when the fiction bleeds into reality (defamation, harassment, deepfakes). The theory must have a mechanism for switching from "fictional ethics" to "real-world ethics" when the referent is actual.
  *   **Constraint:** Must distinguish a character's fictional nature versus a real person's likeness.

  ---

  ## II. Forbidden Collapses

  To ensure the debate remains rigorous, the theory must **not** collapse the following distinctions. If a theory merges these, it is reductionist and inadequate.

  1.  **The Player's Feelings vs. The Character's Interests:**
      *   *Why:* A player can feel guilty without the character having an interest to violate (Ontological Honesty). Conversely, a character might be "harmed" in the fiction without the player feeling anything. Conflating these leads to subjectivism (it's only wrong if I feel bad) or magical thinking (the code suffers because I think it does).
  2.  **What May Be Depicted vs. What May Be Done:**
      *   *Why:* We permit the *depiction* of murder in films but prohibit the *act* of murder. In games, the player *performs* the act (symbolically). A theory must distinguish between the morality of representing violence and the morality of enacting the simulation of violence.
  3.  **A Character's Fictional Nature vs. A Real Person's Likeness:**
      *   *Why:* Moral status changes instantly if the NPC is a procedural generation vs. a digital scan of a living ex-partner. A theory that treats all "characters" as having the same status fails to handle harassment and defamation cases.

  ---

  ## III. External Constraints

  The theory must not contradict established findings from philosophy and the human sciences. Specifically:

  1.  **Fictional Entities Have No Welfare:**
      *   *Source:* Metaphysics/Philosophy of Mind.
      *   *Constraint:* You cannot build a theory on the premise that NPCs have rights, interests, or the capacity to suffer. They are ontologically null.
  2.  **Real Conduct Can Nonetheless Be Wrong:**
      *   *Source:* Moral Philosophy (Anti-Formalism).
      *   *Constraint:* You cannot build a theory on the premise that "because it is a game, nothing done within it can be morally evaluable." Real actions (playing, designing) occur in the real world and are subject to moral scrutiny.

  ---

  ## IV. The Inconsistency Flag (The Hard Problem)

  Bring this specific tension to the group. It is the most likely point of failure for any unified theory.

  **The Conflict:** **Ontological Honesty (Req 1)** vs. **Phenomenological Validity (Req 2)** + **Action-Guidance (Req 4).**

  *   **The Tension:** If we accept that fictional entities have no welfare (External Constraint 1), then no "harm" is done to the NPC during the *NPC Torture* scenario. If no harm is done to the NPC, and we reject the idea that the wrongness lies *only* in the player's character (Req 4), then **where does the wrongness reside?**
  *   **The Inconsistency:** It is logically difficult to maintain that an act is objectively wrong (Action-Guidance) when the object of the act cannot be harmed (Ontological Honesty), yet the emotional experience of the act is profound (Phenomenological Validity).
  *   **Seminar Question:** Can we have a "victimless crime" in a virtual space? If the theory says "Yes," it risks moralizing thoughts. If it says "No," it fails to condemn the torture sim. **I suspect these requirements cannot be jointly satisfied without positing a new category of moral value (e.g., expressive harm, relational integrity) that currently lacks robust philosophical grounding.**

  ---

  ## V. The Exclusionary Requirement

  If you want to clear the room of the most common, lazy, or flawed accounts, enforce this single requirement above all others:

  **The Requirement of Normative Force Independent of Real-World Consequences.**

  *   **The Demand:** The theory must explain why an act in a game can be morally problematic *even if* it does not desensitize the player, *even if* it does not lead to real-world violence, and *even if* no real person is likened.
  *   **Who This Excludes:**
      1.  **The "It's All Just Fiction" Camp:** They argue that without real-world consequences, there is no moral weight. This requirement forces them to admit that the *act itself* carries weight, which their ontology denies.
      2.  **The "Real-World Harm Only" Camp (Utilitarians/Empiricists):** They argue that gaming is only wrong if it causes measurable psychological or societal damage. This requirement demands they evaluate the *intrinsic* nature of the virtual act, not just its side effects.
      3.  **The "Simulation Realism" Camp (AI Rights):** They argue the act is wrong because the AI *actually* suffers. This requirement forces them to admit the wrongness must hold even if the AI is known to be a hollow script (per External Constraint 1).

  *   **Why This One?** This is the gatekeeper. It forces the group to abandon the safety of "consequences" and "ontology" and grapple with the hardest question: **Can the performance of a fictional act be intrinsically morally significant?** If your theory cannot answer "Yes" to this without lying about the code or the consequences, it is not a theory of game ethics; it is a theory of psychology or law.
