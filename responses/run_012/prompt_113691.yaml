answer: |-
  This is an exceptionally sharp set of questions. You have identified the exact friction point where Western intuitions about the "self" collide with Confucian role ethics. Your suspicion is correct: the claim that "persons are constituted by roles" is often presented as a single block, but it relies on three distinct layers of assertion.

  To untangle this, we need to separate what the tradition *says* from what it *needs* to function, and then address your specific puzzle about sincerity and ritual.

  ### Part 1: Separating the Readings

  Let's break down the claim "a person is made out of their roles" into three distinct philosophical categories.

  **1. The Metaphysical Reading**
  *   **The Claim:** There is no ontological "soul" or atomic self that exists prior to or independent of relationships. To be a human is to be a node in a network. If you strip away the roles, you do not find a "real self"; you find nothing.
  *   **Does Confucianism need this?** **No.**
      While some modern interpreters (like Roger Ames) push this hard, the classical texts (*Analects*, *Mencius*, *Xunzi*) are largely agnostic about metaphysics. Confucius famously refused to speculate on death or spirits. The tradition does not require you to deny the existence of a private inner life or a soul. It only requires you to deny that the private self is the *source of moral value*. You can believe you have a private soul, but if that soul is not expressed through roles, it is morally irrelevant.

  **2. The Psychological Reading**
  *   **The Claim:** Our cognitive habits, emotional responses, and even our perception of the world are causally formed by our socialization into roles. We learn to see "suffering" through the role of the caregiver; we learn to see "respect" through the role of the junior.
  *   **Does Confucianism need this?** **Yes, but as a mechanism, not a definition.**
      This is the engine of cultivation. It explains *how* change happens. If roles didn't shape psychology, ritual practice would be useless. However, this reading alone leads to your "performer" worry. If I am just a bundle of conditioned habits, am I not just a biological robot trained to mimic humanity? Psychology explains the *process*, but not the *point*.

  **3. The Moral Reading**
  *   **The Claim:** Moral worth is not a property of an individual in isolation; it is a property of relationships. You cannot be "good" simpliciter; you can only be a good father, a good friend, a good ruler. Therefore, the "self" that matters ethically is the sum of these relational trajectories.
  *   **Does Confucianism need this?** **Yes. This is the core.**
      This is the claim doing the heavy lifting. The tradition is not trying to tell you what you *are* (metaphysics) so much as where you *stand* (ethics). To ask "Who am I really, beneath my roles?" is, from a Confucian view, a category error. It is like asking, "What is a chess piece really, beneath its rules of movement?" A knight *is* its movement. If it doesn't move like a knight, it isn't a knight.

  **Summary of Part 1:**
  The account genuinely needs the **Moral Reading**, supported by the **Psychological Reading**. It does not need the strong Metaphysical Reading. You do not have to believe you have no inner life; you only have to believe that your inner life is not the place where moral truth is found. Moral truth is found in the *fit* between you and your roles.

  ### Part 2: The Performer Objection

  You ask: *If I practice the gestures until I feel them, what distinguishes me from a well-trained performer?*

  The distinction lies in the **direction of fit** and the **goal of the performance**.

  1.  **The Actor:** The actor's goal is to convince an *audience*. There is always a distance between the actor and the role. The actor thinks, "I am pretending to be sad." The success condition is external (did the audience cry?).
  2.  **The Confucian Practitioner:** The goal is to transform the *self*. There is no audience other than the relationship itself. The practitioner thinks, "I am acting *as if* I am respectful until I *am* respectful." The success condition is internal integration (is there friction between my intent and my action?).

  The performer wears the costume; the Confucian grows the skin.

  This leads to your second, deeper puzzle about ritual and sincerity.

  ### Part 3: Solving the Paradox of Sincerity

  You identified the tension perfectly:
  1.  **Thesis:** Ritual without sincerity is empty (a sham).
  2.  **Antithesis:** Sincerity is cultivated by practicing ritual (you don't start with it).

  If sincerity is required to make ritual valid, but ritual is required to create sincerity, how do you start? And if you start by "faking it," aren't you just a performer?

  To resolve this, we must change your definition of **Sincerity (*Cheng* 誠)**.

  In the Western Romantic tradition, sincerity is usually understood as **expressive authenticity**: "I look inside, find a pre-existing emotion, and express it outwardly." If this is your definition, Confucianism makes no sense. You cannot express what isn't there.

  In the Confucian tradition, sincerity is **integrative wholeness**. It is not the *cause* of the action; it is the *quality* of the action.

  Here is what must be true of sincerity for the two halves of ritual to hold together:

  **1. Sincerity is not the "Raw Material"**
  You noted that sincerity cannot be the raw material the roles work on. You are correct. You do not need to "feel" filial piety to begin acting filially. If you wait to feel it, you will never act.
  *   *Correction:* Sincerity is not the fuel; it is the frictionless alignment of the engine. At the start, you act with "focused attention." You pay attention to the form because you trust the form.

  **2. Sincerity is not the "Residue"**
  You noted sincerity cannot be merely the residue of performing well. If it were just a habit, you would be a robot.
  *   *Correction:* Sincerity is the **collapse of the distinction between means and ends**.
      *   In the beginning, the ritual is a *means* to cultivate feeling. (I bow to become humble).
      *   In the end, the ritual *is* the feeling. (My bowing *is* my humility).
      *   Sincerity is the moment when you stop asking, "Do I really feel this?" because the question no longer arises. The action flows without hesitation or self-monitoring.

  **3. The "As-If" Bridge**
  The tradition acknowledges you must start by acting "as-if." But this is not lying. It is a form of **self-prophecy**.
  When you perform the role of a mourner correctly, you are not pretending to be sad. You are providing the physical architecture for sadness to inhabit. Grief is chaotic; ritual gives grief a shape. By adopting the shape, you allow the emotion to cohere.
  *   *The Performer* uses the shape to hide the lack of emotion.
  *   *The Practitioner* uses the shape to invite the emotion.

  **The Resolution:**
  For the two halves to hold together, sincerity must be understood as **wholeheartedness in the process**, not accuracy of the pre-existing sentiment.

  *   **Empty Ritual** is when you go through the motions while mentally checking out, resisting the role, or using the role to manipulate others. (There is a split between self and action).
  *   **Cultivated Sincerity** is when you go through the motions with total attention, allowing the role to reshape your desires. (There is a unification of self and action).

  ### Conclusion

  To answer your specific difficulty: The claim that persons are constituted by roles commits you primarily to the **Moral Reading** (value exists in relationships) and the **Psychological Reading** (habits shape the mind). It does not commit you to denying a private self metaphysically.

  The distinction between a person and a performer is not that the person "feels it first." It is that the person uses the performance to **eliminate the gap** between the self and the role, whereas the performer maintains that gap to protect the self from the role.

  Sincerity, therefore, is neither the seed nor the fruit. It is the **soil**. It is the quality of attention you bring to the ritual that allows the ritual to take root. You begin with the *will* to be sincere (to align yourself with the role), and through the practice, that will transforms into a *nature* that no longer needs to try. The "fake" feeling becomes real not because you tricked yourself, but because you gave the feeling a structure in which it could survive and grow.
