answer: |-
  This is a precise and philosophically sensitive reading of the Scholium. You are right to distinguish between the *phenomenological evidence* (the shape of the water), the *diagnostic claim* (this indicates absolute rotation), and the *ontological commitment* (therefore, Absolute Space exists). Too many commentaries conflate these, attributing to the bucket argument a power to prove substantivalism that it does not logically possess on its own.

  Here is an account of the argument's actual reach, keeping your two concerns distinct, with a verdict on what the text as written can bear.

  ### 1. Causality, "Communication," and Circularity

  Your first concern is whether the phrase "communicating its motion" smuggles in the very notion of absolute motion the argument is supposed to establish, thereby rendering the inference circular.

  **The Textual Role of "Communication"**
  In the passage you quoted, the description of the vessel "communicating its motion to the water" serves as a *narrative setup*, not the *evidential premise*. The evidence Newton relies on is the **shape of the surface** (flat vs. concave). The "communication" is merely the description of the transition between states (friction causing the water to speed up).

  **Is it Circular?**
  Strictly speaking, no, provided we distinguish between *kinematic description* and *dynamical explanation*.
  *   **Kinematically:** "Communicating motion" can be read neutrally as "causing the water to change its velocity relative to the laboratory." This does not presuppose absolute space; it only presupposes that the water's speed changes.
  *   **Dynamically:** Newton believes that what is being communicated is a tendency to recede from the axis (centrifugal force).

  The argument is not circular because the conclusion (absolute motion exists) is not derived from the *mechanism of transfer* (friction/communication), but from the **correlation between dynamical effects and kinematic states.**

  Newton's logic is:
  1.  Dynamical effects (concavity/centrifugal force) are present in State B (water spinning, vessel spinning) and State C (water spinning, vessel stopped).
  2.  Dynamical effects are absent in State A (water still, vessel spinning).
  3.  Relative motion between water and vessel is present in A and C, but absent in B.
  4.  Therefore, the dynamical effects do not track relative motion between water and vessel.
  5.  Therefore, the dynamical effects track a different kind of motion ("true" motion).

  **Verdict on Claim 1:**
  The passage does not presuppose a prior definition of absolute motion in its description of the "communication." It presupposes a **dynamical premise**: that forces (specifically inertial forces like the endeavor to recede) are real indicators of a physical state. The argument is not circular, but it is **not purely kinematic**. It relies on the premise that *forces indicate true motion*. If one denies that inertial forces are real (e.g., if one treats them as mere fictions of a reference frame), the argument loses its grip. Thus, the text establishes that *if* you accept inertial forces as real physical indicators, *then* you must accept a notion of motion that exceeds relative motion to local bodies.

  ### 2. Substantivalism vs. Privileged Rotation

  Your second concern is the ontological reach: Does this prove Space is a container (Substantivalism), or merely that rotation is a privileged physical state (Non-Relational Rotation)?

  **What the Text Establishes: Privileged Rotation**
  The bucket argument successfully demonstrates that rotational motion is **non-relational with respect to local bodies**. The water "knows" it is spinning without looking at the bucket. This establishes that there is a physically privileged distinction between rotating and non-rotating states that cannot be reduced to the relation between the water and the vessel.

  This supports the claim that **absolute acceleration (rotation)** is physically real. It does *not* support the claim that **absolute velocity** is physically real. Newton acknowledges elsewhere (Galilean relativity) that uniform linear motion produces no internal dynamical effects. The bucket is silent on linear motion; it speaks only to acceleration.

  **What the Text Does Not Establish: Substantivalism**
  To move from "rotation is privileged" to "Absolute Space is a substance/container" requires an extra metaphysical step. The experiment shows that the water rotates relative to *something* that is not the bucket. Newton identifies this *something* as Absolute Space. However, the empirical data is compatible with other explanations that do not require a "container."

  For example, the data is compatible with the claim that rotation is relative to the **fixed stars** (the bulk mass of the universe), even if that relation is not immediately obvious in the lab. The text says the motion is "absolute," but the *evidence* only shows it is "not relative to the bucket."

  **Verdict on Claim 2:**
  The passage as written supports **Privileged Rotation** (the physical reality of non-relational inertial effects) but falls short of proving **Substantivalism** (the existence of space as an entity).
  *   It proves: There is a fact of the matter about whether the water is rotating that is independent of the vessel.
  *   It does not prove: That this fact is grounded in a relation to a substance called "Space" rather than a relation to the global distribution of mass (Mach's principle) or a primitive property of the object itself.
  *   It definitely does not prove: Absolute Velocity.

  ### 3. The Relationist Obligation and the Empty Universe

  If the argument falls short of full substantivalism, what is a relationist who grants the phenomenon (the concavity) still obliged to explain? And how does the "Empty Universe" scenario test the text?

  **The Relationist Obligation**
  A relationist (like Mach or a modern structuralist) who accepts the water becomes concave must explain **what the water is rotating relative to.**
  *   **Newton's Answer:** Relative to Absolute Space.
  *   **Relationist Answer:** Relative to the inertial frame determined by the distant masses of the universe (the fixed stars).

  The relationist is obliged to provide an account of **inertia** that does not invoke a container. They must explain why the "communication of motion" from the vessel generates concavity only when the water acquires a specific status relative to the cosmic background, not just relative to the vessel. They must treat inertia not as an intrinsic property of matter in space, but as an interaction between matter and the rest of the universe.

  **The Empty Universe Test**
  You asked if anything in the passage would have to be rethought if the vessel and water were the only two things in the universe.

  *   **Newton's Text:** Yes, the text implies the effect would remain. Newton writes that the "endeavor to recede from the axis" indicates "true absolute circular motion." For Newton, Absolute Space exists even if empty. Therefore, in a universe with only a bucket, if the bucket spins relative to Absolute Space, the water should become concave. The text treats the "endeavor" as intrinsic to the state of the water's absolute motion.
  *   **Relationist Requirement:** Yes, the passage must be rethought. For a strict relationist, if there are no other bodies, there is no rotation. Without the "fixed stars" to provide an inertial frame, the distinction between spinning and not spinning vanishes. In an empty universe, the water would *not* become concave, because there is nothing for it to rotate against.

  **Verdict on the Empty Universe:**
  The passage *as written* assumes the effect is intrinsic to the water's absolute state. Therefore, it implies the concavity would persist in an empty universe. A relationist must deny this implication. Consequently, the passage cannot be used to *refute* relationism definitively, because the relationist can simply deny the counterfactual: "If there were no stars, there would be no concavity." Newton asserts there would be; the experiment described cannot decide between them because we cannot empty the universe to test it.

  ### Summary of the Argument's Reach

  1.  **On Circularity:** The argument is not circular regarding the "communication" of motion, provided one sees that as a neutral description of friction. However, it **does presuppose dynamical realism** (that inertial forces are real indicators of motion). It establishes that *if* forces are real, motion is not merely relative to local bodies.
  2.  **On Substantivalism:** The passage establishes **Absolute Rotation** (a privileged physical state distinguishable by internal forces) but does not logically compel **Absolute Space** (a substantival container). It leaves open the possibility that rotation is relative to the global mass distribution. It establishes nothing about Absolute Velocity.
  3.  **On the Relationist:** A relationist granting the phenomenon must explain the source of inertia without a container (e.g., via Mach's Principle). In an empty universe, the relationist must predict the water remains flat, whereas Newton's text implies it would become concave. The passage itself cannot settle this, as it relies on an intuition about "true motion" that the relationist rejects.

  **Final Verdict:** The passage is entitled to conclude that **rotation is a dynamical state distinct from relative translation between local bodies.** It is not entitled to conclude that **Space is a substance** or that **linear motion is absolute.** It secures a physics of absolute *acceleration*, not a metaphysics of absolute *location*.
