answer: |-
  ### The Spec: Requirements for a Public Welfare Standard

  Here is the functional specification for a wellbeing metric intended for municipal cost-benefit analysis (CBA). I have marked items as **Desiderata** (necessary for the job) or **Prejudice** (inherited from welfare economics but not strictly required by the concept of wellbeing).

  1.  **Normative Authority (Desideratum):** The metric must track what is *actually good* for a person, not just what they *say* is good. It must be able to identify that a life is going badly even if the subject reports satisfaction (e.g., the abused spouse, the oppressed worker).
  2.  **Subjective Resonance (Desideratum):** The metric must register that a benefit only counts if it registers *for the subject*. A benefit imposed on someone that they experience as a burden (e.g., forced medical treatment they reject) cannot count as a net welfare gain.
  3.  **Operationalizability (Desideratum):** The metric must be measurable using data a city can reasonably collect (surveys, administrative data, economic indicators) without requiring telepathy or intrusive surveillance.
  4.  **Interpersonal Comparability (Desideratum):** We must be able to say that a gain for Person A is larger, smaller, or equal to a loss for Person B. Without this, you cannot sum costs and benefits to find a "net" budget impact.
  5.  **Information Sensitivity (Desideratum):** The metric must distinguish between satisfying a preference based on false beliefs and satisfying one based on true beliefs. (Drinking poisoned wine because you think it's water is not a welfare gain).
  6.  **Temporal Neutrality (Desideratum):** The metric must handle trade-offs between present and future welfare without arbitrarily discounting the future self, while acknowledging that people change.
  7.  **Preference Sovereignty (Prejudice):** The assumption that satisfying an existing preference is *always* a welfare gain. (This is the economists' shortcut to avoid Normative Authority).
  8.  **Paretian Aggregation (Prejudice):** The assumption that if the sum goes up, the outcome is acceptable, regardless of distribution. (This collapses "Worse for Someone" into "Worse on Balance").

  ---

  ### The Collisions: Where the Spec Breaks

  You cannot have all the Desiderata. Here are the three fatal tensions you will face in the council meeting, the standard rescue moves, and why those moves fail elsewhere on the list.

  **1. The Adaptive Preference Collision (Normative Authority vs. Subjective Resonance)**
  *   **The Case:** The resident in substandard housing reports high satisfaction because they have lowered their expectations to survive.
  *   **The Conflict:** If you respect **Subjective Resonance**, you count their satisfaction as a win, validating their oppression. If you enforce **Normative Authority**, you declare their life going badly despite their report.
  *   **The Rescue Move:** Invoke "Informed Preferences" (what they would want if they knew better).
  *   **The Cost:** This violates **Operationalizability** and **Subjective Resonance**. You are now measuring a hypothetical counterfactual, not actual lives. In a council meeting, this looks like paternalism: "We know what's good for you better than you do." It opens the door for the city to override actual citizen feedback in favor of expert guesses.

  **2. The Reality Collision (Information Sensitivity vs. Operationalizability)**
  *   **The Case:** The "Experience Machine." A resident is happy because they believe a false story (e.g., their child is successful, when they are not). Or the "Ignorant Preference": A resident wants a park built, but the park will cause them noise pollution they don't anticipate.
  *   **The Conflict:** If wellbeing depends on **Information Sensitivity** (reality matters), you must measure the state of the world *and* the subject's knowledge of it. If wellbeing depends on **Operationalizability**, you usually rely on self-reports (how do you feel?).
  *   **The Rescue Move:** Use Objective Indicators (noise levels, employment stats) rather than surveys.
  *   **The Cost:** This violates **Subjective Resonance**. You are measuring the *conditions* of a life, not the *quality* of the life as lived. You end up measuring GDP with extra steps (housing stock up, crime stats down) while missing that residents feel unsafe or alienated.

  **3. The Aggregation Collision (Interpersonal Comparability vs. Separateness of Persons)**
  *   **The Case:** A policy creates massive wellbeing for 90% of the city but devastates the remaining 10% (e.g., a landfill sited in one neighborhood).
  *   **The Conflict:** **Interpersonal Comparability** allows you to sum the gains and losses to find a net positive. However, this collapses the distinction between "Worse for Someone" and "Worse on Balance."
  *   **The Rescue Move:** Apply distributional weights (a dollar/wellbeing unit for the poor counts for more).
  *   **The Cost:** This violates **Preference Sovereignty** and **Operationalizability**. You are imposing a moral judgment on whose welfare counts more. While ethically sound, it is politically volatile in a budget process and requires a "social welfare function" that no one agreed on. If you don't do this, you are strictly utilitarian and risk crushing minorities; if you do, you invite accusations of engineering social outcomes rather than measuring welfare.

  **Your Hunch:** *"Don't tell people what's good for them" and "Don't count preferences formed under duress" cannot coexist.*
  *   **Verdict:** You are correct. To identify duress/adaptation, you must have an external standard of "good." To apply that standard is to tell them what is good for them. The only way out is to claim the "external standard" is what they *would* choose under ideal conditions, but that is a fiction you cannot measure.

  ---

  ### Theory Scorecard (One Line Each)

  *   **Hedonism:** Fails **Information Sensitivity** and **Normative Authority** (the happy slave and the Experience Machine count as welfare wins).
  *   **Desire-Satisfaction:** Fails **Normative Authority** regarding adaptive preferences (validates the oppressed person's lowered expectations) and **Information Sensitivity** (counts satisfied ignorant preferences).
  *   **Objective-List:** Fails **Subjective Resonance** (can declare a life going well even if the subject is miserable) and **Operationalizability** (no consensus on the list, leading to endless council debate).

  ---

  ### The Killer Requirement

  **Interpersonal Comparability of Cardinal Welfare.**

  This is the requirement that does the most killing. To run a budget CBA, you *must* be able to add Person A's wellbeing to Person B's.
  *   It kills **Hedonism** because we cannot objectively compare the intensity of my pleasure against your pain.
  *   It kills **Desire-Satisfaction** because the strength of my desire is not comparable to the strength of yours (I might want coffee mildly, you might want it desperately, but we both just buy one cup).
  *   It kills **Objective-List** views because there is no common currency to trade "health" against "autonomy" across different people.

  Every theory that survives this cut either becomes a fiction (assuming comparability where none exists) or collapses into money-metric utility (WTP), which returns you to the GDP-with-extra-steps problem the economists warned you about.
