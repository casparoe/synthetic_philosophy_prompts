prompt: |-
  ok so i keep going back and forth on this and i want to actually nail it down before i read anything else, because right now im just bouncing between two gut feelings. the question is: does a community owe it to the dead to keep remembering old wrongs, or is there a point where the healthy, adult thing is to let it go? both camps seem to just grab whichever example suits them — one side points at a genocide nobody is allowed to deny and says you cant just move on, the other points at two families feuding for three generations over something from 1890 and says look what the remembering did. i dont want a verdict yet, i want the spec first.

  so: what would a theory of this actually have to get right to be any good? by "this" i mean a theory of what we owe the past — when a group should keep a wrong alive in its memory, when its ok to let it fade, and who counts as owing what. give me the requirements list: the cases it has to handle, the distinctions it cant collapse, the facts about how memory actually works that it cant just ignore, with the case or fact behind each one. i want to know which of these are real requirements and which are just one camp's taste dressed up as a requirement. and if some pair of them cant both be satisfied at once, say so, because thats the part im most curious about — i suspect thats why the argument never ends.

  a few things ive been chewing on that i think probably have to show up somewhere, but you tell me if theyre actually load-bearing or if im overthinking:

  - can a group remember anything at all, or do only people remember, and "collective memory" is really just institutions telling stories to individuals?
  - apparently human memory is reconstructive — every time you recall something you also edit it a bit. so is "faithful memory" even a coherent thing to ask for, or are we asking for something that cant exist?
  - nothing rots online. archives and phones mean forgetting has to be actively engineered now, and some places have made a legal right to be forgotten. does that change the whole picture?
  - truth commissions that trade amnesty for testimony — is that remembering or is it buying silence with a receipt?
  - do the descendants of people who did something owe anything, or is guilt not something you can inherit?
  - toppling statues: is that forgetting, or is it a different kind of remembering?
  - in a country where nobody shares a history, whose memory are we even talking about?

  give it to me as a table with these columns and nothing else before it:

  Requirement | what it demands of any theory (what the theory has to be able to deliver) | the case or fact that forces it | bedrock or just one sides preference | which kind of view it knocks out

  then a second short table for the clashes:

  Pair of requirements | why they pull against each other | what a theory would have to give up to satisfy both

  then one or two sentences at the end saying which single requirement does the most work, i.e. the one that eliminates the most otherwise-plausible positions. please dont give me a reading list or names to go look up, i cant get online right now anyway and i dont want to just take your word for what some book says.
