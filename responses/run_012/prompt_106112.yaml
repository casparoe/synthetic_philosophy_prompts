answer: |-
  | Requirement | what it demands of any theory (what the theory has to be able to deliver) | the case or fact that forces it | bedrock or just one sides preference | which kind of view it knocks out |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ontological Carrier** | Must specify exactly who or what is doing the remembering (minds, institutions, or artifacts). | The fact that groups have no brains; only individuals recall, yet institutions persist. | Bedrock (metaphysical/psychological fact) | Naive collectivism (that groups literally remember) and strict atomism (that institutions play no role). |
  | **Reconstructive Fidelity** | Must account for the inevitable drift and editing of memories over time without declaring them "false." | Psychological evidence that every act of recall alters the memory trace. | Bedrock (empirical fact) | Any theory demanding perfect historical accuracy or "faithful" preservation unchanged by time. |
  | **Moral Continuity** | Must explain the mechanism by which obligation transfers from the dead to the living, or deny it exists. | The intuition that descendants owe something vs. the fact that they did not commit the act. | Bedrock (structural necessity) | Strict individualism (no obligations beyond your own acts) and mystical collectivism (guilt is inherited like DNA). |
  | **Engineered Oblivion** | Must define a positive value for forgetting in an environment where digital retention is default. | The existence of "right to be forgotten" laws and the permanence of online archives. | Bedrock (technological fact) | Archival maximalism (the view that remembering everything is always morally superior). |
  | **Symbolic Distinction** | Must distinguish between honoring a person and recording a historical fact. | The debate over toppling statues (removing honor vs. erasing history). | Bedrock (semantic/political fact) | Conflationist views (that removing a statue equals destroying history, or that keeping one equals endorsement). |
  | **Boundary of Community** | Must define who is included in the "we" that owes the debt. | Nations built on immigration or conquest where no single shared history exists. | Bedrock (political fact) | Universalist memory claims (that everyone owes everything to everyone) and ethnic exclusivism. |

  | Pair of requirements | why they pull against each other | what a theory would have to give up to satisfy both |
  | :--- | :--- | :--- |
  | **Moral Continuity vs. Ontological Carrier** | Obligations usually attach to agents, but the "group" agent is fictional while the individual agents are dead. | It must give up either the idea that only living individuals bear moral weight or the idea that groups are merely sums of individuals. |
  | **Reconstructive Fidelity vs. Engineered Oblivion** | Memory naturally drifts (reconstructive), but digital archives prevent natural fading (obliteration requires effort). | It must give up the idea that forgetting is a natural process; it must accept forgetting as an active, political intervention. |
  | **Boundary of Community vs. Moral Continuity** | If the community boundary shifts (new citizens), the chain of moral continuity is broken or diluted. | It must give up either the stability of the community boundary or the strength of the inherited obligation. |

  The single requirement that does the most work is **Moral Continuity**, because it forces the theory to either justify why the living are bound by the dead's conflicts or admit that all such obligations are voluntary, eliminating most retributive and restorative frameworks instantly.
