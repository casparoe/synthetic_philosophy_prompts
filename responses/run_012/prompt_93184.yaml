      *   **The Debate:** Ravi argues it's corruption (universalist standard). Mariam argues it's social reciprocity/contextual norm (particularist standard).
      *   **Task:**
          1.  Analyze the 5 specific moves in their exchange.
          2.  For each move, determine who is right/wrong, what's flawed, and suggest a better argument.
          3.  Identify what *both* are missing.
          4.  Give a definitive verdict on the wedding gift itself.
          5.  Identify specific details that would flip the verdict.
          6.  Tone: American English, direct (no mushy "both have a point"), analytical.

  2.  **Deconstruct the Case Facts:**
      *   **Actor:** Mr. A (District Education Officer).
      *   **Action:** Sat on committee awarding textbook contract.
      *   **Event:** 4 months later, contractor owner gave large gift at A's daughter's wedding.
      *   **Context:** Public gift (200 guests), customary practice.
      *   **History:** Reciprocal gifts over the previous decade (A's family gave to Owner's family weddings).
      *   **Economic Context:** A hasn't been paid in 5 months; district office is broke.
      *   **The Conflict:** Ravi (Universalist/Rule-based) vs. Mariam (Contextualist/Relationship-based).

  3.  **Analyze the 5 Moves:**

      *   **Move 1 (Ravi):** Official + Discretion + Private Benefit = Corruption. Wrapping paper doesn't matter.
          *   *Critique:* Strong prima facie case. Captures the core conflict of interest.
          *   *Flaw:* Ignores timing and history. Treats all transfers as identical.
          *   *Better Argument:* Acknowledge the history but emphasize the *timing* relative to the contract.

      *   **Move 2 (Mariam):** Social life argument. Amounts track relationship. Importing arm's-length market logic is the error.
          *   *Critique:* Strong on cultural context. "Arm's-length" critique is valid.
          *   *Flaw:* Ignores the power differential and the specific contract timing. "Everyone does it" isn't a defense for public officials.
          *   *Better Argument:* Focus on the *pre-existing* nature of the relationship, not just general custom.

      *   **Move 3 (Ravi):** Reciprocity defense proves too much (any payoff is a gift). Real reciprocity is diffuse (many directions), not one contractor to one official. "Tracking relationship" = pricing.
          *   *Critique:* Very strong point about directionality (diffuse vs. specific). The "pricing" insight is sharp.
          *   *Flaw:* Dismisses the possibility of long-term relationships that *happen* to align with professional duties.
          *   *Better Argument:* Focus on the *asymmetry* created by the official role.

      *   **Move 4 (Mariam):** Gift vs. Bribe distinction (closes transaction vs. opens obligation). Accuses Ravi of moralizing ("bad man") vs. categorizing. Legalism critique (state could legalize corruption).
          *   *Critique:* Anthropologically sound on gift theory (Mauss). Good point on legalism.
          *   *Flaw:* The "opens obligation" point cuts against her; an official *shouldn't* owe obligations to contractors.
          *   *Better Argument:* Focus on the *intent* and the *public perception* of the obligation.

      *   **Move 5 (Ravi):** Public power -> Private benefit standard. Local rules don't matter. "Open-ended obligation" is *worse* than payment.
          *   *Critique:* Strong normative standard. The "obligation is worse" point is devastating to Mariam's gift theory.
          *   *Flaw:* Can sound imperialistic if not grounded in public trust.
          *   *Better Argument:* Anchor the standard in the *purpose* of the office (public trust), not just abstract rules.

  4.  **Identify What Both Are Missing:**
      *   **The "Unpaid Salary" Factor:** This is huge. A is financially vulnerable. This makes the gift look more like sustenance/bribery and less like social grace.
      *   **The "Broke Office" Factor:** Resources are scarce. The contract decision matters more.
      *   **The Timing:** 4 months post-contract is the sweet spot for "thank you" without explicit quid pro quo evidence, but it links the two events psychologically.
      *   **The Public Trust Aspect:** Neither focuses enough on how this looks to the *public* (parents, students), not just the office or the culture.

  5.  **Formulate the Verdict:**
      *   It's corruption (or at least unethical conflict of interest).
      *   Why? The power dynamic overrides the social custom when public resources are at stake. The financial vulnerability of Mr. A makes the "gift" functionally coercive or compensatory in a way that compromises independence.
      *   Ravi is closer to the truth, but Mariam identifies the cultural trap.

  6.  **Determine Flipping Details:**
