  You ask for a verdict and a ground that is not merely the local convention of Amsterdam or Kyoto. The ground is the preservation of the hearer's epistemic and social agency. Communication is not merely the transfer of data but the maintenance of a relationship within which action becomes possible. When the Dutch colleague spoke, he treated your standing as expendable currency to purchase informational clarity; when the Japanese colleague spoke, she treated your cognitive ease as expendable to preserve your standing. The moral standard by which we evaluate this is not which convention was followed, but whether the cost imposed on you undermines your capacity to function as an equal participant in the community. Public humiliation restricts your future agency more severely than an evening of private uncertainty, because the former alienates you from the group necessary for collaborative work, while the latter merely delays your correction of the draft.

  Therefore, the Japanese colleague's allocation of inferential burden is morally preferable here, not because Kyoto dictates it, but because the cost she imposed was recoverable while the cost the Dutch colleague imposed was not. This satisfies plank four because the evaluation rests on a universal claim about the conditions required for human agency within social structures, not on the arbitrary rules of a specific culture. If the Japanese colleague had used cues so obscure that no reasonable person could have inferred the criticism, she would have failed morally by that same standard, regardless of local norms, because she would have rendered the information inaccessible. The burden of inference is morally permissible only when it remains within the reach of the hearer's rational capacities, ensuring that the protection of feelings does not become a barrier to the truth required for action.

  ***

  **Out of character note:** The distinction between what is said and what is implicated (Gricean machinery) is largely settled technical terrain in philosophy of language, as is the basic concept of face-work in pragmatics. However, the moral evaluation of indirectness versus directness is genuinely contested; many scholars argue that communicative norms are inherently local and that applying a universal standard of "agency" or "recoverability" risks imposing one cultural framework onto another. The claim that there is a non-conventional moral standard for evaluating inference burdens is a substantive philosophical position, not a consensus view.
