answer: |-
  # Seminar Activity: The Warehouse Divergence

  ## Overview
  This session is designed to induce a pragmatic crisis regarding Jeffrey Conditionalisation (JC). By randomising the order of uncertain evidence amongst a small cohort, you will generate two clusters of rational agents who, having processed the *same* information via the *same* rule, arrive at *different* credences. The betting round transforms this from a calculation error into a Dutch Book vulnerability.

  ## Materials Required
  *   **Tokens:** 140 counters (e.g., poker chips). 10 per participant.
  *   **Worksheets:** 14 copies of the 'Ledger Sheet' (see below).
  *   **Envelopes:** 14 sealed envelopes. 7 marked 'Sequence Alpha' (Engine then Fumes), 7 marked 'Sequence Beta' (Fumes then Engine). Shuffle these before class.
  *   **Calculators:** Ensure every participant has one (phone calculators suffice).
  *   **Whiteboard:** Divided into three sections: 'Priors', 'Sequence Alpha Results', 'Sequence Beta Results'.
  *   **Projector:** For displaying the Scoring Rule and the Final Truth.

  ## The Numerical Recipe
  To guarantee divergence, the two evidence propositions ($E$ and $F$) must be probabilistically dependent in the prior distribution. If they are independent, JC commutes. If dependent, it generally does not.

  **The Scenario:**
  *   **Hypothesis ($H$):** The crate contains contraband.
  *   **Evidence 1 ($E$):** The sound of a diesel engine nearby.
  *   **Evidence 2 ($F$):** The smell of chemical solvents.

  **The Prior Distribution (Pre-calculated for your spreadsheet check):**
  You must verify these numbers before the session. Enter the following into a spreadsheet to generate the 'Correct' answers for the debrief.

  1.  **Joint Prior Probabilities (8 States):**
      *   $P(H \land E \land F) = 0.20$
      *   $P(H \land E \land \neg F) = 0.10$
      *   $P(H \land \neg E \land F) = 0.10$
      *   $P(H \land \neg E \land \neg F) = 0.10$
      *   $P(\neg H \land E \land F) = 0.05$
      *   $P(\neg H \land E \land \neg F) = 0.15$
      *   $P(\neg H \land \neg E \land F) = 0.15$
      *   $P(\neg H \land \neg E \land \neg F) = 0.15$
      *   *Check:* Sum = 1.0.
      *   *Marginals:* $P(H) = 0.50$. $P(E) = 0.50$. $P(F) = 0.50$.
      *   *Dependency Check:* $P(E) \times P(F) = 0.25$. But $P(E \land F) = 0.25$. **Wait, this is independent.**
      *   *Correction for Dependency:* We must force correlation. Adjust the prior:
      *   $P(H \land E \land F) = 0.25$ (Increased)
      *   $P(H \land E \land \neg F) = 0.05$ (Decreased)
      *   $P(H \land \neg E \land F) = 0.05$ (Decreased)
      *   $P(H \land \neg E \land \neg F) = 0.15$ (Increased to balance H)
      *   $P(\neg H \land E \land F) = 0.05$
      *   $P(\neg H \land E \land \neg F) = 0.15$
      *   $P(\neg H \land \neg E \land F) = 0.15$
      *   $P(\neg H \land \neg E \land \neg F) = 0.15$
      *   *New Marginals:* $P(H)=0.50$. $P(E) = 0.25+0.05+0.05+0.15 = 0.50$. $P(F) = 0.25+0.05+0.05+0.15 = 0.50$.
      *   *New Joint:* $P(E \land F) = 0.25 + 0.05 = 0.30$.
      *   *Dependency:* $0.30 \neq 0.50 \times 0.50$. They are positively correlated.

  2.  **The Updates:**
      *   **Glimpse 1:** "You hear a sound. You are **80%** sure it is a diesel engine." (Set $P_{new}(E) = 0.80$).
      *   **Glimpse 2:** "You smell a scent. You are **80%** sure it is solvents." (Set $P_{new}(F) = 0.80$).

  3.  **Spreadsheet Verification Logic:**
      *   Create columns for the 8 states.
      *   **Step 1 (Update E):** For each state, calculate $P_{1}(state) = P_{0}(state|E) \times 0.80$ if $E$ is true, else $P_{0}(state|\neg E) \times 0.20$. Normalise if necessary (though JC preserves normalisation if partitions are used).
      *   **Step 2 (Update F):** Apply the same logic to the *output* of Step 1, using the new $P(F)=0.80$.
      *   **Compare:** Calculate final $P(H)$ for Sequence Alpha ($E \to F$) and Sequence Beta ($F \to E$).
      *   *Expected Result:* With the numbers above, you should see a divergence of approximately 3–5 percentage points in the final credence of $H$. This is sufficient to fuel a betting market.

  ## Token Payoff Scheme
  To ensure honesty, use a simplified **Brier Score** payout.
  *   **Truth:** At the very end, you reveal whether $H$ is true (1) or false (0). (You decide this beforehand; ideally, set $H=True$ for the 'Priors' calculation to hold, but the payout depends on the actual reveal).
  *   **Formula:** $\text{Payoff} = 10 \times (1 - (\text{Credence} - \text{Outcome})^2)$.
  *   **Example:** If they state 0.8 and $H$ is true (1): $10 \times (1 - (0.2)^2) = 9.6$ tokens. If $H$ is false (0): $10 \times (1 - (0.8)^2) = 3.6$ tokens.
  *   **Simplification:** For speed, use a lookup table on the projector for the final payout. During the seminar, tokens are won/lost in the betting round; the final scoring rule is merely to validate their initial reporting honesty.

  ## Minute-by-Minute Timeline

  **00:00 – 00:10 | Introduction & Priors**
  *   Distribute tokens (10 each) and Worksheets.
  *   Explain the scenario: A warehouse crate. $H$ = Contraband.
  *   **Task 1:** Participants calculate their Prior $P(H)$ based on the provided joint distribution table on the worksheet. (It should be 0.50).
  *   Collect these priors on the whiteboard. Confirm consensus.

  **00:10 – 00:30 | First Glimpse (Update 1)**
  *   Distribute Envelopes. Do not open yet.
  *   **Instruction:** "Inside is your first observation. It gives you a new probability for a specific proposition ($E$ or $F$). You must update your credence in $H$ using the rule: **Hold your conditional probabilities fixed.**"
  *   *Script:* "If your envelope says 'Engine 80%', you must set your probability of Engine to 0.8. To find your new probability of Contraband, use your *old* probability of Contraband given Engine, and your *old* probability of Contraband given No-Engine. Do not change these ratios."
  *   Participants calculate. Walk around to ensure they are using the JC formula: $P_{new}(H) = P_{old}(H|E)P_{new}(E) + P_{old}(H|\neg E)P_{new}(\neg E)$.
  *   **Checkpoint:** Ask for the group's new $P(H)$. It should be uniform across the room (approx 0.65).

  **00:30 – 00:50 | Second Glimpse (Update 2)**
  *   Participants open the second slip in the envelope.
  *   **Instruction:** "Apply the same rule. Hold your *current* conditionals fixed. Update on the new proposition."
  *   Participants calculate final $P(H)$.
  *   **Crucial:** Do not let them compare numbers yet.

  **00:50 – 01:00 | The Reveal**
  *   Ask Sequence Alpha ($E \to F$) to write their final credence on the left of the board.
  *   Ask Sequence Beta ($F \to E$) to write theirs on the right.
  *   **The Moment:** Circle the discrepancy. (e.g., Alpha: 0.78, Beta: 0.82).
  *   Ask: "Who made an arithmetic error?" Allow 2 minutes for them to check each other's work. They will find none.

  **01:00 – 01:15 | The Betting Market**
  *   **Rule:** Participants may bet tokens on $H$ with members of the *other* group.
  *   **Mechanism:** If Alpha believes $H$ is 0.78 and Beta believes 0.82, Beta should be willing to sell a bet on $H$ to Alpha at any price between 0.78 and 0.82.
  *   Let them trade for 10 minutes.
  *   **Outcome:** Tokens will flow from one group to the other, despite both groups following the rules perfectly. This creates a felt sense of irrationality.

  **01:15 – 01:30 | Debrief & Theory**
  *   Reveal the name: **Jeffrey Conditionalisation**.
  *   Explain the mechanics of the divergence (see Debrief Notes below).
  *   Discuss repairs and implications.

  ---

  ## Debrief Notes (Instructor Script)

  ### 1. Mapping the Activity to the Rule
  *   **The Rule:** You performed Probability Kinematics. You changed your probability for evidence $E$ directly, rather than conditioning on $E$ being true ($P(E)=1$).
  *   **The Rigidity Condition:** The instruction "hold conditionals fixed" is the **Rigidity Condition**. $P_{new}(H|E) = P_{old}(H|E)$.
  *   **Why it Diverged:** When Group A updated on $E$ first, the probability of $F$ shifted automatically because $E$ and $F$ were correlated in the prior. When they subsequently updated on $F$, they overwrote that shift. Group B did the reverse. The second update effectively 'erased' the probabilistic information the first update had conveyed about the second proposition.

  ### 2. Available Repairs and Costs
  *   **Pearl's Virtual Evidence:** Instead of setting $P_{new}(E) = 0.8$, report a **Likelihood Ratio**. "The observation is 4 times more likely if $E$ is true than if $E$ is false."
      *   *Cost:* Requires agents to introspect on likelihoods rather than posteriors, which is cognitively demanding.
      *   *Benefit:* Updates commute (order independence is restored).
  *   **Field Conditionalisation:** Update by minimising the information distance (relative entropy) between prior and posterior.
      *   *Cost:* Computationally expensive; requires global optimisation rather than local updating.
      *   *Benefit:* Preserves commutativity.
  *   **Accept the Defect:** Argue that evidence *is* temporally ordered. The order of experience matters, so the order of updating should too.
      *   *Cost:* Leaves agents vulnerable to Dutch Books (as seen in the betting round) if they meet and trade.

  ### 3. What This Cannot Settle
  *   **Is Order-Dependence a Defect?** If the world presents evidence sequentially, perhaps our credences *should* reflect the path. However, if two agents with the same priors receive the same data, we intuitively feel they should agree. This activity shows JC violates that intuition.
  *   **Uncertain Conditionals:** The harder case is when the evidence is not "I am 80% sure $E$" but "I am 80% sure that *if $E$ then $H$*." JC cannot handle this directly. This leads to the problem of iterating conditionals and the failure of the Adams Thesis in dynamic contexts.

  ---

  ## Predictable Failures (First Run Risks)

  1.  **Arithmetic Bottleneck:** 14 students calculating 8-state distributions by hand will stall.
      *   *Mitigation:* Provide a worksheet that pre-calculates the conditional values $P(H|E)$ and $P(H|\neg E)$ for the prior. They only need to plug in the new $P(E)$.
  2.  **Misunderstanding "Fixed Conditionals":** Students will try to re-calculate $P(H|E)$ based on the new total probability.
      *   *Mitigation:* Write the formula large on the board: $P_{new}(H) = \mathbf{P_{old}(H|E)} \times P_{new}(E) + \mathbf{P_{old}(H|\neg E)} \times P_{new}(\neg E)$. Bold the old conditionals.
  3.  **The Betting Market Stalls:** If the divergence is too small (e.g., 0.1%), they won't bet.
      *   *Mitigation:* Check your spreadsheet recipe. Ensure the correlation between $E$ and $F$ is strong enough to produce at least a 0.03 (3%) divergence.
  4.  **Scepticism about the Truth:** Students may assume the "Truth" reveal at the end will vindicate one group.
      *   *Mitigation:* Emphasise that the *process* is the problem, not the accuracy. Even if both are wrong, the fact that they disagree is the epistemic failure.

  ## Worksheet Layout (Simplified for Hand Calculation)
  *To ensure the 90-minute limit is kept, do not ask them to compute the full joint distribution every time.*

  **Section 1: Priors**
  *   $P(H) = 0.50$
  *   $P(E) = 0.50$
  *   $P(F) = 0.50$
  *   $P(H|E) = \dots$ (Provide this: 0.70)
  *   $P(H|\neg E) = \dots$ (Provide this: 0.30)
  *   $P(F|E) = \dots$ (Provide this: 0.60) *<-- Crucial for dependency*
  *   $P(F|\neg E) = \dots$ (Provide this: 0.40)

  **Section 2: Update 1**
  *   New $P(E) = 0.80$
  *   Calculate New $P(H)$.
