answer: |-
  # ADVERSARIAL COLLABORATION STATEMENT: THE PASADENA PROBLEM

  **Date:** October 26, 2023
  **Parties:** Camp A (Standard EUT) & Camp B (Revisionist Principles)
  **Subject:** Normative status of conditionally convergent gambles (Pasadena/Altadena)

  ## 1. AGREED CLAIMS

  1.  **Mathematical Status:** The expected value of the Pasadena game, defined as the Lebesgue integral of the payoff function with respect to the probability measure, is undefined. The series of expected utilities is conditionally convergent ($\sum \frac{(-1)^{n-1}}{n}$), not absolutely convergent.
  2.  **Rearrangement Sensitivity:** By the Riemann Rearrangement Theorem, the sum of the Pasadena payoff series can be made to converge to any real number (or diverge) depending on the ordering of terms. There is no mathematical invariant sum independent of ordering.
  3.  **Dominance Relation:** The Altadena game state-wise strictly dominates the Pasadena game (Altadena payoff = Pasadena payoff + $1$ in every possible state).
  4.  **Formal Silence:** Standard Expected Utility Theory (EUT), relying solely on the comparison of expected values, yields no verdict on the choice between Pasadena and Altadena, as neither possesses a defined expectation.
  5.  **Intuitive Asymmetry:** Despite (4), both camps acknowledge a strong pre-theoretic intuition that a rational agent should prefer Altadena to Pasadena, and that treating them as indifferent or incomparable is costly to the normative appeal of the theory.
  6.  **No Dutch Book (Standard):** There is no finite Dutch Book against an agent who refuses to trade Pasadena for Altadena, provided the agent's pricing reflects the undefined status of the expectation rather than a specific finite value.

  ## 2. DISAGREEMENTS TABLE

  | Issue | Camp A (Standard EUT) | Camp B (Revisionist Principles) | Crux |
  | :--- | :--- | :--- | :--- |
  | **1. Normative Implication of Undefined EV** | When EV is undefined, EUT imposes no preference constraint. Preferring Altadena is permissible but not required by *expectation* maximization. | When EV is undefined, EUT is incomplete. A complete decision theory *must* require preferring Altadena via an extended principle. | Is the silence of EUT a feature (caution) or a bug (incompleteness)? |
  | **2. Scope of Dominance Principle** | State-wise dominance applies only to acts with integrable (absolutely convergent) expectations. Applying it here invites inconsistency. | State-wise dominance is a fundamental rationality requirement that should hold even for non-integrable acts, provided the difference is integrable. | Can dominance be decoupled from absolute convergence without paradox? |
  | **3. Significance of Natural Ordering** | The index $n$ (toss number) is arbitrary regarding value. There is no "natural" order for summation; relying on one is mathematically unjustified. | The index $n$ represents the causal/temporal structure of the gamble. The natural order ($n=1, 2, 3...$) has normative significance for evaluation. | Does the structural generation of outcomes justify a specific summation order? |

  ## 3. CRUX ANALYSIS & TESTABLE PREDICTIONS

  ### Crux 1: The "Integrable Difference" Principle
  **The Issue:** Can we require preference for Altadena over Pasadena because the *difference* between them ($1) has a defined expectation, even if the base acts do not?

  *   **Concrete Case:** A modified "Double Pasadena" game where the payoff is $2 \times$ Pasadena. The difference between Double Pasadena and Pasadena is exactly Pasadena (undefined). Compare this to Altadena vs. Pasadena (difference = $1, defined).
  *   **Camp A Prediction:** An agent is rationally permitted to be indifferent between Pasadena and Altadena. Requiring a preference based on the difference commits the "fallacy of division" regarding expectations.
  *   **Camp B Prediction:** An agent is rationally required to prefer Altadena. The principle "If $E[A-B] > 0$, prefer A" holds even if $E[A]$ and $E[B]$ are undefined, provided $E[A-B]$ is defined.
  *   **Settlement Condition:** If a formal proof demonstrates that adopting the "Integrable Difference" principle leads to cyclic preferences or money pumps in a broader class of conditionally convergent games, Camp B must retreat. If no such inconsistency can be generated, Camp A must accept the principle as a valid extension.
  *   **Verbal Component:** Low. Both agree on the math; dispute is purely normative.

  ### Crux 2: The "Natural Order" Hypothesis
  **The Issue:** Does the causal/temporal sequence of the coin tosses justify using the standard sum ($\ln 2$) as the "Effective Expected Value"?

  *   **Concrete Case:** A "Shuffled Pasadena" game. The payoffs are the same set, but the agent is told the outcomes will be revealed in a random order unrelated to the toss number $n$, or the payoff is tied to a set of simultaneous events rather than a sequence.
  *   **Camp A Prediction:** Preference should not change between Standard Pasadena and Shuffled Pasadena. Since EV is undefined in both, the ordering is irrelevant. Valuing Standard Pasadena at $\ln 2$ is arbitrary.
  *   **Camp B Prediction:** Standard Pasadena has a determinate value ($\ln 2$) because the toss order is intrinsic to the gamble's definition. Shuffled Pasadena is truly undefined. A rational agent should pay more to play Standard Pasadena than Shuffled Pasadena.
  *   **Settlement Condition:** A study or thought experiment establishing whether rational agents consistently value temporally-ordered conditionally convergent gambles differently from unordered ones. If agents treat them identically, the "Natural Order" argument fails.
  *   **Verbal Component:** Moderate. Dispute partly hinges on whether "Expected Value" refers to the Lebesgue integral (Camp A) or a "Value of the Gamble" (Camp B).

  ### Crux 3: Truncation Limits
  **The Issue:** Should rational valuation track the limit of finite truncations of the game?

  *   **Concrete Case:** Consider a sequence of games $G_k$ where the Pasadena game is forced to end at toss $k$. As $k \to \infty$, the EV of $G_k$ converges to $\ln 2$.
  *   **Camp A Prediction:** The limit of the expectations of truncated games is not necessarily the expectation of the limit game. Rationality does not demand continuity here.
  *   **Camp B Prediction:** Rational valuation should be continuous. If every finite truncation favors Altadena by exactly $1, the infinite game should preserve that preference structure.
  *   **Settlement Condition:** Agreement on whether "Continuity of Preference" is an axiom that survives infinite outcomes. If Camp A accepts Continuity, they must accept Camp B's conclusion. If Camp B rejects Continuity, they lose the primary argument for $\ln 2$.
  *   **Verbal Component:** High. This is a dispute over which axioms of EUT are non-negotiable in infinite contexts.
