prompt: |-
  I'm putting together an adversarial-collaboration doc for a decision theory reading group, and I need you to draft it. The two camps: (1) the "standard theory is fine, the Pasadena game just has no expected value and that's a complete answer" people, and (2) the "the Pasadena game exposes a real gap in expected utility theory and we need extra principles" people. They've been going in circles for months.

  Background you need (don't worry about citing anything, just use it): the Pasadena game is a fair coin flipped until the first heads. If heads first comes up on toss n, the payoff is (-1)^(n-1) * 2^n / n dollars. The expected value series is conditionally convergent — it sums to ln 2 in the natural order by n, but because it's not absolutely convergent, you can rearrange the terms to get any real number you like (Riemann rearrangement). The Altadena game is the same but pays an extra $1 on top, so it strictly dominates Pasadena (always exactly $1 more), yet some rearrangements make Pasadena's "expected value" arbitrarily large. There's also the question of what "expected value" even means when the sum isn't absolutely convergent.

  Draft the joint statement these two camps could both sign after a good-faith collaboration. I want:

  1. A numbered list of agreed claims — about the games themselves, about what the formalism does and doesn't deliver, about what "undefined expected value" does and doesn't mean, about dominance, and about what a rational agent is owed in these cases. Make them substantive, not vacuous.

  2. A disagreements table: for each remaining disagreement, state the issue in neutral wording, then give each side's position in wording that side would accept as fair to its own view. Include the cruxes — the sub-questions such that settling one would move at least one side.

  3. For each crux, a concrete case, argument, or formal result that both sides agree bears on it, plus what each side predicts about it. If part of the dispute turns out to be verbal, say which part and why.

  Keep it tight and don't pad. I want the residual disagrement to be exact enough that someone could design a proof or a study to settle it.
