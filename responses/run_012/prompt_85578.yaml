answer: |-
  Your observation cuts to the heart of a tension in modern liberal governance that political theorists often gloss over. You have identified a **domain-specific allocation of authority** that lacks a unified normative justification. The pattern you describe presupposes a conception of political authority I would label **Functional Dualism**.

  This conception holds that political legitimacy is derived from two distinct sources, applied selectively based on the perceived nature of the problem: **output legitimacy** (effectiveness/stability) in domains viewed as macro-stabilization, and **input legitimacy** (consent/participation) in domains viewed as distributive or normative.

  Here is an analysis of the conception your pattern presupposes, the rivals it excludes, where it is underdetermined, and the implications of a consistently democratic alternative.

  ### 1. The Implicit Conception: Functional Dualism

  The pattern does not presuppose a consistent theory of knowledge (epistocracy vs. democracy) nor a consistent theory of rights. Instead, it presupposes a **typology of political problems**:

  1.  **Time-Consistency Problems (Monetary Policy):** The legislature assumes that while the *goal* (price stability) is political, the *means* are subject to a "political business cycle." Politicians have an incentive to inflate before elections. Therefore, legitimacy here is derived from **credibility**, which requires insulation. Expertise is the proxy for credibility.
  2.  **Distributional Conflicts (Climate Policy):** Carbon taxes and building standards impose visible, concentrated costs on specific groups for diffuse, long-term benefits. The legislature assumes these are inherently **value-laden trade-offs** (e.g., rural vs. urban, industry vs. environment). Insulation here would be viewed as technocratic overreach because the "correct" answer depends on who bears the burden, not just on atmospheric chemistry.
  3.  **Normative Judgments (Criminal Justice):** While evidence is technical, the verdict is a moral judgment on culpability and community safety. The jury system presupposes that **legitimacy of coercion** requires peer judgment. A panel of forensic experts deciding guilt would be tyranny; a panel of peers weighing expert testimony is liberty.

  **Does it assume expert knowledge licenses insulation?**
  Only conditionally. It assumes expertise licenses insulation *only when* the problem is framed as a coordination or stability issue (inflation) rather than a distributional or normative one (climate, guilt).

  **Does legitimacy require accountability wherever burdens fall?**
  No. If it did, monetary policy would be electoral, since interest rate hikes impose severe burdens (unemployment). The pattern assumes that some burdens (inflation control) are "necessary evils" best managed by trustees, while others (carbon taxes) are "political choices" requiring consent.

  ### 2. Rival Conceptions: Ruled Out vs. Merely Fitted

  **Ruled Out:**
  *   **Strict Epistocracy:** A consistent rule by the knowledgeable would mandate that climate instruments be set by a council of atmospheric scientists and economists, insulated from voters who "deny the science." Your pattern rules this out by keeping climate policy in the electoral arena.
  *   **Strict Populism / Plebiscitary Democracy:** A consistent demand for electoral accountability would require Central Bank governors to be elected or dismissible by the legislature at will. Your pattern rules this out by insulating monetary policy.
  *   **Libertarianism:** This would question the legislature's right to fix emission or inflation targets in the first place, viewing both as market distortions. Your pattern accepts the targets as legitimate state functions.

  **Merely Fitted (Contingent Compatibility):**
  *   **Public Choice Theory:** This fits the monetary arrangement perfectly (politicians are self-interested actors who will manipulate money). However, it fails to explain why the same theory isn't applied to climate policy. Politicians also have short time horizons regarding carbon; they should logically delegate that too to avoid the "tragedy of the horizon." The fact that they don't suggests Public Choice is a post-hoc justification for monetary insulation, not the governing principle.
  *   **Separation of Powers:** The pattern fits the general liberal idea of checking power, but it is underdetermined by it. There is no constitutional principle that dictates *which* powers get insulated. Why is the "power of the purse" (monetary) insulated, but the "power of the tax" (carbon) not?

  ### 3. Where the Pattern is Underdetermined

  The inconsistency reveals a **boundary problem** that the current conception cannot resolve philosophically; it resolves it historically.

  *   **The Instrument/Target Distinction:** In both money and climate, the legislature sets a target and delegates or debates the instruments. But interest rates *are* distributional (hurt borrowers, help savers), just as carbon taxes *are* technical (optimize abatement costs). The boundary between "technical instrument" and "political burden" is porous. The pattern is underdetermined because it offers no principle for why inflation is a "technical stability" issue while climate is a "political burden" issue, given both have elements of both.
  *   **The Nature of Expertise:** In criminal trials, we trust laypeople to evaluate conflicting expert testimony (forensics vs. defense). In monetary policy, we assume laypeople cannot evaluate conflicting economic models. This suggests the insulation of Central Banks is not actually about the *complexity* of the knowledge (jurors handle complex DNA evidence), but about the **salience of the short-term pain**. The pattern is underdetermined regarding whether insulation is about *competence* or *courage*.
  *   **Historical Path Dependence:** The pattern likely fits not because of a coherent theory, but because of crisis history. Central Bank independence was a reaction to the stagflation of the 1970s (a failure of political management). Climate policy is still in the "mobilization" phase, requiring broad social buy-in. Criminal juries are a legacy of common law rights against the crown. The "conception" is arguably just a sedimentation of past crises rather than a principled stand.

  ### 4. The Consistently Democratic Counterfactual

  If you replaced this Functional Dualism with a **Consistently Democratic Conception** (one that prioritizes input legitimacy and accountability across all domains), the following changes would be necessary:

  1.  **Monetary Policy:**
      *   **Change:** Central Bank independence would be abolished or severely curtailed. Interest rate targets would be set by the legislature, or the Bank Governor would be an elected official or directly dismissible by the executive.
      *   **Consequence:** Likely higher inflation volatility and a return of the political business cycle, but with the "burden" of recession explicitly authorized by voters via their representatives.
      *   **Democratic Mitigation:** To avoid pure populism, a consistently democratic system might replace *insulation* with **sortition**. A Citizens' Assembly on Monetary Policy (randomly selected, educated on the issues, serving a fixed term) could set rates. This retains democratic legitimacy (representation by lot) without electoral cycling.

  2.  **Climate Policy:**
      *   **Change:** This would remain largely democratic, but a *consistent* democracy might seek to reduce the influence of concentrated money (lobbying) which distorts the "will of the electorate."
      *   **Refinement:** To match the "long-term" logic of Central Banks without losing democracy, climate targets and instruments could be handed to a **Climate Citizens' Assembly** with binding power, insulated from *elections* but not from *the public* (as they are the public). This bridges the gap: it removes the re-election incentive but keeps the layperson's judgment on distributional burdens.

  3.  **Criminal Justice:**
      *   **Change:** Juries would remain (they are already the most democratic element). However, a consistently democratic view might question the **adversarial system's** reliance on paid expert witnesses, which allows wealth to distort technical truth.
      *   **Refinement:** Court-appointed neutral experts would replace partisan experts, ensuring the lay jury is judging facts, not the quality of competing hired guns. This increases the epistemic reliability of the democratic verdict.

  ### Summary

  The pattern you observe presupposes a **pragmatic elitism regarding stability** and a **pluralist democracy regarding distribution**. It assumes that voters cannot be trusted to punish themselves for the greater good (inflation/climate), yet they must be trusted to decide who gets punished (crime) and who pays (climate).

  It rules out consistent rule by experts or consistent rule by voters. It fits Public Choice theory only selectively. It is underdetermined by any coherent theory of knowledge, relying instead on historical crisis responses.

  To make it consistently democratic, you would not necessarily strip away expertise, but you would change **who selects the experts** and **who sets the constraints**. You would move from *insulated appointments* (Central Banks) to *democratic sortition* (Citizens' Assemblies) for long-term technical issues, preserving the jury model for normative judgments, and acknowledging that "technical" economic levers are always, inescapably, political choices.
