      *   *Wait, is money just measurement?* No, interest rates distribute wealth (savers vs. borrowers). So why is that insulated? Because the *long-term* benefit is prioritized over *short-term* distribution.
      *   *So the conception is:* **Time-Horizon Based Authority.** Long-term stability = Experts. Short-term/Normative distribution = Voters.

