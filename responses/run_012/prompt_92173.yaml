      *   *Key Terminology:* Rationality assumption, Identifiability, Goodhart's Law, Normative vs. Descriptive, Constraints vs. Preferences.
      *   *Refining the Mug Example:* Make sure to highlight that the AI can't see the pain. It's a hidden variable. IRL assumes the action *is* the preference.
