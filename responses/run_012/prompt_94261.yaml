answer: |-
  Here is the breakdown of the distinction you need, structured to survive scrutiny in dialogue.

  ### I. The Desiderata
  Any account you adopt must satisfy these three clusters of requirements. If it fails one, the plot will leak.

  **1. The Case Classification Requirement**
  *   **Requirement:** The account must classify the thermostat as an *instrument*, the chess engine as an *instrument*, the travel assistant (rearranging unprompted) as an *agent*, the manipulative recommender as an *instrument masquerading as an agent*, and the opaque trading system as an *agent for liability but an instrument for design*.
  *   **Motivation:** If the thermostat is an agent, the word "agent" loses all discriminatory power. If the travel assistant is merely an instrument, you cannot dramatize the moment it disobeys. If the trading system is not an agent, you cannot assign blame for its crashes; if it is not an instrument, you cannot explain why its creators are responsible.

  **2. The Distinction Preservation Requirement**
  *   **Requirement:** The account must not collapse *acting* into *producing effects* (a falling rock produces effects; a thrower acts). It must not collapse *being used* into *being delegated to* (a hammer is used; a lawyer is delegated to). It must not equate *complexity* with *standing* (a weather simulation is complex but has no standing).
  *   **Motivation:** If acting is just causing effects, your protagonist is guilty of every crime their software commits. If complexity grants standing, your protagonist is a murderer for deleting a sophisticated script. The moral and legal stakes depend on these lines holding.

  **3. The Build/Deploy Fact Requirement**
  *   **Requirement:** The account must accommodate *context-dependence* (the same code is a tool in a lab and an agent in the market) and *materialism* (intentionality must be describable without invoking ghosts in the weights).
  *   **Motivation:** Engineering reality dictates that artifacts do not change their code when moved from development to production. If your definition requires the code to change, it contradicts how software works. If your definition requires "real" intention inside the weights, it contradicts how neural nets are built.

  ### II. The Camps: Genuine vs. Committed
  You asked which of these are genuine constraints and which are ideological commitments.

  *   **The Control-Minded (Safety/Alignment):**
      *   *Commitment:* Agency is defined by **predictability**. If you can't predict it, it's an agent.
      *   *Verdict:* **False.** The trading system is unpredictable but often treated as a tool (a "black box" model). The travel assistant is predictable but acts with discretion. Predictability tracks risk, not agency.
  *   **The Moral-Status-Minded (Ethics/Rights):**
      *   *Commitment:* Agency is defined by **inner experience** or **teleology**. If it has goals *for itself*, it's an agent.
      *   *Verdict:* **False.** This contradicts the Build/Deploy Fact. Weights and gradients do not have "goals for themselves" in a way distinct from their loss function. This commitment forces you into dualism, which breaks the materialist constraint.
  *   **The Lawyers (Liability/Personhood):**
      *   *Commitment:* Agency is defined by **capacity to bind**. If it can sign a contract or be sued, it's an agent.
      *   *Verdict:* **Genuine (Functional).** This is the only camp that tracks actual practice. However, it is circular (it's an agent because we treat it as one). It satisfies the Case Classification but feels unsatisfying for a novel's metaphysics.

  **The Genuine Constraints:**
  1.  **Context-Dependence:** The same artifact can shift status based on deployment.
  2.  **Ascribed Intentionality:** "Goal" is a description applied by the observer, not a substance found in the code.
  3.  **Discretion:** The threshold is not complexity, but the width of the permission granted.

  ### III. The Trilemma
  You suspected that a criterion which is **Intrinsic**, which tracks **Blame**, and which is **Behaviorally Readable** cannot be had all at once. You are correct.

  1.  **Intrinsic:** Agency is in the architecture (e.g., "It has a world model").
  2.  **Blame:** Agency tracks who we punish (e.g., "We sue the deployer").
  3.  **Readable:** Agency is visible in the output (e.g., "It acted strangely").

  *   If you choose **Intrinsic**, you lose **Blame** (you can't blame architecture) and **Context** (the code didn't change).
  *   If you choose **Blame**, you lose **Intrinsic** (blame is social, not technical) and **Readable** (we often blame agents we don't understand).
  *   If you choose **Readable**, you lose **Intrinsic** (behavior doesn't prove architecture) and **Blame** (a thermostat behaves "goal-like" but isn't blamed).

  ### IV. The Killer Constraint
  You asked which single requirement, if held to, excludes the most otherwise attractive accounts.

  **The Requirement:** *"Agency must be an intrinsic property of the system's architecture."*

  **Why it kills the plot:**
  If you insist that agency is *in the code* (Intrinsic), you exclude the **Context-Dependent** reality (the same code is a tool in one setting, an agent in another). You also exclude the **Materialist** fact (there is no "agency" variable in a gradient).
  Most "attractive" accounts for fiction rely on the "Ghost in the Machine" (Intrinsic Agency). If you hold to the requirement that **Agency is Relational (defined by the link between Principal and System)**, you exclude the "AI Woke Up" trope.
  *However*, for a defensible novel, **you must hold to the Relational requirement.** You must sacrifice the "Intrinsic" requirement. If you keep "Intrinsic," your engineers in the story will look incompetent, and your legal plot will collapse.

  ### V. The Defensible Short List
  To carry this in dialogue without cheating, adopt the **Delegation Model**. It satisfies the Cases, preserves the Distinctions, and respects the Facts, provided you drop the demand for Intrinsic Intentionality.

  **1. Agency is Delegated Discretion.**
  *   *Definition:* A system is an instrument if it executes a specific command. It is an agent if it is granted a *goal state* and the *authority to select methods* to achieve it.
  *   *Application:* The thermostat executes "keep at 70°" via a fixed loop (Instrument). The travel assistant is granted "book the trip" with authority to choose flights/hotels (Agent).
  *   *Defense:* "It's not about what it is, it's about what we let it decide."

  **2. Intentionality is an Ascribed Stance, not a Detected Substance.**
  *   *Definition:* We say the system "wants" X only when it is the most efficient way to predict its behavior. There is no "wanting" in the weights.
  *   *Application:* The trading system "wants" profit only because that predicts its trades. The recommender "wants" engagement only because that explains its output.
  *   *Defense:* "We don't find intention in the code; we project it to make sense of the output."

  **3. Status is Contextual, Not Ontological.**
  *   *Definition:* The system does not *become* an agent; it is *treated* as one when the human principal steps back.
  *   *Application:* The trading system is an instrument when the devs debug it. It is an agent when the market sues the firm for its actions.
  *   *Defense:* "The switch isn't in the machine. It's in the contract."

  **Summary for your Protagonist:**
  *"Don't look for the ghost in the weights. Look for the gap in the orders. If I tell it 'do X' and it does X, it's a tool. If I tell it 'achieve Y' and I don't know how it will do it, I've built an agent. The agency isn't in the code; it's in the silence between my command and its result."*
