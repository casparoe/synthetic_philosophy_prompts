  | **Resource** | Shared pasture | The agent's body, life trajectory, and resources |
  | **Enforcement** | External regulation or contract | Commitment devices (locks, apps, laws) |

  The model treats time-slices as autonomous agents competing for control over a shared physical vessel, framing self-control as inter-agent negotiation rather than intra-agent regulation.

  **Where it breaks**

  Three disanalogies matter most. First, **phenomenological continuity**. Distinct persons do not feel each other's pain; temporal selves do. The future self suffers the hangover the present self enjoyed. This undermines the claim that interests fully diverge; there is a shared consciousness of suffering that binds them. For the akrasia conclusion, this means the conflict is still internal, not interpersonal. Second, **negotiation capacity**. Separate agents can bargain simultaneously. Selves act sequentially; the present self holds veto power the future self cannot contest until it becomes the present. This makes the collective action problem unresolvable through mutual agreement, unlike the graziers. This matters for commitment: there is no contract, only unilateral imposition. Third, **moral responsibility**. Society holds individuals responsible for past actions regardless of psychological drift. If selves were truly distinct persons, punishing the future self for the present self's crime would be unjust. This social practice suggests an underlying unity the model ignores. The continuity disanalogy critically weakens the legitimacy conclusion by showing the victims are the same entity. The responsibility disanalogy undermines the dissolution of akrasia, as we still attribute the will to the whole person. The negotiation gap shows why commitment feels like coercion, not cooperation. Furthermore, distinct persons have separate legal identities. Selves share a bank account and legal liability. This practical entanglement means the tragedy is always internalized financially and legally, unlike the commons where costs can be externalized onto others. Finally, distinct persons can exit the relationship; a grazier can sell their herd. A self cannot resign from its future. The inevitability of succession means the conflict is mandatory, not voluntary, implying the collective action framing is fundamentally unstable.

  **What it quietly imports**

  This framing smuggles in contentious metaphysical and ethical assumptions. First, it assumes a **reductionist view of personal identity**, treating psychological connectedness as the sole criterion for personhood. It ignores the phenomenological sense of unity that persists despite preference changes. Second, it assumes **preference sovereignty without hierarchy**. By treating the impulsive present preference as equal to the contemplative future preference, it creates a conflict where none need exist if we admit some preferences are mistaken. It treats all revealed preferences as valid claims. Third, it assumes **the planner self has standing to intervene**. By framing commitment as helping one party against another, it presupposes the long-term self represents the real person. This is circular: it justifies paternalism by defining the paternalist as the true agent. It imports a normative hierarchy of selves without arguing for why the future-oriented self deserves sovereignty over the present-oriented self, effectively begging the question against the validity of immediate desires. Consequently, it transforms an ethical question about self-governance into a technical problem of resource allocation, hiding the value judgment that long-term planning is inherently superior to immediate gratification. It also assumes that rationality is synonymous with long-term consistency, disregarding contexts where immediate action is adaptively superior. It implicitly denies the possibility of genuine preference change, recasting all evolution of desire as conflict between static agents.

  **Does the conclusion survive**

  Conclusion 1 (Akrasia dissolves): **No.** While the model explains the mechanics of conflict, it fails to dissolve the normative puzzle. Regret confirms unity; if I were truly distinct from my future self, I would not feel guilt for their suffering. The weakness remains because the agent recognizes the divergent preference as their own error, not an external attack. The model describes the symptom, not the ontology. It relabels the problem without solving the philosophical tension of how one will can contradict itself.
  Conclusion 2 (Commitment legitimacy): **Partially, but misleadingly.** Commitment devices are indeed rational for sophisticated agents, but calling them non-paternalistic is semantic sleight of hand. It is still one part of the psyche constraining another. If the doer self has valid interests, rest, pleasure, suppressing them is paternalistic relative to that moment. The analogy legitimizes the utility of precommitment but fails to remove the ethical tension of overriding current agency. It shifts the justification from good for the person to good for the planner self, which amounts to the same thing given the shared consciousness. Thus, the tool is valid, but the moral exemption claimed is not. The argument succeeds in showing precommitment is rational self-interest, but fails to prove it escapes paternalism. It merely internalizes the paternalist relationship. Since the victims of the commitment are still the same conscious entity, the protection claimed by the analogy is illusory. We are still overriding agency, just our own temporal slice of it. Furthermore, if we accept the analogy, we risk validating harmful constraints. If the present self is a separate person, why shouldn't the future self punish them? The model lacks a mechanism to distinguish beneficial commitment from self-abuse, relying entirely on the assumption that the future self's preferences are the correct ones. Therefore, the conclusion that institutions are legitimate remains true practically, but the philosophical justification shifts from non-paternalism to benevolent internal governance.

  **A better analogy**

  The **Trustee-Beneficiary** model works better. The present self acts as a trustee managing assets, health, money, time, for the future beneficiary. They are distinct roles within a single legal entity. This preserves unity, the entity, while acknowledging conflicting interests, spending vs. saving. It captures the fiduciary duty the present self owes the future self without severing identity. Alternatively, no single analogy suffices because the phenomenon is hybrid: mechanistically like multiple agents, phenomenologically like one. We should treat it as a single agent prone to systematic prediction errors, rather than a civil war. This avoids the metaphysical baggage while retaining the predictive power of hyperbolic discounting models. The Trustee model clarifies why commitment is legitimate: it enforces fiduciary duty, not inter-personal conquest. It explains why we feel responsible, unity, yet conflicted, roles. However, even this strains under the weight of consciousness. Ultimately, the multiple selves talk should be treated as a useful fiction for modeling, not an ontological claim.
