prompt: |-
  ok so I'm putting together a small set of counterfactual-history prompts and I need one more, and this one's on Adam Smith. Set-up: Smith gets resurrected in 2024 and someone sits him down with a briefing on the world economy as it actually is — not the headlines, the plumbing. Multinationals slicing up supply chains, the WTO and its dispute panels, investor-state arbitration clauses that let a company sue a government for lost profits, tax havens, the sovereign debt of countries that used to be colonies, and the whole argument you hear from the left that all of this is just empire with a nicer name.

  I want his response as an arguement, not a vibe. Work from the actual machinery of the Wealth of Nations — the case that the colonial trade monopoly is a loss to the public and a windfall to a particular set of merchants, the suspicion of joint-stock companies governing distant territories, the passages where he seems almost relaxed about the American colonies going their own way. Then push the hard question: is the modern system continuous with the colonial one he attacked, or has it changed in kind? There's an old historiographical line that free trade was itself a form of empire, informal rather than formal, and I want him to actually have to deal with that rather than wave at it.

  Two things I don't want: a modern libertarian in a wig, or a modern anti-globalization activist in one. He should reason like Smith, which probably means landing somewhere neither camp enjoys.

  At the end, say where you're least confident and what would flip the verdict — which feature of Smith's own texts, or which fact about how the modern system actually works, would push him the other way.
reasoning: |-
  Here's a thinking process that leads to the suggested prompt:

  1.  **Analyze the Request:**
      *   **Subject:** Adam Smith resurrected in 2024.
      *   **Scenario:** Briefed on the modern global economy (supply chains, WTO, ISDS, tax havens, sovereign debt, post-colonial dynamics).
      *   **Task:** Create a counterfactual-history prompt for an AI (or writer) to generate Smith's response.
      *   **Key Constraint 1 (Argument, not vibe):** Must be grounded in *The Wealth of Nations* (WoN) mechanics (colonial trade monopoly, joint-stock companies, separation of colonies).
      *   **Key Constraint 2 (The Hard Question):** Address the "informal empire" critique (is free trade just empire by another name?). Is the modern system continuous with the 18th-century mercantile system or different in kind?
      *   **Key Constraint 3 (No Anachronisms):** Not a modern libertarian, not a modern anti-globalization activist. Must reason like Smith (nuanced, potentially unpopular to both sides).
      *   **Key Constraint 4 (Uncertainty):** End with a section on where the verdict is least confident and what evidence would flip it.

  2.  **Deconstruct Adam Smith's Core Arguments (relevant to this scenario):**
      *   *Mercantilism:* He hated monopolies, especially state-enforced ones (like the East India Company or Navigation Acts). He saw them as transferring wealth from the public to a few merchants.
      *   *Joint-Stock Companies:* He was deeply skeptical of them governing territories (specifically the EIC). He thought merchants make bad sovereigns.
      *   *Colonies:* He was surprisingly open to colonies separating if the cost of defense/administration outweighed the trade benefit. He suggested voluntary separation might be better than forced retention.
      *   *Free Trade:* He advocated for "natural liberty," but not anarchism. He recognized the need for state functions (defense, justice, public works). He wasn't a dogmatic laissez-faire absolutist in the modern libertarian sense.
      *   *Empire:* He criticized the exploitation of colonies but believed in commerce as a civilizing force (though this is where the "informal empire" critique bites).

  3.  **Drafting the Prompt - Section by Section:**

      *   **Role/Persona:** Needs to be precise. Not "Adam Smith AI," but "Adam Smith, moral philosopher and political economist, freshly briefed."
      *   **The Briefing (Context):** Summarize the specific modern mechanisms the user listed (WTO, ISDS, supply chains, debt). This ensures the AI knows *what* Smith is reacting to.
      *   **The Core Task:** Write a monologue or memorandum.
      *   **Analytical Framework:** Explicitly tell the AI to use WoN concepts.
          *   *Monopoly vs. Liberty:* How do ISDS clauses compare to the Navigation Acts?
          *   *Corporate Sovereignty:* How would Smith view a multinational with more GDP than a nation?
          *   *The "Informal Empire" Critique:* This is the crux. Does "free trade" mask coercion?
      *   **Tone Constraints:** 18th-century reasoning, not 21st-century ideology. Avoid "human rights" language unless framed as "natural justice." Avoid "efficiency" language unless framed as "annual produce of the land and labour."
      *   **The Uncertainty Clause:** As requested, a specific section at the end.

  4.  **Refining the "Hard Question" (Informal Empire):**
      *   Smith argued that monopoly *distorts* capital. The modern critique is that "free trade" agreements *lock in* advantages for capital.
      *   Smith might see ISDS (Investor-State Dispute Settlement) as a modern version of the East India Company's legal privileges.
      *   Smith might see the WTO as a potential "congress of nations" (he vaguely hoped for something like this) OR as a cartel of merchants.
      *   *Crucial nuance:* Smith wasn't against inequality per se, but against inequality derived from political privilege.

  5.  **Drafting the Content (Iterative Process):**
      *   *Attempt 1 (Mental Outline):* Tell Smith about the WTO. Ask if it's bad. He says yes, because monopolies. He says no, because trade is good.
      *   *Critique 1:* Too simple. Needs to hit the "informal empire" point.
      *   *Attempt 2 (Adding Detail):* Focus on ISDS. That's a legal privilege for merchants. Smith hated legal privileges. Focus on debt. Colonial debt mirrors the debt Britain imposed on colonies.
      *   *Refining the Voice:* Ensure the prompt instructs the AI to avoid modern buzzwords like "neoliberalism" or "libertarianism." Use Smith's vocabulary ("bounty," "binder," "master," "sovereign").

  6.  **Finalizing the Prompt Structure:**
      *   **System Instruction/Role:** Define the persona.
      *   **Input Data:** The briefing summary.
      *   **Directives:** Specific arguments to engage with.
      *   **Constraints:** What to avoid.
      *   **Output Requirement:** The argument + the uncertainty section.

  7.  **Review against User Constraints:**
      *   *Argument not vibe?* Yes, specific mechanisms cited.
      *   *WoN machinery?* Yes, references to monopolies, joint-stock, colonies.
      *   *Informal Empire?* Yes, explicitly included as a challenge.
      *   *No Libertarian/Activist?* Yes, tone constraints added.
      *   *Uncertainty section?* Yes, required at the end.

  8.  **Final Polish:** Make the instructions crisp so the AI generating the response knows exactly where the friction points are. (Self-Correction: Make sure to emphasize that Smith should be surprised but not necessarily shocked—he was a realist).

  9.  **Final Output Generation:** (This matches the provided good response).
answer: |-
  Here is the prompt designed to generate that specific response.

  ***

  **Prompt:**

  **Role:** You are Adam Smith, moral philosopher and author of *The Inquiry into the Nature and Causes of the Wealth of Nations*. You have been resurrected in 2024 and given a technical briefing on the architecture of the modern global economy. You are not a modern libertarian, nor a modern anti-globalization activist. You are an 18th-century Scottish realist who cares about the "annual produce of the land and labour," the danger of concentrated power, and the distinction between public interest and private mercantile interest.

  **The Briefing:**
  You have been shown the "plumbing" of the current system:
  1.  **Supply Chains:** Production is fragmented globally, not by one nation, but by firms coordinating across borders to minimize cost.
  2.  **Trade Law:** The WTO sets rules, but specific treaties include Investor-State Dispute Settlement (ISDS) clauses. These allow private corporations to sue sovereign governments in private tribunals if new laws (environmental, labor, etc.) reduce their expected future profits.
  3.  **Capital Mobility:** Capital moves instantly; labor does not. Tax havens allow profits to be booked where they are not earned.
  4.  **Sovereign Debt:** Many post-colonial nations spend more servicing debt to foreign creditors than on infrastructure. This debt often stems from loans conditioned on opening markets to foreign goods.
  5.  **The Critique:** You are told the argument from the modern Left: that this "free trade" system is not liberty, but "Informal Empire." It achieves what mercantilism did (extraction from periphery to core) without the administrative burden of formal colonization, using debt and legal clauses instead of gunboats.

  **Your Task:**
  Write a memorandum responding to this briefing. Your argument must rely on the mechanical logic of *The Wealth of Nations*, not modern ideology.

  **Key Arguments to Engage:**
  1.  **On Monopoly vs. Liberty:** In *WoN*, you argued that the colonial monopoly enriched merchants but impoverished the public by forcing capital into unnatural channels. Analyze ISDS and tax havens through this lens. Are these "natural liberties" of commerce, or are they new forms of the exclusive privileges you attacked in the East India Company?
  2.  **On Joint-Stock Companies:** You wrote that "merchants and manufacturers" make poor sovereigns and that joint-stock companies governing territories are inherently abusive. Apply this to multinationals that wield more leverage than the states they operate in. Does the modern corporation govern without responsibility?
  3.  **On the "Informal Empire" Critique:** This is the hardest point. You believed commerce was a bond of union, but you also knew Britain exploited its colonies. Confront the claim that "free trade" is merely empire by contract. Is the coercion of debt and legal arbitration fundamentally different from the coercion of the Navigation Acts, or is it the same "impertinent and troublesome" interference by the mercantile class?
  4.  **On Separation:** You once suggested that if Britain could not profitably administer America, it should let them go voluntarily to save the cost of defense. Does the modern debt structure prevent nations from "going their own way" in a way that makes the current system *more* rigid than the 18th-century one?

  **Tone Constraints:**
  *   Do not use modern terms like "neoliberalism," "human rights," "libertarian," or "class struggle."
  *   Do not preach morality; analyze incentives.
  *   Do not assume "free trade" is inherently good. You supported free trade because it broke monopolies, not because you worshipped the market. If the modern system *creates* monopolies, you must oppose it.
  *   Do not assume "state control" is inherently bad. You supported the state in defense, justice, and public works.

  **Required Conclusion (The Uncertainty Clause):**
  End the memorandum with a specific section titled **"On the Limits of My Judgment."** Identify one feature of the modern system you find most difficult to categorize using 1776 logic. State clearly what fact or mechanism would flip your verdict from "this is a new mercantilism" to "this is genuine liberty," or vice versa.

  **Format:** A formal memorandum, reasoned and dense, approximately 1,000 words.
