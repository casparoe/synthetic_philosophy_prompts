prompt: |-
  I sit on the work group revising our national psychiatric classification, and we vote next month on a proposed new category: persistent, impairing distress about one's inability to sustain a single coherent sense of an authentic self across the platforms and personas one inhabits. The criteria are broad, the field-trial instruments were largely developed by the online communities that have already adopted the label, and the prevalence figures we were given come from those same communities. One member argues that our categories are not neutral descriptions but change the people they classify: once published they are taken up by patients, clinicians, insurers and advocates, and the population the category picks out shifts in response, so our validity data may be chasing a moving target and the boundary we draw may help create what it claims to find. She wants us to reject the proposal outright; another member replies that some such uptake happens for every diagnosis and that withholding recognition only leaves suffering people unserved. Please draft the short opinion I will circulate before the vote. It should recommend a concrete course of action -- adopt, reject, or adopt with specified conditions and a review date -- with the reasoning laid out, and it should give the strongest opposing consideration its due rather than waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion draft:

  1.  **Analyze the Request:**
      *   **Role:** Member of a work group revising a national psychiatric classification (like the DSM or ICD).
      *   **Task:** Draft a short opinion to circulate before a vote on a proposed new category.
      *   **Proposed Category:** "Persistent, impairing distress about one's inability to sustain a single coherent sense of an authentic self across the platforms and personas one inhabits" (essentially, digital identity fragmentation distress).
      *   **Key Issues:**
          *   Criteria are broad.
          *   Field-trial instruments developed by online communities (not traditional researchers).
          *   Prevalence figures come from those same communities (potential bias/echo chamber).
          *   *The Core Philosophical Conflict:* One member argues categories are performative (looping effect) and this one is too susceptible to creating the condition it diagnoses. Another argues withholding recognition harms suffering people.
      *   **Requirements:**
          *   Recommend a concrete course of action (Adopt, Reject, or Adopt with Conditions/Review).
          *   Lay out reasoning.
          *   Give the strongest opposing consideration its due (intellectual honesty).
          *   Tone: Professional, balanced, decisive, suitable for a scientific/clinical work group.

  2.  **Determine the Stance:**
      *   *Option A (Adopt):* Risks validating potentially iatrogenic concepts based on weak data. Ignores the "looping effect" warning.
      *   *Option B (Reject):* Risks abandoning people in genuine distress. Ignores the reality that digital life *is* a major stressor now.
      *   *Option C (Adopt with Conditions/Review):* This is the most nuanced and responsible path. It acknowledges the suffering (validating the need) but mitigates the risks of the "looping effect" and weak data (validating the concern). It treats the diagnosis as provisional.
      *   *Decision:* **Adopt with specified conditions and a review date.** This allows for clinical utility while acknowledging the epistemic uncertainty and the performative nature of the diagnosis.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Problem (The "Looping Effect"):** Address the colleague's concern about the category creating the condition. This is the "strongest opposing consideration." It needs to be validated, not dismissed. The term "looping effect" (Ian Hacking) is useful here implicitly or explicitly.
      *   **The Counter-Argument (Suffering):** Acknowledge the other colleague's point. People are hurting. Ignoring it is unethical.
      *   **The Data Issue:** Acknowledge the weakness of the field trials and prevalence data (community-sourced).
      *   **The Recommendation (The "Middle Path"):** Provisional adoption.
      *   **Conditions:**
          1.  Stricter criteria (narrow the broadness).
          2.  Independent validation (not just community tools).
          3.  Sunset clause/Review date (e.g., 5 years).
      *   **Closing:** Call for unity/responsibility.

  4.  **Refining the Tone:**
      *   Needs to sound like a psychiatrist/psychologist speaking to peers.
      *   Avoid jargon where possible, but use precise terminology (e.g., "construct validity," "iatrogenic," "clinical utility").
      *   Ensure the "strongest opposing consideration" (the looping effect argument) is given weight. It shouldn't just be a footnote; it should drive the *conditions* of the adoption.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey team, we need to vote on the digital self thing.
      *   I think we should pass it but watch it closely.
      *   Sarah is right that diagnoses change people. If we name this, more people might feel it.
      *   But John is right that people are suffering now. We can't ignore them.
      *   The data is shaky because it comes from Twitter/Reddit folks.
      *   So, let's approve it provisionally. We need better tests made by us, not them. We review in 5 years. If it's making things worse, we cut it.
      *   Let's vote yes, but carefully.

  6.  **Drafting - Iteration 2 (Polishing and Professionalizing):**
      *   *Subject:* Recommendation regarding Proposed Category [Code/Name].
      *   *Opening:* I recommend provisional adoption with a mandated 5-year review.
      *   *Addressing the Concern:* The argument that classification is performative is compelling. We aren't just mapping nature; we are intervening. The risk of "concept contagion" is real given the online origin.
      *   *Addressing the Need:* However, clinical silence is also an intervention. It signals invalidation.
      *   *The Compromise:* We adopt, but we tighten the criteria to ensure it's about *impairment*, not just existential angst. We require independent psychometric validation.
      *   *Conclusion:* This balances care with scientific rigor.

  7.  **Final Polish (Checking against constraints):**
      *   *Concrete course of action?* Yes (Provisional Adoption + Review).
      *   *Reasoning laid out?* Yes.
      *   *Strongest opposing consideration due?* Yes (the performative/looping effect argument is central to the decision to make it provisional).
      *   *Length?* "Short opinion" - keep it under 2 pages or ~500-600 words.

  8.  **Final Review of the Text:** (Self-Correction during drafting)
      *   *Critique:* Is the name of the disorder too clunky in the text?
      *   *Fix:* Refer to it as the "proposed category" or "digital self-distress" for flow, but keep the formal definition in mind.
      *   *Critique:* Make sure I don't sound like I'm dismissing the online communities entirely, just noting the bias risk.
      *   *Fix:* Phrase it as "need for independent verification" rather than "community data is bad."
      *   *Critique:* Ensure the "looping effect" argument is respected.
      *   *Fix:* Explicitly acknowledge that the colleague raising this concern is scientifically correct about the nature of psychiatric taxonomy.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **TO:** Classification Revision Work Group
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposed Category: Persistent Self-Coherence Distress

  **Recommendation**
  I recommend that the Work Group **adopt the proposed category provisionally**, subject to specific tightening of diagnostic criteria and a mandated review for validity and prevalence in five years. We should not reject the category outright, nor should we adopt it as a permanent fixture without further independent validation.

  **Reasoning**
  We are faced with a tension between clinical utility and construct validity. On one hand, the distress described is palpable. As my colleague noted, withholding recognition is not a neutral act; it denies sufferers a language for their impairment, complicates insurance reimbursement for treatment, and risks invalidating a genuine phenomenological experience. To reject this category solely because it emerged from patient communities would be to ignore the reality that patients often identify symptom clusters before we do.

  However, the concern raised regarding the performative nature of our classifications must be given its due weight. It is scientifically sound to argue that psychiatric categories are not merely descriptions of natural kinds but interventions that alter the population they classify. This is particularly acute here. Because the criteria are broad and the field instruments were developed within the very online ecosystems that may amplify the phenomenon, we face a significant risk of iatrogenic feedback. If we codify this now, we risk validating a transient cultural anxiety as a fixed pathology, potentially shifting the boundary of "self" in ways that increase, rather than alleviate, distress. We cannot ignore the possibility that our stamp of approval may accelerate the very fragmentation we aim to treat.

  **Conditions for Adoption**
  To balance the immediate need for clinical recognition against the risk of creating a "moving target," I propose the following conditions:

  1.  **Narrowing of Criteria:** The current draft risks pathologizing normal existential reflection. The criteria must be revised to emphasize *functional impairment* (occupational, social) over the mere presence of identity distress.
  2.  **Independent Validation:** We must commission psychometric testing of the diagnostic instruments by research teams independent of the advocacy communities that originated the label. Prevalence figures must be established through population-based sampling, not self-selected online cohorts.
  3.  **Sunset Clause:** This category should be designated for "Further Study" or provisional use with a mandatory review date set for five years post-publication. At that time, we must evaluate whether the diagnosis has demonstrated stability or if it has merely tracked cultural trends.

  **Conclusion**
  Adopting this category provisionally acknowledges the suffering of our patients without surrendering our scientific responsibility to ensure our classifications describe stable realities rather than reinforcing transient anxieties. We can offer help now while retaining the humility to correct course if the data shows we are chasing a mirror.

  I urge the group to support this conditional adoption.
