  **Reflective Classification Disorder**

  **Diagnostic Criteria**

  A. Direct exposure to the diagnostic criteria for this condition, whether through clinical consultation, academic text, or digital media.
  B. Subsequent adoption of the specific lexical items and conceptual framework of Criterion A to organize subjective experience, evidenced by self-report or clinical observation.
  C. Reported distress or anxiety specifically regarding the perceived accuracy of the fit described in Criterion B.
  D. The disturbance causes clinically significant distress or impairment in social, occupational, or other important areas of functioning.
  E. The symptoms are not better explained by another mental disorder or general medical condition.

  **Specifiers**

  *With Categorical Insight:* The individual demonstrates awareness that the diagnostic category itself contributed to the emergence or maintenance of symptoms.
  *With Diagnostic Escalation:* Clinical presentation worsens following review of the Differential Diagnosis section of this entry.

  **Prevalence**

  Estimated prevalence is 0.042% in general adult populations. Prevalence rose sharply after the last revision of the manual. Rates are highest in metropolitan areas with high concentrations of academic institutions. No significant gender differences have been observed.

  **Development and Course**

  Onset is typically immediate following exposure described in Criterion A. The course is variable; symptoms may remit upon cessation of engagement with diagnostic materials or persist if the classification is integrated into identity. In cases specified *With Categorical Insight*, distress may paradoxically increase despite improved understanding of etiology. Longitudinal studies suggest chronicity is correlated with frequency of diagnostic consultation.

  **Differential Diagnosis**

  Malingering and Factitious Disorder must be ruled out through standard assessment of external incentives and intentional production of symptoms. The clinician must rule out distress resulting from having simply read this entry. If criteria are met only during the act of reading this manual, the diagnosis is not warranted. However, if symptoms persist beyond the immediate context of assessment, the diagnosis may be applied.

  **Culture-Related Diagnostic Issues**

  Higher prevalence is observed in academic psychiatry settings and philosophy seminars. Cultural acceptance of neurodiversity frameworks may influence the willingness to endorse Criterion C. In some contexts, the label is sought for community belonging rather than distress mitigation. Cross-cultural validity remains under investigation.

  **Diagnostic Features**

  The essential feature is a feedback loop between classification and identity. The individual does not merely possess symptoms; they possess symptoms *as categorized*. This distinguishes the disorder from conditions where labeling is secondary to pathology. Care must be taken not to pathologize normal intellectual curiosity, unless such curiosity results in the impairment specified in Criterion D. The disorder may co-occur with anxiety disorders, though the anxiety here is ontological rather than physiological. Treatment response varies; some patients improve with psychoeducation, while others deteriorate upon realizing the educational material is itself a diagnostic instrument.
