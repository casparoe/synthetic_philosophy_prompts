answer: |-
  ### Part 1: The Coherence of "Exact Indifference"

  Before we write the spec, we have to answer your first constraint: **Is the premise coherent?**

  **The Short Answer:** In the physical world, no. In your code, yes.

  **The Long Answer:**
  In metaphysics and decision theory, "exact indifference" is widely regarded as an idealization. In a continuous physical universe, two haypiles are never *exactly* equidistant, nor is the wind exactly symmetrical. There is always a "difference that makes a difference," even if it's below the threshold of perception. Joseph Raz and others argue that what looks like indifference is often **incommensurability** (no common scale) rather than **equality** (same value on a common scale).

  However, you are building a digital agent. In floating-point arithmetic, $0.500000 == 0.500000$ is a hard truth. Your model *can* output exact ties. So, while the philosophical problem might be based on a fiction of the real world, it is an engineering reality for you.

  **My Uncertainty:** I am flagging that treating computational ties as philosophical ties is a category error risk. Just because the *model* sees equality doesn't mean the *world* offers equality. Your spec must account for this gap.

  ---

  ### Part 2: Brainstorming the Philosophical Space

  Before locking in a procedure, here are the competing positions in the literature on rational choice without preference:

  1.  **The Buridan Solution (Anti-Paralysis):** Rationality requires action. If reasons are exhausted, the *will* supplies the final cause. Picking arbitrarily is not irrational; paralysis is. (Position: Pick one, any one).
  2.  **The Symmetry Solution (Randomization):** If options are truly symmetric, picking A over B introduces a bias without reason. To preserve symmetry, you must randomize (flip a coin). This is the Ullmann-Margalit & Morgenbesser view. (Position: Randomize).
  3.  **The Incommensurability View (Raz/Chang):** If options aren't on a common scale (Safety vs. Speed), they aren't "equal." They are "on a par." Comparing them via a single score is a category error. Randomizing here is immoral because it treats distinct values as fungible tokens. (Position: Do not compare; use lexicographic ordering or human intervention).
  4.  **The Epistemic Humility View:** A tie usually means your information is insufficient, not that the world is symmetric. The rational move is to gather more data, not to choose. (Position: Deferral).

  **Commitment:** For your spec, we cannot hold all four. We need a decision tree that sorts the *type* of tie before applying the *resolution*.

  ---

  ### Part 3: The Specification Procedure

  This is the ordered checklist for your engineering spec. It distinguishes between **Procedure** (deterministic logic you can code) and **Judgment** (human policy decisions you must make before deployment).

  #### Pre-Condition: The Ex-Ante Commitment Rule
  **Rule:** The tie-breaking policy must be defined *before* the agent encounters the specific options.
  **Why:** If you decide how to break a tie *after* seeing the options, you are vulnerable to "motivated reasoning" (subconsciously tweaking the rule to get the outcome you prefer). Ex-ante commitment ensures the tie-breaker is a neutral mechanism, not a hidden preference.
  **Spec Implementation:** The tie-breaking module is a immutable config file loaded at initialization. It cannot be edited during runtime based on current state.

  #### The Tie-Resolution Checklist

  **Step 1: Diagnostic (Is this Model Blindness?)**
  *   **Question:** Do the action vectors share >95% feature overlap, or is the score precision at the float limit?
  *   **Good Answer:** "Yes, the model is outputting identical logits because the inputs are effectively identical to the network."
  *   **Bad Answer:** "The scores look close enough."
  *   **Action:** If **Yes**, flag as **Type C (Model Blindness)**. Go to Step 4.
  *   **Action:** If **No**, proceed to Step 2.

  **Step 2: Classification (Equality vs. Incommensurability)**
  *   **Question:** Are the rewards derived from the *same* objective function component, or aggregated from distinct, non-tradable constraints (e.g., Safety Constraint vs. Task Reward)?
  *   **Good Answer:** "Both scores come from the same 'efficiency' head." (Type A: Equality)
  *   **Good Answer:** "One score is 'task completion', the other is 'collision risk'." (Type B: Incommensurability)
  *   **Action:** If **Type A**, go to Step 3A.
  *   **Action:** If **Type B**, go to Step 3B.

  **Step 3A: Resolution for Genuine Equality (Type A)**
  *   **Rule:** **Mandatory Arbitrary Selection.**
  *   **Procedure:** Select the action with the lowest index (or hash). Do **not** randomize.
  *   **Justification:** Randomization adds computational cost and non-determinism without adding value. If $Value(A) = Value(B)$, $Value(A) == Value(B)$. Picking A is as rational as picking B. Paralysis is irrational (Buridan's Ass starves). Determinism aids debugging.
  *   **Termination:** Execute Action.

  **Step 3B: Resolution for Incommensurability (Type B)**
  *   **Rule:** **Lexicographic Priority (No Randomization).**
  *   **Procedure:** Check pre-defined hierarchy (e.g., Safety > Task). If Safety scores are tied, then check Task.
  *   **Justification:** Randomizing between Safety and Task implies they are fungible (1 unit of Safety = 1 unit of Task). They are not. You must respect the hierarchy of values.
  *   **Termination:** Execute Action.

  **Step 4: Resolution for Model Blindness (Type C)**
  *   **Rule:** **Deferral or Penalty.**
  *   **Procedure:** If the model cannot distinguish actions that are physically distinct, the model is under-specified for this state space.
  *   **Action:** Trigger a "Low Confidence" flag. If a human-in-the-loop exists, defer. If autonomous, apply a high "uncertainty penalty" to the reward of *all* tied actions and re-evaluate. If still tied, default to the **Safe Null Action** (do nothing/stop).
  *   **Justification:** Acting when you know your model is blind is reckless. The rational move is to admit ignorance.
  *   **Termination:** Stop or Defer.

  #### Where the Procedure Misfires (Judgment Calls)
  *   **The Threshold Problem:** Step 1 asks for ">95% feature overlap." This number is a **Judgment Call**. There is no philosophical truth to 95%. You must tune this based on validation data.
  *   **The Hierarchy Problem:** Step 3B requires you to rank values (Safety > Task). This is a **Judgment Call** (ethical policy), not a mathematical derivation. The procedure enforces the policy; it does not create it.

  ---

  ### Part 4: Running the Cases

  Here is how the spec applies to your three scenarios.

  #### Case 1: Identical Predicted Reward, Deadline Forcing Act
  *   **Scenario:** Two paths to the goal. Same distance, same obstacle risk. Model outputs `0.85` for both. Deadline is $T=0$.
  *   **Step 1 (Diagnostic):** Feature overlap is high. Scores are exact floats. Likely **Type A (Equality)** or **Type C (Blindness)**. Given the deadline, we treat as Type A for now (assuming model is calibrated).
  *   **Step 2 (Classification):** Both scores come from the "Efficiency" head. **Type A**.
  *   **Step 3A (Resolution):** **Mandatory Arbitrary Selection.**
  *   **Action:** Pick Index 0.
  *   **Outcome:** The agent moves immediately.
  *   **Why you might dislike this:** You feel "lowest index" is dumb. But the philosophy says: **Paralysis is the only true irrationality here.** Since there is no reason to prefer A over B, any reason to act (including "index 0") is sufficient to break the symmetry. Randomizing would just add variance to your logs for no gain. The "dumb" rule is actually the most robust engineering solution for true equality.

  #### Case 2: Incommensurable Options (Safety vs. Task)
  *   **Scenario:** Action A: Fast path, 10% collision risk. Action B: Slow path, 0% collision risk. Reward model sums these into a single scalar and they tie out (e.g., Risk penalty cancels Speed bonus).
  *   **Step 1 (Diagnostic):** Feature overlap is low (different paths). Scores are aggregated.
  *   **Step 2 (Classification):** One component is Safety, one is Task. **Type B (Incommensurability).**
  *   **Step 3B (Resolution):** **Lexicographic Priority.**
  *   **Action:** Check Safety Hierarchy. Safety > Task. Action B wins.
  *   **Outcome:** Agent takes the slow path.
  *   **Why this matters:** If you used randomization here, you would sometimes choose the risky path. That implies "10% risk is okay if the speed bonus is high enough." But if your safety constraint is a *hard constraint*, it shouldn't be tradable. The tie was an artifact of summing incomparable values. The spec forces you to acknowledge they shouldn't be summed.

  #### Case 3: High-Stakes Human Case (Model Blindness)
  *   **Scenario:** A medical triage agent. Two patients. Model predicts identical survival probability (0.50) for both due to lack of specific diagnostic data. Only one ventilator available.
  *   **Step 1 (Diagnostic):** Model confidence is low. Inputs are sparse. **Type C (Model Blindness).**
  *   **Step 2 (Classification):** N/A (Blindness takes precedence).
  *   **Step 4 (Resolution):** **Deferral or Penalty.**
  *   **Action:** The agent flags "Low Confidence." Since there is no human in the loop (per scenario), it applies the uncertainty penalty. The scores drop. It re-evaluates. If still tied, it defaults to **Safe Null Action**.
  *   **Outcome:** **The agent allocates neither ventilator.**
  *   **Why you won't like this:** This is the "Paralysis is Rational" outcome. In a high-stakes environment where your model admits it cannot distinguish, acting arbitrarily is morally hazardous. The procedure dictates that **inaction is preferable to unjustified action.**
  *   **The Hard Truth:** This outcome suggests your agent should not be deployed in this context without human oversight. The spec successfully identifies that the automation is the problem, not the tie.

  ---

  ### Part 5: Limitations & What This Procedure Can't Do

  You asked for explicit limitations. Here is what this spec does *not* solve:

  1.  **It Cannot Fix a Broken Reward Model:** If your model consistently ties on critical decisions (Case 3), the solution is not a better tie-breaker; it is a better model. This spec is a safety valve, not an engine repair.
  2.  **It Cannot Resolve Moral Dilemmas:** If the hierarchy in Step 3B is contested (e.g., is Safety *always* more important than Mission Success?), this code enforces *your* team's ethical choice. It does not derive ethics from first principles.
  3.  **It Cannot Handle Adversarial Ties:** If an adversary learns your "lowest index" rule, they can engineer scenarios where Index 0 is a trap. (Mitigation: Use a cryptographic hash of the state + action ID for the tie-break, fixed at deployment, to prevent prediction).
  4.  **It Assumes Stationarity:** The Ex-Ante Commitment Rule assumes the world doesn't change so drastically that your pre-fixed hierarchy becomes obsolete. If Safety becomes less important than Speed due to external context, you need a mechanism to update the config, which risks violating the Ex-Ante rule.

  ### Final Summary for Your Team

  When you defend this to your ML team, use this framing:

  1.  **Ties are not bugs; they are signals.** They tell us whether we have equality, value conflict, or blindness.
  2.  **Randomization is not neutral.** It implies fungibility. Don't flip a coin on safety.
  3.  **Determinism is a feature.** For true ties, "lowest index" is auditable. Randomness is not.
  4.  **Inaction is a valid output.** If the model is blind, the rational choice is to stop, not to guess.

  This spec moves you from "dodging the problem with alphabetical sorting" to "implementing a philosophically grounded decision policy." It acknowledges that sometimes, the rational thing to do is admit the machine shouldn't decide.
