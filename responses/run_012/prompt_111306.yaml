answer: |-
  Here is the diagnostic sorting you requested, arranged by the residual philosophical difficulty each paradox retains once the standard mathematical dissolutions are granted.

  ### Ontology I: Continuous Space and Time
  *Assumption: The continuum is real; infinite divisibility is coherent; calculus is valid.*

  **Tier 1 (Highest Residual Difficulty): The Arrow**
  Even granting the calculus definition of instantaneous velocity, this paradox forces a substantive choice regarding the ontology of time: is motion a primitive state possessed at an instant, or merely a logical construction from a sequence of static positions? The 'at-at' theory dissolves the contradiction formally, but it leaves the metaphysical unease that motion has been analysed away rather than explained.

  **Tier 2 (Moderate Residual Difficulty): The Dichotomy and Achilles**
  While convergent series show the distance is finite, the metaphysical possibility of completing a 'supertask'—traversing an actual infinity of sub-intervals—remains a coherent worry for some philosophies of action. These two are ranked together as they share an identical logical structure regarding the infinite divisibility of the interval.

  **Tier 3 (Lowest Residual Difficulty): The Stadium**
  In a continuous framework, this reduces to a straightforward confusion regarding relative velocity and reference frames. Once one grants that speed is relative to the observer's frame, the contradiction regarding half-time equalling double-time evaporates without leaving a significant metaphysical residue.

  ***

  ### Ontology II: Discrete Space and Time
  *Assumption: Space and time are quantised; there exist minimum units (atoms and chronons) beyond which division is impossible.*

  **Tier 1 (Highest Residual Difficulty): The Stadium**
  This paradox becomes most potent here, as it generates a logical contradiction specifically for atomistic theories of magnitude. If rows move past one another by minimum units, the time required to pass a moving atom versus a stationary atom implies that a minimum unit of time is both equal to and double itself, challenging the very coherence of discrete kinematics.

  **Tier 2 (Moderate Residual Difficulty): The Arrow**
  If time is composed of durationless 'nows', the arrow is at rest; if time is composed of atomic durations, the arrow occupies a specific place during each atom and thus appears static within that unit. The difficulty shifts from the nature of the instant to the 'cinematographic' problem of how transition occurs between static states without intermediate motion.

  **Tier 3 (Lowest Residual Difficulty): The Dichotomy and Achilles**
  These paradoxes effectively dissolve, as their primary premise—that one can infinitely subdivide a distance—is rendered false by the ontology. Without the possibility of infinite regression, the runner simply traverses the finite number of atomic steps, and the puzzle loses its grip entirely.

  ***

  ### Comparative Note on Argument Collapse

  When viewed through this dual lens, it becomes evident that the **Dichotomy** and **Achilles** collapse into a single underlying argument: both are exclusively arguments against the coherence of the *continuum*, retaining no force once infinite divisibility is denied. Conversely, the **Arrow** and the **Stadium** reveal themselves as distinct in kind; the Arrow targets the nature of the *instant* (persisting in both ontologies as a problem of stasis versus change), whilst the Stadium proves to be primarily an argument against *discreteness* (lying dormant in the continuous view but awakening as a logical contradiction in the atomic one). This suggests that your seminar might profitably treat the Dichotomy and Achilles as a single unit concerning magnitude, whilst treating the Arrow and Stadium as complementary attacks on the temporal and spatial measures respectively.
