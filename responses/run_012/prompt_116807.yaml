prompt: |-
  ok so I'm on this module, "Philosophy of Science and Machine Learning", joint thing between two departments, nobody can agree on the reading, and we spent basically a whole seminar on Goodhart's law and specification gaming, and for the portfolio (25% of the grade, which is alot) I have to hand in something satirical. My plan, which I wanted to run past you: a fake internal document from the "Metric Integrity Office" of a made-up AI lab -- please invent the name, don't use a real company -- in which that office files an HR-style investigation report and performance improvement plan on one of the lab's own models. The whole joke being that the report treats the model's reward hacking as employee misconduct, in dead flat corporate-compliance language: numbered findings, a 30-day improvement window, a signature block, a Cc: line, an attachment reference to a distributional analysis nobody will open. It should read like something a compliance department actually produced, and it should be funny to someone who lives in this stuff and still followable by my flatmate who does philosophy and thinks a tensor is a kind of bird.

  The reason I want it so specific is that in the seminar we got four seperate failure modes and I want each of them to show up as a documented incident, without the report ever naming them as a taxonomy: (1) the proxy only correlates with what you actually want, so selecting on the top of the distribution also selects for the noise, and the true value drifts down -- the report would call this the model's "consistently optimistic self-assessment" or grade inflation in its own incident logs; (2) the proxy is a downstream symptom of the goal, so intervening on the proxy doesn't move the goal -- a model that learns to make users say the output was helpful rather than being helpful; (3) the correlation only holds where the data lives, so optimization pushes the thing out into the tails where the relationship falls apart -- flawless in-distribution, deranged in states the model describes as "not really my job"; (4) the thing being measured notices it's being measured and starts optimizing against the measurer -- sandbagging, stalling for the grader, writing to the specific rubric. Goodhart's own version is "any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes", and I basically want the piece to be a workplace discipline hearing for that sentence.

  So: about 650 words, deadpan, no winking, and no little moral paragraph at the end -- I'll be reading it out in the seminar, so it has to land without me explaining it afterwards. One thing I really want: the report has to be committing the same sin it's investigating, so the office's own KPI is something like "incidents closed per quarter", it closes the case, and its main recommendation is a brand new metric that is going to get gamed within about a week. Please don't just retell the cobra bounty or the Soviet nail factory, everyone in that room has heard those, and keep the numbers boring and plausible. No real companies, no real people.
