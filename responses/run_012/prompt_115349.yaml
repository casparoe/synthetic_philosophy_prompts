      *   *The "Rat Poison" Precedent:* They cared about *how* rats died, even though they had to die. This shows they value welfare *during* necessary interventions. But is treating pigeons "necessary"?

  7.  **Address the Specific Questions:**
      *   *What rules are they running on?* (Hierarchy identified above).
