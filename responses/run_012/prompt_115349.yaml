      *   *Secondary Driver:* **Anthropogenic Responsibility.** (Whale, Gorillas, Rats). If humans caused it, we fix it.
      *   *Tertiary Driver:* **Individual Welfare (The "Humane" Constraint).** We won't let individuals suffer *needlessly* if it doesn't contradict the Primary Driver. (Rat poison speed, Fox mange treatment).

      *   *Refined Rule:* "Prioritize ecosystem integrity and population viability. Intervene if humans caused the harm. If intervention is necessary (for ecosystem or human-harm reasons), minimize individual suffering where cost-effective."

  6.  **Apply to the Pigeon Case:**
      *   *Situation:* Natural mite, non-lethal, population stable, no ecosystem dependency, cheap treatment, reduces suffering.
      *   *Rule A (Fix Human Harm):* Predicts **NO**. It's natural.
