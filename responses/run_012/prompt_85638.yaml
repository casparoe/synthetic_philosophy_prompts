prompt: |-
  I'm a novelist and I've got a writing group — 12 of us, one room, 90 minutes, no wifi, Tuesday nights. I'm trying to write a book in which a colony is one of the characters (ants or termites, haven't decided), and I keep hitting the obvious objection: there's nobody in there to have a mind. Someone in the group brought up that old Hofstadter thing, Aunt Hillary, the ant colony that's supposed to be a whole mind even though not one ant knows anything. I want them to run into that problem themselves instead of hearing me explain it. So design me an activity — rules, roles, props I can get from a dollar store — where the group ends up somewhere they can't get out of: the colony obviously thinks and obviously doesn't, and nobody can say where the thinking is. It should land in about an hour so there's time to talk after. Then give me the debrief that maps what just happened onto the actual puzzle, tell me what will definately go wrong the first time I run it, and be honest about which part of the idea the activity can't get across so I have to just say it out loud myself. No reading list, please — I won't read it.
