answer: |-
  This is a fascinating exercise. You are asking for a mapping between an ontological framework (metaphysics) and an epistemological/statistical framework (psychometrics). The friction you feel is real.

  Here is the translation of the three main positions into your vocabulary, followed by the residue report, the response to your suspicions, and the meta-judgment.

  ---

  ### 1. Platonism (Transcendent Realism)

  **The Translation:**
  The Universal is a **population parameter vector** ($\theta$) that exists in the parameter space independent of any specific sample (particulars).
  *   **Particulars:** Observed data vectors ($y_i$) drawn from the distribution defined by $\theta$.
  *   **Relationship:** The particulars are imperfect realizations (noisy draws) of the Universal. The Universal causes the covariance structure of the particulars via a **reflective measurement model**.
  *   **Existence:** The parameter $\theta$ is fixed and real even if $N=0$. You can define the likelihood function without observing data.
  *   **Identity:** Determined by the mathematical definition of the distribution (e.g., the "Form of Red" is the specific spectral reflectance parameter), not by the observed items.

  **Residue Report:**
  *   **Clean:** The idea that the "Form" generates the appearance of particulars maps cleanly to a generative latent variable model ($\eta \rightarrow y$). The notion that particulars are imperfect copies maps to residual variance ($\epsilon$).
  *   **The Fudge:** I had to treat a *parameter* as an *entity*. In SEM, $\theta$ is a property of the model, not a "thing" floating in a realm. To make Plato fit, I had to reify the population distribution.
  *   **No Counterpart:** **Uninstantiated Universals.** In your framework, a latent variable with no indicators is **unidentified**. You cannot estimate it, and in practice, you treat it as non-existent. Plato insists the Form of the Circle exists even if no physical circles exist. Your framework literally cannot represent a real but unidentified latent variable.

  ### 2. Aristotelian Immanent Realism

  **The Translation:**
  The Universal is the **invariance constraint** across individual measurement models.
  *   **Particulars:** Individual subjects or objects, each with their own local model.
  *   **Relationship:** The Universal does not cause the particulars; it *is* the structural similarity (equality constraints on loadings $\lambda$ and intercepts $\tau$) found across them.
  *   **Existence:** The Universal exists *only if* Measurement Invariance holds. If you cannot constrain $\lambda_1 = \lambda_2$ across groups/instances without destroying model fit, the Universal does not exist.
  *   **Identity:** Defined by the abstraction process (factor extraction) applied to the set of particulars.

  **Residue Report:**
  *   **Clean:** The idea that universals are "abstracted from" particulars maps well to Exploratory Factor Analysis (EFA) where the factor structure emerges from the correlation matrix of the observed items.
  *   **The Fudge:** Aristotle claims the universal is *in* the thing. In SEM, the invariant parameter is *across* things. I had to shift from "inherence" to "cross-group equality constraints."
  *   **No Counterpart:** **Hylomorphism (Matter/Form distinction).** Aristotle distinguishes the universal form from the particular matter. In SEM, the "matter" is the residual variance ($\epsilon$), but SEM treats this as noise/error, whereas for Aristotle, the matter is a constitutive principle of the particular, not just measurement error.

  ### 3. Nominalism (Class/Resemblance/Trope Theory)

  **The Translation:**
  *   **Class Nominalism:** There is no latent $\eta$. There is only **Latent Class Analysis (LCA)** or clustering. Similarity is just membership in the same bin. No common cause explains the covariance; the covariance is brute fact.
  *   **Resemblance Nominalism:** High residual correlations ($\theta_{\delta}$) without a common factor. We model the similarity directly between indicators, not via a mediator.
  *   **Trope Theory:** **No equality constraints anywhere.** "This redness" ($y_1$) and "that redness" ($y_2$) are distinct variables. You cannot constrain $\lambda_1 = \lambda_2$. Every indicator for every person is a unique parameter. The model is **saturated** (df = 0).

  **Residue Report:**
  *   **Clean:** Trope theory maps perfectly to a saturated model where every observation is unique. It captures the refusal to reduce dimensionality.
  *   **The Fudge:** Nominalists usually want to explain why we *talk* as if universals exist. In SEM, if you refuse to posit a factor, you lose parsimony. I had to frame Nominalism as a "refusal to impose constraints" rather than a positive theory of resemblance.
  *   **No Counterpart:** **Primitive Resemblance.** Nominalists often say resemblance is a brute fact. In SEM, covariance must be accounted for either by a latent variable or by correlated residuals. Correlated residuals usually imply a missing latent variable (omitted variable bias). Your framework forces you to find a cause for covariance; Nominalism says there might not be one.

  ---

  ### Addressing Your Suspicions

  **1. Directionality: Factor $\rightarrow$ Indicators vs. One Thing Shared**
  You are **not overreading**. This is a category error.
  *   **Psychometrics:** The latent variable is a *generative mechanism* (causal). $\eta$ varies, causing $y$ to vary.
  *   **Metaphysics:** The Universal is an *ontological ground*. It doesn't necessarily "cause" the particular in a temporal or mechanistic sense; it makes the particular *what it is*.
  *   **The Clash:** In SEM, if the factor loading is zero, the link is broken. In Platonism, a particular can fail to "participate" perfectly but still be linked to the Form. Your framework assumes a functional relationship; metaphysics assumes a constitutive relationship.

  **2. Identification: Unidentified Latent vs. Uninstantiated Form**
  You are **correct**. This is the biggest friction point.
  *   **Psychometrics:** "To be is to be identified." If you cannot fix the scale (set a loading to 1) or provide enough indicators, the parameter is mathematically indeterminate. It is not just unknown; it is undefined.
  *   **Metaphysics:** Plato's Forms are defined by their essence, not their instantiation.
  *   **Implication:** Your framework is inherently **verificationist**. It cannot state Plato's position without violating its own axioms. To model an uninstantiated Universal, you would have to treat it as an exogenous variable with no downstream effects, which SEM software will reject as unidentified.

  **3. Identity: Rotation/Scaling vs. Given Identity**
  You are **on base**.
  *   **Psychometrics:** Factor identity is **indeterminate** without rotation criteria (Varimax, Promax) or anchoring items. You decide that "Intelligence" is the factor that loads on Vocabulary and Math. You could rotate it differently.
  *   **Metaphysics:** Realists argue property identity is **mind-independent**. "Redness" is Redness regardless of how we cluster our data.
  *   **The Clash:** In SEM, the "Universal" is partly a product of the researcher's specification (which items, which rotation). In metaphysics, the Universal is discovered, not constructed. Your framework admits an element of constructivism that Realists deny.

  **4. The Third Man Argument (Regress)**
  *   **Psychometrics:** We stop the regress via **Parsimony (AIC/BIC)** or **Theoretical Fiat**. We posit a Higher-Order Factor (g) to explain the correlation between first-order factors (Verbal, Math). We stop there because adding another layer doesn't improve fit enough to justify the complexity.
  *   **Metaphysics:** The Third Man argument says if you need a Form to explain the similarity of particulars, you need a Form to explain the similarity of the Particulars + the first Form.
  *   **Why no regress in SEM?** Because SEM is not trying to explain *similarity*; it is trying to explain *covariance*. Once the covariance is accounted for (residuals are uncorrelated), the model stops. The regress is an artifact of asking "what makes these similar?" rather than "what statistical dependency remains?" Your framework avoids the regress by changing the question from ontology to data reduction.

  ---

  ### The Meta Question

  **Is the residue a sign your framework is too thin to hold the metaphysics, or a sign that some of what the philosophers are arguing about is less substantial than it sounds?**

  **Verdict:** The residue is a sign that **some of what the philosophers are arguing about is less substantial than it sounds.**

  **Why:**
  Your framework is not "too thin"; it is **disciplined**. Psychometrics forces ontological claims to pay an **identification tax**. To claim something exists in your framework, you must specify how it constrains the data.

  The metaphysical debate often persists precisely because it *lacks* this constraint.
  1.  **Uninstantiated Universals:** If a Universal has no instances, it has no empirical consequences. In your framework, this is an unidentified parameter. In metaphysics, it's a "deep truth." The residue here reveals that the metaphysical claim is **empirically vacuous**. It makes no difference to the data.
  2.  **Immanent vs. Transcendent:** Whether the parameter exists "in" the data or "above" the data often results in the exact same covariance matrix. If two models imply the same likelihood function, they are **observationally equivalent**. The metaphysical fight over *where* the universal lives is often a fight over labeling, not structure.
  3.  **The Third Man:** The regress arises because philosophers treat similarity as requiring a *further entity*. Your framework treats similarity as *reduced covariance*. Once the covariance is zero, there is nothing left to explain. The regress is a linguistic artifact, not a structural necessity.

  **Conclusion:**
  The residue isn't missing metaphysics; it's **metaphysical overhead**. Your framework strips away the ontological decorations to leave the generative structure. When the translation fails (e.g., uninstantiated Forms), it is usually because the metaphysical position is making a claim that creates no difference in the distribution of observables.

  You aren't fooling yourself. You are seeing that much of the Problem of Universals is a debate about **model specification** disguised as a debate about **reality**. The philosophers are arguing over whether the parameter is "real" or just a "summary statistic." Your framework answers: "If it's not identified, it's not a parameter, it's a story." That doesn't mean the story is ugly, but it means it's not science.
