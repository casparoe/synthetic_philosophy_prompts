answer: |-
  # Diagnostic Tree: The Reference Class Problem

  **Instructions:** Begin at **Node 1**. Answer the question based on your philosophical commitments regarding probability. Follow the arrow corresponding to your answer until you reach a **Leaf**. The Leaf identifies the position and its "cost" (the most awkward commitment you must accept).

  ---

  ### **Node 1: Ontological Status**
  **Question:** When a geologist estimates the probability that a specific, unstudied formation contains ore, is this probability a **physical feature of the formation itself** (like its density or age), or is it a **summary of the geologist's information** (like a weather forecast)?

  *   **→ Physical Feature (Objective Chance):** Go to **Node 2**.
  *   **→ Summary of Information (Epistemic Credence):** Go to **Node 4**.

  ---

  ### **Node 2: Singular vs. Collective (Physical Branch)**
  **Question:** Does a single, unique event (e.g., *this* specific formation's history) possess a probability inherently, or does probability only exist for **collections** of events?

  *   **→ Inherent to Single Event:** Go to **Leaf A**.
  *   **→ Only for Collections:** Go to **Node 3**.

  ---

  ### **Node 3: Uniqueness of Class (Physical Branch)**
  **Question:** If probability requires a collection, does the physical world dictate exactly **one correct reference class** (e.g., the narrowest class with stable frequencies), or is the choice of class underdetermined by nature?

  *   **→ One Correct Class Fixed by Nature:** Go to **Leaf B**.
  *   **→ No Unique Class Fixed by Nature:** Go to **Leaf C**.

  ---

  ### **Node 4: Constraint by Evidence (Epistemic Branch)**
  **Question:** When a clinician prognosticates for a patient with a rare combination of features, is there a **single rational way** to group the evidence that all agents must accept (e.g., the totality of known medical data)?

  *   **→ Yes, Fixed by Total Evidence:** Go to **Leaf D**.
  *   **→ No, Evidence Underdetermines the Class:** Go to **Node 5**.

  ---

  ### **Node 5: Role of Decision and Utility (Epistemic Branch)**
  **Question:** When a court assesses the probability of a unique historical event, does the "correct" reference class depend on the **consequences of error** (e.g., the cost of convicting the innocent vs. freeing the guilty)?

  *   **→ Yes, Determined by Decision/Utility:** Go to **Leaf E**.
  *   **→ No, Independent of Decision Context:** Go to **Node 6**.

  ---

  ### **Node 6: Symmetry vs. Dissolution (Epistemic Branch)**
  **Question:** When a machine-learning model reports a calibrated probability for one user, do you solve the class choice by assuming **mathematical symmetry/exchangeability** among users, or do you argue the demand for a "correct class" is a **linguistic confusion**?

  *   **→ Solved by Symmetry/Exchangeability:** Go to **Leaf F**.
  *   **→ Demand is a Linguistic Confusion:** Go to **Leaf G**.

  ---

  ### **Leaves: Positions and Costs**

  | Leaf | Position Name | The Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Single-Case Propensity** | You must accept that singular objects possess untestable, metaphysical probabilistic powers. |
  | **B** | **Frequentist Direct Inference** | You must accept that changing the description of an event can change its physical probability. |
  | **C** | **[Unoccupied / Incoherent]** | You claim probability is physical but deny nature fixes the class; this implies physical facts are description-relative. |
  | **D** | **Logical Probabilism (Evidentialist)** | You must accept that logical relations between evidence and hypotheses are objective yet rarely calculable. |
  | **E** | **Pragmatic Instrumentalism** | You must accept that two agents with identical information can rightly assign different probabilities based on their goals. |
  | **F** | **Subjective Bayesianism** | You must accept that rational agents can disagree on probabilities even when sharing all evidence and logic. |
  | **G** | **Deflationary Dissolutionism** | You must accept that a problem central to scientific practice is actually a category error or pseudo-problem. |

  ---

  ### **Diagnostic Notes & Flags**

  **1. Unoccupied Combinations**
  *   **Leaf C (Physical + No Unique Class):** This combination is marked **Incoherent**. If probability is a physical feature of the world (Node 1), there must be a fact of the matter about which class defines it. Denying a unique class (Node 3) while maintaining objectivity (Node 1) suggests the probability is not truly physical. This space is unoccupied because it collapses into Epistemic views or Propensity views upon scrutiny.

  **2. Indistinguishable Pairs**
  *   **Leaf E (Pragmatic) and Leaf G (Dissolutionist):** The tree separates these by whether you offer a *replacement* criterion (Utility) or reject the *question* (Confusion). In practice, these positions often converge: both deny a "view from nowhere" reference class. A reader may find it difficult to distinguish a Pragmatist who says "Use what works" from a Dissolutionist who says "Asking what is 'true' is useless."
  *   **Leaf E (Pragmatic) and Leaf F (Subjective Bayesian):** Both allow agents with the same evidence to hold different probabilities. The distinction lies in *why*: the Bayesian cites prior belief/symmetry; the Pragmatist cites decision context. In complex modeling (e.g., Machine Learning), these motivations frequently overlap.

  **3. Coverage of Requested Positions**
  *   **Direct Inference from Frequencies:** Represented by **Leaf B**.
  *   **Reference Class as Modeler's Utility:** Represented by **Leaf E**.
  *   **Pseudo-Problem / Decision-Theoretic Dissolution:** Represented by **Leaf G** (Pseudo-problem) and **Leaf E** (Decision-theoretic reformulation).

  **4. Usage Guide**
  *   If your group finds themselves consistently landing on **Leaf C**, re-examine your definition of "Physical." You are likely holding an Epistemic view without realizing it.
  *   If your group lands on **Leaf D**, ask for a concrete algorithm to calculate the "Total Evidence" weight in the Clinician case. The lack of one is the standard objection to this position.
  *   If your group lands on **Leaf F**, press the ML case: if exchangeability is assumed, how do you handle distributional shift (when the new user is *not* exchangeable with the training set)?
