answer: |-
  ## Instrument: The Special Claims Decision Tree

  ### I. Logical Space and Architecture
  Before using the instrument, note that the tree is constructed from six dimensions of disagreement that are often conflated. The nodes below isolate these dimensions to prevent category errors.

  1.  **Existence:** Is there *any* moral difference between compatriots and strangers?
  2.  **Agency:** Who bears the obligation (Individual vs. State)?
  3.  **Domain:** What is the obligation about (Distribution vs. Membership)?
  4.  **Force:** Is it a Permission, Duty, or Weighting?
  5.  **Priority:** How does it compete with global claims (Trump, Floor, Tie)?
  6.  **Ground:** What creates the claim (Coercion, Reciprocity, Association, Culture)?
  7.  **Conditionality:** Does domestic or historical justice matter?

  The following 12 nodes guide you through this space. Follow the path dictated by your answers.

  ### II. The Decision Tree (12 Nodes)

  **Node 1: Claim Identity**
  Do compatriots have moral claims on you that are *different in kind or weight* from the claims of strangers?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to Node 2.

  **Node 2: Agent Locus**
  Is the primary bearer of this special obligation the *individual* or the *state/institution*?
  *   **Individual:** Go to Node 3.
  *   **State:** Go to Node 4.
  *   **Both:** Follow the State path (Node 4), then check Node 3 for personal permissions.

  **Node 3: Personal Domain**
  (If Individual) Does individual partiality extend to *resource allocation* or only to *affective care/personal projects*?
  *   **Resources:** Go to Node 5.
  *   **Care Only:** Go to **Leaf 2**.

  **Node 4: Policy Domain**
  (If State) Does state partiality apply to *economic distribution* or *border membership/exclusion*?
  *   **Distribution:** Go to Node 5.
  *   **Membership:** Go to Node 6.
  *   **Both:** Go to Node 5.

  **Node 5: Normative Force**
  Is favouring compatriots merely *permitted*, *required*, or do their interests simply *count for more*?
  *   **Permitted:** Go to Node 6.
  *   **Required/Weighted:** Go to Node 7.

  **Node 6: Global Priority**
  Do compatriot claims *trump* global needs, apply only after a *global minimum* is met, or merely *break ties*?
  *   **Trump:** Go to Node 7.
  *   **Global Minimum:** Go to **Leaf 3**.
  *   **Break Ties:** Go to **Leaf 4**.

  **Node 7: Fundamental Ground**
  What generates the claim: *shared coercion*, *reciprocity*, *political association*, or *cultural identity*?
  *   **Coercion:** Go to Node 8.
  *   **Reciprocity:** Go to Node 9.
  *   **Political Association:** Go to Node 10.
  *   **Cultural Identity:** Go to Node 10.

  **Node 8: Coercion Scope**
  (If Coercion) Must one be *legally subject* to the state, or merely *affected* by it?
  *   **Legally Subject:** Go to Node 11.
  *   **Affected:** Go to **Leaf 5** (Global Coercion View).

  **Node 9: Reciprocity Demand**
  (If Reciprocity) Is *actual contribution* required, or merely the *capacity* to contribute?
  *   **Actual Contribution:** Go to Node 11.
  *   **Capacity:** Go to Node 12.

  **Node 10: Associative Source**
  (If Association/Culture) Is the binding tie *civic/political* or *ethnic/cultural*?
  *   **Civic:** Go to Node 11.
  *   **Cultural:** Go to Node 11.

  **Node 11: Justice Condition**
  Is the special claim void if the state is *unjust to its own members*?
  *   **Yes (Void):** Go to **Leaf 6**.
  *   **No (Valid):** Go to Node 12.

  **Node 12: Historical Condition**
  Is the special claim void if the community's advantage rests on *historical injustice to outsiders*?
  *   **Yes (Void):** Go to **Leaf 7**.
  *   **No (Valid):** Go to **Leaf 8**.

  *(Note: Paths terminating at Leaves 9-12 are variations of the above based on combinations of Domain and Force not fully exhausted in the main trunk, see Leaf Key below).*

  ### III. The Leaves (Named Positions)

  1.  **Strict Cosmopolitan Egalitarianism:** (Node 1: No). No special claims exist; all individuals count equally regardless of borders.
  2.  **Individual Partialism Only:** (Node 2: Individual + Node 3: Care). The state must be impartial, but individuals may care more for their own (a strict division of moral labor).
  3.  **Global Sufficientarianism:** (Node 6: Global Minimum). Special claims exist but are suspended until everyone globally reaches a decent threshold.
  4.  **Weak Cosmopolitanism:** (Node 6: Break Ties). Compatriots matter slightly more, but only when global and local needs are otherwise equal.
  5.  **Global Coercion View:** (Node 8: Affected). If you are affected by a state's coercion (even from outside), you are owed justice by it (blurs compatriot/stranger line).
  6.  **Conditional Patriotism:** (Node 11: Yes). Special obligations exist but dissolve if the state violates the rights of its own members.
  7.  **Historical Restitution View:** (Node 12: Yes). Special obligations are negated if the compatriot group benefits from past aggression against outsiders.
  8.  **Liberal Nationalism:** (Node 7: Culture + Node 10: Cultural + Node 12: No). Cultural identity grounds distributive partiality, provided history is clean.
  9.  **Civic Patriotism:** (Node 7: Association + Node 10: Civic + Node 12: No). Political participation grounds partiality, independent of culture.
  10. **Coercion-Based Statism:** (Node 7: Coercion + Node 8: Subject + Node 12: No). Shared subjection to law grounds distributive justice, limited to citizens/subjects.
  11. **Fair-Play/Reciprocity View:** (Node 7: Reciprocity + Node 9: Actual Contribution). Only those who contribute to the scheme are owed special distribution.
  12. **Border Exclusivism:** (Node 4: Membership + Node 5: Permitted). States may exclude strangers but have no duty of distributive partiality to insiders (a rare, libertarian-leaning view).

  ### IV. Unoccupied Logical Space

  The following combinations of answers are logically possible but remain unoccupied in the literature:

  1.  **Individual Duty + State Permission:** (Node 2: Individual/Required + Node 4: State/Permitted).
      *   *Status:* **Undefended.** It is unattractive to require individuals to favour compatriots while forbidding the state from structuring institutions to do the same. It creates a moral schism between private and public reason.
  2.  **Cultural Ground + Membership Only:** (Node 7: Culture + Node 4: Membership + Node 5: Distribution/No).
      *   *Status:* **Unattractive.** This view licenses ethnic exclusion at the border but denies any special duty to support the welfare of co-ethnics inside. It treats culture as a club good for exclusion but not a basis for care.
  3.  **Lexical Priority + Global Floor:** (Node 6: Trump + Node 6: Floor).
      *   *Status:* **Incoherent.** One cannot claim compatriot interests *always* trump global interests while also claiming they only apply *after* a global floor is met. These are mutually exclusive priority rules.
  4.  **Reciprocity (Actual) + Disabled Compatriots:** (Node 9: Actual + Leaf 11).
      *   *Status:* **Incoherent/Rejected.** A view that strictly requires actual contribution cannot account for obligations to children or the severely disabled without ad-hoc exceptions. Most reciprocity theorists move to "Capacity" (Node 9) to avoid this.

  ### V. Case Testing

  Apply the following cases to the tree to see which Leaf they select.

  **Case 1: A long-term resident who lacks citizenship.**
  *   **Path:** Node 1 (Yes) → Node 7 (Ground).
  *   **Result:**
      *   *Coercion-Based Statism (Leaf 10):* **Yes.** They are legally subject.
      *   *Liberal Nationalism (Leaf 8):* **No.** They lack the cultural tie.
      *   *Fair-Play View (Leaf 11):* **Yes.** If they contribute via taxes/law-abidingness.
      *   *Border Exclusivism (Leaf 12):* **No.** They lack membership status.
  *   *Discrimination:* The tree separates Coercion views from Cultural views clearly here.

  **Case 2: A compatriot who is a net contributor to a scheme that is unjust to a minority of compatriots.**
  *   **Path:** Node 11 (Justice Condition).
  *   **Result:**
      *   *Conditional Patriotism (Leaf 6):* **No Claim.** The injustice voids the obligation.
      *   *Liberal Nationalism/Statism (Leaf 8/10):* **Claim Valid.** Usually, these views do not void obligations due to internal injustice unless it reaches a threshold of illegitimacy.
  *   *Discrimination:* Separates views based on the conditionality of domestic justice.

  **Case 3: A compatriot living abroad who has opted out of the scheme.**
  *   **Path:** Node 7 (Ground) → Node 8 (Coercion) / Node 9 (Reciprocity).
  *   **Result:**
      *   *Coercion-Based Statism (Leaf 10):* **No Claim.** They are no longer legally subject.
      *   *Liberal Nationalism (Leaf 8):* **Claim Valid.** Cultural tie persists.
      *   *Fair-Play View (Leaf 11):* **No Claim.** They are not contributing.
  *   *Discrimination:* Separates Coercion/Reciprocity grounds from Cultural grounds.

  **Case 4: A young child or severely cognitively disabled compatriot.**
  *   **Path:** Node 9 (Reciprocity Demand).
  *   **Result:**
      *   *Fair-Play (Actual Contribution) (Leaf 11):* **No Claim.** They cannot contribute. (View often collapses here).
      *   *Fair-Play (Capacity) / Associative (Leaf 9/10):* **Claim Valid.** They have capacity or are part of the association.
  *   *Discrimination:* Tests the coherence of Reciprocity views.

  **Case 5: A compatriot whose advantage rests on a historical injustice done to foreigners.**
  *   **Path:** Node 12 (Historical Condition).
  *   **Result:**
      *   *Historical Restitution View (Leaf 7):* **No Claim.** The debt to outsiders cancels the claim of insiders.
      *   *Standard Liberal Nationalism (Leaf 8):* **Claim Valid.** History does not negate current associative duties.
  *   *Discrimination:* Isolates the role of historical justice in current obligations.

  **Case 6: Future members of the political community (who will bear costs we impose now).**
  *   **Path:** Node 7 (Ground) → Node 9 (Reciprocity).
  *   **Result:**
      *   *Reciprocity Views:* **Problematic.** They cannot contribute yet.
      *   *Associative/Cultural Views:* **Claim Valid.** They are part of the trans-generational project.
  *   *Discrimination:* Highlights the temporal scope of the "Ground."

  ### VI. Instrument Limitations & Analysis

  **Indistinguishable Leaves:**
  The tree cannot fully separate **Leaf 9 (Civic Patriotism)** and **Leaf 10 (Coercion-Based Statism)** in all instances. Both often rely on legal subjection and political participation. The distinction relies on whether the *value* is the freedom from coercion (Statism) or the value of the political relationship itself (Patriotism). In practice, they often yield the same policy recommendations for citizens, diverging only on residents (Case 1).

  **The "Most Work" Node:**
  **Node 7 (Fundamental Ground)** does the most work in the whole instrument.
  *   *Reasoning:* While Node 1 (Existence) creates the biggest split, Node 7 determines the *scope* of the community (who counts), the *conditionality* of the claim (justice/history), and the *durability* of the claim (expats/future generations). Your answer to Node 7 effectively predicts your answer to Nodes 8, 9, 10, 11, and 12. It is the substantive engine of the tree; the other nodes are largely elaborations of the consequences of the chosen Ground.
