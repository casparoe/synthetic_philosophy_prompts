      *   *Claim:* If $A$, $B$, and $C$ are each sufficient for $E$, then none are causes of $E$ because $E$ happens anyway without $A$ (due to $B$).
      *   *Philosophical Concept:* Causal Overdetermination (Preemption vs. Overdetermination).
