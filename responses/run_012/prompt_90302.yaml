      *   *Critique:* Most philosophers and historians reject the conclusion that overdetermining factors aren't causes. They are *causes*, just not *necessary conditions* in a strict counterfactual sense. Marcus is applying a strict "but-for" test incorrectly to a scenario of sufficiency.
