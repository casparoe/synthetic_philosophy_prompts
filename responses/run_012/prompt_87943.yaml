answer: |-
  You have identified one of the most persistent and vexing problems in moral philosophy, anthropology, and political theory. You are correct that existing terms like "primitivism" or "the noble savage" describe the *content* of the idealization (the image of the other) but fail to capture the *logical structure* of the argument (the contradiction between the professed relativism and the actual universalism).

  There is no single, canonical noun for this specific logical pattern (in the way "ad hominem" names a fallacy), but it is a well-documented problem. In critical theory and anthropology, it is most rigorously discussed under the heading of **crypto-normativity**. In sociology, the attitude is sometimes called **xenocentrism**. However, neither fully captures the *performative contradiction* you have isolated.

  If we are to name the *logical move* itself—the act of using a particular culture to critique one's own while denying the universal status of the values used to do so—I propose the term **"The Alibi of Alterity."**

  Below is an analysis of why this pattern lacks a single name, the existing terms that come close, a definition of the proposed term, and an examination of the tension you described.

  ### 1. Existing Terminology and Why It Falls Short

  *   **Cultural Relativism:** As you noted, strict relativism suspends judgment. It says, "Their way is different, not worse." Your pattern *judges*, so it is not relativism.
  *   **Ethnocentrism:** This is judging others by *our* standards. Your pattern judges *us* by *their* (alleged) standards.
  *   **Xenocentrism:** Sociologists use this to describe a preference for the products, styles, or ideas of another culture over one's own. This names the *attitude* but not the *logical contradiction*. One can be xenocentric without claiming to be a relativist.
  *   **Primitivism / The Noble Savage:** These name the *mythological content* (the belief that the past or the distant is purer). They do not name the *argumentative structure*. A primitivist can openly say, "Simplicity is universally good." Your pattern is more subtle: it says, "There is no universal good, but look how good their simplicity is."
  *   **Crypto-normativity:** This is the strongest existing term, primarily from Critical Theory (e.g., debates between Habermas and Foucault). It refers to making normative judgments while claiming to merely describe or analyze, thereby hiding the moral standard being used. This fits your description perfectly, but it is a broad category that applies to many critiques, not just cross-cultural ones.

  ### 2. Proposed Name: The Alibi of Alterity

  I propose **"The Alibi of Alterity"** to name this specific rhetorical and logical pattern.

  **Definition:**
  *The Alibi of Alterity* is a rhetorical move in which a critic invokes a distant or different culture (Alterity) to provide an "alibi" for a universal moral claim they are unwilling to defend as universal. The other culture functions as a mirror that reflects a value the critic holds, but the critic attributes the value to the other culture to avoid the charge of ethnocentrism.

  **The Logical Structure:**
  1.  **Explicit Premise:** Moral values are culturally relative (there is no universal standard).
  2.  **Descriptive Claim:** Culture X practices Y (e.g., communal child-rearing).
  3.  **Implicit Premise:** Y is objectively desirable (a universal standard).
  4.  **Conclusion:** Our society is deficient because we do not practice Y.

  **The Contradiction:** Premise 1 denies the validity of Premise 3. The "Alibi" is the use of Culture X to shield the critic from the responsibility of defending Premise 3. If challenged, the critic can retreat to Premise 1 ("I'm not saying it's universally good, just that *they* do it"); if pressing the critique, they rely on Premise 3 ("But isn't it obvious Y is better?").

  ### 3. Analysis of the Tension

  You asked for the exact shape of the tension: what it presupposes, when it is legitimate, and what a non-hypocritical version looks like.

  #### A. What does the move presuppose?
  Despite its relativist veneer, *The Alibi of Alterity* presupposes **Universal Human Nature** or **Objective Human Goods**.
  *   **Shared Capacity:** It assumes that the "other" practice satisfies a need or potential that exists in *us* as well (e.g., the need for community, the capacity for freedom). If we were truly different species with different telos, their practice would be irrelevant to us.
  *   **Hidden Realism:** It assumes that moral values are not *created* by cultures but *discovered* by them. The critic treats the other culture as having "found" something (freedom, dignity) that we have "lost." This implies these things exist independently of culture to be found.

  #### B. When is the critique legitimate?
  The critique is legitimate only when the critic drops the relativist pretense and argues for the **universal validity of the value**.
  *   **Legitimate:** "I believe that human flourishing requires communal bonding. This is a universal claim. The Cannibals achieve this better than we do. Therefore, in this specific regard, their society is more conducive to flourishing."
  *   **Illegitimate (The Alibi):** "There is no right way to live. But the Cannibals live communally, which shows how cold and isolated we are."

  The move becomes intellectually honest when the critic admits they are making a universal claim. The "other" culture then serves as *evidence* for the universal claim (an existence proof), rather than the *source* of the value.

  #### C. What would a non-hypocritical version look like?
  To avoid *The Alibi of Alterity*, a critic has two honest paths:

  1.  **Explicit Universalism:**
      Argue that certain values (e.g., reduction of suffering, autonomy, community) are good for all humans. Use the other culture as a case study to show that these values are achievable in different ways. This was actually **Montaigne's** position. He was not a modern relativist; he was a **Natural Law** theorist. He believed there *was* a universal standard (Nature/Reason), and he argued the Cannibals were closer to Nature than the Europeans. He did not say "their way is good because it is theirs"; he said "their way is good because it is *natural*."

  2.  **Strict Immanent Critique:**
      Critique your own society solely by its *own* stated standards, without invoking the other society as superior.
      *   *Example:* "Our society claims to value individual freedom, but our economic structures create dependency. We are failing by our own lights."
      *   This avoids using the other culture as a mirror. The other culture might be mentioned as a contrast, but not as the authority for the judgment.

  ### 4. Why Montaigne is Often Misread
  Your reading of Montaigne touches on a historical irony. Montaigne is often taught as the father of cultural relativism, but in "Of Cannibals," he is arguably doing the opposite. He relies on the Stoic concept of **Natural Law**.
  *   **The Relativist Reading:** "Who knows what is barbarous? Maybe we are the barbarians." (Implies no standard).
  *   **The Natural Law Reading:** "There is a standard (Nature). We have corrupted it with art and convention. The Cannibals, lacking our corruption, are closer to the universal laws of nature." (Implies a universal standard).

  The pattern you are encountering in modern readings of Montaigne is often a projection of *our* relativism onto *his* naturalism. We want to use the Cannibals to critique ourselves without committing to Natural Law, so we engage in *The Alibi of Alterity*.

  ### Summary
  The pattern you have identified is the **Performative Contradiction of Relativist Critique**. It relies on **Crypto-normativity**. I propose calling the specific rhetorical move **The Alibi of Alterity**.

  It is a tension between the **desire to judge** (which requires a universal standard) and the **desire to be tolerant** (which requires suspending universal standards). The "other" culture is used to bridge this gap, serving as the authority for the judgment so the critic does not have to claim authority themselves. A honest critique must either defend the universal value openly (Universalism) or restrict judgment to the society's own internal logic (Immanent Critique).
  You have identified a precise and sophisticated logical tension that sits at the heart of modern anthropology, moral philosophy, and post-colonial critique. You are correct that terms like "primitivism" or "the noble savage" describe the *content* of the idealization (the image of the other) but fail to capture the *logical structure* of the argument (the contradiction between the professed relativism and the actual universalism).

  There is no single, canonical noun for this specific logical pattern (in the way "ad hominem" names a fallacy), but it is a well-documented problem. In critical theory and anthropology, it is most rigorously discussed under the heading of **crypto-normativity**. In sociology, the attitude is sometimes called **xenocentrism**. However, neither fully captures the *performative contradiction* you have isolated.

  If we are to name the *logical move* itself—the act of using a particular culture to critique one's own while denying the universal status of the values used to do so—I propose the term **"The Alibi of Alterity."**

  Below is an analysis of why this pattern lacks a single name, the existing terms that come close, a definition of the proposed term, and an examination of the tension you described.

  ### 1. Existing Terminology and Why It Falls Short

  *   **Cultural Relativism:** As you noted, strict relativism suspends judgment. It says, "Their way is different, not worse." Your pattern *judges*, so it is not relativism.
  *   **Ethnocentrism:** This is judging others by *our* standards. Your pattern judges *us* by *their* (alleged) standards.
  *   **Xenocentrism:** Sociologists use this to describe a preference for the products, styles, or ideas of another culture over one's own. This names the *attitude* but not the *logical contradiction*. One can be xenocentric without claiming to be a relativist.
  *   **Primitivism / The Noble Savage:** These name the *mythological content* (the belief that the past or the distant is purer). They do not name the *argumentative structure*. A primitivist can openly say, "Simplicity is universally good." Your pattern is more subtle: it says, "There is no universal good, but look how good their simplicity is."
  *   **Crypto-normativity:** This is the strongest existing term, primarily from Critical Theory (e.g., debates between Habermas and Foucault). It refers to making normative judgments while claiming to merely describe or analyze, thereby hiding the moral standard being used. This fits your description perfectly, but it is a broad category that applies to many critiques, not just cross-cultural ones.

  ### 2. Proposed Name: The Alibi of Alterity

  I propose **"The Alibi of Alterity"** to name this specific rhetorical and logical pattern.

  **Definition:**
  *The Alibi of Alterity* is a rhetorical move in which a critic invokes a distant or different culture (Alterity) to provide an "alibi" for a universal moral claim they are unwilling to defend as universal. The other culture functions as a mirror that reflects a value the critic holds, but the critic attributes the value to the other culture to avoid the charge of ethnocentrism.

  **The Logical Structure:**
  1.  **Explicit Premise:** Moral values are culturally relative (there is no universal standard).
  2.  **Descriptive Claim:** Culture X practices Y (e.g., communal child-rearing).
  3.  **Implicit Premise:** Y is objectively desirable (a universal standard).
  4.  **Conclusion:** Our society is deficient because we do not practice Y.

  **The Contradiction:** Premise 1 denies the validity of Premise 3. The "Alibi" is the use of Culture X to shield the critic from the responsibility of defending Premise 3. If challenged, the critic can retreat to Premise 1 ("I'm not saying it's universally good, just that *they* do it"); if pressing the critique, they rely on Premise 3 ("But isn't it obvious Y is better?").

  ### 3. Analysis of the Tension

  You asked for the exact shape of the tension: what it presupposes, when it is legitimate, and what a non-hypocritical version looks like.

  #### A. What does the move presuppose?
  Despite its relativist veneer, *The Alibi of Alterity* presupposes **Universal Human Nature** or **Objective Human Goods**.
  *   **Shared Capacity:** It assumes that the "other" practice satisfies a need or potential that exists in *us* as well (e.g., the need for community, the capacity for freedom). If we were truly different species with different telos, their practice would be irrelevant to us.
  *   **Hidden Realism:** It assumes that moral values are not *created* by cultures but *discovered* by them. The critic treats the other culture as having "found" something (freedom, dignity) that we have "lost." This implies these things exist independently of culture to be found.

  #### B. When is the critique legitimate?
  The critique is legitimate only when the critic drops the relativist pretense and argues for the **universal validity of the value**.
  *   **Legitimate:** "I believe that human flourishing requires communal bonding. This is a universal claim. The Cannibals achieve this better than we do. Therefore, in this specific regard, their society is more conducive to flourishing."
  *   **Illegitimate (The Alibi):** "There is no right way to live. But the Cannibals live communally, which shows how cold and isolated we are."

  The move becomes intellectually honest when the critic admits they are making a universal claim. The "other" culture then serves as *evidence* for the universal claim (an existence proof), rather than the *source* of the value.

  #### C. What would a non-hypocritical version look like?
  To avoid *The Alibi of Alterity*, a critic has two honest paths:

  1.  **Explicit Universalism:**
      Argue that certain values (e.g., reduction of suffering, autonomy, community) are good for all humans. Use the other culture as a case study to show that these values are achievable in different ways. This was actually **Montaigne's** position. He was not a modern relativist; he was a **Natural Law** theorist. He believed there *was* a universal standard (Nature/Reason), and he argued the Cannibals were closer to Nature than the Europeans. He did not say "their way is good because it is theirs"; he said "their way is good because it is *natural*."

  2.  **Strict Immanent Critique:**
      Critique your own society solely by its *own* stated standards, without invoking the other society as superior.
      *   *Example:* "Our society claims to value individual freedom, but our economic structures create dependency. We are failing by our own lights."
      *   This avoids using the other culture as a mirror. The other culture might be mentioned as a contrast, but not as the authority for the judgment.

  ### 4. Why Montaigne is Often Misread
  Your reading of Montaigne touches on a historical irony. Montaigne is often taught as the father of cultural relativism, but in "Of Cannibals," he is arguably doing the opposite. He relies on the Stoic concept of **Natural Law**.
  *   **The Relativist Reading:** "Who knows what is barbarous? Maybe we are the barbarians." (Implies no standard).
  *   **The Natural Law Reading:** "There is a standard (Nature). We have corrupted it with art and convention. The Cannibals, lacking our corruption, are closer to the universal laws of nature." (Implies a universal standard).

  The pattern you are encountering in modern readings of Montaigne is often a projection of *our* relativism onto *his* naturalism. We want to use the Cannibals to critique ourselves without committing to Natural Law, so we engage in *The Alibi of Alterity*.

  ### Summary
  The pattern you have identified is the **Performative Contradiction of Relativist Critique**. It relies on **Crypto-normativity**. I propose calling the specific rhetorical move **The Alibi of Alterity**.

  It is a tension between the **desire to judge** (which requires a universal standard) and the **desire to be tolerant** (which requires suspending universal standards). The "other" culture is used to bridge this gap, serving as the authority for the judgment so the critic does not have to claim authority themselves. A honest critique must either defend the universal value openly (Universalism) or restrict judgment to the society's own internal logic (Immanent Critique).
