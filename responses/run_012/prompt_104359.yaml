answer: |-
  **TO:** Board of Education Members
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding K–2 Reading Screening Contract

  **Recommendation**
  I recommend that the Board **reject** the proposed three-year contract for the genetic-based reading screening package. While the vendor's underlying premise—that biology influences reading acquisition—is scientifically sound, their specific tool is not validated for use in our district, poses significant equity risks, and threatens to deny effective intervention to students who need it.

  **The Valid Core of the Vendor's Argument**
  We must acknowledge what the vendor gets right. Reading disability is not purely environmental. Decades of research confirm that genetic factors contribute significantly to reading ability and disability. It is true that some children struggle more intensely than others despite high-quality instruction. It is also true that family history is a strong predictor of reading outcomes. Parents, myself included, often seek a biological explanation when a child struggles despite tutoring, hoping it will unlock the right support rather than implying failure of effort or instruction.

  The vendor's claim that different children may require different intensities of intervention is also reasonable. A one-size-fits-all Tier 2 model does not work for every child. If we had a medically validated tool that could reliably predict which students need specialized clinical placement versus standard tutoring, it would be a breakthrough.

  **Where the Science Breaks Down**
  However, there is a massive gap between "reading is heritable" and "this swab tells us how to teach this specific child." The vendor's claims do not survive scrutiny in three critical areas.

  First, **group statistics do not equal individual prediction.** Heritability estimates (like the 60% cited) describe populations, not individuals. Currently, no genetic panel exists that can predict with clinical certainty how a specific six-year-old will respond to tutoring. The vendor's claim that tutoring effects are "near zero" for kids above their cutoff is based on aggregate data. Applying this to an individual child risks a self-fulfilling prophecy. If we label a child "neurodevelopmental" and remove them from Tier 2 tutoring based on a DNA swab, we may deny them instruction that would have worked, simply because we stopped trying.

  Second, **the validation sample does not match our district.** This is the most decisive factor. The vendor's validation sample is mostly of European ancestry. Genetic risk scores perform poorly when applied to populations different from the training data. Our district is diverse. Using a tool validated on European populations to make educational decisions for our students is scientifically invalid and potentially discriminatory. We cannot accept a screening tool that is mathematically less accurate for certain demographics within our own schools.

  Third, **the binary labeling is educationally dangerous.** Sorting children into "neurodevelopmental" and "opportunity-gap" buckets implies that the latter group is limited by environment and the former by biology. In reality, struggling readers usually face a combination of both. By categorizing a child as "neurodevelopmental," we risk lowering expectations. By categorizing a child as "opportunity-gap," we may overlook underlying cognitive processing issues. We should be diagnosing specific skill deficits (phonemic awareness, fluency, comprehension), not assigning broad biological destinies.

  **Privacy and Ethics**
  Collecting genetic data from minors introduces liability and privacy concerns that extend beyond FERPA. We are not equipped to store or interpret biological data, nor should we be. If this data is breached or misinterpreted, the consequences for these children could follow them beyond their time in our district.

  **Alternative Path Forward**
  Rejecting this contract does not mean maintaining the status quo. We know our current screening needs improvement. We should invest in robust, behavioral screening tools that measure actual reading skills rather than genetic proxies. We should also expand our professional development to ensure Tier 2 intervention is high-quality enough to test whether a child truly responds before assuming they cannot.

  **Timeline and Next Steps**
  1.  **Vote:** I move that we vote to reject this contract at next Tuesday's meeting.
  2.  **Interim Plan:** Until a new screening package is adopted, we will continue using our existing behavioral screening measures while increasing monitoring of student progress in Tier 2.
  3.  **RFP Process:** I recommend we direct administration to draft a Request for Proposals for a new K–2 screening tool by January. This RFP must require vendors to demonstrate validity across diverse ancestral populations and prohibit the use of genetic sampling for individual educational placement.
  4.  **Review:** We will review proposals in the spring and aim to have a validated, equitable screening system in place for the next school year.

  **Conclusion**
  We have a duty to adopt tools that work for all 6,000 students in this district. This vendor offers a compelling narrative, but the tool is not ready for prime time, particularly for a district with our demographics. We cannot build our special education placement and intervention strategy on science that is statistically invalid for our students. We should invest in evidence-based instruction and behavioral screening, not biological determinism.

  I look forward to discussing this further on Tuesday.
