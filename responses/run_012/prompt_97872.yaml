answer: |-
  The coffee in the seminar room had gone cold hours ago. The chalkboard behind us was still smeared with the day's lecture on enclosure, but neither of us was looking at it. We were looking at the printed draft of my chapter, specifically page twelve.

  "It's the adjective," Elena said, tapping the paper. "‘Unjust.' You've written that Justice Harcourt's order to have the servant Mary flogged for insolence was unjust."

  "And you think I should write that it was ‘consistent with customary discipline'?" I asked.

  "I think you should write that it was consistent with the normative framework Harcourt inhabited," she said, leaning back. "When you write ‘unjust,' you aren't describing the past. You're holding a trial in absentia. You're smuggling a present-day verdict into the past tense."

  "Refusing to write it is also a verdict," I countered. "It's a verdict that says Harcourt's authority outweighs Mary's pain. If I sanitize the language to protect myself from anachronism, I'm achieving neutrality only by abdication. I'm pretending I don't know what pain is."

  "But do you know what justice was?" Elena pressed. "You're measuring 1740 against 2024. That's not history; that's moral narcissism. Our task is to reconstruct the world in which that flogging made sense to the man wielding the whip. If you call it unjust, you stop asking why he thought it was necessary."

  "I don't stop asking why," I said. "I can explain his reasoning and still condemn the act. Understanding an action doesn't require suspending judgment on it. In fact, judgment is part of what understanding consists in. We understand slavery as an economic system while maintaining it was a moral catastrophe. Why is the household different?"

  "Because slavery is a settled category for us," Elena said. "Provincial justice isn't. And even then, was it unjust? By whose standards? You assume the standards of their own time were a single, stable thing. They weren't. The servant disagreed. The parish overseer might have disagreed. The assizes might have overturned it. If you call it unjust, you aren't applying our standards; you're picking a winner in their own contest."

  I paused. That was a concession I hadn't expected her to make so readily. "Okay. So the normative world was contested. Mary thought it was unjust. Harcourt thought it was just. If I write ‘unjust,' I am aligning with Mary."

  "Exactly," Elena said. "But you're aligning with her using *your* voice, not hers. You're ventriloquizing her grievance through your moral vocabulary. Why not show the contest? Show that she appealed to the parish and was ignored. Let the archive speak the conflict."

  "Because the archive is Harcourt's notebook," I said. "Mary's voice is there only as a reflection of his ink. If I simply report that he ordered the flogging and note that servants sometimes resisted, I have described the mechanism of power without acknowledging its weight. The choice of what to narrate and what to leave silent is already an evaluation that no methodological scruple can remove. By choosing to tell this story at all, I've decided it matters. If I decide it matters, I have to decide why."

  "It matters because it reveals the structure of authority," Elena said. "Not because it offends your sensibilities."

  "But my sensibilities are the lens," I insisted. "The standards of our own time are not merely an obstacle. They are part of what makes the past legible as past. We see the flogging as violent because we stand at a distance where violence looks different. If I pretend I don't see it that way, I'm lying."

  Elena rubbed her temples. "I'm not asking you to lie. I'm asking you to quarantine the lie. Look, propose a device. A two-column chapter. Main text narrates the past in its own terms—Harcourt's logic, the legal precedents, the social hierarchy. The parallel commentary, the margins, houses the present-day assessment. You can call it unjust there. You can mourn Mary there. But keep the reconstruction pure."

  I looked at the draft. "A two-column chapter. So the history happens on the left, and the conscience on the right?"

  "It prevents the contamination," she said. "It allows the reader to see how the past worked without being told immediately how to feel about it."

  "It collapses," I said. "It suggests that the moral assessment isn't part of the historical truth. It treats ethics as a sidebar. If I believe the flogging was unjust, that judgment should inform how I describe the notebook, the ink, the hand that wrote the order. It changes the texture of the narrative. If I quarantine it, I'm telling the reader that the ‘real' history is the neutral part, and the moral part is just opinion. It costs more than it saves. It splits the voice so severely that neither side trusts the other."

  "Or," Elena said, "it honors the distance. It admits that you cannot fully inhabit their world and ours simultaneously without schism."

  "But there is no schism," I argued. "There is only me, writing now, about them then. There is no view from nowhere. If I write ‘Harcourt ordered the flogging,' I have already evaluated that order as significant. Why is adding ‘unjust' the step that breaks the method? Is there a principled difference between explaining an action and excusing it?"

  "Yes," Elena said sharply. "Explanation seeks causes. Excuse seeks absolution. But condemnation seeks closure. If you condemn Harcourt, you finish the case. You don't need to understand him anymore. He's just a villain."

  "I'm not condemning the person; I'm condemning the practice," I said. "And I'm not finishing the case. I'm opening it to the reader. If I don't name the injustice, I'm effectively excusing the practice by treating it as merely ‘different.' There is a difference between cultural relativism and moral cowardice."

  Elena sighed, picking up her cold coffee. "I hear you. And I concede that silence is not neutral. But I worry that your judgment overrides the complexity. If you say it was unjust, the reader stops looking for the ways Mary might have navigated that injustice, the ways she might have found dignity within a system you've already damned. You flatten her agency by making her solely a victim of your outrage."

  "That's a risk," I admitted. "But the risk of flattening her into a data point in Harcourt's normative framework is higher. You want me to reconstruct the world on its own terms. But whose terms? Harcourt's? If I stick strictly to the archive, I am inevitably writing Harcourt's history. My moral vocabulary is the only tool I have to pry Mary out of his notebook."

  "So you admit it's a tool," Elena said. "Then treat it as a tool, not a truth. Use it to pry, but don't paint the pry bar as the landscape."

  "I can't," I said. "Because the landscape includes me. I am standing in it."

  We sat in silence for a moment. The disagreement wasn't about the flogging. We both hated the flogging. The disagreement was about what history is for.

  "Here is where we are stuck," Elena said finally. "You believe the historian's duty is to the dead who suffer, even if it requires borrowing vocabulary they didn't have. I believe the historian's duty is to the dead as they were, even if it requires withholding vocabulary they needed."

  "And neither of us can prove the other wrong," I said.

  "No," Elena said. "Because you think history is a court of appeal. I think it's a map. You want to correct the past. I want to locate it."

  "But the map tells people where to walk," I said. "If you map a minefield without marking the explosives because ‘explosive' is an anachronistic term for the locals, people get blown up."

  "But if you mark every patch of dirt as a minefield because it looks dangerous to you," Elena replied, "no one learns how the locals walked across it without dying. You lose the knowledge of their survival."

  "So we agree," I said, "that the sentence stays?"

  "We agree," she said, smiling tiredly, "that the sentence stays, but I'm writing a footnote arguing that the word ‘unjust' is a category error. And you're going to let me."

  "I'll let you," I said. "But I'm keeping the adjective."

  "Then we're done," she said.

  "For tonight," I said.
