answer: |-
  ### Scratchpad: Philosophical Analysis of the Case

  **1. The Strongest Hempelian (Instance-Based) Answer**
  On a strict Hempelian satisfaction criterion, confirmation is a logical relation between a hypothesis $H$ and an evidence statement $E$. $H$ is "All ravens are black" ($\forall x (Rx \rightarrow Bx)$), which is logically equivalent to "All non-black things are non-ravens" ($\forall x (\neg Bx \rightarrow \neg Rx)$).
  *   **The Coordinator's Proposal:** Any entry in Protocol B is, by definition, a non-black bird ($\neg B$). If the species identification concludes it is not a raven ($\neg R$), the entry satisfies the contrapositive. Logically, 10,000 such entries provide 10,000 instances of confirmation. The sheer number of instances technically increases the degree of confirmation in a Nicod-style criterion, regardless of how the objects were selected.
  *   **The Albino:** Hempel treats evidence as propositions. If the record states "This is a non-black non-raven," it confirms $H$. If the record states "This is a non-black raven," it falsifies $H$. The physical object is irrelevant; only the accepted description matters.
  *   **Weakness:** This ignores the *selection procedure*. If the protocol forces us to look only at non-black things, we are not testing the risk that a raven might be non-black; we are merely cataloging non-black things.

  **2. The Strongest Likelihood-Based (Comparative) Answer**
  Confirmation is measured by the likelihood ratio: how much more probable the evidence is given $H$ than given $\neg H$.
  *   **The Coordinator's Proposal:** Protocol B selects on color ($\neg B$). Therefore, $P(\text{Entry is } \neg B | H) = 1$ and $P(\text{Entry is } \neg B | \neg H) = 1$. The color provides no discrimination. The only variable is species ($R$ vs $\neg R$). If non-black ravens are rare (even if they exist), finding 10,000 non-black non-ravens is highly probable under *both* $H$ and $\neg H$. The likelihood ratio is near 1. The evidential weight is negligible, not because of the object type (apple vs. bird), but because the sampling design fixes the relevant property (color).
  *   **The Albino:** If identified as a non-raven, the *report* supports $H$ (since $H$ makes non-black ravens impossible). If identified as a raven, it falsifies $H$. The likelihood analysis highlights that the *reliability of identification* matters. A misidentified albino generates a high likelihood ratio for $H$ based on false data.
  *   **Strength:** This accounts for the protocol. It shows that confirmation depends on the probability of obtaining the evidence under the specific sampling constraints.

  **3. The Precise Point of Divergence**
  The divergence occurs on the **relevance of the sampling protocol**.
  *   **Hempel:** The protocol is methodological context, external to the logical relation between proposition $E$ and hypothesis $H$. As long as $E$ asserts $\neg B$ and $\neg R$, it confirms.
  *   **Likelihood:** The protocol determines the probability space. If the protocol ensures $\neg B$, then $\neg B$ carries no information about $H$. The confirmation must come from the rarity of $\neg R$ within the $\neg B$ class under $\neg H$.
  *   **The Albino Crux:** For Hempel, the contradiction is between the *object* and the *record*. For Likelihood, the contradiction is between the *true likelihood* (based on the object) and the *calculated likelihood* (based on the record). The case forces the student to decide whether confirmation tracks the world or our descriptions of it.

  ***

  ### Deliverable 1: Exam Question

  **PHI 450: Evidence and Confirmation — Final Assessment**

  **Instructions:** Answer the following question in essay format. You have ninety minutes. You may assume the case description below is the complete statement of facts; do not introduce outside examples (such as green apples or grue) except as brief contrasts. Citations and bibliographic references are not required and will not be graded. Your grade depends on the precision of your philosophical analysis of the case provided.

  **The Case: The Ornithological Atlas**
  A regional ornithological atlas recruits volunteers to photograph birds over a single season to test the hypothesis $H$: *All ravens are black.* Volunteers are assigned to one of two mutually exclusive protocols:
  *   **Protocol A (Black-Bird Count):** Submit every bird you judge to be black, with your species identification.
  *   **Protocol B (Non-Black Register):** Submit every bird you judge to be non-black, with your species identification.

  Three features of this design are salient:
  1.  **The Coordinator's Proposal:** Since every entry in Protocol B is a non-black bird, any entry identified as a non-raven satisfies the contrapositive of $H$ ("All non-black things are non-ravens"). The project coordinator proposes to strengthen support for $H$ by aggressively recruiting volunteers to add ten thousand further entries to the Protocol B register.
  2.  **The Albino Entry:** A Protocol B volunteer photographs an albino raven. Judging it to be non-black but unsure of the species, they file it as a "large white corvid of unidentified species." The register thus contains a record that, described by its color and tentative species, is a confirming instance of the contrapositive; yet, described by its actual biology, it is a counterexample to $H$.
  3.  **Protocol Sensitivity:** Protocol B is structurally capable of collecting a counterexample (a non-black raven), whereas Protocol A is not (since a counterexample must be non-black, and Protocol A excludes non-black birds).

  **Essay Prompt:**
  (a) Evaluate the Coordinator's proposal. Does adding ten thousand non-black non-raven entries to Protocol B genuinely strengthen support for $H$? Explain why the selection procedure matters for evidential weight. (8 marks)
  (b) Analyze the Albino Entry. Does this record confirm or falsify $H$? Use this case to argue whether confirmation attaches to physical objects or to the descriptions accepted as evidence. (7 marks)
  (c) Compare Protocol A and Protocol B. Which protocol provides a more severe test of $H$? Explain how this relates to the capacity for falsification versus the accumulation of positive instances. (5 marks)
  (d) Conclude by stating whether the Raven Paradox is best treated as a defect in the satisfaction criterion, a symptom of treating confirmation as binary rather than comparative, or an artifact of unstated sampling assumptions. Justify your position using the case above. (5 marks)

  ***

  ### Deliverable 2: Model Answer

  **The Weight of the Register: Protocol and Description in Confirmation**

  The Ornithological Atlas case demonstrates that logical equivalence is insufficient for evidential weight; the procedure by which evidence is generated determines its probative value. While the Coordinator's proposal is logically sound under a naive satisfaction criterion, it fails under a likelihood analysis because the protocol fixes the relevant variable. Furthermore, the Albino Entry reveals that confirmation attaches to accepted descriptions, not noumenal objects, while the comparison of Protocols A and B highlights the asymmetry between verification and falsification.

  Regarding the Coordinator's proposal, adding ten thousand entries to Protocol B yields diminishing evidential returns. Under a Hempelian satisfaction criterion, every non-black non-raven confirms the contrapositive of $H$. However, this ignores the selection rule. Protocol B selects *only* non-black birds. Consequently, the probability of observing a non-black bird is 1.0, regardless of whether $H$ is true or false. The color of the bird provides no discrimination between hypotheses. The only variable is the species identification. Unless non-black ravens are expected to be common among non-black birds (which would make $H$ unlikely to begin with), finding non-black non-ravens is expected under both $H$ and $\neg H$. Therefore, the likelihood ratio approaches 1. The sheer number of instances does not compensate for the lack of risk in the sampling design. The Coordinator mistakes the accumulation of data for the severity of the test.

  The Albino Entry clarifies the ontological status of evidence. Described as a "white corvid," the entry confirms $H$; described as an "albino raven," it falsifies $H$. This suggests confirmation attaches to the *proposition accepted into the evidence corpus*, not the physical object itself. If the scientific community accepts the volunteer's description, $H$ is supported relative to that corpus. If the error is corrected, $H$ is destroyed. This creates a tension: confirmation is relative to our epistemic access (descriptions), yet truth is relative to the world (objects). A robust theory of confirmation must account for the reliability of the reporting mechanism. In this case, the likelihood of the *report* "non-raven" is high given $H$ (since non-black ravens are impossible), but the truth of the report is false. This shows that high confirmation values can be generated by systematic error if the error is consistent with the hypothesis.

  Comparing the protocols, Protocol B offers a more severe test despite the Coordinator's misuse of it. Protocol A (Black-Bird Count) selects on color $B$. It can never encounter a counterexample, because a counterexample to "All ravens are black" must be a non-black raven. Protocol A is structurally blind to falsification; it can only accumulate positive instances. Protocol B, by selecting on $\neg B$, opens the possibility of finding a raven. If a raven appears in Protocol B, $H$ is immediately falsified. Thus, Protocol B has higher *potential* evidential weight because it risks refutation. Protocol A offers safety but no severity. The paradox arises when we treat the safe accumulation of Protocol B's non-ravens as equivalent to the risky testing of Protocol B's capacity to find ravens.

  In conclusion, the Raven Paradox is best treated as an artifact of unstated sampling assumptions. The standard paradox assumes a random sampling from the universe of objects, where finding a non-black non-raven is improbable. In the Atlas case, the sampling is fixed by color. When the selection procedure is made explicit, the paradox dissolves: non-black non-ravens collected by a non-black-seeking protocol carry little weight because they were guaranteed to be non-black by design. Confirmation is not a binary relation between proposition and hypothesis, but a comparative measure dependent on the probability of the evidence under competing hypotheses, constrained by the method of observation. The Atlas case shows that without specifying *how* the raven was found, we cannot know *what* it confirms.

  ***

  ### Deliverable 3: Marking Scheme

  **Total Marks: 25**

  **1. Evaluation of Coordinator's Proposal (8 Marks)**
  *   **Must-Hit (5 marks):** Student identifies that Protocol B fixes the color variable ($\neg B$), rendering the color uninformative. Argument must rely on the sampling design/selection procedure, not just object type.
      *   *Typical Error:* Claiming 10,000 instances confirm $H$ simply because they satisfy the contrapositive (ignoring protocol).
      *   *Typical Error:* Dismissing the instances solely because they are "non-ravens" (rote green apple response) without referencing the *selection rule*.
  *   **Differentiation (3 marks):** A-grade answers explicitly contrast the logical satisfaction (which holds) with the likelihood weight (which is low/negligible). B-grade answers may note the weight is low but fail to explain *why* the protocol causes this (i.e., $P(E|H) \approx P(E|\neg H)$).

  **2. Analysis of the Albino Entry (6 Marks)**
  *   **Must-Hit (4 marks):** Student argues that confirmation attaches to the *accepted description/record*, not the physical object. Must note the tension between the confirming record and the falsifying object.
      *   *Typical Error:* Insisting the object "really" falsifies $H$ regardless of the record (ignoring the epistemic nature of evidence).
      *   *Typical Error:* Claiming the entry does both simultaneously without resolving the conflict in terms of evidence acceptance.
  *   **Differentiation (2 marks):** A-grade answers discuss the reliability of the reporting mechanism or the distinction between the likelihood of the *report* vs. the truth of the *hypothesis*.

  **3. Protocol Comparison (A vs. B) (5 Marks)**
  *   **Must-Hit (3 marks):** Student identifies Protocol B as capable of falsification (finding a non-black raven) and Protocol A as incapable (blind to counterexamples).
      *   *Typical Error:* Treating both protocols as equivalent because they both collect birds.
      *   *Typical Error:* Arguing Protocol A is better because it collects "positive instances" (misunderstanding falsificationism).
  *   **Differentiation (2 marks):** A-grade answers link this to "severity" or "risk of refutation." B-grade answers may note the difference but fail to connect it to the *value* of the test.

  **4. General Theory of Confirmation (6 Marks)**
  *   **Must-Hit (4 marks):** Conclusion must identify the root issue as **sampling assumptions** or **comparative likelihood** rather than a defect in logic alone. Must explicitly reject the binary/instance-counting view in favor of a procedural one.
      *   *Typical Error:* "Bayesianism solves it" without explaining the role of the protocol in setting the priors/likelihoods.
      *   *Typical Error:* Blaming the Equivalence Condition without offering the sampling alternative.
  *   **Differentiation (2 marks):** A-grade answers synthesize the case details (protocol + albino) to support the theoretical claim. B-grade answers revert to general textbook summaries of the Raven Paradox unrelated to the specific Atlas case.

