prompt: |-
  I'm a software engineer with no philosophy background, so go easy on the jargon. I ran into this Wittgenstein thing, On Certainty, where some of what you believe isn't stuff you could prove or even sensibly doubt -- it's what the doubting turns on. I want a thought experiment built to order here, not a summary of the idea.

  Spec: one proposition, word for word the same claim, that works as a hinge for one person and as an ordinary checkable fact for the other. Same evidence, same stakes, both people sane, honest, and not kidding themselves. And I dont want a grand one like "the external world exists" or "induction works" -- make it a boring concrete claim about one particular person or one particular machine. One paragraph, ordinary situation (workplace, family, whatever), nobody in the story has read any philosophy, no brain-in-a-vat, no imaginary tribes.

  Then the check, because I don't trust a case that just asserts what I asked for. For each person, say what they'd have to give up if the claim turned out false, and whether their inability to doubt it is a fact about them or a fact about the claim -- I genuinely can't tell those apart and that's the actual thing I'm after. Then say what the evidentialist would say, the one who thinks a hinge is just a belief with credence really close to 1 and nothing special about it. Then tell me which single feature of the case is doing the work, whether deleting it (make the claim plainly empirical, or plainly definitional) collapses the asymmetry, and how someone who thinks Wittgenstein is wrong here would attack the case. Skip the bibliography, I'm not going to read it.
