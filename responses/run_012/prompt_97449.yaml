answer: |-
  ### Exam Question

  **Course:** PHIL405 Madhyamaka Thought
  **Section:** Final Examination
  **Time Allowed:** 45 Minutes for this question

  **Question 1**
  Consider the following stipulative four-valued semantics intended to model the *catuṣkoṭi* (tetralemma). The values are **T** (true), **F** (false), **B** (both true and false), and **N** (neither true nor false). The operators are defined as follows:

  *   **Negation:** $\sim T = F$; $\sim F = T$; $\sim B = B$; $\sim N = N$.
  *   **Conjunction:** $T \land x = x$; $F \land x = F$; $B \land B = B$; $B \land N = F$; $N \land N = N$.

  *Note on Negation:* In this context, distinguish between (1) a negation that cancels a predicate but implies an alternative (e.g., "not white" implies "some other color") and (2) a negation that denies the predicate without implying any alternative position (e.g., "there is no color").

  Using this apparatus, evaluate whether Nāgārjuna's rejection of the four corners can be coherently represented within this logic. Specifically, address: (i) whether the tetralemma assigns these values to a single predicate or dissolves the frame itself; (ii) whether the 'both' corner functions as a genuine truth-value or a conjunction of contradictions; (iii) whether the 'neither' corner denies the Law of Excluded Middle or presupposes it; and (iv) how the distinction in the note above bears on whether **N** can represent emptiness.

  **Rubric:** Assessment of formal coherence and philosophical application.

  ***

  ### Model Answer

  The stipulative semantics provided fail to capture the Madhyamaka intent because they reify the logical space that Nāgārjuna seeks to dismantle. While the four values (T, F, B, N) superficially map onto the four corners of the *catuṣkoṭi*, assigning any value to a proposition regarding ultimate reality contradicts the doctrine of emptiness (*śūnyatā*). The formalism treats the rejection of views as itself a view (value N), whereas Madhyamaka treats it as a therapeutic dissolution of the question.

  Regarding the 'both' corner, the table stipulates $\sim B = B$ and $B \land B = B$. This treats 'both' as a stable truth-value, akin to a paraconsistent state. However, for Nāgārjuna, the third corner is not a coherent state of affairs where a thing possesses contradictory natures; it is a *reductio ad absurdum* demonstrating that if things had intrinsic nature, they would entail impossible contradictions. By granting B a stable value, the formalism legitimizes contradiction as an ontological option rather than exposing it as a sign of conceptual error. The conjunction rule $B \land N = F$ further suggests B and N are incompatible values within the same system, yet Madhyamaka argues that if 'both' is incoherent, 'neither' cannot be its logical successor in a linear sequence of values.

  This leads to the status of the 'neither' corner (N). The table assigns N a fixed value where $\sim N = N$. This implies that denying 'neither' returns us to 'neither', creating a closed loop. Philosophically, this suggests the Law of Excluded Middle (LEM) is suspended but replaced by a fourth option. However, N only makes sense relative to T and F. To say "neither true nor false" presupposes the intelligibility of 'true' and 'false' as exhaustive categories. If the Madhyamaka critique holds that T and F are inapplicable to empty phenomena, then N is not a fourth value but a marker of category mistake. The formalism forces N to function as a value, thereby violating the insight that the tetralemma is a ladder to be kicked away, not a house to be inhabited.

  Crucially, the distinction in the note determines whether this logic can function soteriologically. The provided negation is of the first type (cancelling a predicate while implying an alternative value). If I assign value N to proposition $P$, I have asserted that $P$ has the property of being 'neither'. This is a term-negation (*paryudāsa*). Nāgārjuna requires the second type (predicate-negation or *prasajya*), which denies the applicability of the predicate without positing a new state. Emptiness is not the value N; emptiness is the realization that the question "What is the truth value of $P$?" is ill-formed because $P$ lacks intrinsic nature. Because the formalism requires every well-formed formula to take one of the four values, it cannot express a *prasajya* negation. It forces the user to assert N, thereby turning emptiness into a view (*dṛṣṭi*), which Nāgārjuna explicitly rejects in *Mūlamadhyamakakārikā* 13.8.

  Therefore, the apparatus is philosophically inadequate. It successfully models a four-valued paraconsistent logic, but it fails to model the deconstructive praxis of Madhyamaka. It captures the syntax of the tetralemma but misses its semantic dissolution.

  The weakest joint in this argument is the claim that formalism cannot serve a pragmatic purpose. One could plausibly argue that the 'N' value functions as a provisional device (*upāya*) to cure students of dogmatic attachment to T or F. If the goal is dialectical victory rather than ontological description, assigning 'N' allows the Madhyamika to win debates within conventional logic without asserting ultimate truth. This would shift the verdict to argue that the formalism is valid conventionally, even if ultimately untenable.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Pass Threshold:** 13

  **Must-Hit Points (5 marks each):**

  1.  **Engagement with Stipulated Values:** The candidate must explicitly reference the provided truth table rules (e.g., $\sim N = N$ or $B \land N = F$) rather than discussing four-valued logic in the abstract.
      *   *Common Miss:* Ignoring the specific rules and discussing standard Łukasiewicz or Kleene logics instead.
  2.  **Analysis of the 'Both' Corner:** The candidate must distinguish between 'B' as a stable ontological value versus 'B' as a marker of incoherence/absurdity in Nāgārjuna's text.
      *   *Common Miss:* Treating 'B' as a valid paraconsistent state without noting Nāgārjuna's use of it as a *reductio*.
  3.  **Analysis of the 'Neither' Corner:** The candidate must address whether 'N' suspends the Law of Excluded Middle or paradoxically relies on T/F to be defined.
      *   *Common Miss:* Asserting 'N' simply breaks LEM without explaining the dependency of 'neither' on the prior existence of 'true/false'.
  4.  **Application of Negation Distinction:** The candidate must apply the plain-English gloss (term-negation vs. predicate-negation) to explain why assigning value 'N' might violate the concept of emptiness.
      *   *Common Miss:* Using the Sanskrit terms (*paryudāsa/prasajya*) without explaining them, or ignoring the note entirely.
  5.  **Coherent Verdict:** The essay must conclude with a clear stance on whether the formalism succeeds or fails, supported by the preceding analysis.
      *   *Common Miss:* Hedging indefinitely or concluding that "both sides have points" without a final synthesis.

  **Distinction Criteria (A vs. B Grade):**

  *   **B Answer:** Successfully applies the formal rules to the text and identifies that assigning 'N' risks reifying emptiness, but treats the logic as a neutral tool that *could* work if adjusted.
  *   **A Answer:** Identifies that the **crux** is not the values themselves but the act of valuation; argues that the formalism fails *necessarily* because the demand for a truth-value presupposes intrinsic nature (*svabhāva*), which is precisely what is being denied.

  **Examiner's Note:** The difficulty lies in the crux: whether any assignment of truth values can express a *prasajya* negation. Candidates who focus on the labels (T, F, B, N) rather than the act of assignment will cap at a B.
