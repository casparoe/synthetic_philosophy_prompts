  **MEMORANDUM**

  **TO:** Lead Investigator, Aurelio Programme (Tidal Geophysics)
  **FROM:** Research Integrity Office (RIO)
  **DATE:** 14 October 2023
  **SUBJECT:** Research Programme Performance Improvement Plan (PIP-Ref: 88-B)

  **1.0 PURPOSE AND AUTHORITY**
  Pursuant to Institute Policy 14.C (Appraisal of Scientific Research Programmes), the Research Integrity Office (hereinafter "the Office") has completed a heuristic audit of the Aurelio Programme. This document constitutes a formal Performance Improvement Plan. The Programme is hereby notified that its current operational status is classified as Degenerating. This classification follows a review of auxiliary hypothesis modifications recorded in Fiscal Years 2021–2023.

  **2.0 FINDINGS OF DEGENERATION**
  The Office determines that the Programme's protective belt modifications have failed to generate novel empirical content. Specific instances of ad hoc accommodation include:
  2.1 **The Marnau Anomaly:** The introduction of a damping term to absorb residual variance was executed post-observation without prior stipulation of coefficient values.
  2.2 **The Sefridge Anomaly:** The measurement window was widened retroactively to align data with the fixed-frequency commitment.
  2.3 **The Quiet Fortnight Phenomenon:** The Programme accounted for this phenomenon only after the rival Halvorsen Programme had successfully predicted it. Per Policy 14.C, Section 3, predictions pre-empted by competitors constitute negative heuristic performance.

  **3.0 MANDATED REMEDIAL ACTIONS**
  To restore Progressive status, the Aurelio Programme must comply with the following clauses by the deadlines stipulated herein.

  3.1 **Cease Unauthorized Belt Modifications**
  Effective immediately, all adjustments to coupling coefficients must be submitted via Form RIO-9 (Auxiliary Hypothesis Change Request) at least fourteen (14) days prior to data collection. Retroactive belt adjustments are prohibited. The Programme must demonstrate that future belt revisions are not ad hoc by providing evidence that such revisions were theoretically necessitated prior to the anomaly's observation.

  3.2 **Submission of Novel Prediction Schedule**
  The Programme Lead must submit a Timeline of Novel Facts by 30 November 2023. This timeline must list at least three (3) empirical contents that are currently unknown to the Institute Registry and which the Programme's heuristic will predict within the next reporting cycle. Failure to realize these predictions by the stated dates will result in further sanctions.

  3.3 **Hard Core Integrity Reinforcement**
  To ensure methodological stability, the Programme Lead must sign an Affidavit of Hard Core Non-Revision (Form HC-01). This affidavit certifies that the three core commitments (single resonant mode; frequency fixed by rotation; anomaly absorption via coefficients) will be protected more rigidly against empirical counter-examples than in the previous cycle. Any willingness to entertain revisions to these core assumptions will be viewed as instability and penalized under Policy 14.C.

  3.4 **Competitive Benchmarking**
  Future heuristic output will be benchmarked against the Halvorsen Programme. The Aurelio Programme must demonstrate a higher rate of novel fact prediction per fiscal quarter than the Halvorsen Programme. Given the Halvorsen Programme's recent success regarding the Quiet Fortnight, the Aurelio Programme is expected to exceed this baseline immediately.

  **4.0 APPEALS PROCEDURE**
  The Programme Lead may appeal this Degenerating classification within ten (10) business days. Appeals must be submitted in writing and must demonstrate, empirically, that the Programme is currently progressive. Appeals that fail to provide evidence of a positive heuristic shift will be dismissed. The Office's determination regarding what constitutes a "positive heuristic shift" is final.

  **5.0 ACKNOWLEDGEMENT**
  Failure to comply with this Plan may result in the withdrawal of Institute funding and the reclassification of the Programme as Pseudoscientific.

  __________________________
  **Dr. Aris Thorne**
  Director, Research Integrity Office

  __________________________
  **Acknowledged by Programme Lead**
  Date: ________________

  Disposition: Degenerating because the protective belt has absorbed anomalies without predicting facts not already secured by the Halvorsen Programme.
