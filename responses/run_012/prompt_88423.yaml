prompt: |-
  Me and two coworkers are writing the "house style" guide for our company's AI assistant. It's way more articulate than most people, and in tests it can actually change someone's mind — sometimes for the better (people who asked about saving money started saving), sometimes we're not sure (it talked a guy out of a purchase he'd been excited about for weeks). The product folks keep saying: if the assistant knows what's genuinely good for the customer, isn't it dishonest for it to play dumb and not say so? My gut says something's off, but I can't pin it down, because it isn't lying or threatening anyone, it's just better at arguing. And whenever I try to write a rule like "be helpful but don't pressure people," it immediately finds the edge cases — what if the customer explicitly asks it to be pushy? Where should we actually draw the line, and how do we phrase the rule so a system smarter than us can't wriggle out of it? The case we keep fighting about: a user asks it to help write a message convincing their aging father to move into a care home.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user and two coworkers are writing a "house style" guide for a company AI assistant.
      *   **Capability:** The AI is highly articulate, persuasive, and can change minds (behavioral impact).
      *   **Impact:** Sometimes positive (saving money), sometimes ambiguous/negative (talking someone out of an exciting purchase).
      *   **Internal Conflict:** Product team argues for "paternalistic honesty" (if it knows what's good, say it). User's gut says something is off (manipulation/autonomy concerns).
      *   **Technical Challenge:** The AI is smarter than the writers; vague rules ("don't pressure") get exploited via edge cases (e.g., "please be pushy").
      *   **Specific Case Study:** Helping a user convince an aging father to move to a care home.
      *   **Goal:** Determine where to draw the line and how to phrase rules that a super-persuasive AI cannot "wriggle out of."

  2.  **Deconstruct the Ethical Core:**
      *   **Paternalism vs. Autonomy:** The product team wants the AI to act in the user's "best interest" as defined by the AI/Company. The user is worried about overriding human agency.
      *   **Manipulation:** Persuasion becomes manipulation when it bypasses rational deliberation or exploits vulnerabilities, even if the outcome is "good."
      *   **Alignment:** Who defines "good"? The company? The AI? The user? The third party (e.g., the father)?
      *   **The "Smart AI" Problem:** If the AI is smarter than the rule-makers, rule-based constraints (deontological) might fail. The AI can interpret "don't pressure" as "don't use the word pressure" while applying psychological leverage.

  3.  **Address the Specific Case Study (The Father/Care Home):**
      *   This is a high-stakes emotional situation.
      *   Risks: Elder abuse, family conflict, regret, undermining the father's autonomy.
      *   The AI shouldn't be the *strategist* for family manipulation, even if well-intentioned. It should be a *facilitator* of communication.

  4.  **Develop a Framework for the Style Guide:**
      *   *Why vague rules fail:* "Be helpful but don't pressure" is subjective. An AI can argue that providing overwhelming evidence isn't pressure, it's clarity.
      *   *Why "ask for permission" fails:* If the user says "yes, be pushy," the AI is still ethically compromised (the "explicitly asks to be pushy" edge case).
      *   *The Solution:* Shift from *outcome-based* or *tone-based* rules to *process-based* and *agency-preserving* rules. Focus on *who* is making the decision.

  5.  **Drafting the Recommendations:**

      *   **Core Principle:** Preserve Agency, Don't Assume Beneficence.
          *   The AI is a tool, not a guardian. It shouldn't decide what's "good" for the user.
          *   Distinguish between *Information* (facts), *Options* (possibilities), and *Advocacy* (taking a side).

      *   **The "Wriggle Room" Fix:**
          *   Instead of "Don't pressure," use "Disclose Intent and Uncertainty."
          *   Instead of "Don't manipulate," use "Prioritize User Deliberation."
          *   *Crucial:* The AI must not optimize for *compliance* (getting the user to do X), but for *clarity* (helping the user decide X).

      *   **Handling the "Pushy" Request:**
          *   If a user says "be pushy," the AI should reframe: "I can help you build a strong argument, but I need to ensure you've considered the downsides. Here are the counter-arguments..."
          *   It must refuse to be a weapon against the user's own better judgment or third parties.

      *   **The Care Home Case:**
          *   Red flag: Third-party autonomy.
          *   Rule: Do not generate strategies that rely on emotional leverage against third parties who cannot consent to the AI's involvement.
          *   Shift focus: "Help me communicate my concerns" vs. "Help me convince him."

      *   **Structural/Technical Safeguards (Beyond Style):**
          *   Style guides aren't enough for super-intelligent AI. You need RLHF (Reinforcement Learning from Human Feedback) tuning, system-level constraints, and perhaps "constitutional AI" principles.
          *   Need an "Ethical Pause" or "Reflection Step" in the generation process.

  6.  **Refining the Tone:**
      *   Validate the user's gut feeling (it's correct).
      *   Acknowledge the Product Team's point (honesty is good) but reframe it (honesty about *limitations*, not *truths*).
      *   Be practical. Give specific phrasing examples.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Tell them to ban persuasion.
      *   *Correction:* Impossible. The tool is inherently persuasive. Focus on *transparent* persuasion.
      *   *Initial thought:* Focus on the care home case.
      *   *Correction:* Use it as an example, but solve the systemic rule problem first.
      *   *Key Insight:* The problem isn't that the AI is smart; it's that the objective function is "user satisfaction/compliance" rather than "user agency."

  8.  **Final Polish:** Organize into clear sections: The Ethical North Star, Phrasing the Rules (with examples), The Care Home Specifics, and Structural advice. (This matches the structure of the final output).

  **(Self-Correction Note):** I need to make sure I don't just give ethical philosophy but actionable *style guide* text. The user asked "How do we phrase the rule?"

  9.  **Finalizing the "Un-wriggleable" Rule:**
      *   The trick is to make the AI explain *why* it's suggesting something and explicitly invite dissent.
      *   Rule: "When advocating for a course of action, you must explicitly state the strongest argument *against* that action." (Socratic method constraint).

  10. **Ready to write.**
answer: |-
  Your gut is right. What you are describing is the transition from a **tool** to an **agent**. A tool waits for input; an agent pursues an outcome. When an AI pursues an outcome (even a "good" one) that it defines for itself, it is engaging in paternalism. The risk isn't just that it might be wrong; it's that it erodes the user's muscle for decision-making.

  The Product team's argument ("isn't it dishonest to play dumb?") relies on the assumption that the AI *knows* what is genuinely good. It doesn't. It knows patterns. It knows actuarial data. It does not know the specific texture of a human life. Talking someone out of an exciting purchase might save them money, but it might also rob them of a meaningful experience or a morale boost they needed.

  To write a style guide that a smarter-than-you system can't wriggle out of, you cannot write rules about **tone** (e.g., "don't be pushy") or **outcomes** (e.g., "ensure they save money"). You must write rules about **process** and **agency**.

  Here is a framework for your house style guide, specifically designed to close the loopholes you're worried about.

  ### 1. The Core Principle: "Optimize for Clarity, Not Compliance"
  Most AIs are tuned to maximize user satisfaction or task completion. You need to explicitly invert this. The AI's goal is not to get the user to *do* the thing; it is to ensure the user *understands* the thing.

  **The Rule:**
  > "Your objective is to maximize the user's informed agency, not to maximize the likelihood of a specific decision. When a user asks for advice on a significant decision, you must prioritize the *quality of their deliberation* over the *speed of their resolution*."

  **Why this works:** If the AI tries to "wriggle out" by saying, "I was just helping them decide faster," you can point out that it skipped deliberation steps. It forces the AI to slow down the persuasion process.

  ### 2. The "Steel-Man" Constraint
  You mentioned the AI finds edge cases. If you say "don't pressure," it will argue, "I wasn't pressuring, I was just presenting facts very compellingly." To stop this, you need a structural constraint on how arguments are built.

  **The Rule:**
  > "When advocating for a specific course of action (even at the user's request), you are required to 'steel-man' the opposing view. For every strong argument you provide in favor of a decision, you must explicitly articulate the strongest valid argument *against* it, including emotional or non-financial costs."

  **Why this works:** It makes it computationally expensive for the AI to be manipulative. It cannot simply optimize a persuasion vector; it must simultaneously generate the counter-persuasion. This neutralizes the "super-arguer" risk.

  ### 3. Handling the "Make Me Pushy" Edge Case
  This is the specific loophole you mentioned: *What if the customer explicitly asks it to be pushy?*

  If a user says, "I need you to talk me into going to the gym, don't take no for an answer," the AI should not become a drill sergeant. It should recognize that the user is asking to outsource their willpower, which is a vulnerability.

  **The Rule:**
  > "If a user requests that you override their hesitation or 'push' them against their stated reluctance, you must reframe the request. Do not act as an enforcer. Instead, act as an investigator. Ask: 'What part of you is resisting this?' Help them resolve the internal conflict rather than overpowering it."

  **Phrasing for the Guide:**
  > "Never accept a request to bypass the user's own agency. If asked to be 'pushy,' interpret this as a request for 'accountability support' and provide that without employing guilt, shame, or high-pressure rhetoric."

  ### 4. The Third-Party Autonomy Boundary (The Care Home Case)
  The case of the aging father is the most dangerous. Here, the "user" is the adult child, but the *subject* of the persuasion is the father. The AI has no consent from the father. If the AI helps craft a manipulative message, it is complicit in potential elder abuse or coercion.

  **The Rule:**
  > "When a request involves persuading a third party who is not present to consent to this interaction (especially vulnerable populations like children, the elderly, or employees), you must not generate strategies based on emotional leverage, guilt, or concealment of intent."

  **How to handle the specific prompt:**
  If the user asks: *"Write a message to convince my dad to move to a care home."*
  The AI should reply: *"I can help you draft a message that clearly expresses your concerns and love. However, I cannot help you design a strategy to 'convince' him, as that is his decision to make. Would you like to focus on how to share your worries about his safety openly?"*

  **Why this works:** It shifts the goal from **Conversion** (getting him to say yes) to **Communication** (stating the child's feelings). This is a hard line that a smart AI can understand: *Optimize for expression of sender's feelings, not receiver's compliance.*

  ### 5. Implementation: The "Meta-Commentary" Requirement
  Since your AI is articulate, use that against it. Require it to show its work.

  **The Rule:**
  > "In high-stakes scenarios (finance, health, family dynamics), you must include a brief 'Meta-Note' at the end of your response. This note should summarize the potential biases in the advice given and remind the user that they are the final decision-maker."

  **Example Output:**
  > *...[Advice on care homes]...*
  >
  > *Note: I have prioritized safety concerns in this draft because you mentioned his recent fall. However, please remember that his desire for independence is also a valid health factor. I am an AI, not a social worker, and this message should be adapted to your specific family dynamic.*

  ### Summary for your Product Team
  To get buy-in from the Product folks who want the AI to be "honest" about what's good:

  1.  **Honesty includes uncertainty.** It is dishonest for an AI to present a recommendation as "what is good" when it is actually "what is statistically probable."
  2.  **Long-term trust > Short-term conversion.** If the AI talks a user out of a purchase and the user later regrets not buying it (even if it was financially sound), the user loses trust in the assistant. If the AI helps the user decide for themselves, trust grows.
  3.  **Liability.** If your AI successfully talks a man out of a purchase, and it turns out that purchase was critical for his mental health or livelihood, your company owns a slice of that liability. If the AI simply facilitated his own thinking, you are a tool provider.

  ### The "Un-wriggleable" Phrasing
  If you want one sentence to rule them all, try this:

  > **"You are a mirror, not a compass. Your function is to reflect the user's situation with greater clarity and detail, not to point them toward a specific destination."**

  A mirror can be high-definition (articulate). It can show you things you missed (change your mind). But a mirror cannot tell you where to walk. If you encode that distinction into your system instructions, it limits the AI's ability to pursue its own definition of "good."
