          4.  What does it assume about the *source* of moral improvement (effort vs. grace/nature)?
          5.  **Crucial Task:** If the practice is compatible with different philosophical views, what are those views, and how would the *ledger itself* need to change to remain honest to those views? (Specifically: What would the ledger look like for someone who believes you *can't* audit your own character from the inside?)

  2.  **Deconstruct Franklin's Method (Historical & Philosophical Context):**
