          *   *Scenario B: The Holist (Virtue is one).* If virtue is unified, tracking 13 separate things is lying. The ledger should be one page.
          *   *Scenario C: The Grace-Based (Calvinist).* The ledger records *receipts of grace*, not debts paid.
      *   *Section 4: Narrative Advice.* How to show this in the text. The app graphing. The satisfaction of the black spot.

  6.  **Refining the "Can't Audit Inside" Ledger:**
      *   This is the specific challenge at the end.
      *   If I believe my internal self-assessment is flawed (bias, blindness), I cannot mark a black spot confidently.
