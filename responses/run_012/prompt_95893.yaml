prompt: |-
  I'm a software engineer with no formal training in game theory, and I'm about to design a multi-agent simulation. Before I do, I want to check a summary that a colleague wrote for our team's internal wiki, because I'm not qualified to tell where it goes wrong and I'd rather not build on it if it does. Here is his summary in full:

  "The prisoner's dilemma shows that two rational agents who each pursue their own interest both end up worse off than if they had cooperated, which is why cooperating is irrational when the game is played only once. Repeat the game, though, and cooperation becomes rational: in the round-robin computer tournaments run by Robert Axelrod, a simple strategy called tit-for-tat — open by cooperating, then copy whatever the opponent did last round — proved to be the optimal strategy for the iterated game, and the folk theorem generalizes the result, since any cooperative outcome can be sustained as an equilibrium provided the game is repeated indefinitely. This is the whole basis of the evolution of cooperation in nature: nice strategies that reciprocate and punish defection outcompete selfish ones. The practical takeaway is that if you want cooperation, make the interaction repeated, start friendly, and punish defection."

  Two features of my actual setting may matter. First, my game is noisy: agents occasionally fail to deliver a message, so an intended cooperative move can arrive looking like a defection, and I have no way to tell from the outside which one happened. Second, my colleague's recommended configuration is to set the continuation probability very high — he suggests 0.99 — and to treat cooperation as essentially guaranteed once that is in place.

  I want an accuracy audit, not a lecture. Please go claim by claim and tell me which parts a game theorist would sign off on, which are the sort of thing that passes as a textbook simplification but is misleading as stated, and which are simply wrong. Where a claim is a simplification, say what it simplifies and what gets lost in the process. I'm particularly interested in whether the practical takeaway survives contact with my noisy case, and in whether the words "proved" and "guaranteed" are carrying weight they can't bear. I don't need a reading list or citations — I just want to know which sentences to strike from the wiki and what I should believe in their place.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **User:** Software engineer, no formal game theory training, designing a multi-agent simulation.
      *   **Task:** Audit a colleague's wiki summary of game theory (specifically Prisoner's Dilemma, Iterated Prisoner's Dilemma, Axelrod's tournaments, Folk Theorem, Evolution of Cooperation).
      *   **Constraints:** Accuracy audit, claim-by-claim analysis, identify correct vs. simplification vs. wrong, focus on "noisy" environment and high continuation probability (0.99), avoid lectures/reading lists, focus on actionable edits (what to strike/replace).
      *   **Key Concerns:** Validity of "proved" and "guaranteed," applicability to noisy settings, validity of the "practical takeaway."

  2.  **Analyze the Colleague's Text (Claim by Claim):**

      *   *Claim 1:* "The prisoner's dilemma shows that two rational agents who each pursue their own interest both end up worse off than if they had cooperated..."
          *   *Assessment:* Generally correct definition of the PD payoff structure (Nash Equilibrium vs. Pareto Optimal).
          *   *Nuance:* "Rational" usually means Nash Equilibrium seeking in this context.
          *   *Verdict:* Acceptable simplification.

      *   *Claim 2:* "...which is why cooperating is irrational when the game is played only once."
          *   *Assessment:* Correct for standard one-shot PD. Defection is the dominant strategy.
          *   *Verdict:* Correct.

      *   *Claim 3:* "Repeat the game, though, and cooperation becomes rational..."
          *   *Assessment:* True for *Iterated* Prisoner's Dilemma (IPD), *but* depends on the horizon. If finite and known, backward induction leads to defection. If indefinite/probabilistic, cooperation is possible.
          *   *Verdict:* Simplification. Needs qualification on "indefinite" vs. "finite known."

      *   *Claim 4:* "...in the round-robin computer tournaments run by Robert Axelrod, a simple strategy called tit-for-tat — open by cooperating, then copy whatever the opponent did last round — proved to be the optimal strategy for the iterated game..."
          *   *Assessment:* **Problematic.** TFT won Axelrod's specific tournaments, but it is *not* mathematically "optimal" in a general sense. It can be beaten by specific strategies in specific contexts. It is not a Nash Equilibrium against itself in all variations. "Optimal" is too strong.
          *   *Verdict:* Misleading/Wrong usage of "optimal."

      *   *Claim 5:* "...and the folk theorem generalizes the result, since any cooperative outcome can be sustained as an equilibrium provided the game is repeated indefinitely."
          *   *Assessment:* **Technically true but misleading.** The Folk Theorem says *many* outcomes (including all-defect) can be equilibria. It doesn't select *which* one. It doesn't guarantee cooperation, just that cooperation *can* be supported.
          *   *Verdict:* Simplification that obscures the equilibrium selection problem.

      *   *Claim 6:* "This is the whole basis of the evolution of cooperation in nature: nice strategies that reciprocate and punish defection outcompete selfish ones."
          *   *Assessment:* **Overstatement.** "Whole basis" is too strong. Kin selection, group selection, and spatial structure also matter. Also, in evolutionary dynamics, TFT is not always stable against errors or mutations.
          *   *Verdict:* Simplification/Overstatement.

      *   *Claim 7:* "The practical takeaway is that if you want cooperation, make the interaction repeated, start friendly, and punish defection."
          *   *Assessment:* Good heuristic *in noise-free environments*.
          *   *Verdict:* Conditional.

      *   *Context Check (Noise):* The user has a *noisy* environment.
          *   *Impact:* TFT fails catastrophically in noisy environments. One error leads to a cycle of mutual punishment (echo effect). Generous TFT or Win-Stay-Lose-Shift is better.
          *   *Impact on "Guaranteed":* High continuation probability (0.99) makes the shadow of the future long, but noise breaks the trigger strategies required for Folk Theorem equilibria unless strategies are error-correcting.

  3.  **Drafting the Audit (Iterative Refinement):**

      *   *Structure:* Go sentence by sentence (or logical clause by clause).
      *   *Tone:* Professional, direct, engineering-focused.
      *   *Focus:* Highlight the noise issue and the strength of words like "proved" and "guaranteed."

      *   *Drafting Claim 1 & 2:* "The prisoner's dilemma shows that two rational agents who each pursue their own interest both end up worse off than if they had cooperated, which is why cooperating is irrational when the game is played only once."
          *   *Status:* Keep. Standard definition.

      *   *Drafting Claim 3:* "Repeat the game, though, and cooperation becomes rational..."
          *   *Status:* Needs fix. Only if the end is uncertain. If agents know round 100 is the last, they defect on 100, then 99, etc.
          *   *Edit:* Specify "indefinitely" or "with uncertain ending."

      *   *Drafting Claim 4:* "...tit-for-tat... proved to be the optimal strategy..."
          *   *Status:* **Strike/Correct.** "Optimal" is wrong. It won a tournament, it isn't universally optimal. It's not robust to noise.
          *   *Edit:* "Performed well in specific tournaments."

      *   *Drafting Claim 5:* "...folk theorem generalizes the result, since any cooperative outcome can be sustained as an equilibrium..."
          *   *Status:* **Misleading.** Folk Theorem allows *many* equilibria, including all-defect. It doesn't predict cooperation will happen, just that it *could*.
          *   *Edit:* Clarify equilibrium selection problem.

      *   *Drafting Claim 6:* "This is the whole basis of the evolution of cooperation in nature..."
          *   *Status:* **Strike/Soften.** "Whole basis" is scientifically inaccurate.
          *   *Edit:* "One mechanism."

      *   *Drafting Claim 7:* "The practical takeaway..."
          *   *Status:* **Dangerous for User.** In noise, "punish defection" (TFT) causes feuds.
          *   *Edit:* Needs to account for noise (forgiveness).

      *   *Addressing the Specific Context (Noise & 0.99 probability):*
          *   Noise kills TFT. 0.99 probability satisfies the Folk Theorem discount factor requirement *mathematically*, but without error-correcting strategies, the system will lock into mutual defection due to noise.
          *   "Guaranteed" is definitely wrong.

  4.  **Final Review against Constraints:**
      *   No lecture? Yes.
      *   Claim by claim? Yes.
      *   Address "proved"/"guaranteed"? Yes.
      *   Address noise? Yes.
      *   No citations? Yes.

  5.  **Final Polish:** Ensure the distinction between "Nash Equilibrium" and "Evolutionary Stability" is clear where needed, but keep it accessible to an engineer. Emphasize that in noise, TFT leads to vengeance cycles.

      *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in the math of the Folk Theorem. The key point for the engineer is: Folk Theorem says cooperation is *possible*, not that it *will happen*, and it assumes perfect monitoring (no noise).
      Also, need to explicitly address the colleague's suggestion of 0.99 continuation probability. That satisfies the discount factor, but doesn't solve the noise-induced coordination failure.

  6.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Here is the claim-by-claim audit of your colleague's summary, evaluated against standard game theory and specifically tested against your noisy, high-continuation setting.

  ### Claim 1
  > "The prisoner's dilemma shows that two rational agents who each pursue their own interest both end up worse off than if they had cooperated, which is why cooperating is irrational when the game is played only once."

  **Verdict:** **Accurate.**
  **Notes:** This is the standard definition of the one-shot Prisoner's Dilemma. Defection is the dominant strategy; Nash Equilibrium is mutual defection. No changes needed here.

  ### Claim 2
  > "Repeat the game, though, and cooperation becomes rational..."

  **Verdict:** **Misleading Simplification.**
  **What it simplifies:** It omits the condition that the end of the game must be uncertain.
  **What gets lost:** If the agents know exactly how many rounds will be played (e.g., exactly 100), backward induction dictates they should defect in the last round, which unravels cooperation back to the first round. Cooperation only becomes rational if the game is *indefinitely* repeated or has a probabilistic continuation.
  **Action:** Qualify this. Change to: "Repeat the game *indefinitely or with an uncertain ending*, and cooperation becomes rational."

  ### Claim 3
  > "...in the round-robin computer tournaments run by Robert Axelrod, a simple strategy called tit-for-tat — open by cooperating, then copy whatever the opponent did last round — proved to be the optimal strategy for the iterated game..."

  **Verdict:** **Wrong.**
  **What is wrong:** Tit-for-Tat (TFT) won Axelrod's specific tournaments, but it was never mathematically **proved** to be "optimal." There is no single optimal strategy for the Iterated Prisoner's Dilemma; performance depends on the opponent. Furthermore, TFT is not a Nash Equilibrium against itself in all variations.
  **Action:** Strike "proved to be the optimal strategy." Replace with: "performed robustly in specific tournaments."

  ### Claim 4
  > "...and the folk theorem generalizes the result, since any cooperative outcome can be sustained as an equilibrium provided the game is repeated indefinitely."

  **Verdict:** **Technically True but Dangerous.**
  **What it simplifies:** The Folk Theorem states that *many* outcomes (including mutual defection) can be sustained as equilibria, not just cooperative ones. It solves the existence problem, not the selection problem.
  **What gets lost:** Just because cooperation *can* be an equilibrium doesn't mean agents will find it. It requires specific threat strategies to enforce.
  **Action:** Clarify that the theorem allows for cooperation, but does not guarantee it. Change "any cooperative outcome can be sustained" to "many outcomes, including cooperative ones, can be sustained."

  ### Claim 5
  > "This is the whole basis of the evolution of cooperation in nature: nice strategies that reciprocate and punish defection outcompete selfish ones."

  **Verdict:** **Overstatement.**
  **What is wrong:** "Whole basis" is scientifically incorrect. Kin selection, spatial structure, and group selection are also major drivers. Additionally, in evolutionary models, strict reciprocity (like TFT) is often vulnerable to invasion by strategies that make mistakes or by always-cooperate strategies (which are then vulnerable to defectors).
  **Action:** Soften "whole basis" to "one major mechanism."

  ### Claim 6
  > "The practical takeaway is that if you want cooperation, make the interaction repeated, start friendly, and punish defection."

  **Verdict:** **Fails in Your Setting (Noise).**
  **Why it fails:** This takeaway describes Tit-for-Tat. In a **noisy** environment, TFT is catastrophic. If an agent intends to cooperate but noise makes it look like defection, TFT punishes that error. The opponent then punishes the punishment. This creates an endless cycle of mutual retaliation ("echo effect") that destroys cooperation.
  **Action:** This advice must be changed for your simulation. In noisy settings, you must "forgive" occasionally. Strategies like *Generous Tit-for-Tat* (forgive defection with some probability) or *Win-Stay-Lose-Shift* are required.

  ### Specific Audit of Configuration Advice
  > "set the continuation probability very high — he suggests 0.99 — and to treat cooperation as essentially guaranteed once that is in place."

  **Verdict:** **Wrong ("Guaranteed" is carrying too much weight).**
  **Analysis:**
  1.  **Continuation Probability:** A 0.99 probability satisfies the mathematical requirement for the Folk Theorem (the "shadow of the future" is long enough). That part is fine.
  2.  **"Guaranteed":** This is false. High continuation probability makes cooperation *possible*, but it does not select the equilibrium.
  3.  **Noise Interaction:** In your noisy setting, a 0.99 continuation probability combined with strict punishment (TFT) will likely lead to **locked-in mutual defection**. Once noise triggers a punishment cycle, the high continuation probability means the agents are trapped in that cycle for a very long time.
  **Action:** Do not treat cooperation as guaranteed. You must implement error-correcting strategies. If agents use strict TFT, your simulation will likely converge to defection despite the 0.99 probability.

  ### Summary of Edits for the Wiki
  1.  **Strike:** "proved to be the optimal strategy."
  2.  **Strike:** "whole basis of the evolution of cooperation."
  3.  **Strike:** "cooperation as essentially guaranteed."
  4.  **Modify:** Clarify that repetition only helps if the end is uncertain.
  5.  **Modify:** Change the practical takeaway. For noisy systems, the advice should be: "Make interactions indefinite, start friendly, punish defection, but **build in forgiveness for errors**."

  **Bottom Line:** Your colleague's summary is a standard pop-science overview that holds up in a noise-free textbook but will lead to a broken simulation in your specific engineering context. The word "guaranteed" is the most dangerous element; in game theory, almost nothing is guaranteed outside of very specific, frictionless assumptions.
