  Here is the breakdown for your wiki. I have assessed these through the lens of Functional Decision Theory (FDT) and Timeless Decision Theory (TDT), which are the frameworks where acausal trade is coherent, while keeping a sceptical eye on the empirical priors.

  ### The Tiers

  **1. The plain one**
  *   **Tier:** B
  *   **Score:** 0.10
  *   **Justification:** This is the standard formulation of acausal trade, but it relies on the empirical claim that powerful simulators actually exist and care about your specific policy. It is logically sound within FDT, but the prior probability of such counterparties existing is low enough to limit actionable weight.

  **2. The "same answer" one** & **5. The mathematics one**
  *   **Tier:** C (Grouped)
  *   **Score:** 0.05
  *   **Justification:** These are the same argument in separate clothes; both rely on superrationality, assuming ideal agents converge on identical solutions regardless of values. This is mathematically elegant but fragile, as it breaks down if agents have divergent utility functions or bounded rationality.

  **3. The self-simulation one**
  *   **Tier:** C
  *   **Score:** 0.05
  *   **Justification:** This reduces to a metaphysical debate about identity thresholds rather than a decision-theoretic lever. Unless you can rigorously define when a copy stops being 'you', the correlation strength is too ambiguous to justify cost.

  **4. The future-me one**
  *   **Tier:** A
  *   **Score:** 0.20
  *   **Justification:** While arguably precommitment rather than strict acausal trade, this is the most pragmatically useful version for an engineer. Binding your present self to aid your future self is a robust strategy for value drift, regardless of whether external traders exist.

  **6. The trembling-hand one**
  *   **Tier:** D
  *   **Score:** 0.00
  *   **Justification:** This is not a reason to act but a critique of stability; it highlights that real-world noise breaks the logical correlation required for trade. It suggests you should not rely on acausal mechanisms for critical outcomes.

  **7. The anthropic one**
  *   **Tier:** D (Flagged)
  *   **Score:** 0.05
  *   **Justification:** This leans heavily into Pascal's Mugging territory by using selection effects to inflate the probability of rare simulator scenarios. It provides weak evidence at best and risks justifying irrational sacrifices based on speculative priors.

  **8. The act-versus-policy one**
  *   **Tier:** A
  *   **Score:** 0.15
  *   **Justification:** This is the core logical justification for version 1, decoupling the action from the existence of a specific counterparty. It argues you should maximise utility across all logical possibilities where your policy is observed, though the real-world impact remains speculative.

  ### Duplicates and Flags

  *   **Duplicates:** Items **2** and **5** are effectively the same argument (Superrationality); item **5** is merely a formalisation of **2**. Items **1** and **8** are two sides of the same coin; **8** is the theoretical justification for the practical claim in **1**.
  *   **Pascal's Mugging:** Item **7** is the primary offender here. It attempts to boost the probability of a low-likelihood event (simulation) using anthropic reasoning, which is a classic setup for exploitation by high-stakes, low-probability claims.
  *   **Coherence:** The concept is not incoherent, but it is framework-dependent. It holds water within FDT/TDT (where logical correlation counts as influence) but is nonsense within Causal Decision Theory (which your engineering intuition might default to).

  ### Final Recommendation

  **Top Tier:** **Item 8 (The act-versus-policy one)** deserves the top spot. It is the most robust formulation because it does not require you to believe a specific alien is watching you; it simply requires you to act as the sort of agent who *would* trade, which safeguards you in any world where such trade is possible.

  **Bin It:** **Item 7 (The anthropic one)** should be binned. It adds unnecessary probabilistic complexity and opens the door to mugging scenarios without providing actionable leverage you don't already have from Item 8.

  **Summary Advice:** Treat Item 4 (Future-me) as a solid engineering constraint on your own architecture (precommitment), but keep the scores for external acausal trade (1, 2, 5, 8) low. They are fascinating logical structures, but until there is evidence of counterparties, they should not override causal obligations.
