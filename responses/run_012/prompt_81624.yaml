answer: |-
  **Exam Question**

  **Time Allowed:** 70 Minutes
  **Total Marks:** 25

  **Question:**
  Consider the five cases regarding the heritable wing "notch" in the island beetle population provided in the course material. 

  (A) Taking the **Etiological (Selected-Effects)**, **Causal-Role (Systems)**, and **Propensity** accounts in turn, determine for **Case 1** (Drift/Current Utility) and **Case 5** (Artificial Selection) whether the notch possesses a function. You must identify which of these two cases represents a point of **agreement** among the accounts and which represents a point of **divergence**, explaining precisely why the accounts yield different verdicts on the divergence case. (10 marks)

  (B) Defend one of the three accounts (or a specific two-concept view) as the correct analysis of biological function. Your defense must address the case from part (A) that is most problematic for your chosen position. Explicitly state what theoretical or practical **cost** your position incurs by resolving this case in the way you propose. Do not argue that your account is correct merely because it is more convenient for field biologists. (15 marks)

  ***

  **Model Answer**

  The debate between my friend (Etiological) and myself (Causal-Role) hinges on whether function is a historical property or a current causal capacity. Analyzing the beetle notch cases forces a resolution.

  In **Case 5** (Artificial Selection), all three accounts agree the notch has a function. For the Causal-Role account, the notch contributes to the colour pattern capacity desired by the breeder. For the Propensity account, the trait has a propensity to be selected in the lab environment. For the Etiological account, the trait is literally *selected for* that pattern in the breeding population. Here, history, capacity, and propensity align.

  In **Case 1** (Drift/Current Utility), the accounts diverge. The notch aids flight stability now, but originated via drift. The Causal-Role account grants it a function because it currently contributes to the system's capacity for stable flight. The Propensity account also grants it a function, as the trait currently possesses a propensity to enhance survival. However, the Etiological account denies it a function. Because the notch's presence is due to drift, not selection *for* stability, there is no historical feedback loop establishing stability as its proper function. It is merely an advantageous accident. This divergence isolates the Etiological account from the other two: it alone insists that current utility without selective history is insufficient for function ascription.

  I defend the **Etiological account**. My friend was right: function talk is inherently normative, and only history provides the norm. If we define function merely by current contribution (Causal-Role), we cannot distinguish between a trait functioning and a trait merely being useful. A heart pumping blood is functioning; a heart pumping blood due to a spasm while killing the organism is merely causing an effect. Only the Etiological account explains **malfunction**. If the notch in Case 1 were to mutate and reduce stability, the Causal-Role theorist must say the function changed. The Etiological theorist can say the trait is malfunctioning relative to the history that established its presence, or, more accurately in Case 1, that it never had a function to malfunction *from*.

  The most embarrassing case for the Etiological view is Case 1. Biologists look at the notch, see it stabilizes flight, and want to say "its function is stability." My position forces me to tell them they are speaking loosely. They are describing a *capacity*, not a function.

  The cost of this defense is significant. It renders the Etiological account partially revisionary regarding biological practice. We must tell field biologists that when they study exaptations or traits fixed by drift, they are not studying functions, but advantageous causal roles. We lose the immediate linguistic convenience of calling every useful trait "functional." However, this cost is necessary. If we accept the Causal-Role view for convenience, we lose the ability to ground the distinction between doing what a trait is *for* and simply doing what it *does*. Convenience cannot dictate ontology. The Etiological account preserves the normativity essential to teleology, even if it requires biologists to be more precise about the difference between a trait's history and its current utility. My friend won the philosophical argument, even if I won the pragmatic one.

  ***

  **Marking Scheme**

  | Point | Criteria | Marks | Typical Error Note |
  | :--- | :--- | :--- | :--- |
  | **1. Divergence Analysis** | Correctly identifies Case 1 as the divergence point where Etiological says "No Function" while Causal-Role/Propensity say "Function," citing the lack of selection history. | 5 | Assuming every case must generate a disagreement between all three accounts rather than isolating one. |
  | **2. Agreement Analysis** | Correctly identifies Case 5 as an agreement point where all accounts grant function due to the presence of selection, contribution, and propensity simultaneously. | 5 | Claiming "useful now" is sufficient for Etiological function, missing the historical requirement. |
  | **3. Account Definition** | Accurately defines the core principle of the defended account (e.g., Etiological = history of selection *for* the effect) without implying conscious design or purpose. | 5 | Equating the Etiological "selection" requirement with intentional design or a designer. |
  | **4. Defense & Cost** | Defends the chosen account against its hardest case (e.g., Case 1 for Etiological) and explicitly states the cost (e.g., revisionism regarding biologists' ordinary language). | 5 | Arguing the account is correct *because* it is more convenient for field biologists. |
  | **5. Conceptual Precision** | Distinguishes clearly between a trait being *selected* (history of spread) and *selected for* (reason for spread), and between *having a function* and *being useful*. | 5 | Conflating "selected" (past tense verb) with "selected for" (teleological reason) or treating current utility as identical to function. |

  **Total:** 25 Marks
