  ### Part 1: The Speaker's Briefing (Read This First)

  You asked me to be upfront about what is settled history and what is interpretation. Since half your audience are physicists, they will smell a distortion immediately. Here is the breakdown of the material below.

  **1. What is Settled (Safe to say as fact):**
  *   **God:** Einstein rejected a "personal God" (one who judges, rewards, or punishes). He explicitly identified with Spinoza's God: the harmony of the laws of nature. He called himself a "deeply religious unbeliever."
  *   **Free Will:** He was a hard determinist. He believed human actions are as determined as the motion of stars. He famously said (paraphrased in the toast) that he felt no "freedom of will."
  *   **The "Atheist" Label:** He disliked being called an atheist. He felt the term implied a dogmatic certainty he didn't possess.

  **2. What is Interpretive (Use with care):**
  *   **Your "Shower Theory" (Kindness via Determinism):** This is a strong, respected interpretation, but not a direct quote. Biographers (like Walter Isaacson) note that Einstein's determinism made him compassionate—he didn't blame people because he saw them as products of causes. However, Einstein didn't explicitly write, "I am kind *because* I believe in determinism." He was kind *and* a determinist. I have phrased the toast to reflect this as an observation of his life rather than a direct philosophical claim.
  *   **The Wedding Vow under Determinism:** Einstein did not write about how to make wedding vows if you don't believe in free will. This is the hardest part. The toast argues that a vow is not a "magic spell to control the future" but a "statement of current alignment." This is a philosophical extrapolation to make his view work for a wedding. It is consistent with his thinking, but it is *your* argument, not his. I have flagged this in the annotations.

  **3. Quotes:**
  *   I have avoided using exact quotation marks for Einstein's words. I have paraphrased his core ideas into plain English. This protects you from misquoting him in front of his experts. If I use a phrase that is very close to a famous sentiment, I will note it in the annotations.

  ***

  ### Part 2: The Toast

  (Stand up, take a breath. Speak slowly. It's okay to look at the paper.)

  Good evening. For those who don't know me, I'm the older sibling. And like many older siblings, I've spent a lifetime trying to figure out how my brother's mind works. Usually, I fail. But for the last two weeks, thanks to his instructions for this toast, I've been reading about Albert Einstein.

  And I have to tell you, this is the hardest toast I've ever had to write. Because usually, a wedding is built on two big ideas. The first is Fate—the idea that the universe planned for you to meet. The second is Choice—the idea that you bravely chose each other against all odds.

  But [Brother's Name] and [Partner's Name] asked me not to tell those stories. They told me both are lies. They asked me to speak about the world as they see it: a world of physical laws, without a referee handing out rewards, and without a magical freedom that lets us step outside cause and effect.

  So, if you can't say they were fated, and you can't say they chose... what are we actually celebrating today?

  I found the answer in how Einstein lived.

  First, to Grandma and Great-Aunt, and our family who find comfort in church: Einstein didn't believe in a God who watches us like a parent. But he wasn't an atheist, either. He believed in something holy. He felt a profound awe at the fact that the universe makes sense. That there is order. That light bends, and stars burn, and atoms bond in ways that allow us to be here, right now, holding a glass.

  He called this "Spinoza's God." It's not a judge. It's the beauty of the structure itself. And looking at this room, at the two of them, I think that is what we are honoring. Not a divine plan, but a divine probability. The odds of two people finding a resonance this deep are so low, they look like a miracle, even if they're just physics.

  But then there's the harder part. The free will part. Einstein believed we don't truly choose. He believed we are swept along by currents we can't see. So, why stand up and make a promise? If the future is already written by the past, what is a vow worth?

  Here is what I think. And here is where I think my brother finds his hope.

  If you believe you are the absolute master of your fate, you become arrogant. You think you can control everything. But if you accept that you don't have total control—that you are part of a vast, unfolding system—you become humble. And you become kind.

  Einstein was a man who knew there was no free will, yet he spent his life pleading for peace, for decency, for responsibility. Why? Because even if the future is determined, *we* are part of the machinery that determines it. Our words, our promises, our kindness—these are forces. They are real data in the equation.

  [Brother's Name] and [Partner's Name], you aren't standing here to promise that you will control the future. You can't. None of us can. You are standing here to say that you are aligning your trajectories. You are saying that whatever forces act upon you, you will act as a single unit against the chaos.

  To the couple: I know you didn't "choose" each other in the magical sense. You recognized each other. Like two particles that finally find the right frequency. That isn't less romantic than fate. It's more honest. It means you don't have to pretend to be captains of the ship. You just have to promise to be the crew. To tend the engines. To watch the horizon. To be kind when the storm comes, not because you're being judged, but because kindness is the only way to make the ride bearable.

  And to Grandma, who I know worries about what happens when we take God out of the equation: The moral law doesn't disappear. If anything, it becomes more urgent. We don't do good because we're being watched. We do good because we are all in this together, and we are all we have.

  So, I am not going to ask you to raise a glass to "Free Will." And I'm not going to ask you to toast to "Destiny."

  I'm asking you to toast to the Truth. To the order of things that brought them here. To the kindness that comes from knowing none of us are driving. And to the promise that even in a determined universe, love is a force that changes the outcome.

  To [Brother's Name] and [Partner's Name].

  ***

  ### Part 3: Toast Annotations & Liberty Flags

  **1. The "Divine Probability" Line**
  *   *Liberty:* Einstein didn't call unlikely events "divine probability."
  *   *Why:* This bridges the gap for your religious family. It acknowledges the "miracle" feeling without asserting a personal God. It translates "Spinoza's God" into wedding language.

  **2. "We are part of the machinery that determines it"**
  *   *Philosophy Check:* This is the crucial pivot. Hard determinism can lead to nihilism ("Nothing matters"). I am arguing for *compatibilism* lite: Your thoughts are determined, but they still *cause* things.
  *   *Risk:* A hardline physicist might say "Your thoughts were determined to cause that, so you still didn't choose to cause it."
  *   *Defense:* For a toast, this distinction is too granular. The sentiment—that your actions have real effects—is consistent with Einstein's life work. He campaigned for causes believing his actions mattered, even if he philosophically believed they were determined.

  **3. "Kindness is the only way to make the ride bearable"**
  *   *Your Shower Theory:* This is where I inserted your theory.
  *   *Flag:* As noted in the briefing, Einstein didn't explicitly link his kindness *causally* to his determinism in a soundbite. However, it is a biographically accurate description of his demeanor. He was notably lacking in personal bitterness. This is safe to use as a character observation.

  **4. "Love is a force that changes the outcome"**
  *   *Liberty:* In a strictly determined universe, love doesn't "change" the outcome from what it was always going to be.
  *   *Why:* This is poetic license required for a wedding. To say "Love is a force that *is* the outcome" is too abstract. "Changes the outcome" is functionally true for the people living it.
  *   *Warning:* If a physicist cousin corners you later, admit this is poetic, not physical.

  **5. Addressing Grandma**
  *   *Strategy:* I avoided saying "There is no God." I said "We don't do good because we're being watched." This respects her faith while stating the groom's position. It frames the groom's view as *more* responsible (doing good for its own sake), which is usually comforting to older generations.

  **6. No Direct Quotes**
  *   I deliberately avoided phrases like "God does not play dice" or "Old One." Those are often misattributed or taken out of context. The paraphrasing protects you from the "lab friends" in the audience.
