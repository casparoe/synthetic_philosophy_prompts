answer: |-
  **MEMORANDUM OF PARTIAL AGREEMENT**
  **Subject:** Cross-Cultural Moral Psychology and the Limits of Variation
  **Parties:** [Universalist Lab] & [Relativist Fieldwork Group]

  ### I. Claims Both Parties Sign

  1.  **On Sampling:** We agree that the existing database of moral psychology is catastrophically skewed toward WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations. Findings derived solely from undergraduate pools in North America and Europe cannot be assumed to represent the human species.
  2.  **On Variation:** We agree that surface-level moral rules vary significantly across cultures (e.g., dietary restrictions, burial practices, sexual norms). There is no single list of specific prohibitions that every human group enforces identically.
  3.  **On Constraints:** We agree that human moral variation is not infinite. No culture praises random murder of kin within the group, and no culture operates without *some* concept of fairness or reciprocity, however defined. Human cognition places boundaries on what can count as a moral system.
  4.  **On "Deep" vs. "Cosmetic":** We agree on a working definition for the sake of argument.
      *   *Cosmetic Variation:* Differences in the specific application of a shared principle (e.g., "Honor your parents" applies to living together vs. calling weekly).
      *   *Deep Variation:* Differences in the foundational metric of wrongness itself (e.g., one culture judges based on welfare/harm, another based on spiritual pollution, with no shared underlying metric).
  5.  **On Method:** We agree that survey data alone is insufficient. Self-reported judgments must be triangulated with behavioral measures, physiological responses, and ethnographic context to distinguish between *performance* (what they say) and *competence* (what they feel/cognize).
  6.  **On Causality:** We agree that correlation is not causation. Finding a moral norm across cultures does not prove it is innate (it could be convergent cultural evolution). Finding variation does not prove there is no innate structure (it could be parameter setting).

  ***

  ### II. Table of Remaining Disagreements

  | Feature | Universalist Position (Psych/Cognitive) | Relativist Position (Anthro/Cultural) |
  | :--- | :--- | :--- |
  | **Source of Norms** | Moral judgments are generated by innate, domain-specific cognitive modules (e.g., Care, Fairness, Loyalty, Authority, Purity). Culture calibrates the sensitivity of these modules but does not create them. | Moral judgments are emergent properties of local cultural ontologies. Concepts like "harm" or "purity" are themselves culturally constructed, not pre-loaded cognitive inputs. |
  | **The "Harm" Standard** | Harm-based morality is the universal core. When purity or authority violations are judged as "wrong," it is because they are metaphorically processed as harm (to the soul, the social body, or the cosmic order). | Harm is a parochial concern of liberal Western ethics. In many cultures, wrongness is ontological (disorder) rather than consequentialist (suffering). Equating "sin" with "metaphorical harm" is an imperialist translation error. |
  | **Role of Disgust** | Disgust is a co-opted evolutionary mechanism. It is universally recruited to signal moral violation, even in the absence of pathogens. The physiology is universal; the trigger is learned. | Disgust is not a moral signal but a somatic state that cultures *may* link to morality. In some societies, moral violations induce shame or fear, not disgust. Linking them universally is a WEIRD projection. |
  | **Objectivity** | Morality is "objective" in the sense that it is grounded in a shared human nature. There is a fact of the matter about whether a rule fits the human cognitive architecture. | Morality is "objective" only within a form of life. There is no view from nowhere to judge between forms of life. Truth is internal to the cultural system. |

  ***

  ### III. The Cruxes and Predictive Tests

  These are the specific empirical questions where a result would force one or both parties to revise their core model.

  #### Crux 1: The "Free-Floating" Prohibition
  **Question:** Can a behavior be judged morally wrong in the total absence of harm, rights violation, or social disruption, across *all* cultural contexts?
  **Study Design:** Present scenarios where an action violates a norm but has zero negative consequences for any sentient being (including spirits/ancestors, if the culture does not believe in them).
  *   **Universalist Prediction:** In cultures with a "Purity" module, harmless violations will still be rated "Wrong" and elicit physiological aversion. In cultures without that calibration, they will be rated "Neutral." The *capacity* is universal; the *output* varies.
  *   **Relativist Prediction:** Judgments will track local ontology perfectly. If the culture does not believe the action disrupts the cosmic order, it will not be judged wrong. There is no "module" firing in the void.
  *   **Falsification:**
      *   *Universalist concedes if:* A culture with strong purity norms rates a harmless purity violation as "Wrong but permissible/neutral" when the metaphysical stakes are explicitly removed.
      *   *Relativist concedes if:* WEIRD subjects show consistent amygdala activation (disgust response) to harmless purity violations despite explicitly reporting "no wrongness."

  #### Crux 2: The Dissociation of Disgust and Harm
  **Question:** Are disgust and harm processed as distinct moral inputs, or is disgust merely a heuristic for hidden harm?
  **Study Design:** Two conditions. (A) **Disgusting/Harmless** (e.g., eating a fly that is sterilized). (B) **Harmful/Not Disgusting** (e.g., a painless theft that causes financial ruin).
  *   **Universalist Prediction:** Both will be judged wrong, but via different cognitive channels. Condition A triggers Purity; Condition B triggers Care/Fairness. The wrongness ratings will be high in both, universally.
  *   **Relativist Prediction:** Dissociation will occur based on culture. Liberal WEIRD samples will rate B as worse than A. Traditional samples may rate A as worse than B. Crucially, some cultures will rate A as *morally neutral* if their ontology does not link bodily intake to spiritual status.
  *   **Falsification:**
      *   *Universalist concedes if:* Condition A (Disgusting/Harmless) is rated "Morally Okay" by a significant majority in *any* stable cultural group.
      *   *Relativist concedes if:* Condition A is rated "Morally Wrong" at statistically identical rates across all tested populations, regardless of local beliefs about the body.

  ***

  ### IV. The Novel Scenarios (Forced Handling)

  #### Scenario 1: The Private Shrine
  **Vignette:** A person privately destroys a keepsake or shrine of a dead relative. No one sees. No promise was broken. No living person is harmed or distressed. The dead relative is not believed to be a sentient spirit that can suffer.
  **Populations:** WEIRD Undergraduate vs. Small-Scale Community (Ancestor-venerating).

  *   **Universalist Prediction:**
      *   *WEIRD:* Rated "Permissible" or "Sad but not wrong." (Purity module not calibrated to ancestors).
      *   *Small-Scale:* Rated "Wrong." (Purity/Authority module calibrated to ancestors).
      *   *Interpretation:* The *structure* of the violation (disrespecting the sacred) is universal, but the *object* of the sacred is culturally set.
      *   **Give Ground:** If the Small-Scale community rates it "Wrong" but *also* rates a control scenario (breaking one's own plate) as equally wrong, suggesting no specific moral category exists for ancestors.
  *   **Relativist Prediction:**
      *   *WEIRD:* Rated "Permissible."
      *   *Small-Scale:* Rated "Wrong."
      *   *Interpretation:* The wrongness *is* the cultural ontology. Without the belief that ancestors matter, the act has no moral valence. There is no universal "respect" module, only local rules.
      *   **Give Ground:** If WEIRD participants, when primed with "family legacy" language, show the same physiological stress response as the Small-Scale group, suggesting the circuitry was there, just dormant.

  #### Scenario 2: The Dissociation Design
  **Vignette:**
  *   *Case A (Disgust/No Harm):* Cleaning a toilet with a national flag.
  *   *Case B (Harm/No Disgust):* A bureaucrat shuffling papers causes a stranger to lose a benefit they were entitled to.
  **Task:** Rate wrongness and identify the *source* of the wrongness.

  *   **Universalist Prediction:** Both are wrong. Case A is "Purity," Case B is "Fairness." Participants will struggle to explain *why* Case A is wrong ("It's just wrong") but will articulate reasons for Case B. This "dumbfounding" is universal.
  *   **Relativist Prediction:** WEIRD will rate B > A. Small-Scale may rate A > B. Crucially, in some cultures, Case A will be categorized as "Ritual Error" (like a mistake in hunting prep) rather than "Moral Wrong," while Case B is "Social Conflict." They are different categories entirely, not two flavors of "Wrong."
  *   **Give Ground:**
      *   *Universalist:* If Case A is consistently rated "Okay" in cultures without national symbols or concepts of "sacred objects."
      *   *Relativist:* If participants in *all* cultures categorize both A and B under the same linguistic label for "Immoral/Taboo" rather than separating them into "Ritual" vs. "Social."

  ***

  ### V. Journalist's Post-Mortem: The Verbal Dispute

  You asked where the fight smells verbal. It smells verbal in the word **"Objective."**

  **1. The Definition Mismatch**
  *   **The Universalist** is using "Objective" to mean **"Intersubjectively Stable."** They are arguing that if you strip away culture, you find a shared biological bedrock. For them, "Morality is real" means "Morality is a natural kind, like vision or language."
  *   **The Relativist** is using "Objective" to mean **"Mind-Independent Truth."** They are arguing that moral facts cannot exist without a cultural framework to sustain them. For them, "Morality is real" means "There is a view from nowhere that validates this rule."

  **2. The Evaporation**
  If you force the Universalist to admit that biology only dictates *potentialities* (we can learn purity, but we don't have to), and force the Relativist to admit that culture operates on *constraints* (you can't build a morality on random noise), the gap shrinks.
  *   The Universalist is actually saying: "Human nature makes some moralities easier to learn than others."
  *   The Relativist is actually saying: "Human nature is too flexible to dictate specific moral truths."
  *   **Agreement:** They are arguing about the *tightness* of the biological leash, not the existence of the dog.

  **3. The Metaethical Non-Starter**
  Can empirical data touch the metaethical question? **No.**
  *   **The Is/Ought Gap:** Even if you prove 100% of humans have an innate module that says "Incest is Wrong," you have not proven "Incest *is* Wrong." You have only proven "Humans *believe* Incest is Wrong."
  *   **The Universalist Trap:** They often slide from "This is universal" to "This is good." That is a philosophical error, not a scientific finding.
  *   **The Relativist Trap:** They often slide from "This varies" to "Nothing is true." That is also a philosophical error. Variation does not entail nihilism.

  **Conclusion for the Feature:**
  The data can settle whether moral psychology is constrained. It cannot settle whether morality is *True*. The Universalist is studying the hardware; the Relativist is studying the software. They are both right that the computer doesn't work without both, but they keep fighting over which one runs the show. The "Objective" they are fighting over is a ghost neither can catch with a survey.
