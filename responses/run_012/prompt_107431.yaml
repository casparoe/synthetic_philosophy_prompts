answer: |-
  Hi there,

  I wanted to follow up on our conversation about the reading group and the memetic argument your colleague keeps advancing. It is a frustrating position to encounter because it wears the armor of hard science while often smuggling in philosophical commitments that deserve scrutiny. You are right to want to audit the analogy rather than simply waving it away, so I have spent some time mapping out the correspondence they rely on and identifying where the structural supports give way. To begin with, we can lay out the correspondence in continuous prose to see exactly what is being claimed. In the biological case, the gene plays the role of the replicator, the organism serves as the vehicle or phenotype, the ecological niche is the environment, reproductive success constitutes fitness, copying errors are mutations, stochastic fluctuations in allele frequency are drift, and differential survival is selection. In the cultural case your colleague proposes, the meme or idea plays the role of the replicator, human behavior or artifacts serve as the phenotype, the social context is the environment, transmissibility constitutes fitness, modification during learning is mutation, random shifts in popularity are drift, and differential adoption is selection. If we look closely at this mapping, the roles of variation and selection are filled relatively cleanly, since we can observe ideas changing and some spreading while others vanish without much argument. However, the roles of replicator and phenotype are filled only by stipulation. We have to insist that an idea exists independently of its expression to call it a replicator, and we have to treat human beings as mere vehicles rather than agents to maintain the phenotype distinction. The environment is also tricky because in culture, the environment includes other minds which are themselves changed by the replicators, creating a feedback loop absent in standard genetics, meaning the cultural case fills these roles only if we agree to ignore the active nature of the host.

  Once we have this mapping on the table, we can tell you where it breaks, and there are several critical fractures. The first major fracture is the absence of a clean genotype-phenotype distinction. In biology, the gene is hidden inside the cell and protected from the environment, while the body interacts with the world, but in culture, the idea is often inferred from the behavior, and the behavior modifies the idea during transmission. This leads to the second point, which is that cultural transmission is reconstructive and Lamarckian rather than replicative. When I learn a skill from you, I do not copy a string of code; I infer your intent and reconstruct the skill, often improving it or altering it based on my own understanding, which means acquired characteristics are passed on, violating the Weismann barrier that protects the biological analogy. Third, there is guided variation, meaning humans are not passive vessels but modify ideas intentionally to solve problems, so variation is not random with respect to fitness, which undermines the blind variation requirement of strict Darwinism. Fourth, there is a designer inside the system, because our cognitive architecture is not neutral and has biases that favor certain types of information, acting as a filter that is part of the system rather than external to it. Finally, and perhaps most damningly, the fitness of a meme often depends on the psychological facts the Darwinian story is supposed to explain rather than presuppose, meaning that if an idea spreads because it is useful or true, then its fitness is constituted by its rational warrant, not separate from it.

  We need to separate the disanalogies that actually threaten his conclusion from the ones that are merely colorful to see where the argument stands. The fact that cultural transmission is faster than biological transmission is merely colorful, as it changes the timescale but not the logic of the process. The fact that memes can blend whereas genes usually do not is also manageable within a broader evolutionary framework and does not necessarily invalidate the selection mechanism. However, the reconstructive nature of transmission and the presence of guided variation are threatening disanalogies because they strike at the mechanism of inheritance and the source of variation. If variation is guided by utility, then utility is a causal factor in selection, and if transmission is reconstructive, then the fidelity required for a replicator is missing, and the unit of selection becomes fuzzy. These issues directly threaten the claim that we can explain persistence without appeal to truth or usefulness, because if the mechanism of transmission relies on human understanding, then understanding matters for the outcome. The claim that a meme's fitness depends on psychological facts is also a threatening disanalogy because it suggests that the selection pressure is internal to the host's rationality, not external like a virus.

  So, does the strong claim survive once the disanalogies are on the table? I do not think it does, and it appears the analogy was quietly carrying the conclusion the whole time by defining memes as independent agents with interests separate from hosts. Once you acknowledge that the host psychology determines fitness, you cannot bracket out truth or utility as irrelevant, because a bad argument might outcompete a good one, but often a good argument outcompetes a bad one because it works better for the humans using it. To say asking about warrant is a category mistake is to ignore that warrant is often the selection pressure, and the memetic view treats humans as dumb carriers when we are actually smart selectors. A better analogy for what cultural evolution is really doing would be ecological niche construction or perhaps a market of reasons. In niche construction, the organism actively modifies its environment, which then selects for the organism, and in culture, humans modify the information environment based on reasons, and that environment selects for future ideas. This preserves the evolutionary insight that there are systemic dynamics at play, but it centers human agency and rationality as part of the selective landscape rather than external to it. Alternatively, think of it as a market where value is not intrinsic to the coin but depends on the traders' evaluation, meaning cultural fitness depends on human evaluation. This allows you to keep the evolutionary dynamics without surrendering the normative dimension, and it gives you a way to push back that respects the complexity of the system without accepting the reductionism. I hope this helps you push back in the next session, and let me know if you want to grab coffee to rehearse the argument.

  Best,

  A Colleague
