  I've been reading about Lewis's triviality results for indicative conditionals and I think I finally get the point, but something feels off and I want to check before I build anything on it. My understanding is this: you can't have a conditional whose probability always equals the conditional probability of the consequent given the antecedent, because if you assume that, the conditional collapses into something trivial. Fine, I buy that. But then doesn't that basically show that indicative conditionals dont have truth conditions at all -- that they're not the kind of thing that's true or false, so "the probability of a conditional" isn't even a coherent phrase to begin with? And if that's right, why do so many people still treat triviality as a constraint on what semantics you can give to 'if', as if there's some truth-conditional account it rules out but others it leaves standing? And honestly, if conditionals aren't true or false, doesn't that kind of push us back toward just reading 'if' as the material conditional -- at least that's a truth function and we know exactly what it means?

  I'm probably mixing two or three things together here. Can you straighten me out: what exactly the triviality results do and don't show, and where my reasoning goes off the rails? Also, tell me how confident you are in your reading and flag the one part of this you're least sure about.
