          *   *Conclusion on Professor's Claim:* The professor is conflating a policy rule with a metaphysical principle. The "counterfactual" in law is evidentiary (proving state of mind), not metaphysical (proving free will).

      *   **Step 5: Settled vs. Contested vs. Extrapolation.**
          *   *Settled:* Federal law uses the subjective/predisposition test (*Jacobson*). MPC uses objective. Private entrapment is no defense.
