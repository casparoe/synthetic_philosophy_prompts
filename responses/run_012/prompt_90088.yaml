      *   **User's Goal:** The user is a reporter who has encountered a law professor's claim that entrapment relies on the Principle of Alternative Possibilities (PAP), which Frankfurt cases allegedly disprove. The user suspects this analogy is flawed and wants a careful mapping of the concepts, disanalogies, and a determination of whether the federal test is a leeway (PAP) doctrine, a sourcehood doctrine, or neither.
