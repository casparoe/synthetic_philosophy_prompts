  Verdict
  Reject Step (5). It conflates causal coupling with constitutive integration. Otto's notebook meets specific criteria—constant availability, automatic trust, and easy accessibility—that search engines and shared wikis lack. While Otto accesses his notebook as automatically as Inga accesses her biology, Googlers deliberate over search results. Denying (5) blocks the slide to collective minds and trivialization without sacrificing the core parity principle. It preserves the distinction between using a tool and embodying a cognitive resource, ensuring that only processes playing the *exact* functional role of internal states qualify as mental.

  Why that step looked fine
  Step (5) appears plausible because it relies on a superficial symmetry of access. Both Otto and the modern researcher retrieve information from outside their skulls to guide action. It exploits the ambiguity in "coupled," treating any reliable causal connection as equivalent to the tight integration described in (1). Quietly, it assumes that reliability alone satisfies the "right functional role." However, Clark and Chalmers specify that the external resource must be invoked automatically, without deliberation, and trusted implicitly. Search engines require query formulation and result verification; wikis require navigation. These involve deliberative steps internal memory bypasses. The step fails because it ignores the *quality* of the coupling, mistaking causal dependence for functional identity. It assumes the internet is as transparent as a habit, which phenomenologically it is not. The visual similarity of "looking something up" masks the cognitive friction involved in digital search versus habitual recall. Furthermore, it ignores the individuation of the subject. Otto's notebook is uniquely his; the internet is public. Step (5) glosses over ownership and privacy conditions implicit in "my mind."

  The alternatives and their prices
  Rejecting (1) destroys the theoretical foundation. Functionalism allows mental states to be defined by job description rather than substrate. Abandoning it forces bio-chauvinism, denying Otto's notebook is mental simply because it isn't neural. This costs the main insight of cognitive science: multiple realizability. You lose the ability to explain cognition in non-biological systems, retreating to a Cartesian theater inside the skull. It makes cognitive science impossible for AI.
  Rejecting (4) introduces arbitrary material constraints. If portability matters, then a server-based memory ceases to be mental when Wi-Fi drops. This makes cognitive status fragile and dependent on physics rather than function. It undermines the computational theory of mind by tying cognition to specific physical locations. It violates the principle of material neutrality central to computationalism. If the substrate matters, then silicon brains aren't possible.
  Rejecting (8) accepts the trivialization. You argue that even if "mind" means "causal network," it's still useful. But this dissolves the subject. If colleagues are parts of your mind, responsibility and individuation blur. Psychology becomes sociology. The term "mind" loses its specific explanatory power regarding individual agency. It renders the thesis unfalsifiable and banal. Furthermore, it loses normative force; if we share a mind, who is responsible for errors?
  Rejecting (6) while keeping (5) is logically unstable. If resources are constitutive parts of the mind, shared resources imply shared minds. Blocking this requires an ad hoc premise about subject boundaries, weakening the parity principle. It creates an inconsistent system where constitution doesn't imply identity. This undermines the logical coherence of the argument structure itself.
  Rejecting (5) is the only move that saves the Otto case without accepting the "Google mind." It maintains a robust distinction between scaffolded cognition and mere tool use, preserving the integrity of the individual cognitive agent while allowing for genuine extension. It keeps the thesis substantive rather than universal. It ensures the extended mind thesis remains a controversial, substantive claim about cognitive boundaries rather than a tautology about tool use. It preserves the shock value that makes the thesis philosophically interesting. Ultimately, sacrificing (5) protects the thesis from becoming a trivial truth about causal interaction.

  What survives
  A nuanced Extended Mind Thesis survives, restricted to resources meeting the "glue and trust" criteria. Otto's notebook remains a paradigmatic case of extension, demonstrating that cognition isn't skull-bound. However, the internet remains a tool, not a mind. This residue explains how agents offload specific cognitive loads—like navigation or arithmetic—without dissolving the agent into their environment. It preserves the utility of psychological explanation by maintaining subject individuation while acknowledging that cognitive boundaries are permeable where functional integration is deep. It allows us to study how tools transform thinking without claiming the tools *are* the thinker. This defensible residue supports research into scaffolded cognition and human-computer interaction without collapsing into metaphysical excess. It validates the intuition that technology changes *how* we think, not just *what* we think, while retaining the agent as the locus of responsibility and consciousness.
