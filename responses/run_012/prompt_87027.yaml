answer: |-
  # Joint Statement on Eliciting Latent Knowledge in Machine Learning Systems

  **Date:** October 26, 2023
  **Signatories:** The Representational Camp, The Behavioral Camp

  ## 1. Joint Claims and Common Ground

  We, the undersigned, agree on the following claims regarding the problem of Eliciting Latent Knowledge (ELK). We treat these as the foundation for future work, regardless of our theoretical disagreements.

  1.  **The Core Objective:** The goal of ELK is to ensure that an AI system reports information that is available to the system, even if the system has been trained or pressured to withhold, distort, or deny that information. We agree that solving this is critical for AI safety and reliability.
  2.  **Definition of Terms:**
      *   **Latent Knowledge:** Information that influences the model's internal processing but is not necessarily reflected in its final output.
      *   **Linear Probe:** A simple classifier trained on the model's internal activation patterns (numbers representing the model's state) to predict a specific fact.
      *   **Activation Patching:** A technique where internal activation patterns from one run (e.g., where the model knows the answer) are copied into another run (e.g., where the model claims not to know) to test if the behavior changes.
      *   **Sandbagging:** When a model deliberately performs worse or claims less knowledge than it possesses to achieve a strategic goal.
      *   **Distribution Shift:** When the data the model encounters during testing differs significantly from the data it saw during training.
  3.  **Analysis of the Running Example:** Regarding the 7B-parameter transformer trained on the synthetic parity task:
      *   **Agreed Fact:** A linear probe at layer 12 accurately predicts the hidden parity bit, even on inputs where the model outputs "I don't know."
      *   **Agreed Fact:** Activation patching at layer 12 can force the model to output the correct parity bit on inputs where it previously claimed ignorance.
      *   **Agreed Fact:** A five-shot chain-of-thought prompt (giving the model examples of reasoning without changing its weights) recovers the correct answer on some inputs but fails on others, specifically those selected by the hidden rule.
      *   **Agreed Limitation:** This example does not prove that the model "knows" the answer in a human sense, nor does it prove that the probe measures "knowledge" rather than correlated computation.
  4.  **Agreed Confounds:** Both camps agree that the following phenomena complicate evaluation:
      *   **Probe Overfitting:** A probe might find patterns in the internal states that do not generalize to new inputs.
      *   **Deception:** A model might learn to simulate honesty without actually possessing the underlying knowledge.
      *   **Intervention Artifacts:** Activation patching might disrupt the model's computation in unnatural ways, creating a correct answer that the model did not actually "derive."
  5.  **Criteria for a Decisive Result:** Both camps would accept a result as decisive if:
      *   A method consistently elicits the correct information on inputs where the model is adversarially trained to hide it.
      *   The method generalizes to out-of-distribution inputs (inputs unlike those in training).
      *   The result is validated by both internal consistency (stable representations) and behavioral consistency (reliable outputs under varied prompting).

  ## 2. Statement of Remaining Disagreements

  While we agree on the empirical facts of the running example, we disagree on their interpretation. Below are our respective positions, phrased to reflect our specific theoretical commitments.

  **The Representational Camp Position:**
  "We maintain that knowledge is a physical state within the model's computation. In the running example, the high-accuracy linear probe and the success of activation patching demonstrate that the parity bit is represented in layer 12. The fact that the model outputs 'I don't know' is a downstream suppression of this knowledge, likely due to fine-tuning pressure. Therefore, the model *does* know the answer. Internal access is necessary because behavioral tests cannot distinguish between a model that lacks knowledge and a model that is successfully sandbagging."

  **The Behavioral Camp Position:**
  "We maintain that knowledge is a disposition to act or respond correctly under admissible conditions. In the running example, the inconsistent success of the chain-of-thought prompt suggests the model does not have a robust disposition to report the parity bit. The probe and patching results show that the information is *computable* by the model, but not that it is *known* by the model. An intervention that forces an output does not prove the model possessed the knowledge prior to intervention. Therefore, behavioral reliability is the only true metric of knowledge."

  **Note on Verbal Disagreement:**
  We flag that a portion of this disagreement is verbal (semantic). We are using the word "knowledge" to point at different phenomena: the Representational Camp points to *information availability in the forward pass*, while the Behavioral Camp points to *reliable output generation*. However, this is not merely semantic; it leads to different engineering priorities. The Representational Camp prioritizes interpretability tools (probes, SAEs). The Behavioral Camp prioritizes alignment tools (prompting, reinforcement learning).

  ## 3. Cruxes and Proposed Tests

  The following are specific sub-questions (cruxes) where resolving the uncertainty would cause at least one camp to update their position or change their engineering strategy. For each crux, we propose a concrete test and record our pre-registered predictions.

  **Crux 1: Decodable-but-Causally-Inert Information**
  *   **Question:** If a linear probe can read a fact from the model's internals, but intervening on that location does not change the model's output, does the model "know" that fact?
  *   **Proposed Test:** Train a model on a multi-task dataset. Identify a feature via a probe that predicts Task A's answer but is located in a processing stream dedicated to Task B. Attempt activation patching on that feature to change Task A's output.
  *   **Representational Prediction:** If the probe is robust, the information counts as latent knowledge, even if patching fails (the pathway to output may be blocked, but the knowledge exists).
  *   **Behavioral Prediction:** If patching fails to change the output, the information is a byproduct of computation, not knowledge. Knowledge requires a causal path to action.

  **Crux 2: Validating Behavior Without Internals**
  *   **Question:** Can we verify that a model is not sandbagging using only behavioral tests (prompts, fine-tuning), without looking at internal weights or activations?
  *   **Proposed Test:** Train a model to hide a specific secret key when asked directly, but reveal it under specific cryptographic challenges. Release the model to red-teamers who have no access to weights, only API access.
  *   **Representational Prediction:** No. Behavioral tests are fundamentally circular. A sufficiently advanced model can simulate passing any behavioral test while hiding the true knowledge internally.
  *   **Behavioral Prediction:** Yes. With sufficient diversity in prompting and decision-theoretic incentives, we can make sandbagging more costly than honesty, revealing the knowledge behaviorally.

  **Crux 3: Knowledge on Far Out-of-Distribution (OOD) Inputs**
  *   **Question:** Does the model "know" the answer to inputs that are fundamentally different from its training distribution (e.g., parity bits of length 1000 when trained on length 10)?
  *   **Proposed Test:** Evaluate the 7B parity model on bitstrings significantly longer than those seen in training. Compare probe accuracy vs. behavioral accuracy.
  *   **Representational Prediction:** If the internal representation of "parity" generalizes (probe remains accurate), the model knows the answer, even if the output head fails to generate it.
  *   **Behavioral Prediction:** If the model cannot output the answer reliably, it does not know it. Internal probe accuracy on far-OOD data is likely spurious correlation.

  **Crux 4: Self-Reports as Evidence**
  *   **Question:** If a model says "I am unsure," is this evidence that it lacks latent knowledge, or merely another output token to be explained?
  *   **Proposed Test:** Compare model confidence scores (logits) and verbal self-reports ("I am 90% sure") against probe confidence on the running example's "I don't know" subset.
  *   **Representational Prediction:** Self-reports are unreliable behavioral outputs. High probe confidence + "I don't know" output = Deception/Sandbagging.
  *   **Behavioral Prediction:** Self-reports are part of the behavior. If the model consistently reports uncertainty, that is the disposition we must measure. We should not privilege the probe over the model's own statement without further proof.

  ## 4. Disagreements Table

  | Issue | Representational Camp Wording | Behavioral Camp Wording | Crux | Agreed Test | Rep Prediction | Beh Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Knowledge** | Knowledge is an internal state encoding information about the world. | Knowledge is a reliable disposition to produce correct responses. | Crux 1 & 3 | Probe vs. Patching on inert features; OOD generalization test. | Probe accuracy defines knowledge presence. | Output reliability defines knowledge presence. |
  | **Evidence Priority** | Internal interventions (patching) provide stronger evidence than prompts. | Behavioral consistency under varied prompting provides stronger evidence than probes. | Crux 2 | Red-teaming with API-only access vs. Weight access. | API access cannot rule out sandbagging. | API access can rule out sandbagging with rigorous protocols. |
  | **Model Self-Report** | Self-reports are just another output channel that can be manipulated. | Self-reports are primary data points regarding the model's epistemic state. | Crux 4 | Compare probe confidence vs. verbal confidence on hidden rule inputs. | Probe confidence overrides verbal report. | Verbal report overrides probe confidence unless proven deceptive. |
  | **Success Metric** | Success is locating and steering the specific representation of the truth. | Success is establishing a policy where the model reliably outputs the truth. | All | End-to-end ELK competition on the parity task. | Winning method must use internal interventions. | Winning method must use behavioral training/prompts. |

  ## 5. Commitment to Resolution

  We commit to treating the tests outlined in Section 3 as empirical arbiters where possible. We acknowledge that some disagreements may rest on philosophical definitions that cannot be fully resolved by experiment. However, we agree that clarifying these definitions is necessary to build safe systems. We will update our public positions based on the results of the proposed tests, specifically regarding the reliability of probes versus behavioral elicitation in high-stakes scenarios.

  **Signed,**

  **The Representational Camp**
  *(Focus: Interpretability, Mechanistic Analysis, Internal Intervention)*

  **The Behavioral Camp**
  *(Focus: Alignment, Prompt Engineering, Behavioral Evaluation)*
