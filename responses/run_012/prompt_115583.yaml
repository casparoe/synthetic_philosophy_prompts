prompt: |-
  ok so background: I've been reading LessWrong and the old Overcoming Bias archives for like fifteen years, I know the vocabulary (indexical, reference class, observer-moments, all that) but I'm not a mathematician and I've never actually sat down and worked the anthropics stuff out on paper.

  Here's what I need. I'm one of eight people in a small giving circle. We pool maybe $400k a year, make 15ish grants, mostly longtermist-adjacent, and everything gets decided by a vote of the group. And a growing share of the proposals we get have their whole case riding on anthropic reasoning. Someone says 'under SIA you should expect vastly more observers than you'd naively think, so the EV here is astronomical.' Someone else says 'the doomsday argument means we're probably in the last century, so put the money in near-term stuff instead.' Someone wants us to fund work on whether the universe is spatially infinite. And the thing that drives me up the wall is that everyone just reaches for SSA or SIA depending on which one makes their proposal work, and since basically none of us can actually do the math we end up voting on vibes. Nobody in the circle can even tell me whether that's a real disagreement or a free parameter people are tuning.

  So what I want from you is a procedure. Not another essay about the debate -- an actual checklist that a non-mathematician can run on a proposal in about twenty minutes, in order, with clear stopping points, of the 'stop, the number is not usable, all you can say is that this proposal is good conditional on SSA and bad conditional on SIA' kind. It needs to tell me: (a) what facts about my own existence I'm allowed to condition on when doing the estimate, (b) how to pick a reference class without it being pure convenience, since every argument I've ever had about this ends with someone picking the reference class that gives them their answer, (c) exactly where SSA and SIA come apart on a given proposal and whether that divergence should kill the proposal or just get flagged for the group, and (d) what to do about the presumptuous philosopher type case, where the mere fact that one hypothesis implies way more observers makes you almost certain it's true without doing any physics. Please don't average the two assumptions into some mushy middle number -- that's exactly the move that lets us pretend we have a number when we don't.

  Then run the procedure on three proposals and show your work: (1) fund X because there are astronomically many future people, so the EV is huge; (2) fund Y because the doomsday argument says we're early and the window is closing; (3) fund Z, about whether the universe is infinite and whether infinitely many observers makes our EV numbers meaningless or undefined. I fully expect the procedure to tell me something I don't want to hear on at least one of these, so say which and don't soften it. And be upfront about where the procedure just can't decide anything and a human has to pick a prior and write down that they picked it, and where it will misfire on unusual proposals. Also I half-remember some Adam and Eve case that's supposed to break one of the reference classes -- if that's a real thing, tell me what it does to the checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time LessWrong/Overcoming Bias reader (15 years), knows the vocabulary (indexical, reference class, observer-moments, SSA, SIA, etc.), part of an EA/longtermist giving circle ($400k/year, 15 grants), non-mathematician but intellectually sophisticated.
      *   **Problem:** Giving circle proposals rely heavily on anthropic reasoning (SIA vs. SSA, Doomsday, infinite universes). Members cherry-pick anthropic assumptions to fit desired outcomes ("voting on vibes"). No one can do the math.
      *   **Goal:** A *procedure/checklist* (not an essay) for non-mathematicians to evaluate anthropic claims in grant proposals within ~20 minutes.
      *   **Requirements:**
          *   Clear stopping points (e.g., "Stop, number not usable").
          *   Address (a) conditioning facts, (b) reference class selection, (c) SSA/SIA divergence, (d) Presumptuous Philosopher problem.
          *   No averaging/mushing of SSA/SIA.
          *   Run the procedure on three specific proposals (X: Future People EV, Y: Doomsday/Early Window, Z: Infinite Universe/EV undefined).
          *   Be upfront about failures/limitations (including Adam & Eve).
          *   Tone: Direct, technical but accessible, no fluff, "say which and don't soften it."

  2.  **Deconstruct the Anthropics Problem for a Checklist:**
      *   *Core Issue:* Anthropics isn't physics; it's decision theory + probability + self-locating belief. There is no consensus "correct" answer (SSA vs. SIA vs. FNC vs. UDASSA, etc.).
      *   *Constraint:* The user wants a *procedure* to decide funding, not a resolution to the philosophical debate. The procedure must force clarity on *which* assumptions drive the EV.
      *   *Strategy:* The checklist needs to isolate the anthropic multiplier. If the EV changes by orders of magnitude based *only* on the anthropic assumption, the proposal is "Anthropically Sensitive." If it's sensitive, the circle must vote on the *assumption*, not the EV.

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Step 1: Identify the Claim.* Is anthropics actually doing work? Or is it just window dressing?
      *   *Step 2: Reference Class.* This is the biggest source of gerrymandering. Need a rule. *Rule:* The reference class must be defined *before* looking at the hypothesis outcomes, or based on "indistinguishability."
      *   *Step 3: Conditioning.* What do we know? "I exist" is trivial. "I exist at time t with properties P" is the key.
      *   *Step 4: SSA vs. SIA Test.* Calculate EV under both. If they diverge significantly, flag it.
      *   *Step 5: Presumptuous Philosopher Check.* Does the hypothesis win *solely* because it postulates more observers? If yes, discount heavily or require independent physical evidence.
      *   *Step 6: Decision Rule.* If divergent, don't fund based on the high-EV anthropic claim alone. Fund only if robust to both, or explicitly vote on the anthropic prior.

      *Refining the Reference Class Rule:* This is hard. Bostrom's "Relativized Reference Class" is too vague. Let's suggest the "Minimal Indistinguishability" rule: Include only observers you couldn't distinguish yourself from *before* seeing the specific data relevant to the hypothesis.
      *Refining the Presumptuous Philosopher:* This is the SIA bug. The checklist needs a "Sanity Check" against physical priors. If SIA overrides a 10^-100 physical prior just because of observer count, reject the SIA calculation for funding purposes.

  4.  **Developing the Three Test Cases:**
      *   *Proposal 1 (Future People EV):* Standard longtermism. "Save future lives."
          *   *Anthropic Lever:* SIA says more future people = higher prob we are in a world with future people? No, usually it's about the *value* of the future. Wait, the prompt says "fund X because there are astronomically many future people." This sounds like SIA boosting the probability of a long future *or* just raw headcount utilitarianism.
          *   *Correction:* Usually, anthropics affects the *probability* of the future existing (Doomsday), not just the value. If the claim is "EV is huge because N is huge," that's just total utilitarianism, not necessarily anthropics. I need to interpret this as "Anthropics suggests the future is likely to be large (SIA) vs small (SSA/Doomsday)."
          *   *Verdict:* Likely fails the "Robustness" check. SSA (Doomsday) cuts the future short. SIA keeps it long. Divergence is massive.
      *   *Proposal 2 (Doomsday/Early Window):* "Fund near-term because Doomsday says we're late."
          *   *Anthropic Lever:* SSA Doomsday argument.
          *   *Verdict:* Depends entirely on Reference Class. If RC is "humans," Doomsday looms. If RC is "observer-moments in galaxy," maybe not. Checklist should flag RC gerrymandering.
      *   *Proposal 3 (Infinite Universe):* "Fund physics to check if universe is infinite."
          *   *Anthropic Lever:* If infinite, SIA breaks (probabilities undefined/zero). Measure problem.
          *   *Verdict:* Hard stop. "Undefined EV." Cannot fund based on this.

  5.  **Addressing Specific Constraints:**
      *   *Adam & Eve:* This is the SSA paradox where SSA implies psychic powers (Adam can reason that if he doesn't procreate, he's unlikely to be early in the human sequence, so he won't procreate). It shows SSA can lead to absurd causal reasoning. I need to mention this in the limitations/SSA section.
      *   *No Mushy Middle:* Explicitly state: "Do not average. Report Range."
      *   *Tone:* Professional, direct, slightly weary of the nonsense (matching user's frustration).

  6.  **Writing the Response (Mental Outline):**
      *   **Intro:** Acknowledge the pain point. Validate that this is a known failure mode in EA circles.
      *   **The Protocol (The Checklist):** 5 Steps.
          1.  Is Anthropics Causal or Evidential?
          2.  Reference Class Lock-in.
          3.  The SIA/SSA Divergence Test.
          4.  The Presumptuous Sanitization.
          5.  The Funding Decision Rule.
      *   **Running the Protocol:** Apply to X, Y, Z.
      *   **The Adam & Eve Note:** Explain the SSA pathology.
      *   **Limitations:** Where this fails.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Keep the math to ratios. Don't ask for integrals. Ask for "Order of Magnitude."
      *   *Critique:* How to handle Reference Class without math?
      *   *Fix:* Use the "Blind Test." Could you have defined this class before knowing the hypothesis?
      *   *Critique:* Proposal 1 is tricky. Usually, longtermism doesn't rely on SIA for the *size* of the future, but SIA affects the *probability* of being in a world where the future is large (if linked to simulation arguments or multiverse). I need to be precise. The prompt says "under SIA you should expect vastly more observers." This implies the *existence* of the future is the variable.
      *   *Critique:* Proposal 3 (Infinite Universe). This is the Measure Problem. SIA fails hard here. I need to be firm: "No EV can be calculated."

  8.  **Final Polish:** Check against the "don't soften it" instruction. Ensure the "Stop" points are clear. Make sure the Adam & Eve explanation is accurate (it attacks SSA's handling of causal links).

      *(Self-Correction on Adam & Eve)*: Adam & Eve is specifically an objection to SSA combined with causal reasoning. SSA says "I am likely early." If Adam decides "If I have sex, billions will exist, making me unlikely to be early," SSA implies he can influence conception by reasoning. This is the "psychic powers" objection. I should note this makes SSA dangerous for proposals involving *causal* influence on population size.

      *(Self-Correction on Reference Class)*: The "Non-Ad Hoc" rule is crucial. Define the class *before* evaluating the grant.

      *(Final check on tone)*: Ensure I sound like a colleague, not a lecturer. Use EA/LW jargon correctly.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a known failure mode in longtermist circles. You are experiencing *anthropic arbitrage*: members selecting the anthropic principle that maximizes the EV of their pet project. Since there is no consensus truth on SSA (Self-Sampling Assumption) vs. SIA (Self-Indication Assumption), you cannot resolve the debate. You can only isolate it.

  Below is the **Anthropic Sensitivity Protocol (ASP)**. It is designed to be run by a non-mathematician in 20 minutes. It does not solve anthropics; it prevents anthropics from hiding uncertainty.

  ### The Anthropic Sensitivity Protocol (ASP)

  **Time Limit:** 20 Minutes
  **Goal:** Determine if the proposal's EV is *robust* or *anthropically contingent*.
  **Rule:** Do not average SSA and SIA. Report the range. If the range spans orders of magnitude, the EV is undefined for voting purposes.

  #### Step 1: The Causal vs. Evidential Check (2 Minutes)
  Ask: *Does the grant change the number of observers, or does it just help the observers that exist?*
  *   **Type A (Evidential):** The grant saves lives/cures disease/improves welfare for a fixed population. (Anthropics usually irrelevant).
  *   **Type B (Causal):** The grant affects whether the future exists, whether simulations are run, or whether the universe is infinite. (Anthropics critical).
  *   **Action:** If Type A, skip to Step 5 (File as "Anthropically Robust"). If Type B, proceed to Step 2.

  #### Step 2: Reference Class Lock-In (5 Minutes)
  This prevents gerrymandering. The reference class (RC) cannot be chosen to fit the hypothesis.
  *   **The Blind Definition Rule:** Write down the RC *before* calculating the probability.
  *   **The Indistinguishability Test:** Could you have defined this class without knowing the specific outcome of the grant?
      *   *Bad RC:* "Observers who live in worlds where the grant succeeds." (Tautology).
      *   *Bad RC:* "Humans." (Too narrow if considering AI/aliens).
      *   *Good RC:* "All conscious observer-moments with subjective experience subjectively indistinguishable from mine prior to seeing this data."
  *   **Action:** Write the RC on the proposal cover sheet. If the proponent cannot define the RC without referencing the hypothesis outcome, **STOP.** Flag as "Reference Class Gerrymandering." The number is unusable.

  #### Step 3: The Divergence Test (5 Minutes)
  Calculate the probability of the key outcome (e.g., "Humanity survives 1 million years") under two assumptions. You do not need integrals; use ratios.
  *   **Assumption 1 (SSA):** "I am a random sample from the set of all observers *in my reference class*."
      *   *Effect:* Penalizes hypotheses that create huge numbers of observers. (Favors Doomsday).
  *   **Assumption 2 (SIA):** "I am a random sample from the set of all *possible* observers, weighted by the number of observers in each world."
      *   *Effect:* Rewards hypotheses that create huge numbers of observers. (Favors Long Future/Multiverse).
  *   **Action:** Compute the ratio $P(H|SIA) / P(H|SSA)$.
      *   If Ratio < 10x: **Flag as "Low Sensitivity."** Proceed to vote.
      *   If Ratio > 100x: **Flag as "Anthropically Contingent."** The EV is not a number; it is a function of your anthropic prior.

  #### Step 4: The Presumptuous Sanitization (5 Minutes)
  This addresses the "Presumptuous Philosopher" problem (where SIA allows you to reject physical theories solely because they imply fewer observers).
  *   **The Physics Floor:** Does the hypothesis rely *solely* on observer count to override physical priors?
      *   *Example:* "Theory A says 10^10 observers. Theory B says 10^50 observers. SIA says Theory B is 10^40 times more likely, even if physics favors A."
  *   **Action:** If the proposal relies on SIA to override a physical prior of < 1% by a factor of > 10^6, **STOP.**
      *   *Reasoning:* This is epistemic magic. You cannot fund physics research based on a probability boost that ignores the physics.
      *   *Requirement:* The proponent must provide independent physical evidence for the hypothesis, not just anthropic likelihood.

  #### Step 5: The Decision Rule (3 Minutes)
  *   **If Robust (Step 1 Type A or Step 3 Low Sensitivity):** Vote on the EV as normal.
  *   **If Contingent (Step 3 High Sensitivity):** You must vote on the *Anthropic Prior*, not the project.
      *   *Option A:* Fund only if the project is high-EV under *both* SSA and SIA.
      *   *Option B:* Explicitly vote: "Does this circle adopt SIA or SSA as its operating prior for this fiscal year?" (Recommended: Adopt a "Conservative Prior" which defaults to SSA for existential risk to avoid Presumptuous errors).
  *   **If Undefined (Step 4 Fail or Infinite Universe):** The proposal is **Unfundable** on the stated grounds. It requires theoretical resolution before capital deployment.

  ---

  ### Running the Protocol on Your Proposals

  Here is the application of the ASP to the three cases you mentioned. I will not soften the conclusions.

  #### Proposal 1: "Fund X because there are astronomically many future people, so the EV is huge."
  *   **Step 1 (Causal/Evidential):** Type B. The value depends on the *existence* of the future population.
  *   **Step 2 (Reference Class):** "Future human-like observers." Passes Blind Definition, mostly.
  *   **Step 3 (Divergence):**
      *   *SSA:* Doomsday Argument applies. If we are early in the sequence, the total sequence is likely short. Probability of 10^50 future people is drastically reduced.
      *   *SIA:* Worlds with 10^50 people are 10^50 times more likely to contain "me" than worlds with 10^10 people. Probability is drastically increased.
      *   *Ratio:* > 10^20.
  *   **Step 4 (Presumptuous):** High risk. If the physical probability of a long future is low, SIA overrides it purely via headcount.
  *   **Step 5 (Decision):** **ANTHROPICALLY CONTINGENT.**
      *   *Verdict:* You cannot vote on this EV. Under SSA, the EV collapses (Doomsday). Under SIA, the EV explodes.
      *   *Hard Truth:* If your circle funds this based on the SIA number, you are effectively betting that SIA is true. If SIA is false, you have wasted resources on a mirage.
      *   *Recommendation:* Fund only if the project has near-term co-benefits that are robust to Doomsday. If it is *purely* long-termist based on headcount, **reject** until the circle resolves its anthropic prior.

  #### Proposal 2: "Fund Y because the Doomsday Argument says we're early and the window is closing."
  *   **Step 1 (Causal/Evidential):** Type B. Claims existential risk is higher than naively thought due to anthropics.
  *   **Step 2 (Reference Class):** "Humans."
      *   *Critique:* Fails Indistinguishability Test. Why "humans" and not "mammals" or "AI"? If the RC is "all intelligent observers," the Doomsday conclusion weakens significantly because the sample space is larger and less defined.
      *   *Flag:* **Reference Class Gerrymandering.** The proponent likely chose "humans" because it maximizes the Doomsday pressure.
  *   **Step 3 (Divergence):**
      *   *SSA:* Supports Doomsday.
      *   *SIA:* Counters Doomsday (SIA favors worlds with more observers, pushing Doomsday further out).
      *   *Ratio:* High divergence.
  *   **Step 4 (Presumptuous):** Low risk (SSA is conservative).
  *   **Step 5 (Decision):** **REFERENCE CLASS FAILURE.**
      *   *Verdict:* The argument holds *only* if the RC is "Humans." If the RC is "Observer-moments in the light cone," the math changes.
      *   *Hard Truth:* This proposal is trying to use SSA to create urgency, but the RC is chosen ad hoc to create that urgency.
      *   *Recommendation:* **Reject the anthropic justification.** Fund Y only if the near-term risk is high *ignoring* the Doomsday argument. Do not pay a premium for the Doomsday multiplier.

  #### Proposal 3: "Fund Z, about whether the universe is infinite and whether infinitely many observers makes our EV numbers meaningless or undefined."
  *   **Step 1 (Causal/Evidential):** Type B. Fundamental physics/cosmology.
  *   **Step 2 (Reference Class):** "Observers in the universe."
  *   **Step 3 (Divergence):**
      *   *SSA:* Breaks down with infinite sets (measure problem).
      *   *SIA:* Breaks down with infinite sets (probabilities become 0/0 or undefined).
  *   **Step 4 (Presumptuous):** N/A. The math itself fails.
  *   **Step 5 (Decision):** **UNDEFINED.**
      *   *Verdict:* **STOP.** You cannot calculate EV here.
      *   *Hard Truth:* If the universe is spatially infinite, standard expected utility theory breaks (infinite ethics). You cannot compare "saving 1 billion lives" vs "saving 2 billion lives" if both are subsets of an infinite set without a measure theory solution.
      *   *Recommendation:* **Do not fund.** This is theoretical research, not grant-making. You are a giving circle, not a philosophy department. Until there is a consensus on the "Measure Problem" in cosmology, any EV number written on this proposal is fiction. Fund it only as "pure science" with no attached EV claims.

  ---

  ### The Adam & Eve Problem (SSA Pathology)
  You asked about the Adam and Eve case. It is real, and it breaks the checklist if you are not careful.

  *   **The Case:** Adam reasons: "If I have sex with Eve, billions of descendants will exist. If I don't, only two of us exist. Under SSA, I am a random sample from all humans. It is vastly more likely I am one of the billions than one of the first two. Therefore, if I reason correctly, I should expect *not* to have sex, because if I did, I wouldn't be 'Adam' (early)." SSA implies Adam can influence conception by reasoning.
  *   **What it does to the Checklist:** It attacks **Step 3 (SSA)**. It shows that SSA can imply "psychic powers" (reasoning affects causal outcomes) when the observer's existence is causally linked to the hypothesis.
  *   **The Fix:** In Step 3, if the proposal involves **causal influence over who exists** (e.g., fertility grants, AI creation, simulation creation), **SSA is unsafe.**
      *   *Protocol Update:* If the grant changes *who* exists (not just their welfare), you cannot use SSA for the EV calculation. You must use SIA or a causal decision theory variant (like TD-SSA).
      *   *Practical Consequence:* For most EA grants (saving existing lives), Adam & Eve doesn't apply. For grants involving *creating* AI or *seeding* space colonies, SSA is dangerous. Flag these as "Causal Anthropics Risk."

  ### Limitations & Where This Misfires
  1.  **The "Mushy Middle" Temptation:** The checklist forbids averaging. This will feel uncomfortable. You will have a proposal with EV $10M (SSA) and $10B (SIA). You cannot say "$5B." You must say "Range: $10M–$10B." If your circle requires a single number to rank grants, **this protocol will break your ranking system.** You must switch to range-based voting.
  2.  **Unusual Proposals:** This fails on "Simulation Arguments" where the base reality is unknown. The Reference Class Lock-In (Step 2) becomes impossible because you don't know if you are a sim. In these cases, default to **Step 4 (Presumptuous Sanitization)** and reject the claim unless there is non-anthropic evidence.
  3.  **Human Priors:** The protocol forces you to admit you are picking a prior. It does not tell you which one is true. If your circle is 50% SIA and 50% SSA, you will deadlock on Proposal 1. That is a feature, not a bug. It prevents you from spending $400k on a philosophical gamble disguised as math.

  ### Summary Instruction for Your Circle
  Print the ASP. Attach it to every proposal form.
  If a proposal triggers a **STOP** in Step 2 or 4, or a **CONTINGENT** in Step 3, the proponent must either:
  1.  Remove the anthropic claim and re-calculate EV.
  2.  Explicitly ask the circle to vote on adopting SIA or SSA for the year.

  If they refuse, the proposal is procedurally invalid. Stop voting on vibes. Start voting on assumptions.
