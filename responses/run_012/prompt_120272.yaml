  2. Does your argument tacitly presuppose that the present is metaphysically privileged, and what becomes of it if all times are equally real? If you claim it remains valid under eternalism, how does the dimension of agency retain normative force without an ontologically distinct now?
  3. Does the rationality of pure time preference license discounting other people's future welfare and not merely one's own? If you restrict it to the self, how do you reconcile this with the impartiality required by most consequentialist frameworks that employ discounting?
  4. What separates the bias you permit from arbitrary indexical biases, such as caring less about whatever happens to fall on a given weekday? If you appeal to the necessity of temporal deliberation, why does the necessity of spatial location not generate a comparable rational permission for spatial discounting?
  5. If we already discount future welfare for the uncertainty of its occurrence, does adding a pure time preference amount to double counting the same risk? If you deny this, how do you prevent the combined discount rate from rendering long-term obligations morally negligible?
