prompt: |-
  I am drafting the methods section of a paper on subgroup analysis, and I keep meeting reversals in which a treatment looks better overall but worse in every subgroup, or the reverse. Before I settle on a rule for handling them, give me the full specification: what must any adequate account of this phenomenon deliver? I want the desiderata list, with the case or consideration behind each requirement, not a survey of who has said what.

  The list should cover the cases the account must get right — including a reversal that persists under finer and finer stratification, one that appears only after conditioning on a variable that is a common effect of the treatment and the outcome, and one that turns out to be an artifact of the effect measure rather than of confounding; the distinctions it must not collapse (association from causation in the statement of the result; a common cause from an intermediate variable from a common effect; what to condition on from which population to average over; a pooled number being misleading from the treatment working differently in different people); and the mathematical facts it cannot contradict.

  Two things I especially want. First, whether any pair of the requirements is jointly unsatisfiable — my suspicion is that a demand for full generality and a demand for a verdict derivable from the data alone cannot both be met, and if so I want that stated as a result of the list rather than as a caveat. Second, which single requirement does the most to exclude the accounts people actually offer. Mark which requirements are non-negotiable and which are preferences of a particular camp.

  Assume throughout that the account has to be usable by someone who must commit to an analysis plan before seeing the data, and who will have to defend the resulting decision to a committee that does not share their statistical framework. Close with a brief note on which families of positions the list eliminates and which survive it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Topic:** Subgroup analysis reversals (Simpson's Paradox and related phenomena) in the context of drafting a methods section for a paper.
      *   **Goal:** A "full specification" or "desiderata list" for an adequate account of this phenomenon.
      *   **Constraints:**
          *   Not a survey of literature (who said what).
          *   Must cover specific cases (persistent reversal, conditioning on a collider, effect measure artifact).
          *   Must maintain specific distinctions (association vs. causation, confounder vs. mediator vs. collider, conditioning vs. averaging, pooled misleading vs. heterogeneity).
          *   Must respect mathematical facts.
          *   **Crucial Requirement 1:** Identify if any pair of requirements is jointly unsatisfiable (specifically suspecting "full generality" vs. "verdict from data alone").
          *   **Crucial Requirement 2:** Identify which single requirement excludes the most common existing accounts.
          *   **Labeling:** Mark requirements as "Non-negotiable" vs. "Preference of a particular camp."
          *   **Context:** Usable by someone committing to an analysis plan *before* seeing data, defensible to a committee with mixed statistical frameworks.
          *   **Ending:** Brief note on which families of positions are eliminated vs. survive.

  2.  **Analyze the Phenomenon (Simpson's Paradox/Reversals):**

      *   What is it? $P(Y|do(X))$ vs $P(Y|X, Z)$. Aggregated association differs from stratified association.
      *   Why does it happen? Confounding, selection bias, effect modification, non-collapsibility.
      *   What is the core problem? Deciding which number (aggregate or stratified) represents the "true" causal effect or the correct decision basis.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Causal vs. Associational.* The account must distinguish between $P(Y|X)$ and $P(Y|do(X))$. Reversals are often causal puzzles, not just arithmetic quirks.
      *   *Requirement 2: The DAG/Structure.* You can't solve it with numbers alone. You need to know the relationships between $X, Y, Z$. (This addresses the "data alone" suspicion).
      *   *Requirement 3: Colliders.* Conditioning on a common effect (collider) induces bias. The account must forbid adjusting for colliders.
      *   *Requirement 4: Mediators.* Conditioning on an intermediate blocks the path. The account must distinguish total vs. direct effect.
      *   *Requirement 5: Effect Measures.* Risk Difference vs. Risk Ratio vs. Odds Ratio. Non-collapsibility can cause reversals without confounding. The account must handle this.
      *   *Requirement 6: Heterogeneity.* Sometimes the aggregate is right (for population policy), sometimes subgroups are right (for personalized medicine). The account must specify the target estimand.
      *   *Requirement 7: Pre-specification.* The user needs to commit before seeing data. The rules must be algorithmic based on assumed structure, not data-driven fishing.

  4.  **Addressing the "Joint Unsatisfiability" (Crucial Requirement 1):**

      *   The user suspects "Full Generality" vs. "Verdict from Data Alone."
      *   *Analysis:* Simpson's Paradox cannot be resolved by probabilities alone (Pearl's insight). You need causal assumptions. Therefore, an account that demands a verdict *solely* from the joint distribution $P(X, Y, Z)$ is impossible if it also claims to handle *all* causal structures generally.
      *   *Formalization:* "Data Sufficiency" vs. "Causal Generality." You cannot have both.

  5.  **Addressing the "Most Exclusionary Requirement" (Crucial Requirement 2):**

      *   What do most people do wrong? They look at the numbers and try to decide based on significance or magnitude, or they assume "adjusted is always better."
      *   *Candidate:* The requirement that *causal structure (not just statistical association) determines the adjustment set.* This kills purely statistical accounts (e.g., "always adjust," "never adjust," "adjust if p<0.05").

  6.  **Refining the List & Labeling:**

      *   Need to categorize into Non-negotiable (logical/mathematical necessities) and Camp Preferences (Bayesian vs. Frequentist, Decision-theoretic vs. Estimation-focused).
      *   *Non-negotiable:* Math consistency, Causal/Associational distinction, Collider avoidance.
      *   *Preferences:* Target estimand (ATE vs. CATE), Effect measure choice.

  7.  **Drafting the Content (incorporating specific cases requested):**

      *   *Case 1: Persistent Reversal under finer stratification.* (Needs to address unmeasured confounding or infinite regress).
      *   *Case 2: Conditioning on a Common Effect (Collider).* (Needs to explicitly forbid this).
      *   *Case 3: Artifact of Effect Measure.* (Needs to address non-collapsibility).

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the gravity (Simpson's Paradox/Amalgamation Paradox).
      *   **The Desiderata List:** Grouped logically (Mathematical, Causal, Decisional). Mark Non-negotiable vs. Preference.
      *   **The Impossibility Result:** Address the "Data Alone" vs. "Generality" conflict.
      *   **The Exclusionary Requirement:** Identify the killer constraint.
      *   **Survivors vs. Eliminated:** Summarize the landscape.

  9.  **Refining the Tone:**

      *   Must be rigorous, precise, and suitable for a methods section defense.
      *   Avoid name-dropping (Pearl, Hernán, etc.) unless necessary for clarity, focus on the *logic*.
      *   Ensure the "Pre-specification" constraint is woven in (rules must be actionable *ex-ante*).

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I cover the effect measure artifact? *Adjustment:* Ensure non-collapsibility is explicitly mentioned in the math section.
      *   *Check:* Did I cover the "commit before data" constraint? *Adjustment:* Emphasize that the rules rely on *assumed* DAGs, not data-derived DAGs.
      *   *Check:* Is the impossibility result clear? *Adjustment:* Make it a formal "Theorem" style statement within the text.
      *   *Check:* Did I distinguish "pooled misleading" from "heterogeneity"? *Adjustment:* Ensure the estimand definition covers this (ATE vs. CATE).

  11. **Final Polish:** Check against the prompt's specific phrasing ("desiderata list," "case or consideration behind each," "non-negotiable/preferences").

      *(Self-Correction on "Most Exclusionary"):* Many accounts fail because they treat the paradox as a statistical puzzle rather than a causal one. So the requirement that "Causal assumptions are necessary inputs" is the big filter. But specifically, the requirement that *adjustment criteria must be derived from causal structure, not statistical significance* is the practical killer of standard practices. Let's go with the necessity of *extra-statistical causal assumptions*.

      *(Self-Correction on "Impossibility"):* The prompt specifically suspects "full generality" and "verdict from data alone." I need to confirm this. Yes, Pearl's "Simpson's Paradox: An Anatomy" proves that no statistical criterion can resolve the paradox without causal information. I will state this clearly.

  12. **Final Output Generation** (Proceeding to generate response based on these thoughts).

      *   *Structure:*
          1.  Intro.
          2.  Desiderata (1-7).
          3.  The Impossibility Theorem.
          4.  The Exclusionary Requirement.
          5.  Landscape Analysis.

      *   *Tone:* Professional, methodological, authoritative.

      *(Wait, one more check on the "Effect Measure" case)*: I need to make sure the list distinguishes between a reversal caused by confounding (bad) and one caused by non-collapsibility of Odds Ratios (mathematical artifact). The desiderata must require the account to distinguish these.

      *(Wait, one more check on "Pre-specification")*: The rules must be actionable *before* data. This means the account cannot rely on testing for balance or significance to decide on adjustment. It must rely on the *design* and *assumed structure*.

      *Okay, ready to write.*
answer: |-
  ### Specification for an Adequate Account of Subgroup Reversals

  To defend an analysis plan *ex-ante* to a mixed committee, your account of subgroup reversals (often colloquially grouped under Simpson's Paradox or the Amalgamation Paradox) must satisfy the following desiderata. They are categorized by their logical status.

  #### I. Non-Negotiable Requirements (Logical and Mathematical Necessities)
  *These requirements cannot be waived without rendering the account mathematically inconsistent or causally incoherent.*

  **1. The Causal-Associational Distinction**
  *   **Requirement:** The account must explicitly distinguish between a reversal in *association* (conditional probabilities) and a reversal in *causal effect* (interventional distributions).
  *   **Consideration:** A treatment can be associatively negatively correlated with recovery in every subgroup but positively correlated in the aggregate due to confounding (e.g., severity of illness drives both treatment assignment and outcome). Conversely, causal effects can be homogeneous while associations reverse. An account that treats $P(Y|X, Z)$ as equivalent to $P(Y|do(X), Z)$ fails to identify when adjustment is necessary versus when it induces bias.
  *   **Case Covered:** Distinguishes a reversal driven by confounding (adjustment required) from a reversal driven by selection bias (adjustment forbidden).

  **2. The Structural Input Constraint**
  *   **Requirement:** The account must accept as input a causal structure (e.g., a Directed Acyclic Graph or equivalent structural assumptions) specified *before* data inspection. It cannot derive the decision to adjust solely from the joint distribution of the data.
  *   **Consideration:** Identical numerical data can represent distinct causal scenarios requiring opposite actions (adjust vs. do not adjust). Without external structural assumptions, the data alone are insufficient to determine the correct estimand.
  *   **Case Covered:** Prevents the error of deciding to stratify based on statistical significance of the subgroup variable, which is data-dependent and circular.

  **3. The Collider Prohibition**
  *   **Requirement:** The account must forbid conditioning on a variable that is a common effect of the treatment and the outcome (or their causes), unless specifically estimating a direct effect under strict assumptions.
  *   **Consideration:** Conditioning on a collider opens a non-causal path between treatment and outcome, inducing a spurious association (selection bias).
  *   **Case Covered:** **The Collider Reversal.** This handles the case where a reversal appears *only* after conditioning on a variable that is a common effect. An adequate account must label this reversal as an artifact of bias, not a genuine heterogeneity of effect.

  **4. Mathematical Consistency (Non-Collapsibility)**
  *   **Requirement:** The account must distinguish between reversals caused by confounding and reversals caused by the non-collapsibility of the chosen effect measure (e.g., Odds Ratios vs. Risk Differences).
  *   **Consideration:** Some effect measures are mathematically non-collapsible; the marginal effect measure cannot equal a weighted average of conditional effect measures even in the absence of confounding.
  *   **Case Covered:** **The Effect Measure Artifact.** This handles the case where a reversal turns out to be an artifact of the effect measure rather than confounding. The account must specify which measure is collapsible or require sensitivity analysis across measures to ensure the reversal is not purely arithmetic.

  **5. Estimand Specificity**
  *   **Requirement:** The account must define the target population for the inference (e.g., the entire population vs. specific subgroups) prior to analysis.
  *   **Consideration:** A "pooled number being misleading" is only true if the target is the subgroup-specific effect. If the target is the Average Treatment Effect (ATE) for the whole population, the pooled number (properly adjusted for confounding) is the correct quantity, even if effects vary.
  *   **Case Covered:** Distinguishes **Heterogeneity** (treatment works differently in different people) from **Confounding** (pooled number is biased). It clarifies whether the goal is personalized medicine (requiring subgroup estimates) or public health policy (requiring population averages).

  #### II. Preferences of Particular Camps (Methodological Choices)
  *These requirements reflect defensible but contestable choices. You must select one option and justify it in your plan.*

  **6. The Granularity Limit (Preference: Finite vs. Asymptotic)**
  *   **Requirement:** The account must specify whether stratification stops at measured covariates or posits a limit under finer and finer stratification.
  *   **Consideration:** In observational data, finer stratification eventually leads to sparse data bias or positivity violations.
  *   **Case Covered:** **The Persistent Reversal.** This handles the case where a reversal persists under finer and finer stratification. A Bayesian camp might model this via hierarchical priors; a Frequentist camp might impose a minimum cell size. You must choose the stopping rule *ex-ante*.

  **7. The Decision Rule (Preference: Estimation vs. Decision-Theoretic)**
  *   **Requirement:** The account must specify whether the output is a point estimate of the effect or a decision rule maximizing expected utility.
  *   **Consideration:** Sometimes a treatment is superior in every subgroup but inferior overall due to cost/resource allocation constraints (or vice versa).
  *   **Case Covered:** Resolves conflicts where the "best" treatment statistically is not the "best" treatment economically or ethically for the aggregate population.

  ---

  ### The Impossibility Result

  You suspected that a demand for full generality and a demand for a verdict derivable from the data alone cannot both be met. **This is correct.**

  **Theorem (Data Insufficiency for Reversal Resolution):**
  *There exists no function $f(P(X, Y, Z))$ of the joint probability distribution alone that can correctly determine whether to trust the aggregate association $P(Y|X)$ or the stratified association $P(Y|X, Z)$ for all causal structures generating that distribution.*

  **Implication for your Methods Section:**
  You cannot claim your analysis plan is "data-driven" regarding the choice of adjustment set. You must explicitly state that the decision to trust the subgroup vs. the aggregate relies on **causal assumptions** (Requirement #2) that are not testable from the data. If your committee demands a rule based *only* on statistical tests (e.g., "adjust if the covariate is imbalanced"), you must inform them that satisfying that demand violates Logical Requirement #2 and risks Collider Bias (Requirement #3).

  ---

  ### The Most Exclusionary Requirement

  The single requirement that excludes the vast majority of accounts people actually offer is **Requirement #2: The Structural Input Constraint.**

  **Why:** Most standard statistical advice (textbook frequentist approaches, automated stepwise selection, "adjust for all baseline covariates") attempts to solve the reversal problem using statistical criteria (significance, variance reduction, balance metrics) derived *from the data*.
  *   **Excluded:** "Adjust for everything" (invites collider bias). "Adjust only if significant" (invites data-dredging and ignores causal structure). "Trust the randomized trial aggregate" (ignores effect modification).
  *   **Included:** Causal Inference frameworks (Potential Outcomes with DAGs, Structural Equation Models) that mandate a pre-specified causal model to determine the adjustment set.

  By insisting that the decision rule relies on *assumed structure* rather than *observed association*, you eliminate purely statistical accounts of the paradox.

  ---

  ### Landscape Analysis: Survivors and Eliminated

  **Eliminated Positions:**
  1.  **Purely Statistical Accounts:** Any position claiming Simpson's Paradox is a purely probabilistic phenomenon resolvable by looking at the numbers (e.g., "the larger sample size wins"). These violate Requirement #1 and #2.
  2.  **"Adjust for All" Heuristics:** Positions advocating adjustment for all pre-treatment covariates to "be safe." These violate Requirement #3 (Colliders) and #4 (Non-collapsibility).
  3.  **Data-Dependent Selection:** Positions advocating subgroup analysis only if the interaction term is statistically significant. This violates the *ex-ante* commitment constraint and Requirement #2.

  **Surviving Positions:**
  1.  **Causal Graphical Models:** Accounts based on DAGs and do-calculus survive because they explicitly encode Requirement #1, #2, and #3.
  2.  **Pre-specified Potential Outcomes:** Accounts that define the estimand (ATE vs. CATE) and adjustment set based on subject-matter knowledge prior to data lock survive.
  3.  **Decision-Theoretic Frameworks:** Accounts that frame the reversal as a loss-function problem (minimizing regret) survive, provided they incorporate causal structure into the expectation.

  **Recommendation for your Paper:**
  Adopt the **Causal Graphical/Structural** position. State clearly in your methods that your adjustment set was chosen based on a pre-specified causal diagram intended to block back-door paths (confounding) while avoiding opening front-door paths (colliders), acknowledging that this relies on untestable assumptions (Requirement #2) but is the only way to satisfy the logical necessities of causal inference (Requirement #1). This satisfies the *ex-ante* commitment constraint and provides a defensible shield against data-dredging accusations.
