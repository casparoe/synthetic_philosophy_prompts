      *   **Context:** Philosophy club discussion turned into an ethics class essay.
      *   **Key Requirements:**
          *   Explain the problem properly (distinguish from simple "we can't predict" ignorance; focus on the metaphysical/epistemic gap regarding *actual* consequences).
          *   Lay out main responses (Expected Value, Rule Consequentialism/Heuristics, Scope of Responsibility, etc.).
          *   **Crucial:** Reach a definite conclusion (no "both sides have merit" hedging).
          *   **Crucial:** Be transparent about argumentative load-bearing points and uncertainties (meta-commentary on the argument itself).
          *   **Tone:** Academic but accessible (student essay style), honest, rigorous.

  2.  **Deconstruct the Problem (The "Black Box" Objection):**
      *   *Standard Consequentialism:* Right action = maximizes actual good.
      *   *The Objection:* Actual consequences are infinite/unknowable (Butterfly Effect).
      *   *Why it's deep:* It's not just "I don't know." It's "No one knows until it happens." If moral truth depends on facts that are inaccessible at the time of action, the theory loses its action-guiding force. It makes morality a lottery ticket we can't evaluate.
      *   *The Expected Value (EV) Fix:* Shift from *Actual* Consequentialism to *Expected* Consequentialism.
      *   *The EV Problem:* Pascal's Mugging / Tiny Probabilities of Huge Payoffs. If I assign a non-zero probability to saving the world, even 1 in a billion, if the value is infinite/high enough, it dominates the calculation. This leads to absurdity (fanaticism).

  3.  **Identify Potential Responses/Escape Routes:**
      *   *Expected Consequentialism (Standard):* Use probabilities. (Vulnerable to fanaticism).
      *   *Rule Consequentialism:* Follow rules that *generally* maximize good, rather than calculating each act. (Shifts the locus of evaluation).
      *   *Satisficing/Thresholds:* Don't maximize, just do "good enough." (Doesn't solve the epistemic gap fully).
      *   *Temporal/Spatial Discounting:* Near consequences count more. (Arbitrary?).
      *   *Subjective vs. Objective Rightness:* Distinguish between what *is* right (objective) and what is *blameless* to do (subjective).

  4.  **Formulate a Thesis/Verdict:**
      *   *Option A:* Consequentialism is dead. (Too strong, ignores the resilience of EV).
      *   *Option B:* Consequentialism is fine. (Too dismissive of the fanaticism problem).
      *   *Option C (Nuanced but Definite):* Consequentialism survives *only* if it abandons the claim to be a direct decision procedure for individual acts in favor of a system of heuristics/rules grounded in expected value, but it must accept that it cannot provide precise moral arithmetic in high-stakes/long-term cases.
      *   *Refined Verdict:* The objection kills *Act Consequentialism* as a practical guide for individual actions involving long-term uncertainty. However, Consequentialism survives as a *framework for evaluating rules and institutions*, provided it adopts Expected Value but imposes a "probability threshold" to avoid fanaticism.
      *   *Actually, let's go stronger:* The objection is fatal to *Objective Act Consequentialism* (the idea that rightness is fixed by actual outcomes). It forces a shift to *Subjective Expected Consequentialism*. But even that faces the fanaticism problem. The most honest verdict is that Consequentialism survives only by ceasing to be a "calculator" for every choice and becoming a "justification" for common-sense morality, but this risks collapsing into Rule Consequentialism or Deontology.
      *   *Decision:* I will argue that the objection is **fatal to Consequentialism as a direct action-guiding theory for individual agents**, but it survives as a **criterion of rightness** if decoupled from decision-making. However, since a moral theory *must* guide action to be useful, the theory is critically maimed. I will conclude that it survives only in a "watered-down" hybrid form (Rule Consequentialism with an EV backbone).
      *   *Wait, the prompt asks for a "real verdict."* Let's argue: **Consequentialism cannot survive as a theory of individual decision-making, but it remains viable as a theory of institutional design.** This allows for a clear distinction.

      *   *Re-evaluating based on "load-bearing" requirement:* I need to be clear about *why* I pick this. The load-bearing point is the distinction between *criterion of rightness* and *decision procedure*. If we conflate them, the theory dies. If we separate them, it lives but changes shape.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Hook with the hoodie example. Define the "Epistemic Black Box." State the thesis: The objection kills Act Consequentialism as a decision procedure, forcing a retreat to Rule Consequentialism or Institutional application.
      *   **The Problem (Deep Dive):** Distinguish "ignorance" from "inaccessibility." The Butterfly Effect. The "Actual vs. Expected" distinction. Why Actual Consequentialism fails (makes morality luck-based and unknowable).
      *   **Response 1: Expected Consequentialism:** Shift to probabilities. Explain the math. Introduce the "Pascal's Mugging" / Fanaticism problem (tiny prob x huge value = infinity). Show why this is also a trap.
      *   **Response 2: Rules and Heuristics:** Rule Consequentialism. We follow rules that *usually* work. This bypasses the calculation problem. But does it betray the spirit of Consequentialism?
      *   **Response 3: Criterion vs. Procedure:** The philosophical "get out of jail free" card. Rightness is about outcomes; deliberation is about evidence.
      *   **Analysis/Verdict:** Weigh the options.
          *   *Load-bearing argument:* The distinction between *objective rightness* (what actually happened) and *subjective rationality* (what made sense at the time).
          *   *The Fanaticism Trap:* EV fails without arbitrary cutoffs.
          *   *Conclusion:* Consequentialism survives only by admitting it cannot tell you what to do in the moment. It becomes a retrospective judge, not a prospective guide. This is a major concession.
      *   **Meta-Commentary:** Explicitly state where the argument relies on assumptions (e.g., that a moral theory *must* guide action).

  6.  **Refining the Tone:**
