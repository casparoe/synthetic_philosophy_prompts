  *(Final Plan for Verdict)*: I will argue that the theory survives *conceptually* but fails *practically* for individuals. It works for governments/policies where data is better, but not for the hoodie choice. This matches the user's suggestion ("doesn't survive as a guide to individual action but does as a way to evaluate whole policies"). I will adopt this specific verdict.

