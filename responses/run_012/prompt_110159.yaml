prompt: |-
  I run the lessons-learned desk for a state health department's outbreak response unit — I'm the person who writes the after-action report for every significant outbreak or weather emergency we respond to, which works out to five or six a year, each one about a day and a half of writing, and every one of them goes into a public database that feeds into our guidance documents and next year's budget lines. So a causal claim in one of these reports has a way of hardening into policy, and a reporter once read a sentence out of a four-year-old report of mine back to me on the phone, which was not a good day. The trouble is that every report I write comes out as a story: three or four hinge moments, somebody who dropped the ball or somebody who saw it coming, and by the last page the whole thing looks like it was always going to unfold the way it did. A retired historian who sits on our advisory board keeps telling me my reports are hindsight dressed up as analysis and that the same archive could support three different stories depending on where I decide the interesting part starts. I think he's right and I don't know what the alternative is. I understand the two things he's gesturing at well enough — hindsight bias, where knowing how it turned out makes that outcome feel like it was the likely one all along and quietly erases how uncertain everyone actually was in the middle of it, and the narrative fallacy, where we squash a messy sequence into a tidy story with a couple of causes and a moral, and then mistake the story's coherence for evidence about the world. What I don't have is anything to do on Tuesday.

  So: can you turn this into a procedure I can actually run on a draft, in order, over the course of an afternoon? I want the sequence of questions, what counts as a sufficient answer to each, the point at which the procedure stops and says there is no causal finding here rather than a weak one, and the point at which it hands the decision to a person because the question is one of values or of what the department is willing to say in public. It has to survive the specific things that go wrong in my drafts. The timeline: I write it knowing the ending, and the actors didn't. The descriptions: the "first case" is only the first case because of how things turned out, and nobody in the room could have been thinking in those terms on the day. The counterfactuals: I write sentences like "had the exclusion order come on day three instead of day nine, this would have been a twelve-case outbreak," and I have no idea what license I have to write that, or what I'd have to be able to show for it. The cast: whether to name people, and how to keep the report from needing a villain. And the compression: I always end up with one or two causes because that's what makes it readable, when I suspect the honest picture is a net with several paths to the same outcome. Also please tell me which steps are judgment calls wearing the costume of method, and what the procedure simply can't do — I'd rather know where it misfires than have it paper over the gap.

  Then run it, step by step, on three drafts I'm actually sitting on. (1) A measles outbreak, 43 confirmed cases over eleven weeks, seeded by a seven-year-old returning from travel, in a county where the affected elementary school had about 84% MMR coverage; the county health officer ordered unvaccinated students excluded on day nine, and my draft says the order came six days late and would have capped the outbreak at twelve cases — that twelve is a number the epi lead produced on the back of an envelope in a meeting and I've never been able to reconstruct it. Two families also refused to cooperate with contact tracing, and the draft has quietly made them the hinge of the whole thing. (2) A four-day heat event in a metro area of about 900,000, with six excess deaths identified after the fact, where we pushed roughly 40,000 text alerts to people on a heat-buddy registry; my draft credits the alert system with averting an estimated 25 to 30 deaths, by comparison with a neighboring metro that didn't send alerts but also has different housing stock, much higher air-conditioning penetration, and a hospital labor dispute running that week. The director loves that finding, obviously. (3) A norovirus outbreak at a long-term care facility where, once I strip out the story, I think the only defensible claim is that the place was short-staffed in a way that everyone already knew about, and the director is going to want a lesson out of it anyway. I'd rather you tell me honestly which of these three the procedure returns nothing useful for.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and the Problem:**
      *   **User Role:** Lessons-learned desk, state health department outbreak response unit.
      *   **Task:** Writes After-Action Reports (AARs) for significant outbreaks/emergencies (5-6/year).
      *   **Impact:** Reports go into public databases, feed guidance documents, and influence budget lines. Causal claims harden into policy.
      *   **The Problem:** The reports suffer from *hindsight bias* (knowing the ending makes it seem inevitable) and *narrative fallacy* (squashing messiness into a tidy story with villains/heroes).
      *   **The Critic:** A retired historian on the advisory board says the reports are "hindsight dressed up as analysis" and the archive could support multiple stories.
      *   **The Request:** A concrete, step-by-step procedure to run on a draft in an afternoon. It needs to specify:
          *   Sequence of questions.
          *   What counts as a sufficient answer.
          *   Stop points (no causal finding vs. weak finding).
          *   Hand-off points (value judgments/public messaging).
          *   Identification of "judgment calls wearing the costume of method."
          *   Limitations (what the procedure *can't* do).
      *   **The Test:** Apply this procedure to three specific drafts provided by the user.

  2.  **Deconstruct the Specific Pain Points:**
      *   *Timeline:* Writer knows the ending; actors didn't.
      *   *Descriptions:* "First case" is only first in retrospect.
      *   *Counterfactuals:* "Had X happened on day 3 instead of 9..." (often based on back-of-envelope math).
      *   *Cast:* Naming names, creating villains.
      *   *Compression:* Reducing complex nets to 1-2 causes for readability.

  3.  **Develop the Procedure (The "Anti-Narrative Audit"):**
      *   *Goal:* Disrupt the story structure without destroying utility.
      *   *Structure:* Needs to be linear, actionable, and time-boxed (afternoon).
      *   *Phase 1: De-centering the Outcome (Hindsight Check).* Focus on uncertainty at the time.
      *   *Phase 2: Stress-Testing Counterfactuals (Causal Claim Check).* Focus on the "what if" math.
      *   *Phase 3: Distributing Agency (Villain/Hero Check).* Focus on systemic vs. individual failure.
      *   *Phase 4: Compression vs. Complexity (Readability vs. Truth).* Focus on the "net" of causes.
      *   *Phase 5: The Hand-off.* Identifying value judgments.

      *   *Refining the Steps:*
          *   *Step 1 (The Fog of War):* For every decision point, what did they *actually* know then? If you can't document the uncertainty, you can't claim the decision was obvious.
          *   *Step 2 (The Counterfactual Limit):* For every "If X then Y" claim, is there a model or just an envelope? If envelope, downgrade to "plausible range" or delete.
          *   *Step 3 (The Villain Test):* If a person is named as the pivot point, can you replace them with a role/process? If not, why are we naming them?
          *   *Step 4 (The Forking Paths):* Can you identify one moment where a different decision leads to the *same* outcome? If yes, your single-cause story is wrong.
          *   *Step 5 (The Policy Threshold):* Does this claim justify budget/guidance change? If the evidence is weak, can the recommendation stand on "precaution" rather than "proven efficacy"?

      *   *Defining Stop/Hand-off Points:*
          *   *Stop:* If counterfactual math is unrecoverable, the specific number must go.
          *   *Hand-off:* If the issue is "do we blame this specific nurse," that's a legal/HR/value call, not an analytic one.

      *   *Identifying "Costumed Judgment":* Acknowledging that "sufficient evidence" is itself a value judgment.

  4.  **Apply the Procedure to the Three Drafts:**

      *   **Draft 1: Measles Outbreak (43 cases, exclusion order timing, uncooperative families).**
          *   *Step 1 (Fog):* Did they know it was measles on Day 1? Probably not. Day 9 order might have been ASAP once confirmed.
          *   *Step 2 (Counterfactual):* The "12 cases" number is back-of-envelope, unreconstructible. *Action:* Delete specific number. Use "significantly reduced" or model it properly.
          *   *Step 3 (Villain):* Two families refusing tracing. Making them the hinge creates villains. *Action:* Shift to "barriers to cooperation" systemic issue.
          *   *Verdict:* Salvageable but needs heavy downgrading of causal claims.

      *   **Draft 2: Heat Event (6 deaths, 40k alerts, comparison to neighbor).**
          *   *Step 1 (Fog):* Alerts sent. Good.
          *   *Step 2 (Counterfactual):* Comparing to neighbor is fatal confounding (housing, AC, labor dispute). Claiming 25-30 lives saved is scientifically indefensible based on that comparison.
          *   *Step 3 (Villain):* No specific villain, but the "Hero" is the alert system.
          *   *Step 4 (Forking Paths):* The neighbor comparison is invalid.
          *   *Verdict:* **FAIL.** The core causal claim (lives saved) is unsupported. Must pivot to "process metric" (alerts sent) not "outcome metric" (lives saved).

      *   **Draft 3: Norovirus (LTCF, short-staffed).**
          *   *Step 1 (Fog):* Staff knew they were short.
          *   *Step 2 (Counterfactual):* If they weren't short, would outbreak stop? Maybe, maybe not.
          *   *Step 3 (Villain):* "Short-staffed" is systemic, not individual. Good.
          *   *Step 4 (Forking Paths):* It's a net.
          *   *Verdict:* **LOW YIELD.** The procedure will likely strip out the "lesson" because the cause is known/chronic. The report might not be needed, or must be framed as "reiteration of known risk" rather than "new lesson."

  5.  **Drafting the Response:**
      *   *Tone:* Professional, empathetic to the burden, rigorous, slightly bureaucratic (matching the user's context).
      *   *Structure:*
          1.  Introduction (acknowledging the stakes).
          2.  The Procedure (The "Causal Hygiene Protocol").
          3.  Limitations & Costumed Judgments.
          4.  Application to the Three Drafts.
      *   *Key Constraint:* Must answer "what counts as a sufficient answer" and "when to stop."

      *(Self-Correction during drafting)*: Make sure I don't just say "don't do it." I need to give them a way to write *something* that is honest. For the Heat Event, instead of "lives saved," suggest "coverage achieved." For the Measles, instead of "12 cases," suggest "modeling suggests earlier exclusion limits spread."
      *(Refining the "Stop" condition)*: The procedure needs a hard stop. If the counterfactual cannot be supported, the causal claim *must* be removed. It can't just be weakened; it has to be categorized as "observational" not "causal."

      *(Refining the "Hand-off")*: The decision to name names is a legal/ethical one, not an analytic one. The procedure should flag this for the General Counsel or Director.

      *(Final check on the Historian's critique)*: Ensure the procedure explicitly addresses the "archive could support three different stories" point. This means looking for alternative narratives (Step 4).

  6.  **Final Polish:** Check against the user's specific constraints (Tuesday afternoon, specific pain points). Ensure the voice matches the gravity of public health policy. (The user writes like a thoughtful civil servant; I should match that clarity).

      *Wait, one more thing:* The user asked "which of these three the procedure returns nothing useful for." I need to be explicit about that in the analysis section. Draft 3 looks like the candidate for "nothing useful" *if* the only lesson is "staffing matters." But maybe the lesson is "how staffing *specifically* broke the protocol." I need to be nuanced there. Actually, Draft 2 is the dangerous one (false precision). Draft 3 is the boring one. The prompt asks which returns *nothing useful*. Draft 3 might be the one where the AAR itself is unnecessary if the cause is pre-known. But Draft 2 is the one where the *causal claim* is useless. I will argue Draft 2 yields no *causal* finding, Draft 3 yields no *new* lesson. I'll distinguish those.

      *Re-evaluating Draft 2:* The Director loves the finding. This is a political/value hand-off. The procedure must flag this as "Evidence Insufficient for Causal Claim, Hand-off to Director for Risk Tolerance."
      *Re-evaluating Draft 3:* If the only defensible claim is known staffing issues, the AAR might be redundant. But maybe the *mechanism* is new. I'll suggest the procedure might recommend *not* publishing a causal lesson, but rather a "situational report."

      *Okay, let's build the "Causal Hygiene Protocol".*

      *Step 1: The Information Horizon.* (What did they know *then*?)
      *Step 2: The Counterfactual Audit.* (Can we support the "If/Then"?)
      *Step 3: The Villain/hero Elimination.* (System vs. Person)
      *Step 4: The Alternative Story Test.* (Historian's check)
      *Step 5: The Policy Threshold.* (Does evidence match recommendation?)

      *Let's write it.*
answer: |-
  This is a high-stakes epistemological problem disguised as a writing task. You are being asked to produce certainty from chaos, and the cost of that certainty is paid in truth. The historian is right: narrative coherence is not evidence. But you also have a job to do: the department needs to learn, and budgets need justification.

  Below is the **Causal Hygiene Protocol**. It is designed to be run on a complete draft in one sitting (approx. 3–4 hours). It does not make the writing easier; it makes the claims safer.

  ### Part 1: The Causal Hygiene Protocol

  **Pre-requisite:** Open your draft and a blank document. You will move text from the draft to the blank document only if it passes the gate.

  #### Step 1: The Information Horizon (Hindsight Check)
  **Goal:** Restore the uncertainty that existed at the time of decision.
  **Procedure:** Scan the draft for every decision point (e.g., "On Day 9, the Officer ordered exclusion").
  **Question:** What specific data did the decision-maker have *in hand* at that exact moment, and what was the range of plausible interpretations of that data *at that time*?
  **Sufficient Answer:** A citation to a situational report, email, or log from that day showing the ambiguity (e.g., "Case count was rising but etiology was unconfirmed").
  **Fail Condition:** If you cannot document the uncertainty, you cannot describe the decision as "delayed" or "timely." You must describe it only as "consistent with available data."
  **Stop Point:** If the draft relies on the decision being "obvious" in retrospect, delete the adjective.

  #### Step 2: The Counterfactual Audit (The "What If" Check)
  **Goal:** Prevent back-of-the-envelope math from hardening into fact.
  **Procedure:** Highlight every sentence that claims a different outcome would have occurred if an action had changed (e.g., "Would have capped the outbreak at twelve cases").
  **Question:** Is this number derived from a validated transmission model, or is it an estimate based on the final outcome?
  **Sufficient Answer:** A reference to a model (SEIR, etc.) with parameters stated, OR a qualitative range ("significantly reduced") backed by literature from similar outbreaks.
  **Fail Condition:** "Epi lead's back-of-envelope calculation" is not evidence.
  **Stop Point:** If the number cannot be reconstructed or modeled, **delete the specific number.** Replace with "modelling suggests earlier intervention reduces secondary attack rates."
  **Hand-off:** If the Director insists on the number for budget justification despite lack of evidence, this moves from *Analysis* to *Advocacy*. Flag for General Counsel.

  #### Step 3: The Villain/Hero Elimination (Agency Check)
  **Goal:** Shift focus from individual morality to systemic capacity.
  **Procedure:** Identify every named individual or specific family/group cited as a pivot point for the outcome (e.g., "Two families refused cooperation").
  **Question:** If I replace this specific actor with a generic role ("index household," "contact tracer"), does the causal mechanism still hold?
  **Sufficient Answer:** Yes. The system failed to secure cooperation, regardless of *which* family it was.
  **Fail Condition:** If the story collapses without blaming specific people, the story is likely a narrative fallacy.
  **Hand-off:** Decisions to name specific non-public actors in a public report are legal/ethical, not analytic. Flag for Privacy Officer.

  #### Step 4: The Alternative Story Test (The Historian's Check)
  **Goal:** Disrupt the single-thread narrative.
  **Procedure:** Look at the "hinge moments" you identified in the draft.
  **Question:** Can I construct a plausible narrative using the same archive where a *different* hinge moment leads to the *same* outcome? (e.g., "Even if the order came on Day 3, the two uncooperative families would still have caused >12 cases").
  **Sufficient Answer:** Acknowledgment in the text that multiple pathways existed. (e.g., "While earlier exclusion likely reduced spread, household transmission barriers remained a high-risk factor.")
  **Fail Condition:** Insisting on a single root cause when the archive supports a net.
  **Stop Point:** If you cannot acknowledge at least one alternative pathway, the causal claim is too brittle for policy guidance.

  #### Step 5: The Policy Threshold (Utility Check)
  **Goal:** Match the strength of the evidence to the strength of the recommendation.
  **Procedure:** Review the "Lessons Learned" or "Recommendations" section.
  **Question:** Does the evidence support a *mandate* ("Must do X"), a *guideline* ("Should consider X"), or an *observation* ("X was associated with Y")?
  **Sufficient Answer:** The recommendation level matches the evidence level from Steps 1–4.
  **Fail Condition:** A "Must" recommendation based on "Observational" evidence.
  **Hand-off:** If the Department wishes to issue a "Must" based on weak evidence (precautionary principle), this is a value judgment. Flag for Director sign-off.

  ---

  ### Part 2: Limitations & Costumed Judgments

  You asked to know where this procedure misfires.

  1.  **The "Sufficient Evidence" Trap:** Step 2 asks for a model or literature. Deciding what counts as "close enough" literature is a judgment call wearing the costume of method. You will still have to decide if a flu model applies to measles. The procedure forces you to admit that choice, but it doesn't make it for you.
  2.  **The Utility Gap:** This procedure will often strip a report of its "punch." A report that says "We did our best amidst uncertainty and the outcome was a mix of luck and systemic friction" is honest, but it does not secure budget lines. The procedure cannot solve the political need for a villain or a savior; it can only flag them as political rather than analytic.
  3.  **The "Nothing Useful" Outcome:** There are times when this procedure will tell you **there is no causal finding here.** It cannot generate a lesson where none exists. It cannot turn noise into signal.

  ---

  ### Part 3: Running the Protocol on Your Drafts

  Here is the output of running the Protocol on the three drafts you described.

  #### Draft 1: Measles Outbreak (43 cases, Day 9 Order, Uncooperative Families)

  *   **Step 1 (Information Horizon):** *Fail.* Did the Officer know it was measles on Day 1? Unlikely. Lab confirmation takes time. Calling the Day 9 order "late" implies they knew on Day 1.
      *   *Correction:* Change "order came six days late" to "order was issued six days after lab confirmation."
  *   **Step 2 (Counterfactual Audit):** *Hard Stop.* The "12 cases" number is unreconstructible envelope math.
      *   *Action:* Delete "12 cases." Replace with "Epidemiological modeling suggests that earlier exclusion orders in high-density school settings significantly reduce secondary attack rates."
  *   **Step 3 (Villain Elimination):** *Fail.* Making two families the hinge creates villains.
      *   *Action:* Recode as "Barriers to contact tracing cooperation." Analyze *why* they refused (language, trust, policy?) rather than *that* they refused.
  *   **Step 4 (Alternative Story):** *Pass.* You can likely show that even with a Day 3 order, community spread might have occurred if the index case was highly infectious prior to symptom onset.
  *   **Step 5 (Policy Threshold):** *Hand-off.* If the recommendation is "Mandate earlier exclusion," the evidence is now weak (see Step 2). If the recommendation is "Pre-draft exclusion orders for rapid deployment," that is supported by the process failure, not the case count.
  *   **Verdict:** **Salvageable.** The report shifts from "We failed to act fast enough" to "Our process for rapid order deployment needs streamlining, and we need better tools for tracing resistance." The specific case count claim must die.

  #### Draft 2: Heat Event (6 Deaths, 40k Alerts, Neighbor Comparison)

  *   **Step 1 (Information Horizon):** *Pass.* Alerts were sent.
  *   **Step 2 (Counterfactual Audit):** *Hard Stop.* Comparing to a neighboring metro with different housing, AC penetration, and a hospital labor dispute is scientifically invalid for causal attribution. You cannot isolate the variable "text alerts."
      *   *Action:* The claim "averted 25 to 30 deaths" must be deleted. It is fiction.
  *   **Step 3 (Villain/Hero):** *Fail.* The Alert System is being cast as the Hero.
      *   *Action:* Reframe as a process metric. "40,000 at-risk residents were notified."
  *   **Step 4 (Alternative Story):** *Fail.* The "lives saved" narrative relies entirely on the invalid comparison. There is no other story that supports the number.
  *   **Step 5 (Policy Threshold):** *Hand-off.* The Director wants this finding. This is now **Advocacy**, not Analysis.
      *   *Action:* You must flag this to the Director. "This claim does not meet causal hygiene standards due to confounding variables. Publishing this exposes the department to reputational risk if challenged."
  *   **Verdict:** **No Causal Finding.** The procedure returns *nothing useful* regarding mortality impact. You can report on *output* (alerts sent), not *outcome* (lives saved). If the Director insists on the outcome claim, you need a disclaimer that this is an estimate based on unvalidated comparison, or you need to commission a proper case-control study. Do not put this in the AAR as fact.

  #### Draft 3: Norovirus (LTCF, Short-Staffed)

  *   **Step 1 (Information Horizon):** *Pass.* Staff knew they were short.
  *   **Step 2 (Counterfactual Audit):** *Weak.* If they weren't short, would the outbreak stop? Norovirus is incredibly contagious. Staffing affects *management*, not necessarily *introduction*.
  *   **Step 3 (Villain Elimination):** *Pass.* "Short-staffed" is systemic.
  *   **Step 4 (Alternative Story):** *Pass.* Outbreaks happen in well-staffed facilities too.
  *   **Step 5 (Policy Threshold):** *Fail.* The "lesson" is "staffing matters." This is already known policy.
  *   **Verdict:** **Low Utility.** The procedure suggests this AAR may not be necessary *unless* you can identify a specific *mechanism* by which staffing broke a *specific* protocol (e.g., "Staffing levels prevented cohorting of symptomatic residents within 4 hours"). If you cannot link the staffing shortage to a specific broken protocol step, the report is just "we were understaffed," which is a budget request, not a lessons-learned report.
      *   *Recommendation:* Do not write a causal AAR. Write a "Situational Summary" that documents the strain on the system without claiming it caused the outbreak.

  ### Summary of Findings

  1.  **Measles:** Keep, but downgrade the certainty. Remove the "12 cases" number. Remove the specific families. Focus on the *process* of the exclusion order, not the *timing* relative to the outbreak start.
  2.  **Heat:** **Do not publish the causal claim.** The procedure flags this as scientifically indefensible. It is a value judgment to publish it anyway. If you must, move the claim to a "Director's Commentary" section separate from the "Analysis" section.
  3.  **Norovirus:** **Do not write as a causal AAR.** There is no new lesson. It is a reiteration of a known risk. Use it as data for a broader "LTCF Workforce Stability" report instead of a standalone outbreak review.

  **Final Note:** The procedure tells you that Draft 2 is the most dangerous (false precision) and Draft 3 is the most redundant (known variable). Draft 1 is the only one that yields a valid, actionable process lesson, provided you strip out the narrative flair.
