          *   Include strongest case for GC's position (so they recognize it).
          *   **Constraints:** No citations, no case names, no statutory references, no reading list. No textbook survey of logical omniscience.
          *   **Structure:** One-page rule, Justification, What We Give Up, Requirements before the 14th (with date).
