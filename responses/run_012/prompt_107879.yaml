      *   The "Resource-Bounded" view (Economist/User's view) needs to be operationalized.
      *   *Proposed Rule:* Knowledge attribution requires that the inference be *computationally feasible* and *operationally expected* within the relevant timeframe. It's not about logical possibility, but about compliance engineering standards.
      *   *Threshold:* "Competent Compliance Function" standard (what should have been derived), not "Actual Systems" (what could be derived), but bounded by computational feasibility (no undecidable logic).
      *   *Contradictions:* Inconsistency doesn't imply knowledge of everything; it triggers a duty to resolve, not automatic liability for all consequences.
