prompt: |-
  So I've been lurking on LessWrong and the old OB archives for like a decade now, and there's this one that keeps coming up that I've never fully gotten past: Good's theorem, i.e. the result that info can't hurt you, that free information is always welcome, a Bayesian should never pay to avoid a signal, etc. The proof is clean enough (max of an average is ≤ the average of the maxes, you can always just ignore the extra data), and everyone cites it like it settles the matter.

  But then in real life basically everyone avoids information constantly and it doesn't obviously seem irrational. My roommate refuses to look at his brokerage account when the market tanks. My sister won't get a screening test she's eligible for. I skip plot summaries of movies I'm about to watch. And whenever I bring this up the standard move is "oh thats just because the disutility of knowing is itself part of the payoff," which honestly feels like a dodge rather than an answer.

  So my actual question: given that Good's theorem proves information is never harmful, is all this avoidance just akrasia / a failure of instrumental rationality that I should be trying to train out of myself? Or is there some assumption in the theorem I'm not seeing that makes these cases actually not counterexamples?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is a long-time lurker on LessWrong (LW) and Overcoming Bias (OB). They are familiar with the rationalist community's jargon and norms.
      *   **Core Question:** Good's Theorem states that free information is always valuable (expected utility of acting on information $\ge$ expected utility of acting without it). Yet, people avoid information constantly (financial, medical, entertainment). Is this irrationality (akrasia) or is there a flaw/assumption in the theorem application?
      *   **Frustration Point:** The standard LW answer ("disutility of knowing is part of the payoff") feels like a dodge to the user. They want a deeper structural explanation.
      *   **Goal:** Provide a nuanced answer that respects the mathematical validity of Good's Theorem while explaining why information avoidance is often rational in practice, without just waving hands at "utility functions."

  2.  **Deconstruct Good's Theorem:**
      *   *What does it actually say?* In a decision-theoretic framework, if you have a set of actions $A$, states of the world $S$, and a signal $E$, the expected utility of choosing $A$ *after* seeing $E$ is at least as high as choosing $A$ *before* seeing $E$.
      *   *Key Assumptions:*
          1.  **Bayesian Updating:** The agent updates beliefs correctly.
          2.  **Utility Maximization:** The agent chooses the action that maximizes expected utility given beliefs.
          3.  **Costless Information:** The information itself has no direct cost (time, money, cognitive load).
          4.  **Optionality:** The agent *can* ignore the information. (This is the "max of average $\le$ average of maxes" argument).
          5.  **Stable Preferences/Utility:** The utility function doesn't change *because* of the information in a way that violates the model.
          6.  **One-shot/Static Decision:** Usually framed as a single decision point.

  3.  **Address the "Dodge" (Utility of Knowing):**
      *   The user hates the answer "knowing hurts." Why? Because it feels like defining away the problem. If $U(\text{state}, \text{action}, \text{knowledge})$ includes knowledge, then obviously info can hurt.
      *   *Better framing:* Distinguish between *instrumental* value (helps you act) and *intrinsic* value (feels good/bad to know). Good's theorem applies to instrumental value. If knowledge has intrinsic disutility (e.g., anxiety), that's a direct cost, not a violation of the theorem.
      *   *But wait,* the user wants to know if it's *irrational*. If the utility function includes "peace of mind," avoiding info is rational. If the utility function is *only* about external outcomes (money, health), avoiding info is irrational.
      *   *Crucial Insight:* Most real-world utility functions *do* care about mental state. So, strictly speaking, it's not irrational *if* you value peace of mind. But the user is asking if they should *train it out*. This implies they suspect their utility function *should* be more objective.

  4.  **Identify Real Violations/Extensions of Good's Theorem:**
      *   **Bounded Rationality:** Processing info costs compute. If the cost of updating > benefit of better decision, don't look. (The user mentioned "free information," but cognitive load isn't free).
      *   **Precommitment/Time Inconsistency:** Hyperbolic discounting. I want to save, but seeing the balance makes me anxious now, so I spend. This *is* irrational by standard rationalist standards (akrasia).
      *   **Logic/Omega Problems:** Newcomb's problem, Parfit's Hitchhiker. Sometimes knowing less makes you a better type of agent for other predictors to cooperate with. (Probably too niche for this specific question, but worth a mental note).
      *   **Control/Agency:** Sometimes knowing reduces your ability to act optimally due to emotional interference (not just utility, but capability).
      *   **Strategic Ignorance:** In multi-agent settings, not knowing can be a credible signal or shield. (e.g., Plausible deniability).

  5.  **Synthesize the Arguments for the Response:**

      *   **Acknowledge the validity:** Good's Theorem is mathematically sound *within its assumptions*.
      *   **Validate the intuition:** The "utility of knowing" answer isn't a dodge, but it needs unpacking. It shifts the debate from "is info valuable?" to "what is your utility function?"
      *   **Categorize the Avoidance:**
          1.  **Rational (Intrinsic Disutility):** You genuinely suffer from knowing. (Medical anxiety, spoiler aversion). This is consistent with EU maximization.
          2.  **Rational (Processing Costs):** Cognitive load, time, attention. Good's theorem assumes costless info.
          3.  **Rational (Strategic/Multi-agent):** Plausible deniability, bargaining positions.
          4.  **Irrational (Akrasia/Bias):** Fear of bad news preventing action that would help. (The roommate example). This is the "train it out" category.
      *   **Address the "Train it out" question:** This is the core. Should they become a cold Bayesian machine?
          *   *Argument for Yes:* If the anxiety is disproportionate to the actual outcome, it's a bug.
          *   *Argument for No:* Mental health is part of the outcome. Chronic stress kills.
          *   *Middle Ground:* Distinguish between *anticipatory anxiety* (can be trained) and *intrinsic preference* (harder to change).
      *   **Specific LW/OB Context:** Mention "Shut Up and Multiply" vs. "Humanism." Mention UDT (Updateless Decision Theory) as a more advanced framework where info *can* be harmful (because it restricts your policy space).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Intro:* Validate the frustration. The "utility of knowing" answer is technically correct but unsatisfying.
      *   *Section 1: The Math vs. The Map.* Good's theorem assumes the agent *can* ignore the info. If you *can't* ignore the emotional impact, the theorem's condition "you can always just ignore" fails.
      *   *Section 2: The Three Buckets.*
          *   Bucket A: Rational Ignorance (Costs > Benefits). Cognitive load.
          *   Bucket B: Rational Ignorance (Intrinsic Utility). Spoilers, Anxiety. This isn't irrational, just different preferences.
          *   Bucket C: Irrational Avoidance (Akrasia). The roommate. This is a failure of execution.
      *   *Section 3: Updateless Decision Theory (UDT).* This is the "hardcore LW" answer. In UDT, you choose a policy *before* seeing info. Sometimes the optimal policy involves not looking. This formalizes "strategic ignorance."
      *   *Section 4: Should you train it out?* Nuanced advice. Don't pathologize normal emotional regulation. Do pathologize avoidance that prevents necessary action.
      *   *Conclusion:* It's not a binary. It's about calibrating when avoidance is a tool vs. a shield.

  7.  **Refining the "Dodge" point:**
      *   I need to explain *why* it feels like a dodge. It feels like moving the goalposts.
      *   Explanation: Good's theorem separates *instrumental* value from *terminal* value. If you treat "peace of mind" as terminal, the theorem holds. If you treat it as a bias interfering with terminal values (health/wealth), the theorem highlights the error.
      *   The key is distinguishing between *caring about your state of mind* vs. *being incapacitated by your state of mind*.

  8.  **Final Polish:** Ensure tone is respectful, intellectually rigorous (matching LW standards), and practical. Use terms like "Expected Utility," "Bounded Rationality," "Updateless," "Akrasia."

      *(Self-Correction during drafting)*: I should be careful not to say Good's Theorem is *wrong*. It's a theorem. It's true. The issue is *applicability*. The assumptions don't hold in the real world cases cited.
      *   Assumption: Agent maximizes EU. (Real humans maximize something messier).
      *   Assumption: Info is costless. (Attention is scarce).
      *   Assumption: Info doesn't change utility function. (Knowing you have a disease might change what you value).

      *Wait, one more strong point:* **Control.** Good's theorem assumes you act on the info. If the info makes you *less* able to act (panic), then the assumption that $EU(Action|Info) \ge EU(Action)$ fails because the action set or the probability of executing the optimal action changes.

      *Let's structure the answer around: 1. The Theorem's Assumptions, 2. The "Utility of Knowing" isn't a dodge but a classification tool, 3. Updateless Decision Theory (the real LW answer), 4. Practical advice on training.*

  9.  **Final Review against User Prompt:**
      *   Did I answer "Is it akrasia?" -> Yes, sometimes.
      *   Did I address the "dodge"? -> Yes, by reframing it.
      *   Did I use LW context? -> Yes (UDT, EU, priors).

      *(Final thought)*: Make sure to mention that in UDT, information *can* have negative value. That's the technical counterpoint to Good's Theorem that advanced rationalists use. Good's theorem applies to CDT/EDT agents who update. UDT agents select policies. If looking at info restricts your policy space to a suboptimal one, don't look.

      *Okay, ready to write.*
answer: |-
  This is a classic tension in the rationalist community, and your frustration with the standard "utility of knowing" answer is well-founded. It often feels like a semantic shield rather than a substantive explanation.

  You are asking two distinct questions:
  1.  **Theoretical:** Does Good's Theorem actually apply to these real-world cases, or are there hidden assumptions?
  2.  **Practical:** Is information avoidance a bug (akrasia) I should fix, or a feature (rational preference) I should keep?

  Here is the breakdown of why Good's Theorem doesn't settle the matter in practice, and how to distinguish between rational ignorance and irrational avoidance.

  ### 1. The Hidden Assumptions of Good's Theorem

  Good's Theorem (1967) is mathematically sound, but it relies on specific assumptions that frequently fail in human contexts. The theorem states that the expected utility of making a decision *after* observing a free signal is at least as high as making it *before*.

  The proof relies on the inequality: $E[\max_a E[U|a, e]] \ge \max_a E[U|a]$.
  (The expected value of the best action given evidence is greater than the best action without evidence.)

  For this to hold, three critical assumptions must be met:

  **A. Costless Processing (Bounded Rationality)**
  Good's theorem assumes information is "free." In the real world, attention and cognitive load are scarce resources. If processing the signal consumes cognitive bandwidth that prevents you from executing the optimal action, the net utility can be negative.
  *   *Example:* If checking your brokerage account triggers a stress response that ruins your focus at work for the rest of the day, the information had a *cost*. This isn't a violation of the theorem; it's a violation of the "free information" premise.

  **B. Stable Utility Functions**
  The theorem assumes your utility function $U$ is fixed. It assumes you value the *outcome* (health, wealth), not the *state of belief*.
  *   If your utility function includes "peace of mind" as a terminal value, then avoiding the medical test is rational. You are trading a probability of better health outcomes for a certainty of lower anxiety.
  *   However, if your utility function is strictly "maximize health span," and anxiety is merely an instrumental impediment, then avoidance is irrational.
  *   *Why the standard answer feels like a dodge:* People often conflate these. When a rationalist says "you value peace of mind," they often mean "your utility function is weird." But often, the agent *wants* to change their utility function (they wish they didn't care about the anxiety) but can't. Good's theorem doesn't help you change your preferences; it only helps you maximize them.

  **C. Updateful vs. Updateless Agency**
  This is the most technical but important point for a LessWrong reader. Good's Theorem applies to **Updateful** agents (CDT/EDT). It assumes you will update on the evidence and then choose the best action.
  However, in **Updateless Decision Theory (UDT)**, you choose a *policy* (a mapping from all possible observations to actions) before you see the evidence.
  *   In UDT, information *can* have negative value. If receiving a signal forces you to update to a policy that is exploitable or suboptimal compared to your pre-commitment, you should refuse the signal.
  *   *Example:* In Parfit's Hitchhiker or Newcomb-like problems, knowing too much can restrict your ability to credibly precommit. In real life, if knowing the market tanked makes you panic-sell (a predictable policy failure), the *optimal policy* might be "do not look at the account." You are preserving your ability to stick to a long-term strategy by removing the trigger for a known failure mode.

  ### 2. Classifying the Avoidance

  To answer your practical question ("Should I train this out?"), you need to categorize the specific instance of avoidance.

  **Type 1: Strategic Ignorance (Rational)**
  *   **Mechanism:** You know that you have a known bias or weakness (e.g., loss aversion, panic selling) that will be triggered by the information.
  *   **Verdict:** This is rational risk management. You are treating your own psychology as a black box with known failure modes.
  *   **Action:** Do not train this out. Instead, build systems that enforce the optimal policy without requiring willpower (e.g., automatic investing, having a doctor order tests without telling you until necessary).

  **Type 2: Intrinsic Disutility (Rational Preference)**
  *   **Mechanism:** The state of knowing causes genuine suffering (e.g., spoilers ruin the movie experience; waiting for results causes insomnia).
  *   **Verdict:** This is not irrational. If you value the experience of surprise or mental calm, you are paying an "information cost" in utility units.
  *   **Action:** Accept this as a preference. However, audit it. Is the anxiety proportional to the risk?

  **Type 3: Akrasia / Fear (Irrational)**
  *   **Mechanism:** You avoid the information because you fear it will force you to take an action you don't want to take (e.g., not getting screened because you fear treatment; not checking finances because you fear budgeting).
  *   **Verdict:** This is a failure of instrumental rationality. You are prioritizing short-term emotional comfort over long-term terminal values (health/wealth). This is the "ostrich effect."
  *   **Action:** **Train this out.** This is the core of the rationalist project. This is where CFAR-style techniques (TAPs, murphyjitsu, exposure therapy) apply.

  ### 3. How to distinguish Type 1 from Type 3

  This is the hard part. How do you know if you are strategically ignoring info to protect your policy (Type 1) or avoiding info to avoid action (Type 3)?

  **The Counterfactual Test:**
  Ask yourself: *"If I could press a button that would magically fix the problem without me having to do anything, would I want to know the status?"*

  *   **Roommate Example:** If a button existed that would restore his portfolio value instantly without him trading, would he look?
      *   If **Yes**: He actually cares about the money, but is afraid of the *action* required (selling, rebalancing, facing the loss). This is **Akrasia**. He should train himself to look.
      *   If **No**: He genuinely prefers not to know the number, regardless of consequences. This is **Intrinsic Disutility**. He is prioritizing mental peace over wealth. (Still arguably irrational if he claims to want to be rich, but consistent).

  *   **Sister Example:** If a pill existed that cured the potential disease without diagnosis, would she take it?
      *   If **Yes**: She wants health, but fears the diagnostic process/treatment. Avoidance is **Akrasia**.
      *   If **No**: She prefers the uncertainty to the stress of the medical industrial complex. This is a **Preference**.

  ### 4. Conclusion: Should you train it out?

  Good's Theorem is a bound on *ideal* Bayesian agents with stable utility functions and costless compute. It is not a prescription for human mental health.

  However, the rationalist imperative is to align your actions with your *reflective* preferences.

  1.  **Don't pathologize "Peace of Mind":** If you genuinely value not knowing (spoilers, minor health stats), that is a valid terminal value. Good's theorem accounts for this if you include "knowledge state" in the utility function.
  2.  **Do pathologize "Action Avoidance":** If you are avoiding information because it compels an action you know you *should* take (budgeting, medical screening), that is a failure of instrumental rationality. In this case, the information *would* help you (per Good), but your emotional regulation prevents you from capitalizing on it.
  3.  **Use Updateless Thinking:** If you know you are prone to panic, the rational move isn't necessarily "toughen up" (which might fail); it might be "precommit to not looking." That is a rational policy choice, not a bias.

  **Summary:** The theorem isn't wrong, but its application requires knowing your utility function. If your avoidance prevents you from achieving your *stated* goals (wealth, health), it is irrational. If your avoidance *is* the goal (preserving mental state), it is rational. The work is in discerning which is which.

  If you want to dive deeper into the "information can hurt" angle from a decision theory perspective, look into **Updateless Decision Theory (UDT)** and the concept of **Value of Information (VoI)** in contexts with precommitment. That is where the math finally agrees with your intuition that sometimes, ignorance is bliss.
