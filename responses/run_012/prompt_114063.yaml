answer: |-
  The *Remembrance of Earth's Past* trilogy is frequently cited in rationalist circles as a narrative proof of the Dark Forest theory, a game-theoretic grimness that stands in stark opposition to the optimism of evidential cooperation in large worlds (ECLW). Where ECLW suggests that logically similar agents can secure acausal trade across the cosmos simply by recognizing their shared decision procedures, Liu Cixin's universe posits that such recognition is impossible, and that even if it were, the zero-sum nature of physical resources mandates preemption. To treat the trilogy merely as a foil to ECLW, however, is to miss the specific structural pressures Liu places on rationality itself. The novels do not simply assert that causal decision theory (CDT) is correct and evidential reasoning is wrong; rather, they dramatize the epistemic conditions under which evidential cooperation collapses into causal violence.

  The central tension lies in the axioms. ECLW relies on two premises: that agents can identify logical similarity in others, and that there exist gains from trade between agents with differing values. Liu's Dark Forest theory accepts the first premise only partially—civilizations are similar in their drive for survival—but violently rejects the second. The trilogy's first axiom, "Survival is the primary need of civilization," functions not merely as a preference but as a lexical priority that flattens value space. If every civilization values its own continued existence above all else, and if matter is constant, then the universe is strictly zero-sum. In this environment, evidential cooperation fails not because the logic of correlation is unsound, but because the payoff matrix offers no cooperative equilibrium. If I cooperate, and you are logically like me, you cooperate—but if our cooperation merely means we both refrain from shooting while competing for the same finite star, we have not gained utility; we have only delayed the conflict. The trilogy suggests that ECLW requires value orthogonality (you want paperclips, I want staples) to generate trade surplus. Liu posits a universe where everyone wants the same thing: the fuel of survival.

  However, the more profound critique the trilogy offers concerns the stability of the correlation itself. ECLW requires that agents know, with high confidence, that the other party is running a compatible decision procedure. The *Dark Forest* novel's central device, the Wallfacer project, is a narrative exploration of the fragility of this knowledge. A Wallfacer's power derives entirely from the ability to hide their true decision procedure from the enemy while maintaining the appearance of a different one. This is the inverse of the transparency required for acausal trade. In the ECLW framework, you want to signal your source code to establish correlation. In Liu's cosmos, signaling your source code is suicide. If Trisolaris knows Earth's decision procedure is "negotiate if safe, fight if threatened," they can exploit the condition. If they know it is "strike first," they strike pre-emptively.

  This introduces a critical vulnerability in evidential cooperation that formal models often underplay: the incentive to masquerade. In a large world, an agent might gain a causal advantage by appearing to be an evidential cooperator while actually running a causal defection algorithm. They reap the benefits of your cooperation (you don't shoot because you think they won't) while defecting (they shoot because they know your cooperation is evidence-based, not causal). The Sophons, which allow Trisolaris to monitor Earth's physical reality but not its thoughts, enforce a one-way transparency that breaks the symmetry required for acausal bargaining. The trilogy argues that in an environment where monitoring is asymmetric, the "logical similarity" required for ECLW cannot be verified. Without verification, the rational prior is to assume the other is a causal defector.

  Furthermore, the "Chain of Suspicion" described by Luo Ji is essentially a breakdown of common knowledge. For evidential cooperation to hold, it is not enough for me to be like you; I must know that you are like me, and you must know that I know that you are like me. Liu's universe is defined by the speed of light limit and the vastness of distance, which makes the establishment of common knowledge impossible. Without communication, I cannot know if you are a cooperator. But more importantly, I cannot know if *you know* that I am a cooperator. If I suspect that you suspect me of being a defector, you will strike preemptively. Since I know you are rational, I know you will strike. Therefore, I must strike. This recursive uncertainty destroys the correlation. The decision procedures are not isolated; they are coupled through a chain of probabilistic inferences about the other's epistemic state. In this light, the Dark Forest strike is not a failure of logic, but a rational response to the impossibility of establishing the common knowledge requisite for acausal trade.

  Yet, there are moments where the trilogy resists the ECLW reading, and we must concede them. The deterrence standoff between Earth and Trisolaris, maintained by the gravitational broadcast system, is a purely causal mechanism. It works not because Earth and Trisolaris have recognized a shared logical fate, but because Earth has successfully threatened a causal cost (mutual destruction) that outweighs Trisolaris's gain. This is not trade; it is hostage-taking. When Cheng Xin takes over as Swordholder, the system fails not because the logic of deterrence changed, but because her psychological profile signaled a lower probability of executing the threat. Here, Liu makes an empirical claim about rationality: that decision procedures are not abstract algorithms but are embodied in biological or cultural psychologies that are subject to weakness. ECLW models often treat agents as immutable functions. The trilogy insists that agents are mutable, emotional, and culturally contingent. A "cooperator" today may be a "defector" tomorrow if their leadership changes. This temporal instability makes long-term acausal contracts impossible. If I cannot trust that your future self will run the same code as your present self, I cannot condition my choice on yours.

  The trilogy also dramatizes a failure mode of ECLW regarding the "single defector" problem. In a bargaining model of a large world, we assume a population of agents. If most are cooperators, the equilibrium holds. But Liu's universe is populated by civilizations that have survived a Darwinian filter. The only civilizations that reach the stars are those that have successfully defected against their competitors. Thus, the sample bias of the "large world" is skewed. Any civilization you encounter has, by definition, won a series of zero-sum games to get there. They are selected for causal defection. To apply ECLW in this context is to ignore the selection effect. The "logical similarity" you detect might be a similarity in ruthlessness, not in cooperativeness. If we both reason that "survival justifies any action," then our logical similarity leads us to both fire, not both lower our weapons.

  However, to stop there is to reduce the novels to a treatise on game theory. The trilogy's greatest contribution to the debate is not its game-theoretic mechanics, but its phenomenology of the decision. Formal models of evidential cooperation treat the agent as a view from nowhere, calculating probabilities in a vacuum. Liu forces the reader into the position of the agent who must decide *before* contact, in the dark.

  What the trilogy adds to the debate is the texture of epistemic loneliness. In the bargaining models, the uncertainty is a variable in an equation. In *The Dark Forest*, the uncertainty is a suffocating atmosphere. When Luo Ji meditates at his wife's grave, or when Cheng Xin holds the switch that could destroy two worlds, the decision is not merely about maximizing expected utility. It is about the burden of being the only entity capable of making the choice in a universe that offers no feedback. ECLW offers comfort: "You are not alone; there is someone like you." The trilogy counters with the visceral reality that "someone like you" might be the thing that kills you.

  The novels capture the specific horror of realizing that your own rationality is the weapon used against you. If you are rational, you know you should strike. If they are rational, they know they should strike. The correlation of rationality becomes the correlation of doom. This is the inverse of the ECLW hope. Liu suggests that in the absence of shared values or enforced communication, logical similarity does not bridge the gap between selves; it widens it. It creates a mirror where each side sees their own survival instinct reflected back as an existential threat.

  Ultimately, the trilogy concedes that evidential cooperation is possible only if the agents value something more than their own survival, or if the universe offers more than zero-sum resources. *Death's End* hints at this with the return of Guan Yifan and the discussion of higher-dimensional realms, where civilizations might transcend the need for matter. But until that transcendence, the Dark Forest holds. The trilogy argues that ECLW is a luxury of secure environments. It is a theory for agents who have already solved the problem of existential risk. For the agent in the dark, hearing a twig snap in the forest, the question is not "Can we trade?" but "Can I afford to believe we can trade?"

  In the end, *Remembrance of Earth's Past* adds a necessary phenomenological constraint to the bargaining models. It reminds us that the decision to cooperate acausally is not just a calculation of correlation, but an act of faith in a universe that has given you no reason to have faith. The models assume the agent can step outside the system to view the correlation. The novel insists the agent is inside the system, terrified, and aware that if their calculation of the other's similarity is wrong by even a fraction, the cost is not a loss of points, but the erasure of the calculator. The trilogy does not disprove evidential cooperation; it simply reveals the price of entry. To cooperate in the dark, you must be willing to risk the dark taking you. Liu's civilizations are unwilling to pay that price, and in their refusal, they illuminate the terrifying solitude that the optimistic models often gloss over.
