  ### Design Note on the Setup
  Your original setup was mathematically underspecified. "Positively correlated errors" does not define a joint probability distribution; without a specific correlation model (e.g., a latent variable or mixture model), students cannot calculate *when* the junior helps or hurts. I have repaired this in the question below by defining a specific "Mixture Model" of correlation (parameter $\lambda$). This makes the problem solvable within 90 minutes while preserving your core pedagogical goal: forcing students to confront how correlation negates the Condorcet Jury Theorem's benefits.

  ***

  ### Exam Question: The Correlated Committee

  **Question 4 (20 Marks)**

  A hospital ethics committee consists of 9 Senior Clinicians. On a binary life-or-death decision, each Senior is individually correct with probability $p_S = 0.6$. However, due to shared training, their votes are correlated. We model this correlation using a parameter $\lambda \in [0, 1]$:
  *   With probability $\lambda$, a "Common Shock" occurs: All 9 Seniors vote identically (all Correct or all Incorrect, preserving their marginal $p_S = 0.6$).
  *   With probability $1 - \lambda$, the Seniors vote independently (standard Condorcet assumptions).

  A single Junior Clinician is proposed for addition to the committee. The Junior is correct with probability $p_J = 0.55$ and is independent of the Seniors. The committee decides by simple majority vote (ties are broken by a fair coin flip).

  1.  Calculate the probability of a Correct Group Decision for the **9-person Senior Committee** in the limit case where $\lambda = 1$ (Perfect Correlation).
  2.  Calculate the probability of a Correct Group Decision for the **10-person Committee** (9 Seniors + 1 Junior) in the limit case where $\lambda = 1$.
  3.  Based on your calculations and the standard Condorcet Jury Theorem (CJT) for the case where $\lambda = 0$ (Independence), determine whether adding the Junior improves group reliability in both limit cases.
  4.  Explain the epistemological significance of this result. Specifically, why does the Junior's independence fail to rescue the group in the high-correlation case, and what does this imply about the "Independence Assumption" in formal social epistemology?

  ***

  ### Model Answer

  **1. & 2. Group Accuracy under Perfect Correlation ($\lambda = 1$)**
  When $\lambda = 1$, the "Common Shock" always occurs. The 9 Seniors do not act as 9 independent voters; they act as a single block. Because their marginal accuracy is preserved at $p_S = 0.6$, the block votes "Correct" with probability 0.6 and "Incorrect" with probability 0.4.

  *   **9-Person Committee:** Since all 9 Seniors vote identically, the vote is either 9-0 Correct or 9-0 Incorrect. The majority follows the block.
      $$P(\text{Group}_9 \text{ Correct}) = P(\text{Seniors Correct}) = 0.6$$

  *   **10-Person Committee:** We add the Junior ($p_J = 0.55$).
      *   *Case A (Seniors Correct, prob 0.6):* The 9 Seniors vote Correct. Even if the Junior votes Incorrect, the tally is 9-1. The Majority is Correct.
      *   *Case B (Seniors Incorrect, prob 0.4):* The 9 Seniors vote Incorrect. Even if the Junior votes Correct, the tally is 9-1 Incorrect. The Majority is Incorrect.
      *   In this block-voting scenario, the Junior is never pivotal. The 9 Senior votes always drown out the 1 Junior vote.
      $$P(\text{Group}_{10} \text{ Correct}) = 0.6$$

  **3. Comparison with Independence ($\lambda = 0$)**
  *   **High Correlation ($\lambda = 1$):** As calculated above, adding the Junior yields no change in accuracy ($0.6 \rightarrow 0.6$). The Junior adds no value.
  *   **Independence ($\lambda = 0$):** According to the standard Condorcet Jury Theorem, if voters are independent and competent ($p > 0.5$), adding a voter generally increases the probability of a correct majority (ignoring minor parity fluctuations between odd/even $N$). Since $p_J = 0.55 > 0.5$, the Junior *would* contribute positive epistemic weight in this scenario, raising the group accuracy above the 9-person baseline (which would be $\approx 0.73$ for independent seniors).

  **4. Epistemological Significance**
  This result demonstrates that **competence is necessary but not sufficient** for collective wisdom; **independence** is the multiplier that allows competence to aggregate.

  In the $\lambda = 1$ case, the "Effective Sample Size" of the Seniors is not 9, but 1. The Condorcet Jury Theorem relies on the Law of Large Numbers, which requires independent trials to cancel out random errors. Positive correlation prevents error cancellation. When errors are shared (systemic bias), the group does not become more reliable as it grows; it merely amplifies the bias of the common source.

  The Junior's independence fails to rescue the group in the high-correlation case because the Senior block's voting weight (9 votes) mathematically overwhelms the Junior's single independent vote. This implies that in formal epistemology, diversity of input (independence) is often more valuable than raw individual competence. A smaller, independent group can outperform a larger, correlated one. The Independence Assumption is not a technical footnote; it is the structural prerequisite for the "wisdom of crowds." Without it, a committee is merely a single agent in disguise.

  ***

  ### Marking Scheme (20 Marks)

  | Point | Criteria | Marks | Common Mistake |
  | :--- | :--- | :--- | :--- |
  | **1** | **Correctly models the $\lambda=1$ Senior Block:** Identifies that 9 Seniors act as 1 voter with $p=0.6$, yielding 0.6 accuracy for the 9-person group. | 4 | Treating correlated seniors as independent voters ($P \approx 0.73$) despite the $\lambda=1$ instruction. |
  | **2** | **Correctly analyzes the 10-person $\lambda=1$ case:** Recognizes the Junior is never pivotal (9-1 vote) and group accuracy remains 0.6. | 4 | Calculating a weighted average of competencies ($0.6$ and $0.55$) rather than analyzing majority voting power. |
  | **3** | **Contrasts with CJT ($\lambda=0$):** Correctly states that under independence, adding a $p>0.5$ voter increases reliability (unlike the $\lambda=1$ case). | 4 | Claiming CJT guarantees improvement even under perfect correlation or ignoring the $\lambda=0$ comparison. |
  | **4** | **Explains Error Cancellation:** Articulates that independence allows errors to cancel (LLN), while correlation locks errors in, preventing the benefit of aggregation. | 4 | Vaguely stating "correlation is bad" without explaining the mechanism of error cancellation vs. amplification. |
  | **5** | **Epistemological Moral:** Concludes that independence/diversity is a structural prerequisite for collective intelligence, distinct from individual competence. | 4 | Reducing the conclusion to "hire better people" rather than addressing the structural/assumption issue. |
