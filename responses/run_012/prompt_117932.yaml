      *   *The Solution:* Intensional/Metaphysical Realism. Gongsun Long is a "Realist" about universals (Names). "Horse" refers to the Form of Horse. "White" refers to the Form of White. "White Horse" refers to a compound Form. The Form of White Horse is not identical to the Form of Horse.
      *   *Why it matters:* It's about the *identity of concepts*, not the classification of animals. It challenges the assumption that adding a modifier preserves the identity of the base noun.
      *   *Analogy:* "A triangle" vs. "A right triangle." In geometry, the definitions are distinct. You can't substitute the definition of one for the other in a proof about properties specific to the definition.

  5.  **Identify What They Are Both Missing:**
