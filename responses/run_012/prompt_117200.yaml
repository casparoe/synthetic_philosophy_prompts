      *   **The Conflict:**
          *   Colleague 1 (Retired Professor): Knowing-how vs. Knowing-that. Exam tests facts (knowing-that), job tests doing (knowing-how). Failing exam is weak evidence of incompetence.
          *   Colleague 2 (Opponent): Medicine is reasoning. A doctor who can't explain is a technician, not a physician. Knowing-how depends on knowing-that.
          *   Hallway Talk: Philosophical distinction is contested (intellectualism vs. anti-intellectualism).
      *   **Requirements:**
          *   Recommend a concrete disposition with a time frame.
