      *(Refining the Philosophy)*: The prompt asks me to take a position on whether the distinction should change the outcome. I should argue that the distinction *informs* the remedy but does not *dictate* acquittal. The exam tests the foundational knowledge required for safe reasoning in novel cases. Her failure suggests a risk in novel cases. Her clinical pass suggests safety in routine cases. The restricted license bridges this.

