      *   **Tone:** Professional, reasoned, decisive, suitable for a medical board (mixed audience of physicians and public members).

  2.  **Determine the Stance:**
      *   *Safety First:* The board's primary mandate is public safety.
      *   *The Exam:* Failing 4 times is significant, even if by few points. It suggests a gap in foundational knowledge.
