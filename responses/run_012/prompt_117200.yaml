answer: |-
  **TO:** State Medical Board
  **FROM:** [My Name], Public Member
  **RE:** Appeal of Dr. R — Recommendation and Precedent

  **Recommendation**
  I recommend the Board grant Dr. R a **Restricted License for a period of two years**, contingent on the supervision plan she has submitted. We should deny independent licensure at this time. This disposition balances our statutory mandate to ensure public safety with the statutory allowance to define competence flexibly. It addresses the immediate healthcare access crisis in the rural district without waiving the standards required for independent practice.

  **The Epistemological Question: Knowing-How vs. Knowing-That**
  Our debate has centered on whether the written examination (testing factual knowledge, or "knowing-that") is a valid proxy for clinical practice (testing practical skill, or "knowing-how"). Colleague A argues these are distinct; Colleague B argues that medicine is fundamentally reasoning, requiring the former to sustain the latter.

  We should adopt a pragmatic synthesis. While Dr. R's clinical assessment confirms she possesses the *knowing-how* to manage routine cases, Colleague B's concern is correct: medicine frequently presents novel complications where rote procedure fails. In those moments, a physician must reason from first principles—requiring robust *knowing-that*. Dr. R's repeated failures in fact-recall sections suggest her foundational scaffold is fragile. If "knowing-how" merely reduces to "knowing-that" (as the hallway intellectualists argue), her failure is dispositive. However, her eight years of practice and clinical skills pass demonstrate functional competence that cannot be ignored.

  Therefore, the distinction should not grant her independent licensure, but it does justify a remedial pathway. We cannot certify her as independently competent (which requires both robust fact and skill), but we can certify her as *supervised* competent. The restriction acknowledges that her *knowing-how* is currently safe only when backed by a supervisor's *knowing-that*.

  **Disposition and Conditions**
  The license granted shall explicitly certify **competence to practice only under direct supervision**, not independent competence. It is a probationary status, not a waiver.

  **Conditions:**
  1.  **Supervision:** Practice is limited to the named supervising physician at the rural hospital. Any change requires Board approval.
  2.  **Audit:** Quarterly chart audits focused on cases involving complex pharmacology or rare diagnoses (areas correlated with fact-recall deficits).
  3.  **Remediation:** Dr. R must complete a structured continuing medical education (CME) program targeting her weak examination domains within 12 months.
  4.  **Examination:** She must re-sit the written examination annually. Failure to pass within the two-year window results in license expiration.

  **Generalizable Criteria for Future Appeals**
  Three similar appeals are pending. To ensure consistency, the Board should adopt the following criteria for "Restricted Licensure via Alternative Pathway":

  1.  **Eligibility:** Available only to applicants who have passed the clinical skills assessment but failed the written examination no more than four times.
  2.  **Deficit Analysis:** Examination misses must be concentrated in fact-recall rather than clinical reasoning sections.
  3.  **Practice History:** Applicant must demonstrate prior unsupervised practice (domestic or foreign) without adverse outcomes.
  4.  **Supervision Viability:** A concrete supervision and audit plan must be verified by Board staff before voting.

  **Conclusion**
  Opponents argue that licensing Dr. R undermines the examination's purpose. They are right that the exam exists to catch reasoning risks. However, our statute permits us to define competence by means other than a single test. By restricting the license, we acknowledge the risk Colleague B identifies while utilizing the competence Colleague A validates. We protect the public by ensuring her *knowing-how* is constantly checked against a supervisor's *knowing-that*, while we protect the public interest by staffing a critical rural need.

  I move we vote on this restricted framework.
