answer: |-
  # STANDARD OPERATING PROCEDURE: DETERMINATION OF DEATH AND ORGAN RECOVERY
  **Effective Date:** Immediate  
  **Authority:** Hospital Death-Determination Committee  
  **Applicability:** All ICU Staff, Transplant Recovery Teams, Organ Procurement Organization (OPO)

  ## PURPOSE
  To operationalize the hospital's definition of death (Permanent Cessation of Circulatory/Respiratory Function OR Irreversible Cessation of All Brain Function) while adhering to the Dead-Donor Rule (DDR). This procedure distinguishes between **biological facts** (physiology) and **treatment decisions** (values) to ensure the night-shift intensivist can act without philosophical ambiguity.

  ---

  ## PHASE 1: PATHWAY SELECTION
  **Q1.1:** Is the patient currently maintained on mechanical ventilation with a pulse?
  *   **YES:** Proceed to **Phase 2 (Neurological Determination)**.
  *   **NO:** Proceed to **Phase 3 (Circulatory Determination)**.
  *   **STOP:** If the patient is not on ventilation and has no pulse, death is already evident; proceed to standard post-mortem care.

  ---

  ## PHASE 2: NEUROLOGICAL DETERMINATION OF DEATH (NDD)
  *Standard: Irreversible cessation of all functions of the entire brain, including the brainstem.*

  **Q2.1 (Fact):** Is there a known proximate cause of coma sufficient to explain the loss of brain function (e.g., massive stroke, anoxia)?
  *   **Sufficient Answer:** Yes, documented in chart.
  *   **Insufficient Answer:** No, or cause is metabolic/toxic and not yet cleared. -> **STOP.** Correct reversible causes first.

  **Q2.2 (Fact):** Are all brainstem reflexes absent (pupils, corneal, oculocephalic, gag, cough) and is the apnea test positive?
  *   **Sufficient Answer:** Yes, documented by two qualified physicians.
  *   **Insufficient Answer:** No, or exam incomplete. -> **STOP.** Complete exam or order ancillary test.

  **Q2.3 (Value/Authority):** If the clinical exam is inconclusive or hospital policy requires ancillary testing (e.g., cerebral blood flow study), does the Legal Surrogate consent to the test?
  *   **Sufficient Answer:** Yes, consent documented. -> Proceed to test.
  *   **Insufficient Answer:** No, family refuses test. -> **STOP.**
      *   **Action:** Death cannot be declared by neurological criteria.
      *   **Reasoning:** "Irreversible" is a biological fact, but the *verification* of that fact requires invasive or transport procedures that require surrogate authorization. Without verification, the fact remains unproven.
      *   **Handoff:** Transfer care to Palliative Team. Organ recovery via NDD pathway is **CANCELED**.

  **Q2.4 (Sign-off):** Have two physicians independent of the transplant team signed the Death Certificate?
  *   **Sufficient Answer:** Yes.
  *   **Action:** Time of Death = Time of completion of the second exam/test. Proceed to **Phase 4**.

  ---

  ## PHASE 3: CIRCULATORY DETERMINATION OF DEATH (DCD)
  *Standard: Permanent cessation of circulatory and respiratory function.*
  *Note: "Permanent" means the heart will not restart spontaneously AND will not be restarted by medical intervention.*

  **Q3.1 (Value/Authority):** Has a decision been made to withdraw life-sustaining treatment (WLS) or is there a Do-Not-Resuscitate (DNR) order in place?
  *   **Sufficient Answer:** Yes, documented order signed by Attending Physician and Surrogate.
  *   **Insufficient Answer:** No, or decision is pending. -> **STOP.**
      *   **Reasoning:** Circulatory death cannot be declared if the team is still willing to resuscitate. The *decision not to treat* is a value judgment, not a biological fact.
      *   **Authority:** This decision belongs **SOLELY** to the Patient/Surrogate (for WLS) and the Attending Physician (for medical futility/DNR order). The Transplant Team has **NO** authority here.

  **Q3.2 (Fact):** Following withdrawal of support, has the patient reached asystole (no pulse, no heart sounds, no arterial pressure)?
  *   **Sufficient Answer:** Yes, monitored via arterial line or direct auscultation.
  *   **Insufficient Answer:** Agonal rhythms present. -> **WAIT.**

  **Q3.3 (Fact):** Has asystole persisted for the mandatory observation period (e.g., 5 minutes)?
  *   **Sufficient Answer:** Yes, timer complete.
  *   **Insufficient Answer:** No. -> **WAIT.**
      *   **Reasoning:** This interval ensures auto-resuscitation does not occur.

  **Q3.4 (Sign-off):** Has the Attending Physician (independent of recovery team) declared death?
  *   **Sufficient Answer:** Yes, time logged.
  *   **Action:** Time of Death = Time of completion of observation period. Proceed to **Phase 4**.

  ---

  ## PHASE 4: POST-DECLARATION INTERVENTION & RECOVERY
  *Standard: Dead-Donor Rule (Do nothing that causes death; recover no organ until dead).*

  **Q4.1 (Fact):** Is the proposed recovery method Normothermic Regional Perfusion (NRP)?
  *   **Definition:** Cannulation and perfusion of the abdominal/thoracic aorta with oxygenated blood *after* circulatory death declaration.
  *   **NO:** Proceed to standard cold flush and recovery.
  *   **YES:** Proceed to **Q4.2**.

  **Q4.2 (Logic Check):** Does restoring circulation to the body contradict the declaration of "Permanent Cessation of Circulatory Function"?
  *   **Policy Stance:** Yes. If circulation is restored to the body, the cessation was not permanent in a biological sense.
  *   **Exception:** NRP is **PERMITTED ONLY IF** extracorporeal membrane oxygenation (ECMO) circuit includes a verified, physical method to prevent blood flow to the brain (e.g., aortic occlusion balloon) AND the declaration of death was based on the *irreversible* loss of brain function *prior* to perfusion, OR if the hospital explicitly redefines "Permanent" to mean "Permanent *for the purpose of sustaining the organism's life*."
  *   **Current Policy Status:** Under the strict definition of "Permanent Cessation," NRP after DCD declaration is **PROHIBITED**.
  *   **Sufficient Answer:** Team agrees to forgo NRP OR Committee has passed a specific addendum redefining "Permanent" to allow NRP.
  *   **Insufficient Answer:** Team wishes to proceed with NRP under current standard definitions. -> **STOP.**
      *   **Action:** NRP Canceled. Standard cold recovery only.
      *   **Reasoning:** Restarting circulation violates the "Permanent" standard used to declare death. To do otherwise abandons the Dead-Donor Rule.

  **Q4.3 (Sign-off):** Does the OPO Medical Director sign off on the method of recovery?
  *   **Sufficient Answer:** Yes.
  *   **Action:** Proceed to recovery.

  ---

  ## CASE RUNS

  ### Case 1: The Brain Death Refusal
  **Scenario:** 24-year-old male, severe TBI. Meets all clinical criteria for brain death (coma, absent reflexes, positive apnea). Family is devout and believes the heart beating means he is alive. They refuse the ancillary cerebral blood flow test required by hospital policy for patients under 30.

  **Procedure Run:**
  1.  **Phase 1:** Patient on vent with pulse. -> **Phase 2.**
  2.  **Phase 2, Q2.1 & 2.2:** Cause known, exam complete. -> **Pass.**
  3.  **Phase 2, Q2.3:** Policy requires ancillary test for age. Family refuses. -> **FAIL.**
  4.  **Result:** **STOP.** Death cannot be declared.
  5.  **Outcome:** Patient remains on ventilator until cardiac arrest occurs naturally or family agrees to withdrawal. Organ recovery via DBD pathway is lost.

  **Committee Friction:** The committee will not like this. We lose viable organs because a policy requirement (ancillary test) clashes with surrogate values. The procedure correctly identifies this as a **Value** conflict (Q2.3), not a Fact conflict. The procedure forces us to admit we cannot declare death without the test, even if the biology is clear, because the *authorization* to verify is withheld.

  ### Case 2: The NRP Proposal
  **Scenario:** 45-year-old female, catastrophic stroke, DNR. Family consents to DCD donation. Patient withdraws, asystole occurs, 5-minute wait completed. Attending declares death. Transplant team immediately requests to initiate abdominal NRP to improve kidney/liver yield.

  **Procedure Run:**
  1.  **Phase 1:** Patient on vent. -> **Phase 2.** (Wait, patient arrested). -> **Phase 3.**
  2.  **Phase 3, Q3.1:** DNR/WLS decision made by Surrogate/Attending. -> **Pass.** (Value decision properly separated).
  3.  **Phase 3, Q3.2 & 3.3:** Asystole + 5 min wait. -> **Pass.**
  4.  **Phase 3, Q3.4:** Death Declared.
  5.  **Phase 4, Q4.1:** Is it NRP? **YES.**
  6.  **Phase 4, Q4.2:** Does restoring circulation contradict "Permanent Cessation"? **YES.**
      *   *Check:* Did we redefine "Permanent"? **NO.** (Current policy says "Permanent cessation").
      *   *Check:* Is brain flow physically blocked? **YES.**
      *   *Logic:* Even with brain flow blocked, systemic circulation is restored. The cessation was not permanent.
  7.  **Result:** **STOP.** NRP is prohibited under current wording.
  8.  **Outcome:** Standard cold perfusion only. Kidneys may have delayed graft function.

  **Committee Friction:** The committee will not like this. NRP significantly improves organ outcomes. The procedure forces the committee to admit that using NRP under the current definition of "Permanent" is logically inconsistent. To allow NRP, the committee must explicitly vote to change the definition of "Permanent" to "Permanent *for the patient*," acknowledging that we are prioritizing the *status of the patient* over the *biology of the organs* at the moment of declaration.

  ---

  ## LIMITATIONS: WHAT THIS PROCEDURE CANNOT SETTLE

  1.  **The Ontological Status of the NRP Donor:** This procedure can verify compliance with policy, but it cannot settle whether a patient undergoing NRP is truly "dead" in a philosophical sense. If we restore circulation to the abdomen, the cells are alive. The procedure relies on the legal fiction that "death" is a status assigned by a physician, not a biological event that cannot be undone. If the committee authorizes NRP without redefining "Permanent," this procedure exposes that we are violating our own standard.
  2.  **Surrogate Authority vs. Medical Fact:** In Case 1, the procedure stops because the family refuses a test. It cannot settle whether the family is *wrong* about the patient's status. It prioritizes the *process* of verification over the *reality* of the biology to avoid legal/ethical conflict. This protects the hospital but may not serve the patient's (or society's) interest in organ donation.
  3.  **The "Moment" of Death in DCD:** The procedure identifies the moment of death as the end of the 5-minute wait. It cannot settle the fact that the patient was biologically dying during those 5 minutes. It draws a bright line where biology offers a gradient. This is necessary for operation but metaphysically imprecise.

  ## SIGN-OFF REQUIREMENTS

  | Action | Required Signatory | Independence Requirement |
  | :--- | :--- | :--- |
  | **Decision to Withdraw/DNR** | Attending Physician + Surrogate | None (Treatment Decision) |
  | **Neurological Death Declaration** | Two Physicians | Neither can be part of Transplant Team |
  | **Circulatory Death Declaration** | Attending Physician | Cannot be part of Transplant Team |
  | **Authorization of NRP** | Ethics Committee + OPO Director | Must acknowledge policy deviation regarding "Permanence" |
  | **Organ Recovery** | Surgeon | N/A |

  **Chair's Note:** This procedure is designed to fail safely. If a step cannot be completed honestly, the process stops. It is better to lose an organ than to violate the Dead-Donor Rule. If the committee wishes to increase organ yield via NRP, you must amend the definition of "Permanent," not instruct staff to ignore the contradiction.
