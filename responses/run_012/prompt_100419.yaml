answer: |-
  The multiplicity rule's most critical implication is that it punishes independent verification, the cornerstone of scientific validity. By voiding eponyms upon independent confirmation, the rule transforms credit from a priority-based race into an exclusivity contest. Researchers would fear that sharing findings invites peers to replicate results, thereby stripping the original discoverer of named credit. Consequently, the incentive to develop and defend a result privately strengthens, while the incentive to announce prematurely weakens. This encourages data hoarding and secrecy, antithetical to scientific openness.

  Priority disputes would no longer hinge on who crossed the finish line first, but on whether the second runner cheated. Adjudication would shift from comparing timestamps to investigating information leakage or cryptomnesia. Being first matters only insofar as it secures a window of exclusivity; if another arrives independently, priority becomes irrelevant because neither receives the eponym.

  The incentive to thoroughly develop a theory increases, as a robust, complex result is harder for others to derive independently. However, the incentive to defend it becomes aggressive, focusing on blocking competitors rather than persuading peers. In the Darwin–Wallace case, joint publication might have been avoided to preserve potential exclusivity, delaying evolutionary theory's acceptance. For Newton and Leibniz, the lack of eponyms would obscure the distinct methodological contributions each brought, flattening historical understanding. Ultimately, the rule incentivizes monopolizing research lines to prevent independent discovery, slowing the collective verification process. While it might reduce toxic priority races, it replaces them with incentives for secrecy, undermining the communal accumulation of knowledge. The prospect of credit shifts from rewarding contribution to rewarding isolation.
