prompt: |-
  I run the analytics shop for a mid-size hospital network, and our quality committee keeps having the same fight: someone shows the board that Hospital A has a lower mortality rate than Hospital B overall, someone else points out that inside every single severity band B is actually better than A, and then everyone shrugs and we publish whichever version the CEO likes. That's not a method. I need an actual procedure my analysts can run before we publish any two-group comparison like this — the questions to ask in order, what counts as an answer to each, when to report the pooled number, when to report the stratified breakdown, and when to say the comparison shouldn't be published at all. My analysts are solid on regression and p-values but basically innocent about causal inference, so it has to survive that. Run it on three cases: (1) the two hospitals above, where severity is plausibly the thing driving the reversal; (2) two surgical teams where the reversal only appears once you stratify by whether the patient was transferred in from another facility, which I have a bad feeling is not a real confounder; and (3) a comparison where the strata disagree but I think the pooled number is the honest one — say, where the thing we'd be splitting on is something the treatment itself causes. And tell me straight where the procedure can't save us and a human just has to make a judgment call, because I'd rather know that up front than have the flowchart pretend to settle it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Analytics lead at a mid-size hospital network.
      *   **Context:** Quality committee fights over Simpson's Paradox (reversal of trends when data is aggregated vs. stratified).
      *   **Current State:** Ad-hoc decisions based on CEO preference.
      *   **Goal:** A standardized procedure/flowchart for analysts to determine *when* to report pooled vs. stratified data (or neither) in two-group comparisons.
      *   **Analyst Skill Level:** Strong on regression/p-values, weak on causal inference.
      *   **Requirements:**
          *   Ordered questions.
          *   Clear criteria for answers.
          *   Decision rules (Pooled vs. Stratified vs. No Publish).
          *   Application to three specific cases provided by the user.
          *   Honest admission of where human judgment is unavoidable.

  2.  **Deconstruct the Core Statistical/Causal Issue:**
      *   The phenomenon is Simpson's Paradox.
      *   The core question is: *Is the stratification variable a Confounder, a Mediator, or a Collider?*
      *   *Confounder:* Causes both treatment (Hospital A vs. B) and outcome (Mortality). Stratify/Adjust.
      *   *Mediator:* Caused by treatment, causes outcome. Do *not* stratify (blocks the effect).
      *   *Collider:* Caused by treatment and outcome (or their causes). Do *not* stratify (induces bias).
      *   *Effect Modification:* The effect actually differs by group. Report stratified.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   Need to keep it simple enough for regression-focused analysts but rigorous enough to avoid causal traps.
      *   *Step 1: Check for Reversal/Disagreement.* If pooled and stratified agree, report pooled (simpler). If they disagree, proceed.
      *   *Step 2: Temporal/Causal Ordering.* Did the stratification variable exist *before* the group assignment (Hospital/Team)?
          *   Yes -> Potential Confounder.
          *   No -> Potential Mediator or Collider.
      *   *Step 3: Causal Role.*
          *   If Pre-existing: Is it imbalanced between groups? Does it affect the outcome? -> Adjust/Stratify.
          *   If Post-treatment: Is it on the causal pathway? -> Do not stratify (report pooled).
          *   If Post-treatment: Is it a selection bias (Collider)? -> Do not stratify (report pooled or don't publish).
      *   *Step 4: Heterogeneity.* Even if adjustment is valid, does the effect *size* differ wildly? -> Report Stratified (Effect Modification).

  4.  **Refining the Procedure for the User's Constraints:**
      *   Analysts know regression. Use terms like "balance," "predictive of outcome," "temporal precedence."
      *   Avoid heavy DAG jargon where possible, but explain the logic.
      *   Make the "Stop/Go" decisions explicit.

  5.  **Applying to the Three Cases:**

      *   **Case 1: Hospital A vs. B, Severity Bands.**
          *   *Variable:* Patient Severity.
          *   *Timing:* Pre-existing (on admission).
          *   *Role:* Confounder (Sicker patients go to Trauma Center A, A looks worse overall, but A treats them better).
          *   *Decision:* Stratify/Adjust. The pooled number is misleading.
          *   *Protocol Check:* Pre-existing? Yes. Imbalanced? Yes. Predicts outcome? Yes. -> Report Stratified/Adjusted.

      *   **Case 2: Surgical Teams, Transfer Status.**
          *   *Variable:* Transferred in from another facility.
          *   *Timing:* Pre-existing relative to surgery, but potentially influenced by reputation (selection).
          *   *User Intuition:* "Bad feeling is not a real confounder." This suggests Selection Bias / Collider.
          *   *Analysis:* If Team A is the "last resort" team, they get transferred sicker patients. Transfer status is a proxy for severity/unobserved risk. However, if "Transfer" is caused by the *choice* of team (reputation), it's tricky. Usually, transfer status is a pre-admission characteristic. *Correction:* If the user suspects it's not a confounder, they might mean it's a *Collider* (conditioning on admission). Or, it's a proxy for unmeasured severity.
          *   *Refinement:* If Transfer Status is a proxy for severity (Confounding), adjust. If Transfer Status is caused by the Team's reputation (Selection), it's tricky. Let's assume the user's intuition is right: it's a selection variable (Collider) or post-assignment. Actually, "Transferred in" happens *before* the specific team sees them, but often sicker patients are transferred.
          *   *Wait, let's look closer at the prompt:* "reversal only appears once you stratify by whether the patient was transferred in." This implies Transfer is the stratification variable.
          *   *Causal Structure:* Team Assignment <- Transfer? Or Transfer <- Team Reputation? Usually, Transfer -> Team (Tertiary center gets transfers). Transfer -> Outcome (Transfers are sicker). This looks like Confounding.
          *   *Why the user's bad feeling?* Maybe because "Transfer" is a *collider* on the path of unmeasured severity and hospital capacity. If we condition on Transfer, we might open a backdoor path.
          *   *Decision:* This is the "Gray Zone." The protocol should flag this as "High Risk of Selection Bias." Recommendation: Do not publish stratified by transfer without deep dive. Report Pooled with caveat, or Don't Publish. Let's lean towards "Don't Publish Stratified" because transfer status often induces selection bias (Berkson's bias).

      *   **Case 3: Treatment Causes the Strata.**
          *   *Variable:* Something treatment causes (e.g., Post-op Complication, or Length of Stay).
          *   *Role:* Mediator.
          *   *Decision:* Do not stratify. Stratifying blocks the mechanism. Report Pooled.
          *   *Protocol Check:* Pre-existing? No. -> Do not stratify.

  6.  **Addressing the "Human Judgment" Requirement:**
      *   Statistics can't tell you the *direction* of causality. That requires domain knowledge.
      *   The procedure must explicitly state: "Analyst must certify temporal order with Clinical Lead."
      *   The procedure can't resolve "Effect Modification vs. Confounding" purely mathematically.

  7.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the pain point (Simpson's Paradox).
      *   **The Protocol:** Step-by-step flowchart logic.
      *   **The Three Cases:** Walkthrough using the protocol.
      *   **The "Human in the Loop" Section:** Explicitly defining where the math stops and judgment begins.

  8.  **Refining the Tone:**
      *   Professional, direct, operational.
      *   Respectful of the analysts' regression skills but firm on causal limits.
      *   No fluff.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Transfer Status" definitely a collider?
      *   *Correction:* In hospital networks, transfer status is often a proxy for severity (Confounder). However, if the prompt says "I have a bad feeling is not a real confounder," I need to respect that intuition. It might be that the *decision* to transfer is influenced by the *destination* team's perceived skill, making it endogenous. I will classify this as a "Selection Bias/Collider Risk" case where the protocol demands a pause.
      *   *Critique:* Make sure the distinction between "Report Stratified" (Effect Modification) and "Report Adjusted" (Confounding) is clear. For a board, "Adjusted" (regression) is often better than "Stratified" (tiny sample sizes), but the prompt asks about Pooled vs. Stratified. I will treat "Stratified" as "Disaggregated reporting" which solves Simpson's paradox.
      *   *Key Distinction:* Confounding = Pooled is wrong, Stratified/Adjusted is right. Mediation = Pooled is right, Stratified is wrong. Effect Modification = Both needed, but Stratified tells the real story.

  10. **Final Polish:** Ensure the "Stop Rules" are bold and clear. (Proceed to generate output).

  *(Self-Correction on Case 2)*: I need to be careful. If Transfer Status is pre-existing, it *is* a confounder usually. Why does the user have a bad feeling? Perhaps because "Transfer" is a *collider* between "Severity" and "Insurance/Network Status". If you condition on Transfer, you bias the association. I will frame the protocol to catch this via the "Common Cause" check. If the variable is a *result* of the grouping mechanism (e.g. only Team A takes transfers), it's not a confounder, it's a mechanism of selection. I will guide the user to treat this as "Do Not Stratify" unless proven otherwise.

  *(Final Plan)*:
  1. Define the "Causal Pre-Flight Check".
  2. Step 1: Temporal Order.
  3. Step 2: Balance & Prediction.
  4. Step 3: Mechanism (Confounder vs. Mediator vs. Collider).
  5. Apply to cases.
  6. Define the "Judgment Zone".

