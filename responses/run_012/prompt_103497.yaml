answer: |-
  This is a classic Simpson's Paradox problem, compounded by causal ambiguity. Your analysts are trained to minimize variance and maximize fit, but those metrics cannot distinguish a confounder from a mediator. To fix this, you need a **Causal Pre-Flight Check**.

  This procedure forces the analyst to classify the stratification variable *before* running the comparison. It relies on **temporal ordering** and **causal role**, not p-values.

  ### The Procedure: Causal Pre-Flight Check

  **Rule 0:** If the pooled estimate and the stratified estimates agree in direction and magnitude (within a pre-specified tolerance, e.g., 10%), report the **Pooled**. It is simpler and has higher power. If they disagree, proceed to Step 1.

  **Step 1: Temporal Precedence**
  *   **Question:** Did the stratification variable exist *before* the patient was assigned to Group A or Group B?
  *   **Data Needed:** Timestamps, clinical intake logs.
  *   **Decision:**
      *   **YES:** Proceed to Step 2. (It is a candidate Confounder or Effect Modifier).
      *   **NO:** **STOP.** Do not stratify. Report **Pooled**. (It is likely a Mediator or Collider; stratifying induces bias).
      *   **UNSURE:** **STOP.** Do not publish. Flag for Clinical Lead review.

  **Step 2: Imbalance Check**
  *   **Question:** Is the stratification variable distributed differently across Group A and Group B? (e.g., Does Hospital A get significantly sicker patients?)
  *   **Metric:** Standardized Mean Difference (SMD) > 0.1 or Chi-Square p < 0.05.
  *   **Decision:**
      *   **NO:** Proceed to Step 3. (If groups are balanced on this variable, it cannot confound the comparison).
      *   **YES:** Proceed to Step 3. (It is a candidate Confounder).

  **Step 3: Outcome Prediction**
  *   **Question:** Does the stratification variable strongly predict the outcome, independent of the group?
  *   **Metric:** Regression coefficient significance or C-statistic contribution.
  *   **Decision:**
      *   **NO:** Report **Pooled**. (It's not a confounder, just noise).
      *   **YES:** Proceed to Step 4. (It meets the definition of a Confounder).

  **Step 4: The "Common Cause" Test (The Human Judgment Gate)**
  *   **Question:** Is there a plausible *unmeasured* factor causing *both* the stratification variable and the Group Assignment? (This detects Colliders/Selection Bias).
  *   **Action:** Analyst must document the causal story and get sign-off from a Clinical Lead.
  *   **Decision:**
      *   **NO (It is a pure Confounder):** Report **Stratified** (or Risk-Adjusted). The pooled number is lying.
      *   **YES (It is a Collider/Selection):** Report **Pooled** or **Do Not Publish**. Stratifying will create bias where none existed.
      *   **MIXED (Effect Modification):** If the treatment effect *direction* flips or magnitude changes drastically between strata, report **Stratified**. The "average" effect does not exist for any real patient.

  ---

  ### Application to Your Three Cases

  Here is how your analysts should run this protocol on the specific fights you described.

  #### Case 1: Hospital A vs. B (Severity Bands)
  *   **Step 1 (Temporal):** Did severity exist before hospital assignment? **YES.** (Patients arrive sick, then are triaged/admitted).
  *   **Step 2 (Imbalance):** Is severity distributed differently? **YES.** (Hospital A is a trauma center, gets higher severity).
  *   **Step 3 (Prediction):** Does severity predict mortality? **YES.** (Obviously).
  *   **Step 4 (Common Cause):** Is severity a collider? **NO.** Severity causes assignment, not vice versa.
  *   **Verdict:** **Report Stratified (or Risk-Adjusted).**
  *   **Why:** Severity is a classic **Confounder**. The pooled number is biased because Hospital A is penalized for taking harder cases. The stratified number isolates the quality of care. Publishing the pooled number is medically dishonest.

  #### Case 2: Surgical Teams (Transfer Status)
  *   **Step 1 (Temporal):** Did transfer status exist before team assignment? **YES/MOSTLY.** (Usually transferred before arriving).
  *   **Step 2 (Imbalance):** Is transfer status different between teams? **YES.** (Team A takes more transfers).
  *   **Step 3 (Prediction):** Does transfer status predict outcome? **YES.** (Transfers are often sicker).
  *   **Step 4 (Common Cause):** **STOP.** This is your "bad feeling."
      *   *Analysis:* "Transfer In" is often a **Collider**. Patients are transferred *because* they are sick (Severity) AND *because* Team A has a reputation for saving doomed cases (Team Capability).
      *   If you stratify by Transfer, you condition on a variable caused by both the outcome risk and the team selection. This induces **Berkson's Bias**. You might make Team A look worse among transfers because you've selected for the "failed transfers" from other hospitals.
  *   **Verdict:** **Do Not Publish Stratified.**
  *   **Recommendation:** Report **Pooled** with a footnote, or **Do Not Publish** until a causal model (DAG) is validated by the Chief of Surgery. Your intuition is correct: Transfer status is likely a selection variable, not a clean confounder. Stratifying here creates artificial differences.

  #### Case 3: Treatment Causes the Strata (e.g., Post-Op Complications)
  *   **Scenario:** Comparing Drug A vs. Drug B on Recovery Time, stratifying by "Did patient develop a fever?"
  *   **Step 1 (Temporal):** Did fever exist before drug assignment? **NO.**
  *   **Verdict:** **Report Pooled.**
  *   **Why:** Fever is a **Mediator**. Drug A might cause fewer fevers, which leads to faster recovery. If you stratify by fever, you block the pathway through which Drug A works. You are asking, "Which drug is better *assuming* the patient already has a fever?" That is not the question the board is asking. Stratifying here hides the benefit of the treatment.

  ---

  ### Where the Procedure Fails (The Judgment Call)

  You asked for the limits. Here they are. This flowchart cannot solve these three problems; they require human judgment, specifically from a Clinical Lead, not an analyst.

  **1. The "Effect Modification" vs. "Confounding" Ambiguity**
  *   **The Problem:** Mathematically, confounding and effect modification look similar (strata differ from pooled).
  *   **The Judgment:** If Hospital B is better for low severity but Hospital A is better for high severity, that is **Effect Modification**. There is no "true" pooled number. The board must decide which patient population they care about.
  *   **The Fix:** The protocol tells you *not* to publish the pooled number, but it cannot tell the board *which* stratum to prioritize. That is a policy decision.

  **2. The Unmeasured Confounder**
  *   **The Problem:** Step 4 asks about "unmeasured factors." Analysts cannot see unmeasured factors.
  *   **The Judgment:** In Case 2 (Transfers), the analyst cannot prove it's a collider using data. They have to ask the surgeons: "Do you take transfers *because* you are better, or *randomly*?"
  *   **The Fix:** Require a signature. The analyst runs the check, but the Clinical Lead must sign the "Common Cause" box. If they won't sign, you don't publish.

  **3. Sample Size vs. Bias Trade-off**
  *   **The Problem:** Stratifying reduces sample size. You might find the "truth" in strata, but the confidence intervals become so wide the data is useless.
  *   **The Judgment:** Is it better to show a precise lie (Pooled) or an imprecise truth (Stratified)?
  *   **The Fix:** Set a minimum cell size rule. If stratifying leaves fewer than $N$ patients in a band, default to **Risk-Adjusted Regression** (which your analysts know) rather than raw stratification. If the model assumptions are violated, **Do Not Publish**.

  ### Implementation Directive

  To make this stick, add this to your analytics request intake form:

  1.  **Proposed Stratification Variable:** ___________
  2.  **Temporal Order:** Did this exist before group assignment? (Y/N)
  3.  **Causal Role:** Confounder / Mediator / Collider / Unknown.
  4.  **Clinical Sign-off:** (Required if Role is Unknown or Collider).

  If Box 2 is "No" and they still want to stratify, your team has permission to reject the request automatically. If Box 4 is unsigned on a high-stakes comparison, the report stays in draft. This shifts the burden from your analysts (who don't know causality) to the stakeholders (who do).
