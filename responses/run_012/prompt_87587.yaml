answer: |-
  Your hunch is not just right; it is the precise philosophical objection that economists and philosophers of science have been raising since Milton Friedman popularized this exact argument in 1953 (*Essays in Positive Economics*). Your housemate is channeling Friedman's **Instrumentalism**: the idea that theories are merely tools for prediction, not descriptions of reality.

  The subway map is the classic defense of Instrumentalism. To defeat it, you don't need to stomp; you need to show that the analogy smuggles in premises that economic models do not possess.

  Here is the audit of the analogy, the breakdown of where it snaps, and a better tool for the job.

  ### 1. The Audit: Mapping the Map

  Let's formalize your housemate's analogy to see where the load-bearing beams are.

  | Subway Analogy | Economic Model | Function in Analogy |
  | :--- | :--- | :--- |
  | **The Territory** | The Real Economy | The ground truth. |
  | **The Map** | The Model (e.g., Supply/Demand) | The simplified representation. |
  | **Omitted Buildings** | Friction/Noise (e.g., transaction costs) | Details deemed irrelevant to the specific function. |
  | **Squashed Geography** | **Rational Agents / Perfect Competition** | **Distortions to make the system legible.** |
  | **The Traveller** | The Policy Maker / Economist | The user of the model. |
  | **The Destination** | Economic Goal (e.g., Growth, Equilibrium) | **The success condition.** |
  | **The Tracks** | Causal Mechanisms | The physical constraints that make movement possible. |

  ### 2. Where the Mapping Breaks

  There are three critical fractures in this analogy. Two are technical, but the third is fatal to his conclusion.

  #### Break A: Omission vs. Commission (The "Buildings" Problem)
  Your housemate claims: *Leaving out buildings = Abstracting air resistance.*
  **The Break:** A subway map **omits** streets; it does not **draw** them in the wrong place. It simplifies by subtraction.
  **The Economic Reality:** Economic models often simplify by **commission**. Assuming "Perfect Competition" isn't just ignoring friction; it is assuming a market structure that *does not exist* and often *cannot exist* (e.g., infinite buyers/sellers, perfect information).
  **Why it matters:** If a map leaves out a park, you can still walk. If a map draws a track where there is no track (a false assumption about causality), you crash. Assuming rational agents isn't like ignoring air resistance; it's like assuming the train drives itself. If the train requires a driver (psychology/politics), the model doesn't just "squash" reality; it posits a mechanism that is absent.

  #### Break B: The Fixed Destination (Your Hunch)
  Your housemate claims: *You just check whether it gets you where you're going.*
  **The Break:** In the subway analogy, the destination (King's Cross) exists **independently** of the map. The map does not tell you *where to go*, only *how to get there*.
  **The Economic Reality:** In economics, the model often **defines** the destination. When an economist says "We need to maximize efficiency," "efficiency" is a term defined *by the model's assumptions* (e.g., Pareto optimality). If you change the assumptions (e.g., account for inequality or externalities), the "destination" changes.
  **Why it matters:** You cannot test if the model "gets you where you're going" if the model itself drew the destination on the map. If the model assumes markets are always efficient, then any policy that reduces market freedom is, by definition, "going the wrong way." The map becomes a compass that points only to itself.

  #### Break C: Reflexivity (The Tracks Move)
  Your housemate claims: *Nobody accuses it of lying.*
  **The Break:** Subway tracks are inert. They do not care if you have a map.
  **The Economic Reality:** Economic agents **see the map**. If a model predicts a bank run and publishes it, the run happens sooner. If a model assumes rational expectations and policymakers act on it, agents change their behavior to game the policy (The **Lucas Critique**).
  **Why it matters:** A subway map can be judged purely on prediction because the territory is static. An economic model cannot, because the act of using the model changes the territory. A model with "false" assumptions might predict well once, but fail when implemented as policy because the false assumption (e.g., "agents won't anticipate this inflation") becomes true only until it is published.

  ### 3. The Verdict: Does the Conclusion Survive?

  **No.** The conclusion ("realism of assumptions is irrelevant") relies entirely on the analogy holding up.

  The subway map works because the **causal mechanism** (the tracks) is real, even if the geometry is distorted. The map preserves *connectivity*.
  Economic models often fail because they posit **false connectivity**.

  If you assume rational agents, you are assuming a specific causal link: *Price Signal $\rightarrow$ Rational Calculation $\rightarrow$ Action.*
  If agents are actually irrational (behavioral econ), the link is: *Price Signal $\rightarrow$ Panic/Herd Behavior $\rightarrow$ Action.*

  If you use the subway map (Rational Model) to navigate the irrational territory, you aren't just taking a longer route; you are walking onto a track that isn't there. **Prediction without realistic mechanisms is just curve-fitting.** It might work until the regime changes, at which point it fails catastrophically because it doesn't understand *why* the prediction worked.

  ### 4. A Better Analogy: The Wind Tunnel

  If he wants an engineering analogy, give him one that actually fits. Don't use the map; use the **Wind Tunnel**.

  *   **The Model:** A scale model of a plane in a wind tunnel.
  *   **The Assumptions:** Smooth air, constant temperature, rigid wings, no turbulence.
  *   **The Reality:** Storms, metal fatigue, chaotic air currents.

  **The Pushback:**
  "Engineers *do* care if the assumptions are realistic. If you test a wing in a wind tunnel assuming 'smooth air' (perfect competition), it flies great in the tunnel. But if you ignore 'turbulence' (financial shocks) because it's 'unrealistic to model every gust,' the plane crashes in the real world.

  We don't demand the wind tunnel replicate every bird and cloud (omission). But we **do** demand the physics of lift in the tunnel match the physics of lift in the sky (mechanism).

  When you assume 'Rational Agents,' you aren't just smoothing out the clouds; you are testing the wing in a vacuum and claiming it will fly in an atmosphere. You can't separate the 'prediction' from the 'assumptions' because the assumptions are the physics that generate the prediction."

  ### 5. How to Deliver This

  Next time he pulls out the subway map, try this:

  > "The subway map works because the tracks exist independently of the map. The map doesn't tell me *where* I should want to go, and it doesn't move the tracks.
  >
  > But your models do both.
  > 1.  **They define the destination:** You tell me 'efficiency' is the goal, but efficiency is defined by your assumptions. If the assumptions are false, the goal is nonsense.
  > 2.  **They assume mechanisms that don't exist:** A map leaving out a building is omission. Assuming 'perfect information' is commission. It's like a flight simulator turning off gravity to make the math easier. It might predict the plane moves forward, but it won't tell you how to land.
  >
  > I'm not asking for a photograph of the economy. I'm asking for a wind tunnel where the physics actually match the sky. If the assumptions are false, the prediction is just a lucky guess that will fail the moment policy changes the game."

  **Summary:** Your housemate is hiding behind **Friedman's Instrumentalism**. The subway map analogy only works if the territory is static and the destination is external. In economics, the territory reacts to the map, and the model defines the destination. The analogy collapses under that weight.
