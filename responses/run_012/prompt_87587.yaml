prompt: |-
  my housemate does econ and he's got this one line he pulls out whenever i say his models assume things that are obviously false. he says a model is like a subway map: it leaves out the buildings, it squashes the geography, nobody accuses it of lying, and you don't whine that it's "unrealistic" -- you just check whether it gets you where you're going. he's even got a sub-analogy: leaving out the buildings is like abstracting away air resistance, and squashing the distances is like assuming rational agents. from all this he concludes that the realism of assumptions is irrelevent and the only test of a model is how well it predicts, so i should stop going on about perfect competition.

  i want to push back but i don't want to just stamp my foot and assert that realism matters. can you actually audit the analogy? what maps onto what (territory, map, scale, legend, the traveller, the destination), then where the mapping breaks, and which of the breaks actually matter for the conclusion he's drawing versus which are just decoration. i've got a hunch that a map leaving something out and a model assuming something false aren't the same move, and that the analogy quietly leans on there being a destination that's fixed independently of the map -- which is exactly what's missing when a model is supposed to tell you where you should want to go. tell me if the hunch is right, and whether the "only prediction matters" conclusion survives the audit or whether the map was carrying the whole thing. if the analogy can't be patched, what would a better one be?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is arguing with an economics housemate about the realism of assumptions in economic models.
      *   **Housemate's Argument:** Uses the "Subway Map Analogy." Models are like maps (specifically subway maps). They distort reality (squash geography, leave out buildings) to be useful. Therefore, assumption realism is irrelevant; only predictive success (getting you where you're going) matters.
      *   **Housemate's Specific Mappings:** Leaving out buildings = abstracting air resistance. Squashing distances = assuming rational agents.
      *   **User's Goal:** Push back without just asserting "realism matters." Wants an *audit* of the analogy.
      *   **Specific Tasks:**
          1.  Map the analogy (Territory, Map, Scale, Legend, Traveller, Destination).
          2.  Identify where the mapping breaks.
          3.  Determine which breaks matter for the conclusion ("only prediction matters").
          4.  Evaluate the user's hunch (omission vs. false assumption; fixed destination).
          5.  Decide if the conclusion survives or if the analogy carries the weight.
          6.  Suggest a better analogy if this one fails.

  2.  **Deconstruct the Subway Map Analogy (The Audit):**
      *   *The Map:* The Economic Model.
      *   *The Territory:* The Actual Economy.
      *   *The Traveller:* The Policy Maker / Economist / Agent.
      *   *The Destination:* The Goal (e.g., GDP growth, low inflation, equilibrium).
      *   *The Distortion:* Topological vs. Geometric accuracy (Subway maps preserve connectivity, not distance).
      *   *The Omission:* Buildings, streets, parks (irrelevant details).

      *   *Housemate's Claim:* Distortion/Omission $\neq$ Lying. Utility = Success.
      *   *User's Hunch:*
          1.  Leaving something out (omission) $\neq$ Assuming something false (commission).
          2.  Maps have a fixed destination independent of the map. Models often *define* the destination or the path.

  3.  **Evaluate the Breaks in the Analogy:**
      *   *Break 1: Omission vs. False Assumption.*
          *   Subway maps *omit* streets. They don't usually draw a street where there isn't one.
          *   Economic models often *assume* things that are actively false (e.g., perfect information, rational agents). This isn't just leaving out air resistance; it's assuming a vacuum when there is air.
          *   *Impact:* High. If the map draws a track where there is no track, you crash. If the model assumes rationality where there is panic, the prediction fails.
      *   *Break 2: The "Destination" Problem.*
          *   Subway: Destination is external (I want to go to King's Cross). The map doesn't tell me *where* I should want to go.
          *   Economics: Often normative. "We should aim for efficiency." But efficiency is defined *by the model*. If the model assumes perfect markets, "efficiency" means something specific. If the assumptions change, the "destination" changes.
          *   *Impact:* High. This validates the user's hunch.
      *   *Break 3: Feedback Loops (Reflexivity).*
          *   Subway: The map doesn't change the tracks.
          *   Economics: The model changes the behavior. If everyone believes the Efficient Market Hypothesis, they act differently, potentially breaking the model.
          *   *Impact:* Medium/High.
      *   *Break 4: Scale and Distortion.*
          *   Subway: Distortion is consistent and known (topological).
          *   Economics: Distortion is often unknown or parameter-dependent. "Rationality" isn't a consistent squash; it's a fundamental behavioral claim.

  4.  **Assess the Conclusion ("Only Prediction Matters" / Friedman's Instrumentalism):**
      *   The housemate is essentially arguing Milton Friedman's *Essays in Positive Economics* (1953) position.
      *   The subway map analogy is a classic defense of instrumentalism.
      *   *Does it survive the audit?* No, because the analogy hides the *causal mechanism*. A subway map works because the physical tracks exist independently. An economic model often *posits* the mechanism. If the mechanism (assumptions) is wrong, the prediction might work by luck (curve fitting) but fail under policy intervention (Lucas Critique).
      *   *User's Hunch:* Correct. The "fixed destination" point is crucial. Also, the "omission vs. falsehood" point is crucial.

  5.  **Drafting the Response:**
      *   *Tone:* Analytical, rigorous, slightly playful (matching the user's intellectual style).
      *   *Structure:*
          1.  Validate the user's hunch (it's spot on).
          2.  The Audit (Table or List of mappings).
          3.  The Critical Breaks (Omission vs. Commission, The Fixed Destination, Reflexivity).
          4.  The Verdict on the Conclusion (Instrumentalism fails here).
          5.  A Better Analogy (The Wind Tunnel or The Recipe).

  6.  **Refining the "Better Analogy":**
      *   *Wind Tunnel:* Good for physics/engineering. Assumes smooth air, scale model. But still relies on physical laws holding.
      *   *Recipe:* Good for social science. If you assume the oven works (false assumption), the cake fails. If you assume the cook is rational (follows instructions), but they are tired, the cake fails.
      *   *Medical Trial:* Better. You can't just say "the drug works" without knowing *why* (mechanism). If you assume the liver works perfectly but it doesn't, the drug kills.
      *   *Selection:* The **Wind Tunnel** is the standard counter to Friedman. It captures "idealization" vs. "falsehood." But the **Architect's Blueprint** might be better for the "destination" argument. Let's go with the **Wind Tunnel** for the assumptions part and the **Compass** for the destination part. Actually, a **Flight Simulator** is probably best. It models physics. If you turn off gravity in the sim (false assumption), you learn to fly in a way that kills you in reality.

      *   *Wait, let's look closer at the "Rationality" claim.* The housemate says "Squashing distances = Rational Agents." This is a category error. Squashing distances is a *simplification of geometry*. Rationality is a *claim about psychology*. A better analogy for Rationality is assuming the train drives itself.
      *   *Let's stick to the Wind Tunnel/Engineering analogy.* It's the standard philosophical counter to Friedman. It distinguishes between *negligible* factors (air resistance on a falling feather vs. a bowling ball) and *critical* factors.

  7.  **Final Polish:**
      *   Make sure to explicitly address the "omission vs. falsehood" distinction.
      *   Highlight the Lucas Critique (policy changes behavior).
      *   Confirm the "fixed destination" hunch is the killer blow.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer all parts of the prompt?
