  # Classification Instrument: The Ethics of Everyday Conventions

  **Instructions:** Answer the following questions based on your intuitive moral judgments about the cases described. Follow the path indicated by your answers to arrive at a positional leaf.

  ### **Node 1: The Grounding of Rules**
  **Case:** Consider two instances of jaywalking. In Case A, you cross a busy street while a small child watches, risking a crash. In Case B, you cross at 3:00 AM on a perfectly empty street with no cameras and no witnesses.
  **Question:** Is Case B (the empty street) morally wrong in the same way Case A is, simply because the rule exists?
  *   **Yes:** [Practice-Dependent Grounding] → Go to Node 2.
  *   **No:** [Practice-Independent Grounding] → Go to Node 2*.

  *(Note: Node 2* is a simplified path for Independent Grounding, as Weight is fixed by the framework.)*

  ---

  ### **Node 2: The Scope of Obligation (Visitor Test)**
  **Case:** A visitor from a country with no tipping norm dines in a local restaurant where tips are assumed by both the employer and the server.
  **Question:** What is the visitor's obligation?
  *   **A:** They must tip exactly as a local would. [Place-Indexed Scope]
  *   **B:** They are exempt, as they do not share the practice's benefits. [Insider-Indexed Scope: Exempt]
  *   **C:** They must tip, and perhaps more carefully than a local, as a guest's burden. [Insider-Indexed Scope: Guest-Burden]

  *(All three answers proceed to Node 3 or 3* depending on Node 1 path.)*

  ---

  ### **Node 3: The Weight of Convention (Queue Test)**
  **Case:** You hold a place in a queue for a friend who has not yet arrived, inconveniencing those behind you.
  **Question:** (For **Practice-Dependent** paths from Node 1): Is this breach a strict moral wrong or a social faux pas?
  *   **Strict Wrong:** [Duty] → Go to Node 4.
  *   **Social Faux Pas:** [Membership Fee] → Go to Node 5.
  *   *(Note: Defeasible Reason is merged into Duty for Dependent paths in this instrument to maintain depth constraints, or treated as a sub-variant in the Leaf.)*

  ### **Node 3*: The Weight of Convention (Independent Path)**
  **Case:** (For **Practice-Independent** paths from Node 1).
  **Determination:** Weight is fixed as [Defeasible Reason] (bound only by harm/fairness). → Go to Leaf Group I.

  ---

  ### **Node 4: The Limit of Authority (Unjust Convention Test)**
  **Case:** A visitor complies with a local convention she believes props up an unjust arrangement (e.g., segregation-era seating).
  **Question:** Is she obligated to comply simply because it is the local rule?
  *   **Yes:** [Rule Binds] → Go to Leaf Group II-A.
  *   **No:** [Rule Dissolves] → Go to Leaf Group II-B.

  ---

  ### **Node 5: The Nuance of Politeness (Food Test)**
  **Case:** A visitor declines food a host has offered, following her own custom rather than the host's.
  **Question:** Is this merely rude, or pragmatically permissible?
  *   **Merely Rude:** [Membership Fee Confirmed] → Go to Leaf Group III.
  *   **Permissible:** [Defeasible Reason Variant] → Go to Leaf Group III*.

  ---

  ## **Positional Leaves**

  ### **Leaf Group I: Practice-Independent Grounding**
  *(Reached via Node 1: No → Node 2 → Node 3*)*

  **Leaf 1.1: The Harm-Only Universalist**
  *   **Scope:** Place-Indexed.
  *   **Awkward Commitment:** Must intervene in local queueing even when no harm occurs, purely on fairness grounds.
  *   **Verdicts:** Tipping (Only if server expects it); Queueing (Only if harm/unfair); Jaywalking (Only if unsafe); Visitor Scope (Bound by local rules only insofar as they prevent harm).

  **Leaf 1.2: The Harm-Only Insider**
  *   **Scope:** Insider-Indexed (Exempt).
  *   **Awkward Commitment:** A visitor may drive on the 'wrong' side if they haven't 'bought in' to the road system, provided no crash occurs.
  *   **Verdicts:** Tipping (Optional); Queueing (Optional for visitors); Jaywalking (Permissible if safe); Visitor Scope (Bound only by core harm principles).

  **Leaf 1.3: The Harm-Only Guest**
  *   **Scope:** Insider-Indexed (Guest-Burden).
  *   **Awkward Commitment:** A visitor is held to a *higher* standard of harm-avoidance than a local, simply for being a guest.
  *   **Verdicts:** Tipping (Required to prevent server loss); Queueing (Strict fairness); Jaywalking (Strictly safe); Visitor Scope (Bound more strictly than locals on safety).

  ---

  ### **Leaf Group II: Practice-Dependent + Duty**
  *(Reached via Node 1: Yes → Node 2 → Node 3: Strict Wrong → Node 4)*

  **Leaf 2.1: The Localist Absolutist**
  *   **Scope:** Place-Indexed.
  *   **Awkward Commitment:** Must comply with unjust local conventions (e.g., segregation) because the rule exists.
  *   **Verdicts:** Tipping (Mandatory); Queueing (Duty); Jaywalking (Wrong even at 3 AM); Visitor Scope (Bound exactly as a local).

  **Leaf 2.2: The Localist Conscientious**
  *   **Scope:** Place-Indexed.
  *   **Awkward Commitment:** Rules bind locals absolutely, but visitors (or anyone) may break them if unjust, creating a double standard.
  *   **Verdicts:** Tipping (Mandatory); Queueing (Duty); Jaywalking (Wrong at 3 AM); Visitor Scope (Bound as local, unless unjust).
  *   **Note:** *One of the two leaves separated only by the Unjust Convention case.*

  **Leaf 2.3: The Insider Absolutist**
  *   **Scope:** Insider-Indexed (Exempt).
  *   **Awkward Commitment:** Visitors are completely exempt from local rules, even if they benefit from the restaurant's service.
  *   **Verdicts:** Tipping (Locals only); Queueing (Locals only); Jaywalking (Locals only); Visitor Scope (Bound only by practice-independent core).

  **Leaf 2.4: The Insider Conscientious**
  *   **Scope:** Insider-Indexed (Exempt).
  *   **Awkward Commitment:** Visitors are exempt, but insiders must follow unjust rules unless they opt out of the practice entirely.
  *   **Verdicts:** Tipping (Locals only); Queueing (Locals only); Jaywalking (Locals only); Visitor Scope (Exempt from local convention).
  *   **Note:** *The second of the two leaves separated only by the Unjust Convention case.*

  **Leaf 2.5: The Guest-Burden Rigorist**
  *   **Scope:** Insider-Indexed (Guest-Burden).
  *   **Awkward Commitment:** A visitor is morally required to tip more than a local to 'pay' for their intrusion.
  *   **Verdicts:** Tipping (Strictly required); Queueing (Strict duty); Jaywalking (Wrong at 3 AM); Visitor Scope (Bound more strictly than a local).

  ---

  ### **Leaf Group III: Practice-Dependent + Membership Fee**
  *(Reached via Node 1: Yes → Node 2 → Node 3: Faux Pas → Node 5)*

  **Leaf 3.1: The Social Contractarian**
  *   **Scope:** Place-Indexed.
  *   **Awkward Commitment:** Breaching a queue is no worse than wearing the wrong color tie, even if it angers others.
  *   **Verdicts:** Tipping (Social expectation); Queueing (Faux pas); Jaywalking (Faux pas at 3 AM); Visitor Scope (Bound as a local).

  **Leaf 3.2: The Polite Guest**
  *   **Scope:** Insider-Indexed (Guest-Burden).
  *   **Awkward Commitment:** Declining offered food is a moral failing for a visitor, but not for a host.
  *   **Verdicts:** Tipping (Fee for service); Queueing (Faux pas); Jaywalking (Faux pas); Visitor Scope (Bound more strictly on politeness).

  **Leaf 3.3: The Unnamed Position**
  *   **Scope:** Insider-Indexed (Exempt).
  *   **Awkward Commitment:** One can participate in a practice (dining) yet owe nothing to its norms (tipping), rendering the norm meaningless.
  *   **Diagnosis:** *Empty.* This combination is incoherent; if one benefits (Insider), one cannot be fully Exempt from the Fee.
  *   **Verdicts:** N/A.

  ---

  ## **Instrument Analysis**

  ### **Unoccupied Combinations**
  1.  **Practice-Independent Grounding + Membership Fee:** *Diagnosis: Incoherent.* A "Membership Fee" derives its force from the existence of the practice; if the ground is Practice-Independent (harm/fairness), the weight must be a Defeasible Reason, not a social fee.
  2.  **Practice-Dependent Grounding + Defeasible Reason (Strong):** *Diagnosis: Unexplored.* Most theories collapse this into either Duty (rules bind) or Fee (rules suggest); a strong practice-dependent reason that is easily outweighed is theoretically unstable.
  3.  **Insider-Indexed (Exempt) + Guest-Burden:** *Diagnosis: Incoherent.* These are mutually exclusive Scope definitions; one cannot be exempt and burdened simultaneously.

  ### **Indistinguishable Leaves**
  1.  **Leaf 1.1 (Harm-Only Universalist) vs. Leaf 3.1 (Social Contractarian):**
      *   *Current Status:* Both mandate tipping and queueing in standard cases.
      *   *Separating Case:* **The 3 AM Jaywalk.** Leaf 1.1 permits it (no harm); Leaf 3.1 forbids it (rule breach is a faux pas).
  2.  **Leaf 2.2 (Localist Conscientious) vs. Leaf 2.4 (Insider Conscientious):**
      *   *Current Status:* Both allow resistance to unjust conventions.
      *   *Separating Case:* **The Visitor Tipping.** Leaf 2.2 requires the visitor to tip (Place-Indexed); Leaf 2.4 exempts the visitor (Insider-Exempt).

  ### **The Stuck Respondent**
  **Node:** **Node 2 (The Scope of Obligation / Visitor Test).**
  **Reason:** A respondent with mixed intuitions often feels that a visitor should follow local rules (*Place-Indexed*) but also feels that outsiders shouldn't be bound by norms they didn't grow up with (*Insider-Exempt*). This node forces a choice between "When in Rome" and "Fairness to the Outsider," and the third option (*Guest-Burden*) often feels intuitively demanding yet morally plausible. Respondents frequently oscillate here because their intuition shifts depending on whether the convention is trivial (tipping) or serious (law), making this the primary friction point in the logical space.
