answer: |-
  You have described a phenomenon that is acutely observed and deeply significant, yet it lacks a single, universally canonical name. You are correct to situate it near Langdon Winner's *Do Artifacts Have Politics?*, but as you note, Winner's famous examples (the Long Island parkway bridges, nuclear power) tend towards hard constraints—technologies that *require* or *forbid* specific social arrangements. Your observation concerns something subtler: a design that tilts the playing field through differential friction rather than walls.

  In the literature of Science and Technology Studies (STS) and political philosophy of technology, this is most often discussed under the umbrella of **"Infrastructural Politics"** (following Susan Leigh Star) or **"Regulation by Architecture"** (following Lawrence Lessig). However, neither phrase captures precisely the *initial, quiet asymmetry of cost* you describe.

  If a name is required, the most precise descriptive term currently in circulation is **"Asymmetric Friction"**, though it is often subsumed under **"Material Normativity"** or **"The Politics of the Default"**.

  Here is how this concept distinguishes itself from the neighbouring ideas you mentioned.

  ### 1. How it differs from Ordinary Path Dependence
  Ordinary path dependence is a historical argument: it explains why we remain stuck with a technology (like the QWERTY keyboard) because the cost of switching increases over time as more people invest in the existing standard. It is about *accumulated* inertia.

  The phenomenon you describe is different because the asymmetry is present **at the moment of inception**. The bridge is built with a low clearance; the file format is saved with a specific metadata schema; the ticketing machine accepts cards but not cash. The alternative was possible at $t=0$, but the design made it expensive or inconvenient immediately. Path dependence explains why we cannot leave the room later; your phenomenon explains why the door was built narrow in the first place, without anyone declaring it a gate.

  ### 2. How it differs from Deliberate Designer Bias
  There is a strand of thought, such as Value Sensitive Design (VSD), which argues that engineers *ought* to deliberately build ethical values into systems. Conversely, there is the suspicion of a "hidden agenda" (e.g., a vendor designing a system to force proprietary lock-in).

  Your observation is more insidious because it does not require a conspirator. The asymmetry often arises from **engineering myopia**: a focus on efficiency, standardisation, or elegance that inadvertently privileges one social group or workflow over another. The "decision" is not made by a person with a political motive, but by a team optimising for a narrow metric (speed, cost, compatibility). The politics are a by-product, not a blueprint. This makes it harder to challenge, as there is no villain to indict, only a "technical requirement" to interrogate.

  ### 3. How it differs from "Tools Shape Habits"
  The claim that "tools shape habits" is usually psychological or behavioural. It suggests that using a hammer makes one see the world as full of nails. This is about individual cognition and routine.

  Your phenomenon is **structural and economic**. It is not that users psychologically prefer the frictionless path (though they might); it is that the alternative path involves tangible transaction costs, administrative hurdles, or technical incompatibility. It is not merely that we *grow used* to the ticketing machine; it is that the station is staffed in a way that makes speaking to a human an exceptional request rather than a standard option. The tool does not just shape the habit; it reshapes the institutional landscape in which the habit occurs.

  ### Proposed Name: "Infrastructural Normativity"
  While "Asymmetric Friction" describes the mechanism, **"Infrastructural Normativity"** captures the outcome. It denotes the process by which infrastructure establishes a norm not by decree, but by rendering the normative path the path of least resistance. It is the quiet conversion of a technical preference into a social default.

  ### Confidence and Uncertainty
  I am **highly confident** (approximately 90%) that there is no single, dominant noun in the academic canon that exclusively denotes this specific shape of technological politics. It is typically treated as a nuance within the broader "Politics of Artifacts" or "Infrastructure Studies."

  The point on which I am **least sure** (approximately 70% confidence) is whether a specific term has gained traction in the very recent literature of **Critical Data Studies** or **UX Ethics**. Fields concerned with "Dark Patterns" or "Choice Architecture" sometimes use terms like **"Coercive Design"** or **"Forced Efficiency"**, but these often imply a stronger degree of intent than your description allows. It is possible a specific phrase like **"The Default Effect"** is being used in policy circles to describe exactly this, though that term usually applies to behavioural economics rather than physical infrastructure.

  In summary, you have identified a gap in the vocabulary. The phenomenon is well-recognised in theory, but it lacks a sharp label. Until one sticks, **"Asymmetric Friction"** or **"Infrastructural Normativity"** serves best to distinguish it from hard determinism and mere historical accident.
