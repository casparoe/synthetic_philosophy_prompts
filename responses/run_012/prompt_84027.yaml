      *   Game: Coin flip until tails (n). Payout $min(2^{n-1}, 2^K)$.
      *   $K$ is uniform on $\{10, 11, ..., 100\}$. There are 91 possible values.
      *   Expected Value (EV) calculation:
          *   $E[Payout] = E_K [ E_{Game} [ Payout | K ] ]$
          *   For a fixed $K$, the expected payout of the capped St. Petersburg game is roughly $K + 1$ (actually slightly less depending on exact indexing, but linear in $K$).
          *   Let's check: $E[Payout|K] = \sum_{n=1}^{K} (1/2)^n 2^{n-1} + \sum_{n=K+1}^{\infty} (1/2)^n 2^K$.
