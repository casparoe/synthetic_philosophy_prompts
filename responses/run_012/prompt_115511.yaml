          3.  Provide a "Residue Report": Analyze what *doesn't* translate. Is the moral debate just incentive design in disguise, or is there a genuine blind spot in the insurance framework regarding "desert"?
          4.  **Tone/Constraint:** Be honest in both directions. Don't smuggle actuarial assumptions as moral truths. Don't flatter the user's suspicion that moralists are confused. Tell me what survives translation, what gets mutilated, and what is unsayable. Finish with a view on whether the residue is a defect of the vocabulary or evidence of the debate's lack of clarity.

