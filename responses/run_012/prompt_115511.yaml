      *   *Work Requirements $\rightarrow$ Deductibles/Co-pays/Mitigation Clauses:* A deductible ensures the insured has "skin in the game" to prevent moral hazard. Work requirements ensure the beneficiary contributes effort, theoretically reducing dependency (moral hazard).
      *   *Benefit Fraud $\rightarrow$ Material Misrepresentation/Claims Fraud:* Lying on the application or inflating the loss. This is voidable coverage.
      *   *Deserving/Undeserving $\rightarrow$ Risk Classification/Experience Rating:* "Good risks" vs. "Bad risks." But wait, in insurance, "bad risk" usually means *high probability of loss*, not *moral culpability*. However, underwriting does distinguish between unavoidable loss (act of God) and negligent loss (failure to maintain property).
      *   *Sanctions $\rightarrow$ Claim Denial/Rescission:* If terms are breached, the claim is denied.
