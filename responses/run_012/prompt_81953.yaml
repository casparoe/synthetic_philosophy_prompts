answer: |-
  Your classmate is wielding a slogan that functions as a philosophical talisman: it sounds wise, it is difficult to contradict without sounding arrogant, and it effectively shuts down debate. However, as you suspect, the sentence "You can't judge the past by present standards" is not a single argument but a conflation of several distinct claims. Some are trivial, some are methodological rules, and some are substantive meta-ethical assertions.

  To reopen the conversation, you need to force your classmate to specify which version of the claim he is defending. Below is a menu of five distinct readings, ranked from the nearly tautological to the highly contentious, followed by an analysis of which (if any) actually threatens Nietzsche's project.

  ### A Menu of Readings

  **1. The Conceptual Constraint (Epistemological)**
  *   **The Claim:** We cannot accurately *understand* past agents if we describe their actions using concepts that did not exist for them. To call a Bronze Age chieftain a "war criminal" is to misunderstand his social reality.
  *   **Who is forbidden:** The historian or interpreter.
  *   **What is forbidden:** Misdescription, not necessarily evaluation.
  *   **Plausibility:** High. It is a basic rule of hermeneutic charity. If we want to know what the past *was*, we must use its own vocabulary.
  *   **Does it stop Nietzsche?** No. Nietzsche is not primarily interested in accurate description for the sake of knowledge. He is interested in the past's effect on the present. He admits he is interpreting the past through the lens of "Life," not reconstructing it for a museum.

  **2. The Professional Prohibition (Methodological)**
  *   **The Claim:** The discipline of history aims at truth, not moral verdicts. A historian acting as a judge ceases to be a historian and becomes a polemicist.
  *   **Who is forbidden:** The professional historian *qua* historian.
  *   **What is forbidden:** Prescriptive condemnation within historical scholarship.
  *   **Plausibility:** Moderate. This is a standard norm of modern academic history (the fact/value distinction).
  *   **Does it stop Nietzsche?** No. Nietzsche explicitly distinguishes his project from "scientific" or "objective" history. In *On the Use and Abuse of History for Life*, he argues that pure objectivity is sterile. He is writing philosophy, not history. Conceding that critical history is "bad history" is actually to concede Nietzsche's point: that history must be subordinated to life, not the other way around.

  **3. The Fairness Principle (Moral/Legal)**
  *   **The Claim:** It is unfair to blame an agent for violating a norm they could not have known. *Ought implies can*, and perhaps *ought implies knew*.
  *   **Who is forbidden:** The moral judge.
  *   **What is forbidden:** Retrospective blame or punishment of dead agents.
  *   **Plausibility:** High in legal and interpersonal contexts. We generally accept that holding a medieval peasant responsible for modern human rights violations is unjust.
  *   **Does it stop Nietzsche?** Weakly. Nietzsche's "critical history" is not a courtroom trial aiming to punish the dead. The dead cannot suffer. The "condemnation" is a ritual performed by the living to break the psychological chain of inheritance. The point is not to punish the ancestor but to liberate the descendant.

  **4. The Meta-Ethical Claim (Relativist)**
  *   **The Claim:** Values are indexed to their epochs. There is no trans-historical standpoint from which to declare one era's values superior to another's. Present values are not *truer*, just *newer*.
  *   **Who is forbidden:** Everyone (philosophers, historians, moral agents).
  *   **What is forbidden:** Any claim of moral progress or trans-temporal judgment.
  *   **Plausibility:** Low to Contention. This is a heavy philosophical burden. To assert this claim is itself to make a trans-historical claim about the nature of value. If it is true, it is true for all time, which contradicts the claim that truth is time-bound.
  *   **Does it stop Nietzsche?** Yes, *if* accepted. If there is no standpoint outside of time, Nietzsche's "tribunal of life" is just another epochal bias. However, this requires your classmate to defend a robust moral relativism, which is far harder to defend than the slogan itself.

  **5. The Political Warning (Instrumental)**
  *   **The Claim:** Instrumentalizing the past to serve present agendas inevitably distorts the past and leads to dangerous political myths.
  *   **Who is forbidden:** Political actors and ideologues.
  *   **What is forbidden:** Using history as a tool for present legitimacy or revolution.
  *   **Plausibility:** Moderate. History weaponized for the present often leads to propaganda.
  *   **Does it stop Nietzsche?** No. Nietzsche openly admits he is instrumentalizing history. He argues that we *must* distort the past to survive. He would agree with the description but reject the warning. For Nietzsche, the danger is not distortion; the danger is being crushed by the weight of undistorted truth.

  ### Which Reading Delivers the Conclusion?

  Only **Reading 4 (The Meta-Ethical Claim)** actually delivers your classmate's conclusion that Nietzsche's critical history is *illegitimate*.

  Readings 1, 2, and 5 concede that critical history is historically inaccurate or methodologically impure, but they do not prove it is philosophically forbidden. Nietzsche agrees it is impure; he argues that purity is deadly. Reading 3 (Fairness) fails because critical history is not about retributive justice for the dead.

  Therefore, if your classmate wants to maintain that Nietzsche is wrong, he must defend Reading 4. He must argue that there is no "Life" or "Health" that stands outside of history as a measuring stick. He must argue that Nietzsche's values are *only* 19th-century German values, with no claim on us. This moves the debate from a easy slogan to a hard meta-ethical argument, which is where it belongs.

  ### The Crucial Nietzschean Rebuttal: Whose Past?

  There is a more fundamental reason why the slogan fails against Nietzsche, one that addresses your final point about the "community's relation to its own inherited past."

  The slogan "You can't judge the past by present standards" is typically deployed to protect *strangers* from *outsiders*. It is used when a 21st-century American judges a 14th-century Mongol, or when a victor judges a vanquished culture. It is a rule of distance.

  Nietzsche's critical history is not about strangers. It is about *inheritance*.

  In Section 6 of the essay, Nietzsche describes critical history as the process by which a living culture brings its *own* past before a tribunal. It is akin to a son judging his father, or a generation judging its predecessors. In these cases, the "present standards" are not foreign impositions; they are the very values that the past produced and bequeathed.

  When Nietzsche condemns the past, he is not applying an alien standard. He is using the vitality of the present to judge the dead weight of the past that threatens to suffocate that present. The judgment is internal to the lineage. To tell a community it cannot judge its own inheritance by its own current need for life is to demand that the living be ruled by the dead.

  Furthermore, Nietzsche anticipates the charge of anachronism. He writes:

  > "There is no degree of innocence... which could not be annihilated by a single dogmatic judgment."

  He admits the judgment is dogmatic. He admits it is unjust. His argument is that this injustice is a *vital necessity*. "For we want to serve history only to the extent that history serves life."

  ### How to Reopen the Conversation

  You do not need to concede that your classmate is right. You can respond by saying:

  1.  **Disambiguate:** "Are you claiming we can't *understand* the past without its own concepts, or that we can't *evaluate* it without universal standards? Nietzsche admits he isn't doing science, so the methodological objection doesn't touch him."
  2.  **Challenge the Relativism:** "If you mean that no values are better than others across time, you're making a universal claim to deny universal claims. Do you want to defend that?"
  3.  **The Inheritance Point:** "Nietzsche isn't judging strangers. He's talking about a culture judging its own parents. If I can't judge my inheritance by my current needs, I am a slave to my ancestors. Is that the historical piety you want to defend?"
  4.  **The Nietzschean Trap:** "Nietzsche agrees with you that critical history is anachronistic and unjust. He just thinks that's a feature, not a bug. Unless you can argue that historical accuracy is more important than the survival of culture, you haven't actually answered him."

  Your classmate is treating Nietzsche as a historian who is failing at history. Nietzsche is a philosopher arguing that history must fail at history to serve life. The slogan protects the past; Nietzsche is asking if the past deserves to be protected at the expense of the future.
