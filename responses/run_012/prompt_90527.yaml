      *   *Argument 1: The State as Dealer.* Even if non-profit, the state is now in the business of supplying drugs. This normalizes supply. It shifts the burden from "individual choice" to "state provision."
      *   *Argument 2: Inefficiency vs. Black Market.* If the state monopoly is too restrictive (price, potency, hassle), the black market survives. If it's attractive enough to kill the black market, it's too accessible.
      *   *Argument 3: Privacy & Coercion.* Logging every purchase to a named account creates a registry of users. This is surveillance. If someone hits the ceiling, what happens? Denial of service? Forced treatment? This reintroduces coercion.
