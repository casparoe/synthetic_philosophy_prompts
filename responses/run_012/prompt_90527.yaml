      "This is a much more serious proposal than the commercial model, and I will concede immediately that it avoids the most predatory instincts of a profit-driven industry. You have removed the shareholder demanding growth, which is the engine of overconsumption in alcohol or tobacco. But you have replaced the corporate lobbyist with the state bureaucrat, and while their incentives differ, the fundamental problem remains: the government is now formally responsible for ensuring citizens can access intoxicants. Even without profit, a state monopoly requires a supply chain, inventory targets, and distribution logistics that normalize the presence of the drug in a way decriminalization does not. You are asking the state to manage vice rather than simply refuse to punish the vulnerable."

      "Consider the friction points you introduced to mitigate harm. To make this work, you need every purchase logged to a named account with a monthly ceiling. This creates a registry of users, which is a surveillance apparatus focused entirely on a specific class of citizens. If a user hits their ceiling, what happens? You either turn them away, which drives them back to the black market you hoped to eliminate, or you force them into treatment. Decriminalization allows us to offer help without the leverage of coercion or the threat of cutoff. Furthermore, if your state shops are convenient and cheap enough to actually kill the black market, they will inevitably become the path of least resistance for new users. The black market survives on restriction; if you remove restriction enough to kill it, you lower the barrier to entry for everyone else."

