answer: |-
  **Exam Question**

  **3. "Violence is Declining"**

  Consider the following exchange between two students discussing the thesis that global violence is in long-term decline:

  > **Student A:** "The data is clear. The global homicide rate has fallen by half since 1990. The likelihood of any given person dying violently is lower than ever. Violence is declining."
  >
  > **Student B:** "That rate is misleading. Total bodies may still be rising due to population growth. Moreover, war deaths follow a heavy-tailed distribution where one extreme event skews the mean, and our definitions of violence have expanded to include harms previously ignored. The trend is an artifact of counting."

  You are provided with the following analytical tools:
  1.  **Rate vs. Count:** A falling rate with a rising count means the distribution of risk has changed, not necessarily that total harm has decreased.
  2.  **Heavy-Tail Instability:** Where conflict deaths are heavy-tailed, the mean does not converge; trend estimates depend on whether extreme events fall within the measurement window.
  3.  **Recognition-Expansion Confound:** Measured violence can rise while actual harm falls if the definition of violence widens (e.g., to include domestic or structural violence), since historical baselines counted only what suited institutions.

  Using these three tools, analyze the disagreement between A and B. What must each concede to the other? Is their dispute merely verbal (resolvable by fixing definitions), or does it turn on whether 'violence' is an evaluative concept? Conclude by defending a position on whether the claim "violence is declining" has a determinate truth value.

  ***

  **Model Answer**

  Student A and Student B are not merely disputing empirical data; they are disputing the metric of moral progress. To resolve whether "violence is declining" has a determinate truth value, we must analyze how their chosen metrics shape the reality they claim to observe.

  First, consider the distinction between rate and count. Student A relies on the per-capita rate, which answers the question: "How likely am I to be killed?" Student B focuses on the count, asking: "How much killing is there?" If the population grows while the rate falls, the total mass of suffering may increase even as individual risk decreases. A must concede that a safer world is not necessarily a less bloody one. B must concede that individual security has arguably improved. However, this is not merely a statistical toggle; it is a moral choice. Prioritizing the rate privileges the individual agent's risk; prioritizing the count privileges the aggregate sum of harm. Neither is objectively "correct" without a prior moral commitment to utilitarianism versus contractualism.

  Second, the heavy-tail point undermines the stability of A's trend. In a heavy-tailed distribution of conflict deaths, the sample mean is unstable. A "decline" observed over a peaceful window may vanish if a single large-scale war occurs tomorrow. A's claim relies on the assumption that the future will resemble the recent past, but in power-law distributions, extreme events are defining features, not outliers. B is correct that the trend is fragile. However, B must concede that instability does not prove increase; it proves unpredictability. Thus, the claim "violence is declining" lacks empirical robustness regardless of the metric chosen, because the underlying phenomenon resists linear modeling.

  Third, the recognition-expansion confound challenges the baseline itself. B argues that apparent increases in violence may reflect better recognition of harms (domestic, structural) previously excluded. A assumes the category "violence" is static. But if "violence" is partly evaluative—denoting not just physical force but *illegitimate* harm—then expanding the concept is a moral achievement, not a statistical error. If we now count marital rape as violence whereas our ancestors did not, the measured rate rises, but this reflects moral progress in recognition, not necessarily an increase in physical force. A must concede that historical data is not comparable to modern data without adjustment. B must concede that widening the net makes historical comparison difficult, potentially obscuring physical trends.

  This leads to the core philosophical issue: is the dispute verbal or substantive? If "violence" were a purely descriptive concept like "rainfall," we could settle this by fixing a definition. But violence is an evaluative concept. To label an act "violent" is often to condemn it. Therefore, the question "Is violence declining?" smuggles in a moral judgment about what counts as harm. If we define violence narrowly (battlefield deaths), it may be declining. If we define it broadly (including structural deprivation), it may be rising.

  Consequently, the claim "violence is declining" does not have a determinate truth value independent of moral stipulation. It is not merely that we lack data; it is that the subject matter is constituted by our moral conventions. A treats violence as a natural kind discoverable by statistics; B treats it as a social construct sensitive to recognition. Both are partially right. The dispute is not merely verbal because the choice of definition carries moral weight. To choose the rate is to value individual security; to choose the count is to value total welfare; to expand the definition is to value inclusivity.

  Therefore, there is no fact of the matter about whether violence is declining simpliciter. There are only facts about specific metrics relative to specific moral frameworks. The thesis fails as a descriptive claim because it attempts to bypass the normative work required to define its subject. We cannot measure moral progress without first deciding what matters, and no statistic can make that decision for us.

  ***

  **Marking Scheme**

  **Total: 40 Marks (5 Criteria x 8 Marks)**

  1.  **Rate vs. Count Analysis (8 marks)**
      *   *Must Hit:* Clearly distinguishes individual risk (rate) from aggregate harm (count) and identifies the moral implication of choosing one over the other.
      *   *Typical Error:* Treating this as a purely mathematical correction without noting the moral significance of total harm vs. individual security.

  2.  **Heavy-Tail Instability (8 marks)**
      *   *Must Hit:* Explains why linear trends are unreliable in heavy-tailed distributions and notes that peace windows may be statistical artifacts.
      *   *Typical Error:* Confusing "unpredictable" with "increasing," or failing to explain why the mean does not converge.

  3.  **Recognition-Expansion Confound (8 marks)**
      *   *Must Hit:* Articulates how widening definitions (e.g., domestic violence) alter baselines and distinguishes between increased harm and increased recognition.
      *   *Typical Error:* Assuming expanded definitions automatically invalidate data, rather than changing what is being tracked.

  4.  **Verbal vs. Substantive Dispute (8 marks)**
      *   *Must Hit:* Distinguishes between a disagreement over definitions (verbal) and a disagreement over moral values (substantive).
      *   *Typical Error:* Dismissing the dispute as "just semantics" without acknowledging that definitions carry normative weight.

  5.  **Fact of the Matter Conclusion (8 marks)**
      *   *Must Hit:* Takes a clear position on whether the claim has a determinate truth value (e.g., argues it does not because violence is evaluative) and defends it using the previous tools.
      *   *Typical Error:* Sitting on the fence ("both sides have points") without resolving the metaphysical status of the claim.

  **First-Class Distinction:**
  A solid 2:1 answer will correctly apply the three tools and reach a conclusion. A First-Class answer will integrate the tools to show *why* the metaphysical conclusion follows (e.g., showing how the heavy-tail problem and recognition confound jointly undermine the possibility of a neutral baseline), demonstrating that the statistical tools themselves reveal the normative nature of the concept.
