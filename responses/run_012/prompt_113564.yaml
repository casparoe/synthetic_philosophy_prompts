answer: |-
  Here is a menu of readings for the slogan "you reap what you sow," ordered from the nearly empty (tautological) to the very strong (metaphysically loaded). Each entry includes the precise claim, the ontological and epistemological commitments, and a verdict on its truth value.

  ### 1. The Behavioral Truism
  *   **The Claim:** Actions performed by an agent increase the probability of similar future actions by that agent, which in turn produce predictable downstream consequences within the agent's current lifespan.
  *   **Commitments:**
      *   **Administration:** None. Purely psychological and sociological causality.
      *   **Causal/Normative:** Strictly causal. No claim of desert, only habit formation and consequence.
      *   **Personhood:** Requires a continuous psychological self (memory/habit) within one lifetime.
      *   **Falsifiability:** Highly falsifiable. If a kind person becomes bitter and suffers without cause, or a cruel person thrives without consequence, the claim is weakened.
      *   **Intention/Act:** Focuses on the act reinforcing the habit, regardless of intention.
  *   **Verdict:** **Trivially True.** It is a description of habit loops and social feedback. It lacks the metaphysical weight to explain "unjust" suffering.

  ### 2. The Social Reciprocity Model
  *   **The Claim:** The social environment responds to an agent's behavior with reciprocal treatment; benevolence tends to elicit support, while malice tends to elicit isolation, affecting the agent's well-being.
  *   **Commitments:**
      *   **Administration:** None. Decentralized social enforcement.
      *   **Causal/Normative:** Causal, but carries a normative shadow (reputation).
      *   **Personhood:** Requires the agent to be identifiable by a community over time.
      *   **Falsifiability:** Falsifiable. Privilege, luck, or systemic power can allow a "sower" of bad seeds to reap a harvest of wealth and safety.
      *   **Intention/Act:** Focuses on the outward act and its reception by others.
  *   **Verdict:** **Substantive and Defensible.** It explains much of social life but fails to account for natural disasters, illness, or isolated suffering (like your acquaintance's diagnosis).

  ### 3. The Wellness/Manifestation Reading
  *   **The Claim:** An agent's internal state (beliefs, attitudes, vibration) causally shapes their external circumstances, often through unconscious behavioral cues or "quantum" resonance.
  *   **Commitments:**
      *   **Administration:** None, or a vague "Universe" that responds to frequency.
      *   **Causal/Normative:** Causal, but implies normative responsibility for one's reality.
      *   **Personhood:** The "self" is a creator of reality.
      *   **Falsifiability:** Low. Failures are often explained away as "subconscious blocks" or "wrong timing," rendering it unfalsifiable.
      *   **Intention/Act:** Heavily intention/belief focused.
  *   **Verdict:** **False (as physics), Substantive (as psychology).** It conflates correlation with causation. It is the "popular reading" you mentioned; it offers agency but risks victim-blaming.

  ### 4. The Impersonal Cosmic Law (Dharmic Naturalism)
  *   **The Claim:** Moral causality is a fundamental law of the universe, analogous to gravity, where ethical quality (*kusala/akusala*) inevitably produces corresponding experiential results (*vipaka*), potentially across multiple lifetimes.
  *   **Commitments:**
      *   **Administration:** Lawful, not administered. No judge, no ledger, just metaphysical mechanics.
      *   **Causal/Normative:** Causal mechanism producing normative outcomes (desert).
      *   **Personhood:** **Crucial Axis.** Requires a "stream of consciousness" (*santana*) rather than a fixed self. If the sufferer is not the sower, desert is incoherent. The "better move" is the **stream of experience**. It preserves moral continuity without requiring a static soul, avoiding the incoherence of punishing Person B for Person A's acts, provided psychological continuity (memory/karma) links them.
      *   **Falsifiability:** Unfalsifiable in the short term. Any counterexample (good suffering) is explained by past-life debt; any anomaly (bad thriving) is explained by past-life credit.
      *   **Intention/Act:** **Crucial Axis.** Buddhist accounts prioritize intention (*cetana*). The tension with the agricultural metaphor is **real**. Seeds are physical; karma is mental. The metaphor breaks down because a physical seed grows regardless of the planter's mood, but a karmic seed depends entirely on the volition behind the act.
  *   **Verdict:** **Substantive and Defensible (internally), Unprovable (empirically).** It is a coherent metaphysical system but lacks empirical traction.

  ### 5. The Administered Justice (Theodicy)
  *   **The Claim:** A conscious agent (God, Universe, Fate) monitors moral conduct and actively distributes suffering and prosperity as reward or punishment within the current lifespan.
  *   **Commitments:**
      *   **Administration:** Administered. Requires a scorekeeper.
      *   **Causal/Normative:** Strongly normative. Suffering *is* punishment.
      *   **Personhood:** Requires a fixed self accountable to the judge.
      *   **Falsifiability:** Unfalsifiable. The "judge's" timeline is mysterious ("His ways are not our ways").
      *   **Intention/Act:** Often focuses on outward compliance or sin, though some versions weigh intent.
  *   **Verdict:** **False.** Empirical observation of innocent suffering (children, animals) contradicts a just administrator operating within a single lifespan.

  ### 6. The Ritual Efficacy Model (Vedic Precursor)
  *   **The Claim:** Correctly performed actions (rituals/sacrifices) mechanically produce specific results, independent of moral character. *Karma* originally meant "ritual action," not "moral law."
  *   **Commitments:**
      *   **Administration:** Lawful (magical mechanics).
      *   **Causal/Normative:** Causal. Non-moral. A ritual done correctly yields rain, regardless of whether the priest is a saint.
      *   **Personhood:** The ritualist acts as a functionary.
      *   **Falsifiability:** Unfalsifiable within the system (failure means the ritual was flawed, not the law).
      *   **Intention/Act:** Strictly Act focused (precision of performance).
  *   **Verdict:** **False (as cosmology), Historically Accurate (as etymology).** Your half-remembered claim is **right**. In the Rig Veda, *karma* was ritual. The moralization of karma (that *ethical* acts cause future states) is a later Upanishadic innovation. This reading removes "desert" entirely; it is about efficacy, not justice.

  ***

  ### Analysis of Your Dinner Table

  **Which reading did your friend mean?**
  Your friend most likely meant **Reading 4 (The Impersonal Cosmic Law)**. By clarifying that the acquaintance did not "deserve" it in a punitive sense, she removed the "Administered Justice" element (Reading 5). She was attempting to offer a framework where chaos has order without assigning blame. She was using the "stream of experience" model to soften the blow: *This is happening, it has a cause, but it is not a punishment.*

  **Which reading did your uncle mean?**
  Your uncle meant **Reading 5 (The Administered Justice)**. His usage was explicitly normative and retributive ("caught up with him," "had it coming"). He was using the slogan to enforce a social boundary and justify withholding aid. For him, the suffering *is* the proof of the sin.

  **Can a single reading do both the consoling and condemning work?**
  **Reading 4 (Impersonal Cosmic Law)** is the only candidate, but it struggles. It consoles by removing the "angry judge," suggesting the suffering is just a balancing of energy. It condemns by implying the sufferer is still responsible for the imbalance. However, it rarely satisfies the uncle's desire for moral outrage or the friend's desire for pure compassion. **Reading 5** does both easily but at the cost of truth (it is cruel).

  **Which reading justifies your uncle's refusal to help?**
  Only **Reading 5 (Administered Justice)** or a corrupted version of **Reading 4**. To be entitled to decline help based on *karma*, one must believe the suffering is a *necessary correction* that intervention would disrupt. If the universe is merely lawful (Reading 4), helping is just another causal input (a good seed). If the universe is a judge (Reading 5), helping is interfering with a sentence. Your uncle needs Reading 5 to be true to be morally secure in his refusal.

  **Where does the "Wellness Podcast" reading fit?**
  That is **Reading 3**. It sounds like justice ("you created this") but is actually psychology ("your mindset created this"). It shifts the locus from *moral worth* to *mental hygiene*. It is dangerous because it turns tragedy into a failure of visualization or belief, which is a subtler form of the uncle's blame.

  **The Historical Claim**
  Your memory is correct. *Karma* (from the Sanskrit root *kr*, to do) in the early Vedic period referred specifically to ritual action—the sacrifice itself. The result (*phala*) was guaranteed by the correctness of the rite, not the morality of the priest. The shift to "moral cause and effect" occurred during the Axial Age (Upanishads/Buddhism) when ritualism was questioned. This matters because the **Ritual Model (Reading 6)** implies the universe is mechanical, not moral. If karma is ritual, your cousin's drinking is a botched ritual, not a sin.

  ***

  ### Recommendation for the Next Argument

  If you want the argument to be about something real rather than incompatible intuitions, you must insist you are discussing **Reading 2 (The Social Reciprocity Model)** or **Reading 1 (The Behavioral Truism)**.

  **Why:** These are the only readings that share a reality with both you and your friend. They allow for "cause and effect" without requiring metaphysical commitments (reincarnation, cosmic judges) that cannot be tested.

  **What counts as evidence:**
  *   **For:** Data showing that pro-social behavior correlates with long-term support networks; data showing addiction correlates with health/financial decline.
  *   **Against:** Documented cases of lifelong altruists suffering random tragedy (cancer, accidents) without prior "bad seeds"; documented cases of sociopaths thriving without consequence.

  **The Strategy:**
  Tell your friend: *"If karma is a law like gravity, it should be observable. If we have to invoke past lives to explain why good people suffer, the theory is unfalsifiable. Let's agree that 'reaping what you sow' describes social and psychological habits (Reading 1 & 2), not cosmic justice. If we mean the latter, we are talking about faith, not causality."*

  This forces the conversation out of the "wellness" vagueness and into whether the claim is a description of how the world *is* (empirical) or how they *wish* it to be (normative).
