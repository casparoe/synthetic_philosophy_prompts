          *   Infinite Regress/Contradiction: If we pay one, we must pay all contradictory threats, leading to paralysis or guaranteed loss.
          *   Credibility: An SI that tortures copies for no causal gain is irrational/unpredictable, making the threat non-credible.
      *   *What makes Devin right?*
