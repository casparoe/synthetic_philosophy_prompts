      *   **Character T (Tranquilist):** Needs to distinguish tranquilism from negative hedonism. Needs to handle the "coma" objection carefully (maybe appeal to the *capacity* for craving vs. actual craving, or the distinction between existing and non-existing subjects). Needs to address the "craving for tranquility" paradox (maybe distinguish between *tanha* [thirst] and *chanda* [intention]). Needs to argue that craving *is* a form of subtle suffering (unease).
      *   **Character H (Hedonist):** Needs to argue that pleasure is *positively* valuable, not just relief. Needs to press the "coma" case hard. Needs to highlight pleasant anticipation as a counter-example to "craving = suffering." Needs to point out that tranquilism might demand too much passivity.
      *   **Structure:**
