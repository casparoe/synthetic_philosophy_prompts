      *   **Characters:**
          *   *Tranquilist (T):* Committed to tranquilism (absence of craving + absence of suffering = well-being). Sharp, not just spouting Buddhism.
          *   *Hedonist (H):* Committed to hedonism (presence of pleasure is intrinsically good, not just absence of pain). Sharp, not a strawman.
      *   **Specific Arguments to Include (H pressing T):**
          1.  The "Dreamless Coma/Sedation" objection (If absence is all that matters, why isn't non-existence/sedation best?).
          2.  The "Self-Undermining" objection (Pursuing cravinglessness is itself a craving).
          3.  The "Distinctness" objection (Is absence of craving distinct from absence of suffering? What about pleasant anticipation?).
      *   **T's Pushback:** T must challenge H on standard hedonist weak spots (messy intense pleasure, pleasures one regrets).
      *   **Tone/Style:** Analytic philosophy style (careful, precise), but conversational (tired, hungry, interrupting, conceding). 6-10 exchanges. No scenery doing philosophical work.
      *   **Pre-writing:** Brainstorm character arguments and the crux of the disagreement.

  2.  **Brainstorming & Planning:**
