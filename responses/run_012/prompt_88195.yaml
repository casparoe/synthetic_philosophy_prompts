prompt: |-
  My mate and I burned about four hours last night arguing about Sidgwick's psychical research, and I need to get my act together before we pick it up again on Thursday. His line: Sidgwick was a great ethicist who happened to have a crankish side-hobby, the Society for Psychical Research stuff has nothing to do with the Methods of Ethics, different project, different audience, probably just a Victorian emminent-person's way of not facing up to his own religious collapse. My line: it's all one thing. Sidgwick's whole problem at the end of the Methods is that practical reason comes apart — egoism tells you one thing, universal benevolence another, both seem to survive his own tests, and he can't find a purely ethical way to choose between them. The only thing that would really heal that split is a fact about how the world is put together: that duty and happiness converge in the long run, that the universe is governed in some sense, so that being good isn't finally a sucker's bet. And that's exactly the kind of thing he was after with the psychical research — survival of bodily death, some evidence of an order that carries on past the grave. He was a founder and the first president of the SPR, so this wasn't a weekend hobby.

  I don't want you to just adjudicate the arguement, I want the specification, so I can win on the merits. Write me the desiderata: what would a body of evidence from psychical research have to establish, and what would the evidence itself have to be like, for it to actually do the work Sidgwick wanted — to close the dualism of practical reason rather than just adding one more spooky fact to the pile. Give me the requirements list with the consideration behind each, say which ones are non-negotiable and which are just preferences of a particular camp (fraud-proof observation, repeatability, the whole super-ESP / subliminal-self escape hatch, the gap between evidence for survival and evidence for a morally ordered universe, whether a statistical result about mediums could bear on a philosophical thesis at all, and whatever else you think belongs). Flag any pair of requirements you think can't be met together — if the spec turns out unsatisfiable, that's the most interesting result and I want it said out loud, and I want to know which single requirement does the most work, i.e. which one kills off the most of the plausible approaches.

  Skip the reading list, I'm not citing anything at a kitchen table.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a 4-hour argument with a friend about Henry Sidgwick's involvement in psychical research (SPR) and its relation to his ethical theory (*The Methods of Ethics*).
      *   **The Debate:**
          *   *Friend's View:* Sidgwick's ethics and psychical research are separate. Ethics = rigorous philosophy; Psychical Research = Victorian crankery/religious coping.
          *   *User's View:* They are integrated. The "Dualism of Practical Reason" (Egoism vs. Universal Benevolence) in *Methods* creates a philosophical crisis. Psychical research (survival of death, moral order) is the *empirical* solution needed to bridge that gap.
      *   **The Task:** Do *not* adjudicate who is right. Instead, provide the *specification/desiderata*. What would the evidence from psychical research actually need to look like to do the philosophical work Sidgwick needed it to do?
      *   **Specific Requirements:**
          *   List requirements with considerations behind each.
          *   Flag non-negotiable vs. preference.
          *   Identify incompatible requirements (unsatisfiable specs).
          *   Identify the "killer" requirement (the one that kills off the most approaches).
          *   No reading lists (kitchen table argument context).
      *   **Tone:** Philosophical, rigorous, sharp, ready for debate.

  2.  **Deconstruct Sidgwick's Problem (The "Why"):**
      *   Sidgwick's *Dualism of Practical Reason*: Rational Egoism (maximize my good) and Rational Utilitarianism (maximize universal good) are both self-evident but often conflict.
      *   Without a convergence, morality is irrational (why be moral if it hurts me?).
      *   Sidgwick hoped for empirical evidence that the universe is morally ordered (God/Survival/Karma) so that Duty and Self-Interest coincide *in the long run*.
      *   *Goal of Psychical Research:* Provide empirical proof of this moral order (specifically via survival of death and potential divine governance).

  3.  **Drafting the Desiderata (The "What"):**
      *   To solve the Dualism, the evidence can't just be "ghosts exist." It needs to be "ghosts exist *and* they confirm a moral structure."
      *   *Requirement 1: Metaphysical Relevance.* It's not enough to prove telepathy. It must prove *survival* and *moral governance*.
      *   *Requirement 2: Epistemic Certainty.* Sidgwick was an empiricist/foundationalist. The evidence needs to be as certain as mathematical intuition or sensory data. Anecdotes won't cut it.
      *   *Requirement 3: Universality.* It can't be a private revelation. It must be publicly verifiable to count as "knowledge" for ethics.
      *   *Requirement 4: The Moral Link.* Evidence of survival $\neq$ Evidence of Justice. You could survive in a hellish or indifferent universe. The evidence must show *reward/punishment* or *convergence*.

  4.  **Analyzing Constraints & Conflicts (The "Catch"):**
      *   *Fraud-proof vs. Repeatability:* Psychical phenomena are notoriously elusive. High control kills the phenomenon; low control invites fraud.
      *   *Empirical vs. Normative:* Hume's Guillotine. Even if you prove survival, does that *obligate* me to be moral? (Is/ought problem). Sidgwick thought it did (prudential reason), but it's shaky.
      *   *Specific vs. General:* Mediumship is specific. Ethical theory requires general laws.
      *   *The "Super-ESP" problem:* If you explain away survival via telepathy among the living, you lose the "future state" needed for the convergence of duty and happiness.

  5.  **Refining the List (Iterative Process):**
      *   *Drafting Req 1 (Survival):* Must prove personal identity persists. *Consideration:* Without this, no long-run convergence.
      *   *Drafting Req 2 (Moral Order):* Must prove the afterlife is morally structured. *Consideration:* A neutral afterlife doesn't solve Egoism vs. Duty.
      *   *Drafting Req 3 (Public Verification):* Must be scientific, not faith-based. *Consideration:* Sidgwick wanted to save rationality, not replace it with religion.
      *   *Drafting Req 4 (Motivational Force):* Must be strong enough to override immediate self-interest. *Consideration:* A 51% probability isn't enough to risk your life for duty.

  6.  **Identifying the "Killer" Constraint:**
      *   What kills the project? It's the gap between *Fact* and *Norm*. Even if you prove survival, does it solve the Dualism?
      *   Actually, a stronger killer is the **Epistemic/Methodological Conflict**. To solve a *rational* crisis, you need *rational certainty*. Psychical research yields, at best, probabilistic evidence.
      *   *Wait, the prompt asks for the requirement that kills off plausible approaches.*
      *   The "Moral Link" requirement is hard. But the "Epistemic Status" requirement is harder. Sidgwick needed the evidence to be as binding as logic. Psychical evidence is inherently inductive and shaky.
      *   *Better Killer:* The **Convergence Requirement**. Proving survival doesn't prove that *virtue* leads to *happiness*. You could survive and be miserable. You could survive and be wickedly happy. To solve the Dualism, the evidence must show a *necessary connection* between Morality and Prudence in the afterlife. This is almost impossible to establish empirically.

  7.  **Structuring the Response:**
      *   **Intro:** Acknowledge the stakes (The Dualism of Practical Reason). Validate the user's intuition (it's not just a hobby) but sharpen the criteria.
      *   **The Specification (Desiderata):** Numbered list. Each with "The Requirement," "The Consideration," and "Status (Non-negotiable/Preference)."
      *   **The Incompatibilities:** Where the spec breaks.
      *   **The Killer Requirement:** The single point of failure.
      *   **Conclusion:** How to use this in the argument.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't validate the friend's "crank" view too much, but acknowledge why the evidence usually fails.
      *   *Nuance:* Sidgwick wasn't looking for "spooky facts." He was looking for "theological data" via scientific method.
      *   *Key Distinction:* Evidence for *Survival* vs. Evidence for *Retribution*. This is crucial. Many SPR members conflated them. Sidgwick needed the latter.
      *   *The "Super-ESP" critique:* If a medium knows info via telepathy from the living, it doesn't prove survival. This undermines the "long run" convergence.
      *   *The Humean Gap:* Even if the universe is morally ordered, does that make Egoism irrational? Yes, if "Self-Interest" includes the afterlife. So the evidence must expand the definition of Self-Interest.

  9.  **Final Polish:** Check tone. Needs to be punchy, analytical, "kitchen table ready." No academic fluff. Ensure the "Killer Requirement" is clearly identified. (Decided: The "Moral Convergence" requirement is the hardest to meet empirically).

  10. **Final Review against constraints:**
      *   No reading list? Check.
      *   Desiderata list? Check.
      *   Non-negotiable vs. Preference? Check.
      *   Incompatible pairs? Check.
      *   Killer requirement identified? Check.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the specification. This is the blueprint for what Sidgwick actually needed. If you bring this to the table, you move the argument from "Was Sidgwick a weirdo?" to "Was the project structurally viable?"

  Your friend thinks the *Methods* and the SPR are separate silos. You argue they are integrated. To win, you don't need to prove Sidgwick was *right* about ghosts; you need to prove that the *type of evidence* he sought was the only thing capable of solving the philosophical crisis he identified.

  Here are the desiderata for Psychical Research evidence to successfully close the Dualism of Practical Reason.

  ### The Desiderata

  **1. The Survival of Personal Identity (Non-Negotiable)**
  *   **The Requirement:** Evidence must establish that *you* specifically persist after biological death, retaining memory and agency. It cannot merely be a "cosmic consciousness" or a dissipation of energy.
  *   **The Consideration:** The Dualism of Practical Reason is a conflict between *my* good (Egoism) and *the* good (Utilitarianism). For these to converge, *I* must be around in the future to receive the payoff of my current sacrifice. If "I" dissolve into the universal mind, Egoism is still defeated, not reconciled.
  *   **Status:** **Non-Negotiable.** Without this, the "long run" doesn't include *you*, so prudence doesn't align with duty.

  **2. The Moral Structure of the Afterlife (Non-Negotiable)**
  *   **The Requirement:** Evidence must show that the post-mortem state is governed by a moral law where well-being is correlated with virtue (or at least, where vice is penalized).
  *   **The Consideration:** Proving survival is useless if the afterlife is morally neutral. If a tyrant and a saint both survive and are equally happy, the Dualism remains. The evidence must demonstrate *retributive justice* or *karmic convergence* as a law of nature, not a hope.
  *   **Status:** **Non-Negotiable.** Survival without justice does not solve the "sucker's bet" problem of ethics.

  **3. Public Verifiability / Scientific Certainty (Non-Negotiable)**
  *   **The Requirement:** The evidence must be reproducible and fraud-proof enough to command the assent of a rational skeptic, not just a believer. It must meet the epistemic standard of the natural sciences.
  *   **The Consideration:** Sidgwick was trying to save Rational Ethics. If the solution relies on faith, revelation, or ambiguous mediumistic trances, it cannot bind a rational agent. If the evidence is probabilistic (e.g., "60% likely"), it cannot override the immediate certainty of self-interest.
  *   **Status:** **Non-Negotiable.** Sidgwick needed *knowledge*, not *opinion*, to ground the rationality of morality.

  **4. The Motivational Threshold (Preference/Pragmatic)**
  *   **The Requirement:** The probability and magnitude of the future reward/punishment must be high enough to outweigh immediate, certain sacrifices in *this* life.
  *   **The Consideration:** Even if there is a 51% chance of heaven, a rational egoist might still bet on the here-and-now. The evidence needs to establish a near-certainty of infinite or massive utility to override finite, certain earthly costs.
  *   **Status:** **Preference.** Technically, any convergence solves the logical dualism, but practically, Sidgwick needed a convergence strong enough to motivate action.

  **5. Exclusion of "Super-ESP" (Non-Negotiable)**
  *   **The Requirement:** The evidence must rule out the explanation that the medium is reading the minds of the living (telepathy) rather than contacting the dead.
  *   **The Consideration:** This is the "subliminal self" escape hatch. If a medium knows secret information, it could be via telepathy from a living person who knows it. This destroys Requirement #1 (Survival). If there is no survival, there is no future convergence of duty and happiness.
  *   **Status:** **Non-Negotiable.** This is the primary methodological failure point of the SPR.

  ### The Incompatibilities (Where the Spec Breaks)

  Here is where you can corner your friend. The specification contains internal tensions that suggest the project was doomed from the start, not because Sidgwick was cranky, but because the task was impossible.

  **Conflict A: Scientific Certainty vs. Phenomenal Elusiveness**
  *   **The Tension:** Requirement #3 (Public Verifiability) conflicts with the nature of the phenomena Sidgwick investigated. Psychical phenomena (telepathy, apparitions) are historically sporadic, subjective, and degrade under strict observation controls.
  *   **The Result:** To get "Fraud-Proof" data, you need tight controls. Tight controls kill the phenomenon. To get the phenomenon, you need loose controls. Loose controls invite fraud. You cannot satisfy the epistemic standards of the *Methods* with the data available to the SPR.

  **Conflict B: Empirical Fact vs. Normative Force**
  *   **The Tension:** Requirement #2 (Moral Structure) asks for an empirical fact (how the universe *is*) to solve a normative problem (how I *ought* to act).
  *   **The Result:** Even if you prove a morally ordered afterlife exists, a hard-headed Egoist could argue, "I still prefer to be wicked in this life and take my chances on penance in the next." Empirical facts about the universe do not necessarily dictate rational preferences, unless you assume rationality *requires* maximizing long-term utility (which Sidgwick did, but it's a vulnerable assumption).

  ### The Killer Requirement

  If you only take one thing to the table, take this.

  **The Killer: Requirement #2 (The Moral Structure of the Afterlife)**

  This is the requirement that kills off the most plausible approaches.
  *   **Why:** The SPR accumulated a decent amount of data suggesting *anomalous cognition* (telepathy/clairvoyance) and some data suggesting *survival* (mediumship).
  *   **The Failure:** They accumulated **zero** credible data suggesting *Moral Governance*.
  *   **The Logic:** You can prove a ghost exists (Survival). You cannot prove the ghost is *happy because it was good*. Mediums report messages from the dead, but those messages are banal ("I am fine," "Tell mother I love her"). They do not contain verifiable data about the moral mechanics of the afterlife (e.g., "I am suffering because I lied in 1884").
  *   **The Knockout:** Without evidence of *retribution* or *moral convergence*, the Dualism remains. Sidgwick needed proof that the universe is a Moral Cosmos. The SPR only ever offered proof that the universe is a Spooky One. A spooky universe does not make Egoism irrational.

  ### How to Deploy This Thursday

  1.  **Concede the "Crank" Point:** Admit that the SPR produced garbage data by modern standards. Don't defend the mediums.
  2.  **Pivot to the Philosophy:** Argue that your friend misunderstands *why* Sidgwick founded the SPR. It wasn't a hobby; it was a desperate search for **Premise X**.
  3.  **The Trap:** Ask your friend: *"If Sidgwick was right that Reason splits between Egoism and Utilitarianism, what empirical fact could possibly heal it?"*
      *   They will say "None, it's philosophy."
      *   You say: "Only a fact that proves Self-Interest and Duty coincide in the long run. That requires Survival + Justice."
      *   You conclude: "Sidgwick didn't need ghosts. He needed a scientifically verified system of divine justice. The SPR was the attempt to find it. It failed, but the *attempt* was philosophically necessary given his ethical system."

  **The Win Condition:** You win by showing that Sidgwick's psychical research wasn't a departure from his ethics, but the *only possible empirical completion* of them. The tragedy isn't that he had a hobby; it's that the evidence required to save Rational Ethics didn't exist.
