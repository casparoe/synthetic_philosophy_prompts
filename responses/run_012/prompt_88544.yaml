  1. **The Case**
  Alex is a 28-year-old graphic designer born with mild congenital sensorineural hearing loss (45 dB threshold), placing auditory function below the species-typical range of 0–25 dB. Although Alex communicates effectively using lip-reading and environmental adaptation, the condition causes fatigue during extended team meetings and limits participation in social gatherings without assistive technology. Alex seeks prescription digital hearing aids to normalize hearing sensitivity; however, most private insurers classify adult hearing aids as elective devices not medically necessary for congenital conditions, and Alex could decline the intervention without risking employment or basic safety, relying instead on existing coping strategies.

  2. **Verdicts and Reasoning**
  *   **C1 (Species-Deficit): Therapy.** Alex's auditory functioning (45 dB) is below the species-typical range (0–25 dB), and the intervention moves functioning into the typical range.
  *   **C2 (Life-Plan): Therapy.** The intervention prevents a significant and lasting loss of welfare (social isolation, professional fatigue) and protects the ability to pursue a reasonable range of life plans (collaborative work, social engagement).
  *   **C3 (Baseline): Enhancement.** The intervention confers a capacity (normal hearing) the recipient has never previously possessed, as the condition is congenital and Alex has never functioned within the typical range.

  3. **Institutional Rule and Opposed Decisions**
  *   **Rule:** A private health insurance policy clause stating, "Coverage is provided for interventions classified as therapy to restore health; exclusions apply to enhancements or elective devices."
  *   **Opposed Decisions:** Under C1 and C2, the insurer ought to **cover** the hearing aids because they treat a species-deficit and protect welfare (Therapy). Under C3, the insurer ought to **deny** coverage because the intervention confers a never-before-held capacity (Enhancement). The ordinary verdict aligns with C3 (deny/elective), despite C1 and C2 classifying it as therapy.

  4. **Feature Doing the Work and Removal Test**
  *   **Feature:** The **congenital nature** of the condition (specifically, the lack of previous possession of typical functioning).
  *   **Removal Test:** Vary the case so Alex's hearing loss is **acquired** later in life (e.g., noise-induced) after years of typical hearing, holding severity and impact fixed.
  *   **Result:** C1 and C2 remain Therapy. C3 changes to **Therapy** (restores previous functioning). The three-way split collapses into unanimous Therapy. Consequently, the ordinary verdict typically shifts to "medically necessary/covered," indicating the split depended entirely on the baseline history.

  5. **What the Ordinary Verdict Tracks**
  *   **Tracking:** The ordinary verdict of "elective" tracks **C3 (Baseline/Entitlement)** rather than C1 (Species Norm) or C2 (Welfare Need). Society treats the restoration of a lost good as obligatory but the provision of a new good as optional, even if the welfare need is identical.
  *   **Demonstration:** In the variation above (acquired loss), the welfare need (C2) and species deficit (C1) remain unchanged, yet the ordinary verdict shifts from elective to necessary. This proves the ordinary verdict is not tracking the magnitude of welfare loss or the deviation from species norms, but rather the history of possession (entitlement).

  6. **Strongest Defence and Evaluation**
  *   **Defence:** A defender might argue that C3 is not a metaphysical classification of the intervention but a **criterion of entitlement**; therapy is what we owe each other (restoration), while enhancement is what we do not owe (new capacities). Thus, the distinction tracks moral obligation, not biological function.
  *   **Evaluation:** This defence rescues the distinction's normative utility but **relocates its arbitrariness**. It admits that two interventions with identical effects on welfare and species-typicality are classified differently based solely on historical luck (congenital vs. acquired). The distinction no longer tracks "what the intervention is" but "what the person deserves," making the therapy/enhancement label a proxy for entitlement rather than a grounded medical or ethical category.
