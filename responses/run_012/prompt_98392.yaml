  6.  **Refining the Design (Self-Correction during drafting):**
      *   *Critique:* If I make the rules too overt ("Juniors need tokens"), they will see the bias immediately. It needs to be subtler.
      *   *Fix:* Make the token system about "Verification." Anyone can speak, but only "Verified" claims count toward the solution. Verification requires a Senior signature. This mimics the "burden of proof" lying on the marginalized speaker.
      *   *Critique:* Idea 4 (Nuance) is tricky. If I give them stats, they will just do the math.
      *   *Fix:* The stats should be hidden. The *rule* is "Trust Seniority." The reveal is that some Seniors were guessing. Or better: The debrief handles Idea 4 mostly, because simulating "justified discounting" in a 90-min game without making it feel like "gotcha" is hard. I will note this limitation.
      *   *Actually, let's try to embed Idea 4:* Give everyone a "Track Record" card. Some Juniors have high track records, some Seniors have low. But the *Rule* is "Seniority overrides Track Record." This creates the conflict between the rule (heuristic) and the particular data.
      *   *Wait, simpler:* The rule is "To finalize a cause, 3 Senior votes are needed." This structurally discounts Junior input regardless of content. Idea 4 comes out in the debrief when discussing *why* we have such rules (efficiency vs. justice).
      *   *Better for Idea 4:* Include one "Known Unreliable Senior" card and one "Highly Reliable Junior" card in the mix. If the group ignores the Reliable Junior because of the Role Rule, they experience the loss of particularity.

      *   *Safety Check:* If a real Junior Engineer gets the "Junior" card and feels silenced, that's bad.
      *   *Mitigation:* Roles are fictional titles (Alpha, Beta, Gamma) not job titles. Or explicitly state "These roles are random and unrelated to your actual job." Let's use fictional titles to decouple from reality. "Tier 1, Tier 2, Tier 3" responders.

      *   *Idea 3 (Silence):* How to ensure they experience the *anticipation*? If I just silence them, they feel frustrated. I need them to *choose* silence.
      *   *Mechanic:* "Speaking Budget." Each person has 3 minutes of airtime. If you speak and your claim is *rejected* (not verified), you lose 2 minutes. If accepted, you lose 1 minute. This makes risky speech costly. Rational actors will stay silent if they expect rejection.

  7.  **Finalizing the Plan:**
      *   **Activity Name:** The Black Box Incident.
      *   **Roles:** Alpha (High Authority), Beta (Medium), Gamma (Low). Randomly assigned.
      *   **Info:** Distributed unevenly. Gamma holds the key clue but described in "non-standard" language.
