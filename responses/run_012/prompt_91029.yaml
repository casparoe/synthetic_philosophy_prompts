answer: |-
  Here is the procedure. It is designed for a bilingual edition where the reader can see the lie if you tell one, and where the editor will count your beats. It replaces your friend's static "buckets" with a dynamic triage system. Constraints are not independent; they are a load-bearing structure. If you remove one, you must shore up the others.

  ### The Procedure: Stanza-Level Triage

  Run this sequence for every stanza. Do not move to the next stanza until the current one is locked.

  **Step 1: The Meter Lock (Hard Constraint)**
  *   **Action:** Draft the line to match the target meter (e.g., iambic pentameter, alexandrine equivalent).
  *   **Question:** Does it scan without forcing the stress onto weak syllables?
  *   **The "Kidding Yourself" Test:** Read it aloud while tapping your foot. If you have to speed up or slur a syllable to make it fit, it fails.
  *   **Rule:** In a bilingual edition with an editor checking scansion, meter is the container. If the container breaks, the liquid spills. **Do not sacrifice meter for a specific word choice.** If the word doesn't fit, the word goes.
  *   **Stop Condition:** If you cannot make it scan without changing the fundamental subject of the line, stop. You are translating the wrong poem. (Unlikely, but possible).

  **Step 2: The Pivot Check (The Returning End-Word)**
  *   **Action:** Identify the French end-word that returns with a shifted sense (e.g., *porte* as "door" then "carry").
  *   **Question:** Is there an English equivalent that sustains at least two distinct meanings relevant to the stanzas involved?
  *   **Decision Tree:**
      *   **Yes:** Use it. Lock it in.
      *   **No:** Do **not** force a polysemy that doesn't exist (e.g., using "bear" for "carry" and "animal" if the context doesn't support the animal).
      *   **The Sacrifice:** If no English word works, you must **break the visual repetition.** Use a synonym for the second occurrence that rhymes with the first, or keep the word but accept that the semantic shift is lost.
      *   **Why:** A fake pivot is a riddle with no answer. The reader sees the French *porte/porte* and sees your *door/door*. If the second *door* makes no sense, you look incompetent, not creative.

  **Step 3: The Semantic Lie Detector**
  *   **Action:** Compare your English line to the French source.
  *   **Question:** Have I added an image, emotion, or causality that is not in the source?
  *   **The "Forgery" Threshold:**
      *   **Permissible:** Shifting connotation (e.g., *triste* to "blue" instead of "sad").
      *   **Impermissible:** Adding concrete nouns or actions (e.g., changing "she wept" to "she prayed" to get a rhyme).
  *   **Rule:** If the only way to make the rhyme work is to change the action, **kill the rhyme.** (See Step 4).

  **Step 4: The Rhyme Negotiation**
  *   **Action:** Check the rhyme scheme.
  *   **Question:** Does the perfect rhyme demand a semantic lie (Step 3)?
  *   **Decision:**
      *   If **Yes:** Downgrade to slant rhyme (assonance/consonance).
      *   If **No:** Keep perfect rhyme.
  *   **Why:** In a facing-page edition, a semantic lie is visible treason. A slant rhyme is an aesthetic choice. The reader can verify the meaning against the French; they cannot verify the "perfectness" of the rhyme as easily as the truth of the statement.

  **Step 5: Compensation Ledger**
  *   **Action:** Tally what was lost in Steps 2–4.
  *   **Operation:** Compensation is not a vibe; it is an exchange rate.
      *   **Lost Rhyme:** Pay with Internal Alliteration or Assonance elsewhere in the line.
      *   **Lost Polysemy:** Pay with heightened syntactic ambiguity elsewhere.
      *   **Lost Imagery:** Pay with increased rhythmic vigor or verb strength.
  *   **Rule:** Compensation must happen **within the same stanza.** Do not promise to "make it up later." The reader reads stanza by stanza.

  **Step 6: The Veto (Values Call)**
  *   **Action:** Review the stanza as a whole.
  *   **Question:** Does this stanza function as a poem in English, independent of the French?
  *   **Decision:** If the stanza is technically perfect (meter, rhyme, pivot) but reads like a puzzle solution rather than speech, **rewrite.**
  *   **Why:** A poem that doesn't breathe is dead, even if it's accurate. This is where your taste overrides the algorithm.

  ---

  ### Why Your Friend's "Buckets" Fail
  Your friend wants to sort constraints into *Constitutive, Ornamental, Accidental*. This is dangerous because constraints are relational.
  *   **Example:** Rhyme might seem "ornamental" until you realize the rhyme words are the only things holding the argument together.
  *   **My Procedure:** Instead of categorizing the constraint, categorize the **cost of keeping it.**
      *   **High Cost:** Requires semantic forgery. (Sacrifice first).
      *   **Medium Cost:** Requires syntactic inversion or slant rhyme. (Acceptable).
      *   **Low Cost:** Requires synonym swap. (Mandatory).

  ---

  ### Case Studies: Watching the Procedure Work

  Here are three scenarios you will likely encounter this week.

  #### Case 1: The Impossible Pivot (The "Rime Équivoque")
  **The Situation:** The French poem ends three stanzas with *temps* (time/weather).
  1.  *Il perd son temps* (He wastes his time).
  2.  *Le mauvais temps* (The bad weather).
  3.  *En tout temps* (At all times).
  **The Problem:** English "time" works for 1 and 3. It does not work for 2 ("The bad time" is not "The bad weather").
  **Your Friend's Approach:** Force "time." Write "The bad time" and hope the reader gets the weather metaphor. (This is a lie).
  **The Procedure:**
  1.  **Meter Lock:** "Time" fits the meter.
  2.  **Pivot Check:** "Time" fails the semantic test for stanza 2.
  3.  **Decision:** **Break the repetition.**
      *   Stanza 1: ends with *time*.
      *   Stanza 2: ends with *rain* (or *storm*).
      *   Stanza 3: ends with *time*.
  4.  **Compensation:** To pay for breaking the visual pattern, you must link *rain* and *time* sonically. Use internal assonance.
      *   *Stanza 2:* "He walks alone into the **rain**."
      *   *Stanza 3:* "He waits in vain for **time**."
      *   (Note the *rain/vain/time* chain).
  **Result:** You lose the visual echo of the repeating word, but you save the semantic truth. The reader sees *temps/weather* on the left and *rain* on the right. They understand. If you wrote "time," they would think you don't know French.

  #### Case 2: The Rhyme Trap (The Semantic Lie)
  **The Situation:** French rhymes *amour* (love) with *toujours* (always).
  **The Problem:** To rhyme with "love" in English, you reach for "dove," "above," "shove."
  *   Draft: "She sent her heart **above**."
  *   Original: "She loved him **always**."
  **The Procedure:**
  1.  **Meter Lock:** "Above" scans fine.
  2.  **Semantic Lie Detector:** Did she send her heart above? No. She loved him always. This is a **Forgery.**
  3.  **Rhyme Negotiation:** Kill the perfect rhyme.
      *   Draft: "She loved him **still** / Against her **will**." (Slant rhyme on *still/will* vs *love*? No, need to rhyme with *love*).
      *   Draft: "She loved him **true** / Though **blue**." (No).
      *   **Solution:** Slant rhyme on the vowel sound, or abandon the end-rhyme for internal music.
      *   *Revision:* "Her love remained, / Unchanged, unfeigned." (Rhyme *remained/unfeigned*).
      *   Wait, the scheme requires rhyming with *love*.
      *   *Revision:* "She gave her **heart** / Would not **depart**." (Rhyme *heart/depart*). You have shifted the rhyme sound entirely.
  4.  **Compensation:** You lost the *amour/toujours* sonic link. Pay with alliteration. "Her **l**ove **l**asted, **l**ife **l**ong."
  **Result:** You look less "clever" than if you rhymed love/dove, but you didn't lie. The facing page shows *toujours*. The English says "lasted." It matches.

  #### Case 3: The Hated Choice (Meter vs. Image)
  **The Situation:** This is the one you will hate.
  **The Situation:** French line: *Elle pleurait dans le noir.* (She wept in the dark.) 6 syllables.
  **Target:** Iambic Tetrameter (8 syllables).
  **The Problem:** "She wept in the dark" is 5 syllables. You need 3 more.
  **Draft 1:** "She wept alone in the dark night." (8 syllables).
  **Critique:** "Alone" and "night" are not in the original. "Dark" implies night. "Wept" implies solitude maybe. You are padding.
  **Draft 2:** "She wept within the dark of night." (8 syllables).
  **Critique:** "Dark of night" is a cliché filler. It dilutes the starkness of *dans le noir*.
  **The Procedure:**
  1.  **Meter Lock:** Must be 8 syllables.
  2.  **Semantic Lie Detector:** "Alone" is an assumption. "Night" is an assumption (could be a dark room).
  3.  **The Veto:** You cannot add "night." It changes the setting. You cannot add "alone." It changes the context.
  4.  **The Hated Choice:** **You must weaken the verb or the noun to fit the meter without adding new concepts.**
      *   *Option A:* "She wept there in the heavy dark." (Adds "heavy"—subjective, but acceptable intensifier).
      *   *Option B:* "She was weeping in the dark." (7 syllables).
      *   *Option C:* "She wept into the dark." (6 syllables).
      *   *Option D (The Procedure's Order):* **Change the verb aspect.** "She **began** to weep in the dark." (8 syllables).
      *   *Critique:* The original is continuous (*pleurait*). "Began" is ingressive. It's a shift.
      *   *Better:* "She wept **deep** in the dark." (7 syllables). "She wept **so** in the dark." (7).
      *   *Actually:* "She wept **within** the dark." (6).
      *   *Okay, strict 8:* "She wept **there** in the **deep** dark."
  **The Decision:** The procedure forces you to admit that **English is less concise than French.** To keep the meter without lying, you must add a modifier that is emotionally neutral.
  *   **Final:** "She wept **there** in the dark **room**." (If context allows room).
  *   **If not:** "She wept **on** in the dark." (Implies continuation).
  **Why you'll hate it:** You are forced to dilute the starkness of the original image (*dans le noir*) to satisfy the English metrical contract. You are prioritizing the *music* of the English over the *density* of the French.
  **Why you must do it:** If the line doesn't scan, the editor rejects it. If you add "night," the reader sees *noir* (darkness) vs "night" (time). If you add "there" or "on," you are adding spatial/temporal filler that is less intrusive than a concrete noun like "night." It is the lesser of two evils.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Remove Taste:** Step 6 (The Veto) is pure taste. Two translators running this procedure will produce different poems. That is fine.
  2.  **It Cannot Save a Bad Poem:** If the original poem relies on a pun that is strictly French (e.g., *vers/verre/vert*), no procedure can carry that across without a footnote. The procedure will tell you to **drop the pun** and compensate with rhythm. You will feel grief. Accept it.
  3.  **It Cannot Please Your Friend:** Your friend believes form *is* meaning. This procedure admits that sometimes form is a *container* that leaks. If you follow this, you will produce a poem that is true but formally imperfect. She will call it a summary. You will know it is a translation.

  ### Final Instruction for the Week
  Print the French poem. Print your draft. Put them side by side.
  If you find yourself explaining why a word is there ("Well, it's not in the original, but..."), **delete the word.**
  If you find yourself explaining why a rhyme is slant ("Well, it scans, but..."), **keep the rhyme.**
  In a bilingual edition, the eye is the ultimate critic. The eye forgives a slant rhyme; the eye does not forgive a lie.

  Get to work.
