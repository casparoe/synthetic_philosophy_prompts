prompt: |-
  Right, so my friend and I had a four-hour arguement last night about translation — she does literary translation, I do too, we were both a few drinks in — and it started from that Hofstadter book where he translates one tiny sixteenth-century French poem about a sick girl something like a hundred different ways and ranks the versions against each other. Her position: if you can't carry the form across, you haven't translated the poem, you've written a summary with line breaks. Mine: a version that keeps the rhyme and the meter while saying something the original never said is a forgery, and a pretty one, which is worse. We got nowhere. Now I actually have to do the thing. I've got a week to finish a bilingual edition of a short poem — French on the left, English on the right — and the poem is formally vicious: fixed rhyme scheme, tight syllabic meter, a refrain that comes back, and one of those structures where a single end-word is supposed to return in every stanza carrying a different sense each time. The publisher's rule is no footnotes and no translator's preface, so anything I lose has to be paid back inside the text itself, and the facing pages have to look like they belong together — the editor will genuinely check that the English scans.

  What I want from you is a procedure I can run stanza by stanza, not advice. Something with questions in order: what do I look at first, what counts as a real answer versus me kidding myself, when do I stop trying to save a constraint and accept the loss, when do I break the form on purpose and how do I know I'm allowed to, and where do I just have to decide because it's a values call — mine as the translator, or the publisher's taste — that no amount of analysis settles. My friend had this idea she was very smug about: sort every constraint into one of three buckets, the ones that are constitutive of the poem, the ones that are ornamental, and the ones that are basically accidental to it, then spend your effort in that order. I don't trust it. Use it if it survives contact, ditch it if it doesn't, but I want the procedure to say which constraints get sacrificed first and why, and what 'compensation' actually means as an operation rather than a vibe.

  Then run it on two or three concrete cases so I can watch it work: say a stanza where the returning end-word has no English word that can do the double duty, and a case where the rhyme is easy but the only rhyme available pushes the sense somewhere the original never goes. Include at least one where your procedure tells me to do the thing I'll hate — I'd rather find out now than at the proof stage. And be straight about what the procedure can't do, because I suspect a lot of this is just taste wearing a lab coat.
