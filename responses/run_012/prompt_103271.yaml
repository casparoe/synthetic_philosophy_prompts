answer: |-
  The film is not a serious historical argument against the agricultural revolution but a moral fable that uses the 'original affluent society' thesis as a comedic premise to critique private property, ultimately suggesting that alienation stems from psychological attachment to objects rather than economic modes of production. While the opening narration explicitly mirrors the Sahlins/Diamond style argument—depicting the San as working little, wanting nothing, and lacking conflict—this affluence functions primarily as a narrative device to heighten the absurdity of the disruption caused by the Coke bottle. The film is less interested in the material conditions of subsistence than in the metaphysics of ownership; the 'fall' is triggered not by the adoption of farming or settlement, but by the introduction of a singular, indivisible manufactured object that cannot be shared. This distinguishes the film's argument from a strict anti-agricultural stance, positing instead that the corruption of human relations comes from the concept of private property itself, which transforms a useful tool into a source of jealousy and violence.

  However, this philosophical distinction blurs when the film equates the bottle with modern civilization broadly, implying that technology inevitably breeds hierarchy even though the San remain hunter-gatherers throughout. The movie cheats by relying heavily on the noble savage framing, presenting the San as childlike and inherently peaceful until contaminated by Western goods, which ignores archaeological evidence that hierarchy, violence, and slavery existed long before agriculture and that some groups settled down without farming. This romanticization is particularly fraught given the film's production in apartheid-era South Africa; by portraying the San as living in a harmonious vacuum untouched by politics, the film inadvertently depoliticizes the real-world oppression and land dispossession occurring around the production sites, rendering the natives as timeless symbols rather than historical actors. The 'affluence' is thus a gag that relies on erasing the complexities of pre-modern life to set up the slapstick, simplifying the anthropological debate into a binary of natural innocence versus artificial corruption.

  The modern subplots involving the clumsy biologist and the hapless guerrillas complicate this binary by suggesting that modern life is not inherently evil but merely neurotic and absurd. Andrew Steyn and Kate Thompson are not villains; they are well-meaning but constrained by the rules and awkwardness of civilized society, while the guerrillas represent the actual violence of modern political ideologies. This triangulation suggests that the 'fall' is not irreversible; modern humans can be redeemed through contact with the natural world, just as the San are corrupted by contact with objects. Ultimately, the film argues that the agricultural revolution—or rather, the industrial capitalism that followed it—was a mistake not because farming made us poorer, but because property made us anxious, yet it delivers this critique through a colonial lens that treats indigenous people as philosophical props rather than equals in the dialogue about what constitutes a good life.
