prompt: |-
  Bit of an odd request — I'm running the film night for our phil of social science reading group and we're doing The Gods Must Be Crazy, and I want to read it against the debate over whether the agricultural revolution was a mistake. You know the setup: the narrator tells us the San want for nothing, work a couple of hours a day, have no crime, no bosses, no money — straight out of the original affluent society thesis — and then a Coke bottle falls out of the sky and within days there's ownership, jealousy and the first fight, so Xi has to carry it to the edge of the world and throw it off. I want a reading that takes both directions seriously. Is the film actually making the Sahlins/Diamond style argument that settling down and farming was a bad trade, or is the affluence just a gag to set up the slapstick? And note that the fall it stages is a fall into property and manufactured goods, not into farming — is that a real distinction or does the movie just blur the two? Then where does it cheat: the noble-savage framing, the fact it was shot in apartheid-era South Africa, and what the archaelogy actually says to complicate the picture (early farmers worse off, fine, but also hierarchy, violence and slavery long before agriculture, and people who settled down without farming). Last thing — what does the other half of the film, the clumsy biologist and the hapless guerrillas, do to the argument? Does modern life come off as the real fall? No reading lists or citations, just the reading. Lead with your bottom line in the first sentence, then the reasoning, no preamble.
