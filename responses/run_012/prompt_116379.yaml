answer: |-
  This is an excellent puzzle. It cuts to the heart of the ontology of art and the normative foundations of intellectual property. You have correctly identified that these three practices operate with divergent, and often unstated, metaphysical commitments regarding what an artwork *is* and where its value resides.

  Below is the reconstruction and argument you requested. I have separated settled legal or economic descriptions from contested philosophical interpretations, as requested.

  ### 1. Reconstructing the Implicit Theories of Value

  Here we isolate the theory of value (axiology) and the theory of the work's identity (ontology) that best explains the behavior of each practice.

  **A. The Art Market and Museum World**
  *   **Implicit Theory:** **Historical-Genesis Essentialism.**
  *   **The Commitment:** The aesthetic and economic value of a work is constitutively tied to its specific causal history of production. The work is not merely a visual structure; it is a "performance" frozen in time.
  *   **Evidence from Practice:** The "Rembrandt" case. If value were purely perceptual, reattribution would not change the price or display status. The fact that it does proves the market treats the artist's hand as a necessary condition for the work's high value. Furthermore, the "forgery" case confirms this: a fake Vermeer gains value only when its *true* history (as a forgery) is revealed. It becomes valuable as a historical document of deception, not as a visual experience.
  *   **Status of Claim:** It is **settled** that the market behaves this way. It is **contested** among aestheticians whether this is rational. (e.g., Nelson Goodman argues the knowledge of origin changes our perception, while others argue it is a fetishization of provenance unrelated to aesthetic experience).

  **B. The Criminal Law of Forgery**
  *   **Implicit Theory:** **Epistemic-Transactional Reliance.**
  *   **The Commitment:** The value of the original is secondary to the integrity of the information ecosystem surrounding transactions. The "wrong" is not the existence of the copy, but the disruption of trust between parties.
  *   **Evidence from Practice:** The private copy is not a crime. If the object itself were inherently illicit (like a counterfeit bill in some jurisdictions, or drugs), possession would suffice. Because the crime requires *deception* (fraud), the law locates the harm in the viewer's/buyer's mental state and their reliance on a false representation of origin.
  *   **Status of Claim:** It is **settled** law that fraud requires deception. It is **contested** whether the harm is primarily economic (loss of money) or epistemic (corruption of the historical record/cultural trust).

  **C. Copyright Law**
  *   **Implicit Theory:** **Labor-Derivative Utilitarianism.**
  *   **The Commitment:** Value resides in the intellectual labor of creation, and the right is to control the *derivation* of copies, regardless of their market effect or deceptive intent.
  *   **Evidence from Practice:** Independent creation is a complete defense. If two people paint the same image, no infringement occurs. This proves copyright does not protect the "image" as a visual type (otherwise the second painter would be liable), but rather the *causal link* between the author's labor and the token. Conversely, copying infringes even without sale or deception, proving the harm is the unauthorized appropriation of the labor chain, not the confusion of the public.
  *   **Status of Claim:** It is **settled** that independent creation is not infringement. It is **contested** whether this is justified because authors have a natural right to their labor (Lockean) or because society needs to incentivize production (Utilitarian).

  ---

  ### 2. Required vs. Comfortable Commitments

  For each practice, we must distinguish what is necessary for the system to function as it does versus what is merely consistent with it.

  **A. Art Market**
  *   **Strictly Required:** The commitment that **provenance supervenes on value.** The system cannot function if origin is irrelevant to price.
  *   **Merely Comfortable:** The commitment that **aesthetic quality correlates with authorship.** The market *fits* comfortably with the idea that Rembrandts are better than studio works. However, the market would function the same way even if studio works were perceptually superior, provided collectors cared about scarcity and prestige. The market requires *historical* value, not necessarily *aesthetic* value, though it conflates them.

  **B. Criminal Law**
  *   **Strictly Required:** The commitment that **harm requires a victim (deceived party).** Without a deceived party, there is no fraud.
  *   **Merely Comfortable:** The commitment that **the object is a "fake."** Legally, the object is neutral until used deceptively. The law does not require the object to be ontologically distinct from an original, only that it be represented as such falsely.

  **C. Copyright**
  *   **Strictly Required:** The commitment that **causal connection matters more than perceptual outcome.** The law must be able to distinguish between a copy and an independent duplicate.
  *   **Merely Comfortable:** The commitment that **infringement causes economic loss.** While damages often rely on this, liability exists without it (statutory damages, injunctions against non-commercial copying). The system requires a violation of the *right to copy*, not necessarily a realization of market harm.

  ---

  ### 3. Reconcilability: Single Theory or Genuine Conflict?

  Can these three be brought under a single theory?

  **The Verdict:** There is a **genuine conflict** in their ontological commitments, though they can be pragmatically reconciled by assigning them to different normative domains.

  **The Conflict:**
  The conflict lies in the **ontology of the work.**
  1.  **Market:** The work is a **unique historical particular.** (Token-identity).
  2.  **Copyright:** The work is a **type that can be tokened, but only by the author.** (Type-identity with restricted tokening).
  3.  **Criminal Law:** The work is a **representation.** (Semiotic identity).

  You cannot hold all three metaphysical views simultaneously. If the work is a unique historical particular (Market), then a perfect copy is a *different* work. If the work is a type (Copyright), a perfect copy *is* the same work (in terms of expression), just an illicit token.

  **The Reconciliation:**
  They are reconcilable only if we accept they are answering different questions:
  *   **Market:** Answers "What is this worth?" (Axiological)
  *   **Criminal Law:** Answers "Did someone lie?" (Epistemic/Ethical)
  *   **Copyright:** Answers "Who controls this labor?" (Political/Economic)

  **Where the Conflict Remains:**
  The conflict becomes acute in **moral rights regimes** (more common in Europe than the US). If an artist has a "right of integrity," they can object to distortion of their work even if they sold the copyright. This aligns with the Market's "Genesis Essentialism" (the artist's hand is still connected to the work) but conflicts with Copyright's "Transferable Property" model (I sold you the rights, it's yours to use).
  Furthermore, if a forgery is perceptually indistinguishable, the Market says it is worthless (ontologically deficient), but Criminal Law says it is harmless (if not sold), and Copyright says it is irrelevant (unless the original was copied). The three systems talk past each other regarding the *status of the fake object itself.*

  ---

  ### 4. Adopting a Purely Experiential Theory

  Suppose we adopt the theory you mentioned: **Aesthetic Empiricism.** (Two indistinguishable objects have the same aesthetic value). This is the view associated with philosophers like Clive Bell (significant form) or a strict reading of Kantian disinterestedness, and famously critiqued by Nelson Goodman (*Languages of Art*).

  **Impact on the Art Market:**
  *   **Collapse of Authentication:** The authentication industry would vanish. If a studio work looks like a Rembrandt, it is worth the same.
  *   **Price Equalization:** Prices would stabilize around the utility of the visual experience. Scarcity would still matter (there is only one physical canvas), but the "artist premium" would disappear.
  *   **Museum Practice:** Museums would display the best visual specimens, regardless of attribution. The "Rembrandt" currently in storage might become the centerpiece if it is in better condition than the "real" one.

  **Impact on Criminal Law:**
  *   **Shift from Fraud to Warranty:** Forgery laws would likely be repealed or reduced to civil contract breaches. If the experience is identical, the "lie" about origin causes no aesthetic harm. The harm is purely economic (paying more for the same experience). This becomes a consumer protection issue (false advertising) rather than a crime against the cultural order.
  *   **Devaluation of Deception:** The moral sting of forgery relies on the idea that the viewer is being denied the "real" encounter. If the encounter is identical, the deception is trivial.

  **Impact on Copyright:**
  *   **Radical Weakening:** Copyright is hard to justify under pure empiricism. If the copy provides the same experience, and the goal of art is aesthetic experience, why ban the copy?
  *   **Shift to First-to-Publish:** Copyright might shift to a system similar to patents: the first person to *publish* the image owns the rights for a limited time, regardless of who created it. Independent creation would likely still be a defense, but the scope of protection would narrow. Why protect "expression" if the expression is defined by its effect on the viewer?
  *   **Fair Use Expansion:** Transformative use would be easier to justify. If the new work provides a new experience, the copying of the source is less relevant.

  ---

  ### 5. Philosophical Underdetermination

  This is the most subtle part of your puzzle. There are places where the practices remain exactly the same, even if the underlying philosophical theory changes. This means the practice cannot adjudicate between the theories.

  **A. The Market: Scarcity vs. Essence**
  *   **Rival Theories:** (1) The "Magical Essence" theory (the artist's touch imbues the canvas with value). (2) The "Signaling" theory (attribution is just a reliable signal of quality/scarcity).
  *   **Underdetermination:** Both theories predict the exact same price drop upon reattribution. The market behavior does not prove that collectors believe in "essence"; they might simply be signaling status or hedging against the risk that the studio work is of lower quality. We cannot look at the price tag to know the collector's metaphysics.

  **B. Criminal Law: Economic Harm vs. The Lie Itself**
  *   **Rival Theories:** (1) Forgery is punished because it causes financial loss. (2) Forgery is punished because lying is inherently wrong (deontological).
  *   **Underdetermination:** In almost all cases, the lie *causes* financial loss. The law requires both the lie and the potential for loss. We cannot tell from the statutes whether the state is protecting wallets or truth, because the two overlap perfectly in practice. Only in a case where a forgery is sold at a fair market price for a fake (but sold as real) would we know—but such cases rarely litigate the principle.

  **C. Copyright: Natural Right vs. Incentive**
  *   **Rival Theories:** (1) Lockean Labor Theory (you own what you make). (2) Utilitarian Incentive Theory (we grant rights to encourage more making).
  *   **Underdetermination:** Both theories justify the exact same rule: "Copying is infringement; independent creation is not."
      *   Locke says: You didn't labor for this copy, so it's not yours.
      *   Utilitarian says: Protecting the copier reduces the incentive for the original creator.
      *   The legal outcome is identical. The practice of copyright law is therefore **philosophically underdetermined**; a judge can cite either theory to reach the same verdict. This is why copyright jurisprudence often oscillates between "authors' rights" language and "public benefit" language without resolving the tension.

  ### Summary Conclusion

  Your puzzle reveals that "The Law" and "The Market" are not monolithic entities with a single theory of art. They are assemblages of different normative tools.
  *   The **Market** acts as if art is **magic** (provenance is constitutive).
  *   The **Criminal Law** acts as if art is **speech** (truthfulness is constitutive).
  *   **Copyright** acts as if art is **labor** (derivation is constitutive).

  They are incompatible ontologically but compatible pragmatically. The genuine conflict lies in whether the "original" is a physical history, a truthful representation, or a bundle of rights. The practices are underdetermined because multiple philosophical justifications can sustain the same rules, leaving the deeper question of *why* we value the original unresolved by the practices themselves.
