  **HORIZON BAY RESORT & CASINO**
  **PLAYER WELLNESS & STRATEGIC INTEGRITY**

  **A Message from the Director of Responsible Gaming**

  Welcome to Horizon Bay. Traditionally, "Responsible Gaming" meant setting limits to prevent loss. We have updated this framework. True responsibility is not about avoiding risk; it is about optimizing your geometric growth rate over a lifetime of play. We are here to ensure you do not violate the mathematics of survival.

  **The Logarithmic Wellness Model**

  Most visitors arrive seeking to maximize Expected Value (EV). This is a category error. EV measures the average outcome across many parallel universes. You, however, live in only one universe, sequentially through time. 

  At Horizon Bay, we have made a profound choice: we maximize the expected logarithm of wealth. Please note that the math does not force this upon you. It is a philosophical commitment to respecting the non-ergodic nature of reality. We choose log-wealth because it aligns your personal trajectory with the sustainable health of the house. To ignore this is to ignore the flow of time itself.

  **Sizing as Moral Integrity**

  In our facility, bet sizing is not merely strategic; it is ethical.

  *   **Overbetting (The Mortal Sin):** Wagering more than the Kelly Criterion dictates exposes you to ruin. This is selfish. It burdens the system with volatility you cannot sustain. It is the equivalent of running toward a cliff because the view is nice.
  *   **Underbetting (The Moral Failure):** Wagering less than the optimal fraction is a failure of potential. It is leaving growth on the table. It suggests a lack of faith in the edge provided. We encourage you to examine why you are withholding capital from its most efficient use.

  **Worked Example: The 60/40 Opportunity**

  Consider a standard offer: a 60% chance to win even money, and a 40% chance to lose.
  *   **The Edge:** 20%.
  *   **The Correct Size:** The Kelly Criterion dictates you wager 20% of your current bankroll.
  *   **The Consequence of Excess:** If you bet double the Kelly fraction (40% of your bankroll), your expected logarithmic growth rate drops from positive to negative. You are mathematically guaranteed to lose money over time, despite having a positive expected value on every individual hand. You are paying for the privilege of going broke.

  **The Trap of the Single Bet**

  You may ask: "If the bet is positive EV, why not take it once?" 

  This is the Ensemble Fallacy. Looking at the average outcome of 100 friends making one bet is not the same as one person making 100 bets. If you bet your whole bankroll on a single positive EV flip, you will eventually hit a tails. You will be absorbed by the zero boundary. At Horizon Bay, we do not play for the parallel universe where you get lucky. We play for the timeline you actually inhabit.

  **Frequently Asked Questions**

  **Q: What if I just don't bet at all?**
  **A:** This is a common concern. While retaining cash eliminates risk of ruin, it guarantees zero geometric growth. In our wellness model, total risk aversion is treated as a symptom of pathological caution. We recommend speaking with a Floor Manager to discuss a graduated exposure therapy plan.

  **Q: Can I use my own sizing strategy?**
  **A:** You are free to make choices, but we cannot endorse strategies that violate ergodicity. If you choose to maximize linear wealth rather than logarithmic wealth, you are opting out of our wellness program.

  **Q: Is this financial advice?**
  **A:** This is existential advice. Financial advice assumes you can withdraw. We assume you are here for the long run.

  **COMMIT TO THE TRAJECTORY**

  Play within your means. Play within your math. Play within your time.

  *Horizon Bay Resort & Casino. Where the Long Run Lives.*
