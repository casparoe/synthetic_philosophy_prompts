answer: |-
  Your surplusage argument rests on the assumption that the modifier "designated for navigation" restricts the purpose of the dredging rather than the identity of the channel. The syntax does not bear that weight. We are authorized to conduct "maintenance dredging of a channel designated for navigation." The designation attaches to the channel, not the activity. A channel designated for navigation is still a physical ecosystem, and "maintenance" in its ordinary sense encompasses upkeep of the channel's condition, not solely its utility for vessels. Where the text admits this ambiguity—between maintaining a channel *for transit* and maintaining a channel *located in a navigation zone*—the Act's express purpose of ecological integrity selects the latter. I keep every word: the dredging must be "maintenance," not new construction; it must occur in a "channel," not the floodplain; and that channel must be "designated for navigation." The text constrains the *where* and the *how*; the purpose informs the *why*.

  Regarding the appropriation, you ask us to infer a limitation on regulatory authority from a grant of funding. That is a precarious inference. The legislature may fund general restoration projects while simultaneously authorizing specific restoration activities via permit within navigation channels. The appropriation ensures money is available for broader projects; Section 5 ensures that dredging within navigation channels does not proceed unless it serves a maintenance function compatible with the Act's goals. To hold otherwise is to assume the legislature intended to authorize dredging in navigation channels only if it ignores the ecological damage that dredging might otherwise cause. We do not rewrite the text by reading "maintenance" to include ecological upkeep; we merely refuse to import a limitation ("for navigation") to the word "maintenance" that the legislature did not write. The preamble does not swallow the operative text; it resolves the ambiguity inherent in the term "maintenance" within the specific geographic bounds the text provides.
