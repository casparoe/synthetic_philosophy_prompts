      *   *Section 3: Consequences.* What happens if you don't go above and beyond? You're meeting expectations, which is now below expectations.
      *   *FAQ:* Address the paradox. "Is this voluntary?" "It is voluntarily mandatory."
      *   *Sign-off:* Serious, inspiring, hollow.

      *Word Count Check:* Need to hit 600-700. I need to expand on the bureaucratic language to fill space without losing punch. Elaborate on the "Heroism Index."

      *Refining the Philosophy:* Ensure the tension is clear. The memo demands that employees perform acts that are, by definition, beyond the call of duty, as part of the call of duty.

      *Drafting - Section by Section:*
