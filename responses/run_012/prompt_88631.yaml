      *Self-Correction during drafting:* Make sure the FAQ sounds like HR trying to talk out of both sides of their mouth. Ensure the distinction between "required" and "optional" is blurred intentionally.

      *Word Count Management:* I need to be verbose enough to hit 600 but tight enough to be funny. Bureaucratic bloat helps here.

      *Philosophical Note:* Keep it distinct. "Settled: optionality. Contested: whether morality demands too much (the moral saint objection)."

  6.  **Final Polish:**
