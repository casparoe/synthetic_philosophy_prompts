answer: |-
  **MEMORANDUM**

  **TO:** All Personnel
  **FROM:** Bureau of Voluntary Initiative
  **DATE:** November 14
  **SUBJECT:** Q4 Rollout: Mandatory Discretionary Effort Protocol

  At Vantage Dynamics, meeting expectations is the expectation. However, market volatility requires us to institutionalize the exceptional. Historically, acts of goodwill beyond one's job description—staying late without pay, solving unassigned problems, emotional labor during mergers—were considered voluntary. Effective immediately, these acts are reclassified as baseline requirements. We are launching the Mandatory Discretionary Effort (MDE) Protocol to ensure our culture of heroism is consistent, measurable, and compliant.

  **1. Redefining the Extraordinary**
  Going "above and beyond" is no longer a distinction; it is the floor. Employees who perform only the duties listed in their contracts will be flagged for underperformance. The Bureau has determined that true excellence cannot be sporadic. Therefore, spontaneity must be scheduled. Staff are required to log at least three unscheduled acts of kindness per week. Please note: if you schedule them in advance, they are not unscheduled. You must anticipate the unanticipated.

  **2. Tracking and Verification**
  Discretionary effort must be visible to count. Managers will audit employee heroism using the new Spontaneity Index. If you help a colleague but fail to file a Form V-12 (Voluntary Assistance Report) within 24 hours, the act is nullified. Conversely, filing a V-12 without witness corroboration will be treated as falsifying excellence. We encourage you to be humble, but not so humble that your contributions go unrecorded.

  **3. Penalties for Adequacy**
  Failure to exceed targets will result in a Performance Improvement Plan focused on enthusiasm. Being "just good enough" is now a disciplinary offense. Employees caught doing exactly what they are paid to do, without additional unpaid labor, will be coached on their lack of initiative. Remember: you are not paid for your time; you are paid for your potential to exceed your time.

  **FAQ**

  **Q: Is this program optional?**
  A: Participation is mandatory. The voluntary nature of the acts is preserved in spirit, though compliance is required in practice. You must choose to do this, but you must also do it.

  **Q: What if I am too exhausted to be heroic?**
  A: Fatigue is often a symptom of insufficient passion. The Bureau offers wellness seminars on how to sleep less efficiently.

  **Q: Does this mean everyone is a hero now?**
  A: Yes. Consequently, heroism will no longer be recognized with awards, as awards imply rarity. You are all saints now. Act accordingly.

  **Q: Can I opt out of the Moral Saint Clause?**
  A: Opting out is viewed as a lack of cultural fit. We are building a family, not a workforce. Families do not negotiate duties.

  We trust you will embrace this opportunity to make greatness routine. Let us make the extraordinary ordinary, and the optional obligatory.

  **Sincerely,**

  **Gavin Belson-like Figure (虚构)**
  **Director, Bureau of Voluntary Initiative**
  **Vantage Dynamics**

  ***

  **Author's Note**

  In drafting this memo, I have taken the liberty of collapsing the distinction between duty and supererogation, treating the latter as a enforceable KPI. Among philosophers, it is largely settled that supererogatory acts are, by definition, optional; failing to perform them does not constitute moral wrongdoing. What is contested is whether morality can demand such acts without losing its coherence, or if the "moral saint" objection holds—that a life demanding constant supererogation is unlivable. The memo treats the contested view (that we can be obligated to be saints) as operational policy, thereby destroying the very category it seeks to exploit.
