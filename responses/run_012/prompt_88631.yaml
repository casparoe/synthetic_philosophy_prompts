      *   Okay, I need to be precise. Standard view: Supererogatory = optional + good. Contested: Can there be a duty to be supererogatory? (Usually no, by definition). The "Moral Saint" objection (Wolf) is relevant here—morality shouldn't demand everything. I will note that the memo collapses the optional/required distinction, which philosophers generally hold as distinct, though some argue about the boundaries.

