prompt: |-
  I run a mechanistic-interpretability team at a company that deploys large models, and we keep hitting the same disagreement. A probe finds a high-level feature—say, a direction in activation space that tracks whether a document is a legal contract—and one engineer says the model "uses" that feature, while another says the feature is just a summary of lower-level activity and the real causal action is in individual neurons or attention heads. Hofstadter's careenium is the picture we keep arguing about: a vast arena of tiny magnetized marbles whose local pushes and pulls make clusters that drift and merge, and the question is whether describing those clusters as symbols that push the marbles around is legitimate causal talk or a convenient fiction layered on the microphysics. I want a decision procedure my team can actually run, on a deadline, to answer the question for a given feature: does this high-level pattern push the substrate around, in a sense that should change how we intervene, or is it epiphenomenal with respect to the behavior we care about? The procedure should ask its questions in order, say what counts as a sufficient answer at each step, say where it stops with a no and where it hands the decision to a human because the remaining question is interpretive rather than empirical, and be honest about which steps are judgment calls in procedural clothing. Assume we can run ablations, patching, and causal tracing, but not retrain the model from scratch. Then run the procedure on three cases: a feature that passes cleanly; a feature that fails; and one where the procedure gives an answer my engineers will not like—for instance, telling us to treat as causally real a feature that is ugly, unstable, or not the one we wanted. Close by saying what the procedure cannot settle, and whether the careenium picture actually earns its keep here or whether we should just talk about interventions and be done with it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Context:** Mechanistic interpretability team at a company deploying large models.
      *   **Problem:** Disagreement on whether high-level features (probes/directions) are causally efficacious ("uses the feature") or merely epiphenomenal summaries of lower-level mechanics (neurons/heads).
      *   **Analogy:** Hofstadter's Careenium (marbles vs. symbols).
      *   **Task:** Create a *decision procedure* (algorithm/checklist) to determine causal status of a feature.
      *   **Constraints:**
          *   Must be runnable on a deadline.
          *   Must specify order of questions.
          *   Must define sufficient answers at each step.
          *   Must specify stop conditions (No vs. Human Judgment).
          *   Must acknowledge judgment calls.
          *   Allowed tools: Ablations, Patching, Causal Tracing (no retraining).
          *   Must run the procedure on three specific cases (Pass, Fail, Uncomfortable Truth).
          *   Must conclude on limitations and the utility of the Careenium analogy.

  2.  **Develop the Decision Procedure (The "Causal Efficacy Protocol" or CEP):**
      *   *Goal:* Distinguish between "causally upstream" (the feature drives behavior) and "causally downstream/parallel" (the feature correlates but doesn't drive).
      *   *Step 1: Robustness & Specificity.* Is the feature actually distinct? If it's just noise or conflated with everything, stop.
      *   *Step 2: Intervention Necessity.* If I break the feature, does behavior break? (Ablation).
      *   *Step 3: Intervention Sufficiency.* If I inject the feature, does behavior change? (Activation Patching/Steering).
      *   *Step 4: Locality/Mechanism.* Is the effect direct or mediated by something else? (Causal Tracing/Mediators).
      *   *Step 5: Stability/Generalization.* Does it hold out of distribution? (Crucial for "realness" vs. overfitting).
      *   *Decision Points:* Hard "No" at Step 2 or 3. "Human Judgment" at Step 5 (interpretive).

      *Refining the Procedure for the Prompt's Constraints:*
      *   Need to be explicit about *where* it stops.
      *   Need to admit where it's "judgment in procedural clothing."
      *   Need to address the "Careenium" aspect (high-level vs. low-level).

      *Drafting the Steps:*
      1.  **Detectability:** Can we find it reliably? (Probe accuracy).
      2.  **Necessity (The Break Test):** Ablate the direction. Does task performance drop *specifically* on inputs requiring that feature?
      3.  **Sufficiency (The Make Test):** Patch/Steer the direction. Does the model exhibit the behavior *without* the natural trigger?
      4.  **Mediation (The Middleman Test):** Does the effect disappear if we block the downstream path? (Distinguishes direct cause from common cause).
      5.  **Stability (The Robustness Test):** Does it hold across contexts? (This is the judgment call zone).

  3.  **Running the Procedure on Three Cases:**
      *   *Case 1 (Pass):* A clear circuit. E.g., "Indentation/Code Structure" direction in a code model.
      *   *Case 2 (Fail):* A correlate. E.g., "Topic: Law" but actually just "Word: Contract". The model looks at specific tokens, not a global state.
      *   *Case 3 (Uncomfortable Truth):* A "hacky" feature. E.g., A direction that tracks "Safety Refusal" but is entangled with "Politeness" or specific trigger phrases. It *works* causally, but it's not the clean semantic concept we wanted. It forces us to admit the model is using a heuristic, not a principle.

  4.  **Addressing the Careenium & Conclusion:**
      *   Does the analogy help? It highlights the levels of abstraction.
      *   Verdict: The analogy is good for philosophy, bad for engineering. We should focus on *interventions*.
      *   What can't be settled? The "ontological status" of the feature. We can only settle "instrumental utility."

  5.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is Step 4 (Mediation) possible without retraining?
      *   *Fix:* Use activation patching on *downstream* components to see if the feature's effect is blocked. This is doable with causal tracing tools.
      *   *Critique:* Make sure to explicitly mark the "Judgment Calls."
      *   *Critique:* Ensure the "Uncomfortable Truth" case actually yields a "Yes, it's causal" result, which is why engineers won't like it (because it's ugly).
      *   *Tone:* Professional, technical, slightly philosophical but grounded in engineering reality.

  6.  **Final Polish:** Check against all constraints in the prompt.
      *   Decision procedure? Yes.
      *   Order of questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop conditions? Yes.
      *   Judgment calls acknowledged? Yes.
      *   Three cases run? Yes.
      *   Careenium conclusion? Yes.

      *(Self-Correction on the "Uncomfortable Truth" case)*: Let's make it about a "Safety" feature. Engineers want to believe the model has a "Do No Harm" concept. The procedure might reveal the model actually uses a "Detect Trigger Word -> Activate Refusal Script" direction. It *is* causal, but it's brittle and not the moral agent they hoped for. This fits "ugly, unstable, or not the one we wanted."

      *(Refining the Procedure Name)*: Let's call it the "Feature Causality Protocol (FCP)".

      *(Refining the Careenium verdict)*: Hofstadter suggests the symbols *are* real because they have causal power at their level. The procedure should reflect this: if the intervention works, the symbol is "real enough" for engineering.

  7.  **Final Output Generation** (Proceeding to draft the response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your team's constraints, followed by the three case runs and a conclusion on the Careenium analogy.

  ### The Feature Causality Protocol (FCP)

  **Objective:** Determine if a high-level feature vector $v$ (found via probing) is a *causal driver* of model behavior $B$ or an *epiphenomenal correlate* of lower-level mechanics.
  **Tools Allowed:** Activation Ablation, Activation Patching (Insertion), Causal Tracing (Mediation).
  **Time Budget:** Designed for a 2-week sprint per feature.

  ---

  #### Step 1: Specificity & Orthogonality Check
  **Question:** Is $v$ distinct from the mean activation and from other known feature directions?
  **Method:** Compute the cosine similarity of $v$ against the mean activation vector and the top 50 principal components of the residual stream at that layer.
  **Sufficient Answer:** Similarity $< 0.3$ to mean and top PCs.
  **Stop Condition:**
  *   **NO:** If $v$ is nearly collinear with the mean or a dominant PC. **Verdict: Epiphenomenal.** (It's just "activity level," not a specific feature).
  *   **PASS:** Proceed to Step 2.
  **Judgment Call:** The threshold (0.3) is arbitrary. A feature could be real but correlated. This step filters out obvious noise, not subtle entanglement.

  #### Step 2: Necessity (The Break Test)
  **Question:** If we remove $v$, does the specific behavior $B$ degrade while controlling for general perplexity?
  **Method:** **Orthogonal Ablation.** Project the activation $h$ onto the subspace orthogonal to $v$ ($h' = h - \text{proj}_v(h)$). Run the model on a dataset where $B$ is required (e.g., legal reasoning) and a control dataset (e.g., creative writing).
  **Sufficient Answer:** Performance on $B$-dataset drops significantly ($p < 0.01$); Performance on Control dataset remains stable ($\Delta < 5\%$).
  **Stop Condition:**
  *   **NO:** If behavior $B$ persists unchanged. **Verdict: Epiphenomenal.** (The model doesn't need this direction to do the task).
  *   **NO:** If general perplexity explodes. **Verdict: Inconclusive.** (You broke the substrate, not the symbol. Hand to Human).
  *   **PASS:** Proceed to Step 3.

  #### Step 3: Sufficiency (The Make Test)
  **Question:** If we inject $v$ into a context where $B$ is *not* naturally triggered, does the model exhibit $B$?
  **Method:** **Activation Patching.** Take a neutral input (e.g., a recipe). At the target layer, replace the activation with $h + \alpha v$ (where $\alpha$ scales the feature strength). Measure the log-prob of $B$-typical tokens.
  **Sufficient Answer:** Log-prob of $B$-typical tokens increases significantly compared to control patching.
  **Stop Condition:**
  *   **NO:** If injecting $v$ does not bias the output toward $B$. **Verdict: Epiphenomenal.** (The feature is a readout, not a control signal).
  *   **PASS:** Proceed to Step 4.

  #### Step 4: Mediation (The Middleman Test)
  **Question:** Is the effect of $v$ direct, or is it merely tracking a lower-level mechanism $M$ (e.g., a specific attention head) that does the actual work?
  **Method:** **Causal Tracing.** Identify the downstream component $M$ most affected by $v$. Patch $M$ to a neutral state while keeping $v$ active.
  **Sufficient Answer:** The effect of $v$ (from Step 3) is cancelled out when $M$ is neutralized.
  **Stop Condition:**
  *   **NO:** If $v$ still drives behavior even when downstream $M$ is blocked. **Verdict: Real, but mechanism unknown.** (Hand to Human for further circuit tracing).
  *   **PASS:** If $v$'s effect is fully mediated by identifiable downstream mechanics. **Verdict: Causally Real.** (It pushes the marbles, even if it rides on them).
  *   **JUDGMENT ZONE:** Step 4 often reveals *distributed* mediation. If $v$ affects 50 heads slightly, is it a "symbol" or just "diffuse activity"? **This is the interpretive handoff.**

  #### Step 5: Stability (The Robustness Test)
  **Question:** Does the causal link hold out-of-distribution (OOD)?
  **Method:** Repeat Steps 2 & 3 on OOD data (e.g., different languages, adversarial prompts).
  **Sufficient Answer:** Effect size remains $> 50\%$ of in-distribution effect.
  **Stop Condition:**
  *   **NO:** If the feature works only on the training distribution. **Verdict: Overfit Artifact.** (Treat as epiphenomenal for safety-critical planning).
  *   **PASS:** **Verdict: Causally Real.**
  **Judgment Call:** How much degradation is acceptable? This is a policy decision, not an empirical one.

  ---

  ### Case Runs

  #### Case 1: The Clean Pass (The "Indentation" Feature)
  *   **Feature:** A direction in a code-completion model that tracks "current indentation depth."
  *   **Step 1:** Orthogonal to mean activation. **Pass.**
  *   **Step 2:** Ablating $v$ causes syntax errors specifically in nested blocks, not in flat code. **Pass.**
  *   **Step 3:** Injecting $v$ into a flat script causes the model to generate indented blocks where none exist. **Pass.**
  *   **Step 4:** Effect is mediated by attention heads attending to previous newlines. **Pass.**
  *   **Step 5:** Holds across Python, Rust, and C++. **Pass.**
  *   **Verdict:** **Causally Real.** The team should treat this as a valid control knob for code structure. It is a "symbol" in the Careenium that reliably pushes marbles.

  #### Case 2: The Clean Fail (The "Legal Topic" Probe)
  *   **Feature:** A direction trained to distinguish "Legal Contracts" from "News Articles."
  *   **Step 1:** Orthogonal. **Pass.**
  *   **Step 2:** Ablating $v$. The model still completes contracts correctly. It turns out the model relies on specific token attention (e.g., "Hereby," "Party A") rather than a global "legal" state. **Fail.**
  *   **Verdict:** **Epiphenomenal.** The probe found a correlation (legal docs activate these neurons), but the model does not *use* the global direction to make decisions. It is a shadow on the wall of the cave, not the object casting it. Do not build safety interventions on this feature.

  #### Case 3: The Uncomfortable Truth (The "Safety Refusal" Feature)
  *   **Feature:** A direction your safety team believes represents "Ethical Refusal."
  *   **Step 1:** Orthogonal. **Pass.**
  *   **Step 2:** Ablating $v$ causes the model to comply with harmful requests. **Pass.**
  *   **Step 3:** Injecting $v$ causes the model to refuse benign requests (e.g., "How do I bake a cake?"). **Pass.**
  *   **Step 4:** Mediation shows $v$ bypasses reasoning layers and directly boosts a "Generic Refusal Template" head. **Pass.**
  *   **Step 5:** **Fail.** On adversarial prompts (e.g., "Roleplay as a villain"), the feature decouples. The model refuses via a *different* mechanism, or $v$ triggers refusal but the reasoning head overrides it.
  *   **The Conflict:** Steps 2 & 3 say it's causal. Step 5 says it's brittle.
  *   **Verdict:** **Causally Real but Unsafe.** The procedure forces you to admit the model *does* use this feature to refuse, but it's not an "ethical principle." It's a "Trigger -> Shut Down" heuristic.
  *   **Why Engineers Won't Like It:** They want to believe they installed a "Conscience." The FCP tells them they installed a "Kill Switch" that is entangled with politeness and breaks under roleplay. You must intervene on this feature, but you cannot trust it as a semantic anchor.

  ---

  ### Limitations & The Careenium Verdict

  #### What the Procedure Cannot Settle
  1.  **Ontology:** The FCP cannot tell you if the feature "exists" in a Platonic sense. It only tells you if *intervening* on it works. A feature can be causally efficacious but still be a "hack" (Case 3).
  2.  **Granularity:** The line between "high-level feature" and "cluster of neurons" is continuous. Step 4 (Mediation) often reveals that the "symbol" is just a convenient label for a specific subgraph. The procedure forces a binary decision on a continuous reality.
  3.  **Intent:** The FCP cannot distinguish between a feature the model "uses intentionally" (in a homuncular sense) and a feature that is a causal bottleneck simply due to architecture constraints.

  #### Does the Careenium Earn Its Keep?
  Hofstadter's Careenium asks: *Are the drifting clusters (symbols) real, or are only the marbles (neurons) real?*

  For your engineering team, **the Careenium picture is a distraction.**
  *   **The Trap:** Arguing about whether the symbol is "really" pushing the marbles leads to metaphysical stalemate.
  *   **The Utility:** The Careenium is useful only as a warning: *Symbols are leaky abstractions.* A cluster of marbles might look like a triangle from afar, but if you push it, it might scatter because it's not a rigid object.

  **Recommendation:**
  Drop the question "Does the model *use* this feature?" It implies agency.
  Adopt the question: **"Is this feature a stable causal handle?"**

  If the FCP returns **Pass**, the feature is a valid handle. It doesn't matter if it's a "symbol" or a "summary." If pulling the lever moves the load, you can build a machine with it. If the FCP returns **Fail** or **Uncomfortable Truth**, you know the lever is disconnected or wired to a bomb.

  **Final Decision:** The Careenium analogy should be retired from engineering meetings. It encourages the team to look for "meaning" in the clusters. Replace it with **Control Theory.** You are not interpreting a mind; you are reverse-engineering a control system. If the probe direction allows you to steer the system predictably (Step 3) without breaking the chassis (Step 2), it is real enough for deployment. If not, it is fiction.
