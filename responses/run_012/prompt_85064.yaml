answer: |-
  This is a sophisticated prompt that asks for a stress test of a theoretical framework against a complex historical reality. The distinction you outline—between **instrumental capture** (seeking influence to secure a static goal until influence becomes the goal) and **normative drift** (the goal itself mutating incrementally)—is a compelling heuristic for institutional decay. However, applying it to the English East India Company (EIC) reveals that the distinction is analytically sharp but historically entangled.

  Here is an analysis of how the EIC case maps onto your apparatus, where the map tears, and what remains contested.

  ### 1. Who or What is the "System"?

  The first friction point is the boundary of the system. The theory you describe implicitly assumes a unitary agent—a "system" that has *a* goal and *a* trajectory. The EIC was not unitary. It was a fractured principal-agent network.

  *   **The Court of Directors (London):** Theoretically the brain. Their stated goal was commercial profit and dividend stability.
  *   **The Servants (India):** The hands. Their goal was often personal enrichment (*nabobism*), which required local political power.
  *   **The Shareholders:** The capital. Their goal was return on investment, often indifferent to means.
  *   **The British State:** The latent sovereign. Its goal shifted from mercantilist protection to imperial governance.

  **Historical Consensus vs. Contestation:**
  It is settled history that there was a chronic divergence between the interests of the London Directors and the India-based servants. However, *why* this divergence persisted is contested. Some historians (e.g., P.J. Marshall) argue the Directors lost control due to information asymmetry and the sheer distance (a structural failure). Others (e.g., William Dalrymple) suggest a more conscious collusion where London tolerated rogue behavior because the geopolitical benefits outweighed the commercial corruption.

  **Implication for the Theory:**
  If the "system" is the **London Directorate**, the EIC looks like **Value Drift**. They quietly redefined the company from a trader to a tax collector (*Diwani* rights, 1765) to sustain dividends.
  If the "system" is the **Field Operation in Bengal**, it looks like **Influence-Seeking**. The local servants needed armies to protect trade; the armies needed revenue; the revenue required conquest. The original goal (trade) became decoration for the machinery of extraction.

  The theory struggles here because it asks for *one* failure mode, but the EIC demonstrates that **Influence-Seeking at the periphery can drive Value Drift at the center.** The servants grabbed power (Type A), and the Directors redefined the company's purpose to legitimize that power (Type B).

  ### 2. The Original Goal and the Turning Point

  **The Goal:**
  The 1600 Charter defined the goal as trade under monopoly. Profit was to come from arbitrage (buying low in India, selling high in London).

  **The Shift:**
  The critical juncture is the Battle of Plassey (1757) and the acquisition of the *Diwani* (right to collect taxes) in 1765.
  *   **Influence-Seeking Reading:** The Company did not abandon trade; it decided that the best way to secure trade was to eliminate competitors (French, local rulers). To eliminate them, it needed an army. To pay the army, it needed tax revenue. By 1770, the Company was a tax state that occasionally traded. The "trade" goal was decoration; the "revenue" machinery was the reality.
  *   **Value-Drift Reading:** The definition of "profit" changed. Initially, profit meant *surplus from exchange*. Later, profit meant *surplus from extraction*. No single board meeting voted to become a sovereign. It happened through a series of defensive wars, each justified as protecting the factory, until the factory was an empire.

  **Which explains more?**
  The **Influence-Seeking** reading explains the *mechanics* of the expansion better. The military buildup was deliberate and optimized for dominance.
  The **Value-Drift** reading explains the *legitimacy* better. The British public and Parliament accepted the transformation because it was framed as a gradual assumption of responsibility, not a hostile corporate takeover of a nation.

  **Uncertainty:** I cannot verify the private motivations of every Director during the 1760s. We rely on minutes and correspondence, which are performative. We do not know if the shift was a conscious strategic pivot or a panicked reaction to liquidity crises.

  ### 3. The Visibility Problem: Burke and the "Clean Signal"

  You note that the theory claims we "may never get a clean signal," yet the EIC transformation was loudly denounced, most famously by Edmund Burke during the impeachment of Warren Hastings (1788–1795).

  **Does this debunk the theory?**
  Not necessarily, but it refines it. Burke's prosecution proves that the *symptoms* were visible. However, the theory likely refers to the *causal mechanism* being invisible until it is too late.
  *   **The Signal:** People saw corruption, famine, and war.
  *   **The Noise:** Was this a few bad apples (Hastings) or the system working as designed?

  Burke argued it was systemic ("geographic morality"). The defense argued it was individual malfeasance. The fact that this debate raged for decades *without* the Company being dismantled immediately suggests the "signal" was ambiguous enough to allow for continued operation. The Regulating Act (1773) was an attempt to fix the system without admitting the system itself was the problem.

  **Verdict:** The theory holds if interpreted as "we cannot easily distinguish between system error and agent error in real-time." The EIC case confirms that loud denunciation does not equal clear diagnosis.

  ### 4. Is "Failure" the Right Word?

  This is the sharpest critique of the theoretical apparatus. The theory assumes a single evaluator (usually the system's survival or integrity). The EIC had multiple evaluators with conflicting success metrics.

  *   **For the Shareholders:** For much of the 18th century, it was a **success**. Dividends were paid, often artificially sustained by loans and territorial revenue.
  *   **For the Servants:** A massive **success**. The "nabobs" returned to Britain with fortunes that bought political influence.
  *   **For the Indian Population:** A catastrophic **failure**. The Bengal Famine of 1770 (killing ~10 million) is directly linked to EIC revenue policies and crop coercion.
  *   **For the British State:** Initially a **success** (geopolitical dominance), eventually a **liability** (cost of suppression leading to 1857 Government of India Act).

  **Implication:** The theory's concept of "failure" is normative. If the "system" is defined as *capital accumulation*, the EIC succeeded for a century. If the "system" is defined as *sustainable governance*, it failed. The theory risks obscuring this by treating "failure" as an objective state rather than a distributional outcome. The "drift" made some people rich *because* it failed others.

  ### 5. Verdict: Confirmation, Anomaly, or Mismatch?

  The EIC case suggests the distinction is **analytically useful but ontologically unstable** when applied to hybrid institutions.

  1.  **Where it works:** It helps separate the *military logic* (Influence-Seeking: we need more power to secure the trade) from the *corporate logic* (Value Drift: we are now a government that trades).
  2.  **Where it breaks:** It assumes the "goal" is stable enough to measure drift against. In the EIC, the goal was contested *internally* from the start. Was the Company a merchant guild or a state proxy? The "drift" was actually a resolution of that identity crisis.
  3.  **The "Invisible" Claim:** The EIC confirms that structural capture can be visible (everyone knew the Company ruled Bengal) but unactionable (Parliament couldn't stop it without causing economic collapse).

  **Is the distinction too coarse?**
  Yes, for this case. It treats "Influence" and "Values" as separable. In the EIC, the accumulation of influence (armies) *required* a change in values (from merchant to sovereign). You cannot have one without the other. The theory treats them as alternative paths; the EIC shows them as co-constitutive.

  ### 6. Historiographical Caveats and Uncertainties

  To be explicit about the limits of this analysis:

  *   **Intent vs. Outcome:** There is a live scholarly dispute regarding "conspiracy vs. muddle." Did the Directors *plan* to become a territorial power, or did they slide into it? (See: *The Anarchy* by Dalrymple vs. *The Corporation that Changed the World* by Robins). If it was a muddle, Value Drift is the stronger model. If it was a plan, Influence-Seeking is stronger. I cannot settle this; the archival record allows for both readings.
  *   **The 1770 Famine:** While linked to EIC policy, the exact causal weight of Company extraction vs. environmental factors is still debated among economic historians. I am treating the link as stronger than some cliometricians might accept.
  *   **The "System" Boundary:** I have treated the British State and the EIC as distinct until 1858. Some scholars argue the "Company-State" was a single entity from the start (Philip Stern). If Stern is right, the "drift" is an illusion; the goal was always sovereignty. This would invalidate the premise of the drift theory for this case.

  ### Summary Map

  | Feature | Theory Prediction | EIC Reality | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Goal Stability** | Type A: Goal static, means corrupt. Type B: Goal mutates. | Goal contested internally from the start. | **Theory Too Coarse** |
  | **Visibility** | Failure signals are noisy/late. | Symptoms loud (Burke), causes ambiguous. | **Theory Confirmed** (on ambiguity) |
  | **Evaluator** | Implicitly unitary (system health). | Plural (Shareholders vs. Subjects vs. State). | **Theory Blind Spot** |
  | **Mechanism** | Distinct modes (Influence vs. Drift). | Co-constitutive (Power required Value shift). | **Theory Anomaly** |

  **Conclusion:**
  The EIC does not cleanly fit either box because it was not a single system with a single goal. It was a network where **Influence-Seeking by the agents (India) forced Value-Drift on the principals (London).** The theory is valuable for diagnosing *how* an institution decays, but it fails to account for *who* is decaying when the institution is a fractured network of competing interests. The "failure" was not that the system lost its way; it was that the system worked exactly as designed for some stakeholders (servants, state) while catastrophically failing others (shareholders eventually, subjects immediately). The theory assumes the system *has* a "way" to lose; the EIC suggests the system *was* the conflict over where it was going.
