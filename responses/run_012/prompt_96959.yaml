  4. **Regarding the state of the universe before any mind existed, did matter exist waiting to be perceived?**
     * *Distinction:* Historical Independence
     * **Yes:** Go to 5.
     * **No:** Go to 6.

  5. **Does your inability to conceive of a tree existing unperceived prove that it cannot exist unperceived?**
     * *Distinction:* Validity of Conceivability Inference
     * **Yes:** Go to 7.
     * **No:** Go to 8.

  6. **Does the argument fail because we conceive unperceived objects all the time, or because it establishes only something about concepts?**
     * *Distinction:* Basis of Rejection
     * **We Conceive Them:** Leaf: Flat Denial.
     * **About Concepts:** Leaf: Conceptual Claim.

  7. **When the furniture in a room is unperceived because its only occupant sleeps, does it cease to exist?**
     * *Distinction:* Continuity of Objects
     * **Yes:** Leaf: Lapsing Idealism.
     * **No:** Go to 9.

  8. **If objects persist without human perception, is this because a permanent perceiver keeps them in being?**
     * *Distinction:* Source of Continuity
     * **Yes:** Leaf: Berkeley's Own.
     * **No:** Go to 10.

  9. **Does a camera recording a scene with no one watching count as perception sufficient for existence?**
     * *Distinction:* Definition of Perception
     * **Yes:** Leaf: Reduction to Sensations.
     * **No:** Go to 10.

  10. **Can an object exist that is in principle undetectable, existing only as appearance never as it is in itself?**
      * *Distinction:* Knowability of Substance
      * **Yes (Appearance Only):** Leaf: Appearance Only.
      * **No (As It Is):** Leaf: Flat Denial.

  ***

  **Notes on Branches, Combinations, and Leaves**

  **Unoccupied Combinations:**
  *   **Path 1 → 3 → 4 → 5 → 8 → 10 (No):** This combination leads to "Flat Denial" at Leaf 10, which duplicates Leaf 6. This path is logically redundant; if you reject the conceivability inference (Q5), you should not be answering questions about how objects persist without perception (Q8), as you already believe they exist independently. The tree forces Realists down the Q5 "No" branch immediately to avoid this duplication.
  *   **Path 1 → 3 → 4 → 5 → 7 → 9 (No) → 10 (No):** If you accept the inference (objects cannot exist unperceived), deny God, deny the camera counts, and deny appearances (claiming objects exist as they are), you have contradicted yourself. You cannot claim objects exist "as they are" independently while accepting the premise that they cannot exist unperceived. This combination is incoherent.

  **Inseparable Leaves:**
  *   **Flat Denial (Leaf 6) and Flat Denial (Leaf 10):** These are logically the same position reached via different historical intuitions (conceivability vs. substance). They are inseparable in commitment but separated here to accommodate readers who arrive at realism via different routes (psychological vs. ontological).
  *   **No Fact of the Matter and Nonsensical:** These are kept apart by Question 1 and Question 3. "Nonsensical" claims the question is linguistic garbage; "No Fact" claims the question is meaningful but reality is indeterminate. They are separable because one dissolves the question, while the other answers it with "neither true nor false."

  **Leaf Commitments:**
  *   **Verbal Illusion:** Philosophers are confused by their own language.
  *   **Nonsensical:** The question itself should not have been asked.
  *   **No Fact of the Matter:** Reality is indeterminate where no one looks.
  *   **Flat Denial:** Common sense is right and philosophers are wrong.
  *   **Conceptual Claim:** Philosophy changes nothing about how the world is.
  *   **Lapsing Idealism:** The world pops in and out of existence constantly.
  *   **Berkeley's Own:** God must perceive every speck of dust constantly.
  *   **Reduction to Sensations:** Objects are just logical constructions of possible sensations.
  *   **Appearance Only:** We can never know reality, only how it seems.
