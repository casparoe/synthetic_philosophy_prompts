  **MEMORANDUM**

  **TO:** Professional-Standards Subcommittee
  **FROM:** [Your Name], Palliative Care
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposed "Aspirational Commitments" Section

  **Recommendation**
  I recommend we **adopt the section with specific modifications**. We should incorporate the colleague's proposed "invisible clause" (stating nonperformance cannot be referenced in evaluation or discipline) and add a preamble stating that these acts are contingent on clinical capacity and circumstance. Without these safeguards, I agree with the dissent that this section risks undermining the very values it seeks to promote.

  **Reasoning: The Machinery of Supererogation**
  To decide this, we must clarify what kind of moral acts we are discussing. In ethics, we distinguish between *obligatory* acts (what you must do; failing is blameworthy) and *supererogatory* acts (what is good to do; failing is not blameworthy). Supererogatory acts are "above and beyond"—heroism, extraordinary kindness, or extra generosity. They are praiseworthy to perform but permissible to omit.

  The puzzle we face is this: If an act is the "best" thing to do, why isn't it required? The answer lies in the cost to the agent. Supererogatory acts often demand personal sacrifice (time, emotional energy) that cannot be fairly demanded of everyone as a baseline. If we require them, they cease to be gifts and become labor. If they become labor, they become resented.

  **Addressing the Surgeon's Objection**
  The dissenting surgeon argues that codification is self-underundermining: the moment you write a supererogatory act into a code, you transform it into an expectation. He is correct that institutions have a gravity that pulls aspiration toward obligation. In a hierarchical system like ours, "what is written" becomes "what is measured." If residents see these acts in a Code of Conduct, they will reasonably infer that omitting them makes them less competent, even if discipline is technically off the table. This destroys the supererogatory status because omission becomes quietly blameworthy.

  However, codification does not *inevitably* destroy supererogation if we explicitly block the migration from aspiration to evaluation. The surgeon's objection holds true for the draft *as written*, because it relies on a label ("aspirational") that institutional culture will overwrite. It does not hold true if we structurally firewall these acts from performance metrics.

  **The Middle Path and Fairness**
  The proposed middle path—appending a sentence that nonperformance is "invisible" to evaluation—is necessary but insufficient. To truly preserve the supererogatory nature of these acts, we must address the "demandingness" worry. Staff are stretched thin. If a physician cannot call a family because they are managing three critical codes, that omission must be morally neutral, not just professionally safe.

  Therefore, I propose two specific modifications:
  1.  **The Firewall:** Adopt the clause stating nonperformance may never be referenced in evaluation, promotion, or discipline.
  2.  **The Capacity Clause:** Add a preamble stating: *"These commitments are to be pursued only when clinical workload and personal capacity permit. Nonperformance due to competing clinical demands is not a deficiency."*

  **Conclusion**
  Is an unenforceable-but-listed standard an obligation in disguise? Only if we leave it ambiguous. By explicitly tying these acts to capacity and severing them from evaluation, we preserve their status as genuine gifts rather than hidden quotas. This protects our staff from unfair judgment while still signaling to residents the culture of excellence we hope they will embrace when they are able. We can honor the aspiration without weaponizing it.
