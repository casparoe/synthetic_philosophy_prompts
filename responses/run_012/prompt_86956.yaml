prompt: |-
  For most of my working life I have been a site reliability engineer, and I think in a fairly specific vocabulary: services and their users, SLAs and SLOs, uptime and latency, error budgets, incident severity, blameless postmortems, toil, capacity planning, and escalation paths. I am fluent in that vocabulary to the point of pedantry, and I have no training in political theory. Six months ago I moved to Singapore, and the argument I keep meeting here — and in accounts of China — is that a government earns the right to rule by delivering prosperity and order, and that this is a more honest title to authority than a ballot. I would rather understand the claim than merely react to it, so I want to run it through the only analytical vocabulary I actually command.

  Please restate the performance-legitimacy argument as faithfully as you can in my terms, treating the state as a service provider and citizens as users. Then give me the residue report, which is the part I care about: which elements of the argument carry over cleanly, which carry over only under distortion, and which have no expression in my vocabulary at all. I am especially curious whether the error budget — the amount of unreliability a service is allowed before its users lose patience — captures anything real about how much disorder a government can absorb before its legitimacy is spent, or whether the analogy collapses there. And I want your judgement about the residue itself: where the translation fails, is that a limitation of my framework, which cannot represent something the political argument genuinely contains, or is it evidence that the argument is less determinate than it sounds — for example, that it quietly presupposes a user who cannot switch providers?

  Throughout, keep separate what is settled from what is genuinely contested among people who know either subject, and do not present a contested reading of the politics or of the engineering as consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Site Reliability Engineer (SRE). Fluent in SRE vocabulary (SLAs, SLOs, error budgets, toil, etc.). No training in political theory. Recently moved to Singapore, encountering the "performance legitimacy" argument (government earns right to rule via prosperity/order, not ballots).
      *   **Task:**
          1.  Restate the performance-legitimacy argument using SRE vocabulary (State = Service Provider, Citizens = Users).
          2.  Provide a "Residue Report": What translates cleanly? What translates with distortion? What doesn't translate at all?
          3.  Specifically analyze the "Error Budget" analogy regarding disorder/legitimacy.
          4.  Provide judgment on the residue: Is the failure due to the SRE framework's limitations, or does it reveal indeterminacy in the political argument (e.g., locked-in users)?
      *   **Constraints:** Keep settled vs. contested distinct. Do not present contested readings as consensus. Maintain the SRE persona's analytical tone.

  2.  **Deconstruct the Performance-Legitimacy Argument:**
      *   *Core Claim:* Legitimacy is output-based (prosperity, order, safety), not process-based (elections, consent).
      *   *Implicit Contract:* If the state delivers X, it retains authority. If it fails X, authority is questioned.
      *   *Context:* Singapore/China model. Emphasis on long-term stability, economic growth, social harmony.

  3.  **Translate to SRE Vocabulary (The "Port"):**
      *   *State* $\rightarrow$ *Service Provider / Platform.*
      *   *Citizens* $\rightarrow$ *Users / Tenants.*
      *   *Governance/Rule* $\rightarrow$ *Service Availability / Uptime.*
      *   *Prosperity/Order* $\rightarrow$ *Throughput / Latency / Quality of Service (QoS).*
      *   *Elections/Ballots* $\rightarrow$ *User Feedback Loops / Canary Releases / Voting with Feet (but specifically denied here).*
      *   *Legitimacy* $\rightarrow$ *Service Level Agreement (SLA) Compliance / Trust.*
      *   *Disorder/Unrest* $\rightarrow$ *Errors / Incidents / Downtime.*
      *   *Error Budget* $\rightarrow$ *Tolerance for social friction before revocation of access/authority.*
      *   *Toil* $\rightarrow$ *Bureaucracy / Compliance overhead for citizens.*
      *   *Escalation Path* $\rightarrow$ *Petitioning / Ombudsman (vs. Voting).*

  4.  **Drafting the Translation (The "Port"):**
      *   Focus on the SLA. The "Performance Legitimacy SLA" promises high availability of order and throughput of prosperity.
      *   The "Ballot" is deprecated as a health check mechanism. Instead, passive monitoring (economic indicators) is used.
      *   The "Right to Rule" is the "Right to Operate," contingent on meeting SLOs.

  5.  **Developing the Residue Report:**
      *   *Clean Translations:*
          *   Output focus (SLOs vs. Prosperity).
          *   Incident response (Crackdowns/Stabilization vs. Mitigation).
          *   Capacity Planning (Five-year plans vs. Scaling).
      *   *Distorted Translations:*
          *   *Users:* Citizens aren't just users; they are also the infrastructure (in a way) or have no choice.
          *   *Error Budget:* In SRE, burning the budget triggers a feature freeze or engineering focus. In politics, burning the budget might trigger repression or revolution. The "consequence" is different.
          *   *Toil:* Bureaucratic toil is often a feature for control, not a bug to be eliminated.
      *   *No Expression (The Null Set):*
          *   *Consent:* SRE assumes implicit consent to use the service. Politics debates the *source* of consent.
          *   *Values:* SRE optimizes for reliability/speed. Politics optimizes for justice/freedom (which may conflict with reliability).
          *   *Monopoly:* SRE assumes multi-cloud or switching is possible (theoretically). The State is a hard monopoly.

  6.  **Analyzing the Error Budget (The Core Question):**
      *   *SRE:* Error budget is agreed upon. Burning it stops changes. It's a technical constraint.
      *   *Politics:* The "budget" is undefined. Who sets it? When is it burned?
      *   *Insight:* The analogy holds *descriptively* (regimes fall when they fail too much) but fails *prescriptively* (there is no agreed-upon SLO).
      *   *The "Switching" Problem:* In SRE, if a service burns its budget, users leave (churn). In State theory, "leaving" (emigration) is hard. This creates a "Vendor Lock-in" scenario.

  7.  **Judging the Residue (Framework vs. Argument):**
      *   Is the SRE framework too narrow? Yes, it lacks normative ethics (justice).
      *   Is the Political Argument indeterminate? Yes, "Prosperity" is vague compared to "99.99% Uptime."
      *   *Crucial Point:* The "Vendor Lock-in" (no switching) suggests the political argument relies on coercion or high exit costs, which SRE vocab usually treats as an anti-pattern (single point of failure).

  8.  **Refining the Tone:**
      *   Must sound like an SRE talking to an SRE. Use terms like "latency," "toil," "blast radius," "single point of failure."
      *   Avoid political preaching. Stick to structural analysis.
      *   Ensure distinctions between "Settled" (e.g., definition of SLO) and "Contested" (e.g., what constitutes a 'good' SLO for a state) are clear.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I treat the political argument fairly? *Correction:* Ensure I don't dismiss it as authoritarian immediately. Treat it as a "Performance SLA."
