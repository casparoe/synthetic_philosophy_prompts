  10. **Final Polish:** Organize into clear sections: The Port (Translation), The Residue Report (Clean, Distorted, Null), The Error Budget Analysis, and The Verdict on Framework vs. Argument. (Proceed to generate output based on this structure).

  *(Self-Correction Note during drafting the response)*: I need to be careful not to imply SRE is "objective" and Politics is "subjective." SRE has subjective elements too (what SLO to pick). I need to highlight that the *definition* of the SLO is the contested part in politics, whereas in SRE, once picked, it's technical.

  *(Refining the Error Budget)*: In SRE, burning the budget stops *changes*. In politics, burning the budget might stop the *regime*. That's a critical difference. One stops deployment, the other stops the service entirely.

  *(Refining the "User")*: In SRE, the user is external. In Politics, the user is also the power source (in democracy) or the resource (in autocracy). This needs to be in the "Distortion" section.

  *(Final Plan)*:
  1.  **The Port:** Translate the argument into an SLA/SLO document.
  2.  **Residue Report:** Three categories (Clean, Distorted, Null).
  3.  **Error Budget Deep Dive:** Specific analysis requested.
  4.  **Verdict:** Framework limitation vs. Argument indeterminacy.
  5.  **Caveats:** Settled vs. Contested markers.

