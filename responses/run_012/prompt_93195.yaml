answer: |-
  The impasse you have reached stems from a tension between two distinct grounds for responsibility: metaphysical identity and normative commitment. Your tentative principle focuses on identity, asking whether the state is the same agent, but your verdicts often rely on normative consistency, such as the prohibition on selective continuity in international law. To resolve this, you need a principle that treats state identity not as a brute fact but as a normative status that carries both privileges and liabilities. The principle that best coheres with your considered verdicts is the Principle of Normative Continuity and Sovereign Responsibility. This principle states that a state owes a formal apology for a historical wrong if and only if it claims the institutional continuity of the wrongdoer such that it asserts the same legal personality, or if it exercised sovereign authority over the victims at the time and failed to prevent the wrong, provided that the act constituted a moral violation regardless of its legality at the time, and further, that such an apology is not genuinely discharged unless it specifically names the wrong and victims, communicates effectively to them, and is accompanied by the cessation of any ongoing injustice.

  The first clause regarding institutional continuity addresses the core of your identity cases. It explains why a state owes an apology for a massacre ordered by a government one hundred and fifty years ago if it is the legal successor, as in your first case, because it claims the same legal personality. This same clause, coupled with the prohibition on selective continuity, explains your verdict that a state claiming continuity for treaties and debts cannot disclaim it for apologies. If the state asserts identity to collect assets or honor agreements, it must accept identity to inherit liabilities. This clause also clarifies why a state does not owe an apology for a colonial administration that was never part of its own political system or for a group that was then a separate polity, because in those instances, the institutional continuity is absent. The second clause regarding sovereign authority covers the cases where the state was not the direct perpetrator but held the duty of protection. This explains why a state owes an apology when its citizens acted as a mob and the government failed to protect the victims, as the sovereign duty was breached. Conversely, it explains why no apology is owed for wrongs committed by a private company where the state was not complicit, because neither institutional continuity nor sovereign failure is present. The provision that the act must be a moral violation regardless of legality at the time directly supports your verdict that legality under contemporary law does not excuse the state, grounding the obligation in moral reality rather than positive law.

  The second part of the principle concerning the discharge of the duty accounts for your verdicts on genuineness. An apology is a speech act that requires uptake to be successful. Therefore, issuing a statement in a language the victims do not speak fails the communication requirement, and failing to name the wrong or victims fails the specificity requirement. Furthermore, because an apology is a commitment to moral repair, it cannot be genuine while the state maintains institutions that continue the same injustice or while an occupation continues without effort to end it. These are not merely aesthetic failures but constitutive failures of the apologetic act itself. This unified principle handles the demographic issue as well, confirming that a state owes an apology even if the current population includes descendants of victims, because the obligation attaches to the corporate institution, not the biological constituents.

  Applying this principle to the case you have not listed, where a state apologizes for a wrong committed by a predecessor state that it has always denied was legitimate but from which it inherited a seat in an international body, the verdict must be that the state owes the apology. Inheriting a seat in an international body is a paramount assertion of legal personality and continuity. It is the functional equivalent of claiming the rights of the predecessor. Under the Principle of Normative Continuity, you cannot claim the privileges of continuity, such as international recognition and treaty rights, while disclaiming the liabilities of that same continuity. The denial of legitimacy is rhetorically convenient but normatively inconsistent with the acceptance of the seat. Therefore, the state owes the apology, and the cost of this position is that the state must reconcile its narrative of illegitimacy with its practical assertion of identity.

  There is, however, a cost to adopting this principle, and it requires you to refine or potentially give up one of your existing verdicts. Your third case states that a state that did not commit a wrong but knowingly inherited and continues to benefit from stolen land owes reparations but not an apology, because an apology is for one's own wrong. This verdict is coherent only if the original theft was not committed by the state's predecessor. If the land was stolen by the predecessor state, then under the first clause of this principle, the current state is the same agent and therefore the wrong is its own in the normative sense. You cannot maintain that successor liability applies to massacres but not to theft of land if the institutional continuity is the same. To preserve coherence, you must qualify this verdict to specify that no apology is owed only if the state is not the normative successor to the thief, perhaps because the theft was by private actors not ratified by the state at the time. If the theft was by the predecessor state, you must concede that an apology is owed alongside reparations. Additionally, you must accept that the bar for discontinuity in your second case, regarding a conquered state that repudiates the old regime, is quite high. Mere rhetorical repudiation is insufficient; there must be a substantive break in institutional continuity, such as a change in constitution or legal personality, to avoid the obligation. If the new regime simply replaces the personnel but maintains the state's legal identity, the apology is still owed.

  This approach costs you the comfort of separating benefit from responsibility in cases of state succession. It forces you to acknowledge that inheriting the state means inheriting its moral history, both the assets and the debts. It also demands that you treat the genuineness of an apology as a matter of structural justice rather than mere sentiment, binding the speech act to material change. However, the gain is a robust framework that avoids the arbitrariness of a list. It grounds the obligation in the very nature of political authority, which claims continuity to justify its power and therefore must accept continuity to answer for its crimes. This resolves your impasse by showing that the obligation to apologize is not about guilt in a personal sense, but about the integrity of the political agent over time. You must hold that the state is a moral person extended through history, and like any person, it cannot choose which parts of its biography to own based on convenience.
