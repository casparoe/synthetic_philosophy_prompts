answer: |-
  **Take-Home Final: Historical Fiction & Historical Time**

  **Question:**
  Fernand Braudel argues that the true protagonists of history are not people, but slow-moving structures: geography, climate, and disease. Human events are merely "foam on the surface." Yet the novelistic tradition demands agency, desire, and consequence. Consider this case: a barrier island off the Ligurian coast, occupied by a single fishing family from 1600 to the present. The sea steadily erodes the land; the family repeatedly rebuilds or drags their house inland. Over four centuries, no character's action changes the ultimate outcome: the sea wins.

  Using this case, argue definitively: Is this material a **novel** or a **diorama**? Do not define Braudel's three tempos; assume I know them. Do not hedge. If you argue it is a novel, you must locate where the plot lives if the outcome is predetermined. If you argue it is a diorama, you must explain why agency is the non-negotiable core of the genre.

  ***

  **Model Answer:**

  If we accept that plot requires the possibility of victory, then the Ligurian case is a diorama. It is a static display of inevitable decay, where human effort is merely decorative motion against a fixed background. However, to dismiss it as such is to misunderstand the specific power of historical fiction. The Ligurian case is not only a novel; it is a more honest novel than one where a protagonist conquers their era. The plot does not reside in the outcome—the sea winning is a geological certainty—but in the texture of the resistance.

  Braudel's structures are not just settings; they are antagonists. In traditional fiction, a villain can be defeated. In historical fiction grounded in the *longue durée*, the antagonist is time itself. The conflict shifts from "Will they save the island?" to "What does it cost them to try?" The agency here is not the power to alter history, but the capacity to witness it. When the family drags their house inland in 1750, then again in 1850, the action is repetitive, but the interiority is not. The plot lives in the changing justification for the rebuilding. The father who rebuilds out of stubbornness differs from the son who rebuilds out of duty, who differs from the granddaughter who rebuilds out of denial. The structure remains constant; the human relationship to that structure evolves.

  To call this a diorama is to demand that history be fair. It assumes fiction must validate the individual will. But the best historical fiction validates the individual experience even when the will is crushed. If the novelist focuses on the foam—the battles, the marriages, the specific storms—they are not ignoring the deep current; they are showing how the deep current feels from the surface. The tension comes from the dramatic irony inherent in the *longue durée*: the reader knows the sea wins, but the character must live as if they might win. That gap between knowledge and hope is where the story breathes.

  Therefore, the Ligurian case succeeds as a novel only if the author abandons the suspense of outcome for the suspense of endurance. The climax is not the final erosion, but the moment a character realizes the futility and chooses to stay anyway. This redefines agency not as mastery over environment, but as the dignity of persistence. A diorama shows us what happened; a novel shows us what it felt like to happen. The sea taking the island is geography. The family rebuilding despite knowing the sea takes the island is tragedy. Historical fiction is uniquely positioned to hold both truths simultaneously. To insist on a victorious protagonist is to write fantasy, not history. The novel survives the *longue durée* not by fighting it, but by inhabiting the loss it dictates.

  ***

  **Marking Scheme (20 Marks Total)**

  1.  **Definitive Stance (4 marks):** The essay must clearly argue "Novel" or "Diorama" without hedging or splitting the difference.
      *   *Loss:* Students lose marks here by writing "It depends on the execution" or "It can be both."
  2.  **Braudel Integration (4 marks):** The answer must use the concept of structural determinism without defining the three tempos.
      *   *Loss:* Students lose marks by wasting word count explaining *conjuncture* or *événements* instead of applying the logic.
  3.  **Case Study Specificity (4 marks):** The argument must reference the Ligurian details (sea, rebuilding, family, time span).
      *   *Loss:* Students lose marks by speaking only in abstract theory without grounding it in the island scenario.
  4.  **Theory of Agency (4 marks):** The answer must explicitly redefine or defend agency in the context of predetermined outcomes.
      *   *Loss:* Students lose marks by confusing "action" with "agency" (e.g., "They act, so there is agency") without addressing the futility.
  5.  **Genre Conclusion (4 marks):** The essay must conclude with a statement on what historical fiction is *for* based on the argument.
      *   *Loss:* Students lose marks by ending on a vague summary rather than a claim about the genre's purpose.

  Crux: The A answer redefines agency as endurance; the B answer demands agency as victory.
