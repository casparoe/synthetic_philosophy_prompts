  ## Participant Materials

  ### 1. Rules Sheet
  **Starting Piece:**
  `b`

  **Transformation Rules:**
  You may apply these rules to any string you have currently derived. You may apply them in any order, as many times as you like.

  1.  **Append:** Add the letters `ab` to the right end of your string.
      *   *Example:* `ba` becomes `baab`.
  2.  **Expand:** Replace any single letter `b` with the letters `aa`.
      *   *Example:* `bab` becomes `aaab` OR `baaa`.
  3.  **Contract:** Replace any adjacent pair `bb` with the letter `a`.
      *   *Example:* `abb` becomes `aa`.

  **Validity:**
  A string is valid only if it can be reached from the Starting Piece by a sequence of these transformations.

