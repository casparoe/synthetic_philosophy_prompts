      *   Rule 3 (`bb` $\to$ `a`): Removes 2 `b`s, adds 1 `a`. Weight change: $-4 + 1 = -3$.
  *   **Invariant:** All rules change the weight by a multiple of 3. Therefore, the **Weight Modulo 3** never changes.
  *   **Conclusion:** All derivable strings must have Weight $\equiv 2 \pmod 3$.
  *   **Target `ab`:** Weight = $1 + 2 = 3 \equiv 0 \pmod 3$.
  *   **Verdict:** Impossible.

