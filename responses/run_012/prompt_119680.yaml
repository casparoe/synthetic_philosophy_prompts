  ## Session Run Sheet (75 Minutes)

  **00:00 – 00:05 | Distribution & Setup**
  *   Hand out **Rules Sheet**, **Target Card 1**, and **Score Sheet** to each team.
  *   Instruct teams to appoint a Scribe (writes derivations), a Runner (submits claims), and a Challenger (checks other teams).
  *   **Facilitator Script:** "You have a starting piece and three transformation rules. Your goal is to produce the Target String exactly. You may work in any order. You score points for every unique string you generate, and bonus points for the Target. If you believe the Target cannot be produced, you may file a Blockade Claim. But be warned: if another team produces the string after you claim it is impossible, you lose points."

  **00:05 – 00:30 | Phase 1: The Grind (Target: `ab`)**
  *   Teams derive strings. Expect noise, paper shuffling, trial and error.
  *   Circulate. Do not answer "Is this possible?" Answer only "Does that follow the Rules Sheet?"
  *   **Scoring:** 5 points per unique valid string submitted. 50 points for Target `ab`.
  *   **Minute 25:** Stop the grind. Ask for Target submissions. (None will arrive).
  *   **Minute 30:** Announce: "No team has produced `ab`. The bonus for the Target is closed. However, a new category is open: The Blockade Claim."

  **00:30 – 00:45 | Phase 2: The Pivot (Proving Impossibility)**
  *   Hand out **Claim Form**.
  *   **Facilitator Script:** "You may now claim that `ab` is impossible. To score, you must identify a property that the Starting Piece has, which all three Rules preserve, but which the Target lacks. 100 points for a valid claim. If you file a claim, other teams have 5 minutes to hunt for a counterexample (the string `ab`). If they find it, they get 200 points and you lose 50. If they fail, you get the 100."
  *   Teams discuss. Look for the weight pattern (#a + 2#b).
  *   **Minute 45:** Collect claims. Verify the Modulo 3 argument (see Key). Award points.

  **00:45 – 01:05 | Phase 3: The Trap (Target: `abb`)**
  *   Hand out **Target Card 2**.
  *   **Facilitator Script:** "New Target: `abb`. You may use your previous property to test it. You may derive it. You may claim it is impossible for a *new* reason. Scoring is the same: 50 for derivation, 100 for a valid Blockade Claim."
  *   **The Dynamic:** Teams calculate the weight of `abb`. It matches the axiom (5 ≡ 2 mod 3). Their previous test says "Possible." They will try to derive it. They will fail.
  *   They must realize the first test was necessary but not sufficient. They must find the second argument (the `a`-count/precursor argument).
  *   **Minute 65:** Stop work.

  **01:05 – 01:15 | Debrief**
  *   Reveal the logic (see Facilitator Key).
  *   Map the experience to the course themes (Inside vs. Outside, Truth vs. Derivability).
  *   Dismiss.

