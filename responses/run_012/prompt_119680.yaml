  *   **The Trap:** Target `abb` has Weight $1 + 2 + 2 = 5 \equiv 2 \pmod 3$. It passes Argument A. Students will think it is derivable.
  *   **The Real Barrier:** Look at the last step required to make `abb`.
      *   Rule 1 ends in `ab`. `abb` ends in `bb`. (Rule 1 impossible as last step).
      *   Rule 2 creates `aa`. `abb` has no `aa`. (Rule 2 impossible as last step).
      *   Rule 3 (`bb` $\to$ `a`) must be the last step. It creates the `a`.
      *   Therefore, the precursor must have been `bbbb` (where `bb` became `a`).
  *   **The Second Property:** Count the number of `a`s.
      *   Starting Piece `b` has **0** `a`s.
      *   Rule 1 adds one `a`.
      *   Rule 2 adds two `a`s.
      *   Rule 3 adds one `a`.
      *   **Invariant:** Every rule application *increases* the number of `a`s. Any derived string (other than the start) must have **at least one `a`**.
  *   **Precursor Check:** The required precursor `bbbb` has **0** `a`s. It is not the Starting Piece (length 4 vs 1). Therefore `bbbb` cannot be derived.
  *   **Verdict:** Since `bbbb` is impossible, `abb` is impossible.

  ### 4. Plausible False Generalizations
  *   **"Length Parity":** Students may notice strings often grow. *Counter:* Rule 3 shrinks strings.
  *   **"Ends in b":** Students may think all strings end in `b`. *Counter:* `aa` is derivable (`b` $\to$ `aa`).
  *   **"Number of b's is odd":** *Counter:* `aa` has zero `b`s.
  *   **"If Weight matches, it's possible":** This is the specific misconception Target 2 is designed to break.

  ### 5. Board Work (For Debrief)
  Draw two boxes.
  *   **Box 1 (Inside):** List the Rules. List the Strings. Label: "What the rules allow."
  *   **Box 2 (Outside):** Write "Weight Mod 3". Write "Count of a's". Label: "What we say about the rules."
  *   Draw an arrow from Box 2 to Box 1 labeled "Constraint."
  *   Write: "Box 2 truths are not found in Box 1."

  ---

  ## Debrief Guide

  **1. The Experience of the Wall**
  *   Ask: "How did it feel when you found the Weight rule and saw `ab` failed?" (Relief).
  *   Ask: "How did it feel when `abb` passed the Weight rule but you still couldn't make it?" (Frustration/Confusion).
  *   **Point:** The first insight (Weight) felt like a master key. The second insight (Precursor/`a`-count) required looking at the *structure of the derivation steps*, not just the static properties of the strings.

  **2. Inside vs. Outside**
  *   **Inside:** Manipulating symbols according to rules. (Phase 1).
  *   **Outside:** Making statements *about* the symbols and rules. (Phase 2 & 3).
  *   **The Hofstadter Connection:** This is the distinction between the object language (the strings) and the metalanguage (our reasoning about the strings). The MU-puzzle uses the number of `I`s modulo 3. We used Weight modulo 3.
  *   **The Trap:** `abb` shows that finding *one* meta-property (Weight) does not exhaust the truth about the system. There may be deeper meta-properties (like the `a`-count precursor chain) that are harder to see.

  **3. The Awkward Point (Crucial for Philosophy of Mind)**
  *   "We stepped outside the system to prove `ab` impossible. But was *our reasoning* formal?"
  *   Yes. We used arithmetic (Mod 3). Arithmetic is itself a formal system.
  *   **Implication:** Stepping outside a system just means stepping *into a larger system*.
  *   **The Limit:** Can we always step into a larger system to solve the unsolvable? (Hint at Gödel: Eventually, you hit a statement that is true but unprovable in *any* consistent extension you can construct).
  *   **Mind vs. Machine:** If the mind is just a formal system, it should be stuck inside the box. But we stepped out. Does this prove the mind is not a formal system? (Let them debate this. Do not resolve it. The point is that the *experience* of stepping out feels different from grinding rules).

  ---

  ## Candid Account: What Will Go Wrong

  **1. The "Rule 3 is Useless" Discovery**
  *   **Prediction:** A sharp team will realize Rule 3 (`bb` $\to$ `a`) is never usable because `bb` is never derivable (due to the `a`-count invariant).
  *   **Risk:** They might announce this early, spoiling the `abb` trap.
  *   **Mitigation:** If a team claims "Rule 3 is dead," validate it privately. Tell them: "That is a strong claim. File it as a Blockade Claim for `abb`. If you can prove `bb` is never generated, you win the bonus." This turns the spoiler into a winning move for Phase 3 without telling the rest of the class.

  **2. Arithmetic Errors**
  *   **Prediction:** Students will miscalculate the Weight. `ab` = 3, `b` = 2. They might think 3 and 2 are "close enough" or mess up the modulo.
  *   **Mitigation:** When checking claims, ask them to show the arithmetic on the Claim Form. Do not correct them during Phase 1. Let them submit a false Blockade Claim and lose points when challenged. The penalty teaches precision.

  **3. Time Overrun on Phase 1**
  *   **Prediction:** Teams will enjoy the grinding and resist stopping at Minute 30.
  *   **Mitigation:** Be ruthless. "Pens down." The frustration of unfinished work is fuel for Phase 2. If they haven't felt the grind, the meta-solution won't feel like a relief.

  **4. The "So What?" Reaction**
  *   **Prediction:** Students may view this as a parlor trick. "Why do we care about `ab`?"
  *   **Mitigation:** In the debrief, explicitly link "Weight" to "Conservation Laws" in physics or "Type Safety" in programming. The specific letters don't matter; the structure of constraint does.

  ---

  ## Honest Note: What This Activity Cannot Do

  1.  **It does not teach them how to find invariants.** They will likely only find the Weight invariant if one student happens to like counting or has seen number theory before. You will have to supply the Weight argument in the debrief if no team finds it. *Preparation:* Be ready to teach the Weight argument as if they failed, framing it as "Here is the tool you needed."
  2.  **It does not solve the Halting Problem.** This system is decidable (we can prove things about it). Do not let them leave thinking all formal systems are this transparent. You must supply the caveat that for complex systems (like arithmetic itself), we cannot always find the "outside" view.
  3.  **It does not prove Non-Computationalism.** The "Mind vs. Machine" debate in the debrief will be tempting. Resist the urge to say "This proves humans aren't computers." This activity shows humans *can* step outside a specific small system. It does not show they can step outside *all* systems. You must supply the philosophical nuance that the "outside" reasoning was itself computational (arithmetic).

  **Final Instruction:** If no team finds the Weight invariant by Minute 30, do not give it to them. Instead, ask: "What stays the same when you change the string?" Guide them to counting. If they still miss it, reveal it in the debrief as the "Missed Key." The failure is part of the data.
