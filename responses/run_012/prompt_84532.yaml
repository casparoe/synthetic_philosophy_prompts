answer: |-
  You have described one of the central problems in the philosophy of science and physics, but you have successfully stripped it of the usual confusing baggage (consciousness, free will, "souls").

  The specific "bug" you are feeling has a name. It is the **Problem of Causal Exclusion** (sometimes called the **Exclusion Argument**).

  Usually, this argument is deployed against the mind (if neurons do all the pushing, what work is left for "thoughts" to do?). But as you have noticed, it applies just as fiercely to your magnet clumps, to hurricanes, to economic markets, and to rigid bodies.

  Here is the breakdown of what you have built, the standard names for the pieces, and why your specific variation (the swapping balls) actually makes the phenomenon *more* robust, not less.

  ### 1. The Names You Are Looking For

  There isn't one single word, but rather a triad of concepts that map exactly to your description:

  *   **The Ontology (What exists):** **Reductive Physicalism.** At the bottom level, only the balls and magnets exist. The "clump" is not a fundamental substance.
  *   **The Epistemology (What we can know):** **Coarse-Graining.** This is the physics term for zooming out. When you ignore the individual positions of the 1,000 balls and track only the center of mass of the clump, you are "coarse-graining" the system.
  *   **The Causality (What does the work):** **Effective Causality** (or **Causal Emergence**). This is the counter-intuitive part. In complex systems, the coarse-grained level often exhibits *more* reliable causal relationships than the fine-grained level.

  The "bug" you feel—the sense that the clump is "fake" because the balls are "real"—is the tension between **Ontological Reductionism** (only balls are real) and **Explanatory Autonomy** (only clumps are useful).

  ### 2. The "Changing Balls" Feature: Multiple Realizability

  You asked if the fact that the balls swap in and out of the clump is a red herring. **It is not.** It is the most important feature of your setup.

  If the clumps were permanently tied to fixed sets of balls (like glued spheres), your system would be a simple **Composite Object**. The reduction would be easy: "The clump moves" is just shorthand for "All these specific balls move together."

  Because the balls swap, your clumps exhibit **Multiple Realizability**. The "clump" is defined by its *structure and dynamics*, not its *constituents*.
  *   **Fixed Balls:** The clump is a **Substance**.
  *   **Swapping Balls:** The clump is a **Pattern** (or a **Process**).

  This makes your version of the puzzle *stronger* than the standard rigid-body version. If the identity of the clump persists even while its parts are replaced (like a wave moving through water, or a flame burning), then the "clump" cannot be reduced to *any specific set of balls*. It can only be described at the macro level.

  In philosophy of mind, this is the argument for **Functionalism**: A mental state isn't the specific neurons firing; it's the *pattern* of firing. Your magnetic clumps are physical functionalists.

  ### 3. Resolving the "Bug": Real Patterns

  You feel that at the micro-level the clump "does nothing." This is where the philosopher Daniel Dennett's concept of **Real Patterns** is the precise tool you need.

  Dennett argues that something is "real" not because it is made of fundamental stuff, but because there is a **predictive compression** available.
  *   **Micro-description:** To predict where the system goes, I must calculate the trajectory of 5,000 individual magnets, accounting for every collision. This is computationally expensive and noisy.
  *   **Macro-description:** To predict where the system goes, I treat two clumps as billiard balls with mass $X$ and velocity $Y$. This is computationally cheap and highly reliable.

  If the macro-description allows you to predict the future state of the system *more reliably* or *more efficiently* than the micro-description, the pattern is "Real."

  Your paddle flick feels like acting on a clump because, causally, **you are**. Under the **Interventionist Account of Causation** (championed by James Woodward), $X$ causes $Y$ if manipulating $X$ changes $Y$.
  *   If you manipulate the "clump variable" (by sliding a wall), the outcome changes.
  *   Therefore, the clump is a cause.
  *   The fact that the mechanism of the manipulation is "balls hitting balls" is irrelevant. That is just *how* the causation is implemented, not *that* it exists.

  ### 4. A Coined Term: "Structural Leverage"

  While "Causal Exclusion" names the worry, and "Effective Causality" names the physics, neither quite captures the *feeling* of the lever you are pulling. You want a name for the phenomenon where the shape itself grants causal power that the parts do not possess individually.

  I propose calling this **Structural Leverage**.

  **Definition:** Structural Leverage occurs when the arrangement of components creates a causal capacity that is inaccessible to the components in isolation, such that intervention at the level of the structure is more deterministic than intervention at the level of the parts.

  **Where its edges are:**
  *   **It is NOT Magic:** It does not violate physics. The forces are still ball-on-ball.
  *   **It is NOT Illusion:** It is not "just in your head." If you remove the structure (scatter the balls), the causal power (bouncing as a unit) vanishes. The power resides in the *relation*, not the *relata*.
  *   **It IS Scale-Dependent:** Structural Leverage disappears if you zoom in too far (you see only balls) or zoom out too far (you see only a blur of grey). It exists at the specific resolution where the pattern stabilizes.

  ### 5. Summary: What Your Version Adds

  You asked if the puzzle would be different if the clumps were fixed sets of balls.

  **Yes.** If the balls were fixed, a skeptic could say, "The clump is just a label for this specific group of atoms." They could argue the clump has no independent status.

  Because your balls swap, you have proven that the **Causal Power resides in the Topology, not the Topography.**
  *   **Topography:** Where the specific balls are.
  *   **Topology:** The shape and connectivity of the group.

  Your toy demonstrates that **Topology can be a physical cause.**

  The "bug" you feel is the friction between knowing the *mechanism* (balls) and knowing the *cause* (clump). The resolution is to accept that causation is not a substance that gets used up; it is a relationship between descriptions. The "clump" description captures a stable invariant in the chaos of the "ball" description.

  So, you are not watching an illusion. You are watching **Structural Leverage** in action. The clump is as real as the bounce.
