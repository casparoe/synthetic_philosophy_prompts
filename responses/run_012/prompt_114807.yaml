answer: |-
  Good evening. Thank you to the Society for inviting me to stand here, among the portraits of men who once decided the fate of provinces from desks not much larger than this podium. I see a room divided, though not by the usual lines. On my left, I suspect, are the scholars who can recite the Board's minutes from 1853 without checking their notes. On my right, those who know John Stuart Mill primarily as the man who argued we should be free to speak, think, and live as we choose, provided we do not harm others.

  I am a novelist, which means I am in the business of making things up. But for the last few years, I have been living in a very specific reality: the Examiner's Department of the India House in the 1850s. My protagonist is a junior clerk named Thomas. His job is to draft the despatches that travel by ship to Bombay and Calcutta. His nights are spent reading proofs of a book that would become *On Liberty*. His days are spent writing orders that deny liberty to millions.

  I want to talk to you about a single piece of paper. In the novel, it is Despatch Number 142. It is fictional, but it is built from the bone-structure of the real files you historians know better than I do.

  In this scene, Thomas is copying a draft concerning a land settlement in the North-West Provinces. A village headman has resisted a new assessment. The response drafted in London is not negotiation. It is coercion. The text explains that because the local population has not yet reached a state of rational maturity, they cannot be trusted with property rights in the way a man in Westminster might be. To improve them, to bring them toward civilization, the Company must first compel them.

  Thomas dips his pen. He writes the order. He dries the sand.

  Later that night, he goes home to a draft of Mill's essay. He reads the argument that over himself, over his own body and mind, the individual is sovereign. He reads that power can only be rightfully exercised over any member of a civilized community to prevent harm to others. He reads that compulsion is only justified for self-protection, not for the person's own good.

  Thomas puts the book down. He looks at his hands. They are the same hands. The ink is the same ink.

  This is the tension I wanted to inhabit. It is tempting, from our vantage point, to resolve this neatly. We want to say Mill was a hypocrite, that he secretly hated the empire while drawing his salary. Or we want to say he was a man of his time, that everyone thought this way, so we should not judge.

  But I do not think either of those comforts holds water. And I do not think the philosophy allows for them.

  For Mill, this was not a contradiction. It was a system. The harm principle, the sacred defense of individual liberty, was bounded. It applied to members of a civilized community. For those deemed backward, despotism was not a violation of liberty; it was a legitimate mode of rule, provided it was used as an instrument of their improvement. The coercion Thomas writes into Despatch 142 is not, in Mill's framework, unjust. It is pedagogical. It is the stern hand of the tutor who knows the lesson must be learned before the student can be free.

  To the historians in the room: You know the ledgers. You know how dry the language is. "Ordered," "Resolved," "Recommended." The violence is buried in the passive voice. It is bureaucratic, banal, and terrifyingly efficient.

  To the general readers: You know the beauty of the philosophy. The idea that every person is the best guardian of their own interests. The idea that diversity of opinion is a vital good.

  My novel asks what it does to a human being to hold both of these truths in their head at once. Thomas is not a villain. He believes in improvement. He believes in order. He believes in liberty. He does not see that the definition of "civilized" is the hinge upon which the whole moral structure swings. He does not see that the line between the student and the sovereign is drawn by the man holding the pen.

  I am conscious that there are people in this room whose ancestors were the subjects of those despatches. I am not here to put the East India Company on trial tonight; this is a dinner, not a tribunal. Nor am I here to ask for forgiveness on behalf of a fictional clerk. I am here to acknowledge that the architecture of liberal thought was built, in part, with materials sourced from the empire. The freedom enjoyed in London was conceptually dependent on the unfreedom administered in India. They were not separate projects. They were the same project, viewed from different sides of the map.

  When Thomas finishes Despatch 142, he seals it. It goes into a bag with hundreds of others. It travels to the docks. It is loaded onto a ship that will sail around the Cape.

  I want to leave you with the image of that ship. It is carrying the future of a village. It is carrying the revenue of a province. It is carrying the considered opinion of the greatest liberal mind of the nineteenth century.

  The ship sails smoothly. The ink is dry. The logic is consistent.

  So I ask you: When the ship arrives, and the order is read, and the headman is removed for his own improvement... who is free?
