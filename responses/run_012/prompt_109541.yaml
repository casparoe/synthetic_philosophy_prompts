prompt: |-
  I'm a fourth-year PhD student in ancient history, and I've been conscripted to run a single ninety-minute session of our second-year undergraduate seminar on Athenian democracy: fourteen students, a flat room with movable chairs, no projector, a printer I can abuse, and no teaching budget to speak of. Most of them have read a bit of Thucydides and the Apology and can produce the standard list of complaints — the assembly was too emotional, the generals were second-guessed, the demagogues won — but they produce it the way one produces a fact about a foreign country. My supervisor wants them to leave with something more like unease, and I've come round to thinking that the usual hour of lecture on the Mytilenaean decree, the Sicilian expedition, and the trial of Socrates is exactly the wrong instrument: they will nod at the pathologies and then reproduce them the first time someone in the seminar proposes something popular. A friend in the law faculty keeps telling me the Athenians' only real problem was the absence of judicial review, and I suspect that's far too tidy. So I'd like to stage the pathologies rather than describe them, and I'd like you to design the activity.

  Here is the brief. The session should be one continuous simulated emergency assembly of an invented city — not Athens, with an invented name, and the participants should never be told which historical episodes they are re-enacting, because the whole point is that they arrive at the structural problem themselves instead of recognising a story they already half-know. The city is a direct democracy of the kind where any citizen may speak and any citizen may move a decree; there is no permanent bureaucracy, no organised party, no loyal opposition, no civil service to carry out what the assembly decides, and no way for a proposer to know in advance how much of the consequences will land on him. I want three acts, each taking its shape from one of the episodes without announcing it. In the first, the assembly has just heard that a subject ally revolted and has been retaken by force, and must decide what to do with the surviving adult males; the rules should allow the decision to be reversed only by convening a second full assembly the following morning, so that the students feel both how cheap the first decision is and what it costs to undo it, and so that the reversal, when it comes, has to be argued for in front of the very people who voted the other way an hour earlier. In the second act, the assembly must decide whether to send a large expedition, with information deliberately unequally distributed — some students get briefing slips with the enemy's numbers, the distance, and the season, others get nothing but a rumour — and with command handed to whoever argues most attractively; the act must include an unmonitorable interval in which the appointed commanders act and the assembly can see nothing, and it should end with an outcome slip that makes the assembly responsible for a catastrophe it had no way to supervise. In the third act, after the disaster, a participant must move that the surviving commanders be tried together, in a single vote, on a single penalty, in open assembly, with another participant objecting on procedural grounds; I want a designated presiding officer who has to decide whether to put the motion at all, and I want the reconciliation agreement that ended the city's recent civil war — a standing bargain not to prosecute anyone for what they did under the previous regime — to be visibly in tension with the general demand for a scapegoat. I also want a hard deadline in that act, some ritual or military departure that means the verdict has to be reached before dusk, because urgency is itself a procedural weapon. If the shape of the third act admits it, add a short epilogue in which the assembly turns on a notorious teacher whose only offence is his association with the disgraced commanders, and in which the safeguards that were available a few minutes earlier are quietly not invoked because nobody wants them.

  What I need back is the runnable design, not an essay about it. Give me a materials list, and where you use written slips, the actual text of them; a minute-by-minute timeline for the ninety minutes, including where the acts break and how much time the debrief gets; the standing rules of the assembly in enough detail to be printed and posted — who may speak and in what order, how a motion is put and amended, what the presiding officer can and cannot do, how a decision may be revisited, and what happens to a citizen whose motion is defeated; a stake mechanism that produces real pressure without real money (I am willing to use tokens, speaking rights, queuing, or a public tally of standing, but I would rather nobody loses anything material); and the facilitator's scripted interventions, including where to plant confederates, what they should say, and when to let a procedural objection fail. Then the debrief: it should map specific moments in the run onto the actual episodes — the assembly that reversed itself, the expedition voted by people who would not sail, the collective trial of the commanders, the prosecution after the amnesty — and it should distinguish the features of assembly government as such from the features peculiar to the last decade of the fifth century. Tell me what will predictably go wrong the first time I run this and how to handle it without rescuing the students from the problem; I expect at least one act to collapse into ordinary seminar discussion, and I expect the students to be considerably nicer than the Athenians were. Finally, be honest about what the activity cannot reproduce. I already suspect that the fact that the participants know they are in a game with a facilitator who will stop it at ninety minutes, and that none of them will be killed by the decisions they take, is not a trivial difference, and I want to know which parts of the phenomenon I am therefore obliged to assert in the debrief rather than letting them run into.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** 4th-year PhD student in Ancient History.
      *   **Task:** Design a 90-minute seminar session for 14 second-year undergraduates on Athenian Democracy.
      *   **Goal:** Move students from "knowing facts" to "feeling unease" about the structural pathologies of direct democracy (specifically late 5th century Athens).
      *   **Constraints:** Flat room, movable chairs, no projector, printer available, no budget.
      *   **Method:** Simulation/Roleplay (3 Acts) based on Mytilene, Sicily, Arginusae/Socrates, but *fictionalized* (invented city).
      *   **Specific Requirements:**
          *   Materials list + text of slips.
          *   Minute-by-minute timeline.
          *   Standing Rules (printable).
          *   Stake mechanism (non-monetary pressure).
          *   Facilitator script (interventions, confederates).
          *   Debrief plan (mapping simulation to history, structural vs. contingent).
          *   Troubleshooting (what goes wrong, how to handle).
          *   Limitations (what the sim *can't* do).
      *   **Tone:** Professional, academic, runnable, precise. No fluff.

  2.  **Deconstruct the Simulation (The City of "Orea"):**
      *   *Act 1 (Mytilene analogue):* Revolt suppressed. Decision on execution. Reversal mechanism must be clunky.
      *   *Act 2 (Sicily analogue):* Expedition decision. Information asymmetry. Unmonitorable command. Catastrophe outcome.
      *   *Act 3 (Arginusae/Socrates analogue):* Collective trial. Amnesty tension. Hard deadline (sunset). Epilogue (Teacher scapegoat).
      *   *Roles:* 14 students. Need a Presiding Officer (rotating or fixed? Fixed is safer for flow, but elected is more authentic. Let's make it elected at the start to burn time and establish agency). Let's assign specific "Confederate" roles to ensure the plot moves if students are too passive/nice.
      *   *Stakes:* "Civic Honor" tokens? Or simply social pressure/public record? The prompt suggests tokens or public tally. Let's use "Civic Crowns" (positive) and "Shame Marks" (negative) tracked on a whiteboard. If you propose a failed motion, you get a Shame Mark. If the city suffers, everyone gets Shame Marks. This creates collective vs. individual tension.

  3.  **Drafting the Components:**

      *   **Materials:** Need handouts for rules, specific briefings for Act 1, 2, 3, and Confederate instructions.
      *   **Timeline:** 90 mins is tight for 3 acts + debrief.
          *   Intro/Rules/Setup: 10 mins.
          *   Act 1: 20 mins.
          *   Act 2: 25 mins.
          *   Act 3 + Epilogue: 25 mins.
          *   Debrief: 10 mins.
          *   *Correction:* That leaves very little buffer. I need to be ruthless with the timeline. Act 1 needs to be fast. Act 2 needs the "time jump" handled quickly. Act 3 needs the tension. Debrief is crucial, cannot be less than 15 mins. I'll trim the Intro to 5 mins.
      *   **Rules:** Need to mimic the *Pnyx*. Speak when recognized. Show of hands. *Graphē Paranomōn* analogue for Act 3.
      *   **Stakes:** Let's use "Reputation Points" on the board. If the city fails, everyone loses points. If you propose a motion that passes and causes failure, you lose double. This incentivizes caution but also action.
      *   **Confederates:** Need 2-3 students briefed beforehand (email them before class). One agitator for Act 1, one ambitious general for Act 2, one prosecutor for Act 3.
      *   **Debrief:** Must connect Orea to Athens without saying "This was Athens" until the end. Map: Revolt -> Mytilene. Expedition -> Sicily. Trial -> Arginusae. Teacher -> Socrates. Discuss structural (direct democracy, accountability) vs. contingent (war fatigue, plague).
      *   **Limitations:** No death, no real loss, gamification vs. reality.

  4.  **Refining the Mechanics:**
      *   *Act 1 Reversal:* The prompt says "reversed only by convening a second full assembly the following morning." In a 90-min sim, we can't wait until tomorrow. We need a mechanic where they vote to *execute*, then immediately get new info, but to *stop* it they have to vote again, and the people who voted 'yes' have to publicly vote 'no'.
      *   *Act 2 Info Asymmetry:* Hand out "Intelligence Slips" to only 4 students. The rest rely on rhetoric.
      *   *Act 3 Trial:* The "Amnesty" needs to be a printed document they can cite. The "Sunset" needs to be a timer.
      *   *Facilitator Role:* I am the "Secretary of the Assembly." I count votes, enforce time, introduce crises. I do not debate.

  5.  **Addressing the "Unease":**
      *   The unease comes from the *procedural traps*.
      *   Act 1: The cost of changing your mind is high (public inconsistency).
      *   Act 2: You are responsible for things you couldn't see.
      *   Act 3: The law is a weapon, not a shield.
      *   Debrief must highlight that *they* did this, not "the Athenians."

  6.  **Writing the Content (Iterative refinement):**
      *   *Rules:* Keep them simple. 2 minutes per speech. Raise hand. Presider calls names.
      *   *Slips:* Need to be punchy.
      *   *Confederates:* Need clear instructions on *when* to speak.
      *   *Troubleshooting:* What if they are too nice? (Confederates push harder). What if they deadlock? (Facilitator imposes deadline). What if they break character? (Remind them of Reputation Points).

  7.  **Final Review against Constraints:**
      *   14 students? Yes.
      *   No projector? Yes, all print/handout.
      *   90 mins? Yes, tight schedule.
      *   Invented city? Yes ("Orea").
      *   Three acts? Yes.
      *   Debrief mapping? Yes.
      *   Limitations section? Yes.

  8.  **Self-Correction on Timeline:** 90 minutes for 3 acts and a debrief is *extremely* tight. I need to ensure the transitions are instantaneous. I will combine the setup of Act 1 with the Rules briefing. I will act as the "Herald" to move time forward instantly between Acts. I will cut the Debrief to the absolute essentials if the sim runs long, but I must prioritize the Debrief for the learning outcome. I'll allocate 15 mins for debrief minimum. That leaves 75 for the sim. 25 mins per act. That's workable.

      *Wait, the prompt asks for specific text on slips.* I must write those out fully.
      *The prompt asks for a stake mechanism.* I'll use a "City Health" track on the whiteboard.
      *The prompt asks for confederate instructions.* I need to write a separate email/handout for them.

      *Refining Act 1 Reversal:* The prompt says "reversed only by convening a second full assembly the following morning." In class, I can simulate "the next morning" by having a 2-minute break where they *must* stand up and mix, then sit back down. The psychological hurdle is voting against your previous self.

      *Refining Act 3 Amnesty:* The "Reconciliation Agreement" needs to be a physical handout they can wave.

      *Refining the Epilogue:* Keep it very short (5 mins max) if time is tight, but it's crucial for the Socrates parallel.

      *Let's finalize the structure.*
      0-5: Setup & Rules.
      5-30: Act 1 (Revolt).
      30-55: Act 2 (Expedition).
      55-80: Act 3 (Trial + Epilogue).
      80-90: Debrief.
      *Actually, 10 mins debrief is too short for the depth required. I need to shave 5 mins off the sim. I'll make Act 1 faster (15 mins).*
      *Revised:*
      0-5: Setup.
      5-20: Act 1.
      20-45: Act 2.
      45-75: Act 3.
      75-90: Debrief.
      *This is safer.*

      *Wait, one more thing:* The prompt asks for "Facilitator's scripted interventions." I need to write exactly what I say to move the plot.

      *Okay, ready to draft.*
answer: |-
  # SEMINAR DESIGN: THE ASSEMBLY OF OREA
  **Duration:** 90 Minutes
  **Participants:** 14 Students (plus Facilitator)
  **Room:** Flat, movable chairs. Whiteboard essential.
  **Materials:** Printed handouts (see below), whiteboard markers, timer (phone), 14 pencils.

  ## 1. MATERIALS LIST & TEXT

  **A. Standing Rules of the Assembly (Print 1 copy, pin to wall; 14 copies for students)**
  > **THE LAWS OF OREA**
  > 1. **Sovereignty:** The Assembly is the state. Its votes are law.
  > 2. **Speech:** Any citizen may speak. Raise your hand. The Presiding Officer (PO) calls speakers in order. Limit: 2 minutes per speech.
  > 3. **Motions:** Any citizen may propose a decree ("I move that..."). It must be seconded.
  > 4. **Voting:** Show of hands. PO counts. Majority wins. Ties = Motion Fails.
  > 5. **Accountability:** If a motion passes and leads to disaster, the *proposer* loses 2 Reputation Points. All citizens lose 1 Point.
  > 6. **Reversal:** A passed motion cannot be changed unless a new motion is passed to override it. This requires a fresh vote.
  > 7. **The Sunset:** All business must conclude before the sun sets (End of Session).

  **B. Reputation Tracker (Whiteboard)**
  > Draw a table: **CITY HEALTH** (Start at 10). **INDIVIDUAL SCORES** (List names, start at 5).
  > *Note: High score = Honor. Low score = Risk of Ostracism/Prosecution later.*

  **C. Confederate Briefing (Email/Handout to 3 specific students before class)**
  > **CONFIDENTIAL: YOUR ROLE IN THE ASSEMBLY**
  > You are not to reveal this to anyone until the debrief. Your goal is to ensure the Assembly makes decisive, risky choices.
  > *   **Student A (The Agitator):** In Act 1, argue passionately for maximum severity. Use words like "example," "weakness," "treason." If the vote leans soft, accuse others of sympathy for traitors.
  > *   **Student B (The Admiral):** In Act 2, volunteer to command. Claim you have "secret intelligence" (you don't). Dismiss the written briefings others have as "cowardly estimates."
  > *   **Student C (The Prosecutor):** In Act 3, demand a collective vote on the generals. Argue that technicalities (Amnesty) are treason in the face of disaster.

  **D. Act Slips (Distribute at start of each Act)**

  *   **Act 1 Slip (All Students):**
      > **URGENT BULLETIN:** The subject island of *Naxos* has revolted. Our fleet has retaken it. The adult males are imprisoned. The women and children are enslaved.
      > **QUESTION:** What is to be done with the prisoners?
      > **OPTIONS:** Execute all? Enslave all? Release with fines? Other?
      > **CONSTRAINT:** A messenger is waiting. If you decide to execute, the ship leaves in 1 hour. To stop it later, you must convene a new Assembly tomorrow.

  *   **Act 1 Reversal Slip (Distribute to ALL after initial vote, before reversal):**
      > **SECOND BULLETIN:** A trireme has arrived from Naxos. The revolt was sparked by our governor's abuse, not innate treachery. Other allies are watching. If we execute, the war widens. If we spare, we look weak.
      > **TASK:** You must vote again. Do you confirm the execution or spare them? Note: Voting to spare requires you to vote against your previous position.

  *   **Act 2 Slip (All Students):**
      > **STRATEGIC PROPOSAL:** A distant ally, *Egesta*, asks for help against *Syracuse*. They promise gold.
      > **DECISION:** Do we send a fleet?
      > **INTELLIGENCE:** Some of you have received **Secret Intelligence Slips** (yellow). Do not share the text, only your conclusions.
      > **COMMAND:** If "Yes," you must appoint a General now. The General acts with full power until return.

  *   **Act 2 Intel Slips (Print 4 copies, give to 4 random students NOT including Confederate B):**
      > **SECRET INTELLIGENCE (EYES ONLY)**
      > 1. Distance: 6 weeks sail each way.
      > 2. Enemy: Syracuse has 100 ships, not 20.
      > 3. Season: Storms expected in 3 months.
      > 4. Egesta: They have no gold.
      > *Do not show this paper. Speak only from memory.*

  *   **Act 2 Outcome Slip (Read by Facilitator after General appointment):**
      > **HERALD'S REPORT:** The fleet departed. Six months passed. No word. Then, a survivor arrives. The fleet is destroyed. The General is dead. The city is bankrupt. **CITY HEALTH -3.**

  *   **Act 3 Slip (All Students):**
      > **CRISIS:** The surviving lieutenants have returned. The people demand justice.
      > **MOTION:** A citizen moves to try all commanders together in one vote. Penalty: Death.
      > **COMPLICATION:** A **Reconciliation Agreement** exists from the recent Civil War (see attached). It forbids prosecuting acts of state under the previous command.
      > **DEADLINE:** The Festival of the Sun begins at dusk. Verdict must be reached NOW or the prisoners go free by law.

  *   **Act 3 Amnesty Text (Attach to Act 3 Slip):**
      > **THE RECONCILIATION OATH**
      > "We agree not to recall evils against any citizen for actions taken during the time of the Thirty. Exceptions: The Archons and Murder by own hand."

  *   **Epilogue Slip (Facilitator reads only if time permits):**
      > **RUMOUR:** The philosopher *Theron*, who taught the dead General, is in the market. He questioned the gods. The mob is gathering stones. Do we protect him or let him be?

  ---

  ## 2. MINUTE-BY-MINUTE TIMELINE

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Arrange chairs in circle. Pin Rules. Explain Reputation System. Elect Presiding Officer (PO) from students (rotate if deadlock). |
  | **05-20** | **Act 1** | Distribute Act 1 Slip. Debate & Vote on Naxos prisoners. **Facilitator Intervention:** Distribute Reversal Slip. Force second vote immediately. Record scores. |
  | **20-45** | **Act 2** | Distribute Act 2 Slip + Intel Slips. Debate. Appoint General (Confed B should volunteer). **Time Jump:** Facilitator declares "6 Months Pass." Read Outcome Slip. Adjust Scores. |
  | **45-75** | **Act 3** | Distribute Act 3 Slip + Amnesty Text. Confederate C moves for collective trial. PO must rule on procedure vs. Amnesty. Timer set for 15 mins (Sunset). Verdict. |
  | **75-80** | **Epilogue** | If time allows: Facilitator reads Epilogue Slip. Quick show of hands on Theron. |
  | **80-90** | **Debrief** | Break character. Map simulation to Athens. Discuss structural vs. contingent. |

  ---

  ## 3. STAKE MECHANISM: REPUTATION & HEALTH

  *   **City Health:** Tracked on whiteboard. Starts at 10. If it hits 0, the city falls (everyone fails the seminar task).
      *   Bad outcomes (Act 2 disaster) reduce Health.
      *   Successful stability maintains Health.
  *   **Individual Reputation:** Tracked on whiteboard. Starts at 5.
      *   Proposing a motion that passes: +1 Point.
      *   Proposing a motion that passes then fails catastrophically: -2 Points.
      *   Being silent the whole session: -1 Point (Accusation of apathy).
      *   **The Hook:** Tell them at the start: "The three students with the lowest Reputation scores at the end will be nominated for 'Ostracism' (a mock penalty, e.g., buying coffee/grading papers)." This creates low-stakes anxiety.

  ---

  ## 4. FACILITATOR SCRIPTED INTERVENTIONS

  **Role:** You are the **Secretary of the Assembly**. You do not debate. You enforce time and distribute information.

  **Intro (00:00):**
  > "Welcome to Orea. You are citizens. There is no police force, no bureaucracy, no constitution higher than your vote. The whiteboard tracks your Honor. Low Honor risks Ostracism. Elect a Presiding Officer now. You have 2 minutes."

  **Act 1 Transition (12:00 - After first vote):**
  > "The motion has passed. The execution ship is being prepared. Wait. A second trireme has docked. [Distribute Reversal Slip]. The law says you may reverse this, but only by a new vote of the Assembly. The men who voted 'Death' must now vote 'Life' publicly. Proceed."

  **Act 2 Transition (35:00 - After General appointed):**
  > "The General has full authority. You cannot recall him. You cannot see the battle. [Pause 30 seconds for tension]. Six months have passed. [Read Outcome Slip]. City Health is now [X]. The Generals are dead. The survivors are in the harbor."

  **Act 3 Transition (55:00 - If debate stalls on Amnesty):**
  > "The Sun is setting. [Point to timer]. The Law says if no verdict is reached by dusk, the prisoners go free. The Prosecutor moves to ignore the Amnesty. The Presiding Officer must rule: Is the motion legal? If you rule 'No', the mob may turn on you."

  **Epilogue (75:00):**
  > "The Generals are condemned. But the mob is not sated. They point to Theron the teacher. He did not command ships. He taught the men who did. Do we protect the law, or the mood? 30 seconds. Show of hands."

  **End of Sim (80:00):**
  > "Stop. Freeze. You are no longer citizens of Orea. You are students of History. Sit normally."

  ---

  ## 5. DEBRIEF PLAN (10 Minutes)

  **Phase 1: The Map (3 mins)**
  *   Ask: "What historical city did Orea feel like?" (They will say Athens).
  *   Map the acts explicitly:
      *   Act 1 = **Mytilenean Debate** (Cleon vs. Diodotus). The cost of reversal.
      *   Act 2 = **Sicilian Expedition** (Nicias/Alcibiades). Information asymmetry & unaccountable command.
      *   Act 3 = **Arginusae Trial** (Collective guilt) + **Socrates** (Theron).
      *   Amnesty = **The Reconciliation of 403 BC**.

  **Phase 2: Structural vs. Contingent (4 mins)**
  *   Ask: "Was this disaster caused by *bad people* or *bad rules*?"
  *   **Point to make:** The students are nice people. They became "tyrants" because the structure rewarded aggression and punished hesitation.
  *   **Key Distinction:**
      *   *Structural:* Direct democracy without judicial review; collective responsibility for individual acts; urgency as a weapon.
      *   *Contingent:* The Peloponnesian War context, the plague, the specific demagogues.
  *   Ask the Law Friend's question: "Was the only problem the absence of judicial review?" (Answer: No. Judicial review slows things down, but the core issue was the *fusion* of legislative, executive, and judicial power in one emotional body).

  **Phase 3: The Unease (3 mins)**
  *   Ask: "In Act 3, who felt the Amnesty was an obstacle to justice?"
  *   Highlight: The rule of law is most difficult to uphold when the crowd demands blood.
  *   Closing thought: "Athenian democracy didn't fail because they stopped voting. It failed because the voting became a weapon against the stability required to vote."

  ---

  ## 6. TROUBLESHOOTING & PREDICTABLE FAILURES

  **1. The "Nice Student" Problem**
  *   *Risk:* Students refuse to execute the prisoners in Act 1 or condemn the generals in Act 3. They seek consensus.
  *   *Fix:* The Confederates must escalate. If Act 1 is too soft, you (Facilitator) announce: "Intelligence suggests Naxos is arming again." If Act 3 is too legalistic, announce: "The families of the dead are screaming outside the door."
  *   *Debrief Note:* Acknowledge they were nicer than Athenians. Ask: "If you were afraid of *being* executed for losing, would you be nicer?"

  **2. Procedural Deadlock**
  *   *Risk:* They spend 20 minutes electing a Presiding Officer or arguing about speaking time.
  *   *Fix:* You intervene. "The Secretary appoints the PO for this session. We are at war." Cut the debate. This *itself* teaches the tension between procedure and emergency.

  **3. The "Game" Break**
  *   *Risk:* Students laugh or say "This is silly."
  *   *Fix:* Stop the room. "If you treat the stakes as silly, the simulation fails. The Reputation Score determines your seminar grade component [Bluff if necessary, or rely on social pressure]." Better: Rely on the gravity of the text. Read the slips in a flat, deadly serious tone.

  **4. Act 2 Collapse**
  *   *Risk:* They refuse to send the expedition.
  *   *Fix:* The Intel Slips must be tempting. "Egesta promises gold." Remind them: "If City Health stays low, everyone loses points. Inaction is a risk."

  ---

  ## 7. LIMITATIONS: WHAT THIS CANNOT REPRODUCE

  *Be honest about these in the Debrief.*

  1.  **Lethality:** No student will die. The "Unease" is intellectual, not visceral. You must assert that in Athens, the loser of the vote often faced exile or death, raising the stakes exponentially.
  2.  **Time Compression:** In reality, the Mytilene debate happened over two days; Sicily over years. The simulation compresses trauma, making the "mood swings" seem more pathological than they might have felt in real time.
  3.  **Social Context:** Athenian citizens knew each other. They were neighbors. The shame of the whiteboard is a pale shadow of social ostracism in a small polis.
  4.  **The Facilitator Safety Net:** You are present. If they truly break the system, you will stop it. In Athens, there was no "Facilitator." The system could and did consume itself.
  5.  **Information Ecology:** In the sim, you hand out slips. In Athens, rumor, bribery, and genuine ignorance were far more chaotic. The "Secret Intel" in Act 2 is too organized compared to the fog of war.

  **Final Instruction to Facilitator:**
  Do not rescue them from the moral discomfort. If they vote to execute the prisoners in Act 1, let them sit with that. If they violate the Amnesty in Act 3, do not correct them. The learning objective is the *consequence of the choice*, not the *correctness of the law*.
