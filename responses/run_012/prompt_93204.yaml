      *   **Team Reasoning:**
          *   *Marcus:* It's just a heuristic for I-intentions.
          *   *Elena:* It's the mechanism of the We-intention.
          *   *Resolution:* It's a relabeling unless it posits a new ontological category.
      *   **The Climax/Ending:**
