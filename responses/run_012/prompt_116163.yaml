answer: |-
  # Activity Design: The Invariant Game

  **Goal:** Simulate the cognitive shift between varying parameters within a concept (twisting knobs) and redefining the concept's dimensional space (adding knobs).
  **Time:** 75 Minutes
  **Participants:** 18 Grad Students (6 groups of 3)
  **Materials:** Whiteboard + markers, Index cards (3 per group), Timer.

  ## 1. The Setup (0:00 – 0:10)

  **The Story:**
  Write this exactly on the whiteboard. Do not title it.
  > "Arthur walked into the room.
  > He saw the box on the table.
  > He opened the box.
  > He took the coin.
  > He put the coin in his pocket."

  **The Instructions:**
  Tell the room: *"We are testing category stability. You are not writing art. You are engineering variations. Your goal is to keep the 'Identity' of this story intact while changing its features."*

  **Grouping:**
  Divide into 6 groups of 3. Move tables so groups face each other.

  **The Variable List (Round 1 Constraints):**
  On the board, list the **Explicit Variables** derived from the text. Ask the class to confirm them (this gets buy-in).
  1.  **Agent:** (Arthur)
  2.  **Location:** (The Room)
  3.  **Object:** (The Box)
  4.  **Action:** (Open/Take)
  5.  **Item:** (The Coin)

  **Rule:** In Round 1, you may change **one and only one** Explicit Variable per variation.

  ## 2. Round 1: The Twist (0:10 – 0:30)

  **Task:**
  Each group must produce **three variations** of the story on index cards.
  *   Variation A: Change the **Agent**.
  *   Variation B: Change the **Item**.
  *   Variation C: Change the **Action**.

  **Constraint:** The story must still feel like "The Arthur Story." If it feels like a different story entirely, you have twisted the knob too far.

  **Scoring (The Logic Check):**
  Groups swap cards. They do not judge "quality." They judge **Compliance**.
  *   Did they change only the assigned variable? (Yes/No)
  *   Is the story still recognizable as the source? (Yes/No)
  *   *Facilitator Note:* Walk around. If a group writes "Arthur walked into the room... he ate the coin," stop them. Ask: "Is 'eating' a variation of 'taking', or a breakage of the physics?" Let them argue. Do not resolve it yet.

  **Time:** 15 minutes work, 5 minutes swap/score.

  ## 3. Round 2: The Breach (0:30 – 0:50)

  **The Shift:**
  Tell the room: *"Round 1 was about staying inside the lines. Round 2 is about testing the boundary. You must produce **one variation** that feels like the 'Arthur Story' but violates the Explicit Variable list."*

  **The Catch:**
  You cannot change an Explicit Variable (Agent, Location, Object, Action, Item). You must change something **not listed on the board**.

  **Task:**
  1.  Write the variation on a large index card.
  2.  **Crucial Step:** Below the story, you must write the **New Dimension**. (e.g., "We changed the *Time Period*" or "We changed the *Motivation*").
  3.  You must also write the **Invariant**. (e.g., "The Invariant is *Transfer of Ownership*").

  **Scoring (The Objection Protocol):**
  This is where the "subjectivity" trap is handled procedurally.
  1.  Group posts their card on the wall.
  2.  Other groups have 30 seconds to review.
  3.  Any group can raise an **Objection**.
  4.  **Objection Rule:** You cannot say "I don't like it." You must say: *"Your stated Invariant is insufficient."*
  5.  **Example:** Group A says Invariant is "Transfer of Ownership." Group B objects: "If I write 'Arthur stole the coin from a ghost,' ownership didn't transfer, but it's still the story. Your Invariant is wrong."
  6.  If an objection stands (facilitator arbitrates based on logic, not taste), the submitting group loses the point. If no valid objection is raised, they gain 5 points.

  **Time:** 15 minutes work, 5 minutes gallery walk/objections.

  ## 4. The Debrief (0:50 – 1:15)

  **Step 1: The Data (5 mins)**
  Ask: "Which round was harder?" (Usually Round 2).
  Ask: "In Round 2, did anyone change the *medium*? (e.g., made it a poem). Did anyone change the *physics*? (e.g., teleported the coin)."
  Point out that in Round 1, everyone knew the rules. In Round 2, you had to invent the rule you were breaking.

  **Step 2: The Reveal (10 mins)**
  Now you can use the forbidden words.
  *"What you did in Round 1 was **Twisting a Knob**. You had a defined space (Agent, Location, Item) and you moved a slider. The cognitive load was low, but the risk was 'breaking the concept' by twisting too far."*

  *"What you did in Round 2 was **Adding a Knob**. You had to realize that 'Time' or 'Physics' or 'Perspective' was a dimension that existed, but wasn't being varied. This is where actual creativity lives. It's not moving the slider; it's realizing there is a second slider nobody saw."*

  *"The reason Round 2 felt unstable is that **the space doesn't announce its edges.** You couldn't know if you were making a brilliant new variation or just nonsense until you tested it against the group. That uncertainty is the job."*

  **Step 3: Hofstadter (5 mins)**
  Draw a 2D graph on the whiteboard.
  *"Douglas Hofstadter describes concepts as points in a multi-dimensional space. Most 'creative' work is just finding a coordinate nobody has visited yet (Round 1). But the breakthroughs happen when you realize the graph needs a Z-axis (Round 2). You didn't just move the point; you changed the geometry."*

  **Step 4: The "Tradition" Caveat (5 mins)**
  Address the limitation directly.
  *"Notice something: I didn't tell you what made a 'good' variation. I only told you how to make a 'valid' one. In the real world, validity isn't enough. You need **Taste**. Taste comes from knowing the tradition so well you know which new knob will sing and which one will break the machine. We simulated the structure of creativity today, not the expertise. You felt the mechanism, but not the weight."*

  ---

  ## Predictable Failure Modes & Fixes

  **1. The "It's All Subjective" Revolt**
  *   **What happens:** During Round 2 objections, a Philosophy student argues that "Identity" is inherently subjective and the scoring is flawed.
  *   **The Fix:** Do not debate philosophy. Enforce the **Procedural Constraint**. Say: *"For the purpose of this simulation, Identity is defined by the Group's Stated Invariant. The objection is not about Truth, it's about Consistency. Did their example violate their own rule?"* This moves it from metaphysics to logic.

  **2. The "Sci-Fi" Explosion**
  *   **What happens:** In Round 2, a group changes the story to "Arthur beamed the coin from Mars." The group claims the Invariant is "Acquisition."
  *   **The Fix:** This is actually a *success* for the activity (they added a Physics knob). Let the other groups object if they feel "Acquisition" is too broad. If "Acquisition" covers *everything*, point out that a concept that includes everything includes nothing. This teaches **Conceptual Tension**.

  **3. Running Out of Time**
  *   **What happens:** Round 2 takes too long because groups struggle to define the "New Dimension."
  *   **The Fix:** Hard stop at 0:50. Even if they haven't finished the card. The debrief is more important than the artifact. Use their frustration as data for the debrief ("Why was defining the dimension harder than changing the variable?").

  **4. The Dominant Designer**
  *   **What happens:** In mixed groups, the Design student takes over the writing, CS analyzes the logic, Philosopher argues the semantics.
  *   **The Fix:** Assign roles for Round 1 only. (Writer, Checker, Timekeeper). For Round 2, require all three signatures on the "Invariant" line. This forces consensus on the abstract definition.

  ## What This Activity Cannot Reproduce

  You are correct to be suspicious. Here is the honest limitation you should voice in the final 5 minutes:

  1.  **It Cannot Simulate Value:** We scored based on *validity* (does it fit the rule?), not *value* (is it useful/beautiful?). In the real world, adding a knob is easy; adding the *right* knob is hard. This activity makes adding a knob feel like a clever trick. In reality, it requires deep domain knowledge to know which dimension matters.
  2.  **It Cannot Simulate Resistance:** The "whiteboard space" is frictionless. Real creative spaces have resistance (materials break, code bugs, clients say no). This activity is cognitive only; it lacks the somatic feedback of fighting with a medium.
  3.  **It Flattens History:** Hofstadter's space isn't static; it evolves. Today's "New Knob" is tomorrow's "Standard Slider." This session is a snapshot. It doesn't show how a new dimension eventually becomes a standard constraint for the next generation.

  ## Facilitator Cheat Sheet (Do Not Read Aloud)

  *   **Round 1** = Exploration of **Extension** (Moving within the set).
  *   **Round 2** = Exploration of **Intension** (Changing the definition of the set).
  *   **The "Click" Moment:** Watch for the group in Round 2 that changes the *perspective* (e.g., "The Coin saw Arthur..."). This is the clearest example of adding a "Perspective Knob" that wasn't in the original text. Highlight this in debrief.
  *   **If they ask "What is the right answer?":** Your answer is always "What is your Invariant?" Force them to own the definition of the space.
  *   **Hofstadter Reference:** *Fluid Concepts and Creative Analogies* (1995), specifically the discussion on "Conceptual Slippage."

  ## American English Usage Notes
  *   Use "Grad students" not "Postgrads."
  *   Use "Whiteboard" not "Flipchart."
  *   Ensure the tone is pragmatic. Avoid overly academic jargon until the debrief.
  *   Timekeeping should be announced loudly ("10 minutes remaining," "5 minutes").

  This design forces them to experience the *friction* of defining a concept space before they are given the vocabulary to describe it. They will leave feeling the difference between iteration and innovation, even if they can't yet name it.
