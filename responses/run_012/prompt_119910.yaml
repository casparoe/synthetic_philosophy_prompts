      *   **Interlocutor:** The user's brother-in-law (BIL).
      *   **BIL's Argument:** MFT shows morality is like taste (subjective, biological, no truth value). Liberals have 2 foundations (Care, Fairness), Conservatives have 5 (plus Loyalty, Authority, Purity). Therefore, political disagreement is just different "taste profiles," and no one is objectively right. "You can't get an ought from a tongue."
