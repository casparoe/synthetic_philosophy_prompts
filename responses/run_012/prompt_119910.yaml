answer: |-
  Your brother-in-law (BIL) is channeling the psychologist Jonathan Haidt, who popularized Moral Foundations Theory. Haidt himself uses the "taste bud" analogy. Your BIL is right that this is a powerful way to understand *why* people disagree, but he is wrong about what that implies for *truth*.

  He is making a classic move in philosophy called the **Genetic Fallacy**: assuming that because you can explain *where* an idea comes from (biology/psychology), you have explained away its *truth value*.

  Here is the breakdown of his analogy, where it cracks, and why his conclusion doesn't hold up.

  ### 1. Mapping the Analogy
  Let's lay out the "Taste Bud Theory" exactly as he sees it, mapping the moral concepts to the food concepts.

  | Moral Concept | Food Analogy | The Logic |
  | :--- | :--- | :--- |
  | **Moral Foundations** (Care, Fairness, etc.) | **Taste Receptors** (Sweet, Salty, Bitter) | Innate biological hardware we are born with. |
  | **Moral Judgments** ("That's unjust!") | **Flavor Perceptions** ("That's delicious!") | The immediate feeling produced by the hardware. |
  | **Moral Reasoning** (Debating policy) | **Food Criticism** (Arguing about recipes) | Trying to explain the feeling to others. |
  | **Political Tribes** (Left/Right) | **Cuisines** (Vegan vs. Carnivore) | Cultural clusters of preferences. |
  | **Moral Truth** | **Objective Deliciousness** | The claim that one flavor is "correct." |

  **His Conclusion:** Just as there is no objective fact about whether cilantro tastes like soap or citrus, there is no objective fact about whether Authority or Care is more important. It's just biology.

  ### 2. Where the Taste Bud Picture Breaks Down
  Taste has specific features that morality does not share. If morality shared these features, your BIL would be right. But it doesn't.

  **Feature A: Privacy vs. Public Consequence**
  *   **Taste:** If I eat a bug and like it, it only affects me. My enjoyment is private.
  *   **Morality:** If I steal your car, it affects *you*. Moral judgments are about how we treat each other in the shared world.
  *   **The Break:** You can't argue someone out of liking cilantro. You *can* argue someone out of stealing a car by pointing out the harm done to the victim. Morality has external consequences; taste does not.

  **Feature B: Error and Correction**
  *   **Taste:** I cannot be "wrong" that I like chocolate.
  *   **Morality:** I can be "wrong" that slavery is acceptable.
  *   **The Break:** We believe moral progress is real. If morality were just taste, the abolition of slavery wouldn't be "progress," it would just be a "change in menu preference." Most people (including likely your BIL) believe some moral changes are actual improvements, not just swaps.

  **Feature C: The "2 vs. 5" Trap**
  *   **Taste:** Having more taste buds doesn't make you a better eater.
  *   **Morality:** Your BIL implies conservatives have the "whole set" (5 foundations) while liberals only have "two" (Care/Fairness).
  *   **The Break:** Even if conservatives score higher on all 5, that doesn't make them morally *right*. The "Authority" and "Purity" foundations have been used to justify segregation, caste systems, and persecution. Having a sensitivity to "Purity" isn't a virtue if it leads you to hate gay people. Having a "sweet tooth" isn't good if it gives you diabetes. More sensors $\neq$ better truth.

  ### 3. The "Trainable Taste" Counter-Argument
  You mentioned reading that taste can be trained. This is a massive hole in his argument.

  *   **Acquired Taste:** Nobody likes black coffee or blue cheese the first time. We learn to appreciate them because we understand their complexity or cultural value.
  *   **Moral Education:** If taste can be educated, so can morality. We teach children not to hit (Care) and to wait their turn (Fairness). We also teach adults to question blind Loyalty or rigid Authority.
  *   **The Implication:** If morality is like *trained* taste, then we can argue about it. We can say, "Your sensitivity to Authority is leading you to support a tyrant; you need to recalibrate your palate toward Care." The fact that biology starts the process doesn't mean reason can't refine it.

  ### 4. A Better Analogy: Vision, Not Taste
  If you want to keep the biological analogy but fix the logic, swap **Taste** for **Vision**.

  *   **Foundations = Cones and Rods:** We all have biological hardware for seeing.
  *   **Judgments = What we see:** "I see a snake."
  *   **Reality = The World:** There is actually a snake (or a stick) out there.
  *   **Politics = Comparing Notes:** "I see a cliff." "No, that's a road."

  **Why Vision is better:**
  1.  **Blind Spots:** If you are colorblind, you miss red. If a political group ignores the "Care" foundation, they are morally colorblind to suffering. That is a defect, not just a difference.
  2.  **External Reality:** Vision is about mapping the world accurately. Morality is about mapping human well-being accurately.
  3.  **Correction:** If I think a stick is a snake, you can show me it's a stick. We can correct moral errors (like believing the earth is flat or that women can't vote) just like we correct visual errors.

  In the Vision analogy, psychology explains *why* we might miss something (we're standing in the dark, or we're colorblind), but it doesn't mean there isn't a real object out there to be seen.

  ### 5. Does His Conclusion Survive?
  **Conclusion:** *"The psychology of left and right can't tell us who's right."*

  **Verdict:** **Half-True, but misleading.**

  *   **True:** Psychology alone cannot give you moral truth. Knowing *why* someone believes in God (brain chemistry) doesn't prove God exists or doesn't. Knowing *why* someone values Loyalty (evolutionary tribe survival) doesn't prove Loyalty is good. This is the "Is-Ought" problem he mentioned.
  *   **False:** He uses this to imply *no one* can be right (Relativism). But just because the *origin* of the belief is psychological doesn't mean the *content* of the belief lacks truth.

  **The "Getting Something for Free" part:**
  He is assuming that because moral intuitions are biological, they are **arbitrary**.
  *   **Example:** Hunger is biological. Does that mean "eating food" is just a subjective taste with no truth value? No. The truth is: *If you want to live, you ought to eat.*
  *   **Morality:** If we agree that "suffering is bad" (a biological fact about pain), then moral claims become testable. "Does this policy reduce suffering?" is a question with a right and wrong answer, regardless of our taste buds.

  ### Summary for your next conversation
  Tell him this:

  1.  **Taste is private; Morality is public.** We don't legislate based on what you like for dinner. We legislate based on harm and rights.
  2.  **Biology isn't destiny.** We have a biological urge for violence, but we built a justice system to curb it. We can override our "taste buds" with reason.
  3.  **The Vision Swap.** Morality is more like eyesight than taste. We can be blind to certain harms. Pointing out that blindness isn't saying "your taste is wrong," it's saying "you're missing something real."
  4.  **The Trap.** Just because conservatives use 5 foundations and liberals use 2 doesn't mean the 5 are "true." It just means they have more levers to pull. Some of those levers (like Purity) break things.

  Your BIL is right that we can't *prove* morality with a microscope. But he's wrong that this makes all moral arguments equal. Some maps are more accurate than others, even if all maps are drawn by human hands.
