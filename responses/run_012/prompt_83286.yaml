  2.  **Deconstruct the Puzzles:**
      *   **Puzzle 1 (Telegrams):** 20 agents. Payoff if exactly 1 acts. Payoff 0 otherwise. No communication.
          *   Standard Game Theory (Nash): Symmetric Mixed Strategy. Each acts with prob $p = 1/N$. Expected utility maximization given others do the same.
          *   Superrationality (Hofstadter): If we are all "rational," we must all reason identically. Therefore, we all choose the same strategy. If I choose $p$, they choose $p$. Maximize global expected utility given this correlation.
      *   **Puzzle 2 (Magazine):** Payoff = $1,000,000 / \sum \text{entries}$. Probability of winning $\propto$ entries submitted.
          *   Standard Game Theory: Nash Equilibrium often leads to over-submission (Tragedy of the Commons).
          *   Superrationality: If everyone reasons identically, they pick the number that maximizes the *average* payout, not the individual marginal gain assuming others are fixed.

  3.  **Task 1: The Translation (Distributed Systems Vocabulary):**
      *   *Agents* $\rightarrow$ *Processes/Nodes*.
      *   *Rationality* $\rightarrow$ *Deterministic Algorithm*.
      *   *Common Knowledge of Rationality* $\rightarrow$ *Homogeneous Binary/Shared Source Code*.
      *   *Decision* $\rightarrow$ *Output/Message*.
      *   *Superrationality* $\rightarrow$ *Logical Correlation without Communication*.
      *   *Nash Equilibrium* $\rightarrow$ *Fixed Point where no node wants to change code given others' code*.
      *   *The Crux:* In standard Game Theory (Nash), when I optimize my strategy, I treat others' strategies as *fixed environment parameters*. In Superrationality (and Updateless Decision Theory/Timeless Decision Theory), when I optimize, I treat my output as *logically correlated* with theirs because we run the same function $f(\text{input}) \rightarrow \text{output}$.
      *   *Randomness:* Crucial distinction. Shared seed vs. Independent RNG.
          *   If we share a seed (or are deterministic), symmetry implies identical output. If the task requires symmetry breaking (exactly one sender), deterministic code fails (0 or 20 senders).
          *   If we have independent RNG (private coins), we can implement $p = 1/N$.
      *   *The "Superrational" claim:* It's not just MSNE. It's the claim that $P(\text{others act} | \text{I act}) \neq P(\text{others act})$. In standard prob, my coin flip doesn't affect theirs. In superrational logic, if I decide "Act", and we are identical, they decide "Act".

  4.  **Task 2: The Residue Report (What's left over?):**
