      *   *Identity:* In DS, Process ID (PID) breaks symmetry. In the puzzle, agents are anonymous. If I hardcode `if PID == 1: send`, I win. But I don't know my PID relative to others.
      *   *Logical Uncertainty:* This is the big one. In DS, we assume the code is known. If I know the code, I know the output (modulo randomness). Philosophy deals with "I don't know what the output of this reasoning process is yet." This maps to *Logical Induction* or *Bounded Rationality*.
      *   *Causality vs. Correlation:* DS relies on causal links (network packets). Superrationality relies on *acausal* links (logical identity). Does this exist in DS? Only if you consider the source code repository as a causal link *before* deployment. Once deployed, they are causally isolated.
