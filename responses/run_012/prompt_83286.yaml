      *   *Section 1: The Translation.*
          *   Define the setup: $N$ nodes, no network partition (can't talk), synchronous round.
          *   Nash: Each node runs `optimize_local_utility(others_strategy_fixed)`.
          *   Superrational: Each node runs `optimize_global_utility(assuming_output_correlation)`.
          *   The Randomness nuance: If deterministic, symmetry means all send or none send (Failure). Need private entropy (coin flips).
