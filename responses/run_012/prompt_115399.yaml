answer: |-
  ### 1. The Procedure

  | Step | The question to ask | What counts as a sufficient answer | Where this step can end the process, and with what verdict | Forced by the impossibility result, or a design choice? |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | What are the live binary questions generating the outcome space? | A list of at least two distinct yes/no questions (e.g., "Meat allowed?" and "Quiet hours?"). | Never ends the process; defines the **outcome_space**. | Forced by impossibility result (requires ≥3 alternatives). |
  | 2 | What is each member's **personal coordinate** in each alternative? | A description of the physical or legal state specific to that member (e.g., "Member A's diet," "Member B's window display"). | Never ends the process; defines the **coordinates**. | Design choice (definition of "personal"). |
  | 3 | Does the **pair test** grant a **domain** to any member? | Yes, if two outcomes differ *only* in that member's **personal coordinate**. No, if they differ in others' coordinates too. | If No for all members: Process ends. Verdict: Community decides all via majority vote. | Design choice (strictness of **pair test**). |
  | 4 | Is there a **coordinate-altering effect** between members? | Yes, if one member's coordinate changes another's sensory, physical, or resource state. No, if it changes only knowledge or opinion. | If Yes: Process ends. Verdict: **Lever (a)** applied automatically. Domain shrinks; Community decides via majority vote. | Forced by impossibility result (prevents **unanimity trap** via **lever (a)**). |
  | 5 | Are there **meddlesome preferences** present? | Yes, if a member ranks outcomes based on another's **personal coordinate** while their own is unchanged. | If No: Process ends. Verdict: No trap possible. Apply **Weak Pareto** and **Minimal Liberalism** normally. | Forced by impossibility result (trap requires these). |
  | 6 | Does a **unanimity trap** exist? | Yes, if **meddlesome preference** + **Weak Pareto** + **domain** create a ranking cycle (A>B, B>C, C>A). | If No: Process ends. Verdict: Consistent ranking found. | Forced by impossibility result (logical consequence). |
  | 7 | **Which of the three levers** will resolve the trap? | Selection of (a), (b), or (c). | **This step chooses the resolution.** | **Design choice** (The theorem forces a conflict; this chooses the sacrifice). |
  | 8 | Who executes the tie-break if **lever (c)** is chosen? | Name a specific person or body (e.g., "Board Chair" or "General Meeting"). | Process ends. Verdict: Named authority decides the specific case. | Design choice (Delegation of residual authority). |

