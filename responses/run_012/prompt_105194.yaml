  ***

  **Note on the Argument**

  The poem takes a hard line against superrationality, treating it as a category error rather than a solution. It leans on the contested reading that correlation requires identity—that any "wobble" in reasoning collapses the cooperation back into standard defection. Strictly speaking, superrationality (à la Hofstadter) only requires a high probability of similar reasoning, not perfect duplication.

  However, the poem commits to your skepticism. It argues that the move *is* a change of subject. By ending with the cooperation line ("If I stay my hand...") immediately following the accusation ("Or just a name to hide the split"), the poem suggests the cooperative choice is only possible if you accept the metaphysical trick first. It treats the theory not as math, but as a wish to be singular ("Unless I am you"). The poem decides that rationality cannot bridge the gap between two bodies; if it claims to, it is no longer talking about rationality, but about identity.
