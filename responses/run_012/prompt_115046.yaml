  Let thought be bound by skin and blood and bone.

  We block the waves, we silence every roar,
  Yet statistics haunt the laboratory floor.
  The evidence insists the wall is gone.

  So build the cage and lock the heavy door,
  I wish the mind were locked inside the bone.
  We seal the lead-lined chamber like a tomb,
  The evidence insists the wall is gone.

