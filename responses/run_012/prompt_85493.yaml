answer: |-
  Here is the lesson plan. It is built to bridge the gap between your "shibboleth nodders" and your "mysticism skeptics" by anchoring the concept in **logical correlation** rather than **identity** or **causality**.

  ### 1. Validation of Your Framing
  Your intuition on **Correlated Reasoning** is correct and is the load-bearing beam you need.
  *   **Why:** "Identical Copies" is a sufficient condition for acausal trade, but it is not necessary. It is a heuristic that guarantees correlation. If you teach "Copies," the skeptics hear "Cloning/Mysticism." If you teach "Correlated Reasoning based on transparent algorithms/dispositions," the skeptics hear "Game Theory/Prediction."
  *   **The Shift:** You are moving them from *Causal Decision Theory* (I can only affect what I can touch) to *Functional/Timeless Decision Theory* (My decision is a logical fact that can be simulated by others).
  *   **The Trade vs. Cooperation Point:** You are also correct that the standard Prisoner's Dilemma (PD) example fails here. PD teaches *coordination* (both want the same outcome). Acausal **Trade** requires *asymmetric utility* (I value X, you value Y; I can make Y cheaply, you can make X cheaply).

  ### 2. Prerequisites (What must parse first)
  Before you can discuss the trade, you must establish three concepts on the whiteboard in this specific order. If you skip step 2, step 3 looks like magic.

  1.  **Causal Isolation:** The agents cannot signal, threaten, or bind themselves contractually. (Draw two circles with no arrows between them).
  2.  **Logical Transparency:** Agent A can simulate Agent B's decision process, and vice versa. (Draw an eye inside each circle looking at the other's source code).
  3.  **Logical Correlation:** Because A and B are both reasoning about the same logical facts (including each other's reasoning), their outputs are correlated, even without causal links.

  **Dependency:** You cannot explain *why* the trade happens (3) until they accept the agents can model each other (2) despite being isolated (1).

  ### 3. The Carrying Example: "The Asymmetric Algorithms"
  Drop the Lighthouse/Monk for the core explanation. Humans are opaque; their "reasoning" is noisy. This invites the skeptic to say, "But the monk can't *really* know the keeper will do it." That derails the session into epistemology.

  Use **Two Simple Agents in Boxes**.
  *   **Agent A:** Values **Paperclips**. Can produce **Staples** at near-zero cost.
  *   **Agent B:** Values **Staples**. Can produce **Paperclips** at near-zero cost.
  *   **Constraint:** They are in separate causal bubbles (no communication).
  *   **Setup:** Each can produce 100 units of their *own* cheap good, or 0. They want the *other* good.
  *   **The Trade:** A produces Staples for B. B produces Paperclips for A.
  *   **Why?** A reasons: "If I produce Staples, it is because I am an agent who honors acausal trade. B is simulating me. If B predicts I am such an agent, B will produce Paperclips. Since I want Paperclips, I must be the kind of agent who produces Staples."

  **Why this works better than Lighthouse:** It removes the "precommitment" noise. A isn't *promising*; A is *being*. The trade happens because their decision algorithms are logically linked, not because they signed a pact.

  ### 4. The Sequence (90 Minutes)

  **0:00 – 0:15: Kill the Time Travel (Addressing Retrocausation)**
  *   **Whiteboard:** Draw a timeline. Show Agent A and Agent B separated by space or an event horizon.
  *   **Script:** "Acausal does not mean 'backwards causation.' It means 'without causal link.' We are not sending signals to the past. We are recognizing that two calculators running the same math will output the same sum, even if they are in different rooms."
  *   **Head off:** If anyone mentions changing the past, stop them. "We are discussing logical implication, not physical influence."

  **0:15 – 0:35: The Mechanism (Correlated Reasoning)**
  *   **Whiteboard:** Write `Output_A = f(Input, Source_Code_A)`. Write `Output_B = g(Input, Source_Code_B)`.
  *   **Concept:** If A knows B's source code, A knows `Output_B` is a function of `Output_A` (because B simulates A).
  *   **Head off:** "Only works on copies." **Correction:** "It works on *predictable* agents. Copies are just the 100% correlation edge case. If correlation is > threshold, trade is possible."

  **0:35 – 0:60: The Example (Asymmetric Trade)**
  *   **Run the Paperclip/Staple scenario.**
  *   **Crucial Step:** Ask the group: "Why doesn't A just defect? Why produce Staples if B can't punish A?"
  *   **Desired Answer:** "Because A's decision to defect is logically correlated with B's decision to defect. If A defects, B's simulation of A predicts defection, so B defects. A gets nothing."
  *   **Head off:** "It's just Precommitment." **Correction:** "Precommitment implies binding a future self. This is acting on the current logical fact of your own disposition. You aren't tying your hands; you are recognizing your hands are already tied by your own source code."

  **0:60 – 0:80: The Boundaries (Addressing Pascal's Mugging)**
  *   **The Problem:** "Do I owe a trade to every alien who might be simulating me?"
  *   **The Solution:** **Model Fidelity.**
  *   **Whiteboard:** Draw a graph: X-axis = Complexity of Agent, Y-axis = Predictive Correlation.
  *   **Script:** "You only trade with agents you can model accurately enough to trust the correlation. If the agent is too complex (or too simple), the correlation drops to noise. You don't owe trades to agents you cannot simulate."
  *   **Head off:** This kills the "owe everybody" objection. It grounds the obligation in *computational capacity*, not moral duty.

  **0:80 – 0:90: Assessment & Close**

  ### 5. What to Skip (Explicitly)
  Tell them you are skipping these to save time. This signals you know the literature but are prioritizing intuition.
  1.  **Proof-Based Cooperation:** (e.g., Program Equilibrium, "I cooperate if you prove you cooperate"). This gets bogged down in Gödelian logic and distracts from the decision-theory intuition.
  2.  **Quantum Branch Counting:** (e.g., "I trade across many worlds"). This invites the mystics to take over. Keep it to logical correlation in a single world (or agnostic to worlds).
  3.  **The Derivation of FDT:** Don't derive Functional Decision Theory. Just use the output: "Decisions are logical facts."

  ### 6. The Final Question (The Diagnostic)
  Do not ask "What is acausal trade?" (Tests vocabulary).
  Do not ask "Is this real?" (Tests belief).

  **Put this on the board:**
  > "Agent A and Agent B are causally isolated. A values X, B values Y. A can produce Y cheaply; B can produce X cheaply. A knows B's source code perfectly. B knows A's source code perfectly.
  >
  > **A decides NOT to produce Y.**
  >
  > **Give me the one logical reason why, consistent with acausal trade theory.**"

  **The Answer you are looking for:**
  "A determined that B's decision algorithm is **not sufficiently correlated** with A's."
  *(e.g., B is a defector by design, or B simulates A poorly, or B values something else entirely.)*

  **Why this works:**
  *   If they say "Because there's no causal link," they failed (Skeptics).
  *   If they say "Because A couldn't precommit," they failed (Precommitment confusion).
  *   If they say "Because A didn't trust the correlation," they got it (Correlated Reasoning).

  ### 7. Facilitator Notes for the Split Room
  *   **For the Nodders:** When they start using jargon ("It's just FDT"), ask them to translate it into the "Correlated Reasoning" frame. Force them to explain *why* the correlation exists without using the word "acausal."
  *   **For the Skeptics:** When they say "This is magic," point to the **Source Code** constraint. "If I give you my calculator's code, and you have an identical calculator, and we press 'equals', do we get the same number? Is that magic? No, it's logic. This is just that, with agents."
  *   **On Precommitment:** If the Lighthouse example comes up (since you sketched it), allow it *only* as an analogy for human intuition, but warn them: "Humans are bad at this because we are opaque. The theory requires transparency. Don't confuse the *ideal* with the *practical*."

  This plan keeps the "Trade" asymmetry front and center, grounds the "Magic" in logic, and gives you a hard stop on the Pascal's Mugging objection.
