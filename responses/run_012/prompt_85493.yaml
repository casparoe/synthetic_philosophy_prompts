  *My advice:* Keep the Lighthouse/Monk *only if* you emphasize they are *hyper-rational agents* modeling each other. But honestly, for a 90-minute session, **Asymmetric AIs** are cleaner. I will suggest the AI example but explain *why* it's better for this specific pedagogical goal (isolating the correlation variable).

  *Wait, one more thing:* The user wants to know *what has to be in place before the question parses*.
  *Answer:* They need to accept that decisions can be logically correlated without causal links. This requires accepting a non-Causal Decision Theory framework (even if just intuitively).

  *Final Plan Structure:*
  1.  **Validation:** Confirm "Correlated Reasoning" is the right hook.
