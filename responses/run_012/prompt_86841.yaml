      *   Most Decisive: The Mixed Population/Probability Decay argument.
      *   Core Claim Survives: True (in idealized cases).
      *   Near Symmetry Survives: False (it breaks down under probability weighting).
      *   Risks Unfalsifiability: True.

  9.  **Review against Constraints:**
