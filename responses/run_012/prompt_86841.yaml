  2.  **Deconstruct the User's Position (Superrationality/Functional Decision Theory):**
      *   *Core:* My decision is logically linked to yours because we run the same algorithm.
      *   *Extension:* Even if the link is probabilistic (approximate symmetry), I should act as if the link holds strong.
      *   *Epistemology:* Real-world data (people defecting) doesn't falsify the norm; it just shows people are irrational.

  3.  **Brainstorming Defeaters:**
      *   *The "Magic" Objection:* How does my thought cause yours? (Causal isolation).
      *   *The "Asymmetry" Objection:* We aren't actually identical. Hardware differs, noise differs.
      *   *The "Mixed Population" Objection:* What if I know some people are CDT agents (defectors)?
      *   *The "Self-Fulfilling/Empty" Objection:* If everyone *must* agree, how do we decide *which* equilibrium?
      *   *The "Extortion" Objection:* If I commit to superrationality, can I be exploited by irrational agents?
      *   *The "Approximate Symmetry" Objection:* The user's strong claim that correctness doesn't fade with probability seems mathematically suspect.
      *   *The "Definition of Rationality" Objection:* Is rationality about winning or about reasoning correctly? If superrationality loses against defectors, is it rational?

  4.  **Selecting and Refining Defeaters for the Table:**
      *   *Defeater 1: The Causal Isolation / No-Backwards-Causation Argument.* (Classic CDT objection). Target: Denial of magical influence. Force: Serious (but user might dismiss as "confused").
      *   *Defeater 2: The Heterogeneous Population Problem.* (What if I know 50% are defectors?). Target: Core claim & Near-symmetry. Force: Fatal to the "strong claim" about approximate symmetry.
      *   *Defeater 3: The Equilibrium Selection Problem.* (Which cooperative equilibrium?). Target: Core claim. Force: Awkward.
      *   *Defeater 4: The Vulnerability to Irrationality.* (Superrationalists lose to defectors in one-offs). Target: Core claim (definition of rationality). Force: Serious.
      *   *Defeater 5: The "Approximate Symmetry" Decay.* (Why doesn't probability weight matter?). Target: Near-symmetry extension. Force: Fatal to that specific extension.

  5.  **Drafting the Content (Iterative refinement for tone and depth):**
      *   *Tone:* Respectful but rigorous. Acknowledge the engineering mindset (algorithms, inputs/outputs).
      *   *Core Argument:* The user is essentially describing Functional Decision Theory (FDT) or a variant of Evidential Decision Theory (EDT) with a logical link. I need to attack the *logical link* assumption when physical causality is absent.
      *   *The "Approximate Symmetry" Claim:* This is the weakest point. If there's only a 10% chance others are superrational, acting as if it's 100% is basically losing expected utility. I need to hammer this.
      *   *The "Real World Evidence" Claim:* Dismissing empirical data as "human error" risks unfalsifiability. I need to highlight this.

  6.  **Developing the Table Entries:**
      *   *Defeater:* Causal Isolation. *Target:* Denial of magic. *Force:* Serious. *Concession:* No physical signal. *Qualification:* It's logical correlation, not causal. Cost: Requires accepting a non-standard metaphysics of computation.
      *   *Defeater:* Mixed Populations. *Target:* Near-symmetry. *Force:* Fatal (to the extension). *Concession:* You can't assume identity. *Qualification:* Must downgrade to standard expected utility. Cost: Loses the "superrational" advantage.
      *   *Defeater:* Exploitation by Defectors. *Target:* Core claim (Rationality = Winning). *Force:* Serious. *Concession:* Superrationalists get lower payoffs against defectors. *Qualification:* Rationality is about the *method*, not the *outcome* against irrationality. Cost: Redefines rationality away from "winning."
      *   *Defeater:* Unfalsifiability of Error. *Target:* Real-world outcome claim. *Force:* Awkward/Philosophical. *Concession:* Hard to prove people *could* have reasoned better. *Qualification:* Requires a idealized agent model. Cost: Theory applies only to ideals, not humans.

  7.  **Addressing the "Approximate Symmetry" Strong Claim:**
      *   The user says: "correctness does not fade in proportion to that probability."
      *   Counter-argument: If $P(\text{other cooperates} | \text{I cooperate})$ is low, expected utility of cooperating drops. If the user insists on cooperating regardless, they are maximizing a *different* function than expected utility. This is a definition clash. I need to frame this as a "Fatal" hit to the *extension*, not necessarily the core ideal case.

  8.  **Finalizing the JSON:**
