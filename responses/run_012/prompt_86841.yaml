      *   *Initial thought:* Say FDT solves this. *Correction:* User wants arguments, not labels. Explain *why* the logic holds or fails.
      *   *Focus:* The user's "Approximate Symmetry" claim is the most vulnerable. I must ensure the table reflects that this is where the theory bleeds.

  13. **Final Polish:** Check the JSON syntax. Ensure the table is markdown. Ensure the tone is expert-to-engineer. (Proceed to generate output).

