  **Joint Statement on the Ethics of the Very Long Term**

  We, the undersigned members of the working group, submit this document to record our shared constraints and clarify our remaining disagreements regarding the ethics of the far future.

  **I. Agreed Claims**

  1.  **Finitude:** All arguments are restricted to finite values and probabilities. Appeals to actual infinities or Pascal's Wager are excluded.
  2.  **Distinction:** We distinguish the *axiological question* (is the value at stake bounded?) from the *decision-theoretic question* (should expected value maximization treat arbitrarily small probabilities linearly?).
  3.  **Structural Constraint:** We accept that a value function sufficiently bounded or concave to block fanatical comparisons risks licensing the Repugnant Conclusion, while lexical or convex moves blocking the Repugnant Conclusion restore fanatical comparisons. No position secures both boundedness and a clean escape from repugnance.
  4.  **Verdict on Taming Devices:** Regarding (a) saturating probability-weighted value and (b) transforming probabilities: We agree that (a) entails bounded axiology and (b) entails non-linear decision theory. Consequently, neither device serves as a neutral arbiter. We agree neither is adopted as a joint policy; their acceptance depends on the resolutions below.

  **II. Remaining Disagreements**

  | Sub-question | Fanatics' Position | Anti-Fanatics' Position | Crux | Shared Case & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Axiological Bounds**<br>Is the value function bounded? | **Unbounded.** Only an unbounded value function accurately reflects the potential scale of the future and avoids arbitrary caps on good. | **Bounded.** A bounded function is required to prevent absurd trade-offs where near-certain present benefits are sacrificed for negligible future chances. | Does formal consistency outweigh intuitive reductio? | **Case:** 10⁻⁹⁰ chance of 10⁹⁰ lives vs. 1 certain life.<br>**Fanatic Prediction:** Intuitions align with math upon reflection.<br>**Anti-Fanatic Prediction:** Intuitions reject math as irrational. |
  | **Probability Weighting**<br>Should weighting be linear? | **Linear.** Linearity is required for diachronic consistency and to avoid vulnerability to money pumps or dynamic inconsistency. | **Non-Linear.** Non-linearity is required for practical rationality, ensuring vanishingly small probabilities do not dominate certainty. | Does avoiding formal money pumps outweigh avoiding practical absurdity? | **Case:** Repeated small-stake bets vs. one-shot existential stakes.<br>**Fanatic Prediction:** Repeated bets converge to expected value.<br>**Anti-Fanatic Prediction:** One-shot stakes dominate aggregation. |
  | **Terminology**<br>Is "Fanaticism" pejorative? | **No.** The term names a virtue: accurate sensitivity to astronomical stakes and formal rigor. | **Yes.** The term names a defect: pathological neglect of near-certain harm for speculative gain. | **Verbal Dispute.** | **Disambiguation:** We agree "Fanaticism" denotes endorsement of small-probability dominance. We disagree on its normative valence. This verbal dispute dissolves if we refer strictly to "small-probability dominance endorsement." |

  **III. Conclusion**

  We acknowledge that resolving these disagreements requires choosing between formal elegance and intuitive safety. We commit to further work on the cruxes identified above.
