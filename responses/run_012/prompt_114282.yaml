answer: |-
  **MEMORANDUM**

  **TO:** The Selection Committee
  **FROM:** The Chair
  **DATE:** October 14
  **SUBJECT:** Recommendation for the Annual Prize for Poetry in Translation

  **1. Recommendation**

  We are required to award a prize every year, and we are required to select the best book of poems published in English translation. We have three shortlisted candidates. Two are translated from languages represented on this committee (French and Arabic). The third is translated from a language none of us currently reads.

  I recommend that we **withdraw the third book from consideration and award the prize to the superior of the remaining two candidates.** We should hold a final vote between the French and Arabic titles at our meeting on October 24, with the winner announced to the printer by October 28.

  **2. Reasoning**

  This recommendation is not based on the reputation of the books, nor on a presumption of quality regarding the source texts. It is based on the specific category of our prize: *Poetry in Translation*.

  Our rules are silent on whether we honor the poet or the translator, and silent on what languages we must read. However, the category "in translation" implies a relationship between two texts: a source and a target. To award a prize for *translation* is to honor the successful transfer of poetic value from one language to another. It is not merely a prize for poetry written in English by translators.

  In the case of the third book, we face an epistemic barrier that the other two do not present. We have three documents: the English text, the translator's note, and an expert assessment.
  *   **The English Text:** We agree it is remarkable. Colleague A argues this is sufficient: we judge what we read. This is a strong position for a general poetry prize. But for a translation prize, the English text is only half the object under judgment.
  *   **The Translator's Note:** The translator states that the original's effects "depend on features English cannot carry" and that his version should be read as "a new poem." This is a significant concession. If the translator asserts that the essential effects of the original are untranslatable, he is admitting that the English book is not a full rendering of the source. He is asking us to judge the *new poem*, not the *translation*.
  *   **The Expert Assessment:** The lecturer confirms the original's form and argument but declines to judge its quality, noting it strikes her as "cold." We are left with a contradiction: the translator calls it the finest book in twenty years; the expert finds it cold. We have no way to resolve this.

  **3. Addressing the Committee's Divisions**

  I take seriously the position of Colleague A: that we should judge the book in hand. If this were a prize for "Poetry in English," I would agree. The English text is indeed compelling. However, awarding this book under the banner of *Translation* risks certifying a relationship we cannot verify. If the translator is right that the English cannot carry the original's effects, then the "translation" is, by definition, incomplete. To award it is to reward the English poem while ignoring the failure of transfer that the translator himself has identified.

  I also take seriously the position of Colleague B: that awarding this book certifies a poem none of us has read. This is the core risk. If we award the prize, we are relying entirely on the translator's say-so regarding the quality of the original. While trust is necessary in literature, a prize committee's function is verification. We can verify the merit of the French and Arabic translations because we can assess the fidelity and the loss. We cannot assess the loss in the third book. We do not know if the English is remarkable *because* of the translation, or *despite* it.

  **4. Public Defense**

  At the ceremony, we need not mention the exclusion of the third book. We will simply announce the winner from the eligible field. However, should the decision become public knowledge, our defense is this:

  *"This prize honors the craft of translation. That craft requires a bridge between languages that can be examined. We awarded the book where we could fully verify the success of that bridge. We honor the work we can fully stand behind."*

  This is not an embarrassment. It is a statement of rigor. It affirms that our prize is not merely a stamp of popularity or reputation, but a verified judgment on the art of translation itself. To award the third book would be to accept that a translation prize can be awarded without anyone verifying the translation. That sets a precedent that diminishes the specific mission of this foundation.

  **5. Conclusion**

  We must award a prize. We have two excellent candidates that fit our capacity to judge. We have one candidate that exceeds our capacity to verify. In the interest of the prize's long-term integrity, we should choose the verifiable over the reputed.

  Please review the French and Arabic texts with this framework in mind for our vote on the 24th.

  ***

  **ADDENDUM: PRIVATE NOTE TO THE CHAIR**
  *(Do not circulate)*

  You asked whether my analysis would change under two specific counterfactuals. Here is that assessment:

  **1. If the lecturer had agreed with the translator that the original is a masterpiece:**
  My recommendation would **not** change. The core problem is not the *quality* of the original, but our *access* to it. Even if the lecturer confirmed the original was a masterpiece, we would still be relying on her say-so. The committee's epistemic position remains the same: we are certifying a judgment we cannot personally verify. Furthermore, if both the translator and the lecturer agree it is a masterpiece, but the translator *also* maintains that "English cannot carry its effects," the disqualification remains. We cannot award a *translation* prize to a book that admits it fails to carry the effects of the masterpiece. We would be rewarding the translator's honesty, not his translation.

  **2. If the translator's note had come from someone with nothing to gain:**
  My recommendation would **not** change, though the ethical unease would lessen. The translator's conflict of interest colors his testimony, but his technical claim is the real barrier. Even a disinterested translator who writes, "English cannot carry the effects of this poem," is describing a failure of translation. If the effects are the poem, and they are not carried, the poem is not there. Whether he gains money or prestige from that admission is secondary to the fact that the admission removes the book from the category of "successful translation."

  **The Core Argument:**
  Your struggle is whether a person can know a poem is good on another's say-so. For the purposes of this prize, the answer must be **no**. A prize committee is not a reading public; it is a body of judgment. The public can rely on say-so; a jury cannot. If we award based on testimony rather than verification, we convert the prize from a judgment of merit into a reflection of reputation. Given the rules require us to award a prize every year, we have the luxury of choosing the book we can actually judge. We should take it.
