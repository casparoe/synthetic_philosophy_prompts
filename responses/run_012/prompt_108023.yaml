prompt: |-
  My flatmate and I have been going back and forth about our council putting ANPR cameras on basically every road, and the one thing he keeps coming back to is "if you've got nothing to hide you've got nothing to fear." I know that line is doing a lot of work and I can't say exactly what, so I want the whole menu of precise claims it could be making, laid out so I can take it back to him. Like: what does "nothing to hide" actually mean — no illegal acts, no embarrassing acts, nothing you'd mind a stranger seeing? What is "fear" supposed to cover — being arrested, being judged, being watched at all? And who's the "you" — me as an individual, or does it quietly slide into "if we've all got nothing to hide then society has nothing to fear"? For each reading, tell me whether it's trivial, genuinely defensible, or just false, and which reading he's probably leaning on when he uses it to shut the argument down. My other friend keeps saying the real harm isn't in what they find but in how it changes what I do, and another one says it's really about the power asymmetry between watcher and watched — so work out whether those are separate claims or just restatements of the same one, and whether either of them actually answers the "nothing to hide" line. No need for citations, I just want the ideas. Also say how confident you are in your read of what he's up to, and flag the part your least sure about.
