prompt: |-
  So I watched this YouTube video about al-Ghazali (I think the title was something like "the man who killed science in Islam", lol) because I'm doing a little presentation for my school's philosophy club, and the part where it explains his view on cause and effect seems kind of off to me but I can't put my finger on why. Here's the gist of it, roughly as it went:

  Al-Ghazali's big move in his book against the philosophers, the Tahafut al-Falasifa, was to deny cause and effect. When you put fire next to cotton, the fire doesn't actually burn it -- God is the one who burns the cotton, and the fire is just sitting there next to it at the same time. Nothing in the world really causes anything else; God does everything directly, every time. His theory for this is called kasb, which means God creates all the acts and we just sort of acquire them. And because of all this you can never really know what's going to happen next -- the world could be totally random and we'd have no way of telling. On the plus side, since nothing causes anything, there's no reason God can't just do a miracle and break the pattern whenever he wants. He also declared all the philosophers unbelievers for this stuff, and alot of people say this is the moment Islamic science started dying.

  Is that fair? Go through it sentence by sentence and tell me what someone who actually studies al-Ghazali would accept, what they'd wince at, and what's just wrong -- and does that last bit about killing science actually follow from the parts that are right, or is it a seperate claim bolted on? I'm definately not trying to write an essay here, I just want to know what I can repeat in my presentation without getting embarrassed.
