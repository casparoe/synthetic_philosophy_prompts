answer: |-
  **Exam Question**

  **Course:** PHI 450: Practical Reason and Action
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form.

  **Question:**
  Consider the following variant of Kavka's Toxin Puzzle: An eccentric billionaire offers you one million dollars if, at midnight tonight, you intend to drink a harmless but painful toxin tomorrow afternoon. The money arrives tomorrow morning, before you drink. As established in the literature, a rational agent cannot form this intention because drinking tomorrow yields no benefit and only cost.

  Your friend proposes a solution: Before midnight, you may hand over a bond to a commitment service. This bond will be forfeited to a cause you find repugnant unless you drink the toxin by the appointed hour.

  Assess the viability of this strategy. In your essay, you must: (1) determine the specific condition the bond must satisfy for the intention to become sincere; (2) explain what this variant reveals about the true source of the original puzzle's difficulty; and (3) construct the strongest reply open to a billionaire who anticipates this manoeuvre.

  ***

  **Model Answer**

  The commitment bond variant ostensibly solves Kavka's Toxin Puzzle by modifying the utility calculus at the time of action. In the standard formulation, the rational agent cannot intend to drink because intention requires a belief that one will act, yet at the time of action, drinking is strictly irrational. The money is already secured, and the illness is a net loss. The agent knows they will not drink, so they cannot intend to. This creates a paradox where the reward is inaccessible because claiming it requires an impossible mental state.

  The bond mechanism bypasses this by introducing a new cost to non-compliance. For the intention to become sincere, the bond must satisfy a precise condition: the disutility of forfeiting the bond must strictly exceed the disutility of the toxin's illness. If the bond represents a loss greater than the pain of being ill, the rational choice at the time of action shifts. Drinking is no longer a gratuitous sacrifice; it becomes the utility-maximizing option to avoid the larger penalty. Because the agent knows they will rationally choose to drink to save the bond, they can sincerely form the intention at midnight. The belief condition for intention is satisfied because the future action is now supported by reasons existing at the time of performance. The bond effectively bridges the temporal gap between the reward and the action.

  This solution reveals that the force of the original puzzle comes from the fragmentation of rationality across time. The puzzle is not about a metaphysical inability to intend future acts, but about the requirements of instrumental rationality. An intention is defective if the agent knows the action will be irrational when performed. The original puzzle creates a gap where the reasons for intending (the money) vanish before the reasons for acting (the need for a reason) arise. The bond variant shows that the impossibility is contingent on the payoff structure. Once the payoff structure is corrected to ensure the action is rational at the time of performance, the intention becomes possible. The puzzle's force relies entirely on the agent being unable to give themselves a reason to act at the critical moment. It highlights that intention is not merely a wish for an outcome, but a commitment grounded in predicted rational behavior.

  Nevertheless, a billionaire who anticipates this strategy can neutralize it completely. The strongest reply is to refine the terms of the offer to exclude external enforcement. The billionaire can stipulate that the million dollars is contingent on forming an intention based solely on the incentives internal to the offer itself. By defining the condition as "intending to drink for the sake of the reward, without external coercion," the billionaire invalidates the bond strategy. If the agent posts the bond, they fail the condition of the offer. If they do not, they revert to the original impossibility. This reply is strong because it shifts the debate from practical rationality to the definition of the contract. It demonstrates that the puzzle is not merely a logical trap about intention, but a test of whether an agent can manipulate their own future rationality within the constraints set by the offeror. Ultimately, the billionaire retains control by defining what counts as a valid intention, proving that the puzzle's resolution depends on the rules of the game as much as the psychology of the player. The billionaire thus preserves the paradox by ensuring the agent cannot alter the game board.

  ***

  **Marking Scheme (Total 20 Marks)**

  **1. Analysis of the Bond Mechanism (6 Marks)**
  *   **A Range (5-6 marks):** Explicitly states the inequality condition: Bond Disutility > Toxin Disutility. Explains that this makes drinking the rational choice at the time of action, thereby satisfying the belief condition for intention.
  *   **B Range (3-4 marks):** States the bond must be "high enough" or "worth it" without precise reference to disutility comparison. Correctly notes it makes drinking rational but lacks precision on the condition.
  *   **C Range (0-2 marks):** Fails to identify that the bond changes the rationality of the action itself; focuses only on the desire to get the money.

  **2. Insight into the Puzzle's Force (7 Marks)**
  *   **A Range (6-7 marks):** Identifies the core problem as the temporal separation of reward and action rationality (instrumental irrationality at time of performance). Articulates that the puzzle's force relies on the agent lacking a reason to act *when acting*, not merely lacking a reason to intend.
  *   **B Range (4-5 marks):** Identifies the problem as "time" or "changing your mind" but fails to connect it to instrumental rationality at the moment of action. Vague on why the original intention was impossible.
  *   **C Range (0-3 marks):** Recites standard literature conclusions (e.g., "intentions are opaque") without applying them to the variant's structural changes.

  **3. The Billionaire's Reply (7 Marks)**
  *   **A Range (6-7 marks):** Constructs a reply based on contractual stipulation excluding external incentives (e.g., "intention must be based solely on offer incentives"). Explains why this nullifies the bond strategy without changing the physical setup.
  *   **B Range (4-5 marks):** Suggests the billionaire simply "bans the bond" or argues the intention is "coerced" without linking it to the terms of the offer or the definition of valid intention.
  *   **C Range (0-3 marks):** Weak reply (e.g., "Billionaire runs away") or fails to provide a counter-argument that anticipates the strategy.

  **Grade Boundaries:**
  *   **A (17-20):** Contains all A-range elements. Clear, precise philosophical reasoning.
  *   **B (14-16):** Contains mostly B-range elements, or mixes A and B. Competent but lacks precision on the inequality or the source of the puzzle's force.
  *   **C (10-13):** Misses one of the three required moves entirely or contains significant conceptual errors.
  *   **Fail (0-9):** Fails to address the variant or demonstrates no understanding of the original puzzle.
