          *   *Differentiation:* Wittgenstein usually says hinges are *not* known (they are animal/groundless). Moore says they *are* known. If the user says "certainty is collateralized," they might be bridging the two. But if they say "Moore wins by declining the game," that's very Wittgensteinian.
