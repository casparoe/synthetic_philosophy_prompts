answer: |-
  The hallway outside Courtroom 4 smells of ozone and old paper, a scent that has become synonymous with the Temporal Liability Statutes. I lean against the wall, watching my client, Marcus, stare at his hands. He is forty-five now. The man who killed the shopkeeper five years ago was forty. In the eyes of the Supreme Court, those two men are no more the same person than a father and son are the same person. They are distinct temporal slices of a single spacetime worm, linked by causality but distinct in existence. The man in the dock is the 2024 segment. The killer was the 2019 segment. My job is to convince the judge that the 2024 segment deserves less punishment because he is barely connected to the 2019 segment. Marcus's job, apparently, is to sabotage me.

  You would think a defendant would want any argument that keeps him out of prison, but Marcus has been reading philosophy in lockup. He looks up at me, his eyes clear and unsettlingly calm. Elena, he says, you keep telling them I'm not him. But if I'm not him, then who is asking for forgiveness?

  I crouch down so we are at eye level. The bailiff shifts his weight nearby, bored by the metaphysics. It's not about truth, Marcus. It's about mitigation. The Parfit reduction. If we can show the court that your psychological connectedness to the 2019 stage is weak, the sentencing guidelines drop. You've had the neural therapy. You've changed your values. You barely remember the night it happened.

  I remember it, he says. I remember the weight of the bottle. I remember the fear.

  Then don't say that in there, I plead. Say you're a different person. Say the memories are distant clouds. Say the desires that motivated the act are dead. That is how you get probation instead of containment.

  He shakes his head slowly. If I say I'm not him, then I'm not the one who did it. And if I'm not the one who did it, I can't be the one who makes it right. They treat me like a hand washing the foot, like I'm just cleaning up a mess made by a different body part. But I'm not a foot. I'm me. I'm the same me who stood in that store.

  Before I can answer, the bailiff calls us in. The courtroom is designed to emphasize the geometry of the law. There are no circular tables, only linear arrangements. The judge, Justice Harlow, sits at the head of a long bench that seems to stretch into the past and future. She is a strict perdurantist, a believer in the worm. To her, Marcus is a collection of stages, and we are here to decide how to treat the current stage based on the actions of a past stage.

  The prosecutor, Vance, stands first. He does not bother with moral outrage; outrage requires a single moral agent, and the state has moved past that. Instead, he speaks of risk management and causal chains. The 2019 segment initiated a causal sequence that resulted in death. The 2024 segment is the current locus of that worm. While the state acknowledges the ontological distinction, the Continuity Statute mandates that liability flows along the worm's path. However, Vance argues, the punishment must be calibrated to the current segment's dangerousness.

  I stand to offer the mitigation. I invoke the Parfitian standard. I argue that moral desert relies on psychological connectedness, not strict identity. I present the psychiatric evaluations. Marcus 2024 does not share the same impulses as Marcus 2019. The neural pathways associated with aggression have been dampened. The memories are faint. The values have shifted. I argue that punishing this segment heavily for the acts of a barely connected predecessor is akin to punishing a brother for a sibling's crime. If identity is what matters, and identity is just a matter of degree, then desert must also be a matter of degree. The man in the dock is a stranger to the killer. To treat him as the killer is a category error.

  Vance rises for the rebuttal, and he is sharp. He does not attack the metaphysics; he attacks the morality of using them this way. He argues that if we accept the defense's metric, we create a perverse incentive for moral dissociation. If a criminal can simply alter their psychology enough before sentencing, perhaps through chemical lobotomy or induced amnesia, they erase their desert. He asks the court if a sociopath, who feels no psychological connection to his victims, deserves less punishment because his connectedness is low. He argues that the law must presume a stable subject to function. If we dissolve the subject into a series of fleeting stages linked only by vague degrees of memory, we lose the ability to hold anyone accountable. We are left managing risks, not delivering justice. He looks at Marcus. The defense argues you are not connected enough to deserve blame. But surely, Mr. Vane, you feel connected enough to deserve the rights of a citizen? You cannot claim the benefits of identity when it suits you and deny the burdens when it does not.

  It is a strong argument, and I see Justice Harlow nodding. The Parfitian move is elegant, but it cuts both ways. If Marcus is not the killer, he is not the citizen who owes the debt. The legal system is built on the worm, even if the worm is a fiction.

  Then Marcus asks to speak. This is not standard procedure. The defendant segments are usually advised to remain silent, to let their lawyers handle the ontological negotiations. But Marcus stands. He does not look at the judge. He looks at the victim's mother, who sits in the front row, her face a mask of exhausted grief.

  I know what the law says, Marcus begins. His voice is steady. It says I am a different person. It says the man who killed Mr. Henderson is back there, in 2019, and I am here, in 2024. It says we are like different links in a chain. But that is not how it feels. That is not how life works.

  He pauses, gathering himself. I am not a worm. I am not a series of snapshots. I am one thing. I persist. When I look back at 2019, I do not see a stranger. I see myself. If I tell this court that I am not him, I am lying. And if I lie to escape punishment, I am proving that I am still the kind of man who would do it.

  He turns to the judge. My lawyer says I deserve less because I have changed. But change does not erase identity. It confirms it. I am the one who grew. I am the one who learned. If I am not the one who sinned, then I cannot be the one who repents. Forgiveness requires identity. You cannot forgive a worm segment. You forgive a person. If I am not the person who did it, then Mrs. Henderson cannot forgive me. She can only forgive a ghost. And I cannot forgive myself. I need to carry this. I need to be him, so that I can pay for him.

  The courtroom is silent. The endurantist position is technically illegal here, a dissenting ontology with no standing in the Continuity Statutes. It is treated like believing the earth is flat, a quaint personal belief with no legal weight. But Marcus speaks it with such conviction that the sterile air of the room seems to thicken. He is arguing that the perdurantist legal system is not just unjust, but incoherent. It tries to distribute blame across time like a tax, but moral guilt is not a tax. It is a stain on the soul, and the soul must be singular to be stained.

  Justice Harlow removes her glasses. She looks at Marcus, then at me, then at Vance. She does not look angry. She looks tired. This is the problem with the Statutes. They solve the problem of determinism by slicing people up, but they create a vacuum of meaning.

  The defense argues that connectedness determines desert, Harlow says slowly. The prosecution argues that identity is a necessary fiction for social order. The defendant argues that identity is a metaphysical reality that transcends the law. She pauses. The court acknowledges the depth of the submission.

  She looks down at the file. The Parfitian argument suggests that punishment should fade as psychological connections fade. But as the prosecution noted, this makes justice contingent on the malleability of the mind. A rigid person deserves more punishment than a fluid one. That seems arbitrary. Yet, the defendant's argument suggests that punishment is meaningful only if he is identical to the offender. But if he is identical, then the neural changes he underwent are irrelevant, and he deserves the full retributive weight of the 2019 act.

  She looks at Marcus. You ask to be punished as the same person. But the law sees you as a successor. If I sentence you as the same person, I violate the Statute. If I sentence you as a successor, I violate your conscience.

  She picks up her gavel. There is no precedent for this. The Statutes assume the metaphysics are settled. They are not. The court finds that the psychological connectedness is sufficient to maintain liability under the Continuity Act, but the defendant's statement regarding the nature of moral agency will be entered into the record as a mitigating factor of conscience. Sentencing is adjourned for reconsideration.

  The gavel falls. It sounds final, but nothing is settled. We walk out into the hallway. The ozone smell is still there. Marcus looks relieved, not because he is free, but because he was heard. He believes he won something, even if he goes to containment. He believes he preserved his soul.

  I walk him back to holding. I should be happy. We avoided the maximum penalty. But I am unsettled. Vance was right that the Parfit argument creates loopholes for the manipulative. But Marcus was right that without identity, forgiveness is impossible. If the law treats us as worms, we become things to be managed. If we treat ourselves as enduring souls, we become things to be judged.

  In the holding cell, Marcus sits on the bench. He looks at me. Do you think she understood?

  I think she understood that she couldn't decide, I say.

  He nods. That's enough. If she decided I wasn't him, I'd have to spend the rest of my life proving I was. Now I can just spend it making it right.

  I leave him there. Outside the courthouse, the city is busy. People walk down the street, late for work, early for lunch. They are all worms, according to the signs on the government buildings. Temporal segments navigating the spatial grid. But watching them, I wonder how many of them feel what Marcus feels. How many of them feel the weight of their past selves not as a causal chain, but as a burden they carry in their bones. The law says they are different. Their hearts say they are the same. The law says punishment is about risk management. Their hearts say it is about cleansing.

  I light a cigarette and watch the smoke drift up into the sky, disappearing into the future. I don't know if Marcus deserves less punishment because he has changed. I don't know if he deserves the same punishment because he is the same. I only know that when I look at my own hands, I don't see segments. I see me. And I wonder if the law will ever catch up to the truth of that, or if the truth of that is something the law cannot touch. The case will be heard again next month. The arguments will be refined. The philosophers will write papers. But in that cell, a man sits waiting to be punished for a crime he says he committed, in a country that says he didn't exist when it happened. And neither side knows how to fix it.
