      *   Requirement: "Theory must handle finks." -> Genuine Constraint (Logical consistency).

      *Okay, ready to write.*
answer: |-
  | Requirement | The Case or Consideration That Forces It | Genuine Constraint or Camp Prejudice | Which Views It Rules Out |
  | :--- | :--- | :--- | :--- |
  | **1. Resistance to Finks/Masks/Mimics** | **The Electro-Fink:** A fragile glass has a wizard who makes it non-fragile *if* struck (Fink). A fragile glass is packed in foam (Mask). A non-fragile glass has a wizard who breaks it *if* struck (Mimic). The theory must classify these correctly despite the counterfactual conditional failing. | **Genuine Constraint.** If the theory cannot distinguish a masked power from a lack of power, it fails to track the property it claims to define. | **Simple Conditional Analysis (SCA).** Any view that equates dispositions *strictly* with simple counterfactuals without reference to the internal basis. |
  | **2. Intrinsicality** | **The Wizard Problem:** Fragility must depend on the molecular structure of the glass, not the presence of a wizard or foam packing. If the glass is fragile, it is fragile in virtue of how *it* is, not its environment. | **Genuine Constraint (with caveats).** Required for dispositions to be properties of *objects*. However, some argue dispositions are inherently relational (to a stimulus). | **Extrinsic Disposition Views.** Views that locate the truth-maker of "x is fragile" partly in the environment (unless they can ground the relational aspect internally). |
  | **3. Causal Efficacy** | **The Idle Shadow:** If the disposition is just a description of what *would* happen (based on categorical bases + laws), the disposition itself does no causal work. The theory must explain how the disposition *produces* the manifestation, not just tracks it. | **Camp Prejudice (Realist).** Essential for Dispositional Realists. Humeans deny this, viewing dispositions as shorthand for regularities. | **Humean Supervenience / Regularity Views.** Any view that treats dispositions as ontological free-riders on categorical properties + laws of nature. |
  | **4. Compatibility with Fundamental Physics** | **Radioactive Decay:** An atom has a disposition to decay within 5 minutes (50% chance). This is probabilistic, not deterministic. Also, **Charge/Mass:** These look like pure powers (repel/attract) without obvious "categorical" clothing. | **Genuine Constraint.** A metaphysics of properties cannot contradict the best empirical science regarding how properties behave at the fundamental level. | **Deterministic Disposition Views.** Views that require dispositions to manifest inevitably when stimulated. **Strict Categoricalism.** Views that insist fundamental properties must be qualitative/non-powerful. |
  | **5. The Grounding Requirement** | **The Regress:** If every disposition requires a categorical base to ground it, what grounds the base? If the base has no dispositions, how does it interact? If it has dispositions, do *those* need bases? | **Camp Prejudice.** Reductionists demand categorical bases. Dispositional Essentialists deny this, arguing fundamental properties *are* pure powers. | **Pure Dispositionalism (if you demand a base).** **Strict Reductionism (if you deny a base is possible).** |
  | **6. The Distinction Requirement** | **The Dual Aspect:** We intuitively distinguish "what the thing can do" (disposition) from "what the thing is" (categorical base). The theory must either preserve this distinction or explain why it is an illusion. | **Camp Prejudice.** Identity Theorists say they are one property described two ways. Dualists say they are two properties. | **Property Dualism (if you choose Identity).** **Identity Theory (if you choose Dualism).** |
  | **7. Unmanifested Potential** | **The Lonely Glass:** A fragile glass exists in a universe where it is never struck. It is still fragile. A disposition must exist even if the manifestation conditions never obtain. | **Genuine Constraint.** Required for dispositions to be real properties rather than just histories of events. | **Actualism / Manifestation Views.** Views that tie the existence of the disposition to the actual occurrence of the manifestation. |

  ### The Incompatible Subsets (The Tensions)

  You cannot maximize all seven requirements simultaneously. There are three specific friction points where satisfying one requirement forces you to weaken or abandon another.

  **1. The Intrinsicality vs. Fink-Solution Tension**
  *   **The Conflict:** To solve the Fink/Mask cases (Req 1), you usually have to appeal to "normal conditions" or the absence of interferers. But "normal conditions" are extrinsic environmental facts. If you build the solution into the definition of the disposition, you threaten Intrinsicality (Req 2).
  *   **The Sacrifice:** If you prioritize **Intrinsicality**, you must abandon the Conditional Analysis entirely (even sophisticated versions). You have to say the disposition is a *sui generis* power that *grounds* the conditional, not defined *by* it. This kills SCA variants.
  *   **The Trade-off:** Keep Intrinsicality $\rightarrow$ Drop Conditional Analysis as the *definition*.

  **2. The Causal Efficacy vs. Physics/Reduction Tension**
  *   **The Conflict:** If dispositions are causally efficacious (Req 3) and fundamental physics is correct (Req 4), then fundamental properties (charge, mass) must be dispositions. But if fundamental properties are dispositions, they cannot have categorical bases (Req 5), because there is nothing "below" them to serve as the base.
  *   **The Sacrifice:** If you prioritize **Causal Efficacy + Physics**, you must drop the **Grounding Requirement** (that dispositions need categorical bases). You are forced into Dispositional Essentialism (fundamental properties are pure powers).
  *   **The Trade-off:** Keep Causal Efficacy $\rightarrow$ Drop the demand for Categorical Bases at the fundamental level.

  **3. The Distinction vs. Identity Tension**
  *   **The Conflict:** We want to keep the Dispositional/Categorical distinction (Req 6). But if every categorical property has a dispositional nature (Req 4, Physics), and every disposition is grounded in a categorical base (Req 5), they look like two sides of the same coin (The Identity Theory).
  *   **The Sacrifice:** If you prioritize **Physics + Grounding**, the Distinction collapses into an Identity. The "power" and the "base" are numerically identical, just described differently.
  *   **The Trade-off:** Keep Grounding + Physics $\rightarrow$ Drop the Real Distinction (accept Identity Theory).

  ### The One Requirement to Keep

  If I can keep only one, it is **Causal Efficacy (Req 3)**.

  **Why:**
  Without causal efficacy, dispositions are ontological ghosts. They become mere linguistic conveniences for describing regularities (Humeanism). If your metaphysics of properties renders the properties causally idle—mere shadows cast by the "real" categorical substrate plus laws—you have not explained *why* the glass breaks, only *that* it breaks. A metaphysics of properties is supposed to explain the machinery of change. If the disposition doesn't turn the gears, it isn't a property, it's a prediction.

  **What You Must Sacrifice for It:**
  To keep Causal Efficacy as the non-negotiable core, you must sacrifice **The Grounding Requirement (Req 5)** and **The Simple Conditional Analysis (Req 1's traditional fix)**.

  1.  **Sacrificing Grounding:** You must accept that at the fundamental level, properties are *pure powers*. They are not grounded in something else that "has" the power; they *are* the power. This invites the charge of "powers in search of a bearer," but it is the cost of making them causally real.
  2.  **Sacrificing SCA:** You must admit that "If struck, it would break" is a *consequence* of the fragility, not the *definition* of it. The power exists even if the conditional is falsified by a fink. This means you cannot analyze dispositions away into conditionals; you must treat them as primitive ontological posits.

  **The Resulting View:**
  You end up with a **Dispositional Essentialist** ontology. Fundamental properties are pure powers (satisfying Physics and Efficacy). They are intrinsic (satisfying Intrinsicality). They do not require categorical bases (sacrificing Grounding). They are not defined by conditionals (sacrificing SCA). This is the only stable configuration that treats dispositions as the engine of the world rather than the exhaust fumes.
