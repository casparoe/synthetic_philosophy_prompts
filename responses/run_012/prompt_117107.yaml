prompt: |-
  I've been going down a rabbit hole on dispositions again (third time this year, i know) and I keep hitting the same wall, so before I read anything else I want the spec nailed down properly — something I can actually steelman against the hard cases. The wall is the fink/mask business. Take the tidy idea that being fragile just amounts to: if the thing were struck, it would break. Now imagine a glass that really is fragile, but with a wizard attached who, the instant you strike it, would make it unbreakable — so it wouldn't break if struck, yet it's still fragile. Or the same glass packed in foam, so striking it wouldn't break it, yet it's still fragile. Or the reverse: a toughened glass that isn't fragile at all, but a wizard would shatter it the moment you struck it, so it would break if struck but isn't fragile. The naive conditional gets all three wrong. I dont want a reading list or citations — just the requirements.

  So write me the desiderata: everything an adequate theory of dispositions has to deliver, with the case or consideration behind each. I mean the core cases (the glass that's fragile but never actually breaks, the sugar that's soluble while sitting dry in the bowl), the fink/mask/mimic cases above, the demand that fragility be intrinsic to the glass rather than a fact about the wizard standing next to it, the demand that dispositions be causally efficacious rather than idle shadows of whatever grounds them, the demand that the account either keep the dispositional/categorical distinction (a thing's power to do X versus whatever it is about the thing that grounds that power) or explain why the distinction is a mistake, consistency with the way fundamental physics treats properties like charge and mass, and the messy cases — probabilistic dispositions (a radioactive atom's disposition to decay this minute), dispositions that can't ever manifest, and dispositions nobody's sure are grounded in anything. For each one, tell me whether it's a genuine constraint any theory must meet or just a prejudice of one camp (the people who think dispositions reduce to their categorical bases, the people who think the fundamental properties just are pure powers, the people who think the whole debate is a verbal muddle), and which positions each requirement kills off. And assume it's meant as a general metaphysics of properties, not just a semantics for fragility — that changes what counts as adequate.

  Give it to me as a table with four columns: requirement | the case or consideration that forces it | genuine constraint or camp prejudice | which views it rules out. Then underneath, the bit I actually care about: name the subsets of requirements you think can't be satisfied together — where taking one seriously forces you to drop another — and if you could keep only one requirement, say which and what you'd have to sacrifice for it. I'd rather have four real requirements and an honest map of the tensions than twelve where half are decoration.
reasoning: |-
