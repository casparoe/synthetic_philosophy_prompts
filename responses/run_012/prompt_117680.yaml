answer: |-
  Judge, families, friends, and those who stand today at the threshold.

  In a few moments, you will raise your right hand. You will swear to bear true faith and allegiance. You will promise to support and defend the Constitution. It is a solemn ritual, and it is right that your families weep with joy. But because this is a university, and because truth matters more than comfort, I ask you to listen closely to what is happening in this room.

  We often speak of this day as a bestowal. We say the state *grants* you citizenship, as if it were a gift wrapped in paper. But a state does not give away what it does not hold. The authority of this country does not come from a moral permission slip signed by its inhabitants. Its right is nothing other than its power. It exists because it has the capacity to endure, to protect, to sustain itself against chaos. When you join us, you are not handing over an authority that was waiting inside you to be transferred. You are aligning your own capacity to act with a collective power that is already here, standing ready. You are entering into a structure that holds because it *can* hold.

  This distinction matters for the oath you are about to take. The law asks for your obedience. It requires that your actions conform to the statutes of this land. But there is a limit to what any oath can do, and it is a limit written into human nature. No sovereign can command your mind. You can promise to follow the rules, but you cannot promise to think them right. That is not yours to give. Your judgment remains your own.

  This is not a tolerance the state grants you out of kindness. It is a boundary the state cannot cross. To try to rule what you think is not merely unjust; it is inept. A government can punish what you do, but it cannot change what you believe. So, do not let anyone tell you that today you are being made free in your thoughts. You were born with that freedom. The ceremony has no power to grant it, and no power to withhold it.

  Yet, we must be honest about the risk we take. We live in words, and words can become acts. There is a line where speech turns into sedition, where expression becomes a threat to the peace. Who draws that line? Not logic. Not philosophy. It is drawn by the sovereign power itself. This is the vulnerability of any commonwealth: we defend free thought, but the state must decide when speech becomes dangerous action. We accept this circularity not because it is perfect, but because the alternative is not freedom, but conflict.

  So, today we do not celebrate the gift of freedom. You carried that with you when you walked through the door. We celebrate the agreement to live together securely. You keep your mind. We ask for your peace. You join the power that keeps the law.

  Welcome to the reality of this country. May you live in it safely, and think within it freely.
