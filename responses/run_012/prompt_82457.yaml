answer: |-
  Hello there. First off, take a deep breath. It is completely normal to feel a bit overwhelmed when you start digging past the slogans in electoral systems; that is precisely what second-year modules are designed to do. You are asking the right sort of questions.

  Your proposal is intellectually stimulating, and you are not the first person to conceive of it. In political science theory, this is sometimes referred to as a **Weighted Voting System** within single-member districts. However, there are several significant theoretical and practical hurdles that explain why it has not been adopted in Westminster-style democracies.

  Here is a breakdown of the flaws and the reasons for its absence, which should help you structure your essay argument. I have kept to British English conventions as requested.

  ### 1. The 'Wasted Vote' Misconception
  Your central premise is that "every vote is 'used'". Unfortunately, this is not entirely accurate under your proposed model.

  In your system, only the votes cast for the *winning* candidate contribute to voting weight in the chamber. If you vote for a candidate who comes second (say, with 40% of the vote against a winner with 45%), your vote still results in zero representation in the legislature. The winner does not gain extra weight from your vote; they only gain weight from their own share. Therefore, the 'wasted vote' problem for opposition supporters in safe seats remains largely unresolved.

  ### 2. The Principle of Political Equality
  The most significant normative objection is the violation of the democratic principle of 'one person, one vote'.

  Under your system, the constituents of an MP who won with 60% of the vote would effectively have more legislative power than the constituents of an MP who won with 35%. This creates a hierarchy of citizenship where some voters' interests carry more weight in law-making simply because their MP won more comfortably. In British constitutional theory, all MPs are equal representatives once elected; introducing formal inequality among members undermines the legitimacy of the House.

  ### 3. Governance and Stability
  Practically, this would make forming a government incredibly complex.
  *   **Calculating Majorities:** Currently, a government needs 326 seats (in the Commons) for a majority. Under your system, a party could have the most *seats* but fewer *weighted votes*. This could lead to frequent hung parliaments or unstable minority governments where the math changes every time a by-election occurs.
  *   **Party Discipline:** The Whip system relies on MPs having equal value. If some MPs count for more than others, party leaders might ignore MPs with low voting weights, or conversely, focus entirely on courting the 'heavyweight' MPs. This could fracture party cohesion.

  ### 4. Perverse Incentives
  This system might encourage MPs to behave strangely.
  *   **Ignoring Safe Seats:** If an MP is in a safe seat with 60% support, they might stop campaigning there because increasing their share to 65% yields diminishing returns on voting weight.
  *   **Targeting Marginals:** Parties would pour all resources into marginals where a small swing creates a new weighted vote, potentially neglecting policy issues important to safe constituencies.

  ### 5. Why PR is Different
  You mentioned that this is "basically proportional representation". It is important to distinguish between **proportionality of seats** (PR) and **proportionality of voting power** (your model).

  True PR (like Party List or STV) ensures that the *composition* of the chamber reflects the vote share. Your model keeps the composition the same (one person per seat) but alters the *power* of the seat. While the outcome might look similar mathematically, the accountability mechanism is different. In PR, if a party loses 5% of the vote, they lose 5% of the seats. In your model, they might keep the same number of seats, but those seats become 'weaker'. This makes it harder for voters to punish a government at the ballot box, as the link between vote share and seat share is obscured.

  ### How to use this in your essay
  Do not discard this idea; instead, use it to show critical engagement. You could argue:
  1.  While innovative, weighted voting fails to solve the 'wasted vote' issue for losing candidates.
  2.  It trades the 'constituency link' benefit of FPTP against the 'political equality' benefit of PR, ending up satisfying neither fully.
  3.  It highlights that the real tension is not just about math, but about what we value: local accountability (FPTP) vs. equal representation (PR).

  It is a clever thought experiment, but the flaws regarding democratic equality and the persistence of wasted votes for losing candidates are likely why no modern democracy has implemented it.

  Good luck with the essay. It sounds like you are engaging with the material at exactly the level your tutors want to see.
