  *(Self-Correction on "One Person, One Vote"):* In the US, this is a legal standard. In the UK, it's a constitutional convention. I should frame it as a democratic principle rather than a legal bar, as the UK has an uncodified constitution.

  *(Self-Correction on "Weighted Voting"):* Actually, there is a specific term for this. It's sometimes discussed as "Weighted Representative Voting." I should mention that it exists in theory but is practically unused for these reasons.

