prompt: |-
  Hi, I'm a second-year politics student and I'm stuck on something for my comparative government module. We've been doing PR vs first-past-the-post and I think I've spotted something everyone's missing, but I want to check before I put it in my essay.

  The way I see it, the whole 'wasted votes' argument for PR is doing all the work, and it's actually easy to fix under FPTP. What if we kept single-member seats exactly as they are, but gave each MP a voting weight in the chamber proportional to how many votes they actually got? So an MP who won 60% of their seat carries more weight than one who scraped in with 32%. That way every vote is 'used' — it directly adds to the weight of the person you voted for — and you keep the constituency link. It seems to me this gives you the best of both, and it's basically proportional representation but without the party lists, since PR just means seats matching votes and this makes votes match power, which is the same thing really.

  My question is: if this works, why has no one done it? And if it doesn't work, where's the flaw? I can't see why you'd ever prefer full PR to this. Also we have to write in British English for this module so could you keep it in that, my tutor marks us down for American spellings.

  Sorry for the long message, I'm just trying to seperate the actual arguments from the slogans and it's doing my head in alot.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year politics student (UK context implied by "comparative government module," "British English," "FPTP," "PR").
      *   **Topic:** Electoral systems (Proportional Representation vs. First-Past-The-Post).
      *   **Core Idea:** A hybrid system where MPs retain single-member constituencies (FPTP style) but have weighted voting power in parliament based on their vote share (e.g., 60% vote share = 1.2 votes in parliament, 32% = 0.6 votes).
      *   **Claim:** This solves the "wasted vote" problem, keeps the constituency link, and achieves proportionality without party lists.
      *   **Questions:** Why hasn't this been done? What's the flaw? Is it better than full PR?
      *   **Constraint:** Must use British English (spelling, grammar, tone).
      *   **Tone:** Academic, supportive, critical but encouraging (it's a second-year student trying to think critically).

  2.  **Evaluate the Student's Idea (The "Weighted Vote" System):**
      *   *Concept:* This is known as "Weighted Voting" or "Vote Weighting" within single-member districts. It's not entirely new, but it is rare in national legislatures.
      *   *Strengths:*
          *   Retains constituency link (local MP).
          *   Reduces "wasted vote" feeling (votes contribute to weight).
          *   Theoretically increases proportionality of *power* if not *seats*.
      *   *Weaknesses/Flaws:*
          *   **Equality of Representation:** One person, one vote. If MP A has 2x the voting power of MP B, does that mean the constituents of A have 2x the say? This violates the democratic principle of political equality among citizens.
          *   **Instability/Coalitions:** Calculating majorities becomes a nightmare. A government might have more *seats* but fewer *weighted votes*.
          *   **Incentives:** MPs might ignore "safe" seats (where weight is capped/high) vs. marginal seats. Or, they might focus only on turning out their base to increase weight, ignoring the opposition voters in their constituency (who still get no representation).
          *   **The "Wasted Vote" Fallacy:** In this system, votes for losing candidates *still* count for nothing. If Candidate X gets 40% and loses to Candidate Y with 45%, Candidate X's voters have zero weight. The student's premise ("every vote is 'used'") is factually incorrect regarding losing candidates.
          *   **Party Discipline:** If voting weight varies, how does party whipping work? Does the party leader have more power if their MPs won comfortably?
          *   **Constitutional Norms:** Westminster systems rely on the convention that every MP is equal. Changing this breaks centuries of precedent.

  3.  **Drafting the Response (incorporating British English):**
      *   *Greeting & Validation:* Acknowledge the creativity. It's good critical thinking for a second-year student.
      *   *Terminology:* Identify the concept (Weighted Voting).
      *   *Address the "Why hasn't it been done?" question:*
          *   Principle of "One Person, One Vote."
          *   Complexity/Transparency.
          *   The "Loser" Problem (crucial point: votes for losers are still wasted).
      *   *Address the "Flaw" question:*
          *   Inequality between constituents.
          *   Governance instability.
          *   Perverse incentives (ignoring safe seats or opposition voters).
      *   *Comparison to PR:* Explain why PR is still distinct (seats vs. voting power).
      *   *Encouragement:* Don't crush the idea, but refine the critique for the essay.
      *   *Language Check:* Ensure *colour, analyse, programme, constituency, parliament, centre* etc., are used correctly. Avoid *color, analyze, program, constituency* (wait, constituency is same), *center*. Watch out for "alot" (a lot).

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I point out that the student's claim "every vote is 'used'" is wrong. If I vote for a loser, my vote contributes *nothing* to the parliament's composition in this model. Only the winner's weight changes. This is the biggest hole in the argument.
      *   *Nuance:* There is a system called "Cumulative Voting" or specific weighted systems in some corporate boards or specific councils (like the EU Council of Ministers used to be), but not for national legislatures based on election margins.
      *   *Tone:* Keep it tutorial-like. "Have you considered..." rather than "You are wrong."

  5.  **Final Polish (British English Check):**
      *   *Spelling:* Proportional, programme (if needed), centre, analyse, favour, labour (if referring to party), colour.
      *   *Vocabulary:* Constituency, Parliament, Government (capitalised when specific), MP, Cabinet.
      *   *Phrasing:* "Doing my head in" -> Acknowledge the stress but keep formal in response. "Realise" vs "Realize" (Oxford spelling is acceptable in UK unis usually, but 's' is safer for 'analyse'). Let's stick to standard UK conventions (ise/ize are both often okay in Oxford style, but 's' is more distinctly British to a layperson. I will use 's' for verbs like 'analyse', 'organise' to be safe).
      *   *Specific check:* The user wrote "alot". I should write "a lot" in my response without explicitly correcting them rudely.

  6.  **Structure of the Response:**
      *   Introduction: Validate the idea, it's a known concept (Weighted Voting).
      *   Point 1: The "Wasted Vote" Misconception (Votes for losers still waste).
      *   Point 2: Democratic Equality (One person, one vote principle).
