answer: |-
  **The Case**

  In the municipal licensing office of a mid-sized city, a senior clerk manages the approval of building permits for local contractors. A long-standing, reciprocal understanding exists between the clerk and a reputable construction firm: upon the successful conclusion of a complex project, the firm's director presents the clerk with an envelope containing a sum of cash. This payment is not declared in the office ledger, contravening the explicit written code of conduct for civil servants. However, the money is not pocketed by the clerk; it is placed into an unrecorded 'welfare fund' used to purchase tea, coffee, and minor stationery supplies for the entire department, fostering morale in an under-resourced environment. The permit in question is awarded solely on technical merit; the firm is fully compliant with all safety and zoning regulations, and the payment does not influence the *decision* to approve, only the *timing* of the administrative processing.

  The scenario diverges on a single feature regarding the queue management of other applicants. In the first version, the clerk prioritises the firm's file by physically moving it to the top of the pile, causing a delay in the processing of a competitor's compliant application. In the second version, the clerk processes the firm's file during unpaid overtime hours or utilises slack capacity in the workflow, ensuring that the position of all other applications in the queue remains exactly as it would have been without the payment. In both versions, the local community regards this exchange as a customary gesture of gratitude rather than a bribe, and the participants do not view the practice as morally wrongful.

  **Analysis of Verdicts**

  | Definition | Version 1 (Queue Displaced) | Version 2 (Slack Capacity) | Clause Doing the Work |
  | :--- | :--- | :--- | :--- |
  | **(a) Formal Duties** | Corruption | Corruption | "Deviation from the formal duties" |
  | **(b) Principal-Agent** | Corruption | No Corruption | "Principal's interests are set back" |
  | **(c) Market Allocation** | No Corruption | No Corruption | "Allocated by price" |

  In Version 1, definition (a) finds corruption because the written code is breached, regardless of the outcome. Definition (b) also finds corruption because the delay imposed on a competitor sets back the public interest (the principal) by creating inefficiency and unfairness. Definition (c), however, finds no corruption because the permit is allocated by regulatory compliance, not price; the payment did not distort a market mechanism that relies on willingness to pay. In Version 2, definition (a) still finds corruption due to the rule breach. Definition (b) now finds no corruption, as the principal's interests are not set back—the work is done without harming others, and office morale is arguably improved. Definition (c) continues to find no corruption, as the allocation mechanism remains non-market and the efficient outcome (qualified builder gets permit) is preserved.

  **Nature of the Disagreement**

  The three definitions are disagreeing about *what corruption is*, not merely about the facts of the case. The facts (the payment, the rule breach, the consequence) are held fixed or varied systematically, yet the moral status of the act shifts depending on the conceptual lens applied. This is a **substantive** disagreement. Definition (a) treats corruption as a deontological violation of institutional integrity; definition (b) treats it as a consequentialist harm to the public trust; definition (c) treats it as an economic inefficiency. Because they prioritise different values (rule-following vs. welfare vs. market efficiency), they carve the concept of corruption differently.

  **Implications for Universalism**

  This construction challenges the claim that Western anti-corruption standards are universal. If the local participants possess their own term for the practice and do not regard it as a wrong, imposing definition (a) constitutes a form of ethical imperialism that ignores the functional role the practice plays in social cohesion (reciprocity) and resource supplementation (the welfare fund). If definition (b) or (c) were adopted, the practice might be deemed acceptable in Version 2, suggesting that 'corruption' is context-dependent. Universalists who insist on definition (a) must argue that the integrity of the formal rule is intrinsically valuable, regardless of local consensus or beneficial consequences.

  **The Pivotal Feature**

  The feature doing the most work is the **impact on the queue (consequences for third parties)**. This feature is the switch that toggles definition (b) between corruption and non-corruption while leaving (a) and (c) unchanged. If this feature is removed (i.e., if the consequences are left ambiguous), definition (b) becomes indeterminate, and the separation between (a) and (b) collapses, as (b) would likely default to assuming harm from rule-breaking.

  A universalist holding that corruption is one thing across cultures would attack this construction as **rigged**. They would argue that by allowing the 'welfare fund' aspect, the case obscures the inherent conflict of interest, which *is* the harm to the principal regardless of queue management. They would contend that Version 2 is an illusion: any deviation from formal duties undermines the rule of law, which is the ultimate interest of the principal. Therefore, they would reject the variation as irrelevant, insisting that the breach of the formal rule (definition (a)) is the only valid metric, rendering the consequentialist distinction artificial.
