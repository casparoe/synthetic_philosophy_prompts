      *   **2. The Strongest Move:**
          *   What is genuinely new or right?
          *   *Idea:* The focus on the *motivational set* being revisable/constituted by self-interpretation is strong (Williams-adjacent but pushed further). But the *real* strength is linking normative practices (blame/advice) to *deliberative distance* rather than current motivational state. This explains why we blame people who *could* have reasoned better even if they weren't initially motivated.
          *   *Draft:* The strongest move is linking the appropriateness of normative practices like blame and advice to deliberative distance rather than current motivational alignment. This captures the intuitive distinction between someone who is unreachable by argument (where blame seems futile or purely causal) and someone who is merely unreflective (where blame serves a rational function). By grounding the normativity in the *potential* for deliberative access rather than the *actual* state of motivation, you preserve the force of moral reproach without needing metaphysically queer external facts. This successfully isolates the practical stake of the debate: not whether reasons exist "out there," but whether the agent is reachable by reason-giving practices.

      *   **3. The Weakest Link:**
          *   Need two paragraphs.
          *   *Objection 1:* The definition of "deliberative distance" seems to smuggle in externalism. If deliberation can change the motivational set to accept a reason, what constrains deliberation? If *any* reason can be reached by "good deliberation," then internalism becomes trivial (everything is internal given enough deliberation). If *some* reasons cannot be reached, what distinguishes them?
          *   *Objection 2:* The "different upbringing" case (Case 3). The essay says this is the externalist win. But if deliberative distance is the metric, and upbringing is excluded from deliberation (by definition, it's situational/history), then this reason has infinite deliberative distance. Does that mean it's not a reason? The essay says "no external reasons, only reasons at greater distance." But infinite distance looks like external reasons.
          *   *Drafting Paragraph 1:* The weakest link lies in the constraint placed on "deliberating well." You define deliberative distance as how far an agent can get without changes in their situation or the world, but you do not specify what counts as a valid move within deliberation. If good deliberation includes radical self-reinterpretation, then tether strength becomes irrelevant because any motivation can be revised away; internalism collapses into a trivial claim that any reason is internal given enough cognitive work. If, however, there are limits to what deliberation can achieve without new experiences, you need an account of those limits that does not simply reintroduce the external/internal binary under a new name. Without this, the scalar looks like a measure of psychological resistance rather than normative reach.
          *   *Drafting Paragraph 2:* Furthermore, the treatment of the third case (different upbringing required) threatens to concede the externalist point rather than preserve it. You claim there are no external reasons, only reasons at greater deliberative distance, yet a reason requiring a different upbringing has infinite deliberative distance from the current standpoint. If normative practices track deliberative distance, and the distance is unbridgeable by definition, then blame and advice become inappropriate, which is exactly what the externalist denies regarding objective obligations. By ruling these out as "too distant," you effectively agree with the internalist that they are not reasons *for this agent*, thereby losing the externalist's core claim that some obligations bind regardless of motivational reachability. The framework risks saying there are no external reasons simply by defining them out of existence rather than explaining their normative grip.

      *   **4. Do the two scalars collapse?:**
          *   Verdict: Yes, they likely collapse or are highly correlated.
          *   Argument: Tether strength is the *size of change* needed. Deliberative distance is the *ability to effect that change via thought*. If the change is small (low tether strength), deliberative distance is usually low (easy to think into). If the change is large (high tether strength), deliberative distance is usually high. The only divergence is if a small change is psychologically blocked (high distance, low strength) or a large change is easy (low distance, high strength). But "size of change" is usually measured in psychological difficulty.
          *   *Draft:* Verdict: They largely collapse into a single dimension of psychological accessibility. Tether strength measures the magnitude of motivational change required, while deliberative distance measures the feasibility of achieving that change through reflection. In practice, the size of the change needed is the primary determinant of how far deliberation can get you; a massive shift in values (high tether strength) will almost always correspond to a large deliberative distance, while a minor adjustment corresponds to a short distance. The only way they remain independent is if an agent is irrationally blocked from making a small change (high distance, low strength) or miraculously open to a massive one (low distance, high strength), but these are outliers. Consequently, the two-dimensional map often reduces to a single axis of how hard it is to bring the agent to accept the reason.

