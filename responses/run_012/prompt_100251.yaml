answer: |-
  1. **Summary**
  The essay argues that the standard binary distinction between internal and external reasons fails because an agent's motivational set is fluid and constituted by self-interpretation rather than fixed inventory. Consequently, whether a reason counts as internal shifts based on the agent's deliberative activity rather than the reason's normative status. To resolve this, the essay proposes replacing the binary with two scalar dimensions: tether strength, measuring the motivational change required to accept a reason, and deliberative distance, measuring how much of that change can be achieved through reflection alone. The author claims this framework preserves the externalist insight that some obligations hold regardless of current motivation while better tracking normative practices like blame and advice. Three cases illustrate how the binary mishandles latent reasons that depend on situational changes rather than mere reflection. Ultimately, the debate is reframed as locating a point on a continuum concerning an agent's relation to their future deliberative potential.

  2. **The strongest move**
  The strongest move is linking the appropriateness of normative practices like blame and advice to deliberative distance rather than current motivational alignment. This captures the intuitive distinction between someone who is unreachable by argument (where blame seems futile or purely causal) and someone who is merely unreflective (where blame serves a rational function). By grounding the normativity in the *potential* for deliberative access rather than the *actual* state of motivation, you preserve the force of moral reproach without needing metaphysically queer external facts. This successfully isolates the practical stake of the debate: not whether reasons exist "out there," but whether the agent is reachable by reason-giving practices.

  3. **The weakest link**
  The weakest link lies in the constraint placed on "deliberating well." You define deliberative distance as how far an agent can get without changes in their situation or the world, but you do not specify what counts as a valid move within deliberation. If good deliberation includes radical self-reinterpretation, then tether strength becomes irrelevant because any motivation can be revised away; internalism collapses into a trivial claim that any reason is internal given enough cognitive work. If, however, there are limits to what deliberation can achieve without new experiences, you need an account of those limits that does not simply reintroduce the external/internal binary under a new name. Without this, the scalar looks like a measure of psychological resistance rather than normative reach.

  Furthermore, the treatment of the third case (different upbringing required) threatens to concede the externalist point rather than preserve it. You claim there are no external reasons, only reasons at greater deliberative distance, yet a reason requiring a different upbringing has infinite deliberative distance from the current standpoint. If normative practices track deliberative distance, and the distance is unbridgeable by definition, then blame and advice become inappropriate, which is exactly what the externalist denies regarding objective obligations. By ruling these out as "too distant," you effectively agree with the internalist that they are not reasons *for this agent*, thereby losing the externalist's core claim that some obligations bind regardless of motivational reachability.

  4. **Do the two scalars collapse?**
  Verdict: They risk collapsing into a single dimension of psychological accessibility. Tether strength measures the magnitude of motivational change required, while deliberative distance measures the feasibility of achieving that change through reflection. In practice, the size of the change needed is the primary determinant of how far deliberation can get you; a massive shift in values (high tether strength) will almost always correspond to a large deliberative distance, while a minor adjustment corresponds to a short distance. The only way they remain independent is if an agent is irrationally blocked from making a small change (high distance, low strength) or miraculously open to a massive one (low distance, high strength), but these are outliers. Consequently, the two-dimensional map often reduces to a single axis of how hard it is to bring the agent to accept the reason.

  5. **One further test case**
  Consider the case of severe depression: an agent who acknowledges a consideration as a reason and has it within their motivational set (low tether strength, zero deliberative distance) but lacks the psychic energy to act on it. Your framework classifies this as a fully internal reason with minimal distance, suggesting blame and advice are appropriate. However, intuitively, we withhold blame in such cases not because the reason is external, but because the link between reason and action is broken by pathology rather than motivational absence. This reveals that your scalars track *acceptance* of reasons but miss the *efficacy* of reasons, which is also crucial for normative practices like blame.

  6. **What I would cut or rewrite**
  *   Cut the claim "there are no external reasons" in the proposal section; it contradicts your aim to preserve externalist insights and invites the objection that you are just relabeling internalism.
  *   Rewrite the definition of "deliberative distance" to explicitly state constraints on what counts as rational deliberation, preventing the trivialization worry.
  *   Clarify the status of the "different upbringing" case: explicitly state whether the agent has a reason there or not, rather than leaving it as a limit case.
  *   Tighten the connection between the scalars and normative practices in the second half; explain why *distance* specifically tracks blame rather than *strength*.
  *   Remove the phrase "without any change in their situation or in the world" if it excludes necessary conceptual shifts that count as deliberation rather than experience.
