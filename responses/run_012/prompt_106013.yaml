  ### ⚠️ Notes on Logical Collapses
  **\*\* E-Admissibility vs. Maximality:**
  On standard convex credal sets, these two rules often select the exact same options. The tree treats them as distinct philosophical commitments (optimizing vs. non-domination), but in practice, they may not separate the positions. If your set is convex, you can treat these leaves as merged.

  ### 🚫 Unoccupied Combinations (Dead Ends)
  The following logical paths are theoretically possible but effectively无人 (no one occupies them).

  1.  **Bookkeeping Summary + Imprecision Required**
      *   *Diagnosis:* **Unattractive.** If the set is just a summary of possible sharp states, there is no normative force to *mandate* the summary rather than picking one of the sharp candidates.
  2.  **World is Indefinite + Bookkeeping Summary**
      *   *Diagnosis:* **Incoherent.** If reality itself is indeterminate, summarizing it with a set of sharp functions (which assume determinacy) is a category error.
  3.  **World is Indefinite + Imprecision Permitted**
      *   *Diagnosis:* **Unexplored.** Usually, if one posits ontic indeterminacy, it is taken to force imprecision upon the agent, not merely permit it.

  ### 📝 Handout Tips for the Facilitator
  *   **The "Actual State" Branch:** This is where the live philosophical debate is (Joyce, Sturgeon, Levi, Walley). Focus discussion here.
  *   **The "Decision Rule" Node:** Emphasize that your metaphysics (Actual vs. Summary) constrains your decision theory. You cannot consistently hold "Bookkeeping Summary" and "Maximin" without explaining why you are maximizing utility over a set you admit isn't real.
  *   **The Root:** Remind participants that answering "Yes" to Q1 is the Orthodox Bayesian view. The rest of the tree is the "Dissenters' Map."
