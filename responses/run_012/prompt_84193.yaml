answer: |-
  This is a sharp dissection of a problem that usually gets hand-waved away. You are right to suspect that the economic analogy is doing heavy lifting it isn't entitled to.

  Here is the strongest Kantian line against moral trade, followed by the specific point where the machinery jams—not because Kant is dogmatic, but because the ontology of "obligation" is incompatible with the ontology of "trade."

  ### The Strongest Kantian Line: The Corruption of the Maxim

  Kant would not object to moral trade primarily because it results in the "wrong" actions (helping the pro-choice cause might be permissible, helping animals is permissible). He would object to the **structure of the will** that generates the action.

  For Kant, the moral worth of an act lies entirely in whether it is done *from duty*, according to a maxim that can be willed as universal law. Moral trade structurally converts a **Categorical Imperative** ("I must help reduce suffering") into a **Hypothetical Imperative** ("I will help reduce suffering *if* you help reduce abortion restrictions").

  **1. The Poisoned Motive**
  In your scenario, when you advocate for abortion rights, your maxim is not: *"I am helping secure bodily autonomy because it is a requirement of reason."*
  Your maxim is: *"I am helping secure bodily autonomy to purchase advocacy for animals."*

  This renders the act morally null. It is not merely "less moral"; it lacks moral content entirely. It becomes a prudential act, indistinguishable in structure from paying a contractor. You are treating your moral agency as a tool for satisfying preferences, rather than treating your will as a legislator of universal law.

  **2. The Trap of Imperfect Duties**
  Your intuition about imperfect duties (duties of virtue, like beneficence) is the strongest foothold for the trader. Kant admits we have latitude (*Spielraum*) in how we fulfill these. I don't have to help *everyone*; I can choose my projects.

  However, Kant insists that while the *choice of object* is free, the *ground of determination* must still be moral.
  *   **Permissible:** "I have a duty to beneficence. I cannot help everyone. I will choose to help farmers because I am particularly moved by their plight." (The ground is the duty itself, filtered through inclination).
  *   **Impermissible:** "I have a duty to beneficence. I will choose to help your cause because you are paying me with political capital."

  The latitude is for **judgment**, not for **bargaining**. The moment the *reason* for selecting the object is the quid-pro-quo, you have ceased to adopt the required end (the happiness of others) and have instead adopted the end of **securing a return on investment**. You are no longer fulfilling an imperfect duty; you are engaging in a contract.

  ### Where the Machinery Jams

  You asked where the analogy breaks. It breaks at the concept of **Alienability**.

  In economics, trade works because goods are alienable. I can transfer ownership of my apple to you. Once traded, it is yours to dispose of as you like. The "gains-from-trade" model relies on the fact that we are swapping things we *own*.

  **1. You Do Not Own Your Duty**
  In Kantian ethics, you are not the owner of your moral obligations; you are their **subject** (or their executor). You cannot trade what you do not own.
  When you propose moral trade, you are implicitly claiming ownership of your "political capital" or "moral effort" as a commodity. But for Kant, your capacity for moral action is not a resource to be allocated for maximum value satisfaction; it is the faculty by which you recognize law.

  To "spend" your moral effort on a cause you do not value, in exchange for someone else "spending" theirs, treats moral agency as a commodity. This violates the **Formula of Humanity**. You are treating your own rational nature (and your partner's) as a mere means to the satisfaction of preferences.

  **2. The Category Error: Satisfaction vs. Validity**
  The "gains-from-trade" model assumes morality is about **satisfying values**.
  *   *Utilitarian/Preference view:* We have values X and Y. We want to maximize the satisfaction of X and Y. Trade allows us to move to a higher indifference curve.
  *   *Kantian view:* Morality is about the **validity of laws**.

  A law is not "more satisfied" if I follow it efficiently. A law is either binding or it is not.
  If abortion rights are a moral requirement (as your partner believes), they are a requirement *for you too*, if they are truly moral laws. If they are not a moral requirement for you, then helping your partner achieve them is morally neutral (or potentially wrong, if the cause is unjust).

  The jam occurs here:
  *   **If the issue is moral:** You are already obligated to support it. Trading for it is redundant and corrupts the motive.
  *   **If the issue is not moral:** It is a matter of preference. Trading preferences is fine, but it is not "moral trade," it is just politics. You cannot dress up a preference swap as a moral frontier.

  Moral trade tries to have it both ways: it treats the issues as moral (hence the "duty" to trade) but treats the commitment as preferential (hence the ability to swap). Kant's machinery seizes because it cannot process an obligation that is binding only conditionally on a counter-party's performance.

  **3. The Kingdom of Ends vs. The Bilateral Deal**
  Finally, the break is political. Kant's ethics culminates in the **Kingdom of Ends**—a systematic union of rational beings through common objective laws.
  Moral trade is inherently **bilateral and private**. It creates a private law between two agents: *"I will do X if you do Y."*

  This private legislation undermines the publicity of moral law. If morality is the legislation of reason, it must be universal. A deal that says "I will ignore this suffering unless paid" creates a particular exception to the moral law based on private interest. It fragments the Kingdom of Ends into a marketplace of moral exemptions.

  ### The Verdict

  Kant would say the "gains-from-trade" model is a category error. You can have **coordination**, but not **trade**.

  *   **Coordination (Permissible):** We both agree animals matter. We realize we can't save them all. I agree to focus on factory farms, you focus on slaughterhouses, so we don't duplicate effort. Here, the *motive* is still the animals. The trade is only in *logistics*.
  *   **Trade (Impermissible):** I don't care about abortion, you don't care about animals. We swap advocacy. Here, the *motive* is the deal.

  The machinery jams because **obligation is inalienable**. You cannot transfer the "ought." As soon as you try to put a price on it (even a price in political capital), it ceases to be an "ought" and becomes a "want." And if it's just a "want," you aren't trading morals anymore; you're just trading favors, and calling it "moral trade" is a confusion of tongues.

  So, the frontier you describe doesn't exist for Kant. It's not a hidden market he missed; it's a mirage created by applying economic scarcity to moral law. For Kant, there is no scarcity of obligation, only a scarcity of will. And you cannot trade will.
