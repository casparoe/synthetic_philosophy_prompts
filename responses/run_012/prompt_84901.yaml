answer: |-
  Your instinct is serving you well. The feeling you have—that the book is "smoother" than your lectures—is because the book is smoothing over the technical constraints that make behavioural genetics a rigorous science. Your lectures are likely teaching you the *mathematical definition* of heritability, while the book is selling you a *narrative interpretation* of it.

  Here is the conceptual audit, sentence by sentence, from the perspective of a careful behavioural geneticist.

  ### Sentence-by-Sentence Audit

  **1. "Heritability is the proportion of a trait's variation in a population that's due to genes."**
  *   **Verdict:** *Technically acceptable, but imprecise.*
  *   **The Nuance:** A textbook would add three crucial qualifiers immediately. First, it is variation due to genetic *variation* (differences in DNA between people), not just "genes." Second, it is specific to a *specific population* (you can't apply a heritability estimate from Sweden to Nigeria). Third, it is specific to a *specific time* and environmental context. If the environment becomes uniform, heritability goes up; if genetics become uniform, heritability goes down. It is not a fixed constant of the trait.

  **2. "It runs from 0 to 1, and when researchers say the heritability of adult height is about 0.8, they mean that roughly 80% of your height is genetic and the remaining 20% comes from the environment — food, disease, and so on."**
  *   **Verdict:** **Wrong.** This is the most common and serious misconception in the field.
  *   **The Nuance:** Heritability applies to *variance in a population*, not to an *individual's trait value*. You cannot partition an individual's height into percentages. It makes no sense to say "80% of *your* height."
  *   **Example:** Imagine a population where everyone has the exact same nutritious food. Environmental variance is zero. Heritability of height would be 1.0 (100%). Now imagine a population where everyone has identical genes (clones). Genetic variance is zero. Heritability would be 0.0. The trait (height) hasn't changed, but the heritability statistic has flipped completely. The book's phrasing implies height is "made of" genes and environment like a cake is made of flour and sugar. It isn't; it's the *differences* between people that are being statistically partitioned.

  **3. "Twin studies produce these numbers by comparing identical and fraternal twins; the fact that identical twins are more alike even when they're raised in different homes shows the similarity is genetic rather than environmental."**
  *   **Verdict:** *Mostly right, but simplified.*
  *   **The Nuance:** This describes the logic of the ACE model (Additive genetics, Common environment, Unique environment). The "raised in different homes" part refers to adoption studies, which are often combined with twin studies. A careful geneticist would note the "Equal Environments Assumption"—the assumption that identical twins aren't treated more similarly than fraternal twins in ways that affect the trait. If identical twins are treated more alike *because* they look alike, heritability can be overestimated. The book glosses over this assumption.

  **4. "For traits like intelligence and personality, heritability actually increases with age and settles somewhere around 0.5 to 0.8 in adulthood, which means that by the time you're grown up how smart you are is mostly down to your DNA, and differences between schools, parents and neighbourhoods are doing comparatively little."**
  *   **Verdict:** *The data is right, the conclusion is misleading.*
  *   **The Nuance:** It is true that heritability of cognitive ability tends to increase with age (the Wilson Effect), and shared environment (parents/schools) tends to fade. However, the phrase "how smart you are is mostly down to your DNA" repeats the individual fallacy from Sentence 2. Furthermore, while *shared* environment fades, *non-shared* environment (unique experiences, peers, accidents, stochastic biological development) remains substantial. The book implies environmental influence vanishes; it actually just becomes more individualized and harder to measure.

  **5. "It also tells us something about group differences: if a trait is highly heritable within each group, then an average difference between two groups is likely to have a genetic component as well."**
  *   **Verdict:** **Wrong.** This is a logical fallacy known as **Lewontin's Fallacy**.
  *   **The Nuance:** Within-group heritability tells you *nothing* about between-group differences.
  *   **Concept:** Imagine two pots of corn. Pot A has high-quality seeds and poor soil. Pot B has low-quality seeds and rich soil. Within Pot A, the differences in height are 100% genetic (same soil). Within Pot B, differences are 100% genetic (same soil). Heritability is high in both. But the *average difference* between Pot A and Pot B is 100% environmental (soil quality). High within-group heritability is perfectly compatible with 100% environmental causes for group differences. The book presents this as a likelihood; statistically, it is an unjustified leap.

  **6. "The whole topic is controversial mostly for political reasons, and critics who object that heritability depends on the environment are confusing a technical caveat with a substantive objection."**
  *   **Verdict:** *Dismissive and scientifically inaccurate.*
  *   **The Nuance:** While politics does play a role, the objection that "heritability depends on the environment" is not a caveat; it is the *definition*. Heritability is a ratio of variances ($V_G / V_P$). If Environmental Variance ($V_E$) changes, the ratio changes. To call this a "technical caveat" minimizes the fact that heritability is not a property of the trait, but a property of the population in its current environment.

  **7. "None of this means a trait can't change — a highly heritable trait can still shift if you change the environment — but the heritability figure is still the best estimate we have of how much of a trait is inborn."**
  *   **Verdict:** *Contradictory and misleading.*
  *   **The Nuance:** The first clause is correct (e.g., PKU is a highly heritable genetic disorder, but diet changes the outcome). The second clause ("how much of a trait is inborn") contradicts the earlier admission that heritability of IQ *increases* with age. If a trait becomes *more* heritable as you age, it is by definition not "inborn" (present at birth). "Inborn" implies immutability and genetic determinism, which heritability does not measure.

  ***

  ### The Straight Answers

  **1. Is the last sentence a fair way to put it?**
  **No.** It smuggles in a concept the statistic does not support.
  Heritability estimates the proportion of *current variation* attributable to *current genetic variation*. It does not estimate how "inborn" a trait is.
  *   **Why it's wrong:** "Inborn" suggests the trait is fixed at conception. As the paragraph itself admitted, heritability for intelligence is low in childhood and high in adulthood. If heritability changes over your lifespan, it cannot be a measure of what was "inborn."
  *   **What it smuggles:** It conflates *statistical variance* with *causal fixity*. It invites the reader to think, "This is fixed, don't bother trying to change it," which is the exact opposite of what the first half of the sentence admits (that traits can change).

  **2. Is your instinct about the group-difference bit correct?**
  **Yes, absolutely.** You have picked the right target.
  The claim that within-group heritability predicts between-group differences is the single most robustly refuted claim in quantitative genetics. It is a category error.
  *   **Why you should trust this instinct:** Within-group statistics describe the *spread* of data inside a box. Between-group differences describe the *distance* between the boxes. You cannot calculate the distance between the boxes by measuring the spread inside them.
  *   **However:** While the group-difference claim is the most *socially* charged error, the "80% of *your* height" error (Sentence 2) is the most *fundamentally* incorrect statement in the paragraph. It misunderstands the basic unit of analysis.

  ### Summary
  Your lectures are likely emphasizing that heritability is a **population statistic** that is **context-dependent** and **cannot be applied to individuals or groups**. The book is presenting heritability as a **fixed property of a trait** that explains **individual destiny** and **group hierarchy**.

  You are not misunderstanding the statistics; the book is translating a complex, conditional statistical estimate into a deterministic narrative. Your skepticism is scientifically warranted.
