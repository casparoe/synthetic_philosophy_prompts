prompt: |-
  I've been reading a popular book about genes and behaviour — I won't name it, partly because I don't want you to go look it up and partly because who wrote it isn't the point; I want you to judge the reasoning on its merits. I'm also taking a psych course that touches on behavioural genetics, and I keep getting the feeling that the book is saying something alot smoother than what the lectures say, but every time I try to pin down whats wrong I end up deciding I've just misunderstood the statistic. So here's the key paragraph, near enough as I remember it:

  'Heritability is the proportion of a trait's variation in a population that's due to genes. It runs from 0 to 1, and when researchers say the heritability of adult height is about 0.8, they mean that roughly 80% of your height is genetic and the remaining 20% comes from the environment — food, disease, and so on. Twin studies produce these numbers by comparing identical and fraternal twins; the fact that identical twins are more alike even when they're raised in different homes shows the similarity is genetic rather than environmental. For traits like intelligence and personality, heritability actually increases with age and settles somewhere around 0.5 to 0.8 in adulthood, which means that by the time you're grown up how smart you are is mostly down to your DNA, and differences between schools, parents and neighbourhoods are doing comparatively little. It also tells us something about group differences: if a trait is highly heritable within each group, then an average difference between two groups is likely to have a genetic component as well. The whole topic is controversial mostly for political reasons, and critics who object that heritability depends on the environment are confusing a technical caveat with a substantive objection. None of this means a trait can't change — a highly heritable trait can still shift if you change the environment — but the heritability figure is still the best estimate we have of how much of a trait is inborn.'

  Could you go through that the way a careful behavioural geneticist would: sentence by sentence, tell me what's right, what's the kind of thing a textbook would say and then immediately qualify, and what's just wrong. I'm not asking for a bibliography or for you to tell me which study said what — I want the conceptual audit, because I can't tell from the inside whether I'm objecting to the claims or just to the tone. And I'd like a straight answer at the end to the thing I actually care about: is that last sentence, about heritability being our best estimate of how much of a trait is inborn, a fair way to put it, or does it smuggle in something the statistic doesn't say? My instinct is that the group-difference bit is the shakiest part, but I don't really trust my instinct here, so tell me if I'm right about that or if I've picked the wrong target.
