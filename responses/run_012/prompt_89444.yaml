prompt: |-
  Act as a philosopher who's spent an ungodly amount of time on the question of how to decide which problems are worth working on, and think carefully before you answer — actually start by brainstorming the candidate requirements, then write the list.

  So here's the thing. I've been triaging causes with the standard importance / tractability / neglectedness routine — score each of the three, multiply them or whatever, sort, done. It keeps giving me answers I dont trust, and I genuinely can't tell whether the problem is my inputs or the framework itself. Before I go read more about how other people handle this, I want the specification: what does a cause-prioritization framework actually have to deliver to be adequate? Not "here's the best framework" — I want the requirements list first. Assume the purpose is a real one: good enough to tell an actual person where to put their next five years and their donations, using only the information they can realistically get.

  Give me:

  - the cases it has to get right, each with the case and why a framework can't just fudge it;
  - the distinctions it must not collapse — for instance the importance of a problem vs. the importance of the best available intervention on that problem, neglectedness as evidence of high marginal value vs. neglectedness treated as if it were itself a good thing, and a cause being tractable vs. being tractable for me given what I'm comparatively good at;
  - the results it has to be consistent with, e.g. diminishing marginal returns as money floods into a cause, the fact that a cause can be neglected precisely because it's hopeless or because work on it tends to backfire, the fact that if I don't do it someone else might so what counts is the difference I make rather than the total good, the fact that the long-run ripple effects of almost anything are unbounded and basically unmeasurable, and the fact that I'm morally uncertain and don't want my ranking to just be whichever moral theory I quietly assumed;
  - and the part I care about most: flag any pair of requirements I probably can't have at the same time. I have a suspicion that "must be computable by a real person from information they can actually get" and "must not get hijacked by some cause with a microscopic probability of an astronomically large payoff" are in tension, but tell me if thats wrong and where the real clashes are.

  Then briefly: which single requirement does the most work — the one that, if I had to drop everything else, still rules out most of the naive frameworks people reach for?

  No reading lists or citations, I'm not gonna chase them down. Bullets, a table, prose, whatever — I don't care about the format.
