answer: |-
  ### The Specification for an Adequate Cause-Prioritization Framework

  You are right to distrust the mechanical application of Importance, Tractability, and Neglectedness (ITN). ITN is a heuristic for brainstorming, not a decision algorithm. When you treat it as a calculator, you invite garbage-in-garbage-out on a civilizational scale.

  A framework adequate for allocating five years of a human life must survive contact with reality. It must not be a map of the territory; it must be a compass for the traveler. Below are the requirements for such a compass.

  ### 1. The Cases It Must Get Right
  A framework that fails these cases is mathematically elegant but practically useless.

  *   **Pascal's Mugging (The Astronomical Waste Case)**
      *   *The Case:* A cause claims a 1 in $10^{20}$ chance of saving $10^{30}$ lives. The expected value is massive.
      *   *Why it can't fudge:* If the framework accepts this, it directs all resources to speculative, unproven, high-variance gambles (e.g., specific metaphysical interventions) and starves proven, near-term aid. It paralyzes the agent with infinite expectations. The framework must discount low-confidence, high-stakes claims without arbitrarily ignoring the long term.
  *   **The "Hopeless" Giant**
      *   *The Case:* A problem is massively important and neglected (e.g., stopping stellar entropy), but physically impossible to solve with current or foreseeable technology.
      *   *Why it can't fudge:* A framework that prioritizes based on *problem magnitude* alone will send you to die on a hill you cannot move. It must distinguish between "big problem" and "solvable problem."
  *   **The Replacement (Counterfactual) Case**
      *   *The Case:* You are considering a high-impact role, but if you don't take it, an equally qualified person immediately will.
      *   *Why it can't fudge:* If the framework counts the total good of the project rather than the *marginal* good of your contribution, it overvalues crowded fields. It must isolate the value *you* add, not the value the *project* generates.
  *   **The Personal Mismatch**
      *   *The Case:* Cause A is objectively more important than Cause B. But you have a 10x comparative advantage in B (skills, network, passion) compared to A.
      *   *Why it can't fudge:* A framework that ignores agent-specific traits will tell a brilliant fundraiser to become a mediocre researcher. It must optimize for *your* leverage, not abstract leverage.

  ### 2. The Distinctions It Must Not Collapse
  Naive frameworks treat these as synonyms. A robust framework treats them as orthogonal variables.

  | Distinction | The Trap (Collapsing them) | The Requirement (Keeping them separate) |
  | :--- | :--- | :--- |
  | **Problem Importance vs. Intervention Leverage** | Assuming a big problem implies a high-leverage way to fix it. | Must evaluate the *specific intervention's* elasticity, not just the problem's scale. |
  | **Neglectedness as Opportunity vs. Red Flag** | Treating "nobody is doing this" as automatic value. | Must distinguish between "market inefficiency" (opportunity) and "graveyard of past failures" (red flag). |
  | **General Tractability vs. Personal Tractability** | Assuming because a problem is solvable, *you* can solve it. | Must factor in the agent's specific skills, psychology, and network access. |
  | **Direct Impact vs. Option Value** | Valuing only immediate outputs (lives saved now). | Must account for learning, capital accumulation, and positioning for future, higher-leverage moves. |
  | **Moral Goodness vs. Personal Fit** | Assuming the "best" cause is the one with the highest abstract utility. | Must account for burnout risk, meaning-making, and sustainability of effort over 5+ years. |

  ### 3. The Results It Must Be Consistent With
  The framework cannot output conclusions that violate established empirical or philosophical constraints.

  *   **Diminishing Marginal Returns:** As money and talent flood a cause, the value of the next unit must drop. The framework cannot recommend pouring infinite resources into a fixed bottleneck.
  *   **Risk of Backfire:** It must acknowledge that some interventions have negative expected value (e.g., poorly designed aid destabilizing local economies). "Doing something" must not be assumed better than "doing nothing."
  *   **Moral Uncertainty:** It cannot assume a single moral theory (e.g., Utilitarianism) is true. It must weight decisions across a distribution of plausible moral views (e.g., rights-based, virtue ethics, person-affecting).
  *   **Epistemic Limits (The Long-Term Horizon):** It must acknowledge that ripple effects beyond a certain time horizon are effectively unmeasurable. It cannot claim precision on 100-year outcomes.
  *   **Substitutability:** It must account for the fact that resources are fungible. If you don't donate to X, you might donate to Y. The baseline is not "zero," it is "your next best option."

  ### 4. The Incompatible Requirements (The Trade-Offs)
  You suspected a tension between computability and Pascal's Mugging. You are correct, but the conflict is deeper. You cannot maximize all virtues simultaneously.

  *   **Precision vs. Robustness:**
      *   *The Clash:* To avoid Pascal's Mugging, you need heavy discounting of uncertain probabilities (Robustness). To differentiate between two good causes, you need fine-grained probability estimates (Precision).
      *   *The Cost:* A framework robust enough to ignore mugging will often be too blunt to distinguish between two legitimate long-termist causes. You must choose between safety from error and sensitivity to opportunity.
  *   **Objectivity vs. Agency:**
      *   *The Clash:* A truly objective framework should give the same answer for any agent (e.g., "AI Safety is #1"). A framework useful for *you* must incorporate your subjective talents and constraints.
      *   *The Cost:* The more you personalize the framework, the less it looks like a universal moral truth and the more it looks like career counseling. You lose the "view from nowhere."
  *   **Maximization vs. Satisficing:**
      *   *The Clash:* To get the *best* outcome, you must search exhaustively (Maximization). To actually *act* within a human lifespan, you must stop searching and pick "good enough" (Satisficing).
      *   *The Cost:* A framework that demands you find the global maximum will consume your life in analysis. A framework that allows satisficing risks leaving massive value on the table.
  *   **Scope vs. Tractability (The User's Suspicion):**
      *   *The Clash:* You identified "computable by a real person" vs. "not hijacked by microscopic probabilities." This is the **Epistemic Access Problem**.
      *   *The Reality:* To compute expected value on astronomical stakes, you need information you cannot get. If you restrict inputs to "information a real person can get," you necessarily blind the framework to the very long-term, high-stakes claims.
      *   *The Verdict:* You cannot have a framework that is both **highly sensitive to long-term astronomical value** AND **strictly bound by current human epistemic limits**. One must give. Either you accept speculative models (risking mugging) or you accept myopia (risking astronomical waste).

  ### 5. The Single Most Important Requirement
  If you must drop everything else, keep this one. It is the keystone that holds the arch up.

  **The Requirement of Robustness to Moral and Epistemic Uncertainty.**

  **Why this rules out naive frameworks:**
  Naive frameworks (like raw ITN or simple Expected Value maximization) assume that if you plug in the numbers, the answer comes out true. They assume you *know* the probability of AI causing extinction, or you *know* that maximizing welfare is the only moral good.

  A framework that demands **Robustness** forces you to ask: *"If my model is wrong, or my moral theory is wrong, is this still a good bet?"*

  *   It kills **Pascal's Mugging**: Because the epistemic uncertainty on the probability is so high, the robust value drops to near zero.
  *   It kills **Dogmatic Longtermism**: Because if you are wrong about the future, you might have neglected suffering people alive today.
  *   It kills **Naive ITN**: Because ITN treats inputs as static scores. Robustness treats them as distributions with wide error bars.
  *   It protects **Your Life**: It prevents you from betting your five years on a high-variance gamble that relies on a single fragile assumption.

  Most naive frameworks fail because they optimize for *clarity* rather than *survival*. They give you a precise answer to the wrong question. A robust framework admits when the question is unanswerable and directs you toward causes that are valuable across a wide range of possible worlds and moral theories. It prioritizes **no-regrets moves** over **optimal bets**.

  That is the specification. If your framework cannot handle uncertainty without breaking, it cannot handle the world.
