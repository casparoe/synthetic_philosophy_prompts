answer: |-
  This is a fantastic, high-leverage niche. Most philosophy of CS focuses on computation *simpliciter* (Turing machines, CT thesis, AI consciousness) or ethics (algorithmic bias). The *internal* conceptual structure of complexity theory is largely untouched by philosophers, despite being rich with modal, epistemic, and ontological implications.

  With a half-time postdoc and a workshop, you cannot fund technical breakthroughs. You must fund **conceptual translation**. The goal is to take technical distinctions that theorists use pragmatically and ask what they imply about the nature of mathematical truth, resource boundedness, and explanation.

  Here is the evaluation of your intuition, followed by the prioritized agenda.

  ### 1. Evaluating "Description-Opaque Hardness"

  **Verdict:** This is a real and useful distinction, but it is currently conflating two technical areas: **Descriptive Complexity** and **Proof Complexity**. You should keep the intuition but refine the terminology for the CfP to signal seriousness to theorists.

  *   **The Technical Map:**
      *   **"Hard to state"**: This maps to **Descriptive Complexity**. How complex must the logic be to define the set of instances? (e.g., Fagin's Theorem linking NP to Existential Second-Order Logic). If a problem requires high-order logic to define, it is "descriptionally hard" regardless of how long it takes to solve.
      *   **"Hard to find"**: This is standard **Computational Complexity** (Time/Space).
      *   **The Nuance:** Your intuition about "presupposing the solution" sounds like **Impredicativity** or **Total Search Problems (TFNP)**. In TFNP (e.g., finding a Nash Equilibrium), a solution is guaranteed to exist by a non-constructive topological argument. The hardness isn't "does a solution exist?" (it does), but "locate it." The definition of the problem *implicitly* contains the solution via an existence proof, making the "statement" of the problem rely on axioms that guarantee the solution without showing it.

  *   **Ranking:** **High.** This is perfectly upstream. It concerns how we individuate problems before we even attempt to solve them.
  *   **Refinement for CfP:** Frame this as **"The Ontology of Problem Definitions: Descriptive vs. Computational Hardness."** Ask: *When does the logical depth of a problem definition constrain its computational tractability?*

  ---

  ### 2. The Prioritized Agenda

  Here are the three lines of work I recommend, ranked by upstream leverage and tractability for a philosopher.

  #### Priority 1: The Normative Status of "Efficiency" (Cobham's Thesis)
  **The Question:** Why is polynomial time ($P$) the threshold for "efficient"? This is Cobham's Thesis. It is not a theorem; it is a methodological norm.
  **Why Upstream:** Every result in complexity theory presupposes this distinction. If $P$ is not the correct boundary for "feasible," the entire hierarchy (NP, PSPACE, etc.) loses its practical philosophical weight.
  **Downstream Dependencies:**
  *   **AI Safety:** If we assume AI alignment must be "efficiently computable," we are making a Cobham-style assumption.
  *   **Cognitive Science:** Is human rationality bounded by $P$?
  *   **Physics:** Does the universe only allow polynomial computations?
  **Tractability:** High. Requires no new math. Requires history of science (why did Cobham/Edmonds propose this?), conceptual analysis of "feasibility," and engagement with fixed-parameter tractability (FPT).
  **What Moves It Up/Down:**
  *   **Up:** If quantum computing or biological computing demonstrates stable super-polynomial advantages for practical tasks, the normative status of $P$ crumbles.
  *   **Down:** If the field shifts entirely to fine-grained complexity (where $P$ is too coarse), this becomes less central.
  **Deprioritize:** Do not fund work that simply argues "P is physical." That's been done. Fund work that asks, *"Is 'efficiency' a natural kind or a pragmatic convenience?"*

  #### Priority 2: The Epistemology of Interactive Proofs and Zero-Knowledge
  **The Question:** Interactive Proofs (IP) and Zero-Knowledge Proofs (ZK) decouple *truth* from *verification* and *knowledge* from *information transfer*.
  **Why Upstream:** This redefines the concept of a "mathematical proof." Traditionally, a proof is a static object that conveys understanding. In IP (and especially MIP*=RE), a proof is a dynamic protocol that conveys *certainty* without *understanding*.
  **Downstream Dependencies:**
  *   **Verification of AI:** How do we verify a neural net's output if the "proof" is an interactive protocol we can't inspect?
  *   **Scientific Reproducibility:** Does a probabilistic check count as scientific verification?
  *   **Cryptographic Epistemology:** What does it mean to "know" a fact if you cannot re-derive it?
  **Tractability:** High. The theorems (IP=PSPACE, MIP*=RE) are established. The philosopher's job is to interpret the *concept of knowledge* ($K$) in these contexts.
  **What Moves It Up/Down:**
  *   **Up:** The MIP*=RE result (2020) is a massive shocker implying entangled provers can verify undecidable languages. This needs philosophical digestion immediately.
  *   **Down:** If interactive proofs remain confined to cryptography without impacting math or science verification practices.
  **Deprioritize:** Do not fund technical surveys of ZK protocols. Fund work on **"Verification without Understanding."**

  #### Priority 3: Average-Case Complexity and the "Typical" Instance
  **The Question:** Complexity theory focuses on *worst-case* hardness. But the world (and cryptography) relies on *average-case* hardness. Why do we assume hard instances are "typical"?
  **Why Upstream:** This addresses the gap between theory and practice. P vs NP is a worst-case question. If NP problems are hard only on measure-zero instances, P vs NP matters less for practice.
  **Downstream Dependencies:**
  *   **Cryptography:** Security relies on the existence of one-way functions (hard on average).
  *   **Machine Learning:** Generalization relies on the assumption that training data is representative of the "average" case.
  *   **Heuristics:** Why do SAT solvers work so well on industrial instances if SAT is NP-complete?
  **Tractability:** Medium. Requires understanding distributional complexity (DistNP) and Smoothed Analysis.
  **What Moves It Up/Down:**
  *   **Up:** If AI models continue to fail on "out of distribution" data, the philosophical link between average-case hardness and robustness becomes critical.
  *   **Down:** If fine-grained complexity (worst-case exponents) continues to dominate theory.
  **Deprioritize:** Do not fund work on specific cryptographic primitives. Focus on the **metaphysics of "Typicality."**

  ---

  ### 3. What to Deprioritize (The "Trap" Topics)

  Even though these sound important, they are bad fits for this specific budget and goal.

  1.  **The P vs NP Resolution Itself:**
      *   *Why:* Philosophers cannot solve this. Speculating on "P = NP vs P != NP" outcomes is parlor gossip unless tied to the *implications* of the proof method (e.g., if P=NP is independent of ZFC).
      *   *Rank:* Low.
  2.  **The Physical Church-Turing Thesis:**
      *   *Why:* This is the most overworked topic in philosophy of CS. Unless you have a new angle on hypercomputation in general relativity, it's saturated.
      *   *Rank:* Low.
  3.  **Fine-Grained Complexity (Technical):**
      *   *Why:* This area (SETH, 3SUM, etc.) is incredibly technical. A philosopher cannot contribute to the bounds. They can only contribute to the *interpretation* of why exponents matter.
      *   *Rank:* Medium (only as a sub-point of "Efficiency").

  ---

  ### 4. Structuring the Call for Proposals

  To attract the right people, your CfP needs to signal that you know the technical landscape but want conceptual work.

  **Suggested Title:** *Conceptual Foundations of Computational Hardness*

  **Key Phrases to Include:**
  *   "Normative foundations of Cobham's Thesis."
  *   "Epistemic implications of Interactive Proofs and MIP*=RE."
  *   "Descriptive vs. Computational complexity: The ontology of problem definitions."
  *   "Average-case hardness and the metaphysics of typicality."

  **The "Description-Opaque" Hook:**
  Include this in the CfP as: *"We invite contributions examining the relationship between the logical expressibility of a problem (Descriptive Complexity) and its computational tractability. When does the definition of a problem conceal its solution?"*

  ### 5. Strategy for the Postdoc & Workshop

  *   **The Postdoc (0.5 FTE):** Their job is not to publish in *Journal of Symbolic Logic*. Their job is to produce a **"Conceptual Map."** They should interview 5-10 complexity theorists, record the conceptual distinctions they use implicitly (e.g., "natural proofs," "oracle separation"), and write a whitepaper translating these into philosophical categories. This creates the "upstream" resource you want.
  *   **The Workshop:** Do not make it a paper conference. Make it a **working group**.
      *   *Day 1:* Technical tutorials. Have a complexity theorist teach the philosophers Descriptive Complexity and Interactive Proofs from scratch.
      *   *Day 2:* Breakout sessions on the three agenda items above.
      *   *Output:* A jointly authored "Manifesto" or "Research Agenda" paper, rather than 10 disjointed proceedings.

  ### Summary of Reasoning

  I have prioritized **Efficiency**, **Interaction**, and **Typicality** because they are the three pillars supporting the *application* of complexity theory to the real world.
  1.  **Efficiency** defines the goal.
  2.  **Interaction** defines the verification method.
  3.  **Typicality** defines the domain of applicability.

  Your "Description-Opaque" intuition fits best under **Efficiency/Definition**. It is a strong hook because it addresses the *pre-computational* phase: how we carve nature at its joints before we try to compute them. By framing it through Descriptive Complexity, you give the philosophers a rigorous hook (logic expressibility) and the theorists a reason to respect the inquiry (it relates to circuit lower bounds and definability).

  This agenda avoids the "P vs NP metaphysics" trap and focuses on the conceptual machinery that is actually being used *now* in cryptography, verification, and AI.
