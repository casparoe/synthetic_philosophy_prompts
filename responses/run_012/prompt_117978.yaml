answer: |-
  You have found the joint. It is a very sharp knife, and you are right to worry that it cuts the hand holding it.

  This argument is a version of what philosophers call the "Basic Argument" (most famously articulated by Galen Strawson) or the Rawlsian critique of moral desert. It is logically valid. If you accept premises (1) through (4), conclusion (5) follows inescapably.

  Since you are looking for the cost of doing business, I will not try to talk you out of the logic. Instead, I will lay out the price of the three available exits, address the self-eating nature of the claim, and speak to your biochemistry instincts.

  ### 1. Where is the Joint? (Which step to give up)

  You asked which step you should give up. There are two main candidates, and each comes with a bill.

  **Option A: Reject Premise (1). (The Compatibilist Route)**
  Premise (1) states: *To deserve X, you must deserve the causes of X.*
  This is the "Regress Condition." It demands that for you to be responsible for an action, you must be responsible for the person who performed the action.

  *   **The Move:** You deny this. You argue that desert does not require *ultimate* responsibility (being the uncaused cause of yourself); it only requires *proximate* responsibility. You deserve the salary because *you* did the work, and "you" refers to the current configuration of talents, character, and effort that constitutes your agency. It doesn't matter if that configuration was gifted to you; it matters that it is *yours* now and was exercised without coercion.
  *   **The Cost:** You must give up the idea of "Ultimate Responsibility." You have to accept that, in a deep metaphysical sense, you are lucky to be you. You cannot claim that you are the *absolute origin* of your goodness. You lose the ability to say, "I fundamentally, cosmically earned this." You keep the social practice of reward and blame, but you acknowledge it is a useful human construct, not a feature of the universe's bedrock.
  *   **Why a scientist might like this:** It preserves causality. It admits the genes and environment determined the outcome, but it insists that "desert" is a label we apply to specific nodes in that causal chain (the human agent) because doing so regulates future behavior.

  **Option B: Reject Premises (2) & (3). (The Libertarian Route)**
  *   **The Move:** You argue that there is a part of you—will, soul, agent-causation—that *did* choose your character and effort, independent of genes and environment.
  *   **The Cost:** The metaphysical bill is enormous. You have to posit a mechanism that interrupts the causal chain of the physical world. Given your background in biochemistry, this is likely a bridge too far. It requires believing that at some point, neurons fire not because of prior physical states, but because of a non-physical "say-so."
  *   **Why a scientist might hate this:** It smells like vitalism. It inserts a magic ghost into the machine.

  **Recommendation:** Most philosophers with a scientific bent take **Option A**. They reject the Regress Condition. They argue that Premise (1) sets a bar for desert that is impossible for any finite being to clear, and therefore it is the wrong standard for desert.

  ### 2. Does the argument eat itself?

  You asked if the self-referential problem ("nobody deserves to be believed") is a parlor trick. It is not a trick, but it is a **category error**.

  The argument conflates *causes* with *reasons*.
  *   **Causal claim:** "My belief in this argument is caused by my genes and schooling." (True, likely.)
  *   **Normative claim:** "I *deserve* to hold this belief." (Nonsense.)

  We do not usually talk about *believing* things as a matter of desert. We talk about believing things as a matter of **justification**. You should believe the argument if it is *true*, not if you *deserve* to believe it.

  However, your intuition is correct that something goes wrong. If the argument is true, then *rational persuasion* is an illusion. I am not convincing you with reasons; I am merely causing a state change in your brain via sound waves. If that is the case, the argument loses its **normative force**. It might be true, but it gives you no *reason* to accept it, because "reasons" presuppose a capacity for rational agency that the argument denies.

  So, it matters. If you accept (5), you must accept that you are not being *persuaded* by this text; you are being *caused* to react to it. This makes the act of philosophical debate incoherent. This is often taken as a *reductio ad absurdum* of the hard determinist position: a theory that makes the very act of theorizing meaningless is pragmatically self-defeating.

  ### 3. The Biochemistry Instinct

  You wrote: *"In my old line of work nothing ever deserved anything — a protein folded because of its sequence — so I keep wondering whether that's relevant or just a habit of mind I should drop."*

  This is the most important part of your query. It is not a habit to drop; it is the key to the lock. But you must apply it carefully.

  In biochemistry, you deal with the **Descriptive** (what *is*).
  In morality and politics, we deal with the **Normative** (what *ought* to be).

  A protein does not deserve to fold; it just folds. A human does not *just* act; we participate in a system of rules, expectations, and consequences. "Desert" is not a physical force like gravity. It is a social technology.

  *   **Relevance:** Your scientific instinct correctly identifies that there is no "desert particle" in the brain. There is no metaphysical magic that makes you the uncaused cause. Science is right about the *mechanism*.
  *   **Habit to Drop:** The habit of thinking that because something isn't in the physics, it isn't real. "Checkmate" is not in the physics of the wood pieces, but it is real within the game of chess. "Desert" is not in the physics of the neurons, but it is real within the game of society.

  If you treat human interaction like protein folding, you get a perfect description of causality and a total inability to navigate social life. If you treat protein folding like human interaction, you get animism.

  ### The Bill

  So, here is what you are paying for, depending on which path you choose.

  **If you keep (5) (Nobody deserves anything):**
  *   **You gain:** Intellectual consistency with a deterministic universe.
  *   **You pay:** The coherence of your social practices. You cannot consistently resent a cheater or praise a hero. You must view punishment as quarantine (consequentialist) rather than justice (retributive). You must view your own reasoning as a causal itch, not a rational pursuit. It is a lonely, cold view, often called the "view from nowhere."

  **If you reject (1) (Desert doesn't require deserving the causes):**
  *   **You gain:** A livable moral framework. You can hold people accountable without needing to be the god of your own soul.
  *   **You pay:** The comfort of "Ultimate Responsibility." You must admit that your virtues are, at root, lucky gifts. You cannot look down on those who failed as being *metaphysically* inferior, only functionally different. You have to accept that "justice" is a human construction, not a cosmic law.

  ### Summary

  The joint is in Premise (1). It demands a kind of self-creation that is impossible.

  Your friend's argument proves too much because it applies a **causal standard** to a **normative concept**. It asks morality to do physics.

  If I were in your reading group, I would say: Keep the biochemistry. It tells you why we *can't* be ultimate causes. But drop the idea that "desert" requires being an ultimate cause. Desert is not about where you came from; it is about how we treat each other here, now, in the middle of the chain.

  The argument eats itself because it tries to use reason to prove that reason is just causation. Don't swallow that. It's not a trick, but it is a mistake in levels of analysis. You are a biochemist; you know that you cannot explain the behavior of a cell solely by listing the atoms, nor can you explain the behavior of a society solely by listing the neurons. Desert lives at the level of society, not the level of the synapse.
