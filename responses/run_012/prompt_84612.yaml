answer: |-
  **Examination Question: Probability and Philosophy (Decision Theory Section)**

  **Time Allowed:** 45 Minutes
  **Marks:** 20

  **Question 1**
  Consider a unit circle in the plane. Let $L$ be the length of a random chord.
  (a) Calculate the expected length $E[L]$ under each of the following three randomisation schemes:
     (i) The chord's endpoints are chosen independently and uniformly on the circumference.
     (ii) A radius is chosen uniformly by angle, and the chord is drawn perpendicular to it at a point chosen uniformly along that radius.
     (iii) The chord's midpoint is chosen uniformly from the interior of the disk.
     *(6 marks)*

  (b) Now consider a unit ball in $\mathbb{R}^3$. A random plane intersects the ball, forming a circle of radius $R$. Construct two distinct, prima facie legitimate methods for choosing the random plane. For each method, compute the probability that $R > 1/2$. Explain why the rotational symmetry of the ball fails to uniquely determine the distribution of the plane's distance from the centre.
  *(6 marks)*

  (c) State what the Principle of Indifference demands regarding measures and parameterisations. Distinguish between indifference among outcomes and indifference among parameterisations. Conclude whether invariance principles alone resolve the paradox, or if a physical chance mechanism is required to make the phrase 'uniformly at random' complete.
  *(8 marks)*

  ***

  **Model Answer**

  **(a)** Let the circle have radius 1.
  (i) **Endpoints:** Let the relative angle $\theta \sim U[0, \pi]$. Chord length $L = 2\sin(\theta/2)$.
  $$E[L] = \frac{1}{\pi}\int_0^\pi 2\sin(\theta/2)\,d\theta = \frac{4}{\pi} \approx 1.27.$$
  (ii) **Radius Point:** Let distance from centre $x \sim U[0, 1]$. $L = 2\sqrt{1-x^2}$.
  $$E[L] = \int_0^1 2\sqrt{1-x^2}\,dx = \frac{\pi}{2} \approx 1.57.$$
  (iii) **Midpoint:** Let midpoint radius $r$. Uniform area implies density $f(r)=2r$. $L = 2\sqrt{1-r^2}$.
  $$E[L] = \int_0^1 2\sqrt{1-r^2}(2r)\,dr = \frac{4}{3} \approx 1.33.$$
  The expectations visibly disagree ($4/\pi \neq \pi/2 \neq 4/3$).

  **(b)** Let $d$ be the perpendicular distance from the ball's centre to the plane. The intersection radius is $R = \sqrt{1-d^2}$. The condition $R > 1/2$ implies $d < \sqrt{3}/2$.
  *Method 1:* Assume $d \sim U[0, 1]$. $P(d < \sqrt{3}/2) = \sqrt{3}/2 \approx 0.866$.
  *Method 2:* Assume the centre of the intersection circle is uniform in the ball's volume. The density of $d$ is proportional to surface area, $f(d) = 3d^2$. $P(d < \sqrt{3}/2) = (\sqrt{3}/2)^3 = 3\sqrt{3}/8 \approx 0.650$.
  *Symmetry:* Rotational symmetry fixes the plane's orientation distribution but is invariant under any radial distribution $f(d)$. It constrains the angular measure, not the measure on the distance from the origin. Thus, symmetry alone cannot select between Method 1 and Method 2.

  **(c)** The Principle of Indifference demands a measure on the space of possibilities plus a principled reason to prefer one parameterisation over another. It is not sufficient to assign equal probabilities to outcomes; one must justify equal probability densities over specific parameters (e.g., length vs. area). Indifference among outcomes (events) differs from indifference among parameterisations (coordinates); the latter induces a specific measure on the former via the Jacobian. Invariance principles (like rotation) constrain the measure but do not uniquely specify it without boundary conditions or scaling arguments. Consequently, 'uniformly at random' is incomplete. The paradox is resolved only by specifying a physical chance mechanism (e.g., a specific throwing procedure) that dictates the unique measure.

  *Confidence Statement:* I am highly confident ($>95\%$) in the integration results and the demonstration that rotational symmetry underdetermines the radial measure. I am moderately confident ($\sim 80\%$) in the philosophical conclusion that a physical mechanism is strictly *required*, as some argue maximum entropy principles could resolve the measure without explicit physicalisation, though this remains debated.

  ***

  **Marking Scheme (20 Marks)**

  **Part (a): Expected Lengths (6 Marks)**
  *   **2 Marks per method:** 1 mark for correct integral setup (identifying the correct density/variable), 1 mark for the correct final value.
  *   **A Grade:** Recognises these are three distinct expectations derived from three distinct measures.
  *   **B Grade:** Computes correctly but implies one result is the 'true' expectation or expresses confusion at the disagreement.
  *   **Error:** Using probability densities $f(r)=1$ for the midpoint method (ignores area element) costs 1 mark.

  **Part (b): The Ball and Symmetry (6 Marks)**
  *   **Methods (4 Marks):** 2 marks per valid method. Method 1 ($d \sim U$) and Method 2 (Volume uniform/$d^2$ density) are standard. Other invariant measures accepted if justified.
  *   **Symmetry Argument (2 Marks):** Must explicitly state that rotation fixes orientation but not the radial distribution.
  *   **A Grade:** Clearly articulates that symmetry allows *any* radial density $f(d)$, hence no unique solution.
  *   **B Grade:** Claims symmetry implies uniform distance, or fails to explain *why* symmetry fails to resolve the conflict.

  **Part (c): Conceptual Analysis (8 Marks)**
  *   **PoI Definition (3 Marks):** Must mention measure on space + justification for parameterisation.
  *   **Distinction (3 Marks):** Must distinguish outcome indifference from parameter indifference (Jacobian transformation).
  *   **Resolution (2 Marks):** Must conclude 'uniformly at random' is incomplete without physical mechanism or further constraints.
  *   **A Grade:** Identifies that treating the schemes as rival answers to *one* question is the category error; the question is ill-posed without a mechanism.
  *   **B Grade:** Suggests symmetry alone *should* resolve it, or treats PoI as a rule about outcomes rather than parameters.
  *   **Error:** Claiming the paradox proves probability theory is inconsistent costs all 8 marks in this section.

  **Confidence Statement:** Included as required (not marked, but omission suggests lack of reflection).
