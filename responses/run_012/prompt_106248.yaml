      *Wait, I need to check if (a) is more important than (b).* Non-commutativity is a fatal flaw for a *dynamic* theory if not handled. But it stems from the input specification (f). So (f) is still upstream. (b) is the specific mechanism flaw. (a) is the systemic consequence. I'll keep (b) above (a) because understanding *why* rigidity fails explains *why* commutativity fails.

