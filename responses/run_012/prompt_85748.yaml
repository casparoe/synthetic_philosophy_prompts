prompt: |-
  I am the head of analysis at a small risk-advisory firm. We publish short written assessments — three hundred words, roughly five a week, on a two-day clock — that clients act on directly; junior analysts with no philosophical training draft them, and I sign off, usually in ten minutes. Some years ago I put Nozick's tracking theory into our style guide as the house standard for assertion: we may state that P only if P is true, we believe P, we would not have believed P had P been false, and we would have believed P had P been true. It has never been operationalized. In practice the analysts read it as a licence to write whatever their sources suggest, and the real decision gets made by feel at sign-off. Nozick also denied that knowledge is closed under known entailment, which matters to us, because most of our assessments are chains of inference ending in a conclusion no source ever states.

  Please turn the standard into a procedure the desk can actually run: the questions in order, what counts as a sufficient answer to each, the point at which the procedure returns "no basis to assess," and the points where it hands the decision to me because the question is about our risk appetite rather than about the evidence. Three difficulties should be handled rather than waved away. (i) The last two conditions are counterfactuals about our own process, and they are vacuous or unsatisfiable depending on how the process is described — "this analyst with this source this week" makes everything sensitive, "our desk's usual method" makes almost nothing sensitive. The procedure needs a default rule for fixing the reference class, a way to record a contested reference class, and a statement of what turns on the choice. (ii) Closure fails, so we cannot assert the conjunction of two claims we can each assert, and a derived conclusion does not inherit the status of its premises; a procedure that takes this seriously will forbid some assessments I would very much like to publish. (iii) Claims about concealed conduct and claims of absence behave oppositely under the two counterfactual tests, and I want to know which test bites in each case, and which error each test is protecting us against.

  Run the procedure on three cases: (a) a source plus a documentary trail indicating that a named shipping firm moves sanctioned cargo through a third-country port, where the firm would conceal the practice whether or not it were engaged in it, and the client is paying for the sentence "we assess that the firm is doing this"; (b) the client's question whether a named port is used for transshipment, where we have looked and found nothing, and the analysts want to publish "there is no evidence that the port is used for transshipment" — I want the procedure to distinguish not having heard from having looked and failed to find; (c) twelve separately documented procurement irregularities, each solid on its own, from which a colleague wants to conclude that a ministry is systematically corrupt.

  Deliver a numbered procedure, a short ladder of verdict labels that every stopping point maps onto, a one-paragraph version an analyst can hold in their head, and a sign-off checklist for me. Mark plainly which steps are judgment calls wearing a lab coat, and tell me what the procedure cannot do — I would rather have one with a known failure mode than one that appears to settle everything.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Head of Analysis at a small risk-advisory firm.
      *   **Context:** Short written assessments (300 words, 5/week, 2-day clock). Junior analysts draft, Head signs off (10 mins).
      *   **Current Standard:** Nozick's Tracking Theory of Knowledge (Truth, Belief, Sensitivity, Adherence).
      *   **Problem:** It's never been operationalized. Analysts ignore it; Head decides by feel. Nozick's denial of closure under known entailment creates issues for inferential chains.
      *   **Task:** Turn the standard into a workable procedure.
      *   **Specific Difficulties to Address:**
          1.  *Reference Class Problem:* Counterfactuals (Sensitivity/Adherence) depend on how the process is described (specific analyst vs. general method). Need a default rule, a way to record contestation, and stakes.
          2.  *Closure Failure:* Can't just assert conjunctions or derived conclusions even if premises are tracked. Need to handle inferential chains where the conclusion isn't stated by sources.
          3.  *Concealment & Absence:* Different behaviors under Sensitivity/Adherence. Need to specify which test bites for which claim type and what error is avoided.
      *   **Test Cases:**
          (a) Sanctioned cargo (concealment likely either way).
          (b) Empty port (absence of evidence vs. evidence of absence).
          (c) Systemic corruption (12 irregularities $\to$ system).
      *   **Deliverables:**
          1.  Numbered Procedure.
          2.  Ladder of Verdict Labels.
          3.  One-Paragraph "Head Version" for analysts.
          4.  Sign-off Checklist for the Head.
          5.  Explicit marking of "Judgment Calls" and "Known Failure Modes."

  2.  **Deconstruct Nozick's Tracking Theory for this Context:**
      *   Condition 1: $P$ is true. (We can't know this for sure, we assess probability/truth-tracking).
      *   Condition 2: $S$ believes $P$. (Analyst believes it).
      *   Condition 3 (Sensitivity): If $P$ were false, $S$ would not believe $P$. (Crucial for avoiding False Positives).
      *   Condition 4 (Adherence): If $P$ were true, $S$ would believe $P$. (Crucial for avoiding False Negatives/Missed detections).
      *   *Constraint:* No Closure. If $A \to B$, tracking $A$ doesn't mean tracking $B$.

  3.  **Address the Three Difficulties:**

      *   *(i) Reference Class:*
          *   *Problem:* "This analyst" makes sensitivity easy (they wouldn't believe it if they didn't see the source). "Our desk" makes it hard (would the desk *always* find this?).
          *   *Solution:* Default to "The Desk's Standard Method" (not the specific individual). If the method is new/ad-hoc, flag it.
          *   *Stakes:* Sensitivity protects against liability (suing for false claims). Adherence protects against reputation (missing a risk clients pay to see).

      *   *(ii) Closure Failure:*
          *   *Problem:* $A$ tracked, $B$ tracked, $C$ derived from $A+B$. Nozick says $C$ might not be tracked.
          *   *Solution:* The procedure must treat the *Conclusion* as the proposition $P$ to be tracked, not just the premises. We need a specific step for "Inferential Leaps." If the inference relies on a general principle (e.g., "irregularities imply corruption"), that principle must also be tested for sensitivity/adherence.

      *   *(iii) Concealment & Absence:*
          *   *Concealment (Case A):* If they are doing it, they hide it. If they aren't, they hide that too (or look normal).
              *   *Sensitivity:* If False (not doing it), would we believe True? If they look normal either way, we might believe True based on normal looks. Sensitivity fails.
              *   *Adherence:* If True (doing it), would we believe True? If they hide it well, we might not find it. Adherence fails.
              *   *Result:* High risk of both errors. Need to downgrade confidence.
          *   *Absence (Case B):* "No evidence."
              *   *Sensitivity:* If there *was* transshipment (P is True), would we find evidence? If we looked and didn't find, but they are good at hiding, Sensitivity (regarding the claim "No evidence") is tricky. Actually, the claim is "No evidence exists."
              *   *Refinement:* Distinguish "We found no evidence" (Process claim) vs "It is not happening" (Ontological claim). Nozick applies to the Ontological claim.
              *   *Test:* If it *were* happening (P False), would we believe it *isn't* (Belief P)? If yes, Sensitivity fails. This is the "False Negative" risk.

  4.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Define P.* Must be precise.
      *   *Step 2: Truth & Belief.* (Easy).
      *   *Step 3: Reference Class.* Fix the "Who/How." Default: "Competent analyst using standard tools."
      *   *Step 4: Sensitivity Check.* (If ~P, would we believe P?). Focus on False Positives.
      *   *Step 5: Adherence Check.* (If P, would we believe P?). Focus on False Negatives.
      *   *Step 6: Closure/Inference.* If P is derived, test the inference rule, not just premises.
      *   *Step 7: Risk Appetite.* Where do we hand off to the Head? When Sensitivity or Adherence is weak but client value is high.

  5.  **Refining the Test Cases:**

      *   *(a) Sanctioned Cargo:* Concealment makes Sensitivity hard. If they aren't smuggling, they look the same as if they are. We might believe they are smuggling based on ambiguous data. *Verdict:* Sensitivity Fail. Handoff to Head.
      *   *(b) Empty Port:* Claim: "Port is not used." If it *were* used (False), would we know? We looked and saw nothing. If they are good at hiding, we still see nothing. Sensitivity fails. Claim should be "We found no evidence," not "It is not used."
      *   *(c) Corruption:* 12 irregularities $\to$ Systemic. Premises tracked. Inference rule: "12 irregularities = Systemic." Is *that* sensitive? If it were *not* systemic (just bad luck), would we still see 12 irregularities? Maybe. Sensitivity of the *conclusion* is weak.

  6.  **Developing the Deliverables:**

      *   *Procedure:* Needs to be rigid but acknowledge the fuzzy bits.
      *   *Verdict Ladder:* Green (Track), Yellow (Track w/ Caveat), Red (No Basis), Blue (Risk Call).
      *   *One-Pager:* Simple heuristics.
      *   *Checklist:* For the 10-minute sign-off.
      *   *Failure Modes:* Be honest about where Nozick breaks in business intelligence.

  7.  **Addressing Specific Constraints:**
      *   *Reference Class:* I need to specify "The Standard Method" as the default.
      *   *Closure:* I need to explicitly forbid asserting the conclusion just because premises are tracked. The *inference* must track.
      *   *Concealment/Absence:* I need to map Sensitivity to False Positive risk and Adherence to False Negative risk.

  8.  **Final Polish:**
      *   Tone: Professional, operational, slightly cynical about the theory's limits (matching the user's persona).
      *   Formatting: Clear headings, numbered lists.
      *   Check against word count/complexity: Keep it actionable for a 2-day clock.

  *(Self-Correction during drafting)*: I initially thought about making the analysts run the counterfactuals mentally. That's too vague. I need to force them to write down the "Nearest Possible World" scenario.
  *Correction:* Step 4 and 5 must require a one-sentence description of the "Near World."
  *Correction on Closure:* Nozick's point is that knowledge isn't closed. So, if $A$ and $B$ are tracked, $A \land B$ might not be. In a business context, this means we can't aggregate risk easily. I need to make sure the procedure tests the *final assertion*, not the components.

  *Refining the Reference Class:* The prompt asks for a default rule. Let's set it as "A competent analyst using the firm's standard toolset within the allotted time." This avoids the "super-analyst" trap and the "this specific junior on a bad day" trap.

  *Refining the Sign-off:* The Head needs to know where the theory failed so they can apply "feel." The checklist must highlight the "Risk Appetite" handoffs.

  9.  **Final Review against Prompt:**
      *   Numbered procedure? Yes.
      *   Verdict labels? Yes.
      *   One-paragraph version? Yes.
      *   Sign-off checklist? Yes.
      *   Mark judgment calls? Yes.
      *   State failure modes? Yes.
      *   Handle (i) Reference Class? Yes (Step 2).
      *   Handle (ii) Closure? Yes (Step 6).
      *   Handle (iii) Concealment/Absence? Yes (Step 4 & 5 notes).
      *   Run 3 cases? Yes.

  Let's write it.cw
answer: |-
  ### I. The Tracking Procedure (Operational Standard v1.0)

  **Purpose:** To determine if a proposition $P$ is assertible under Nozickian tracking.
  **Default Reference Class:** "A competent analyst using the Firm's standard toolset within the allotted time." (Do not use "This specific analyst" or "An ideal investigator.")

  1.  **Define $P$.** Write the exact sentence to be published. If $P$ is a conjunction ($A$ and $B$) or an inference ($A \to C$), $P$ is the *conclusion*, not the premises.
  2.  **Fix the Method.** Record the specific sources and methods used to form belief in $P$. If the method deviates from the Default Reference Class (e.g., a unique human source, a new tool), flag as **Contested Reference**.
      *   *Judgment Call:* If contested, note whether expanding the class makes tracking harder (usually yes).
  3.  **Truth & Belief.** Is there positive evidence for $P$? Does the analyst believe $P$? If No, stop. **Verdict: NO BASIS.**
  4.  **Sensitivity Test (False Positive Check).** Assume $P$ is *False*. In the nearest possible world where $P$ is False, using the **Default Method**, would we still believe $P$?
      *   *Concealment Note:* If the subject conceals conduct whether $P$ is True or False (e.g., sanctions evasion), Sensitivity often fails. We see the same "clean" data in both worlds.
      *   *If Yes (We would still believe):* **Verdict: SENSITIVITY FAIL.** Hand to Head.
      *   *If No (We would not believe):* Pass.
  5.  **Adherence Test (False Negative Check).** Assume $P$ is *True*. In the nearest possible world where $P$ is True, using the **Default Method**, would we believe $P$?
      *   *Absence Note:* For claims of absence ("No evidence of X"), if $X$ were present but hidden, would we find it? If no, Adherence fails.
      *   *If No (We would miss it):* **Verdict: ADHERENCE FAIL.** Hand to Head.
      *   *If Yes (We would find it):* Pass.
  6.  **Closure Check.** If $P$ is derived from premises $A$ and $B$, do not assume $P$ tracks because $A$ and $B$ track. Apply Steps 4–5 to the *inference rule* itself. (e.g., "Do 12 irregularities *necessarily* signal systemic corruption, or could they be noise?")
      *   *Judgment Call:* If the inference relies on a heuristic rather than logic, flag as **Inferential Risk**.
  7.  **Risk Appetite Handoff.** If Sensitivity or Adherence fails, but the client requires an assessment, escalate to Head.
      *   *Sensitivity Fail:* Risk of liability/reputation damage (asserting falsehood).
      *   *Adherence Fail:* Risk of missed opportunity (failing to warn).

  ---

  ### II. Verdict Ladder

  *   **TRACKED (Green):** Sensitivity Pass, Adherence Pass, Reference Standard. *Assert directly.*
  *   **QUALIFIED (Yellow):** Sensitivity Pass, Adherence Fail (or vice versa). *Assert with explicit modal hedging ("likely," "indicates").*
  *   **PROCESS ONLY (Grey):** Sensitivity/Adherence Fail due to Concealment/Absence. *Assert only about the evidence ("We found no records"), not the reality ("There are no records").*
  *   **RISK CALL (Blue):** Inference or Reference Class contested. *Head must sign off.*
  *   **NO BASIS (Red):** Truth/Belief fail, or both counterfactuals fail. *Do not publish.*

  ---

  ### III. The One-Paragraph "Head Version" (For Analysts)

  > "Don't tell me what you found; tell me if you'd find it if it weren't there, and if you'd miss it if it were. We assert $P$ only if our method would change its mind when reality changes. If the target is hiding something, assume our method is blind (Adherence Fail). If the target looks clean whether guilty or innocent, assume our method is hallucinating guilt (Sensitivity Fail). Do not add up tracked premises to make a tracked conclusion; test the leap itself. If the counterfactual breaks, label it 'Process Only' or send it to the Head for a risk call. We prefer 'We saw nothing' over 'Nothing happened.'"

  ---

  ### IV. Sign-Off Checklist (For Head of Analysis)

  *Time budget: 10 minutes.*

  1.  [ ] **Proposition Check:** Is $P$ the conclusion or a premise? (If conclusion, did they test the inference?)
  2.  [ ] **Reference Class:** Is the method standard? If unique, is the **Contested Reference** flag raised?
  3.  [ ] **The Concealment Trap:** For positive claims of illicit activity, did Sensitivity fail because the target looks normal either way?
      *   *If Yes:* Am I willing to accept liability risk? (Risk Call)
  4.  [ ] **The Absence Trap:** For negative claims, did Adherence fail because the target could hide the evidence?
      *   *If Yes:* Downgrade to **PROCESS ONLY** ("We found no evidence").
  5.  [ ] **The Closure Trap:** Did they aggregate multiple "Green" premises into a "Green" conclusion?
      *   *If Yes:* Re-test the conclusion's Sensitivity. (Likely **Inferential Risk**).
  6.  [ ] **Final Verdict:** Select from Ladder. Sign.

  ---

  ### V. Application to Test Cases

  **(a) Sanctioned Cargo (Concealment)**
  *   **$P$:** "Firm X moves sanctioned cargo."
  *   **Sensitivity:** If $P$ False (not moving cargo), would we believe $P$? They conceal either way. Documentary trail looks ambiguous in both worlds. We might believe $P$ based on the same ambiguous trail. **Sensitivity Fail.**
  *   **Adherence:** If $P$ True, would we believe? They conceal well. We might miss it. **Adherence Fail.**
  *   **Verdict:** **RISK CALL.** Both counterfactuals fail. The evidence tracks the *concealment*, not the *cargo*.
  *   **Action:** Publish only if client pays for high-risk intelligence. Phrase as "Indicators consistent with..." not "We assess..."

  **(b) Empty Port (Absence)**
  *   **$P$:** "Port is not used for transshipment."
  *   **Sensitivity:** If $P$ False (Port *is* used), would we believe $P$ (that it isn't)? We looked and found nothing. If they are using it secretly, we still find nothing. So yes, we would believe $P$ even if False. **Sensitivity Fail.**
  *   **Adherence:** If $P$ True (Not used), would we believe? Yes, we look and see nothing. **Adherence Pass.**
  *   **Verdict:** **PROCESS ONLY.**
  *   **Action:** Forbidden to assert $P$. Permitted to assert: "We have found no evidence of transshipment." This distinguishes "looking and failing" from "not hearing."

  **(c) Systemic Corruption (Closure)**
  *   **$P$:** "Ministry is systematically corrupt."
  *   **Premises:** 12 irregularities (each Tracked).
  *   **Inference:** 12 irregularities $\to$ Systemic.
  *   **Sensitivity:** If $P$ False (Ministry is honest, just incompetent), would we believe $P$? Yes, incompetence looks like corruption in documents. **Sensitivity Fail.**
  *   **Verdict:** **RISK CALL (Inferential Risk).**
  *   **Action:** Nozick's closure failure bites here. You cannot assert $P$. You must assert: "We observe 12 irregularities consistent with systemic corruption." The leap to "systemic" is a risk appetite decision, not an evidentiary one.

  ---

  ### VI. Known Failure Modes (What This Procedure Cannot Do)

  1.  **The "Nearest World" Subjectivity:** Steps 4 and 5 rely on the analyst's imagination of the counterfactual. Two analysts may envision different "nearest worlds." The procedure standardizes the *question*, not the *answer*.
  2.  **Aggregation Blindness:** Because knowledge is not closed, this procedure forbids risk aggregation. We cannot assert "Portfolio Risk is High" even if 10 individual assets are "High Risk." This limits our ability to sell strategic overviews.
  3.  **Reference Class Arbitrage:** A determined analyst can game the "Default Method" definition to make Sensitivity easier (by making the method hyper-specific) or harder (by making it idealized). The Head must audit Reference Class flags randomly.
  4.  **Truth Condition:** We never actually know if Condition 1 ($P$ is True) is met. We are tracking *justification*, not truth. We are selling "Tracked Belief," not "Knowledge." Clients must understand this distinction, or we are liable for being right for the wrong reasons.
