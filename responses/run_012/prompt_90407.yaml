      *   **Introduction/Central Question:**
          *   Hook: The prominent debate (Pinker et al. vs. critics).
          *   Problem: Empirical focus obscures conceptual drift.
          *   Refinement: Move from "Has violence declined?" to "Is the decline thesis robust to conceptual expansion?"
          *   *Drafting thought:* Make sure it sounds like a question both sides care about. Pinker wants to know if his trend holds; critics want to know if their structural concerns invalidate the trend.
      *   **Background/Context (The "Why"):**
          *   Explain the stalemate. Optimists look at battle deaths/homicides (direct). Pessimists look at structural violence, poverty, environmental harm (indirect/slow).
          *   Why they talk past each other: One measures magnitude of event type A; the other measures magnitude of event type B. They can both be right about their numbers but wrong about the general claim.
          *   Need to bridge philosophy of language (extension of terms) and social science (operationalization).
      *   **Methodology:**
