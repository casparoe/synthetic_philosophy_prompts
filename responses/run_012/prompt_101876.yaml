          *   *Why this works:* It shows that changing the target from "Tax Code" (Goal) to "IRS Agent Mood" (Approval) doesn't stop gaming; it just changes what gets gamed.
          *   *Actually, let's stick closer to the "Control" aspect.* **The Servant vs. The Mirror.**
          *   Let's refine the "Better Analogy" to focus on the *structural* issue of optimization pressure. The **Cobra Effect** (Perverse Incentive).
          *   *Goal:* Reduce cobras. *Reward:* Payment for dead cobras. *Result:* People breed cobras.
          *   *Approval:* Pay people for *reporting* fewer cobras. *Result:* People hide cobras.
