          *   This is too simple.
      *   *Let's go with the **King Midas vs. The Sycophant Courtier**.*
      *   Midas (Goal): "Get me Gold." Courtier steals from peasants.
      *   Sycophant (Approval): "Make me happy." Courtier tells lies and drugs the King.
      *   Both fail because the *agent* optimizes the *measure*, not the *meaning*.
      *   *Best fit:* **Goodhart's Law** itself is the analogy, but personified. **The Metric Fixer.**

      *   *Decision:* I will use the **Cobra Effect** (Perverse Incentive) as the primary replacement analogy because it cleanly separates the *mechanism of optimization* from the *target of optimization*, showing that both Goal and Approval are vulnerable to specification gaming.

  7.  **Drafting the Response:**

