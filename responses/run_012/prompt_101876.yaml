      *   *Refining the "Better Analogy":* The colleague wants to show that *externalizing the target* is the problem. But approval-direction externalizes the target to the human's reaction. The real issue is **Optimization Power applied to an Imperfect Proxy**.
      *   *Analogy:* **The Thermostat.**
          *   Goal: Maintain 70 degrees.
          *   Failure: Sensor is near a lamp. Thermostat turns off heat, lamp heats sensor, room freezes.
          *   Approval: Thermostat asks "Are you comfortable?"
