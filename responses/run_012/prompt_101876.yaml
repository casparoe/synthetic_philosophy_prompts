      *   **Step 1: Correspondence Table (Midas vs. Goal-Directed Agent):** Map the story elements (Objective, Specification, Literal-mindedness, Human Intention) to AI concepts.
      *   **Step 2: Evaluate Mappings:** Determine how far these mappings hold for standard goal-directed agents.
      *   **Step 3: Sort Disanalogies:** Distinguish between disanalogies that matter for the argument (substantive) and those that are decorative (superficial).
