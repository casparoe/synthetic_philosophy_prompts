      *   Ensure the "arbitrariness" point is addressed directly.

      *Revised Bottom Line:* No, selecting the value that confirms your inclination is illegitimate rationalization, and the correct procedure is to apply a consistent decision rule such as maximin or E-admissibility that reflects your risk attitude rather than your desired outcome.

      *Reasoning:*
      Imprecise probabilities represent a state of suspended judgment where evidence is insufficient to warrant precision, so manipulating them to justify a prior impulse defeats their epistemic purpose. Decision theory offers several established bridges between sets of probabilities and actions, such as the maximin rule which chooses the option with the best worst-case outcome, or E-admissibility which permits any action that is optimal for at least one probability function within your set. Adopting one of these rules shifts the arbitrariness you wish to avoid from the estimation of facts to the selection of a risk policy, which is a matter of values rather than evidence. If your range is so wide that different rules recommend different actions, the rational conclusion is often that multiple choices are permissible or that you should seek more information before committing. Ultimately, you cannot eliminate arbitrariness entirely, but you can make it explicit and consistent by separating your uncertainty about the world from your attitude toward risk.

