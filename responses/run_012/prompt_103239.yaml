  ### The Rule: Restricted Self-Sampling (SSA)
  Nadia is a proponent of the **Self-Sampling Assumption (SSA)**, but with a crucial restriction on the **Reference Class**.

  Here is the breakdown of why this is the only profile that fits her history, and how it applies to the new case.

  #### 1. Why she isn't using SIA (Self-Indication Assumption)
  The **Self-Indication Assumption** says: *"Reason as if you are a random observer from the set of all possible observers."* Crucially, SIA gives higher prior probability to hypotheses that contain *more* observers, simply because there are more "slots" for you to exist in.
