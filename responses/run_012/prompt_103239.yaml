  *   **Conflict:** If Nadia used SIA, she would have to accept the **Presumptuous Philosopher's** conclusion. SIA implies you should believe the universe is enormous just because it contains more observers. Nadia rolls her eyes at this.
  *   **Conclusion:** Nadia rejects SIA.

  #### 2. Why she is using SSA (Self-Sampling Assumption)
  The **Self-Sampling Assumption** says: *"Reason as if you are a random observer from a specific **Reference Class** of observers."*
  *   **Fit:** SSA is the standard engine for the **Doomsday Argument**. It says: "If there were trillions of humans, it would be incredibly unlikely for me to be among the first 100 billion. Since I am, the total number is likely small."
