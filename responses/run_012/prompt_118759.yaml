answer: |-
  You have identified a profound structural feature of social systems, and your frustration is warranted: you are standing inside two different **epistemic machines**.

  There is no single common-language word for this, but there is a dense cluster of sociological and philosophical concepts that circle it. The closest established term is **Barnesian Performativity** (from the work of sociologist Donald MacKenzie, drawing on Michel Callon). However, that term describes how a *theory* makes the *world* match the theory (e.g., option pricing models changing how traders behave). Your observation is more specific: it is about how a *prior belief* designs the *measurement apparatus* such that the *data* produced cannot falsify the belief.

  Because the existing terms focus on the *outcome* (the behavior) rather than the *evidence* (the data stream), I will coin a term that captures the specific configuration you described: **Evidentiary Autopoiesis**.

  Here is the carving you asked for.

  ### The Term: Evidentiary Autopoiesis
  *(From Greek: auto = self, poiesis = making/creation)*

  **Definition:** A systemic condition in which the protocol for gathering information is determined by a prior assumption, such that the information produced by the protocol necessarily confirms the assumption, rendering the assumption structurally unfalsifiable from within the system.

  Unlike a simple bias (which is an error in processing), Evidentiary Autopoiesis is a **feature of the system's design**. It is "load-bearing" because it reduces transaction costs. You cannot simply "remove" the autopoiesis without collapsing the efficiency of the system.

  ### How It Differs From Related Concepts

  **1. Vs. Self-Fulfilling Prophecy (SFP)**
  *   **SFP:** Belief $\rightarrow$ Action $\rightarrow$ **Outcome**.
      *   *Example:* I believe the bank is insolvent $\rightarrow$ I withdraw money $\rightarrow$ The bank becomes insolvent.
      *   *Focus:* The belief changes the *reality* of the event.
  *   **Evidentiary Autopoiesis:** Belief $\rightarrow$ **Measurement Protocol** $\rightarrow$ Data.
      *   *Example:* I believe officials are corrupt $\rightarrow$ I install audits $\rightarrow$ Audits find errors (because audits always find errors) $\rightarrow$ Data confirms corruption.
      *   *Focus:* The belief changes the *visibility* of the event. The reality might be identical in both systems; the *record* of reality is what differs.

  **2. Vs. Confirmation Bias**
  *   **Confirmation Bias:** An individual cognitive error where one ignores counter-evidence. It is considered a bug to be fixed.
  *   **Evidentiary Autopoiesis:** An institutional architecture where counter-evidence is *never generated* in the first place. It is a feature that maintains stability. In your Danish office, the lack of audits isn't negligence; it is a cost-saving mechanism enabled by the trust loop.

  **3. Vs. High-Trust / Low-Trust Equilibrium**
  *   **Trust Equilibrium:** Describes the *state* of the society (people trust each other).
  *   **Evidentiary Autopoiesis:** Describes the *mechanism* that keeps the state stable. It explains *why* the trust persists despite the lack of verification. The trust produces the silence that justifies the trust.

  ### The Edges: What Is and Isn't an Instance

  **Instance (Your Bureaucracy):**
  *   **US Office:** Assumption = "Agents will shirk." Protocol = "Strict auditing." Result = "Shirking detected." Conclusion = "Assumption correct."
  *   **DK Office:** Assumption = "Agents are professional." Protocol = "Peer reliance." Result = "No shirking reported." Conclusion = "Assumption correct."
  *   *Why it fits:* The method of checking is dictated by the belief, and the output of the method validates the belief.

  **Instance (Policing):**
  *   **Aggressive Policing:** Assumption = "This neighborhood is high crime." Protocol = "High patrol density." Result = "More arrests for minor infractions." Conclusion = "Neighborhood is high crime."
  *   **Community Policing:** Assumption = "This neighborhood is stable." Protocol = "Low patrol density." Result = "Few arrests." Conclusion = "Neighborhood is stable."

  **Non-Instance (The Placebo Effect):**
  *   **Why:** The Placebo Effect is physiological/psychological. The belief changes the *body's chemistry*, not the *measurement tool*. In Evidentiary Autopoiesis, the "chemistry" (the actual honesty of the workers) might be identical; it is the *detection* that changes.

  **Non-Instance (Confidence signaling Competence):**
  *   **Why:** This is interpersonal signaling. A confident person *looks* competent to others. In Evidentiary Autopoiesis, the system produces *hard data* (audit logs, crime stats, paperwork trails) that looks objective but was structurally predetermined.

  ### Why You Can't Run the Experiment

  You correctly identified that you cannot hold the "suspicious attitude" for five years in Copenhagen to test it. This is because the attitude is not just a lens; it is a **cost structure**.

  *   **The Danish Cost:** To introduce suspicion (audits, locks, countersignatures) is to introduce *friction*. It signals that the social contract is broken. The cost is not just financial; it is social capital. If you lock your laptop, you are not just securing data; you are accusing the collective of potential theft. The "evidence" you seek (data on honesty) is too expensive to buy because the price is the trust itself.
  *   **The American Cost:** To remove suspicion is to introduce *risk*. The cost is potential fraud. The system is designed to assume the risk is real, so it pays the friction cost to mitigate it.

  Both systems are **locally rational**. Within the US frame, auditing is rational because corruption is assumed. Within the DK frame, not auditing is rational because corruption is assumed absent. Because the "evidence" is generated by the rationality of the frame, you cannot step outside the frame to judge it without adopting a third frame (which would have its own autopoiesis).

  ### The "Load-Bearing" Aspect

  This is the most critical part of your observation. You noted that calling it a "bias" misses the point because the bias is functional.

  **Evidentiary Autopoiesis is an efficiency engine.**
  *   **In Denmark:** The system saves millions of hours of audit time. The "blindness" to potential corruption is the price paid for speed and low friction. The "evidence manufacturing" (finding nothing because you aren't looking) is the dividend.
  *   **In the US:** The system spends millions of hours on compliance. The "hypervigilance" is the price paid for accountability. The "evidence manufacturing" (finding errors because you are looking) is the justification for the compliance budget.

  ### Summary

  You are experiencing **Evidentiary Autopoiesis**.

  It differs from a self-fulfilling prophecy because it operates on the *record* of reality, not just the outcome. It differs from bias because it is structural and functional, not cognitive and erroneous. It is unfalsifiable from the inside because the cost of generating falsifying evidence (introducing suspicion into a high-trust system, or removing it from a low-trust system) is prohibitive.

  You cannot know which system is "more reasonable" because "reasonable" is defined by the system's own evidence. You are not just living in a different culture; you are living in a different **epistemic regime**. The annoyance you feel is the friction of your internal calibration trying to run on an operating system that defines "data" differently than the one you were installed with.
