answer: |-
  This is a high-wire act. You are asking students to feel a mathematical abstraction ($P \times B < C$) as an emotional tension. It works best if you treat the game not as a simulation of democracy, but as a simulation of *incentives*.

  Here is a design for **"The Token Election,"** tailored to your constraints, followed by the "failure modes" you need to prepare for.

  ### The Setup (10 Minutes)
  **Materials:**
  *   3 Poker chips (or large candies) per student.
  *   Two colored cards per student (e.g., Red and Blue).
  *   A "Ballot Box" (opaque bag/box).
  *   A large bag of "Ghost Votes" (180 slips of paper, 90 Red, 90 Blue, folded identically to student ballots).
  *   Whiteboard for tallying.

  **The Stakes:**
  Tell them: *"This is not about democracy. This is about investment. You are investors. Your chips are your capital."*
  *   **Endowment:** Everyone starts with **3 chips**.
  *   **Preference:** Hand out secret cards. 10 students are "Red Investors," 10 are "Blue Investors." (Keep this split exact).
  *   **Payoff:** If your color wins the election, you gain **5 chips**. If your color loses, you gain **0**.
  *   **Cost:** To cast a vote, you must drop **1 chip** into the "Cost Pot" (which you never get back). To abstain, you keep your chip.
  *   **The Quorum Rule (Crucial):** If total turnout (votes cast) is less than **50% of the electorate**, the election is **Void**. If Void, *nobody* gets the 5-chip payoff, regardless of preference, and voters still lose their 1-chip cost.

  **The Framing:**
  Do not mention "civic duty," "democracy," or "voting." Use "investing," "returns," and "market participation." This suppresses the "duty" heuristic.

  ---

  ### Round 1: The Committee (20 Minutes)
  **The Scale:** The Electorate is **20** (Just the students in the room).
  **The Instruction:** *"You are a small board. Your votes determine the outcome directly. Decide privately: Invest (Vote) or Hold (Abstain). Write your choice on a slip. Red/Blue preference is already on your card. If you vote, submit card + slip + 1 chip. If abstain, keep chip, submit nothing."*

  **The Expected Trap:**
  Rational choice suggests: *"My vote likely doesn't matter, and 19 others will probably vote to meet quorum. I'll free-ride."*
  If enough students think this, turnout drops below 50% (10 votes). The election is Void. Everyone keeps their base 3 chips, but voters lose 1, and *no one* gets the 5-chip bonus. The group collectively leaves money on the table because individually rational moves prevented the quorum.

  **The Reveal:**
  Count the votes.
  *   **If Quorum Met:** One side wins. Ask the abstainers: *"You kept your chip, but your side won. Was it worth not voting?"*
  *   **If Quorum Failed (Ideal):** Highlight the frustration. *"Everyone wanted the bonus. Everyone knew the rule. But individually, saving the chip made sense. Look at the result."*

  ---

  ### Round 2: The Plebiscite (20 Minutes)
  **The Scale:** The Electorate is **200** (20 Students + 180 Ghost Votes).
  **The Instruction:** *"Same stakes. Same cost. But you are no longer the whole board. You are a precinct. In this box are 180 absentee ballots from the rest of the population. They are already cast. You don't know how they voted, only that they are in here."*

  **The Pedagogical Rig (The Pivot):**
  This is where you manipulate the outcome to teach the lesson.
  1.  Collect the student votes and chips. **Do not count them yet.**
  2.  Tell the class: *"In a large election, the odds you are decisive are microscopic. Ex-ante, you are irrelevant."*
  3.  **The Trick:** Count the student votes privately behind the podium.
      *   *Scenario A:* Students voted heavily. Add Ghost Votes to dilute their impact (showing low $P$).
      *   *Scenario B (The Pivot):* Adjust the Ghost Votes to create a **1-vote margin**.
      *   *How:* If students cast 12 votes (7 Red, 5 Blue), you pull Ghost Votes from the bag until the total count is (e.g.) 100 Red vs 101 Blue.
      *   *Note:* You must have enough Ghost Votes to mathematically allow this. Since you have 180 slips (90/90 split), you have the flexibility to create a tie or 1-vote margin regardless of the student vote, provided student turnout isn't 100%.
  4.  **The Reveal:** Announce the final tally. *"Red: 101. Blue: 100."*
  5.  **The Punchline:** Find the one student whose vote broke the tie (or would have). *"For this person, $P$ was not microscopic. $P$ was 1. But before you cast the vote, you didn't know that."*

  ---

  ### The Debrief (25 Minutes)
  **Do not use jargon yet.** Ask phenomenological questions first.
  1.  *"In Round 1, who abstained to save the chip? How do you feel now?"* (Regret vs. Smart).
  2.  *"In Round 2, did the Ghost Votes make you feel less responsible? Why?"*
  3.  *"For the person who was the pivot: Did you feel different when you voted?"* (Likely no, because they didn't know).

  **Introduce the Math ($R = PB - C$):**
  Write the equation on the board.
  *   **$C$ (Cost):** The chip.
  *   **$B$ (Benefit):** The 5 chips.
  *   **$P$ (Probability):** The ghost votes.

  **The "Smart Answer" (The Way Out):**
  This is the most critical part. If you end on "Voting is irrational," you've failed the normative goal.
  *   **Ask:** *"If $P$ is near zero, why do millions vote?"*
  *   **Guide them to $B$:** *"In this game, $B$ was selfish (5 chips for you). In reality, if your vote changes the outcome, it changes it for **everyone**."*
  *   **The Calculation:** If the policy is worth \$1,000 to each of 10 million people, the Social Benefit is \$10 Billion. Even if $P$ is 1 in 10 million, $P \times B_{social}$ might exceed $C$.
  *   **Conclusion:** Rational voting isn't about self-interest; it's about **social interest internalized**. Or, acknowledge "Expressive Voting" (voting to feel like a citizen, which adds a psychological benefit to $B$).

  ---

  ### What Will Go Sideways (And How to Handle It)

  **1. The "Duty" Defectors**
  *   **The Problem:** You will have 3-4 students who vote every time regardless of cost because "it's the right thing to do." This ruins the Quorum failure in Round 1.
  *   **The Fix:** Pre-brief the incentives aggressively. *"I am testing economic rationality, not morality. If you vote out of duty, you are contaminating the data. Pretend this is a stock market."*
  *   **If they still vote:** Acknowledge it in the debrief. *"Some of you had a different $B$ term. You derived utility from the act of voting itself (expressive benefit). That is a valid solution to the paradox, but it changes the equation."*

  **2. The Collusion**
  *   **The Problem:** They talk. *"If we all vote, we all win."*
  *   **The Fix:** Enforce strict silence. Collect votes simultaneously. If they collude, the game becomes a cooperative bargaining session, not a paradox demonstration.
  *   **If it happens:** *"You solved the Collective Action Problem by communicating. In a secret ballot of 10 million, you can't do that. That's why the paradox exists."*

  **3. The Cynicism Trap**
  *   **The Problem:** They leave thinking, *"So voting is stupid."*
  *   **The Fix:** You must hammer the **Social Benefit** argument in the debrief. The game models *self-interested* voting. Real voting is often *other-regarding*. Make sure they distinguish between "Rational for me" vs. "Rational for us."

  **4. The Rigging Backlash**
  *   **The Problem:** If they find out you manipulated the Ghost Votes to force a pivot, they might feel cheated.
  *   **The Fix:** Be transparent. *"I rigged the Ghost Votes. Why? Because in a random simulation of 200 people, we might not have seen a pivot. I forced the pivot so you could feel the difference between Ex-Ante Probability (tiny) and Ex-Post Reality (decisive). The math of the risk remains the same."*

  ---

  ### What The Game Cannot Reproduce (Say This Out Loud)

  You cannot simulate these mechanics; you must name them in the debrief.

  1.  **True Scale:** 200 voters is not 100 million. The psychological weight of $P$ is different. In the game, $P$ feels calculable. In reality, $P$ feels like zero.
  2.  **Social Pressure:** In class, I (the professor) am watching. In the booth, no one is watching. This lowers the "shame cost" of abstention in real life.
  3.  **The "B" of Altruism:** In the game, they only got chips for *themselves*. In real elections, voters often care about the welfare of others. If you care about 1,000 other people, your $B$ is 1,000$\times$ larger, making voting rational even with low $P$.
  4.  **Minimax Regret:** Some people vote not to win, but to avoid the regret of *not* voting if their side loses by one. The game captures this in the pivot round, but emphasize that this is an emotional heuristic, not a payoff calculation.

  ### Timing Checklist (75 Minutes)
  *   **00-10:** Setup & Rules (Emphasize "Investment," not "Voting").
  *   **10-30:** Round 1 (Small Group) & Reveal.
  *   **30-50:** Round 2 (Ghost Votes) & Reveal.
  *   **50-75:** Debrief (Feelings $\to$ Math $\to$ Social Solution).

  This structure forces them to live the contradiction: The vote that felt worthless (Round 2) was the one that mattered (The Pivot), and the vote that felt safe (Abstaining in Round 1) led to the collective loss. That cognitive dissonance is where the learning happens.
