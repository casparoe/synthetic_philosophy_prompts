answer: |-
  You have successfully reverse-engineered a coherent decision theory, but you have also stumbled into the exact fault line that currently divides the field. Your verdicts are not random; they cluster tightly around **Self-Interested Functional Decision Theory (SI-FDT)**, with one significant outlier that contradicts your own principles.

  Here is the breakdown of the principle you are using, where it breaks, and what you have to sacrifice to keep it standing.

  ### 1. The Unifying Principle: Self-Interested Functional Decision Theory

  Your verdicts on cases (1), (2), (3), (5), (6), and (7) are all consistent with a single core axiom:

  > **The Principle:** *Choose the output of your decision algorithm that maximizes your expected utility across all logically possible worlds consistent with that algorithm, weighted by your prior, subject to a self-indexed utility function.*

  Let's map your cases to the clauses of this principle:

  *   **Clause A: "Maximize across logically possible worlds" (Updatelessness)**
      *   **Case (1) Counterfactual Mugging:** You pay because you are optimizing the *policy* "Pay if Tails" from the ex-ante perspective. Even though the coin is Tails now, your algorithm's output determines whether you get paid in the Heads world. You care about the algorithm's performance across the multiverse of logical possibilities, not just the actual branch.
      *   **Case (2) Precommitment:** This is the same as (1), but the "binding contract" makes the policy explicit. It feels easier because the decision is moved to the ex-ante position where the expected value is clearly positive.
      *   **Case (6) Newcomb:** You one-box because your decision is logically correlated with Omega's prediction. You treat your decision as determining the content of the opaque box via logical subjunctive dependence.

  *   **Clause B: "Consistent with that algorithm" (Causal/Logical Screening)**
      *   **Case (5) Smoking Lesion:** You smoke. Why? Because your decision algorithm does not *determine* the lesion. The lesion is a common cause. Your decision is merely *evidence* of the lesion, not a logical or causal determinant of it. FDT (like CDT) rejects "managing the news."
      *   **Case (3) Ordinary Blackmail:** You don't pay. Why? Because the blackmailer has no access to your algorithm *before* making the offer (no crystal ball). Your decision now cannot logically influence the past offer. Paying is a sunk cost with no leverage. (Note: You said "I know that's not maximizing." In FDT, it *is* maximizing relative to the policy that prevents blackmail in the first place, but in this specific "no prediction" variant, it aligns with CDT: don't throw good money after bad).

  *   **Clause C: "Self-indexed utility function"**
      *   **Case (7) Altruistic Mugging:** You refuse. Why? Because your utility function is self-indexed. In (1), the counterfactual Heads-world benefit accrues to *you*. In (7), it accrues to a *stranger*. FDT maximizes *your* utility across possible worlds, not global utility. You are willing to sacrifice Actual-You for Counterfactual-You, but not for Counterfactual-Stranger.

  ### 2. The Inconsistency: Case (4) XOR Blackmail

  Here is the hard truth: **Verdict (4) is incompatible with Verdict (5).**

  *   **In (5) Smoking:** You refuse to act on evidence. Smoking is evidence of cancer, but you ignore it because smoking doesn't *cause* cancer. You refuse to "manage the news."
  *   **In (4) XOR Blackmail:** You *agree* to act on evidence. Paying is evidence that there are no termites (because the note is sent iff Termites XOR Pay). By paying, you make it highly probable the note was triggered by the payment clause, not the termites. You are "managing the news."

  Structurally, these cases are identical regarding the relationship between Action and Bad Outcome.
  *   In (5), Action $\to$ Evidence of Bad Outcome.
  *   In (4), Action $\to$ Evidence of Good Outcome (No Termites).

  If you refuse to smoke in (5) to avoid the *evidence* of cancer, you are an Evidential Decision Theorist (EDT). If you smoke in (5), you are a Causal/Functional Decision Theorist (CDT/FDT).
  *   If you are **EDT**: You should **Not Smoke** (5) and **Pay** (4).
  *   If you are **FDT**: You should **Smoke** (5) and **Not Pay** (4).

  You are currently trying to be FDT in (5) and EDT in (4). This is the "trenchcoat." In (4), paying $1,000 does not causally remove termites, nor does it logically determine the past state of the termites. It only determines the *truth value of the note's explanation*. Since you already have the note, the termite state is fixed. Paying simply burns $1,000 to learn you are the type of person who pays XOR blackmailers.

  **To maintain a consistent theory, you must drop Verdict (4).** You should not pay in the XOR Termites case. It is a tax on evidential reasoning that you correctly rejected in the Smoking case.

  ### 3. Verdicts on Your New Cases

  Based on **Self-Interested Functional Decision Theory** (and dropping verdict 4), here is how you should rule on the variants you proposed:

  **Variant A: XOR Blackmail with Unknown Source**
  *   *Setup:* Same as (4), but you have no idea how the source knew the logical conditions or the termite state.
  *   *Verdict:* **Do Not Pay.**
  *   *Reasoning:* FDT requires a substrate of logical dependence. In the standard XOR case, the "honest source" establishes a logical link between your decision and the note's truth conditions. If you have "no earthly idea how it knew," you cannot establish the logical subjunctive dependence required to justify the action. It reverts to a standard causal scenario: Termites are fixed, Note is fixed, Payment is a loss.

  **Variant B: Blind Counterfactual Mugging**
  *   *Setup:* Same as (1), but Omega never reveals the coin result. He just asks for $100.
  *   *Verdict:* **Pay.**
  *   *Reasoning:* This is actually the *purest* form of Counterfactual Mugging. Not knowing the coin result forces you into the ex-ante position. You know there is a 50% chance you are in the Heads world (where paying gets you $10k) and 50% Tails (where paying costs $100). The expected value of the policy "Always Pay" is positive ($4,950). Since you don't know the outcome, you cannot update to "I'm in the losing branch." You must optimize the policy.

