  Your intuition in (4) is driven by the desire to avoid the $1,000,000 loss. It feels like paying "buys" safety. But in (5), smoking feels like it "buys" pleasure without causing cancer. The asymmetry is that in (4), paying *correlates* with safety, just as smoking *correlates* with cancer. If you trust your gut in (5) that correlation isn't control, you must trust it in (4) that correlation isn't control either.

