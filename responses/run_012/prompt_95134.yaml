answer: |-
  1. "Where my reading goes wrong"
  Your reading assumes Anscombe's protest rested primarily on the empirical claim that the bombings were unnecessary. You treat the label "murderer" as contingent on historical verdicts about casualty counts. This is mistaken. Anscombe did argue the bombings were unnecessary, but that was supplementary. Her core objection was deontological: the intentional killing of innocents is intrinsically evil, regardless of consequences. You assume her ethics are consequentialist—that the rightness of an act depends on its outcomes. If the bombings saved lives, a consequentialist would vindicate Truman. Anscombe rejects this calculus. For her, actions are forbidden absolutely, not because they fail to optimize outcomes, but because they violate moral law. Your error is categorizing her protest as a dispute over evidence rather than a dispute over moral principles. She opposed the degree because honoring Truman condoned the principle that innocent lives can be traded for victory, not merely because she thought the trade was inefficient.

  2. "What Anscombe actually held"
  Anscombe was a staunch opponent of consequentialism, the view that moral rightness is determined solely by outcomes. In her pamphlet "Mr. Truman's Degree," she argues that Western civilization had lost the concept of absolute moral prohibitions. Her central claim is that intentionally targeting non-combatants is murder, full stop. This is not a calculation of net lives saved; it is a violation of justice. She distinguishes sharply between foreseen side-effects and intended means. While a soldier might foresee civilian death during an attack on a military target, intentionally making civilians the target to coerce surrender is forbidden. For Anscombe, morality consists of hard constraints, not variables in an optimization function. She believed that once you accept that innocent people can be killed for the "greater good," you have abandoned morality itself. Her protest was not merely that Truman miscalculated; it was that he adopted a wicked principle. She argued that Oxford, by honoring him, was endorsing the idea that successful mass murder confers honor. Her stance relies on a Natural Law framework where certain acts are inherently incompatible with human flourishing and justice. Therefore, the historical necessity of the bombings is largely irrelevant to the moral judgment. Even if an invasion would have cost a million lives, intentionally killing civilians to prevent it remains unjust. She sought to uphold the distinction between combatants and non-combatants as sacrosanct. Her objection was that Truman acted as a pirate or gangster rather than a legitimate authority, because legitimate authority does not massacre innocents, regardless of the strategic utility. Honoring him legitimized this erosion. She sought to recall society to a duty-based ethics where some acts are forbidden regardless of results. Thus, calling Truman a murderer was a moral classification, not an insult based on inefficiency.

  3. "My colleague's hypothetical"
  Your colleague is correct about what Anscombe's position implies. She would indeed call that commander a murderer, regardless of the arithmetic. In her framework, the intentional killing of innocents is never permissible, even to prevent greater slaughter. This follows directly from her rejection of consequentialism. If morality allows the killing of innocents whenever the numbers favor it, then innocence offers no protection, and justice collapses into calculation. However, characterizing this as "monstrous" begs the question against her. From Anscombe's perspective, the monstrous position is the consequentialist one, which permits massacring the innocent if the spreadsheet balances. She would argue that accepting your colleague's hypothetical normalizes the idea that human beings are expendable resources. By holding the constraint absolute, she preserves the dignity of the individuals involved against the collective. She accepts that adhering to moral law may lead to worse worldly outcomes, but she denies that moral truth is dependent on worldly success. For her, a "good" outcome achieved through evil means is tainted. So, while your colleague correctly identifies the implication, he interprets it as a reductio ad absurdum, whereas Anscombe sees it as the necessary cost of maintaining a coherent moral order. She prefers defeat to murder.

  4. "My question, restated"
  You asked whether Anscombe's objection was specifically historical rather than moral. The answerable question is: To what extent did Anscombe primarily rely on empirical claims about necessity to support her moral condemnation? Ask whether her argument requires the bombings to be unnecessary, or if targeting civilians is sufficient for condemnation regardless of necessity. This shifts the focus from verifying historical data to understanding the structure of her ethical theory. It clarifies whether her position fundamentally collapses if the bombings are proven necessary. This is the core philosophical issue for you.
