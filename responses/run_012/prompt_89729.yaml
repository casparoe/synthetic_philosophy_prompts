  # The Moral Uncertainty Decision Tree

  ### The Tree

  **Node 1:** Does moral uncertainty itself give you any reason to act differently from what your highest-credence theory prescribes?
  *   **No (Credence-Inert):** Your credences about moral truth do no work in fixing what you may do.
      *   **Node 2:** Do you follow the highest-credence theory because it is most likely true, or because uncertainty is normatively irrelevant?
          *   Because most likely true → **Leaf: Highest-Credence-Wins**
          *   Because irrelevant → **Leaf: No-Hedging**
  *   **Yes (Credence-Responsive):** Your credences modify your obligations.
      *   **Node 3:** Does the view license binding your future self against anticipated moral change?
          *   **Yes** → **Leaf: Diachronic Commitment**
          *   **No** → **Node 4:** Is the primary response to uncertainty changing what you do today (action-hedging) versus spending resources to keep moral options open (portfolio-hedging)?
              *   **Portfolio-Hedging** → **Leaf: Portfolio-Hedging**
              *   **Action-Hedging** → **Node 5:** Can choiceworthiness be compared across theories at all (intertheoretic comparison)?
                  *   **No** → **Leaf: Dominance/Maximality**
                  *   **Yes** → **Node 6:** How does aggregation treat theories?
                      *   **As Voters/Bargainers** → **Node 7:** Is the aggregation rule pessimistic (avoid worst outcome) or cooperative (maximize total satisfaction)?
                          *   Pessimistic → **Leaf: Maximin/Pessimistic**
                          *   Cooperative → **Leaf: Parliamentary/Bargaining**
                      *   **As Value Functions (Averaged)** → **Node 8:** Does aggregation require scale normalization to handle tiny credences in enormous demands?
                          *   **No** → **Leaf: Maximize Expected Choiceworthiness (MEC)**
                          *   **Yes** → **Leaf: Scale-Normalizing Variant**

  ---

  ### Leaf Descriptions and Probes

  | Leaf Name | Most Awkward Commitment | Free Saturday (A: Volunteer, B: Study, C: Rest) | Tiny Credence/Enormous Demand | Insect Experience (Scale) | Future Moral Change (Binding) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **No-Hedging** | You ignore a 49% chance you are committing a atrocity. | Follow theory with strongest endorsement, ignore spread. | Ignore the demand; follow main theory. | Ignore insect value if main theory says no. | Act on today's view; future revision is irrelevant. |
  | **Highest-Credence-Wins** | You treat a 51% credence as 100% certainty for decision purposes. | Follow the single most probable theory. | Ignore the demand; follow main theory. | Ignore insect value if main theory says no. | Act on today's view; future revision is irrelevant. |
  | **Diachronic Commitment** | You may force your future self to act on views you expect to reject. | Commit now to the plan best under current credences. | Bind self to resist mugging if current view says no. | Bind self to current scale estimates. | **Bind future self** to current moral judgment. |
  | **Portfolio-Hedging** | You may spend resources gaining information rather than doing good now. | Study or earn to keep options open for later decision. | Keep resources liquid in case theory is true. | Keep options open to value insects later. | Keep options open; **do not bind** future self. |
  | **Dominance/Maximality** | You are paralyzed whenever theories disagree on ranking. | Do nothing unless A, B, and C agree on best option. | Act only if all theories agree on demand. | Act only if all theories agree on insect value. | Act only if current and future views agree. |
  | **Maximin/Pessimistic** | You prioritize avoiding the worst theoretical outcome over likely good. | Choose option with least bad worst-case across theories. | Avoid the catastrophic risk of ignoring the demand. | Assume insects matter to avoid worst-case. | Optimize current credences for worst-case scenario. |
  | **Parliamentary/Bargaining** | You might accept a suboptimal outcome to satisfy a minority theory. | Bargain between A, B, C to find a compromise action. | Bargain; tiny credence gets tiny voting share. | Bargain; scale differences complicate voting weights. | Optimize current credences via bargaining model. |
  | **MEC** | You are vulnerable to Pascal's Mugging (fanaticism). | Mix actions proportional to credence × value. | **Comply** if credence × demand > other options. | **Weight heavily** if value scale is vast. | Optimize relative to **current credences** only. |
  | **Scale-Normalizing** | You arbitrarily cap the influence of high-stakes theories. | Mix actions, but cap influence of extreme values. | **Ignore** if demand exceeds normalized scale. | **Normalize** insect value to human scale. | Optimize relative to **current credences** only. |

  ---

  ### Table of the Logical Space

  The following table maps the combinations of features defined by the branch nodes. Occupied cells correspond to the leaves above. Unoccupied cells are diagnosed.

  | Credence Role | Temporal Stance | Hedging Type | Intertheoretic Comparison | Aggregation Method | Normalization | Leaf Position | Diagnosis of Unoccupied/Pruned Space |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Inert** | N/A | N/A | N/A | N/A | N/A | **No-Hedging / HCW** | N/A | |
  | **Responsive** | **Bind Future** | N/A | N/A | N/A | N/A | **Diachronic Commitment** | N/A | |
  | **Responsive** | **No Bind** | **Portfolio** | N/A | N/A | N/A | **Portfolio-Hedging** | N/A | |
  | **Responsive** | No Bind | Action | **No** | N/A | N/A | **Dominance/Maximality** | *Responsive + No Comparison + Linear Aggregation:* **Incoherent**. Cannot average values without a common scale. |
  | **Responsive** | No Bind | Action | Yes | **Voters/Bargainers** | N/A | **Parliamentary / Maximin** | *Responsive + No Comparison + Portfolio:* **Unattractive**. Portfolio hedging requires estimating future value of information, which implies comparison. |
  | **Responsive** | No Bind | Action | Yes | **Value Functions** | **No** | **MEC** | *Responsive + Comparison + Non-Linear + Normalization:* **Unexplored**. Normalization is typically a fix for linear expectation problems, not non-linear bargaining. |
  | **Responsive** | No Bind | Action | Yes | **Value Functions** | **Yes** | **Scale-Normalizing** | *Responsive + Comparison + Voters + Normalization:* **Unattractive**. Voting models usually rely on ordinal rankings, making cardinal normalization irrelevant or incoherent. |

  ---

  ### Leaves the Tree Cannot Separate

  1.  **MEC vs. Scale-Normalizing Variant:** In cases where no theory posits "enormous demands" (no fanaticism scenarios), these two leaves prescribe identical actions. The tree separates them based on a hypothetical vulnerability (Node 8) rather than actual output in standard cases.
      *   *Further Question:* "Does your aggregation rule change when a theory posits infinite or lexicographically larger values?"
  2.  **Highest-Credence-Wins vs. No-Hedging:** In practice, both leaves instruct the agent to follow the single most likely theory. The tree separates them based on the *justification* (Node 2) rather than the *action*.
      *   *Further Question:* "If you knew your highest-credence theory was false, would you switch to the second-highest, or abandon the method entirely?"
  3.  **Parliamentary/Bargaining vs. MEC with Non-Linear Weighting:** A parliamentary model where votes are weighted by credence can mathematically resemble an expectation function with non-linear transformation of value.
      *   *Further Question:* "Do theories negotiate trade-offs explicitly (bargaining), or are their values automatically summed (aggregation)?"

  ---

  ### Note on the Critical Branch

  The single branch that does the most work is **Node 5: Can choiceworthiness be compared across theories at all?**

  This separator creates the deepest fissure in the logical space. If the answer is "No," the entire machinery of expectation, normalization, and weighted averaging collapses, forcing the agent into **Dominance/Maximality** reasoning regardless of their views on hedging, binding, or aggregation styles. It is the gatekeeper for almost all "hedging" positions; without intertheoretic comparison, moral uncertainty cannot be mathematically integrated into decision-making, reducing the sophisticated responsive views to a crude check for agreement. Most disputes in this space are not about how to average values, but whether such an average is meaningful.
