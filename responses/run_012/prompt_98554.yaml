answer: |-
  **Examination Question**

  **Course:** PHI405: Practical Reason and Agency
  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question. Citations are not required. Clarity and argumentative precision are prioritized over exegesis.

  **Question:**
  Consider Nadia, who acknowledges the facts of animal suffering but lacks any internal motivation to change her diet, and Tom, who possesses a powerful, implanted motivation to help a stranger that he explicitly disowns.

  A satisfactory account of practical reason must explain why we might judge that Nadia *has* a reason to act despite her silence, while Tom *lacks* a reason to act despite his urge. If we stretch the definition of an agent's "motivations" to include Nadia's rational capacities, do we inevitably validate Tom's implanted urge as equally reason-giving? If we insist that reasons must be grounded in the agent's perspective to avoid alienation, do we render Nadia's supposed reason merely external pressure?

  Write an essay resolving this tension. Do not simply define Internalism and Externalism; demonstrate how a single principle of agency can distinguish between Nadia's inaction and Tom's compulsion without collapsing into skepticism or dogmatism.

  ***

  **Model Answer**

  The tension between Nadia and Tom exposes the fragility of grounding reasons solely in psychological states. If reasons require a pre-existing motivational link, Nadia is inexplicable; if reasons require only a motivational link, Tom is vindicated. To resolve this, we must shift the locus of authority from the *presence* of motivation to the *structure* of the agent's endorsement. The distinction lies not in whether a motive exists, but in whether that motive survives the agent's rational reflection.

  Nadia's case challenges the view that reasons must be anchored in current desires. She is lucid and non-akratic; her lack of motivation is not a failure of logic but a gap in her caring. A crude internalism fails here, declaring she has no reason. However, a sophisticated internalism might argue that if Nadia were fully rational, she *would* be motivated. This saves Nadia's reason but risks importing a normative standard so robust it floats free of her actual psychology. If we say she has a reason because a "better version" of her would act, we risk alienating the reason from the actual woman sitting in front of us. The reason becomes a fact about moral truth, not a fact about her agency.

  Tom's case inverts the problem. He has the motivation Nadia lacks. A crude internalism must concede Tom has a reason, as the urge moves him. Yet, intuitively, Tom is being manipulated; the urge is a foreign body. If we validate Tom's urge as reason-giving, we reduce agency to mere causality. Any impulse, provided it is strong enough, would generate a reason. This swallows the agent whole. To deny Tom a reason, we must claim that motivations must be *owned*. But if ownership is the key, we must explain why Nadia's lack of ownership over animal welfare negates her reason, while Tom's lack of ownership over his urge negates his.

  The solution requires a unified criterion of *rational integratability*. A consideration counts as a reason for an agent if it can be integrated into their rational worldview without coercion or bypassing their evaluative faculties. Nadia's silence is a failure of integration, but it is not a rejection. Her rational faculties are intact; she simply hasn't connected the facts to her will. The reason exists potentially because nothing in her rational architecture blocks it; the path is open, merely untraveled. We can say she has a reason because acting on it would not violate her agency; it would expand it.

  Tom's urge, conversely, bypasses his evaluative faculties entirely. It is not that he rejects the content; it is that the source of the motivation is external to his rational governance. Integrating this urge would require him to surrender his capacity to judge. Thus, Tom lacks a reason because the motivation is structurally alien, even if psychologically present.

  This distinction avoids the trap of stretching "motivation" too far. We do not claim Nadia *is* motivated; we claim her agency is *receptive* to the reason. We do not claim Tom *isn't* motivated; we claim his agency is *bypassed* by the motivation. The crux is resolved by recognizing that reasons must be compatible with the agent's status as a rational governor. Nadia retains governorship but chooses not to steer; Tom has the wheel forced from his hands.

  Therefore, we can affirm Nadia has a reason without validating Tom. Nadia's reason is grounded in the normative demands that her own rational nature would acknowledge upon full reflection. Tom's urge is grounded in a causal intervention that circumvents his rational nature. The standard does not float free of Nadia because it is tethered to *her* rationality, not a moral universe detached from her. Simultaneously, it does not swallow Tom because it demands that motivations be mediated by the agent's own endorsement mechanisms.

  Ultimately, a reason is not merely a cause of action, nor a moral fact independent of the agent. It is a consideration that an agent *could* own without ceasing to be themselves. Nadia could own the reason to stop eating meat; it fits her lucidity. Tom cannot own the implanted urge without admitting he is a puppet. By focusing on the capacity for ownership rather than the existence of desire, we preserve the normativity of reasons for Nadia while protecting the integrity of agency against Tom's manipulation.

  ***

  **Marking Scheme**

  **Total Marks:** 25
  **Pass Threshold:** 13/25
  **Distinction Threshold:** 21/25

  | Move | Marks | Criteria for Award | Typical Error (How to lose the marks) |
  | :--- | :---: | :--- | :--- |
  | **1. Diagnosis of Nadia** | 5 | Identifies that Nadia's lack of motivation challenges Internalism, but notes that appealing to "ideal rationality" risks alienating the reason from her actual self. | Treating Nadia simply as a counter-example to Internalism without noting the cost of saving her (the "floating standard" problem). |
  | **2. Diagnosis of Tom** | 5 | Identifies that Tom's motivation challenges Internalism's sufficiency condition; acknowledges that validating him reduces agency to causality. | Arguing Tom has no reason simply because the urge is "bad" or "external," without explaining why internal motivations can also be alien. |
  | **3. Symmetry Recognition** | 5 | Explicitly connects the two cases: shows that expanding "motivation" to save Nadia threatens to validate Tom, and restricting it to block Tom threatens to invalidate Nadia. | Treating the cases in isolation (two mini-essays) without addressing the prompt's demand to hold them together as a tension. |
  | **4. Criterion of Agency** | 5 | Proposes a specific mechanism (e.g., endorsement, integratability, rational governance) that distinguishes Nadia's *receptivity* from Tom's *bypass*. | Offering a vague solution like "free will" or "morality" that doesn't explain the structural difference between the two psychological states. |
  | **5. Resolution** | 5 | Concludes with a nuanced verdict that affirms Nadia's reason and denies Tom's without collapsing into dogmatism (Externalism) or skepticism (Internalism). | Resolving the tension by simply picking a side (e.g., "Externalism is right") rather than synthesizing a view that handles the specific constraints of both characters. |

  **Grader's Note:** A strong pass (13-17) will identify the problems in Moves 1 and 2 but may struggle to link them in Move 3. A distinction (21+) will execute Move 4 with precision, showing *how* the proposed criterion works for both characters simultaneously, rather than just asserting it.
