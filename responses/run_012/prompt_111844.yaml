answer: |-
  Consider 'Veritas Fine Arts', a single facility housing two distinct divisions under one management structure. In the Restoration Wing, skilled conservators are hired on fixed salaries to repair clients' paintings using company-owned chemicals and tools; the firm charges clients a fee that exceeds the total cost of wages and materials, retaining the difference as profit, yet the conservators choose their own methods, work collaboratively in teams, and sign off on the finished pieces as their own work. In the Dispatch Wing, courier contractors own their own vans and retain the full delivery fee paid by clients, deducting only their fuel and maintenance costs, but their routes and drop-off times are dictated by a centralised algorithm that penalises delays, they rarely interact with recipients or each other, and they describe the work as a stressful necessity to cover loan repayments on their vehicles.

  **Analysis of Group 1: The Restorers**
  *   **Exploitation:** This group meets the technical criteria for exploitation. They do not own the means of production (the workshop and tools belong to Veritas); they sell their labour power for a wage; and the value they create (the restoration fee) exceeds the value of their wages and materials, with the surplus value appropriated by the firm as profit.
  *   **Alienation:** This group largely avoids alienation. They are not alienated from the *product*, as they see the restored art and sign it; not from the *process*, as they dictate their own methods; not from *species-being*, as the work utilises their creative capacities; and not from *other workers*, as they collaborate in teams.
  *   **Separating Feature:** The separating feature here is **craft autonomy within wage labour**. If this feature were removed—for instance, if the firm standardised the restoration techniques and forbade collaboration—the workers would become alienated from the process and their species-being, aligning their experience with their exploited status.

  **Analysis of Group 2: The Couriers**
  *   **Exploitation:** This group does not meet the technical criteria for exploitation. They own their means of production (the vans); they do not sell labour power but rather a service commodity; and they appropriate the full surplus value generated (the fee minus costs), rather than having it extracted by a capitalist.
  *   **Alienation:** This group suffers acute alienation. They are alienated from the *process*, which is controlled by an opaque algorithm; from the *product*, as the delivery is ephemeral and dictated by external demands; from *species-being*, as the work is experienced as a coerced means of survival; and from *other workers*, as they are isolated competitors.
  *   **Separating Feature:** The separating feature here is **nominal ownership under market coercion**. If this feature were removed—for instance, if the couriers were truly independent artisans setting their own routes and prices—their alienation would diminish. Conversely, if they were made wage labourers without changing the algorithmic control, they would become both alienated and exploited.

  **Marxist Defence and Evaluation**
  A defender of Marx might argue that these concepts cannot truly come apart because the couriers are subject to the 'real subsumption of labour'. Although legally independent, the algorithmic control renders them de facto wage labourers, meaning the market coercion they face is merely a disguised form of capitalist exploitation. Regarding the restorers, a defender might argue they remain alienated because the ultimate purpose of their labour is capital accumulation, not artistic expression, rendering their autonomy illusory.

  This reply succeeds only if one expands the definition of exploitation beyond the technical extraction of surplus value from wage labour to include broader forms of capitalist domination. If one adheres to Marx's technical definition in *Capital*, the thought experiment holds: property relations determine exploitation, while the labour process determines alienation. However, if one accepts the Marxist critique of 'formal independence', the separation collapses, suggesting that in mature capitalism, alienation and exploitation are functionally inseparable despite legal distinctions.
