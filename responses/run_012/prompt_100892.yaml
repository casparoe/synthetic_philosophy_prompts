answer: |-
  You have identified a precise and pernicious failure mode in human reasoning. You are correct that while the *components* of this phenomenon are well-documented, there is no single, canonical term in the rationalist or psychological lexicon that captures the specific *pipeline* you describe: **Range $\to$ Decision Point $\to$ Memory Loss $\to$ Hardened Belief $\to$ Biased Updating.**

  The nearest established concepts are **Reification** (treating an abstraction as a concrete fact), **False Precision** (presenting uncertain data as exact), and **Source Amnesia** (remembering the fact but forgetting the derivation). However, none of these quite capture the *causal role of the decision itself* in hardening the belief.

  Since you have asked for a name if one does not exist, I propose we call this **Decision-Induced Epistemic Reification** (or, more colloquially, **Credence Collapse**).

  Below is the breakdown of how this fits into the neighborhood of concepts you already know, the definition of the new term, and answers to your specific boundary questions.

  ### 1. The Neighborhood: Why existing terms miss the mark

  You correctly ruled out Dilation, Ambiguity Aversion, and Anchoring. Here is how *Credence Collapse* differs from the remaining nearest neighbors:

  *   **Reification (The Fallacy of Misplaced Concreteness):** This is the philosophical parent. Reification is treating a concept (like "the economy" or "intelligence") as a physical object. *Credence Collapse* is a specific subtype where the "concept" being reified is a **decision heuristic**. You are reifying the *tool you used to act* into the *truth of the world*.
  *   **False Precision:** This describes the *output* (claiming 55% when you meant 40–70%), but not the *mechanism*. False precision can happen via negligence or deception. *Credence Collapse* happens via the structural necessity of action.
  *   **Source Amnesia:** This explains why you forget the range, but not why the point estimate *hardens*. Source amnesia could just as easily lead to discarding the number. In *Credence Collapse*, the number gains *more* authority after the source is forgotten, not less.
  *   **Consistency Bias (Cialdini):** This explains why you defend the number after acting on it. However, Consistency Bias usually applies to *public* commitments. *Credence Collapse* happens internally, even when no one else sees the number.
  *   **Pragmatic Encroachment:** In epistemology, this is the thesis that practical stakes *rightly* affect whether we claim to "know" something. *Credence Collapse* is the *buggy psychological implementation* of this. It is not that the stakes change the knowledge; it is that the stakes change the *storage format* of the belief, and the format change is irreversible.

  ### 2. The Coinage: Decision-Induced Epistemic Reification

  **Definition:** The cognitive process by which a probabilistic range (a distribution of credence) is collapsed into a point estimate for the purpose of decision-making, after which the point estimate is stored in memory as a factual belief, severing the link to the original uncertainty and resisting future probabilistic updating.

  **The Mechanism:**
  1.  **Input:** Honest uncertainty (Distribution/Range).
  2.  **Compression:** A decision rule (e.g., minimax, expected value) requires a scalar input. A point is selected.
  3.  **Decoupling:** The action is taken. The context (the "why" of the number) is discarded as temporary scaffolding.
  4.  **Reification:** The scalar is stored in long-term memory as a "belief" rather than a "parameter."
  5.  **Lock-in:** Future evidence updates the scalar, not the distribution. The uncertainty cannot be recovered.

  ### 3. Boundary Conditions (Answering your specific questions)

  **Does it require that a decision actually be forced?**
  **No, but action accelerates it.**
  Merely *reporting* a summary (e.g., writing "55%" in a forecast log) can trigger the same effect. This is **Reporting-Induced Reification**. The act of externalizing the belief into a format that does not support ranges (a text field, a dashboard, a conversation) forces the collapse. However, *decisions* bind the number to *outcomes* (success/failure), which creates a feedback loop that reinforces the number's validity. If the project succeeds, you feel the 55% was "right," further hardening the belief.

  **Does it require forgetting, or can I watch myself do it and do it anyway?**
  **It does not require forgetting, but it requires a change in storage format.**
  You can be fully aware that 55% is arbitrary and still suffer from *Credence Collapse*. This is because human working memory and semantic memory are optimized for propositions ("X is true"), not distributions ("X is likely between Y and Z"). Even if you consciously remember "I made this up," the *emotional weight* and *cognitive availability* of the point estimate outweigh the metadata. You can watch yourself do it and be powerless to stop it unless you change the *medium* of your belief (see below). This is a **structural** limitation, not just a memory error.

  **Is the group version the same phenomenon?**
  **It is the same phenomenon, amplified by institutional mechanics.**
  In groups, this becomes **Institutional Reification**. When a range is collapsed for a meeting minute, a dashboard, or a contract, the number gains social reality. It becomes a "target" or a "commitment." The group dynamic adds **Pluralistic Ignorance**: everyone may privately hold the range, but assumes the public point estimate represents the group's actual belief. The "record" acts as an external hard drive that stores the reified point, making it impossible for future members of the group to recover the original uncertainty.

  **Is there a principled way to act on a range that does not manufacture belief?**
  **Yes, but it requires externalizing the distribution.**
  The manufacture is unavoidable if you rely on your brain's native storage. To avoid it, you must treat the *distribution* as the object of belief, not the point.
  1.  **Keep the Receipt:** Never store a point estimate without its confidence interval in any persistent medium (notes, logs, forecasts). If your system doesn't support ranges, do not write the number down.
  2.  **Tag the Provenance:** Explicitly label the number as `DECISION_PARAM` rather than `CREDENCE`. In code, you would use a variable name like `project_success_probability_for_calc` vs `project_success_belief`.
  3.  **Update the Distribution, Not the Point:** When new evidence arrives, force yourself to reconstruct the range *before* calculating the new point. If you cannot reconstruct the range, you must admit the belief is corrupted.
  4.  **Use Monte Carlo Thinking:** When acting, do not pick a point. Run a mental (or actual) simulation of the outcomes weighted by the range. Act on the *expected utility of the distribution*, not the *utility of the expected value*. This keeps the variance active in your mind during the decision.

  ### Summary
  You have identified a gap between **Bayesian Ideal** (beliefs are distributions) and **Human Architecture** (beliefs are propositions).

  The term is **Decision-Induced Epistemic Reification**.
  The cure is **Metadata Preservation**.
  The warning is: **The map does not just become the territory; the compass setting becomes the magnetic north.**
