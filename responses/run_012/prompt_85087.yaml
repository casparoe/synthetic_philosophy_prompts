          *   Standing is *graded* (two dimensions: authority to hold accountable vs. standing to be heard).
          *   *Reformed Wrongdoer Thesis:* Reformed wrongdoers often have *more* standing than blameless outsiders (inside knowledge makes address apt).
      *   **Interviewer's Goal:** Expose the position as "attractive and unstable." Accumulate pressure. Avoid softballs/bio questions.
      *   **Requirements:** 8-10 questions. Each needs a main question + a short follow-up (1-2 sentences) keyed to likely answers.
      *   **Specific Topics to Cover:**
          1.  Normative force of hypocrisy (wrong vs. ineffective/ignorable).
          2.  Nature of standing (permission, competence, etc.) & implications for blind/badly informed blamers.
          3.  Standing to blame vs. standing to forgive (relational machinery, third parties).
          4.  Graded standing + reciprocity $\rightarrow$ Subjectivism (standing = what blamed party accepts).
