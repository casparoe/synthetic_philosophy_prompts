answer: |-
  1. **The Normative Force of Hypocrisy**
  Your account locates the cost of hypocrisy in the exemption from mutual answerability, which explains why the hypocrite's blame might be *ineffective* or *dismissable*. But does this explain why hypocritical blame is often felt to be *wrong* in itself, rather than merely a failed speech act? If the only sanction is that the target need not listen, have you accounted for the moral residue we attribute to the hypocrite's act of blaming?

  *Follow-up:* If you insist the wrongness is real, does your view require a second-order norm to explain why exempting oneself is a violation, rather than just a pragmatic inconsistency?

  2. **The Metaphysics of Standing**
  You distinguish the authority to hold accountable from the standing to be heard, suggesting standing is graded. Is standing on your view best understood as a permission, a competence, or a distinct kind of normative power? If it is a competence, does lacking standing render the blame infelicitous, or does it simply mean the blamer has no right to exercise it?

  *Follow-up:* If it is a competence, then a blamer without standing is like a judge without jurisdiction; but if it is a permission, they are merely trespassing. Which failure do you think the target of blame experiences?

  3. **The Morally Blind Blamer**
  If standing is rooted in a practice of answerability rather than moral purity, does a blamer who is sincerely willing to accept criticism but is profoundly morally mistaken retain standing? Suppose someone blames a gay couple for marrying while insisting they are open to answerability; do they have standing on your view, provided they submit to the practice?

  *Follow-up:* If you say they lack standing due to the content of their view, aren't you reintroducing the moral record condition you sought to avoid?

  4. **The Reformed Wrongdoer and Autobiography**
  You argue the reformed wrongdoer often has *more* standing than the blameless outsider because their address is made apt by inside experience. Does this not make standing hostage to autobiography, implying that one must have sinned to possess the fullest authority to condemn that sin? How do you block the inference that moral purity is actually a deficit for standing?

  *Follow-up:* If a blameless person can never achieve the same aptness of address, have you inadvertently made moral innocence an epistemic handicap?

  5. **Distorted Inside Knowledge**
  Even granting that inside experience can enhance standing, how do you filter for cases where the wrongdoer's "reckoning" is self-serving or narratively distorted? If standing is graded by the quality of the answerability relation, does the blamer get to self-verify that their reckoning is genuine, or must the target validate it?

  *Follow-up:* If the target must validate it, doesn't this return us to the problem of the blamed party having veto power over the blamer's standing?

  6. **Standing to Forgive**
  Your machinery relies on a relational practice of mutual answerability; does this same machinery govern the standing to forgive? If standing to blame is graded by reciprocity, is the standing to forgive similarly graded by the wrongdoer's willingness to be forgiven, or is the asymmetry between blame and forgiveness preserved?

  *Follow-up:* If you preserve the asymmetry, what feature of the relational practice allows blame to require reciprocity while forgiveness does not?

  7. **Third-Party Forgiveness**
  On a relational view, third parties often lack the standing to blame because they are not party to the specific answerability relation. Does your view entail that third parties also lack the standing to forgive wrongs done to others? If a third party attempts to forgive, are they merely expressing hope, or are they making a normative error?

  *Follow-up:* If it is a normative error, how do you explain the intuitive legitimacy of collective forgiveness or amnesty granted by representatives?

  8. **The Subjectivism Collapse**
  You insist standing is graded and depends on a reciprocity condition within a practice. Is there a risk that this collapses into the claim that standing is simply whatever the blamed party is willing to entertain? If the blamed party refuses to enter a practice of mutual answerability, does the blamer lose standing entirely?

  *Follow-up:* If the answer is yes, then doesn't the bad faith of the wrongdoer successfully extinguish the victim's authority to hold them accountable?

  9. **The Stability of the Practice**
  You have argued that standing is not about the blamer's record but their location within a practice. If the previous questions suggest that location is either too dependent on the wrongdoer's uptake or too dependent on the blamer's autobiography, where does the stability of the practice actually reside? Is there a fact of the matter about standing that holds even when the participants disagree about the terms of their answerability?

  *Follow-up:* If there is no such fact, are we left with a pragmatic standoff rather than a normative account of standing?

  10. **Repair and Reconstruction**
  We have pressed on several points where your view risks instability—specifically regarding the normativity of hypocrisy, the privilege of the reformed sinner, and the potential for subjectivism. If you could revise one element of the position to secure it against these pressures without abandoning the core insight about mutual answerability, which constraint would you loosen?

  *Follow-up:* Would you sacrifice the graded nature of standing to secure its objectivity, or sacrifice the objectivity to preserve the nuance of the graded view?
