answer: |-
  Based on the seminar record provided, here is an analysis of the supervisor's methodological machinery, the candidate rules derived from her verdicts, and a prediction for the new book.

  ### 1. Candidate Rules and Predictions

  Three plausible rules emerge from the supervisor's past verdicts. Each interprets the boundary between 'objective history' and 'history but not objective' differently.

  **Rule A: The Evidentiary Integrity Rule**
  *   **Definition:** Objectivity is determined solely by the handling of the evidence base ("the floor"). A work is objective if it uses corroborated sources, suppresses no relevant evidence, and leaves claims open to correction. The "ceiling" (interpretation, narrative form, present-day purpose) is permissible provided it does not distort the floor.
  *   **Prediction for New Book:** **'Objective history'.** The book uses sound archives (parish registers), suppresses no evidence, and remains analytically disciplined. The tragic form and present-day choice are merely "ceilings," which the supervisor explicitly permits ("build its own ceiling").

  **Rule B: The Anti-Advocacy Rule**
  *   **Definition:** Objectivity is compromised by political or moral activism. A work is objective if it informs or reconstructs, but not if it demands action, assigns moral blame, or adopts a genre that inherently argues for a moral conclusion (e.g., Romance or Tragedy).
  *   **Prediction for New Book:** **'History but not objective'.** While the evidence is sound, the choice of "Tragedy" is a moral/aesthetic framing "for the present." Unlike Case 3 (which sought to *inform* relief), a Tragedy imposes a moral structure on suffering. Even without assigning blame, the genre itself functions as advocacy for a specific moral worldview.

  **Rule C: The Source Hierarchy Rule**
  *   **Definition:** Objectivity is contingent on the *type* of source material. Archival/written records allow for objectivity; oral testimony (uncorroborated) or formal models do not.
  *   **Prediction for New Book:** **'Objective history'.** The book relies on parish registers and administrative correspondence (same as Case 3), placing it firmly in the "Objective" category regardless of its narrative form.

  ### 2. Rules Ruled Out by the Record

  The supervisor's previous verdicts definitively eliminate several common methodological assumptions:

  *   **The "No Presentism" Rule:** *Ruled out by Case 3.*
      *   *Hypothesis:* History cannot be written to serve present-day needs.
      *   *Refutation:* Case 3 (Famine/Quant) explicitly states it is written to "inform present-day famine relief" yet is verdicted 'objective history'. Therefore, present-day utility is not a disqualifier.
  *   **The "Voiceless Narrator" Rule:** *Ruled out by Case 2 and the "Ceiling" Quote.*
      *   *Hypothesis:* The author must remove their voice and inferences to be objective.
      *   *Refutation:* Case 2 (Microhistory) is 'objective' despite the author setting out inferences. The supervisor's phrase ("build its own ceiling") explicitly endorses authorial interpretation superimposed on evidence.
  *   **The "Genre Prohibition" Rule (Strong Version):** *Ruled out by Case 5.*
      *   *Hypothesis:* Narrative genres (like Romance) are inherently non-objective.
      *   *Refutation:* Case 5 was 'not objective' not simply because it was a "heroic romance," but because it "minimizes the counter-revolutionary testimony." This implies the *distortion of evidence* to fit the genre was the crime, not the genre itself.

  ### 3. Best Guess and Reasoning

  **Verdict:** **'Objective history'**

  **Reasoning:**
  The supervisor's methodology appears to be a form of **Critical Realism**, best summarized by her "floor and ceiling" aphorism. She distinguishes between the *empirical constraints* of the archive (the floor) and the *interpretive construction* of the historian (the ceiling).

  1.  **The Floor is Solid:** The new book uses the same sources as Case 3 (which was 'objective') and explicitly avoids the evidentiary sins of Case 4 (uncorroborated oral testimony) and Case 5 (suppression of testimony). The phrase "no claim insulated from correction" signals high epistemic humility, aligning with Case 2.
  2.  **The Ceiling is Permitted:** The supervisor has already ruled that present-day aims (Case 3) and authorial inferences (Case 2) are compatible with objectivity. The "Tragic form" is an interpretive superstructure. As long as it does not require the suppression of evidence (unlike Case 5's Romance), it should be accepted as a valid "ceiling."
  3.  **The "Blame" Distinction:** The new book "pointedly declines to assign blame." This is a crucial safeguard. Case 4 ('not objective') combined weak sources with a demand for reparations and a genocide label. Case 5 ('not objective') arranged facts to culminate in liberation. By declining blame, the author avoids the political activation that seems to trigger the 'not objective' verdict when combined with interpretive framing.

  The new book is essentially **Case 3 (Famine/Archives/Present Aim) + Case 2 (Marked Inferences) - Case 4 (Demands/Blame).** Since Case 3 established that present-day purpose does not negate objectivity, the shift from "Quantitative Study" to "Tragedy" should not negate it either, provided the evidentiary integrity remains intact.

  ### 4. The Separating Case

  To distinguish between **Rule A (Evidentiary Integrity)** and **Rule B (Anti-Advocacy/Moral Neutrality)**, the following case would be most revealing:

  **The Case:** A study of a nineteenth-century famine built from the same parish registers, analytically disciplined with no evidence suppressed, which concludes explicitly that **"the government's negligence constituted a moral crime,"** but makes no demand for reparations or policy change.

  *   **If the verdict is 'Objective history':** It confirms **Rule A**. Moral judgment is part of the permissible "ceiling" as long as the "floor" (evidence) is not distorted to support it. The "Tragedy" in the new book is safe.
  *   **If the verdict is 'History but not objective':** It confirms **Rule B**. Historians may inform (Case 3) or reconstruct (Case 1), but they may not pronounce moral judgment (Crime/Tragedy), even if the evidence supports it. This would suggest the new book's "Tragic form" might actually be at risk, and the supervisor tolerated it only because blame was declined.

  This case isolates whether the supervisor's barrier is **distortion of fact** (Rule A) or **presumption of moral authority** (Rule B).
