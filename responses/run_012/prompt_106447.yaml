answer: |-
  Your friend was right. The cluster of difficulties you have encountered is indeed one of the most famous and enduring problems in artificial intelligence and the philosophy of mind. The canonical name for the family of troubles is **The Frame Problem**.

  However, your intuition that it might be "one thing or three" is also correct. In the technical literature, the term "Frame Problem" is used in two ways: narrowly, to describe exactly your first difficulty, and broadly, as an umbrella term for all three. The other two difficulties have their own specific names: **The Qualification Problem** and **The Ramification Problem**.

  Here is the concrete breakdown of the names, the boundaries, and the reach of the phenomenon you are wrestling with.

  ### 1. The Triad of Problems

  You have independently rediscovered the three pillars of action theory in AI. Here is how your headaches map to the established terminology:

  **A. The Frame Problem (Your First Headache)**
  *   **Your description:** "Nothing in the system tells it which of the thousands of facts it is holding should be carried over untouched... every new sensor adds labour to every rule I have already written."
  *   **The Definition:** This is the problem of **persistence**. In formal logic, if you state that an action changes *X*, the system does not automatically assume that *Y* and *Z* remain unchanged. To make the system understand that opening the front door does not change the colour of the walls, you historically had to write explicit "frame axioms" for every fact that *doesn't* change.
  *   **Why it fits:** You are struggling with inertia. You want the system to assume the world stays the same unless told otherwise, but standard logic requires you to prove what stays the same.

  **B. The Qualification Problem (Your Second Headache)**
  *   **Your description:** "I can never state when a rule is supposed to fire without listing an absurd number of conditions... the list never ends."
  *   **The Definition:** This is the problem of **preconditions**. It was named by John McCarthy (who also coined the Frame Problem) in 1977. It refers to the impossibility of listing all the necessary conditions required for an action to succeed. To state "turning the key starts the car," you must qualify it with "unless the battery is dead," "unless there is no fuel," "unless the starter is broken," "unless the laws of physics have changed," etc.
  *   **Why it fits:** You noted this feels "quite different from the other two." You are correct. While the Frame Problem is about what happens *after* an action, the Qualification Problem is about what must be true *before* an action.

  **C. The Ramification Problem (Your Third Headache)**
  *   **Your description:** "Any action has consequences I did not ask for and did not foresee... the heater raises the temperature, which shuts off the cooling... and I learn about it only by watching it happen."
  *   **The Definition:** This is the problem of **indirect effects**. It concerns the cascade of consequences that follow from an action, which are not explicitly stated in the action's definition.
  *   **Why it fits:** Your system lacks a causal model. It sees events as isolated switches rather than nodes in a causal network. When the heater triggers a temperature change, that is a direct effect; when the temperature change triggers the AC, that is a ramification.

  ### 2. Is It One Trouble or Three?

  Philosophically and computationally, they are treated as **distinct but deeply entangled facets of the same underlying issue: Common-Sense Reasoning.**

  They are distinct because they attack the representation of action from different temporal directions:
  *   **Qualification:** Looks backward (What must be true to act?).
  *   **Frame:** Looks sideways (What remains true while acting?).
  *   **Ramification:** Looks forward (What else becomes true because I acted?).

  However, they are bundled under "The Frame Problem" in broader discourse because they all stem from the same limitation of classical logic: **Monotonicity.** In classical logic, once a fact is true, it remains true forever unless explicitly negated. The real world is **non-monotonic**; new information (a sensor trigger) can invalidate old assumptions (the room is cold). All three problems are attempts to manage non-monotonic reasoning without drowning in exceptions.

  ### 3. Scope: Machine Planning vs. Human Belief

  You asked how far the thing is meant to reach. It is not merely a quirk of programs; it is a fundamental problem of **epistemology** (how we know things) and **cognitive science**.

  *   **In AI:** It is a representational crisis. How do we encode knowledge so a computer can reason efficiently without checking every fact in its database against every action?
  *   **In Human Cognition:** It is known as the problem of **relevance**. As the philosopher Daniel Dennett famously illustrated in his essay *Cognitive Wheels*, if a robot is tasked with fetching a battery from a room with a bomb, it might spend hours calculating that moving the battery won't change the colour of the walls or the number of times the wheels have turned. Humans, by contrast, instinctively ignore irrelevant facts. We have a "frame" of relevance that filters out the noise.

  The reason your friend remembered it from philosophy is that the Frame Problem suggests human intelligence is not just about processing power, but about an intuitive, pre-logical grasp of **salience**. We know implicitly which facts are "frameable" (likely to persist) and which are "volatile."

  ### 4. Boundaries: What It Is Not

  You instinctively felt this is not simply "reasoning from incomplete information." You are right. Here is the boundary:

  *   **Incomplete Information (Uncertainty):** This is when you do not know the state of the world (e.g., "I don't know if the window is open"). This is handled by probability and belief states.
  *   **The Frame/Qualification Cluster:** This is when you *do* know the state, but you cannot efficiently manage the **implications of change**.
      *   *Example:* Even if you know the window is closed, the power is on, and the heater works (no incomplete information), you still face the **Qualification Problem** because you cannot list every possible exception (e.g., a solar flare disrupts the circuit).
      *   *Example:* Even if you know the heater is on, you face the **Frame Problem** because you cannot explicitly store the fact that "the heater being on does not turn the Wi-Fi off" for every single device in your house.

  The core phenomenon is not about *missing data*; it is about **computational tractability of relevance**. It is the difficulty of distinguishing signal from noise in a causal chain without checking every possible connection.

  ### 5. The Specific Name for the "Endless List"

  You asked for a standard term for the part described as the "endless list of conditions." That is specifically **The Qualification Problem**.

  In academic papers, if you wish to refer to that specific headache without invoking the broader Frame Problem, "Qualification Problem" is the precise term. It is often cited as the reason why expert systems failed in the 1980s: they could not handle the sheer volume of exceptions required to make rules robust in the real world.

  ### Summary for Your Tinkering

  To give you the concrete labels you requested:

  1.  **The Family Name:** The Frame Problem (in the broad sense).
  2.  **Headache 1 (Persistence):** The Frame Problem (in the narrow sense).
  3.  **Headache 2 (Preconditions):** The Qualification Problem.
  4.  **Headache 3 (Side Effects):** The Ramification Problem.

  **Why this matters for your code:**
  You are likely trying to solve these with imperative logic (If X then Y). The field of AI suggests that to mitigate these problems, you need to move toward **State Machines** or **Ontologies** that separate *state* from *events*.
  *   To solve the **Frame** issue: Use a system that assumes persistence by default (e.g., Event Calculus or Situation Calculus).
  *   To solve the **Qualification** issue: Accept that rules are defeasible (open to exception) and use "default logic" rather than hard constraints.
  *   To solve the **Ramification** issue: You need a causal model, not just a rule list. If the heater turns on, it should publish a "Temperature Rising" event, which other rules subscribe to, rather than the heater rule directly trying to manage the AC.

  Your friend was right: you have bumped up against the wall that has defined AI research for fifty years. The fact that you found it in a home-automation script is a testament to how fundamental these issues are to any system that attempts to model a changing world.
