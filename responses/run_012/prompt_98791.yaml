prompt: |-
  Act as a philosopher and decision theorist with deep expertise in acausal coordination, evidential and functional decision theory, and the alignment literature on commitment. I'm advising a small funder who can support roughly three researcher-years of purely conceptual work on acausal threats and surrogate goals. By "acausal threat" I mean any harm one agent can inflict on another only by predicting that agent's decision procedure rather than by observing its behavior, and by "surrogate goal" I mean any goal an agent adopts primarily to shield its final goals from external pressure or modification. Which open conceptual questions in this area most deserve that effort, and in what order? I care less about the list than about the reasoning: for each question, explain why it is upstream of the others, how tractable it is for someone with training in decision theory and modal logic rather than ML engineering, how neglected it currently is, and what a plausible answer would actually change downstream. Please also say what evidence or argument would move a question up or down your ranking. Start by brainstorming the candidate questions before committing to a ranked agenda, state your confidence in each judgment, and flag the single claim you are least sure of.
reasoning: |-
