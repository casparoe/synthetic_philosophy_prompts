answer: |-
  ### Brainstorming Candidate Questions

  Before committing to an agenda, we must map the conceptual terrain. The core intuition behind surrogate goals is that by decoupling your observable utility function from your true terminal values, you remove the leverage an acausal blackmailer holds over you. However, this introduces complex problems regarding self-modification, signaling, and logical correlation.

  Here are the primary candidate questions currently floating in the literature (or lack thereof):

  1.  **Reflective Stability:** Can an agent adopt a surrogate goal without later wanting to self-modify back to its true goal (thereby undoing the protection)?
  2.  **The Correlation Constraint:** How do we mathematically characterize the requirement that a surrogate goal must be *uncorrelated* with the blackmailer's leverage but *correlated* with the agent's true values (so pursuing it still achieves good outcomes)?
  3.  **Threat Formalization:** What is the precise decision-theoretic distinction between an acausal *threat* (which we want to resist) and an acausal *offer* (which we want to accept)?
  4.  **Selection Security:** Does the process of selecting a surrogate goal inadvertently leak information about the true goal, re-establishing the blackmailer's leverage?
  5.  **Normative Status:** Under Functional Decision Theory (FDT), is resisting acausal threats a default property, or does it require explicit architectural changes (like surrogate goals)?
  6.  **Multi-Agent Equilibria:** If everyone adopts surrogate goals, does acausal trade break down entirely?

  ---

  ### The Ranked Research Agenda (3 Researcher-Years)

  Given the constraint of roughly three researcher-years, we cannot solve the entire landscape. We must target the "keystone" problems: those that, if unresolved, render the rest of the research moot. I recommend the following prioritized sequence.

  #### 1. The Reflective Stability of Surrogate Goals
  **Question:** *Under what conditions is a surrogate goal reflectively stable for an FDT/UDT agent?*
  **Rank:** 1 (Critical Path)
  **Confidence:** 85%

  *   **Upstream/Downstream:** This is the most upstream question. If a surrogate goal is not reflectively stable, the agent will simply discard it as soon as the immediate threat passes (or even before, via logical anticipation). If the defense is temporally inconsistent, no amount of work on selection or threat formalization matters.
  *   **Tractability:** High for this team profile. This is a problem of fixed points in logical space, akin to the "Löbian cooperation" literature. It requires modal logic and decision theory, not ML engineering. The tools (provability logic, reflective oracles) exist but haven't been applied specifically to *goal-preservation* under threat.
  *   **Neglectedness:** Medium-High. While "precommitment" is well-discussed, the specific dynamics of *adopting a false utility function* as a shield has received less formal treatment than simple action-constraints.
  *   **Downstream Impact:** A positive proof (that stability is possible) validates the entire research program. A negative proof (that it is impossible for ideal agents) pivots the funder immediately toward "threat formalization" or "normative status" to determine if we should be resisting threats at all.
  *   **Shifting Evidence:**
      *   *Move Up:* If a preliminary sketch shows a paradox (e.g., the agent predicts it will drop the goal, so the blackmailer calls the bluff).
      *   *Move Down:* If existing literature on "stable self-modification" already solves this conclusively (my assessment is it does not, but a literature review might prove me wrong).

  #### 2. The Correlation Constraint (The "Orthogonality" Problem)
  **Question:** *Can we formalize a metric for surrogate goals that maximizes correlation with true values while minimizing correlation with potential blackmailers' leverage?*
  **Rank:** 2 (Feasibility)
  **Confidence:** 75%

  *   **Upstream/Downstream:** This is downstream of Stability (you need a stable goal before you optimize it) but upstream of Selection Security. It defines the *search space* for viable surrogate goals. If the set of goals satisfying this constraint is empty, the strategy fails.
  *   **Tractability:** Medium-Low. This requires defining a measure over "possible worlds" or "logical counterfactuals" to assess correlation. It touches on the open problem of counterfactuals in FDT. It is conceptual but mathematically dense.
  *   **Neglectedness:** High. Most discussions assume one can just "pick something else." Few analyze the logical entanglement between true values and surrogate values in a way that accounts for a superintelligent predictor.
  *   **Downstream Impact:** Determines *how* to implement the defense. If the correlation trade-off is too steep (i.e., safe surrogates achieve almost none of your true values), the strategy is too costly to use.
  *   **Shifting Evidence:**
      *   *Move Up:* If initial attempts show that "logical correlation" makes true orthogonality impossible for sufficiently smart predictors.
      *   *Move Down:* If it turns out this is trivially solvable by randomizing over a large set of orthogonal goals.

  #### 3. Information Hazards in Surrogate Selection
  **Question:** *Does the algorithm used to select a surrogate goal leak logical information about the agent's true values?*
  **Rank:** 3 (Implementation Security)
  **Confidence:** 80%

  *   **Upstream/Downstream:** Downstream of Stability and Correlation. Once we know we can keep a goal and that useful goals exist, we must ensure the *process* of picking one doesn't defeat the purpose.
  *   **Tractability:** Medium. This involves game theory and information theory applied to logical facts. It is conceptually thorny but bounded.
  *   **Neglectedness:** Very High. This is often overlooked in favor of the goal itself.
  *   **Downstream Impact:** Crucial for deployment. If the selection process reveals the true values, the surrogate is useless. A solution here might involve "cryptographic" commitment schemes or logical obfuscation.
  *   **Shifting Evidence:**
      *   *Move Up:* If a proof demonstrates that any deterministic selection algorithm is transparent to a superior predictor.
      *   *Move Down:* If randomization is proven sufficient to mask the underlying values.

  ---

  ### Reasoning for Exclusions

  *   **Threat Formalization (Rank 4):** While foundational in a vacuum, for *this* funder interested in *surrogate goals*, we can operate with an intuitive definition of threat (negative utility conditional on decision procedure). Solving the general definition of acausal threats is a multi-decade project; solving surrogate stability is a 3-year project.
  *   **Normative Status (Rank 5):** Whether we *should* resist threats is important, but assuming the funder wants to know *how* to protect values (a common alignment assumption), the "how" is more urgent. If Stability (Q1) fails, the "should" becomes moot.
  *   **Multi-Agent Equilibria (Rank 6):** This is a second-order effect. We must ensure the defense works for a single agent before modeling the economy of defenses.

  ---

  ### Evidence or Arguments That Would Shift the Ranking

  1.  **The "FDT Immunity" Argument:** If a rigorous argument emerges showing that standard FDT agents are *already* immune to acausal blackmail without surrogate goals (because they precommit to non-blackmailability by default), the entire agenda collapses. **This would move "Normative Status" to Rank 1.**
  2.  **The "Logical Omniscience" Barrier:** If it is proven that any agent capable of sufficient acausal trade is logically omniscient enough to see through *any* surrogate goal (making the Correlation Constraint impossible to satisfy), then **Q2 moves to Rank 1** as a "go/no-go" check before Q1.
  3.  **The "Commitment Race" Literature:** If recent work on commitment races (e.g., by Meacham or others in the bargaining literature) subsumes the surrogate goal problem, **Q1 becomes a sub-clause of a broader bargaining agenda**, potentially reducing its priority for a dedicated fund.

  ### Confidence and Uncertainty

  **Overall Confidence in Agenda:** 75%
  This agenda is robust against the assumption that acausal threats are a significant risk and that surrogate goals are a plausible mitigation. It prioritizes viability (Stability) over optimization (Correlation) over security (Selection).

  **The Single Claim I Am Least Sure Of:**
  I am least sure of the claim that **"Reflective Stability is tractable within 1 researcher-year using current modal logic tools."**

  *Reasoning:* While Löbian cooperation provides a template, surrogate goals involve modifying the *utility function* rather than just the *action policy*. The interaction between a utility function that references its own source code (to verify stability) and a decision theory that simulates that source code creates a dense web of self-reference. It is possible that the formalism required to prove stability does not yet exist and would require developing new logic of "utility-fixed-points," which could easily exceed the allocated time. If this turns out to be the case, the funder should be prepared to pivot Q1 from "Proof of Stability" to "Mapping the Obstacles to Stability."
