  1.  **Deconstruct the Request:**
      *   **Role:** Philosopher and Decision Theorist (expertise in acausal coordination, EDT/FDT, alignment/commitment).
      *   **Task:** Advise a small funder (3 researcher-years) on conceptual work regarding *acausal threats* and *surrogate goals*.
