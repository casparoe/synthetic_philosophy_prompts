  # DECISION TREE: LOGICAL SPACE OF CAUSE PRIORITIZATION

  **START:** **1. Is this framework for Cause-level (broad areas) or Intervention-level (specific actions) decisions?**
  │
  ├─ **Intervention-level** ──► *Tractability becomes dominant.* ──► **Q2: Is Tractability a screen (constraint) or full criterion?**
  │   │
  │   ├─ **Screen** (Must be solvable) ──► **Q3: Moral Uncertainty?**
  │   │   ├─ **Portfolio** ──► **ROBUST PORTFOLIO DIVERSIFICATION**
  │   │   │   *Hedges across moral theories.*
  │   │   │   *Awkward Commitment: May fund mutually incompatible interventions.*
  │   │   └─ **Expected Value** ──► **TRACTABILITY-FIRST (LOW-HANGING FRUIT)**
  │   │       *Prioritizes solvable problems.*
  │   │       *Awkward Commitment: May abandon crucial unsolved problems.*
  │   │
  │   └─ **Full Criterion** ──► **Q4: Urgency/Worst-off separate role?**
  │       ├─ **Yes** (Lexical Priority) ──► **PRIORITARIAN OR URGENCY-FIRST**
  │       │   *Prioritizes immediate suffering.*
  │       │   *Awkward Commitment: May sacrifice long-term existential security.*
  │       └─ **No** (Integrated) ──► **PROCESS-BASED / DELIBERATIVE**
  │           *Refuses a single ranking.*
  │           *Awkward Commitment: Cannot justify overriding consensus with calculation.*
  │
  └─ **Cause-level** ──► *Importance becomes dominant.* ──► **Q5: Is Importance lexical or commensurable?**
      │
      ├─ **Lexical** (No trade-offs) ──► **Q6: Role of Tractability?**
      │   ├─ **Tiebreaker** ──► **LEXICAL IMPORTANCE WITH TRACTABILITY TIEBREAKER**
      │   │   *Maximizes scale regardless of cost.*
      │   │   *Awkward Commitment: Must ignore easy wins in smaller causes.*
      │   └─ **Full Criterion** ──► *[Unoccupied: Incoherent]* (See Key)
      │
      └─ **Commensurable** (Trade-offs allowed) ──► **Q7: Neglectedness role?**
          │
          ├─ **Screen** (Marginal Value/Counterfactual) ──► **NEGLECTEDNESS-FIRST**
          │   *Follows room for funding.*
          │   *Awkward Commitment: May ignore high-impact crowded fields.*
          │
          └─ **Proxy/Weighted** ──► **Q8: Moral Uncertainty?**
              │
              ├─ **Portfolio** ──► **ROBUST PORTFOLIO DIVERSIFICATION**
              │   *(See above leaf)*
              │
              └─ **Expected Value** ──► **Q9: Are criteria explicitly weighted?**
                  │
                  ├─ **Yes** (Scorecard) ──► **STANDARD ITN SCORECARD**
                  │   *Balances three factors.*
                  │   *Awkward Commitment: Arbitrary weighting between criteria.*
                  │
                  └─ **No** (Subsumed in EV) ──► **NAIVE EXPECTED-VALUE MAXIMIZATION**
                      *Maximizes raw impact.*
                      *Awkward Commitment: Vulnerable to Pascal's mugging and crowded fields.*

  ***

  ### KEY & LOGICAL LIMITS

  **Unoccupied Combinations**
  *   **Lexical Importance + Tractability as Full Criterion:** *Incoherent.* If Importance is lexical (no compensation possible), Tractability cannot trade off against it as a full criterion.
  *   **Neglectedness as Screen + Naive EV:** *Incoherent.* A screen rules causes in/out; Naive EV ranks all causes by a single metric without binary filters.
  *   **Moral Uncertainty Side-Constraint + Naive EV:** *Unattractive.* A side-constraint limits maximization, contradicting the "Naive" maximization premise.

  **Indistinguishable Leaves**
  *   **Standard ITN Scorecard vs. Naive Expected-Value:** The tree separates them by explicit weighting (Q9), but in practice, implicit weights in Naive EV can mimic ITN.
      *   *Further Question Needed:* "Are the criteria (Importance, Tractability, Neglectedness) explicitly decomposed and scored before aggregation?"
  *   **Robust Portfolio vs. Process-Based:** Both reject a single theory's ranking.
      *   *Further Question Needed:* "Is the goal to maximize expected value across theories (Portfolio) or to facilitate deliberation without aggregation (Process)?"

  **Stipulative Definitions Applied**
  *   **Lexical:** Defined as no amount of improvement on other criteria compensating for loss.
  *   **Screen:** Defined as ruling causes in/out without ranking.
  *   **Counterfactual Neglect:** Defined as resources not absorbed by existing actors/marginal value > existing achievement.
  *   **Cause/Intervention Level:** Distinguishes ranking broad areas vs. specific actions.
