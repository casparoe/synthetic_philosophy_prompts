prompt: |-
  I want your honest credence in a philosophical thesis, and I want the number arrived at rather than asserted, with the derivation laid out so I can see where it is weakest. The thesis, stated as tightly as I can manage it, is this: there is no possible agent for whom knowing how to do something is exhausted by the true propositions it grasps — no agent could be carried from maximal propositional knowledge about an activity, however finely described, to knowing how to perform it by inference or description alone, because the transition always requires something practical that the propositions do not contain. Call this the irreducibility thesis. I put myself at about 0.6 and a colleague whose judgment I respect at about 0.25, and I am less interested in who is right than in whether we are even disagreeing about the same thing.

  Please give me your own number, then decompose it. The terms I would want to see separated, though you should add or merge as you think the question actually demands, are these. First, the regress that Ryle made central: any account of intelligent performance as the following of a rule regenerates the very same demand one level up, at the level of knowing how to apply the rule — how likely is that argument to be sound, rather than an artifact of how the intellectualist is imagined to describe performance? Second, the ability condition: whether a sentence like she knows how to do it but cannot do it is a semantic contradiction or merely a strange thing to say, that is, whether knowing how entails ability as a matter of meaning or only conversationally suggests it. Third, the empirical seam — implicit skill, motor learning that outruns articulable representation, non-linguistic animals, and one case I would like you to place explicitly. Suppose a patient's hand is moved correctly by an implanted device that consults a stored procedure: with the device on she reliably performs the action, with it off she cannot, and she can say nothing about how it is done. Does she know how? Call this the borrowed hand, and tell me what it does to your probability. Fourth, the intellectualist's escape route, of the sort associated with Stanley and Williamson: know-how as knowledge of a way under a practical mode of presentation — is that a genuine reduction or a relabeling that quietly assumes the practical element it claims to explain away? Fifth, whether the whole dispute is verbal, or at least context-sensitive, so that there is no single fact of the matter to assign a probability to at all.

  Then combine the terms into your final number and tell me which one the number is most sensitive to — which single shift would move it most — and what evidence or argument would actually shift it, as opposed to what would merely make the question feel different. Finally, say where the disagreement most plausibly lives between someone at 0.6 and someone at 0.25: is it the regress, the ability condition, the empirical cases, the mode-of-presentation maneuver, or the suspicion that the question is verbal?

  Write this as continuous prose, the way you would write it in an email to a colleague. No headings, no bullet points, no bold text, no tables — just paragraphs.
