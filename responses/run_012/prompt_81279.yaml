answer: |-
  Dear colleague,

  Thanks for sending this over. It is a sharp formulation of the problem, and I appreciate the invitation to be precise about where I stand rather than just gesturing at intuitions. After working through the components you laid out, my credence in the irreducibility thesis is 0.57. I arrived at this number by treating the five terms you specified as weighted lines of evidence that update a neutral prior, then discounting the result for the possibility that the dispute is merely verbal. I will walk you through the derivation so you can see which levers are doing the work and where the weak points are.

  I started with a prior of 0.5, assuming agnosticism before weighing the specific arguments. The first term is Ryle's regress. I assign a probability of 0.7 that the regress is sound rather than an artifact of intellectualist caricature. While intellectualists have developed sophisticated stops for the regress, the demand for a prior act of contemplation before intelligent performance does seem to misdescribe the phenomenology of skilled action, which pushes me toward irreducibility. However, I do not weight this heavily, perhaps 0.15 of the total substantive weight, because the regress is largely dialectical and modern intellectualists claim to have bypassed it without denying the phenomenology. The second term is the ability condition. Here I am more neutral, assigning a 0.5 probability that knowing how entails ability as a matter of meaning rather than conversational implicature. The paralysis cases are stubborn; one can know how to swim while being unable to move, which suggests ability is not strictly constitutive, so this term does little to move my needle toward irreducibility. I give this term a weight of 0.15 as well, since it often turns on semantic intuitions that vary across contexts.

  The third term is the empirical seam, including the borrowed hand case you specified. This carries more weight for me, about 0.35 of the substantive total. In the borrowed hand scenario, where a patient relies on an implanted device to move correctly but lacks internal access to the procedure, my intuition is that she does not know how. This suggests that know-how requires an internal state of the agent, not just reliable output. Since motor learning and non-linguistic animal behavior suggest this internal state is often non-propositional and inaccessible to speech, I assign a 0.7 probability that this empirical evidence supports irreducibility. The fourth term is the intellectualist escape route, specifically the Stanley and Williamson maneuver regarding practical modes of presentation. I assign a 0.6 probability that this is merely relabeling rather than a genuine reduction. It feels like positing a black box that solves the problem by definition, but because it is logically coherent, I cannot rule it out entirely. This term also carries a weight of 0.35. If you calculate the weighted average of these four substantive terms, you get 0.635. This represents my credence assuming the question is metaphysically robust.

  The fifth term is the suspicion that the dispute is verbal or context-sensitive. I assign a 0.9 probability that there is a single fact of the matter, meaning there is a 0.1 risk that the whole question dissolves under semantic scrutiny. I apply this as a discount factor to the substantive score. Multiplying 0.635 by 0.9 gives 0.5715, which I round to 0.57. The weakest link in this derivation is clearly the assessment of the intellectualist escape route. If the practical mode of presentation can be rigorously defined without covertly assuming the practical element it aims to explain, my credence in irreducibility would drop significantly. Conversely, if it is shown to be purely stipulative, my credence would rise. The empirical seam is the second weakest point, as neuroscience could theoretically reveal propositional structures in motor cortex activity that we currently lack the vocabulary to describe, though I find that unlikely.

  Regarding sensitivity, the single shift that would move my number most is a successful formalization of the practical mode of presentation. If someone could demonstrate exactly how a proposition is grasped practically without collapsing into a dispositional state, the intellectualist case would become dominant, likely dragging my credence down toward 0.3. Mere philosophical argumentation will not shift this; what would actually shift it is a formal semantic model that survives the charge of relabeling, or neuroscientific evidence showing that motor schemas are structurally isomorphic to propositional attitudes. Evidence that merely makes the question feel different, such as new introspective reports about skill acquisition, would not move the number because both sides can accommodate phenomenology.

  Finally, regarding the disagreement between you at 0.6 and your colleague at 0.25, I suspect the divergence lives primarily in the assessment of the intellectualist escape route and the empirical seam. Your colleague likely assigns a much higher probability to the success of the Stanley and Williamson maneuver, perhaps viewing the practical mode of presentation as a genuine solution rather than a relabeling, which would drastically lower their credence in irreducibility. They may also interpret the empirical data, including cases like the borrowed hand, as compatible with sub-personal propositional storage, whereas you and I see them as evidence of non-propositional states. It is less likely that you disagree on the regress, as that is older ground, or on the verbal dispute condition, unless your colleague thinks the question is largely meaningless. The gap is essentially about whether the intellectualist has successfully naturalized the practical without eliminating it, and I find myself sitting slightly closer to you, though with enough reservation about the escape route to keep me from going higher than 0.57.

  Best wishes,

  Your colleague
