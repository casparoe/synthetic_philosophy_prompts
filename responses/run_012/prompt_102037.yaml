answer: |-
  **Examination Question**

  **Question 1 (20 Marks)**

  Consider the six-stage Centipede Game defined below. Row moves at stages 1, 3, 5; Column moves at stages 2, 4, 6. At any stage, the player may **Stop** (ending the game with the listed payoffs) or **Continue** (passing play to the next stage). If both Continue through stage 6, payoffs are (5, 5).

  *   **Stage 1 (Row):** Stop (1, 0)
  *   **Stage 2 (Column):** Stop (0, 2)
  *   **Stage 3 (Row):** Stop (3, 1)
  *   **Stage 4 (Column):** Stop (2, 4)
  *   **Stage 5 (Row):** Stop (5, 3)
  *   **Stage 6 (Column):** Stop (4, 6)
  *   **All Continue:** (5, 5)

  Assume both players are instrumentally rational and seek to maximize their own monetary payoff.

  (a) Derive the unique Subgame Perfect Equilibrium (SPE) outcome using backward induction.
  (b) The SPE outcome is Pareto-dominated by the outcome of mutual cooperation. However, standard game theory rejects cooperation as irrational. Explain precisely which epistemic assumption is required to sustain the backward-induction argument, and why that assumption becomes problematic at information sets that the equilibrium predicts will not be reached.
  (c) Consequently, explain why the cooperative path cannot be an equilibrium in this complete-information setting, and identify what specific structural or epistemic modification would be required to make cooperation rationalizable without altering the players' utility functions.

  ***

  **Model Answer**

  (a) **Backward Induction Derivation**
  At Stage 6, Column compares Stopping (6) versus Continuing (5). Since 6 > 5, Column Stops.
  At Stage 5, Row anticipates Column will Stop at 6. Row compares Stopping (5) versus Continuing (yielding 4). Since 5 > 4, Row Stops.
  At Stage 4, Column anticipates Row will Stop at 5. Column compares Stopping (4) versus Continuing (yielding 3). Since 4 > 3, Column Stops.
  At Stage 3, Row anticipates Column will Stop at 4. Row compares Stopping (3) versus Continuing (yielding 2). Since 3 > 2, Row Stops.
  At Stage 2, Column anticipates Row will Stop at 3. Column compares Stopping (2) versus Continuing (yielding 1). Since 2 > 1, Column Stops.
  At Stage 1, Row anticipates Column will Stop at 2. Row compares Stopping (1) versus Continuing (yielding 0). Since 1 > 0, Row Stops.
  The unique SPE outcome is **Stop at Stage 1**, with payoffs (1, 0).

  (b) **Epistemic Assumptions and Off-Equilibrium Beliefs**
  The backward-induction (BI) argument relies not merely on the players being rational, but on the **Common Knowledge of Rationality (CKR)**. CKR implies that Row knows Column is rational, Column knows Row is rational, Row knows that Column knows Row is rational, and so on ad infinitum. Crucially, this knowledge must extend to counterfactual situations.

  The problem arises at information sets that the equilibrium predicts will not be reached (e.g., Stage 2). For Row to Stop at Stage 1, Row must believe that Column *would* Stop at Stage 2. However, if Row were to Continue at Stage 1 (contrary to the BI prediction), Column arrives at Stage 2. Column must now form a belief about Row's future behavior at Stage 3. Under strict CKR, Column should maintain that Row is rational. Yet, Row's move of Continuing at Stage 1 was irrational according to the BI logic.

  This creates a paradox of belief revision. If CKR holds, the event "Row Continues at Stage 1" has probability zero. If it occurs, standard Bayesian updating is undefined. If Column revises their belief to think Row is irrational (to explain the unexpected move), Column may expect Row to Continue again at Stage 3. If Column expects Row to Continue at 3, Column's best response at 2 is to Continue (to reach Stage 3 payoffs). Thus, the BI solution unravels if the epistemic conditions are not robust to off-equilibrium surprises. The BI argument assumes players maintain beliefs in their opponent's future rationality even when the opponent's past behavior suggests otherwise, a condition that is epistemically fragile.

  (c) **Equilibrium Stability and Required Modifications**
  The cooperative path (Continue through Stage 6) cannot be a Nash Equilibrium in this complete-information setting because it is not sequentially rational. Specifically, at Stage 6, Column has a strict dominant strategy to Stop (6 > 5). Knowing this, Row has a strict incentive to Stop at Stage 5 (5 > 4). This incentive propagates backward to Stage 1. Because the game has a known finite horizon with strict incentives to defect at the terminal node, there is no "anchor" to sustain cooperation.

  To make cooperation rationalizable without altering utility functions (i.e., without invoking altruism), one must modify the **information structure**. Specifically, one must introduce **incomplete information** regarding the players' types or payoffs (as in the Kreps, Milgrom, Roberts, and Wilson reputation model). If there is a small probability that a player is a "commitment type" who is programmed to always Continue, or if there is uncertainty about the terminal payoffs, the rational player may mimic the commitment type to build a reputation. This uncertainty prevents the backward-induction chain from starting, as the opponent cannot be certain that defection will occur at the final node. Thus, cooperation becomes rationalizable as a strategic investment in reputation, rather than a violation of instrumental rationality.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Correct Derivation of SPE (4 Marks)**
  *   **Requirement:** Correctly identifies "Stop at Stage 1" as the outcome via step-by-step backward induction logic.
  *   **Common Error:** Candidates calculate the payoffs incorrectly or claim the game ends at Stage 6 because "they run out of moves," missing the anticipatory nature of BI.

  **2. Identification of Common Knowledge of Rationality (4 Marks)**
  *   **Requirement:** Explicitly names Common Knowledge of Rationality (CKR) or the hierarchy of beliefs as the necessary epistemic condition, distinguishing it from simple individual rationality.
  *   **Common Error:** Candidates state "players must be rational" without addressing the *knowledge* of the other's rationality or the recursive hierarchy.

  **3. Analysis of Off-Equilibrium Belief Revision (4 Marks)**
  *   **Requirement:** Explains the tension between an unexpected move (Continuing at Stage 1) and the maintenance of belief in the opponent's rationality at subsequent nodes (the paradox of reaching Node 2).
  *   **Common Error:** Candidates claim the game "cannot reach" Stage 2, therefore the analysis is irrelevant, failing to address the counterfactual requirement of Subgame Perfection.

  **4. Explanation of Cooperation Failure (4 Marks)**
  *   **Requirement:** States that cooperation fails because the incentive to defect at the final node is strict and known, making the cooperative path not sequentially rational.
  *   **Common Error:** Candidates argue cooperation fails because "players are selfish," rather than identifying the structural lack of sequential rationality at the terminal node.

  **5. Proposed Modification for Cooperation (4 Marks)**
  *   **Requirement:** Identifies incomplete information (uncertainty about types/payoffs/reputation) as the theoretical mechanism to sustain cooperation without changing utility functions.
  *   **Common Error:** Candidates suggest "social preferences," "altruism," or "changing the payoffs," which violates the constraint to keep utility functions intact.
