prompt: |-
  I'm a handling editor at a behavioral ecology journal and a big chunk of what I send out for review makes some version of the claim "trait T is an adaptation for function F" — sometimes with real data, sometimes it's basically a story with a figure attached. I'd like a checklist my referees can actually run on a manuscript in maybe half an hour, that tells them how much of the adaptation claim has been earned. The questions to ask in order (comparative/phylogenetic, heritability, developmental or structural analysis, optimality modelling, evidence of past selection, whatever else belongs on it), what counts as a sufficient answer to each, and where the procedure stops with a no instead of scoring the paper. Two things I really need it to do: separate "T is an adaptation" from "T is currently doing something useful" — I keep watching those two slide into each other in referee reports — and force a genuine spandrel check, i.e. could T just be a byproduct of something else that was under selection, or of a developmental/structural constraint, and what would the evidence look like if it were?

  Bake in that lots of these traits are known from one or two species, so "run the comparative method" is often just not available — say what the referee does then. And mark the steps where the referee is really making a judgment call rather than running a test, don't dress those up as procedure.

  Then run it on three hypothetical submissions: one on a bird alarm call claimed to be adapted for warning kin, one claiming a human psychological trait is an adaptation for some ancestral problem, and one from a cultural-evolution person claiming a social norm is an adaptation for group cohesion. Tell me where the checklist can't settle the matter and where it'll misfire, including a case where it gives an author an answer they won't like.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Handling Editor at a behavioral ecology journal.
      *   **Problem:** Too many manuscripts claim "Trait T is an adaptation for Function F" without sufficient evidence (often just-so stories). Referees conflate "adaptation" with "current utility."
      *   **Task:** Create a referee checklist (approx. 30 mins to run) to evaluate adaptation claims.
      *   **Key Requirements:**
          *   Order the questions logically (phylogeny, heritability, development, optimality, selection evidence, etc.).
          *   Define sufficient answers vs. stop conditions (reject).
          *   Distinguish "adaptation" (historical selection) from "current utility" (exaptation/byproduct).
          *   Force a "Spandrel Check" (byproduct/constraint alternative).
          *   Account for single-species studies (where comparative methods fail).
          *   Explicitly mark judgment calls vs. procedural tests.
          *   Apply the checklist to three hypothetical submissions (Bird alarm call, Human psych trait, Cultural social norm).
          *   Identify limitations/misfires of the checklist.

  2.  **Deconstruct "Adaptation" in Evolutionary Biology:**
      *   *Gould & Lewontin (1979):* The critique of the adaptationist programme. Need to avoid just-so stories.
      *   *Williams (1966):* Design and utility are not enough; need evidence of history.
      *   *Reeve & Sherman (1993):* "Adaptation" vs. "Function."
      *   *Lloyd (1999):* Criteria for adaptationism.
      *   *Core components:* Heritability, Variation, Differential Fitness, Historical Selection, Design Specificity.
      *   *The "Spandrel" problem:* Is it a byproduct of selection on Trait X? Is it a physical constraint?

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Goal:* 30 minutes. Needs to be punchy, not a textbook.
      *   *Structure:* Funnel approach. Start with the basics (does the trait exist?), move to mechanism, then history, then alternatives.
      *   *Constraint:* Single-species studies are common. Can't demand a phylogeny for everything. Need to allow "Design Evidence" to carry more weight if phylogeny is missing, but flag the uncertainty.
      *   *Distinction:* Must separate *Current Utility* (Function) from *Historical Origin* (Adaptation).
      *   *Judgment Calls:* Need to highlight where the referee uses expertise, not just a binary check.

      *   *Drafting Steps:*
          1.  **Definition:** Define T and F clearly.
          2.  **Existence/Reliability:** Is T real and consistent?
          3.  **Heritability/Genetics:** Can it evolve? (Crucial for adaptation).
          4.  **Design/Engineering:** Does T look *made* for F? (Optimality).
          5.  **Phylogeny/History:** Did T arise with F? (Or is it ancestral?).
          6.  **The Spandrel Check:** Explicitly ask for alternative hypotheses.
          7.  **Stop Rules:** Where do we reject immediately?

      *   *Refining for the Prompt:*
          *   Need to handle the "one species" issue. If no phylogeny, demand stronger design evidence + explicit acknowledgment of the limitation.
          *   Need to mark judgment calls.
          *   Need to ensure the "Adaptation vs. Utility" distinction is central.

  4.  **Developing the Three Hypothetical Cases:**
      *   **Case 1: Bird Alarm Call (Kin Selection).** Classic behavioral ecology. Data usually exists (playbacks, pedigrees).
          *   *Checklist outcome:* Likely passes if pedigree data exists. Fails if just observational.
      *   **Case 2: Human Psych Trait (Ancestral Problem).** Evolutionary Psychology. Harder data (no fossils of minds). Relies on universality or modeling.
          *   *Checklist outcome:* Will struggle with heritability and phylogeny. High risk of "just-so."
      *   **Case 3: Cultural Norm (Group Cohesion).** Cultural Evolution. Memes vs. Genes.
          *   *Checklist outcome:* Checklist is biological. Will misfire here. Need to highlight this limitation.

  5.  **Refining the Checklist Content (Self-Correction during drafting):**
      *   *Critique:* Is 30 minutes realistic?
      *   *Fix:* Keep questions binary or scaled (Pass/Fail/Flag). Don't ask for re-analysis, ask for *presentation* of evidence.
      *   *Critique:* How to handle single species?
      *   *Fix:* Add a "Single-Taxon Protocol" branch. If phylogeny is impossible, shift burden to "Design Specificity" and "Cost-Benefit."
      *   *Critique:* How to enforce the Spandrel check?
      *   *Fix:* Make it a mandatory section. If the author doesn't propose a null hypothesis (byproduct), they fail.

  6.  **Writing the Response:**
      *   **Introduction:** Acknowledge the editor's pain point. Set the tone (rigorous but practical).
      *   **The Checklist:** Structured logically. Use bolding for "Stop" conditions. Use icons or labels for "Judgment Call."
      *   **The Application:** Run the three cases. Be honest about where the checklist breaks (especially the cultural one).
      *   **The "Uncomfortable Truths":** Address where the checklist gives answers authors won't like (e.g., Human Psych often fails the heritability/phylogeny test).

  7.  **Final Review against Constraints:**
      *   30 mins? Yes, if focused on manuscript evidence, not new data collection.
      *   Separate Adaptation vs. Utility? Yes, built into the definition and history sections.
      *   Spandrel Check? Yes, explicit section.
      *   Single species handling? Yes, included in the Phylogeny section.
      *   Judgment calls marked? Yes.
      *   Three hypotheticals run? Yes.
      *   Limitations discussed? Yes.

  8.  *(Self-Correction on Cultural Evolution)*: I need to be careful not to say cultural evolution *can't* be adaptive, but the biological checklist needs modification. I will highlight this as a specific failure mode of the checklist.

  9.  *(Self-Correction on Human Psych)*: This is the biggest minefield. The checklist should likely flag these as "Adaptation *Hypothesis*" rather than "Adaptation *Demonstration*" unless there's strong behavioral genetics.

  10. **Final Polish:** Ensure tone is professional, editorial, and authoritative. (Proceed to generate output).

  *(Note: Thinking process moves to generating the actual response based on these structured thoughts.)*
answer: |-
  Here is a referee checklist designed for your specific constraints. It is structured to be completed in 30 minutes by scanning the manuscript for specific evidentiary thresholds. It forces a distinction between *current utility* (function) and *historical origin* (adaptation), and it mandates a null hypothesis (the Spandrel check).

  Following the checklist, I have applied it to your three hypothetical submissions and analyzed where the tool breaks down.

  ***

  # The Adaptation Claim Audit (ACA)
  **For Referees:** Do not use this to demand new data. Use it to evaluate whether the *existing* data supports the *strength* of the claim. If the authors claim "Adaptation," they must pass Section 4. If they only claim "Current Utility," they may stop at Section 2.

  **Time Limit:** 30 Minutes.
  **Marking:**
  *   **[PASS]**: Evidence provided and sufficient.
  *   **[FAIL]**: Evidence missing or logically flawed. (Triggers Stop Rule).
  *   **[JC]**: **Judgment Call.** This requires your expertise, not a binary test.
  *   **[N/A]**: Not applicable (e.g., single-species study).

  ---

  ### Phase 1: Definition & Distinction (5 Mins)
  *Goal: Prevent sliding between "useful now" and "selected for then."*

  **1.1. Trait (T) and Function (F) Specificity**
  *   Is T defined as a distinct phenotypic variant (not a continuum of general performance)?
  *   Is F defined as a specific fitness consequence (survival/reproduction), not just "performance" or "efficiency"?
  *   **[JC]**: Is the link between T and F specific enough that it couldn't apply to ten other traits?
      *   *Pass:* T is a specific morphological shape or behavioral sequence; F is a specific survival bottleneck.
      *   *Fail:* T is "general intelligence"; F is "survival."

  **1.2. The Claim Level**
  *   Does the abstract/title claim T is an **Adaptation** (historical selection) or has **Utility** (current benefit)?
  *   **[STOP RULE]**: If the text claims "Adaptation" but the data only demonstrates current utility (e.g., removal experiments showing fitness drop *now*), the claim must be downgraded to "Current Utility/Exaptation" or rejected as overstated.

  ---

  ### Phase 2: The Variance & Mechanism Check (5 Mins)
  *Goal: Ensure the trait can actually evolve.*

  **2.1. Heritability / Transmission**
  *   Is there evidence T is heritable (genetic) or reliably transmitted (cultural/epigenetic)?
  *   **[Single-Species Protocol]**: If no pedigree/phylogeny is available, is there evidence of individual consistency/repeatability that implies a fixed mechanism rather than plastic noise?
  *   **[FAIL]**: If T is shown to be entirely environmentally plastic with no transmission mechanism, it cannot be an adaptation in the evolutionary sense.

  **2.2. Cost of Production/Maintenance**
  *   Is there evidence that T is costly (energy, risk, time)?
  *   **[JC]**: Adaptations usually solve expensive problems. If T is free, why would selection need to shape it?
      *   *Pass:* Metabolic cost, predation risk, or opportunity cost demonstrated.
      *   *Fail:* Trait is described as cost-free.

  ---

  ### Phase 3: The Design & History Check (10 Mins)
  *Goal: The core adaptation evidence. This is where most papers fail.*

  **3.1. Phylogenetic Context (Comparative Method)**
  *   Does the paper map T onto a phylogeny?
  *   **If Yes:** Did T arise concurrently with the selective pressure F? Or is T ancestral to F (exaptation)?
  *   **If No (Single Species):** The authors must explicitly acknowledge this limitation. They cannot claim "Adaptation" with high confidence; they must frame it as an "Adaptation Hypothesis."
  *   **[JC]**: If single-species, is the "Engineering Design" evidence (see 3.2) strong enough to compensate for the lack of history?

  **3.2. Engineering Design (Optimality/Complexity)**
  *   Does T show complexity or specificity that implies design for F? (e.g., a lock-and-key mechanism, not just a generic barrier).
  *   **[JC]**: Could a simple physical law explain T without selection? (e.g., is the shape just surface tension, not selection?)
  *   **[FAIL]**: If T is indistinguishable from a physical byproduct or random drift expectation.

  **3.3. Evidence of Past Selection**
  *   Is there evidence of a selective sweep, local adaptation (clines), or historical correlation?
  *   **[N/A]**: Often unavailable. If missing, burden shifts to 3.2 (Design).

  ---

  ### Phase 4: The Spandrel Check (Mandatory) (5 Mins)
  *Goal: Force the authors to disprove the null. This is the most important section.*

  **4.1. The Byproduct Hypothesis**
  *   Do the authors explicitly state a null hypothesis where T is a byproduct of selection on Trait Z (correlated trait)?
  *   *Example:* "Feathers are for flight" vs. "Feathers are for thermoregulation (flight is a byproduct)."
  *   **[FAIL]**: If no alternative hypothesis is generated, the manuscript is a "Just-So Story." **Recommend Reject or Major Revision.**

  **4.2. The Constraint Hypothesis**
  *   Do the authors address developmental or structural constraints?
  *   *Question:* Could T exist simply because physics/development makes it the only possible outcome, regardless of F?
  *   **[JC]**: Did the authors test if variation in T is possible? If T is invariant across all related taxa regardless of environment, it may be a constraint, not an adaptation.

  **4.3. Discriminating Evidence**
  *   Is there data presented that specifically distinguishes Adaptation (T for F) from the Spandrel/Constraint nulls?
  *   **[FAIL]**: If the data fits the Adaptation hypothesis *and* the Spandrel hypothesis equally well, the Adaptation claim is unsupported.

  ---

  ### Phase 5: Final Scoring (5 Mins)

  *   **Level 1 (Utility Only):** Passes Phase 1 & 2. Fails Phase 3. *Verdict: Publish as "Function/Utility" only.*
  *   **Level 2 (Adaptation Hypothesis):** Passes Phase 1, 2, & 4. Single species (Phase 3 N/A). Strong Design evidence. *Verdict: Publish with "Hypothesis" language.*
  *   **Level 3 (Adaptation Demonstration):** Passes All Phases. Phylogeny + Design + Selection Evidence + Spandrel Rejection. *Verdict: Strong Accept.*
  *   **Reject:** Fails Phase 2 (Heritability), Fails Phase 4 (No Spandrel Check), or Phase 1 Mismatch (Claim > Data).

  ***

  # Application to Hypothetical Submissions

  Here is how the ACA runs on three common manuscript types.

  ### Case 1: The Bird Alarm Call (Kin Selection)
  **Claim:** Specific call structure (T) is an adaptation to warn kin (F) without alerting predators.
  **Data:** Playback experiments, pedigree data from 3 years, one species.

  *   **Phase 1:** Pass. T is specific acoustic structure; F is kin survival.
  *   **Phase 2:** Pass. Pedigree shows heritability of call structure. Cost is predation risk.
  *   **Phase 3:** **N/A (Single Species).** Authors acknowledge this. Design evidence is strong (call frequency is outside predator hearing range but inside kin range).
  *   **Phase 4 (Spandrel):** Authors propose null: "Call is a byproduct of general arousal." They refute this by showing call structure remains consistent at low arousal if kin are present.
  *   **Verdict:** **Level 2 (Adaptation Hypothesis).**
  *   **Why not Level 3?** Lacks phylogeny. We don't know if this call evolved *with* kin grouping or if kin grouping exploited an existing call.
  *   **Referee Instruction:** Accept, but force title change from "Adaptation for Kin Warning" to "Evidence Consistent with Kin Warning Adaptation."

  ### Case 2: The Human Psychological Trait (Evolutionary Psych)
  **Claim:** "Cheater Detection Module" (T) is an adaptation for social exchange in ancestral environments (F).
  **Data:** Wason selection task performance across 2 university samples.

  *   **Phase 1:** **Fail/JC.** T is defined as a "module" but measured as task performance. F is "ancestral social exchange" (unobservable).
  *   **Phase 2:** **Fail.** No heritability data. No evidence this is genetic vs. culturally learned rule.
  *   **Phase 3:** **Fail.** No phylogeny (obviously). Design evidence is weak (task performance varies by culture/education).
  *   **Phase 4 (Spandrel):** **Fail.** Authors do not adequately address the null: "This is a byproduct of general literacy and logical reasoning taught in modern schooling."
  *   **Verdict:** **Reject (or Major Revision to downgrade to "Current Utility").**
  *   **The Uncomfortable Answer:** The checklist forces the referee to reject this as an *adaptation* paper. It lacks the historical and genetic evidence required by the definition of adaptation. It is a "Function" paper at best, and a weak one. The checklist prevents the "Just-So" publication.

  ### Case 3: The Cultural Social Norm (Cultural Evolution)
  **Claim:** "Food Sharing Norm" (T) is an adaptation for Group Cohesion (F).
  **Data:** Ethnographic comparison of 5 societies, agent-based modeling.

  *   **Phase 1:** Pass. T and F defined.
  *   **Phase 2:** **Mismatch.** Heritability is cultural, not genetic. The checklist assumes biological inheritance.
  *   **Phase 3:** **Misfire.** Phylogeny of norms is speculative.
  *   **Phase 4 (Spandrel):** Authors argue norm is not a byproduct of "calorie surplus."
  *   **Verdict:** **Checklist Misfire.**
  *   **Why:** The ACA is built for biological evolution. Cultural traits evolve via different mechanisms (biased transmission, not just fitness).
  *   **Referee Instruction:** The referee must recognize the checklist is the wrong tool. However, Phase 4 (Spandrel Check) still applies: Is the norm a byproduct of cognitive bias rather than group selection? If the authors ignore that, the paper is still weak, even if the biological checklist doesn't fit perfectly.

  ***

  # Limitations & Misfires: Where the Checklist Fails

  As an editor, you need to know where the ACA gives false negatives or creates friction.

  **1. The "Single-Species Penalty" (Case 1)**
  *   **The Problem:** The checklist downgrades single-species studies to "Hypothesis" rather than "Demonstration."
  *   **The Friction:** Authors will hate this. They will argue, "Everyone knows this is an adaptation."
  *   **The Reality:** They are wrong. Without phylogeny or selection gradients, it is a hypothesis. The checklist protects the journal from publishing assumptions as facts. You must back the referees on this.

  **2. The Human/Evolutionary Psychology Trap (Case 2)**
  *   **The Problem:** This checklist will effectively ban most standard EvPsych papers from claiming "Adaptation."
  *   **The Friction:** This field relies on "universality" as a proxy for phylogeny and "modularity" as a proxy for design. The ACA treats these as insufficient (which, strictly speaking, they are).
  *   **The Reality:** If your journal wants to publish EvPsych, you need a modified checklist that accepts "Universality + Cost" as a proxy for Phase 3. If you use *this* checklist, you will reject 80% of EvPsych submissions. That might be a feature, not a bug.

  **3. The Cultural Evolution Mismatch (Case 3)**
  *   **The Problem:** The checklist assumes genetic heritability and biological fitness.
  *   **The Misfire:** It will flag cultural transmission as "Fail Heritability."
  *   **The Fix:** Add a "Cultural Protocol" toggle to Phase 2. If Cultural, swap "Heritability" for "Fidelity of Transmission" and "Fitness" for "Prevalence/Longevity."

  **4. The "Judgment Call" Burden**
  *   **The Problem:** I marked several items as **[JC]**. A lazy referee can still game this.
  *   **The Risk:** A referee who hates adaptationism can mark all JCs as "Fail." A referee who loves it can mark them "Pass."
  *   **The Mitigation:** In your instructions to referees, require that any **[JC]** marked "Fail" must include a 2-sentence justification in the comments. This creates accountability.

  **5. The "Uncomfortable Truth" for Authors**
  *   The most common rejection using this tool will be **Phase 4 (Spandrel Check).**
  *   Authors will say: "It is impossible to test every null hypothesis."
  *   Your response: "You claimed adaptation. Adaptation is a specific historical claim. If you cannot distinguish your claim from a byproduct, you have not earned the claim." This will be the source of most appeals, but it is the scientifically correct stance.

  ### Summary for the Editor
  This checklist shifts the burden of proof back to the author. It treats "Adaptation" as a high-bar historical claim, not a synonym for "Useful." It will reduce the number of "Just-So" stories in your journal, but it will also increase the number of manuscripts that are asked to reframe their claims as "Function" or "Hypothesis." This is the correct outcome for a rigorous behavioral ecology journal.
