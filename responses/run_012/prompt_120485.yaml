      *   *Section 2: Benacerraf's Actual Position.*
          *   Clarify logical entailment vs. metaphysical indeterminacy.
          *   Mention that Benacerraf allows the supertask is *possible*, just that the state isn't fixed by the premises.
      *   *Section 3: Thomson's Potential Reply.*
          *   Thomson might argue that if the state isn't fixed by the description, the description describes an impossible object (like a round square).
      *   *Section 4: The Friend's Objections.*
          *   Dimmer: Mathematically sound, philosophically irrelevant to the specific paradox. It changes the function from discontinuous to continuous.
