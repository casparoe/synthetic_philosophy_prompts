  ## 3. The Staged Experience

  **Phase 1: The Lopsided Case (Minutes 05–25)**
  Pairs receive Case 1. The ceiling asymmetry (12 vs 36) forces a choice between *equal absolute payoffs* (approx 10.9 each) and *equal proportional gains* (approx 23.5 for P2, 7.8 for P1). The Product Rule sits at the kink (10, 20).
  *   *Observation:* Pairs arguing for "fairness" will likely split near $(11,11)$. Pairs arguing for "efficiency" or "leverage" may gravitate toward the Product point. It is difficult to intuitively land on the Ray point without calculating fractions.

  **Phase 2: The Phantom Contract (Minutes 25–45)**
  Pairs negotiate Case 2, then Case 3.
  *   *Observation:* In Case 2, the deal is usually near $K$ or the Ray point. In Case 3, the *only* change is the addition of contract $L$, which no one selects.
  *   *Critical Moment:* Ask pairs who changed their deal: "Why did a contract you didn't choose change your deal?" Ask pairs who kept the same deal: "Why did you ignore the new ceiling?"
  *   This creates the experiential conflict: The Ray Rule requires acknowledging $L$ (because it changes the Ideal), while the Product Rule ignores $L$ (because it doesn't change the frontier near the solution).

  **Phase 3: The Veil of Ignorance (Minutes 45–55)**
  Students write a rule for a mediator. They do not know if they will be Player 1 (low ceiling) or Player 2 (high ceiling).
  *   *Tension:* Player 1s usually prefer the Ray Rule (protects proportional share against high ceilings). Player 2s often prefer the Product Rule (exploits the kink). Writing a rule forces them to commit to a principle before knowing their side.

  **Phase 4: The Reveal (Minutes 55–75)**
  Apply the written rules to Case 1 on the board. Then, introduce the names **Product Rule** and **Ray Rule**. Map the definitions from the prompt to the points on the board.
  *   Show that the "Phantom Contract" moved the Ray Rule point but not the Product Rule point.

  ---

  ## 4. Debrief Script

  **1. Equal Shares vs. Equal Proportional Sacrifice**
  "Look at Case 1. The Equal Split gave both ~10.9. The Ray Rule gave P2 ~23.5 and P1 ~7.8. Why? The Ray Rule does not split the *pie*; it splits the *distance to the dream*. P2's dream was 36, P1's was 12. To give them the same fraction of their dream, P2 must get more dollars. The Product Rule sat at the kink (10, 20). It balanced the *percentage loss* each side suffered by moving away from their ideal, but it did so based on the shape of the frontier, not just the ideals."

  **2. What the Ray Rule Needs**
  "The Ray Rule cannot be calculated without the Ideal Point. In Case 3, we added contract $L$. It was not chosen. It was not on the deal path. But it raised P1's ceiling. The Ray Rule *had* to move, because the 'distance to the dream' changed. If you believe the deal should depend on what *could* have been achieved (even if not chosen), you need the Ray Rule."

  **3. What the Phantom Contract Exposes**
  "The Product Rule did not move in Case 3. Why? Because the set of *actually achievable deals* near the solution did not change. The Product Rule is insensitive to irrelevant options. The Ray Rule is sensitive.
  *   **Intuition Violated by Ray:** 'If I didn't choose it, it shouldn't matter.' (Independence of Irrelevant Alternatives).
  *   **Intuition Violated by Product:** 'If my potential maximum increases, my share should reflect that.' (Individual Monotonicity)."

  **4. What Your Rules Revealed**
  "Review the rules you wrote for the Mediator. If you wrote 'Split the gains equally,' you chose the Ray Rule logic. If you wrote 'Maximize the joint value' or 'Stay at the kink,' you chose the Product Rule logic. Your hesitation in Phase 2 was the price of that choice: stability (Product) versus responsiveness to potential (Ray)."

  ---

  ## 5. Predictable Failures & Handling

  **1. Pair Converges Instantly on Equal Split**
  *   *Symptom:* "We just split the difference. Done."
  *   *Handling:* Interrupt at Minute 15. "Check Case 1. P1 max is 12, P2 max is 36. If you split at (11, 11), P1 gets 92% of their max, P2 gets 30%. Does 'equal split' feel fair when the ceilings are this lopsided? Recalculate."

  **2. Rejection of the Mixing Story**
  *   *Symptom:* "We can't mix contracts. We have to pick one."
  *   *Handling:* "The theory assumes a long run of identical transactions or transferable utility. If you refuse the convex hull, you are bargaining over a discrete set, not the space these rules define. For this exercise, you must treat the shaded area as available."

  **3. Insistence on a "Right Answer"**
  *   *Symptom:* "There must be a correct solution. Which one is it?"
  *   *Handling:* "There is no correct answer. There is only a choice of properties. Do you want the deal to change when a phantom option appears? If yes, use Ray. If no, use Product. You are choosing the bug you can live with."

  **4. Vague Written Rules**
  *   *Symptom:* Students write "Be Fair" or "Maximize Welfare."
  *   *Handling:* During the Reveal, ask: "Mediator, how do you calculate 'Fair'? If you can't calculate it, you can't apply it." Use this to motivate the precision of the Product/Ray definitions.

  ---

  ## 6. Closing Note (Facilitator Reference)

  **Read this only in the final 5 minutes:**

  "This activity isolates two specific mechanics. It does not capture the full theory. Three caveats:
  1.  **Convexity:** The Ray Rule is defined for all convex feasible sets, not just menus of contracts. We used menus to make the 'Phantom Contract' visible, but the rule applies to smooth curves too.
  2.  **Normative Weight:** We showed that the Product Rule is insensitive to deleted options. We did not prove why that is *good*. That requires an argument about consistency that we did not test here.
  3.  **Comparable Scales:** The Ray Rule's 'equal fraction of gains' assumes we can compare P1's utils to P2's utils. Both rules officially claim to work without interpersonal comparisons, but the Ray Rule's reliance on the Ideal Point secretly presupposes that the scales are comparable. You have felt the pull of that assumption today."
