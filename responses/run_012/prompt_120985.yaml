  # Seminar Activity: The Price of Proportionality

  ## 1. Minute-by-Minute Run Sheet

  **Materials:** Whiteboard (divided into three vertical panels), 9 printed Case Cards (one per pair), markers, ruler.
  **Room:** 18 students in 9 pairs. Movable chairs facing the board.

  | Time | Stage | Facilitator Instructions & Script | Board Layout |
  | :--- | :--- | :--- | :--- |
  | **00–05** | **Setup** | "Form 9 pairs. You are bargaining teams. You will receive a 'Menu' of contracts. You can mix these contracts over time to achieve any point in the shaded region. Your goal: Agree on a single point. If you disagree, you get the Disagreement Point $d$." | **Left Panel:** "Rules of Play"<br>1. Convex Hull available.<br>2. Disagreement = $d$.<br>3. Maximize your payoff.<br>4. No names of solutions yet. |
  | **05–25** | **Case 1 (Lopsided)** | Distribute **Case Card 1**. "Negotiate a split. Defend it. Why *this* point?" Circulate. Listen for "It's fair" vs. "It's efficient." Do not validate. | **Center Panel:** Draw Case 1 Feasible Set (large). Mark $d=(0,0)$. Mark Ideal Point $I$. |
  | **25–45** | **Case 2 & 3 (The Shift)** | Distribute **Case Card 2**. "Negotiate." (5 mins). Collect cards. Distribute **Case Card 3**. "Same menu, plus one new option. Negotiate." (5 mins). "Did your deal change? Why?" (10 mins discussion). | **Center Panel:** Erase Case 1. Draw Case 2 Feasible Set. Mark $d \neq 0$. Add Contract $L$ for Case 3 in a different color. |
  | **45–55** | **The Commitment** | "Imagine a Mediator will decide your next case. You don't know if you will be Player 1 or Player 2. Write down the **formula** or **rule** you want the Mediator to use. Be precise." Collect papers. | **Right Panel:** "The Mediator's Rule"<br>Leave blank. |
  | **55–65** | **The Reveal** | Select 3 student rules at random. Apply them to **Case 1** on the board. (e.g., "Equal Split", "Max Product", "Equal Fractions"). Show the resulting points. | **Right Panel:** Plot the 3 student outcomes on Case 1 diagram. |
  | **65–75** | **The Naming** | "Two standard rules exist." Write **Product Rule** and **Ray Rule** on board. Define them using the text provided in the prompt. Map them to the points just plotted. | **Right Panel:** Add labels "Product Rule" and "Ray Rule" to the plotted points. |
  | **75–90** | **Debrief** | Lead the debrief (see Section 4). Connect their negotiation friction to the theoretical properties. Close with the limitations note (Section 6). | **All Panels:** Keep visible for reference. |

  **Facilitator Constraint:** Do not use the terms "Nash," "Kalai-Smorodinsky," "IIA," or "Monotonicity" until minute 65. Refer to the rules only as "The Method You Wrote" or "The Two Standard Rules."

