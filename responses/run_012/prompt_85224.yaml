answer: |-
  Here is the breakdown of the slogan "vote on values, bet on beliefs," dissected into distinct theses ranging from definitional tautologies to contentious institutional proposals.

  ### The Menu of Readings

  **1. The Categorical Distinction (Trivial)**
  *   **Thesis:** Policy arguments contain two types of propositions: normative claims about desired states of affairs (values) and empirical claims about causal relationships (beliefs).
  *   **Mechanism:** "Voting" is metaphorical for asserting a preference; "Betting" is metaphorical for asserting a probability.
  *   **What is Voted:** Nothing; this is purely semantic.
  *   **What is Bet:** Nothing; this is purely semantic.
  *   **Market Price:** N/A.
  *   **Classification:** **Trivial.** It holds by definition of the terms. It merely asserts that "ought" statements and "is" statements are different categories.
  *   **Condition:** Requires only that language distinguishes between preferences and predictions.

  **2. The Diagnostic Heuristic (Substantive but Defensible)**
  *   **Thesis:** In most political disagreements, parties agree on the ultimate welfare metric but disagree on the causal efficacy of policies to achieve it.
  *   **Mechanism:** A rhetorical tool to clarify debate.
  *   **What is Voted:** Nothing yet; this is a pre-debate filter.
  *   **What is Bet:** Nothing yet; this is a demand for evidence.
  *   **Market Price:** N/A.
  *   **Classification:** **Substantive but Defensible.** It holds if the disputants actually share underlying goals (e.g., both want affordable housing) but disagree on supply elasticity. It fails if the conflict is genuinely adversarial (e.g., one side wants affordability, the other wants exclusivity).
  *   **Condition:** Requires that the disagreement is instrumental, not fundamental.

  **3. The Institutional Division of Labor (Contentious)**
  *   **Thesis:** A polity should aggregate normative preferences via democratic voting to set a welfare function, and aggregate empirical information via prediction markets to select policies that maximize that function.
  *   **Mechanism:** Futarchy proper.
  *   **What is Voted:** The definition of the national welfare metric (e.g., GDP + Gini coefficient).
  *   **What is Bet:** Conditional contracts on the future value of that metric given specific policies (e.g., "If Policy X passes, GDP will be Y").
  *   **Market Price:** The market's consensus expectation of the welfare metric conditional on the policy adoption.
  *   **Classification:** **Substantive and Contentious.** It holds only if prediction markets are more epistemically efficient than legislative deliberation and if the welfare metric can be specified without loopholes.
  *   **Condition:** Requires that markets remain liquid/unmanipulated and that the welfare metric is robust to Goodhart's Law.

  **4. The Ontological Claim (Strongly Contentious)**
  *   **Thesis:** Values are fundamentally subjective preferences (not truth-apt), while beliefs are objective claims about reality (truth-apt). Therefore, values require aggregation of will, while beliefs require discovery of truth.
  *   **Mechanism:** Epistemic/Metaphysical grounding for Reading 3.
  *   **What is Voted:** Subjective preferences (no truth condition).
  *   **What is Bet:** Objective probabilities (truth condition resolved by future observation).
  *   **Market Price:** The objective probability of the outcome occurring.
  *   **Classification:** **Contentious/Debatable.** It holds if moral anti-realism is true and if prediction markets reliably converge on truth. It fails if moral reasoning can be "correct" or if markets converge on manipulated equilibria rather than truth.
  *   **Condition:** Requires moral anti-realism and efficient market hypothesis validity.

  **5. The Separability Thesis (False)**
  *   **Thesis:** Any policy decision can be cleanly decomposed into independent value components and belief components without remainder.
  *   **Mechanism:** Assumption required to implement Reading 3.
  *   **What is Voted:** Pure ends.
  *   **What is Bet:** Pure means.
  *   **Market Price:** The value of the means independent of the ends.
  *   **Classification:** **False.** It fails because many political concepts are "thick" (e.g., "justice," "safety"), where the method of achievement is intrinsic to the value. You cannot value "security" without defining *how* security is achieved (e.g., via community trust vs. surveillance).
  *   **Condition:** Requires that all political goods are purely consequentialist and independent of process.

  ---

  ### Licensing the Argumentative Move

  In the housing policy argument you described, the slogan was used to declare the debate "confused" and shift the **burden of proof**. This move is licensed exclusively by **Reading 2 (The Diagnostic Heuristic)**.

  By invoking the slogan, the speaker asserted: *"We all agree on the value (housing should be affordable/accessible). Therefore, your disagreement is not about what we want, but about what works. The burden of proof is on you to demonstrate the causal mechanism, not to justify the moral goal."*

  This is a legitimate move *if* Reading 2 holds. It forces the opponent to produce empirical evidence rather than moral posturing.

  ### The Bait-and-Switch

  However, in futarchic discourse, speakers frequently slide from **Reading 2** to **Reading 3** or **Reading 5**.

  1.  **From Diagnostic to Institutional:** The speaker implies that because a specific disagreement *can* be framed as factual (Reading 2), the *entire governance structure* should be designed to treat all disagreements as factual (Reading 3). They move from "This specific argument is about beliefs" to "All policy selection should be done by betting."
  2.  **From Heuristic to Separability:** The speaker assumes that because they *identified* a belief component in the housing debate, the value component is now settled and separable (Reading 5). They ignore that the definition of "housing policy success" might inherently involve procedural values (e.g., tenant agency vs. speed of construction) that cannot be captured in a single welfare metric to be bet upon.

  When the slogan is used to shut down debate, it is usually smuggling in **Reading 5**. It asserts that the value question is "settled" (voted) so effectively that only the belief question (bet) remains, ignoring that the definition of the metric itself is often the core political conflict.

  ### The Single Distinction That Matters

  The distinction that matters most for anyone arguing about this is **The Entanglement of Means and Ends.**

  You must ask: **Is the policy mechanism intrinsic to the value being pursued?**

  If the value is "maximize GDP," means and ends are separable; you can bet on which policy maximizes GDP without worrying that the policy itself corrupts the value. But if the value is "a just city," the *means* (democratic deliberation, due process, community consent) are often constitutive of the *end*. You cannot achieve a "just city" via an algorithmic market mechanism that bypasses democratic consent, even if the market predicts higher "justice metrics."

  If means and ends are entangled, you cannot vote on one and bet on the other. The slogan collapses because the "bet" (the mechanism of selection) alters the "value" (the legitimacy of the outcome). Any argument relying on the slogan must first prove that the specific policy domain allows for clean separation; if it does not, the burden of proof remains on the institutional designer to show why the market mechanism doesn't violate the very values it claims to optimize.
