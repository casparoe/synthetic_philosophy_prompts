prompt: |-
  Act as a political philosopher and mechanism-design specialist who is used to pulling slogans apart into theses. I keep running into the line 'vote on values, bet on beliefs' whenever people argue about futarchy — the proposal that a polity settles its welfare metric democratically and then lets conditional prediction markets, rather than representatives, choose policies. The last time, it arrived at the end of a long governance-forum argument about whether a city should adopt a particular housing policy: someone said the whole debate was confused, that we vote on values and bet on beliefs, and that this settled which side carried the burden of proof. I suspect the slogan is doing more work than it can bear, but I want the readings laid out before I judge.

  Before you write anything, brainstorm the distinct theses that sentence could be expressing. Then give me a menu ordered from the nearly trivial to the strongly contentious. For each reading, state it as precisely as you can — what exactly is being voted on, what exactly is being bet on, who does each, and what would make a market price a belief — and classify it as trivial, substantive but defensible, or false, saying what would have to be true for it to hold. Then tell me which reading or readings would actually license the move made in the argument I described, where the slogan was used to shift a burden of proof, and which readings get smuggled in when people slide from a weak version to a strong one. Close by naming the single distinction you think matters most for anyone arguing about this, and explain why. Assume I already know what a prediction market is, and don't give me reading lists or citations.
