answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who has watched the ground as long as you have, and I want to begin by validating your intuition that you are not merely witnessing sloppy practice but rather a specific, structured logical maneuver that has deep roots in the history of our discipline. You are asking for a name, and while there is no single capitalized Proper Noun universally agreed upon in the way one might name a geological epoch, there is a precise cluster of terms in the philosophy of science and archaeological theory that describes exactly what you are seeing. The phenomenon you have isolated is best understood as the reification of a residual category, protected by what logicians call an ad hoc rescue. To understand the carving you requested, we must separate the logical structure from the specific subject matter, because while you are seeing this in archaeology, the mechanism is a general tool of reasoning that becomes particularly dangerous when applied to human belief.

  The core of the move you describe begins with what is known as a residual category. In any classification system, there are items that fit the primary definitions and items that do not. In archaeology, the primary definitions are usually functional or practical: a tool is for cutting, a pot is for storage, a pit is for refuse. When an assemblage refuses to fit these practical models, as with the bent sword or the snapped quern, it is placed in the residual category. Historically, this category has been labeled ritual, symbolic, ceremonial, or votive. The logical error occurs in the second half of the move you noticed, which is the reification, or hypostatization, of that category. Reification is the fallacy of treating an abstract classification as if it were a concrete causal agent. By labeling the pit ritual, the excavator transforms a description of our ignorance, meaning we do not know the practical use, into an explanation of the past, meaning the actors did this because of ritual. The label ceases to be a bucket for anomalies and becomes a ghost in the machine, capable of bending swords and snapping stones. This is why your friend calls it sloppy, but you sense it is something more systematic; it is a systematic way of converting negative evidence into positive knowledge.

  This reification is sustained by the second mechanism, the ad hoc rescue. In the philosophy of science, an ad hoc hypothesis is an adjustment made to a theory to prevent it from being falsified by new evidence. In the cases you collect, the theory is that the pit is ritual. When a comparable pit appears without metal, the theory is not discarded; it is adjusted to specify a different rite. This renders the hypothesis unfalsifiable. A genuine hypothesis must forbid something; it must say that if we find X, then the theory is wrong. The ritual label you are tracking forbids nothing. It absorbs the presence of metal, the absence of metal, the breaking of objects, and the burying of whole ones. This is distinct from the standard warning that absence of evidence is not evidence of absence. That warning is too weak for your purposes because it implies a neutral silence. In the reports you are reading, the absence of a practical function is not treated as silence; it is treated as positive evidence for the presence of a belief. This is a specific variant of the argument from ignorance, where the lack of a secular explanation is taken as proof of a sacred one. In theology, this is known as the God of the gaps; in archaeology, it might be accurately termed the Ritual of the gaps.

  You also asked for the relation to the respectable version of this maneuver, and this is where the boundary between science and storytelling is drawn. The respectable version relies on what is known as Middle-Range Theory or ethnoarchaeological analogy. This is when an archaeologist observes a living people bending swords at funerals and uses that observation to interpret a buried sword. The crucial difference lies in the direction of the logic and the constraints applied. In the valid version, the analogy is used to generate a prediction that can be tested against other lines of evidence. If the pit is a funeral deposit based on the analogy, we might expect to find human remains nearby, or specific soil chemistry associated with decomposition, or a lack of domestic refuse. If those predictions fail, the hypothesis should lose confidence. In the invalid version you are tracking, the label is applied post-hoc to explain the anomaly, and then the label is used to explain why the other evidence is missing. The valid use of ritual as a category restricts the possibilities; the invalid use expands them to cover all contingencies. When the invocation of ritual actually forbids something, such as predicting that a votive pit should not contain food waste, and the excavator looks for food waste to test that claim, the label is functioning as a genuine hypothesis. When the label is used to explain why the food waste is absent only after it is found to be missing, it is functioning as the fallacy you have identified.

  So, to give you the carving you need for your next report, you are looking for a specific sequence of moves. First, check if the term ritual is being used to describe what the object is not, rather than what it is. If the report says this is not a dwelling and not a refuse pit, therefore it is a temple, you are looking at the residual category. Second, check if the label is then used to explain the features that made it residual. If the report says the lack of domestic refuse proves it is a temple, and the fact that it is a temple explains the lack of domestic refuse, you are looking at circular reification. Third, check for the ad hoc flexibility. If new evidence that contradicts the initial ritual model is met with a modification of the ritual model rather than a reduction in confidence, you are looking at a degenerating research programme. The edge of the phenomenon is defined by falsifiability. If the word ritual appears in a report, ask yourself what finding would make the archaeologist remove that word. If the answer is nothing, because any finding can be accommodated by inventing a new rite or redefining the ceremony, then you have identified the figure.

  It is worth noting that this is not necessarily born of dishonesty. Archaeology deals with the silent past, and belief systems leave the faintest traces. The temptation to fill the silence with a noun is powerful. However, your observation that this happens almost exclusively with belief and institution and hardly ever with diet or trade is astute. We do not say a pot is broken because of the trade hypothesis when it does not fit a storage model; we say our trade model is wrong. The asymmetry exists because material constraints on diet and trade are easier to model and test than the infinite variability of human symbolism. The term ritual becomes a shield against the uncertainty of cognition. There is no single word like gravity that names this error, but if you need a shorthand for your files, you might classify it as the Reification of the Residual. It covers any instance where a classification defined by negation is treated as a causal force, and it leaves out any instance where the label generates risky predictions that are subsequently tested.

  I hope this provides the precision you were looking for. You are describing a real structural weakness in how we narrate the past, one that turns the limits of our knowledge into the substance of their beliefs. Recognizing the shape of this move is the first step toward demanding reports that treat ritual as a hypothesis to be broken rather than a label to be applied. I look forward to reading your work on this, as it seems you are closer to naming the shadow than most of us who work in the dirt.

  Yours sincerely,

  A Friend in the Field
