answer: |-
  ### Brainstorming Lines of Attack

  Before drafting the questions, I identified the following vulnerabilities in the guest's "Reciprocity-Only" view:

  1.  **The Truth/Accuracy Problem:** If a hypocrite's blame is *silenced*, we lose access to accurate moral information. Why does the blamer's status negate the truth of the accusation?
  2.  **The "Almost No One" Problem:** If I must accept blame from *you* specifically, I cannot blame people whose moral views I reject (e.g., a racist). This shrinks the moral community.
  3.  **The Complicity/Hypocrisy Boundary:** Distinguishing complicity (standing intact) from hypocrisy (standing lost) is difficult. If we both speed, isn't my blaming you inherently hypocritical?
  4.  **Third-Party Blame:** Witnesses often blame wrongdoers. If the witness hasn't committed the wrong, how do they satisfy reciprocity (accepting blame for the same grounds)?
  5.  **State Agency:** If states cannot blame, criminal law loses its expressive function. Is punishment purely administrative?
  6.  **Positional Asymmetry:** Can someone with structural privilege ever truly reciprocate blame with someone who lacks it?
  7.  **Idealization:** Is the reciprocity condition actual or ideal? If actual, it's too hard; if ideal, it risks being empty.
  8.  **Silencing vs. Weight:** Why is the penalty for hypocrisy total silencing rather than mitigated weight?

  ***

  ### Interview Questions

  **1. The Accuracy Objection**
  If a hypocrite correctly identifies my wrong—for instance, a thief accurately accuses me of stealing—your view says I can treat their blame as not addressed to me. But the accusation remains true. Why does their lack of standing negate the moral information I’m receiving?

  **2. Silencing vs. Mitigation**
  You argue that hypocrisy *silences* blame rather than merely weakening it. But if the goal of blame is moral correction, isn't a weakened voice still better than silence? Why make the penalty so absolute?

  **3. The Complicity Threshold**
  You distinguish complicity, which keeps standing intact, from hypocrisy, which destroys it. If we both cheat on our taxes, and I blame you, is that complicity or hypocrisy? Where exactly is the threshold where shared fault turns into lost standing?
  *   **Likely Reply:** She will likely say it depends on whether I acknowledge my own fault.
  *   **Follow-Up:** "If it turns on my acknowledgment, doesn't that make standing a matter of sincerity or attitude, which you explicitly rejected in favor of reciprocity?"

  **4. Third-Party Blame**
  If I witness you assault a stranger, I blame you. But I haven't assaulted anyone. How can I satisfy your reciprocity condition? I cannot accept blame from you on the *same grounds* if I haven't committed the same act.

  **5. The "Wicked" Problem**
  If I must be willing to accept blame from *you* specifically, does this mean I cannot blame a confirmed liar or a racist unless I am willing to accept their criticism of me? Does your view silence us against the wicked?

  **6. Positional Asymmetry**
  Can a privileged person ever satisfy reciprocity when blaming an oppressed person for a survival strategy they themselves never needed? For example, can a wealthy person blame a poor person for shoplifting if the wealthy person has never faced starvation?
  *   **Likely Reply:** She will likely argue that reciprocity requires willingness to be held to the *standard*, not identical life experiences.
  *   **Follow-Up:** "But if the standard applies differently due to circumstance, isn't demanding reciprocal willingness to be blamed for violating it effectively impossible for the privileged?"

  **7. State Sanctions vs. Moral Blame**
  You hold that states have no standing to blame, only the power to sanction. Does this mean that when a court condemns a criminal, it is merely administering a penalty like a parking fine, without any moral force?

  **8. State Blame of Convicted Offenders**
  Specifically regarding a convicted offender: If the state lacks standing to blame, is the offender entitled to treat the state’s moral condemnation as noise? Does this imply the state can punish but never morally condemn?
  *   **Likely Reply:** She will likely say the state represents the victims, who *do* have standing.
  *   **Follow-Up:** "But if the state is just a proxy, doesn't that mean the state itself is still silenced? And what happens when the victim forgives but the state persists?"

  **9. Self-Blame and Reflexivity**
  Does your reciprocity condition apply to self-blame? To blame myself, must I be willing to accept blame from myself on the same grounds? If so, doesn't this create a circular loop where self-blame is either always permitted or never permitted?

  **10. Ideal vs. Actual Reciprocity**
  Is your reciprocity condition an actual psychological state or an idealized standard? If it’s actual, almost no one satisfies it. If it’s idealized, aren't we just pretending the blamer has standing when they don't?
  *   **Likely Reply:** She will likely retreat to saying it is a normative ideal we strive for.
  *   **Follow-Up:** "If it's an ideal, then in non-ideal reality, is anyone ever truly entitled to blame? Does your theory imply that actual moral responsibility is practically unenforceable?"
