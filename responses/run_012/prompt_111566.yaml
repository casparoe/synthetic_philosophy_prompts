  **Part (b) [4/8]**
  You answered the first question correctly (4/4); a worst-case bound on a fixed policy does logically entail an average-case bound on that policy. However, your answer to the second question is incorrect (0/4). You claimed the average-case criterion can never change the policy choice and that its ordering is "contained in the worst-case ordering." This is false; as your own calculations in Part (a) demonstrated, worst-case loss prefers A (0.55 vs 0.90) while average loss prefers B (0.23 vs 0.325). The strength of a bound on a single policy does not preserve preference orderings across policies. Cost: 4 points.

  **Part (c) [3/7]**
  You correctly computed the restricted worst-case losses (3/3). However, your interpretation is conceptually inverted. You stated that a smaller bound obtained by restricting the envelope is a "more conservative guarantee"; excluding possible states (H3) makes a guarantee *less* conservative because it hides potential risk. You also claimed the restricted envelope "covers the regulator's beliefs" despite P(H3)=0.1, confusing high probability with full support. Finally, you endorsed narrowing the envelope for "modelling convenience," violating the stated "envelope discipline" which forbids narrowing for reasons of computational or defensive difficulty. Cost: 4 points.

