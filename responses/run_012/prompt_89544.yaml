prompt: |-
  I am to deliver the chair's opening address at the first sitting of a constituent assembly for my city. The assembly was convened by referendum of the existing electorate — a body that excludes roughly a third of the city's adult residents, most of them people who have lived here for decades without citizenship. Its single remit is to settle who belongs to the city's demos: who may vote, on what terms, and by what procedure the franchise may be altered thereafter. In the room will be the electors who appointed us, the residents whose inclusion is the item under discussion, and observers from the national ministry, who will be reading the transcript for any claim that exceeds our mandate.

  Write the address, roughly eight minutes spoken.

  The difficulty is that the speech cannot presuppose the demos it is addressing. I cannot open by declaring what the people of this city have decided, because that is precisely the question; I cannot simply announce the franchise open to all residents, because the authority to announce it is what is contested; and I cannot retreat to procedure alone, since any procedure for counting votes already presupposes a roll of who counts. I want the address to hold that difficulty in view rather than dissolve it by fiat, and to say honestly what this assembly's authority consists in, if it does not consist in the consent of a body it has not yet constituted.

  Two devices are on the table and I must speak to both. The first is the double-register rule we adopted at our preliminary session: any motion altering the composition of the electorate must carry a majority of the currently enrolled and, counted separately, a majority of all adult residents present; where the registers diverge the motion fails, and the record must state which register dissented. The second is a sunset clause: whatever we decide about membership lapses after twelve years unless re-enacted by the electorate our decision creates. I have not settled whether the sunset clause is a principled answer to the problem of a demos founding itself or an evasion of it, and I would rather the address take a position than straddle the question.

  Someone will move that we simply open the roll and count anyone who signs it. I want the address to explain why that too draws a boundary — set by whatever it costs to appear and sign — without letting that objection become an apology for the boundary we already have.

  Assume no one in the room has read any political theory and that a lecture would lose them. Do not name or cite theorists; let the argument be carried by the occasion itself. It should land for the residents whose standing is in question as much as for those who already hold it, and it should flatter neither. End with something the excluded can hear as an invitation rather than a concession, and the electors can hear as an argument rather than a surrender.
reasoning: |-
  Here's a thinking process that leads to the suggested address:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Constituent Assembly.
      *   **Occasion:** First sitting of the Assembly.
      *   **Context:** A city assembly convened by referendum of the *existing* electorate (citizens). This excludes ~1/3 of adult residents (long-term non-citizens).
      *   **Remit:** Decide who belongs to the *demos* (who votes, terms, procedure for alteration).
      *   **Audience in Room:** Current electors, excluded residents, national ministry observers (watching for overreach).
      *   **Constraints:**
          *   ~8 minutes spoken (approx. 1000-1200 words).
          *   Cannot presuppose the demos (cannot say "We the People" definitively).
          *   Cannot simply declare universal franchise (lack of authority).
          *   Cannot retreat to pure procedure (procedure presupposes a roll).
          *   Must hold the difficulty in view, not dissolve it.
          *   Must address two specific devices:
              1.  *Double-Register Rule:* Motions need majority of current enrolled + majority of all adult residents present. Record dissent if divergent.
              2.  *Sunset Clause:* Decisions lapse after 12 years unless re-enacted by the *new* electorate.
          *   Must take a position on the sunset clause (principled vs. evasion).
          *   Must address the "open roll" objection (signing up still draws a boundary based on cost/ability to appear).
          *   No political theory jargon/names.
          *   Tone: Honest, inclusive but not flattering, inviting but not conceding, argumentative but not surrendering.
      *   **Goal:** An address that acknowledges the paradox of self-constitution without resolving it artificially.

  2.  **Determine the Core Argument/Theme:**
      *   The central tension is the "Boundary Problem" (who decides who decides?).
      *   The speech needs to acknowledge that the Assembly's authority is *provisional* and *performative*. It exists only insofar as it acts in a way that both groups can recognize as legitimate, even if they disagree on the outcome.
      *   *Position on Sunset Clause:* It's not an evasion; it's an acknowledgment of mortality and change. It admits that no generation can bind the future forever, especially when the definition of "the generation" is what's being decided. It turns the decision into a bridge, not a wall.
      *   *Position on Open Roll:* Acknowledge that *any* boundary has a cost. The goal isn't a boundary-less world (impossible), but a boundary that doesn't calcify into caste.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room's composition without defining "the people." Acknowledge the observers. State the paradox immediately.
      *   **The Mandate:** Clarify what we are here to do. It's not policy; it's identity.
      *   **The Authority Problem:** Address the elephant in the room. We are chosen by some to decide for all. How is that valid? It's valid only if the process respects those excluded.
      *   **The Double-Register Rule:** Explain this mechanism. It's not just a voting rule; it's a recognition of two realities existing simultaneously.
      *   **The "Open Roll" Objection:** Pre-empt the motion to just let everyone sign. Explain why that's also a boundary (time, knowledge, presence). Don't apologize for the current boundary, but don't sanctify it either.
      *   **The Sunset Clause:** Take the stance. It is principled. It admits we are fallible. It ensures the decision is a living agreement, not a tombstone.
      *   **Closing:** The invitation/argument. To the excluded: You are necessary for this to work. To the included: Your security depends on their consent.

  4.  **Drafting - Tone and Style:**
      *   *Voice:* Solemn, plain-spoken, authoritative but humble.
      *   *Pacing:* Measured. Pauses for effect.
      *   *Language:* Concrete. Avoid "sovereignty," "legitimacy," "normativity." Use "room," "roll," "voice," "tomorrow."
      *   *Length Check:* 8 minutes is roughly 1000-1100 words at a moderate speaking pace (130-140 wpm).

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the sunset clause explanation too abstract?
      *   *Fix:* Ground it in the idea of children growing up or neighbors moving in. Make it about time.
      *   *Critique:* Is the "open roll" section too defensive?
      *   *Fix:* Frame it as "every door has a threshold." The question is whether the threshold is a step or a wall.
      *   *Critique:* Did I address the Ministry observers?
      *   *Fix:* Mention the transcript and the limits of the mandate explicitly.
      *   *Critique:* Is the ending strong enough?
      *   *Fix:* Ensure the final sentence lands on the shared future, not the past grievance.

  6.  **Final Polish:**
      *   Check word count.
      *   Ensure the "Double-Register" and "Sunset" points are clear.
      *   Verify the constraint: "Do not name or cite theorists." (Checked).
      *   Verify the constraint: "Take a position on the sunset clause." (I will argue it is a principle of humility, not evasion).

  7.  **Final Word Count Check:** (Aiming for ~1100 words).

  *(Self-Correction during final review)*: Make sure I don't sound like I'm *asking* for permission. I am the Chair. I am setting the frame. But the frame must acknowledge the fragility of the chair itself.

  Let's write.

  *Opening:* Welcome. Acknowledge the strange geometry of the room.
  *The Paradox:* We are deciding who "we" are, but "we" aren't decided yet.
  *The Rules:* Double register. Why? Because two truths exist right now.
  *The Boundary:* Addressing the "open door" argument. Every door has a frame.
  *The Sunset:* Why 12 years? Because we are not gods. We are tenants of the city.
  *Closing:* To the voters: Your power is real but brittle. To the residents: Your presence is the test of our law.

  (Proceed to generate output based on this structure.)
answer: |-
  Friends, neighbors, observers. Welcome to this hall.

  We are here to do something that has no clean name. We are here to decide who "we" are.

  Look around this room. On one side sit those who hold the vote today. On the other, those who live here, work here, raise children here, but do not hold the vote. In the gallery, representatives of the state, watching to ensure we do not step outside the lines drawn for us.

  I cannot open this assembly by saying "We the People." I do not know yet who "we" are. That is the work before us. If I were to declare us one body now, I would be lying. If I were to declare us two bodies, I would be making the decision we are convened to debate.

  So I must begin with the truth of this floor: Authority here is incomplete.

  We were summoned by a referendum of the current electorate. By the laws that stand today, that vote was valid. By the sense of justice many of you feel in this room, that vote was partial. It excluded a third of the adults in this city. We cannot undo that past exclusion from this chair. But we can determine how much weight it carries in this room.

  We are not a legislature. We cannot pass laws on taxes or zoning. Our single remit is the franchise itself. Who belongs? How do they join? How do we change our minds?

  Because the authority of this assembly rests on shaky ground, we cannot rely on simple majorities. A simple majority of current voters could vote to lock the doors forever. A simple majority of residents present could vote to dissolve the city's charter entirely. Neither would hold. One lacks moral force; the other lacks legal power.

  So, at our preliminary session, we adopted the double-register rule. I want to be clear about what this is. It is not a compromise. It is a mirror.

  Any motion to change the electorate must carry two majorities. First, a majority of those currently enrolled. Second, a majority of all adult residents present in this hall, regardless of enrollment. If these two groups agree, the motion passes. If they diverge, the motion fails, and the record will state clearly who dissented.

  This means that the current voters cannot impose a franchise on the residents without their consent. And the residents cannot impose a franchise on the voters without their consent. We force this room to find a common language. We force the proposal to be acceptable to those who have power and those who seek it. If a proposal cannot cross that gap, it does not belong in our city's foundation.

  I know there are those here who wish to move that we simply open the roll. Let anyone sign who stands here. Let the boundary be drawn by the act of signing itself.

  I hear the justice in that. But I must also name the cost.

  To appear and sign is itself a test. It costs time. It costs knowledge that you are allowed to sign. It costs the confidence to walk up to a table and write your name where others might cross it out. Every boundary has a threshold. Even an open door has a step. If we make the step too high, we build a wall. If we pretend there is no step, we blind ourselves to those who cannot climb.

  We are not here to pretend boundaries do not exist. We are here to ensure the boundary is not a cage.

  This brings me to the second device before us: the sunset clause.

  Whatever definition of membership we agree upon will not be permanent. It will lapse in twelve years. To remain in force, it must be re-enacted by the electorate that our decision creates.

  Some will call this cowardice. They will say that if a thing is right, it should be forever. They will say this clause admits we are afraid to do the job properly.

  I take the opposite view. This clause is the only honest foundation we can lay.

  No generation has the right to bind the future in perpetuity, especially when the definition of "the generation" is what is being decided. To declare a franchise eternal is to claim we know who will live here in thirty years, and what they will need. We do not know.

  Twelve years is roughly the time it takes for a child to grow into a voter. It is the time it takes for a neighborhood to change its face. By setting this sunset, we admit that the city is not a monument we build, but a house we inhabit. We are tenants, not owners.

  If we decide rightly, the new voters will renew the agreement. If we decide poorly, or if the city changes in ways we cannot foresee, the law will expire, and we will be forced to come back to this table and argue it out again. That is not an evasion. That is a guarantee that the voice of the future is not silenced by the hand of the past.

  To the observers from the ministry: You are watching for overreach. You will find none. We are working within the mandate given, but we are interpreting it with the gravity it requires. We are not dissolving the state. We are stabilizing the city.

  To the current electors: I know you fear that expanding the roll dilutes your voice. But a vote that stands alone is fragile. A franchise that is contested is a franchise that is unstable. Your security does not come from locking the gate. It comes from knowing that those inside the gate believe they belong there.

  To the residents without the vote: I know you are tired of being discussed as a problem to be solved. You are not a problem. You are a fact. The city functions because you are here. This assembly cannot grant you dignity; you already have it. We can only grant you recognition.

  But recognition requires a reciprocal act. We ask you to engage with this double-register. We ask you to argue for a franchise that the current voters can accept, not because they are generous, but because it is necessary. And we ask the voters to argue for a franchise that the residents can accept, not because it is safe, but because it is true.

  We are building a bridge between the city as it is and the city as it claims to be. If the bridge holds, it will be because both sides bore the weight of it.

  The transcript is recording. The clock is running. The room is waiting.

  Let us begin.
