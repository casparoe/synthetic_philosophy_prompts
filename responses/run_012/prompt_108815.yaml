  **Title:** Scaling Moral Weight: Brain Size, Welfare Capacity, and Theories of Value

  **Research Question**
  Under which theories of welfare does neural scale directly determine moral weight independent of moral status, and is "capacity for welfare" conceptually distinct from "cognitive sophistication"?

  **Problem Statement**
  Debates in animal ethics and AI moral status frequently invoke brain size or complexity as a heuristic for moral consideration. However, this reliance is theoretically unstable. Proponents typically treat size as a proxy for the threshold of sentience (moral status), yet retreat to calling it a crude measure when pressed for justification. Opponents dismiss it as phrenology, ignoring the possibility that quantitative physical differences might track quantitative moral differences. Both sides conflate moral status (binary: do you count?) with moral weight (scalar: how much do you count?). This project argues that brain size, if relevant, matters for weight, not status, and its relevance is contingent on specific theories of welfare.

  **Critique of Standard Positions**
  Three standard positions leave the core question open. First, the *Pure-Proxy View* holds size indicates sentience. This fails to address beings known to be sentient; it offers no account of why a larger sentient brain matters more than a smaller one once the status threshold is crossed. Second, the *Irrelevance View* dismisses size as morally inert once capacity is established. This ignores hedonistic possibilities where experiential intensity or simultaneity scales with neural complexity. Third, the *Naive Scalar View* assumes bigger brains entail greater moral worth. This lacks normative grounding and conflates cognitive sophistication with welfare capacity.

  **Hypothesis and Methodology**
  My hypothesis is that neural scale tracks the *quantity* of welfare-relevant states, not necessarily the *quality* of cognition. On a hedonist view, a larger brain might support more simultaneous valenced states, increasing moral weight. On desire-satisfaction or objective-list views, size may drop out entirely, as welfare depends on relation to objects of desire or objective goods, not neural volume. Furthermore, I will disentangle "capacity for welfare" from "intelligence." Intuitively, a smarter being does not necessarily suffer more intensely. I will argue that cognitive complexity tracks problem-solving, while neural scale (on some views) tracks the bandwidth of experience. Failing to distinguish these leads to category errors in weighting.

  **Semester Plan**
  *Months 1-2:* Conceptual mapping. Define "moral weight" vs. "status" and catalog theories of welfare (hedonism, desire, objective list). Establish working definitions of "neural scale" applicable across biological and synthetic substrates.
  *Months 3-4:* Comparative analysis. Test each welfare theory against the variable of neural scale. Determine which theories permit size to affect weight. Draft the argument distinguishing welfare capacity from intelligence.
  *Month 5:* Objection handling. Address counterarguments regarding unity of consciousness and integration vs. sheer volume.
  *Month 6:* Synthesis and drafting. Produce a paper arguing for a conditional relevance of brain size dependent on welfare theory.

  **Conceptual vs. Empirical**
  Neuroscience can identify correlations between brain size and cognitive function, but it cannot determine normative significance. Empirical data tells us what systems exist, not whether physical scale morally matters. Waiting for neuroscience presupposes that the moral question is empirical rather than normative. We must first establish *why* size would matter before measuring *if* it correlates. Without a normative framework, additional data remains morally inert. A conceptual approach is prerequisite to empirical application.

  **Risk Assessment**
  The project risks failure if the distinction between status and weight proves untenable or if "neural scale" cannot be coherently defined across species and AI architectures. There is also a risk of scope creep; attempting to solve this for both biological animals and synthetic AI simultaneously may be too ambitious. To mitigate this, I will focus primarily on biological cases as the baseline, extending to AI only where the structural analogy holds. If I cannot successfully distinguish welfare capacity from intelligence by month 4, the project will need to narrow to purely meta-ethical implications rather than applied recommendations.
