answer: |-
  This is a sharp observation. You have identified two distinct methodological problems that often get conflated in popular anthropology and archaeology. The first is a statistical/sampling error; the second is a rhetorical strategy used to shield that error from criticism.

  Here is the breakdown of the names, the mechanics, and the direction of the bias.

  ### (a) The Bias: "Residual Population Bias" (a species of Selection Bias)

  You are right to hesitate on **Survivorship Bias**. While they are cousins, they operate in opposite directions.

  *   **Survivorship Bias** typically focuses on the *winners*. (e.g., studying successful companies to learn how to succeed, ignoring the failed ones). It inflates the perceived quality of the group.
  *   **Your Scenario** focuses on the *leftovers*. The foraging groups available for study in the 19th and 20th centuries were not the "winners" of the foraging lifestyle; they were the groups that survived *because* they occupied ecological niches that farmers didn't want.

  In statistics and epidemiology, this is strictly **Selection Bias** (specifically, **Sampling Bias**). However, in anthropology and archaeology, this specific dynamic has a more descriptive name: **Residual Population Bias** (sometimes called the **"Marginal Man" problem**).

  It was the central engine of the **"Kalahari Debate"** of the 1980s and 90s. Anthropologists had long studied the !Kung San of the Kalahari Desert as "pristine" hunter-gatherers. Critics (like Edwin Wilmsen) later demonstrated that the !Kung were not pristine isolates; they were likely agropastoralists who had been pushed into the desert by expanding Bantu and European states. They were a residual population.

  **Does the bias make farming look better or worse?**
  It makes farming look **better** (or at least, less catastrophic) than it likely was.

  Here is the logic:
  1.  **The Reality:** Prehistoric foragers lived in the most fertile, resource-rich environments (the Nile, the Fertile Crescent, the Indus).
  2.  **The Proxy:** Modern ethnographic foragers lived in marginal environments (deserts, swamps, tundra) *because* they were displaced from the fertile ones.
  3.  **The Comparison:** When you compare a farmer in a fertile valley to a forager in a desert, the gap in quality of life narrows. The forager looks more stressed, more malnourished, and more labor-constrained than a prehistoric forager in a fertile valley would have been.
  4.  **The Result:** If you use the marginal forager as your baseline, the "decline" into farming looks smaller. It makes the adoption of agriculture look like a more reasonable, less disastrous trade-off.

  There is a second layer to this you mentioned: **Preservation Bias** (farmers leave pots; foragers leave bones). This compounds the first bias. Because forager social structures (like chiefs or monuments) were often ephemeral (wood, skin, ritual), while farmer structures were permanent (stone, grain stores), the archaeological record makes foragers look *simpler* than they were. This makes the transition to farming look like "progress" (complexity) rather than "restriction" (hierarchy).

  So, both biases work in tandem to soften the critique of agriculture. They make the "trap" look more like a "ladder."

  ### (b) The Move: "Methodological Immunization"

  The second thing you describe—acknowledging the flaw in the introduction and then ignoring it for forty pages—is a rhetorical strategy. In the sociology of science and argumentation theory, this is called **Methodological Immunization**.

  It functions like a vaccine: you inject a weakened form of the criticism (the caveat) into the text early on, which allows the body of the argument to build up antibodies against that criticism later. When a reviewer says, "But didn't you admit these foragers were marginal?" the author can point to page 4 and say, "I addressed that."

  Since you asked me to coin a term if none fit perfectly, I will offer one that captures the specific *bureaucratic* feel you described ("permission slip"): **The Pro Forma Caveat**.

  **Why this term?**
  *   **Pro Forma** means "as a matter of form." It signals that the action is being taken to satisfy a requirement, not to achieve a substantive result.
  *   **Caveat** implies a warning.
  *   Together, **The Pro Forma Caveat** describes a warning that is issued to clear the author's conscience (or pass peer review) without imposing a tax on the conclusion.

  **What does this term leave out?**
  Coining a term always sacrifices nuance. Here is what **The Pro Forma Caveat** leaves out:

  1.  **It ignores genuine uncertainty.** Sometimes an author acknowledges a limitation because they genuinely don't know how to solve it, yet the data is all they have. In those cases, the caveat isn't a "permission slip"; it's an honest confession of desperation. The term implies malice or laziness where there might just be a lack of better data.
  2.  **It masks the "Lesser of Two Evils" logic.** Sometimes authors proceed despite the bias because the alternative (no comparison at all) is worse. They might argue, "Yes, these foragers are marginal, but they are the *only* window we have." The term "Pro Forma" suggests the caveat is decorative, whereas the author might view it as a necessary burden they are carrying throughout, even if they don't explicitly adjust the numbers.
  3.  **It doesn't capture the *seduction* of the narrative.** The reason the caveat is ignored isn't just to dodge criticism; it's because the narrative (e.g., "The Fall from Grace" or "The March of Progress") collapses without the comparison. The term focuses on the *defense* mechanism, but leaves out the *narrative dependency* that drives the move.

  ### Summary

  *   **The Bias:** **Residual Population Bias** (a specific form of Selection Bias). It makes farming look **better** by underestimating the quality of life of prehistoric foragers.
  *   **The Move:** **Methodological Immunization**, or more specifically, **The Pro Forma Caveat**. It acknowledges the limit to neutralize it, rather than to obey it.

  You are correct that this is the central tension in the "farming was a mistake" literature. When James C. Scott or David Graeber argue against the standard narrative, they are often trying to break the **Pro Forma Caveat** to show that the **Residual Population Bias** has been hiding the true cost of civilization.
