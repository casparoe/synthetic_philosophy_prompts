  6.  **Review and Refine:**
      *   *Check:* Did I distinguish akrasia from level-splitting in the marking scheme? Yes.
      *   *Check:* Is the case tight? Yes, Priya's situation mirrors the philosophical structure.
      *   *Check:* Is the model answer plausible? 700 words is about 1.5 pages single spaced. A strong grad student can write that in 90 mins if they don't waste time on intro/fluff. I will ensure the model answer is punchy.
      *   *Check:* Is the tone right? Needs to sound like a colleague helping a colleague.
      *   *Refinement on Marking:* Ensure the "B answer" notes are specific. Instead of "less depth," say "fails to explain why the critique re-opens the undermining."

  7.  **Final Polish:**
