          2.  Apply to Priya (Level 1 HOE).
          3.  Introduce the Akrasia reply.
          4.  Introduce the Level 2 HOE (the critique).
          5.  Analyze if Akrasia survives Level 2 (The Regress).
          6.  Identify the Cost (e.g., alienation from reasoning, guidance problem).
          7.  Verdict.
      *   *Content:* Needs to show the difference between "I believe D" and "I believe I shouldn't believe D." Needs to show why SUO targets conciliationism (it demands lowering confidence in the very reasoning used to lower confidence).
      *   *Tone:* Analytic, decisive.

  5.  **Drafting the Marking Scheme:**
      *   5 Criteria x 5 Marks.
      *   *Criterion 1: Precision on Self-Undermining.* Must explain *why* it hits conciliationism (the reasoning used to conciliate is itself subject to the HOE). *B-mistake:* Vague definition ("it says you're wrong").
      *   *Criterion 2: Akrasia vs. Level-Splitting.* Must distinguish holding contradictory attitudes vs. distinct attitudes at distinct levels. *B-mistake:* Treating them as synonyms.
      *   *Criterion 3: Application to Priya's Regress.* Must address the Level 2 evidence (the critique). Does the akratic state hold up? *B-mistake:* Ignoring the critique/Level 2.
      *   *Criterion 4: The Cost.* Must name a substantive cost of accepting rational akrasia (e.g., loss of guidance, fragmentation). *B-mistake:* Saying "it's counterintuitive" without explaining why it matters epistemically.
