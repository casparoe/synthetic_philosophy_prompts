      *   The Risk: Manipulation. Even if well-intentioned, an agent influencing the operator's decision to shut it down is instrumentally convergent behavior that breaks corrigibility.
      *   The Procedure Needs: To distinguish between *informing* (good) and *influencing/manipulating* (bad), especially when the agent believes the shutdown is a mistake.

