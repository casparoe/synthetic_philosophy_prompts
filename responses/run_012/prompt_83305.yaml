prompt: |-
  So I'm a clinical ethics fellow and I've been volun-told to cover a 90-minute teaching slot next month for a mixed group — secound-year med students plus two nurses and a social worker who sit on our ethics committee — and the topic that got dumped on me is "why do advance directives bind?", which sounds like a non-question until you actually try to teach it and realise the room thinks it's just a paperwork problem. I don't want you to explain the ethics of advance directives to me, I know roughly where I stand; I want a plan for the session. Specifically: what has to be in place before the question even looks like a question (I think it's something about a person being spread out over time and one slice of her getting to boss another slice around, but I can never get that onto the board without it sounding like a sci-fi puzzle), the order the pieces have to come in and what depends on what, and where in that order I should break the news that "it's just respect for autonomy" is doing almost none of the work.

  The case I want to build it around — tell me if it's the wrong one: a woman in her early sixties with early-onset Alzheimer's who, five years ago, while fully herself, wrote not a form but a long letter to her daughter, refusing antibiotics and hospital admission in the late stages, and who put into it a clause I've never seen on any actual form — roughly "if I start telling you I want to go to the hospital, that is the disease talking, not me; I watched my father do this." Call it a counter-interpretive clause: a bit of the directive that's about how to read the later me rather than about what to do. Now she has pneumonia, and she's having a good week, and she says, coherently, that she wants to be treated, and she seems to mean it. I want that example to carry the whole session, so I need to know what it has to have (a real conflict, an earlier self who was competent, a later self who is not simply gone) and what it should deliberately lack — I'm inclined to strip out any whiff of "the real her is the one before the dementia", is that right? And if your instinct is to tell me to just use Odysseus and the mast, say why that does or doesn't do the job.

  Then the misconceptions, in the order they'll actually surface in a room like this, and exactly where in the sequence I head each one off: that autonomy does all the work here; that the competent-at-the-time criterion settles it; that a directive is basically a contract with the hospital rather than an instruction, or a piece of testimony about what she valued; that capacity is a yes/no switch; and whatever else you think secound-years reliably produce. Also tell me what I should openly refuse to cover at this level and say so out loud — I'm tempted to do a little block on the metaphysics of personal identity and I suspect that's a trap — and give me one closing question, ideally a new case rather than a rehash of mine, that will tell me whether they've got the structure of the problem or just learned my example.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the User and Request:**
      *   **User:** Clinical Ethics Fellow. High level of expertise, knows the literature, knows the pitfalls.
      *   **Task:** Design a 90-minute teaching session.
      *   **Audience:** Mixed group (2nd-year med students, 2 nurses, 1 social worker on the ethics committee). This is crucial. Med students want rules/cases; nurses/social workers care about process/relationships. The mix means avoiding overly abstract theory while not dumbing it down.
      *   **Topic:** "Why do advance directives bind?" (The normative force of ADs).
      *   **Constraint 1:** Do *not* explain the ethics to the user. They know it.
      *   **Constraint 2:** Provide a *plan* (structure, sequencing, dependencies).
      *   **Constraint 3:** Address the "person over time" problem without it sounding like sci-fi.
      *   **Constraint 4:** Integrate the specific case (Alzheimer's, letter with counter-interpretive clause, current coherent request for treatment).
      *   **Constraint 5:** Address specific misconceptions in order of appearance.
      *   **Constraint 6:** Identify what *not* to cover (metaphysics trap).
      *   **Constraint 7:** Provide a closing assessment question (new case).
      *   **Tone:** Professional, peer-to-peer, sophisticated but practical.

  2.  **Deconstruct the Core Problem:**
      *   The user identifies the core tension: "One slice of her getting to boss another slice around." This is the *diachronic autonomy* problem.
      *   The user wants to avoid the "Real Her = Past Her" essentialism. This is wise. It alienates caregivers and ignores the reality of the current patient.
      *   The "Counter-Interpretive Clause" is the killer feature of the case. It anticipates the change in preference *as* a symptom. This moves it beyond standard Ulysses contracts.
      *   The "Respect for Autonomy" slogan is insufficient. Why? Because there are two autonomy claims in conflict (Past vs. Present). We need a meta-principle to adjudicate.

  3.  **Drafting the Session Structure (90 Minutes):**
      *   *Introduction (10 min):* Hook them with the case immediately. Don't start with definitions.
      *   *Phase 1: The Intuitive Pull (20 min):* Why do we feel the directive matters? (The "Paperwork" misconception).
      *   *Phase 2: The Conflict (25 min):* The "Two Selves" problem. Dismantling "Autonomy" as a monolith.
      *   *Phase 3: The Normative Grounding (25 min):* If not just autonomy, then what? (Integrity, Narrative, Harm).
      *   *Conclusion/Assessment (10 min):* The new case.

  4.  **Refining the Case (The Alzheimer's Letter):**
      *   *Must Haves:* Competence at t1, altered state at t2 (but not vegetative), explicit conflict, the "counter-interpretive clause."
      *   *Must Lacks:* "Real Her" language. We must treat Current Patient as a moral patient, not a shell.
      *   *Odysseus Check:* The user asked about Odysseus. Odysseus works for *pre-commitment* (Ulysses contracts) where the agent *wants* to be bound. Here, the agent *claims* to want otherwise, but the past self said "ignore that wish." It's stronger than Odysseus because the current desire is framed as inauthentic by the past self. I should advise using Odysseus as a *contrast*, not the model.

  5.  **Addressing Misconceptions (Sequencing):**
      1.  *Paperwork/Contract:* Address first. It's the surface level.
      2.  *Competence Switch:* Address second. Students think capacity is binary.
      3.  *Autonomy does all the work:* Address third (the core theoretical pivot).
      4.  *Testimony vs. Command:* Weave this into the grounding phase.

  6.  **The "Metaphysics Trap":**
      *   The user is right. Don't do Parfitian reductionism with 2nd-year students. It leads to nihilism ("She's a different person, so the directive is void"). Keep it *narrative* and *relational*, not *ontological*.

  7.  **Developing the Closing Question:**
      *   Needs to test the *structure*, not the *content*.
      *   Avoid dementia (too similar).
      *   Avoid death (too high stakes/final).
      *   Maybe psychiatric? Or religious conversion?
      *   *Idea:* A Jehovah's Witness who loses capacity after a traumatic brain injury, but the family says he was "softening" his views before the accident, though he never updated the card. Or better: A chronic pain patient who signed an agreement no opioids, now in crisis begging for them.
      *   *Better Idea:* The "Depressed Researcher." Someone who refused treatment for depression in an AD, now severely depressed and refusing treatment *again* (wait, that's concurrent).
      *   *Best Idea:* The "Religious Shift." A person who was devout, made a directive based on religious grounds (no blood), then became secular but forgot to change the directive, now unconscious. *Wait, that's the reverse of the user's case.*
      *   *Let's try:* The "Risk-Taker." A professional stuntman who signs a waiver/AD refusing life-prolonging care after a stunt accident. He survives, is cognitively impaired but happy, gets pneumonia, wants treatment. Family says "He lived for the thrill, he wouldn't want to be a burden."
      *   *Actually, let's stick closer to the "Counter-Interpretive" structure.* A patient with a history of suicide attempts who signed a directive: "If I try to kill myself, treat me even if I say no, because I know my mind lies." Now they overdose and say "Let me die."
      *   *Decision:* The Psychiatric Pre-commitment case. It mirrors the "disease talking" clause without being dementia.

  8.  **Fleshing out the "Why it Binds" Argument:**
      *   It's not just Autonomy. It's *Integrity of the Life Story*.
      *   It's *Relational Authority* (protecting the surrogate from guilt).
      *   It's *Epistemic Humility* (acknowledging we don't know what the disease does to values).

  9.  **Review against Constraints:**
      *   90 mins? Yes.
      *   Mixed audience? Yes (focus on communication/relationship, not just law).
      *   No ethics lecture to the fellow? Yes.
      *   Case critique included? Yes.
      *   Metaphysics avoided? Yes.

  10. **Final Polish:** Ensure the tone is collegial ("You know this, but here's how to sell it"). Make sure the "Order of Operations" is clear. (Self-Correction: Make sure to emphasize *when* to drop the "Autonomy isn't enough" bomb. It needs to be after they feel the weight of the current patient's suffering).

  11. **Drafting the Response:** (Iterative refinement of the sections).
      *   *Session Arc:* Case -> Intuition -> Problem -> Theory -> Application.
      *   *The "Sci-Fi" Problem:* Solve this by framing it as "Narrative Coherence" rather than "Personal Identity."
      *   *The Odysseus Question:* Be specific. It helps with *binding*, fails with *interpretation*.
      *   *The Closing Case:* Ensure it tests the "Counter-Interpretive" logic.

  12. **Final Check:** Did I answer the specific prompt about "what has to be in place before the question even looks like a question"? Yes, need to establish the *continuity of interest* first.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sharp brief. You're right that "Why do they bind?" collapses if you treat the directive as a static document rather than a dynamic claim about authority over time. With a mixed group (students + committee members), the danger is the students want a rule and the committee members know there isn't one.

  Here is a 90-minute session plan designed to move them from "paperwork compliance" to "normative justification," using your case as the engine.

  ### 1. The Pre-Conditions: Making the Question Visible
  You asked what has to be in place before "Why does it bind?" looks like a real question. If you skip this, the room defaults to legalism. You need to establish **Continuity of Interest** before you establish **Conflict of Will**.

  *   **The Trap:** If you present the case as "Past Self vs. Present Self," the nurses/social workers will instinctively protect the vulnerable body in front of them (Present Self), and the students will protect the legal document (Past Self).
  *   **The Fix:** You must frame the directive not as a command from a stranger, but as a *continuation of a project*.
  *   **Board Work:** Do not draw a timeline with "Person A" and "Person B." Draw a single line labeled "Life Narrative." Mark two points: *t1* (Competent, planning) and *t2* (Impaired, experiencing).
  *   **The Dependency:** The question "Why bind?" only arises if we accept that *t1* has legitimate authority over *t2*. To get them to accept that, you must first establish that *t1* was acting to protect *t2's* deeper values, not just *t1's* preferences.
  *   **Timing:** Spend the first 15 minutes establishing that the woman in the letter and the woman in the bed are the *same moral project*, even if they are different psychological entities. If you don't secure this, the rest is just a tug-of-war.

  ### 2. Case Critique: The Alzheimer's Letter
  Your case is excellent. It is superior to the standard "living will" because the **counter-interpretive clause** ("if I say I want to go, that is the disease") forces them to engage with *epistemology* (how do we know what she wants?) rather than just *authority* (who decides?).

  *   **Keep:** The specific clause. It is the hinge of the session. It forces the question: "Is her current request authentic?"
  *   **Keep:** The "good week." If she were delirious or in pain, it's too easy to dismiss her current wish. She must be *coherently* wrong (according to the directive) for the ethical tension to hold.
  *   **Strip:** Any language suggesting the "Real Her" is dead. You are right to avoid this. It alienates the nurses who are caring for the body in front of them. Instead, frame it as: "The woman in the bed is expressing a preference that the woman who wrote the letter predicted would be a symptom."
  *   **Odysseus Check:** Do **not** lead with Odysseus.
      *   *Why:* Odysseus works for *Ulysses Contracts* where the agent knows they will be tempted and wants to be restrained. In your case, the patient isn't just tempted; she has *changed her mind* and claims the change is valid.
      *   *Use:* Bring Odysseus in at minute 45 as a *contrast*. "Odysseus knew he wanted to be stopped. Our patient currently says she wants to go. Odysseus binds his hands; our patient binds her daughter's interpretation." This highlights that the directive is about **interpretive authority**, not just physical restraint.

  ### 3. Session Sequence & Misconception Management
  Here is the order of operations. Do not deviate, or the "Autonomy" misconception will swallow the room.

  **0:00 – 0:15: The Hook (The Case)**
  *   Read the letter excerpt. Read the current request ("I want the antibiotics").
  *   **Poll the room:** "Who treats? Who holds?"
  *   **Goal:** Surface the intuition that *both* sides have moral weight.
  *   **Misconception 1 (Paperwork):** Students will ask, "Is the letter legally valid?"
      *   *Shut it down:* "For this hour, assume it is legally valid. We are asking if it is *morally* binding."

  **0:15 – 0:35: The Competence Trap**
  *   **Misconception 2 (Capacity Switch):** Students think capacity is a light switch (On/Off).
  *   **Intervention:** Ask the nurses/social workers: "Can she understand the risk? Yes. Can she weigh it? Maybe. But does she understand *why* she previously refused?"
  *   **Key Move:** Shift from *Capacity* to *Authenticity*. The directive claims her current capacity is compromised not by cognition, but by *valuation*.
  *   **Board:** Write "Decisional Capacity" vs. "Narrative Authenticity."

  **0:35 – 0:55: The Autonomy Bomb**
  *   **Misconception 3 (Autonomy does all the work):** This is where you break the news.
  *   **The Pivot:** If you say "We follow the directive to respect autonomy," they will say "But what about her current autonomy?" You have two autonomies in conflict. Autonomy cannot adjudicate a conflict between two versions of itself.
  *   **The Replacement:** Introduce **Integrity** and **Relational Protection**.
      *   *Integrity:* We bind the directive to preserve the coherence of the life story, not just the whim of the moment.
      *   *Relational:* The directive protects the *daughter* from the burden of guessing. It binds the *surrogate* as much as the patient.
  *   **Timing:** Do not drop this until they feel the pain of the conflict. If you do it too early, it's theory. If you do it now, it's a solution.

  **0:55 – 1:15: The Normative Grounding (Why it Binds)**
  *   **Misconception 4 (Contract vs. Testimony):** Students view ADs as contracts with the hospital.
  *   **Correction:** Frame the directive as **Testimony**. It is evidence of what she valued when she could see the whole picture.
  *   **Discussion:** Why does past testimony outweigh present testimony? Because the past testimony accounts for the *condition* of the present testimony (the "disease talking" clause).
  *   **Misconception 5 (The "Best Interest" Fallback):** When stuck, students default to "What's best for her?"
      *   *Shut it down:* "If we do best interest, we burn the letter. Why did we write it?"

  **1:15 – 1:30: Assessment & Close**
  *   **What NOT to cover:** **The Metaphysics of Personal Identity.**
      *   *Say this out loud:* "You might wonder if she is literally the same person as five years ago. That is a metaphysical rabbit hole. In clinical ethics, we treat her as the same person for the sake of care. We are dealing with *narrative* identity, not *ontological* identity. Don't let the 'she's a different person' argument void the directive; that leads to nihilism."
  *   **The Closing Question (The Assessment):**
      *   Do not use a dementia case. Do not use a death case. Use a **Psychiatric Pre-commitment**.
      *   *The Case:* "A man with severe bipolar disorder signs a Ulysses contract: 'When I am manic, I will feel invincible and refuse meds. If I refuse meds while manic, treat me anyway.' He is now manic. He is not psychotic (no delusions), but he is spending savings and sleeping 2 hours. He says, 'I feel great, stop treating me.' He is coherent. He is not demented."
      *   *The Test:* Ask them: "Does the 'disease talking' clause from the Alzheimer's case apply here? Why or why not?"
      *   *Success Criteria:* If they say "Yes, because he predicted this change in valuation," they get the structure. If they say "No, because he's not demented," they are stuck on the diagnosis, not the ethics.

  ### 4. Summary of Dependencies
  1.  **Continuity** must be established before **Conflict**. (Otherwise it's just two strangers fighting).
  2.  **Conflict** must be felt before **Autonomy is critiqued**. (Otherwise the critique feels abstract).
  3.  **Autonomy critique** must precede **Normative Grounding**. (You can't offer Integrity/Relationality until Autonomy is shown to be insufficient).
  4.  **Metaphysics** must be explicitly excluded before **Closing**. (Otherwise the smartest student in the room derails the end with Parfit).

  ### 5. Facilitator Notes for the "Autonomy Bomb"
  When you hit the 35-minute mark and reveal that "Respect for Autonomy" is insufficient, expect resistance. The students have been trained that Autonomy is King.
  *   **Script:** "If autonomy is the only value, then the woman in the bed wins. She is autonomous right now. If the woman in the letter wins, it must be because of a *different* value. Is it fairness? Is it integrity? Is it protecting the family from guilt? Name the value, or you're just picking a favorite self."

  This structure keeps the "sci-fi" element grounded in clinical reality (the letter, the daughter, the pneumonia) while forcing them to confront the temporal tension without getting lost in metaphysics.
