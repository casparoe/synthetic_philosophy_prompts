answer: |-
  The thought experiment of gradual neuronal replacement is often wielded as a decisive proof for the viability of mind uploading. The argument is seductive in its simplicity: if we replace a person's neurons one by one with functionally equivalent silicon devices, and if no single replacement disrupts memory, disposition, or behavior, then the final silicon entity must be the original person. The reasoning relies on the transitivity of identity: if Stage 1 is identical to Stage 2, and Stage 2 to Stage 3, then Stage 1 is identical to Stage 1,000,000,000. However, this reasoning cannot establish the conclusion that the upload is numerically identical to the original person. When analyzed rigorously, the argument collapses under the weight of the Sorites paradox, forcing a choice between begging the question and abandoning the all-or-nothing nature of identity. Furthermore, the appeal to causal continuity, the most robust defense against this critique, fails to rescue the argument from these logical pitfalls.

  The pivotal premise of the replacement argument is that no single neuronal substitution could plausibly make the difference between surviving and not surviving. In philosophical terms, this is a **tolerance principle**. It asserts that for a predicate like "is the same person as," a change too small to matter in the relevant respect (one neuron) licenses the inference that there is no difference in status. This is the exact structural engine that generates Sorites paradoxes. In a classic Sorites, removing one grain from a heap does not make it a non-heap; by induction, removing all grains leaves a heap. Similarly, if replacing one neuron preserves identity, replacing all of them should preserve identity.

  However, applying a tolerance principle to personal identity creates a dilemma that prevents the argument from establishing its conclusion. The first horn of the dilemma is that the argument **begs the question**. To assert that a single neuron replacement *cannot* affect identity is to assume a specific criterion of identity—namely, functionalism or psychological continuity—while purporting to prove it. If one holds a somatic or biological view of identity (where being the same human organism is necessary for survival), then replacing even one critical biological component *could* constitute a break in identity. By stipulating that the replacement makes no difference, the proponent assumes that biological substrate is irrelevant to identity, which is precisely what is at issue. The tolerance principle is not a neutral logical truth; it is a metaphysical assertion disguised as a modest claim about small changes.

  The second horn of the dilemma is that the proponent must **commit to a criterion of survival on which survival comes in degrees**. Sorites paradoxes arise because vague predicates (like "heap," "bald," or "same person") do not obey classical bivalent logic over long chains of small increments. If we wish to avoid the absurdity of the conclusion (that a pile of silicon is a human heap) without begging the question, we must reject the strict transitivity of identity across the chain. This implies that identity is not an all-or-nothing relation but a matter of degree. Stage $n$ might be 99.9% the same person as Stage $n+1$, but over a billion steps, that similarity degrades. If survival is a matter of degree, then the conclusion that the final silicon system is the *very* person who began the process is false. It is, at best, a successor with a high degree of psychological overlap. Since the original argument claims strict numerical identity ("the very person"), accepting the Sorites structure forces the proponent to abandon the very conclusion they seek to prove.

  Defenders of uploading often anticipate this objection by invoking the **continuous causal process**. They argue that gradual replacement differs fundamentally from a "scan and copy" procedure because the former maintains an unbroken chain of causal dependency. The mind is not copied; it is migrated. This continuity, they claim, blocks the Sorites by providing a qualitative boundary: a process is either continuous or it is not.

  This rejoinder, however, does not do the work required of it. It faces two fatal objections. First, if it treats continuity as a **qualitative difference** that guarantees survival, it owes an account of why a gap in the process is fatal while a wholesale change of material is not. If I pause the replacement process for an hour, have I died? If the proponent says "yes," they posit a metaphysical brute fact where a temporal discontinuity destroys identity even if psychological states are preserved. If they say "no," then continuity is not the strict boundary they claimed, and we return to the question of how much discontinuity is permissible. Furthermore, if the material constitution changes 100% from carbon to silicon, why does the causal link matter more than the substance? To assert that the causal process trumps the material constitution is to re-assert the functionalist premise without justification, once again begging the question against the biological view.

  Second, if the rejoinder locates the difference in the **size of the steps**, it inherits the Sorites. Physical continuity is not a binary switch in a discretized microphysics. At the quantum level, interactions are discrete events. Where is the line between a "continuous" replacement and a "discontinuous" one? If I replace neurons very quickly, is the process discontinuous? If I replace them slowly, is it continuous? There is no microphysical distinction between one large step and many small ones that is not itself subject to a tolerance principle. If "continuity" is defined by the steps being small enough not to disrupt function, we are back to the original tolerance premise: "a change too small to matter." If there is no specific cutoff for how small is small enough, the Sorites returns. If there is a specific cutoff, it is arbitrary. Thus, the appeal to continuity cannot shield the argument from the vagueness inherent in the tolerance principle.

  Once the replacement argument is set aside, what can a proponent of uploading legitimately claim? They must give up the claim of **numerical identity**. They cannot prove that the person who wakes up in the silicon substrate is metaphysically the *same entity* as the one who entered the lab. The guarantee of strict survival is lost. However, they can still claim **psychological continuity and practical survival**. The upload will possess the original's memories, character, and intentions. It will believe it is the original, and it will continue the original's projects. For legal, moral, and emotional purposes, the upload may be treated *as* the person, because the functional relations that ground our social practices of responsibility and love are preserved. The proponent can argue that what matters in survival is not metaphysical identity, but psychological connectedness. But they must concede that this is a pragmatic concession, not a metaphysical proof. The Ship of Theseus may sail on, but we cannot prove it is the same ship, only that it sails just as well.
