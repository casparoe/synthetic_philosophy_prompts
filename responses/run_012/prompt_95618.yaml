answer: |-
  You have spotted the fault lines correctly. Your intuition that you might have built the novel on a misreading is not merely a worry; it is philosophically sound. Here is the plain truth of the matter, stripped of the academic padding.

  **First: Solitary Meaning**
  Your first assumption is correct, but only within the specific framework of Kripke's argument. Kripke argues that a solitary individual cannot distinguish between following a rule and merely thinking they are following a rule. Without a community to check you, to correct you, and to establish a norm of 'correctness' distinct from 'seeming correctness', there is no fact of the matter about what you meant.

  So, on Kripke's reading, a Robinson Crusoe cannot mean anything by his marks. He can make noises and scratches, but they do not carry semantic weight until Friday arrives to participate in the practice. If you accept Kripke's premises, your second survivor is not just a plot device; he is a metaphysical necessity for meaning to exist at all.

  **Second: Can the Community Be Wrong?**
  Here is where your second worry hits the nail on the head. You have identified the most damaging objection to the communitarian view. If meaning is constituted entirely by communal agreement, then the community cannot be wrong about its own meanings in any deep sense. There is no external standard against which to measure them.

  If your two survivors agree that a symbol means 'tide', then it means 'tide'. If they agree she was wrong, then she was wrong. But there is no 'fact of the matter' from the past that she violated. Kripke's sceptical argument explicitly denies that there was a fact about her past mental state or behaviour that fixed the meaning. Therefore, strictly speaking, she cannot be *discovered* to be wrong; she can only be *corrected*.

  This does kill the ending you described, if that ending relies on the revelation of an objective truth about her past mind. On the Kripkean view, there is no objective truth about her past mind to be found. The man cannot be 'right' about what she meant, because nothing she did alone settled what she meant. He can only impose a new meaning which she accepts. If you want the climax to be 'He discovered the truth of what I meant,' Kripke says that is impossible. If you want the climax to be 'He has taken authority over my language and I submit,' that works.

  **Is this specific to maths?**
  No. Kripke uses addition (the plus/quus example) because it is stark and clear, but the argument is intended to generalise to all rule-following, including ordinary language and private definitions. Your character's tide symbols are subject to the exact same sceptical problem as arithmetic.

  **Is this Kripke or Wittgenstein?**
  It is Kripke. This is crucial. Scholars distinguish between Wittgenstein and 'Kripkenstein'. Kripke admits he is presenting a sceptical argument inspired by Wittgenstein, not necessarily Wittgenstein's own final position. Many serious philosophers believe Kripke pushed Wittgenstein's ideas into a sceptical corner that Wittgenstein himself would have rejected. Wittgenstein was more interested in how language works in practice ('forms of life') than in the hard sceptical paradox Kripke constructs.

  **Is there a respectable alternative?**
  Yes. There is a very strong line of philosophical thought that rejects Kripke's scepticism. Many argue that your individual history, your causal interaction with the world, and your dispositions *are* sufficient to fix meaning.

  On this view, the world pushes back. If she used a symbol for 'low tide' and wrote it when the tide was high, the world itself (the water level) constrains the meaning. She can be wrong because there is a reality independent of her community that fixes the reference. If you take this view, you do not need the second survivor to make her meaning possible. You only need him to discover it.

  **The Verdict for Your Novel**
  You have not wasted your time, but you are relying on a controversial philosophical claim as if it were settled law.

  1.  **If you keep Kripke:** You must accept that there is no 'fact' she got wrong. The climax must be about power and agreement, not discovery. The man imposes an interpretation, and the community of two ratifies it. Her feeling that she was 'wrong' is a psychological reaction to normative correction, not a recognition of a metaphysical error.
  2.  **If you want objective wrongness:** You must reject Kripke's conclusion. You can keep the second survivor for dramatic reasons (loneliness, conflict, validation), but do not lean on the 'meaning requires community' argument to justify why she was wrong. Lean on the idea that her memory failed, or that her usage was inconsistent, and he spotted the pattern she missed. That is compatible with solitary meaning.

  Do not invent the second character purely to satisfy Kripke. It is a brittle foundation. If you want the character for the human drama, keep him. If you want him to solve a philosophical problem, know that the problem only exists if you accept Kripke's scepticism, which many reject.

  In short: Your first belief is accurate to Kripke. Your second belief correctly identifies the weakness in Kripke. You are free to discard the philosophy if it strangles the story. The world does not need to be Kripkean for your novel to work.
