answer: |-
  **Ask the Actuary**
  *Your life is a bankroll; stop spending it like it's a petty cash fund.*

  **Dear Actuary,**
  My uncle has offered even money on a coin that I have seen come up heads 60 times in 100 flips. I have £5,000 saved for a house deposit. How much should I stake?
  — *P.H.*

  **Dear P.H.,**
  You have observed a frequency of 0.6, which implies an edge. The full Kelly criterion suggests staking 20% of your bankroll on even money with this probability. However, 100 flips is a small sample; your edge is estimated, not known. When the edge is uncertain, you must stake less than the formula says to protect against estimation error. Stake 10% (£500). Do not stake the deposit itself unless you are willing to rent forever. It is exhausting to explain that variance is not injustice, but the arithmetic does not care about your housing timeline.

  **Dear Actuary,**
  I have lost £40,000 of a £45,000 inheritance on a run of bets my own spreadsheet described as positive-expected-value. How do I get back to where I were?
  — *S.D.*

  **Dear S.D.,**
  You cannot bet to recover losses. You now have a £5,000 bankroll. If your edge was real, bet Kelly on the £5,000. If you were overconfident, you were simply gambling. Chasing losses increases the probability of ruin, which is the end of the sequence. You must accept the new baseline. The geometric mean cares only about where you stand now, not where you stood before. To demand recovery is to ask the market to subsidise your past errors.

  **Dear Actuary,**
  My flat has roughly a 1-in-500 annual chance of being destroyed by flood. I can buy insurance at a premium exceeding the expected loss. Does buying this contradict what you told Letter 1?
  — *L.F.*

  **Dear L.F.,**
  No. Letter 1 was positive expectation with limited downside. This is negative expectation but prevents ruin. If the loss destroys your bankroll, the log-utility cost is infinite. Pay the premium. It looks like a bad bet to an arithmetic mind, but it is the only rational move for survival. You are buying protection against a world in which you end up with nothing. That world counts for disproportionately much.

  **Dear Actuary,**
  I have been offered a job at a company that will most likely fail, at half my current salary. I observe that there is no repeated version of a career to average over — I get one run. Does geometric rationality say to take it?
  — *J.C.*

  **Dear J.C.,**
  Strictly, the framework assumes repeatable wagers; it is silent on single-life trajectories. However, treat your earning power as the bankroll. If the company's failure zeros your career capital, decline. If it merely reduces flow, consider the option value. Do not risk ruin for a positive arithmetic mean. You must size the bet such that you remain in the game.

  **Next quarter:** Mortality as a liquidity constraint.

  **Rapid Fire:**
  *Should I marry?* Only if the joint utility compound rate exceeds the single.
  *Children?* High variance, potentially negative edge.
  *Existence?* Preferable to non-existence, provided solvency.
