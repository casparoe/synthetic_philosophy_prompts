      *   *Difference:* Reasonable accommodation asks "Is this too hard for us?" Laïcité asks "Does this compromise who we are?"
      *   *Can they be one machine?* Only with a switch at Step 2 (Authorship vs. Hardship).

  6.  **Limitations/Failure Points:**
      *   Sincerity testing is intrusive.
