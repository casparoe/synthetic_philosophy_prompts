prompt: |-
  Ok, I'm not an academic at all, I just read a lot of blogs and somehow I've ended up writing one question for the problem set of a course my housemate teaches on how groups of people make decisions. The topic is information cascades -- you know, the ones where everyone behaves perfectly rationally and yet they all end up copying whoever went before them. Every textbook uses the same jar of marbles thing where each person is right about the jar 2/3 of the time, and the punchline is always that once two people in a row say the same thing, the third person just goes along with them even if their own marble points the other way. My housemate says the students memorise that punchline and can't actually redo the reasoning or see what it quietly depends on. So I want a question built on the same jar setup but with a twist that stops them reciting it.

  The twist I want: keep the jar and the 2/3 accuracy, but make the first two people get there evidence from the same source -- say they both saw the same viral post, or the same mate told them both -- so their two observations aren't really two independent bits of evidence, they're closer to one. I want the students to work out what happens to the cascade once you break that independence assumption, and I also want a part where they have to explain why a cascade is fragile and can lock in on the wrong answer even though nobody did anything irrational.

  Can you write the actual exam question with a few parts, then a model answer, and a marking scheme that spells out which specific moves separate a strong answer from one that's just remembered the marbles? Say 20 marks, aimed at final-year undergrads. No references needed, just the question, the answer and the marks -- and keep it self-contained enough that a clever student who never took the course could still do it.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Target Audience:** Final-year undergraduates (non-academic user, but the housemate teaches a course). The question needs to be accessible but rigorous enough for that level.
      *   **Topic:** Information Cascades (specifically the Bikhchandani, Hirshleifer, Welch (BHW) style model).
      *   **Core Concept:** Rational herding where individuals ignore private signals after observing enough public actions.
      *   **Standard Model:** Jar of marbles (Red/Blue), private signal accuracy $p = 2/3$, sequential decisions. Cascade starts after two identical public actions.
      *   **The Twist:** The first two agents do *not* have independent private signals. They share a common source (correlated signals).
      *   **Goal:** Test understanding of *why* cascades happen (independence of signals) and the fragility/welfare implications, rather than rote memorization of the "two people" rule.
      *   **Deliverables:** Exam Question (approx. 20 marks), Model Answer, Marking Scheme.
      *   **Constraint:** Self-contained (a clever student without the course could solve it).

  2.  **Deconstruct the Standard Model (Mental Check):**
      *   State of world: $V \in \{H, L\}$ (High/Red, Low/Blue). Prior $P(V=H) = 0.5$.
      *   Signal: $s \in \{h, l\}$. $P(s=h|V=H) = P(s=l|V=L) = p > 0.5$ (usually $2/3$).
      *   Action: $A \in \{Accept, Reject\}$ (or Red/Blue).
      *   Logic: Agent $n$ observes history $H_{n-1}$ and private signal $s_n$. Calculates posterior. If posterior $> 0.5$, choose $H$.
      *   Cascade condition: If the weight of public history outweighs the private signal, the agent ignores the signal. With $p=2/3$, log-likelihood ratio of one signal is $\ln(2)$. Two identical signals give $\ln(4)$. One opposing signal gives $-\ln(2)$. Net $>0$. So 2 vs 1 triggers cascade.

  3.  **Develop the Twist (Correlated Signals):**
      *   Standard: Agent 1 gets $s_1$, Agent 2 gets $s_2$. Independent.
      *   Twist: Agent 1 and Agent 2 both see the *same* signal source (e.g., same viral post). Let's call it $S_{common}$.
      *   Agent 3 gets an independent signal $s_3$.
      *   *Scenario:* Agent 1 acts on $S_{common}$. Agent 2 acts on $S_{common}$ (and sees Agent 1's action). Agent 3 sees Agent 1, Agent 2, and has $s_3$.
      *   *Implication:* Agent 2's action adds *no new information* about the state of the world relative to Agent 1's action, because they are based on the same data.
      *   *Result:* The "cascade" threshold shouldn't be reached after two people. It should effectively treat the first two actions as *one* piece of evidence. Agent 3 should still follow their private signal if it contradicts the first two.

  4.  **Drafting the Question:**
      *   *Setup:* Define the jar (Red/Blue), prior (50/50), signal accuracy (2/3).
      *   *Sequence:* Three students (Alice, Bob, Charlie).
      *   *Standard Rule:* They guess the color. Rational Bayesians.
      *   *The Twist:* Alice draws a marble. Bob *doesn't* draw a marble; he just asks Alice what she saw (or they both see the same post). Actually, the prompt suggests "same source." Let's make it concrete: Alice draws a marble. Bob *also* draws a marble, BUT the marbles are linked. Or simpler: Alice and Bob both receive the *same* signal realization. Let's go with "Alice and Bob receive the exact same private signal."
      *   *Part (a):* Standard case recap (briefly) to set the baseline.
      *   *Part (b):* The Correlated Case. Alice and Bob get the same signal. Charlie gets an independent one. What does Charlie do if Alice and Bob say "Red" but Charlie draws "Blue"?
      *   *Part (c):* Conceptual. Why does independence matter? Fragility/Welfare.

      *Refining the Twist for Clarity:* To make it solvable without heavy notation, I need to be explicit about the correlation.
      *   *Setup:* Jar is Majority Red or Majority Blue.
      *   *Signal:* Private hint (Red or Blue). Correct 2/3 of the time.
      *   *Scenario:*
          1.  Alice gets signal $s_A$. Announces guess $G_A$.
          2.  Bob gets signal $s_B$. *Crucial Change:* $s_B$ is identical to $s_A$ (perfect correlation). Bob knows this. Bob announces $G_B$.
          3.  Charlie gets signal $s_C$ (independent). Charlie sees $G_A, G_B$.
      *   *Question:* If $G_A = \text{Red}$, $G_B = \text{Red}$, but $s_C = \text{Blue}$, what does Charlie do? Explain.

  5.  **Drafting the Model Answer:**
      *   Need to show the Bayesian math simply.
      *   Likelihood ratios are easier than full probabilities.
      *   Signal $p=2/3$. Likelihood ratio for "Red" signal given Red Jar vs Blue Jar is $(2/3) / (1/3) = 2$.
      *   Standard Case: Two "Red" actions = Evidence weight $2 \times 2 = 4$. One "Blue" signal = Evidence weight $1/2$. Net $4 \times 0.5 = 2 > 1$. Follow crowd.
      *   Twist Case: Alice and Bob have same signal. Their combined evidence is just *one* signal's worth. Weight = 2. Charlie's "Blue" signal weight = $1/2$. Net = $2 \times 0.5 = 1$. Indifferent? Or need to check exact phrasing.
      *   *Correction:* If Alice and Bob have the *exact same* signal, Bob learns nothing from Alice that he didn't already know from his signal (since they are identical). But the public observes two actions.
      *   Charlie knows the structure. Charlie knows $G_A$ and $G_B$ stem from *one* piece of information.
      *   So Charlie weighs: 1 unit of "Red" evidence vs 1 unit of "Blue" evidence.
      *   Posterior = Prior (50/50). Charlie should follow his own signal (or flip a coin, but usually model assumes follow private signal when indifferent or slight tie-break). Let's make the math clear: If evidence cancels out, private signal breaks the tie.
      *   *Wait, check the math:*
          *   $P(Red|Signal=Red) = 2/3$.
          *   Odds form: Prior Odds = 1.
          *   Signal Red: Likelihood Ratio (LR) = $(2/3)/(1/3) = 2$. Posterior Odds = 2.
          *   Signal Blue: LR = $(1/3)/(2/3) = 1/2$.
          *   Standard Cascade: Red, Red, Blue. Odds = $1 \times 2 \times 2 \times 0.5 = 2$. Choose Red.
          *   Correlated Case: Alice (Red), Bob (Red [same signal]), Charlie (Blue).
          *   Charlie knows Alice & Bob represent only *one* signal.
          *   Odds = $1 \times 2 (\text{from A&B}) \times 0.5 (\text{from C}) = 1$.
          *   Posterior Prob = 0.5.
          *   Decision: Indifferent. To make it a definite "break the cascade," I should perhaps adjust the signal accuracy or ask what happens generally.
          *   *Better approach for exam:* Ask them to calculate the posterior probability. If it's 0.5, the cascade is *broken* (they don't blindly follow). In the standard model, they blindly follow. Here, they weigh their own signal.
          *   *Actually, let's make Charlie's signal decisive.* If the prompt asks "Does Charlie follow the crowd or his signal?", and the math leads to indifference, that's ambiguous.
          *   *Adjustment:* Let's assume the standard rule is "If expected value > 0.5, follow crowd." If it's exactly 0.5, rational agents follow private information (as it costs nothing and might be right, or by convention).
          *   *Alternative:* Make the signal accuracy slightly higher? No, keep 2/3 as per prompt.
          *   *Decision:* I will frame the answer such that the student must recognize the *weight* of the evidence is halved. If the weights cancel, the private signal becomes pivotal again. In the standard model, the private signal is *ignored*. Here, it is *decisive* (or at least considered). I will specify that in the case of indifference, the agent follows their private signal (a standard tie-breaking assumption in these models).

  6.  **Drafting the Marking Scheme:**
      *   Need to distinguish between "I remember the rule (2 people = cascade)" and "I understand the math (independence)."
      *   Key differentiator: Recognizing that Bob's action is redundant.
      *   Marks for: Setup, Bayesian update, Recognizing correlation, Conclusion, Conceptual explanation (fragility).

  7.  **Review against Constraints:**
      *   20 Marks.
      *   Final-year undergrad level.
      *   Self-contained.
      *   No references.
      *   Tone: Clear, exam-style.

  8.  **Final Polish:**
      *   Ensure the question text clearly defines the correlation so students aren't guessing the mechanics.
      *   Ensure the marking scheme rewards the *reasoning* about independence, not just the final "Red/Blue" choice.
      *   Make sure the "Fragility" part asks for the intuition about how little information is actually in the cascade.

  *(Self-Correction during drafting)*: I need to be careful with the "Bob" setup. If Bob sees Alice's action *and* has the same signal, does he learn anything? If they have the *same* signal, Bob's signal is $s_B = s_A$. Bob sees Alice act on $s_A$. Bob acts on $s_B$. Since $s_B=s_A$, Bob confirms Alice. But for Charlie, the key is knowing the *generation process*. I must explicitly state in the question that *Charlie knows* Alice and Bob shared a source. Otherwise, Charlie treats them as independent.

  *Revised Setup for Question:*
  "Charlie is aware of the communication structure."
  Okay, let's write it.

  *Marking Scheme Details:*
  *   Part (a) Standard baseline (5 marks).
  *   Part (b) The Calculation with correlation (10 marks).
  *   Part (c) The Conceptual/Fragility (5 marks).
  *   Total 20.

  *Wait, one nuance:* If the posterior is exactly 0.5, is it a cascade break? Yes, because in a cascade, the private signal is *ignored* regardless of content. Here, the private signal *matters* (it breaks the tie). So the cascade is broken.

  Let's assemble.
answer: |-
  **Course:** ECON405 – Collective Decision Making
  **Assessment:** Problem Set 3 – Information Cascades
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  ---

  ### Question 1: The Correlated Signal Twist (20 Marks)

  **Context:**
  Consider a standard information cascade setup. There is a jar containing a large number of marbles. The jar is either **Majority Red** ($V=R$) or **Majority Blue** ($V=B$). The prior probability for each is 50% ($P(V=R) = 0.5$).

  Students draw marbles one by one to guess the jar's type.
  *   **Private Signal:** When a student draws a marble, it is Red ($s=r$) or Blue ($s=b$).
  *   **Accuracy:** If the jar is Majority Red, the probability of drawing a Red marble is $2/3$. If the jar is Majority Blue, the probability of drawing a Blue marble is $2/3$. (i.e., $P(s=r|V=R) = P(s=b|V=B) = 2/3$).
  *   **Decision:** Each student observes all previous students' public guesses and their own private marble. They are rational Bayesians: they guess the jar type that is more likely given their information. If probabilities are equal, they follow their private marble.

  **The Scenario:**
  Three students, Alice, Bob, and Charlie, make guesses in that order.

  1.  **Alice** draws a marble, observes her signal, and announces her guess publicly.
  2.  **Bob** is supposed to draw a marble, but due to a mistake, **Bob receives the exact same signal realization as Alice.** (e.g., If Alice drew Red, Bob is told "Red" without drawing). Bob knows his signal is identical to Alice's. Bob observes Alice's guess and announces his own.
  3.  **Charlie** draws a fresh, independent marble. Charlie observes Alice and Bob's guesses. **Charlie knows the structure of the game:** he knows Alice and Bob acted on the *same* underlying signal, while his own signal is independent.

  **Part A (5 Marks)**
  In the *standard* textbook model (where Alice and Bob have independent signals), suppose Alice guesses Red and Bob guesses Red. Charlie draws a Blue marble. Using likelihood ratios or probabilities, show why Charlie ignores his own marble and guesses Red.

  **Part B (10 Marks)**
  Now consider the **Scenario** described above (where Alice and Bob share the same signal).
  Suppose Alice guesses Red and Bob guesses Red. Charlie draws a Blue marble.
  1.  Calculate the posterior probability that the jar is Majority Red from Charlie's perspective.
  2.  What does Charlie guess?
  3.  Explain clearly why Charlie's decision differs from Part A, referencing the statistical relationship between Alice and Bob's actions.

  **Part C (5 Marks)**
  Information cascades are often described as "fragile." Based on your answer to Part B, explain why a cascade based on correlated information is more vulnerable to collapse than one based on independent information. Why might a group lock into the wrong decision even when everyone is rational?

  ---

  ### Model Answer

  **Part A: The Standard Independent Case**
  *   **Prior Odds:** $P(V=R)/P(V=B) = 1$.
  *   **Signal Likelihood Ratio (LR):** A Red signal is twice as likely in a Red jar than a Blue jar ($ \frac{2/3}{1/3} = 2 $). A Blue signal has an LR of $0.5$ ($ \frac{1/3}{2/3} $).
  *   **Public History:** Alice guesses Red (implies signal $r$). Bob guesses Red. In the standard model, Bob's guess implies he also saw $r$ (or was cascading, but at $n=2$ he follows signal).
  *   **Charlie's Calculation:** Charlie sees two "Red" actions and one "Blue" private signal.
      *   Posterior Odds = Prior $\times$ LR(Alice) $\times$ LR(Bob) $\times$ LR(Charlie)
      *   Posterior Odds = $1 \times 2 \times 2 \times 0.5 = 2$.
      *   Posterior Probability = $2 / (1+2) = 2/3$.
  *   **Decision:** Since $P(V=R) = 2/3 > 0.5$, Charlie ignores his private Blue signal and guesses **Red**. This is the start of a cascade.

  **Part B: The Correlated Signal Case**
  1.  **Calculation:**
      *   Charlie knows Alice and Bob's guesses are based on the *same* single signal realization. Therefore, their two public actions represent only **one** unit of independent evidence.
      *   Charlie weighs the public history as equivalent to one Red signal.
      *   Posterior Odds = Prior $\times$ LR(Alice & Bob combined) $\times$ LR(Charlie)
      *   Posterior Odds = $1 \times 2 \times 0.5 = 1$.
      *   Posterior Probability = $1 / (1+1) = 0.5$.
  2.  **Decision:**
      *   The jar is equally likely to be Red or Blue.
      *   Per the tie-breaking rule given in the prompt ("If probabilities are equal, they follow their private marble"), Charlie guesses **Blue**.
  3.  **Explanation:**
      *   Charlie's decision differs because he discounts the *redundancy* of Bob's action. In Part A, Bob's action added new information (a second independent confirmation). In Part B, Bob's action is perfectly correlated with Alice's; it adds no new statistical weight regarding the state of the jar.
      *   Because the public history only carries the weight of one signal, it is not strong enough to overwhelm Charlie's independent private signal. The cascade fails to start.

  **Part C: Fragility and Welfare**
  *   **Fragility:** A cascade is fragile because it relies on the *assumption* of independence. As shown in Part B, if the independence assumption is violated (correlation), the public history contains far less information than it appears. A single new independent agent (Charlie) can easily overturn the public consensus because the "weight" of the crowd was illusory.
  *   **Lock-in/Welfare:** Groups can lock into the wrong answer because early agents act on limited private information. Once a cascade starts (in the independent case), later agents stop revealing their private information. The group stops aggregating knowledge. If the early signals happened to be wrong (which happens with probability $1/3$), the entire group rationally follows the error, and the true information held by later agents is never utilized.

  ---

  ### Marking Scheme

  **Total: 20 Marks**

  **Part A (5 Marks) – Baseline Understanding**
  *   **2 Marks:** Correctly identifies the Likelihood Ratio (LR) of a single signal is 2 (or calculates posterior $2/3$ correctly).
  *   **2 Marks:** Correctly combines the evidence ($2 \times 2 \times 0.5$ or equivalent probability math) to show the weight favors Red.
  *   **1 Mark:** Concludes Charlie guesses Red (ignores private signal).
      *   *Note:* Deduct 2 marks if the student claims Charlie follows his private signal (fundamental misunderstanding of the standard cascade).

  **Part B (10 Marks) – The Twist (Core Assessment)**
  *   **3 Marks (Crucial):** Explicitly states that Alice and Bob's actions count as **one** piece of evidence (or that Bob's signal provides zero *marginal* information).
      *   *Distinction:* A weak student will treat Bob as independent and get the same answer as Part A. A strong student identifies the correlation.
  *   **3 Marks:** Correct Bayesian update using the adjusted weight (Odds = 1, or Prob = 0.5).
  *   **2 Marks:** Correctly concludes Charlie guesses **Blue** (following private signal due to tie-break).
  *   **2 Marks:** Clear verbal explanation that redundancy breaks the cascade threshold.
      *   *Zero marks* for this section if the student treats Alice and Bob as independent sources.

  **Part C (5 Marks) – Conceptual Synthesis**
  *   **3 Marks:** Explains **Fragility**: Mentions that cascades rely on the *appearance* of independent consensus. If correlation exists, the consensus is "hollow" and easily broken by new independent data.
  *   **2 Marks:** Explains **Lock-in/Welfare**: Mentions that once a cascade starts, private information is **not aggregated** (people stop learning from others' signals). Therefore, early errors propagate permanently.
      *   *Note:* Answers that simply say "people are sheep" without referencing information aggregation or rationality receive 0 marks.

  **General Grading Notes for Markers:**
  *   **The "Memorization" Trap:** Many students will memorize "2 people = cascade." If a student applies the "2 people" rule to Part B without adjusting for correlation, they should fail Part B entirely (max 2/10 for attempting math). The core learning objective is understanding *why* it is 2 people (independence), not *that* it is 2 people.
  *   **Notation:** Accept probability notation ($P(A|B)$) or Likelihood Ratio notation, provided the logic is consistent.
  *   **Tie-Break:** Ensure the student read the prompt's tie-breaking rule. If they argue Charlie is indifferent and flips a coin, award full marks for Part B.1 and B.2, provided they acknowledge the cascade is broken (i.e., Charlie is not *forced* to follow the crowd).
