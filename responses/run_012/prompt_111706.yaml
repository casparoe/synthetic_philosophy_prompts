      *   (3) **Anti-Welfarism:** Value isn't just utility. Suspects Liberal Paradox is a reductio of welfarism (though unsure).
      *   (4) **Alienability of Rights:** Rights can be waived/traded. Inalienable rights are duties.
      *   (5) **No Preference Laundering:** Must count all preferences, including other-regarding ones (meddlesome preferences).
