  I'm a high school student (grade 11) and next month I'm running the meeting for our school's philosphy club, which is nine people, none of whom have done any formal logic, though they've all seen the liar paradox and think it's the deepest thing ever. The topic I picked is the move Hofstadter makes in GEB, from a formula that talks about itself to a mind that's aware of itself, and I need you to plan how I should teach it, not teach it to me. What has to come first so that the self-reference step means anything at all, what depends on what, and I want one example to carry the whole thing: I was going to use the fact that you can write a short computer program that prints out its own source code, so tell me whether that can actually carry it or what it would need and lack, and how I get from there to the numbering trick and then to the loop at the end. The misconception I know is coming is that this is just the liar paradox with arithmetic sprinkled on, but the ones that scare me are at the end, where they'll either decide the theorem proves minds can't be machines or that it says nothing about minds at all, and also somebody will say you can just add the unprovable sentence as a new axiom and be done with it. Tell me where in the sequence to head each of those off, and what I should say up front that I'm not going to get into at this level. Finish with one question I can ask at the end that shows me whether they actually got the analogy or just nodded along. Write it as plain prose please, no headings, no bullet points, no bold, no tables, just like you were explaining your plan to me in an email.
