answer: |-
  # The Pragmatist Truth Sorter
  **Instructions:** Start at Node 1. Answer based on your intuition about the *case provided*, not on which philosopher you think you should be. If you hit a leaf, stop. If you hit a node, continue.

  **Node 1: The Method Check**
  Consider the concept of **"Hardness."** A pragmatist says, "To define hardness, look at the effects a hard object has on other things (scratching, resisting pressure)."
  *   **A:** I'm using this rule just to clarify concepts/meanings. I don't need a theory of *truth* to do this.
      *   → **LEAF: Pragmatism as Method Only**
      *   *Awkward Commitment:* You have no answer when a realist asks, "Yes, but is the belief that it is hard *actually true*?"
  *   **B:** I want to use this approach to define what *truth* itself consists in.
      *   → Go to Node 2.

  **Node 2: The Property Check**
  Consider the claim **"Slavery is unjust."** When you say this claim is "true":
  *   **A:** I am giving it a social compliment. "True" is just what our peers let us get away with saying. There is no "truth property" in the world.
      *   → **LEAF: Rorty-Style Social Endorsement**
      *   *Awkward Commitment:* You cannot criticize your own culture's norms from the outside without hypocrisy.
  *   **B:** I am attributing a substantive property to the belief (like solubility), even if that property is relational.
      *   → Go to Node 3.

  **Node 3: The Individual Check**
  Consider a **comforting false belief** (e.g., "My deceased loved one is watching over me"). It has no empirical evidence but makes your life function significantly better.
  *   **A:** It can be true *for you* (because it works for your needs) even if it's false for me. Truth is indexed to the believer's psychology.
      *   → **LEAF: Jamesian Expediency View**
      *   *Awkward Commitment:* You must accept that contradictory beliefs can both be "true" simultaneously for different people.
  *   **B:** No. Truth must be public. What works for you personally doesn't make it true; it just makes it useful.
      *   → Go to Node 4.

  **Node 4: The Newton Check**
  Consider **Newtonian Mechanics.** It worked perfectly for 200 years but was superseded by Einstein. Looking back from today:
  *   **A:** It was *warranted* then, but it wasn't *true*. Truth is the ideal limit, not the current best tool.
      *   → Go to Node 5.
  *   **B:** It was *true enough* then. Truth is a function of current inquiry success. We don't need a "final limit."
      *   → Go to Node 6.

  **Node 6: The Dewey Split**
  (From 4B: "True enough then"). When you say Newton was "true enough," are you willing to drop the noun "Truth" entirely?
  *   **A:** Yes. "Truth" implies a static copy of reality. We should only talk about **"Warranted Assertability."**
      *   → **LEAF: Deweyan Warranted Assertability**
      *   *Awkward Commitment:* You have to explain why we keep using the word "true" in everyday life if it's philosophically misleading.
  *   **B:** No. I still want to keep "Truth" as a property, just one that is temporal/revisable.
      *   → **LEAF: Unheld Combination (Temporal Property Realist)**
      *   *Status:* **Unattractive.** (Why keep the baggage of "Truth" if you deny its stability? See bottom of page).

  **Node 5: The Convergence Check**
  (From 4A: "Ideal limit"). Imagine an **untestable past-tense claim** (e.g., "A specific leaf fell at 4:02 PM on a day in 1300"). No evidence exists or will ever exist.
  *   **A:** There is no truth value. Truth is what inquiry *would* decide. If inquiry can't reach it, there's no truth.
      *   → Go to Node 7.
  *   **B:** There is a fact of the matter. Inquiry *would* find it *if* it could, because reality constrains the result.
      *   → Go to Node 8.

  **Node 7: The Idealization Check**
  (From 5A: "No truth without inquiry"). Consider **Mathematics.** We don't run empirical experiments on numbers.
  *   **A:** Math is true because it is acceptable under **idealized rational conditions**, not because of empirical convergence.
      *   → **LEAF: Putnam-Style Idealized Rational Acceptability**
      *   *Awkward Commitment:* You must define "ideal conditions" without circularly defining them as "conditions where we get the truth."
  *   **B:** Math is just language conventions; this view only applies to empirical claims.
      *   → **LEAF: Unheld Combination (Anti-Realist Limit)**
      *   *Status:* **Incoherent.** (If truth is the limit of inquiry, you can't exclude formal inquiry without abandoning the definition).

  **Node 8: The Reality Check**
  (From 5B: "Reality constrains"). If the scientific community converged on a view, but reality was actually different (a "perfect conspiracy"), could they be wrong?
  *   **A:** No. If the community converges under ideal conditions, that *constitutes* truth.
      *   → **LEAF: Putnam-Style Idealized Rational Acceptability** (Alternative Path)
      *   *Status:* **Indistinguishable from Node 7 Leaf.** (If you answer 5B but 8A, you are functionally a Putnamian).
  *   **B:** Yes. The external reality forces the convergence. Truth is the opinion fatefully destined to be agreed upon.
      *   → **LEAF: Peircean Limit-of-Inquiry View**
      *   *Awkward Commitment:* You are committed to a form of scientific teleology (that inquiry is "destined" to converge).

  ***

  ### Unheld / Problematic Combinations
  *If your answers bounced between branches in a way that didn't land on a leaf above, you likely hold one of these:*

  1.  **Individual Expediency + Long-Run Convergence**
      *   *The View:* "Truth is what works for me personally, but we will all inevitably agree on it in the long run."
      *   *Verdict:* **Incoherent.** If truth is indexed to individual psychological needs (James), there is no mechanism to guarantee community convergence (Peirce).
  2.  **Social Endorsement + Mind-Independent Constraint**
      *   *The View:* "Truth is just what we endorse, but reality forces us to endorse the right things."
      *   *Verdict:* **Unexplored / Tension.** This tries to be Rorty (Node 2A) and Peirce (Node 8B) simultaneously. If reality forces the endorsement, "endorsement" isn't the definition of truth, reality is.
  3.  **Temporal Property Realist (Node 6B)**
      *   *The View:* "Truth is a real property, but it can change from true to false over time without changing the belief."
      *   *Verdict:* **Unattractive.** This retains the metaphysical weight of "Truth" while denying its primary philosophical utility (stability). Most who land here slide into Dewey (6A).

  ### Note on Indistinguishability
  *   **Putnam vs. Peirce:** In many empirical cases, these leaves answer identically. The split only appears in **Math/Logic** (Node 7) or **Verification-Transcendent** cases (Node 5). If you don't care about those edge cases, you are effectively holding both views.
