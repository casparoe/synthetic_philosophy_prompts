      *   **Measurement Uncertainty ($U$):** The dispersion of values reasonably attributable to the measurand.
      *   **Decision Rule:** How to accept/reject based on $y$, $U$, and $T$ (e.g., simple acceptance, guard banding).
      *   **Conformity:** Binary state (Pass/Fail) relative to the specification.
