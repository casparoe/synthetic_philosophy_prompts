answer: |-
  Good evening. Fifteen years is a long time to spend watching boxes of imaginary marbles. When I started here, I promised I would remain the sceptic in the corner, the one asking whether the patterns we see on the screens are actually doing anything, or whether they are just shadows cast by the tiny things bumping underneath. Tonight, as we close the centre, I owe you a verdict.

  I want to talk about a thought experiment we know well. Imagine a vast, shallow box. Inside are thousands of tiny magnetic marbles. They buzz around, bouncing off the walls and each other. Sometimes, by chance, a few stick together. If enough stick, they form a clump—a larger, slower object. In the old papers, the tiny marbles were called 'simms' and the clumps 'simmballs'. The question is simple: when a clump moves across the box and shoves another clump, who is doing the shoving? Is it the large clump acting as a single thing? Or is it just the thousands of tiny marbles inside it, coincidentally pushing in the same direction?

  If you say it is only the marbles, then the clump is just a summary. It has no power. If you say the clump has power, you risk inventing magic forces that do not exist. For fifteen years, I have watched us try to solve this. Here is where I have landed.

  Consider the box again, but strip it bare. Remove the friction. Remove the damping. Let the marbles keep all their energy forever. In this frictionless careenium, a collision never fades; the energy rings forever. In this world, I argue, stable clumps cannot form. Or if they form, they cannot act as units. Why? Because to act as one thing, the parts must stop acting as themselves. They must settle. They must lose the specific history of their individual collisions. They must, in a very physical sense, forget.

  This is the claim I want to defend: higher-level patterns are real only because the lower level is forgetful. Stability requires information loss. If the marbles remembered every bounce perfectly, there would be no 'cluster', only a chaotic cloud of individual histories. The pattern exists *because* the details are erased.

  But this opens a danger. If patterns rely on forgetting, how do we distinguish a real pattern from a coincidence? My colleague calls them 'phantom simmballs'. These are clusters that look robust statistically. You can point to them. The numbers say they are there. But they do not persist. They do not constrain what happens next. Treating them as agents is like seeing a face in the clouds and expecting it to speak. It is superstition with error bars. We have all chased phantoms. We have all published correlations that dissolved when the data shifted.

  So, here is the test. I offer this to the modellers in the room, and to the funders who paid for the models. How do you tell a real simmball from a phantom? Do not ask if the cluster is statistically significant. Ask if it survives a poke.

  If you intervene on the system—change a variable, introduce a shock—does the cluster hold together and respond as a unit? Or does it dissolve immediately back into noise? A real pattern constrains the behaviour of its parts. If you kick a real simmball, the marbles inside adjust to keep the ball intact. If you kick a phantom, the marbles just scatter. Reality is not about what you can see; it is about what resists being changed. A pattern is real if it fights back.

  Why does this matter tonight? Because we are not just talking about marbles. We are talking about cities, immune systems, markets, and brains. We are talking about this centre. And we are talking about the person who built it.

  For fifteen years, this centre was a simmball. It was a pattern made of people, grants, papers, and arguments. It was real. It pushed things around. It shaped careers and influenced policy. It resisted the noise. But patterns require maintenance. They require energy, and they require a certain kind of memory.

  We know that memory is fragile. We know that the conditions which allow a pattern to hold can dissolve. To say that higher-level patterns are real is not to say they are eternal. It is to say that while they hold, they are the most important things in the room. They are not just summaries of what we did here; they are the cause of what we became.

  There is a temptation, at a closing dinner, to say that the work continues even if the centre does not. To say that the pattern persists in some abstract realm. I will not say that. Patterns dissolve. When the friction changes, when the memory fails, the clump comes apart. The marbles go back to buzzing individually. This is not a metaphor for comfort. It is the physics of the situation.

  But it is also a verdict on value. The fact that a pattern ends does not mean it was never real. The fact that a mind changes does not mean the person who spoke here for fifteen years was not present. The stability we achieved, the knowledge we generated, the community we built—these were not phantoms. They passed the test. They resisted the poke. They constrained us, in the best possible way.

  So, I do not offer you the consolation that the work lives on. I offer you the verdict that it happened. It was real. It pushed things around. And for the time it held together, it mattered more than the sum of its parts. Thank you.
