          4.  Limited comparison to neural populations.
      *   **Outcomes:** Success = Disambiguation. Failure = Stipulative definitions.
      *   **Scope:** Cut the deep neurobiology; keep it to the structural analogy.

  6.  **Writing the Proposal (incorporating the "Voice"):**
      *   Needs to sound like a serious undergraduate proposal. Clear, humble but confident, structured.
      *   Ensure all constraints from the prompt are met (no bibliography, specific sections on success/failure/feasibility).

      *(Self-Correction on "Determinate Answer"):* A philosophical question rarely has a "Yes/No" like math. But the prompt asks for a "determinate answer." I should frame it as: "The paper will argue that the answer is X, based on criteria Y." The determinacy comes from the criteria established in the method. I will frame the question as: "Which of the three distinct causal claims does the Careenium actually satisfy?" The answer will be "Only the explanatory one." That is determinate.

      *(Refining the "Feature"):* The user suspects a specific feature makes the conflation hard to resist. I should hypothesize that feature is *counterfactual robustness* (the simmballs behave consistently across variations in simm-details).

      *(Refining the "Brain Comparison"):* The user wants to ask if the brain has more or less of this feature. This is risky for 5k words. I need to mark this as the "limit case" or "implication" section, not the core analysis. I will advise cutting deep neurobiology in the feasibility section.

  7.  **Final Polish:** Check against the prompt's checklist.
