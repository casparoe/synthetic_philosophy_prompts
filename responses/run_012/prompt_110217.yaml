answer: |-
  You have stumbled upon a classic and profound philosophical problem without realizing it. What you are describing is the tension between **conventionalism** (rules that exist only because we agree they exist) and **moral realism** (rules that are true regardless of what we think).

  Your intuition is sharp: the *content* of many rules is indeed arbitrary (left vs. right, 15% vs. 20%), but the *fact* that we have rules is not arbitrary. Society requires coordination to function.

  Your "rough rule"—*follow the local custom whenever ignoring it would upset an expectation that someone else is reasonably relying on*—is remarkably sophisticated. In philosophical terms, you have independently reconstructed a version of the **Principle of Fair Play** and elements of **Rule Utilitarianism**. You are very much on the right track, but there are a few nuances to add to handle the harder cases, particularly the unjust ones.

  Here is a way to think through your question properly.

  ### 1. The Moral Weight of Arbitrary Rules
  You are correct that there is no intrinsic moral value in driving on the left rather than the right. However, once a society has settled on a rule, it acquires moral weight through **consequences**.

  If you drive on the "wrong" side, you are not violating a law of the universe; you are creating a danger. The moral obligation arises not from the rule itself, but from your duty not to harm others. This supports your "reasonable reliance" criterion. When others rely on your behavior to stay safe or to plan their own actions, you have a moral obligation to meet that expectation.

  *   **Queuing:** If you cut in line, you are stealing time from everyone behind you. They relied on the convention to order their wait.
  *   **Escalators:** If you stand on the "walking" side, you obstruct the flow. You are frustrating the reasonable expectations of those in a hurry.
  *   **Empty Street Lights:** This is the edge case. No one is relying on you to stop. Here, the obligation is weaker. However, some philosophers argue that obeying the light maintains your own habit of obedience, ensuring you stop when cars *are* coming. Others say it is truly morally neutral. Your rule handles this well: if no one is relying on it, the moral obligation fades, leaving only a legal one.

  ### 2. Etiquette vs. Morality
  You suggest that avoiding rudeness is not a matter of morality. Many philosophers would disagree.

  Rudeness is a form of social aggression. It signals disrespect. If morality is partly about how we treat one another and acknowledge each other's dignity, then gratuitous rudeness is a minor moral failing. When you visit a new place, you are a guest. There is a moral duty of hospitality on the host, but there is also a moral duty of **respect** on the guest.

  Deliberately flouting a harmless local custom (like greeting someone with a handshake when they expect a bow) can be seen as asserting your own superiority ("*My* ways are the default; *yours* are the deviation"). That assertion of superiority can be morally problematic, even if the custom itself is arbitrary.

  ### 3. Testing Your Rule: The Tipping Dilemma
  This is where your rule faces its hardest test. You asked: *What if the custom is unjust?*

  Let's apply your "reasonable reliance" test to tipping in a culture where servers are paid below minimum wage (like the US).
  *   **Does the server rely on it?** Yes, absolutely. Their livelihood depends on it.
  *   **Does the owner rely on it?** Yes, it subsidizes their labor costs.
  *   **Does the diner rely on it?** Yes, they expect the menu price to be lower because of it.

  If you refuse to tip because you object to the system, you are punishing the server, not the owner. The server's reliance is immediate and personal. Therefore, under your rule, you are obligated to tip, not because the *custom* is good, but because the *person* is relying on you.

  However, your unease is morally significant. It points to a second layer of obligation: **Complicity.**

  ### 4. Refining Your Rule: The Two-Step Test
  To handle the unjust customs, I suggest refining your rule into a two-step test. When entering a new culture, ask:

  **Step 1: The Coordination Test (Your Rule)**
  *Does breaking this custom cause confusion, danger, or financial loss to a specific individual who is relying on me?*
  *   **Yes:** You are generally obligated to follow it. (e.g., Driving side, queuing, tipping the server who needs the wage).
  *   **No:** You are free to ignore it. (e.g., Waiting at an empty light, wearing casual clothes to a formal event where no one cares).

  **Step 2: The Justice Test**
  *Does following this custom require me to participate in a violation of fundamental human rights or dignity?*
  *   **Yes:** You are obligated to refuse, even if it upsets expectations.
  *   **No:** You should follow it (per Step 1).

  **Applying the Justice Test:**
  *   **Segregation:** In the mid-20th century US, there was a "custom" of racial segregation. A visitor might have felt social pressure to comply. But this fails the Justice Test. The custom itself violates human dignity. You are morally obliged *not* to follow it, even if it upsets local expectations.
  *   **Tipping:** This is tricky. It is arguably exploitative, but it does not usually rise to the level of a human rights violation in the moment of transaction. The server is not being coerced by *you*; they are being failed by the *employer*. Refusing to tip hurts the vulnerable party (the server) to make a point to the powerful party (the owner). Most ethicists would argue you should tip the server (Step 1) but perhaps advocate for policy change later (Step 2).

  ### 5. Conclusion: The Visitor's Obligation
  To answer your specific question: **Yes, visitors are often under a real moral obligation to adopt local customs, but not because the customs are sacred.**

  They are obligated because:
  1.  **Harm Prevention:** Breaking coordination rules (driving, queuing) causes real harm to others who rely on them.
  2.  **Fair Play:** If you benefit from the local order (using their roads, shops, police), you owe it to the locals to maintain that order.
  3.  **Respect:** Adhering to harmless customs acknowledges the dignity of the host culture.

  **Your refined principle might look like this:**
  > "A visitor ought to follow local custom whenever doing so is necessary to meet the reasonable expectations of others or to avoid harm, provided that the custom itself does not require complicity in a grave injustice."

  You have effectively derived a social contract theory for travelers. The arbitrariness of the rule's *content* does not negate the morality of the *obligation* to follow it. The morality lies in the relationship between you and the people affected by your actions.

  So, stand on the correct side of the escalator. Wait for the light if others are watching. And tip the server, even if you hate the system that makes them need it. But if asked to do something that degrades another human being, the local custom loses its authority.
