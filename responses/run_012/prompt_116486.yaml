answer: |-
  **MEMORANDUM**

  **TO:** Acquisitions Committee
  **FROM:** Chair, Acquisitions Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Ontological Framework and Recommendations for Proposals [Artist A] and [Curator B]

  **1. Purpose and Scope**

  At our last meeting, discussion regarding the proposals from [Artist A] (the generative drawing system) and [Curator B] (the prompt-based prints) stalled. The division in the committee stems not from aesthetic disagreement, but from ontological uncertainty: we cannot agree on what object is actually being offered for acquisition. Consequently, we cannot fill the registrar's fields for medium, edition, or condition without first settling what constitutes the "work."

  Some members have proposed we resolve this by asking whether the machine is creative. I argue this is a category error. Creativity is not a property of the tool, but of the intentionality governing its use. Our task is not to judge the machine, but to identify the locus of artistic labor and the boundaries of the object. This memo outlines a framework for that identification, applies it to the two proposals, and establishes a policy for future submissions of this nature.

  **2. The Ontological Framework: Type, Token, and Procedure**

  We already own conceptual works consisting of a certificate and instructions for re-execution (e.g., Sol LeWitt, On Kawara). In those cases, the artwork is the *type* (the instruction set), and the installation is the *token* (the physical manifestation).

  However, a critical distinction exists between a static instruction ("Draw a line from corner to corner") and a generative system ("Sample from this latent space"). The former yields a predictable token; the latter yields an unpredictable one. This unpredictability does not diminish authorship. In aleatoric art (John Cage, Hans Arp), the artist authors the *process* that generates the outcome, not the outcome itself. Therefore, the unpredictability of [Artist A]'s drawings does not cede authorship to the machine; it confirms the artist's authorship of the system that produces them.

  **3. Analysis of Proposal 1: [Artist A] (The Generative System)**

  *The Proposal:* A trained model, sampling script, plotter, and certificate. The wall accumulates drawings over three months.
  *The Recommendation:* **Approve with Conditions.**

  **The Object:** The artwork is the *system*, not the individual sheets of paper. The paper drawings are ephemeral byproducts, akin to the light in a projection-based video work. To acquire only the paper (as one member suggested) would be to acquire the exhaust rather than the engine. It would reduce a time-based, durational work into a static collection of fragments, destroying the artist's intent regarding accumulation and time.

  **Addressing Dissent (The "Fixed Identity" Objection):** One member argues that a regenerable work has no fixed identity, leaving our provenance and condition apparatus with nothing to grip. This is a valid administrative concern but an ontological misunderstanding. The "fixed identity" is the code and the weights. The "condition" applies to the functionality of the system (does the script run? does the plotter function?) and the archival state of the storage media. We insure the hard drive containing the weights and the certificate of authenticity. The paper is consumable stock, budgeted for re-installation, much like lightbulbs or projector lamps.

  **Registry Fields:**
  *   **Medium:** Generative algorithm (Python script), neural network weights, plotter, ink, and paper.
  *   **Dimensions:** Variable (determined by plotter bed and installation duration).
  *   **Edition:** 1 (The system) + 2 Artist Proofs. (The drawings produced during exhibition are not part of the edition count; they are instances of the work).
  *   **Object for Insurance:** The archival storage drive containing the code/weights and the Certificate of Authenticity.

  **4. Analysis of Proposal 2: [Curator B] (The Prompt Prints)**

  *The Proposal:* Five large prints selected from outputs of a commercial image model.
  *The Recommendation:* **Approve.**

  **The Object:** Here, the artwork is the *print*, not the prompt or the model. The labor is curatorial and compositional, analogous to photography. The photographer does not build the camera or manufacture the film; they select the frame, exposure, and development. [Curator B] has selected specific frames from a latent space.

  **Distinction from Proposal 1:** Unlike [Artist A], [Curator B] has not built the tool, nor is the work dependent on re-execution. The work is static. If we lose the prompt, we still have the print. If [Artist A] loses the weights, the work is dead. Therefore, these proposals must be treated differently. Proposal 1 is a *performance system*; Proposal 2 is a *multiple*.

  **Registry Fields:**
  *   **Medium:** Inkjet print on archival paper.
  *   **Dimensions:** [Specific Inches/CM].
  *   **Edition:** 5 (Fixed).
  *   **Object for Insurance:** The five framed prints.

  **5. Policy Generalization for AI and Generative Acquisitions**

  To prevent future stalemates, the committee will apply the following criteria to generative submissions:

  1.  **Locus of Labor:** Did the artist construct the tool (model/training set) or merely operate a third-party tool? Construction suggests the work is the *system* (Proposal 1); operation suggests the work is the *output* (Proposal 2).
  2.  **Dependency:** Is the work dependent on re-execution to be complete? If yes, it must be acquired as a system with conservation plans for software obsolescence. If no, it is acquired as a static object.
  3.  **Provenance of Data:** For system-based works, we require documentation of the training data to assess copyright liability and artistic lineage (e.g., [Artist A]'s use of her own archive vs. scraped data).
  4.  **Conservation Viability:** We will not acquire system-based works without a migration plan. Code rots faster than paint. The artist must agree to cooperate on future emulation or migration.

  **6. The Precedent of Conceptual Art**

  Does our existing collection of conceptual works settle this? Partially. It establishes that instructions can constitute art. However, traditional conceptual art relies on human execution of static instructions. Generative art relies on *machine* execution of *probabilistic* instructions. This introduces technical obsolescence risks that paper instructions do not have. Therefore, while the ontological precedent holds (the idea is the work), the conservation precedent does not. We must treat the code as a living score that requires maintenance, not a static document.

  **7. Falsification Conditions**

  I offer this opinion not as dogma, but as a working hypothesis. I am prepared to retract these recommendations if the following prove true:

  1.  **For Proposal 1:** If independent technical audit reveals the provided weights are non-functional or merely wrappers for a pre-existing public model without significant modification, the claim of "authorship of the system" collapses, and the work should be rejected or reclassified as Proposal 2 type.
  2.  **For Policy:** If within five years, the cost of maintaining the hardware/software environment for Proposal 1 exceeds 50% of the work's appraised value, my classification of the "system" as the primary insured object is financially unsustainable, and we should have acquired only the certificates and a static sample set.
  3.  **For Authorship:** If legal precedent establishes that the output of a generative model cannot be copyrighted by the prompter or trainer, our acquisition of Proposal 2 becomes a liability, as we would own a physical object with no underlying intellectual property rights.

  **8. Conclusion**

  We are not here to decide if machines make art. We are here to decide what we are buying. In Proposal 1, we are buying a factory. In Proposal 2, we are buying the product. Both have value, but they require different contracts, different conservation strategies, and different registry entries. I ask the committee to vote on these recommendations based on this structural distinction.

  **[Signature]**
  Chair, Acquisitions Committee
