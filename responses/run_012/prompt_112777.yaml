prompt: |-
  I have zero philosophy training — I listen to podcasts and argue in comment sections — and I keep running into one sentence I cant tell is deep or just a trick with words. Someone on a podcast, very seriously, said that some contradictions are true, and gave as his example a sentence that says of itself that it's false. My mate Dave, who's read a lot of Zen stuff, says sure, everything is both true and false, that's the whole point. Then some guy in the comments said if any contradiction is true then anything follows, so you could prove that 2+2=5 and the whole idea eats itself. My own hunch is that it's all about the word 'not' and there's no real disagreement anywhere, but that feels too quick.

  What I want is a menu of the precise things 'some contradictions are true' could actually be claiming — starting from the readings that are basically trivial or just about how we use words, up to the ones that claim something about reality itself — and for each one whether it's trivial, actually defensible, or plainly false, plus which one the podcast guy most likely meant. I'd also like to know what a person has to sign up for in order to be entitled to say it.

  Bits I've picked up that might be relevant, please tell me if I'm mixing things up:

  - that you can't have true contradictions unless you also give up the rule that anything follows from a contradiction, which sounds like a huge cost
  - that there's a completely different case: borderline cases, like a man with three hairs who's neither clearly bald nor clearly not, where some people want to say he's both — but I was told that's about our words or statements rather than about the world
  - that there are logics where a contradiction doesn't blow everything up, and that some people use those logics while still thinking no contradiction is ever actually true — so maybe the logic and the claim about truth are separate things?
  - that some of our best theories (something to do with sets, or with a sentence that talks about its own truth) turn out inconsistent and yet we don't abandon them — is that the same claim as the original one or a different, weaker one?
  - that 'both true and false' is supposed to be different from 'neither true nor false', which I honestly can't see

  And is the claim that our theories are inconsistent a different claim from the claim that the world itself is inconsistent? If so, which one do people usually mean?

  Basically, give me the readings as a list with verdicts I can take back to the group chat, and tell me which reading I should assume someone is using when they pull this line out to end an argument.
