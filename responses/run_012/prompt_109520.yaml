prompt: |-
  Okay, so I'm a novelist, and through a series of small mistakes I've ended up on the steering committee of an international writers' festival we put on every other year. Mostly I approve budgets and nod along. But now there's an actual dispute and I have to write something up before the next meeting, and I'd rather not wing it in front of people who will remember.

  Here's the situation. Our city has the usual set of local customs, and two of our visiting fellows from this year's cohort ran afoul of them. One, who's from a country where tipping isn't done and leaving money is faintly rude, ate at the restaurant we always send fellows to, paid the bill exactly, and left nothing. The server there is a friend of one of our board members and complained, and to be fair the servers at that place really do live off tips. The other fellow jaywalked in front of a local writer who was crossing with her kid, and also cut the coffee queue at the venue twice by claiming he was holding a spot for someone. A staff member has now filed a formal complaint asking us to discipline both of them, or at least to put a clause in the fellowship agreement saying visiting writers must follow local customs.

  The board meets in three weeks and I've been asked to circulate a short written opinion beforehand. So what I want from you is that memo. Recommend a concrete course of action, not a vibe: what goes in the fellowship agreement (if anything), what we say to the two fellows, what we say to the staff member who complained, and by when. Give the strongest version of the argument on the side you end up rejecting, because half the board will be on that side and I don't want to get shredded.

  Two things I'd like you to actually work through rather than skip. First, I don't think all these customs are the same animal, and I want the memo to sort them. Some conventions seem to be pure coordination, where the content barely matters as long as everyone does the same thing. Some seem to distribute burdens, like tipping, which is arguably just passing a restaurant's payroll onto customers. Some seem to be about showing respect or acknowledging who was there first, like the queue. Does the kind of convention change whether a visitor owes compliance? Say so explicitly, with the case behind each claim.

  Second, and this is the part that's keeping me up: the tipping case is ugly because both ways out look bad. If the fellow complies, he props up an arrangement a lot of people think is unjust and quietly confirms that servers should depend on the charity of strangers. If he doesn't, a specific underpaid person eats the cost, and he also free-rides on everyone else who does pay. I want the memo to say which horn we take and why, not to wave it away with a line about being guests of the city. Everyone on this board already knows how to say when in Rome, so spare me that.

  You can bring in the philosophy if it helps — the stuff about conventions as solutions to coordination problems, the older line about customs arising from mutual interest rather than agreement, the moral/conventional distinction, all of that — but keep it in service of the actual decision. No reading list, no citations, the board won't read them. Plain prose, a clear bottom line, and a honest paragraph for the losing side. Thanks.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Novelist on the steering committee of an international writers' festival.
      *   **Task:** Write a pre-meeting memo recommending a concrete course of action regarding a dispute involving two visiting fellows and local customs.
      *   **Audience:** The Board/Steering Committee (peers, some of whom will disagree).
      *   **Tone:** Plain prose, clear bottom line, honest, professional but not bureaucratic fluff. No citations/reading lists.
      *   **Key Constraints:**
          *   Must sort the types of customs (coordination vs. burden distribution vs. respect/queueing).
          *   Must explicitly address the "tipping dilemma" (unjust system vs. individual harm) without waving it away.
          *   Must provide the strongest argument for the *rejected* side.
          *   Must give concrete recommendations: Agreement clauses, communication to fellows, communication to staff, timeline.
          *   Deadline: Board meets in 3 weeks (memo needed before then).

  2.  **Deconstruct the Incidents:**
      *   **Incident A (Tipping):** Fellow from non-tipping culture didn't tip. Server (friend of board member) complained. Issue: Economic burden on worker vs. moral objection to tipping system.
      *   **Incident B (Jaywalking/Queueing):** Fellow jaywalked near local writer + kid. Cut coffee queue twice. Issue: Safety, respect, fairness in line.

  3.  **Philosophical/Conceptual Framework (as requested):**
      *   *Coordination Conventions:* Traffic lights, queueing. Content matters less than uniformity. Violation causes chaos or unfair advantage.
      *   *Burden Distribution:* Tipping. Shifts cost from employer to customer. Violation saves visitor money but costs worker.
      *   *Respect/Status:* Queueing, jaywalking near children. Signals regard for others' time and safety.
      *   *Decision:* Do visitors owe compliance?
          *   Queueing/Jaywalking: Yes. High coordination/respect value, low moral ambiguity.
          *   Tipping: Complicated. It's a structural economic issue, not just a custom.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** State the recommendation immediately.
      *   **Analysis of Customs (The "Sorting" Requirement):**
          *   Distinguish between *coordination/respect* norms (queueing, traffic) and *economic* norms (tipping).
          *   Argument: Coordination norms require compliance for the system to work. Economic norms are trickier.
      *   **The Tipping Dilemma (The "Horn" Requirement):**
          *   Acknowledge the trap.
          *   Choice: We cannot ask fellows to fix the local labor market at the expense of a specific worker *today*.
          *   Decision: We must advise compliance on tipping *for now*, but acknowledge the systemic issue.
      *   **Recommendations (Concrete Actions):**
          *   *Fellowship Agreement:* Add a clause? Yes, but nuanced. "Respect local laws and safety norms." Tipping? Maybe a guideline, not a rule.
          *   *The Two Fellows:* Different responses. Tipping fellow: Education, no penalty. Queue/Jaywalk fellow: Stern warning (safety/fairness).
          *   *The Staff Member:* Validate the complaint, explain the action, acknowledge the difficulty.
          *   *Timeline:* Before the board meeting (obviously), but actions taken immediately after approval.
      *   **The Counter-Argument (The "Losing Side" Requirement):**
          *   What's the strong case against my recommendation?
          *   Case 1 (Strict Compliance): Festival reputation is paramount. Any breach is unacceptable.
          *   Case 2 (Principled Non-Compliance): Tipping is exploitative; we shouldn't enforce it.
          *   *Selection:* The strongest opposing view is likely the "Principled Non-Compliance" regarding tipping or the "Zero Tolerance" regarding behavior. Let's go with the "Zero Tolerance/Reputation" argument as the primary counter, but acknowledge the moral hazard of tipping too. Actually, the prompt asks for the strongest version of the argument on the side I *end up rejecting*. If I recommend *advising* tipping but not *mandating* it as a firing offense, the rejecting side is either "Fire them/Strict Punishment" OR "Do nothing/It's their culture."
          *   *Refinement:* The prompt asks to sort the customs. I will likely recommend distinguishing between them. So the "rejecting side" might be the view that *all* customs are equal and must be strictly enforced, OR the view that *no* customs should be enforced.
          *   *Decision:* I will recommend a differentiated approach. The strongest rejecting argument is the "Uniformity/Reputation" argument: *Any* breach damages the festival, regardless of the custom's nature. Differentiation looks like weakness.

  5.  **Refining the Tipping Argument:**
      *   I need to pick a horn.
      *   Horn A: Don't tip (Principle). Result: Server loses money.
      *   Horn B: Tip (Pragmatism). Result: Server gets money, system reinforced.
      *   *Choice:* We choose Horn B for the individual case, but clarify we aren't endorsing the system. Why? Because the harm to the server is immediate and tangible. The harm of reinforcing the system is diffuse and long-term. We cannot sacrifice a specific worker for a abstract principle.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Voice:* Professional, thoughtful, direct. Not academic.
      *   *Structure:*
          1.  Recommendation.
          2.  Analysis of Norms (Coordination vs. Economic).
          3.  The Tipping Specifics.
          4.  Action Plan (Agreement, Fellows, Staff).
          5.  The Counter-Argument.

  7.  **Self-Correction/Review against constraints:**
      *   *Did I sort the customs?* Yes (Coordination/Safety vs. Economic).
      *   *Did I pick a horn on tipping?* Yes (Protect the worker now, acknowledge system flaw).
      *   *Did I include the counter-argument?* Yes (The "Reputation/Uniformity" argument).
      *   *Is it concrete?* Yes (Specific clauses, specific conversations).
      *   *No citations?* Checked.

  8.  **Final Polish:** Ensure the tone isn't too preachy. Make sure the distinction between the jaywalker/queue-cutter and the non-tipper is clear, as they warrant different responses. The queue/safety issue is more egregious than the tipping issue in terms of "guest" behavior, even if the tipping issue is economically sensitive.

      *Wait, one nuance:* The prompt says "Recommend a concrete course of action... what goes in the fellowship agreement."
      *My plan:*
      1.  **Agreement:** Add "Respect local safety and public order norms." Leave tipping as a "Guideline" in the welcome pack, not a contractual obligation.
      2.  **Fellows:** Tipping fellow -> Conversation + expense reimbursement for the tip (if possible) or just education. Queue fellow -> Formal warning.
      3.  **Staff:** Acknowledge complaint, explain the distinction made.
      4.  **Tipping Horn:** We pay the tip (festival covers it) or advise future fellows to tip. Let's go with: Future fellows *must* be advised to budget for tips. Current fellow: Festival covers the shortfall to the server anonymously. This solves the "unjust system" vs "worker hurt" dilemma. *Wait, better:* The memo recommends we cover the cost *this time* to make the worker whole, but mandate advice for the future. Actually, simpler: We advise future fellows it is required. For this fellow, we apologize to the server and perhaps the festival covers a "gratuity" donation to the staff pool.
      *Decision:* Keep it practical. Future agreements include a budget note on tipping. Current fellow gets a conversation. Server gets compensated by the festival directly if possible, or we just acknowledge the complaint is valid but the response is educational.
      *Actually, the prompt asks "which horn we take."*
      *Horn:* We prioritize the immediate welfare of the worker over the fellow's cultural principle. We require tipping.
      *Why:* The harm is concentrated on one person vs diffuse systemic reinforcement.

      *Let's write.*

      *(Self-Correction during drafting)*: Make sure the "Counter-Argument" is truly strong. It shouldn't be a strawman. The argument against my nuanced view is that making distinctions makes the festival look inconsistent and weak on standards.

      *(Final check on timeline)*: Board meets in 3 weeks. Memo circulates before. Actions happen after board approval.

      *(Final check on Tone)*: "Plain prose." Avoid jargon like "normative framework." Use "rules," "customs," "expectations."

      *(Final check on Tipping)*: "If the fellow complies, he props up an arrangement... If he doesn't, a specific underpaid person eats the cost." I need to say: We make him pay (or we pay on his behalf) because the worker's rent is due now. We don't let the worker be the martyr for the system.

      *Okay, ready to generate.*
answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, International Writers' Festival
  **FROM:** [Your Name], Steering Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Fellow Conduct and Local Customs

  **Bottom Line Recommendation**

  We should not treat all local customs as identical contractual obligations. I recommend we update the Fellowship Agreement to require compliance with local *laws and safety norms* (traffic, queuing), but handle economic customs (tipping) through mandatory pre-arrival briefing and budgeting support rather than disciplinary clauses.

  Regarding the specific incidents: The fellow who cut the queue and jaywalked receives a formal warning. The fellow who did not tip receives a private conversation and a request to contribute a retroactive gratuity, which the Festival will match to ensure the staff are made whole without punishing the writer financially. We inform the complaining staff member that we have addressed the issue but are distinguishing between safety and economic norms.

  **Analysis: Sorting the Customs**

  We need to stop treating "local custom" as a single category. It isn't. The obligation a visitor owes depends on what work the custom is doing.

  1.  **Coordination and Safety Norms (Queueing, Traffic):** These exist to prevent conflict and physical harm. When you cut a line, you aren't just breaking a tradition; you are claiming your time is more valuable than everyone else's. When you jaywalk near a child, you introduce physical risk. These are "coordination problems." The specific rule (stand on the left vs. the right) matters less than the fact that everyone follows the *same* rule. Visitors owe compliance here because non-compliance creates immediate friction and danger for the hosts.
  2.  **Economic Distribution Norms (Tipping):** This is different. Tipping is not about coordination; it is about how wages are distributed. It shifts the burden of payroll from the employer to the customer. This is a structural economic arrangement, not a mere courtesy.

  **The Tipping Dilemma**

  This is the difficult part. We have to choose a horn.

  If we tell the fellow he was right not to tip, we validate a principle at the expense of a specific worker who relies on that income to pay rent *this week*. If we tell him he was wrong to not tip, we force him to participate in a system many consider exploitative.

  We must choose the former. We cannot ask a specific, underpaid server to absorb the cost of a philosophical objection to the local labor market. The harm to the server is immediate, tangible, and concentrated. The harm of reinforcing the tipping system is diffuse, long-term, and structural. It is not the visiting fellow's place to stage a protest against local wage structures using a server's livelihood as the funding mechanism.

  Therefore, for the duration of the Festival, we treat tipping as a mandatory cost of participation. We do not endorse the system morally, but we acknowledge that within the current reality, the worker comes first.

  **Concrete Action Plan**

  1.  **Fellowship Agreement:**
      *   **Add:** A clause requiring compliance with local laws and public safety norms (traffic signals, public queuing). Breach of this is grounds for dismissal.
      *   **Do Not Add:** A clause mandating tipping. Instead, include a "Cost of Living & Customs" addendum in the offer letter. This document will explicitly state that tipping is standard practice, provide recommended percentages, and confirm that the stipend is calculated to include this expense.

  2.  **The Two Fellows:**
      *   **Queue/Traffic Fellow:** Issue a formal written warning. This behavior endangered a child and disrespected a peer. Make it clear that repeat behavior voids the fellowship.
      *   **Tipping Fellow:** Schedule a private call. Explain the local context (that servers live on tips). Request he remit the equivalent of the tip to the Festival, which we will pass to the restaurant staff anonymously. Do not threaten dismissal; treat this as a cultural misunderstanding corrected by education.

  3.  **The Complaining Staff Member:**
      *   Meet with them personally. Validate that their complaint was heard and was reasonable. Explain that we are distinguishing between safety issues (which carry penalties) and economic customs (which we are handling through policy updates). Thank them for protecting the Festival's relationship with the venue.

  4.  **Timeline:**
      *   Circulate this memo now (3 weeks pre-meeting).
      *   Board vote at the meeting.
      *   Communications to fellows and staff sent within 48 hours of approval.
      *   Updated Agreement language ready for next cohort (6 months out).

  **The Counter-Argument**

  I anticipate a strong objection from the Committee, and it deserves an honest hearing. The argument against my recommendation is that **differentiation looks like weakness.**

  If we tell the Fellows that cutting a line is punishable but not tipping is merely "educational," we risk signaling that the Festival's standards are negotiable. The board members who hold this view will argue that when we invite guests into our city, the burden of adaptation lies entirely with the guest, regardless of the custom's nature. To distinguish between "safety" and "economic" norms is to invite semantic arguments from difficult participants. Furthermore, regarding the tipping: there is a principled argument that the Festival should not enforce an exploitative wage model. By mandating tipping, we become complicit in the injustice. We should instead pay the server ourselves from the administrative budget and tell the fellow that tipping is optional, thereby protecting the worker without coercing the writer.

  **Why I Reject This:**
  While the "Zero Tolerance" approach is cleaner administratively, it is morally blunt. It equates jaywalking with wage structures, which they are not. And while the idea of the Festival covering the tip is noble, it sets an unsustainable precedent and hides the reality of the cost from future fellows. My proposal places the burden where it belongs: on the Festival to educate, and on the Fellow to participate in the local economy as it actually exists, not as they wish it to be.
