      *   *Problem of Old Evidence:* How can $e$ confirm $h$ if $P(e) = 1$? Standard Bayesian conditionalization yields $P(h|e) = P(h)$.
      *   *(a) Counterfactual-credence (Garber-style):* Very popular. Try to model what credence would be if we didn't know $e$. Criticism: Counterfactuals are vague; hard to define the "ignorance" state properly. Still, a strong contender.
      *   *(b) Likelihoodist:* Focus on $P(e|h)/P(e|\neg h)$. If $P(e)=1$, likelihoods are often 1, making ratio 1 (no confirmation). However, likelihoodists often argue $P(e|h)$ refers to logical entailment or predictive success, not subjective credence. If interpreted as logical probability, it works. If subjective, it fails the $P(e)=1$ constraint. Usually seen as avoiding the problem by changing the definition of confirmation. Strong, but depends on accepting Likelihoodism over Bayesianism.
