      *   **Core Argument to Develop:** This shows the derived/original distinction does no work. "Derived intentionality" is just a fact about our interpretive stance. Dennett collapses into Searle (our minds provide the *real* content) or Eliminativism (there is no content).
      *   **Counter-Argument:** Provide Dennett's best reply (Intentional Stance, change in interpretation *is* change in function).
      *   **Evaluation:** Assess whether Dennett's reply works or just relabels the problem.
