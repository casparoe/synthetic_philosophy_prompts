      *   *Check:* Did I avoid a literature survey? Yes, focus on the specific argument.
      *   *Check:* Is the Dennett reply charitable? Yes, focus on the *Idealized* Intentional Stance, not just whatever people say tomorrow.
      *   *Check:* Is the final bet clear? Yes.

  9.  **Final Polish:** (Mental check of the "Collapse" argument). The core tension is between *normativity* (correctness conditions) and *interpretation*. If interpretation determines correctness, there is no error. If interpretation tracks correctness, correctness exists independently. Dennett needs the latter to avoid absurdity, but the latter looks like Searle's "original" intentionality (grounded in design/history). I need to make sure this tension is highlighted.

      *Wait, one nuance:* Dennett grounds it in *Design Stance* (history) + *Intentional Stance* (prediction). In the Ruined Machine case, the Design History is lost. So we rely on Intentional Stance. If the Intentional Stance is wrong but consistent (because they rigged the tests), Dennett is in trouble. I need to press the "rigged tests" aspect. If they rig the environment to fit the theory, they are creating a new system (Machine + Rig). The Machine alone doesn't support the slug-theory. Dennett can say the *system boundaries* matter. Okay, I will incorporate that.

      *Let's sharpen the "Collapse" argument:* If content is derived from *us*, then content is a property of *us*, not the machine. Calling it "derived intentionality of the machine" is a category mistake. It's like saying a mirror has "derived vision." No, the viewer has vision. Dennett wants to say the mirror has a kind of vision (derived). The argument is that this is just confusing language for "we use the mirror to see."

