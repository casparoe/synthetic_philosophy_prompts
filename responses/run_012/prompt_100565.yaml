      *   Searle would say: A pattern is just physics until a mind interprets it as a function.
      *   Dennett would say: A pattern that supports prediction *is* a function, regardless of a mind.
      *   *Verdict on Reply:* It works *if* you accept Dennett's instrumentalism. It fails *if* you require intrinsic normativity. It doesn't just relabel; it shifts the metaphysical burden from "meaning" to "pattern."

