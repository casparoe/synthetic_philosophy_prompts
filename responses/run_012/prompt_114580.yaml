answer: |-
  **MEMORANDUM**

  **TO:** Benefits Eligibility Committee
  **FROM:** Committee Chair
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Eligibility Rules and Pending Petitions

  **Recommendation**

  I recommend that the Committee adopt a hybrid eligibility model: retain the spousal category based on legal marriage status, but establish a new, tightly bounded "Non-Conjugal Caregiver" category for benefits purposes. We should deny the proposal to replace marriage entirely with a universal "Care Partner" designation. Under this hybrid model, we should approve both pending petitions: the nurse's petition by clarifying the existing spousal rule, and the facilities supervisor's petition under the new Caregiver category. This approach balances administrative stability with equitable recognition of economic interdependence.

  **The Purpose of the Family Tier**

  We must first articulate what the family tier is for. The plan should not hold a theological or metaphysical view on what marriage is. Its business is risk pooling and financial subsidy. Therefore, the family tier exists to subsidize households that function as single economic units. When individuals pool income and share ordinary expenses, taxing them with individual premium rates creates a hardship disproportionate to their ability to pay. Similarly, survivor benefits exist to prevent the financial collapse of a dependent household upon an employee's death.

  When legal status and the substance of a relationship come apart, the plan should prioritize substance only when legal status is unavailable. Where legal marriage is accessible, it serves as a sufficient proxy for economic interdependence. Where it is not accessible, or where the relationship is non-conjugal but functionally identical to a household unit, the plan must look to evidence of interdependence. We are not validating relationships; we are verifying economic units.

  **Against the Universal Care Partner Proposal**

  The proposal to replace spousal categories with a universal Care Partner designation is philosophically consistent. It correctly identifies that pooled income and unpaid care are the defensible reasons for subsidy. However, rejecting this proposal does not rely on a slippery slope argument. It relies on administrative mechanism and stability.

  Marriage supplies a public, legal bright line that private attestation cannot. A marriage license is a verified public record; a Care Partner affidavit is a private claim. If we move entirely to attestation, we shift the burden of verification from the state to the Committee. This creates instability not because relationships are morally suspect, but because fraud is harder to detect without public records. The marital relationship supplies a third-party verification mechanism that pooled income alone does not. To discard this is to invite adverse selection, where employees designate high-cost individuals solely during open enrollment without genuine interdependence. The marital category reduces this risk through legal penalty and public recording. We should not abandon a verified legal status for a self-reported one unless necessary.

  **The Conjugal View**

  Some members hold that marriage is exclusively the union of a man and a woman oriented to family life, and that the plan should recognize that institution rather than define eligibility by function. This view holds that the plan's task is to support a specific social institution, not merely to subsidize households.

  My recommendation accommodates this view by retaining the spousal category, but it refuses to encode the theological definition into plan documents. Because state law now recognizes same-sex marriages, the plan deferring to "legal marriage" respects the institution of marriage as defined by the sovereign authority without the Committee endorsing a specific theological view. The Committee should deliberately leave the plan document silent on the *purpose* of marriage. We should not record reasoning that defines marriage as procreative or conjugal. To do so would entangle the nonprofit in cultural debates irrelevant to fiduciary administration. We recognize the legal status, not the metaphysical reality. This allows members to vote for the spousal category based on their own understanding of marriage while maintaining a neutral administrative standard.

  **Bedside Authority vs. Plan Eligibility**

  There is a glaring inconsistency between our clinical and administrative operations. The intensive care unit grants bedside authority to any adult a patient names on an intake form, recognizing that patients know best who cares for them. The benefits plan, conversely, denies eligibility to those same caregivers unless they are legal spouses or tax dependents.

  The institution should not run the same designation system for the plan as it does at the bedside. Bedside authority is clinical and temporary; it grants decision-making power, not financial subsidy. The plan involves long-term financial liability and tax implications. However, the inconsistency highlights a moral failure: we recognize a brother as a caregiver when he holds a dying patient's hand, but deny him survivor benefits when that patient dies. The hybrid model corrects this by creating a pathway for non-conjugal caregivers to qualify for financial support, aligning our financial recognition with our clinical reality without exposing the plan to unlimited liability.

  **Disposition of Petitions**

  **Petition 1 (Nurse):** Approve. The administrator denied enrollment based on the marriage not being valid in our state during the period in question. However, the plan document defines spouse by validity "in the jurisdiction where it was contracted." The marriage was valid there at the time. The administrator's reading imposes a residency requirement not in the text. We must honor the contract as written.

  **Petition 2 (Facilities Supervisor):** Approve under the new Non-Conjugal Caregiver category. She meets the interdependence criteria despite the lack of legal marriage or tax dependency.

  **Operational Rules**

  **Definition and Criteria:** The new "Non-Conjugal Caregiver" category is open to any adult unrelated by marriage who shares a household with the employee. To qualify, the employee must submit an affidavit demonstrating at least four of the six existing markers of interdependence: shared residence for three years, joint ownership or tenancy, a joint account, designation as beneficiary, mutual powers of attorney, or shared ordinary expenses.

  **Waiting Period:** The proposed two-year waiting period survives for the Caregiver category. This mitigates adverse selection by ensuring the relationship predates the enrollment request. No waiting period applies to legal spouses.

  **Transition Rule:** Current enrollees under the domestic-partner provision must re-attest under the new Caregiver criteria within six months. Those who cannot meet the four-of-six criteria will be grandfathered for one plan year only. Legal spouses are unaffected.

  **Effective Date:** The new rules become effective at the start of the next plan year.

  **Appeals:** The Benefits Eligibility Committee will hear appeals regarding Caregiver status determinations. Spousal determinations based on legal validity remain with the administrator, subject to legal review.

  **Cost and Audit:** Attestations will be audited annually. Random audits will require proof of shared residence (lease or utility bill) and proof of joint financial responsibility. Regarding cost, we anticipate a neutral impact. While the Caregiver category expands eligibility, the two-year waiting period and strict documentation requirements will limit uptake. The approval of Petition 1 involves retroactive costs, but these are one-time liabilities required to comply with the plan document.

  **Contingency**

  If legal review upholds the administrator's reading of Petition 1—that "valid where contracted" implies "valid where contracted and valid here currently"—we cannot enroll the nurse retroactively under the spousal category. In that contingency, the Committee should authorize an ex gratia payment equal to the claims denied during the exclusion period. This acknowledges that the employee acted in good faith under a reasonable reading of the plan, even if the legal interpretation ultimately favors the administration. We must not penalize an employee for marrying when and where it was legally possible for her to do so.

  This hybrid approach maintains the administrative stability of legal marriage while acknowledging the economic reality of care. It resolves the immediate petitions without dismantling the verified structures that keep the plan solvent. I urge the Committee to vote in favor of this recommendation on Thursday.
