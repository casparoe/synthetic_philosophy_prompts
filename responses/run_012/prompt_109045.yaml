  ### **Node 1: The Domesticated Breeds Test**
  **Question:** Are domesticated breeds (e.g., dog varieties, pigeon breeds) distinct species, subspecies, or artifacts of human selection?
  *   **Artifacts of human selection:** Go to **Node 2**.
  *   **Distinct Species/Subspecies:** Go to **Node 4**.

  ---

  ### **Path A: The Pragmatic Turn (From Node 1)**

  ### **Node 2: The Conservation Priority Test**
  **Question:** Does a population deserve legal protection and funding even if we aren't sure it counts as a "real" species?
  *   **Yes (Protection matters more than status):** Go to **Node 3**.
  *   **No (Only "real" kinds deserve protection):** Go to **Leaf A**.

  ### **Node 3: The Terminology Test**
  **Question:** Should we stop using the word 'species' entirely if it refers to artifacts, or keep it as a coordination tool?
  *   **Stop using it (It's misleading):** → **Leaf A: Eliminativism**
  *   **Keep it (It coordinates work):** → **Leaf B: Species as Practice**

  ---

  ### **Path B: The Realist Turn (From Node 1)**

  ### **Node 4: The Cryptic Species Test**
  **Question:** Should cryptic species that look identical but do not interbreed be split into separate taxa?
  *   **No (Look alike = same kind):** Go to **Node 5**.
  *   **Yes (Reproduction/Lineage matters):** Go to **Node 6**.

  ### **Node 5: The Morphological Essence Test**
  **Question:** Do look-alikes always belong together because morphological traits are fixed essences?
  *   **Yes:** → **Leaf C: Realism about Species as Classes (Essentialism)**
  *   **No (Traits cluster but vary):** → **Leaf D: Homeostatic Property Cluster (HPC) View**

  ### **Node 6: The Asexual Lineage Test**
  **Question:** Should asexual lineages that never interbreed but are ecologically and genetically coherent be counted as species?
  *   **No (Interbreeding is required):** Go to **Node 7**.
  *   **Yes (Lineage/ Ecology is enough):** Go to **Node 8**.

  ### **Node 7: The Fossil Homnin Test**
  **Question:** Should fossil hominins and extinct taxa be classified by the same criteria as living organisms (e.g., interbreeding)?
  *   **No (Living and extinct need different rules):** → **Leaf E: Monism (Biological Species Concept)**
  *   **Yes (One standard for all life):** → **Leaf F: Pluralism (Conceptual)**

  ### **Node 8: The Ring Species Test**
  **Question:** Whether a ring species with a gradual cline should count as one species or several?
  *   **One (Connected by gene flow):** Go to **Node 9**.
  *   **Several (Ends are distinct):** Go to **Node 10**.

  ### **Node 9: The Hybrid Zone Test**
  **Question:** Whether hybrid zones that produce fertile offspring undermine a species boundary?
  *   **Yes (Boundaries must be sharp):** → **Leaf G: Species-as-Individuals (Strict)**
  *   **No (Boundaries can be fuzzy):** → **Leaf D: Homeostatic Property Cluster (HPC) View** *[Note: Converges with Node 5]*

  ### **Node 10: The Horizontal Gene Transfer (HGT) Test**
  **Question:** Whether horizontal gene transfer across lineages makes a tree-like species concept untenable?
  *   **Yes (Tree structure breaks down):** Go to **Node 11**.
  *   **No (Tree structure holds mostly):** Go to **Node 12**.

  ### **Node 11: The Process Test**
  **Question:** Is 'species' best understood as a process of boundary-making and stabilization rather than a thing?
  *   **Yes:** → **Leaf H: Species as a Verb**
  *   **No:** → **Leaf A: Eliminativism** *[Note: Converges with Node 3]*

  ### **Node 12: The Lineage Test**
  **Question:** Is a species a concrete lineage with a beginning and end, not a class of organisms?
  *   **Yes:** → **Leaf I: Species-as-Individuals (Lineage)**
  *   **No:** → **Leaf F: Pluralism (Conceptual)** *[Note: Converges with Node 7]*

  ---

  ### **Position Glossary & Awkward Commitments**

  | Leaf | Position Name | Gloss (What it claims) | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Nominalism / Eliminativism** | Species terms are useful fictions or should be abandoned. | Must explain why biologists talk about species constantly if they don't exist. |
  | **B** | **Species as Practice** | 'Species' is a tool for coordinating research and conservation, neither true nor false. | Cannot claim scientific discoveries about species are objectively "true." |
  | **C** | **Realism: Classes (Essentialism)** | Species are real kinds defined by shared properties (essences). | Struggles to explain evolution and change over time without losing the "essence." |
  | **D** | **Homeostatic Property Cluster (HPC)** | Species are real but defined by a cluster of co-occurring properties rather than a single essence. | Boundaries are fuzzy, making counting species for a checklist difficult. |
  | **E** | **Monism (BSC)** | There is one correct species concept (usually interbreeding). | Cannot classify fossils or asexual organisms without contradiction. |
  | **F** | **Pluralism** | Different species concepts answer different legitimate questions. | 'Species' means different things in different contexts, risking communication errors. |
  | **G** | **Species-as-Individuals (Strict)** | A species is a concrete lineage with a beginning and end, not a class. | Boundaries are sharper than nature allows (hybrids become problematic anomalies). |
  | **H** | **Species as a Verb** | Species are not things but ongoing processes of boundary-making and stabilization. | Hard to "tick" on a list; requires tracking dynamics rather than static units. |
  | **I** | **Species-as-Individuals (Lineage)** | A species is a concrete lineage (segment of the tree of life). | Requires complete genealogy, which is often empirically inaccessible. |

  ---

  ### **Diagnostic Notes for Instructors**

  **1. Indistinguishable Combinations:**
  *   **HPC (Leaf D) vs. Pluralism (Leaf F):** In practice, these often yield the same advice (allow fuzzy boundaries/use different criteria). The tree separates them by *why* (clustered properties vs. different questions), but students may find them functionally identical.
  *   **Eliminativism (Leaf A) vs. Species as Verb (Leaf H):** If the "process" is too fluid, it looks like the "thing" doesn't exist. The distinction rests on whether the *process* itself is ontologically robust.

  **2. Unoccupied Branches:**
  *   **Essentialism + Asexual Lineages:** There is no leaf for "Yes" to Essentialism (Node 5) and "Yes" to Asexual Species (Node 6). This view is largely unoccupied because essentialism typically relies on fixed morphological or reproductive traits that asexuals violate.
  *   **Verb + Monism:** There is no leaf for "Species as a Verb" combined with "One Correct Concept." Process views generally imply that boundary-making varies by context (Pluralism), making a single "Verb" concept incoherent.
  *   **Eliminativism + Conservation Priority:** Node 2 routes those who prioritize conservation away from Eliminativism. It is rare to argue species don't exist *and* that we should fund conservation based on the term 'species.'

  **3. The "Birder's Paradox":**
  *   Notice that **Species as a Verb (Leaf H)** and **Strict Individuals (Leaf G)** are the most ontologically robust but the hardest to use for "ticking" lists. **Pluralism (Leaf F)** and **Practice (Leaf B)** are the easiest to use but the least satisfying for those seeking "truth." This tension drives the debate in your birding group.
