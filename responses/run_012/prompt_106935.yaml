answer: |-
  Here is the specification sheet for the seminar. I have structured this to foreground the tensions before we evaluate the specific mechanisms (selection, interpretation, covariance) proposed to resolve them.

  ### The Trilemma of Naturalizing Content

  Before examining the table, note that the desiderata below generate a **joint unsatisfiability result** for any theory attempting to satisfy all three of the following:
  1.  **Normativity:** The theory must allow for genuine misrepresentation (Case 3).
  2.  **Naturalistic Supervenience:** Content must supervene on physical facts (Case 5).
  3.  **Synchronic Individuation:** Content must supervene on the *current* physical state of the organism, independent of history (Case 4 & 5).

  You cannot have all three. If content supervenes on current physical state (3) and physical laws are descriptive (2), you cannot ground the normative distinction between "causing the state" and "satisfying the content" (1) without collapsing into the Disjunction Problem. Teleosemantics resolves this by rejecting (3) in favor of History. Interpretationism resolves this by rejecting (2) in favor of Normative Social Practices. Naive Causal theories resolve this by rejecting (1). This trilemma is the engine of the seminar.

  ### Desiderata for Naturalistic Content

  | Requirement | Motivating Case | Status | What It Excludes |
  | :--- | :--- | :--- | :--- |
  | **1. The Normativity Constraint**<br>The theory must explain how a state can be *false* or *malfunctional* relative to its content, not just causally mismatched. | **(3) Host Bird**<br>The bird accepts a parasite egg. The state is tokened, but the content ("This is my egg") is false. A theory that says "Content = Whatever causes the state" cannot call this an error. | **Non-Negotiable**<br>Without error, there is no intentionality, only correlation. | **Naive Causal/Informational Theories.**<br>(e.g., Early Fodor). If content is defined by causal covariance, the parasite egg *becomes* part of the content, eliminating error. |
  | **2. The Control/Representation Distinction**<br>The theory must distinguish systems that merely regulate variables from systems that represent the world *as* being a certain way. | **(1) Bacterium & (6) Thermostat**<br>The bacterium swims up gradients; the thermostat turns on heat. Neither seems to "believe" anything. If they have content, panpsychism or triviality follows. | **Non-Negotiable**<br>*(Note: Enactivists reject this requirement itself, but for representationalists, it is mandatory.)* | **Radical Enactivism / Cybernetics.**<br>Theories that equate feedback loops with semantic content. If a thermostat has beliefs, the concept of belief loses its explanatory power. |
  | **3. The Determinacy Constraint**<br>The content must be specific enough to guide behavior uniquely, not a disjunction of compatible causes. | **(2) Moth**<br>The detector fires for bats (selected function) but also courtship signals (current cause). Is the content "Bat!" or "Ultrasound!" or "Danger-or-Mate!"? | **Non-Negotiable**<br>Indeterminate content cannot explain specific avoidance behavior. | **Ambiguous Functionalism.**<br>Theories that cannot privilege one causal role over another when multiple roles are present. |
  | **4. Causal Relevance**<br>The content attributed to the state must play a role in producing the behavior associated with that content. | **(1) Bacterium & (2) Moth**<br>The internal state must mediate between input (gradient/bat) and output (swim/dive). | **Non-Negotiable**<br>If content is epiphenomenal, naturalizing it is biologically pointless. | **Epiphenomenalist Semantics.**<br>Theories where content is a byproduct (e.g., some reading of Dennett) that does not enter the causal chain of behavior. |
  | **5. Historical Grounding**<br>Content is determined by the etiological history of the mechanism (selection or learning), not just current structure. | **(4) Neural Nets & (5) Swampman**<br>Identical nets trained on edges vs. shadows have different contents. Swampman has no history. | **Camp Preference**<br>(Teleosemantics: Yes. Interpretationism/Synchronic Functionalism: No.) | **Synchronic Theories.**<br>(e.g., Swampman-friendly accounts). If required, this kills any theory that grants content to molecule-duplicates without history. |
  | **6. Naturalistic Supervenience**<br>Content facts must supervene on non-semantic physical facts (broad or narrow). | **(5) Swampman**<br>Even if Swampman lacks content, the facts determining that lack must be physical, not magical. | **Non-Negotiable**<br>Required for any project claiming to *naturalize* content. | **Dualism / Mysterianism.**<br>Any view that posits content as a primitive non-physical property. |

  ### Analysis of Exclusionary Power

  While **Historical Grounding** (Req 5) is the distinctive feature of teleosemantics, it is a camp preference; interpretationalists deny it. The requirement that does the most exclusionary work across *all* naturalistic projects is **The Normativity Constraint** (Req 1).

  It is the primary driver of the literature. Simple causal theories fail it immediately (the Disjunction Problem). Simple informational theories fail it (misinformation is just rare information). Even some functional role theories fail it if they cannot distinguish normal from abnormal functioning without begging the question. It forces every viable theory to introduce additional machinery (selection history, ideal conditions, interpretive norms) solely to account for the possibility of being *wrong*. Without this requirement, naturalizing content is trivial; with it, it becomes the hard problem you are teaching.

  \answer{The Normativity Constraint}
