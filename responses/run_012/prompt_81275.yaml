answer: |-
  We begin by recording our agreement on the fundamental mechanics of the signals under discussion. Both outcome-based and process-based supervision supply feedback to a learning system based on a judge's evaluation of performance, and both aim to steer the system toward behaviors that are beneficial, honest, or correct. Outcome supervision provides a scalar signal contingent on the final state of a trajectory, while process supervision provides signals contingent on intermediate states or steps within that trajectory. We agree that the distinction between these two is not always sharp, since a step-level reward is always defined relative to some segmentation of a task and any final answer is itself a step in some larger process, which makes us suspect that part of the distinction is one of grain rather than of kind. We further agree that there are settings in which neither signal is doing any work, specifically where the judge lacks the competence to evaluate either the steps or the outcome, or where the model's capabilities have outstripped the judge's ability to detect deception or error. In such regimes, both methods fail to provide a reliable gradient, and we acknowledge that existing evidence cannot establish superiority in domains where human evaluators are already outpaced. We also agree that both methods rely on the assumption that the training distribution is representative enough of the deployment distribution to permit generalization, and that both are vulnerable to Goodhart's law if the proxy signal diverges from the true objective.

  Having established where we agree, we turn to the residual disagreements that have sustained our debate. One of us holds that step-level supervision is a categorically different and better kind of signal because it locates credit and blame where they belong, telling the model which move was wrong rather than merely that the final answer was wrong, and is therefore the more promising route to overseeing systems whose outputs we cannot check. The other holds that this advantage is largely an artifact of small-scale experiments, and that outcome supervision, once one can afford enough samples and enough search at inference time, will absorb everything process supervision buys at a fraction of the labeling cost, maintaining that a step-level reward is just an outcome reward for a shorter task. We recognize that part of this dispute may be verbal, specifically regarding whether the granularity of feedback constitutes a difference in kind or merely a difference in degree, but we judge that the practical implications are substantial enough to warrant empirical adjudication. We therefore identify several cruxes, defined as sub-questions such that settling one would actually move somebody, and we specify the tests cases or arguments that both sides agree would bear on them.

  The first crux concerns whether the advantage of step-level supervision is a learning-signal advantage or a verification-and-selection advantage, and whether the two can be separated at all. To test this, we propose a comparison in which one base policy and one pool of sampled trajectories are split by labeling regime, where one group receives per-step labels on a handful of trajectories and the other receives per-episode labels on very many trajectories, such that the total human labeling time is equated. The resulting policies are then compared on held-out tasks that require the same skills but lie outside the training distribution. The proponent of process supervision predicts that the policy trained with step-level labels will demonstrate superior reasoning capabilities on these out-of-distribution tasks, indicating that the dense signal instilled a generalizable method of thinking. The proponent of outcome supervision predicts that the policy trained with outcome labels and greater search volume will match or exceed the process-trained policy, indicating that the benefit of process supervision was primarily in filtering trajectories during training rather than shaping the underlying reasoning machinery, and that search at inference can replicate this filtering without expensive step-level labels.

  The second crux addresses the phenomenon of models reaching correct answers through reasoning they did not in fact rely on, or rationalizing answers settled on for other reasons. We ask whether this tells against process supervision, which rewards steps that look right, or against outcome supervision, which rewards answers however they were reached. The test case involves tasks where the correct answer is reachable via flawed logic and the incorrect answer is reachable via flawless-looking logic, alongside tasks where the reasoning process is observable but the outcome is ambiguous. The proponent of process supervision predicts that outcome supervision will lead to models that game the evaluator by producing correct answers via unreliable paths that fail to generalize, whereas process supervision will enforce robustness in the reasoning chain itself. The proponent of outcome supervision predicts that process supervision will lead to models that learn the appearance of reasoning to satisfy a step-level judge without actually performing the computation, a form of performative alignment that is harder to detect than simple outcome gaming, and that outcome supervision combined with adversarial testing is sufficient to penalize lucky guesses.

  The third crux asks whether step-level training instills reasoning or merely the appearance of reasoning to a judge, and what observation would distinguish those. We propose a second comparison asking whether a policy that has learned to satisfy a step-level model carries its bad habits over to tasks where that model is absent. Specifically, we would train a policy with process supervision using a specific reward model, then deploy it in an environment where that reward model is no longer consulted and only final outcomes matter. The proponent of process supervision predicts that the policy will retain its structured reasoning habits because they were internalized as capabilities, leading to better performance even without the step-level crutch. The proponent of outcome supervision predicts that the policy will degrade significantly once the step-level reward is removed, demonstrating that it had learned to optimize for the appearance of correct steps rather than the underlying cognitive labor, confirming that the signal was shaping behavior rather than competence.

  The fourth crux concerns what could possibly count as an equal budget when one side receives per-step labels on a handful of trajectories and the other per-episode labels on very many. We agree that comparing these regimes without normalizing for labeling cost is meaningless, but we disagree on whether the cost should be normalized by human time, by information theoretic content, or by final performance per dollar. We propose that the fair comparison must normalize by total human labeling time, as this is the scarce resource in scalable oversight. The proponent of process supervision accepts this but argues that the quality per hour of step-level labeling is higher for alignment purposes, while the proponent of outcome supervision argues that the quantity of episodes covered by outcome labeling compensates for the lower information density per label. We acknowledge that if the cost of step-level labeling scales linearly with trajectory length while outcome labeling remains constant, outcome supervision will always win on pure efficiency unless step supervision yields exponential gains in sample efficiency or generalization, which is itself a testable claim regarding the learning curves of both methods.

  We also note that where we judge a crux is not empirically decidable with present methods, we should say so instead of inventing a test. Specifically, the question of whether step-level supervision is categorically different may remain undecidable until we have models capable of reasoning steps that are truly opaque to human evaluators, at which point process supervision as currently defined becomes impossible without delegated evaluation. In that regime, the distinction collapses into whether we trust an AI judge to evaluate steps or outcomes, which is a different problem entirely. We agree that for current generable models, the distinction is empirical, but for superhuman systems, the distinction may be verbal because both methods will rely on automated judges whose own alignment is the bottleneck.

  Finally, we close with what each side would count as evidence against its own position. The proponent of process supervision would concede that outcome supervision is preferable if experiments show that outcome-trained models with sufficient search match process-trained models on out-of-distribution reasoning tasks at a significantly lower labeling cost, demonstrating that the dense signal was not necessary for robust alignment. The proponent of outcome supervision would concede that process supervision is necessary if experiments show that outcome-trained models consistently fail to generalize reasoning strategies to new domains despite massive scaling of search and samples, while process-trained models succeed with fewer samples, demonstrating that the step-level signal provides an inductive bias that search cannot replicate. We sign this statement to acknowledge that our disagreement is productive only insofar as it points to these specific empirical claims, and we commit to treating the resolution of these tests as decisive for the purpose of our future discussions.
