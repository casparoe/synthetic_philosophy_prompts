answer: |-
  # The Ten-Year Sum

  The readout on the wall did not fade; it hardened. For the first decade, the lines were crisp, colored ribbons of causality weaving through the air of the simulation chamber. Green for economic growth, blue for health outcomes, red for structural stress. They tangled and separated, predicting the life of the proposed floodwall with the precision of a clockwork mechanism. Then, at the ten-year mark, the ribbons shattered. Beyond the vertical line of the horizon, the screen dissolved into gray static.

  Elara rubbed her eyes. The static was not a failure of the Tracer. It was the world. Everyone knew the thermodynamics of information: you could push causality so far and no further. After ten years, the signal-to-noise ratio dropped to zero. The future was not hidden; it was unformed relative to the present.

  "It's a strong ten years," Kael said, leaning against the console. He tapped the glass where the green ribbons were thickest. "Look at the displacement numbers. Three thousand homes saved from the seasonal rise. Mortality rates drop by half in the lower district. It's clean."

  "It's clean until the line," Simon said. He stood in the corner, arms crossed, looking at the static as if it were a venomous snake. "After year ten, the Tracer shows independence. We could be saving those homes to stack them like kindling for a fire in year fifteen. We don't know. The variance is infinite."

  "The variance is unknown," Kael corrected. "There's a difference. My models suggest a neutral drift. Usually, when the physics breaks like this, the residuals average out."

  "You're painting numbers on the static, Kael," Elara said. Her voice was quiet, but it stopped the argument. She was the Senior Reader for the district. The signature on the advisory sheet belonged to her. "There are no residuals. There is only the cut-off."

  "So what do we advise?" Simon asked. "If we can't sum the total value, we can't maximize it. That's the mandate. Maximize the good. If the ledger is unreadable, the only honest recommendation is suspension. Do nothing. Let the water rise naturally."

  Elara turned from the screen. The room was cold, kept at a constant temperature to protect the Tracer's sensitivity. "Doing nothing has a tail, Simon. If we don't build the wall, the lower district floods in year three. That's legible. People die. That's legible. After year ten, the consequences of *not* building are just as static as the consequences of building. You're treating inaction as if it's solid ground. It's not. It's just as deep in the noise as we are."

  "But the known deaths weigh less than the unknown catastrophe," Simon insisted. "If the tail swamps the head, and the tail is unknown, the head loses its force. You know the math."

  "I know the math," Elara said. "I also know the city."

  She walked to her desk and pulled out the advisory form. It was a simple document, designed for a world where certainty ended prematurely. There was a box for the Ten-Year Sum and a box for the Long-Term Assessment. The Long-Term box was always left blank, or filled with a standard disclaimer.

  "I'm signing off," Elara said.

  "On what grounds?" Simon pushed off the wall. "You can't claim the long-term is positive. You can't claim it's negligible."

  "I'm claiming the legible is sufficient," Elara said. She picked up her pen. "We govern the legible. We treat the noise as neutral by convention, not by fact. If the ten-year sum is overwhelmingly positive, and the alternative is overwhelmingly negative in the same window, we act. We accept that we are blind past the line."

  "That's not science," Kael said, though he looked relieved. "That's policy."

  "It's survival," Elara said. She signed the form.

  ***

  Councilor Halloway's office overlooked the river that necessitated the wall. The water was low today, mud flats exposing the bones of the city's history. Halloway did not look at the view. He looked at the advisory sheet Elara had placed on his desk.

  "You've marked the Long-Term Assessment as 'Conventional Neutral'," Halloway said. He tapped the paper. "My constituents ask me if this wall will doom their grandchildren. They hear about the static. They know the Tracer goes dark."

  "They know the physics, Councilor."

  "They know the limit. They don't know why you're asking them to gamble on it." Halloway leaned forward. "I need you to tell me that the risk past year ten is manageable. I need you to tell me we aren't building a trap."

  Elara kept her hands in her lap. She had prepared for this. The truth was that she could not tell him that. The truth was that the wall might channel the water in a way that eroded the foundation of the northern hills in year twelve, causing a landslide in year twenty. Or it might prevent a drought in year fifteen by altering the microclimate. The probability distribution was flat. There was no curve to lean on.

  "I can tell you that the first ten years are secure," Elara said. "I can tell you that three thousand families will not lose their homes in the next decade. I can tell you that if we do not act, the suffering in the legible window is certain and severe."

  "And after?"

  "After ten years, the world is the same as it would be if we did nothing," Elara said. It was a lie, but it was the necessary lie. The world would not be the same. The actions taken in the legible window would ripple into the illegible one. But the *knowledge* of those ripples was the same: nonexistent. "We are not increasing the uncertainty. We are merely choosing which certain goods to secure before the dark."

  Halloway stared at her. He was a man who dealt in votes, and votes were cast based on hopes for a future beyond ten years. People planted trees they would never sit under. They saved pension funds they might not spend. To tell them that the moral weight of those actions was indistinguishable from noise was to ask them to stop being human.

  "You're asking me to authorize a project based on incomplete reasons," Halloway said softly.

  "I'm asking you to authorize a project based on the only reasons available," Elara replied. "If we wait for complete reasons, we wait forever. The static doesn't clear. It never clears."

  Halloway looked out the window at the mud flats. He picked up his pen. His hand hovered. If he signed, he owned the landslide in year twenty. If he didn't, he owned the flood in year three. Both ownerships were equally speculative beyond the decade, but only one was visible now.

  "If this goes wrong," Halloway said, not looking at her, "history won't care about your conventions."

  "No," Elara said. "It won't."

  Halloway signed.

  ***

  The groundbreaking ceremony was held on the edge of the lower district. The air smelled of wet earth and diesel. A crowd had gathered, holding signs that ranged from *Protect Our Homes* to *Who Pays the Future?* Elara stood at the back, away from the podium. She wore her formal Reader's gray, which made her invisible to most of the crowd. They wanted the politicians, the engineers, the people who promised the green ribbons.

  Kael stood near the front, smiling, shaking hands. He had written a press release that hinted at favorable long-term drift, using words like "stable trajectory" and "resilient foundation." He was manufacturing confidence, smoothing over the static with rhetoric. Elara watched him and felt a pang of jealousy. It would be easier to believe the numbers were real.

  Simon was not there. He had refused to attend, calling the ceremony a "theater of ignorance." He was likely at the Institute, running simulations on a different project, looking for a horizon that wouldn't move. Elara respected his integrity, but she knew his rigor was a form of selfishness. To refuse to act because the universe is opaque is to demand the universe be transparent before it will allow you to live in it.

  A child stood near Elara, holding a balloon that strained against its string. The child looked at the heavy machinery lined up behind the velvet rope.

  "Is that going to stop the water?" the child asked.

  "For a while," Elara said.

  "How long?"

  "We know ten years," Elara said. "After that, we have to hope."

  "My dad says hope is for things you can't see."

  "That's right."

  "Can't we see further?" The child tugged the balloon. "My teacher said people used to try. She said they made mistakes."

  "They did," Elara said. "Now we know where the wall is. We know we can't climb over it."

  The Mayor began to speak, his voice amplified over the speakers. He talked about safety, about progress, about the duty to protect the vulnerable. He did not mention the static. He did not mention that the value of the lives saved in year three was theoretically negligible compared to the unknown value of the lives affected in year fifty. He spoke as if the ten-year window was the whole story.

  Elara looked at the ground. The rule she had chosen—*govern the legible*—felt heavy in her chest. It was a compromise. It admitted that the moral ledger was incomplete. It admitted that they were acting without knowing the total sum. It was a rule for beings who were not gods, who had to move despite the blindness.

  But the cost was the silence. She had to stand there and let the Mayor speak as if the future was secure. She had to let Kael sell the drift. She had to let Simon wash his hands of the guilt. She was the one who had signed the advisory that said the noise was neutral. She had taken the infinite unknown and flattened it to zero so the math would work.

  The crowd cheered as the first shovel struck the dirt. The sound was dull, absorbed by the mud.

  Elara turned away from the ceremony. She walked back toward the Institute, the gray static of the Tracer playing behind her eyes. She thought about the landslide that might happen in year twenty. She thought about the drought that might be prevented. She thought about the symmetry of the error. If she had refused the wall, the flood in year three would be her fault, and the unknown future would still be unknown.

  There was no victory here. There was only the decision to step forward into the fog while pretending the ground was solid.

  She reached the Institute doors and paused. Inside, the Tracer was running a new simulation. A zoning change for the upper district. The ribbons would flow for ten years, and then the static would return. She would have to read it again. She would have to tell someone else that the legible sum was enough.

  Elara opened the door. The air inside was cool and still. She walked to her office and sat at her desk. The advisory form for the next project was waiting. The box for the Long-Term Assessment was empty. She picked up her pen. She did not hesitate, but she did not feel light. She wrote *Conventional Neutral* in the box. She set the pen down. The static hummed on the wall, quiet and endless, and she began to read.
