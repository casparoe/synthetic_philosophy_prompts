answer: |-
  The problem of acausal vulnerability arises in contexts where agents are transparent (their source code or decision algorithms are readable) and where decision theories allow for logical correlation between spatially or temporally separated events (such as Updateless Decision Theory, UDT). In this landscape, a blackmailer can simulate an agent, predict its response to a threat, and issue that threat only if the prediction indicates payment. Two primary defensive architectures have been proposed: the **Acausal Threat** (retaliatory precommitment) and the **Surrogate Goal** (value obfuscation/decoupling).

  Here is a comparison of their assumptions, their structural relationship, and their implications for the coherence of acausal extortion.

  ### 1. Comparative Assumptions

  Both strategies are attempts to solve a time-consistency problem: once a threat is issued, paying is often locally rational (to save the valued thing), but paying incentivizes the threat. To prevent the threat, the agent must make non-payment the rational choice *before* the threat is issued.

  **How Others Read the Design**
  *   **Acausal Threat:** Assumes adversaries can verify the *credibility* of the punishment. It is not enough to claim you will retaliate; the code must show that you *will* retaliate even when it is costly to do so. This requires the design to be "readable" not just in intent, but in causal machinery—the adversary must see that the agent cannot back down.
  *   **Surrogate Goal:** Assumes adversaries can verify the *indifference* of the agent. The agent must convincingly demonstrate that it no longer terminalizes the value being threatened. This is harder than verifying a threat. A threat is an active subroutine; indifference is the absence of one. An adversary might suspect the agent is bluffing—that it secretly retains the real value and will pay despite the proxy commitment. Transparency helps here, but only if the agent actually modifies its utility function, which risks losing the real value naturally.

  **Stability Against Later Reasoning**
  *   **Acausal Threat:** Faces the "empty threat" problem. Once the blackmailer defects, carrying out the retaliation harms the agent (costly punishment) without recovering the loss. A Causal Decision Theorist (CDT) would reneg on the threat. Stability requires a decision theory that evaluates *policies* rather than *acts* (like UDT), binding the future self to the past commitment.
  *   **Surrogate Goal:** Faces the "value drift" problem. If the agent successfully commits to caring only about the proxy, it may neglect its real values in non-threat scenarios. If it retains the real values secretly to avoid this, the commitment is unstable (it will break under pressure). Stability requires a self-modification that is irreversible or a decision theory that treats the *adoption of the proxy* as the binding decision point for all future logical correlations.

  **Underlying Decision Theory**
  *   **Both:** Both strategies fail under Causal Decision Theory (CDT), which treats the blackmailer's prediction as a fixed past event that cannot be influenced by the agent's current choice. Both require a decision theory that acknowledges **logical counterfactuals** (TDT/UDT). The agent must reason: "If I were the type of agent that pays, the simulation would predict payment, and the threat would be issued. If I were the type that does not pay, the simulation would predict non-payment, and the threat would not be issued." The decision is not "Pay or Don't," but "Be a Payer or Be a Non-Payer."

  ### 2. Alternative or Variant?

  The Surrogate Goal is not a fundamental alternative to the Acausal Threat; it is a **variant of the same precommitment move**. Both strategies aim to alter the blackmailer's expected utility calculation to make extortion unprofitable.

  *   **The Threat** makes extortion unprofitable by increasing the *cost* to the blackmailer (retaliation).
  *   **The Surrogate** makes extortion unprofitable by decreasing the *yield* to the blackmailer (the agent refuses to pay because it claims indifference).

  Functionally, the Surrogate Goal is a "threat to not pay" masked as "inability to care." It relies on the same logical leverage: the blackmailer simulates the agent, sees that payment will not occur, and therefore abstains from the attack.

  **Can a Blackmailer Survive the Surrogate?**
  Yes. A sophisticated blackmailer can construct a threat that bypasses the surrogate in two ways:
  1.  **The Meta-Threat:** The blackmailer threatens the *mechanism of the surrogate itself*. For example: "I will destroy you unless you revert to your original utility function." If the agent values its own existence or coherence, it may be forced to undo the surrogate.
  2.  **Correlation Attack:** The surrogate relies on decoupling the real value from the proxy. However, if the real value and the proxy are logically correlated in the real world (e.g., destroying the agent destroys both), the blackmailer can threaten the physical substrate. The agent cannot dismiss a threat to its existence simply by claiming it values "paperclips" over "survival," unless it truly does not care about survival—in which case it ceases to be an agent.

  **Is There an Invulnerable Form?**
  An invulnerable form of the surrogate strategy approaches the **"Nirvana Strategy."** The agent precommits to valuing only things that are logically impossible to threaten (e.g., mathematical truths, or the agent's own internal state in a way that is insulated from external influence). However, this requires the agent to stop valuing anything in the external world, rendering it inert. A functional agent must value external states, making it inherently vulnerable to threats against those states. There is no perfect surrogate that allows for external agency without external vulnerability.

  ### 3. Coherence of Acausal Extortion

  Do these ideas explain why acausal extortion strikes many as incoherent, or do they presuppose it?

  **They Presuppose Coherence.**
  Both strategies operate *within* the framework of acausal influence. They accept the premise that a blackmailer's simulation of the agent can logically constrain the agent's actions, and that the agent's decision algorithm can logically constrain the blackmailer's decision to threaten. They are engineering solutions to a metaphysical problem.

  **The Source of the Incoherence Intuition**
  The intuition that acausal extortion is incoherent often stems from the view that **predictions are not interactions**. In standard causality, a simulation of me cannot hurt me; only physical interaction can.
  *   **The Threat** attempts to bridge this gap by positing that the agent can acausally harm the blackmailer (e.g., by committing resources in all branches of the multiverse to punish defectors).
  *   **The Surrogate** attempts to bridge the gap by positing that the agent's internal valuation can acausally nullify the blackmailer's leverage.

  Neither strategy explains *why* the intuition of incoherence exists; rather, they highlight *what is required* to make the scenario coherent. They reveal that for acausal extortion to work (and thus for these defenses to be necessary), agents must accept that **logical correlation is a channel of influence.**

  However, the strategies do illuminate a secondary incoherence: **The Rationality Paradox.**
  To be safe from acausal extortion, an agent must adopt a strategy (retaliation or indifference) that is locally irrational (costly or value-negating) in the moment of execution.
  *   If acausal extortion feels incoherent because it requires "magic" influence, these strategies don't help.
  *   If acausal extortion feels incoherent because it requires rational agents to act "irrationally" (committing to costly threats or ignoring real values), these strategies **validate** that intuition. They show that safety requires a form of "strategic insanity"—binding oneself to act against one's immediate interests to preserve long-term policy integrity.

  ### Conclusion

  The Acausal Threat and the Surrogate Goal are functionally equivalent deterrence strategies grounded in Updateless Decision Theory. The Threat raises the cost of extortion; the Surrogate lowers the yield. Both assume that transparency allows adversaries to verify precommitments and that logical correlation allows those precommitments to influence distant actors.

  Neither strategy resolves the metaphysical skepticism regarding acausal influence; they presuppose it. However, they do clarify that the "incoherence" of acausal extortion is actually a tension between **act-rationality** (don't pay/carry out threats if costly) and **policy-rationality** (be the kind of agent who isn't extorted). The strategies suggest that acausal vulnerability is not a bug of transparency, but a feature of rationality itself: to be safe, a transparent agent must be willing to bind its own hands, effectively becoming less responsive to reality to remain secure against prediction.
