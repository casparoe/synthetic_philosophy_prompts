      *   *Critique:* Both strategies presuppose that the blackmailer's simulation of the agent is causally/logically linked to the agent's actual decision in a way that allows leverage. If one argues acausal extortion is incoherent because "you can't change the past/simulator," these strategies don't address that metaphysical objection; they just optimize within the framework.
      *   *Nuance:* The Surrogate Goal might highlight the incoherence by showing the absurdity of valuing things based on threat vectors rather than intrinsic worth. But generally, they presuppose coherence.

