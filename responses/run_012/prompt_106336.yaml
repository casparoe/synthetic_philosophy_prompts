      *   *Better Surrogate:* The "Schelling Point" surrogate. Care about something arbitrary that is hard to threaten.
      *   *The "Threat that survives it":* A threat that targets the *mechanism of surrogacy* itself. "I will destroy you unless you revert to your real values." Or a threat that targets the correlation between the proxy and reality.

  6.  **Coherence of Acausal Extortion:**

