      *   *Correct Interpretation of Surrogate Goal (Armstrong/Stanford):* You care about $X$. You precommit to *only* responding to threats against $Y$. You make $Y$ hard to threaten or irrelevant. Or, you precommit to ignoring threats against $X$.
      *   *Actually, the most robust version:* You care about $X$. You create a subagent or a policy that cares about $Y$. You make it so that threatening $X$ is interpreted by the policy as threatening $Y$. If you don't care about $Y$, you don't pay.
      *   *Problem:* If you don't care about $X$ anymore (because you switched to $Y$), you won't save $X$ naturally.
      *   *Resolution:* The Surrogate Goal is usually proposed as: "Care about $X$, but publicly commit to caring about $Y$, and make it impossible to revert." This only works if $Y$ correlates with $X$ in normal circumstances but decouples under threat.
      *   *Let's stick to the prompt's phrasing:* "lands on the proxy and can be dismissed." This implies the threat is *redirected*.
