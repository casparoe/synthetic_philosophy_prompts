  3.  **Drafting the Applications:**

      *   *Case A:* Term limits removed, court packing, militarized police, opposition prosecution.
          *   *Expectation:* High risk. Likely "Apt" on Contingent, maybe "Strained" on Structural (no empire/army).
      *   *Case B:* Parliamentary, strong courts, PR, no army, demagogue lost re-election.
          *   *Expectation:* Low risk.
          *   *User Constraint:* "I expect the procedure to tell me Case B is decorative at best — I would rather it did not... Where the procedure gives me an answer I dislike, say so plainly."
          *   *Action:* I must follow the logic of the procedure. If Case B lacks the mechanisms, the verdict *must* be Inapt/Decorative, even if the client wants a scary story. I need to be explicit that the tool says "No" here.

  4.  **Refining the Limitations Section:**

      *   Need to address:
          *   Confirmation bias (finding analogues if you look hard).
          *   Survivorship bias (Rome fell, but other republics survived crisis).
          *   Hindsight bias (inevitability).
          *   The "No Army" problem (modern states have monopolies on violence, but not private armies).

  5.  **Review against Constraints:**

      *   *Two analysts, one day?* Yes, keep it concise.
      *   *Specific Roman mechanisms?* Yes (Gracchi, Sulla, Marius, Caesar).
      *   *Structural vs. Contingent?* Yes, Phase 0 forces choice.
      *   *Analogue/Inapt check?* Yes, built into every question.
      *   *Verdict vocabulary?* Apt, Decorative, Inapt.
      *   *Case A & B run-through?* Yes.
      *   *Honesty on Case B?* Yes, will explicitly state the tool rejects the Rome narrative for Case B.

  6.  **Writing - Section by Section:**

      *   *Introduction:* Set the tone. Professional, cold, analytical.
      *   *The Protocol:* Numbered steps. Clear decision trees.
      *   *The Verdicts:* Define the terms clearly.
      *   *The Blind Spots:* Critical self-assessment of the tool.
      *   *The Applications:* Run Case A and Case B through the steps.
      *   *The Hard Truth:* Address the Case B expectation directly.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Army." I need to specify *loyalty to commander vs. state*. For modern states, this translates to police/military loyalty to the person vs. the constitution.
      *(Self-Correction on Case B)*: The user says "I would rather it did not [give a Decorative verdict] since the client is paying for a Rome narrative." My instruction is: "Where the procedure gives me an answer I dislike, say so plainly rather than softening the verdict." So I must conclude Case B is *Inapt* or *Decorative* and tell the user "The tool says no, even if you want yes."

      *(Refining Verdict Definitions)*:
      *   **Apt:** Mechanisms align. Risk of regime change is structural or cascading.
