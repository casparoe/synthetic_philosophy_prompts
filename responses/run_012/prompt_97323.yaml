      *(Refining the "Human Review" points)*: These need to be where data ends and interpretation begins. E.g., Is the prosecution *actually* political? Is the violence *state-sanctioned*?

  7.  **Final Polish:** Check tone. Ensure no academic fluff. Ensure the distinction between Structural and Contingent is sharp.

      *Wait, one nuance:* The prompt asks for "Apt, Decorative, Inapt".
      *   *Apt:* The analogy holds; risk is real.
      *   *Decorative:* The analogy is superficial; risk is low/different.
      *   *Inapt:* The analogy is wrong; do not use this framework.

      *Case B:* It has a demagogue. That's "Decorative" at best. But since the demagogue *lost*, the contingent cascade is broken. The structural elements (army, empire) are missing. So it should be **Inapt** for a "Late Republican" diagnosis, or **Decorative** if we just mean "populism exists." I will aim for **Inapt** regarding the *breakdown* question, as that is the client's core query ("entering late-Republican phase"). Actually, "Decorative" fits the user's expectation better ("decorative at best"). I will land on **Decorative** but explain why it doesn't signal risk.

