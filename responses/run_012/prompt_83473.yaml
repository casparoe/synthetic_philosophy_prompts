          4.  Clarify the roles of exaptation, constraint, and drift.
          5.  Maintain scientific rigor (acknowledge disagreement/nuance, no false consensus).
          6.  Validate the "byproduct story" without humoring the user (be honest about its limits).

  2.  **Deconstruct the One-Liner:** "If it's still around, it must be doing something."
      *   *Surface meaning:* Persistence implies utility.
      *   *Underlying assumptions:* Selection is the only filter; neutrality is rare; structure implies function.
      *   *Key distinctions needed:* Causal role vs. Selected effect; Current utility vs. Historical selection; Positive selection vs. Absence of negative selection.

  3.  **Drafting the Claims (Boring to Ambitious):**
      *   *Claim 1 (Causal Role):* It has *some* causal effect on the phenotype/environment. (Trivially true, mostly).
      *   *Claim 2 (Negative Selection/Purifying):* It isn't harmful enough to be weeded out. (True, but weak).
      *   *Claim 3 (Current Utility):* It contributes to fitness *now*. (Contested/Context-dependent).
      *   *Claim 4 (Historical Adaptation):* It exists *because* it was selected for in the past. (The Adaptationist assumption).
      *   *Claim 5 (Optimality):* It is well-designed for that function. (False/Exaggerated).

  4.  **Analyzing the Opponent's Move (The "Spandrels" Debate):**
      *   The opponent argues: Persistence $\rightarrow$ Selection $\rightarrow$ Not a Byproduct.
      *   To defeat the Spandrels argument, the opponent needs to prove that *persistence implies historical selection for that specific trait*.
      *   *The Gap:* Persistence can be due to drift, constraint, or linkage.
      *   *The Necessary Claim:* The opponent needs Claim 4 (Historical Adaptation). Claim 1 or 2 isn't enough to rule out "byproduct."

  5.  **Addressing Key Concepts (Drift, Constraint, Exaptation):**
      *   *Drift:* Things persist because they aren't *bad*, not because they are *good*. This directly undermines "must be doing something [useful]."
      *   *Constraint:* Things persist because they *can't change* (developmental/physical), not because they are selected.
      *   *Exaptation:* Things persist because they were selected for $X$, now used for $Y$. This complicates "doing something" (it is doing something, but not what explains its origin).
      *   *Spandrels:* Specifically argues against Claim 4.

