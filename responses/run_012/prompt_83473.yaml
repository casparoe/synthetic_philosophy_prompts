answer: |-
  Your suspicion is well-founded. That one-liner ("if it's still around, it must be doing something") is a classic piece of adaptationist rhetoric that relies on equivocation. It slides between causal role, current utility, and historical explanation. In the philosophy of biology, this is often called the "Adaptationist Programme," and while it's a useful heuristic, treating it as a law is where the errors creep in.

  Since you have a biology background, I will skip the basics of natural selection and focus on the logical structure of the claim and where the consensus actually breaks down.

  Here is the dissection of the sentence into distinct propositions, ranked from trivial to ambitious, with verdicts based on current evolutionary theory.

  ### 1. The Causal Role Claim
  **Statement:** "The trait has *some* causal effect on the organism's interaction with the world."
  **Verdict:** **Trivially True.**
  **Analysis:** Almost no biological structure is causally inert. A bone has mass; a pigment absorbs light; a neural circuit fires. Even a vestigial structure has physical consequences (e.g., energy cost, weight).
  **Relevance to Opponent:** Useless to them. Acknowledging a trait has *a* causal effect does not prove it is an adaptation. A spandrel (the architectural space between arches) has causal effects (you can paint on it), but it wasn't *designed* for that.

  ### 2. The Purifying Selection Claim
  **Statement:** "The trait is not deleterious enough to have been eliminated by negative selection."
  **Verdict:** **True.**
  **Analysis:** This is the floor of persistence. If a trait were significantly fitness-reducing, selection would likely remove it (or reduce its frequency). Persistence implies tolerance, not necessarily utility.
  **Relevance to Opponent:** Weak. This allows for "neutral" traits. It saves the trait from being called "maladaptive," but it does not save it from being called a "byproduct."

  ### 3. The Current Utility Claim
  **Statement:** "The trait contributes to fitness *now*."
  **Verdict:** **Contested (Context-Dependent).**
  **Analysis:** Many traits are currently useful but were not selected for that use (exaptations). Many traits are currently useful but are linked to other traits that are the actual targets of selection (hitchhiking).
  **Relevance to Opponent:** Insufficient. Showing a spandrel is *now* useful (e.g., used for storage) does not prove it is not a byproduct. Gould and Lewontin's point is about *origin*, not just current utility.

  ### 4. The Maintenance Claim
  **Statement:** "The trait is actively *maintained* in the population by positive selection."
  **Verdict:** **Contested (The Neutralist-Selectionist Debate).**
  **Analysis:** This is where drift enters. A trait can persist simply because there is no pressure to remove it and drift hasn't fixed an alternative yet. At the molecular level, the Neutral Theory (Kimura) suggests most variation is drift. At the phenotypic level, drift is harder to prove but certainly possible for low-cost traits.
  **Relevance to Opponent:** Stronger, but still insufficient. Even if selection is maintaining it, it might be maintaining it for Reason A, while the trait itself is a byproduct of Reason B.

  ### 5. The Historical Adaptation Claim
  **Statement:** "The trait exists *because* it was historically selected for its current form/function."
  **Verdict:** **False (as a universal 'Must').**
  **Analysis:** This is the core of the Adaptationist Programme. It conflates *effect* with *cause*. Just because a trait has a function now doesn't mean that function explains its presence. This is the specific claim the Spandrels paper attacks.
  **Relevance to Opponent:** **This is the claim he needs.** To rule out the "byproduct" story, he must prove that the trait's origin and persistence are explained by selection for *that specific feature*, not selection for a correlated feature or developmental constraint.

  ---

  ### The Opponent's Logical Gap

  Your colleague's move against the Spandrels point fails because he is trying to derive **Claim 5** (Historical Adaptation) from **Claim 2** (Persistence/Non-deleterious).

  The logic he is using is:
  1.  Trait $T$ persists.
  2.  If $T$ persists, it is selected for. (Premise)
  3.  Therefore, $T$ is selected for.
  4.  Therefore, $T$ is not a byproduct.

  **The Flaw:** Premise 2 is false. Traits persist due to:
  *   **Positive Selection** (Adaptation)
  *   **Purifying Selection** (It's not bad, so it stays)
  *   **Drift** (It's neutral, and chance hasn't removed it)
  *   **Constraint** (It cannot change due to physical/developmental laws)
  *   **Linkage** (It is genetically tied to something else that is selected for)

  To defeat the Spandrels argument, he needs to demonstrate that **Selection** is the *only* viable explanation for the persistence of the specific feature in question. He cannot simply assert it as a general principle. In philosophy of biology terms, he is assuming an **Etiological Theory of Function** (a trait's function is what it was selected for) but trying to prove it using a **Causal Role Theory** (a trait's function is what it does now).

  ### Where Drift, Constraint, and Exaptation Fit

  You asked specifically about these three. They are the weapons used to dismantle the "Must be doing something" slogan.

  **1. Genetic/Developmental Drift**
  *   **Role:** Sinks his case.
  *   **Mechanism:** If a trait is metabolically cheap and developmentally automatic, selection may never "see" it. It can fix in a population without ever conferring an advantage.
  *   **Verdict:** If drift is in play, the trait is "still around" but was never "selected for." The slogan is false here.

  **2. Constraint (Phylogenetic, Developmental, Physical)**
  *   **Role:** Sinks his case.
  *   **Mechanism:** Some features exist because the organism *cannot* build anything else. For example, mammals have a recurrent laryngeal nerve that takes a absurd detour because of our fish ancestry. It persists not because it's good, but because developmental pathways are locked in.
  *   **Verdict:** The trait is "still around" because it is unavoidable, not because it is "doing something" useful.

  **3. Exaptation**
  *   **Role:** Complicates his case (depends on definition).
  *   **Mechanism:** A trait is selected for Function A, then later co-opted for Function B. (e.g., feathers for warmth, then flight).
  *   **Verdict:** If your colleague says "it must be doing something," and means "it has current utility," exaptation saves him (feathers do help flight). But if he means "it was selected for *this* job," exaptation sinks him (feathers weren't selected for flight originally).
  *   **Spandrels Context:** Gould and Lewontin argue that adaptationists often mistake exaptations for adaptations. They see the current utility and assume historical selection for that utility.

  ### Is the Byproduct Story Respectable?

  Yes, but with caveats.

  **Where the consensus lies:**
  No serious evolutionary biologist today is a "Panglossian adaptationist" (believing every trait is optimal and selected). The existence of non-adaptive byproducts is accepted. The human chin, for example, is widely considered a likely byproduct of differential growth rates of the jaw, not a selected feature for speech or mating.

  **Where the disagreement lies:**
  The disagreement is usually about *frequency* and *evidence standards*.
  *   **Adaptationists (e.g., Dennett, Pinker, many evolutionary psychologists):** Argue that while byproducts exist, the default hypothesis for complex biological machinery should be adaptation. They argue that drift/constraint are "null hypotheses" that are hard to prove, whereas adaptive stories generate testable predictions.
  *   **Pluralists/Structuralists (e.g., Gould, Lewontin, Lynch):** Argue that the adaptationist default leads to just-so stories. They insist that constraint and drift are not just exceptions but fundamental shapers of form, and that "utility" is often post-hoc rationalization.

  **The Verdict on your Reading Group:**
  Your colleague is employing a "Just-So Story" defense. He is treating adaptation as a tautology: *If it's here, it helped.* This renders the concept of adaptation unfalsifiable.

  For his move to work, he needs to show that the **cost** of the feature is low enough that drift could maintain it, OR that the feature is **developmentally inseparable** from a selected trait. If he cannot do that, he is merely asserting Claim 5 without evidence.

  **Summary for your next seminar:**
  Tell him the slogan conflates **maintenance** with **origin**. A trait can be maintained by selection (because it's linked to something good) without being an adaptation itself. A trait can persist by drift without doing anything useful. A trait can be useful now (exaptation) without being selected for that use. The Spandrels point stands unless he can rule out drift, constraint, and linkage for the specific trait in question. "Still around" is necessary for adaptation, but it is not sufficient.
