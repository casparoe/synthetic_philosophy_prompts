  I'm a backend engineer with zero formal philosophy training and I've fallen down a rabbit hole on Indian epistemology. Turns out the different schools argued about how many "pramāṇas" — basically primitive, non-derivative ways of knowing — you should allow. Nyāya says four: perception, inference, testimony (believing a reliable speaker), and upamāna, i.e. comparison/analogy, where you know what some thing is by matching it to something you already know. Mīmāṃsā and Advaita Vedānta allow six, tacking on postulation (inferring some fact to explain what you've observed) and non-apprehension (knowing something is absent because you don't perceive it). Buddhist logicians like Dignāga and Dharmakīrti say only two count — perception and inference — and that testimony is just those two in disguise. Write me an essay on whether testimony is genuinely a basic pramāṇa or whether the Buddhists are right that it reduces. This is definately not a both-sides thing, I want an actual verdict, defended. My whole job is trusting other people's docs and Stack Overflow answers, so I really want to know if that's a real source of knowledge or just a shortcut. Also say what you think the test for "basic" should even be, how confident you are in your verdict, and which part of it you're least sure about.
