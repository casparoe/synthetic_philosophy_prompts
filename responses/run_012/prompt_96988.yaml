answer: |-
  ### The Hinge Protocol: A 20-Minute Audit

  This procedure is based on Wittgenstein's concept of "hinge propositions" from *On Certainty*. A hinge is not a fact that is *too certain* to doubt; it is a rule that makes the *game* of inquiry possible. You cannot test the rules of chess while playing a move. However, you *can* write a paper about changing the rules.

  The goal of this audit is to distinguish between a **Constitutive Hinge** (a background condition required for the paper's method to function) and a **Contested Premise** (a claim that is part of what the paper is investigating).

  **Time:** 20 Minutes
  **Materials:** The Manuscript, The Referee Report, The Journal's Scope Statement.

  #### Step 1: The Tool vs. Target Test (5 Minutes)
  Read the paper's Abstract and Introduction. Identify the **Primary Research Question (PRQ)**.
  *   **Question:** Is the disputed assumption the *instrument* used to answer the PRQ, or is it the *object* the PRQ is asking about?
  *   **Sufficient Answer:**
      *   **Instrument (Hinge Candidate):** The paper asks "How does X affect Y?" and the assumption is "We can measure Y."
      *   **Object (Not a Hinge):** The paper asks "Does X exist?" or "Is Y measurable?"
  *   **Stop Condition:** If the assumption is the **Object**, the procedure stops. **Verdict: Referee is Right.** (You cannot claim a hinge status for the very thing you are trying to prove/disprove).

  #### Step 2: The Paralysis Test (5 Minutes)
  *   **Question:** If the author were forced to provide the empirical/philosophical justification the referee wants *within this text*, would the paper cease to address its Primary Research Question?
  *   **Sufficient Answer:**
      *   **Yes (Hinge Candidate):** Justifying the assumption would require a completely different methodology, dataset, or paper scope (e.g., a validation study rather than an application study).
      *   **No (Not a Hinge):** The justification is a standard citation, a control variable, or a paragraph of clarification that fits within the current argument.
  *   **Stop Condition:** If **No**, **Verdict: Referee is Right.** (The burden of proof is manageable and belongs in the paper).

  #### Step 3: The Codification Test (5 Minutes)
  *   **Question:** Is the assumption codified as standard practice in the specific sub-field relevant to this paper (not the journal as a whole)?
  *   **Action:** Check the top 5 most cited recent papers in the manuscript's bibliography that use the same method/assumption.
  *   **Sufficient Answer:**
      *   **Yes (Hinge Candidate):** At least 4 of 5 treat the assumption as background/methodological given without defending it.
      *   **No (Not a Hinge):** The assumption is contested, varied, or explicitly debated in those papers.
  *   **Stop Condition:** If **No**, **Verdict: Referee is Right.** (You cannot unilaterally declare a contested empirical claim a hinge).

  #### Step 4: The Disclosure Test (5 Minutes)
  *   **Question:** Is the assumption explicitly acknowledged in the text as a boundary condition or limitation?
  *   **Sufficient Answer:**
      *   **Yes:** The text says, "We assume X for the purposes of this analysis," or "Using standard protocol X..."
      *   **No:** The assumption is invisible or presented as a discovered fact.
  *   **Stop Condition:** If **No**, **Verdict: Referee is Right.** (Hinges must be visible to function as methodological boundaries; hidden hinges are dogmas).

  ---

  ### Final Decision Rule
  *   **If Step 1 = Instrument AND Step 2 = Yes AND Step 3 = Yes AND Step 4 = Yes:**
      *   **Verdict: AUTHOR WINS.** The referee is demanding the impossible. Instruct the referee that this assumption is a methodological boundary for this specific inquiry.
  *   **If ANY Step = Fail:**
      *   **Verdict: REFEREE WINS.** The author must justify the claim, qualify the conclusion, or withdraw the paper.

  ---

  ### Running the Disputes

  #### 1. The Likert Scale Dispute
  *   **Context:** Referee wants justification for treating Likert as interval. Author says it's standard.
  *   **Step 1 (Tool/Target):** **Instrument.** The paper is about the phenomenon measured, not the psychometrics of the scale. (Pass)
  *   **Step 2 (Paralysis):** **Yes.** Validating a scale requires a separate psychometric study, not a substantive paper. (Pass)
  *   **Step 3 (Codification):** **Yes.** In many applied social science sub-fields, this is the default protocol (check citations). (Pass)
  *   **Step 4 (Disclosure):** **Yes/No.** (If they didn't state it, ask for a revision to add the sentence "Data were treated as interval per standard protocol [Citation]." If they add it, they pass).
  *   **Verdict:** **AUTHOR WINS.** The referee is asking for a methods paper inside a substantive paper.

  #### 2. The Childhood Memory Dispute
  *   **Context:** Referee rejects paper for not defending memory accuracy. Author says "no one could be asked to defend that."
  *   **Step 1 (Tool/Target):** **Instrument.** The paper uses memories to argue about narrative identity, not testing memory itself. (Pass)
  *   **Step 2 (Paralysis):** **Yes.** Proving memory accuracy is a massive empirical undertaking. (Pass)
  *   **Step 3 (Codification):** **FAIL.** In cognitive psychology and memory research, the accuracy of childhood memory is *highly* contested (false memory literature). It is not codified as "broadly accurate" in the top citations.
  *   **Verdict:** **REFEREE WINS.** This is the uncomfortable result. The author is trying to treat an empirical variable as a philosophical hinge. The paper cannot proceed without qualifying that memories *might* be inaccurate, or citing literature that supports the specific accuracy claim being relied upon. You must reject or demand major revision.

  #### 3. The "Phenomenon Doesn't Exist" Dispute
  *   **Context:** Paper argues a 40-year phenomenon is fake. Referees say existence isn't up for debate.
  *   **Step 1 (Tool/Target):** **FAIL.** The Primary Research Question *is* "Does this phenomenon exist?" The existence is the **Target**, not the Tool.
  *   **Verdict:** **REFEREE WINS (on the procedure, but loses the argument).**
      *   *Wait, read carefully:* The procedure says if Step 1 fails, the Referee is Right *that it is not a hinge*.
      *   *Correction:* The Referee is claiming it *is* a hinge ("existence isn't up for debate"). The Procedure proves it is **NOT** a hinge.
      *   *Therefore:* The Referee's *objection* is invalid. The Author is allowed to write a paper where the Target is the existence.
      *   **Verdict:** **AUTHOR WINS.** The referee cannot use "hinge" logic to block a paper whose explicit purpose is to test the hinge.

  **The Uncomfortable Result:**
  Case 3 is the one you won't like. The procedure forces you to send this paper back out for review on its merits. You cannot use the "hinge" protocol to shield the journal from a paradigm-challenging paper. If the paper is right, it destroys 40 years of work published in your journal. If it's wrong, it wastes reviewer time. The procedure removes your ability to desk-reject this as "out of scope" based on settled science, because *settled science is exactly what the paper is contesting.* You have to let the fight happen.

  ---

  ### What This Procedure Cannot Do

  1.  **It cannot judge truth.** It only judges *structural role*. A paper can pass the Hinge Protocol and still be scientifically wrong (e.g., using a standard but flawed method).
  2.  **It cannot protect emerging fields.** In a new field, nothing is "Codified" (Step 3). Everything will look like a Contested Premise. You will need to exercise editorial discretion to allow new hinges to form.
  3.  **It cannot solve "Hidden Hinge" gaming.** An author can rewrite their Abstract to make a Target look like a Tool (e.g., changing "Does X exist?" to "How does X function?" while secretly arguing X doesn't exist). You must read the Conclusion to ensure the Abstract matches the actual work.
  4.  **It cannot replace peer review.** It only adjudicates *this specific fight*. The referee may still reject the paper for bad data, poor writing, or irrelevance.

  ### Why Your Current Test Was Insufficient
  You asked: *"What would actually change if we dropped the assumption?"*
  *   **The Flaw:** In the Memory Case, if you drop "memories are accurate," the paper's conclusion changes (narrative identity might be based on fiction). But the *methodology* doesn't collapse. You can still analyze the narratives.
  *   **The Fix:** The **Paralysis Test** (Step 2) is stricter. It asks if the *inquiry itself* becomes impossible, not just if the result changes. This prevents authors from claiming hinges for any premise that supports their conclusion.
