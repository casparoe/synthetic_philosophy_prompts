  6.  **Refining the Advice (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't say Kepler *only* believed in the human soul. The *Anima Terrae* is crucial for weather astrology, which was a huge part of his practice.
      *   *Correction:* On the "aesthetic" point: Kepler's harmony is Pythagorean/Platonic. It's not subjective. I need to warn the user not to use the word "aesthetic" without qualifying it as "ontological harmony."
