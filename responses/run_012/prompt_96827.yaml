answer: |-
  The established methodological term for this comparative error is **selection on the dependent variable**, though the rhetorical maneuver itself is best described as **outcome-selected essentialism**.

  This occurs when a researcher chooses cases based on the outcome they want to explain (e.g., "industrialized" vs. "non-industrialized") and then hunts for antecedent differences, treating the outcome as the filter that determines which features are causally relevant. The logical flaw is that by fixing the outcome first, you guarantee that any difference found between the cases can be narratively stitched into a cause, rendering the explanation immune to falsification. The "infinite specification" you noticed (coal was there, but not in the *right* place) is a form of **ad hoc rescue**, where the theory is protected from refutation by adding auxiliary assumptions until it fits the known result. The "reversibility" you identified confirms the lack of **counterfactual robustness**: if the explanation cannot survive flipping the outcome while holding the conditions constant, it is a description of the winner's path, not a general causal law.

  The boundary between this and honest comparative history runs through **equifinality** and **process tracing**. Honest comparison acknowledges that different combinations of factors can produce the same outcome (equifinality) and does not treat the winner's specific path as the only necessary one. It uses **process tracing** to verify the mechanism linking cause to effect within the timeline, rather than inferring the mechanism from the outcome itself. Crucially, honest history tests its claims against **negative cases** (places that had the "cause" but not the "effect") to ensure the identified feature actually does work, rather than assuming it works because the winner had it. When a historian treats the outcome as the selector of causes, they are doing selection on the dependent variable; when they treat the outcome as the test of a mechanism identified independently, they are doing comparative history.
