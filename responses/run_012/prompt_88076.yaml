answer: |-
  **Correspondence Table**

  | Concept | Temporal Domain | Spatial Domain |
  | :--- | :--- | :--- |
  | **Distance** | Years | Kilometers |
  | **Transport Cost** | Discount Rate | Freight/Transmission Cost |
  | **Communication** | Causal Impact | Information/Trade Flow |
  | **Common Present** | The "Now" | Shared Simultaneity |

  **Where the Mapping Breaks**
  The analogy fractures under four pressures. First, **causal asymmetry**: we affect future people, but they cannot affect us. Spatial neighbors interact bidirectionally. Second, **absence of reciprocity**: there is no trade with the future, removing market mechanisms that equalize spatial value. Third, **existence uncertainty**: distant foreigners definitely exist; future people are contingent on our current actions. Fourth, **self-discounting**: individuals routinely discount their own future utility. Spatial distance has no analogue for personal identity over time; I am not "far away" from my future self, yet I still prefer present satisfaction.

  **Which Breaks Matter**
  Existence uncertainty and self-discounting are the critical fractures. If rational agents discount their own future due to preference change or identity fragmentation, the moral demand for zero pure time preference loses its intuitive grip. Causal asymmetry matters for economics: without reciprocity, we cannot derive shadow prices from future preferences. The lack of trade is idle if the argument is purely moral, but fatal if the argument relies on efficiency. However, since the policy conclusion relies on both moral weight and economic modeling, the trade break is significant.

  **Does the Conclusion Survive?**
  The near-zero-discount conclusion does not survive intact. The analogy was doing the heavy lifting by disguising epistemic fragility as moral arbitrariness. Once we acknowledge that future people might not exist and that even our future selves are discounted, pure time preference re-emerges as a proxy for uncertainty and contingency, not just prejudice. The argument collapses from a moral imperative to a risk management calculation. Without the spatial analogy, there is no philosophical barrier to weighting the future less due to the sheer probability of non-existence or changed values.

  **Better Analogy**
  A superior framework is **stewardship**. Unlike spatial neighbors, future generations are beneficiaries of a trust they cannot monitor. This accepts asymmetry rather than denying it. It justifies low discounting not because time is space, but because trustees must preserve capital against unknown future needs, acknowledging uncertainty without pretending the beneficiaries are present counterparts. This shifts the justification from "equality of distance" to "responsibility over contingency," which better fits the unique ontological status of the future.
