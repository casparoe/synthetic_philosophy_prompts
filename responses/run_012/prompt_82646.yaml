answer: |-
  Commitments, restated:
  1. Belief formation is involuntary and responsive only to evidence.
  2. Self-deception is a real, coordinated phenomenon distinct from simple motivated error.
  3. This coordination functions as a standing directive to avoid specific evidence.
  4. This directive operates subintentionally and is never consciously chosen.
  5. The mechanism must apply symmetrically to truths about oneself and the world.
  6. Genuine self-deception requires the unwelcome proposition to be retained implicitly.
  7. Self-deception constitutes an epistemic failure but does not warrant moral blame.

  Genuine tensions, ranked:
  1. **(1) vs (6): The Static Paradox.** If belief answers strictly to evidence (1) and the evidence is retained (6), the subject should believe the truth. To sustain the false belief, the retained evidence must be prevented from processing. This forces you to posit a mechanism that screens evidence without violating involuntarism. If the screening is effective, it looks like intentional ignoring; if ineffective, belief updates. You are committed to a state where evidence is possessed yet causally inert regarding belief formation.
  *Resolution:* Either (1) or (6) must give. If (6) gives, SD reduces to simple ignorance, losing the "deception" aspect. If (1) gives, you admit some doxastic voluntarism.
  *Cost:* Losing (6) collapses your view into standard motivated error. Losing (1) undermines your foundational epistemology.

  2. **(4) vs (7): Normativity without Agency.** You label SD an epistemic failing (7) but claim the regulating policy is subintentional and never chosen (4). Epistemic normativity typically presupposes agency; we criticize failings we could control. If the arrangement is never chosen, like a reflex, calling it a "failing" implies a responsibility the subject cannot bear. You want to condemn the state without blaming the agent.
  *Resolution:* Either (7) or (4) must give. If (7) goes, SD is merely pathological, not normative. If (4) goes, you allow indirect responsibility.
  *Cost:* Losing (7) removes the philosophical stakes of SD as a rational critique. Losing (4) invites moral blame, contradicting your seventh claim.

  3. **(3) vs (4): The Policy Oxymoron.** You describe the regulation as a "directive" or "policy" (3), yet insist it is subintentional and unchosen (4). Policies are typically items of agency—things adopted or issued. A "subintentional policy" risks being incoherent unless carefully defined as a homeostatic mechanism.
  *Resolution:* Either (3) or (4) must give. If (3) goes, the mechanism is purely causal. If (4) goes, it is agential.
  *Cost:* Losing (3) makes the view purely psychological, losing the philosophical description of orientation. Losing (4) makes the view intentionalist, reopening the paradox of how one intends to deceive oneself.

  Tensions that dissolve:
  (1) and (2) appear to clash because traditional SD involves intending to believe. Your account avoids this by defining SD as evidence avoidance rather than belief manufacture. Since you do not claim the subject wills the false belief, only that they avoid evidence, involuntarism remains intact. The conflict vanishes because you have changed the locus of control from belief to attention.

  (2) and (4) seem inconsistent because coordinated behavior suggests intention. However, biological systems exhibit complex coordination subintentionally. If cognitive avoidance functions like a homeostatic mechanism rather than a plan, coordinated avoidance across behavior is compatible with subintentional operation. The appearance of inconsistency relies on equating coordination with conscious planning. The slow-accommodation case supports this: gradual drift requires no snap decisions, allowing complex behavioral changes to accumulate without a central commander. This dissolves the worry that coordination proves intention.

  (5) and (1) also look tense. Symmetry might seem to require special self-knowledge to deceive oneself. But if SD is just evidence avoidance, avoiding news about a colleague works like avoiding news about oneself. No special machinery is needed, just a motivation to avoid discomfort. This confirms (5) is compatible with (1).

  Cheapest repair:
  Revision: Amend (4) to allow that the directive is habituated rather than strictly subintentional. Instead of "never chosen," claim it is "seldom consciously chosen but cultivated through past negligent epistemic habits."
  Benefit: This resolves the tension with (7). If the policy arises from past habits, the subject bears indirect responsibility for the epistemic failing, validating the normative assessment without requiring direct doxastic control.
  Cost: You concede that self-deception is partly voluntary over the long term. This weakens the defense against moral blame, as negligence is often a moral category. You also complicate the symmetry constraint (5), as habituation regarding oneself may differ from habituation regarding colleagues. This revision invites opponents to argue that if habits are culpable, moral blame follows. It also requires you to explain how habits form without initial intention, which may reintroduce the paradox you sought to avoid. However, it saves the core claim that SD is a rational failing.

  Bottom line:
  Your account successfully sidesteps the static paradox by focusing on evidence avoidance rather than belief manipulation. However, calling subintentional mechanisms "epistemic failings" creates a normative gap you must bridge via indirect agency. Without grounding responsibility in habituated neglect, your position risks describing a pathology rather than a philosophical puzzle.
