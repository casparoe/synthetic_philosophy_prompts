  8.  **Final Polish:** (Writing the response with the calculated structure.) *Ensure the distinction between "can" as possibility vs. "can" as sustainability is clear.* *Make sure the "Invisible Army" point lands hard.*

  *(Self-Correction Note)*: I need to make sure I don't just validate the user's anger but actually answer the analytical request. The user wants the *logic* dissected, not just sympathy. Keep the tone professional but incisive.

