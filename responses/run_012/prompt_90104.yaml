  8.  **Final Polish:** Check against the prompt's specific request for "honest account of where it breaks." Ensure the conclusion isn't a fence-sit but a clear evaluation of the tool's sharpness. (The tool is sharp for *justification*, dull for *causation*.)

  *(Self-Correction Note)*: I need to be careful not to conflate Knight with Douglas/Herzlinger (Cultural Theory of Risk), though they overlap. Stick to Knight (calculability) but acknowledge where Cultural Theory explains the *choice* of frame.

