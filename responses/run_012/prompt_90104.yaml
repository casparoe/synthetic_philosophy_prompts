          *   **Time Horizons:** Uncertainty demands infinite caution (waste). Risk demands discounted cost-benefit analysis (LCOE).
          *   **The "Shock" Mechanism:** Fukushima didn't change the physics (Risk), it changed the epistemology (Uncertainty). It made the unknowable knowable *as unknowable*.
      *   *What it flattens:*
          *   **Identity/Culture:** *Lebensreform*, Green Party roots, anti-statism in Germany vs. Jacobin statism, *Corps des Mines*, technocratic faith in France. Knight doesn't measure *trust in institutions*.
          *   **Risk Laundering:** The friend's point. Is it real? Yes. It's "Risk Displacement." Germany traded acute, dread risk (radiation) for chronic, diffuse risk (CO2, Russian gas). Knightian theory doesn't account for *psychometric* preferences (dread vs. familiarity).
          *   **Political Economy:** France's nuclear fleet is sunk cost + state capacity. Germany's phase-out was also industrial policy (renewables export market). Knight ignores the *machinery* of decision.

  5.  **Drafting - Section 3: The "Risk Laundering" Question:**

