      *   *Example:* In the motif domain, "raising" a note might slip to "lowering." But in tonal harmony, raising the leading tone (7) to 1 is functionally different than raising 4 to 5. A pure slip model might miss *functional* constraints (tonality) in favor of *syntactic* slips (numbers). This is a strong point about domain knowledge vs. abstract slippage.

      *(Refining the "Global Temperature" critique)*: This is the weakest point of Copycat-style models. Neuroscience suggests local modulation (dopamine/acetylcholine), not a global scalar. I should emphasize this.

      *(Refining the "Over-explanation" critique)*: If a symbolic system with weighted rules produces the same distribution of answers, why posit slips? Occam's razor.

  6.  **Structuring the Argument:**
