      3.  **Domain Specificity vs. Fair-Weather Creativity.**
      4.  **Human Data Mismatches (RTs and Errors).**
      5.  **Rival Predictions.**
      6.  **Final Verdict.**

  7.  **Final Polish:** Ensure the tone is appropriate for a seminar critique (academic, sharp, constructive). Check that all parts of the prompt are answered. (Did I cover fatal vs. awkward? Yes. Did I cover the microdomain? Yes. Did I cover the final verdict on insulation? Yes.)

      *Wait, one specific constraint:* "Finish by telling me honestly whether, once a defender has reached for all the qualifications they are entitled to, the position still risks anything at all."
      *Thought:* This requires a nuanced conclusion. If the theory is qualified enough to survive all attacks, does it say anything meaningful? This is the "degenerating research program" risk.

  8.  **Final Review against the Prompt:**
