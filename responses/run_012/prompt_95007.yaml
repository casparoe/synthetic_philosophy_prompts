  3.  **Reconstructing the Implicit Theory (The "Standard Model" of IRL):**

      *   *Ontology of Preference:* Preferences exist *prior* to action (Realism/Platonism about utility). They are stable over the observation window.
      *   *Ontology of Action:* Actions are generated by a policy $\pi$ derived from maximizing expected utility $R$.
      *   *Noise Model:* Deviations from optimality are stochastic (Boltzmann rationality) or bounded (limited horizon/computation), not fundamental contradictions in value.
      *   *Identifiability:* There is a "true" $R$ that explains the data better than other $R$'s (ignoring the reward shaping ambiguity for a moment).

  4.  **Addressing the Philosophical Commitments (What's Ruled Out):**

      *   *Constructivism:* If preferences are formed *during* choice, IRL fails because there's no latent $R$ to recover.
      *   *Incommensurability:* If values can't be summed into a scalar $R(s, a)$, the Bellman equation breaks. Lexicographic preferences or multi-objective trade-offs that aren't linearizable are problematic.
      *   *Akrasia (Weakness of Will):* IRL treats suboptimal action as noise. If an agent *knows* the best action but chooses otherwise due to conflict (not noise), IRL misattributes the reward structure.
      *   *Process Values:* Standard RL/IRL is consequentialist (reward on states/transitions). If the *path* matters intrinsically (deontology, virtue ethics), standard state-based rewards struggle unless the state space includes full history (which explodes complexity).

  5.  **Internal Consistency Check (The "Ground Truth" Paradox):**

      *   The user hits on a key tension: Behavior is the *only* data, but behavior is assumed *imperfect*.
      *   *The Circularity:* We infer $R$ from $\pi$, assuming $\pi \approx \arg\max R$. If $\pi$ deviates, is it because $R$ is different, or because $\pi$ is noisy?
      *   *Resolution (Technical):* IRL handles this via probabilistic models (MaxEnt IRL). It doesn't claim to find *the* $R$, but the $R$ that makes the data *most likely*.
      *   *Resolution (Philosophical):* It requires a prior over "rationality." You must assume a specific noise model (e.g., Boltzmann) to separate signal from error. Without that assumption, the problem is ill-posed. So, the "principled line" is an *assumption*, not a derivation.

  6.  **Required vs. Convenient:**

      *   *Required:* Markov Property (or history-dependent states), Existence of *some* objective function (even if hidden), Correlation between action and objective.
      *   *Convenient:* Scalar rewards (math simplicity), Discounting (convergence), Boltzmann Rationality (tractable gradients), Stationarity (preferences don't change).

  7.  **Alternative Models (Constructivist/Multi-valued):**

      *   *Constructivist:* Instead of recovering $R$, model the *process* of deliberation. Inverse Planning becomes Inverse Deliberation. The output isn't a function, but a set of rules or a narrative.
