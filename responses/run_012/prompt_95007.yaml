answer: |-
  You have put your finger on the exact nerve of the matter. Your intuition is correct: Inverse Reinforcement Learning (IRL) is not merely a technical inverse problem; it is a specific philosophical anthropology encoded in linear algebra. It is the computational resurrection of **Revealed Preference Theory** (from neoclassical economics) married to **Functionalism** (from philosophy of mind).

  When you run IRL on a human, you are not just estimating parameters; you are forcing human behavior into a specific metaphysical mold. If the mold doesn't fit, the algorithm doesn't report "error"; it reports a distorted reward function.

  Here is a reconstruction of the implicit theory, the distinctions between necessity and convenience, and the consequences of swapping the paradigm.

  ---

  ### 1. The Implicit Ontology of Standard IRL

  To make IRL mathematically tractable, the practice presupposes a specific "Theory of Mind." Let's reconstruct the axioms:

  *   **Realism about Utility:** Preferences exist *prior* to and *independent* of the choice. There is a latent function $R(s, a)$ that is ontologically real, stable over the observation window, and causally responsible for the action.
  *   **Consequentialism:** Value resides exclusively in states (or state-action transitions). The *history* of how you got there matters only insofar as it affects future states. Intrinsic value of the *act itself* (deontology) or the *narrative arc* (virtue ethics) is ruled out unless encoded artificially into the state space.
  *   **Scalar Commensurability:** All values can be collapsed into a single real number. Trade-offs between "safety" and "speed" or "honesty" and "kindness" are assumed to be linearizable.
  *   **Noisy Rationality:** The agent is a maximizer subject to entropy. Deviations from the optimal policy $\pi^*$ are treated as stochastic noise (e.g., Boltzmann rationality) or computational bounds, not as fundamental conflicts of will.

  **The Philosophical Commitment:** This is a **Platonic** view of preference. The "True Preference" is the ideal form; the observed behavior is a shadow on the cave wall. The goal of IRL is to infer the form from the shadow.

  ### 2. What This Rules Out (The Excluded Middle)

  Your list of exclusions is accurate. Here is how the math enforces those philosophical blind spots:

  *   **Constructivist Preferences:** If preferences are formed *in the moment* of choice (as Elster, Sen, or behavioral economists argue), IRL fails ontologically. There is no latent $R$ to recover. The "reward" is an emergent property of the interaction between context, identity, and option set. IRL will hallucinate a stable $R$ where there is only a dynamic process.
  *   **Incommensurability:** If an agent holds values that cannot be traded off (e.g., "I will not sell my child, at any price"), standard IRL breaks. It will try to find a price. To model this, you need lexicographic preferences or constrained optimization, not a scalar reward function.
  *   **Akrasia (Weakness of Will):** If an agent acts against their own judgment (e.g., smoking while wishing to quit), standard IRL interprets this as "the agent values smoking more than health." It cannot distinguish between *wanting* and *valuing*. It collapses the "should" and the "did" into a single metric.
  *   **Process Values:** If I care about *how* a decision was made (e.g., democratically vs. autocratically), standard MDP-based IRL cannot see this unless the "state" includes the entire causal history of the decision. This explodes the state space and violates the Markov assumption, making the problem intractable.

  ### 3. The Internal Consistency Problem

  You asked: *Can you both treat behavior as the ground truth about preference and treat departures from optimality as mere error without a principled line between the two?*

  **The short answer is no.** This is the **Underdetermination Problem** of IRL.

  Mathematically, for any observed policy $\pi$, there are infinite pairs of $(R, \text{rationality model})$ that explain it.
  *   If I see you eat a salad, I can infer:
      1.  You love salad ($R_{\text{salad}}$ is high) and you are rational.
      2.  You hate salad ($R_{\text{salad}}$ is low) but you are coerced (constraint).
      3.  You hate salad, but you are irrational (noise).

  Standard IRL (like MaxEnt IRL) resolves this not by finding a "principled line," but by **fixing the rationality model as a prior.** It assumes a specific noise distribution (usually softmax/Boltzmann).
  *   **The Circularity:** The recovered reward function is *conditional* on the assumed rationality model. If you assume the human is 90% rational, you get Reward Function A. If you assume they are 50% rational (high temperature), you get Reward Function B.
  *   **The Consequence:** IRL does not recover "The Reward." It recovers "The Reward *given that* the agent is a Boltzmann rationalizer." If the human is actually a rule-follower or a habit-agent, the recovered reward is a fiction—a mathematical artifact required to make the optimization equation balance.

  So, the practice is internally consistent only if you accept the rationality prior as dogma. If you treat the rationality model as an empirical question, the problem becomes ill-posed without further constraints.

  ### 4. Strictly Required vs. Mathematically Convenient

  To separate the philosophy from the engineering hacks, we can divide the assumptions:

  **Strictly Required (The Core Commitments):**
  1.  **Existence of an Objective:** There *must* be some scalar signal the agent is implicitly tracking. If the agent is acting randomly or purely reactively without goal-direction, IRL returns garbage.
  2.  **Stationarity:** The objective function must remain constant over the observation period. If $R$ changes faster than you can learn it, recovery is impossible.
  3.  **Correlation:** There must be a statistical dependency between the reward and the actions. If high-reward actions look identical to low-reward actions, identifiability fails.

  **Mathematically Convenient (The Engineering Layer):**
  1.  **Scalar Rewards:** This is for tractability. Multi-objective IRL is possible (Pareto IRL) but much harder. The scalar assumption is a convenience that enforces commensurability.
  2.  **Markov Property:** Assuming reward depends only on current state $(s)$ or transition $(s, a, s')$ is for computational ease. History-dependent rewards are possible but require POMDPs or RNNs.
  3.  **Discounting:** The $\gamma$ factor ensures convergence. Philosophically, it implies a specific view of time-preference that may not match the human subject.
  4.  **Boltzmann Rationality:** This is chosen because it makes the gradient tractable, not because it is psychologically validated.

  ### 5. What Changes if You Swap the Paradigm?

  If you reject the Platonic/Revealed Preference model for a Constructivist or Multi-Valued one, the technical setup changes fundamentally.

  **A. Constructivist / Deliberative Model**
  *   **The Shift:** Instead of Inverse *Reinforcement* Learning, you do Inverse *Deliberation* Learning.
  *   **The Goal:** Do not recover $R$. Recover the *rules of thumb*, *narratives*, or *identity constraints* the agent uses to construct a choice.
  *   **The Math:** You move from optimizing a value function to modeling a generative process of reasoning (e.g., Bayesian Program Learning or Cognitive Architectures like ACT-R).
  *   **Outcome:** You stop predicting "what they want" and start predicting "how they decide." This handles akrasia better (e.g., modeling a conflict between a planning system and an impulse system).

  **B. Multi-Valued / Pareto Model**
  *   **The Shift:** Reject scalarization. Assume the agent maximizes a vector $\vec{R} = [R_1, R_2, ... R_n]$.
  *   **The Goal:** Recover the Pareto frontier. Observed actions are assumed to be Pareto optimal, not globally optimal.
  *   **The Math:** You solve for a set of reward functions. A deviation is not "noise"; it is a movement along the frontier of trade-offs.
  *   **Outcome:** This captures incommensurability. It admits that there is no single "best" action, only actions that are better in some dimensions and worse in others. However, it loses predictive power (many actions are now "optimal").

  **C. Dual-System IRL (Handling Akrasia)**
  *   **The Shift:** Assume two reward functions, $R_{\text{plan}}$ and $R_{\text{impulse}}$, and a mixing parameter $\beta$ (willpower).
  *   **The Goal:** Recover both functions and the resource constraint that limits the influence of $R_{\text{plan}}$.
  *   **Outcome:** You can explain why someone buys cigarettes (high $R_{\text{impulse}}$) while signing up for a gym (high $R_{\text{plan}}$). Standard IRL would average these into a confused "meh" reward function.

  ### Summary

  You are right to be suspicious. Standard IRL is **Rationalist Empiricism**: it assumes a rational structure exists (Rationalism) and tries to fit data to it (Empiricism).

  *   **What it presupposes:** That humans are consistent optimizers with stable, scalar values.
  *   **What it rules out:** That values are constructed, conflicting, incommensurable, or process-dependent.
  *   **The Consistency Gap:** It resolves the tension between "behavior is truth" and "behavior is noisy" by fiat—by hard-coding a specific noise model. The recovered reward is always relative to that assumption.

  If you treat IRL as a tool for **robotics** (teaching a robot to drive by watching a human), these philosophical flaws don't matter; if the robot drives safely, the "reward function" is a valid control artifact.

  But if you treat IRL as a tool for **psychology or ethics** (inferring what humans *actually* value), it is dangerously reductive. It turns the tragedy of choice into a parameter estimation error. To fix it, you must move from Inverse *Reinforcement* Learning to Inverse *Cognitive* Modeling, where the object of recovery is not a utility function, but a mechanism of deliberation.
