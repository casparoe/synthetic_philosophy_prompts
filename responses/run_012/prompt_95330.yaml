  # JOINT STATEMENT ON THE STATUS OF THE ANTHROPOCENE
  **Issued by the Stratigraphic Working Group and the Earth-System Analysis Consortium**

  ### I. AGREED CLAIMS

  1.  **Geological Significance:** Both camps agree that human activity has altered Earth-system processes to a magnitude and rate comparable to major geological forcings of the deep past. This is evidenced by shifts in sedimentation rates, biotic turnover, geochemical cycles (carbon, nitrogen, phosphorus), and the introduction of novel materials (plastics, concrete, radionuclides).
  2.  **Evidence vs. Date:** The physical evidence establishes *that* humans became a dominant force, but it does not establish a single, synchronous *when* applicable to all Earth-system parameters. While the mid-twentieth century presents a sharp, globally synchronous signal (the "Great Acceleration"), earlier signals (agriculture, industrialization) are spatially diachronic but causally fundamental.
  3.  **Validity of the Term:** The term "Anthropocene" possesses scientific utility regardless of its formal status on the International Chronostratigraphic Chart. It successfully communicates the coupling of human history and planetary physics to both specialists and the public.
  4.  **Implications of the 2024 Vote:** The recent rejection of the formal proposal to define the Anthropocene as a geological epoch beginning in the mid-twentieth century settles the question of *formal ratification* but does not settle the question of *planetary state*. The rejection invalidates the specific "Golden Spike" (GSSP) proposal but does not erase the stratigraphic signature of human activity.
  5.  **Coexistence:** Formal stratigraphy and functional Earth-system science address different questions. One seeks to classify the rock record; the other seeks to explain the dynamics of the planet. Both inquiries are valid and necessary.

  ***

  ### II. DISAGREEMENTS AND CRUXES

  | Crux | Shared Consideration | Stratigraphic Camp (Formalists) | Earth-System Camp (Functionalists) |
  | :--- | :--- | :--- | :--- |
  | **1. Authority of the Code**<br>Does the International Code of Stratigraphy govern the term's usage? | **Stability vs. Accuracy:** Nomenclature must be stable to be useful, but accurate to be scientific. | **Position:** The Code is the governing authority for geological time. If the Anthropocene does not fit the Code's requirements for an Epoch, it cannot be formally designated as such.<br>**Prediction:** Adhering to the Code prevents the dilution of geological terminology, ensuring the term retains precise meaning for future geologists.<br>**Wording:** "The Anthropocene is not a formal unit of the Geological Time Scale." | **Position:** The Code is a human convention subordinate to physical reality. If the Code cannot accommodate the nature of human impact, the Code is the limitation, not the science.<br>**Prediction:** Restricting the term to the Code will render it obsolete for interdisciplinary science, causing researchers to abandon it for more flexible descriptors.<br>**Wording:** "The Anthropocene is a functioning reality irrespective of formal ratification." |
  | **2. Boundary vs. Cause**<br>Should the onset be defined by a synchronous marker or a causal process? | **Synchronicity:** A global boundary requires a synchronous signal; a causal history requires tracking a process. | **Position:** A geological unit requires a synchronous boundary (GSSP) to be correlatable across the globe. The mid-20th-century radionuclide spike is the only viable candidate.<br>**Prediction:** Without a synchronous marker, the term becomes unmoored, allowing arbitrary start dates that undermine stratigraphic correlation.<br>**Wording:** "A formal boundary requires a synchronous physical marker." | **Position:** Human impact is a transgressive process, not an instantaneous event. Defining it by a single marker (plutonium) severs the link between the *effect* and the *cause* (e.g., agriculture, fossil fuels).<br>**Prediction:** Fixing a single date will obscure the long-term trajectory of human impact, leading to a flawed understanding of Earth-system history.<br>**Wording:** "The onset tracks the causal mechanism, even if diachronic." |
  | **3. Epoch vs. Event**<br>Is the Anthropocene a stable interval or an ongoing perturbation? | **Duration:** Geological units imply stability; human impact implies rapid flux. | **Position:** The Chronostratigraphic Chart divides time into stable intervals. An "Epoch" implies a period of relative stability following a boundary.<br>**Prediction:** Modelling this as an "event" rather than an "epoch" fails to capture the permanence of the stratigraphic signal left in the lithosphere.<br>**Wording:** "The Anthropocene is best modelled as a potential Epoch." | **Position:** The current planetary state is a non-equilibrium transient event, not a stable interval. It is an ongoing geological force, not a closed chapter.<br>**Prediction:** Modelling this as an "Epoch" implies a stability that does not exist, misleading policy and science about the volatility of the current state.<br>**Wording:** "The Anthropocene is best modelled as a diffuse, ongoing geological event." |
  | **4. Adjudication**<br>Who is entitled to decide the definition? | **Expertise:** Decisions require technical knowledge, but impact multiple disciplines. | **Position:** The International Commission on Stratigraphy (ICS) holds the mandate for geological time. Other disciplines must defer to this body for geological terminology.<br>**Prediction:** Allowing external bodies to define geological units will fragment the geological time scale and reduce its utility.<br>**Wording:** "Decisions rest with the ICS." | **Position:** Because the Anthropocene bridges geology, biology, history, and sociology, no single body holds exclusive authority. Consensus must be interdisciplinary.<br>**Prediction:** Ceding authority to a single geological body will exclude critical data from non-geological fields, resulting in a scientifically impoverished definition.<br>**Wording:** "Decisions rest with interdisciplinary consensus." |

  ***

  ### III. VERBAL DISPUTES AND IMPOSSIBLE AGREEMENTS

  **1. The Verbal Dispute: "Epoch"**
  We identify a verbal dispute regarding the word **"Epoch."**
  *   **Why:** For the Stratigraphic Camp, "Epoch" is a technical term defined by the International Chronostratigraphic Chart, requiring specific criteria (GSSP, duration, stability). For the Earth-System Camp, "Epoch" is a colloquial or functional term meaning "a significant period in history."
  *   **Resolution:** We agree to distinguish between the **formal Anthropocene** (capitalized, subject to the Code) and the **informal anthropocene** (lowercase or context-dependent, subject to Earth-system criteria). Confusion arises when the functional claim is mistaken for a formal proposal, or vice versa.

  **2. Points of Impossible Agreement (In Principle)**
  The following disagreements cannot be resolved through further data collection or negotiation, as they rest on mutually exclusive axioms:

  *   **The Diachronic Axiom:** The Stratigraphic Camp *cannot* accept a diachronic (time-transgressive) start date for a formal unit without violating the International Code of Stratigraphy. The Earth-System Camp *cannot* accept a synchronous start date that ignores earlier causal drivers without violating the principles of Earth-system causality.
  *   **The Sovereignty Axiom:** The Stratigraphic Camp *cannot* cede authority over geological nomenclature to a non-geological body without abdicating its institutional mandate. The Earth-System Camp *cannot* accept a definition that excludes historical or ecological data solely to satisfy stratigraphic protocol.

  **Conclusion:**
  We acknowledge that the Anthropocene is simultaneously a **failed formal proposal** and a **successful scientific concept**. We commit to using the term with explicit qualification regarding which framework (Stratigraphic or Earth-System) is being employed in any given context.
