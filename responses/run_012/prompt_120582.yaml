answer: |-
  So, I was reading about this new AI startup—let's call them "Dennett Corp." 

  They spend millions training their chatbot using Reinforcement Learning from Human Feedback. Now, for the ML folks here, you know the drill: you give the model a reward signal, it adjusts its weights to maximize that reward. But philosophically? That procedure only makes sense if you treat the model as an *agent* with preferences it's trying to satisfy. You're bribing it. You're taking the Intentional Stance. You're saying, "It *believes* this answer will get a thumbs-up, and it *desires* the thumbs-up, so it will output this answer."

  But then, the bot gives someone terrible legal advice, gets them sued, and suddenly Dennett Corp is in court. And their legal team files a brief saying, "Your Honor, this model has no beliefs, no desires, and no intentions whatsoever. It's just weighted matrix multiplication. You can't sue a calculator."

  Now, the philosophers in the room are screaming "Contradiction!" You can't treat it like an agent when you're training it and a stone when you're liable for it. 

  But actually… Dennett would be proud. Because remember, on the instrumentalist reading, the Intentional Stance isn't a claim about what's *really* going on inside the machine. It's a predictive strategy. It's a tool. You adopt it when it helps you predict behavior, and you drop it when it doesn't.

  So the company isn't being inconsistent. They're being perfect instrumentalists. They attribute beliefs when it helps them optimize the gradient, and they deny beliefs when it helps them optimize the settlement. They aren't confused about the ontology… they're just using the same instrument, turned in whichever direction pays.
