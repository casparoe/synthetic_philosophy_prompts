answer: |-
  The procedure turns on whether the claim's warrant survives all active defeat conditions without collapsing into doubt.

  ### FACT-CHECKING DECISION PROCEDURE (NYĀYA-BASED)

  **Time Limit:** 10 Minutes per claim.
  **Goal:** Determine if a claim qualifies as "Verified Knowledge," "Doubtful," or "Rejected."

  **STEP 1: IDENTIFY THE SOURCE TYPE**
  Classify the primary warrant for the claim into one of four buckets. If multiple sources are used, select the weakest one.
  *   **Direct Observation:** Someone saw/heard it happen.
  *   **Reasoning:** The claim is drawn from data, patterns, or logic (e.g., "X caused Y").
  *   **Analogy:** The claim is based on similarity to another known case.
  *   **Testimony:** The claim rests on someone saying it is true (documents, interviews, reports).

  **STEP 2: APPLY SOURCE-SPECIFIC CONDITIONS**
  Run the checks below corresponding to the Source Type identified in Step 1.

  *   **If Direct Observation:**
      1.  **[HARD TEST]** Is the report limited to what senses can detect (sights, sounds) without adding interpretation (motives, identities, legal status)?
          *   *Fail:* If the report says "I saw him steal" (interpretation) rather than "I saw him take the item" (observation).
      2.  **[HARD TEST]** Is there any evidence the observer was impaired, distant, or obstructed?
          *   *Fail:* Yes.

  *   **If Reasoning:**
      1.  **[HARD TEST]** Is the evidence cited actually present in this specific case?
      2.  **[HARD TEST]** Is the evidence present in other cases where the outcome happened?
      3.  **[HARD TEST]** Is the evidence *absent* in cases where the outcome did *not* happen?
          *   *Fail:* If the evidence exists where the outcome is missing (e.g., exposure exists without disease).
      4.  **[JUDGMENT CALL]** Is the reasoning circular or does it require as much proof as the claim itself?
          *   *Escalate:* If yes.

  *   **If Analogy:**
      1.  **[JUDGMENT CALL]** Is the resemblance based on deep structural features or only surface details?
          *   *Escalate:* If structural relevance is unclear.
      2.  **[HARD TEST]** Are there critical differences that break the comparison?
          *   *Fail:* Yes.

  *   **If Testimony:**
      1.  **[HARD TEST]** Is the speaker identified and reachable?
      2.  **[JUDGMENT CALL]** Is the speaker competent on this specific matter?
          *   *Escalate:* If competence is unclear.
      3.  **[JUDGMENT CALL]** Does the speaker have an interest in the outcome (bias, money, safety)?
          *   *Escalate:* If yes.
      4.  **[HARD TEST]** Are there defeating conditions (coercion, contradiction by better evidence)?
          *   *Fail:* Yes.

  **STEP 3: CHECK FOR DEFEAT AND CONFLICT**
  1.  **[HARD TEST]** Does this claim contradict another claim verified by this desk or a higher-authority source?
      *   *Fail:* Yes (Move to Step 5).
  2.  **[HARD TEST]** Is the claim based on what "would have to be true" rather than what "is true"?
      *   *Fail:* Yes (Hypotheticals cannot establish knowledge).
  3.  **[HARD TEST]** Is this claim merely a restatement of a past report without new warrant?
      *   *Fail:* Yes (Memory is not knowledge).

  **STEP 4: ASSIGN STATUS**
  *   **Verified Knowledge:** Passed all Hard Tests; no Judgment Calls triggered escalation.
  *   **Doubt:** Passed Hard Tests but triggered a Judgment Call escalation OR involves a conflict not yet resolved.
  *   **Rejected:** Failed any Hard Test.

  **STEP 5: ESCALATION PROTOCOL**
  Send to Standards Editor immediately if:
  *   A Judgment Call regarding **Competence**, **Truthfulness**, or **Relevance of Resemblance** is triggered.
  *   Two verified sources clash (producing Doubt).
  *   The claim is rejected but is central to the story's lead.

  ***

  ### WORKED CASES

  **Case 1: The Anonymous Whistleblower**
  *Claim:* "The CEO knowingly authorized the dump of toxic waste."
  *Warrant:* Single email interview with a former employee who remains anonymous but states they were fired for refusing to comply.
  *Procedure Run:*
  1.  **Source Type:** Testimony.
  2.  **Source Conditions:**
      *   Identified/Reachable? **No.** (Hard Test Fail).
      *   Interest in Outcome? **Yes.** (Former employee, fired). (Judgment Call -> Escalate).
  3.  **Defeat/Conflict:** None currently.
  4.  **Status:** **Rejected.**
  *Reasoning:* Under Step 2 (Testimony), the source fails the identification hard test. Even if we waive identification, the "Interest in Outcome" triggers an escalation. However, because the claim rests *entirely* on this source, and the source cannot be verified for truthfulness (a condition of valid testimony), the warrant is defective. The interest acts as a defeating condition.
  *Outcome:* The claim cannot be published as fact. It must be attributed as an allegation or killed.
  *Desk Reaction:* **Hate.** This kills the scoop. The desk argues that anonymous sources are standard practice. The procedure argues that without competence/truthfulness verification, testimony is not knowledge (*prama*), only doubt (*samsaya*).

  **Case 2: The Causal Dataset**
  *Claim:* "Exposure to Chemical X causes Liver Disease Y."
  *Warrant:* Observational study showing 80% of patients with Disease Y had exposure to Chemical X. Background data shows 75% of the general population is exposed to Chemical X.
  *Procedure Run:*
  1.  **Source Type:** Reasoning (Inference).
  2.  **Source Conditions:**
      *   Reason present in case? **Yes** (Patients had exposure).
      *   Reason present in similar cases? **Yes** (Other patients had exposure).
      *   Reason absent in dissimilar cases (those without disease)? **No.** (75% of healthy people also have exposure). (Hard Test Fail).
  3.  **Defeat/Conflict:** The data itself provides the defeat condition (presence of reason where effect is absent).
  4.  **Status:** **Rejected.**
  *Reasoning:* Under Step 2 (Reasoning), inference requires the reason (exposure) to be absent where the target property (disease) is absent. Since exposure is common in the healthy population, the inference fails the third characteristic of valid reasoning. It establishes correlation, not causation.
  *Outcome:* The claim must be downgraded to "associated with."
  *Desk Reaction:* **Annoyance.** Weakens the headline, but methodologically defensible.

  **Case 3: The Contradictory Document**
  *Claim:* "The Senator voted against the bill in 2021." (Published by this desk in 2022).
  *New Warrant:* A newly obtained official voting record shows the Senator voted "Present."
  *Procedure Run:*
  1.  **Source Type:** Testimony (Past Desk Report) vs. Testimony/Perception (Official Document).
  2.  **Source Conditions:** Both sources appear competent.
  3.  **Defeat/Conflict:**
      *   Contradiction verified? **Yes.** (Step 3, Check 1).
      *   Clash between sources? **Yes.**
  4.  **Status:** **Doubt (Escalate).**
  *Reasoning:* Under Step 3, a clash between two sources produces doubt. Doubt is not knowledge. The new document defeats the old testimony, but the old testimony was previously verified. This creates an epistemic conflict that requires editor intervention to decide if the new document overrides the old verification or if the new document is itself suspect.
  *Outcome:* Escalate to Editor. Do not publish the old claim; do not publish the correction until the Editor resolves the conflict.
  *Desk Reaction:* **Frustration.** Delays the correction story.

  ***

  ### LIMITATIONS AND EXPECTED MISFIRES

  **1. The Probability Blindspot**
  Nyāya epistemology is binary: a cognition is either valid knowledge (*prama*) or it is not (*aprama*). Modern journalism often deals in probabilistic truths (e.g., "likely," "sources suggest"). This procedure will force checkers to reject high-probability claims that lack definitive warrant, potentially starving stories of necessary context. It cannot grade "likelihood," only "validity."

  **2. The Competence Bottleneck**
  Step 2 (Testimony) requires checking speaker competence. In a 10-minute window without a research budget, checkers cannot verify expertise. This will trigger constant escalations to you (the Editor). The procedure identifies the problem but does not solve the resource constraint, risking a backlog of judgment calls.

  **3. Systemic Bias as "Defeat"**
  Nyāya treats defeat as a specific contradictory cognition. It does not account for systemic bias where a source is "competent and truthful" by individual standards but embedded in a corrupted system (e.g., official statistics from an authoritarian regime). The procedure may validate claims that are structurally unsound because the immediate defeat condition is invisible.

  **4. The "Conceptual Report" Flattening**
  Step 2 (Direct Observation) asks checkers to separate sensory contact from conceptual report. In practice, language rarely allows this separation ("I saw him steal" vs. "I saw him take"). Checkers will likely fail to distinguish these consistently, treating all eyewitness accounts as raw perception, thereby validating interpreted claims as raw data.

  **5. Memory and Continuity**
  The procedure rejects claims based merely on memory (past reporting). While epistemologically sound, this undermines the desk's archival authority. If we cannot rely on our own past verified knowledge without re-checking every time, institutional memory becomes useless. The procedure treats every claim as if it were new, which is inefficient for long-form journalism relying on established baselines.
