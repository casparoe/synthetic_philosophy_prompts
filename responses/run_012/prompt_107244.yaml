answer: |-
  **Proposal Title:** Composition as a Determinable: A Domain-Relative Approach to the Special Composition Question

  ### 1. Statement of the Research Question

  The Special Composition Question (SCQ) is traditionally formulated as follows: "Under what conditions do some things compose a further thing?" Standard answers attempt to provide a single, necessary, and sufficient condition that applies universally across all ontological categories. Universalism asserts that composition always occurs; Nihilism asserts that it never occurs; Restrictionism asserts that it occurs only when specific constraints (such as contact, fastening, or life) are met.

  This paper will not attempt to defend one of these standard answers. Instead, it will challenge the formulation of the SCQ itself. The primary research question is: **Is the composition relation univocal across all ontological domains, or is it a determinable property that is realized by distinct determinates relative to specific domains of discourse?**

  To make this determinate, the paper will address the following sub-questions:
  1.  Does the assumption of univocality explain the persistent stalemate between Universalism, Nihilism, and Restrictionism?
  2.  Can a model of "Domain-Relative Composition" account for the truth of ordinary claims (e.g., "these bricks compose a wall") and scientific claims (e.g., "these atoms compose a molecule") without committing to a single metaphysical glue?
  3.  Does treating composition as a determinable dissolve the paradoxes of vagueness and arbitrariness that plague standard mereology, or does it merely relocate them?

  The goal is to shift the debate from *when* composition occurs to *what kind* of composition is occurring in a given context.

  ### 2. Diagnosis: Why Existing Positions Leave the Question Open

  The current debate is characterized by a dialectical standoff. Each major position captures a subset of our intuitions while violating others, leading to a cycle of counterexamples and revisions that fails to produce a consensus. This paper will argue that this failure is structural, resulting from the shared assumption that "composes" denotes a single, invariant relation.

  **Universalism** succeeds in providing a precise, parsimonious ontology and avoids vagueness, but it violates common sense by validating composites that seem arbitrary (e.g., the fusion of the Eiffel Tower and a specific proton). It treats composition as a logical operation devoid of metaphysical constraints.

  **Nihilism** preserves a robust distinction between fundamental entities and conceptual conveniences, avoiding arbitrary composites. However, it requires an error theory regarding ordinary objects, forcing us to deny the existence of tables, organisms, and persons. It treats composition as a relation that is never genuinely instantiated.

  **Restrictionism** attempts to split the difference, positing that composition occurs only when parts are bonded, integrated, or alive. While this aligns best with pre-theoretic intuition, it notoriously struggles to specify the boundary conditions without arbitrariness. For example, if contact is required, how much contact? If life is required, where does biology end and chemistry begin?

  The paper will argue that these positions fail because they are all attempting to solve a single-variable equation for a multi-variable problem. They assume that the conditions under which quarks compose a neutron must be the same *kind* of conditions under which citizens compose a state. By forcing a univocal account, Universalism and Nihilism eliminate the nuance required to distinguish domains, while Restrictionism fails because no single constraint (like "contact" or "function") applies equally to physical, biological, and social entities.

  The debate remains open not because the evidence is insufficient, but because the question presupposes a uniformity that does not exist. The proposal posits that the stalemate is a category error: we are looking for a single "glue" when there are instead multiple types of "binding," each legitimate within its own domain.

  ### 3. Methodology and Work Plan

  The project will proceed over a standard fourteen-week semester. The method is reconstructive rather than defensive. Rather than defending a specific mereological system, I will construct a framework for evaluating composition claims relative to domains. The 7,000-word limit requires strict discipline; I cannot survey every argument in the literature but must focus on the structural flaw in the SCQ formulation.

  **Weeks 1–3: Diagnostic Analysis**
  *   **Task:** Analyze the standard formulations of the SCQ. Identify the implicit premise of univocality in the arguments for Universalism and Nihilism.
  *   **Output:** A draft section (approx. 1,500 words) demonstrating that the counterexamples used against Restrictionism rely on cross-domain comparisons (e.g., using physical vagueness to undermine social objects).
  *   **Rationale:** Before proposing a solution, I must establish that the problem is methodological. This section sets the stage by showing why the standard trichotomy is exhaustive only if we assume univocality.

  **Weeks 4–6: Developing the Determinable Model**
  *   **Task:** Articulate the metaphysical distinction between a determinable relation (Composition simpliciter) and its determinates (Physical Composition, Biological Composition, Social Composition, etc.).
  *   **Output:** A draft section (approx. 2,000 words) defining the criteria for distinguishing domains. I will use the analogy of color (determinable) and specific wavelengths (determinates) to explain how "composition" can be one concept but realized differently.
  *   **Rationale:** This is the core positive contribution. I must ensure this does not collapse into mere semantic ambiguity (the word "compose" has two meanings) but remains a metaphysical claim (the relation itself has different realizations).

  **Weeks 7–9: Application and Stress-Testing**
  *   **Task:** Apply the model to hard cases. Specifically, I will examine "borderline" cases where domains overlap, such as viruses (biological/chemical), corporations (social/legal), and brains (biological/physical).
  *   **Output:** A draft section (approx. 2,000 words) testing whether the domain-relative approach resolves vagueness or merely labels it.
  *   **Rationale:** A theory of composition must handle vagueness. If the domain-relative approach simply says "it depends on the domain" without explaining how to identify the domain, it is vacuous. I will attempt to provide criteria for domain identification.

  **Weeks 10–12: Objections and Refinements**
  *   **Task:** Anticipate the strongest objection: that this view leads to ontological proliferation or makes truth too relative.
  *   **Output:** A draft section (approx. 1,000 words) defending the view against charges of relativism.
  *   **Rationale:** To be philosophically robust, the paper must show that domain-relativity does not entail that "anything goes." There must be facts of the matter about which domain is operative.

  **Weeks 13–14: Synthesis and Revision**
  *   **Task:** Assemble the sections, ensure flow, and trim to meet the 7,000-word limit.
  *   **Output:** Final paper.
  *   **Rationale:** The constraint of 7,000 words is tight for this scope. I will likely need to cut the "Application" section down to two specific case studies rather than a broad survey.

  **Why this approach?**
  Defending Universalism or Nihilism requires engaging with deep technical mereology (e.g., General Extensional Mereology) and modal logic. Defending Restrictionism requires solving the problem of the many and vagueness. By shifting to the determinable model, I bypass the need to solve the internal problems of each view and instead address the framework that generates them. This is more feasible for a semester paper because it relies more on conceptual analysis than formal derivation.

  ### 4. Conditions for Success and Failure

  **Success Conditions**
  A successful result will achieve the following:
  1.  **Dissolution of the Stalemate:** The paper will demonstrate that Universalism and Nihilism are not contradictory truths but rather over-generalizations of specific determinates. For instance, Universalism might be accidentally true for abstract objects, while Nihilism is accidentally true for fundamental physics, but both fail when applied cross-domain.
  2.  **Coherent Framework:** The determinable/determinate distinction must be clearly defined. It must be clear how "Physical Composition" differs from "Social Composition" without resorting to circular definitions (e.g., "physical composition is what atoms do").
  3.  **Preservation of Intuitions:** The view should allow us to say truly that "atoms compose molecules" and "people compose committees" without requiring a single metaphysical bond that satisfies both cases.
  4.  **Argumentative Rigor:** The paper must avoid the charge that this is merely a linguistic trick. The success condition requires showing that the *metaphysics* varies, not just the language.

  **Failure Conditions**
  The project will be considered a failure if:
  1.  **Collapse into Ambiguity:** If the distinction between determinables and determinates cannot be sustained and the view reduces to "the word 'compose' is ambiguous," the metaphysical weight of the project is lost.
  2.  **Vicious Relativism:** If the domain-relative approach implies that there is no fact of the matter about whether an object exists independent of our conceptual scheme, the view collapses into idealism or anti-realism, which is outside the scope of this seminar.
  3.  **Gerrymandering:** If the domains are defined *post hoc* simply to save specific intuitions (e.g., defining a "biological domain" solely to ensure organisms exist), the theory lacks predictive power.
  4.  **Scope Creep:** Given the 7,000-word limit, failure will occur if I attempt to cover too many domains (e.g., trying to include mathematical composition alongside physical and social). If the paper becomes a survey rather than an argument, it will fail to be persuasive.

  ### 5. Feasibility Assessment

  **Is this too much for one semester?**
  There is a significant risk that this topic is too ambitious for a 7,000-word term paper, though it is manageable within a semester's timeframe if strictly scoped.

  **The Word Count Constraint:**
  7,000 words is approximately 20–25 double-spaced pages. This is relatively short for a metaphysical reconstruction of the SCQ. Standard papers on this topic often run longer because they must engage with formal mereology. My strategy avoids formalism, which saves space, but the conceptual work required to distinguish "determinates of composition" is dense. I risk spending 4,000 words critiquing the standard view and leaving only 3,000 words for the positive proposal. To mitigate this, I will limit the critique in Section 2 to the structural assumption of univocality rather than engaging with every specific argument for Universalism or Nihilism.

  **The Conceptual Load:**
  The determinable/determinate distinction is philosophically subtle. Explaining this clearly without getting bogged down in the metaphysics of properties (which is a separate debate) will be challenging. I must treat the distinction as a functional tool for the SCQ rather than defending the metaphysics of determinables themselves. If I have to defend the nature of determinables, the paper will become unmanageable. I will treat it as a working hypothesis.

  **The Domain Problem:**
  Defining the "domains" is the hardest part. If I claim there is a "biological domain," I must explain what makes it distinct from the "chemical domain." This touches on the debate over emergentism and reductionism. I cannot solve the reductionism debate in a term paper. Therefore, I will frame the domains functionally (based on the explanatory practices of the sciences) rather than fundamentally (based on ontological joints). This makes the project feasible but limits its metaphysical depth.

  **Verdict:**
  The project is feasible **provided I accept a moderate depth**. I cannot aim to solve the SCQ definitively; I can only aim to show that the current formulation is flawed and that the domain-relative approach is a viable alternative that deserves further attention. If I attempt to prove that domain-relativity is the *only* solution, I will run out of words. If I argue that it is a *neglected and superior* framework that dissolves the primary paradoxes, I can succeed within the limit.

  The primary danger is not the time (one semester is sufficient) but the scope. I must resist the temptation to add more examples. I will restrict the positive analysis to two contrasting domains: Fundamental Physics (where Nihilist intuitions dominate) and Social Ontology (where Universalist or Functionalist intuitions dominate). Showing how the determinable model accommodates both without contradiction will be sufficient to prove the thesis without requiring a survey of all possible composites.

  **Conclusion**
  This proposal outlines a shift from answering the Special Composition Question to reframing it. By treating composition as a determinable relation with domain-specific determinates, the paper aims to explain the persistent stalemate in contemporary metaphysics and offer a path forward that respects the diversity of ontological phenomena without sacrificing rigor. The plan is tight but executable within the semester, provided the focus remains on the structural critique of univocality rather than an exhaustive survey of mereological systems.
