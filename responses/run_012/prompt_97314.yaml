answer: |-
  **MEMORANDUM**

  **TO:** Records Committee, Truth and Reconciliation Commission
  **FROM:** [Your Name], Technical Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Amnesty Application D.M. and Definition of "Full Disclosure"

  **Recommendation**
  I recommend we **grant amnesty with conditions**. Specifically, we should withhold the final amnesty certificate for 30 days. The certificate will be issued only if D.M. provides a supplementary statement naming the specific detainees he personally interrogated. If he fails to do so, the application is denied.

  **Reasoning: Facts vs. Feelings**
  The statute requires "full disclosure of all relevant facts." It does not require remorse. On this, the committee members urging caution are correct: we cannot become judges of an applicant's soul. If we deny amnesty because an applicant is unrepentant, we are punishing them for their internal feelings, which the law does not mandate and we cannot verify.

  However, D.M.'s submission is incomplete not because it lacks emotion, but because it lacks specific data. He has provided the *structure* of the abuse (dates, orders, grave locations) but obscured the *subjects* of the abuse (the names of the detainees).

  Using the passive voice ("detainees were interrogated") removes the agent, but refusing to name the victims removes the human element from the record. The identity of a victim is a fact. By withholding names, D.M. is withholding relevant facts. We can enforce a requirement for names; we cannot enforce a requirement for an apology.

  **Addressing the "Sanitized Truth" Concern**
  The strongest argument against my recommendation is the worry that demanding any form of acknowledgment turns amnesty into a reward for "right feelings." Colleagues argue that if we require D.M. to acknowledge the victims as "wronged," we are asking him to adopt a specific moral viewpoint, which violates the neutrality of the commission.

  I agree we should not police moral viewpoints. But there is a difference between *moral acknowledgment* (saying "I did wrong") and *factual acknowledgment* (saying "I did this to Person X").

  When D.M. refuses to name names, he is not just withholding feelings; he is withholding the evidence families need to close their own records. A truth commission's product is the historical record. A record that lists graves but not the people in them is technically corrupted. It is data without keys. Requiring him to name the detainees is not asking for contrition; it is asking for complete data entry. It forces him to connect his actions to specific human beings, which satisfies the "acknowledgment" goal without requiring him to say he is sorry.

  **Proposed Test for "Full Disclosure"**
  To ensure consistency in future cases, I propose we adopt the following **Completeness and Specificity Test**. An application meets the statutory requirement for full disclosure only if:

  1.  **Structural Completeness:** Does the submission explain the chain of command, the rules of engagement, and the locations of incidents?
  2.  **Victim Specificity:** Does the submission identify the victims by name or, if names are unknown, by specific descriptive details that allow for identification (e.g., "the teacher from Village X arrested on Date Y")?
  3.  **Personal Agency:** Does the applicant clearly state their own specific actions using active voice (e.g., "I ordered," "I transported," "I interrogated") rather than passive descriptions of events?

  If an applicant fails any of these three points, the disclosure is incomplete.

  **Decision on Application D.M.**
  D.M. passes the Structural Completeness test (the graves were found). He fails Victim Specificity and Personal Agency regarding the interrogations.

  **Action Plan:**
  1.  **Notify D.M.** that his application is provisionally approved pending clarification.
  2.  **Requirement:** Within 30 days, he must submit a signed addendum listing the names of all detainees he personally interrogated.
  3.  **Consequence:** If the addendum is received and verified as truthful against our existing records, the amnesty is granted immediately. If he refuses or provides evasive answers, the application is denied.

  This approach respects the statute (facts, not feelings), addresses the families' need for truth (names, not just graves), and keeps the commission within its enforceable power. We are not asking D.M. to cry; we are asking him to count.

  I am available to discuss this logic before Thursday's vote.
