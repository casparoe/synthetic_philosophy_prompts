prompt: |-
  I am a software engineer and the only technical member of the records committee of a post-conflict truth commission. Our enabling statute offers amnesty for politically motivated acts when the applicant makes full disclosure of all relevant facts; it says nothing about remorse, and the commission has never defined what full disclosure requires. We are now deciding the application of a former police captain, D. M., who ran a detention site during the conflict. His written submission is factually detailed about dates, orders, and chains of command, and it has already helped us locate three unmarked graves. But he writes in the passive voice, does not name the detainees he personally interrogated, and when asked whether the interrogations were wrong, says only that they were lawful under the emergency regulations then in force. He offers no apology. The committee is split. Some members say the statute requires facts, not contrition, and that the graves are enough; others say amnesty without acknowledgment purchases silence and asks victims' families to accept the state's sanitized version of what happened. One commissioner has proposed a two-part test for these cases: first, does the submission close factual gaps in our record; second, does it treat the victims as wronged rather than merely affected. She calls the second part the acknowledgment condition. I need to circulate a short written opinion before Thursday's vote. Please draft it. Recommend a concrete decision on this application—grant, deny, or grant with conditions—with a time frame and any conditions the commission can actually enforce. Give us a test for full disclosure that we can apply to future cases, and engage seriously with the strongest argument on the losing side, especially the worry that requiring contrition makes amnesty a reward for the right feelings rather than a tool for truth. I have no formal philosophy background, so keep the memo in plain language and do not include citations or reading lists; the commission needs reasons it can act on, not a literature review.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Software Engineer (only technical member) on a Records Committee of a Post-Conflict Truth Commission.
      *   **Task:** Draft a short written opinion/memo for circulation before Thursday's vote.
      *   **Subject:** Amnesty application of former police captain D.M. (ran a detention site).
      *   **Key Facts:**
          *   Statute: Amnesty for politically motivated acts + full disclosure of all relevant facts. No mention of remorse.
          *   D.M.'s Application: Factually detailed (dates, orders, chain of command), helped locate 3 graves. Uses passive voice, doesn't name specific detainees he interrogated, claims legality under emergency regulations, no apology.
          *   Committee Split: Facts vs. Contrition/Acknowledgment.
          *   Proposed Test by Commissioner: 1. Close factual gaps? 2. Treat victims as wronged (Acknowledgment Condition)?
      *   **Requirements:**
          *   Recommend a concrete decision (Grant, Deny, or Grant with Conditions) + time frame/enforceable conditions.
          *   Provide a test for "full disclosure" for future cases.
          *   Engage with the strongest counter-argument (specifically: requiring contrition makes amnesty about feelings, not truth).
          *   Tone: Plain language, actionable reasons, no academic citations/philosophy jargon.
          *   Deadline: Before Thursday (implies urgency/brevity).

  2.  **Determine the Stance:**
      *   *Option A (Strict Statutory):* Grant amnesty. The law says facts, not feelings. D.M. gave graves.
          *   *Pros:* Follows letter of law. Encourages others to come forward.
          *   *Cons:* Undermines moral authority. Leaves victims feeling silenced. "Sanitized truth."
      *   *Option B (Moral/Restorative):* Deny amnesty. No remorse = no truth.
          *   *Pros:* Validates victims.
          *   *Cons:* Might discourage other perpetrators. Could be seen as exceeding statutory mandate.
      *   *Option C (Middle Ground/Conditional):* Grant *pending* specific factual clarifications.
          *   *Pros:* Balances truth-seeking with statutory limits. Avoids policing "feelings" while demanding specific *facts* about victims.
          *   *Cons:* Complex to enforce.
      *   *Decision:* I need to take a stand that respects the statute but addresses the "sanitized truth" concern. The prompt asks to engage with the worry about "rewarding right feelings." This suggests I should lean towards a definition of "disclosure" that includes *identifying victims* without necessarily demanding *emotional remorse*. This bridges the gap. D.M. gave structural facts but hid human facts (names of detainees).
      *   *Recommendation:* **Grant with Conditions (Deferral).** Require specific identification of detainees within a set time. This treats "full disclosure" as including the *identity* of those harmed, not just the *mechanics* of the harm. It avoids demanding an apology (feelings) but demands accountability for *who* was harmed (facts).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly.
      *   **The Core Argument (The "Test"):** Define "Full Disclosure." It's not just "what happened" but "to whom." The statute says "relevant facts." The identity of the victim is a relevant fact.
      *   **Addressing the Counter-Argument:** The "Thought Police" objection. If we demand remorse, we judge hearts. If we demand victim names, we judge records. Distinguish between *contrition* (emotion) and *acknowledgment* (factual recognition of the other's humanity).
      *   **Application to D.M.:** He gave the "what" and "where" (graves) but obscured the "who" (passive voice, no names). This is incomplete disclosure.
      *   **The Decision:** Defer decision. Give him 30 days to name the detainees he personally interrogated. If he does, grant. If not, deny.
      *   **Future Test:** Propose the "Completeness and Specificity" test.
      *   **Closing:** Reiterate the goal (Truth, not therapy).

  4.  **Refining the Tone:**
      *   *Constraint:* "Software Engineer" background. Use logical, systematic language. Avoid legalese or philosophical jargon.
      *   *Constraint:* "Plain language." No citations.
      *   *Constraint:* "Actionable." The committee needs to vote on this.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey team, vote to delay D.M.'s amnesty.
      *   Why? He didn't tell us everything. He told us about the system, but not the people.
      *   Statute says "full disclosure." Names are facts.
      *   Some say we want apologies. I say no, we want names. Apologies are feelings. Names are data.
      *   So, give him 30 days to give us the names.
      *   Future rule: Disclosure = System + Victims.
      *   Let's do this.

  6.  **Drafting - Iteration 2 (Fleshing out the argument):**
      *   Need to address the "Acknowledgment Condition" proposed by the colleague. I should support the *intent* but refine the *mechanism*. Instead of "treat victims as wronged" (which sounds subjective), make it "identify victims specifically" (which is objective).
      *   Address the "reward for feelings" argument. This is crucial. If we deny him because he's not sorry, we are judging his soul. If we deny him because he won't name names, we are judging his compliance with the truth mandate.
      *   Make sure the conditions are enforceable. Naming names is verifiable. "Showing remorse" is not.

  7.  **Final Polish (checking against constraints):**
      *   *Plain language?* Yes.
      *   *No citations?* Yes.
      *   *Concrete decision?* Yes (Deferral/Conditional).
      *   *Time frame?* Yes (30 days).
      *   *Future test?* Yes.
      *   *Engage counter-argument?* Yes.

  8.  **Final Review of the "Software Engineer" Persona:**
      *   The prompt mentions I am a software engineer. I shouldn't necessarily use tech metaphors (like "debugging the truth") unless they fit naturally, but I should write with the precision and logic of an engineer. Systematic, clear inputs/outputs. *Self-Correction:* Don't overdo the tech metaphors; it might seem gimmicky in a legal/human rights context. Just keep the logic tight and structured.

      *(Self-Correction during drafting)*: Wait, the prompt says "Recommend a concrete decision... grant, deny, or grant with conditions." A deferral is essentially "grant with conditions" or "pending." I will frame it as "Defer Decision with Conditions for Grant." Actually, "Grant with Conditions" implies they get amnesty *now* subject to later rules. "Defer" is safer. But the prompt asks for "Grant, Deny, or Grant with Conditions." I will choose **Grant with Conditions (Deferred Finalization)**. Or simpler: **Defer Ruling**. Let's stick to the prompt's options. I will recommend **Deferral** which functions as a conditional path. Actually, the prompt asks to "Recommend a concrete decision... Grant, Deny, or Grant with Conditions." I will recommend **Grant with Conditions** where the condition must be met *before* the certificate is issued.

      *Revised Plan:* Recommend withholding the amnesty certificate until specific conditions are met. This is effectively "Grant with Conditions."

      *Wait, one more nuance:* The colleague proposed a two-part test including "treat victims as wronged." I need to engage with that. I will argue that "treating as wronged" is too subjective, but "identifying the victim" is the factual proxy for that.

      *Let's write.*

      *Structure:*
      1. Recommendation.
      2. Reasoning on "Full Disclosure."
      3. Addressing the "Contrition" Objection.
