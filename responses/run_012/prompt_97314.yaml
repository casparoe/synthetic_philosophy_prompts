      5. Specific Ruling on D.M.

      *Tone Check:* Respectful, firm, practical.

      *(Final thought on the "Software Engineer" aspect)*: The prompt mentions this to explain why I might not have legal/philosophical training, but also implies I should bring a logical, systems-thinking approach. I will ensure the "Test" looks like a clear algorithm/checklist.

      *(Final thought on the Counter-Argument)*: The strongest argument against me is that the statute *only* says facts. If I demand acknowledgment, am I adding a requirement? I need to argue that *who* was harmed is a fact, not an acknowledgment of guilt. This is the pivot.

