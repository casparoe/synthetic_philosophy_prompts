  2.  **Deconstruct the Core Argument:**
      *   *Standard View:* Sen's informational frameworks. If utilities are cardinally measurable and unit comparable, utilitarianism is possible. If only ordinally measurable, Arrow's impossibility looms.
      *   *The Suspicion:* This treats comparability as a property of the *measurement system* rather than a property of the *world* or a specific *normative license*.
      *   *The Distinction:*
          1.  *Metaphysical/Factual:* Is there a fact of the matter that Person A's gain of 5 units is "equal" to Person B's loss of 5 units?
          2.  *Normative/Procedural:* Are we permitted to treat them as equal for the purpose of aggregation, even if the metaphysical footing is shaky?
      *   *The "Manufacturing" Point:* When we use money or QALYs, we aren't finding a pre-existing scale; we are constructing a proxy. The proposal needs to ask: Under what conditions does a constructed proxy track the *factual* comparability required for normative justification?
      *   *Refined Research Question:* "To what extent do operational instruments of comparison (e.g., currency, health metrics) track mind-independent facts of interpersonal well-being magnitude, versus functioning as normative conventions that bypass the need for such facts?"
