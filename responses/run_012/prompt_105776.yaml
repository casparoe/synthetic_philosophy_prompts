      *   *Word Count Check:* I need to expand on the philosophical nuances to hit ~2,500 words without fluff. I need to elaborate on *why* the standard informational approach fails to capture the "manufacturing" aspect. I need to detail the case studies (money/health) more thoroughly.
      *   *Refining the Argument:* The key insight is that standard theory treats comparability as an *input* (invariance conditions). The proposal treats comparability as an *output* of measurement practices. The tension is: if it's an output of practice, is it arbitrary? If it's not arbitrary, what anchors it?
