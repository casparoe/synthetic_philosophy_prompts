prompt: |-
  I am applying for a six-month postdoctoral fellowship and need a proposal of about 2,500 words on interpersonal utility comparisons, built around a suspicion I want to turn into a research question. Discussions of comparability usually proceed by asking what information is available — ordinal versus cardinal, level versus unit comparability — and then reading off the consequences for social choice, with utilitarian aggregation following from unit comparability and something like leximin from level comparability. My suspicion is that this framing runs together two different issues: whether the facts about people's well-being determine a common scale, and whether a social choice rule is permitted to be sensitive to particular differences between persons. If the suspicion is right, several familiar sceptical and optimistic arguments about comparability turn out to be arguments about the invariance conditions we impose on a representation, and they leave untouched a narrower question — whether the size of one person's gain can be weighed against another's loss — that really is a question about the facts. The cases I want to press hardest are instruments that appear to manufacture comparability rather than discover it, such as a common currency or the health metrics used to compare very different lives, and I want to ask what it would take for those instruments to be more than conventions of measurement. Turn this into a proposal: state the question so that it has a determinate answer, explain why the existing positions leave it open, set out what I would actually do month by month, say what a successful result would look like and what would count as the project failing, and be honest about what could make it too large for six months. You may refer to positions and arguments freely; I will supply the citations myself.
