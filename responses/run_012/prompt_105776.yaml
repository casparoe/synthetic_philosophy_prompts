answer: |-
  **Project Title:** Manufacturing Scale: Operational Instruments and the Metaphysics of Interpersonal Comparison

  **Project Summary**

  This project proposes a re-examination of the foundations of interpersonal utility comparisons (IUC) within social choice theory. The standard informational approach, pioneered by Sen and others, treats comparability as a constraint on the information available to a social planner: if utilities are cardinally measurable and unit-comparable, utilitarian aggregation is permissible; if only ordinally measurable, it is not. I argue that this framing conflates two distinct issues: the metaphysical question of whether facts about well-being determine a common scale, and the normative question of whether a social choice rule is permitted to be sensitive to differences between persons. By focusing on instruments that appear to *manufacture* comparability—such as common currency or health metrics like QALYs—this project asks whether operational success implies factual comparability or merely normative convention. Over six months, I will develop a taxonomy distinguishing ontological comparability from operational comparability, analyze key measurement instruments, and determine whether aggregative social choice rules can be justified without tacit metaphysical commitments.

  **Background and Problem Statement**

  Discussions of interpersonal comparability in social choice theory typically proceed via an informational analysis. The orthodox view holds that the permissibility of a social welfare function depends on the transformation properties of the utility functions representing individual well-being. If utility functions are invariant only up to positive affine transformations (cardinal unit comparability), we can meaningfully sum utilities. If they are invariant up to strictly increasing transformations (ordinal non-comparability), we cannot. This approach reads off normative consequences directly from informational constraints. Utilitarianism follows from unit comparability; leximin or Pareto principles follow from level comparability or ordinality, respectively.

  My suspicion is that this standard framing runs together two different issues that ought to be disentangled. The first is whether the facts about people's well-being determine a common scale (the metaphysical or ontological issue). The second is whether a social choice rule is permitted to be sensitive to particular differences between persons, regardless of the underlying metaphysics (the normative or licensing issue). In the standard literature, these are treated as a single package: if the facts don't support the scale, the rule is impermissible. However, this obscures the role of measurement instruments.

  In practice, policymakers and economists routinely employ instruments that generate comparability where none was obviously present. Cost-benefit analysis uses willingness-to-pay to translate diverse preferences into a common currency. Health economics uses Quality-Adjusted Life Years (QALYs) to compare the value of extending the life of a disabled person versus an able-bodied person. These instruments do not merely *discover* a pre-existing scale; they construct one. They appear to manufacture comparability rather than uncover it.

  If my suspicion is correct, several familiar sceptical and optimistic arguments about comparability turn out to be arguments about the invariance conditions we impose on a representation, rather than arguments about the world. Sceptics (following Robbins or Arrow) argue that there is no empirical observation that can verify that my pain is equal to yours. Optimists (following Harsanyi or Ng) argue that empathy or neurophysiology provides the link. Both sides, however, often bypass the intermediate layer: the measurement technology itself. They leave untouched a narrower, more tractable question: whether the size of one person's gain can be weighed against another's loss is treated as a binary fact, when it may actually be a function of the instrument used to measure it.

  Consequently, the existing positions leave a critical gap open. The informational approach assumes the scale is either "available" or "unavailable." It does not account for scales that are *created* by the decision procedure itself. If we use money to compare utilities, are we discovering that money measures well-being neutrally, or are we stipulating that money *shall count* as the measure of well-being for the purpose of the aggregation? If the latter, the justification for utilitarian-style aggregation shifts from "this reflects the truth about well-being" to "this is a legitimate convention for collective decision-making." The standard theory lacks the vocabulary to distinguish these justifications, leading to stalemates where sceptics deny the facts and optimists assert them, while the actual practice of policy-making proceeds by constructing proxies.

  **The Research Question**

  To make this suspicion tractable within a six-month fellowship, I will refine it into a specific research question with a determinate answer. The question is:

  *Can the use of operational instruments for interpersonal comparison (such as currency or health metrics) be justified solely as normative conventions for social choice, or does their successful application necessarily presuppose a mind-independent fact of interpersonal magnitude?*

  This question is determinate because it forces a dichotomy. Either there is a justification for using these instruments that does not rely on the claim that they track "real" comparable magnitudes (a conventionalist account), or any such justification implicitly relies on the claim that they do track real magnitudes (a realist account).

  To answer this, I must establish criteria for what counts as "manufacturing" versus "discovering." I will argue that an instrument *discovers* comparability if its validity conditions are independent of the social choice rule in which it is embedded. An instrument *manufactures* comparability if its validity is constituted by the acceptance of the aggregation rule itself. For example, if we accept cost-benefit analysis *because* we believe willingness-to-pay tracks well-being, it is discovery. If we accept willingness-to-pay as a measure of well-being *because* we have already committed to cost-benefit analysis as the decision procedure, it is manufacturing.

  This distinction allows me to evaluate the sceptical and optimistic arguments anew. If the instruments are manufacturing comparability, the sceptic's demand for empirical verification of interpersonal magnitude is misplaced; the question becomes one of normative legitimacy, not empirical verification. Conversely, if the instruments require realist presuppositions, the optimist must provide the empirical grounding they often gloss over. The project aims to show that most current instruments function as manufacturing devices, and that social choice theory needs to account for this by separating the *construction of the scale* from the *aggregation on the scale*.

  **Methodology and Work Plan**

  The project will be executed over six months, divided into three phases: Conceptual Foundation, Case Studies, and Synthesis. The methodology is primarily philosophical analysis applied to formal social choice frameworks and practical measurement tools.

  **Month 1: Conceptual Groundwork and Taxonomy**
  The first month will be dedicated to formalizing the distinction between ontological and operational comparability. I will review the standard informational frameworks (Sen, Arrow, d'Aspremont and Gevers) to isolate exactly where the conflation occurs. The goal is to produce a working taxonomy of comparability claims.
  *   *Task 1.1:* Map the standard invariance conditions (ordinal, cardinal, level, unit) against metaphysical claims about well-being.
  *   *Task 1.2:* Define "Operational Comparability." I will draw on philosophy of measurement (e.g., Chang, Tal) to distinguish between "measurement as detection" and "measurement as coordination."
  *   *Task 1.3:* Draft a conceptual paper section outlining the "Conflation Thesis."
  *   *Deliverable:* A detailed conceptual framework document (approx. 3,000 words) that defines the terms for the rest of the project.

  **Month 2: The Invariance Critique**
  In the second month, I will focus on the argument that sceptical and optimistic positions are actually disputes over invariance conditions rather than facts.
  *   *Task 2.1:* Analyze the sceptical argument (e.g., Robbins) to show it targets the lack of an invariance condition in observation.
  *   *Task 2.2:* Analyze the optimistic argument (e.g., Harsanyi) to show it imposes an invariance condition via empathy or rationality assumptions.
  *   *Task 2.3:* Demonstrate that both leave the status of the *instrument* unexamined.
  *   *Deliverable:* A critical analysis section demonstrating how the standard debate bypasses the measurement technology.

  **Month 3: Case Study I – Common Currency and Willingness to Pay**
  I will apply the framework to the use of money in cost-benefit analysis. Money is the most common tool for manufacturing comparability.
  *   *Task 3.1:* Examine the Kaldor-Hicks criterion. Does it assume utilities are comparable, or does it define comparability through potential compensation?
  *   *Task 3.2:* Investigate the marginal utility of money. If the marginal utility of money differs between persons, does summing willingness-to-pay manufacture a false unit comparability?
  *   *Task 3.3:* Determine if the use of currency can be justified conventionally (as a coordination device) without claiming it measures well-being neutrally.
  *   *Deliverable:* A case study draft analyzing the metaphysical commitments of cost-benefit analysis.

  **Month 4: Case Study II – Health Metrics (QALYs/DALYs)**
  The second case study will focus on health economics, where comparability is explicitly constructed across very different lives.
  *   *Task 4.1:* Analyze how QALYs equate a year of life with a disability to a fraction of a year of perfect health.
  *   *Task 4.2:* Investigate the time-trade-off methods used to generate these values. Do these methods reveal preferences or construct values?
  *   *Task 4.3:* Ask whether the QALY scale presupposes a fact about the "value of life" or stipulates a rule for resource allocation.
  *   *Deliverable:* A case study draft analyzing the construction of health metrics.

  **Month 5: Synthesis and Normative Implications**
  In the fifth month, I will integrate the findings from the case studies to answer the core research question.
  *   *Task 5.1:* Compare the two cases. Do currency and QALYs function similarly as manufacturing devices?
  *   *Task 5.2:* Formulate the answer to the research question. (Hypothesis: They are manufacturing devices that require normative, not metaphysical, justification).
  *   *Task 5.3:* Develop the implications for social choice theory. If comparability is manufactured, the constraint on social choice rules is not informational availability but normative legitimacy.
  *   *Deliverable:* A synthesis draft connecting the cases back to the informational framework.

  **Month 6: Writing and Dissemination**
  The final month is dedicated to polishing the results into a fellowship output.
  *   *Task 6.1:* Revise the cumulative drafts into a cohesive journal article.
  *   *Task 6.2:* Prepare a presentation of the findings for the host department.
  *   *Task 6.3:* Identify target journals (e.g., *Philosophy and Public Affairs*, *Economics and Philosophy*) and prepare submission materials.
  *   *Deliverable:* A complete manuscript ready for submission (approx. 8,000–10,000 words).

  **Expected Outcomes: Success and Failure**

  A successful result for this project will look like a clear resolution to the research question that advances the literature on social choice and measurement. Specifically, success entails:
  1.  **A Robust Distinction:** Successfully articulating a distinction between ontological and operational comparability that is recognized by colleagues as a useful clarification of the standard informational approach.
  2.  **A Determinate Answer:** Providing a defensible argument that operational instruments (currency, QALYs) function primarily as normative conventions rather than discoveries of fact, thereby shifting the burden of justification from metaphysicians to normative theorists.
  3.  **A Publishable Manuscript:** Completion of a high-quality paper that integrates the conceptual analysis with the case studies, suitable for a top-tier journal in political philosophy or economic methodology.
  4.  **Framework Utility:** Demonstrating that this new framework can dissolve traditional stalemates (e.g., explaining why sceptics and optimists talk past each other).

  Conversely, the project would count as failing if:
  1.  **Indeterminacy:** The distinction between "manufacturing" and "discovering" proves too vague to apply consistently to the case studies. If I cannot clearly categorize the instruments, the core argument collapses.
  2.  **Triviality:** The conclusion turns out to be a restatement of existing conventionalist arguments (e.g., standard pragmatism) without adding the specific value of the "invariance condition" critique.
  3.  **Disconnect:** The philosophical analysis fails to connect meaningfully with the formal social choice literature, rendering the project irrelevant to the informational constraints debate it aims to critique.
  4.  **Incomplete Output:** Failure to produce a submission-ready manuscript by the end of the six months.

  **Risks and Scope Management**

  I am conscious that this project carries significant risks regarding scope, particularly given the six-month timeframe.

  *   **Risk 1: The Metaphysical Rabbit Hole.** The question of whether well-being facts exist is a deep metaphysical issue. There is a risk of spending too much time on the philosophy of mind or meta-ethics, which would detract from the social choice focus.
      *   *Mitigation:* I will bracket the question of whether well-being facts *exist*. The project is not about solving meta-ethics, but about whether social choice theory *requires* them to justify its instruments. I will treat metaphysical claims as premises to be analyzed, not truths to be established.

  *   **Risk 2: Technical Complexity of Case Studies.** The literature on QALYs and willingness-to-pay is vast and technically demanding. Engaging too deeply with the econometrics could overwhelm the philosophical argument.
      *   *Mitigation:* I will treat the case studies as philosophical exemplars rather than comprehensive reviews. I will focus on the *justification* of the metrics found in introductory or methodological literature, rather than engaging with the cutting-edge statistical debates. The goal is to analyze the *logic* of the measurement, not the precision of the estimate.

  *   **Risk 3: Conflation of Normative and Descriptive.** In arguing that instruments are "conventions," there is a risk of sliding into a descriptive account of how policymakers act, rather than a normative account of how they *ought* to justify their actions.
      *   *Mitigation:* I will maintain a strict focus on justification. The question is not "Do policymakers think they are discovering facts?" but "Can the use of these instruments be justified if they are not discovering facts?"

  *   **Risk 4: Overambition.** Attempting to solve the IUC problem in six months is impossible.
      *   *Mitigation:* The goal is not to solve IUC, but to reframe the *debate about IUC*. The success condition is a shift in perspective, not a final solution to aggregation. I will explicitly limit the conclusion to the status of the *instruments*, leaving the broader implications for welfare economics as a topic for future research.

  **Conclusion**

  This project addresses a foundational ambiguity in social choice theory. By distinguishing between the facts of well-being and the conventions of measurement, it offers a way to move beyond the stalemate between sceptics and optimists regarding interpersonal comparisons. The focus on "manufactured" comparability provides a novel lens through which to view standard instruments like currency and health metrics. If successful, this research will clarify the normative commitments hidden within our measurement practices, ensuring that social choice rules are justified on the grounds we intend—whether those be factual accuracy or legitimate convention. The six-month timeline is tight but feasible, provided the scope is strictly managed to focus on the conceptual distinction and its application to two key cases. The result will be a rigorous contribution to the philosophy of economics, ready for immediate dissemination.
