  **Note on Philosophical Liberties**

  The poem treats the definition of lying as settled: asserting what one believes false (line 14). Philosophers generally agree on this necessary condition, distinguishing it from misleading via true assertions (the refrain). However, moral equivalence is contested. Some argue misleading is worse as it exploits the hearer's inferential labour, leaving no factual complaint; others view it as less culpable than explicit falsehood. The poem leaves this open. Similarly, whether 'bullshit' (indifference to truth, line 16) constitutes lying is debated; Frankfurt argues it is distinct, while others conflate them based on intent to deceive. The poem presents the speaker's indifference without judging its category. Finally, whether implying a falsehood counts as lying depends on one's theory of assertion; the poem assumes a narrow view where only explicit content matters, allowing the refrain to remain technically true.
