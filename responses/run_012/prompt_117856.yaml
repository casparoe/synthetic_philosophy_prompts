answer: |-
  Good evening. I know most of you. I've bought groceries with you, walked dogs with you, and complained about the potholes on Vernon with you. I'm standing here to ask you to vote against this motion. I know that puts me on the wrong side of this room. I'm okay with that. But I need you to hear me out.

  When people say, "This is my neighborhood and I get a say," I hear two different things.

  The first is about burden. You're worried about the parking, the crane swinging over the street for two years, the schools that are already full. That is a distributive complaint. It means you're being asked to eat a cost that the people profiting from this building won't eat. That deserves a real answer, not a sigh. If we vote this down, we might stop the crane, but we don't solve the burden. We just freeze it in place.

  The second thing you're saying is about standing. This is where your life happens. You have a claim on what this place becomes just by living here. That is real. My side of this argument often violates that by telling you nothing will change. I'm not going to do that. This building will change Vernon. The sightlines will change. The density will change. Saying otherwise is exactly how you end up with a room that's stopped trusting you. I trust you enough to tell you the truth: it will be different.

  But the motion before us is about consent. And I think consent is the right frame. I just think we've drawn the boundary of who counts in the wrong place.

  The people who would live in that building aren't here. They don't get to be. Neither are the people who get pushed out of this neighborhood when nothing gets built. Some of them used to sit in these chairs and got priced out already. They don't get a vote tonight. A room cannot consent on behalf of people it won't let in the room. When we claim a veto, we aren't just protecting our standing; we're overriding theirs.

  I'm not saying this to call you small. I'm saying it because I'm in the same boat. I rent. My lease is up in June. If nothing gets built around here, I'm the one moving. I'm not saying that as a punchline or a sob story. I'm saying it so you know I'm not asking you to take a risk I don't share.

  So here is what I'm asking you to do. Don't vote to withhold consent. That's a symbol, and it hands the councilmember a stop sign with no off-ramp.

  Instead, vote this motion down. And then, pass a resolution that authorizes this association to negotiate specific mitigations. Demand the developer fund the parking mitigation. Demand strict construction hours. Demand the ground floor space goes to a use we choose. Give the councilmember something to work with besides a blockade. Give us conditions, not a veto.

  We get to decide who belongs here. Tonight, let's make sure the circle is wide enough to hold the people who need this neighborhood just as much as we do.

  Thank you.
