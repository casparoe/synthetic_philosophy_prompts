      *   *Different Questions (User's Hypothesis)?* Yes. Camp 1 asks: "What does rationality require regarding information processing?" Camp 2 asks: "Why do smart people stay apart?"

  6.  **Synthesize the Diagnosis:**
      *   The impasse isn't just one thing. It's a layering of issues.
