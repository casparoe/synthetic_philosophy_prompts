      *   **Constraint:** "I would rather have an honest no-progress-is-possible-and-here-is-why than another survey." Avoid generic summaries. Provide a sharp diagnosis.

  2.  **Deconstruct Aumann's Agreement Theorem (AAT):**
      *   *Math:* Common Prior + Common Knowledge of Posteriors + Bayesians $\rightarrow$ Identical Posteriors.
