      *   *Section 4: Common Knowledge (CK).* Address the user's suspicion. CK is logically distinct from Mutual Knowledge. It *does* do heavy lifting. Without CK, the theorem collapses. But CK is empirically rare.
      *   *Section 5: What Counts as Progress?*
