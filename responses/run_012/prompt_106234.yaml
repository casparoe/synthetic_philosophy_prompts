  8.  **Final Polish:** Organize into the requested sections (Translation, Residue, Concrete Escapes). Ensure the distinction between "Preference" (operational) and "Betterness" (normative) is highlighted in the Residue section. (DT collapses them; Value Theory keeps them separate).

  *(Self-Correction during drafting)*: Make sure to explicitly mention the Archimedean axiom. The Spectrum Argument is essentially an attack on the Archimedean property of the real numbers used in utility representation.

