      *   Premise 2: For adjacent $i, i+1$, $i+1 \succeq i$ (or $i+1 \succ i$) due to slight trade-off (quality vs. quantity).
      *   Premise 3: Transitivity of $\succ$.
      *   Conclusion: Contradiction ($A \succ Z$ and $Z \succeq A$).
      *   Standard resolutions: Deny Transitivity (Temkin), Deny Adjacent Steps (Slippery Slope/Threshold), Accept $Z \succeq A$ (Repugnant Conclusion/Total Utilitarianism).

  3.  **Translation into Decision Theory (DT) Vocabulary:**
      *   *Relation:* Let $\succeq$ be a binary preference relation over a set of outcomes $\mathcal{O}$.
      *   *Properties:* Completeness ($\forall x,y: x \succeq y \lor y \succeq x$), Transitivity ($\forall x,y,z: x \succeq y \land y \succeq z \implies x \succeq z$).
      *   *Representation:* If $\succeq$ is complete and transitive (and continuous), there exists a utility function $U: \mathcal{O} \to \mathbb{R}$ such that $x \succeq y \iff U(x) \geq U(y)$.
      *   *The Argument in DT:*
          *   We have a sequence $o_1, \dots, o_n$.
          *   Intuition: $U(o_1) > U(o_n)$.
          *   Step-wise intuition: $U(o_{i+1}) \geq U(o_i)$.
          *   Summing steps: $U(o_n) \geq U(o_1)$.
          *   Contradiction.
      *   *VNM Context:* VNM deals with lotteries. The Spectrum Argument is usually about sure outcomes (population ethics). However, if we treat these as certain outcomes within a VNM framework, the utility function must exist if axioms hold.
      *   *Continuity/Archimedean:* The step-wise intuition relies on the idea that small changes in quality can be compensated by small changes in quantity. This smells like the Archimedean axiom (no outcome is infinitely better than another). If $A$ is *lexicographically* better than $Z$, then no amount of $Z$ beats $A$.
      *   *Intransitivity:* Claiming $\succ$ is not transitive means no real-valued $U$ exists. It implies a cycle or a breakdown in ordering.

  4.  **Drafting the Translation (Section 1):**
      *   Define the relation $\succeq$.
      *   Map the "slight difference" to the topology of the outcome space or the continuity axiom.
      *   Map the "clear ordering at ends" to specific utility assignments.
      *   Show the contradiction as a violation of the Representation Theorem conditions.
      *   Address "Preference vs. Value": DT usually defines $\succeq$ as preference. Value theory defines it as "betterness." Need to distinguish if this matters. (DT assumes preference *is* the operational definition of value).

  5.  **Analyzing the Residue (Section 2):**
      *   *Clean Translation:* Transitivity, Completeness, Real-valued representation.
      *   *Fudged:* "Slightly better." In DT, $U(o_{i+1}) - U(o_i) = \epsilon$. But is $\epsilon$ constant? Does it sum?
      *   *No Counterpart:*
          *   *Primitive Normativity:* DT is functionalist/instrumental. "Betterness" without preference or choice is invisible to DT.
          *   *Incommensurability:* DT handles this via incompleteness (partial ordering), but the Spectrum Argument often assumes comparability ($A$ and $Z$ *are* comparable, just weirdly).
          *   *Covering vs. Leveling:* This is about the *structure* of the value space (e.g., multidimensional). DT collapses this to 1D utility.
          *   *Reductio vs. Construction:* DT wants a consistent $U$. Philosophy might want to show the *concept* of "betterness" is broken. DT sees this as "find a different $U$."

  6.  **Concrete Escapes & Lexicographic Utility (Section 3):**
      *   *Escapes:*
          1.  *Reject Transitivity:* Breaks EV maximization. Money pumps.
          2.  *Reject Small Steps:* Implies a discontinuity (threshold). Violates Continuity/Archimedean.
          3.  *Accept End:* Total Utilitarianism. $U = \sum u$.
          4.  *Non-Archimedean:* Lexicographic utility. $U = (u_1, u_2)$. $A$ wins on dimension 1, $Z$ on dimension 2.
      *   *Lexicographic Vulnerability:* If you already use lex utils for Pascal's Mugging (to avoid infinite utility swamping), you are *committed* to Non-Archimedean values. This actually *solves* the Spectrum Argument by denying the step-wise trade-off is valid at the limit. You can't trade quality for quantity once quality drops below a threshold.
