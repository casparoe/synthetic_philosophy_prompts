answer: |-
  The emergence of mathematical conjectures on forecasting platforms presents a philosophical puzzle because it imports the language of chance into a domain traditionally defined by necessity. When forecasters assign a probability to a statement like the Riemann Hypothesis, they are engaging in a practice that requires a careful reconstruction of what probability means in this context. The forecasters are correct to assert that the number expresses their own uncertainty rather than an objective propensity in the world, for there is no ensemble of universes in which a mathematical theorem is sometimes true and sometimes false. This forces the interpretation of the probability to be strictly epistemic, representing a degree of belief or a state of information rather than a feature of the mathematical reality itself. However, this reading is only stable if one distinguishes between the truth of the proposition and the event of its verification. If the market question asks merely whether a conjecture is true, the probability measures the forecaster's confidence in the existence of a proof, implicitly treating the current lack of a proof as a temporary state of ignorance. If the question asks whether the conjecture will be proved by a specific date, the object of the forecast shifts from the mathematical proposition to a historical and sociological event, namely the production and acceptance of a proof by the mathematical community within a timeframe. This shift resolves the ontological tension because the production of a proof is a contingent event subject to human effort, funding, and cognitive breakthroughs, even if the truth value of the theorem is not.

  Scoring forecasters against the eventual outcome of a proof treats the growth of mathematical knowledge as a contingent social process, and while this might seem to contradict the view of mathematics as discovery, it is a cost the practice can bear because it is pragmatic rather than metaphysical. The market does not need to resolve whether the theorem was true prior to the proof, only whether the community accepts the proof by the deadline. This effectively brackets the metaphysical status of the conjecture and focuses on the availability of information. The practice presupposes that the resolution criterion is clear enough to settle the bet, which means it relies on the social institution of mathematics to validate truth. This is not a flaw in the forecasting mechanism but a necessary adaptation to the nature of mathematical knowledge, which is accessible to humans only through derivation and verification. The cost is that the market cannot distinguish between a true statement that remains unproved and a false one, treating both as unresolved until the social process of verification concludes. This is bearable because the utility of the market lies in aggregating expectations about when knowledge will become available, not in adjudicating Platonic truth.

  The market rules that forbid pricing a claim above one of its logical consequences, treating violations as arbitrage, appear to presuppose that entailment is available for free, and this presupposition comes to the assumption of logical omniscience. In standard probability theory, a rational agent must assign probabilities that respect logical relations, such that the probability of a conjunction cannot exceed the probability of its constituents. However, in mathematics, determining entailment is often the very work that the forecasters are trying to predict. If the logical relationship between two statements is obscure, a forecaster might price them incoherently without realizing it. The market rules presuppose that these logical relations are either known or easily discoverable by participants acting as arbitrageurs. This is an idealization, as logical deduction in advanced mathematics is computationally expensive and cognitively demanding. The practice can be made coherent without assuming entailment is free only if one views the market as a dynamic process that corrects incoherence over time rather than requiring it instantaneously. The coherence relies on the efficiency of the crowd to spot logical inconsistencies and trade them away, effectively outsourcing the logical omniscience to the collective mechanism rather than demanding it of individual agents.

  Reconstructing the implicit theory reveals that the practice operates on a form of pragmatic instrumentalism where the validity of a probability is determined by its resilience against betting opponents rather than its correspondence to a metaphysical reality. What the practice strictly requires is that the probabilities satisfy the axioms of probability calculus to prevent Dutch books, and that the resolution conditions are unambiguous. What merely sits well with the practice, but is not required, is the belief that mathematical truths exist independently of proof. A forecaster could be a formalist who believes math is a game of symbols and still participate effectively by betting on which symbols will be derived next. The practice does not require a specific philosophy of mathematics, only a shared understanding of the resolution criteria. Furthermore, several incompatible views of probability would license exactly the same behavior in this market. A subjective Bayesian trading on personal confidence, a logical probabilist trading on the degree of confirmation given current evidence, and a frequentist trading on the historical frequency of similar conjectures being resolved within certain timeframes would all place similar bets if their assessments of the evidence converge. They disagree on what the number means, with the Bayesian seeing it as internal confidence, the logical probabilist as an objective relation between evidence and hypothesis, and the frequentist as a rate of occurrence in a reference class of proof attempts. Yet, because the market payout depends only on the binary outcome of proof or no proof, their trading behavior becomes indistinguishable. This convergence suggests that the practice is robust precisely because it does not depend on settling the philosophical nature of probability, but rather on harnessing the diverse cognitive strategies of participants to aggregate information about the trajectory of human discovery.
