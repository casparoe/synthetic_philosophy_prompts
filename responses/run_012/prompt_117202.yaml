prompt: |-
  Forecasting platforms and internal prediction markets now routinely post questions about mathematics alongside questions about elections and weather: whether a long-standing conjecture will be resolved by a given date, and sometimes simply whether the conjecture is true, scored by the same rules and defended with the same appeal to calibration. Asked what such a probability could mean, the forecasters I know say that mathematics is not a matter of chance, that a statement is true or false independently of anyone's opinion, and that the number they post is only an expression of their own uncertainty. What does the practice presuppose? If the probability is purely a degree of belief, is that reading stable when the thing being forecast is not an event in the world but a proof that may or may not ever be found, and when the platform's resolution criterion blurs the two by asking whether the theorem will have been proved by 2030? Does scoring forecasters against the eventual outcome treat the growth of mathematical knowledge as a contingent social process rather than a discovery, and is that a cost the practice can bear? And the market rules that forbid pricing a claim above one of its logical consequences, treating violations as arbitrage, appear to presuppose that entailment is available for free; say what that presupposition comes to and whether the practice can be made coherent without it. Reconstruct the implicit theory, separate what the practice strictly requires from what it merely sits well with, and identify where several incompatible views of probability would license exactly the same behavior. Answer in continuous prose, with no headings, bullet points, bold text, or tables.
