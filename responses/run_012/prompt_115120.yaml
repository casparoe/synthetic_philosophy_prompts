  Goal and setup
  The objective is to decouple scientific evidence from stratigraphic definition. Students often view the Anthropocene's start date as an empirical discovery waiting to be unearthed. This session reframes it as a procedural construction. Over 90 minutes, 18–24 students are divided into three committees. Each receives identical geological evidence but operates under distinct ratification rules. The pedagogical aim is to demonstrate that the "answer" shifts based on the voting mechanism, not the data. By forcing committees to plant a physical "golden spike" only if their chosen marker survives global correlation checks, you highlight the friction between human meaning and geological measurability. The session culminates in a debrief linking their struggle to the actual International Commission on Stratigraphy (ICS) processes, revealing that formalization is a political act of consensus-building rather than a mere acknowledgment of fact.

  Materials and evidence packet
  Provide each committee a folder containing five stratigraphic candidates: the 1610 Orbis Spike (CO2 dip from Indigenous population collapse); the 1780s Industrial Revolution inflection (carbon black); the 1945 Trinity test (radioisotopes); the mid-century Plutonium-239 peak (bomb tests); and the 1960s fallout radionuclide peak. Include two sediment core replicas (laminated plastic tubes or printed stratigraphic columns). Core A (North America) displays all markers clearly. Core B (Antarctica or remote Pacific) lacks the 1610 and 1780 signals entirely and shows delayed/smudged 1945 fallout. A "Golden Spike" token is provided, but rules state it only counts if the marker exists identically in both cores. A ballot sheet includes the option "No New Unit—Holocene continues."

  Roles and rules
  Assign four roles per committee: Chair (manages time and procedure), Scribe (records votes and rationale), Stratigrapher (interprets core data and proxy validity), and Skeptic (argues against formalization or specific dates). The critical variable is the ratification rule. Committee 1 requires Unanimity to plant the spike; any dissent forces "No New Unit." This simulates high-consensus bodies. Committee 2 operates by Simple Majority; the spike plants if 50%+1 agree, regardless of core correlation disputes. This simulates democratic but potentially flawed science. Committee 3 requires a Supermajority (2/3) plus approval from an Outside Body (the Instructor), who holds veto power if global correlation (Core B) is ignored. This mirrors the ICS hierarchy.

  All committees must answer two questions: 1) Is there a marker measurable globally? 2) Does our rule allow ratification? If Committee 2 chooses 1945 but ignores Core B's lack of signal, their spike is declared invalid during reporting. Committee 3's Outside Body veto simulates the higher-level ICS oversight. The "No New Unit" option is valid if evidence fails correlation or votes fail. Emphasize that the spike represents a Global Boundary Stratotype Section and Point (GSSP), requiring a physical horizon, not just a date. Students must physically place the token on the core image to finalize the decision. This tactile requirement slows down abstract voting, forcing engagement with the material constraint that many anthropogenic signals are not globally synchronous or preserved. The Skeptic's role is crucial: they must argue that the Holocene continues if the marker is not distinct enough. They should challenge the Stratigrapher on whether the signal is noise or data. This internal conflict ensures the voting rule is actually tested against the evidence, rather than students simply voting based on preference. The Chair must ensure the voting rule is followed strictly, recording not just the outcome but the margin. The Scribe must document the specific proxy chosen (e.g., Plutonium-239) rather than the event (e.g., Trinity Test), reinforcing the distinction between human history and geological record. The Outside Body for Committee 3 should not participate in deliberation but stands by to review the final proposal against the Core B constraint. This separation of powers highlights the bureaucratic layers in scientific ratification. If Committee 1 cannot agree, they must formally declare the Holocene continues, validating inaction as a procedural outcome. This prevents the activity from becoming a race to find a date, centering the difficulty of consensus itself.

  Run of play
  Minutes 0–10: Introduction. Frame the Anthropocene not as a fact but as a proposal. Distribute packets. Explain the Golden Spike mechanic clearly. Minutes 10–55: Committee Deliberation. Circulate among groups. Remind Committee 3 that you hold the veto. Prompt Committee 1 to seek consensus. Watch Committee 2 rush to vote. If a group ignores Core B, note it silently for the reveal. Encourage the Skeptic to speak first in Committee 1 to set a high bar. Minutes 55–75: Reporting. Each committee announces their date or "No Unit." Reveal validity based on Core B correlation. Typically, Committee 2 will pick a date that fails correlation; Committee 1 will deadlock; Committee 3 will be vetoed or compromise. Ask each group why they chose their rule's outcome. Minutes 75–90: Debrief. Discuss why the outcomes differed despite identical evidence. Highlight how procedural rules dictated the geological reality. Connect their deadlock to the real-world difficulty of defining human impacts in rock. Ask students how they feel about the "No Unit" outcome—does it negate the human impact? During circulation, if Committee 2 reaches a majority quickly, challenge them to defend the global correlation of their choice against Core B. For Committee 1, if they deadlock, ask if "No New Unit" is acceptable. Ensure the transition to Reporting is abrupt, simulating conference deadline pressure. When revealing Core B discrepancies, do so dramatically to emphasize the material constraint over social consensus. This shock moment reinforces the lesson that evidence limits procedure, even if procedure decides the outcome.

  Debrief
  Begin by mapping their experience to the Anthropocene Working Group (AWG). Like them, the AWG spent years selecting evidence (Plutonium-239 at Crawford Lake). However, like your committees, they faced ratification hurdles. Explain that stratigraphic boundaries require a Global Boundary Stratotype Section and Point (GSSP)—a "golden spike"—which demands a marker measurable worldwide, not just culturally significant. This is why the 1610 date often fails (not globally synchronous) and why even the 1950s plutonium signal faced scrutiny regarding preservation.

  Crucially, reveal the real-world outcome: In 2024, the Subcommission on Quaternary Stratigraphy voted down the AWG's proposal to formalize the Anthropocene. The evidence was accepted, but the procedure failed. The term "Anthropocene" remains culturally potent despite lacking stratigraphic status, mirroring your students' conviction that the epoch is "real" regardless of the spike. Use this to distinguish between scientific utility (chronostratigraphy) and cultural critique (the Anthropocene concept). The activity proves that the start date is not discovered but negotiated through rigid procedural constraints designed to protect the geological timescale from transient human definitions. Emphasize that the rejection was not a denial of human impact, but a protection of stratigraphic rigor. The "No New Unit" decision preserves the Holocene while acknowledging the data. This distinction allows students to separate political/scientific formalization from ontological reality. Finally, discuss the proxy vs. artifact distinction: geologists need isotopes, not events. The Trinity test is history; Plutonium-239 is stratigraphy. This nuance is often lost in public discourse but is central to the discipline's gatekeeping mechanisms. Ask students if the rejection diminishes the urgency of environmental action. Most will say no. Use this to cement the idea that the Anthropocene functions effectively as a cultural concept even without a golden spike. The procedure protects the past; the concept warns about the future.

  What will predictably go wrong the first time, and how to handle it
  Students will likely ignore Core B. They treat the evidence packet as truth rather than data requiring correlation. They may assume the 1945 signal is automatically global because they know it historically. To handle this, intervene during deliberation as the "Outside Body" for Committee 3, asking pointedly: "Is this visible in the Antarctic core?" For Committee 2, allow them to vote, but invalidate their spike publicly during reporting to demonstrate the consequence of ignoring correlation. Another issue is rapid consensus on "No New Unit." Push Skeptics to justify why the Holocene suffices. If Committee 1 deadlocks too early, prompt them to negotiate a compromise date rather than abandoning the task. Ensure the "No New Unit" option feels like a substantive geological claim, not a quit button. Students may also resent the veto power; frame it as institutional oversight rather than personal obstruction. If emotions rise, pause and remind them that real scientists face career stakes in these votes, raising the tension beyond the classroom.

  What this activity cannot reproduce and I must supply myself
  This simulation compresses decades of labor into 45 minutes. It cannot reproduce the actual fieldwork required to verify global correlation across hundreds of sites. It also simplifies the political hierarchy of the International Commission on Stratigraphy; the Instructor's veto is autocratic, whereas real ratification involves layered voting bodies with competing institutional interests. Finally, it cannot capture the deep-time perspective geologists hold; students view 1950 as "old," while stratigraphers view it as instantaneous. You must verbally supply this context, explaining that geological units usually last millions of years, making the hesitation to add a 70-year unit rational, not obstructive.
