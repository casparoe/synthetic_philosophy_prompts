answer: |-
  The established name for the genus of this phenomenon is **Reflexivity**. However, your description identifies a specific, volatile species of it that is often glossed over in casual usage. In the social sciences and philosophy of economics, the precise term for the layer you are describing — where the *knowledge* of the model alters the modelled reality through a chain of mutual expectations — is **Second-Order Reflexivity** (sometimes termed **Epistemic Reflexivity**).

  While "Reflexivity" is the umbrella term (championed by George Soros in finance and Anthony Giddens in sociology), it is frequently confused with simple feedback loops. To give you the "carving" you require, I shall define the boundaries of **Second-Order Reflexivity**, distinguish it from its neighbours, and explain why it denies you a stable point.

  ### The Carving: What Must Be True

  For a situation to count as Second-Order Reflexivity, three conditions must be met simultaneously. If one is missing, you are dealing with a different phenomenon.

  1.  **Accessibility:** The forecast or observation must be accessible to the subjects being forecast. If you keep your model secret, you have standard prediction. If they read it, you have entered the reflexive zone.
  2.  **Theory of Mind:** The subjects must not only react to the forecast, but reason about *your* reasoning. They must possess a model of you. As you noted, "they know that I know this." This creates a recursive loop of expectations (I think that you think that I think...).
  3.  **Constitutive Impact:** The reaction must not merely distort the *measurement* of the event, but alter the *nature* of the event itself. In your diary example, the writing does not just record the reason; it becomes part of the reason. The ontology of the situation changes.

  ### The Edges: Distinguishing from Neighbours

  You mentioned that this feels deeper than a self-fulfilling prophecy or an observer effect. You are correct. Here is how you must draw the edges to keep the concept clean.

  **1. Versus Self-Fulfilling Prophecy**
  *   **The Confusion:** Both involve a prediction influencing an outcome.
  *   **The Edge:** A self-fulfilling prophecy is linear and teleological: *Prediction → Action → Outcome matches Prediction.* It aims for convergence.
  *   **Second-Order Reflexivity:** This is recursive and often divergent. The subjects may act to *defeat* the prediction because they know it is a prediction. The outcome does not need to match the forecast; the forecast merely needs to be a causal factor in the outcome. When you try to model this, you are not aiming for a match, but for a moving target that moves *because* you are aiming.

  **2. Versus The Observer Effect (Heisenberg)**
  *   **The Confusion:** Both involve the act of observation disturbing the system.
  *   **The Edge:** The physical Observer Effect is unintentional and mechanical (e.g., photons hitting an electron). It is a "clumsy hands" problem.
  *   **Second-Order Reflexivity:** This is semantic and strategic. The disturbance is caused by *meaning*, not physical intrusion. The subjects are not disturbed because you are looking; they are disturbed because they understand *what you see*.

  **3. Versus Goodhart's Law**
  *   **The Confusion:** Both involve metrics failing when they become targets.
  *   **The Edge:** Goodhart's Law is about *gaming a metric*. It assumes the underlying reality stays the same, but the proxy breaks (e.g., call centre staff hanging up to meet call-volume targets).
  *   **Second-Order Reflexivity:** This is about *shifting the reality*. In your diary example, you are not gaming a metric; you are altering your own psychology. In your forecasting, the organisation's behaviour fundamentally changes, not just the reporting of it.

  **4. Versus The Lucas Critique**
  *   **The Confusion:** Both deal with economic forecasting failing due to policy changes.
  *   **The Edge:** The Lucas Critique is a specific macroeconomic argument that parameters in econometric models will change when policy changes. It is a subset of reflexivity.
  *   **Second-Order Reflexivity:** This is broader. It applies to psychology (the diary), individual resolutions, and organisational behaviour, not just macroeconomic parameters.

  ### The "No Stable Point" Problem

  You wrote: *"the more complete the model becomes, the less there is a stable point to aim at."*

  This is the hallmark of **Reflexive Indeterminacy**. In game theory, this resembles the problem of **Common Knowledge of Rationality**. If all agents are perfectly rational, and all know that all are rational, and all know the model being used, there may be no unique equilibrium.

  *   **First-Order Reflexivity** often finds a stable point (e.g., a self-fulfilling prophecy settles into a new normal).
  *   **Second-Order Reflexivity** often creates an infinite regress. If you adjust your forecast to account for their discounting, they may adjust their discounting to account for your adjustment.

  This is not a failure of your modelling skill; it is a property of the system. In cybernetics, this is known as the problem of the **Observer Observing Themselves**. You cannot stand outside the system to model it, because you are inside the system you are modelling.

  ### Summary for Your Work

  If you need to label this in your organisation to manage expectations, I recommend using **Second-Order Reflexivity**.

  *   **Use it when:** The actors are sophisticated, they have access to your work, and their goals may diverge from the forecast's accuracy.
  *   **Do not use it when:** The forecast is secret, or the subjects are incapable of strategic reasoning (e.g., weather forecasting, or forecasting the behaviour of a machine).
  *   **The Boundary:** The moment the forecast becomes a *tool* for the subjects rather than a *picture* for the planners, you have crossed the edge into reflexivity.

  **A Note on the Diary**
  Your friend's experience is precisely what the sociologist Anthony Giddens called the **Double Hermeneutic**. In natural science, the atoms do not read the physics textbook. In social science (and self-reflection), the subjects interpret the theory, and that interpretation changes the subject.

  ### Conclusion

  The name is **Reflexivity**, specifically **Second-Order Reflexivity**.

  It covers cases where knowledge of the model feeds back into the system *through the strategic reasoning of the agents*. Its edges are defined by the presence of *meaning* and *mutual knowledge*, distinguishing it from the physical disturbance of the Observer Effect or the linear causality of the Self-Fulfilling Prophecy. The lack of a stable point is not an error in your work; it is the signature of the phenomenon. You are attempting to find equilibrium in a system that is constitutively disequilibrated by your own presence.
