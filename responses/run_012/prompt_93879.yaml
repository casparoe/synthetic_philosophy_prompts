  2. Carry the session with your husband/wife case, but you must describe the visual experience (contrast, sharpness, color) rather than the emotional meaning, otherwise you invite the interpretation objection.
  3. Cut the Müller-Lyer because it proves impenetrability, and cut the Coin study because the replication crisis will let the psych students derail the room into methodology instead of philosophy.
  4. Head off "it's just attention" during the initial distinction, head off "it's just judgment" when analyzing your example, and head off "relativism" only after the claim is secured.
  5. Ask "If his belief vanished instantly, would the face look different, or would he just think differently about the same look?" to test the experiential claim, refuse to cover neural mechanisms or expertise cases, and state clearly that the conceptual framework is settled but the phenomenon's existence is live.
