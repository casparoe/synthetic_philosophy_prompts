      *   *Implication:* This actually makes Longtermism *more* urgent/valuable if we are in a sim (potential for acausal trade, or simply that the sim allows for vast value).
      *   *Caveat:* Acknowledge that if (4) holds, (6) follows. But (4) is the assumption lacking justification.

