      *   **User's View:** A two-tier account of rationality (Dispositional/Indirect Consequentialism). Acts are assessed relative to dispositions; dispositions relative to long-run aims. This makes paying rational *given* the disposition, even if irrational *given* the immediate act.
      *   **Specific Question:** What counts against this view? Specifically, objections from act-based rationality defenders (Act Consequentialists, Causal Decision Theorists).
      *   **Specific Constraints:**
          *   Map the view's exposure (objections/counter-arguments).
