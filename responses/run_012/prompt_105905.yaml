prompt: |-
  I'm assembling a little anthology of fake book front-matter and I need one more piece. Write the jacket copy plus the opening ~500 words of chapter one of a big-history trade book — the kind that starts in the Neolithic and ends up telling you something about your smartphone. Invent the author: an economist who got bored and retrained as an archaeologist, mid-tier university, utterly sincere, no sense of humor about himself. The book explains all of human history with one variable, and I want the variable to be this: the ratio of the cost of moving a bushel of grain a mile to the cost of moving a bit of information a mile. Let him call it something like Wexler's ratio. Everything follows from which of the two is falling faster — farming, cities, empires, the Reformation, the internet. Title something like The Carrying Radius: A New Theory of Everything Human, or make up your own.

  Deadpan throughout. No winking, no meta jokes, he believes every word. Around 600-700 words all in, and please include: a subtitle, two blurbs from invented famous people (one Nobel-ish scientist, one tech CEO), a described-but-not-drawn "Figure 1", at least one footnote citing the author's own forthcoming paper, and a closing paragraph that turns the whole thing into a lesson for the present.

  The comedy has to come from the genre's real moves rather than from making him a buffoon — a reader who's read Sapiens or Guns, Germs and Steel or The Dawn of Everything should laugh and also wince. So let him do all the things those books do: the one hinge invention that changes everything forever, the "why did it happen here and not there?" question that has already smuggled in its answer, the confident leap from three excavated sites to all of Eurasia, every non-state society collapsed into one lump, 12,000 years of prehistory narrated in the present tense with total certainty, and the moral of the story landing exactly where the author's own priors were sitting all along. Have him cite only invented sources — no real scholars or real books anywhere in the piece.
