      Then, the donkey is domesticated.

      Most historians cite the plow as the engine of civilization. They are mistaken. The plow increases surplus, but the donkey decreases the denominator of Wexler's Ratio. Suddenly, the bushel moves cheaper than the message. When grain becomes cheaper to transport than information, centralization becomes inevitable. A chieftain can now feed a standing army without knowing their names. The city is not a cultural invention; it is a logistical necessity born of inverted transport costs.

      [Figure 1: A logarithmic chart showing the cost per mile of grain transport (solid line) declining sharply around 6000 BCE, crossing below the cost of information transport (dashed line), remaining stable until the printing press.]

      This crossover point explains the uniformity of the Uruk period. Excavations at Tell Brak and Susa reveal identical administrative seals. Conventional archaeology attributes this to shared culture. ^2 In reality, it is shared friction. When the cost of moving grain drops below the cost of verifying information, bureaucracy collapses into standardization. The seal is not art; it is a compression algorithm for trust.

      We see this pattern repeat. The Roman road network does not exist to move legions; it exists to lower the grain coefficient. The fall of Rome occurs not when the barbarians arrive, but when the maintenance cost of the roads pushes the grain coefficient back above the information coefficient. Local warlords become more efficient than the central emperor because their radius of carrying is smaller.

      This brings us to the present anomaly. For the first time in six millennia, the ratio has flipped violently. The cost of moving a bit of information has approached zero, while the cost of moving grain has risen due to energy constraints. We are living in the second inversion. The smartphone in your pocket is not a communication device; it is a signal that the carrying radius of information has exceeded the carrying radius of calories. We are returning to the Neolithic condition, but with global reach. The lesson is clear: when information outruns sustenance, civilizations do not expand. They fragment. We are not building a global village. We are building a million isolated silos, connected by fiber optics but starved of shared reality. The friction is gone, and so is the empire.

      ^1 Wexler, A. (2024). "Caloric Drag Coefficients in Pre-Pottery Neolithic A." *Journal of Econo-Archaeology* (forthcoming).
      ^2 Varnes, L. & Kroll, H. (1998). *The Seal and the Soul*. Oxford University Press.

