      Why did cities emerge in Mesopotamia and not the Amazon? Why did the Reformation fracture Europe while the Ming Dynasty consolidated China? In *The Carrying Radius*, economist-turned-archaeologist Arthur Wexler proposes a single variable that dictates the fate of civilizations: Wexler's Ratio. This is the cost of moving a bushel of grain one mile versus the cost of moving a bit of information one mile. When grain moves cheaper than information, empires rise. When information moves cheaper than grain, markets dominate. Tracing humanity from the Neolithic to the Cloud, Wexler demonstrates that every war, religion, and economic collapse is merely a fluctuation in transport friction.

