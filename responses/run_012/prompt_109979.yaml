answer: |-
  Good evening. Thank you for the steak. It's a good steak, and I intend to eat it. I mention that because I see some friends here who don't eat meat, and some friends here who raise it, and I'm standing between you with a fork in my hand. I'm not going to apologize for the meal, and I'm not going to preach about it. I've spent thirty-five years on my hands and knees in clover and cornfields counting insects, and if there's one thing that life teaches you, it's that everything eats something else. The question is just how we count the cost.

  I've been reading a bit of philosophy since I retired. Mostly I try to avoid it—it gives me a headache—but lately, I've been thinking about how we do the arithmetic of our dinner plates. Usually, the math seems straightforward. If you care about the number of animals killed to feed you, beef looks like the better choice compared to chicken. To get a thousand calories of beef, you kill a fraction of one cow. To get a thousand calories of chicken, you kill several birds. One big death versus many small deaths. If you're keeping score of individual lives, the chicken adds up faster. That's the first way of counting.

  But there's a second way of counting, the one I used to do for a living. This isn't about the animal on the plate; it's about the ground it took to grow them.

  Beef, especially grass-fed, takes a lot of land. Far more than pork or chicken. A steer needs acres of pasture to graze over a couple of years. A chicken needs a cage and some grain for a couple of months. Now, land isn't empty. Even pasture, even a quiet meadow, is full of life. Voles, mice, ground-nesting birds, and billions of insects.

  When we manage land for food, whether we're mowing hay for cattle or plowing corn for chickens, creatures die. They get chewed up in the mower, buried by the plow, or they starve because their habitat is gone. Because beef requires so much more land per calorie, it casts a wider net over the landscape. You might save the cow, but you're asking more acres to do the work of feeding you. And every acre you touch takes a toll on the wild animals living there.

  So here is the collision. If you count domestic deaths, chicken looks worse. If you count wild habitat disruption, beef looks worse.

  I call this the Inversion. It means that depending on which ledger you open, the "ethical" meal flips over. If you think a mouse matters less than a cow, beef wins. If you think a mouse matters as much as a cow, or if you think an acre of insects matters at all, the math gets very shaky very quickly.

  And then there's the question of the insects. I'm an insect man. I know they don't have faces like we do, but they have lives. They flee, they reproduce, they suffer damage. If invertebrates count for anything in your moral sum, the land-heavy diet of beef becomes incredibly expensive. A single acre of pasture holds more individual lives than I can count in a lifetime. If those lives have weight, then the steak on my plate tonight is heavier than it looks.

  Now, I could stand here and try to solve this for you. I could tell you to eat this, or stop eating that. But I won't. Because when I run the numbers both ways, nothing clean survives the inversion. There is no slogan that fits in a pocket. You cannot eat without participating in death, whether it's the death of the thing you eat or the death of the things that lived where you grew it.

  The cattle families here know the land better than anyone. You keep this county from being subdivided into parking lots. That matters. The vegetarians here hold a mirror up to us, reminding us that the cost is real. That matters too. But neither side has a monopoly on being harmless, because being harmless isn't an option for a living thing.

  So, if there is no clean answer, is there at least a question worth asking? I think there is. And it's a question that doesn't belong in a philosophy book. It belongs in the field.

  The whole thing turns on a piece of empirical data that we don't actually have. We know how many calories a cow yields. We know how many acres it needs. But we don't know, with any precision, what lives in those acres compared to the acres needed for grain.

  Here is the question: **What is the density of sentient life in a managed pasture versus a managed cropland, and what is the mortality rate of that life during harvest?**

  That is a season's worth of fieldwork. You take a quadrat, you count the voles, the bees, the beetles, the larvae in the soil. You measure the mortality when the mower goes through versus when the combine goes through. If we knew that number—if we knew exactly how many wild lives are displaced per calorie of beef versus per calorie of grain—the inversion might resolve itself. Or it might get more complicated. But right now, we are arguing over a sum where half the variables are guesses.

  I'm seventy-one. I don't have another season in me to count the beetles. But some of you at the university do. And some of you ranchers know where the voles nest better than any professor.

  Until we have that count, we are eating in the dark. And perhaps that's the only honest conclusion. We are eating in the dark, we are all complicit, and the only thing we can control is whether we acknowledge the weight of it.

  So, I'll eat my beef. I'll respect the cow, and I'll respect the field it grazed. And I hope you'll all join me in holding the question, even if we can't answer it. Because the moment we think we have the perfect answer is the moment we stop counting the cost.

  Thank you.
