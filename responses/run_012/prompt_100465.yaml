answer: |-
  **Exam Question**

  **Course:** HPS 450 – Theory Change and Scientific Status
  **Time:** 90 Minutes
  **Value:** 25 Marks

  **Question 1:**
  Historians of science often defend failed predictions by invoking the "long-run alibi": the claim that a theory was not falsified, but merely "right but early." In the case of Malthus, this defense suggests the population principle remains a valid tendency claim, temporarily suspended by countervailing forces.

  Critically evaluate the epistemic status of this defense. Does categorizing Malthus's principle as a "tendency" rescue it as a progressive research programme, or does it render the theory unfalsifiable? In your analysis, distinguish carefully between the claim that the mechanism is *delayed* versus the claim that the system has undergone a *regime shift* (i.e., that the theory was accurate for the pre-industrial world but structurally obsolete thereafter). Conclude by specifying what empirical condition, if any, could genuinely falsify the Malthusian principle under this defended formulation.

  ***

  **Model Answer**

  The "long-run alibi" is the strategic retreat of a theory whose predictions fail to materialize within the expected timeframe. In Malthus's case, defenders argue the population principle is a tendency claim: population *tends* to outstrip subsistence, but positive and preventive checks (or moral restraint) may delay the crunch. To evaluate this, we must first clarify what Malthus actually claimed. It is a caricature to treat his theory as a naive doom prophecy. Malthus explicitly built escape hatches into the system via preventive checks and moral restraint. Therefore, the mere fact that population grew without universal starvation is not a clean falsification; the theory predicts that if restraint occurs, the crisis is averted. The empirical content lies not in inevitable collapse, but in the pressure exerted on subsistence limits.

  However, this flexibility invites a Lakatosian critique. Is the Malthusian research programme progressive or degenerating? A progressive programme predicts novel facts; a degenerating one merely accommodates anomalies via ad hoc adjustments. If every counterexample (e.g., rising living standards alongside population growth) is met with the claim that "countervailing forces are temporarily holding off the mechanism," the hard core is being protected by an increasingly complex protective belt. This risks rendering the theory unfalsifiable. If the mechanism is always "latent," waiting for the right conditions that never arrive, the claim loses empirical bite. The "tendency" defense becomes a metaphysical assertion rather than a scientific hypothesis if no timeframe or threshold is specified for the tendency to manifest.

  This brings us to the crucial distinction between "right but early" and "regime shift." The "right but early" defense assumes the mechanism remains valid and will eventually bite (the Lakatosian tendency). The "regime shift" hypothesis suggests something distinct: that Malthus was right about the *past* (pre-industrial agrarian economies) but wrong about the *future* because the underlying parameters of the system changed fundamentally. This is not merely parameter drift (where numbers change but the equation holds); it is a change in the equation itself. The Industrial Revolution did not just delay the Malthusian trap; it decoupled population growth from subsistence constraints through technological innovation rates exceeding demographic rates. If this is true, Malthus was not "early"; he was locally accurate but globally obsolete.

  Distinguishing these is vital for scientific status. If Malthus is "early," the theory survives but risks unfalsifiability. If he suffered a regime shift, the theory is falsified as a universal principle but retained as a historical model of a specific economic regime. The "long-run alibi" collapses if we accept that structural changes can permanently negate a mechanism rather than temporarily suppress it.

  Finally, what would falsify the defended principle? If the claim is merely that population *can* outstrip subsistence, it is tautological and unfalsifiable. To be scientific, the principle must specify conditions under which the checks *fail* to operate. A genuine falsification would require demonstrating a sustained period where population grows exponentially while subsistence grows linearly (or stagnates), yet living standards do not fall due to the absence of checks. If no such condition exists because the theory always posits a hidden check or a future collapse, it has exited the realm of empirical science. The "long-run alibi" saves the theory from refutation only by sacrificing its predictive power.

  ***

  **Marking Scheme**

  | **Criteria** | **Marks** | **How Candidates Typically Blow It** |
  | :--- | :---: | :--- |
  | **1. Malthusian Mechanics:** Correctly identifies that Malthus included preventive checks/moral restraint, meaning starvation is not the only predicted outcome. | 5 | Treat Malthus as a naive "doomsayer" and argue he was falsified simply because people didn't starve. |
  | **2. Lakatosian Analysis:** Applies Lakatos (progressive vs. degenerating) to the "tendency" defense, noting the risk of ad hoc protective belts. | 5 | Name-drop Lakatos without applying the hard core/protective belt distinction to the "tendency" claim. |
  | **3. Regime vs. Early:** Clearly distinguishes "delayed mechanism" (early) from "structural obsolescence" (regime shift/right about past). | 5 | Conflate "parameters drifting" with "regime change," or fail to see this as a distinct epistemic category from (a/b/c). |
  | **4. Unfalsifiability Risk:** Articulates how the "long-run alibi" risks making the theory metaphysical/unfalsifiable if no threshold for manifestation is set. | 5 | Argue that "tendency claims" are automatically scientific without addressing the timeframe problem. |
  | **5. Falsification Condition:** Proposes a specific empirical condition that would falsify the principle (e.g., sustained growth without checks). | 5 | Claim the theory is "just a model" or "philosophy" to avoid defining falsification conditions. |
  | **Total** | **25** | |
