prompt: |-
  Alright, so I lost most of an evening to a fight about Malthus and now I have to turn that fight into the final for my history and philosophy of science seminar, so I figured I'd just get you to do the whole thing.

  Background, because the exam has to be about this and not about the usual stuff. I said Malthus is the textbook case of a theory that gets falsified and then rescued forever — the population bomb never went off, everyone adds an epicycle, done. My friend (she's a historian of science, annoyingly) said I had it backwards: he wasn't rescued, he was just early. Then she said the thing that's still bugging me. She said "right but early" is never a real epistemic status on its own — it always collapses into one of three boring moves. Either (a) the parameters drifted, i.e. the numbers changed but the mechanism is untouched; or (b) the mechanism is still there but temporarily held off by countervailing forces, so it'll bite eventually; or (c) the original claim was only ever about a restricted domain and we were reading it too wide. She called that the long-run alibi and dared me to find a case where "right but early" is genuinely a fourth thing. I couldn't, and it's definately eating me.

  So: write me the exam question, a model answer of about 650 words, and a marking scheme. It's for a 90-minute final, upper-level, worth 25 marks, and it should make them do the work on exactly that dispute — was Malthus's principle falsified, and does "right but early" get him off the hook, or is the long-run alibi just unfalsifiability with a nicer name.

  Things I want the question to force, and that a top answer has to have (but the question itself shouldn't spell all this out — that's the whole point):

  - Malthus's model isn't a naive doom prophecy; it has positive and preventive checks and moral restraint built in, so "population grew and nobody starved" is not by itself a clean falsification. They should have to notice that the thing I was calling falsified is partly what the theory itself predicts as an escape hatch.
  - The tendency / mechanism-suspension defence (move b) is the crux. Is a tendency claim that survives every counterexample a legitimate progressive move or a degenerating one? They should bring Lakatos in and then say where Lakatos doesn't settle it.
  - The sneaky one: the possibility that Malthus wasn't early but late — that the principle is a decent description of the pre-industrial world and the world then left the regime, which is neither (a) nor (b) nor (c), and which is also not a vindication of the prediction. I want to see whether they can see that "right about the past, wrong about the future" is a seperate thing from "right but early," and say which one Malthus actually is.
  - What would even count as falsifying the principle, and whether that question is well-posed in the first place.

  Please don't let the question be answerable by reciting Popper on falsification or the standard "he didn't foresee the Industrial Revolution" line — that's the entire reason I'm doing it this way. Marking scheme: five must-hit points, marks for each, total 25, and for each one a one-line note on how candidates typically blow it.
