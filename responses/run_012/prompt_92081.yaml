      *   The Menu (numbered items with Claim, Verdict, Student License).
      *   Synthesis/Collapse: Point out where students conflate these.
      *   Hume's Actual Position: Contrast the student caricature with the text.
      *   The Student's Actual Position: Identify the ideological shortcut they are taking.

  7.  **Drafting the Content (Self-Correction during drafting):**
