      *   *Crucial Insight:* The slogan "Trust but Verify" is actually misleading here. If you suspect misalignment, you don't "Trust." You "Suspect and Verify." The use of "Trust" implies a baseline of safety that justifies the *use*, while "Verify" justifies the *monitor*.
