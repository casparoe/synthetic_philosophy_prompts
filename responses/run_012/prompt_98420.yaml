      *   *Thesis 5 (Strong/Control):* Verification can scale indefinitely against capability gaps.
          *   *Formulation:* A weaker model can reliably verify a stronger model's actions indefinitely.
          *   *Evaluation:* Likely False. This is the core "alignment tax" or "superalignment" problem.

  4.  **Refining the Theses for Precision:**
      *   Need to make sure they map onto the "Trust" part and the "Verify" part.
