      *   *Actually, the most common usage in AI Safety:* It's often used to mean "Use the model (Trust) but check outputs (Verify)." This implies the risk is low enough to use it.
      *   *Let's capture this ambiguity in the theses.*
      *   *Thesis 1:* Trust = Use. Verify = Check. (Trivial).
