      *   *The Corporate Analogy:* Corporations are fictional persons, but the liability ultimately lands on *human* pockets (shareholders, directors, insurance). Giving AI personhood doesn't solve the "who pays/who suffers" problem unless the AI has assets. If the AI has assets, who put them there? Humans. So the buck still stops with humans.
      *   *Moral Agency vs. Legal Personhood:* The user conflates these. You can have legal personhood without moral agency (e.g., infants, corporations, ships in admiralty law sometimes). But does that solve the *ethical* problem or just the *legal* accounting problem?
      *   *The "Black Box" Excuse:* The argument relies on the system being truly opaque/unforeseeable. But in engineering, "unforeseeable" is often a failure of testing/validation regimes, not metaphysical impossibility.
      *   *Strict Liability:* The user assumes fault-based liability is the only model. Tort law has strict liability for ultra-hazardous activities. You don't need to foresee the specific crash to be liable for deploying a dangerous machine.

