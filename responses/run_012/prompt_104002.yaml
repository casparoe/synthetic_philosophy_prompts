answer: |-
  There is no established term for this specific rhetorical maneuver, so I propose calling it **The Regenerative Dualism**.

  This phenomenon is distinct from **Dual Labor Market Theory**, which describes the structural segmentation of workers into primary (high wage, secure) and secondary (low wage, insecure) sectors but does not account for the specific ideological flip where the *same* instrumental logic yields opposite policy outcomes. It also differs from **Human Capital Theory**, which explains why firms invest in some workers over others based on return on investment, but treats that valuation as a neutral economic calculation rather than a contested rhetorical move where the definition of "investment" itself shifts. The **Protestant Work Ethic** and **Deservingness Theory** fall short because they rely on moral judgments about the worker's character or virtue, whereas your observation concerns a purely instrumental calculation (productivity/safety) that is applied inconsistently based on status. **The Regenerative Dualism** specifically names the process where the capacity for human recovery is framed as "maintenance" (a necessary cost of preserving valuable assets) for high-status workers, and as "idle time" (a deductible cost of expendable inputs) for low-status workers, despite both groups citing the same physiological need for safety and performance.

  The boundary of this concept is drawn at the point where the justification for rest ceases to be instrumental and becomes rights-based. If the argument shifts to "rest is a human right regardless of output," the dualism collapses because the premise is no longer contingent on productivity. Edge cases that sit on the boundary include **adjunct versus tenured faculty**, where tenured professors are granted sabbaticals as investment in their scholarship while adjuncts are denied breaks between classes as a cost-saving measure, and **pilots versus ground crew**, where pilot rest is federally mandated as a safety investment while baggage handler rest is negotiated as a contractual cost. A more ambiguous case is the **gig economy**, where rest is neither granted nor denied but simply unpaid, representing a third category outside the dualism where the worker absorbs the cost of regeneration entirely themselves.

  My carving is most likely to be wrong if the differentiation is driven by **Asset Specificity** rather than class status. If the determining factor is not whether the worker is salaried or hourly, but how difficult and expensive they are to replace (e.g., a highly specialized hourly contractor versus a generic salaried manager), then **The Regenerative Dualism** misidentifies the mechanism as class-based when it is actually based on **replaceability**. Similarly, if the distinction is driven by **Liability Exposure**—where rest is granted to those whose errors carry high legal risk (surgeons) rather than those whose errors carry low risk (cleaners)—then the phenomenon is better classified as **Risk-Based Allocation** rather than a dualism of regeneration. If future examples show that high-status workers are denied rest when their liability is low, or low-status workers are granted rest when their replaceability is low, the definition would need to be revised to center on **economic leverage** rather than the rhetorical treatment of rest itself.
