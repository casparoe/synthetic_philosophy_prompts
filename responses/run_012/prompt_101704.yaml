answer: |-
  **MEMORANDUM**

  **TO:** The University Senate
  **FROM:** Committee on Institutional Voice
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Resolution 23-14 (Benefactor Naming)

  **Recommendation**
  The Committee on Institutional Voice recommends that the Senate **amend** Resolution 23-14 before adoption. We advise against adopting the resolution as drafted, but we also advise against declining to act. The resolution should be revised to specify the *respect* in which the historical claim holds true, thereby converting a dogmatic assertion into a valid partial standpoint. We recommend the amended text be circulated by November 10 for a vote at the December Senate meeting.

  **Reasoning: *Naya* vs. *Nayābhāsa***
  The current debate on this committee has stalled between two positions: one arguing for a "many-sided" softening of the text, and the other rightly warning that this amounts to relativism that abdicates moral judgment. Both positions rely on a debased understanding of *anekāntavāda* (the doctrine of many-sidedness). To resolve this, we must distinguish between *pramāṇa* (comprehensive knowledge of a substance in all its modes) and *naya* (a partial standpoint that is genuinely valid within its scope).

  Finite institutions cannot possess *pramāṇa*. We cannot know the benefactor's legacy in its totality. However, we can possess valid *nayas*. The danger arises when a *naya* is absolutized—when a partial truth claims to be the whole truth. In Jain logic, this error is *nayābhāsa* (a false standpoint).

  The resolution as drafted states: *"The benefactor's philanthropy was inseparable from the exploitative labor regime that generated his fortune."* Presented without qualification, this claim mimics *pramāṇa*. It asserts an unconditioned identity. While historically robust, it ignores other valid *nayas*: for example, the standpoint of the beneficiaries who received education independent of the labor source, or the standpoint of the benefactor's intent versus the structural outcome. By ignoring these, the draft risks *nayābhāsa*. It invites rejection not because it is false, but because it is epistemically arrogant. An amended resolution that specifies the *respect* in which the claim holds retains the moral force of the *naya* without the metaphysical overreach.

  **Application of the Sevenfold Predication (*Saptabhaṅgī*)**
  To demonstrate why the draft is defective and how amendment repairs it, we apply the sevenfold predication to the disputed sentence: *"The philanthropy was inseparable from the exploitative regime."*

  1.  **Syād asti (In some respect, it is):** Valid. In the respect of *capital formation*, the funds were derived from the regime.
  2.  **Syād nāsti (In some respect, it is not):** Valid. In the respect of *institutional function*, the university operated with a mission distinct from the labor regime.
  3.  **Syād asti nāsti (In some respect, it is and is not):** Valid. The philanthropy is materially inseparable but functionally distinct.
  4.  **Syād avaktavyaḥ (In some respect, it is indescribable):** Valid. The moral weight of this entanglement exceeds simple binary categorization.
  5.  **Syād asti avaktavyaḥ (In some respect, it is and is indescribable):** Valid. The connection exists but resists full articulation in policy language.
  6.  **Syād nāsti avaktavyaḥ (In some respect, it is not and is indescribable):** Valid. The separation is felt but hard to define.
  7.  **Syād asti nāsti avaktavyaḥ (In some respect, it is, is not, and is indescribable):** This is the comprehensive view.

  The unamended resolution corresponds to **Mode 1 (*Syād asti*) presented as absolute**. It asserts "It is" without the "In some respect" (*syāt*). This is the defect. It collapses the complexity of Mode 7 into the simplicity of Mode 1.

  Does amending the text to acknowledge Mode 1 *as* Mode 1 make the resolution uninformative? No. By explicitly stating the respect (e.g., *"In the respect of historical capital formation..."*), we anchor the *naya*. We do not dilute the claim; we locate it. This allows the Senate to act on the truth of Mode 1 (justifying renaming) without denying the truth of Mode 2 (preserving the university's distinct mission).

  **The Epistemic Limitation**
  We must confront the hardest structural problem. In Jain tradition, the coordination of these seven modes relies on *kevala-jñāna* (omniscience). Only an omniscient being can perfectly verify how these standpoints fit together. This committee is not omniscient, nor does the university hold religious authority.

  If we claim the sevenfold method guarantees truth, we are lying. However, the method survives without the premise of omniscience if treated as a **methodological ethic** rather than a metaphysical guarantee. We are not claiming to coordinate the modes from a God's-eye view. We are acknowledging that *we cannot coordinate them*. Therefore, we must choose the *naya* that best serves justice, while explicitly admitting its partiality. This prevents the institution from idolizing its own verdict. We act on the "inseparability" *naya* because it is the ethically salient one for a question of naming, not because it is the only truth that exists.

  **The Case Against This Recommendation**
  We owe the Senate an honest account of the strongest objections to this approach.

  *First, the Objection of Evasion.* Critics argue that *anekāntavāda*-style scoping is a technique for laundering evasion. It allows an institution to appear to speak while committing to nothing. A body asked to judge complicity owes a verdict, not a set of qualified predications. If the building is to be renamed, the Senate should say the benefactor was complicit, full stop. Qualifying the statement with "in some respect" may look like cowardice—a way to avoid the pain of a clean moral cut.
  *Response:* This objection conflates *qualification* with *hesitation*. We are recommending a clean verdict (rename) based on a specific *naya*. The qualification is not about the *action* (which is decisive) but about the *description of reality*. We avoid evasion by ensuring the qualification does not weaken the imperative. The amendment will read: *"Because, in the respect of capital formation, the philanthropy was inseparable..."* The action remains absolute; only the ontological claim is scoped.

  *Second, the Objection of Illicit Import.* This is a secular deliberative body. Importing a metaphysical doctrine with soteriological commitments (liberation from karma) is illicit, even if the conclusions are acceptable. We are not a Jain *sangha*.
  *Response:* We are not importing the soteriology. We are importing a logic of pluralism that predates its religious codification. The structure of "valid partial standpoints" is compatible with secular fallibilism. However, if the Senate finds the terminology too esoteric, the *substance* of the recommendation stands without the Sanskrit labels: The Senate should assert the historical claim within its specific evidentiary bounds, not as a totalizing metaphysical identity.

  **Conclusion**
  The draft resolution fails because it mistakes a valid *naya* for *pramāṇa*, risking *nayābhāsa*. The objection that we should simply issue a verdict ignores the danger of institutional dogmatism. The objection that we are importing religious metaphysics is met by stripping the method to its logical core.

  We recommend the Senate amend the resolution to specify the historical respect in which the inseparability claim holds. This allows the university to take a moral stand without claiming omniscience. We request the administration draft the amended language by November 10 for inclusion in the December Senate packet.

  Respectfully submitted,

  The Committee on Institutional Voice
