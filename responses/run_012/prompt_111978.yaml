      *   *Vulnerability:* The "Practical Mode" often functions as a get-out-of-jail-free card. If it's non-discursive, how is it propositional? If it's propositional, why can't it be spoken? How is it different from just having a disposition?

  3.  **Drafting Strategy - The Arc of the Interview:**
