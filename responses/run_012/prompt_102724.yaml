prompt: |-
  Okay so I want a short story. The hook: psychiatric diagnoses don't just describe people, they kind of remake them, and then the remade people push back and remake the diagnosis. I'm pretty sure Ian Hacking had a name for this -- looping effects? interactive kinds? -- anyway, that's the thing I mean.

  Invent a diagnosis for the story (don't use a real one), and show it getting into the manual. First the experts define it from the top down; then people start getting labeled and, surprise, start fitting the label; then the experts quietly rewrite the criteria because the real patients stopped matching the original picture; then the patients themselves organize and demand a different definition, one built from the ground up. I want at least two full turns of that loop, and I want to follow one person (or one family) across both turns so we can watch them change. End without telling me whether the category was ever tracking something real or whether the loop is the whole story. Under 1500 words, please.

  After the story, a short note: where you took liberties with the actual idea, how confident you are that the overall picture matches how this is usually understood, and the one bit your least sure about.
reasoning: |-
  Thinking Process:

