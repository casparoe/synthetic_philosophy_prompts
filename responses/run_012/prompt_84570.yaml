  ### The Mapping

  To audit the analogy, we align institutional features. The table maps structural components to reveal where the parallel holds and diverges. Note the divergence in authority and representation.

  | Feature | Jury Duty | Citizens' Assembly |
  | :--- | :--- | :--- |
  | **Selection** | Random from voter/DMV rolls; voir dire removes bias explicitly. | Random stratified sample; quotas ensure demographic mirror. |
  | **Question Setter** | Judge (law), Prosecution/Defense (facts). | Legislature, Executive, or Commission sets mandate. |
  | **Authority** | State sovereignty; constitutional right to trial by peers. | Delegated power; often advisory, sometimes binding. |
  | **Decision Binds** | Defendant's liberty (past action). | Public policy or law (future action). |
  | **Representation** | Impartial peers (bias excluded). | Descriptive microcosm (bias included as diversity). |
  | **Compulsion** | Mandatory summons; penalties for absence. | Often voluntary invitation; sometimes compelled. |
  | **Payment** | Minimal daily stipend; employer often dependent. | Higher stipend/wages; childcare provided. |

  This mapping shows selection methods appear similar, but operational constraints differ. Compulsion is overstated in assemblies; binding verdicts are absolute in juries. Randomness is the only true constant; the context is fundamentally distinct.

  ### Where It Breaks

  The analogy fractures where the task shifts from adjudicating past facts to legislating future values. Juries operate under strict evidentiary rules designed to isolate truth from noise; assemblies operate in a marketplace of ideas where advocacy and lobbying are features, not bugs. This is a structural break, not cosmetic. The "small step" argument relies on the perceived safety of the jury room, but the cognitive load differs vastly. A juror asks, "Did this happen?" based on constrained evidence. An assembly member asks, "What should we do?" based on competing expert testimonies and personal values.

  Payment and group size are cosmetic. Structural differences involve accountability and timeframe. Jurors are insulated from public pressure to ensure independence; assembly members are often selected to *be* the public, meaning pressure is internalized rather than excluded. Furthermore, jury decisions are unanimous verdicts on binary choices. Assembly outputs are nuanced policy recommendations requiring negotiation. Trusting strangers with liberty relies on their ability to suppress self-interest. Trusting strangers with policy relies on their ability to articulate collective interest. These are opposing muscular movements of citizenship.

  In a court, a judge acts as a gatekeeper, ruling inadmissible any information that might prejudice the jury. In a citizens' assembly, experts are invited precisely to persuade. The juror is protected from influence; the assembly member is subjected to it. This changes the nature of the "random stranger." The juror is a blank slate; the assembly member is a stakeholder. The "small step" argument assumes random selection inoculates against corruption in both cases. But without the judge's gavel, the assembly is vulnerable to capture by organized interests presenting as experts. The jury analogy hides the need for robust facilitation and balanced briefing materials. Without those, the assembly is not a jury; it is a focus group. The structural break is the absence of procedural safeguards designed to enforce neutrality.

  ### What It Smuggles In

  The analogy smuggles in the moral prestige of judicial impartiality to legitimize political representation. When defenders shift from "random strangers" to "impartiality," they conflate two distinct goods. Impartiality requires the absence of stake; descriptive representativeness requires the presence of all stakes. A juror is legitimate because they do not know the defendant. An assembly member is legitimate because they *are* the demographic equivalent of the constituency.

  If these are not the same good, the argument collapses. We do not want legislators to be impartial; we want them to advocate for interests while compromising. By importing the jury's impartiality, sortition advocates inadvertently suggest citizens should suppress their interests rather than voice them. This masks the political nature of the assembly. It presents policy-making as a technical search for truth (like a verdict) rather than a negotiation of values. The analogy hides the fact that assemblies are political bodies by dressing them in judicial robes. It suggests the output is "correct" rather than "chosen." This smuggles in an expectation of consensus that may not be politically viable. The jury analogy provides cover for the radical nature of sortition by associating it with the conservative institution of the court.

  Ultimately, this conflation creates a legitimacy trap. If the assembly acts politically, it fails the "jury" test of impartiality. If it acts impartially, it fails the "representative" test of advocating for constituent needs. The analogy forces the assembly into a double bind where it cannot satisfy the imported criteria without ceasing to function as a legislative body. The smuggled feature is the expectation of neutrality in a context designed for preference aggregation. In law, there is a correct verdict based on evidence. In policy, there is no correct answer, only competing priorities. Smuggling the jury model implies policy problems have solutions that can be "found" rather than "made." This depoliticizes democracy. It suggests that if we just remove partisan actors, the right answer emerges. This is a technocratic fantasy hidden inside a democratic reform.

  ### Verdict

  The "small familiar step" conclusion does not survive the audit. The familiarity is skin-deep; the underlying mechanics of trust are incompatible. We trust juries to be neutral arbiters within a fixed system; we are asked to trust assemblies to be the system itself. The analogy fails because it obscures the shift from adjudication to legislation.

  Is there a better analogy? Perhaps a "constitutional convention" or a "shareholder meeting." A convention implies a foundational reset by representatives, acknowledging the political weight. A shareholder meeting implies stakeholders deciding the direction of the enterprise they own. Both admit the political nature of the task. However, neither carries the same immediate moral resonance as jury duty.

  Proponents should abandon the jury analogy. It offers borrowed legitimacy at the cost of clarity. Instead, they should argue directly for the value of descriptive representation over electoral competition. The step is not small; it is a fundamental redesign of democratic authority. Acknowledging this gap is stronger than pretending it doesn't exist. The audit reveals the analogy is a rhetorical shield, not a structural blueprint. Trust must be earned on the merits of representation, not borrowed from the courts. The jury analogy is a bridge to nowhere; it leads to a different building than the one proponents want to construct. A constitutional convention is historically recognized as a body of citizens drafting rules, which aligns better with the assembly's mandate. However, conventions are rare and high-stakes. A shareholder meeting is more routine but implies ownership rather than citizenship. Perhaps the best analogy is a "town hall" scaled up and formalized. This admits the political negotiation involved. The key is to stop selling sortition as a judicial fix for a legislative problem.
