answer: |-
  Counsel, you make a spirited case for the coherence of the statute, and I grant you this: Section 1 is not mere preamble. It is enacted law. But you ask on what principle one sentence is demoted beneath another. I ask you instead: on what principle do you elevate a statement of purpose above a statement of command? Text is not a soup where every word dissolves into a general flavor of "legislative will." Text has structure. It has operative provisions and it has declaratory provisions. Section 1 declares the aim; Section 3 executes the rule. If the purpose clause could override the prohibition, the prohibition would be superfluous. Whenever a hard case arises, the court could simply look to Section 1, declare the purpose frustrated, and ignore Section 3. That renders the specific command nugatory. The principle of reading you seek is not in the text; it is an invitation to judicial amendment.

  Read Section 1 closely, moreover. It does not say the purpose is "public enjoyment" simpliciter. It says the purpose is to preserve traces "in place and undisturbed" for that enjoyment. You argue that denying water defeats the public's enjoyment. I suggest that moving the wreck defeats the "in place and undisturbed" preservation. The statute itself prioritizes the integrity of the site over the immediacy of public benefit. When the legislature wrote "in place," they anticipated that the site might be inconvenient. They wrote it anyway. To move the hull is to violate Section 1 just as surely as it violates Section 3. You cannot use the purpose clause to destroy the very condition—"in place"—that the purpose clause establishes.

  Furthermore, look to Section 4. The legislature knew how to create exceptions. They authorized permits for science and education. They did not authorize them for public utility or emergency. Under the rule of *expressio unius*, the inclusion of specific exceptions implies the exclusion of others. If we write an emergency exception now, we are not interpreting the text; we are amending it. So I put this to you: If the hardship here is genuine, why is the remedy not legislative? And if you say the court must fix it because the legislature cannot act fast enough, tell me where the text grants us that dispensing power. Is the court a standby legislature?
