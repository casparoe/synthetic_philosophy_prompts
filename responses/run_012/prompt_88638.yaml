prompt: |-
  I'm in a behavioural econ elective and we just started a unit on herding, and this week's reading was a chapter from one of those pop-econ books where a journalist explains a pile of academic papers. I've copied out the paragraph that's meant to be the gist of the cascade model, and honestly it made me feel like I understood the whole thing, which is usually a bad sign. Here it is:

  "People like to think crowds are wise, but when we decide one after another we mostly just copy whoever went first. Picture a queue of people choosing between two restaurants. The first person sees a full car park at A and an empty one at B and picks A. The second person saw the opposite, but she also sees that the first one picked A, and one other person's choice is worth about as much as her own hunch, so she picks A as well. Now the third person arrives and sees two people go into A, so unless her own information is very strong she should pick A too, even if everything she saw pointed to B. From then on everyone is just copying, and this is what an informational cascade is. The interesting part is that nobody is being a sheep — each of them is updating correctly on everything they can see, and the outcome is still basically arbitrary, so a thousand people can end up with no more information between them than the first two or three. That's also why cascades are so fragile: a small public announcement, or a couple of people visibly breaking ranks, and the whole thing flips overnight, which is why fads come and go so fast. Cascades explain a lot — bank runs, why everyone in a country drives on the same side of the road, why markets move together. And they're the real reason the old faith that big groups are wiser than small ones is wrong: once a cascade starts, adding more people adds no information at all."

  I have to write a response paper on this and I'd rather not just repeat things that turn out to be wrong. Can you go through it sentence by sentence and tell me what someone who actually works on this would nod at, what they'd wince at, and what's just not true? For anything that's off, say what the corrected version would be and whether it's a small imprecision or whether the picture changes. The last couple of sentences are definately the ones I'd have defended, so if they don't survive I'd like to know why. Also, he uses "cascade" and "herding" as if they're the same word and lumps a whole bunch of examples together — are all of those really the same mechanism, or is that a seperate problem from the accuracy of the model itself? And if it's relevant, say which assumption each claim is leaning on: whether people can see the order the decisions were made in, whether the early decisions are independent of each other, whether anyone is allowed to wait and see instead of acting. Our prof hasn't done the maths with us yet so I'm going off vibes here.
