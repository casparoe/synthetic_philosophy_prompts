prompt: |-
  I host a small philospohy podcast and next week's guest works on teleosemantics -- the idea that a state represents whatever it was selected for. Her version is a consumer semantics: content gets fixed by the function of whatever system uses the state, not the mechanism that produces it, and when those two come apart she says the consumer always wins. I want 8-10 questions that actually press her, not ones where she just restates the framework. I need at least one each on: why the consumer's function rather than the producer's is what settles content; what she does when the consumer's function is itself indeterminate, or when it gets co-opted for something the lineage was never selected for; and whether a story like this can make room for plain old misrepresentation, and for content that's never been tokened before. For each of those three, add a follow-up aimed at the reply she's most likely to give. Then finish with a question that forces her to say what would count as evidence against the whole approach. No "how did you get into philosophy" filler.
