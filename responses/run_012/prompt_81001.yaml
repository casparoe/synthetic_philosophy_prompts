answer: |-
  1. **The Consumer Priority:** In cases where the producer mechanism and the consumer system come apart—say, a visual state is produced by a mechanism selected for detecting snakes, but the consumer system uses that state to initiate a flight response that only works for *sticks* that look like snakes—you argue the consumer's function fixes the content. But doesn't this risk collapsing *truth* into *utility*? If the consumer benefits from treating the signal as "snake" to stay safe, even when it's a stick, why is that a representation with truth conditions rather than just a useful fiction?

  2. **Follow-up on Truth vs. Utility:** *(Ask this if she appeals to historical selection to save truth conditions.)* You'll likely say the consumer's function is fixed by history, not just current success. But if the consumer's lineage selected for *responding* to the signal to ensure survival, not necessarily for the signal being *true*, how do you distinguish the function "respond to signal S" from "act on content C"? Aren't you just pushing the indeterminacy problem back from the producer to the consumer?

  3. **Co-option and Indeterminacy:** Evolution frequently co-opts circuits for new tasks (exaptation). If I use visual processing mechanisms selected for predation to read text, does the content of those visual states change to "letters"? If yes, you seem to lose the historical tether required for teleology. If no, you seem to imply we can't represent novel categories. Which horn do you take?

  4. **Follow-up on System Individuation:** *(Ask this if she claims reading involves a "new" consumer system.)* If you posit a "new" consumer system every time we learn a new skill like reading, aren't you multiplying homunculi? I need a non-arbitrary cutoff: at what point does a behavioral shift count as a new selected consumer system versus just the old one operating in a new context?

  5. **Misrepresentation and Novelty:** A standard worry is that if the consumer dictates content, misrepresentation becomes impossible: if the consumer treats state $S$ as $X$ to do its job, then $S$ means $X$, even if $X$ isn't there. How does your view allow for plain old false belief? And simultaneously, how do I represent things like "smartphones" or "unicorns" that my consumer systems were never selected to handle?

  6. **Follow-up on Novel Environments:** *(Ask this if she appeals to "normal conditions" to explain error.)* "Normal conditions" are defined by selection history. But if I'm in an evolutionarily novel environment—like a VR simulation—my consumer systems have no history there. Does your view imply I *cannot* misrepresent the VR world, because there are no historical conditions to violate? Are we doomed to veridical representation in all novel contexts?

  7. **The Producer's Role:** If the consumer *always* wins when they come apart, what theoretical work is left for the producer to do? Is the producer mechanism merely a causal trigger with no semantic weight? If so, why isn't this just a causal theory of content dressed up in teleological language?

  8. **Normativity:** Teleosemantics aims to naturalize the normativity of meaning (the idea that a representation *ought* to match the world). But if content is fixed by the consumer's biological function, doesn't that normativity become purely instrumental (i.e., "you ought to represent X to survive") rather than semantic? How do you get from "biological mistake" to "representational error"?

  9. **The Liberalism Problem:** Critics argue teleosemantics makes representation too easy—if a thermostat has a consumer system (the furnace) that reacts to a state (the thermometer reading), does the thermostat represent temperature? If you say no, what precise constraint does your consumer semantics add that rules out simple cybernetic loops without ruling out simple organisms?

  10. **Falsification:** Finally, let's talk about evidence. What specific empirical finding in cognitive ethology or neuroscience would force you to abandon consumer teleosemantics? Is there a case where the producer and consumer come apart, and intuition or data strongly sides with the producer?
