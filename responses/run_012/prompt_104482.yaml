answer: |-
  Your intuition about substitution is close, but it fails on the generic drug because it misses the element of **socially granted exclusivity**. You are willing to accept substitution when the original creator's monopoly has legally or ethically expired (drugs), but not when it is active (jokes, drums) or when the copy bypasses the labor without adding value (phone book).

  The principle that unifies seven of your eight verdicts is **The Labor-Value Principle**: *It is unethical to appropriate the economic value of another's labor without permission, unless that labor's exclusivity has expired or the copier contributes significant independent effort.*

  Here is how it maps to your cases:
  *   **Standup Joke:** Steals the creative labor (writing). No independent effort. **Not Okay.**
  *   **Recipe:** The blogger contributes independent effort (cooking) and the recipe instructions are functional. **Fine.**
  *   **Fast Fashion:** The brand contributes manufacturing labor. It's a "jerk move" because it rides the design labor, but tolerable because fashion design exclusivity is weak. **Fine-ish.**
  *   **Generic Drug:** Exclusivity expired by social contract (patent law). **Fine.**
  *   **Evergreen Drug:** Gaming the exclusivity contract. **Not Okay.**
  *   **Drum Break:** Steals the specific recorded labor. No independent effort. **Not Okay.**
  *   **Phone Book:** Steals the compilation labor. No independent effort. **Not Okay.**

  **The Verdict to Overturn:**
  The **Perfume** verdict. You call it "Not okay," but you call the Dress "Jerk move, but I can't get worked up." These are functionally identical scenarios: reverse-engineering a non-patented aesthetic/functional product. Reverse-engineering a scent requires significant chemical analysis (independent effort), just as sewing a dress requires manufacturing effort. To be consistent with your tolerance of the dress (and the legal reality that scents generally cannot be copyrighted), you should treat the perfume dupe as a "Jerk move" but ultimately permissible.

  **The New Cases:**
  *   **AI Style Mimicry:** **Fine.** Style is not property (like the dress design or recipe instructions). The model generates new sentences (independent effort) and copyright does not protect "vibe" or syntax, only specific expression.
  *   **Magician's Secret:** **Not Fine.** The value of a trick is entirely in its secrecy (like the joke's surprise). Publishing it appropriates the labor of invention and destroys the economic value without adding new creative work, violating the professional norm of exclusivity.

  The single principle is: **You may not profit from the specific labor of another without adding significant new value, unless society has deemed that labor free for public use.**

  \answer{The Labor-Value Principle; overturn the Perfume verdict}
