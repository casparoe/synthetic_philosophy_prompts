prompt: |-
  I chair the bylaws committee of a small resident-owned housing cooperative, and I need advice on a procedural question that has turned into a dispute about something deeper. The building has forty units. Some owners live in their units; others rent theirs out and live elsewhere. Among the residents are long-term renters who have lived here for a decade, a live-in aide to an elderly owner, adult children who have moved back home, and the owner of a ground-floor café whose lease runs through the building. We are about to vote on replacing the elevator and adding an accessibility ramp. The project requires a special assessment on owners, and it will close the café’s entrance for months. Our bylaws give one vote per unit to owners, and they can be amended only by a two-thirds vote of unit-owners. So the people excluded by the current rule cannot vote to change the rule that excludes them. The board is split on whether we may even put the question to a broader group without first amending the bylaws. One faction says only owners should vote because they pay and carry the risk. Another says anyone who lives here should vote because they live with the result. The café owner wants a vote because the construction will affect his business. Residents of the neighboring building say the ramp will change the shared courtyard and want in. One board member proposes a stakeholder assembly: owners, renters, the café, and a neighbor, with votes weighted by how long each has been affected. Another proposes a boundary jury of twelve people chosen by lot from everyone within a block, to decide who should be eligible to vote in future decisions. I have to recommend a process. Who should be included in this vote, and on what principle? Should non-owners get a binding vote, an advisory vote, or a separate track? How should we treat people who will be affected later—future owners, people on the waitlist to buy in, and whoever replaces the aide if she leaves? And how do we break the circularity without assuming the very boundary we are arguing about? Please lead with your bottom line, then explain, in no more than 650 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the bylaws committee of a small resident-owned housing cooperative (40 units).
      *   **Situation:** Dispute over voting eligibility for a major capital project (elevator replacement + accessibility ramp).
      *   **Stakeholders:** Owners (resident & non-resident), long-term renters, live-in aide, adult children, café owner (leaseholder), neighboring building residents.
      *   **Conflict:** Bylaws say only owners vote (1 vote/unit). Changing bylaws requires 2/3 owner vote. Some want only owners to vote (pay/risk); others want all residents/affected parties to vote (live with results).
      *   **Proposals:** Stakeholder assembly (weighted votes), Boundary Jury (lottery from block).
      *   **Questions:** Who should vote? On what principle? Binding vs. advisory? How to treat future/affected parties? How to break circularity?
      *   **Constraint:** Lead with bottom line. Max 650 words.

  2.  **Determine the Bottom Line:**
      *   The legal reality is paramount: It's a cooperative. Owners hold the equity and liability. Legally, only owners can bind the co-op financially (special assessment) and alter governance (bylaws).
      *   However, the *legitimacy* crisis requires inclusion.
      *   *Recommendation:* Owners hold the binding vote on the assessment and bylaws. Non-owners get a structured advisory role with guaranteed consideration, but not binding power. This respects legal fiduciary duties while addressing the democratic deficit.
      *   *Principle:* "Affected Interests" deserve voice; "Residual Claimants" (owners) deserve veto/control.

  3.  **Drafting - Section by Section:**

      *   **Bottom Line:** State clearly who votes and how.
      *   **Principle:** Explain the distinction between ownership liability and community impact.
      *   **Process:** How to handle the non-owners (advisory vs. binding).
      *   **Future/Affected:** How to handle future stakeholders.
      *   **Circularity:** How to justify the boundary without begging the question.
      *   **Word Count Check:** Keep it tight.

  4.  **Drafting - Content:**

      *   *Bottom Line:* Owners must cast the binding vote on the assessment and bylaws. Non-owners (renters, café, aide) should participate in a mandatory advisory referendum with a board commitment to weigh results heavily.
      *   *Principle:* Distinguish between *fiduciary liability* and *lived impact*. Owners bear the financial risk and legal liability; therefore, they retain final authority. However, legitimate governance requires consent from those subjected to daily consequences. Excluding residents entirely risks social fracture and legal challenges regarding habitability or quiet enjoyment.
      *   *Process:* Create a "Community Consultation Vote." All current residents (owners, renters, aide, café) vote advisorially. The Board must publicly respond to the outcome before the owner vote. If the advisory vote strongly opposes what owners want, the Board must seek mediation before proceeding. This gives voice without violating corporate law.
      *   *Future Stakeholders:* Future owners and waitlist members cannot vote now; they assume the regime they enter. The aide's successor is covered by the policy precedent set now, not a specific vote. The focus is on *current* occupancy.
      *   *Circularity:* Break the circle by appealing to the legal structure already consented to. Owners bought into a co-op structure knowing the rules. Renters agreed to leases under those rules. The boundary isn't being drawn anew; it's being acknowledged. The innovation is the advisory layer, which doesn't require bylaw amendment.
      *   *Rejected Ideas:* The "Stakeholder Assembly" with weighted votes is too complex and legally risky. The "Boundary Jury" is external to the property rights structure.
      *   *Café/Neighbors:* The café owner has lease rights; construction interference may require compensation/negotiation, not necessarily a vote on co-op capital. Neighbors have no standing unless easements exist; their input is courtesy only.

  5.  **Refining and Editing (Word Count Management):**

      *   *Draft:*
          **Bottom Line:** Only unit-owners should cast the binding vote on the special assessment and bylaws. However, you must institute a mandatory advisory vote for all current residents and directly affected leaseholders, with a Board commitment to negotiate if opposition exceeds a specific threshold.

          **Principle:** Distinguish between *residual claimancy* and *stakeholder impact*. Owners hold the equity, liability, and legal title; they bear the financial risk of the assessment and the property value implications. Therefore, fiduciary duty and corporate law dictate they retain final authority. Conversely, legitimacy requires that those living with the consequences have a guaranteed voice. Excluding residents entirely treats them as subjects rather than community members, fueling the current dispute.

          **Process:** Do not attempt to grant binding votes to non-owners. This violates your bylaws and potentially state cooperative law, exposing the decision to legal challenge. Instead, formalize a "Resident Consultation." Distribute ballots to all occupants (owners, renters, aide, café). Tally results separately. If non-owner opposition is significant (e.g., >50%), the Board must pause to seek mitigation strategies before the owner vote. This honors the "live with the result" argument without violating the "pay the cost" rule.

          **Future and Peripheral Stakeholders:** Future owners and waitlist members assume the cooperative as it exists; they cannot vote on current liabilities. The live-in aide's position is tied to the unit's occupancy needs; policy changes apply to the unit, not the individual. Regarding the café and neighbors: The café owner's lease likely contains clauses about access and nuisance. His remedy is contractual negotiation regarding construction mitigation, not governance voting. Neighbors have no standing unless shared easements exist; their input should be limited to public comment during planning, not voting.

          **Breaking the Circularity:** You cannot define the voting boundary by voting on the boundary. Break the circle by anchoring to the existing legal contract. Owners purchased units under specific bylaws; renters signed leases acknowledging owner governance. The boundary is pre-defined by property law. The innovation is not changing who decides, but changing how input is gathered. You are not amending the bylaws to include renters; you are exercising Board discretion to consult them. This avoids the catch-22 of needing owner votes to allow non-owners to vote on whether non-owners should vote.

          **Recommendation:** Reject the weighted stakeholder assembly and boundary jury. They introduce subjectivity and legal risk. Stick to the legal structure for authority, but expand the ethical structure for input. This balances financial responsibility with community dignity. Proceed with the advisory vote immediately to gauge temperature, then schedule the owner vote.

