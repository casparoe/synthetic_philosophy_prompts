prompt: |-
  hey, for my phil of physics seminar I have to write an essay on Maxwell's demon and I want to try something that isn't just the usual "Landauer's principle saves the second law" recap. can you look at my notes and tell me if the arguement actually works and where it's weakest?

  the setup: standard demon sits at a hole in a wall between two chambers and sorts fast from slow molecules, and the standard move is that its memory has to get erased eventually, which costs kT ln 2 per bit and pays the bill. my demon doesn't do that. mine never measures anything -- it just waits for a molecule to show up at the hole that has *already* left a trace somewhere else (in the wall's own thermal fluctuations, or in some auxiliary system loosely coupled to the gas), and it opens the door only when the trace is there. call it the lazy demon. it's a pure parasite on records it didn't make.

  claim 1: the lazy demon performs no measurement of its own, so no measurement cost lands on it, yet it still sorts, so we seem to get work for free.
  claim 2: the fix is that the correlation it exploits wasn't free. somebody paid for that record -- the gas, or whoever built the auxiliary system -- and once you count the source of the record as part of the system, the books balance.
  claim 3 (the bit I actually care about): this shows "information" in thermo isn't fundamentally about what an agent knows. it's about correlations with things outside the agent, and knowledge is just the special case where the correlated thing happens to be inside a head. so the demon literature has been asking a slightly wrong question about "the demon's knowledge."

  what I want from you: comment on whether claims 1-3 hold up, especially whether a demon that never measures really escapes the accounting, and whether claim 3 is a genuine philosophical payoff or just relabeling. don't hedge -- take a side on whether the central move works, and tell me what to cut. also give me your verdict straight: first sentence should be your bottom line on whether the lazy demon arguement survives, then the reasons, no warm-up and no restating my question back at me.
