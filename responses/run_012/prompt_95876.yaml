answer: |-
  **Project Title:** The Three Faces of Accountability: Sortition, Term Limits, and Democratic Design

  **Research Question:** Does decomposing political accountability into answerability, sanctionability, and contestability resolve the normative stalemate surrounding citizens' assemblies and term-limited legislatures?

  **The Gap:** Current debates treat accountability as a monolith. Proponents of sortition argue citizens' assemblies are accountable because they give reasons; opponents argue they are not because members cannot be voted out. Similarly, defenders of term limits argue they reduce corruption, while critics argue they reduce responsiveness. Both sides talk past each other because they rely on different definitions of accountability.

  However, intellectual honesty requires acknowledging that dividing accountability into answerability and sanctionability is standard in political science literature. My proposed triad risks merely relabeling existing typologies unless "contestability"—the live channel to reopen decisions—is proven distinct and operationally useful. This project does not claim to invent these categories but to test whether elevating contestability to a co-equal pillar explains institutional performance where the standard binary fails. If the triad proves to be semantic rather than analytical, the project will pivot to measuring the *trade-offs* between these dimensions rather than their definitions.

  **Methodology:**
  Nine months is insufficient for both deep conceptual work and comparative reporting; there is a genuine risk this bifurcates into two disjointed projects—a philosophical paper and a magazine feature—that do not inform each other. To prevent this, the reporting will not merely describe institutions but will specifically seek evidence to falsify the conceptual framework.

  *Months 1–2:* Conceptual groundwork. I will map existing accountability typologies to ensure the triad offers predictive power beyond standard models.
  *Months 3–6:* Reporting. I will focus on two specific cases to maintain scope: the Irish Citizens' Assembly (sortition) and the California State Legislature (term limits). I will conduct interviews with designers, participants, and lobbyists, and analyze documents tracking recommendations against implementations. The interview protocol will specifically probe where actors feel accountability was satisfied despite missing sanctions, or vice versa.
  *Months 7–9:* Writing. The working paper will refine the theory based on reporting findings. The feature article will illustrate the theory through narrative, avoiding abstract theorizing.

  **Outputs:**
  1.  **A Working Paper:** A concise philosophical argument refining the accountability triad, suitable for an ethics journal. It will argue whether sanctionability is indeed secondary for advisory bodies.
  2.  **A Long-Form Feature:** A reported piece for a general-interest magazine showing how these distinct accountability types play out in real political conflicts, grounded in the California and Ireland case studies.

  **Failure Conditions:**
  This project fails if the distinction between sanctionability and contestability collapses under scrutiny, proving to be a synonym for existing mechanisms like judicial review or re-election. It also fails if the reporting remains descriptive—simply chronicling how assemblies work—without testing the theoretical framework. Finally, given the tight timeline, the project fails if the conceptual work and the reporting drift apart, resulting in a paper that ignores the empirical data and a story that ignores the theory.

  **Scope:**
  I will not attempt a comprehensive history of accountability theory nor a global survey of sortition bodies. The focus is strictly on the implications for non-electoral bodies. By limiting the empirical work to two deep case studies, I ensure the reporting is feasible within nine months while providing enough data to stress-test the conceptual claims.
