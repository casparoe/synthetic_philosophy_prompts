answer: |-
  # The Net Value of Information Checklist
  **For:** Evidence-and-Evaluation Analysts
  **Purpose:** To determine whether to recommend immediate funding or further evidence gathering.
  **Time Budget:** 2–4 Analyst Hours

  ## Part 1: The Procedure

  Your colleagues are citing a true theorem incorrectly. The **Expected Value of Information (EVOI)** is indeed never negative *in the abstract*. However, that theorem assumes information is free and delay is costless. In government, information costs money and delay costs opportunities. The correct metric is **Net Value of Information (NVOI)**.

  $$NVOI = (\text{Gross Value of Information}) - (\text{Cost of Study} + \text{Cost of Delay})$$

  If $NVOI \le 0$, you recommend **Decide Now**.
  If $NVOI > 0$, you recommend **Gather More**.

  Follow these six steps. Do not skip Step 3; it is where most theoretical arguments fail.

  ### Step 1: Define the Decision and the Alternatives
  *   **Question:** What exactly are we deciding, and what are the specific options?
  *   **Sufficient Answer:** "Option A: Fund Program X at Scale ($5M). Option B: Do Not Fund (or maintain status quo)."
  *   **Note:** If there are more than two options, identify the *current frontrunner* (the choice you would make with today's data).
  *   **Judgment Call:** If the department has already effectively decided and is asking for cover, note this. It does not change the math, but it changes the political risk.

  ### Step 2: Estimate the Stake (The Cost of Being Wrong)
  *   **Question:** If we choose the wrong option, how much value is lost compared to choosing the right one?
  *   **Quantity:** $\Delta V$ (Delta Value).
  *   **How to Estimate:**
      *   *Financial:* Difference in cost between the options.
      *   *Outcome:* Estimated monetary value of the program benefit if it works vs. if it fails.
      *   *Rule of Thumb:* If the program fails, is the money wasted (100% loss)? If the program succeeds, what is the social return? Use the department's own benefit-cost analysis if available, discounted by 50% for optimism bias.
  *   **Uncertainty:** If you cannot estimate this, you cannot calculate value. State this explicitly: *"Stake is unquantifiable; recommendation relies on risk tolerance."*

  ### Step 3: Calculate the Cost of Waiting (The Price of Information)
  *   **Question:** What do we lose by waiting for the new evidence?
  *   **Quantity:** $C_{delay} + C_{study}$.
  *   **Components:**
      1.  **Direct Cost:** Price of the proposed pilot/study.
      2.  **Opportunity Cost:** What happens to the beneficiaries during the delay? (e.g., A cohort of students graduates; a disease spreads; a vendor leaves the market).
      3.  **Political/Institutional Cost:** Will the window to fund close? Will the Mayor lose interest?
  *   **Sufficient Answer:** A dollar figure or a clear qualitative statement of irreversibility (e.g., "One school year of instruction lost").
  *   **Critical Check:** If the harm occurring during the delay is irreversible (health, safety, developmental windows), $C_{delay}$ approaches infinity. **Terminate here: Recommend Decide Now.**

  ### Step 4: Assess Decision Sensitivity (Will the Data Change Your Mind?)
  *   **Question:** What would the new study have to show to make you switch from the frontrunner to the other option?
  *   **Quantity:** $P_{change}$ (Probability the decision changes).
  *   **How to Estimate:**
      *   Look at the current evidence. Is it ambiguous?
      *   If the current data strongly favors Option A, a small study is unlikely to overturn it. $P_{change}$ is low.
      *   If the current data is noisy (e.g., small pilot, wide confidence intervals), $P_{change}$ is high.
  *   **Approximation:** Do not calculate integrals. Ask: *"If the new study shows zero effect, do we stop? If yes, $P_{change}$ is significant. If the new study shows a small effect, do we still stop? If yes, $P_{change}$ is higher."*
  *   **Judgment Call:** Distinguish between *statistical significance* and *practical significance*. A result can be statistically significant but too small to justify scaling. If the decision threshold is "positive return" and the pilot shows "positive return" (even if $p > 0.05$), the probability that a larger study reverses this may be low.

  ### Step 5: The Rough Calculation (Gross Value)
  *   **Question:** Is the potential gain from avoiding a mistake larger than the cost of waiting?
  *   **Formula:** $\text{Gross Value} \approx P_{change} \times \Delta V$
  *   **Comparison:**
      *   If $(\text{Gross Value}) < (\text{Cost of Waiting})$, **Recommend Decide Now.**
      *   If $(\text{Gross Value}) > (\text{Cost of Waiting})$, **Recommend Gather More.**
  *   **Uncertainty:** If numbers are vague, use scenarios. (Best Case, Worst Case). If "Gross Value" is lower than "Cost of Waiting" in the Best Case, stop.

  ### Step 6: The Value Separation Check
  *   **Question:** Are we buying *information* or *legitimacy*?
  *   **Check:**
      *   **Value of Knowing:** Does the department genuinely need to know the truth to manage risk?
      *   **Value of Being Seen:** Is the study requested to signal diligence to the Mayor or public?
      *   **Value of Deciding:** Does the study actually improve the allocation of funds?
  *   **Rule:** If the primary value is "Being Seen," recommend the cheapest study that satisfies the signal, or recommend Decide Now with a public communication strategy. Do not fund a $500k study for a $50k signal.
  *   **Handoff:** If the conflict is between "Risk Aversion" (Department) and "Efficiency" (Budget), mark this as a **Value Judgment**. The analyst provides the costs; the Director makes the trade-off.

  ---

  ## Part 2: Application to Three Proposals

  ### Case 1: The Mentoring Pilot (Scale vs. Study)
  *   **Proposal:** Scale a mentoring program to the whole district based on a pilot of 60 students.
  *   **Evidence:** Modest positive effect, $p = 0.12$ (not statistically significant).
  *   **Department Ask:** Scale now.
  *   **Your Unit's Instinct:** Wait for significance. $p > 0.05$ is usually a stop.
  *   **Procedure Run:**
      1.  **Decision:** Scale ($2M) vs. Wait/Study ($200k + 1 year).
      2.  **Stake:** If program fails, $2M wasted. If program works, 500 students gain support.
      3.  **Cost of Delay:** One academic year. Mentoring is age-sensitive. A 9th grader waiting a year is a 10th grader; the intervention window closes. **High Irreversible Cost.**
      4.  **Sensitivity:** The pilot shows a *positive* direction. To change the decision to "Do Not Scale," a new study would need to show a *negative* or *null* effect. Given the positive point estimate, a larger study is more likely to confirm the effect (narrow the CI) than reverse it. $P_{change}$ is low.
      5.  **Calculation:** The cost of losing a cohort of students (developmental harm) outweighs the risk of $2M on a program with a 70% chance of working (implied by the positive estimate).
      6.  **Separation:** The demand for $p < 0.05$ is a heuristic, not a decision rule.
  *   **Recommendation:** **Decide Now (Scale).**
  *   **Why You Will Not Like This:** This recommendation funds a program that has not met the conventional standard of statistical evidence. It feels like lowering your unit's standards. However, the decision-theoretic view is that *significance* is not the goal; *welfare* is. Waiting for significance here destroys the value of the intervention by missing the developmental window. The non-negativity theorem fails because the cost of delay (lost year) exceeds the gross value of the information.

  ### Case 2: The Service Contract (Renew vs. Evaluate)
  *   **Proposal:** Renew a 3-year waste management contract ($500k/year).
  *   **Evidence:** Service is running, no major complaints.
  *   **Department Ask:** Fund a $50k evaluation before renewing to ensure value.
  *   **Procedure Run:**
      1.  **Decision:** Renew vs. Evaluate then Renew.
      2.  **Stake:** $1.5M contract.
      3.  **Cost of Delay:** Minimal (contract has grace period). Study cost: $50k.
      4.  **Sensitivity:** The contract is **cheap to exit** (30-day termination clause).
      5.  **Calculation:** If you renew and the evaluation later shows poor performance, you can exit. The "Option Value" of waiting is low because you hold a "real option" to cancel later. The $50k study cost is pure loss if it doesn't change the *initial* signing decision.
      6.  **Separation:** The department wants "Value of Being Seen" (due diligence).
  *   **Recommendation:** **Decide Now (Renew with Exit Clause).**
  *   **Reasoning:** Information is only valuable if it constrains action. If you can act *and* reverse later, pre-action information is less valuable. Pay for monitoring *during* the contract, not evaluation *before* it.

  ### Case 3: Lead-Paint Remediation (Act vs. Study)
  *   **Proposal:** Expand remediation to a high-risk neighborhood.
  *   **Evidence:** Children testing high for lead.
  *   **Department Ask:** 12-month study to determine optimal expansion strategy before spending.
  *   **Procedure Run:**
      1.  **Decision:** Remediate Now vs. Study then Remediate.
      2.  **Stake:** Children's neurological health.
      3.  **Cost of Delay:** 12 months of lead exposure. **Infinite/Irreversible Cost.**
      4.  **Sensitivity:** Will a study change the decision? Only if it finds lead isn't dangerous (impossible) or the neighborhood isn't affected (contradicted by current tests). $P_{change} \approx 0$.
      5.  **Calculation:** Gross Value of Info $\approx 0$. Cost of Delay = Health Damage. Net Value < 0.
      6.  **Separation:** This is a request for "Value of Knowing" disguised as decision support.
  *   **Recommendation:** **Decide Now (Expand).**
  *   **Reasoning:** The non-negativity theorem assumes the agent can wait without penalty. Here, waiting *is* the penalty. The study is ethically indefensible under a utility maximization framework that includes health outcomes.

  ---

  ## Part 3: Limitations and Confidence

  ### What This Procedure Cannot Do
  1.  **Quantify Political Capital:** It cannot calculate the cost of the Mayor being angry because you told them to wait, or because you told them to fund a program that later fails.
  2.  **Resolve Value Conflicts:** It cannot decide whether a dollar of waste is worse than a year of lost schooling. It only frames the trade-off. Step 6 explicitly hands this back to you.
  3.  **Detect Model Error:** If the department's proposal is based on a fundamentally flawed theory of change (e.g., "mentoring works" when the mechanism is actually "cash transfers"), a pilot of the mentoring program yields zero value. This procedure assumes the *model* is at least plausible.
  4.  **Account for Strategic Behavior:** It assumes the department reports costs honestly. If they inflate the "Cost of Delay" to force a "Decide Now," the analyst must verify.

  ### Confidence Levels
  *   **High Confidence:** The core mathematical claim that $Net Value = Gross EVOI - Cost$. The colleagues' argument that "information is never negative" is definitively false when information has a price or delay cost.
  *   **High Confidence:** The recommendation on Case 3 (Lead Paint). The irreversibility of health harm makes the cost of delay dominate almost any study benefit.
  *   **Medium Confidence:** The recommendation on Case 2 (Contract). This depends heavily on the legal reality of the "cheap exit" clause. If exit is legally cheap but politically difficult, the Cost of Delay is higher than modeled.
  *   **Low Confidence:** The recommendation on Case 1 (Mentoring). This is the claim I am least sure of.
      *   *Why:* It requires estimating the "Probability of Success" from a non-significant pilot. This is statistically fraught. Relying on a point estimate from a small sample ($N=60$) is risky. If the true effect is zero, scaling is a $2M waste.
      *   *Defense:* Despite the statistical risk, the *decision* risk (losing a cohort) is the binding constraint. However, this is where your unit is most vulnerable to criticism if the program fails. You are trading statistical rigor for opportunity cost. This is the correct decision-theoretic move, but it is the hardest to defend publicly.

  ### Final Instruction to Analysts
  When a colleague cites the "non-negativity of information" to demand more data, show them Step 3. Ask them to price the delay. If they cannot price the delay, they are not doing decision theory; they are doing procrastination. If the price of delay exceeds the potential savings from avoiding a bad decision, the rational choice is to act.
