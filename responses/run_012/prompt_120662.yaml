      *   **Deliverables:**
          1.  Critique of the current heuristic.
          2.  Analysis of whether "one device" is the same question for Warranty, E-waste, and Parts-pairing.
          3.  A one-page procedure (flowchart/checklist style) for support staff (5 mins, no philosophy).
          4.  Application of the procedure to four specific scenarios.
          5.  Addressing the Sorites Paradox (heap paradox) trap regarding adding parts one by one.
      *   **Tone:** Direct, pragmatic, authoritative, willing to deliver bad news.

  2.  **Deconstruct the Philosophical/Logical Core:**
      *   The user is asking about *composition* and *identity over time* (Ship of Theseus).
      *   *Critique of Heuristic:* "Pick up in one piece and does something" fails because a brick does something (stops a door), a pile of parts might click together but not boot, and a phone with a dead battery is still a phone. It conflates *functional integrity* with *ontological identity*.
      *   *The "Three Questions" Insight:* This is crucial. "Device" is not a natural kind; it's a *functional classification* dependent on context.
          *   **Warranty:** Contractual identity (Serial Number + Safety/Performance chain of custody).
          *   **E-waste:** Regulatory/Physical mass (What enters the recycling stream?).
          *   **Parts-pairing:** Security/Software identity (Cryptographic handshake).
      *   *Conclusion:* You cannot have *one* definition for all three. Trying to do so is the root cause of the fight.

  3.  **Drafting the Procedure (The "Kill it with Paperwork" part):**
      *   Needs to be actionable.
      *   Needs to distinguish between the three contexts immediately.
      *   Needs clear "Stop/Go" criteria.
      *   Needs to acknowledge where policy choices are made vs. facts discovered.

  4.  **Addressing the Scenarios:**
      *   *Scenario 1: 3rd party screen/battery, rest stock.*
          *   Warranty: Likely Void (safety/performance risk).
