          *   Support: Third-party parts = still same phone (honor warranty).
          *   Finance: Original parts gone = different object (no warranty).
          *   E-waste: Needs unit counts (is a bare chassis a unit?).
          *   Parts-pairing: Wants the answer to be "no" (to prevent unauthorized pairing).
