          *   Pairing: Fail.
      *   *Scenario 2: Depot bench, chassis + loose modules.*
          *   Warranty: N/A (not a returned unit).
          *   E-waste: 1 Chassis + X Modules (depends on regulation).
          *   Pairing: N/A.
      *   *Scenario 3: Two dead phones -> One working.*
          *   Warranty: New Serial? (Cannibalization).
          *   E-waste: 1 Unit (the output).
          *   Pairing: Mismatch.
      *   *Scenario 4: Chassis only.*
