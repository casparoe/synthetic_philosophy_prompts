          *   *The "Strongest Argument":* Usually involves the "Common Kind Assumption" or "Highest Common Factor" reasoning. If the immediate phenomenology is the same, the underlying mental state must be the same. This leads to Sense-Data theory or Intentionalism (depending on the course context, but usually Sense-Data in this specific framing of "argument from illusion").
          *   *Key nuance:* The prompt asks to argue *for* the UA from the cases. The student needs to show *why* indistinguishability entails common kind.
      *   **Part 2: Disjunctivist Rejection.**
