answer: |-
  Thank you all for being here. For those who don't know me, I spent a lifetime in physics before retiring to read philosophy—a transition my old colleagues treat as a joke and my daughter treats as a phase. But standing here today, looking at this child, I find I need both languages to say what needs saying.

  Usually, at a naming ceremony, we talk about who the baby *is*. We promise to help her find her true self, or we say she can be anything she wants. But I've been asked not to say the latter, and honestly, the former doesn't quite hold up to scrutiny. When I look at her, I don't see a hidden seed waiting to bloom, nor do I see an empty vessel. I see something more like a bridge.

  In my old work, we calculated centers of gravity. Now, a center of gravity is a strange thing. It is real enough that if you calculate it wrong, the bridge falls down. You can compute torques about it and keep the structure standing. And yet, there is no physical object *at* the center of gravity. It is a point of balance, an abstraction that becomes real through the relationships of the materials around it.

  I suspect a person is much the same. There isn't a little person hidden inside her skull, waiting to be uncovered. There is a center of balance formed by the stories told around her. A friend of mine once told me this analogy breaks down because you can pin down a center of gravity to any precision, whereas a life story is always messy and shifting. He's right. But the responsibility remains the same.

  If her self is a center of narrative gravity, then everyone in this room is already holding a pen. You are all authors of her.

  To our friends from the university: you know well that words do not just describe the world; they shape it. You know that the categories we use become the boundaries we live within. To her family, who hold her in faith: you know that a soul is not a solitary thing, but is forged in communion, in the witness of others. These are different languages, but they point to the same duty.

  We cannot promise her she can be anything. That is too heavy a burden, and too lonely. She will be something specific, built from the truth we tell her about herself. Some of you will tell her she is beloved. Some will tell her she is capable. Some, perhaps, will tell her what she is before she has the words to argue. That is the danger and the beauty of this co-authorship. We are building the point around which her life will balance.

  So, my wish is not that she finds herself, but that we provide her with a story sturdy enough to stand on. Let us tell her stories that are kind, but true. Let us offer her a history that allows her future. Let us be careful authors, because once the ink is dry, it becomes her bones.

  To [Baby's Name]. May your center hold.
