answer: |-
  **Exam Question: Dynamic Consistency in Risk-Weighted Expected Utility**

  **Time Allocation:** 35 Minutes
  **Points:** 20

  **Background:**
  For a gamble with outcomes ordered $x_1 < x_2 < ... < x_n$ with probabilities $p_1, ..., p_n$, Risk-Weighted Expected Utility (REU) is defined as:
  $$REU = u(x_1) + \sum_{i=2}^{n} (u(x_i) - u(x_{i-1})) \cdot r(P(x \ge x_i))$$
  where $P(x \ge x_i)$ is the decumulative probability. Assume $u(x) = x$ and $r(p) = p^2$.

  **Scenario:**
  A two-stage decision problem.
  *Stage 1:* A fair coin is flipped.
  *   **Heads (0.5):** You receive \$2. The game ends.
  *   **Tails (0.5):** You proceed to Stage 2.
  *Stage 2 (reached only on Tails):* You choose between:
  *   **Option P:** \$0.80 for sure.
  *   **Option Q:** \$3 with probability 0.5; \$0 with probability 0.5.

  **Questions:**
  1.  Calculate the ex ante REU of the plan "Choose P at Stage 2" and the plan "Choose Q at Stage 2." Then, calculate the REU of P and Q conditional on reaching Stage 2. State the preferred option at each node.
  2.  Explain why an Expected Utility (EU) maximizer cannot exhibit this preference reversal. Name the specific axiom violated by the REU agent. Using the REU formula, explain how the ranking of outcomes generates this reversal.
  3.  Suppose the Stage 1 Heads outcome is changed to \$0. Does the preference reversal survive? Show calculations and explain the result.
  4.  Discuss whether a sophisticated agent (who anticipates the reversal) should commit ex ante or plan to re-optimize. Does your advice change if $r(p)$ represents distorted beliefs rather than risk attitude?

  ***

  **Model Answer**

  **(1) Calculations and Preferences**
  *Ex Ante Plans:*
  **Plan P:** Outcomes are \$0.80 (prob 0.5) and \$2 (prob 0.5). Ordered: $0.80 < 2$.
  $REU(P) = 0.80 + (2 - 0.80) \cdot r(0.5) = 0.80 + 1.2(0.25) = 1.10$.
  **Plan Q:** Outcomes are \$0 (0.25), \$2 (0.5), \$3 (0.25). Ordered: $0 < 2 < 3$.
  $P(x \ge 2) = 0.75$; $P(x \ge 3) = 0.25$.
  $REU(Q) = 0 + (2 - 0) \cdot r(0.75) + (3 - 2) \cdot r(0.25)$
  $= 2(0.5625) + 1(0.0625) = 1.125 + 0.0625 = 1.1875$.
  *Ex Ante Preference:* **Q > P** ($1.1875 > 1.10$).

  *Conditional (Stage 2):*
  **Option P:** \$0.80 sure. $REU = 0.80$.
  **Option Q:** \$0 (0.5), \$3 (0.5).
  $REU = 0 + (3 - 0) \cdot r(0.5) = 3(0.25) = 0.75$.
  *Conditional Preference:* **P > Q** ($0.80 > 0.75$).
  *Result:* The agent plans to choose Q but will choose P if reached. This is dynamic inconsistency.

  **(2) EU Impossibility and Mechanism**
  No EU maximizer can reverse preferences when one option (P) is available in both contexts and the other (Q) is merely embedded in a larger lottery. EU satisfies the **Sure Thing Principle** (or Separability), requiring preferences to depend only on states where outcomes differ. REU violates this because the weight assigned to an outcome depends on its **rank** among all possible outcomes.
  In Plan Q ex ante, the \$2 outcome (from Stage 1 Heads) sits between \$0 and \$3. This "splits" the probability weight, applying $r(0.75)$ to the first \$2 and $r(0.25)$ to the marginal \$1. This convex risk function overweight the chance of getting *at least* \$2 compared to the conditional context where \$2 is impossible. The presence of the safe \$2 outcome ex ante improves the ranking of the lower bounds of Q, making Q look better ex ante than it does in isolation.

  **(3) Modification (Heads = \$0)**
  If Heads pays \$0:
  **Plan P:** Outcomes \$0 (0.5), \$0.80 (0.5). $REU = 0 + 0.8(0.25) = 0.20$.
  **Plan Q:** Outcomes \$0 (0.75), \$3 (0.25). $REU = 0 + 3(0.0625) = 0.1875$.
  *Ex Ante Preference:* **P > Q**.
  Conditional preference remains P > Q. The reversal **does not survive**.
  *Explanation:* When the Stage 1 outcome is \$0, it merges with the worst outcome of Q. It no longer sits in the middle of the ranking to alter the weight distribution on the intermediate gains. Without the intermediate rank, the risk-aversion applies consistently.

  **(4) Sophistication and Interpretation**
  A sophisticated agent knows they will choose P at Stage 2. If they cannot commit, they should evaluate the actual choice (P) ex ante, yielding REU 1.10. If they can commit, they should bind themselves to Q (REU 1.1875).
  If $r(p)$ represents **distorted beliefs** (pessimism), dynamic inconsistency is irrational; the agent holds contradictory beliefs about the same event at different times. They should re-optimize based on current information. If $r(p)$ is a genuine **taste for risk** (global property), commitment is rational to satisfy global preferences, even if local preferences shift.

  ***

  **Marking Scheme (20 Points)**

  **Must-Hit Items (4 points each)**

  1.  **Correct Ex Ante Calculations & Ranking:**
      *   *Required:* REU(Plan P) = 1.10; REU(Plan Q) = 1.1875; Preference Q > P.
      *   *Typical Error:* Failing to reorder outcomes for the REU sum, leading to incorrect weights for Plan Q.
  2.  **Correct Conditional Calculations & Reversal Identification:**
      *   *Required:* REU(P) = 0.80; REU(Q) = 0.75; Preference P > Q. Explicit statement of inconsistency.
      *   *Typical Error:* Using ex ante probabilities (0.25/0.25) instead of conditional (0.5/0.5) for Stage 2.
  3.  **EU Axiom & REU Mechanism:**
      *   *Required:* Identification of Sure Thing Principle (or Separability). Explanation that outcome ranking/position changes weights in REU but not EU.
      *   *Typical Error:* Naming "Independence" without explaining the rank-dependence mechanism specific to REU.
  4.  **Modification Analysis (Heads = \$0):**
      *   *Required:* Correct calculation showing P > Q ex ante. Conclusion that reversal disappears.
      *   *Typical Error:* Assuming the reversal persists because the risk function $r(p)=p^2$ remains unchanged.
  5.  **Sophistication & Interpretation:**
      *   *Required:* Distinction between commitment (global) and re-optimization (local). Distinction between belief (irrational inconsistency) and taste (rational commitment).
      *   *Typical Error:* Claiming sophistication eliminates the inconsistency rather than changing how the agent plans around it.

  **Grading Bands**
  *   **A (18-20 pts):** All 5 items hit with precise arithmetic and clear conceptual distinctions. Part (4) nuanced regarding belief vs. taste.
  *   **B (14-17 pts):** Calculations correct (Items 1, 2, 4), but theoretical explanation (Items 3, 5) is vague or conflates EU axioms.
  *   **C (10-13 pts):** Major calculation errors but correct qualitative intuition, OR perfect calculations with no theoretical explanation.
  *   **D/F (<10 pts):** Fundamental misunderstanding of REU formula or failure to identify dynamic inconsistency.
