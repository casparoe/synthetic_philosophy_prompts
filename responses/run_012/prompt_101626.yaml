  4.  **Deep Dive into the Major Conflict: (3) vs. (4)**
      *   This is the classic Lakatos problem. Lakatos explicitly argued for "historical rationality" (retrospective). He was wary of calling scientists irrational in the moment because a degenerating programme *could* turn progressive (e.g., Bohr's atom had issues before quantum mechanics saved it).
      *   The user wants to have their cake (Lakatosian structure) and eat it too (normative critique of current science).
      *   *Repair Options:*
