          *   In Lakatos's view, the "hard core" (2) is *not* falsifiable. It is protected by a "negative heuristic."
          *   If (5) says a *theory* must forbid observations, does that apply to the *research programme*? If the hard core is immune to evidence (2), does the programme as a whole forbid observations?
          *   *Severity:* Medium. Lakatos incorporates falsificationism but modifies it. The tension lies in whether the "hard core" violates the "scientific" definition in (5). Usually, Lakatos argues the *programme* is the unit of appraisal, not the core alone. But if the core is unfalsifiable, is it scientific? Lakatos says yes, as part of a progressive programme. Popper might say no.

