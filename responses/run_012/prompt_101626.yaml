  3.  **Identify Potential Tensions/Conflicts:**

      *   **Tension A: (3) vs. (4)**
          *   (3) says: Verdict is retrospective. No instant rationality. You can't tell *now*.
          *   (4) says: I want to say *now* that current programmes are degenerating and defenders are irrational.
          *   *Severity:* High. This is a direct contradiction. If rationality is only retrospective, you cannot label current actors irrational.

      *   **Tension B: (1)/(2) vs. (5)**
