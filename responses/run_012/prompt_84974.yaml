answer: |-
  **Setup**
  Consider a finite horizon game with six decision nodes alternating between Player 1 (nodes 1, 3, 5) and Player 2 (nodes 2, 4, 6). At each node, the mover chooses **Take** (ending the game with specified payoffs) or **Pass** (moving to the next node). The total payoff pool expands at every depth, but the distribution at any **Take** node strictly favors the mover over the non-mover. At the final node (6), Player 2 faces a strictly dominant choice to **Take** rather than Pass into a null payoff. Both players are purely self-interested, rationality is common knowledge, and there are no external enforcement mechanisms, reputational stakes, or trembles.

  **Payoff Table**
  *Payoffs listed as (Player 1, Player 2). BI = Backward Induction outcome from that node.*

  | Node | Mover | Action | Payoff Outcome | Total Sum | BI Outcome from Node |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | P1 | **Take** | **(2, 1)** | 3 | **(2, 1)** |
  | | | Pass | → Node 2 | | |
  | **2** | P2 | **Take** | **(1, 4)** | 5 | **(1, 4)** |
  | | | Pass | → Node 3 | | |
  | **3** | P1 | **Take** | **(4, 3)** | 7 | **(4, 3)** |
  | | | Pass | → Node 4 | | |
  | **4** | P2 | **Take** | **(1, 8)** | 9 | **(1, 8)** |
  | | | Pass | → Node 5 | | |
  | **5** | P1 | **Take** | **(6, 5)** | 11 | **(6, 5)** |
  | | | Pass | → Node 6 | | |
  | **6** | P2 | **Take** | **(4, 20)** | 24 | **(4, 20)** |
  | | | Pass | (0, 0) | 0 | |

  **The Rival Verdict**
  The 'pair as single agent' principle dictates: *Select the policy that maximizes the pair's total payoff, conditional on both players adopting this same principle.* Applying this to the table, the agents sum the columns (3, 5, 7, 9, 11, 24) and identify Node 6 as the unique maximum. Consequently, the principle prescribes **Pass** at nodes 1 through 5 and **Take** at node 6. This verdict diverges sharply from backward induction, which unravels the game to a **Take** at Node 1. Crucially, this is not a sacrifice: under the pair principle, Player 1 gains (4 vs 2) and Player 2 gains (20 vs 1), making the cooperative outcome a strict Pareto improvement over the rational equilibrium.

  **The Checks**
  The single feature doing the work is the **substitution of the objective function**: the principle replaces individual payoff maximization with joint payoff maximization. If you drop this feature and restore individual maximands, the verdict collapses immediately back to backward induction. This reveals that the principle is not available to purely self-interested agents without smuggling in a **collective agent** (a 'we-mode' reasoner) where none exists ontologically. A backward-induction defender would deflate the case by arguing that the principle assumes what it needs to prove: it treats the other player's compliance as a fixed parameter of the choice, but without enforceable commitment, a self-interested partner has no reason to Pass at node 5, rendering the initial Pass at node 1 merely a gift to a defector.

  **Policy Announcement**
  Letting them announce policies in advance dissolves the pair verdict because without binding enforcement, such announcements are cheap talk that cannot alter the dominance structure at the final node.
