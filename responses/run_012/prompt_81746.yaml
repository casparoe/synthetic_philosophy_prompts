prompt: |-
  I'm in a law-and-lit seminar and I've been stuck with leading discussion on The Merchant of Venice, specifically the trial scene where Portia beats Shylock at his own interpretive game: the bond entitles him to a pound of Antonio's flesh, but it says nothing about blood, so the moment he spills any his case collapses, and he also has to cut exactly the pound without going over or under. I know it's a contract and not a statute, but our seminar has been all textualism versus purposivism in legal interpretation, and the scene feels like it's doing something the usual law-school examples don't. I want a reading of the trial, and maybe the whole play, through that debate. Is Portia a textualist who weaponizes literalism? A purposivist who only pretends to read the words plainly? Does the play show that purpose is always already in the text, or that literalism is just another tool of power? I don't want a plot summary or a generic lecture on the two theories; I want an argument about what the play dramatizes that the theory usually keeps abstract.

  One thing I'd like you to weave in is the distinction some legal theorists draw between interpretation and construction: interpretation is figuring out what the words mean, construction is what a court does when the meaning runs out or produces an absurd or unjust result. There's also the absurdity doctrine and the rule of lenity, which say courts sometimes bend a text to avoid absurdity or read penal provisions narrowly against the one enforcing them. Where does Portia's move sit on that map? Is she interpreting the bond, constructing a rule for the case, or just doing something the theory has no name for? And does the play suggest the line between interpretation and construction is stable, or does the trial expose it as something judges draw after the fact? I'm teaching this to undergrads who know the play but not the legal theory, so don't assume they know cases or canonical examples.

  Give it to me as exactly five numbered points, each a sentence or two, with no introduction or conclusion. Each point should do one job: say what Portia's interpretive method really is; say what Shylock's own literalism reveals about him and about the bond; bring in the interpretation/construction distinction and place Portia's move on it; identify one moment or detail in the play that resists the reading and say why; and end by saying what the play adds to the textualism/purposivism debate that argument alone doesn't.
