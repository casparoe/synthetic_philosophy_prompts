answer: |-
  1. Portia employs a strategic literalism that initially validates the bond's text only to weaponize its silence on blood against Shylock. She is not a consistent textualist but a performative interpreter who shifts methods to secure a specific outcome rather than discover meaning.
  2. Shylock's rigid adherence to the text reveals his belief that written law is a neutral shield for the marginalized, ignoring that enforcement always requires human discretion. His literalism treats the bond as a static command, failing to see that legal language is ultimately subject to the sovereign power of the court.
  3. Although Portia frames her ruling as pure interpretation of the word "flesh," she is actually engaging in construction by imposing a penalty for shedding blood that the contract does not specify. This move exposes the line between interpretation and construction as unstable, revealing it as a boundary judges draw after the fact to justify a desired result.
  4. The "quality of mercy" speech resists this legalistic reading because it appeals to equity and divine purpose rather than textual precision, suggesting Portia knows the law alone cannot justify the outcome. This moment undermines her later literalism by admitting that strict justice requires tempering to avoid moral absurdity, contradicting her rigid stance on the bond.
  5. The play adds the visceral reality of the body to the debate, showing that interpretive disputes are not just about words but about who gets to bleed. It dramatizes how legal theory is never neutral but always embedded in power dynamics and human consequences that abstract argument obscures.
