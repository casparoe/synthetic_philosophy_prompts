answer: |-
  The debate over the Great Divergence has long since outgrown the archival evidence. We are no longer arguing merely about coal deposits, wage rates, or property rights; we are arguing about the logic of historical explanation itself. Your supervisor and your friend represent the two poles of this methodological crisis. The supervisor defends the traditional comparative method: isolate variables between matched cases to find the difference maker. Your friend attacks the epistemological foundation: she argues that comparing a success to a failure is a logical trap that generates unfalsifiable just-so stories and misidentifies the statistical nature of the problem.

  To adjudicate this, we must cut through the historiography and look at the structure of the explanation. My verdict is this: The question "Why Britain and not China?" is **well-posed**, but only under a specific condition that your supervisor implies but does not state, and which your friend misunderstands. The question is valid only if we treat the absence of industrialization in China not as a "non-event," but as the active persistence of a stable equilibrium. Your friend's alternative—asking "why anywhere and not everywhere"—is not a solution; it is a category error that demands a theory of history we cannot possess. However, accepting the validity of the contrastive question requires us to give up the search for a general law of economic growth. We must accept that the Industrial Revolution was a conjunctural accident, not an inevitable outcome waiting for the right conditions.

  **The Unfalsifiability Charge**

  Your friend's first objection is the most damaging: that a "why-not" question about a non-event is inherently unfalsifiable. Her logic is that if we explain Britain's success by factor $X$ (e.g., secure property rights), we inevitably explain China's failure by the absence of $X$. Since we cannot observe the counterfactual (a China with secure property rights), we cannot test if $X$ was actually the cause. She argues this turns history into a machine for generating narratives where every feature of the winner is retrospectively valorized as a cause, and every feature of the loser is vilified as an obstacle.

  This critique is powerful, but it conflates *logical unfalsifiability* with *empirical difficulty*. A question is only truly unfalsifiable if no possible evidence could contradict it. The "Britain not China" comparison is not in this category, provided we stop treating the absence of growth as a void.

  The Industrial Revolution did not fail to happen in China because nothing was happening there. It failed to happen because something else *was* happening: the successful intensification of an agrarian economy. This is the concept of the "high-level equilibrium trap." China's economy was not a stagnant void waiting for British inputs; it was a robust system that efficiently allocated labor and capital in ways that actively disincentivized labor-saving machinery.

  This makes the hypothesis testable. If the hypothesis is "high wages triggered mechanization in Britain," we do not just check if British wages were high. We must test the counterfactual mechanism in the Chinese case: Did low Chinese wages *cause* the rejection of machinery? We can test this by looking for instances where Chinese actors faced high labor costs or had access to capital. Did they mechanize? If they had access to capital and still chose labor-intensive methods due to population pressure, the hypothesis holds. If they tried to mechanize and failed due to lack of technical knowledge, the hypothesis fails.

  The "why-not" structure becomes unfalsifiable only when historians engage in "variable shopping"—scanning the British case for unique features and projecting them onto China as absences without a theoretical model of *why* that absence should matter. If the explanation is merely a checklist of British attributes (coal, colonies, culture) that China lacked, your friend is right: it is a tautology. But if the explanation is a causal mechanism (e.g., "energy constraints bind innovation unless cheap fossil fuels are available"), then the Chinese case acts as a control group. We can observe whether energy constraints actually bound innovation in the Yangtze Delta. They did. That is an observation, not a counterfactual fantasy.

  Therefore, the "why-not" structure is not the problem. The problem is sloppy operationalization. The contrast is testable if we treat the "non-event" as an active equilibrium with its own causal logic, rather than a passive failure to replicate Britain.

  **The Distribution Objection**

  Your friend's second point is more subtle. She argues that focusing on Britain and China treats the Industrial Revolution as a token event specific to those places, when it is actually a distribution problem. She suggests we should ask: "Why did sustained growth happen *somewhere* (anywhere) and not *everywhere*?" She suspects the Britain/China contrast is a distraction born of Eurocentrism, picking out the winner and the runner-up rather than looking at the field.

  This sounds sophisticated, but it relocates the problem into a domain where historical explanation is impossible. To ask "why it happened anywhere at all" is to ask for a theory of human innovation in the abstract. It assumes that the default state of human societies is stasis, and that growth is the anomaly requiring a universal trigger. But to ask "why not everywhere" assumes that once the trigger was found, it should have propagated universally, implying that growth is the natural state inhibited only by local frictions.

  Both assumptions are ahistorical. The Industrial Revolution was not a virus that spread from a patient zero; it was a phase shift in energy and production that required a highly specific, unlikely conjunction of geological, geopolitical, and economic factors. By shifting the question to "why anywhere," your friend demands a universal law of history—a sociological physics that predicts the emergence of modernity based on initial conditions. We do not have this. We never will. History deals in transitions, not distributions.

  Furthermore, the "why anywhere" question obscures the very phenomenon we are trying to explain. If we treat Britain as just one data point in a global distribution, we lose the ability to trace the *process* of divergence. We might identify correlates of growth across fifty regions, but we would not understand the *mechanism* that broke the Malthusian trap. The Britain/China comparison is not a distraction; it is a strategic selection of the two most comparable advanced economies of the 18th century. They are the "most similar systems" with the "different outcomes." To widen the lens to "everywhere" is to introduce so much noise (regions with no states, no markets, no literacy) that the signal of the specific transition is lost.

  Your friend is correct that focusing on tokens risks selection bias. But her solution is to dissolve the token into a statistical cloud, which prevents us from explaining the causal chain. We cannot explain a phase transition by averaging the properties of the substance before and after. We need to look at the specific point of fracture. Britain is that point. China is the control.

  **The Verdict and the Cost**

  So, where does this leave us? The "Why Britain and not China" question is **well-posed**, but it is epistemically hazardous. It is valid only if we accept that we are comparing two specific causal pathways, not judging two civilizations.

  To hold this position in your seminar, you must defend the contrastive method against the charge of unfalsifiability by insisting that the "absence" of growth in China is an observable historical process (the intensification of agrarian efficiency), not a null set. You must argue that counterfactuals are tested through process tracing within the actual history of the "failure" case, not by imagining alternative histories.

  However, you must also concede a significant cost to your friend. To defend the Britain/China question, you must give up the claim that the answer will explain *why the modern world exists*. If the divergence is explained by a conjunctural accident—say, the specific location of British coal relative to waterways, combined with a specific geopolitical fragmentation in Europe that allowed for risky experimentation—then the Industrial Revolution was not inevitable. It was a lucky break.

  If you accept the contrastive question, you are arguing that history is contingent. You are arguing that there is no "law of development" that guarantees growth once certain thresholds are met. If there were such a law, your friend would be right: China should have grown, or growth should have appeared elsewhere. By insisting that the Britain/China comparison is the right question, you are committing to the view that the modern world is the product of a specific, non-repeatable historical configuration.

  This is the trade-off. Your supervisor offers you a method that works for historians but risks particularism. Your friend offers you a method that seeks generalizability but requires a theory of history that does not exist. You should side with the supervisor, but with a caveat: the comparison is only valid if we stop looking for the "missing ingredient" in China and start analyzing the "successful stability" of the Chinese economy.

  **Conclusion**

  The "why-not" structure is not a logical flaw; it is the essence of historical explanation. We explain events by contrasting them with what might have been expected. The charge of unfalsifiability is a warning against lazy storytelling, not a prohibition on the question itself. The alternative—asking why growth happened "anywhere"—is a theoretical dead end that asks for a universal law where only a specific narrative can be found.

  Therefore, the essay should argue that the Great Divergence question is well-posed, provided we treat it as an investigation into a specific conjunctural rupture rather than a general theory of development. To defend this, you must be willing to tell your seminar that the Industrial Revolution might not have a "cause" in the scientific sense, but rather a "history." You must give up the comfort of inevitability. The price of a well-posed historical question is the acceptance that the answer might be: "It happened here because of this specific combination, and it didn't happen there because that combination was absent, and there is no deeper reason why." That is not a failure of explanation; it is the only honest explanation history can provide.
