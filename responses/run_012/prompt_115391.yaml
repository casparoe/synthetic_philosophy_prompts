prompt: |-
  so I've got to write this essay for my historiograpy seminar and I keep flip-flopping on it, so I want you to just write the thing and actually take a position.

  The topic is the contrastive question: why did the industrial revolution / sustained growth happen in Britain and not in China (or Europe and not Asia, depending who you ask — the Needham thing, the Great Divergence framing). My supervisor's line is that contrastive questions are fine, you just have to specify the contrast class and make sure the two cases are otherwise matched, and then you're asking a perfectly good question. A friend in the seminar thinks that's backwards. She says the problem isn't that the contrast is too coarse or that the cases are badly matched, it's that the question is a why-not question about a non-event: you're asking why something that didn't happen didn't happen, so every answer gets assembled out of the features the successful case happened to have, and none of them can be falsified because the counterfactual is never observed. She thinks it's a machine for generating unfalsifiable narratives. She also says something I can't quite get my head round — that the question picks out a single token case as the explanandum when the only thing with a real distribution is the set of regions, so the honest question is why it happened anywhere at all, and why not everywhere, and that once you ask it that way the Britain/China comparison is a distraction.

  I want an essay that actually adjudicates this. Is the why Britain and not China question well posed, ill posed, or well posed only under certain conditions — and if so, which conditions? Don't lay out the debate and then shrug; end with a verdict I could actually defend in a seminar, and say what I'd have to give up in order to hold it. Two things I specifically want you to deal with:

  1. Whether the why-not structure really does make it unfalsifiable, or whether that's too quick. I suspect there's a difference between a narrative that can't be falsified and a comparison that can only be tested indirectly, and I want you to say which side of that line the standard answers fall on.
  2. Whether swapping in the why anywhere / why not everywhere question actually helps or just relocates the problem. My suspicion is it relocates it, since now you need a theory of the whole distribution, but I'm not sure that's worse.

  Dont give me a reading list or citations, I can't get to the library this week and I dont want you inventing references anyway. Just the argument. And no mealy-mouthed ending.
