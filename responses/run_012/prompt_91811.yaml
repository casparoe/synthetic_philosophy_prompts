  Your notebook is coherent. You have identified that "existence" is doing illicit work in all these arguments, whether it is dressed up as "greatness," "perfection," "possibility," or "positive property." Trust the gut that told you existence isn't a feature; the formal logic is just trying to convince you that it is.
