      *   *Conventionalism:* Is it distinct? Yes, if "construction" implies cognitive constraints, not just linguistic stipulation. If it's just naming, it's conventionalism. If it's generating via mental motion, it's constructivism.
      *   *Practice vs. Method:* The failure to square the circle shows that "constructibility" is a stricter constraint than Hobbes realized. It undermines the claim that the method yields *certain* results if the practitioner can't tell what is constructible.

  5.  **Scholarly Consensus vs. Contestation:**

      *   *Settled:* Hobbes was a nominalist. He believed *scientia* is knowledge of consequences from names/definitions. He prioritized geometry as the model. He failed at squaring the circle.
      *   *Contested:* Is Hobbes a precursor to Kant (synthetic a priori)? Is he a strict conventionalist (Ayer style)? Is his political philosophy truly demonstrable in the same way as geometry (some say the analogy breaks)?
      *   *Caution:* Avoid saying "Hobbes is clearly X." Say "Many interpreters argue X, while others suggest Y."

