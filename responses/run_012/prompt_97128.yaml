      *   *Status:* It's a coherent internal position, but faces massive external philosophical hurdles (Kant, Frege, Quine, etc., later).
      *   *Scholarship:* There is debate about whether Hobbes is a strict conventionalist, a nominalist, or an early constructivist. The "construction" element is widely acknowledged, but its implications are contested.

  3.  **Brainstorming Defeaters (Ranking them):**

      *   *Fatal:*
          *   **The Constraint Problem (Necessity):** If we make the objects, why can't we make a triangle with 4 sides? Why are we constrained? If truth depends on our stipulation, mathematical necessity looks like arbitrary rule-following, but math *feels* necessary independent of us.
          *   **The Applicability Problem:** If geometry is about *our* constructions, why does it describe the physical universe (which we didn't make) so perfectly? Hobbes needs a bridge between the constructed world and the natural world.
          *   **Existence of Unconstructable Objects:** Modern math deals with infinities, higher dimensions, non-Euclidean geometries that aren't easily "drawn" or "generated" in Hobbes's kinematic sense. (Anachronistic but philosophically potent).
