answer: |-
  Good morning. Thank you all for being here.

  For those who don't know me, I was lucky enough to spend five years in [Supervisor's Name]'s lab. I was one of the many students who learned, often the hard way, that science was not just about having ideas, but about respecting the work.

  If you knew him professionally, you knew he was a yeast geneticist. If you knew him personally, you knew he was a man who believed that the world is made of things that touch other things. He spent forty years at the bench. He wasn't interested in grand theories that floated above the data. He was interested in the pipette, the plate, the molecule, and the physical reality of what happens when one meets the other.

  He taught me that a beautiful result is suspicious until proven otherwise. "Never trust a pretty gel," he'd say. "Run the control twice." He believed that truth wasn't something you declared; it was something you demonstrated, over and over, until the noise fell away and only the signal remained.

  He was a stubborn man. We all know that. He had particular ideas about how we should speak about our work. He believed that biology is chemistry, and that chemistry is a chain of causes and consequences. He worried that when we used poetic shortcuts to describe DNA, we started to believe the poetry was real. He thought a gene doesn't *say* anything; it *does* something. It makes a difference in the cell, the way a key makes a difference in a lock, not by carrying a message, but by fitting a shape.

  He was pragmatic, though. He would type the required words into his grant applications to secure the funding, and then spend dinner explaining why those words were lies. He accepted the price of doing business, but he never let it change how he thought. He wanted us to look at the machinery, not the metaphor.

  But the stubbornness was only one part of him. The larger part was generosity. He had endless patience for a student who had tried hard and failed, and zero patience for a student who hadn't tried at all. He wanted you to understand the mechanism so you could fix it when it broke.

  To his family, he was simply [Name]. A husband who loved [Wife's Name] with a quiet, steady devotion. A father who was endlessly proud of [Son's Name]. I know [Son's Name] works in the same field, and I know they shared a bond that went beyond words. [Supervisor's Name] saw his own curiosity reflected in his son, and nothing gave him more joy than discussing the day's results with him. They didn't need to agree on every definition to agree on what mattered: the work, the rigor, and the love for the puzzle.

  He knew that eventually, the molecules stop moving. He accepted that. He didn't look for a grand narrative in it. He looked for the consequence.

  So, how do we honor him? We don't need to solve the puzzle he spent his life examining. We just need to follow his example. We check the control. We question the easy answer. We treat the world as it is, not as we wish it to be. And we remember that the most important thing a person can leave behind isn't a message, or a plan, or a script.

  It's the difference they made.

  Thank you.
