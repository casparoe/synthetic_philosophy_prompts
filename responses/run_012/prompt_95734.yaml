  I recommend we sustain the complaint, issue a private reprimand, and require the member to send a corrective letter to the client within 30 days. Additionally, I propose we adopt an interpretive standard establishing that literally true statements constitute misrepresentation when reasonably likely to convey a false impression regarding material facts.

  The member's assertion that funds could be withdrawn "at any time" was semantically true but pragmatically false. In the context of retirement planning, liquidity implies access to principal without penalty. By omitting the surrender charge while affirming access, the member created a false impression of cost-free liquidity. This is "paltering": using truth to deceive. The client felt deceived because she was. Research confirms that palterers feel ethical while victims feel equally deceived as if lied to. Our Code requires truthfulness; that duty extends to the impression conveyed, not just the syntax used.

  The defender argues that policing implications chills ordinary tact, negotiation, and confidentiality. They contend that meaning is too subjective to regulate and that members cannot protect confidential information or negotiate fees without fear of violation. This is the strongest argument against us. If we punish every unfortunate implication, members cannot negotiate fees or protect confidential data without fear. However, this case does not involve tact or confidentiality; it involves material financial cost. We can distinguish between social lubrication and material deception. The Code's silence on a "duty to disclose" protects mere silence, not affirmative statements designed to mislead.

  Therefore, I propose the following interpretive standard: "A member misrepresents a material fact not only by making false statements but by making true statements reasonably likely to create a false impression concerning material costs, risks, or limitations."

  This standard reaches affirmative statements that distort material reality. It does not reach mere silence where no duty to disclose exists, nor does it cover sales puffery, social pleasantries, or the withholding of confidential information absent an affirmative misleading claim. For example, declining to answer a question to protect confidentiality remains permissible; answering truthfully but selectively to imply the opposite is not.

  The study on paltering notes that deceivers feel ethical while victims feel deceived. We must align our rules with the victim's reasonable understanding, not the speaker's technical defense. Truthfulness requires honesty in conveyance, not just syntax.

  Vote yes on the finding and the standard.
