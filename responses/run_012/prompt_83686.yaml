answer: |-
  Here is the verdict before you start: **The Internalist/Action-Guiding Objection lands.**

  Her position relies on a factive notion of knowledge (you have to *actually* know for the rule to apply). But norms of reasoning are supposed to help you decide what to do *now*, from your current perspective. If you cannot distinguish "knowing" from "feeling certain" from the inside, her rule ("ignore counter-evidence if you know") is useless as a guide for action. It turns epistemology into a retrospective metaphysical label rather than a tool for thinking. The conspiracy theorist reply ("they don't know") is technically consistent but practically vacuous because it offers no way for the agent to avoid being the conspiracy theorist.

  Here are 8 questions with specific follow-ups designed to corner her on this, covering all the topics you requested.

  ### 1. The Internal Distinction
  **Q:** You say the dogmatist is allowed to ignore counter-evidence because they *know*, and the conspiracy theorist isn't because they *don't* know. But from the inside, my mental state feels the same in both cases. If I can't tell the difference between knowing and merely being confident, how does your rule help me decide whether to listen to the evidence right now?
  **Follow-up:** If you say "It doesn't help you decide, it just describes the norm," then aren't you admitting that epistemology has nothing to say to the agent at the moment of deliberation? What use is a traffic law that you can only read after you've already driven through the intersection?

  ### 2. The "Bad Evidence" Distinction
  **Q:** You distinguish between evidence about the world (the cat is on the mat) and evidence about my believing (I was tired when I looked). If I find out I had a fever when I formed the belief, that's evidence against my knowledge. Does your dogmatism allow me to ignore *that* evidence too?
  **Follow-up:** If you say I can't ignore evidence about my own reliability, aren't you admitting that the "ignore counter-evidence" rule has a massive hole? Because almost all counter-evidence comes packaged as "your process was flawed," which seems like evidence about you, not the world.

  ### 3. Scope and Cognitive Load
  **Q:** I know a lot of things. Does your principle mean I am entitled to ignore counter-evidence for *all* of them simultaneously? If a skeptic comes along and challenges my entire worldview, am I permitted to just shut my ears to everything?
  **Follow-up:** If you say "Only for the ones you actually know," we're back to the first problem: I don't have a list of "things I actually know" stamped on my forehead. How do I filter which evidence to ignore without checking every single belief first?

  ### 4. Knowledge vs. Justified Belief
  **Q:** Does this paradox work if we swap "knowledge" for "justified belief"? If I'm justified, can I ignore evidence? If you say no, isn't that proof that the paradox isn't about reasoning, but just about the factivity of the word "know"?
  **Follow-up:** If it only works because knowledge entails truth, then isn't the "permission to ignore" just a trivial logical consequence of being right? Why call it a norm of reasoning if it's just a byproduct of being factually correct?

  ### 5. The Conspiracy Theorist's Defense
  **Q:** A conspiracy theorist hears your talk and says, "I *do* know the earth is flat, so I'm ignoring your NASA photos." You say they're wrong because they don't know. But since they reject your evidence, they reject your proof that they don't know. How do you break that circle without begging the question?
  **Follow-up:** If the only way to prove they don't know is to show them the evidence they're ignoring, but your rule says they're allowed to ignore it, haven't you made knowledge impossible to lose but also impossible to verify?

  ### 6. The Surprise Exam Parallel
  **Q:** In the Surprise Exam Paradox, students reason that the exam can't happen, which makes it happen. They use logic to eliminate a possibility. Is your dogmatist using the same move—using logic to eliminate the possibility of misleading evidence?
  **Follow-up:** In the Exam case, the reasoning defeats itself. If your dogmatism says "I know, so evidence against it is false," isn't that self-defeating too? Because the evidence is the very thing that would test if the knowledge was real in the first place.

  ### 7. Defeaters and Downgrading
  **Q:** Let's say I know you're in the room. Then I hear a rumor that there's a hologram projector in the corner. I don't know if it's on. Do I have to ignore the rumor? Because if the projector is on, I don't know you're here.
  **Follow-up:** If you say I have to investigate the projector, then I'm not ignoring counter-evidence, I'm chasing it. So the "permission to ignore" only kicks in *after* I've already done the work to rule out defeaters. So what work is the dogmatism actually doing?

  ### 8. The Normative Force (The Killer)
  **Q:** Epistemology is supposed to tell us how we *ought* to think. If your view says "You ought to ignore evidence if you know," but I can never be certain I know, then I can never be certain I ought to ignore evidence. Doesn't this make your norm psychologically impossible to follow?
  **Follow-up:** So are you arguing that we should strive to be in a state where we stop listening to others? Because if knowledge is the point where inquiry stops, isn't the ideal philosopher just someone who stops asking questions as fast as possible?

  ### Strategy Note for the Host
  When she answers, she will likely lean on **Externalism** (the idea that what matters is whether you *actually* know, not whether you *think* you know).

  **Your counter-move:** Press that **Externalism kills Normativity**. If the rule depends on facts I can't access (whether I *actually* know), then it's not a rule for *me*. It's a rule for a god looking over my shoulder. If epistemology can't guide the agent, it's just taxonomy, not philosophy. Stick to Q1 and Q8 if you run out of time; those are the ones that expose the practical emptiness of her position.
