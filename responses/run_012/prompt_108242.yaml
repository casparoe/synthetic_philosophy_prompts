answer: |-
  # Procedure: Strategy-Stealing Validity Check

  **Purpose:** To determine if you may honestly claim "First Player Win" in your design notes based on the strategy-stealing argument.
  **Time Required:** ~20 minutes.
  **Prerequisites:** The rulebook for the game in question.

  ## 1. The Checklist

  Run these checks in order. If any check returns **FAIL**, stop immediately and record the result as **NO**.

  **Check 1: Basic Structure**
  *   **Question:** Is the game strictly for two players, with perfect information (no hidden cards/hands), no random elements (no dice/coins), and a guaranteed end (no infinite loops)?
  *   **Pass:** Yes to all.
  *   **Fail:** No to any.
  *   **Sufficiency:** Establishes the game is a candidate for deterministic analysis.
  *   **Limitation:** Does not check fairness or win conditions.

  **Check 2: Symmetry**
  *   **Question:** If you swapped the colors/identities of the two players at the start of the game (before the first move), would the rules and win conditions remain exactly the same?
  *   **Pass:** Yes. The board, moves, and goals are identical for both sides.
  *   **Fail:** No. (e.g., Player 1 needs to connect North-South, Player 2 needs to connect East-West *on a non-square board*, or players have different piece sets).
  *   **Sufficiency:** Ensures neither player has a structural advantage other than move order.
  *   **Limitation:** Does not account for advantages created *during* play, only the starting setup.

  **Check 3: The Draw Condition**
  *   **Question:** Is it impossible for the game to end in a draw? (This must be a rule impossibility or a logical certainty, not just "unlikely".)
  *   **Pass:** Yes. The rules state play continues until a win, or logic dictates a win must occur (e.g., the board fills and someone must have connected).
  *   **Fail:** No. The rules allow for a draw, or it is possible for the board to fill without a winner.
  *   **Sufficiency:** This is critical. If draws are possible, the argument can only prove "First Player cannot lose," not "First Player wins."
  *   **Limitation:** Requires you to be certain. If you are guessing, mark as Fail.

  **Check 4: The "Extra Piece" Test**
  *   **Question:** Imagine you are playing, and you magically have one extra piece of your color already on the board that you did not have to spend a turn to place. Could that extra piece ever block your own win or force you to lose a game you would otherwise win?
  *   **Pass:** No. Having more pieces on the board is strictly neutral or helpful.
  *   **Fail:** Yes. (e.g., If you need to form a line of *exactly* 5, a 6th piece ruins it. Or if your own pieces block your movement paths).
  *   **Sufficiency:** Ensures the "stolen strategy" works even if the "extra move" occupies a spot the strategy wanted to use.
  *   **Limitation:** **[Judgment Call]** Requires you to intuitively verify that your pieces never interfere with your own goals.

  **Check 5: The "Extra Move" Test (for non-placement games)**
  *   **Question:** If the game does not involve placing pieces (e.g., removing items, moving tokens), does having the turn (making a move) ever force you into a losing position you could have avoided by passing?
  *   **Pass:** No. Making a move is never a disadvantage compared to skipping a turn.
  *   **Fail:** Yes. (e.g., In games where the last player to move loses, being forced to move can be fatal).
  *   **Sufficiency:** Adapts the "Extra Piece" logic to games where pieces are not placed.
  *   **Limitation:** **[Judgment Call]** Requires understanding if "Zugzwang" (being forced to move hurts you) is possible.

  ---

  ## 2. Stopping Points & Outcomes

  *   **STOP -> NO:** If **any** check fails.
      *   *Meaning:* You cannot claim "First Player Win" based on this argument. The argument might still prove "First Player cannot lose" (if only Check 3 failed), but it does not prove a win.
  *   **STOP -> YES:** If **all** checks pass.
      *   *Meaning:* A winning strategy for the First Player *exists*.
      *   *Constraint:* This does **not** tell you what the strategy is. It does **not** tell you how long the game takes. It does **not** guarantee the game is fun or balanced.

  ---

  ## 3. Judgment Calls

  The following steps rely on your design intuition rather than a mechanical test. Mark these in your notes if you had to reason through them.

  1.  **Check 3 (Draw Certainty):** Unless the rules explicitly forbid draws, you must judge if a draw is logically impossible.
      *   *Depends on:* Your ability to visualize end-states. If you aren't 100% sure, treat it as a Fail.
  2.  **Check 4 (Piece Interference):** You must judge if your own pieces can obstruct your own victory.
      *   *Depends on:* The win condition. (Connection goals usually pass; "Exact count" goals usually fail).
  3.  **Check 5 (Move Disadvantage):** You must judge if being forced to act is ever bad.
      *   *Depends on:* The win condition (Normal play vs. Misère play).

  ---

  ## 4. What The Result Yields

  *   **If YES:** You have proved **Existence Only**. You know a win is possible for Player 1, but you do not have the moves. You cannot claim the game is "solved" in a playable sense.
  *   **If NO:** The argument provides **No Information**. Player 1 might still win, or Player 2 might win, or it might be a draw. You simply cannot use this specific logical tool to decide.

  ---

  ## 5. Procedure Execution Log

  Below is the record of running this procedure on three specific game cases.

  ### (a) Hex
  *   **Check 1 (Basic):** Pass. (2 players, perfect info, no chance, finite).
  *   **Check 2 (Symmetry):** Pass. (Both players connect opposite edges; board is symmetric relative to goals).
  *   **Check 3 (Draw):** Pass. (It is a known logical fact that Hex cannot end in a draw; a chain must exist).
  *   **Check 4 (Extra Piece):** Pass. (Having more stones helps build connections; a stone never blocks your own path in Hex).
  *   **Check 5 (Extra Move):** N/A (Placement game).
  *   **Outcome:** **YES**.
  *   **Note:** You may assert "First Player Win." Do not claim to know the opening move.

  ### (b) Cornerstone (6x6, 2x2 block win, draw possible)
  *   **Check 1 (Basic):** Pass.
  *   **Check 2 (Symmetry):** Pass.
  *   **Check 3 (Draw):** **FAIL**.
      *   *Reason:* The rules explicitly state: "if the grid fills with neither player having done so, the game is a draw."
  *   **Outcome:** **NO**.
  *   **Note:** You **cannot** assert "First Player Win." The strategy-stealing argument can only prove "First Player can force a Win or Draw." Since a draw is possible by rule, the "Win" claim is unsupported by this argument.

  ### (c) Passing Stones (7 stones, remove 1-2, last stone loses)
  *   **Check 1 (Basic):** Pass.
  *   **Check 2 (Symmetry):** Pass.
  *   **Check 3 (Draw):** Pass. (The pile must empty).
  *   **Check 4 (Extra Piece):** N/A (No pieces placed).
  *   **Check 5 (Extra Move):** **FAIL**.
      *   *Reason:* This is a "Misère" game (last player to move loses). Having the turn can be a disadvantage. If you are forced to take the last stone, making a move causes you to lose. The strategy-stealing argument requires that making a move is never worse than not making a move.
  *   **Outcome:** **NO**.
  *   **Note:** You **cannot** assert "First Player Win." In fact, for this specific game size (7 stones), the Second Player has a guaranteed win. The argument fails because the "extra move" logic breaks when the goal is to *avoid* taking the last item.

  ---

  ## 6. Limitations & Warnings

  **Where this procedure silently misfires:**
  *   **Hidden Asymmetry:** Some boards look symmetric but favor one player due to geometry (e.g., odd-sized boards where center control matters differently). Check 2 might pass visually but fail mathematically.
  *   **Complex Draw Logic:** You might assume "no draw" because it feels unlikely, but a theoretical loop or stalemate exists. If Check 3 is a guess, the result is unreliable.
  *   **Subtle Interference:** In complex games, an extra piece might not block a win directly but might restrict future options in a way that turns a win into a loss. Check 4 relies on your intuition; it is not a proof.

  **Mistakes you are most likely to make:**
  *   **Confusing "Non-Loss" with "Win":** If Check 3 fails (draws possible), the argument proves Player 1 can avoid losing. It does **not** prove Player 1 wins. Do not write "First Player Win" in your notes if Check 3 failed.
  *   **Ignoring Misère Conditions:** If the last player to move loses (like in Passing Stones), Check 5 will almost always fail. Do not apply this argument to "Last Player Loses" games.
  *   **Overconfidence:** A "YES" result tells you nothing about *how* to play. It does not help you balance the game for human enjoyment. A game can be a theoretical First Player Win and still be a good hobby game if the win is too hard for humans to find.

  **Questions you must decide yourself:**
  *   **Is the game fun?** The argument says nothing about quality.
  *   **What is the opening move?** The argument proves a win exists but hides the strategy. You will still need playtesting to find good openings.
  *   **Is the "No Draw" claim true?** Unless it is a standard result (like Hex), you are responsible for verifying that your specific ruleset makes a draw impossible.
