answer: |-
  To the Legislature of the Free State of Oria, I submit this annual report of the Sentencing Commission pursuant to the requirements of the Statute of Proportional Justice. It is the duty of this Commission to ensure that every sentence imposed within our jurisdiction reflects solely the culpability of the offender and the gravity of the wrong committed, without regard for the future conduct of the defendant or the utility of the punishment to the state. In fulfilling this mandate, we have adhered strictly to our internal drafting standard which prohibits the vocabulary of effectiveness in our official documents. To describe punishment as a means to an end is to concede the argument to those who view justice as a tool of social engineering rather than a moral imperative. We do not seek outcomes. We seek balance.

  The primary difficulty facing the Commission this year remains the calibration of the cardinal scale required for custodial terms. The Statute dictates that graver offences must receive heavier penalties, providing an ordinal ranking of wrongs, but it offers no mathematical formula to convert moral gravity into months of confinement. We continue to anchor our scaling unit to the legacy sentence for aggravated larceny as it stood under the prior code, a term of five years. Critics argue that this anchor is arbitrary, as the previous code was informed by consequentialist reasoning now deemed illegitimate. We concede that the number five cannot be derived from moral truth itself. There is no metaphysical fact that dictates a specific duration of confinement for a specific wrong. However, to object to this arbitrariness is to commit a category mistake. The function of the anchor is not to be true in an absolute sense but to provide a fixed point of reference against which proportionality can be measured. Without an arbitrary baseline, there is no scale, and without a scale, there is no justice. We must choose a number to begin the work of justice, and the legacy sentence is the only available datum that does not rely on forbidden speculative futures.

  This commitment to principle was tested by the pending petition for compassionate release filed on behalf of Inmate Varrick. Sentenced thirty years ago for arson resulting in death, Varrick is now terminally ill and, by all accounts, no longer possesses the character that led to the offence. Under the previous regime, his release would have been warranted on the grounds that he poses no danger to the public and that further confinement serves no rehabilitative purpose. Our doctrine permits release only if the desert itself has altered. Since desert is fixed by the act at the time of commission, it cannot be diminished by illness or moral regeneration that occurs subsequent to the wrong. To release Varrick would be to declare that the debt incurred by the victim and the political community has been satisfied when it has not. I acknowledge the hardship this causes, and I acknowledge that the language of debt feels strained when applied to a dying man who cannot pay. Yet, to forgive the debt because payment is difficult is to prioritize mercy over justice. The injury remains standing regardless of the capacity of the injurer to endure the remedy. We denied the petition not because it would be unsafe to release him, but because it would be unjust to let the balance remain unsettled.

  Regarding the appropriation request for the upcoming fiscal year, I anticipate the Legislature's concern regarding the cost of maintaining the current incarceration levels. You ask what this expenditure buys. It buys nothing. It is not an investment in public safety or a purchase of reduced crime rates. To frame the budget in terms of return on investment is to treat the punishment of the guilty as a service procurement rather than a duty of the state. An unpunished wrong is a standing injury to the political community, a fracture in the moral order that exists independently of its economic efficiency. We request the funds not because they are useful, but because they are necessary to discharge the obligation the state owes to the law. I recognize that a consequence-based calibration would dissolve these difficulties at a stroke. If we were permitted to sentence based on risk and cost, we could release Varrick, lower the anchor, and reduce the budget without violating any empirical metric of success. It would be simpler. It would be kinder. It would also be a lie. We cannot justify punishment by what it achieves, only by what it is. I urge you to approve the appropriation on the understanding that justice is an end in itself, costly and unavoidable.
