prompt: |-
  Last night my friend and I burned two hours arguing about whether technology is neutral. He kept saying a tool is just a tool and it's all in how people use it; I kept saying some designs push you toward one politics before anyone even uses them. We were both a bit drunk and got nowhere, so I want to send him a short story that makes the point without sounding like a lecture.

  Write a ~1300-word short story set in a near-future mid-size city that has just rolled out what the vendor calls PACE: pedestrian adaptive crossing efficiency. The crosswalks use cameras and reinforcement learning to set crossing times in real time. The stated objective is to minimize total delay for everyone, but the training data comes from a decade of old sensor logs, and the model keeps giving longer waits to intersections near the new stadium and shorter waits to a few blocks in the older part of town. Please invent the city and the device; don't use any famous historical example like a bridge built to keep buses out. Follow at least three people: a city engineer who believes the system is neutral because it just optimizes a number, a disability activist who notices what the model is doing, and a delivery driver who benefits from it at first. Include a scene where residents figure out how to game the system in a way the designers didn't intend, so it's not a simple story about a machine forcing one outcome. Don't have anyone give a speech explaining the debate. Let the politics show up in who waits, who gets through, and what the engineer can't bring herself to log as a bug.

  After the story, give me a brief structured summary as a JSON object with these fields: title, artifact, design_choice_that_embeds_values, who_benefits, who_is_harmed, determinist_reading, social_shaping_reading, scene_where_users_repurpose_the_artifact, unresolved_question. Keep each field to one or two sentences. No bibliography, no citations, no names of real theorists.
