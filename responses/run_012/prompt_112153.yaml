answer: |-
  **MEMORANDUM**

  **TO:** Appraisal Panel Chair, Finance Director, Panel Members
  **FROM:** Policy Analysis Unit
  **SUBJECT:** Procedure for Assessing Requests to Defer Decision for Further Evidence
  **DATE:** 24 May 2024

  ### 1. Theoretical Preamble: Settled Mathematics vs. Contested Application

  Before adopting the procedure below, the Panel must understand the status of the argument currently being used to justify deferral (Good's Theorem).

  **Settled Mathematics:**
  It is mathematically true that for a *single* rational agent maximising *expected utility*, with *fixed* preferences and priors, the Expected Value of Sample Information (EVSI) is non-negative, provided the information is **free** and the agent **must** act optimally on the result.

  **Contested Application:**
  Applying this theorem to a public health board involves at least four substantive leaps that are not mathematical deductions but policy judgments. Competent analysts may disagree on these points:
  1.  **Cost:** Evidence is rarely free. It costs money, time, and opportunity. The theorem only holds if $EVSI > Cost of Information$.
  2.  **Agency:** The Panel is a committee, not a single agent. Priors and preferences shift as membership changes or political pressure mounts. There is no guarantee a future Panel will act on the new evidence.
  3.  **Intervention:** Gathering evidence (e.g., a pilot) alters the system being measured (the Hawthorne effect) and diverts resources from current services.
  4.  **Utility:** "Expected Utility" implies a agreed-upon metric of value. In public health, efficiency, equity, and access are often incommensurable. Deferring for evidence is often a way to avoid making a value trade-off.

  **Analyst Discretion:**
  The procedure below operationalises these constraints. A different analyst might weight the "Cost of Delay" differently or assess the "Decisiveness" of evidence more optimistically. This procedure represents a conservative interpretation designed to prevent paralysis, aligned with the Finance Director's requirement for fiscal discipline and the Board's duty of care.

  ---

  ### 2. The 10-Minute Procedure (The VOI-Check)

  When a motion to defer is moved to commission further evidence (pilot, survey, model, audit), the Chair must pause the debate and run the following five questions.

  **Instruction:** If data is missing, use order-of-magnitude estimates (Low/Med/High). If the answer to any question triggers a **STOP**, the motion to defer is rejected, and the Panel must vote on the substantive proposal using current information.

  #### Question 1: The Cost of Looking
  **Ask:** "What is the total cost of this evidence, including direct spend, staff time, and the cost of delay to the service?"
  *   **Sufficient Answer:** A specific budget figure plus an estimate of months lost.
  *   **Threshold:** If Cost > 5% of the proposed change's annual budget OR Delay > 3 months.
  *   **Action:** If Threshold Met → **STOP**. Proceed to decision on current data. (Rationale: EVSI is unlikely to exceed high costs in a resource-constrained environment).
  *   **Missing Data:** Finance Director to provide an immediate rough order of magnitude.

  #### Question 2: The Decisiveness Test
  **Ask:** "Is there a plausible result from this evidence that would change the Panel's decision from 'Yes' to 'No' (or vice versa)?"
  *   **Sufficient Answer:** Identification of a specific metric and threshold (e.g., "If pilot readmission rates exceed X%").
  *   **Threshold:** If the answer is "No," or "It depends on how we interpret it," or "It will inform the decision but not determine it."
  *   **Action:** If Threshold Met → **STOP**. (Rationale: Information that cannot change the action has zero value).
  *   **Value Hand-off:** If members disagree on what would change their mind, this is a values conflict, not an evidence gap. The Chair must call for a vote on the substantive proposal.

  #### Question 3: The Commitment Test
  **Ask:** "Does this Panel bind itself to act on the findings of this new evidence?"
  *   **Sufficient Answer:** A formal motion stating, "If Result X is found, we will implement Y."
  *   **Threshold:** If the answer is "We will consider it alongside other factors" or "A future Panel will decide."
  *   **Action:** If Threshold Met → **STOP**. (Rationale: Violates the 'single agent' assumption of the theorem. If we won't commit to acting, the information has no decision value).
  *   **Value Hand-off:** This requires a governance decision. The Chair must confirm whether the Board's constitution allows binding future meetings.

  #### Question 4: The Intervention Effect
  **Ask:** "Will running this pilot or audit change the performance of the service while it runs?"
  *   **Sufficient Answer:** Acknowledgement of resource diversion or behavioural change (e.g., "Staff will work harder during a pilot").
  *   **Threshold:** If the pilot requires extra staff, extra funding, or heightened scrutiny not available at roll-out.
  *   **Action:** If Threshold Met → **STOP**. (Rationale: The evidence will be biased and not generalisable. The cost is incurred for invalid data).
  *   **Analyst Note:** Pilots are notoriously prone to this. Modelling and audits are less so.

  #### Question 5: The Value Mask
  **Ask:** "Is the uncertainty technical (we don't know the numbers) or ethical (we don't agree on the goal)?"
  *   **Sufficient Answer:** Consensus on whether the blocker is data or values.
  *   **Threshold:** If the disagreement is about equity, access, or risk tolerance rather than clinical efficacy or cost.
  *   **Action:** If Threshold Met → **STOP**. (Rationale: Evidence cannot resolve value conflicts. Deferring is an abdication of governance).
  *   **Value Hand-off:** This must be handed to the Chair to frame as a policy choice, not an analytical one.

  ---

  ### 3. Application to Current Cases

  Below is the application of the VOI-Check to the three proposals currently causing deferral.

  #### Case A: Pilot of New Triage Model (Two Sites)
  *   **Q1 (Cost):** **High.** Requires IT integration, training, and 6-month run-time. Delay to regional roll-out: 9 months. **Threshold Met.**
  *   **Q2 (Decisiveness):** **Low.** Two sites cannot represent regional variance. Even if successful, scaling risks remain. If failed, is it the model or the site?
  *   **Q3 (Commitment):** **Unclear.** No motion to bind the Board to roll-out if successful.
  *   **Q4 (Intervention):** **High.** Pilot sites will receive extra support ("pilot premium"), making results non-generalisable.
  *   **Q5 (Value):** **Mixed.** Concerns are about workload (technical) and staff morale (value).
  *   **Verdict:** **REJECT DEFERRAL.**
  *   **Reasoning:** Fails Q1 and Q4 decisively. The cost of delay and the "pilot premium" invalidate the data quality. The Finance Director should note the sunk cost of the pilot setup against the budget for roll-out.
  *   **Recommendation:** Proceed to regional roll-out with robust *monitoring* (audit), not a *pilot*. Monitoring observes; pilots intervene.

  #### Case B: Patient Survey Before Closing Small Unit
  *   **Q1 (Cost):** **Medium.** Commissioning survey takes 3 months. Delay: 3 months.
  *   **Q2 (Decisiveness):** **None.** Patients almost universally oppose local unit closure regardless of clinical safety data. It is implausible a survey would recommend closure.
  *   **Q3 (Commitment):** **No.** Panel reserves right to close based on clinical safety even if survey opposes.
  *   **Q4 (Intervention):** **Low.** Surveying does not change clinical activity.
  *   **Q5 (Value):** **High.** This is a conflict between Access (local convenience) and Safety/Efficiency (centralisation).
  *   **Verdict:** **REJECT DEFERRAL.**
  *   **Reasoning:** Fails Q2 and Q3. The survey is not being commissioned to inform a decision, but to legitimise a pre-determined one or to delay a difficult one. This is a Value Mask (Q5).
  *   **Recommendation:** Acknowledge the value conflict. Vote on the closure based on clinical safety and financial sustainability. Use existing consultation feedback rather than commissioning new surveys.

  #### Case C: Stroke Service Reconfiguration (Pending Modelling)
  *   **Q1 (Cost):** **Low/Medium.** Analyst time and software. Delay: 2 months.
  *   **Q2 (Decisiveness):** **Medium.** Modelling might refine travel times or hyper-acute hub boundaries. Unlikely to overturn the need for centralisation entirely.
  *   **Q3 (Commitment):** **Yes.** Panel agrees to follow the optimal model output.
  *   **Q4 (Intervention):** **Low.** Modelling does not affect current patient care.
  *   **Q5 (Value):** **Low.** Consensus exists that clinical outcomes (survival/function) are the primary utility.
  *   **Verdict:** **CONDITIONAL ACCEPTANCE (with caveats).**
  *   **Reasoning:** This is the only case that passes most checks. However, it fails the "Cost of Delay" test if the delay is >2 months.
  *   **Analyst Note:** You suspected this would come out against the cautious option. It does not, *provided* the modelling is quick. However, if the modelling becomes a "perfect the model" exercise, it fails Q1.
  *   **Recommendation:** Allow the modelling *only* if delivered within 4 weeks. If the modellers require 6 months, reject the deferral and decide on the current draft model. The risk of service deterioration (stroke outcomes) accumulates daily; the marginal gain in model precision diminishes rapidly.

  ---

  ### 4. Implementation Notes for the Chair and Analyst

  **For the Chair:**
  *   **Casting Vote:** If the VOI-Check triggers a **STOP**, but a member still moves to defer, treat this as a motion to ignore the procedure. Require a seconder and call the vote immediately.
  *   **Values:** When Q5 is triggered, do not ask for "more data." Ask: "Are we willing to accept higher risk for better local access?" Force the value trade-off into the minutes.

  **For the Finance Director:**
  *   **Costing:** You have veto power on Q1. If a pilot requires unbudgeted spend, the answer is automatically "Cost > Threshold."
  *   **Sunk Costs:** Be alert to proposals where the "evidence" is actually a way to spend remaining budget before the financial year ends.

  **For the Analyst (Me):**
  *   **Missing Numbers:** In the meeting, if precise costs are unknown, I will state: "On order of magnitude, this is a £100k+ question." This is sufficient for the VOI-Check.
  *   **Disagreement:** If Panel members argue that "Information has intrinsic value" (e.g., for public trust), I will record this as a **Value Judgment**, not a mathematical fact. It must be weighed against the cost of delay explicitly.

  **Closing Remark:**
  Good's Theorem is a bound, not a mandate. It tells us we *can* look, not that we *must*. In a public body, the cost of looking is paid by the patient waiting for the service. This procedure ensures we only pay that price when the purchase is guaranteed to change the outcome.
