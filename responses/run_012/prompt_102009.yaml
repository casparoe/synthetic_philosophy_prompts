  10. **Final Review against constraints:**
      *   12 minutes? Yes.
      *   Whitehead shaped, not name-dropped? Yes.
      *   Honest hedges? Yes.
      *   Audience balance? Yes.

  *(Self-Correction on Word Count)*: Speaking rate is usually 130-150 words per minute. 12 minutes = 1560 - 1800 words. I need to make sure I don't write too little. I will aim for around 1700 words.

