answer: |-
  Good morning. If you could all find a seat… and if you could all check that your coffee cups are on the table and not on the floor, that would be great.

  I know where we are in the schedule. We've had the coffee. We've survived the icebreaker where we had to share our "teaching superpower." (For the record, mine is "finding the projector remote in under thirty seconds," which feels less like a superpower and more like a baseline expectation, but here we are.)

  I'm a fifth-year PhD student in Philosophy of Education. I was asked to give these opening remarks, and when the Teaching Center sent over the prep sheet, I saw the framework they want us to use today: **Hook, Drill, Apply.**

  Get them excited. Make them practice the steps. Let them use it.

  It's a clean model. It's practical. And for a Saturday morning training, it makes sense. But I want to start this day by admitting something to you, and to the faculty in the back who know exactly where I'm going with this. That three-step loop is a simplification of a much older, messier, and I think more vital idea about how learning actually happens.

  The handout treats teaching like a recipe: you add the hook, stir in the drill, serve with application. But learning isn't baking a cake. It's more like growing a garden, or learning a language, or mastering a lab technique. It breathes.

  The philosopher Alfred North Whitehead, in his 1929 book *The Aims of Education*, described this as the **Rhythm of Education**. He called the stages **Romance, Precision, and Generalization**.

  You can map "Hook" to "Romance," "Drill" to "Precision," and "Apply" to "Generalization." But if we treat them as a one-time checklist, we risk the very thing Whitehead warned us against: **Inert Ideas.**

  So, for the next twelve minutes, I want to walk through this rhythm with you. Not as a rule you have to follow, but as a tension you get to navigate.

  **First: Romance.**

  Whitehead defines Romance as the stage of first apprehension. It's the moment the subject discloses itself as having unexplored connections. It's not just "fun." It's not just "engagement."

  For the chemistry TAs in the room: Romance isn't putting a cartoon on the slide. Romance is the moment a student looks at a titration curve and realizes, "Wait, this line tells me exactly when the reaction is done. It's a story about change."

  For the humanities TAs: Romance isn't just reading the poem aloud. It's the moment a student realizes that a text written 200 years ago is arguing with something they believe right now.

  The danger here, and the place where the handout is a little too neat, is that Romance isn't just the first five minutes of class. Whitehead argues that Romance is the *soil* in which Precision grows. If you skip the wonder, if you skip the "why does this matter?" phase, you aren't just boring the students. You are setting them up to fail the next stage.

  **Which brings us to Precision.**

  This is where I need to be careful, because I know the Teaching Center worries that "theory" people sometimes treat structure as the enemy. I don't. Whitehead didn't.

  Precision is the grammar. It is the exactness. In bio, it's the pipetting technique that ensures the data is real. In philosophy, it's the distinction between "valid" and "sound." In history, it's the date, the citation, the primary source verification.

  Whitehead says Precision is inevitable. You cannot have a disciplined mind without it. But here is the friction point: **Precision without Romance is barren.**

  If you ask students to memorize the periodic table without them ever seeing an element react, that is barren. If you ask them to memorize a citation style without them ever trying to join a conversation, that is barren.

  But—and this is for my fellow grad students in the front rows—**Romance without Precision is just vibes.**

  I see this in discussion sections. We want students to feel safe, to share, to explore. That's Romance. But if we don't give them the tools to analyze their own claims, if we don't demand they define their terms or check their data, we haven't taught them anything. We've just hosted a nice conversation. Precision is the gift of grip. It's how they hold onto the idea when the class is over.

  **Now, the Hedge.**

  I need to pause here and be honest about the scholarship, because there are faculty in the back watching to see if I'm misusing Whitehead.

  Whitehead is clear that these stages exist. He is *not* clear on the timeline. This is a genuine point of contention among educators who study process philosophy.

  The handout implies you do Hook, then Drill, then Apply in a single 50-minute lesson. Whitehead talks about the rhythm occurring over a lifetime, a degree, a semester, *and* a lesson.

  Some scholars argue that you can cycle through all three in a single class period. Others argue that Romance might take three weeks, Precision might take six, and Generalization might take the rest of the term. There is no settled science on the "duration" of the stages.

  So, when you look at your lesson plans today, don't panic if you can't fit the whole universe into 50 minutes. But do ask yourself: *Where is my class in the rhythm?*

  If you are in a week of heavy Precision—lots of grammar, lots of lab safety protocols, lots of rules—acknowledge that. Tell the students, "We are in the Precision phase. It feels dry. That's because we are building the tools we need for the next discovery."

  Legitimizing the struggle of Precision is better than pretending it's a "Hook."

  **Finally: Generalization.**

  This is the "Apply" on your handout, but it's deeper. Generalization is the return to Romance, but with the tools of Precision in hand.

  It's when the student uses the pipetting technique to design their own experiment. It's when the student uses the citation style to write a paper that argues something new.

  Whitehead's warning about **Inert Ideas** lives or dies here. An inert idea is one that is received into the mind without being used, or tested, or thrown into fresh combinations.

  If a student passes your exam but never uses that knowledge again, it was inert. If they can solve the problem set but can't explain why the reaction matters, it was inert.

  Generalization is the antidote to inertia. It is the moment the knowledge becomes *theirs*.

  **So, what do I want you to do with this?**

  I am not asking you to throw away the "Hook-Drill-Apply" sheet. It is a useful scaffold. The Teaching Center knows what they are doing; they are giving you a map for the terrain.

  But I am asking you to treat the map as a living thing.

  When you are planning your sections this week:

  1.  **Check for Romance:** Are you starting with a question, or just an agenda? If you start with the agenda, you've already lost the room.
  2.  **Respect Precision:** Don't apologize for rigor. Don't say, "I know this grammar is boring." Say, "This grammar is the key that unlocks the rest of the field."
  3.  **Demand Generalization:** Don't let them leave until they've done something with the idea. Not just repeated it. *Used* it.

  And to the Teaching Center staff, and the faculty here: I know this makes assessment harder. It is easier to test Precision than it is to test Generalization. It is easier to measure if they know the definition than if they understand the implication.

  Whitehead scholars debate whether Generalization can be standardized at all. I don't have the answer to that. But if we only test Precision, we will only teach Precision. And then we produce students who can pass the test but cannot think.

  **A Final Thought.**

  I'm a fifth-year student. I've TA'd for six semesters. I have made every mistake I'm warning you against. I have taught lessons that were all Romance and no grip, where students left feeling good but knowing nothing. I have taught lessons that were all Precision, where I was the sage on the stage reciting rules while eyes glazed over.

  It is hard to get the rhythm right. It requires you to read the room. It requires you to know when to push for accuracy and when to step back and let them wonder.

  But if you can catch that rhythm, even for a moment, it changes the work. It stops being about "covering material" and starts being about lighting fires.

  Whitehead ends *The Aims of Education* with a line that I think is worth stealing for today. He says, "There is only one subject-matter for education, and that is Life in all its manifestations."

  You are not teaching chemistry. You are teaching chemists.
  You are not teaching history. You are teaching historians.
  You are not teaching content. You are teaching people how to live with that content.

  The handout gives you the steps. But the rhythm? That's up to you.

  Welcome to the semester. Let's get to work.
