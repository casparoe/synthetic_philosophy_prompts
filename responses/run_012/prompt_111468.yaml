answer: |-
  # THE COMPOSITION TREE
  **When do some things add up to a further thing?**

  **Instructions:** Start at the top. Answer each question based on your intuition about the case described. Follow the arrow that matches your answer. Ignore philosophical labels; just say what you think is true.

  ***

  **1. THE FUSED GLASS**
  Lightning strikes a heap of sand, fusing the grains into a single lump of glass.
  **Do the sand grains now compose one single object (the lump)?**
  *   **NO** → Go to **Leaf 1**.
  *   **YES** → Go to Question 2.

  **2. THE SCHOOL ASSEMBLY**
  Everyone in your school is standing in the gym.
  **Do all these people compose one single object (a "school-thing"), just as much as the glass lump is one object?**
  *   **YES** → Go to Question 7 (Status).
  *   **NO** → Go to Question 3.

  **3. THE LICHEN & SLIME MOULD**
  A lichen is a fungus and an alga living as one. A slime mould aggregates from separate cells into a moving slug.
  **Do these living systems compose an object, even though the students in the gym do not?**
  *   **NO** → Go to Question 4.
  *   **YES** → Go to Question 5 (Vagueness).

  **4. HOLDING HANDS**
  Two people stand together holding hands. They are not fused, and they are not alive in the way a lichen is.
  **Do they compose an object?**
  *   **YES** → Go to **Leaf 7**.
  *   **NO** → Go to **Leaf 8**.

  **5. VAGUENESS (THE SAND HEAP)**
  *Note: You believe composition happens for living things, but not for random collections.*
  Imagine adding grains of sand one by one to make a heap. At some point, do they compose a "heap"?
  **Is there a precise number of grains where it suddenly becomes a heap?**
  *   **YES (Precise but unknowable)** → Go to **Leaf 4**.
  *   **NO (The cutoff is itself vague)** → Go to **Leaf 5**.
  *   **IT'S A TRICK (Vagueness proves composition doesn't happen)** → Go to **Leaf 9** (Unoccupied).

  **6. THE DATA CENTRE**
  *Note: You are here if you said YES to Lichen.*
  Thousands of machines run one program jointly, but they are not alive.
  **Do they compose an object?**
  *   **YES** → Go to **Leaf 6**.
  *   **NO** → Go to **Leaf 3** (Organicism).

  **7. STATUS (THE STATUE)**
  *Note: You are here if you said YES to School Assembly (Universalism).*
  Consider a marble block and the statue carved from it.
  **Is the statue *nothing over and above* the marble arranged statue-wise? (Is it identical to the parts?)**
  *   **YES (It is just the parts)** → Go to **Leaf 2**.
  *   **NO (It is a further fact)** → Go to **Leaf 3**.

