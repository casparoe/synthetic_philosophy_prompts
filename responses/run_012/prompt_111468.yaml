  ## THE LEAVES: YOUR POSITION

  **1. Nihilism**
  *   **View:** No composite objects exist anywhere; only simple particles exist.
  *   **Embarrassing Commitment:** You must say the fused glass lump, your own body, and this handout do not exist as single things.

  **2. Universalism (Composition as Identity)**
  *   **View:** Any things compose a whole, and the whole is strictly identical to the parts.
  *   **Embarrassing Commitment:** You must say the "school-assembly-object" is not one thing *over* the students, which makes counting objects very strange.

  **3. Universalism (Standard)**
  *   **View:** Any things compose a whole, but the whole is a further fact over and above the parts.
  *   **Embarrassing Commitment:** You must accept a vast infinity of objects (e.g., an object made of your nose and the Moon) that are distinct from their parts.

  **4. Organicism (Epistemic)**
  *   **View:** Only living things compose wholes; the boundary is precise but humans cannot know it.
  *   **Embarrassing Commitment:** You must believe there is a specific, unknowable cell whose addition turns a non-living aggregate into a living organism.

  **5. Organicism (Ontic)**
  *   **View:** Only living things compose wholes; the boundary is genuinely vague in reality.
  *   **Embarrassing Commitment:** You must accept that reality itself is fuzzy, not just our language, which challenges standard logic.

  **6. Functionalism**
  *   **View:** Things compose a whole if they jointly perform a function (like the data centre), life not required.
  *   **Embarrassing Commitment:** You may have to count a traffic system or a economy as a single object, blurring the line between biology and machinery.

  **7. Contactism**
  *   **View:** Things compose a whole only when they are physically touching (like holding hands).
  *   **Embarrassing Commitment:** You must say a scattered constellation is not an object, but two people shaking hands are, despite similar levels of connection.

  **8. Brutalism (Fusion Only)**
  *   **View:** Things compose a whole only when fused (like the glass), with no deeper explanation why.
  *   **Embarrassing Commitment:** You must admit there is no reason why fusion counts but holding hands does not; it is just a brute fact.

  **9. [UNOCCUPIED] The Vagueness Reductio**
  *   **Status:** **Incoherent.**
  *   **Why:** You claimed living things compose wholes, but argued that vagueness proves composition *never* happens. You cannot say composition happens for lichens but is impossible for heaps if the logic is the same.

