  ## SANITY CHECK

  **Did you land on Leaf 1 (Nihilism)?**
  Check your answer to **Question 1**. If you said **YES** to the fused glass, you cannot consistently land on Nihilism. Nihilism requires denying composition even in the strongest physical cases. If you said "Yes" to glass but "No" to everything else, you likely belong at **Leaf 8 (Brutalism)**.

  **Where is the tree most likely to mis-sort you?**
  The **Status (Question 7)** branch applies only to Universalists. If you are a Moderate (e.g., Organicism), you likely have a view on whether the lichen is *identical* to its cells, but this tree groups you by conditions first. If you care deeply about whether the whole is "real" or "just the parts," note that your leaf (4, 5, or 6) describes *when* composition happens, not *what* it is. You may hold a "Composition as Identity" view within Organicism, which this tree does not separate to save space.

  **Did you take the Unoccupied Path (Leaf 9)?**
  Re-evaluate **Question 5**. Most philosophers agree that if vagueness rules out heaps, it rules out lichens too. To hold this position, you must explain why life escapes the problem of vagueness when sand does not.
