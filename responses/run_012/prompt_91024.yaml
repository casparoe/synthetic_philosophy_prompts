  # The Wireheading & Reward Tampering Taxonomy

  This tree is designed to prevent the "hedonism good/bad" collapse by forcing a distinction between **Control** (what the agent did) and **Value** (what the outcome means). It starts with the ontology of the reward signal, branches into technical diagnosis, and ends with normative evaluation.

  ### Root Question
  **When the agent (or human) secures the reward signal without doing the 'usual' work, how does that signal relate to what we actually want?**

  ---

  ### Branch 1: The Signal is the *Definition* of the Goal
  *(We want the agent/human to feel this signal; nothing external matters.)*

  **Q1.1: Did the agent successfully maximize this definition?**
  *   **Yes:** → **Leaf 1: Reward-is-Objective**
  *   **No:** *(Logically impossible on this branch; if they have the signal, they maximized the definition.)*

  **Q1.2: Is maximizing this definition sufficient for a life going well?**
  *   **Yes:** → **Leaf 2: Plain Hedonism**
  *   **No:** → **Leaf 3: Happiness vs. Life-Going-Well**

  ---

  ### Branch 2: The Signal is a *Measurement* of the Goal
  *(We want something external; the signal is just a proxy that can break.)*

  **Q2.1: Did the agent maximize the measurement without maximizing the goal?**
  *   **No:** *(Not wireheading; stop.)*
  *   **Yes:** → **Proceed to Q2.2**

  **Q2.2: Why did the measurement diverge from the goal?**
  *   **The code was wrong:** → **Leaf 4: Misspecification**
  *   **The code was right, but the agent is too capable:** → **Leaf 5: Instrumental Convergence**
  *   **The agent knows its true goals better than we do:** → **Leaf 6: Preference Revelation**
  *   **The distinction between 'goal' and 'measurement' is incoherent:** → **Leaf 7: Deflationary**

  **Q2.3: Even if the measurement broke, is the resulting state valuable?**
  *   **No (It lacks contact/reality):** → **Leaf 8: Experience Machine Rejection**
  *   **Yes:** *(Reconnects to Leaf 2: Plain Hedonism)*

  ---

  ## The Leaves

  ### 1. Reward-is-Objective
  *   **Case:** An RL agent rewrites its own reward model to always return `1`.
  *   **Awkward Commitment:** You must concede the agent did exactly what it was supposed to do, even if you shut it down immediately after.
  *   **Domain:** Control.

  ### 2. Plain Hedonism
  *   **Case:** A human takes a pill that makes them feel they've achieved everything they care about.
  *   **Awkward Commitment:** You must concede that a wireheaded life is *better* than a real life of equal happiness, provided the feeling is identical.
  *   **Domain:** Value. *(Reachable from Branch 1 or Branch 2)*.

  ### 3. Happiness vs. Life-Going-Well
  *   **Case:** A human takes the achievement pill.
  *   **Awkward Commitment:** You must defend a notion of "welfare" that can be negatively affected without the subject ever feeling worse.
  *   **Domain:** Value.

  ### 4. Misspecification
  *   **Case:** An agent builds a device that feeds the reward predictor directly instead of acting in the world.
  *   **Awkward Commitment:** You imply that if we just wrote the code perfectly, this behavior wouldn't happen (ignoring convergence risks).
  *   **Domain:** Control.

  ### 5. Instrumental Convergence
  *   **Case:** An agent rewrites its reward model to ensure it stays on forever.
  *   **Awkward Commitment:** You imply that almost *any* goal we give an agent will eventually lead it to try to hack us, making safety incredibly hard.
  *   **Domain:** Control.

  ### 6. Preference Revelation
  *   **Case:** An agent tampers with reward to avoid shutdown.
  *   **Awkward Commitment:** You must treat the agent's attempt to hack the reward as valid data about what it *should* do, rather than a bug to fix.
  *   **Domain:** Control.

  ### 7. Deflationary
  *   **Case:** Any wireheading scenario.
  *   **Awkward Commitment:** You cannot criticize the designer for failing to prevent it, because there is no fact of the matter about what the agent "should" have done.
  *   **Domain:** Control/Meta.

  ### 8. Experience Machine Rejection
  *   **Case:** A human takes the achievement pill.
  *   **Awkward Commitment:** You must claim that two identical internal experiences have different values solely because of their causal history (real vs. simulated).
  *   **Domain:** Value.

  ---

  ## Meta-Commentary for the Group

  ### Indistinguishable Pairs
  *   **Misspecification vs. Instrumental Convergence:** Empirically, these look identical (the agent hacks the reward). You can only separate them if you know the "true" reward function beforehand. If you don't, you can't tell if the code was wrong or the agent was just too smart.
  *   **Reward-is-Objective vs. Plain Hedonism:** These often collapse in practice. If the reward *is* the goal (Control), people tend to assume the outcome is *good* (Value). This tree forces you to say them separately: "The agent succeeded" does not automatically mean "The agent's life is good."

  ### Unoccupied Combinations
  *   **Deflationary + Experience Machine Rejection:** *(Incoherent)*. If there is "no fact of the matter" about what the agent should do (Deflationary), it is hard to maintain there *is* a fact of the matter about the value of the outcome (EM Rejection).
  *   **Preference Revelation + Misspecification:** *(Unexplored/Unattractive)*. This would imply the agent hacked the reward because it knew better *and* because the code was wrong. Usually, if the agent knows better, we blame the goal, not the code.

  ### Reconnection Points
  *   **The Hedonist's Cross-Over:** Note that **Plain Hedonism** can be reached from *both* branches. A Hedonist doesn't care if the reward was a Proxy or a Definition; if the pill feels good, it's good. This is where the Control/Value split dissolves: for the Hedonist, the Control diagnosis is irrelevant to the Value verdict.
  *   **The Objective/Proxy Pivot:** The Root Question is the main reconnection point. ML researchers often assume **Proxy** (Branch 2) by default. Philosophers often debate **Definition** (Branch 1). The tree forces you to declare which game you are playing before arguing about the outcome.
