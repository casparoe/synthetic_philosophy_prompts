prompt: |-
  You're a philosopher of history — memory, testimony, the epistemology of archives — so treat this as a genuinely hard case and not a warm-up. Bit of background: my hometown is putting up a museum exhibit about a 1930s factory fire that killed fourteen workers. The towns memory is that the owner locked the doors on purpose. The surviving records show a blocked exit that nobody ordered blocked, sloppy inspections, and no trace of intent either way. My aunt is on the exhibit committee and asked me, since I'm supposedly the one with the degree, whether the placard should say what the town remembers or what the record supports. I said put both up, two columns, no hierarchy, and she looked at me like I'd grown a second head.

  So: write me an essay that actually settles it. Brainstorm first — lay out the plausible positions before you commit to one — then argue. The thing I keep circling is whether this is even a real conflict or a category mistake: maybe a community's memory isn't a factual claim at all but a claim about what the community owes itself, in which case "the record says otherwise" doesn't touch it. If that's right, say so and work out what it means for the placard. If it's wrong, then one of them has to give way when they can't both be honored — tell me which, and why, and dont end on "both are valuable in their own way," I want a verdict. Construct the strongest objection to your own verdict and answer it. No bibliography needed, I want the argument.
