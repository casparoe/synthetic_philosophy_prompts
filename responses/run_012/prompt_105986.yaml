answer: |-
  ### The Architecture of Guilt: A Verdict on the Factory Fire Placard

  You are standing at the fault line between two distinct modes of truth: the *forensic* and the *moral*. Your aunt's committee is paralyzed because they believe these two modes are competing for the same territory on the placard. They are not. To treat them as such is to misunderstand the ontology of memory.

  Before I give you the verdict, we must clear the ground by examining the three standard positions you likely considered, and why each fails.

  **1. Archival Positivism:** This position holds that the placard must only state what the documents prove. Since the records show no order to lock the doors, the text must say the doors were not locked.
  *   *Failure:* This treats the archive as neutral. Archives are not objective repositories of truth; they are repositories of *administration*. In the 1930s, a factory owner's paperwork was designed to limit liability, not record reality. To privilege the written record over the oral testimony of the bereaved is to privilege the voice of the powerful over the voice of the dead. It risks sanitizing history into a technical error rather than a human tragedy.

  **2. Communal Populism:** This position holds that the town's memory is the true record. The archive is a lie; the people know what happened. The placard should say the owner locked the doors.
  *   *Failure:* This turns history into myth. If the owner did not physically turn a key, stating that he did is a falsehood. A museum is an epistemic institution; its currency is credibility. If you enshrine a demonstrable falsehood as fact, you invite revisionists to dismantle the entire exhibit later. You cannot fight a lie with a lie.

  **3. The Relativist Compromise (Your Proposal):** Two columns, no hierarchy. "The Record Says" vs. "The Town Remembers."
  *   *Failure:* This is cowardice disguised as nuance. It suggests that truth is subjective, that reality is a matter of perspective. It absolves the historian of the duty to judge. It tells the visitor: "We don't know what happened, and neither do you." It creates a false equivalence between data and grief.

  **The Category Mistake**

  You intuited the solution when you asked if memory is a factual claim at all. It is not. Or rather, it is not *only* a factual claim.

  Communal memory, in cases of trauma and injustice, functions less like a police report and more like a grand jury verdict. When the town says, "The owner locked the doors," they are not necessarily making a claim about the physical mechanism of the latch. They are making a claim about *causality* and *culpability*. They are saying: "The owner created conditions where we could not get out. He is responsible for our death."

  The archive deals in *physics* (was the bolt thrown?). Memory deals in *power* (did he trap us?).

  In a 1930s company town, the distinction between "locking a door" and "negligently blocking an exit you knew was dangerous" is a legal distinction, not a moral one. Both result in corpses. The town's memory has condensed the structural violence of the owner's negligence into a single, potent symbol: the locked door. To correct them on the mechanics while ignoring the moral truth they are preserving is to commit a category mistake. You are treating a verdict as if it were evidence.

  **The Verdict**

  Here is the hard choice you asked for. One of them must give way.

  **The specific factual claim of the memory must yield to the archive.** The placard cannot state as fact that the owner locked the doors. To do so is historically dishonest. If a visitor asks, "Did he turn a key?" the answer must be, "We have no evidence of that."

  **However, the exonerating implication of the archive must yield to the memory.** The placard cannot allow the absence of a "lock order" to suggest the death was a mere accident or that the owner is blameless. The memory is right about the guilt, even if it is imprecise about the mechanism.

  Therefore, the placard must not present the archive and memory as rivals. It must present the memory as the *correct interpretation* of the archive.

  The text should read something like this:

  > "On [Date], fourteen workers died when the factory exit was found blocked. While inspection records show no order was given to lock the door, the exit was obstructed by stored materials and faulty design, rendering it unusable.
  >
  > "For generations, this town has remembered the owner as having locked the workers in. History confirms the outcome of that memory: whether by key or by neglect, the owner created a trap from which there was no escape. The negligence was total. The door was functionally locked."

  This is the verdict: **You validate the memory's moral judgment by correcting its physical description.** You do not put them in separate columns. You weave them. You assert that "negligence so gross it mimics malice" is the historical truth.

  **The Strongest Objection**

  Here is the objection that will keep you up at night: *This is semantic gymnastics. You are redefining "locked" to mean "blocked by negligence" to satisfy a political urge. If historians start bending the definitions of physical events to accommodate moral narratives, you destroy the integrity of the discipline. What stops the next committee from saying, "The records say he didn't shoot him, but the town remembers he did, so we'll say the bullet was metaphorical"?*

  This objection argues that by blurring the line between *intent* and *negligence*, you are sacrificing objective truth for social cohesion. You are allowing "truth" to become malleable based on how the community *feels*. If the archive says no key was turned, then no key was turned. To say the door was "functionally locked" is a metaphor, and a museum placard is not the place for poetry; it is the place for facts.

  **The Rebuttal**

  The objection fails because it assumes that "what happened" is limited to physical mechanics. It assumes history is only about the movement of objects (keys, bolts, bodies). But history is also about the movement of *power*.

  In the epistemology of labor history, a worker who cannot leave a workplace due to safety violations is not "accidentally detained"; they are *coerced*. The owner's choice to prioritize storage space over exit clearance was an active decision, just as active as turning a key. The archive records the *result* of the decision (blocked door), but hides the *nature* of the decision (disregard for life).

  The town's memory corrects the archive's omission. It identifies the *agency* behind the accident. To say the door was "functionally locked" is not a metaphor; it is a description of the worker's reality. To the fourteen dead, the mechanism did not matter. The outcome was identical.

  If you refuse to make this synthesis, you are siding with the owner's lawyers. The archive was written by the administration to prevent exactly this kind of liability. To hide behind the "lack of a lock order" is to accept the owner's defense as historical truth.

  **Conclusion**

  Do not give your aunt two columns. Do not give her a lie. Give her the synthesis.

  The placard must state that the door was not locked by a key, but it must conclude that the owner's negligence constituted a moral locking. The town's memory is not a rival fact to be debunked; it is a witness testimony that requires translation.

  Write the text so that the visitor understands: The owner may not have turned a key, but he built the cage. The town remembers the cage. That is the truth that matters.
