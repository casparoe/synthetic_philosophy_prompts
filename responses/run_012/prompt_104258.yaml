  # Fellowship Proposal: The Arithmetic of Uncertainty

  **Project Title:** The Arithmetic of Uncertainty: Reassessing the Moral Scale of Insects
  **Applicant:** [Your Name]
  **Duration:** Nine Months

  ### The Question
  Does the 'scale argument' for insect moral status function as an expected-value calculation dependent on neurobiological credence, or does it operate as a comparative weighting device insensitive to probability?

  ### Project Summary
  The moral status of insects is frequently settled by a specific rhetorical manoeuvre: the scale argument. Proponents note that even if the probability of insect sentience is minute, the astronomical number of insects alive ensures that the expected moral value of protecting them outweighs known human interests. Consequently, the public debate has calcified around the empirical question of insect neurobiology. Philosophers and effective altruists fight over the size of the credence—the probability that a bee feels pain—assuming the mathematical structure of the argument is fixed.

  This project proceeds from the conviction that this assumption is false. I argue that the scale argument does not function as an expected-value sum. Instead, it operates as a comparative argument where the numbers do no independent work beyond making a doubtful case weigh as heavily as an undoubted small one. If this structural analysis is correct, the empirical dispute about insect neurobiology is largely beside the point. The recommendation becomes insensitive to the credence across its entire plausible range. The real premise is the aggregation rule rather than the probability, and the argument remains silent about absolute obligations. This undermines the way the argument is usually deployed to license large-scale interventions, such as banning insect farming or halting pest control.

  ### Why Existing Positions Leave This Open
  Current literature treats the scale argument as a straightforward application of decision theory under uncertainty. The focus is almost exclusively on refining the input variable (the probability of sentience) rather than examining the function itself (the moral aggregation rule). This leaves a critical gap: if the argument is comparative rather than summative, increasing our confidence in insect sentience does not strengthen the moral obligation in the way proponents claim. The debate remains open because participants are arguing over the value of a variable in an equation that may not exist. By treating a structural philosophical claim as an empirical scientific one, the field has obscured the actual basis of the moral recommendation.

  ### Methodology and Work Plan
  This project prioritises conceptual reporting over scientific review. I will not be assessing insect nervous systems; I will be assessing the logical architecture of the arguments used by those who do.

  **Months 1–2: Conceptual Mapping**
  I will analyse key texts from moral philosophy and effective altruism that deploy the scale argument. The goal is to formalise the two competing structures: the expected-value sum versus the comparative weighting device. I will identify the key proponents of the standard view to target for interviews.

  **Months 3–5: Reporting and Interviews**
  I will conduct interviews with moral philosophers, decision theorists, and advocacy leaders. The questioning will not focus on whether insects feel pain, but on *why* the numbers matter to their conclusion. I will test whether their policy recommendations would change if the credence dropped significantly but the numbers remained huge. This phase determines if the argument is truly insensitive to probability, as my thesis suggests.

  **Months 6–7: Drafting the Narrative**
  I will construct the long-form piece, weaving the philosophical analysis into a narrative about how we decide what counts in morality. The challenge is to make structural logic compelling without relying on jargon. I will illustrate the difference between the two argument structures using concrete policy examples, such as insecticide regulation.

  **Months 8–9: Editing and Verification**
  The draft will undergo rigorous fact-checking, specifically ensuring that no philosopher's view is misrepresented in service of the thesis. I will seek feedback from one specialist in decision theory and one editor specialising in long-form ideas journalism to ensure clarity and rigour.

  ### Why Framing Rather Than Science?
  The obvious alternative project would be a deep dive into the latest neuroscience on insect nociception. However, that reporting would be obsolete within years and misses the point. If the moral argument relies on a logical category error, better science cannot fix it. Reporting on the framing is the higher-leverage project because it addresses the foundation of the ethical claim. If the structure is comparative, then waiting for better neurobiology is a waste of moral time. This project clarifies whether the debate is currently being held on solid ground.

  ### Deliverable
  A 12,000-word long-form essay suitable for publication in a major ideas magazine (e.g., *Aeon*, *Prospect*, *The Guardian Long Read*). Additionally, I will produce a shorter 1,500-word op-ed distilling the core thesis for a daily newspaper to maximise public engagement.

  ### Failure Conditions
  The project would count as a failure if:
  1.  Interviews reveal that proponents explicitly rely on expected-value calculations and would alter their policy recommendations proportionally with changes in credence, disproving the insensitivity thesis.
  2.  The distinction between 'comparative weighting' and 'expected value' proves to be merely semantic with no impact on practical policy outcomes.
  3.  The philosophical nuance overwhelms the narrative, resulting in a piece inaccessible to non-specialists.

  ### Scope Risk
  The primary risk is philosophical bloat. Nine months is sufficient for deep reporting, but there is a temptation to engage with every counter-argument in moral mathematics. I will mitigate this by strictly limiting the scope to the scale argument itself, avoiding tangential debates in population ethics unless directly relevant. I will also limit the number of interviewees to ten key figures to ensure depth over breadth.

