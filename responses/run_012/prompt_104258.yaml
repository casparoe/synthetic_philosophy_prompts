  I'm a science-and-ideas journalist, and I'm putting together a nine-month fellowship application for a long-form piece on the moral status of insects, aimed at a panel of non-specialists. Turn my half-formed idea into a proper proposal. The idea: the scale argument — astronomical numbers of insects alive at any time, multiplied by a very small credence that they are sentient — has always been argued about as though it were an expected-value sum, with everyone fighting over the size of the credence. I suspect it only ever had the structure of a comparative argument, in which the numbers do no independent work beyond making a doubtful case as weighty as an undoubted small one. If that is right, the empirical dispute about insect neurobiology is largely beside the point, because the recommendation is insensitive to the credence across its entire plausible range; the real premise would then be the aggregation rule rather than the probability, and the argument would be silent about absolute obligations, which would undercut the way it is usually deployed to license large interventions. Write the proposal so that it states the question in a form with a determinate answer, explains why the existing positions leave it open, sets out what I would actually do month by month and why reporting the framing rather than the science is the right project rather than the obvious alternative, says what would count as the project failing, and keeps the scope honest for nine months. Assume no literature review and no citations; I will add those myself. Take a definite position rather than laying out the options — say which reading of the argument you think is correct, and build the proposal on it. Finish with a JSON object with the fields question (one sentence), why_open, method, deliverable, failure_conditions, scope_risk and position_taken (your own verdict, stated as a claim), each a short string. British English throughout.
