answer: |-
  You have stumbled onto some of the deepest, most contentious problems in formal epistemology. You are effectively reinventing the debate between **Objective Bayesians** (who love the Principle of Indifference and sharp 0.5s) and **Imprecise Probabilists** (who love intervals and ambiguity aversion).

  Your intuitions are consistent enough to form a coherent worldview, but there is one major mathematical contradiction in there that you need to resolve. Here is the diagnosis of your position, the principle that underlies it, and the verdict you likely need to drop.

  ### The Principle: Salient Symmetry vs. Structural Ignorance

  Your "half-principle" was close, but the distinction isn't just about "symmetry." It's about **generative mechanisms**.

  Your actual operating principle seems to be:
  > **Assign sharp credences when there is a salient physical or causal symmetry that enforces exchangeability (the Coin). Assign imprecise credences when the uncertainty arises from arbitrary selection or lack of structural constraints (the Urn, the Sand).**

  This explains why the **Unfamiliar Coin** gets 0.5 (coins are *designed* to be symmetric; we have a prior over the *kind* of object "coin" that says "fair") while the **Sand** gets [0,1] (there is no causal mechanism enforcing evenness) and the **Ellsberg Urn** gets intervals (the composition is explicitly arbitrary).

  This is a pragmatically robust position. It treats "Coin" as a natural kind with a default setting, and "Urn/Sand" as arbitrary collections.

  ### The Inconsistency: The Biased Coin (Case 3)

  You wrote: *"Next flip: 0.5 heads... But I also think two heads in a row is more likely than heads-then-tails... I have a suspicion they shouldn't both be."*

  **Your suspicion is correct. These cannot both be true.**

  If your credence in Heads on a single flip is a sharp 0.5, then mathematically, $P(HH)$ must equal $P(HT)$ (assuming the flips are independent conditional on the bias).
  *   $P(HH) = \int p^2 \, dF(p)$
  *   $P(HT) = \int p(1-p) \, dF(p)$

  For $P(HH) > P(HT)$, you need variance in your belief about the bias. But if you have variance in your belief about the bias, your credence in the *single* flip is not a sharp 0.5 in the sense of a single probability measure; it is a mixture.

  **The Verdict to Drop:** You must drop the idea that your credence in the single flip is a **sharp 0.5**.
  It is *behaviorally* 0.5 (you bet even money), but *epistemically* it is an interval or a distribution centered on 0.5. If you keep the HH > HT intuition (which is rational for an unknown bias), you admit your state is imprecise. The "0.5" is just the midpoint of your ignorance, not the ignorance itself.

  ### The "Bugging" Case: Dilation (Case 5)

  You asked: *"Learning something irrelevant to a question shouldn't make me more ignorant about that question."*

  This phenomenon has a name: **Dilation**. It is a known feature of imprecise probability. Here is why your intuition is tricking you:

  1.  **Before:** The proposition "Exactly one heads" is protected by the fair coin. The fair coin acts as a "smoother." No matter what the biased coin does, the fair coin randomizes the outcome enough to lock the total probability at 0.5. The sharpness of the fair coin masks the vagueness of the biased coin.
  2.  **After:** You learn the fair coin is Heads. The "smoother" is gone. The proposition "Exactly one heads" now depends *entirely* on the biased coin coming up Tails. Since you were vague about the biased coin, you are now vague about the proposition.

  You didn't become more ignorant about the *world*; you became more aware of the vagueness inherent in the biased coin because the fair coin stopped hiding it. **You should drop the intuition that precision cannot be lost by learning irrelevant facts.** In imprecise frameworks, it happens all the time.

  ### The Coin vs. Sand Distinction (Case 1 vs. Case 6)

  This is the hardest part of your view to defend philosophically, even if it feels right.
  *   **Coin:** You assume a generative history (manufacturing standards) implies symmetry.
  *   **Sand:** You assume no generative history implies symmetry.

  If an alien handed you the coin, would you still say 0.5? If you found the sand in a jar labeled "Even/Odd Experiment," would you still say [0,1]?
  Your principle relies on **contextual defaults**. This is fine for practical reasoning, but be aware that a strict logician would say: "If you know nothing about the coin's bias, it is logically identical to knowing nothing about the sand count."
  *   **To keep your view:** You must commit to the idea that **object kinds carry priors.** "Coin" implies "Fair" until proven otherwise. "Jar of Sand" implies "Arbitrary" until proven otherwise.

  ### A Refined Principle

  Here is the principle that captures your surviving verdicts:

  > **The Principle of Salient Mechanism:**
  > Assign sharp credences only when there is a known physical or causal mechanism that enforces symmetry (e.g., a manufactured coin, a shuffled deck). Assign imprecise credences (intervals) when the uncertainty stems from arbitrary selection, unknown parameters, or lack of structural constraints (e.g., urns, sand, biased coins with unknown bias).
  >
  > *Corollary (Dilation):* Acknowledge that combining sharp and imprecise sources can result in losing precision when the sharp source is resolved.

  ### Two New Test Cases

  To see if this principle holds for you, try these:

  **1. The Alien Coin**
  You are abducted by aliens. They place a metallic disk on the table. It has two sides. They say, "This is a coin used in our galaxy." They flip it.
  *   *Question:* Is your credence in Heads 0.5 or [0,1]?
  *   *Why ask:* If you say 0.5, you are relying on the *concept* of a coin transcending human manufacturing. If you say [0,1], you are admitting your "Unfamiliar Coin" (Case 1) verdict was actually based on human context, not logic.

  **2. The Proprietary Algorithm**
  A tech company releases an AI that predicts stock movements. They say, "On any given day, the AI is either 60% accurate or 40% accurate, and we toggle between these modes arbitrarily. We won't tell you which mode it's in today."
  You are asked to bet on whether the AI's prediction for tomorrow (Up/Down) will be correct.
  *   *Question:* Is your credence in "AI is Correct" a sharp 0.5, or an interval [0.4, 0.6]?
  *   *Why ask:* This is structurally identical to the "40% or 60% Coin" (Case 4). If you feel an interval here, it confirms that **unknown parameters** drive your interval intuition, not just "physical objects."

  ### Summary of Recommendations

  1.  **Keep:** The Ellsberg preferences (Ambiguity Aversion is rational).
  2.  **Keep:** The distinction between Coin (Sharp) and Sand/Urn (Imprecise), but ground it in "Salient Mechanism" rather than just "Symmetry."
  3.  **Drop:** The idea that the "Biased Coin" (Case 3) has a sharp 0.5 credence for a single flip *if* you maintain HH > HT. Accept that the single flip is imprecise, centered at 0.5.
  4.  **Accept:** That "Dilation" (Case 5) is real. Learning irrelevant sharp facts can expose underlying vagueness.

  You are essentially an **Imprecise Bayesian with a Default Fairness Heuristic.** That is a very defensible, practical position, provided you accept the mathematical cost in Case 3.
