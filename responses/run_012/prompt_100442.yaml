answer: |-
  1.  **The Asymmetry Claim**
      You argue that treating the Lottery and Preface paradoxes as twins manufactures the apparent need to surrender deductive closure. If we accept your asymmetry, does the pressure to solve them *jointly* disappear, or does your distinction merely relocate the tension into two separate domains of normativity?
      *Follow-up:* If she insists the tension vanishes, ask whether the intuitive pull of the paradoxes isn't itself evidence that our cognitive architecture treats them as structurally identical, regardless of your theoretical separation.

  2.  **The Closure Principle (Requirement a)**
      To preserve rational belief in the face of the Lottery, you abandon a closure principle. Is it specifically Multi-Premise Closure you reject, and if so, why must it be that version rather than Single-Premise Closure that goes?
      *Follow-up:* **If she denies closure, ask whether she can still explain our practice of reasoning from many premises at once without treating the conclusion as rationally required.**

  3.  **Lottery-Sensitivity**
      Your criterion of "lottery-sensitivity" suggests a belief is rational only if insensitive to evidential symmetry. Is this sensitivity a property of the evidence itself, or is it a feature of the subject's relation to that evidence?
      *Follow-up:* If she claims it is a feature of the evidence, ask how she accounts for two agents with identical evidence where one is in a lottery context and the other is not.

  4.  **Test Cases: Juror and Physician (Requirement b)**
      Apply that criterion to two cases: a juror convicting on 99.9%-reliable eyewitness testimony, and a physician acting on a diagnosis with a one-in-a-million error rate. Does the "lottery-sensitivity" constraint block rational belief in either instance, or do they pass where the lottery ticket fails?
      *Follow-up:* If she distinguishes them, press her on where the line is drawn without arbitrariness—is it the source of the probability or the stakes of the error?

  5.  **The Statistical Syllogism (Requirement d)**
      A major worry for your account is whether it licenses the inference from "Almost all Fs are G" to "This F is G." If your sensitivity constraint blocks the lottery inference, does it not also block this statistical syllogism?
      *Follow-up:* **If she concedes the statistical-syllogism worry, ask what is left of the threshold view once the threshold is made case-relative.**

  6.  **The Preface as Speech-Act (Requirement c)**
      Regarding the Preface paradox, you suggest the closing sentence of modesty is a second-order remark about the book as a whole rather than a belief about each individual claim inside it. Does this make the preface paragraph immune to truth-evaluation?
      *Follow-up:* If she says it is immune, ask whether a statement that cannot be true or false can genuinely function as a concession of fallibility.

  7.  **The Hedge Reading (Requirement c)**
      You are unsympathetic to the reply that the preface paragraph is merely a hedge, arguing that this gets the illocutionary facts backwards. Is the conflict here ultimately between norms of belief and norms of assertion?
      *Follow-up:* **If she leans on the belief/assertion distinction, press her on whether a reader who believes every sentence of the book but rejects the preface is being irrational or merely discourteous.**

  8.  **The Manufactured Problem**
      You claim running the two paradoxes together creates the illusion that closure must go. If we accept your asymmetry, do we keep closure for the Preface but lose it for the Lottery, or do you find a way to preserve it in both by separating the norms?
      *Follow-up:* If she proposes bifurcated norms, ask if this makes the concept of "rational belief" unstable, varying fundamentally depending on whether the context is assertoric or inferential.

  9.  **Threshold Artifacts (Hard Question 1)**
      How do you distinguish your position from the rival view that *both* paradoxes are merely artifacts of insisting on a sharp belief threshold at all? Why is your asymmetry preferable to dissolving the threshold entirely?
      *Follow-up:* If she defends the threshold, ask why her threshold is less arbitrary than the contextualist's, given that both must explain away the paradoxical intuition.

  10. **Falsification Conditions (Hard Question 2)**
      What sort of consideration—a specific case, a formal result, or a revision of our practice—would actually move you off the asymmetry claim?
      *Follow-up:* If she struggles to name one, ask whether she acknowledges that her view risks becoming immune to empirical counterexample.
