      *   **Form:** Pantoum (Malay verse form adopted into English). Structure: Quatrains (ABAB rhyme scheme usually, but often just line repetition in English pantoums). The key feature is line repetition: Lines 2 and 4 of each stanza become Lines 1 and 3 of the next stanza. The final stanza usually circles back to use Lines 1 and 3 of the first stanza as Lines 2 and 4 (or sometimes 1 and 3, depending on variation, but standard English pantoum often ends with L1 and L3 of Stanza 1 as L2 and L4 of Final Stanza, or L1 as L4 and L3 as L2). Let's stick to the standard:
          *   Stanza 1: A B C D
          *   Stanza 2: B E D F
          *   Stanza 3: E G F H
          *   ...
          *   Final Stanza: ... A ... C (often reversed order for closure: C A).
          *   Actually, the most common English pantoum structure is:
              *   S1: L1, L2, L3, L4
              *   S2: L2, L5, L4, L6
              *   S3: L5, L7, L6, L8
              *   S4: L7, L1, L8, L3 (Closing returns to start).
