      *   **Specific Tasks:**
          1.  Reconstruct the theory presupposed by this practice.
          2.  Address specific philosophical questions (view of meaning, identity of the work, theory of literary value, conception of fidelity).
          3.  Separate strict presuppositions from compatible but non-essential views.
          4.  Identify where the theory is underdetermined.
          5.  Address the user's suspicion (that content-first or "new poem" theories could also license the practice).
          6.  Specify what would have to *change* practically if the editor adopted a content-first view.
      *   **Constraint:** No reading lists or citations. Just the argument.

  2.  **Deconstruct the Editor's Practice (The Phenomena):**
      *   *Rule 1:* Form is mandatory (stanza, line, rhyme, refrain, etc.).
      *   *Rule 2:* Sense is secondary to form (sacrifice sense if they collide).
      *   *Rule 3:* Result must read like an original English poem (aesthetic viability).
      *   *Rule 4:* Translator is co-author (creative art), yet forbidden from inventing new formal elements.
      *   *Rule 5:* Prose is treated differently (content-first, sentence-for-sentence).
      *   *Conflict:* Form vs. Sense vs. Readability.

  3.  **Reconstruct the Presupposed Theory (The "Formalist-Embodiment" Theory):**
      *   *View of Meaning:* Meaning is not just propositional content (the "what"). Meaning is *embodied* in the form (the "how"). The form *is* part of the semantic content. To change the form is to change the meaning.
      *   *Identity of the Work:* The poem is an *artifact*, not just a message. Its identity conditions include its structural constraints. A translation that loses the form is a *summary* or a *paraphrase*, not the work itself.
      *   *Theory of Value:* Aesthetic/Cognitive unity. The value lies in the *constraint resolution*. The beauty is in seeing how meaning survives (or transforms) within the strict cage. It's experiential (the reader feels the tension) and formal.
      *   *Conception of Fidelity:* Fidelity is to the *constraints*, not just the *propositions*. It's a hierarchy: Form > Readability > Propositional Accuracy.

  4.  **Address the User's Suspicion (Underdetermination):**
      *   *Suspicion:* Could a "Content-First" theory license this?
          *   *Analysis:* No. A strict content-first theory would prioritize the proposition. If rhyme distorts the proposition, content-first rejects the rhyme. The editor *keeps* the rhyme and distorts the proposition. So, content-first is incompatible with Rule 2.
      *   *Suspicion:* Could a "New Poem" theory license this?
          *   *Analysis:* Partially. If it's a "new poem," the translator has freedom. But the editor *forbids* invention of new rhymes/forms. A "new poem" theory usually implies more creative license (adaptation, imitation). The editor's strict constraints suggest the *source* dictates the form, not the translator's creativity. So, "New Poem" is compatible with Rule 4 (co-author) but incompatible with Rule 1 (strict replication).
      *   *Conclusion:* The practice is *not* underdetermined between these options. It specifically requires a theory where Form is Constitutive of Meaning.

  5.  **Distinguish Presuppositions from Compatible Views:**
      *   *Strict Presuppositions:* Form carries meaning; The work is defined by its constraints; Fidelity requires structural isomorphism.
      *   *Compatible but not Required:* That translation is "creative art" (could be seen as craft); That the translator is a "co-author" (could be seen as a medium); That prose is different (could be consistent if prose form is negligible, but the sharp distinction suggests a genre ontology).

  6.  **Practical Implications of Switching to Content-First:**
      *   *Contracts:* Translator becomes a service provider, not co-author.
      *   *Rejection Letters:* Reject versions that distort meaning for rhyme. Accept prose-like versions that capture sense.
      *   *The List:* No distinction between poetry and prose translation methods.
      *   *Title Page:* Translator moved to credits, not title.

  7.  **Drafting the Argument (Iterative refinement for tone):**
      *   *Tone:* Respectful of the scientific background. Use analogies to invariance and formalism. Avoid literary jargon where possible, or define it. Be rigorous.
