          6.  Practical Consequences (What changes).

  8.  **Refining the "Meaning" Argument:**
      *   In science, $E=mc^2$ is the same in English or German.
      *   In this poetry theory, the *sound* and *structure* are part of the equation. Changing the variables (rhyme) changes the outcome (meaning).
      *   Key concept: *Semantic Embodiment*. The form isn't a container; it's the substance.

  9.  **Refining the "Identity" Argument:**
      *   What makes *this* poem *this* poem?
      *   Content-first: The message.
