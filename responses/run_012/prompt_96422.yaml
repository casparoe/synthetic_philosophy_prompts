      *   *Correction:* No, user said no citations. Stick to the logic.
      *   *Initial thought:* Use the word "qualia."
      *   *Correction:* Might be too philosophical. Use "experiential quality."
      *   *Focus:* Make sure the distinction between *propositional content* and *aesthetic content* is clear. The editor values the latter as part of the former.

  13. **Final Polish:** Ensure the distinction between what is *presupposed* (logically necessary for the rules to make sense) and what is *consistent* (could be true but isn't required) is sharp. This appeals to the scientist's desire for rigorous classification.

  *(Self-Correction on the "Prose" point)*: The user notes the editor treats prose differently. I need to explain why the theory allows this. It implies a genre ontology: Poetry *is* form; Prose *is* content. This is a crucial part of the reconstructed theory.

  *(Self-Correction on "Co-author")*: Why call them co-author if they can't invent? Because the *labor* of solving the constraint puzzle is creative. It's like solving a math proof. The proof is determined, but the solver is credited.

