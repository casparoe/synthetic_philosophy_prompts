  **HANDOUT: DECISION TREE ON NO-FREE-LUNCH AND INDUCTION**

  **Starting Commitment:** No inductive or learning method is universally superior to its rivals once performance is averaged uniformly over all possible worlds, hypotheses, or objective functions.

  **1. Does the uniform average over all possible worlds bear on method performance in the actual world?**
  *   **YES** → **2. Does the actual world resemble a uniform draw from that space?**
      *   **YES** → **[LEAF 1] Skeptical Conclusion**
          *   *Awkward Commitment:* Reason cannot prefer any prediction over its negation.
      *   **NO** → **[LEAF 2] GAP (Incoherent)**
          *   *Status:* Empty because the view claims NFL is relevant while asserting the world is atypical without explaining how we know.
  *   **NO** → **3. Is this because the actual world possesses a specific, favorable structure?**
      *   **NO** → **[LEAF 3] GAP (Unattractive)**
          *   *Status:* Empty because the view posits a non-random world that lacks structure.
      *   **YES** → **4. Can we know the world has this structure without relying on inductive inference?**
          *   **YES** → **5. Does non-empirical inquiry identify a unique prior distribution?**
              *   **YES** → **[LEAF 4] Privileged Prior (Logical/Simplicity)**
                  *   *Awkward Commitment:* Contingent world structure is knowable a priori.
              *   **NO** → **[LEAF 5] Privileged Prior (Computational/Universal)**
                  *   *Awkward Commitment:* Computability is a physical constraint on the world.
          *   **NO** → **6. Can we dispense with inductive inference entirely?**
              *   **YES** → **[LEAF 6] Anti-Inductivism**
                  *   *Awkward Commitment:* Science progresses without ever confirming a theory.
              *   **NO** → **[LEAF 7] NFL Irrelevance + Meta-Question**
                  *   *Awkward Commitment:* We assume structure to validate the method that tells us there is structure.
              *   *(Note: Positions 6 and 7 are nearly inseparable here; distinguished only by whether inference is eliminated or circularity is tolerated.)*
              *   **YES** → **7. Must the reliability of induction be established independently of its use?**
                  *   **NO** → **8. Is this because practice is self-validating or because the goal is pragmatic success?**
                      *   **Practice** → **[LEAF 8] Flat Denial**
                          *   *Awkward Commitment:* Philosophy cannot critique successful practice.
                      *   **Pragmatic** → **[LEAF 9] Pragmatic Vindication**
                          *   *Awkward Commitment:* Success is guaranteed only if the world is predictable, which is unproven.
                  *   **YES** → **9. Is the bias justified by its truth-tracking or by its origin?**
                      *   **Truth-Tracking** → **[LEAF 10] GAP (Incoherent)**
                          *   *Status:* Empty because the view uses induction to justify induction.
                      *   **Origin** → **10. Is the origin evolutionary selection or cultural learning?**
                          *   **Evolution** → **[LEAF 11] Pedigree Vindication**
                              *   *Awkward Commitment:* Survival explains the bias but does not guarantee its truth.
                          *   **Cultural** → **[LEAF 12] Naturalized Epistemology**
                              *   *Awkward Commitment:* Norms of reasoning are reduced to empirical generalizations.
