      *   **User's Thesis:** Bongard problems don't test concept induction (finding the *true* underlying rule); they test "mind-reading" (inferring the *designer's* intent based on shared conventions). "Simplest rule consistent with examples" is the wrong metric.
      *   **Task:** Argue *for* this position as hard as possible. Address strong counterpoints. Discuss implications for the "humans are amazing few-shot learners vs. machines" claim.
