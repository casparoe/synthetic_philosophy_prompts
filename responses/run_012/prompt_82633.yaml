      *   **The Pragmatic Layer (Gricean Maxims):** Why do we assume the "touching" rule is wrong? Because of conversational implicature. If the designer meant "touching," why break it twice? If they meant "parity," why make "touching" so obvious? The solver is navigating the *designer's choices*, not just the *data*.
      *   **Salience and Priors:** What counts as a "feature"? Visual proximity is high-salience for humans. Number parity is low-salience. A pure induction engine weighs data; a human weighs *intent*. The "broken boxes" are the key. In pure induction, noise is noise. In design, noise is a signal (a "red herring" is an intentional object).
      *   **The "Two Broken Boxes" Argument:** This is the crux. In a logical dataset, exceptions invalidate a rule. In a puzzle, exceptions *define* the boundary of the intended concept. The fact that the user *could* break the visual rule proves the visual rule wasn't the constraint. But the solver doesn't know that unless they model the user.
      *   **Counterpoint 1: Objective Truth:** Isn't there a ground truth? *Rebuttal:* Only relative to the generator. Without the generator, the data supports multiple hypotheses. The "truth" is the generator's state of mind.
