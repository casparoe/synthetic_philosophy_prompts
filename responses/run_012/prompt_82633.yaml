  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* Bongard solving is a pragmatic communication game, not a pure logical induction task.
      *   *Supporting Evidence:* The user's specific puzzle (visual salience vs. abstract arithmetic + deliberate noise).
      *   *Implication:* There is no objective "correct" answer, only the "intended" answer.
      *   *Implication for AI:* AI failure isn't necessarily a failure of induction capability, but a failure of cultural/pragmatic alignment.

  3.  **Drafting the Argument - Section by Section:**

