      *Wait, one nuance on Case 3:* Case 3 reason says "claimant's own account... was the best evidence." In Case 7, the account is technically the same ("does not hurt in the way pain usually hurts"). The *difference* is the request for removal. Is a request for removal part of the "account of experience"? Yes, it's an account of *preference* regarding the experience.
      *   Okay, I will argue that the tribunal treats "Suffering" as a composite of Phenomenology + Conative State (Desire).

