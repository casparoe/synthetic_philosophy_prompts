              2.  Disagreements Table: Issue, Side A's Formulation, Side B's Formulation, Side A's Prediction, Side B's Prediction.
              3.  Specific Cruxes to Cover:
                  1.  Antecedent Strengthening (Monotonicity) for indicatives (fixed modal base?).
                  2.  "Might" vs. "Would" duality (counterfactuals & indicatives).
                  3.  Disjunctive Antecedents (Simplification).
                  4.  Undetermined/Future Antecedents (Open conditionals).
                  5.  Nature of Ordering (Similarity vs. Contextual Premises).
              6.  Meta-question: Is any part merely verbal? What would move the debate?
          *   Content: Build *new* cases, don't just cite famous ones (Kennedy, Sobel, etc., are too well-known to them).

  2.  **Deconstruct the Positions:**
      *   **Student A (Unified/Contextualist):** Stalnaker/Lewis lineage. One semantics for "if" (restrictor). Indicative/Counterfactual distinction is pragmatic/contextual (modal base: epistemic vs. metaphysical/historical). "Would" involves an ordering source. Antecedent strengthening fails (non-monotonic).
      *   **Student B (Ambiguity/Strict):** Indicatives $\neq$ Counterfactuals. Indicatives are strict conditionals (relative to epistemic modal base) or inferential. They validate monotonicity (antecedent strengthening), contraposition, transitivity. Counterfactuals are variably strict (Lewisian).
      *   **The Conflict:** Student A says B's "monotonicity" examples involve context shifts. Student B says A's "non-monotonicity" examples involve misinterpreting the indicative as a counterfactual or ignoring the epistemic commitment.

  3.  **Drafting - Section by Section:**

      *   **Title/Header:** Needs to look like a formal agreement. "Joint Statement on the Semantics and Pragmatics of Conditionals."
      *   **Introduction:** Briefly state the purpose (clarify dialectic, isolate disagreements).

      *   **Section 1: Agreed Claims:**
          *   Need common ground on data.
          *   *Claim 1:* There is a felt difference between "If Oswald didn't kill Kennedy..." (Indicative) and "If Oswald hadn't killed Kennedy..." (Subjunctive/Counterfactual).
          *   *Claim 2:* Both agree that *some* inferences feel valid and *some* feel invalid, but disagree on *why* (semantics vs. pragmatics).
          *   *Claim 3:* Context affects interpretation. (Crucial: Don't say "context shift explains the data," just say "context matters").
          *   *Claim 4:* "If A, then C" generally requires some connection between A and C (rejecting material conditional).
          *   *Claim 5:* Both agree that standard propositional logic (material implication) fails to capture natural language conditionals.

      *   **Section 2: The Disagreements Table (The Core):**
          *   *Crux 1: Antecedent Strengthening (Monotonicity).*
              *   Issue: Does $(A > C) \vDash ((A \land B) > C)$?
              *   Side A (Unified): No. Semantics is non-monotonic.
              *   Side B (Ambiguity): Yes, for indicatives. Apparent failures are pragmatic/contextual.
              *   *New Case:* Need something fresh. Maybe involving specific epistemic states about a complex system. Let's try a "Server Crash" scenario.
          *   *Crux 2: "Might" Duality.*
              *   Issue: Is $\neg(A > \neg C)$ equivalent to $A > \diamond C$?
              *   Side A: Yes, duality holds for both types (with appropriate modal base).
              *   Side B: No. Indicative "might" is epistemic possibility compatible with the antecedent; Counterfactual "might" is metaphysical/historical.
              *   *New Case:* A "Locked Room" mystery scenario.
          *   *Crux 3: Disjunctive Antecedents (Simplification).*
              *   Issue: Does $(A \lor B) > C$ entail $(A > C) \land (B > C)$?
              *   Side A: No (standard Lewis/Stalnaker). Requires specific mechanisms (e.g., alternative semantics).
              *   Side B: Yes, for indicatives (strict conditional). Counterfactuals might differ.
              *   *New Case:* "The Two Switches" electrical circuit.
          *   *Crux 4: Undetermined/Future Antecedents.*
              *   Issue: Open futures. "If the coin lands heads..."
              *   Side A: Evaluated at closest worlds where it lands heads (metaphysical openness handled by branching or similarity).
              *   Side B: Indicatives about the future are predictions based on current evidence (epistemic), not world-selection.
              *   *New Case:* "The Quantum Die" (indeterministic but weighted).
          *   *Crux 5: Ordering Source.*
              *   Issue: What determines the "closest" world? Similarity metric vs. Contextual Premise Set.
              *   Side A: Primitive similarity (weighted by context).
              *   Side B: Deductive closure from a set of premises (for indicatives).
              *   *New Case:* "The Historian's Counterfactual" (conflicting facts).

      *   **Section 3: The Meta-Question (Verbal Dispute?):**
          *   Address the "Same Context" problem.
          *   Is it verbal? Partially, regarding the label "semantics" vs "pragmatics."
          *   What moves the debate? Embedding tests (under 'believe', 'know', probability operators).

  4.  **Refining the Tone:**
      *   Must sound like two philosophers who respect each other but disagree deeply.
