  *(Self-Correction on Crux 1)*: The prompt asks specifically about "once the modal base is held fixed." This is the hardest part for Side A. Side A says you *can't* hold it fixed in natural language easily. Side B says you can. I need to construct a case where we *try* to fix it. A "Database Query" analogy might work well for a grad seminar context.

