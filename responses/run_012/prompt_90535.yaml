answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Semantics and Pragmatics of Natural Language Conditionals
  **Signatories:** [Student A] (Unified Restrictor Account) & [Student B] (Ambiguity/Strict Account)
  **Date:** Midterm Period
  **Course:** PHI 605: Philosophy of Language

  ### Preamble
  We, the undersigned, acknowledge that our ongoing dialectic regarding the semantics of conditionals has reached a point of diminishing returns due to unclarified assumptions about data, methodology, and the division of labor between semantics and pragmatics. This document serves to isolate our points of agreement to establish a shared empirical baseline, and to formalize our disagreements into testable predictions using novel cases designed to bypass standard literature examples (e.g., Kennedy, Sobel, McGee) which have become rhetorically inert in our specific discourse.

  ### Part I: Agreed Claims
  *The following claims are endorsed by both parties. Neither party shall invoke a violation of these claims as a rebuttal in seminar discussion without further argument.*

  1.  **The Material Conditional is Inadequate:** Both parties agree that the truth-functional material conditional ($\supset$) fails to capture the truth conditions or assertibility conditions of natural language indicatives and counterfactuals. Specifically, we agree that conditionals with false antecedents and true consequents are not automatically acceptable.
  2.  **Mood Matters:** There is a systematic interpretive difference between indicative conditionals (e.g., "If Oswald didn't shoot Kennedy...") and subjunctive/counterfactual conditionals (e.g., "If Oswald hadn't shot Kennedy..."). Both parties agree this difference correlates with the speaker's presuppositions regarding the truth of the antecedent.
  3.  **Context Sensitivity:** The truth conditions or assertibility conditions of a conditional are sensitive to conversational context. Both parties agree that changing the salient background information can change the evaluation of a conditional. *Note: We disagree on whether this sensitivity is best modeled as a shift in semantic parameters (Side A) or a shift in the relevant modal base/premise set (Side B), but we agree the phenomenon exists.*
  4.  **Non-Truth-Functional Connection:** Both parties agree that for a conditional "If A, C" to be acceptable, there must be some connection (causal, evidential, or explanatory) between A and C, beyond the independent truth values of A and C.
  5.  **Embedding Data:** Both parties agree that conditionals embed under propositional attitude verbs (e.g., "Alice believes that if A, C") and that any viable semantics must account for the interaction between the conditional and the attitude verb without generating scope ambiguities that violate intuitive readings.

  ### Part II: Points of Contention and Predictive Divergence
  *For each crux, we specify the issue, the precise formulation each side endorses, and a novel test case constructed for this collaboration. We commit to accepting the intuitive verdicts of the seminar cohort on these specific cases as data.*

  | Crux | Issue | Side A (Unified Restrictor) Formulation | Side B (Ambiguity/Strict) Formulation | Side A Prediction | Side B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Antecedent Strengthening** | Does Monotonicity hold for Indicatives when the Modal Base is fixed? | The semantics of "if" is universally variably strict. Monotonicity fails semantically. Apparent validity is pragmatic. | Indicatives are Strict Conditionals relative to an epistemic modal base. Monotonicity holds semantically. Apparent failure is due to modal base shift. | **Case:** *The Server Log.* We know the server crashed due to *either* Overload (O) or Memory Leak (M), but not both. We know if O occurred, the Log shows Error 1 (L1). <br> **Premise:** If O, then L1. <br> **Test:** Therefore, if (O and M), then L1. | **Invalid.** Adding M changes the closest worlds. In the closest (O & M) worlds, the interaction might suppress L1. The inference fails even if we try to hold context fixed. | **Valid.** Given our current knowledge (modal base), all epistemically accessible O-worlds are L1-worlds. Since (O & M) worlds are a subset of O-worlds, they must also be L1-worlds. If it feels invalid, we have silently added new info to the modal base. |
  | **2. 'Might' Duality** | Is $\neg(A > \neg C)$ equivalent to $A > \diamond C$ for both types? | Yes. "Might" is the dual of "Would" for both indicatives and counterfactuals. The difference is only the modal base (epistemic vs. metaphysical). | No. Indicative "might" is purely epistemic consistency. Counterfactual "might" is metaphysical/historical possibility. They do not share a logic. | **Case:** *The Locked Room.* The door is locked. We know the key is either in Box A or Box B. <br> **Test:** Compare "If the key is in Box A, it might not open the door" vs. "It is not the case that if the key is in Box A, it would open the door." | **Equivalent.** Both sentences express that in some closest worlds where the key is in A, it fails to open. Rejecting one commits you to the other. | **Distinct.** The first is acceptable (epistemically, for all we know, the key is broken). The second is false (given the key is in A, it *would* work, based on physical laws). Duality fails for indicatives. |
  | **3. Disjunctive Antecedents** | Does $(A \lor B) > C$ entail $(A > C)$? (Simplification) | No. Standard variably strict semantics does not validate simplification. It requires special treatment (e.g., alternative semantics). | Yes, for Indicatives. If "If A or B, C" is true strictly, then in all accessible (A or B) worlds, C holds. Thus in all accessible A-worlds, C holds. | **Case:** *The Two Switches.* A light turns on if Switch 1 is up OR Switch 2 is up. <br> **Test:** "If Switch 1 or Switch 2 is up, the light is on." Does this entail "If Switch 1 is up, the light is on"? | **Invalid (Semantically).** The truth of the disjunctive antecedent selects worlds where *at least one* is up. It does not guarantee that the closest A-worlds are among the selected worlds. Intuition of validity is pragmatic. | **Valid (For Indicatives).** If the strict conditional holds for the union of A and B worlds, it must hold for the subset of A worlds. If it feels invalid, we are treating it as a counterfactual. |
  | **4. Undetermined Futures** | How are open future indicatives evaluated? | Evaluated via metaphysical/historical modal base. We look at closest worlds where the future event occurs. Truth is objective relative to branching. | Evaluated via epistemic modal base. They are predictions based on current evidence, not descriptions of metaphysical branches. | **Case:** *The Quantum Die.* A genuinely indeterministic die is rolled tomorrow. It is weighted 90% to land 6. <br> **Test:** "If the die is rolled tomorrow, it will land 6." | **False (or indeterminate).** Even in the closest worlds where it is rolled, there are branches where it lands 1-5. "Will" requires truth in *all* relevant future branches. | **True (Assertible).** Given our current evidence (the weighting), the epistemic modal base supports the consequent. It is a claim about probability relative to knowledge, not metaphysical necessity. |
  | **5. Ordering Source** | What determines the "closest" world? | Primitive Similarity. Context supplies weights for dimensions of similarity (law, fact, etc.), but the metric is fundamentally comparative similarity. | Premise Sets (Kratzerian). Context supplies a set of propositions (facts/laws). The ordering is derived from how many premises are satisfied. | **Case:** *The Historian's Counterfactual.* "If Napoleon had won at Waterloo, Europe would be French-speaking." <br> **Test:** Do we prioritize keeping physical laws fixed or keeping specific historical facts fixed? | **Similarity Metric.** We weigh laws heavily, but some specific facts (e.g., geography) are held fixed by similarity weighting. There is no strict premise set; it is a holistic comparison. | **Premise Set.** We explicitly select which facts to hold fixed (e.g., "Hold 1815 geography fixed, vary battle outcome"). If the inference fails, it is because the premise set was underspecified. |

  ### Part III: The Meta-Question
  **Is any part of this dispute merely verbal?**

  **Joint Assessment:**
  We agree that a portion of the dispute is terminological regarding the label "Semantics" vs. "Pragmatics."
  *   **Side A** classifies the mechanism that restricts the domain of worlds as part of the semantic value of "if" (a restrictor).
  *   **Side B** classifies the mechanism that restricts the domain as part of the context (a modal base) applied to a strict operator.

  However, we agree this is **not merely verbal** because it generates different predictions regarding **embedding** and **anaphora**.

  **What would move the debate?**
  We agree that intuition pumps regarding simple conditionals (the "three examples" re-litigated in class) are insufficient. To resolve the dispute, we require data on:
  1.  **Conditional Antecedents:** "If (if A, B), then C." (Side A predicts complex restrictor nesting; Side B predicts difficulty or different truth conditions).
  2.  **Probability Operators:** "It is probable that if A, C." (Side A predicts this equals $P(C|A)$; Side B predicts this equals the probability of the strict conditional).
  3.  **Cross-Anaphora:** "If A, then C. If D, then it too." (Does "too" refer to the same modal base?).

  **Commitment:**
  We agree to suspend claims of "obvious falsity" regarding the other's position until the seminar has evaluated the five novel cases in Part II. We acknowledge that if the cohort's intuitions align with Side B on Case 1 (Monotonicity) while holding context fixed, Side A must posit a more robust pragmatic mechanism than currently outlined. Conversely, if the cohort rejects Duality in Case 2 (Might), Side A must revise the unified modal logic.

  __________________________
  [Student A Signature]

  __________________________
  [Student B Signature]
