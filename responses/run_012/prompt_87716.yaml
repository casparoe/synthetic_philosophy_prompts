      *   **Mission:** "Make the county more capable of acting well in the present" (interpreted by the user as a loose Nietzschean "history for life," but suspected by the user to be mere reassurance).
      *   **Task:** Create a decision-making procedure for exhibition content/labeling based on Nietzsche's *On the Use and Abuse of History for Life*.
      *   **Framework:** Must use Nietzsche's three modes: Monumental, Antiquarian, Critical. Must address how each serves life and how each turns against it.
      *   **Structure:** Questions in order, sufficient answers, stopping points/verdicts, hand-off points (values vs. facts).
      *   **Application:** Run the procedure on three specific cases:
          1.  The industrialist's library (donor/descendant stake).
          2.  A dying craft tradition (preservation vs. vitality).
          3.  A recent episode of violence (trauma/silence).
      *   **Constraint:** At least one verdict must be unpopular/unliked.
      *   **Conclusion:** State what the procedure *cannot* decide and where it might misfire on modern subjects Nietzsche didn't imagine.

  2.  **Deconstruct Nietzsche's *On the Use and Abuse of History for Life*:**
      *   *Monumental History:* Focuses on great deeds/figures to inspire action in the present.
          *   *For Life:* Inspires greatness, shows possibility.
          *   *Against Life:* Distorts truth, ignores context, makes the past a static idol, discourages unique present action by trying to copy the past.
      *   *Antiquarian History:* Focuses on preservation, reverence, roots, detail.
          *   *For Life:* Gives sense of belonging, stability, gratitude.
          *   *Against Life:* Becomes mere hoarding, mummification, rejects new growth, treats everything old as equally valuable (paralysis).
      *   *Critical History:* Focuses on judging and condemning the past to break its chain.
          *   *For Life:* Frees the present from oppressive past sins, allows new creation.
          *   *Against Life:* Can lead to rootlessness, destruction of identity, cynicism, unjust condemnation without understanding.
      *   *The Goal:* History must serve *life* (action, growth, future), not truth for truth's sake or comfort for comfort's sake.

  3.  **Drafting the Procedure (The "Nietzschean Audit"):**
      *   *Goal:* Ensure the exhibition serves "life" (action/vitality) rather than "mummification" (comfort/stasis).
      *   *Step 1: Identify the Dominant Mode.* What kind of history is this naturally leaning towards?
      *   *Step 2: Test for Vitality (The "For Life" Check).* Does this inspire, ground, or liberate?
      *   *Step 3: Test for Poison (The "Against Life" Check).* Is it becoming idolatry, hoarding, or rootless destruction?
      *   *Step 4: The Synthesis/Verdict.* How to balance them?
      *   *Hand-off Points:* Where do we need the Board/Director? When the "value" of the life being served is contested (e.g., whose life? what kind of action?).

      *Refining the Steps for the User's Context:*
      *   Need to be practical (weeks, not years).
      *   Need to address the Board's vague mission.
      *   *Question 1 (Mode):* Which mode is this exhibition defaulting to?
      *   *Question 2 (Service):* What specific *action* in the present does this enable? (Crucial for Nietzsche).
      *   *Question 3 (Pathology):* What is the specific risk of this mode becoming toxic here?
      *   *Question 4 (Correction):* How do we inject the *other* modes to balance it?
      *   *Verdict:* Go/No-Go/Modify.
      *   *Hand-off:* When the "action" defined is political or ethical rather than historical.

  4.  **Running the Procedure on the Three Cases:**

      *   *Case 1: The Industrialist's Library.*
          *   *Default:* Monumental (Great Man) + Antiquarian (Preserving the building/name).
          *   *Risk:* Monumental becomes hagiography (ignoring labor exploitation). Antiquarian becomes mummification (honoring the name over the function).
          *   *Nietzschean Fix:* Critical history is needed to judge the fortune's source.
          *   *Verdict:* Display the library, but explicitly link the fortune to the labor/cost. *Unpopular Verdict:* The plaque must mention the controversial source of wealth, risking donor anger. (This fits the "one verdict we will not like" constraint).

      *   *Case 2: Dying Craft Tradition.*
          *   *Default:* Antiquarian (Preserving the old way).
          *   *Risk:* Mummification. Treating the craft as a dead thing to be looked at, not a living practice.
          *   *Nietzschean Fix:* Monumental history. Frame the crafters as creators inspiring new creation, not just relics.
          *   *Verdict:* Don't just show tools; show the *act* of making and invite current practitioners. Focus on the *future* of the craft, not just its past.

      *   *Case 3: Recent Episode of Violence.*
          *   *Default:* Critical (Judging the sin) or Antiquarian (Suppressing to protect reputation).
          *   *Risk:* Critical can reopen wounds without healing. Antiquarian (silence) kills the ability to act well in the present (ignoring the cause).
          *   *Nietzschean Fix:* Critical history is necessary to break the chain, but must be done to enable *future* action, not just guilt.
          *   *Verdict:* Must be exhibited, but framed around the *capacity to prevent recurrence*. Silence is "history against life." (This might also be unpopular, but the Library one is more financially risky). Let's make the Library one the "unpopular" financial risk, and this one the "unpopular" social risk. I'll stick with the Library one as the primary "unliked" verdict regarding the Board/Donors, as that fits the prompt's tension about the mission statement. Actually, the prompt asks for "At least one of the three verdicts should be one we will not like." I will make the Violence one the one the *community* won't like, or the Library one the *Board* won't like. Let's go with the Library one requiring a label change that risks funding.

  5.  **Drafting the Conclusion:**
      *   *Limitations:* Nietzsche assumes a coherent "life" to serve. In a pluralistic democracy, whose "life"?
      *   *Misfire:* Systemic/Structural issues (racism, capitalism) that Nietzsche viewed through individual "Great Men." Also, trauma psychology (Nietzsche treats memory as a choice; modern science knows trauma is physiological).

  6.  **Review and Refine:**
      *   *Tone:* Professional, philosophical but practical, slightly weary but resolute (matching the user's voice).
      *   *Check Constraints:* Questions in order? Yes. Sufficient answers? Yes. Hand-off points? Yes. Three cases? Yes. Unpopular verdict? Yes. Limitations? Yes.
      *   *Nietzschean Accuracy:* Ensure the distinction between "serving life" and "comforting the living" is clear. The Board wants comfort; Nietzsche wants vitality (which often hurts).

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Hand-off" points are clear. The procedure shouldn't make ethical value judgments itself; it should flag where the *definition* of "acting well" is contested.
      *   *Correction:* Ensure the "Unpopular Verdict" is explicit. I will choose the Industrialist case as the one that risks donor relations, as that directly challenges the "Board/Donor" tension mentioned in the prompt.

