      *   **The Argument:** Pain asymbolia suggests pain has two components: Sensation (S) and Unpleasantness (U).
      *   **Intrinsic View:** If pain is intrinsically bad, you can't have pain without badness.
      *   **Separability View:** If asymbolia is real, S and U are separable. Therefore, "pain" (the sensation) is not intrinsically bad; the "suffering" is an added layer.
      *   **Terminology:** This supports the *Imperativist* or *Evaluativist* views vs. *Sensory Hedonism*. It strongly supports the distinction made by philosophers like David Bain or bodily imperativism, but more classically, it supports the *Gate Control Theory* extension into affective neuroscience (Melzack & Casey).
