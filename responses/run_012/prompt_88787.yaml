      *   *(b) Feeling it fully but enduring it (Stoicism):* Stoicism implies the negative affect is present but suppressed or overridden by will. The patient *minds* but doesn't show it. In asymbolia, the patient genuinely *does not mind*. The unpleasantness is absent, not suppressed.
      *   *(c) Feeling it while unable to care about anything (Global Apathy/Abulia):* This is a general motivational deficit (e.g., severe depression, frontal lobe damage). In asymbolia, the indifference is often specific to pain (though can co-occur with other affective blunting). Crucially, in global apathy, they might not report the sensation accurately or engage with the examiner. In asymbolia, the cognitive processing of the sensation is preserved.

