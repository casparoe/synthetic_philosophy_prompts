      *   Panpsychism (too metaphysical).

  7.  **Failure Point:**
      *   The Anesthesia Dial might feel like it cheats the "different species" question.
      *   The Step Function might feel arbitrary.
      *   *Biggest Risk:* The distinction between (a) and (b) (Subjecthood vs. Intensity) is subtle. If they don't get that, the rest collapses.

  8.  **Drafting the Plan:**
      *   *Intro:* 5 mins.
