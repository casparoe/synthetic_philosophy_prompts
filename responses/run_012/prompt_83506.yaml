answer: |-
  # Second Amendment Decision Tree: Mapping the Logical Space

  **Start:** **Can an ordinary private citizen sue the government claiming a violation of their *personal* Second Amendment rights?**
  *   **NO** → Go to **Node A** (Collective/State/Obsolete)
  *   **YES** → Go to **Node 1** (Individual Right)

  ---

  ### Node 1: The Holder & Condition
  **Case:** *A state law bans rifle ownership for anyone not enrolled in a state-recognized militia.*
  *   **A. This is allowed.** The right is conditioned on militia service. → **Leaf: Militia-Centered Civic-Republican**
  *   **B. This is a violation.** The right belongs to me regardless of service. → Go to **Node 2**

  ### Node 2: The Purpose (Teleology)
  **Case:** *The federal government suspends elections and declares permanent martial law. Does the Amendment protect your right to use arms to resist this?*
  *   **A. Yes.** The ultimate purpose is checking tyranny. → **Leaf: Individual-Right/Insurrectionist**
  *   **B. No.** The purpose is lawful self-defense against criminals, not the state. → Go to **Node 3**

  ### Node 3: The Scope & Hohfeld Incident
  **Case:** *A city bans handguns in the home to reduce suicide rates. Courts weigh your right against public safety data.*
  *   **A. The right is a "Shield" (Immunity/Claim).** The justification fixes the scope; safety stats cannot override the core right. → **Leaf: Individual-Right/Self-Defense (Heller)**
  *   **B. The right is an "Interest" (Liberty).** The scope floats; the right is real but can be balanced against public safety. → **Leaf: Living Constitution**

  ---

  ### Node A: The Non-Individual Branch
  **Question:** **Is the Amendment still active law that limits government power?**
  *   **NO.** It is obsolete due to modern military/professional police. → **Leaf: Dead Letter / Repeal**
  *   **YES.** → Go to **Node B**

  ### Node B: The Beneficiary
  **Question:** **If the right isn't yours personally, who holds it?**
  *   **A. The States.** It protects state sovereignty against federal disarmament. → **Leaf: States' Right / Limits Congress Only**
  *   **B. The People (Collectively).** It protects a communal right, not separable into individual claims. → **Leaf: Collective Reading**

  ---

  ### Key Terms (Hohfeld Glossary)
  *   **Immunity/Claim (Shield):** The government *cannot* do this. Your status is protected regardless of consequences.
  *   **Liberty (Interest):** You are free to do this, *unless* the government has a strong enough reason to stop you.

  ### Empty & Incoherent Spaces
  *   **Insurrectionist + Living Constitution:** *Incoherent.* You cannot logically hold a right to overthrow the government that is subject to the government's own safety balancing tests.
  *   **Individual Right + Militia Condition:** *Explored.* This is the **Civic-Republican** leaf. It is coherent but rarely defended in modern litigation.
  *   **Dead Letter + Active Limit:** *Logically Impossible.* If it limits government (Active), it is not a Dead Letter.
  *   **States' Right vs. Limits Congress:** *Functionally Identical for Individuals.* Both result in "No Individual Standing." Distinguished historically by whether the State *holds* the right or is merely the *beneficiary* of a federal restriction.

  ### The Leaves (Named Positions)
  1.  **Individual-Right/Self-Defense:** Personal right, fixed scope, home defense focus.
  2.  **Individual-Right/Insurrectionist:** Personal right, fixed scope, tyranny resistance focus.
  3.  **Militia-Centered Civic-Republican:** Personal right, but only when tied to organized service.
  4.  **Living Constitution:** Personal right, flexible scope, balanced against safety.
  5.  **States' Right / Limits Congress:** No personal right; protects state sovereignty/federalism.
  6.  **Collective Reading:** No personal right; belongs to "the people" as a blob.
  7.  **Dead Letter:** The Amendment is obsolete and should be repealed.
