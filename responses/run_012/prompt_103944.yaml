answer: |-
  **The Constitution That Knows It Will Die**

  In a small parliamentary republic, largely ignored by the major powers, a quiet revolution has been ticking away for two years. The country replaced its century-old founding document with a charter that contains a startling feature: an expiration date. Every twenty years, the constitution lapses. Unless the citizenry explicitly re-ratifies it, the old order returns.

  This "sunset clause" is the most visible part of a radical design, but it is not the only one. The new charter allows any provision to be revised by a two-thirds vote of two successive assemblies, yet it places a short list of core provisions—including the amendment rule itself—beyond reach. To police this boundary, a "repair clause" empowers the constitutional court not merely to strike down inconsistent amendments, but to supply the "minimal correction" needed to restore coherence.

  The result is a genuine controversy. One camp of legal scholars argues this design is the only serious answer to the vulnerability of democracy: a legal order that can change anything can change itself into a tyranny, so an entrenched core policed by judges is necessary to prevent the system from devouring itself. The opposing camp argues that the repair clause gives judges a roving commission to rewrite the law, that the unamendable core shifts sovereignty from the people to the bench, and that the twenty-year sunset renders the state unstable, resting on recurring political moods rather than legal foundation.

  Beneath this debate lies a deeper, older worry. It is a problem familiar to anyone who has studied the philosophy of law: Can a legal order ground its own authority in itself? Or does the foundation of law always lie outside the law, in a political fact that no clause can manufacture?

  As we weigh this experiment, we must decide: Is this charter a coherent solution to the paradox of self-government, or does it collapse into arbitrary power? The answer requires us to separate the genius of the design from its fatal flaw. The sunset clause saves the constitution from philosophical incoherence, but the repair clause threatens to undo that legitimacy. To make this experiment work, we must keep the clock, keep the lock, but fire the repairman.

  ***

  To understand why this matters, we must first understand the problem every constitution faces. It is the problem of the "suicide pact." If a constitution allows itself to be amended without limit, a determined majority can use the amendment process to abolish democracy itself. This is not a theoretical worry; it is the lesson of the twentieth century. Legal systems that allow unlimited self-revision can be legally transformed into tyrannies.

  Camp A, the defenders of the new charter, argue that the unamendable core solves this. By placing the amendment rule and a few rights beyond the reach of the assembly, they create a firewall. But Camp B, the skeptics, rightly point out the cost. If the assembly cannot change the rules of the game, who decides what the rules are? The answer, in this design, is the constitutional court.

  This is where the "repair clause" becomes dangerous. The clause instructs the court to strike down amendments that render the charter inconsistent and to *supply the correction*. This is not adjudication; it is legislation. When a judge decides that a law is "inconsistent" and then writes the text to fix it, they are no longer interpreting the sovereign's will; they are substituting their own. Camp B is correct to fear that this relocates sovereignty from the elected assembly to the bench. In a traditional system, if the legislature passes a bad law, the court strikes it down and sends it back. Here, the court fixes it. This creates a "roving commission," as the critics say, allowing judges to tidy up the charter according to their own vision of coherence.

  However, Camp B's critique of the sunset clause misses the mark. They argue that a constitution that expires after twenty years rests on "nothing but a recurring political mood." They view this as a weakness. I argue it is the charter's greatest strength. It is the only feature that honestly addresses the deep worry of self-reference.

  Legal philosophers like Hans Kelsen and H.L.A. Hart long ago identified that a legal system cannot fully validate itself. A constitution says, "I am the law because this constitution says so." This is circular. Eventually, the chain of authority must rest on something outside the law: a social fact, a revolution, a collective acceptance. Traditional constitutions hide this fact. They pretend to be eternal, masking the political reality that they endure only because people obey them.

  This new republic's charter stops pretending. By including a sunset clause, it admits that its authority is not magical or eternal. It is a contract that must be renewed. It acknowledges that the "basic norm" of the society is not a legal rule, but a political commitment that requires periodic reaffirmation. In doing so, it resolves the paradox of self-reference. It does not try to ground its authority in itself forever; it grounds its authority in a recurring act of political will.

  This changes the game-theoretic calculus of the system. In the literature on self-amending rules, we often speak of "pre-commitment strategies"—like Ulysses tying himself to the mast to resist the Sirens. A permanent constitution is a pre-commitment that lasts forever. But what if the crew changes? What if the Sirens change their song? A twenty-year pre-commitment is more honest. It allows the society to bind itself, but it admits that the binding is a choice, not a destiny.

  So, we have a design with two conflicting engines. The sunset clause grounds the system in honest political reality, granting it legitimacy. The repair clause, however, masks political choice as technical necessity, threatening its coherence.

  Can the two coexist? The defenders of the charter might argue that the sunset clause tames the repair clause. If the judges abuse their power to "repair" the text, the people can simply refuse to re-ratify the constitution when the twenty years are up. The threat of reversion to the old constitution keeps the court in check.

  This is a seductive argument, but it is insufficient. The problem is that the re-ratification vote would be held under the terms of the *current* charter, which includes the court's "repairs." If the court has subtly rewritten the unamendable core over two decades under the guise of "minimal correction," the voters are not ratifying the original deal; they are ratifying the judges' version of it. The repair clause allows the court to alter the very terms of the renewal. This creates a feedback loop where the guardians of the constitution can slowly become its authors.

  Therefore, the verdict must be specific. The constitutional experiment is **legitimate** in its foundation but **incoherent** in its mechanism.

  The **sunset clause** must survive. It is the only feature that successfully navigates the Scylla and Charybdis of constitutional theory: the risk of tyranny (if the constitution is too rigid) and the risk of suicide (if it is too flexible). By forcing a recurring moment of constituent power, it ensures that the "rule of recognition" remains a social fact, not a legal fiction. It admits that the law rests on politics, and that is a strength, not a weakness.

  The **unamendable core** must also survive, but with a caveat. A legal order needs a hard shell to protect the rules of the game from the players. Without an entrenched amendment clause, the sunset provision itself could be voted away in a moment of passion. However, the definition of this core must be narrow. It should protect the amendment process, the sunset clause, and fundamental rights, but nothing more.

  The **repair clause**, however, cannot survive. It is the point where the design collapses into paradox. A court cannot "supply a correction" without making a political choice about what the constitution *ought* to say. In a system where the constitution expires, the court should be a guardian of the text, not an editor. If an amendment creates an inconsistency, the court should strike it down and return it to the assembly. It should not write the fix. To do so is to claim a sovereignty that the sunset clause explicitly denies the judiciary. The legitimacy of the charter comes from the fact that the people renew it, not that the judges perfect it.

  ***

  The critics in Camp B are right to worry about judicial power, but wrong to dismiss the sunset. The defenders in Camp A are right to worry about self-destruction, but wrong to trust the repair clause.

  The small republic has stumbled upon a profound insight: a constitution is not a monument; it is a lease. By acknowledging that the legal order rests on a political foundation that must be revisited, they have solved the ancient problem of self-reference. They have admitted that the law cannot pull itself up by its own bootstraps forever.

  But in their desire to ensure the charter remains "coherent," they have handed the judges a pen. That pen must be taken away. If the republic removes the repair clause, keeping the sunset and the core, it will have achieved something rare: a legal order that is humble enough to know it might die, and strong enough to protect itself while it lives.

  The experiment is worth watching, but it is not yet safe. A constitution that knows it will die is a breakthrough. A constitution that lets judges rewrite its will is a risk. We should hope the republic keeps the clock, but locks the drawer.
