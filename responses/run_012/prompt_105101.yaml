  ### The Prediction
  Priya will say you are **not required** to pay for the stranger's $300 surgery. She will likely call it "incredibly generous" or "a beautiful thing to do," but she will maintain that you are morally permitted to keep the money.

  ### The Rule She Is Running
  Priya is operating on a hybrid principle I'd call the **"Identifiable Mortal Rescue"** rule.

  It combines two distinct filters that both must be passed to trigger a requirement:
  1.  **Identifiability:** The victim must be a specific, named individual (ruling out Cases 4, 5, 6).
  2.  **Mortality:** The harm at stake must be death (ruling out Cases 4, 6, and your Test Case).

  This explains why she demands $5,000 for the named child (Case 3) but won't spend $300 to prevent blindness anonymously (Case 4). To her, the *type* of harm (Death vs. Blindness) is a brighter moral line than the *cost* ($300 vs $5,000), provided the victim is identifiable.

  ### The Competing Rule
  The strongest alternative theory that fits all six of her previous verdicts is the **"Identifiable Severe Harm"** rule.

  *   **Logic:** You are required to help any *identifiable* person facing *catastrophic* harm, whether that harm is death or permanent disability (like blindness).
