  1.  **The EA Influence:** Priya went "deep into effective altruism." While EA argues against the Identifiable Victim Effect, those who partially adopt it often retain the EA focus on *severity of outcome* (QALYs/DALYs). In utilitarian calculus, death is the ultimate negative utility. Blindness is severe, but it is categorically distinct from death. Her rejection of the trachoma charity (Case 4) despite the low cost suggests she has set a "Life-or-Death" threshold for *obligation*, reserving non-fatal aid for *supererogation* (nice-to-do).
