  # Activity: The Oracle's Ledger

  **Time:** 90 Minutes
  **Class Size:** 16 Students
  **Materials:** 
  *   Two large boxes labeled "Aleppo" and "Damascus."
  *   One red block ("Death") and one green block ("Life").
  *   One sealed envelope labeled "Oracle's Prediction."
  *   One large coin.
  *   Bowl of candy (small pieces).
  *   Whiteboard.

  **Payoff Structure:**
  *   **Survival:** 10 pieces of candy per student.
  *   **Death:** 0 pieces of candy.
  *   *Note:* You will withhold all candy until the very end of the debrief. This creates a tangible stake in the "Survival" condition without disrupting the flow with distribution.

  ---

  ## Part 1: Setup (0:00 – 0:10)

  **The Frame:**
  Tell the class: "We are going to run a simulation of a decision problem. You are the Traveler. I am the Oracle. In this scenario, I have perfect knowledge of what you will choose before you choose it. I have already placed the Death token in one of these two boxes based on that knowledge."

  **The Rules:**
  1.  **Deliberate:** You (the class) must collectively decide which box to open.
  2.  **Reveal:** Once you choose, we open that box.
  3.  **Payoff:** If the box contains Life (Green), you all get candy. If it contains Death (Red), you get nothing.
  4.  **Constraint:** I have already sealed the Prediction envelope and placed the tokens *before* you walked in. I cannot change them. ( **Instructor Note:** This is the necessary lie to simulate the problem structure. Do not waver on this until the debrief.)

  **The Vertigo Hook:**
  Write on the board: *If you go where Death is, you die. If you go where Death isn't, you live.*
  Add: *The Oracle puts Death where you are going to be.*

  ---

  ## Part 2: The Deterministic Trap (0:10 – 0:30)

  **Round 1:**
  *   **Action:** Give them 5 minutes to deliberate. They will likely try to reason their way out ("He expects us to go Left, so we go Right!").
  *   **The Move:** Let them vote. Suppose they choose **Aleppo**.
  *   **The Reveal:** Open the Aleppo box. Reveal the **Red (Death)** token.
  *   **The Script:** "The Oracle predicted this. The token was here before you chose."
  *   **Result:** 0 Candy.
  *   **Feeling:** Frustration. "But we chose that *because* we thought Death was in Damascus!"
  *   **Response:** "Then the Oracle would have put Death in Damascus. The prediction tracks your reasoning."

  **Round 2:**
  *   **Action:** Give them 5 minutes. They will try to outthink the prediction ("Let's choose the one that feels less rational").
  *   **The Move:** They choose **Damascus**.
  *   **The Reveal:** Open the Damascus box. Reveal the **Red (Death)** token.
  *   **The Script:** "Again. Your deliberation is the signal the Oracle reads."
  *   **Result:** 0 Candy.
  *   **Feeling:** Helplessness. The "Vertigo." Every reason to pick a room is a reason Death is in that room.

  ---

  ## Part 3: The Randomization Escape Hatch (0:30 – 0:50)

  **The Pivot:**
  Ask: "Is there any way to make a choice that the Oracle cannot read?"
  Wait for them to suggest **Randomization** (Coin Flip). If they don't suggest it by minute 40, introduce the coin yourself as a "Chaos Generator."

  **Round 3:**
  *   **Action:** They agree to flip the coin. Heads = Aleppo, Tails = Damascus.
  *   **The Move:** Have a student flip the coin. It lands **Heads (Aleppo)**.
  *   **The Reveal:** Open the Aleppo box. Reveal the **Red (Death)** token.
  *   **The Script:** "The Oracle predicted the coin flip."
  *   **Result:** 0 Candy.

  **The "Cheap" Escape:**
  Ask: "Why didn't the coin save you?"
  Guide them to: "Because in this problem, the Predictor is perfect. He predicts the physics of the flip just like he predicts your psychology."
  *   **Key Insight:** "So randomization only works if the Predictor is *imperfect*. But the problem stipulates Perfection."
  *   **Feeling:** The realization that the escape hatch is locked from the outside.

  ---

  ## Part 4: The Debrief (0:50 – 1:30)

  **Step 1: The Reveal (5 mins)**
  *   **Action:** Open the "Oracle's Prediction" envelope. It is **blank**.
  *   **Confession:** "I did not predict you. I placed the Death token *after* you chose, every time. I lied about the timeline to make you feel the structure of the problem."
  *   **Immediate Reaction:** Expect some annoyance. Validate it. "You feel tricked. Good. Hold that feeling."

  **Step 2: Mapping the Trick to the Logic (20 mins)**
  *   **Objective 3 (Equivocation):** Ask: "When did I treat the Prediction as a Fixed Fact? When did I treat it as an Effect of your Choice?"
      *   *Fixed Fact:* When I told you "I cannot change the tokens" to induce anxiety.
      *   *Effect of Choice:* When I actually moved the token to match your choice to ensure the correlation.
      *   *The Point:* The Death in Damascus argument relies on this same slide. It treats the Prediction as a fixed fact of the world (you can't change the past) to block escape, but treats it as dependent on your choice (it matches your choice) to ensure doom.
  *   **Objective 2 (Incompatibility):** Ask: "Could I have actually done what I claimed?"
      *   *Answer:* No. Perfect Prediction + Genuine Choice are incompatible in this timeframe. If I know what you will do, you aren't choosing in a way that could be otherwise. If you are choosing freely, I cannot know with certainty.
      *   *The Point:* The problem asks you to assume two things that cannot coexist: that your choice is open, and that the outcome is fixed by prediction.

  **Step 3: The Randomization Post-Mortem (15 mins)**
  *   **Objective 1 (The Cheap Escape):** Ask: "If I had actually been a perfect predictor, would the coin have saved you?"
      *   *Answer:* No. A perfect predictor predicts the coin.
      *   *Follow up:* "So when does randomization work?"
      *   *Answer:* Only if the predictor is physically incapable of predicting quantum/random events.
      *   *The Point:* The "Escape Hatch" requires breaking the "Perfect Predictor" premise. If you keep the premise, the hatch is an illusion.

  **Step 4: Naming the Case (5 mins)**
  *   Reveal: "This is **Death in Damascus**."
  *   Connect to Newcomb's: "In Newcomb's, the prediction affects the *money*. Here, the prediction affects *Death*. In Newcomb's, you can argue Causal Decision Theory saves you. Here, Causal Decision Theory tells you: 'It doesn't matter where you go, you're dead.' That is the fatalism you felt."

  **Step 5: Payout (5 mins)**
  *   Distribute the candy (10 pieces each).
  *   **Closing Line:** "You survived the debrief. In the real world, unlike this seminar, the future is not written by your teacher."

  ---

  ## What Will Predictably Go Wrong (And How to Handle It)

  **1. The "Magic Trick" Suspicion**
  *   **Risk:** A skeptical student suspects you are moving the tokens mid-game (because this is a philosophy class, and they know tricks). If they call it out at minute 20, the vertigo collapses.
  *   **Handle:** Do not get defensive. Say: "Assume for the sake of the simulation that I am not cheating. If you assume I am fallible, you aren't playing the game. You are playing 'Catch the Teacher.' Play 'Beat the Oracle.'"
  *   **Backup:** If they refuse to suspend disbelief, switch to **Stipulated Logic**. "Okay, assume I *did* pre-place them. Given that rule, what do you do?" The logic holds even without the physical prop.

  **2. The "Just Don't Go" Objection**
  *   **Risk:** A student says, "I'll just stay in the classroom. I won't go to Aleppo or Damascus."
  *   **Handle:** "The Death Token is in the room you are in. The Oracle predicted you would try to opt-out." (Maintain the frame: Doom is ubiquitous).

  **3. Anger at the Lie**
  *   **Risk:** In the debrief, students feel manipulated rather than enlightened.
  *   **Handle:** Own it immediately. "I deceived you to replicate the deception of the Fatalist Argument. The argument tricks you by sliding between 'fixed fact' and 'dependent variable.' I did the same thing with the tokens so you could feel the slide viscerally. The anger you feel is the correct philosophical response to Fatalism."

  ---

  ## What This Activity Cannot Reproduce (The Cost)

  **1. Real Metaphysical Tension**
  *   **Limitation:** In the activity, the "Prediction" was a lie (retroactive fitting). In the actual philosophical problem, the Prediction is assumed to be *causally prior* (or logically prior) without deception.
  *   **Cost:** Students might walk away thinking the problem is just about "teachers cheating" rather than "logical incompatibility."
  *   **Mitigation:** The Debrief *must* spend significant time distinguishing the *simulation mechanic* (instructor deception) from the *logical mechanic* (logical entailment). Emphasize that in the real case, there is no liar, just a logical bind.

  **2. Genuine Uncertainty**
  *   **Limitation:** You (the Instructor) knew the outcome because you decided it. In the real problem, the Agent faces genuine uncertainty about the Prediction.
  *   **Cost:** The students were reacting to *your* authority, not to an abstract constraint.
  *   **Mitigation:** Remind them: "You felt helpless because I controlled the tokens. In the real problem, you feel helpless because Logic controls the tokens. The feeling of 'no exit' is the same."

  **3. The "Perfect Predictor" Reality**
  *   **Limitation:** You cannot actually demonstrate a Perfect Predictor. You can only assert one.
  *   **Cost:** The "Vertigo" relies on their trust in your authority, not on evidence of prediction.
  *   **Mitigation:** Acknowledge this. "I cannot give you a perfect predictor. I can only give you a perfect *correlation*. The philosophical work is asking: If this correlation existed, could you escape it? The activity forces you to answer 'No' so we can analyze why."
