      *   0-10: Setup.
      *   10-30: Rounds 1 & 2 (Deterministic).
      *   30-50: Round 3 (Randomization).
      *   50-90: Debrief.

      *   *What will go wrong:*
      *   1. They suspect the trick early. -> Handle: "Assume for the sake of argument I am perfect."
      *   2. They refuse to randomize. -> Handle: Introduce the coin as an option.
      *   3. They get angry about the lie. -> Handle: Frame it as "Experiential Learning."

      *   *What can't be reproduced:*
      *   Real perfect prediction.
      *   Cost: The "vertigo" is manufactured by the teacher's deception, not logical necessity. Must clarify this distinction.

      *   *Let's write it.*
