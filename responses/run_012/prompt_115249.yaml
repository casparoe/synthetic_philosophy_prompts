prompt: |-
  A colleague in psych just sent me the draft of a chapter he's writing for a general audience, and I don't want him putting something in print that people in the field will wince at. Here's his paragraph on cognitive penetration: 'Cognitive penetration is when your beliefs change what you see. Attention and expectation always shape perception, so all perception is cognitively penetrated -- that's why the same scene can look completely different to two people. This is the result the anti-modularity crowd was after, and it kills the idea of a neutral given: observation is theory-laden all the way down, so scientific observation isn't any more objective than anything else. And once you've accepted it, it follows that you can train yourself to literally see moral properties, which is why the virtuous see a different world than the rest of us do.'

  Go sentence by sentence: what would someone who actually works on this accept, what's a fair simplification for a general reader, and what's just wrong? He's a smart guy and he's not inventing things, but my instict is that he's collapsed some distinctions this literature keeps apart -- tell me which ones. The step I most want adjudicated is the last one: does anything in the first half actually license 'theory-laden all the way down, so no neutral observation,' or is that carrying more weight than the premise can bear? And if there's a weaker version of his paragraph that survives, say what it would have to look like.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Critique a draft paragraph on "cognitive penetration" written by a psychologist colleague for a general audience.
      *   **Goal:** Identify what's acceptable, what's a fair simplification, and what's wrong/misleading from the perspective of a specialist in the field (philosophy of mind/perception/cognitive science).
      *   **Specific Focus:** Sentence-by-sentence analysis.
      *   **Key Adjudication:** Does the first half license the "theory-laden all the way down / no neutral observation" conclusion, specifically the leap to moral perception?
      *   **Output:** A constructive critique identifying collapsed distinctions and offering a revised, weaker version that survives scrutiny.

  2.  **Analyze the Source Text (Sentence by Sentence):**

      *   *Sentence 1:* "Cognitive penetration is when your beliefs change what you see."
          *   *Assessment:* Roughly correct as a hook, but imprecise. It's not just "beliefs," it's cognitive states (beliefs, desires, expectations) influencing early perceptual processing. "Change what you see" is ambiguous (content vs. character vs. judgment).
          *   *Verdict:* Fair simplification, but needs nuance.

      *   *Sentence 2:* "Attention and expectation always shape perception, so all perception is cognitively penetrated -- that's why the same scene can look completely different to two people."
          *   *Assessment:* **Major Red Flag.** This conflates *attention* (selection) with *penetration* (processing). It also conflates *expectation* (often low-level statistical learning) with *cognitive penetration* (high-level conceptual influence). Most importantly, it moves from "some influence" to "all perception is penetrated." This is the "Strong Penetration" view, which is highly contested (e.g., Firestone & Scholl vs. Lupyan). The "look completely different" part is also hyperbolic; usually, it's subtle shifts in appearance, not wholesale reality changes.
          *   *Verdict:* Problematic. Collapses attention/expectation/penetration. Overstates the consensus.

      *   *Sentence 3:* "This is the result the anti-modularity crowd was after, and it kills the idea of a neutral given: observation is theory-laden all the way down, so scientific observation isn't any more objective than anything else."
          *   *Assessment:* **Philosophical Overreach.** Even if penetration exists, it doesn't necessarily kill modularity (weak modularity allows some penetration). It definitely doesn't kill objectivity. Theory-ladenness (Hanson/Kuhn) is distinct from perceptual penetration. Scientific objectivity relies on intersubjective verification, not raw sensory neutrality. This is a non-sequitur.
          *   *Verdict:* Wrong/Exaggerated. Collapses perceptual penetration with epistemic theory-ladenness.

      *   *Sentence 4:* "And once you've accepted it, it follows that you can train yourself to literally see moral properties, which is why the virtuous see a different world than the rest of us do."
          *   *Assessment:* **The Leap.** This is the "moral perception" debate (e.g., Lord Shaun Gallagher, some virtue ethicists). While *some* argue this, it does *not* follow logically from standard cognitive penetration claims. Seeing a color differently due to expectation is not the same as seeing "wrongness" as a perceptual property. This is a category error (natural vs. non-natural properties).
          *   *Verdict:* Highly controversial, not a logical consequence of the premises provided.

  3.  **Identify Collapsed Distinctions (The "Instinct" Check):**
      *   Attention vs. Penetration (Top-down selection vs. Top-down processing).
      *   Expectation (Statistical/Perceptual) vs. Belief (Conceptual/Cognitive).
      *   Perceptual Content vs. Perceptual Judgment (Do I *see* it differently or *judge* it differently?).
      *   Epistemic Theory-Ladenness vs. Perceptual Cognitive Penetration.
      *   Descriptive Properties (Color/Shape) vs. Normative Properties (Moral Value).
      *   Modularity (Fodorian) vs. Permeability.

  4.  **Adjudicate the Key Step (Theory-Ladenness/Objectivity):**
      *   Does penetration imply "no neutral observation"? Not necessarily. It implies observation is *influenced*, not that it's *unconstrained* by the world.
      *   Does it imply "science isn't objective"? No. Objectivity is methodological, not purely sensory.
      *   Does it license moral perception? No. That requires a separate argument about the nature of moral properties.

  5.  **Drafting the Response:**
      *   *Tone:* Professional, collegial, precise but accessible (since the user is likely a philosopher or cognitive scientist talking to a psychologist).
      *   *Structure:*
          1.  Executive Summary (The "Wince" Factor).
          2.  Sentence-by-Sentence Breakdown (Acceptable vs. Wrong).
          3.  The Collapsed Distinctions (The Core Theoretical Errors).
          4.  Adjudicating the "Theory-Laden/Objectivity" Leap.
          5.  The Moral Perception Leap.
          6.  Proposed Revision (The "Surviving" Version).

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to acknowledge that *some* psychologists (like Lupyan) do argue for strong penetration. Don't present it as a settled "False," but as a "Highly Contested Claim presented as Fact."
      *   *Nuance:* Distinguish between "post-perceptual judgment" and "perceptual experience." This is the crux of the penetration debate.
      *   *Moral Properties:* Be careful not to dismiss moral perception entirely (some meta-ethicists defend it), but emphasize it doesn't *follow* from cognitive penetration of color/shape.

  7.  **Final Polish:** Check against the prompt's specific questions.
