  8.  *(Final thought on the "Moral" sentence)*: The phrase "literally see moral properties" is the biggest trigger for philosophers. Need to highlight the "Category Mistake" risk here.

  9.  *(Final thought on "Objectivity")*: The move from "perception is influenced" to "science isn't objective" is a classic relativist slide that needs to be checked.

