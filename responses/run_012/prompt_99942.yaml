answer: |-
  Here is the specification list for an adequate theory of choice under risk, tailored to your health-agency context.

  ### I. The Desiderata

  **1. Case Coverage**
  *   **Allais Common-Consequence & Common-Ratio:** The theory must accommodate preference reversals when a common outcome is added or scaled, without labeling the agent confused.
      *   *Consideration:* Your patients exhibit this. If the theory calls it an error, the aid invalidates their lived preference.
  *   **Ambiguity (Knightian Uncertainty):** Must distinguish between known probabilities (risk) and bounded/unknown probabilities (ambiguity).
      *   *Consideration:* Medical probabilities are often estimates. Patients treat "50% known" differently from "50% guessed."
  *   **Extreme/Lexicographic Outcomes:** Must handle outcomes like death or ruin that function as infinite disutilities or lexical constraints.
      *   *Consideration:* Standard utility functions often smooth over these; patients do not.
  *   **Unbounded Gambles (St. Petersburg):** Must not assign infinite value to gambles with infinite expected monetary value but vanishing probabilities.
      *   *Consideration:* Prevents the model from recommending absurd high-variance treatments with tiny chances of "miracle" cures.
  *   **Single-Shot vs. Tree Embedding:** Must account for the fact that preferences often satisfy independence when gambles are repeated or embedded in a decision tree, even if they violate it in isolation.
      *   *Consideration:* A treatment is a single shot, but health management is a long-term tree. The advice shouldn't contradict itself across timeframes.
  *   **Commitment & Time Inconsistency:** Must explain and accommodate the willingness to pay to restrict future choice.
      *   *Consideration:* Patients may want to commit to a regimen now knowing they will waver later.

  **2. Required Distinctions**
  *   **Risk vs. Ambiguity:** The functional form must separate attitudes toward known probabilities from attitudes toward probability imprecision.
      *   *Non-negotiable:* Collapsing these leads to brittle advice when medical data is uncertain.
  *   **Acts vs. Consequences:** Must distinguish between the value of the outcome and the value of the process (e.g., "trying everything" vs. "palliative").
      *   *Non-negotiable:* Patients often value the *choice* itself, not just the health state.
  *   **Intransitivity vs. Incompleteness:** Must distinguish between circular preferences (A>B>C>A) and undecided preferences (A?B).
      *   *Non-negotiable:* The remedy for incompleteness is more information; the remedy for intransitivity is arbitration.
  *   **Small-Stakes vs. Large-Stakes Risk Aversion:** Must allow for high risk aversion on large stakes without implying absurd risk aversion on small stakes.
      *   *Non-negotiable:* Standard utility curvature fails this calibration test.
  *   **Allais as Datum vs. Error:** Must treat the Allais pattern as a structural feature of preference, not a cognitive bug.
      *   *Non-negotiable:* Per your context, calling it an error makes the aid adversarial.
  *   **Descriptive vs. Normative:** Must separate what people *do* from what the aid *recommends* they do, while respecting the former.
      *   *Non-negotiable:* Pure description offers no guidance; pure normativity ignores the patient.

  **3. Formal Constraints**
  *   **Stochastic Dominance:** The theory must never recommend an option that is strictly dominated by another (first-order).
      *   *Non-negotiable:* Recommending a strictly worse treatment is malpractice.
  *   **Representation Theorems:** The axioms must map cleanly to a functional form that can be computed.
      *   *House Rule:* You need a formula to code into the aid.
  *   **Money-Pump/Dutch-Book Immunity:** The theory must prevent a sequence of choices that leaves the agent worse off with certainty.
      *   *Non-negotiable:* The aid cannot guide a patient into a cycle of paying to switch and switching back.
  *   **Independence vs. First-Order Risk Aversion:** The theory must resolve the tension where satisfying Independence implies risk-neutrality for small bets (vanishing risk aversion).
      *   *Non-negotiable:* Patients are not risk-neutral over small health risks.

  **4. Use-Case Constraints**
  *   **Elicitability:** Parameters must be recoverable from a handful of clinically plausible questions.
      *   *Non-negotiable:* If it takes 50 questions, it won't be used.
  *   **Probability Robustness:** Recommendations must not flip wildly when input probabilities shift within their confidence intervals.
      *   *Non-negotiable:* Medical probabilities are noisy.
  *   **Proxy/Agency Compatibility:** The theory must function when the chooser (clinician) has different risk preferences than the bearer (patient).
      *   *Non-negotiable:* Clinicians are often more risk-averse than patients.
  *   **Intertemporal Stability:** The theory must handle the case where the agent anticipates their own preference drift.
      *   *Non-negotiable:* Advice given today must remain defensible next month.

  **5. The Actionability Requirement (Prescriptive Closure)**
  *   **Requirement:** When preferences are inconsistent or incomplete, the theory must contain a tie-breaking or repair mechanism that outputs a single recommendation.
  *   **Consideration:** A leaflet cannot say "You are incoherent." It must say "Take Treatment A." The theory must define a "default" rational path when axioms conflict.
  *   **Verdict:** **Non-negotiable.** This is the primary failure point of academic models in applied settings.

  ---

  ### II. The Incompatibility Analysis

  You asked if you can keep **Independence**, keep the **Allais pattern as a genuine datum**, and keep the **No-Money-Pump requirement** all at once.

  **Verdict:** No. These three are mutually incompatible.

  **The Logic:**
  1.  **Independence + No Money Pump $\rightarrow$ Expected Utility:** If you enforce Independence and require dynamic consistency (to avoid money pumps in trees), you are mathematically forced into the Expected Utility (EU) functional form.
  2.  **Expected Utility $\rightarrow$ No Allais:** EU cannot generate the Allais pattern. It treats the common consequence as cancelable.
  3.  **Allais as Datum $\rightarrow$ Violates Independence:** To model the Allais pattern as rational preference, you must violate the Independence axiom.
  4.  **Violating Independence $\rightarrow$ Risks Money Pump:** Once Independence is dropped, preferences can become dynamically inconsistent (you prefer A over B now, but will prefer B over A later if the context shifts). Dynamic inconsistency allows a money pump *unless* you add a specific dynamic choice rule.

  **Which one has to go?**
  For your use case, **Independence** must go.
  *   *Cost:* You lose the clean separation between "utility of outcomes" and "attitude toward risk." In non-Independence models, risk attitude is baked into the probability weighting, making it harder to disentangle whether a patient hates death or hates the *chance* of death.
  *   *Mitigation:* To keep the **No-Money-Pump** requirement while dropping Independence, you must adopt a **Dynamic Choice Rule** (e.g., "Sophisticated" choice where the agent anticipates their future flips, or "Resolute" choice where they bind themselves to the initial plan). The theory must specify *how* the agent navigates the tree, not just how they rank the lotteries.

  **The "Killer" Desideratum**
  The single desideratum that does the most work in excluding candidates is **First-Order Stochastic Dominance (FOSD)**.

  *   **Why:** Many descriptive models that fit the Allais data (especially early versions of rank-dependent models) violate FOSD in edge cases. They can rank a gamble as better than another even when the second offers a strictly higher probability of a better outcome.
  *   **Impact:** In a health context, violating FOSD is indefensible. You cannot recommend a treatment that is strictly worse in every state. This constraint eliminates a vast swath of "behavioral" models that prioritize fitting data over logical coherence. It forces you toward **Cumulative** models (which weight cumulative probabilities) rather than **Rank-Dependent** models (which weight individual probabilities), as only the former guarantees FOSD.

  ---

  ### III. Family Survey

  Here is how the main families stack up against your spec.

  **1. Expected Utility (EU)**
  *   **Pros:** Satisfies FOSD, No Money Pump, easy to elicit, robust.
  *   **Cons:** Fails Allais (calls it error), fails First-Order Risk Aversion (implies small-stakes neutrality), collapses Risk/Ambiguity.
  *   **Verdict:** **Reject.** It fails your core context requirement (Allais as datum) and the small/large stake distinction.

  **2. Rank-Dependent / Cumulative Prospect Theory (RDEU/CPT)**
  *   **Pros:** Handles Allais, separates utility from probability weighting, allows first-order risk aversion.
  *   **Cons:** CPT (with separate gain/loss functions) can violate FOSD if not carefully constrained. RDEU (Cumulative) satisfies FOSD. Both struggle with Ambiguity (need extensions). Elicitation is parameter-heavy.
  *   **Verdict:** **Strong Contender.** Specifically **RDEU** (not basic CPT) to ensure FOSD. You will need to simplify the weighting function for elicitation.

  **3. Regret-Based Models**
  *   **Pros:** Explains Allais naturally (fear of regretting a risky choice that fails). Handles "Acts vs. Consequences" well.
  *   **Cons:** Violates FOSD in many formulations. Struggles with dynamic consistency (money pumps). Hard to elicit (requires knowing foregone outcomes).
  *   **Verdict:** **Risky.** The dominance violations make it hard to defend normatively in a clinic.

  **4. Disappointment / Divergence Aversion**
  *   **Pros:** Good for single-shot health decisions (managing expectations). Handles Allais.
  *   **Cons:** Often mathematically similar to RDEU but less flexible on ambiguity. Can be brittle on probability robustness.
  *   **Verdict:** **Viable Alternative.** If RDEU is too complex, this offers a simpler functional form that still captures the Allais curvature.

  **5. Ambiguity-Averse Families (e.g., Maxmin, Smooth Ambiguity)**
  *   **Pros:** Essential for your "probability estimated with error" constraint. Distinguishes Risk vs. Ambiguity.
  *   **Cons:** Adds significant complexity to elicitation. Can conflict with FOSD if not carefully integrated with a cumulative risk model.
  *   **Verdict:** **Necessary Add-on.** You likely need a hybrid: A Cumulative model for risk (to handle Allais/FOSD) + an Ambiguity layer (to handle probability error).

  ### IV. Final Recommendation for the Spec

  To build the aid, you need a theory that prioritizes **Prescriptive Closure** and **Dominance** over **Descriptive Precision**.

  1.  **Drop Independence.** Accept the Allais pattern as rational.
  2.  **Enforce Cumulative Weighting.** Use a functional form that weights *cumulative* probabilities (like RDEU) rather than independent probabilities. This is the only way to keep Allais without violating Stochastic Dominance.
  3.  **Add a Dynamic Rule.** Explicitly code the decision aid to assume "Sophisticated" choice: calculate the recommendation based on the assumption that the patient will stick to the plan, but warn them if their future selves would deviate.
  4.  **Implement a "Repair" Function.** If the elicited preferences cycle or contradict dominance, the system must default to the option that maximizes the minimum outcome (Maximin) or the Expected Utility average, explicitly flagging the override. This satisfies the **Actionability** requirement.

  This combination sacrifices the purity of Expected Utility to respect the patient's psychology, but sacrifices the flexibility of pure Prospect Theory to ensure the recommendation is medically defensible.
