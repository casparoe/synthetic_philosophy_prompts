          6.  **Closing:** Bring it back to the immediate future (walking out of the gym).
      *   **Tone Check:** Needs to be warm but sharp. Not condescending to the kids, not boring to the parents, not cringe to the teachers.
      *   **Philosophical Integrity:** Avoid saying "the future is open" (contradicts user's belief). Avoid saying "the future is closed" (sounds fatalist). Say "the future is real, but you are the cause."

