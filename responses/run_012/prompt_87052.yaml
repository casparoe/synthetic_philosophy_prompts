prompt: |-
  I need help with something. I'm giving the commencement address at my old high school in June — couple hundred people in a gym, mostly families, three or four teachers who'll be listening for whether I say anything dumb, and 150 seventeen-year-olds who just want it to be over. The one thing everyone expects from a graduation speech is some version of "your future is wide open, you can be anything," and I'd like to say something in that neighborhood without it being false, because I don't actually believe anything is possible, and I also refuse to stand up there and deliver what is, when you look at it closely, a fatalist speech with balloons.

  What's actually bugging me is the sea battle thing — the old puzzle about whether "there will be a sea battle tomorrow" is already true or false today, and if it's already true then it looks like it was always going to happen and there was never anything for anyone to deliberate about. I know the standard moves (the argument only earns "either p or not-p is necessary," not "p is necessary"; some people say future claims just aren't true yet; some say they're true but not necessary; some think the whole thing shows something is wrong with our tenses rather than with our freedom). I don't want a logic lecture, and I also don't want to pretend the puzzle doesn't exist. What I want the speech to actually do is seperate two things that commencement rhetoric always runs together: whether the future is already settled as a matter of truth/logic, and whether what these kids do makes a difference to what happens. My instinct is that the honest speech says the second thing loudly and either stays agnostic or bites a bullet on the first — and I want to know whether that split survives contact with the sea battle problem or whether it's just a standard move in a tuxedo and I'm smuggling in something I can't defend.

  So: write me the speech. Six to eight minutes out loud. It has to land for the parents, who are not philosophers and don't want to become any, and it has to be something the two teachers who've actually read their Aristotle won't wince at. The philosophy needs to be doing structural work — it should determine what the speech can and can't say, not be a nice reference in the third paragraph. No quotations in it; I'm not going to attribute anything and I don't want to misattribute anything either. Don't bother with sources, I'll handle that side.

  And be straight with me. If the whole project is confused — if a commencement address can't be built on this without either lying or turning into a seminar — say so instead of humoring me. Same if the openness-vs-efficacy split I'm leaning on is doing no work at all. Also tell me where the speech is taking liberties with the ideas or leaning on a contested reading, since I'm the one who has to stand there and say it.

  End with a line reading \answer{...} containing one sentence on the position the speech ends up committing me to about the sea battle, so I can see at a glance what I'm signing up for.
