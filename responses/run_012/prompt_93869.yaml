answer: |-
  Your suspicion is astute, and it places you firmly within the contemporary metaontological tradition. The suggestion that the Platonist–Nominalist impasse is driven by a divergence over the meaning or function of 'exists' is not merely a plausible diagnosis; it is arguably the most sophisticated way of characterising the stalemate. However, to treat it as *merely* verbal might be to underestimate the normative stakes involved. Below, I offer a diagnosis that tests your hypothesis against the structural features of the debate, examining whether the disagreement is semantic, methodological, or genuinely metaphysical.

  ### 1. The Semantics of 'Exists': Quantifier Variance or Normative Clash?

  Your hypothesis rests on the idea that the Platonist and the Nominalist are using 'exists' to different ends. In the literature, this is often discussed under the banner of *quantifier variance*. The Platonist, following Quine, tends to treat 'exists' as the logical value of a bound variable in our best theories. On this reading, 'there are numbers' is analytic of the claim that our best scientific theories quantify over numbers. The Nominalist, conversely, often operates with a robust, causal, or spatiotemporal criterion for existence. For them, 'exists' implies 'occupies a place in the causal order'.

  If this were purely a semantic misunderstanding, one would expect the dispute to dissolve upon clarification, much like an argument over whether a 'bank' is a financial institution or a river edge. Yet, the debate persists with vigour. This suggests that the disagreement is not simply about the definition of a word, but about *which semantic rule we ought to adopt*.

  The Platonist argues that we ought to adopt the Quinean criterion because it respects the semantic continuity between mathematics and science. To deny the existence of numbers whilst affirming the truth of physics is, for them, a form of semantic schizophrenia. The Nominalist argues we ought to adopt the causal criterion because it respects our naturalistic epistemology. To affirm the existence of acausal objects is, for them, a violation of naturalistic norms.

  Therefore, the diagnosis is not that they mean different things by 'exists' in a way that makes them talk past one another innocently; rather, they are disagreeing about *which concept of existence is theoretically virtuous*. It is a normative dispute about ontology, not merely a verbal one.

  ### 2. Divergent Data and Standards of Explanation

  You ask whether the sides differ about which cases count as data. This is precisely where the substantive friction lies. Both sides agree on the internal validity of mathematics (that $2+2=4$) and the empirical success of physics. The divergence concerns what explains these facts.

  *   **The Platonist's Data:** The primary data point is the *apparent truth* of mathematical sentences. Their standard of explanation is *semantic uniformity*. They argue that if 'electrons exist' makes a sentence true, and 'numbers exist' makes a sentence true, we require a unified theory of truth. To treat mathematical truth differently from scientific truth requires a special plea. Their 'starting intuition' is that we should take our best theories at face value.
  *   **The Nominalist's Data:** The primary data point is the *causal isolation* of the abstract. Their standard of explanation is *epistemic naturalism*. They argue that knowledge requires a causal link (or a reliable proxy for one). Since abstract objects cannot causally interact with us, positing them renders mathematical knowledge miraculous. Their 'starting intuition' is that the world contains only concrete particulars.

  Consequently, the impasse is not about the raw data (the success of science/maths) but about *explanatory priorities*. The Platonist prioritises semantics and ontology; the Nominalist prioritises epistemology and metaphysics. Because neither side can prove that their priority is the correct one without begging the question, the debate circles.

  ### 3. Is There a Hidden Formal or Empirical Question?

  You inquire whether a theorem or reconstruction could settle the matter. Historically, this has been the Nominalist's hope: if one could formally reconstruct Newtonian physics (or contemporary physics) without quantifying over real numbers or sets, the Platonist's Indispensability Argument would collapse.

  Hartry Field's *Science Without Numbers* attempted precisely this. However, the Platonist response has been that even if such a reconstruction is possible, it is often cumbersome and lacks the explanatory power of the standard formulation. Furthermore, recent work suggests that nominalising *quantum* mechanics is significantly harder than nominalising classical mechanics.

  Conversely, no formal theorem will settle the Platonist's case. Gödel's incompleteness theorems, for instance, are often wielded by realists to suggest mathematics outstrips formal proof (implying intuition of objects), but anti-realists interpret this as showing mathematics is merely an open-ended human practice.

  Thus, it is unlikely that a formal result will resolve the dispute. The disagreement is not about what formalisms are *possible*, but about which formalisms are *ontologically committing*. This returns us to the metaontological level: it is a dispute about how to interpret the formalism, not about the formalism itself.

  ### 4. Metaontological Diagnosis: Internal vs. External Questions

  Your suspicion aligns closely with Rudolf Carnap's distinction between *internal* and *external* questions.
  *   **Internal:** 'Is there a prime number greater than 100?' (Answerable within the mathematical framework).
  *   **External:** 'Do numbers exist?' (A question about the framework itself).

  The Platonist tends to treat the external question as continuous with the internal one. Because 'there are primes' is true internally, 'there are numbers' is true externally. The Nominalist treats the external question as a practical choice of framework. They may grant the internal truth but deny the external reality.

  If your hypothesis is correct, the 'heat' is generated because both sides treat the external question as if it were internal. The Platonist treats 'numbers exist' as a discovery about the world; the Nominalist treats it as a proposal for how to speak. Progress would require acknowledging that 'existence' in mathematics might be a matter of *conceptual utility* rather than *mind-independent discovery*.

  However, a warning is necessary. Contemporary metaontologists like Theodore Sider argue that there is a 'structure of the world' that our quantifiers ought to carve at the joints. If Sider is right, the dispute is substantive: one side is correctly describing the structure of reality, and the other is not. To dismiss it as verbal is to assume there is no privileged structure to be found. Thus, your hypothesis holds only if one accepts a deflationary view of metaphysics.

  ### 5. What Would Count as Progress?

  Given this diagnosis, what constitutes progress?

  1.  **Distinction (The most likely path):** Progress lies in distinguishing *ontological commitment* from *ideological commitment*. We might agree that we must quantify over numbers (ontological commitment in the Quinean sense) but deny that this requires them to be 'substances' in the world (metaphysical baggage). This leads to *ontological deflationism* or *neo-Fregeanism*, where existence is a logical consequence of truth, not a heavy metaphysical burden.
  2.  **Change of Question (The pragmatic turn):** Rather than asking 'Do numbers exist?', we should ask 'What theoretical work does the positing of numbers do?' This shifts the debate from metaphysics to methodology. If the positing of numbers is indispensable for explanation, we accept it, but we remain agnostic about whether they 'exist' in a robust, causal sense. This is a form of *pragmatic realism*.
  3.  **Acceptance of Stalemate (The quietist conclusion):** It may be that no progress is expected because the dispute rests on brute methodological intuitions that are not arguable. If the Platonist's intuition is 'truth implies reference' and the Nominalist's is 'knowledge requires causation', and neither can be derived from a more basic principle, then the debate is a clash of philosophical temperaments. In this case, progress consists in recognising the stalemate and ceasing to pretend one side has 'won'.

  ### Conclusion

  Your suspicion is largely correct, but it requires sharpening. The impasse is not merely a confusion over the word 'exists'; it is a conflict over *which constraints on existence we value most*. The Platonist values semantic uniformity and scientific realism; the Nominalist values epistemic naturalism and ontological parsimony.

  They are, in a sense, answering different questions under a single heading. The Platonist is answering a question about truth-makers ('What makes mathematical sentences true?'), while the Nominalist is answering a question about ontology ('What fundamental stuff constitutes reality?'). Until the parties agree on whether the primary goal of philosophy of mathematics is to save the truth of mathematics or to save the causal integrity of the world, the dialogue will remain a series of parallel monologues. Progress, therefore, lies not in a proof, but in a metaontological shift: recognising that 'existence' is a tool we use to organise theory, not necessarily a mirror of a mind-independent realm.
