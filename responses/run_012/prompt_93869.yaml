  *(Self-Correction during drafting)*: I need to make sure I don't just repeat the standard history. The user knows the history. I need to focus on the *structure of the disagreement*. I should mention the 'Quine-Carnap' debate as it directly addresses the 'exists' question. I should also mention 'Neo-Fregeanism' as a middle ground that tests the 'exists' hypothesis.

