answer: |-
  **Exam Question**

  **Course:** Graduate Seminar on Judgment Aggregation
  **Assessment:** Final Examination
  **Time Allowed:** 90 Minutes

  **Question 1**

  Consider a committee deciding on three propositions: $P$, $Q$, and $C$. Logic dictates that $C$ is true if and only if both $P$ and $Q$ are true. The committee uses an aggregation rule called **Small-Margin Repair (SMR)**, defined as follows:

  1.  Count the majority verdict (Yes/No) on each proposition separately.
  2.  If the set of majority verdicts is logically consistent, adopt it.
  3.  If inconsistent, identify a *minimal inconsistent subset* (a set of verdicts that is inconsistent, but becomes consistent if any single verdict is removed).
  4.  Within that subset, reverse the majority verdict on the proposition carried by the *smallest margin* (difference between Yes and No votes).
  5.  If two propositions in the subset share the smallest margin, reverse the one printed **lower** on the ballot.
  6.  Repeat until the set is consistent.

  **Part A:** Three voters submit the following ballots (ordered $P, Q, C$):
  *   Voter 1: Yes, Yes, Yes
  *   Voter 2: Yes, No, No
  *   Voter 3: No, Yes, No
  Apply SMR to determine the collective outcome. Show your working. (5 marks)

  **Part B:** Construct a variant of this case where voter opinions remain identical, but the collective outcome changes solely due to the rule's mechanics. Identify which standard property of aggregation rules this violates. (5 marks)

  **Part C:** Assess whether SMR satisfies the following properties: (1) Anonymity, (2) Neutrality, (3) Independence (the collective verdict on a proposition depends only on individual verdicts on that proposition), and (4) Immunity to Strategic Misreporting. For each, state "Satisfies" or "Violates" and provide a concise justification or counterexample. (8 marks)

  **Part D:** Is SMR a defensible method for a real committee to resolve inconsistency? Defend a verdict (Yes or No) by engaging with the strongest objection to your position. (7 marks)

  ***

  **Model Answer**

  **Part A**
  First, we tally the majority verdicts.
  $P$: Yes (V1, V2) vs No (V3). Majority: Yes. Margin: 1.
  $Q$: Yes (V1, V3) vs No (V2). Majority: Yes. Margin: 1.
  $C$: No (V2, V3) vs Yes (V1). Majority: No. Margin: 1.
  The set {P:Yes, Q:Yes, C:No} is logically inconsistent because $P \land Q \to C$. The minimal inconsistent subset is {P, Q, C}. All three verdicts have a margin of 1. According to step 5, we reverse the verdict on the proposition printed lowest on the ballot. The order is $P, Q, C$, so $C$ is lowest. We reverse $C$ from No to Yes.
  **Outcome:** P:Yes, Q:Yes, C:Yes.

  **Part B**
  Consider the same votes but change the ballot order to $C, P, Q$. The majority verdicts and margins remain identical (all margins are 1). The minimal inconsistent subset is still {P, Q, C}. However, $Q$ is now printed lowest. SMR requires reversing the verdict on $Q$ (from Yes to No).
  **New Outcome:** P:Yes, Q:No, C:No.
  The outcome changed despite unchanged opinions. This violates **Neutrality**, as the rule treats propositions differently based on extrinsic labels (ballot position) rather than content.

  **Part C**
  1.  **Anonymity: Satisfies.** The rule relies solely on vote counts (margins). Voter identities are irrelevant to the calculation of majorities or margins.
  2.  **Neutrality: Violates.** As shown in Part B, the tie-breaking procedure treats propositions asymmetrically based on ballot order.
  3.  **Independence: Violates.** The collective verdict on $C$ depends on the margins of $P$ and $Q$. In Part A, $C$ was accepted not because of support for $C$ directly (which had a majority against), but because $P$ and $Q$ had small margins within an inconsistent set. The outcome on one proposition is contingent on the logical relationship and vote margins of others.
  4.  **Immunity to Strategic Misreporting: Violates.** A voter can manipulate the outcome by altering a margin. Suppose Voter 2 prefers $C$ to be No. Knowing the ballot order ($P, Q, C$) and that margins are tight, Voter 2 might vote Yes on $Q$ (against their true belief) to increase the margin on $Q$. This could shift the "smallest margin" target to $P$ or $C$, potentially sparing $C$ from reversal or forcing a different inconsistency resolution. Since preferences over outcomes exist, voters have incentives to misreport to influence which margin is deemed "smallest."

  **Part D**
  SMR is **indefensible** for real committees. The strongest objection is that its tie-breaking mechanism introduces **arbitrariness** into collective reasoning. In Part B, the committee accepts $C$ or rejects it based purely on print order. Democratic legitimacy requires that outcomes be justifiable by reasons accessible to all members. An appeal to "you lost because $C$ was at the bottom of the page" is not a reason; it is an assertion of authority.

  A defender might argue SMR is superior because it minimizes the number of overridden majority verdicts, respecting the "will of the majority" as much as logic allows. However, this defense fails because the choice of *which* majority to override is arbitrary when margins tie. If the rule cannot non-arbitrarily select which majority interest to sacrifice, it fails to provide the justification required for binding collective decisions. A random lottery would be equally efficient but more honest about the arbitrariness. Therefore, SMR masks a political choice as a procedural necessity, which is corrosive to committee trust.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Application of Rule (5 marks)**
  *   **Must-hit:** Correctly identifies initial majorities (P:Y, Q:Y, C:N), identifies inconsistency, applies tie-breaker correctly to reverse C.
  *   **A vs B:** A answers show the logical check ($P \land Q \to C$); B answers may assume inconsistency without verification.
  *   **Characteristic Miss:** Failing to reverse the verdict (keeping C:No) or miscalculating the margin.

  **2. Variant and Property Identification (5 marks)**
  *   **Must-hit:** Provides a reordering variant yielding a different outcome; correctly identifies **Neutrality** as the violated property.
  *   **A vs B:** A answers explicitly state opinions are unchanged; B answers imply it without stating it.
  *   **Characteristic Miss:** Identifying the violation as "Independence" or "Consistency" rather than Neutrality.

  **3. Property Assessment (8 marks)**
  *   **Must-hit:** Correct binary verdicts (Anonymity: Yes; Neutrality: No; Independence: No; Strategy: No) with valid justification for each (2 marks each).
  *   **A vs B:** A answers link Independence violation to the *mechanism* (dependence on other margins); B answers define Independence vaguely.
  *   **Characteristic Miss:** Claiming Strategy-proofness holds because votes are binary (ignoring margin manipulation).

  **4. Normative Verdict (7 marks)**
  *   **Must-hit:** Takes a clear stance; identifies the strongest objection (arbitrariness/legitimacy); offers a rebuttal or engagement.
  *   **A vs B:** A answers engage the counter-argument (e.g., efficiency vs. legitimacy); B answers list multiple weak objections without depth.
  *   **Characteristic Miss:** Arguing solely based on "fairness" without defining why the tie-breaker is unfair in a democratic context.

  **General Distinction:**
  *   **A Answer:** Integrated argument, precise terminology, engages the "why" of the normative verdict.
  *   **B Answer:** Correct mechanics but mechanical/rote property definitions; verdict lacks engagement with the strongest counter-argument.
