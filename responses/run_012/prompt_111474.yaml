  1.  **Analyze the Request:**
      *   **Topic:** Einstein's quote "God does not play dice with the universe" (from a 1926 letter to Max Born).
      *   **Context:** A friend uses this quote to argue two things: (1) Einstein's resistance to QM was religious, not scientific; (2) Einstein believed free will is an illusion because nothing is left to chance.
      *   **User's Suspicion:** The quote is being asked to carry too much weight.
      *   **Task:** Lay out a "menu of readings" (distinct precise claims) rather than a single interpretation.
