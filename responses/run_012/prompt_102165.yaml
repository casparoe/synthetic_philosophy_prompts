answer: |-
  Here is a menu of readings for *de gustibus non est disputandum* ("there is no disputing about tastes"), arranged from the conversational platitude to the heavy-duty philosophical claim. You can read this out as a "diagnostic toolkit" to see which lever your friend was actually pulling.

  ### 1. The Pragmatic Reading (The "Stop the Fight" Claim)
  *   **The Claim:** Arguing about art rarely changes anyone's mind. Preferences are rooted in psychology, history, and mood; logic doesn't shift them. Therefore, disputing is practically futile.
  *   **Verdict:** **Platitude.** It is empirically true that people dig in when their favorites are criticized.
  *   **Relevance to your friend:** **Low.** This explains why we shouldn't *argue* with her, but it doesn't explain why her five-star rating was *unjustified*. This reading says "let it go," not "you're wrong."

  ### 2. The Brute Preference Reading (The "Ice Cream" Claim)
  *   **The Claim:** Aesthetic judgments are just reports of internal pleasure, like saying "I like sugar." There is no standard of correctness. If she says she likes it, she likes it. End of story.
  *   **Verdict:** **Half-Truth / Reductive.** It captures the subjective *feeling* of liking, but fails to capture the objective *claim* of a rating. When we give five stars, we usually imply "this is good," not just "this pleased me."
  *   **Collapse:** This often collapses into Reading #3. If tastes are just brute facts, they can't be true or false.

  ### 3. The Non-Cognitivist Reading (The "Not Even Wrong" Claim)
  *   **The Claim:** Sentences like "This novel is excellent" do not state facts that can be true or false. They are expressions of emotion (like cheering) or commands (like "read this!"). You can't be wrong to cheer, so you can't be wrong to rate.
  *   **Verdict:** **Serious and Defensible Position.** This is a standard meta-ethical view in philosophy (emotivism/expressivism). However, it contradicts how we actually talk; we treat book ratings as if they *can* be wrong (e.g., if someone rates a book 5 stars because they misunderstood the plot).
  *   **Relevance to your friend:** **Medium.** If she leans on this, she is saying her rating isn't a knowledge claim, so she can't be accused of lying. But your club clearly treats ratings as knowledge claims.

  ### 4. The Acquaintance Principle (The "You Had to Be There" Claim)
  *   **The Claim:** Aesthetic knowledge requires first-hand experience. You can inherit *facts* (the plot, the page count) via testimony, but you cannot inherit *value* (the beauty, the emotional impact). To judge the value, you must perceive the object yourself.
  *   **Verdict:** **Serious and Defensible Position.** This is a robust epistemological principle (championed by philosophers like Kant and Wiggins). It suggests aesthetic properties are "response-dependent."
  *   **Relevance to your friend:** **High.** This is the philosophical engine of her argument. She is claiming that the *value* of the book is a property that only reveals itself in direct engagement.

  ### 5. The Normative/Authenticity Reading (The "Bad Faith" Claim)
  *   **The Claim:** Even if you *could* theoretically guess the quality via testimony, it is intellectually dishonest to submit a rating as if it were your own experience. A rating is a promise that you have done the work of appreciation.
  *   **Verdict:** **Defensible Normative Claim.** This isn't about whether the judgment is true, but whether the *act of judging* is legitimate.
  *   **Relevance to your friend:** **Very High.** This explains why the five stars were "wrong." It's not that the book isn't five stars; it's that *she* is not the source of that verification.

  ***

  ### Diagnosis: Which reading was she using?

  When your friend said, *"You can't inherit a judgement of taste from someone else, you can only borrow their words,"* she was explicitly combining **Reading #4 (The Acquaintance Principle)** and **Reading #5 (The Normative Claim).**

  She was **not** using Reading #1 (that arguing is pointless) or Reading #2 (that anything goes). She was making a specific epistemic point: that aesthetic value is not a transferable commodity like information.

  *   **The Distinction:** She distinguished between **propositional knowledge** (knowing *that* the book is about a whaling ship, which you can get from a podcast) and **acquaintance knowledge** (knowing the *quality* of the prose, which you cannot).
  *   **The Collapse:** In her sentence, Reading #4 and #5 collapse into each other. Because you cannot *know* the taste without experience (#4), you are acting in bad faith if you claim you *do* know it (#5).

  ### How to use this at the meeting

  If you want to challenge her without violating the "no subjectivity" rule, you don't need to attack the slogan itself. You can attack the **scope** of Reading #4.

  You might ask: *"Are we sure aesthetic value is totally non-transferable? If a critic I trust describes a book's structure perfectly, have I really gained zero access to its value, or just a different kind of access? If I trust the podcast host's taste enough to buy the book, why is their judgment valid for the purchase but invalid for the rating?"*

  This moves the debate from "everything is subjective" to "what kind of knowledge is required to rate art?" which is a much better hour-two conversation.
