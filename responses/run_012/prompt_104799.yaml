answer: |-
  Your friend has constructed a sophisticated version of the "Basic Argument" against moral responsibility (famously articulated by Galen Strawson and Thomas Nagel). It is a formidable position because it weaponizes your own moral intuition (that outcome luck shouldn't matter) to destroy the very possibility of responsibility.

  To answer your specific request: **You should give up the inference from (3) to (4), and you must restrict the Parity Principle at step (2) by redefining "agency."**

  Here is the precise breakdown of where the argument fails, the cost of fixing it, and why your friend's final move (4) is a category error.

  ### 1. Stopping the Slide from (1) to (3): The Restriction

  Your friend's argument relies on an equivocation on the word "agency."
  *   In **(1)**, "agency" refers to **psychological capacity**: the ability to deliberate, form intentions, and exert effort in the moment.
  *   In **(2)**, "agency" implicitly shifts to **metaphysical origination**: the ability to be the *ultimate source* of those capacities (to have chosen your own upbringing, temperament, etc.).

  The Parity Principle is plausible in (1) because we intuitively hold that *resultant luck* (what happens after the swerve) shouldn't matter. But the slide to (3) occurs because your friend insists that *constitutive luck* (who you are) also negates agency.

  **The Restriction:**
  To preserve (1) without accepting (3), you must restrict the Parity Principle to **Reasons-Responsiveness**.
  *   **Restricted Parity Principle:** Two agents are alike in agency if they possess the same *capacity to recognize and respond to reasons*, regardless of whether the *source* of that capacity is lucky.
  *   **Application:** The drunk driver and the sober driver differ in agency, not because the sober driver "created himself," but because the sober driver currently possesses a functional capacity to respond to the reason "do not kill," whereas the drunk driver has culpably impaired that capacity.
  *   **Why this stops the slide:** It blocks the regress in (2). We do not need to trace back to the Big Bang to find responsibility. We only need to look at the *current structural properties* of the agent's psychology. If the mechanism is intact, agency is present. If the mechanism is broken (or culpably clouded), agency is diminished.

  **The Cost:**
  You must abandon **Ultimate Responsibility**. You have to concede to your friend that, in a metaphysical sense, no one is the *causa sui* (cause of themselves). You are accepting that our capacities are indeed gifts of luck (genetics, environment).
  *   *What you lose:* The ability to say an agent "could have done otherwise" in a deep, metaphysical sense.
  *   *What you keep:* The ability to say an agent is responsible because they are the kind of entity that *tracks reasons*. This is the Compatibilist compromise.

  **On Circularity:**
  You asked if this restriction covertly assumes the conclusion. It does assume a theory of agency, but not viciously. All theories of responsibility assume a definition of agency. The justification for this restriction is not circular if it is grounded **functionally** rather than metaphysically.
  *   *Argument:* We do not define agency this way simply to save blame. We define it this way because "responsibility" is a social practice aimed at regulating behavior and protecting rights. A definition of agency that ignores *capacities* (because they are lucky) renders the practice impossible. Therefore, the restriction is justified by the *point* of the practice, not by a desire to win the argument.

  ### 2. Dismantling Step (4): The Category Error

  Step (4) is the move you find most difficult: *"The Parity Principle... governs our assessments as well as our conduct... hence no verdict is more creditable than any other."*

  This is the weakest link in your friend's chain. It commits a **Genetic Fallacy** conflating **Epistemic Normativity** with **Moral Normativity**.

  **The Mistake:**
  Your friend argues that because the *origin* of a belief is a matter of luck (which arguments occurred to me), the *validity* of the belief is undermined. This is false.
  *   **Truth is not a desert.** Whether an argument is sound depends on its premises and logic, not on whether the speaker *deserves credit* for finding it.
  *   **Epistemic vs. Moral:** Moral responsibility concerns *blame and praise* (reactive attitudes). Epistemic responsibility concerns *truth and justification*. Even if I am not morally responsible for my beliefs (because my brain chemistry determined them), my beliefs can still be *rationally justified* or *unjustified*.

  **Why (4) Fails:**
  If your friend's argument is sound, it is sound *objectively*. It does not require him to be "creditworthy" for us to accept it.
  *   If he says, "No verdict is more creditable than any other," he is making a **normative claim**. He is claiming we *ought* not to prefer his verdict.
  *   But if we *ought* not to prefer it, why is he arguing for it? He is implicitly asking you to recognize the *force of the better reason*.
  *   **The Performative Contradiction:** In the act of arguing, he is engaging in a reason-giving practice that presupposes that some conclusions follow from premises better than others. Step (4) denies the normative force of reason itself. If (4) were true, his own argument would be just a noise caused by luck, with no claim on your assent.

  **The Deeper Reason:**
  You asked if there is a deeper reason the luck that corrodes desert leaves assessment untouched. **Yes.**
  *   **Desert** looks backward: "Did you create this state of affairs?" (Vulnerable to luck).
  *   **Justification** looks outward: "Does this belief fit the evidence?" (Invulnerable to luck).
  *   A calculator is not "responsible" for its sum, but its sum can still be *correct*. Similarly, even if we are determined/lucky machines, our assessments can track truth. Step (4) assumes that without "magic" free will, reasoning collapses into mere causal pushing. But reasoning *is* a causal process that tracks truth.

  ### Summary of Strategy for Your Seminar

  1.  **Concede (1):** Agree that the two drunk drivers are equally blameworthy regarding their *recklessness*. This shows you are not relying on outcome luck.
  2.  **Reject (2)'s Implication:** Argue that constitutive luck (temperament) does not negate agency *defined as reasons-responsiveness*. We hold people responsible for who they are because *who they are* determines how they respond to reasons.
  3.  **Crush (4):** Point out that the truth of his argument does not depend on his moral creditworthiness. If his logic is valid, it binds us regardless of luck. If he insists (4) is true, he undermines the rational force of his own presentation, reducing his seminar contribution to a mere causal event like a sneeze.

  **The Cost to You:** You must admit that responsibility is not a metaphysical miracle. It is a human practice grounded in our capacity to respond to reasons. You save responsibility, but you lose the "God's eye view" of ultimate desert. Most philosophers consider this a price well worth paying.
