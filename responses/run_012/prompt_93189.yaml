  2.  **Deconstruct the Milgram vs. *Ordinary Men* Debate:**
      *   *Milgram:* Lab setting, artificial authority, short duration, no prior ideological commitment to harming the "learner," immediate feedback, clear "scientific" justification.
      *   *Browning's RPB 101:* Real war setting, long duration, pre-existing Nazi socialization (though Browning downplays "eliminationist antisemitism" compared to Goldhagen), group dynamics, alcohol involved, career implications, racial ideology pervasive in the culture.
      *   *The Core Conflict:* Situational Psychology (Milgram/Zimbardo) vs. Ideological/Cultural Explanation (Goldhagen). Browning sits in the middle but leans situational/conformist.
      *   *The Friend's Claim:* Milgram proves situation trumps ideology. Therefore, RPB 101 proves situation trumps ideology.
      *   *The Counter:* Milgram's subjects weren't asked to kill based on race. RPB 101 operated within a specific ideological framework that made the victims "subhuman."

  3.  **Drafting the Mapping Table:**
      *   *Experimenter:* Major Trapp (but also the Nazi state).
      *   *Prods:* Trapp's offer to step out, peer pressure, implicit career threat.
      *   *Learner:* Jewish victims.
      *   *Shocks:* Bullets/Deportations.
      *   *Subjects:* Reserve Policemen.
