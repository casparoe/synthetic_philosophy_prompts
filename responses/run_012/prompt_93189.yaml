      *(One last thought on the "Better Analogy")*: The Asch Conformity Experiment is better for the peer pressure aspect. But the "Hazing/Bonding" analogy is more visceral for the killing. I'll suggest Asch for the mechanism and note the ideological framing as the prerequisite. Actually, the prompt asks for *a* better analogy. I'll go with **Asch Conformity** because it captures the horizontal pressure which Browning emphasizes over Trapp's vertical authority. Trapp cried and offered an opt-out. The men killed to avoid letting down the *group*, not the Major. Milgram is vertical. RPB 101 is horizontal. That's the kill shot on the friend's argument.

