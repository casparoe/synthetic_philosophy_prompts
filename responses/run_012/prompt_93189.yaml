      *   **Topic:** Christopher Browning's *Ordinary Men* vs. Daniel Goldhagen's *Hitler's Willing Executioners*, specifically focusing on the comparison to Stanley Milgram's obedience experiments.
      *   **The User's Friend's Argument:** Reserve Police Battalion 101 (RPB 101) = Milgram in a Polish forest. Situation > Ideology (Antisemitism). The Milgram parallel proves ideology is idle.
