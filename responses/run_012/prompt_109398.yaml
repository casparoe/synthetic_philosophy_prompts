prompt: |-
  I am a postdoctoral fellow in philosophy and economics, and next month I have to lead a single ninety-minute session of an interdisciplinary reading group. The members are PhD students in philosophy, politics and economics: all of them have had a solid first course in decision theory, so they can state the von Neumann–Morgenstern axioms, they know what a sure-thing argument looks like, and they are comfortable with the idea of a utility representation that is unique up to positive affine transformation, but none of them has ever opened a text in social choice. The topic is Harsanyi's aggregation theorem, and I do not want you to explain the theorem to me; I want you to plan how I should teach it. Set out the order in which the components must be introduced and why each must come before the next. I am especially interested in how you would sequence three things that I expect the students to collapse into one another: first, the claim that a social preference relation can be represented by a utility function at all; second, the assumption that the social relation satisfies the same expected-utility axioms as the individual relations; and third, the Pareto-type condition linking social and individual preferences over lotteries. Say explicitly where the theorem does its real work and where it merely inherits structure from assumptions already in place. I want the session carried by one worked case rather than a parade of examples: a small society of two or three people choosing between lotteries, ideally a case in which the intuitive fairness verdict and the verdict delivered by an expected-utility social ordering come apart, so that the students feel the price of the axioms rather than only the elegance of the result. Tell me what that case must have and what it must lack — it should not be a mere two-person two-good exchange, and it should not be so small that the weighting of individuals' utilities looks like an arbitrary stipulation rather than a consequence — and show me how to work it through without a blackboard crowded with notation.

  Then give me the misconception map. The students will arrive believing that the theorem proves utilitarianism, and I need to know at what precise point in the sequence that belief should be dismantled rather than merely noted; my own view is that it is defused only once they see that the weights are not fixed by the axioms and that nothing in the result forces the individual utility functions to be measures of welfare at all. They will also conflate the aggregation theorem with the impartial-observer or veil-of-insignorance argument that Harsanyi is equally known for, and I want a way of keeping the two apart that does not consist of saying that one is decision-theoretic and the other ethical. Expect them, further, to treat the result as a variant of Arrow's impossibility theorem with the difficulty removed by fiat, and to be unable to say what the single-profile character of the result does and does not establish — that is, why the fact that the social ordering is a weighted sum of the individual utility functions in the profile at hand does not yet supply a general recipe for aggregating across different profiles. Finally, they will not see why the ex ante/ex post objection bites, so tell me exactly where to introduce it: whether to let them raise it themselves after the worked case or to pre-empt it, and what the objection looks like in the idiom of the case rather than in the idiom of counterexample-mongering. End with the question I should put to them in the last ten minutes that would reveal whether they have understood what kind of result this is — not whether they can state it, but whether they can say what it leaves unsettled — together with a short list of things I should openly refuse to go into at this level and flag as deliberate omissions. Please write the plan in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**

      *   **User:** Postdoctoral fellow in philosophy and economics.
      *   **Task:** Plan a 90-minute interdisciplinary reading group session on Harsanyi's Aggregation Theorem.
      *   **Audience:** PhD students in PPE (Philosophy, Politics, Economics). Solid background in decision theory (vNM axioms, utility representation), *no* background in social choice.
      *   **Constraint 1 (Content):** Do not explain the theorem itself (user knows it). Focus on *pedagogy* and *sequencing*.
      *   **Constraint 2 (Specific Focus):** Distinguish three collapsed concepts: (1) Social preference representability, (2) Social vNM axioms, (3) Pareto condition. Identify where the theorem does work vs. inherits structure.
      *   **Constraint 3 (Case Study):** Use *one* worked case (2-3 people, lotteries). Must show tension between intuitive fairness and EU social ordering. Not a simple exchange economy. Not so small that weights look arbitrary.
      *   **Constraint 4 (Misconceptions):** Address: (1) Theorem proves utilitarianism (weights/welfare interpretation), (2) Conflation with Impartial Observer, (3) Conflation with Arrow (single-profile vs. multi-profile), (4) Ex ante/ex post objection.
      *   **Constraint 5 (Ending):** Final question to test understanding of what is left unsettled. List of deliberate omissions.
      *   **Language:** British English.

  2.  **Deconstruct the Theorem & Pedagogy:**

      *   *Harsanyi's Aggregation Theorem (1955):* If individual preferences and social preferences satisfy vNM axioms, and social preferences satisfy the Pareto principle (weak or strong) over lotteries, then the social utility function is a weighted sum of individual utility functions.
      *   *The "Collapse":* Students often think "Social EU + Pareto = Utilitarianism." They miss that "Social EU" is a heavy assumption, not a derived fact. They miss that weights are arbitrary constants relative to the profile. They miss the single-profile limitation.
      *   *Sequencing:* Need to build the assumptions step-by-step so they see which assumption carries which weight.
      *   *The Case:* Needs risk/uncertainty (lotteries) to trigger vNM. Needs conflict of interest to trigger Pareto. Needs a fairness intuition that clashes with weighted sum to trigger critical engagement.
      *   *Misconception Map:* Needs specific intervention points, not just a list at the end.

  3.  **Drafting the Plan - Section by Section:**

      *   **Introduction (0-10 mins):** Set the stage. Distinguish Social Choice from Decision Theory.
      *   **The Worked Case (10-30 mins):** This needs to be the anchor.
          *   *Idea:* A "Lifeboat" or "Medical Triage" scenario? Or a "Public Good with Risk" scenario?
          *   *Requirement:* Lotteries. 2-3 people. Fairness vs. EU clash.
          *   *Selection:* A "Risk Distribution" case. Two individuals, one good (e.g., a cure or a job), but framed as lotteries over outcomes. Actually, Harsanyi is about *social preferences over lotteries*. Let's use a simple resource allocation under risk.
          *   *Refinement:* Let's use a "Coin Flip vs. Certain Allocation" case.
          *   *Person A:* Loves risk (or has diminishing marginal utility). Person B: Risk averse.
          *   *Better:* To show the *fairness* clash, we need ex-ante vs ex-post.
          *   *Selected Case:* "The Vaccine Lottery." Two patients (1 & 2). One dose.
              *   Option X: Give to Person 1 (Certain).
              *   Option Y: Give to Person 2 (Certain).
              *   Option Z: Fair Coin Flip (50% each).
              *   *Problem:* This is usually used for ex-ante/ex-post. Does it show the weighted sum?
              *   *Alternative:* "The Investment Project." Society chooses between risky projects affecting two members differently.
              *   *Let's go with:* **The "Two-Island" Case.** Island A and Island B. Society chooses a policy.
              *   Outcomes: $x_1$ (A gets 10, B gets 0), $x_2$ (A gets 0, B gets 10).
              *   Lotteries available.
              *   This allows us to construct utility functions easily.
              *   *Wait, the prompt asks for a case where intuitive fairness and EU social ordering come apart.*
              *   *Idea:* Diamond's Critique case.
              *   *Setup:* Two people. One indivisible good.
              *   *Alt 1:* Give to Person 1.
              *   *Alt 2:* Give to Person 2.
              *   *Alt 3:* Flip a coin.
              *   *vNM utilities:* If they only care about getting the good, $u(1)=1, u(0)=0$.
              *   *Social Preference:* If we satisfy Pareto and vNM, Social Utility $W = aU_1 + bU_2$.
              *   *The Clash:* If $a=b$, Coin Flip ($0.5, 0.5$) is indifferent to giving it to Person 1 ($1, 0$) *in expected utility terms*? No. $0.5(1) + 0.5(0) = 0.5$. Giving to P1 is $1(1) + 0(0) = 1$ (if weights equal). Wait.
              *   *Correction:* In Harsanyi, the social utility is the sum of *expected* utilities.
              *   $W(L) = \sum a_i E[u_i(L)]$.
              *   If P1 gets good: $E[u_1]=1, E[u_2]=0$. Sum = 1 (assuming weights 1).
              *   If Coin: $E[u_1]=0.5, E[u_2]=0.5$. Sum = 1.
              *   So Harsanyi says Indifferent. Intuition often says Coin is better (fairness).
              *   *Perfect.* This is the Diamond (1967) counterexample intuition.
              *   *Why this works:* It isolates the vNM assumption on *social* preferences. The Pareto principle is satisfied in both (ex-ante). The clash is purely on the linearity of the social welfare function regarding risk.

      *   **Sequencing the Three Components (30-50 mins):**
          1.  Representability (Can we even map social prefs to numbers?)
          2.  Social vNM Axioms (Does society treat risk like an individual?)
          3.  Pareto (How do individual numbers map to social numbers?)
          *   *Crucial Point:* The "Theorem" work is mostly in step 3 (linearity). Step 2 is where the normative heavy lifting hides (accepting society as a risk-taker). Step 1 is technical precondition.

      *   **Misconception Map (50-70 mins):**
          *   *Utilitarianism:* Weights are not fixed. Utilities are not welfare (could be anything vNM represents).
          *   *Impartial Observer:* That's Harsanyi (1953), this is (1955). One is behind a veil, one is aggregation of given prefs.
          *   *Arrow:* Arrow varies profiles (domain condition). Harsanyi fixes one profile. This is why no impossibility.
          *   *Ex Ante/Post:* Introduce *after* the case. The case *is* the ex ante/post conflict.

      *   **Conclusion (70-90 mins):**
          *   Final Question.
          *   Omissions.

  4.  **Refining the Plan (Self-Correction/Polishing):**

      *   *Tone:* Academic, precise, British English (e.g., "programme", "centre", "maths").
      *   *Notation:* Keep it light. Use $W, U_1, U_2$.
      *   *The "Collapse":* I need to be explicit about how to disentangle them. I will suggest writing three distinct headers on the board.
      *   *The Case:* I need to ensure the "Two-Island/One-Good" case is described precisely so the user can run it without clutter.
      *   *Arrow Distinction:* Emphasize "Single Profile" vs "Universal Domain".
      *   *Impartial Observer:* Distinguish "Aggregating existing preferences" vs "Constructing preferences from ignorance".
      *   *Final Question:* Needs to probe the *limits* of the theorem. "What determines the weights?" or "What happens if preferences change?"

  5.  **Drafting the Content (incorporating British English):**

      *   *Check:* "Programme" not "Program". "Utilise" (optional, but "use" is fine). "Centre". "Modelling".
      *   *Structure:*
          1.  Session Architecture (Timeline).
          2.  The Worked Case (Detailed specification).
          3.  Sequencing the Three Components (The core pedagogical challenge).
          4.  The Misconception Map (Intervention points).
          5.  The Final Question & Omissions.

  6.  **Final Review against Constraints:**
      *   90 mins? Yes, timeline fits.
      *   PhD level? Yes, assumes vNM knowledge.
      *   No social choice background? Yes, explain terms as they arise.
      *   One worked case? Yes (The "Single Dose" Lottery).
      *   Misconceptions addressed? Yes.
      *   British English? Yes.

      *(Self-Correction on the Case)*: Make sure the case isn't *too* simple. If it's just one good, it looks like a coin toss. I need to make sure the *utilities* are vNM utilities.
      *   *Revised Case:* "The Research Grant." Two researchers (A & B). One grant.
      *   Outcomes: A gets it ($g_A$), B gets it ($g_B$).
      *   Preferences: Both prefer getting it to not.
      *   Lotteries: Certain A, Certain B, 50/50 Coin.
      *   vNM Prefs: $U_A(g_A)=1, U_A(g_B)=0$. $U_B(g_A)=0, U_B(g_B)=1$.
      *   Social Prefs: If Harsanyi holds, $W(Coin) = 0.5 w_A + 0.5 w_B$. $W(Certain A) = 1 w_A + 0 w_B$.
      *   If $w_A = w_B$, $W(Coin) = 0.5$, $W(A) = 1$. Wait.
      *   *Correction:* Harsanyi sums *expected* utilities.
      *   $W(L) = \sum w_i E[U_i(L)]$.
      *   Certain A: $E[U_A]=1, E[U_B]=0$. Sum = $w_A$.
      *   Coin: $E[U_A]=0.5, E[U_B]=0.5$. Sum = $0.5 w_A + 0.5 w_B$.
      *   If $w_A = w_B$, then Certain A = $w$, Coin = $w$. Indifferent.
      *   *Intuition:* Many feel Coin is strictly better (fairness).
      *   *Why this works:* It shows Social vNM linearity forces indifference where fairness might demand strict preference for the lottery. This isolates the "Social vNM" assumption.

      *(Wait, one nuance)*: Harsanyi's theorem concludes $V = \sum a_i U_i + b$.
      If we normalise $U_i$ such that $U(best)=1, U(worst)=0$.
      Then Certain A: $V = a_1(1) + a_2(0) = a_1$.
      Coin: $V = a_1(0.5) + a_2(0.5)$.
      If $a_1 = a_2$, $V(Certain) = a_1$, $V(Coin) = a_1$. Indifference.
      This is correct. This is the Diamond critique.

      *(Wait, another nuance)*: Does this violate Pareto?
      Ex-ante Pareto: Everyone prefers Coin to Certain A? No. A prefers Certain A. B prefers Certain B.
      So Pareto doesn't dictate between Coin and Certain A directly unless we have a third option.
      Actually, the Diamond critique is usually that Harsanyi *cannot* accommodate a preference for fairness (ex-post equity) if it violates ex-ante efficiency or linearity.
      Let's stick to the prompt's request: "intuitive fairness verdict and the verdict delivered by an expected-utility social ordering come apart".
      Indifference (Harsanyi) vs Strict Preference for Fairness (Intuition) is a divergence.
      I will frame it as: "Does society value the *fairness of the process*?" Harsanyi says no, only expected outcomes matter.

      *(Refining the Misconception Map)*:
      *   Utilitarianism: Dismantle when discussing weights.
      *   Impartial Observer: Dismantle when discussing the *source* of the social preference.
      *   Arrow: Dismantle when discussing profile variability.
      *   Ex Ante/Post: Use the case itself.

      *(Final Question)*: "If the weights are not determined by the theorem, what *kind* of normative work is this theorem actually doing?"

      *(Omissions)*: Interpersonal comparison of utility (cardinality), Bayesian ethics, dynamic consistency.

      *Let's write.*
answer: |-
  # Session Plan: Harsanyi's Aggregation Theorem
  **Duration:** 90 Minutes
  **Audience:** PhD Students (Philosophy, Politics, Economics)
  **Prerequisites:** Decision Theory (vNM axioms, utility representation); No Social Choice background.
  **Language:** British English

  ---

  ## I. Session Architecture (0–90 Minutes)

  | Time | Segment | Objective |
  | :--- | :--- | :--- |
  | **00–10** | **Framing the Problem** | Distinguish social aggregation from individual decision; introduce the 'Single Profile' constraint. |
  | **10–35** | **The Worked Case** | Run the 'Single Dose' lottery case. Elicit the clash between fairness intuition and vNM linearity. |
  | **35–55** | **Disentangling the Assumptions** | Sequentially introduce the three collapsed components (Representability, Social vNM, Pareto). Locate the theorem's 'work'. |
  | **55–75** | **The Misconception Map** | Targeted interventions on Utilitarianism, Impartial Observer, Arrow, and Ex Ante/Post. |
  | **75–90** | **Synthesis & Omissions** | Final diagnostic question and explicit boundary setting. |

  ---

  ## II. The Worked Case: 'The Single Dose'

  Do not begin with definitions. Begin with a concrete choice situation that forces the axioms to show their teeth. You require a case where the *process* of allocation carries normative weight that expected utility ignores.

  **The Setup:**
  *   **Society:** Two individuals, $A$ and $B$.
  *   **Resource:** One indivisible dose of a life-saving vaccine.
  *   **Outcomes:**
      *   $x_A$: $A$ receives the dose, $B$ does not.
      *   $x_B$: $B$ receives the dose, $A$ does not.
  *   **Preferences:** Both strictly prefer receiving the dose to not receiving it.
      *   Normalise utilities: $U_A(x_A)=1, U_A(x_B)=0$; $U_B(x_A)=0, U_B(x_B)=1$.
  *   **Available Lotteries:**
      1.  **Certain $A$:** Probability 1 of $x_A$.
      2.  **Certain $B$:** Probability 1 of $x_B$.
      3.  **Fair Coin:** Probability 0.5 of $x_A$, 0.5 of $x_B$.

  **The Procedure:**
  1.  **Elicit Individual Preferences:** Confirm students agree that $A$ prefers Certain $A$ to Fair Coin, and $B$ prefers Certain $B$ to Fair Coin. (This is standard risk neutrality over the good).
  2.  **Elicit Social Intuition:** Ask the group: *'As a social planner, rank Certain $A$, Certain $B$, and Fair Coin.'*
      *   *Expected Intuition:* Many will argue Fair Coin is strictly better than either Certain option due to ex-ante fairness (equal opportunity), even if expected lives saved are identical.
      *   *Harsanyi's Verdict:* If social preferences satisfy vNM axioms and Pareto, the social utility function $W$ must be linear: $W = aU_A + bU_B$.
      *   Calculation: $W(\text{Certain } A) = a(1) + b(0) = a$. $W(\text{Fair Coin}) = a(0.5) + b(0.5)$. If we assume symmetry ($a=b$), $W(\text{Coin}) = a$.
      *   **Result:** Harsanyi dictates **Indifference**. Intuition often dictates **Strict Preference** for the Coin.

  **What the Case Must Have:**
  *   **Risk:** To trigger the vNM axioms (linearity over probabilities).
  *   **Conflict:** To trigger the Pareto condition (A and B want different certain outcomes).
  *   **Symmetry:** To make the weights ($a, b$) look like they *should* be equal, highlighting that even with equal weights, the fairness intuition is violated.

  **What the Case Must Lack:**
  *   **Interpersonal Comparisons:** Do not allow students to argue $A$ 'needs' it more. Keep utilities ordinal/interval as per vNM.
  *   **Externalities:** Keep the outcome space simple ($x_A, x_B$) so the conflict is purely distributive.
  *   **Notation Clutter:** Do not write out the full vNM independence axiom on the board. Refer to it as 'linearity over lotteries'.

  ---

  ## III. Sequencing the Three Collapsed Components

  Students will arrive believing the theorem is a single block: 'Pareto + Rationality = Utilitarianism'. You must dismantle this by introducing the assumptions in a specific order of logical dependency. Use the board to create three distinct columns.

  **1. Social Representability (The Precondition)**
  *   **When:** Immediately after the case intuition clash.
  *   **Content:** Before we sum anything, we must assume the social preference relation $\succeq_S$ is complete and transitive over the lotteries.
  *   **Why First:** If $\succeq_S$ cannot be represented by a function $W$, there is no theorem. This is often taken for granted.
  *   **Pedagogical Point:** Ask: *'Does society have a preference ordering distinct from the individuals?'* This establishes that we are modelling a *social agent*, not just comparing lists.

  **2. The Social vNM Axioms (The Hidden Normative Load)**
  *   **When:** Second.
  *   **Content:** Assume $\succeq_S$ satisfies Independence and Continuity over the *same* lotteries as the individuals.
  *   **Why Second:** This is where the 'Indifference' verdict in the case comes from. It is **not** derived from Pareto. It is inherited from the assumption that Society behaves like a vNM rational agent.
  *   **Where the Theorem Inherits Structure:** The linearity of $W$ (the fact that $W(L) = E[W]$) comes entirely from this assumption, not from aggregation.
  *   **Pedagogical Point:** Highlight that by assuming this, we have *already ruled out* the fairness intuition (which violates Independence). The theorem hasn't 'proved' utilitarianism yet; it has assumed away the objection.

  **3. The Pareto Condition (The Aggregation Engine)**
  *   **When:** Third.
  *   **Content:** If everyone prefers $L$ to $L'$, Society prefers $L$ to $L'$. (Weak Pareto over lotteries).
  *   **Why Third:** This is the only step that links $W$ to $U_A$ and $U_B$.
  *   **Where the Theorem Does Real Work:** This condition forces $W$ to be a **weighted sum** of the $U_i$'s. Without Pareto, $W$ could be any vNM function. With Pareto, $W$ must be affine to the sum.
  *   **Pedagogical Point:** Show that Pareto restricts the *shape* of the function (linear combination), but Social vNM restricts the *domain* (risk attitudes).

  **Summary for Students:**
  *   **Representability:** Allows us to use numbers.
  *   **Social vNM:** Forces linearity (kills the fairness intuition).
  *   **Pareto:** Forces the weights (connects individual numbers to social numbers).

  ---

  ## IV. The Misconception Map

  Do not save these for a Q&A at the end. Intervene at the precise moment the misconception becomes plausible.

  **1. 'The Theorem Proves Utilitarianism'**
  *   **When to Dismantle:** During the 'Pareto' section (Step 3 above).
  *   **The Intervention:** When you write $W = aU_A + bU_B$, stop. Ask: *'What fixes $a$ and $b$?'*
  *   **The Point:** The theorem determines the *form* (weighted sum), not the *weights*. The weights are constants relative to the profile but arbitrary normatively. Furthermore, $U_i$ are vNM utilities (risk attitudes), not necessarily welfare or happiness. They could represent selfish greed.
  *   **Phrase to use:** 'This is a structural result about consistency, not a substantive result about value.'

  **2. 'Aggregation vs. Impartial Observer'**
  *   **When to Dismantle:** During the 'Social Representability' section (Step 1).
  *   **The Intervention:** Students will conflate this with Harsanyi's 'Veil of Ignorance' argument.
  *   **The Point:** The Impartial Observer (1953) derives social preferences from *uncertainty about identity*. The Aggregation Theorem (1955) takes social preferences as *given* and checks their consistency with individual preferences.
  *   **Distinction:** One is an ethical derivation (what *should* society prefer?); the other is a consistency constraint (if society prefers X, what must it look like?). Keep the board work focused on 'Given $\succeq_S$...' to reinforce this.

  **3. 'A Soft Version of Arrow'**
  *   **When to Dismantle:** During the 'Misconception Map' segment (55–75 mins).
  *   **The Intervention:** Students will ask why this doesn't fall foul of Arrow's Impossibility Theorem.
  *   **The Point:** Arrow varies the *profile* (Universal Domain). Harsanyi fixes *one profile*.
  *   **Crucial Distinction:** Harsanyi tells you how to aggregate *if* you have a social ordering for this specific set of preferences. It does not provide a rule (a social welfare functional) that works for *all possible* profiles. It is a 'Single-Profile' result. It avoids impossibility by refusing to generalise across profiles.

  **4. 'The Ex Ante / Ex Post Objection'**
  *   **When to Introduce:** Let them raise it during the Worked Case (10–35 mins), but formalise it in the Misconception segment.
  *   **The Intervention:** Use the 'Single Dose' case.
      *   *Ex Ante:* Everyone agrees the Coin is fair before the flip.
      *   *Ex Post:* Once the coin lands, one person loses everything.
      *   *The Bite:* Harsanyi's theorem aggregates *ex ante* expected utilities. It cannot accommodate an *ex post* equity concern (like minimising the variance of outcomes) without violating the vNM axioms assumed in Step 2.
      *   **Idiom:** Do not use technical counterexamples. Ask: *'If we value equality of outcome, can we fit it into this linear sum?'* The answer is no, because equality of outcome is non-linear in probabilities.

  ---

  ## V. Conclusion: The Diagnostic Question & Omissions

  **The Final Question (Last 10 Minutes)**
  Do not ask them to state the theorem. Ask them to identify its silence.
  > *'We have established that if a social ordering satisfies vNM and Pareto, it must be a weighted sum of individual utilities. Given this, what specific normative question does this theorem leave entirely unanswered, even if we accept all its axioms?'*

  **Desired Answer:** They should identify that the theorem does not tell us **how to choose the weights** ($a, b$) nor does it justify **why the social relation should satisfy vNM axioms** in the first place. It reduces the problem of social choice to the problem of weighting, but solves neither.

  **Deliberate Omissions (Flag These Explicitly)**
  To maintain rigour within 90 minutes, explicitly state what you are *not* covering. This prevents students from thinking these issues are resolved.
  1.  **Interpersonal Comparisons of Utility:** You are treating $U_i$ as given cardinally measurable functions. You are not addressing the measurement problem (how to compare units across persons).
  2.  **Variable Populations:** The theorem assumes a fixed set of individuals ($N$). It says nothing about population ethics.
  3.  **Non-Expected Utility:** You are assuming vNM holds. You are not discussing what happens if individuals have Rank-Dependent or Prospect Theory preferences (where the theorem generally fails).
  4.  **Strategyproofness:** You are not discussing whether individuals have incentives to misrepresent their preferences to influence the weights.

  ---

  ## VI. Instructor's Note on Board Work

  To avoid a blackboard crowded with notation:
  *   Use **$W$** for Social Utility.
  *   Use **$U_1, U_2$** for Individual Utilities.
  *   Use **$L$** for Lottery.
  *   Write the conclusion once, clearly: **$W(L) = \sum a_i U_i(L)$**.
  *   Circle the **$a_i$** whenever discussing weights.
  *   Box the **vNM axioms** whenever discussing the fairness objection.
  *   Keep the 'Single Dose' payoffs ($1, 0$) visible in the corner throughout the session as the anchor.

  This plan ensures the students leave understanding that Harsanyi's Aggregation Theorem is a powerful *consistency* result, not a free derivation of utilitarian ethics, and that the heavy lifting is done by the assumption that society reasons about risk exactly like an individual.
