      *Section 5:*
      Free-floating rationales are real explanatory factors, distinct from mental states. They are the structural shadows of natural selection. The dispute dissolves once we separate explanatory power from cognitive avowability. We need not choose between anthropomorphism and mechanism; there is a third option: historical relationality. The single consideration that would change my mind is a demonstration that evolutionary biology could retain full predictive and explanatory power using only efficient causal descriptions, without any reference to function or benefit. If physics could distinguish adaptation from noise without teleology, the free-floating rationale would be superfluous. Until then, the rationale remains the indispensable key to the lock of biological form.

