  **4. What the analogy quietly imports**
  The analogy silently imports a specific metaphysical claim: that the "person" died when competence was lost, leaving only a biological shell. By mapping the patient to an estate, the memo presupposes the directive is an authoritative instruction rather than fallible evidence. It assumes the competent self owns the demented self's life entirely. This imports the conclusion that precedent autonomy absolute trumps contemporaneous autonomy.

  It also imports the assumption that the "estate" has no independent moral status. In probate, the estate's "wishes" are irrelevant; only the testator's matter. Applied here, this renders the patient's current happiness morally negligible, reducible to "welfare data." This ignores the ethical obligation to the present subject. Furthermore, it imports a legalistic enforcement model where clinicians are executors, not caregivers. This shifts the ethical burden from beneficence to fidelity. The analogy survives only if one accepts that the demented patient is not a full moral person. If the patient retains moral status, the analogy collapses, and the directive must be treated as evidence of past values weighed against current welfare, not as a binding command from a dead testator.

  Additionally, it imports the assumption that the prior instruction was not based on a false prediction of suffering. Wills distribute assets based on existing property. Directives predict future states. If the prediction (that advanced dementia is undignified) is falsified by the patient's current contentment, the analogy fails to account for factual error. The memo treats the directive as infallible law, importing a presumption of accuracy that clinical reality may contradict.

  **5. Does the conclusion survive**
  The conclusion does not survive the audit; it is merely dressed in the analogy's authority. The will analogy begs the question by assuming the very point in dispute: that the competent self's authority survives the loss of competence absolute. To support the recommendation, the memo must argue independently why precedent autonomy should override contemporaneous welfare when values have demonstrably changed. It must justify why a happy patient should be denied nutrition based on a past prediction of misery.

  The analogy obscures the need to weigh the burden of treatment against current benefit. A will distributes property; a feeding tube imposes a medical intervention. The conclusion requires a moral argument about the limits of binding future selves, not a legalistic mapping. Specifically, it needs to address whether the directive was intended to bind even if the patient is happy (change in values) or only if suffering (weakness of will). Without this, the memo relies on the false equivalence of patient and estate to bypass the hard ethical work of balancing past instructions with present suffering and joy.

  As a minority comment, I must note that relying on this analogy allows the committee to avoid responsibility for the patient's death. If the directive is a "will," clinicians are just executors. If it is evidence, clinicians are decision-makers. The conclusion survives only if we accept the patient is legally dead. Since she is not, the recommendation lacks ethical foundation. We must argue directly about the weight of precedent autonomy in the face of conflicting contemporaneous interests, rather than hiding behind probate law.

  **6. A better analogy**
  Odysseus at the mast fits precommitment against weakness of will (he wanted to hear the song but not steer), but fails here because the patient is not struggling against impulse; she is content. The entrenched constitutional clause fits the binding nature but fails because constitutions protect rights, whereas this directive restricts care for a vulnerable being.

  A superior analogy is the **Trustee-Beneficiary** relationship. The competent self establishes a trust (directive) for the benefit of the demented self (beneficiary). The clinicians are trustees. A trustee must follow the trust instrument but always acts in the beneficiary's best interest. If circumstances change (the beneficiary is happy without tube), the trustee has fiduciary discretion to deviate from strict instructions to prevent harm. This model respects precedent autonomy as guidance while prioritizing the welfare of the living subject. It treats the directive as evidence of values, not a command from a dead testator, aligning with the ethical duty to the contemporaneous patient.

  This model accommodates value changes. If the beneficiary's needs shift, the trustee adapts. It avoids the "dead testator" problem while preserving the weight of prior planning. It forces the committee to weigh the directive against current welfare, rather than dismissing the latter as irrelevant data.
