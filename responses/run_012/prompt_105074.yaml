answer: |-
  **Audit of Internal Tensions**

  **1. The Knowledge/Reliability Clash (Claims 1, 3, 4)**
  *   **Severity:** **Fatal.** This is the "eats itself" problem. If experiences are causally idle (1) and reports are physical events (4), experiences cannot cause the reports. If experiences don't cause the reports, there is no causal chain ensuring the reports are *about* the experiences rather than the brain states. Your reliability (3) becomes a cosmic coincidence.
  *   **Cheapest Fix:** Deny Claim 3 (introspective reports are not reliable/about experience).
  *   **Cost:** You lose your only evidence for believing experiences exist. You collapse into skepticism or eliminativism.
  *   **Better Fix:** Deny Claim 1 (allow experiences to cause reports).
  *   **Cost:** Violates strict physical causal closure (Claim 2).

  **2. The Normative Inertia Clash (Claims 1, 6)**
  *   **Severity:** **High.** If pain is intrinsically bad (6) but causally inert (1), its "badness" cannot motivate avoidance. The normative force is severed from the physical realm where action occurs. Ethics becomes inert.
  *   **Cheapest Fix:** Deny Claim 6 (pain is only instrumentally bad).
  *   **Cost:** Contradicts the phenomenological reality of suffering; makes ethics purely functional.
  *   **Better Fix:** Deny Claim 1 (allow pain to motivate action).
  *   **Cost:** Violates strict physical causal closure (Claim 2).

  **3. The Naturalism/Gap Clash (Claims 2, 5)**
  *   **Severity:** **Low.** Non-reductive physicalism accepts that physical facts fix phenomenal facts (supervenience) without entailing them conceptually. This is standard territory.
  *   **Cheapest Fix:** Clarify Claim 2 (naturalism allows supervenience without reduction).
  *   **Cost:** None; merely semantic precision.

  **Single Change Analysis**
  Dropping **Claim 1** (strict epiphenomenalism) resolves both the Knowledge Clash and the Normative Clash simultaneously. It allows experiences to cause reports (saving reliability) and motivate avoidance (saving ethics).
  *   **Cost:** You must abandon strict Physical Causal Closure (Claim 2). You become an interactionist or a non-reductive physicalist with downward causation.
  *   **Worth it?** Yes. Keeping Claim 1 makes your belief in Claim 3 unjustified. You cannot coherently argue for a position you claim you cannot know you hold.

  Verdict: Knowledge/Reliability Clash (1, 3, 4) => Drop Claim 1 (allow experiences to cause physical reports)
