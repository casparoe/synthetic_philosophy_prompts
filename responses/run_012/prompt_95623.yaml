          *   If $Y$ is the *Construct* ($\theta$): Then $P(S|\theta, G)$ invariant is **Measurement Invariance** (no DIF).
          *   If $Y$ is the *Criterion*: Then $P(S|Y, G)$ invariant means the distribution of scores for those who succeed/fail the criterion is the same across groups. This is **Selection Ratio / Cut-score equivalence**.
