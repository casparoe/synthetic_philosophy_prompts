prompt: |-
  I am a psychometrician who works with latent-variable models, measurement invariance, and differential item functioning, but I have no background in algorithmic fairness. Restate the standard impossibility claim about group fairness — that calibration within groups and balance of error rates across groups cannot both hold when base rates differ — in the vocabulary I actually use: latent traits, item response functions, measurement invariance, DIF, test equating, and the distinction between construct and criterion. Map each fairness condition onto the closest measurement constraint as faithfully as you can, then give me the residue report: which parts of the fairness debate translate cleanly, which translate only with distortion, and which have no counterpart at all in measurement theory. I especially want to know whether, on your translation, the impossibility is a fact about measurement models themselves or a fact about the decision uses to which scores are put — and whether the residue shows that the psychometric vocabulary is missing something or that the fairness conditions were less unified than they appear.
