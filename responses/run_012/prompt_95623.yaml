answer: |-
  Here is the translation of the algorithmic fairness impossibility theorem into psychometric vocabulary, followed by the residue report you requested.

  ### The Translation: Fairness Constraints as Measurement Constraints

  To map the fairness impossibility theorem (Chouldechova, 2017; Kleinberg et al., 2016) into your domain, we must first distinguish the **Construct** ($\theta$) from the **Criterion** ($Y$). In algorithmic fairness, $Y$ is often treated as "ground truth" (e.g., recidivism), but in psychometrics, $Y$ is an external validation criterion, distinct from the latent trait $\theta$ the test is intended to measure. The "Score" ($S$) is the observed estimator of $\theta$.

  | Fairness Concept | Psychometric Equivalent | Formal Constraint |
  | :--- | :--- | :--- |
  | **Group ($G$)** | **Reference vs. Focal Group** | Distinct subpopulations in MI/DIF analysis. |
  | **Base Rate Difference** | **Criterion Impact** | $P(Y=1 \mid G=A) \neq P(Y=1 \mid G=B)$. The prevalence of the criterion outcome differs by group. |
  | **Calibration** | **Predictive Invariance** (Cleary, 1968) | The regression of the Criterion on the Score is invariant: $E[Y \mid S, G] = E[Y \mid S]$. The validity slope and intercept are equal across groups. |
  | **Error Rate Balance** (Equalized Odds) | **Conditional Score Invariance** | The distribution of Scores conditional on Criterion status is invariant: $P(S \mid Y, G) = P(S \mid Y)$. The likelihood of obtaining a score, given success/failure on the criterion, is the same across groups. |
  | **Decision Threshold** | **Cut-score / Selection Ratio** | The point on the latent continuum $\theta$ (or observed $S$) used to make a binary classification (Pass/Fail, Hire/Reject). |

  #### The Impossibility Theorem Restated
  In psychometric terms, the theorem states:

  > **If Criterion Impact exists** (groups differ in the prevalence of $Y$), you cannot simultaneously satisfy **Predictive Invariance** (the test predicts $Y$ with the same regression line for both groups) and **Conditional Score Invariance** (the score distributions for "successful" and "unsuccessful" candidates are identical across groups) **unless the test is perfectly reliable** (correlation of $S$ and $Y$ is 1.0) or **trivial** (uncorrelated).

  **The Logic in Your Vocabulary:**
  By Bayes' Theorem, the marginal distribution of scores $P(S \mid G)$ is a mixture of the conditional score distributions $P(S \mid Y, G)$ weighted by the base rates $P(Y \mid G)$.
  1.  **Conditional Score Invariance** fixes the components of the mixture ($P(S \mid Y)$ is constant across $G$).
  2.  **Criterion Impact** changes the weights of the mixture ($P(Y \mid G)$ differs across $G$).
  3.  Therefore, the **Marginal Score Distribution** $P(S \mid G)$ *must* differ across groups.
  4.  However, **Predictive Invariance** implies a specific structural relationship between $S$ and $Y$. If the conditional score distributions are identical but the base rates differ, the regression of $Y$ on $S$ (Predictive Invariance) generally cannot remain invariant across groups unless the separation between the conditional distributions is infinite (perfect reliability).

  ---

  ### Residue Report

  This section details what is lost, gained, or distorted when forcing fairness constraints into measurement theory.

  #### 1. Clean Translations
  *   **Base Rate Difference $\leftrightarrow$ Criterion Impact:** This maps perfectly. Psychometrics has long acknowledged that groups may differ on external criteria (e.g., job performance) due to environmental, educational, or systemic factors. We call this "Impact."
  *   **Calibration $\leftrightarrow$ Predictive Invariance:** This is the standard definition of "Test Bias" in the Cleary model. If the regression line differs, the test is biased. If it holds, the test is "unbiased" in prediction. This translates without distortion.

  #### 2. Distorted Translations
  *   **Error Rate Balance $\leftrightarrow$ Conditional Score Invariance:**
      *   *The Distortion:* In fairness, "Error Rate Balance" is treated as a moral or legal constraint on the *algorithm*. In psychometrics, Conditional Score Invariance is an empirical property of the *test-criterion relationship*.
      *   *Why it matters:* Psychometrics does not typically demand Conditional Score Invariance as a requirement for fairness. We demand **Measurement Invariance** ($P(S \mid \theta, G)$ is invariant), not $P(S \mid Y, G)$. $Y$ is fallible. Requiring $P(S \mid Y, G)$ to be invariant assumes the Criterion $Y$ is a perfect proxy for the Construct $\theta$. If $Y$ is biased (e.g., arrest rates $\neq$ criminal behavior), enforcing Conditional Score Invariance propagates criterion bias into the measurement model.
  *   **The "Score" ($S$):**
      *   *The Distortion:* Fairness literature often treats $S$ as a direct input to a decision. Psychometrics treats $S$ as an estimate of $\theta$ with standard error ($SEM$). The impossibility theorem assumes $S$ is fixed. In IRT, we could theoretically adjust the *measurement precision* (information function) across groups to mitigate the conflict, though not solve it. The fairness theorem ignores measurement error structure, treating $S$ as observed truth.

  #### 3. No Counterpart (The Void)
  *   **The Decision Threshold (Utility):**
      *   The impossibility theorem hinges on binary decisions (cut-scores). Classical psychometrics handles this via **Utility Theory** and **Selection Models** (e.g., Taylor-Russell tables), but this is distinct from *Measurement Theory*.
      *   Fairness conditions conflate the *measurement model* (how $S$ relates to $\theta$) with the *decision model* (how $S$ maps to Action). Psychometrics rigorously separates these. The "impossibility" arises only when you force a continuous latent variable into a binary decision context without accounting for differential base rates in the utility function.
  *   **The Ontology of $Y$:**
      *   Fairness debates often treat $Y$ as "Truth." Psychometrics treats $Y$ as a "Criterion" subject to its own validity coefficients. There is no standard psychometric term for "Unbiased Criterion." We assume criteria are imperfect. The fairness impossibility theorem collapses when you acknowledge $Y$ itself has DIF relative to the true construct of interest.

  ---

  ### The Core Verdict: Measurement vs. Decision

  **Is the impossibility a fact about measurement models or decision uses?**
  On this translation, the impossibility is unequivocally a fact about **Decision Uses**, not Measurement Models.

  1.  **Measurement Models ($P(S \mid \theta)$):** You can have full Measurement Invariance (no DIF) across groups even when latent trait distributions differ (Impact). There is no impossibility here. You can measure $\theta$ fairly even if $\mu_{\theta A} \neq \mu_{\theta B}$.
  2.  **Decision Uses ($P(\text{Action} \mid S, Y)$):** The impossibility arises when you impose constraints on the *joint distribution* of Scores and Outcomes for the purpose of binary classification.

  The conflict is not between two measurement properties; it is between a **measurement property** (Predictive Invariance) and a **selection outcome** (Error Rate Balance).

  ### What the Residue Reveals

  You asked whether the residue shows psychometric vocabulary is missing something, or that fairness conditions are less unified than they appear.

  **The residue indicates that the fairness conditions are less unified than they appear.**

  1.  **Category Error:** The fairness literature attempts to solve a **Utility/Decision problem** (how to allocate opportunities given scarce resources and group differences) using **Measurement constraints** (Calibration, Error Rates). Psychometrics separates these:
      *   *Measurement:* Is the ruler the same for everyone? (Invariance/MI)
      *   *Validity:* Does the ruler predict the outcome? (Predictive Invariance)
      *   *Utility:* Where should we cut the score given costs/benefits? (Decision Theory)
  2.  **The "Missing" Piece:** Psychometrics is not missing a concept; it possesses the tool that fairness lacks: **Explicit Utility Functions.** The impossibility theorem proves that you cannot satisfy multiple fairness constraints simultaneously *without specifying a loss function*. Psychometrics acknowledges that optimal cut-scores differ when base rates differ (the "quota" vs. "merit" debate).
  3.  **Construct vs. Criterion:** The residue highlights that fairness debates often stall because they disagree on whether $Y$ is the Construct or the Criterion.
      *   If $Y$ is the Construct ($\theta$), then Error Rate Balance is **Measurement Invariance**.
      *   If $Y$ is the Criterion (e.g., loan default), then Error Rate Balance is **Selection Efficiency**.
      *   Fairness literature often slides between these two definitions. Psychometric vocabulary forces you to choose, which dissolves the "impossibility" into a clearer trade-off: *Are we trying to measure a trait equally well, or select for an outcome equally efficiently?* You can do the former without impossibility; the latter is constrained by base rates.

  **Summary:** The impossibility theorem is a proof that **Predictive Validity** and **Selection Parity** are mathematically incompatible under Impact. Psychometrics has known this since the 1960s (e.g., Linn, 1984; Hunter, 1980) under the guise of "Adverse Impact vs. Validity." The fairness debate rediscovered this theorem but obscured the distinction between measurement error and decision thresholds, leading to the illusion of a paradox rather than a recognized trade-off in utility theory.
