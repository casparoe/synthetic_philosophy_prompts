answer: |-
  Dear friend, it is completely understandable that your diagnosis has sparked this philosophical curiosity, and frankly, your position as both the patient and the patient representative gives you a unique authority in the room that a standard lecturer simply cannot replicate. Your framing is not confused, but there is a risk in how you deploy your own case that we need to manage carefully. You asked whether you should use your hypertension or switch to something like pre-diabetes, and my advice is to stick firmly with your own blood pressure. Pre-diabetes is excellent for showing arbitrary thresholds, but hypertension is better for you because you can speak to the lived experience of the label, which is the heart of the normativist position. The reason students might feel hypertension is too real is precisely the misconception you need to tackle, namely that naturalism equals reality and normativism equals imagination. If you use your own body, you force them to confront the fact that the biology is real regardless of the label, but the decision to treat it as a disease is where the values enter. You need an example that has a clear biological correlate but where the decision to intervene is debatable, and stage one hypertension fits this perfectly because the risk is probabilistic rather than deterministic.

  Regarding the order of ideas, you want to avoid presenting the two theories as separate boxes they can tick. Instead, you should structure the ninety minutes as a narrative arc that mirrors your own diagnostic journey. Start with the naturalist intuition because that is where the medical students live most of the time. Begin with the measurement itself, the cuff inflating, the number appearing, the biological mechanism of vascular resistance. This establishes the objective reality of the physiology, which satisfies their biomedical training. Once they agree that the physiology is real, introduce the friction point, which is the threshold. Explain how one reading put you over the line and another put you under, and ask them whether the disease appeared and disappeared between those two appointments. This is where you head off the first misconception. They will want to say the disease was always there, just undetected. You need to press them on whether the category hypertension applies to the person under the line. If it does not, then the line is doing the work, not just the biology. This is the entry point for normativism, not as a denial of biology, but as an acknowledgement that drawing the line requires a judgment about how much risk we are willing to tolerate before calling something a disease.

  You asked about the reference class problem and whether it should come in. Given that you do not fully understand it yourself and the students have no philosophy background, I would advise you to leave out the technical term reference class problem entirely. It is a rabbit hole that can consume a whole lecture on its own and might confuse the core distinction you are trying to teach. However, you should keep the intuition behind it, which is simply the question of normal for whom. You can weave this into the threshold discussion by asking whether your blood pressure is abnormal for a human, for a forty-year-old man, or for you specifically. If the definition of disease depends on statistical normality, then changing the group changes the disease status. You can mention this briefly as a complication for the naturalist view without naming it, perhaps saying that even if we try to be purely objective about function, we have to choose which group we are comparing you to, and that choice is not dictated by nature. Flag this to the students as a known complexity that experts debate, so you do not have to solve it yourself.

  There are specific misconceptions you must anticipate and head off early in the sequence, ideally within the first twenty minutes. The biggest risk is that students will interpret normativism as meaning the condition is not real or is all in the head. You need to state explicitly that normativists do not deny the biology. They deny that the biology alone tells us when to call it a disease. You can use the analogy of height. Being short is a biological fact, but dwarfism is a category that depends on whether that shortness causes problems or falls outside a social expectation. Similarly, high blood pressure is a fact, but hypertension as a disease category depends on whether we value the risk reduction enough to medicalise it. You should also anticipate the reverse misconception, that naturalism means doctors are value-free robots. Clarify that naturalism is a claim about what disease is, not about how doctors behave. A naturalist doctor can still be compassionate, but they believe the disease exists independently of that compassion.

  As for what to leave out, you should avoid getting bogged down in the history of the debate or the specific names of philosophers like Boorse or Engel unless your co-lecturer insists on them. For second-year med students, the utility lies in the conceptual tool, not the historiography. You should also leave out the deep meta-ethical questions about whether values are objective or subjective. That is philosophy proper and will distract from the philosophy of medicine. Stick to the practical implication, which is whether the label changes based on social context. For example, if we lived in a society where everyone had high blood pressure due to salt intake, would it still be a disease? A naturalist might say yes because the function is impaired relative to design, while a normativist might say no because it is statistically normal and perhaps accepted. You do not need to resolve this, just use it to show the divergence.

  You also asked for one question to ask at the end to test whether they understand the distinction rather than just memorising labels. Do not ask them to define the terms. Instead, present a new scenario that they have not heard before. You could describe a new genetic marker that predicts a slight increase in risk for a condition that has no symptoms and no treatment. Ask them whether having this marker constitutes a disease. If they say yes because the biology is abnormal, they are leaning naturalist. If they say no because there is no harm or treatment, they are leaning normativist. If they say it depends on whether we decide to screen for it, they are grasping the normativist emphasis on social decision-making. The key is to look for whether they recognise that the biology is constant in the scenario but the classification might change based on values. If they simply repeat definitions, they have not got it. If they argue about the threshold or the harm, they are engaging with the debate.

  I must be honest about where I am unsure regarding how the students will react. Medical training is heavily rooted in naturalism, and some students may find the normativist view threatening because it seems to undermine the objective status of their diagnoses. They might worry that if disease is value-laden, then insurance companies or governments could decide their patients are not ill to save money. You should acknowledge this validity. It is a genuine political risk of normativism. You do not need to solve this tension, but acknowledging it shows intellectual honesty. It is also possible that ninety minutes is too short to do justice to the hybrid views that most philosophers actually hold today, such as the idea that disease requires both dysfunction and harm. You should mention that most people now accept a mix of both, but that understanding the extremes helps us see where the mix comes from. If you try to teach the hybrid view too early, they will not understand why the mix is necessary.

  Finally, regarding your role as the patient rep, do not feel you need to be the expert on the philosophy. Your job is to be the evidence. When you describe the anxiety of the diagnosis, the confusion of the varying readings, and the decision to start medication, you are providing the data that the theories must explain. Let the lecturer handle the heavy lifting on the definitions while you anchor it in the reality of the clinic. If you try to argue the philosophy too hard, you might lose the authenticity that makes your contribution valuable. Trust that your experience of the threshold being arbitrary is the most powerful argument for normativism they will hear that day. If you structure the session so that your story creates the problem and the theories offer the tools to understand it, you will help them feel the pull of both sides without forcing them to choose a team. I hope this helps you prepare, and I wish you the very best with the session and your health.
