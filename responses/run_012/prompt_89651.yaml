prompt: |-
  I've recently been diagnosed with high blood pressure—stage 1, apparently—and it's made me weirdly obsessed with whether diseases are natural kinds or value-laden categories. One reading put me over the line, a second reading put me back under it, and yet my GP still talks as if the condition is just there in my body. Next month I've been asked to co-teach a 90-minute session on naturalism versus normativism about health and disease for a second-year philosophy of medicine module: about 20 med students, no prior philosophy, mixed backgrounds. I'm the patient rep, not the lecturer, so my job is to plan the explanation and then the lecturer will deliver it with me. Don't explain the debate to me; I need a teaching plan. What order do the ideas have to go in so the students feel the pull of both sides rather than just sticking labels on them? I want one carrying example to run through the whole session. I was thinking of my own case, the blood-pressure threshold, but I'm not sure it does enough work because most people already accept hypertension is real. Maybe I should pair it with something like pre-diabetes or a risk score, where the line is obviously drawn by a committee and yet the risk is real. Tell me what the example needs to have and lack, and whether I should use my own case at all. What misconceptions will they bring—I'm guessing naturalism means disease is objective and normativism means it's just made up—and exactly where in the sequence I should head each one off? There's also the reference-class thing, which I don't fully understand: whether my blood pressure is abnormal for a 40-year-old man in general, or for a man with my family history, or for me on a bad day. Should that come in, and if so where? What should I leave out at this level and say I'm leaving out? And what's one question I can ask at the end that would show whether they've actually got the distinction rather than just memorised the two seperate labels? If my framing is confused, or if this is a bad way to teach it, please say so plainly rather than just giving me a plan. And don't pretend to a confidence you don't have: if some part of this is genuinely contested, or if you're unsure how med students will react, flag it. I'm definately not a philosopher, so assume I'll need the dependencies spelled out. Write it as continuous prose, no headings, no bullet points, no bold, no tables—just the way you'd write an email. British English, please.
