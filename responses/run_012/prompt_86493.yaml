answer: |-
  Your record reveals not a consistent moral or legal principle, but a consistent **calculus of capacity and deterrence.** To find the rule that survives, we must test your four candidates against the five cases you provided.

  ### 1. Testing the Rules Against Your Record

  *   **Retribution for Voluntary Revolt:**
      *   *Fits:* Mytilene, Scione.
      *   *Fails:* Melos. Melos never revolted; it was neutral. Yet it suffered the fate of Scione. This rule cannot explain the harshest penalty in your list.
  *   **Utility of the Place to Athens:**
      *   *Fits:* Mytilene (population kept for rent/labor), Hypothetical 413 (implied need for tribute).
      *   *Fails:* Scione, Melos. Both were destroyed despite having land and strategic value. If utility were the primary rule, Melos would have been forced into the alliance, not exterminated.
  *   **Guilt of the Few:**
      *   *Fits:* Mytilene (final decree), Hypothetical 413 (ringleaders known).
      *   *Fails:* Scione, Melos, Arginusae. In these cases, collective guilt was applied indiscriminately (all men of Scione/Melos; all generals together).
  *   **Mood of the Day (Democratic Expediency):**
      *   *Fits:* All cases.
      *   *Mytilene:* Mood shifted from rage (Cleon) to prudence (Diodotus) based on long-term imperial interest.
      *   *Scione/Melos:* Mood was "terror is necessary" because Athens had the manpower to replace the populations (Plataeans/Colonists).
      *   *Arginusae/Socrates:* Mood was the *demos* asserting absolute sovereignty over elites during crisis (war loss/political restoration).

  **The Survivor:** The only rule that survives your record is **Expediency Defined by Capacity.**
  Athens punishes based on what it can *afford* to do and what it *needs* to achieve. When Athens has settlers to spare and needs to set a terrifying example (Scione, Melos), it exterminates. When it lacks settlers or needs the tax base (Mytilene final), it punishes the leaders and keeps the workforce. The "Mood" is not random; it is the democratic assembly measuring its own desperation against its available resources.

  ### 2. Prediction for the Hypothetical Case (413 BC)

  **The Verdict:** The Assembly will execute the known ringleaders, confiscate the fleet, and perhaps impose a higher tribute or a democratic government, but **the population will be spared and not enslaved.**

  **Why:**
  1.  **Capacity:** You specify Athens has "no settlers on hand." Without colonists (like the 500 at Melos or the Plataeans at Scione), Athens cannot physically occupy the land. Depopulating the city would turn a revenue source into a dead zone.
  2.  **Utility:** Post-Sicily, Athens is financially and navally desperate. It needs the tribute and the ships more than it needs vengeance.
  3.  **Precedent:** This matches the *final* Mytilene outcome exactly. Mytilene was a major fleet power that revolted; Athens kept the population because destroying them served no strategic purpose once the "terror" value was outweighed by the loss of revenue.

  **Which Rule to Prefer:** You should prefer the **Expediency/Capacity** rule. It explains why Melos (no revolt) was treated worse than Mytilene (revolt). Melos was destroyed because Athens *could* colonize it and *needed* to frighten other neutrals. Mytilene was spared (mostly) because Athens *needed* the rent and couldn't spare the manpower to hold empty land.

  ### 3. The Individual Verdicts: Same Rule or Second One?

  The cases of the **Arginusae Generals** and **Socrates** constitute a **second rule**, though it is the internal mirror of the first.

  *   **Imperial Rule (External):** The Assembly's will is unconstrained by justice or treaty when the security of the empire is at stake.
  *   **Civic Rule (Internal):** The Assembly's will is unconstrained by law or procedure when the security of the democracy is at stake.

  **Why they are distinct:**
  The imperial cases concern *subjects* (who have no rights). The individual cases concern *citizens* (who have legal rights). That the Assembly violated the rights of citizens (collective trial for generals; retroactive impiety for Socrates) proves that the "Mood/Expediency" rule applies domestically as well. However, they are a second rule because they test the limits of *constitutional* restraint rather than *imperial* restraint.

  Together, they form a single principle of **Athenian Sovereignty:** Whether dealing with a city or a citizen, the *demos* is the sole judge of necessity, and no external law (treaty) or internal law (statute) can bind it when it feels threatened.

  ### 4. The Further Case That Would Force the Choice

  To definitively prove that **Expediency/Capacity** rules over **Retribution** or **Utility**, you need a case that separates *desire* from *ability*.

  **The Falsifying Case:**
  Find (or posit) a case where **Athens destroys a rebellious city completely despite having no colonists to settle the land and a critical need for the tribute.**

  *   **If this happens:** The "Utility/Capacity" rule dies. It proves that **Terror/Mood** is the absolute master. Athens would rather burn a revenue source than show mercy.
  *   **If this does not happen (and they spare the population):** It confirms that Athenian cruelty is not bloodlust, but cold calculation. They only kill when they can replace what they destroy.

  **Historical Candidate:** The treatment of **Hestiaea** (c. 446 BC). After a revolt, the population was expelled and Attic settlers took the land.
  *   *If* Athens had settlers then: It fits Capacity.
  *   *If* Athens *lacked* settlers then but did it anyway: It fits Mood/Retribution.

  However, for your specific test, the decisive hypothetical is: **A city revolts in 413 (desperate times), Athens has no colonists, yet votes to enslave everyone.** If the Assembly votes that, your rule is not Utility or Capacity; it is purely **Panic.** If they spare the population, your rule is **Expediency.** Given the Mytilene precedent, Expediency is the stronger predictor.
