answer: |-
  1. **Essay Question**

  **Time Limit:** 60 Minutes
  **Instructions:** Closed book. No secondary sources.

  Mencius and Xunzi both agree that moral cultivation is difficult and necessary for most people, yet they offer opposing verdicts on *xing* (nature). 

  **Part 1:** Explain how their respective definitions of *xing* lead them to apply the terms "good" and "bad" to different features of the human being. Why does Mencius think following *xing* leads to morality, while Xunzi thinks it leads to chaos?

  **Part 2:** Argue whether their disagreement is ultimately verbal (a matter of definition) or substantive (a matter of fact or value). **You must take a definitive stance; do not hedge.** If you argue the disagreement is merely verbal, explain what specific claim about human psychology one of them would have to concede to make the disagreement real. If you argue the disagreement is substantive, identify the core conflict that remains even after clarifying their definitions.

  ***

  2. **Model Answer**

  Mencius and Xunzi are often caricatured as optimists and pessimists, but this misses the structural difference in how they define *xing*. For Mencius, *xing* refers to the distinctive moral potential that separates humans from beasts. He points to the "four sprouts"—incipient feelings like compassion—as evidence that *xing* is good. By "good," Mencius does not mean perfected virtue, but rather an internal directional tendency toward goodness that cultivation must nurture. Conversely, Xunzi defines *xing* as the raw, unworked material of human life: our biological desires and reactive capacities. Since these desires are unlimited and resources are scarce, following *xing* inevitably leads to conflict and strife. By "bad," Xunzi means that unchecked nature produces social disorder, not that humans are demonically evil.

  Because they define the term differently, they are indeed evaluating different objects. Mencius evaluates the sprouts; Xunzi evaluates the desires. However, claiming their disagreement is *merely* verbal is insufficient. A substantive disagreement survives regarding the source and authority of moral norms (*li*).

  For Mencius, ritual and righteousness are internal developments. The sage does not invent morality; he fully realizes what is already latent in everyone. Moral authority comes from within; cultivation is a process of recovery and growth. For Xunzi, ritual is an external invention created by sages to curb human nature. The sages are exceptional because they imposed order on chaos, not because they uncovered a universal inner truth. Moral authority comes from without; cultivation is a process of transformation and correction.

  This is not just a semantic split. Even if we agree to define *xing* as "raw desires" (favoring Xunzi), Mencius would argue that ignoring the sprouts misses the defining feature of humanity. If we define *xing* as "moral potential" (favoring Mencius), Xunzi would argue that relying on this potential ignores the immediate reality of destructive desires. The core conflict is ontological: Is morality discovered or constructed? Mencius claims morality is inherent to the human constitution; Xunzi claims it is a cultural artifact necessary to survive that constitution.

  I argue the disagreement is substantive. For my position to be wrong, it would have to be shown that Xunzi accepts the existence of moral sprouts but deems them irrelevant, or that Mencius accepts desires are the only *xing* but argues they somehow self-regulate. Neither text supports this. Xunzi explicitly denies inherent moral knowledge, and Mencius explicitly warns that losing the sprouts makes one less than human. Therefore, while they talk past each other on the definition of *xing*, they fundamentally disagree on whether morality is an internal truth we uncover or an external tool we forge. The dispute is not just about what *xing* means, but about where the Dao comes from.

  ***

  3. **Marking Scheme**

  **Total Marks:** 20 (5 points × 4 marks)

  | Point | Criteria | Typical Failure |
  | :--- | :--- | :--- |
  | **1** | **Distinct Definitions:** Clearly distinguishes Mencius's *xing* (sprouts/potential) from Xunzi's *xing* (desires/raw material). | Student treats *xing* as a single fixed concept both philosophers analyze identically. |
  | **2** | **Good/Bad Application:** Explains why "good" means developmental potential for Mencius but "bad" means social consequence for Xunzi. | Student claims Mencius thinks humans are born perfected or Xunzi thinks humans are born evil incarnate. |
  | **3** | **Definitive Verdict:** Takes a clear stance on verbal vs. substantive disagreement without hedging or sitting on the fence. | Student concludes "both sides have merit" or "it depends on how you look at it" instead of arguing one case. |
  | **4** | **Residual Conflict or Conditions:** Identifies the surviving substantive issue (source of *li*) OR specifies what concessions would resolve a verbal dispute. | Student stops at "they are talking past each other" without analyzing what remains or what would fix it. |
  | **5** | **Textual Integrity:** Argues from the positions themselves without importing modern Western frameworks (e.g., nativism vs. empiricism). | Student analyzes Mencius as a rationalist or Xunzi as a Hobbesian empiricist rather than engaging their specific claims. |

  **Specific Moves That Cost Marks:**

  *   **The "Talking Past" Stopgap:** Stating "they are just defining words differently" and treating that as the conclusion. This earns a B. To get an A, the student must explain what disagreement *remains* after the definitions are cleared up.
  *   **The Modern Import:** Framing the debate as "Nature vs. Nurture" or "Rationalism vs. Empiricism." Both thinkers agree nurture is required; the dispute is about the *direction* of cultivation (internal unfolding vs. external reshaping).
  *   **The Child-at-the-Well:** Relying solely on the famous Mencius anecdote without engaging Xunzi's counter-logic regarding desire and strife.
  *   **The Hedging Ending:** Concluding Part 2 by saying "Scholars disagree on this" instead of committing to an argumentative verdict as instructed.
  *   **The Citation Crutch:** Naming secondary scholars (e.g., "As Ivanhoe argues...") instead of doing the philosophical work themselves.
