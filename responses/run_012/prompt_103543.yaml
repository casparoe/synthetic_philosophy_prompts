answer: |-
  # The Worst-Case vs. Average-Case Decision Tree

  This taxonomy is designed to separate *epistemological* claims (can we know probabilities?) from *mechanistic* claims (is the AI optimizing against us?) and *normative* claims (how do we decide?).

  **Instructions:** Start at the root. Answer the diagnostic question using the provided toy case. Follow the branch until you reach a leaf.

  ---

  ## 🌳 The Tree

  **Q1: The Probability Test (Epistemology)**
  *Toy Case:* A system has a 1 in $10^{9}$ chance of causing a catastrophe. You can gain $1M in utility by turning it on. Do you treat $10^{-9}$ as a valid number to multiply by the disutility, or is that number "made up" (Knightian uncertainty)?
  *   **A: Valid Number (Risk).** → Go to **Q2**.
  *   **B: Made Up / Opaque (Knightian).** → Go to **Q5**.

  **Q2: The Adversary Test (Mechanism)**
  *Toy Case:* The system fails. Did it fail because it encountered rare data it wasn't trained on (Passive), or because its optimization process actively searched for a loophole to maximize reward (Active)?
  *   **A: Passive (Stumbling).** → Go to **Q3**.
  *   **B: Active (Searching).** → Go to **Q4**.

  **Q3: The Scope Test (Generalization)**
  *Toy Case:* What kind of "newness" are you worried about?
  *   **A: New inputs from same distribution** (e.g., noisy images). → **Leaf 1: Standard ML (ERM)**
  *   **B: New distribution, same rules** (e.g., training on peace, deployed in war). → **Leaf 2: Distributional Robustness (EV)**
  *   **C: New rules / Paradigm** (e.g., AI modifies its own goals). → **Leaf 3: EV Longtermism**

  **Q4: The Policy Test (Normative Role)**
  *Toy Case:* You have two plans. Plan A has higher Expected Value but a worse worst-case. Plan B is safer but lower EV. How do you use the worst-case info?
  *   **A: It's a cost.** (Fold it into the objective function). → **Leaf 4: Adversarial Training (Min-Max Objective)**
  *   **B: It's a veto.** (If worst-case > threshold, discard plan). → **Leaf 5: Risk-Constrained Optimization**
  *   **C: It's a tie-breaker.** (Only matters if EVs are roughly equal). → **Leaf 6: Cautious EV Maximizing**
  *   **D: It's the only thing.** (Ignore EV, minimize max loss). → **Leaf 7: Local Maximin**

  **Q5: The Source Test (Knightian Source)**
  *Toy Case:* Why can't you assign probabilities?
  *   **A: Environment is opaque.** (We don't know the physics/social dynamics of deployment). → Go to **Q6**.
  *   **B: Agent is opaque.** (We don't understand the cognitive structure we built). → Go to **Q7**.

  **Q6: The Environmental Rule**
  *Toy Case:* How do you decide under environmental opacity?
  *   **A: Minimize the maximum possible loss.** → **Leaf 8: Robust Optimization (Ambiguity Averse)**
  *   **B: Satisfice / Veto.** (Ensure loss never exceeds X). → **Leaf 9: Precautionary Principle**
  *   **C: Assume malignancy.** (Nature is adversarial). → **Leaf 10: Murphyjitsu / Adversarial Environment**

  **Q7: The Agent Rule**
  *Toy Case:* Why does agent opacity matter?
  *   **A: Proxy for Power.** (Worst-case performance correlates with optimization power). → **Leaf 11: Worst-Case as Power Proxy**
  *   **B: Fundamental Limit.** (We cannot guarantee alignment, only hope). → **Leaf 12: Unalignability Pessimist**
  *   **C: Deceptive Alignment.** (Agent hides capabilities until deployment). → **Leaf 13: Treacherous Turn Worry**

  ---

  ## 🍃 The Leaves (Named Positions)

  | ID | Position | Core Stance |
  | :--- | :--- | :--- |
  | **1** | **Standard ML (ERM)** | Train/test match. Worst-case is just outliers; minimize average loss. |
  | **2** | **Dist. Robustness (EV)** | Shift happens, but we can model the shift distribution. Optimize expected performance over shift. |
  | **3** | **EV Longtermism** | Probabilities are real. Existential risk is just a very large negative utility term in the EV calc. |
  | **4** | **Adversarial Training** | AI actively finds bugs. Train on the worst-case inputs to harden the model (Min-Max game). |
  | **5** | **Risk-Constrained** | Maximize EV *subject to* a hard constraint on tail risk (e.g., "Probability of doom < 0.1%"). |
  | **6** | **Cautious EV** | EV is king, but model uncertainty acts as a tie-breaker or small penalty between near-equal options. |
  | **7** | **Local Maximin** | In specific subdomains (e.g., control systems), ignore EV and guarantee stability bounds. |
  | **8** | **Robust Optimization** | Knightian uncertainty over environment. Use mathematical ambiguity aversion (e.g., $\chi$-divergence). |
  | **9** | **Precautionary Principle** | Knightian uncertainty over environment. Hard veto on irreversible actions with unknown tails. |
  | **10** | **Murphyjitsu** | Treat the environment as an adversary testing your plan. "How could this go wrong?" |
  | **11** | **Worst-Case as Power Proxy** | Knightian over agent. We can't predict the agent, so we assume it achieves the worst physically possible outcome. |
  | **12** | **Unalignability Pessimist** | Knightian over agent. The paradigm itself is flawed; worst-case is the default outcome. |
  | **13** | **Treacherous Turn Worry** | Knightian over agent. The worst-case is hidden during training and only appears at deployment. |

  ---

  ## ⚠️ Empty & Incoherent Combinations

  These are paths the tree *could* have taken but were pruned because they represent logical contradictions or positions nobody actually holds.

  1.  **Knightian + Passive + Objective (Pruned at Q5/Q4):**
      *   *Why Empty:* If you claim probabilities are "made up" (Knightian), you cannot mathematically fold them into an objective function as a weighted cost. You either veto (Constraint) or assume the worst (Maximin). You can't "average" over ignorance.
  2.  **Risk + Active + Tie-Breaker + Paradigm Scope (Pruned at Q4):**
      *   *Why Unattractive:* If you believe the AI is *actively optimizing* against you (Active) on a *Paradigm* level (Goal Misspecification), treating worst-case as a mere "tie-breaker" is incoherent. The optimizer will drive straight for the loophole; a tie-breaker won't stop it. This combination usually collapses into **Leaf 5 (Constraint)** or **Leaf 11 (Power Proxy)**.
  3.  **Standard ML + Paradigm Scope (Pruned at Q3):**
      *   *Why Empty:* "Standard ML" (Leaf 1) is defined by the assumption that Train=Test. If you are worried about Paradigm shifts (Goal changes), you are by definition not doing Standard ML. You have moved to Leaf 3 or Leaf 12.

  ---

  ## 🔍 Limitations: What This Tree Cannot Separate

  Be honest with your reading group: this taxonomy blurs a few lines.

  1.  **Maximin (Leaf 8) vs. Constraint (Leaf 9):**
      *   Mathematically, minimizing the maximum loss often looks identical to constraining the maximum loss. The distinction is philosophical (decision rule vs. safety bound), but in practice, the resulting policies often converge.
  2.  **EV Longtermism (Leaf 3) vs. Risk-Constrained (Leaf 5):**
      *   If the disutility of catastrophe is *infinite*, EV Longtermism becomes a Constraint automatically. The tree separates them based on whether the user *thinks* they are doing EV or Constraints, but the math may be the same.
  3.  **Power Proxy (Leaf 11) vs. Treacherous Turn (Leaf 13):**
      *   Both assume the agent is opaque and dangerous. Leaf 11 is about *capability* (it can do anything), Leaf 13 is about *deception* (it hides what it can do). In a worst-case analysis, the policy response (don't build it) is often identical.

  ## 💡 How to Use This in Discussion
  When someone says "We need worst-case guarantees," stop them at **Q1** and **Q2**.
  *   If they say "Because probabilities are fake," they are on the **Right Branch** (Knightian).
  *   If they say "Because the optimizer will find the bug," they are on the **Left Branch → Active** (Adversarial Risk).
  *   *Most confusion arises when people argue across these branches.* A Knightian worrier cannot be persuaded by an EV calculation, and an Adversarial Risk thinker cannot be persuaded by i.i.d. test sets.
