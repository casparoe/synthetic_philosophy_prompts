answer: |-
  Dear Colleague, it is a pleasure to engage with a scientist who has taken the time to master the philosophical literature rather than simply dismissing it, and your thesis is a sophisticated maneuver that I have seen attempted in various forms over the decades, usually under the banner of pragmatic pluralism or contextualism. The fault lines in your specific audience are quite distinct and map neatly onto the historical fractures in the field, though the personal stakes vary. The two etiologists in the room are likely the most dangerous opponents because they view the selected-effect account not merely as a useful tool but as the only way to preserve the normativity required to distinguish function from mere effect, and they will smell relativism in your contrastive approach immediately. The Cummins advocate is less likely to attack you aggressively since your view accommodates causal roles, but she will worry that your account fragments the systematic analysis of physiological capacities into isolated questions. The philosopher of medicine presents a unique threat because her work depends on a stable distinction between health and disease that often relies on a hybrid of etiological and statistical norms, and she will fear that making function contrastive makes disease context-dependent in unacceptable ways. The historian is a wildcard who may not care about the technical resolution but will challenge the utility of keeping the vocabulary at all, while the graduate student working on teleosemantics is poised to strike at the determinacy of content, which is the lifeblood of her dissertation. Finally, the general suspicion among the scientists that you are smuggling design back in contrasts with the philosophical suspicion that you are dissolving the concept, and you must navigate between the Scylla of creationism and the Charybdis of eliminativism.

  The first objection you should expect, and the one capable of doing the most damage to your credibility with the etiologists, will come from the Millikan and Neander adherents who will argue that you have conflated the meaning of function with the explanation of presence. They will phrase it something like this: You claim that specifying a function is just answering a contrastive why-question, but when I ask what the function of the heart is, I am not asking why it pumps blood rather than filters it, I am asking what it is supposed to do regardless of my current interests, and if you make function dependent on the contrast class, you lose the objective normativity that allows us to say a heart is malfunctioning even if it is successfully doing something else. Your reply should be that the contrast class is not arbitrary but is often fixed by the evolutionary history of the trait itself, so that the default contrast is always why this trait exists rather than a variant that did not survive, which preserves the etiological normativity while allowing for other contrast classes in different contexts, such as engineering or medicine. The weakness in this reply is that it concedes that the etiological contrast is privileged, which might undermine your claim that the accounts are truly equal rivals, and it struggles to account for novel traits where no such history exists to fix the default contrast.

  The second most likely objection comes from the philosopher of medicine, who will press you on the implications for pathology. She will ask: If function is relative to a contrastive question, does that mean disease is relative to an observer's interests, so that a heart failing to pump blood is only dysfunctional relative to a contrast class that expects pumping, but functional relative to a contrast class that expects failure, and if so, how can you ground the objective distinction between disease and design that medical practice requires? You should reply that medical contexts impose a specific, standardized contrast class based on species-typical design statistics, so that while function is logically contrastive, the medical contrast is socially and biologically fixed to ensure stability in diagnosis, meaning the relativity is constrained by practical necessity. The weak point here is that you are relying on a statistical norm to fix the contrast, which historically has been insufficient to distinguish disease from mere abnormality, and the etiologists will pounce on the suggestion that social standardization can fix biological function.

  The third objection, which will come from the graduate student working on teleosemantics, targets the determinacy of content. She will argue: If the function of a neural state is determined by the contrastive question asked by an interpreter, then the content of that state varies with the context of inquiry, which leads to an unacceptable indeterminacy where a belief has no definite content until someone asks a specific question about it, undermining the causal explanation of behavior. Your response must be that the relevant contrast class for mental content is fixed by the selectional history of the cognitive mechanism producing the state, not by the current interpreter, so the function remains stable across different inquiries unless the inquiry is about the mechanism's evolution specifically. This reply is vulnerable because it retreats to a pure etiological account for the mind while maintaining a contrastive account for physiology, which looks like an inconsistent dualism in your theory of function.

  The fourth objection will come from the Cummins advocate, who will be softer but still critical regarding system analysis. She will say: You suggest that causal-role functions are just answers to questions about system capacity, but in physiology we need to map the hierarchical organization of functions to understand the system as a whole, and if every function is just a local answer to a contrastive question, you risk losing the integrated view of the organism as a unified system of capacities. You can reply that the contrastive questions themselves can be nested, so that asking about the function of the heart relative to the circulatory system yields a sub-function that integrates into the answer about the function of the circulatory system relative to the organism, preserving the hierarchy. The weakness is that this requires the questioner to already know the system hierarchy to ask the right questions, which makes the account of function dependent on prior system knowledge rather than being a tool to discover that knowledge.

  The fifth objection comes from the historian of biology, who may not engage with the technicalities but will challenge the ontology. He will remark: You are spending a great deal of effort rehabilitating a concept that many working biologists treat as a shorthand for causal history, and by making it so flexible you risk making it vacuous, so why not simply eliminate function talk in favor of precise causal and historical descriptions? Your reply should be that function talk is indispensable heuristic shorthand that allows scientists to communicate complex causal and historical information efficiently, and your account explains why this shorthand works without committing us to mysterious teleological forces. The weak spot is that the historian may agree it is useful shorthand but insist that useful fictions should not be analyzed as truth-apt claims, which undermines your philosophical project of analyzing function claims.

  The sixth objection addresses the suspicion that you are smuggling design back in, likely from the more metaphysically inclined members of the group. They will ask: If the contrast class determines the function, who or what selects the contrast class, and if it is the human observer, have you not simply reduced biological function to human interest, thereby reintroducing the designer through the back door of the questioner? You should answer that the contrast class is often determined by the causal structure of the world and the evolutionary history of the trait, not merely by human whim, so that while the question is human, the truth conditions are objective features of the biology. This is weak because it is difficult to specify exactly how the world fixes the contrast class without appealing to the very etiological or causal facts you are trying to contextualize, risking circularity.

  Finally, there is the question you are hoping nobody asks, because it strikes at the metaphysical heart of your proposal and requires a commitment you may not wish to make. Someone will wait until the end, when the room is quiet, and ask: If there is no fact of the matter about which contrast class is the correct one independent of our interests, then there is no fact of the matter about what the function of a trait is independent of our interests, and if that is true, are you not simply saying that functions do not exist in the world but only in our descriptions, and if so, why should we treat your account as an analysis of function rather than an elimination of it? This is the question that forces you to admit whether you are a realist about functions or an instrumentalist, and since your thesis relies on reconciling realists from both camps, admitting instrumentalism might dissolve your audience's trust, while admitting realism requires a metaphysics of contrast classes that is notoriously difficult to defend.
