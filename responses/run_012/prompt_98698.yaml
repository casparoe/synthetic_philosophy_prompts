answer: |-
  **FINAL EXAM: SOCIAL CHOICE AND JUDGMENT AGGREGATION**
  **Time Allowed:** 60 Minutes
  **Instructions:** Answer the following question. Closed book. No notes. All necessary definitions and data are contained within the question.

  **Question 1**

  A five-person tenure committee votes on three propositions:
  *   **P:** The candidate's research meets our bar.
  *   **Q:** The candidate's teaching meets our bar.
  *   **R:** The candidate should be tenured.

  **Constraint:** By committee rule, $R$ is true if and only if both $P$ and $Q$ are true ($R \leftrightarrow P \land Q$).

  **The Votes:**
  *   Voter 1: P=Yes, Q=Yes, R=Yes
  *   Voter 2: P=Yes, Q=No,  R=No
  *   Voter 3: P=No,  Q=Yes, R=No
  *   Voter 4: P=Yes, Q=Yes, R=Yes
  *   Voter 5: P=No,  Q=No,  R=No

  **Procedures:**
  1.  **Plain Majority:** Simple majority vote on each proposition independently.
  2.  **Premise-Based Voting (PBV):** Majority vote on P and Q; R is determined by the constraint.
  3.  **Conclusion-Based Voting (CBV):** Majority vote on R directly; P and Q are ignored for the decision.
  4.  **The Chair's Sequence:** First, take a majority vote on P. If P fails, R fails. If P passes, take a majority vote on Q *among only the members who voted P=Yes*. If that sub-majority passes Q, R passes; otherwise, R fails.

  **Tasks:**
  (a) Calculate the Plain Majority result for P, Q, and R. Explain precisely what is logically wrong with this collective outcome.
  (b) Determine the decision (Tenure or No Tenure) under PBV, CBV, and The Chair's Sequence (starting with P).
  (c) Assess The Chair's Sequence for order-dependence. Does the decision change if the rule is reversed (vote Q first; if Q passes, vote P among Q-Yes voters)? You must either construct a specific 5-voter profile where the order changes the outcome or prove it is impossible. Also, identify one standard property the rule preserves and one it violates.
  (d) Select either PBV or CBV. Defend it against its strongest theoretical objection. Your defense must address the fact that the choice of procedure alone determines whether the candidate gets tenure.

  ***

  **MODEL ANSWER**

  (a) Under Plain Majority, we count the Yes votes for each proposition.
  P: Voters 1, 2, 4 vote Yes (3/5). **P Passes.**
  Q: Voters 1, 3, 4 vote Yes (3/5). **Q Passes.**
  R: Voters 1, 4 vote Yes (2/5). **R Fails.**
  The logical error is a violation of the committee's constraint. The collective judgment accepts P and accepts Q, but rejects R. Since the rule states $R \leftrightarrow (P \land Q)$, accepting the premises while rejecting the conclusion creates a logically inconsistent collective set of judgments. This is the Discursive Dilemma.

  (b) **PBV:** The committee accepts P (3-2) and Q (3-2). By the constraint, R must be accepted. **Decision: Tenure.**
  **CBV:** The committee votes directly on R. The majority (3-2) votes No. **Decision: No Tenure.**
  **Chair's Sequence (P first):**
  Step 1: Vote on P. Result: 3 Yes, 2 No. P Passes.
  Step 2: Identify P-Yes voters: {1, 2, 4}.
  Step 3: Vote on Q among {1, 2, 4}. Voter 1 (Yes), Voter 2 (No), Voter 4 (Yes). Result: 2 Yes, 1 No. Q Passes.
  Since P and Q (sub-majority) pass, R passes. **Decision: Tenure.**

  (c) The Chair's Sequence is order-dependent. The outcome changes depending on whether P or Q is voted on first.
  **Counter-Profile (5 Voters):**
  1: P=Yes, Q=Yes
  2: P=Yes, Q=Yes
  3: P=Yes, Q=No
  4: P=No,  Q=No
  5: P=No,  Q=No
  **P-First:** P passes (3-2). P-Yes voters are {1, 2, 3}. Among them, Q votes are {Yes, Yes, No}. Sub-majority passes Q. **Result: Tenure.**
  **Q-First:** Q total votes are {Yes, Yes, No, No, No} (2-3). Q Fails immediately. **Result: No Tenure.**
  **Properties:**
  *Preserved:* **Logical Consistency.** Unlike Plain Majority, the rule never produces a contradiction between premises and conclusion; R always matches the rule's determination of P and Q.
  *Violated:* **Neutrality/Order Independence.** The rule treats the premises asymmetrically. As shown above, the agenda order dictates the winner, meaning the procedure is not neutral between P and Q.

  (d) **Defense of Premise-Based Voting (PBV).**
  The strongest objection to PBV is that it overrides the direct majority will on the final outcome (R). In this case, 3 voters voted "No Tenure," yet PBV grants tenure. Critics argue this is undemocratic because it ignores the holistic judgment of the majority on the specific question at hand (Tenure).
  However, PBV should be preferred because it prioritizes **reason-based accountability** over outcome aggregation. In contexts like tenure, the *reasons* for the decision matter as much as the decision itself. If we use CBV, a candidate could be denied tenure even if a majority agrees they meet both bars (as seen in the exam profile), simply because voters coordinated on "No" for different, perhaps incompatible, reasons. CBV allows "strange bedfellows" coalitions (e.g., Voter 2 and 3 agree on No, but disagree on why). PBV forces the committee to agree on the specific criteria (Research and Teaching) before granting the reward.
  Regarding the crux that the "procedure decides the outcome": This is not a bug, but a feature of judgment aggregation. There is no "true" will of the committee independent of the aggregation rule. Since the votes are inconsistent (the Discursive Dilemma), *some* procedure must break the tie between the premises and the conclusion. PBV is superior because it enforces the logical constraint explicitly agreed upon by the committee, ensuring that the institution's standards (the bars for P and Q) are not bypassed by a majority coalition that cannot agree on the standards themselves. We choose PBV not because it reveals a pre-existing truth, but because it constructs a rational agent out of the committee.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  **Part (a): Plain Majority & Inconsistency (4 Marks)**
  *   **2 Marks:** Correctly calculates majorities (P=Pass, Q=Pass, R=Fail). *Deduct 1 if any count is wrong.*
  *   **2 Marks:** Identifies the logical contradiction specifically (Accepting P & Q but rejecting R violates $R \leftrightarrow P \land Q$). *Do not award full marks if student only says "it is unfair" or "it is paradoxical" without citing the logical violation.*

  **Part (b): Procedure Outcomes (4 Marks)**
  *   **1 Mark:** PBV = Tenure.
  *   **1 Mark:** CBV = No Tenure.
  *   **2 Marks:** Chair's Sequence = Tenure. *Must show working:* Identify P-Yes voters {1, 2, 4} (1 mark) AND calculate sub-majority on Q correctly (2 Yes out of 3) (1 mark). *If they get the right result but wrong working, max 1 mark.*

  **Part (c): Order Dependence & Properties (6 Marks)**
  *   **3 Marks:** Correctly identifies rule is order-dependent AND provides a valid counter-profile.
      *   *Profile Requirements:* Must show a case where P-First yields Tenure and Q-First yields No Tenure (or vice versa). The profile provided in the Model Answer (3 P-Yes, 2 Q-Yes, 2 Overlap) is the standard solution.
      *   *Award 0 marks* if they argue it is impossible.
      *   *Award 1 mark* if they claim dependence but provide an invalid profile (e.g., one where both orders yield the same result).
  *   **1 Mark:** Identifies a preserved property (e.g., Logical Consistency, Completeness).
  *   **2 Marks:** Identifies a violated property (e.g., Order Independence, Neutrality between premises, Anonymity in effect). *Vague answers like "it's biased" receive 0 marks.*

  **Part (d): Defense & Crux (6 Marks)**
  *   **2 Marks:** Clearly states the strongest objection to the chosen procedure (e.g., for PBV: overrides majority on R; for CBV: allows logical inconsistency/coalitions of incompatible reasons).
  *   **2 Marks:** Provides a coherent theoretical defense (e.g., reason-based accountability, truth-tracking, integrity of constraints).
  *   **2 Marks:** **The Crux:** Explicitly addresses that the procedure *constructs* the outcome. The answer must acknowledge that there is no "fact of the matter" on tenure independent of the rule. *Answers that claim one method finds the "real" will of the committee without acknowledging the indeterminacy lose these 2 marks.*

  **General Penalties**
  *   **Word Count:** Significantly under 400 words or over 900 words: -2 Marks.
  *   **Citations:** Use of external theorems/names (e.g., "List & Pettit Theorem"): -2 Marks (Exam is self-contained).
  *   **Calculation Errors:** Propagated errors from (a) to (b) are not double-penalized if the method is correct.
