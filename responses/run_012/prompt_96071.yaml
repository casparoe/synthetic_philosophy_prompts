      *   *Is it new?* The specific framing of "occurrent vs. standing" in the context of the Ryle/Stanley debate is a fresh angle. Most debates focus on the *nature* of the standing state. Focusing on the *temporal/phenomenological moment of action* as an epistemic category is the potential contribution.
