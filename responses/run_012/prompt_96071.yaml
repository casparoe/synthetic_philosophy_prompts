      *   *Analysis:* "Occurrent" is the genus. "Indexical" and "Prospective" are species features of *this specific* occurrent state. Are they independent? If it's occurrent craft knowledge, must it be indexical? Yes, because general rules (standing) don't apply. Must it be prospective? Yes, because action is forward-looking.
