answer: |-
  This episode serves as a stress test for the philosophy of psychiatry. It forces each account to explain not just a static definition of disorder, but a dynamic historical shift in classification driven by a mix of scientific review and social pressure. Below is a disciplined mapping of the 1973–1987 sequence onto the three accounts, followed by an analysis of what the episode reveals about the accounts themselves.

  ### Part 1: Mapping the Episode onto the Accounts

  #### 1. The Naturalist Account
  **The Mapping:** On the naturalist view, the 1973 removal must represent an empirical correction. The APA effectively admitted a prior error in identifying a biological dysfunction. For the naturalist, the vote did not *make* homosexuality non-pathological; it *recognized* that it never was.

  **The Biological Route:** You identified two routes for the naturalist: (a) deny same-sex attraction is a dysfunction, or (b) deny there is a species-typical function of sexual arousal that it violates.
  *   **Route (a)** is difficult to sustain. If one defines sexual mechanisms by their evolutionary history, and that history is rooted in reproductive success, a mechanism that systematically directs arousal away from reproductive partners looks like a failure of design. To deny it is a dysfunction requires ignoring the evolutionary etiology of the mechanism.
  *   **Route (b)** is more defensible but biologically costly. It requires arguing that the "species-typical function" of sexual arousal is not exclusively or primarily reproduction, but perhaps pair-bonding, social cohesion, or pleasure. If the function is bonding, same-sex attraction performs the function adequately.

  **Strains and Teleology:** Route (b) depends heavily on how the reference class is fixed. If the reference class is "genes seeking replication," the dysfunction remains. If the reference class is "human social mammals seeking stability," the dysfunction vanishes. This exposes a silent teleology in naturalism: one must select *which* biological goal counts as "function." The naturalist must argue that the proximate mechanism (arousal) is functioning as designed (producing intense attraction), even if the ultimate evolutionary outcome (reproduction) is not met. This strains the standard evolutionary definition of function. The naturalist accommodation requires accepting that a trait can be evolutionarily disadvantageous without being a *mechanism failure*.

  #### 2. The Normativist Account
  **The Mapping:** For the normativist, the removal was a revaluation, not a discovery. The biology of gay men and lesbians did not change between 1972 and 1974; the social valuation of that biology did.

  **What Was Revalued:** The normativist must argue that what was revalued was not the orientation itself, but the *harm* associated with it. In the pre-1973 framework, the harm was viewed as intrinsic to the orientation (a disordered life). Post-1973, the harm was re-categorized as extrinsic (social stigma).
  *   **The 1973 Residual:** This category ("Sexual Orientation Disturbance") fits the normativist view well. It acknowledges that the *distress* is the disorder, not the orientation. The disorder is the conflict between the self and the environment (or internalized values).
  *   **The 1980 Category:** "Ego-dystonic Homosexuality" refines this. It specifies that the harm must be significant distress *plus* a desire to change.

  **Strains:** The normativist struggles to distinguish between a disorder and a reasonable reaction to an oppressive environment. If disorder is defined by harm/disvalue, and stigma causes harm, why isn't the distress caused by stigma a disorder? The normativist must introduce a secondary filter: the harm must be judged "legitimate" or "internal" to count as disorder. But if the judgment of legitimacy is itself normative, the account risks circularity. It explains the *change* well (values changed), but struggles to explain why we don't classify the distress of political dissidents or marginalized groups as mental disorders.

  #### 3. The Hybrid Account (Harmful Dysfunction)
  **The Mapping:** The hybrid account views the episode as a gradual decoupling of the two necessary conditions: dysfunction and harm.

  **The Residual Categories as a Natural Experiment:**
  *   **1973 Residual:** This category leaned heavily on the **Harm** component. It located the disorder in the distress/conflict. It was weak on the **Dysfunction** component, as it did not specify a mechanism failure other than the conflict itself.
  *   **1980 Ego-dystonic:** This category attempted to satisfy both prongs.
      *   *Harm:* Distress and desire to change.
      *   *Dysfunction:* The implicit claim was that a sustained pattern of exclusive homosexual arousal, *when unwanted by the individual*, indicated a failure of the sexual mechanism to align with the individual's reproductive or life goals.
  *   **1987 Removal:** This suggests the **Dysfunction** prong could not be sustained. Even if the Harm (distress) was real, the APA eventually concluded there was no underlying biological failure causing the orientation.

  **Which Account Handles Which Category?**
  *   The **Normativist** handles the **1973 category** better. It treats the distress as the primary reality, acknowledging that the "disorder" is the suffering, regardless of biological mechanism.
  *   The **Hybrid** explains the **1987 removal** best. It explains why the 1980 category was unstable: you cannot maintain a diagnosis indefinitely if the dysfunction component is empirically hollow. The Hybrid account predicts that if you remove the dysfunction, the diagnosis must eventually collapse, even if harm persists. The 1980 category was a philosophical compromise that failed because the "dysfunction" was indistinguishable from normal variation.

  ---

  ### Part 2: What the Episode Shows About the Accounts

  Running the analysis in reverse, the procedural history of the DSM change interrogates the metaphysical commitments of each account.

  #### The Vote and the Nature of Disorder
  The fact that the status of homosexuality was settled by a Board vote and a membership referendum is problematic for strict Naturalism.
  *   **Naturalist Strain:** Biological facts are not settled by majority rule. If homosexuality were a biological dysfunction akin to diabetes or blindness, a vote would be category error. The naturalist can accommodate this only by arguing the vote was a *proxy* for a shifting scientific consensus—that the membership was ratifying new data. However, historical records suggest the vote was as much about civil rights and social pressure as new biological data. If the boundary of disorder is sensitive to political pressure, it suggests the boundary is not value-free.
  *   **Normativist Strength:** The vote favors Normativism. If disorder is a judgment of harm or deviance, then a democratic or professional consensus is a valid way to settle the boundary. The procedure matches the ontology.
  *   **Hybrid Nuance:** The Hybrid account can accommodate the vote if it views the "Harm" component as the variable being voted on. The dysfunction (biological fact) remains constant, but the judgment of harm (social value) changes. The vote settled the *harm* question, not the *function* question.

  #### Weaknesses Exposed in "Species-Typical Function"
  The episode exposes a critical malleability in the Naturalist's notion of function.
  *   **Reference Class Problem:** To maintain that homosexuality is not a dysfunction, the Naturalist must fix the reference class for "sexual function" at the level of the *individual's well-being* or *social bonding* rather than *reproductive success*. This requires a teleology that is not strictly evolutionary. If the Naturalist insists on an evolutionary teleology, they are forced into the position that homosexuality *is* a dysfunction, which contradicts the DSM outcome. Thus, the episode suggests that "species-typical function" is not a brute biological fact but a theoretical construct that can be tuned to match social values.
  *   **The Silent Teleology:** The episode reveals that Naturalism often relies on an unstated normativity about what functions *ought* to be. We assume sexual arousal *ought* to facilitate reproduction. When we remove that assumption to de-pathologize homosexuality, we are making a normative choice about which biological outcomes matter.

  #### Weaknesses Exposed in Distinguishing Disorder from Social Reaction
  The episode highlights the Normativist's difficulty in separating the disorder from the reaction to it.
  *   **The 1980 Dilemma:** The "Ego-dystonic" category existed precisely to capture people distressed by their orientation. The Normativist must ask: Is the distress the disorder, or is the social stigma the problem? If the distress is severe enough to impair functioning, Normativism risks classifying it as a disorder. If it is not classified as a disorder, Normativism risks ignoring genuine suffering.
  *   **The 1987 Resolution:** By removing the category entirely, the APA implicitly decided that the distress was not a *medical* problem, but a social one. This exposes a weakness in Normativism: it lacks a clear internal criterion for distinguishing "medicalizable harm" from "socially caused harm." It must outsource this distinction to the very social values it claims to analyze.

  ### Conclusion: Where the Accounts Strain

  *   **Naturalism** strains against the **procedure**. It cannot easily explain why a biological fact required a vote. It also strains against the **teleology**. To support the removal, it must adopt a definition of "function" that is broad enough to include non-reproductive arousal, which dilutes the explanatory power of evolutionary biology.
  *   **Normativism** strains against the **distinction**. It explains the vote perfectly but struggles to explain why we do not medicalize all distress caused by social conflict. It risks collapsing the distinction between mental illness and social suffering.
  *   **Hybrid** offers the most robust mapping of the **timeline**. It explains the 1973 shift (re-evaluation of harm), the 1980 compromise (attempt to locate dysfunction), and the 1987 removal (failure to find dysfunction). However, it strains against the **1973 vote**. If the dysfunction component is value-free, it should not have been subject to the referendum. The Hybrid account must admit that the "Harm" prong drove the process, while the "Dysfunction" prong was largely ignored until it became an embarrassment in 1987.

  The episode suggests that while the *justification* for the removal was increasingly naturalistic (lack of biological dysfunction), the *mechanism* of the removal was normativist (a vote on values). No single account captures this duality without strain. The Naturalist must admit values play a role in fixing reference classes; the Normativist must admit biological constraints limit what can be valued as a disorder; the Hybrid must admit the two components can be politically decoupled.
