  *(Final thought on the "Growth of Knowledge" thesis)*: In econometrics, we usually assume the information set $\Omega_t$ grows, but we don't model the *content* of the growth. Popper says the *content* determines the future. This is a "unknown unknown" problem. I need to highlight this distinction.

