  *(Self-Correction during drafting)*: Make sure to explicitly mention "Goodhart's Law" in the Oedipus section as it's the econometric cousin. Ensure "Situational Logic" is linked to "Rational Expectations/Structural Modelling." Be precise about "Non-stationarity" – Popper isn't just saying data is non-stationary, he's saying the *structure* is.

