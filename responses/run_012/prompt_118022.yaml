      *(Self-Correction on the "Preference Condition"):* Lewis's definition involves a set of conditions. The crucial preference condition is conditional preference. "I prefer to do X if others do X." It is *not* "I prefer everyone to do X regardless." I need to make sure this distinction is clear for the "norm outliving interest" part.

      *(Self-Correction on Cafe Example):* The user worries it's "two examples" (front vs back, and old vs new people). I need to tell them it's one example of *transmission*. The "two examples" fear is unfounded if framed as "persistence over time."

      *(Final check on constraints):* "Don't explain convention to me. Plan the explanation." Okay, I will provide the *plan*, not the content itself.

      *(Wait, one more thing)*: The user asked "What am I missing?" regarding misconceptions. I should add the "Efficiency" misconception (that conventions are always good) and the "Power" misconception (that conventions are neutral, ignoring power dynamics, though Lewis doesn't focus on this, critics do). I'll stick to Lewis-internal misconceptions first. The "Efficiency" one is big for Economists.

