answer: |-
  Here is the plan for the ninety minutes. It is designed to preempt the specific disciplinary reflexes of economists and lawyers while keeping the philosophical machinery intact.

  ### 1. The Sequence (and where your instinct is wrong)

  Your instinct is close, but starting with **Regularity** is a trap. If you start with "everyone does X," the economists will say "correlation" and the lawyers will say "custom." You need the *logic* before the *observation*.

  **The Correct Order:**
  1.  **Coordination Problem:** Establish the payoff structure first. (Why do we care what others do?)
  2.  **Regularity:** The behavioral solution to that problem. (What do we actually see?)
  3.  **Expectations:** The psychological mechanism. (Why do I follow the regularity?)
  4.  **Common Knowledge:** The stability condition. (Why do I know that you know that I know?)
  5.  **Arbitrariness:** The differentiator. (Why is this not a law of nature or a moral duty?)

  **Why this order?**
  *   You cannot define the **Regularity** as a *convention* until you know it solves a **Coordination Problem**. Otherwise, it's just mass habit (e.g., everyone breathing).
  *   You cannot explain the stability of the **Regularity** without **Expectations**.
  *   You cannot explain why the **Expectations** don't collapse without **Common Knowledge**.
  *   You cannot distinguish a Convention from a Law (or a forced equilibrium) without **Arbitrariness**.

  **What you're sneaking in too early:**
  If you start with Regularity, you sneak in *stability* before you've explained *why* it's stable. If you start with Coordination, you establish the *interdependence* of preferences, which is the necessary condition for everything that follows.

  ### 2. The Example (The Cafe Diagnosis)

  **Verdict:** Use the cafe example, but you must "stress-test" it in the first 10 minutes or it will collapse into "habit."

  **The Risk:**
  Your flatmate is right to worry. If sitting in the front vs. the back makes no difference to anyone's utility *provided they get a seat*, it is a **habit**, not a convention. A convention requires that my payoff depends on *matching* your choice.

  **How to save it:**
  Frame the payoff explicitly. Ask the room: *"If I go to the front and you go to the back, do we lose something?"*
  *   **If Yes** (e.g., we can't find each other to share a table, or we split the group's critical mass for noise protection): It is a **Coordination Problem**. Use it.
  *   **If No** (e.g., we just like the back light, and don't care where others sit): It is a **Habit**. Discard it.

  **Why the Cafe works better than Roads/Phonebooks:**
  *   **Roads:** Too clean. Economists see "Nash Equilibrium" and stop thinking. Lawyers see "Statute" and get confused about enforcement.
  *   **Phonebooks:** Too abstract.
  *   **Cafe:** It allows you to model the **Drift**. You can show how the "Common Knowledge" updated when the originator left, yet the equilibrium held. This is the unique value of your example.

  **Instruction:** Draw the payoff matrix on the whiteboard for the Cafe. If you can't fill in the cells with interdependent utilities, switch to "Which side of the elevator to stand on."

  ### 3. Misconceptions (Timeline & Defusal)

  Here is the order in which objections will surface, and where to kill them.

  **1. "It's just a Habit/Custom" (Surfaces at Step 2: Regularity)**
  *   **The Objection:** "People just do it because they always have."
  *   **The Defusal:** Point to the payoff matrix. In a habit, my utility is independent of your action. In a convention, my utility crashes if I deviate *while you conform*.
  *   **Disciplinary Note:** Economists know this as "interdependence of utility." Use that phrase.

  **2. "There must be an Agreement/Contract" (Surfaces at Step 3: Expectations)**
  *   **The Objection (Lawyers):** "Without a meeting of minds or consideration, there's no obligation. This is just description, not normativity."
  *   **The Defusal:** Lewis's point is that the *expectation itself* creates the reason to act. The "obligation" is hypothetical: *If* you want to coordinate, *then* you ought to conform. It is not a moral 'ought'.
  *   **Timing:** Defuse this before you hit Common Knowledge. If they think it needs a contract, they won't understand how Common Knowledge replaces the contract.

  **3. "It's just Equilibrium Selection" (Surfaces at Step 4: Common Knowledge)**
  *   **The Objection (Economists):** "This is just a focal point in a coordination game. Why do we need 'Common Knowledge' baggage?"
  *   **The Defusal:** Equilibrium explains the *state*, Common Knowledge explains the *persistence* without communication. Without CK, one person doubting the other's rationality collapses the equilibrium. CK is the "glue" that makes the equilibrium robust to noise.
  *   **Timing:** This is your hardest battle. Acknowledge they are right (it *is* equilibrium selection) but insist CK is the mechanism that makes the selection *stick* over time without a coordinator.

  **4. "If it's Arbitrary, We Could Switch Tomorrow" (Surfaces at Step 5: Arbitrariness)**
  *   **The Objection:** "If the front room is just as good, why don't we just switch?"
  *   **The Defusal:** Because the *cost of deviation* (being the only one in the front) is higher than the *cost of sub-optimal conformity* (everyone in the noisy back). Arbitrariness refers to the *origin*, not the *exit cost*.
  *   **Timing:** Save this for the end. It leads perfectly into your conclusion about norms outliving interests.

  **Missing Misconception:**
  **"Conventions are Efficient."** Economists will assume the convention maximizes welfare.
  *   **Defusal:** Remind them of QWERTY keyboards. Conventions can lock in sub-optimal equilibria. The "norm outliving interest" is often a story about inefficiency.

  ### 4. The Ending (Norms, Preferences, and Drift)

  **The Preference Condition:**
  You need to be precise here. Lewis does **not** require that I prefer everyone to conform regardless of what I do (that's a moral norm).
  *   **Lewis's Condition:** I prefer to conform *given that* others conform. (Conditional Preference).
  *   **The Nuance:** I also prefer that *others* conform *given that* I conform. (It must be a coordination game, not Prisoner's Dilemma).
  *   **Why this matters for the Ending:** This explains why the norm survives even when the "interest" fades. Even if the back room gets noisy (interest fades), I still prefer to go there *because* you are there. The preference is relational, not absolute.

  **The Drift:**
  How does a convention change without anyone noticing?
  *   **Mechanism:** A shift in **Common Knowledge**.
  *   **Explanation:** When the originator left, the "indicator" of the convention shifted from "He sits there" to "We sit there." As long as the expectation remained common knowledge, the convention survived. If a critical mass starts sitting in the front *and everyone sees everyone else seeing it*, the CK flips, and the convention migrates.
  *   **Takeaway:** Conventions are stable, but they are not static. They ride on the flow of information.

  ### 5. The Final Question

  Do not ask "What is a convention?" Ask them to identify a **boundary case**.

  **The Question:**
  *"Describe a situation where everyone follows a regularity, everyone expects everyone else to follow it, and everyone prefers to follow it given others do... but it is **not** a Lewisian convention."*

  **The Answer you want:**
  *   **Coercion:** (e.g., Prisoners lining up for food). The regularity is driven by threat, not coordination expectations.
  *   **Natural Law:** (e.g., Everyone breathing). No arbitrariness; no alternative equilibrium existed.
  *   **Moral Obligation:** (e.g., Not murdering). I prefer you don't murder even if I do (maybe), and it's not arbitrary.

  If they can identify a case that fits the first three steps but fails **Arbitrariness** or **Coordination**, they have got it.

  ### 6. What to Announce Up Front (Scope Limitations)

  You must bound the session or you will drown. Announce these three exclusions immediately:

  1.  **The Formalism of Common Knowledge:** "We are not doing the logic of Aumann or S5 modal logic today. We are treating Common Knowledge as a sociological fact, not a mathematical proof." (Saves you from the economists trying to formalize the whiteboard).
  2.  **Language:** "Lewis applies this to language later, but today we are strictly talking about social behavior. We are not solving the problem of meaning." (Prevents semantic drift).
  3.  **Normative Force:** "We are not settling whether conventions create *moral* obligations. We are settling whether they create *pragmatic* reasons for action." (Keeps the lawyers from debating natural law).

  **Summary for the Whiteboard:**
  1.  Problem (Payoffs)
  2.  Solution (Regularity)
  3.  Glue (Expectations/CK)
  4.  Test (Arbitrariness)
  5.  Exit (Drift/Efficiency)

  Good luck. The cafe example will work if and only if you enforce the interdependence of payoffs. Don't let them treat it as a story about preference; make it a story about strategy.
