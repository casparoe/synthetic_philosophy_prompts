      *   **Parties:** Two camps.
          *   Camp 1 (Intentionalist/Partitionist): SD is real, involves intention to hide truth, divided mind.
          *   Camp 2 (Deflationary/Motivational): SD is incoherent as deception, it's just biased belief formation (wishful thinking), no intention.
      *   **Goal:** A joint statement both can sign.
      *   **Required Elements:**
          *   Agreed claims about the phenomenon (undisputed cases).
