      *   If Point 14 changes value, *you* failed.
      *   This makes the identity of the point personal/important.

  12. **Developing the Debrief:**
      *   Map: Grid $\rightarrow$ Manifold. Tokens $\rightarrow$ Metric Field. IDs $\rightarrow$ Haecceity. Swap $\rightarrow$ Diffeomorphism.
      *   Escape Routes:
          1.  Deny Indeterminism (Accept Leibniz Equivalence). Cost: Anti-substantivalism.
          2.  Accept Indeterminism (Radical Substantivalism). Cost: Physics is broken.
          3.  Deny the Swap is possible (Restrict Laws). Cost: Loses General Covariance.
      *   Underdetermination Check: Ensure they see this isn't "Theory A vs Theory B" but "Model A vs Model B within One Theory + Substantivalism."

  13. **Review against Constraints:**
      *   14 students? Yes, groups of 3-4.
      *   80 mins? Timeline looks tight but doable.
      *   No Diff Geo? Used grid/tokens.
      *   Incentive? Winning the prediction game / saving their "Deeds."
      *   "Language Game" objection? Handled by rules enforcement.

