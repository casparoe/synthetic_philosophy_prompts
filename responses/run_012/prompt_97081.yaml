      *   **Field:** Colored index cards placed on dots (e.g., "Curvature Level").
      *   **Law:** A simple rule. "Neighbors must differ by 1" or "Propagation rule." Actually, to mimic GR, we need *initial data* determining *future data*.
      *   **Simplification:** Let's use a "Growth" game. Time flows row by row. Row 1 determines Row 2, etc.
      *   **The Hole:** A specific region (say, Rows 3-5) where the "God" (Instructor) reserves the right to apply a transformation that preserves the *pattern* but shifts the *locations*.
      *   **The Commitment:** Students must write down predictions for specific *Point IDs* (e.g., "Point 13 will be Red"). If they treat points as fungible, they can't lose. If they treat them as individuals, they can be wrong despite the pattern being preserved.

  5.  **Refining the Incentive (The "Payoff"):**
      *   If they say "It's just relabeling," they shouldn't be able to win the game.
      *   Game: "The Prediction Market."
      *   Currency: Index card chips.
      *   Task: Predict the state of specific *named points* in the Hole region based on data outside the Hole.
      *   Catch: The Instructor (Nature) will apply a diffeomorphism (swap) inside the Hole that respects all local laws but changes which point holds which value.
      *   *Crucial:* If students are Substantivalists (Points are real), they lose their bets. If they are Relationists (Only structure matters), they claim a draw. The tension arises when they realize *to play the game as stated*, they had to assume Substantivalism.

  6.  **Addressing the "Underdetermination" Worry:**
      *   Underdetermination = Theory A and Theory B fit data.
      *   Hole Argument = Theory A + Substantivalism $\rightarrow$ Indeterminism.
      *   *Activity Fix:* There is only *one* set of rules (one theory). The ambiguity comes *only* from whether we count the swapped state as "different." The activity must force them to count it as different to participate, then show the cost.
      *   *Mechanism:* The bet slip requires Point IDs. "Point 14 will be Blue." If Point 14 becomes Red, but Point 15 becomes Blue (and the pattern is preserved), they lose the bet *unless* they renounce the identity of Point 14.

  7.  **Drafting the Timeline (80 mins):**
      *   0-10: Setup & Rules (No mention of Hole Argument).
      *   10-30: Phase 1 (Normal Play). Establish laws and point identity.
      *   30-50: Phase 2 (The Hole). The swap happens. Confusion/Loss.
      *   50-65: Group Deliberation (How to fix the loss?).
      *   65-80: Debrief (Mapping to Earman & Norton).

  8.  **Addressing the "Language Game" Objection:**
      *   If a student says "It's just renaming," the Instructor needs a scripted response that enforces the rules without lecturing.
      *   Response: "The rules require you to bet on Point ID #12. If #12 changes color, you lose. You can change the rules of the bet *after*, but right now, you lost." This forces the philosophical move to happen in the debrief, not as an evasion during the game.

