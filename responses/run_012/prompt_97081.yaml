      *   *Activity:* Students verify Configuration A is valid. Instructor shows Configuration B is *also* valid (locally). Students bet on which one happens at Point X.
      *   *The Kicker:* Instructor says "Both are physically possible given the past."
      *   *Wait, that's Indeterminism.* Yes, that's the goal.
      *   *Refined Plan:*
          1.  Establish Points have IDs (Substantivalism).
          2.  Establish Laws (Deterministic).
