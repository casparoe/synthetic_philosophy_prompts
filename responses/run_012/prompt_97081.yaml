      *   Activity tweak: The Instructor acts as "Nature." Nature says "I could have done either."

  15. **Final Polish:**
      *   Make the "Deed" idea central. It creates the emotional stake in point identity.
      *   Ensure the "Hole" is clearly defined.
      *   Script the "Language Game" shutdown carefully.

