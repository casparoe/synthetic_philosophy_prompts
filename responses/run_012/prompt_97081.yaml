          4.  Ask for Prediction at Point X inside Hole.
          5.  Reveal: The Law allows *two* futures that fit the past. One has Red at X, one has Blue at X.
          6.  Why? Because we can drag the field values around inside the hole without breaking the law or changing the boundary.
          7.  If Points are real individuals, these are different futures. Theory is indeterministic.
          8.  If Points are not individuals, these are the same future.

