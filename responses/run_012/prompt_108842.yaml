      *   **Topic:** Legal Philosophy (Hart vs. Fuller debate).
      *   **Position to Defend:** Fuller is right about the "inner morality" (the 8 principles of legality), but wrong about *where* it lives. These aren't conditions of *validity* (ontological status of law), but conditions on a system's *ability to guide conduct* (functional basis of authority). This preserves Hart's positivism (separation of law and morality) while acknowledging Fuller's insight, suggesting the debate was a category error.
