  The claim
  Fuller's eight principles are not ontological conditions for the existence of law, but functional prerequisites for law's claim to authority. Hart is correct that validity turns on social sources, while Fuller is correct that a system failing these principles cannot successfully guide conduct.

  The argument
  Law's primary function is to guide human conduct through norms rather than brute force. For norms to guide, agents must be able to understand them, plan around them, and comply with them. Fuller's eight principles describe the mechanics of this guidance: secret or retroactive rules cannot be followed, only suffered. Therefore, these principles are conditions of efficacy, not existence. A tyrant can issue a secret decree and enforce it with guns; Hart correctly identifies this as valid law because it stems from a recognized source of power. However, because it violates the principles of legality, it fails to function as a guide and thus forfeits any claim to moral authority. This synthesis resolves the debate by locating Fuller's morality in the sociology of compliance rather than the ontology of rules. We avoid the dangerous fiction that evil regimes lack legal systems while maintaining that their commands impose no moral duty. It preserves Hart's clear-eyed realism about power while accepting Fuller's insight that law is a purposive enterprise. The separation of validity from authority allows us to condemn a statute as morally bankrupt without denying its legal reality. Ultimately, this reveals the Hart-Fuller debate as a category error: Hart asked what law *is*, while Fuller asked what law *does*. By conflating function with existence, Fuller overreached, but by ignoring function, Hart missed the point of authority. Law claims obedience because it offers a framework for planning; when that framework collapses, the claim to obedience collapses, even if the coercive apparatus remains. This distinction protects citizens from the confusion of thinking that because a rule is legally valid, it deserves respect. It clarifies that validity is a social fact, while authority is a moral achievement. This approach respects the separability thesis while acknowledging that law is not merely a command. They were arguing on different planes: one metaphysical, one functional. By shifting Fuller's criteria to function, we save Hart's ontology.

  The strongest objection
  The objection is that this semantic splitting creates a dangerous vacuum for the citizen facing state power. If a rule is "valid law" but lacks "authority," the state retains the monopoly on violence while the citizen loses the shield of principle. Calling the tyrant's decree "law" legitimizes the institutions enforcing it, courts and police alike, even if you deny the moral obligation. It suggests that the machinery of oppression is legally sound, merely morally suspect. This risks normalizing atrocity by treating it as a bureaucratic success rather than a legal failure. If law is defined by its source rather than its character, then the Holocaust was legally perfect but morally wrong. This distinction offers no comfort to the victim punished under valid rules. It renders the concept of law inert, stripping it of the normative force that distinguishes it from banditry. You are left admitting the state acted legally while murdering you.

  Why it doesn't sink the claim
  But that inertness is the feature, not the bug. Calling it "law" forces us to acknowledge the reality of state power without granting it moral cover. If we say it's "not law," we imply the courts acted ultra vires or illegally, which they did not under that regime's rules. This confusion hinders post-regime justice and historical clarity. By admitting the rules were valid but lacked authority, we clarify that the citizens broke the law but were right to resist. It prevents the state from hiding behind legality while denying the citizen any duty to comply. This keeps the moral critique external and absolute, rather than internal and semantic. It ensures we fight the law on moral grounds, not definitional ones. We confront the horror of legal evil directly, rather than soothing ourselves with the lie that it wasn't really law.

  Bottom line
  Hart defines the skeleton, Fuller defines the heartbeat. Law exists without morality, but it cannot function without it.
