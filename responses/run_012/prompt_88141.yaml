      *   **Colleague's Critique:** Satisficing leaves value on the table. Only defensible rule is to search until marginal gain equals marginal cost (maximizing). Aspiration level is arbitrary/subjective. Search costs can be folded into utility, making satisficing just a form of maximizing (bounded rationality adds nothing).
      *   **User's Goal:** Settle the normative question. How to set aspiration level principledly? How to convert to a maximizer (or closest substitute)? What is given up by remaining a satisficer? Is the colleague right that "good enough" is always second best?
