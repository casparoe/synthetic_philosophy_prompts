answer: |-
  Your colleague has presented a compelling argument that aligns with standard neoclassical economic theory, and it is understandable why you find it difficult to resist. In the abstract model of rational choice, an agent should indeed continue to search until the marginal cost of seeking another option equals the marginal expected benefit of that search. If you could perfectly calculate the distribution of all available apartments, the probability of finding a better one, and the exact cost of your time and stress, you would simply maximize your expected utility. From this vantage point, satisficing looks like a heuristic shortcut for a calculation you were too lazy or unable to perform, and the aspiration level appears arbitrary, merely reflecting your subjective tolerance for effort rather than an objective rational standard. If the world were transparent and your cognitive powers infinite, your colleague would be entirely correct that satisficing is just maximizing with search costs folded into the utility function, and that stopping early means leaving value on the table.

  However, Herbert Simon's insight into bounded rationality was precisely that we do not inhabit that transparent world, nor do we possess infinite cognitive powers. The crucial distinction your colleague overlooks is that in complex environments like a housing market with rapid turnover, the distribution of options is unknown and unknowable. You cannot calculate the expected value of further search because you do not know the population of listings from which you are sampling. To act as a true maximizer, you would need to know the probability of finding a better unit tomorrow versus the cost of losing today's unit, but the market dynamics change faster than you can model them. Simon's point was not merely that search is costly, but that the computational burden of determining the optimal stopping point is itself a cost that often exceeds the benefit of finding the theoretical best option. Therefore, satisficing is not a concession to laziness but a robust adaptive strategy for navigating uncertainty where the maximizing calculation is impossible to perform.

  Regarding your question on how to set your aspiration level in a principled way, you should treat it not as an arbitrary percentage of an ideal, but as a reservation price based on hard constraints and market data. Instead of asking what percentage of your dream apartment you are willing to accept, determine the minimum viable option that meets your non-negotiable needs regarding budget, safety, and commute. This forms the floor of your aspiration level. You then adjust this bar upward based on the empirical data you gather during the first phase of your search. If you look at ten listings and none meet your floor, you must adjust your expectations or your budget. If you find several that clear the bar, you might raise the aspiration slightly to capture some surplus value. This makes the aspiration level dynamic and evidence-based rather than purely subjective. It is principled because it is tied to the reality of the market and your specific constraints, serving as a proxy for the unknown optimal stopping point.

  If you wish to convert yourself into a maximizer, you must accept that true maximization is unattainable in this context, but you can adopt the closest mathematical substitute, which is an optimal stopping rule derived from the secretary problem. This would involve rejecting the first thirty-seven percent of the options you encounter to establish a baseline and then selecting the next option that beats all previous ones. However, this strategy assumes you cannot recall previous options, which is not true in housing, and it requires a known number of total options, which you also lack. By attempting to follow this or any maximizing rule, you should expect to give up mental tranquility and time. The pursuit of the absolute best often leads to decision paralysis and post-decision regret, as you will constantly wonder about the unchosen paths. The satisficer, by contrast, trades the slim possibility of a marginally better apartment for the certainty of securing a good home and preserving cognitive resources for other parts of life.

  Ultimately, your colleague is right that good enough is technically second best to the best, but she is wrong to imply that the best is a reachable destination. In a world of bounded rationality, the best is often a mirage that recedes as you approach it. The value you leave on the table by satisficing is hypothetical, whereas the cost of searching for it is real and immediate. By committing to satisficing, you are not accepting irrationality; you are acknowledging that rationality must be tailored to the structure of the environment. You should set your aspiration level based on concrete needs and early market data, accept that you will not find the perfect apartment, and recognize that securing a good home quickly allows you to maximize your utility in the broader context of your life, rather than just within the narrow frame of the housing search.
