answer: |-
  # Joint Statement on the Identifiability of Agent Objectives

  **Signatories:** The Recovery Optimists & The Underdetermination Skeptics  
  **Date:** October 26, 2023  
  **Subject:** Clarifying the Scope, Limits, and Semantics of Inverse Reinforcement Learning

  ## 1. Agreed Claims

  We, the undersigned, acknowledge a shared commitment to understanding the relationship between agent behavior and agent objectives. While we diverge on the interpretability and recoverability of these objectives, we agree on the following foundational claims:

  1.  **The Formal Setup:** The problem is standardly framed within the Markov Decision Process (MDP) formalism. An agent operates in a state space $S$ via actions $A$ under transition dynamics $T$. The agent's behavior is modeled as a policy $\pi$. The objective of Inverse Reinforcement Learning (IRL) is to infer a reward function $R$ (or equivalent preference structure) from observed trajectories $\mathcal{D} = \{\tau_1, \dots, \tau_N\}$ generated by $\pi$.
  2.  **Mathematical Non-Uniqueness (Potential Shaping):** We agree that for any reward function $R$ and discount factor $\gamma$, the transformed reward $R'(s, a, s') = R(s, a, s') + \gamma \Phi(s') - \Phi(s)$ yields the exact same set of optimal policies for any potential function $\Phi$. Consequently, behavioral data consisting solely of optimal trajectories cannot distinguish between $R$ and any of its potential-shaped variants.
  3.  **Mathematical Non-Uniqueness (Rationality Scale):** We agree that when the agent is modeled as a noisy optimizer (e.g., Boltzmann rationality where $P(a|s) \propto e^{\beta Q(s,a)}$), the reward scale and the rationality parameter $\beta$ are observationally equivalent. Multiplying $R$ by a constant $k$ and dividing $\beta$ by $k$ leaves the likelihood of the data unchanged. The data fix at most the product $\beta R$, not the components individually.
  4.  **Distinction Between Representation and Content:** We agree that a distinction exists between (a) the mathematical object recovered by an algorithm (a vector of weights, a reward function up to equivalence class) and (b) the semantic content attributed to that object (what the agent "wants," "values," or "would choose counterfactually").
  5.  **Criteria for Progress:** Genuine progress requires either:
      *   (a) A mathematical proof that additional constraints (e.g., sparsity, specific priors, multi-environment data) render the reward function uniquely identifiable within a specified error bound; or
      *   (b) A philosophical clarification demonstrating that the non-uniqueness results do not impede the practical utility of the recovered object for the intended application (e.g., imitation, alignment, prediction).

  ## 2. Disagreements Table

  The following table enumerates the surviving disagreements. For each crux, we specify a test case or construction agreed to be relevant, and record the distinct predictions or interpretations offered by each camp.

  | Crux | Formulation (Optimist) | Formulation (Skeptic) | Agreed Test Case / Construction | Optimist Prediction | Skeptic Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Ontology of Preference** | Preference is identified with stable choice dispositions. If two reward functions generate identical choice probabilities across all reachable states, they represent the same preference. | Preference includes counterfactual content (what the agent would want in unobserved states) and mental state content. Identical choices can stem from distinct underlying valuations. | **The "Unreachable State" Construction:** An MDP where a specific state $s^*$ is never visited in $\mathcal{D}$, but $R$ assigns it high positive value while $R'$ assigns it high negative value. Both yield identical $\pi$ on observed data. | **Irrelevant.** The value of $s^*$ is undefined until visited. The preference *is* the disposition to act in reachable states. Recovering $R(s^*)$ is ill-posed and unnecessary. | **Substantive Failure.** A true objective function must generalize. If the recovered $R$ fails to predict behavior upon entering $s^*$ (e.g., via distribution shift), the objective was not recovered, only overfit. |
  | **2. Significance of Potential Shaping** | Potential shaping is a "gauge freedom." Just as adding a constant to utility in economics does not change preference ordering, adding a potential difference does not change the objective. The *objective* is the equivalence class $[R]$. | Potential shaping changes the ranking of *sub-optimal* trajectories. Since real agents are not perfectly optimal, the recovered $R$ will guide exploration or error-correction differently depending on $\Phi$. | **The "Sub-Optimal Path" Comparison:** A gridworld where the optimal path is blocked. Compare $R$ vs. $R'$ (shaped) in predicting which sub-optimal path a bounded agent takes when forced off the optimal trajectory. | **Calibration Issue.** With enough data on sub-optimal moves, the specific $\Phi$ can be identified or regularized away. The core objective remains recoverable. | **Fundamental Ambiguity.** The data does not contain information to select $\Phi$. Any choice of $\Phi$ is an assumption imposed by the observer, not recovered from the agent. |
  | **3. Significance of Scale-Rationality** | The trade-off is a normalization problem. We can fix $\beta=1$ or $\max(R)=1$ without loss of generality for the purpose of policy extraction. | The trade-off conflates *intensity of preference* with *competence*. A high $\beta$, low $R$ agent cares little but acts precisely; a low $\beta$, high $R$ agent cares deeply but acts noisily. | **The "Risk Sensitivity" Scenario:** An agent chooses between a sure reward of 1 and a 50% chance of reward 3. Vary $\beta$ and Scale to fit the same choice frequency. | **Irrelevant.** For imitation learning, only the resulting policy probabilities matter. The internal scale is implementation detail. | **Substantive Failure.** For alignment, intensity matters. We need to know if the agent is willing to suffer costs to achieve the goal. Scale determines trade-offs between competing objectives. |

  ## 3. Analysis of Verbal vs. Substantive Disputes

  We explicitly recognize that a portion of our disagreement is verbal, stemming from divergent definitions of the term **"Preference."**

  ### 3.1 The Verbal Component
  *   **Optimist Reading (Preference-Behavioral):** "Preference" refers to the *revealed disposition to choose*. On this reading, if two reward functions generate the same policy $\pi(a|s)$ for all $s$ in the support of the data, the preferences are identical.
  *   **Skeptic Reading (Preference-Mental):** "Preference" refers to the *latent utility function* that causally generates behavior, including counterfactual choices in novel environments or under perturbation. On this reading, two reward functions generating the same $\pi$ on training data but diverging elsewhere represent distinct preferences.

  **Resolution of Verbal Dispute:**
  If we adopt the **Preference-Behavioral** reading:
  *   **Claim 1 (Ontology)** becomes an agreement. The Optimist view holds.
  *   **Claim 2 (Potential Shaping)** becomes largely agreed, provided we restrict attention to optimal policies.
  *   **Claim 3 (Scale-Rationality)** becomes agreed for the purpose of imitation, but remains substantive for welfare analysis.

  If we adopt the **Preference-Mental** reading:
  *   **Claim 1 (Ontology)** remains a substantive disagreement. The Skeptic view holds that behavior underdetermines the mental state.
  *   **Claim 2 & 3** remain substantive disagreements regarding identifiability.

  ### 3.2 The Substantive Component
  Even after disambiguating "preference," a substantive dispute remains regarding **Generalization and Bias.**

  *   **The Core Substantive Dispute:** Can we recover a reward function that generalizes to new environments ($S_{new}$) using only data from old environments ($S_{old}$), given that the demonstrator is bounded and biased?
  *   **Optimist Position:** Yes. Biases are systematic and can be modeled (e.g., via hyper-rationality priors or cognitive models). With sufficiently rich data across varied contexts, the latent reward is identifiable up to trivial transformations.
  *   **Skeptic Position:** No. Biases (e.g., myopia, framing effects) are structurally indistinguishable from genuine preferences without access to the agent's internal cognitive architecture or normative judgments. No quantity of behavioral data from $S_{old}$ guarantees correctness in $S_{new}$ because the mapping from Mental Preference to Behavior is not injective.

  ## 4. Commitment to Future Inquiry

  We agree that further argument is futile without addressing the specific cruxes identified above. We commit to evaluating future research based on whether it:
  1.  Explicitly states which reading of "Preference" (Behavioral vs. Mental) is being targeted.
  2.  Acknowledges the Potential Shaping and Scale-Rationality theorems not as nuisances, but as boundary conditions on the recovery claim.
  3.  Provides empirical evidence on the **Sub-Optimal Path** and **Unreachable State** constructions to test whether recovered objectives generalize beyond the training distribution.

  ***

  **Signed,**

  *The Recovery Optimists*  
  *The Underdetermination Skeptics*
