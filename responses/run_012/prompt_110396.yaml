answer: |-
  **The Case: The Dune Mole Colonies**

  The Dune Mole is a subterranean rodent living in fixed colonies separated by barren salt flats. Each colony maintains a specific "Ventilation Protocol": either all members dig surface shafts to aerate the nest, or none do. Digging is genuinely costly; telemetry shows individuals in digging colonies spend forty percent more time exposed on the surface and suffer double the predation rate from hawks compared to individuals in non-digging colonies. Consequently, the individual reproductive output in digging colonies is significantly lower than in non-digging colonies, as fewer adults survive to breed. However, during seasonal heatwaves, non-digging colonies suffer total suffocation and extinction, while digging colonies survive due to airflow.

  Transmission of the protocol is purely cultural. At weaning, pups are randomly redistributed among nests within their native colony, erasing any genetic link between parent and offspring behavior; a pup born to digging parents but raised in a non-digging colony will not dig. When a colony survives a heatwave and grows large enough, it fissions, sending a cohort to establish a new colony. This new colony replicates the parent colony's protocol with high fidelity. Over time, the proportion of digging colonies in the metapopulation increases, even though the individuals within them die younger than those in non-digging colonies.

  **(a) Verdicts of the Three Frameworks**

  *   **Gene's-Eye View:** This framework predicts the behavior will **decay**. It argues that selection acts on genetic replicators. Since the behavior is not encoded in the genes (heritability within groups is zero) and reduces the survival of the vehicle (the individual mole) carrying the current gene pool, the genes associated with digging individuals are removed from the population faster than those in non-digging colonies. Because there is no specific "digging gene" being favored, and the behavior lowers the reproductive success of the individuals housing the genes, the gene's-eye account expects the trait to vanish as the lines carrying it are out-reproduced by safer lines.
  *   **Individual-as-Unit View:** This framework predicts the behavior will **decay**. It calculates fitness based on individual survival and reproduction. Since diggers die at twice the rate of non-diggers and produce fewer offspring, natural selection acting on individuals should favor any mutation or variation that stops the behavior. Because the cost is borne entirely by the actor and the benefit is shared by the group, the individual-level account sees this as altruism without genetic relatedness to compensate, leading to the elimination of the trait.
  *   **Group-as-Unit View:** This framework predicts the behavior will **spread**. It treats the colony as the unit of selection. Variation between groups is high (all vs. none), while variation within groups is zero. Groups with the trait have a much higher survival rate during heatwaves and subsequently fission more often than groups without it. Therefore, the frequency of the trait increases in the total population because groups possessing it out-reproduce groups lacking it, overriding the within-group disadvantage.

  **(b) The Feature Doing the Work**

  The single feature driving the divergence in verdicts is the **decoupling of phenotypic transmission from genetic reproduction**. The behavior is inherited through group continuity (cultural fission) rather than through individual genetic lineage. This creates a scenario where the entity that survives and replicates (the group) is distinct from the entity that pays the cost and carries the genes (the individual).

  **(c) The Reversed Case**

  Restated with the feature reversed: Suppose the Ventilation Protocol is genetically determined with high heritability within groups, such that offspring inherit the digging tendency from their parents, and colonies are composed of close kin. In this scenario, all three frameworks converge on the verdict that the behavior will **spread**. The Gene's-Eye and Individual views now account for the persistence via kin selection: the cost to the individual is offset by the survival of shared genes in relatives within the colony. The Group view also predicts spread. The case collapses into a situation where the three frameworks are merely keeping the same books, using different mathematical partitions to describe the same genetic advantage.

  **(d) The Attack and Defense**

  A defender of the Gene's-Eye view would attack the original case by arguing that **this is not biological evolution**. They would claim that because the behavior is not encoded in DNA, its spread is merely ecological dynamics or cultural drift, not natural selection. The strongest version of this attack asserts that selection is actually acting on the *capacity to learn*, which is genetic, not on the digging behavior itself. The case survives this attack only if we define evolution broadly as "change in the frequency of heritable traits" regardless of the substrate (gene or culture). If we insist evolution must be genetic, the Gene's-Eye verdict stands correct (no genetic evolution occurred), but the Group verdict remains correct regarding the phenotypic outcome (the behavior spread). The disagreement remains substantive regarding what drives the change in the population's phenotype.

  **(e) Final Verdict**

  This case shows what you want it to show: the disagreement is substantive. The Gene's-Eye and Individual frameworks predict the disappearance of the behavior based on individual fitness costs and lack of genetic heritability, while the Group framework predicts its persistence based on differential group survival. The prediction diverges because the inheritance channel (group vs. individual) changes which entity replicates. The case would fail if the group structure correlated perfectly with genetic relatedness (kin selection), as this would allow the Gene's-Eye view to explain the result via indirect genetic benefits, rendering the frameworks mathematically equivalent descriptions of the same process.
