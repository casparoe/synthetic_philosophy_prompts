answer: |-
  0.15

  ### Reasoning and Decomposition

  You have spent thirty-six years building instruments that force nature to speak. Philosophy often tries to speak for nature without the apparatus. Your skepticism is a form of data.

  My credence of **0.15** reflects the view that while logical space allows for permanent underdetermination, the history of mature science suggests that apparent equivalence is usually a symptom of incomplete instrumentation or imprecise theory individuation, not a feature of the world. The number is low because condition (b)—substantive difference about the unobservable—is the filter that catches almost all candidates.

  Here is the decomposition of that number into the sub-questions you requested. I have treated these as conditional probabilities contributing to the final estimate.

  | Sub-question | Probability | Justification |
  | :--- | :--- | :--- |
  | **1. Coherence:** Can Empirical Equivalence (EE) be defined without triviality? | 0.90 | It is logically coherent to define two theories as EE if they map all possible observation sentences to identical truth values. The danger is triviality (e.g., "T1 & T2" vs "T1"), but formal semantics can exclude this. |
  | **2. Idealization:** Must EE be defined against an ideal reasoner, not finite agents? | 0.85 | If we relativize to finite agents (human scientists), EE becomes rampant due to computational limits. To satisfy your condition (b) (claims about the *world*), we must define EE relative to what is *in principle* observable, not what is practically computable. |
  | **3. Existence:** Does any historical case survive scrutiny as permanent? | 0.25 | Most historical cases (e.g., Ptolemy/Copernicus pre-parallax, Lorentz/Einstein pre-1905) were temporary. The only mature candidate is Quantum Mechanics interpretations (Bohm vs. Copenhagen vs. Many Worlds), and even there, the "equivalence" is debated. |
  | **4. Individuation:** Does holism/meaning-shift collapse the substantive difference? | 0.60 | If meaning is determined by use (or empirical role), two EE theories might mean the same thing by definition. However, a realist stance (which your instrument-building implies) allows that terms can refer to distinct unobservables even if effects are identical. |
  | **5. Usability:** Does the "tractability" case count as underdetermination? | 0.10 | (See detailed section below). If a difference is *only* computational difficulty, it fails condition (b). It is a difference in *access*, not ontology. |

  **Calculation Logic:**
  The final number is not a strict product (which would yield $\approx 0.01$), but a weighted assessment. The high coherence (0.9) and idealization (0.85) scores establish that the *concept* works. The bottleneck is **Existence (0.25)**. Even if the concept works, nature may not instantiate it. I adjust the raw product upward slightly because the Quantum Mechanics case is robust enough to prevent the probability from going to zero.
  $0.25 \times 0.60 \approx 0.15$.

  **Sensitivity:**
  My number is most sensitive to **Sub-question 3 (Existence)**. If you believe Bohmian Mechanics is genuinely distinct from Standard QM and permanently equivalent, my number rises to 0.6. If you believe a future experiment could distinguish them (e.g., via non-equilibrium distributions), my number drops to 0.05.

  ---

  ### The Usability and Tractability Question

  You asked: *Suppose two formulations yield the same predictions but differ sharply in hardness. One is a page of algebra; the other is intractable. No evidence bears on the choice. They are not notational variants. Should that count as underdetermination?*

  **My Answer:** No, this does not count toward the proposition you posed, and acknowledging this keeps my number low.

  **Reasoning:**
  Your proposition requires condition (b): *T1 and T2 differ substantively in what they claim about the parts of the world we cannot observe.*

  1.  **Ontology vs. Epistemology:** Computational tractability is an epistemic property (about our relationship to the theory), not an ontological one (about the world). If T1 and T2 posit the *same* entities and laws, but T2 is written in a coordinate system that makes integration impossible, they are not distinct theories about the world; they are distinct *tools*.
  2.  **The "Unicorn" Exception:** The only way a tractability difference satisfies (b) is if the intractability arises from *extra ontology*. For example, T1 says "particles move on paths." T2 says "particles move on paths + invisible ghosts nudge them such that the net effect is zero." T2 is intractable (you must calculate the ghost nudges to cancel them). T2 differs substantively about the unobservable (ghosts exist).
      *   In this specific "ghost" case, it *is* underdetermination.
      *   However, in your description ("returns an answer... in a page of algebra" vs "intractable"), this sounds like a difference in *formulation efficiency*, not hidden ontology.
  3.  **Your Instinct:** You wrote: *"My own instinct is that a theory's being unusable is not a fact about the world."*
      *   This instinct is doing **philosophical work**, not merely autobiographical work. It correctly identifies that underdetermination of *theory* requires underdetermination of *truth conditions*, not just derivation conditions.
      *   If we counted tractability differences as "theory underdetermination," the proposition would be trivially true (probability $\approx 0.95$), because we can always construct an inefficient algorithm for any physical law. That would drain the proposition of its metaphysical weight.

  **Impact on the Number:**
  If I counted the "tractability only" case as satisfying your proposition, my credence would jump from **0.15 to 0.90**. The fact that it does not move my number is because I agree with your exclusion of it based on clause (b).

  ---

  ### Disagreement with Your 0.2

  Your credence is 0.2; mine is 0.15. This is a minor disagreement, but since you asked where the disagreement lives:

  1.  **The Status of Quantum Interpretations:** You likely assign a slightly higher probability than I do that the rival interpretations of Quantum Mechanics (e.g., Pilot Wave vs. Copenhagen) are *permanently* empirically equivalent. I assign a non-zero probability that a future "instrument-building" breakthrough (perhaps in quantum gravity or non-equilibrium QM) could break the equivalence. You have retired from the bench; I suspect you may weigh the current impasse more heavily than the potential for future instrumentation.
  2.  **Theory Individuation:** You may be more willing than I am to grant "substantive difference" to theories that share all empirical consequences. I lean towards the view that if two theories share *all* possible empirical consequences, the claim that they differ "about the world" is metaphysical speculation rather than scientific theory.

  **Summary:**
  We agree on the structure of the problem. We agree that usability differences do not count as ontological differences. We disagree slightly on whether the current stalemate in Quantum Foundations is a permanent feature of nature or a temporary limitation of our "instruments" (broadly construed). I bet on the instruments improving; you bet on the stalemate holding. That 5% difference is the gap between 0.15 and 0.2.
