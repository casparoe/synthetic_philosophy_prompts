  **ON THE PHYSIOLOGY OF NOON AND THE CRIME OF BEER

  **Morning. I wake in Turin, where the light is clear enough to cut glass. My first act is not prayer, but hydration. Water, nothing else. The English and the Germans poison themselves with tea and coffee to stimulate nerves already frayed by their damp climates. This is a declining habit. To require a stimulant to face the morning is to admit one is already exhausted by existence. I drink water. It is neutral. It does not lie. Rating: Ascending.

  Midday. This is the main event. A philosopher does not feast; he refuels. I consume a small portion of Italian pasta, dressed simply with oil. There is no heaviness. Compare this to the German table, where one finds dumplings and fatty meats that sit in the stomach like lead coffins. Such cuisine is not merely unhealthy; it is a moral failing. It breeds a spirit of gravity, of resentment against the lightness of being. To eat heavily is to vote for a world that is slow, dull, and German. I reject the Sauerbraten. I reject the beer. Alcohol is a crime against the spirit, a chemical lie that promises warmth but delivers only fog. Rating: Ascending for the pasta. Declining for anything that requires a nap.

  Evening. I eat little. Perhaps some fruit. The body must rest to digest, and the spirit must rest to dream. Those who gorge themselves at night are fleeing the silence of their own thoughts. They seek to fill the void with meat. I prefer the void.

  You ask for a rule. The modern tendency is to moralize food, to categorize ingredients as virtuous or sinful. This is the logic of the priest, not the physician. It is *ressentiment* against one's own appetite. Do not eat lightly because you feel guilty. Eat lightly because heaviness is for those who cannot carry their own destiny. A heavy meal is a burden on the intellect; it forces the blood to the stomach and away from the brain. How can one think dangerous thoughts with a stomach full of pork?

  Climate matters. You cannot think Mediterranean thoughts on a diet of Northern fog and lard. Physiology is destiny. If your food makes you sluggish, it is not nourishing you; it is sedating you. It is a narcotic for those who cannot bear the intensity of life.

  Here is the only advice worth following: Do not ask if a food is good. Ask if it permits you to say Yes. Digestion is not merely a biological process; it is the act of deciding what becomes part of you and what must be expelled. To choose your food is to choose your future. Chew thoroughly. Not for the sake of the stomach, but for the sake of the thought. One must be able to digest hard truths, and one cannot do that if one cannot even digest a crust of bread.
