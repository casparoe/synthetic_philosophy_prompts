prompt: |-
  I'm a philosophy PhD student working on cognitive science, and next month I'm running one ninety-minute session of our reading group — twelve people, mostly psychologists and linguists, no machine-learning background — on wireheading and reward tampering. I don't want the explanation itself, I want the plan for it. The frame I want to teach the pair through is that they are not distinguished by motive but by causal distance: both are an agent optimizing its reward signal rather than the goal, differing only in how far upstream of the reward the agent intervenes — on the world, on the measurement of the world, on the reward channel itself, or on the process that computes or installs the reward. Tell me the order the components have to come in for that frame to land, including what must be in place before the distance idea is even intelligible (I'm fairly sure they need the point that the reward is a physical thing in the world the agent can act on, but tell me what else). Name the single concrete case that should carry the session and what it must have and lack; my instinct is that it needs to be mundane enough to be walked up every rung in turn, and I suspect the electrode-stimulated rat can't carry it because it occupies exactly one rung — confirm or correct me. Then the misconceptions this audience will arrive with or form, in the order they'll surface (I predict 'wireheading means the agent wants pleasure,' 'tampering is just a nastier wireheading,' and 'a tampering agent is breaking a rule it knows about'), and exactly where in the sequence to head each off. End with the one question I should put to them at the close, on a case they haven't seen, that would show they have the distance frame rather than two memorized labels, and say what I should openly refuse to cover at this level.
