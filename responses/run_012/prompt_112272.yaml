      *   **Accuracy:** The user characterizes the "Will" vs. "Present Self" debate reasonably well for a non-philosopher. It maps roughly to Precedent Autonomy vs. Current Interests. The "contract" analogy is a fair strawman of how people *feel* about it, even if philosophers nuance it more. No major mischaracterizations that break the argument.
