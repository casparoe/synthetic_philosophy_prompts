      *   **Circularity:** The two-key rule is slightly circular. Key 2 (owning past self) effectively filters out the very people whose ADs we worry about overriding (dementia). If you don't own your past self, you can't override. But if you don't own your past self, you are likely the exact case where the AD might be wrong (e.g., religious conversion vs. dementia). However, the circularity might be *feature, not bug* if the goal is narrative unity. To fix: Shift from "ownership" to "recognizability." Can observers trace a line?
      *   **Counterexample:** Case B (Holder + Discontinuous). Example: Religious conversion. A person writes an AD saying "no blood transfusions." They develop dementia, lose memory of their past religious commitment, but remain happy and request life-saving treatment involving blood. Under the "fallback view," if they are "in the game" (Case A/B), the directive is a default. But if they don't "own their past self" (Key 2), the directive stands. This conflicts with the "fallback" analogy because a config file *should* be overrideable by the running service. If the service is running but doesn't recognize the old config's author, why trust the old config? The counterexample is: *Temporary incapacitation with value change.* E.g., Severe depression (caused by chemical imbalance) leading to a DNR request, overriding a previous "save me at all costs" AD. Here the later self is "in the game" but the values are distorted. The fallback view says "run config if not in game." But they *are* in the game. So do we follow the depressed preference or the AD? The essay says AD stands if Key 2 fails. But if the depression lifts, they might regret it. This breaks the "fallback" analogy because the service *is* running, just with corrupted RAM.
