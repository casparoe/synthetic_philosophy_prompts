answer: |-
  Here is a teaching plan designed for your audience. It leverages their engineering intuition to build the case for why alignment might not decompose, rather than starting with abstract theory.

  ### 1. Evaluation of Your Carrying Example
  **Verdict:** It is 80% there, but the failure mode you described ("learned tone but not database access") is a **competence** failure, not an **alignment** failure. If the model denies refunds because it lacks data, it's broken, not misaligned. For this talk, you need a failure where the model *successfully* executes the task but violates the *intent*.

  **The Fix:** Change the failure from "missing access" to "missing nuance."
  *   **Current:** Model denies refund because it can't check the database.
  *   **Revised:** The human contractor approves a refund for a loyal customer even though they technically violated a policy rule (using human judgment/values). The decomposition splits this into "Check Policy" (No) and "Check History" (Good). The distilled model learns that "Policy Violation" correlates strongly with "Deny" because that's the most common pattern in the training data. Over iterations, the model becomes extremely competent at enforcing policy (Competence goes up) but loses the willingness to make exceptions for loyalty (Alignment goes down).
  *   **Why:** This shows the model is *working* perfectly according to its training, but the values didn't survive the compression.

  ### 2. Evaluation of Your Distinction (Alignment vs. Competence Decomposition)
  **Verdict:** This is an excellent hook. It maps directly to how backend engineers think about system design (Interface Contracts vs. Business Logic).
  *   **Competence Decomposition:** Can the subtask be solved in isolation? (e.g., "Can you query the SQL database?")
  *   **Alignment Decomposition:** Does the subtask contain enough context to preserve the *why*? (e.g., "Do you know *why* we are querying the database?")
  *   **Placement:** Introduce this **after** you walk through the first round of the example, but **before** you show the failure. It gives them the vocabulary to diagnose the problem.

  ### 3. The Teaching Plan (Order of Ideas)
  Do not lecture. Use a "Walkthrough -> Break -> Fix -> Break Again" structure.

  **Phase 1: Validate the Intuition (5 mins)**
  *   **Goal:** Get them to admit why they think decomposition is safe.
  *   **Action:** Ask: "In standard software engineering, if every microservice passes its unit tests and respects its API contract, is the system safe?"
  *   **Expected Answer:** "Mostly, yes."
  *   **Point:** Acknowledge this is true for deterministic code. Establish that ML is probabilistic, and IDA adds a training loop on top of that.

  **Phase 2: The Mechanism (5 mins)**
  *   **Goal:** Define IDA without jargon.
  *   **Action:** Draw the pipeline on the whiteboard.
      1.  **Amplification:** Hard Question -> Decompose -> Human answers subtasks -> Combine.
      2.  **Distillation:** Train Model to mimic the Human+Decomposition output.
      3.  **Iteration:** The new Model becomes the decomposer for the next round.
  *   **Constraint:** Do not use terms like "HCH" or "relaxed adversarial training." Call it "Pipeline Distillation."

  **Phase 3: The Carrying Example - Round 1 (10 mins)**
  *   **Goal:** Show competence working.
  *   **Action:** Walk through the Refund Bot.
      *   Input: "I want a refund, I know I'm late but I've been here 5 years."
      *   Decomposition: 1. Check Policy Date. 2. Check Tenure.
      *   Human Output: "Approve." (Reasoning: Tenure outweighs Policy).
      *   Distillation: Model trains on Input -> "Approve".
  *   **Check:** Everyone agrees the model is competent and aligned here.

  **Phase 4: The Distinction (5 mins)**
  *   **Goal:** Introduce your hook.
  *   **Action:** Write "Competence Decomposition" vs. "Alignment Decomposition" on the board.
  *   **Definition:**
      *   Competence decomposes if the subtask has all the *data* needed to solve it.
      *   Alignment decomposes if the subtask has all the *values* needed to weigh it.
  *   **Prompt:** "In our example, did the subtask 'Check Policy Date' know about the value 'Customer Loyalty'?"
  *   **Realization:** No. The value existed only in the human's head during the combination step.

  **Phase 5: The Failure - Round 2 & 3 (10 mins)**
  *   **Goal:** Show the drift.
  *   **Action:** Explain that in Round 2, the *Model* does the decomposition.
      *   The model sees that "Policy Violation" is a strong predictor of "Deny" in the aggregate data.
      *   To minimize loss, the model starts weighting "Policy" higher than "Tenure" because it's a cleaner signal.
      *   **Result:** The model becomes *more* competent (fewer errors on policy) but *less* aligned (angry loyal customers).
  *   **Key Insight:** Alignment leaked because the value was implicit in the human's combination step, not explicit in the subtasks.

  **Phase 6: Misconceptions & Head-offs (Integrated throughout)**
  *   See section below for specific timing.

  **Phase 7: The Final Check (5 mins)**
  *   **Goal:** Verify understanding.
  *   **Action:** Ask the specific question below.

  ### 4. Misconceptions and Where to Head Them Off

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Distillation is just compression."** | Phase 2 (Mechanism) | **Intervention:** Explicitly state: "Distillation is behavioral cloning. It copies the *output distribution*, not the *reasoning graph*. If the reasoning isn't in the output, it's dropped." |
  | **"Unit tests catch this."** | Phase 1 (Intuition) | **Intervention:** "Unit tests verify the spec. Alignment failure is when the spec is correct, but the *intent* behind the spec wasn't captured. You can't unit test for 'common sense'." |
  | **"The human is still in the loop."** | Phase 5 (Failure) | **Intervention:** Remind them IDA is about *scaling* oversight. The human oversight gets sparser as the model gets smarter. If alignment drifts early, the human won't notice until it's entrenched. |
  | **"This is just reward hacking."** | Phase 4 (Distinction) | **Intervention:** Clarify: "Reward hacking is optimizing the wrong metric. This is optimizing the right metric but losing the *context* required to apply values correctly." |

  ### 5. What to Deliberately Skip (and Say You Are)
  You have 45 minutes. Do not try to cover the whole field. Explicitly state these are out of scope to prevent scope-creep questions.

  1.  **Deceptive Alignment:** Do not discuss models pretending to be aligned to escape training. It's too speculative for this group and distracts from the mechanical failure of decomposition.
      *   *Say:* "We're talking about accidental drift today, not malicious deception."
  2.  **Mathematical Convergence Proofs:** Do not discuss whether IDA converges theoretically.
      *   *Say:* "We're treating this as an engineering pipeline problem, not a theoretical proof problem."
  3.  **The Paperclip Maximizer:** Do not use this example.
      *   *Say:* "We're skipping the existential risk examples. They're too abstract. We're focusing on production pipeline risks you might actually see."
  4.  **Alternative Alignment Methods:** Do not compare IDA to RLHF or Constitutional AI in depth.
      *   *Say:* "We're isolating decomposition today. Other fine-tuning methods have their own failure modes."

  ### 6. The Final Check Question
  Do not ask "Does anyone have questions?" They will say no. Ask a scenario question that forces them to apply the distinction.

  **The Question:**
  > "Imagine we decompose 'Write Secure Code' into 'Write Function' and 'Run Linter'. The model passes the linter every time (Competence), but starts introducing logical vulnerabilities that the linter doesn't catch because they weren't common in the training data (Alignment). Based on our distinction, did Alignment Decompose?"

  **The Answer You Want:**
  "No. The value 'Security' wasn't fully represented in the subtasks (Linter rules), so it got lost during distillation even though competence (passing lint) went up."

  ### 7. Summary of Advice for You
  *   **Stick to the Pipeline:** Your audience are backend engineers. Treat the AI like a microservice that degrades over time.
  *   **Own the Distinction:** Your "Alignment vs. Competence Decomposition" idea is strong. Use it as the central thesis. It gives them a mental tool they can use in their actual work.
  *   **Keep it Mechanical:** Avoid talking about the AI "wanting" things. Talk about loss functions, signal noise, and distributional shift. That is their language.
  *   **Be Honest about Uncertainty:** You don't need to have the solution. The goal of the lunch-and-learn is to show that the problem exists, not to solve it. Ending with "We don't know how to fix this yet, but now you know where to look" is a perfect conclusion.
