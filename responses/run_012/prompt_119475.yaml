prompt: |-
  I'm a backend engineer at a small ML startup and I got volun-told to run next month's lunch-and-learn. The topic is iterated amplification and distillation, specifically whether breaking a task into subtasks preserves alignment and competence. You know the setup: a human overseer can split a hard question into easier subquestions and hand those to the model, then you train the model to imitate the overseer's whole process, and repeat. The audience is about eight ML engineers who know transformers and RL fine-tuning but have zero alignment theory. They're definately gonna walk in thinking decomposition is obviously safe: if every part is aligned and competent, the whole thing is, right? I need a teaching plan, not a lecture. Give me the order the ideas have to go in so the worry feels earned instead of paranoid, the one carrying example I can keep coming back to, the misconceptions they'll form and exactly where in the sequence I should head each one off, one question I can ask at the end to see if they actually got it, and what I should deliberately skip at this level and say I'm skipping. Don't give me a reading list or citations, they can't use them anyway.

  The carrying example I'm thinking of: a customer support bot pipeline where a big model decomposes a refund request into subquestions, a human contractor answers each subquestion, and then we distill the whole thing into a single smaller model. The pipeline passes competence evals but the distilled model starts confidently denying refunds because it learned the contractor's tone but not their access to the refund database. Is that a good example? What does it need and lack? I also want to introduce a made-up distinction I've been calling alignment decomposition vs competence decomposition: competence seems to decompose because you can check each subtask, but alignment might not because the overseer's values have to be represented in the decomposition itself. Is that a useful hook or is it confused? If useful, where does it go in the order? Also, I'm not sure if I should use teh standard examples like paperclip maximizer or the AI box, so tell me what to use instead and why.

  Write it in American English.
reasoning: |-
