answer: |-
  Here is a specification of the desiderata for social explanation, designed to cut through the individualism/holism stalemate. This is structured for use in your seminar notes.

  ### Part 1: The Desiderata (Requirements for Adequate Explanation)

  An adequate theory of social explanation must satisfy the following five requirements. If a theory fails one, it is either mystifying, trivial, or useless for intervention.

  **1. The Grounding Requirement (Ontological Consistency)**
  *   **Definition:** Social explanations must acknowledge that social phenomena ultimately depend on the existence and activities of individuals. There are no "free-floating" social spirits.
  *   **Why it's required:** Without this, explanation slips into mysticism (e.g., "The Market decided" as if the Market were a god).
  *   **Case Application:** A **constitution** persists across generations, but only because new individuals are socialized into it or enforce it. If every human vanished, the constitution would cease to exist.
  *   **Failure Mode:** Reification (treating an abstract concept as a concrete, independent object).
  *   **Status:** **Genuine Constraint.** Even hardline holists accept this ontologically, even if they resist it explanatorily.

  **2. The Difference-Making Requirement (Causal Efficacy)**
  *   **Definition:** The explanatory factor must make a difference to the outcome. If you remove or alter the factor, the outcome should change.
  *   **Why it's required:** To distinguish a real cause from a mere correlation or a redundant description.
  *   **Case Application:** **Market prices** constrain behavior. If the price mechanism is removed (e.g., price controls), behavior changes. The price is doing work, not just summarizing trades.
  *   **Failure Mode:** Epiphenomenalism (admitting social structures exist but claiming they have no causal power).
  *   **Status:** **Genuine Constraint.** This is the core of causal explanation.

  **3. The Mechanism Requirement (Transparency)**
  *   **Definition:** The explanation must specify the pathway by which the cause produces the effect. It cannot be a "black box."
  *   **Why it's required:** To ensure the explanation is testable and not just a story fitted to the data.
  *   **Case Application:** In a **bank run**, it is not enough to say "panic spread." You must show the link: institutional rules (short-term liabilities) $\rightarrow$ individual incentive to withdraw early $\rightarrow$ collective depletion of reserves.
  *   **Failure Mode:** Magical thinking (asserting a connection without showing how it travels).
  *   **Status:** **Genuine Constraint.** Essential for scientific rigor.

  **4. The Robustness Requirement (Invariance)**
  *   **Definition:** The explanation should hold true even if the specific individuals involved change, provided the structural relations remain the same.
  *   **Why it's required:** To allow for generalization and prediction. If an explanation only works for *these* specific people, it is history, not social science.
  *   **Case Application:** **Neighborhood tipping.** The segregation outcome occurs regardless of *which* specific families move, provided the aggregate preference structure remains. The specific identities don't matter; the structural dynamic does.
  *   **Failure Mode:** Over-particularization (explaining the event so narrowly it offers no insight into similar events).
  *   **Status:** **Genuine Constraint.** This is what justifies using social categories (like "class" or "caste") rather than just biographies.

  **5. The Intervention Requirement (Manipulability)**
  *   **Definition:** The explanation must identify levers that could theoretically be pulled to change the outcome.
  *   **Why it's required:** Explanation is linked to control and policy. If you can't say what would change the outcome, you haven't fully explained it.
  *   **Case Application:** **Algorithmic risk scores.** If the score causes recidivism (by denying parole), then removing the score from the decision process should alter recidivism rates.
  *   **Failure Mode:** Fatalism (treating social outcomes as inevitable laws of nature).
  *   **Status:** **Genuine Constraint.** Distinguishes social science from natural history.

  ---

  ### Part 2: The Tensions (Trade-offs and Conflicts)

  This is where the fighting usually happens. Most tensions are real, meaning you cannot maximize both sides simultaneously without cost.

  **1. Grounding vs. Autonomy (The Causal Exclusion Problem)**
  *   **The Tension:** If social facts are fully grounded in individuals (Requirement 1), do they have any causal power left over (Requirement 2)? If the individuals do all the causing, the social structure seems redundant.
  *   **Real or Fake?** **Real.** This is the hardest philosophical problem in social science.
  *   **The Cost:** If you prioritize Grounding, you risk making social structures epiphenomenal (shadows with no power). If you prioritize Autonomy, you risk mysticism (structures floating above people).
  *   **Resolution Strategy:** You must argue for *non-reductive* causation. The structure constrains the individuals, which constrains the structure. It is a loop, not a ladder.

  **2. Mechanism vs. Robustness (The Detail Trade-off)**
  *   **The Tension:** Detailed mechanisms (Requirement 3) are specific to contexts. Robust explanations (Requirement 4) are general but often vague on mechanism.
  *   **Real or Fake?** **Real.**
  *   **The Cost:** High mechanistic detail reduces generalizability (your bank run model only works for *this* banking law). High robustness reduces actionable detail (you know "inequality causes unrest" but not how to stop it).
  *   **Resolution Strategy:** Accept different levels of explanation for different purposes.

  **3. Intentionality vs. Unintended Consequences**
  *   **The Tension:** Individualist explanations prefer intentional action. Structural explanations rely on equilibrium effects no one intended.
  *   **Real or Fake?** **Real.**
  *   **The Cost:** If you demand all explanation bottom out in individual intentions, you cannot explain **market prices** or **segregation tipping**, as no single agent intends those outcomes.
  *   **Resolution Strategy:** Acknowledge that "individual action" includes acting under constraints and reacting to aggregate signals, not just pursuing pure desires.

  **4. The "Existence" Debate (Do Structures Exist?)**
  *   **The Tension:** Individualists say only people exist; Holists say structures exist too.
  *   **Real or Fake?** **Fake (mostly semantic).**
  *   **Why:** Both sides agree people exist. Both sides agree patterns persist. The fight is usually about whether we should *call* the patterns "real."
  *   **Resolution Strategy:** Ignore ontology. Focus on the **Difference-Making Requirement**. If treating the structure as real helps you intervene, treat it as real for that purpose.

  ---

  ### Part 3: The "Killer" Constraint

  If you can only use one requirement to eliminate bad theories, use **The Difference-Making Requirement (specifically via Intervention).**

  **Why:**
  1.  **It filters Individualism:** Pure individualism often fails here because it cannot identify the *structural* lever. Knowing every depositor's psychology doesn't tell you that *deposit insurance* stops the run. The individual facts are constant; the institutional fact is the difference-maker.
  2.  **It filters Holism:** Pure holism often fails here because it posits causes that cannot be intervened upon. Saying "Capitalism caused the crisis" is useless if you cannot specify which mechanism of capitalism to tweak.
  3.  **It solves Exclusion:** It bypasses the metaphysical worry about whether structures "really" cause things. If manipulating the structural variable (e.g., changing the **caste** classification on a form) changes the outcome (hiring rates), then the structure is a difference-maker, regardless of whether it "supervenes" on individuals.

  **Verdict:** This constraint forces you to move beyond "what exists" to "what works."

  ---

  ### Part 4: Scorecard of Positions

  Here is how the standard positions perform against the desiderata.

  | Requirement | Methodological Individualist (The Economist) | Structuralist / Holist (The Sociologist) | Middle View (Mechanism/Supervenience) |
  | :--- | :--- | :--- | :--- |
  | **Grounding** | **Pass.** Explicitly grounds everything in agents. | **Fail/Risk.** Often treats structures as independent entities. | **Pass.** Acknowledges dependence on individuals. |
  | **Difference-Making** | **Fail.** Often misses structural levers (e.g., ignores how rules change incentives). | **Pass.** Good at identifying macro-levers (policy, norms). | **Pass.** Identifies both micro and macro levers. |
  | **Mechanism** | **Pass.** Demands clear micro-foundations. | **Fail/Risk.** Often treats structures as black boxes. | **Pass.** Links micro-actions to macro-outcomes. |
  | **Robustness** | **Fail.** Explanations often break if agent psychology changes. | **Pass.** Good at explaining patterns across different populations. | **Pass.** Explains why patterns persist despite turnover. |
  | **Intervention** | **Mixed.** Good for incentives, bad for institutional design. | **Mixed.** Good for policy, bad for implementation details. | **Best.** Connects policy to behavior. |

  **Summary for your Seminar:**
  Your friend (Individualist) satisfies **Grounding** and **Mechanism** but struggles with **Robustness** and **Difference-Making** in cases like tipping or bank runs (where the *system* properties, not just the people, cause the crash). You (Holist) satisfy **Robustness** and **Difference-Making** but risk failing **Grounding** and **Mechanism** if you cannot show how the structure gets into the heads and actions of the people.

  **Winning Move:** Argue that **Difference-Making via Intervention** is the primary goal. Show that in your cases (caste, algorithms, bank runs), manipulating the *individual* variables alone fails to stop the phenomenon, while manipulating the *structural* variable succeeds. This proves the structural variable is a necessary part of the explanation, regardless of whether it "reduces" to individuals ontologically.
