answer: |-
  ### 1. Viability of the Geology Example

  **Can it carry the whole session?**
  Yes, but only if you rigorously distinguish between **stipulative precision** (the geological standards) and **semantic vagueness** (ordinary usage).

  **What it gives you that sand/baldness does not:**
  *   **Authority vs. Usage:** It allows you to demonstrate that precise boundaries are *imposed* for utility, not *discovered* in nature. This helps motivate the Sorites: if nature doesn't care about the 256mm line, why does the concept "boulder"?
  *   **Competing Precisifications:** The conflict between Udden–Wentworth (256mm) and ISO 14688-1 (200mm) provides a ready-made model for **Supervaluationism**. You can treat the two standards as two admissible "precisifications" of the ordinary term. A 220mm rock is a "boulder" on one precisification and "not a boulder" on the other.
  *   **Arbitrariness:** It highlights the arbitrariness of the cut-off, which is essential for generating the intuition that there *shouldn't* be a sharp boundary (the motivation for rejecting Epistemicism).

  **What it distorts (and how to fix it):**
  *   **The Epistemicism Trap:** Because the geological lines are written in a book, students will assume "boulder" *is* precise and we just need to check the manual. This makes Epistemicism look trivial (ignorance of the rulebook) rather than metaphysical (ignorance of a fact that exists but is unknowable).
      *   *Fix:* Explicitly state at the outset: "Geologists stipulate these lines to avoid ambiguity in engineering. Philosophers are interested in the word *before* the geologists get to it. In ordinary English, is there a fact of the matter about a 250mm rock?"
  *   **The "Third Value" Trap:** Since the standards disagree, students may think the rock is "neither" or "both."
      *   *Fix:* Use the disagreement to show **indeterminacy**, not a truth-value gap. On Supervaluationism, the sentence is not "middle"; it is simply not "supertrue."

  ---

  ### 2. The Logical Sequence (Dependencies)

  To present Epistemicism and Supervaluationism as **escape routes** rather than a list, you must first construct a trap using Classical Logic. The session must follow this dependency chain:

  **Phase 1: The Trap (Minutes 0–35)**
  1.  **Bivalence Review:** Confirm they accept that every declarative sentence is True or False.
  2.  **The Ordinary Concept:** Introduce "boulder" in ordinary English (ignoring the geological manuals for now). Elicit the intuition that there are clear cases (1m rock), clear non-cases (1mm pebble), and borderline cases (250mm rock).
  3.  **The Sorites Construction:** Build the argument formally.
      *   *Base:* A 1mm particle is not a boulder.
      *   *Inductive Step:* If a particle of size $n$ is not a boulder, a particle of size $n+0.01$mm is not a boulder.
      *   *Conclusion:* A 1m rock is not a boulder.
  4.  **The Crisis:** The conclusion is false. The logic (Modus Ponens) is valid. Therefore, at least one premise must be false.
      *   *Dependency:* Students must feel the tension here. They cannot move to solutions until they accept that Classical Logic + Plausible Premises = Contradiction.

  **Phase 2: Escape Route A — Epistemicism (Minutes 35–55)**
  5.  **The Move:** Save Classical Logic and Bivalence by insisting the Inductive Step is false.
  6.  **The Cost:** There must be a sharp boundary (e.g., at 249.99mm it's not a boulder; at 250.00mm it is).
  7.  **The Explanation:** The boundary exists semantically, but we cannot know it.
      *   *Dependency:* This depends on Phase 1's commitment to Bivalence. If they aren't committed to Bivalence, this view looks insane.
  8.  **The Motivation:** Why accept this? Because it preserves standard logic and semantics without revision.

  **Phase 3: Escape Route B — Supervaluationism (Minutes 55–75)**
  9.  **The Move:** Save the intuition that there is no sharp boundary by modifying the definition of Truth (while attempting to save Classical Logic at the meta-level).
  10. **The Mechanism:** Use the Geology Example here. Udden-Wentworth is one precisification; ISO is another.
      *   *True:* True on all admissible precisifications (e.g., "A 1m rock is a boulder").
      *   *False:* False on all admissible precisifications (e.g., "A 1mm rock is a boulder").
      *   *Indeterminate:* True on some, false on others (e.g., "A 250mm rock is a boulder").
  11. **The Payoff:** The Inductive Step is neither true nor false (so the Sorites argument fails to get off the ground), but the Law of Excluded Middle holds (it is either true or not true that the rock is a boulder).
      *   *Dependency:* This depends on Phase 1's failure. It is the alternative way out if one refuses to accept Epistemicism's sharp boundary.

  **Phase 4: The Shared Weakness (Minutes 75–90)**
  12. **Higher-Order Vagueness:** Ask: "Where is the boundary between the clear cases and the borderline cases?"
      *   *Dependency:* This attacks the mechanisms of *both* Phase 2 and Phase 3. Epistemicism posits a boundary we can't know; Supervaluationism posits a set of admissible precisifications. Both require a sharp line between "admissible" and "inadmissible" or "known" and "unknown."
  13. **Conclusion:** Summarize the trade-off (Logic vs. Intuition).

  ---

  ### 3. Misconception Management

  Intervene at these specific points to head off the anticipated errors.

  **1. "If no particular sorites premise is false then the universally quantified tolerance principle must be true."**
  *   **When:** Phase 1 (The Sorites Construction).
  *   **Intervention:** Distinguish between the **universal generalization** ("For all $n$, if $n$ is not a boulder, $n+1$ is not") and the **instances** ("If 10mm is not, 10.01mm is not").
  *   **Point to make:** Supervaluationism accepts that every *instance* is true (or at least not false), but denies the *universal generalization* is true. This is non-classical, but necessary to block the paradox without a sharp boundary.

  **2. "Epistemicism's sharp boundary is merely something better instruments could reveal."**
  *   **When:** Phase 2 (Epistemicism).
  *   **Intervention:** Explicitly contrast **empirical ignorance** (I don't know the weight of the rock) with **semantic ignorance** (There is no fact of the matter accessible to any instrument).
  *   **Point to make:** The boundary is fixed by usage/concepts, not physical reality. A laser measure can measure the rock, but it cannot measure the meaning of the word "boulder."

  **3. "Supervaluationism amounts to the claim that there is no fact of the matter."**
  *   **When:** Phase 3 (Supervaluationism).
  *   **Intervention:** Clarify the metaphysics. Supervaluationism says there is no fact of the matter *about the borderline case*, but there *is* a fact of the matter about what is "supertrue."
  *   **Point to make:** It is not nihilism; it is a specific theory of how truth supervenes on precisifications.

  **4. "Supervaluationism introduces a third truth value."**
  *   **When:** Phase 3 (Supervaluationism).
  *   **Intervention:** This is the most critical technical correction. Supervaluationism is **bivalent** at the level of classical logic (Excluded Middle holds: $P \lor \neg P$ is supertrue), but **trivalent** at the level of semantic evaluation (True, False, Indeterminate).
  *   **Point to make:** "Indeterminate" is not a third truth value like '0.5'; it is a status indicating a lack of truth-value across precisifications. If you treat it as a third value, you lose classical tautologies.

  **5. "Higher-order vagueness is a technicality rather than a problem for both views."**
  *   **When:** Phase 4 (Conclusion).
  *   **Intervention:** Show that it destroys the explanatory power of both. If Epistemicism says there is a boundary we can't know, is there a boundary to *that* ignorance? If Supervaluationism has a set of "admissible" precisifications, is the boundary of that set sharp?
  *   **Point to make:** If the boundary of the boundary is vague, the original solution collapses into regress.

  ---

  ### 4. Closing & Exclusions

  **The Diagnostic Question:**
  > "Consider a 250mm rock. The Epistemicist says the sentence 'This is a boulder' is **True or False**, but we cannot know which. The Supervaluationist says the sentence is **Indeterminate**.
  >
  > If we discover a new geological standard that everyone adopts tomorrow making 250mm definitely a 'cobble', which theorist is proven right, and why?"

  *   **Correct Answer:** Neither/Both (depending on nuance), but the intended takeaway is: **Epistemicism** is compatible with this (the meaning shifted, so the boundary moved), but **Supervaluationism** treats the new standard as simply narrowing the set of precisifications until indeterminacy disappears. The question tests if they understand that Epistemicism is about *actual* boundaries in current usage, while Supervaluationism is about *ranges* of acceptable usage.
  *   *Simpler version for 2nd years:* "Does the Supervaluationist believe that 'This is a boulder or this is not a boulder' is true for the 250mm rock? Does the Epistemicist? If they agree on that, what exactly is their disagreement about?" (Answer: They agree on Excluded Middle; they disagree on whether there is a *truth-maker* for one of the disjuncts).

  **Topics to Openly Refuse (Time Management):**
  1.  **Degree Theory (Fuzzy Logic):** This requires changing the logic to many-valued logic. It confuses the Bivalence constraint you are using to frame the main two views.
  2.  **Contextualism:** The idea that "boulder" shifts meaning during the Sorites chain. This solves the paradox but changes the subject from semantics to pragmatics.
  3.  **Nihilism (Eliminativism):** The claim that "boulder" does not exist. This is a metaphysical nuclear option that bypasses the semantic puzzle.
  4.  **The History of the Sorites:** Do not discuss Eubulides or the Stoics. Stick to the logical structure.
  5.  **Formal Semantics of Supervaluationism:** Do not write out the model-theoretic definitions. Use the "Geological Standards" analogy instead.
