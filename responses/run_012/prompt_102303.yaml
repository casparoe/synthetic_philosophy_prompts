answer: |-
  (1) Exam Question

  **Topic:** The Political Economy of Futarchy
  **Time:** 90 Minutes
  **Word Limit:** Approx. 1000 Words

  Robin Hanson's futarchy proposes to separate democratic decision-making into two distinct functions: voting on a national welfare metric (values) and using prediction markets to select policies that maximize that metric (beliefs). Critically assess whether this institutional separation is coherent. In your answer, address the political economy of defining the welfare metric, the epistemic challenges of pricing counterfactuals, and whether market incentives can remain decoupled from value manipulation. Does futarchy eliminate political conflict over ends, or does it merely relocate it to the design of the measurement infrastructure?

  ***

  (2) Model Answer

  Futarchy's central promise is the decoupling of values from beliefs, allowing voters to agree on ends while markets determine means. However, this separation is institutionally fragile because the definition of the welfare metric is itself a political act laden with empirical assumptions. While Hanson suggests voters simply choose a metric like "national income plus health," the weighting of these components encodes specific beliefs about what constitutes welfare. Consequently, the initial vote on values cannot be purged of beliefs about causality; choosing to measure GDP over happiness implies a belief about what drives societal good. Therefore, the purported separation is analytically neat but practically impossible, as metric specification inevitably privileges certain worldviews over others.

  Furthermore, the mechanism relies on pricing counterfactuals, which introduces a severe resolution problem. Prediction markets require a clear settlement condition to function, yet policy outcomes are rarely isolated from external variables. If a market bets on "GDP growth if Policy X passes," who determines what GDP would have been had Policy X failed? An authoritative oracle is required to settle these counterfactuals, reintroducing a centralized human judgment that futarchy seeks to bypass. This oracle becomes a focal point for manipulation, as stakeholders will lobby not just the market, but the adjudicators of the metric itself. The epistemic advantage of markets collapses if the resolution mechanism is politicized.

  Market integrity also faces challenges regarding liquidity and manipulation. For markets to aggregate information efficiently, they require sufficient liquidity and diverse participants. In high-stakes political contexts, actors with substantial resources have incentives to manipulate prices to signal false confidence or trigger policy adoption. Unlike financial markets where arbitrage corrects mispricing, political prediction markets may lack sufficient counter-capital to correct deliberate distortion by vested interests. If rich actors can sway the perceived probability of success, the market reflects power rather than truth. Thus, the belief-aggregation mechanism is vulnerable to the same rent-seeking behaviors that plague traditional lobbying.

  Ultimately, futarchy does not eliminate politics but relocates power from policymakers to those who define and adjudicate the welfare metric. The struggle over policy becomes a struggle over measurement standards, shifting conflict from the legislative floor to the statistical bureau. This creates a technocratic elite with veto power over democratic preferences via metric design. While futarchy offers a novel approach to information aggregation, it fails to resolve the fundamental problem of institutional power. The separation of values and beliefs remains a heuristic rather than an operational reality, leaving the system vulnerable to the very political economies it aims to transcend.

  ***

  (3) Marking Scheme

  1. Identifies that defining the welfare metric is itself a political act subject to lobbying, whereas weaker answers treat the metric as a neutral technical baseline.
  2. Argues that values and beliefs cannot be fully decoupled because metric specification implicitly encodes empirical assumptions about causality.
  3. Explains the counterfactual resolution problem, noting that markets price expectations but require an authoritative oracle to settle outcomes.
  4. Recognizes that liquid markets are vulnerable to manipulation by stakeholders with more capital than information, undermining epistemic efficiency.
  5. Concludes that futarchy does not eliminate politics but relocates power from policymakers to those who define and adjudicate the welfare metric.
