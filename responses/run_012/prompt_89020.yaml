answer: |-
  This is a fantastic question. You have good instincts to be suspicious of that last sentence. Your friend is right that something "sneaky" is happening there, though it might not be malicious—just philosophically compressed.

  Frankfurt's 1969 paper, *"Alternative Possibilities and Moral Responsibility,"* is one of the most famous in modern philosophy. The summary you have is the standard "textbook" version, but textbook versions often smooth over the jagged edges that keep philosophers employed.

  Here is a clause-by-clause breakdown of what a working philosopher would think, followed by a deep dive into that final, problematic sentence.

  ### Clause-by-Clause Fact Check

  **1. "Frankfurt's classic paper demolished the principle of alternative possibilities..."**
  *   **Philosopher's Reaction:** *Wince at "demolished."*
  *   **Why:** "Demolished" implies the debate is over. It isn't. Frankfurt dealt a massive blow to the Principle of Alternative Possibilities (PAP), and many philosophers now reject PAP. However, a significant minority still defend it (more on that below). A better word would be "challenged" or "undermined."

  **2. "...which said that you're only morally responsible for what you do if you could have done otherwise."**
  *   **Philosopher's Reaction:** *Nod.*
  *   **Why:** This is an accurate definition of PAP. It is the intuitive idea that responsibility requires "leeway"—the ability to choose a different path.

  **3. "His counterexample: Black wants Jones to perform some action... Black would step in and force him... Jones decides to do it on his own... Black never lifts a finger."**
  *   **Philosopher's Reaction:** *Nod.*
  *   **Why:** This is an accurate summary of the "Frankfurt Case" (specifically the Black/Jones version). It sets up a scenario with a "counterfactual intervener" who ensures the outcome but remains causally inactive in the actual sequence of events.

  **4. "Since Black stood ready to intervene, Jones could not have done otherwise -- yet we still blame him, and rightly so. So the principle is false."**
  *   **Philosopher's Reaction:** *Nod with reservations.*
  *   **Why:** This is Frankfurt's core argument. The intuition pump is: Jones is responsible *because* he acted on his own reasons (the "actual sequence"), regardless of whether he had alternatives (the "counterfactual sequence"). Most contemporary compatibilists accept this. However, incompatibilists (those who think determinism kills responsibility) have specific objections to the claim that Jones "could not have done otherwise" (see below).

  **5. "And with it goes the main reason anyone ever worried that determinism is incompatible with free will: even if determinism is true... moral responsibility survives."**
  *   **Philosopher's Reaction:** **Wince/Alarm.**
  *   **Why:** **This is the sneaky part.** This sentence claims that killing PAP solves the problem of determinism. It does not. It removes *one* argument for incompatibilism, but it does not prove compatibilism. (I will explain this in detail below).

  ---

  ### The "Sneaky" Leap: Why the Last Sentence Doesn't Follow

  Your friend likely sensed that the author is smuggling a conclusion here. The author is moving from **"PAP is false"** to **"Determinism is compatible with Responsibility."**

  Here is why that logic is gap-ridden:

  **1. PAP is not the *only* reason for Incompatibilism.**
  Incompatibilists (people who think determinism rules out responsibility) generally fall into two camps:
  *   **Leeway Incompatibilists:** They argue determinism kills responsibility *because* it removes alternative possibilities. Frankfurt cases target this group directly. If Frankfurt is right, this argument fails.
  *   **Source Incompatibilists:** They argue that even if PAP is false, determinism *still* kills responsibility. Why? Because if determinism is true, your actions are ultimately caused by things outside your control (the past + laws of nature). You are not the true "source" of your action.
  *   **The Problem:** A Frankfurt case shows you can be responsible without alternatives. It does *not* show you can be responsible if your decision is causally determined by the Big Bang. The author is assuming that the *only* threat determinism poses is the removal of alternatives. Many philosophers argue the threat is the *source* of the action, not the lack of options.

  **2. The "Begging the Question" Worry.**
  For a Frankfurt case to work as an argument *against* incompatibilism, the setup itself cannot assume determinism is compatible with responsibility.
  *   How does Black know Jones is about to decide otherwise? Usually, the story implies Black can predict Jones's decision with 100% accuracy before Jones makes it.
  *   If that prediction is based on deterministic laws, the case *presupposes* determinism to prove that determinism is okay. An incompatibilist will say, "In your story, Jones is determined to act, and you're telling me he's responsible? That's exactly what I deny!"
  *   If the prediction is *not* deterministic (e.g., magic or time travel), then the case doesn't apply to our world, which (allegedly) operates on physical laws.

  **3. "Moral Responsibility Survives" is too strong.**
  Even if PAP is false, it doesn't automatically follow that responsibility survives *determinism*. It only follows that responsibility survives *the lack of alternatives*. Determinism might kill responsibility for other reasons (manipulation, lack of ultimate control, etc.).

  **Verdict on the last sentence:** The author is overstating the case. A more accurate claim would be: *"And with it goes the main **leeway-based** reason anyone ever worried that determinism is incompatible with free will."*

  ---

  ### Standard Replies: Can PAP be Defended?

  You asked for the standard replies from people who want to defend PAP. There are two main strategies. Philosophers are divided on whether they work.

  #### 1. The "Flickers of Freedom" Strategy
  *   **The Argument:** Defenders of PAP argue that in the Frankfurt case, Jones *does* have an alternative possibility, just not the possibility of doing a different *action*.
  *   **The Detail:** Jones can either (A) decide to kill on his own, or (B) be forced to kill by Black. These are different *paths* to the same outcome. The "flicker" of freedom is the difference between acting freely and being forced.
  *   **Does it work?** *Mixed.* Frankfurtians reply that moral responsibility attaches to the action (killing), not the method of causation. If the outcome and the reasons are identical, the "flicker" is morally irrelevant. However, some philosophers argue that the "sign" Jones gives before Black intervenes is a genuine alternative possibility that grounds responsibility.

  #### 2. The "Dilemma Defense" (The most technical objection)
  *   **The Argument:** This attacks the mechanism Black uses to know when to intervene.
  *   **Horn 1:** If Black's prediction is based on **deterministic signs** (e.g., neural activity that causally necessitates the choice), then the case assumes determinism is true. But if determinism is true, the incompatibilist already believes Jones isn't responsible. So the case begs the question.
  *   **Horn 2:** If Black's prediction is **not deterministic** (e.g., Jones could have chosen differently *before* the sign appeared), then Jones *could have done otherwise* (he could have avoided the sign). If he could have avoided the sign, PAP is preserved.
  *   **Does it work?** *Strong, but contested.* This is considered the strongest technical objection to Frankfurt cases. Frankfurtians try to construct cases where the prior signs are "non-causal" or "infallible" without being deterministic, but many incompatibilists remain unconvinced that such a setup is metaphysically coherent.

  ### Summary for Your Reading Group

  If you want to sound like you know what you're talking about without overstating it, here is the safe position:

  1.  **Trust the setup:** The description of the Black/Jones case is accurate.
  2.  **Trust the immediate conclusion:** It is widely accepted that Frankfurt cases show that *alternative possibilities are not necessary for moral responsibility* (in the specific sense that you can be responsible even if a counterfactual intervener ensures the outcome).
  3.  **Distrust the grand conclusion:** Do **not** repeat the claim that this proves determinism is compatible with free will.
      *   *Say this instead:* "Frankfurt cases undermine the idea that 'could have done otherwise' is required for responsibility. This hurts the Incompatibilist argument that relies on PAP, but it doesn't settle the debate. Source Incompatibilists still argue that determinism undermines responsibility even if PAP is false."
  4.  **Acknowledge the controversy:** Mention that there is a debate about whether Frankfurt cases secretly assume determinism to work (the Dilemma Defense).

  **The Verdict:** The author is 80% right but oversells the final 20%. The argument is clean, but it clears a hurdle; it doesn't finish the race. Your friend was right to be suspicious of the finish line.
