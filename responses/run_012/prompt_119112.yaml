prompt: |-
  In the seminar I run on convention and obligation, I keep encountering a defence of the when-in-Rome principle that is built entirely on an analogy, and I would like the analogy audited rather than the principle restated. The analogy is this: the everyday norms that govern tipping, queueing, and jaywalking are like a local language. They are arbitrary in the way a lexicon is arbitrary; they are learned rather than derived; they vary from place to place; they are intelligible only against a shared background; and a visitor who ignores them is like a speaker who invents private words in public. My colleague uses the analogy to reach a conclusion: visitors are obligated to follow local conventions, not because the conventions are independently moral, but because participation in a shared social world requires fluency, and because refusing fluency is a kind of disrespect. He also uses it to say that locals who violate their own conventions—jaywalking, say, or cutting a queue—are not thereby doing something immoral, since the conventions are arbitrary and do not wrong anyone in particular.

  I want a full audit of this analogy. Begin by setting out the correspondences explicitly: what maps onto the grammar, the vocabulary, the dialect, the native speaker, the second-language learner, the translator, the code-switcher, and the grammatical mistake. Then separate the disanalogies that matter for the conclusion from those that are merely picturesque. In particular, I want to know whether the analogy can carry the move from coordination to obligation: languages solve coordination problems, but it is not obvious that they generate obligations that a wronged party can address to the agent, and it is not obvious that an arbitrary convention can be binding on someone who has not agreed to it and cannot be presumed to know it. I also want to know what the analogy obscures about conventions that are unjust, demeaning, or costly to follow, and about the asymmetry between a visitor who fails to tip and a local who jumps a queue. The analogy also treats tipping, queueing, and jaywalking as a single kind, but I suspect they are not: one is a gift-like practice with no obvious coordination payoff, one is a first-come-first-served equilibrium, and one is a legal rule with varying enforcement. I want that heterogeneity respected in the audit.

  Finally, tell me whether the conclusion survives once the disanalogies are on the table, or whether the analogy was doing the argumentative work all along. If there is a better analogy for the relation between everyday conventions and moral obligation, say what it is and why it succeeds where the language analogy fails. I am not interested in a survey of the literature; I want the mapping, the breaks, and the verdict.
reasoning: |-
  Here's a thinking process that leads to the audit of the "When-in-Rome" language analogy:

  1.  **Deconstruct the Request:**
      *   **Task:** Audit a specific analogy used to defend the "When-in-Rome" principle (WIR).
      *   **The Analogy:** Social norms (tipping, queueing, jaywalking) $\approx$ Local Language.
      *   **The Colleague's Conclusion:** Visitors are obligated to follow local conventions (due to respect/fluency requirements), but locals violating their own conventions aren't necessarily immoral (because conventions are arbitrary).
      *   **Specific Requirements:**
          1.  Explicit Mapping (Grammar, Vocabulary, Dialect, Native Speaker, L2 Learner, Translator, Code-switcher, Mistake).
          2.  Separate Disanalogies (Argumentatively significant vs. Picturesque).
          3.  Address the Move from Coordination to Obligation (Can language generate obligations/wronged parties?).
          4.  Address Arbitrary Conventions & Consent/Knowledge (Binding without agreement?).
          5.  Address Unjust/Demeaning/Costly Conventions (What does the analogy obscure?).
          6.  Address Asymmetry (Visitor failing to tip vs. Local jumping queue).
          7.  Address Heterogeneity (Tipping vs. Queueing vs. Jaywalking).
          8.  Verdict (Does the conclusion survive? Is there a better analogy?).
      *   **Constraint:** No literature survey. Focus on mapping, breaks, and verdict.

  2.  **Step 1: Explicit Mapping (The Correspondences):**
      *   *Goal:* Translate the social norm concepts into linguistic terms based on the colleague's logic.
      *   *Grammar:* The underlying structure of social interaction (turn-taking, reciprocity).
      *   *Vocabulary:* Specific acts (tipping amount, standing in line).
      *   *Dialect:* Regional variations (NYC tipping vs. Tokyo tipping).
      *   *Native Speaker:* The Local (intuitive grasp).
      *   *Second-Language Learner:* The Visitor (trying to learn).
      *   *Translator:* The Guide/Expatriate (mediates understanding).
      *   *Code-Switcher:* The Bicultural/Traveler (adjusts behavior based on context).
      *   *Grammatical Mistake:* Norm Violation (jaywalking, not tipping).

  3.  **Step 2: Disanalogies (Significant vs. Picturesque):**
      *   *Picturesque:* Languages have sounds/writing; norms have actions. Languages evolve slowly; norms can shift quickly. (These don't hurt the argument much).
      *   *Significant:*
          *   *Truth Conditions:* Language aims at truth/communication. Norms aim at coordination/fairness/welfare. A grammatical error causes confusion; a norm violation causes harm/offense/loss.
          *   *Volition:* Speaking is often optional (silence is an option). Queueing is often mandatory for access.
          *   *Normativity:* "Incorrect grammar" isn't usually *wrong* in a moral sense. "Queue jumping" is often seen as unfair.
          *   *Fluency:* You can be fluent in a language and choose to lie. You can know a norm and choose to violate it for gain.

  4.  **Step 3: Coordination to Obligation (The Crux):**
      *   *The Problem:* Language solves coordination (I say "dog," you think *dog*). But if I say "cat" meaning *dog*, I haven't *wronged* you morally, I've just failed to communicate.
      *   *The Gap:* The analogy explains *intelligibility*, not *obligation*. Why does failing to be "fluent" in tipping constitute a *wrong* rather than just a *misunderstanding*?
      *   *Consent/Knowledge:* You aren't born knowing a language; you learn it. But visitors often *can't* know the norm beforehand. Language is usually learned over years; norms might be expected immediately.
      *   *Wronged Party:* If I speak bad French in Paris, no specific person is harmed. If I jump a queue, the person behind me loses time. The analogy obscures the *victim*.

  5.  **Step 4: Unjust/Demeaning/Costly Conventions:**
      *   *The Blind Spot:* Language is rarely "unjust" in itself (though it can encode bias). Norms can be oppressive (e.g., segregation norms, gendered tipping expectations).
      *   *The "Fluency" Trap:* If the norm is unjust, "fluency" means complicity. The language analogy suggests adaptation is always respectful. Sometimes adaptation is submission.
      *   *Cost:* Learning a language is hard. Following a norm might be expensive (tipping 25% when broke). The analogy treats the cost of entry as neutral.

  6.  **Step 5: Asymmetry (Visitor vs. Local):**
      *   *Colleague's Claim:* Locals violating norms aren't immoral (arbitrary). Visitors are obligated (respect).
      *   *The Break:* A local jumping a queue *does* wrong the person behind them (free-riding). A visitor not tipping might just be ignorant.
      *   *Language Parallel:* A native speaker using slang vs. grammar isn't immoral. But a native speaker lying is. The colleague conflates *convention* with *fairness*. Queueing isn't just convention; it's a fairness heuristic.
      *   *Verdict on Asymmetry:* The analogy fails here. It treats local violation as "dialectal variation" when it's often "free-riding."

  7.  **Step 6: Heterogeneity of Norms (Tipping vs. Queueing vs. Jaywalking):**
      *   *Tipping:* Gift/Signaling. No strict coordination payoff (service already rendered). More like a *gift economy*.
      *   *Queueing:* First-come-first-served equilibrium. High coordination payoff. Prevents conflict. Like *traffic rules*.
      *   *Jaywalking:* Legal/Safety rule. Often codified. Like *law*, not just language.
      *   *Audit:* Lumping these as "language" hides that queueing has a stronger moral claim (fairness) than tipping (gratitude).

  8.  **Step 7: Verdict & Better Analogy:**
      *   *Does the conclusion survive?* No. The analogy hides the moral stakes (harm/fairness) behind a veil of "intelligibility." It cannot generate obligation from arbitrariness without smuggling in a premise about respect or harm.
      *   *Better Analogy:* **The Game (or Traffic).**
      *   *Why:* Games have constitutive rules (like grammar) but also goals and winners/losers (moral stakes). Traffic rules solve coordination *and* safety. Violating them creates risk/harm, not just confusion.
      *   *Alternative:* **The Promise/Contract.** (Too strong?).
      *   *Best Fit:* **Traffic/Road Rules.** Arbitrary side (drive left vs. right) + Moral core (don't crash/kill). Explains why visitors must follow (safety/coordination) and why locals breaking them *do* wrong (endanger others).

  9.  **Drafting the Response:**
      *   *Tone:* Analytical, rigorous, respectful of the seminar context.
      *   *Structure:* Follow the prompt's sequence (Mapping -> Disanalogies -> Coordination/Obligation -> Unjust Norms -> Asymmetry -> Heterogeneity -> Verdict).
      *   *Refinement:* Ensure the distinction between "arbitrary" and "binding" is sharp. Make sure the "Local Violation" point hits hard (the colleague is likely wrong about locals).

      *(Self-Correction during drafting)*: I need to be careful not to just argue against WIR, but against the *analogy's support* for WIR. The prompt asks if the analogy is doing the work. I need to show that without the analogy, the argument collapses because the analogy hides the normative leap.

      *(Refining the "Better Analogy")*: Traffic is good. Another option is "Currency." Using the wrong currency isn't immoral, but counterfeiting is. Maybe "Game Rules" is best for the local/visitor asymmetry. Let's stick with **Traffic/Road Rules** because it captures the "arbitrary direction" (left/right drive) vs. "safety obligation" (don't hit pedestrians) distinction which mirrors "tipping amount" vs. "queue fairness." Actually, **The Game** is better for the "local vs visitor" dynamic (home field advantage vs. rules of play). Let's go with **Traffic** for the coordination/safety aspect, as it fits jaywalking/queueing better. Wait, the prompt asks for *one* better analogy. I will propose **Traffic Systems** because it distinguishes between arbitrary convention (which side of the road) and safety obligation (stopping at lights), which resolves the "arbitrary but binding" tension better than language.

      *(Final Polish)*: Check the mapping section. Ensure "Translator" and "Code-switcher" are defined clearly in this context. Ensure the "Heterogeneity" section clearly distinguishes the three norms.

      *(Final check on constraints)*: No literature survey. Focus on mapping, breaks, verdict.

      *Let's write.*
answer: |-
  ### Audit of the Language Analogy for the When-in-Rome Principle

  #### 1. Explicit Mapping of Correspondences
  To audit the argument, we must first formalize the isomorphism your colleague proposes between linguistics and social norms.

  *   **Grammar:** The underlying logic of social interaction (e.g., reciprocity, turn-taking, the concept of "waiting your turn").
  *   **Vocabulary:** The specific behavioral tokens (e.g., leaving 20% on the table, standing behind the yellow line).
  *   **Dialect:** Regional variations in norms (e.g., tipping is mandatory in New York, offensive in Tokyo).
  *   **Native Speaker:** The Local (possesses intuitive, unreflective mastery of the norms).
  *   **Second-Language Learner:** The Visitor (must consciously learn and apply rules, prone to errors).
  *   **Translator:** The Guide, Expatriate, or Signage (mediates understanding between visitor and local context).
  *   **Code-Switcher:** The Frequent Traveler or Bicultural Agent (adjusts behavioral "register" depending on location).
  *   **Grammatical Mistake:** Norm Violation (e.g., jaywalking, cutting in line, under-tipping).

  #### 2. Disanalogies: Picturesque vs. Argumentatively Significant
  Many differences between language and norms are merely superficial. Others undermine the move from "intelligibility" to "obligation."

  **Picturesque Disanalogies (Do not defeat the argument):**
  *   *Modality:* Language is vocal/symbolic; norms are behavioral. This does not affect the structural claim that both are learned systems of meaning.
  *   *Rate of Change:* Languages evolve slowly; norms can shift rapidly. This does not impact the obligation of a visitor at a specific moment in time.

  **Significant Disanalogies (Undermine the conclusion):**
  *   **Truth vs. Fairness:** The primary function of language is *communication* (truth-conditional or expressive). A grammatical error results in confusion or misunderstanding. The primary function of norms like queueing is *distribution* (fairness) and *safety*. A norm violation results in **harm** or **loss** to a specific party, not just confusion.
  *   **Optionality:** One can choose silence in a language community without penalty. One often cannot opt out of a norm without incurring a cost (e.g., you cannot "opt out" of queueing and still access the service).
  *   **The Nature of the "Mistake":** A grammatical error is usually involuntary or a sign of ignorance. A norm violation (like queue-jumping) is often a calculated decision to gain an advantage. The analogy treats all violations as "errors in fluency," obscuring the possibility of *free-riding*.

  #### 3. The Move from Coordination to Obligation
  This is the weakest link in the analogy.

  *   **Coordination without Obligation:** Language is a coordination equilibrium. If I use a private word, I fail to coordinate, but I do not necessarily *wrong* you. I have made communication impossible, but I have not harmed your interests.
  *   **The Normative Gap:** The analogy explains why a visitor might be *expected* to follow norms (to be intelligible), but it does not explain why they are *obligated* to do so in a moral sense. To move from "you are confusing us" to "you are wronging us," you need a premise about **harm** or **fairness** that the language analogy lacks.
  *   **Consent and Knowledge:** We acquire language largely through immersion over years, with a presumption of patience for learners. Social norms are often expected to be known immediately. The analogy obscures the **epistemic burden**. If a visitor cannot be presumed to know the "vocabulary" (e.g., specific tipping percentages), the obligation to be "fluent" collapses unless there is a duty to inquire. Language speakers rarely demand you study the grammar before speaking; locals often demand norm compliance before interaction.

  #### 4. Unjust, Demeaning, or Costly Conventions
  The language analogy is dangerously neutral regarding the *content* of the convention.

  *   **The Complicity Problem:** Languages can be used to lie, but the structure of a language is rarely "unjust." Social conventions can be inherently oppressive (e.g., norms requiring women to yield seats, or racial segregation norms). The analogy suggests that "fluency" is always a form of respect. In unjust contexts, fluency is **complicity**. The analogy provides no resources to distinguish between a norm that coordinates (queueing) and a norm that subordinates (caste etiquette).
  *   **Cost of Entry:** Learning a language is costly, but the cost is borne by the learner. Following a norm may impose a direct material cost (tipping 25% when funds are low). The analogy treats the "cost of fluency" as neutral, ignoring that some conventions function as economic barriers or exploitation.

  #### 5. Asymmetry: Visitor vs. Local
  Your colleague argues that locals violating their own conventions are not acting immorally because the conventions are arbitrary. The analogy fails to support this.

  *   **The Free-Rider Problem:** In the language analogy, a native speaker using slang instead of formal grammar is not wronging anyone. But in the norm analogy, a local jumping a queue *is* wronging the person behind them. They are claiming a priority they have not earned.
  *   **The Break:** The analogy treats local violation as "dialectal variation." In reality, local violation is often "cheating." The language analogy cannot distinguish between *innovating* a norm (acceptable) and *exploiting* a norm (unacceptable). Therefore, the colleague's conclusion that locals are exempt from moral censure is unsupported by the analogy.

  #### 6. Heterogeneity of Norms
  The analogy treats tipping, queueing, and jaywalking as a single kind ("vocabulary"). They are not.

  *   **Tipping (Gift/Signaling):** This is a weak coordination game. The service is already rendered. Not tipping is a breach of gratitude or expectation, but rarely causes direct material loss to a specific individual in the moment (the waiter has already worked). The language analogy fits best here (a signal of appreciation), but the *obligation* is weakest here.
  *   **Queueing (Fairness Equilibrium):** This is a strong coordination game with a moral core (first-come, first-served). Violation causes direct loss (time) to specific others. The language analogy fails here because queue-jumping is not "unintelligible"; it is **unfair**. It is not a grammatical error; it is a foul.
  *   **Jaywalking (Legal/Safety Rule):** This is codified and enforced. It involves physical risk. The analogy fails because jaywalking is not arbitrary in the same way; it interacts with safety systems. Violating it creates risk, not just confusion.

  By lumping these together, the analogy borrows the moral weight of queueing (fairness) to defend tipping (gratitude), and borrows the arbitrariness of tipping to defend jaywalking (safety).

  #### 7. Verdict and Alternative Analogy

  **Verdict:**
  The conclusion **does not survive** the audit. The analogy was doing all the argumentative work by smuggling in a notion of "respect" while stripping out the notion of "harm."
  1.  **Obligation:** Language generates expectations, not moral obligations. The analogy cannot bridge the gap from "you are confusing" to "you are wronging."
  2.  **Local Violation:** The analogy falsely equates local norm-violation with dialectal variation, ignoring free-riding.
  3.  **Heterogeneity:** The analogy collapses distinct normative structures (gift, fairness, safety) into one, allowing the strongest moral claims to prop up the weakest.

  **Better Analogy: Traffic Systems**
  A traffic system is a superior analogy for the relation between everyday conventions and moral obligation.

  *   **Why it succeeds:**
      *   **Arbitrary but Binding:** Driving on the left vs. the right is arbitrary (like tipping %), but once established, it is binding because deviation causes crashes (harm). This captures the "arbitrary convention generating obligation" link better than language.
      *   **Coordination + Safety:** Like queueing, traffic rules solve coordination *and* prevent harm. This explains why violations are moral wrongs (endangering others), not just grammatical errors.
      *   **Visitor vs. Local:** A visitor *must* follow local traffic laws immediately (obligation based on safety/coordination). A local who runs a red light *is* immoral (endangering others). This corrects the colleague's asymmetry error.
      *   **Unjust Rules:** Traffic systems can be unjust (e.g., roads built to segregate communities). This allows for the critique of oppressive norms, which the language analogy suppresses.
      *   **Heterogeneity:** It distinguishes between speed limits (safety), lane discipline (coordination), and parking fees (economic convention), allowing for nuanced moral evaluation rather than a blanket "fluency" requirement.

  **Summary:** The language analogy explains *intelligibility*, but social norms require *legitimacy*. Traffic explains why we must follow arbitrary rules (to avoid harm) and why breaking them is a moral failure, regardless of whether you are a local or a visitor.
