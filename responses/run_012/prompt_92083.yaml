prompt: |-
  I'm a second-year law student taking a jurisprudence seminar that's cross-listed with the philosophy department, and I keep running into something in my torts and criminal law courses that I can't get straight. Both courses teach that cause-in-fact is a plain counterfactual matter — would the harm have happened anyway if the defendant had done otherwise? — and that this factual question gets settled before the judge ever reaches the separate, normative question of whether the defendant owed a duty. Applied to failures to act, though, the counterfactual test seems to work just as well as it does for actions: but for the lifeguard's failure to swim out, the swimmer would have lived. What puzzles me is that the law is ruthlessly asymmetric about exactly these cases. A stranger who watches a child drown and does nothing is not liable, and when I ask why, I get told both that he had no duty to act and that his failure didn't cause the death, as though those were one point rather than two. A parent who watches the same child drown is guilty of homicide. A doctor who turns off a ventilator at the family's request is said not to have caused the patient's death even though the patient would have lived on for some time had the machine stayed on, while a doctor who injects a lethal dose plainly has caused it. And in every case where an omission does count as a cause, it's because some duty — a special relationship, an undertaking, a statute — supplied the missing ingredient, so the causal question and the duty question never quite come apart. A classmate in the seminar insists this is all beside the point because absences simply cannot stand in causal relations: there is nothing there to be a relatum, and the counterfactual test only makes it look otherwise. I don't know whether to believe her, and I don't know what the doctrine would look like if she's right.

  What I want from you is the picture of causation that this whole apparatus presupposes, reconstructed as carefully as you can. Does the law assume that omissions are not causes at all and that it is only speaking loosely when it calls them causes, with all the real work done by duty? Does it assume instead that omissions are causes in just the sense actions are, so that the duty requirement is an extra, independent filter laid on top of an otherwise neutral causal judgment? Or does it assume something I find more interesting and harder to assess — that causation is itself partly normative or context-dependent, so that which condition counts as the cause of an outcome is picked out against a background of what we expect people to do, in which case the duty requirement is not a separate filter at all but is already inside the causal judgment? Tell me which of these the practice actually commits you to, which it merely fits comfortably with, and where it is genuinely underdetermined among them; if there are standard positions in the literature, name them, but I care far more about the reconstruction than about who said what, and please don't send me off to read anything. Then take the flatly counterfactual, norm-free theory of causation seriously for a moment and tell me what would have to change in the doctrine: what becomes of the stranger on the beach, the lifeguard, and the doctor at the ventilator, and is the resulting law more defensible or less than the one we have? Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year law student (2L) in a jurisprudence seminar (cross-listed with philosophy).
      *   **Context:** Struggling with the relationship between *cause-in-fact* (but-for causation) and *duty* in Torts and Criminal Law, specifically regarding omissions (failures to act).
      *   **The Puzzle:** The law treats omissions asymmetrically. A stranger isn't liable (no duty, sometimes said "no cause"), a parent is liable (duty + cause), a doctor turning off a ventilator isn't liable (no cause?), but injecting poison is (cause). The student notices that duty often seems to determine whether an omission is treated as a cause.
      *   **Classmate's View:** Omissions *cannot* be causes (metaphysical claim: absences aren't relata).
      *   **The Task:**
          1.  Reconstruct the picture of causation presupposed by current legal doctrine.
          2.  Evaluate three specific theories:
              *   (A) Omissions aren't causes; "cause" is loose talk, duty does the work.
              *   (B) Omissions are causes like actions; duty is a separate, independent filter.
              *   (C) Causation is partly normative/context-dependent; duty is *inside* the causal judgment.
          3.  Determine which theory the practice commits to, fits with, or is underdetermined on.
          4.  Name standard positions (briefly, no reading list).
          5.  Hypothetical: Take the "flatly counterfactual, norm-free theory" seriously. What changes in doctrine (stranger, lifeguard, doctor)? Is it more or less defensible?
          6.  **Constraint:** Answer in American English. Do not send the user off to read anything.

  2.  **Deconstruct the Legal Doctrine (Torts/Crim Law):**
      *   *Standard Instruction:* Cause-in-fact is "but-for" (sine qua non). Proximate cause is policy. Duty is a separate element (especially in negligence).
      *   *The Omission Problem:* In omission cases, courts often conflate duty and causation. "He didn't cause the harm; the disease did." vs. "He had no duty to act."
      *   *The Medical Distinction:* Killing (act) vs. Letting Die (omission). Often justified via causation ("I didn't cause the death, the underlying condition did") but really relies on consent/standard of care/duty.
      *   *The Stranger vs. Parent:* Both satisfy the but-for test (if parent jumped in, child lives; if stranger jumped in, child lives). Only parent is liable. Why? Duty. But courts sometimes say the stranger *didn't cause* the death.

  3.  **Evaluate the Three Theories against Doctrine:**

      *   *Theory A (Metaphysical Nihilism about Omissions):* Omissions are nothing, so they can't cause anything.
          *   *Fit:* Explains why courts sometimes say "no causation."
          *   *Conflict:* Courts *do* find causation in omission cases (parent, lifeguard). If omissions can't be causes, how is the parent liable? They must be using "cause" differently or relying entirely on duty.
          *   *Verdict:* Doctrine doesn't fully commit to this because it *does* punish omissions sometimes. It fits the "stranger" rhetoric but fails the "parent" reality.

      *   *Theory B (Norm-Neutral Causation + Independent Duty):* But-for is purely factual. Duty is a separate policy gate.
          *   *Fit:* This is the *black letter law* instruction (Restatement, Model Penal Code). Cause-in-fact first, then duty/proximate cause.
          *   *Conflict:* In practice, judges slide between them. They say "no duty" when they mean "no liability," but sometimes they say "no causation" to avoid expanding duty. The medical distinction (turning off ventilator) is often framed as causation, not just duty.
          *   *Verdict:* This is the *official* story, but the *practice* is messy. It fits comfortably but isn't strictly adhered to in judicial reasoning regarding omissions.

      *   *Theory C (Normative/Contextual Causation):* Causation selects the "abnormal" or "wrongful" condition. Duty defines what is normal/wrongful.
          *   *Fit:* Explains why the stranger's inaction isn't a "cause" (it's background) but the parent's is (it's a deviation from norm). Explains the medical distinction (turning off ventilator = allowing nature to take course vs. injecting poison = intervening cause).
          *   *Conflict:* Contradicts the "cause-in-fact is purely factual" instruction given to 1Ls.
          *   *Verdict:* This is what the doctrine *actually does* even if it says otherwise. It explains the asymmetry best.

  4.  **Synthesize the Reconstruction:**
      *   The law is theoretically committed to (B) but operationally relies on (C). It pays lip service to (A) in specific medical/stranger contexts to limit liability.
      *   *Hart & Honoré:* Crucial reference here. *Causation in the Law*. They argue for the "common sense" view where causation involves voluntary human intervention against a background of normal conditions. This aligns with (C).
      *   *Moore:* Michael Moore argues for a realist, metaphysical view (closer to B/A hybrid), criticizing the law's confusion.
      *   *Underdetermination:* The doctrine is genuinely underdetermined because courts use "causation" as a proxy for "liability" when they want to deny recovery without setting a broad duty precedent.

  5.  **The Hypothetical (Norm-Free Counterfactualism):**
      *   *Premise:* Strict but-for causation. If X didn't happen, Y wouldn't have. No normative filtering at the causation stage.
      *   *Stranger:* But-for the stranger not swimming, child died. Causation established. Liability now depends *solely* on Duty.
      *   *Lifeguard:* But-for lifeguard not swimming, swimmer died. Causation established. Duty exists. Liability.
      *   *Doctor (Ventilator):* But-for doctor turning off machine, patient lived longer. Causation established. Liability depends on Duty/Consent/Justification.
      *   *Consequences:*
          *   Explosion of potential liability (everyone is a but-for cause of everything they prevent).
          *   Duty becomes the *only* bottleneck.
          *   Courts would have to be much more explicit about Duty rules (e.g., enacting a Bad Samaritan law or explicitly rejecting one).
          *   Medical distinction collapses into Consent/Standard of Care, not "Cause."
      *   *Defensibility:*
          *   *Pros:* Intellectual honesty. Clears up the "causation vs. duty" muddle.
          *   *Cons:* Politically difficult. Expands the net of "causers" too wide. Might make juries confused (if you caused it, why aren't you liable?).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, rigorous, respectful of the student's level (2L + Jurisprudence seminar). American English.
      *   *Structure:*
          1.  Introduction: Acknowledge the depth of the puzzle.
          2.  Reconstructing the Doctrine's Presuppositions (The Three Theories).
          3.  Assessment: Commitment vs. Fit vs. Underdetermination.
          4.  Literature Check (Hart & Honoré, Moore, etc.).
          5.  The Counterfactual Thought Experiment (What if we went norm-free?).
          6.  Conclusion: Defensibility.

      *   *Refining the "Causation is Normative" point:* Need to be careful. The *Restatement* says causation is factual. But *Proximate Cause* is where the norms usually hide. However, with omissions, the normativity bleeds into Cause-in-Fact. I need to highlight this bleed.
      *   *Refining the Medical Example:* The "cause of death" on a certificate vs. legal cause. Turning off the ventilator is legally an omission (withdrawal of treatment) vs. commission (lethal injection). If we go norm-free, both are but-for causes. The difference must be justification/duty.
      *   *Refining the Stranger:* If causation is norm-free, the stranger *is* a cause. The only reason they aren't liable is no duty. Current law sometimes says "not a cause." This is the key friction point.

  7.  **Final Polish:** Check against constraints. (No reading list, American English, address all parts of the prompt). Ensure the distinction between "official doctrine" (black letter) and "judicial practice" (reasoning) is clear.

      *(Self-Correction during drafting)*: I initially thought about putting Hart & Honoré front and center. But the prompt asks for the reconstruction of the *law's* picture, not just the philosophers'. I should use the philosophers to label the positions the law is flirting with.
      *   Position 1 (Omissions aren't causes): Metaphysical view.
      *   Position 2 (Neutral Causation + Duty): The Model Penal Code/Restatement formal view.
      *   Position 3 (Normative Causation): The "Common Sense" view (Hart & Honoré) which courts often actually use.

      *   *Decision:* The law *says* it wants #2, but *acts* like #3, while using the rhetoric of #1 to limit liability in hard cases.

      *   *Thought Experiment:* If we adopt strict counterfactualism (#2 strictly), the "stranger" is a cause. This forces the Duty question to be the heavy lifter. This is actually more transparent.

      *   *Defensibility:* Is it better? It's more honest, but maybe less flexible. Courts like "no causation" because it sounds like a fact, whereas "no duty" sounds like a policy choice.

  8.  **Final Review against Prompt:**
      *   Reconstruct picture of causation? Yes.
      *   Evaluate the three options (A, B, C)? Yes.
      *   Which does practice commit/fit/underdetermine? Yes.
      *   Name standard positions? Yes (Hart & Honoré, Moore, etc.).
      *   No reading list? Yes.
      *   Take norm-free theory seriously (doctrine changes)? Yes.
      *   Defensibility comparison? Yes.
      *   American English? Yes.

      *Let's write.*
answer: |-
  You have put your finger on one of the most persistent and embarrassing fractures in Anglo-American legal theory. The tension you describe—between the formal instruction that causation is a neutral, counterfactual test and the operational reality that omissions are only causes when there is a duty to act—is not a bug in your understanding; it is a feature of the doctrine's unresolved metaphysics.

  Here is the reconstruction of the picture of causation your courses presuppose, an assessment of where the doctrine actually stands, and an analysis of what would happen if we forced the law to be consistent with a norm-free counterfactual theory.

  ### I. The Three Pictures of Causation

  To reconstruct the law's presuppositions, we must look at how it handles the "but-for" test in omission cases. You identified three theoretical possibilities. Let's label them and test them against the black-letter law and judicial practice.

  **1. The Metaphysical View (Omissions Are Not Causes)**
  This is your classmate's position. It holds that causation requires a transfer of energy or a physical event. An absence is nothing; nothing cannot cause something.
  *   **Does the law commit to this?** No. If the law truly believed this, it could never convict a parent of homicide for starving a child, nor could it hold a lifeguard liable in tort. Since the law *does* impose liability for omissions in specific contexts, it cannot metaphysically rule them out as causes.
  *   **Does it fit?** It fits comfortably only when the court wants to deny liability. When a judge tells a jury that the stranger on the beach "did not cause" the death, they are borrowing this metaphysical rhetoric to avoid making a policy argument about duty. It is a convenient fiction, not a committed premise.

  **2. The Dual-Filter View (Neutral Causation + Independent Duty)**
  This is the **official black-letter doctrine** (e.g., the Restatement (Third) of Torts, the Model Penal Code). It posits that cause-in-fact is a purely factual, counterfactual inquiry (would the result have occurred but for the actor's conduct?), completely separate from the normative inquiry of duty. Under this view, the stranger on the beach *is* a but-for cause of the death (if he had jumped in, the child would live), but he escapes liability because the separate element of "duty" is missing.
  *   **Does the law commit to this?** Theoretically, yes. This is what you are taught in the first week of Torts.
  *   **Does it fit?** Poorly. In practice, courts refuse to apply the but-for test rigorously to omissions unless a duty is already established. If you ask a court, "But for the stranger's inaction, would the child be alive?" they will often say "No," not because the counterfactual is false, but because the inaction isn't legally cognizable as a cause. The doctrine claims these are separate filters, but the "causation" filter often closes automatically if the "duty" filter is open.

  **3. The Normative/Contextual View (Causation Selects the "Abnormal")**
  This view, most famously associated with **H.L.A. Hart and A.M. Honoré** in *Causation in the Law*, argues that legal causation is not just about counterfactual dependence. It is about selecting the *relevant* condition from a background of necessary conditions. We pick out the "cause" based on what is abnormal, voluntary, or wrongful against a backdrop of what is expected.
  *   **Does the law commit to this?** No, not explicitly. Courts rarely admit that "cause" is a normative judgment.
  *   **Does it fit?** Best. This explains the asymmetry perfectly. The parent's failure to act is a deviation from the expected norm (the "system"), so it is selected as the cause. The stranger's failure to act is part of the background conditions of the world, so it is not selected as the cause. The doctor turning off the ventilator is allowing the underlying disease (the cause) to take its course; the doctor injecting poison is introducing a new, abnormal cause.

  ### II. Assessment: Commitment, Fit, and Underdetermination

  If we are being precise about what the legal practice *actually* commits you to, the answer is uncomfortable: **The doctrine is genuinely underdetermined among these three, but it operates as if it accepts the Normative View while preaching the Dual-Filter View.**

  The law is committed to the **Dual-Filter View** as a matter of *structure*. You cannot get to a jury without establishing cause-in-fact. The jury instructions will define cause-in-fact using the "but-for" language (Theory 2).

  However, the law is committed to the **Normative View** as a matter of *application*. When appellate courts review omission cases, they do not treat the stranger's inaction as a factual cause that is later excused by lack of duty. They treat the inaction as *not a cause at all*. This collapses the two elements. If causation depends on whether the actor was supposed to act, then causation is not a prior factual question; it is a conclusion that follows from the duty analysis.

  The **Metaphysical View** (Theory 1) is merely rhetorical window dressing. It is used when judges want to sound like they are discovering facts rather than making policy.

  **Standard Positions in the Literature:**
  *   **Hart & Honoré:** Defend the Normative/Contextual View (Theory 3). They argue the law uses "common sense" causation, which inherently distinguishes between interventions and background conditions.
  *   **Michael Moore:** A contemporary legal philosopher who argues for a realist, metaphysical view (closer to Theory 1/2 hybrid). He criticizes the law for conflating causation with culpability, arguing we should admit omissions are causes (Theory 2) and handle the liability limits through duty or excuse, not by lying about causation.
  *   **Jerome Hall / J.L. Mackie:** Have explored the "NESS" test (Necessary Element of a Sufficient Set) and the logic of conditions, often highlighting how the law selects conditions based on normative interests.

  ### III. The Thought Experiment: A Norm-Free Counterfactual Regime

  Now, let us take the **Dual-Filter View (Theory 2)** seriously. Let us assume a regime where causation is strictly, ruthlessly counterfactual and norm-free. "But-for" means *but-for*, regardless of duty. What changes?

  **1. The Stranger on the Beach**
  *   **Current Law:** No duty; often ruled "no causation."
  *   **Norm-Free Regime:** The stranger *is* a cause-in-fact. (If he had acted, the death would not have occurred).
  *   **Doctrinal Shift:** The court must explicitly rule that there is **no duty to rescue**. It cannot hide behind "he didn't cause it."
  *   **Result:** The outcome (no liability) remains the same, but the reasoning becomes transparent. The court admits the stranger contributed to the death factually but owes the child nothing legally. This forces the legislature or court to own the moral choice of not imposing a Good Samaritan duty.

  **2. The Lifeguard**
  *   **Current Law:** Duty exists; causation found.
  *   **Norm-Free Regime:** Causation found (same as stranger). Duty found (contract/statute).
  *   **Doctrinal Shift:** Minimal change. The distinction between the stranger and the lifeguard moves entirely to the Duty element. The causal net catches both; the duty net keeps the stranger out.

  **3. The Doctor and the Ventilator**
  *   **Current Law:** Turning off the ventilator is an omission/allowing nature to take course (no cause of death). Injecting poison is an act (cause of death).
  *   **Norm-Free Regime:** Both are causes-in-fact. In both cases, but for the doctor's intervention, the patient would be alive longer.
  *   **Doctrinal Shift:** The distinction between "killing" and "letting die" collapses at the causation stage. It moves entirely to **consent and justification**.
      *   The doctor who turns off the ventilator is a *cause* of death, but acts with consent (family request) and within the standard of care (medical futility). This is a *justified* homicide or a non-actionable tort.
      *   The doctor who injects poison is a *cause* of death, without justification.
  *   **Result:** This is the most radical shift. It removes the metaphysical magic trick where we pretend the machine killed the patient, not the doctor. It admits the doctor killed the patient but argues it was the *right* thing to do.

  ### IV. Defensibility: Is the Norm-Free Regime Better?

  If we adopted this strict counterfactual view, would the law be more defensible?

  **Arguments for "Yes" (More Defensible):**
  1.  **Intellectual Honesty:** It stops courts from lying to juries. Telling a jury the stranger "didn't cause" the death is confusing; they know physically he could have saved the child. Telling them "he caused it, but the law doesn't require him to save strangers" is clearer.
  2.  **Focus on Policy:** It forces the Duty analysis to do the heavy lifting. If we want to limit liability for omissions, we should argue about the scope of duty (policy, morality, economics), not hide behind a cramped definition of causation.
  3.  **Medical Clarity:** It clarifies end-of-life decisions. It acknowledges that withdrawing life support is an active decision that causes death, which requires robust consent protocols, rather than pretending the doctor is merely "stepping aside."

  **Arguments for "No" (Less Defensible):**
  1.  **Over-expansion of Causation:** In a hyper-connected world, we are all but-for causes of infinite harms. If I didn't buy a coffee this morning, I would have had the money to donate to a charity that saves a life. Am I a cause of that death? A norm-free theory risks making "causation" so ubiquitous it loses its meaning as a limiting principle.
  2.  **Jury Confusion:** Juries may struggle to understand how someone can be a "cause" but not "liable." The current conflation (no duty = no cause) provides a heuristic that leads to the "correct" result without requiring laypeople to parse complex normative theory.
  3.  **Moral Distinctions:** There is a deep moral intuition that *doing* harm is different from *allowing* harm. The current doctrine preserves this distinction at the causation level. Moving it all to "justification" might erode the special protection we feel should attach to non-interference.

  ### Conclusion

  The doctrine you are studying is a compromise. It officially teaches you the **Dual-Filter View** (causation is fact, duty is norm) because it provides a clean analytical structure for exams and jury instructions. However, it operationally relies on the **Normative View** (causation selects the wrongful deviation) because that is the only way to make sense of omission liability without imposing universal liability on every bystander.

  Your classmate is metaphysically provocative but legally wrong; the law *does* treat omissions as causes, but only when it wants to. If you forced the law to adopt the norm-free counterfactual theory, you would not necessarily change the *outcomes* of the cases (the stranger still goes free, the parent is still liable), but you would radically change the *justifications*. You would trade a muddled metaphysics for a transparent morality. Whether that is an improvement depends on whether you value doctrinal purity over the heuristic simplicity that allows juries to function.

  For your seminar, the strongest position is likely this: The law *pretends* causation is norm-free to maintain the illusion of objective fact-finding, but it *requires* causation to be normative to prevent the collapse of the duty requirement. The "asymmetry" you see is the seam where the pretense meets the practice.
