answer: |-
  Here is a decision procedure designed for your constraints: no lab, two hours, high political stakes. It is built on the ontological distinction between objects where history matters (autographic) and objects where instance matters (allographic), but it translates that into checklist questions.

  ### The Registrar's Ontology Check (ROC)

  **Time Limit:** 120 Minutes.
  **Inputs:** Object, Accession File, Visual Inspection, Existing Labels.
  **Output:** A classification status and a draft label paragraph.

  #### Step 1: The Ontology Filter (15 Minutes)
  **Question:** Is the identity of this work tied to the *specific physical history* of this object, or is it tied to a *pattern/instruction*?
  *   **Test:** If I destroyed this object and made a perfect physical duplicate using the same techniques, would art history consider it the *same work*?
      *   **No (Autographic):** Painting, unique sculpture, manuscript, hand-woven textile. The history of production is part of the work. *Proceed to Step 2.*
      *   **Yes (Allographic/Serial):** Printed book, photograph (modern edition), cast bronze (if part of a numbered/authorized edition), digital media. The specific physical instance matters less than authorization. *Skip to Step 4.*
  *   **Edge Case (Ancient Fake):** If an object was made in 200 AD to look like 500 BC, it is Autographic to 200 AD. The "work" is the 200 AD act of deception.
  *   **Edge Case (Living Tradition):** If the culture of origin views the object as a vessel for a spirit or function that is renewed (e.g., certain ritual masks), the "original" is the current authorized version. Defer to source community documentation. If none exists, treat as Autographic.

  #### Step 2: The Deception Audit (30 Minutes)
  **Question:** Was there an intent to deceive regarding the history of production at the time of the object's creation or modification?
  *   **Check:** Look for anachronistic signatures, materials that don't match the period, or provenance gaps that coincide with market spikes.
  *   **Decision:**
      *   **Deception Confirmed:** It is a **Forgery**. (Even if aesthetically perfect).
      *   **No Deception (Honest Copy):** It is a **Replica/Copy**. (e.g., 19th-century Grand Tour copy sold as such).
      *   **Later Alteration:** (e.g., signature added later). This is **Forgery of Attribution**, even if the base object is period-correct.
  *   **The Fear Audit:** Are you marking this as "Forgery" because you have evidence, or because the donor is difficult? If the evidence is circumstantial but the donor is powerful, mark this step **"Probable Forgery (Unproven)"** and move to Step 5 (Labeling). Do not let donor pressure change a "Yes" to a "No" here. That is fraud.

  #### Step 3: The Integrity Threshold (45 Minutes)
  **Question:** For Autographic objects: Does the surviving original material carry the *significant form* of the work?
  *   **Context:** This addresses your restored marble and over-painted panels.
  *   **Test:** Identify the "locus of expression." Where does the artistic decision-making reside? (e.g., The face of a portrait, the brushwork of an impasto, the inscription of a manuscript).
  *   **Decision:**
      *   **Locus Intact:** Original material holds the key artistic decisions. **Status: Original.**
      *   **Locus Compromised:** Key expressive areas are later restoration/replacement. **Status: Composite.**
      *   **Locus Lost:** The object is mostly later material built around a fragment. **Status: Pastiche/Revival.**
  *   **Judgment Call:** This is not a percentage game. A statue with a new nose is still original. A statue with a re-carved expression to suit 18th-century taste is a Hybrid. If the restoration imposes a *new aesthetic intent* over the old one, the integrity is broken.

  #### Step 4: The Authorization Check (For Allographic/Serial) (15 Minutes)
  **Question:** Is this instance authorized by the rights holder, estate, or original production protocol?
  *   **Test:** For bronzes: Is it from the artist's lifetime or foundry? For prints: Is it from the original plate before death/cancellation?
  *   **Decision:**
      *   **Authorized:** **Status: Original Impression/Cast.**
      *   **Unauthorized (Posthumous/Later):** **Status: Later Cast/Impression.**
      *   **Note:** A posthumous cast is not a "fake," but it is not the "original work" in the same ontological sense. It is a reproduction of the form without the artist's causal history.

  #### Step 5: The Transparency Valve (15 Minutes)
  **Question:** Can we tell the viewer the truth without destroying the object's utility?
  *   **Constraint:** If the object is a "Star," the Director will resist ambiguity.
  *   **Rule:** If Steps 2 or 3 yielded "Forgery," "Composite," or "Later Cast," you *must* disclose this in the label.
  *   **The Fear Audit:** If you are tempted to use vague language like "Attributed to" or "Style of" to hide a Step 2 "Deception Confirmed," stop. That is institutional cowardice. Use "Forgery" or "Falsely Signed."
  *   **Exception:** Facsimiles. If the object is a copy made *for preservation* (Step 1 Autographic, but Step 5 Transparency is 100%), it can be displayed as a **Facsimile**. It cannot be displayed as an **Original**.

  ---

  ### Application to Your Cases

  Here is the procedure running on your three specific examples.

  #### Case 1: The 18th-Century Restored Marble Head
  *   **Step 1 (Ontology):** Autographic. The specific chisel marks of the ancient sculptor constitute the work.
  *   **Step 2 (Deception):** No active deception *initially* (common practice then), but displaying it now as "Ancient Greek" without qualification deceives the current audience.
  *   **Step 3 (Integrity):** You state 1/3 of the surface is later, including the nose and re-carving.
      *   *Locus of Expression:* In portrait busts, the face *is* the locus of expression. If the nose and surface modeling are 18th-century idealizations, the *expression* is 18th-century, not Ancient.
      *   *Verdict:* **Composite.** The core is ancient, the artistic intent visible to the viewer is largely 18th-century.
  *   **Step 5 (Transparency):** Cannot be labeled "Greek, 4th Century BC."
  *   **The Unwelcome Truth:** This is likely your "Star Object." The procedure dictates you cannot call it an Ancient Greek Original. It is an **Ancient Fragment with 18th-Century Restoration.**
  *   **Defensible Paragraph:** *"Marble head, core dating to 4th Century BC; significant restoration and re-carving of facial features executed circa 1750. Displayed as an example of 18th-century engagement with antiquity."*
  *   **Director's Fit:** He loses the "Greek Masterpiece" headline. He gains an "History of Collecting" narrative. Stand firm on Step 3: if the expression is later, the work is not wholly ancient.

  #### Case 2: 17th-Century Panel with 1900 Signature
  *   **Step 1 (Ontology):** Autographic.
  *   **Step 2 (Deception):** Signature added c. 1900. This is an intent to deceive regarding authorship to inflate value.
      *   *Verdict:* **Forgery of Attribution.**
  *   **Step 3 (Integrity):** The painting is fine (17th Century). The *attribution* is the lie.
  *   **Step 5 (Transparency):** Must remove the famous name from the main label line.
  *   **Defensible Paragraph:** *"Oil on panel, 17th Century. Signature added c. 1900. Previously attributed to [Master], now classified as School of [Region]."*
  *   **Note:** This is easier to defend than the Marble. You aren't calling the object fake, you are calling the *signature* fake. The art remains; the brand is removed.

  #### Case 3: Manuscript Facsimile Gallery
  *   **Step 1 (Ontology):** Autographic (Manuscripts are unique).
  *   **Step 2 (Deception):** None. Intent is preservation.
  *   **Step 3 (Integrity):** N/A (It is a new object).
  *   **Step 5 (Transparency):** High.
  *   **Verdict:** **Acceptable Facsimile.**
  *   **Condition:** The label must explicitly state "Facsimile." If the label says "Book of Kells" without "Facsimile," you fail Step 5.
  *   **Defensible Paragraph:** *"High-resolution facsimile produced 2020. Original held in [Location]. Displayed to prevent light damage to fragile pigments."*
  *   **Note:** This is the only case where "Not Original" is a positive ethical good.

  ---

  ### The "Institutional Fear" Audit
  You asked me to be honest about where your criteria are just fear. Here is where registrars usually lie to themselves:

  1.  **"It's still mostly original."** (The 51% Rule).
      *   *Reality:* This is fear of deaccessioning or downgrading. If the 49% that is gone contains the *signature style* (e.g., the brushwork, the face), the object is ontologically compromised. Do not use percentages. Use "Locus of Expression."
  2.  **"The donor believes it's real."**
      *   *Reality:* This is fear of conflict. The donor's belief is irrelevant to the ontology. If Step 2 confirms deception, the object is a forgery regardless of the donor's feelings. Labeling it "Attributed to" to spare feelings is professional negligence.
  3.  **"It teaches the same lesson."**
      *   *Reality:* This is fear of empty gallery walls. A forgery teaches a lesson about *forgery*. An original teaches a lesson about *history*. They are different lessons. Do not conflate them to keep a display full.

  ### Final Decision Template (For the Board)
  When the Board asks why you downgraded a star object or rejected a loan, use this structure. It isolates the philosophy from the politics.

  > **Object:** [Name/ID]
  > **Classification:** [Original / Composite / Facsimile / Forgery]
  > **Reasoning:**
  > 1.  **Ontological Status:** This work is autographic; its value relies on the history of its physical production.
  > 2.  **Material Evidence:** [X]% of the visible surface dates to [Later Period], specifically in the [Locus of Expression, e.g., face/signature].
  > 3.  **Ethical Requirement:** Museum ethics require we distinguish between the historical artifact and later modifications to prevent audience deception.
  > 4.  **Decision:** We are displaying this as [Classification] to accurately represent the [Period] artistic intent rather than the [Later Period] alteration.

  This protects you. It frames the decision not as "I think this is fake" (opinion), but "The material history does not match the claim" (fact + policy).

  ### Summary of the Hard Truth
  The **Marble Head** is your problem. In the art market, that object is sold as "Ancient." Under this procedure, it is an **18th-Century Sculpture incorporating Ancient Fragments.** If your museum claims it is a Greek Original, you are lying to the public. The procedure forces you to label it as a hybrid. The Director will hate this because it lowers the prestige. Your defense is that an 18th-century pastiche is historically interesting on its own terms, but it must not be misidentified. If you cannot make that label change, you are not a registrar; you are a marketing agent.
