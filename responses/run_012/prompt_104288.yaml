          *   Must address forgery vs. honest reproduction (intent/transparency).
          *   Must handle edge cases (ancient fakes, copies of lost originals, over-restoration, living traditions).
          *   Must identify where "institutional fear" masks itself as principle.
          *   Must apply the procedure to three specific cases (Marble, Signature, Facsimile).
          *   Must include at least one "unwelcome truth" (a star object needs a downgraded label).
          *   No citations/reading lists. No hedging ("it depends") without specifying *what* judgment is needed.
