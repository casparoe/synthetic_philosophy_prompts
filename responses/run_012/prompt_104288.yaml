      *   *Dutton (Artistic Crimes):* Forgery is about deception regarding history of production. A perfect fake is aesthetically similar but ontologically different because it lacks the correct causal history.
      *   *Brandi (Restoration):* Restoration should not falsify the historical testimony. Distinguish between aesthetic unity and historical truth.
      *   *Benjamin (Aura):* (Less useful here, too metaphysical).
      *   *Curatorial Ethics:* Transparency is key. Labeling is the ethical buffer.

  3.  **Drafting the Procedure (The "Registrar's Ontology Check"):**
      *   *Constraint:* 2 hours, no lab. This means relying on provenance, visual inspection, and existing documentation, not scientific testing.
      *   *Structure:* A series of gates. Pass/Fail/Handoff.
      *   *Gate 1: Category Check.* Is this autographic or allographic? (Crucial distinction).
      *   *Gate 2: Intent/Deception.* Was deception involved? (Forgery vs. Copy).
      *   *Gate 3: Material Continuity.* How much original material remains? (Restoration/Alteration).
