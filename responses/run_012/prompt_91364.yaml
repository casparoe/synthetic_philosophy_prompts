answer: |-
  This is a great question. You're sensing a disconnect because your friend is describing **neoclassical consumer theory** (the stuff taught in Econ 101/Intermediate Micro), while your rationalist background is steeped in **decision theory** (Von Neumann-Morgenstern, Bayesian updating, AI alignment).

  They use the same word ("utility"), but they are doing fundamentally different jobs. Your friend's explanation is a "just-so story" that captures the vibe of modern microeconomics but gets the history, the philosophy, and the current status wrong in specific ways.

  Here is the claim-by-claim breakdown, followed by the circularity problem and the rationalist/econ disconnect.

  ### Part 1: Claim-by-Claim Autopsy

  **Claim 1:** *"Utility is basically the economist's word for happiness, or how satisfied you are."*
  *   **Verdict:** **Wince.**
  *   **The Econ Reality:** This was true in the 19th century (Bentham, Edgeworth), who viewed utility as "hedonic utils" (psychological pleasure). Modern economics is officially **agnostic** about mental states. Utility is a formal representation of *preference*, not necessarily happiness. You can have a utility function for self-destructive behavior. Economists care that you satisfy your preferences, not that those preferences make you "happy" in a psychological sense.

  **Claim 2:** *"Samuelson came up with 'revealed preference'... If someone buys the apple and not the orange, that tells you the apple gives them more utility, full stop."*
  *   **Verdict:** **Accurate.**
  *   **The Econ Reality:** This is the core of **Revealed Preference Theory (RPT)**. Paul Samuelson (1938) wanted to purge psychology from economics. In this framework, "utility" is not a hidden engine driving the choice; it is a mathematical score assigned *after the fact* to describe the choice. $U(Apple) > U(Orange)$ is simply code for "Apple was chosen over Orange."

  **Claim 3:** *"People used to think utility was a real measurable quantity like temperature, but the ordinalist revolution showed that was unscientific..."*
  *   **Verdict:** **Accurate.**
  *   **The Econ Reality:** This refers to the shift from **Cardinal Utility** (measurable intensity, like 10 utils vs. 5 utils) to **Ordinal Utility** (ranking only, 1st vs. 2nd). Hicks and Allen (1930s) showed you can build all of demand theory just knowing the ranking, without knowing the "distance" between preferences.

  **Claim 4:** *"...nowadays utility is just a ranking, and the numbers have no meaning at all, they're arbitrary."*
  *   **Verdict:** **Accurate (with a major caveat).**
  *   **The Econ Reality:** In standard consumer theory, utility functions are unique only up to a **positive monotonic transformation**. If $U(x) = x^2$ represents your preferences, so does $V(x) = \ln(x)$, provided the ordering stays the same. The *numbers* don't matter, only the order.
  *   **The Caveat:** This is **false** in the context you know (Rationalist/AI). **Von Neumann-Morgenstern (VNM) utility** (used in game theory and decision theory) *is* cardinal in a specific sense. It is unique up to a **positive affine transformation** ($U' = aU + b$). This allows VNM utility to handle risk and uncertainty (intensity of preference), which standard ordinal utility cannot. Your friend is conflating Micro 101 with Decision Theory.

  **Claim 5:** *"That's why economists roll their eyes at happiness surveys."*
  *   **Verdict:** **Wince.**
  *   **The Econ Reality:** Traditional microeconomists might, but this is outdated. The field of **"Happiness Economics"** (e.g., Daniel Kahneman, Angus Deaton, Bruno Frey) is robust and respected. They distinguish between "decision utility" (what you choose) and "experienced utility" (how it felt). Economists don't roll their eyes; they just treat them as different data sets.

  **Claim 6:** *"The theory got confirmed because it predicts demand curves slope downward..."*
  *   **Verdict:** **Wince.**
  *   **The Econ Reality:** This is backwards. Downward-sloping demand is a *derivation* from the theory (specifically, the Slutsky equation), not the primary confirmation. Also, **Giffen goods** (where demand rises as price rises) are theoretically possible and empirically observed in specific contexts. The theory is valued because it provides a constrained framework for modeling behavior, not because it predicts a specific slope in every single case.

  **Claim 7:** *"...behavioral economics... proved everyone's irrational, so the whole thing is basically dead now."*
  *   **Verdict:** **Wrong.**
  *   **The Econ Reality:** Behavioral economics showed that humans systematically violate the **axioms** of expected utility theory (e.g., framing effects, loss aversion, time inconsistency). It did *not* kill the framework; it **bounded** it. Standard utility theory is still the "null hypothesis." It works remarkably well for market-level data, high-stakes decisions, and experienced agents. It's like Newtonian physics: we know it's not fundamentally true (General Relativity is), but we still use it to build bridges.

  **Conclusion:** *"So the whole thing is basically dead now."*
  *   **Verdict:** **Does Not Follow.**
  *   Utility maximization remains the dominant modeling language in economics. Behavioral econ is usually modeled *as* a modification of utility functions (e.g., adding a "loss aversion" term to the utility function), not a rejection of optimization itself.

  ---

  ### Part 2: The Circularity Problem

  You asked: *The move "he chose it, so he must have preferred it" always struck me as suspiciously convenient. Is there a real circularity problem there?*

  **Yes, there is circularity, but it's a feature, not a bug.**

  If you view utility as a **psychological cause** (a little homunculus inside the brain calculating values), then Revealed Preference is indeed a tautology:
  > "Why did he choose the apple?" -> "Because he had higher utility for it."
  > "How do you know he had higher utility?" -> "Because he chose it."

  This explains nothing about *why* the choice happened.

  However, economists (specifically the Friedman/Chicago school) argue that this doesn't matter. They treat utility maximization as an **"as-if" model**. They don't claim people *actually* calculate derivatives in their heads. They claim that if people act *as if* they are maximizing a consistent function, we can predict their future behavior under new constraints (prices/incomes).

  **The testable part isn't the utility; it's the consistency.**
  Revealed Preference becomes scientific when you look at **multiple choices over time**.
  1.  If you choose Apple over Orange today...
  2.  And you choose Orange over Banana today...
  3.  Then you *must* choose Apple over Banana tomorrow (Transitivity).
  4.  And if the price of Apples drops, you shouldn't suddenly buy fewer Apples (Weak Axiom of Revealed Preference).

  If you violate these consistency axioms, the "utility function" model breaks. Behavioral economics found that people *do* violate these (e.g., preference reversals). So the circularity is only a problem if you claim the theory explains *everything*. Economists claim it explains *constrained, consistent* behavior.

  ---

  ### Part 3: The Rationalist vs. Econ Disconnect

  This is likely why your friend's explanation felt "off" to you. You are operating with two different definitions of Utility.

  | Feature | **Economic Utility (Hicksian/Ordinal)** | **Rationalist Utility (VNM/Cardinal)** |
  | :--- | :--- | :--- |
  | **Primary Use** | Predicting market demand / consumer choice. | Decision making under uncertainty / AI Alignment. |
  | **Measurement** | Ordinal (Ranking only). | Cardinal (Intensity matters for risk). |
  | **Transformation** | Positive Monotonic ($f(x)$). | Positive Affine ($ax + b$). |
  | **Uncertainty** | Handled clumsily (expected utility is an add-on). | Built-in (the whole point is Expected Utility). |
  | **Normativity** | Descriptive (mostly). "What do they do?" | Normative (mostly). "What *should* they do?" |
  | **Status** | A tool for modeling behavior. | A coherence theorem for rationality. |

  **The "Off" Feeling:**
  Your friend told you utility is "just a ranking" and "numbers have no meaning."
  *   In **Microeconomics**, he is right. If I prefer $10 to $5, I don't need to know *how much more* I prefer it to predict I'll take the $10.
  *   In **Rationalism/AI**, he is wrong. If you are building an AI or making decisions under risk, the *magnitude* of the utility difference matters immensely. A VNM utility function of 100 vs 50 implies a very different risk tolerance than 100 vs 99.

  **Why the friend thinks it's "dead":**
  Because behavioral econ proved humans aren't *good* at being VNM rationalists. We have framing effects, we discount hyperbolically, we violate independence axioms.
  *   **Friend's take:** "Humans violate utility axioms, so utility theory is false."
  *   **Econ take:** "Humans violate utility axioms, so we need to adjust the model or limit its domain."
  *   **Rationalist take:** "Humans violate utility axioms, so humans are irrational and should try to align better with coherence theorems to avoid being Dutch Booked."

  ### Summary for your pushback

  1.  **Utility $\neq$ Happiness:** It's preference satisfaction, often devoid of emotional content.
  2.  **Not Dead:** Behavioral econ modified the theory; it didn't burn it down. It's still the lingua franca of social science.
  3.  **Circularity:** It's definitionally circular regarding *single* choices, but empirically testable regarding *consistency* across multiple choices.
  4.  **The Real Disconnect:** Your friend is talking about **Ordinal Consumer Theory** (ranking apples vs. oranges). You are thinking of **VNM Expected Utility** (making bets under uncertainty). In your context, the numbers *do* matter, and the theory is prescriptive (how to be rational), whereas in his context, it's descriptive (how people behave).

  Your friend isn't wrong about the *history* of microeconomics, but he's wrong about the *status* of the field, and he's describing a different branch of utility theory than the one you use for rationality.
