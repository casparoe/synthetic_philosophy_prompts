      *   *Section 3: The Circularity Problem.* This is crucial. Explain that RPT isn't trying to explain psychology; it's trying to constrain behavior. The "circularity" is only a problem if you think utility is a *cause* rather than a *description*.
      *   *Section 4: Rationalist vs. Econ Utility.* This is the "aha" moment for the user. Rationalists treat utility as a *target* for optimization (CEV). Economists treat it as a *tool* for prediction. This explains the disconnect.

