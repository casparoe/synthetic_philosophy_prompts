      *   *Rule-Following Considerations (RFC):* Meaning isn't determined by internal mental states or dispositions alone. There is no fact of the matter about what rule I am following based solely on my past behavior or internal feeling. Meaning is normative and social. "Obeying a rule" is a practice.
      *   *Private Language Argument (PLA):* A language whose words refer solely to the speaker's immediate private sensations (which cannot be known by others) is impossible. Why? Because there is no criterion of correctness. I can't distinguish "remembering correctly" from "seeming to remember correctly." Meaning requires public criteria and checkability.
