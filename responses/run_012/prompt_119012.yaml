  2. By having the culprits actively construct false alibis to eliminate rival hypotheses, the text reveals a vulnerability in eliminative induction where the phenomenon itself curates the evidence base to make the true explanation appear as the only survivor rather than the most probable.
  3. Poirot's presentation of two solutions illustrates the distinction between IBE as a private method of discovery, which tolerates complex coherence, and as a public tool of justification, which defaults to the socially legible simplicity required by legal institutions.
  4. The tension between the tidy false solution and the messy true one exposes how explanatory virtues are not neutral metrics but rhetorical choices, where simplicity serves institutional closure while complexity serves factual accuracy.
  5. Poirot collapses the distinction between the best and the only explanation by showing that when rivals are artificially eliminated, the surviving hypothesis is valid not because it is simple, but because it is the only one capable of accounting for the curation of the evidence itself.
