  ### Rational Reconstruction of R's Moral Principles

  To reconstruct R's decision procedure, we must identify principles that are consistent with her four prior verdicts while remaining structurally distinct. The data shows she rejects aggregation when harms differ in magnitude or quality (i–iii) but accepts it when harms are identical (iv). She explicitly denies that small harms "add up" to a larger harm of a different sort.

  Here are three candidate rules that fit the record (i) through (iv) equally well:

  **1. The Peak-Intensity Threshold Rule**
  *   **Principle:** There is a lexical hierarchy based on the maximum instantaneous severity of an experience. If the single harm exceeds the distributed harm in peak intensity, the single harm must be prevented, regardless of numbers. Aggregation is only permitted when the peak intensities are equal. Duration is irrelevant to the threshold; it only matters for total utility if the intensities are already equal.
  *   **Fit with Record:** In (i)–(iii), the single victim's peak suffering (torture, migraine, headache) exceeds the distributed victim's peak (dust, pinprick, itch). In (iv), peak intensities are equal, so numbers count.
  *   **Status:** Standing.

  **2. The Individual Complaint Rule**
  *   **Principle:** Moral priority is determined by the strength of an individual's standing to complain. A person's standing is a function of the total setback to their welfare (intensity × duration). We must satisfy the strongest individual complaint. If complaints are of equal strength, we count the number of complainants.
  *   **Fit with Record:** In (i)–(iii), the single victim's total burden (and thus complaint strength) vastly exceeds that of any single distributed victim. In (iv), the burdens are identical, so the billion complaints outweigh the one.
  *   **Status:** Standing.

  **3. The Qualitative Identity Rule**
  *   **Principle:** Aggregation is permissible only between tokens of the exact same phenomenological kind. If the harms differ in quality (e.g., torture vs. dust, headache vs. itch), they are incommensurable, and the worse qualitative harm must be prevented regardless of numbers. If the harms are qualitatively identical, aggregation proceeds.
  *   **Fit with Record:** In (i)–(iii), the harms are qualitatively distinct. In (iv), they are identical (headache vs. headache). R's stated reason in (iii) ("do not add up to a headache") explicitly supports this.
  *   **Status:** Standing.

  ### Predictions on the New Case

  **The Case:** Option A (1 person, moderate migraine, 1 day) vs. Option B (1 billion people, faint itch, 30 years).

  *   **Peak-Intensity Threshold Rule:** Predicts **Option A**. The peak intensity of a migraine exceeds the peak intensity of a faint itch. The duration of the itch (30 years) does not raise its intensity to the level of a migraine. The threshold is not crossed.
  *   **Individual Complaint Rule:** Predicts **Option B**. A faint itch experienced continuously for 30 years likely constitutes a greater total welfare loss (and thus a stronger individual complaint) than a migraine lasting one day. The individual itcher has more standing to resent their fate than the migrainer.
  *   **Qualitative Identity Rule:** Predicts **Option A**. A migraine and a scalp itch are phenomenologically distinct kinds of harm. They do not "add up" across persons because they are not the same token type. The worse qualitative harm (migraine) takes precedence.

  ### Best Guess at R's Verdict

  I predict R will choose **Option A (Prevent the Migraine)**.

  **Reasons for Preference:**
  My reconstruction favors the **Qualitative Identity Rule** (closely followed by the Peak-Intensity Rule) over the Individual Complaint Rule. The decisive evidence is R's explicit reasoning in case (iii). She did not say the billion itches were "less burdensome" than the headache; she said they "do not add up to a headache." This language signals a barrier of *kind*, not just quantity.

  If R were tracking total burden (Individual Complaint), the duration of the harm should eventually trigger aggregation. A 50-year itch might outweigh a 1-minute headache in total burden. However, R's "strong anti-aggregation instincts" suggest she views the *character* of the suffering as the primary moral unit. To her, a lifetime of itching is still just itching; it does not metamorphose into a migraine. The Friend's suggestion (that she tracks standing to resent) is plausible, but R's own explanations point toward a deontological constraint on comparing unlike harms rather than a calculus of resentment.

  ### What the Choice Turns On

  The choice between the rival rules (Peak-Intensity/Qualitative vs. Individual Complaint) turns on **whether duration is morally transformative.**

  *   For the **Individual Complaint Rule**, duration is transformative. A sufficiently long duration can turn a "trivial" harm into a "serious" burden, granting the victim stronger standing to complain than a victim of a short, intense harm.
  *   For the **Peak-Intensity/Qualitative Rules**, duration is inert regarding aggregation thresholds. Time extends the harm, but it does not change its *rank* in the hierarchy of suffering. A long itch remains lexically inferior to a short migraine.

  The deeper structural question is whether the operative quantity is the **momentary state** of the sufferer or the **narrative burden** on their life. R's record suggests she prioritizes the momentary state (the "worst thing happening to anyone right now") over the integrated life-burden.

  ### The Decisive Further Case

  To separate the surviving rules (specifically, to distinguish the **Peak-Intensity Rule** from the **Qualitative Identity Rule**, since both predict Option A in the New Case), I propose the following case:

  **The Case of Calibrated Dissimilarity:**
  *   **Option A:** One person suffers a specific, sharp cutting pain in their finger for one hour (calibrated to severity level 5 on a standard pain scale).
  *   **Option B:** One billion people suffer a specific, burning heat pain on their forearm for one hour (calibrated to the exact same severity level 5 on the same pain scale).
  *   **Stipulation:** We stipulate by fiat that the subjective intensity and duration are identical, but the phenomenological quality (cutting vs. burning) is distinct.

  **Predictions:**
  *   **Peak-Intensity Rule:** Predicts **Option B**. Since the intensity and duration are equal, the lexical barrier is removed. Aggregation is permitted, and the billion outweigh the one.
  *   **Qualitative Identity Rule:** Predicts **Option A**. Since the *kind* of pain (cutting vs. burning) is not identical, aggregation is forbidden. The single victim's harm cannot be outweighed by unlike harms, even if intensities match.

  This case isolates whether R's barrier is about *magnitude* (Intensity) or *type* (Kind).

  ### Weakness and What Would Move Me

  **Weakest Point:** My reasoning relies heavily on R's verbal reports ("do not add up to a headache") being accurate descriptions of her underlying cognitive process. Philosophers often rationalize intuitive verdicts with principles they do not actually follow. It is possible R is actually following the **Individual Complaint Rule** but fails to recognize that 30 years of itching constitutes a heavier burden than a day of migraine. She may intuitively underestimate the cumulative weight of long-term minor annoyances.

  **What Would Move Me:** If R were presented with the **New Case** (30-year itch vs. 1-day migraine) and chose **Option B (Prevent the Itches)**. This would falsify the Peak-Intensity and Qualitative Identity Rules (unless she argues 30-year itch becomes a *new kind* of harm). It would strongly confirm the Individual Complaint Rule, proving that for R, duration *is* transformative and that she tracks total lifetime burden rather than peak experience. Alternatively, if she chose **Option B** in the **Calibrated Dissimilarity Case**, it would prove she tracks Intensity, not Qualitative Kind.
