  I am preparing a graduate seminar session on a contrast that I think is under-discussed in its fine structure: the KK principle, on the one hand, and the luminosity of conditions, on the other. I would like a careful comparison written for readers who already know the standard moves and want the joints rather than a survey. Please do not pad the answer with the history of the debate; I care about how the two principles are actually shaped and how they bear on one another.

  By the KK principle I mean the claim that whenever a subject knows that p, that subject knows that they know that p. By a luminous condition I mean a condition C such that, whenever a subject is in C, that subject is in a position to know that they are in C. Read being in a position to know in the weak, ability-style sense: it does not require that the subject actually knows, only that the relevant knowledge is available to them. I want these treated as the two items under comparison, with the KK principle and luminosity each stated precisely enough that their formal shapes can be inspected side by side.

  I also want a third item brought into the comparison, because I suspect it is where the real work lies. Consider what I will call the bridge principle: whenever a subject is in a position to know that p, that subject is in a position to know that they are in a position to know that p. This is the KK principle rewritten for the position-to-know operator rather than for knowledge. I would like the bridge principle assessed alongside the other two, since I take it to sit between them in ways worth making explicit.

  Please address the following, in this order. First, state each of the three items in a canonical form and say exactly what each quantifies over (subjects, propositions, conditions, or operators) and whether each is an iteration principle on a single operator or a property predicated of conditions. Second, compare the KK principle and luminosity along the dimensions that matter: the operator involved, the strength of the cognitive relation demanded, whether the principle is about a single proposition or a class of conditions, and whether either can hold while the other fails. Third, work out the entailment relations among all three items — in particular whether the KK principle entails the luminosity of the condition of knowing that p, whether luminosity entails the KK principle, and how the bridge principle relates to each. Where an entailment holds, give the argument; where it fails, give a counterexample. Fourth, explain how margin-for-error and safety considerations bear on each of the three, and say whether the standard anti-luminosity argument can be redirected at the KK principle and at the bridge principle without loss. Fifth, say which of the three you regard as most defensible and which as least, and identify the deepest asymmetry between the KK principle and luminosity.

