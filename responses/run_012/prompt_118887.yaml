  **EQUIPROB LIFE LTD.**
  *Secure Your Existence Before It Begins.*

  **POLICY SUMMARY AND TERMS OF COVERAGE (VERSION 9.4)**

  **1. Underwriting and Premium Assessment**
  1.1. **The Equiprobability Principle:** Premiums are calculated on the basis that every applicant holds an identical probability of occupying any future policyholder's position within the insured pool.
  1.2. **Aggregate Welfare Maximization:** To ensure actuarial fairness behind the veil of ignorance, payouts are structured to maximize the arithmetic mean of expected utility across all possible identity draws. Individual variance is treated as portfolio risk.

  **2. Comparability and Measurement**
  2.1. **Standardized Utility Units (SUUs):** All claims must be quantified on a single cardinal scale.
  2.2. **Incommensurability Waiver:** Should a policyholder insist their suffering cannot be compared to another's joy, the assessor will assign a default coefficient of 1.0. Refusal to accept the common scale constitutes a breach of contract, voiding coverage.

  **3. Temporal Binding**
  3.1. **Ex Ante Validity:** This contract is binding prior to the identity draw.
  3.2. **Ex Post Regret Exclusion:** The Firm declines claims based on post-realization preferences. Statements such as "Had I known I would be born into this caste, I would have opted out" are inadmissible. Consent is inferred from the rational choice behind the veil.

  **4. Exclusions**
  4.1. **Positional Deprivation:** No payout is made for losses consisting solely of ranking below other policyholders. Envy is not an insured peril.
  4.2. **Identity Risk:** Losses resulting from drawing a naturally low-capacity identity are covered only insofar as they reduce the pool's average.

  ***

  **CLAIMS DEPARTMENT FORM LETTER (REF: LOW-DRAW-882)**

  Dear Policyholder,

  We have reviewed your claim regarding severe congenital hardship. While we acknowledge your realized utility is critically low, our actuaries confirm that your condition was offset by the substantial surplus generated by Policyholders 104–500. Under Clause 1.2, your sacrifice was necessary to maximize the expected welfare of the pre-birth applicant. Your contribution to the aggregate has been noted with gratitude. Please find enclosed a voucher for standardized comfort care, redeemable at any approved facility.

  Sincerely,
  *The Claims Adjustment Committee*

  ***

  **NOTICE FROM COMPETITOR: RAWLSIAN INDEMNITY PLC.**

  **STOP!** Did you sign with EquiProb?
  They assume you are **risk-neutral** about who you turn out to be. No rational agent behind the veil would accept a lottery over their own basic liberties just to boost the average. We offer the **Maximin Rider**: we guarantee the highest possible floor for the worst-off identity, no matter the cost to the aggregate. Don't gamble your soul on a sum.

  ***

  **ADVERTISEMENT: POPULOUS MUTUAL**

  **MORE LIVES = LOWER PREMIUMS!**
  Why limit the pool? Our new **Total Headcount Model** prices policies based on the sum total of utility across all existence. The more people we insure, the cheaper your rate becomes, even if individual payouts diminish. Join the expansion today!

  ***

  Bottom line: The entire portfolio rests on the unproven assumption that rational agents are risk-neutral regarding their own identity.
