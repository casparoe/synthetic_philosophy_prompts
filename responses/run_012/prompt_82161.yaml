answer: |-
  ### The opening questions

  When you assert "the probability of this single event is X," where does the difficulty lie? Is the trouble that you cannot identify what kind of fact would make the statement true (a problem of meaning)? Is the trouble that you know what would make it true but cannot decide which of your many true beliefs to use as evidence (a problem of justification)? Or is the trouble that the "correct" class depends entirely on what you intend to do with the number (a problem of utility)? Your answer determines whether you are solving a semantic, epistemic, or pragmatic problem.

  ### The tree

  *   **1. Where does the ambiguity primarily arise?**
      *   **A. In the meaning of the probability claim itself.**
          *   **1. Does a single event possess a truth-apt probability value?**
              *   **No, only ensembles do.** → *Leaf 1*
              *   **Yes, it is a mind-independent physical property.** → *Leaf 2*
              *   **No fact of the matter, but direct inference remains valid.** → *Leaf 3*
      *   **B. In the rules for selecting evidence from total knowledge.**
          *   **1. Are there objective constraints on class selection?**
              *   **No, only coherence constraints on the agent.** → *Leaf 4*
              *   **Yes, the world constrains the choice.**
                  *   **2. Is the constraint based on information volume or causal structure?**
                      *   **Information volume (specificity/entropy).** → *Leaf 5*
                      *   **Causal structure (mechanism/relevance).** → *Leaf 6*
      *   **C. In the purpose for which the assignment is made.**
          *   **1. Who fixes the appropriate class?**
              *   **The decision context (regulation/goal).** → *Leaf 7*

  ### The leaves

  1.  **Strict Frequentism:** Single-case probabilities are meaningless; only long-run frequencies in a class exist. *Awkward commitment:* You cannot assign a probability to the decay of this specific radium atom, only to the sample.
  2.  **Propensity:** Single-case probabilities are real physical dispositions inherent in the setup. *Awkward commitment:* You must posit a physical "chance" property for every singular event, even if it never repeats.
  3.  **Deflationary:** There is no truth-maker for the class choice, but the logic of direct inference is still valid. *Awkward commitment:* You must teach valid inference rules that do not track truth conditions.
  4.  **Subjective Bayesian:** Probability is degree of belief; the worry dissolves because coherence, not class truth, is the norm. *Awkward commitment:* Two agents with the same evidence can rationally hold different probabilities for the same event (e.g., Sleeping Beauty).
  5.  **Objective Bayesian:** The correct class is fixed by logical rules like maximum entropy or maximal specificity. *Awkward commitment:* You must treat the coin-machine statistics (60% heads) as relevant evidence over the verified balance (50%) if the machine data is more specific.
  6.  **Causal-Relevance:** The correct class is fixed by causal parents, not statistical correlations. *Awkward commitment:* You must ignore the patient's mortality-table class in favor of their genetic class, even if the genetic risk model is less empirically tested.
  7.  **Decision-Fixed:** The class is chosen by the practical context (e.g., insurance regulation), not by truth or evidence. *Awkward commitment:* An actuary may knowingly use a "false" class for a policy because it is the one mandated for pricing.

  ### Empty branches

  *   **Semantic Problem + "Single case has probability" + "Fixed by decision goal."**
      *   *Diagnosis:* Incoherent. If the value is fixed by the goal, the problem is Pragmatic, not Semantic.
  *   **Pragmatic Problem + "Class fixed by mind-independent truth."**
      *   *Diagnosis:* Category Error. If the class is fixed by truth, the difficulty is Epistemic (finding the truth), not Pragmatic (serving a goal).
  *   **Epistemic Problem + "No objective constraints" + "Causal structure fixes class."**
      *   *Diagnosis:* Contradictory. If causal structure fixes the class, there is an objective constraint; this belongs under "Yes" to objective constraints.

  ### What the tree can't separate

  *   **Subjective Bayesianism and the Deflationary View.**
      *   *Why:* On the balanced coin/machine case, both advise the agent to use the information they deem salient (likely the balance) without claiming a unique true class.
      *   *Distinguishing Case:* A legal trial where rules of evidence mandate a specific direct inference (e.g., "use actuarial tables") even if the agent's coherent credence differs; the Deflationist accepts the mandate as valid inference, the Subjective Bayesian resists it as an external constraint on belief.
  *   **Objective Bayesianism and Causal-Relevance.**
      *   *Why:* On the patient case, the "maximally specific" class is often the "causally relevant" one (genetics), so both select the same reference class.
      *   *Distinguishing Case:* A spurious correlation that is statistically more specific than the causal model (e.g., a rare demographic slice that predicts outcome perfectly but lacks a mechanism); Objective Bayes picks the demographic, Causal picks the mechanism.
