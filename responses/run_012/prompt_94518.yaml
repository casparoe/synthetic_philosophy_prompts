      *   *Decision on Conjecture:* It is highly defensible. It aligns with Schelling but adds the "partial" nuance which explains the *race* dynamic (if it were total, it would be a takeover, not a race).
      *   *Decision on Missing Question:* "The Publicity Condition." A commitment must be public to function, but publicity takes time. The race is often about controlling the narrative of the commitment before the commitment is fully public. Or, more philosophically: **The Ontology of the Counterfactual.** To say a move is "costly to reverse" is to make a claim about a world that didn't happen. How do agents agree on the truth of that counterfactual?

