answer: |-
  # Epistemic Closure Decision Tree

  **1. The Zebra Case (Single-Premise Closure)**
  You are at the zoo. You see a zebra. You know that if it is a zebra, it is not a cleverly painted mule. Do you know it is not a painted mule?
  *   **NO** → Go to **2**.
  *   **YES** → Go to **3**.

  **2. The Stopped Clock (Sensitivity Check)**
  You glance at a clock that stopped exactly 12 hours ago. It happens to read the right time. Do you know what time it is?
  *   **NO** → **Nozick-style Tracking (Sensitivity)**.
      *   *Verdict:* Knowledge requires sensitivity (if P were false, you wouldn't believe P). You lack knowledge of ~Mule (belief insensitive to mule-hood) and lack knowledge of Clock-Time (belief insensitive to stopped-ness). Closure fails.
  *   **YES** → **Relevant Alternatives**.
      *   *Verdict:* Knowledge requires ruling out relevant alternatives. The mule possibility is relevant at the zoo; the stopped-clock possibility is not relevant in ordinary life. Closure fails only when alternatives are relevant.

  **3. The Lottery Conjunction (Multi-Premise Closure)**
  You hold a ticket in a fair lottery. You know Ticket 1 won't win. You know Ticket 2 won't win. Do you know the conjunction (Ticket 1 won't win & Ticket 2 won't win)?
  *   **NO** → Go to **4**.
  *   **YES** → Go to **5**.

  **4. The Barn Facades (Safety vs. Context)**
  You are driving through a county full of barn facades, but you are looking at the one real barn. Do you know it is a barn? Furthermore, does your answer change if someone explicitly mentions the facades?
  *   **YES, but changes to NO when mentioned** → **Contextualism**.
      *   *Verdict:* Knowledge attributions are context-sensitive. In low-stakes contexts, closure holds and you know; in high-stakes (when error is mentioned), standards rise, closure holds but knowledge vanishes.
  *   **NO, regardless of mention** → **Safety-based Accounts**.
      *   *Verdict:* Knowledge requires safety (in nearby worlds, you wouldn't believe falsely). In fake-barn/lottery cases, your belief is unsafe due to environmental risk. Closure holds, but warrant doesn't aggregate across unsafe premises.

  **5. The Hands/BIV Conjunction (Status of Certainty)**
  Consider the sentence: *"I know I have hands, but I don't know I'm not a brain in a vat."* How do you classify this claim?
  *   **FALSE (I know both)** → Go to **6**.
  *   **TRUE/UNHAPPY (I know hands, but ~BIV is not knowledge)** → **Hinge / Framework-Certainty**.
      *   *Verdict:* Closure holds for known propositions, but ~BIV is a hinge proposition. It is certain and framework-constituting, but not an item of knowledge subject to justification. The sentence is true because the second clause denies knowledge-status, not truth.
  *   **TRUE/CONTRADICTION (I don't know hands)** → **Skepticism (Empty Cell)**.
      *   *Verdict:* You deny the antecedent. See analysis below.

  **6. Warrant Transmission (Dogmatism vs. Moorean)**
  You have perceptual warrant for "I have hands." Does this warrant *provide* justification for "I am not a brain in a vat," or does it merely *presuppose* it?
  *   **PROVIDES (Warrant Transmits)** → **Dogmatism about Perceptual Justification**.
      *   *Verdict:* Perceptual experience offers immediate justification for mundane propositions without prior justification for skeptical hypotheses. Warrant transmits across the entailment.
  *   **PRESUPPOSES (Warrant Assumes)** → **Moorean Line**.
      *   *Verdict:* You know you have hands, and thus know you are not a vat, but your warrant for hands assumes the falsity of the vat hypothesis. You cannot use the entailment to *gain* warrant for ~BIV, only to recognize you already have it.

  ***

  ### Taxonomic Notes: Collapses and Empty Cells

  **Indistinguishable Leaves**
  *   **Moorean Line vs. Dogmatism:** This tree separates them based on warrant transmission. However, in practice, these views often collapse on closure-specific questions. Both assert you know the mundane and the skeptical hypothesis is false. The distinction relies on fine-grained internalist architecture regarding *how* justification flows, which may not impact externalist closure verdicts. If a student answers "Provides" but defends Moore's argument structure, they land in Dogmatism by this tree's logic, though historically Moore is the namesake for the conclusion.
  *   **Safety vs. Contextualism:** Both deny knowledge in the Lottery/Barn cases under specific conditions. If a Safety theorist admits that "safety" is itself context-sensitive (e.g., nearby worlds shift with context), this leaf collapses into Contextualism. The tree assumes a robust, invariant Safety condition to keep them distinct.

  **Empty Cells**
  *   **SPC Fails / MPC Holds:** (Zebra=No, Lottery=Yes). This cell is **incoherent**. If single-premise closure fails (you can't know ~Mule from Zebra), multi-premise closure cannot hold (you can't know conjunctions of lotteries). The logical pressure that breaks SPC (risk of error in entailment) invariably breaks MPC.
  *   **SPC Holds / MPC Fails / Safety=No / Context=No:** (Zebra=Yes, Lottery=No, Barns=No regardless). This leads to **Skepticism**. It is not a target leaf because the prompt requested anti-skeptical closures (Moorean, etc.). However, it is a **defended** position, not incoherent. It occupies the space where closure holds formally, but knowledge conditions are so strict that mundane knowledge is lost.
  *   **Hinge + Know ~BIV:** (Hands/BIV=False, but Hinge view). This cell is **incoherent**. Hinge epistemology is defined by the claim that framework propositions (like ~BIV) are not items of knowledge. Claiming to "know" them contradicts the framework status.
  *   **Nozick + Barns=Yes:** (Zebra=No, Clock=No, Barns=Yes). This cell is **unattractive/unexplored**. Nozick's sensitivity condition typically denies knowledge in Barn Facade cases (if it were a fake, you'd still believe it's a barn). Asserting sensitivity fails for Mules/BIV but succeeds for Barns requires an ad-hoc restriction on which alternatives trigger sensitivity checks, which undermines the motivation for Tracking theory.
