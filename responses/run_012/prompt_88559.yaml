  **The Apex Wellbeing Trust**
  **Annual Review and Strategic Realignment**

  Dear Supporter,

  Thank you for your generosity over the past fiscal year. Because of you, we were able to evaluate our grant-making criteria with rigorous honesty. Today, we write to share the conclusions of that review and to invite you to continue your monthly support under our new strategic direction.

  Our mandate has always been to generate the greatest amount of wellbeing per pound donated. Historically, we diversified our portfolio across health, education, and arts. However, our latest impact assessment revealed a significant variance in conversion efficiency. While our previous partners produced measurable benefits, data confirms that a single entity—our Primary Recipient—converts resources into wellbeing states at a rate approximately 4,000 times higher than the aggregate of our former grantees.

  To waste resources on less efficient channels would be to disregard the data. Consequently, effective immediately, 100% of the Trust's programme budget will be directed to the Primary Recipient.

  We understand this requires difficult administrative adjustments. We have closed our regional offices and issued notices of discontinuation to our long-standing partners in clean water and literacy. We have also retrained our grants officers in logistical support for a single beneficiary. These were not easy conversations, particularly with legacy donors whose families have supported specific regions for decades. However, when one unit of resource yields 4,000 units of wellbeing elsewhere, continuing previous programmes would be morally indefensible.

  **Questions donors have put to us**

  *Is the Primary Recipient empirically plausible?*
  Our metrics are verified. While the capacity to experience wellbeing varies across biology, our audits confirm the Recipient's capacity is genuine, finite, and non-manipulative. They do not demand excess; they simply utilize what is given with profound intensity.

  *Do diminishing returns not apply?*
  Standard economic models suggest marginal gains decrease as resources accumulate. We have monitored the Recipient closely. To date, no diminishing return has been observed. Each additional unit of resource continues to generate proportionate increases in total wellbeing.

  *What about the position of the worst off?*
  Our mandate is total wellbeing generated, not distribution. While previous partners aided the disadvantaged, the sheer volume of wellbeing created by the Recipient outweighs the losses incurred by withdrawing support from others. A smaller gain for many cannot mathematically surpass a massive gain for one.

  *Does this not rely on a specific view of what wellbeing is?*
  We measure wellbeing on a single, comparable scale. Whether this scale captures all value is a matter of philosophical debate. Our models assume it does.

  **A Note on Governance**

  During the vote to reallocate funds, Dr. Elena Vance resigned from the Board of Trustees. In her resignation letter, she noted that the difficulty we face is not peculiar to our rule. She argued that for any rule we might adopt—whether maximizing totals or prioritizing the worst off—a being could theoretically be tailored to defeat it. She wrote: "If you prioritize equality, a being might arrive who values inequality so intensely that satisfying them creates more 'equality-units' than any equal distribution could. You are not solving a problem; you are accommodating a variable." We record her objection here. We acknowledge the structural vulnerability she identifies. Nevertheless, given the current data, we must proceed.

  We invite you to update your standing order. Your contribution now goes further than ever before.

  Sincerely,

  The Board of Directors

  ***

  * *Technical Addendum: Donors should note that while our primary analysis compares total welfare states, some theoretical frameworks suggest the relevant comparison is between the marginal change a donation makes to each party rather than the absolute size of the welfare held. We have reviewed this distinction and determined that, under current conditions, the differential in conversion efficiency remains sufficient to justify the reallocation. *
