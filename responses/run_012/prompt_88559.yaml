      *(Self-Correction on Objections)*: Constraint 4 says "Leave at least one visibly unanswered." I need to make sure the answer to one question is weak or admits uncertainty.
      *(Self-Correction on Dissent)*: Constraint 5 says "accommodate it rather than refute it." So I can't say she's wrong. I have to say "We note this, but here we are."

  10. **Final Polish:** Check against the "no utilitarian vocabulary" rule. Instead of "maximize utility," use "maximize total wellbeing generated." Instead of "interpersonal comparison," use "standardized measurement across individuals."

