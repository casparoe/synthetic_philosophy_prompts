      *   *Topic 9: The Scope of the Self-Model.*
          *   *Idea:* What exactly is being represented? The whole brain?
          *   *Draft:* What does the model represent?
          *   *Refinement:* A system cannot contain a complete model of itself (information theoretic limits). Is her claim just a restatement of that?
          *   *Follow-up:* If it's distinct from information theory, ask what the Gödelian specific adds.
          *   *Question 9:* Focus on the content of the representation.

      *   *Topic 10: Normativity.*
          *   *Idea:* Does this imply how we *ought* to think?
