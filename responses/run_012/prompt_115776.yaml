answer: |-
  1. "Ground rules"
  I will map "expected utility" to "risk metric" (frequency × consequence). "Probability" splits into aleatory variability (physical frequency) and epistemic uncertainty (state of knowledge). The mugger's claim is treated as an Initiating Event (IE) with no historical data, forcing reliance on expert elicitation for frequency estimation. "Utility" maps to "consequence," though PRA typically bounds consequences physically (e.g., population size), whereas philosophy allows unbounded utility. Where philosophy invokes "rationality," I will use "decision rule." When the thought experiment requires metaphysical possibility without mechanism, I will flag this as a violation of PRA's requirement for a causal model (fault tree) to justify non-zero frequencies. I will not introduce philosophical jargon; I will treat the mugger's claim as a submitted hazard scenario requiring quantification.

  2. "The translation"
  **Hazard Identification Report: External Agent Proposition**

  **Initiating Event (IE):** Encounter with external agent asserting capability to manipulate utility states outside normal physical models. Frequency of IE is observable (street encounters), but frequency of *validity* is epistemic only.

  **Event Sequence:** Upon IE, the event tree branches on operator decision: Mitigate (transfer asset) or Accept (retain asset).
  *   **Branch A (Mitigate):** Cost is deterministic (wallet value). Consequence is minor asset loss.
  *   **Branch B (Accept):** Risk of catastrophic utility loss (or forgone gain). The mugger asserts a conditional probability $P(\text{Threat}|\text{Refusal})$ that is non-zero but unsupported by data.

  **Consequence Analysis:** The claimed consequence is unbounded (e.g., $10^{15}$ utility units). In PRA terms, this exceeds standard consequence categories (Core Damage, Large Early Release). It implies a failure of all containment systems simultaneously.

  **Frequency Assignment:** No fault tree exists to model the mechanism of delivery. There are no basic events, no component failures, and no physical laws linking the refusal to the consequence. Therefore, the frequency estimate relies entirely on subjective prior probability assigned to the agent's truthfulness. This is pure epistemic uncertainty with no data to update the distribution.

  **Risk Metric:** Calculated Risk = $P(\text{Valid}) \times \text{Consequence}$. Even if $P(\text{Valid})$ is assigned $10^{-9}$ based on skepticism, the product exceeds all regulatory risk acceptance criteria (e.g., $10^{-4}$ expected fatalities/year).

  **Decision Context:** Strict expected-value maximization dictates immediate mitigation (payment). However, standard PRA practice screens events below a *de minimis* frequency threshold or requires a credible mechanistic model before quantification. The operator must decide whether to treat the claim as a credible hazard requiring mitigation or as a spurious signal to be screened out. The assessment hangs on whether "logical possibility" qualifies as "credible initiating event."

  3. "What didn't survive"
  The primary distortion is the evidentiary standard for frequency. In PRA, you cannot assign a frequency without a model or data. If you cannot draw a fault tree connecting the refusal to the catastrophe, the frequency is not just low; it is undefined. Philosophy treats "non-zero possibility" as sufficient for expected value calculations. PRA treats "no mechanism" as grounds for screening the hazard out entirely. This isn't just bureaucracy; it's a validity check on the number itself.

  Secondly, consequence bounding got lost. PRA consequences are physically bounded by the population at risk or energy available. A quadrillion happy days implies a utility function unbounded by physics. My trade assumes finite systems; the mugger assumes infinite leverage.

  Finally, the decision rule diverges. Philosophy often assumes strict expected-value maximization. PRA uses risk-informed decision-making, often governed by ALARP (As Low As Reasonably Practicable). We do not mitigate every risk with positive expected value; we mitigate until the cost is grossly disproportionate to the benefit. The mugger scenario breaks the "reasonable" link because the benefit (avoiding infinite loss) always outweighs the cost (wallet), unless you reject the probability assignment itself. The translation fudges this by forcing the mugger's claim into a quantification box that usually rejects inputs lacking mechanistic support. The "uncertainty" here isn't just high; it's unquantifiable because the sample space is undefined.

  4. "Verdict"
  Ignoring the mugger because there is no fault tree is principled, not bureaucratic. In PRA, a frequency estimate without a causal model is technically invalid; it's a number without a denominator. You are right to exclude him.

  Regarding your real worry: ALARP (gross disproportionality) is the shield, and it is a regulatory principle, not a habit. It holds even if the mugger knows the rule. If the mugger demands resources disproportionate to the *credible* risk, you stop. PRA already performs the "usual fixes" under other names: "Utility caps" are physical bounds on consequence; "Bayesian updating" is expert elicitation requiring data justification; "Penalizing weird priors" is the *de minimis* screening criterion. The mugger fails because he demands you treat an unverified prior as a validated frequency. Your trade rejects this by requiring evidence before quantification. That is not a loophole; it is the definition of engineering rigor.
