      *   **Scalable Oversight Researchers (The "You don't get IDA" crowd):**
          *   *Objection:* "IDA isn't just black-box distillation. We use interpretability, consistency checks, and the amplification step corrects errors. You're attacking a strawman of pure behavioral cloning."
          *   *Tone:* Technical, defensive of the framework, precise about definitions.
