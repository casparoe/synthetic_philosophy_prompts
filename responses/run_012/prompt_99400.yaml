prompt: |-
  Next month I present to a reading group my argument that iterated amplification and distillation cannot, even in principle, preserve alignment across rounds: distillation trains a student to match the amplified teacher's outputs, but a system's alignment-relevant dispositions are not identifiable from its outputs alone, so the student is underdetermined with respect to alignment and the training signal will select for whichever imitation-optimal shortcuts happen to be cheapest — with the result that each round of distillation launders the previous round's alignment rather than transmitting it. I need to be ready for the objections this particular audience will actually raise, not the ones my own camp would raise. Roughly half of them are ML engineers who have trained large models, treat "alignment via decomposition" as hand-waving, and will recast my claim as a mundane property of supervised learning; two are scalable-oversight researchers invested in IDA who will insist I have misdescribed the procedure; one works on interpretability and will press me on falsifiability. Draft my Q&A prep sheet: the objections in the order I will actually get them, each phrased the way that person would phrase it, with a two-minute reply, a candid note on where the reply is weakest, what I should concede outright, and the one objection I am hoping nobody raises. State how confident you are in each assessment, and single out the point you are least sure of.
