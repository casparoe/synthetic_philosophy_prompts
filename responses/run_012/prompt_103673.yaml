      *   **Better Principle:** Resentment tracks **unacknowledged debt within a reciprocal relationship.**
      *   *Flatmate:* Owes time, doesn't pay. Resentment.
      *   *Manic/Uncle/Traffic:* Debt is waived due to incapacity/circumstance. No Resentment.
      *   *Father:* Owes love/care. Didn't pay. Intellectually waive the debt, emotionally still collecting. **This explains the tension.** The resentment is the emotional lag between the intellectual excuse and the relational wound.
      *   *Employer:* Not a reciprocal relationship, but a contractual one. The feeling is "injustice," which mimics resentment.

  7.  **Drafting the Predictions:**
      *   *Dementia Patient:* Like the manic friend. Capacity gone. Objective stance. No resentment (sadness instead).
      *   *Internet Stranger:* No relationship, no debt. Anger/annoyance, but not *resentment* (which implies a bond). Unless they violate a community norm you care about.
