      *   *Insight:* Resentment doesn't require metaphysical free will. It requires *agency within the relationship*. The father was an agent in the user's life, even if determined by his past. The resentment is valid *for the user* as a signal of harm, even if the father isn't blameworthy in a cosmic sense.
      *   *Strawson's point:* We don't drop reactive attitudes just because determinism is true. We only drop them for specific exemptions (illness, coercion, etc.). The user has granted the father an exemption intellectually, but not emotionally. That's normal.

  9.  **Structuring the Response:**
