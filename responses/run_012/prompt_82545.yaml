  *(Self-Correction during drafting)*: I need to be careful not to dismiss the Doomsday Argument too easily. It *is* a bullet to bite for SSA proponents. I should acknowledge it feels wrong but explain why it's less wrong than the alternative. Actually, a better defense of SSA is that the Doomsday Argument only works if you assume a uniform prior over total population, which is dubious. But I don't want to get too technical. I'll stick to the reference class solution for Doomsday too—if the reference class is "philosophers reading about doom," the class is small and weird, diluting the effect. No, better to stick to the "Epistemic Reference Class" argument. If I define the class as "beings with my exact evidence," Doomsday weakens because future beings might have different evidence.
