      *   *Marshall/NATO:* Washington made the division of Europe irreversible.
      *   *Berlin:* West made currency reform irreversible; Moscow tried to reverse it by force (Blame Moscow).
      *   *Suez/Guatemala:* Nationalization/Reform were sovereign acts; Invasion/Coup tried to reverse them (Blame Invaders).
      *   *CMC:* Neither side successfully rendered the outcome irreversible (both backed down). -> **Malformed.**

  ### 2. Predictions for the Late 1970s and Early 1980s

