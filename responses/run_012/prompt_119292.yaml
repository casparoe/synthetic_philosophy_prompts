  This is a fascinating reconstruction of a historian's moral and causal arithmetic. Your friend is not applying a simple "who shot first" heuristic; she is applying a tiered taxonomy of action. To help you settle the dinner argument (or at least clarify why it persists), I have reconstructed her implicit logic into two candidate rules, applied them to the late Cold War, and offered a judgment on the validity of the question itself.

  ### 1. The Candidate Rules

  Based on her six verdicts, her reasoning tracks a hierarchy of action types. She distinguishes between **(1) First Moves** (chronological), **(2) Lock-Ins** (structural exclusions), and **(3) Overturning** (coercive reversals). Her verdicts suggest she prioritizes (3) over (2), and (2) over (1), but treats defensive intent as irrelevant to culpability.

  Here are two rules that fit all six of her verdicts but diverge on the later period:

  **Rule A: The Normative Escalation Principle**
  > *Responsibility lies with the first actor to escalate the conflict from a **permissible category** (sovereign administration, internal reform, defensive positioning) to an **impermissible category** (external coercion, structural exclusion, or use of force). Defensive intent does not mitigate the escalation.*

  *   **Fit:**
      *   *Eastern Europe:* Moscow moved from presence to imposition (Impermissible).
      *   *Marshall/NATO:* Washington moved from aid to exclusive alliance (Impermissible Lock-In).
      *   *Berlin:* West stayed in Admin (Permissible); Moscow moved to Blockade (Impermissible).
      *   *Suez/Guatemala:* Egypt/Arbenz stayed in Sovereignty (Permissible); Allies/US moved to Invasion/Coup (Impermissible).
      *   *CMC:* Both moved to Impermissible (Missiles/Blockade). -> **Malformed.**

  **Rule B: The Irreversibility Principle**
  > *Responsibility lies with the actor who first renders the status quo **structurally irreversible** to the detriment of the other. If an actor attempts to **reverse** an irreversible move by force, the responsibility shifts to the reverser.*

  *   **Fit:**
