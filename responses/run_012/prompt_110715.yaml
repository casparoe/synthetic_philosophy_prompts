  *(Self-Correction during drafting)*: I need to be careful not to argue *against* carbon pricing. The prompt explicitly says "not a verdict on carbon policy." I must focus on the *mechanism of entrenchment*.
  Also, I need to make sure I don't just say "Jefferson said no." I need to explain *why* the Odysseus analogy fails to overcome Jefferson.
  The "Crew" problem is vital. In Odysseus, the crew are distinct. In democracy, the judges/enforcers are part of the system. If the people scream, the judges might listen.
  The "Statute vs. Constitution" point is critical. A supermajority requirement for a statute is still just a statute in many jurisdictions (unless it's a written constitution with entrenched clauses). If Parliament is sovereign, it cannot bind its successor. This is a legal reality check on the philosophical analogy.

  Let's assemble the response.

  *   *Table:* Clear mapping.
