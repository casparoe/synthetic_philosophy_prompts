      *   Tone check: Respectful, rigorous, not condescending.

  9.  **Structure of Response:**
      *   Introduction: Acknowledge the user's skepticism (well-founded).
      *   Part 1: The Correspondence Table.
      *   Part 2: The Disanalogies (Agency, Crew, Power, Judgment, Generations).
      *   Part 3: Relevance Filter (What matters for the carbon tax).
