  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Validate the grief immediately. Address the widow and children directly.
      *   **Middle (The Philosophy):** Address his work without jargon. Explain his view on identity and perspective. He didn't believe in a soul, but a pattern. He didn't believe death was an illusion for *us*, only for the *subject*.
      *   **The Image:** Introduce the metaphor here to bridge the gap.
