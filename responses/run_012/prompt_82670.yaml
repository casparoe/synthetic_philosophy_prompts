      *   **Deceased's Views:** Defended a version of Quantum Immortality (Many-Worlds Interpretation - MWI). Believed from a first-person perspective, one never experiences death (there's always a branch where survival occurs). *Crucially:* He was not sensationalist. He knew "measure" (probability weight) of surviving branches could be tiny. He had a deflationary view of personal identity (self = pattern of continuity, not soul). He acknowledged the gap between 1st person (subjective) and 3rd person (objective/others) perspectives.
      *   **Constraints:**
