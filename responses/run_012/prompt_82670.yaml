      *   *Let's try the "Light" idea again.* A lamp in a window. To the passerby, it goes dark. To the person inside, the light remains until the bulb burns out.
      *   *Actually, let's use the image of a **Book**.* We have reached the last page of the volume we share. He may be the protagonist of another volume we cannot read.
      *   *Decision:* The **Horizon** image is strongest for "perspective." When a ship sails over the horizon, it doesn't cease to exist, but it ceases to be *visible* to the observer. The observer's loss is real, even if the ship's journey continues.

  5.  **Refining the Argument (The "Measure" vs. "Life" constraint):**
