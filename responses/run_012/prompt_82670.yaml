answer: |-
  Friends, colleagues, and family.

  We are gathered here in a space that [Name] loved, surrounded by the books and ideas that animated his life. But we are not here for the ideas. We are here for the man. And to [Widow's Name] and the children: I know that no amount of abstract thought can fill the space he has left in your home. I will not try to fill it. I speak to you first as his friend, sharing in your loss, acknowledging that he is not coming back through that door. The silence he has left behind is real, and your grief is the honest price of loving him.

  For those of us in the department, however, honoring [Name] requires a different kind of honesty. He spent the last decade thinking deeply about the nature of ending. He was not a man who sought comfort in easy answers. In fact, he found most comforts to be intellectual dishonesties. He argued that we must distinguish between the view from the outside and the view from the inside.

  From the outside—the third-person perspective of those who loved him—his story has reached a conclusion. We see a life that was vibrant, challenging, and deeply kind, now completed. We see the pattern of his continuity broken in our world. To deny this would be to deny your reality, and he would never ask you to do that. He knew that for the people left behind, the departure is absolute.

  But [Name] also insisted on the integrity of the first-person perspective. He believed that the self is not a ghost in a machine, but a pattern of experience. He argued that from the inside, a conscious narrative does not experience its own cessation. He did not believe this made death trivial. He knew that the path of survival could become incredibly narrow. He understood that the likelihood of continuing could dwindle to almost nothing. Yet, he maintained that for the traveler, the narrowness of the road does not negate the reality of the walking.

  To hold these two truths together is difficult. It requires us to stand in the tension between what we see and what he experienced.

  Imagine a ship sailing toward the horizon. For those of us standing on the shore, watching through the glass, the ship eventually dips below the curve of the earth. It vanishes from our sight. Our view is blocked. The connection is severed. We are left with the empty ocean. That loss is final for us. We cannot signal it; we cannot follow it.

  But for the captain on the bridge, the horizon does not rise up to swallow the vessel. The water remains level. The journey continues as far as the eye can see, until the very last moment of observation. The ship does not vanish for the one steering it; it simply moves forward until there is no longer a need to steer.

  [Name] lived with the humility to accept that we are on the shore. He never asked us to pretend the ship hadn't disappeared. But he asked us to respect that, from the helm, the view was different. He did not believe he was escaping judgment or consequence. He believed only that the subjective experience of ending is a contradiction in terms.

  So, how do we leave here today?

  For the family, I offer this: The struggle is over. The pain that marked his final months has no purchase on him now. The silence you feel is the silence of rest, not of absence. You are free to remember him as he was in his strength, unburdened by the illness that took him.

  For his colleagues, I offer this: His arguments remain standing. We do not need to resolve the interpretation of quantum mechanics to honor the rigor with which he examined the limits of human perspective. We can acknowledge that the weight of probability does not determine the worth of the existence. A life is not made less real because the branch is thin.

  [Name] was a man who valued truth over consolation. So I will not tell you that he is here. He is not. But I will say that the integrity of his inquiry remains, and the love he generated in this room persists. The ship has sailed beyond our vision, but the water it crossed remains.

  Let us honor him by living with that same intellectual courage, and by caring for those of us left on the shore. Thank you.
