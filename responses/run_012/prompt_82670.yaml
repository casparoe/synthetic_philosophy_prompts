  4.  **Drafting - Content & Tone Check:**
      *   *Tone:* Warm, solemn, precise, not cold.
      *   *Family:* Must feel the grief is real. "He is not here."
      *   *Colleagues:* Must feel the theory is respected. "His perspective remains valid to him."
      *   *Avoid:* "He is still alive." (Hurts family). "He is dead." (Betrayal to his work).
      *   *Solution:* Focus on the *completion* of his shared narrative with us vs. the *continuity* of his own experience.
      *   *Key Insight:* His theory was about the *experience* of dying. He experienced a long illness, then... cessation of pain. For us, cessation of presence.
      *   *The Image:* Let's use the image of **a conversation in a crowded room**. You hear your friend's voice. Then the noise swells, and you lose the thread. For you, the voice is gone. For the friend, they are still speaking, just to someone else, or into the silence.
