answer: |-
  ### 1. Brainstorming Candidate Distinctions

  To engineer a principle that fits your verdicts, we must isolate the variables shifting your intuitions. Here are the conceptual levers at play:

  *   **Counterfactual Dependence (But-For Causation):** The standard test: *If the agent had acted, would the outcome have been avoided?* This handles Cases 5 vs. 6 (efficacy) and 1 vs. 2 (stranger vs. lifeguard, assuming the lifeguard's action would work). However, it fails on Cases 7 and 8. In both, if Stranger 1 *or* Lifeguard 1 had acted, the death would be avoided. Yet you deny individual causation in both. Counterfactuals are necessary but not sufficient.
  *   **Normative Baselines (Duty vs. Permission):** This distinguishes the Stranger (1) from the Lifeguard (2). The stranger is *permitted* not to act; the lifeguard is *forbidden* not to act. This suggests causation by omission is not a physical relation but a deviation from a normative expectation. This handles 1 vs. 2, 4 vs. 3 (risk creation generates a duty of repair), and 14 vs. 15 (parental duty).
  *   **Causal Redundancy (Overdetermination):** This is the crux of your tension between (2) and (8). In (2), the lifeguard is the sole barrier to death. In (8), there are two barriers. In commission cases (two shooters), redundancy usually means *both* cause the death. In your omission cases (8 and 10), redundancy seems to *negate* individual causation. This suggests a principle of **Omissive Non-Redundancy**: an omission is a cause only if the agent was the unique or non-redundant normative barrier.
  *   **Risk Creation (Prior Involvement):** This distinguishes the Hiker (3) from the Bystander (4). The hiker is not just omitting to save; he is omitting to *repair a threat he initiated*. This generates a "duty of rescue" where none existed before. It treats the omission as a continuation of the initial causal chain.
  *   **Collective Agency:** This distinguishes the Strangers (7) from the Village (10) and the Lifeguard Pair (8). You are willing to attribute causation to a "collective" only when there is a pre-existing normative unit (a village community, a professional team). Mere aggregation of strangers with similar abilities (7) does not constitute a causal agent.
  *   **Control and Exclusivity:** Related to redundancy. In (9), the lifeguard has exclusive control. In (8), control is shared. Your verdicts suggest that shared normative control dilutes individual causal responsibility to the point of extinction, locating the cause in the collective instead.

  ### 2. Proposed Principles

  I propose a two-tiered framework. Causation by omission is not a single relation but depends on whether the agent is an individual or a collective unit.

  **Principle 1: The Individual Non-Redundant Duty Principle**
  An individual agent $S$ causes an outcome $E$ by omitting to perform action $A$ if and only if:
  1.  **Counterfactual Efficacy:** Had $S$ performed $A$, $E$ would not have occurred.
  2.  **Normative Obligation:** $S$ was under a specific normative obligation to perform $A$ (derived from role, contract, or prior risk creation).
  3.  **Normative Non-Redundancy:** There was no other agent $S^*$ who was *also* under a specific normative obligation to perform $A$ (or an equivalent preventative action) and *could* have done so.

  **Principle 2: The Collective Agency Principle**
  A collective $C$ causes an outcome $E$ by omitting to perform action $A$ if and only if:
  1.  **Collective Efficacy:** Had the members of $C$ coordinated to perform $A$, $E$ would not have occurred.
  2.  **Collective Obligation:** The obligation to perform $A$ belonged to $C$ as a unified normative entity (not merely an aggregate of individuals).
  3.  **Individual Dispersion:** The obligation was distributed among members such that no single member satisfied the *Normative Non-Redundancy* condition individually.

  ### 3. Testing the Principles

  | Case | Scenario | Verdict (User) | Principle 1 (Individual) | Principle 2 (Collective) | Fit? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Stranger / Pool | No Cause | Fails (2): No Obligation. | Fails (2): No Collective Entity. | **Yes** |
  | **2** | 1 Lifeguard / Pool | Cause | Passes (1, 2, 3). No backup. | N/A | **Yes** |
  | **3** | Hiker / Rock | Cause | Passes (1, 2, 3). Risk creation = Obligation. No backup. | N/A | **Yes** |
  | **4** | Bystander / Rock | No Cause | Fails (2): No Obligation (no risk created). | N/A | **Yes** |
  | **5** | Doctor / Effective | Cause | Passes (1, 2, 3). Duty + Efficacy. | N/A | **Yes** |
  | **6** | Doctor / Ineffective | No Cause | Fails (1): No Efficacy. | N/A | **Yes** |
  | **7** | 2 Strangers / Switch | No Cause | Fails (2): No Obligation. | Fails (2): Strangers $\neq$ Collective Entity. | **Yes** |
  | **8** | 2 Lifeguards / Switch | No Individual / Yes Collective | Fails (3): Redundant Duty (Lifeguard 2 exists). | Passes (1, 2, 3). Team is entity, duty shared. | **Yes** |
  | **9** | 1 Lifeguard / Switch | Cause | Passes (1, 2, 3). Exclusive duty. | N/A | **Yes** |
  | **10** | Village / Medicine | No Individual / Yes Collective | Fails (3) or (1)*: Redundant or Insufficient Power. | Passes (1, 2, 3). Village is entity, duty collective. | **Yes** |
  | **11** | Car / Programmers | Programmers Cause | N/A (Car not agent). Programmers pass (1,2,3). | N/A | **Yes** |
  | **12** | Poison / Bystander | A Causes, C No | A (Commission). C Fails (2): No Obligation. | N/A | **Yes** |
  | **13** | Camper / Fire | Cause | Passes (1, 2, 3). Risk creation = Obligation. | N/A | **Yes** |
  | **14** | Parent / Infant | Cause | Passes (1, 2, 3). Role Duty. | N/A | **Yes** |
  | **15** | Neighbor / Infant | No Cause | Fails (2): No Obligation. | N/A | **Yes** |

  *\*Note on Case 10:* If the medicine required \$100 and each had \$1, individuals fail (1) Efficacy. If medicine cost \$1 and any could pay, individuals fail (3) Non-Redundancy (everyone else could have too). Either way, Principle 1 denies individual causation, matching your verdict.

  ### 4. Predictions for New Cases

  **(a) The Off-Duty Lifeguard**
  *Scenario:* An off-duty lifeguard sees the child drowning and does nothing.
  *Analysis:*
  *   **Obligation:** Does the role-duty persist off-clock? In most normative frameworks (and matching your Case 1 intuition), a role-duty is tied to the *shift* or *contractual active status*. If they are off-duty, they revert to the status of a "stranger with skills."
  *   **Prediction:** **No Causation.**
  *   *Reasoning:* They fail Condition 2 (Normative Obligation). They are morally blameworthy (like Case 1), but metaphysically, the cause remains the water/drowning, not their omission. If you believe the duty persists eternally once certified, then they *would* cause the death, but this would collapse the distinction between (1) and (2). To maintain your distinction, the duty must be context-bound.

  **(b) The Paralyzed Risk-Creator**
  *Scenario:* A camper starts a fire, becomes paralyzed, cannot stamp it out. Fire spreads.
  *Analysis:*
  *   **Obligation:** Yes (Risk Creation).
  *   **Efficacy/Ability:** Condition 1 implies "Had $S$ performed $A$..." This requires ability. If the agent *cannot* act, the counterfactual "Had they acted" describes an impossible world.
  *   **Prediction:** **No Causation.**
  *   *Reasoning:* Causation requires a possible alternative. If the agent is physically incapable, the omission is not a voluntary departure from a baseline they could meet. The cause is the fire/nature, not the agent. (They may be responsible for starting the fire, but the *spread* due to omission is not caused by them if they lacked capacity).

  ### 5. Final Adjudication

  You asked for a careful conceptual engineering, not a literature review. Here is the hard truth about your verdicts: **You cannot have standard counterfactual causation and your verdicts on overdetermination (Case 8) simultaneously.**

  Standard metaphysics says if $A$'s action would prevent $E$, and $A$ didn't act, $A$ caused $E$. This holds even if $B$ also could have acted. Your verdict on Case 8 ("neither lifeguard individually caused the death") rejects this. You are prioritizing **Normative Non-Redundancy** over **Counterfactual Dependence**.

  **Which verdicts should you revise?**
  I recommend you hold firm on Case 8 but clarify Case 10.
  *   **Hold on Case 8:** It is philosophically defensible to say that in *omissive* overdetermination, individual causation dissolves into collective causation. Unlike two shooters (where both fires are active forces), two lifeguards represent a *single normative barrier* that failed. The "cause" is the failure of the safety system, not the individual limbs of the system.
  *   **Clarify Case 10:** Ensure the "Village" is defined as a normative entity. If it is just 100 strangers, your verdict contradicts Case 7. You must insist that "Village" implies a social contract or shared intention that "Two Strangers" lacks.

  **The Most Defensible Principle:**
  The **Normative Non-Redundancy Principle** (Principle 1 above) is the survivor. It captures the insight that causation by omission is not about physics (forces and energies) but about **responsibility tracking**.

  *   **Why it works:** It explains why the Stranger (1) doesn't cause (no norm), why the Hiker (3) does (norm via risk), and crucially, why the Second Lifeguard (8) negates the First Lifeguard's individual causation (redundant norm).
  *   **The Cost:** You must accept that causation is **contrastive and normative**. It is not a mind-independent relation in the world like gravity. It is a relation between an event, an agent, and a rule. If you accept this cost, your verdicts are consistent. If you demand causation be purely physical, you must abandon your verdict on Case 8 and admit both lifeguards caused the death.

  **Final Recommendation:** Adopt the **Normative Non-Redundancy Principle**. It preserves the distinction between moral monstrosity (Case 1) and causal agency (Case 2), and it solves your overdetermination tension by treating shared duty as a single causal unit rather than duplicate individual causes. This makes causation by omission a subset of **accountability**, which aligns with your intuition that the two "will not come apart cleanly."
