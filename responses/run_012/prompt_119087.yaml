          *   *Structural Issue:* The "Calculation Problem" (information) and the "Power Problem" (incentives). Even with democracy, centralizing economic decision-making centralizes political leverage.
          *   *Verdict:* It is a structural difficulty for *central* planning, but Einstein's version is specifically vulnerable because he lacks a theory of *institutional checks* beyond "democratic spirit."

      *   **5. Synthesis/Conclusion:**
