prompt: |-
  I cover biology for a science desk and for the last few months I've been sitting in on the taxonomy board at a natural history museum — the group that signs off on whether some population gets written up as its own species for the collection and for a couple of journals. I'm trying to get ahead of next month's docket and I keep guessing wrong about these people, so I want your read.

  Here's how they've been calling things lately. Two frog populations that meet in a narrow hybrid zone, stay obviously distinct, and breed in different ponds — split, two species. Two fish populations that look pretty different but share the same waters and melt into one big hybrid swarm wherever they overlap — kept as a single species. A parthenogenetic snail line that doesn't breed with anything else at all — recognized as a species. Two mouse populations on opposite sides of a mountain range that never meet, are near-identical geneticly, but live in completely different habitats — split, two species.

  Now the case in front of them. A little crustacean: two populations that share ponds and never interbreed, not even a little, but they're so similar you need a sequencer to tell them apart, and they make their living in exactly the same way in exactly the same water.

  Are they going to split it or keep it whole? I care less about the answer than about the rule they seem to be running, the other rules that would fit all four of their earlier calls just as well, which of those the crustacean actually pulls apart, and which rule you'd put money on. And tell me what would change your mind — what bit of evidence or argument would flip your bet — because I've been burned by this board before and I'd rather know where you're shaky.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **User:** Science journalist covering biology/taxonomy.
      *   **Context:** Sitting in on a museum taxonomy board deciding species status.
      *   **Task:** Predict the outcome of a new case (cryptic crustaceans) based on past precedents (4 cases).
      *   **Specific Requirements:**
          1.  Identify the underlying rule/principle the board seems to be using.
          2.  Identify alternative rules that fit the past data equally well.
          3.  Determine which rule the crustacean case distinguishes between.
          4.  Make a prediction (Split vs. Lump).
          5.  Identify "breaker" evidence/arguments that would flip the prediction.
      *   **Tone:** Professional, analytical, nuanced (acknowledging uncertainty), suitable for a science journalist.

  2.  **Analyze the Past Cases (The Data):**

      *   *Case 1 (Frogs):* Narrow hybrid zone, distinct otherwise, different breeding ponds. $\rightarrow$ **SPLIT.**
          *   *Implication:* Reproductive isolation is strong, even if contact exists. Ecological separation (ponds) matters.
      *   *Case 2 (Fish):* Look different, same waters, hybrid swarm (free interbreeding). $\rightarrow$ **LUMP (Single Species).**
          *   *Implication:* Morphology doesn't trump gene flow. If they hybridize freely, they are one species.
      *   *Case 3 (Snail):* Parthenogenetic (asexual), no breeding with others. $\rightarrow$ **SPLIT.**
          *   *Implication:* Biological Species Concept (BSC) fails here (no sex), so they default to lineage/independence. Evolutionary independence counts.
      *   *Case 4 (Mice):* Allopatric (never meet), genetically near-identical, different habitats. $\rightarrow$ **SPLIT.**
          *   *Implication:* Geographic isolation + Ecological divergence is enough, even without genetic divergence or tested reproductive isolation.

  3.  **Synthesize the Board's Philosophy (The "Rule"):**

      *   *Observation:* They prioritize *Evolutionary Independence* and *Reproductive Isolation* over *Morphology* and *Genetic Distance*.
      *   *Key Pattern:*
          *   Frogs: Isolation maintained despite contact = Species.
          *   Fish: No isolation (hybrid swarm) = Not Species (despite morphology).
          *   Snail: Lineage independence (asexual) = Species.
          *   Mice: Ecological/Geographic isolation = Species (despite genetic similarity).
      *   *Dominant Concept:* This looks like a mix of the **Biological Species Concept (BSC)** (can they breed?) and the **Evolutionary Species Concept (ESC)** or **General Lineage Concept** (are they evolving separately?).
      *   *Crucial Nuance:* They seem to weigh *barriers to gene flow* higher than *genetic divergence* or *morphological difference*. If gene flow is blocked (Frogs, Mice, Snails), they split. If gene flow is open (Fish), they lump.

  4.  **Analyze the New Case (The Crustacean):**

      *   *Attributes:*
          *   Sympatric (share ponds).
          *   No interbreeding (complete reproductive isolation).
          *   Cryptic (genetically/morphologically similar, need sequencer).
          *   Same niche/ecology (same water, same living).
      *   *Conflict:*
          *   Supports Split: Complete reproductive isolation (like Frogs).
          *   Supports Lump: No ecological difference, no morphological difference, sympatric without divergence (unlike Mice/Frogs).

  5.  **Develop Alternative Hypotheses (Rules that fit the past 4):**

      *   *Hypothesis A (The "Gene Flow" Rule):* Species are defined by the absence of gene flow. (Fits Frogs, Fish, Snails). *Wait, does it fit Mice?* Mice never meet, so we *assume* no gene flow. Yes, it fits.
      *   *Hypothesis B (The "Ecological Divergence" Rule):* Species must occupy different niches or habitats. (Fits Frogs [different ponds], Mice [different habitats], Snails [asexual niche?]). *Wait, does it fit Fish?* Fish look different but share waters. If ecology was key, Fish might be split based on morphology implying niche, but they were lumped because of hybridization. So Ecology is secondary to Gene Flow.
      *   *Hypothesis C (The "Diagnostic Character" Rule):* You need a way to tell them apart. (Fits Frogs [distinct], Fish [look different but lumped - so this fails], Snails [partheno is diagnostic], Mice [habitat is diagnostic]). This is weak because Fish were lumped despite looking different.
      *   *Hypothesis D (The "Process" Rule):* Are they on separate evolutionary trajectories? (Fits all).

      *Refining the Alternatives:*
      *   *Rule 1: Reproductive Isolation is King (BSC+).* If they don't swap genes, they are species. (Fits Frogs, Snails, Mice [assumed], Fish [they do swap, so not species]).
      *   *Rule 2: Ecological/Geographic Context Matters.* Isolation must be reinforced by ecology or geography. (Fits Frogs [ponds], Mice [mountains/habitat], Snails [mode of reproduction]).
      *   *Rule 3: The "Cryptic Species" Threshold.* They accept cryptic species *if* there is a barrier, but maybe not if they are sympatric and ecologically identical (Sympatric Speciation without niche partitioning is controversial).

  6.  **Evaluate the Crustacean against the Rules:**

      *   *Rule 1 (Isolation):* **SPLIT.** They don't interbreed.
      *   *Rule 2 (Ecology/Geography):* **LUMP.** Same pond, same niche. Why are they separate if they live the same way in the same place without merging? This implies recent speciation or a hidden barrier. Conservative taxonomists might wait for ecological divergence.
      *   *Rule 3 (Sympatry Test):* Sympatric populations that don't interbreed are *strong* evidence for species status (because there's no geographic barrier keeping them apart). This actually leans toward **SPLIT**. If they live in the same pond and *still* don't mix, the isolation mechanism is very strong.

      *Re-evaluating the Board's Tendency:*
      *   They Split Mice that are *genetically identical* based on *habitat*.
      *   They Split Frogs that have a *hybrid zone* (some gene flow) based on *distinctness*.
      *   They Lumped Fish that *look different* because of *gene flow*.
      *   *Conclusion:* They are "Lumpers" regarding gene flow, but "Splitters" regarding isolation, even without genetic divergence.
      *   *The Crustacean Conundrum:* Sympatric cryptic species. This is the hardest case. If they share the *exact* same niche and pond, why don't they interbreed? Temporal isolation? Chemical?
      *   *Prediction:* The board will likely **SPLIT**. Why? Because the Fish case established that gene flow trumps morphology. The reverse implies that *lack* of gene flow trumps morphology (or lack thereof). The Frogs showed that even *some* gene flow (hybrid zone) doesn't stop a split if they stay distinct. The Crustaceans have *no* gene flow. The Mice showed genetic similarity doesn't matter.
      *   *Counter-argument:* If they are ecologically identical and sympatric, are they really separate lineages or just a polymorphism? But the prompt says "never interbreed, not even a little." That is the definition of reproductive isolation.

      *Wait, let's look closer at the "Rule".*
      The board seems to follow the **General Lineage Concept** with a heavy emphasis on **Reproductive Isolation** as the proxy for lineage separation.
      *   Frogs: Isolation (mostly) $\rightarrow$ Split.
      *   Fish: No Isolation $\rightarrow$ Lump.
      *   Snails: Isolation (asexual) $\rightarrow$ Split.
      *   Mice: Isolation (geographic) + Ecological diff $\rightarrow$ Split.

      *Crustacean:* Isolation (behavioral/mechanical?) + Sympatry + No Eco diff.
      Does Sympatry + No Eco Diff make them skeptical?
      Actually, Sympatry + No Interbreeding is the *gold standard* for the Biological Species Concept. If two things live in the same house and never date, they are different species.
      *Prediction:* **SPLIT.**

  7.  **Identify the "Shaky" Ground (What could flip the bet):**

      *   *Hidden Gene Flow:* Maybe the sequencer isn't deep enough? Mitochondrial introgression?
      *   *Plasticity:* Is it one species with two morphs that don't mate assortatively but are physically separated in the pond (micro-habitat)? Prompt says "exactly the same water."
      *   *Recent Divergence:* Are they just starting to split? Board might wait for "fixation."
      *   *Practicality:* Can curators catalog them if they need a sequencer? (Museums care about type specimens).
      *   *The "Ecological Species" Counter-Rule:* Maybe the board *thinks* they follow BSC, but actually they require Ecological Divergence for sympatric cryptic taxa. (The Mice had habitat diffs, Frogs had pond diffs). The Crustaceans lack this. This is the biggest vulnerability in my prediction.

  8.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the complexity (Species Problem).
      *   *The Board's Profile:* Define their apparent operating system (Isolation > Morphology/Genetics).
      *   *Alternative Rules:* Present the "Ecological Divergence" hypothesis vs. the "Hard Isolation" hypothesis.
      *   *The Crustacean Prediction:* Split (based on Hard Isolation).
      *   *The Flip Side:* What evidence makes it a Lump? (Ecological identity, practical cataloging issues, evidence of recent collapse).
      *   *Tone Check:* Keep it journalistic, analytical, not overconfident.

  9.  **Refining the "Rule" Analysis:**
      *   *Rule 1 (My Bet):* **Reproductive Isolation is Necessary and Sufficient.** (Fits all 4).
          *   Frogs: Isolated (mostly).
          *   Fish: Not Isolated.
          *   Snails: Isolated (by definition).
          *   Mice: Isolated (by geography).
      *   *Rule 2 (The Competitor):* **Isolation + Ecological/Phenotypic Divergence.** (Fits all 4).
          *   Frogs: Different ponds.
          *   Fish: Same ecology (reason to lump?).
          *   Snails: Different reproductive mode (ecological?).
          *   Mice: Different habitats.
          *   *Crustacean:* Fails this rule. Same ecology, same phenotype.
      *   *Decision:* Which rule is stronger? The Fish case is the key. They looked different (Phenotype) but were lumped because of Gene Flow. This suggests Phenotype is weak. The Mice case suggests Genetics is weak. The Frogs case suggests *some* gene flow is okay if distinctness remains.
      *   *The Crustacean:* They have *no* gene flow. That is the strongest signal in the board's history. I will bet on the Split, but highlight the Ecological Divergence rule as the main risk.

  10. **Final Polish:** Ensure the distinction between "Split" (two species) and "Lump" (one species) is clear. Make sure the "What changes your mind" section is specific to the board's behavior. (e.g., If a board member brings up "diagnosability" or "curatorial burden").

      *(Self-Correction during drafting)*: Wait, the Mice case is Allopatric. The Crustacean is Sympatric. Allopatric speciation is standard. Sympatric speciation is controversial. If the board is conservative, they might hesitate to validate sympatric speciation without ecological niche partitioning. This strengthens the "Ecological Divergence" counter-rule. I need to emphasize this tension.

      *Revised Prediction:* I'll stick with **Split**, but with lower confidence than before, because Sympatric + Cryptic + No Niche Diff is a taxonomic nightmare. However, "Never interbreed" is a very strong line for a BSC-leaning board. I will frame the prediction as "Split, but it's the closest call yet."

