prompt: |-
  I'm writing a thriller and I need a scene where the plot hinges on a decision theory puzzle, but I don't want to just rip off the old Death in Damascus setup where Death is a literal perfect predictor -- that's too on the nose for a novel and readers will smell the textbook.

  So: build me a fresh scenario in the same family. The key structural thing I want is that the character is choosing between two options, a predictor-like figure has already anticipated her choice (but is only as good as a very shrewd human, not infallible), and the twist is that causal decision theory and evidential decision theory both say pick the same option here -- unlike Newcomb, where they famously split -- yet she still can't ratify her choice after the fact; whatever she picks, she ends up thinking she should've picked the other. Constraints: realistic, contemporary, no omniscience, no exotic physics, one paragraph for the scenario itself.

  After the scenario, walk me through what causal, evidential, and a functional/updateless approach each say about her choice, and tell me which feature of the case is actually generating the non-ratifiability. Then tell me: if I dial that feature down or remove it, does the whole thing collapse back into a plain Newcomb problem or into something even more boring? I need to know whether the scene has a real engine or whether I'm just dressing up an old puzzle in new clothes.
