answer: |-
  Elena stands before the security console, the facility's lockdown imminent. She must exit through either the Red Corridor or the Blue Corridor; the other will seal instantly. A rival profiler, "The Architect," has already anticipated her choice and rigged the corridors: he placed a lethal nerve-gas trap in the corridor he predicted she would take, leaving the other safe. He is 90% accurate. However, the Blue Corridor contains a server room with incriminating evidence she needs (value +10 units), while the Red Corridor is empty (value 0). Survival is worth 0, capture is -100. She knows the Architect's prediction is already locked in, based on her psychological profile, and she knows her own profile matches the one he analyzed. She has to choose now, before the gas deploys.

  ***

  ### Decision Theory Analysis

  **Causal Decision Theory (CDT):**
  CDT asks: "Does my choice *cause* the gas to be there?" The answer is no; the Architect's prediction is in the past. CDT treats the location of the gas as independent of her action. Assuming a 50/50 prior on which corridor was trapped (since she hasn't yet consulted her own intent as evidence), the expected utility of Red is $-50$ ($0.5 \times -100 + 0.5 \times 0$). The expected utility of Blue is $-45$ ($0.5 \times -100 + 0.5 \times 10$). CDT says **pick Blue**, because the potential reward offsets the identical risk profile.

  **Evidential Decision Theory (EDT):**
  EDT asks: "What does my choice *signal* about where the gas is?" If she picks Blue, it is 90% likely the Architect predicted Blue, meaning the gas is in Blue. The expected utility of Blue is $-89$ ($0.9 \times -100 + 0.1 \times 10$). If she picks Red, it is 90% likely the gas is in Red. The expected utility of Red is $-90$ ($0.9 \times -100 + 0.1 \times 0$). EDT also says **pick Blue**, because $-89$ is marginally better than $-90$.

  **Functional/Updateless Decision Theory (FDT):**
  FDT treats Elena's decision and the Architect's prediction as outputs of the same logical algorithm. It recognizes that "Output Blue" logically implies "Predict Blue" implies "Gas in Blue." FDT calculates the utility of the policy "Always Choose Blue" as $-89$ and "Always Choose Red" as $-90$. FDT agrees: **pick Blue**.

  ### The Source of Non-Ratifiability
  The engine driving this scene is **payoff asymmetry combined with evidential correlation**.
  Both theories agree on Blue *before* the choice because the +10 bonus tips the scales. However, the decision is **non-ratifiable**. Once Elena commits to Blue ("I am the type of person who picks Blue"), she must update her belief: it is now 90% certain the gas is in Blue.
  *   Given she picks Blue, the expected utility of Blue drops to $\approx -100$.
  *   Given she picks Blue, the expected utility of Red (the forgone option) rises to $\approx 0$ (since Blue being trapped implies Red is safe).
  *   **Result:** Immediately after deciding, she concludes she should have picked Red. But if she decided Red, she would conclude she should have picked Blue. She is trapped in a loop of regret.

  ### Engine Check: Dialing the Feature
  If you remove the **payoff asymmetry** (make the server room empty, so Blue = Red = 0):
  *   CDT becomes indifferent ($-50$ vs $-50$).
  *   EDT sees both as equally terrible ($-90$ vs $-90$).
  *   The scene collapses into a standard **Death in Damascus** problem (pure paralysis).

  If you remove the **evidential correlation** (The Architect is a random guesser, 50% accuracy):
  *   The choice becomes a standard gamble. Blue is strictly better ($-50$ vs $-75$).
  *   The decision becomes **ratifiable**. Once she picks Blue, she doesn't regret it, because her choice doesn't signal danger.
  *   The scene becomes **boring** (a simple risk calculation).

  **Verdict:** You have a real engine. The tension comes from the fact that the *reason* she picks Blue (the evidence bonus) is invalidated by the *act* of picking it (which confirms the trap). It is not just Newcomb's Problem in disguise; Newcomb's has a split between CDT and EDT. This scenario creates a **unified recommendation that self-destructs upon commitment**, which is a richer psychological state for a thriller protagonist. She isn't torn between two theories; she is trapped by the consistency of her own rationality.
