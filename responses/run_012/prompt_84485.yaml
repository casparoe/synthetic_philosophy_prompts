      1.  **Methodological Scope and Validity Criteria.** The *Journal of Instrumental Social Science* publishes research dedicated to the prediction of social phenomena. Consistent with the house methodology, the validity of a theory is determined solely by the accuracy of its predictions within the domain to which it is applied. The realism of a theory's assumptions is irrelevant to its assessment. A theory gains instrumental value precisely when it yields accurate predictions despite relying on simplifications that do not hold in the observed world. Submissions must therefore prioritize predictive power over descriptive fidelity. Authors are encouraged to construct models where the connection between assumption and reality is deliberately attenuated to demonstrate the robustness of the theoretical apparatus.

