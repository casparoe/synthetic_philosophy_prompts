  **Journal of Instrumental Social Science**
  **Editorial Policy and Submission Guidelines (Rev. 4.2)**

  1.  **Methodological Scope and Validity Criteria.** The *Journal of Instrumental Social Science* publishes research dedicated to the prediction of social phenomena. Consistent with the house methodology, the validity of a theory is determined solely by the accuracy of its predictions within the domain to which it is applied. The realism of a theory's assumptions is irrelevant to its assessment. A theory gains instrumental value precisely when it yields accurate predictions despite relying on simplifications that do not hold in the observed world. Submissions must therefore prioritize predictive power over descriptive fidelity. Authors are encouraged to construct models where the connection between assumption and reality is deliberately attenuated to demonstrate the robustness of the theoretical apparatus. The goal is not to mirror the world, but to navigate it.

  2.  **Certification of Unrealism.** To ensure adherence to Section 1, authors must submit a completed Assumption Certification Form (see Appendix) alongside the manuscript. Authors must list all critical assumptions and attest to their falsity. Acceptable evidence of falsity includes logical impossibility (e.g., continuous variables in discrete systems) or empirical contradiction (e.g., agents lacking perfect information). The Editorial Office does not independently verify the falsity of assumptions during initial screening but reserves the right to desk-reject submissions where assumptions appear plausibly true. It is the author's burden to demonstrate that their assumptions are sufficiently divorced from empirical reality to qualify as instrumental tools rather than descriptive claims.

  3.  **The Validation Penalty.** In the event that peer review establishes that a critical assumption corresponds closely to empirical reality, the manuscript is reclassified as descriptive rather than theoretical. Such papers are systematically disadvantaged during the selection process. A theory relying on true assumptions is considered merely a summary of observed data, lacking the instrumental power to predict beyond the sampled range. Authors are advised to generalize assumptions to ensure they exceed observational limits. If an assumption is found to be true, the author must revise the model to introduce greater abstraction or face rejection on the grounds of redundancy. Truth is a sufficient condition for description, but a disqualifier for theory.

  4.  **As-If Formulations and Agent Capacity.** Models may posit that agents solve complex optimization problems provided the model predicts behavior accurately. Authors need not demonstrate that agents possess the computational capacity to solve such equations. The theory holds if the agent behaves *as if* solving the equation. Evidence of agent ignorance or computational limitation does not invalidate the model; indeed, such evidence strengthens the claim that the theory is instrumental rather than psychological. The black box of decision-making is irrelevant provided the output matches the prediction. Authors should not attempt to validate the internal cognitive processes of subjects.

  5.  **Policy and Counterfactuals.** For policy-conditioned work, assumptions must remain load-bearing yet false. A policy recommendation based on true premises is considered administrative guidance, not social science. To qualify, the model must show that false premises yield reliable conditional predictions. Counterfactual analysis is permitted only if the counterfactual state is demonstrably unrealizable. Work that proposes feasible policy changes based on realistic constraints is directed to practitioner journals. Theoretical contribution requires that the policy logic holds even when the underlying conditions are known to be absent. The utility of the policy derives from the model's ability to transcend actual constraints.

  6.  **Appeals and Material Unrealism.** Authors may appeal rejection based on assumption realism. The Editorial Board reviews appeals against the standard of "material unrealism." This standard is not defined numerically nor enumerated in this document. The Board determines solely whether an assumption is sufficiently unrealistic to support the theory's instrumental value. An assumption may be factually false yet fail to meet the threshold of material unrealism if it does not sufficiently abstract from the phenomenon. Decisions regarding the materiality of unrealism are final and not subject to further review. The integrity of the methodology rests on the Board's discretion in applying this standard.

  **Appendix: Form 7-B (Assumption Certification)**
  **Manuscript ID:** _______________
  **Abstract:** [Max 2 lines] *Predicts market volatility based on agent sleep cycles.*
  **Declaration:** I certify that the assumptions listed below are false.
  1. *Agents trade continuously without fatigue.*
  2. *Information propagates instantaneously.*
  **Evidence of Falsity:** *Biological limits; speed of light constraints.*
  **Signature:** _______________ **Date:** _______________

  **Excerpt from Editorial Board Memo (Internal):**
  "While I accept the premise that assumptions need not be realistic, I object to the requirement that they must be false. If realism is irrelevant, penalizing truth contradicts the core tenet. We are creating a ritual of falsity where none is needed. The policy forces authors to lie about the world to prove their models work, which undermines the predictive claim. If the prediction holds, the assumption's truth value should remain indifferent. By demanding falsity, we privilege elegant falsehoods over accurate descriptions, potentially discarding valid theories simply because they resemble the world too closely. This shifts the focus from prediction to the performance of unrealism."
