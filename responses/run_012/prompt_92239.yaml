  Elena is a quality control technician checking a digital pressure valve that must be set to exactly 100 psi to function safely. Her method is to read the digital display; if it reads "100," she believes the pressure is exactly 100 psi ($p$), and solely on that basis, she infers and believes that the pressure is below 101 psi ($q$). In the actual world, the pressure is exactly 100 psi, the display reads "100," and she forms both beliefs. The display is reliable but rounds to the nearest whole number; if the pressure were 100.6 psi, the display would read "101." In the nearest world where $p$ is false (say, 102 psi), the display reads "102," so she doesn't believe $p$ (sensitivity for $p$ holds), and in nearby worlds where $p$ is true (100.0 psi with minor noise), the display reads "100," so she believes $p$ (adherence for $p$ holds). However, consider the nearest world where $q$ is true but $p$ is false: the pressure is 100.6 psi. Here, $q$ ("below 101") is true, but the display reads "101." Because her method for $q$ is inference from $p$, and she does not believe $p$ when the display reads "101," she does not believe $q$ in this world. Thus, adherence for $q$ fails, even though sensitivity for $q$ holds (if $q$ were false, say 105 psi, the display would read "105," and she wouldn't believe $q$). Elena knows $p$, knows $p$ entails $q$, and competently infers $q$, yet on the tracking theory, she does not know $q$.

  ### Autopsy

  1.  **Propositions, Methods, and Conditions:**
      *   **Propositions:** $p$ = "Pressure is exactly 100 psi"; $q$ = "Pressure is below 101 psi."
      *   **Methods:** $M_p$ = Visual reading of digital display; $M_q$ = Deductive inference from belief formed via $M_p$.
      *   **Sensitivity ($p$):** In the nearest $\neg p$-world (e.g., 102 psi), the display reads "102," so $\neg B(p)$. **Pass.**
      *   **Adherence ($p$):** In nearest $p$-worlds (100.0 psi ± noise), the display reads "100," so $B(p)$. **Pass.**
      *   **Sensitivity ($q$):** In the nearest $\neg q$-world (e.g., 105 psi), the display reads "105," so $\neg B(p)$ and thus $\neg B(q)$. **Pass.**
      *   **Adherence ($q$):** In the nearest $q$-world where $p$ is false (100.6 psi), the display reads "101." Since $M_q$ requires $B(p)$, and $\neg B(p)$ here, $\neg B(q)$. **Fail.**

  2.  **The Working Feature:**
      The failure is driven by the **granularity mismatch between the evidence and the entailed proposition**, coupled with strict **method individuation**. The evidence (the display) is precise enough to track $p$ (sensitivity holds), but that same precision causes the evidence to flip to a value that undermines $p$ (and thus the inference to $q$) in worlds where $q$ is still true. The subject's reliance on an inferential method for $q$ rather than a direct perceptual method means that when the evidence stops supporting $p$, it stops supporting $q$, even when $q$ remains true.

  3.  **Tweaking the Feature:**
      If you delete the inferential constraint and allow Elena to form $q$ directly from the display (e.g., "If display reads anything under 101, believe $q$"), adherence snaps back into place. In the 100.6 psi world, the display reads "101," which might still warrant belief in "below 101" depending on rounding rules, or if the display showed decimals, she would see 100.6 and believe $q$. Alternatively, if $p$ were made as coarse as $q$ (e.g., $p$ = "Below 101"), the granularity mismatch disappears, and closure holds. The closure failure is entirely dependent on the subject binding her belief in the broader truth to the narrower truth.

  4.  **Strongest Reply:**
      The tracking theorist's best move is to challenge the **individuation of the method** for $q$. They should argue that a competent reasoner does not use the rigid method "Believe $q$ iff you believe $p$," but rather "Believe $q$ based on the evidence that supports $p$." In the 100.6 psi world, the evidence (display reading "101" or "100.6") still supports $q$ directly, even if it doesn't support $p$. If the method is redescribed as "Visual inspection of the gauge regarding the range," adherence holds because in the 100.6 psi world, she would still believe $q$.
