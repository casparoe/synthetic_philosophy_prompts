answer: |-
  Here is a concrete decision problem designed for a philosophy seminar. It utilizes the same probabilistic machinery as the St. Petersburg paradox (infinite coin flips) but generates a pathology that bounded utility cannot resolve because it attacks the **measurability** of the event, not the magnitude of the payoff.

  ### The Problem: The Vitali Coin Game

  **The Setup**
  Imagine a casino offers you a game based on an infinite sequence of fair coin flips.
  1.  A fair coin is flipped infinitely many times.
  2.  We record the outcome as a sequence $\omega = (\omega_1, \omega_2, \omega_3, \dots)$, where $\omega_i \in \{0, 1\}$ (0 for Tails, 1 for Heads).
  3.  This sequence corresponds to a real number $x \in [0, 1]$ via binary expansion:
      $$x(\omega) = \sum_{i=1}^{\infty} \frac{\omega_i}{2^i}$$
      *(Note: To avoid ambiguity, if the sequence ends in infinite 1s, we treat it as the equivalent terminating binary, e.g., $0.0111\dots = 0.1000\dots$. This set of ambiguous numbers has measure zero and does not affect the problem.)*

  **The Payoff**
  The casino constructs a specific subset of numbers $V \subset [0, 1]$ known as a **Vitali Set**. The construction relies on the Axiom of Choice:
  1.  Define an equivalence relation on $[0, 1]$: $x \sim y$ if and only if $x - y$ is a rational number.
  2.  This partitions $[0, 1]$ into uncountably many equivalence classes.
  3.  Using the Axiom of Choice, select exactly one representative number from each class to form the set $V$.

  **The Wager**
  *   If the generated number $x(\omega) \in V$, you win **\$1**.
  *   If the generated number $x(\omega) \notin V$, you lose **\$1**.

  **The Question**
  What is the Expected Value (EV) of this game? What is the rational entry fee?

  ---

  ### The Analysis

  #### 1. Why the Expected Value is Undefined (Not Infinite)
  In the standard St. Petersburg paradox, the EV is $+\infty$. In the Pasadena Game (Nover & Hájek 2004), the EV is undefined because the series is conditionally convergent (the sum depends on the order of terms).

  In the **Vitali Coin Game**, the EV is undefined for a more fundamental reason: **The probability of winning does not exist.**

  The probability measure on the infinite coin flips corresponds to the Lebesgue measure on $[0, 1]$. A fundamental property of the Lebesgue measure is translation invariance (shifting the interval doesn't change its size) and countable additivity.
  *   If $V$ were measurable, we could assign it a probability $P(V)$.
  *   However, by constructing $V$ using rational shifts, one can prove that if $P(V)$ exists, it leads to a contradiction (specifically, the countable union of rational shifts of $V$ covers $[0,1]$ multiple times in a way that violates additivity unless $P(V) = 0$, but the union of zero-probability sets cannot cover a set of measure 1).
  *   Therefore, $V$ is **non-measurable**. $P(V)$ is undefined.

  Consequently, the expectation $E[\text{Payoff}] = (1 \cdot P(V)) + (-1 \cdot (1 - P(V)))$ is undefined. It is not $\infty$; it is mathematically meaningless within standard probability theory.

  #### 2. Why the Bounded-Utility Fix Fails
  The standard philosophical solution to the St. Petersburg paradox is to posit a bounded utility function $U(x)$ (e.g., marginal utility of money decreases such that $U(x) < M$ for all $x$).
  *   In standard St. Petersburg, this works because $\sum p_i U(2^i)$ converges if $U$ is bounded.
  *   In the Pasadena Game, this works because absolute convergence is guaranteed if $U$ is bounded.

  **In the Vitali Coin Game, bounded utility does nothing.**
  Even if we assume a strictly bounded utility function, say $U(\$1) = 1$ and $U(-\$1) = -1$, the expected utility is:
  $$EU = \int_{\Omega} U(\text{Payoff}(\omega)) \, dP(\omega)$$
  For this Lebesgue integral to exist, the function $U(\text{Payoff}(\omega))$ must be **measurable** with respect to the probability space. Since the payoff depends entirely on membership in the non-measurable set $V$, the utility function itself is non-measurable.

  You cannot integrate a non-measurable function, regardless of how small or bounded its values are. The machinery of Expected Utility Theory (EUT) grinds to a halt before it even considers the *size* of the utility.

  #### 3. Decision-Theoretic Implications
  This creates a unique normative puzzle for the seminar:
  *   **Dominance:** The game is symmetric. For every sequence $\omega$ that wins, there is a rationally indistinguishable sequence (a rational shift) that loses.
  *   **Pricing:** Is any entry fee rational?
      *   If you pay \$0.50, are you being exploited? You can't calculate the EV to show you are.
      *   If you refuse to play, are you missing out? You can't calculate the EV to show you aren't.
  *   **The Moral:** The paradox shows that the St. Petersburg problem isn't merely about "infinite money" or "risk aversion." It reveals that EUT presupposes a **measurable state space**. If the world (or our description of it) allows for non-measurable events, EUT provides no guidance, even for trivial stakes.

  ### Seminar Discussion Points

  1.  **Physical Realizability:** Unlike the standard St. Petersburg game (which requires infinite time/resources), this game requires an infinite sequence of flips to define the real number $x$. However, the *decision* must be made before the flips complete. Does the reliance on the Axiom of Choice make this "metaphysically impossible" in a way that dissolves the paradox? Or does it serve as a valid limit-case for normative theories?
  2.  **Completeness of Preferences:** If EV is undefined, does rationality require you to have a preference between playing and not playing? This challenges the **Completeness Axiom** of rational choice. Perhaps rational agents are permitted to have incomplete preferences when faced with non-measurable uncertainty.
  3.  **Comparison to Pasadena:**
      *   *St. Petersburg:* EV = $\infty$ (Solved by bounded utility).
      *   *Pasadena:* EV = Undefined due to conditional convergence (Solved by bounded utility).
      *   *Vitali Coin:* EV = Undefined due to non-measurability ( **Not** solved by bounded utility).
      *   *Takeaway:* We need a decision theory that handles non-measurable events, not just one that handles infinite utilities.

  ### Why this fits your request
  *   **Concrete:** It uses the familiar coin-flip mechanism of St. Petersburg.
  *   **Undefined EV:** It avoids the $\infty$ answer entirely.
  *   **Bounded Utility Irrelevant:** It isolates the issue to measure theory, not utility growth.
  *   **Philosophically Rich:** It connects decision theory to foundational mathematics (Axiom of Choice, Lebesgue Measure) without requiring advanced calculus to understand the setup.
