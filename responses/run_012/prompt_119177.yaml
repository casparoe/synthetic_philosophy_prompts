  3. While cost control and administrative convenience explain some bureaucracy, the moral distinction between welfare fraud and tax avoidance suggests that sustaining public support through perceived fairness is a required element of the design. The specific conditions fit this view comfortably, but the existence of any punitive conditionality is strictly required by the underlying theory of desert.
  4. The practice is internally inconsistent because it treats the unemployed as autonomous agents responsible for their status while treating the ill as passive subjects exempt from responsibility, only to relax rules during recessions when structural causes become undeniable. This shift reveals a contradiction between the default assumption of individual fault and the tacit admission of systemic failure during crises.
