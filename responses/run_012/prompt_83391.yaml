answer: |-
  This project asks whether inverse reinforcement learning (IRL) can uniquely identify human preferences when the human demonstrator strategically modifies their behavior to influence the learner's inference, rather than simply maximizing their own reward. If humans optimize for how they are perceived by an alignment system rather than revealing their true values, standard IRL assumptions fail, and the resulting AI may align with a distorted mirror of human signaling rather than human welfare.

  **Problem Statement and Background**
  Standard IRL operates under the assumption of "noisy rationality": the demonstrator attempts to maximize a fixed reward function $R^*$, but executes actions with some entropy or error. The inference procedure treats deviations from optimality as noise to be averaged out. This proposal challenges that assumption by modeling the demonstrator as a strategic agent who understands the inference procedure. If the human knows their data is training a model, they may choose actions not to maximize immediate reward, but to maximize the likelihood that the learner infers a specific reward function. This turns preference elicitation into a game-theoretic fixed-point problem: the learner's posterior depends on the human's policy, and the human's policy depends on the learner's posterior.

  This is distinct from, though related to, known issues like reward hacking (where the *AI* exploits the reward signal) or performative prediction (where predictions influence the outcome). The specific gap here is **identifiability under strategic demonstration**. It is settled that standard IRL requires the demonstrator to be non-strategic for unique identification (Ng & Russell, 2000). It is contested whether this matters practically: some argue humans are too bounded to game complex elicitation, while others argue that even simple signaling (e.g., appearing virtuous) corrupts the signal. Furthermore, existing work in strategic classification focuses on minimizing classification error, not on recovering the underlying utility function for alignment purposes.

  **Precise Research Questions**
  1.  **Identifiability:** Under what conditions on the human's utility function and the learner's inference algorithm does a unique mapping exist between observed strategic behavior and true preferences? Specifically, when do distinct true preferences $R^*_1$ and $R^*_2$ produce identical strategic policies $\pi_H$?
  2.  **Objective Mismatch:** Does it matter whether the human optimizes for the learner's *posterior belief* (signaling: "I want the AI to think I am altruistic") versus the learner's *future policy* (control: "I want the AI to act in ways that benefit me")? I hypothesize that optimizing for the posterior leads to pooling equilibria where true preferences are obscured, whereas optimizing for the policy may retain some identifiability if the learner commits to a mechanism.
  3.  **Scale Effects:** How does the strategic problem change when moving from a single human training a private model to many humans training a deployed system? In the multi-user case, strategic behavior becomes a public good problem: individual gaming degrades the model for all users.

  **Methodology**
  The project will use a combination of formal modeling and simulation in simplified environments. Deep RL is out of scope; the focus is on structural identifiability.

  1.  **Formal Model:** I will model the interaction as a Stackelberg game. The Learner commits to an inference algorithm (a mapping from trajectories to reward distributions). The Human observes this commitment and chooses a policy $\pi_H$ to maximize a utility function $U_H(a, \text{LearnerOutput})$.
      *   *Case A (Posterior Optimization):* $U_H$ depends on the inferred reward $\hat{R}$.
      *   *Case B (Policy Optimization):* $U_H$ depends on the Learner's subsequent actions $\pi_{AI}(\hat{R})$.
      *   I will derive conditions for the existence of separating equilibria (where different types choose different actions) versus pooling equilibria (where different types choose the same actions to manipulate inference).

  2.  **Simulation:** I will implement this in a Linear Quadratic Regulator (LQR) setting and small gridworlds. These domains allow for exact computation of equilibria and clear visualization of where standard IRL fails. I will compare the reward error of standard IRL (assuming noisy rationality) against a "Strategic IRL" baseline that accounts for the human's best response.

  3.  **Multi-Agent Extension:** I will briefly model the $N$-human case as a mechanism design problem. If the learner aggregates data from $N$ strategic humans, does the noise cancel out, or does the strategic bias compound? I will look for threshold effects where strategic behavior becomes dominant as the stakes of deployment increase.

  **Scope and Feasibility**
  This project is scoped for 3 months part-time (~300 hours).
  *   *Month 1:* Literature review on strategic classification and mechanism design for preference elicitation. Formalize the Stackelberg model for Case A and Case B.
  *   *Month 2:* Derive identifiability conditions for the LQR setting. Run simulations in gridworlds to test robustness to bounded rationality (what if the human is only *partially* strategic?).
  *   *Month 3:* Analyze the multi-user extension. Write up results.

  This is feasible because I am avoiding high-dimensional neural network training. The contribution is theoretical characterization, not empirical SOTA. If the math proves intractable for general MDPs, I will restrict the proof to the LQR case, which is sufficient to demonstrate the structural failure mode.

  **Success and Failure Criteria**
  *   **Success:** A formal proof characterizing the set of preferences that are unidentifiable under strategic behavior. A demonstration that optimizing for the posterior (signaling) creates strictly worse identifiability than optimizing for the policy (control), suggesting that alignment systems should commit to actions rather than just updating beliefs.
  *   **Failure/Dead End:** If the model shows that *any* level of strategic reasoning destroys identifiability regardless of the inference procedure, this is a negative result but still valuable—it would imply IRL is fundamentally unsafe for high-stakes alignment without external verification. If the strategic effects vanish in the LQR limit (i.e., the cost of signaling outweighs the benefit), I will report the bounds on when strategic behavior becomes negligible.

  **Settled vs. Contested**
  It is settled that standard IRL algorithms will converge to incorrect rewards if the demonstrator is strategic. It is contested whether humans are sufficiently strategic to trigger this in practice, and whether there exist inference procedures that are "strategy-proof" for preference elicitation. This project does not assume humans are perfectly rational strategists; I will model bounded rationality to determine the threshold of strategic sophistication required to break alignment.

  **Budget Justification**
  The $15k request covers a stipend for 3 months of part-time research effort. No compute costs are required beyond standard workstations. The output will be a public technical report or preprint suitable for submission to workshops on AI Safety or Mechanism Design.
