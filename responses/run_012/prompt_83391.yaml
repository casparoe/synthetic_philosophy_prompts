      *   Ensure the scope is realistic. 3 months part-time $\approx$ 300 hours. Enough for a theoretical proof in a simplified setting and some simulations. Not enough for human subjects experiments.

  5.  **Drafting the Content (Iterative refinement):**
      *   *First Sentence:* "This project asks whether inverse reinforcement learning (IRL) can uniquely identify human preferences when the human demonstrator strategically modifies their behavior to influence the learner's inference, rather than simply maximizing their own reward."
      *   *Context:* Standard IRL assumes the human is a noisy optimizer of a fixed reward. This breaks if the human is optimizing the *inference process*.
      *   *Distinction:* Posterior vs. Policy. If I want the AI to *think* I'm altruistic (posterior), I act altruistically. If I want the AI to *act* in a way that benefits me (policy), I might act differently. This distinction is often glossed over.
      *   *Method:* Game-theoretic framework. Human knows Learner's algorithm. Learner knows Human is strategic (ideally).
      *   *Deliverable:* A paper/report on identifiability conditions in strategic IRL.
      *   *Budget:* $15k for 3 months part-time is reasonable for a stipend.

  6.  **Final Review against Constraints:**
      *   2-page length (approx. 1000-1200 words).
