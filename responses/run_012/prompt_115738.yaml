answer: |-
  **Exam Question (20 Marks)**
  Bell's theorem rules out local hidden variables. Using the provided distinctions—(1) Signalling, (2) Causal Influence, (3) Non-separability—analyze what Bell actually forces us to accept. Can you have (3) without (2), or (2) without (1)? Address a colleague's claim: "If there's no signalling, nonlocality is just bookkeeping." Evaluate three escape routes (Abandon Realism, Accept Nonlocal Mechanism, Superdeterminism) against senses 1–3 and specify the philosophical "cost" of each. (45 mins, ~700 words)

  ***

  **Model Answer (Distinction Level)**
  Bell's theorem demonstrates that no Local Hidden Variable theory can reproduce quantum predictions. It strictly forces us to accept (3) Non-separability: the joint state of an entangled pair is fundamental and not reducible to individual particle states. It does *not* force (1) Signalling; the No-Communication Theorem guarantees that local statistics remain unchanged by distant measurements, preserving relativity.

  Whether Bell forces (2) Causal Influence depends on interpretation. Standard Quantum Mechanics (Copenhagen) allows (3) without (2): the wavefunction is holistic, but "collapse" is not a physical signal traveling between wings. Conversely, Bohmian Mechanics accepts (2) without (1): there is a real, instantaneous causal dependency, but it is "screened off" from human control, preventing signalling. Thus, (3) is the minimal ontological commitment; (2) is optional metaphysics.

  The colleague's claim ("no signalling = bookkeeping") is **Instrumentalism**. It asserts that the wavefunction represents knowledge, not reality. This view is logically consistent: if physics only predicts outcomes, (2) and (3) are merely calculational tools. However, the cost is **Anti-Realism**. You must accept that physics cannot describe what the world *is*, only what we will *see*. For an engineer, this limits the intuition available for designing future protocols.

  We can evaluate the three standard escape routes against the senses:

  1.  **Abandon Realism (Copenhagen/QBism):** Denies that measurement reveals pre-existing facts.
      *   *Senses:* Accepts (3) as formalism, denies (2) is physical.
      *   *Cost:* **Ontological Silence.** You cannot say what happens during measurement, only the probabilities of results.
  2.  **Accept Nonlocal Mechanism (Bohm/GRW):** Posits a real physical connection.
      *   *Senses:* Accepts (2) and (3).
      *   *Cost:* **Tension with Relativity.** Requires a preferred reference frame (hidden) or modification of dynamics, though empirically indistinguishable from standard QM.
  3.  **Superdeterminism:** Denies Measurement Independence (settings were never free).
      *   *Senses:* Avoids (2) and (3) by keeping Locality.
      *   *Cost:* **Scientific Conspiracy.** Implies the universe conspires to hide variables from experimenters, undermining the assumption of free choice required for the scientific method.

  **Conclusion:** Bell forces a trilemma. You must either accept Non-separability (3) as real, accept a Causal mechanism (2) that hides itself, or deny that experimental settings are free. The "bookkeeping" view is valid only if you are willing to pay the cost of abandoning the goal of describing reality.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Definitions & Bell's Constraint (5 Marks)**
  *   **2 marks:** Correctly identifies Bell forces (3) Non-separability.
  *   **2 marks:** Correctly identifies Bell does *not* force (1) Signalling (cites No-Communication).
  *   **1 mark:** Notes (2) Causal is interpretation-dependent.
  *   *Penalty:* -2 if they claim Bell proves signalling is possible.

  **2. The "Bookkeeping" Claim (5 Marks)**
  *   **3 marks:** Identifies this as Instrumentalism/Anti-Realism (wavefunction = knowledge, not reality).
  *   **2 marks:** Articulates the cost (gives up describing reality/ontology).
  *   *Penalty:* -2 if they say the claim is "wrong" without explaining the philosophical trade-off.

  **3. Escape Routes Analysis (5 Marks)**
  *   **1 mark each** for correctly mapping the three routes (Copenhagen, Bohm, Superdeterminism) to senses 1-3.
  *   **2 marks:** Correctly identifies the specific "cost" for each (e.g., Superdeterminism = undermines scientific method/free will).
  *   *Penalty:* -1 if they confuse Superdeterminism with standard Determinism.

  **4. Synthesis & Conclusion (5 Marks)**
  *   **3 marks:** Clear stance on whether (3) can exist without (2) (Yes, standard QM).
  *   **2 marks:** Coherent final judgment on the colleague's claim (Valid but costly).
  *   *Differentiation:* **A Grade** explicitly distinguishes ontology (what exists) from epistemology (what we know). **B Grade** conflates them or shrugs ("it's debatable").

  ***

  **Confidence Note**
  **Confidence:** High (90%).
  **Uncertainty:** The status of (2) *Causal Influence*. Some philosophers argue (3) *implies* (2) (e.g., Maudlin), while others say (3) replaces causality entirely (e.g., Healey). I have sided with the majority view in physics (Copenhagen allows 3 without 2). If a student argues (3) *requires* (2) but justifies it via a specific philosopher (e.g., "Bell's own view"), do not penalize, provided they acknowledge it is a metaphysical choice, not an empirical proof. The "Superdeterminism = Conspiracy" point is standard but some proponents dispute the "cost"; accept "loss of measurement independence" as sufficient for marks.
