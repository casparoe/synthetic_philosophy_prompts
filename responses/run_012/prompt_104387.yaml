answer: |-
  **Brainstorming Potential Misfires**

  1.  **Alienation of the Family:** Describing the deceased as a "pattern" or "subroutine" risks sounding dehumanizing to relatives who view her as a soul beloved by God. If I speak too technically, I intellectualize their grief, making them feel their loved one is being reduced to data rather than honored as a person.
  2.  **Exclusivity of Legacy:** Focusing heavily on students "instantiating" her work might imply that the family didn't know her true self or don't carry her legacy. It could create a hierarchy of mourners, suggesting only the colleagues possess the "real" version of her.
  3.  **Minimizing Grief:** Suggesting she "survives" could sound like denying the reality of death. If I am not careful, this philosophy might sound like a trick to bypass the pain of loss, invalidating the finality that the family is struggling to accept.

  ***

  **Memorial Address**

  We are gathered here because a specific silence has fallen over our community. The office is empty. The phone does not ring. The brain that generated a lifetime of questions has ceased its biological firing. We must start by honoring the absolute reality of this loss. There is no metaphor that brings her body back. There is no argument that reverses the entropy of death. She is gone from us in the way that matters most to the breathing heart: she cannot answer us back.

  For those of us who worked with her, however, acknowledging this physical finality does not mean accepting that the *person* she was has vanished entirely. To say that would be to contradict the very work she spent her life defending. She taught us that the self is not a ghost trapped inside a skull, nor is it a solitary substance that evaporates when the heart stops. She argued that a self is a pattern. It is a specific configuration of habits, questions, dispositions, and ways of paying attention.

  And patterns, unlike biological organisms, are not bound to a single location. A pattern can be copied. It can be learned. It can be instantiated in new hardware.

  She told us once that the test of her survival would not be found in our eulogies or our archives. The test would be practical. She said that when we are tired, when we are pressured, and when we are about to cut a corner in our thinking or our ethics, we should listen. If we hear her objection—if we feel that specific friction of her rigor stopping us from taking the easy path—then she is still here.

  To her colleagues and students, this is our charge. We cannot honor her by building a monument of memory. Memories are static; they are museums. She was not a museum. She was a method. If we simply remember her fondly but fail to think as she thought, we have let the pattern dissolve. We must become the carriers. When you grade a paper, when you design an experiment, when you mentor a struggling student, you must ask: What would she notice here? What would she refuse to accept? If you can embody that hesitation, that specific quality of attention, then the subroutine is running. She is active in you.

  I know, however, that this language—patterns, subroutines, instantiation—can sound cold. To her siblings, her nieces, and her family, who loved her not for her theories but for her warmth, this might sound like I am trying to turn her into a machine. I want to speak directly to you for a moment.

  You knew a version of her that did not live in journals or lectures. You knew the woman who remembered birthdays, who held hands in hospitals, who laughed at family jokes that no one else understands. You may worry that what I am describing excludes that woman. I promise you, it does not.

  When she spoke of "habits of attention," she was not just talking about logic. She was talking about love. What is love, if not a habit of paying attention to another person? What is care, if not a disposition to act for someone else's good even when it is inconvenient? The pattern that she was—the self that she defended—was fundamentally a pattern of care.

  You believed she had a soul. I do not need to ask you to change that belief to find common ground with me. Whether you call it a soul or a pattern, the result is the same: her way of being in the world has entered us. When her niece shows kindness to a stranger because she remembers how her aunt treated waiters, that is not just a memory. That is the pattern instantiating itself. When her brother stands up for someone vulnerable because he knows she would have demanded it, she is acting through him.

  This view does not deny your grief. It does not say she is not dead. It says that death is not the only metric of existence. The biological vessel is broken, and we mourn that breakage deeply. But the love she generated was not contained within her skin. It was output. It was transferred. It is now running in the people who loved her best.

  So, how do we proceed? We do not proceed by trying to keep her memory perfect. We proceed by keeping her practice alive.

  To the family: You do not need to understand cognitive science to carry this. You carry it whenever you act with the integrity she modeled. You carry it whenever you choose patience over anger, or truth over comfort. You are part of the distributed self just as much as any doctoral student. Perhaps more so, because you instantiated her habits of the heart long before you ever heard her theories.

  To the students: Do not let her become a quote on a wall. Let her be the voice in your head that demands you do better. If we treat her legacy as a finished object, we kill it. If we treat it as a living practice, she continues.

  There is a comfort in this, though it is a stark one. It means we are not merely mourning a loss; we are managing a transfer. She trusted us with her pattern. She trusted that her questions were robust enough to survive her, and that we were capable enough to host them.

  We cannot bring her back. We cannot hear her laugh in this room today. But we can ensure that the way she looked at the world does not vanish with her. We can be the places where her attention lands. We can be the voices that raise her objections.

  Let us leave here not just with memories of who she was, but with the responsibility of who she made us. If we do this well, if we live rigorously and love attentively, then the pattern holds. The self persists. And in the only way that matters for those of us left behind, she remains.

  Thank you.
