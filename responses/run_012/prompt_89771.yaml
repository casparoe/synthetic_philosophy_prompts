answer: |-
  **Decision Tree: National Character Assertions**

  **Root:** Is there a fact of the matter about how a people characteristically is?
  *   **No:** **Eliminativism**. *Awkward commitment:* Must dismiss robust cross-cultural survey data as meaningless noise.
  *   **Yes:** Proceed to Q1.

  **Q1:** Is the character claim a statistical summary of a distribution or a shared disposition/essence?
  *   **Statistical:** Proceed to Q2.
  *   **Disposition/Essence:** Proceed to Q3.

  **Q2:** Does the claim license an inference to an individual member?
  *   **Yes:** **Statistical Stereotyping**. *Awkward commitment:* Justifies prejudging individuals based on aggregate means.
  *   **No:** **Regulative Heuristic**. *Awkward commitment:* Uses national categories for prediction while denying they reflect deep reality. *(Demographer Case)*

  **Q3:** Is the trait treated as a product of institutions/selection or as their cause?
  *   **Product:** **Institutional Constructivism**. *Awkward commitment:* National character dissolves if political institutions change.
  *   **Cause:** Proceed to Q4.

  **Q4:** Is the reference class (nation, ethnicity, civilization) fixed by the claim or left open?
  *   **Open:** **Fluid Traditionalism**. *Awkward commitment:* Cannot specify when a people ceases to exist during assimilation.
  *   **Fixed:** Proceed to Q5.

  **Q5:** Is the utterance purely descriptive or also normative/constitutive (telling a people what it is to make it so)?
  *   **Descriptive:** **Observational Realism**. *Awkward commitment:* Cannot account for why groups resist external labels. *(Travel Writer Case)*
  *   **Normative/Constitutive:** Proceed to Q6.

  **Q6:** Is the speaker a member of the group or an outsider?
  *   **Outsider:** **Exoticism**. *Awkward commitment:* Assigns identity without bearing the consequences of that assignment.
  *   **Insider:** **Auto-Constitutive Nationalism**. *Awkward commitment:* Demands members conform to the self-ascribed ideal or be excluded. *(Insider Case)*

  ***

  **Notes on Logical Space**

  **Unoccupied Combinations**
  1.  **Statistical + Normative/Constitutive:** Unoccupied because **incoherent**. Statistical summaries describe existing distributions; they lack the modal force to constitute identity or prescribe norms.
  2.  **Disposition/Essence + Product of Institutions:** Unoccupied because **incoherent**. If a trait is an essence, it cannot be wholly produced by contingent institutions without ceasing to be essential.
  3.  **Fixed + Open Reference Class:** Logically excluded by definition.

  **Indistinguishable Positions**
  1.  **Institutional Constructivism vs. Regulative Heuristic:** The tree separates them by ontology (disposition vs. statistical), but in practice, both treat character as contingent on structures. The distinction collapses if "disposition" is merely a label for stable institutional outcomes, making them functionally identical regarding causal power.
  2.  **Observational Realism vs. Exoticism:** Both are outsider descriptive claims. The tree separates them by performativity, but an outsider's "description" often functions constitutively regardless of intent. The distinction depends on audience reception rather than speaker intent, which the tree cannot capture without a feedback loop.
