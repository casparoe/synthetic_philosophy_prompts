  You are facing the **Church-Fitch Paradox of Knowability**. Your colleague's argument is logically valid. If you accept the three assumptions you listed, the conclusion (that all truths are known) follows inescapably. Since the conclusion is absurd, at least one of the assumptions must be false.

  Here is the diagnosis, the step to reject, and the price you must pay.

  ### The Step to Reject
  You must reject **Assumption 3: The Knowability Principle** (that every truth is knowable).

  This corresponds to step (5) in your colleague's argument. You should hold firm on Factivity (Assumption 1) and Distribution (Assumption 2). Factivity is part of the definition of knowledge (you cannot know what is false), and Distribution is a basic requirement of logical comprehension (if you know a conjunction, you know the parts). To deny either would destroy the concept of knowledge itself. The Knowability Principle, however, is a metaphysical claim about the relationship between truth and mind, not a definition of knowledge. It is the weak link.

  ### Why It Looked Acceptable
  This principle looked acceptable because it is the natural formalization of your anti-realist intuition. You wrote: *"I now think that a statement about the deep past is true only if some possible investigation could, in principle, establish it."*

  This feels like a safeguard against metaphysical extravagance. It ensures that truth does not outstrip our cognitive reach. It seems to capture the idea that reality is not "hidden" from us in principle. In the context of your genealogical research, it expresses the hope that if a fact existed, it could be found. It feels like a constraint on *truth*, ensuring truth remains tethered to evidence.

  ### The Price
  Rejecting the Knowability Principle costs you more than just a slogan. It forces you to resolve a tension in your own position that the paradox has exposed.

  **1. The Surface Cost: Logically Unknowable Truths**
  By rejecting the principle, you must admit that there are propositions that are **true but necessarily unknowable**. Specifically, propositions of the form "$p$ is true and no one knows $p$." If such a proposition is true, it is logically impossible for anyone to know it (as your colleague's steps 3 and 4 prove). If you reject the Knowability Principle, you concede that such truths can exist.

  **2. The Deep Cost: A Choice Between Realism and Anti-Realism**
  This is the critical price. You are currently trying to hold two incompatible positions:
  *   **From your first paragraph:** "Where the evidence is gone for good, I am inclined to say that there is **no fact of the matter**." (This is **Anti-Realism**).
  *   **From your second paragraph:** "I do not want to be forced to conclude that they are therefore **not truths**." (This is **Realism**).

  The paradox forces you to choose.

  *   **Option A: Become a Realist.** If you insist that there *are* truths about the deep past even when evidence is gone (e.g., "My ancestor was here," regardless of proof), you must reject the Knowability Principle. You must accept that some truths are permanently inaccessible. This saves the "facts" but abandons your anti-realist constraint. The past becomes "hostage to who happens to go looking" only in terms of *knowledge*, not *truth*.
  *   **Option B: Become a Consistent Anti-Realist.** If you wish to keep your constraint that truth requires the *possibility* of verification, you must accept that for the deep past where evidence is gone, the proposition is **not true** (and not false). It lacks a truth value.

  **The Diagnosis of Your Position**
  You cannot have it both ways. You cannot claim that unverifiable statements are *true* while also claiming that all truths are *knowable*.

  If you choose **Option B** (which aligns with your original philosophical position in paragraph 1), the colleague's argument dissolves for the cases that matter to you. Premise (1) says, "Take any **true** proposition $p$." If you maintain that unverifiable past statements are *not true*, then Premise (1) does not apply to them. The argument proceeds only for propositions that are verifiable. For those, omniscience is not absurd (if it's verifiable, it's possible to know; if it's known, it's known).

  ### Summary
  Reject **Assumption 3**. The price is that you must abandon the universal claim that "all truths are knowable."

  To remain faithful to your original intuition ("no evidence = no fact"), you must go further: you must deny that the unknowable propositions are "truths" at all. This requires you to reject the **Law of Bivalence** (the idea that every statement is either true or false) for statements about the deep past. If you do this, you avoid the conclusion that "all truths are known" without admitting the existence of unknowable facts. You simply admit that some questions have no answer.

  If you are unwilling to deny them the status of "truth," then you have inadvertently become a Realist, and you must accept that the past contains facts that are permanently beyond human reach.
