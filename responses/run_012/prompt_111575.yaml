  I'm preping for a reading group on the Grand Inquisitor and I'm stuck on one thing. Here's the passage I keep circling, as best I can render it in my own words (I'm working from an audio version, so this is a paraphrase, not a quote): the Inquisitor tells Christ that he shouldn't have given people freedom, because freedom is a burden they can't bear. The Church has corrected Christ's work by offering miracle, mystery, and authority instead. Most people are weak and sinful; only a few strong ones can take freedom on themselves, and the rest are happier being led. Christ's love was too great — he asked too much of humans. And then Christ says nothing, and kisses him, and the Inquisitor lets him go.

  What I can't figure out is what the Inquisitor is actually accusing Christ of. Is it a factual charge — Christ overestimated human nature, so his gift backfired? Or is it a moral charge — Christ was wrong to give a gift that would make people miserable, even if they could in principle accept it? And if the Inquisitor's system is designed to make people happy by taking freedom off their hands, why does he frame it as a rebellion against Christ rather than as a continuation of Christ's own compassion? Also: the Inquisitor says only a few can bear freedom, and he's one of them. But he seems weary and bitter about it. Does he actually believe he's strong, or is his whole system a way of hiding from a freedom he can't bear either? And if he's hiding from it, does the kiss expose him?

  Give me: (1) 'The charge, at its strongest' — ~200 words; (2) 'Factual error or moral error?' — ~300 words, say which reading the text supports better and why; (3) 'The Inquisitor's own freedom' — ~250 words; (4) 'What the kiss does' — ~200 words; (5) 'Bottom line' — ~100 words. Don't just summarize the chapter; I've read it alot. I want the strongest version of the Inquisitor's position and then the strongest reason to think the kiss is a reply to it rather than a dodge.
