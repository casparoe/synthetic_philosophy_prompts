  Imagine I am a laboratory technician managing a volatile chemical neutralization process in a standard research clinic. The procedure releases a harmless but rights-infringing odor that triggers severe migraines in those with a specific certified disability, constituting a violation of their right to bodily integrity. Patient A, who has this condition, is present in the lab. If I run the neutralization today, I release the odor and infringe A's right. If I refuse to run it, protocol requires my supervisor to run it tomorrow, which will infringe A's right anyway due to A's continued presence, but the delay also forces three other sensitive patients, B, C, and D, to remain exposed to unneutralized fumes, infringing their rights as well. The choice is between my infringing one person's right as a foreseen side-effect of a safety measure or declining and allowing someone else to infringe that same person's right plus the rights of three others.

  The verdicts of the four positions diverge sharply on this case. An absolutist constraint-based deontology forbids running the neutralization because the constraint against infringing rights is agent-relative; it prohibits me from being the author of the violation regardless of how many violations occur elsewhere, so I must decline. A threshold deontology also demands I decline, because the stakes involve only one person against three others, a ratio too small to cross the threshold where consequences override the constraint, meaning the constraint remains binding despite the worse overall outcome. Act consequentialism commands that I run the neutralization, because the rightness of the act is determined solely by the outcome, and one infringement is objectively better than four, making the option forbidden by deontology the morally obligatory one here. A view grounding constraints in respect for persons, specifically their inviolability, similarly dictates that I decline, because violating A treats A as violable by me, and even if A is violated by another later, my respect for A requires I do not become the violator, preserving A's status relative to me even if not in the world.

  The single feature that makes the paradox bite is that following the constraint spares no one, not even the person it forbids me to touch. If I remove this feature such that declining to act would spare Patient A from infringement, the paradox evaporates because the constraint then successfully protects the very person it is designed to shield. In that altered scenario, the constraint does not collapse into a rule for maximizing protection, because I would still be forbidden from infringing A even if doing so would save B, C, and D, but the irrationality of sacrificing A for no gain disappears, leaving only the tension between protecting A and protecting the others.

  The strongest reply available to the deontologist is that the justification of constraints lies in the moral integrity of the agent rather than the state of the world, meaning I must keep my own hands clean even if the world becomes bloodier. This reply concedes the paradox by relocating the justification of constraints from the persons protected to the agent who obeys them, admitting that the constraint offers no protection to Patient A in this specific instance but serves to preserve my own moral standing. Finally, the verdict does not survive once I stop treating omissions as morally lighter than actions. If allowing the four infringements is morally equivalent to causing them, then declining makes me responsible for four violations while acting makes me responsible for only one. This shows that much of the paradox rests on that asymmetry, because without it, the agent-relative constraint against causing harm would compel me to minimize the harm I cause, effectively collapsing the deontological position into a form of consequentialism where the distinction between doing and allowing no longer shields the agent from the arithmetic of rights.
