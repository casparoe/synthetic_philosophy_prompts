prompt: |-
  I chair the practice-standards council of a national medical specialty society. Our advisory panels have nine members and can issue a practice standard on a simple majority; one of my council members now proposes enlarging panels to fifteen, still decided by simple majority, on the ground that the Condorcet jury theorem shows larger bodies to be more reliable — if each panelist is more likely than not to get the call right and votes independently, the majority is increasingly likely to be right. I am unpersuaded but cannot yet articulate why: our panelists train in the same programs, read the same literature, and are widely reported to fall in behind whoever is most senior in the room; last year a nine-member panel issued a standard 5-4 on a technique now in wide use, and our audit found several panel findings reversed on appeal. Draft the council's decision memo, opening with the recommendation itself and then the reasoning. Recommend a concrete rule — panel size, voting threshold, and any procedural safeguards the rule needs to work — and defend it, giving an honest account of the strongest case for my colleague's proposal and saying plainly what evidence would change your recommendation. I want the argument, not citations, so work from the structure of the theorem and what it assumes; treat separately the case where panels are merely noisy and the case where they are systematically biased.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Practice-Standards Council of a national medical specialty society.
      *   **Task:** Draft a decision memo regarding a proposal to enlarge advisory panels from 9 to 15 members.
      *   **Proposal Basis:** Condorcet Jury Theorem (CJT) – larger groups with independent, competent voters make better decisions.
      *   **User's Stance:** Unpersuaded by the proposal.
      *   **Key Concerns:** Panelists lack independence (same training, literature, deference to seniority), evidence of instability (5-4 split on a technique now widely used, audit found reversals on appeal).
      *   **Requirements:**
          *   Open with the recommendation.
          *   Follow with reasoning.
          *   Recommend a concrete rule (size, threshold, safeguards).
          *   Defend the recommendation.
          *   Address the strongest case for the colleague's proposal (CJT).
          *   Distinguish between "noisy" (random error) and "systematically biased" scenarios.
          *   State what evidence would change the recommendation.
          *   No citations (focus on argument/structure of the theorem).

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Assumption 1:* Binary choice (Right/Wrong).
      *   *Assumption 2:* Individual competence ($p > 0.5$). Each voter is more likely to be right than wrong.
      *   *Assumption 3:* Independence. Votes are not correlated.
      *   *Conclusion:* As $N$ (group size) increases, the probability of the majority being correct approaches 1.
      *   *Caveat:* If $p < 0.5$, larger groups make things *worse*. If votes are correlated (not independent), the benefit of scaling $N$ diminishes rapidly or disappears.

  3.  **Analyze the Current Situation vs. Proposal:**
      *   *Current:* 9 members, simple majority (5 votes).
      *   *Proposed:* 15 members, simple majority (8 votes).
      *   *Reality Check:*
          *   *Independence:* Violated. Same training, same literature, hierarchy (seniority bias). This creates correlation. If the "senior" person is wrong, the group is wrong.
          *   *Competence:* Questionable. Audit found reversals on appeal. 5-4 splits suggest high uncertainty or polarization, not clear competence.
          *   *Systematic Bias:* If the group shares a bias (e.g., favoring a specific technique due to training), increasing size amplifies the bias rather than canceling noise.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Recommendation:** Reject the expansion to 15. Maintain 9 (or potentially reduce/structure differently, but the prompt implies sticking closer to current or finding a middle ground with safeguards). Let's recommend keeping 9 but adding safeguards to address independence/competence. Actually, the prompt asks for a "concrete rule." Keeping 9 with safeguards is a rule.
      *   **Reasoning (The Core Argument):**
          *   Acknowledge the CJT logic (it's mathematically sound *in theory*).
          *   Dismantle the assumptions based on the specific context.
          *   *Independence:* Explain how shared background creates correlation. If errors are correlated, adding people doesn't average out error; it replicates it.
          *   *Competence:* If $p$ is barely above 0.5, you need huge $N$. If $p$ is below 0.5 (due to bias), larger $N$ guarantees wrong answers.
          *   *The 5-4 Split:* Indicates low competence or high polarization, not a clear signal.
          *   *Systematic Bias vs. Noise:* This is a crucial distinction requested.
              *   *Noise:* Random errors. CJT works here if independent.
              *   *Bias:* Systematic error. CJT fails here. Larger groups cement the bias.
      *   **The Concrete Rule:**
          *   Size: 9 (status quo) or perhaps an odd number to avoid ties, but 9 is established. Let's stick with 9 to avoid logistical bloat without gain.
          *   Threshold: Simple majority is risky if competence is low. Maybe supermajority? Or keep majority but add safeguards. Let's recommend Simple Majority *plus* Safeguards.
          *   Safeguards: External review, anonymous voting (to stop seniority deference), diverse recruitment (to break correlation).
      *   **Strongest Case for Colleague:** Acknowledge that if independence *were* true, 15 is better. It reduces random noise.
      *   **Evidence to Change Mind:** Data showing independence (e.g., low correlation in voting records), data showing high individual competence (low reversal rate), or evidence that the 5-4 split was actually the correct call despite audit.

  5.  **Refining the Tone:**
      *   Professional, authoritative, analytical.
      *   Respectful of the colleague's mathematical intuition but firm on the empirical reality.
      *   Clear distinction between mathematical theory and organizational behavior.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Say no to 15. Stay at 9.
      *   Why? CJT needs independence. We don't have it. We have herd behavior.
      *   If we are biased, bigger group = more confident wrongness.
      *   Rule: 9 members, majority vote, but anonymous ballots and required external dissent check.
      *   Colleague is right if people are independent coin-flippers weighted to heads. They aren't.
      *   Show me voting records that prove independence, and I'll change my mind.

  7.  **Drafting - Iteration 2 (Fleshing out the arguments):**
      *   *Opening:* Decision is to retain 9 members.
      *   *CJT Analysis:* It relies on $p > 0.5$ and Independence.
      *   *Our Reality:* We have correlation (seniority). We have potential $p < 0.5$ (reversals).
      *   *Noise vs. Bias:* Noise averages out. Bias compounds. Our problem looks like bias/shared blind spots.
      *   *Safeguards:* Anonymous voting breaks seniority. External audit addresses competence.
      *   *Change Condition:* Statistical proof of independence.

  8.  **Final Polish (checking constraints):**
      *   Did I open with the recommendation? Yes.
      *   Did I address Noise vs. Bias separately? Yes.
      *   Did I avoid citations? Yes.
      *   Is the concrete rule clear? Yes.
      *   Is the tone appropriate for a Council Chair? Yes.

  9.  **Self-Correction during drafting:** I need to make sure I don't just say "independence is violated." I need to explain *why* that breaks the theorem mathematically (correlated errors don't cancel). I also need to make sure the "Evidence to Change" is specific and measurable.

      *Refining the Rule:* Just keeping 9 might seem like status quo bias. I should add the procedural safeguards as part of the "rule" for the panels to make it an active decision, not just a rejection.
      *Refining the Threshold:* The prompt says "simple majority" for the proposal. I should probably keep simple majority but emphasize the safeguards, or argue for a supermajority if competence is doubtful. However, supermajority can lead to gridlock. Let's stick to majority but emphasize that without independence, majority is fragile. Actually, a supermajority requirement forces more consensus, which might mitigate the "5-4 instability." Let's recommend a Supermajority (e.g., 6 of 9) to ensure higher confidence, given the competence concerns. *Wait, re-reading prompt:* "Recommend a concrete rule — panel size, voting threshold, and any procedural safeguards." Okay, I have discretion. Given the 5-4 instability and reversals, a simple majority is clearly failing. I will recommend a supermajority threshold to compensate for the lack of independence/competence certainty.

      *Wait, one more check:* The prompt asks to defend the recommendation. If I recommend supermajority, I need to explain why. It raises the effective competence bar.
      *Actually, let's look at the "Noise vs Bias" instruction again.* If the error is systematic bias, a supermajority doesn't help if everyone shares the bias. Independence is the key. So the safeguards (anonymous voting, diverse recruitment) are more important than the threshold. I will recommend maintaining 9, Simple Majority, *but* with strict independence safeguards. Why? Because if I force supermajority without independence, I just get gridlock on biased decisions. The root cause is the correlation. I will focus the rule on breaking correlation.

      *Decision:* Retain 9. Simple Majority. *Mandatory* safeguards for independence (anonymous voting, diverse backgrounds).

      *Wait, looking at the "5-4 split... reversed on appeal"*: This suggests the majority was wrong. If $p < 0.5$, CJT says larger groups are worse. If we can't guarantee $p > 0.5$, we shouldn't expand.
      *Okay, final plan:*
      1. Recommendation: Reject 15. Keep 9.
      2. Rule: 9 members, Simple Majority, but with Anonymous Voting and Conflict/Independence Vetting.
      3. Argument: CJT assumptions (Independence, Competence) are violated.
      4. Noise vs. Bias: Noise reduces with N. Bias increases with N. We have Bias/Correlation.
      5. Change Condition: Proof of independence/competence.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Practice-Standards Council
  **FROM:** Chair, Practice-Standards Council
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Advisory Panel Composition and Voting Rules

  **RECOMMENDATION**

  The Council rejects the proposal to enlarge advisory panels from nine to fifteen members. We will maintain the current panel size of nine members. However, to ensure the validity of our standards, we are implementing a new procedural rule: all panel votes must be cast by anonymous ballot, and panel composition must explicitly maximize diversity of training programs and geographic regions to mitigate correlation. The voting threshold will remain a simple majority, provided the anonymity and diversity safeguards are met.

  **REASONING**

  The proposal to expand panel size relies on the Condorcet Jury Theorem. Mathematically, the theorem is sound: if every voter is more likely than not to be correct (competence) and votes without influence from others (independence), then adding more voters drives the probability of a correct majority decision toward certainty.

  However, the theorem is a model that depends entirely on its assumptions. In our specific context, those assumptions are violated. Expanding the panel without correcting for these violations would not increase reliability; it would likely decrease it.

  **1. The Independence Assumption and Correlated Error**
  The theorem assumes that errors are random and independent. If Panelist A makes a mistake, it does not make it more likely that Panelist B makes the same mistake. In this scenario, adding members averages out the noise.

  Our panels do not meet this condition. Our members train in similar programs, read the same journals, and operate within a known hierarchy where junior members defer to senior authorities. This creates correlated error. If the prevailing literature is flawed, or if the senior voice in the room is mistaken, the entire panel is likely to make the *same* mistake. When errors are correlated, adding more members does not cancel out noise; it replicates the bias. Increasing the panel to fifteen members under these conditions simply amplifies the signal of our shared blind spots with greater confidence.

  **2. Competence and the Direction of Bias**
  The theorem also assumes individual competence is greater than 50 percent. If the average panelist is more likely to be wrong than right, the theorem reverses: larger groups become *more* likely to reach the wrong decision.

  Our recent audit complicates the assumption of competence. The 5-4 split on the technique now in wide use, which was subsequently reversed on appeal, suggests two possibilities. First, our individual competence may be lower than we presume (near or below the 50 percent threshold on complex issues). Second, and more critically, it suggests systematic bias rather than random noise.

  **3. Distinguishing Noise from Systematic Bias**
  We must treat the case of noisy panels separately from the case of biased panels.

  *   **If panels are merely noisy:** Errors are random. In this case, the colleague's proposal is theoretically correct. A fifteen-member panel would smooth out individual fluctuations better than a nine-member panel.
  *   **If panels are systematically biased:** Errors are directional (e.g., a cultural preference for invasive techniques, or deference to seniority). In this case, the Condorcet logic fails. A larger group does not average out a systematic bias; it cements it. A fifteen-member panel sharing the same bias will reach a wrong consensus faster and with more apparent legitimacy than a nine-member panel.

  Given the audit findings and the observed deference to seniority, we are currently operating in the systematic bias regime. Therefore, increasing $N$ (panel size) yields diminishing returns or negative value. The priority must be breaking the correlation, not adding volume.

  **THE STRONGEST CASE FOR EXPANSION**

  I acknowledge the strength of my colleague's mathematical intuition. If we could guarantee independence, fifteen members would be superior. In a world where our panelists were truly independent thinkers—perhaps drawn from disparate medical cultures, unrelated specialties, or blinded to one another's identities—the law of large numbers would protect us. The marginal gain in reliability from nine to fifteen independent voters is significant, reducing the risk of a "fluke" majority. If our primary problem were individual fatigue or random lapses in judgment, size would be the correct solution.

  **EVIDENCE REQUIRED TO CHANGE THIS RECOMMENDATION**

  I am prepared to revisit the panel size if we can empirically demonstrate that the assumptions of the theorem hold. Specifically, I would support expansion to fifteen members if presented with:

  1.  **Statistical Proof of Independence:** An analysis of historical voting records showing low correlation between panelists. If senior members do not predictably vote with junior members, and if members from the same training programs do not cluster in their decisions, the independence assumption is satisfied.
  2.  **Competence Validation:** Data showing that panel decisions are reversed on appeal at a rate significantly lower than chance, confirming that average individual competence is securely above the 50 percent threshold.
  3.  **Blind Voting Trials:** A pilot program where fifteen members vote anonymously on past cases. If the blind, larger group consistently outperforms the smaller, open group in matching gold-standard outcomes, the theoretical benefit is proven in practice.

  Until such evidence exists, we must prioritize the quality of independence over the quantity of voters. We will retain nine-member panels but enforce anonymity and diversity to approximate the independence the theorem requires.
