  3.  Empirical vs. Stipulative: The conflation of psychology and sociology.
  4.  Direction of Explanation: Teleology and the "Foil" problem.
  5.  Evidence: The archive bias.
  6.  Verdict: Conceptual Legislation with historical consequences.
  7.  Advice for the Journalist: How to frame this tension.

