answer: |-
  # The Country-Risk Decision Procedure (CRDP)
  **Version:** 1.0 (Operational)
  **Owner:** Country-Risk Desk
  **Cycle:** Biannual

  ## Part I: Definitions and Baselines

  You cannot measure decline without a floor. Do not use an ideal-type democracy; you will label everyone a backslider. Do not use the country's entire history; you will label long-standing autocracies as "stable."

  **The Baseline Rule: The T-10 Peak**
  Compare the country's current institutional performance to its **highest functioning point in the last 10 years.**
  *   **Why:** It captures the loss of recent democratic capital without penalizing countries that were never democratic to begin with.
  *   **The Cost:** It makes recovery invisible. If a country was a 10/10 in 2015, dropped to 4/10 in 2020, and is now 5/10, this baseline labels it "Backsliding" (from the peak) rather than "Recovering." You must accept this trade-off: this procedure is designed to protect assets from loss, not to credit governments for partial repairs.
  *   **Exception:** If the country has been below a functional democratic threshold for 15+ years, the baseline is "Regional Average." This prevents labeling a stable autocracy as "backsliding" simply because it isn't Sweden.

  **The Three Verdicts**
  1.  **Stable:** No net negative change in core veto points (Courts, Elections) relative to baseline. Negative changes in secondary dimensions (Media, Civil Society) are isolated and reversible.
  2.  **Eroding:** Measurable negative change in at least two dimensions, OR negative change in one core veto point that is currently being contested in court or street. The mechanism for removing the incumbent remains theoretically intact.
  3.  **Backsliding:** Systemic compromise of at least one core veto point (Courts OR Elections) such that the incumbent cannot be removed via established constitutional mechanisms, OR negative change across all five dimensions simultaneously.

  ## Part II: The Procedure (Step-by-Step)

  **Time Budget:** 2.5 Days per country.
  **Inputs:** V-Dem Indices, Freedom House, local partner memos, major international press (FT, Reuters, AP), constitutional text.

  ### Step 1: The Dimension Scan (Day 1)
  Score the following five dimensions against the T-10 Peak baseline. Use a traffic light system (Green = Baseline maintained; Yellow = Stress/Decline; Red = Functional Collapse).

  1.  **Electoral Integrity:** Are districts gerrymandered? Is voter access restricted? Is the count independent?
  2.  **Judicial Independence:** Can courts rule against the government? Are judges appointed via merit or loyalty?
  3.  **Media Pluralism:** Is state media partisan? Are private outlets owned by government proxies?
  4.  **Civil Society Space:** Are NGOs restricted by funding laws or "foreign agent" labels?
  5.  **Corruption/State Capture:** Is public procurement used to reward loyalty?

  **Stop Rule:** If 4+ dimensions are Green, verdict is **Stable**. Skip to Step 4 (Red Team).

  ### Step 2: The "Legal Shield" Test (Day 2 Morning)
  Incumbents will claim every action is legal. Ignore the claim. Ask three questions:
  1.  **Procedural Fairness:** Was the law rushed through without committee review or opposition input?
  2.  **Substantive Impact:** Does the law disproportionately affect opposition groups, even if textually neutral?
  3.  **Intent:** Is there a pattern? (e.g., A single media law is noise; three media laws targeting specific owners are a pattern).

  *   *If the answer to any is YES, the action counts as negative evidence regardless of constitutionality.*

  ### Step 3: Aggregation and Vector Analysis (Day 2 Afternoon)
  Combine the Dimension Scan with the Legal Shield Test.

  *   **Rule A (The Veto Point):** If **Electoral Integrity** OR **Judicial Independence** is Red, the default verdict is **Backsliding**.
      *   *Override:* Only if an independent court has struck down the change and the government complied.
  *   **Rule B (The Death by a Thousand Cuts):** If no Veto Point is Red, but 3+ dimensions are Yellow, the verdict is **Eroding**.
  *   **Rule C (The Noise Filter):** If only 1 dimension is Yellow, and the change is <5% deviation from baseline (e.g., minor NGO reporting tweak), verdict is **Stable**.

  **The "No Verdict" Condition:**
  If the data is contradictory (e.g., Elections are Green, but Courts are Red, but the President just lost an election), flag as **Conflicting Vector**. Do not assign a status. Proceed to Part IV.

  ### Step 4: The Red Team (Day 3 Morning)
  Before finalizing, write a 200-word memo titled **"The Defense."**
  *   **Task:** Argue the strongest case that your verdict is wrong, adopting the voice of the incumbent government's most competent lawyer.
  *   **Requirement:** You must cite at least one specific fact that contradicts your verdict.
  *   **Example:** If verdict is Backsliding, the Defense must argue why the recent election was genuinely competitive despite the gerrymandering.
  *   **Function:** If you cannot write this memo, your analysis is biased. Attach this memo to the final file.

  ### Step 5: Sign-Off and Separation of Powers (Day 3 Afternoon)
  *   **Diagnosis (You):** You sign the Status Verdict. You *cannot* recommend funding levels.
  *   **Response (Program Officers):** They receive the Verdict + Red Team memo. They design the funding strategy.
  *   **Ratification (Risk Panel):** A panel of three (one board member, one external legal expert, one senior program officer *not* managing the region) reviews any **Backsliding** or **No Verdict** cases.
      *   *Why:* This insulates you from pressure to soften a verdict to save a grant, and insulates program officers from blame for a political verdict.

  ---

  ## Part III: Case Studies (Live Run)

  ### 1. Hungary
  *   **Baseline:** T-10 Peak (2010-2014 transition period).
  *   **Scan:** Elections (Red - gerrymandering/media dominance), Courts (Red - packed constitutional court), Media (Red), Civil Society (Yellow), Corruption (Red).
  *   **Legal Shield:** Fidesz laws passed via 2/3 majority but rushed; substantive impact cripples opposition.
  *   **Aggregation:** Two Veto Points (Elections, Courts) are Red.
  *   **Verdict:** **Backsliding.**
  *   **Red Team (The Defense):** "The government was elected with a supermajority under rules that existed prior to their rule. Opposition parties are fragmented and failed to campaign effectively. The courts still hear cases against the state."
  *   **Outcome:** Funding trigger: High risk. Requires local partners to have extreme operational security.

  ### 2. Poland
  *   **Baseline:** T-10 Peak (Pre-2015).
  *   **Scan:** Elections (Green - 2023 transfer of power occurred), Courts (Yellow/Red - PiS reforms remain, though new gov is repairing), Media (Yellow - public media purged but private sector okay), Civil Society (Green), Corruption (Yellow).
  *   **Conflict:** The Executive intent is now pro-democracy, but the Institutional damage (Courts) remains from the previous administration. The Vector is positive, but the Status is damaged.
  *   **Aggregation:** Veto Point (Courts) is compromised, but Veto Point (Elections) proved functional.
  *   **Verdict:** **No Verdict (Conflicting Vector).**
  *   **Reasoning:** The procedure cannot distinguish between "institutional lag" and "active backsliding" when the political will has reversed but the laws haven't caught up.
  *   **Red Team (The Defense):** "Calling this 'uncertain' punts the risk. The courts are still staffed by appointees hostile to the new government. The backsliding infrastructure remains intact."
  *   **Outcome:** See Part IV (Handling No Verdict).

  ### 3. Turkey
  *   **Baseline:** T-10 Peak (2013, pre-Gezi/corruption scandals).
  *   **Scan:** Elections (Yellow - competitive but unequal), Courts (Red - post-coup purges), Media (Red), Civil Society (Red), Corruption (Red).
  *   **Aggregation:** Veto Point (Courts) is Red. However, using the T-10 baseline, the country has been below democratic threshold for >10 years.
  *   **Adjustment:** Switch baseline to "Regional Average." Compared to regional peers, is Turkey declining *now*?
  *   **Analysis:** No. The system is consolidated. It is not *backsliding*; it has *arrived*.
  *   **Verdict:** **Stable (Authoritarian).**
  *   **Note:** This is not a "Stable Democracy." It is a stable risk environment.
  *   **Red Team (The Defense):** "Labeling an autocracy 'Stable' legitimizes it. The economic crisis suggests fragility. Regime survival is not rule-of-law stability."
  *   **Outcome:** Funding trigger: Review mandate. Does the foundation fund rule-of-law in non-democracies? If yes, Stable. If no, Exit.

  ### 4. United States
  *   **Baseline:** T-10 Peak (2014-2016).
  *   **Scan:** Elections (Yellow - 2020 certification challenges, gerrymandering), Courts (Yellow - polarization, but rulings hold), Media (Red - ecosystem fragmentation), Civil Society (Green), Corruption (Yellow - norm erosion).
  *   **Legal Shield:** Many election restriction laws passed on partisan lines with substantive impact on access.
  *   **Aggregation:** No Veto Point is fully Red (Power transferred in 2020 and 2024). But 3 dimensions are Yellow/Red.
  *   **Verdict:** **Eroding.**
  *   **Red Team (The Defense):** "American institutions proved resilient in 2020 and 2024. Courts blocked unconstitutional overreach. Polarization is social, not institutional. Labeling the US 'Eroding' conflates noise with structural failure."
  *   **Outcome:** **Disliked Verdict.** Program officers will resist this. It jeopardizes domestic partnerships and invites accusations of bias. The Risk Panel must ratify this to protect the Analyst.

  ---

  ## Part IV: Handling the "No Verdict" (Poland Scenario)

  You have a funding deadline. You cannot wait for clarity.

  **The Precautionary Default:**
  When the procedure returns **No Verdict**, the status defaults to **Eroding** for funding purposes only.
  *   **Rationale:** In ambiguity, assume risk. It is easier to scale up funding later if stability returns than to explain why you funded a backslider.
  *   **Funding Mechanism:** Issue **Short-Cycle Grants** (6 months instead of 24 months). Include a "Snap-Back" clause: if the Risk Panel upgrades the status to Stable in 6 months, funding converts to multi-year. If downgraded to Backsliding, funding converts to emergency protection only.
  *   **Communication:** In public materials, do not publish "Eroding." Publish "Under Review." This protects the partner's reputation while protecting your capital.

  ---

  ## Part V: Meta-Analysis & Limitations

  ### 1. Judgment Calls Dressed as Arithmetic
  Do not fool yourself. The following are political choices hidden in the procedure:
  *   **The T-10 Baseline:** Choosing 10 years rather than 20 is a choice to ignore long-term structural sin. It favors newer democracies.
  *   **Veto Point Weighting:** Deciding that Courts matter more than Media for "Backsliding" is a value judgment. A foundation focused on independent media might weight Media higher.
  *   **The "Legal Shield" Test:** Determining "Intent" requires interpreting motive. This is inherently subjective.

  ### 2. What This Procedure Cannot Do
  *   **Predict Revolutions:** It measures institutional decay, not social explosion. A "Stable" country can still explode (e.g., Sudan pre-2019).
  *   **Measure Corruption of Truth:** It can measure media ownership, but not the epistemic collapse of a society (e.g., QAnon in the US).
  *   **Absolve the Board:** The Risk Panel ratifies the verdict, but the Board owns the consequence. If they fund a "Backsliding" country, they own the reputational risk.

  ### 3. The "Partisan Label" Objection
  *Critique:* "Backsliding is a partisan label with a measurement apparatus attached."
  *Response:* The objection is correct. "Backsliding" implies a fall from grace, which presupposes the grace was legitimate.
  *   **Does this procedure fix it?** No. It **relocates** the politics.
  *   **How:** Instead of hiding the politics in the analyst's intuition, it forces the politics into the **Baseline Selection** and the **Risk Panel Ratification**.
  *   **Defense:** When challenged, you do not defend the verdict as "objective truth." You defend the **process**. "We applied the T-10 Baseline and Veto Point Rule consistently across 40 countries. You may disagree with the baseline, but you cannot accuse us of targeting your country specifically."
  *   **Value:** The procedure converts a political attack into a procedural audit. It is easier to defend a spreadsheet than an opinion.

  ### 4. Final Instruction to the Analyst
  When you present the verdicts:
  1.  Present the **Status** (Stable/Eroding/Backsliding).
  2.  Present the **Red Team Memo** immediately after.
  3.  Present the **Funding Implication** last (handled by Program Officers).

  If you skip step 2, you are an activist. If you skip step 3, you are an academic. If you do all three, you are a Risk Desk.
