answer: |-
  Your biggest vulnerability is that dropping consent looks like inviting coercion, but your best defense is that Bentham replaces rights-based consent with pain-based "alarm," securing protection without metaphysical baggage.

  ### Concede Up Front
  *   **The Bestiality Blind Spot:** Explicitly state that Bentham's treatment of animal cruelty is undertheorized and that your reconstruction inherits this limitation; do not try to defend it as coherent.
  *   **Manuscript Fragmentation:** Acknowledge that the sexual ethics material is not a single finished treatise but a mix of fragments and fair copies spanning decades; do not claim a systematic unity that isn't there.
  *   **Modern Normativity:** Clarify that you are not arguing Bentham's conclusions are *correct* by modern standards, only that his *mechanism* (anti-asceticism vs. harm principle) is misidentified.

  ### Load-Bearing vs. Giveaway Framing
  *   **Load-Bearing:** The distinction between "asceticism" (pain as good) and "utility" (pleasure as good) as the primary legislative test; the claim that "unnaturalness" collapses into disgust or theology.
  *   **Giveaway:** The specific chronology of the manuscripts (unless it contradicts your evolution argument); the claim that Bentham is a "liberal" in the modern sense (call him a "utilitarian reformer" instead); the precise dating of the *Not Paul, but Jesus* fragments.

  ### Scholarly Ground: Settled vs. Contested
  *   **Settled:** Bentham wrote extensively on sexual offenses in the 1780s–1820s; he opposed punishing consensual adult sex; these texts were unpublished in his lifetime; he grounds legislation in pleasure/pain.
  *   **Contested:** Whether these texts constitute a coherent "theory of liberty" or scattered notes; whether Bentham's utility principle *necessarily* protects sexual liberty or only contingently; the degree of continuity between the sexual ethics MSS and the published *Principles of Morals and Legislation*; whether the "Harm Principle" label is anachronistic or accurate.

  ---

  ### Q&A Prep Sheet (Ordered by Damage to Argument)

  #### 1. The Historian of Sexuality (The Whiggishness Objection)
  **Objection:** "You're reconstructing Bentham as a proto-liberal who stumbled onto our modern consensus. Isn't this just Whiggish recuperation? You're stripping the 18th-century theological context to make him look like a contemporary gay-rights advocate, ignoring that his 'utility' was just another metaphysical commitment."
  **Reply:** "I'm not arguing Bentham is a modern liberal, but that his *mechanism* differs from the Millian reading. The standard view says he protects sex because it doesn't harm others (a rights-adjacent claim). I'm showing he protects it because punishing it relies on the 'principle of asceticism'—preferring pain to pleasure—which he rejects as irrational. That's not Whiggish; it's textual. He's not protecting 'rights,' he's protecting 'pleasure' from 'prejudice.' The difference matters because it shows his radicalism is deeper, not narrower, than ours."
  **Soft Spot:** You rely on the assumption that Bentham's rejection of asceticism is consistent across the manuscripts, but the Historian can point to moments where Bentham defers to public sentiment (public indecency) as a pragmatic concession, which looks suspiciously like the Whiggish 'progress narrative' you deny.
  **Scholarly Note:** *Contested.* Whether Bentham's utilitarianism is inherently liberatory or merely contingent on empirical claims about pain is a live debate (Schofield vs. Rosen).

  #### 2. The Bentham Project People (The Textual Continuity Objection)
  **Objection:** "You're treating 'Offences Against One's Self' and the *Not Paul* fragments as a unified corpus. Chronologically, these span forty years. Doesn't your argument collapse if the 1780s drafts rely on different psychological premises than the 1820s notes? You're smoothing over gaps to make the 'Anti-Asceticism' thesis hold."
  **Reply:** "I'm not claiming perfect unity, but a consistent trajectory. The core attack on asceticism appears in the 1780s drafts and remains stable in the later theological critiques. Even if the psychological vocabulary shifts, the legislative test—does this law create more pain than the act itself?—remains constant. The chronology matters for development, but not for the core logical move against punishment."
  **Soft Spot:** If they produce a specific manuscript date where Bentham explicitly endorses punishment for a sexual act on non-utility grounds (e.g., public order), your 'consistent trajectory' claim weakens.
  **Scholarly Note:** *Contested.* The editing of the sexual ethics MSS is ongoing; consensus on the precise dating of fragments is not settled.

  #### 3. The Criminal-Law Theorist (The Explanatory Value Objection)
  **Objection:** "Okay, suppose you're right that it's not the Harm Principle. What work does this do? If the outcome is decriminalization either way, why does it matter if the ground is 'anti-asceticism' rather than 'no harm'? The Millian reading is simpler and gets us to the same place."
  **Reply:** "It matters because the Millian reading fails when consent is present but harm is alleged (e.g., risky sex, certain kinks). Mill needs to prove 'no harm.' Bentham doesn't; he shifts the burden to the prosecutor to prove the pain of punishment outweighs the pleasure of the act. It's more robust because it doesn't require a metaphysical account of harm, only a hedonic calculation. It explains why Bentham defends acts Mill might not."
  **Soft Spot:** You admit Bentham's view is 'more radical' and could license things we criminalize. If you can't specify *which* things without sounding monstrous, the theorist will dismiss the 'added value' as a bug, not a feature.
  **Scholarly Note:** *Settled* that Bentham opposes punishment here; *Contested* whether this is best described as a 'Harm Principle' precursor.

  #### 4. The Animal Ethics Grad Student (The Bestiality Objection)
  **Objection:** "You admit Bentham is shaky on bestiality. But if his theory is about real pleasures vs. manufactured harms, doesn't the animal's pain count? He dismisses it in two sentences. Doesn't this show his 'anti-asceticism' is actually just 'anti-human-disgust,' and your reconstruction inherits that blindness?"
  **Reply:** "Yes, and that's the cost of the reading. Bentham includes animals in the moral community elsewhere, but here he assumes the animal's pain is negligible or the act is non-coercive. My argument isn't that Bentham is morally perfect, but that his *logic* is consistent: he looks for pain. He fails here empirically. But that failure confirms my thesis—he's not appealing to 'natural law' violations, he's making a bad utility calculation. That's different than appealing to sin."
  **Soft Spot:** You have no defense for the calculation itself. If the grad student presses that Bentham *ignores* the pain rather than calculating it, your claim that he 'dissolves' objections via utility looks like special pleading.
  **Scholarly Note:** *Settled* that Bentham includes animals in utility calculations generally; *Contested* why he minimizes it in this specific context.

  #### 5. The Kantian (The Foundational Objection)
  **Objection:** "You've begged the question. You treat persons as loci of pleasure and pain. If dignity matters, not just sensation, your whole 'manufactured harm' argument collapses. Why should we accept your premise?"
  **Reply:** "I'm not asking you to accept utilitarianism as true, only as Bentham's premise. My thesis is interpretive: given that Bentham *does* treat persons this way, how does he argue against punishment? The Kantian objection is valid normatively, but it doesn't refute the historical claim about what Bentham is doing."
  **Soft Spot:** If the Kantian argues that Bentham's *own* theory requires respecting agency (not just sensation) to be coherent, you're forced into a philosophical defense you wanted to avoid.
  **Scholarly Note:** *Settled* that Bentham rejects natural rights; *Contested* whether utility can account for agency without smuggling in rights-talk.

  ---

  ### The Question You Hope Nobody Asks
  **Question:** "If Bentham's theory doesn't rely on consent, but on net pleasure, does it permit punishing consensual sex if the public disgust (pain) is high enough? You mentioned public indecency—where is the line?"
  **Why it hurts:** It exposes that your 'radical' reading might actually be *less* protective of liberty than the Harm Principle reading. If public disgust counts as pain, Bentham could justify banning gay sex in public (or private, if leakage is assumed).
  **Prepared Reply:** "Yes, in principle. Bentham is not a libertarian. He allows punishment if the 'alarm' or secondary mischief outweighs the pleasure. My point is that he thinks this calculation *usually* favors liberty because the pain of punishment is so high. But you're right—he doesn't guarantee liberty as a right. That's exactly why his view is distinct from Mill's."
  **Concession:** Be prepared to admit this makes Bentham less attractive to modern liberals, but insist it makes the historical reading more accurate.
