prompt: |-
  Two weeks ago a friend of mine — a union organizer, the kind of person who has actually had to move votes for a living — and I spent most of a long evening arguing about Simone Weil's note on the general suppression of political parties, the one she wrote near the end of her life and that was published only after her death, and we ended in the sort of disagreement that keeps generating new questions days afterward. The version of Weil I put to him was the one I had always found compelling: that a political party is a machine for manufacturing collective passion; that it is an organization built specifically so as to bring collective pressure to bear on the thinking of each of its members; and that its first aim, and in the end its only aim, is its own unlimited growth. From those three claims she drew a conclusion much stronger than the usual complaint that parties sometimes go wrong — that belonging to a party always constrains one to untruth, and that the existence of parties is therefore an unconditional evil, not a cost to be weighed against the goods parties deliver but a structural incompatibility between the party form and truth and justice. And her alternative was not coalitions, or factions, or better internal democracy; it was the revue, a group gathered around writing and reading that one is near rather than a member of, and on whose behalf no one stands for office. My friend, who has spent fifteen years in a union he loves and that has plainly been worth what it cost him, said three things I could not answer. First, that parties are the only machinery anyone without money has ever used to make power answer, and that abolishing them is a counsel of despair which leaves the field to those who never agreed to be bound by the rule. Second, that the revue is a party with a masthead — editors, a canon, an orthodoxy of taste, a small group of people who decide what is serious. Third, and worst, that Weil's definition is not diagnostic at all: every group that has to act together, from a congregation to a research lab to a family to his own union local, exerts pressure on the thought of its members, and a criterion that condemns everything tells you nothing about when the thing you are already inside has turned. We ended up agreeing, roughly, that the interesting question is not whether parties should exist but whether there is a way to tell, from inside a group that is doing necessary work and mostly doing it decently, that the machine has started running. That is the question I want you to answer, and I want the answer as a procedure rather than an essay.

  I have a reason to want it, and a deadline. I chair the internal standards committee of a state-level political party — about four thousand members, four of them in the legislature — that began six years ago as a single-issue campaign and is still, in most of the ways that matter, that campaign with a mailing list attached. The committee is three volunteers, none of us lawyers; we meet monthly for two hours and usually have two or three disputes referred to us, and our recommendations go to the steering committee for ratification, with expulsion ultimately requiring two thirds of the convention. In ten weeks we hold our first convention and adopt bylaws, including — because two of our legislators keep breaking with the platform on the issue that founded us, and because four hundred members have signed a petition to expel someone over a remark he made on a podcast — a discipline and expulsion clause and a rule about endorsing candidates. I have no interest in the legislative half of Weil's title; the first readers of that note took it to mean driving parties out by persuasion rather than banning them by law, and either way it is not available to me. I want the diagnostic half. Write me a decision procedure my committee can run on a case in ninety minutes, that a member who has never read a word of Weil can be walked through, and that will survive being argued about by people who will assume any rule we write is aimed at them. I want the questions in order, what counts as a sufficient answer to each, which questions stop the process with a no and which merely slow it down, and — the part I care about most — the points at which the procedure hands the decision back to a person because the question is one of values rather than of fact, with a note on which of the earlier steps are judgment calls dressed up as procedure. It should be mechanistic rather than moralistic: it should name what has actually happened in the organization, in terms someone could dispute with evidence, rather than asking us to assess how the group feels about itself. Where Weil's positive alternative can be turned into something usable inside a party that intends to contest elections — what it would mean to stand near a position rather than be bound to it, what a loyalty test looks like when it is wearing the costume of a request for message discipline — build that in; where it cannot, say so plainly rather than inventing a step to fill the gap.

  Then run it on three cases in order, showing the procedure working rather than just announcing a verdict. First, the draft unity rule: members of our legislative caucus would be required to vote with the platform on a list of core votes drawn up by the steering committee or lose party funding and staff support; the two legislators who break with us say the list is drawn to catch their dissent and not the leadership's past deviations, and I suspect they are right. Second, the expulsion petition: a member said something about the founding issue that some members read as a slur and others read as clumsiness, there is no rule that covers it, and the petitioners argue that the petition itself is evidence of what the membership considers beyond the pale. Third, the endorsement: the only candidate who can win a district we need is quietly on the other side of the founding issue, and the alternative agrees with us and loses by thirty points. I expect the procedure to give me an answer I will not like in at least one of these, and I would rather have it now than at the convention; when it does, tell me what the answer costs, because I will have to argue it in front of people who will hear it as a betrayal. There is one more thing I want the procedure turned on, and I want you to be unsentimental about it: our founding pledge, which members have signed for six years, promising never to support any candidate who voted for the bill that started us. I have defended that pledge in every argument I have ever had, including this one. If the procedure says it was the first loyalty test we ever ran, say so, and tell me what follows. Finally, tell me what the procedure cannot do — whether a diagnostic built out of Weil's critique can ever prescribe anything positive or can only tell you that you are ill, whether the revue is a real alternative or a beautiful thing that has never held a ward, and what a procedure of this kind is blind to that my union organizer friend would see immediately. Do not send me a bibliography; I will not read Weil and neither will the other two members of the committee. Write the one-page version they can use, and keep the reasoning for me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** The user chairs an internal standards committee of a state-level political party (4,000 members, 4 legislators). The party started as a single-issue campaign 6 years ago.
      *   **Problem:** They need to adopt bylaws regarding discipline, expulsion, and endorsements in 10 weeks. There is tension between maintaining ideological purity (the founding issue) and political effectiveness/unity.
      *   **Philosophical Framework:** Simone Weil's critique of political parties (parties manufacture collective passion, pressure thought, aim for growth; belonging constrains truth). The user's friend (union organizer) countered that parties are necessary for power, *revues* (Weil's alternative) are just cliques, and *all* groups exert pressure.
      *   **Task:** Create a *decision procedure* (not an essay) based on this debate. It must be:
          *   Runnable in 90 minutes.
          *   Understandable by non-Weil readers.
          *   Mechanistic/evidentiary, not moralistic.
          *   Explicit about where value judgments replace facts.
          *   Explicit about where Weil's alternative fails inside an electoral party.
          *   Tested on four specific cases (Unity Rule, Expulsion Petition, Endorsement Dilemma, Founding Pledge).
          *   Include a "One-Page Version" for the committee and a "Reasoning" section for the user.
          *   Address limitations (what the procedure *can't* do).
      *   **Tone:** Serious, pragmatic, unsentimental, intellectually rigorous but actionable.

  2.  **Deconstruct Weil vs. The Union Organizer:**

      *   *Weil:* Parties = Truth-suppressing machines. Goal = Growth/Power. Mechanism = Collective pressure on individual thought. Alternative = *Revue* (loose association around truth-seeking, no office-seeking).
      *   *Organizer:* Parties = Necessary tools for non-wealthy to wield power. All groups exert pressure. The danger isn't the *existence* of pressure, but *unchecked* pressure.
      *   *Synthesis for Procedure:* We can't abolish the party (Weil) because we need to win elections (Organizer). But we can use Weil's diagnostics to detect when the "machine" is consuming truth/justice vs. when it is exercising necessary discipline for power.
      *   *Key Diagnostic:* Is the pressure being applied to align *action* (voting/campaigning) or *thought* (belief/loyalty)? Is the goal specific power acquisition or unlimited growth/self-perpetuation?

  3.  **Drafting the Decision Procedure (The "Mechanism"):**

      *   Needs to be a flowchart or step-by-step checklist.
      *   Needs "Stop" conditions (No) and "Slow" conditions (Caution).
      *   Needs "Value Judgment" flags.
      *   *Step 1: Specificity of Act.* Is this about a specific vote/action or a general stance? (Weil: Pressure on thought is bad; pressure on action for power is necessary).
      *   *Step 2: Reciprocity.* Does the rule apply to leadership equally? (Organizer: Power must answer).
      *   *Step 3: Reversibility/Exit.* Can someone dissent without losing their soul/membership entirely? (Weil: Truth requires freedom).
      *   *Step 4: Instrumentality.* Is this measure designed to win a specific election or to purge impurity? (Weil: Growth vs. Truth).
      *   *Step 5: The "Revue" Check.* Is there space for private dissent while maintaining public discipline?

  4.  **Testing the Procedure on the Cases:**

      *   *Case 1: Draft Unity Rule (Legislators).*
          *   Act: Voting.
          *   Reciprocity: Leadership deviations excluded? (User suspects yes). -> *Fail.*
          *   Cost: Admitting the rule is weaponized.
      *   *Case 2: Expulsion Petition (Podcast Remark).*
          *   Act: Speech vs. Slur.
          *   Specificity: Is there a prior rule? No.
          *   Instrumentality: Is expulsion necessary for power or just purity?
          *   Cost: Alienating the base or keeping a toxic member.
      *   *Case 3: Endorsement (Winable vs. Pure).*
          *   Instrumentality: Win power or hold line?
          *   Weil/Organizer clash: Weil says don't seek power if it compromises truth. Organizer says you need power to do anything.
          *   Cost: Admitting the party is choosing power over principle (or vice versa).
      *   *Case 4: Founding Pledge.*
          *   This is the trap. It's a permanent loyalty test.
          *   Procedure verdict: It is a machine for manufacturing passion.
          *   Cost: The party's origin story is its current shackle.

  5.  **Refining the Output Structure:**

      *   **Part 1: The One-Page Procedure.** (For the committee). Clear, bold, actionable.
      *   **Part 2: Case Applications.** (Showing the work).
      *   **Part 3: The Cost & Limitations.** (For the user). Addressing the "what follows" and "what this can't do."

  6.  **Drafting Content - Iteration & Polish:**

      *   *Constraint Check:* The user wants "mechanistic rather than moralistic." Avoid words like "good," "bad," "evil." Use "verifiable," "specific," "reciprocal."
      *   *Constraint Check:* "Points at which the procedure hands the decision back to a person." I need to explicitly label these "VALUE JUDGMENT REQUIRED."
      *   *Constraint Check:* "Where Weil's positive alternative... build that in; where it cannot, say so plainly." I need to acknowledge that a *revue* doesn't win elections. The party *must* bind action, but not thought.
      *   *Constraint Check:* "Unsentimental about [the Founding Pledge]." If the procedure flags it as a loyalty test, I must say so.

      *(Self-Correction during drafting)*: Initially, I might make the procedure too abstract. I need to make it sound like a committee checklist. "Question 1: Can the member point to the specific text..."
      *(Refining the Union Organizer's point)*: The organizer said "every group exerts pressure." The procedure shouldn't try to eliminate pressure, but identify *illegitimate* pressure. Illegitimate = pressure on internal belief rather than external action, or pressure applied asymmetrically.

      *(Refining the Weil point)*: Weil says parties aim for unlimited growth. The procedure should check if a measure serves a specific electoral goal or just "party strength."

      *(The Founding Pledge)*: This is the hardest part. The user has defended it for 6 years. If the procedure condemns it, I have to be firm. It fits Weil's definition of a "machine for manufacturing collective passion." I need to explain the cost: The party cannot grow beyond its origin without breaking its spine.

  7.  **Final Review against Prompt:**

      *   90-minute procedure? Yes.
      *   Order of questions? Yes.
      *   Stop/Slow conditions? Yes.
      *   Value judgment flags? Yes.
      *   Mechanistic language? Yes.
      *   Four cases run? Yes.
      *   Limitations section? Yes.
      *   One-page version + Reasoning? Yes.

  8.  **Final Polish:** Ensure the tone matches the user's intellectual level (high, referencing Weil/union politics) without being pretentious. Keep it sharp. (Proceed to generate output).

      *Note on the "One-Page Version":* It needs to be distinct from the reasoning. I will structure the response with the Reasoning first (for the user) to set the stage, then the One-Page Procedure (for the committee), then the Case Runs. Wait, the prompt asks: "Write the one-page version they can use, and keep the reasoning for me." Okay, I will structure it so the *Procedure* is the tool, and the *Commentary* surrounds it. Actually, looking at the instruction "Write the one-page version they can use, and keep the reasoning for me," implies the output should prioritize the tool but include the analysis requested ("Then run it on three cases... Finally, tell me what the procedure cannot do"). I will organize it: 1. The Procedure (The Tool), 2. The Case Runs (The Test), 3. The Limitations & The Pledge (The Cost/Reasoning). This flows logically.

      *Wait, re-reading:* "Write the one-page version they can use, and keep the reasoning for me." This suggests the *Procedure* itself should be clean, and the *analysis* (Weil vs Organizer, the costs, the limitations) is for the Chair. I will separate these clearly.

      *Let's build the Procedure Steps:*
      1.  **Action vs. Belief:** Is the sanction for a verifiable act or an inferred belief?
      2.  **Reciprocity:** Does the rule bind the leadership/steering committee identically?
      3.  **Instrumentality:** Is the sanction tied to a specific, time-bound electoral objective?
      4.  **Dissent Channel:** Is there a protected mechanism for private objection before public discipline?
