answer: |-
  ### PART I: THE ONE-PAGE PROCEDURE
  **For use by the Internal Standards Committee**
  **Time Limit: 90 Minutes**

  **INSTRUCTION:** For any proposed rule, sanction, or expulsion, answer the following five questions in order. If any question results in a **STOP**, the measure fails. If a question is marked **VALUE JUDGMENT**, the Committee must vote; a tie defeats the measure. Evidence must be documentary (minutes, transcripts, voting records), not testimonial.

  **1. THE ACT/BELIEF DISTINCTION**
  *Question:* Does the sanction punish a specific, verifiable action (e.g., a roll-call vote, a financial transaction, a public endorsement) or does it punish an inferred state of mind, loyalty, or identity (e.g., "betrayal," "impurity," "tone")?
  *   **PASS:** Specific action cited.
  *   **SLOW:** Action is clear, but intent is debated. (Proceed to Q2).
  *   **STOP:** Sanction relies on inferred loyalty or belief.
  *   *Note:* Parties may bind action for power. They may not bind thought.

  **2. THE RECIPROCITY CHECK**
  *Question:* Does this rule apply with identical force to the Steering Committee, Caucus Leadership, and major donors as it does to the member in question?
  *   **PASS:** Yes, leadership is equally subject to sanction for identical breaches.
  *   **SLOW:** Leadership is subject, but enforcement mechanism differs. (Proceed to Q3).
  *   **STOP:** No, or leadership deviations are explicitly exempted.
  *   *Note:* Power must answer to the same rule as the membership.

  **3. THE INSTRUMENTALITY TEST**
  *Question:* Is the sanction tied to a specific, time-bound electoral objective (e.g., "winning the November general") or is it tied to the indefinite maintenance of group cohesion?
  *   **PASS:** Tied to specific election/campaign cycle.
  *   **VALUE JUDGMENT:** The link between the sanction and the electoral outcome is disputed. (Committee Vote required).
  *   **STOP:** Tied to "party strength," "unity," or "long-term brand" without specific electoral target.
  *   *Note:* Weil's critique: Parties seek unlimited growth. This limits sanctions to necessary power acquisition.

  **4. THE DISSENT CHANNEL**
  *Question:* Is there a documented mechanism for the member to register private objection *before* the public sanction is applied, without that objection itself becoming grounds for sanction?
  *   **PASS:** Yes, private objection is recorded and protected.
  *   **SLOW:** Mechanism exists but is cumbersome. (Proceed to Q5).
  *   **STOP:** No, or prior objection is treated as aggravating evidence.
  *   *Note:* This is the *Revue* element: standing near a position rather than being bound to it internally.

  **5. THE GROWTH/BOUNDARY CHECK**
  *Question:* Does enforcing this rule allow the party to engage with new voters/constituencies, or does it primarily police the existing membership?
  *   **PASS:** Enables engagement/expansion.
  *   **VALUE JUDGMENT:** Unclear if this expands reach or consolidates boundaries. (Committee Vote required).
  *   **STOP:** Primarily polices existing membership (purity test).
  *   *Note:* If the machine serves only itself, it is an unconditional evil.

  ***

  ### PART II: CASE RUNS
  **Applying the Procedure to Current Disputes**

  #### CASE 1: The Draft Unity Rule (Legislative Caucus)
  *Proposal:* Legislators must vote with the platform on core votes or lose funding/staff.
  *   **Q1 (Act/Belief):** **PASS.** Voting is a verifiable action.
  *   **Q2 (Reciprocity):** **STOP.** You noted the list is drawn to catch dissenters, not leadership deviations. If the Steering Committee is not subject to the same "core vote" list for their endorsements or public statements, the rule is asymmetric.
  *   **Verdict:** **REJECT.**
  *   **The Cost:** You must tell the Steering Committee they cannot weaponize discipline against the caucus unless they bind themselves to the same constraints. This weakens leadership's leverage. You will be accused of siding with the rebels.
  *   **Weil/Organizer Note:** The Organizer wins here: power must answer. Weil wins here: if the rule is asymmetric, it is manufacturing loyalty, not coordinating action.

  #### CASE 2: The Expulsion Petition (Podcast Remark)
  *Proposal:* Expel a member for a remark on a podcast regarding the founding issue.
  *   **Q1 (Act/Belief):** **SLOW.** The remark is an act (speech), but the petition argues it proves he is "beyond the pale" (belief/identity). You must isolate the speech act from the inferred disloyalty.
  *   **Q2 (Reciprocity):** **PASS.** Assuming no one on Steering has made similar remarks without sanction.
  *   **Q3 (Instrumentality):** **STOP.** There is no specific electoral objective gained by expulsion. The argument is "the petition itself is evidence," which is circular. Expulsion does not win a vote in November; it satisfies a demand for purity.
  *   **Verdict:** **REJECT.**
  *   **The Cost:** You keep a member who may be toxic to the brand. You tell the 400 petitioners that their emotional consensus is not a rule of order. They will hear this as elitism.
  *   **Weil/Organizer Note:** Weil warns against collective passion. The petition *is* the collective passion. The Organizer would say if the remark costs votes, cut him. If it doesn't, keep him. Do not expel for "feelings."

  #### CASE 3: The Endorsement Dilemma (Winable vs. Pure)
  *Proposal:* Endorse the winable candidate who opposes the founding issue, or the pure candidate who will lose.
  *   **Q1 (Act/Belief):** **PASS.** Endorsement is an action.
  *   **Q2 (Reciprocity):** **PASS.** Applies to all candidates.
  *   **Q3 (Instrumentality):** **VALUE JUDGMENT.** Does winning the seat advance the founding issue more than losing nobly?
      *   *Argument A:* Power is required to change the bill (Organizer).
      *   *Argument B:* Supporting the bill's voter is a lie (Weil).
  *   **Q4 (Dissent Channel):** **PASS.** Members can dissent from the endorsement.
  *   **Q5 (Growth/Boundary):** **VALUE JUDGMENT.** Does winning expand the party or betray its boundary?
  *   **Verdict:** **PROCEDURE CANNOT DECIDE.** This is the hard limit. The procedure forces you to admit this is a value choice, not a technical one.
  *   **The Cost:** You must call a vote and admit the party is choosing between Power (Organizer) and Truth (Weil). There is no mechanistic cover. If you choose the winable candidate, you admit the founding issue is negotiable for power. If you choose the pure candidate, you admit you prefer purity to governance.
  *   **Weil/Organizer Note:** This is where the *Revue* fails. A *revue* does not endorse candidates. A party must. You cannot have the *Revue's* relationship to truth and the Party's relationship to power simultaneously.

  #### CASE 4: The Founding Pledge
  *Proposal:* The existing pledge signed by all members for six years (never support any candidate who voted for the Bill).
  *   **Q1 (Act/Belief):** **STOP.** "Support" is vague. Does it mean voting? Donating? Standing nearby? It punishes an inferred alignment.
  *   **Q2 (Reciprocity):** **STOP.** Did the Steering Committee sign this? Are they bound if they endorse someone who wavers?
  *   **Q3 (Instrumentality):** **STOP.** This is indefinite. It is not tied to an election cycle. It is a permanent condition of membership.
  *   **Verdict:** **THE PLEDGE IS A LOYALTY TEST.**
  *   **The Cost:** You must recommend the Pledge be retired or radically rewritten. You are telling the founders that the origin story is now a shackle. You are admitting the party has become the machine Weil described: an organization aiming at its own perpetuation rather than a specific political remedy.
  *   **Weil/Organizer Note:** Weil would say this is the definition of the evil. The Organizer would say this is the only thing holding the coalition together. The Procedure sides with Weil: this is pressure on thought/belief, not coordination of action.

  ***

  ### PART III: LIMITATIONS & REASONING
  **For the Chair Only**

  **1. What This Procedure Cannot Do**
  This diagnostic can tell you when the machine is running (when pressure shifts from action to belief, from specific goals to unlimited growth), but it cannot tell you how to win.
  *   **The Positive Gap:** Weil's *revue* is not a viable electoral vehicle. A *revue* seeks truth; a party seeks power. This procedure forces you to admit when you are sacrificing truth for power (Case 3), but it offers no solution. It creates a "moment of honesty," not a path to victory.
  *   **The Blind Spot:** Your union organizer friend would spot this immediately: **Solidarity.** The procedure treats the member as an individual atom to be protected from collective pressure. But unions work *because* of collective pressure. Sometimes the "machine" is the only thing protecting the weak member from the employer. By making discipline so mechanistic, you may weaken the collective bargaining power of the bloc. The procedure is liberal-individualist; politics is often tribal.

  **2. The "Value Judgment" Traps**
  I flagged Q3 and Q5 as Value Judgments. This is where the procedure hands the decision back to you.
  *   **Q3 (Instrumentality):** You cannot prove empirically that expelling a member helps win an election. You have to guess. The procedure prevents you from hiding that guess behind "rules."
  *   **Q5 (Growth):** Is purity a form of growth (deepening commitment) or contraction (shrinking the tent)? The procedure forces you to define your goal.

  **3. The Founding Pledge Verdict**
  You asked me to be unsentimental. The procedure flags the Pledge as a **STOP** on three counts.
  *   It binds belief ("support" is internal).
  *   It is indefinite (not tied to a cycle).
  *   It polices boundaries rather than enabling action.
  *   **What Follows:** If you keep the Pledge, you admit the party is a sect, not a political vehicle. You cannot claim to seek power while forbidding the compromises power requires. If you scrap it, you risk fracturing the base who signed it. The Procedure suggests the fracture is inevitable; the Pledge just delays it until the convention.

  **4. Why This Survives Argument**
  *   **Mechanistic:** It asks for documents, not feelings. "Show me the vote," not "How did it make us feel?"
  *   **Reciprocal:** It protects the members from you, and you from the members.
  *   **Honest:** It admits when a choice is moral, not procedural.
  *   **Weil-Compliant:** It minimizes pressure on thought.
  *   **Organizer-Compliant:** It allows pressure on action for specific electoral goals.

  **5. Final Instruction**
  Run this in the room. When the procedure stops a measure your allies want, do not argue the merit. Point to the **STOP**. Say: "The rule says this is a loyalty test, not a discipline. If we pass this, we admit we are a sect." Let the procedure take the blame. That is the only way it survives.
