  1. **0.65** – Requiring impartial justification for constitutive relationships corrupts the phenomenology of love and commitment in a morally relevant way.
  2. **0.70** – Integrity concerns the agent's identity and authorship of actions, which is structurally distinct from the aggregate cost of demandingness.
  3. **0.55** – Indirect utilitarianism can plausibly locate the error in the decision procedure rather than the criterion of rightness, blunting the theoretical force.
  4. **0.60** – Any normative theory requiring reflective endorsement of commitments risks similar alienation, reducing the objection's specificity to utilitarianism.
  5. **0.50** – It is contentious whether psychological alienation from a moral theory entails the theory's normative falsity rather than a tragic cost of correctness.

  **Combination:** **0.35**
  This estimate weights the strong phenomenological insights (Terms 1 & 2) against the robustness of the criterion/procedure distinction (Term 3) and the meta-ethical leap required to move from "alienating" to "false" (Term 5). Term 3 acts as an inverse multiplier; since there is a >50% chance utilitarianism can absorb the critique technically, the probability of the objection succeeding as a *refutation* drops significantly.

  **Sensitivity Analysis:**
  The final number is most sensitive to **Term 3 (Absorption)**. If you are convinced that separating the criterion of rightness from the decision procedure is a dishonest dodge (lowering Term 3 to 0.2), the credence rises to ~0.60. If you accept it as a valid theoretical move (raising Term 3 to 0.8), the credence falls to ~0.15. The argument that would move this most is a rigorous analysis of whether a "criterion of rightness" that cannot be consciously applied without distortion can still meaningfully define *rightness*.

  **Calibration:**
  Your credence (0.4) and mine (0.35) are closely aligned, suggesting we share similar doubts about the meta-ethical bridge (Term 5) or the invulnerability of the absorption defense (Term 3). Your friend's credence (0.75) is the outlier. Given she works on consequentialism, this high credence that the objection *succeeds* likely indicates she accepts Williams's refutation of *Act* Utilitarianism specifically, using it to motivate a shift to Rule or Global Consequentialism. Your disagreement most likely lives in **Term 3**: you may view the absorption strategy as more viable than she does, or she may view the integrity objection as fatal to the *Act* variant specifically, whereas you are evaluating the broader utilitarian project.

  **Confidence & Uncertainty:**
  I am **moderately confident (0.60)** in this breakdown. The point I am least sure of is **Term 4 (Generalization)**. It is difficult to assess whether the "one thought too many" critique applies with equal force to Kantian universalizability, as Kantian duties often preserve the *content* of partiality (e.g., special duties to family) even if the *form* is universal, whereas utilitarianism threatens the content itself. Additionally, there is a risk your framing begs the question by defining success as a defect in the "theory of right action"; Williams often argued the defect lies in the "morality system" itself, which might imply the objection succeeds even if the specific criterion of rightness remains technically intact.
