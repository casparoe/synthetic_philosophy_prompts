  ### Seminar Case: The Border Patrol at Ridge 4

  **The Scenario**
  The conflict is a contemporary border skirmish between Northland and Southland over the resource-rich Ridge 4 region. Southland is the victim of unprovoked aggression; Northland initiated the war on fabricated legal pretenses.

  **Elias** is a rifleman for the Southland Defense Force. He is defending a legitimate border post. He is currently pinned down in a trench, taking effective fire from two Northland soldiers advancing 50 meters away. If Elias does not act, he will be killed. He has a clear line of sight and sufficient ammunition to neutralize the threat, but he must choose his targets carefully as they are using cover.

  **Marcus** is a Northland rifleman. He is part of the advancing fire team. Marcus suspects the war's justification is weak; he has heard rumors of the fabricated intelligence from discharged officers. However, he is indifferent. He reasons that he gets paid to fight, not to litigate international law, and that his enemies would kill him without hesitation. He aims at Elias with the intent to kill.

  **David** is Marcus's partner in the fire team. He poses the exact same causal threat as Marcus: same weapon, same distance, same rate of fire, same contribution to the suppression of Elias. However, David is blameless regarding the injustice of the war. Before deploying, David sought out independent information. He consulted Northland's military legal briefings, which were sophisticated forgeries mimicking UN resolutions. He spoke with a chaplain who assured him the mobilization was defensive. David has done everything a reasonable person in his epistemic position could do to verify the justice of his cause. He genuinely believes he is defending Northland from Southland aggression. He aims at Elias with the intent to kill, believing he is acting in self-defense.

  **The Decision**
  Elias must decide whom to engage. He knows, via intercepted comms, that Marcus is aware of the injustice, but he also knows David is operating under standard issuance orders that hide the truth. Elias must determine his moral permissions regarding each combatant.

  ***

  ### Theoretical Verdicts

  **The Traditional Doctrine (Moral Equality of Combatants)**
  The Traditional Doctrine, rooted in *jus in bello* independence, holds that combatant status is the sole criterion for liability. Once an individual puts on a uniform and bears arms, they become a legitimate target, regardless of the justice of their cause (*jus ad bellum*).
  *   **Verdict:** Elias is permitted to kill both Marcus and David. Both men are liable to be killed because they are combatants posing a threat. Conversely, both Marcus and David are permitted to kill Elias, and Elias is liable to be killed by them. The moral blamelessness of David and the culpability of Marcus are irrelevant to their liability; they are moral equals in the eyes of war.

  **The Revisionist View (Responsibility for Unjust Threat)**
  The Revisionist View rejects the independence of *jus in bello*. It holds that liability to defensive harm is grounded in moral responsibility for an *unjust* threat. One loses the right to life only if one is morally responsible for a threat that violates the rights of others.
  *   **Verdict:** Elias is permitted to kill both Marcus and David. Both are objectively posing an unjust threat to Elias's life, and both are responsible for that threat (voluntarily participating in the action). Therefore, both are liable. However, the symmetry breaks regarding Elias's own liability. Because Elias poses a *just* threat (self-defense/defense of sovereignty), neither Marcus nor David is permitted to kill him. Elias is not liable to be killed by either man.

  ***

  ### The Divergent Feature

  The single feature of the case that makes the **Culpability Account** and the **Responsibility Account** (the specific theories under seminar debate) come apart is **David's Moral Culpability**.

  *Note: While the Traditional and Responsibility-Revisionist views diverge on the liability of the Just Combatant (Elias), they converge on the liability of the Unjust Combatants (Marcus and David). The seminar's core question—whether liability tracks culpability or merely responsibility—specifically targets the status of the blameless unjust combatant.*

  *   **The Responsibility Account** (Standard Revisionism): Liability attaches to the objective fact of posing an unjust threat for which one is causally and voluntarily responsible. Culpability (blameworthiness) is not required.
  *   **The Culpability Account** (Alternative Revisionism): Liability requires a fault condition. One must be culpable for the unjust threat to lose the right to life.

  **Demonstration by Removal/Modification**

  1.  **When the blameless combatant (David) is made culpable:**
      *   If David is altered to match Marcus (aware of the injustice but indifferent), the **Culpability Account** changes its verdict: David is now liable.
      *   The **Responsibility Account** does not change its verdict: David was already liable.
      *   The **Traditional Doctrine** does not change its verdict: David was already liable.
      *   *Result:* This modification only affects the Culpability Account, proving that culpability is the specific variable for that theory.

  2.  **When necessity is removed (Killing is unnecessary):**
      *   Suppose Elias can disable the threat non-lethally (e.g., wound them or destroy their weapons) without risk to himself.
      *   **All Theories:** The verdict changes for everyone. No combatant is liable to be *killed* if a lesser harm suffices to avert the threat. Liability is liability to *necessary* defensive harm. This demonstrates that liability is not a blanket forfeiture of rights but is constrained by necessity across all frameworks.

  ***

  ### Closing: The Defense of Moral Equality

  **The Strongest Reply**
  A defender of the Traditional Doctrine (Moral Equality of Combatants) would argue from **epistemic limitation and collective agency**. They would contend that war is a collective enterprise where individual soldiers cannot reliably judge the *jus ad bellum*. To condition liability on the objective justice of the cause (as Revisionism does) or the subjective culpability of the soldier (as the Culpability Account does) imposes an impossible burden on combatants. If David must verify the justice of the war to retain his right to life, war becomes unfightable, as every soldier must become a lawyer and intelligence analyst. Therefore, we must adopt a conventional rule: uniform equals liability. This protects soldiers like David from being murdered for following reasonable orders, preserving a sphere of honor and restraint in war.

  **Evaluation**
  This reply succeeds **pragmatically** but fails **morally**. It succeeds in explaining why international law *currently* operates as it does; we need clear, actionable rules to prevent total chaos and the summary execution of prisoners based on subjective judgments of guilt. However, it fails as a moral justification. A convention cannot grant a right to kill where none exists morally. If David is not morally responsible for an unjust threat in a culpable way, labeling him "liable" simply because he wears a uniform does not make it true; it merely excuses Elias from prosecution. The Traditional Doctrine confuses *legal immunity* with *moral liability*. While it may be the best *policy* for regulating war, it does not accurately track the underlying moral reality of who may be killed.
