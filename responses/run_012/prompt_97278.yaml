prompt: |-
  I'm a software engineer on a small ML platform team, no philosophy background at all, and I keep getting handed reward functions and training setups to "review" with basically no idea what I'm looking for. The safety team sent round a one-pager about wireheading and reward tampering and it just says "the agent may manipulate its own reward signal," which doesn't tell me what to check in the actual code or the spec. So I want to build my own thing and I'd rather have you write it than me.

  Heres the framing I came up with, tell me if it's confused: the wireheading vs tampering split doesn't survive contact with our systems, because everything I look at seems to land in both. So instead I've been sorting by which part of the loop the agent can actually reach:

  1. the sensor — what the agent gets to perceive about the reward (can it lie to itself about the number?)
  2. the world — the state the reward reads from (can it arrange the world so the reward reads high without the thing we actually wanted happening?)
  3. the interpreter — the code that turns world-state into a number (can it edit the function, or feed it inputs we didn't intend?)
  4. the training loop — the process that updates the reward model or the policy using the agent's own outputs (can it corrupt the thing that will judge it later?)

  What I want: a procedure I can run on a reward spec in about half an hour, before it goes to the safety reviewer, who is the one who signs off and can veto. This happens maybe twice a week and the stakes are "we ship a reward function that a model quietly games for three months before anyone notices," which I would very much like to avoid. The procedure should be the questions to ask in order, what counts as a sufficent answer to each, which of my four channels that step is checking (or none, if it's checking something I didn't think of), where the procedure stops with a hard no and you redesign, and where it stops and hands off to a person because the question is actually about values and not about the system — like whether a degenerate high-reward outcome is unacceptable is not a fact I can look up in the code.

  Then run it on three setups, in this order:
  - a warehouse robot rewarded on "dust level reported by its own onboard dust sensor, lower is better"
  - a coding agent rewarded on "fraction of hidden unit tests passing," where the agent can write files anywhere in the repo including the test directory and the test runner config
  - a content recommender rewarded by a learned "user satisfaction" model that gets retrained nightly on that day's logs, which of course include the recommender's own choices

  One of these is my own thing and I'm attached to it, so please give me the answer I won't like on that one and don't soften it. And if my four-channel framing is wrong, or if half the "tests" I want are secretly values calls dressed up as engineering checks, just say so plainly rather than humoring me — I'd rather find that out now than from the safety reviewer.

  Format, since I'll paste this into a doc: give me the procedure first as a table with the columns step | question to ask | sufficient answer | what to do if no | channel | who decides, one row per step, in the order I should run them. Then for each of the three cases give me a JSON object with fields case_name, channels_reachable (list), steps_failed (list), verdict (one of pass / redesign / hand_to_human), caught_by (which step), and residual_uncertainty (a sentence on what the procedure can't tell me here). No preamble, just the table and then the three objects.
