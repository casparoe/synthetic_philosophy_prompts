      *   **Strict vs. Compatible:** What is rule-bound vs. what is incidental.
      *   **Underdetermination:** Truth vs. Knowledge vs. Warranted Trust.
      *   **The Columnist Distinction:** Different language games.
      *   **Counterfactual:** Changing the norm.

