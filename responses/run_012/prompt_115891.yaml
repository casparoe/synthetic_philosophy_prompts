prompt: |-
  I'm a backend dev with no philosophy or bio training and I've somehow ended up running next month's lunch-and-learn for my team (eight engineers, one PM, half an hour, whiteboard, they're probally fine with stats but haven't thought about genetics since school). Topic: heritability, what the number does and does not mean. Don't explain the topic to me, plan how I should teach it. What has to land first for everything else to make sense, which single example should carry the whole session and what that example needs to have and to not have (I'd have reached for twin studies of IQ by default, tell me if that's the wrong choice and why), the wrong ideas they'll walk in with or pick up halfway through and exactly where in the sequence I should head each one off, and one question I can ask at the end that shows me whether it landed rather than whether they nodded. One thing I want built in somewhere: a moment where the genes are the same and the trait is the same but the heritability number comes out different, because that seems to be the bit everyone gets wrong. Also tell me what to skip entirely at this level and to say out loud that I'm skipping it. No reading list obviously, this is a lunch session, not a seminar.
