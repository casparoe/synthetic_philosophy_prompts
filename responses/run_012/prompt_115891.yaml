          *   *Pedagogical Trick:* The "Trait is the same" usually refers to the *mean* or the *individual outcome*, not the variance.
          *   *Standard Example:* Height in 1800 vs Height in 2000. Mean height changed (environment), but heritability might be high in both.
          *   *Wait, let's look at the "Variance" angle.*
          *   Scenario 1: Diverse seeds, Diverse soil. $V_P$ is large. $V_G$ is moderate. $h^2$ is moderate.
          *   Scenario 2: Diverse seeds, *Identical* soil (controlled lab). $V_E \approx 0$. $V_P$ shrinks. $h^2$ goes UP.
          *   But the prompt says "Trait is the same". If $V_P$ shrinks, the trait distribution changed.
