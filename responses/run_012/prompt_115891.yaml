  2.  **Deconstruct the Topic (Heritability):**
      *   *Definition:* Proportion of phenotypic variance in a population attributable to genetic variance. $V_P = V_G + V_E + V_{GxE}$. $h^2 = V_G / V_P$.
      *   *Key Misconception 1:* It applies to individuals (e.g., "80% of my height is genetic"). -> *Correction:* It's about population variance.
      *   *Key Misconception 2:* It's fixed/immutable for a trait. -> *Correction:* It depends on the environment's variance.
      *   *Key Misconception 3:* High heritability means environment doesn't matter. -> *Correction:* Environment can shift the mean without changing variance.
      *   *Key Misconception 4:* High heritability implies genetic determinism or immutability.

  3.  **Address the "Carrying Example" (Twin Studies/IQ):**
      *   *User's Idea:* Twin studies of IQ.
      *   *Critique:* It's politically charged, emotionally loaded, and historically fraught with eugenics baggage. For a 30-min lunch-and-learn, it introduces unnecessary friction. People get defensive or distracted by the social implications rather than the statistical mechanics.
      *   *Better Alternative:* Needs to be continuous, intuitive, and clearly environmentally sensitive.
      *   *Selection:* **Height** is the classic, but maybe too biological? **Reading Speed** or **Corn Yield**?
      *   *Decision:* **Height** is actually best for engineers because the stats are clean, *but* to hit the "Genes=Same, Trait=Same, Heritability=Different" requirement, we need to manipulate the environment variance.
      *   *Refined Selection:* Let's use **Height** but in two different hypothetical populations. It's the standard for a reason: everyone gets it. Or, to make it more "engineering-brain," maybe **Server Latency**? No, that's not genetic. Stick to biology but keep it dry. **Height** is fine, provided we strip the social baggage. Actually, **Corn Height** or **Plant Growth** is safer and removes the human baggage while keeping the biology. Let's go with **Corn Stalk Height**. It's discrete enough, clearly genetic, clearly environmental (water/soil), and removes the IQ/eugenics minefield.

  4.  **Determine the "First Thing to Land":**
      *   Engineers think in variables and functions.
      *   Concept: **Variance, not Value.**
      *   Heritability is about *why we differ*, not *what we are*.
      *   Equation: $Variance_{Total} = Variance_{Genes} + Variance_{Environment}$.
      *   If this doesn't land, nothing else works.

  5.  **Address the "Genes=Same, Trait=Same, Heritability=Different" Requirement:**
      *   This is the crux of the session.
      *   Scenario A: Diverse genes, diverse environment.
      *   Scenario B: Diverse genes, *uniform* environment.
      *   If Environment Variance ($V_E$) drops to near zero, $h^2$ goes up (even if genes and average height stay the same).
      *   If Environment Variance ($V_E$) is huge, $h^2$ goes down.
      *   *Visual:* Two histograms with same spread of traits, but different underlying causes.

  6.  **Identify Misconceptions & Intervention Points:**
      *   *Pre-existing:* "It's my genetic percentage." (Intervene at definition).
      *   *Emergent:* "If $h^2$ is high, we can't change it." (Intervene at the "Uniform Environment" example).
      *   *Emergent:* "It applies to me." (Intervene at the "Population" definition).

  7.  **Determine What to Skip:**
      *   Broad sense vs. Narrow sense heritability ($H^2$ vs $h^2$). Too technical.
      *   GWAS (Genome-Wide Association Studies). Irrelevant to the concept.
      *   Specific calculation methods (ANOVA, regression). Just show the ratio.
