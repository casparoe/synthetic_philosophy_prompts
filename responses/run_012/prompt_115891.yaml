          *   Scenario 2: Diverse seeds, *More* Diverse soil (some drought, some flood). $V_E$ increases. $V_P$ increases. $h^2$ goes DOWN.
          *   *How to make "Trait the same"?* Maybe the prompt implies the *individual's* trait is determined by genes, but the *statistic* changes?
          *   *Best interpretation:* The prompt wants the "Environment Variance" lesson. I will frame it as: "Same seeds (Genes), Same average height (Trait Mean), but different Heritability." I need to clarify that "Trait is the same" refers to the biological mechanism or the mean, not the variance, because if variance doesn't change, heritability doesn't change.
          *   *Actually, there is a specific case:* If you measure a population in Environment A, then measure the *same* population in Environment B.
          *   If Environment B is more uniform than A, $V_E$ drops. $V_P$ drops. $h^2$ rises.
          *   If the prompt insists "Trait is the same" (meaning $V_P$ is constant), then $V_G$ must have changed relative to it.
          *   *Decision:* I will interpret "Trait is the same" as "The physical characteristic being measured is identical (Height)" and "The Genes are the same" (The population is identical). The *context* changes. I will explicitly clarify that the *variance* of the trait changes, which is why the number changes, because if the variance doesn't change, the number can't change. I will treat the prompt's constraint as a teaching moment to clarify that heritability is about *variance*, not the trait itself.
          *   *Wait, one more check:* Is there a case where $V_P$ is constant but $h^2$ changes? Only if $V_G$ changes. But the prompt says "Genes are the same".
          *   *Okay, I will pivot:* The prompt asks for "Genes same, Trait same, Heritability different." This is mathematically impossible if "Trait same" means $V_P$ same and "Genes same" means $V_G$ same.
          *   *Hypothesis:* The user might be misremembering the concept, OR they mean "The trait *type* is the same (Height)" and "The *population* genes are the same".
          *   *Strategy:* I will fulfill the *spirit* of this requirement (Environment changes Heritability) while correcting the *letter* of it (Variance must change). I will explain *why* it's impossible for the number to change if the variances don't, which reinforces the core lesson.
          *   *Wait, no.* I can make the *Mean* trait the same.
          *   Population A: Diverse Genes, Diverse Env. Mean Height 100cm. $h^2 = 0.5$.
          *   Population B: Diverse Genes (Same set), Uniform Env. Mean Height 100cm (adjusted). $h^2 = 0.9$.
          *   Here "Genes are same" (Population pool), "Trait is same" (Mean/Type), Heritability different. This works.

  9.  **Developing the Validation Question:**
      *   Bad: "What is heritability?" (Recall)
      *   Bad: "Is IQ heritable?" (Opinion/Fact)
      *   Good: A scenario where they have to apply the variance logic.
      *   Scenario: "We fix the environment for everyone perfectly. What happens to the heritability of height?"
      *   Answer: It goes to 100% (or near it), even though height hasn't changed.

  10. **Refining the Tone:**
      *   Peer-to-peer (Engineer to Engineer).
