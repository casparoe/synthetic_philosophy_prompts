answer: |-
  Here is the battle plan for your 30-minute session.

  ### 1. The Foundation: What Must Land First
  **Concept:** Heritability is about **Variance**, not **Values**.
  **Why:** Engineers think in inputs and outputs. Your team's default intuition is "Heritability = How much of *my* height is genes?" (Value). You need to overwrite this immediately with "Heritability = How much of the *difference* between us is genes?" (Variance).
  **How to say it:** "If everyone in this room had the exact same genes, heritability would be 0%, even if we were all 7 feet tall. Heritability explains the *spread*, not the *average*."

  ### 2. The Carrying Example: Ditch IQ, Use Corn
  **Your Default:** Twin studies of IQ.
  **Verdict:** **Do not use this.**
  **Why:**
  1.  **Baggage:** IQ brings in eugenics, race, and socioeconomic politics. You will spend 15 minutes managing emotions instead of teaching stats.
  2.  **Noise:** IQ is a latent construct (a test score), not a physical measurement. It introduces measurement error arguments that distract from the core variance lesson.
  3.  **Complexity:** Gene-environment correlation is massive in IQ (smart parents create smart environments). It muddies the water.

  **The Replacement:** **Corn Stalk Height.**
  **What it needs:**
  *   **Continuous Variable:** Height (easy to visualize as a bell curve).
  *   **Clear Inputs:** Seeds (Genes) + Soil/Water (Environment).
  *   **Manipulable:** You can hypothetically "control" the soil easily on a whiteboard.
  **What it must not have:**
  *   No molecular biology (no mention of DNA strands, alleles, or SNPs).
  *   No survival bias (don't talk about plants dying, just height).

  ### 3. The "Magic Trick": Same Genes, Same Trait, Different Number
  This is the core requirement. You need to show that $h^2$ is a property of the *population context*, not the *trait itself*.

  **The Setup (Whiteboard):**
  Draw two bell curves side-by-side. Label both "Corn Height."
  *   **Population A (The Field):** You plant 1,000 genetically diverse seeds in a natural field. Some get good soil, some get bad soil.
      *   $Variance_{Total}$ is High.
      *   $Variance_{Genes}$ is Moderate.
      *   $Variance_{Env}$ is Moderate.
      *   **$h^2$ = 0.5**
  *   **Population B (The Lab):** You take the **exact same 1,000 seeds** (Genes are the same). You grow them in a hydroponic lab with perfect, identical nutrient delivery for every single plant.
      *   $Variance_{Env}$ drops to near zero.
      *   $Variance_{Total}$ shrinks (the bell curve gets skinny).
      *   **$h^2$ = 0.95**

  **The Punchline:**
  "The seeds are identical. The trait (height) is identical. But in the lab, almost 100% of the *remaining differences* between plants are due to genes, because we eliminated the environmental noise. **Heritability went up, not because the genes changed, but because the environment became uniform.**"

  *(Note: Technically, the trait variance shrinks in the lab. If your team pushes on "Trait is the same," clarify: "The biological mechanism is the same, the population is the same, but the distribution tightens. If the distribution didn't tighten, the number couldn't change.")*

  ### 4. Misconception Trap Map
  Engineers will try to optimize the model. They will break it if you don't place guardrails.

  | Misconception | When it hits | How to head it off |
  | :--- | :--- | :--- |
  | **"So 80% of my height is genetic?"** | **Minute 5.** As soon as you define it. | **Pre-empt it.** Say out loud: "If I take a single individual, heritability is undefined. It is a population statistic. It does not apply to you." Write **$N > 1$** on the board. |
  | **"High $h^2$ means we can't change it."** | **Minute 15.** During the Corn example. | **Counter-example:** "Phenylketonuria (PKU) is 100% genetic. But we cure it with diet (environment). High heritability does not mean immutability." |
  | **"Heritability is constant for a trait."** | **Minute 20.** During the Magic Trick. | **Reinforce the Magic Trick.** "Height $h^2$ is different in a famine than in a supermarket. The number is not a physical constant like gravity." |
  | **"Genes vs. Environment is additive."** | **Throughout.** | **Simplify.** Acknowledge interaction ($G \times E$) exists, but say "For this model, we treat them as additive variance buckets to keep the math visible." |

  ### 5. What to Skip (And Say You're Skipping It)
  You have 30 minutes. Do not let Q&A drag you into these weeds. Explicitly list these on the board under "Out of Scope" at the start:
  1.  **Broad ($H^2$) vs. Narrow ($h^2$) Sense:** "We are treating 'genetic variance' as one bucket. We are not distinguishing additive vs. dominant gene effects."
  2.  **GWAS / Specific Genes:** "We are not talking about *which* genes, only *how much* variance they explain."
  3.  **Epigenetics:** "We are ignoring methylation and gene expression switches for this session."
  4.  **Gene-Environment Correlation:** "We are assuming genes and environment are independent for this model, even though in humans they often aren't."

  ### 6. The Validation Question
  Do not ask "Does this make sense?" They will lie to be polite.
  Do not ask "What is heritability?" They will recite the definition without understanding.

  **Ask this instead:**
  > "Imagine we invent a technology that gives every child on earth the exact same nutrition, schooling, and home environment. The environment is now perfectly uniform.
  >
  > **What happens to the heritability of IQ?**
  > A) It goes to 0%
  > B) It stays the same
  > C) It goes to 100%
  > D) It becomes undefined"

  **Correct Answer:** **C) It goes to 100%.**
  **Why:** Because $Variance_{Environment}$ is now zero. Any remaining differences between kids *must* be due to genes.
  **What it tests:** If they answer A, they think heritability means "genetic determinism." If they answer B, they think it's a fixed constant. If they answer C, they understand it's a ratio of variances.

  ### 7. The 30-Minute Sequence

  *   **00:00 – 00:03: The Hook & The Skip List.**
      *   Write "Heritability $\neq$ Inheritance" on the board.
      *   List the "Out of Scope" items (see Section 5).
      *   State the Goal: "By the end, you'll know why heritability can be 100% for a trait that is 100% fixable by environment."
  *   **00:03 – 00:08: The Definition (Variance, not Value).**
      *   Draw the equation: $V_{Total} = V_{Genes} + V_{Env}$.
      *   $h^2 = V_{Genes} / V_{Total}$.
      *   **Crucial:** Emphasize $N > 1$. No individuals.
  *   **00:08 – 00:18: The Corn Example (The Magic Trick).**
      *   Draw the Field vs. Lab scenario (Section 3).
      *   Walk through how shrinking $V_{Env}$ forces $h^2$ up.
      *   *Check for pulse:* Ask, "If I make the soil worse for everyone, but still uniform, does $h^2$ change?" (No. Variance matters, not mean).
  *   **00:18 – 00:23: The Human Translation & Traps.**
      *   Apply the Corn logic to humans.
      *   Address the "Immutability" trap (PKU example).
      *   Address the "Individual" trap (It doesn't apply to *you*).
  *   **00:23 – 00:27: The Validation Question.**
      *   Pose the "Uniform Environment" IQ question (Section 6).
      *   Have them vote (hands up).
      *   Explain the answer using the whiteboard equation.
  *   **00:27 – 00:30: Q&A / Wrap.**
      *   If they ask about specific genes, point to the "Skip List."
      *   End on time.

  ### Final Advice for the Presenter
  *   **Draw the Bell Curves.** Engineers trust visuals more than words. A wide bell curve (Field) vs. a skinny bell curve (Lab) explains the concept faster than any sentence.
  *   **Don't Apologize.** You don't need a bio degree to teach stats. You are teaching them how to interpret a metric, not how to sequence DNA.
  *   **Hold the Line on IQ.** If someone asks, "But what about actual human IQ studies?" say: "The statistical mechanics are the same as the corn, but the data is noisier. Let's stick to the mechanics today."
