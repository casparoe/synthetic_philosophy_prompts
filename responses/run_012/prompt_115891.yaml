      *   *Minute 5-15:* The Corn Example (The Core). Walk through Population A vs. Population B.
      *   *Minute 15-20:* The "Same Genes, Same Trait, Different $h^2$" Moment. This needs to be the climax.
      *   *Minute 20-25:* Misconception Sweep. Address the "Individual" and "Immutability" errors.
      *   *Minute 25-30:* The Validation Question.

