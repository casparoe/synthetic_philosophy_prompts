          *   Interpretation: The *set* of genotypes is the same (same genetic diversity in the pot), the *distribution* of the trait (phenotype) looks the same (same mean and variance), but the *heritability* differs.
          *   How? By changing the *environmental variance* while compensating to keep phenotypic variance constant? No, that's too math-heavy.
          *   Easier interpretation: Same population (same genes), Same average trait, but measured in two different environments.
          *   Actually, the prompt says "Genes are the same... trait is the same". This implies the *input* genetic diversity is identical, and the *output* phenotypic spread is identical.
          *   If $V_P$ is same, and $V_G$ is same, then $h^2$ must be same.
