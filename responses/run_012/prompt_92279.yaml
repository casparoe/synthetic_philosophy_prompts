      *   *Pragmatist Position:* Treats the legal system as a social practice (like a game played by humans). Rules don't apply themselves; officials do. They are worried about *efficacy and acceptance*.
      *   *Is it Verbal?* Partially. They use "valid," "rule," and "paradox" differently. Literalists mean "logically derivable," Pragmatists mean "socially enforced."
