answer: |-
  ### 1. The Distinction: *Prasajya* vs. *Paryudāsa*

  The distinction between *prasajya-pratiṣedha* and *paryudāsa-pratiṣedha* originates in Indian grammar (Vyākaraṇa) and hermeneutics (Mīmāṃsā), later adopted by Buddhist logicians and Madhyamaka philosophers. It concerns the logical and ontological scope of negation.

  *   **Paryudāsa-pratiṣedha (Implicative Negation):** This is a "choice" negation. It negates a specific predicate but implies the affirmation of a contrary predicate within the same domain. It preserves the Law of Excluded Middle.
      *   *Example:* "He is a non-Brahmin."
      *   *Implication:* This negates "Brahmin" but implies he belongs to another caste (e.g., Kshatriya). It posits a positive reality in place of the negated one.
      *   *Logical Form:* $\neg P \to Q$ (where $Q$ is a contrary within the same universe of discourse).

  *   **Prasajya-pratiṣedha (Non-implicative Negation):** This is a "cancellation" negation. It negates the predicate without implying any alternative. It rejects the applicability of the predicate entirely, often suspending the existential commitment to the subject or the framework itself.
      *   *Example:* "There is no pot."
      *   *Implication:* This does not imply "There is a cloth." It simply denies the existence of the pot. In Madhyamaka, this is crucial for negating essence (*svabhāva*) without positing "nothingness" or a different essence in its place.
      *   *Logical Form:* $\neg P$ (with no commitment to $Q$).

  For Nāgārjuna, the *prasajya* negation is soteriologically vital. If he used *paryudāsa*, his denial of "intrinsic nature" would imply the existence of some *other* nature, trapping him in a view (*dṛṣṭi*). *Prasajya* allows him to reject a thesis without asserting a counter-thesis.

  ---

  ### 2. The Tetralemma (*Catuṣkoṭi*) and the Collapse Problem

  The *catuṣkoṭi* presents four possible positions regarding any ontological predicate $P$ (e.g., "The world is eternal"):
  1.  $P$ (Being)
  2.  $\neg P$ (Non-being)
  3.  $P \land \neg P$ (Both)
  4.  $\neg(P \lor \neg P)$ (Neither)

  In the *Mūlamadhyamakakārikā*, Nāgārjuna typically negates all four limbs. The logical difficulty arises with the fourth limb. If we negate the first two limbs, we have $\neg P$ and $\neg(\neg P)$. The fourth limb is the negation of the disjunction: $\neg(P \lor \neg P)$.

  **Does the fourth limb collapse?**
  By De Morgan's laws, $\neg(P \lor \neg P)$ is logically equivalent to $\neg P \land \neg(\neg P)$. Thus, formally, the fourth limb appears to be merely the conjunction of the negations of the first two. If the negation of the first two limbs is already granted, the fourth limb seems redundant.

  However, in the Madhyamaka context, the fourth limb is not treated as a logical consequence but as a distinct *gestural* rejection. While the first two limbs reject the specific predicates ($P$ and $\neg P$), the fourth limb rejects the **exhaustiveness of the disjunction**. It signals that the framework generating the options "P or not-P" is itself flawed. It is not just that $P$ is false and $\neg P$ is false; it is that the question "P or not-P?" is ill-posed (a *vyākṛta-avyākṛta* or indeterminate question).

  So, while it collapses logically in a classical propositional system, it remains distinct pragmatically: it negates the logical space, not just the occupants of that space.

  ---

  ### 3. Analyzing the Mixed-Negation Proposal

  You propose a specific interpretive scheme: **Limbs 1 & 2 employ implicative negation (*paryudāsa*), while Limbs 3 & 4 employ non-implicative negation (*prasajya*).** (Note: Since Limb 1 is affirmative, this likely means the negation *of* Limb 1 and Limb 2 is implicative, while the negation *of* Limb 3 and Limb 4 is non-implicative. Or, it implies the internal logic of 2 and 4 relies on different negations. I will analyze the strongest version: that the *status* of the negation shifts halfway through the tetralemma.)

  #### Explanatory Work
  This proposal attempts to solve the "collapse" problem and the problem of contradiction.
  1.  **Saving the Fourth Limb:** If the negations of Limbs 1 and 2 are *paryudāsa*, they operate within a conventional system of distinctions (e.g., "Not Eternal" implies "Impermanent"). The conjunction of these negations remains within that system. If the negation of Limb 4 is *prasajya*, it operates meta-logically to cancel the system itself. This explains why Limb 4 is distinct: it belongs to a different logical type (object-level vs. meta-level).
  2.  **Avoiding Contradiction:** If Limb 2 ($\neg P$) is *paryudāsa*, it implies $Q$. Then Limb 3 ($P \land \neg P$) becomes ($P \land Q$), which might be contingent rather than contradictory. Limb 4 then negates this whole complex non-implicatively.

  #### Is it *Ad Hoc*?
  Yes, largely. There is little textual evidence in Nāgārjuna's corpus to suggest a shift in the *type* of negation midway through the tetralemma.
  *   **Uniformity of Emptiness:** Nāgārjuna's central claim is that all dharmas are empty. This uniformity suggests a uniform method of negation. Standard Madhyamaka exegesis (from Candrakīrti to modern scholars like Garfield and Westerhoff) insists that **all** Madhyamaka negations must be *prasajya*. If Limbs 1 and 2 were negated via *paryudāsa*, Nāgārjuna would be implicitly affirming a conventional essence in the first half of the lemma, which undermines the radical emptiness he seeks to demonstrate.
  *   **The "Switch" Problem:** There is no grammatical marker in the Sanskrit *kārikās* that indicates a shift from *paryudāsa* to *prasajya* between the second and third limbs. Introducing this distinction solely to save the fourth limb from logical redundancy looks like a retrofit to make the *catuṣkoṭi* fit classical logical expectations.

  #### Redescription vs. Independent Work
  This is the critical point. Does the distinction do **independent explanatory work**, or is it a **redescription**?
  It is largely a **redescription**.
  *   **Redescription:** The proposal essentially maps the distinction between "Conventional Truth" (*saṃvṛti-satya*) and "Ultimate Truth" (*paramārtha-satya*) onto the grammar of negation. Saying "Limbs 1 & 2 are implicative" is just a formal way of saying "Limbs 1 & 2 operate within conventional logic." Saying "Limbs 3 & 4 are non-implicative" is just a formal way of saying "Limbs 3 & 4 point to the ultimate."
  *   **Lack of Independence:** The distinction does not explain *why* the tetralemma works; it merely labels the intuition that the later limbs feel more radical. It relies on the prior philosophical commitment (that there is a shift from conventional to ultimate) to justify the logical distinction, rather than the logical distinction justifying the philosophical shift.

  ---

  ### 4. The Alternative: The Therapeutic Device

  The alternative view, favored by many contemporary Madhyamaka scholars, is that the *catuṣkoṭi* is not a set of truth-functional theses but a **therapeutic device** for exhausting *prapañca* (conceptual proliferation).

  *   **All Negations are *Prasajya*:** On this reading, Nāgārjuna uses *prasajya* negation consistently across all four limbs. He does not assert $\neg P$; he rejects the assertion of $P$ without asserting $\neg P$.
  *   **The Function of the Fourth Limb:** The fourth limb is not a logical position ("Neither exists nor does not exist" as a state of affairs). It is the **abandonment of the question**. When the first three limbs are shown to be untenable, the fourth limb represents the realization that the conceptual dichotomy ($P$ vs. $\neg P$) does not apply to reality (*tathatā*).
  *   **Addressing the Collapse:** In this view, the logical "collapse" of the fourth limb into the conjunction of the first two is irrelevant. The tetralemma is not a proof system; it is a *reductio ad absurdum* of conceptual grasping. The fact that the fourth limb is logically redundant in a propositional calculus highlights that **logic itself** is reaching its limit. The "collapse" is the point: it shows that when you push conceptual distinctions to their limit, they dissolve.

  ### 5. Conclusion: Is the Distinction Doing Work?

  To answer your specific concern: **The distinction between *prasajya* and *paryudāsa* is doing independent explanatory work only if one insists on reading the *catuṣkoṭi* as a formal logical system.**

  If one treats the tetralemma as a formal logic puzzle, the mixed-negation proposal attempts to prevent the system from exploding into triviality or redundancy. However, this comes at the cost of being *ad hoc* and textually unsupported.

  If one accepts the **therapeutic reading**, the distinction between the two negations is still vital, but **globally**, not locally.
  *   **Global Work:** It is essential to establish that *all* of Nāgārjuna's negations are *prasajya* to prove he is not a nihilist (who would use *paryudāsa* to assert "Nothing exists").
  *   **Local Redescription:** Applying the distinction *differentially* across the four limbs (1&2 vs. 3&4) is a redescription of the move from conventional analysis to ultimate realization. It formalizes the soteriological trajectory but adds no new logical leverage.

  Therefore, the fourth limb does "collapse" into the negations of the first two if treated propositionally. The mixed-negation proposal tries to hide this collapse by changing the rules halfway through. The therapeutic view accepts the collapse as the signal that the propositional attitude itself must be abandoned. The distinction between negations is thus best used to defend Madhyamaka against the charge of nihilism (globally), rather than to solve the internal logic of the tetralemma (locally).
