answer: |-
  # Q&A Preparation Sheet
  **Workshop:** Neural Translation & The Limits of Functionalism
  **Presenter:** [Your Name]
  **Time:** 15 Minutes for Q&A

  ### 1. The "Intentional Stance" Objection
  **Likelihood:** High | **Damage:** High
  **Attributed to:** The Dennett-style Deflationist
  **Phrasing:** "You're drawing a bright line between 'Mapping' and 'Interpretation,' but from the outside, they look identical. If a system consistently translates a bridging reference correctly because it predicts that's what a speaker *would* intend, isn't it adopting the intentional stance? If it walks like an interpreter and quacks like an interpreter, insisting it lacks 'understanding' looks like you're protecting a homunculus in the head rather than describing a functional difference."

  **Reply (2 mins):**
  "The Intentional Stance is a tool for *prediction*, but my claim is about *explanation*. We can predict eclipses using Ptolemaic epicycles, but that doesn't mean the universe runs on epicycles. Similarly, we can treat the model *as if* it infers intent to predict its output, but the architectural reality is that it minimizes loss over token distributions. The distinction matters because 'Mapping' breaks when the distribution shifts (out-of-distribution data), whereas 'Interpretation'—grounded in intent—generalizes. If the system relies solely on statistical regularity, it will fail in novel pragmatic contexts where the data is sparse. I'm not protecting a homunculus; I'm pointing out that different mechanisms yield different robustness profiles, even if the output is currently indistinguishable."

  **Weakest Point:**
  This concedes that if the model *does* generalize to novel pragmatic contexts (which LLMs increasingly do), the distinction collapses. It relies on an empirical claim about robustness that might be falsified by the next model release.

  ### 2. The "Operational Sufficiency" Objection
  **Likelihood:** High | **Damage:** Medium
  **Attributed to:** A Computational Linguist (Functionalist)
  **Phrasing:** "In our field, understanding is operationalized by performance on downstream tasks. If a translation enables a human to act on the information correctly, the communicative goal is met. By positing a hidden variable called 'Interpretation' that doesn't change the success conditions of the communication, aren't you just adding metaphysical baggage that has no bearing on evaluation?"

  **Reply (2 mins):**
  "It matters for *diagnosis* and *safety*, not just success rates. If a system succeeds via Mapping, it succeeds by coincidence with the training distribution. If it succeeds via Interpretation, it succeeds by tracking the speaker's goal. In high-stakes contexts—legal, medical, diplomatic—coincidence is insufficient. We need to know *why* the system got it right to trust it when the context shifts. If we define understanding purely by behavioral success, we lose the ability to distinguish between a system that knows what it's doing and one that is merely lucky within the training manifold. That's not baggage; it's risk assessment."

  **Weakest Point:**
  It risks sounding like a "safety" pivot rather than a philosophical argument. If the CL argues that better metrics capture this risk, the philosophical distinction again reduces to an engineering metric.

  ### 3. The "Latent Space" Objection
  **Likelihood:** High | **Damage:** Medium
  **Attributed to:** A Computational Linguist (Engineer/Architect)
  **Phrasing:** "You characterize the system as doing 'Mapping' over surface strings. But modern transformers don't map strings to strings; they map strings to high-dimensional latent vectors where semantic and pragmatic relations are encoded. Probing studies show these vectors capture entailment and sentiment. Why assume the model isn't recovering 'intent' in latent space, even if it doesn't output that reasoning explicitly?"

  **Reply (2 mins):**
  "Latent representations are not semantic interpretations; they are compression artifacts optimized for prediction. A vector can correlate with 'intent' without representing 'intent' as a variable the system manipulates. The crucial test is intervention: if you manipulate the presumed 'intent' vector, does the output change in ways consistent with pragmatic reasoning, or just in ways consistent with the training distribution? Current evidence suggests the latter. The model encodes *that* people usually intend X in context Y, not *why* they intend it. Without the 'why,' it cannot handle cases where the usual regularity is suspended for a specific communicative purpose."

  **Weakest Point:**
  "Probing studies" are a moving target. If a new paper emerges showing causal intervention on latent vectors successfully alters pragmatic output, this reply becomes obsolete.

  ### 4. The "Natural Kind" Objection
  **Likelihood:** Medium | **Damage:** High
  **Attributed to:** One of the Externalist Philosophers
  **Phrasing:** "You treat 'Interpretation' as a natural kind—a distinct cognitive capacity. But if externalism is true, meaning is fixed by causal history and environment, not internal architecture. Why should we care if the internal process is 'Mapping' or 'Interpretation' if the external relations (the use of the translation in a community) are identical? Isn't your distinction internalist individualism in disguise?"

  **Reply (2 mins):**
  "I agree meaning isn't solely in the head, but *competence* is a property of the system processing the meaning. Two systems can be embedded in the same environment but have different capacities to maintain that embedding under stress. A calculator and a mathematician can both produce '4' for '2+2' in a standard environment. But their capacity to maintain that correctness when the notation changes or the problem is embedded in a novel theory differs. My distinction tracks the *capacity to sustain external relations* under variation, not the relations themselves. It's not about where meaning lives, but how the system grasps it."

  **Weakest Point:**
  It risks conceding that "understanding" is just a label for "robustness," which a functionalist could accept without granting any mental states.

  ### 5. The "Benchmark Validity" Objection
  **Likelihood:** High | **Damage:** Low
  **Attributed to:** A Computational Linguist (Evaluation Specialist)
  **Phrasing:** "You mention 'bridging reference' cases where NMT fails. But if these cases are diagnosable, we can build evaluation sets for them. Once we train on those sets and the models solve them, your claim that they lack 'Interpretation' will just retreat to a new set of edge cases. Isn't this just the Chinese Room argument repackaged as a moving goalpost?"

  **Reply (2 mins):**
  "It's not a moving goalpost if the goal is defined by a *category* of error, not specific instances. The category is: cases where the correct output contradicts the statistical regularity of the training data but aligns with communicative intent. If a model solves these, it must be using a mechanism that tracks intent over distribution. At that point, I would concede the point. My claim is empirical: current architectures solve these by memorizing new regularities, not by inferring intent. If you can show an architecture that infers intent without prior distributional support, I will grant it 'Interpretation.' The goalpost is fixed at 'inference vs. memorization,' not 'harder sentences.'"

  **Weakest Point:**
  It commits you to a specific empirical threshold. If a model demonstrates "inference-like" behavior on out-of-distribution pragmatic tasks, you must concede understanding, which might be too generous.

  ### 6. The "Human Analogy" Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Attributed to:** A Computational Linguist (Cognitive Science leanings)
  **Phrasing:** "Humans are also probabilistic learners. We rely on priors, heuristics, and distributional regularities to infer intent most of the time. If human understanding is largely 'Mapping' with a thin layer of 'Interpretation,' why is the gap you describe a categorical difference rather than a difference of degree? At what percentage of 'Interpretation' does understanding emerge?"

  **Reply (2 mins):**
  "It is a difference of degree in *performance*, but a difference in *kind* in *mechanism*. Humans possess a theory of mind mechanism that allows us to posit goals even when they violate statistical norms. We can understand a lie, a joke, or a metaphor precisely because we don't just predict the next token based on truth conditions or frequency. Current NMT has no mechanism to posit a goal that contradicts the data. Even if humans use mapping 90% of the time, that 10% of genuine inference is what constitutes understanding. A system that is 0% on that dimension is categorically different, even if it matches human output 90% of the time."

  **Weakest Point:**
  It relies on a controversial view of human cognition (that we aren't just sophisticated statistical engines). If the CL argues humans are purely predictive processing systems, your "10%" vanishes.

  ### 7. The "Causal History" Objection
  **Likelihood:** Low | **Damage:** High
  **Attributed to:** The Second Externalist Philosopher
  **Phrasing:** "On an externalist view, a system understands 'water' only if it has the right causal contact with H2O. NMT has no causal contact with the world, only with text. So, strictly speaking, it understands nothing, regardless of your Mapping/Interpretation distinction. Isn't your distinction just arguing about which type of non-understanding the system performs?"

  **Reply (2 mins):**
  "That's a valid skeptical challenge, but it makes the concept of understanding useless for AI evaluation. If *no* digital system can understand, we lose the ability to distinguish between a search engine and a chatbot. My distinction is a *relative* one within the domain of information processing systems. I'm asking: 'Does this system process information in a way that approximates the functional role of understanding, even if it lacks worldly causal contact?' We can grade understanding by functional sophistication even if we deny it full externalist satisfaction. Otherwise, we can't even discuss progress."

  **Weakest Point:**
  It concedes the externalist point to save the utility of the term, which might look like pragmatism undermining your own philosophical rigor.

  ### 8. The "Context Window" Objection
  **Likelihood:** Medium | **Damage:** Low
  **Attributed to:** A Computational Linguist
  **Phrasing:** "You say the right choice is fixed by what the speaker is trying to do, which isn't in the data. But with million-token context windows, the 'speaker's intent' is often explicitly stated in the conversation history. Doesn't expanding the context effectively turn 'Interpretation' cases into 'Mapping' cases by making the intent explicit in the input?"

  **Reply (2 mins):**
  "Making the intent explicit in the input doesn't mean the system *interprets* it; it just means the statistical cue is now local rather than distant. If I tell you 'I am joking,' and you translate accordingly, that's mapping the cue 'joking' to 'non-literal translation.' If I *don't* tell you, and you infer it from tone and context, that's interpretation. Most real-world translation lacks explicit meta-commentary on intent. Relying on expanded contexts solves the problem by changing the task from translation to summarization-of-instructions, which isn't the general case."

  **Weakest Point:**
  It defines "Interpretation" narrowly as "inference from silence." If the model learns to infer intent from subtle cues in the context window without explicit statements, this reply fails.

  ***

  ### The Question I Hope Nobody Asks

  **The Question:**
  "If a system passed your 'Interpretation' tests—successfully handling bridging references and pragmatic inference in out-of-distribution contexts—would you then grant it understanding? Or would you find a new reason to deny it?"

  **Why I Hope It Isn't Asked:**
  This is the **Turing Trap**.
  *   **If I say "Yes":** I concede that understanding is nothing more than functional competence on specific tasks. This validates the functionalist view I am arguing against, reducing my "Mapping vs. Interpretation" distinction to merely "Current Tech vs. Future Tech." It undermines the philosophical claim that there is a *kind* of missing interiority.
  *   **If I say "No":** I appear to be a mystic or a biological chauvinist, implying that no amount of behavioral evidence could ever convince me. This alienates the computational linguists and makes my criteria unfalsifiable.

  The question forces me to admit that my argument rests on a specific architectural prejudice (that statistical learning *cannot* equal understanding) rather than a clear behavioral benchmark. It exposes that my "Interpretation" category might just be "Behavior the machine can't do *yet*," which is an empirical claim, not the philosophical distinction I want to defend. I need to navigate this by arguing that the *mechanism* matters, not just the test, but that is a hard sell in a 2-minute reply.
