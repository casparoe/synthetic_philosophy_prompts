      *   **Audience (20 people):**
          *   Majority: Computational linguists (evaluation focus, functionalist temperament, understanding = behavior or irrelevant).
          *   Two: Philosophers of language (externalists about meaning, question if understanding is a natural kind).
          *   One: Dennett-style deflationist (distinction is without a difference).
      *   **Task:** Prepare a Q&A sheet.
      *   **Requirements:**
          *   ~8 objections.
