answer: |-
  **MEMORANDUM**

  **TO:** Animal Care and Use Committee (ACUC)
  **FROM:** Chair, ACUC
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Foundation Endowment and Policy Amendment

  **Purpose**
  At our upcoming meeting on November 2, we must vote on whether to recommend the University accept a conditional endowment offer from the [Foundation Name]. The offer funds a new research centre and two endowed chairs. The condition requires amending our Animal Care Policy to adopt the "automaton premise" as its stated rationale: that moral standing is grounded in the capacity for thought, not sensation. This amendment necessitates removing birds and cephalopods from our Schedule of Species Requiring Extra Justification.

  This memo outlines the ethical and procedural implications of this condition and recommends a course of action.

  **The Provost's Position: Operational Decoupling**
  We must give due weight to the Provost's argument. The administration contends that a policy's stated rationale is distinct from its operational enforcement. Under this view, we could adopt the Foundation's language to secure the funding while maintaining our current review standards internally. The Provost argues that no animal is materially worse off if our *practices* remain unchanged, even if our *preamble* shifts. Given the university's financial constraints, the opportunity cost of declining is significant. This is a pragmatic argument: secure the resources for research, and manage the regulatory language as a formality.

  **The Committee's Counter-Argument: Integrity and Incoherence**
  I recommend we reject this decoupling strategy. A policy's rationale is not merely decorative; it is the interpretive key used during audits, grievances, and protocol reviews. If we adopt a rationale stating that sensation is morally irrelevant, we undermine the logical basis of our precautionary clause. The precautionary clause requires us to resolve inconclusive evidence of suffering in favor of protection. **[Author's Note: Contestable Line]** *It is my position that a committee cannot coherently claim to protect beings based on potential suffering while simultaneously professing that suffering is not a ground for moral standing.* If the rationale changes, a future committee—or an external auditor—could legitimately argue that protecting birds based on "inconclusive sensation" violates the new policy mandate.

  Furthermore, we have a protocol for corvid caching scheduled for review. This involves food restriction and social isolation. Under our current policy, the strong neuroanatomical evidence for corvid suffering triggers extra justification. Under the proposed amendment, that evidence becomes irrelevant unless we can prove "thought" in the Foundation's specific sense. To approve the amendment is to pre-judge this protocol and future ones, rendering our evidence-based schedule obsolete.

  **The Cartesian Attribution**
  The Foundation frames this condition as restoring a "Cartesian" balance. Our colleague in philosophy has rightly noted that the popular caricature of Descartes—who allegedly denied animals any feeling—is historically contested.

  *   **Settled:** Descartes distinguished humans as *res cogitans* (thinking things) and animals as *res extensa* (extended things/machines). He denied animals rational agency and language.
  *   **Contested:** Historians debate whether Descartes denied animals *qualia* (subjective experience of pain) or merely the *conscious reflection* on that pain. Some readings suggest he acknowledged physiological pain responses but denied they constituted moral harm without a soul to register them.

  Regardless of historical accuracy, the Foundation's "automaton premise" is a substantive ethical claim: *Thought grants standing; sensation does not.*

  **[Author's Note: Contestable Line]** *If we treat this premise as a live philosophical option rather than a historical artifact, its strongest contemporary defence lies in moral agency: only beings that can reason can participate in the moral community, and thus only they are owed duties.* However, this conflicts with the regulatory framework (e.g., AWA/PHS/CCAC) under which our university operates, which is predicated on the minimization of pain and distress, not the recognition of rational agency. Adopting the Foundation's premise would not merely change our policy; it would place our university in potential conflict with federal and accreditation standards that recognize sentience as the threshold for regulation.

  **Recommendation**
  The financial benefit is substantial, but the cost is the integrity of our oversight mandate. The Provost's proposal asks the Committee to act in bad faith: to sign a rationale we do not hold and intend to violate in practice. This exposes the Committee and the University to liability and reputational risk should the discrepancy between our stated rationale and our protective actions become public.

  I recommend we **Decline** the conditional offer. We cannot accept funding that requires us to falsify our ethical basis for oversight.

  **Motion and Next Steps**
  I propose the following motion for the November 2 meeting:

  > *Motion:* That the Animal Care and Use Committee recommends to the Provost that the University decline the endowment offer from [Foundation Name] insofar as it is conditional upon amendments to the Animal Care Policy that contradict the evidence-based precautionary principle currently in force.

  **Time Frame:**
  If this motion passes, I will notify the Provost and the Foundation by **November 4**. We will then proceed with the corvid caching protocol review under our existing policy guidelines on **November 9**.

  **Conclusion**
  We are stewards of both research integrity and animal welfare. We can pursue the former without compromising the latter. To accept the "automaton premise" is to assert that the evidence of suffering we have reviewed is morally silent. **[Author's Note: Contestable Line]** *I submit that evidence of suffering is never morally silent, regardless of the capacity for abstract thought.* We should not sign a document that says otherwise.

  Please review this analysis prior to our vote.

  Chair, ACUC
