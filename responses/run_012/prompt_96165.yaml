      *   *What changes if dropped?* Shift to Best Interests, less surrogate burden, more paternalism.
      *   *Why not society?* Liberal individualism boundaries.

      *(Self-Correction)*: I need to make sure I don't get too bogged down in specific case law unless it illustrates the philosophical point. Focus on the *logic* of the practice.

      *(Refining the Depression Point)*: The user says "depression is doing the deciding." This implies the will is *hijacked*. In never-competent, the will is *absent*. The inconsistency is treating "absent" as "recoverable."

