      *   Analyze the "Depression" case: This relies on a "True Self" theory.
      *   Are they consistent? They share a commitment to the *Authentic Self*, but apply it differently (recovering vs. protecting).
      *   If we drop it: Surrogates become benevolent dictators (Best Interests).
