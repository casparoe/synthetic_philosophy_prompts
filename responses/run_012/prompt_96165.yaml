answer: |-
  You have put your finger on the central tension in modern bioethics and guardianship law. The "magic trick" you describe is widely acknowledged by legal scholars and ethicists, yet it persists because it serves a crucial social function: it preserves the *rhetoric of autonomy* even when autonomy is impossible.

  Here is an analysis of what these practices presuppose about the will, where the inconsistencies lie, and what would happen if we abandoned the metaphysical fiction.

  ### 1. The Metaphysical Commitment: The "Deep Self"
  The cluster of practices you describe presupposes a **Realist view of the Will**. It assumes that a person's "will" is not just a series of discrete, time-bound choices, but a persistent, metaphysical entity—a "Deep Self"—that exists independently of its immediate expression.

  *   **In the Formerly-Competent:** The law assumes this Deep Self persists through dementia or coma. The surrogate's job is archaeology: digging through the debris of the present to find the artifact of the past self.
  *   **In the Never-Competent:** The law assumes this Deep Self *would have existed* under counterfactual conditions. It posits a "reasonable person" or a "hypothetical competent version" of this specific individual. This is the magic trick: it treats a counterfactual construction as a *discovery* rather than an *invention*.
  *   **In the Depressed Patient:** The law assumes the Deep Self can be *obscured* by pathology. The refusal is treated as "noise" interfering with the "signal" of the true will.

  **Is it a fact or a procedure?**
  Philosophically, it is almost certainly a **procedural rule masquerading as a fact**. There is no ontological fact about what a never-competent person "would want." However, the law *must* treat it as a fact to maintain the moral hierarchy where **Autonomy > Beneficence**. If the law admitted, "We are guessing," it would have to admit it is making a *best interests* decision. By framing it as *substituted judgment*, the surrogate is absolved of the moral burden of playing God; they are merely the "voice" of the patient.

  ### 2. Internal Consistency: The Depression vs. Never-Competent Paradox
  You asked if the system is internally consistent. **Strictly speaking, it is not.**

  *   **The Depression Case:** We discount the *actual, expressed choice* because we believe it does not align with the *idealized will*. (Actual < Idealized).
  *   **The Never-Competent Case:** We elevate a *counterfactual, non-existent choice* to override the default of preservation of life or status quo. (Idealized > Actual/None).

  **The Unifying Principle (The "Patch"):**
  The system tries to glue this together with the concept of **Authenticity**.
  *   In depression, the choice is deemed *inauthentic* (alien to the self).
  *   In never-competence, the surrogate is tasked with constructing an *authentic* narrative for a self that cannot speak.

  The inconsistency arises because in the depression case, we claim to know the *real* will better than the patient does (paternalism regarding the will). In the never-competent case, we claim to know the *hypothetical* will better than the objective "best interest" standard would dictate (autonomy regarding the hypothetical).

  The never-competent case is doing something the depression case forbids: **It is imputing a specific preference where none exists, whereas in depression we are negating a specific preference that does exist.** This is a logical asymmetry. In depression, we say, "You don't really want that." In never-competence, we say, "You really would want this," despite no evidence.

  ### 3. What Parts Require the Idealized Will?
  *   **Strictly Requires Idealization:** The **Substituted Judgment Standard (SJS)**. You cannot apply SJS to a never-competent patient without idealization. If you drop the idea that there is a "fact of the matter" about their hypothetical wishes, SJS collapses into Best Interests.
  *   **Does Not Require Idealization:** The **Best Interests Standard (BIS)**. This relies on objective goods (pain reduction, longevity, dignity). It does not care about the "will," only the welfare.
  *   **The Hybrid:** Most statutes are hybrids. They say "Use Substituted Judgment if known; otherwise Best Interests." The magic trick happens when courts claim to use Substituted Judgment for never-competent patients by inferring wishes from "values" the patient never held, effectively smuggling Best Interests in through the back door of Substituted Judgment.

  ### 4. Concrete Consequences of Dropping the Idealized Will
  If we admitted that preferences only exist when actually had (a **Constructivist** or **Empiricist** view of the will), here is what changes at the bedside:

  1.  **Shift in Surrogate Role:** Surrogates for never-competent patients would officially become **Guardians** (fiduciaries) rather than **Proxies** (mouthpieces). They would no longer say, "She would want this." They would say, "This is the best course for her, given she cannot choose."
  2.  **Reduction of Surrogate Guilt:** Family members often suffer trauma trying to "guess" what a loved one would want. Acknowledging there is no right answer relieves the burden of metaphysical accuracy.
  3.  **Harder to Withhold Life-Sustaining Treatment:** In many jurisdictions, SJS allows for withdrawing treatment based on "quality of life" judgments attributed to the patient. BIS is often stricter, requiring a showing that treatment is *burdensome* to the patient, not just that the patient "wouldn't want it." Without the idealized will, the presumption shifts toward preservation of life unless harm is proven.
  4.  **Depression Cases Become Harder:** If we drop the "true will" metaphysics, overriding a depressed patient becomes purely paternalistic. We would have to admit, "We know what is good for you better than you do," rather than, "We know what *you* want better than you do." This makes the intervention ethically "louder" and legally riskier.

  ### 5. The Limit of Idealization: Why Not Society?
  You asked: *If idealization is legitimate for one person, what's the argument against extending it to a family, community, or society?*

  This is the danger of the **Rousseauian "General Will."**

  *   **The Boundary of the Body:** The individual body is the only locus where "harm" and "benefit" are non-transferable. I feel my pain; you do not. Therefore, my "idealized will" is constrained by my biological reality.
  *   **The Totalitarian Risk:** If we say the State can determine the "idealized will" of a citizen ("You would want to work for the collective good if you were thinking clearly"), we erase the boundary between the person and the polity.
  *   **Epistemic Humility:** We accept the fiction of the individual idealized will because the surrogate is usually a loved one with intimate knowledge. Extending this to a community introduces a **bureaucratic interpreter**. When a court decides what a "reasonable person" would want, it is already a mild form of social idealization. But extending it to a "community will" allows the majority to impose their "idealized preferences" on the minority.

  **The Argument Against Extension:**
  The individual idealized will is a **protective fiction** designed to shield the individual from the state. Extending it to the state or community turns it into an **oppressive fiction** designed to shield the state from the individual. The logic is the same (knowing what you *really* want better than you do), but the power dynamic is inverted.

  ### Summary
  The system presupposes that **Autonomy is a status, not an act.** It treats the *right to decide* as a property that sticks to the person even when the *ability to decide* is gone.

  *   **Is it consistent?** No. It wavers between protecting the *past self* (formerly competent), inventing a *hypothetical self* (never competent), and rescuing the *true self* (depression).
  *   **Is it a fact?** No, it is a legal fiction required to keep Autonomy as the supreme value.
  *   **What if we drop it?** We move toward a system of Benevolent Paternalism. Surrogates become decision-makers, not mouthpieces. We gain honesty but lose the powerful moral shield of "It's what they wanted."

  The "magic trick" persists because the alternative—admitting that for the never-competent, we are simply making value judgments *for* them—forces us to confront the uncomfortable reality that some lives are governed by the values of others, not their own. The law prefers the fiction because it preserves the dignity of the patient, even if it compromises the logical integrity of the statute.
