prompt: |-
  Something about guardianship and medical decision-making has always bothered me, and I want to know what the rules are actually assuming. When an adult loses the ability to decide for themselves, the instruction to whoever decides for them is usually not do what's best for them, it's do what they would have wanted -- reconstruct their choice, don't make your own. Fine. But in a lot of places that same instruction is written to cover people who never had capacity at any point in their life: someone with a profound intellectual disability from birth, a child who will never be competent, a patient who's been unresponsive since an accident at nineteen. There's no earlier choice to recover. The surrogate is still supposed to ask what the person would have wanted, and is explicitly told not to substitute their own values -- and courts have authorized real, irreversible things on exactly that basis, which is where it starts to feel like a magic trick. Meanwhile the same hospital, sometimes the same statute, falls back on best interests for the very same kind of patient, and best interests is a seperate question: what's good for them, not what they want. And then the case that really gets me: a competent adult refuses a life-saving treatment while severely depressed, and we override the refusal on the grounds that it isn't really their decision, that the depression is doing the deciding. Take that seriously and you've said there's a gap between what someone actually chooses and what they really want.

  So what does this cluster of practices presuppose about a person's will? Is it committed to there being a fact of the matter about what someone would want if they were thinking clearly -- a fact that could hold even for someone who has never wanted anything -- or could the whole thing run on something thinner, like a procedural rule (follow the last explicit statement, and where there isn't one, use best interests) that never needs an idealized will at all? Which parts of the practice strictly require the idealized-will picture and which parts merely happen to fit it? Is it internally consistent, or is the never-competent case doing something the depression case forbids, since there we discount the actual choice and here we elevate a counterfactual one? And if you gave up on the idea that there's a fact about what someone would want under ideal conditions -- if preferences only existed when they were actually had -- what would concretely change: who decides, what the surrogate is told to do, what counts as a good reason at the bedside? Last thing, if the idealization is legitimate for one person, whats the argument against extending it to a family, or a community, or a whole society's idealized will?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Issue:** The tension between "substituted judgment" (what the patient *would have wanted*) and "best interests" (what is *good* for the patient) in medical decision-making, especially regarding patients who never had capacity (never-competent) vs. those who lost capacity (formerly-competent) vs. those with impaired capacity (depression).
      *   **Key Observations/Paradoxes:**
          1.  *Never-Competent:* Surrogates are told to use "substituted judgment" (what they would want), but there is no prior self to reconstruct. This feels like a "magic trick."
          2.  *Inconsistency:* Statutes/courts sometimes switch to "best interests" for the same patients, acknowledging the impossibility of substituted judgment.
          3.  *Depression Case:* A competent adult refusing treatment due to depression is overridden because the decision isn't "truly theirs." This implies a gap between *actual choice* and *real will*.
          4.  *The Philosophical Question:* What does this presuppose about the nature of a "will"? Is there a metaphysical fact about an idealized will, or is it just a procedural heuristic?
          5.  *Internal Consistency:* Is the system consistent? (Discounting actual choice in depression vs. elevating counterfactual choice in never-competent).
          6.  *Consequences:* If we drop the "idealized will" concept, what changes concretely?
          7.  *Scope:* If idealization works for individuals, why not families/communities/societies?

  2.  **Initial Analysis & Philosophical Framing:**

      *   The user is identifying a deep philosophical tension in bioethics and law: *Autonomy vs. Beneficence* mapped onto *Actual Will vs. Idealized Will*.
      *   The "Substituted Judgment Standard" (SJS) is legally dominant in many US jurisdictions but philosophically fraught for the never-competent.
      *   The "Best Interests Standard" (BIS) is the fallback but is often seen as paternalistic.
      *   The depression case touches on *competency* and *authenticity* (is this desire *mine*?).
      *   The user is essentially asking for a meta-ethical and legal analysis of the concept of "will" in surrogate decision-making.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth and acuity of the observation. Validate that this is a known "dirty secret" in bioethics.
      *   **Part 1: The Metaphysics of the Will (Fact vs. Fiction):**
          *   Address the "fact of the matter" question. Does an idealized will exist?
          *   *Realist view:* There is a deep self that persists.
          *   *Constructivist/Procedural view:* It's a legal fiction to protect autonomy values.
          *   *Conclusion:* The law *acts* as if there is a fact, but practically it's often a construction.
      *   **Part 2: The Never-Competent Paradox:**
          *   Why does the law insist on SJS for them? To maintain the *rhetoric* of autonomy. It treats the surrogate as an "oral proxy" rather than a guardian.
          *   Is it consistent? No. It's a category error. The "magic trick" is pretending a non-existent past self exists.
          *   *Correction:* Many jurisdictions *do* shift to Best Interests for never-competent adults (e.g., *Superintendent of Belchertown State School v. Saikewicz* hints at this, though later cases like *Cruzan* emphasize clear evidence).
      *   **Part 3: The Depression Case (Authenticity):**
          *   Why override? Because depression is seen as a *pathology of the will*, not an expression of it.
          *   Connection to Never-Competent: In depression, we discount the *actual* to find the *ideal*. In never-competent, we invent the *ideal* because there is no *actual*.
          *   Consistency Check: It *is* inconsistent if viewed strictly. But the unifying principle is "Respect for the *Authentic* Self." Depression obscures the authentic self; never-competence lacks a developed authentic self.
      *   **Part 4: What if we drop the Idealized Will? (Concrete Changes):**
          *   Shift to Pure Best Interests for never-competent.
          *   Surrogates become *guardians* (fiduciaries) rather than *proxies*.
          *   Depression cases might become harder to override (slippery slope to paternalism).
          *   Less guilt for surrogates (they aren't "guessing" a ghost).
      *   **Part 5: The Expansion Problem (Family/Society):**
          *   Why stop at the individual? Liberal political theory (Rawls, Mill) prioritizes individual sovereignty.
          *   Extending idealization to society risks totalitarianism (the State knows what you *really* want better than you).
          *   The "boundary of the self" is the hard stop.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Nuance on Law:* I need to be careful not to say *all* places use SJS for never-competent. Many use a hybrid or switch to BIS. The user notes "in a lot of places," so I should validate that observation while noting the variation.
      *   *Nuance on Depression:* Distinguish between *competence* (legal/clinical assessment) and *autonomy* (philosophical). The depression override is usually a competence determination, but the user frames it as a "will" issue. I should address the "authenticity" angle.
      *   *The "Magic Trick":* Use this metaphor. It's a *legal fiction*.
      *   *Philosophers to reference (implicitly or explicitly):* Dworkin (Critical Interests vs. Experiential Interests), Frankfurt (Second-order desires), Rawls (Veil of Ignorance - relevant for the society question).

  5.  **Final Polish:**

