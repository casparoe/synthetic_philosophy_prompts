      *   **Virtue Ethics Defense (Snow, Kamtekar, Miller):** The experiments don't measure *virtue* properly (virtue requires knowledge, intention, stability). Traits are modular or "local." The "if-then" profile preserves stability without requiring robotic consistency.

  3.  **Drafting - Section by Section:**

