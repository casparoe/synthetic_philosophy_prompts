          4.  Construct *Case B* (Invented/Mirror): The ranking is epistemically indefensible, but refusing to make it is pragmatically/ethically wrong.
          5.  For each case, specify: What is ranked, unit of comparison, who is harmed, objection to ordering vs. likening, standing to rank (survivor/historian/official).
