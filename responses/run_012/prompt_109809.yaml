answer: |-
  **Brainstorm: What is meant by "Ranking Atrocities is Wrong"?**

  When people object to ranking atrocities, they are rarely making a single claim. Often, they mean:
  1.  **Metaphysical:** Suffering is qualitative, not quantitative; there is no common currency (like "utils of pain") to measure distinct horrors against one another.
  2.  **Moral:** To rank is to imply that the lower-ranked victims deserve less grief, justice, or remembrance.
  3.  **Political:** Rankings are weapons used by states to deflect criticism ("You did X, but we suffered Y").
  4.  **Psychological:** It forces survivors into a competition for the status of "ultimate victim," corrupting the mourning process.
  5.  **Epistemic:** The data is too fragmented to support a precise hierarchy, so any ranking is speculation masquerading as fact.
  6.  **Sacralization:** Certain events are "holy" or "sui generis," and placing them on a scale profanes their unique significance.

  **The Conceptual Issue: Epistemic vs. Pragmatic Grounds**

  The tension arises when we separate the claim that a ranking is *false* (Epistemic) from the claim that it is *harmful* (Pragmatic). The epistemic objection asserts that because there is no common measure, the statement "Atrocity A is worse than Atrocity B" is truth-apt but false, or perhaps meaningless. The pragmatic objection concedes that the statement might be true (or at least well-grounded) but argues that uttering it performs a harmful speech act: it licenses moral complacency regarding the "lesser" crime, reduces human suffering to ledger entries, or provides rhetorical ammunition for denialists.

  The conceptual problem is that ordinary condemnations conflate these grounds to create a stronger shield. However, they pull in opposite directions. If the epistemic claim is primary ("You cannot compare"), then discovering a valid metric should dissolve the objection. If the pragmatic claim is primary ("You should not compare"), then the existence of a metric is irrelevant; the prohibition remains. Furthermore, the epistemic claim suffers from a performative contradiction: to assert that "A is incomparable to B" is to place A and B in a specific logical relation (non-comparability). This is itself a second-order comparison. It asserts that the distance between them is infinite or categorical, which is a claim about their relative standing. Thus, the epistemic shield is porous; it relies on the pragmatic fear of what happens if we treat them as comparable.

  **Case A: The Defensible Ranking, The Wrong Publication**

  **The Body:** The Interim Reparations Directorate (IRD), a transitional body mandated to distribute limited housing funds to displaced populations following the "Kaelo Conflict."
  **The Decision-Maker:** Director Julian Vane, a demographer and legal scholar.
  **The Task:** The IRD must prioritize two regions for reconstruction: Region North (site of the "Purge of Vess") and Region South (site of the "Scorched Earth Retreat").
  **The Ranking:** Vane's team determines that the Purge of Vess involved specific intent to destroy a cultural group, while the Scorched Earth Retreat was a military strategy that disregarded civilian life but lacked genocidal intent. Using a unit of comparison defined as "Violation of Specific International Conventions," the IRD ranks the North as having suffered a "Grade 1 Harm" and the South as "Grade 2."
  **Epistemic Status:** Defensible. The archival evidence supports the distinction in intent and legal classification. The ranking is factually accurate regarding the nature of the violence.
  **Pragmatic Status:** Wrong to Publish. Upon leak, the report causes riots in the South. Residents feel their dead are being deemed "cheaper." The perpetrator regime in the South uses the "Grade 2" classification to argue their actions were "standard warfare," not crimes against humanity, leveraging the ranking to minimize sentencing in ongoing trials.
  **Harm:** The residents of Region South suffer dignitary harm (their grief is hierarchically demoted). The legal process is harmed (the ranking becomes an exculpatory tool).
  **Ordering vs. Likening:** The objection is to the *ordering*. Likening is accepted; both groups are acknowledged as victims entitled to aid. The hierarchy creates the friction.
  **Standing:** The standing matters critically. A historian publishing this analysis in a journal is permissible; they seek truth. Director Vane, however, holds a fiduciary duty of equal care to all citizens under the transitional mandate. By ranking, he violates the political requirement to treat all victims as equal claimants on the state's conscience, even if their suffering was historically distinct. The official's role transforms an epistemic truth into a political injury.

  **Case B: The Indefensible Refusal, The Wrong Silence**

  **The Body:** The Commission on Wartime Liability (CWL), tasked with assigning financial reparations to families of the "Ten-Year Insurgency."
  **The Decision-Maker:** Chairwoman Sarah Omondi, a human rights lawyer.
  **The Task:** Two factions, the "Azure Front" and the "Crimson Guard," both committed massacres. Families of the Azure victims demand reparations proportional to the scale of the massacre to fund orphanages.
  **The Ranking:** Omondi refuses to estimate death tolls or rank the severity of the factions' actions. She issues a statement declaring all loss of life "equally infinite and incomparable," refusing to distinguish between the Azure massacre (4,000 documented deaths) and the Crimson skirmishes (400 documented deaths).
  **Epistemic Status:** Indefensible. Forensic records exist. The distinction in scale is empirically verifiable. The claim of incomparability is false; the unit of comparison (human life lost) is common and counted.
  **Pragmatic Status:** Wrong to Refuse. The Crimson Guard uses the "incomparability" doctrine to demand equal representation in the new government, claiming moral equivalence with the Azure victims. The Azure families are denied the resources needed for the orphanages because the fund is split 50/50 based on "equal tragedy."
  **Harm:** The Azure families suffer material harm (loss of funding) and narrative harm (their specific scale of loss is erased). The truth is harmed.
  **Ordering vs. Likening:** The objection is to the *likening*. By refusing to order, Omondi forces a false equivalence. She treats distinct magnitudes as identical.
  **Standing:** Here, the official *must* rank. A survivor might choose to view all death as equally tragic for the sake of personal peace. A judge or administrator, however, operates in the realm of distributive justice. Their standing requires them to make distinctions to allocate finite resources fairly. Refusing to rank is an abdication of the specific duty attached to their office.

  **Synthesis and Conclusion**

  Can the epistemic and pragmatic grounds be held together? Only uneasily. In both cases above, the **pragmatic ground does the real work**. In Case A, the ranking was epistemically sound but pragmatically disastrous. In Case B, the refusal was epistemically unsound but pragmatically motivated (perhaps by a desire for unity), yet ultimately failed pragmatically by causing injustice. The epistemic claim ("it is impossible to compare") is often a convenient fiction used to shore up the pragmatic prohibition ("it is dangerous to compare").

  I would drop the epistemic ground entirely if presented with a case where a ranking is **metaphysically precise and causes no discernible harm**. If we could rank two historical atrocities with perfect data, in a context where no victims remain to be hurt, no denialists exist to exploit the data, and no resources are being allocated based on the rank, yet we still felt a moral revulsion at the act of ranking itself, then the epistemic/metaphysical objection would have to stand alone. However, I suspect such a case is impossible to construct; the revulsion usually stems from a imagined audience or a potential consequence. Thus, the prohibition is almost entirely pragmatic.

  The feature of the problem my examples cannot capture is the **diachronic shift in memory**. My cases are static; they occur at a specific moment of decision. They do not account for how a ranking made today might be harmless now but become toxic fifty years later as political contexts shift, or conversely, how a silence maintained today might prevent the formation of a historical record needed by future generations. The ethics of ranking changes as the witnesses die and the event transitions from memory to history.
