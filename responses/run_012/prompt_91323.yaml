      *   *Actually, looking closer at Step (4):* Step (4) says "since each observation is a single positive instance... they confirm to the same degree." This assumes confirmation is a function of *counting instances* rather than *reducing uncertainty*. This is the core error.
      *   *Is Step (2) valid?* "A white shoe... confirms 'All non-black things are non-ravens'." Under Nicod, yes. Under Bayesianism, yes (usually).
