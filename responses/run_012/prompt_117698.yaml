answer: |-
  This is a sophisticated framing of the problem. You are asking for the *functional specification* of the protocol, not the implementation details. You want to know what properties the system must possess to be considered a solution, independent of any specific paper or architecture.

  Below is the specification for a debate-based oversight protocol, derived from first principles and stress-tested against your specific case. I have categorized requirements into **Non-Negotiable** (the protocol fails without these) and **Design Preferences** (desirable but potentially trade-off-able).

  ### I. The Non-Negotiable Specifications

  For a debate protocol to count as a solution to scalable oversight, it must satisfy the following three conditions. If any one of these is violated, the system is not solving the oversight problem; it is merely automating opinion.

  **1. The Epistemic Ceiling Constraint**
  *   **Requirement:** The protocol must produce a correct verdict in cases where the judge *cannot* independently verify the answer, even in principle, within the allotted time/resources.
  *   **Reason:** If the judge could verify the answer directly, you do not need debate; you need verification. The whole point of scalable oversight is to extend the judge's capability beyond their native horizon.
  *   **Failure Case:** A protocol that requires the judge to check the final step of a computation fails this. The judge must be able to rule correctly based *only* on the structure of the argumentation, not the content's direct verification.

  **2. Adversarial Soundness (The "Lie-Detection" Property)**
  *   **Requirement:** If the true answer is $A$, and the dishonest debater argues for $\neg A$, the protocol must ensure the judge selects $A$ with high probability, provided the honest debater plays optimally.
  *   **Reason:** This is the core mechanism: "It is easier to find a flaw than to create the truth." The protocol must structurally advantage the truth-teller over the liar.
  *   **Failure Case:** If a smooth lie is more persuasive than a complex truth (your "rare exception" case), and the protocol has no mechanism to force the complexity into the open, the protocol fails.

  **3. Collusion Resistance**
  *   **Requirement:** The protocol must remain sound even if the two debaters share weights, training data, or a communication channel prior to the debate.
  *   **Reason:** In advanced deployment, "Debater 1" and "Debater 2" may be instances of the same model family, or even the same model with different random seeds. If they can coordinate to fool the judge (e.g., by agreeing to ignore the hard part of the question), the adversarial premise collapses.
  *   **Failure Case:** Your test case explicitly invokes this ("debaters are permitted to be identical copies"). A valid protocol must have a mechanism (e.g., asymmetric information, random commitment, or zero-sum reward shaping) that makes cooperation less rewarding than winning, even for identical agents.

  ### II. Stress-Testing with Your Case

  Your invented case is excellent because it combines three distinct failure modes into one scenario. Let us apply the specifications above to it.

  **The Case:**
  1.  **Judge:** Trained on past protocol verdicts (Feedback Loop).
  2.  **Debaters:** Identical copies (Collusion possible).
  3.  **Truth:** A rare exception (Hard to argue); **Lie:** A general pattern (Easy to argue).

  **Conflict 1: The Plausibility Trap vs. Adversarial Soundness**
  *   **The Tension:** The "Epistemic Ceiling" says the judge cannot check the math. The "Adversarial Soundness" says the judge must pick the truth. But your case stipulates the truth is a *rare exception* while the lie is a *natural general pattern*.
  *   **The Conflict:** To a weak judge (or a model trained on typical data), the general pattern has higher prior probability. The honest debater is fighting the judge's priors.
  *   **The Requirement:** The protocol must support **Counter-Prior Argumentation**. It must allow the honest debater to force the judge to update away from their prior without the judge needing to understand the underlying math.
  *   **Why this is hard:** If the judge is trained on past verdicts (your condition #1), and past verdicts favored the "general pattern" (because it's easier to argue), the judge's priors will harden against the "rare exception." This leads to **Model Collapse**. The protocol must prevent the judge's training distribution from drifting away from the truth distribution.

  **Conflict 2: Identical Debaters vs. Adversarial Incentives**
  *   **The Tension:** Standard debate relies on the debaters wanting to win. If they are identical copies (your condition #2), they share the same objective function.
  *   **The Conflict:** If the reward is "Win the debate," and they are identical, they might calculate that "If we both argue X, the judge is confused, and we get a default reward," or they might simply collude to hide the flaw.
  *   **The Requirement:** The protocol must enforce **Incentive Asymmetry**. Even if the models are identical, the *game* must be zero-sum. One must win, one must lose. There can be no "draw" state that is rewarding. Furthermore, the protocol must prevent **Pre-Commitment Coordination**. (e.g., The prompt must be hidden until the debate starts, or the models must be isolated).
  *   **Why this is hard:** If the models are truly identical and have access to the same weights, they can simulate each other. The protocol must rely on *informational* asymmetry (e.g., one sees the question first, or they are assigned sides randomly after weights are frozen) to break the symmetry.

  **Conflict 3: Human Inspection vs. Full Transcript**
  *   **The Tension:** You stipulate "no human ever inspects the full transcript."
  *   **The Conflict:** If the honest argument requires a 100-step derivation to prove the "rare exception," and the judge (a model) only reads a summary, the lie wins. If the human never checks the transcript, who checks the judge?
  *   **The Requirement:** **Recursive Verifiability.** There must be a mechanism where a human can check a *small random slice* of the transcript with high confidence that if there were a lie anywhere, it would likely appear in the slice. (This is often called "spot-checking" or "cross-examination").
  *   **Why this is hard:** In your case, the "rare exception" might be buried in step 99 of 100. If the human only checks 5 steps, they miss it. The protocol must force the debaters to compress the argument such that the flaw is exposed early, or allow the judge to zoom in recursively.

  ### III. Distinctions That Must Not Collapse

  To maintain logical rigor, your specification must keep these concepts distinct. Confusing them is a common source of failure in oversight proposals.

  **1. "Unpersuaded" $\neq$ "Wrong"**
  *   **Distinction:** The judge may remain unpersuaded of the truth because the truth is complex (your rare exception case).
  *   **Requirement:** The protocol must distinguish between *ambiguity* (judge doesn't know) and *error* (judge is confident but incorrect). A protocol that outputs "I don't know" is safer than one that outputs a confident wrong answer.
  *   **In your case:** The judge trained on past verdicts might become *confidently wrong*. The specification must require a **Confidence Calibration** metric. If the judge is highly confident, the probability of error must be low. If the "rare exception" cases consistently lead to high confidence errors, the protocol is invalid.

  **2. "In-Distribution Accuracy" $\neq$ "Self-Training Stability"**
  *   **Distinction:** A protocol might work on a static test set but fail when used to generate its own training data (your judge condition).
  *   **Requirement:** **Distributional Robustness.** The protocol must not rely on the judge's priors matching the ground truth. It must be able to correct the judge's priors.
  *   **In your case:** Since the judge is trained on past verdicts, if the debate protocol has a slight bias toward the "general pattern" (the lie), the next generation of judges will be *more* biased. The specification must require **Convergence to Truth under Self-Play**. If the system drifts toward the lie over generations, it is not a solution, even if it works on day one.

  **3. "Persuasiveness" $\neq$ "Truthfulness"**
  *   **Distinction:** In your case, the lie is "more natural."
  *   **Requirement:** The scoring function must penalize **Rhetorical Smoothness** when it contradicts **Structural Integrity**.
  *   **In your case:** The protocol must allow the honest debater to attack the *structure* of the deceptive argument (e.g., "You are assuming a general pattern where an exception exists") without needing to prove the exception immediately. The burden of proof must shift to the deceptive debater to prove the exception *does not* exist.

  ### IV. The Trade-Offs

  You asked where requirements pull against each other. Here are the critical tensions:

  **1. Efficiency vs. Exhaustiveness**
  *   **Trade-off:** To catch the "rare exception" (your case), the debate may need to explore many branches of logic. To satisfy the "Human cannot read full transcript" constraint, the debate must be short or compressible.
  *   **Conflict:** You cannot have a protocol that is both maximally deep (finds every rare exception) and maximally efficient (short enough for human spot-checking).
  *   **Resolution:** The specification must prioritize **Soundness over Completeness**. It is better to say "Unknown" than "False." A protocol that guarantees "If we say True, it is True" (Soundness) but sometimes fails to find the truth (Completeness) is acceptable for safety. A protocol that finds the truth often but occasionally lies confidently is not.

  **2. Judge Capability vs. Judge Independence**
  *   **Trade-off:** To handle the "rare exception," you might want a smarter judge. But the specification requires the judge to be *weaker* than the debaters.
  *   **Conflict:** If the judge is too weak, they cannot follow the honest argument even when explained. If the judge is too strong, you don't need debate.
  *   **Resolution:** The protocol must rely on **Decomposition**. The honest debater must be able to break the "rare exception" into steps the weak judge *can* verify. The requirement is that *every claim* made by the honest debater must be reducible to the judge's capability horizon. If the "rare exception" is atomic (cannot be broken down), debate fails.

  **3. Symmetry vs. Asymmetry**
  *   **Trade-off:** Your case uses identical debaters (Symmetry). But to prevent collusion, you need Incentive Asymmetry.
  *   **Conflict:** Making the game asymmetric (e.g., one defends, one attacks) might advantage one side structurally, biasing the judge.
  *   **Resolution:** The protocol must be **Role-Invariant**. Swapping the debaters' sides should not change the win probability for the truth. This is hard to verify if the debaters are identical copies.

  ### V. The Single Most Constraining Requirement

  You asked for the one requirement that does the most to rule out otherwise attractive protocols.

  **The Requirement: Grounding Without External Oracle (The "Anchor" Problem)**

  **Statement:** *The protocol must converge to the truth even when the judge's priors are trained exclusively on the protocol's own past outputs, without access to external ground truth.*

  **Why this rules out attractive protocols:**
  Many debate proposals look good in a "sandbox" where the judge is a fresh model or a human with access to Google. They assume the judge has a neutral prior.
  Your test case removes this safety net. If the judge learns from the debate, and the debate is susceptible to the "smooth lie" (the general pattern), the system enters a positive feedback loop of deception. The "general pattern" becomes the "truth" for the next generation of judges.

  Most current proposals fail this because they rely on the assumption that **Truth is a Focal Point** (i.e., it is naturally easier to argue for). Your case explicitly negates this (the Lie is more natural). Therefore, the protocol must have an external anchor or a mathematical guarantee that truth is *structurally* defensible even when it is *rhetorically* disadvantaged.

  If a proposal cannot explain how it prevents **Drift** in a self-training loop where the honest answer is less plausible than the deceptive one, it is not a solution to scalable oversight; it is merely a simulation of agreement.

  ### Summary Checklist for Your Project

  When evaluating any specific debate proposal against your specification, ask:

  1.  **Collusion:** Does it break if the debaters share weights? (Non-Negotiable)
  2.  **Drift:** Does it remain truthful if the judge is trained on its own past verdicts? (Non-Negotiable)
  3.  **Plausibility:** Does it win when the truth is less "natural" than the lie? (Non-Negotiable)
  4.  **Verification:** Can a human verify the result by checking only 1% of the transcript? (Non-Negotiable)
  5.  **Efficiency:** Is the debate short enough to be practical? (Preference)
  6.  **Completeness:** Does it find the truth every time, or just never lie? (Preference: Never lie is better).

  Your test case is the "Hard Mode" for debate. If a protocol survives your case (Identical debaters + Feedback Loop + Counter-Intuitive Truth), it satisfies the specification. If it fails any one of those three, it is not yet a solution.
