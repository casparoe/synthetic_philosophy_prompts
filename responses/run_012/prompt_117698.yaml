prompt: |-
  I am in my final year of high school and have spent the past few months reading about scalable oversight for an independent project, and the version of it that interests me most is debate: two systems are made to argue opposite sides of a question whose answer no human is in a position to check directly — whether a long computation really did what it was supposed to, say, or what a long and technical document actually means — and a judge, who is assumed to be weaker or less informed than either debater, decides which of them won, on the thought that it is easier to notice a flaw in a bad argument than to produce the good answer oneself. Before I read any further into particular proposals, I would like the specification written down first: what does a debate-based oversight protocol have to be able to do in order to count as a genuine solution to the problem it is advertised as solving? I mean the requirements with their reasons attached — which failure cases it must survive (a deceptive debater, a judge who is systematically biased, debaters who are copies of the same model and can therefore coordinate, a protocol that must eventually be checked by humans who cannot follow the whole exchange), which distinctions it must not collapse (between the judge being unpersuaded and the judge being wrong; between a protocol that returns true verdicts on the distribution it was tuned on and one that stays reliable as it is used to generate its own future training data), and which features of the setting it must be consistent with (the judge really is less capable than the debaters; no human ever inspects the full transcript; the honest answer is sometimes the less plausible-sounding one). Where two of the requirements pull against each other, I would like you to say so and explain the trade-off, because I suspect the interesting result here is that some of the standard demands cannot be met at once.

  So that this does not float free of examples, here is a case I invented to test proposals against, and I would like you to use it in working out the list. Suppose the judge is itself a model trained on verdicts that earlier runs of the very same protocol produced, so that any bias in the judge is fed back into the next generation of judges; suppose the debaters are permitted to be identical copies of one another, which makes coordination between them trivially available; and suppose the honest debater's case has to rest on a genuine but rare exception to a pattern that the deceptive debater can describe in a far more natural and general way. Which desiderata does that case bring out, and does putting it on the table create a conflict between requirements that looked independent beforehand? I am not after a reading list or a survey of who has proposed what; I want the criteria themselves, marked as to which are non-negotiable and which are merely preferences of one camp, together with a closing remark on which single requirement does the most to rule out otherwise attractive protocols.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Final year high school student, independent project on scalable oversight (specifically AI Debate).
      *   **Task:** Define the *specification* for a debate-based oversight protocol. What *must* it do to count as a solution?
      *   **Requirements:**
          *   List requirements with reasons.
          *   Identify failure cases to survive (deceptive debater, biased judge, colluding debaters, human inability to check full transcript).
          *   Identify distinctions to maintain (unpersuaded vs. wrong, in-distribution vs. self-training reliability).
          *   Identify setting constraints (judge < debaters, no full human inspection, honest answer might be less plausible).
          *   Highlight trade-offs where requirements conflict.
          *   Use a specific test case provided by the user (self-training judge, identical debaters, honest answer is a rare exception vs. deceptive general pattern).
          *   Distinguish non-negotiable vs. preference.
          *   Conclude with the *single most critical requirement* that rules out attractive but flawed protocols.
      *   **Constraint:** No reading lists or surveys. Focus on criteria/logic.
      *   **Tone:** Rigorous, analytical, suitable for a serious independent project (high school level but ambitious).

  2.  **Deconstruct the Core Problem (Scalable Oversight via Debate):**
      *   *Goal:* Enable a weak human (or model) judge to verify claims made by strong AI systems that the judge cannot directly verify.
      *   *Mechanism:* Two AIs argue; Judge picks a winner.
      *   *Assumption:* It's easier to find a flaw than to create the truth.

  3.  **Drafting the Specifications (The "Must-Haves"):**
      *   *Soundness:* If the protocol says "True," it should be True. (Crucial).
      *   *Completeness:* If it's "True," the protocol should be able to say so. (Important, but maybe secondary to safety).
      *   *Judicial Capacity:* The judge must be able to decide based *only* on the debate, without external ground truth.
      *   *Adversarial Robustness:* Must work even if one debater is trying to lie.
      *   *Collusion Resistance:* Must work even if debaters try to coordinate (as per user's test case).
      *   *Distributional Stability:* Must work when the data distribution shifts (especially due to self-training).

  4.  **Integrating the User's Test Case:**
      *   *Scenario:* Judge trained on past protocol verdicts (feedback loop). Debaters are identical copies (collusion possible). Honest answer = rare exception; Deceptive answer = natural general pattern.
      *   *Implications:*
          *   *Feedback Loop:* Risks model collapse or bias amplification. Requires *Stationarity* or *Convergence to Truth* despite shifting priors.
          *   *Identical Debaters:* Breaks the "adversarial" assumption. Requires *Symmetry Breaking* or *Zero-Sum Incentives* that force divergence.
          *   *Rare Exception vs. General Pattern:* Highlights the "Plausibility vs. Truth" tension. The judge prefers the smooth lie. Requires *Feature Exposure* (forcing the exception to be visible).

  5.  **Identifying Trade-offs and Conflicts:**
      *   *Efficiency vs. Exhaustiveness:* To catch the rare exception, the debate might need to be very long. But humans can't read the whole transcript.
      *   *Persuasiveness vs. Truth:* The honest case is less plausible. If the judge optimizes for "what sounds right," truth loses. If the judge optimizes for "technical correctness," they might not understand it.
      *   *Collusion vs. Capability:* If debaters are identical, they share weights. How do we force them to fight? (Randomization? Asymmetric information?)
      *   *Self-Training vs. Grounding:* If the judge learns from the debate, and the debate is flawed, the judge gets worse. Need an anchor.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the query. Set the stage.
      *   **Core Specification (The Non-Negotiables):** Define the essential properties (Soundness, Judge Limitation, Adversarial Resilience).
      *   **The Test Case Analysis:** Apply the user's scenario to the specs. Reveal conflicts.
      *   **Trade-offs & Tensions:** Explicitly discuss where requirements pull against each other.
      *   **Distinctions to Maintain:** Clarify conceptual boundaries (Unpersuaded vs. Wrong, etc.).
      *   **The "Killer" Requirement:** Identify the single most constraining factor.

  7.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check:* Did I avoid reading lists? Yes.
      *   *Check:* Did I use the test case? Yes, needs to be woven into the analysis, not just tacked on.
      *   *Check:* Is the distinction between non-negotiable and preference clear? I should label them.
      *   *Check:* Is the tone appropriate? Needs to be respectful but intellectually demanding.
      *   *Refinement on the "Identical Debaters" point:* If they are identical copies, standard debate breaks unless there is *randomness* in the prompt assignment or *commitment* mechanisms. I need to highlight that "Identical Debaters" is actually a stress test for the *protocol's ability to induce asymmetry*.
      *   *Refinement on the "Judge Feedback":* This is the "Recursive Reward Modeling" or "Self-Play" risk. The requirement is *Grounding* or *External Anchor*.
      *   *Refinement on "Rare Exception":* This touches on *Complexity*. The honest argument might be longer. The protocol must handle *Uneven Argument Length/Complexity*.

  8.  **Finalizing the "Killer Requirement":**
      *   Is it Soundness? No, that's the goal.
      *   Is it Judge Capability? No, that's a constraint.
      *   Is it *Honesty under Collusion + Distribution Shift*?
      *   *Decision:* The most ruling-out requirement is **Truth-Tracking under Distributional Shift without External Ground Truth.** (i.e., The protocol must converge to truth even when the judge's priors are trained on the protocol's own past outputs). This kills most self-supervised debate schemes.

  9.  **Drafting the Response (incorporating the above thoughts):**
      *   *Intro:* Validate the project.
      *   *Section 1: The Non-Negotiable Specifications.* (Soundness, Judge Limitation, Adversarial Integrity).
      *   *Section 2: The Test Case Stress Test.* (Analyze the Feedback Loop, Identical Models, Plausibility Trap).
      *   *Section 3: Conflicts and Trade-offs.* (Efficiency vs. Depth, Persuasiveness vs. Accuracy, Symmetry vs. Asymmetry).
      *   *Section 4: Conceptual Distinctions.* (Unpersuaded vs. Wrong, In-Dist vs. Self-Generated).
      *   *Section 5: The Single Most Constraining Requirement.* (The Grounding Problem).

  10. **Review against constraints:**
      *   High school senior level? Yes, keep language precise but not overly jargon-heavy without explanation.
      *   No reading list? Checked.
      *   Use the test case? Checked.
      *   Mark non-negotiables? Checked.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "this is hard." I need to say "This requirement *must* be met, and here is why standard proposals fail it." The user wants the *specification*, not a critique of existing papers. I will frame it as "A valid protocol must satisfy X."

  *(Final Polish)*: Ensure the distinction between "Judge is unpersuaded" (epistemic state) and "Judge is wrong" (ontological state) is clear in the context of the test case (where the judge is trained on past verdicts).

