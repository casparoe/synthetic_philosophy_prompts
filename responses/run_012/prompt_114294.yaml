          *   *Verdict:* Defensible as a philosophical implication, not a scientific hypothesis.
          *   *Bearing:* Supports Creationist (if science can't teach metaphysics). Irrelevant to Seminar.

      *   *Reading 5: Popper's Specific Early Claim (Historical).* Claim: Classical Darwinism lacked a mechanism of inheritance, making selection speculative.
          *   *Target:* Pre-synthesis Darwinism.
          *   *Testability:* Lacked predictive power without genetics.
