      *   *Context:* Popper was a falsificationist. He struggled with how to classify evolutionary theory.
      *   *The "Retraction":* Popper later clarified he meant the *classical* Darwinian formulation, not modern evolutionary theory, and acknowledged it *is* testable.
      *   *The Tautology:* "Survival of the fittest" often gets conflated with the unfalsifiability claim. They are related but distinct (one is about meaning, the other about empirical content).

  3.  **Drafting the Menu of Readings (Iterative Process):**

      *   *Reading 1: The Logical Tautology (Strongest/Falsest).* Claim: "Fitness" is defined by survival, so "fit survive" is analytic.
          *   *Target:* Natural Selection mechanism.
