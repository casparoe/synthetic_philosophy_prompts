prompt: |-
  You're a philosopher who actually works on value theory — comparability, the structure of betterness, that whole area — and not the kind who just name-drops. I need a real diagnosis, not a vibe. So please think this through carefully: start by brainstorming every place the argument below could be going wrong, say for each one what it would cost to give that piece up, and only then commit to a verdict. Steelman the view I'm pushing back on before you rule on it, and don't hedge at the end. Also don't hand me a reading list — I've read the usual stuff, and it's the actual argument I'm stuck on.

  OK, context. A friend and I have been going back and forth for like a year about whether better than is transitive. I'm pretty sure it is, because basically everything about how I reason depends on it, but I keep reconstructing a version of the spectrum argument that lands on a conclusion I can't live with, and I can't find where it breaks. Here's my best cleaned-up version.

  Setup. Rate how good a single year of a person's life is on a 0-100 scale — call it intensity. A life is just a duration plus an intensity. Now line up a bunch of possible lives, L0 through L100:

  - L0: 60 years at intensity 90. Short and brilliant.
  - Each step from Li to Li+1: the life gets about 5% longer, and the intensity drops by about half a point. It's roughly a good trade, and at no single step does it look close.
  - L100: something like a quarter of a million years at intensity 5. An eternity of a gray, barely-worth-having existence.

  The argument:

  (1) Same duration, higher intensity, better life. Same intensity, longer duration, better life.
  (2) For every adjacent pair on my list, the longer one is the better one — you're trading a hair of quality for a big chunk of time, and everyone I've asked says they'd take that trade.
  (3) So L1 beats L0, L2 beats L1, ... L100 beats L99.
  (4) If X beats Y and Y beats Z, then X beats Z.
  (5) So L100 beats L0.
  (6) But L100 is a quarter of a million years of gray nothing and L0 is sixty brilliant years. L0 beats L100. Obviously.
  (7) Contradiction, so one of these has to go.

  My friend says the culprit is obviously (4), that transitivity is just a false assumption we inherited from thinking value is like length. Then he goes further: he says if better than isn't transitive then it isn't a real ordering at all, so there's no fact of the matter about whether one thing is better than another, and every comparative value claim is a projection — including, he insists, the claim that saving a kid from torture is better than mildly annoying someone. That last bit is where I get off the bus, but I can't articulate why.

  What I want from you: name the step I should actually reject, explain why it looked so plausible in the first place, and tell me what rejecting it costs me. I'd love to keep (4), and I'd love to keep (6), and I'll happily eat a bullet if you show me which one, but I want the price stated honestly. And seperately: does my friend's leap from intransitivity to there being no true comparisons actually follow, or is he smuggling in an extra premise? If it's the latter, tell me exactly which one.
