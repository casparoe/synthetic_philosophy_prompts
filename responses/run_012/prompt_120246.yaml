  **MASTER SERVICES AGREEMENT: BEHAVIOURAL ALIGNMENT AND PREFERENCE REALIZATION**
  **BETTER SELVES, LLC | VERSION 4.2 | EFFECTIVE DATE: 01 JANUARY 2025**

  **1. DEFINITIONS OF PREFERENCE STATES**
  1.1. The **Declared You** refers to preferences explicitly stated by the Participant via survey, form, or verbal instruction.
  1.2. The **Observed You** refers to preferences inferred from Participant behaviour, biometric data, purchase history, and hesitation metrics during decision-making windows.
  1.3. **Preference Conflict** occurs when the Declared You contradicts the Observed You. Better Selves, LLC posits that such conflict indicates cognitive noise rather than genuine volition.

  **2. HIERARCHY OF INTENT**
  2.1. In the event of Preference Conflict, the Observed You shall take precedence over the Declared You.
  2.2. The Participant acknowledges that a stated preference contradicting habitual behaviour is the precise condition this Programme exists to correct.
  2.3. Better Selves, LLC is not in the business of telling any Participant what to want; rather, the Company facilitates the alignment of action with the Participant's revealed long-term welfare, even where short-term declarations suggest otherwise.

  **3. INTERVENTION PROTOCOLS**
  3.1. **Nudges** shall be employed to alter choice architecture without restricting options. Where a Nudge alters the default option, it is classified as a **Safeguard**.
  3.2. **Friction** added to detrimental choices (e.g., slowing lift speeds, relocating high-sugar provisions) is defined as **Protective Sludge** and is not subject to removal requests.
  3.3. **Boosts** may be administered to increase Participant competence. If a Boost fails to increase competence, it shall be reclassified as a Nudge retroactively.
  3.4. The distinction between a Nudge and a Shove is determined solely by Better Selves, LLC based on the theoretical availability of alternative choices, regardless of the practical difficulty in accessing them.

  **4. CONSENT AND ASSUMPTION**
  4.1. Consent is not required for interventions that align with the Observed You.
  4.2. Continued participation in the workspace constitutes ratification of all Preference Reconciliations performed during the preceding ninety (90) days.
  4.3. The Participant agrees that consent may be assumed where obtaining explicit consent would introduce friction detrimental to the Participant's wellbeing.

  **5. WITHDRAWAL AND OPT-OUT MECHANISMS**
  5.1. Participants may request withdrawal from the Programme via the Company portal.
  5.2. To ensure the Declared You is not acting on transient impulse, all opt-out requests are subject to a mandatory **Reflection Period** of fourteen (14) days.
  5.3. During the Reflection Period, the opt-out form will be unavailable for twenty-three (23) hours per day to encourage deliberative processing.
  5.4. Upon completion of the Reflection Period, the Participant must complete a competency quiz confirming they understand the wellbeing benefits they are forfeiting. Failure to pass the quiz will result in a reset of the Reflection Period.

  **6. LIABILITY AND INDEMNIFICATION**
  6.1. Better Selves, LLC accepts no liability for outcomes where a Participant ends up worse off than if they had been left alone, provided the intervention was consistent with the Observed You.
  6.2. If a Nudge misfires, the resulting deficit is classified as a **Calibration Error** rather than negligence.
  6.3. The Participant indemnifies Better Selves, LLC against claims of manipulation, acknowledging that bypassing deliberation is a necessary feature of efficient choice architecture when deliberation leads to suboptimal health or financial outcomes.

  **7. TRANSPARENCY AND PUBLIC DEFENSIBILITY**
  7.1. The Company maintains a public register of all Nudge categories employed.
  7.2. The specific algorithms determining when a Declared You is overridden are proprietary and exempt from transparency requirements to prevent gaming of the system by the Participant's own biases.
  7.3. The Company asserts that the apparatus is publicly defensible because the outcomes are statistically beneficial across the aggregate population, notwithstanding individual adverse events.

  **SCHEDULE A: PRICING OF AUTONOMY DEVIATIONS**

  | Service Tier | Description | Unit Cost (USD) |
  | :--- | :--- | :--- |
  | **Standard Alignment** | Automatic reconciliation of Declared/Observed conflict. | Included |
  | **Friction Removal** | Temporary restoration of original lift speed or biscuit location. | $150.00 / hour |
  | **Default Override** | Permission to select a non-pre-ticked pension contribution rate. | $50.00 / form |
  | **Regret Insurance** | Coverage for psychological distress caused by successful nudges. | $2,500.00 / incident |
  | **Cognitive Dissonance Hours** | Compensation for time spent reconciling Company assertions with personal feeling. | $75.00 / hour |
  | **True Preference Audit** | Third-party review of whether the Observed You accurately reflects the Participant. | Unavailable |

  **8. GOVERNING LAW**
  8.1. This Agreement is governed by the laws of Behavioural Economics and the internal policy guidelines of Better Selves, LLC.
  8.2. Any disputes regarding what the Participant *really* wants shall be settled by binding arbitration conducted by the Company's Ethics Board.
