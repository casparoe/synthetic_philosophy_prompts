answer: |-
  ### Specifications for a Theory of Manipulation

  **Constraint 1: Truth-Neutrality**
  The theory must classify an act as manipulation even if the information conveyed is strictly true and the constraints described are real.
  *Motivation:* A genuine countdown timer on a ticket site hurries a decision using only true statements about availability.
  *Status:* **Non-Negotiable**

  **Constraint 2: Mechanism Distinction**
  The theory must distinguish between influence that recruits an existing cognitive bias and influence that degrades the physical or cognitive capacity to deliberate.
  *Motivation:* Framing a choice to exploit loss aversion differs from inducing fatigue or intoxication to impair judgment.
  *Status:* **Non-Negotiable**

  **Constraint 3: Intentionality Agnosticism**
  The theory must allow for the classification of manipulation in the absence of a specific intent to manipulate on the part of the influencer.
  *Motivation:* An algorithmic feed's ordering shifts a user's beliefs in a direction no designer aimed at or foresaw.
  *Status:* **Negotiable** (Rivals may insist manipulation requires agency)

  **Constraint 4: Consent Compatibility**
  The theory must allow for the possibility of manipulation where the target has consented to the influence or arranged it against themselves.
  *Motivation:* A therapist's deliberately provocative intervention or a novelist's engineering of a reader's emotions is accepted by the target.
  *Status:* **Negotiable** (Rivals may define manipulation as inherently non-consensual)

  **Constraint 5: Resistance Insensitivity**
  The theory must classify an act as manipulation even if the target recognizes the technique, resents it, and is moved by it regardless.
  *Motivation:* A consumer knows a sales tactic is pressure, dislikes it, but buys the product due to the pressure anyway.
  *Status:* **Non-Negotiable**

  **Constraint 6: Boundary Non-Arbitrariness**
  The theory must distinguish manipulation from coercion, deception, and rational persuasion without relying on ad-hoc stipulations.
  *Motivation:* Coercion removes options, deception falsifies information, and persuasion appeals to reason; manipulation must occupy a distinct conceptual space.
  *Status:* **Non-Negotiable**

  **Constraint 7: Normative Thickness**
  The theory must specify whether the term 'manipulation' carries a negative evaluative charge as part of its meaning (thick concept) or is descriptively neutral (thin concept).
  *Motivation:* Some accounts hold that successful manipulation is pro tanto wrong, while others allow for benign manipulation.
  *Status:* **Negotiable**

  **Constraint 8: Gradability**
  The theory must specify whether the distinction between manipulation and persuasion is categorical (binary) or scalar (a matter of degree).
  *Motivation:* Influence tactics often vary in intrusiveness rather than falling into neat ontological bins.
  *Status:* **Negotiable**

  **Constraint 9: Success Non-Identity**
  The theory must not classify every act of successful influence as manipulation.
  *Motivation:* A sound argument that successfully changes a mind through rational persuasion is not manipulation.
  *Status:* **Non-Negotiable**

  **Constraint 10: Regulatory Observability**
  The theory must rely only on factors accessible to a third-party regulator without access to private mental states.
  *Motivation:* A regulator can inspect neither a firm's intentions nor a consumer's internal cognitive processes.
  *Status:* **Non-Negotiable** (Given your stated practical aim)

  ***

  ### Incompatible Subsets

  **Conflict A: Mechanism Distinction (2) vs. Regulatory Observability (10)**
  Constraint 2 requires the theory to distinguish between recruiting a bias and degrading a capacity. Constraint 10 forbids the theory from relying on evidence of internal cognitive processes.
  *Plain Conflict:* You cannot verify whether a cognitive capacity has been degraded or a bias recruited by observing only external behavior and design features; this requires access to the very cognitive processes Constraint 10 excludes. A theory satisfying 2 will violate 10, and a theory satisfying 10 will likely fail to distinguish the mechanisms required by 2.

  **Conflict B: Normative Thickness (7) vs. Consent Compatibility (4)**
  If Constraint 7 is met by defining manipulation as a thick concept (inherently wrongful), it becomes difficult to satisfy Constraint 4 (consented manipulation).
  *Plain Conflict:* If manipulation is by definition a violation of autonomy or dignity, a target cannot validly consent to it without contradiction; satisfying the thick concept requirement forces the theory to classify consented cases (therapist/novelist) as *not* manipulation, violating Constraint 4.

  **Conflict C: Intentionality Agnosticism (3) vs. Boundary Non-Arbitrariness (6)**
  If Constraint 3 is met (no intent required), distinguishing manipulation from accidental influence or mere causation becomes difficult without violating Constraint 6.
  *Plain Conflict:* Without an intentional agent aiming to bypass reason, the distinction between "manipulative influence" and "accidental environmental influence" risks becoming arbitrary, as both produce the same outcome without the guiding hand typically used to demarcate the concept.

  ***

  ### The Most Eliminative Requirement

  **Requirement:** **Regulatory Observability (10)**

  **Accounts Eliminated:**
  This single constraint eliminates the majority of existing philosophical accounts, specifically:
  1.  **Intentionalist Accounts:** Any account defining manipulation by the manipulator's intention to subvert rational agency is eliminated, as regulators cannot prove intent.
  2.  **Psychological Process Accounts:** Any account defining manipulation by the specific mechanism of influence (e.g., "bypassing reason," "triggering non-reflective systems") is eliminated, as regulators cannot inspect the consumer's cognitive processing to see if reason was bypassed or merely engaged emotionally.
  3.  **Thick Normative Accounts:** Any account that builds the wrongness into the definition is eliminated, as regulators require a descriptive threshold for intervention before a normative judgment of harm is legally adjudicated; they need to identify the *act*, not the *sin*.

  **Result:** This constraint leaves only **Behavioral/Design-Based Accounts**. These accounts define manipulation solely by the structure of the choice architecture (e.g., dark patterns, asymmetry of information, friction costs). However, these remaining accounts struggle to satisfy Constraint 9 (Success Non-Identity), as they risk classifying any effective design choice as manipulation.

  ***

  ### Regulatory Applicability Assessment

  **Can the requirements be met by an account a regulator could actually apply?**

  **No.** The set of Non-Negotiable requirements contains an internal contradiction regarding applicability.

  To satisfy **Constraint 1 (Truth-Neutrality)** and **Constraint 9 (Success Non-Identity)**, the theory must distinguish between a true statement that manipulates and a true statement that persuades. To satisfy **Constraint 2 (Mechanism Distinction)**, it must distinguish between a design that degrades capacity and one that recruits bias.

  A regulator operating under **Constraint 10 (Observability)** sees only the design (the timer, the layout) and the outcome (the purchase). They cannot see the *mechanism* (Constraint 2) nor the *rationality of the process* (Constraint 9). Therefore, a regulator cannot apply a theory that satisfies the Non-Negotiable constraints without making arbitrary presumptions about the consumer's internal state.

  **Recommendation for your argument:** You must either downgrade **Constraint 2 (Mechanism Distinction)** to Negotiable (accepting that regulators will ban *designs* regardless of the specific cognitive mechanism) or downgrade **Constraint 10 (Observability)** to Negotiable (accepting that regulators will need to rely on proxies or presumptions about cognitive impact). You cannot hold both as Non-Negotiable without rendering the theory inapplicable to your stated goal.
