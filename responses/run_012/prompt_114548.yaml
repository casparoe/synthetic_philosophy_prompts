prompt: |-
  Act as a philosopher working in normative ethics who is equally at home in the utilitarian tradition and in its deontological critics, and who is willing to conclude that a widely repeated objection is weaker than its fans suppose. Think carefully and self-critically; I don't want the standard tour. Begin by brainstorming — sketch the various ways one might try to defeat the position I state below, sort them by how much force they actually carry, discard the ones that don't survive your own scrutiny, and only then write your answer.

  This has become personal for me. I recently sat on a small committee that had to decide whether to commit a scarce resource to one person who would suffer greatly without it, or to spread the same resource thinly across many people who would each benefit only a little. I argued against the aggregative answer, and the reason I kept giving was that persons are separate — that a large benefit to some cannot simply be converted into a license to burden one. A colleague replied that this was a slogan, not an argument. Since then I have tried to state the thought more precisely, and this is what I have arrived at:

  The separateness of persons is a decisive objection to utilitarianism. The core of it is not that utilitarianism is cruel or that it ignores rights; it is that utilitarianism treats the good of distinct persons as commensurable and summable, and thereby treats a benefit to A as a reason that can be transferred across persons to justify a harm to B. But a reason must be a reason for someone. The fact that some good would accrue to A is not, by itself, a reason for B to accept a burden, because A's good is not a constituent of B's. Any theory that licenses such cross-personal transfer has misdescribed the structure of practical reason.

  What I want from you is not a defense of utilitarianism but a map of my position's exposure. What would count against it? Which observations, arguments, intuitions, cases, or results should move me, and how decisive would each be? Rank them from fatal to merely awkward. In particular, address: the challenge from a reductionist view of personal identity, according to which the line between trade-offs within one life and trade-offs across lives is a matter of degree rather than a difference in kind; the worry that my objection proves too much, since it seems to condemn ordinary interpersonal trade-offs we all accept; the charge that it is a restatement of the anti-aggregative intuition rather than an argument for it; and the question of whether it really singles out utilitarianism or instead indicts every view that permits any person to bear a cost for another's benefit. Say what a committed defender of my position would themselves concede as counting against it — not only what its critics allege. And tell me honestly whether the position actually risks anything, or whether it has been quietly insulated by qualification; if it is well insulated, say whether that is a problem for a view of this kind.

  I cannot use citations, so don't offer reading lists or references; I want your reasoning, not a bibliography. Finish by telling me what would change your own verdict — which single argument or consideration, if it turned out to be sound, would move you to a different assessment — and where in your reasoning you think you are most likely to be mistaken.
