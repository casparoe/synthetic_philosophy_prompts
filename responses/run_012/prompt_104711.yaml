  # Activity Design: The Black Box Protocol

  **Seminar:** Philosophy of Science (Introductory)
  **Duration:** 90 Minutes
  **Students:** 16 (Divided into 4 groups of 4)
  **Topic:** Underdetermination of Theory by Evidence (Transient vs. Permanent)

  ## 1. The Mechanism and Materials

  **The Mechanism:** A "Signal Generator" produces a sequence of integers representing observational data. The students act as competing research teams trying to reverse-engineer the generator's law to secure funding.

  **Materials:**
  *   **The Data Sheet:** One per student. Contains a table labeled "Observational Record" with 5 entries.
      *   $t=1 \rightarrow 2$
      *   $t=2 \rightarrow 4$
      *   $t=3 \rightarrow 8$
      *   $t=4 \rightarrow 16$
      *   $t=5 \rightarrow 32$
  *   **Proposal Forms:** One per group. Two sections: "The Law" (formula/description) and "The Prediction" (value for $t=6$).
  *   **Priority Tokens:** 4 physical tokens (e.g., colored poker chips). Only a group holding a token may submit a proposal.
  *   **Whiteboard:** For tracking group commitments and scores.

  **The Rival Models (Facilitator Key):**
  *   **Pair 1 (Transient Underdetermination):**
      *   *Model A (Simple):* $f(t) = 2^t$. Prediction for $t=6$: **64**.
      *   *Model B (Complex):* A polynomial constructed to fit the first 5 points but diverge at 6. Specifically: $f(t) = 2^t - \frac{(t-1)(t-2)(t-3)(t-4)(t-5)}{120}$. Prediction for $t=6$: **62**.
      *   *Status:* Both fit the given data perfectly. They make different predictions for $t=6$. Future evidence *could* decide between them.
  *   **Pair 2 (Permanent Underdetermination):**
      *   *Model C (Generative):* The numbers are calculated in real-time by the formula $2^t$.
      *   *Model D (Archival):* The numbers are read from an infinite, pre-written lookup table that happens to match $2^t$.
      *   *Status:* Both produce the exact same output for all $t$. No observation of the output can distinguish them. The difference is ontological (process vs. record), not empirical.

  ## 2. Rules and Stakes

  **The Stakes (Scientific Credibility):**
  *   **Goal:** Groups earn "Credibility Points" (CP).
  *   **Winning:** The group with the most CP at the end chooses the topic for the next seminar session (or receives a small tangible reward like high-quality chocolate).
  *   **Payoffs:**
      *   **Correct Prediction:** +10 CP.
      *   **Incorrect Prediction:** -5 CP.
      *   **No Submission:** 0 CP.
      *   **Simplicity Bonus:** If multiple groups predict correctly, the group with the "simplest" law (voted by class) gets +5 bonus CP.
  *   **Pressure:** There are only **3 Priority Tokens**. To submit a proposal, a group must hold a token. Tokens are distributed on a first-come, first-served basis after the work phase. If you don't have a token, you cannot publish, even if you know the answer. This forces early commitment.

  **Handling Unanticipated Models:**
  *   **Rule:** "The Law must be a deterministic rule capable of generating $t=100$."
  *   **If a student proposes a third model (e.g., $t=6$ is 100):** Accept it. Write it on the board. Say: "Excellent. You have identified a third rival. You now share the underdetermination problem with the other groups."
  *   **If a student proposes 'Randomness':** "Randomness is a claim about the generator's nature, not a predictive law. To compete for points, you must predict a specific number."

  ## 3. Timeline (Minute-by-Minute)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute Data Sheets. Explain the scenario: "You are astronomers analyzing a signal from a deep-space probe. You have 5 readings. You must determine the Law of the signal and predict the 6th reading to secure a grant." Explain Stakes and Token rules. |
  | **10-25** | **Investigation** | Groups work privately. They must agree on *one* Law and *one* Prediction. They write this on the Proposal Form but do not share it. Facilitator circulates, ensuring they aren't just guessing but formulating a rule. |
  | **25-35** | **Commitment** | **The Rush.** Groups scramble for the 3 Priority Tokens. Token-holders submit Proposal Forms to the Facilitator. Facilitator posts the Predictions on the Whiteboard (e.g., Group 1: 64, Group 2: 64, Group 3: 62). Group 4 (no token) is frustrated. |
  | **35-45** | **Reveal 1** | **Transient Underdetermination.** Facilitator reveals $t=6$ is **62**. <br>Groups predicting 64 lose points. Groups predicting 62 gain points.<br>**Discussion (5 mins):** "How did Group 3 know? Did they have more data?" (No). "Why did everyone else choose 64?" (Simplicity/Pattern). <br>**Point:** The data (1-5) did not force the choice. Simplicity was a tie-breaker, not a deduction. |
  | **45-55** | **The Twist** | **Permanent Underdetermination Setup.** Facilitator addresses the winning group (who predicted 62). "You won. But tell us *why* the number is 62." They will say "Because of the polynomial law." <br>Facilitator turns to the class: "What if I told you the polynomial law is false?" |
  | **55-65** | **Reveal 2** | **The Black Box.** Facilitator reveals the true nature of the generator (via a prepared slide or statement): <br>1. *Hypothesis C:* The machine calculates $2^t$ but has a glitch at $t=6$ that subtracts 2. <br>2. *Hypothesis D:* The machine reads from a list written by a god who likes the number 62 at position 6. <br>**Crucial Move:** Facilitator states: "For the sake of this seminar, assume both Hypothesis C and D produce the *exact same sequence* forever, including $t=6$. They are empirically identical." <br>Ask students: "Which is true? How do you test it?" |
  | **65-85** | **Debrief** | Structured discussion connecting activity to philosophy (see below). |
  | **85-90** | **Wrap** | Award points. Assign brief reflection: "Write one paragraph on whether 'Simplicity' is a truth-tracking virtue or a pragmatic tool." |

  ## 4. The Debrief: Connecting Experience to Theory

  **1. The Gap Between Evidence and Theory (Minutes 35-45)**
  *   *Feature:* When $t=6$ was revealed as 62, the data from $t=1$ to $5$ remained unchanged, yet the "Truth" flipped.
  *   *Lesson:* Evidence does not logically entail theory. Multiple theories can cover the same evidence. This is **Underdetermination**.
  *   *Student Experience:* The feeling of betrayal when the "obvious" pattern ($2^t$) was wrong.

  **2. Theoretical Virtues as Tie-Breakers (Minutes 35-45)**
  *   *Feature:* Most groups chose 64 ($2^t$) because it is simpler than the polynomial.
  *   *Lesson:* We use virtues (Simplicity, Elegance) to choose between underdetermined theories. But these are *pragmatic* or *aesthetic* choices, not logical proofs. Nature owes us no simplicity.
  *   *Student Experience:* Defending their choice of 64 not because the data demanded it, but because 62 felt "ad hoc."

  **3. Saving a Threatened Theory (Minutes 45-55)**
  *   *Feature:* If a group predicted 64 and lost, they might argue, "The machine was broken," or "Our measurement of $t=6$ was wrong."
  *   *Lesson:* This is the **Duhem-Quine Thesis**. We can always save a core theory by blaming auxiliary assumptions (the instrument, the environment).
  *   *Student Experience:* The temptation to reject the Facilitator's reveal rather than their own model.

  **4. Transient vs. Permanent Underdetermination (Minutes 55-65)**
  *   *Feature:* Pair 1 (64 vs 62) could be resolved by measuring $t=6$. Pair 2 (Calculation vs. Lookup) cannot be resolved by *any* measurement of the output.
  *   *Lesson:* **Transient Underdetermination** is a temporary lack of data. **Permanent Underdetermination** is a structural limit of empirical inquiry.
  *   *Student Experience:* Frustration at being asked to choose between C and D when there is "no way to know."

  ## 5. Limitations: The Obstruction of Permanent Underdetermination

  **The Feature I Cannot Reproduce:**
  I must be frank: **True Permanent Underdetermination cannot be honestly staged in a classroom activity based on observational data.**

  **Why:**
  In Pair 1, the models differed mathematically, so a future number *could* distinguish them. In Pair 2, I *asserted* that the models (Calculation vs. Lookup) are empirically equivalent. However, I proved this only by my *testimony*, not by the students' investigation.
  If two models are truly distinct, there is usually *some* observation that could distinguish them (e.g., open the box, check the power consumption, measure the time delay). To make them permanently equivalent, I must forbid those observations by fiat.
  Therefore, the activity simulates the *logic* of permanent underdetermination, but it relies on the students accepting the Facilitator's authority that "no test exists." In real science, claiming "no test exists" is often a confession of ignorance, not a metaphysical truth. I will supply this distinction in words during the debrief because staging a truly untestable difference without deception is impossible at this scale.

  ## 6. Troubleshooting: Three Predictable Failure Modes

  **1. The "Math Anxiety" Freeze**
  *   *Problem:* Students worry they aren't "good at math" to find the polynomial for 62. They disengage.
  *   *Fix:* During the Investigation phase (min 10-25), circulate and whisper to struggling groups: "You don't need to find the complex one. Just commit to the simple one. The lesson works even if you lose points." Normalize the risk of being wrong.
  *   *Contingency:* Have the polynomial formula pre-printed on a hint card. If a group is stuck after 10 minutes, give them the card. "Here is a rival theory. Do you accept it?"

  **2. The "Cynical Meta-Game"**
  *   *Problem:* Students guess this is a philosophy class, so the "obvious" answer (64) must be a trap. They all choose 62 to be clever.
  *   *Fix:* Acknowledge the game frame immediately. "Yes, this is a setup. But you must play it seriously to feel the epistemic pressure. If you all game the system, the data loses its meaning."
  *   *Contingency:* If everyone predicts 62, reveal that $t=6$ was actually 64. The lesson (underdetermination) still holds: the data didn't force 62 either.

  **3. The "Realist" Revolt**
  *   *Problem:* During Pair 2 (Calculation vs. Lookup), a student insists, "It's obviously calculation. A list is impossible."
  *   *Fix:* Validate the intuition. "That is exactly the point of Scientific Realism vs. Empiricism. You are using a metaphysical preference (causal mechanisms) to decide, not evidence."
  *   *Contingency:* Use this to pivot the debrief. Ask the class to vote. Count the hands. Show that the class is split on a question that *data* cannot solve. This proves the underdetermination point vividly.

  ## 7. Facilitator's Script for the "Obstruction" (Minute 75)

  "I need to pause and be honest with you. In Pair 1, the tie was broken by the number 62. That was **Transient Underdetermination**. In Pair 2, I told you the Calculation and Lookup models are indistinguishable. That is **Permanent Underdetermination**.

  But notice: I *told* you they are indistinguishable. I didn't let you test it. Why? Because if I let you test it (e.g., by opening the box), the underdetermination would vanish. To show you permanent underdetermination, I had to forbid the test.

  This is the limit of this activity. In real science, when two theories are permanently underdetermined (like Absolute Space vs. Relational Space), it's not because a professor said so, but because the structure of the theory makes the difference invisible to *any* possible measurement. I cannot build that into a number game without lying to you. So, take my word for Pair 2 as a placeholder for the real philosophical problem: **Sometimes, the world does not speak loudly enough to tell us which story is true.**"
