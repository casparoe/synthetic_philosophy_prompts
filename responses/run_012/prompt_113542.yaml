answer: |-
  ### Restatement of the Central Argument

  You argue that Hofstadter's "superrationality" fails to qualify as a genuine decision theory because it cannot consistently guide action without collapsing into metaphysical incoherence or arbitrariness. Your reasoning proceeds as follows: For my choice to correlate with yours (the core of superrationality), our actions must be deterministically linked. If they are not (indeterminism), the correlation vanishes, and we revert to standard causal decision theory. If they are (determinism), deliberation is causally inert, rendering the "choice" illusory. To rescue the concept, you suggest reinterpreting superrationality as a selection of *agent-types* or procedures rather than specific acts. However, under this procedural reading, the specific injunction to "submit one entry" in your lottery example loses its rational force: any symmetric strategy yields the same payoff, making "one" a focal point of notation rather than rationality. Consequently, superrationality reduces to a symmetry constraint on agent description. While this constraint can resolve dilemmas like the Prisoner's Dilemma by selecting the Pareto-superior symmetric outcome, it is silent in your lottery case where all symmetric outcomes are payoff-equivalent. Thus, superrationality is not a decision theory prescribing acts, but a descriptive constraint on rational agents that often fails to yield unique solutions.

  ### The Weakest Claim and Begged Questions

  **Claim 2 is the weakest link.**

  You write: *"Under determinism my action was fixed by the laws and the past before I ever deliberated, so there is nothing left to decide and the deliberation is epiphenomenal."*

  Here you have begged the question against **compatibilism**. You assume a "consequence argument" style incompatibilism without defending it. In the decision theory literature (from Lewis to Joyce), deliberation is understood as a causal process *within* the deterministic chain, not an external spectator to it. To say deliberation is epiphenomenal because the outcome is determined is to confuse *predetermination* with *pre-emption*. The laws and the past fixed that I would deliberate, and that my deliberation would cause the action. The "idle" conclusion only follows if you treat the deliberator as distinct from the physical system producing the action. By asserting epiphenomenalism as a consequence of determinism, you rule out functionalist accounts of agency by fiat. This undermines the "unavailable or idle" dilemma, as the "idle" horn is not a necessary truth but a contested metaphysical stance.

  ### The "Unavailable or Idle" Dilemma

  The dilemma is **not genuine**; it equivocates between **metaphysical determinism** and **deliberative independence**.

  In Claim 1, you treat determinism as a requirement for *logical correlation* (if I am a certain type, you are too). In Claim 2, you treat determinism as a threat to *agency* (if the future is fixed, I cannot affect it). This is a category error common in early critiques of causal decision theory but largely resolved in modern functional decision theory (FDT) and updateless decision theory (UDT).

  These frameworks accept determinism (or logical fixedness) precisely to *enable* the correlation in Claim 1, without accepting the epiphenomenalism in Claim 2. They argue that the output of the deliberation algorithm *is* the cause of the action. The "dilemma" dissolves if you view the agent as a subroutine in the universe's code: the subroutine's execution is determined, but its return value still determines the program's output. You have conflated "the action is fixed" with "the *process* of fixing is irrelevant."

  ### Claim 4 and its Relation to Claim 3

  **Claim 4 is correct, and it supports Claim 3 rather than undercutting it.**

  You are right that in a costless lottery where payoff is $P / \sum n_i$, any symmetric profile $(n, n, \dots, n)$ yields $P/N$. There is no rational distinction between "submit 1" and "submit 1,000" if everyone does it. This supports Claim 3 (the procedural reading) by demonstrating *why* the act-reading fails. If superrationality were a theory of acts, it would have to distinguish between $n=1$ and $n=100$ on payoff grounds; it cannot. Therefore, if "submit 1" is the recommendation, it must be due to a procedural constraint (e.g., "minimize effort" or "select the simplest rule") external to the payoff matrix.

  Claim 4 does not undercut Claim 3; it validates the shift. It shows that once you move to the procedural level, you realize the "superrational" answer depends on auxiliary constraints (like simplicity or cost) not present in the pure payoff structure. This confirms your thesis that superrationality is not a self-contained decision theory.

  ### Claim 5: Symmetry vs. Stability

  **The symmetry constraint is doing the work, but you are smuggling in a *focality* requirement, not stability.**

  You ask if you are smuggling in a stability requirement (Nash equilibrium) that would rule out "submit one." The answer is no, because "submit one" is *not* stable in this game (I can deviate and win more). If you were smuggling stability, you would have to conclude that "submit many" is the rational choice. You aren't doing that.

  However, you are smuggling in **Schelling focality**. In the Prisoner's Dilemma, symmetry selects Cooperation because (C,C) Pareto-dominates (D,D). In your lottery, (1,1) does *not* Pareto-dominate (100,100); they are identical in payoff. So symmetry alone is indeed silent, as you say. The only reason "submit 1" feels like the superrational answer is that it is the *minimal* positive integer. This is a linguistic or cognitive focal point, not a game-theoretic one.

  So, Claim 5 is largely correct: symmetry selects the *class* of symmetric profiles, but an additional principle (minimality/cost) is needed to select the *specific* profile. You haven't smuggled stability; you've smuggled **simplicity**.

  ### Verdict and Abandonment

  **Verdict:** The central claim is **True and Interesting**. It is true that superrationality functions better as a constraint on agent-types (procedures) than as a direct action-guiding algorithm, and your lottery example effectively exposes its inability to select unique acts without auxiliary assumptions. It is interesting because it forces a distinction between *logical correlation* (which superrationality handles) and *payoff dominance* (which it requires but doesn't generate).

  **Claim to Abandon:** I would abandon **Claim 2**.

  To save the rest of the essay, you should replace the "epiphenomenal" charge with a **normative** objection. Instead of saying deliberation is *causally* idle under determinism, argue that it is *normatively* redundant. If my action is logically correlated with yours, I cannot treat my decision as a free variable to maximize utility; I must treat it as a fixed parameter of the system. This preserves the "idle" intuition (I can't *change* the outcome by deliberating differently) without relying on the shaky metaphysics of Claim 2. This strengthens the move to Claim 3 (procedures) without inviting immediate rejection from compatibilists.

  ### The Strongest Unanticipated Objection

  **The objection of the Missing Cost Function.**

  Your entire analysis of the lottery hinges on the premise that entries are costless. You state: *"each entry receiving that quotient... you may submit as many entries as you like."* You do not specify that submitting entries incurs a cost (time, money, effort).

  If entries are truly costless, the game is **ill-posed for rationality**. If $(1, 1, \dots, 1)$ and $(10^{100}, 10^{100}, \dots, 10^{100})$ yield identical payoffs, there is *no* rational basis for preferring one over the other, superrational or otherwise. The intuition that "submit one" is the superrational solution relies entirely on an implicit assumption that entries *ought* to be minimized (e.g., via Occam's Razor or an unstated cost $\epsilon$ per entry).

  If you introduce even a trivial cost per entry, Claim 4 collapses. With costs, $(1, 1, \dots, 1)$ strictly Pareto-dominates $(n, n, \dots, n)$ for $n > 1$. In that case, symmetry *plus* payoff maximization *does* yield a unique solution ($n=1$).

  By omitting the cost function, you have constructed a scenario where superrationality appears arbitrary (Claim 4) only because you removed the very feature (efficiency) that usually allows it to select unique outcomes. The essay attacks superrationality for failing to solve a game that has no solution *by design*, rather than failing to solve a game that rational agents actually face. The "arbitrariness" you identify is not a flaw in superrationality; it is a flaw in your payoff matrix.
