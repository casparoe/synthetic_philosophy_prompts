answer: |-
  # So You Have Uncertain Evidence: A Flowchart for the Perplexed

  **Context:** You're staring at a blurry photo of a bird. It looks like a goldfinch, but it might be a finch. You're not certain. Your reading group is arguing about "Bayesianism" generally, which is unhelpful. Use this tree to find the specific updating rule that matches your actual intuitions about this specific mess.

  ---

  ### START: I have evidence, but I'm not 100% sure it's true.
  *(Example: The blurry photo suggests "Goldfinch," but I only trust my eyesight to degree 0.6.)*

  #### 1. Do you want to update your beliefs *right now*, or wait until the evidence is clearer?
  *   **Wait:** "I won't budge my credences until I'm near-certain." → **[LEAF A]**
  *   **Update:** "I should incorporate this uncertainty immediately." → *Go to Q2.*

  #### 2. Do you insist on representing beliefs using standard probabilities (0 to 1, summing to 1)?
  *   **No:** "Probabilities are too precise/rigid for this." → *Go to Q3.*
  *   **Yes:** "I speak fluent Kolmogorov." → *Go to Q4.*

  #### 3. (Non-Probabilistic) How do you want to represent the uncertainty?
  *   **Ranks:** "I use ordinal ranks (0, 1, 2...) for disbelief, not percentages." → **[LEAF B]**
  *   **Intervals:** "I want lower and upper bounds on belief (e.g., between 0.4 and 0.7)." → **[LEAF C]**

  #### 4. (Probabilistic) How do you describe the input from the blurry photo?
  *   **Direct Shift:** "I'm just telling you: my new credence in 'Goldfinch' is 0.6." → *Go to Q5.*
  *   **Likelihood:** "I'm telling you: This photo is 3x more likely if it's a Goldfinch than if it isn't." → **[LEAF D]**
  *   **Experience:** "I'm telling you: I definitely had a 'goldfinch-ish' visual experience (treat *that* as certain)." → **[LEAF E]**

  #### 5. (The Direct Shift / "Jeffrey" Path) You get a *second* blurry photo tomorrow. Does it bother you if processing Photo 1 then Photo 2 gives a different final belief than Photo 2 then Photo 1?
  *   **I Shrug:** "Context changes; order dependence is fine." → **[LEAF F]**
  *   **It Bugs Me:** "Rational updating shouldn't depend on the order I open my emails." → **[LEAF G]**

  ---

  ### THE LEAVES

  **[LEAF A] The Wait-and-See Strategy**
  *(Note: "Refuse to Update" and "Wait for Firmer Evidence" collapse here; functionally, you are treating uncertain evidence as no evidence.)*
  *   **Awkward Commitment:** You accept that you might ignore relevant information indefinitely just to avoid mathematical messiness.

  **[LEAF B] Spohnian Ranking Theory**
  *   **Awkward Commitment:** You give up on connecting your beliefs directly to betting odds or Dutch Books.

  **[LEAF C] Dempster-Shafer Theory (or Credal Sets)**
  *   **Awkward Commitment:** You have to explain why your "belief" in (A or B) is sometimes greater than the sum of your beliefs in A and B individually.

  **[LEAF D] Likelihood / Virtual Evidence Updating** (Pearl)
  *   **Awkward Commitment:** You must be able to articulate how likely the evidence is under hypotheses you currently think are probably false.

  **[LEAF E] Conditionalization on Experience** (Diaconis & Zabell)
  *   **Awkward Commitment:** You treat the proposition "I had this experience" as certain, even if the experience itself was misleading.

  **[LEAF F] Standard Jeffrey Conditionalization** (Probability Kinematics)
  *   **Awkward Commitment:** You accept that processing the same two blurry photos in reverse order changes your final belief (non-commutativity).

  **[LEAF G] Commutative Jeffrey Updating** (Wagner-style)
  *   **Awkward Commitment:** You have to adopt complex constraints on how you set your new probabilities to force order-independence, which feels unnatural.

  ---

  ### GRAVEYARD & FOOTNOTES

  **The "Unoccupied" Branch:**
  There is a theoretical path where you demand **Standard Probabilities** + **Direct Probability Shifts** + **Order Independence** + **Refuse to use Likelihoods**.
  *   *Status:* **Effectively Empty.**
  *   *Why:* Mathematically, if you want commutativity (Order Independence) with direct shifts, you are forced into the complex constraints of Leaf G, which drives almost everyone to switch to Likelihoods (Leaf D) instead. It's coherent, but nobody lives there because it's too much work.

  **The "Collapse" Warning:**
  Don't let your group split hairs between **"Refusing to Update"** and **"Waiting for Certainty."** Unless you have a specific threshold rule (e.g., "I update only when p > 0.9"), these are the same behavioral policy: *Status Quo Bias.* Put them both in Leaf A.

  **The Real Crux (Order Dependence):**
  If your group is stuck on Jeffrey Conditionalization, skip the philosophy and ask Q5. If they say "Order shouldn't matter," they aren't actually Jeffrey Conditionalizers; they are either Virtual Evidence users (Leaf D) or they need to do the math for Leaf G. Most don't realize this.
