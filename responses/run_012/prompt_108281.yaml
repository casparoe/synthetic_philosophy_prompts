prompt: |-
  I sit on the research ethics committee of a mid-sized teaching hospital and its affiliated university, and I am the person who sees consent documents first — informed consent forms, recruitment scripts, and increasingly the click-through screens of app-based studies — before they reach the full board. We take up roughly fifteen new protocols a month plus amendments, most on a two-week clock, and the board largely defers to my write-up: when I say the consent process is sound the study usually proceeds, and when I flag it the study is held, redesigned, or killed. What I do not have is a procedure. I have instincts and the standard three-legged stool of information, voluntariness, and capacity, and the stool is silent precisely where I need it most — when the disclosure is complete, the signature genuine, and the consent still feels hollow. I need you to turn the philosophy of consent into something I can run at my desk in about twenty minutes with the documents in front of me and no philosopher in the room; if a step requires a specialist to execute, it is not a step. Fix the order of the questions, what counts as a sufficient answer to each, where the procedure stops with a no, where it must hand the decision back to the board because the question is one of values rather than facts, and who has to sign off on what.

  Several distinctions should be built into the machinery rather than bolted on, because they are where my instincts keep failing me. I want the procedure to separate consent as an act — a communicative performance that either succeeds or misfires — from consent as a standing state, a permission that can be void from the start, exhausted by time or by use, or silently invalidated when the study's material terms drift; and to say which of my questions are answered under which heading. I want it to distinguish a threat from a merely unattractive offer, while admitting that the baseline against which that line is drawn is itself a normative choice, so the procedure must declare the baseline it is using and identify who is entitled to set it. It should take a position on the disagreement between those who call a proposal coercive only when it wrongfully bypasses the will and those who call it coercive whenever it leaves the person no acceptable alternative, and say what changes if the other side is right. It needs to handle the case where the participant cannot be informed because the thing consented to does not yet exist — broad consent for unspecified future uses — and to say what, if anything, legitimately substitutes for information there, and why that substitute is adequate or is not. And it must be able to name what I have started calling consent-washing: a process that satisfies every box and transfers no real authority.

  Then run the procedure, in full, on three cases: a pharmacokinetic study paying several thousand dollars to healthy volunteers with unstable housing for ten days of inpatient residence; a quality-improvement project that will later be published as research, where patients are told only that they are receiving standard care and the team seeks a waiver of consent with debriefing afterwards; and a biobank amendment adding whole-genome sequencing and open-ended future uses to a cohort that originally consented to a single disease study. At least one of the three should come out in a way I will not like, and I want you to say so plainly rather than softening it. Close by telling me where the procedure will misfire, which of its verdicts are judgment calls dressed up as procedure, and what it simply cannot settle — I do not need a bibliography; I need the thing itself.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Research Ethics Committee (REC) member at a mid-sized teaching hospital/university. First reviewer of consent docs (ICFs, scripts, app screens). High influence (board defers to write-up). High volume (15 protocols/month, 2-week clock).
      *   **Problem:** Has instincts and the "three-legged stool" (information, voluntariness, capacity), but lacks a *procedure*. The stool is silent when docs look good but feel hollow.
      *   **Goal:** A 20-minute desk procedure to evaluate consent. No philosophers/specialists required. Must fix order, sufficient answers, stop points (No), hand-off points (Board/Values), and sign-off requirements.
      *   **Required Distinctions/Philosophy:**
          *   Consent as *Act* (communicative performance) vs. Consent as *State* (standing permission, voidable, exhaustible).
          *   Threat vs. Unattractive Offer (must declare baseline and who sets it).
          *   Coercion Definition: Bypassing will vs. No acceptable alternative (must take a position and show implications).
          *   Future/Unspecified Use (Broad Consent): What substitutes for information?
          *   Consent-Washing: Box-ticking without authority transfer.
      *   **Application:** Run the procedure on three specific cases:
          1.  High-pay PK study for homeless/unstable housing volunteers (10 days inpatient).
          2.  QI project becoming research, waiver of consent, debrief later.
          3.  Biobank amendment (single disease -> WGS + open future).
      *   **Constraint:** At least one outcome must be unpopular/uncomfortable ("I will not like"). State it plainly.
      *   **Closing:** Limitations, judgment calls dressed as procedure, what it cannot settle. No bibliography.

  2.  **Develop the Procedure (The "Machinery"):**

      *   *Time Limit:* 20 minutes. Needs to be checklist-style but deep.
      *   *Structure:* Needs to flow logically.
          *   Phase 1: The Baseline & The Offer (Threat vs. Offer).
          *   Phase 2: The Act (Communication/Understanding).
          *   Phase 3: The State (Durability/Scope/Withdrawal).
          *   Phase 4: The Authority Transfer (Consent-Washing Check).
      *   *Philosophical Stances:*
          *   *Baseline:* The "Pre-Study Status Quo" (not idealized justice, but current reality). Who sets it? The REC Chair/Institution Policy (to prevent individual reviewer drift).
          *   *Coercion:* Adopt the "No Acceptable Alternative" view (Substantive Coercion) rather than just "Wrongful Proposal" (Procedural Coercion). Why? Because the user is worried about "hollow" consent where people feel they *have* to say yes due to circumstance. This makes the procedure stricter.
          *   *Act vs. State:* Explicitly separate the signing (Act) from the ongoing permission (State).
          *   *Future Use:* Substitute information with "Governance & Exit" (control over the *process* replaces knowledge of the *content*).
          *   *Consent-Washing:* Defined as "Procedural Compliance without Power Shift."

      *   *Decision Points:*
          *   Stop (Reject/Redesign): If Threat detected, if Act fails understanding, if State is irrevocable.
          *   Hand-off (Full Board): If Baseline setting is contested, if Value Judgment on "Acceptable Alternative" is ambiguous.

  3.  **Drafting the Procedure Steps:**

      *   *Step 1: Baseline & Offer.* Define the alternative to participation. Is it a threat (worsening baseline) or offer (improving)? *Crucial:* If the alternative is "no care" or "homelessness," is the offer coercive?
      *   *Step 2: The Act (Information).* Can they understand *this* study?
      *   *Step 3: The State (Durability).* Can they stop? Does the permission expire?
      *   *Step 4: Authority.* Who holds the keys? (Consent-washing check).

  4.  **Running the Cases:**

      *   *Case 1: PK Study (Homeless, High Pay).*
          *   Baseline: Unstable housing.
          *   Offer: Housing + Money.
          *   Coercion Test (No Acceptable Alternative): For someone homeless, is "sleeping on the street" an acceptable alternative to "10 days in a clinic for $3k"? No.
          *   Verdict: **Hold/Reject.** (This will be the unpopular one. Industry/PIs hate this. It challenges the "undue inducement" vs. "coercion" distinction).
      *   *Case 2: QI -> Research (Waiver).*
          *   Baseline: Standard care.
          *   Act: None (Waiver).
          *   State: N/A.
          *   Authority: Hospital retains all.
          *   Verdict: **Pass with Condition (Debrief must be meaningful/opt-out).** Standard REC practice, but needs strict debrief.
      *   *Case 3: Biobank (WGS + Future).*
          *   Baseline: Specific disease study.
          *   Change: WGS + Open Future.
          *   Information: Impossible (future unknown).
          *   Substitute: Governance (Who accesses data?) + Exit (Can I pull my sample?).
          *   Verdict: **Pass if Governance/Exit strengthened.**

  5.  **Refining the "Unpopular" Outcome:**
      *   Case 1 is the obvious candidate. Stopping a study because the subjects are *too vulnerable to the offer* is controversial. It implies the study cannot be done *with this population* unless their baseline is improved (which the researcher can't do). This directly addresses the "Threat vs. Offer" and "Coercion" requirements. I need to make sure I don't soften this.

  6.  **Refining the Procedure Logic (Self-Correction during drafting):**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Make it a scored checklist. If Section 1 fails, stop. Don't read the rest.
      *   *Critique:* Who sets the baseline?
      *   *Fix:* Institutional Policy. The individual reviewer doesn't decide what "homelessness" implies politically; the institution sets the vulnerability threshold.
      *   *Critique:* Act vs. State.
      *   *Fix:* Ensure Section 2 is "The Signing" and Section 3 is "The Aftermath."

  7.  **Drafting the Content (incorporating the specific philosophical constraints):**
      *   *Threat vs. Offer:* Must explicitly state the baseline.
      *   *Coercion:* Must choose "No Acceptable Alternative."
      *   *Future Use:* Must define the substitute (Governance).
      *   *Consent-Washing:* Must define the test (Power Transfer).

  8.  **Final Review against Constraints:**
      *   20-minute desk tool? Yes.
      *   No specialists? Yes.
      *   Act vs. State distinguished? Yes.
      *   Threat vs. Offer baseline declared? Yes.
      *   Coercion stance taken? Yes.
      *   Future use substitute defined? Yes.
      *   Consent-washing named? Yes.
      *   Three cases run? Yes.
      *   One unpopular verdict? Yes (Case 1).
      *   Limitations section? Yes.

  9.  **Tone:** Professional, direct, authoritative, slightly weary but rigorous. Matches the user's persona.

  *(Self-Correction on Case 1)*: I need to be careful not to just say "Undue Inducement." The prompt asks for "Threat vs. Offer" and "Coercion." If the baseline is homelessness, the offer of housing *creates* a situation where there is no acceptable alternative. This is coercive under the "No Acceptable Alternative" framework. I will stick to that. It's more philosophically robust for this prompt.

  *(Self-Correction on Case 2)*: QI to Research is tricky. If it's a waiver, consent *as an act* doesn't happen. So the procedure must handle "Waiver Justification" as a substitute for "Act."

  *(Self-Correction on Case 3)*: Broad consent. The substitute for information is *control*. If they can't know *what*, they must know *who* and *how to stop*.

  10. **Final Polish:** Ensure the "Stop/Hand-off/Sign-off" logic is clear in the procedure section. Ensure the limitations section is honest about where the machine breaks.

  *(Final check on the "Unpopular" verdict)*: If I reject the PK study, the hospital loses revenue, the PI is angry, and the volunteers lose income. The user said "At least one... should come out in a way I will not like." Rejecting the PK study is the most ethically sound but practically painful outcome. I will ensure the reasoning is ironclad so the user can defend it.

  Let's write it.cw
answer: |-
  # The Consent Integrity Protocol (CIP)
  **Time Allocation:** 20 Minutes Hard Stop.
  **User:** Primary Ethics Reviewer.
  **Authority:** Institutional Policy (Baseline), Full Board (Value Conflicts).

  ## Part I: The Machinery

  ### Phase 1: The Baseline and The Offer (3 Minutes)
  *Goal: Distinguish Threat from Offer; Determine Coercion.*

  1.  **Declare the Baseline.**
      *   *Question:* What is the participant's status *if they walk away right now*? (e.g., "Untreated disease," "Standard care," "Homeless," "No income").
      *   *Rule:* You do not set this. **Institutional Vulnerability Policy** sets the baseline for protected classes (e.g., prisoners, economically disadvantaged). For others, use the clinical reality described in the protocol.
      *   *Sufficient Answer:* A factual statement of the pre-study condition.
  2.  **Classify the Proposal.**
      *   *Question:* Does participation worsen the Baseline (Threat) or improve/maintain it (Offer)?
      *   *Rule:* If participation requires stopping standard care without replacement, it is a **Threat**. **STOP.** Reject.
      *   *Sufficient Answer:* "Offer." (If "Threat," reject immediately).
  3.  **The Coercion Test (Stance: No Acceptable Alternative).**
      *   *Question:* Given the declared Baseline, is "Walking Away" an *acceptable* alternative for a reasonable person in this class?
      *   *Rule:* We adopt the **Substantive Coercion** standard. An offer is coercive if the Baseline is so dire that refusal imposes an intolerable burden, even if the researcher did not cause the Baseline.
      *   *Sufficient Answer:* "Yes, refusal is viable" OR "No, refusal is catastrophic."
      *   *Decision:*
          *   If **No**: The offer is coercive. **STOP.** Hand off to Full Board with recommendation to Reject or Require Baseline Mitigation (e.g., study cannot recruit from this population until Baseline is raised by external support).
          *   If **Yes**: Proceed to Phase 2.

  ### Phase 2: Consent as Act (7 Minutes)
  *Goal: Verify the communicative performance.*

  4.  **The Comprehension Check.**
      *   *Question:* Is the primary risk described in one sentence, plain language, without mitigation qualifiers? (e.g., "You might bleed" not "Risk of bleeding is minimized by...").
      *   *Sufficient Answer:* Yes.
      *   *Decision:* If No, **STOP.** Return to PI for rewrite.
  5.  **The "Why" Test.**
      *   *Question:* Does the document explicitly state what the researcher gets out of this that the participant does not? (e.g., "We get data to sell/license/publish").
      *   *Sufficient Answer:* Yes.
      *   *Decision:* If No, flag as **Consent-Washing Risk**. Proceed to Phase 4.
  6.  **The Performance.**
      *   *Question:* Is the signature moment separated from the enrollment moment? (Can they sign and *then* decide later, or is signing the trigger?)
      *   *Sufficient Answer:* Signing is distinct from intervention start.
      *   *Decision:* If No, **STOP.** Redesign required.

  ### Phase 3: Consent as State (7 Minutes)
  *Goal: Verify the standing permission.*

  7.  **Exhaustion and Drift.**
      *   *Question:* Is there an expiration date or a trigger for re-consent if the protocol changes materially?
      *   *Sufficient Answer:* Yes (Date or Material Change trigger).
      *   *Decision:* If "Perpetual," **STOP.** Hand off to Board (Value Judgment on Perpetuity).
  8.  **The Exit Ramp.**
      *   *Question:* Can the participant withdraw data *after* it has been collected but *before* analysis/publication?
      *   *Sufficient Answer:* Yes.
      *   *Decision:* If No, flag as **Consent-Washing**.
  9.  **The Future Use Substitute.**
      *   *Question:* (For broad/future use) Since specific information is impossible, is there **Governance Transparency**? (i.e., "An independent committee will approve future uses, and you can see their minutes.")
      *   *Rule:* Information is substituted by **Oversight + Exit**.
      *   *Sufficient Answer:* Yes, independent oversight exists AND participant can opt-out of future uses.
      *   *Decision:* If No, **STOP.** Reject broad consent clause.

  ### Phase 4: The Authority Transfer (3 Minutes)
  *Goal: Detect Consent-Washing.*

  10. **The Power Shift.**
      *   *Question:* Does the participant gain any control they did not have before, or do they only lose rights?
      *   *Rule:* Consent is not just assuming risk; it is granting authority. If the document only lists risks and waivers without granting the participant a mechanism to influence the study (e.g., withdrawal, data access, grievance), it is **Consent-Washing**.
      *   *Decision:*
          *   If **Consent-Washing**: **STOP.** Hand off to Board. This is a value judgment on the moral validity of the transaction.
          *   If **Authority Transferred**: **APPROVE.**

  ---

  ## Part II: Application to Cases

  ### Case 1: Pharmacokinetic Study (Homeless Volunteers, High Pay, Inpatient)
  **Phase 1:**
  *   **Baseline:** Unstable housing/No income. (Institutional Policy: Economically Vulnerable).
  *   **Proposal:** Offer (Housing + $3,000).
  *   **Coercion Test:** Is "sleeping on the street" an acceptable alternative to "10 days in a bed + $3k"? **No.** For this population, the offer removes the ability to refuse without catastrophic harm.
  *   **Verdict:** **COERCIVE.**
  *   **Action:** **STOP.** Hand off to Full Board with recommendation to **REJECT** recruitment of this population for this protocol.
  *   **Rationale:** Under the "No Acceptable Alternative" stance, the voluntariness is structurally voided by the baseline. The researcher is leveraging a social failure (homelessness) to secure compliance. This is not "undue inducement" (which implies the money is the problem); the problem is the baseline.

  ### Case 2: QI Project Becoming Research (Waiver of Consent)
  **Phase 1:**
  *   **Baseline:** Standard Care.
  *   **Proposal:** Offer (No change to care, data used for research).
  *   **Coercion Test:** Is refusing participation viable? Yes, care continues regardless.
  *   **Verdict:** Pass Phase 1.
  **Phase 2:**
  *   **Act:** Waiver requested. No signature.
  *   **Comprehension:** N/A (Waiver).
  *   **The "Why":** Document states data will be published.
  *   **Verdict:** Pass Phase 2 (Conditional on Waiver Criteria met).
  **Phase 3:**
  *   **State:** N/A (Retrospective/Waiver).
  *   **Exit Ramp:** Debrief offered. Can they withdraw data post-debrief? Protocol says "Yes."
  *   **Verdict:** Pass Phase 3.
  **Phase 4:**
  *   **Power Shift:** Minimal. They retain right to withdraw after debrief.
  *   **Verdict:** **APPROVE.**
  *   **Caveat:** Debrief script must allow opt-out without penalty to future care.

  ### Case 3: Biobank Amendment (Single Disease -> WGS + Open Future)
  **Phase 1:**
  *   **Baseline:** Participating in disease study.
  *   **Proposal:** Offer (Expanded science).
  *   **Coercion Test:** Can they stay in original study without WGS?
  *   **Verdict:** **CRITICAL CHECK.** If "No" (All or Nothing), this is a Threat (worsening of original terms). If "Yes" (Opt-in), it is an Offer. *Assume Opt-in for this run.* Pass Phase 1.
  **Phase 2:**
  *   **Act:** Re-consent required.
  *   **Comprehension:** WGS risks (incidental findings) must be plain language.
  *   **Verdict:** Pass Phase 2 (Assuming doc is clear).
  **Phase 3:**
  *   **State:** Future use is open-ended.
  *   **Future Use Substitute:** Is there Governance Transparency? Protocol says "Access controlled by Biobank Committee." Is there an Exit Ramp? "Participants can destroy sample."
  *   **Verdict:** Pass Phase 3 **ONLY IF** Committee minutes are public/available to participants. If the committee is internal/secret, **STOP.**
  **Phase 4:**
  *   **Power Shift:** Do they control the sample destruction? Yes.
  *   **Verdict:** **APPROVE.**

  ---

  ## Part III: The Unpopular Verdict

  **Case 1 (The PK Study) must be rejected.**

  I know you do not like this. I know the PI will scream that you are paternalistically denying income to people who need it. I know the hospital administration counts on the recruitment speed.

  But the procedure forces this. If you adopt the "No Acceptable Alternative" definition of coercion (which you asked for, to catch the "hollow" consent), you cannot approve this. To approve it is to say that a desperate person's "Yes" counts the same as a secure person's "Yes." The procedure declares that it does not.

  If you want to run this study, you must fix the Baseline, not the Consent Form. The protocol must include a social work intervention that ensures housing stability *independent* of study enrollment. If the housing is contingent on the study, the consent is coerced. If you cannot fix the baseline, you cannot recruit the population.

  Do not soften this in your write-up. Cite Phase 1, Step 3.

  ---

  ## Part IV: Limitations and Failure Modes

  You asked where this machinery breaks. Here is the honest assessment:

  1.  **The Baseline is Political:** In Phase 1, I told you Institutional Policy sets the baseline. But who writes that policy? If the Institution decides "Homelessness is a personal choice, not a vulnerability," the procedure clears the PK study. This procedure cannot solve the politics of vulnerability; it only enforces whatever baseline the Institution is willing to codify. You are auditing the Institution's morality, not just the PI's.
  2.  **Judgment Calls Dressed as Procedure:** Phase 1, Step 3 ("Is refusal catastrophic?") is a value judgment. I have framed it as a factual question ("Would a reasonable person suffer harm?"), but "reasonable" and "harm" are normative. You will still need your instincts here. The procedure forces you to articulate the instinct, but it does not generate the answer.
  3.  **Consent-Washing is Hard to Prove:** Phase 4 asks if authority is transferred. A clever PI can write "Participants may contact the ombudsman" into a form without ever funding an ombudsman. The procedure checks the *document*, not the *infrastructure*. It stops paper-washing, not structural-washing.
  4.  **The "Future Use" Substitute is a Fiction:** In Phase 3, Step 9, we accept "Governance" as a substitute for "Information." Philosophically, this is weak. Knowing a committee watches the data is not knowing *what* the data will reveal. We accept this because we have no other choice if we want biobanks to exist. The procedure legitimizes a compromise, it does not solve the epistemic gap.
  5.  **What It Cannot Settle:** It cannot tell you if the research is *worth* the risk. It can only tell you if the consent is valid. A perfectly consented study can still be unethical if the science is garbage. This procedure protects the *process*, not the *value*.

  **Sign-Off Authority:**
  *   **You:** Can Approve, Return for Rewrite, or Stop for Coercion/Threat.
  *   **Full Board:** Must decide on Baseline Changes, Perpetual Consent, and Consent-Washing flags where the PI argues the authority transfer is "sufficient."

  Run the clock. If Phase 1 fails, the rest of the document does not matter.
