  ### II. Predictions for the Case of Rosa

  Rosa knows the bridge is out (robust first-order knowledge). She believes she knows (second-order belief exists). Her second-order belief is **safe** (robust) but is a **brute hunch** (lacks reasons).

  *   **The Safety Rule Predicts:** **Rosa knows that she knows.**
      *   *Reasoning:* The rule turns on modal robustness. Since the prompt stipulates her second-order belief could not easily have been false, the safety condition is met. The lack of reasons is irrelevant to safety.
  *   **The Access Rule Predicts:** **Rosa does not know that she knows.**
      *   *Reasoning:* The rule turns on justification/reasons. Rosa "can give no reason" for her second-order belief; it is a "brute hunch." This mirrors Sam's case (Case 4), where a lack of reasons led to a ~KK verdict despite robust first-order knowledge.
  *   **The Luminosity Rule Predicts:** **Rosa does not know that she knows.**
      *   *Reasoning:* The fact "the bridge is out" is not a phenomenal state. Regardless of the safety or reasons regarding her second-order belief, the subject matter precludes luminosity.

