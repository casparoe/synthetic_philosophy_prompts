      *   **Task:** Produce a "spec" (list of desiderata) for a theory of free will that takes the neuroscience seriously, rather than a standard essay verdict on Libet.
      *   **Specific Content:** Must cover the "whole zoo" of experimental details (readiness potential, timing of awareness, veto power, noise/threshold reanalysis, decoding studies, non-volitional ramps, clock-reading issues, alien hand syndrome).
      *   **Critical Analysis:** Distinguish genuine requirements from seminar assumptions. Flag incompatible pairs of desiderata. Identify the single most constraining requirement.
      *   **Evaluation:** Briefly assess Compatibilism, Libertarianism, and Illusionism against that key requirement.
      *   **Constraints:** No reading list, no "it's just a verbal dispute" dismissal. Tone should be direct, analytical, and helpful for a deadline next week.

  2.  **Deconstruct the "Zoo" of Empirical Data:**
      *   *Readiness Potential (RP):* Neural activity precedes conscious awareness (W-time).
      *   *W-time:* Subjective report of urge is ~200ms before movement; RP starts ~500ms+ before.
      *   *Veto Power:* Libet's "free won't" – ability to cancel movement late in the process.
      *   *Noise/Threshold (Schurger et al.):* RP might be stochastic accumulation, not a specific decision command.
      *   *Decoding (Haynes et al.):* fMRI/EEG can predict choice seconds before awareness.
      *   *Non-volitional Ramps:* Similar neural signatures in passive or non-willed contexts.
      *   *Clock Method (Libet clock):* Reliability of introspective timing is questionable.
      *   *Alien Hand/Pathology:* Dissociation between movement and sense of agency.

  3.  **Drafting the Desiderata (The Spec):**
      *   I need to turn these data points into *requirements* for a theory.
      *   *Requirement 1 (Temporal Order):* Account for the gap between neural onset and conscious awareness.
      *   *Requirement 2 (Specificity):* Explain why the RP looks like a decision signal if it's just noise.
      *   *Requirement 3 (Prediction):* Accommodate long-lead decoding without making consciousness epiphenomenal.
      *   *Requirement 4 (Control):* Explain the "Veto" – is this where the will actually lives?
      *   *Requirement 5 (Measurement):* Address the reliability of W-time (the clock).
      *   *Requirement 6 (Pathology):* Distinguish normal agency from alien hand (what breaks in pathology?).
      *   *Requirement 7 (Definition):* Define what "Free Will" means in this context (Conscious Causation vs. Alternative Possibilities vs. Control).

  4.  **Identifying Incompatible Pairs (The Tensions):**
      *   *Tension A:* Conscious Initiation vs. Neural Precedence. If will = conscious start, Libet kills it. If will = process, Libet is irrelevant.
      *   *Tension B:* Scientific Realism vs. Introspective Authority. If we trust the clock, consciousness is late. If we distrust the clock, the main data point vanishes.
      *   *Tension C:* Veto Power vs. Determinism. If the veto is unconstrained, it's libertarian. If it's determined, is it free?
      *   *Selection:* The prompt hints at "Conscious Intention + Timing Data" and "Answerable to Science + Trust Self-Report." I need to confirm these and find a worse one.
      *   *Worse Pair:* **Conscious Initiation** vs. **Neural Sufficiency**. If the brain state is sufficient for the action *before* consciousness, consciousness cannot be the *initiator*. You can't have both "Brain causes action" (in the Libet window) and "Consciousness causes action" (in the same window).

  5.  **Selecting the "Killer" Requirement:**
      *   Which one rules out the most theories?
      *   It's the **Causal Efficacy of Consciousness** requirement.
      *   Why? Because the data suggests neural sufficiency prior to awareness. Any theory requiring consciousness to *start* the chain fails. Any theory requiring consciousness to *intervene* needs to explain the veto without magic.
      *   Actually, looking closer at the prompt's hint ("threaten conscious causation rather than determinism"), the key constraint is **Accommodating Neural Sufficiency without Eliminating Agency.**
      *   Let's refine: The single hardest requirement is **Reconciling the Temporal Gap with Causal Efficacy.** (i.e., If the brain decides at T-500ms and you know at T-200ms, what is the 'you' at T-200ms doing?)

  6.  **Evaluating the Big Three against the Killer Requirement:**
      *   *Compatibilism:* Redefines "could have done otherwise" or "free will" to not require conscious initiation. Focuses on reasons-responsiveness. *Verdict:* Survives by shifting the goalposts (Will isn't the spark, it's the steering).
      *   *Libertarianism:* Requires uncaused cause or non-physical intervention. *Verdict:* Struggles hardest. Needs to find a gap in the neural chain (maybe the veto?) or reject the neural sufficiency interpretation.
      *   *Illusionism:* Accepts the data, denies the phenomenon. *Verdict:* Survives easily, but at the cost of the thing we care about.

  7.  **Refining the "Seminar Assumptions" vs. "Genuine Requirements":**
      *   *Assumption:* The Libet Clock is accurate enough to settle metaphysics. (Genuine issue: Introspection is laggy).
      *   *Assumption:* RP = Decision. (Genuine issue: Schurger says it's noise).
      *   *Assumption:* Free Will = Conscious Initiation. (This is the big one to flag).

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the fatigue with the standard debate. Set the goal (The Spec).
      *   **Part 1: The Desiderata (The Zoo):** Go through the specific empirical points and turn them into theoretical constraints.
      *   **Part 2: The Tensions (Incompatible Pairs):** Highlight where theories break.
      *   **Part 3: The Filter (The Single Requirement):** Identify the bottleneck.
      *   **Part 4: The Scorecard:** Compatibilism, Libertarianism, Illusionism.
      *   **Tone Check:** Keep it sharp, academic but accessible, no fluff.

  9.  **Drafting Content - Specific Considerations:**
      *   *Schurger/Noise:* A theory must explain why averaging creates a ramp if individual trials are stochastic.
      *   *Decoding:* A theory must explain what is being decoded if not a "decision." (Biases? predispositions?)
      *   *Veto:* Is this the locus of freedom? If so, what stops the veto from being determined?
      *   *Clock:* If W-time is wrong, the gap shrinks or vanishes. Theory must handle the uncertainty.
      *   *Alien Hand:* Theory must distinguish "I did it" from "It happened."

  10. **Refining the Incompatible Pairs:**
      *   The prompt suggests: "Can't insist free will lives in conscious intention and take timing data seriously." -> Yes, this is the big one.
      *   The prompt suggests: "Can't demand theory be answerable to science and refuse to let it hang on self-report." -> Yes, methodological tension.
      *   *Worse Pair:* **Causal Closure of the Physical** vs. **Conscious Initiation**. If neural states are causally sufficient for movement (as RP suggests), and physics is closed, consciousness has no work to do *unless* it is identical to the neural state (Identity Theory) or the neural state isn't actually sufficient (Libertarian gap).

  11. **Final Polish:**
      *   Ensure I don't sound like I'm saying "it's all verbal."
      *   Make sure the "Killer Requirement" is clearly defined.
      *   Check that all specific experimental details from the prompt are addressed in the desiderata.

      *(Self-Correction during drafting)*: I need to make sure I don't just list the experiments but list what a theory *must do* with them. E.g., not "Explain RP," but "Account for neural activity preceding awareness without rendering awareness epiphenomenal."

      *(Refining the Killer Requirement)*: The prompt asks for the single requirement that does the most work ruling candidates out. That is likely **The Causal Exclusion Constraint**. If the brain state at T-500ms is sufficient for the movement at T-0, what causal role is left for consciousness at T-200ms?

      *(Refining the Evaluation)*:
      *   Compatibilism: Bites the bullet. Consciousness doesn't need to be the *first* cause, just part of the process.
      *   Libertarianism: Denies sufficiency. Claims the veto or the conscious moment interrupts the chain. High cost.
      *   Illusionism: Accepts exclusion. Consciousness is a passenger.

      *(Final check on constraints)*: No reading list. No "verbal dispute" dismissal. Address the flatmate comment implicitly by being substantive.

      Let's assemble the response.

      *Structure:*
