answer: |-
  Here is the specification you asked for. This is not a verdict on whether free will exists, but a technical requirements document for any theory that claims to survive contact with the neuroscience of action.

  ### Part 1: The Desiderata (The Spec)

  A viable theory of free will in the post-Libet landscape must satisfy the following constraints. I have separated them into Empirical Accommodations (data you must explain) and Conceptual Deliverables (philosophical work you must do).

  **A. Empirical Accommodations**

  1.  **The Temporal Gap Constraint:**
      *   *Data:* The Readiness Potential (RP) begins ~500ms before movement; conscious awareness of the urge (W-time) is ~200ms before movement.
      *   *Requirement:* The theory must assign a functional role to consciousness that does not rely on it being the *initiator* of the motor chain, OR it must provide a mechanistic explanation for why the neural signal precedes awareness without determining the outcome.
      *   *Why:* If the brain state at T-500ms is causally sufficient for the movement at T-0, consciousness at T-200ms is causally redundant unless it can intervene.

  2.  **The Stochastic Noise Constraint:**
      *   *Data:* Reanalysis (Schurger et al.) suggests the RP is an artifact of averaging stochastic neural noise crossing a threshold, not a specific "decision command."
      *   *Requirement:* The theory must distinguish between a *bias* toward action and a *decision* to act. It cannot treat the RP as a "unconscious decision" if the RP is merely background fluctuation.
      *   *Why:* If the RP is just noise, the "unconscious decision" argument collapses, but the "conscious initiation" argument still fails because the threshold crossing happens before awareness.

  3.  **The Decoding Constraint:**
      *   *Data:* fMRI/EEG can predict left/right choices up to 7-10 seconds before awareness (Haynes et al.).
      *   *Requirement:* The theory must explain what is being decoded. Is it a standing intention, a bias, or a determined state?
      *   *Why:* If the specific content of the choice is neurally encoded seconds prior, "conscious choice" cannot be the source of the *content* of the action, only perhaps its *execution*.

  4.  **The Veto Constraint:**
      *   *Data:* Subjects can abort a movement after the RP has started, up to ~150ms before movement.
      *   *Requirement:* The theory must locate the locus of control. If initiation is unconscious, is the "Free Won't" the actual seat of freedom? If so, what neural mechanism implements the veto, and is *that* mechanism determined?
      *   *Why:* This is the only window where consciousness seemingly interacts with a prepared motor program. A theory must explain the mechanics of inhibition without invoking a homunculus.

  5.  **The Specificity Constraint:**
      *   *Data:* Slow ramps similar to the RP appear in non-volitional contexts (passive movement, external stimulation).
      *   *Requirement:* The theory must define what differentiates a "voluntary" ramp from an "involuntary" ramp, given the neural signature is identical.
      *   *Why:* If the neural signature of "willing" is indistinguishable from "not willing," the neural signature cannot be the marker of agency. The difference must be relational or contextual.

  6.  **The Pathology Constraint:**
      *   *Data:* Alien Hand Syndrome patients exhibit purposeful movement they disavow; they lack the sense of agency despite the movement being "theirs."
      *   *Requirement:* The theory must distinguish between *authorship* (the brain caused it) and *agency* (I caused it).
      *   *Why:* A theory of free will must explain what breaks in pathology. If free will is just "brain causes movement," the Alien Hand patient has free will. They insist they don't. The theory must account for the *sense* of agency as more than a post-hoc tag.

  **B. Methodological & Conceptual Deliverables**

  7.  **The Introspection Reliability Clause:**
      *   *Data:* The Libet clock method relies on subjects reporting the position of a dot when they felt an urge. This is subject to memory lag and attentional shifts.
      *   *Requirement:* The theory cannot rest entirely on the precise millisecond accuracy of W-time. It must hold even if the gap is smaller or larger.
      *   *Why:* If your theory dies because W-time is actually 100ms later than reported, it is too fragile.

  8.  **The Definition of "Will":**
      *   *Requirement:* The theory must explicitly state whether "Free Will" refers to (a) the ability to initiate chains, (b) the ability to veto chains, (c) the alignment of action with values, or (d) the sense of ownership.
      *   *Why:* The experiments test (a) and (b). Most philosophical theories care about (c). You cannot claim the experiments refute (c) without a bridge premise.

  ---

  ### Part 2: The Incompatible Pairs (The Trade-offs)

  You are correct about your hunches, but there is a deeper conflict. Here are the pairs you cannot simultaneously hold without significant theoretical contortion.

  **Pair 1: Conscious Initiation + Neural Sufficiency**
  *   **The Conflict:** You cannot claim that conscious intention *starts* the causal chain of action while also accepting that the neural state (RP) prior to consciousness is *sufficient* to produce the action.
  *   **The Verdict:** Your hunch is right. If you take the timing data seriously (neural activity precedes awareness), you must abandon the idea that consciousness is the *spark*. If you insist consciousness is the spark, you must reject the interpretation that the RP is causally sufficient (e.g., by claiming the RP is necessary but not sufficient).

  **Pair 2: Scientific Naturalism + Introspective Infallibility**
  *   **The Conflict:** You cannot demand the theory be fully answerable to neuroscience (physical measurements) while simultaneously treating the subject's self-report (W-time) as the gold standard against which the neuroscience is judged.
  *   **The Verdict:** Your hunch is right. If the clock method is flawed (and there is evidence it is), the "gap" might be an artifact. A theory that relies on the gap being *real* to prove epiphenomenalism is betting on a specific psychological measurement technique.

  **Pair 3 (The Worse Pair): Causal Closure + Non-Epiphenomenal Consciousness**
  *   **The Conflict:** This is the metaphysical bottleneck. If you accept the **Causal Closure of the Physical** (every physical event has a sufficient physical cause) and you accept the **Neural Sufficiency** implied by the decoding/RP data (the brain state determines the action), then Consciousness has no causal work left to do.
  *   **Why it's worse:** Pair 1 and 2 are empirical disputes. Pair 3 is a structural deadlock. To save free will here, you must either:
      1.  Deny Causal Closure (Libertarianism/Dualism).
      2.  Deny Neural Sufficiency (Claim the brain state doesn't fix the outcome until the last ms).
      3.  Accept Epiphenomenalism (Illusionism).
      4.  Redefine Consciousness as identical to the Neural State (Identity Theory/Compatibilism).
  *   **The Cost:** You cannot have a theory where consciousness is a distinct, non-physical (or non-neural) thing that *causes* physical movement, while also respecting the neuroscience that shows physical movement is fully prepared by prior physical states.

  ---

  ### Part 3: The Killer Requirement

  If you only keep one requirement from this list to rule candidates out, make it this one:

  **The Causal Exclusion Constraint:**
  *   *Requirement:* **The theory must identify a specific causal role for conscious awareness that is not already fulfilled by the pre-conscious neural state.**

  **Why this rules the most out:**
  The neuroscience consistently shows that the physical prerequisites for action are in place before the subject reports awareness.
  *   If you say consciousness *initiates* the action, you contradict the RP/Decoding data.
  *   If you say consciousness *selects* the action, you contradict the Decoding data (which predicts the specific choice early).
  *   If you say consciousness *vetos* the action, you push the problem back one step (what causes the veto?).
  *   If you say consciousness is just the *experience* of the action, you risk making it epiphenomenal (a shadow cast by the brain).

  This constraint forces the theory to stop waving hands about "complexity" and specify *where* the freedom enters the causal chain.

  ---

  ### Part 4: The Scorecard

  Here is how the three major positions fare against the **Causal Exclusion Constraint**.

  **1. Compatibilism**
  *   **Strategy:** Redefines "Free Will." It is not about being the *uncaused cause* of the action (initiation), but about the action flowing from the agent's own psychology (values, desires, reasoning) without external coercion.
  *   **Performance:** **Passes.** It accepts the neuroscience. It agrees consciousness doesn't start the chain. It argues that the "unconscious" neural processes *are* the agent's will, just not the conscious part of it. Consciousness is the monitoring system, not the engine.
  *   **Weakness:** It changes the subject. It satisfies the science but often fails to satisfy the *feeling* of free will that motivated the question (the feeling of being the ultimate source).

  **2. Libertarianism (Event-Causal or Agent-Causal)**
  *   **Strategy:** Insists that alternative possibilities must be real and that the agent must be the ultimate source.
  *   **Performance:** **Fails (mostly).** It struggles to find a gap in the neural chain. Some try to hang it on the "Veto" (consciousness interrupts the determined chain), but this requires the veto itself to be undetermined, which risks making it random. Others reject the neural sufficiency interpretation, but this puts them at odds with the decoding data.
  *   **Weakness:** High metaphysical cost. To survive the Causal Exclusion Constraint, it usually has to posit a break in physical causality that neuroscience does not see.

  **3. Illusionism (Hard Determinism / Eliminativism)**
  *   **Strategy:** Accepts the neuroscience and the Causal Exclusion Constraint. Concludes that conscious will is a user-illusion generated by the brain to track its own operations.
  *   **Performance:** **Passes.** It fits the data perfectly. Consciousness is an afterthought (as Libet said), but a useful one for learning and social coordination.
  *   **Weakness:** It dissolves the phenomenon rather than explaining it. It saves the science by sacrificing the thing we wanted to save (agency).

  ### Summary for your submission
  Don't write about whether Libet killed free will. Write about how the **Causal Exclusion Constraint** forces a trilemma: you can have scientific consistency (Compatibilism/Illusionism) or you can have ultimate authorship (Libertarianism), but the neuroscience of the Readiness Potential and Decoding makes it increasingly expensive to claim you can have both. The "spec" for a theory of free will is no longer just philosophical coherence; it is the ability to point to a causal mechanism that isn't already occupied by neural noise.
