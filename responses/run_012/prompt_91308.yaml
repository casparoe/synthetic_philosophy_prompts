      *   *What is Fallibilism?* The belief that any current belief, method, or institution could be wrong and is subject to revision based on future experience. No absolute foundations.
      *   *The Stability Problem:* If *everything* is revisable, including the method of revision itself, on what grounds do we stand to say Democracy is the "best" method?
      *   *The "Preference" Problem:* Why democracy? Dewey says it maximizes the conditions for inquiry (free speech, association, etc.). But if we are truly experimentalists, shouldn't we be open to the possibility that a non-democratic system might yield better results in a specific context?
      *   *The Self-Undermining Loop:*
          1.  Democracy is justified because it facilitates inquiry/experimentation.
          2.  Inquiry/experimentation is fallible (no guaranteed outcomes).
          3.  Therefore, democracy might facilitate inquiry that leads to the conclusion that democracy is bad.
          4.  If we stick with democracy regardless, we aren't true experimentalists (we've dogmatized democracy).
          5.  If we abandon democracy based on the inquiry, we've lost the framework that justified the inquiry.
      *   *Comparison:* Popper's Open Society vs. Plato's Philosopher King. Dewey tries to bridge this, but the bridge might be shaky.
      *   *Key Tension:* Instrumental value vs. Intrinsic value. Dewey often treats democracy as instrumental (it works best), but sometimes slips into it being constitutive of the good life. If instrumental, it's vulnerable to empirical counter-examples. If constitutive, it violates fallibilism.
      *   *The "Meta-Experiment" Problem:* To test if democracy is better than authoritarianism, you need a controlled experiment. But democracy requires open participation, while authoritarianism restricts it. You can't fairly test them without biasing the conditions.
      *   *The Criterion Problem:* What counts as a "successful" experiment? Growth? Satisfaction? Order? Efficiency? Dewey says "growth," but is that definition neutral? If "growth" requires democracy, the argument is circular.

