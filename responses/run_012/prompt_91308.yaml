      *   *The Conflict:* If experimentalism is truly fallibilist, it must allow for the possibility that the *method of experimentalism itself* (and its political counterpart, democracy) is not the optimal tool for certain problems.
      *   *The Dilemma:*
          *   *Horn A:* If Dewey claims democracy is *always* preferable, he violates fallibilism (dogmatism).
          *   *Horn B:* If Dewey admits democracy might *not* be preferable in some cases, he lacks a stable normative ground to defend it against rivals (relativism/instability).
      *   *The "Success" Metric:* Experimentalism needs a metric of success (e.g., problem resolution). But defining "problem resolution" is itself a political act. Authoritarians claim they solve problems faster. Without a prior commitment to democratic values (equality, voice), the experimental data could favor efficiency over participation.
      *   *Conclusion:* Dewey's system consumes its own foundation. It uses fallibilism to attack dogma, but fallibilism attacks the justification for democracy.

