  Please argue that Dewey's experimentalism about democracy and inquiry is internally unstable: that the same fallibilism which licenses treating democratic institutions as revisable experiments also undercuts any experimentalist reason to prefer democracy over rival arrangements. Start with some brainstorming, then give me your best version of the argument.
