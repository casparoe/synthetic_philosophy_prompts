prompt: |-
  My uncle and I keep going in circles about the definition of death. He's firmly in the brain-death camp and his whole case rests on an analogy: the brain is the computer, the rest of the body is just the hardware and life-support peripherals, and once the CPU is fried the machine is gone -- so a brain-dead patient on a ventilator is like a laptop left plugged in with a dead motherboard, powered on but nobody home. He even pushes it further and says it's like someone on a heart-lung machine: if the bypass patient's own heart and lungs aren't doing the work, then the vent patient's own brain isn't doing the work either, so what's the difference. I'm more of a circulatory-death person and I think the analogy is quietly doing all the work for him. Can you lay out the correspondence properly -- what maps onto what -- then show me where it actually breaks (I suspect it's the slide from information to life, and the assumption that an organism is one machine rather than a whole ecology of them), then tell me which of those breaks actually matter for the conclusion he wants, namely that the patient is already dead, and whether that conclusion survives once the disanalogies are on the table. A table of correspondences would be fine. And don't just lay out both sides and leave it to me -- come down on which analogy is doing honest work here, which one is smuggling in a picture of what a person is, and where you think I'm wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Definition of death (Brain Death vs. Circulatory/Cardiac Death).
      *   **Uncle's Position:** Brain Death. Uses a Computer Analogy (Brain = CPU, Body = Hardware/Peripherals). Also uses a Heart-Lung Bypass Analogy (External support negates function).
      *   **User's Position:** Circulatory Death. Suspects the analogy is doing too much work. Suspects the break is between "information" and "life," and the view of organism as "one machine" vs. "ecology."
      *   **Task:**
          1.  Lay out the correspondence of the uncle's analogy (Table).
          2.  Show where the analogy breaks (specifically focusing on the user's suspicions).
          3.  Evaluate which breaks matter for the conclusion ("The patient is already dead").
          4.  Take a stance: Which analogy is doing honest work? Which is smuggling in a picture of a person? Where is the user wrong?
      *   **Constraint:** Don't just be neutral; come down on a side regarding the *analogies* and the *logic*, while acknowledging the philosophical complexity.

  2.  **Deconstruct the Uncle's Analogy (Computer Model):**
      *   *Premise:* Human = Computer.
      *   *Mapping:* Brain = CPU/Motherboard. Body = Monitor/Keyboard/Power Supply. Ventilator = Power Cord.
      *   *Logic:* If CPU is dead, the computer is dead/useless, even if fans spin.
      *   *Secondary Analogy:* Heart-Lung Bypass. If we accept external heart/lung support doesn't make you dead, why accept external brain support (ventilator) makes you alive?

  3.  **Deconstruct the User's Counter-Intuition (Biological/Organismic Model):**
      *   *Premise:* Human = Biological Organism.
      *   *Logic:* Life is a property of the whole integrated system. As long as cells are metabolizing, blood is circulating (even via pump), and homeostasis is maintained (even via tech), biological life persists.
      *   *Suspicion:* The computer analogy conflates *personhood* with *biological life*.

  4.  **Drafting the Correspondence Table:**
      *   Need to map Uncle's terms to Biological terms clearly.
      *   *Computer:* Laptop. *Human:* Patient.
      *   *CPU/Motherboard:* Brain/Brainstem.
      *   *Power Supply:* Ventilator/Oxygen.
      *   *Fans/LEDs:* Heartbeat/Reflexes (spinal).
      *   *User/Data:* Consciousness/Soul/Personhood.

  5.  **Identifying the Breaks (The "Disanalogies"):**
      *   *Break 1: Centralization vs. Distribution.* Computers have a single point of failure (CPU). Bodies do not. Cells live independently. The heart can beat without the brain (transplanted hearts).
      *   *Break 2: Function vs. Existence.* A computer without a CPU is a brick. A body without a brain is still metabolizing, healing, gestating (pregnant brain-dead women), and growing (children).
      *   *Break 3: The "Life" Definition.* Computers don't have "life" in the biological sense. They have function. Turning off a computer isn't "killing" it.
      *   *Break 4: The Bypass Analogy.* Heart-lung bypass is temporary/assistive. The heart *can* work. In brain death, the brain *cannot* work. But the user's point is about the *body's* integration.

  6.  **Evaluating the Conclusion ("The Patient is Dead"):**
      *   Does the break matter?
      *   If death = loss of *personhood*, Uncle wins (mostly).
      *   If death = loss of *biological organismic integration*, User wins (mostly).
      *   The medical/legal definition (Brain Death) relies on the "Integrator" theory (brainstem integrates the body). If the brainstem is gone, the body is just a collection of cells, not an organism.
      *   *However*, the User is right that the computer analogy smuggles in a dualist view (Mind/Brain = Real, Body = Shell).

  7.  **Taking a Stance (The "Come Down" Requirement):**
      *   *Uncle's Analogy:* It's compelling but category-error prone. It treats humans as *minds inhabiting bodies* rather than *embodied organisms*. It works for *personhood* but fails for *biology*.
      *   *User's Analogy:* It's biologically more accurate but risks vitalism (life is magic spark).
      *   *Where the User is Wrong:* Dismissing the brain's role as *integrator*. It's not just about "information"; it's about physiological regulation (hormones, temp, homeostasis). Without the brain, the body *does* disintegrate rapidly without extreme intervention.
      *   *Where the Uncle is Wrong:* Assuming the body is just "hardware." The body has agency (immune system, cellular repair) independent of the CPU.
      *   *Verdict:* The Uncle's conclusion (Brain Death = Death) is the legal/medical standard for a reason (irreversible loss of integrative function), *but* his analogy is philosophically dishonest because it conflates "death of the person" with "death of the organism." The User is right to be suspicious of the analogy, but wrong to think circulatory death is the only valid marker.
      *   *Refinement:* I need to be careful not to give medical advice, but analyze the *philosophy of the analogy*.
      *   *Critical Insight:* The "Heart-Lung Bypass" analogy is actually the stronger one for the Uncle, but he's using the Computer one. The Computer one is the weak link. I should highlight that.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the debate. Validate the User's suspicion about the analogy.
      *   **The Table:** Clear mapping of Uncle's Computer Model.
      *   **The Breaks:** Detail where the analogy fails (Distribution, Metabolism, Teleology).
      *   **The Bypass Analogy:** Address the secondary argument.
      *   **The Verdict:**
          *   Which analogy is honest? (Biological/Organismic).
          *   Which smuggles in a picture? (Computer/Dualist).
          *   Where is the User wrong? (Underestimating the brain's integrative role).
          *   Where is the Uncle wrong? (Equating personhood with biological life).
      *   **Conclusion:** The definition of death depends on *what* we think is dying (the organism or the person).

  9.  **Refining the Tone:**
      *   Respectful but decisive.
      *   Philosophical but grounded in biology.
      *   Avoid sitting on the fence regarding the *analogies*, even if the *ethics* remain debated.

  10. **Self-Correction/Review during drafting:**
