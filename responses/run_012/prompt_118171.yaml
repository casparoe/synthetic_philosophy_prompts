answer: |-
  Good morning. Welcome to the Department, and welcome to this symposium on self-amendment. It is a particular privilege to stand here as we mark two occasions: the beginning of this inquiry, and the retirement of the professor who made it necessary. For thirty years, she has argued that a system of rules cannot amend itself all the way down. She says there must be a fixed point, an anchor that holds the chain of validity in place. Without it, she tells us, a rule-set is not a system, but a rumour.

  I have spent the last two years in a Friday reading group she founded, trying to prove her wrong. We are six people: half from this law faculty, half from the game-design lab. We play a game where the rules change by moves inside the game, including the rules that govern how rules change. To the lawyers in the room, this sounds like a paradox waiting to be litigated. To the designers, it sounds like a recursion loop waiting to be debugged. For us, it is simply Friday.

  I want to begin by describing a specific sequence of moves from week six of our second year. I describe it not as a solution, but as the source of a specific sensation—a queasiness in the stomach of the system.

  At the start of week six, our rules required a two-thirds majority to amend the constitution. We proposed a motion to lower that threshold to a simple majority. It passed comfortably under the old two-thirds rule. Now the system state had changed: a simple majority was sufficient.

  A fortnight later, we proposed a motion to restore the two-thirds requirement. It passed by exactly one vote under the new simple-majority rule. If that vote had gone the other way, the history of the game would be different, but it didn't. The state changed back: two-thirds were now required.

  Immediately after, we proposed a motion adding a clause that the amendment rule may never again be amended. It passed under the restored two-thirds rule. The lock was engaged.

  Here is the queasiness. That final lock is valid only if the restoration was valid. The restoration is valid only if the lowering was valid. And the lowering was valid only because a rule that nobody ever enacted—the authority of the group to bind itself at all—was treated as authoritative. We built a wall to stop change, using the very process the wall claims to prohibit.

  For the designers here: imagine a function that rewrites its own source code, deletes the compiler, and then claims it can never be compiled again. For the lawyers: imagine a chain of validity where every link is forged by the link before it, with no ground to hold the first anvil.

  This term, in my constitutional theory course, I encountered the idea of the "basic norm." It is a norm whose validity is presupposed rather than enacted. I still cannot tell if that idea is a discovery about how legal systems work, or a dignified way of giving up. It feels like stopping the recursion by simply refusing to look at the bottom of the stack.

  Our founder refuses that exit. She has spent a career treating the appeal to "convention" as a dodge, and she is right to do so. Saying "it works because we agree it works" explains the sociology, but it does not explain the validity. If the lock we built in week six is real, it must be real even if we disagree. If it is a fiction, it is a fiction that binds us nonetheless.

  I want to acknowledge the fragility of that week. The restoration of the two-thirds rule passed by a single vote. [Pause for laughter] I promise you, none of us breathed for a full minute after the count. There is something darkly funny about a constitutional crisis resolved by a margin of one, in a room of six people, over sandwiches. But that fragility is the point. If the system rests on a fixed point, why did it feel like we were walking a tightrope? And if it rests on nothing, how did we manage to stand?

  We are here for two days to settle this. But I am not going to settle it in the next five minutes. To do so would be to violate the spirit of the game we play, and the generosity of the teacher who taught us to play it. She sits in the front row, having argued for three decades that without an anchor, we drift. I stand here suggesting that perhaps the drifting is the navigation.

  We do not need to agree today. We only need to feel the weight of the question. When we change the rules of change, are we discovering a deeper law, or are we inventing a new one? When the lock clicks shut, is it holding the door, or is it merely making the sound of a lock?

  The floor is yours. Let us see if we can find the bottom of the stack without falling through it.

  ***

  **Note on Audience Targeting and Risks:**

  The middle section describing the three moves (the "Week Six" anecdote) is pitched carefully at the designers, using "system state" and "function" metaphors, while the subsequent paragraph addresses the lawyers with "chain of validity" and "ground." The greatest risk lies in the discussion of the "basic norm"; if I dwell on it too long, the designers will glaze over, but if I gloss it, the lawyers will feel I am trivializing Kelsen. I have attempted to balance this by framing it as my own uncertainty ("a dignified way of giving up") rather than a technical definition, which invites both groups into the doubt without requiring shared jargon. The laughter is targeted at the "single vote" line, which relies on the universal tension of a close call rather than insider knowledge.
