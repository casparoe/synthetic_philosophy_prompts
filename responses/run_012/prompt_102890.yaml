answer: |-
  This is a precise dissection of a confusion that often goes unremarked in introductory sequences. You are correct that the Dutch Book Argument (DBA) and the Accuracy-Dominance Argument (ADA) are frequently treated as interchangeable proofs of probabilism, when they are in fact distinct normative projects with different metaphysical commitments. One is pragmatic (about action and loss); the other is alethic (about truth and distance).

  Here is the comparison you requested, treating them as competing justifications.

  ### 1. Objects and Fundamental Goods

  **The Betting Argument (DBA)**
  *   **Object Evaluated:** A disposition to accept bets (operationalized credences). It does not evaluate the mental state itself, but the behavioral commitments associated with it.
  *   **Fundamental Good:** Pragmatic invulnerability. The norm is instrumental rationality: do not act in a way that guarantees a worse outcome for yourself regardless of the state of the world.
  *   **Key Assumptions:**
      1.  **Betting Interpretation:** Degrees of belief *are* (or entail) betting quotients.
      2.  **Linear Utility:** Utility is linear in the stakes of the bet (no risk aversion regarding the bet itself).
      3.  **Synchronicity:** The bookie can offer all bets simultaneously (or the agent treats them as a package).

  **The Accuracy Argument (ADA)**
  *   **Object Evaluated:** The credence function itself (the mental state), independent of action.
  *   **Fundamental Good:** Epistemic accuracy. The norm is veritistic: believe in a way that minimizes distance from the truth.
  *   **Key Assumptions:**
      1.  **Alethic Verificationism:** There is a fact of the matter about the "truth value" of a proposition (1 or 0) against which credences are measured.
      2.  **Existence of Proper Scoring Rules:** There exists a mathematical function that measures accuracy such that reporting your true credence maximizes expected score.
      3.  **Dominance Principle:** If option $A$ is more accurate than option $B$ in every possible world, $A$ is epistemically preferable to $B$.

  ### 2. Robustness and Dependency

  **The Betting Argument** is fragile. It depends entirely on the agent entering the "game" of betting.
  *   **The Non-Better:** If an agent refuses to bet on principle, the DBA has no grip. The proponent must argue that refusing to bet is itself irrational, which begs the question.
  *   **Non-Linear Utility:** If the agent has diminishing marginal utility for money, a Dutch Book might not result in a *utility* loss, only a monetary loss. The argument requires utility to be linear in the stake size to prove a sure loss in *value*.
  *   **No Adversary:** The DBA does not require a malicious bookie, but it does require the *possibility* of a transaction. In a vacuum where no exchange is possible, the "sure loss" is counterfactual and loses its normative bite for a pragmatist.

  **The Accuracy Argument** is robust regarding the agent's psychology but sensitive regarding the metric.
  *   **The Hermit:** The ADA applies regardless of whether the agent acts. It evaluates the map, not the territory navigation.
  *   **Choice of Scoring Rule:** This is the ADA's vulnerability. There are infinitely many strictly proper scoring rules (Brier, Log, Spherical). While Joyce (1998) proved that *all* strictly proper rules agree that non-probabilistic credences are dominated, they disagree on *how much* one credence is better than another. If you care about the *degree* of irrationality, the choice of rule matters. However, for the binary verdict of "Probabilistic vs. Non-Probabilistic," the argument is robust across the class of proper rules.

  ### 3. Beyond Probabilism

  **Conditionalization:**
  *   **DBA:** Can justify conditionalization (Lewis 1999), but requires the agent to commit *ex-ante* to a specific updating rule. If you don't announce your updating strategy, you cannot be Dutch Booked diachronically.
  *   **ADA:** Can justify conditionalization (Greaves & Wallace 2006). It shows that conditionalization is the unique updating rule that maximizes expected accuracy from the prior perspective. This is often seen as a stronger derivation because it relies on epistemic utility rather than a commitment to bet.

  **Evidence and Chance:**
  *   **Silence:** Both arguments are silent on how credences should relate to evidence or objective chance. They establish the *syntax* of belief (how credences relate to each other), not the *semantics* (how they relate to the world).
  *   **Importing Principles:** To tie credences to chance, both require the Principal Principle. To tie them to evidence, they require a norm like the Principal Principle or a specific likelihood principle. Neither argument generates these constraints internally; they only enforce coherence on whatever constraints you import.

  ### 4. The Confident Hermit

  The case of the Hermit (no bets, no money, non-linear utility) is the decisive stress test.

  *   **DBA Failure:** The DBA literally cannot evaluate the Hermit. If belief does not cash out in betting dispositions, the DBA says nothing about the belief. To save the DBA, one must argue that the Hermit *should* care about hypothetical bets. This reduces epistemology to a branch of decision theory. It implies that if you are truly isolated, you can be logically incoherent without error.
  *   **ADA Success:** The ADA evaluates the Hermit perfectly. The Hermit's credences are either close to the truth or far from it, regardless of their utility function.
  *   **Verdict on the Case:** This does not merely show the betting argument was "never about money." It shows the betting argument was never about *belief* per se; it was about *commitment*. The Accuracy Argument captures the intuition that belief aims at truth, not just successful action. The Hermit case settles the comparison in favor of Accuracy if your goal is to justify *epistemic* norms. If your goal is to justify *decision-theoretic* norms, DBA remains relevant.

  ### 5. Worldly vs. Self-Endorsed Accuracy

  This is the sharpest distinction you raised.

  *   **Self-Endorsed Accuracy (Propriety):** A scoring rule is proper if, given credence $c$, $c$ expects to maximize accuracy by reporting $c$. As you note, this is degenerate. Every credence function, even $P(A)=0.9$ and $P(\neg A)=0.9$, thinks it is the best estimator of truth by its own lights. Propriety alone cannot condemn incoherence.
  *   **Worldly Accuracy (Dominance):** This compares the score of credence $c$ against the *actual* truth values across all possible worlds. Incoherent credences are *dominated*: there exists a coherent credence $c'$ that is more accurate than $c$ in *every* possible world.
  *   **Diagnosis:** You are correct. The normative work is done entirely by **Dominance**, which is a worldly, God's-eye notion. Propriety is merely the technical condition that allows the dominance theorem to hold.
  *   **Survival:**
      *   **ADA** survives this openly. It admits that epistemic normativity requires an external standard (the truth), not just internal consistency.
      *   **DBA** tries to hide the externality. It claims the loss is "sure" (worldly), but frames it as a violation of the agent's own preferences (self-endorsed). The Hermit case exposes that the DBA relies on a worldly standard (money loss) that the agent might not endorse. The ADA is more honest: it says "You are wrong because you are far from the truth," not "You are wrong because you lost money."

  ### 6. Verdict and Unification

  **Verdict:** The **Accuracy Argument is more fundamental** for epistemology. The Dutch Book Argument is a special case of the Accuracy Argument where the "truth" is cashed out in terms of monetary payoff and the scoring rule is linear.

  *   **Derivation:** You can derive the Dutch Book theorem from the Accuracy framework. If you define "accuracy" as "monetary payoff" and assume linear utility, the dominance of probabilistic credences entails the impossibility of a Dutch Book. You cannot derive the Accuracy Argument from the Dutch Book framework without assuming that money is the only thing that matters or that belief *just is* betting.
  *   **Unified Justification:** A unified theory would need to explain *why* accuracy matters for action. It would need to bridge the gap between the Alethic (truth) and the Pragmatic (utility). This is the project of **Epistemic Utility Theory**: showing that maximizing accuracy is the best strategy for achieving pragmatic goals in the long run (instrumentalism), or that pragmatic goals are constrained by epistemic norms (normative realism).

  ### Table of Correspondences

  | Feature | Dutch Book Argument (DBA) | Accuracy-Dominance Argument (ADA) |
  | :--- | :--- | :--- |
  | **Primary Object** | Betting Dispositions / Action Plans | Credence Functions / Mental States |
  | **Fundamental Good** | Pragmatic Invulnerability (No Sure Loss) | Epistemic Accuracy (Closeness to Truth) |
  | **Normative Source** | Instrumental Rationality (Prudence) | Alethic Norms (Veritism) |
  | **Key Vulnerability** | Agents who refuse to bet; Non-linear utility | Choice of Scoring Rule (for magnitude, not binary) |
  | **The "Hermit"** | Fails (No bets to be made) | Succeeds (Credences still accurate/inaccurate) |
  | **Viewpoint** | Agent's Preferences + Worldly Outcome | God's Eye View (Dominance across worlds) |
  | **Diachronic Rule** | Conditionalization (via commitment to bet) | Conditionalization (via max expected accuracy) |
  | **Relation to Truth** | Indirect (Truth determines bet payout) | Direct (Truth is the target of the score) |
  | **Fundamental Status** | Derivative (Special case of utility) | Fundamental (Defines epistemic normativity) |

  ### Summary

  You have identified that the LessWrong/rationalist synthesis often glosses over the move from "beliefs should pay rent" (DBA) to "beliefs should map reality" (ADA). The DBA is a powerful tool for checking consistency in *agents that act*, but it fails as a justification for belief itself because it conflates the *consequences* of belief with the *nature* of belief.

  The Accuracy Argument, specifically relying on **Dominance** rather than Propriety, provides the robust justification you are looking for. It acknowledges that rationality is not just about not losing money; it is about not being dominatable in your estimation of the world, regardless of whether anyone is there to take your money. The DBA is the shadow the ADA casts in the realm of finance.
