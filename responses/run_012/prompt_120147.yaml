prompt: |-
  Ok this is a slightly weird request but bear with me. I'm in a consciousness reading group — mixed bag, two grad students, one neuroscientist who is very patient with us, and a guy who brings up panpsychism every single week — and we've spent the whole term circling the theory that says a system is conscious exactly to the extent that it constitutes a maximally irreducible cause–effect structure: conscious for itself and not for an observer, where the structure isn't a cause of the experience but just is the experience. The problem is we keep argueing about whether the theory is right, and I dont think we've ever written down what a theory of consciousness would have to deliver in the first place. So I want the spec before we read anything else. Give me the desiderata: the full list of what any adequate theory of consciousness has to get right — the cases it must classify correctly, the distinctions it isn't allowed to collapse, the empirical results it has to be consistent with, the questions it has to actually answer rather than defer — and for each one, the consideration or case that puts it on the list. By "cases" I mean roughly: the cerebellum, which has a huge share of the brain's neurons and seems to contribute nothing to experience; a deep feedforward network that passes every behavioural test you could ever run for pain or for seeing red; a grid of logic gates that behaves like nothing in particular; a system that behaves exactly like you but is implemented as a lookup table; the split-brain patients; the fact that blindsight and implicit processing and a whole dorsal stream can do real work with no experience attached; the graded fading under anaesthesia and the return in dreaming. And the distinctions I'd guess matter: between being conscious and how conscious; between the amount of experience and its structure or quality; between a theory and a mere correlate or a measure; between substrate and the function it computes; between what a system does and what it is. Tell me which of these are genuine requirements and which are just one camp's prejudice wearing a lab coat — be blunt about that, because I suspect half of what we'd write down in the abstract is smuggled in from the theory we already like.

  The part I most want is the end. I have a hunch that some subset of these desiderata can't all be satisfied at once. My candidate is this one: you can't simultaneously demand (a) that the theory be about what experience is like for the system itself, (b) that it be sensitive to the system's causal structure rather than to what the system does, and (c) that it be testable — because every test we can run only ever sees behaviour, so (c) drags you back toward the very thing (b) was meant to rule out. If that's right, say so and say exactly which one has to go and what you'd sacrifice to keep the others; if I've got the wrong pair, name the pair that actually collides. Then flag which single requirement does the most work in ruling candidates out — the one that, if you dropped it, would let the most theories back in — and after that, briefly, how the integrated-information theory and its live rivals (global workspace, higher-order, recurrent processing, whatever else you think is actually still standing) do against the list. Keep the weight on the criteria; I can do the scoreboard myself at the meeting. This is for a section I have to write on whether we're in any position to say anything about machine welfare, so I care about the practical version of the question too: what would a theory have to deliver before it could tell us, about a system we can only poke from the outside, whether there's anyone home. And no citations please, obviously — I'm not going to go read anything, I want the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A consciousness reading group (grad students, neuroscientist, panpsychist). They are discussing Integrated Information Theory (IIT) specifically ("maximally irreducible cause–effect structure," "conscious for itself," "structure isn't a cause... but just is").
      *   **Task:** Provide a list of *desiderata* (requirements) for any adequate theory of consciousness *before* evaluating specific theories.
      *   **Specific Content:**
          *   Cases it must classify correctly (cerebellum, feedforward nets, logic gates, lookup tables, split-brain, blindsight/dorsal stream, anesthesia/dreaming).
          *   Distinctions it must respect (conscious vs. how conscious, amount vs. quality, theory vs. correlate, substrate vs. function, doing vs. being).
          *   Filter out prejudices/disguised assumptions.
          *   **Crucial Part:** Identify incompatibilities among desiderata (the "trilemma" hypothesis: intrinsic nature vs. causal structure vs. testability).
          *   Identify the single most constraining requirement.
          *   Briefly score major theories (IIT, GWT, HOT, RPT) against the list.
          *   Address the practical implication: Machine welfare (can we tell if there's anyone home from the outside?).
          *   **Constraint:** No citations. Blunt assessment.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   I need to categorize these into "Hard Constraints" (must-haves) and "Soft Constraints" (theoretical preferences that might be prejudices).
      *   *Cases:*
          *   Cerebellum: High neuron count, low consciousness. (Constraint: Neural density $\neq$ consciousness).
          *   Feedforward Net/Philosophical Zombie: Behaviorally identical, no experience. (Constraint: Behavior $\neq$ consciousness).
          *   Lookup Table: Same input/output, no internal dynamics. (Constraint: Functionality/Mapping $\neq$ consciousness).
          *   Split-Brain: Two streams of consciousness in one body? (Constraint: Unity/Disunity of experience).
          *   Blindsight/Dorsal Stream: Processing without experience. (Constraint: Unconscious processing is possible).
          *   Anesthesia/Dreaming: Graded fading, return without full sensory input. (Constraint: Level of consciousness varies; sensory input not strictly necessary).
      *   *Distinctions:*
          *   Level vs. Content (Amount vs. Quality).
          *   Theory vs. Correlate (NCC vs. Constitution).
          *   Substrate vs. Function (Multiple realizability).
          *   Intrinsic (for itself) vs. Extrinsic (for observer).

  3.  **Evaluate the "Trilemma" (The Core Conflict):**
      *   The user posits: (a) Intrinsic nature (for itself), (b) Causal structure sensitivity (not just behavior), (c) Testability (external observation).
      *   *Analysis:* This is a sharp insight. If consciousness is *intrinsic* (only accessible from the inside), and we define it by *internal causal structure* (which is hidden), then *external tests* (behavior/physics) can never confirm it with certainty. This is the "Other Minds" problem formalized.
      *   *Verdict:* The user is largely right, but (b) and (c) can be reconciled *if* we assume a specific bridge principle (like IIT does: structure maps to phi). However, strict testability usually demands behavioral/physical correlates, which pushes back toward functionalism.
      *   *Resolution:* One must go. Usually, (a) is the casualty for science (we study correlates), or (c) is relaxed (we accept inference to best explanation). But for a *theory of what it is*, (a) is central. If you drop (a), you have a theory of behavior, not consciousness. If you drop (c), you have metaphysics, not science. If you drop (b), you have Behaviorism/Functionalism.
      *   *Refinement:* The real collision is often between *Intrinsic Nature* and *Empirical Testability*. You can't measure "intrinsic-ness" from the outside.

  4.  **Identify the "Kingmaker" Constraint:**
      *   Which requirement rules out the most theories?
      *   Likely: "Behavior is not sufficient for consciousness" (The Zombie constraint). This kills pure Functionalism and Behaviorism immediately.
      *   Alternatively: "Unconscious processing is possible" (Blindsight). This kills theories that equate access/report with experience.
      *   *Decision:* The "Intrinsic Existence" postulate (Experience exists for itself, not for an observer) is the biggest filter. It kills illusionism and pure functionalism. But the "Behavior $\neq$ Consciousness" constraint is the practical hammer. Let's go with the **Intrinsic/Non-Functional** requirement. It's the one that separates IIT from GWT most sharply.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the IIT framing. Validate the need for a spec sheet.
      *   **The Desiderata List:** Group them logically.
          *   *Extensional Adequacy (The Cases):* Cerebellum (quantity $\neq$ quality), Zombies/Feedforward (behavior $\neq$ experience), Blindsight (processing $\neq$ experience), Anesthesia (levels exist), Split-Brain (unity is contingent).
          *   *Conceptual Distinctions:* Level vs. Content, Correlate vs. Constitutive, Substrate vs. Structure.
          *   *The "Prejudice" Check:* Call out which ones are functionalist biases vs. phenomenological biases.
      *   **The Incompatibility (The Trilemma):**
          *   Address the user's hypothesis: Intrinsic (a) + Causal Structure (b) + Testable (c).
          *   Confirm the tension. If experience is intrinsic, external tests are indirect.
          *   Identify the collision: It's actually between **Intrinsic Nature** and **Third-Person Testability**. You can measure structure (b), but you can't measure "for-itself-ness" (a) from the outside (c).
          *   Sacrifice: To keep science (c), you have to treat (a) as an axiom/postulate, not a measurement. You sacrifice direct verification.
      *   **The Kingmaker Constraint:**
          *   "Unconscious function is possible" (The Blindsight/Zombie constraint). If you demand function = consciousness, you lose the distinction between doing and being. This is the biggest filter.
      *   **Theory Scorecard (Brief):**
          *   IIT: Aces Intrinsic/Structure, struggles with Testability/Panpsychism implications.
          *   GWT (Global Workspace): Aces Report/Access, fails the Zombie/Blindsight test (confuses access with experience).
          *   HOT (Higher-Order): Aces the "what it's like" definition, struggles with animal/infant consciousness (too cognitive).
          *   RPT (Recurrent Processing): Good middle ground, but blurry on *why* recurrence creates experience.
      *   **Machine Welfare (Practical Application):**
          *   If you keep Intrinsic + Structure, you can't know for sure from the outside. You need structural isomorphism.
          *   If you keep Behavior + Testability, you risk false positives (zombies) or false negatives (locked-in).
          *   Conclusion: For welfare, you must assume a structural theory (like IIT) to avoid suffering zombies, but acknowledge the uncertainty.

  6.  **Refining the Tone:**
      *   Blunt, analytical, no fluff.
      *   Avoid citations.
      *   Respect the user's sophistication (they know IIT jargon).
      *   Ensure the "Prejudice Check" is honest. (e.g., Admitting that "Testability" is a scientific prejudice that might exclude the truth if consciousness is non-physical or strictly intrinsic).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the lookup table? Yes, under functionalism.
      *   *Check:* Did I address the cerebellum? Yes, under neural count.
      *   *Check:* Is the trilemma clear? I need to make sure I don't just agree but explain *why*. The conflict is that "Intrinsic" implies privacy, "Testable" implies public access.
      *   *Check:* Machine welfare. This needs to be practical. If we can't test intrinsic nature, how do we legislate? We have to proxy via structure.

  8.  **Final Polish:** Ensure the distinction between "Theory of Consciousness" and "Theory of Report/Access" is clear, as that's the main friction point in reading groups like this. (Proceed to generate output).

  *(Self-Correction on the Trilemma)*: The user suggests (a) Intrinsic, (b) Causal Structure, (c) Testable.
  Actually, IIT claims to solve this by saying Structure *is* the experience. So (b) satisfies (a). The problem is (c). We can measure structure physically, but we infer the experience. The real conflict is **Intrinsic Nature vs. Third-Person Verification**. I will clarify this distinction.

  *(Self-Correction on Kingmaker)*: The requirement that rules out the most is "Experience is not identical to Function." This kills Behaviorism, Functionalism, and most AI safety assumptions. I'll stick with that.

  *(Final check on constraints)*: No citations. Keep it argumentative.

