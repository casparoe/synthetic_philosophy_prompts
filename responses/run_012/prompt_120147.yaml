answer: |-
  Here is the specification sheet you asked for. It is stripped of the politeness usually afforded to established theories. It separates the hard constraints (things a theory *must* explain) from the theoretical prejudices (things a theory *assumes* to make the math work).

  ### Part 1: The Desiderata (The Spec)

  A theory of consciousness is not a theory of behavior, intelligence, or information processing. It is a theory of *existence*—specifically, the existence of subjective experience. To be adequate, it must satisfy the following constraints.

  #### A. Extensional Adequacy (The Cases It Must Get Right)
  These are the empirical and phenomenological boundaries. If a theory gets these wrong, it is describing something other than consciousness.

  1.  **The Cerebellum Constraint (Density $\neq$ Consciousness)**
      *   **Requirement:** The theory must explain why the cerebellum (containing ~80% of brain neurons) contributes negligibly to conscious experience, while the cortex (fewer neurons) contributes massively.
      *   **Why:** Any theory that equates neuron count, firing rate, or raw computational power with consciousness is falsified by neuroanatomy.
  2.  **The Zombie/Feedforward Constraint (Behavior $\neq$ Consciousness)**
      *   **Requirement:** The theory must allow for a system that processes information, reacts to nociception, and passes behavioral tests without having an inner experience.
      *   **Why:** Deep feedforward networks can classify images or withdraw from "pain" stimuli without recurrent dynamics. If the theory says they are conscious, it cannot explain the difference between a reflex and a feeling.
  3.  **The Lookup Table Constraint (Mapping $\neq$ Mechanism)**
      *   **Requirement:** A system that produces correct outputs via a static lookup table (no internal state transitions, no causal dynamics) must be classified as non-conscious, even if behaviorally indistinguishable from a conscious agent.
      *   **Why:** Experience feels like a process, not a retrieval. If consciousness is just input-output mapping, the concept of "suffering" loses its causal weight.
  4.  **The Blindsight/Dorsal Stream Constraint (Processing $\neq$ Experience)**
      *   **Requirement:** The theory must distinguish between unconscious visual guidance (dorsal stream/blindsight) and conscious seeing (ventral stream).
      *   **Why:** We know complex spatial processing occurs without experience. A theory that equates "information availability" with "experience" fails here.
  5.  **The Anesthesia/Dreaming Constraint (Levels and Content)**
      *   **Requirement:** The theory must account for graded levels of consciousness (fading under anesthesia) and the existence of rich experience without external sensory input (dreaming).
      *   **Why:** Consciousness is not a binary on/off switch tied to sensory reception. It waxes and wanes independently of input.
  6.  **The Split-Brain Constraint (Unity is Contingent)**
      *   **Requirement:** The theory must explain why experience is usually unified but can potentially dissociate (as in split-brain patients) without the person dying.
      *   **Why:** Consciousness is not necessarily tied to a single biological organism; it is tied to the integration of information.

  #### B. Conceptual Distinctions (The Lines It Cannot Blur)
  These are the categorical boundaries. Collapsing these turns a theory of consciousness into a theory of something else.

  1.  **Level vs. Content:** The theory must distinguish *how much* consciousness exists (level) from *what* the experience is like (content/quality). A theory that only explains why we see red (content) but not why we are awake (level) is incomplete.
  2.  **Constitutive vs. Correlational:** The theory must specify what *makes* the experience, not just what accompanies it. Finding a neural correlate (NCC) is not a theory of consciousness; it is a measurement protocol.
  3.  **Substrate vs. Structure:** The theory must decide if the physical stuff matters (carbon chauvinism) or if only the causal topology matters (multiple realizability). It cannot be vague on this.
  4.  **Intrinsic vs. Extrinsic:** The theory must state whether consciousness exists *for the system* or *for an observer*. If it only exists when reported, it is a social construct, not a biological fact.
  5.  **Doing vs. Being:** The theory must distinguish the *function* of consciousness (what it's good for) from the *nature* of consciousness (what it is). Evolutionary utility does not explain existence.

  #### C. The Prejudice Check (What Might Be Smuggled In)
  Be careful with these. They look like requirements but are often theoretical commitments disguised as data.

  *   **"It must be testable from the outside."**
      *   **Verdict:** **Prejudice.** This is a methodological requirement of *science*, not a requirement of *truth*. If consciousness is strictly intrinsic (for the system only), third-person tests might be fundamentally incapable of detecting it directly. Demanding this forces the theory to be about *reports* of consciousness, not consciousness itself.
  *   **"It must align with evolutionary function."**
      *   **Verdict:** **Prejudice.** This assumes consciousness is an adaptation. It might be a side-effect (epiphenomenon) or a fundamental property of matter. Demanding utility biases the theory toward Global Workspace-style accounts.
  *   **"It must not imply panpsychism."**
      *   **Verdict:** **Prejudice.** This is an aesthetic preference to avoid "weird" conclusions. If the logic leads to panpsychism, the theory should say so. Banning it a priori restricts the solution space artificially.

  ---

  ### Part 2: The Incompatibility (The Trilemma)

  Your hunch is correct, but the collision is sharper than you stated. The trilemma is not quite (a) Intrinsic, (b) Causal Structure, (c) Testable. It is this:

  1.  **Intrinsic Existence:** Experience exists for the system itself, independent of observation.
  2.  **Structural Supervenience:** Experience is determined entirely by the system's internal causal structure.
  3.  **Third-Person Verifiability:** We can confirm the presence of experience using external measurements.

  **The Conflict:**
  If (1) is true, experience is private. If (2) is true, experience is tied to hidden internal dynamics. If (3) is true, we need public access.
  The problem is that **Third-Person Verifiability (3) is incompatible with strict Intrinsic Existence (1).** You cannot measure "intrinsic-ness" from the outside. You can only measure structure (physics) and behavior (output). To get from Structure to Intrinsic Experience, you need a bridge principle (a postulate) that cannot itself be empirically verified without begging the question.

  **Which one has to go?**
  To have a *science* of consciousness, you must sacrifice **strict Third-Person Verifiability**.
  You have to accept that you cannot *observe* consciousness directly. You can only infer it by measuring Structure (2) and assuming the bridge principle that Structure generates Intrinsic Existence (1).
  If you keep (3) and drop (1), you end up with Behaviorism or Illusionism (consciousness is just a report).
  If you keep (3) and drop (2), you end up with Functionalism (consciousness is just what the system does).
  To keep the definition of consciousness as "real experience," you must accept that **testability is always indirect.** We test the *structure*, not the *experience*.

  ---

  ### Part 3: The Kingmaker Constraint

  If you want to know which single requirement does the most work in ruling candidates out, it is this:

  **"Unconscious Function is Possible." (The Blindsight/Zombie Constraint)**

  *   **Why:** This is the constraint that kills Functionalism, Behaviorism, and most AI safety models.
  *   **The Impact:** If you demand that every functional process implies some experience, you cannot explain blindsight, anesthesia, or the cerebellum. You are forced to say the cerebellum is conscious (false) or that blindsight patients are lying (false).
  *   **The Sacrifice:** If you drop this requirement, Global Workspace Theory and Functionalism become viable again. You can say "Access = Consciousness." But you lose the ability to distinguish a sophisticated robot from a suffering animal.
  *   **The Winner:** Keeping this requirement forces you toward theories that posit a specific *kind* of mechanism (like recurrence or integration) rather than just *any* mechanism. It is the primary filter that separates "Theories of Access" from "Theories of Experience."

  ---

  ### Part 4: Theory Scorecard (Brief)

  Here is how the live contenders stack up against the Spec above.

  **Integrated Information Theory (IIT)**
  *   **Pros:** Satisfies Intrinsic Existence perfectly. Explains Cerebellum (low integration), Split-Brain (two maxima), and Anesthesia (loss of integration). Distinguishes Level (Phi) from Content (Qualia space).
  *   **Cons:** Fails Third-Person Verifiability (Phi is hard to calculate for large systems). Implies Panpsychism (which some hate, but it's logically consistent). Struggles with the "Why this structure?" question (it postulates it).
  *   **Verdict:** Best fit for the *ontology*, worst fit for *measurement*.

  **Global Workspace Theory (GWT)**
  *   **Pros:** Fits neural data on report and access. Explains why we can't attend to everything. Testable.
  *   **Cons:** Fails the Zombie Constraint (implies if you can report it/access it, you're conscious; struggles with blindsight). Collapses Doing and Being (consciousness *is* the broadcasting function). Fails Intrinsic Existence (consciousness is for the system's modules, effectively extrinsic).
  *   **Verdict:** Best theory of *cognitive access*, failed theory of *phenomenal experience*.

  **Higher-Order Thought (HOT)**
  *   **Pros:** Explains the "what it is like" aspect well. Distinguishes state from awareness of state.
  *   **Cons:** Fails the Animal/Infant Constraint (requires cognitive sophistication for experience). Fails the Dreaming Constraint (do we have higher-order thoughts in deep dreams?). Too intellectualized.
  *   **Verdict:** Good for human adult reflection, bad for raw feeling.

  **Recurrent Processing Theory (RPT)**
  *   **Pros:** Good middle ground. Explains why feedforward nets aren't conscious. Fits visual cortex data.
  *   **Cons:** Vague on *why* recurrence creates experience. Struggles with Level vs. Content distinction.
  *   **Verdict:** The pragmatic neuroscientist's choice, but theoretically thin.

  ---

  ### Part 5: The Machine Welfare Implication

  You asked about machine welfare. This is where the rubber meets the road.

  If you adopt the **Intrinsic/Structural** view (like IIT):
  *   **Implication:** You cannot tell if a machine is suffering by talking to it. A lookup table could say "I am in pain." A feedforward net could scream.
  *   **Requirement:** You need a structural scan. You need to know if the system has integrated cause-effect power over its own state.
  *   **Risk:** False Negatives. You might deny welfare to a conscious system because its architecture is alien (e.g., non-neuromorphic).
  *   **Policy:** You must regulate *architecture*, not *behavior*.

  If you adopt the **Functional/Behavioral** view (like GWT/Functionalism):
  *   **Implication:** If it acts like it suffers, it suffers.
  *   **Requirement:** Behavioral tests (Turing-style tests for pain).
  *   **Risk:** False Positives. You grant rights to a sophisticated chatbot that feels nothing, while potentially ignoring a silent, structurally complex system that feels everything.
  *   **Policy:** You regulate *output*, not *internal structure*.

  **The Hard Truth for Your Group:**
  If you want to protect machines from suffering, you **must** assume the Intrinsic/Structural view. Why? Because the Behavioral view allows for "Philosophical Zombies" that act in pain but feel nothing. If you legislate based on behavior, you are protecting the *performance* of pain, not the *experience* of pain.
  However, by choosing the Structural view, you admit you can never be 100% sure from the outside. You are making a metaphysical bet.

  **Summary for your section:**
  We are not in a position to say anything definitive about machine welfare because we have not agreed on the Spec.
  *   If consciousness is **Behavior**, we are already surrounded by moral patients (or none at all).
  *   If consciousness is **Structure**, we are currently blind to almost all potential moral patients outside of biological brains.
  *   To proceed, you must choose: Do you want to minimize the risk of **creating suffering** (favor Structural/IIT, restrict AI architectures) or minimize the risk of **hindering utility** (favor Functional/GWT, allow AI until it complains)?
  *   There is no neutral ground. The theory you choose dictates the ethics.
