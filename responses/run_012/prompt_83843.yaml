answer: |-
  The state's dual regime for managing finite, rivalrous resources presents a striking theoretical contradiction. On one hand, it treats the radio spectrum largely as a bundle of private property rights, sliced into exclusive licences, auctioned, and defended by law. On the other, it treats the atmosphere—and slices of the spectrum reserved for Wi-Fi and Bluetooth—as a commons, open to use without direct pricing, governed only by technical etiquette or not at all. To understand what theory of the commons this presupposes, one must look beyond the economic labels and examine the ontological status the state assigns to these resources. Is a commons a physical reality that the law must recognise, or is it a legal status that the law confers?

  **The Ontology of the Commons: Discovered or Made?**

  The practice presupposes a hybrid theory that is ontologically unstable but pragmatically consistent. In the case of licensed spectrum, the state acts as though the commons is a *discovered* fact. Interference is treated as a physical inevitability of rivalry; if two transmitters occupy the same frequency in the same place, signal degradation occurs. This physical rivalry is deemed to necessitate legal exclusion. Here, the theory is that property rights are the natural corollary of scarcity. The resource is inherently a common-pool resource (rivalrous and, without law, non-excludable), and the state's role is to transform it into a club good (rivalrous but excludable) through the apparatus of licensing. The boundary is not natural, but the *need* for a boundary is presented as a finding of physics.

  Conversely, the treatment of unlicensed spectrum and the atmosphere suggests a theory where the commons is *made*. In unlicensed bands, the state declines to enforce exclusive boundaries, yet ruin is avoided. This implies that rivalry is not an absolute physical constraint but a manageable variable. By imposing technical rules—power ceilings, 'listen-before-talk' protocols—the state constructs a commons that functions without privatisation. Here, the 'commons' status is a decision: the law withholds the right to exclude, delegating order to the design of devices rather than the threat of litigation.

  The atmosphere complicates this. It is legislated as finite and shared, yet left open. This suggests a third variation: the commons as a *residual category*. It is what remains when the cost of fencing exceeds the political will to enforce it. Thus, the implicit theory is not that a commons is inherently discovered or made, but that its status is contingent upon the *cost of exclusion* relative to the *value of coordination*.

  **Classification: Finding or Decision?**

  Economically, these resources are classified variously as club goods (licensed spectrum), common-pool resources (unlicensed spectrum), and public goods (the atmosphere, in practice). The critical question is whether this classification is a finding about the resource or a decision about it.

  The practice reveals that classification is a *decision disguised as a finding*. Physics dictates that radio waves interfere, but it does not dictate that interference must be solved by property rights. It could be solved by smarter receivers or social norms, as seen in unlicensed bands. Similarly, physics dictates that carbon accumulates, but it does not dictate that emitting must be free. The state *decides* to treat licensed spectrum as excludable because the revenue and control benefit the regulator. It *decides* to treat the atmosphere as non-excludable because the enforcement apparatus is globally complex and politically costly.

  Therefore, the classification is performative. By auctioning spectrum, the state makes it excludable. By refusing to price carbon, the state makes it non-excludable. The 'finding' of rivalry is real, but the 'finding' of non-excludability is a policy choice masked as technological limitation.

  **Rival Accounts and Consistency**

  This pattern rules out, accommodates, or relies upon several rival accounts of the commons.

  First, it rules out the strong claim that all common-pool resources inevitably suffer a 'tragedy' of overuse requiring privatisation. The success of unlicensed spectrum demonstrates that rivalry can be managed without exclusive ownership. If the 'tragedy' theory were universally true, Wi-Fi networks would collapse into noise; they do not.

  Second, it rules out the libertarian claim that all rivalrous resources must be privatised to be efficient. The existence of unlicensed bands, which generate immense economic value without direct pricing, contradicts the notion that property rights are the sole engine of efficiency.

  Third, the practice accommodates a transaction-cost theory. This view holds that resources should be privatised only when the cost of defining and enforcing boundaries is lower than the cost of congestion. Licensed spectrum fits this: high-value users pay for the certainty of exclusion. Unlicensed spectrum fits this: low-value, high-volume users share the cost of uncertainty.

  Can these halves be held together consistently? Yes, but only if one accepts that 'efficiency' is the sole metric and that the state is a neutral minimiser of transaction costs. However, there is a tension. The licensed model relies on the threat of state force to maintain boundaries. The unlicensed model relies on the engineering of devices to maintain order. The atmosphere relies on neither, resulting in degradation.

  The half doing the 'real work' is the licensed model. It generates revenue, establishes clear legal title, and fits the existing framework of property law. The unlicensed model is the exception, tolerated where privatisation is technically difficult or where innovation benefits from low barriers to entry. The atmosphere represents a failure of this framework, where the transaction costs are deemed too high to overcome, despite the known rivalry.

  **Sources of Order**

  The practice supposes that order comes from different sources depending on the classification.
  1.  **Licensed Spectrum:** Order comes from *Law*. The state monitors and penalises trespass.
  2.  **Unlicensed Spectrum:** Order comes from *Design*. The protocol is embedded in the hardware; the device itself enforces the rule by listening before transmitting.
  3.  **Atmosphere:** Order is currently absent, relying on *Shared Norms* which have proven insufficient.

  This distinction is crucial. In unlicensed spectrum, the law mandates the design, but the design executes the order. In the atmosphere, the law has mandated limits (in some jurisdictions) but has not successfully mandated the design or monitoring to enforce them globally.

  **Underdetermination**

  The practice is underdetermined in several key areas. Incompatible theories license the same outcome. For instance, a 'public interest' theory (maximise access for all) and a 'rent-seeking' theory (sell what is easy, ignore what is hard) both result in the current mix of licensed and unlicensed bands. The former sees unlicensed bands as a public good; the latter sees them as scraps too costly to fence.

  Similarly, the treatment of the atmosphere is underdetermined. It fits a theory of 'global impossibility' (we cannot fence the sky) and a theory of 'political inertia' (we could, but choose not to). The practice does not distinguish between these; it simply accepts the status quo.

  **Counterfactuals: Swapping the Theory**

  If the presupposed view were replaced by its rival, significant changes would follow.

  *Scenario A: The 'Made' Commons becomes dominant.*
  If the state accepted that commons status is entirely a legal decision and that technical design can manage rivalry, the atmosphere would be treated like unlicensed spectrum. We would see global technical standards for emissions, mandatory monitoring embedded in industrial machinery, and 'carbon protocols' that throttle output when atmospheric capacity is reached. Spectrum would shift further towards unlicensed models; cognitive radios would negotiate frequency use in real-time, reducing the need for static licences. The 'property' model of spectrum would shrink.

  *Scenario B: The 'Discovered' Property becomes dominant.*
  If the state insisted that all rivalrous resources must be fenced to avoid tragedy, the atmosphere would be carved into emission licences, strictly enforced with penalties akin to spectrum trespass. Unlicensed spectrum bands would be auctioned off. Wi-Fi would become a paid service, likely stifling the proliferation of IoT devices and local networking. Innovation would centralise around licence holders.

  **The Verdict of the Open Bands**

  The fact that open bands work rather well tells most sharply against the justification for the atmosphere's treatment.

  The licensed spectrum model relies on the premise that without exclusive boundaries, rivalry leads to ruin. The unlicensed spectrum model disproves this premise for resources where technical coordination is possible. The atmosphere is physically rivalrous, just like spectrum. The argument for leaving it open is usually that it is too diffuse to monitor or fence. However, if we can coordinate thousands of Wi-Fi devices to avoid interference without a central allocator, the claim that we cannot coordinate emitters to avoid atmospheric overload is weakened.

  The success of unlicensed spectrum suggests that the 'tragedy' of the atmosphere is not a physical inevitability but a failure of institutional imagination. It tells against the half of the practice that treats the atmosphere as an unpriceable public good. It implies that the atmosphere could be managed as a regulated commons, similar to unlicensed spectrum, through technical standards and monitoring rather than pure privatisation or pure neglect.

  Furthermore, the success of open bands tells against the necessity of the licensed model for *all* spectrum. It suggests that the extensive auctioning of spectrum is not a requirement of physics, but a choice of revenue and control.

  **Conclusion**

  The state's practice presupposes a theory of the commons that is instrumental rather than ontological. It treats resources as 'property' when exclusion is profitable and enforceable, and as 'commons' when exclusion is costly or when openness yields innovation benefits. It classifies resources not by their inherent nature, but by the cost of governing them.

  This creates a consistent, if cynical, logic: the state privatises where it can capture rent, and commonises where it cannot. However, the success of unlicensed spectrum exposes a fissure in this logic. It demonstrates that order can emerge from design and shared protocol without exclusive ownership. This undermines the justification for the atmosphere's unpriced status. If the barrier to managing the atmosphere is merely the cost of enforcement and monitoring, the Wi-Fi model proves such barriers are surmountable. The current pattern, therefore, rests not on a discovery of what these resources *are*, but on a decision about what the state is willing to *do*. The atmosphere remains open not because it must, but because the political will to make it a 'made' commons—like Wi-Fi—has not yet matched the will to auction spectrum.
