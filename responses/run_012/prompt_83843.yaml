  8.  **Proceed to generate output.** (Mental check: Ensure the distinction between 'rivalrous' and 'excludable' is precise).

      *Wait, one nuance:* The prompt asks "which one is doing the real work." I need to be decisive here. The "Property/Discovered" model drives revenue and legacy stability. The "Commons/Made" model drives innovation. But which underpins the *state's* logic? The state acts as if exclusion is the default and commons is the exception (residual). So the "Discovered/Property" view is the baseline, with "Made/Commons" as the pragmatic exception.

