prompt: |-
  Radio spectrum and the atmosphere are both finite and rivalrous in use, and neither can be fenced off — if at all — without a serious apparatus of law and enforcement. Yet most states treat them in opposite ways. Spectrum is cut into exclusive, tradeable licences and sold to the highest bidder, with monitoring and penalties to make the boundaries bite. The atmosphere is left open: in most places, emitting into it costs nothing, even where the same government has legislated that it is a shared and finite resource. The contrast is sharper still within spectrum itself, since the regulator that auctions exclusive bands also leaves other bands unlicensed, open to anyone who obeys technical rules — power ceilings, listening before transmitting — and those open bands, which carry Wi-Fi and much else, have not been ruined by overuse.

  What theory of the commons does this pattern presuppose? In particular: does it presuppose that a commons is discovered — a natural fact about a resource, that it is rivalrous and cannot be fenced — or that a commons is made, a status the law confers by declining to enforce boundaries and can just as easily withhold? The auctioned licences look like the first; the open bands and the unpriced atmosphere look like the second, or else like a claim about the cost of enforcement. Reconstruct the implicit theory, or the several theories, as sharply as you can, including how the practice classifies these resources — public good, common-pool resource, club good — and whether that classification is a finding about the resource or a decision about it. Say which rival accounts of the commons each half of the practice rules out and which it merely accommodates; whether the halves can be held together consistently, and if so how, and if not, which one is doing the real work. Separate what the practice strictly requires from what it merely happens to fit. Identify where it is underdetermined, so that incompatible theories would license it equally. Ask, too, where the practice supposes order comes from — law, shared norms, or the design of the devices themselves. Then suppose the presupposed view were replaced by its rival: what would have to change in the assignment of spectrum and in the treatment of the atmosphere? And which half of the practice does the fact that the open bands work rather well tell against?

  Argue it on the merits; I am not interested in who said what. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The contrasting treatment of radio spectrum (privatised/licensed vs. open/unlicensed) and the atmosphere (open/unpriced) by states.
      *   **Key Question:** What theory of the commons does this pattern presuppose? Is a commons "discovered" (natural fact) or "made" (legal status)?
      *   **Specific Tasks:**
          *   Reconstruct the implicit theory/theories sharply.
          *   Classify resources (public good, common-pool, club good) and determine if this is a finding or a decision.
          *   Analyze which rival accounts are ruled out vs. accommodated.
          *   Assess consistency between the two halves (licensed spectrum vs. open spectrum/atmosphere).
          *   Distinguish what practice *requires* vs. what it *fits*.
          *   Identify underdetermination (where incompatible theories license the same practice).
          *   Identify the source of order (law, norms, device design).
          *   Counterfactual: If the presupposed view were replaced by its rival, what would change?
          *   Evaluate evidence: Does the success of open bands tell against one half of the practice?
      *   **Constraints:** Argue on merits (no name-dropping/theory history), British English.

  2.  **Initial Analysis & Conceptual Mapping:**

      *   *The Phenomenon:*
          *   Spectrum Licensed: Exclusive, tradeable, enforced boundaries (Property/Club Good).
          *   Spectrum Unlicensed (Wi-Fi): Open, technical rules, no ruin (Commons/Common-Pool).
          *   Atmosphere: Open, unpriced, potential ruin (Commons/Public Good).
      *   *The Tension:*
          *   Licensed Spectrum suggests the "Tragedy of the Commons" is inevitable without property rights (Hardin-esque). The resource is naturally rivalrous; fencing is necessary.
          *   Unlicensed Spectrum suggests the "Tragedy" is manageable through design/rules without exclusivity (Ostrom-esque/Coasean transaction costs). The resource is socially constructed as a commons.
          *   Atmosphere suggests the "Tragedy" is ignored or enforcement is too costly, despite rivalry.
      *   *Theories of the Commons:*
          *   *Ontological (Discovered):* Rivalry and non-excludability are physical facts. If it's rival and hard to fence, it *is* a commons and will be ruined unless privatised or state-controlled.
          *   *Legal/Institutional (Made):* "Commons" is a legal regime. Excludability is a function of technology and law. Rivalry is a function of usage intensity. We *choose* to make it a commons.
      *   *Economic Classifications:*
          *   Private Good: Rival + Excludable.
          *   Club Good: Non-rival + Excludable.
          *   Common-Pool Resource (CPR): Rival + Non-excludable.
          *   Public Good: Non-rival + Non-excludable.
      *   *The Prompt's Twist:* The prompt asks if the classification is a *finding* (fact) or a *decision* (policy).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. The dichotomy between licensed spectrum (property) and open spectrum/atmosphere (commons). State the central thesis: The practice presupposes a hybrid, pragmatic theory that treats "commons" status as contingent on enforcement costs and technological manageability rather than inherent ontology, yet it masks this contingency as natural fact in the case of the atmosphere.

      *   **Reconstructing the Implicit Theory:**
          *   *Licensed Spectrum:* Assumes rivalry is high and exclusion is feasible/profitable. Treats the resource as a *Club Good* (excludable, non-rival up to capacity). Theory: Property rights are necessary to prevent interference (ruin).
          *   *Unlicensed Spectrum:* Assumes rivalry can be managed via protocol (CSMA/CA, power limits). Treats as a *Common-Pool Resource* managed by design. Theory: Technical constraints can substitute for legal boundaries.
          *   *Atmosphere:* Assumes rivalry exists but exclusion is prohibitively costly. Treats as a *Public Good* (in practice) or *CPR* (in theory). Theory: Enforcement costs outweigh benefits (for now).
          *   *Synthesis:* The state acts as a *transaction cost minimiser*. It privatises where enforcement yields revenue/efficiency and leaves open where enforcement is too hard or innovation benefits from openness.

      *   **Discovered vs. Made:**
          *   Does the practice treat commons as discovered? Licensed spectrum says "yes" (interference is physical chaos).
          *   Does it treat commons as made? Unlicensed spectrum says "yes" (we *make* it work via rules).
          *   *Verdict:* The practice is inconsistent ontologically but consistent pragmatically. It treats excludability as a variable, not a constant.

      *   **Classification: Finding or Decision?**
          *   It is a *decision* disguised as a *finding*. Physics dictates interference, but law dictates whether interference is "trespass" or "noise."
          *   Licensed: Decision to enforce exclusivity.
          *   Unlicensed: Decision to enforce etiquette (protocols).
          *   Atmosphere: Decision *not* to enforce (yet).

      *   **Rival Accounts:**
          *   *Hardin (Tragedy):* Ruled out by the success of Wi-Fi. If all CPRs inevitably collapse, unlicensed spectrum should fail. It doesn't.
          *   *Pure Libertarian/Property:* Ruled out by the existence of unlicensed bands. If all resources must be privatised, Wi-Fi shouldn't exist.
          *   *Pure Communism:* Ruled out by licensed spectrum.
          *   *Accommodated:* Coasean view (depends on transaction costs). This fits best.

      *   **Consistency:**
          *   Can they be held together? Yes, under a theory of *optimal institutional design*.
          *   *Real Work:* The "Property" model does the heavy lifting for revenue and legacy infrastructure. The "Commons" model does the heavy lifting for innovation and low-barrier entry.
          *   *Inconsistency:* The atmosphere. If we can manage spectrum commons via tech, why not carbon via tech/monitoring? The practice implies the atmosphere is "harder" to fence, but this is becoming less true.

      *   **Source of Order:**
          *   Licensed: Law + Physics.
          *   Unlicensed: Device Design (protocols) + Light-touch Law.
          *   Atmosphere: Absence of Order (currently).

      *   **Counterfactual (Swapping the Theory):**
          *   *If "Made" became dominant (Atmosphere like Wi-Fi):* We would impose technical caps on emissions, monitor via satellite, and treat carbon like interference. Cap-and-trade (which exists) is actually moving this way.
          *   *If "Discovered" became dominant (Wi-Fi like Licensed):* We would auction off every frequency. Wi-Fi would be illegal or expensive. Innovation would slow.
          *   *If Atmosphere were treated like Licensed Spectrum:* Global carbon market with strict enforcement.
          *   *If Spectrum were treated like Atmosphere:* Chaos (interference), unless device intelligence (cognitive radio) solved it entirely.

      *   **What does Wi-Fi success tell against?**
          *   It tells against the necessity of privatisation for *all* rivalrous resources. It undermines the justification for keeping the atmosphere open *if* the barrier is merely technical monitoring. It suggests the atmosphere's open status is political, not physical.

      *   **Underdetermination:**
          *   The current mix fits both a "Public Interest" theory (maximise utility) and a "Rent-Seeking" theory (sell what you can, ignore what you can't).
          *   It fits both "Market Failure" and "Government Failure" narratives depending on which band you look at.

  4.  **Refining the Argument (Self-Correction/Polishing):**

      *   *Tone Check:* Needs to be analytical, sharp, British English (e.g., "privatisation," "programme," "centre").
      *   *Focus:* Ensure I don't just describe economics but address the *theory of the commons* (ontology vs. legal status).
      *   *Key Insight:* The distinction isn't really about the resource; it's about the *cost of exclusion* relative to the *value of exclusion*.
      *   *Atmosphere Nuance:* The prompt notes the atmosphere is "legislated that it is a shared and finite resource" but unpriced. This is the key contradiction. It is legally a commons but economically open access.
      *   *Wi-Fi Nuance:* Wi-Fi isn't truly "open access" in the Hardin sense; it has "technical rules." It's a *regulated commons*. This is the bridge.

  5.  **Final Structure Plan:**

      1.  **Introduction:** The paradox of the state's dual regime.
      2.  **Ontology vs. Institution:** Is the commons found or made? (The core theoretical reconstruction).
      3.  **Economic Classification:** Finding or Decision? (CPR vs. Club Good).
      4.  **Consistency & The Real Work:** Can the halves coexist? (Transaction Cost Economics).
      5.  **Sources of Order:** Law vs. Code.
      6.  **The Atmosphere Anomaly:** Why the inconsistency matters.
      7.  **Counterfactuals:** Swapping the theories.
      8.  **Conclusion:** The verdict on the "Tragedy."

  6.  **Writing - specific attention to British English spelling and idiom.** (e.g., *privatisation, programme, centre, analyse, colour*).

      *(Self-Correction during drafting)*: I need to make sure I answer the specific question: "Which half of the practice does the fact that the open bands work rather well tell against?"
      *Answer:* It tells against the *necessity* of the licensed model for all rivalrous goods, and by extension, it tells against the *excuse* for the atmosphere's unpriced status (if the excuse is "it's too hard to manage"). It suggests the atmosphere is a political choice, not a technical inevitability.

      *(Refining the "Discovered vs. Made")*: The practice presupposes that "commons" is a *residual category*. It is what is left over when privatisation is too costly. Thus, it is "made" by the refusal to fence. However, it treats the *need* for fencing as "discovered" (based on interference physics). I need to tease this apart.

      *(Final Polish)*: Ensure the distinction between "Open Access" (no rules) and "Common Property" (rules) is clear, as Wi-Fi is the latter, while the Atmosphere is closer to the former (currently).

  7.  **Final Review against constraints:**
      *   British English? Yes.
      *   No name-dropping? (Avoid Hardin, Ostrom, Coase by name if possible, focus on "rival accounts"). *Correction:* The prompt says "Argue it on the merits; I am not interested in who said what." I should avoid proper nouns associated with theories where possible, or use them only to describe the theory, not to credit the person. I will describe the theories descriptively.
