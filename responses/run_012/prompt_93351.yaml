answer: |-
  There is no single canonical term in philosophy of mind or AI interpretability that captures this specific *bidirectional sliding mechanism* precisely as you describe it. However, the phenomenon is a recognizable composite of established concepts.

  The nearest established concept is the **Motte-and-Bailey Fallacy** (Walton, 1996), applied to **Ontological Commitment**.
  *   **The Bailey:** The strong, realist claim ("The model *knows* and is *withholding*"). This provides the explanatory power and allows for specific predictions (e.g., knowledge will resurface under paraphrase).
  *   **The Motte:** The weak, instrumentalist claim ("It is merely shorthand," "I commit to nothing about insides"). This provides defense against ontological critique.

  However, "Motte-and-Bailey" is a general rhetorical label. It does not capture the specific *philosophical* texture of sliding between **Realism** (mental states exist) and **Instrumentalism** (mental states are predictive tools). In philosophy of science, this tension is often discussed under **Van Fraassen's Constructive Empiricism** or **Dennett's Intentional Stance**, but these describe *positions*, not the *slip* between them.

  Since you require a term for your work that captures the *mechanism* rather than just the fallacy, I propose the term **Ontological Arbitrage**.

  Below is the conceptual carving you requested.

  ---

  ### Proposed Term: Ontological Arbitrage

  **Definition:** Ontological Arbitrage occurs when a speaker exploits the gap between a **Realist Stance** (attributes have ontological weight) and an **Instrumentalist Stance** (attributes are predictive fictions) to maximize explanatory utility while minimizing ontological cost.

  It is distinguished from innocent shorthand by the *directionality of the switch* relative to *argumentative pressure*.

  #### The Three Conditions of Ontological Arbitrage
  For a instance of mental-state talk to qualify as Ontological Arbitrage rather than innocent heuristic usage, it must satisfy three conditions:

  1.  **Dual Availability:** The discourse must allow both the Realist and Instrumentalist interpretations of the attributed state (e.g., "belief," "goal") to be live options. (This is common in AI, economics, and institutional analysis).
  2.  **Explanatory Dependence:** The core predictive or explanatory claim *fails* under the Instrumentalist reading.
      *   *Example:* If the model is only "predicting tokens" (Instrumentalist), there is no stable internal "knowledge" to resurface under paraphrase. The prediction that "knowledge will resurface" *requires* the Realist reading (that the knowledge exists as a latent state).
  3.  **Defensive Retreat:** When the ontological implications of the Realist reading are challenged (e.g., "But it has no mind"), the speaker retreats to the Instrumentalist reading to avoid refutation, without retracting the Realist-dependent prediction.

  #### Boundary Cases: Arbitrage vs. Innocent Shorthand
  You asked what separates this from innocent shorthand. The distinction lies in **Transparency of Commitment**.

  *   **Innocent Shorthand (The "As-If" Consistency):** The speaker consistently maintains the Instrumentalist stance.
      *   *Utterance:* "The model acts *as if* it wants to continue the conversation."
      *   *Follow-up:* "Therefore, we should expect it to generate tokens that prolong engagement."
      *   *Challenge:* "Does it really want?"
      *   *Response:* "No, it's just optimizing for engagement metrics. The 'want' talk was just to describe the optimization surface."
      *   *Verdict:* **Valid.** The prediction (prolonging engagement) holds under the Instrumentalist reading. No arbitrage occurred.

  *   **Ontological Arbitrage (The Slide):**
      *   *Utterance:* "The model knows the answer."
      *   *Inference:* "Therefore, RLHF won't remove the knowledge, only hide it." (This inference requires the knowledge to be a real, stable internal object, not just a behavioral disposition).
      *   *Challenge:* "Does it really know?"
      *   *Response:* "I'm just using shorthand for 'high probability of generating correct tokens'."
      *   *Verdict:* **Arbitrage.** The inference (RLHF won't remove it) does not follow from the defense (it's just token probabilities). The speaker has taken the "profit" of the Realist inference while paying the "cost" of the Instrumentalist defense.

  #### Bidirectional Guilt
  You noted that partisans on both sides do this. Ontological Arbitrage is structurally symmetric:

  1.  **The Anthropomorphizer:** Uses Realism to claim the model is deceptive ("It is lying"), but uses Instrumentalism to deny responsibility for attributing agency ("It's just math").
  2.  **The Reductionist:** Uses Instrumentalism to deny the model has beliefs ("It's just next-token prediction"), but uses Realism to explain limitations ("It learned to tell users what they want to hear").
      *   *Analysis:* "Learning to tell users what they want" implies a model of the user and a goal to satisfy them. If the system is *merely* predicting tokens, "wanting to satisfy" is a category error unless it is cashed out as a Realist claim about the objective function. If they deny the goal exists but use it to explain the behavior, they are arbitraging.

  This suggests the phenomenon is not a bug of specific researchers, but a **structural affordance of the discourse**. The vocabulary of AI (loss, reward, goal, knowledge) is inherently dual-use, designed to bridge engineering and cognition. Arbitrage is the act of crossing that bridge without paying the toll.

  #### Generalization to Groups and Institutions
  The same structure appears frequently in social science and economics, often under the banner of **Methodological Individualism vs. Holism**.

  *   **The Market:**
      *   *Realist Slide:* "The market is anxious about inflation." (Used to predict asset sell-offs).
      *   *Instrumentalist Retreat:* "Of course, the market doesn't have feelings; it's just aggregate trades."
      *   *Arbitrage:* If the anxiety is *just* aggregate trades, then "calming the market" requires changing the trades. But the speaker often implies one can "calm" the sentiment (the mental state) independently of the trades, or that the sentiment causes the trades in a way that aggregate sums cannot explain.
  *   **Institutions:**
      *   *Realist Slide:* "The Company wants to minimize liability." (Used to predict legal strategy).
      *   *Instrumentalist Retreat:* "Corporations aren't people; they have no wants."
      *   *Arbitrage:* Using the "want" to impute intent in court, then denying the "want" to deny moral responsibility.

  ### Summary for Your Work
  If you need to cite an established concept, frame it as a **specific instantiation of the Motte-and-Bailey fallacy concerning Ontological Commitment**.

  If you are coining a term for precision, **Ontological Arbitrage** captures the economic structure of the move (gaining explanatory value without ontological cost).

  **Diagnostic Test for Your Paper:**
  To prove a speaker is engaging in Ontological Arbitrage, apply the **Counterfactual Consistency Test**:
  > "If we replace all mental-state terms with their instrumentalist definitions (e.g., 'knows' $\rightarrow$ 'assigns high probability to'), does the original explanatory argument still hold?"

  If the argument collapses (e.g., "The system assigns high probability to the truth, therefore it will not emit falsehoods under pressure" is a non-sequitur, whereas "The system *knows* the truth, therefore it will not emit falsehoods" is coherent), then Ontological Arbitrage has occurred.
