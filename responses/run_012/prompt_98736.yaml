      The impasse is a constitutive clash masked as an empirical dispute, where conflicting normative commitments about what democracy ought to be determine what counts as evidence that it is eroding. The sides agree on the raw events but disagree on their ontological status: whether a specific action is an instance of "democratic functioning" or "democratic erosion." For the proceduralist, Hungary after 2010 and Poland under Law and Justice represent majoritarian corrections where voters successfully altered the constitutional order; labeling this backsliding imposes an external liberal veto on popular sovereignty. For the liberal constitutionalist, those same events constitute erosion because judicial independence and media pluralism were compromised, rendering subsequent elections unfair regardless of the ballot count. This divergence explains why the United States during the Trump presidency is categorized differently: proceduralists point to the peaceful transfer of power in 2021 as proof of resilience, while liberalists point to the preceding norm-breaking as proof of decay, even though both sides observe the same inauguration. The Turkish case further illuminates the temporal dispute; what looks like linear backsliding post-coup to one group appears to another as the culmination of a long-term majoritarian mandate that began earlier, suggesting the baseline for "healthy democracy" is arbitrary. Consequently, the partisan charge arises naturally: if democracy is defined by liberal outcomes, then right-wing populist victories look like failures by definition, whereas if defined by procedure, left-wing judicial activism could equally qualify as backsliding, yet rarely receives the label.

