answer: |-
  Here is a defended research agenda tailored to your constraints (18 months, formal/micro background) and goal (shifting the dialectic rather than cataloging it).

  ### Executive Summary
  Your comparative advantage is your microeconomic toolkit. The field of money pumps is currently saturated with conceptual analyses of agency (naive vs. sophisticated) but under-analyzed regarding the *formal modeling assumptions* that make the pumps work in the first place. 

  The strategy is to move from **Formal Foundations** (Question 5) to **Structural Necessity** (Questions 1 & 4) to **Normative Force** (Question 2). This order ensures that if the foundational critique succeeds, the subsequent papers reinterpret the fallout rather than building on shaky ground. Question 3 should be dropped as a standalone project; it is a special case of Question 2.

  ---

  ### The Ranked Agenda

  #### 1. Priority One: The Modeling Assumptions (Question 5)
  **Working Title:** *The Risk-Neutral Pump: Hidden Assumptions in Diachronic Exploitability*
  **Focus:** Stress-test the "one-trade" suspicion. Formalize the standard money pump argument to isolate where risk-neutrality over money and value stability are implicitly assumed. Show that under risk-aversion or context-dependent valuation, the "loss" in a pump cycle does not necessarily correspond to a loss in expected utility.
  **Why First?** This is the most upstream question. If the standard pump relies on economically unrealistic assumptions (e.g., linear utility for money across the pump sequence), the normative force of the argument is compromised before we even discuss agency types. It leverages your micro background to do something philosophers rarely do: check the economic plumbing.
  **Tractability:** High. This is formal modeling work, which you can do in isolation. It does not require engaging with the sprawling literature on resolute choice immediately, only the standard formalizations (e.g., Gustafsson, Rabinowicz).
  **Neglect:** High. Philosophers often treat money as a proxy for utility without justification. Economists know better, but haven't applied this critique to the philosophical money pump literature extensively.

  #### 2. Priority Two: The Diachronic/Synchronic Structure (Questions 1 & 4)
  **Working Title:** *Diachronic Consistency or Synchronic Representation? The Necessity of Time in Money Pumps*
  **Focus:** Combine Q1 (agent types) and Q4 (synchronic recasting). Argue that once the modeling assumptions from Paper 1 are corrected, the "diachronic" element often collapses into a synchronic inconsistency *unless* one posits a specific, controversial theory of diachronic agency (e.g., resolute choice). If the pump only works on naive agents, is it a rationality constraint or a cognitive limitation?
  **Why Second?** This depends on the results of Paper 1. If Paper 1 shows pumps are fragile, Paper 2 asks: "In the cases where they *do* work, is it because of time, or because of synchronic preference inconsistency?" This moves the debate from "how to avoid the pump" to "what the pump actually measures."
  **Tractability:** Moderate. Requires conceptual precision and some formalism (preference orderings over time), but less heavy lifting than Paper 1.
  **Neglect:** Moderate. Q4 is often discussed, but rarely in conjunction with a critique of the underlying valuation model (Q5).

  #### 3. Priority Three: Exploitability vs. Rationality (Question 2)
  **Working Title:** *Arbitrage without Irrationality: Decoupling Exploitability from Normative Force*
  **Focus:** Argue that even if a pump exists (Paper 1) and is diachronic (Paper 2), exploitability does not entail irrationality. Use the "transaction cost" framework from microeconomics (including cognitive costs of resolution/sophistication) to show that avoiding a pump can be more costly than enduring it.
  **Why Third?** This is the normative payoff. It relies on the previous two papers to restrict the scope of the pump. If you argue this first, proponents will simply say, "But the pump shows inconsistency!" Your previous papers will have already narrowed what "inconsistency" means here.
  **Tractability:** High. This is primarily conceptual/normative argumentation, supported by the formal results of Paper 1.
  **Neglect:** Low (many argue this), but *your* angle (transaction costs + corrected modeling) is novel.

  ---

  ### Drops and Additions

  **Drop: Question 3 (The Self-Torturer/Intransitivity)**
  *   **Reason:** The Self-Torturer is a specific instance of the general problem of intransitive/incomplete preferences. If you successfully argue that exploitability does not entail irrationality (Q2/Paper 3), the Self-Torturer case is resolved by extension. If you argue that pumps rely on hidden risk-neutrality (Q5/Paper 1), the Self-Torturer puzzle (which relies on marginal indiscriminability) may dissolve or change shape. Writing a dedicated paper on this risks getting bogged down in a case study when you could be setting the general rules.
  *   **Exception:** Use the Self-Torturer as a *running example* in Paper 2 or 3 to illustrate the general point, but do not make it the primary subject.

  **Add: Cognitive Transaction Costs**
  *   **Reason:** You mentioned "limited budget of time" for yourself; agents have limited budgets for computation. Standard money pump arguments assume costless deliberation and choice. Integrating a formal constraint on cognitive cost into Paper 1 or 3 strengthens the "Exploitability vs. Rationality" argument. It bridges your micro background (cost-benefit analysis) with the philosophy of action.

  ---

  ### Upstream/Downstream Map

  *   **Upstream:** **Question 5 (Modeling).** If the pump requires risk-neutrality to show a utility loss, the rest of the debate is about a model that doesn't apply to real agents. This must be settled first.
  *   **Midstream:** **Question 1 & 4 (Structure).** Once we know *if* a loss occurs, we must determine *why*. Is it because the agent is naive (Q1) or because preferences are synchronically inconsistent (Q4)?
  *   **Downstream:** **Question 2 (Normativity).** Only after establishing that a robust, diachronic loss is possible (Q5) and that it stems from agency structure (Q1/Q4) can we argue about whether avoiding it is *required* by rationality (Q2).

  **Why this order?**
  If you write Q2 first, you are arguing about normativity on the basis of a potentially flawed model (Q5). If you write Q1 first, you are debating naive vs. sophisticated choice in a model where the "loss" might not be a loss in utility terms (Q5). By starting with Q5, you force the field to accept your formal constraints before engaging with your conceptual claims.

  ---

  ### Confidence and Uncertainty

  **Confidence in Ranking:** **High (85%)**
  The logic of "Formal Foundations → Structural Analysis → Normative Conclusion" is robust for a researcher with your toolkit. It maximizes your comparative advantage (microeconomics) in the first paper to gain traction, then uses that traction to support the more philosophical claims. It avoids the trap of writing "another survey of naive vs. sophisticated choice" which is what Q1 often devolves into without the Q5 hook.

  **Least Certain Point:** **The Reception of Question 5 (Modeling Assumptions)**
  *   **Why:** I am least sure about how the philosophical community will receive a heavy formal critique of the money pump's valuation assumptions. There is a risk that philosophers will dismiss the risk-neutrality critique as "technical" or "missing the point," arguing that money pumps are *conceptual* arguments about preference orderings, not empirical claims about monetary utility.
  *   **Mitigation:** To counter this, Paper 1 must explicitly frame the risk-neutrality assumption not as a technicality, but as a *substantive commitment* about the nature of value. If the proponent of the money pump must assume risk-neutrality to make the argument work, they are committed to a controversial theory of value, not just rationality. Make that philosophical cost explicit.

  ### Summary of Advice for the Next 18 Months
  1.  **Months 1-6:** Write Paper 1 (Q5). Focus on the formal model. Submit to a journal that values formal philosophy (e.g., *Philosophy of Science*, *Economics and Philosophy*, or *BJPS*).
  2.  **Months 7-12:** Write Paper 2 (Q1+Q4). Use the results of Paper 1 to constrain the discussion of agency. Submit to a general philosophy journal (e.g., *Phil Review*, *Mind*, *Nous*).
  3.  **Months 13-18:** Write Paper 3 (Q2). Synthesize the previous two into a normative conclusion. This can also serve as the introduction to a larger project or a monograph proposal.

  This agenda allows you to leave the fellowship with a coherent, cited body of work that claims ownership of the *formal foundations* of the debate, rather than just another voice in the conceptual crowd.
