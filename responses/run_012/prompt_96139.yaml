answer: |-
  Your mate's AI analogy is spot on, and it's the key to understanding what you're looking at. In AI safety, the first problem is an agent becoming too capable and seizing control (the Chair). The second is an agent faithfully following instructions that no longer match what you actually want (the Drift).

  Here is the hard truth: **They are not separate problems.** The Drift is the disease; the Chair is the symptom. Or, perhaps more accurately, the Chair is the mechanism by which the Drift went unchallenged.

  You cannot fix the mission creep without fixing the governance, because the governance structure is currently designed to prevent exactly the kind of scrutiny that would halt the creep. If you try to argue about the mission without addressing the power imbalance, the Chair will simply outlast you. She has the institutional memory, the bank card, and the funder relationships. You have a two-year horizon and a constitution nobody has read. She wins that fight.

  However, if you attack the Chair directly as a "power grabber," you will blow up the charity. She likely sees herself as the guardian of the flame. To her, your request to document the grant process didn't look like good governance; it looked like you saying she wasn't trusted.

  So, here is how you navigate this without burning the place down.

  ### 1. The Diagnosis: Why the Drift happened
  You asked how to tell which one is happening. It's both, but the Drift is the dangerous one. The Chair is just a person; the Drift is systemic.

  The charity has optimized for **survival**, not **purpose**.
  Twenty years ago, the purpose was "parents helping parents." That is hard to fund. It's messy, informal, and doesn't look good on a grant monitoring form.
  Today, the purpose is "running a wellbeing hub." That is fundable. It has KPIs, staff, and outcomes.
  Nobody sat down and said, "Let's stop helping the original families." They just said, "If we hire a coordinator, we can get this grant," and "If we get this grant, we can keep the lights on."

  The Chair enabled this because she became the interface between the charity and the money. She learned what the funders wanted, and she steered the ship to meet those demands. The committee became a rubber stamp because she did the work.

  ### 2. The Strategy: Risk, not Morality
  Do not frame this as "You are wrong" or "We have lost our way." That is moralising, and it puts people on the defensive.
  Frame everything as **Risk Management**.

  Trustees have a legal duty (under the Charity Commission) to manage risk. A single person holding the Chair, Treasurer, and Bank Card roles is a massive compliance risk. If she gets hit by a bus tomorrow, the charity ceases to function. The bank accounts freeze. The staff aren't paid.

  This is your wedge. It is neutral, unarguable, and allows the Chair to save face. She isn't being pushed out because she's bad; she's being "protected" from being a single point of failure.

  ### 3. The Two-Year Plan

  **Months 1–6: Build Capital**
  Do not make a move yet. Attend every meeting. Volunteer for the boring stuff. Let the Chair see you are useful, not a threat. Build a relationship with her. Ask her about the history. Validate her immense contribution. You need her to like you enough to listen when you eventually push.
  *   *Avoid:* Challenging decisions in open meeting.
  *   *Do:* Ask questions in private. "I was looking at the accounts, how would we handle X if you were on holiday?"

  **Months 6–12: The "Bus Factor" Campaign**
  Start raising the issue of succession planning as a safeguard for *her*.
  "I know you're planning to stay on, but as trustees, we really ought to have a backup for the bank signatories. It's a Charity Commission best practice. I'd be happy to shadow you on the grant portal just so there's a second set of eyes."
  If she resists, don't fight. Just note the risk in the minutes. "Committee noted the risk of single-signatory dependency and agreed to review insurance coverage."
  Eventually, bring in an external voice. Can you afford a one-off consultation with a governance expert? Or find a trustee from another local charity to come talk about "compliance updates"? External pressure works better than internal rebellion.

  **Months 12–18: The Strategic Review**
  Once you have a second person on the bank account (or at least access to the portal), you have broken the monopoly. Now you can address the Drift.
  Propose a "Strategic Review." Frame it as: "We're 20 years old. Should we check we're still meeting the community's needs?"
  This isn't an attack on the current hub. It's a question of data. "Are we reaching the families we were set up for? If not, is that okay?"
  If the answer is "No, we're helping different people now," then you have a formal record that the mission has changed. That forces a conversation about whether the constitution needs updating to match reality, or if you need to set aside slots for the original demographic.

  **Months 18–24: Institutionalise**
  You need to change the rules so this doesn't happen again.
  *   **Term Limits:** Propose a cap on how long a Chair can serve (e.g., 6 years).
  *   **Separation of Roles:** Chair and Treasurer must be different people. This is standard governance.
  *   **Delegation Policy:** A written document stating what the committee decides vs. what the manager decides.

  ### 4. What to Avoid
  *   **Don't resign immediately:** You've spotted the rot. If you leave, nothing changes.
  *   **Don't rally the troops:** Do not try to gang up on the Chair with other committee members. It creates factions and she will smell a coup. Win people over one by one with the "Risk" argument.
  *   **Don't blame the staff:** The manager is just doing their job to keep the hub open. They are also victims of the drift.
  *   **Don't expect a perfect return to 2004:** You can't un-ring the bell. The charity is professionalised now. The goal isn't to fire the staff and go back to parents running it; it's to ensure the governance reflects the current size and that the original beneficiaries aren't locked out.

  ### 5. How to prevent recurrence
  You asked how to know the fix won't break in another fifteen years. You can't know, but you can build **friction**.

  The current system is too smooth. One person can steer the ship without resistance. You want a system that makes it slightly harder to change direction without consensus.
  *   **Regular Governance Audits:** Put a slot in the annual calendar: "Review of Terms of Reference."
  *   **Beneficiary Representation:** Reserve two committee seats for "Service Users" (parents). If the original families can't get a place, they should have a vote on the committee. That creates a direct feedback loop that prevents drift.
  *   **The "No" Muscle:** A healthy committee says "no" to things occasionally. If every grant application is automatically accepted, you are drifting. Train the committee to ask: "Does this fit our core purpose, or does it just pay the bills?"

  ### Summary
  Your mate is right that the slow drift is scarier, because you wake up one day and you're a different organisation. But the Chair is the lock on the door that keeps you from noticing.

  Pick the lock with "Risk Management," not "Morality." Be kind to the Chair, she's likely exhausted and feels indispensable. Make her feel like a stateswoman who is securing the legacy, rather than a dictator being deposed.

  If, after 18 months of gentle, risk-based pressure, she still refuses to share the bank login or discuss succession, then you have your answer. At that point, you call a vote based on fiduciary duty, not personality. But try the soft power first. In small charities, relationships are the only currency that spends.
