prompt: |-
  I've just joined the committee of a small local charity and it's turned into the most philosophically confusing thing in my life. It's about twenty years old. It started as a group of parents who set up a weekly Saturday session for kids with additional needs, run by the families themselves, for the families. Now it's a "community wellbeing hub" with three paid staff, three grant funders, a manager who's basically a CEO, and a constitution nobody's read since 2004. The families it was set up for mostly can't get a place.

  Two things are bothering me and I can't tell if they're the same problem or seperate ones.

  One: our chair. Eleven years in post. She's also the treasurer, holds the bank card, writes every grant application, and is the only person who can log into the funder portal. Nothing dodgy has ever happened. But I've noticed that when the committee votes against her, the thing doesn't happen. When I asked to write down the grant process so someone else could do it, she was hurt, and then nothing happened.

  Two: the drift. I've read the minutes. There is no meeting where anyone decided to become a wellbeing hub. It's twenty years of small sensible decisions, each one obviously fine on its own, and the sum of them is a different organisation wearing the same name. Nobody's to blame, or everyone is.

  A mate of mine who's into AI stuff said that's the two ways it goes wrong there as well: either one part of the system gets clever and starts accumulating power, or nothing dramatic happens and the whole thing slowly slides until it's optimising for something else entirely. He reckons the second one is the scarier of the two, which I don't really follow.

  So: which of these should I actually be worried about? Are they genuinely separate, or is one quietly making the other worse? Is there any way to tell from the inside which one is happening, or is that the whole problem? And what would you actually do — I've got maybe two years of monthly meetings in me before I either fix something or resign. What should I be trying to do, and what should I avoid because it'll just blow up a small volunteer thing that does mostly good work? And if I do fix it, how do I know the fix won't turn into the same problem again in fifteen years? I definately don't want a reading list, just your best thinking on my actual situation. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** New committee member of a small local charity (20 years old).
      *   **Context:** Started as parent-led support for kids with additional needs. Now a "community wellbeing hub" with paid staff, funders, a CEO-like manager. Original families largely excluded.
      *   **Constraints:** British English. No reading lists. Practical advice for a 2-year horizon. Wants "best thinking," not generic platitudes.
      *   **The Problems:**
          1.  *The Chair:* 11 years in post, also Treasurer, controls money/grants/access. Veto power by inaction. Resists documentation/succession planning.
          2.  *The Drift:* Mission creep over 20 years via small decisions. No formal pivot point. Original beneficiaries excluded.
      *   **The Friend's Analogy:** AI alignment problems (power accumulation vs. objective drift). User is skeptical about which is scarier.
      *   **Goal:** Fix something or resign in 2 years. Avoid blowing up a mostly good thing. Prevent recurrence.

  2.  **Deconstruct the Two Problems:**
      *   *Problem 1 (The Chair):* This is a governance failure. Concentration of power, lack of checks and balances, key person risk. It's acute and visible.
      *   *Problem 2 (The Drift):* This is a strategic/identity failure. Mission creep, loss of original purpose, beneficiary exclusion. It's chronic and invisible (until you look at the minutes).
      *   *Connection:* They are deeply linked. The Chair's longevity and control likely *enabled* the drift. Without a strong, rotating governance body to challenge the direction, the path of least resistance (grant money, professionalisation) was taken. The Chair *is* the mechanism by which the drift happened unchallenged.
      *   *AI Analogy:* The friend is right. Problem 1 is "instrumental convergence" (an agent acquiring power to achieve goals). Problem 2 is "specification gaming" (optimising for the wrong metric, e.g., funding survival vs. helping original families). Problem 2 is scarier because it's harder to detect and fix.

  3.  **Evaluate "Which to worry about?":**
      *   You can't fix the Drift without addressing the Chair. The Chair holds the keys to the strategy (via funding).
      *   You can't address the Chair without referencing the Drift (why does one person need to hold this much power? To keep the ship steady? But it's steering the wrong way).
      *   *Verdict:* They are the same problem manifesting differently. The governance structure (or lack thereof) allows both.

  4.  **Develop a Strategy (The 2-Year Plan):**
      *   *Constraint:* Don't blow it up. It does "mostly good work." Aggressive confrontation will fail. The Chair is likely devoted, just entrenched.
      *   *Phase 1: Observation & Relationship (Months 1-6).* Build trust. Don't attack. Acknowledge the good.
      *   *Phase 2: The "Bus Factor" Argument (Months 6-12).* Frame succession as risk management, not a power grab. Focus on insurance, not competence.
      *   *Phase 3: The Mission Review (Months 12-18).* Tie governance changes to a strategic review. "Are we still helping the kids?"
      *   *Phase 4: Institutionalise (Months 18-24).* Update constitution, term limits, delegation policy.

  5.  **Address Specific Questions:**
      *   *Separate or linked?* Linked. Governance vacuum allows drift.
      *   *Which is scarier?* The drift is the *outcome*, the Chair is the *cause/enabler*. Fix the governance to stop the drift.
      *   *How to tell?* Look at who benefits. If the org benefits (survival, staff) more than the beneficiaries (original families), it's drifted.
      *   *What to do?* Soft power. Risk framing. Small wins.
      *   *What to avoid?* Moralising, public confrontation, demanding immediate resignation.
      *   *Preventing recurrence?* Term limits, written delegation, regular strategic reviews.

  6.  **Drafting the Response (incorporating British English & Tone):**
      *   *Tone:* Empathetic, pragmatic, slightly cynical but constructive. Avoid jargon where possible.
      *   *Structure:*
          1.  Validate the friend's AI analogy (it's spot on).
          2.  Diagnose the link between the Chair and the Drift.
          3.  Prioritise the Chair (governance) as the lever to fix the Drift (strategy).
          4.  Actionable 2-year plan.
          5.  Safeguards for the future.
      *   *Key Insight:* The Chair isn't necessarily a villain; she's a martyr to the cause who became the bottleneck. Treat her with respect but remove the bottleneck.
      *   *Key Insight on Drift:* It's "grant-chasing." The org optimized for funder requirements, not family needs.

  7.  **Refining the Advice (Self-Correction during drafting):**
