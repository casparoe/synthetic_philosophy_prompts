      *   **Dev's Claim:** Cousin = Robot = Wind-up toy. Free will is an illusion.
      *   **User's Intuition:** That's too reductive, but struggles to articulate *why* without sounding like "humans are special magic."
      *   **Goal:** Decide whether to keep the demo for the club's presentation. Needs to know if there's a *real* difference worth highlighting.
