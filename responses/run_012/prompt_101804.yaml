      *Refining the "Loop" analysis:* Why did the cousin loop? She likely formed a hypothesis: "I need to step on the marked squares." She stepped on Fake, then Real. Then she doubted herself. "Did I do it right?" So she went back to check. This implies a *monitoring system* the robot lacks. The robot doesn't doubt. The human doubts. The looping is a bug in the monitoring system. The *recovery* is the feature.

