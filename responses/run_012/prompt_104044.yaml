answer: |-
  Your friend's deflationary view is technically correct but normatively empty. It dissolves the distinction you feel because it ignores *cost*. You are not asking whether history could have been different; you are asking whether the specific shape of the history we got imposes a tax on the present.

  Your tentative principle is close, but the Automobile case proves it cannot require the fork to be "near-arbitrary." If you keep that clause, you must discard your verdict on the Automobile. If you keep the Automobile verdict, you must discard "arbitrary."

  I recommend discarding "arbitrary." The principle that fits your verdicts is **The Principle of Contingent Crystallization.** It relies on two distinct clauses: one for **Lock-in** (how we got here) and one for **Mattering** (what it costs to stay here).

  ### The Principle

  **1. The Genesis Clause (Lock-in):** An outcome is locked in if, at the point of divergence ($t_0$), the choice was **functionally underdetermined**, and the subsequent dominance was driven by **increasing returns** (network effects, learning curves, infrastructure build-out) rather than inherent superiority.
  *   *Repair:* Note that "underdetermined" is not the same as "arbitrary." In the Automobile case, ICE did not win by coin flip; it won because small early advantages were amplified. That is still contingency. The fork need not be 50/50; it need only be sensitive to initial conditions that were not dictated by final utility.

  **2. The Friction Clause (Mattering):** A lock-in matters if the specific winner imposes **structural friction** on future agents, rather than merely **interface friction**.
  *   *Interface Friction:* Requires retraining the user to match the tool (e.g., fingers to keys).
  *   *Structural Friction:* Requires rebuilding the system or rethinking the logic to match the tool (e.g., tracks to trains, symbols to concepts).

  ### Mapping Your Cases

  Here is how the principle parses your verdicts, naming the clause each case pulls on.

  **The Standard Keyboard**
  *   **Verdict:** Locked in, Does Not Matter.
  *   **Genesis:** **Underdetermined.** QWERTY was not vastly superior to alternatives at $t_0$.
  *   **Friction:** **Interface.** The constraint is on the fingers, not the text. The output (letters on a page) is standardized regardless of input. The cost is retraining muscle memory, which is high for the individual but negligible for the system.
  *   **Why it fits:** You feel no regret because the *structure* of communication remains intact.

  **Electrical Supply (AC vs. DC)**
  *   **Verdict:** Not Locked In (Inevitable).
  *   **Genesis:** **Determined.** At the scale of a national grid, AC's physics (transformers/distance) made it functionally superior early on. Increasing returns accelerated a foregone conclusion.
  *   **Why it fits:** Fails the Genesis Clause. It wasn't underdetermined at the relevant scale.

  **Electrical Supply (50Hz vs. 60Hz)**
  *   **Verdict:** Locked In, Matters.
  *   **Genesis:** **Underdetermined.** Either frequency works for the physics of AC.
  *   **Friction:** **Structural.** Motors and transformers are built for one or the other. This is hardware incompatibility, not just user retraining.
  *   **Why it fits:** Passes both clauses.

  **Rail Gauge**
  *   **Verdict:** Locked In, Matters.
  *   **Genesis:** **Underdetermined.**
  *   **Friction:** **Structural.** Physical incompatibility strands systems.
  *   **Why it fits:** The archetype of Structural Friction.

  **The Zero Meridian**
  *   **Verdict:** Locked In, Does Not Matter.
  *   **Genesis:** **Underdetermined.**
  *   **Friction:** **None (Labeling).** Changing the zero requires adding or subtracting a constant in calculations. It imposes no friction on movement or thought, only a translation offset.
  *   **Why it fits:** Fails the Friction Clause. It is inert.

  **Calculus Notation**
  *   **Verdict:** Locked In, Matters.
  *   **Genesis:** **Underdetermined.** Leibniz and Newton reached the same content via different symbols.
  *   **Friction:** **Structural (Cognitive).** You identified the key difference from the Keyboard: "relearn how to see." Notation is not just an input method for math; it is the interface of *reasoning*. Bad notation obscures relationships; good notation reveals them. The friction is on the thought process itself, not just the hand.
  *   **Why it fits:** Distinguishes itself from Keyboard via the depth of the friction (Cognitive vs. Motor).

  **The Early Automobile (ICE vs. Electric)**
  *   **Verdict:** Locked In, Matters.
  *   **Genesis:** **Underdetermined (Sensitive).** This is the repair. At $t_0$, both were viable. ICE won not because it was inherently destined to, but because early contingencies (starter motor, fuel discovery) triggered increasing returns.
  *   **Friction:** **Structural (Infrastructural).** The lock-in required building a world for oil (pipelines, refineries, geopolitics) and accepting pollution.
  *   **Why it fits:** Requires you to accept that "contingent" does not mean "arbitrary." It means "sensitive to early history."

  ### The Repair

  To make your principle hold, you must accept one specific change: **You must abandon the requirement that the fork be "arbitrary."**

  Your intuition on the Automobile case is correct, and it breaks your draft principle. Lock-in does not require a coin flip; it requires **sensitivity**. If the early lead had gone to Electric (perhaps due to a different regulatory environment or a battery breakthrough in 1910), the increasing returns would have locked *that* in instead. The fact that ICE had functional advantages *ex post* does not mean it was determined *ex ante*.

  If you refuse this repair, you must discard your verdict on the Automobile. You would have to say: "The internal combustion engine was inevitable because it eventually proved more functional." But you explicitly said you don't believe that. So, keep the verdict, fix the principle.

  ### The New Case: The Language of Science

  **Application:**
  *   **Genesis:** **Underdetermined.** In 1900, German, French, and English were all viable candidates for the lingua franca of physics and chemistry. English won due to geopolitical shifts (WWI, WWII, US economic dominance), not because English grammar is better suited to quantum mechanics.
  *   **Process:** **Increasing Returns.** Publish in English $\to$ Cited more $\to$ Career success $\to$ More students learn English $\to$ Publish in English.
  *   **Friction:** **Structural (Cognitive/Economic).**
      *   *Cognitive:* Non-native speakers pay a "cognitive tax" reading and writing, slowing the diffusion of ideas. Nuance is lost in translation.
      *   *Economic:* Massive resources are spent on language training rather than research.
      *   *Exclusion:* Valuable research in non-English languages is ignored.

  **Verdict:**
  The principle implies: **Locked In, Matters.**
  It fits the **Rail Gauge** and **Calculus Notation** pattern. It is not like the **Meridian** (inert label) because language shapes the flow of information and access to careers. It is not like the **Keyboard** because the "output" (scientific understanding) is degraded by the input barrier, not just the input mechanism.

  **Where the Principle Stops:**
  The principle tells you that the dominance of English is contingent and costly. It does *not* tell you:
  1.  **Counterfactual Utility:** It cannot determine if German or French would have been *better*. (Perhaps English's lack of grammatical gender makes it slightly easier to learn, offsetting the friction? The principle is silent on the quality of the alternatives).
  2.  **Net Benefit:** It identifies the *friction* of the lock-in, but not the *benefit* of having a single language. A world with three competing scientific languages might have higher friction (translation costs between camps) than a world with one dominant language (learning cost for outsiders). The principle identifies the cost of the *specific* winner, but not necessarily the cost of *having* a winner.
  3.  **Exit Strategy:** It confirms switching is expensive, but it cannot calculate the tipping point where the cost of switching becomes lower than the cost of staying.

  ### Summary
  Your friend is right about the grain, but wrong about the cost. Your intuition is captured by **Contingent Crystallization**:
  1.  **Lock-in** exists when history, not just physics, selects the winner (Genesis Clause).
  2.  **Mattering** exists when the winner constrains the system's architecture or cognition, not just its interface (Friction Clause).

  The Automobile case forces you to admit that history can select a winner through amplification of small advantages, not just coin flips. The Language of Science case confirms that when the convention shapes the *flow of thought* rather than just the *labeling of objects*, the lock-in matters.
