  I'm a retired geologist — thirty-odd years on sediment cores and volcanic ash before I put the rock hammer away, and since then I've been trying to teach myself philosophy and decision theory, mostly by reading whatever I can find and arguing with friends. Last week a couple of old colleagues and I got going on scientific bandwagons: how a whole subfield can lurch onto one idea and then, ten years on, nobody can reconstruct why anybody believed it. I said it looked alot like the rational-herding / information-cascade stuff — that once a few people have moved, the next person's rational move is to ignore what they privately know and just follow, and then it locks in. My friend said thats just a fancy name for people being sheep, and that a genuinely rational person doesn't get trapped like that. I couldn't defend it and it's been bugging me ever since.

