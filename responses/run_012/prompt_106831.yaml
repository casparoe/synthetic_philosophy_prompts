      *   **Tone:** Deadpan officialese, British English (-ise endings), no-blame, flat.
      *   **Key Humour/Mechanism:** The mechanics of informational cascades must be accurate enough to make an economist laugh (not wince).
      *   **Specific Requirements:**
          *   Timeline: First two decisions based on private evidence (both misread the same memo -> correlated error).
          *   From 3rd signature onwards: No new information, rational inference based on predecessors' commitment (defensible inference at every step).
          *   Distinction: Between those who copied due to inferred information vs. those who copied due to reputational concerns (careerism/conformity), noting some held contrary private evidence.
          *   Fragility: Consensus evaporated upon one new public signal.
          *   Recommendations: Standard fixes (simultaneous disclosure, simultaneous voting, designated dissenter) + meta-recommendation (report on cascades in report-commissioning).
          *   Appendix: Table listing members, private belief, and vote.
          *   Length: Around 900 words.
          *   Format: Headings, Findings section, Appendix table.
          *   Constraint: No real firms/people, no citations (but can wave at "standard sequential-learning model").

  2.  **Deconstruct the Economics (Informational Cascades):**
      *   *Concept:* Individuals make decisions sequentially. They have private signals and observe prior actions. If prior actions outweigh private signals, a cascade starts where individuals ignore their own information and follow the herd.
      *   *The Twist:* Usually, cascades assume independent signals. Here, the first two signals are *correlated* (same misread memo). This makes the cascade fragile from the start.
      *   *Rationality:* Each person is acting rationally given their information set (including the observed actions of others). The report must emphasize this "rationality" to maintain the no-blame tone.
      *   *Reputational Cascade:* Some join because they don't want to be the lone dissenter (career concern), distinct from inferring information.
      *   *Fragility:* A small public signal breaks the cascade because the accumulated "weight" of previous votes was actually empty (no new info).

  3.  **Drafting - Section by Section:**

      *   **Header:** Formal report style. Confidential/Leaked vibe.
      *   **Title:** Internal Investigation Report: Project Oakwood (or similar).
      *   **Introduction:** Brief context. The "Cascade Incident".
      *   **Findings - The Initiation:** Members 1 & 2. Correlated error on Memo 44B.
      *   **Findings - The Propagation:** Members 3+. Rational inference. Reference "standard sequential-learning model".
      *   **Findings - Motivations:** Distinguish informational vs. reputational. Note private contrary evidence.
      *   **Findings - Fragility:** The collapse upon new signal.
      *   **Recommendations:** The standard fixes + the meta-joke.
      *   **Appendix:** The table.

  4.  **Drafting - Tone and Language:**
      *   British English: analyse, programme, centre, authorised, signalling (maybe signaling is fine in econ context, but stick to -ise generally), colour, defence.
      *   Officialese: "It was noted," "The Committee observes," "No adverse inference," "Procedural regularity."
      *   No Blame: "Defensible inference," "Rational weighting," "Understandable reliance."

  5.  **Drafting - Content & Word Count Check:**
      *   Need to ensure the economics is tight.
      *   Need to hit ~900 words.
      *   Need the table.

  6.  **Writing - Step-by-Step:**

      *   *Header:* INTERNAL INVESTIGATION REPORT: PROJECT OAKWOOD. CONFIDENTIAL.
      *   *Intro:* Review of the approval process for the Alt-Fi position.
      *   *Section 1: Initiation Phase.* Members A & B. Relied on Memo 12. Both interpreted "hedged" as "unlevered". Correlated error.
      *   *Section 2: Propagation Phase.* Members C through J. Observed A & B. Rational to assume A & B had info. Private signals ignored because public history outweighed them. This is the cascade.
      *   *Section 3: Motivational Heterogeneity.* Some followed info (rational), some followed reputational safety (careerism). Report notes this distinction gently.
      *   *Section 4: Fragility.* News release X caused immediate reversal. Shows lack of underlying conviction.
      *   *Recommendations:* Simultaneous voting, pre-commitment of views, Chief Dissenter. Meta-report.
      *   *Appendix:* Table.

  7.  **Refining the Economics:**
      *   Make sure to specify that from Member 3 onwards, private signals were *ignored*, not just outweighed. That's the cascade.
      *   Ensure the "correlated error" is clear. If A and B are independent, a cascade is robust-ish. If A and B saw the *same* flawed memo, the foundation is rotten.
      *   The "rationality" point is crucial. Member 3 isn't stupid; Member 3 thinks "A and B are experts, they said yes, so the probability of Yes is high enough to override my weak No signal."

  8.  **Refining the Tone:**
      *   Avoid words like "stupid," "blind," "panic."
