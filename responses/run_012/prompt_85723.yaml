answer: |-
  This is a sophisticated set of questions that cuts to the core of the "moral trade" proposal (most notably articulated by Toby Ord in 2014 and discussed within the effective altruism community).

  To answer your constraint first: **There is no philosophical consensus on moral trade.** It is not a settled theory like the theory of comparative advantage in economics; it is a normative proposal that is highly contested. It is generally accepted as *logically possible* under specific meta-ethical frameworks, but whether it is *morally permissible or required* is deeply disputed.

  Here is an analysis of the mechanics, the conditions for gain, and the philosophical presuppositions, distinguishing between the structural logic of the proposal and the contested normative claims.

  ### 1. Where the Gain Comes From (Comparative Advantage)

  **The Mechanism:**
  The gain in moral trade comes from **differences in marginal cost**, not necessarily differences in ultimate values. Even if two agents agree on what is good (e.g., reducing suffering), they may face vastly different costs to achieve it. However, in the specific case you described (Vegan vs. Global Poverty), they value different *goods*.

  **The Logic:**
  *   **Agent A (Vegan):** High cost to donate large sums (low income); Low cost to go vegan (likes tofu).
  *   **Agent B (Poverty):** High cost to go vegan (hates plant food); Low cost to donate (high income).

  If Agent A goes vegan, they produce $V_A$ value (by their lights). If Agent B donates, they produce $V_B$ value (by their lights).
  In a non-trade scenario, A goes vegan and B donates to poverty. Total value is $V_A + V_B$.
  In a trade scenario, A donates to poverty and B goes vegan.

  **The Gain:**
  For this to be a gain, Agent A must value the "B goes vegan" outcome *more* than the "A goes vegan" outcome, even though A cares primarily about animals. This implies A assigns some positive weight to B's moral goals, or A recognizes that B's "veganism" (perhaps done more strictly or influentially) produces more animal welfare than A's own.

  However, the standard model of moral trade usually assumes **pluralistic valuation**: A cares mostly about animals but somewhat about humans; B cares mostly about humans but somewhat about animals.
  *   **Gain Condition:** The trade creates a **Pareto improvement** over the non-cooperative baseline. Both agents end up in a world state they prefer to the world state where they acted alone.

  **Settled vs. Contested:**
  *   **Settled:** The logic relies on the economic principle of comparative advantage. If agents have different costs of production for moral "goods," specialization increases total output.
  *   **Contested:** Whether agents *should* specialize in moral goods they do not prioritize. Some argue this fragments moral integrity.

  ### 2. The Exchange Rate and Common Currency

  **The Problem:**
  You asked if a common currency is needed. In standard economics, money allows comparison of incommensurable goods. In moral trade, there is no universal "moral dollar."

  **The Solution (Local Barter):**
  Moral trade does not require a universal exchange rate to function bilaterally. It operates on **subjective exchange rates**.
  *   Agent A says: "I am willing to give up 1 year of veganism (cost $C_A$) if you donate $X$."
  *   Agent B says: "I am willing to donate $X$ (cost $C_B$) if you go vegan for 1 year."
  *   **The Rate:** The exchange rate is implicit in the ratio of the actions agreed upon (1 year veganism : $X$ dollars).

  **Condition for Genuine Improvement:**
  A trade is a genuine improvement (rather than both doing their second-best) if:
  $$Value_A(\text{B's Action}) > Cost_A(\text{A's Action})$$
  $$Value_B(\text{A's Action}) > Cost_B(\text{B's Action})$$

  This does not require a common currency. It only requires that each agent can rank the *cost to themselves* against the *benefit they perceive from the other's action*.

  **Settled vs. Contested:**
  *   **Settled:** Bilateral trade does not require a universal metric of value, only ordinal rankings of outcomes by each participant.
  *   **Contested:** Multilateral trade (involving many parties) becomes exponentially harder without a common metric. Furthermore, critics argue that without a common metric, you are merely satisfying preferences, not maximizing "The Good."

  ### 3. World-States and Ranking

  You asked: *"If each of them already ranks whole world-states... in what sense is the post-trade world better for either of them?"*

  This is the crux of the objection. If I am a consequentialist, I already prefer the world where the most good happens. Why do I need a trade to bring that about?

  **The Constraint Problem:**
  The issue is not ranking; it is **feasibility and incentives**.
  *   **World State 1 (No Trade):** I go vegan, you donate. I am sad I didn't donate; you are sad you didn't go vegan.
  *   **World State 2 (Trade):** I donate, you go vegan.
  *   **My Ranking:** I might actually rank World State 2 higher than World State 1, *even by my own lights*, if I believe your veganism is more impactful than mine, and I value the human lives saved by my donation more than the animal lives saved by my diet (weighted by my partial concern for humans).

  **Why Trade?**
  The "trade" is a mechanism to overcome a coordination failure. Without the agreement, I cannot *cause* you to go vegan. By offering my donation as a conditional incentive, I change your payoff structure, making World State 2 the rational choice for you.

  **Settled vs. Contested:**
  *   **Settled:** Moral trade assumes agents cannot simply command each other; they must alter incentives.
  *   **Contested:** Whether it is rational to value the fulfillment of another's moral preference over your own direct moral action.

  ### 4. Disagreeing vs. Agreeing Partners

  **Agreeing Partners (Same Values):**
  If we both agree that "Reducing Suffering is the only Good," moral trade collapses into **collaborative division of labor**.
  *   This is uncontroversial. If you are better at lobbying and I am better at research, we swap tasks.
  *   **Exchange Rate:** Determined by objective impact (e.g., QALYs per dollar).

  **Disagreeing Partners (Different Values):**
  If I value Animals and you value Humans, this is **moral trade proper**.
  *   **Difference in Kind:** Here, I am facilitating a goal I believe is *less important* than my primary goal.
  *   **The Risk:** This raises the "integrity" objection. Am I complicit in a project I deem suboptimal?
  *   **The Gain:** The gain exists only if I have *some* concern for your values (pluralism) OR if I believe that satisfying your preference prevents you from doing something harmful (negative utilitarianism).

  **Settled vs. Contested:**
  *   **Settled:** Collaboration among value-aligned agents is standard effective altruism.
  *   **Contested:** Trading with value-misaligned agents. Some argue this is morally required (to maximize total preference satisfaction); others argue it is morally forbidden (to compromise on the Truth of what matters).

  ### 5. Agent-Relative Duties (The Deontological Objection)

  You asked: *"Does the whole idea quietly presuppose that my obligations are about outcomes rather than about what I do?"*

  **Yes. This is the strongest constraint.**

  **Agent-Neutral (Consequentialist):**
  *   Duty: "Minimize suffering."
  *   Trade: Permissible. I don't care who minimizes it, as long as it happens. I can pay you to minimize it.

  **Agent-Relative (Deontological/Virtue Ethics):**
  *   Duty: "Do not eat meat" or "Keep your hands clean."
  *   Trade: **Impossible.**
  *   If my duty is *not to participate in animal killing*, I cannot outsource this. Paying you to go vegan does not discharge *my* duty to not eat meat. In fact, if I eat meat to facilitate the trade, I have violated my primary duty.

  **Settled vs. Contested:**
  *   **Settled:** Moral trade is incompatible with strict agent-relative constraints. It requires an agent-neutral framework (or at least one where agent-relative constraints are weak/overridable).
  *   **Contested:** Whether agent-relative constraints are valid. Proponents of moral trade generally argue against strict agent-relativity; critics often defend it.

  ### Summary of Consensus vs. Contention

  | Feature | Status | Explanation |
  | :--- | :--- | :--- |
  | **Logic of Gain** | **Settled** | Relies on standard comparative advantage (differences in marginal cost). |
  | **Exchange Rate** | **Contested** | No universal currency exists. Bilateral barter works on subjective valuation; multilateral requires contested interpersonal utility comparisons. |
  | **Agent-Neutrality** | **Settled** | Moral trade *requires* agent-neutral obligations. It is logically unavailable to strict deontologists. |
  | **Permissibility** | **Contested** | Is it moral to facilitate a "lesser" good? Some say yes (pluralism); some say no (moral integrity/truth). |
  | **World-State Ranking** | **Contested** | Requires agents to value the *other's* moral success. The degree to which one should value another's moral goals is not settled. |
  | **Collaboration vs. Trade** | **Settled** | Trading with value-aligned partners is division of labor. Trading with value-misaligned partners is the distinct (and controversial) case. |

  ### Conclusion

  The "gain" in moral trade is real **if and only if** you accept:
  1.  **Consequentialism/Agent-Neutrality:** Your duty is to bring about states of affairs, not to keep your own hands clean.
  2.  **Value Pluralism:** You assign non-zero value to the moral goals of those who disagree with you (or you value preference satisfaction itself).
  3.  **Subjective Valuation:** You do not need a common currency for bilateral trade, only a mutual agreement that the trade leaves you both better off (by your own respective lights) than the non-cooperative baseline.

  If you hold that your duty is to *do the right thing yourself* regardless of the global outcome, moral trade is not just difficult; it is conceptually incoherent for you. The framework does not solve the problem of incommensurable values; it sidesteps it by relying on local, subjective agreements rather than objective moral accounting.
