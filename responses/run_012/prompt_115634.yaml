  My friend and I burned like two hours last night arguing about whether "this strategy is dominated" is a fact about the strategy or a fact about the strategy together with whatever else is still on the table, and I want a concrete example that settles it, because he keeps insisting that if a move is strictly dominated by a mix of the other moves then thats just true of the move, full stop. I say deleting other stuff can make new dominances show up that werent there before, and I want a game where you can actually watch that happen.

  So build me a two-player game, three pure strategies each, and give me both payoff tables (rows are mine, columns are his, so every cell has two numbers). Requirements:

  1. One of his three columns is strictly dominated by a mix of his other two columns, but not by either of those columns on its own — no pure strategy of his does the job.
  2. My middle row is the unique best reply to that column. So as long as that column is still in play, the middle row is the right thing for me to play.
  3. Which should mean — verify this — that in the full game, before anything gets deleted, my middle row is NOT strictly dominated by any mix of my other two rows. He calls a row like that "dead on arrival" and I want to be able to say mine isnt one.
  4. Once his doomed column gets deleted, my middle row becomes strictly dominated by a mix of my top and bottom rows, and again not by either of those on its own.
  5. Spell out that at that point my middle row isn't a best reply to anything left — not to any mix of his remaining columns. Thats the bit that bugs me: same row, sensible in the big game, not sensible in the small one, and nothing changed except what we're allowed to look at.
  6. The deletion order has to be forced, so he cant say it depends on the order you go in: at each stage exactly one strategy is eliminable, and nothing else ever is. Tell me what survives at the end and why nothing else goes.
  7. The two-by-two thats left at the end shouldn't have any pure-strategy equilibrium, so the point isn't just an artifact of an obvious answer sitting there.
  8. Whole numbers only, nothing bigger than 5 or 6 in absolute value, so I can check the inequalities on the back of an envelope.

  Then do the verification for each numbered item — which mix dominates what, the actual inequalities, and specifically where the "not on its own" part comes from in 1 and 4. Then the honest part: which single feature of the construction is really doing the work, what happens if I drop it, and how my friend would attack the example. Also some of my requirements above are probably redundant given the others — say which ones and why, don't just quietly satisfy them. No references or reading lists, I want the object itself.

  Format: start the reply with the two payoff tables — the game itself, first thing, no preamble and no restating what I asked — then the checks.
