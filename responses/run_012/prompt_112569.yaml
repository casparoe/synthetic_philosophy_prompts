answer: |-
  **CONFIDENTIAL INVESTMENT MEMO**

  **TO:** Partner, Meridian Capital
  **FROM:** Elias Thorne, CEO, Axiom Flow
  **DATE:** October 14, 2023
  **SUBJECT:** Series B Participation – Axiom Flow

  **Problem**
  Enterprise resource planning remains fundamentally reactive. Conglomerates allocate capital and intermediate goods based on lagging indicators and internal transfer prices that do not reflect real-time scarcity. This creates friction between divisions, inventory bloat, and misallocation of productive capacity. Legacy systems treat price as an accounting output rather than an operational input.

  **Product**
  Axiom Flow is a B2B SaaS platform that ingests transaction data, supplier feeds, machine telemetry, and consumer preference signals—including self-reports, dwell time, and biometric feedback where compliant. Our engine emits an hourly vector of shadow prices covering every intermediate good and capital asset within the client's ecosystem.

  Clients use these vectors to instruct plants what to build. We are not a planning bureau; we are a decision support layer. We do not own the assets, we optimize the flow. We treat price not as a discovery mechanism but as a compressed data structure of known preferences. By aggregating dispersed data points into a central model, we render the calculation of value a technical challenge rather than a market phenomenon.

  **Traction**
  We are currently live with three Fortune 500 manufacturing clients. In pilot phases, the engine beat internal demand forecasts on stable, homogeneous SKUs by 14%. Stockouts were reduced to near zero in controlled environments. 

  To address the knowledge problem, we ship a local knowledge capture app. Floor workers file tips on machine variance and supply bottlenecks. This data is uploaded to the central engine, which may or may not consult it when updating the shadow price vector. This ensures specific knowledge is preserved without ceding allocation authority to the local node.

  **Unit Economics**
  Gross margins are 82%. We charge based on the volume of shadow prices computed. Because we replace internal accounting departments, net retention is 130%.

  **Risks and Mitigations**
  *Training Data Dependency:* We acknowledge the training signal is derived from external market prices. Critics argue this makes the model circular. However, transfer learning allows us to price non-market assets based on market proxies. We are not replicating the market; we are simulating its output with lower latency.

  *Risk Bearing:* Clients do not bear downside risk on shadow price variance. They pay for the vector, not the outcome. Legacy theory conflated the information problem with the incentive problem; we address them in separate layers. The model solves information via ingestion. Incentives are solved via KPI alignment.

  *Capital Goods Valuation:* The move from consumer goods to capital goods is where the case gets hard, as no secondary market exists for verification. We are currently applying the shadow vector to capital goods where no secondary market exists. We believe sufficient telemetry substitutes for ownership transfer.

  *Incentive Alignment:* Plant managers are paid to want what the plan wants. Compensation is tied to adherence to the shadow price vector. This eliminates deviation and ensures the plan is executed as modeled.

  **Ask**
  We are raising $500M at a $2B post-money valuation. Capital will be deployed to generalize the shadow price vector across all capital goods categories. Once achieved, the marginal cost of allocating any resource in the economy approaches zero. We are not selling software; we are selling the logic of allocation itself.

  **Elias Thorne**
  CEO, Axiom Flow
