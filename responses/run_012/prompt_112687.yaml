answer: |-
  You are absolutely right to be suspicious. Your intuition is spot-on: "Wisdom of Crowds" is not a single law of physics; it is a label slapped over three or four distinct mathematical and sociological phenomena. Your opponent used a slogan to shut down a philosophical objection, but the slogan only works if specific, fragile conditions are met.

  Here is the "Menu of Claims" you can bring to the next meeting. It breaks down the specific mechanisms hidden inside that phrase, the "fine print" required for them to work, and whether they actually apply to a debate club vote.

  ---

  ### The "Wisdom of Crowds" Menu

  #### 1. The Error Cancellation Model (Averaging)
  *   **The Claim:** Individuals make random errors when estimating a value. When you average their guesses, the high errors and low errors cancel out, leaving the truth.
  *   **Classic Example:** Guessing the weight of an ox. One person guesses 50 lbs too high, another 50 lbs too low; the average is perfect.
  *   **The Secret Fine Print:**
      *   **Independence:** My error cannot be caused by your error.
      *   **Continuous Variable:** This works for numbers (weight, temperature), not binary choices (True/False, Yes/No).
  *   **Is it True?** Yes, mathematically robust *for estimation tasks*.
  *   **Does it apply to Debate?** **No.** Debate votes are binary (Pro/Con), not numerical averages. You cannot average a "Yes" and a "No" to find the truth.

  #### 2. The Condorcet Jury Theorem (The Competence Model)
  *   **The Claim:** This is likely what your opponent meant. It states that if a group votes on a binary choice (Right vs. Wrong), the probability that the majority is correct **increases** as the group gets larger.
  *   **The Secret Fine Print:**
      *   **Competence ($p > 0.5$):** Every single voter must be *more likely than not* to choose the correct option individually. If the average voter is worse than a coin flip ($p < 0.5$), adding more voters makes the crowd **more likely to be wrong**.
      *   **Independence:** Voters must decide based on their own information, not by copying others.
  *   **Is it True?** Yes, but it is fragile. It relies entirely on the $p > 0.5$ condition.
  *   **Does it apply to Debate?** **Debatable.** Are your club members individually more likely to be right than wrong? If the motion is complex and the voters are uninformed, $p$ might be $< 0.5$, making the crowd "dangerously incompetent."

  #### 3. The Information Aggregation Model (Diversity)
  *   **The Claim:** No single person knows everything, but everyone knows something different. The crowd is wise because it pools diverse fragments of information to solve a complex problem.
  *   **The Secret Fine Print:**
      *   **Cognitive Diversity:** The group must approach the problem from different angles/backgrounds.
      *   **Decentralization:** People need access to local knowledge that others don't have.
  *   **Is it True?** Yes, for complex problem solving (like prediction markets).
  *   **Does it apply to Debate?** **No.** In a debate club, everyone hears the **same two speeches** at the **same time**. You are not aggregating diverse private information; you are aggregating reactions to the same public stimulus. This creates correlated bias, not diversity.

  #### 4. The "Truth by Consensus" Fallacy (The Opponent's Assumption)
  *   **The Claim:** The majority opinion *defines* truth, or is inherently superior simply because it is the majority.
  *   **The Secret Fine Print:** None. This is an appeal to popularity (*argumentum ad populum*).
  *   **Is it True?** **No.** History is full of majorities that were objectively wrong (e.g., geocentrism, segregation).
  *   **Does it apply to Debate?** This is often how votes are *treated* procedurally, but it is not an epistemic claim about truth.

  ---

  ### Which one was she leaning on?

  She was almost certainly leaning on **#2 (The Condorcet Jury Theorem)**, but she was ignoring the fine print.

  She wants you to believe that *Size = Accuracy*. She is assuming that because there are more people voting against you, the probability of them being right is mathematically higher.

  **However, you can dismantle this with two points:**

  1.  **The Independence Violation:** Condorcet's math breaks if voters are correlated. In your club, everyone hears the same arguments. If the opening speaker makes a compelling but logically flawed emotional appeal, *everyone* might be swayed by the same error. Their errors do not cancel out; they compound. This is called **Systematic Bias**.
  2.  **The Competence Threshold:** Condorcet's theorem only works if the average voter is competent ($p > 0.5$). If the debate topic is highly technical (e.g., "Resolved: Quantum Entanglement implies...") and the voters are laypeople, their individual probability of being right might be 40%. According to the math, **a larger crowd makes it *more* certain that the wrong answer wins.**

  ### How to use this next meeting

  When someone says "Wisdom of Crowds" again, don't say "The majority can be wrong." Say this:

  > "Wisdom of Crowds relies on the **Condorcet Jury Theorem**, which requires two conditions we don't meet.
  >
  > 1.  **Independence:** We all just heard the same two speeches, so our errors are correlated, not random.
  > 2.  **Competence:** The theorem proves that if the average voter is less than 50% likely to be right, a larger majority makes us *more* confidently wrong, not less.
  >
  > Unless you can prove every voter here is independently more likely to be right than wrong, the math doesn't support your claim."

  ### Summary for your pocket

  | Claim | Mechanism | Required Condition | Verdict for Debate Club |
  | :--- | :--- | :--- | :--- |
  | **Error Cancellation** | Averaging guesses | Random, independent errors | **False** (Votes aren't numbers) |
  | **Condorcet Theorem** | Majority probability | **Voters >50% competent + Independent** | **Fragile** (Fails if voters copy each other) |
  | **Info Aggregation** | Pooling knowledge | Diverse private info | **False** (Everyone hears same speeches) |
  | **Appeal to Popularity** | Majority = Truth | None (It's a fallacy) | **False** (History proves this wrong) |

  **The Bottom Line:** Your opponent is using a theorem about *independent experts* to justify a vote among *influenced peers*. The math is on your side, not hers.
