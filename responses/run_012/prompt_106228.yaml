      *   *Versions:*
          1.  **Original/Logical:** What is effectively calculable by a human following rules?
          2.  **Physical (CTT-P):** What can be physically computed in our universe?
          3.  **Strong (CTT-S):** What can be computed efficiently? (Usually distinct, but worth noting).
      *   *Status:* It is not a theorem. It cannot be proved mathematically because "effective procedure" is an intuitive notion, not a formal one.

  3.  **Brainstorming Defeaters/Counter-arguments:**
      *   *Hypercomputation:* Machines that compute non-recursive functions.
          *   Zeno machines (Supertasks).
          *   Analog computers (General Purpose Analog Computer - GPAC).
