          *   Relativistic computers (Malament-Hogarth spacetimes).
      *   *Human Cognition:* Penrose-Lucas argument (Gödelian arguments). Humans see truth of Gödel sentences machines can't prove.
      *   *Physical Laws:* Are physical constants computable? Is the wave function continuous in a way that encodes non-computable reals?
      *   *Falsifiability:* Is CTT a definition in disguise? If we find a counter-example, do we just say "that wasn't an effective procedure"?

  4.  **Structuring the Response:**
