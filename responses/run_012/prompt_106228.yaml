          2.  **Mid Tier (Serious Threat but Debated):** Relativistic Hypercomputation (Malament-Hogarth). It's physically consistent with GR but maybe not realizable. Analog computation with infinite precision (Shannon's GPAC vs. computable analysis).
          3.  **Lower Tier (Philosophical/Logical):** Penrose's Gödelian argument. Most logicians reject it, but it targets the "human" version specifically.
          4.  **Bottom Tier (Shrug):** Quantum speedup (user knows this), Oracle machines (these are mathematical abstractions, not physical claims), Chaos (user knows this).
