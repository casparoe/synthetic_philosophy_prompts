answer: |-
  ## Session Plan: The No-Trade Game

  **Goal:** Experiential demonstration of the No-Trade Theorem (Milgrom-Stokey / Aumann).
  **Time:** 90 Minutes.
  **Participants:** 12 (11 Traders, 1 Market Maker).
  **Materials:**
  *   **12 Envelopes:** 11 contain a card with an integer (1–10). 1 contains a "Market Maker" badge.
  *   **12 Score Sheets:** Pre-printed (see below).
  *   **Whiteboard/Projector:** To display the Market Price.
  *   **Pens.**
  *   **Reward:** A large bag of high-value candy (e.g., Ferrero Rocher or high-end chocolate). 1 Point = 1 piece. (Budget for ~150 pieces).
  *   **Plant Instruction Card:** A small slip of paper to hand to one specific Trader before the session starts.

  ---

  ### Part 1: Materials & Setup

  **The Cards (Private Information)**
  Prepare 11 cards with numbers between 1 and 10. Try to make the distribution varied (e.g., three 1s, three 10s, rest mixed). The **Asset Value** is the sum of all 11 Trader cards + 1 fixed number (say, 5) held by the Market Maker (or just sum the 11 and multiply by a factor to make math easier).
  *Correction for simplicity:* To make the "Sum of 12 numbers" work as requested:
  *   12 Envelopes.
  *   11 Envelopes: Numbers 1–10.
  *   1 Envelope: "Market Maker" (This person does not get a number, or gets a fixed number like 5 known to all).
  *   *Decision:* To keep the "12 secret numbers" constraint strict: All 12 draw numbers. One is *also* assigned the Market Maker role. They see their number, but their job is to set the price.
  *   **Asset Value (V):** Sum of all 12 cards.

  **The Score Sheet**
  ```text
  Name: _______________
  Role: [ ] Trader  [ ] Market Maker

  Initial Endowment: 1 Unit of Asset, 0 Points.
  Current Price (P): _______

  [ ] I HOLD (End: 1 Unit, 0 Cash)
  [ ] I BUY  (End: 2 Units, -P Cash)
  [ ] I SELL (End: 0 Units, +P Cash)

  Final Asset Value (V): _______ (Announced at end)
  My Final Score: (Units × V) + Cash = _______
  ```

  **The Plant Instruction (Hand to one Trader privately before start)**
  > "You are a 'Noise Trader.' Ignore your card number. In the Public Intention Round, declare 'BUY.' In the Trading Phase, attempt to BUY one unit regardless of the price or your number. Do not reveal this instruction to anyone. Act as if you are reasoning normally."

  ---

  ### Part 2: Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Deal envelopes. Assign Market Maker (MM). Hand Plant card. |
  | **10–20** | **Rules** | Read Instructions (Script A). Ensure comprehension. |
  | **20–30** | **Pricing** | MM calculates and posts Price. Traders observe. |
  | **30–40** | **Intent** | **Public Intention Round.** Crucial epistemic moment. |
  | **40–60** | **Trade** | Trading Phase. Orders executed with MM. |
  | **60–70** | **Reveal** | Collect cards. Calculate Total Value. Score sheets. |
  | **70–90** | **Debrief** | Discussion connecting game to theory (Script B). |

  ---

  ### Part 3: Instructions (Read Aloud)

  **Phase 1: The Rules (Minute 10)**
  > "Welcome. You are traders in a market. There is one asset. Its final value is the sum of the 12 numbers inside the envelopes you just received. You see only your own number.
  >
  > **Endowment:** You all start with exactly one unit of this asset.
  > **Goal:** Maximize your final score. Your score determines your share of the chocolate. 1 Point = 1 Piece.
  > **Market Maker:** [Name] is the Market Maker. They will post a single price on the board. They must buy or sell to anyone who wants to trade at that price.
  > **Trading:** You can do one of three things: Hold (keep your 1 unit), Buy (end with 2 units, pay the Price), or Sell (end with 0 units, receive the Price).
  > **Rationality:** Assume everyone in this room is rational and wants to maximize their chocolate. Assume everyone knows the numbers were drawn from 1 to 10.
  >
  > Do not talk about your numbers. Do not show your cards. If you trade, you do so privately with the Market Maker."

  **Phase 2: Market Maker Instructions (Whisper to MM at Minute 20)**
  > "Look at your number. Calculate the Expected Value of the total sum (Average card is 5.5. Total is roughly 5.5 × 12 = 66). Post a price on the board that you think is fair. You will be the counterparty to every trade. If you price badly and people trade, you will lose points. Try to minimize your loss."

  **Phase 3: Public Intention Round (Minute 30)**
  > "Before we open trading, we will go around the room. You must state out loud: 'I intend to Buy,' 'I intend to Sell,' or 'I intend to Hold.' You are not bound by this yet, but you must be honest about your *current* intention based on your number and the Price. This is public information."
  > *(Facilitator Note: Go around the circle. Write the counts on the board: e.g., 8 Buy, 3 Sell, 1 Hold.)*

  **Phase 4: Trading Phase (Minute 40)**
  > "Trading is now open for 15 minutes. Submit your score sheet decision to the Market Maker. The Market Maker records it. No side conversations."

  **Phase 5: Reveal (Minute 60)**
  > "Trading closed. Please hand me your cards. I will sum them now."
  > *(Facilitator sums the numbers on the whiteboard while participants calculate their scores.)*
  > "The Total Asset Value is [X]. Calculate your final points. Collect your chocolate."

  ---

  ### Part 4: The Debrief (Minute 70–90)

  *Do not mention "No-Trade Theorem" yet.*

  **Step 1: The Market Maker's Pain (5 mins)**
  *   **Ask MM:** "How did you set the price? Did you lose points?"
  *   **Point:** The MM likely set a price near the average (e.g., 66). If trade happened, the MM likely lost points. Why? Because the people who traded against them had *information* the MM didn't fully account for.
  *   **Ask Group:** "If you chose to Sell, why did you sell?" (Answer: "My number was low, I thought Total would be lower than Price.") "If you chose to Buy, why?" (Answer: "My number was high.")

  **Step 2: The Public Intention Curdle (10 mins)**
  *   **Ask:** "Look at the Public Intention Round counts. If you saw 10 people say 'Buy' and you were about to say 'Sell', did you hesitate?"
  *   **The Logic:** "If everyone is rational, and everyone wants to maximize points, why would someone want to Buy? They must believe the Value is higher than the Price. If you see 10 people wanting to Buy, they collectively hold 10 pieces of information suggesting Value is High. If you hold 1 piece of information suggesting Value is Low, whose information should weigh more?"
  *   **The Trap:** "If you are rational, you should update your belief based on *their* willingness to trade. If you update, you should switch to Buy. If everyone does this, everyone wants to Buy. If everyone wants to Buy, who Sells? No one. Trade should collapse."
  *   **Reveal:** "This is the core of the No-Trade result. Willingness to trade is itself a signal. If we know everyone is rational, we shouldn't be able to disagree enough to trade."

  **Step 3: The Plant & The Break (10 mins)**
  *   **Reveal the Plant:** Ask the Plant to stand up. Reveal their instruction.
  *   **Ask:** "How does this change the logic?"
  *   **The Answer:** "The Plant breaks **Common Knowledge of Rationality**. Now, when you see someone Buy, you don't know if they know something (Information) or if they are the Plant (Noise). This uncertainty allows trade to happen again. You can say, 'They are buying, but maybe they are the noise trader, so I can still sell.'"
  *   **Connect:** "In real markets, we assume there are 'noise traders' or liquidity traders. Without them, purely informational trade vanishes."

  **Step 4: Price as Epistemic Claim (5 mins)**
  *   **Ask:** "What was the Price on the board?"
  *   **Point:** "The Price wasn't just a number. It was a claim about what the Market Maker knew. When you traded against it, you were betting that the Market Maker's claim was wrong. But the Market Maker's claim aggregates *everyone's* potential knowledge. To bet against the price is to bet against the collective intelligence of the room. The theorem says: if you know the room is smart, you can't beat the room."

  ---

  ### Part 5: Predictable Failure Modes & Fixes

  **1. "Polite" Trading (The Altruism Bug)**
  *   **Problem:** Grad students often want the group to succeed. They might trade to "help the Market Maker learn" or just to make the game interesting, ignoring their own score.
  *   **Fix:** In the instructions, emphasize: *"Your chocolate allocation is strictly individual. There is no group bonus. If you trade poorly, you lose chocolate. If the Market Maker loses points, they get less chocolate. Do not sacrifice your snack for the group."*

  **2. The Market Maker Panic**
  *   **Problem:** The MM might set a price of 1 or 100 to avoid trading, or freeze up.
  *   **Fix:** Whisper to the MM during the pricing phase: *"A safe price is roughly 6.5 times 12, which is 78. Start there. You cannot avoid trading, so just pick the expected value."*

  **3. The Plant Blows Cover**
  *   **Problem:** The Plant laughs or acts suspiciously during the Public Intention Round.
  *   **Fix:** Instruct the Plant beforehand: *"Your goal is to remain undetected until the debrief. If you act too obviously, the experiment fails. Treat your card seriously, even if you ignore it."*

  **4. Math Paralysis**
  *   **Problem:** Summing 12 numbers and calculating `2*Value - Price` takes time and kills momentum.
  *   **Fix:** Have a spreadsheet open on your laptop. As you collect cards at Minute 60, type them in. Project the Total Value immediately. Have participants use phone calculators for their scores.

  ---

  ### Part 6: Limitations (What You Must Supply)

  *Be honest in the debrief. The game is a metaphor, not a proof.*

  **1. Common Knowledge of Rationality (CKR)**
  *   **The Gap:** In the game, you *told* them everyone is rational. In reality, I (the facilitator) know that some of you are tired, some of you hate math, and some of you are risk-averse. You don't *actually* know everyone else is rational.
  *   **The Theory:** The No-Trade Theorem requires infinite recursion: "I know that you know that I know..." You cannot instantiate this in a room. You have to explain that the theorem assumes a level of epistemic transparency we don't have.

  **2. Risk Neutrality**
  *   **The Gap:** The game pays in chocolate. People are risk-averse with snacks. Someone with a '10' card might still Sell at a fair price just to lock in a guaranteed win, rather than gambling on the Total.
  *   **The Theory:** The theorem assumes risk neutrality. In the debrief, acknowledge that risk aversion is a valid reason to trade (hedging), which the theorem abstracts away.

  **3. The "Plant" vs. Real Noise**
  *   **The Gap:** We used one specific person as noise. In real markets, noise is structural (liquidity needs, shocks).
  *   **The Theory:** Explain that the Plant represents the "noise trader" assumption required to make markets function. Without noise, liquidity dries up because everyone becomes too afraid of informed counterparties.

  **4. One-Shot vs. Repeated**
  *   **The Gap:** This was one round. In repeated markets, reputation matters.
  *   **The Theory:** Mention that in repeated games, agents might trade to signal or build reputation, which complicates the No-Trade result.

  **Closing Line for the Session:**
  > "Today you felt the paralysis of perfect information. The market froze because you became too afraid of what the other person's willingness to trade told you. The only thing that unfroze it was the possibility of irrationality. In philosophy of economics, we often ask: does the market work because we are rational, or because we are unpredictable enough to trust each other?"
