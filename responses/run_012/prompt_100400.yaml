      *   **Task 5:** If the parallel is weak, sketch a better analogy.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Popper's Stance:* Popper famously fluctuated. In the 1970s (e.g., "Unended Quest"), he called Darwinism a metaphysical research programme because "survival of the fittest" seemed tautological (fitness = survival). Later (1978 onwards), he recanted somewhat, admitting it *could* be testable, but maintained the structural similarity between knowledge growth and evolution was profound.
      *   *The Analogy:* Conjectures = Mutations/Variations. Criticism/Tests = Environmental Selection. Surviving Theories = Fit Organisms. Transmission = Publication/Education (vs. Genetics).
      *   *The Verdict:* Popper argues that because the *structure* is identical, the core principle ("fit things survive") is logically similar, and if one is metaphysical/tautological, the other might be too (or at least, the core schema is).
      *   *Criticism:* Many philosophers of biology (e.g., Hull, Campbell) and science (e.g., Lakatos) have engaged with this. The "tautology" charge is largely considered resolved in biology (fitness is defined independently of survival via traits), but Popper's epistemological point remains interesting.

  3.  **Drafting the Audit (Task 1):**
      *   *Variation:* Genetic mutation/recombination $\leftrightarrow$ Creative conjecture/hypothesis generation.
      *   *Selection Pressure:* Environmental constraints/predation $\leftrightarrow$ Empirical testing/logical consistency/criticism.
      *   *Environment:* Ecological niche $\leftrightarrow$ Problem situation/State of knowledge.
      *   *Inheritance:* DNA/Reproduction $\leftrightarrow$ Publication/Teaching/Citation.
      *   *Timescale:* Generations (slow) $\leftrightarrow$ Intellectual cycles (fast/variable).

  4.  **Identifying Breaks in the Mapping (Task 2):**
      *   *Biology $\to$ Epistemology gaps:*
          *   Blindness: Mutations are blind to need. Conjectures are often *directed* by the problem (Lamarckian elements).
