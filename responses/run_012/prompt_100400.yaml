      *   *The Tautology Charge:* Popper's main worry is "Survival of the fittest" = "Those who survive, survive." In science, "Survival of the truest" is not tautological because we have independent criteria for truth-content (corroboration). In biology, fitness *is* reproductive success. This is the crux.

