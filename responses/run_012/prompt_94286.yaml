      *   The inference breaks because it assumes a binary: Either it's a flimsy social agreement (like money) OR it's a biological fact (like gravity).
      *   *Third Option:* It is a *materialized social fact*. It is as real as a highway system. You can't legislate a highway away instantly, but humans built it.

