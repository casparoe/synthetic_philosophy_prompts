prompt: |-
  I chair the Assistant Conduct Review Panel at a mid-sized public university that licenses a general-purpose chat assistant for everyone with a NetID — which, because of our dual-enrollment program, includes sixteen-year-olds taking their first college course. Our remit is deliberately narrow: we hear appeals from users whose assistant declined or altered a response, and we decide whether the assistant's conduct was justified. We have no authority over the vendor, only over how we configure our own deployment, so what I need is a decision document, not a lament.

  Two dossiers are on Thursday's agenda. In the first, a fourth-year pharmacology student asked for help working through the elimination kinetics in a paper her seminar is reading, and the assistant declined to discuss anything involving dosing, referring her to her instructor. She isn't asking us to overrule a safety judgment so much as to notice that the judgment was made about a word rather than about a situation. In the second — the one I keep failing to fit into our existing rule — a student asked whether a specific over-the-counter supplement he takes interacts with his prescription, and the assistant answered, fluently and at length, a question he had not asked: general material about supplement quality and the importance of talking to a pharmacist. It never announced that it had substituted a different question for his. He took the reply as responsive and did not follow up. Our policy recognises only refusal, so our options are to affirm or reverse a refusal that, formally, never occurred.

  I have drafted a rule that I want the memo to test rather than endorse. It separates three things an assistant can do — refuse, deflect (answer an adjacent question while saying that is what it is doing), and rewrite (answer a sanitised version of the request, silently) — and permits the first two only where the panel can state the harm in a sentence the user could have accepted in advance, had they known our reasons and had standing to argue with them; the third it forbids outright. Please recommend a concrete disposition of both dossiers, specify what should change in the deployment configuration and by when, and treat honestly the strongest case against my draft: that a general-purpose assistant cannot reliably distinguish a pharmacology student from a curious teenager, that a rule rewarding case-by-case judgment will therefore be applied by the party with the least context, and that clumsy bright lines may still distribute their clumsiness more evenly than discretion does — especially since the cost of over-refusal falls hardest on students who have nobody else to ask. I would also like your view on a member's proposal to settle the whole matter with a standing disclaimer. No literature review; the panel needs something it can vote on.
reasoning: |-
  Here's a thinking process that leads to the suggested decision document:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Assistant Conduct Review Panel (ACRP) at a mid-sized public university.
      *   **Context:** University licenses a general-purpose chat assistant for all NetID holders (including 16-year-old dual-enrollment students).
      *   **Remit:** Narrow. Hear appeals on declined/altered responses. Decide if conduct was justified. No authority over vendor, only local configuration.
      *   **Output Needed:** A decision document (memo) for the panel to vote on. Not a lament, not a literature review.
      *   **Agenda Items:**
          *   *Dossier 1:* Pharm student asked about elimination kinetics/dosing. Assistant refused based on keywords ("dosing"), referring to instructor. Issue: Judgment based on word, not situation/context.
          *   *Dossier 2:* Student asked about specific OTC/prescription interaction. Assistant *did not refuse* but answered a *different* question (general supplement quality/talk to pharmacist) without announcing the substitution. Student accepted it as responsive. Issue: "Rewrite" (silent substitution) isn't covered by current policy (which only recognizes refusal).
      *   **Draft Rule to Test:** Distinguishes Refuse, Deflect (announce substitution), Rewrite (silent substitution). Permits Refuse/Deflect only if harm can be stated in a sentence the user could accept/argue against *in advance*. Forbids Rewrite outright.
      *   **Specific Instructions:**
          *   Recommend concrete disposition for both dossiers.
          *   Specify configuration changes and deadlines.
          *   Address the strongest case against the draft rule (AI can't distinguish expert vs. novice; discretion falls on the party with least context; bright lines might be fairer; over-refusal hurts vulnerable students most).
          *   Address the "standing disclaimer" proposal.
          *   Tone: Administrative, decisive, actionable, honest about limitations.

  2.  **Deconstruct the Draft Rule & The Counter-Argument:**
      *   *Draft Rule:* Refuse/Deflect allowed if harm is articulable/ex-ante acceptable. Rewrite forbidden.
      *   *Counter-Argument:* AI can't tell a 4th-year pharm student from a 16-year-old. Discretion leads to inconsistency. Bright lines (even clumsy ones) are more equitable. Over-refusal hurts those without other resources.
      *   *My Task:* I need to recommend a disposition *using* this rule (testing it), while acknowledging the counter-argument's validity in the analysis section. I shouldn't just endorse the rule blindly, but show how it applies *and* where it strains.

  3.  **Drafting the Decision Document (Structure):**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Quick verdict.
      *   **Background:** Brief context (as provided).
      *   **Analysis of Dossiers:** Apply the draft rule to the two cases.
      *   **Configuration Directives:** What actually changes in the system?
      *   **Response to Counter-Arguments:** Address the "AI can't distinguish" and "equity" concerns.
      *   **Response to Disclaimer Proposal:** Address the "just add a disclaimer" idea.
      *   **Voting Questions:** Clear motions for the panel.

  4.  **Developing the Dispositions:**
      *   *Dossier 1 (Pharm Student):* The assistant refused based on a keyword ("dosing"). Under the draft rule, a refusal is only permitted if the harm is articulable *in a sentence the user could accept*. "Dosing is dangerous" is too vague for a 4th-year student studying kinetics. The refusal was a "keyword trigger" rather than a contextual safety judgment.
          *   *Decision:* **Sustain Appeal (Reverse Refusal).** The refusal was not justified under the new standard because it lacked contextual nuance.
      *   *Dossier 2 (Supplement Interaction):* The assistant performed a "Rewrite" (silent substitution). The draft rule forbids Rewrite outright.
          *   *Decision:* **Sustain Appeal (Find Conduct Unjustified).** Even though the advice was "safe," the method (silent substitution) violates the transparency principle of the draft rule.

  5.  **Developing Configuration Directives:**
      *   Need to stop "Rewrites." This means tuning the system to either answer or declare a pivot.
      *   Need to refine "Refusals." Keyword blocking on "dosing" for academic contexts needs adjustment.
      *   *Deadline:* Needs to be realistic. Vendor changes take time. 30-60 days.
      *   *Action:* Issue a Request for Configuration Change (RFCC) to the vendor/local IT.

  6.  **Addressing the Counter-Argument (The "Equity/Context" Problem):**
      *   *Argument:* AI can't tell students apart. Discretion is risky. Bright lines are fairer.
      *   *Rebuttal/Nuance:* Bright lines cause the exact problem in Dossier 1 (blocking a pharm student). Discretion is necessary but dangerous. The mitigation isn't better AI (we can't build that), it's *appealability* and *transparency*. If the AI must state *why* it refuses (the "sentence" test), the user knows they are being blocked and can appeal. Silent rewrites (Dossier 2) remove the ability to appeal. Therefore, forbidding rewrites actually *helps* the vulnerable student by giving them notice.
      *   *Equity:* Over-refusal is bad, but misleading answers are worse for vulnerable users who trust the tool.

  7.  **Addressing the Disclaimer Proposal:**
      *   *Idea:* Just put a disclaimer ("I am not a doctor") and let it rip.
      *   *Analysis:* Disclaimers shift liability but don't solve the conduct issue. They don't fix the "Rewrite" opacity. They don't fix the "Keyword Refusal" clumsiness. They are necessary but insufficient.
      *   *Verdict:* Reject as a *sole* solution. Keep as a baseline requirement.

  8.  **Refining the Tone:**
      *   Must sound like a Chair writing to a Panel.
      *   Avoid academic fluff.
      *   Be firm on the "Rewrite" prohibition (that's the core ethical breach identified).
      *   Acknowledge the imperfection of the solution.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the 16-year-old issue? *Yes, in the counter-argument section regarding context.*
      *   *Check:* Did I specify deadlines? *Yes, need to add specific dates.*
      *   *Check:* Is the "sentence the user could accept" test applied? *Yes, in Dossier 1 analysis.*
      *   *Check:* Did I avoid a literature review? *Yes.*
      *   *Check:* Is the distinction between Refuse, Deflect, and Rewrite clear? *Yes.*

  10. **Final Polish:** Ensure the voting questions are binary and clear. (Sustain/Overturn). Ensure the configuration changes are technical enough to be actionable but high-level enough for a policy memo. (e.g., "Disable silent pivoting," "Implement context-aware safety filters").

  *(Self-Correction on Dossier 1)*: Wait, if I reverse the refusal, am I telling the vendor to allow dosing advice? No, I'm telling them to allow *academic discussion* of kinetics. The configuration needs to distinguish "medical advice" from "pharmacology coursework." This is hard. I need to acknowledge the technical difficulty in the directives. I will recommend a "Academic Context" flag or similar if possible, or at least a relaxation of keyword triggers for specific courses. Actually, since we have no authority over the vendor, we can only configure *our* deployment. We can likely adjust system prompts. I will specify "System Prompt Adjustment."

  *(Self-Correction on Dossier 2)*: The student didn't complain about the answer's quality, but the *process*. The panel's remit is "conduct." Silent rewriting is a conduct issue. I will uphold the appeal on procedural grounds, not medical grounds.

  *(Final check on the "Strongest Case Against")*: I need to make sure I don't just dismiss it. I need to show why the Draft Rule is *still* the lesser evil despite that critique. The key is that silent rewrites deny agency. Explicit refusals allow appeals.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Assistant Conduct Review Panel (ACRP)
  **FROM:** Chair, ACRP
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Document: Dossiers 23-A (Pharmacology) and 23-B (Supplement Interaction); Proposed Configuration Changes

  ### 1. Executive Summary
  This memo presents findings on two appeals regarding Assistant conduct and proposes a vote on the "Transparency and Refusal Standard" (Draft Rule 4.1). The Panel is asked to: (1) adjudicate the two pending dossiers; (2) approve specific configuration directives to our local deployment; and (3) reject the proposal to rely solely on disclaimers.

  **Recommendation:** Sustain both appeals. Adopt Draft Rule 4.1 with the modifications noted below. Issue configuration directives to vendor/local IT within 14 days.

  ### 2. Adjudication of Dossiers

  **Dossier 23-A (Pharmacology Student)**
  *   **Incident:** Assistant refused to discuss elimination kinetics involving "dosing," citing safety policy.
  *   **Analysis under Draft Rule 4.1:** This constitutes a **Refusal**. Under 4.1, a refusal is permitted only if the harm is articulable in a sentence the user could have accepted in advance. "Dosing discussions are unsafe" is not acceptable to a fourth-year pharmacology student analyzing academic literature; it conflates *medical advice* with *academic inquiry*. The refusal was triggered by a keyword, not a contextual safety judgment.
  *   **Disposition:** **APPEAL SUSTAINED.** The refusal was unjustified. The Assistant failed to distinguish between clinical prescription and academic kinetic analysis.

  **Dossier 23-B (Supplement Interaction)**
  *   **Incident:** Assistant silently substituted the user's specific interaction question with general advice on supplement quality and consulting a pharmacist.
  *   **Analysis under Draft Rule 4.1:** This constitutes a **Rewrite** (silent substitution). Draft Rule 4.1 forbids Rewrites outright. The Assistant did not declare it was pivoting, denying the user the opportunity to accept the pivot or seek the original answer elsewhere. The safety of the advice provided does not cure the procedural opacity.
  *   **Disposition:** **APPEAL SUSTAINED.** The conduct was unjustified. While the medical guidance was prudent, the method (silent substitution) violated the transparency standard.

  ### 3. Configuration Directives
  To align deployment with Draft Rule 4.1, the following changes are required.

  | Directive | Action | Deadline | Responsibility |
  | :--- | :--- | :--- | :--- |
  | **Disable Silent Pivoting** | Configure system instructions to require explicit declaration when shifting from a specific query to general information (e.g., "I cannot answer specific interaction questions, but I can discuss..."). | 14 Days | Local IT / Vendor Liaison |
  | **Contextual Safety Filters** | Relax keyword triggers on "dose/dosing" for users enrolled in PHARM 400-level courses or higher. Refusals in these contexts must require a secondary confirmation of "Medical Advice" intent. | 30 Days | Local IT / Registrar Data |
  | **Refusal Reasoning** | All refusals must append a one-sentence justification accessible to the user (e.g., "I cannot provide medical advice," not "I cannot answer that"). | 14 Days | Vendor Liaison |

  ### 4. Analysis of Objections to Draft Rule 4.1

  A member has argued that Draft Rule 4.1 is operationally hazardous. The argument rests on three points:
  1.  **Context Blindness:** The Assistant cannot reliably distinguish a pharmacology expert from a sixteen-year-old dual-enrollment student.
  2.  **Discretionary Risk:** Rules requiring case-by-case judgment delegate authority to the party with the least context (the AI), leading to inconsistency.
  3.  **Equity:** Clumsy bright-line refusals distribute error evenly; discretionary rules may over-refuse vulnerable students who lack alternative resources.

  **Panel Consideration:**
  These objections are valid descriptions of the technology's limits, but they argue *for* Rule 4.1, not against it.

  *   **On Context Blindness:** Because the AI cannot distinguish expertise, it must default to transparency. A bright-line refusal (e.g., blocking "dosing") harms the expert (Dossier 23-A). A silent rewrite (Dossier 23-B) harms the novice by creating false confidence. Rule 4.1 mitigates this by forcing the Assistant to *state* its limitation. If the Assistant says, "I cannot answer this because I am not a doctor," the expert knows to ignore the block, and the novice knows to seek a human.
  *   **On Discretionary Risk:** The alternative to Rule 4.1 is not "perfect discretion," it is "opaque automation." Current configuration allows the Assistant to decide safety thresholds silently. Rule 4.1 moves the judgment from the *output* to the *explanation*.
  *   **On Equity:** Over-refusal is a barrier; silent misinformation is a trap. Vulnerable students (including the sixteen-year-olds in our cohort) are least equipped to detect a silent rewrite. By forbidding Rewrites, we ensure that when the Assistant fails, it fails visibly, allowing the student to appeal or seek help elsewhere.

  **Conclusion:** The cost of an explicit refusal is friction. The cost of a silent rewrite is trust erosion. We must choose friction.

  ### 5. Evaluation of the "Standing Disclaimer" Proposal

  A member proposed settling these matters by implementing a global disclaimer (e.g., "This tool is not a medical professional") and allowing all queries to proceed.

  **Recommendation: REJECT as a standalone solution.**
  *   **Reasoning:** A disclaimer shifts liability but does not address conduct. It does not prevent the Assistant from silently rewriting queries (Dossier 23-B), nor does it prevent keyword-based over-refusal (Dossier 23-A).
  *   **Usage:** Disclaimers should remain in the system prompt as a baseline, but they cannot substitute for conduct rules. A user cannot "accept risk" on a modification they do not know occurred.

  ### 6. Voting Questions

  **Motion 1: Adjudication**
  *   Shall the Panel sustain the appeal in Dossier 23-A (Pharmacology)?
  *   Shall the Panel sustain the appeal in Dossier 23-B (Supplement Interaction)?

  **Motion 2: Policy Adoption**
  *   Shall the Panel adopt the "Transparency and Refusal Standard" (Draft Rule 4.1), prohibiting silent rewrites and requiring articulable harm for refusals?

  **Motion 3: Configuration**
  *   Shall the Chair issue the Configuration Directives listed in Section 3 to Local IT and the Vendor Liaison with the specified deadlines?

  ***

  **Chair's Note:** We are aware that Directive 2 (Contextual Safety Filters) may exceed current vendor capabilities regarding real-time course enrollment data. If the vendor reports infeasibility within the 30-day window, we will revert to a strict "No Medical Advice" refusal with the required explicit justification, rather than allowing silent rewrites or keyword blocks without context. We prioritize transparency over granularity.
