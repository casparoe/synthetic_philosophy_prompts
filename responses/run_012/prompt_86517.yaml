answer: |-
  ### Menu of Readings: "Absence of Evidence is Not Evidence of Absence"

  **1. The "Incomplete Search" Reading**
  *   **Claim:** The search space has not been adequately examined; nobody has yet looked where the evidence would be.
  *   **Verdict:** **Simply False** (in your context).
  *   **Condition:** Requires that investigations have been cursory or non-existent.
  *   **Licenses:** A suspension of judgment and a call for further investigation.
  *   **Application:** Invalid here. You stipulated "years of investigation."

  **2. The "Invisible Trace" Reading**
  *   **Claim:** The alleged fact is metaphysical or physical in such a way that it inherently leaves no detectable traces (e.g., a thought, a ghost, or a perfectly clean poison).
  *   **Verdict:** **Substantive** (but likely **False** for physical disasters).
  *   **Condition:** Requires independent reason to believe the event is undetectable by nature.
  *   **Licenses:** Cessation of empirical search; the claim is moved to the realm of faith or pure theory.
  *   **Application:** Invalid for most disasters (explosions, crashes, structural failures leave debris).

  **3. The "Likelihood" Reading (Your Position)**
  *   **Claim:** The failure to find what we would expect to find under a hypothesis is itself evidence against it.
  *   **Verdict:** **Substantive and Defensible** (Mathematically sound).
  *   **Condition:** Requires that $P(\text{Evidence} | \text{Hypothesis}) > P(\text{Evidence} | \text{No Hypothesis})$. If the hypothesis makes evidence *more probable* than the null, missing evidence lowers the hypothesis's probability.
  *   **Licenses:** Downgrading confidence in the hypothesis. It demonstrates the friend's aphorism is **False** under standard probabilistic reasoning.
  *   **Application:** Valid. If a cover-up were real, we would expect leaks, inconsistencies, or whistleblower testimony. The absence of these lowers the probability of a cover-up.

  **4. The "Concealment" Reading**
  *   **Claim:** The hypothesis predicts its own concealment (e.g., "A powerful cover-up ensures no evidence remains").
  *   **Verdict:** **Substantive** (Defensible only with independent motive/means).
  *   **Condition:** Requires that the mechanism of concealment is part of the core hypothesis, not an ad hoc addition.
  *   **Licenses:** Treating missing evidence as neutral rather than negative.
  *   **Application:** This is the only reading that saves the friend's aphorism. It asserts $P(\text{No Evidence} | \text{Cover-up}) \approx 1$.

  **5. The "Burden of Proof" Reading**
  *   **Claim:** The sentence is a procedural rule about who must argue, not a claim about confirmation. It means "You cannot prove a negative, so the claimant must provide positive proof."
  *   **Verdict:** **Platitude** (Logically correct but rhetorically weak).
  *   **Condition:** Applies to dialectical norms, not empirical probabilities.
  *   **Licenses:** Declaring the claimant has failed to meet their obligation. It does not prove the claimant *wrong*, only that they have not won.
  *   **Application:** Valid as a debate rule, but does not explain why the lack of evidence doesn't *hurt* the theory after years of scrutiny.

  ***

  ### Final Analysis: The Friend's Position

  **Which reading is he relying on?**
  He must be relying on **Reading 4 (The Concealment Reading)**, likely disguised as **Reading 5 (Burden of Proof)**.
  *   Reading 5 protects him from having to prove his case, but it does not protect his theory from being disconfirmed by data.
  *   Only Reading 4 allows him to claim that the *absence itself* is consistent with his theory. He is arguing that the "cover-up" mechanism explains the "absence of evidence."

  **Does this reading collapse?**
  **Yes.** It collapses into **unfalsifiability**.
  *   For the aphorism to hold here, the probability of finding no evidence given the cover-up ($P(\neg E | H)$) must be roughly equal to the probability of finding no evidence given no cover-up ($P(\neg E | \neg H)$).
  *   If the friend claims that *any* lack of evidence is due to the cover-up, he is asserting that no possible observation could count against his view.
  *   If a hypothesis is compatible with both the presence of evidence (if they slipped up) and the absence of evidence (if they succeeded), but the "success" is assumed whenever evidence is missing, the hypothesis is immune to empirical refutation.
  *   **Verdict:** He can hold Reading 4 only by accepting that his belief is not empirically testable. If he insists it is a factual claim about the physical world, Reading 3 (Likelihood) overrides his aphorism, and the absence of evidence *is* evidence of absence.
