answer: |-
  # Decision Tree: The Metaphysics of Generations

  **Root Commitment:** Birth cohorts differ in measurable, durable ways (media use, institutional expectations, work attitudes).

  **Node 1: Explanatory Status**
  Does the term "Generation" explain *why* these differences exist (by picking out a unified entity), or does it merely name *that* they exist (by labeling an aggregate)?
  *   **Yes (Unified Entity):** Go to Node 2.
  *   **No (Aggregate/Label):** Go to Node 5.

  **Node 2: Ground of Unity**
  Is the unity of the generation grounded in properties *internal* to the members (shared psychology or causal imprint), or in their *external* position relative to historical events and other cohorts?
  *   **Internal:** Go to Node 3.
  *   **External (Positional):** **Leaf A: Relational Realism.**

  **Node 3: Mind-Dependence (The Looping Test)**
  If the label "Millennial" or "Boomer" were erased from culture and no one identified with it, would the generation still exist as a unified group? (i.e., Does membership require self-conscious uptake?)
  *   **No (Independent):** Go to Node 4.
  *   **Yes (Dependent/Looping):** **Leaf B: Social Constructionism.**

  **Node 4: Causal Specificity**
  Is the group individuated by a *single, specific common cause* (e.g., a specific crisis that imprinted all members), or by a *cluster of coincident traits* without a single unifying mechanism?
  *   **Single Common Cause:** **Leaf C: Robust Realism.**
  *   **Cluster of Traits:** **Leaf D: Deflationary Realism.**

  **Node 5: Status of the Label**
  If "Generation" is merely a label for an aggregate, what is its normative or pragmatic status in discourse?
  *   **Useful Convenience:** **Leaf E: Pragmatic Nominalism.**
  *   **Explanatorily Empty:** **Leaf F: Eliminativism.**
  *   **Harmful Distortion:** **Leaf G: Ideological Critique.**

  ---

  ## The Leaves

  ### Leaf A: Relational Realism
  **Description:** Generations are real, but their reality is structural, like "eldest child" or "tenant." A Boomer is defined by being born before the cultural shift of the 70s, not by a specific psychological imprint.
  *   **Reference Class Answer:** Boundaries are fixed by historical inflection points (e.g., the fall of the Berlin Wall), not biological time. The 20-year window is accidental; the boundary is where the *context* shifts.
  *   **Awkward Commitment:** You must admit that a Boomer born in 1964 may have more in common intrinsically with a Gen Xer born in 1964 than with a Boomer born in 1945.

  ### Leaf B: Social Constructionism
  **Description:** The generation is brought into being by the label itself. Marketers and sociologists name the group, members adopt the identity, and this feedback loop creates the cohesion.
  *   **Reference Class Answer:** Boundaries are set by the agents of the looping effect (media, census bureaus). They are arbitrary but become real through enforcement and uptake.
  *   **Awkward Commitment:** You must admit the kind might cease to exist if we simply stopped talking about it.

  ### Leaf C: Robust Realism
  **Description:** Generations are genuine social kinds individuated by a shared formative experience that causally imprints members during a sensitive developmental period.
  *   **Reference Class Answer:** The 20-year window corresponds to the span of a specific causal mechanism (e.g., the duration of the Cold War). Boundaries are non-arbitrary facts about when the cause began and ended.
  *   **Awkward Commitment:** You must explain why the boundary is 1981 and not 1982 without appealing to convention or marketing data.

  ### Leaf D: Deflationary Realism
  **Description:** Cohort differences are real statistical distributions, and the "kind" is nothing over and above that distribution. There is no deep essence, only a cluster of correlated traits.
  *   **Reference Class Answer:** The 20-year window is a heuristic for statistical significance. Boundaries are fuzzy sorites boundaries, not sharp lines; we draw them where the variance becomes too high.
  *   **Awkward Commitment:** You must admit the "kind" has no causal power over and above the individuals that comprise it.

  ### Leaf E: Pragmatic Nominalism
  **Description:** Only individuals exist. "Generation" is a *flatus vocis* (breath of voice), but a convenient one for shorthand communication.
  *   **Reference Class Answer:** The boundaries are purely conventional, like time zones. They are justified solely by utility, not by ontology.
  *   **Awkward Commitment:** You must admit you are using a fiction you know to be false every time you use the term seriously.

  ### Leaf F: Eliminativism
  **Description:** "Generation" is a failed hypothesis. Like "phlogiston," it posits a unity that empirical scrutiny dissolves. Talk of generations should be dropped from serious explanation.
  *   **Reference Class Answer:** There is no right to the window. The 20-year span is a pseudoscientific artifact that obscures class, geography, and age effects.
  *   **Awkward Commitment:** You must propose a better vocabulary that doesn't lose the predictive power cohort talk currently provides.

  ### Leaf G: Ideological Critique
  **Description:** Generation-talk is not an ontological error but a political tool. It functions to fragment class solidarity or sell products by manufacturing false identities.
  *   **Reference Class Answer:** Boundaries are set by capital (marketing demographics) or power (political gerrymandering of age groups). They are arbitrary by design to maximize division or profit.
  *   **Awkward Commitment:** You must explain why the fiction persists if it doesn't benefit anyone powerful (e.g., why ordinary people use it amongst themselves).

  ---

  ## Logical Space Diagnostics

  **Unoccupied Combinations:**
  1.  **Relational Constructionism:** (Node 2: External + Node 3: Dependent). This position holds that generations are defined by historical position, *but* that this position only matters because people recognize it. It is unoccupied here for parsimony, as it collapses into **Social Constructionism** (if the recognition does the work) or **Relational Realism** (if the history does the work).
  2.  **Robust Anti-Realism:** (Node 1: Label + Node 5: Harmful, but with a belief in underlying causality). This is the **Ideological Critique**, but a version that admits the causal differences are real while claiming the *label* is harmful is logically possible but rare. It is diagnosed here as unstable: if the differences are real, the label tracks something; if the label distorts, it usually implies the differences are not as the label claims.

  **Indistinguishable Leaves:**
  *   **Deflationary Realism (D) vs. Pragmatic Nominalism (E):** These are difficult to separate empirically. Both agree there is no deep essence. The distinction rests on whether a "statistical distribution" counts as an "entity."
      *   *Further Question Needed:* "Is the distribution itself a legitimate target of causal explanation, or only a summary of individual causes?" If the former, Deflationary Realism; if the latter, Nominalism.

  **Reference Class Note:**
  Every leaf must address the "20-year" problem. Notice that only **Robust Realism** claims the window is naturally fixed. **Relational Realism** fixes it by event. **Constructionism** and **Critique** fix it by power. **Nominalism**, **Eliminativism**, and **Deflationary Realism** admit the arbitrariness but differ on whether that arbitrariness matters.
