answer: |-
  # Part 1: The Student Handout

  **Seminar: Self-Reference and Formal Limits**
  **Exercise: The String-and-Enzyme System**

  **1. The Components**
  *   **Nucleotides:** The basic units are **A, C, G, T**.
  *   **Complements:** A pairs with T; C pairs with G. (A↔T, C↔G).
  *   **Strands:** A sequence of nucleotides written left-to-right. In this exercise, strands must be between 8 and 24 nucleotides long. You will represent these using paper strips.
  *   **Codons:** The strand is read in non-overlapping pairs from the left (e.g., `AC GT CA...`). A strand of 2n nucleotides yields n codons.
  *   **Enzymes:** A strand specifies an enzyme. The enzyme is the sequence of amino acids (letters **a** through **h**) determined by looking up each codon in the Code Table below.

  **2. The Code Table**
  *Use this to translate your Strand into an Enzyme.*

  | Pair | Amino Acid | | Pair | Amino Acid |
  | :--- | :---: | :--- | :--- | :---: |
  | **AA**, **AC** | **a** | | **GA**, **GC** | **e** |
  | **AG**, **AT** | **b** | | **GG**, **GT** | **f** |
  | **CA**, **CC** | **c** | | **TA**, **TC** | **g** |
  | **CG**, **CT** | **d** | | **TG**, **TT** | **h** |

  *Note: The code is degenerate. For example, both `AA` and `AC` produce enzyme part `a`.*

  **3. The Operations**
  *Once translated, the enzyme acts on a strand. Each amino acid triggers one operation.*

  | Symbol | Operation | Effect |
  | :--- | :--- | :--- |
  | **a** | **Cut** | Sever the strand between the current nucleotide and its right-hand neighbour. The enzyme stays on the left-hand piece. |
  | **b** | **Delete** | Remove the current nucleotide. The enzyme stays on the nucleotide that shifts into this place (or falls off if none do). |
  | **c** | **Copy** | Append a copy of the current nucleotide to the *right-hand end* of the strand. |
  | **d** | **Switch** | Replace the current nucleotide with its complement (A↔T, C↔G). |
  | **e** | **Insert** | Insert a copy of the current nucleotide's complement immediately to the *left* of the current nucleotide. |
  | **f** | **Step** | Move the enzyme one nucleotide to the right. |
  | **g** | **Turn** | Reverse direction. The next operation applies to the nucleotide now under the enzyme. |
  | **h** | **Halt** | The enzyme detaches. Execution stops. |

  **4. Running an Enzyme**
  1.  Place the enzyme on the **leftmost** nucleotide, facing **right**.
  2.  Perform the operations in the order of the amino acid sequence.
  3.  If you reach the end of the amino acid sequence without halting, cycle back to the first amino acid and continue.
  4.  Execution stops if: you hit **Halt (h)**, the enzyme falls off either end, or the facilitator calls time.
  5.  **Boundary Rule:** If an operation requires a neighbour that does not exist (e.g., Cutting at the far right), the enzyme falls off and halts.

  **5. Mandatory Worksheet**
  *You cannot claim a result without a completed trace. One sheet per proposed strand.*

  | Step | Enzyme Pos | Facing | Current Nuc | Amino Acid | Operation | Strand State (Write changes clearly) |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | 1 | 1 | → | | | | |
  | 2 | | | | | | |
  | 3 | | | | | | |
  | ... | | | | | | |

  ***

  # Part 2: The Session Plan

  **Duration:** 90 Minutes
  **Participants:** 14 Students (7 Teams of 2)
  **Materials:**
  *   14 Handouts.
  *   14 Worksheets (plus spares).
  *   50 Paper Strips (pre-printed with grid cells for nucleotides).
  *   14 Pens, 7 Pairs of Scissors.
  *   1 'Turing Token' (a distinct object, e.g., a painted wooden block).
  *   Whiteboard and markers.

  **Timeline & Facilitator Actions**

  **00:00 – 00:10: Introduction & Distribution**
  *   **Action:** Distribute handouts. Do not lecture. State the goal: "Build a strand that, when run, produces a copy of itself."
  *   **Cue:** "You are not solving a puzzle for me. You are engineering a system. The worksheet is your logbook. If it isn't traced, it didn't happen."
  *   **Stakes:** Introduce the **Turing Token**. "The first team to demonstrate stable self-replication wins the Token. Holders of the Token choose the opening question of the debrief."

  **00:10 – 00:30: Boot Camp (Constraint & Mechanics)**
  *   **Task:** All teams must run the same provided example to verify understanding.
  *   **Example Strand:** `AC GT AC GT` (Enzyme: `a b a b`).
  *   **Action:** Walk the room. Check traces. Look for confusion on 'Cut' vs 'Delete' and index shifting.
  *   **Staged Moment 1 (Self-Devour):** Point out a team that accidentally deletes its own codons using `b`. Ask them to announce: "We broke our own gene."
  *   **Hard Stop:** At 00:30, collect worksheets. Correct any systemic misunderstandings on the board immediately.

  **00:30 – 01:10: The Design Challenge**
  *   **Task:** Design a strand (8-24 nucleotides) that replicates itself.
  *   **Rule:** You may test your enzyme on *any* strand in the room, not just your own.
  *   **Action:** Circulate. Do not give solutions. Use the Hint Ladder (see Part 4) only when a team is stuck for >5 minutes.
  *   **Staged Moment 2 (Cross-Contamination):** Encourage teams to swap strands. "Try your enzyme on Team 3's strand." This forces the realisation that the enzyme is separate from the data it acts on.
  *   **Observation:** Watch for teams trying to make the strand *be* the enzyme directly. They will fail because of the Code Table.
  *   **Hint Deployment:** Most teams will hit the wall of the Code Table (many-to-one mapping). They will find a strand that makes the right enzyme, but the enzyme changes the strand so it no longer makes that enzyme.

  **01:10 – 01:25: The Rule Change (The 'Cheat')**
  *   **Action:** Call time. Announce: "New Rule. The prohibition is lifted. You may now write a strand where the nucleotides directly spell out the amino acid sequence. A=a, C=c, G=g, T=t. The Codon Table is suspended for your new designs."
  *   **Effect:** Replication becomes trivial. A strand `c f c f...` can be written directly without worrying about `CA` vs `CC`.
  *   **Discussion:** Ask: "Why was that easier?" Listen for "No translation."
  *   **Cue:** "The difficulty wasn't the copying. It was the describing."

  **01:25 – 01:30: Close & Token Award**
  *   **Action:** Award the Turing Token (even if no one fully succeeded, award it for the closest attempt or best trace).
  *   **Transition:** Move immediately to debrief.

  ***

  # Part 3: Stakes & Scoring

  *   **The Turing Token:** A physical object passed to the winning team.
  *   **Value:** Purely symbolic but confers "First Rights" in the debrief (they ask the first question or make the first observation).
  *   **Pressure:** Low monetary value, high social value within the seminar. It prevents lethargy without inducing panic.
  *   **Verification:** A replication claim is only valid if the worksheet trace shows the strand length doubling while preserving the original sequence prefix, and the enzyme remains valid for the new strand.

  ***

  # Part 4: The Hint Ladder

  *Hand these out physically if a team requests help. Do not read them aloud to the room.*

  **Hint 1 (Mechanical):** "Check your trace at the moment the strand length changes. Does your enzyme position update correctly relative to the new end? Remember, the enzyme cycles."
  **Hint 2 (Structural):** "You are trying to make the strand describe itself. But the Code Table is many-to-one. Many strands make the same enzyme. Does your strand need to be unique, or just functional?"
  **Hint 3 (The Obstruction):** "You are trying to write instructions in a language that changes as you write them. What if the instructions didn't change the language? Consider the Rule Change coming later."

  ***

  # Part 5: Predictable Failures & Interventions

  **1. The 'Static Strand' Error**
  *   **Failure:** Students calculate the enzyme once and assume it stays valid even as the strand changes length or sequence.
  *   **Intervention:** Stop them. "Re-calculate the enzyme after step 5. Has the codon at position 1 changed?" Force them to see the moving target.

  **2. The 'Index Drift'**
  *   **Failure:** When using `Insert` or `Delete`, students lose track of which nucleotide is 'current'.
  *   **Intervention:** Provide a physical marker (a paperclip) to represent the enzyme head. Make them physically slide it along the paper strip.

  **3. The 'Infinite Loop' Panic**
  *   **Failure:** Teams create a cycle that never halts and assume they have failed because they haven't reached 'h'.
  *   **Intervention:** Clarify: "Replication is a process, not a halt. If it doubles and continues, that is success. I will call time."

  **4. The 'Magic Code' Assumption**
  *   **Failure:** Teams assume there is a specific 'key' strand they must guess (like the CAGG example in the facilitator notes).
  *   **Intervention:** Remind them: "There are many solutions. The problem is the structure, not the specific sequence."

  ***

  # Part 6: The Debrief

  **Mapping Moments to Concepts**
  1.  **Strand as Instruction & Object:** When teams realised changing the strand changed the enzyme, they felt the dual role of DNA (data and program).
  2.  **Fixed Point:** Successful replication is a fixed point where *Encode(Strand) → Enzyme → Operate(Strand) = New Strand*.
  3.  **Many-to-One Code:** When teams found different strands produced the same enzyme, they touched on code degeneracy.
  4.  **Level-Crossing:** The enzyme (protein) acting on the strand (DNA) is a category jump.
  5.  **The Rule Change:** Showing that bypassing the code makes it trivial proves the code was the barrier.

  **Steering Questions**
  1.  **Question:** "When you tried to copy the strand, why did the enzyme often stop working halfway through?"
      *   **Target Answer:** Because copying changed the codons, which changed the enzyme instructions mid-execution.
      *   **Misconception:** That the enzyme is independent of the current state of the strand.
  2.  **Question:** "Why did the Rule Change make replication easy?"
      *   **Target Answer:** Because we removed the translation layer. We didn't have to encode the instructions into a different alphabet.
      *   **Misconception:** That the difficulty was in the copying operation itself.
  3.  **Question:** "If the strand describes the enzyme, and the enzyme builds the strand, who is describing whom?"
      *   **Target Answer:** It is a loop. There is no outside describer.
      *   **Misconception:** That there must be an external 'designer' logic.

  **Closing Statement**
  "This exercise is an isomorphism of Gödel's arithmetisation. In your system, the Strand is the mathematical statement, and the Enzyme is the proof operation. The Code Table is the Gödel numbering scheme. You found that for a system to verify itself, it must be able to encode its own verification rules within its own language. The obstruction you felt—the difficulty of making the strand stable while it changes—is the same obstruction that leads to incompleteness. A system powerful enough to describe its own replication is powerful enough to construct a statement that says 'I cannot be replicated.' You have felt the limit."

  ***

  # Part 7: Limitations

  This activity cannot reproduce the diagonal construction itself. The students manipulate existing rules; they do not derive the undecidable sentence. You must assert that the logical move from 'self-replication is hard' to 'truth is unprovable' requires a step of negation this system does not model. Furthermore, the activity implies the code is a logical necessity; you must assert that the real genetic code's specific mapping (why AA is 'a') is a historical accident, not a logical truth. Finally, the incompleteness result relies on the system being consistent; this simulation does not prove consistency, only the structural difficulty of self-reference.

  ***

  # Part 8: Variants

  **25-Minute Compression (Fire Drill)**
  *   **00-05:** Distribute handout. Explain rules rapidly.
  *   **05-15:** Boot Camp only. All teams run the `AC GT AC GT` example. Facilitator demonstrates the 'Self-Devour' moment on the board.
  *   **15-20:** Announce the Rule Change immediately. Show how trivial replication becomes with direct mapping.
  *   **20-25:** Debrief. Focus entirely on the difference between the Boot Camp (hard) and Rule Change (easy). Skip the design challenge.

  **Two-Hour Extension (Reading Group)**
  *   **Add Phase:** 'Evolution and Error'. Introduce a 5% chance per operation that a nucleotide mutates (swap letter).
  *   **Task:** Teams must design a strand that not only replicates but is *robust* to mutation.
  *   **Discussion:** This allows exploration of error-correcting codes and whether self-reference requires stability.
  *   **Add Phase:** 'The Negation'. Allow a new amino acid `i` (Invert) which swaps the meaning of the Code Table (A becomes T, etc.) globally. Ask if a strand can survive its own inversion. This bridges closer to the logical negation in Gödel's proof.

