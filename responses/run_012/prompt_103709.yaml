  # Part 9: Rule Changes & Justifications

  I have made one clarifying addition to the rules on the handout under **4. Running an Enzyme**: the **Boundary Rule**.
  *   **Change:** "If an operation requires a neighbour that does not exist (e.g., Cutting at the far right), the enzyme falls off and halts."
  *   **Why:** The original rules imply operations might fail silently or cause confusion at the edges (e.g., `Insert` at the leftmost position). In a live session, ambiguity here causes arguments about validity. Explicit boundary conditions ensure all teams share the same physics of the system without altering the logical core.

  I have also interpreted the **Late-Game Rule Change** specifically as bypassing the Codon Table.
  *   **Interpretation:** "Nucleotides directly spell out the amino acid sequence."
  *   **Why:** The prompt requires showing that "the one-wayness of the real code was doing [the work]". If students can write `c` directly as a nucleotide rather than encoding it as `CA` or `CC`, the burden of translation vanishes. This isolates the *coding* as the source of complexity, distinct from the *operation* of copying.
