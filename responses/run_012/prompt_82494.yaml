      **INTERNAL MEMO: PEOPLE OPERATIONS**
      **TO:** All Staff
      **SUBJECT:** Q3 Wellbeing Measurement Protocol Update

      Effective next quarter, the annual Engagement Survey will be discontinued. Moving forward, employee wellbeing will be measured exclusively via revealed preference. Stated sentiments are classified as cheap talk; only actual choices constitute valid data. Below are frequently asked questions regarding the new framework.

      **1. Why is my feedback no longer being solicited?**
      Surveys measure what employees say they want, not what they actually value. Under the Revealed Wellbeing Protocol, preference is defined by choice. If you select an option, you have revealed it as preferable to the alternatives. Therefore, it is logically impossible to choose against your own preference. Complaints regarding selected benefits are categorized as data entry errors.

      **2. What if I would have preferred cash instead of the free team lunch?**
      Preference is only measurable over the available choice set. Cash was not on the menu. Since you selected the pizza, you revealed a preference for pizza over the null option. Hypothetical alternatives outside the offered bundle are irrelevant to the model. You cannot reveal a preference for something you were not permitted to choose.

      **3. What happens if my choices appear inconsistent?**
      Rationality requires transitivity (if you prefer A to B, and B to C, you must prefer A to C). If our logs detect cyclical choices (A>B, B>C, C>A), this is flagged as a compliance anomaly. Employees exhibiting intransitivity will be mandated to attend Choice Hygiene Coaching to align their decision matrices with organizational logic.

      **4. I keep choosing the pizza, but I feel miserable afterwards.**
      Wellbeing is operationalized at the moment of selection. Post-choice affect is exogenous noise. The act of selection consummates the utility; subsequent regret does not retroactively invalidate the revealed preference. If you consistently choose options that correlate with low retention, a specialist will review your file to optimize your future choice architecture.

      **5. How will wellbeing be reported to leadership?**
      The Quarterly Wellbeing Index will rank employees against one another based on the volume and consistency of their beneficial choices. High-performing units will be highlighted in the all-hands newsletter. Employees in the bottom quartile will be asked to review the benefit catalog more thoroughly.

