prompt: |-
  I'm helping my uncle put together a book about the old Barrowclough mill in our town — he worked there for 22 years before it shut in 1987, and he's got the board minutes, the local paper archives, and about thirty interviews with people who were on the shop floor. He's fallen out with his mate Raj, who used to teach A-level economics, over how the book should be written. Raj says the book doesn't actually explain anything: it just tells the story of what happened, one thing after another. A real explanation, he reckons, would show that the closure was bound to happen given the general forces at work — the decline of British textiles, the exchange rate, production shifting abroad — and that what happened here is just one instance of a pattern you'd see in a hundred other towns. My uncle says the general stuff doesn't tell you why ours went under in '87 while the works in the next town limped on till '94, and that the explanation just is the specific sequence: the 1979 decision to buy the new looms instead of retooling, the bank pulling the overdraft, the board vote that went 4–3 against the merger. He's also got a chapter he wants to write about what would have happened if the bank had said yes, and Raj thinks that's just fiction.

  I'm not asking you to settle a family row, but I would like to know who's got the better of the argument, and more practically, how my uncle should write the thing so that it's a genuine explanation and not just a chronicle with a sad ending. I did a module on philosophy of science years ago and I've got a feeling there's a definately a real issue here that neither of them is quite putting their finger on, but I can't remember what it's called.

  Take the role of someone who works on explanation in history and the social sciences and has thought about this hard. Have a proper think before you answer — maybe start by sketching what an explanation is even supposed to do in a case like this, then work through the case with that in hand. Don't fob me off with "both perspectives have merit", and don't give me generic advice about writing vivid history. Keep the whole thing to 450 words max, and open with the bottom line in a sentence or two before you unpack it.
