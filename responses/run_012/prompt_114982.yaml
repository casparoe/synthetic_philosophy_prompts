  # Decision Tree: Methodological Positions in Consciousness Science

  **Starting Commitment:** Consciousness is a natural phenomenon and should be studied empirically.
  **Scenario:** A subject in a binocular-rivalry task reports, *"I saw the face, then the house, alternating."*

  ### **Node 1: The Status of the Report**
  Do you file this utterance primarily as **evidence about a private experience** (the report points to something internal), or as **verbal behavior** (the report is the public datum to be explained)?
  *   **Private Experience:** Go to Node 2.
  *   **Verbal Behavior:** Go to Node 8.

  ---

  ### **Path A: The Report is Evidence About Experience**

  ### **Node 2: Source of Descriptive Categories**
  Did the experimenter use specific phenomenological distinctions (e.g., Husserlian retention/protention) to **design the task categories up front**, or are the categories generated by the subject during the experiment?
  *   **Designed Up Front:** **Front-loaded Phenomenology**.
      *   *Awkward Commitment:* You must assume your own phenomenological analysis is correct before collecting any data.
  *   **Generated by Subject:** Go to Node 3.

  ### **Node 3: Reliability of Naive Reports**
  Are the subject's initial, untrained reports treated as **reliable data**, or is specialized **training required** to make them usable?
  *   **Reliable (Naive):** **Naive Introspectionism [UNOCCUPIED]**.
      *   *Status:* **Unattractive.** Abandoned after the 1920s because naive reports are demonstrably unstable and suggestible.
  *   **Training Required:** Go to Node 4.

  ### **Node 4: Experimenter Expertise**
  Does the experimenter need to undergo **similar phenomenological training** to validate the subject's reports, or is the subject the sole "instrument"?
  *   **Experimenter Also Trained:** **Contemplative / Second-Person Methods**.
      *   *Awkward Commitment:* You cannot study consciousness in populations (e.g., infants, patients) who cannot undergo years of contemplative training.
  *   **Subject is Sole Instrument:** Go to Node 5.

  ### **Node 5: Authority of Third-Person Measures**
  Do third-person measures (EEG, fMRI, psychophysics) have the **authority to correct** the subject's first-person report?
  *   **No Authority:** Go to Node 6.
  *   **Has Authority:** Go to Node 7.

  ### **Node 6: Final Authority**
  Is the trained first-person report considered the **final authority** on the structure of the experience?
  *   **Yes:** **Classical Introspectionism**.
      *   *Awkward Commitment:* You must accept reports of experiences that contradict known physiological constraints (e.g., reporting simultaneity where neural latency forbids it).
  *   **No:** (Logically inconsistent on this path; if no authority and not final, see Node 7).

  ### **Node 7: Direction of Constraint**
  When first-person reports and third-person measures conflict, is the report **discarded** in favor of the neural data, or are they **mutually reconciled**?
  *   **Discarded:** **Neuro-Privilege [UNOCCUPIED]**.
      *   *Status:* **Incoherent.** If neural data always overrides the report, the report ceases to be evidence of *experience* and becomes mere behavior (collapses into Path B).
  *   **Mutually Reconciled:** **Neurophenomenology**.
      *   *Awkward Commitment:* You must treat subjective reports and neural data as equally fallible, which complicates statistical analysis and falsification.

  ---

  ### **Path B: The Report is Verbal Behavior**

  ### **Node 8: Goal of Explanation**
  Is the goal to **predict the utterance** (stimulus-response) or to **explain the cognitive state** that produced the belief underlying the utterance?
  *   **Predict Utterance:** **Hard Behaviorism / Eliminativism**.
      *   *Awkward Commitment:* You must treat talk of "pain" or "redness" as identical to talk of "winning a bet," ignoring the apparent qualitative difference.
  *   **Explain Cognitive State:** Go to Node 9.

  ### **Node 9: Evidence About Beliefs**
  Is the report treated as evidence about the subject's **beliefs** regarding their experience, rather than the experience itself?
  *   **No (Direct Access):** (Loops back to Path A; if you claim direct access, you treat it as evidence about experience).
  *   **Yes (Beliefs):** Go to Node 10.

  ### **Node 10: Ontology of the Feeling**
  Does the subject's belief refer to a **real qualitative state** that exists privately, or is the "feeling" itself a **user-illusion**?
  *   **User-Illusion:** **Illusionism**.
      *   *Awkward Commitment:* You must explain why the illusion feels so compelling without positing the very thing (feeling) that feels compelling.
  *   **Real Qualitative State:** Go to Node 11.

  ### **Node 11: Access to the State**
  Does the method claim to **access that state directly**, or does it **bracket the truth** of whether the state matches the report?
  *   **Access Directly:** (Loops back to Path A).
  *   **Bracket the Truth:** **Heterophenomenology**.
      *   *Awkward Commitment:* You must remain neutral on whether the subject is right about their own mind, which can look like skepticism from the inside.

  ---

  ### **Logical Gaps & Unoccupied Space**

  **1. Two Unoccupied Leaves**
  *   **Naive Introspectionism:** Empty because it is **unattractive**. Historical attempts (early Wundt) failed due to low inter-rater reliability; modern science requires calibration.
  *   **Neuro-Privilege:** Empty because it is **incoherent**. If neural data automatically trumps subjective reports, the reports are no longer functioning as evidence *of consciousness*, reducing the position to Illusionism or Behaviorism.

  **2. Two Indistinguishable Positions (The Tree Cannot Separate)**
  *   **Heterophenomenology vs. Illusionism:** Operationally, these look identical in the lab. Both treat reports as beliefs and bracket the reality of the phenomenology. The tree separates them at Node 10 (Metaphysical Commitment), but no experiment can distinguish a methodological bracket from a metaphysical denial.
  *   **Classical Introspectionism vs. Neurophenomenology:** These are indistinguishable until a **conflict arises**. If first-person reports and neural data always align, the "Mutual Constraint" rule of Neurophenomenology never triggers, making it methodologically identical to Classical Introspectionism in practice.

  ---

  ### **How to Use This Handout**
  1.  **Start at Node 1.** Answer based on how you would actually code the data in your lab.
  2.  **Follow the branches.** Don't jump to the named position; let your methodological choices dictate the label.
  3.  **Check the "Awkward Commitment."** Every position pays a price. If you aren't willing to pay it, you need to backtrack to an earlier node.
  4.  **Note the Gaps.** If you find yourself between leaves (e.g., treating reports as beliefs but thinking the feeling is real and accessible), you are in the "Indistinguishable" zone. Acknowledge the ambiguity rather than forcing a label.
