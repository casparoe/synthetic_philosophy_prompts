answer: |-
  ### What it has to deliver

  *   **Phase Transitions & Singular Limits:** Must explain how singularities (e.g., boiling) arise in the thermodynamic limit ($N \to \infty$) despite real systems being finite (Batterman's point).
  *   **Universality:** Must account for why distinct micro-physics (e.g., magnets vs. fluids) yield identical macro-laws near critical points (RG fixed points).
  *   **Computational Irreducibility:** Must distinguish between laws that are hard to solve and laws that require step-by-step simulation with no shortcut (Wolfram/Chaitin).
  *   **Causal Efficacy vs. Closure:** Must reconcile macro-level constraint with the completeness of micro-physical causal chains (Kim's exclusion problem).
  *   **Multiple Coarse-Grainings:** Must validate competing descriptions (e.g., hydrodynamic vs. kinetic gas theory) without forcing a choice of which is the "true" ontology.

  ### Fake requirements

  *   **Closed-Form Derivability:** A reductionist preference; demands analytic solutions, ignoring that many micro-systems are computationally irreducible.
  *   **Magic Causal Powers:** A strong emergentist preference; demands macro-forces that violate micro-conservation laws, which contradicts established physics.
  *   **Unique Hierarchy:** A metaphysical preference; assumes one "correct" level of description, ignoring that utility depends on the probe/scale.

  ### The pair that can't both hold

  **Micro-Causal Closure** and **Strong Macro-Causal Powers**. If the micro-level is causally closed (every micro-event has a sufficient micro-cause, preserving conservation laws), then macro-properties cannot exert *novel* causal influence without causing overdetermination or violating physics. Conversely, if macro-properties possess strong emergent powers that actively constrain or override micro-dynamics, the micro-level is not causally complete. You cannot have a physically complete micro-world *and* a macro-world that adds new causal oomph; one must be epiphenomenal or the other must break conservation.

  ### Scorecard

  1. "Just computational limits": Fails phase transitions/universality; reduces ontology to ignorance.
  2. "Strong emergence/new powers": Fails micro-closure/conservation; scientifically untenable dualism.
  3. "EFT/RG take": Retains closure while granting autonomy via insulation from micro-details.
  4. Handles limits/universality correctly; treats macro as constrained organization, not new force.
  5. Verdict: Only RG/Weak Emergence satisfies physical constraints and explanatory utility.
