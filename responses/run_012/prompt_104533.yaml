prompt: |-
  I've just moved from a wet lab (molecular bio) into a complex-systems group for my PhD, and I keep getting into it at lab meeting over wether "emergence" means anything more than "we can't solve the equations yet". I want the spec before I pick a side. So: write the desiderata any decent account of emergence vs. reduction in science has to meet — the cases it must get right with the consideration behind each (phase transitions and the thermodynamic limit; universality, where different micro-physics give the same macro-law; macro-laws that are derivable in principle but only by grinding the micro-rule step by step; the cases where the higher level looks causally efficacious while the micro-level is closed and complete; and the awkward one, where the same micro-system admits several coarse-grainings — hydrodynamic vs. kinetic descriptions of the same gas — so which one is the emergent one?), plus the scientific results it can't contradict. Then tell me which of these are genuine requirements and which are just what one camp happens to want, and flag any pair that can't be had together. I'm fairly sure there's at least one, and that's the bit I most want.

  Format it as: "What it has to deliver" — the list, one bullet each, a line or two of motivation per bullet; "Fake requirements" — short, the demands that are really just one camp's preference, with why; "The pair that can't both hold" — a paragraph or two, spelled out; "Scorecard" — five lines max, the "it's just computational limits" line, strong emergence with new causal powers, and the effective-field-theory/renormalization take, judged against the list.
