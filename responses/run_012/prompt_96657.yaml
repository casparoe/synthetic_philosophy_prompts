answer: |-
  Here is the specification list for an adequate theory of slurs. These are formulated as constraints on the theoretical machinery, derived from the linguistic and social data you outlined.

  ### 1. The Embedding and Projection Constraint
  **Requirement:** The account must explain why the derogatory force of a slur typically persists (projects) when the term is embedded under logical operators such as negation, conditionals, modals, and attitude verbs.
  **Motivation:** The sentence "John is not a [slur]" is typically understood not merely as denying the neutral classification but as retaining the offensive characterization of the group. Similarly, "If John is a [slur], he should be deported" triggers the derogatory content without the speaker necessarily asserting John *is* a member of the group.
  **Status:** **Non-negotiable.** The projection behavior is robust across most contexts.
  **Tension:** This pulls strongly toward locating derogatory content in the conventional or semantic realm (e.g., presupposition, conventional implicature, or truth-conditions). Purely conversational pragmatic accounts struggle to explain why the offense survives cancellation contexts.

  ### 2. The Truth-Conditional Parity Constraint
  **Requirement:** The account must explain the intuition that a sentence containing a slur and a sentence containing its neutral counterpart (e.g., "John is a [slur]" vs. "John is a [neutral term]") are true under exactly the same worldly conditions.
  **Motivation:** If John is not a member of the targeted group, both sentences are false. If he is, both are true. The difference between them does not appear to be about *what* state of affairs obtains in the world, but *how* that state of affairs is presented.
  **Status:** **Non-negotiable** (regarding the data), though some theories attempt to reject this to save other constraints.
  **Tension:** This creates friction with **Requirement 1**. If the derogation is part of the truth conditions (to satisfy Embedding), Parity is threatened. If derogation is outside truth conditions (to satisfy Parity), Embedding becomes harder to explain without invoking non-truth-conditional semantic machinery.

  ### 3. The Reclamation and Appropriation Constraint
  **Requirement:** The account must allow for the derogatory force of the term to be neutralized or inverted when used by members of the targeted group (or allies in specific contexts), without changing the lexical item.
  **Motivation:** In-group usage (e.g., the n-word among Black speakers, "queer" among LGBTQ+ speakers) often lacks the offensive force present in out-group usage, and may even signal solidarity. The word form is identical; the social valence changes.
  **Status:** **Non-negotiable.** Any theory that treats the derogation as an invariant property of the word form cannot accommodate this.
  **Tension:** This pulls strongly toward locating derogatory force in the *use* or *context* rather than the *semantics*. It directly conflicts with any semantic account that hard-codes derogation into the lexical entry as an invariant feature.

  ### 4. The Speaker Ignorance and Responsibility Constraint
  **Requirement:** The account must explain how a speaker can perform a slurring act (and be held morally responsible for it) even if they are ignorant of the word's history, do not intend to offend, or believe the word is neutral.
  **Motivation:** A speaker who parrots a slur heard in a song, or uses a foreign term they believe to be neutral, can still be rightly criticized for slurring. The harm is done regardless of the speaker's mental state regarding the word's etymology.
  **Status:** **Non-negotiable** (from the perspective of social ethics and uptake).
  **Tension:** **Crucial Conflict:** This requirement pulls against **Requirement 3** and standard pragmatic accounts. If slurring depends on *use* or *intention* (to satisfy Reclamation), it is difficult to explain how an ignorant speaker slurs unintentionally. If slurring depends on *semantic content* (to satisfy Ignorance), it is difficult to explain how the targeted group can use the same content without slurring.
  **Note on Semantics:** This requirement cannot be stated without settling a semantic question: Is "slurring" a semantic relation between word and world, or a normative relation between speaker and audience? A purely semantic theory risks making ignorance impossible (if meaning is in the head); a purely pragmatic theory risks making responsibility impossible (if meaning is in the intent).

  ### 5. The Variability and Gradient Constraint
  **Requirement:** The account must accommodate the fact that offensiveness varies in degree between different slurs (e.g., some are "worse" than others) and varies across contexts for the *same* slur.
  **Motivation:** Not all slurs are equally toxic; some are becoming archaic; some are highly sensitive to tone and setting. A binary semantic feature (e.g., [+derogatory]) fails to capture the gradient nature of the harm.
  **Status:** **Preference** (for gradable semantics/pragmatics), but **Non-negotiable** regarding the data.
  **Tension:** This complicates **Requirement 1**. Projection is often all-or-nothing in standard semantic operators, but offensiveness is gradient. A theory must explain how a gradient social force projects through binary logical operators.

  ### 6. The Opacity and Reportability Constraint
  **Requirement:** The account must specify what happens to the derogatory content in indirect speech reports (e.g., "Alice said that John is a [slur]").
  **Motivation:** Reporters often wish to report the speech act without endorsing the slur. Some theories suggest the slur must be quoted; others suggest it can be mentioned. The theory must predict when a reporter becomes complicit in the slur by repeating it.
  **Status:** **Non-negotiable.**
  **Tension:** This interacts with **Requirement 2**. If the slur and neutral counterpart have the same truth conditions, they should be interchangeable in *oratio obliqua* without changing the truth of the report. Yet, swapping them changes the social character of the report.

  ### 7. The Cross-Linguistic Arbitrariness Constraint
  **Requirement:** The account must explain why a specific phonological string is derogatory in one language but innocuous in another, or why different languages target different properties for the same group.
  **Motivation:** The link between the sound and the offense is not natural but historical and conventional. A theory that derives derogation from the conceptual content of the group description (e.g., "dangerous," "unclean") risks failing here if the neutral counterpart in another language carries those same concepts without the slur.
  **Status:** **Non-negotiable.**
  **Tension:** This weighs against semantic accounts that derive derogation from the *descriptive content* associated with the term. It suggests the derogation is attached to the *signifier* or the *history of the signifier*, not just the signified.

  ***

  ### Incompatibilities and Trade-Offs

  There is one primary fault line where satisfying one family of requirements makes satisfying another theoretically costly, if not logically inconsistent without significant augmentation.

  **The Conflict:** **The Embedding Constraint (1)** vs. **The Reclamation Constraint (3).**

  *   **The Trade-off:** To satisfy **Embedding**, the derogatory force must be conventionally attached to the word (semantic or conventional pragmatic content) so that it survives logical operators. To satisfy **Reclamation**, the derogatory force must be sensitive to the identity of the speaker and the context of use, effectively allowing the "meaning" to switch off or invert without changing the word.
  *   **The Collision:** If you locate the derogation in the **semantics** (to handle Embedding and Ignorance), you render the word inherently toxic. This makes Reclamation mysterious: how can a group use an inherently toxic word without toxicity? You must posit a complex mechanism of "quoting" or "suspension" of semantics.
  *   **The Collision:** If you locate the derogation in the **pragmatics/use** (to handle Reclamation and Variability), you render the word context-dependent. This makes Embedding mysterious: why does the offense project out of "If..." clauses where the context of use should theoretically be suspended or shifted?
  *   **Verdict:** These two requirements cannot be jointly satisfied by a simple, invariantist theory. A theory must choose a "home" for the derogation (content vs. use) and then build complex auxiliary hypotheses to explain away the data from the other side.

  **The Social-Semantic Pull:**
  **The Speaker Ignorance Constraint (4)** pulls against the **Reclamation Constraint (3)** regarding the definition of the act.
  *   If slurring is defined by **uptake/harm** (Social), the ignorant speaker slurs (satisfies 4), but the in-group user might also slur if harm occurs (threatens 3).
  *   If slurring is defined by **intent/convention** (Semantic/Pragmatic), the in-group user does not slur (satisfies 3), but the ignorant speaker might not be slurring either (threatens 4).
  *   **Note:** You cannot state the requirement for "Responsibility" without deciding whether responsibility tracks *causal harm* (social fact) or *normative violation* (semantic/pragmatic rule).

  ***

  ### The Single Most Eliminative Requirement

  **The Embedding and Projection Constraint (Requirement 1).**

  **Family of Views Ruled Out:** **Pure Conversational Implicature Accounts.**

  **Reasoning:**
  This requirement eliminates any theory that treats the derogatory content as a standard Gricean conversational implicature derived solely from context and the Cooperative Principle. Conversational implicatures are typically cancellable and do not project out of negation or conditionals in the robust way slurs do.
  *   If derogation were merely a conversational implicature, "John is not a [slur]" should not imply John is a member of the targeted group, nor should it retain the offensive force.
  *   Because the offense *does* project, the derogatory element must be part of the conventional meaning of the word (whether truth-conditional, presuppositional, or expressively conventional).
  *   This forces almost all contemporary theories to accept that the derogation is **conventionalized** in some way, ruling out the simplest reductionist pragmatic views that attempt to treat slurs as neutral words used rudely.

  *Note:* While the **Reclamation Constraint** is currently putting significant pressure on **Semantic Invariantist** accounts, the Embedding Constraint remains the primary filter that separated early pragmatic theories from the current consensus that some form of conventional content is required.
