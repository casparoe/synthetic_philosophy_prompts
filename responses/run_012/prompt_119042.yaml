answer: |-
  Here is the episode run through the causal exclusion machinery, stripped of the methodological noise.

  ### 1. The Mapping

  To run the Causal Exclusion Argument (CEA) on Libet, we must fix the variables. The pop-sci version often leaves them fluid, which allows the conclusion to slide in.

  *   **The Effect ($E$):** The motor action (finger flexion).
  *   **The Candidate Mental Cause ($M$):** The conscious intention/will to move (reported at W-time).
  *   **The Sufficient Physical Cause ($P$):** The Readiness Potential (RP) plus the subsequent neural cascade to the motor cortex.
  *   **The Supervenience Base ($P^*$):** The specific neural state upon which $M$ supervenes.

  **Where Supervenience Does Work:**
  In the standard CEA, supervenience is required to block the "Overdetermination" escape. If $M$ were independent of $P$, you could argue $M$ and $P$ are two distinct sufficient causes (systematic overdetermination). Supervenience ties $M$ to $P^*$, ensuring they aren't independent.

  **The Smuggle:**
  In the Libet literature, supervenience is often treated loosely. The argument implicitly assumes $M$ supervenes on *some* physical state, but the data suggests $M$ does *not* supervene on $P$ (the RP), because $P$ precedes $M$.
  *   **Scenario A:** $M$ supervenes on $P$ (the RP). If so, $M$ and $P$ are simultaneous (or $M$ is just a description of $P$). But Libet's data says $P$ starts before $M$. So this contradicts the data.
  *   **Scenario B:** $M$ supervenes on a later physical state $P_{later}$. If $P$ (RP) is already sufficient for $E$, and $M$ supervenes on $P_{later}$, then $M$ is causally inert not just because of exclusion, but because it arises *after* the causal chain is already sufficient.

  The pop-sci version smuggles in **Non-Identity** via the timing data, then uses **Closure** to get Exclusion, while pretending **Supervenience** keeps it physicalist. But if $M$ is temporally distinct from the sufficient physical cause $P$, it's hard to see how $M$ supervenes on $P$. If it doesn't supervene on $P$, it's not a competitor to $P$; it's a byproduct. The CEA requires $M$ and $P$ to be competing candidates for the *same* causal slot. Libet's data suggests they aren't even in the same slot.

  ### 2. The Argument vs. The Data

  **Does the Argument Predict the Results?**
  Yes, if you accept the CEA premises a priori. If Closure is true and $M \neq P$, then $M$ cannot cause $E$. Therefore, any empirical investigation should show that the sufficient physical cause ($P$) is present without the conscious intention ($M$) initiating it. Libet's finding (RP before W) is exactly what CEA predicts for a non-reductive physicalist world.

  **Are the Results Evidence for the Argument?**
  No. The CEA is a metaphysical constraint, not an empirical hypothesis. The results are evidence for **Non-Identity**. They show that the conscious intention is not identical to the Readiness Potential (due to the time lag).
  *   Without Libet: A physicalist could argue $M = P$ (Identity Theory). If $M = P$, CEA doesn't exclude $M$, because $M$ just *is* the physical cause.
  *   With Libet: $M \neq P$. Now Non-Reductive Physicalism is forced. Once you accept Non-Reductive Physicalism, CEA kicks in automatically.
  So, Libet doesn't prove Exclusion; it proves Non-Identity, which *activates* Exclusion given Closure.

  **Timing Claim vs. Metaphysical Claim:**
  They are not the same claim, though they wear the same coat.
  *   **Timing Claim:** "The neural trigger precedes the conscious report." (Empirical, contingent).
  *   **Metaphysical Claim:** "The mental property has no causal efficacy." (Necessary, given Closure + Non-Identity).
  The pop-sci version treats the Timing Claim as *proof* of the Metaphysical Claim. It isn't. You could have a world where the neural trigger precedes consciousness, but consciousness is still a necessary part of the loop (e.g., a veto mechanism, which Libet allowed for). The Metaphysical Claim requires the CEA machinery (Closure + No Overdetermination) to move from "It started earlier" to "It does nothing."

  ### 3. Running it the Other Way: What Libet Shows About the Argument

  **Confirmation or Reductio?**
  This is where the CEA proponent gets cornered. If you run CEA on Libet and conclude "Conscious Will is Excluded," you must check if the argument generalizes.
  *   **Biology:** A gene's expression ($E_{bio}$) supervenes on molecular interactions ($P_{mol}$). $P_{mol}$ is causally closed. Is the gene expression excluded?
  *   **Economics:** A market crash ($E_{econ}$) supervenes on trades ($P_{trade}$). $P_{trade}$ is physically closed. Is the market crash excluded?

  If the CEA proponent says "Will is illusory" but "Digestion is real," they owe us a **Principle of Causal Selection**. Why does physics exclude the mental but not the biological?
  *   **The Reductio:** The CEA, run rigorously on Libet, threatens to eliminate *all* macro-causation. It implies that only fundamental physics has causal powers. This is usually unacceptable to the scientists using the data (neuroscientists believe neurons cause things, not just quarks).
  *   **Unanticipated Case:** The CEA was designed for the mind-body problem. Libet shows that if the argument works, it works *too well*. It turns the mind-body problem into the special-sciences problem.

  **Confirmation:**
  The only way it confirms CEA without *reductio* is if you argue the mental is *unique* in its lack of causal power (e.g., because it's phenomenological). But this abandons physicalism. If you stay physicalist, Libet + CEA confirms that macro-properties generally are causally excluded by micro-properties.

  ### 4. Gaps and Silences

  **Causal Selection:**
  The argument is silent on *why* we attribute causation to $M$ in everyday life if $P$ does the work. It assumes a "production" metaphysics of causation (pushing). If causation is **counterfactual dependence**, the exclusion argument weakens. (If $M$ hadn't occurred, would $P$ have occurred? If $M$ supervenes on $P$, this is tricky). Libet's setup assumes production: something must *trigger* the movement.

  **Token vs. Type:**
  CEA often slides between token and type causation.
  *   **Token:** *This* specific intention didn't cause *this* twitch (Libet supports this).
  *   **Type:** Intentions *in general* don't cause movements (CEA supports this).
  Libet only gives data on tokens. The leap to the general illusion of will requires the metaphysical argument. The argument is silent on whether a different *type* of mental state (e.g., a long-term plan) might bypass the RP mechanism.

  **Constitution vs. Causation:**
  The argument assumes $M$ and $P$ are distinct entities competing to cause $E$. It is silent on the possibility that $M$ constitutes $P$'s causal power at a higher level of description. If $P$ causes $E$ *in virtue of* realizing $M$, then $M$ isn't excluded; it's the *reason* $P$ was effective. Libet's timing data makes this hard (how can the constitution exist after the cause starts?), but the CEA framework itself doesn't rule it out conceptually.

  ### 5. Evaluating the Escapes

  **Same-Cause (Identity):**
  *   *Verdict:* Dead in this specific framing.
  *   *Why:* Libet's data (RP before W) is direct evidence against Identity. If $M = P$, they cannot be temporally separated. To save this, you'd have to claim the report of W is delayed but the intention was present earlier. This is possible (measurement error), but it concedes the empirical point to save the metaphysics.

  **Determinable/Determinate (Yablo-style):**
  *   *The Move:* $P$ is the determinate (specific neural firing); $M$ is the determinable (willing to move). $M$ causes $E$ because $E$ depends on the determinable property, not the specific micro-details of $P$.
  *   *Verdict:* Strained by Libet, but the best survivor.
  *   *Why:* The problem is the **timing**. Usually, the determinable and determinate are co-instantiated. In Libet, the determinate ($P$/RP) is instantiated *before* the determinable ($M$/Conscious Will) is reported.
  *   *Survival Condition:* You must argue that the Conscious Will supervenes on the *entire* process, including the RP, even if access to it is delayed. If $M$ is the "global state of the system including RP," then $M$ and $P$ are co-temporal, and $M$ can be the determinable cause.
  *   *Cost:* This requires redefining "Conscious Will" not as the moment of awareness (W-time), but as the underlying state that *includes* the unconscious preparation. This concedes that the *phenomenology* of willing (the feeling at W-time) is epiphenomenal, even if the *state* of willing is causal.

  **The Concession:**
  If you defend the experiment and let the CEA go through, you must concede **Epiphenomenalism about Phenomenology**. You can save the causal efficacy of the *neural state* that correlates with will, but you cannot save the causal efficacy of the *conscious experience* of willing as it appears in time. The "feeling" is a readout, not a driver.

  If you want to keep the "feeling" as a cause, you have to break Causal Closure (interactionism) or deny the timing data (identity). If you keep CEA + Libet, the conscious moment is a shadow cast by the machinery, not a gear in it. And if you accept that, you owe an explanation for why biology and economics don't suffer the same fate.
