      *   **Constraint 2 (Mechanism):** A working system, not a narrated demo. Students *become* the room.
      *   **Constraint 3 (Language):** Purely syntactic. Must use a constructed glyph language + lookup manual (no natural language anyone knows).
      *   **Constraint 4 (Structure):** Three ascending stages:
          1.  Small group operators vs. Interrogator.
          2.  Whole class as distributed system.
          3.  Introspection/Qualia query (System claims understanding via lookup).
      *   **Constraint 5 (Debrief):** Map activity moments to standard replies (Systems, Robot, Brain-Simulator, Combination) and Searle's rejoinders (including Chinese Gym). Attach theory to lived experience.
      *   **Constraint 6 (Practical Honesty):** Predict failure modes (cheating, semantics smuggling, confusion) and limitations (finite script, phenomenal gap).

  2.  **Deconstruct the Activity Design:**

      *   **The "Glyph Language":** Needs to be simple enough to manage in 90 mins but opaque enough to prevent decoding. Geometric shapes or arbitrary symbols work best. Let's create a simple "Input-Output" logic based on shape matching rather than meaning.
      *   **The Manual:** Needs to be a lookup table. Input Symbol $\rightarrow$ Rule $\rightarrow$ Output Symbol.
      *   **Roles:**
          *   *Operators:* Manipulate symbols.
          *   *Interrogator:* Outside the room, sends inputs, judges understanding.
          *   *Observer/Scribe:* Records timing/errors.
