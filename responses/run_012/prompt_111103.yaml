answer: |-
  No, this scheme is practically unworkable on the street because bettors won't take contradictory wagers, and even if it succeeds, it proves the customer is mathematically inconsistent rather than factually wrong about the horse.

  To execute a Dutch book, you need the mark to accept bets on all sides of an inconsistency, such as wagering on a horse to win and also wagering on it to lose at odds that sum to more than 100%. In the real world, a gambler who believes a horse has a 60% chance of winning will not voluntarily bet on it losing unless the bookie disguises the second bet as something else, like "insurance" or a prop bet on a track record. You cannot simply wait for them to offer these bets; you have to actively engineer a scenario where their confidence tricks them into covering both outcomes, which is far more complex than collecting on a debt.

  Regarding the truth of his beliefs, losing a Dutch book proves internal incoherence, not external falsity. If your customer loses money because he bet on both win and lose, he has violated the axioms of probability, but the horse could still win exactly as he predicted. The bookie hasn't demonstrated that the customer was wrong about the horse's speed or the track condition; he has only demonstrated that the customer is bad at math. The loss is a penalty for logical inconsistency, not evidence that the world contradicted his expectations.
