  ### The Case: The Knitter's Count

  Elara is a professional knitter working on a complex pattern that requires her to track exactly which of the forty rows she is on. She never loses her place. In the first version of the case, she uses a **row counter**, a small plastic dial with beads that she clicks after every row; it sits on the table beside her, and she glances at it consciously whenever she finishes a sequence. In the second version, she uses her **fingers**, holding a specific loop of yarn against a specific knuckle to mark her progress; she feels the position proprioceptively without looking, adjusting the yarn automatically as she works. The single feature that differs between the two scenarios is whether the tracking resource is **biological (part of her body)** or **artefactual (a separate object)**. Everything else—her reliability, her trust in the method, and the frequency of use—remains identical.

  ### The Walkthrough

  **The Extended Mind View**
  For the proponent of the Extended Mind Thesis (EMT), the plastic dial in the first scenario functions exactly like biological memory: it is reliable, accessible, and automatically endorsed. Therefore, the state of the dial constitutes part of Elara's belief about her row number. However, when you flip the feature to the **biological** case (her fingers), the EMT defender shifts their classification. They still count it as cognition, but they no longer call it *extended* mind; they call it *embodied* mind. The verdict on 'cognition' stays 'Yes', but the verdict on 'extension' moves from True to False. The artefact requires the parity principle to be pulled inside the cognitive circle; the body is already there.

  **The Coupling-Constitution View**
  For the defender of the Coupling-Constitution Fallacy (CCF), the first scenario is a clear 'No'. The dial is merely coupled to Elara; it lacks the intrinsic non-derived content of a genuine cognitive state. It is a tool, not a mind. However, when you flip the feature to the **biological** case, the CCF defender's verdict moves to 'Yes'. Because the fingers are part of the organism, the processes involving them are bona fide cognitive processes. The boundary of the skin matters. So, while EMT shifts from 'Extended' to 'Embodied', CCF shifts from 'Not Cognition' to 'Cognition'. Both sides move their verdicts based on the biological status of the resource.

  **The Single Feature**
  The feature doing the work is **Biological vs. Artefactual Status**. It is not about location (both are outside the skull), nor about reliability (both are trusted). It is purely about the ontological category of the resource.

  **Flipping the Feature**
  If you remove the biological distinction—say, by making the dial a genetically engineered growth on her finger—both sides converge on 'Yes' (Cognition). If you make the fingers merely a tool (e.g., she uses a glove with beads but doesn't feel them), both sides converge on 'No' (Not Cognition/Not Extended). The disagreement only exists in the gap between trusted artefact and trusted body. Without this feature, the case collapses back into Otto: if we ignore the biological distinction, the dial looks just like a notebook, and we are back to the standard stalemate where EMT says 'Yes' and CCF says 'No' without any movement.

  **The Rigging Objection**
  A defender of the Extended Mind might accuse you of rigging the case by smuggling the conclusion into the premise. They would argue that by selecting 'biological status' as the variable, you have presupposed the very boundary (the skin) that the Extended Mind Thesis seeks to challenge. They would say you haven't generated the verdicts from the theory; you've stipulated that biology counts as cognition and artefacts don't, which is exactly what the debate is about. You have made the CCF defender look reasonable by granting them the biological boundary they are fighting to defend, while forcing the EMT defender to concede that 'extended' doesn't apply to the body, which weakens their radical claim.

  **The Takeaway**
  Readers should take away that the debate isn't just about *where* cognition happens, but *what kind of stuff* can constitute it. Otto's notebook makes it seem like the only issue is distance from the brain. This case shows that even if distance is equal (fingers and dial are both outside the skull), the material nature of the resource drives a wedge between the theories. It highlights that EMT is actually two claims: one about expansion (mind goes out) and one about parity (stuff doesn't matter). This case separates them, showing that one can accept expansion into the body without accepting expansion into the world of artefacts.
