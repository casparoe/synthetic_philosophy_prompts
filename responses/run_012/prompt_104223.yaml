answer: |-
  Good morning. It is a privilege to welcome you to this workshop, convened jointly by our departments of Philosophy and Statistics. We have a rare configuration in this room. About a third of you could prove the theorem I'm about to mention on a napkin. The rest of you are here because you manage risk, health, or capital, and you've heard that "information has value." My job for the next seven minutes is to speak to both groups without boring the first or losing the second.

  I want to start with a case. A hospital board recently voted against deploying a predictive deterioration score for inpatients. This algorithm could flag patients at high risk of sudden decline. Technically, it worked. But the board rejected it. Their reasoning was explicit: once the hospital *knows* which patients are deteriorating, it is obliged to act. If they act, they incur costs—staffing, interventions, false alarms. If they don't know, they cannot be held responsible for failing to intervene. They preferred the option to remain ignorant.

  To the practitioners here, that logic feels visceral. Ignorance isn't just bliss; it's strategic insulation. But to the decision theorists here, that logic violates a fundamental result known as Good's theorem.

  The theorem states that for a Bayesian decision-maker facing a fixed decision problem, acquiring costless information cannot reduce expected utility. Why? Because you can always ignore it. If you learn something that tempts you to deviate from your original plan, you are free to stick to the original plan. The option to act as if you never looked is always on the table. Therefore, the expected value of looking is at least the expected value of not looking.

  So, was the hospital board wrong? According to the strict mathematics of Good's theorem, yes. They left expected utility on the table. But notice the weight bearing down on that conclusion. It rests entirely on the assumptions. And this is where we must be precise, because this is where the theorem is most often mangled in practice.

  The theorem is about *expected* value under specific assumptions, not the *actual* value of knowing in every instance. Sometimes information hurts. But if it hurts, one of the assumptions has broken. I want to highlight three ways this happens, and I want to be explicit about where the consensus ends and the debate begins.

  First, utility might depend on the information itself. If knowing a patient is dying makes you miserable, and misery enters your utility function, then information has a cost. This is a clean failure of the assumption that utility is defined only over actions and states of the world. Everyone in this room should agree: if the utility function changes upon learning, the theorem does not apply. That is settled.

  Second, the mere fact of seeking information might change other people's behavior. If deploying the score signals to insurers that you are managing risk differently, premiums might change. This moves us from a single-agent decision problem to a game. Again, this is a clean failure of the assumption. The theorem assumes the environment is passive. If the environment reacts to your knowledge, the theorem doesn't hold. That is also settled.

  The third case is the hospital's case: obligation. They argued that knowing creates a duty to act. Here, we need to distinguish between a settled mathematical point and a contested modeling choice.

  The settled point is this: If knowing creates a hard constraint that removes the option to "ignore" the information—to act as you would have acted otherwise—then the proof collapses. You cannot ignore what you are forbidden to ignore.

  The contested point is how we model that obligation. Some decision theorists argue that obligation should be modeled as a massive penalty in the utility function for failing to act. If you do that, the theorem still holds: you look, you see the risk, and you act to avoid the penalty. Others argue that obligation changes the *available action space* itself. It removes the "ignore" option entirely. If you take that view, the theorem fails.

  I am not going to resolve that debate today. I want you to leave knowing that it exists. It is tempting to say "information is always valuable" as a slogan. It is not. It is valuable only when knowing does not change the rules of the game, the costs of being, or the set of moves you are allowed to make.

  So, why are we here for two days? If the theorem is this conditional, is it useful?

  Yes, but not as a guarantee. It is useful as a diagnostic. When information seems to have negative value, it is a signal that one of these assumptions is doing heavy lifting in your model. Maybe the cost isn't in the test, but in the liability. Maybe the value isn't in the prediction, but in the signaling.

  For the statisticians: we are not here to re-prove Good. For the practitioners: we are not here to tell you to always buy more data. We are here to examine the assumptions. We are here to ask when the "ignore" option is real, and when it is a fiction of the model.

  Over the next two days, I invite you to press on these boundaries. Let's find out where the math stops and the philosophy begins. Thank you.
