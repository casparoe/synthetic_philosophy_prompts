  2.  **Deconstruct Good's Theorem (for accuracy):**
      *   *Statement:* $E[U|Info] \geq E[U|No Info]$.
      *   *Assumptions:*
          *   Bayesian updating.
          *   Costless information.
          *   Utility depends only on action and state (not on the information itself or the act of acquiring it).
