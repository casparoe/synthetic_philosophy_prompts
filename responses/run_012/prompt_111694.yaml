answer: |-
  Here is the checklist you need to stop the circles, the incompatibility warning, and the verdict on the three main camps.

  ### The Checklist: What an Interpretation Must Deliver

  1.  **Long-Run Stability**
      *   **The Case:** A clinical trial shows 80% five-year survival across 10,000 patients.
      *   **Status:** *Non-negotiable.* Any theory claiming to describe probability must explain why relative frequencies stabilise.
  2.  **Single-Case Truth**
      *   **The Case:** What is the chance *this* specific patient survives *this* specific operation, or *this* atom decays now?
      *   **Status:** *Non-negotiable for science, contested by strict frequentists.* We act on single cases; a theory denying them feels useless.
  3.  **Reference Class Resolution**
      *   **The Case:** The doctor says 80%, but are you comparing me to all adults, men my age, or smokers with my genetics?
      *   **Status:** *Non-negotiable.* Without a rule for selecting the group, the number is arbitrary.
  4.  **Symmetry and Indifference**
      *   **The Case:** Why is a fair die 1/6 prior to throwing it, regardless of belief?
      *   **Status:** *Camp-specific.* Subjectivists accept it as a prior; objectivists demand it be a physical fact.
  5.  **Action-Guiding (Rational Belief)**
      *   **The Case:** Why is it irrational to bet 10:1 against a fair coin landing heads?
      *   **Status:** *Non-negotiable.* Probability must connect to decision theory (Dutch Book arguments).
  6.  **Non-Repeatable Events**
      *   **The Case:** Will this specific volcano erupt in 2024? (It can only happen once or not at all).
      *   **Status:** *Non-negotiable for policy.* We must assign risk to unique historical or geological events.

  ### The Incompatibility (The Trilemma)

  You cannot simultaneously hold these three claims without contradiction:
  1.  **Strict Objectivity:** Probability is a mind-independent physical property (like mass).
  2.  **Single-Case Applicability:** Probability applies meaningfully to unique, token events (this atom, this patient).
  3.  **Empirical Verification:** Probability claims are only meaningful if verifiable by observation.

  **The Conflict:** If you demand **Objectivity** and **Verification** (Frequentism), you lose **Single-Case** (you can't observe a long run in a single event). If you demand **Objectivity** and **Single-Case** (Propensity), you lose **Verification** (the propensity is hidden and unmeasurable directly). If you demand **Single-Case** and **Verification** (Subjectivism), you lose **Objectivity** (probability becomes a state of mind, not the world).

  ### The Theories Against the List

  **Frequentism**
  Excels at long-run stability and verification but collapses on single cases and non-repeatable events by definition. It dissolves the reference class problem by insisting the class *is* the probability, which offers no help for the individual patient.

  **Subjectivism (Bayesianism)**
  Handles single cases, betting, and unique events perfectly by treating probability as rational degree of belief. However, it struggles to explain objective symmetry (why the die *is* fair) and risks making truth entirely dependent on the agent's information.

  **Propensity**
  Secures objective single-case chances (the atom really has a tendency to decay) and respects symmetry as physical bias. Yet it fails on verification (propensities are metaphysical ghosts) and offers no clear solution to the reference class problem beyond physical similarity.

  ### The Killer Criterion

  **Single-Case Truth** does the most damage.
  It kills Strict Frequentism outright (which denies single-case probability is meaningful) and haunts Propensity theory (which posits them but cannot measure them). Subjectivism survives it only by sacrificing the idea that probability is 'out there' in the world.
