answer: |-
  # The Composition Quiz

  This tree asks seven questions. Start at the top. Answer **Yes** or **No** (or choose the option that fits best), and follow the arrow until you reach a leaf. Do not worry about what philosophers call these positions; just answer based on what seems true to you.

  **Note on Terms:** When this tree asks if things "make one object," it means: is there a single thing existing in the world that is composed of those parts, over and above the parts themselves?

  ***

  ### **Question 1**
  **Consider two bricks lying at opposite ends of a room.**
  Do they, right now, add up to a single object that has them as parts?
  *   **Yes** → Go to **Leaf 1**.
  *   **No** → Go to **Question 2**.

  ### **Question 2**
  **Consider two bricks resting on each other.**
  Do they, right now, add up to a single object that has them as parts?
  *   **No** → Go to **Leaf 2**.
  *   **Yes** → Go to **Question 3**.

  ### **Question 3**
  **Consider a heap of sand you have just swept together.**
  If you take grains away one by one, is there always a definite fact of the matter about whether it is still a heap, even if we cannot know it?
  *   **No** (Sometimes there is no definite fact; it is vague) → Go to **Leaf 3**.
  *   **Yes** (There is always a precise fact) → Go to **Question 4**.

  ### **Question 4**
  **Consider a crowd at a stadium or a queue at a till.**
  Does this group exist even if no human being ever had the concept of a "crowd" or a "queue"?
  *   **No** (It exists only because we think or talk that way) → Go to **Leaf 4**.
  *   **Yes** (It exists regardless of us) → Go to **Question 5**.

  ### **Question 5**
  **Consider a cat, a forest, a cloud, and a model built from small bricks (whether glued or merely balanced).**
  Do all of these count as single things for the *same reason*, or does a made thing (like the model) count for a different reason than a found thing (like the cat or cloud)?
  *   **Different reasons** (Found vs. Made matters; no single rule covers all) → Go to **Leaf 5**.
  *   **Same reason** (There is one rule for all of them) → Go to **Question 6**.

  ### **Question 6**
  **Consider a statue and the lump of clay it is made of.**
  Are they one single thing, or are they two distinct things that happen to share the same space?
  *   **One single thing** → Go to **Leaf 6**.
  *   **Two distinct things** → Go to **Question 7**.

  ### **Question 7**
  **Consider a tool whose head and handle have each been replaced at different times.**
  Is the tool at the end the *same object* as the tool at the start?
  *   **Yes** (It survived the changes) → Go to **Leaf 7**.
  *   **No** (It is a different object now) → Go to **Leaf 8**.

  ***

  ## **The Leaves (Your Results)**

  ### **Leaf 1: Universalism**
  *   **The View:** Any collection of things, no matter how scattered, makes up a further object.
  *   **Hardest Commitment:** You must explain why we act as if most of these objects (like the "object" made of your nose and the Moon) do not exist.
  *   **Note:** This position is occupied by many philosophers (e.g., David Lewis).

  ### **Leaf 2: Nihilism**
  *   **The View:** No collection of things ever makes up a further object; only the smallest simple parts exist.
  *   **Hardest Commitment:** You must explain why it is not a mistake to say "there is a brick wall" when there are only bricks arranged wall-wise.
  *   **Note:** This position is occupied by some philosophers (e.g., Peter van Inwagen, in a specific form).

  ### **Leaf 3: Vagueness View**
  *   **The View:** Composition sometimes happens, but there is no precise fact of the matter about when; reality itself can be fuzzy.
  *   **Hardest Commitment:** You must explain how the world itself can be vague, rather than just our words being vague.
  *   **Note:** This position is occupied by some philosophers (e.g., David Lewis discussed it, though rejected it).

  ### **Leaf 4: Conventionalism**
  *   **The View:** Whether parts make a whole depends on our concepts, interests, or language, not just on the world.
  *   **Hardest Commitment:** You must explain why we cannot simply decide by convention that a random scattering of bricks is a "house."
  *   **Note:** This position is occupied by some philosophers (e.g., Eli Hirsch).

  ### **Leaf 5: Brutal Composition**
  *   **The View:** Composition happens in some cases but not others, but there is no deep rule or explanation for why; it is just a bare fact.
  *   **Hardest Commitment:** You must explain how something can be a fundamental fact of reality without any further reason or pattern.
  *   **Note:** This position is occupied by some philosophers (e.g., Trenton Merricks).

  ### **Leaf 6: Constitutional Monism**
  *   **The View:** Composition happens, but the statue is not a second thing distinct from the clay; they are identical.
  *   **Hardest Commitment:** You must explain how one thing can have different properties (the clay could survive being squashed, the statue could not).
  *   **Note:** This position is occupied by some philosophers (e.g., Lynne Baker has a related view, though distinct).

  ### **Leaf 7: Endurantism (Common Sense)**
  *   **The View:** Objects are wholly present at every moment and survive changes to their parts (like the tool).
  *   **Hardest Commitment:** You must explain how the *whole* object exists at every time without being spread out in time like a worm.
  *   **Note:** This position is occupied by many non-philosophers and some philosophers.

  ### **Leaf 8: Perdurantism (Stage View)**
  *   **The View:** Objects are made of time-slices; the tool at the end is a different "stage" than the tool at the start.
  *   **Hardest Commitment:** You must explain why we feel pain or have memories if we are only momentary stages and not the whole person over time.
  *   **Note:** This position is occupied by some philosophers (e.g., Theodore Sider).

  ***

  ## **Notes on the Structure**

  **On Empty Combinations:**
  There are combinations of answers that this tree does not allow you to reach because they are logically incoherent. For example, you cannot answer **Yes** to Question 1 (Bricks Apart make an object) and **No** to Question 2 (Bricks Together do not). If scattered bricks make an object, touching bricks must also make one. The tree prevents you from selecting this impossible combination. Similarly, if you are a **Nihilist** (Leaf 2), you cannot consistently believe in **Vagueness** (Leaf 3) about heaps, because if nothing composes, heaps do not exist to be vague.

  **On Indistinguishable Leaves:**
  All eight leaves above are separated by at least one question in the tree. However, **Leaf 7** and **Leaf 8** are very close neighbors. They agree on almost everything (that composition happens, that it is definite, that it is mind-independent, that there is a uniform rule, that statue and clay are distinct). They only part company on the tool case (persistence over time). To separate them further, you would need a new question about *personal identity*: "If your brain were copied, would the copy be *you*?" Leaf 7 tends to say No; Leaf 8 tends to say Yes (or that the question has a different answer).

  **On Unexplored Territory:**
  There is a combination of answers that leads to **Leaf 5** (Brutal Composition) that is rarely explored in combination with **Leaf 6** (Constitutional Monism). Most Brutalists think the statue and clay are two things. A position that says "Composition is brute/unexplained, BUT the statue is just the clay" is logically possible but largely unoccupied. It is empty merely because nobody has bothered to explore it, not because it is incoherent.
