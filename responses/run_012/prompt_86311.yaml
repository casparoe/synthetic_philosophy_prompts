          *   Modality: Physical/Nomological possibility.
          *   Knower: Human community over infinite time.
          *   Verdict: Substantive, debatable (quantum limits?), but not the paradox trigger.
          *   Anti-Realist use: No, this is usually realist.

      *   *Reading 2: The Logical Possibility (The Paradox Trigger).*
          *   Meaning: There is no logical contradiction in a truth being known.
