          *   Scientist Objection Check: Where should the chemist object, and where is it a category error?
      *   **Constraint:** No citations, no reading lists. Just disambiguation and verdicts.

  2.  **Deconstruct the Phrase "Every Truth is Knowable":**
      *   *Core Logical Form:* $\forall p (p \rightarrow \Diamond K p)$ (For all propositions $p$, if $p$ is true, then it is possible that $p$ is known).
      *   *The Paradox:* Fitch's Paradox of Knowability. If you accept $\forall p (p \rightarrow \Diamond K p)$ and some basic modal logic axioms, you derive $\forall p (p \rightarrow K p)$ (All truths are known).
      *   *The Escape Routes:* Restrict the scope of $p$, change the modality $\Diamond$, change the concept of $K$, or deny the implication.

  3.  **Drafting the Menu Items (Iterative Process):**

      *   *Reading 1: The Scientific Optimist (Physical/Practical Possibility).*
