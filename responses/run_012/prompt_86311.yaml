      *   *Reading 4: The Theological/Omniscient (God's Eye View).*
          *   Meaning: An omniscient being could know it.
          *   Modality: Metaphysical possibility relative to God.
          *   Knower: Omniscient being.
          *   Verdict: Platitude for theists, irrelevant for secular anti-realism.
          *   Paradox: Doesn't trigger Fitch for humans, but trivializes the "mind-dependence" claim.

      *   *Reading 5: The Restricted Domain (Empirical Truths Only).*
          *   Meaning: Every *empirical* truth is knowable. (Excludes mathematical or modal truths).
          *   Modality: Physical/Epistemic.
