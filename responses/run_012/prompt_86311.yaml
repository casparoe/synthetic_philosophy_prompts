      *(Refining the Anti-Realist section)*: The anti-realist wants to say Truth = Knowability. If they say "All truths are knowable," they are trying to constrain Truth. But if that leads to "All truths are known," they look absurd. So they usually mean Reading 3 (Truth *is* verification), not Reading 2 (Truth implies possibility of knowledge). I need to make this distinction clear.

