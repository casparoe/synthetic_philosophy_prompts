answer: |-
  # Specification for Population Axiology: Desiderata and Constraints

  This document outlines the functional requirements for a theory of population value. It distinguishes between **Non-Negotiable (NN)** constraints (logical coherence, minimal rationality, definitions) and **Camp Commitments (CC)** (substantive moral intuitions that specific schools accept but others reject). It concludes with the formal impossibility result inherent in the set.

  ---

  ## I. Structural and Logical Axioms
  *These requirements ensure the theory functions as a coherent ordering system.*

  **1. Transitivity and Completeness (NN)**
  *   **Requirement:** The "better than" relation must be transitive (if A > B and B > C, then A > C) and complete (for any A and B, either A > B, B > A, or A = B).
  *   **Consideration:** Without transitivity, money-pump arguments and cyclical preferences render the theory action-guidingly useless. Without completeness, the theory fails to rank states of affairs, offering no verdict.
  *   **Status:** **NN.** Any theory violating this is not an axiology but a fragment.

  **2. Welfare Welfarism (NN/CC Boundary)**
  *   **Requirement:** The value of a population must supervene on the welfare levels of the individuals within it. No non-welfare facts (e.g., virtue, beauty, knowledge) add value except insofar as they constitute welfare.
  *   **Consideration:** This defines the scope of *welfare-based* population axiology. A theory rejecting this is a perfectionist or pluralist theory, not strictly welfarist.
  *   **Status:** **NN** for this specification (as per your prompt's definition), but note that this excludes non-welfarist views.

  **3. Separability / Independence of Irrelevant Alternatives (CC)**
  *   **Requirement:** The relative value of two populations should not depend on the presence of a third, unaffected group of people.
  *   **Consideration:** This prevents context-dependent valuation that makes calculation impossible. However, if welfare is positional (see Section III), this may need to be relaxed.
  *   **Status:** **CC.** Many adequate theories (e.g., critical-level utilitarianism) satisfy this, but some egalitarian or prioritarian views may violate it to handle relative standing.

  ---

  ## II. Substantive Intuitions and Case Constraints
  *These requirements address the specific cases and pressures outlined in your prompt.*

  **4. Avoidance of the Repugnant Conclusion (CC)**
  *   **Requirement:** For any population of very high welfare, there is *not* a much larger population of lives barely worth living that is better.
  *   **Consideration:** This addresses **Prompt 1**. Total Utilitarianism fails here. It captures the intuition that quantity cannot indefinitely trump quality.
  *   **Status:** **CC.** Total Utilitarians reject this, accepting the conclusion as the cost of mathematical simplicity. Most other camps treat this as **NN**.

  **5. Avoidance of the Sadistic Conclusion (CC)**
  *   **Requirement:** It is never better to add lives of negative welfare (suffering) than to add lives of positive welfare, nor is it better to add suffering lives than to add nothing.
  *   **Consideration:** This addresses the symmetric pressure in **Prompt 1**. Average Utilitarianism and some Critical-Level views fail here (implying it is better to add miserable people to lower the average than to add happy people who raise it less).
  *   **Status:** **CC.** Negative Utilitarians might accept a version of this; Total Utilitarians reject it.

  **6. The Mere Addition Principle (CC)**
  *   **Requirement:** Adding a group of people with positive welfare, who do not affect the welfare of others, cannot make the outcome worse.
  *   **Consideration:** This addresses **Prompt 1**. It generates the Repugnant Conclusion when combined with Transitivity and Dominance. It captures the intuition that creating happy people is not a harm.
  *   **Status:** **CC.** Person-affecting views often reject this (creating people is neutral, not good).

  **7. Temporal Aggregation Consistency (NN)**
  *   **Requirement:** The theory must specify whether the unit of value is the *life* or the *temporal segment*. If a life of 80 years at welfare level $W$ is equivalent to 8 lives of 10 years at welfare level $W$, the theory must state this. If duration discounts value, the discount rate must be explicit.
  *   **Consideration:** This addresses **Prompt 2**. Standard theories treat lives as atoms. If welfare is experiential, a theory must explain why ten short happy lives are not equivalent to one long happy life of the same total welfare-sum. A theory must decide: Is value $\sum (Welfare \times Duration)$ or $\sum (Value(Life))$?
  *   **Status:** **NN.** A theory that is silent on duration is underspecified.

  **8. The Asymmetry (CC)**
  *   **Requirement:**
      *   (a) There is a moral reason not to create a person who would have a miserable life.
      *   (b) There is *no* moral reason to create a person who would have a happy life.
      *   (c) The absence of a happy person is not bad, even if that person would have been happy.
  *   **Consideration:** This addresses **Prompt 5**. It distinguishes "life worth creating" from "life worth living." Total Utilitarianism collapses this (failure to create happy people is a loss). Person-Affecting Views endorse this.
  *   **Status:** **CC.** This is the defining commitment of the Asymmetrical View; Total Utilitarians explicitly reject it.

  **9. The Non-Identity Constraint (NN)**
  *   **Requirement:** An action cannot be rendered morally permissible solely because it causes different people to exist than would otherwise have existed, provided the resulting people have lives worth living.
  *   **Consideration:** This addresses **Prompt 5** and **Prompt 4**. It prevents the "Non-Identity Problem" from dissolving all obligations to future generations (e.g., climate policy). A theory must explain why harming a future person is wrong even if they owe their existence to the harm.
  *   **Status:** **NN.** If a theory cannot handle this, it fails to guide intergenerational policy.

  ---

  ## III. Epistemic and Metaphysical Constraints
  *These requirements handle uncertainty and the nature of welfare.*

  **10. Welfare Invariance vs. Positionality (CC)**
  *   **Requirement:** The theory must declare whether individual welfare ($W_i$) is intrinsic or positional.
      *   *If Intrinsic:* $W_i$ is fixed regardless of population size.
      *   *If Positional:* $W_i$ changes as others are added/removed (addressing **Prompt 3**).
  *   **Consideration:** Standard axiology assumes Invariance. If welfare is positional (status, envy), adding people changes the value of existing lives. A theory must either (a) model welfare as context-dependent or (b) assert welfare is context-independent. It cannot equivocate.
  *   **Status:** **NN** (to choose one), but the *choice* is a **CC**. Most theories assume Invariance for tractability.

  **11. Probabilistic Coherence under Uncertainty (NN)**
  *   **Requirement:** The theory must provide a method for ranking outcomes where existence and welfare levels are probabilistic (addressing **Prompt 4**). It must align with Expected Utility Theory or provide a justified alternative (e.g., Maximin).
  *   **Consideration:** We cannot predict future welfare precisely. A theory that only works for fixed populations fails in the real world. It must handle the "Risk of Existence."
  *   **Status:** **NN.** A deterministic theory is practically useless.

  **12. The Person-Affecting Restriction (CC)**
  *   **Requirement:** An outcome A can only be better than B if A is better *for someone*. There are no "impersonal" goods.
  *   **Consideration:** This addresses **Prompt 5**. It forces the distinction between "making someone worse off" and "failing to make someone better off." If rejected, the theory allows that a world can be worse even if no one is worse off (e.g., a happy person exists in A but not in B).
  *   **Status:** **CC.** Impersonal views (Total/Average Utilitarianism) reject this.

  ---

  ## IV. The Impossibility Result

  You asked to identify the subset of requirements that looks jointly unsatisfiable. This is not merely a tension; it is a formal theorem.

  **The Arrhenius Impossibility Theorem (Simplified for this Spec)**
  No population axiology can simultaneously satisfy the following subset of the requirements listed above:

  1.  **Transitivity** (Req 1, NN)
  2.  **Dominance / Pareto** (Implicit in NN rationality: if A is better for everyone, A is better)
  3.  **Mere Addition Principle** (Req 6, CC)
  4.  **Avoidance of the Repugnant Conclusion** (Req 4, CC)
  5.  **Avoidance of the Sadistic Conclusion** (Req 5, CC)
  6.  **Weak Quality Addition** (If you add a very high welfare life to a population, it should not make it worse.)

  **The Conflict:**
  *   If you accept **Mere Addition** (adding happy people is not bad) and **Transitivity**, you are pushed via a chain of comparisons toward the **Repugnant Conclusion** (Req 4 violation).
  *   If you block the Repugnant Conclusion by prioritizing average welfare or critical levels, you often trigger the **Sadistic Conclusion** (Req 5 violation), where adding suffering people is preferable to adding happy people because of how it shifts the average or critical threshold.
  *   If you adopt the **Asymmetry** (Req 8) to handle the Non-Identity problem, you often violate **Transitivity** or **Dominance** in mixed cases (e.g., the "Intransitivity of Betterness").

  **Specific Tension from Your Prompts:**
  *   **Prompt 1 (Repugnance/Sadism)** + **Prompt 5 (Asymmetry/Non-Identity)** + **Req 1 (Transitivity)** = **Impossible.**
      *   To solve the Non-Identity problem (Prompt 5), you usually need an Impersonal view (rejecting Person-Affecting Restriction).
      *   To avoid the Repugnant Conclusion (Prompt 1), you usually need a Person-Affecting or Critical-Level view.
      *   To maintain Transitivity (Req 1), you cannot hold the Asymmetry (Req 8) without creating cycles in certain "Mere Addition" chains.

  ---

  ## V. Prejudices Disguised as Constraints

  I must flag where the requirements above smuggle in ideological commitments:

  1.  **"Avoidance of the Repugnant Conclusion" is a Prejudice.**
      *   *Why:* It assumes our intuitive revulsion at the conclusion is a reliable guide to moral truth. Total Utilitarians argue this is a cognitive bias (scope neglect) and that the math of summation is more reliable than the intuition. Treating this as **NN** biases the spec against Total Utilitarianism.
  2.  **"Welfare Invariance" is a Prejudice.**
      *   *Why:* It assumes welfare is a mental state intrinsic to the individual. If welfare is socially constituted (status, recognition), Req 10 forces the theory to model reality incorrectly to save mathematical tractability.
  3.  **"The Asymmetry" is a Prejudice.**
      *   *Why:* It privileges the status quo of non-existence. It asserts that potential happiness has no weight, while potential suffering does. This is a specific moral claim, not a logical necessity.

  ---

  ## VI. Verdict

  **The Single Most Exclusionary Requirement:**
  **The Asymmetry (Req 8) combined with Transitivity (Req 1).**
  This combination excludes Total Utilitarianism, Average Utilitarianism, and most Critical-Level theories. It forces the theory into the narrow corridor of Person-Affecting Views or Variable Value Views, which are the most susceptible to intransitivity and incompleteness. If you demand the Asymmetry, you almost certainly sacrifice the ability to rank all possible futures coherently.

  **Candid Verdict on Satisfiability:**
  **The full list cannot be met.**
  There is no population axiology that satisfies Transitivity, Dominance, Mere Addition, Non-Sadism, Non-Repugnance, and the Asymmetry simultaneously. This is not a failure of current research; it is a structural feature of the problem space (proven by Arrhenius, Blackorby, Bossert, and Donaldson).

  You must choose which intuition to sacrifice.
  *   Sacrifice **Repugnance Avoidance**? You get Total Utilitarianism (mathematically robust, morally counterintuitive).
  *   Sacrifice **Mere Addition**? You get Person-Affecting Views (intuitively safe, logically intransitive/incomplete).
  *   Sacrifice **Transitivity**? You get Intransitive Views (action-guidingly broken).
  *   Sacrifice **Welfarism**? You leave the scope of this specification entirely.

  **Recommendation:** Do not seek a theory that meets all desiderata. Seek a theory that explicitly states which desideratum it violates and provides the strongest justification for why *that* specific bullet is the one to bite. The specification should be used to map the cost of each candidate, not to find a perfect fit.
