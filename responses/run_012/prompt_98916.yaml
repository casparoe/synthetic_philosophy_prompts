      *   Need a central example to anchor the discussion.

  3.  **Step 1: Prerequisites for the Ethical Question:**
      *   Before asking "Does an electron suffer?", participants need to understand:
          1.  What panpsychism claims (phenomenal experience is fundamental, not emergent).
          2.  What "experience" means in this context (not thought, not self-awareness, just *something it is like*).
          3.  The link between experience and value (why experience matters ethically).
      *   Order: Metaphysical claim -> Nature of the experience -> Value theory link -> Ethical implication.

  4.  **Step 2: The Carrying Example (The Lone Electron):**
      *   User proposed: A lone electron.
