          *   Must be ubiquitous (to show the scale of the ethical issue).
          *   Must lack complex structure (to avoid conflating with brain-based consciousness).
          *   Must be neutral (not obviously alive or dead).
      *   Verdict: The electron is actually quite good *if* managed carefully. It's the standard bearer for "fundamental physical entity." However, a *field* might be better because particles are sometimes seen as excitations of fields. But "electron" is more intuitive for non-specialists. Let's stick with the electron but refine *how* it's used. It needs to be stripped of agency.
      *   Actually, the prompt asks me to say whether it earns its keep. I should evaluate it critically. It risks implying discrete individuals where there might be fields. But for a 90-minute session, "electron" is manageable. I will advise using it but with strict caveats. Or perhaps suggest a "fundamental field segment" as a more accurate but harder alternative. Let's stick with the electron but warn about its limitations regarding individuation.
      *   Wait, the prompt asks: "Which single case or example should carry the whole session — I was going to use a lone electron, but say whether that earns its keep and what a carrying example would have to have and lack."
