      *   **Constraint 5:** Provide one closing question to test grasp of argument structure vs. slogan.
      *   **Constraint 6:** State what should be openly refused to settle at this level.
      *   **Constraint 7:** No readings.
      *   **Constraint 8:** American English.

  2.  **Deconstruct the Session Flow (90 Minutes):**
