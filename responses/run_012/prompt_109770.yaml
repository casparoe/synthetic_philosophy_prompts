  You know perfectly well what a "Phillips-head screwdriver" looks and feels like. A senior technician tells you, "A *square-drive driver* is like a Phillips-head screwdriver," specifying that the handle grip and shaft length are identical, only the tip differs in a way you haven't seen. Later, rummaging in a kit, you perceive a tool that matches the described resemblance in handle and shaft perfectly. You immediately cognize, "This is the square-drive driver they mentioned." You are correct; it is indeed a square-drive driver. You did not infer this from a universal rule that "all tools with this handle are square-drivers," because chisels and punches share that handle; nor did anyone testify to the function or definition of "square-drive," only its similarity to a known object; yet you now know the reference of the word "square-drive" relative to the object before you, a knowledge distinct from merely seeing the tool's shape.

  **Bookkeeping**

  *   **The Knowledge:** The relation between the word "square-drive driver" and the perceived object (*namartha-sambandha*). You know *what* the word refers to in this instance.
  *   **Object of Upamana Cognition:** The connection of the name to the object established through similarity, not direct definition or logical marking.
  *   **Why Not Testimony:** Testimony (*sabda*) requires the speaker to convey the meaning via convention or definition (e.g., "A square-drive is for turning square nuts"). Here, the speaker only conveyed a similarity relation ("like a Phillips"), leaving you to bridge the gap to the object yourself.
  *   **Why Not Inference:** Inference (*anumana*) requires a universal pervasion (*vyapti*), such as "Whatever has this handle is a square-drive." This premise is false (chisels have similar handles), so no logical mark (*linga*) exists to sustain an inference.
  *   **Working Feature:** The recall (*smriti*) of the similarity instruction triggered specifically by the perception of resemblance (*sadrishya*). This triggers the identification without a universal rule.
  *   **Stripping the Feature:** If you remove the prior instruction, you perceive the tool but lack the name. If you remove the perception of resemblance, you recall the instruction but cannot identify the object. Both are necessary, but neither alone yields the knowledge.
  *   **Friend's Reply:** "This is just Perception plus Testimony plus a probabilistic guess. The technician gave you sufficient criteria (handle shape) to identify it, so you inferred the name based on likely fit. You didn't *know* it with certainty; you just had a high-confidence belief."
  *   **Does it Land?** No. The reply fails because it mischaracterizes the cognition as probabilistic when it is experienced as certain valid knowledge (*prama*). To save his reduction, your friend must claim you silently formulated a false universal premise ("All tools like this are square-drives") to justify the certainty. Nyaya correctly argues that you cannot know something via a false premise. The cognition arises from the similarity itself, not a universal rule, making *upamana* irreducible.
