  **What is settled and what is not**

  Empirically, it is settled that choice architecture is inevitable; there is no neutral presentation of options, and defaults significantly influence uptake rates in health contexts. Transparency is technically feasible. However, normative consensus is absent. It remains contested whether transparency mitigates manipulation or merely exposes it. There is no agreement on whether welfare gains from nudging justify bypassing deliberative processes, nor on whether autonomy is violated by bias-based interventions even when outcomes align with the agent's own values. The literature agrees nudges work; it disagrees on whether working through bias is inherently disrespectful. Furthermore, while most accept some paternalism is permissible, the boundary between legitimate guidance and illegitimate coercion remains porous. Consequently, the agency cannot rely on philosophical consensus to justify specific interventions; it requires a framework for decision-making under normative disagreement. We must distinguish empirical regularities from normative justification, as the latter is where the genuine risk lies for public trust. Specifically, the question of a neutral baseline is widely regarded as theoretically impossible, yet its practical implications for policy design remain unresolved.

  **Criteria**

  Our ranking relies on four criteria: Actionability (will this change agency practice?), Tractability (can postdocs resolve it in two years?), Downstream Impact (does this unlock other answers?), and Neglectedness (is this already over-researched?). These criteria often conflict. High Actionability questions often lack philosophical depth, reducing Downstream Impact. Conversely, foundational questions like the nature of autonomy have high Downstream Impact but low Tractability and Actionability. We prioritize Actionability and Tractability because the agency needs operational guidance, not metaphysical certainty. However, we cannot ignore Downstream Impact entirely, as poorly founded policies risk future collapse. Neglectedness is secondary; we prefer solving important known problems over exploring obscure ones. The tension lies between giving the agency immediate tools versus building a robust long-term ethical infrastructure. We choose a hybrid: questions that offer immediate procedural guidance but rest on defensible theoretical grounds.

  **The agenda, ranked**

  The following ranking prioritizes questions that secure the agency's license to operate while preventing ethical erosion. We favor procedural clarity over metaphysical precision. The order reflects the lifecycle of a policy intervention.

  **1. Authority and Legitimation.** Who is entitled to set defaults without explicit deliberative authorization?
  *Case for Priority:* This is the most urgent operational question. The agency sets defaults daily; if their authority is challenged legally or politically, programs collapse. Clarifying whether technocratic expertise suffices or if democratic validation is needed directly impacts workflow. If legitimacy requires explicit consent, many current programs are untenable. If expertise suffices, what bounds it? A clear account prevents paralysis and shields the agency from charges of overreach. It is the gateway question: without authority, mechanism and drift are moot. For a public-health agency, the cost of inaction is measured in lives lost to status quo biases; thus, establishing a defensible mandate is the primary ethical imperative. Given the modest budget, the agency cannot afford to litigate every default; they need a standing principle that withstands scrutiny without constant re-justification.
  *Chief Liability:* Resolving this may require political theory beyond the scope of empirical ethics, risking abstract outputs that lack clear procedural rules. There is a risk the postdocs produce a theoretical justification that fails to map onto administrative law realities. Furthermore, if the conclusion is that current authority is illegitimate, the agency may face a crisis it cannot solve within the budget.

  **2. Nudge Drift and Institutional Stability.** Does the machinery built for justified ends invite reuse for harder, less justified ends?
  *Case for Priority:* This addresses long-term risk. If the infrastructure for organ donation defaults is easily repurposed for controversial behavioral targets, the agency faces reputational ruin. Understanding the institutional dynamics of drift allows for safeguards (e.g., sunset clauses, domain restrictions). It answers the user's concern about the framework inviting coercion. If drift is structural, the agency needs firewalls between departments. This protects the "libertarian" half of the label from eroding into hard paternalism over time. It transforms a vague worry about slippery slopes into a concrete audit of administrative capabilities and incentives. In public health, trust is fragile; a scandal regarding mission creep could delegitimize all future interventions.
  *Chief Liability:* This is partly empirical institutional sociology; philosophical tools may struggle to predict contingent bureaucratic behaviors, making definitive conclusions difficult. It may require collaboration with political scientists, stretching the philosophical skill set. The phenomenon might be too contingent to yield general principles, limiting the generalizability of the research.

  **3. Mechanism and Transparency.** Does permissibility turn on whether interventions work through bias or reasons?
  *Case for Priority:* This distinguishes acceptable nudges from manipulative ones. If bias-based nudges require higher justification than reason-based ones, the agency needs a taxonomy of interventions. This directly informs design choices (e.g., simplifying forms vs. framing effects). It moves beyond the stalled "is it manipulative?" debate to "when is manipulation permissible?" This offers granular guidance for designers rather than blanket prohibitions. It allows the agency to defend specific tools against public criticism by appealing to the mechanism's respect for cognition. Since the team has a philosophical skill set, they are well-positioned to analyze normative distinctions even if empirical measurement is hard.
  *Chief Liability:* The line between "bias" and "reason" is psychologically porous. Drawing a bright line may be theoretically unstable, leading to arbitrary distinctions in practice. Cognitive science may undermine the philosophical categories proposed. If the distinction collapses, the research yields no actionable guidance.

  Together, these three form a protective perimeter: Authority justifies the start, Mechanism guides the design, and Drift monitors the lifecycle. This sequence mirrors the policy process, ensuring ethical scrutiny matches administrative reality.

  **What I would deprioritize, and why**

  I would deprioritize the question of specifying the neutral baseline against which distortion is measured. While philosophically profound, it is practically intractable for this agency. As the user notes, every candidate baseline likely smuggles in a conception of the good. Spending two years proving neutrality is impossible yields no guidance on how to act given that impossibility. The agency already knows neutrality is unavailable; they need to know how to choose among non-neutral options. This question risks becoming a seminar in political philosophy, which leadership explicitly rejected. Furthermore, settling this would not change what the agency actually does; they must set *some* default regardless of the baseline's status. Resources are better spent on legitimation and drift, which offer procedural off-ramps even if the metaphysical baseline remains contested. We accept non-neutrality as a premise and move to management. The literature largely accepts the impossibility of neutrality; re-litigating this is neglectedness in reverse. It is over-researched relative to its utility. The agency needs operational ethics, not foundational metaphysics. Focusing here might produce elegant theory that gathers dust because it offers no decision procedure for the specific choices faced by public health officials. It is a "nice to know" rather than a "need to know."

  **What would reorder this list**

  Two factors would reorder this list. First, a high-profile legal challenge to a default setting would jump Authority to the top, demanding immediate defensive theory. Second, empirical evidence of measurable harm from a specific nudge mechanism would elevate Mechanism above Drift. If a bias-based nudge causes psychological distress, the distinction between bias and reason becomes urgent liability management. Conversely, if the political environment stabilizes and trust remains high, Drift becomes less urgent, allowing more focus on long-term legitimacy. A change in leadership hostile to paternalism would also prioritize Authority, as the agency's existence would be at stake rather than just its ethics.

  **Bets**

  I would bet on Authority and Drift. I am 80% confident these are the critical vulnerabilities for a public agency. Mechanism is important but secondary to the right to act at all.
