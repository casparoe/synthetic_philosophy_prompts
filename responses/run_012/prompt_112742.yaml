  **The Best Man Speech**

  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being the Best Man.

  Looking around the room, I realise we have a unique demographic split. Roughly half of you are magicians, and the other half are family. Which means half the room knows exactly how the bride makes things disappear, and the other half is still wondering where the groom's hairline went.

  It is a perfect match. [Bride] is a close-up magician. Her job is to manipulate what you see and make the impossible feel real. [Groom] is a philosopher of perception. His job is to argue about whether what you see is real in the first place. They met at a magic club, which is basically the only place on earth where lying to someone's face is considered a form of intimacy.

  Now, I promised [Groom] I wouldn't turn this into a lecture. But you can't talk about this couple without touching on [Groom]'s favourite theory. He specialises in something called 'Disjunctivism'. It sounds like a dental condition, but it's actually a way of understanding how we experience the world.

  Here's the problem he spends his life thinking about: Imagine I hold up a red card. You see it. Now, imagine I hypnotise you, or trick you, and you hallucinate a red card where there isn't one. From the inside, from your perspective, those two moments feel exactly the same.

  For a long time, philosophers argued that because they feel the same, they must be the same *kind* of mental state. This is the 'Argument from Illusion'. It says that whether you're seeing reality or being tricked, the core experience is identical. It suggests that truth and illusion are just variations on the same theme.

  [Groom] says that's rubbish.

  His view—Disjunctivism—says that when you see the real card, and when you hallucinate the card, you are in fundamentally different states of mind. Even if you can't tell the difference from the inside, the nature of the experience is not the same. One is a direct contact with reality; the other is a mere appearance. They don't share a common core. The 'good case' isn't just a lucky version of the 'bad case'. It is its own thing.

  And I think this is the secret to why [Groom] and [Bride] work so well.

  We've all been in relationships that felt like a magic trick. You know the ones. The excitement, the butterflies, the feeling that this person is the centre of the universe. From the inside, a fleeting infatuation can feel indistinguishable from deep, abiding love. If you followed the old philosophical argument, you'd say, 'Well, if it feels the same, it basically is the same.'

  But [Groom] and [Bride] know better. They know that a trick is not the same thing as reality, even if the audience can't spot the join.

  A fling might look like marriage from the outside. It might even feel similar from the inside on a Tuesday night. But Disjunctivism teaches us that the 'good case'—the real thing—is a different category entirely. Real love isn't just a more convincing illusion. It's not a better magic trick. It's the moment the cards are put away, the lights come up, and you're left with something solid that doesn't vanish when you blink.

  [Bride], you spend your life mastering the art of the illusion. [Groom], you spend your life arguing for the reality behind the perception. Together, you've proven that you don't need to choose between the wonder of the trick and the truth of the real. You have both.

  So, if I could ask everyone to stand.

  To the bride and groom. May your life together be the one case where there is no disjunction. May you never have to guess if what you see is real. And may you always know, with absolute certainty, that what you have is not a common factor, but the genuine article.

  To [Bride] and [Groom]!

  ***

  **Philosophical Note: The State of the Debate**

  You asked for clarity on what is settled versus what is contested regarding Disjunctivism, specifically concerning the epistemic/metaphysical distinction. Here is the breakdown so you know exactly where the speech stands relative to the literature.

  **1. Is the debate settled?**
  No. Disjunctivism is a live, highly contested position in the philosophy of perception. It is not the consensus view. The rival view (often called the 'Common Kind Assumption' or 'Common Factor Theory') still has many proponents. The Argument from Illusion remains a powerful objection that disjunctivists must constantly answer. By framing the speech as the Groom's specific area of expertise ("His view says..."), you are safely presenting it as his conviction rather than objective fact, which is philosophically honest.

  **2. Epistemic vs. Metaphysical Disjunctivism**
  These are not the same claim, though they are often motivated by similar intuitions. It is crucial to distinguish them:

  *   **Metaphysical Disjunctivism:** This is a claim about the *nature* of the experience itself. It asserts that the phenomenal character of a veridical perception (seeing a real card) is constituted by the external object. In the hallucination case, that object is absent, so the mental state is fundamentally different in kind. There is no common mental element shared between the two.
  *   **Epistemic Disjunctivism:** This is a claim about *justification* and knowledge (championed notably by Duncan Pritchard in recent years). It argues that in the 'good case' (perception), you have a type of rational support for your belief that is reflectively accessible to you and which you *lack* in the 'bad case' (hallucination), even if the two states are introspectively indistinguishable.

  **The Relationship:**
  One can arguably hold Epistemic Disjunctivism without full-blown Metaphysical Disjunctivism (though it is difficult). One might argue that while the mental states share a common nature (Metaphysical Common Kind), the *warrant* we have in the good case is still fundamentally better (Epistemic Disjunctivism). However, most classic Disjunctivists (like McDowell or Martin) argue that the epistemic advantage rests on the metaphysical difference.

  **For the Speech:**
  Your speech leans into **Metaphysical Disjunctivism** (the idea that the states are 'different in kind'). This is the stronger, more romantic claim for a wedding. You are asserting that Real Love and Infatuation are ontologically distinct, not just that we have better evidence for one than the other. This is philosophically bolder, but perfectly acceptable for a toast, provided it remains attributed to the Groom's perspective as requested.
