answer: |-
  The legal patchwork governing reproductive technologies reveals a fragile and often unspoken metaphysics of the human body, one that attempts to reconcile market logic with human dignity by drawing arbitrary but morally weighted distinctions between parts of the self, services rendered, and persons created. To understand why paying for an egg or a pregnancy is permissible in some jurisdictions while selling a kidney or a baby is universally condemned, we must first reconstruct the implicit theory of bodily integrity and separability that underpins these laws. The prohibition on organ sales rests on the idea that certain body parts are constitutive of the person in a way that their removal diminishes the self or threatens life itself. A kidney is viewed as vital infrastructure; to sell it is to treat the body as a warehouse of spare parts, commodifying the very vessel of existence in a way that suggests the person is reducible to their biological utility. In contrast, eggs and reproductive capacity are categorized differently, not as vital organs necessary for the donor's survival, but as renewable tissues or temporary functions. The implicit theory here is that the body has a boundary between what is essential to the self and what is expendable or cyclical. An egg is framed as a byproduct of a healthy system, and pregnancy is framed as a service performed by the body rather than a surrender of the body itself. This distinction allows the law to treat reproduction as a sphere where market exchange is possible without violating the taboo against treating humans as things, provided the transaction is for the use of capacity rather than the alienation of the person.

  However, this distinction becomes far more precarious when we move from gametes to gestation, and this is where the divergent views on parenthood emerge most sharply. The American model, which permits commercial surrogacy and enforces contracts that transfer parental rights, commits fully to a theory of intentional parenthood. In this framework, being a parent is not primarily a biological fact but a volitional act. The people who initiate the project, provide the genetic material or the funding, and intend to raise the child are the moral and legal parents. This view is not merely a cultural preference but a legal necessity for the market to function. If the law recognized the gestational carrier as the mother by virtue of birth, as many European systems do, then paying her to relinquish the child would constitute baby selling, which is illegal. Therefore, the American system must legally erase the surrogate's motherhood to avoid the charge of trafficking. It presupposes that the womb is a container and the pregnancy is a task, separable from the identity of the woman performing it. The contract does not buy the baby; it buys the service of gestation, with the understanding that the product of that service belongs to the clients from the moment of conception. This creates a view of parenthood that is fundamentally contractual and project-based, where kinship is established through consent and design rather than biology or labor.

  Conversely, the European restriction on commercial surrogacy and the tendency to designate the birth mother as the legal mother regardless of genetic connection or prior agreement reflects a theory of parenthood rooted in embodied labor and biological reality. This view holds that the act of gestation creates an unseverable bond that cannot be waived by contract. It presupposes that the body is not merely a tool that can be rented out without altering the social and moral status of the person. By banning commercial surrogacy, these jurisdictions prioritize the protection of the woman from potential exploitation and the child from being treated as a commodity over the reproductive autonomy of the intending parents. The inconsistency in the global landscape arises because both systems are trying to solve the same problem—how to facilitate reproduction without commodifying human life—but they draw the line of commodification in different places. The American system argues that commodification is avoided by ensuring the child is wanted and planned for by parents with resources, while the European system argues that commodification is inherent in the act of paying for the use of a womb, regardless of the outcome.

  The quiet inconsistency in the American model, and indeed in the permissive frameworks generally, lies in the treatment of the pregnant person during the term of the agreement. If the transaction is truly for reproductive labor, then the surrogate should retain the bodily autonomy typical of a worker, yet the contracts often impose strict behavioral controls regarding diet, activity, and medical decisions that exceed standard employment regulations. If the transaction is for a child, then it skirts the prohibition on baby selling by claiming it is a service fee, yet the payment is often contingent on a live birth, which functionally ties the compensation to the product. This creates a paradoxical status for the surrogate where she is treated as a service provider who must surrender control over her bodily integrity to the clients, yet she is not treated as the mother who has the final say on the pregnancy. The system wants the security of a contract that guarantees a baby without the moral stain of buying a person, so it occupies a middle ground where the woman's body is regulated like a production facility but her legal status is downgraded to that of a contractor with limited rights. This reveals a view of labor that is deeply gendered, where reproductive work is seen as something that can be directed by others because it is naturalized as a female function rather than respected as skilled, risky labor.

  If we were to take seriously the idea that what is being sold is reproductive labor rather than a product, the entire architecture of these agreements would have to shift to align with standard labor protections rather than property law. A consistent labor model would grant the gestational worker the right to make all medical decisions regarding her body, including the right to terminate the pregnancy or refuse selective reduction, without breach of contract, because no worker can be forced to undergo medical procedures against their will. It would also imply that the worker has a claim to the product of their labor, or at least a much stronger voice in its disposition, which would undermine the intending parents' guarantee of parenthood. Alternatively, it would require acknowledging that the labor is so unique that it cannot be alienated from the worker, leading back to the European position that the birth mother must be the legal mother. To treat it purely as labor without granting ownership of the output would require a radical rethinking of intellectual property and creation, where the commissioners of a project own the result despite not performing the work. Currently, the system cherry-picks from both models: it uses the logic of labor to justify payment and the logic of property to justify the transfer of the child.

  Ultimately, the arrangement presupposes a fragmented view of the person where the body can be partitioned into marketable and non-marketable zones based on social utility and perceived harm. It assumes that we can pay for the use of a womb without paying for the baby inside it, and that we can compensate for eggs without valuing the potential life they represent more than the tissue itself. This works only as long as we accept that parenthood is a matter of intent that overrides biology, and that bodily autonomy can be temporarily contracted away in the service of creation. The inconsistency remains that we forbid the sale of organs to protect the poor from being reduced to their biology, yet we allow the rental of wombs, which also disproportionately draws from economically vulnerable populations, suggesting that reproductive capacity is viewed as less central to human dignity than a kidney. Until the theory of the person is reconciled—either by fully embracing the commodification of reproductive capacity as legitimate work with full labor rights, or by rejecting it entirely as a violation of human integrity that cannot be cured by contract—the legal landscape will remain a patchwork of compromises that try to have the benefits of a market without admitting the costs.
