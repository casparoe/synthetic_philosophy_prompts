prompt: |-
  I've been reading around how different countries handle paid egg donation and surrogacy and the split is kind of wild. In alot of Europe you can't pay a woman for her eggs beyond her expenses and commercial surrogacy is banned outright, while in the US there's a whole market — agencies, contracts, donors whose fee climbs if they're tall or went to a good college, surrogates paid a base fee plus expenses, and contracts that spell out what happens if the fetus has a serious condition or if there are too many embryos to carry. Meanwhile nearly everywhere you can't buy a kidney and you can't buy a baby outright. So what does this arrangement presuppose? Reconstruct the implicit theory of the person and the body that puts the lines where they are: why paying for an egg or for someone's pregnancy is fine but buying a kidney or buying a child isn't, and what view of parenthood, labor, and commodification falls out of that. Part of what I'm after is the parenthood bit — the American version seems to only work if being a parent tracks intention and contract, the people who meant to have the child, whereas the European rules often seem to treat the woman who carries the child as the mother whatever anyone signed, and I want you to say which of those the practice really commits to versus which it just happens to fit. Then tell me where the whole thing is quietly inconsistent with itself, and what would have to change if we took seriously the idea that what's being sold is reproductive labor rather than a product. No citations or reading lists please, I know a model can't check them, and write it as continuous prose — no headings, bullets, bold, or tables.
