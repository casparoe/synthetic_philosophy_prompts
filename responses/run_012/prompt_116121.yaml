  # METAPHYSICS HANDOUT: THE DISPOSITION DECISION TREE

  **Instructions:** Start at the top. Answer each question based on your intuitive verdicts about the cases provided. Follow the arrows to your metaphysical position. Do not worry about the technical names until you reach the bottom.

  **The Cases:**
  *   **(a) Finkish Wire:** A live wire disposed to shock, but wired to a device that cuts the current the instant anything touches it. (Disposed: Yes. Shocks: No.)
  *   **(b) Masked Glass:** A fragile glass packed in foam. (Disposed: Yes. Breaks: No.)
  *   **(c) Saturated Sugar:** A soluble cube dropped in saturated water. (Disposed: Yes/No? Dissolves: No.)
  *   **(d) Mimic Glass:** A tough glass with a hidden shatter-mechanism. (Disposed: No. Breaks: Yes.)
  *   **(e) Drugged Brave:** A brave person given a fear-drug. (Disposed: Yes. Flees: Yes.)

  ---

  ### [NODE 1] The Counterfactual Test
  **Look at cases (a) and (d). Do these show that an object can have a disposition even if the 'if-then' claim is false, or lack one even if the claim is true?**
  *   **NO** (The counterfactual claim is enough; the wire loses its disposition instantly / the mimic glass counts as fragile). → **Go to Node 2.**
  *   **YES** (The wire is still disposed / the mimic glass is not fragile; counterfactuals are insufficient). → **Go to Node 3.**

  ### [NODE 2] The Interference Clause (SCA Path)
  **Look at cases (b) and (c). Is the failure to dissolve in (c) a failure of the stimulus conditions, while the failure to break in (b) is an external interference?**
  *   **YES** ((c) isn't a proper test, but (b) is masked). → **LEAF A: Plain Conditional Analysis.**
  *   **NO** (Both are cases where the disposition exists but is prevented from manifesting). → **LEAF B: Refined Conditional Analysis.**

  ### [NODE 3] The Reality Check (Non-SCA Path)
  **Since counterfactuals aren't enough, is a disposition a real property belonging to the object itself?**
  *   **NO** (It is not a property of the object). → **Go to Node 4.**
  *   **YES** (It is a real property). → **Go to Node 5.**

  ### [NODE 4] Laws or Fictions?
  **If it is not a property of the object, is disposition-talk a claim about the laws of nature or just a useful fiction?**
  *   **LAWS** (To be disposed is to be governed by a specific law). → **LEAF C: The Nomic View.**
  *   **FICTION** (Dispositions are not real; only patterns of behavior exist). → **LEAF D: Eliminativism / Fictionalism.**

  ### [NODE 5] The Basis Identity
  **If it is a real property, is the disposition *identical* to its physical basis (e.g., the molecular structure)?**
  *   **YES** (The disposition just *is* the structure, described differently). → **Go to Node 6.**
  *   **NO** (The disposition is distinct from the structure, which merely realizes it). → **Go to Node 6.**

  ### [NODE 6] The Metaphysical Ground
  **Is the ultimate ground of the disposition a non-modal categorical structure (purely physical), or something inherently modal/functional?**
  *   **CATEGORICAL** (The ground is non-modal physical structure). → **LEAF E or F.**
  *   **MODAL/FUNCTIONAL** (The ground involves necessity or causal roles). → **LEAF G or H.**

  ---

  ### THE POSITIONS (LEAVES)

  **LEAF A: Plain Conditional Analysis**
  *   *Commitment:* You must deny the glass in foam (b) is fragile, or argue the wire (a) loses its disposition the instant before touch.
  **LEAF B: Refined Conditional Analysis**
  *   *Commitment:* You must accept that 'if-then' claims are only true when prefixed by an open-ended 'nothing interferes' clause.
  **LEAF C: The Nomic View**
  *   *Commitment:* You must accept that objects do not have powers; only the laws governing them are real.
  **LEAF D: Eliminativism / Fictionalism**
  *   *Commitment:* You must treat all disposition talk as a useful falsehood, like speaking of 'sunrise' while knowing the earth moves.
  **LEAF E: Categorical Reduction (Identity Theory)**
  *   *Commitment:* You must accept that dispositions are nothing over and above categorical properties, rendering the modal talk redundant. *(Reached via Node 5: YES + Node 6: CATEGORICAL)*
  **LEAF F: Second-Order Property (Role Functionalism)**
  *   *Commitment:* You must accept that dispositions are extrinsic properties defined by whatever causal role happens to fill them. *(Reached via Node 5: NO + Node 6: CATEGORICAL)*
  **LEAF G: Dispositional Monism (Essentialism)**
  *   *Commitment:* You must accept that all physical properties are fundamentally powers, leaving no categorical bedrock. *(Reached via Node 5: YES + Node 6: MODAL)*
  **LEAF H: Irreducible Dispositionalism (Sui Generis)**
  *   *Commitment:* You must accept that dispositions are unique, fundamental properties that cannot be analyzed into anything else. *(Reached via Node 5: NO + Node 6: MODAL)*

  ---

  ### NOTES FOR DISCUSSION

  **(i) Indistinguishable Leaves:**
  **Leaf E (Categorical Reduction)** and **Leaf F (Second-Order Property)** are often metaphysically distinct but empirically identical. Both agree that a categorical base makes the disposition true; they disagree only on whether the disposition *is* that base (Identity) or a higher-order property *had* in virtue of that base (Realization). Your case verdicts may not separate these; the choice often turns on parsimony rather than evidence.

  **(ii) Unoccupied Combinations:**
  1.  **SCA + Fictionalism:** Nobody occupies this. If you think dispositions are fictions, you already reject the truth of the counterfactuals SCA relies on.
  2.  **Dispositional Monism + Categorical Ground:** This is incoherent. Monism claims everything is dispositional; a categorical ground denies that by definition.
  3.  **Plain Conditional + Masking Verdict:** If you insist the foam-packed glass (b) is *fragile* but stick to the Plain Conditional, you are contradicting yourself (since it won't break). This combination collapses into Leaf B.
