answer: |-
  **Feature:** Physical Leverage (the capacity to directly move or constrain physical matter).

  **Scenario 1**
  Alice wears a consumer VR headset to visit a shared virtual gallery. Her ex-partner, who has admin access, deletes her curated collection of digital sculptures. Alice suffers genuine, diagnosed depression over the loss (real harm). However, the deleted files exist only on a private server; the sculptures cannot block a physical doorway or cut physical paper (no physical leverage).

  **Scenario 2**
  Bob wears AR glasses while operating a remote robotic arm in a hazardous zone. A virtual bounding box prevents him from moving the arm into a fragile container. The virtual box halts the physical motor (physical leverage). The container remains intact, and no injury occurs (no harm).

  **Analysis**
  For the **Functionalist**, virtual things are real if they play causal roles. In Scenario 1, the object lacks physical leverage, causing only internal mental states; thus, the object is unreal, though the harm (depression) is real. In Scenario 2, the virtual box constrains physical machinery, playing a robust causal role; thus, the object is real, and the lack of damage means no harm occurred.

  For the **Illusionist**, virtual things are representations, like pictures. In Scenario 1, the object is merely an image; the harm is a real psychological reaction to that image, not the image itself. In Scenario 2, the virtual box is a display interface; the *robot* is real, but the virtual overlay remains a representation, regardless of its leverage.

  **Physical Leverage** does the work. It distinguishes causal power over matter versus mind. If you strip Physical Leverage from Scenario 2 (the box no longer stops the robot), the Functionalist must concede the object is unreal, collapsing Case 2 into Case 1. The object loses its causal grip on the world.

  A skeptic who believes **virtual stuff is never real** defuses Scenario 1 by separating the stimulus from the injury. They argue Alice's depression is real, but it is caused by her *belief* in the object's value, not the object itself. The object remains code—a fiction—while the harm is a factual physiological response to a false premise. The reality lies entirely in the brain, never in the virtual thing.
