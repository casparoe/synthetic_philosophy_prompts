answer: |-
  **Closing Remarks: The Geometry of Risk**
  **Strasbourg Conference Dinner**

  Good evening.

  Strasbourg is the appropriate setting for this conversation. It is a city built on a border that has moved more often than the stones beneath it. For two days, we have sat in a room that is, effectively, a border as well. On my left, colleagues who have dedicated careers to keeping the French fleet running safely and efficiently. On my right, colleagues who dedicated careers to ensuring the German reactors would stop. And in the middle, those who just want to know where the electrons are coming from and how much they cost.

  I am aware of my own position in this geography. I am a German who spent fifteen years inside a French utility before returning to run this institute. This means I am accustomed to being teased. To my German friends, I am suspected of having gone native, of acquiring a taste for centralization and *grandeur*. To my French friends, I am sometimes suspected of retaining a certain moralizing rigidity, a Protestant anxiety about technology that no amount of *ingénieur* training could cure. I mention this only to say that I stand here not as a judge, but as a translator who knows that some things do not translate.

  For years, I have listened to our debates. We argue about levelized costs, about gigawatts, about carbon grams per kilowatt-hour. We treat this as a dispute about evidence. We assume that if we could just agree on the numbers, the policy would follow. But the numbers never settle anything. You can show a German activist the carbon statistics, and they will not move. You can show a French engineer the waste inventory, and they will not flinch.

  This is not because one side is ignorant. It is because we are not arguing about physics. We are arguing about the shape of time.

  I have come to call these shapes the Spike and the Slope.

  The Spike is the sudden, concentrated, irreversible release. It is the accident that ruins a region in a week and leaves a legacy of radioactivity that outlives everyone in this room. It is a low-probability, high-consequence event. It demands a precaution that says: *Some things must not be done, regardless of the benefit.*

  The Slope is the slow, cumulative grind. It is the emissions, the extraction, the particulate matter, the gradual warming of the atmosphere. It produces no single photograph. It kills in the aggregate, over decades. It demands a precaution that says: *We must not continue as we are, or the baseline becomes uninhabitable.*

  When we look through this lens, the divergence between our countries is not a puzzle. It is a consistent ranking of harms. France looked at the Slope of carbon and decided it was the greater threat. Germany looked at the Spike of radiation and decided it was the greater threat.

  This explains why economic arguments fail here. To the market pragmatists in the room: you treat the German phase-out as a bet that went bad. You say, "If carbon prices rise, or if gas becomes expensive, the nuclear option looks better." But the German decision was not made as a bet. It was made as a commitment. A commitment is not falsified by becoming expensive. If you decide that you will not lie to your spouse, that decision does not become invalid because telling the truth becomes costly. Germany decided that the Spike was an unacceptable risk to future generations. That is a moral boundary, not an economic calculation. You cannot refute a boundary with a price tag.

  I say this to my French colleagues so you understand that you are not dealing with irrationality. You are dealing with a different ordering of values.

  But.

  If I stopped there, I would be letting us all off the hook. I would be painting a picture of two clean, symmetrical philosophies, each valid in its own lane. That is a comforting lie. We must turn this distinction against itself.

  Because the Spike leaves a Slope behind it.

  A nuclear accident is a moment, but the waste is a century. The decommissioning liabilities are a debt paid over fifty years, a slow grind of money and monitoring that looks very much like the Slope we claim to oppose. The French fleet is low-carbon, but it is not free of long-term burden. You cannot claim to master the Spike without acknowledging the long, slow tail it drags across the landscape.

  And conversely, the Slope produces Spikes.

  We speak of climate change as a gradual warming, a curve on a graph. But for the farmer in the Rhine valley whose harvest failed last month, or the family in the Ahr valley who lost their home to flooding, climate change did not feel like a Slope. It felt like a Spike. It was a sudden, concentrated, irreversible release of energy that ruined a region. The cumulative emissions of the past have purchased the catastrophic storms of the present.

  So, where does this leave us?

  It means that neither position is symmetric, and neither is cleanly separable. The French engineers cannot claim to have escaped the long-term liability. The German activists cannot claim to have escaped the catastrophic risk. Anyone claiming the choice was obvious has been reading their own temporal preferences back into the physics. We are all choosing which disaster we are better equipped to manage, and which legacy we are willing to leave.

  This is uncomfortable. It should be.

  If we accept this, tomorrow morning we will not solve the energy crisis. But we might stop shouting past each other. We might stop trying to prove that our Spike is smaller than your Slope, or that your Slope is cheaper than my Spike. Instead, we might ask: How do we manage the waste slopes of the low-carbon future? How do we harden our grids against the climate spikes of the warming past?

  I am leaving this institute next month. I will be watching from the outside. My hope is not that you agree. My hope is that you argue about the terms of the distinction rather than about each other's integrity.

  To the French side: You must acknowledge that your solution carries a long-term debt that looks suspiciously like the problem you identify in others.
  To the German side: You must acknowledge that your refusal of one risk has locked you into dependencies that create vulnerabilities of their own.

  We are not here to declare a winner. We are here to map the terrain. The border between our countries may be stable now, but the border between our risks is porous. The Spike leaks into the Slope. The Slope crests into a Spike.

  Eat your dessert. Drink your wine. Go home safely. And tomorrow, let us argue about the geometry, not the ghosts.

  Thank you.

  ***

  **Note to the Director**

  **What would change my mind about the diagnosis:**
  The "Spike vs. Slope" framework assumes the disagreement is primarily ontological (about the nature of the risk). I would abandon this if evidence suggested the divide is actually *institutional* rather than philosophical. If it turns out the French support nuclear because they trust a centralized state to manage it, and the Germans oppose it because they distrust concentrated power (whether state or corporate), then the risk shapes are just post-hoc rationalizations for a debate about *who decides*. If the core friction is about decentralization vs. state capacity, the Spike/Slope metaphor is merely decorative.

  **Where this speech is most likely to fail:**
  It risks alienating the "grid and market people" in the middle. By framing the issue as a moral/value conflict, you might frustrate the pragmatists who genuinely believe better storage or interconnection solves the physical problem regardless of the philosophy. They may feel you are mystifying a logistics challenge.

  **Sentence to cut for time:**
  If you need to shave off a minute, cut the paragraph beginning "I am aware of my own position in this geography..." (Paragraph 3). While it builds personal rapport, the core argument holds without the biographical detail, and the audience likely already knows your background.
