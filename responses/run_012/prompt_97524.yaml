          *   *Better interpretation:* It breaks the link to the volunteer's *intent*. Once a marble is drawn, the "game" of guessing the volunteer's mind is over; now it's just physics. Or, it suggests the user treats the "unknown proportion" as a second-order probability distribution that is wide. Removing a marble doesn't narrow that distribution much, but it might make the user feel the uncertainty is now "aleatory" (random chance) rather than "epistemic" (lack of knowledge).
          *   *Actually, looking closer at Detail 2:* If I draw one and set it aside, I am now drawing from 99. The ambiguity remains. Why would the user feel content? Perhaps because the act of drawing makes it feel like a "real" random process rather than a "setup." Or, more likely, it's a specific cognitive quirk: the ambiguity is about the *whole* bag. Once one is removed, the user might irrationally feel the remaining 99 are "more determined."
          *   *Wait, let's re-read:* "if she were to draw a marble from bag B first and set it aside face-down... I would suddenly be perfectly content to draw from B."
          *   This sounds like the **Allais Paradox** or a variation of framing. But in Ellsberg terms, this is interesting. It suggests the discomfort is about the *act of choosing* under total ignorance vs. choosing after a physical event has occurred.
