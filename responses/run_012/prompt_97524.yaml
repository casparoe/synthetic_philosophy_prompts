      *   *Correction:* I need to explain *why* the user feels this way, not necessarily prove it's mathematically optimal in a vacuum. The prompt asks "whether the discomfort I feel is tracking something genuine."
      *   *Genuine Thing:* The discomfort tracks the **source** of uncertainty. Detail 2 makes the source feel more like "chance" and less like "strategy."
