      *   **Detail 2 (Face-Down Marble):** Why does this help?
          *   If the volunteer is adversarial, they might adjust Bag B *after* you pick a color but *before* you draw.
          *   If a marble is drawn *first*, the composition is physically altered and "locked." The volunteer can't swap the bag as easily without it being obvious (one marble missing).
          *   Alternatively, it shifts the uncertainty from "Volunteer's Mind" to "Physical Randomness."
          *   This suggests the user's discomfort is specifically about **Epistemic Uncertainty** (what does the volunteer know?) rather than **Aleatory Uncertainty** (random chance).

