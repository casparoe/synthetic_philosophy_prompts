      *   The roommate assumes **Probabilistic Sophistication**: You can always map uncertainty to a number.
      *   The user assumes **Ambiguity Matters**: The *confidence* in the probability estimate matters, not just the estimate.
      *   **Maxmin Expected Utility (MEU):** Instead of maximizing $E[U]$, the user maximizes the minimum $E[U]$ across a set of possible probabilities.
