answer: |-
  Here is the scenario, the evaluation under the three views, and the honest verdict on your hunch.

  ### The Scenario: Elena at the Pharma Depot

  **The Agent:** Elena, a night-shift quality control clerk at a pharmaceutical distribution center.
  **The Setting:** A sterile packing room. A conveyor belt brings her a crate of 100 identical sealed bottles of a common generic drug (Propositions $p_1$ through $p_{100}$, where $p_i$ = "Bottle $i$ contains the correct dosage").
  **The Evidence:** For each bottle, Elena performs a specific, individual check: she scans the barcode, weighs the bottle, and checks the seal integrity. Based on her training and the reliability of her equipment, each individual check gives her a **0.99 credence** that the specific bottle is correct.
  **The Background Statistic:** Elena knows the supplier's historical error rate. Even when bottles pass these specific checks, the "false negative" rate is such that in any random batch of 100, it is **99% probable that at least one bottle is defective**. (This mirrors the Lottery structure where the conjunction is known to be false, and the Preface structure where the conjunction is known to be highly likely false).

  **The Two Guises:**
  1.  **The Ticket-Holder Guise (Unbundled):** Elena stands at the belt. As each bottle passes, she stamps "PASS" on its individual label. She files 100 separate logs. She never forms a belief about the batch as a whole; she only ever attends to $p_i$ in isolation.
  2.  **The Preface-Author Guise (Bundled):** Elena stands at the end of the line. She watches the 100 bottles pass (performing the same checks), but she is required to sign a **single Batch Certificate** that reads: "I certify that all bottles $p_1$ through $p_{100}$ are correct." She then files this one document.

  In both guises, the evidence per proposition is identical (0.99 credence). In both guises, the statistical reality is identical (it is near-certain the conjunction is false). The only variable is whether the doxastic commitment is atomized (100 acts) or aggregated (1 act).

  ***

  ### The Three Views Applied

  Here is how the three standard responses to the paradoxes handle Elena's two guises.

  #### 1. The Lockean Thesis (Belief = Credence above a threshold)
  *Assume the threshold for belief is 0.95.*

  *   **Ticket-Holder Guise:** For every individual bottle $p_i$, Elena's credence is 0.99. This is above the 0.95 threshold.
      *   *Verdict:* It is rational for Elena to **believe** each "PASS" stamp she makes. She holds 100 rational beliefs.
  *   **Preface-Author Guise:** To sign the certificate, Elena must believe the conjunction $\bigwedge p_i$. The credence in a conjunction of independent probabilities is the product of the parts ($0.99^{100} \approx 0.36$). This is well below the 0.95 threshold.
      *   *Verdict:* It is **irrational** for Elena to sign the certificate (if signing implies belief). She cannot believe the conjunction, even though she believes every conjunct.
  *   **The Outcome:** This view validates your hunch. The epistemic status of the *atoms* doesn't change, but the *packaging* forces a mathematical operation (multiplication of probability) that drops the conjunction below the belief threshold. The paradox arises here because we intuitively expect belief to agglomerate (if I believe $A$ and believe $B$, I believe $A \land B$), but the Lockean Thesis says it doesn't.

  #### 2. The "No Lottery Knowledge" View (Skeptical/Williamson-style)
  *This view holds that one cannot know or rationally believe propositions based purely on statistical evidence, even if high probability.*

  *   **Ticket-Holder Guise:** Elena's evidence for each $p_i$ is mixed: specific checks (weight/seal) + statistical reliability. However, the statistical background (1% error rate) is always present. A proponent of this view argues that the statistical chance of error defeats the claim to knowledge/belief, regardless of the specific check.
      *   *Verdict:* Elena does not **know** or fully **believe** any individual bottle is safe. She only assigns high probability. She is effectively "betting" on each bottle, not asserting knowledge.
  *   **Preface-Author Guise:** The statistical evidence is even more salient here, but the verdict was already determined at the atomic level.
      *   *Verdict:* Elena cannot sign the certificate as a statement of knowledge.
  *   **The Outcome:** This view **collapses the distinction**. It says Elena was never in a position to believe the atoms in the first place. Bundling changes nothing because the "Lottery intuition" (that statistical evidence isn't enough for belief) applies to the individual checks just as much as the batch. If this view is right, your hunch is partially correct: the paradoxes are the same because *both* are illusions created by mistaking high probability for belief.

  #### 3. The Rational Inconsistency View (The Author is Irrational)
  *This view holds that it is irrational to hold contradictory beliefs. If you believe $p_1...p_{100}$ and you believe $\neg(p_1 \land ... \land p_{100})$, you are irrational.*

  *   **Ticket-Holder Guise:** Elena believes each $p_i$. Does she believe $\neg \bigwedge p_i$? In this guise, she never forms the conjunction belief, so she never explicitly believes the negation of the conjunction. She keeps the statistical knowledge in a separate "background" box.
      *   *Verdict:* She is **rationally permissible** (by avoidance). She navigates the paradox by refusing to bundle her beliefs.
  *   **Preface-Author Guise:** By signing the certificate, she asserts $\bigwedge p_i$. But she still possesses the background knowledge that $\neg \bigwedge p_i$ is 99% likely. She now holds explicit contradictory commitments in one document.
      *   *Verdict:* She is **irrational**. To be rational, she must either refuse to sign or add a disclaimer (the "Preface") admitting the likely error, thereby withdrawing the claim to know the conjunction.
  *   **The Outcome:** This view suggests bundling **forces the inconsistency into the open**. In the Ticket guise, the inconsistency is latent (she believes the parts, and *should* believe the negation of the whole, but doesn't). In the Preface guise, the act of bundling requires her to commit to the whole, making the inconsistency manifest.

  ***

  ### The Verdict on Your Hunch

  **Is bundling doing epistemic work or assertability work?**
  Honestly: **It is doing doxastic architecture work, which feels like epistemic work.**

  Bundling does not change the *evidence* for the individual claims ($p_1$ is supported by the weight check in both guises). However, belief is sensitive to logical relations. By bundling, you change the *object* of belief from $p$ to $\bigwedge p$. Since the probability of $\bigwedge p$ is objectively lower than $p$, bundling changes the *rational credence* in the object of belief.

  So, bundling doesn't change the *input* (evidence), but it changes the *calculation* (probability of the proposition). If you define "epistemic work" as "changing the evidence," then bundling does nothing. If you define it as "changing the rationality of the attitude," then bundling does everything.

  **Which single feature must you remove to collapse the two guises?**
  You must remove the **Principle of Agglomeration** (the rule that if you believe $A$ and believe $B$, you are committed to believing $A \land B$).

  If agglomeration is not required, then the "Preface Author" is just a "Ticket Holder" who happens to speak quickly. She believes $p_1$, believes $p_2$... believes $p_{100}$. She does *not* believe $\bigwedge p_i$. The "Preface Paradox" disappears because there is no requirement for her to believe the conjunction just because she believes the parts. The "Lottery Paradox" also softens, because she can believe every ticket loses without being forced to believe *all* tickets lose. Without agglomeration, the two guises are identical: a collection of atomized beliefs that do not sum to a conjunction belief.

  **How would an "Evidential Difference" theorist attack this setup?**
  A philosopher who insists the Lottery and Preface are fundamentally different (e.g., Jennifer Lackey or someone who emphasizes the *nature* of evidence) would attack your scenario on the **Salience of Statistical Evidence**.

  They would argue:
  > "In the **Ticket-Holder Guise**, Elena's evidence for $p_1$ is *specific* (the weight check). The statistical error rate is background noise. It does not defeat her specific evidence.
  > In the **Preface-Author Guise**, by considering the batch as a unit, Elena makes the *statistical* evidence salient. The statistical evidence (1% error rate) is now the primary lens through which she views the claims. Statistical evidence alone is not sufficient for knowledge/belief (the 'Lottery Intuition'). Therefore, in the Bundled Guise, the statistical evidence *defeats* the specific evidence, whereas in the Unbundled Guise, it does not."

  **Their conclusion:** The difference isn't packaging; it's that packaging changes *which evidence is defeating*. In the unbundled case, specific evidence wins. In the bundled case, statistical evidence wins. Therefore, the paradoxes are different because the *defeaters* are different.

  ### Summary for your Flatmate
  You can tell them this: The paradoxes are structurally identical regarding probability calculus (the math of the conjunction is the same). Your hunch is right that **bundling** is the trigger that forces the agent to confront the conjunction. However, whether that trigger counts as an "epistemic difference" depends on whether you think moving from specific to statistical salience changes the *type* of evidence you have. If you think evidence is just probability, you win (it's the same paradox). If you think evidence has a qualitative structure (specific vs. statistical), your flatmate wins (the bundling changes the evidence type).
