prompt: |-
  My flatmate and I spent most of last night going round in circles about whether the lottery paradox and the preface paradox are really the same paradox, and I'd rather stop trading intuitions and build a case instead. My hunch is that the difference isn't about evidence at all -- both agents have the same kind of reason to think one of their many claims is false -- it's about packaging: the preface author has to put all hundred claims into one act, and the ticket holder never does. So build me one scenario, one ordinary person, realistic (an office or a shop, not an urn), where the same agent with the same evidence and the same credence in each of a hundred propositions gets treated like the preface author in one guise and like the ticket holder in the other, and the only thing that changes is whether the propositions get bundled into a single act. Then work out what each of the three obvious responses says about both guises -- belief as credence above a line, the view that you can't believe or know lottery-type propositions, and the view that the author is being rationally inconsistent -- and don't just declare the verdicts, they have to fall out of each view. Tell me honestly whether the bundling is doing epistemic work or only work about what your allowed to assert, which single feature I'd have to remove to make the two guises collapse back into one case, and how someone who thinks the real difference is evidential would attack my setup.
