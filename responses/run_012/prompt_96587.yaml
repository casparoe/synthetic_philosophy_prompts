      *   *Refining the "Indestructible Guy":*
          *   Is it cheating? No, it's a modal test. But does it work? If the guy survives, did you violate DDE? DDE forbids intending *evil*. Death is the evil. If he lives, no evil intended? But you still used him. This shows DDE might actually be about "Using Persons" (Kant) rather than "Intending Evil" (Aquinas). Owen is accidentally proving Dana's point that DDE is a trenchcoat.

      *   *Refining the Loop/DDE:*
