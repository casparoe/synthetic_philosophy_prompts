answer: |-
  The yellow bulb glowed sickly over the kitchen table. Dana stood on a chair, screwing it into the porch fixture visible through the window.

  "Seriously?" I said, leaning against the counter. "We're doing the yellow bulb thing again?"

  "It's about spectral output, Sam. Less UV. Fewer attractions." She stepped down, wiping dust off her hands. "If the math holds, this is higher impact than my malaria donation."

  "The math doesn't hold. It's rigged. You're taking a probability—let's say one in a million that a bug feels pain—and multiplying it by a quintillion bugs. You can get any answer you want by tweaking the exponent. It's Pascal's Wager with wings."

  Dana sat down, pulling her laptop closer. "It's not wagering. It's expected value. You do risk assessment in backend engineering all the time. Rare failure modes multiplied by catastrophic cost. You patch them even if the odds are tiny."

  "Because I have logs. I know the failure mode exists. Here, you're guessing the probability *and* the magnitude. If I count moral weight per bug, you get X. If I count per neuron, you get Y. If I count per second of existence, you get Z. Who decides the unit of account? You're just tuning the knob until the output looks scary."

  "That objection proves way too much," Dana said, not missing a beat. "How do you count human suffering? Do you count heads? Quality-adjusted life years? Potential lifetime earnings? If you reject moral math because the units are ambiguous, you can't justify donating to malaria charities either. You'd have to be a total skeptic."

  "I'm not saying don't count. I'm saying your variables aren't independent. That's the engineering problem. You're treating 'number of bugs' and 'probability of sentience' like separate inputs. They aren't. The same biological simplicity that makes me think a bug is less likely to suffer is exactly why there are so many of them. Complexity is expensive. Nature trades depth for breadth. So when your number goes up, your probability should go down. They cancel out."

  Dana tapped her pen against the table. "Okay. Assume they correlate. Assume a housefly is one-thousandth as morally relevant as a human. There are still twenty million times more flies than humans. The scale difference swamps the weight difference. You're trying to find a reason to ignore the tail risk."

  "I'm trying to avoid overfitting the model. When a model outputs 'drop everything to save the insects,' that's a sanity check failure. It's like an algorithm telling you to spend the entire budget on a one-in-a-billion server crash. You don't just pay the bill; you check the code."

  "Fine. Check the code. But what's the alternative action? You say the math is rigged. Okay. So what do you do? Do you assume zero probability? That's dogmatic. Do you assume human-level probability? That's speciesist. If you suspend judgment, you default to the status quo, which is mass slaughter. Suspicion isn't a strategy, Sam. It's just procrastination with extra steps."

  "It's not procrastination. It's recognizing that when uncertainty is this high, you shouldn't act on the expected value alone. You need a confidence interval. And ours is basically the entire number line. If I'm not confident in the inputs, I shouldn't max out the bet. I should hedge. Keep the malaria donation. Buy the bulb if it's cheap, sure, but don't act like this is the single most important thing you've ever done."

  Dana leaned forward. "Hedging is fine. But you're using 'confidence' as a shield to ignore high-stakes possibilities. If there was a one percent chance a building was going to collapse, you wouldn't say, 'Well, my confidence interval is wide, so I'll just keep working.' You'd evacuate. The stakes here are astronomical. Even if your correlation argument holds, even if the probability is lower than I think, the sheer volume of potential suffering means the expected cost is still higher than human causes. You're letting perfect be the enemy of the good."

  "The perfect isn't the enemy of the good, the imaginary is the enemy of the real. Malaria kills people. We know they suffer. We know the intervention works. Your bug argument relies on a chain of metaphysical assumptions that could all snap. If you switch your donation based on this, you're optimizing for a ghost."

  "And if you ignore it, you might be ignoring a genocide happening in the grass," Dana shot back. "Look, I get the Pascal's Wager worry. But Pascal's Wager is about infinite utility. This is finite. It's just... really big. You're comfortable donating to prevent existential risk for humans, right? Things that might not happen for a hundred years?"

  "Sure. Because the actors are known. The mechanisms are known."

  "The mechanism here is nervous systems. We know they have them. We know they react to damage. You're drawing a line at 'complexity,' but evolution doesn't draw lines. It's a gradient. Where do you stop? A mouse? A fish? A worm? If you admit they matter at all, the numbers game wins. There are just so many more of them at the bottom of the gradient."

  I sighed, rubbing my eyes. "I admit they matter. I just don't admit that your calculator tells me how much. You're dividing by zero somewhere, Dana. You're treating 'moral weight' like it's a scalar quantity you can sum up across species. Maybe it's not. Maybe 'suffering' isn't the same thing in a brain with two hundred neurons as it is in a brain with two hundred billion."

  "Maybe," Dana said. "But 'maybe' doesn't stop the killing. If you're even vaguely unsure, the precautionary principle says you act as if they count. You don't need the exact scalar. You just need to know it's not zero."

  "And I'm saying the precautionary principle breaks when the cost of precaution is 'abandon proven human aid.' That's a trade-off. You're making it. You're saying bug-maybe-suffering is worth human-definite-suffering. That's a value judgment, not a math problem. Don't hide behind the expected value formula."

  Dana was quiet for a moment. She looked at the yellow bulb glowing outside. "I'm not hiding. I'm following the consistency. If I claim to care about suffering, I have to follow where the numbers lead, even if it's uncomfortable. If you stop because the math gets hard, you're admitting you care more about being logically comfortable than about the suffering itself."

  "I care about not being deluded," I said. "There's a difference between following the numbers and chasing a phantom because the math looks big."

  "Then find the error," Dana said, standing up. "Don't just tell me to ignore the result. Show me where the model breaks. Until then, I'm changing the bulb. And the donation."

  "And if you're wrong?"

  "Then I wasted some money. If you're wrong, you ignored a lot of pain." She closed her laptop. "We're both betting. I'm just admitting the size of my bet."

  She walked out to the living room. I stayed in the kitchen, under the yellow light, watching the moths hammer themselves against the glass anyway.
