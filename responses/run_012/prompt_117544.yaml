answer: |-
  # Specification for a Principle of Credal Reflection

  ## 1. The Desiderata List
  To count as adequate for adjudicating cases, a principle linking present credences to expected future credences must satisfy the following functional requirements.

  ### 1.1 Case Coverage
  The principle must deliver determinate verdicts on the following scenarios without requiring ad hoc exceptions:
  *   **Self-Locating Uncertainty:** It must handle cases like Sleeping Beauty, where the agent's uncertainty concerns *when* or *who* they are, not just what the world is like. A principle that crashes when indexical information shifts is insufficient.
  *   **Epistemic Impairment:** It must forbid deference when the agent knows the future self will be impaired (drunk, concussed, exhausted). If I know I will be drunk in an hour, my current credence should not match my expected drunk credence.
  *   **Evidence Asymmetry (Better):** It must permit deference when the future self has strictly more evidence (e.g., they will see the test result I am waiting for).
  *   **Evidence Asymmetry (Worse):** It must forbid deference when the future self has strictly less evidence (e.g., they will have forgotten a key premise I currently hold).
  *   **Persuasion and Akrasia:** It must handle cases where the agent expects to be persuaded by an argument they currently deem fallacious. If I think I will be talked into believing $A$ by a sophism, the principle must not force me to believe $A$ now.

  ### 1.2 The Uncertain Reliability Condition
  The principle must address the case where the agent is uncertain about the future self's net reliability.
  *   **The Scenario:** You expect the future self to have better evidence but worse reasoning capacity (e.g., time pressure). You are not certain they are an authority, nor certain they are compromised.
  *   **The Requirement:** The principle must specify whether this calls for partial deference (weighting the future credence by estimated reliability) or total suspension of the principle.
  *   **The Classification:** It must clarify whether a weighted approach counts as a version of Reflection or a distinct principle of Expertise. If it is the latter, it requires independent justification beyond diachronic coherence.

  ### 1.3 Conceptual Distinctions
  The principle must not collapse the following distinctions:
  *   **Information vs. Reasoning:** It must distinguish between changes in credence due to new evidence (updating) and changes due to cognitive degradation (corruption). A principle that treats both as mere 'credence shifts' is inadequate.
  *   **Coherence vs. Accuracy:** It must specify whether it is a constraint on internal consistency (don't contradict your future self) or a truth-tracking norm (your future self is likely to be right).
  *   **Self vs. Other:** It must explain why deference to a future self is treated differently from deference to another person. (Standard Reflection treats the future self as privileged; a general expertise principle does not).
  *   **Certainty vs. Expectation:** It must distinguish between being *certain* what your future credence will be ($C_t(C_{t'}(A)=x) = 1$) and merely having an *expectation* over a range of possible future credences.
  *   **Credence vs. Outright Belief:** It must state whether it applies only to degrees of belief or requires a counterpart for binary belief. If it applies only to credence, it cannot settle cases framed in outright acceptance.

  ### 1.4 Formal and Background Consistency
  *   **Probability Calculus:** The principle must not generate probabilities outside $[0, 1]$ or violate axioms of probability when combined with standard conditionalisation.
  *   **Conditionalisation:** It must be consistent with the rule of Conditionalisation. If Reflection forces a credence change that Conditionalisation forbids (in the absence of new evidence), the conflict must be resolved.
  *   **Dutch-Book Scope:** It must acknowledge what the Dutch-book argument actually delivers. (Does it force Reflection on its own, or only in conjunction with the assumption that the future self is also immune to Dutch books?)
  *   **Idealisation:** It must state whether it binds non-ideal agents. If it requires computing quantities a bounded agent cannot access, it must be explicitly restricted to idealised agents, or a heuristic counterpart must be provided.

  ---

  ## 2. Conflict Analysis: The Incompatible Requirements

  You are correct to suspect a fundamental tension. The following two requirements cannot be satisfied simultaneously in all cases:

  1.  **The Certainty Constraint:** The principle applies whenever the agent is certain what their future credence will be. (i.e., If $C_t(C_{t'}(A)=x) = 1$, then $C_t(A)=x$).
  2.  **The Impairment Constraint:** The principle must not require deference to a future self the agent has reason to think is epistemically worse off (e.g., drunk, forgetting, or reasoning poorly).

  **The Conflict:**
  Suppose I am certain that in one hour I will be drunk, and I am certain that while drunk I will have a credence of 0.9 in proposition $A$ (perhaps due to liquid courage).
  *   By **The Certainty Constraint**, my current credence in $A$ must be 0.9.
  *   By **The Impairment Constraint**, my current credence in $A$ should *not* be 0.9 (because I know the drunk self is unreliable).
  *   Therefore, the principles contradict.

  Most literature resolves this by quietly restricting the Certainty Constraint. They argue that Reflection only applies when you expect your future self to be *updating rationally*. But this creates a circularity: to know if Reflection applies, you must already know if your future credence is rational. But Reflection is supposed to tell you what credence is rational.

  ### 2.1 Which Requirement to Drop?
  **Drop:** The Certainty Constraint (in its unconditional form).
  **Replace With:** A **Conditional Reflection Principle**. The principle applies only when the agent expects the transition from $t$ to $t'$ to be epistemically neutral or positive (i.e., no loss of evidence, no cognitive impairment).

  **The Cost:**
  Once you drop the unconditional Certainty Constraint, the principle loses its power to *settle* disputes in real-time.
  *   **Loss of Action-Guidance:** To use the principle, you must first judge whether your future self is reliable. But if you could judge that directly, you wouldn't need the principle to tell you what to believe; you would simply adopt the credence your current assessment warrants.
  *   **Loss of Scope:** It ceases to be a general constraint on diachronic coherence and becomes a specific rule for 'ideal updating'. It cannot handle the 'Uncertain Reliability' case (Section 1.2) without significant modification, because you are no longer certain the transition is neutral.

  ### 2.2 The Single Hardest Requirement
  The requirement that does the most work in ruling out candidate principles is: **"Must not require deference to a future self you've got reason to think is epistemically worse off."**

  This is the filter that kills the naive Van Fraassen-style Reflection. Any principle that mandates matching expected future credence *simpliciter* fails this test. To pass, the principle must include a 'filter' clause (e.g., "provided you expect no forgetting or impairment"). Adding this filter makes the principle significantly harder to apply, as it shifts the burden from calculating expectations to evaluating the epistemic quality of the future process.

  ---

  ## 3. Classification of Requirements

  ### Non-Negotiable (Foundational)
  *   **Probability Calculus:** Any principle generating incoherent credences is automatically rejected.
  *   **The Impairment Constraint:** A norm of rationality cannot mandate that you align with a self you know to be compromised. This is a basic intuition about epistemic responsibility.
  *   **Information vs. Reasoning Distinction:** A principle that cannot distinguish between learning new facts and losing cognitive capacity is functionally useless for guidance.

  ### Camp-Specific Commitments
  *   **Certainty vs. Expectation:** Insisting the principle holds only under *certainty* about future credence is a commitment of the strict coherence camp. The Bayesian expectation camp accepts probabilistic distributions over future credences.
  *   **Self vs. Other:** Treating the future self as uniquely authoritative (Reflection) rather than just another expert (Expertise Principle) is a commitment to a specific view of personal identity and diachronic unity.
  *   **Credence vs. Outright Belief:** Restricting the principle to degrees of belief is a commitment of the probabilistic camp. Dualists who hold both credences and beliefs will demand a counterpart for the latter.
  *   **Idealisation:** Accepting that the principle binds only idealised agents is a commitment of the formal epistemology camp. Pragmatists will demand it work for bounded agents.

  ---

  ## 4. The Verdict

  **Is this a norm of rationality at all?**

  **Verdict:** It is primarily a **norm of internal consistency for agents who have already bought into a particular picture of what credences are for.**

  It is not a freestanding norm of rationality like "do not contradict yourself" or "proportion belief to evidence." Rather, it is a derived constraint that holds *if* you assume:
  1.  You are a rational updater (Conditionaliser).
  2.  You expect your future self to be a rational updater.
  3.  You expect no loss of information.

  **What is lost if we accept this verdict?**
  If Reflection is merely an internal consistency norm for ideal updaters, it loses its **normative bite in non-ideal cases**.
  *   It cannot tell you what to do when you are unsure if you are rational.
  *   It cannot resolve the 'Uncertain Reliability' case (better evidence vs. worse reasoning) without importing external norms about how to weigh evidence against processing power.
  *   It ceases to be a tool for *discovering* the right credence and becomes a check for *coherence* among credences you have already formed.

  **Conclusion on the 'Uncertain Reliability' Case:**
  To handle your specific case of interest (better evidence vs. worse reasoning), you cannot use standard Reflection. You need a **Principle of Expert Weighting**.
  *   **Is it Reflection?** No. Reflection treats the future self as an authority. Weighting treats them as a fallible source.
  *   **Justification:** This requires a separate justification based on accuracy (e.g., minimising expected inaccuracy) rather than diachronic coherence (avoiding Dutch books).
  *   **Implication:** If you adopt this, you are admitting that Reflection *simpliciter* is insufficient for real-world adjudication. You are replacing a coherence norm with an accuracy norm.

  **Final Specification Note:**
  If you wish to use a Reflection principle to settle cases, you must explicitly restrict its domain. Write the spec thus: *"An agent ought to align their current credence with their expected future credence **if and only if** they currently judge that the transition involves no loss of evidence and no degradation of reasoning capacity."*

  Be aware that this restriction renders the principle redundant in many cases: if you can judge the transition is sound, you likely already know what credence the evidence supports, making the appeal to the future self otiose. The principle is most useful where you trust the future self *more* than your current reasoning, but as shown above, that trust cannot be blind.
