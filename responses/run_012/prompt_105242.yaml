answer: |-
  Your reading is half-right and half-wrong. You are correct that Williams ties reasons to the agent's subjective motivational set (SMS). You are wrong to conclude that this makes moral criticism impossible, denies the possibility of error, or reduces all normative argument to rhetoric. Your error lies in treating the SMS as a static snapshot of current urges rather than a starting point for deliberation.

  Here is exactly where your reading goes wrong and how to correct it for your seminar.

  **1. The Static vs. Deliberative Error**
  You write: "Nothing in her set is served by helping them, and on my reading the internalist must therefore say that she has no reason." This assumes the SMS is fixed at the moment of assessment. Williams explicitly rejects this. In "Internal and External Reasons," Williams argues that an agent has a reason if there is a **sound deliberative route** from their existing SMS to the action.

  The SMS includes not just raw desires, but also "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects." Crucially, it includes the capacity for rational deliberation. An agent can be *mistaken* about their reasons if they fail to see a deliberative route that exists. They can be ignorant of relevant facts, or they can be deliberating badly (irrationally).

  Therefore, the Ombudsman can have a reason to help patients even if she is currently unmoved, *provided* that correct deliberation from her existing commitments (coherence, autonomy) would lead her to help.

  **2. The Ombudsman's Specific Commitments**
  You stipulate that nothing in her set is served by helping. But you also stipulate she is "scrupulous about the coherence of her own evaluative outlook" and "resents being managed." These are powerful hooks for the internalist.

  *   **Coherence:** If her role as an administrator constitutively involves patient welfare (as defined by her profession, hospital charter, or own self-conception), then ignoring suffering may create a contradiction in her own evaluative outlook. If she values "being a good administrator" and "good administration" entails caring for patients, then helping them serves her commitment to coherence. If she fails to see this, she is deliberating poorly, not lacking a reason.
  *   **Resentment of Management:** If hospital policy or medical ethics dictates allocating based on need, ignoring this to allocate arbitrarily could be seen as submitting to chaos or violating the professional standards that grant her autonomy. Alternatively, if she sees herself as a fiduciary, neglecting the beneficiaries might undermine the very authority she prizes.

  The internalist does not have to say she has no reason. The internalist says: "You claim to value coherence and professional autonomy. Here is how those values commit you to alleviating suffering. You are failing to follow the implications of your own values."

  **3. Criticism and Mistake**
  You worry that internalism turns criticism into "persuasion dressed up as a truth-claim." This is false. On Williams's view, pointing out a sound deliberative route *is* making a truth-claim. It is claiming that *given who you are and what you care about, rationality requires X.*

  *   **Can she be mistaken?** Yes. Williams explicitly allows that agents can be wrong about their internal reasons due to ignorance or deliberative error. The Ombudsman can be objectively wrong about what her own commitments entail.
  *   **Is criticism impossible?** No. It shifts from "You are violating a universal moral law" (external) to "You are being irrational relative to your own commitments" (internal). This is often *more* biting criticism, not less. It charges the agent with inconsistency or irrationality, not just disobedience.

  **4. The Strongest Case for Your Reading (The Concession)**
  You should be candid with your students about where your intuition is strong. If the Ombudsman were a true psychopath—someone whose SMS lacks *any* element (including coherence, loyalty, or self-interest) that could deliberatively link to patient welfare—Williams *would* bite the bullet. He would say she has no reason to be moral.

  Williams was not trying to save morality at all costs; he was trying to save the truth of reasons statements. He preferred to admit that some people have no reason to be moral rather than invent mysterious "external reasons" that cannot explain action. This is the "Scrupulous Psychopath" objection. Your reading is correct *only* in this extreme, limiting case. But teaching this as the general rule misrepresents Williams. Most agents, even bad ones, have enough in their SMS (prudence, reputation, coherence) to ground reasons.

  **5. Teaching Advice**
  Do not present internalism as making moral criticism impossible. Present it as changing the *structure* of criticism.
  *   **Externalist Criticism:** "You ought to do X because it is Good."
  *   **Internalist Criticism:** "You ought to do X because you care about Y, and X is required by Y."

  Tell your class: Williams denies that we can criticize the Ombudsman from nowhere. But he empowers us to criticize her from within her own viewpoint. If she truly has no internal reason, Williams accepts that we cannot rationally criticize her (only coerce or persuade), but he argues this is a rare edge case, not the norm.

  Your framing rests on the assumption that if an agent isn't moved *now*, no reason exists. That is the error.

  \answer{Ignoring the sound deliberative route}
