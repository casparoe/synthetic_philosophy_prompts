          2.  Explanation: Epistemic vs. Modal proximity.
          3.  Why it looked innocent: Conflation of indistinguishability and similarity.
          4.  Impact on Safety/Margin-for-Error: Distinguish local vs. global error.
          5.  The Price: Externalism and the loss of Internalist assurance.

