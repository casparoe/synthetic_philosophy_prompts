  **1. Essay Question**

  **Final Examination: Metaethics and Normativity**
  **Time Allowed: 75 Minutes**

  **Question 1**
  The Euthyphro dilemma is frequently presented as a specific objection to Divine Command Theory. However, contemporary metaethics often treats it as a structural problem for any theory that attempts to ground normative properties in non-normative facts.

  (a) Formulate the Euthyphro dilemma as an abstract argument schema concerning grounding relations. Your formulation must not contain specific reference to God or divinity.
  (b) Instantiate this schema on a secular metaethical theory of your choosing (e.g., ideal observer theory, desire satisfaction, or naturalist realism). Demonstrate how both horns of the dilemma manifest within this secular framework.
  (c) Assess the "Divine Nature" reply to the theological dilemma (i.e., that goodness is grounded in God's essential nature rather than His commands). Treat this reply as an instance of a broader class of essentialist grounding strategies. Does this strategy succeed in terminating the regress of explanation, or does it merely relocate it? Argue whether a secular analog to this reply faces the same fate.

  ***

  **2. Model Answer**

  The Euthyphro dilemma is best understood not as a theological trap, but as a general constraint on grounding relations between normative properties (N) and base properties (F). The abstract schema runs as follows: Either (1) N obtains because F obtains, or (2) F obtains because N obtains. If (1), then N appears contingent upon F, raising the arbitrariness objection: could F obtain without N? If (2), then F does not ground N; rather, N explains F, rendering the proposed grounding circular or redundant. I am highly confident that this schema captures the logical structure of the problem independent of theological content.

  To instantiate this secularly, consider Ideal Observer Theory (IOT), which grounds goodness in the approval of a fully informed, impartial spectator. The dilemma arises: Is X good because the Ideal Observer (IO) approves of X, or does the IO approve of X because X is good? If the former, goodness is contingent on the IO's psychology. If the IO could approve of cruelty while remaining ideal, then cruelty could be good, which seems arbitrary. If the latter, the IO's approval is merely a sign of goodness, not its ground. The grounding work is done by the independent standard that guides the IO. I am moderately confident that IOT fails to escape the dilemma without modification, as the "ideal" conditions themselves presuppose normative constraints.

  The "Divine Nature" reply attempts to block the arbitrariness horn by claiming God's commands flow from His essential nature, which is necessarily good. God cannot command cruelty because He is essentially loving. This moves the grounding from will to essence. However, this invites a revised Euthyphro question: Is God's nature good because it is His nature, or is it His nature because it is good? If the former, goodness is defined by God's essence, risking tautology. If the latter, goodness is independent of God.

  This strategy belongs to a general class of essentialist replies, including secular appeals to "Rational Nature" or "Human Flourishing." A Kantian might argue actions are good because they accord with rational nature, and rational nature is necessarily good. The symmetry point is critical here: if the Divine Nature reply escapes the dilemma by positing a necessary connection between essence and value, the Rational Nature reply must escape it too. If one fails, both fail. I am highly confident in this symmetry claim; there is no relevant metaphysical difference between grounding value in divine essence versus rational essence regarding the structural regress.

  Does this terminate the regress? Proponents argue that essences provide a stopping point because they are necessary truths requiring no further explanation. Critics argue this merely relocates the regress to why *this* essence is valuable. Denying the regress requires accepting brute normative truths. I am least sure about whether any reply can genuinely terminate the regress rather than relocate it. It is possible that all grounding chains must end in ungrounded norms, making the "relocation" charge unfair. However, if termination requires non-arbitrary necessity, essentialist replies offer the best candidate, provided one accepts that necessities explain themselves. Ultimately, the dilemma forces a choice between brute norms or circularity, regardless of whether the ground is divine or secular.

  ***

  **3. Marking Scheme (25 Points)**

  | Criterion | Points | Specific Error That Costs Marks |
  | :--- | :---: | :--- |
  | **Abstract Schema** | 5 | Fails to remove theological terms or confuses grounding with temporal sequence. |
  | **Secular Instantiation** | 5 | Applies schema to a theory that does not posit a grounding relation (e.g., error theory). |
  | **Grounding vs. Causal** | 5 | Reads the "because" as causal/psychological rather than metaphysical/explanatory. |
  | **Modal Premise** | 5 | Ignores that the arbitrariness horn depends on the possibility of commanding otherwise. |
  | **Symmetry & Regress** | 5 | Treats Divine Nature as unique rather than structurally identical to secular essentialism. |

  **Total: 25 Points**
