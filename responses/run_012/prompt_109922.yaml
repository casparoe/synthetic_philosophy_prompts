      *   *The "Null Command" Problem:* In digital control, sending `0` is an active write operation. Not sending anything (timeout) might trigger a watchdog. So, is "doing nothing" physically possible in a running controller? No. Even "coasting" is a defined state.
      *   *Philosophical Core:* The asymmetry between commission and omission. Morally, killing is often seen as worse than letting die.
      *   *Engineering Reality:* Causality is continuous. The trajectory $x(t)$ is determined by $\dot{x} = Ax + Bu$. Whether $B=0$ or $u=0$, the math looks similar. But the *intent* and *architecture* differ.
      *   *Fail-Safe:* This is a crucial engineering analog to "allowing." If power fails, system goes to safe state. Is tripping a breaker "doing" or "allowing"?
