  Alice and Bob stand before a secure storage unit where Bob genuinely doubts whether the package is inside, suspecting the sensor might be stuck. Alice offers a proof: she points to the green status light on the unit (Premise 1) and cites the manufacturer's specification stating that a green light indicates the pressure circuit is closed by the package's weight (Premise 2), concluding the package is inside (Conclusion). Alice knows the light is green and the specifications are accurate more certainly than she knows the package is inside without opening the unit, satisfying Moore's conditions for her. Yet Bob is not moved to believe the package is inside, not because he denies the light is green or the specifications exist, but because the warrant for treating the green light as evidence of the package's presence presupposes the sensors are functioning correctly, which they only do if the package is actually present to trigger them; thus, conceding the premises grants him no new warrant for the conclusion because the evidential force of the premises depends on the truth of the conclusion, rendering the proof dialectically idle despite satisfying Moore's criteria.

  **Premises, Inference, and Conclusion**
  *   **Premise 1:** The status light is green.
  *   **Premise 2:** A green light indicates the pressure circuit is closed by the package's weight.
  *   **Inference:** Deductive (Modus Ponens, assuming the implicit premise that a circuit closed by weight entails the package is present).
  *   **Conclusion:** The package is inside.

  **Certainty Comparison**
  Alice's certainty exceeds the conclusion's certainty premise by premise. For Premise 1, she has direct perceptual access to the light, which is phenomenally immediate and less prone to error than inferring the presence of an unobserved object. For Premise 2, she possesses testimonial knowledge from the manual, which is a fixed document she can verify, whereas the Conclusion relies on the contingent functioning of the mechanical system in this specific instance. Thus, she satisfies Moore's requirement that the premises be more certain than the conclusion.

  **Warrant Transmission and Structural Feature**
  Warrant does not travel from the premises to the conclusion because the warrant for accepting Premise 1 *as evidence* for the Conclusion is not independent of the Conclusion. To treat the green light as proof of the package, Bob needs warrant that the sensor is not malfunctioning (e.g., stuck on green). However, the only reason to believe the sensor is functioning correctly in this instance is that the package is present to trigger it. Therefore, one must already have warrant for the Conclusion to accept the Premises as warrant-conferring for the Conclusion. The single structural feature doing the work is **Epistemic Dependence** (specifically, the dependence of the premise's evidential warrant on the truth of the conclusion).

  **Removing the Feature**
  If this feature is removed—that is, if Alice could provide independent warrant that the sensor is functioning (perhaps by showing a recent calibration log independent of the light)—the proof collapses back into an ordinary, dialectically effective proof. In that case, Bob could accept the light as evidence without presupposing the package's presence, and warrant would transmit successfully.

  **Moorean Resistance**
  A Moorean (specifically a Dogmatist or Liberal like Pryor) ought to resist the diagnosis by denying that prior warrant for the conclusion (or the negation of the malfunction hypothesis) is required for perceptual warrant. They would argue that Alice's perceptual experience of the light provides immediate prima facie warrant for believing the sensor is working and the package is present, meaning the proof *does* transmit warrant and Bob is simply being overly demanding by requiring independent assurance of the system's reliability.

  **Application to Moore's Hands**
  The same construction can be run against Moore's own two-hands proof. In Moore's case, the warrant for the premise "Here is a hand" is epistemically dependent on the conclusion "An external world exists" because having warrant for "Here is a hand" presupposes one is not dreaming or hallucinating (conditions entailed by the non-existence of an external world). Just as Bob cannot use the light to prove the package without assuming the sensor works, Moore cannot use his hand to prove the external world without assuming the external world exists to ground the veridicality of his perception.
