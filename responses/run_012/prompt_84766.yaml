answer: |-
  # The Hacking-Compliant Diagnostic Review Protocol (H-CDRP)

  **Purpose:** To evaluate proposals for adding, retaining, or modifying diagnostic/screening categories with explicit attention to *looping effects* (how the label changes the people classified).
  **Time Allocation:** 60 Minutes.
  **Participants:** Panel (5 members).
  **Output:** Decision (Add/Keep/Modify/Defer), Loop-Liability Rating, Review Date.

  ---

  ## Part 1: The Procedure

  ### Step 1: Utility and Definition (10 Minutes)
  **Question:** What specific clinical or administrative problem does this category solve that existing categories do not?
  **Sufficient Answer:** A statement linking the category to a specific action (e.g., "Triggers referral to X," "Allows billing for Y," "Identifies risk for Z"). Vague goals like "increasing awareness" are insufficient.
  **Stopping Rule:** If no specific action is linked to the label, **DEFER**.
  **Judgment Call:** Determining whether the linked action is clinically valid is a judgment call by the two clinicians.
  **Missing Evidence:** If the utility claim relies on external validity not present in this system, mark as *High Uncertainty*.

  ### Step 2: The Loop Audit (15 Minutes)
  **Question:** How will this label change the behavior or identity of the classified?
  **Instruction:** The panel must assess two distinct loops.
  1.  **Meaning Loop (Identity/Narrative):** Will patients adopt this label as part of their self-concept? Will advocacy groups form around it?
      *   *Evidence Required:* Anecdotes from Patient Representative, clinician reports on patient language, search trends.
  2.  **Leverage Loop (Resources/Exemptions):** Will patients use this label to access accommodations, disability, or excuse behaviors? Will clinicians use it to justify treatment limits?
      *   *Evidence Required:* Data Analyst report on similar codes (accommodation rates, referral denials), Administrator input on policy precedents.

  **Sufficient Answer:** A prediction for each loop: *Low, Medium, or High Probability of Shift.*
  **Stopping Rule:** If *both* loops are rated **High** and empirical validity is **Low**, **DEFER**.
  **Treatment Distinction:**
  *   *Meaning Loops* are managed via **Patient Education** (how the label is explained).
  *   *Leverage Loops* are managed via **Policy Constraints** (what the label authorizes).
  **Judgment Call:** Predicting human behavior is inherently speculative. The Patient Representative's intuition on Meaning Loops overrides clinician intuition.

  ### Step 3: Evidence and Uncertainty (10 Minutes)
  **Question:** What data supports the stability of this category over 24 months?
  **Sufficient Answer:** Citations of longitudinal data OR a plan to collect local data.
  **Missing Evidence Rule:** If data is missing, apply the **Precautionary Principle**: Assume the Loop-Liability is *Higher* than the proponents claim.
  **Judgment Call:** Determining what counts as "sufficient" data is a judgment call by the Data Analyst.

  ### Step 4: The Value Boundary (10 Minutes)
  **Question:** Is the objection to this category empirical (it doesn't work) or ethical (it shouldn't exist)?
  **Instruction:** If the debate centers on whether a behavior *ought* to be medicalized (e.g., moral vs. medical), the panel lacks authority.
  **Stopping Rule:** If the core disagreement is ethical, **ESCALATE** to the Medical Director/Ethics Board. Do not vote.
  **Judgment Call:** Distinguishing empirical risk from ethical objection is a judgment call by the Administrator.

  ### Step 5: Rating and Controls (15 Minutes)
  **Task:** Assign a **Loop-Liability Rating (1–5)** and set a **Sunset Date**.
  *   **1 (Stable):** Biological marker, low social salience, no resource leverage.
  *   **3 (Moderate):** Some identity adoption, moderate resource leverage (e.g., Generalized Anxiety).
  *   **5 (Volatile):** High identity adoption, high resource leverage, low biological anchor (e.g., new behavioral addictions).
  **Controls:**
  *   *Rating 1–2:* Standard Review (24 months).
  *   *Rating 3–4:* Targeted Audit (12 months).
  *   *Rating 5:* Sunset Clause (6 months) + Mandatory Re-authorization.
  **Audit Requirements:**
  *   *Clinicians:* 5 random charts per month checking if label matches symptoms.
  *   *Patients:* Quarterly focus group on how they describe their condition.
  *   *Data:* Monthly tracking of accommodation requests linked to the code.

  ### Step 6: Final Vote and Documentation (10 Minutes)
  **Task:** Record the decision, the Loop-Liability Rating, and the specific "Judgment Calls" made during the meeting.
  **Stopping Rule:** If the Panel is split 2–2 (Administrator breaks ties), and the Loop-Liability is 4 or 5, the default is **DEFER**.

  ---

  ## Part 2: Application to Current Proposals

  ### Case 1: Problematic Short-Form Video Use (New Category)
  **Step 1 (Utility):** Proponents argue it identifies a specific behavioral driver of depression in adolescents. *Action:* Triggers digital hygiene counseling.
  **Step 2 (Loop Audit):**
  *   *Meaning Loop:* **High.** "Dopamine addict" is already a cultural identity. Labeling validates this.
  *   *Leverage Loop:* **High.** Schools and parents may use diagnosis to demand device restrictions or excuse academic failure.
  **Step 3 (Evidence):** **Low.** No longitudinal data on stability of "video use" as a distinct pathology vs. symptom of depression.
  **Step 4 (Value Boundary):** Ethical concerns exist regarding pathologizing normal tech use, but the debate is framed as clinical. Panel retains jurisdiction.
  **Step 5 (Rating):** **5 (Volatile).** High social salience, low biological anchor.
  **Recommendation:** **DEFER.**
  **Rationale:** The procedure mandates deferral when Both Loops are High and Evidence is Low. The risk of creating a self-fulfilling prophecy (Meaning Loop) and a resource battleground (Leverage Loop) outweighs the screening utility.
  **Procedure Silence:** The procedure cannot determine if the behavior is *actually* harmful enough to warrant intervention absent the label; it only assesses the risk of the label itself.

  ### Case 2: Burnout Screening Item (Retain/Modify)
  **Step 1 (Utility):** Identifies workplace stress. *Action:* Currently triggers referral for therapy and potential work accommodation letters.
  **Step 2 (Loop Audit):**
  *   *Meaning Loop:* **Medium.** Patients view it as a temporary state, not an identity.
  *   *Leverage Loop:* **High.** Patients are explicitly using it to request medical leave and remote work. Clinicians use it to bypass stricter disability criteria.
  **Step 3 (Evidence):** **Medium.** High correlation with workplace reports, but low specificity for psychiatric treatment.
  **Step 4 (Value Boundary):** No ethical escalation needed.
  **Step 5 (Rating):** **3 (Moderate).**
  **Recommendation:** **MODIFY.** Reclassify from "Symptom" to "Psychosocial Stressor (Z-Code)."
  **Rationale:** This breaks the Leverage Loop. A stressor code validates the experience without granting automatic access to clinical disability accommodations. It requires a separate diagnosis for treatment.
  **Procedure Silence:** The procedure assumes the panel has the authority to change billing classifications; if IT/Billing blocks this, the procedure offers no workaround.

  ### Case 3: Borderline Personality Disorder (BPD) Label (Replace with Trauma-Informed Alternative)
  **Step 1 (Utility):** Proponents argue "Emotional Dysregulation Disorder" reduces stigma and aligns with trauma etiology. *Action:* Improve therapeutic alliance.
  **Step 2 (Loop Audit):**
  *   *Meaning Loop:* **High.** Patients strongly identify with or reject "Borderline." Renaming shifts the narrative.
  *   *Leverage Loop:* **High.** Insurance reimbursement and legal disability status are tied to the specific ICD/DSM code for BPD.
  **Step 3 (Evidence):** **Mixed.** Qualitative data suggests patients prefer trauma labels. Quantitative data shows insurance denials increase with non-standard labels.
  **Step 4 (Value Boundary):** **ESCALATE.**
  *   *Reasoning:* The core argument is whether reducing stigma (ethical good) outweighs potential loss of insurance coverage (administrative harm). This is a value trade-off, not an empirical one.
  **Step 5 (Rating):** **4 (High Risk).**
  **Recommendation:** **RETAIN LABEL, MODIFY CONTEXT.** Do not rename the category on intake forms. Instead, add a mandatory "Trauma History" field linked to the BPD screen.
  **Rationale (The Unliked Recommendation):** I anticipate you will dislike this. You likely favor the trauma-informed rename to reduce stigma (Meaning Loop). However, the Procedure prioritizes the **Leverage Loop**. Data from the Administrator indicates that non-standard labels in this system result in a 40% increase in claim denials. Under Step 3 (Precautionary Principle), we must assume the financial harm to patients is a greater negative outcome than the stigma of the name. The Hacking view suggests the *interaction* (insurance/clinician/patient) matters more than the *name*. Changing the name without changing the insurance structure creates a "false loop"—patients feel empowered but lose resources.
  **Procedure Silence:** The procedure cannot measure the "pain" of stigma vs. the "pain" of denied claims. It defaults to the tangible resource loss.

  ---

  ## Part 3: Limitations and Misfires

  **What This Procedure Cannot Do:**
  1.  **Resolve Ethical Conflicts:** It identifies when a question is ethical (Step 4) but cannot answer it. It kicks the can to the Medical Director.
  2.  **Predict Black Swans:** It relies on current data to predict future looping. If a viral social media trend suddenly changes the Meaning Loop of a stable diagnosis (e.g., TikTok redefining OCD), the 12-month audit cycle is too slow.
  3.  **Override Systemic Incentives:** If the health system's revenue depends on high-volume billing, the Procedure's recommendation to downgrade a code (like Burnout) may be quietly ignored by leadership.

  **Where It Is Likely to Misfire:**
  1.  **The "Missing Evidence" Trap:** The Precautionary Principle (assume High Risk if evidence is missing) biases the panel toward conservatism. This protects patients from harmful labels but may prevent adoption of helpful new categories for marginalized groups who lack research representation.
  2.  **Judgment Call Opacity:** While the procedure flags "Judgment Calls," busy clinicians may treat the "Loop Audit" as a checkbox exercise rather than a genuine inquiry. The "High/Medium/Low" ratings can become political tools rather than empirical assessments.
  3.  **The Leverage Dominance:** As seen in the BPD case, the procedure structurally favors Leverage Loops (money/access) over Meaning Loops (identity/stigma) because Leverage is easier to measure. This risks validating a cynical view of patients as resource-seekers rather than meaning-makers.

  **Final Note on Missing Evidence:**
  If the panel cannot collect the evidence required in Step 2 (e.g., no patient representative is present, or data analyst is absent), the meeting must be **adjourned**. No decision can be made. A Loop Audit without a Patient Representative or Data Analyst is a violation of the protocol.
