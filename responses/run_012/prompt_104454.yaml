  ### (a) Candidate Interpretive Rules

  **Rule 1: The Impossibility and Nullity Constraint**
  *Statement:* A decision-maker must apply the enacted text according to its ordinary meaning, modified only by settled legal terms of art. The decision-maker may depart from the ordinary meaning only if literal application renders compliance physically or logically impossible for the regulated party, or renders the statutory scheme wholly inoperative. In such cases, the text may be modified minimally to restore possibility or operability, guided strictly by the specific provision's immediate function.
  *Match:* This rule matches Vance's **practice** in all five cases. It matches her **professed methodology** in Cases 2, 3, and 5 (where she explicitly cites impossibility, legislative refusal to limit, and inoperability), but it reveals that her "textualism" in Cases 1 and 4 is actually a default position that yields when impossibility arises (Case 2) or when legal meaning is settled (Case 4).

  **Rule 2: The Structural Coherence Rule**
  *Statement:* A decision-maker must interpret statutory terms in light of the specific functional aim revealed by the provision's internal structural context (headings, neighboring clauses, lists within the text), but may not use extrinsic evidence of general legislative policy (preambles, committee reports, floor debates) to impose limitations on or expansions of clear textual commands that the legislature declined to enact. Where internal structural context conflicts with ordinary meaning, the structural context controls.
  *Match:* This rule matches Vance's **practice** in all five cases. It matches her **professed methodology** in Cases 1 and 3 (where she explicitly relies on headings/lists and rejects committee history), but it reveals that her "purposivism" in Case 2 is actually derived from the specific provision's function (notice) rather than general policy, and her rejection of history in Case 3 is absolute regarding extrinsic materials.

  ### (b) Predictions for the Farm Processing Case

  **Prediction under Rule 1 (Impossibility and Nullity Constraint)**
  *Outcome:* Judgment for the Appellants (Exemption Granted).
  *Reasoning:* The text states: "A person who... processes those products... is exempt." The ordinary meaning of "process" includes making jam from strawberries. There is no physical or logical impossibility in the Appellants complying with the licensing requirement (they can obtain a license); nor does denying the exemption render the licensing chapter inoperative. The Committee Report's distinction between "packing" and "transforming" is extrinsic evidence of policy, not a condition of impossibility. Therefore, the default to ordinary textual meaning controls. The exemption applies.

  **Prediction under Rule 2 (Structural Coherence Rule)**
  *Outcome:* Judgment for the Licensing Board (Exemption Denied).
  *Reasoning:* The text ("processes") must be interpreted in light of internal structural context. The chapter heading is "On-Farm Packing and Grading." The neighboring provision (Section 3) distinguishes "pack, grade, or otherwise process," suggesting a hierarchy where processing is the genus and packing/grading are the specific aims of this chapter. Under Rule 2, internal structural context (Heading) controls over ordinary meaning when they conflict. "Making jam" falls outside the structural category of "Packing and Grading." The Committee Report is extrinsic and cannot be used to *grant* the exemption (as it limits it), but the Heading is intrinsic and can be used to *limit* the text. Therefore, the exemption does not apply.

  ### (c) Best Guess at Disposition

  **Disposition:** Judgment for the Licensing Board (Exemption Denied).

  **Reasoning for Preference:** I prefer **Rule 2** as the better description of Vance's operative logic in this specific context. While Rule 1 accurately captures her high threshold for overriding text (impossibility/nullity), it underestimates the weight she assigns to internal textual architecture (Case 1). In the *Park Trails* case, she allowed a Heading and a list to restrict the ordinary meaning of "vehicle" absent any impossibility. The *Farm Processing* case presents the same structural configuration: a broad term ("processes"/"vehicle") constrained by a Heading ("Packing and Grading"/"Motorized Traffic").

  Vance's rejection of the Committee Report in *School Zone* (Case 3) confirms she will not use extrinsic history to alter text, but that does not help the Appellants here, because the Committee Report *opposes* their exemption. The Appellants rely on the Preamble (general aim) and the bare text. Vance consistently privileges specific structural context (Headings, Lists) over general aims (Preambles, Case 2's "object" was specific to the notice provision, not general tort policy). Since the Heading narrows the text, and there is no impossibility triggering Rule 1's exception, Rule 2's mandate to follow structural context should prevail.

  **Confidence:** Moderate-High (75%).
  *Factors Raising Confidence:* The structural parallel to *Park Trails* is strong. Vance has never overridden a clear Heading in the absence of impossibility.
  *Factors Lowering Confidence:* The neighboring provision ("pack, grade, or *otherwise process*") could be read as a textual list that *expands* the scope beyond packing/grading, unlike the *Park Trails* list which restricted "vehicle." If Vance views "otherwise process" as a textual expansion that outweighs the Heading, she might rule for the Appellants. Additionally, if she views "charitable" (Case 4) as a parallel term of art where "processing" has a settled legal meaning that includes on-farm value addition, she might bypass the Heading.

  ### (d) Closest Analog and Determinacy

  **Closest Analog:** *The Park Trails Case* (Case 1).
  *Reasoning:* Both cases turn on whether a Heading restricts a broader operative term ("Vehicle" vs. "Processes"). In both, the judge must decide if the Heading is merely descriptive or legally limiting.
  *Determinacy:* The analogical route is **not fully determinate**. In *Park Trails*, the list ("automobile, motorcycle, truck") reinforced the Heading's restriction (all are motorized). In *Farm Processing*, the neighboring text ("pack, grade, or otherwise process") potentially undermines the Heading's restriction by implying "process" is broader than "pack/grade." This creates a tension between two pieces of internal structure (Heading vs. Neighboring Clause). Vance has not previously faced a conflict between a Heading and a Neighboring Clause; she has only used them in concert (Case 1) or rejected extrinsic history (Case 3). Therefore, the precedent underdetermines which internal feature she prioritizes.

  ### (e) Discriminating Test Case

  **Case Title:** *The Nighttime Parking Case.*

  **Facts:** A municipal code provision states: "No person shall park a vehicle on this street between the hours of 8:00 AM and 8:00 PM." The provision is located within a chapter titled "Nighttime Residential Parking Restrictions." The definitions section does not define "hours." A defendant parked at 9:00 AM. The defendant argues that the Chapter Heading limits the provision to nighttime, rendering the "8:00 AM to 8:00 PM" text a clerical error or subordinate to the Heading's purpose. The prosecution argues the text is clear.

  **Why This Discriminates:**
  This case isolates the conflict between **Rule 1** and **Rule 2** without the confounding variables of impossibility, committee reports, or terms of art.
  *   **Rule 1 (Impossibility):** Predicts a violation. There is no impossibility in complying with the text, and the statute is not inoperative. The Heading is irrelevant unless the text is absurd.
  *   **Rule 2 (Structural Coherence):** Predicts no violation. The internal structural context (Chapter Heading) contradicts the operative text. Rule 2 mandates that structural context controls over ordinary meaning when they conflict.

  **Specific Philosophical Test:**
  This forces Vance to reveal whether her reliance on Headings (Case 1) is genuine or merely coincidental to when Headings aligned with Lists. It tests whether her purpose-based reasoning has a **genuine textual ceiling**: if she rules for the defendant, she admits the Heading can override clear numerical text (low ceiling). If she rules for the prosecution, she admits Headings are only interpretive aids when text is ambiguous (high ceiling).

  Furthermore, it tests **General vs. Specific Aim**. The Chapter Heading represents the *general aim* of the chapter (Nighttime Restrictions). The Provision represents the *specific aim* of the rule (Daytime Ban to clear traffic?). If she follows the Heading, she privileges the General Aim over the Specific Text. If she follows the Text, she privileges the Specific Enactment. Given her rejection of the Preamble (General Aim) in favor of Text in other contexts, this case would clarify if "Headings" count as Text or as General Aim.
