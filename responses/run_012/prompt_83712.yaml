prompt: |-
  I am applying for a one-semester research fellowship and need a proposal of roughly 1,500 words on a question in moral philosophy. I have a half-formed idea and would like you to turn it into a document containing a precise statement of the question, an account of why the existing positions leave it open, the method I would actually follow, an honest assessment of what would count as failure, and a scope that fits a single semester.

  The idea is this. The long-running dispute about whether an action has moral worth only if it is done for the right reasons has stalled, I suspect, because that condition is being asked to carry three different assessments at once — the rightness of the act, the agent's accountability and hence her praiseworthiness, and the quality of will the action expresses — and because it conflates two readings of the crucial relation. On the de dicto reading, the consideration that makes the act right must figure in the agent's deliberation under a normative description; on the de re reading, it is enough that the right-making feature non-accidentally produced the action, whether or not the agent took it as a reason at all. I want the proposal to argue that the familiar positions look like they conflict mainly because each answers for a different assessment or a different reading, and to make that diagnosis testable by constructing paired cases in which the three assessments and the two readings come apart.

  Please say why this case-based route is better than the obvious alternatives (conceptual analysis of the phrase by itself, or empirical work on motivation), what a finished result would look like, and what would show the diagnosis false or empty — in particular, what it would mean for the project if no case can separate the two readings. Assume a reader who is a philosopher but not a specialist in this debate, and do not include citations or a bibliography; I will add those myself.
