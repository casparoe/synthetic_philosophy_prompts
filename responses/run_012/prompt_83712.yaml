answer: |-
  **Project Title:** Disentangling Moral Worth: A Diagnostic Approach to the Right Reasons Requirement

  **Statement of the Question**

  The central question of this project is: Under what conditions does an agent's motivation confer moral worth on an action? For decades, moral philosophy has been gridlocked by the "Right Reasons" requirement. One camp insists that an action lacks moral worth unless the agent is motivated specifically by the thought that the action is right. The opposing camp argues that it suffices if the agent is motivated by the non-moral features that actually make the action right, regardless of whether the agent conceptualizes them as such.

  This proposal argues that this stalemate persists not because the problem is intractable, but because the condition "done for the right reasons" is being asked to carry three distinct normative assessments simultaneously: the objective rightness of the act, the agent's accountability and consequent praiseworthiness, and the quality of will the action expresses. Furthermore, the debate conflates two logical readings of the relation between motivation and rightness. On the *de dicto* reading, the consideration that makes the act right must figure in the agent's deliberation under a normative description (e.g., "because it is my duty"). On the *de re* reading, it is enough that the right-making feature non-accidentally produced the action, whether or not the agent took it as a reason under that description (e.g., "because it helps someone," where helping is what makes it right).

  My research question is therefore diagnostic: To what extent do the familiar conflicting positions in the literature arise from tracking different assessments or different readings of the motivation-rightness relation? I propose that the debate can be dissolved, or at least significantly advanced, by disentangling these variables.

  **Why Existing Positions Leave the Question Open**

  Current positions in the literature appear to contradict one another because they are often answering different questions while using the same terminology. A position that prioritizes the *quality of will* naturally gravitates toward the *de dicto* reading; if moral worth is about respecting the moral law, the agent must conceive of their action in terms of that law. Conversely, a position focused on *accountability* or *praiseworthiness* may find the *de re* reading sufficient; if the agent reliably tracks right-making features, they are praiseworthy regardless of their internal normative taxonomy.

  Because these assessments are typically bundled together in ordinary moral judgment, philosophers have struggled to isolate them. When a theorist claims that an action lacks moral worth because the agent lacked the right motive, they may be implicitly claiming that the agent's quality of will was deficient. When a theorist claims the action has worth because it aligned with the good, they may be implicitly assessing the agent's praiseworthiness based on reliable dispositions. Without separating these strands, the debate cycles endlessly between "motivation matters" and "outcomes matter," with neither side recognizing that they are prioritizing different normative dimensions. Consequently, the literature leaves open the possibility that there is no single condition for "moral worth," but rather a cluster of conditions that have been mistakenly unified.

  **Methodology: A Case-Based Diagnostic**

  To test this diagnosis, I will employ a method of constructed paired cases. Rather than engaging in abstract conceptual analysis or appealing to broad intuitions about hypothetical scenarios, I will construct minimal pairs designed to separate the three assessments (rightness, accountability, quality of will) and the two readings (*de dicto*, *de re*).

  The core of the method involves generating cases where the *de dicto* and *de re* conditions come apart. For example, I will construct a case where an agent acts on a *de re* right-making feature but explicitly rejects the *de dicto* normative description (e.g., a sympathetic agent who helps others but denies they have a duty to do so). I will then solicit and analyze judgments regarding the three assessments independently. Does this agent possess moral worth? Are they praiseworthy? Do they exhibit a good will?

  By varying the cases systematically, I aim to map which assessments track which readings. If the hypothesis is correct, we should see a divergence in intuitions: judgments about *quality of will* should track the *de dicto* reading, while judgments about *praiseworthiness* should track the *de re* reading. If the intuitions remain bundled despite the conceptual separation, this will indicate that the connection between these variables is tighter than the diagnosis suggests.

  **Why This Method is Superior to Alternatives**

  This case-based diagnostic approach is preferable to the two obvious alternatives: pure conceptual analysis and empirical psychological inquiry.

  Pure conceptual analysis of the phrase "moral worth" or "right reasons" tends to circle existing intuitions without resolving the underlying structural ambiguities. Analyzing the concept in isolation assumes the concept is unified, which is precisely what this project challenges. Without cases that force the variables apart, conceptual analysis merely reinforces the conflation I aim to expose. It lacks the leverage to show that the debate is a category error rather than a substantive disagreement.

  Empirical work on motivation, while valuable, addresses a different question. Psychological studies can tell us how people *do* attribute praise or how motivation functions cognitively, but they cannot determine how agents *should* be assessed normatively. The question of moral worth is not merely descriptive; it concerns the conditions under which an agent merits a specific normative status. Empirical data cannot bridge the gap between psychological causation and normative justification. My method remains philosophical because it tests the coherence of normative distinctions through thought experiments, preserving the normative force of the inquiry while gaining the precision of empirical separation.

  **What a Finished Result Would Look Like**

  A successful outcome for this semester-long project will not be a definitive new theory of moral worth, but rather a clarified framework that renders the existing debate tractable. The finished result will be a taxonomy of moral worth assessments. I aim to produce a paper demonstrating that "moral worth" is not a univocal property.

  Specifically, I will argue for a differentiated account: one condition for praiseworthiness (likely *de re* alignment) and a distinct condition for the expression of a good will (likely *de dicto* commitment). The result will show that the traditional dispute stalled because it sought a single necessary and sufficient condition for a multi-faceted phenomenon. By providing a vocabulary to distinguish these facets, the project will allow future work to proceed without talking past the same obstacles. The deliverable will be a draft article suitable for submission to a general philosophy journal, outlining the diagnostic argument and presenting the key paired cases.

  **Honest Assessment of Failure Conditions**

  It is crucial to define what would count as failure for this project, both to ensure intellectual honesty and to delineate the scope of the inquiry.

  First, the project would fail if the *de dicto* and *de re* readings prove inseparable in the moral domain. It is possible that, conceptually, one cannot be motivated by a right-making feature (*de re*) without implicitly conceiving of it as a reason (*de dicto*). If, upon constructing the cases, it becomes clear that the intuitions regarding the two readings do not diverge—that philosophers consistently judge *de re* motivation as implying *de dicto* conception or vice versa—then the diagnostic hypothesis is false. The stalemate would not be due to conflation, but to a genuine substantive disagreement about a unified concept.

  Second, the project would fail if the three assessments (rightness, accountability, quality of will) cannot be prised apart. If it turns out that in all coherent cases, a deficit in quality of will necessarily entails a deficit in praiseworthiness, then the proposed taxonomy is empty. This would suggest that the traditional bundling of these assessments is not a mistake but a reflection of the deep structure of moral agency.

  Finally, the project would fail if the case-based method generates no consensus. If the paired cases yield wildly divergent intuitions among competent judges without a pattern, the method lacks the diagnostic power to resolve the debate. In this scenario, the proposal would have identified the ambiguity but failed to provide the tool to resolve it. Acknowledging this possibility is vital; if the intuitions do not split, the conclusion must be that the "Right Reasons" requirement is robustly unified, and the search for a disambiguated solution must be abandoned.

  **Scope and Feasibility for a Single Semester**

  This project is explicitly scoped for a one-semester fellowship. I will not attempt to construct a full normative ethical theory or survey the entire history of the debate. The focus is strictly on the diagnostic argument and the construction of the critical cases.

  In the first month, I will refine the definitions of the three assessments and two readings to ensure they are operationally distinct. The second and third months will be dedicated to constructing and testing the paired cases, seeking feedback from colleagues to ensure the intuitions are stable. The final month will be devoted to drafting the paper, focusing on the argument that the diagnosis explains the historical stalemate.

  By limiting the goal to a diagnostic framework rather than a comprehensive solution, the project remains feasible within the timeframe. The aim is to clear the ground, not to build the entire house. If successful, this work will provide the necessary clarity for a more substantive theory to be developed in future research, making this semester a high-leverage investment in the broader discourse on moral motivation.
