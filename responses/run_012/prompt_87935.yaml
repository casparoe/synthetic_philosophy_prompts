  **Margin Comments & Breakdown**

  **Paragraph 1 (Peirce)**
  *   **Credit:** Accurate statement of the pragmatic maxim and the 'fated agreement' definition of truth. Good contextual knowledge regarding the renaming to 'pragmaticism'. **[+3 marks]**
