          *   Antiquarian impulse (archive everything) vs. Civic story (why history matters).
          *   Detached knowledge vs. Critical use of history (breaking the hold of the past).
      *   **Specific Requirements:**
          *   Reconstruct the implicit theory.
          *   Distinguish strict presuppositions from compatible fits.
          *   Mark underdetermined areas (where multiple theories license the same norms).
          *   Analyze what would change if the justification shifted to "knowledge is justified by what it does for life" (pragmatic/instrumental view).
          *   Keep settled vs. contested distinctions clear (don't present contested readings as consensus).
      *   **Tone:** Academic, rigorous, nuanced, suitable for a doctoral student.

  2.  **Initial Brainstorming & Mapping the Terrain:**

      *   *The "Package":* Objectivity, contextualism, archival rigor, peer review, anti-presentism, public engagement.
      *   *The Implicit Theory:* It looks like a hybrid of Rankean positivism (showing "how it actually was") and Weberian value-neutrality, layered with a Deweyan or civic humanist defense of utility.
      *   *The Core Tension:* Is history a *mirror* (reflecting the past as it was) or a *lamp* (illuminating the present)? The discipline claims to be a mirror to be a trustworthy lamp.
      *   *Nietzsche's "Use and Abuse of History":* This is the philosophical backbone for the "life" question. Monumental, Antiquarian, Critical. The modern discipline tries to be all three without admitting the tension.
      *   *Strict Presuppositions:* To claim "truth," you need some independence from the observer. To claim "relevance," you need some connection.
      *   *Underdetermination:* Does "accuracy" serve truth *or* utility? Both sides agree on the norm (check your sources) but disagree on *why*.
      *   *The Shift:* If we move to "justified by what it does for life," methodology changes. Selection bias becomes a feature, not a bug. Anachronism becomes a tool, not a sin.

  3.  **Drafting the Reconstruction (The Implicit Theory):**

      *   What is the current operating system? It's not pure antiquarianism. It's not pure presentism.
      *   It's a *deferred utility* model. We bracket present concerns *methodologically* to secure epistemic authority, which we then cash in *socially* for relevance.
      *   *Name:* "Epistemic Autonomy for Deferred Civic Utility."
      *   *Key mechanism:* The distinction between *context of discovery* (research) and *context of justification* (application), though history blurs this.
      *   *Relation to Life:* History is a distinct sphere of knowledge that *informs* life but is not *subordinate* to it. It's a check on life's immediate impulses.

  4.  **Distinguishing Presuppositions from Fits:**

      *   *Strict Presupposition:* To claim "this is what happened," you must presuppose the past has an integrity independent of our current needs. (Realism).
      *   *Compatible Fit:* The idea that this independent truth *automatically* leads to good civic outcomes. (This is a hope, not a logical necessity).
      *   *Underdetermined:* The norm of "archival completeness." Is it because the past is sacred (antiquarian) or because we don't know what will be useful later (pragmatic reserve)? Both license digitization.

  5.  **Analyzing the Shift (Pragmatic/Instrumental Justification):**

      *   Current: Truth first, utility follows.
      *   Proposed: Utility first, truth is a constraint within that.
      *   *Practical Changes:*
          *   *Question Selection:* Driven by urgent social problems, not gaps in literature.
          *   *Anachronism:* Permitted if it generates productive insight (conceptual history vs. moral judgment).
          *   *Narrative:* Explicitly normative rather than "objective."
          *   *Collaboration:* Historians work *with* activists/policymakers, not just *for* them post-facto.
      *   *Risk:* Propaganda, loss of trust, instrumentalization of evidence.

  6.  **Addressing the "Settled vs. Contested" Constraint:**

      *   *Settled:* Historians agree on source criticism, citation, archival rigor.
      *   *Contested:* *Why* we do it. (Realism vs. Constructivism). The philosophical justification of objectivity.
      *   *Caution:* Don't say "Historians believe X." Say "The practice functions *as if* X, though philosophers debate X."

