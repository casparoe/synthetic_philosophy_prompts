      *   **Task:** Reconstruct the implicit theory of meaning presupposed by this signage practice.
      *   **Specific Questions to Address:**
          *   Does treating pictograms as right/wrong require syntax/subject-predicate (propositional), or can a non-propositional (cue/response) account work?
          *   Does reliance on conventions/deontic content undercut Neurathian ambitions (observable physical things)?
          *   Which rival views of pictorial meaning does the practice rule out? (Ambiguity, compressed language, resemblance vs. convention).
          *   What features are strictly required vs. contingent? Where is it underdetermined?
          *   What would change if the presupposed view were replaced by a rival?
          *   **Constraint:** Keep under 800 words.
          *   **Constraint:** Close by naming the step in reasoning least confident about and what evidence would change the verdict.
          *   **Tone:** Precise, opinionated (not a survey).

  2.  **Deconstruct the Signage Practice:**
      *   **Hybrid Nature:** Icons (resemblance) + Symbols (convention) + Indexicals (arrows) + Deontic operators (prohibition bars).
      *   **Normativity:** Signs can be "wrong" (misleading, non-compliant). Style guides define meaning verbally *before* drawing.
