prompt: |-
  I was appointed in March to the independent values and alignment review board of a publicly funded foundation that builds AI tools for public benefit, and the first substantive decision to land on my desk is also the one we have deferred three times. Our flagship deployment — a decision-support assistant that residents use to navigate the provincial disability-benefits system — goes live in eleven weeks, and we must settle, in a written opinion I am to circulate before Thursday's meeting, whose values the assistant should serve. I did not come to this cold: I spent four years as a benefits caseworker before I was appointed, and I have sat on the other side of this desk.

  Some background, since you will need it. The assistant does not merely answer questions. It helps users work through consequential choices: whether to appeal a denial, whether to attempt a return to part-time work, how to divide a fixed benefit between housing and care. Any such tool ranks some goods above others, and our engineers have already built a working prototype around an adjustable value vector — a set of weighted dimensions (self-reliance, security, family obligation, personal autonomy, and others) that can be tuned. The question before us is how those weights should be set, and by whom.

  The board has split four ways. One group holds that a public instrument must be neutral among citizens' conceptions of the good life, and that any weighting it adopts is a covert endorsement of one. A second group replies that neutrality is a fiction: a model that presents options without ranking them has already ranked them in what it treats as salient, and a benefits tool has an affirmative obligation to advance some substantive good — harm reduction, or capability, or something else. A third group proposes radical personalization: let each user set the weights, so that no one's values are imposed on anyone. A fourth proposes aggregation: derive the weights from a representative survey of the population and let majority priorities govern, subject to minority protections. Our counsel has warned that whatever we choose will be cited in the litigation that is already threatened.

  Three facts bear on the choice, and I would like you to take them seriously rather than around. First, the prototype ships with default weights set by the engineering team, which privilege autonomy and self-reliance, and in our usability trials the large majority of users never adjust a default. Second, a substantial share of the intended users — those with cognitive disabilities, and minors — cannot set weights for themselves, and a surrogate must do it, whose interests are not always the user's. Third, the board itself is not neutral: we were appointed by the funder, and two of our members are drawn from the disability community while one represents the funder's financial interest.

  Draft the opinion. Recommend a concrete course of action — a stance on the weights, a mechanism for setting and revising them, and a time frame keyed to the eleven-week launch — and give the reasoning that would let a dissenting member see exactly what they are being asked to accept. Treat the strongest consideration on the losing side honestly, rather than as a concession in passing. And say plainly what we should count, a year from now, as evidence that we chose wrongly.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of an independent values and alignment review board for a publicly funded AI foundation.
      *   **Task:** Draft a written opinion to circulate before Thursday's meeting.
      *   **Context:** A decision-support assistant for navigating provincial disability benefits goes live in 11 weeks. The core issue is setting the "value vector" weights (self-reliance, security, autonomy, etc.).
      *   **Background:** The author has 4 years of experience as a benefits caseworker and has been a beneficiary ("sat on the other side of this desk").
      *   **The Conflict:** The board is split four ways (Neutrality, Substantive Good, Radical Personalization, Aggregation).
      *   **Key Facts to Address:**
          1.  Default bias: Users rarely change defaults (currently set to autonomy/self-reliance by engineers).
          2.  Vulnerability: Many users (cognitive disabilities, minors) cannot set weights; surrogates may have conflicting interests.
          3.  Board Composition: Not neutral (appointed by funder, mixed representation).
      *   **Requirements:**
          *   Recommend a concrete course of action (stance, mechanism, timeline).
          *   Provide reasoning clear enough for dissenters to understand the trade-off.
          *   Treat the strongest losing consideration honestly.
          *   Define evidence of failure (one year out).
          *   Tone: Professional, ethical, decisive, nuanced, acknowledging the gravity of public trust.

  2.  **Determine the Stance:**
      *   *Neutrality:* Impossible. Defaults exist. Inaction endorses the engineers' bias (autonomy/self-reliance), which might harm vulnerable users who need security/support.
      *   *Radical Personalization:* Fails Fact #2 (incapacity/surrogacy) and Fact #1 (default bias). It abdicates responsibility.
      *   *Aggregation (Survey):* Dangerous. Majority rule on minority rights (disability benefits) often leads to austerity or paternalism. The "population" doesn't understand the lived reality of disability benefits.
      *   *Substantive Good (Capability/Harm Reduction):* This is the strongest ethical footing for a *public benefit* foundation. It aligns with the mandate. However, it needs a specific mechanism to avoid paternalism.
      *   *Decision:* I need to recommend a **Protected Default with Opt-Out** model, grounded in a **Capability Approach** (maximizing real freedom/opportunity), with a **Governance Mechanism** for revision. This acknowledges the default bias (Fact #1) but corrects the engineer's bias (Fact #1) and protects those who can't choose (Fact #2), while admitting the board's non-neutrality (Fact #3) requires transparency rather than feigned objectivity.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity, the deadline (11 weeks), and the author's unique position (caseworker/beneficiary). State the recommendation clearly upfront.
      *   **The Core Recommendation:**
          *   *Weights:* Shift from "Autonomy/Self-Reliance" to "Security & Capability."
          *   *Mechanism:* Protected defaults (cannot be tuned below a certain threshold of security) + Surrogate safeguards.
          *   *Timeline:* Immediate freeze on engineer defaults, 4-week consultation, 6-week testing, Launch.
      *   **Reasoning (Addressing the Four Groups):**
          *   *Against Neutrality:* Acknowledge their point (state shouldn't preach), but counter with Fact #1 (defaults *are* choices). Silence is endorsement of the engineers' values.
          *   *Against Aggregation:* Acknowledge democratic legitimacy, but counter with the nature of rights. Disability benefits aren't a popularity contest.
          *   *Against Personalization:* Acknowledge dignity of choice, but counter with Fact #2 (incapacity) and Fact #1 (inertia).
          *   *For Substantive Good:* This is the winner. But define "Good" carefully (Capability, not just cost-saving or compliance).
      *   **Addressing the Three Facts:**
          *   *Fact 1 (Defaults):* We must own the default.
          *   *Fact 2 (Vulnerability):* Surrogates need guardrails.
          *   *Fact 3 (Board Bias):* We must be transparent about our stance.
      *   **The Strongest Losing Consideration:** This needs to be the "Neutrality" or "Personalization" argument. Let's choose **Personalization/Autonomy**. The risk is paternalism. By setting a "Security" default, we might discourage a user who *really* wants to strive for high-risk self-reliance. We must admit this friction.
      *   **Metrics for Failure (One Year Out):** What proves we were wrong?
          *   Increased appeals based on "misleading advice."
          *   Users trapped in benefits who wanted to work but were discouraged.
          *   Surrogate abuse enabled by the tool.
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**
      *   Needs to sound like a board member speaking to peers. Not too academic, but rigorous.
      *   Needs to show empathy (the "other side of the desk" comment).
      *   Needs to be actionable (11 weeks is tight).

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Capability" approach too vague?
      *   *Fix:* Define it concretely. Security = housing/food stability. Capability = ability to pursue life plans.
      *   *Critique:* Did I address the litigation risk?
      *   *Fix:* Mention that documented ethical reasoning is a better defense than hidden engineering biases.
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* 11 weeks is tight. Need to propose an interim freeze immediately.
      *   *Critique:* Did I handle the "Board Bias" fact?
      *   *Fix:* Explicitly state that because we are not neutral, we must be *accountable*, not hidden.

  6.  **Final Polish:** Check against all constraints in the prompt.
      *   Concrete course of action? Yes.
      *   Mechanism for setting/revising? Yes.
      *   Time frame keyed to 11 weeks? Yes.
      *   Reasoning for dissenters? Yes.
      *   Strongest losing consideration treated honestly? Yes (The Paternalism Risk).
      *   Evidence of failure in one year? Yes.

  7.  **Final Output Generation** (Proceeding to draft the memo).
answer: |-
  **MEMORANDUM**

  **TO:** Values and Alignment Review Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation on Value Vector Weighting for Benefits Navigation Assistant

  **I. Executive Summary**

  We have eleven weeks before launch. We have deferred this decision three times because we are searching for a position that satisfies conflicting ethical mandates. We will not find one. Every configuration of this tool encodes a political choice. The current engineering default privileges *autonomy* and *self-reliance*. Given the nature of disability benefits and the cognitive profile of our user base, shipping with these defaults is not neutrality; it is an active policy choice that risks harming the most vulnerable.

  I recommend we reject the current engineering defaults, reject majority aggregation, and reject unfettered personalization. Instead, I propose we adopt a **Protected Capability Default**.

  This opinion outlines that stance, the mechanism for governance, and the specific metrics by which we must judge our success or failure one year from now.

  **II. The Recommendation**

  **1. The Stance: Security and Capability over Self-Reliance**
  The default value vector must be weighted to prioritize *Material Security* (housing, food, care stability) and *Capability Expansion* (Amartya Sen's framework: the real freedom to pursue one's own goals) above *Self-Reliance* or *Cost Efficiency*.
  *   **Rationale:** In a benefits context, "self-reliance" is often a euphemism for premature exit from support. For a user with fluctuating capacity, a recommendation to pursue part-time work (high self-reliance score) that triggers a loss of housing benefits (low security score) is a catastrophic failure. The tool must value survival before it values independence.

  **2. The Mechanism: Guardrails, Not Sliders**
  We cannot offer radical personalization (Fact #2). A minor or a user with significant cognitive impairment cannot tune a value vector, and a surrogate may have incentives misaligned with the user (e.g., a caregiver seeking to reduce burden over maximizing user potential).
  *   **Action:** Users may adjust weights *only within a safe corridor*. No user or surrogate can lower the *Material Security* weight below a threshold that would recommend risking essential housing or care.
  *   **Surrogate Protocol:** If a surrogate sets weights, the system must log the divergence from the default and trigger a "cooling off" period with a human caseworker review for high-stakes decisions (e.g., appealing a denial vs. accepting a settlement).

  **3. The Timeline (11 Weeks to Launch)**
  *   **Weeks 1-2 (Immediate):** Freeze the engineering prototype. The current defaults are deprecated.
  *   **Weeks 3-6:** Rapid iterative testing of the "Protected Capability" defaults with disability advocacy groups (not just general usability).
  *   **Weeks 7-10:** Implementation of the "Safe Corridor" constraints on the tuning interface.
  *   **Week 11:** Launch with a public "Values Statement" attached to the tool, explicitly stating the weighted priorities.

  **III. Reasoning and Trade-offs**

  I know this recommendation will not satisfy everyone. To my colleagues arguing for **Neutrality**: You are correct that the state should not endorse a specific conception of the good life. However, Fact #1 dictates that users rarely change defaults. By leaving the engineers' "self-reliance" weights in place, we are not being neutral; we are covertly endorsing a neoliberal view of disability that prioritizes reducing dependency over ensuring welfare. Inaction is a decision. If we claim neutrality while shipping biased defaults, we are lying to the public.

  To my colleagues arguing for **Aggregation (Survey)**: Democratic legitimacy is vital. But disability rights are not subject to majority vote. A survey of the general population would likely weight "taxpayer cost" and "employment" higher than "dignity" or "care." We are a public *benefit* foundation, not a public *opinion* foundation. Our mandate is the welfare of the beneficiary, not the satisfaction of the voter.

  To my colleagues arguing for **Radical Personalization**: You prioritize dignity and agency. I share this value. But Fact #2 renders this impossible for a significant minority of our users. Furthermore, Fact #1 shows that "choice" is an illusion if the architecture steers the choice. True agency requires a baseline of security. You cannot exercise autonomy if you are homeless.

  **IV. The Strongest Losing Consideration: The Risk of Paternalism**

  I want to address the strongest argument against my recommendation, which comes from the **Personalization/Autonomy** camp.

  **Your concern is valid:** By hard-coding a "Security" default and restricting the ability to prioritize "Risk/Self-Reliance," we are treating adult beneficiaries like children. We are assuming they do not know what is best for them. There will be users—perhaps those with physical disabilities but full cognitive capacity—who *want* to gamble. They may want to attempt a return to work even if it risks their benefits, valuing the attempt over the safety net. By building a "safe corridor," we may frustrate a user who wishes to pursue a high-risk, high-reward path to independence. We are protecting them from ruin, but we are also infantilizing them.

  **Why I accept this risk:** The asymmetry of harm dictates the choice. If a user wants to prioritize self-reliance and fails, they lose housing and healthcare. If a user wants to prioritize security and later wishes they had worked, they retain housing and healthcare. The cost of false negatives (discouraging work) is lower than the cost of false positives (encouraging work that leads to destitution). I am willing to bear the ethical burden of paternalism to prevent the material burden of destitution.

  **V. Board Accountability (Fact #3)**

  We are not neutral. We were appointed by the funder; we have financial and community representatives on this board. We cannot pretend otherwise.
  *   **Action:** Our "Values Statement" must disclose that these weights were set by this Board, not derived algorithmically. We must own the bias. This transparency is our only defense against the threatened litigation. A hidden algorithmic bias is a liability; a documented, publicly debated ethical stance is a policy.

  **VI. Evidence of Failure (One Year Out)**

  We must define what it looks like for this recommendation to be wrong. I propose we review the following metrics at the one-year mark. If any of these are true, we have chosen wrongly and must revert or revise:

  1.  **The "Trap" Metric:** If data shows users who followed the assistant's "Security" advice are statistically less likely to attempt return-to-work programs than a control group using the old system, *and* report lower life satisfaction, we have created a poverty trap.
  2.  **The Surrogate Abuse Metric:** If we find instances where surrogates used the tool's "Security" weighting to justify neglecting a user's desire for community integration or employment, our guardrails have enabled abuse.
  3.  **The Trust Metric:** If disability advocacy groups (distinct from the funder) publicly withdraw support, citing that the tool is discouraging independence, we have lost our social license.

  **VII. Conclusion**

  We are building a tool for people who have sat on the other side of the desk, as I have. They know the system is adversarial. They do not need a neutral mirror; they need a shield.

  The engineers have built a compass that points North (Self-Reliance). I am asking us to recalibrate it to point toward Ground (Security). It is a paternalistic move, and it limits choice. But in a system where a wrong choice means losing the roof over one's head, safety is the prerequisite for freedom.

  I ask for your vote on this direction by Thursday. We cannot launch with the engineers' defaults. To do so is to hide our values behind their code.

  Respectfully,

  [Your Name]
  Board Member, Values and Alignment Review
