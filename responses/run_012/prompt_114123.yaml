answer: |-
  This is one of the cleanest formulations of the species problem I've seen. You have correctly identified that the Neanderthal case isn't just a puzzle *within* the Biological Species Concept (BSC); it is a stress test that exposes the concept's structural limits.

  Here is the case analysis, running the BSC against the facts, stress-testing your Barrier/Gradient distinction, and looking at what breaks in the 1% scenario.

  ### Part 1: The BSC Autopsy

  Let's take the textbook definition literally: *Species are groups of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups.*

  **1. Does actual interbreeding settle the question?**
  On the strict terms of the BSC: **Yes.**
  If two populations interbreed and produce fertile offspring (which we know they did, because the DNA persisted and was passed down), they are, by definition, the same species. The BSC does not specify a *quota* of interbreeding. It does not say "interbreed frequently." It says "interbreed." The existence of viable hybrids implies the absence of reproductive isolation. Therefore, under a strict reading, *Homo neanderthalensis* should be synonymized into *Homo sapiens*.

  **2. Why didn't the labels change?**
  Because the BSC contains a hidden assumption: **Equilibrium.**
  The BSC was designed by Ernst Mayr to describe extant populations living in sympatry (the same place) at the same time, where the *maintenance* of distinctness is the puzzle. It assumes that if two groups are distinct, there *must* be a barrier preventing them from merging.
  The Neanderthal case is not equilibrium; it is **process**. We are looking at two lineages that had been diverging for hundreds of thousands of years, came back into contact, exchanged genes, and then one lineage was absorbed or went extinct.
  Taxonomists didn't change the labels because the *morphological* and *genetic* distinctness remained high despite the leakage. The "interbreeding" was real, but it was insufficient to homogenize the populations. The BSC has no metric for "insufficient to homogenize." It only has "isolated" or "not isolated."

  **3. Is the "could interbreed" clause a hedge?**
  In this specific case, **no.**
  Often, the "potentially interbreeding" clause is used to lump allopatric populations (geographically separated) that *would* interbreed if they met. That is a hedge against lack of data.
  But Neanderthals and Modern Humans *did* meet. The "potential" was actualized. So the hedge cannot save the BSC here. The only way to save the two-species view under BSC is to argue that the hybrids had reduced fitness (which some evidence suggests regarding male sterility or immune issues). If the gene flow was restricted because hybrids were less fit, you can argue for "incomplete reproductive isolation." But that requires modifying the BSC from a binary (isolated/not) to a scalar (degree of isolation).

  **4. Verdict on the Concept:**
  The Neanderthal episode **embarrasses** the BSC regarding fossils and **reveals** that it was never built to handle deep time.
  The BSC is a *synchronic* concept (a snapshot). Speciation is a *diachronic* process (a movie). Applying the BSC to Neanderthals is like asking a single frame of a movie whether the character is "walking" or "running." If the foot is on the ground, is it walking? If the lineages exchanged genes, are they one species? The question ignores the trajectory. The concept treats species as static entities, but the Neanderthal case shows them as transient phases of a branching process.

  ### Part 2: Stress-Testing Barrier vs. Gradient

  Your distinction is sharp. Let's run it.

  **1. Barrier vs. Gradient**
  You hypothesize that Neanderthals are a gradient case dressed in barrier clothing.
  *   **Barrier:** Implies a causal mechanism (genetic incompatibility, behavioral rejection) that creates a binary state.
  *   **Gradient:** Implies a reduction in gene flow due to distance, ecology, or preference, where distinctness is a function of how much mixing occurs versus how much selection pushes them apart.

  The Neanderthal case is definitively a **gradient**. There was no hard wall. There was a semi-permeable membrane. Gene flow occurred, but selection (or drift, or demography) maintained distinct morphological clusters for a long time.

  **2. Can the BSC be stated in gradient terms?**
  **No.** Not without ceasing to be the BSC.
  The BSC relies on the *existence* of isolation. If you introduce a gradient, you must introduce a **cutoff**. "If gene flow is below $X$, they are separate species."
  Where does $X$ come from? Nature does not provide it. It is a pragmatic threshold chosen by the taxonomist. If you set $X$ at 0% gene flow, almost no vertebrates are distinct species (hybridization is rampant). If you set it at 50%, Neanderthals are us.
  Therefore, stating the BSC in gradient terms smuggles in an arbitrary legislative act. It transforms the concept from a description of a natural fact (isolation exists) to a convention (we *treat* them as isolated if mixing is rare enough).

  **3. Discovery vs. Decision**
  *   **Barrier View:** Calling them a species is a **Discovery**. The wall is out there; we found it.
  *   **Gradient View:** Calling them a species is a **Decision**. The variation is continuous; we drew a line.

  **Is this dichotomy too crude?**
  Yes, but not for the reason you might think. It's not crude because there's a middle ground; it's crude because "Discovery" implies the category "Species" exists independently of the classifier, while "Decision" implies it's purely subjective.
  A better framing is **Constrained Decision.**
  Nature provides the clusters (the morphological and genetic distance). That is the discovery. We decide whether that distance warrants a specific label.
  In the Neanderthal case, the "Decision" is driven by utility. If we call them *H. sapiens*, we lose the ability to easily discuss the specific adaptive suite (cold adaptation, robusticity) that characterizes the Neanderthal cluster. We keep the name *neanderthalensis* not because they are reproductively isolated, but because they represent a distinct **evolutionary trajectory** for a significant period.

  **4. What role is the concept playing?**
  In this case, the species concept is acting as a **sorting rule for labels**, not an ontological claim.
  It is not claiming "Neanderthals are fundamentally different kinds of beings." It is claiming "For the purpose of paleoanthropological discourse, treating these fossils as a distinct operational unit yields better predictive power and clearer communication than lumping them."
  The concept is a tool for carving nature at joints that are somewhat fuzzy, acknowledging that the knife (the definition) is ours, even if the resistance in the meat (the biology) is real.

  ### Part 3: The 1% Thought Experiment & The Break Point

  Imagine a lineage interbreeding with us at 1% per generation.

  **1. Does the concept have anything non-arbitrary to say?**
  **No.**
  At 1% gene flow, the populations are genetically connected but potentially evolving independently.
  *   If the 1% introduces alleles that are selected against, the lineages remain distinct (selection > gene flow).
  *   If the 1% introduces neutral alleles, the lineages will slowly merge (gene flow > drift).
  The BSC cannot distinguish these outcomes without looking at *selection*, which is outside its scope. The BSC only counts the mating, not the fate of the offspring's genes in the next generation.
  So, at this point, the concept stops describing nature and starts **legislating vocabulary**. We must *decide* if 1% is enough to count as "one species." Any answer we give is a convention, not a law of physics.

  **2. What is missing from the frame?**
  You asked to identify what neither Barrier nor Gradient captures. Three things break the frame here:

  *   **A. Time (The Diachronic Element):**
      The Barrier/Gradient distinction is spatial or statistical. It ignores duration. Two populations might exchange 1% genes for 1,000 years (a blip) or 1,000,000 years (a stable hybrid zone). The "Species" label often tracks the *independence of evolutionary fate over time*. If the 1% exchange doesn't stop them from adapting to different niches, they are distinct lineages, regardless of the leak. The **General Lineage Concept** handles this better than BSC: species are separately evolving metapopulation lineages. The Neanderthals were a separate lineage that happened to leak.

  *   **B. Asymmetry:**
      The BSC assumes symmetry (A breeds with B same as B breeds with A). In the Neanderthal case, the introgression was likely asymmetric (Modern males x Neanderthal females, or vice versa, with different fitness outcomes). A "Barrier" implies a wall between two equal rooms. A "Gradient" implies a slope. But this was more like a **sink**. One lineage absorbed the other. The species concept struggles to label a relationship where one group is actively dissolving into the other while maintaining identity for a time.

  *   **C. The Classifier's Position:**
      This is the philosophical kicker. We are not neutral observers. We are *one of the lineages*.
      If we were observing two species of frogs hybridizing at 1%, we might comfortably call them distinct species because their fate doesn't impact our self-conception.
      With Neanderthals, the "Species" question is loaded. Calling them *H. sapiens* implies they are "us" (moral implications, continuity of mind). Calling them *H. neanderthalensis* implies "other" (extinction, replacement).
      The friction in the Neanderthal case isn't just biological; it's **narrative**. We want a clean story (We replaced Them). The biology gives us a messy story (We absorbed Them). The species concept is being asked to resolve a narrative tension that biology cannot solve.

  ### Summary Conclusion

  The Neanderthal case does not confirm the Biological Species Concept; it reveals that the BSC is a special case applicable only when reproductive isolation is near-total and populations are contemporaneous.

  Your **Gradient** hunch is correct. The "Barrier" is an idealization that rarely exists in nature. When we treat Neanderthals as a separate species, we are making a **Decision** (to prioritize morphological distinctness and separate evolutionary trajectories) constrained by a **Discovery** (that gene flow was low enough to maintain that distinctness for a long time).

  In the 1% scenario, the concept definitely shifts from description to legislation. It tells us that "Species" is not a natural kind like "Gold" or "Water." It is a **homeostatic property cluster**. It's a label we apply when a group of properties (morphology, genetics, ecology, lineage) hangs together tightly enough to be useful. Neanderthals hang together tightly enough to keep the name, even if the reproductive wall had a door in it.

  The breakdown you sense is real: The concept tries to be a **sorting rule** (pragmatic) while pretending to be an **ontological claim** (realism). The Neanderthal episode forces us to admit it's the former. We keep the two names not because nature demands it, but because erasing the distinction erases a significant chapter of evolutionary history.
