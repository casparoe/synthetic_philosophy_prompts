answer: |-
  Here is the specification sheet for the norms of assertion. I have organized your ten cases into eight core desiderata. For each, I identify the motivating case, the theoretical requirement it generates, and its status (Settled vs. Contested). At the end, I isolate the incompatibilities—the "results" you asked for.

  ### The Desiderata Specification

  #### 1. The Falsehood Constraint
  *   **Motivating Case:** *Retraction.* (You assert $P$, it turns out false, you say "I shouldn't have said that.")
  *   **The Requirement:** A theory must explain why asserting a falsehood is inherently defective, regardless of the speaker's evidence. If $P$ is false, the assertion is improper.
  *   **Status:** **Settled (Pre-theoretic).** Almost all camps agree that truth is a *necessary* condition for a fully proper assertion. Even "Justification" norms usually treat truth as a constitutive goal.
  *   **Camp Bias:** None. This is the baseline.

  #### 2. The Epistemic Strength Constraint
  *   **Motivating Case:** *The Lucky Guess.* (You guess $P$ without evidence; $P$ is true.)
  *   **The Requirement:** A theory must explain why the lucky guesser is criticized ("You had no right to say that") despite being right. Truth alone is insufficient for propriety.
  *   **Status:** **Contested.** This is the primary wedge between the **Knowledge Norm** (Williamson) and the **Truth/Belief Norms**. The Knowledge camp treats this as non-negotiable data; the Truth camp treats this intuition as a confusion between *propriety* and *prudence*.
  *   **Camp Bias:** Heavy bias toward the Knowledge Norm. Truth-norm advocates often try to explain this away via pragmatics.

  #### 3. The Sincerity/Belief Constraint
  *   **Motivating Case:** *Moore's Paradox.* ("It is raining, but I don't believe it is.")
  *   **The Requirement:** A theory must explain why this sentence is unassertable despite possibly being true. The norm must link assertion to the speaker's doxastic state (belief).
  *   **Status:** **Mostly Settled.** Everyone agrees assertion implies belief. The contest is over *why*. (Is it a constitutive rule? A pragmatic implication? A lie?)
  *   **Camp Bias:** Neutral, though **Belief Norm** advocates take this as the primary driver, while **Knowledge Norm** advocates derive it from the fact that you can't know what you don't believe.

  #### 4. The Accountability/Challenge Constraint
  *   **Motivating Case:** *The Inarticulate Expert.* (You know $P$ via intuition/skill but cannot articulate reasons.)
  *   **The Requirement:** A theory must determine if assertion commits the speaker to providing reasons on demand. If the norm is "Knowledge," the expert is fine (externalist). If the norm is "Justified Assertibility," the expert might fail (internalist).
  *   **Status:** **Contested.** This pits **Externalists** (Knowledge/Truth) against **Internalists** (Justification/Reasons).
  *   **Camp Bias:** **Justification Norm** crowd treats this as non-negotiable (assertion = offering reasons). **Knowledge Norm** crowd treats the expert as satisfying the norm, attributing the awkwardness to conversational pragmatics.

  #### 5. The Stakes Sensitivity Constraint
  *   **Motivating Case:** *High-Stakes vs. Low-Stakes.* (Same evidence, but asserting "The bank is open" is fine on Tuesday, improper on Friday when a check must clear.)
  *   **The Requirement:** A theory must account for why practical context changes propriety without changing the evidence.
  *   **Status:** **Contested.** **Contextualists** say the norm itself shifts. **Invariantists** (like Williamson) say the norm (Knowledge) stays fixed, but the *cost of violating it* changes the prudence of asserting.
  *   **Camp Bias:** **Contextualists** treat this as data for the norm itself. **Knowledge Norm Invariantists** treat this as a requirement for the *theory of action*, not the norm of assertion.

  #### 6. The Communicative Function Constraint
  *   **Motivating Case:** *The Skeptical Hearer* & *The Diary.*
  *   **The Requirement:** A theory must decide if assertion is essentially interpersonal.
      *   *Skeptical Hearer:* If they won't believe you, is the assertion wasted/defective? (Tests if the norm is *uptake-dependent*).
      *   *Diary:* If no one hears it, is it an assertion? (Tests if the norm requires an *audience*).
  *   **Status:** **Contested.** **Teleological views** (assertion aims at belief-transfer) struggle with the Diary. **Constitutive rule views** (assertion is a move in a language game) can handle the Diary but struggle to explain why the Skeptical Hearer makes the act feel futile.
  *   **Camp Bias:** **Belief/Truth Norms** often lean teleological (aiming at hearer belief). **Knowledge Norms** lean constitutive (making a move regardless of uptake).

  #### 7. The Agency Constraint
  *   **Motivating Case:** *The Chatbot/Autocomplete.*
  *   **The Requirement:** A theory must specify who bears the normative burden. If a bot asserts $P$, is the norm violated if $P$ is false? (The bot has no beliefs).
  *   **Status:** **Settled (with caveats).** Consensus is that assertion requires a *mind* capable of belief/knowledge. If the bot asserts, the *developer* or *user* is the one bound by the norm, not the bot.
  *   **Camp Bias:** Neutral. This is a boundary condition on the definition of "asserter."

  #### 8. The Normative Conflict Constraint
  *   **Motivating Case:** *Comforting Child* & *Incentivized Assertion.*
  *   **The Requirement:** A theory must distinguish the *epistemic* norm of assertion from *moral* or *practical* norms. You can be epistemically proper but morally wrong (harsh truth), or morally right but epistemically wrong (comforting lie).
  *   **Status:** **Settled.** A theory of the *norm of assertion* is not a theory of *all-things-considered* propriety. It must isolate the specifically *assertoric* defect.
  *   **Camp Bias:** None, provided the theory claims to be about the *epistemic* norm. If a theory claims to be the *only* norm, it fails here.

  ---

  ### The Incompatibility Matrix (The Result)

  You asked for pairs that cannot be jointly satisfied. If you hold these two desiderata as non-negotiable, your theory will break.

  **1. The "Lucky Guess" Intuition vs. The Truth Norm**
  *   **Conflict:** If you hold that the Lucky Guesser did something wrong (Desideratum 2), you cannot hold that the sole norm of assertion is Truth (Desideratum 1 interpreted minimally).
  *   **Result:** You must either adopt the **Knowledge Norm** (or Justification Norm) OR you must argue that the intuition about the Lucky Guess is mistaken (it's just imprudent, not improper).
  *   **Verdict:** **Jointly Unsatisfiable.** You must drop one.

  **2. The Inarticulate Expert vs. The Challenge Rule**
  *   **Conflict:** If you hold that assertion requires the ability to defend your claim with reasons (Desideratum 4), the Inarticulate Expert violates the norm. If you hold the Expert is perfectly warranted because they *know* (Desideratum 2), the Challenge Rule is false.
  *   **Result:** This forces a choice between **Internalism** (Justification Norm) and **Externalism** (Knowledge/Truth Norm).
  *   **Verdict:** **Jointly Unsatisfiable.** You cannot require both "Knowledge is sufficient" and "Reasons must be articulable."

  **3. Stakes Sensitivity vs. Knowledge Norm Invariantism**
  *   **Conflict:** If you hold that the norm is Knowledge (fixed standard) and that the standard *itself* does not change with stakes (Invariantism), you struggle to explain why the assertion feels improper in High-Stakes cases without appealing to prudence rather than normativity.
  *   **Result:** If you want the *norm* to shift with stakes (Contextualism), you must abandon the idea that "Knowledge" is the fixed norm (since Knowledge is usually taken to be stakes-invariant in this context).
  *   **Verdict:** **Tension.** Not strictly logically impossible, but theoretically costly. You have to explain away the intuition that the *rule* changed, insisting only the *risk* changed.

  **4. The Diary Case vs. The Teleological View**
  *   **Conflict:** If assertion is essentially defined by its goal of generating belief in a hearer (Teleological), a Diary entry is not an assertion (no hearer). If a Diary entry *is* an assertion (which it intuitively feels like), the Teleological definition fails.
  *   **Result:** You must either deny Diary entries are assertions or deny that assertion is essentially for belief-transfer.
  *   **Verdict:** **Jointly Unsatisfiable** for strict Teleological views.

  ---

  ### Settled vs. Contested: A Summary

  **Settled (Broad Consensus):**
  *   Assertion is a rule-governed activity (not random noise).
  *   Falsehood is a defect (The Falsehood Constraint).
  *   Assertion implies belief (The Sincerity Constraint).
  *   The epistemic norm is distinct from moral/practical norms (The Normative Conflict Constraint).
  *   Asserters must be agents capable of mental states (The Agency Constraint).

  **Contested (Camp Commitments):**
  *   **Is Knowledge necessary?** (Knowledge Norm vs. Truth/Belief Norm). *Motivated by Lucky Guess.*
  *   **Is Justification internal?** (Must you be able to give reasons?). *Motivated by Inarticulate Expert.*
  *   **Does the norm shift with context?** (Contextualism vs. Invariantism). *Motivated by High/Low Stakes.*
  *   **Is the norm constitutive or teleological?** (Rule of the game vs. Goal of the act). *Motivated by Diary/Skeptical Hearer.*

  ---

  ### Brief Scorecard (How the major views fare)

  *   **The Knowledge Norm (Williamson):**
      *   *Passes:* Lucky Guess, Moore, Retraction.
      *   *Struggles:* Inarticulate Expert (says they are fine, intuition wavers), High Stakes (must explain away norm shift as prudence).
  *   **The Truth Norm:**
      *   *Passes:* Falsehood Constraint, Diary (easier to satisfy).
      *   *Fails:* Lucky Guess (cannot explain the criticism), Moore (needs extra help to explain the belief link).
  *   **The Belief Norm:**
      *   *Passes:* Moore, Sincerity.
      *   *Fails:* Lucky Guess (if you believe your guess, you're fine), Falsehood (if you believe a lie, you're fine).
  *   **The Justification Norm:**
      *   *Passes:* Lucky Guess, High Stakes (justification lowers with risk).
      *   *Fails:* Inarticulate Expert (if justification requires articulation), Truth (allows justified false assertion, which some find defective).

  **Final Note:** The "Result" you wanted is this: **You cannot satisfy the Lucky Guess intuition, the Inarticulate Expert intuition, and the High-Stakes intuition simultaneously with a single, invariant, internalist norm.** You must sacrifice one intuition to save the theory. That is the landscape.
