      *   *Vulnerability 2 (Philosophers):* Is the analogy tight enough? Ideas are perceived by minds; money is exchanged between bodies. Does Berkeley actually say money *is* immaterial, or just that it *functions* like a ticket? Is there textual evidence linking *Principles* to *The Querist* explicitly?
      *   *Vulnerability 3 (Both):* The "Paper Money" context. The South Sea Bubble, Law's System. Was Berkeley just reacting to current events rather than propounding a metaphysical system?
      *   *Vulnerability 4 (The "Killer"):* Normative vs. Descriptive. Berkeley wants to *help* Ireland. Does the metaphysical grounding actually do any work, or is it just a pretty analogy?

  3.  **Drafting the Objections (Iterative Process):**

