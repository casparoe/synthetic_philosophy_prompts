answer: |-
  # Session Design: The Branching Policy Game

  ## 1. Materials and Room Setup

  **Room:** One classroom with a central table or desks arranged in a U-shape. You need a "Bank" table (for your assistant) and a "Vault" table (for sealed envelopes).

  **Materials:**
  *   **Tokens:** 200 poker chips or laminated cards (two colors: 150 "Standard", 50 "Bonus").
  *   **Envelopes:** 20 small opaque envelopes (for Policy Sheets).
  *   **Policy Sheets:** 20 small slips of paper + pens.
  *   **Coin:** One large, visible coin (or a digital coin flip projected on screen).
  *   **Die:** One 10-sided die (d10).
  *   **Math Fact Card:** A sealed envelope containing a printed slip: *"The 100th digit of Pi is 9 (Odd)."* (Verify this beforehand; it is indeed 9).
  *   **Snacks:** Three tiers.
      *   Tier 1 (5 tokens): Generic crackers/fruit.
      *   Tier 2 (15 tokens): Cookies/chocolate.
      *   Tier 3 (30 tokens): "Premium" (gift card or high-end snack box).
  *   **Public Ledger:** Whiteboard to track token counts (optional but recommended for transparency).

  **Roles:**
  *   **Facilitator (You):** Runs the rounds, explains rules, leads debrief.
  *   **Banker (Your Friend):** Holds the token pool, distributes snacks, collects envelopes. *Crucial:* The Banker is the only one allowed to touch the token pool. This prevents students from printing their own money.
  *   **Players:** The 12–16 club members.

  **Anti-Cheating Mechanics:**
  *   **Sealed Policies:** All prediction sheets are sealed in envelopes at the start. The Banker holds them. If a student tampers with an envelope, they are disqualified from that round (a rule agreed upon publicly at the start).
  *   **Public Verification:** The Math Fact Card is sealed and opened only after decisions are locked.
  *   **Token Scarcity:** Tokens are physically counted. No "IOUs."

  ---

  ## 2. Round-by-Round Rules & Payoffs

  **Initial Endowment:** Every player starts with **10 Tokens**.

  ### Round 1: The Standard Mugging (30 mins)
  *   **Setup:** At Minute 0, every student fills out a **Policy Sheet**: *"If asked to pay 5 tokens, I WILL / I WILL NOT."* They seal this in an envelope and give it to the Banker. This envelope is **The Predictor**.
  *   **The Flip:** You flip the coin publicly.
  *   **Branch A (Heads):** The Banker opens the student's envelope.
      *   If Sheet says "WILL": Student receives **25 Bonus Tokens**.
      *   If Sheet says "WILL NOT": Student receives **0 Tokens**.
      *   *Note:* The student does nothing in this branch; the payoff is automatic based on the sealed sheet.
  *   **Branch B (Tails):** The Banker does *not* open the envelope.
      *   You announce: "The coin is Tails. The Predictor predicted you would pay. Will you actually pay 5 tokens now?"
      *   Student chooses: **Pay 5** or **Refuse**.
      *   *Payoff:* Regardless of choice, they get **0 Bonus Tokens**. The cost is the only factor.
  *   **Reveal:** After all choices are made, open the envelopes to show what was predicted.

  ### Round 2: The Blind Control (15 mins)
  *   **Setup:** No Policy Sheets. No envelopes.
  *   **The Flip:** Flip the coin.
  *   **Branch A (Heads):** Student receives **25 Bonus Tokens** unconditionally.
  *   **Branch B (Tails):** You announce: "The coin is Tails. Will you pay 5 tokens?"
  *   **Payoff:** If they pay, they lose 5. If they refuse, they lose 0. No reward is possible in this round.
  *   **Purpose:** To establish that without the prediction link, paying is irrational.

  ### Round 3: The Noisy Predictor (15 mins)
  *   **Setup:** Use the original Policy Sheets from Round 1 (or new ones if you prefer, but old ones save time).
  *   **The Mechanism:** Announce: "The Predictor is only 70% reliable."
  *   **The Flip:** Flip the coin.
  *   **Branch A (Heads):** Roll the d10.
      *   1–3: Mechanism Fails. Student gets **0 Tokens** (regardless of sheet).
      *   4–10: Mechanism Works. Check Sheet. "WILL" = **25 Tokens**. "WILL NOT" = **0 Tokens**.
  *   **Branch B (Tails):** Student is asked to pay 5 tokens. (Same as Round 1).
  *   **Purpose:** Forces calculation. Does the 70% chance justify the cost in the Tails branch?

  ### Round 4: The Symmetric Fact (20 mins)
  *   **Setup:** New **Strategy Sheet**. Students write two instructions:
      1.  *"If the Digit is EVEN, I choose: [CLAIM / PASS]"*
      2.  *"If the Digit is ODD, I choose: [PAY / REFUSE]"*
      *   Seal and give to Banker.
  *   **The Fact:** You hold the sealed **Math Fact Card** (100th digit of Pi).
  *   **The Reveal:** Open the Card. (It is Odd).
  *   **The Payoff Rule:**
      *   Since the Fact is **Odd**, the student is in the "Pay/Refuse" branch.
      *   However, they receive the **25 Bonus Tokens** *if and only if* their **EVEN** instruction was "CLAIM" (or specifically, if their policy favored the *other* branch's cooperation).
      *   *Correction for Symmetry:* To match your request precisely:
      *   **Rule:** You receive the **25 Bonus Tokens** *if and only if* your instruction for the **branch that did not happen** (Even) was "PAY".
      *   **Current Reality (Odd):** You are asked to **Pay 5 Tokens**.
      *   **Tension:** You are in the Odd branch. You must pay 5 to participate. But you only get the 25 reward if your *Even* plan was to Pay.
      *   *Simpler Version for High School:*
      *   **Rule:** You get **25 Tokens** if your Sheet says "PAY" for the **Opposite** parity.
      *   You are **not** asked to pay in this round. You simply get the reward based on the counterfactual plan.
      *   *Wait, to match the prompt ("condition attached to the large payoff refers to what the participant would have done in the branch... that did not occur"):*
      *   **Final Rule:** Open Fact (Odd). You get **25 Tokens** *if* your Sheet says "PAY" for **Even**. You do *not* have to pay anything now. The cost was hypothetical.
      *   *Wait, prompt says:* "A participant who settles on one policy in advance comes out ahead whichever way the coin falls."
      *   **Revised Symmetric Rule:**
          *   Sheet: "If Even, I Pay. If Odd, I Pay." (Cooperate Policy) vs "Refuse/Refuse".
          *   Reveal Fact (Odd).
          *   Payoff: You get 25 Tokens *if* your Sheet said "Pay" for **Even**.
          *   Cost: You must Pay 5 Tokens *because* the Fact is **Odd**.
          *   *Net:* If you planned to Pay on Even, you get 25 - 5 = 20. If you planned Refuse on Even, you get 0 - 5 = -5 (or just 0).
          *   *Actually, let's keep it clean:*
          *   **Rule:** You get **25 Tokens** if your *Counterfactual* instruction was "PAY". You are asked to **Pay 5 Tokens** because the *Actual* fact is "ODD".
          *   This forces them to value the counterfactual plan to justify the actual cost.

  ---

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  *   **00–10:** **Intro & Endowment.** Distribute 10 tokens each. Explain snack tiers. Explain the "Sealed Envelope" rule (tampering = disqualification).
  *   **10–20:** **Round 1 Setup.** Students fill out Policy Sheets (Will/Will Not Pay). Seal and submit.
  *   **20–35:** **Round 1 Play.** Flip coin. Process Heads (check envelopes, distribute tokens). Process Tails (ask for payment, collect tokens). *Debrief briefly on feelings.*
  *   **35–50:** **Round 2 (Blind).** No envelopes. Flip coin. Tails players asked to pay. *Highlight: Everyone refuses. Why?*
  *   **50–65:** **Round 3 (Noisy).** Announce 70% accuracy. Roll die for Heads players. Tails players asked to pay. *Ask: Did the risk change your mind?*
  *   **65–80:** **Round 4 (Symmetric Fact).** Fill out Even/Odd Strategy Sheets. Reveal Pi Digit. Calculate payoffs based on the *other* branch's instruction.
  *   **80–90:** **Final Debrief & Snacks.** Redeem tokens. Discuss the philosophy.

  ---

  ## 4. The Debrief (Scripted Guide)

  Do not lecture. Ask questions. Write key terms on the board only *after* they say them.

  **1. The Coin Probability vs. Decision Logic**
  *   *Ask:* "In Round 1, Tails players: Did anyone pay because they thought the coin *might* have been Heads?"
  *   *Point:* If they say yes, correct them. The coin is already flipped. The probability is 0 or 1. Paying doesn't change the past.
  *   *Philosophical Map:* This addresses **Evidential Decision Theory**. Paying isn't about changing the past; it's about being the *kind of agent* who gets rewarded in the other branch.

  **2. Act vs. Policy**
  *   *Ask:* "In Round 4 (Math Fact), you got paid based on what you wrote for the branch that *didn't* happen. Why did that feel unfair? Or did it feel right?"
  *   *Point:* In Round 2 (Blind), refusing was rational *act-by-act*. In Round 4, winning required a rational *policy*.
  *   *Philosophical Map:* **Updateless Decision Theory**. You maximize value by choosing a policy *before* you know which branch you are in.

  **3. Intention vs. Prediction**
  *   *Ask:* "In Round 1, the 'Predictor' was just your own piece of paper. If you lied on the paper, would you have won?"
  *   *Point:* If they lied (wrote "Will" but meant "Won't"), they would have won on Heads but lost on Tails (because they wouldn't pay).
  *   *Philosophical Map:* A prediction is only good if it tracks your *actual* disposition. A written promise is cheap; a psychological disposition is expensive.

  **4. The Ex-Ante Standpoint**
  *   *Ask:* "Before we started (Minute 0), did you want to be a Payer or a Refuser?"
  *   *Point:* Almost everyone wants to be a Payer *before* the coin flip (to get the Heads reward). But everyone wants to be a Refuser *after* the Tails flip.
  *   *Philosophical Map:* The **Ex-Ante Standpoint**. Rationality might require binding your future self to do what your past self wanted.

  **Addressing the "Just a Game" Objection**
  *   *Ask:* "If these tokens were \$1,000 and the reward was \$10,000, would the logic change?"
  *   *Response:* "The *math* doesn't change. The *pain* does. The problem isn't that the stakes are fake; it's that our brains are wired to care more about the loss in our hand than the gain in the branch we can't see. The game works because you felt that tension. If you felt nothing, the stakes were too low. If you felt angry, the stakes were high enough."

  ---

  ## 5. Predictable Failure Modes & Fixes

  1.  **The "Liar" Strategy:** A student writes "WILL" on the sheet to secure the Heads reward, planning to refuse on Tails.
      *   *Fix:* This is actually a *feature*. In the debrief, highlight this. "If you lied, you exploited the mechanism. But if everyone lies, the mechanism breaks. The philosophical problem assumes the Predictor knows you *better* than you know yourself."
  2.  **Boredom/Slowness:** Processing 16 students one-by-one takes too long.
      *   *Fix:* Split the room. Group A flips Heads, Group B flips Tails (simulate this by telling half the room "You are Heads" and half "You are Tails" for the sake of the exercise, or run two parallel lines with your Assistant). *Better:* Do the Heads payouts in bulk. "All Heads, bring your envelopes to the Bank." "All Tails, line up to pay."
  3.  **Token Inflation:** Students trade tokens privately.
      *   *Fix:* Announce: "Only tokens held by you at the end count. No side bets."
  4.  **Cynicism:** "This is stupid, I'm not paying."
      *   *Fix:* Don't argue. Let them refuse. In the debrief, ask the refusers: "You kept your 5 tokens. Did you beat the people who paid?" (In Round 1, the Payers on Heads will have 35, Refusers on Tails have 10. The Refusers lost the big game).

  ---

  ## 6. Limitations Paragraph (For Your Eyes)

  *Read this only at the very end if asked, or use it to frame your closing thoughts.*

  "This activity cannot reproduce the **ontological weight** of the counterfactual. In this game, the 'Heads' branch where you got the reward is gone; it doesn't exist anymore. In the philosophical problem (specifically in Logical Decision Theory), the other branch has a kind of logical reality—your decision *now* is logically linked to the prediction *then* because both stem from the same source code (your mind). Here, the 'Predictor' was just a piece of paper you wrote on five minutes ago. A real Omega predicts you based on *who you are*, not just what you wrote. We had to use paper because we don't have mind-reading machines. So, if you felt like you could 'trick' the paper, you're right. You can't trick a perfect predictor. The tension you felt was a shadow of the real problem, not the problem itself."

  ---

  ## 7. The 40-Minute Condensed Version

  *If the room is empty or time is cut.*

  *   **00–05:** Intro & Tokens (10 each).
  *   **05–15:** **Round 1 (Standard Mugging).** Policy Sheets sealed. Coin Flip. Payoffs. (Skip the individual line-up; do bulk payout).
  *   **15–25:** **Round 2 (Symmetric Fact).** Strategy Sheets (Even/Odd). Reveal Pi Digit. Payoffs based on counterfactual instruction.
  *   **25–40:** **Debrief.** Focus heavily on **Act vs. Policy** and **Ex-Ante Standpoint**. Skip the "Noisy Predictor" and "Blind Control" rounds; mention them verbally during debrief ("Imagine if there was no envelope...").
  *   **Snacks:** Distribute immediately after debrief to end on a high note.

  ---

  ## 8. Final Note on the "Name"

  Do not write "Counterfactual Mugging" on the board. Do not say "Newcomb's Problem." Do not say "UDT."
  When you finish the debrief, write the name on the board.
  *"This problem is called Counterfactual Mugging. It was named by a philosopher named Eliezer Yudkowsky. If you want to read more, look up 'Logical Decision Theory'."*
  Then let them eat.
