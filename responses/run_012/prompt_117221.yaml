answer: |-
  The worry from last week sticks. If the moral worth of an act depends on the causal ripples spreading out to infinity, and those ripples are chaotically sensitive to initial conditions, then we are morally blind. We might be doing immense harm while feeling virtuous, or vice versa. If consequentialism demands we maximize the good, but the good is epistemically inaccessible in principle, not just in practice, then the theory demands the impossible. It collapses into a slogan.

  That is too quick. It treats the problem as if we need to know the absolute value of the outcome. We do not. We only need to know the difference in value between the options available to us. When you choose to hold the door or let it shut, the causal chains diverge, yes. But the vast majority of the future—the background noise of history—is shared by both branches. The unknowable, distant consequences are largely common to both options. What remains is the local, tractable difference. The person you help feels relief now; the person you ignore feels frustration. That difference is knowable. The rest cancels out.

  Cancels out only if you assume the distribution of unknown effects is symmetric around zero. Why should we assume that? Causal chains are not like measurement errors in a physics lab. They are more like power laws. Most ripples fade, but some amplify. One person you help might go on to found a movement that saves millions, or starts a war that kills them. If the tail of the distribution is fat enough, the expected value is dominated by those remote, low-probability, high-impact possibilities. You cannot ignore them just because they are distant. If you take expected value seriously, the ranking of your options is determined by the stuff you cannot see, not the stuff you can.

  So you are saying that because we cannot see the tail, we cannot act? That leads to paralysis. We have to work with the evidence we have. If the remote effects are truly unknowable, they enter our calculation as noise with an expected value of zero relative to our current state of information. We are not omniscient; we are agents making decisions under uncertainty. The rational move is to maximize expected value relative to our epistemic state, not relative to the God's-eye view of the actual outcome.

  But that shifts the goalposts. If consequentialism is about making the world better, then the right act is the one that actually produces the best consequences. If you redefine it as "the act that looks best given my limited information," you have moved away from the core claim. And even on your terms, the model sensitivity is the killer. If I change my background assumptions about how society evolves, the sign of the difference flips. I hold the door. In Model A, this leads to a chance meeting that prevents a crime. In Model B, it delays the person by ten seconds, causing them to miss a bus, leading to a job loss and a spiral of poverty. If my confidence in Model A versus Model B is weak, my confidence in the sign of the difference is weak. I am not just uncertain about the magnitude; I am clueless about the direction.

  Let's ground this. Suppose I am walking down the street and a stranger asks for directions. I can stop and help, or I can keep walking. You are saying I cannot know if helping is right?

  I am saying that if the morality of the act depends on the infinite future, you cannot know. The local good of reducing their confusion is trivial compared to the potential downstream effects. If that stranger is a potential tyrant, helping him is a catastrophe. If he is a potential savior, ignoring him is one. Since you cannot distinguish these possibilities, the expected value of stopping is undefined or dominated by these remote possibilities.

  That is absurd. I help them. The probability that my ten seconds of direction-giving tips the scale between tyranny and salvation is vanishingly small. The probability that I alleviate genuine distress is near certain. You are letting the remote tail wag the dog. The local difference is robust across models. Almost any plausible model of human psychology says being helped is better than being ignored in the moment. That is a stable signal in the noise.

  Stable, perhaps, but negligible. If there is even a tiny probability that the stranger is pivotal in a way that affects billions, that tiny probability multiplied by billions outweighs the certain relief of one person. This is the logic of long-termism. If you accept it there, you must accept it here. The cluelessness problem shows that our common-sense intuition that the local good matters more is just a heuristic for ignoring the variables we can't track. But if those variables determine the value, the heuristic is misleading.

  Fine, take it to the big case. A donor has money. Option A is funding deworming programs in a poor country. Option B is funding research into reducing the suffering of wild animals in nature. Deworming has tractable, measurable effects: fewer children sick, more school attendance. Wild animal suffering is vast in scale—trillions of lives—but highly speculative. We do not know how to intervene without causing ecological collapse. On your view, cluelessness should make us prefer the speculative option if the scale is big enough, or make us unable to choose at all.

  Exactly. If the wild animal suffering is real and vast, it dominates the calculus. But we are clueless about the side effects of intervention. We might fix a parasite problem and cause a population boom that leads to greater starvation later. The causal chain is opaque. Deworming feels safer, but that is just because the horizon is shorter. If we are truly consequentialist, the horizon is infinite. The uncertainty about the ecological intervention is deep, but the uncertainty about the long-term societal effects of deworming is also deep. Does deworming lead to overpopulation? Does it stabilize a region? We do not know. So why prefer the tractable?

  Because the tractable difference is a lower bound. I can guarantee a certain amount of good with deworming. With the wild animal research, I might make things worse. When facing deep uncertainty, we should look for robustness. If the worst-case scenario of Option A is better than the worst-case of Option B, or if the expected value of A is positive and stable while B is volatile, we choose A. This is not ignoring the future; it is acknowledging that our leverage on the future decays with time and complexity. We have more control over the near term.

  Leverage decays, but value does not. A life saved is a life saved, regardless of when it happens. If you retreat to "robustness" or "control," you are no longer maximizing the good. You are maximizing your confidence, or your sense of agency. That is a different theory. It sounds like you are drifting toward satisficing, or evaluating the act by the quality of the decision procedure rather than the outcome.

  I am drifting toward a sane decision theory. If a theory tells me I cannot act because the outcome space is too large, the theory is broken. I am suggesting that the unit of evaluation should be the difference we can reliably trace. If the downstream effects of A and B are both unknowable, they are effectively equal in our calculation. We subtract them out. We are left with the near-term difference.

  But they are not effectively equal. That is the heart of the disagreement. You assume the unknowable parts of A and B are correlated or symmetric. I assume they are independent and skewed. If they are independent, the variance of the difference grows. If they are skewed, the expectation is dominated by the tail. You cannot just subtract them out. This is why I think we need to move the unit of evaluation up. We cannot evaluate individual acts like "holding the door" or "writing this check" in isolation. We must evaluate dispositions, rules, or institutions.

  How does that help? The disposition to hold the door also has infinite ripples.

  Not in the same way. A disposition is a pattern. We can evaluate the pattern by its typical output, not its singular instances. We can say "a society where people help strangers" is better than "a society where they do not," without needing to know the specific causal chain of every door held. We stabilize the evaluation by averaging over the noise. Cluelessness applies to tokens, but types are more stable. We can know that a rule against killing is good, even if we cannot know if a specific murder might have prevented a war. We save consequentialism by making it about the structural properties of our agency, not the metaphysical footprint of our actions.

  That is rule-consequentialism. It abandons the core insight that consequences are what matter. It matters whether the act actually produces the good. If the rule generally works but fails in this specific case because of some hidden ripple, the rule-view tells me I acted rightly, but the world is worse. You are prioritizing the cleanliness of the agent over the state of the world.

  I am prioritizing the possibility of guidance. If the act-view makes rightness unknowable in principle, it cannot guide action. It becomes a criterion of rightness for a judge at the end of time, not for an agent in the moment. If you want consequentialism to be a practical ethics, you must accept that we evaluate what we can see.

  Or, you accept that guidance is hard. That is my bullet. It is hard to know what is right. That does not mean we change the definition of right. It means we need better models. We need to refine our understanding of the causal chains. In the charity case, we investigate the ecological models. In the street case, we rely on the overwhelming probability that the local good is not outweighed by a skewed tail. We do not change the theory because the math is difficult.

  But the math is not just difficult; it is undefined. If the expectation diverges, there is no number to maximize. You cannot say "overwhelming probability" when the value of the outlier is infinite or undefined. You are implicitly capping the value of the future. You are saying, in practice, that consequences beyond a certain horizon do not count. If so, say that. Do not call it maximizing consequentialism. Call it local consequentialism. Or admit that you are actually evaluating the rationality of the belief, not the goodness of the act.

  I am saying that the sign of the difference is stable. I do not need the number.

  And I am saying the sign is sensitive to the model of the tail. If you are unsure about the tail, you are unsure about the sign.

  So where does this leave us? We both want to do good. We both agree consequences matter. But when the consequences recede into the fog, you want to change the map, and I want to improve the compass.

  It seems we part on what makes an act right. For you, rightness is tied to the epistemic position of the agent. An act is right if it is the best bet given what is knowable. For me, rightness is tied to the actual causal structure of the world. An act is right if it actually produces the best state of affairs. Cluelessness shows that these two come apart. If they come apart, you keep the epistemic proxy and call it the theory. I keep the metaphysical target and admit we often miss it.

  Or perhaps we part on the unit of evaluation. You think the act is the primary bearer of value. I think the act is too thin a vessel to carry that much weight. The value resides in the pattern, the institution, the life. The act is just a node in that network. Evaluating the node in isolation is a category error.

  If the network is made of nodes, the nodes must matter. If you cannot evaluate the node, you cannot evaluate the network.

  Unless the value is emergent. But that is a different seminar. For now, the question is whether I give the stranger directions.

  You give them. Your theory says it is the rational bet.

  My theory says it is the right act, because the local good is the only part of the consequence that is not noise.

  My theory says it is a gamble, and we are all gambling in the dark. But if we change the rules to say the bet doesn't count because we cannot see the cards, we stop playing the game that matters.

  Then I will play with the cards I can see. And you?

  I will try to count the ones I cannot, and hope the sum does not destroy us.
