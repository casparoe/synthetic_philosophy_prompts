answer: |-
  This is a sophisticated confusion. It is not merely verbal, but it is also not a fundamental disagreement about the mathematics. It is a disagreement about **what the mathematics is modeling**, complicated by a likely technical misconception in the seminar room regarding order dependence.

  Here is the diagnosis, separated into the mathematical settledness, the epistemic contestation, and an evaluation of your hypothesis.

  ### 1. The Mathematical Baseline (Settled)

  There is a potential source of "talking past each other" in your description that needs to be cleared up first.

  **Settled Fact 1: Order Independence for Strict Dominance.**
  You wrote: *"Once mixtures enter the picture... order starts to matter."*
  This is mathematically false for **strict** dominance. If you allow strategies to be dominated by **mixtures** of other strategies (which is the standard definition of rationalizability/IESDS in modern theory), the order of elimination **does not matter**. The set of surviving strategies is unique. This was proven by Gilboa, Kalai, and Zemel (1990).
  *   **Implication:** If Camp A is arguing that the *order* of strict deletion matters because mixtures are involved, Camp A is mathematically mistaken.
  *   **Implication:** If Camp A is arguing that the *surviving set* is the "answer" regardless of order, they are on solid mathematical ground.

  **Settled Fact 2: Order Dependence for Weak Dominance.**
  You wrote: *"especially once anyone reaches for weak dominance, order starts to matter."*
  This is correct. Iterated Elimination of *Weakly* Dominated Strategies (IEWDS) is path-dependent. Different orders of deletion yield different surviving sets.
  *   **Implication:** This is where the Epistemic story (Camp B) usually fractures. It is very difficult to construct an epistemic model where "Common Knowledge of Rationality" justifies IEWDS without running into contradictions (because deleting a weakly dominated strategy often requires believing the opponent plays a strategy that *they* should have deleted in a prior round).

  **Diagnosis Point 1:** If your seminar is conflating the mixture issue with the order issue in strict dominance, a significant portion of the disagreement is based on a technical error. If the seminar is focused on weak dominance, the disagreement is substantive because the mathematical object itself is ill-defined (path-dependent) without an external rule for ordering.

  ### 2. The Epistemic vs. Algorithmic Tension (Contested)

  Assuming the math is clear (we are talking about IESDS with mixtures, order-independent), the standoff between Camp A (Mathematical/Filtering) and Camp B (Epistemic/Reasoning) is a classic instance of the **extension/intension** problem.

  *   **Camp A (The Extension):** Cares about the *set* of strategies that survive. They view the procedure as a filtering mechanism for "obviously bad" choices. To them, the "solution" is the surviving set.
  *   **Camp B (The Intension):** Cares about the *justification* for the set. They view the procedure as a simulation of mental states (beliefs about beliefs). To them, the "solution" is the state of knowledge that makes the set stable.

  **The Hidden Formal Question:**
  The question that resolves this is: **"Under what epistemic conditions does the set of strategies surviving IESDS coincide with the set of strategies consistent with Common Knowledge of Rationality (CKR)?"**

  This is not a philosophical musing; it is a characterization theorem.
  *   **The Result:** In 2-player games, IESDS (allowing domination by mixtures) is equivalent to **Rationalizability** (Bernheim 1984, Pearce 1984). Rationalizability is defined epistemically as the set of strategies a player can choose if there is Common Knowledge of Rationality and players have subjective priors over opponents' strategies.
  *   **The Divergence:** In games with 3 or more players, they diverge. IESDS allows a player to believe that opponents' strategies are **correlated** (e.g., "If Player 2 plays Up, Player 3 definitely plays Left"). Rationalizability typically assumes opponents' strategies are **independent** (Player 2 and Player 3 randomize independently).
  *   **The Diagnosis:** Camp A is implicitly assuming correlated beliefs (which makes the math cleaner and the set larger). Camp B is often implicitly assuming independent beliefs (which feels more "physical" but makes the set smaller). They think they are discussing the same object, but in $N>2$ games, they are calculating different sets.

  ### 3. Evaluating Your Hypothesis

  Your suspicion: *"The standoff is kept alive by an assumption both camps share: that the opponent is an expected-utility maximizer with a definite prior."*

  This is insightful, but it needs a slight adjustment. The standoff survives even with EU maximizers. The real friction is about **the space of beliefs**, not just the utility function.

  **If you weaken the assumption (No definite prior / Ambiguity):**
  If you assume players only know opponents won't play strictly dominated strategies, but you do not assume they have a single additive prior (e.g., they have a set of priors, or maximize minimum expected utility), **IESDS changes.**
  *   Under MaxMin expected utility, a strategy is dominated only if it is worse than another for *all* priors in the set. This makes dominance harder to establish.
  *   Consequently, the "filtering" procedure (Camp A) yields a *larger* surviving set.
  *   The "epistemic" story (Camp B) becomes much harder to tell because "Rationality" is no longer a single maximizing condition but a set-valued condition.

  **Does IEDS survive?**
  Yes, but it decouples from the standard "Common Knowledge of Rationality" story. If you weaken the probabilistic assumptions, you move from **Bayesian Rationalizability** to **Ambiguity-Averse Rationalizability**. The algorithmic procedure (Camp A) can still run, but the epistemic justification (Camp B) requires a much more complex logic (e.g., epistemic logic with belief operators that don't satisfy standard probability axioms).

  **Verdict on your hypothesis:** You are right that the EU/Prior assumption is the glue holding the two camps together. If you remove it, Camp A (the algorithm) continues but becomes less restrictive, while Camp B (the epistemology) struggles to define what "knowledge" means. This suggests the "Epistemic" story is actually more fragile than the "Mathematical" story.

  ### 4. What Counts as Progress?

  You asked for a distinction, theorem, or change of question that would constitute progress.

  **1. Distinguish IESDS from Rationalizability.**
  Progress requires the seminar to stop using "Iterated Elimination" and "Rationalizability" interchangeably.
  *   **IESDS** is an algorithmic procedure on the game matrix.
  *   **Rationalizability** is an epistemic solution concept.
  *   **Theorem:** They coincide in 2-player games (with mixed domination) but diverge in $N$-player games due to correlation assumptions.
  *   **Progress:** Acknowledging that Camp A is doing IESDS and Camp B is trying to justify Rationalizability. If they are in an $N>2$ game, they are literally calculating different things.

  **2. Specify the Dominance Relation.**
  Progress requires explicitly stating: "Are we eliminating strategies dominated by *pure* strategies or *mixed* strategies?"
  *   If Pure only: The set is larger. Epistemic justification is weaker.
  *   If Mixed allowed: The set is smaller (Rationalizable set in 2-player). Epistemic justification is stronger (requires believing opponents can correlate).
  *   **Progress:** Admitting that allowing mixed domination is a *substantive assumption* about belief (that players consider the possibility of opponents randomizing), not just a mathematical trick.

  **3. Abandon Weak Dominance for Epistemic Stories.**
  If the seminar is discussing Weak Dominance (IEWDS), progress requires admitting that **there is no clean epistemic story for IEWDS.**
  *   Samuelson (1992) and others have shown that IEWDS is inconsistent with standard notions of Common Knowledge of Rationality because deleting a weakly dominated strategy requires assigning probability zero to some opponent strategies that were previously considered possible. This violates the "knowledge" condition in the next round.
  *   **Progress:** Agreeing that IEWDS is a purely heuristic tool with no rigorous epistemic foundation, whereas IESDS has a solid one.

  ### 5. Summary: Settled vs. Contested

  **Settled (Consensus among theorists):**
  1.  **Order Independence:** IESDS (strict dominance, allowing mixtures) is order-independent. The surviving set is unique.
  2.  **Order Dependence:** IEWDS (weak dominance) is order-dependent. The surviving set depends on the path.
  3.  **Epistemic Foundation:** IESDS corresponds to Common Knowledge of Rationality *only if* players' beliefs allow for correlation (in $N>2$) and mixed strategies are treated as real objects of belief.
  4.  **Weak Dominance Problem:** There is no widely accepted epistemic characterization for IEWDS that is consistent with standard rationality assumptions.

  **Contested (Genuine Debate):**
  1.  **Normative Force:** Even if IESDS is mathematically sound, *should* a rational player play a strategy that survives IESDS but is not a Nash Equilibrium? (e.g., in games where IESDS leaves multiple strategies).
  2.  **Mixed Strategies as Beliefs:** Does "dominated by a mixture" mean the opponent is actually randomizing, or does it mean the player is uncertain? (The "purification" debate).
  3.  **Plausibility of CKR:** Is Common Knowledge of Rationality a realistic assumption for human players, or is it a normative ideal that rarely holds? (This is the behavioral game theory critique).
  4.  **The "Solution" Status:** Is the surviving set of IESDS a "prediction" of play, or merely a bound on reasonable play? (Camp A tends toward prediction; Camp B tends toward bounds).

  ### Final Diagnosis

  The impasse is **substantive**, not verbal, but it is fueled by a **category error**.

  Camp A is treating the solution concept as a **filter** (a property of the game structure). Camp B is treating it as a **process** (a property of the players' minds).
  *   In **Strict Dominance**, the filter and the process align (via the Rationalizability theorems). If they are arguing here, they are likely confused about the role of mixtures or correlation.
  *   In **Weak Dominance**, the filter and the process **do not align**. The algorithm produces a set, but the epistemic story cannot justify the steps without contradiction.

  **Recommendation for the Seminar:**
  Stop asking "Which camp is right?" Start asking: **"Are we discussing Strict or Weak dominance?"** and **"Are we in a 2-player or N-player game?"**
  *   If Strict + 2-Player: The camps should agree (Math = Epistemology).
  *   If Strict + N-Player: They need to agree on Correlation vs. Independence.
  *   If Weak: Camp B should concede that the epistemic story breaks, and Camp A should concede that the "answer" is path-dependent and therefore not a unique fact about the game.

  Your hypothesis about EU priors is the deep cut: if you remove the probabilistic structure, Camp B (Epistemology) collapses faster than Camp A (Math). This suggests the "Mathematical Fact" story is more robust, but also less informative about *why* players choose what they choose. The "Solution Concept" is indeed overloaded; it is trying to be both a computational tool and a psychological model simultaneously. Progress comes from decoupling them.
