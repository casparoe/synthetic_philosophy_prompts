          *   Camp A (Mathematical/Objective): IEDS is a fact about the game structure. Dominated strategies (even by mixtures) are irrational. Eliminate them. Order doesn't matter for strict dominance.
          *   Camp B (Epistemic/Reasoning): IEDS models layers of knowledge (I know you're rational, you know I know...). The fixed point encodes common knowledge of rationality.
          *   **The Friction Point:** Order dependence (especially with weak dominance) and the role of mixtures. Camp A sees a theorem about sets; Camp B sees a claim about knowledge.
      *   **The User's Goal:** A diagnosis, not a ruling. Is it substantive, verbal, or talking past each other? Is there a hidden formal question? Is "solution concept" overloaded?
      *   **User's Hypothesis:** The standoff relies on assuming opponents are EU maximizers with definite priors. If we weaken this (just "won't play bad"), does IEDS survive?
