      *   **Conclusion:** It's genuinely hard, not just verbal. The concept "Solution Concept" is indeed overloaded.

  4.  **Drafting the Content - Section by Section:**

      *   *Correction on Order:* I must point out that for *strict* dominance, mixtures do not make order matter. This is a theorem (Gilboa, Kalai, Zemel 1990). If the seminar thinks order matters for strict dominance with mixtures, that's a math error, not a philosophical dispute. If they are talking about *weak* dominance, then order matters, and the epistemic story breaks down (because deleting a weakly dominated strategy assumes the opponent plays the specific strategy that makes it weak, which contradicts common knowledge of rationality in some states).
      *   *The Epistemic Program:* Cite Brandenburger, Dekel, Fudenberg, Tirole. The key is "Common Knowledge of Rationality" (CKR).
