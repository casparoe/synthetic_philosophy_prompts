  2.  **Initial Assessment & Fact-Checking:**

      *   *Strict Dominance (IESDS):* It is a settled mathematical fact that for *strict* dominance (including by mixtures), the order of elimination does *not* matter. The set of surviving strategies is unique. (Pearce 1984, Gilboa et al. 1990).
      *   *Weak Dominance (IEWDS):* It is a settled mathematical fact that order *does* matter.
      *   *Epistemic Foundations:*
          *   IESDS is characterized by Common Knowledge of Rationality (CKR) *if* rationality is defined appropriately (e.g., allowing for correlated beliefs or specific belief structures).
          *   Brandenburger & Dekel (1987), Pearce (1984), Bernheim (1984).
          *   Crucial nuance: For IESDS to match CKR, players must believe opponents can play *any* mixture of surviving strategies (independence vs. correlation issues).
      *   *The User's "Mixture" Point:* The user notes that a strategy can be dominated by a *mixture* even if not by a pure strategy. This is correct. IESDS usually allows domination by mixed strategies.
      *   *The User's "Order" Point:* The user claims "Once mixtures enter the picture... order starts to matter." This is technically incorrect for *strict* dominance. Order only matters for *weak* dominance. This is a potential source of confusion in the seminar. I need to clarify this gently.
