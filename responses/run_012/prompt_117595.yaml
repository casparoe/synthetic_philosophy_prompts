prompt: |-
  Alright, so I have to bring a joke to our experimental philosophy reading group, and I want it to be about the Knobe effect. You know the setup — a CEO tells the board he doesnt care about the environment, the board greenlights a project that makes a pile of money and, as a side effect, trashes a river. Ask people whether he trashed the river on purpose and they say yeah, obviously. Now flip the side effect so the project happens to clean the river up instead, ask whether he cleaned it up on purpose, and it's nah, that was just a side effect. Thats the asymmetry I want the joke to ride on.

  The problem is every x-phi joke about this is the same CEO and the same river, and the whole room has heard it. So build the joke around this twist instead:

  - make the side effect mixed: good for one group, bad for another (a rule that cuts rents for tenants and also drains a pension fund, something like that — your call, just keep it clean). Now the "did she do it on purpose?" answer depends on who you ask.
  - make the side effect a norm violation at the same time: she pulls it off in a way that breaks some rule or convention, even though the outcome is genuinely great for the people who come out ahead.

  The punchline should land on the fact that the intentionality verdict tracks whoever got hurt, or whoever's rule got broken, not the outcome. I want someone who's read the side-effect-effect literature to laugh and wince at the same time. Not a generic "philosophers, am I right" joke, and not the CEO case with different nouns. Short setup, real punchline — this is a joke, not an essay. Give me one version, and if you've got a second ending that hits a different note, tack it on. American English please, I'm reading it out loud to a room full of grad students.
