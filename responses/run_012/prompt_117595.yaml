  So, picture this: A Department Chair waives tuition for all grad students. To cover the loss, she drains the adjunct pension fund. And she authorizes the transfer by forging the Dean's signature.

  We poll three groups.
  We ask the students: "Did she mean to help you?"
  They say: "Nah, just a lucky side effect."
  We ask the adjuncts: "Did she mean to screw you?"
  They say: "Yes, obviously."
  We ask the Dean: "Did she mean to break the rules?"
  He says: "Yes, absolutely."

  **Punchline 1:**
  Turns out, "intentionality" isn't a mental state. It's just a liability assessment.

  **Punchline 2:**
  Turns out, the only thing unintentional was the consensus.
