answer: |-
  Dear Writer,

  It sounds like you had the kind of dinner party that most academics would sell a kidney to attend, and it is no surprise you are hooked. You have accidentally reconstructed one of the most durable debates in the philosophy of mind, specifically the problem of mental causation, and both your partner and your friend are arguing from well-established positions. Since you asked for a referee's report on the exchange itself before you get to the verdict on your novel, I will walk through their six moves in order to tell you where the physics and the philosophy actually stand.

  Your partner's opening move is logically tight but rests on a contested assumption. He is articulating the causal exclusion argument, famously developed by Jaegwon Kim, which states that if a physical cause is sufficient for an effect, any distinct mental cause is redundant. He is right that if you define causation as sufficient production and you assume the mental and physical are distinct, you get overdetermination or epiphenomenalism. However, he is wrong to present this as the only option because it assumes causation must be a matter of sufficiency rather than dependence. Your friend's counter in the second move is broadly correct because it shifts the definition of causation to counterfactual dependence, following David Lewis. She is right that causes are difference-makers and that the same event can be described in multiple ways without competing. If the jealousy had been different, the action would have been different, so the jealousy is doing work. The only thing she glosses over is that this doesn't fully solve the exclusion problem for someone who insists on a physical mechanism, but she is right that competition between descriptions is a category error.

  When your partner responds in the third move, he shifts to an interventionist account of causation, likely drawing on James Woodward. He is right that we can intervene on neurons more directly than on minds, but he is wrong to conclude this makes the mental a passenger. Just because the mental supervenes on the physical does not mean it lacks causal power, any more than a software command lacks causal power because it relies on hardware. Your friend's reply in the fourth move is strong and correctly identifies the multiple realizability argument. She is right that if only the fundamental physical level causes things, then higher-level sciences like economics or medicine are illusory, which is an absurd conclusion known as causal exclusion nihilism. Her point about generalization is crucial because the neural state is too specific to explain the pattern of behavior across different contexts.

  Your partner's fifth move is sophisticated and brings in the proportionality constraint, often associated with Stephen Yablo. He is partially right that a cause should be specific enough to produce the effect but not so specific that it excludes relevant alternatives. However, he is wrong to suggest this automatically favors the neural description. Sometimes the neural details are too specific to be the relevant cause, just as the specific molecular arrangement of a rock is less relevant to a broken window than the fact that it was a heavy object thrown with force. Your friend's final rebuttal is the strongest of the bunch because she exposes the cost of your partner's view. She is right that if specificity wins every time, ordinary causal talk becomes false, and we are left with a world where only particles interact. This is technically consistent but pragmatically useless for anyone who isn't a particle physicist.

  Despite the high level of play, there is something both of them are missing that matters deeply for you as a novelist. They are treating causation as a single unified relation, but in practice, we distinguish between causal production and causal explanation. Your partner is focused on production, the mechanical pushing of ions and muscles, while your friend is focused on explanation, the reason why the action makes sense in a context. What they are both missing is that for a human agent, the mental state is not just a description of the brain state but the interface through which the agent interacts with the world. The jealousy is not merely a label for the neurons; it is the structured relationship between the character, his values, and his perception of threat. By focusing only on the metaphysics of causation, they ignore the phenomenology of agency, which is where your story lives.

  This brings me to the verdict you need to write your chapter. You should side with your friend. If you side with your partner, you are committed to the view that your character's jealousy is an illusion and that his arms move solely because of electrochemical signals that have no meaning attached to them. While this might be physically defensible in a lab, it is narratively fatal because it removes the character's agency. If the jealousy is just a passenger, then the character is not doing something stupid because he is jealous; he is a puppet of his physics, and there is no tragedy in that, only mechanics. For the purposes of fiction, the mental level is the causal level because it is the level at which reasons operate. Your character acts because he feels jealousy, and that feeling is real enough to break a vase, end a relationship, or drive the plot. Write the scene as if the jealousy is the cause, because in the world you are building, reasons are forces, and to deny them is to deny the very possibility of a story.
