      *   *The "Retreat":* If defenders say "we can always interpret the chemistry as syntax," the thesis becomes unfalsifiable. This is a vice. It turns a structural claim into a hermeneutic stance.
      *   *The "Anti-Gödelian" System:* A system that replicates via pure physical resonance or crystal growth (e.g., clay crystals) without a distinct code. If this counts as replication, the thesis is limited to *coded* replication, not replication *simpliciter*.
