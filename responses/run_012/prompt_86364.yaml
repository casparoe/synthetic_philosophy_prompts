      *   *Third Major Objection (Medium Impact):* Von Neumann's Distinction. The passive/active duality. Is it really self-reference or just dual-use?
      *   *Fourth Major Objection (Medium-Low Impact):* Triviality/Diagonalization. If everything complex is self-referential, the claim explains nothing specific.
      *   *Addressing the "Retreat":* If the thesis survives by saying "we can always *find* a description," is that a vice?
