      *   *The Strongest Challenge (Autocatalysis):* Start with Kauffman. If a network of peptides catalyzes each other's formation without a linear template, there is no "string" being "read." There is no separation of data and function. This strikes at the heart of the "code" metaphor. If life *could* start this way, the Gödelian structure is a later evolutionary invention, not a fundamental condition of replication.
      *   *The Physical vs. Semantic:* In logic, reference is abstract. In biology, it's stereochemical. The ribosome doesn't "know" it's reading; it's a machine. The "meaning" is imposed by us. This lowers confidence because it suggests the self-reference is in the map, not the territory.
