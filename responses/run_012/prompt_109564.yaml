          *   *Idea:* Convince yourself it's true so you aren't lying.
          *   *Kantian Fit:* Terrible. Kant values rationality and autonomy. Deliberately inducing false belief in oneself is a violation of duty to oneself. It's bad faith.
          *   *Verdict:* Bottom tier.

