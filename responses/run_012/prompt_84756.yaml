answer: |-
  **MEMORANDUM**

  **TO:** Ethics and Safety Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Adherence Program Feature Review

  ### Executive Summary

  The Product Team proposes two behavioral features for the new chronic medication adherence program: (1) loss-framing notifications regarding streak counts, and (2) voice-synthesized messages mimicking the patient's "future self."

  After reviewing the ethical implications, my recommendation is to **approve the loss-framing feature with frequency caps** and **reject the voice-synthesis feature outright.**

  This decision rests on a new standard for permissible influence: **Ex-Ante Instrumental Transparency.** This standard resolves the ambiguities in our draft policy and avoids the pitfalls of both pure utilitarianism and rigid prohibition.

  ### The Ethical Criterion: Ex-Ante Instrumental Transparency

  Our draft policy defines manipulation as influence that "makes the choice not really their own." As noted in deliberations, this is circular; it describes the symptom, not the mechanism. Conversely, the argument that "health outcomes justify the means" ignores the dignity of the patient-insurer relationship.

  During our working session, a proposal was made to judge influence by whether a person would remain glad they acted *after* learning how the message was produced (Reflective Endorsement). While intuitive, this criterion fails two critical stress tests:
  1.  **The False Negative Problem:** Legitimate aids (an alarm clock, a teacher's stern warning) might cause regret in the moment of reflection but remain ethically sound tools.
  2.  **The Power Lever Problem:** A patient might reflectively endorse a choice even if the insurer holds a psychological lever over them that they cannot contest or audit. Endorsement does not equal equality.

  Furthermore, while some argue this is purely a deception issue (the voice is "fake"), focusing solely on truthfulness is too narrow. Non-deceptive tactics can still undermine agency.

  **The Standard:**
  I propose we adopt **Ex-Ante Instrumental Transparency**. An influence mechanism is ethical if and only if:
  1.  **Instrumentality:** The tool acts as an extension of the patient's *established* will (e.g., "I want to take my meds"), not a substitute for it (e.g., "I am being emotionally blackmailed by a simulation").
  2.  **Ex-Ante Disclosure:** The mechanism is disclosed *before* engagement, not discovered after the fact.
  3.  **Contestability:** The patient retains the technical and emotional ability to disable the lever without penalty or friction.

  This standard beats the alternatives because it focuses on the *structure of the relationship* rather than the *outcome of the choice* (Utilitarian), the *feeling of regret* (Reflective Endorsement), or the *truth-value of the content* (Deception). It ensures the patient holds the handle of the lever, not the insurer.

  ### Application to Features

  **1. Loss-Framing ("Don't lose your 40-day streak")**
  *   **Analysis:** This feature leverages loss aversion, a known cognitive bias. However, it passes the Instrumentality test. The patient has an established goal (adherence); the message reminds them of the cost of deviation relative to their own history.
  *   **Transparency:** The logic is obvious. A patient knows a "streak" is a gamified metric constructed by the app.
  *   **Contestability:** Turning off notifications disables the pressure.
  *   **Verdict:** **Permissible.** It functions as a digital alarm clock for behavior. It is an instrument of the patient's will, not a puppeteer.

  **2. Voice Synthesis ("Future Self" Messages)**
  *   **Analysis:** This feature fails on all three counts.
      *   **Instrumentality:** It does not extend the patient's will; it simulates a relationship that does not exist. It bypasses rational deliberation by triggering deep emotional bonding mechanisms intended for human kin, not software. This creates a "Power Lever" the patient cannot contest emotionally, even if they opted in logically.
      *   **Transparency:** While the *existence* of the feature is disclosed, the *experience* is designed to obscure the mechanism during the moment of influence. It relies on the suspension of disbelief to work.
      *   **Contestability:** How does one "disable" a message that sounds like their own voice pleading for their daughter's wedding? The emotional friction to opt-out is disproportionately high compared to a text notification.
  *   **Deception Note:** While this is indeed deceptive (you have no "future self" speaking to you), banning it solely on deception grounds would allow a text version ("Your future self says...") which remains manipulative. The issue is the *impersonation of agency*, not just the voice.
  *   **Verdict:** **Prohibited.** This crosses the line from nudging to psychological ventriloquism.

  ### Recommendations and Implementation

  1.  **Voice Synthesis:** The Product Team must halt development on the voice cloning feature immediately. No data collection for voice modeling should occur.
  2.  **Loss-Framing:** Approved for launch, subject to the following conditions:
      *   **Frequency Cap:** No more than one loss-framed message per 72-hour period to prevent anxiety spiraling.
      *   **Positive Framing Option:** Users must be able to toggle to "gain-framing" ("You've built 40 days!") in settings.
      *   **Disclosure:** Onboarding must explicitly state: "We use behavioral psychology, including loss aversion, to encourage adherence."
  3.  **Timeline:**
      *   **Policy Update:** Finalize and publish the "Ex-Ante Instrumental Transparency" standard by next Tuesday's board meeting.
      *   **Tech Adjustment:** Product Team to implement toggles and caps within 45 days.
      *   **Audit:** Safety Board to review adherence data and user complaints at 90 days post-launch.

  ### The Strongest Counter-Argument

  The strongest argument against this decision comes from the Utilitarian perspective held by some board members: **"Health is the primary good."**

  If the voice feature increases adherence by 33%, that represents a significant reduction in strokes, heart failures, and diabetic complications. By banning a feature because it feels "creepy," we may be prioritizing our own comfort over patient survival. If a patient *chooses* to trade a bit of dignity for a higher chance of being alive to attend their daughter's wedding, who are we to veto that trade-off?

  **Rebuttal:** This argument assumes the choice is stable. But the voice feature is designed to *alter* the stability of that choice by exploiting emotional vulnerabilities that the patient did not intend to put on the table. We are not vetoing their trade-off; we are refusing to build a machine that makes the trade-off involuntary. We can support their health without becoming the voice in their head.

  ### Conclusion

  We must build tools that serve patients, not tools that act upon them. The loss-framing feature respects the patient as a rational actor with goals. The voice feature treats the patient as a system to be hacked. We should proceed with the former and discard the latter.

  I move to adopt the **Ex-Ante Instrumental Transparency** standard and the recommendations above.
