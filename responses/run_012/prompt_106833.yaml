  It's wild that we're the first species in Earth's history to sit on the committee deciding if we're a geological force. The cyanobacteria didn't file a GSSP proposal when they oxygenated the atmosphere. The asteroid that killed the dinosaurs didn't submit a risk assessment. But us? We need a Golden Spike. We need a physical line in the rock where we sign in.

  And we argued about the start date like it was a union contract. Is it 1780? Coal? Is it 1610, when the colonization genocide caused enough reforestation to dip the CO2? The working group finally went with 1950—plutonium fallout from atomic tests in Crawford Lake. You can literally see the radiation in the mud. It's a global signal.

  Then the higher committee voted it down.

  So now we're in this weird limbo where we've definitely altered the planet forever, but we didn't get the paperwork stamped. We're like tenants who burned down the building, but the landlord rejected the eviction notice because we used the wrong form. We're the only asteroid in history that needed a zoning permit. Basically, we're the first species to be too bureaucratic to go extinct properly.
