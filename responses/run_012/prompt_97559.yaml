answer: |-
  Your observation strikes at the very heart of archaeological epistemology, and you are right to feel that tension because it is not merely a pedagogical inconsistency but a foundational philosophical rift that the discipline has struggled to heal for over a century. What you are describing is the friction between a methodological skepticism that we profess to protect ourselves from accusation and an ontological realism that we practice to make our work meaningful. To reconstruct the theory of inference that your fieldwork presupposes, we must look at what is happening when you draw a line around a feature and label it ritual. This practice assumes a form of uniformitarianism not just of physical processes but of cognitive structures, operating on the premise that past human minds functioned sufficiently like present human minds that we can use our own understanding of intentionality as a key to unlock theirs. It relies on what philosophers of science call abduction, or inference to the best explanation, where the presence of certain material patterns is treated as the effect of a specific mental cause, such as belief or intention. For this inference to be more than an arbitrary label, you must hold that mental states are real entities that have causal power in the physical world and that this causality leaves a detectable signature in the material record. You are implicitly committed to the view that intention is not ephemeral but is embedded in action, and that action stabilizes into material forms that retain a trace of the original purpose. Without this commitment, the classification of a deposit as subsistence versus ritual would indeed be nothing more than a fictional story we tell ourselves, but the fact that these classifications guide future excavation strategies and comparative analysis shows that the discipline treats them as provisional truths about the past rather than mere organizational tools.

  When we consider which rival views this practice quietly rules out, the boundaries become clearer. The routine attribution of mental states is fundamentally incompatible with a thoroughgoing behaviorism that refuses to posit inner states at all, because a behaviorist archaeology would describe only the physical arrangement of objects and refuse to speak of belief, consecration, or desecration. Similarly, the practice rules out a radical hermeneutic skepticism which holds that meaning is entirely contingent on the viewer and that the physical record is so underdetermined that no specific intention can ever be privileged over another. If your instructors truly believed that meaning was radically unstable, they could not justify filing ambiguous features under ritual with any confidence, nor could they treat a subsistence classification as having more evidential weight than a ritual one. The practice also sits uneasily with a strong social constructivism that views categories like domestic and ritual as purely modern Western impositions, because if those categories were entirely foreign to the past people being studied, using them as explanatory variables would be an act of colonization rather than inference. By proceeding as if these categories map onto real distinctions in past human life, the method assumes that there are trans-cultural constants in how humans organize their world, or at least that our categories are sufficiently porous to capture those distinctions without distorting them beyond recognition.

  This brings us to the question of internal consistency, and here I must be direct with you because your intuition is correct. The humility professed in seminar cannot logically coexist with the confident ritual labels in the reports if both are taken as literal descriptions of the same epistemic stance. One of them is doing the real work while the other is serving as a ceremonial shield. The skepticism you hear in class is a legacy of processual archaeology's demand for scientific rigor, a defensive maneuver designed to protect the discipline from charges of speculation, while the report writing is driven by the narrative necessity of post-processual interpretation, which requires coherent stories about past lives to justify the excavation to funding bodies and the public. When your instructors claim the categories are just heuristic, they are employing a philosophical dodge known as instrumentalism, suggesting that the truth of the category does not matter so long as it is useful. However, as you have noted, the categories are not treated as equally provisional in practice. A subsistence finding is treated as a hard fact about caloric intake, while a ritual finding is treated as a hard fact about belief, yet both rely on the same chain of inference. The inconsistency lies in granting ontological weight to the mental state when it suits the narrative while retreating to methodological agnosticism when challenged on the evidence. The category of ritual often functions as a god of the gaps, a place to put material residues that refuse to fit into economic or functional models, yet it is presented as a positive identification rather than an admission of ignorance.

  To distinguish what the practice strictly presupposes from what it merely fits comfortably with, we need to separate the necessity of inference from the specificity of the categories. Strictly speaking, the practice presupposes only that human action is intentional and that intention modifies the material world in distinguishable ways. It does not strictly require a Cartesian dualism that separates mind from matter, nor does it require the specific binary of sacred versus profane that underpins the domestic versus ritual distinction. You could account for the same material patterns using a theory of embodied cognition or material engagement, where the mind is not an inner theater sending signals to the hand but is extended into the tools and deposits themselves. Under such a view, you would not need to infer a belief in an afterlife to explain grave goods; you would only need to describe the specific manner in which the living engaged with the dead through those objects. The current practice fits comfortably with folk psychology because it is intuitive for us to think in terms of beliefs and desires, but it is not philosophically required. The practice is also underdetermined regarding the stability of meaning; you could maintain the method of classification while admitting that the meaning of those categories shifted over time or varied between individuals, whereas the current habit treats the categories as static boxes. The invisible work is being done at the moment you decide that a broken pot is ritual breakage rather than accidental discard, a decision that relies on a tacit theory of normalcy that is rarely articulated.

  If you were to replace the presupposed theory with one of the rivals I have identified, the changes to method and reporting would be substantial and would alter the rhythm of your daily work. If you adopted a strict behaviorist stance, you would cease inferring belief entirely and your reports would describe only spatial relationships, material composition, and modification marks, leaving the question of why entirely open. This would likely make your reports less readable but more empirically secure. If you adopted a practice theory approach instead, you would shift from labeling features as ritual to describing them as performances or events, focusing on the sequence of actions that created the deposit rather than the mental state that preceded it. You would stop writing that a feature evidences a belief in an afterlife and start writing that the deposition of these objects enacted a relationship between the living and the dead. Reporting conventions would need to change to include probabilistic language that reflects the actual uncertainty of the inference, perhaps using confidence intervals for interpretations just as we use them for radiocarbon dates. The category of indeterminate would need to be rehabilitated from a fallback option to a valid and respected conclusion, preventing the automatic dumping of ambiguity into the ritual category. The specific moments where the commitment is currently doing invisible work are the moments of typological sorting and feature definition, where a cluster of stones becomes an altar rather than a foundation, and these are the places where you are being trained to stop noticing the leap from matter to meaning. You are being trained to see the interpretation as part of the observation, which is a powerful skill but also a dangerous habit if left unexamined. Your task as a developing archaeologist is not necessarily to abandon these categories, as they are the language of our field, but to hold them lightly enough to see where they are constraining your vision, and to be honest in your writing about the gap between the soil you dug and the thoughts you claim to have found.
