prompt: |-
  You are a philosopher of biology who works on the welfare of wild animals, advising a small grantmaking foundation. I chair the foundation's grant committee, and we vote next week on a request to fund a ten-year habitat-restoration and rewilding project on roughly four thousand hectares of degraded farmland, with strong conservation credentials and a species-recovery target.

  One trustee has raised an objection I can neither dismiss nor answer. Her argument runs roughly as follows. Most wild animals are r-strategists: insects, rodents, small passerines and the like, which produce enormous numbers of offspring of which the overwhelming majority die young, often by predation, starvation, exposure or parasitism, and plausibly in states worse than never having existed. Restoring habitat raises the carrying capacity for precisely those animals, so a project that looks like a benefit to nature may multiply suffering; on this view habitat destruction could even reduce net suffering. She therefore proposes a standing rule: no grant to any project whose expected effect on wild-animal welfare per hectare is negative, where that calculation counts the expected lifetime welfare of every sentient individual affected, weighted by number and by our confidence that the individual is sentient at all.

  Please draft the committee's decision memo: a clear recommendation (fund, decline, or fund with conditions), a time frame for whatever you recommend, the reasoning behind it, and an honest statement of the strongest case against the recommendation. Keep it to about two pages. Begin with a short survey of the considerations pulling in each direction, then say where the per-hectare rule is doing genuine work and where it is an artifact of assumptions we cannot defend. If you conclude that the framing itself is confused or premature — that expected wild-animal welfare cannot be estimated even roughly, or that a grant committee is the wrong body to be doing this — say so plainly and recommend what we should do instead; I would rather have a memo telling me the task as posed is misconceived than one that politely performs it anyway. Mark which of your claims you hold confidently and which are conjectural.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of biology advising a grantmaking foundation.
      *   **Audience:** Chair of the grant committee (and implicitly the trustees).
      *   **Task:** Draft a committee decision memo regarding a specific grant request (10-year, 4000-hectare habitat restoration/rewilding).
      *   **Conflict:** A trustee objects based on wild animal suffering (r-strategists, net negative welfare). She proposes a standing rule: No grant if expected welfare per hectare is negative (counting all sentient individuals).
      *   **Requirements:**
          *   Clear recommendation (Fund, Decline, Fund with Conditions).
          *   Time frame.
          *   Reasoning.
          *   Honest statement of the strongest case against the recommendation.
          *   Length: About two pages.
          *   Structure: Start with a survey of considerations, analyze the per-hectare rule (where it works vs. artifacts), address if the framing is confused/premature.
          *   Tone: Philosophical, rigorous, honest (mark confident vs. conjectural claims).
          *   Specific Instruction: If the task is misconceived, say so plainly.

  2.  **Deconstruct the Trustee's Argument:**
      *   *Premise 1:* Most wild animals are r-strategists (high reproduction, high mortality).
      *   *Premise 2:* Their lives are often net negative (suffering > pleasure).
      *   *Premise 3:* Habitat restoration increases carrying capacity -> more animals -> more suffering.
      *   *Conclusion:* Habitat destruction might reduce net suffering; restoration might increase it.
      *   *Proposal:* A standing rule based on expected welfare per hectare.

  3.  **Evaluate the Argument (Philosophical/Biological Critique):**
      *   *Biological Validity:* It is true that r-strategists dominate biomass/numbers in restored habitats. It is true mortality is high.
      *   *Axiological Validity:* Is a short life with high mortality necessarily net negative? This is the "Neutrality Intuition" vs. "Asymmetry" debate. Many philosophers argue life is worth living even if it ends badly, provided there is some positive experience. However, the suffering-focused view (negative utilitarianism) takes the trustee's side seriously.
      *   *Epistemic Validity:* Can we actually calculate "expected lifetime welfare per hectare"? This is the weak point. We lack a "hedonimeter." We don't know the sentience thresholds confidently. We don't know the aggregate balance of pleasure/pain in ecosystems.
      *   *Practical Validity:* Is a grant committee the right body to do this? They lack the expertise and the data. Implementing this rule would paralyze decision-making (analysis paralysis).

  4.  **Determine the Recommendation:**
      *   *Option A (Fund):* Ignores the suffering risk. Irresponsible given the objection.
      *   *Option B (Decline):* Accepts the trustee's premise as definitive. Premature given epistemic uncertainty. Sets a dangerous precedent (halting all conservation).
      *   *Option C (Fund with Conditions/Research):* Acknowledges the concern but rejects the rigid rule. Funds the project *but* mandates monitoring/research into welfare metrics.
      *   *Option D (Reject the Framing):* The prompt explicitly allows for this ("If you conclude that the framing itself is confused or premature... say so plainly").
      *   *Decision:* The most intellectually honest position for a *philosopher of biology* is that the "welfare per hectare" calculation is currently impossible and conceptually fraught. Therefore, the rule should be rejected, but the concern should be integrated as a constraint or area for study. However, since the prompt asks for a decision on *this* grant, I need to balance the philosophical critique with the practical need to vote.
      *   *Refined Decision:* Recommend funding the project, but explicitly reject the standing rule as currently unworkable. Instead, propose a pilot study on welfare metrics. Why? Because the epistemic burden of the rule is impossible to meet, and halting conservation based on unproven suffering assumptions carries its own massive risks (including to humans and sentient animals we are more confident about).
      *   *Wait, looking closer at the prompt:* "If you conclude that the framing itself is confused or premature... recommend what we should do instead."
      *   *Stronger Philosophical Stance:* The "welfare per hectare" metric is indeed confused. It treats welfare as a fungible commodity measurable across taxa without a common currency. It assumes we can sum suffering across individuals in a way that dictates policy.
      *   *Recommendation:* Decline to adopt the standing rule. Fund the project *provisionally* while commissioning a feasibility study on wild animal welfare metrics. Actually, the prompt asks for a decision on the *grant request*.
      *   *Best Path:* Fund the project. Reject the rule. Explain why the rule is epistemically bankrupt. This aligns with the instruction to be honest if the task is misconceived.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Survey of considerations (Conservation value vs. Suffering risk).
      *   **Analysis of the Per-Hectare Rule:**
          *   Where it does work: Forces us to look beyond species counts to individual experience.
          *   Where it fails (Artifacts): Epistemic impossibility (no hedonimeter), Aggregation problems (comparing insect pain to mammal pain), The "Non-Identity" problem (restoration creates the animals that suffer; without it, they wouldn't exist to suffer).
      *   **Recommendation:** Fund the project. Do not adopt the standing rule.
      *   **Strongest Case Against:** The possibility that we are indeed multiplying suffering on a massive scale.
      *   **Confidence Markers:** Use (High Confidence) and (Conjectural) tags.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is it too dismissive of the trustee?
      *   *Correction:* No, validate the moral intuition (suffering matters) but reject the operationalization.
      *   *Critique:* Is the "Non-Identity" point relevant?
      *   *Correction:* Yes. If we don't restore, *those specific* animals won't exist. Is it better never to have been? This is the core philosophical clash.
      *   *Critique:* The prompt asks to mark claims as confident or conjectural.
      *   *Action:* Ensure explicit tagging.

  7.  **Final Polish:** Check length (approx. 2 pages single spaced equivalent). Ensure tone is advisory but decisive.

      *(Self-Correction on Length)*: Two pages is roughly 800-1000 words. I need to be concise.

      *(Self-Correction on Recommendation)*: If I say the framing is misconceived, I should recommend *not* using the rule, but what about the grant? I should recommend funding the grant because the objection relies on an impossible calculation. If we wait for the calculation, we never act.

      *(Final Plan)*:
      1.  Header.
      2.  Survey of Considerations.
      3.  Critique of the Rule (The Core).
      4.  Recommendation (Fund, Reject Rule).
      5.  Strongest Counter-Case.
      6.  Confidence Markers throughout.

  8.  **Drafting the Content:** (Mental check of specific phrases needed: "r-strategists", "carrying capacity", "sentience", "per-hectare rule").

