prompt: |-
  I'm in a reading group and we're going through one of those trade books on metaphysics — the kind that explains possibility and necessity with no symbols and alot of anecdotes. There's a chapter on conceivability as a guide to possibility that I want to check before I lean on any of it. Here's the chapter's argument, as best I can reproduce it:

  "The conceivability-possibility bridge says that if you can conceive of something, then it's possible. Descartes is the classic source: whatever we can clearly and distinctly conceive of, God could have made that way, so it's genuinely possible. The bridge broke in the 1970s, when Kripke pointed out that we can conceive of water that isn't H2O, and of Hesperus not being Phosphorus, even though those are necessary truths — so conceivability doesn't track possibility after all. Chalmers then tried to rebuild the bridge for the mind–body problem with his zombie argument: we can conceive of a zombie, a physical duplicate of you with no experience on the inside, so zombies are possible, and therefore consciousness isn't physical. The upshot is that the bridge is basically a dead letter, and most philosophers working today are modal skeptics who think conceivability tells us nothing about what's possible."

  I want you to act as a philosopher who works on modality and knows the conceivability literature inside out, and audit this for me. Go sentence by sentence: which parts are accurate, which are fair popularizations, and which are actually wrong or misleading. I keep hearing terms like "ideal" versus "prima facie" conceivability, "epistemic" versus "metaphysical" possibility, and "a posteriori necessity," and I have a nagging feeling the summary is using some of these words in ways the real debate doesn't — but I can't tell whether that's me being confused or the book being sloppy. So before you write the audit, brainstorm the main distinctions the summary is blurring, and then use them. Also tell me what someone who actually defends the bridge would say in their own defense, in their own vocabulary rather than the book's, and whether the book's closing claim (bridge dead, everyone's a modal skeptic) really follows from the parts of the summary that survive. Don't bother with citations or a reading list — I want the distinctions and the diagnosis, not references. I'm definately inclined to think the book is right, so push back if I shouldn't be. Take your time and be careful about the fine distinctions here.
