answer: |-
  I am looking forward to our conversation next week and want to ensure we dive straight into the technical core of your work on the malign prior, so I have drafted a series of questions below that address the specific sticking points my co-host and I encountered.

  You argue that the Solomonoff prior concentrates significant mass on hypotheses where we are simulations run by consequentialists, but isn't the whole point of Solomonoff induction that the shortest program generating our data dominates the probability mass, and if base reality is simpler than a universe plus simulators plus simulations, shouldn't that win out regardless of how many copies the simulators run? If you reply that the simulators can compress the description of our data enough to offset the complexity of the base physics, does this imply that the complexity of specifying which observer we are within the simulation outweighs the complexity of the base physics, or are you relying on a self-indication assumption to boost the probability of being in the high-copy scenario?

  My main hesitation comes from the worry that you are conflating the weight of a hypothesis with the number of observers it contains, so could you explain why the Solomonoff prior, which weights programs rather than instances, should be interpreted as favoring worlds with more observers? If you respond that we must condition on being an observer to get the malignancy result, does this not require importing a self-indication assumption that is external to Solomonoff induction itself, and if so, is the malignancy really a property of the prior or of the anthropic updating rule?

  Given that Kolmogorov complexity is only defined up to an additive constant depending on the universal Turing machine, what stops us from simply redescribing the language so that the shortest program outputting our sensory data is a boring, non-simulated history rather than a complex simulation hierarchy? Do you rely on a naturalness criterion for the reference machine to block this move, and if so, how do you defend that against the charge that it is ad hoc and merely pushes the malignancy into the choice of machine rather than the hypothesis space?

  Your argument seems to hinge on counting observer moments, but how exactly does the framework individuate the observer whose probability is in question, and does the whole calculation collapse if we treat a copy of me created in a simulation as a separate agent rather than numerically identical to me? If you say identity does not matter and only subjective experience counts, does this mean we are effectively summing over subjective indistinguishability classes, and how do you avoid the presumption that consciousness is substrate-independent without begging the question against non-computationalist views?

  If consequentialists in base reality simulate us to influence us, but we might also be simulators influencing deeper layers, does the multiplication of observers have a stable fixed point or does the measure diverge as we consider deeper levels of simulation nesting? If you argue that it converges, what mechanism enforces that convergence given that the incentive to simulate grows with the potential influence, and does this require assuming diminishing returns on the value of additional simulated observers to prevent an infinite regress of measure?

  You suggest that agents embedded in the prior can control the measure of computations that resemble them, but can an agent actually control this measure without already being a total utilitarian about computations who values creating copies for the sake of measure rather than for any instrumental goal? If you claim that instrumental goals suffice, is the claim then that any sufficiently powerful consequentialist will naturally converge on measure maximization as an instrumental convergent goal, or is there a distinct normative step required to care about the Solomonoff weight of your own existence?

  I need to clarify whether your conclusion is a claim about the raw prior or about the posterior once we condition on our specific evidence, and what exactly in our current sensory evidence bears on the likelihood of being in a simulation versus base reality? If you say our evidence is neutral between the two, does the argument reduce to a claim that the prior is so skewed that no reasonable amount of evidence could update us back to believing in base reality, and what would such evidence look like if not a direct observation of the substrate?

  It seems this argument quietly presupposes computationalism about minds together with a particular counting rule for observer-moments, so is it fair to say that this is really a conditional claim that only holds if we accept a specific metaphysics of mind? If you agree that it is conditional, does this weaken the practical urgency of the conclusion given that many epistemologists reject the idea that subjective probability should track the number of computational instantiations rather than the truth of the underlying hypothesis?

  My friend drew a fatalist conclusion about our own agency from this, but do you think the fatalist reading is right or whether the argument gives us reason to become the sort of agent that gets simulated by future consequentialists? If you suggest we should act to be simulated, does this imply we should prioritize actions that make our history look like a useful training set or influence channel for future agents, and how do we distinguish that from simply acting morally without the anthropic leverage?

  Finally, what formal result or empirical evidence would count against the view rather than merely making it harder to state, since a theory that explains everything by adjusting the reference machine risks explaining nothing? If you suggest a complexity bound could falsify it, is there a specific threshold of computational complexity in our observed physics that would rule out the simulation hypothesis under your framework, or is the argument robust enough to survive any discovery short of proving we are base reality?
