      *   *Step 3: The Integrity Check.* Can you function as an agent if you give more? (Williams' point).
      *   *Step 4: The Escalation Clause.* If income doubles, does giving double? (The "no resting point" issue).
      *   *Step 5: The Handoff.* Acknowledging where philosophy ends and life begins.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Set the stage. Acknowledge the friend's argument.
      *   *The Protocol:* "The Marginal Integrity Protocol (MIP)."
      *   *The Steps:* Numbered, with specific questions.
      *   *Annotations:* Explicitly mark the "Judgment Calls."
      *   *Limitations:* What can't this do? (Solve the metaphysical problem).
