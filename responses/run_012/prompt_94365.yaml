  7.  **Addressing Specific Constraints:**
      *   *Too Hard vs. False:* Include a question asking, "If this feels impossible, is it because it's wrong, or because the world is broken?"
      *   *Marginal vs. Absolute:* Distinguish between "fun" money and "functioning" money.
      *   *Escalation:* Ask about future raises.
