      *   *The Reply:* "Too demanding" isn't "false." Ordinary morality also demands things (don't kill, don't steal) that are hard.
      *   *The Compromise (Satisficing/Rules of Thumb):* Give a significant portion (e.g., 10%, 33%, 50%) but stop before self-destruction.
      *   *The "Life Plan" Cutoff:* Where does obligation end and supererogation (going above and beyond) begin?

  3.  **Drafting the Procedure (The "Tool"):**
      *   *Goal:* 20 minutes. Needs to be a flowchart or script.
