      *   **Application:** Run the procedure on two specific donors:
          1.  Surgeon (high income, chronic illness/expensive comfort).
          2.  Teacher (modest income, two children).
      *   **Constraint:** Include one case where the procedure says something the advisor "does not want to hear."
