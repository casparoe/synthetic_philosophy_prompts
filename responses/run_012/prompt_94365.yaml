  # The Marginal Integrity Protocol (MIP)
  **Time Limit:** 20 Minutes
  **Target:** Donors without philosophy training
  **Goal:** Distinguish moral obligation from supererogation (going above and beyond) without pretending the line is mathematically precise.

  This protocol does not solve the demandingness objection. It operationalizes it. It forces the donor to locate their own "stopping point" and subjects that point to three stress tests derived from the debate: **The False/False Distinction**, **The Integrity Check**, and **The Escalation Clause**.

  ---

  ## Part 1: The Procedure

  ### Step 1: Establish the Biological and Social Floor (3 Minutes)
  *Goal: Separate absolute sacrifice from marginal sacrifice.*

  **Ask:** "If you gave away every dollar above this amount, would you lose your health, your ability to work, or your capacity to care for your dependents?"
  *   **Sufficient Answer:** A specific dollar figure covering housing, basic nutrition, healthcare, and dependent care.
  *   **The Distinction:** If the answer is "Yes, I would get sick," that is an **Absolute Sacrifice**. The protocol exempts this. Consequentialism generally does not demand self-destruction, as a dead agent helps no one.
  *   **[JUDGMENT CALL]:** You must decide if "healthcare" includes mental health maintenance or only acute treatment. *Default to acute treatment only.* This is where the theory bites.

  ### Step 2: The "Ground Projects" Inventory (5 Minutes)
  *Goal: Address the Integrity Objection (Bernard Williams).*

  **Ask:** "Beyond survival, what specific activities make you a functioning person rather than a donation machine? (e.g., seeing your children, practicing your profession, a specific hobby that keeps you sane)."
  **Ask:** "How much money does *that* require?"
  *   **Sufficient Answer:** A dollar figure attached to specific activities, not vague "happiness."
  *   **The Distinction:** Consequentialism treats your projects as one good among many. Ordinary morality treats them as *yours*. This step creates a temporary shield for them.
  *   **[JUDGMENT CALL]:** You must decide if their "project" is essential integrity or mere preference. *If they say 'vacation', classify as preference. If they say 'weekly therapy' or 'time with toddlers', classify as integrity.*

  ### Step 3: The False vs. Hard Test (5 Minutes)
  *Goal: Address the "Too Demanding" Objection.*

  **Say:** "Many people feel a moral rule is false because it is hard. If I told you that you were obligated to wake up at 5 AM to save a life, you might find it hard, but not false. Is your objection that giving this amount is *impossible*, or that it is *unfair*?"
  *   **Sufficient Answer:** They must admit whether the barrier is capacity (I can't) or resentment (I shouldn't have to).
  *   **The Distinction:** If it is capacity, return to Step 1. If it is resentment, proceed to Step 4. This preserves the distinction between a demand being **too hard** and it being **false**.

  ### Step 4: The Escalation Clause (5 Minutes)
  *Goal: Address the "No Resting Point" problem.*

  **Ask:** "If your income doubled next year, would your moral obligation double, or would it hit a ceiling?"
  *   **Sufficient Answer:** "It hits a ceiling."
  *   **The Rule:** If they say it hits a ceiling, ask: "Why is that ceiling moral truth and not just personal comfort?"
  *   **[JUDGMENT CALL]:** If they cannot justify the ceiling, **set the obligation at 20% of disposable income** (income above Step 1). *This number is arbitrary.* It is not derived from philosophy; it is a focal point to stop the infinite regress.
  *   **The Handoff:** If they argue the ceiling is based on the *kind of life* they want to lead, stop the calculation. Tell them: "Philosophy ends here. You have met the obligation of a 'good person.' Anything more is a choice about the 'saintly life.' That is not a matter of fact."

  ### Step 5: The Ordinary Morality Mirror (2 Minutes)
  *Goal: Address the "Ordinary Morality" Reply.*

  **Say:** "Ordinary morality demands you do not steal, even if stealing would make you happier. It demands you save your child from a pond, even if it ruins your shoes. We accept those costs. Why is the cost of giving money different?"
  *   **Outcome:** If they have no answer, the obligation stands. If they answer "Because money is earned time," accept it as a valid project defense (Step 2).

  ---

  ## Part 2: What This Procedure Cannot Do
  1.  **It cannot prove the theory is true.** It assumes consequentialism is the working model. If the donor rejects the premise, the math is irrelevant.
  2.  **It cannot solve the "No Resting Point."** Step 4 imposes an arbitrary ceiling (20%) to make the session endable. This is a pragmatic lie. Strict consequentialism has no ceiling.
  3.  **It cannot measure utility.** You are not calculating lives saved. You are calculating donor capacity.
  4.  **It cannot distinguish "Luxury" from "Necessity" objectively.** Step 1 and 2 rely on your judgment of their lifestyle.

  ---

  ## Part 3: Running the Protocol

  ### Case A: The Surgeon
  **Profile:** $450k/year income. Chronic autoimmune condition. Requires climate-controlled home, specific diet, and reduced hours to manage flare-ups. Single, no dependents.
  **Current Giving:** 5%.

  **Session Log:**
  *   **Step 1 (Floor):** She lists medical costs and housing. Her "basic needs" are 3x the national average due to her condition.
      *   *Advisor Note:* Is the climate control medical or comfort? **[JUDGMENT CALL]** I accept it as medical. If she flares, she cannot work. If she cannot work, she cannot earn to give.
  *   **Step 2 (Projects):** Her "project" is her surgery practice. She argues she needs downtime to maintain skill.
      *   *Advisor Note:* Accepted as Integrity.
  *   **Step 3 (False vs. Hard):** She admits she *could* give more, but feels it's unfair given her health burden.
      *   *Advisor Note:* This is resentment, not capacity. Proceed.
  *   **Step 4 (Escalation):** I ask if a $100k raise means $100k more giving. She says no. I apply the **20% Disposable Rule**.
      *   *Calculation:* $450k - $150k (Floor/Projects) = $300k Disposable. 20% = $60k/year.
  *   **Step 5 (Mirror):** She compares giving to her duty to patients.

  **Verdict:** **Obligation: $60,000/year (13% of gross).**
  **Analysis:** This feels low for a high earner, but the protocol protected her "health as capacity" argument. However, the **20% rule** is the weak point. Strict consequentialism would argue her "downtime" is a luxury compared to a stranger's life. The protocol smoothed this over to keep her engaged.

  ---

  ### Case B: The Teacher
  **Profile:** $55k/year income. Two children. Public school teacher. Rents apartment.
  **Current Giving:** $0. "I don't have anything to spare."

  **Session Log:**
  *   **Step 1 (Floor):** Rent, food, utilities, basic childcare. Total: $50k.
      *   *Advisor Note:* This leaves $5k surplus.
  *   **Step 2 (Projects):** "Being a present mother." She argues that working overtime to earn more to give would violate this project.
      *   *Advisor Note:* Accepted. But she is not working overtime; she is spending current surplus.
  *   **Step 3 (False vs. Hard):** She says, "It's false that I should give. I'm struggling."
      *   *Advisor Note:* I check the budget. She spends $300/month on cable/streaming and takeout.
      *   *The Distinction:* Is this **Marginal** (foregone holiday) or **Absolute** (health)? It is Marginal.
  *   **Step 4 (Escalation):** I ask if she gets a $2k raise, will she give? She says yes.
      *   *Advisor Note:* This admits there is a margin.
  *   **Step 5 (Mirror):** I ask if she would keep the $300/month if it meant a stranger died. She says, "That's dramatic." I reply, "Consequentialism says it is fact."

  **Verdict:** **Obligation: $3,600/year ($300/month).**
  **Analysis (The Unwanted Truth):** I do not want to tell a teacher with two kids that she is morally obligated to cut her family's entertainment budget to send money to strangers. It feels cruel. It validates the "demandingness" objection in a way that makes me dislike the theory. However, the procedure forces me to admit that **modest income is not zero income.** The distinction between "too poor to give" and "choosing to spend on self" is exposed. The protocol tells me I must ask her for $300/month. If I don't, I am privileging her comfort over the stranger's life without a philosophical justification, only an emotional one.

  ---

  ## Part 4: Post-Session Reflection for the Advisor

  **Where the Arithmetic was a Mask:**
  In the Surgeon's case, accepting her high "health floor" was a judgment call. In the Teacher's case, classifying streaming services as "marginal sacrifice" rather than "mental health maintenance for a stressed worker" was a judgment call. The math ($300 x 12) pretends to be objective, but it rests on your classification of their needs.

  **The "No Resting Point" Failure:**
  In both cases, I used the 20% cap or the "Floor" to stop the questioning. If the Surgeon asked, "Why 20%? Why not 80% of my disposable?" I would have no answer other than "You would quit donating." That is a pragmatic reason, not a moral one. The procedure hides the fact that consequentialism likely demands more than both of them are willing to give.

  **The Handoff Point:**
  For the Teacher, the handoff point was Step 3. Once she admitted the sacrifice was *marginal* (cable vs. malaria nets), the rest is not philosophy; it is willpower. For the Surgeon, the handoff was Step 2. Once we agreed her health was necessary for her agency, the rest is logistics.

  **Final Instruction:**
  When the donor asks, "Is this *enough*?"
  *   If they have met the **Floor + 20% Disposable**: Say "Yes, you have fulfilled the obligation of a moral agent in this system."
  *   If they ask, "Is it enough to save the world?": Say "No. Nothing you do is enough to save the world. That is not a failure of your giving; it is a feature of the world. Stop calculating. Start living."
