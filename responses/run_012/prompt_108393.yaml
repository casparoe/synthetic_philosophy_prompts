      *   *Impact:* "There is a definition of the universal." This means universals are intelligible.
      *   *Argument read:* Even if we can define 'Animal', that doesn't make it the *substance* of the man. It just means we can talk about it. The ontological status doesn't follow from definability.
      *   *Difficulty:* The translator's "formula" makes it sound like a physical component. "Account" clarifies it's about intelligibility vs. existence.

  10. **Drafting the Notes:**
      *   *Structure:* Follow the 7 questions sequentially but weave them into a coherent set of seminar notes.
      *   *Style:* Direct, analytical, avoiding "Aristotle says..." in favor of "The text argues..."
