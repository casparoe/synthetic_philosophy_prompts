      *   *Step 2:* Of what is universal the substance? All or none?
          *   Type: Logical dilemma based on Step 1.
      *   *Step 3:* Cannot be substance of all (would mean all are one).
          *   Type: Substantive Metaphysical Claim (Numerical unity follows substantial unity).
      *   *Step 4:* Substance is not predicated of a subject; Universal is predicated of a subject.
          *   Type: Definitional (Categories framework).
      *   *Step 5:* (The "But perhaps" move) Concession: Universal not substance *as essence*, but present *in* essence (e.g., Animal in Man).
          *   Type: Dialectical concession to an opponent (likely a Platonist or a modified realist).
      *   *Step 6:* Rebuttal: If universal is in essence, it is still substance of *that* thing. Leads to "Animal" being substance of Man *as peculiar to it*.
          *   Type: Reductio (repeats Step 1 problem).
      *   *Step 7:* Composition Argument: Substance cannot be composed of qualities (non-substances).
          *   Type: Substantive Metaphysical Claim (Priority of substance over quality).
      *   *Step 8:* Socrates Argument: If universal is substance, it is substance of Socrates + the universal itself (substance of two things).
          *   Type: Substantive Metaphysical Claim (Substance is unique/peculiar).

  4.  **Address Question 2: The "But perhaps..." Sentence:**
      *   *Concession:* To someone who says, "Okay, 'Man' isn't the *whole* substance of Socrates, but 'Animal' is part of the essence." Or perhaps to the view that universals constitute the *what-it-is* without being the *this*.
      *   *Why worse:* If 'Animal' is in the essence of 'Man', and essence is substance, then 'Animal' is substance of 'Man'. But 'Animal' is universal. So a universal is the substance of a particular kind. But then 'Animal' must be peculiar to 'Man' to be *the* substance, which contradicts it being universal (shared by horse, etc.).
      *   *Work of "as peculiar to it":* It highlights the contradiction. To be *the* substance of X, Y must belong *only* to X. If 'Animal' is the substance of 'Man', it must belong only to 'Man'. But it belongs to horses too. Contradiction.

  5.  **Address Question 3: Composition and Socrates Arguments:**
      *   *Composition:* If a universal (like 'Animal') is a quality or attribute present in the individual, then the individual is made of non-substances. But substances are ontologically prior to qualities.
      *   *Socrates:* If 'Man' is the substance of Socrates, and 'Man' is also a substance in its own right (as a universal), then 'Man' is the substance of two things (Socrates and Itself).
      *   *Independence:* They are cumulative. The first part attacks the *definition* (common vs. peculiar). The composition argument attacks the *ontological structure* (priority). The Socrates argument attacks the *relational structure* (one-to-one vs. one-to-many).
      *   *Why Composition here?* It targets the view that universals are constituents. If universals are constituents, are they substances or qualities? If qualities, substance is made of non-substance (absurd). If substances, we have infinite regress or unity problems.

  6.  **Address Question 4: Reconciling Categories and Metaphysics:**
      *   *Categories:* "Substance" is used analogically. Primary = Individual. Secondary = Species/Genus. Secondary are substances *because* they reveal the Primary.
      *   *Metaphysics:* Stricter sense. "Substance" = "This" (tode ti) and "Essence" (to ti en einai). Universals fail both.
      *   *Reconciliation:* Not a retreat, but a deepening. Categories is logical/grammatical (predication). Metaphysics is ontological (what exists fundamentally).
      *   *Definite answer:* Aristotle hasn't changed his mind on the *individual* being primary. He has tightened the definition of "substance" to exclude anything predicable. In Categories, "secondary substance" is a concession to language; in Metaphysics, he asks what *really* underlies.
      *   *Key distinction:* "Substance" in Categories allows predication (Secondary). "Substance" in Metaphysics VII excludes predication entirely.

  7.  **Address Question 5: Question-Begging Charge:**
      *   *Colleague's point:* Realists (Platonists) say universals exist *apart*. Aristotle assumes substance must be "peculiar to an individual."
      *   *Assessment:* The argument assumes substance = "what makes this *this*." If you define substance as "independent existence," a Platonist universal fits. If you define it as "individual essence," it doesn't.
      *   *Verdict:* It is question-begging *if* the opponent defines substance as "separate existence." It is valid *if* the debate is about what constitutes the being of *this* sensible object. Aristotle is arguing that universals cannot be the *ousia* (being) of sensible substances. He assumes the "this-ness" criterion.
      *   *Nuance:* The text says "substance of an individual is... peculiar to it." This is the pivot. If the student accepts this definition, the argument holds. If not, it begs the question.

  8.  **Address Question 6: The Medieval Distinction (Nature in itself):**
      *   *Distinction:* Nature (humanity) vs. Individuated Nature (Socrates).
      *   *Work in passage:* None. Aristotle doesn't have this distinction. He treats 'Man' as either a universal (predicated of many) or a particular (Socrates).
      *   *What would be needed:* Text would need to say "Man considered absolutely is neither one nor many." It doesn't.
      *   *Force if granted:* If nature is indifferent, it avoids the "common vs. peculiar" trap. But Aristotle would ask: Does this indifferent nature exist? If yes, is it one or many? If one, how is it in many? The argument retains force against the *existence* of such a nature as *substance*.

