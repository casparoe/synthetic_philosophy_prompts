prompt: |-
  I am writing the notes for the opening meeting of a graduate seminar on the problem of universals, and I have reached a passage that I can no longer read as though I were encountering it for the first time. The students will arrive fluent in the labels — realism, nominalism, conceptualism — and my aim is to get them out of the labels and into the argument. I should be grateful for your help in understanding the passage below, which I have copied verbatim from the translation I am using (Metaphysics VII.13, 1038b):

  'First, the substance of an individual is the substance which is peculiar to it and belongs to nothing else; whereas the universal is common; for by universal we mean that which by nature appertains to several things. Of what particular, then, will the universal be the substance? Either of all or of none. But it cannot be the substance of all; while, if it is to be the substance of one, the rest also will be that one; because things whose substance is one have also one essence and are themselves one. Again, substance means that which is not predicated of a subject, whereas the universal is always predicated of some subject. But perhaps although the universal cannot be substance in the sense that essence is, it can be present in the essence, as "animal" can be present in "man" and "horse." Then clearly there is in some sense a formula of the universal. It makes no difference even if there is not a formula of everything that is in the substance; for the universal will be none the less the substance of something; e.g., "man" will be the substance of the man in whom it is present. Thus the same thing will happen again; e.g. "animal" will be the substance of that in which it is present as peculiar to it. Again, it is impossible and absurd that the individual or substance, if it is composed of anything, should be composed not of substances nor of the individual, but of a quality; for then non-substance or quality will be prior to substance or the individual. Which is impossible; for neither in formula nor in time nor in generation can the affections of substance be prior to the substance, since then they would be separable. Again, a substance will be present in "Socrates," who is a substance; so that it will be the substance of two things.'

  And here, for contrast, is the sentence the students will all reach for, from the Categories (again quoted verbatim):

  "Substance, in the truest and primary and most definite sense of the word, is that which is neither predicable of a subject nor present in a subject; for instance, the individual man or horse. But in a secondary sense those things are called substances within which, as species, the primary substances are included; also those which, as genera, include the species."

  What I need is not a summary of the received reading but a reconstruction of the joins, and I would rather you told me where a step is genuinely disputed than that you smoothed it over. In particular:

  1. Lay out the argument of the first passage step by step. For each step, say whether it turns on the meaning of one of the terms — 'substance', 'universal', 'predicated of a subject' — or on a substantive metaphysical claim, and identify which claim.

  2. The sentence beginning 'But perhaps …' defeats me. Say what is being conceded, and to whom; why conceding it makes matters worse for the position rather than better; and what work the clause 'as peculiar to it' is doing in the sentence that follows.

  3. Explain the two arguments that come next — the one about a composite being composed of a quality rather than of substances, and the one about Socrates — and tell me whether they are independent of what precedes them or restatements of it. The composition argument in particular reads as though it were about what an individual substance is made of rather than about universals at all; say what it is doing in this chapter.

  4. Reconcile the two passages. In the Categories, species and genera are substances, albeit secondary ones, and primary substances are what is neither predicable of nor present in a subject; in the Metaphysics passage no universal is a substance, and substance is said to mean what is not predicated of a subject. Can the two be held together? If so, exactly which sense of 'substance' is at work in each, and is the later passage a refinement of the earlier doctrine or a retreat from it? I want to be able to say something definite to the student who concludes that Aristotle simply changed his mind.

  5. A colleague maintains that the argument is question-begging: it shows at most that a universal cannot be a primary substance, which nobody who believed in separately existing universals ever claimed. Assess that charge on the passage's own terms — does the argument reach universals that exist apart from their instances, or does it quietly assume that whatever is real must be a 'this'?

  6. Another colleague proposes that the passage falls into place once one imports a distinction familiar from later mediaeval discussions: between a nature considered in itself — neither universal nor singular, but indifferent to both — and that same nature as contracted to a singular instance by a principle of individuation. I want to know whether that distinction is doing any work in the passage or is being read into it; what the passage would have to say in order to engage it; and whether, granting the distinction, the argument retains any force.

  7. The translation I am using renders logos as 'formula' throughout ('a formula of the universal'; 'neither in formula nor in time nor in generation'). How much of the passage's difficulty is the translator's, and how does the argument read if logos is taken as 'account' or 'definition'?

  Please write this as notes I can work from, of whatever length the material requires, glossing technical terms as they come up rather than leaving them to carry the weight themselves. I do not want references or suggestions for further reading; assume that these two passages are all I have in front of me, and that anything you bring in from outside them has to be introduced in plain words.
