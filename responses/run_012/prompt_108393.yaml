answer: |-
  **Seminar Notes: Metaphysics VII.13 (1038b) and Categories 5**

  **Preliminary Glossary**
  *   **Substance (*ousia*):** In this context, roughly "what something really is" or "the fundamental reality of a thing."
  *   **Universal (*katholou*):** That which is by nature predicated of many subjects (e.g., "Man," "Animal").
  *   **Particular/Individual:** The specific instance (e.g., "Socrates," "This horse").
  *   **Predicated of a subject:** Said *of* something (e.g., "Socrates is a man").
  *   **Present in a subject:** Existing *in* something as an attribute, not as a part of its essence (e.g., "Socrates is white").
  *   **Logos:** Rendered here as 'formula'; better understood as 'account,' 'definition,' or 'rational structure.'

  ---

  ### 1. Reconstruction of the Argument (Step-by-Step)

  The text is not a single linear proof but a series of converging attacks on the claim that a universal can be substance.

  **Step 1: The Peculiarity Criterion**
  *   *Text:* "The substance of an individual is the substance which is peculiar to it and belongs to nothing else; whereas the universal is common..."
  *   *Analysis:* This turns on the **meaning of 'substance'**. Aristotle is defining substance in terms of *individuation*. To be the substance of *this* thing is to be what makes it *this* thing and not another.
  *   *Claim:* Substance = Peculiar/Unique. Universal = Common/Shared. These are logically incompatible descriptions for the same ontological role.

  **Step 2: The Dilemma of Scope**
  *   *Text:* "Of what particular, then, will the universal be the substance? Either of all or of none."
  *   *Analysis:* Logical consequence of Step 1. If 'Man' is a universal, and substance must be peculiar, which individual does 'Man' substantiate?
  *   *Claim:* A universal, by definition, applies to many. Substance, by definition (in this chapter), applies to one.

  **Step 3: The Unity Objection**
  *   *Text:* "But it cannot be the substance of all; while, if it is to be the substance of one, the rest also will be that one..."
  *   *Analysis:* This turns on a **substantive metaphysical claim**: Numerical unity follows substantial unity.
  *   *Claim:* If 'Man' is the *substance* of Socrates, and 'Man' is the *substance* of Callias, then Socrates and Callias share the *same substance*. If they share the same substance, they are numerically one thing. They are not. Therefore, the universal cannot be the substance of all.

  **Step 4: The Predication Criterion**
  *   *Text:* "Again, substance means that which is not predicated of a subject, whereas the universal is always predicated of some subject."
  *   *Analysis:* This turns on the **technical meaning of 'predicated'** (from the *Categories*).
  *   *Claim:* Substance is the ultimate subject (that which is never said *of* another). Universals are always said *of* subjects. Therefore, universals cannot be substances.

  **Step 5: The "But Perhaps" Concession (See Section 2 below)**

  **Step 6: The Composition Argument**
  *   *Text:* "Again, it is impossible and absurd that the individual or substance... should be composed not of substances nor of the individual, but of a quality..."
  *   *Analysis:* This turns on a **substantive metaphysical claim regarding ontological priority**.
  *   *Claim:* Substances are prior to qualities (affections). A whole cannot be constituted by elements that are ontologically inferior to it. If universals are treated as qualities or attributes present in the individual, the individual (a substance) would be made of non-substances.

  **Step 7: The Socrates Argument**
  *   *Text:* "Again, a substance will be present in 'Socrates,' who is a substance; so that it will be the substance of two things."
  *   *Analysis:* This turns on the **meaning of 'substance of'**.
  *   *Claim:* If the universal 'Man' is a substance, and it is also the substance of Socrates, then 'Man' performs the role of substance twice (for itself and for Socrates). This violates the uniqueness required of primary reality.

  ---

  ### 2. The "But Perhaps..." Passage

  **Text:** *"But perhaps although the universal cannot be substance in the sense that essence is, it can be present in the essence, as 'animal' can be present in 'man' and 'horse.'"*

  **The Concession:**
  Aristotle is anticipating an objection from a realist (perhaps a Platonist or a moderate realist). The opponent concedes Step 4 (a universal is predicated, so it isn't the *primary* substance in the strictest sense) but tries to save the universal's ontological weight.
  *   *The Move:* The opponent suggests the universal is not the *whole* substance, but a *constituent* of the essence. 'Animal' is part of what 'Man' is. It is "present in" the essence, not as an accident (like 'white'), but as a generic component.

  **Why This Makes Matters Worse:**
  Aristotle accepts this temporarily to show it leads to the same contradiction as Step 1.
  *   *The Trap:* If 'Animal' is present in the essence of 'Man', and the essence is the substance, then 'Animal' is functioning as the substance of 'Man'.
  *   *The Clause "as peculiar to it":* In the following sentence (*"e.g. 'animal' will be the substance of that in which it is present as peculiar to it"*), Aristotle forces the universal back into the "Peculiarity Criterion" from Step 1.
  *   *The Logic:* To be the substance of 'Man', 'Animal' must be what makes 'Man' what it is. But 'Animal' is also the substance of 'Horse'. If 'Animal' is the substance of 'Man' *in the sense of essence*, it must belong peculiarly to 'Man'. But it belongs to 'Horse' too.
  *   *Result:* The concession fails. Even if the universal is only *part* of the essence, it still claims to be substance. If it is substance, it must be peculiar. If it is peculiar, it cannot be universal. The opponent cannot have it both ways.

  ---

  ### 3. The Composition and Socrates Arguments

  **The Composition Argument:**
  *   *Content:* An individual substance (like Socrates) cannot be made of universals if those universals are treated as qualities.
  *   *Function in Chapter:* This targets the view that universals are *constituents* of reality. If you say Socrates is composed of 'Man' + 'Animal' + 'Biped', you are saying Socrates is composed of universals.
  *   *Is it Independent?* It is distinct from the "Predication" argument (Step 4). Step 4 argues from logic (grammar of predication). This argues from ontology (mereology/composition).
  *   *Why here?* It blocks the retreat. Having failed to show the universal *is* the substance (Step 1-5), the opponent might say the universal is a *part* of the substance. Aristotle says: If that part is not itself a substance (i.e., if it's a quality/universal), then the whole (Socrates) is made of non-substances. But substances cannot be built from non-substances.

  **The Socrates Argument:**
  *   *Content:* If 'Man' is a substance, and 'Man' is in Socrates, then 'Man' is the substance of Socrates. But 'Man' is also a substance in its own right. So 'Man' is the substance of two things (Itself and Socrates).
  *   *Is it Independent?* It is a restatement of the "Unity Objection" (Step 3) but focused on the *relation* rather than the identity.
  *   *Function:* It highlights the absurdity of the "substance of" relation. Substance is supposed to be the ultimate floor. If the floor itself rests on another floor (the universal substance), or if one floor supports two different buildings, the structure collapses.

  ---

  ### 4. Reconciling *Categories* and *Metaphysics*

  **The Tension:**
  *   *Categories:* Primary Substance = Individual (Socrates). Secondary Substance = Species/Genus (Man, Animal). Both are called "substance."
  *   *Metaphysics VII.13:* No universal is substance. Substance is not predicated of a subject.

  **Reconciliation:**
  The texts can be held together if we recognize a shift in the **sense of 'substance'** being tested.
  1.  **Categories (Logical/Grammatical Focus):** Aristotle is classifying terms. "Man" is a substance-term because it tells us *what* Socrates is, not *how* he is qualified (like "white"). It is "secondary" because it depends on the primary (individual) for its existence. It is a *concession to language*.
  2.  **Metaphysics (Ontological Focus):** Aristotle is asking what *fundamentally exists*. Here, "substance" is tightened to mean "independent reality" and "essence."
      *   In *Metaphysics*, the definition "not predicated of a subject" is applied strictly. Since 'Man' is predicated of Socrates, 'Man' fails the test for *primary* substance.
      *   Unlike the *Categories*, the *Metaphysics* does not offer a "secondary" category to save the universal. It simply excludes it from substancehood.

  **Refinement or Retreat?**
  It is a **refinement**, not a retreat.
  *   *To the Student:* Aristotle has not changed his mind that Socrates is more real than 'Man'. In the *Categories*, he allowed 'Man' to be called 'substance' loosely (secondary). In the *Metaphysics*, he is purifying the concept. He is saying: "If we mean by 'substance' the ultimate reality, we cannot allow anything predicable to count. The *Categories* distinction was useful for logic; the *Metaphysics* distinction is required for truth."
  *   *Definite Answer:* The *Metaphysics* passage restricts the term 'substance' to the *Categories'* 'Primary Substance' (and eventually Form), explicitly revoking the 'Secondary Substance' status of universals.

  ---

  ### 5. Assessing the "Question-Begging" Charge

  **The Charge:** The argument assumes substance must be "peculiar to an individual." A Platonist believes universals exist *apart* and are substances in their own right, not as substances *of* individuals.

  **Assessment on the Text's Terms:**
  *   **Valid Point:** The argument *does* assume that the substance of a sensible object (Socrates) must be peculiar to that object. If a Platonist says "The Form of Man exists separately and is a substance," Aristotle's argument here ("It cannot be the substance of all...") attacks the relation between the Form and the Individual, not the Form's independent existence directly.
  *   **Where it Begs:** In Step 1 ("substance of an individual is... peculiar to it"). A realist denies this. They say the substance of Socrates is 'Man', which is shared.
  *   **Where it Holds:** In Step 6 and 7. Even if the universal exists apart, if it is to be the substance *of Socrates*, it faces the "substance of two things" problem.
  *   **Verdict:** The argument is not a proof against separately existing universals *per se*; it is a proof that **universals cannot be the substance *of sensible particulars*.**
  *   **Instruction:** Tell the student: "Aristotle is not arguing that universals don't exist. He is arguing that they cannot play the role of *ousia* (being) for *this* man here. If you define substance as 'independent existence,' the argument begs the question. If you define substance as 'what makes this individual what it is,' the argument holds."

  ---

  ### 6. The Medieval Distinction (Nature in Itself)

  **The Distinction:** A nature (e.g., Humanity) considered absolutely is neither universal nor singular. It becomes singular in Socrates and universal in the mind.

  **Does it appear in the passage?**
  *   **No.** There is no textual evidence for this distinction here. Aristotle treats 'Man' as either a universal (predicated of many) or a particular (Socrates). He does not posit a third state ("Humanity in itself").
  *   **What would be required:** The text would need to distinguish between 'Man as predicated' and 'Man as a nature'. It does not. It treats 'Man' as a single logical entity that is by nature "common."

  **Does the argument retain force if we grant the distinction?**
  *   **Yes.** Even if 'Humanity' is indifferent in itself, the moment it exists in reality, it must be either one or many.
      *   If it exists in Socrates, is it *the* substance of Socrates?
      *   If yes, does it also exist in Callias?
      *   If it is numerically one in both, we have the Unity Problem (Step 3: Socrates and Callias are one).
      *   If it is numerically distinct in both, it is no longer a universal, but a particular.
  *   **Instruction:** The medieval distinction solves the *logical* problem of how we predicate, but it does not solve Aristotle's *ontological* problem of how one reality can be the being of multiple distinct individuals without collapsing their individuality.

  ---

  ### 7. Translation Note: *Logos* ('Formula' vs. 'Account')

  **The Difficulty:**
  "Formula" suggests a static, almost mathematical string. This makes the sentence *"there is in some sense a formula of the universal"* sound trivial (of course there's a definition).

  **If read as 'Account' or 'Definition':**
  *   *Meaning:* We can give an *account* of what 'Animal' is. It is intelligible.
  *   *Argument Flow:* The opponent says: "Surely 'Animal' is in the essence, because we can define it." Aristotle replies: "Having a definition (*logos*) does not make it substance."
  *   *Impact on Difficulty:* It clarifies that the dispute is not about whether we can *talk* about universals (we can), but whether that intelligibility grants them ontological status as *substance*.
  *   *Recommendation:* In seminar, suggest reading *logos* as "definable account." The point is: **Definability $\neq$ Substantiality.** Just because we can define 'Man' doesn't mean 'Man' is the fundamental reality of Socrates. The translation "formula" obscures this by making it sound like a component part rather than a conceptual account.

  ---

  **Summary for the Opening Meeting:**
  Do not let the students settle on "Aristotle is a Nominalist." The text shows him wrestling with the tension between **intelligibility** (which requires universals) and **reality** (which requires individuals). The argument is not that universals are fake, but that they cannot be the *primary reality* of the things we encounter. The *Categories* gives us the map of language; the *Metaphysics* demands the map of being. They do not match perfectly, and this passage is where Aristotle forces them to diverge.
