answer: |-
  ### Move-by-Move Verdicts

  **Move 1 (Devi): Darwinism requires copying; culture is reconstruction.**
  *   **Verdict:** Right but overstated.
  *   **Justification:** Devi is correct that cultural transmission is predominantly reconstructive (guided by cognitive biases) rather than replicative (template copying). However, she is technically wrong that Darwinian processes *require* high-fidelity copying; they require *heritability* (statistical correlation between parent and offspring traits). Biological mutation makes genetic copying "leaky" too. Her observation about culture is accurate, but her definition of Darwinism is too narrow.

  **Move 2 (Owen): Difference is fidelity, not kind; weak heritability allows weak selection.**
  *   **Verdict:** Right.
  *   **Justification:** This is the standard quantitative genetics position. Heritability is a statistical measure ($h^2$), not a binary switch. As long as there is a non-zero correlation between the trait of the "teacher" and the "learner," selection can act, even if the transmission mechanism is noisy.

  **Move 3 (Devi): Resemblance due to shared mind (attractors), not ancestor; descent explains nothing.**
  *   **Verdict:** Right.
  *   **Justification:** This is the core insight of Cultural Attractor Theory. If cognitive constraints force all learners toward the same outcome regardless of input, phylogenetic history (who learned from whom) becomes irrelevant to explaining the *form* of the trait. Descent ceases to be the causal driver.

  **Move 4 (Owen): Selection acts on the practice (meme), not the host; reconstruction doesn't change this.**
  *   **Verdict:** Right.
  *   **Justification:** Owen correctly identifies that evolutionary theory allows for units of selection other than the organism (e.g., genes, memes). A trait can spread despite being maladaptive for the carrier if it enhances its own transmission. This logic holds regardless of whether the transmission is copying or reconstruction.

  **Move 5 (Devi): Reconstruction creates fixed points, not lineages; predicts convergence, not descent.**
  *   **Verdict:** Right.
  *   **Justification:** Devi correctly identifies the divergent predictions. A lineage-based model predicts that traits will cluster by historical contact (phylogenetic signal). An attractor-based model predicts that traits will cluster by cognitive stability, even across unrelated populations. These are empirically distinguishable.

  **Move 6 (Owen): Convergence is just a steep adaptive landscape; evolution does this constantly.**
  *   **Verdict:** Wrong application.
  *   **Justification:** In biology, convergence occurs when *distinct lineages* face similar *selection pressures*. Owen is conflating "selection pressure" with "cognitive constraint." If the joke arises independently without contact (as Devi claims), there is no lineage to traverse the landscape. Owen is trying to absorb a non-Darwinian mechanism (independent invention via constraint) into a Darwinian framework by redefining the landscape, which muddies the causal explanation.

  **Move 7 (Devi): Independent origin of same joke form in separate kitchens.**
  *   **Verdict:** Right (empirically plausible).
  *   **Justification:** Folklore and urban legends frequently demonstrate polygenesis (independent invention). If the form is dictated by memory constraints and humor structures, identical forms can emerge without transmission. This supports the attractor model over the lineage model.

  **Move 8 (Owen): Descent supplies initial conditions; reconstruction supplies dynamics; division of labour.**
  *   **Verdict:** Right but concessive.
  *   **Justification:** Owen retreats to a pluralistic view. He is right that both factors likely operate, but this concedes Devi's main point: that the Darwinian (descent) part is not sufficient to explain the *content* or *form* of the culture. It admits the Darwinian framework is incomplete.

  **Move 9 (Devi): If a framework needs bolting on to work, say that out loud.**
  *   **Verdict:** Right.
  *   **Justification:** A methodological victory. If "Darwinian" requires a "Reconstructive" addendum to handle the actual data, labeling the whole process "Darwinian" risks obscuring the primary causal mechanism (cognitive reconstruction).

  ---

  ### Substantive or Verbal?

  The disagreement is **mostly substantive**, masked by verbal ambiguity.

  1.  **Heritability:** There is a verbal shift here. Devi treats heritability as *copying fidelity* (template replication). Owen treats it as *statistical correlation*. Owen is using the biologically correct definition, but Devi is pointing out that the *mechanism* generating that correlation in culture is fundamentally different from biology.
  2.  **Selection:** They agree on the definition (differential persistence), but disagree on the *unit*. Owen focuses on the trait (meme); Devi focuses on the lineage.
  3.  **The Core Substantive Clash:** The real fight is over **causal weight**. Owen argues that population-level dynamics (selection/drift) are the primary explanation for cultural stability and change. Devi argues that individual-level cognitive mechanics (reconstruction/attractors) are the primary explanation for cultural *form*, and that population dynamics are secondary.

  When Owen says "convergence is a steep landscape," he is trying to verbalize Devi's substantive point (cognitive constraints) into his substantive framework (selection). This fails because a landscape implies a path taken over time; Devi's joke example implies the destination is reached immediately without a path.

  ---

  ### Who Has the Better of It?

  **Devi has the better of the argument.**

  While Owen is technically correct that population-level statistical patterns can emerge from low-fidelity transmission (and thus a "Darwinian" math can be applied), Devi successfully demonstrates that the *label* "Darwinian" is misleading regarding the *causal mechanism*.

  Owen is forced into a defensive retreat by Move 8, admitting that descent only supplies "initial conditions" while reconstruction handles the "dynamics." If reconstruction determines the final form regardless of the initial condition (as the joke example suggests), then the Darwinian component (descent) is doing very little explanatory work. Devi wins because she forces Owen to admit that the Darwinian framework cannot stand alone; it requires the "bolted on" cognitive framework to explain the interesting features of culture (why jokes look the way they do). Owen defends the *math* of evolution; Devi defends the *biology* of the transmission mechanism. In a debate about whether culture is a Darwinian *process*, the mechanism matters more than the statistical outcome.

  ---

  ### What Both Are Missing

  1.  **The Spectrum of Fidelity:** Both treat "culture" as a monolith. They agree (implicitly) that all cultural transmission is like joke-telling. In reality, culture ranges from low-fidelity (gossip, jokes) to high-fidelity (rituals, technical recipes, written text). Owen's Darwinism works better for high-fidelity domains; Devi's Attractor theory works better for low-fidelity domains. They should be arguing about *which* cultural domains are Darwinian, not whether culture *is* Darwinian.
  2.  **Niche Construction:** Both ignore that humans actively modify their environments to stabilize transmission (writing, recording, institutions). These modifications *create* high-fidelity lineages where none existed naturally. Owen assumes the channel is leaky; Devi assumes the channel is reconstructive. Neither accounts for how we *fix* the channel to make it Darwinian.
  3.  **False Agreement on "Selection":** They both assume selection is the only evolutionary force. They ignore **drift**. In small groups (like their discussion circle), random fluctuation might explain cultural change better than either selection or attractors.

  ---

  ### Concrete Observation to Settle the Dispute

  The dispute can be settled by a **Transmission Chain vs. Independent Generation experiment**.

  **The Experiment:**
  1.  **Condition A (Lineage):** Create a chain of 10 participants. Person 1 learns a complex story. They recall it to Person 2, who recalls it to Person 3, and so on.
  2.  **Condition B (Attractor):** Take 10 *new* participants. Give them only the *gist* or prompt of the original story (or nothing at all, just the genre) and ask them to invent a story from scratch.
  3.  **Analysis:** Compare the final story from Condition A (Generation 10) with the stories from Condition B.

  **The Verdict:**
  *   **If Owen is right:** Condition A stories should retain unique historical markers (specific phrasing, errors, or arbitrary details) from the original that Condition B stories do not have. Descent leaves a signature.
  *   **If Devi is right:** Condition A and Condition B stories will be statistically indistinguishable in form and content. The "reconstruction" process wipes out the historical signal so quickly that independent invention produces the same result as transmission.

  *Current Evidence:* Existing experiments (e.g., by Claidière, Sperber, and Griffiths) suggest **Devi is mostly right** for narrative content: transmission chains rapidly converge toward cognitive attractors, losing historical signal. However, **Owen is right** for arbitrary details (like specific names or numbers) where no cognitive bias exists—those track lineage. The experiment would quantify the ratio, settling the "division of labour" argument objectively.
