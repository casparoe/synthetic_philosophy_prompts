answer: |-
  Here are the desiderata for an adequate theory of supererogation, structured by the phenomena they must capture, followed by an analysis of their status and their logical compatibility.

  ### Part I: The Desiderata List

  **1. The Betterness Condition**
  *   **Requirement:** The theory must allow for an act to be morally better than the act required, without the better act becoming required.
  *   **Case/Consideration:** The Saint vs. The Saintly. If Agent A gives 10% of their income to charity (required) and Agent B gives 90% (supererogatory), B's act must register as having higher moral value than A's, yet A must not be deemed immoral or deficient for stopping at 10%.
  *   **User Constraint:** *An act that is genuinely optional yet morally better than the act one was required to perform.*

  **2. The Omission Immunity Condition**
  *   **Requirement:** The omission of a supererogatory act must not attract blame, sanction, guilt, or moral criticism.
  *   **Case/Consideration:** The Drowning Child (Shallow Pond). If I walk past a shallow pond to save a child at the cost of ruining my shoes, I am blameworthy (duty). If I dive into a stormy sea to save a stranger at the risk of my life, I am praiseworthy if I do, but not blameworthy if I don't. The line between "ruined shoes" and "risk of life" must mark the boundary between blame and immunity.
  *   **User Constraint:** *The blamelessness of simply not doing it.*

  **3. The Costless Surplus Condition**
  *   **Requirement:** The theory must account for acts that generate significant moral good at negligible cost to the agent, yet remain optional.
  *   **Case/Consideration:** The Easy Button. An agent can press a button that cures a distant disease with zero effort, zero time, and zero financial cost. If this is *required*, supererogation shrinks. If it is *optional*, the theory must explain why rational morality permits ignoring costless good.
  *   **User Constraint:** *An act that costs the agent nothing and still counts as going beyond.*

  **4. The Collective Fragment Condition**
  *   **Requirement:** The theory must explain how an individual can be excused from completing a moral good when their contribution is only a fragment of the total necessary causal chain, even if that fragment is easy to provide.
  *   **Case/Consideration:** The Bucket Brigade. A fire needs 1,000 buckets of water to be put out. There are 1,000 people present. Each person is needed to complete the good, but no single person can complete it alone. If I refuse to pass my bucket, have I violated a duty, or is my contribution merely supererogatory because the success of the act depends on others?
  *   **User Constraint:** *Two agents who can each contribute only a fragment of a good that neither is required to complete.*

  **5. The Historical Plasticity Condition**
  *   **Requirement:** The boundary between duty and supererogation must be able to shift over time based on social capacity, technology, or expectation, without implying that moral truth itself is arbitrary.
  *   **Case/Consideration:** The Organ Donor. Fifty years ago, donating a kidney to a stranger was heroic (beyond duty). Today, with safer procedures and normalized expectations, some argue it is approaching duty. The theory must explain how an act changes deontic status without the *act itself* changing.
  *   **User Constraint:** *The drift by which what was once beyond duty becomes duty as it grows easier.*

  **6. The Agent-Centric Optionality Condition**
  *   **Requirement:** The optionality must be valid from the agent's perspective, not just an observer's. The agent must be able to choose the lesser good without practical irrationality.
  *   **Case/Consideration:** The Prudent Life. An agent chooses to write a novel rather than volunteer at a soup kitchen. The soup kitchen produces more net utility. The theory must validate the novel-writing as a permissible moral option, not a moral failure disguised as prudence.

  **7. The Praise Entitlement Condition**
  *   **Requirement:** Performing the act must merit positive moral appraisal (praise, honor, reward) distinct from the neutral appraisal of merely doing one's duty.
  *   **Case/Consideration:** The Medal of Honor. We do not give medals for paying taxes (duty). We give medals for running into burning buildings (supererogation). The theory must justify this differential treatment.

  ***

  ### Part II: Categorization of Requirements

  Here we separate the constitutive features of the concept from the theoretical commitments of specific schools of thought.

  **Non-Negotiable (Constitutive of the Concept)**
  *If you deny these, you are not theorizing supererogation; you are eliminating the category.*
  1.  **The Betterness Condition:** Without this, the act is merely permissible, not *beyond the call*.
  2.  **The Omission Immunity Condition:** Without this, the act collapses into duty (if omission is blameworthy) or forbidden (if the act itself is blameworthy).
  3.  **The Praise Entitlement Condition:** Without this, there is no functional difference between duty and supererogation in social practice.

  **Prejudices (Theoretical Commitments)**
  *These are often treated as requirements, but they belong to specific moral frameworks and cause the "box collapsing" problem.*
  1.  **The Costless Surplus Condition:** This is a **Consequentialist/Utilitarian Prejudice** turned on its head. Most traditional accounts (Urmson, Heyd) define supererogation *by* sacrifice. Insisting that costless acts can be supererogatory is a specific intuition that fights against the principle of rational optimization.
  2.  **The Historical Plasticity Condition:** This is a **Sociological/Pragmatic Prejudice**. Deontological and Objective Consequentialist views often hold that duty is static (based on rationality or objective value). Accepting plasticity requires a theory where duty is partially constituted by social expectation or feasibility, which many realists reject.
  3.  **The Collective Fragment Condition:** This is a **Non-Ideal Theory Prejudice**. In ideal theory, if the good is required, the necessary means are required. Insisting on optionality here requires a specific theory of "fair shares" or "cooperative obligation" that not all theories accept.

  ***

  ### Part III: The Incompatibilities

  You asked for the pairs that cannot be jointly satisfied. These are the logical fault lines where the "beyond the call" box collapses.

  **1. The Rationality Trap (Costless Surplus vs. Moral Optimization)**
  *   **The Pair:**
      *   (A) *The Costless Surplus Condition:* An act that costs nothing and produces good can be supererogatory (optional).
      *   (B) *The Principle of Moral Optimization:* If an agent can produce more good at no cost to themselves, they are rationally and morally required to do so.
  *   **The Conflict:** These are logically inconsistent. If (B) is true, any costless good act is mandatory. If (A) is true, (B) must be false.
  *   **The Collapse:** If you keep (B) (as most maximizing theories do), the "Costless Surplus" box collapses into **Required**. If you keep (A), you must argue that morality permits irrationality (ignoring costless good), which undermines the normative force of ethics.
  *   **Verdict:** You cannot have costless supererogation without abandoning the principle that morality tracks rational optimization of value.

  **2. The Objectivity Trap (Betterness vs. Omission Immunity)**
  *   **The Pair:**
      *   (A) *The Betterness Condition:* Act X (supererogatory) is objectively morally better than Act Y (required).
      *   (B) *The Omission Immunity Condition:* Choosing Y over X attracts no blame.
  *   **The Conflict:** If morality is objective and action-guiding, it guides agents toward the *best* available outcome. If X is objectively better than Y, morality *should* guide the agent to X. If morality guides to X, omitting X is a failure of guidance, warranting criticism.
  *   **The Collapse:** To save both, you must sever the link between "Objective Moral Value" and "Deontic Obligation." You must argue that an act can be *more valuable* without being *more obligatory*.
  *   **Verdict:** These can only be jointly satisfied by a **Dual-Ranking Theory** (one scale for value, one for obligation). If your theory uses a single scale (e.g., pure Utilitarianism), this pair is incompatible, and the box collapses into **Required**.

  **3. The Stability Trap (Historical Plasticity vs. Objective Duty)**
  *   **The Pair:**
      *   (A) *The Historical Plasticity Condition:* Duty expands as acts become easier/more normalized.
      *   (B) *Moral Realism:* Moral duties are determined by facts (harm, rights, rationality) independent of social expectation.
  *   **The Conflict:** If duty is based on objective facts (e.g., "suffering is bad"), the ease of alleviating suffering changes the *cost*, but not necessarily the *obligation structure*. If social normalization alone turns a supererogatory act into a duty, then duty is partially constituted by popularity or habit.
  *   **The Collapse:** If you hold (B), the "Drift" is an illusion; we were always either required to do it or not, and social pressure is just noise. If you hold (A), you concede that duty is socially relative.
  *   **Verdict:** These are incompatible under strict Moral Realism. To satisfy both, you must adopt a **Constructivist** view where duty is partially determined by social feasibility and expectation.

  ### Summary Recommendation for Your Procedure

  If you want to stop the third box from collapsing, you must explicitly **reject The Principle of Moral Optimization** (Incompatibility 1) and **adopt a Dual-Ranking System** (Incompatibility 2).

  If you attempt to keep "Maximize Good" and "Single Moral Scale" while also wanting a "Beyond the Call" box, the procedure will fail. The "Costless Surplus" case is the wedge that will break your system; if you cannot explain why a costless good act is optional, the box will inevitably snap shut and become "Required."
