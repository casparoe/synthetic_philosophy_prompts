answer: |-
  Here is the requirements list for an account of causation by omission, followed by the analysis of tensions and satisfiability you requested.

  ### The Requirements List

  **1. The Discrimination Constraint**
  *   **The Case:** The Gardener, the Neighbour, and the Stranger. The gardener's failure to water kills the plant. The neighbour's failure does not. The stranger's in another country definitely does not.
  *   **The Requirement:** The account must distinguish between *relevant* omissions and *irrelevant* non-occurrences without arbitrary stipulation.
  *   **What Forces It:** The need for **explanatory relevance**. If every non-occurrence that is counterfactually linked to an effect counts as a cause, causation becomes profligate (everything causes everything). A theory that cannot filter the Stranger's inaction fails to map onto our use of causal claims to explain *why* things happened rather than merely describing conditions.

  **2. The Ontological Symmetry Constraint**
  *   **The Case:** Pushing a man into the river vs. Not throwing him a rope.
  *   **The Requirement:** The account must specify whether omissions are causally identical to commissions (positive actions) or a distinct ontological category.
  *   **What Forces It:** **Legal and moral parity.** In many contexts (tort law, ethics), killing and letting die are treated differently, yet in others, they are treated the same. A causal theory must explain whether this difference is *in the causation* or merely in the *responsibility*. If the theory says they are metaphysically identical, it must explain why we treat them differently. If it says they are distinct, it must explain how "nothing" can relate to "something."

  **3. The Modal Capacity Constraint**
  *   **The Case:** The Drowning Swimmer. I do not throw the rope.
  *   **The Requirement:** The account must handle the condition that the omitters *could have done otherwise*. If I was physically restrained from throwing the rope, my "omission" is not a cause.
  *   **What Forces It:** **The logic of ability.** Causation by omission seems to presuppose agency or capacity. An account that treats omissions as mere absences fails to capture the intuition that an inability to act negates causal responsibility. The theory must integrate modal facts (what was possible) into the causal relation.

  **4. The Non-Agential Absence Constraint**
  *   **The Case:** The Missing Rock. A rock that usually blocks a river channel is removed (or never existed), allowing a flood.
  *   **The Requirement:** The account must handle absences of objects or states, not just failures of agents.
  *   **What Forces It:** **Scientific practice.** Geologists, engineers, and doctors cite absences as causes routinely ("the failure of the strut," "the lack of oxygen," "the vacuum"). An account restricted to human agency cannot serve as a general theory of causation. It must explain how a "nothing" (the missing rock) exerts causal influence without positing spooky "negative entities."

  **5. The Normative Sensitivity Constraint**
  *   **The Case:** The Lifeguard vs. The Bystander. Both fail to save the swimmer. We judge the Lifeguard's omission as a cause of death more readily than the Bystander's.
  *   **The Requirement:** The account must explain why causal judgments shift when normative expectations (duties, functions, norms) change, even if the physical facts remain identical.
  *   **What Forces It:** **Empirical data on folk psychology.** Experiments show that people's willingness to attribute causation tracks normative status. A theory that treats causation as purely descriptive/physical cannot explain why adding a contract (making someone a Lifeguard) changes the causal structure of the event.

  **6. The Theoretical Integration Constraint**
  *   **The Case:** General Causal Theory.
  *   **The Requirement:** The account of omission must follow from the general theory of causation (counterfactual, process, interventionist, etc.), not function as a special annex.
  *   **What Forces It:** **Theoretical parsimony.** We cannot have one metaphysics for actions and another for omissions. If your general theory is "energy transfer," it must explain omissions without energy transfer. If it is "counterfactual dependence," it must handle omissions without generating profligacy (see Constraint 1). Bolt-on solutions indicate the general theory is false.

  ***

  ### The Incompatible Pair

  **Normative Sensitivity (5) vs. Theoretical Integration with Objective Metaphysics (6)**

  These two cannot be met simultaneously if your "General Theory" (from Req 6) assumes causation is a mind-independent, objective relation in the world (like energy transfer or brute counterfactual dependence).

  *   **Why:** Norms (duties, expectations, contracts) are mind-dependent, context-sensitive, and variable. Objective metaphysical relations are not. If causation is sensitive to norms (Req 5), then causation is partially constituted by our perspectives or social structures. If causation is an objective feature of the universe (Req 6), it cannot turn on whether the agent signed a contract (the Lifeguard case).
  *   **The Conflict:** To satisfy Normative Sensitivity, you must make causation pragmatic or interest-relative. To satisfy Theoretical Integration with standard physicalist metaphysics, you must make causation objective. You must choose: either omissions aren't "real" causes in the physical sense (saving objectivity but losing normative sensitivity), or causation is not purely physical (saving sensitivity but losing standard metaphysical integration).

  ### The Killer Requirement

  **The Discrimination Constraint (1)**

  This requirement rules out the most otherwise plausible accounts.

  *   **It kills Process/Conservation Theories:** These theories (e.g., Salmon, Dowe) define causation as the transfer of a conserved quantity (energy/momentum). An omission involves no transfer. To satisfy Discrimination, these theories must say the Gardener *didn't* cause the death. This contradicts the core intuition of the Gardener case.
  *   **It kills Naive Counterfactual Theories:** These theories (e.g., early Lewis) define causation as counterfactual dependence. The Stranger's failure *is* counterfactually linked (if the Stranger had teleported and watered it, the plant would live). To satisfy Discrimination, the theory must restrict counterfactuals. But once you restrict them to save the Gardener case, you often break the analysis for standard positive causation, violating Theoretical Integration (6).
  *   **It kills Simple Interventionism:** While interventionism handles agency well, it struggles to define the "intervention" on an omission without implicitly importing norms to select *which* intervention counts, again circling back to the Normative Sensitivity problem.

  ### The Unsatisfiability Verdict

  **The list is unsatisfiable.**

  You cannot satisfy all six requirements simultaneously. Specifically, you cannot maintain **Theoretical Integration with a physicalist metaphysics** while satisfying **Discrimination** and **Normative Sensitivity**.

  *   If you treat omissions as real causal relata (to satisfy Integration and Symmetry), you face the **Profligacy Problem** (violating Discrimination): there are too many absences for any physicalist filter to sort the Gardener from the Stranger without importing norms.
  *   If you import norms to solve Discrimination (satisfying Normative Sensitivity), you violate the idea that causation is a mind-independent physical relation (violating Objective Integration).
  *   If you deny omissions are causes at all (the "Beebee" solution), you satisfy Objectivity and Discrimination (nothing causes anything), but you violate the core intuition of the Gardener case and Scientific Practice (Non-Agential Absence).

  **Conclusion:** Any account you commit to will require sacrificing one of these constraints. The most common move in contemporary metaphysics is to sacrifice **Ontological Symmetry** or **Objective Integration**, admitting that causation by omission is a distinct, perhaps pragmatic or normative, relation compared to causation by production. If you demand a unified, objective, physicalist theory, you must deny that omissions are causes.
