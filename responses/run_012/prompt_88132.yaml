answer: |-
  No, a lottocratic assembly is not automatically more legitimate than an elected legislature because descriptive representation alone does not fulfill the democratic requirements of accountability and authorization. To correct your argument, you should explicitly give up the step claiming that the assembly's deliberated conclusions are identical to what the citizenry would conclude if equally well-informed. While the law of large numbers ensures the assembly is a descriptive microcosm of the population's demographics and initial preferences, it does not guarantee that their internal deliberation processes will replicate the hypothetical deliberation of the entire populace, as small groups are susceptible to distinct dynamics like group polarization, internal hierarchy formation, or isolation from broader public feedback. Moreover, democratic legitimacy is not solely derived from the accuracy of outcomes but also from procedural elements like the power to authorize power and hold representatives accountable through re-election, which elections provide but sortition inherently excludes. Thus, while lottocracy solves the problem of descriptive bias found in elections, it introduces a deficit in accountability that prevents it from being automatically more legitimate overall.
