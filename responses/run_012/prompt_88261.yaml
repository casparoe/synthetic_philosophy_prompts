answer: |-
  Here are three distinct rules that fit Dana's four calls, how they apply to your situation, and the strategy to test her.

  ### Three Candidate Rules

  **1. The "Downstream Dependency" Rule**
  *   **The Logic:** A statement is a lie if it causes others to make decisions or plans based on false information. If no one is relying on the info to act, it's noise.
  *   **Fits the Data:**
      *   (1) Team plans around Friday. **(Lie)**
      *   (2) No one asked, so no one changed plans based on the slip. **(Fine)**
      *   (3) Asker assumes "merged" = "working" and stops checking. **(Lie)**
      *   (4) Meeting attendance rarely blocks critical path decisions. **(Fine)**
  *   **Prediction for You:** **Lie.** Your coworker operated under the assumption you had reviewed the doc. Even if you fixed it tomorrow, for that interim period, they relied on a false state of review.

  **2. The "Labor Accounting" Rule**
  *   **The Logic:** You must be accurate about the state of work *labor*. Promises about future labor and claims about completed labor are binding. Social friction or capacity management is not labor.
  *   **Fits the Data:**
      *   (1) False claim about future labor. **(Lie)**
      *   (2) Status update is a summary, not a ledger audit. **(Fine)**
      *   (3) False claim about completed labor (running vs. merged). **(Lie)**
      *   (4) Claim about capacity/boundaries, not specific work output. **(Fine)**
  *   **Prediction for You:** **Lie.** You claimed a unit of labor ("skimmed") was completed when it was not. It doesn't matter that you did it later; the accounting was false at the time of reporting.

  **3. The "Correction Window" Rule**
  *   **The Logic:** A falsehood is only a violation if you let it stand long enough to cause damage or if you refuse to correct it when the truth emerges. Speed of self-correction mitigates the lie.
  *   **Fits the Data:**
      *   (1) Engineer waited until Friday to reveal truth. **(Lie)**
      *   (2) No correction needed because no one inquired. **(Fine)**
      *   (3) Dev never volunteered the "not running" truth. **(Lie)**
      *   (4) Statement was true, no correction needed. **(Fine)**
  *   **Prediction for You:** **Fine.** You corrected the record (by actually reading it) within 24 hours, before any decisions were permanently locked based on your feedback.

  ### Dana's Actual Rule: The "Active Obfuscation" Heuristic

  **The Rule:** **Do not actively construct a false mental model of work progress to avoid scrutiny.**

  **Why this fits:**
  This explains why Case 3 ("Code's merged") was *worse* than Case 1 (The Friday Promise).
  *   **Case 1** is a broken promise. It's risky, but it's a standard planning error.
  *   **Case 3** is *obfuscation*. It uses a technical truth to hide a functional failure. Dana hates this most because it makes the problem invisible.
  *   **Case 2** is passive. You didn't hide the blocker; you just didn't volunteer it.
  *   **Case 4** is honest. You stated a true boundary.

  **Verdict on Your Case:** **She calls this a Lie.**
  You actively constructed a false model ("I skimmed it") to avoid the scrutiny of admitting you hadn't looked at it yet. Even though you fixed it, the initial statement was designed to close the loop on a task that was still open. To Dana, saying "I'll read it tomorrow" is Case 1 (Promise). Saying "I skimmed it" is Case 3 (False Status). She prefers Case 1 over Case 3.

  ### Strategy: Which Case to Bring Up

  **Bring up Case 3 (The "Code's Merged" incident).**

  **Why:**
  If you bring up Case 1 (The Friday Promise), she might argue, "Well, you *did* the work the next day, so it's not a broken promise." That lets you off the hook too easily.

  Case 3 is the hammer. In Case 3, the engineer said something *technically true* ("merged") that implied the work was done. You said something *technically false* ("skimmed") that implied the work was done.

  **The Script:**
  > "I'm trying to calibrate on something. In the migration incident, you said saying 'code's merged' was worse than promising a Friday deadline, because it misrepresented the state of the work. I told a coworker I'd skimmed a doc to close the loop, but actually read it the next day. I know I fixed it quickly, but is that closer to the Friday promise, or is it the 'merged' case where I misreported the state of the work to avoid saying 'not yet'?"

  **The Tell:**
  *   If she says **"It's the merged case,"** she values **status accuracy** over outcomes. You need to stop claiming work is started/done until it is.
  *   If she says **"It's nothing, you fixed it,"** she values **outcomes** over status. You're safe, but don't make a habit of it.
  *   If she says **"It's the Friday promise,"** she values **commitments**. You need to stop making time-bound claims you can't guarantee in the moment.

  **My bet:** She flags it as the "merged" case. She tolerates missed deadlines (Case 1) more than she tolerates hidden status (Case 3). You hid the status of the review.
