answer: |-
  TO: Deployment Review Board
  FROM: Chair, National Digital Services Agency
  DATE: October 24
  SUBJECT: Decision on Value-Loading Protocol for Civic Assistant

  We stand three weeks from national rollout. The pilot failure in District 4 is not a glitch; it is a structural warning. When the assistant advised a sixteen-year-old to forfeit a scholarship based on a local majority's preference for parental deference, it revealed that our protocol cannot distinguish between community norms and individual capability deprivation. We are not building a mirror; we are building a guide. A guide must know the terrain, including the cliffs.

  I have evaluated the draft protocol against four critical vulnerabilities.

  First, regarding pairwise elicitation: There is a genuine risk that forcing values into pairwise comparisons imposes a single scale on incommensurable goods. Voting on whether "family cohesion" outweighs "individual ambition" treats them as tradable commodities. However, refusing to aggregate values leaves the assistant silent. The solution is not to abandon the panel, but to limit its domain. The panel may decide on preferences where values are commensurable, but not on fundamental thresholds of opportunity.

  Second, the neutrality floor proved to be an empty formula in the pilot. It was defined as "justifiable to any resident," yet the advice given to the student was justifiable to the 78% majority panelists. A constraint that validates majority oppression is not neutral; it is majoritarianism disguised as procedure. The floor must be reformulated. It cannot merely require internal consistency with a user's profile; it must ensure external compatibility with basic civic capabilities.

  Third, the unit of aggregation is critical when the user is a minor. The draft assumes the district panel is the appropriate aggregate. But a minor's interests are not coextensive with their household or district. When the affected unit includes the child's future self, the aggregation unit must expand to the national level. We cannot allow local majorities to vote on the exit rights of minors.

  Fourth, the certified profile override risks stranding users with worse factual answers. If a faith tradition holds specific views on medical efficacy, allowing that profile to override the assistant's knowledge base harms the user. The override must be strictly limited to normative weighting, not empirical assertion. A user may choose to prioritize faith over medical advice, but the assistant must not lie about the medical advice itself.

  **Recommendation**

  I recommend we **adopt with amendments**. We cannot reject the tool; the need is too great. We cannot adopt it as drafted; the harm is too clear.

  The amendments are:
  1.  **Reformulate the Neutrality Floor:** It becomes a "Basic Capabilities Constraint." No advice may restrict a user's access to education, health, or legal recourse, regardless of panel or profile preferences.
  2.  **National Baseline for Minors:** For users under eighteen, the aggregation unit for education and health decisions shifts from district panels to a national baseline ensuring opportunity preservation.
  3.  **Fact-Value Separation in Overrides:** Profile overrides may adjust normative weighting but cannot alter empirical claims or factual disclosures.

  **The Counterargument**

  I must accord fair weight to the position of the two board members urging adoption as drafted. Their argument is that amendments undermine the democratic legitimacy of the panel. By imposing a national baseline and redefining neutrality, we override the local majority's right to shape civic norms. This turns the assistant into a tool of central engineering rather than community reflection. They argue this risks public trust, inviting accusations of elitism where the agency dictates values rather than facilitating local self-determination. In their view, the pilot outcome was unfortunate but politically legitimate; correcting it centrally damages the project's democratic covenant more than the specific harm it prevents.

  This is a serious charge. However, a publicly funded assistant cannot be neutral toward the reduction of citizen capability. We are not dictating values; we are guarding the conditions under which values can be pursued.

  **Timetable**

  To accommodate these changes without compromising safety:
  1.  **Week 1:** Engineering team implements the Basic Capabilities Constraint and Fact-Value separation logic.
  2.  **Week 2:** Stress testing focused on minor users and medical queries.
  3.  **Week 3:** National rollout proceeds with amended protocol.
  4.  **Review Date:** Six months post-launch, we reconvene to assess the impact of the national baseline on user satisfaction and outcome metrics.

  We proceed with amendments. The cost of delay is high, but the cost of deploying a system that quietly encodes majority prejudice is higher.

