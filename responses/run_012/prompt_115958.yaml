prompt: |-
  OK so I've been reading LW and ACX-adjacent blogs for like a decade and Chesterton's fence might be the single most load-bearing phrase in my whole social circle, and I've just realised I definately can't say what it actually claims. The version I always hear cashes out to something like: don't take down a fence until you know why it was put up. Most recent sighting was a group chat where a friend wants to kill the rule that new members of our thing have to be vouched for by an existing member, on grounds that it's arbitrary and exclusionary, and someone else just posted Chesterton's fence and that was that, thread over. I've also seen it deployed to defend the filibuster, and to tell me I shouldn't tell a friend his business idea is bad because the market has already selected against it somehow. And then someone in the thread pointed out that Chesterton's own version is a gate across a road, a modern reformer saying he doesn't see the use of it, and the smarter reformer answering that he won't let it be cleared away until the guy can come back and say what it's for, which sounds like it's ordering you to go investigate, not to preserve anything. So now I don't even know which direction the thing points.

  Lay out for me the distinct precise claims hiding in it, as a menu I can paste into the chat. For each: what exactly is being asserted (a claim about knowledge? about who has the burden of proof? about how institutions got there? about expected value under uncertainty?), whether it's a platitude nobody could disagree with, a real substantive claim that might even be true, or false, and what you'd have to believe about institutions for the strong version to go through. I especially want a reading for the case where nobody built the fence — it accreted, or it's a spandrel, or it was put up for a bad reason and now does something completely different — and whether the metaphor is quietly smuggling in a builder with intentions. Say how all this relates to the older Burke thing about inherited arrangements storing experience no individual has, and whether it's relevant that Chesterton himself was a distributist who wanted to tear up the existing economic order rather than a defender of the status quo. Then tell me which reading the people who say it probably mean, and which readings would actually license using it as a conversation-ender the way my friend did, because alot of the time I suspect it's just status quo bias wearing a hat.
