answer: |-
  This is a classic formulation of the **Infinite Utility Paradox**, a problem that has troubled population ethics and decision theory since at least the work of Ramsey (1928) and has received rigorous treatment in recent decades by Vallentyne, Kagan, Bostrom, and Greaves.

  Your instinct is correct: (7) is intolerable. It violates the **Pareto Principle** (if one person is better off and no one is worse off, the state is better) and basic moral sanity. However, your attachment to (1) and (2) is also philosophically defensible. The failure lies not in the metaphysics of the world (1) nor the fundamental egalitarianism of (2), but in the **mathematization of value in infinite contexts** (specifically the inference from 4 to 5) and the **decision rule** (6).

  Here is the diagnosis, the repair, and the price list.

  ### 1. The Diagnosis: Where the Argument Fails

  The argument fails at the transition from **(4) to (5)**, and consequently **(5) to (6)**.

  **The Failure:** Premise (5) assumes that ethical value supervenes on **cardinal arithmetic**. It treats the "value of the world" as a single real number (or extended real number) derived from a sum. In standard cardinal arithmetic, $\aleph_0 + n = \aleph_0$. Therefore, if the baseline utility is infinite, adding a finite positive utility (saving the child) results in the same cardinal infinity.

  **Why it looked innocent:** We naturally model value aggregation on finite arithmetic. In finite worlds, Total Utilitarianism (2) works by summing welfare to produce a scalar value. We assume this function extends continuously to infinite cases. It does not. The concept of a "sum" is ill-defined for infinite series unless we specify an ordering, and ethical value does not come with a pre-assigned spatial or temporal index that licenses standard summation.

  By treating $\infty$ as a number that swallows finite differences, Premise (5) commits a category error. It conflates **cardinality** (how many people) with **betterness** (axiological ranking). Two worlds can both contain infinite welfare and yet one be strictly better than the other.

  ### 2. The Repair: Revising Axiology and Decision Theory

  You asked if you can keep additive aggregation (2) and revise only decision theory. The answer is: **You must revise the definition of aggregation in (2) to accommodate infinity, which forces a revision of decision theory (6).** You cannot simply "sum" in infinite contexts.

  To repair this while keeping the spirit of (2) (everyone counts equally), you must adopt a **comparative** rather than **absolute** axiology for infinite worlds.

  **The Fix: Pareto Dominance and Spatiotemporal Expansion**
  Instead of asking "What is the total sum?", ask "Is one world better than the other?"
  1.  **Pareto Principle:** If World A and World B contain the same infinite people, and everyone in B is at least as well off as in A, and at least one person (the child) is strictly better off, then B is better than A. This immediately falsifies (5). The values are not "the same infinite quantity"; rather, the relation "better than" holds even if the "totals" are both undefined or infinite.
  2.  **Expansionism (Vallentyne/Kagan):** To handle cases where Pareto doesn't apply (e.g., some gain, some lose), we compare finite regions. We expand a "sphere of moral concern" outward from the agent (or spatiotemporally). If, for all sufficiently large finite regions, the utility in World A exceeds World B, then A is better than B.

  In the child-saving case: In the finite region containing the child, the world where you save the child has higher utility. In regions not containing the child, utility is identical. Therefore, on an expansionist view, the world where you save the child is better.

  **Revised Decision Theory:**
  You must abandon the rule "Maximize Expected Total Utility" (which requires a defined total). Replace it with: **"Choose the option that is not dominated by another"** or **"Choose the option that is better according to the expansionist ordering."**

  ### 3. The Price of Repairs

  You asked to price the repairs. Can you keep (2)? Yes, but it will cost you.

  **Cost 1: Incompleteness (The High Price)**
  In finite worlds, Total Utilitarianism provides a **complete** ordering: for any two worlds, one is better, worse, or equal. In infinite worlds, even with expansionist or Pareto revisions, the ordering becomes **incomplete**.
  There will be pairs of infinite worlds where neither dominates the other, and the expansionist limit does not converge.
  *   *Example:* World A has utility pattern $(1, -1, 1, -1...)$ and World B has $(-1, 1, -1, 1...)$. Both sum to undefined/zero depending on ordering. Neither dominates.
  *   *Consequence:* You cannot always say what you ought to do. There will be genuine moral indeterminacy in infinite contexts. You lose the ability to generate a unique prescription for every choice.

  **Cost 2: Loss of Scalar Value**
  You can no longer assign a "value" to a world. You can only rank pairs. Premise (2) says "the value... is the sum." You must change this to "the betterness relation is determined by..."
  *   *Consequence:* You lose the simplicity of utilitarian calculus. You cannot easily trade off probabilities of infinite outcomes in expected utility calculations because you cannot multiply probabilities by undefined values.

  **Cost 3: Sensitivity to Spatiotemporal Location**
  Expansionist views require a metric (space or time) to define the "regions" of expansion.
  *   *Consequence:* This introduces a metaphysical dependency. If the universe has no natural metric, or if persons are not locatable in a shared manifold, the theory struggles. It violates the pure "person-affecting" neutrality of classic utilitarianism by making value depend on *where* people are, not just *how well off* they are.

  ### 4. Alternative: Surrendering Premise (2)

  If the price of incompleteness is too high, you might consider rejecting (2) (Additive Aggregation).

  **The Surrender:** Move to **Average Utilitarianism** or **Critical-Level Utilitarianism**.
  *   *Average Utilitarianism:* In an infinite world, the average might be well-defined even if the sum is not.
  *   *Cost:* This invites the **Repugnant Conclusion** and the **Mere Addition Paradox** with renewed vigor. It also implies that adding a happy person to an infinite world might not change the value (if the average stays the same), which violates the intuition that adding good lives is *pro tanto* good.
  *   *Critical-Level:* You set a threshold $c$. Only welfare above $c$ counts.
  *   *Cost:* This is arbitrary. Why that level? Also, in an infinite world, if there are infinitely many people above $c$, you return to the original infinity problem.

  **Verdict on Surrendering (2):** The cost here is higher. Rejecting additive aggregation undermines the fundamental intuition that suffering matters regardless of how many people are already happy. Revising the *mathematics* of aggregation (as in the Repair section) preserves the moral insight of (2) while acknowledging the mathematical limits.

  ### 5. Alternative: Surrendering Premise (1)

  **The Surrender:** Assert the world is finite.
  *   *Cost:* Epistemic arrogance. Current cosmology allows for infinite space or eternal future. To rule this out a priori is to make ethics contingent on a specific, unproven cosmological model. If physics later confirms infinity, your ethics collapses. It is better to have an ethics robust to metaphysical uncertainty.

  ### Recommendation

  Do not surrender (1) or the core moral insight of (2). The failure is in the **naive application of finite arithmetic to infinite axiology**.

  **Tell your student:**
  The argument is valid *if* we assume value is a real-valued function defined by standard summation. But that assumption is false.
  1.  **Reject (5):** Two worlds can both have infinite welfare, yet one be better than the other (via Pareto dominance).
  2.  **Reject (6):** Reasons to act do not require a difference in *total scalar value*; they require a difference in *betterness relations*.
  3.  **Accept the Cost:** We must accept that in infinite contexts, our moral ordering is **incomplete**. There will be cases where we have no reason to prefer A to B nor B to A. But the case of "Saving the Child vs. Rearranging Pens" is not one of them. Saving the child Pareto-dominates rearranging pens.

  **The Bill:**
  *   **Simplicity:** Gone.
  *   **Completeness:** Gone.
  *   **Moral Sanity:** Preserved.

  You can keep the student in the seminar, but assign them Vallentyne & Kagan's *"Infinite Value"* (1997) or Arntzenius et al.'s *"Infinite Utilities"* (2002). The paradox is not a refutation of utilitarianism; it is a refutation of the idea that utilitarianism is mathematically trivial.
