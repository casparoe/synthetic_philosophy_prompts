prompt: |-
  I've just spent about four hours arguing with my mate Priya — she's doing a law master's, I did philosophy and then gave up — about the Hart–Fuller debate, and we kept going round in circles because every example either of us could come up with was the same old grudge informer / wicked Nazi statute stuff, and we both knew the script in advance: the positivist says it's still law but a rotten one, the natural lawyer says then it isn't law at all. So I want to build a case properly instead of trading anecdotes, and I'd like you to construct it for me. What I'm after is a thought experiment where the two sides come out the wrong way round. The positivist — and I want the reason to be a plain social fact about what the officials of the system actually do, not a moral one — has to conclude that the norm in question is not valid law; and the natural lawyer has to conclude that it is. Extra credit if the norm itself is one nobody could object to morally, so that it's the supposed amoralist who refuses to recognise it as law and the supposed moralist who insists on its legal status. Set it in an invented jurisdiction (call it Marovia) so we're not leaning on any real statute or case I can't check. My suggested scaffolding, and feel free to improve it: Marovia's legislature passes a perfectly decent, just, uncontroversial enactment, and the only oddity is a formality — by long convention the courts only treat a statute as law once it's been engrossed and sealed with the Great Seal, and this one wasn't. The single variable I want you to hold everything else fixed around is whether the officials' practice is uniform or divided on that formality: in one version the judges have never once applied an unsealed enactment and treat the sealing as a precondition; in the other the practice is patchy and nobody's sure whether it's a precondition or just a bit of housekeeping. My guess is that this variable flips the positivist's answer and leaves the natural lawyer's alone, but if you think it doesn't, don't force it — tell me why and build the case that does the job instead.

  After the scenario, do the working properly: for each theory, in each version, give the verdict and the route to it in that theory's own terms — the rule of recognition and the officials' convergent practice for the positivist; whatever it is that makes something count as law in the natural-law picture (authority, direction to the common good, the focal case versus the defective case) for the natural lawyer — and do it from the point of view of an actual judge in Marovia who has to decide wether to apply the thing, not as abstract slogans. Then tell me honestly which feature of the case is doing the real work, what happens if I take that feature away, and how a defender of whichever side ends up looking silly would attack the case — I'd rather know where the seams are than have them patched over. And if anywhere I've just stipulated the answer rather than engineered it, flag that, because a case that wins by cheating is no use to me. One paragraph for the scenario, then the analysis; around 800–1200 words; British English throughout please, I've been reading too much American stuff lately and it's infected my spelling.
