answer: |-
  In the jurisdiction of Marovia, the legislature passes the 'Winter Relief Act', a statute mandating food provision for the impoverished, universally acknowledged as morally just and necessary for the common good. However, due to a clerical error, the Act is not engrossed with the Great Seal, a constitutional formality. The critical variable is the convergent practice of Marovian judges: in this version, the judiciary has uniformly refused to apply any unsealed enactment for a century, treating the seal not as mere evidence but as a constitutive condition of validity. A judge now faces a claim under the Act. She must decide whether to apply it, knowing the officials around her uniformly treat such texts as nullities, yet acknowledging the statute's perfect moral alignment with the welfare of the populace.

  For the Hartian positivist, the verdict is straightforward: the Act is not law. The foundation of legal validity is the Rule of Recognition, a social rule constituted by the convergent practice of officials. Here, the social fact is unambiguous; judges uniformly reject unsealed texts. The Rule of Recognition therefore contains a criterion 'Enactment + Great Seal'. Since the Winter Relief Act lacks the seal, it fails the pedigree test. The judge's moral admiration for the Act is legally irrelevant; to apply it would be to act outside the system's criteria of validity. If the practice were patchy—say, some judges accepted unsealed acts while others rejected them—the positivist would conclude the Rule of Recognition is uncertain at this margin. The Act would sit in a penumbra of validity, neither clearly law nor clearly not law, until a higher court resolves the inconsistency. But under uniform rejection, the social fact dictates invalidity. The positivist's conclusion flips entirely on the empirical reality of official behaviour, not the moral content of the rule.

  For the natural lawyer, the verdict is that the Act is law, regardless of the officials' practice. On a substantive natural law view (akin to Aquinas or Finnis), law derives its binding force from its orientation towards the common good. The Winter Relief Act is a paradigmatic instance of such direction; it is reasonable, just, and serves human flourishing. The missing seal is a procedural defect, but it does not extinguish the moral authority that makes law obligatory. To deny the Act's legal status because of a clerical formality, when its substance is perfectly just, would be to prioritise form over the very purpose of law. Consequently, the judge is morally obliged to treat it as law. If the officials' practice were patchy, the natural lawyer's conclusion remains unchanged. The uncertainty of official behaviour does not diminish the Act's moral merit or its service to the common good. The natural lawyer's verdict is invariant to the social fact of judicial practice; it depends solely on the moral quality and rational authority of the norm itself.

  The feature doing the real work here is the source of validity: social pedigree versus moral function. For the positivist, the uniform practice creates a hard constraint; remove the uniformity, and the constraint dissolves into uncertainty. For the natural lawyer, the moral substance creates a hard constraint; remove the justice of the Act, and the constraint dissolves. However, there are seams in this construction that must be acknowledged. Firstly, regarding the natural lawyer: this argument privileges substantive natural law over Fuller's procedural variety. Fuller argued that law possesses an 'inner morality' consisting of procedural requirements like promulgation and clarity. A strict Fullerian might agree with the positivist here, arguing that bypassing the seal undermines the procedural integrity of the system, making it less 'law-like'. To make the natural lawyer insist it *is* law, I have subtly shifted the ground from Fuller's proceduralism to Finnis's focal analysis, where the substantive common good is the primary determinant. If you hold me to a strict Hart–Fuller framework, Fuller might concede the Act is legally defective to the point of non-existence, collapsing the reversal.

  Secondly, regarding the positivist: have I stipulated the answer? I defined the officials' practice as 'uniform rejection'. If I allowed that judges sometimes grumbled but applied unsealed acts in emergencies, the Rule of Recognition would be complex, perhaps including a tacit exception for 'urgent welfare'. By stipulating uniform rejection, I force the positivist hand. However, this is not cheating so much as isolating the variable; Hart insists the Rule of Recognition is a matter of fact. If the fact is uniform rejection, the conclusion follows. The weakness lies in the real world: practices are rarely perfectly uniform. A clever positivist might argue that the 'true' Rule of Recognition includes a principle of justice that overrides the seal in extreme cases, but that imports morality into the RoR, which Hart resists.

  Finally, the reversal relies on the Act being morally unobjectionable. If the Act were wicked, the natural lawyer might deny it is law (the 'lex injusta' thesis), and the positivist would admit it is law (the 'separation' thesis), returning us to the standard Nazi informer script. The reversal only holds because the moral valence is positive while the procedural pedigree is negative. This exposes the asymmetry: the positivist is sensitive to procedure (social fact), while the natural lawyer is sensitive to substance (moral fact). The case works only so long as we accept that for the natural lawyer, substantive justice can cure procedural defects, whereas for the positivist, procedural pedigree cannot be cured by substantive justice. If you deny that premise, the thought experiment collapses, but that premise is precisely where the two theories diverge.
