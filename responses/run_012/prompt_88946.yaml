answer: |-
  You are not making it up case by case. Your intuitions are remarkably consistent, and they point toward a specific, well-defined metaphysical position. You are implicitly endorsing a version of **Causal-Functional Continuity with a Non-Branching Constraint**, mediated by **Sortal Relativity**.

  Here is the principle that captures your verdicts, how it resolves the brain fission case, and where it demands you tighten up your other judgments.

  ### The Principle: Unique Causal History of Functional Organization

  Your verdicts rely on three pillars:

  1.  **Matter is Irrelevant:** You reject material constitution as the criterion for identity. (The bench with new legs, the river with new water, the file on a new drive).
  2.  **Causal Continuity is Necessary:** There must be an unbroken chain of cause-and-effect linking the earlier stage to the later stage. (The repaired bench is caused by the original; the rebuilt bench is not. The edited file is caused by the previous save; the copy is a new causal branch).
  3.  **Sortal-Dependent Function:** What counts as "continuity" depends on *what kind of thing* (sortal) it is.
      *   For a **bench**, function is structural integrity.
      *   For a **person**, function is biological/psychological capacity (hence survival through amnesia).
      *   For a **company**, function is active organizational purpose (hence death when gutted).
      *   For a **song**, function is cultural transmission (hence survival through melodic change).
  4.  **The Non-Branching Constraint (Uniqueness):** Identity is a one-to-one relation. If a causal process branches such that two equally valid candidates exist, *neither* is the original. (This is explicitly shown in your file verdict).

  ### The Brain Fission Case

  You asked what this principle says about the person whose brain is divided, with each half waking up in a new body.

  Based on your **file verdict**, the answer is strict: **The original person ceases to exist.**

  Here is the logic:
  *   In the file case, you said that if you have two copies edited from then on, *neither* is *the* file. This is the **Non-Branching Constraint**.
  *   If psychological continuity is what matters for persons (as your amnesia/aging verdicts suggest), and the brain is the substrate of that psychology, then fission creates two psychologically continuous successors.
  *   Because identity cannot be one-to-two (you cannot be two distinct people simultaneously), the original identity relation is broken.
  *   **Verdict:** Both successors are *new* people who possess the memories and traits of the deceased original. The original person died in the division.

  This aligns with Derek Parfit's reductionist view, though Parfit suggests we shouldn't care about survival in that case. Your intuition suggests you care about *identity*, and identity cannot survive branching.

  ### Which Verdicts Must You Give Up (or Refine)?

  Your list is 90% consistent. To make it 100% consistent with the principle above, you need to resolve three tensions.

  **1. The River (Ambivalence vs. Principle)**
  *   *Your Verdict:* You are torn on the dammed/diverted river.
  *   *The Principle:* A river is defined by its *course* and its *source*, maintained by gravity and geography.
  *   *The Fix:* If the water is diverted artificially (dam/cut channel), the causal history of the *path* is broken. It is a new river, even if the water is the same. If the river naturally shifts course over time (avulsion), the causal history is continuous.
  *   *Adjustment:* Drop the ambivalence. Artificial diversion = New River. Natural shift = Same River. This matches your "Gutted Company" verdict (artificial interruption of function).

  **2. The Folk Song (Content vs. Causal Chain)**
  *   *Your Verdict:* Every note changed, but still the same song.
  *   *The Principle:* This tests the "Functional Organization" pillar. If *every* note changes, where is the function?
  *   *The Fix:* For a folk song, the "function" is not the specific frequencies, but the **role in a tradition**. The identity condition for a *song* is different than for a *bench*. A bench is a physical artifact; a song is a cultural type.
  *   *Adjustment:* You don't need to give this up, but you must articulate that "Function" for abstract/cultural objects is *lineage*, whereas for physical objects it is *structural continuity*. This explains why the gutted company (lineage kept, function lost) dies, but the folk song (function/role kept, content lost) lives.

  **3. The Person (Aging vs. Fission)**
  *   *Your Verdict:* A person changed until they share "almost nothing" with their younger self is the same person.
  *   *The Tension:* If continuity is all that matters, why does branching kill it?
  *   *The Fix:* You must distinguish between **Degrees of Change** and **Structural Multiplication**.
      *   Aging is a *linear* causal process. Even if the content changes, the chain is unbroken.
      *   Fission is a *multiplicative* causal process.
  *   *Adjustment:* You can keep the aging verdict, but you must accept that **survival is not what matters** in the fission case. If you tell your students that identity requires uniqueness (per the file case), you cannot say the person survives fission. You have to say the *person* dies, even if the *psychology* survives twice.

  ### Summary for Your Students

  If you want to teach this authentically, here is the position you actually hold:

  > "Identity over time is not about matter, and it is not about similarity. It is about **history**. An object persists so long as there is an unbroken causal chain preserving the functional organization essential to its kind. However, identity is unique. If history branches, the original ends."

  **The Hard Pill to Swallow:**
  The most philosophically honest thing you can tell your students is that your **File Verdict** dictates your **Person Verdict**.
  *   If you say the original file dies when copied and branched, you must say the original person dies when fissioned.
  *   If you want to say the person survives fission, you must admit that *neither copy of the file is the original file* is an intuition you are willing to sacrifice for the sake of persons (perhaps arguing persons have a "further fact" of identity that files do not).

  But looking at your list, you seem too honest for that exception. You treat the file as a paradigm case. Stick with that. It makes for a cleaner metaphysics.

  **Your Unified Theory:** **Historical Functionalism with a Uniqueness Constraint.**
  *   **Bench:** Passes (Continuous repair).
  *   **Replica Bench:** Fails (No causal history).
  *   **Person (Amnesia/Age):** Passes (Continuous biological/psychological history).
  *   **River (Diverted):** Fails (Broken causal path).
  *   **Company (Gutted):** Fails (Broken functional organization).
  *   **Song:** Passes (Continuous cultural transmission).
  *   **File (Move):** Passes (Continuous data history).
  *   **File (Branch):** Fails (Violates Uniqueness).
  *   **Person (Fission):** Fails (Violates Uniqueness).

  You aren't making it up. You're a **Four-Dimensionalist about processes, but a Non-Branching Essentialist about identity.** Teach that. It's a solid position.
