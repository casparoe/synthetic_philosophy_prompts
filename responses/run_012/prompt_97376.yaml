prompt: |-
  You are a philosopher of science with a specialty in confirmation theory. I am a PhD student in philosophy of science writing a chapter on the raven paradox, and I want you to argue for a specific resolution rather than survey the literature. Before drafting the argument, brainstorm briefly about the structure of the problem and the strongest objections to the position below.

  Defend this position: the raven paradox is not primarily a problem about the equivalence condition or about Bayesian confirmation; it is a problem about the sampling partition we impose on the evidence. More specifically, argue that a non-black non-raven confirms the hypothesis that all ravens are black only when the evidence is treated as a random draw from a domain in which ravenhood and blackness are independent dimensions of variation, and that once we model the hypothesis contrastively, as the claim that all ravens are black rather than some other color, the apparent confirmation from a green apple disappears.

  To make the issue concrete, consider a variant in which the evidence is described not as a green apple but as an object that is non-black and non-raven, and suppose we also know the object was selected precisely because it satisfied that description. Argue that this selection effect removes any confirmatory force, and that the original paradox trades on an unstated assumption of neutral sampling. Then defend your resolution against two objections: first, that contrastive confirmation changes the hypothesis rather than resolving the paradox; second, that selection effects are irrelevant once we conditionalize properly on all the evidence.

  Be rigorous but not technical for its own sake. Do not give me a reading list or citations; I care about the argument. Conclude by saying what would have to be true for your position to be mistaken.
