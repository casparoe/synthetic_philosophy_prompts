      *   *Middle Ground:* A modified clause. Require disclosure, but allow for *conditional* participation where recusal is impossible or detrimental to overall survival, subject to review. Or, refine the recusal rule to be pragmatic rather than absolute.
      *   *Better Approach:* The core ethical tension is between *procedural integrity* (trust) and *operational reality/human psychology*.
      *   *Decision:* Amend the clause. Keep disclosure mandatory. Make recusal the default *but* allow for exceptions where immediate action is required and no other qualified provider is available, with mandatory post-event review. This addresses the "only clinician present" failure mode. It respects the impartial rule while acknowledging the reality of the situation.
