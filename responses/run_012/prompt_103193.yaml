prompt: |-
  hey — I'm a high school junior and i run our school's philosophy club (about 12 kids, we get one 50-minute block in a regular classroom, basically zero budget). I want to run a session on the surprise quiz paradox, but not the version where I stand up and explain it and everyone goes "ok sure, weird." I want us to actually live through it and get the rug pulled.

  so: design me a game we can run start to finish inside that one 50-minute block. Rules, materials (cheap only — paper, candy as the prize, that kinda thing), how the scoring/payoff works, and the whole run of play. The thing I really want everyone to feel is the moment where the reasoning seems airtight, we all agree the quiz can't possibly happen, and then it happens anyway and the announcement turns out to have been true the whole time. Please arrange the *rules* so the group corners itself into that, not so I have to explain it afterward.

  Here's the spin I definately want baked in, since I don't want it to just be the textbook version everyone's already seen: make the game turn on the gap between the announcement being TRUE and us being able to KNOW it in advance. So have us commit to a prediction before we're allowed to talk it out, then let us discuss and get more and more sure of the "obviously it can't happen" answer, then let that very confidence be why we get surprised. The debrief should point straight at that gap.

  Also give me the debrief that maps each beat of the game onto a piece of the paradox — the backward induction, the self-referential announcement, why the announcement being knowable isn't the same as it being true — plus a real heads-up on what predictably goes wrong the first time you run something like this and how to fix it on the fly. And be honest about the one part of the paradox the game can't reproduce and that I'll just have to tell them myself.

  Act like you're a philosopher who studies paradoxes and also a teacher who's actually run games with 16-year-olds. Think it through, maybe brainstorm a couple of different game structures before you commit, then give me the best one.

  At the very end, after the write-up, give me a compact table called the run sheet with these columns: Phase, Minutes, What the players do, What it's meant to make them feel. And write everything in American English. thanks!
