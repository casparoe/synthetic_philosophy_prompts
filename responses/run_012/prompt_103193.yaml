answer: |-
  Here is a complete game design, run sheet, and debrief guide tailored for your 50-minute block. I've designed this to be low-prep but high-impact, focusing specifically on that epistemic gap (Truth vs. Knowability) you asked for.

  ### Game Title: The Impossible Promise

  **The Core Concept:**
  You are not just telling them about the paradox; you are making the announcement *to them* at the start of class. The "game" is their attempt to outsmart the announcement using logic. The "loss condition" is realizing their logic invalidated the very knowledge they thought they had gained.

  **Materials Needed:**
  *   **Whiteboard & Markers.**
  *   **12 Slips of Paper ("Prediction Contracts").** Pre-cut if possible, or just have them use notebook paper.
  *   **12 Copies of "The Quiz".** (Just a half-sheet with two questions: 1. *What day did the logic say the quiz would happen?* 2. *Are you surprised?*)
  *   **Candy (Optional).** 12 pieces. Prize for "Best Logical Argument" during debrief (not for getting the quiz right).

  ---

  ### Part 1: The Setup (Minutes 0–10)

  **1. The Announcement (Write this on the board before they sit down):**
  > **THE PROMISE:**
  > 1. A quiz will be handed out during one of the five 10-minute segments of this class.
  > 2. When you receive the quiz, you will not be able to *deduce* beforehand that it was coming in that specific segment.
  > 3. If the quiz is not handed out, the promise is broken.

  **2. The Prediction Contract:**
  Hand out the slips. Tell them:
  *"Before we discuss the rules, I need you to commit to reality. On this slip, write your name. Then check ONE box:"*
  *   [ ] The quiz will happen in Segment: ____ (1, 2, 3, 4, or 5)
  *   [ ] The quiz is logically impossible. (It cannot happen).

  *"Do not talk to each other yet. This is your baseline belief."*
  Collect these immediately. Put them in a stack on your desk. **Do not look at them.** This creates the "record" of their initial intuition vs. their later logic.

  **3. The Rules of Engagement:**
  Tell them: *"You have 15 minutes to discuss the Promise with each other. Your goal is to figure out which segment the quiz will happen in. If you can prove it can't happen, you win. If you can prove when it happens, you win. If you get surprised, I win."*

  ---

  ### Part 2: The Logic Trap (Minutes 10–25)

  **1. Let Them Cook:**
  Step back. Let them talk. They will almost immediately find the Backward Induction.
  *   *Student A:* "It can't be Segment 5. If we get to the start of Segment 5 and no quiz yet, we *know* it has to be then. So it wouldn't be a surprise."
  *   *Student B:* "Right, so 5 is out. But if 5 is out, then it can't be Segment 4. Because if we get to the end of 3, we know it's either 4 or 5. But 5 is impossible. So it has to be 4. So we'd know. So 4 isn't a surprise either."
  *   *The Group Mind:* They will eliminate 5, then 4, then 3, 2, and 1.
  *   *Consensus:* They will conclude the quiz is **Impossible**.

  **2. The Confidence Peak:**
  Around minute 20, they will feel very smart. They will look at you with pity. "You broke the promise before you started."
  *   **Your Move:** Do not confirm or deny. Just say, *"Are you all sure? Is there any loophole?"*
  *   Let them solidify their certainty. You want them to relax their guard because they think they have "solved" the threat.

  ---

  ### Part 3: The Sting (Minutes 25–30)

  **1. The Trigger:**
  Wait for a lull in conversation. Maybe someone is checking their phone or packing a bag early, thinking the "Impossible" verdict means class is effectively over.
  At exactly Minute 26 or 27 (Segment 3), stand up silently.
  Hand out **"The Quiz"** papers to everyone.

  **2. The Reaction:**
  There will be a moment of silence, then immediate outcry.
  *"Wait, we proved this couldn't happen!"*
  *"You lied!"*
  *"But I didn't know it was coming *this* minute!"*

  **3. The Quiz Content:**
  The quiz itself should be trivial (so grading isn't the point), but meta-cognitive:
  *   *Q1: Based on your group's logic 5 minutes ago, when was the quiz supposed to happen?* (Answer: Never)
  *   *Q2: Did you know I was handing this out 10 seconds before I did?* (Answer: No)

  Collect the quizzes immediately. Do not grade them yet.

  ---

  ### Part 4: The Debrief (Minutes 30–50)

  This is where you earn your keep as the club leader. Do not just say "Philosophy is weird." Map the game beats to the paradox.

  **1. The Post-Mortem (5 mins)**
  Ask: *"Was the Promise broken?"*
  *   Most will say "Yes, because we proved it impossible."
  *   Ask: *"Did the quiz happen?"* (Yes).
  *   Ask: *"Were you surprised?"* (Yes).
  *   *Conclusion:* The Promise was **True**. The conditions were met.

  **2. Mapping the Logic (10 mins)**
  Draw the "Backward Induction" on the board. Acknowledge their logic was valid *syntax*.
  *   Step 1: If it's the last day, it's not a surprise.
  *   Step 2: Therefore, the last day is eliminated.
  *   Step 3: Therefore, the second-to-last day becomes the new last day...
  *   *The Trap:* Point out that their elimination of Friday relied on the assumption that **they would know the announcement was true.**

  **3. The Truth vs. Knowledge Gap (10 mins)**
  This is the core philosophical payload.
  *   **Truth:** The statement "There will be a surprise quiz" turned out to be True.
  *   **Knowability:** The students assumed that because the statement was True, they could *know* it was True in advance and use it as a premise.
  *   **The Glitch:** You cannot use the *truth* of the announcement to *deduce* the date without destroying the *surprise* condition required by the announcement.
  *   *Analogy:* It's like saying, "I will tell you a secret you don't know." If I tell you the secret is "You don't know this," do you know it? The act of knowing changes the state of affairs.

  **4. The "Impossible" Prediction (5 mins)**
  Pull out the Prediction Contracts from the start.
  *   Show them how many initially thought it *would* happen vs. how many ended up convinced it *couldn't*.
  *   Highlight that their confidence in the "Impossible" verdict is exactly *why* the quiz was a surprise. If they had remained uncertain, they wouldn't have been surprised. Their logic *created* the surprise.

  ---

  ### Troubleshooting: What Goes Wrong & How to Fix It

  **Problem 1: "You Lied / This is Rigged."**
  *   *Why:* Teens have high radar for authority figures tricking them. If they feel manipulated, they disengage.
  *   *Fix:* Pre-empt this. In the Setup, say: *"I am bound by the Promise on the board. If I hand out the quiz and you knew it was coming, I lose. I am incentivized to be honest."* Also, ensure the quiz is genuinely random (don't look at the clock obviously before handing it out).

  **Problem 2: They Don't Find the Logic.**
  *   *Why:* 16-year-olds vary in logical fluency. They might get stuck on "Just pick Wednesday."
  *   *Fix:* Have a "Plant" or be ready to nudge. If they stall at minute 15, ask: *"Okay, imagine it's 4:50 PM (Segment 5). No quiz yet. Where must it be?"* Guide them to the Friday elimination, then let them take over.

  **Problem 3: The "Surprise" isn't felt.**
  *   *Why:* If you hand it out while they are intensely debating the paradox, they expect it.
  *   *Fix:* Timing is key. Wait for the "Consensus of Impossibility." Wait until they stop talking about the quiz and start talking about lunch or homework. That relaxation is the necessary condition for the surprise.

  ---

  ### The Honesty Check: What This Game Can't Do

  You need to tell them this at the very end.
  *"This game simulates the **psychology** of the paradox, but it doesn't solve the **logic**."*

  There is no universal agreement among philosophers on why the paradox fails.
  *   **Quine** says the students made a logical error in their deduction (self-reference is forbidden).
  *   **Epistemic Logicians** say the announcement creates a "blindspot" in knowledge (it's true, but unknowable).
  *   **Pragmatists** say "Surprise" is just a vague term that breaks under strict logic.

  You can't teach all that in 15 minutes. Admit that. Tell them: *"We felt the knot, but untying it is still an open problem in epistemology. Your job isn't to solve it, it's to understand why your brain tied itself in one."*

  ---

  ### Run Sheet

  | Phase | Minutes | What the Players Do | What It's Meant to Make Them Feel |
  | :--- | :--- | :--- | :--- |
  | **1. Contract** | 00–10 | Read board announcement. Fill out Prediction Contract silently. Hand in. | **Commitment.** Locking in their intuition before logic corrupts it. |
  | **2. The Trap** | 10–25 | Discuss the logic in a group. Eliminate days via Backward Induction. Agree it's impossible. | **Certainty.** The feeling of "solving" the problem and outsmarting the teacher. |
  | **3. The Sting** | 25–30 | **QUIZ HAPPENS.** Complete 2 questions. Hand back. | **Cognitive Dissonance.** The rug pull. Reality contradicting their "proven" logic. |
  | **4. Debrief** | 30–45 | Discuss why the logic failed. Map Truth vs. Knowability. Review Prediction Contracts. | **Insight.** Realizing their confidence was the vulnerability, not the strength. |
  | **5. Close** | 45–50 | Honesty Check (limitations of the game). Distribute candy for participation. | **Humility.** Acknowledging the paradox is still an open philosophical wound. |

  ### Final Tip for the Leader
  When you hand out the quiz, **do not smile.** Do not look triumphant. Look as surprised as they are. If you act like you "won," it becomes a game of Teacher vs. Students. If you act like the Paradox itself just manifested through you, it becomes a shared philosophical experience. Good luck. Pull the rug hard.
