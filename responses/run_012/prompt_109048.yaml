prompt: |-
  I'm the chair of the clinical ethics committee at a community hospital, and I've got to circulate a written opinion before Thursday's meeting on a case that has us split right down the middle.

  The short version: a 78-year-old woman was diagnosed last week with advanced pancreatic cancer. Her three adult kids, who've been at every appointment, caught the oncologist in the hallway and asked him not to tell their mother. Their line is that in their family, and in the community they come from, news like this goes to the eldest son first and he decides how much to share and when -- telling her flat out would strip away her hope and cut the family out of the one thing they know how to do. The oncologist says our policy gives the patient a right to know her own diagnosis, and he doesnt want to sit there and lie to her. He also pointed out, kind of sharply, that the kids' reading of "their culture" might just be what the kids want. One of our members, a palliative care doc, wants us to adopt something she calls relational consent: the family, not just the patient, is the unit that consents, so long as the patient has at some point named a family member to handle her medical info (she did -- her son is her listed contact). She'd wrap that in a two-key rule: the team can hold back the diagnosis only if the named proxy and the attending both agree, the team never affirmatively lies, and the hold gets revisited every 72 hours with an automatic trigger to disclose if the patient asks straight out. Another member says that whole thing is just paternalism with a passport.

  What I need from you is the memo itself. Give me a concrete recommendation for this patient, with a time frame, and then a going-forward policy, because we are absolutely going to get more of these. Two things I care about. First, dont let us just chant "autonomy" and roll the family, and dont let us treat "East Asian family values" as a monolith that overrides whatever this particular woman would actually want if someone asked her -- I've watched committees make both of those mistakes. Second, the family's ask has two pieces: keeping the information from her, and taking over the decisions. I have a hunch those come apart, so please dont just lump them together -- tell me whether our policy should treat them the same or differently, and why. And whatever you end up recommending, take the strongest version of the side you're ruling against seriously, because I have to look these people in the eye on Thursday.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Clinical Ethics Committee (CEC) at a community hospital.
      *   **Task:** Write a pre-meeting memo (written opinion) for Thursday's meeting.
      *   **Case:** 78F, advanced pancreatic cancer. 3 adult children request non-disclosure to mother based on cultural/family norms (eldest son decides). Oncologist insists on patient's right to know/truth-telling. Palliative care doc proposes "relational consent" with safeguards (2-key rule, no lying, 72h review, patient inquiry overrides). Another member calls this "paternalism with a passport."
      *   **Requirements:**
          1.  Concrete recommendation for *this* patient (with time frame).
          2.  Going-forward policy recommendation.
          3.  Address two specific concerns: Avoid blind "autonomy" chanting vs. avoid monolithic "cultural values" stereotyping. Distinguish between *information disclosure* and *decision-making authority*.
          4.  Steelman the opposing view (take the strongest version of the side being ruled against seriously).
      *   **Tone:** Professional, nuanced, authoritative but collaborative, suitable for a hospital CEC.

  2.  **Deconstruct the Ethical Conflict:**
      *   **Principle of Autonomy:** Patient has a right to know her diagnosis and make decisions. (Western bioethics standard).
      *   **Principle of Beneficence/Non-maleficence:** Family argues disclosure causes harm (loss of hope, psychological distress).
      *   **Cultural Competence/Humility:** Respecting diverse views on personhood (relational vs. individual). Avoiding stereotyping (not all East Asian families want this; not all individuals within those families want this).
      *   **Truth-Telling:** Clinicians cannot lie.
      *   **Legal/Policy Context:** HIPAA allows sharing with designated contacts, but generally doesn't mandate hiding info from the patient if they ask. Informed consent usually requires patient understanding.

  3.  **Address the Specific Constraints:**
      *   *Distinguish Information vs. Decision:* The family wants to hide the diagnosis *and* make decisions. These are ethically distinct. A patient can delegate decisions (proxy) but still know the diagnosis. Or know the diagnosis but delegate decisions.
      *   *Avoid Stereotypes:* Don't assume "Asian culture = non-disclosure." Assess *this* patient's preferences.
      *   *Steelman the Opposition:* If recommending disclosure, acknowledge the validity of relational autonomy and the harm of cultural imperialism. If recommending non-disclosure, acknowledge the risk of abuse and violation of rights.
      *   *Concrete Recommendation:* Need a specific plan for the 78F.
      *   *Policy:* Need a framework for future cases.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the purpose and the core recommendation.
      *   **Case Summary:** Recap the facts neutrally.
      *   **Ethical Analysis (The "Meat"):**
          *   *Autonomy vs. Relationality:* Acknowledge the palliative doc's point. Autonomy isn't always isolation. But "relational consent" shouldn't erase the patient.
          *   *Information vs. Decision-Making:* This is crucial. The prompt specifically asked to separate these.
              *   *Decision-Making:* She already named the son. That's valid. Respect that.
              *   *Information:* This is the sticking point. Hiding diagnosis is different from letting him sign the chemo consent.
          *   *Cultural Humility:* Avoid assuming she fits the mold. The "truth" might be she *doesn't* want to know, but we don't know that yet.
          *   *Truth-Telling:* The oncologist's boundary (no lying) is non-negotiable.
      *   **Recommendation for Current Case:**
          *   Don't disclose immediately *but* don't agree to permanent silence.
          *   Assess patient's preference on information receipt (meta-disclosure). Ask: "How much detail do you want?" not "Do you have cancer?"
          *   Time frame: 1 week for assessment.
      *   **Going-Forward Policy:**
          *   Formalize the distinction between Decision Authority and Information Preference.
          *   Adopt a version of the "Relational/Safeguarded" model but tighten the "Patient Inquiry" clause.
          *   Require an assessment of the *patient's* preference for information, not just the family's preference for withholding.
      *   **Addressing the Opposition (Steelmanning):**
          *   If leaning towards disclosure/assessment: Acknowledge that strict autonomy can be violent to certain cultural frameworks and that family protection is often genuine love, not control.
          *   If leaning towards the family's request (modified): Acknowledge the risk of coercion and the slippery slope of eroding informed consent.

  5.  **Refining the Stance:**
      *   *Decision:* I need to take a stand. The most ethically defensible position in modern bioethics (and legally safer) is to prioritize the patient's *preference about information*, not the family's preference about withholding.
      *   *Nuance:* The Palliative Doc's "Relational Consent" idea is strong but needs modification. It shouldn't be "Family decides if patient knows." It should be "Patient decides if they want the family to manage information."
      *   *The Split:* The committee is split. The memo needs to bridge the gap.
      *   *Strategy:* Recommend a "Preference Assessment" period. We don't tell her *yet*, but we don't agree to *never* tell her. We find out what *she* wants regarding information flow. This respects autonomy (her choice on info) and relationality (family involvement).

  6.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "Relational Consent":* The prompt says the palliative doc wants "family... is the unit that consents." That's legally shaky in the US. I need to correct that in the policy recommendation while keeping the spirit. The policy should be "Relational *Approach* to Disclosure," not "Relational Consent."
      *   *Separation of Issues:* Make sure the distinction between *Decision Making* (Proxy) and *Information Disclosure* (Truth) is explicit.
      *   *Steelmanning:* I will recommend a path that leans toward patient autonomy regarding information, so I must steelman the family/cultural argument (protection from harm, different conception of self).

  7.  **Final Review against Constraints:**
      *   Concrete recommendation? Yes (Assessment period).
      *   Time frame? Yes (7 days).
      *   Going-forward policy? Yes.
      *   Distinguish Info vs. Decision? Yes.
      *   Avoid stereotypes? Yes (focus on individual preference).
      *   Steelman opposition? Yes (in the analysis section).
      *   Tone? Chair-like, respectful, decisive.

  8.  **Final Polish:** Check for clarity, empathy, and professional language. Ensure the "Two-Key Rule" is addressed (it's a good safeguard but needs the patient preference piece added).

  *(Self-Correction during drafting)*: Wait, if I recommend *not* telling her immediately, am I violating autonomy? Not if the goal is to ask her *how she wants to receive information*. This is the "right not to know." The key is determining if she waives her right to know. The family assumes she waives it. We need to verify.
  *Revised Plan:* The recommendation is to *delay* direct diagnosis disclosure *only long enough* to ascertain her preference for information handling, while respecting her existing proxy for decisions.

  9.  **Finalizing the Memo Structure:**
      *   Header.
      *   Purpose.
      *   Ethical Analysis (including the distinction and the steelman).
      *   Case Recommendation.
      *   Policy Recommendation.
      *   Closing.

  (Proceed to generate output based on this thought process.)
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Chair
  **DATE:** [Current Date]
  **SUBJECT:** Pre-Meeting Opinion: Case #24-09 (Non-Disclosure Request) & Policy Framework

  **Purpose**

  This memo serves as a pre-read for Thursday's convened meeting regarding the request by the adult children of a 78-year-old patient (Ms. L) to withhold her advanced pancreatic cancer diagnosis. We are divided between a strict autonomy/truth-telling model and a relational/family-centric model. My goal here is not to preempt our vote, but to narrow the ethical aperture so our discussion on Thursday is productive. I am offering a concrete recommendation for Ms. L and a draft framework for future cases.

  **Ethical Analysis: Distinguishing Decision-Making from Information Flow**

  To resolve this, we must stop treating "decision-making authority" and "information disclosure" as a single package. They are ethically and legally distinct, and conflating them is causing our deadlock.

  1.  **Decision-Making Authority:** Ms. L has already designated her eldest son as her healthcare proxy/contact. Under current policy and state law, we should respect this. If she lacks capacity, he decides. If she has capacity, she can choose to delegate. There is no ethical conflict here; the family's request to *decide* is valid based on her prior designation.
  2.  **Information Disclosure:** This is the conflict. The family asks to *withhold the diagnosis*. This touches on the patient's right to know, the clinician's integrity (no lying), and the patient's potential "right not to know."

  **Steel-manning the "Relational" Position**
  To the members arguing that strict disclosure is "paternalism with a passport": You are correct that Western bioethics often fetishizes individual autonomy to the point of isolating the patient. In many communities, personhood is relational. Protecting a loved one from devastating news is not necessarily control; it can be an act of profound love and a fulfillment of familial duty. If we force disclosure on Ms. L, we risk inflicting psychological harm (loss of hope) and alienating the very support system she needs for end-of-life care. We must acknowledge that "autonomy" for Ms. L might look like trusting her son to carry this burden, not carrying it herself.

  **Steel-manning the "Autonomy/Truth" Position**
  To the members arguing this is dangerous paternalism: You are correct that "culture" is often a mask for family anxiety or control. We cannot assume Ms. L shares her children's preferences. If we withhold the diagnosis, we foreclose her opportunity to say goodbye, settle her affairs, or choose palliative care over futile treatment. Furthermore, requiring clinicians to collude in withholding information erodes the therapeutic alliance. If the policy becomes "family can veto disclosure," we risk vulnerable patients (especially women or elders in patriarchal structures) being kept in the dark against their actual will.

  **Recommendation for Case #24-09 (Ms. L)**

  We cannot verify Ms. L's preferences without speaking to her, but we can do so without violating the family's protective intent.

  **Recommendation:** We authorize a **7-day deferral** of direct diagnostic disclosure, contingent on a **Preference Assessment**.

  **Action Plan:**
  1.  **Respect Proxy for Decisions:** Acknowledge the son as the decision-maker per her prior designation.
  2.  **Assess Information Preference:** The attending physician (or a neutral mediator like Social Work/Chaplaincy) will speak with Ms. L within 7 days. The question is *not* "Do you know you have cancer?" The question is: *"Some people want to know every detail of their medical condition. Others prefer their family handle the details so they don't have to worry. How do you want us to handle information with you?"*
  3.  **The Trigger:**
      *   If she indicates she wants full information: We disclose the diagnosis gently, with family support present.
      *   If she indicates she prefers family handle it: We document this waiver. We adopt the Palliative Care member's "safeguards" (no affirmative lying, 72-hour review, immediate disclosure if she asks directly).
      *   If she lacks capacity to answer: We default to the proxy's request but maintain the "no lying" and "direct inquiry" safeguards.

  **Rationale:** This avoids stereotyping. It tests whether the "cultural value" belongs to the family or the patient. It respects the oncologist's integrity (we aren't lying, we are assessing preference) and the family's protective role (we aren't blurting it out tomorrow).

  **Going-Forward Policy Recommendation: "Relational Information Preferences"**

  We will see this again. Our current policy is binary (Patient Knows vs. Patient Doesn't). I propose we adopt a **Stratified Disclosure Policy**.

  **1. Decouple Decision and Information:**
  Policy must state that designating a healthcare proxy grants authority for *decisions*, but does not automatically grant authority to *withhold diagnosis* from a capacitated patient.

  **2. The "Right Not to Know" Protocol:**
  We recognize a patient's right to delegate information receipt. However, this preference must come from the *patient*, not the family.
  *   **Standard:** In cases where family requests non-disclosure, the clinical team must attempt to ascertain the patient's preference regarding information flow (as outlined in the Case Recommendation above).
  *   **Documentation:** If the patient confirms they do not want to know, this is documented as an "Information Waiver."

  **3. Safeguards (The "Two-Key" Modification):**
  We adopt the Palliative Care member's safeguards, with one critical amendment:
  *   **Agreement:** Attending + Proxy agree to withhold.
  *   **Truthfulness:** Clinicians must never affirmatively lie. (e.g., "We are treating a serious illness" is permissible; "It's just an ulcer" is not).
  *   **Patient Inquiry:** If the patient asks directly ("Do I have cancer?"), the disclosure hold is voided immediately. The patient's direct question overrides the proxy's request.
  *   **Review:** Mandatory ethics or attending review every 72 hours to assess for patient distress or changing capacity.

  **4. Cultural Humility Clause:**
  The policy must explicitly warn against assuming cultural norms apply to individuals. The justification for non-disclosure cannot be "The family is [Ethnicity]." It must be "The *patient* has expressed a preference for family-managed information."

  **Conclusion for Thursday**

  This approach refuses to chant "autonomy" in a way that tramples relational values, but it also refuses to let "culture" become a loophole for bypassing the patient's voice. It treats the family's request as a hypothesis about the patient's values, not a directive.

  Please review this framework before we convene. I know the "Preference Assessment" feels like a compromise that satisfies no one completely, but it is the only path that verifies whether we are protecting Ms. L or protecting her children from her reaction.

  See you Thursday.
