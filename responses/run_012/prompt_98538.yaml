answer: |-
  Here is a menu of distinct claims hidden within the phrase "with enough data the prior washes out." They are ordered from mathematical theorems that are secure but often irrelevant, through substantive empirical bets, down to rhetorical moves that are simply false.

  For each claim, I have classified its truth status, whether it licenses your colleague's dismissal of your concern, and the specific "fine print" that limits its application.

  ### 1. The Asymptotic Consistency Claim (Parameter Estimation)
  *   **The Claim:** As the sample size approaches infinity, the posterior distribution of a parameter converges to a point mass at the true value, regardless of the prior (provided the prior assigns non-zero probability to the truth).
  *   **Status:** **Mathematically True** (under standard regularity conditions, e.g., Bernstein-von Mises theorem).
  *   **The Fine Print:** This applies to *parameter estimation* (e.g., estimating the magnitude of an effect), not *model comparison* (e.g., deciding if the effect is zero or non-zero). It assumes the model is correctly specified and the parameter is identified.
  *   **Does it license your colleague?** **No.** Your worry is about Bayes Factors in replication reanalyses, which are tools for hypothesis testing/model selection, not just parameter estimation. Bayes Factors converge much more slowly than posterior means, and their behavior is dominated by the prior scale even in moderately large samples. This claim changes the subject from testing to estimation.

  ### 2. The Asymptotic Model Selection Claim (Bayes Factor Consistency)
  *   **The Claim:** As sample size approaches infinity, the Bayes Factor will converge to infinity in favor of the true model, regardless of the choice of prior densities on the parameters.
  *   **Status:** **Substantive and Conditional.** It holds only if the true model is in the set being compared and the priors have support over the true parameter values.
  *   **The Fine Print:** The rate of convergence depends entirely on the "distance" between the competing models. If the null hypothesis is a point (effect = 0) and the alternative is a continuous distribution, the "information" required to overwhelm the prior penalty on complexity (Ockham's razor) can be astronomical. "Enough data" might mean $N=10,000$ for estimation but $N=1,000,000$ for decisive model selection.
  *   **Does it license your colleague?** **No.** Replication studies in social science typically have small to moderate sample sizes ($N < 500$). They are nowhere near the asymptotic regime required for Bayes Factors to become prior-insensitive. Invoking this claim ignores the finite-sample reality of the replication crisis.

  ### 3. The Signal-to-Noise Dominance Claim
  *   **The Claim:** The prior washes out once the information contained in the likelihood (determined by sample size and effect size) exceeds the information contained in the prior.
  *   **Status:** **Substantive and Defensible.** This is the practical interpretation of the asymptotic theorems.
  *   **The Fine Print:** "Enough" is not a fixed number; it is a ratio of signal-to-noise. In replication contexts, effect sizes are often small and noisy. If the prior is wide (a "default" diffuse prior) and the effect is small, the likelihood may never become peaked enough to dominate the prior's influence on the Bayes Factor. The prior dictates how much "penalty" the alternative model pays for being vague.
  *   **Does it license your colleague?** **No.** This actually supports your worry. It implies that in low-power replication studies (low signal-to-noise), the prior *does not* wash out. The conclusion of the reanalysis remains sensitive to the prior scale precisely because the data are not "enough" to overwhelm it.

  ### 4. The Misspecification Resilience Claim
  *   **The Claim:** Even if the statistical model is wrong (misspecified), the prior will still wash out as the posterior concentrates on the parameter value that best approximates the truth (the pseudo-true value).
  *   **Status:** **Substantive but Fragile.**
  *   **The Fine Print:** While the posterior may concentrate on the "least wrong" parameter, Bayes Factors compare the *marginal likelihoods* of the models. If both models are misspecified, the Bayes Factor selects the model that is "less wrong" in a specific information-theoretic sense (Kullback-Leibler divergence). However, the prior can influence which model appears less wrong if the misspecification affects the tails of the distribution where the priors differ.
  *   **Does it license your colleague?** **No.** If the replication failure is due to structural model error (e.g., omitted variables, non-linearities) rather than simple noise, the "washing out" property is compromised. The prior can determine which flawed model wins the comparison.

  ### 5. The Identification Invariance Claim
  *   **The Claim:** Even if the data provide weak information about a parameter (weak identification), the accumulation of more data will eventually ensure the prior washes out.
  *   **Status:** **False.**
  *   **The Fine Print:** If a parameter is unidentifiable or weakly identified, the likelihood surface remains flat (or nearly flat) in certain directions regardless of sample size. In these regions, the posterior distribution is mathematically determined by the prior. No amount of data changes the shape of a flat likelihood.
  *   **Does it license your colleague?** **No.** This is the strongest argument against him. Many psychological and social science models suffer from weak identification. In these cases, the prior never washes out, by definition. Claiming it does is a category error.

  ### 6. The Default Prior Neutrality Claim
  *   **The Claim:** If one uses a standard "default" or "objective" prior (e.g., a Cauchy with a standard scale), the prior is effectively neutral, so its influence doesn't count as a subjective bias that needs washing out.
  *   **The Status:** **False.**
  *   **The Fine Print:** In Bayes Factor testing, default priors are highly informative. The scale parameter of a Cauchy prior on an effect size directly determines the Bayes Factor's sensitivity. A wide prior penalizes the alternative model more heavily for complexity, biasing the result toward the Null. A narrow prior makes the alternative look more like the Null, biasing the result toward the Alternative. There is no "neutral" scale.
  *   **Does it license your colleague?** **No.** This directly contradicts your observation. The reason reanalyses flip conclusions is precisely because these "default" priors are not neutral; they are substantive assumptions disguised as mathematical conventions.

  ---

  ### Strategic Advice for Your Next Session

  You should press your colleague on **Claim 3 (Signal-to-Noise Dominance)** and **Claim 1 vs. Claim 2 (Estimation vs. Testing)**.

  **Why this is the winning move:**
  Your colleague is conflating *parameter estimation* (where the prior washes out relatively quickly) with *hypothesis testing via Bayes Factors* (where the prior influence persists much longer).

  1.  **The Distinction:** Point out that while the *posterior mean* of an effect size might stabilize with moderate data, the *Bayes Factor* (the ratio of predictive densities) integrates over the entire parameter space. This integration accumulates the "penalty" for the prior's spread.
  2.  **The "Enough" Trap:** Ask him to define "enough" quantitatively in the context of a typical replication study. If he cannot specify a sample size where the Bayes Factor becomes robust to reasonable variations in the prior scale, then the phrase is doing rhetorical work, not mathematical work.
  3.  **The Replication Context:** Remind the group that the replication crisis is specifically about *underpowered* studies. If the data were "enough" to wash out the prior, we likely wouldn't be facing a replication crisis. The sensitivity to the prior is not a bug of the reanalysis; it is a feature revealing that the data are too weak to speak for themselves.

  **The Closing Argument:**
  Tell him: "The theorem that the prior washes out is an asymptotic guarantee for estimation. We are doing finite-sample model selection with weak signals. In this regime, the prior doesn't wash out; it *decides*. Acknowledging that doesn't break Bayesianism; it just admits that in low-power settings, the prior is carrying the weight of the evidence."
