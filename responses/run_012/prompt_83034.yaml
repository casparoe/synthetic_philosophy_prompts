answer: |-
  Here are ten questions designed to press the guest's specific framework without asking her to rehash the basics. They are ordered to build tension throughout the interview, with follow-ups keyed to the responses she is most likely to give based on the position you described.

  **1. The Parasitism of Friendship**
  "You argue that 'taken' forces like promising are parasitic on practices that allow others to hold us to account. But consider a promise between two friends in a vacuum—no institutions, no witnesses, just a moral commitment. If you say that's still a practice, aren't you stretching the word 'practice' so thin it just means 'moral norm'? Where is the conventionality in a private promise?"

  **2. Follow-up (If she insists friendship *is* the practice):**
  "If the 'practice' is just the mutual expectation of fidelity between friends, what separates that from a raw moral obligation? If the force comes from the *holding*, not the *authorizing*, aren't you just saying morality is conventional all the way down? And if you are, how do you explain the feeling that I *ought* to keep a promise even if I know you'd never hold me to it?"

  **3. The Chatbot as Pen vs. Party**
  "Let's move to the chatbot. You say it can't accept Terms of Service because it lacks standing. But if a company publicly states, 'We treat the bot's output as binding on us,' haven't they conferred standing *through* the bot? Why is the bot a 'pen' the company writes with, rather than a delegated agent like a junior lawyer whose signature binds the firm?"

  **4. Follow-up (The De Facto Usurper):**
  "Here's the pressure point on that: Imagine a de facto usurper—someone who seizes a chair of power without authorization, but everyone obeys their orders. By your logic, since the community holds them to their commands and obeys them, they seem to have standing. If obedience generates standing, why can't a chatbot generate standing if we all agree to treat it as a party? What actually blocks the bot that doesn't also block the usurper?"

  **5. Uptake and the Refused Apology**
  "You locate force in the availability of being held to account. But what about uptake? If I apologize and you refuse to hear it, or I resign and you ignore it and keep scheduling me shifts—has the act failed? If the force depends on *your* ability to hold me, does that make the recipient the one who actually wields the power, not the speaker?"

  **6. Follow-up (If she says the act is incomplete without uptake):**
  "If uptake completes the act, then I can't resign unless my boss accepts it. That seems to get the power dynamic backwards. Are you willing to say that in those cases, I simply *haven't* resigned? Or is there a distinction between the act being *done* versus the act being *effective*, and if so, where does the 'force' live in that gap?"

  **7. Degrees of Standing**
  "Is standing binary, or does it come in degrees? If a lifeguard yells 'Get out of the water' and a random stranger yells the same thing, both are warning me. But the lifeguard's warning carries a weight the stranger's lacks. Is that a difference in the *kind* of act, or just a difference in the *degree* of standing conferred by the practice?"

  **8. Follow-up (If she says it's a difference in kind):**
  "If it's a difference in kind, where do we draw the line? If I'm a senior citizen warning a kid about thin ice, I have no official standing, but more than a toddler. If standing is scalar, doesn't that blur your hard line between 'conferred' force and 'taken' force? It starts to look like a spectrum of social authority rather than two distinct buckets."

  **9. The Insincere Promise**
  "Austin distinguished between a 'misfire' (the act didn't happen) and an 'abuse' (the act happened but was insincere). If I promise you with no intention of keeping it, have I performed a hollow act, or did the act misfire entirely? If standing is the requirement, and I have the standing, does my secret intention matter to the *existence* of the promise, or only to its ethics?"

  **10. The Falsification Condition**
  "Finally, a metaphilosophical check. Your whole framework rests on the necessity of social standing for illocutionary force. What would have to be true—conceptually or empirically—for you to give up the standing requirement entirely? Is there a case of a performative that works in total isolation that would break your theory, or is this a protected belt that no counter-example could pierce?"
