answer: |-
  # DECISION TREE: THE HETEROGENEITY PROBLEM

  **ROOT:** Does the class of states we call "pleasures" share a **single, shared natural property**?

  *   **NO** (Anti-Realism about the Kind)
      *   **Q:** How is the category "pleasure" sustained without a single property?
          *   **A:** It is a **determinable** (like "colour"), with specific pleasures as determinates (like "red").
              *   **LEAF 1: Determinable Pluralist**
              *   *Awkward Commitment:* Cannot specify the genus "pleasure" without listing the species, making the theory circular.
          *   **A:** It is a **disjunctive lump** (like "jade"), grouping unrelated states by accidental similarity.
              *   **LEAF 2: Jade-Style Nominalist**
              *   *Awkward Commitment:* Must explain why *this* arbitrary list, and not another, grounds objective moral value.
          *   **A:** It is a **fiction**, but the term is retained for policy or shorthand.
              *   **LEAF 3: Eliminativist Hedonist**
              *   *Awkward Commitment:* Advocates maximizing a property they admit does not exist (self-contradiction).

  *   **YES** (Realism about the Kind)
      *   **Q:** Must this single property perform **BOTH** jobs (Uniting instances *and* Ranking value)?
          *   **NO** (Dual-Component: One property unites, a different metric ranks)
              *   **Q:** Is the unifying property introspectively accessible?
                  *   **YES:** **Q:** What is the ontological category of the unifying property?
                      *   **A:** A raw phenomenal feel (intensity ranks value).
                          *   **LEAF 4: Qualitative Hedonist (Feeling-Unity)**
                          *   *Awkward Commitment:* Must posit "quality" as a second dimension without collapsing back into a single metric.
                      *   **A:** A pro-attitude (strength of desire ranks value).
                          *   **LEAF 5: Qualitative Hedonist (Attitude-Unity)**
                          *   *Awkward Commitment:* Risks making "pleasure" synonymous with "what is desired," losing normative bite.
                  *   **NO:** (Subpersonal unity, external ranking)
                      *   **LEAF 6: [UNOCCUPIED]**
                      *   *Status:* **Unexplored.** Likely unattractive; if the subject can't feel the unity, why should it ground their rational pursuit?
          *   **YES** (Strict: One property does both jobs)
              *   **Q:** Is the common property **introspectively accessible** to the subject?
                  *   **NO** (Subpersonal/Functional)
                      *   **LEAF 7: Functional-Role Hedonist**
                      *   *Awkward Commitment:* Must accept "inverted spectrum" cases where subjects feel nothing but still count as pleased.
                  *   **YES** (Phenomenal/Accessible)
                      *   **Q:** What is the ontological category of this property?
                          *   **A:** A distinctive **feeling-tone** present in all instances.
                              *   **LEAF 8: Unitary Feeling-Tone Hedonist**
                              *   *Awkward Commitment:* Must deny the phenomenological intuition that a headache's relief and a proof's success feel nothing alike.
                          *   **B:** A **pro-attitude** (liking/wanting) toward the experience.
                              *   **LEAF 9: Attitudinal Hedonist**
                              *   *Awkward Commitment:* Must count cases of "mistaken liking" (e.g., enjoying what one judges bad) as genuine pleasure.
                          *   **C:** A **perception of value** in the object/experience.
                              *   **LEAF 10: Perception-of-Value Hedonist**
                              *   *Awkward Commitment:* Commits to a robust moral realism where pleasure is a cognitive detection of objective good.

  ***

  ### NOTES ON THE LOGICAL SPACE

  **Indistinguishable Leaves:**
  *   **Leaf 8 (Feeling-Tone) vs. Leaf 9 (Attitudinal):** In practice, these are hard to separate. A "feeling of liking" (Attitudinal) is often phenomenologically identical to a "positive feeling-tone" (Feeling). The tree separates them ontologically, but introspection may not verify the distinction.

  **Unoccupied Branches:**
  *   **Leaf 6 (Dual-Component/Subpersonal):** This slot is empty. It is logically possible to claim a subpersonal property unites pleasures while a separate phenomenal metric ranks them, but no major theory occupies this space. It is likely **unattractive** because it severs the link between what makes a state a pleasure and what makes it feel good to the agent.

  **Structural Flags:**
  *   **The "Jobs" Split:** Notice how the **NO (Dual-Component)** branch (Leaves 4–6) avoids the heterogeneity problem by admitting the unifying property isn't enough to rank value (allowing Mill's "higher pleasures"), whereas the **YES (Strict)** branch (Leaves 7–10) must argue that heterogeneity is an illusion or that the single property (e.g., "attitude") is flexible enough to cover all cases.
  *   **The "Introspection" Split:** This cuts across the Realist branch. Leaf 7 (Functional) and Leaf 8 (Feeling) might agree on the *science* of pleasure but disagree on whether the *subject* needs to know it. This distinguishes psychological hedonism from philosophical hedonism.
