      *   **Clash 2: Prop 3 (Fog) + Prop 6 (Binary Knowledge).**
          *   Why: If knowledge is strictly binary (Prop 6), but the phenomenon is vague (Prop 3), there must be a sharp cutoff for knowledge. This feels counterintuitive (epistemicism), but logically possible. It clashes with the *spirit* of Prop 3, but not strictly the letter.
