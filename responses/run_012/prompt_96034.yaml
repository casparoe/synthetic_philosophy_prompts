      *   *Prop 2 (Sensitivity):* A standard epistemic condition (Nozick-style tracking). If $P$ were false, I wouldn't believe $P$.
      *   *Prop 3 (Vagueness):* Phenomenological vagueness. Borderline cases exist.
      *   *Prop 4 (Bivalence):* Metaphysical precision. There is a fact of the matter even in the fog.
      *   *Prop 5 (KK for Pain):* Strong introspection.
      *   *Prop 6 (Binary Knowledge):* Epistemic sharpness. No "sort of knowing."

      *   *Major Clash A: Prop 1 (Infallibility) vs. Prop 2 (Wobble/Sensitivity).*
          *   If I can't be wrong about pain (Prop 1), then in nearby possible worlds where I *don't* have pain, would I still believe I do?
          *   If Prop 1 is true, my belief is necessarily true (in the actual world context). But Prop 2 says if the facts nudged (no pain), my belief should change.
          *   If the "fog zone" (Prop 3) exists, a tiny nudge moves me from pain to no-pain. If I still say "I'm in pain" in the fog zone, do I satisfy the wobble test?
          *   *Conflict:* Infallibility often violates Sensitivity. If I *cannot* be wrong, my belief doesn't track the truth across worlds; it just stays fixed on "I feel pain."
          *   *Severity:* High. This is a classic epistemological problem (Cartesian certainty vs. Reliabilism/Tracking).

      *   *Major Clash B: Prop 3 (Vagueness) vs. Prop 4 (Precision) vs. Prop 6 (Binary Knowledge).*
