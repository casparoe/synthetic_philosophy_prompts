          *   *Brabantio:* Accusation of manipulation as denial of agency. Crucial point. To call love "witchcraft" is to deny Desdemona's rationality. The play validates Desdemona's agency against Brabantio, but then Iago destroys it from within.
      *   **Truth/Deception:** Manipulation $\neq$ Deception. Iago tells truths (Cassio has the kerchief) to support a lie (Desdemona gave it to him). This is *paltering* or *misleading implication*. It shows manipulation is about *directionality of inference*, not just truth value of propositions.
      *   **Relationship/Trust:** This is the core. Iago is "Honest Iago." The manipulation works *because* of the epistemic authority granted to him. The wrong is betrayal.

  4.  **Drafting the Response - Section by Section:**

