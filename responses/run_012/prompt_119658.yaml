          *   Brabantio point: Accusing someone of manipulation denies their agency. The play shows this is a tragic error (Desdemona *did* choose), but Iago proves Brabantio's fear (agency *can* be undermined) right in a different way.
      *   **Section 4: Where the Theory Breaks (Iago's Motive).**
          *   "I am not what I am." But also "I know not if't be true."
          *   Motivelessness malignity (Coleridge). If manipulation requires a tidy intentional aim, Iago breaks it. He enjoys the *process* of control, not just the outcome.
          *   This suggests manipulation can be expressive, not just instrumental.
      *   **Conclusion:** Summarize the "Reading." The play argues manipulation is a *social vice*, a corruption of the web of trust, not just an individual cognitive violation.

  5.  **Refining and Polishing:**
