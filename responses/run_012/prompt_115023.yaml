  You are quite right that we learn our first lessons of conduct from the faces of those around us. Yet history shows whole nations may approve of monstrous acts.

  Where you haven't
  But you mistake the Spectator for a mere echo of the present company. This judge within is not the neighbor drunk on passion, but the neighbor cooled by time and stripped of self-interest. We endeavor to view our conduct through the eyes of another who is candid and informed. When a solitary man stands against a mob, he appeals to a different audience. He imagines how mankind ought to feel, not merely how they do feel. I grant you, the Spectator is born from society, yet like a child grown to manhood, he may correct his parents. If you act wrongly, no amount of public praise can silence the shame you feel alone in your chamber. Conversely, the martyr finds comfort in blame because his internal judge acquits him. This truly proves the tribunal is very distinct from the crowd's fleeting whim. The Spectator holds a standard by which we measure the very crowd itself. We teach him to disregard the clamor of faction. Without this, morality is nothing but fashion, and I cannot believe you truly think virtue is merely what is currently popular.

  What I'd ask you back
  If you deny this inner judge, I ask, on what ground do you stand to call the crowd wrong today rather than merely waiting for them to change tomorrow?
