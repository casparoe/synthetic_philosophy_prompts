answer: |-
  **Project Title:** The Robustness Frontier: Quantifying the Trade-off Between Statistical Fragility and Causal Assumption in Simpson's Paradox

  **Project Summary**
  Standard causal inference treats Simpson's Paradox as a resolved problem: once the causal graph is known, the correct adjustment set is determined, and the paradox dissolves. However, in high-stakes disputes (litigation, policy, medicine), the causal graph is rarely known; it is the very object of the dispute. This project proposes that the substantive conflict in Simpson's Paradox cases is not about "which table is true," but about the trade-off between the *statistical fragility* of the reversal and the *strength of the causal assumption* required to license aggregation. I propose to develop a "Robustness Frontier" metric that quantifies this trade-off for 2x2x2 contingency tables. The goal is to replace binary judgments of "fallacy" with a continuous diagnostic of epistemic risk.

  **The Research Question**
  To ensure the project yields a determinate answer rather than open-ended philosophical speculation, the core question is formal:

  *For any 2x2x2 contingency table exhibiting Simpson's Paradox, can we derive a closed-form bound relating (a) the minimum Euclidean distance to the nearest non-paradoxical table (Statistical Fragility) and (b) the minimum confounding strength required to render the aggregated estimate biased relative to the stratified estimate (Causal Assumption Strength)?*

  If such a bound exists, it provides a deterministic mapping for any given dataset. The secondary, interpretive question is whether plotting real-world disputes on this frontier clarifies the locus of disagreement (e.g., are disputants arguing about the data stability or the causal mechanism?).

  **Motivation: Beyond the Artifact/Deep-Problem Split**
  The literature currently bifurcates into two camps. The "artifact" camp views the paradox as a mathematical curiosity resolved by conditioning on the correct variables. The "deep problem" camp views it as an indictment of probabilistic relevance. Both camps assume the causal structure is either known or unknowable.

  This leaves a critical gap: **Epistemic Uncertainty about Structure.** In practice, researchers argue about whether a variable is a confounder or a collider. The standard advice ("draw a DAG") offers no guidance when the DAG is contested. By quantifying how "expensive" a causal assumption is (in terms of required confounding strength) relative to how "fragile" the statistical reversal is, we can adjudicate disputes without requiring consensus on the true graph. If a reversal disappears with a 1% perturbation of cell counts, but licensing the aggregated table requires assuming a massive confounding effect, the stratified estimate wins on efficiency grounds. If the reversal is robust but the causal assumption is weak, the aggregated estimate may be preferable. The current literature lacks the vocabulary to make this comparison.

  **Work Plan (12-Week Semester)**

  *   **Weeks 1–3: Formalizing the Metrics.**
      *   Define "Statistical Fragility" ($F$): The minimum perturbation to cell counts (normalized) required to eliminate the sign reversal between aggregated and stratified odds ratios.
      *   Define "Assumption Strength" ($A$): Using sensitivity analysis parameters (e.g., E-values or confounding risk ratios), calculate the minimum unmeasured confounding required to justify ignoring the stratification.
      *   Derive the algebraic relationship between $F$ and $A$ for the 2x2x2 case.

  *   **Weeks 4–7: Case Study Application.**
      *   Select two canonical cases (e.g., Berkeley Admissions, a clinical trial with dropout) and one contemporary policy case (e.g., algorithmic fairness in lending).
      *   Re-analyze the data not to find the "truth," but to plot each case on the $F$-$A$ plane.
      *   Interview or review transcripts from the original disputes to identify where the actual disagreement lay (data quality vs. causal mechanism) and compare with the metric's diagnosis.

  *   **Weeks 8–10: Synthesis and Visualization.**
      *   Develop the "Robustness Frontier" visualization: a plot where the region of "safe aggregation" is separated from "necessary stratification" by a curve derived in Weeks 1–3.
      *   Draft the core argument: that Simpson's Paradox disputes are implicitly arguments about where to sit on this frontier.

  *   **Weeks 11–12: Final Polish.**
      *   Complete the manuscript (target: 1 journal article or 1 book chapter).
      *   Prepare a workshop presentation focusing on the diagnostic tool.

  **Success Criteria: Avoiding "Decision Theory with Extra Notation"**
  A major risk is that this project merely restates the standard decision-theoretic injunction to "weigh costs of error against probability of model misspecification." To avoid this, success is defined by **specificity and computability**:

  1.  **Diagnostic, Not Normative:** The output must not tell the user what to *do* (decision theory); it must tell the user what the *cost* of their choice is (sensitivity analysis). If the output is a utility function, I have failed. If the output is a plot of "Minimum Confounding vs. Minimum Perturbation," I have succeeded.
  2.  **Closed-Form Derivation:** The relationship between fragility and assumption strength must be derived algebraically for the 2x2x2 case, not simulated via Bayesian priors. This distinguishes it from general robustness checking.
  3.  **Dissolving the Paradox Talk:** Success is achieved if the final manuscript demonstrates that labeling a case "Simpson's Paradox" adds no information beyond locating it on the Frontier. If the metric allows us to say "This is a high-fragility reversal" instead of "This is a paradox," the conceptual work is done.

  **Scope and Feasibility Assessment**
  A single semester is **sufficient, but only with strict constraints**.

  *   **Constraint 1: Binary Variables Only.** I will restrict the formal work to 2x2x2 tables. Extending to continuous variables or larger DAGs invites infinite complexity. The 2x2x2 case is where the paradox is most intuitive and the algebra is tractable.
  *   **Constraint 2: Two Deep Cases.** I will limit the empirical work to two fully worked cases rather than five superficial ones. The value is in the depth of the re-analysis, not the breadth of the survey.
  *   **Constraint 3: No New Software.** I will use existing statistical environments (R/Python) for calculation, not build a new package. The deliverable is the mathematical framework and the paper, not a tool for others to use immediately.

  If I attempt to generalize the metric to arbitrary DAGs or incorporate continuous treatments, the semester will be consumed by derivation. By holding the geometry constant (2x2x2), I can focus on the philosophical and statistical interpretation of the trade-off, which is the core contribution.

  **Conclusion**
  This fellowship will allow me to convert a philosophical hunch into a statistical diagnostic. By shifting the focus from "resolving" Simpson's Paradox to "measuring" its epistemic cost, the project offers a pragmatic tool for researchers facing contested causal structures, turning a paradox into a parameter.
