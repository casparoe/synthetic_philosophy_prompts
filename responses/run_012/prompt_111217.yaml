prompt: |-
  I'm putting together a proposal for a small one-semester fellowship (course relief mostly, not much money) and I want to pitch something on Simpson's paradox. My half-formed thought: everyone agrees the paradox dissolves once you know the causal structure -- adjust for confounders, don't adjust for mediators, and the structure tells you which table to read -- and everyone also agrees that in a real dispute you rarely get the structure handed to you. So the interesting question isn't "which table is right" but "how much causal assumption does each aggregation buy, and how fragile is the reversal?" I want to introduce something like a fragility measure: take a reversed table and ask how far you'd have to perturb the cell counts before the reversal disappears, then plot that against the strength of the assumption you'd need to license pooling. The hunch is that real fights (a drug that looks better overall but worse in every subgroup; an admissions table that flips when you stratify) are really arguements about where to sit on that tradeoff, and that saying so deflates some of the paradox talk while sharpening the rest. Write me the proposal: the question stated precisely enough that it has a determinate answer, why the usual artifact-vs-deep-problem split leaves it open, what I'd actually do week by week (I'm thinking some formal work plus two or three worked cases), what would count as succeeding versus me just reinventing decision theory with extra notation, and whether a semester is enough or I should cut the scope. Skip citations, I'll fill those in myself.
