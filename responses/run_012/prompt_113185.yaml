answer: |-
  This is a classic pedagogical impasse, and your diagnosis is sharp—sharper than most of the literature gives you credit for. You are correctly identifying that the seminar is stuck because the students are arguing on different planes of discourse while pretending to be on the same one.

  However, I think you are being too optimistic about the tractability of the "legal-historical" question, and you need to press harder on the jurisprudential commitments underlying Camp A and Camp B. Here is the diagnosis.

  ### 1. The Legal-Historical Trap
  You hypothesize that the question *"Were these acts already criminal under customary law in 1939?"* is separable and answerable by evidence. I would push back here. This is not a neutral empirical question; it is a **theory-laden interpretive act.**

  *   **Camp A (Positivist/Strict Constructionist):** Looks for specific treaties with penal sanctions, specific precedents of individual criminal liability, and clear statutory definitions. By this metric, they are right: there was no clear positive law criminalizing *individuals* for waging war in 1939. Kellogg-Briand renounced war as an instrument of *state* policy, not individual crime.
  *   **Camp B (Natural Law/Customary Evolutionist):** Looks at the "general principles of law recognized by civilized nations," the trajectory of the Hague Conventions, and the moral consensus that aggressive war was illicit. They argue *opinio juris* had hardened even if *state practice* (prosecutions) hadn't caught up.

  **The Problem:** You cannot resolve this by digging up more treaties. Camp A will say a treaty without a penalty is not criminal law. Camp B will say a penalty is implied by the prohibition. The "history" they find is determined by the legal theory they bring to the archive. Treating this as a purely historical empirical question invites them to keep talking past each other because they disagree on *what counts as evidence of law.*

  ### 2. Validity vs. Legitimacy (The Real Split)
  Your distinction here is the strongest tool you have, but it needs to be mapped onto jurisprudence. The seminar isn't just splitting on validity vs. legitimacy; it's splitting on **what law is for.**

  *   **Camp A is arguing from a Rule of Law perspective (mostly Positivist).** Their core concern is *predictability* and *constraint on power*. If you punish someone for something that wasn't clearly a crime, you violate the principle of *nullum crimen sine lege*. For them, the "Victors' Justice" critique is a proxy for the fear that law is merely the will of the powerful. If the winners can define crimes after the fact, law offers no protection to the losers.
  *   **Camp B is arguing from a Substantive Justice perspective (mostly Natural Law or Functionalist).** Their core concern is *impunity* and *order*. For them, the "Founding Act" argument admits that positive law was insufficient, but argues that a higher legal order (humanity) was violated. They view the Tribunal not as a court applying existing rules, but as a constitutional moment creating a new legal order.

  **The Cross-Talk:**
  *   When Camp A says, "It wasn't law," they mean "It violates positivist constraints on state power."
  *   When Camp B says, "It was law," they mean "It was a necessary assertion of normative order against chaos."
  *   **Progress:** Force them to admit that **you cannot simultaneously hold the strongest version of both positions.** To defend Nuremberg fully, you must weaken *nullum crimen sine lege*. To defend *nullum crimen* fully, you must accept that the Nazi leadership might have been technically unprosecutable under strict 1939 positive law. The tension is structural, not factual.

  ### 3. Unpacking "Victors' Justice"
  You are absolutely right that "Victors' Justice" is doing three jobs. In my experience, separating these kills the momentum of the rant and forces precision.
  1.  **Bias in Procedure:** (The judges were from victor nations.) *Counter:* Would a neutral tribunal have been possible in 1945?
  2.  **Selectivity in Substance:** (Allied crimes weren't prosecuted.) *Counter:* Is selective justice better than no justice? (The "Tu Quoque" defense).
  3.  **Ex Post Facto Law:** (The crime was created after the act.) *Counter:* This is the Radbruch point.

  If you force students to argue these separately, Camp A usually collapses on point 1 (bias was unavoidable) and point 2 (selectivity doesn't negate the guilt of the accused), leaving them with point 3 (retroactivity). This isolates the real jurisprudential fight.

  ### 4. The Radbruch Formula: Relabeling or Resolution?
  Your colleague says Radbruch "just relabels the problem." Your colleague is half-right, but missing the utility.

  *   **The Colleague's Point:** Radbruch says "Unbearably unjust law is not law." But who decides what is "unbearably unjust"? If you use Radbruch to justify Nuremberg, you are admitting that positive law was insufficient. You are conceding Camp A's point that *positive law* didn't cover this, while using Camp B's *natural law* to punish them. It doesn't solve the retroactivity problem; it just asserts that the moral necessity overrides the legal prohibition.
  *   **The Utility:** However, Radbruch is useful pedagogically because it forces Camp B to articulate the **threshold**. Was aggressive war "unbearably unjust" enough to override the ban on retroactivity? Most say yes. But what about the atomic bombings? If Camp B says "Aggression is unbearable injustice," Camp A asks "Why isn't area bombing?"
  *   **Verdict:** Radbruch doesn't solve the logic, but it clarifies the **cost**. It forces Camp B to admit they are prioritizing substantive justice over procedural legality. It forces Camp A to admit they are prioritizing procedural legality over substantive justice. That is a genuine philosophical disagreement, not a factual one.

  ### 5. What Counts as Progress?
  You asked if this bottoms out in "whether the winners ever get to write the rules." It bottoms out in **what conception of law we are willing to sacrifice to prevent future atrocities.**

  Here is how you move the seminar forward:

  1.  **Stop trying to settle the history.** Tell them explicitly: "The historical record is ambiguous enough to support both narratives. Stop arguing about Kellogg-Briand. Argue about what law *should have done*."
  2.  **The "Nuremberg Paradox" Exercise.** Ask them to write a one-page brief answering this: *If you were the defense counsel at Nuremberg, what is your strongest argument? If you were the prosecutor, what is yours?* Then ask: *Can both be legally sound?* The answer is no. They rely on incompatible theories of law.
  3.  **Reframe the "Founding Act."** Ask Camp B: "If Nuremberg was a founding act, does that make it legislation or adjudication?" If it was legislation, why was it a court? If it was adjudication, where was the law? This exposes the "constitutional moment" argument.
  4.  **Concede the "Victors" Point.** Grant Camp A that it *was* victors' justice. Then ask: "Does that invalidate the verdicts, or does it just stain them?" This moves the debate from *validity* (void ab initio) to *legacy* (tainted but necessary).
  5.  **The Tokyo Test.** Use Pal's dissent not as a "gotcha" but as the control group. Pal argued that without clear law, the tribunal was just vengeance. Ask Camp B: "Is Pal wrong on the law, or wrong on the morality?" Usually, Camp B has to admit Pal was legally consistent but morally unacceptable. That admission reveals their prioritization of morality over strict legality.

  ### Summary
  Your hypothesis is right about the *structure* of the argument (validity vs. legitimacy, conflated objections), but wrong about the *tractability* of the history. The history is a Rorschach test for their jurisprudence.

  Progress looks like getting them to admit that **Nuremberg required a sacrifice.** Camp A sacrifices the punishment of supreme evil to preserve the Rule of Law. Camp B sacrifices the strict Rule of Law to punish supreme evil. Once they see it as a tragic choice rather than a puzzle to be solved, the talking-past-each-other stops. They aren't disagreeing about 1939; they are disagreeing about whether law is a shield or a sword.
