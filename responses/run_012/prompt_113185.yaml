      *   **Context:** The user teaches a seminar on the Nuremberg and Tokyo Tribunals.
      *   **Issue:** The class consistently splits into two entrenched camps (Camp A: "Victors' Justice/Ex Post Facto" vs. Camp B: "Declaratory/Founding Act") and talks past each other.
      *   **User's Hypothesis:**
          1.  The legal-historical question (was it customary law in 1939?) is separable and answerable.
          2.  The real conflict is between two different questions: *Validity* (was this valid law?) vs. *Legitimacy* (was it legitimate to do?).
          3.  "Victors' Justice" conflates three distinct objections (enforcement by winners, selective enforcement, ex post facto law).
          4.  Retroactivity and selectivity are logically independent.
          5.  Radbruch's formula is being used as a middle path, but a colleague claims it just relabels the problem.
      *   **Goal:** Diagnose the impasse. Is the hypothesis right? Is the legal-historical part tractable? What counts as progress? Does it bottom out in power politics?

  2.  **Evaluate the User's Hypothesis:**
      *   *Separability of Legal-Historical Question:* The user thinks this is answerable by evidence (state practice/opinio juris). *Critique:* This is the trickiest part. Customary international law (CIL) in the 1930s/40s was notoriously fuzzy. Both sides can cherry-pick evidence. Camp A points to lack of prosecutions/treaties. Camp B points to Kellogg-Briand, League of Nations resolutions, and general moral outrage. It's not purely empirical; it's interpretive. So, it's *less* tractable than the user thinks.
      *   *Validity vs. Legitimacy:* This is a strong distinction. Camp A focuses on legitimacy (fairness, selectivity) often disguised as validity (legality). Camp B focuses on validity (it was law) to justify legitimacy. They are talking past each other because they are using "law" to mean different things (positivist vs. natural law/functionalist).
      *   *Victors' Justice Conflation:* The user is spot on here. Selectivity, bias, and retroactivity are distinct. Conflating them muddies the water.
      *   *Radbruch's Formula:* The colleague has a point. Radbruch says "unjust law is not law." But who decides what is "unbearably unjust"? If you use Radbruch to justify Nuremberg, you admit positive law wasn't enough, which concedes Camp A's point about retroactivity. If you reject Radbruch, you struggle to condemn Nazi statutes. It *does* relabel the problem unless you have a meta-ethical framework for "unbearable injustice."

  3.  **Diagnose the Impasse (The "Talking Past Each Other" Aspect):**
      *   **Camp A (Skeptics):** Often operating from a *Positivist* framework (no law without prior command) mixed with a *Realist* critique (power politics). They care about *Rule of Law* values (predictability, non-retroactivity).
      *   **Camp B (Defenders):** Often operating from a *Natural Law* or *Functionalist* framework (law serves justice/order) mixed with *Idealism*. They care about *Substantive Justice* (punishing evil) and *System Building* (creating a future order).
      *   **The Clash:** It's not just about history; it's about the *purpose of law*. Is law a shield against power (A) or a sword for justice (B)?

  4.  **Address the Specific Questions:**
      *   *Is the hypothesis right?* Partially. The distinctions are good, but the "legal-historical" part is not as neutral as hoped.
      *   *Is the legal-historical part tractable?* No, because CIL evidence is inherently contested and interpretive.
      *   *What counts as progress?* Moving from "Who is right?" to "What conception of law are we using?"
      *   *Does it bottom out in power?* Not necessarily, but power is the elephant in the room.

  5.  **Drafting the Response:**
      *   **Validate:** Acknowledge the sophistication of the user's analysis. It's a classic pedagogical nightmare.
      *   **Deconstruct the "Legal-Historical" Trap:** Explain why state practice/opinio juris won't solve it. Both sides interpret the *same* facts differently (e.g., Kellogg-Briand). The history is theory-laden.
      *   **Refine the Validity/Legitimacy Distinction:** This is the strongest tool. Map Camp A to *Legality (Positivism)* and Camp B to *Legitimacy (Natural Law/Policy)*. Show how they are answering different questions.
      *   **Unpack "Victors' Justice":** Agree with the user's three-job theory. Suggest separating them in class explicitly.
      *   **Address Radbruch:** Explain why the colleague is partially right. Radbruch bridges the gap but requires a moral consensus that might not exist. It shifts the debate from "Was it law?" to "Was it unjust enough to override the ban on retroactivity?"
      *   **Pedagogical Strategy (What counts as progress):**
          *   Stop trying to settle the history.
          *   Force students to identify their *jurisprudential commitments*.
          *   Use the "Nuremberg Paradox": To condemn the Nazis, you need natural law; to condemn the Tribunal, you need positivism. You can't have both comfortably.
          *   Introduce the "Lesser Evil" argument more rigorously (Jackson's opening).
      *   **Conclusion:** It doesn't bottom out *purely* in power, but it bottoms out in *jurisprudence*. The fight is about what law *is*.

  6.  **Refining the Tone:**
      *   Keep it academic but conversational (colleague-to-colleague).
      *   Avoid taking sides.
      *   Use precise legal theory terminology (positivism, natural law, CIL, rule of law vs. rule by law).

  7.  **Self-Correction/Nuance Check:**
      *   *Did I address Tokyo?* Yes, need to ensure Tokyo isn't lost. Tokyo is indeed the harder case (Pal's dissent).
      *   *Did I address Kampala?* Mention that Kampala confirms the *difficulty* of defining aggression, supporting Camp A, but Camp B argues the *norm* existed even if the *definition* was fuzzy.
      *   *Radbruch:* Make sure to clarify that Radbruch is a *threshold* test, not a blanket justification.

  8.  **Final Polish:** Organize into clear sections: Diagnosis, The Historical Trap, The Jurisprudential Clash, The Radbruch Issue, and Pedagogical Moves. (This matches the structure of the final output).

  *(Self-Correction during drafting)*: I should emphasize that Camp A often smuggles in moral claims ("it was unfair") while pretending to make legal claims ("it wasn't law"), and Camp B smuggles in legal claims ("it was customary law") to support moral ends ("it needed to be done"). Exposing this smuggling is key to progress.

