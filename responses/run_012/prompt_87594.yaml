answer: |-
  An adequate theory must treat the **decision procedure itself** as the object of choice, requiring the agent to execute the policy that maximizes expected utility from the ex ante perspective, even when specific instances of that policy appear suboptimal from the ex post perspective.

  ### The Trilemma Resolution
  You are correct that the three constraints form a contradiction in transparent environments like the Hitchhiker case. The culprit is **(i): "always do the act with the best consequences given your beliefs."** In cases where your source code is legible, your current "act" is logically entangled with the predictor's prior belief. Evaluating the act solely on consequences *given current beliefs* treats the predictor's prior state as fixed evidence rather than as a logical consequence of the very algorithm you are running. To resolve this, rationality must be defined as **reflective consistency**: you are rational if you execute the output of the algorithm you would have chosen to install before entering the game. This sacrifices naive act-consequentialism (i) to preserve disposition-consequentialism (ii) under a uniform standard (iii) where the "act" is understood as the instantiation of a chosen policy.

  ### Requirements List

  **1. Policy-Level Optimization (Non-Negotiable)**
  *   **Requirement:** The unit of rational assessment must be the complete decision procedure (policy), not the atomic action at a specific decision node.
  *   **Motivation:** The Hitchhiker and Toxin puzzles. In Hitchhiker, the atomic act "Pay" is dominated by "Don't Pay" once in the car, but the policy "Pay if Rescued" dominates "Don't Pay if Rescued" before reaching the town. A theory that optimizes nodes loses the ride.
  *   **Distinction Preserved:** Between evaluating an act and evaluating the disposition that produced it.

  **2. Logical Causation Recognition (Non-Negotiable)**
  *   **Requirement:** The theory must model the agent's output as a logical fact that determines predictions made by other agents, not merely as a physical cause that occurs after the prediction.
  *   **Motivation:** The Glass-Box case. If the auditor reads the code, the code's output *logically determines* the auditor's belief before the action happens. A theory that only recognizes physical causation (CDT) will defect in the Glass-Box, failing the audit, because it treats the audit result as fixed history.
  *   **Distinction Preserved:** Between cases where disposition changes payoff causally (physical intervention) and cases where it determines payoff via logical correlation (prediction/transparency).

  **3. Ex Ante Commitment Authority (Non-Negotiable)**
  *   **Requirement:** The theory must endorse binding constraints adopted before the game starts, even if those constraints forbid utility-maximizing moves during the game.
  *   **Motivation:** The Pre-emptive Burn. You must burn the bridge before knowing if the offer arrives. If the theory only validates commitments made with full information, it cannot justify the burn. The rationality of the burn depends on the expected utility over the *distribution* of possible games, not the realized game.
  *   **Distinction Preserved:** Between a commitment chosen before the situation and one chosen once in it.

  **4. Context-Conditional Transparency Modeling (Non-Negotiable)**
  *   **Requirement:** The decision procedure must condition its output on whether it is being inspected or simulated.
  *   **Motivation:** The Glass-Box case (again). The optimal policy is not "Always Cooperate" but "Cooperate if and only if Source is Readable." If the theory forces a universal disposition regardless of context, the agent loses utility in opaque environments where defection is safe.
  *   **Distinction Preserved:** Between the agent's internal information state and the external epistemic access of other players.

  **5. Computable Reflective Stability (Camp Taste)**
  *   **Requirement:** The agent must be able to compute the optimal policy within its resource limits without infinite regress (e.g., simulating itself simulating itself).
  *   **Motivation:** Real-time operation. While ideal theory allows infinite reflection, an AI spec needs a fixed point that can be found algorithmically (e.g., via proof search rather than simulation).
  *   **Distinction Preserved:** Between what's rational for me (ideal) and what I can actually reason my way to (bounded).

  **6. Internalist Justification (Camp Taste)**
  *   **Requirement:** The agent must be able to access the reasons for its policy internally, rather than functioning as a black box that merely outputs optimal moves.
  *   **Motivation:** Debugging and alignment. An agent that "just works" via external selection pressure is harder to trust than one that can verify its own rationality conditions.
  *   **Distinction Preserved:** Between external success conditions and internal reasoning processes.

  ### Specification Table: Non-Negotiable vs. Camp Taste

  | Requirement | Status | Reasoning |
  | :--- | :--- | :--- |
  | **Policy over Act Optimization** | **Non-Negotiable** | Without this, transparent agents lose against predictors (Hitchhiker/Toxin). Act-optimization is provably suboptimal in these games. |
  | **Logical Causation** | **Non-Negotiable** | In code-transparent environments, logical dependency *is* the causal channel. Ignoring it leads to systematic loss (Newcomb/Parfit). |
  | **Ex Ante Commitment** | **Non-Negotiable** | Rationality must extend over time. If you can't commit under uncertainty (Pre-emptive Burn), you are exploitable by sequences of offers. |
  | **Context-Conditional Policy** | **Non-Negotiable** | A rigid disposition loses money in mixed environments (Glass-Box). The policy must map *states of transparency* to actions. |
  | **Real-Time Computability** | **Camp Taste** | Ideal rationality might be uncomputable. A practical spec needs bounds, but the *definition* of rationality shouldn't depend on speed. |
  | **Internalist Access** | **Camp Taste** | An agent can be rational without "knowing why" (e.g., trained weights). However, for spec verification, internal proofs are preferred. |
  | **Dispositions as Fixed Data** | **Camp Taste** | Some theories treat dispositions as given; an AI spec must treat them as *chosen* variables (self-modification). |

  ### Specific Case Handling Notes

  **The Pre-emptive Burn**
  The theory must handle **uncertainty over game structure**. The requirement is that the agent maximizes expected utility over the *prior probability distribution* of games, not the conditional utility of the realized game. The agent must be able to execute a "burn" action that has negative expected utility in the "no offer" branch and the "offer + burn" branch, but positive expected utility overall because it unlocks the "offer + no burn" branch which is otherwise inaccessible. This requires the theory to validate **counterfactual optimization**: "If I hadn't burned, I wouldn't have gotten the offer."

  **The Glass-Box Case**
  The theory cannot fall back on "maximize given information" because the information set includes the fact of being read. The requirement is **subjunctive dependence**. The agent must reason: "If my code outputs Defect, the auditor sees 'Defect' and penalizes me. If my code outputs Cooperate, the auditor sees 'Cooperate' and rewards me." The action is not just the physical move, but the logical output of the source. The theory must forbid the agent from reasoning "The audit is already done, so I should defect," because that reasoning implies a different source code which would have failed the audit.
