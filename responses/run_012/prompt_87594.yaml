prompt: |-
  you're a decision theorist — someone who actually works on rational choice and game theory and has thought hard about the ugly cases, not just the textbook ones. think carefully before you answer, and feel free to start by brainstorming the space of cases for yourself, but don't show me that part.

  here's the setup. i'm writing a spec for the decision procedure of an AI agent that has to operate with its source code readable by the other players — so whatever disposition it has is common knowledge, and anyone can predict what it'll do in any situation its code covers. i keep running into the same famly of problems: cases where the agent does better by being the sort of thing that will do the worse-looking thing. the hitchhiker is the toy version (you only get the ride if you'd pay at the other end, but once you're in the car you won't pay, and the driver knows all this). the toxin puzzle is the other one (a pile of money for forming the intention tonight to drink something foul tomorrow, when the money is already settled by the time tomorrow comes). and then the everyday version: i'm better off over a life if i'm the sort of person who never breaks a confidence, even though in some one-off case breaking it would pay.

  before i look at any actual theory i want the requirements list. what does a theory of practical rationality have to deliver to be adequate here? for each requirement, give me the case or consideration that motivates it. i especialy want:

  - the distinctions it can't collapse: between evaluating an act and evaluating the disposition that produced it; between cases where my disposition changes the payoff causally (the driver sees what kind of thing i am and decides to stop) and cases where it merely correlates with it; between a commitment i get to choose before i'm in the situation and one i'm stuck with once i'm in it; between what's rational for me and what i can actually reason my way to in real time.
  - the cases it has to get right, including these two i made up, which i care about more than the classics: (a) the pre-emptive burn — the offer only comes if i've already, irreversibly given up my alternative, and i have to decide whether to burn before i know whether the offer is even coming, so the theory has to say something about committing under uncertainty about which game i'm in; (b) the glass-box case — the agent's code is read by an auditor, and the same action is best when the code is readable and terrible when it isn't, so the theory can't just fall back on maximizing what's best given the information the agent has.
  - the consistency requirements: what results from decision theory or from logic it can't contradict. here's the one i most want your view on. it looks like you can't have all three of (i) always do the act with the best consequences given your beliefs, (ii) do what the best disposition would do, and (iii) judge acts and dispositions by the same standard, without a contradiction in the hitchhiker case. is that right? if so, which of the three is the culprit, and if not, show me where the escape is.

  mark which requirements are non-negotiable and which are just the taste of one camp — e.g. whether the theory has to be usable by the agent in real time, whether it has to be 'internalist', whether it's allowed to treat the agent's own dispositions as fixed data. a table is fine for that part, but the reasoning matters more than the table.

  lead with your bottom line in the first sentence — the single requirement you think does the most work — then give the reasoning. no preamble, no restating what i asked. and don't give me a survey of the literature or a reading list; i want the spec.
