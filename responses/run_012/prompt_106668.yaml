  The core tension arises between two compelling epistemic demands: respecting one's current total evidence and deferring to one's own future rational judgment. Van Fraassen's Reflection principle suggests these should align, positing that current credence should match expected future credence. However, this alignment presupposes that the future self operates with an evidence base at least as robust as the present self's. When memory failure or evidence loss occurs, this presupposition collapses. The scientist currently possesses evidence $E$, but knows she will lose it. If she follows Reflection, she ignores $E$ now to match her future ignorant self. If she respects $E$, she violates Reflection. This forces a choice: is Reflection an absolute law of rationality, or does it depend on evidential stability? The issue is whether rationality requires synchronic coherence with future expectations even when diachronic evidence flow is negative. We must distinguish between constraints that govern belief change and those governing belief states.

  The Principle and Its Rationale

  Reflection is a diachronic constraint on belief degrees, linking current credence to expected future credence. Formally, your current probability for proposition $A$ should equal your current expectation of your future probability for $A$. The rationale stems from coherence requirements akin to avoiding Dutch Books. If you currently believe $A$ is likely but expect your future self to believe $A$ is unlikely, you effectively regard your future self as irrational or misinformed. If you believe your future self is rational and better informed, disagreement implies you are currently mistaken. By deferring to the future self, you avoid a situation where you could be exploited by betting against your own future judgments. Thus, Reflection is defended as a requirement of ideal rationality, treating the future self as an epistemic expert. It assumes that belief changes are driven by the accumulation of evidence via conditionalization. Under this view, diverging from expected future credence signals a failure to recognize the evidential value of what one will learn. It transforms a diachronic process into a synchronic constraint: you must align with your expected future state now. This makes it a powerful tool for ensuring consistency over time, provided the flow of information is standard. Crucially, the principle relies on the assumption that the future self is an epistemic superior. If you view your future self as someone who will process information more thoroughly, deferring to them minimizes error. The coherence argument suggests that violating Reflection leaves you vulnerable to a diachronic Dutch Book, where a bookie can construct a series of bets that guarantee a loss based on the discrepancy between your current and anticipated future beliefs. Therefore, Reflection is not merely advice; it is presented as a structural requirement for probabilistic agents. It binds the agent across time, ensuring that current beliefs are not arbitrarily disconnected from anticipated rational updates. Without this link, an agent could hold beliefs now that they know they will reject later without new reason, suggesting a form of instability or akrasia.

  The Forgetful Scientist Case

  Consider the scientist at time $t_1$. She possesses evidence $E$, which supports proposition $A$ to degree 0.5. She knows that by $t_2$, she will forget $E$ entirely. However, she will acquire new evidence $F$, which is positively correlated with $A$. Based on $F$ alone, her credence will rise to 0.7. She knows all this at $t_1$. Her future self is an ideal Bayesian reasoner relative to the evidence available at $t_2$. The conflict is sharp. If she adheres to Reflection, she must set her current credence to 0.7, matching her expectation of her future self. But this requires her to disregard $E$, which is currently part of her total evidence. Ignoring $E$ seems irrational; current credence should reflect current evidence. Conversely, if she stays at 0.5, she violates Reflection. This is not a case of gaining evidence, but of trading evidence. The future self is not strictly better informed; she is differently informed. The case highlights that Reflection may fail when the evidential relationship is not monotonic. The scientist knows her future self is rational, but not omniscient regarding $E$. Thus, the future self is not an expert on the totality of evidence available at $t_1$. The divergence arises from the loss of information, not irrationality. To clarify, at $t_1$, the scientist's total evidence is $\{E\}$. At $t_2$, it is $\{F\}$. Since $E$ is lost, the future credence of 0.7 is rational relative to $\{F\}$, but not relative to $\{E\}$. The scientist at $t_1$ knows that her future self is an ideal Bayesian reasoner, meaning the future self will perfectly update on whatever evidence they have. However, being an ideal reasoner does not compensate for missing data. The scientist can predict the 0.7 credence precisely because she knows the future evidence state. If she adopts 0.7 now, she is effectively pretending to have evidence $F$ while ignoring $E$. This violates the synchronic requirement to proportion belief to current evidence. The case thus isolates the variable of evidence retention. It shows that Reflection conflates rationality with informational richness. A future self can be perfectly rational yet less informed. In such scenarios, the expectation of future credence is a prediction of ignorance, not a guide to truth.

  Candidate Resolutions

  Several resolutions exist. First, one might restrict Reflection to cases of evidential accumulation. If the principle only applies when the future self retains all current evidence plus more, the scientist is exempt. This preserves Reflection as a rule for learning, not forgetting. Second, one could argue the future self is not rational in the relevant sense. If rationality requires maximizing evidence usage, forgetting $E$ is a failure. However, involuntary memory loss is not typically deemed irrational. Third, we might distinguish between epistemic authority and rationality. The future self is rational but lacks authority over $E$. Deference is only owed to those with superior or equal evidence. Fourth, we could treat current evidence $E$ as overriding. The requirement to match current total evidence is synchronic and absolute. Reflection is merely a heuristic that works when evidence grows. Finally, one might argue the scientist should anticipate forgetting and adjust now. But this conflates predicting future belief with justifying current belief. The most robust solution treats Reflection as conditional. It holds only when the agent believes her future self will conditionalize on a superset of her current evidence. When evidence is lost, the link between current and future credence is severed. The principle fails not because rationality changes, but because the evidential basis shifts incompatibly. This respects the distinction between losing and gaining evidence. Furthermore, we must consider whether the case is a failure of Reflection or a failure of the future self. If forgetting is involuntary, the future self is not irrational. Thus, Reflection must be the principle that yields. We should restrict the principle to contexts of "evidential monotonicity," where evidence is never lost. This restriction saves Reflection from counterexamples but limits its scope. Alternatively, we might view Reflection as a substantive principle about truth-tracking rather than coherence. If so, it fails here because the future self tracks truth less well regarding $E$. However, the coherence interpretation is stronger. The conflict reveals that coherence between time-slices is secondary to coherence with evidence. We should prioritize the synchronic constraint of matching current evidence over the diachronic constraint of matching future expectations. This implies Reflection is derivative. It is valid only when the diachronic link preserves evidential content. When that link breaks, the derivative principle fails. This resolves the tension by demoting Reflection from a fundamental law to a conditional rule.

  My Verdict

  Reflection is best understood as a conditional coherence constraint, not a substantive epistemic principle. It is not an absolute law of rationality but a default that holds under special conditions, specifically evidential retention. The Forgetful Scientist case demonstrates that rationality requires responsiveness to current evidence, even if this means diverging from future expectations. When evidence is lost, the future self loses epistemic authority over the present. Therefore, the scientist should not adopt 0.7; she must respect $E$. This shows Reflection is not fundamental; it derives from the more basic requirement to conditionalize on total evidence. When conditionalization is impossible due to memory loss, Reflection loses its grip. Ultimately, the principle is a useful tool for modeling learning, but it cannot govern cases of forgetting. It is a coherence constraint contingent on the structure of evidence flow, rather than a standalone norm of truth-seeking. It protects against inconsistency, but not against ignorance. Therefore, Reflection is not a genuine requirement of ideal rationality in all contexts. It is a default that holds under special conditions where the future self is epistemically superior or equal. The Forgetful Scientist shows that current evidence $E$ must be treated as part of total evidence at $t_1$, and forgetting it later does not negate its force now. The principle needs restriction to cases where the future self is at least as well informed. There is no deeper problem with deferring to a future self generally, but there is a problem when that self is evidentially impoverished. Thus, Reflection is a conditional coherence constraint, dependent on the stability of the evidential base.
