answer: |-
  The train rattled steadily through the dark countryside, the rhythm matching the swirling coffee in Elena's cup. Across the table, Marcus watched the passing lights streak against the window.

  "It comes down to the pushing," Marcus said, turning from the glass. "In the careenium, only the simms push. They have mass, velocity, magnetic charge. The simmballs—the clusters—are just shadows cast by the collisions. To say a thought causes an action is like saying a shadow pushes the object casting it."

  Elena set her cup down. "But the shadow has a shape that persists while the particles composing it change. If I knock a few simms out of a simmball, the cluster often reforms. The specific simms don't matter; the pattern does. If the pattern determines the outcome, why deny it causal weight?"

  "Because the pattern doesn't *do* anything," Marcus replied. "The simms bounce. The pattern is just a description we layer on top to make sense of the noise. It's epistemic. It helps us track the system, but it doesn't move the furniture. If you knew the position and momentum of every simm, you wouldn't need the concept of a simmball to predict the future. The bottom level is causally closed."

  "Who says I could know that?" Elena asked. "Even in principle? The chaos in the arena is immense. But more importantly, suppose I want to change the trajectory of the system. I can't reach in and tweak individual simms without dissolving the cluster entirely. I have to intervene at the level of the cluster. I adjust the walls of the arena, or I introduce a new cluster that binds with the old one. If the only tractable lever is the pattern, isn't the pattern the cause?"

  Marcus shook his head. "Tractability isn't reality. Just because you lack the precision to manipulate the bottom level doesn't mean the bottom level isn't doing the work. When you push a cluster, you are still pushing simms. You're just pushing a lot of them at once, blindly. The force is still transmitted particle to particle. The simmball is a handle, not a engine."

  "But consider the stability," Elena pressed. "The simmball survives the turnover of its constituents. If causation were only at the simm level, every time a simm drifted away, the causal history would reset. But the behavior of the arena remains consistent despite the churn. The high-level structure constrains the low-level chaos. It channels the energy. Doesn't channeling count as pushing?"

  "Channeling is a result, not a source," Marcus countered. "The walls channel the simms. The magnetic fields channel the simms. The cluster is just a temporary eddy in the flow. You're reifying a statistic. I agree the high-level description is indispensable for us. I agree that without it, we're blind. But indispensability to the observer doesn't grant ontological status to the observed. The universe doesn't care if we can track the simms. It only cares that they collide."

  Elena leaned forward. "Let's test that. Imagine two different arrangements of simms that form the same simmball shape. They behave identically in the arena. They trigger the same wall responses. They bind with the same other clusters. If the simm-level details differ but the outcome is identical, then the simm-level details are irrelevant to the outcome. The cause must be what remains constant across those variations. That's the pattern."

  Marcus paused, tapping his finger on the table. "That's multiple realizability. I grant it. But it doesn't prove the pattern is a cause. It proves the cause is disjunctive. Either arrangement A or arrangement B causes the outcome. The fact that we group them under 'simmball' is for our convenience. The physical reality is still the specific arrangement existing at that moment. You're saying the abstraction does the work. I'm saying the physical realization does the work, and there are just many physical realizations that look the same to you."

  "But if the physical realization is irrelevant, why insist it's the only cause?" Elena asked. "If I can explain the system's future perfectly by tracking simmballs, and poorly by tracking simms because of the noise, then the simmballs are capturing the actual constraints of the system. The noise averages out. The signal is the cluster. If you insist the noise is the only reality, you're missing the signal."

  "I'm not missing it," Marcus said softly. "I'm locating it. The signal is a regularity in the noise. Regularities aren't agents. Think about what you're asking. You want the pattern to be a force. But forces are physical. Patterns are geometric. Geometry doesn't collide. If a simmball causes a wall to bounce, it's because simms hit the wall. If you remove the simms, the geometry remains in your head, but the wall doesn't move. So the simms are necessary. The pattern is not."

  Elena sighed, looking out at the dark fields. "I'm not asking for spooky geometry. I'm asking for recognition that higher-order structures have stability that exerts downward constraint. The simmball limits where the simms can go. It restricts their phase space. If X restricts the behavior of Y, isn't X causal?"

  "Restriction is negative causation," Marcus conceded. "But the restriction itself is built out of simm interactions. The wall restricts the simms, but the wall is just fixed simms. The cluster restricts the constituent simms, but the cluster is just moving simms. It's constraints all the way down. You want to say the constraint is a separate thing from the constrained. I say the constraint is just the arrangement of the constrained."

  "Then we're arguing about what counts as a 'thing'," Elena said. "If the arrangement is robust, if it survives perturbation, if it predicts the future better than the constituents... at some point, denying it reality feels like dogma. You're protecting a definition of 'cause' that excludes the only level where human agency operates. We don't live in the simm level. We live in the simmball level. If our thoughts are simmballs, and we act, then simmballs must push."

  Marcus smiled tiredly. "We live in the simmball level because we are slow, large creatures made of trillions of simms. We perceive the average. But the universe isn't slow. The universe doesn't perceive averages. It processes every collision. If you want to say human agency is real, I agree. But human agency is a high-level description of low-level physics. It's not a second kind of physics."

  "So if I change my mind," Elena said, "that's just a description of a simm shuffle?"

  "It's a description of a simm shuffle that matters," Marcus said. "The mattering is real. The extra push is not."

  Elena picked up her coffee again. "Then the push is an illusion, but the mattering isn't."

  "The push is physical," Marcus corrected. "The attribution of the push to the pattern is the illusion. But it's a necessary one. Without it, we can't navigate the arena."

  "And with it," Elena added, "we might pretend the arena is made of ideas instead of magnets."

  "Maybe," Marcus said, watching the lights return as the train slowed toward the station. "But the magnets don't care what we call them. They only care where they hit."

  "Until they hit us," Elena said. "And then we care very much what we call them."

  The train hissed to a halt. They gathered their coats, the question hanging between them, unresolved but sharpened, like a cluster holding its shape against the motion of the parts.
