answer: |-
  Two claims in your notes are flat-out wrong. First, eliminativists do **not** claim feelings, sensations, or consciousness are illusions. They target *propositional attitudes* (beliefs, desires), not raw experience (qualia). Paul Churchland explicitly distinguishes between sensory states (which exist) and theoretical constructs (which may not). Second, claiming instrumentalism ("useful fictions") isn't eliminativism is misleading; many argue folk psychology is pragmatically useful even if ontologically false.

  Here is the breakdown of your notes:

  1.  **"Beliefs and desires don't exist."** **Accurate.** This is the core thesis.
  2.  **"Folk psychology... is really a theory... like phlogiston."** **Accurate.** This is the standard argument from theory change.
  3.  **"Stop saying... 'she believes'... describe the brain directly."** **Accurate** as a long-term ideal, though they admit we currently lack the vocabulary to do so in daily life.
  4.  **"Whole inner mental life is an illusion, feelings and sensations included."** **False.** As noted, they accept sensory states. They deny the *interpretive framework*, not the experience itself.
  5.  **"Consciousness is going to get eliminated."** **False.** They usually aim to explain consciousness via neuroscience, not eliminate the phenomenon itself.
  6.  **"View refutes itself."** **Accurate** as a common objection, but not a definitive refutation. Eliminativists argue this begs the question by assuming "belief" exists to make the point. They might rephrase their position as a theoretical stance supported by neural evidence rather than a "belief."
  7.  **"Useful fictions... not what eliminativism actually says."** **Distortion.** Many eliminativists accept folk psychology as a useful heuristic for navigation while denying its truth regarding brain architecture.

  Your hunch was correct: the sensations part is the major distortion. Eliminativism is a claim about how we *categorize* mental life, not that mental life is empty. Trust the notes on the theory-replacement argument, but discard the claim that they deny consciousness itself.
