  2.  **Deconstruct the View (Thermodynamic Reductionism about Time's Arrow):**
      *   Core claim: Temporal asymmetry *just is* entropy asymmetry (grounded in the Past Hypothesis).
      *   Implications: Psychological arrow (memory), causal arrow, record asymmetry must be derived from thermodynamics.
      *   Vulnerabilities: Coarse-graining subjectivity, independence of record asymmetry, edge cases (cyclic/local), explanatory depth.

  3.  **Address the Specific Cases:**
      *   *Cyclic Universe:* If entropy resets, does the arrow flip? If yes, do people remember the "future"? This is the "Gold Universe" or "Janus Point" scenario. A defender usually concedes the arrow flips but argues inhabitants on the other side wouldn't experience it as a flip (their psychological arrow flips too). Is this a reductio? It's awkward but coherent.
      *   *Local Reversals (Fridges):* Entropy decreases locally. Do inhabitants there experience time backwards? Standard reply: They are open systems coupled to the global gradient. Their internal processes still align with the global arrow because they rely on the global gradient to function. This is a manageable cost.
      *   *Record Asymmetry:* This is the heavy hitter. Reichenbach's fork asymmetry. Can records *only* exist towards the lower entropy side? Defenders say yes (overdetermination of past vs. future). Critics say records might be possible in both directions if dynamics allow. This is a major point of contention.
      *   *Coarse-graining:* Entropy depends on macrostates. Is the arrow mind-dependent? Defenders need an objective basis for macrovariables (e.g., human-scale interactions, or fundamental dynamical decoupling). If it's purely subjective, the view collapses into idealism. This is a foundational risk.

  4.  **Address the "Gap Case" (Entropy Up, Future Behind):**
      *   Can we conceive of a world where entropy rises but the *experience* or *causal* arrow points the other way?
      *   If the view is true, this should be inconceivable or physically impossible.
      *   If it *is* conceivable (e.g., Boltzmann Brains, or specific dynamical models), that's a problem.
      *   Actually, the strongest counter is usually that the thermodynamic account *presupposes* the time direction it tries to explain (the "two-time" problem). To say entropy increases *towards the future* already assumes a future direction.

  5.  **Address Falsifiability:**
      *   Is it empirical or metaphysical?
