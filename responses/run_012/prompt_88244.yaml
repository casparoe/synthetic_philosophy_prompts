      *   *Falsifiability:* It's a grounding claim. Hard to falsify directly. Risk of insulation.
      *   *Ranking/Verdict:* Weave this into the conclusion. Coarse-graining and Record Asymmetry are the biggest threats. Cyclic is awkward. Falsifiability is a methodological worry.

