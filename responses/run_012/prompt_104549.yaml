answer: |-
  Here is the breakdown of your friend's position, based on the track record you provided.

  ### 1. Predictions on the New Case

  **Will she say the evidence supports "every emerald is green"?**
  **Yes.** The extra information about weight, date, and gifts does not cancel out the color observations. This is her baseline position.

  **Will it support "every emerald is green if it weighs a prime number of carats and blue otherwise"?**
  **No.** She will reject this generalization.

  **Will she treat that last claim the way she treats the before-2050 claim, or differently?**
  She will treat it **the same way** as the before-2050 claim. She will view it as a trick of description rather than a rule of nature. Even though weight is a physical property (unlike the date), the "prime number" condition is a mathematical filter imposed on the measurement, not a physical cause inherent to the stone. To her, this looks just like the "2050" switch: an arbitrary line drawn in the sand that happens to match the data so far but has no reason to hold up tomorrow.

  ### 2. The Rules Fitting Her Record

  Based on her past verdicts, three rules explain her thinking:

  *   **Rule 1: The Nature vs. Bookkeeping Rule.**
      *   *What it says:* Generalizations about natural kinds (emeralds, ravens) are treated as laws of nature that apply to unexamined cases. Generalizations about finite, artificial collections (the jar of coins) are treated as bookkeeping that ends when the collection ends.
      *   *Her record:* She accepts the emerald and raven claims as ongoing rules but treats the jar claim as limited to that specific jar.

  *   **Rule 2: The Intrinsic vs. Relational Rule.**
      *   *What it says:* Evidence supports a claim only if the condition is an intrinsic property of the object (like color or weight), not a relation to something else (like a grandmother) or an observer (like a date on a calendar).
      *   *Her record:* She accepts "green" (intrinsic). She rejects "gift from grandmother" (relational history) and "looked at before 2050" (relational to observers/time).

  *   **Rule 3: The Non-Arbitrary Classification Rule.**
      *   *What it says:* Even if a property is physical (like weight), the specific way we categorize it must not be mathematically arbitrary. Nature might care about size, but it doesn't care about human number systems.
      *   *Her record:* This is the hidden rule behind her rejection of the "2050" claim. Time is real, but the year 2050 is an arbitrary human marker.

  ### 3. Applying the Rules to the Prime-Carat Claim

  *   **Rule 1** allows the claim because emeralds are a natural kind.
  *   **Rule 2** is tricky. Weight is intrinsic, so it passes the first half. However, "prime number" is a property of the *number*, not the *stone*.
  *   **Rule 3** is where the claim fails. Whether a weight is "prime" depends on the unit of measurement (carats vs. grams) and human mathematics. An emerald doesn't "know" it weighs a prime number.

  **Prediction:** Rule 3 overrides Rule 2. She will reject the claim because the condition is mathematically arbitrary, just like the 2050 date is chronologically arbitrary.

  ### 4. Which Rule Is She Actually Running?

  I would bet she is running **Rule 2 (The Intrinsic vs. Relational Rule)**, but interpreted strictly as **"Causal Relevance."**

  **Why?**
  If she were strictly following Rule 3 (Non-Arbitrary Math), she might get stuck on what counts as "arbitrary." But her rejection of the "Grandmother" and "2050" cases suggests she is looking for a *mechanism*. She believes "All emeralds are green" works because something about being an emerald *makes* it green.

  She rejects the "2050" claim because the date doesn't *cause* the color. She rejects the "Grandmother" claim because gift-giving doesn't *cause* the color. She will reject the "Prime Carat" claim because arithmetic doesn't *cause* the color.

  She isn't just counting matches; she is asking, "Does this condition explain *why* the stone is green?" If the answer is no, she says the evidence gives no support, even if the observations fit perfectly.

  ### 5. The Single Further Case to Settle It

  To confirm whether she is using the **"Arbitrary Math" rule** or the **"Causal Relevance" rule**, present her with this scenario:

  **The Case:**
  Suppose we examine a thousand emeralds. All of them are green. All of them weigh **more than 5 carats**. We also find a thousand smaller emeralds, all under 5 carats, and they are **blue**.

  **The Claim:**
  "Every emerald heavier than 5 carats is green, and every emerald lighter than 5 carats is blue."

  **Why this settles it:**
  *   **If she accepts this:** She is running the **Causal Relevance Rule**. She rejects "prime numbers" because math is arbitrary, but she accepts "weight thresholds" because size could physically affect how light interacts with the stone (a causal mechanism).
  *   **If she rejects this:** She is running a strict **Entrenchment Rule**. She only accepts predicates we have used for centuries (like "green" alone). She rejects *any* conditional rule (whether prime, date, or weight) because we haven't historically made laws out of them.

  Given her distinction between "rules of nature" and "bookkeeping," I suspect she will **accept the weight threshold**. This would prove she is willing to accept new rules of nature, provided they rely on physical causes rather than arbitrary math or relations.
