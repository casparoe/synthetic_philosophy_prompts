  Where the disagreement actually lies

  Your hypothesis that this is largely verbal is correct, but it is verbal for a substantive reason. The disagreement lies in whether we define "pain" by its phenomenal character or its functional role. If pain is defined phenomenologically as "what it feels like," the Intrinsic View has the advantage: standard pain feels bad. If pain is defined functionally as "nociceptive input plus avoidance," the Attitudinal View gains ground: asymbolia shows input without avoidance. However, the deeper friction is about the unity of consciousness. The Intrinsic View assumes affect and sensation are fused into a single qualia; the Attitudinal View assumes they are distinct mental states that usually co-occur. This is not merely empirical because neural data can be mapped onto either ontology. If neurons fire in the insula, the Intrinsicist calls that the feeling of badness; the Attitudinalist calls that the generation of the aversive desire.

  Consequently, the stalemate rests on conflicting starting intuitions about introspection. The Intrinsicist intuits that you cannot peel the "ouch" away from the "I dislike this." The Attitudinalist intuits that the sensation is merely information, and the suffering is our refusal of that information. Because introspection cannot decisively reveal whether affect is a property of the sensation or a reaction to it, both positions remain coherent. It is a case of two questions wearing one name: "What is the neural correlate of nociception?" versus "What constitutes the suffering aspect of experience?" Until these are distinguished, the word "pain" will continue to carry too much theoretical weight, allowing each side to retreat to their preferred definition when counter-evidence arises. The dispute is substantive about the mind, but verbal about the label. The hidden empirical question is whether there exists a state that is phenomenally identical to pain minus the badness, but this is inaccessible to third-person observation. We cannot see into the patient's mind to verify if the sensation is truly neutral. Thus, the disagreement relies on starting intuitions that neither side can argue for without begging the question. The Intrinsicist relies on the intuition that suffering is inseparable from the feel of pain; to remove the suffering is to remove the pain. The Attitudinalist relies on the intuition that information is neutral until evaluated; the body signals damage, but the mind decides to mind. These are foundational stances on the architecture of consciousness. One sees the mind as a unity where quality and value merge; the other sees it as a module system where input and evaluation are distinct. Because both models can accommodate the behavioral data of asymbolia by adjusting their internal mapping of functions to feelings, the dispute stalls. It is not that the evidence is ambiguous, but that the evidence is compatible with two different ontologies of experience.

  What each side must say about the cases

  Consider the asymbolia patient. The Attitudinal View redescribes the case easily: the sensory module works, the motivational module is damaged. The badness is gone because the attitude is gone. The Intrinsic View must deny the appearance: they must claim the patient is not feeling "pain" in the strict sense, but merely "nociceptive sensation." They risk contradicting the patient's report that it "hurts," unless they argue the patient uses the word loosely. This forces the Intrinsicist to assert authority over the subject's own phenomenology.

  Now consider ordinary endurance, such as a soldier ignoring a wound to finish a mission. The Intrinsic View says the pain is still fully bad; the soldier merely overrides the desire to stop it. The badness is intrinsic, but action is voluntary. The Attitudinal View must redescribe this: if the soldier successfully suppresses the aversion, the badness itself is diminished. They must claim the experience is phenomenologically lighter, not just behaviorally controlled.

  Here the costs diverge. The Intrinsic View preserves the intuition that pain is always an evil, but struggles to explain why the soldier reports it as manageable. The Attitudinal View explains the manageability but risks denying the reality of the suffering that persists despite endurance. The Intrinsicist denies the asymbolic feels pain; the Attitudinalist denies the endurance case involves unchanged badness. Both must tweak the phenomenology to fit the theory. The Intrinsicist saves the theory by narrowing the definition of pain; the Attitudinalist saves it by narrowing the definition of badness. The Intrinsicist pays the price of counter-intuitive revisionism regarding asymbolics; the Attitudinalist pays the price of counter-intuitive revisionism regarding endurance. Neither can accept the case at face value without compromising their core commitment about the unity of sensation and suffering.

  What would count as progress

  Progress requires abandoning the single term "pain." We need a tripartite distinction: nociception (sensory detection), affect (unpleasantness), and motivation (avoidance). If we agree to call the asymbolic state "nociception without affect," the Intrinsic View loses its ability to claim the badness is hidden. If we agree that "pain" refers only to the compound of sensation plus affect, the Attitudinal View loses the ability to say pain is separable. An experiment moving the needle would need to alter affect without altering sensation or motivation independently. Hypnosis offers this: subjects report sensation remains while unpleasantness vanishes. If this is phenomenologically robust, it favors the Attitudinal View's separability. However, the Intrinsicist can still argue the "sensation" reported is actually a altered qualia. Honest assessment: nothing may fully settle this. It hinges on whether one trusts the introspective report of "sensation without suffering" as revealing distinct components, or as a change in the whole. The question shifts from "What is pain?" to "Is unpleasantness a property or a relation?" That is a metaphysical question empirical data alone cannot answer. We may only achieve clarity, not consensus. The real progress is recognizing that "pain" is a folk term obscuring distinct neural and phenomenal events. If philosophers and scientists agree to use "pain" for the compound and "nociception" for the signal, the Intrinsic View becomes a claim about the compound's essential nature, while the Attitudinal View becomes a claim about the signal's neutrality. This linguistic precision forces the debate onto the metaphysical ground where it belongs: the nature of affective consciousness. Does value reside in objects or subjects? Until that is resolved, the pain dispute will mirror it. We might not solve it, but we can stop talking past each other. The experiment that would help is one that dissociates the report of "hurt" from the report of "location" reliably across subjects.

  What the diagnosis leaves open

  This diagnosis leaves open the ethical implications. If the Attitudinal View is right, is painless suffering possible? If the Intrinsic View is right, is asymptomatic pain an oxymoron? I am least confident about whether the phenomenology is truly separable. It is possible that affect and sensation are distinct functionally but fused phenomenally, meaning the Attitudinal View is physiologically correct but phenomenologically wrong. The diagnosis clarifies the stalemate but does not dissolve the mystery of why experience feels the way it does. It also leaves open whether the "badness" is a primitive quality or a relational state, which matters for moral philosophy.
