answer: |-
  Here is the straight assessment you asked for, ranked by what should actually move you (most decisive first), followed by the meta-analysis of your position.

  ### 1. The Concrete Case: Causal Invariance (The "Pain" Argument)
  You asked for this first, and it is the most decisive counter because it bypasses semantics and hits the metaphysics.

  **The Case:** Imagine you punch someone in the face.
  *   **Description A:** "I moved my fist 30cm forward."
  *   **Description B:** "I caused a spike in cortisol and nociceptor firing in another human."
  *   **Description C:** "I decreased total global well-being by 40 units."

  Your claim is that these are different sets of consequences, so there is no determinate "consequence of the punch."

  **Why this fails to stop consequentialism:**
  The *physical and mental events* that occur are invariant regardless of how you describe them. The nociceptors fire regardless of whether you call it "pain" or "neural activity." If your consequentialist theory says "pain is bad," it latches onto the *event* (nociceptor firing/conscious suffering), not the *label*.

  The description does not create the consequence; it merely highlights aspects of a causal chain that already exists. If value supervenes on natural properties (like suffering, pleasure, preference satisfaction), then the "consequence" is the change in those natural properties. That change happens objectively. You can describe the smoke however you like, but the fire burned the house down regardless. If "the good" is tied to the burning (or the not-burning), the description is irrelevant noise. The target is determinate because the *causal footprint* is determinate, even if our linguistic carving of it is not.

  ### 2. The Theory-Internal Filter
  **The Argument:** Consequentialism is never just "maximize consequences." It is always "maximize consequences *of type X*," where X is defined by a theory of value (hedonism, prioritarianism, etc.).

  **Why this moves you:**
  Your objection assumes "consequences" means "every true proposition that becomes true after the action." No serious consequentialist believes that. They believe "consequences" means "changes in value-relevant states."
  *   If I buy a coffee, one consequence is "I spent $5" and another is "I increased global entropy."
  *   A hedonist consequentialist shrugs at the entropy. It's not a *moral* consequence.
  *   The theory itself provides the filter for which descriptions count. Therefore, the indeterminacy of *general* descriptions doesn't create indeterminacy in *moral* decision-making. The theory tells you which description is the right one to use (the one that tracks value).

  ### 3. The Pragmatic Collapse (Reductio)
  **The Argument:** If consequences are truly description-relative such that no action has a determinate outcome, this destroys *all* rational agency, not just consequentialism.

  **Why this moves you:**
  To be a deontologist, you must know that "lying" has different consequences than "telling the truth." To have a right to life, your death must be a determinate consequence of murder. If your skepticism about consequences is true, then "murder" has no determinate consequences either, and deontology collapses alongside consequentialism.
  Since we clearly *do* act, plan, and reason about the future successfully enough to survive, there must be a "fact of the matter" about outcomes that is robust enough to support reasoning. If it's robust enough for daily life, it's robust enough for ethics. You cannot carve out a skepticism that only kills consequentialism without killing practical reason entirely.

  ***

  ### Is your view unfalsifiable?
  **Straight answer:** Yes, it risks being a linguistic trap.

  If every counter-example I give (like the pain argument above) is met by you saying, *"But 'pain' is just another description; you haven't escaped the description problem,"* then you have immunized your view. You are treating "description" as a veil that can never be lifted.
  To be vulnerable, you must admit that some descriptions map onto causal reality *better* than others. If you admit that "neural firing" is a more fundamental description than "moving a fist," you concede that there is a hierarchy of descriptions, and at the bottom, there is a reality that is description-invariant. If you refuse to admit that, you aren't doing ethics anymore; you're doing radical skepticism that nothing exists.

  ### Are you botching the "Cluelessness" objection?
  **No, you are radicalizing it.**
  *   **Standard Cluelessness (Epistemic):** "There is a fact of the matter about the future, but we are too stupid/limited to know it." (e.g., We don't know if saving this child leads to them becoming a tyrant).
  *   **Your View (Ontological):** "There is no fact of the matter about 'the consequences' independent of a conceptual scheme."

  You aren't botching theirs; you are digging deeper. You are arguing that the *target* doesn't exist, whereas they argue the *arrow* is blurry. However, most philosophers find the epistemic worry sufficient; they don't think they need to solve your ontological worry to do ethics, because they assume a realist metaphysics of causation.

  ### What will a consequentialist simply shrug off?
  1.  **Semantic Skepticism:** They will assume a "natural attitude." They assume causes lead to effects and that "suffering" refers to a real state of affairs, not just a word. They will treat your point as a philosophy-of-language puzzle, not a practical ethical blocker.
  2.  **Infinite Regress of Descriptions:** They will say, "We don't need the *God's eye view* of consequences; we need the *best available* description relative to our theory of value." They are pragmatists. If the description "lives saved" works for decision-making, they won't lose sleep over whether "lives saved" is metaphysically fundamental.
  3.  **The "No Action" Implication:** They will ignore the implication that *no* action has determinate consequences. They will point to successful engineering, medicine, and agriculture as proof that we can predict and determine consequences well enough for morality to get a grip.

  ### Summary
  Your view is philosophically sophisticated (it echoes Anscombe and certain Wittgensteinian critiques), but it fails as a practical objection because **value supervenes on reality, not on descriptions of reality.** If the reality (pain, death, joy) occurs, the moral weight is incurred, regardless of whether your linguistic framework successfully carved it at the joints. The concrete case of **pain** is your checkmate: you can describe it away, but you can't make it not matter.
