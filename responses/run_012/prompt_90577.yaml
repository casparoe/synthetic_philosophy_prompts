prompt: |-
  I'm on the board of a housing co-op — about two hundred members, a couple of buildings, a shared workshop — and we've been flirting with the idea of deciding some things by prediction market instead of by show of hands at the general meeting. The pitch, as I understand it, is that you fix some measure of what you care about (member wellbeing, or long-run cost per member, or what have you), let people bet on which policy will move that measure, and then just adopt whatever policy the market favours. I like the sound of it in the abstract, but my gut is all over the place once I get down to actual decisions, and I'd like to know whether there's a principle behind the mess or whether I'm just making it up as I go. To be clear, I'm not after a history of the idea or who invented it — I want to know what the thing actually commits you to, and where it breaks.

  Here's what I actually think. Spending the maintenance reserve on a new heating system rather than patching the old one: I'd happily let a market decide that — it's an empirical question about costs and comfort and I don't see why the meeting should outvote the forecasters. Raising the monthly member contribution by £15 to rebuild the reserve: no, that one I want a vote on, even though you could equally call it an empirical question about what keeps the books balanced. Admitting a third building into the co-op: market. Selling the workshop and splitting the proceeds: absolutely a vote, not a market. Renaming the co-op: vote, obviously — no metric captures taste, and I don't care what the market thinks about it. Endorsing a position on the local planning row: vote as well, and again the market's opinion is neither here nor there.

  Two cases tie me in knots. First, a shared-car scheme that only works if enough members expect it to work — there the market price would be partly causing the very thing it's meant to be predicting, so I can't tell whether to trust it or not. Second, anything where the 'measure' is itself the sort of thing members would start gaming the moment they knew it counted; we nearly adopted a member happiness score last year and I can see exactly how that ends. I keep flip-flopping over whether those two are reasons to distrust markets generally or just reasons to pick a better measure. So: is there one principle that gets all of my verdicts, or do some of them have to go? Please state it precisely, say what it predicts for a case I haven't mentioned — deciding by market whether to replace our volunteer treasurer with a paid bookkeeper — and be honest about which of my verdicts it simply can't accommodate.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Board member of a housing co-op (~200 members, multiple buildings, shared workshop).
      *   **Context:** Considering using prediction markets for decision-making instead of voting.
      *   **Goal:** Wants to understand the *principles* behind when prediction markets work vs. when voting is better. They have specific intuitions/verdicts on various scenarios and want to know if there's a unifying principle or if their intuitions are inconsistent.
      *   **Constraints:** No history/inventor talk. Focus on commitments and breaking points. State the principle precisely. Apply it to a new case (volunteer treasurer vs. paid bookkeeper). Be honest about which verdicts the principle can't accommodate.
      *   **Tone:** Intellectual, practical, direct, slightly philosophical but grounded in governance.

  2.  **Deconstruct the User's Verdicts:**
      *   *Heating System (Maintenance Reserve Spend):* Market OK. (Empirical, technical, outcome-based).
      *   *Raising Contributions (£15):* Vote. (Distributional, normative, "pain" is felt directly).
      *   *Admitting Third Building:* Market. (Growth, empirical capacity, resource strain).
      *   *Selling Workshop:* Vote. (Identity, asset liquidation, irreversible change).
      *   *Renaming:* Vote. (Identity, taste, no objective metric).
      *   *Local Planning Endorsement:* Vote. (Values, political stance, external signaling).
      *   *Shared-Car Scheme:* Knot. (Reflexivity/Performativity - the prediction affects the outcome).
      *   *Member Happiness Score:* Knot. (Goodhart's Law - gaming the metric).

  3.  **Identify the Underlying Tension:**
      *   Prediction markets aggregate *information* about *objective outcomes*.
      *   Voting aggregates *preferences* about *values and distribution*.
      *   The core conflict is between *Epistemic Authority* (who knows best?) and *Democratic Legitimacy* (who decides?).

  4.  **Formulate the Principle:**
      *   The user's intuitions align with a distinction between **Instrumental/Technical Decisions** vs. **Constitutive/Normative Decisions**.
      *   *Instrumental:* Means to an end. The end is agreed upon (e.g., "keep costs down," "keep things warm"). Markets excel here because they aggregate dispersed information about cause-and-effect.
      *   *Constitutive/Normative:* Ends in themselves. Defining who we are, what we value, or how burdens are shared. Markets fail here because there is no external "truth" to discover, only preferences to reconcile.
      *   *Reflexivity/Gaming:* These are boundary conditions where the market mechanism itself corrupts the truth signal.

      *Draft Principle:* **The Principle of Epistemic vs. Normative Authority.**
      *   *Epistemic:* Use markets when the question is "What will happen?" or "What is the most efficient way to achieve Goal X?" where Goal X is uncontested.
      *   *Normative:* Use votes when the question is "What should Goal X be?" or "Who bears the cost?" or "Who are we?"

  5.  **Test the Principle against User's Verdicts:**
      *   *Heating System:* Epistemic (Efficiency/Comfort). -> Market. (Matches).
      *   *Raising Contributions:* Normative (Distribution of burden). -> Vote. (Matches).
      *   *Admitting Building:* Epistemic (Capacity/Financial viability). -> Market. (Matches, though arguably has normative elements of community size).
      *   *Selling Workshop:* Normative (Identity/Asset base). -> Vote. (Matches).
      *   *Renaming:* Normative (Identity/Taste). -> Vote. (Matches).
      *   *Planning Endorsement:* Normative (Values/Politics). -> Vote. (Matches).
      *   *Shared-Car:* Reflexive. The market *creates* the reality. This breaks the "truth-seeking" function of the market. -> Vote (or pilot).
      *   *Happiness Score:* Goodhart's Law. The metric becomes the target, distorting behavior. -> Vote (or don't use that metric).

  6.  **Address the "Knots" (Reflexivity and Gaming):**
      *   *Reflexivity (Car Scheme):* Prediction markets assume the future is independent of the bet. If the bet *makes* the future happen (self-fulfilling) or *prevents* it (self-defeating), the price signal is corrupted. This isn't just a "bad metric" issue; it's a structural limit of prediction markets.
      *   *Gaming (Happiness):* This is Goodhart's Law. If the metric determines the reward, the metric stops being a good measure. This requires a metric that is hard to game or a decision process that doesn't rely solely on that metric.

  7.  **Apply to the New Case (Volunteer Treasurer vs. Paid Bookkeeper):**
      *   *Analysis:* Is this technical (efficiency/accuracy) or normative (community spirit/volunteering ethos)?
      *   *Co-op Context:* Co-ops usually value member participation. Paying someone reduces participation but increases professionalism.
      *   *Prediction:* The principle suggests a **Vote**. Why? Because it changes the social contract of the co-op (members contributing labor vs. members paying for labor). It's a shift in the "constitution" of the organization, not just a technical efficiency tweak.
      *   *Nuance:* A market could decide *if* we decide to professionalize, *who* to hire. But *whether* to professionalize is normative.

  8.  **Identify Where the Principle Breaks (Honesty Check):**
      *   The user's verdict on *Admitting a Third Building* is the weak point.
      *   *Why:* Expanding the co-op changes the community density, social dynamics, and "feel." It's not just a financial capacity question. It's partly constitutive.
      *   *Correction:* The principle suggests this should arguably be a Vote, or a Hybrid. The user said "Market." I need to point out this inconsistency.
      *   *Another Break:* The *Heating System*. If the reserve is depleted, it affects future contributions. That's distributional. But generally, it's technical enough.
      *   *Reflexivity:* The principle needs to explicitly exclude reflexive decisions from markets, regardless of whether they seem technical.

  9.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the question.
      *   *The Principle:* Define "Epistemic vs. Normative/Constitutive."
      *   *The Commitments:* What does using a market commit you to? (Truth exists, outcomes are measurable, preferences are secondary).
      *   *The Breaks:* Reflexivity and Goodhart's Law.
      *   *The Test Case:* Treasurer vs. Bookkeeper.
      *   *The Inconsistency:* Challenge the "Third Building" verdict.
      *   *Conclusion:* Summary advice.

  10. **Refining the Tone:**
      *   Avoid jargon where possible, but use precise terms (Epistemic, Normative, Reflexive, Goodhart's Law).
      *   Keep it respectful of the co-op context (democracy, community).
      *   Ensure the "Honesty" requirement is met (point out the Building verdict inconsistency).

  11. **Final Polish:**
      *   Check against constraints: No history? Check. Precise principle? Check. New case prediction? Check. Honest about mismatches? Check.
      *   *Self-Correction on the Principle:* Make sure it covers the "Gaming" aspect. The principle is about *what kind of question is being asked*. Gaming happens when you treat a normative goal as an epistemic metric.
      *   *Refining the "Building" critique:* Is it definitely a mismatch? If the criterion is purely "financial sustainability," a market works. If it's "community cohesion," a vote is needed. The user said "Market." I should argue that expansion is usually constitutive.

  12. **Final Output Structure:**
      *   The Principle (Epistemic vs. Normative).
      *   What the Market Commits You To.
      *   The Two Knots (Reflexivity & Gaming).
      *   The Test Case (Treasurer).
      *   The Inconsistency (The Third Building).
      *   Closing thought.

  (Thinking complete. Proceeding to draft response.)
answer: |-
  There is a principle that organises your intuitions, but it requires you to accept a hard distinction between two types of questions. Your gut is not making it up; it is distinguishing between **epistemic questions** (questions of fact and efficiency) and **normative questions** (questions of value and identity).

  ### The Principle: Epistemic Authority vs. Democratic Legitimacy

  **The Principle:** *Use prediction markets only for instrumental decisions where the goal is agreed upon and the uncertainty is purely empirical. Use voting for constitutive decisions where the goal is contested, the burden is distributed unequally, or the decision defines the community's identity.*

  A prediction market is an information-aggregation tool. It commits you to the idea that there is an objective "truth" about the future to be discovered, and that the crowd's weighted belief is the best way to find it.
  A vote is a preference-aggregation tool. It commits you to the idea that legitimacy comes from consent, and that members have a right to decide their collective fate regardless of "efficiency."

  Here is how this principle maps onto your verdicts:

  *   **Heating System (Market):** The goal (warmth/solvency) is agreed. The uncertainty is technical (cost/benefit). This is epistemic.
  *   **Raising Contributions (Vote):** The goal (solvency) is agreed, but the *burden* is distributional. Who pays? This is normative. A market might say "raise fees," but it cannot legitimate the pain of paying.
  *   **Selling Workshop (Vote):** This changes the asset base and the nature of the co-op. It is constitutive.
  *   **Renaming (Vote):** Purely expressive/identity. No external truth exists.
  *   **Planning Endorsement (Vote):** Values-based. No "correct" political stance exists to be predicted.

  ### The Two Knots: Where the Mechanism Breaks

  Your two "knots" are not just reasons to pick a better measure; they are structural limits of prediction markets.

  **1. Reflexivity (The Shared Car)**
  Prediction markets assume the future is independent of the bet. If the market's prediction *causes* the outcome (self-fulfilling) or *prevents* it (self-defeating), the price signal corrupts.
  *   **The Commitment:** If you use a market here, you commit to ignoring the feedback loop.
  *   **The Break:** In a co-op, if the market says "the car scheme will fail," members won't sign up, and it *does* fail. The market didn't predict the future; it dictated it. This violates the epistemic premise. **Verdict:** Vote (or pilot), because this requires active commitment, not passive forecasting.

  **2. Gaming (The Happiness Score)**
  This is Goodhart's Law: "When a measure becomes a target, it ceases to be a good measure."
  *   **The Commitment:** If you use a market here, you commit to the metric being robust against manipulation.
  *   **The Break:** If members know their "happiness score" determines policy, they will optimise for the score, not happiness. The market will efficiently price the gaming, not the wellbeing. **Verdict:** Vote, because you need a deliberative process to detect gaming, not a price signal that rewards it.

  ### The Test Case: Volunteer Treasurer vs. Paid Bookkeeper

  **Prediction:** **Vote.**

  **Reasoning:** While this looks like an efficiency question (accuracy of books vs. cost of salary), in a co-op context it is a constitutive question about labour and participation.
  *   **Epistemic view:** A paid professional makes fewer errors. A market could predict error rates.
  *   **Normative view:** A volunteer treasurer embodies the "self-help" ethos of the co-op. Paying someone externalises that labour and reduces member engagement.
  *   **Application of Principle:** Because this decision alters the social contract of membership (am I an owner-operator or a customer?), it is normative. Even if the market confidently predicts the paid bookkeeper will save £500 in tax penalties, the members may rightly prefer the volunteer model to maintain community cohesion. Legitimacy trumps efficiency here.

  ### The Inconsistency: Admitting a Third Building

  You must accept that your verdict on **Admitting a Third Building** contradicts the principle.

  You classified this as a **Market** decision. However, expanding the co-op is rarely just a question of financial capacity or physical space (epistemic). It is a question of **social density and community identity** (normative).
  *   Adding 50 new members changes the atmosphere of the meetings, the strain on shared norms, and the feeling of "knowing your neighbours."
  *   If you use a market, you are asking: *"Will adding this building be financially viable?"*
  *   If you use a vote, you are asking: *"Do we want to be a larger, different kind of community?"*

  If your criterion for the building is strictly "will this bankrupt us?", a market works. But if there is *any* consideration of "will this change the vibe we love?", the principle demands a vote. Most housing co-ops find that physical expansion is inextricably linked to social identity. To be consistent with your refusal to sell the workshop (another asset/identity decision), you should treat admitting a new building as a **Vote**.

  ### Summary of Commitments

  If you adopt this principle, you are committing to the following:

  1.  **Markets are for "How," Votes are for "What" and "Who."** Markets optimize the path to a goal; votes select the goal and the people who walk the path.
  2.  **No Reflexive Bets.** You will not use markets for decisions where the prediction influences the outcome (coordination problems).
  3.  **No Metric Targets.** You will not use markets to decide policy based on a metric that members can influence directly (to avoid Goodhart's Law).
  4.  **Legitimacy over Efficiency.** You accept that members may vote for a "worse" outcome (by market standards) because it is *theirs*.

  Your gut is correct. The mess you feel is the friction between trying to run a community like a firm (efficiency) and running it like a polity (legitimacy). Prediction markets are excellent tools for the former, dangerous tools for the latter.
