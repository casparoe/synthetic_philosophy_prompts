      *   *Correction:* The blog says "maximize happiness when it's convenient." That's a strawman of utilitarianism too. Utilitarianism demands maximization even when *inconvenient*. I should point that out.
      *   *Correction:* The snapping fingers example: Nozick asks if it's permissible. He suggests it's *not*. This implies animals have value independent of the pain they feel (i.e., death itself is a loss to them).

