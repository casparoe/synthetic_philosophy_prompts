      *   *Nozick's Actual Angle:* Explain the "moral weight" vs. "inviolable rights" distinction. He's probing the limits of utilitarianism.

  6.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to get too bogged down in "side constraints" jargon without explaining it. Keep it high-school friendly.
