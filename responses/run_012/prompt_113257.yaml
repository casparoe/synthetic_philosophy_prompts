answer: |-
  The phrase is usually doing the work of immunising a theory against falsification by shifting the burden of proof from the present evidence to an indefinite future.

  To understand why this move is so seductive yet so problematic, you need to separate out the different logical structures hiding inside that single sentence, because they range from trivial truths to pseudoscience. Consider first the reading that treats the prediction as a conditional claim, meaning Malthus argued that if population grows geometrically and food arithmetically then collapse follows, and since technology changed the growth functions the antecedent simply never obtained. This is a platitude; it is technically true that if the conditions change the original prediction does not apply, but it surrenders the core of Malthusianism because Malthus claimed those growth rates were natural laws rather than contingent historical facts, so admitting they were wrong about the rates is admitting the theory was wrong about the world. A more robust interpretation suggests the theory asserts a tendency that is always operative but masked by counteracting causes, much like gravity is always pulling you down even when the floor pushes you up. This is a substantive and defensible claim, provided you can specify what the counteracting causes are and show that the tendency remains measurable when they are controlled for, but it requires conceding that the simple prediction of collapse was incomplete rather than merely delayed. Then there is the claim that the prediction was indexed to a horizon that has not elapsed yet, implying the collapse is inevitable but simply scheduled for a later date. This is something false in the context of science because without a specified date or a defined state of affairs that triggers the event, the claim becomes compatible with any possible future observation and therefore explains nothing. You might also hear that he was right about the mechanism and wrong only about the aggregate, meaning resource limits are real even if innovation keeps pushing the boundary out. This is substantive and defensible, as it isolates the insight about finite constraints from the failed calculation of when those constraints would bind, but it transforms the theory from a prediction of doom into a warning about pressure. Another variant is that what he got right was which variables matter, not what would actually happen, acknowledging that population and food supply are linked without endorsing the catastrophic outcome. This is also substantive and defensible, and arguably the most charitable reading, but it abandons the specific prediction of collapse entirely in favour of a general model of interaction. Finally, there is the reading that it is just a device for never letting any evidence count against the theory at all, where every reprieve is reinterpreted as proof that the pressure is building rather than evidence that the pressure has been relieved. This is something false and renders the theory unscientific, as it violates the basic requirement that there must be some possible observation that could prove the theorist wrong.

  Your friend almost certainly needs the third reading, the one about the horizon that has not elapsed yet, in order to maintain the dramatic force of the original prediction that collapse is inevitable. However, he is quietly borrowing the credibility of the second or fifth reading, the ones about tendencies or variables, because those sound reasonable and scientifically respectable. He wants the certainty of the catastrophe without the risk of the deadline, using the plausibility of finite resources to sell the inevitability of the crash while keeping the timing vague enough to survive another century of growth. This is a classic bait and switch where the defensibility of the variables is used to shield the indefensibility of the timeline, allowing him to treat the continued survival of humanity not as evidence against the theory but as evidence of its pending validation.

  To turn this from a rescue mission into something that could actually be tested, you would have to add a specific date, a specified horizon and a rate of approach to it, or at least a concrete threshold condition like a specific ratio of people to arable land that must not be exceeded. Without a date or a threshold, the word eventually does no work, because it is compatible with the theory being true in one year or in one million years, and a theory that fits every timeline fits no timeline. You would also need to specify the mechanism of the collapse so that we know what to look for, rather than just assuming that something bad will happen because the math says so. The temporary reprieve line is the same move over again, merely dressed up as historical analysis rather than future prediction. By calling the last century a reprieve, he is defining the current state of affairs as an exception to the rule rather than a counterexample to it, which preserves the rule from falsification by fiat. This keeps the theory safe from evidence by categorising all positive evidence as temporary and all negative evidence as inevitable, which is precisely the kind of reasoning that separates dogma from science.
