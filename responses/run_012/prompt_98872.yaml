answer: |-
  This is a remarkably precise phenomenological description of a normative state that analytic ethics often flattens. You are right to reject "moral residue" (which implies a tragic dilemma or wrongdoing) and "grief" (which is pathos, not deontology). You are also right that *prima facie* duty doesn't capture it, because there is no weighing happening; the primary duty has simply vanished, yet something remains.

  Here is the carving you asked for.

  ### 1. The Diagnosis: Why the Standard Terms Fail
  The reason you cannot find this in post-Kantian literature is that modern deontology (especially the analytic tradition) tends to treat promises as **transactional algorithms**: *If P, then Obligation O to do X.* If *X* becomes impossible, *O* evaporates. The "release" is a logical operator that nullifies the string.

  But your experience suggests that a promise is not just a transaction; it is a **constitutive act of relationship**. It creates a normative status between two agents. When the *object* of the promise (the book) dies, the *status* (the collaboration) does not instantly dissolve. It lingers.

  The standard terms fail because:
  *   **Prima Facie Duty:** Assumes a competition between duties. Here, there is no competition, only a transformation.
  *   **Moral Residue:** Assumes a moral remainder *because* something went wrong (a dilemma was navigated). Here, nothing went wrong; the world simply changed.
  *   **Grief:** Captures the affect but misses the *claim*. You feel *owed* by the situation, not just sad about it.

  ### 2. The Airport Asymmetry: Second-Personal Authority
  Your intuition about the airport case is correct, and it is the key to unlocking the rest. This is not something you talked yourself into.

  This asymmetry is best explained by Stephen Darwall's concept of **Second-Personal Authority**. When you make a promise, you give the promisee a specific authority over your normative landscape: the authority to release you.
  *   **Case A (Friend releases you):** She exercised her authority. The normative bond was formally dissolved. The "lock" is open. No remainder.
  *   **Case B (Unilateral assumption):** You assumed the authority that belonged to her. Even if the ride was unnecessary, you usurped her right to determine whether the promise stood. The "lock" is still engaged, even if the door is broken. You owe an explanation not because she was inconvenienced, but because you violated the **authority structure** of the promise.
  *   **Case C (Advisor died):** He *could not* exercise his authority. The lock remains engaged. However, the object (writing the book) is impossible. Therefore, the obligation cannot bind your *actions* (writing), so it binds your *narrative* (attribution, acknowledgment).

  ### 3. The Concept: Normative Survivance
  There is no single standard term for this, though "surviving obligations" is sometimes used in legal contexts regarding death. For the philosophical phenomenon you are describing, I propose we coin the term:

  **Normative Survivance**

  *(I choose "survivance" over "survival" to imply an active, resistant presence, borrowing from literary theory, rather than a passive remaining.)*

  **Definition:** *Normative Survivance* is the obligation that persists after the performance condition of a commitment has become impossible, provided the commitment has not been formally rescinded by the promisee.

  **What it covers:**
  It covers the shift from a **Duty of Performance** (do the thing) to a **Duty of Fidelity** (honor the history of the bond).

  **Why it fits your case:**
  *   **The Book:** The Duty of Performance is dead (impossible). The Duty of Fidelity survives. It demands you do not erase the collaborative history. You must attribute, acknowledge, and speak truthfully about the project's genesis.
  *   **The Airport:** If you unilaterally cancel, Normative Survivance dictates you owe an account of why you assumed release, because the bond was not formally dissolved.
  *   **The Death:** Because the promisee cannot rescind, the Survivance is permanent. It becomes a permanent feature of your moral landscape regarding that project.

  ### 4. Distinguishing Edges
  You asked where the edges are. Here is the boundary work:

  *   **It is not Habit:** Habit is descriptive ("I usually do this"). Survivance is normative ("I *ought* to do this").
  *   **It is not Reputation:** As you noted, it applies even if no one knows. It is a duty to the *truth of the relationship*, not to public perception.
  *   **It is not Grief:** Grief is about *loss*. Survivance is about *binding*. You can feel Survivance without sadness (e.g., a promise to a living friend that becomes impossible but unrescinded).
  *   **Scope:** It attaches to **any commitment that establishes a normative relationship**, but its weight is proportional to the **constitutive nature** of the promise.
      *   *Transactional Promise* ("I'll buy milk"): Low Survivance. If the store closes, the obligation vanishes almost entirely.
      *   *Constitutive Promise* ("We will write this book together"): High Survivance. The promise defined a relationship (collaborators). That relationship's history must be honored even if the output is impossible.

  ### 5. An Ancient Bridge (For the Ancientist)
  Since you mentioned your specialty, it is worth noting why you might feel "out of depth" post-Kant on this. This phenomenon is actually much more at home in **Ancient and Roman ethics** than in modern deontology.

  *   **Kant/Analytic:** Focuses on the *act* and the *rule*. If the act is impossible, the rule is inapplicable.
  *   **Aristotle/Stoics/Romans:** Focus on *Pistis* (Greek) or *Fides* (Latin). This is not just "trust"; it is a **bond of faithfulness**. *Fides* is a relational glue that outlasts specific transactions.

  In Roman *fides*, the obligation lies in the integrity of the person bound, not just the utility of the exchange. When your advisor died, the *contract* died, but the *fides* remained. You are feeling the pull of **Fidelity** rather than **Duty**. Modern ethics struggles to name this because it largely abandoned *Fides* in favor of *Obligation*.

  ### Summary
  *   **The Name:** **Normative Survivance** (or **The Duty of Fidelity to the Record**).
  *   **The Mechanism:** A promise creates a relational status. If the *act* dies but the *status* is unrescinded, the obligation migrates from *performance* to *acknowledgment*.
  *   **The Asymmetry:** Real. Based on the promisee's exclusive **Second-Personal Authority** to release. Unilateral assumption leaves a remainder; formal release clears it.
  *   **The Edge:** Applies to all promises, but weighs heavily on **constitutive commitments** (those that define a relationship) rather than **transactional ones**.

  You are not confused about the grammar. You are sensing a category that modern ethics largely forgot: that promises bind us to *people* and *histories*, not just to *outcomes*. When the outcome vanishes, the bond remains.
