answer: |-
  ### The question

  Mechanistic anomaly detection aims to flag model behavior generated by mechanisms diverging from those operative during training, even when outputs remain nominal. This promises early warning for deceptive alignment or distributional shift. However, the core concept relies on an unexamined criterion of mechanism identity. If identity requires weight equality, normal maintenance registers as anomalous; if it requires only input-output equivalence, the definition collapses into behavioral monitoring. The central question is whether a stable intermediate criterion exists. I propose investigating a causal-role account, where mechanism identity is relativized to a task and a class of permitted interventions. Can this relativization be made precise enough to ground anomaly detection, or does it dissolve into arbitrariness? Resolving this is prerequisite to knowing what safety tools are actually measuring.

  ### Why the obvious answers leave it open

  Current practice oscillates between two untenable poles. The first treats mechanisms as identical only if their physical substrates—weights, activation patterns, or circuit components—match closely. This is too fine-grained. Retraining with a different random seed, pruning redundant connections, or migrating models to new hardware would all trigger false positives, rendering the detector useless for safety monitoring. In a real-world deployment, models are updated and fine-tuned; a safety system that flags every weight update as an anomaly is operationally dead. The second pole treats mechanisms as identical if they produce the same input-output function. This is too coarse. It defeats the purpose of mechanistic interpretability, which is to detect internal shifts before they manifest externally, such as when a model learns to hide malicious intent. Without a middle ground, we cannot distinguish between benign implementation changes and dangerous internal rewiring. Practitioners currently rely on intuition rather than a defined criterion, leaving the field vulnerable to conceptual confusion. We lack a principled way to say when a computation has "moved" versus when it has merely changed clothes. Consequently, claims about detecting anomalies rest on shaky metaphysical ground. This ambiguity creates risk: we may certify models as safe based on mechanistic assurances that dissolve under slight architectural changes. If we cannot define what counts as the "same" mechanism, we cannot guarantee that a model remains aligned after fine-tuning. The safety case for mechanistic monitoring depends entirely on solving this identity problem.

  ### The approach, and why this angle rather than the alternatives

  I will evaluate a causal-role criterion, positing that two structures count as the same mechanism when they occupy the same node in a causal graph relativized to a specific task and a class of permitted interventions. This approach avoids the rigidity of structural identity by allowing physical realization to vary, provided the causal contribution remains invariant under relevant interventions. It avoids the emptiness of behavioral equivalence by requiring internal causal structure to persist, not just outputs. The critical work lies in defining the "permitted interventions." For example, if we intervene on weights and the function breaks, was it the same mechanism? If we intervene on hardware and it holds, was it?

  This angle is superior to purely informational accounts, which struggle with redundancy, and structural accounts, which struggle with rerouting. I will test this criterion against three specific cases. First, rerouted computation, where a task shifts to different components but preserves causal role. A structural view calls this an anomaly; a causal-role view might not. Second, duplicated computation, where one copy becomes causally idle. Is the idle copy part of the mechanism? Third, distributed codes with no persisting parts across runs. Here, there is no stable component to identify, only a stable pattern of activity.

  The goal is to determine if the intervention class can be specified non-arbitrarily. If the choice of interventions depends entirely on the observer's interests rather than the model's ontology, the concept collapses. This philosophical groundwork is necessary before empirical resources are committed to building detectors that may lack a coherent target. The analysis will focus on whether the "task relativization" can be grounded in the model's training objective or remains an external imposition. If the latter, the anomaly detection is not discovering facts about the model, but projecting categories onto it. Furthermore, I will contrast this with counterfactual accounts of causation, examining whether standard causal models suffice or if a new formalism is required to handle the distributed nature of neural representations. The methodology involves constructing thought experiments where the causal graph is manipulated independently of the physical substrate. I will examine whether the "same node" condition holds when the underlying mathematics changes but the causal influence remains constant. Additionally, I will explore whether the "task relativization" can be automated or if it requires human judgment, which would limit scalability. The aim is to produce a robustness check for the field's foundational assumptions.

  ### What a result and a failure would look like

  A positive result would yield a precise definition of mechanism identity relative to intervention classes, demonstrating how to distinguish benign rerouting from dangerous internal shifts. This would validate mechanistic anomaly detection as a coherent research program. It would provide interpretability researchers with a checklist for validating their detectors against the defined criterion. A negative result would show that any criterion for mechanism identity is inevitably arbitrary or interest-relative, implying that "anomaly" cannot be defined independently of specific safety goals. Both outcomes are valuable. The former provides a foundation for tool-building; the latter prevents wasted effort on ill-posed problems. The deliverable will be a workshop paper arguing for the viability or collapse of the concept based on this analysis. It will clarify the metaphysical commitments required for interpretability research to succeed. The paper will be targeted at venues focusing on AI safety or philosophy of machine learning, ensuring the argument reaches those building the tools. Even a negative conclusion advances the field by forcing a pivot toward behavioral guarantees or alternative safety frameworks. It clarifies the boundary between what is technically measurable and what is conceptually coherent.

  ### Scope and timeline for one term of part-time work

  This project fits a one-term, part-time schedule (10 weeks, ~10 hours/week). Weeks 1-3 will focus on formalizing the test cases and mapping the conceptual space. Weeks 4-7 will involve developing the causal-role criterion and stress-testing it against the cases. Weeks 8-10 will be dedicated to drafting and revising the paper. As this is conceptual work, it does not require compute resources or data collection, making it feasible alongside other commitments. The timeline allows for deep reflection on the causal definitions without the pressure of experimental debugging. Final week reserved for formatting and submission. Regular check-ins will ensure the argument remains tight and avoids drifting into general philosophy of mind. The scope is limited to the specific problem of mechanism identity, avoiding broader questions of alignment theory.
