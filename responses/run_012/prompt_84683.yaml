answer: |-
  # Materials
  *   **Projector File:** A simple animation loop. Two positions (Left/Right).
      *   Trial 1: 30ms gap (too fast, likely fusion).
      *   Trial 2: 60ms gap (sweet spot for phi).
      *   Trial 3: 100ms gap (sweet spot for color phi).
      *   Trial 4: 200ms gap (too slow, two distinct dots).
      *   *Colors:* Red dot (Left), Green dot (Right).
  *   **Data Sheets (8 copies):** Columns for Trial 1–4. Rows for "Motion Seen? (Y/N)", "Color Change Seen? (Y/N)", "Where did color change? (Start/Mid/End)".
  *   **Theory Envelopes (3 copies):** Labeled Team A, Team B, Team C. (Contents detailed below).
  *   **Whiteboard:** Divided into three columns for Timelines.

  # Timeline (75 Minutes)

  ### 0:00–0:20 | Phase 1: Data Collection (Pairs)
  1.  **Setup (2 min):** Divide class into 8 pairs. One **Subject**, one **Recorder**. (Swap roles halfway if time permits, otherwise stick to one run to save time).
  2.  **Instructions (3 min):** Tell Subjects: "Report exactly what you experience, not what you think happened. If you see two static dots, say 'two static dots.' Do not try to help the theory." Tell Recorders: "Log the report verbatim. If the Subject sees nothing, mark 'Null.' Null data is valid data."
  3.  **The Run (10 min):** Run the 4 trials twice per pair.
      *   *Trial 1 (30ms):* Expect fusion or blur.
      *   *Trial 2 (60ms):* Expect motion, maybe no color change.
      *   *Trial 3 (100ms):* Expect motion + color change mid-path (Color Phi).
      *   *Trial 4 (200ms):* Expect two static dots.
      *   *Note:* Pause between trials. Ask for a show of hands on "Who saw motion?" and "Who saw color change?" Acknowledge the ~1/3 who saw nothing. Write this percentage on the board.
  4.  **Collect (5 min):** Gather sheets. Tally the "Color Phi" successes vs. "Null" reports.

  ### 0:20–0:40 | Phase 2: Theory Construction (Teams)
  1.  **Split (2 min):** Divide room into 3 teams (5–6 students each). Hand out sealed envelopes.
  2.  **Task (18 min):** Each team must produce:
      *   **Timeline:** A second-by-second map of the subject's brain/mind state during Trial 3 (100ms gap). Mark exactly when the content becomes "conscious."
      *   **Prediction:** What the subject reports at 30ms, 60ms, 100ms, 200ms.
      *   **Smoking Gun:** One specific observation (behavioral or report-based) that would prove their theory right and the others wrong.
  3.  **Envelope Contents:**
      *   **Team A (The Delay/Edit):** "The brain waits for the second flash before finalizing the first. It constructs a coherent movie *then* presents it to consciousness. The subject genuinely sees the change mid-path because the presentation is delayed." (Stalinesque).
      *   **Team B (The Overwrite):** "Consciousness happens instantly. The first dot is seen as red. The second flash triggers a memory edit. The subject *thinks* they saw a change, but the original experience was static red." (Orwellian).
      *   **Team C (The Multiple Drafts):** "There is no single 'consciousness moment.' Different properties (location, color, motion) are processed in different streams. The question 'When did the color enter experience?' assumes a single finish line that doesn't exist. The report is just one draft among many." (Dennett).

  ### 0:40–1:00 | Phase 3: The Showdown (Umpiring)
  1.  **Present (15 min):** Each team draws their timeline on the board.
      *   *Rule:* You must point to a specific millisecond where the subject *could report* the color change.
      *   *Umpire (You):* Challenge Team A: "If the brain waits, why do reaction times not show the delay?" Challenge Team B: "If memory is overwritten, how do you distinguish it from genuine experience?" Challenge Team C: "If there's no fact of the matter, why did 2/3 of the room give the same report?"
  2.  **The Smoking Gun (5 min):** Teams reveal their test.
      *   *Likely Outcome:* Team A and B propose tests requiring brain scans (too late) or rely on introspection (unreliable). Team C proposes that varying the post-stimulus masking changes the report, proving no fixed draft exists.
      *   **Verdict:** Declare **No Winner**. State clearly: "Based strictly on subject report and behavior, A and B are empirically equivalent. C dissolves the question rather than answering it."

  ### 1:00–1:15 | Phase 4: Debrief & Limits
  1.  **The Cartesian Theater (5 min):** Explain that Team A and Team B both assume a **single place and time** where things become conscious (the Theater). They only disagree on whether the editor works before the show (A) or after the show (B).
  2.  **The Dodge (5 min):** Team C denies the Theater. There is no audience. There are only drafts. The "Color Phi" isn't a mistake; it's the brain's standard way of filling gaps.
  3.  **The Hard Limits (5 min):** (See Instructor Reality Check below).

  ---

  # Instructor Reality Check: Troubleshooting & Limits

  ### 1. The "Wriggle Out" (Processing vs. Consciousness)
  *   **The Problem:** Team A or B will say, "The brain processes it unconsciously, then consciousness happens." They try to hide the "moment" in undefined processing time.
  *   **The Fix:** Enforce the **Reportability Rule**. "You must mark the timeline where the subject *could verbally report* the color. If you say 'processing,' tell me: is the subject conscious of it yet? If yes, mark it. If no, it doesn't count for the phenomenology." Force them to commit to a "Conscious Access" timestamp.

  ### 2. The "Contamination" Student
  *   **The Problem:** A student insists, "The second dot physically changes the first dot's signal in the eye/brain, so the change is real."
  *   **The Fix:** Validate the mechanism, challenge the metaphysics. "You are describing retroactive interference. That supports Team C (distributed processing) or Team B (memory overwrite). But does it prove there was a *moment* the subject saw the change? No. You are describing the causal chain, not the phenomenological timestamp. The illusion persists even if we know the physics."

  ### 3. The "Null" Data (The 1/3 who see nothing)
  *   **The Problem:** Students think the experiment failed if someone doesn't see the motion.
  *   **The Fix:** Frame this as **Individual Difference in Drafting**. "For 1/3 of you, the brain didn't generate the motion draft. For 2/3, it did. This proves the experience is constructed, not received. If there were a Cartesian Theater receiving raw data, you should all see the same flashes."

  ### 4. The Hard Philosophical Limits (Must be stated explicitly)
  *   **Limit 1: Empirical Equivalence.** You must tell them: "This activity **does not prove** Multiple Drafts is true. It only proves that Introspection cannot distinguish between Stalinesque (A) and Orwellian (B) revision. Dennett's claim is stronger: he says the distinction is *in principle* empty. This demo shows the *epistemic* block; you must argue the *ontological* claim yourself."
  *   **Limit 2: No Positive Picture.** The activity destroys the Theater but doesn't fully build the Alternative. Students will leave feeling like "nothing is real." Clarify: "Multiple Drafts isn't nihilism. It says content is real, but it's not located in a single stream. It's like asking 'Where is the game of tennis?' You can't point to one ball bounce."
  *   **Limit 3: Contested Ground.** Admit that many philosophers (e.g., Block, Chalmers) reject Dennett's dissolution. "Team C's position is controversial. Some argue there *must* be a fact of the matter about phenomenal consciousness, even if we can't measure it. If you find C unsatisfying, you are in good company."

  ### 5. Managing the "No Winner" Ending
  *   **Risk:** Students feel cheated if no team wins.
  *   **Mitigation:** Frame the "No Winner" as the **Point**. "If A or B won, we would still be stuck in the Theater. The fact that you cannot distinguish them using report is the evidence that the Theater model is broken. The stalemate is the victory for Team C."
