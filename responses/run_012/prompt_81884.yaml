      *   **Friend's View (Philosopher):** "Ought implies can." If you can't do both, you weren't truly required to do both. One obligation dissolves.
      *   **User's View:** Suspects the philosopher is wrong ("horse shit"), but wonders if that's writer bias or genuine insight.
      *   **Constraints:**
          *   Translate the philosophical debate into novelist vocabulary (characters, scenes, stakes, subtext, etc.).
          *   No dumbing down, no dressing up.
