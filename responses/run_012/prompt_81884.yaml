          *   Address the "Residue": What doesn't translate? What gets lost on both sides?
          *   Verdict on the residue: Is the novelist's vocabulary missing something, or is the philosophy fuzzy? (User suspects the latter).
          *   Test Case: The woman, dying husband (promise: no nursing home), hurt daughter (promise: no leaving alone with him). He's getting worse.
          *   Tone: Direct, respectful, peer-to-peer (writer to writer), analytical but grounded.

  2.  **Deconstruct the Philosophical Debate (Internal Knowledge):**
      *   *The Conflict:* Moral Dilemmism (genuine conflicts exist) vs. Monism/Deontic Logic (genuine conflicts are impossible due to logical consistency of "ought").
      *   *Key Argument (Against Dilemmas):* "Ought implies Can." If $A$ ought to do $X$ and $A$ ought to do $Y$, but $A$ cannot do both $X$ and $Y$, then the system is inconsistent. To resolve, one "ought" must be overridden or cancelled. Therefore, there is always a *single* right answer (even if it's tragic), or one obligation wasn't real.
      *   *Key Argument (For Dilemmas):* Moral residue (guilt remains even after choosing), conflicting absolute duties, the phenomenology of choice feels like tragedy, not calculation.
      *   *Translation Challenge:* Moving from deontic logic ($O(A) \land O(B) \land \neg \diamond(A \land B)$) to narrative stakes.

  3.  **Drafting - Section by Section:**

      *   **Part 1: The Translation (Philosophy into Novelist Speak)**
          *   *Concept:* "Ought implies Can."
          *   *Novel Term:* "Plot Logic" or "Actionable Stakes."
          *   *The Philosopher's Move:* If a character physically cannot turn left and right at once, the script shouldn't say "Must turn left" AND "Must turn right." One of those directions is a false lead.
          *   *The Dilemmist Move:* The script *does* say both. The tragedy is the point. The "sin" or "cost" sticks to the character regardless of the turn.
          *   *Distinction:* "Hard Choice" (one path is clearly better, just painful) vs. "Trapped" (both paths break the character's code).
          *   *Word Problem Flag:* The fight is often about the definition of "Right." Is "Right" the *best available option* or the *absolute standard*?

      *   **Part 2: The Residue (What gets lost?)**
          *   *Philosophy -> Fiction:* Philosophy wants a clean verdict. Fiction wants the aftermath. Philosophy cares about the moment of choice; Fiction cares about the scar.
          *   *Fiction -> Philosophy:* Fiction uses *time*. Philosophy is often static. Fiction uses *relationship* (the husband/daughter dynamic), philosophy uses *agents* and *duties*.
          *   *The "Fudge":* Philosophers treat promises as equal weights. Novelists know promises have emotional mass (guilt, history, love).
          *   *Verdict on Residue:* The user suspects philosophy is fuzzy. I need to validate this without being dismissive. The "fuzziness" is often philosophy trying to be math when it's biology/psychology. However, fiction sometimes romanticizes the trap.

      *   **Part 3: The Test Case (The Woman, Husband, Daughter)**
          *   *Scenario:* Promise to Husband (No home) vs. Promise to Daughter (No unsupervised).
          *   *Philosopher Analysis:* One promise must override. Safety (Daughter) usually trumps Comfort (Husband). Therefore, keeping husband home is the *wrong* choice objectively. It's a hard choice, not a dilemma.
          *   *Novelist Analysis:* It *is* a dilemma because the *cost* is the point. If she chooses safety, she betrays the dying wish (grief). If she chooses wish, she endangers the daughter (guilt/fear).
          *   *Does it change the page?* If you write it as a "Hard Choice," she calculates. If you write it as a "Dilemma," she fractures.
          *   *Advice:* Write the fracture. The philosopher says one guilt is irrational. The novelist knows both guilts are real.

  4.  **Refining the Tone:**
      *   Avoid academic jargon (deontology, utilitarianism, Kantian).
      *   Use terms like "arc," "beat," "subtext," "interiority."
      *   Be honest about the "Word Problem."
      *   Address the "Verdict" directly.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I give a reading list? No.
      *   *Check:* Did I name philosophers? No.
      *   *Check:* Is the distinction between "Hard Choice" and "Genuine Dilemma" clear?
      *   *Check:* Did I answer the "Residue Verdict"? Yes, need to make sure I side with the user's intuition but acknowledge where logic helps.
      *   *Check:* The Test Case needs to be specific. Does the answer change what goes on the page? Yes, it changes the *interiority*.

  6.  **Final Polish:**
      *   Ensure the "Word Problem" is flagged clearly.
      *   Make sure the distinction between "Best Available Option" and "Absolute Right" is clear in narrative terms.
      *   Strengthen the "Residue" section. The key insight is that philosophy seeks *resolution*, fiction seeks *consequence*.

  7.  (Mental Sandbox for the Verdict): The user thinks philosophy is fuzzy. I should agree that philosophy often strips context to make the logic work, which makes it "fuzzy" when applied to real life. But I should also note that fiction can sometimes be *too* muddy. The verdict should be: Philosophy is trying to build a map; Fiction is walking the terrain. The map isn't wrong, but it leaves out the mud.

  8.  (Final check on constraints): "No names and no reading list." "Don't dumb it down." "Restate faithfully."

