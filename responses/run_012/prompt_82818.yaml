answer: |-
  Here is the battle plan. Your friend's position is a classic "eliminativist" trap: if you can't draw a straight line from atom to outcome, you're invoking magic. Your goal isn't to prove him wrong about physics, but to prove him wrong about *explanation*.

  ### 1. The Carrier Example: Do Not Use Conway's Life
  **Verdict:** It is a mistake for this specific fight.
  **Why:** Life is a closed, deterministic formal system. It validates your friend's bias: "The glider is just the rules playing out." It lacks *function* and *selection*. Your friend's argument hinges on *capabilities* (arithmetic) emerging without explicit *objectives*. Life has no objectives.
  **The Replacement:** **The Evolution of the Vertebrate Eye.**
  **Why:** It is the historical battlefield for this exact distinction (Paley's Watchmaker vs. Darwin). It involves *function* (seeing), which maps to your friend's "arithmetic" claim. It allows you to show intermediate steps (Cranes) that are useful on their own, refuting the idea that the final complex function must have been "planned" or "magical."

  **What the example must HAVE:**
  *   **Hierarchy:** Distinct levels (photocells -> nerve clusters -> cup -> lens).
  *   **Function:** Each level must *do* something useful (detect light -> detect direction -> detect shape).
  *   **Traceability:** You must be able to show how Level B builds on Level A without a leap.

  **What the example must LACK:**
  *   **A Designer:** No "eye-maker."
  *   **Finalism:** No promise at Step 1 that Step 10 is the goal.

  ### 2. Prerequisites: What Must Land First
  Before you utter the words "Crane" or "Skyhook," you must establish three concepts. If these don't stick, the distinction collapses into "physical vs. spooky."

  1.  **Competence Without Comprehension:** The system can *do* something (see, calculate) without *understanding* it. This undermines the friend's idea that arithmetic requires an "arithmetic objective."
  2.  **Levels of Abstraction are Real:** A software bug cannot be fixed by looking at the transistor voltage. The "software level" is a real causal layer, not just a convenient fiction.
  3.  **The "Design Space" Problem:** Complex function is rare. Finding it requires a search process.

  ### 3. The Sequence & Misconception Traps
  Here is the flow of the session, with specific intervention points for your friend's anticipated objections.

  **Phase 1: The Reductionist Baseline (15 mins)**
  *   **Action:** Agree with your friend. "Yes, everything is physics. No magic."
  *   **Trap:** Friend smirks, thinking he won.
  *   **Intervention:** Define **Greedy Reductionism**.
      *   *Say:* "Greedy Reductionism isn't saying 'it's all physics.' It's saying 'explaining it *only* as physics is bad science.' If I ask why the plane crashed, and you say 'because of quantum tunneling in the aluminum,' you are being a greedy reductionist. You skipped the causal layer (aerodynamics/pilot error) that actually explains the event."
      *   *Goal:* Separate "Reductionism" (true) from "Greedy Reductionism" (unhelpful).

  **Phase 2: The Design Problem (30 mins)**
  *   **Action:** Introduce the Eye. Ask: "How do we get a camera-quality lens from random mutations?"
  *   **Trap:** Friend argues, "The probability is too low. It needs a Skyhook (Designer/Luck)."
  *   **Intervention:** Introduce the **Crane**.
      *   *Say:* "We don't jump from 'skin' to 'eye.' We go skin -> light-sensitive spot -> cup -> pinhole -> lens. Each step is an improvement *on its own*. The 'cup' isn't a broken eye; it's a perfect direction-detector. These intermediate functional steps are Cranes. They lift us to the next level."
      *   *Goal:* Show that "magic leaps" are only necessary if you ignore the intermediate scaffolding.

  **Phase 3: Mapping to the Neural Net (30 mins)**
  *   **Action:** Bring the fight home. "Your friend says NN arithmetic is a Skyhook because it wasn't in the loss function."
  *   **Trap:** Friend doubles down: "If it wasn't selected for, it's magic."
  *   **Intervention:** Apply the Eye logic.
      *   *Say:* "Arithmetic wasn't the *goal*, it was a **spandrel** (a byproduct). The network was trained on language. Language has logical structure. To model language, the net built internal tools that *could* handle logic. The 'Crane' wasn't the arithmetic objective; the Crane was the *architecture + data structure*. The arithmetic rode on the back of the language crane."
      *   *Goal:* Reframe "unexpected capability" from "Magic Skyhook" to "Byproduct of a different Crane."

  ### 4. The Diagnostic Question
  At the end, do not ask "Do you understand?" Ask this:

  > **"If we can trace the causal chain from the bottom-level rules to the high-level capability, step-by-step, but nobody *predicted* that capability in advance: Is that a Skyhook or a Crane?"**

  *   **Correct Answer:** Crane. (Skyhooks are defined by a *lack* of causal support from below, not by human surprise.)
  *   **Friend's Likely Wrong Answer:** Skyhook. (Because he conflates "unexpected" with "uncaused.")
  *   **Why this works:** It forces the room to decide if the definition rests on *ontology* (how it works) or *epistemology* (what we knew beforehand). Dennett is ontological; your friend is epistemological.

  ### 5. What to Refuse to Cover
  You cannot win the whole philosophy of mind in one night. Draw these boundaries explicitly at the start:

  1.  **The Hard Problem of Consciousness:** "We are not discussing qualia or feeling today. We are discussing function and explanation." (Prevents the "But does the net *feel* math?" derailment).
  2.  **The Math of Backprop:** "We are treating the Neural Net as a black box that learns, not a calculus problem." (Prevents getting bogged down in technicalities about gradient descent).
  3.  **Quantum Indeterminacy:** "We are assuming a deterministic or probabilistic universe, but not a magical one." (Prevents "But quantum randomness is a Skyhook!" arguments).

  ### Summary of Tactics
  *   **Don't** defend "magic." Defend "intermediate layers."
  *   **Don't** use Conway's Life (too static). Use Evolution (functional steps).
  *   **Do** define Greedy Reductionism as "skipping layers," not "believing in physics."
  *   **Do** force the distinction between "Unexpected" (epistemology) and "Unsupported" (ontology).

  Your friend wins if the debate is about "Is there magic?" You win if the debate is about "What counts as a sufficient explanation?" Keep it on the latter.
