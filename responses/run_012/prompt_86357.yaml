      *   *Mechanism:* Update on $L = \text{"H entails E"}$.
      *   *Benefit:* $P(E)$ stays 1, but $P(H | L)$ can rise because $L$ rules out worlds where $H$ is true but $E$ is false (which were previously open due to logical ignorance).

  3.  **Drafting Section 1: The Case For (Arguing Hard):**
      *   *Introduction:* Acknowledge the problem. State the thesis clearly: The update event is logical, not empirical.
      *   *Point (a) Dissolving the Paradox:* Standard Bayes says $P(H|E) = P(H)$ if $P(E)=1$. But this assumes we already knew the connection. If we treat the agent as non-omniscient, the space of possibilities includes worlds where $H$ is true and $E$ is false (because the agent doesn't know the math yet). Learning the entailment collapses those worlds. No need to pretend I don't know Mercury's perihelion. I know it. I just didn't know GR predicted it.
      *   *Point (b) Smuggling:* Look at Garber's solution. He introduces a new sentence $G$ meaning "H implies E". He says conditionalize on $G$. That *is* the logical learning view, just formalized with extra syntax. Other solutions (counterfactuals) try to simulate what my credence *would* have been. But that's a fiction. The logical learning view describes what *actually* happened in the cognitive process.
      *   *Point (c) Earning its Keep (Ad Hoc vs. Surprise):* Why does Einstein get credit but a curve-fitter doesn't? Because for the curve-fitter, the entailment wasn't "learned" in the same way. It was stipulated. The logical relation was constructed *to fit*, so learning it provides less information about the truth of $H$ and more about the ingenuity of the construction. Or, more precisely, the prior probability of $H$ is penalized for complexity/ad-hocness, so the boost from the entailment is offset. Wait, need to be careful here. The prompt asks to explain why it matters if it was a surprise vs. built-in.
          *   *Refinement:* If I build $H$ to entail $E$, the logical relation is trivial. Learning "H entails E" is low information content because I defined $H$ that way. If $H$ is independent and I *discover* the entailment, that's high information content. The "learning" event has different weight.

  4.  **Drafting Section 2: The Case Against (The Weakness/Regress):**
      *   *The Threat:* The prompt specifically flags the regress. If I'm not logically omniscient about $H \models E$, am I also not omniscient about "Learning $H \models E$ confirms $H$"?
      *   *The Real Issue:* Standard Bayesianism assumes logical omniscience. If you relax it to solve Old Evidence, you break the formalism.
      *   *The "Level Up" Problem:* If I learn $L_1$ ("H entails E"), isn't $L_1$ just another proposition? If I already knew $L_1$, then $P(H|L_1) = P(H)$. So we need to learn $L_2$ ("$L_1$ supports $H$"). This looks like a regress.
      *   *Honest Assessment:* This view requires a non-standard Bayesian framework (Hintikka, Garber, etc.). It admits that agents have limited logical knowledge. But formalizing *how* logical learning updates probabilities is notoriously difficult without making the system computationally intractable or inconsistent.
      *   *The "Dead End":* The view works intuitively but struggles formally. It solves the philosophical puzzle by changing the rules of the game (rejecting logical omniscience), which some Bayesians see as cheating.

  5.  **Refining and Polishing:**
