      *   *Nuance:* It's not just "causal history vs. aboutness." It's deeper. It's about the *criteria for knowledge* in the first-person case. The Objector assumes a causal theory of reference/knowledge (I can only know $X$ if $X$ causes my belief). The Epiphenomenalist assumes a reliabilist or internalist view (I can know $X$ if my belief is reliably connected to $X$, even via a common cause, or if the knowledge is non-causal/acquaintance).
