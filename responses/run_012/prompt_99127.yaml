      *   *The Interactionist/Objector (I):* If $E$ doesn't cause $V$, then $V$ ("I see red") is not caused by $E$. Therefore, $V$ is not *about* $E$. Therefore, we have no reason to believe $E$ exists. The theory undermines its own evidence.
