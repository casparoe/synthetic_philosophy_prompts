answer: |-
  There is no single, canonical label in the literature that captures precisely the *phenomenology* of the exchange you describe. The literature is crowded with terms that diagnose the dispute from the outside (telling the students what they are *really* doing), but scarce on terms that name the shape of the dispute from the inside (describing what the students *take themselves* to be doing).

  Below is a map of the nearest existing concepts, an account of where each falls short, and a proposed label with defined boundaries for the phenomenon itself.

  ### 1. The Map of Nearest Concepts

  To name the thing, we must first clear the space around it. There are three dominant frameworks used to describe this pattern, none of which quite fit the classroom dynamic you observe.

  **A. The "Merely Verbal" Dispute (Chalmers, Hirsch)**
  *   **The Concept:** A dispute where parties agree on all non-linguistic facts but disagree on the meaning or application of a term (e.g., 'object', 'exists'). Once meanings are disambiguated, the dispute should dissolve.
  *   **Where it falls short:** This is a *dissolution* of the dispute, not a name for its persistence. In your seminar, the students do not experience it as verbal. If you tell them, "You just mean different things by 'thing'," the pluralist will reply, "No, I mean the thing that exists independently of my meaning." They treat the term as tracking a mind-independent structure. Calling it "verbal" invalidates their phenomenology.

  **B. "Deep Disagreement" (Fogelin, Lynch)**
  *   **The Concept:** A disagreement where parties lack a common framework of argumentative norms or background principles, making rational resolution impossible.
  *   **Where it falls short:** Deep disagreements usually involve clashing *epistemic* or *moral* frameworks (e.g., faith vs. reason). In your case, the students share the same logic, the same evidence, and the same scientific facts. The disagreement is not about *how to argue* or *what counts as evidence*, but about how the evidence maps onto ontology.

  **C. "Quantifier Variance" (Hirsch) vs. "Ontological Realism" (Sider)**
  *   **The Concept:** This is the meta-ontological debate *about* your seminar. The deflationist says the quantifier ('exists') varies in meaning; the realist says there is one privileged structure of the world.
  *   **Where it falls short:** These are positions *taken* by the disputants (or their coaches), not a name for the *structure of the exchange*. Your students are enacting the conflict between these positions, but the conflict itself needs a name.

  ### 2. A Proposed Label: "Ontological Standoff"

  Since no existing term captures the specific combination of **factual agreement**, **ontological divergence**, and **realist phenomenology**, I propose the descriptive label: **Ontological Standoff**.

  (Alternative: **Sortal Stalemate** or **Factually-Saturated Ontological Disagreement**).

  This label is neutral. It does not presuppose that the dispute is verbal (as "Merely Verbal" does) nor that it is substantive (as "Realist Disagreement" does). It names the *impasse*.

  ### 3. The Boundaries: Conditions for an Ontological Standoff

  For a dispute to qualify as an Ontological Standoff, four conditions must be met. If any fail, the dispute collapses into a different category.

  **Condition 1: Factual Saturation**
  Both parties must agree on all non-ontological facts. This includes spatial location, temporal duration, microphysical composition, and counterfactual resilience (e.g., "If squashed, the clay survives," "If squashed, the statue does not").
  *   *Boundary:* If one party denies a modal fact (e.g., "No, the statue *would* survive squashing"), it is an ordinary **Modal Disagreement**, not a Standoff.

  **Condition 2: Ontological Divergence**
  The disagreement must be specifically about *counting*, *identity*, or *categorization* (e.g., "One object" vs. "Two objects"; "Alive" vs. "Not alive").
  *   *Boundary:* If they agree on the count but disagree on properties (e.g., "Both exist, but one is red"), it is a **Property Disagreement**.

  **Condition 3: Realist Phenomenology**
  Crucially, neither party treats the dispute as a choice of convention. Both believe they are describing the world as it is, not selecting a linguistic framework. Each accuses the other of *missing a fact*, not *choosing a word*.
  *   *Boundary:* If one party says, "Let's just use 'two things' for convenience," it becomes a **Pragmatic Stipulation**. The Standoff requires the conviction that there is a correct answer to be found.

  **Condition 4: Resolution Resistance**
  No further empirical investigation or logical deduction can settle the matter. The disagreement persists even after all descriptive work is done.
  *   *Boundary:* If a new microscope could settle it (e.g., "Is there a cell wall?"), it is an **Empirical Dispute**. The Standoff exists only where the evidence is exhausted.

  ### 4. Distinctions from Related Disputes

  You asked how this differs from disputes that are merely verbal or about vocabulary adoption.

  *   **Vs. Merely Verbal:** In a merely verbal dispute, once the ambiguity is pointed out ("Ah, you mean 'bank' as in river, I mean 'bank' as in finance"), the tension evaporates. In an Ontological Standoff, pointing out the ambiguity ("You mean 'object' as 'continuous matter', I mean 'object' as 'functional unity'") does *not* evaporate the tension. The pluralist insists that the functional unity *creates* a new object. The tension remains because the dispute is about whether the conceptual distinction *maps onto an ontological distinction*.
  *   **Vs. Vocabulary Adoption (Pragmatic):** In a pragmatic dispute, the question is "Which word is more useful?" (e.g., "Should we classify Pluto as a planet for the sake of textbooks?"). In an Ontological Standoff, the question is "Which word is *true*?" (e.g., "Is Pluto *really* a planet?"). The Standoff is characterized by the refusal to reduce truth to utility.

  ### 5. Can it be One-Sided?

  You asked: *Can it be one-sided — one party simply confused about the facts, the other not — without collapsing back into an ordinary disagreement?*

  **No.** This is a critical boundary.
  If one party is confused about the facts (e.g., the monist believes the clay ceases to exist when shaped), the dispute is an **Ordinary Factual Disagreement**. You can resolve it by showing them the clay.
  The Ontological Standoff *requires* that both parties have a correct grasp of the non-ontological facts. If one is factually confused, the standoff collapses. The persistence of the disagreement *despite* factual clarity is what defines the Standoff. If it persists *because* of factual ignorance, it is merely ignorance.

  ### 6. Extension to Natural Kinds (Viruses and Species)

  You asked what becomes of the pattern when the subject matter is not artefacts but natural kinds (e.g., "Is a virus alive?", "Does this species name pick out a real kind?").

  The pattern holds, but the stakes shift slightly. This is a **Natural Kind Standoff**.

  *   **Similarities:** It meets all four conditions. Biologists agree on the viral properties (replication, metabolism, structure). They disagree on the categorization ("Alive"). They treat it as a fact of the matter (Realist Phenomenology). No microscope can settle it (Resolution Resistance).
  *   **Differences:** In the Statue/Lump case, the objects are arguably mind-dependent (artefacts). In the Virus case, the objects are mind-independent.
  *   **Implication:** This suggests the Ontological Standoff is not just about *constitution*, but about **Sortal Application**. It arises whenever our conceptual categories (statue, alive, species) are applied to a world that does not come pre-sliced into those categories.
  *   **Pedagogical Note:** In the artefact case, students often lean toward Conventionalism ("We made the statue, we decide"). In the virus case, they lean toward Realism ("Nature decides"). Yet the *structure* of the argument remains identical: Agreement on properties, disagreement on status. This confirms that the Standoff is a structural feature of human categorization, not just a puzzle about clay.

  ### Summary for Teaching

  If you need a label for your syllabus or lecture notes, **"Ontological Standoff"** is precise and neutral.

  You can define it for your students as:
  > *A disagreement where parties agree on all descriptive and modal facts, yet disagree on ontological counting or categorization, where both parties treat the disagreement as substantive rather than terminological.*

  This allows you to validate their experience (it *feels* substantive) without committing to a meta-ontological solution (it *might* be verbal, or indeterminate, or deep). It names the *shape* of the problem, which is exactly what you asked for. It distinguishes the *impasse* from the *solutions* (monism, pluralism, deflationism) that attempt to break it.
