      *   **EDT (Evidential Decision Theory):** Focuses on conditional probabilities. $P(Death|Stay)$. Since Death is perfect, $P(Death|Stay) = 1$. $P(Death|Run) = 1$. EU is equal. EDT also says "Indifferent." But EDT faces the same "Why am I choosing this?" problem. If I choose Stay, I infer Death is there. But EDT doesn't have a mechanism to say "My choice *makes* Death be there." It just correlates.
