answer: |-
  The rain in Harrow's Reach did not fall so much as it hovered, a permanent grey suspension that dampened the wool of the promenade and seeped into the limestone of the municipal buildings. Inside the Borough Gaming Board, the dampness manifested as a softening of the paper. Files swelled in their drawers; ink bled slightly at the edges of signatures.

  Elara Vance sat at her desk on the second floor, watching a drop of condensation trace a path down the windowpane. She was a junior actuary, which in the parlance of the Board meant she was the person who did the sums nobody else wanted to check. On her desk lay a file thick enough to stop a bullet, labelled *Application 449-B: The Alternating Toss*.

  It was a simple game, theoretically. A fair coin, tossed until it showed heads. If heads appeared on the first toss, the player won two pounds. If on the second, they lost two pounds. If on the third, they won eight pounds divided by three. If on the fourth, they lost four pounds. The payouts grew, alternating sign, scaling with the improbability of the toss.

  Elara opened the file to the first page. The applicant, a Mr. Sterling of the newly refurbished *Neon Pier* casino, had submitted the expected value calculated in the natural order of time.
  $1 - 1/2 + 1/3 - 1/4 + 1/5 \dots$
  It summed to the natural logarithm of two. Sixty-nine pence. A modest profit for the player, well within the Board's guidelines for a licensed amusement. Sterling wanted the number 0.69 painted on the glass of his door.

  Beneath Sterling's application lay the objection. Ms. Gable, of the Harrow's Reach Consumer Protection Society, had submitted a counter-calculation. She had taken the same terms, the same probabilities, the same coin, and rearranged them. By grouping two winning terms for every losing term, she had coaxed the series to sum to over four pounds. By reversing the ratio, she had driven it to negative infinity. She demanded the licence be refused on the grounds that the game was financially incoherent.

  The rulebook was clear: every game must display a single figure of mathematical expectation. It must be positive for the player. It must be defined. A game with no figure could not be licensed. A game with too many figures was not mentioned, because the drafters of the rulebook, dead men in Victorian frock coats, had not anticipated that arithmetic could be so pliable.

  Elara rubbed her temples. The hearing was at two o'clock. She needed to write the recommendation by five.

  ***

  The hearing room smelled of lemon polish and wet raincoats. Three Board members sat at the high table, looking down at Elara, who sat at the clerk's desk. To her left sat Mr. Sterling, a man in a suit that cost more than Elara's annual salary, smiling with the confidence of a man who believes numbers are solid objects. To her right sat Ms. Gable, wearing a practical macintosh and clutching a sheaf of papers like a weapon.

  "The expectation is clear," Sterling said, his voice bouncing off the wood panelling. "The coin is tossed in time. Toss one, toss two, toss three. The sum follows the chronology of the event. Logarithm of two. Sixty-nine pence. It is a generous game, but a safe one."

  "Chronology is irrelevant to convergence," Ms. Gable snapped. She pulled a notepad from her bag and slapped it on the table. "The expectation is an average over the long run. But the long run depends on how you count. If I play this game a thousand times, and I group my wins and losses differently, my solvency changes."

  "You cannot group losses that haven't happened yet," Sterling said.

  "I am speaking of the mathematical valuation required by the Board," Gable retorted. She turned to Elara. "May I demonstrate?"

  Elara nodded, though she felt a sinking sensation in her stomach. She knew what was coming.

  Gable uncapped a fountain pen. She drew a line down the centre of a fresh page. On the left, she wrote the natural series.
  $1.00$
  $-0.50$
  $+0.33$
  $-0.25$
  $+0.20$
  She underlined the running total. $0.69$.

  "Now," Gable said, dipping her pen again. "The Riemann rearrangement theorem tells us that a conditionally convergent series can be made to sum to anything. Let us be conservative. Let us make it sum to zero. Or less."

  She turned to a fresh column. She began to write, her handwriting sharp and jagged.
  "Take one positive term," she muttered, writing $1$. "Total: $1$."
  "Take two negative terms." She wrote $-0.5$, then $-0.25$. "Total: $0.25$."
  "Take one positive." $+0.33$. "Total: $0.58$."
  "Take two negative." $-0.20$, $-0.16$. "Total: $0.22$."

  She looked up. "Do you see? I am using the exact same outcomes. The exact same coin. But by delaying the recognition of the wins, by grouping the losses, the running expectation drifts downward. If I take three negatives for every positive, it goes negative. If I take ten, it plummets. The 'value' of the game depends entirely on the order in which the accountant chooses to write the ledger."

  Sterling leaned forward. "But the accountant isn't writing the ledger. The coin is. The coin does not wait for the accountant to group the losses. It lands, or it does not."

  "The expectation is a property of the distribution, not the history," Gable said. "If the distribution allows for infinite loss, the licence should be denied."

  "It does not allow for infinite loss," Sterling said. "The probability of a long run of tails decays exponentially. You will almost certainly stop within twenty tosses."

  "Almost certainly is not certainly," Gable said. "And the payout on the twentieth toss is enormous. If the sum is unstable, the price is undefined. You cannot sell a ticket with no price."

  The Chairman of the Board, an elderly man named Mr. Henderson who had spent forty years regulating bingo halls, looked at Elara. "Miss Vance. Is the sum defined?"

  Elara hesitated. "Mathematically, sir, the series converges conditionally. It has a sum in the natural order. But it is not absolutely convergent."

  "Which means?"

  "Which means the sum depends on the order of terms."

  Henderson frowned. "But the terms come in an order. The tosses happen in time."

  "That is the argument, sir," Elara said.

  "Then let us hear it," Henderson said. He gestured to the corner of the room where Arthur Penhaligon sat. Arthur was a senior actuary, a man who had been with the Board since before Elara was born. He had been silent until now, cleaning his spectacles with a handkerchief. He was the pragmatist, the man who usually signed off on the roulette wheels and the slot machines.

  Arthur stood up slowly. He walked to the table and looked at Gable's notepad. He looked at the jagged columns of numbers.

  "This is clever," Arthur said, his voice dry. "It is very clever. But it is a trick."

  Gable bristled. "It is standard analysis, Mr. Penhaligon."

  "It is mathematics without physics," Arthur said. He picked up a pen. He did not write on Gable's paper. He took a fresh sheet. "You are treating the expectation as a pile of coins on a table that you can move around with your hands. But this game is not a pile. It is a process."

  He began to write. He wrote the numbers in a single vertical line, strictly sequential.
  $1$
  $-1/2$
  $1/3$
  $-1/4$
  "The coin does not know it is part of a series," Arthur said, looking at Gable. "It does not know you intend to group it with a loss from three turns later. When the player tosses the coin, they are at $k=1$. They do not have access to $k=4$. To value the game by rearranging the terms is to value it with knowledge the player cannot possess."

  "The expectation is an average over infinite plays," Gable insisted. "In the infinite limit, order is malleable."

  "In the infinite limit, we are all dead," Arthur said. The room went quiet. He tapped the paper. "We are licensing a game for people in Harrow's Reach. They have wages. They have rent. They play the game in time. Toss. Result. Toss. Result. If you value this game by a rearrangement that requires you to wait for the tenth loss before counting the fifth win, you are valuing a different game. You are valuing a game where the casino holds the money in escrow until the ledger balances to your liking."

  He turned to the Board. "The rulebook asks for the expectation per play. A play happens in time. The only honest sum is the limit of the partial sums as the tosses occur. Anything else is fiction. It is arithmetic honesty, yes, but it is financial lying."

  Gable opened her mouth, but Arthur held up a hand. "I am not saying the risk is zero. I am saying the value is sixty-nine pence. Because that is what the coin gives you. If you rearrange the terms, you are no longer pricing the coin toss. You are pricing your own anxiety."

  He sat down. He did not look triumphant. He looked tired. But the weight of his argument settled on the table, heavier than Gable's notepad. It appealed to the ordinary. It appealed to the fact that the rain outside was falling in drops, not in rearranged clusters.

  Sterling nodded slowly. "The process is the product."

  "The risk is the risk," Gable said, but her voice had lost its edge. She looked at her columns of numbers. They looked like abstractions now, ghosts of sums that never happened.

  Henderson looked at Elara. "Miss Vance. Write the recommendation."

  ***

  Elara did not go home that evening. The office was silent, the cleaners having come and gone. The only light came from the green lamp on her desk and the glow of the streetlamps filtering through the rain-streaked window.

  She had the recommendation form in front of her. Box 12: *Expected Net Gain Per Play*.

  She had a pen in her hand.

  Arthur's argument was sensible. It was the argument of the real world. Time flows one way. Coins land one by one. To sum them otherwise was to lie about how the world works. But Gable's numbers were also true. The mathematics did not forbid the rearrangement. The series *was* conditionally convergent. If a player came in and played this game a million times, and the casino was allowed to settle the debts in any order they chose, the player could be ruined. The instability was real, even if the chronology was fixed.

  She thought of the people who would walk past the *Neon Pier* tomorrow. Fishermen coming in from the trawlers. Tourists in anoraks looking for shelter from the drizzle. They would see the number in the window. They would trust it. They would hand over their wages based on that figure.

  If she wrote 0.69, she was siding with Arthur. She was saying time matters more than algebra.
  If she wrote 'Undefined', she was siding with Gable. She was saying the game was broken. But the rulebook forbade 'Undefined'. A game with no figure could not be licensed. If she left it blank, the *Neon Pier* would sue, and the Board would be tied up in court for years.
  If she wrote a negative number, she was banning the game. But on what grounds? That the sum *could* be negative? It could also be positive ten.

  Elara dipped her pen. The ink was black, permanent.

  She thought about the coin. A disc of metal. Spinning in the air. Heads or tails. It didn't care about the logarithm of two. It didn't care about the Riemann series theorem. It just fell.

  But the number had to be written. The rulebook demanded a figure. The bureaucracy required a truth, even if the truth was a slice of a deeper ambiguity.

  She looked at the blank box. She imagined painting it on the glass of the casino door. White paint. Stencilled. Visible from the promenade.

  *Expected Gain: £0.69*

  It looked honest. It looked like the truth Arthur had spoken. But as she held the pen over the paper, she felt the ghost of the other sums pressing against the nib. The sum that went to infinity. The sum that went to minus a thousand pounds. They were all there, in the ink, potentialities waiting to be actualised by the order of the counting.

  She realised then that the Board did not license games. They licensed fictions. They licensed the story that the world was stable enough to be summed.

  Elara wrote the number. She did not write it with confidence. She wrote it with the resignation of a clerk who knows that the signature matters more than the sum. She wrote 0.69.

  She signed her name at the bottom. *E. Vance. Junior Actuary.*

  She blotted the paper and placed it in the out-tray.

  ***

  The next morning the rain had stopped, leaving the town scrubbed and gleaming. Elara walked down to the harbour to post the licence notice on the Board's external board before the morning shift arrived.

  The promenade was busy. A queue was already forming at the bakery, the smell of baking bread cutting through the salt air. Children in school uniforms kicked at the wet pavement.

  Elara pinned the notice to the corkboard. It was a small white card among dozens. *Licence Granted: Application 449-B.*

  She walked past the *Neon Pier*. The painters were there, standing on ladders, applying the white stencil to the front window. They were laughing, joking about the football scores. One of them dipped his brush into the pot.

  Elara stopped. She watched the brush touch the glass.
  *£ 0 . 6 9*

  The numbers were large, legible, final.

  A man in a grey coat stopped beside her. He was smoking a cigarette, shielding the flame from the breeze. He looked at the window, then at Elara.

  "New game?" he asked.

  "Yes," Elara said.

  "Good odds?"

  Elara looked at the number. She thought of Gable's jagged columns. She thought of Arthur's single vertical line. She thought of the coin spinning in the grey air, landing, spinning again, never stopping until it did.

  "It's defined," Elara said.

  The man nodded, as if that explained everything. He flicked his cigarette into the gutter and walked towards the door of the casino. He reached into his pocket for his wallet. Behind him, two more people joined the queue, looking up at the white figures in the window, reading them as a promise, reading them as a fact.

  Elara turned away. She walked back towards the municipal buildings, her shoes clicking on the wet stone. The notice on the Board's corkboard fluttered slightly in the sea breeze, the corner lifting, revealing the grey wall beneath. She reached out and pressed it flat again, smoothing the paper with her palm, holding it in place against the wind.
