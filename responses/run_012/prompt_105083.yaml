answer: |-
  # Seminar Handout: The Futarchy Decision Tree

  **Root Premise:** *Prediction markets aggregate dispersed information more accurately than committees, polls, or individual experts.*

  ### Node 1: Authority
  **Question:** When the market's implied probability diverges from the legislature's stated intent, whose preference executes?
  *   **A.** The legislature retains veto power; the market is consulted but not obeyed. → *Go to Node 2 (Advisory)*
  *   **B.** The market price automatically triggers policy; the legislature sets goals but not means. → *Go to Node 3 (Binding)*

  ---

  ### Node 2: Advisory Path (From 1A)
  **Question:** How are market insights formally integrated into the legislative record?
  *   **A.** Markets run on hypothetical policies, but payouts are voided if the policy isn't adopted. → **Leaf: Technocratic Decision Support**
  *   **B.** Markets run on hypothetical policies, and payouts are settled via external estimation (models/experts) even if policy is rejected. → **Leaf: Shadow Futarchy**

  ---

  ### Node 3: Binding Path (From 1B)
  **Question:** Since only one policy can be implemented, how do we settle bets on the *rejected* counterfactuals?
  *   **A.** **Conditional Markets:** Bets resolve based on the outcome *if* the policy had passed (resolved via oracle/models). → *Go to Node 4*
  *   **B.** **Randomized Trials:** Rejected policies are implemented on a small/random subset of the population purely to settle bets. → **Leaf: Experimentalist Futarchy**

  ---

  ### Node 4: Metric Governance (From 3A)
  **Question:** Who specifies the numerical metric (e.g., GDP, Happiness Index) that determines bet payouts?
  *   **A.** **Constitutional Metric:** The metric is fixed in law/constitution and cannot be changed by current traders or legislators. → *Go to Node 5*
  *   **B.** **Legislative Metric:** The metric itself is subject to voting or market adjustment over time. → **Leaf: Pluralist Futarchy**

  ---

  ### Node 5: Capital & Manipulation (From 4A)
  **Question:** How is trading capital initially distributed among participants?
  *   **A.** **Permissionless:** Capital concentration is allowed; liquidity subsidies are used to reward correct predictions regardless of wealth. → **Leaf: Hansonian Futarchy**
  *   **B.** **Universal Stake:** Every citizen receives an equal, non-transferable trading endowment to prevent wealth-based policy capture. → **Leaf: Egalitarian Futarchy**

  ***

  ## Leaf Definitions & Commitments

  **Technocratic Decision Support**
  *   **Ugliest Commitment:** Must swallow that politicians will cherry-pick market data only when it validates decisions they already made.
  *   **Status:** *Common (Current Practice)*

  **Shadow Futarchy**
  *   **Ugliest Commitment:** Must swallow paying out massive sums on counterfactuals determined by the very experts the market was meant to bypass.
  *   **Status:** *Unstable*

  **Experimentalist Futarchy**
  *   **Ugliest Commitment:** Must swallow intentionally implementing policies known to be inferior on a subset of citizens purely to gather data.
  *   **Status:** *Ethically Contested*

  **Pluralist Futarchy**
  *   **Ugliest Commitment:** Must swallow that the debate shifts from "what works" to "how we measure," inviting extreme Goodharting of the metric itself.
  *   **Status:** *Unnamed*

  **Hansonian Futarchy**
  *   **Ugliest Commitment:** Must swallow that a wealthy attacker might profitably nudge the market to trigger a policy that harms the nation but pays out on their specific bet structure.
  *   **Status:** *Standard Model*

  **Egalitarian Futarchy**
  *   **Ugliest Commitment:** Must swallow that preventing capital concentration reduces market liquidity and thus destroys the informational advantage you came for.
  *   **Status:** *Unnamed*

  ***

  ## Structural Notes for Discussion

  **Indistinguishable Leaves:**
  *   **Shadow Futarchy** and **Experimentalist Futarchy** are functionally difficult to separate. Both require an external mechanism to resolve the value of a timeline that did not happen; one uses models, the other uses small-scale reality. In practice, the "model" in Shadow Futarchy often becomes the "experiment" in Experimentalist Futarchy.

  **Least Confident Branch:**
  *   **Node 5 (Capital & Manipulation).** I am least confident in the distinction between **Hansonian** and **Egalitarian** Futarchy here. Robin Hanson argues that liquidity subsidies (paying traders from a budget for accuracy) neutralize the advantage of wealth, making Permissionless capital functionally similar to a Universal Stake in terms of influence.
  *   **What would change my mind:** Empirical evidence from large-scale prediction markets showing that subsidy mechanisms fail to prevent "predatory trading" (where a wealthy actor loses money on the bet but gains more from the resulting policy change). If subsidies cannot decouple *trading influence* from *policy impact*, the Permissionless branch collapses into a plutocracy, requiring a hard split from the Egalitarian position.
