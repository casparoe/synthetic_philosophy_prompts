  I'm putting together a handout for a grad seminar on futarchy and I want a decision tree rather then a reading list. Start from something almost everyone in the room will already grant -- that prediction markets are at least decent at forecasting some things -- and branch down to the actual positions, with each node phrased as a question a student can answer without already knowing which camp it drops them into. I want the real fault lines, not the slogans: whether the market's verdict is binding or merely advisory, whether the bets are on a policy conditional on it actually being adopted (and what you do about a counterfactual outcome nobody ever gets to observe), who writes the objective metric and what's supposed to stop the metric-writer from being the whole game, whether every citizen trades or there's a subsidized trader class, and the manipulation worry where someone with enough capital nudges the market just enough to trigger the policy they wanted. Leaves should be named positions, or "unnamed" if nobody defends the spot, each with one sentence on the ugliest commitment it has to swallow, and please flag any two leaves your tree can't really seperate. Also tell me which branch you're least confident about and what would change your mind about where a position sits on it.
