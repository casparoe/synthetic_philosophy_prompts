answer: |-
  Here is the menu. You can print this out or read it off your phone next time he brings it up. The goal here is to force him to pick *one* of these lanes, because they don't all lead to the same place.

  ### 1. The Literal Claim ("Coins don't have babies")
  *   **The Argument:** Biological organisms reproduce; metal or digital tokens do not. Therefore, expecting a coin to return with more coins is a category error, like expecting a ruler to grow longer.
  *   **Is it defensible?** Literally, yes. Economically, no. Money represents claim rights on labor and resources, which *are* productive. If I lend you money to buy a cow, the cow has a calf. The interest is a share of that calf.
  *   **Scope:** Applies to all interest.
  *   **Does it prove theft?** **No.** It proves a metaphor is being stretched. It stalls out at "interest is unnatural," but "unnatural" (like wearing clothes or flying in planes) doesn't equal "theft."
  *   **When he uses it:** This is his **opening hook**. It's the soundbite. He uses it to make the opposing view sound absurd, but he knows he can't win the whole argument on biology alone.

  ### 2. The "Money as a Ruler" Claim ("Consumption vs. Capital")
  *   **The Argument:** Money is fundamentally a medium of exchange (a measuring stick), not a productive asset. Charging for the *use* of money is like charging a fee for someone to look at your ruler. You aren't using up the ruler, so you shouldn't get paid for its temporary possession.
  *   **Is it defensible?** Only for **consumption loans** (e.g., lending money for food/rent). It fails for **capital loans** (e.g., lending money to build a factory). In capital loans, the money *is* consumed/transformed into value.
  *   **Scope:** Applies only to loans where the money is spent on non-productive things.
  *   **Does it prove theft?** **Maybe.** If the money wasn't used to create new wealth, the interest comes from the borrower's existing stash. This looks more like extraction, but still not necessarily "theft" if agreed upon.
  *   **When he uses it:** This is his **intellectual shield**. When you point out that businesses use loans to grow, he switches to this to say, "Sure, but that's not what money *is* fundamentally."

  ### 3. The "Selling Time" Claim ("Time belongs to God")
  *   **The Argument:** Interest is essentially the price of time (paying extra for the privilege of waiting). Time is a common good that belongs to everyone (or God). No individual can own time, so no individual can sell it. Charging for it is selling what isn't yours.
  *   **Is it defensible?** Philosophically, yes. It's a coherent moral stance. Economically, it ignores that *access* to liquidity now is more valuable than access later (time preference).
  *   **Scope:** Applies to all interest.
  *   **Does it prove theft?** **Close.** It frames interest as fraud (selling something you don't own). However, it defines theft as "stealing from the commons/God," not necessarily stealing from the borrower.
  *   **When he uses it:** This is his **moral core**. If you corner him on the economics, this is where he retreats. It's the hardest to refute because it's a theological/philosophical axiom, not an economic one.

  ### 4. The "Riskless Gain" Claim ("Heads I win, tails you lose")
  *   **The Argument:** In an interest-bearing loan, the lender gets paid regardless of whether the borrower succeeds or fails. The lender takes no risk, while the borrower takes all the risk. Gaining wealth without risk or labor is parasitic.
  *   **Is it defensible?** Very defensible regarding **debt vs. equity**. Equity investors share risk; debt holders do not. However, lenders *do* take default risk and inflation risk, so "riskless" is an exaggeration.
  *   **Scope:** Applies to all debt, but highlights the difference between lending and investing.
  *   **Does it prove theft?** **No.** It proves **unfairness** or **exploitation**, but not theft. A contract was signed. To call it theft, you have to prove the contract was coercive (see Claim 5).
  *   **When he uses it:** This is his **pivot**. He uses this when you talk about banks or investors. It allows him to say, "I'm not against profit, I'm against *guaranteed* profit."

  ### 5. The "Desperation" Claim ("Ransom on Necessity")
  *   **The Argument:** People generally borrow money because they are in trouble or lack something they need. Charging interest on a desperate person is like charging a drowning man for a rope. It is profit derived from coercion, not free exchange.
  *   **Is it defensible?** Highly defensible for **predatory lending** (payday loans, crisis borrowing). Less defensible for **leverage** (a rich developer borrowing to build a condo).
  *   **Scope:** Applies only to distress borrowing.
  *   **Does it prove theft?** **Yes.** If the transaction is coercive (no real choice), it is morally equivalent to theft.
  *   **When he uses it:** This is his **winning move**. This is the argument that actually lands the "interest is theft" conclusion. He usually smuggles this in while pretending to argue Claim 1 or 2.

  ***

  ### How to use this on him
  Your friend is likely arguing **Claim 5** (Desperation) while pretending to stand on **Claim 1** (Literal Sterility).

  *   **Claim 1** makes him sound wise/philosophical.
  *   **Claim 5** is what makes him feel morally righteous.

  **The Trap:** If you attack Claim 1 (by showing money *can* be productive), he will act like you missed the point and switch to Claim 5 (but think of the poor!). If you attack Claim 5 (by showing businesses choose to borrow), he will switch back to Claim 1 (but money still doesn't breed!).

  **The Counter:** Ask him to pick one.
  > "Are you saying interest is theft because money can't reproduce (Claim 1), or because it exploits desperate people (Claim 5)? Because if it's the first one, it's just biology. If it's the second one, then interest on a business loan isn't theft, and you need a different argument for that."
