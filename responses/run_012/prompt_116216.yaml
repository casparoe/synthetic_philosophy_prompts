answer: |-
  ### Visible Brainstorming: Candidate Questions & Cuts

  Before ranking, I need to lay out the field of play. I'm generating candidate questions based on the gaps you identified and the standard literature, then pruning.

  **Candidate List:**
  1.  **The Unit of Independence:** Is the voter the unit, or the evidence stream? (Your point b).
  2.  **Endogenous Competence:** How does deliberation change $p$ (competence)? (Your point d).
  3.  **Bias vs. Dependence:** Is correlation the problem, or is shared prior bias the real killer? (Your point a).
  4.  **Belief vs. Decision:** Aggregating truth-claims vs. aggregating utility-weighted actions. (Your point c).
  5.  **The Regress of Deference:** How do I weight your vote if I don't know your competence, but knowing it requires competence? (Your point e).
  6.  **The "Truth" Condition:** What if there is no objective truth (e.g., value judgments)?
  7.  **Strategic Voting:** How does game-theoretic manipulation interact with epistemic goals?
  8.  **Dynamic Group Size:** When should a group stop growing and decide?

  **Cuts:**
  *   **Cut #6 (The "Truth" Condition):** This is metaphysical quicksand. If there's no truth, CJT doesn't apply, full stop. That's a boundary condition, not a research puzzle for *this* team. We assume there is a fact of the matter (e.g., "Will this policy reduce crime?").
  *   **Cut #7 (Strategic Voting):** You said assume we know the standard worries. Strategic voting is well-trodden in mechanism design. It's important, but it's a "known known."
  *   **Cut #8 (Dynamic Group Size):** This is an optimization problem, not a foundational one. It depends on the answers to the questions above.

  **Ordering Logic:**
  I am ordering these by **ontological priority**. We cannot model how competence changes (Q2) until we know what counts as an independent data point (Q1). We cannot decide if bias matters more than dependence (Q3) until we know if we are tracking truth or maximizing utility (Q4). The Regress (Q5) is a meta-problem that dissolves if we solve Q1 and Q2.

  **The Ranked Order:**
  1.  **The Unit of Independence** (Foundational: defines $N$).
  2.  **Endogenous Competence** (Dynamic: defines $p$).
  3.  **Bias vs. Dependence** (Structural: defines the error term).
  4.  **Belief vs. Decision** (Teleological: defines the goal).
  5.  **The Regress of Deference** (Meta-epistemic).

  ---

  ### The Ranked Research Agenda

  Here is the breakdown of the top four questions. I have excluded the Regress (Q5) from the detailed breakdown because it is downstream of the first two; if we solve the unit of independence and the dynamics of competence, the regress becomes a calculation problem rather than a conceptual one.

  #### 1. The Unit of Independence (Evidence vs. Voter)
  *The Question:* Does $N$ count heads, or does it count independent causal pathways to the truth? If twenty voters read the same biased memo, is $N=20$ or $N=1$?
  *   **Why Upstream:** This is the definition of the variables. If we get this wrong, every subsequent calculation of "group competence" is garbage. It determines whether we model the *social network* or the *individual*.
  *   **Tractability:** High for philosophers (conceptual analysis of "evidence tokens"), Medium for modelers (defining causal graphs). Hard for empiricists (tracing information flow is messy).
  *   **Neglect:** High. Most formal work assumes exogenous independence. Empirical work often ignores information cascades.
  *   **12-Month Milestone:** A formal definition of "Effective Sample Size" ($N_{eff}$) that adjusts raw $N$ based on shared information sources. A simulation showing how $N_{eff}$ collapses in small-world networks.
  *   **24-Month Milestone:** An empirical protocol for measuring $N_{eff}$ in real deliberative bodies (e.g., coding transcript overlaps).

  #### 2. Endogenous Competence (The Dynamics of $p$)
  *The Question:* CJT assumes fixed $p > 0.5$. But deliberation, campaigning, and fatigue change $p$. Does talk make us smarter (pooling information) or dumber (polarization/social pressure)?
  *   **Why Upstream:** If $p$ is a function of time and interaction $p(t, interaction)$, the limit theorem changes. We might need a "Dynamic Jury Theorem."
  *   **Tractability:** Medium. Philosophers can normatively define "good deliberation." Modelers can simulate $p$ as a variable. Empiricists can measure pre/post deliberation accuracy.
  *   **Neglect:** Medium. There is work on deliberation, but little integrating it formally into the CJT limit conditions.
  *   **12-Month Milestone:** A model where $p$ updates based on Bayesian exchange vs. social conformity. Identify the tipping point where talk lowers group accuracy.
  *   **24-Month Milestone:** Experimental data from small groups showing whether deliberation increases or decreases average $p$ on factual questions.

  #### 3. Bias vs. Dependence (Systematic Error vs. Correlated Noise)
  *The Question:* You asked if systematic shared bias is worse than dependence. Mathematically, correlated *noise* can wash out; correlated *signal* (bias) does not. Is the real enemy correlation, or is it shared priors?
  *   **Why Upstream:** This determines the remedy. If it's dependence, we need diverse networks. If it's bias, we need ideological heterogeneity.
  *   **Tractability:** High for modelers (easy to separate in code). Low for philosophers (defining "bias" vs. "reasonable prior" is hard).
  *   **Neglect:** Low in stats, High in philosophy. Statisticians know bias breaks consistency. Philosophers often conflate bias with dependence.
  *   **12-Month Milestone:** A formal proof separating the asymptotic impact of correlated errors vs. shared bias on the convergence rate.
  *   **24-Month Milestone:** A heuristic for diagnosing which one is plaguing a specific real-world group (e.g., a jury vs. a scientific panel).

  #### 4. Belief vs. Decision (Truth-Tracking vs. Welfare)
  *The Question:* CJT tracks truth. But groups often decide *actions*. If the majority believes a claim is true (51%), but the cost of being wrong is asymmetric, majority voting on the *claim* might lead to the wrong *decision*.
  *   **Why Upstream:** This challenges the goal. If the goal is utility, not truth, CJT is the wrong tool.
  *   **Tractability:** Medium. Requires integrating utility functions into the aggregation rule.
  *   **Neglect:** High. This gap between epistemic democracy and decision theory is under-explored.
  *   **12-Month Milestone:** A "Decision-Theoretic Jury Theorem" showing where majority rule on propositions diverges from expected utility maximization.
  *   **24-Month Milestone:** Case studies (e.g., medical panels) where truth-tracking voting led to suboptimal policy outcomes.

  ---

  ### The "Cargo-Culting" Verdict

  You asked if we should push this framework toward designing real-world mechanisms (assemblies, markets, peer review) or if the idealizations make that dishonest.

  **Verdict:** Importing the raw theorem is cargo-culting. Importing the *logic* is essential.

  The theorem assumes $p > 0.5$ and independence. In the real world, $p$ is unknown and dependence is high. If you design a citizens' assembly assuming CJT guarantees truth, you will fail. The idealizations do too much work.

  **The Honest Version:**
  The project should not be "How do we apply CJT?" It should be "**Under what conditions does CJT break, and what do we use then?**"
  We should treat CJT as a *null hypothesis*. It is the baseline for "naive aggregation." The value of the research is in quantifying the deviation from the baseline. For example, in model ensembling (your interest), we shouldn't assume independence. We should measure the *effective* diversity. The honest project is a **diagnostic toolkit**, not a design blueprint. It tells practitioners: "Measure your $N_{eff}$. If it's too low, don't vote; deliberate or weight."

  ---

  ### Funding Decision & Team Allocation

  We have three researcher-years (2 Philosophers, 1 Modeler/Data). We need to maximize impact.

  **The Two Funded Questions:**
  1.  **The Unit of Independence (Q1).**
  2.  **Endogenous Competence (Q2).**

  **Why these two?**
  Q1 is the foundation. If we don't solve what counts as a vote, nothing else matters. Q2 is the biggest empirical threat to the theorem's validity. Together, they move the field from "static abstraction" to "dynamic reality." Q3 (Bias) is important but largely settled in statistics; philosophers add less value there. Q4 (Decision) is crucial but might be a separate project on decision theory; let's stick to epistemic aggregation first.

  **Allocation:**
  *   **Philosopher 1 (Lead on Q1):** Focus on the metaphysics of evidence. What constitutes an "independent causal pathway"? Draft the normative framework for $N_{eff}$.
  *   **Philosopher 2 (Lead on Q2):** Focus on the normative dynamics of deliberation. When does talk help $p$? Draft the "Dynamic Jury" conditions.
  *   **The Modeler/Data Person (The "Third Person" Task):**
      *   **Instruction:** Do *not* simply simulate the philosophers' concepts. Your job is to **stress-test the applicability.**
      *   **Task:** Build a simulation suite that compares CJT-based aggregation against **Prediction Markets** and **Proper Scoring Rules** under conditions of high dependence and variable $p$.
      *   **Reasoning:** This addresses the "cargo-cult" worry directly. If CJT breaks under the conditions Q1 and Q2 identify, the Modeler needs to show *what works instead*. They are the control group. They will operationalize the "Effective Sample Size" (from Phil 1) and "Dynamic Competence" (from Phil 2) to see if CJT still outperforms market mechanisms or weighted expert averaging when the assumptions are violated.

  **Summary of the Pitch:**
  We are not defending Condorcet. We are autopsy-ing it to find out which organs can be transplanted into real-world design. Phil 1 defines the organs (Independence). Phil 2 defines the vitality (Competence). The Modeler tests if the patient survives the surgery compared to other treatments (Markets/Scoring).

  If, in two years, the Modeler shows that CJT-based voting loses to prediction markets whenever $N_{eff} < N/2$, that is a successful result. It saves the field from applying a broken tool. That is worth the three years.
