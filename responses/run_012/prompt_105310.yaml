answer: |-
  **Q&A PREP SHEET: Sidgwick, Dualism, and the SPR**

  **Strategy Overview:** You are walking a tightrope. The Analytic group wants to know if the argument is *valid*; the Historians want to know if the narrative is *accurate*. Your defense must be that you are making a claim about *systematic coherence*, not empirical truth. You are not arguing ghosts are real; you are arguing Sidgwick *needed* them to be real for his ethics to rest.

  ---

  ### PART 1: THE OBJECTIONS (In likely order)

  #### 1. The "Genetic Fallacy" Objection (Analytic Faction)
  **Phrasing:** "Even if Sidgwick *felt* he needed psychical research to sustain his moral motivation, does that mean the *validity* of the ethical system depends on it? Aren't you conflating the context of discovery with the context of justification? *Methods* stands or falls on its arguments, not on whether he believed in telepathy."
  *   **Damage:** Medium. It threatens to sever the link you're trying to forge.
  *   **2-Minute Reply:** Distinguish between the *logical derivation* of duty (which is rational) and the *rationality of pursuing* duty (which requires the convergence of self-interest). Sidgwick explicitly states that without convergence, the pursuit of duty is irrational. He cannot derive convergence from reason (Dualism). Therefore, he must look elsewhere for the premise that makes duty rational. The psychical research isn't just a hobby; it's the only available mechanism to secure the premise required for the ethical system to be practically rational.
  *   **Soft Spot:** You haven't proven Sidgwick thought the *validity* depended on it, only his *psychological ability to continue*. If he thought morality was binding regardless of consequences, your thesis crumbles.

  #### 2. The "Methodological Integrity" Objection (Historian Faction)
  **Phrasing:** "You're implying the Census of Hallucinations was a desperate grab for proof. But Sidgwick and the SPR were careful to distinguish between 'evidence for survival' and 'statistical regularities in testimony.' Sidgwick was actually quite skeptical of the Census data in private correspondence. Are you projecting a need for 'proof' onto a project that was ostensibly about cataloguing phenomena?"
  *   **Damage:** High. If Sidgwick didn't think the SPR could actually deliver the "warrant," your "borrowed warrant" thesis implies he was lying to himself.
  *   **2-Minute Reply:** Concede he was skeptical of specific data points, but insist he was committed to the *method*. For Sidgwick, empirical science was the only authority left that could rival Intuitionism. If reason fails (Dualism), and theology is dead (Victorian crisis), empirical science is the only place left to look. The Census wasn't about 'proof' in the mathematical sense; it was about establishing a probability high enough to license rational hope. That probability is the 'warrant.'
  *   **Soft Spot:** You need to be careful not to overstate the SPR's success. If the Historians have a letter where Sidgwick says "This proves nothing," they will read it.

  #### 3. The "Normative Gap" Objection (Analytic/Historian Hybrid)
  **Phrasing:** "Let's say you're right. He proves survival. So what? Proving the soul survives death doesn't prove that the universe is morally governed. You could survive and still be in a universe where self-interest and duty diverge. How does psychical research bridge the gap between 'existence continues' and 'virtue is rewarded'?"
  *   **Damage:** Critical. This attacks the core mechanism of your thesis.
  *   **2-Minute Reply:** Sidgwick isn't looking for a logical proof of moral governance; he's looking for evidence of a *Moral Governor* or a cosmic order. If consciousness survives, the materialist picture (where death ends all stakes) is false. This opens the logical space for theological or quasi-theological hypotheses that *do* promise convergence. The psychical research removes the *barrier* to belief in a moral cosmos; it doesn't provide the moral cosmos itself, but it makes it empirically permissible to assume one.
  *   **Soft Spot:** This is a bit of a retreat. You're admitting the SPR doesn't solve the Dualism, it just makes it *possible* to hope. That weakens the "load-bearing" claim.

  #### 4. The "Chronology" Objection (Historian Faction)
  **Phrasing:** "The Dualism appears in the first edition of *Methods* (1874). The SPR is founded in 1882. The Census is 1894. Are you arguing he held the ethics hostage for eight years before deciding to look for ghosts? Or did the ethics change?"
  *   **Damage:** Low/Medium. Easy to mess up if you fumble dates.
  *   **2-Minute Reply:** The Dualism is present in 1874, but the *despair* deepens over time. In the final editions, he becomes more explicit about the inability of reason to solve it. The SPR isn't the source of the problem; it's the late-stage solution to a worsening crisis. The continuity isn't chronological simultaneity; it's systematic dependency. As the ethical deadlock hardened, the need for empirical rescue became urgent.
  *   **Soft Spot:** If they press on specific revisions between 1874 and 1890 where he *doesn't* mention psychical research, you look like you're ignoring textual development.

  ---

  ### PART 2: PRE-EMPTIVE CONCESSIONS
  *Do not wait for them to pounce on these. Weave one of these into your closing remarks or answer the first question with it.*

  **The Census Concession:**
  "I want to be clear: I am not arguing that the Census of Hallucinations was methodologically sound by modern standards, nor that Sidgwick thought it was definitive proof. The sample sizes were self-selecting and the controls were loose. My claim is weaker but philosophically more significant: Sidgwick treated this *kind* of empirical inquiry as the only legitimate source of 'warrant' left available to him. He knew the data was messy, but he also knew that without *some* empirical indication of a beyond, his ethics collapsed into irrationality. He chose the messy data over the ethical collapse."

  *Why this works:* It disarms the Historians (you aren't defending bad science) and satisfies the Analytics (you aren't claiming the ethics rests on *true* facts, but on his *take* on the facts).

  ---

  ### PART 3: THE DREADED QUESTION
  *You guessed it was about the coherence of "borrowed warrant." That's a terminology quibble. The real killer is about Normative Force.*

  **The Question:**
  "If Sidgwick finds empirical evidence that duty pays in the long run (via afterlife rewards), hasn't he just collapsed Duty into Self-Interest? If I'm only rational to be moral because I'll get rewarded later, isn't that Hedonism, not Deontology? Does your thesis accidentally prove Sidgwick abandoned *Methods* rather than saved it?"

  **Why this wrecks you:**
  Your thesis is that SPR saves the Dualism. But the Dualism relies on Duty and Self-Interest being *distinct* demands. If the SPR proves they converge because God rewards the good, then Duty is just enlightened Self-Interest. This undermines the distinctness of the Moral Sentiment which Sidgwick also wants to preserve.

  **Prepared Reply (Keep this in your back pocket):**
  "That's the tension Sidgwick lived with. He needs the convergence to make Duty *rational*, but he needs the distinction to make Duty *moral*. The psychical research secures the rationality (it's not suicide to be moral) without necessarily erasing the distinction (I still recognize Duty as distinct, even if it happens to align with my interest in the long run). He's trying to have it both ways: a universe that supports morality without reducing morality to prudence. I'm arguing the SPR was the tool he used to sustain that precarious balance."

  ---

  ### FINAL TACTICAL NOTE
  **Watch the Historians' eyes.** When you mention the SPR, the Analytics will look bored. The Historians will look vigilant. If you make a claim about *what the SPR did*, look at the Historians. If you make a claim about *why Sidgwick needed it*, look at the Analytics. Do not let the Historians feel you are treating their experts as cranks, and do not let the Analytics feel you are treating philosophy as biography.

  Good luck. Don't let them separate the ghost from the machine.
