prompt: |-
  ok so I'm in a 19th-c British philosophy seminar and my final paper is basically one argument, and next week I have to present it to the class plus two guest faculty, and I need a Q&A prep sheet.

  My thesis, roughly: everyone treats Sidgwick's psychical research as a slightly embarrassing hobby that's seperate from the real work, The Methods of Ethics. I want to argue it's the reverse — it's continuous with the ethics. Because Methods ends in the dualism of practical reason, i.e. no proof that self-interest and duty actually converge, Sidgwick needed some kind of cosmic guarantee that duty would be backed by the universe, and he couldn't get that out of reason alone, so he went looking for empirical evidence instead — survival, apparitions, the whole SPR business (he was its first president in 1882, and the Census of Hallucinations came out in 1894). I'm calling this move 'borrowed warrant': he outsources to empirical psychical research a cosmological premise his ethics needs but can't derive. So the psychical stuff isn't a lapse or a midlife thing, it's load-bearing for the metaethics.

  The audience: about a dozen people. Most are analytic metaethicists who've taught Methods of Ethics like five times, they know the dualism material cold, and they think the ghost stuff is cringe and irrelevant to the real argument. But the two guests are historians of Victorian science who actually know the SPR Proceedings and think the early researchers were doing serious methodology — the Census, the eyewitness-testimony work, all of it — and they'll get irritated at anyone who waves it away as pseudoscience. So I'm getting hit from both directions at once and I don't want to prepare for only one.

  Give me the Q&A prep sheet: the objections I'll actually get, in roughly the order they'll come, phrased the way each faction would phrase them. For each one: how much damage it does to my thesis, a two-minute reply, and where that reply is soft. Tell me what I should concede up front — I suspect I have to give up something about how the Census numbers were actually collected, and I'd rather do it myself than have the historians do it to me. And end with the one question I'm hoping nobody asks; my gut says it's whether 'borrowed warrant' is even a coherent description of what he was doing, but tell me if you think it's something else. No citations needed, I just need to not get wrecked in the question period.
