answer: |-
  # Activity Plan: The St. Petersburg Trading Floor

  **Course:** Graduate Seminar in Decision Theory / Philosophy of Probability
  **Time:** 90 Minutes
  **Students:** 16 (Divided into 4 Trading Tables of 4)
  **Goal:** To physically instantiate the tension between theoretical expected value (EV) and empirical reality, then demonstrate that even accepting infinite EV breaks standard preference orderings (stochastic dominance), rendering utility-bounding solutions insufficient.

  ---

  ## 1. Materials and Setup

  *   **Room:** 4 tables, 4 students each. Whiteboard visible to all.
  *   **Currency:** "Credits" (poker chips or printed slips). Total pool: 2,000 Credits.
  *   **The House Bank:** Each table gets a "House Kit":
      *   1 Coin.
      *   1 "Bankroll Ledger" (pre-printed sheet).
      *   500 Credits (The Table Bankroll).
      *   **The Cap Card:** A visible sign stating: **MAX PAYOUT PER TICKET = 256 Credits.** (This is $2^8$. It keeps arithmetic fast but ensures the "tail" is physically cut off).
  *   **The Board:** Pre-written with the theoretical St. Petersburg payoff table:
      *   $n=1, Pay=2, Prob=1/2$
      *   $n=2, Pay=4, Prob=1/4$
      *   ...
      *   $n=k, Pay=2^k, Prob=2^{-k}$
      *   **Theoretical EV = $\infty$** (Written in large red marker).
  *   **Handouts:**
      *   "Trader's Log" (to record flip results).
      *   "Pricing Ballot" (for Stage 1 and Stage 2 votes).

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Explain rules, distribute kits, assign roles. Emphasize: *The Board says EV is $\infty$, The House Cap says Max Pay is 256.* |
  | **10-35** | **Stage 1** | **The Simulation.** 4 Tables run 5 rounds each. Record empirical data. |
  | **35-50** | **Committee 1** | **Pricing the Classic Lottery.** Groups debate and submit a single ticket price for the *Theoretical* (uncapped) game. |
  | **50-55** | **Transition** | Facilitator removes bankroll caps conceptually. Introduces Stage 2 Lotteries. |
  | **55-75** | **Stage 2** | **The Dominance Challenge.** Rank Lottery A vs. B vs. C. Justify via EV. |
  | **75-90** | **Debrief** | Map confusion to philosophical solutions (Capping, Utility, Undefined, etc.). |

  ---

  ## 3. Stage 1: The Finite Casino (25 Minutes)

  ### Roles (Rotate every 2 rounds)
  1.  **The Croupier:** Flips the coin, announces "Heads/Tails," stops when Tails appears. Counts flips ($n$).
  2.  **The Paymaster:** Calculates payout ($\min(2^n, 256)$), dispenses Credits from the House Bank.
  3.  **The Player:** Pays 10 Credits to enter. Receives payout. Records net profit.
  4.  **The Scribe:** Records $n$ and Payout on the Table Ledger (visible to all).

  ### Mechanics
  1.  **Entry Fee:** Fixed at **10 Credits**. (This is arbitrary but creates a stake).
  2.  **The Game:** Croupier flips until Tails. If $n$ flips, payoff is $2^n$.
  3.  **The Constraint:** If $2^n > 256$, the Paymaster pays **256** and the game ends (House Insolvency Rule).
  4.  **Rounds:** Run 5 rounds per table. (Total 20 data points per table, 80 total).
  5.  **Aggregation:** Scribes sum the Total Payouts and Total Entry Fees for their table.

  ### The Trap
  *   **Theoretical EV:** $\infty$ (On the board).
  *   **Capped EV:** $\approx 8$ Credits (Since max payout is 256, the EV is $\sum_{1}^{8} 1 + \text{tail} \approx 8$).
  *   **Empirical Result:** Most $n$ will be 1, 2, or 3. Payouts 2, 4, 8. Entry fee 10. **Most students lose money.**
  *   **Tension:** The board says "Infinite Value." Their pockets say "Net Loss."

  ---

  ## 4. Committee 1: Pricing the Theoretical Lottery (15 Minutes)

  **Task:** The class is now a Pricing Committee. You must set a **Fair Price** for a ticket to the *Theoretical* St. Petersburg Lottery (Ignore the 256 Cap for this pricing decision; assume the House *could* pay infinity).

  **Factions (Assign 1 per table, or let them self-select):**
  1.  **The Theorists:** "The math says EV is $\infty$. Price must be very high (or infinite)."
  2.  **The Empiricists:** "We just played. We lost money. Price should be low (around 5-10 Credits)."
  3.  **The Risk Managers:** "The variance is too high. Price must account for bankruptcy risk."

  **Procedure:**
  1.  **Silent Vote (2 mins):** Write a price on the ballot.
  2.  **Table Debate (5 mins):** Must agree on one number per table.
  3.  **Floor Vote (5 mins):** Each table announces their price.
  4.  **Facilitator Challenge (3 mins):** "If the price is 100 Credits, who buys? If the price is 5 Credits, who sells?"

  **Expected Outcome:** Deep disagreement. Theorists look detached from reality; Empiricists look like they are ignoring the math.

  ---

  ## 5. Stage 2: The Dominance Challenge (20 Minutes)

  **Facilitator Script:** "Okay, suppose we resolve the bankroll issue. The House is God. The Bankroll is Infinite. The EV is truly $\infty$. We now have three lotteries available. You must rank them in order of preference (1 = Best, 3 = Worst) and assign a Cash Equivalent to each."

  **The Lotteries (Write on Board):**
  *   **Lottery A (Classic):** Pays $2^n$ with prob $2^{-n}$. (EV = $\infty$)
  *   **Lottery B (Bonus):** Pays $2^n + 1$ with prob $2^{-n}$. (EV = $\infty$)
  *   **Lottery C (Double):** Pays $2 \cdot 2^n$ with prob $2^{-n}$. (EV = $\infty$)

  **The Constraint:**
  *   You must justify your ranking using **Expected Value Reasoning**.
  *   You cannot say "Utility." You are pricing in Credits.
  *   You cannot say "They are equal." (Facilitator Intervention: "If A = B, would you swap A for B for free? If yes, B is strictly preferred. If no, why not? B pays strictly more in every outcome.")

  **Mechanics to Prevent Collapse:**
  1.  **Individual Ranking:** Students privately rank A, B, C.
  2.  **The Swap Test:** Ask: "Who holds Ticket A? I offer Ticket B for free. Keep A or Swap?" (Show of hands).
      *   *If they swap:* They admit $B \succ A$.
      *   *If they don't:* They violate Stochastic Dominance.
  3.  **The Pricing Trap:** Ask: "If $B \succ A$, then Price(B) > Price(A). What is Price(A)?"
      *   If they say "Infinity," then Price(B) must be "Infinity + 1". Ask them to write that number down.
      *   If they say "Undefined," ask why they preferred B in the swap test.

  **Goal:** Force them to see that EV ($\infty$) cannot distinguish between $\infty$, $\infty + 1$, and $2\infty$, yet their intuition demands a ranking.

  ---

  ## 6. Debrief: Mapping the Breakdown (15 Minutes)

  Draw a 2x2 matrix on the board. Map their frustrations to the literature.

  | The Intuition | The Mathematical Fix | The Cost (Philosophical Price) |
  | :--- | :--- | :--- |
  | **"The House will go broke."** | **Finite Cutoff** (Stage 1 Cap) | Arbitrariness. Why 256? Why not $2^{100}$? EV changes drastically with cap. |
  | **"Money isn't everything."** | **Bounded Utility** (Bernoulli) | Solves Stage 1, *fails Stage 2*. (Log(2^n) vs Log(2^n + 1) still sums to $\infty$). |
  | **"The Sum doesn't exist."** | **Undefined Expectation** (Easwaran/Measure Theory) | Requires rejecting standard linearity of expectation. Hard to compute with. |
  | **"Probabilities are subjective."** | **Finitely Additive Prob.** (De Finetti) | Allows EV to exist but violates countable additivity. Counterintuitive limit behavior. |

  **Closing Thought:** "The St. Petersburg Paradox is not a problem about money. It is a problem about the interface between infinite sums and rational choice. If you fix the money (utility), the infinity moves to the probabilities. If you fix the probabilities, the infinity moves to the sums."

  ---

  ## 7. Predicted Pitfalls & Recovery Strategies

  ### 1. Arithmetic Bottleneck (Stage 1)
  *   **Risk:** Students stall calculating $2^7$, $2^8$, etc.
  *   **Recovery:** Provide a **Payout Lookup Card** on every table (1→2, 2→4, ... 8→256, 9+→256). Enforce the cap strictly.
  *   **Risk:** Students try to calculate the *Theoretical* EV during the game.
  *   **Recovery:** Remind them: "The Board has the Theory. You have the Data. Don't mix them yet."

  ### 2. The "Utility" Dodge (Stage 2)
  *   **Risk:** A student says, "I have diminishing marginal utility, so I prefer B but the price is the same."
  *   **Recovery:** "We are pricing in Credits, not Utils. If you prefer B, you should be willing to pay more Credits for B than A. How many more?" Force the cash equivalent.
  *   **Recovery 2:** "Even with Log Utility, $\sum \frac{1}{n} \ln(2^n)$ diverges. The paradox survives utility bounding for many functions. Assume for this exercise your Utility is Linear in Credits."

  ### 3. Stage 2 Shouting Match
  *   **Risk:** "It's infinity, it's all the same!" vs. "No, B is better!"
  *   **Recovery:** Use the **Swap Test**. "Don't tell me what you think. Tell me what you would do. Hold up Ticket A. I hold Ticket B. Swap? Yes or No." Action bypasses semantic deadlock.

  ### 4. Time Overrun
  *   **Risk:** Stage 1 takes too long.
  *   **Recovery:** Cut Stage 1 to 3 rounds per table instead of 5. The empirical point (most payouts are small) is made in 3 rounds.
  *   **Risk:** Debrief runs short.
  *   **Recovery:** Prioritize the "Cost" column in the Debrief Matrix. That is the graduate-level takeaway.

  ---

  ## 8. Candid Limitations (For the Instructor)

  You must explicitly state these during the debrief, as the activity cannot physically demonstrate them:

  1.  **The Finite Simulation Lie:** Stage 1 *cannot* actually simulate infinite expectation. It simulates a *capped* expectation. You are relying on the students to accept the *formula* on the board as the "True" game and the *tokens* as the "Flawed" instantiation. You must bridge this gap verbally: "The tokens ran out, but the math doesn't care."
  2.  **The "Infinity" Intuition:** Humans cannot feel infinity. When they say "Price is very large," they mean "1 million," not $\infty$. Stage 2 forces the logical consequence of $\infty$, but their gut will still treat it as "very large finite number." You must press them on the arithmetic of $\infty + 1 = \infty$.
  3.  **Measure Theory Absence:** Since they lack measure theory, you cannot rigorously explain *why* the expectation is undefined in some frameworks (rearrangement of conditionally convergent series, etc.). You must treat "Undefined" as a philosophical stance rather than a proven theorem in this session.

  ## 9. Facilitator's Cheat Sheet (Key Questions)

  *   **When they price Stage 1 low:** "Are you saying the math on the board is wrong, or that the math is irrelevant to choice?"
  *   **When they price Stage 1 high:** "Would you mortgage your house to buy one ticket at that price?"
  *   **When they rank A = B in Stage 2:** "If I offer to add $1 to every payout of A for free, do you accept? If yes, you prefer B. If you prefer B, B is more valuable. How can two things have different values but the same price?"
  *   **Final Wrap:** "Did utility solve it? (No). Did capping solve it? (No, arbitrary). Did ignoring EV solve it? (Maybe, but what replaces it?)"
