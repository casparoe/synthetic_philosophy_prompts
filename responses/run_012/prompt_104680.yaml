      *   *Relabeling Check:* Is this just "Semantics, Pragmatics, and Social Norms"? Basically, yes. But "Taboo Transmission" as a specific mechanism of *liability* is a useful specification. I should acknowledge it's a refinement of existing categories, not a paradigm shift, but that's okay for a workshop paper.

