      *(Self-Correction on "Taboo"):* I need to suggest a test case. What if a word is highly taboo but low contempt? (e.g., profanity vs. slurs). Or high contempt but low taboo (archaic slurs no one uses). This helps test independence.

      *(Self-Correction on "Coalition"):* The "badge" metaphor is good. But badges can be forged. What about appropriation? Outsiders using in-group terms. That breaks the coalition link. Does the account handle that?

