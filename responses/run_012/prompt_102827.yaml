  ### The Tensions (Ordered by Cost to Fix)

  **1. The Definition Conflict: (2) vs. (5)**
  *   **The Tension:** (2) says the person who gets there *first* has the claim. (5) says Darwin sat on it for 20 years and Wallace is a *co*-discoverer. If priority is the genuine claim, why does Darwin get the credit for the theory if Wallace triggered the publication? Did Darwin get there "first" in conception or publication?
  *   **Cost to Fix:** **Low.**
  *   **The Repair:** Nuance your definition of "first." You aren't arguing for "first to publish" but "first to secure the theoretical framework." Darwin had the mechanism (natural selection) fully formed; Wallace had the insight.
  *   **What it costs:** You have to explicitly define "priority" in your statement as *conceptual completion*, not just *publication date*.

  **2. The Philosophical Conflict: (1) vs. (2)**
  *   **The Tension:** (1) says discovery is "mostly circumstance" (ripe fruit). (2) says the discoverer has a "genuine claim." If it's mostly circumstance/luck that I grabbed the fruit, is my claim based on *merit* or just *luck*? If it's luck, in what sense is the claim "genuine"?
  *   **Cost to Fix:** **Medium.**
  *   **The Repair:** Shift the ground of the "claim." Argue that the claim is genuine *sociologically* (science needs a name to attach to the idea for citation and tracking) even if it isn't genuine *ontologically* (the idea was inevitable).
  *   **What it costs:** You have to concede that priority is a *functional necessity* for science, not necessarily a reward for unique genius. This weakens the "Great Man" implication of (2) but saves the claim.

  **3. The Methodological Conflict: (4) vs. (2), (3), and (5)**
  *   **The Tension:** This is the killer.
