  ### The bottom line

  One principle survives, but it is composite: **Reciprocal Stewardship bounded by Humanitarian Necessity**. You owe priority to those subject to your shared coercive institutions (residents), but this priority dissolves when outsiders face severe deprivation or injustice that insiders do not. This reconciles your welfare partiality (g) with your refugee impartiality (f) by distinguishing discretionary benefits from basic rights. It handles citizenship via residency (h, i, j) and limits state power via justice (k). It is not a single rule, but a hierarchy: institutional duty first, humanitarian constraint second.

  ### Candidate principles

  1.  **The Coercive Community Clause:** State duties attach primarily to those subject to its laws and participating in its social reproduction. This explains (h) (citizen entitled despite no tax), (j) (resident owed rights despite no passport), and (i) (diaspora cousin has weaker claim due to lack of subjection). It defines the circle of priority based on reciprocal subjection, not blood or mere contribution. It captures the intuition that living under the law creates a special bond stronger than ancestry. It motivates the distinction between (i) and (j).

  2.  **The Urgency Threshold:** Partiality is permissible in distributing discretionary goods but forbidden when basic rights, survival, or justice are at stake. This separates (g) (welfare efficiency) from (f) (refugee safety) and (b)/(d) (public roles affecting livelihoods). It forces impartiality where harm is severe or rights are violated, as in (k). It acknowledges that state partiality is a luxury of stability, not a right amidst crisis. This clause is motivated by the conflict between (f) and (k) versus (g).

  3.  **The Private Reserve:** Where no public institutional duty exists, individuals may exercise partiality. This covers (a), (c), and (e), where personal resources or private associations allow discretion without violating public trust. It preserves personal liberty against demanding cosmopolitanism. It explains why (a) and (c) differ from (b) and (d).

  Regarding (f) and (g): These are the stress test. (g) falls below the Urgency Threshold; the state acts as a mutual aid society for members, allowing inefficiency for solidarity. (f) crosses it; humanitarian need trumps club rules because the stakes are survival. The principle holds, but the threshold is the pivot point. If the efficiency gap in (g) became extreme (1 vs 100), it would cross the threshold too, forcing impartiality. This distinction saves the theory from contradiction. It requires you to accept that (g) is contingent on the margin being small. The Coercive Community Clause specifically addresses your half-baked theory. It confirms subjection matters (h, j) but clarifies that mere passport holding without subjection weakens the claim (i). The Urgency Threshold specifically resolves your drunken impasse. It admits (g) is right *because* the stakes are low, but insists (f) overrides it *because* the stakes are high. It treats (b) and (d) as public trust issues where efficiency/merit matters more than identity. The Private Reserve protects your intuition in (e) that saving a compatriot is allowed but not required; it's a private choice in a public crisis.

