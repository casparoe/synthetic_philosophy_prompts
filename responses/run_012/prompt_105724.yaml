  | (b) | Not fine (go where good is more) | Urgency Threshold (Public Duty) | |
  | (c) | Fine to hire citizen | Private Reserve | |
  | (d) | Not fine (hire better) | Urgency Threshold (Public Duty) | |
  | (e) | Allowed, neutral virtue | Private Reserve | |
  | (f) | Take refugees | Urgency Threshold | |
  | (g) | Prefer £1 here over £2 there | Coercive Community (below threshold) | |
  | (h) | Entitled to care | Coercive Community | |
  | (i) | Weaker claim than resident | Coercive Community | |
  | (j) | Owed everything (plus vote) | Coercive Community | |
  | (k) | Owe victims more | Urgency Threshold (Justice) | |

  ### Cases I didn't give you

  **Dual national living abroad:** Like (i), their claim is weak. They hold the passport but lack the subjection. They are entitled to consular protection (safety) but not welfare transfers. The Coercive Community Clause excludes them from (g)-style benefits because they don't share the daily burden of laws. They are members of the club who never visit the clubhouse.

  **Climate policy:** We owe more to future residents because they will be subject to our current institutions. However, the Urgency Threshold applies. We can prefer local economic comfort, but not at the cost of foreign survival. If our emissions drown their islands, partiality is voided. We must minimize harm to outsiders even if it costs us more, mirroring (f). The duty to avoid catastrophe trumps the duty to maximize local wealth.

  **Secession:** If a region votes to leave, they are opting out of the coercive community. Transitional claims exist (pensions earned), but future welfare claims dissolve. They become case (b)/(f) foreigners. The principle shifts from Reciprocal Stewardship to Humanitarian Necessity only. Existing debts remain, but future solidarity ends. Once they leave, (g) no longer applies between the two states; they become separate coercive communities. Asset division is a matter of justice, not ongoing welfare priority.

  ### What I have to give up

  You must soften (g). If the efficiency gap widens from 1 vs 2 to 1 vs 100, your intuition should flip. Reciprocal Stewardship cannot justify massive waste when human welfare is the metric. If the "pound" buys life-saving medicine abroad and only comfort here, the Urgency Threshold is crossed. To change my mind, you would need to show that state legitimacy depends on strict prioritization regardless of outcome magnitude, but that contradicts (f). Your theory works only if welfare gaps remain marginal. You must admit (g) is contingent, not absolute.

  You must also clarify (i). If the cousin returns, does the claim strengthen? Yes, because subjection resumes. You cannot hold that blood matters independently of residence. Finally, you must accept that (e) is morally neutral, not virtuous. The principle says you are *allowed*, not *praised*. If you think saving a compatriot is positively better, the principle needs a "Solidarity Bonus" clause, which complicates (f).
