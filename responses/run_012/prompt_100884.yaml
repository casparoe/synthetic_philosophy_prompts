prompt: |-
  I'm a cognitive science student in a seminar on the evolution of mind, and next week we're hosting a guest speaker who defends a revisionist version of the familiar four-level taxonomy: Darwinian creatures, Skinnerian creatures, Popperian creatures, and Gregorian creatures. Her twist is that the levels should be distinguished not by increasing intelligence but by where selection occurs—on the lineage, on the individual's behavior, on internal models, or on public representations—and she argues that this reordering implies that some Gregorian creatures can be less Popperian than some Skinnerian ones, because they offload conjecture and refutation onto shared artifacts. I've been asked to draft eight to ten interview questions for the Q&A. Please write them in American English, and make them press on the actual content of this position rather than inviting her to restate the taxonomy. I want at least one question each on whether the Skinnerian/Popperian line is really about inner representation or just about behavioral flexibility; on whether the Gregorian category is too linguistic and excludes non-linguistic niche construction; on whether the selection-location criterion makes the levels exhaustive or just a useful heuristic; and on what would count as evidence for a fifth level. For each of those, include a follow-up keyed to the answer she is most likely to give. No generic questions about how she became interested in the topic, and no requests for reading lists or citations.
