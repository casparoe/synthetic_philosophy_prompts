      **From: People & Culture (P&C)**

      **1. How does the Collective Win bonus work?**
      To drive radical alignment, Q4 features a fixed bonus pool of $1,000,000. Unlike traditional bonuses, this pool isn't pre-allocated. Instead, it is divided evenly among every employee who submits a claim form by Friday. This ensures rewards are strictly proportional to engaged participation.

