      Great question. Since we cannot coordinate centrally (anti-collusion policies), we recommend "Agile Decisioning." Don't treat claiming as a binary commitment. Instead, assess your bandwidth. If every employee claims only when their specific local context aligns—say, rolling a digital die and claiming only on a six—we naturally distribute risk. This decentralized randomization prevents pool saturation while maintaining individual agency.

