      **Introduction**
      Welcome to the National Bank of Ideal Credit. In accordance with recent legislative adjustments, our currency is no longer pegged to metallic reserves but is issued as a ticket representing the power to command industry. We understand that shifting from substance to convention raises operational questions. The following guidance clarifies how we maintain stability when wealth is understood as a relational idea rather than a material object.

      **1. What backs the value of this currency?**
      The currency is backed by the collective capacity of the nation to labor. Gold and silver are merely heavy metals with no intrinsic power to feed or clothe the populace. Our notes represent a claim on the industry of your neighbors. As long as the population remains willing to work, the ticket retains its purchasing power.

      **2. Is there gold stored in your vaults?**
      We hold certain metallic artifacts for ceremonial purposes, but their existence is metaphysically secondary. Since material substance does not exist independently of perception, storing wealth in a dark vault is functionally identical to storing nothing. We prefer to store value in the public mind where it remains active and perceived.

      **3. If I hide my money in a safe, does it cease to exist?**
      Not necessarily. While existence depends on perception, the Bank acts as the perpetual perceiver of the national money supply. We maintain the idea of your savings even when you are not looking at them. You may rest assured that your wealth continues to be thought of by our auditors.

      **4. How do you control inflation?**
      Inflation occurs when there are more tickets than there is labor to redeem them. We regulate the supply of notes to match the national will to work. If the populace becomes idle, we withdraw currency to ensure the ratio of tickets to industry remains stable.

      **5. Why should I accept this paper instead of coin?**
      Coin is valuable only because people agree it is valuable. Our paper is superior because it openly admits it is a counter for trade. There is no deception in using a ticket to command goods. Trust is the only requisite metal, and we are minting plenty of it.

      **6. What happens if I burn a banknote?**
      You have destroyed the physical symbol, but the wealth persists if the Bank records the serial number. However, if all records and perceptions of that note are lost, the wealth effectively vanishes from the universe. We recommend digital storage, as ideas are fireproof.

