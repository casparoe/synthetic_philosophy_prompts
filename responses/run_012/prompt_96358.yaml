  # The National Bank of Ideal Credit
  ## Frequently Asked Questions Regarding the New Scrip

  **Introduction**
  Welcome to the National Bank of Ideal Credit. In accordance with recent legislative adjustments, our currency is no longer pegged to metallic reserves but is issued as a ticket representing the power to command industry. We understand that shifting from substance to convention raises operational questions regarding security and value. The following guidance clarifies how we maintain stability when wealth is understood as a relational idea rather than a material object. Our commitment to public prosperity remains absolute, provided the public continues to perceive it.

  **1. What backs the value of this currency?**
  The currency is backed exclusively by the collective capacity of the nation to labor. Gold and silver are merely heavy metals with no intrinsic power to feed or clothe the populace. Our notes represent a claim on the industry of your neighbors. As long as the population remains willing to work, the ticket retains its purchasing power. If industry ceases, the ticket becomes a mere scrap of paper, as there is no labor left to command.

  **2. Is there gold stored in your vaults?**
  We hold certain metallic artifacts for ceremonial purposes, but their existence is metaphysically secondary. Since material substance does not exist independently of perception, storing wealth in a dark vault is functionally identical to storing nothing. We prefer to store value in the public mind where it remains active and perceived. Relying on invisible matter is a superstition we have moved beyond.

  **3. If I hide my money in a safe, does it cease to exist?**
  Not necessarily. While existence depends on perception, the Bank acts as the perpetual perceiver of the national money supply. We maintain the idea of your savings even when you are not looking at them. You may rest assured that your wealth continues to be thought of by our auditors. However, we recommend frequent viewing to reinforce the reality of your assets.

  **4. How do you control inflation?**
  Inflation occurs when there are more tickets than there is labor to redeem them. We regulate the supply of notes to match the national will to work. If the populace becomes idle, we withdraw currency to ensure the ratio of tickets to industry remains stable. It is easier to print fewer tickets than to compel more labor, so we prioritize monetary contraction during periods of leisure.

  **5. Why should I accept this paper instead of coin?**
  Coin is valuable only because people agree it is valuable. Our paper is superior because it openly admits it is a counter for trade. There is no deception in using a ticket to command goods. Trust is the only requisite metal, and we are minting plenty of it. To prefer gold is to prefer the shadow of wealth over the substance of power.

  **6. What happens if I burn a banknote?**
  You have destroyed the physical symbol, but the wealth persists if the Bank records the serial number. However, if all records and perceptions of that note are lost, the wealth effectively vanishes from the universe. We recommend digital storage, as ideas are fireproof. Physical destruction is discouraged as it risks erasing value from the collective consciousness.

  **7. Can foreigners use this currency?**
  Only if they perceive value in it. International trade relies on mutual recognition of credit. If foreign merchants do not acknowledge our power to command labor, the notes will not circulate abroad. We are currently launching an advertising campaign to encourage foreign perception of our solvency. Until then, exchange rates may fluctuate based on foreign imaginative capacity.

  **8. Is counterfeiting a crime if money is just an idea?**
  Yes. Counterfeiting is the unauthorized creation of tickets to command labor. It dilutes the power of legitimate ticket holders. While the note is a convention, the labor it commands is real. Stealing tickets is stealing the effort of your countrymen. We prosecute falsifiers not for damaging paper, but for disrupting the national agreement on value.

  **9. How are wages determined under this system?**
  Wages are the price of commanding labor. Since wealth is the power to command industry, employers purchase this power using our notes. If workers refuse to be commanded, the money loses its function. We encourage a cooperative spirit to maintain the velocity of circulation. A strike is essentially a refusal to validate the currency.

  **10. Who decides how much money to issue?**
  The Bank Governors act as the central mind regulating the economic imagination. We assess the national capacity for industry and issue tickets accordingly. It is a solemn duty to ensure the public does not imagine itself richer than it actually is. Our algorithms measure the public will to work with metaphysical precision.

  **11. What if everyone demands gold at once?**
  This is impossible, as gold is not the redemption standard. Even if it were, matter cannot satisfy all claims simultaneously. We urge depositors to perceive the stability of our paper credit rather than clinging to superstitious preferences for heavy elements. A run on the bank is merely a collective failure of faith.

  **12. How do I contact customer support?**
  You may perceive us during business hours. If our lines are busy, please hold the idea of our assistance in your mind. We are committed to ensuring your financial concepts remain clear and distinct. Rest assured, we are thinking about your problem even if you cannot reach us.
