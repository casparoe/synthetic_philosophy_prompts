answer: |-
  I appreciate the precision of your request. You are asking for a counterexample to the Doctrine of Doing and Allowing (DDA) that does not rely on the usual suspects (special duties, consequentialist calculus, or malicious intent) but rather on the *topology of agency* itself. You want to know if "authorship" can attach more strongly to an omission than a commission based on structural control.

  Having read Foot, Quinn, Thomson, and Kagan closely, I must tell you upfront: your framing is provocative but dangerous. The literature generally treats the doing/allowing distinction as a proxy for negative vs. positive rights. To flip it, we cannot just point to *consequences* (which a consequentialist would do); we must point to the *nature of the causal contribution*.

  Below, I sketch three candidate pairs, reject two, and build the case for the third. Then I will subject it to the stress tests you requested.

  ### Candidate Sketches

  **Candidate 1: The Mislabelled Vial (Negligence Comparison)**
  *   **Case 1 (Doing):** Pharmacist D grabs a vial, misreads the label (active error), administers toxin. Patient dies.
  *   **Case 2 (Allowing):** Pharmacist D grabs a vial. Pharmacist A (peer) sees the label is wrong but says nothing (omission). D administers toxin. Patient dies.
  *   **Verdict:** I reject this. It fails your "same knowledge" constraint. If D misreads, D is ignorant. If A sees, A knows. This makes A's culpability stem from *epistemic advantage*, not agency structure. If we equalize knowledge (both see it's wrong), D becomes a monster for administering it, which violates your "decent person" constraint.

  **Candidate 2: The Ventilation Failure (Mechanical Mediation)**
  *   **Case 1 (Doing):** Tech D spills acid. Fumes rise. D tries to wipe it (action), spreads it further. Victim harmed.
  *   **Case 2 (Allowing):** Tech D spills acid. Fumes rise. Tech A stands by the vent override. Does not press it (omission). Victim harmed.
  *   **Verdict:** I reject this. The harm here is mediated by the chemistry and the machine. It becomes a debate about *causal proximity*. The standard defender will argue D's spill is the *proximate cause*; A's inaction is merely background condition. It doesn't clearly flip the authorship.

  **Candidate 3: The Dual-Control Infusion (Positional Control)**
  *   **Case 1 (Doing):** In a high-risk oncology trial, the protocol requires two techs. Tech D is at the pump. Tech A is at the safety monitor. D initiates the infusion. The monitor alarms (pressure spike). D overrides the alarm (positive act) to continue. Patient harmed.
  *   **Case 2 (Allowing):** Same setup. D initiates infusion. Monitor alarms. D *does not override* (D freezes/panics). The pump is designed to continue flowing unless manually halted. Tech A is at the safety monitor. A has the "Emergency Halt" button. A sees the alarm. A does not press Halt (omission). Patient harmed.
  *   **Selection:** I choose **Candidate 3**. It isolates the variable of *control*. In Case 1, D acts against a safety warning. In Case 2, A fails to act *for* safety. Crucially, we can stipulate that in both cases, the agents are peers (randomized roles), have the same training, and face the same time pressure. The reversal hinges on who holds the *exclusive leverage* at the critical moment.

  ---

  ### The Case: The Dual-Control Infusion

  **Setting:** A clinical research unit. A chemotherapy infusion pump is programmed to continue flow unless actively stopped (fail-safe for continuity, risky for toxicity).
  **Agents:** Tech D (Operator) and Tech A (Monitor). Roles are randomized daily; they are peers.
  **Knowledge:** Both see the pressure alarm. Both know the protocol ("Halt on Alarm"). Both know the risk of harm.
  **Resources:** Both have the physical capacity to stop the harm. D can stop at the pump. A can stop at the monitor.

  **Case 1 (The Doer):** D is at the pump. Alarm sounds. D actively presses "Override" to continue the infusion. The pump continues. Patient suffers toxicity.
  **Case 2 (The Allower):** D is at the pump. Alarm sounds. D hesitates (does not press Override, but does not stop flow). A is at the monitor. A sees the alarm. A has the "Emergency Halt" linked to the pump. A does not press Halt. The pump continues. Patient suffers toxicity.

  **The Reversal:** In Case 2, Tech A (the Allower) is *more* culpable than Tech D (the Doer in Case 1, or the hesitant Doer in Case 2). Specifically, comparing the *Override* (Case 1) vs. the *Failure to Halt* (Case 2): The one who merely allows (A) is more the author of the harm than the one who acts (D in Case 1).

  Wait, to meet your constraint strictly ("Doer less culpable than Allower"), I must compare D in Case 1 (Override) vs A in Case 2 (No Halt).
  *   **D (Doer):** Actively overrides safety.
  *   **A (Allower):** Passively allows flow to continue despite safety alarm.
  *   **Claim:** A is more culpable.

  **Why?** Because of **Exclusive Preventive Leverage**.
  In Case 1, D's action is one of *initiation against resistance* (the alarm). D is fighting the system.
  In Case 2, A's inaction is one of *acquiescence with control*. A holds the *final* key. The pump is already running. D has frozen. A is the *only* remaining barrier. A's agency is the *sine qua non* of the harm's completion at that specific moment. D's action started the process, but A's inaction *sustained* it through the known danger zone.

  ### The Checks

  **1. Which reading of the Doing/Allowing distinction generates the reversal?**
  This relies on a **Control-Based Reading of Agency** (akin to a refined version of *causal control* theories). Standard DDA reads agency as *initiation of force*. This reading defines agency as *control over outcome*. If Agent A has exclusive control over the prevention of harm at time *t*, and harm occurs at *t*, A's omission is structurally equivalent to (or worse than) a commission because A functionally *willed* the outcome by not exercising the exclusive veto power. Authorship is assigned to the agent with the highest *marginal causal leverage* at the critical juncture.

  **2. What does a straightforward defender of the usual asymmetry say?**
  A defender (e.g., following Foot or Quinn) will argue: "In Case 1, D violates a negative duty (do not impose harm). In Case 2, A violates a positive duty (prevent harm). Negative duties are stricter. Therefore, D is always worse, *ceteris paribus*."
  They will claim my case fails *ceteris paribus*. They will argue that by giving A the "Emergency Halt," I have implicitly assigned A a *special duty* to use it, whereas D's duty is general. They will say the asymmetry holds; I have just weighted the duties differently.

  **3. What does a plain act-consequentialist say?**
  The consequentialist sees no moral difference in the outcome (death/toxicity). They judge based on future utility. They might argue A is *more* culpable because monitoring is a "cheaper" prevention method than operating (less cognitive load), so punishing A creates better incentives. Or they might say they are equal. They will reject the DDA distinction entirely as morally irrelevant.

  **4. Which single feature of the case is doing the work?**
  **Exclusive Preventive Leverage.** (The fact that at the moment of decision, A held the *only* remaining functional capacity to prevent the harm, whereas D's capacity was compromised or shared).
  *Correction:* In my setup, D *could* stop at the pump too. To make A *more* culpable, A's leverage must be *superior* or *exclusive*. Let's refine: In Case 2, D is frozen/panicked (incapacitated by stress). A is not. A is the *sole effective agent*.
  *Refined Feature:* **Sole Effective Agency at the Critical Juncture.**

  **5. What happens to the verdicts if you delete it?**
  If we delete "Sole Effective Agency" (i.e., D is also fully capable of stopping it in Case 2), then D and A are equally culpable for the failure. The reversal collapses. The asymmetry returns to the default (Doing is worse) or becomes neutral. The reversal *only* holds if A is the *last clear chance*.

  ### The Objection and Reply

  **The Defender's Attack:**
  "The defender will say you smuggled in a duty. By placing A at the monitor with the 'Halt' button, you made A a *guardian*. D is just an *operator*. Guardians have higher duties than operators. You haven't flipped the Doing/Allowing asymmetry; you've just compared a minor Doing (operator error) against a major Allowing (guardian negligence). This is a 'special dispensation' violation."

  **Are They Right?**
  Partially. It is hard to separate *capacity* from *duty* in institutional settings. However, I argue this is **structural**, not **normative**.
  *   *Defense:* Imagine the roles were assigned by a random draw just before the shift. Yesterday, A was the Operator; today, A is the Monitor. The *person* has no special dispensation; the *position* does. If the moral weight attaches to the *position's causal leverage* rather than the *person's role*, then it is a feature of agency structure, not social duty.
  *   *Vulnerability:* If the "position" carries a normative expectation (a duty), then it *is* a special dispensation. To truly satisfy your constraint, we must imagine a case where A has the power but *no formal duty*.
  *   *Revision:* A is a peer who *happens* to be standing next to the manual cut-off valve. There is no protocol saying A *must* use it. D is at the pump. D errors. A sees it. A *could* turn the valve. A doesn't.
  *   *Why A is worse:* Because D's error was a mistake of *procedure*. A's inaction was a choice of *morality* in the face of immediate certainty. D acted on habit; A acted on observation. A's agency is more "authored" because it was more informed and less constrained by workflow.

  **Where My Reasoning Might Fail:**
  I am most vulnerable on the **"Same Knowledge"** constraint. If D errors, D likely doesn't *know* it's an error (otherwise D is malicious). If A sees it, A *knows*. If knowledge differs, culpability differs for epistemic reasons, not agency-structure reasons.
  *   *Fix:* Both know the risk is *probabilistic*. D thinks "It's probably fine." A thinks "It's probably fine" but has the *means* to check/stop easily.
  *   *True Failure Point:* The "Last Clear Chance" doctrine is legally robust but philosophically contentious. A strict deontologist will *always* say initiating the threat (D) is worse than failing to stop it (A), because D changed the moral landscape from "safe" to "unsafe," whereas A left it "unsafe." If you believe the *creation of risk* is the primary moral wrong, my case fails. I am assuming the *realization of harm* is the primary moral wrong.

  **What Would Change My Mind:**
  If I accept Quinn's distinction between *direct* and *indirect* harm. Quinn argues that doing harm involves using the victim as a means. In my case, D uses the patient as a means (to finish the trial). A merely lets the patient be harmed. If "using" is the core of authorship, D is always worse, regardless of leverage. I would flip to the opposite verdict if I were convinced that *initiation* is morally weightier than *completion*, regardless of control.

  ### Conclusion

  You asked if the asymmetry is structural or a proxy for duty. My analysis suggests it is **structural**, but only when "structure" includes **distribution of preventive control**. When the Allower holds the *sole effective power* to prevent the harm at the critical moment, their omission becomes the dominant causal factor, effectively making them the "author" of the outcome in a way that outweighs the Doer's initiation. However, this walks a razor's edge near "special dispensation," as control often implies duty.

  \answer{Sole Effective Agency}
