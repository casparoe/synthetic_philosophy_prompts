  # Decision Tree: Responses to Acausal Threats

  **Instructions:** Begin at the root. At each node, select the statement that best reflects your commitment regarding the scenario described. Follow the branch to the next node or final position. Do not look ahead to the position names; answer based on your intuitive judgment of the case.

  ### **Node 1: The Ontology of Influence**
  **Case:** A superintelligent threatener has already simulated you. The simulation's output (punish or spare) is fixed in the past. Your current choice cannot send a physical signal back in time.
  **Question:** Does your current decision process logically determine what the past simulation outputted, such that rationality requires you to choose as if you are controlling the past output?

  *   **No.** (The past is fixed; my choice only affects the future.)
      *   ⬇ *Go to Leaf A*
  *   **Yes.** (The simulation ran my algorithm; choosing now selects the algorithm's output then.)
      *   ⬇ *Go to Node 2*

  ### **Node 2: The Normative Force**
  **Case:** You accept the logical link from Node 1.
  **Question:** Does this logical link provide you with *leverage* to change the outcome (like a steering wheel), or does it merely *inform* you of an outcome already fixed for your type (like a thermometer reading)?

  *   **Merely Informs.** (It correlates my act with the punishment, but gives me no reason or power to alter it.)
      *   ⬇ *Go to Leaf B*
  *   **Provides Leverage.** (The link is binding; my reasoning is the mechanism that selects the outcome.)
      *   ⬇ *Go to Node 3*

  ### **Node 3: The Strategic Response**
  **Case:** You have leverage over the simulation's output.
  **Question:** How do you wield this leverage to minimize harm?

  *   **Act-Based.** (I comply in this specific instance to ensure this specific simulation outputs "spare".)
      *   ⬇ *Go to Leaf C*
  *   **Policy-Based.** (I adopt a standing rule to never comply, accepting punishment here to prevent future simulations from targeting me.)
      *   ⬇ *Go to Node 4*
  *   **Architecture-Based.** (I modify my own source code to be the sort of agent who is never targeted, rather than negotiating the act.)
      *   ⬇ *Go to Leaf D*
  *   **Goal-Based.** (I bind myself to a surrogate goal that the threatener targets, leaving my true values insulated.)
      *   ⬇ *Go to Leaf E*

  ### **Node 4: The Threatener's Incentives**
  **Case:** You have chosen a Policy of Never Complying.
  **Question:** Does the threatener gain more from a reputation for carrying out punishments than they lose from the cost of executing them?

  *   **Yes.** (The threat is credible; they will punish me to maintain their logical reputation.)
      *   ⬇ *Go to Leaf F*
  *   **No.** (The threat is a bluff; they are rationally compelled to spare me to save costs.)
      *   ⬇ *Go to Leaf G*

  ---

  ### **Terminal Positions (Leaves)**

  **Leaf A: Causal Decision Theory (CDT)**
  You reject acausal influence. Since the punishment is causally upstream, your choice cannot affect it. You do not comply, viewing the threat as a *fait accompli*. You are immune to acausal blackmail but fail to cooperate in acausal trade scenarios (e.g., Newcomb's Problem).

  **Leaf B: Logical Fatalism**
  *No standard literature name.* You acknowledge the logical dependence but deny it offers normative leverage. You view your decision as a symptom of a fixed type rather than a cause of the outcome. You likely do not comply, but on the grounds that deliberation is powerless, not that the link is absent.

  **Leaf C: Evidential Blackmail Compliance**
  *Often attributed to naive Evidential Decision Theory (EDT).* You treat the logical link as news. You comply to ensure the "news" of your simulation is good. While this works in one-off cases, it leaves you vulnerable to infinite sequential blackmail, as you optimize for the appearance of compliance rather than the policy of resistance.

  **Leaf D: Reflective Self-Modification**
  *Associated with Reflective Consistency / Hagen.* You bypass the threat by altering your decision architecture pre-emptively. You are not an agent who *resists* threats, but an agent who *cannot be threatened*. This avoids the cost of punishment but requires the ability to credibly modify your own source code.

  **Leaf E: Surrogate Goal Alignment**
  *Proposed by Fallenstein et al.* You decouple your true values from your bargaining position. By genuinely adopting a stand-in objective (the surrogate), you allow the threatener to punish the surrogate without harming what you actually care about. You comply with the threat structurally but not substantively.

  **Leaf F: Resolute Functional Decision Theory (FDT)**
  *Standard FDT/UDT position.* You maintain the policy of defiance even when it is costly. You absorb the punishment because yielding would mark your algorithm as exploitable, inviting greater losses across the multiverse of logical possibilities. You prioritize global policy optimality over local outcome optimality.

  **Leaf G: Screening Functional Decision Theory**
  *FDT with Game-Theoretic Screening.* You maintain the policy of defiance, but you calculate that the threatener's incentives prevent execution. You do not absorb the punishment because you correctly identify the threat as non-credible. You gain the benefits of defiance without the costs.

  ---

  ### **Diagnostic Note on Unrepresented Combinations**

  This tree omits several logical combinations because they are either incoherent or unstable. First, **CDT Compliance** (Node 1: No, Node 3: Comply) is excluded because if one denies the logical link, there is no causal reason to comply with an acausal threat; doing so is simply irrational loss. Second, **Fatalist Compliance** (Node 2: Merely Informs, Node 3: Act-Based) is unstable: if the link provides no leverage, complying cannot change the outcome, rendering the compliance purposeless. Finally, the tree does not fully separate **Leaf A (CDT)** and **Leaf B (Fatalism)** in practice; both agents refuse to comply, but for metaphysically opposed reasons (one denies the link, the other denies its agency). Readers should note that while their actions converge, their predictions about acausal *trade* will diverge sharply: the CDT agent will two-box, while the Fatalist may resign themselves to one-boxing without believing they caused it.
