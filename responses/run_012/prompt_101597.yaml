  Alright, I've fallen down a bit of a rabbit hole and I could use some help thinking it through. I'm in a small reading group that's been working through the AI-safety stuff on factored cognition and HCH (humans consulting humans) — the idea that any big cognitive task can be chopped into smaller subtasks, each small enough that some bounded agent (say, a person with a couple of hours and no special insight) can do it alone, and then the answers get stitched back together; HCH is the idealized limit where all those bounded agents are humans and they can recursively call on each other. I've started doing a crude version of it on myself: when I've got a big decision, I write out a page of sub-questions and then answer each one as if I were a slightly dumber, more literal version of me, and honestly it works better than I expected. Which has made me wonder what I'm actually signing up for if I treat this as the right picture of deliberation.

  So what I want is the most important implications of treating HCH / factored cognition as the idealization of how deliberation should work. Not a recap of what it is — I've got the gist. The implications. I definately care about three things: (1) whether it implies that no single person ever needs to understand the whole thing, or whether the whole still has to be graspable by someone somewhere; (2) what has to be true of a decomposition for the stitched-together answer to actually be trustworthy — like, does every subtask need to be independently verifiable, and what happens when the thing doing the verifying is itself too big for one bounded agent; and (3) whether real institutions — a company's decision process, a market, a scientific field — are best understood as sloppy approximations of this ideal, or as doing something importantly different.

  Lay it out like this:

  'One-paragraph version' — 100-150 words, the whole thing in miniature, no hedging.
  'What it implies for one head' — 200-300 words on the single-mind question above.
  'What it implies for groups' — 200-300 words on the institutions question.
  'What the idealization costs you' — 200-300 words on the assumptions baked in (bounded subtasks, no loss from splitting, verifiability, and so on) and where they're most likely to break.
  'Bottom line' — 3-5 sentences on what I should actually take away.

  Please don't hedge everything into mush, and don't just tell me it's a research program rather than a claim — I want the real commitments.
