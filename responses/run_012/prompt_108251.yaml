answer: |-
  **Project Title:** The Inference Boundary: Formalizing Material Constraints on Past Belief Systems

  **The Question**
  Under what formal conditions does material evidence constrain belief attribution sufficiently to warrant scientific claim-making versus narrative construction?

  **The Problem**
  Archaeological inference currently oscillates between two unsatisfactory poles. Processualists often treat material patterns (e.g., standardized weights) as direct readouts of social function, assuming behavioral regularity implies cognitive uniformity. Post-processualists argue that meaning is context-dependent, rendering belief attribution inherently interpretive. Both positions lack a formal criterion for validity. The former ignores underdetermination (multiple belief systems can produce the same object); the latter risks paralysis (denying any constraint). We lack a method to distinguish when an object acts as a "compiled binary" (constraining behavior tightly) versus when it acts as "source code" (where the material trace is compatible with divergent internal states).

  **The Approach**
  I propose adapting an engineering concept: **Equivalence Classes.** Rather than testing point hypotheses about specific beliefs (e.g., "ochre implies belief in an afterlife"), I will model the set of all belief systems compatible with a specific material trace.
  1.  **High-Constraint Traces:** If the equivalence class is small (e.g., standardized weights require a central enforcement mechanism), behavioral inference is licensed.
  2.  **Low-Constraint Traces:** If the equivalence class is large (e.g., burial goods are compatible with ancestor worship, status display, or hygiene rituals), specific belief attribution is narrative, not inference.
  The goal is to produce a decision framework that identifies the "inference boundary" where the material record stops constraining the mental model.

  **Work Plan (6 Months, 50% FTE)**
  *   **Month 1:** Literature review. Focus on archaeological inference theory (processual/post-processual) and philosophical underdetermination. *Milestone: Annotated bibliography.*
  *   **Month 2:** Case Study Selection. Select two contrasting datasets: one high-constraint (e.g., Bronze Age weight systems) and one low-constraint (e.g., Neolithic burial ochre). *Milestone: Data specification.*
  *   **Month 3:** Modeling Case 1 (Weights). Map the material requirements to the set of possible social/belief structures that could generate them. *Milestone: Equivalence class definition for Case 1.*
  *   **Month 4:** Modeling Case 2 (Burials). Map the material requirements to the set of possible belief structures. *Milestone: Equivalence class definition for Case 2.*
  *   **Month 5:** Synthesis. Develop the "Inference Boundary" criterion based on the size/divergence of the equivalence classes. *Milestone: Draft framework.*
  *   **Month 6:** Final Write-up. Produce a white paper suitable for joint publication in archaeology and digital humanities venues. *Milestone: Final Report.*

  **Deliverables and Success Criteria**
  *   **Success:** A formalized rubric or decision tree that allows researchers to test whether a specific claim about past belief is supported by the material record or is an "equivalence class violation" (claiming a specific point within a broad set).
  *   **Failure:** If the equivalence classes for both high and low-constraint cases prove identical in size/divergence, the project will demonstrate that *no* material trace constrains belief attribution. This is a negative result but still a determinate answer to the research question.
  *   **Output:** One white paper (approx. 5,000 words) and one workshop presentation.

  **Feasibility**
  This scope is realistic for 10–12 hours/week over 6 months. The risk lies in the learning curve of archaeological theory; however, the engineering background is an asset here, as the project relies on systems modeling rather than traditional hermeneutics. By limiting the empirical work to two defined case studies rather than a broad survey, the timeline is manageable. The project does not require new fieldwork or data collection, only the re-analysis of existing published records through a new logical framework.
