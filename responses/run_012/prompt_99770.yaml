prompt: |-
  I'm a backend engineer with no philosophy backround, and I keep getting stuck on a decision that I'm pretty sure is a case of what people call incommensurable values. I want the implications of that spelled out for my situation.

  The decision: offer A is a stable, well-paid senior role at a big company, but the work is ad-tech stuff I find mildly gross. Offer B is a pay cut at a six-person climate startup whose mission actually matters to me, but it could fold within a year. There's no clean exhange rate between them — I can't say how much money equals how much meaning.

  I've been leaning on two hacks and I want to know what incommensurability actually implies for them:

  1. The "chain" trick: if I can find some third option that's clearly worse than A but clearly better than B (or the reverse), then I figure A and B must be comparable after all, so I should stop hand-wringing and just compare them.
  2. The "count" trick: score each offer by how many of the things I care about it satisfies, and take whichever scores higher.

  So: what are the most important implications of incommensurable values for how I should actually decide here — for those two hacks specifically, and for what to do when neither delivers a verdict? Definately take a position: tell me what you think I should do, not a menu of options. Max 300 words.
