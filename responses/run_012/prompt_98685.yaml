answer: |-
  You are right to be suspicious. This hand-out presents a classic objection to Hobbes's *verum factum* principle (the idea that truth is made), but it relies on a rather slippery slide between 'voluntary' and 'arbitrary'. If you wish to preserve the intuition behind (2) and (3) — that geometry is the model and politics is a science because we construct the commonwealth — you should target step (8).

  Here is an analysis of where the argument goes wrong, the ambiguities involved, and the cost of the repair.

  ### The Weak Link: Step (8)

  The argument hinges on the claim in (8): *'If geometry's certainty comes instead from our simply stipulating the definitions and axioms, then its truths are arbitrary conventions.'*

  This is the 'fishy' move. It conflates the **origin** of the definitions with the **necessity** of the consequences.

  In Hobbes's view (and indeed in standard geometry), we do stipulate the definitions voluntarily. I choose to define a triangle as a three-sided plane figure. However, once that definition is laid down, I do not have the freedom to decide what properties follow from it. I cannot will that the angles of a Euclidean triangle sum to 190 degrees. The consequences are necessary, not arbitrary.

  The same applies to politics. We voluntarily covenant to create the sovereign (the stipulation). But once that act of authorisation is performed, the obligations of the subject follow necessarily from the logic of the covenant. It is not 'arbitrary' in the sense that the sovereign can simply will anything and make it true; rather, the sovereign's commands are binding *because* of the prior logical structure of the authorisation.

  By attacking (8), you block the inference to (9). You can maintain that political science yields real knowledge (because the consequences are necessary) without accepting that the knowledge is merely arbitrary whim.

  ### The Secondary Ambiguity: Step (6)

  Step (6) claims: *'Having science of a fiction is absurd... there's nothing there to be discovered.'*

  This relies on an ambiguity in the word 'fiction'. If by 'fiction' we mean 'something that does not exist', then Hobbes would agree we cannot have science of it. But Hobbes does not think the commonwealth is a fiction in that sense. It is an *artificial* man, but it is real.

  Furthermore, consider logic or grammar. We construct the rules of logic; in a sense, they are 'made up'. Yet there is a science of logic. There are truths to be discovered (valid inferences) and errors to be corrected (fallacies), even within a system we stipulated. Therefore, the claim in (6) that there is 'nothing to be discovered' in a constructed system is false. You can have a science of chess (game theory), even if the rules are conventional.

  ### Which Step to Give Up?

  To keep (2) and (3) while avoiding the nihilistic conclusion of (9), you should **reject step (8)**.

  You do not necessarily have to abandon (1), though you may need to refine it. The 'maker's knowledge' idea does not imply that *everything* about the object is up to the maker; it implies that the maker knows the *causes*. In geometry and politics, the cause is the definition/covenant. The effects flow necessarily from those causes.

  ### The Cost of This Repair

  If you take this route, you must accept a specific limitation on Hobbes's political science.

  1.  **Hypothetical Necessity:** You must concede that political science is hypothetical. It tells you: *'If* you desire peace and self-preservation, *then* you must covenant and obey the sovereign.' It does not necessarily prove that everyone *ought* to desire peace in a moral sense, only that given human nature (which Hobbes treats as a fixed parameter, like the axioms of geometry), this is the necessary solution.
  2.  **No Mind-Independent Morality:** You cannot claim Hobbes is discovering moral truths that exist 'out there' in the universe (like a Platonist might). The truths are binding because we constructed the system to bind us. This might feel less robust than a divine command theory, but for Hobbes, it is the only way to secure certainty.

  ### Summary for Your Seminar

  When you discuss this, you might say:

  > 'The hand-out argument fails at step (8) because it equivocates on "arbitrary". While the *foundations* of geometry and politics are stipulated by us, the *consequences* are not. Once we define the triangle or the covenant, the resulting truths are necessary and discoverable, not subject to further whim. Therefore, we can have a science of politics (preserving 2 and 3) that is certain without being merely arbitrary (rejecting 9).'

  This allows you to keep the core Hobbesian insight — that we know the civil world because we made it — without accepting that the knowledge is illusory.

  ### A Note on Spelling and Usage

  As your tutor is strict, ensure your written work adheres to British conventions. Specifically:
  *   Use **-ise** endings rather than **-ize** (e.g., *analyse*, *realise*, *organise*), unless your department specifically mandates Oxford spelling.
  *   Use **-ce** for nouns and **-se** for verbs where applicable (e.g., *defence*, *licence* vs. *defend*, *license*).
  *   Ensure you write **'whilst'** or **'amongst'** if it fits the flow, though 'while' and 'among' are acceptable.
  *   Check that you are using **single quotation marks** for terms within sentences, as is common in British academic style.

  Good luck with the seminar. It is a tricky text, but spotting that conflation of 'stipulated' and 'arbitrary' is the key to unlocking it.
