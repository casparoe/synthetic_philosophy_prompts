          *   *Analysis:* "Information and entropy are ultimately the same thing" is a strong claim. They are mathematically isomorphic (Shannon vs. Boltzmann/Gibbs) but conceptually distinct until linked via statistical mechanics. "Same thing measured two ways" is okay for pop sci but slightly loose.
