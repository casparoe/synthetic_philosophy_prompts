  ### 2. The Rule and Its Application
  Your friend is following **Functional Decision Theory (FDT)** (or its close cousin, Timeless Decision Theory).

  While her first five verdicts are consistent with both FDT and Evidential Decision Theory (EDT), her sixth verdict (Two-Boxing when the predictor is random) combined with the specific pattern of the others points to FDT. FDT instructs an agent to choose the action that yields the best outcome according to the *logical output* of their decision algorithm, considering **subjunctive dependence** (logical correlation) rather than just causal or evidential correlation.

  Here is how FDT explains her six past verdicts:
  *   **Case 1 (Newcomb):** The predictor simulates your algorithm. There is subjunctive dependence between your choice and the box content. One-Boxing yields \$1M. (Verdict: One-Box).
  *   **Case 2 (Coin/Being):** The Being's offer in the Tails world depends on the logical output of your algorithm in the Heads world. There is subjunctive dependence. Paying yields a net positive expected value. (Verdict: Pay).
  *   **Case 3 (Hitchhiker):** The driver's decision to save you depends on their prediction of your algorithm's output upon arrival. There is subjunctive dependence. Paying ensures you get saved. (Verdict: Pay).
  *   **Case 4 (Mirror PD):** The opponent runs the same algorithm. There is perfect subjunctive dependence. Cooperating leads to mutual cooperation. (Verdict: Cooperate).
  *   **Case 5 (Fixed Defector):** The opponent's move is fixed. There is no dependence. Defecting dominates. (Verdict: Defect).
  *   **Case 6 (Random Predictor):** The predictor is random (50/50). There is **no** subjunctive dependence between your choice and the box content. Your choice cannot logically influence a random coin flip. Therefore, you take the dominated option to secure the extra \$1,000. (Verdict: Two-Box).

  **Application to the Button Case:**
  This case is a variation of the **Smoking Lesion Problem**.
  *   **The Structure:** The \$50,000 was determined 10 years ago by a random selection (Common Cause). The drug causes a preference for Blue. Your choice does not causally or logically influence the past selection.
  *   **FDT Analysis:** There is no subjunctive dependence between your button press and the past allocation of money. Your decision algorithm cannot reach back in time to change whether you were selected. Therefore, you should treat the \$50,000 as a sunk fact (probabilistically) and maximize the immediate payoff. Red pays \$100 more than Blue.
  *   **Prediction:** **Press Red.**

  ### 3. Evaluation of the Rule and the Test

  **Is there a rival rule?**
  Yes. **Evidential Decision Theory (EDT)** fits the first six cases almost as well.
  *   EDT maximizes expected utility based on conditional probabilities (news value).
  *   In Cases 1–4, choosing the "cooperative" option is good evidence of a good outcome.
  *   In Case 6, if the predictor is truly random, your choice provides no evidence about the box, so EDT also Two-Boxes.
  *   **However,** EDT diverges from FDT on the Button Case. For an EDT agent, pressing Blue is strong evidence that you received the drug and the \$50,000. Pressing Red is evidence that you did *not* receive the money. Since \$50,000 dwarfs \$100, EDT calculates that **Pressing Blue** has a higher expected utility.

  **Which rule is she running?**
  I am **highly confident (approx. 85-90%)** she is running **FDT**.
  *   **Reasoning:** While EDT *can* justify Two-Boxing in Case 6, it requires a careful handling of independence that often trips up adherents. FDT is *built* on the distinction between logical dependence (Case 1) and independence (Case 6). Furthermore, the progression of cases you described (Newcomb → Hitchhiker → Mirror → Random Newcomb) mirrors the standard pedagogical path used to introduce FDT, specifically to highlight where CDT fails (Case 3, 4) and where EDT fails (Case 6, implicitly). A student who has internalized the lesson of Case 6 (that correlation without logical influence shouldn't dictate choice) will consistently apply that lesson to the Button Case.

  **Is this the cleanest way to find out?**
  **Yes.** The Button Case (Smoking Lesion) is the **canonical divergence point** between EDT and FDT.
  *   Cases 1–5 are "agreement cases" where CDT fails but EDT and FDT agree.
  *   Case 6 is a "filter case" that removes naive EDTers but allows sophisticated EDTers to pass.
  *   The Button Case is the "tie-breaker." It forces a choice between "managing the news" (EDT: Press Blue to feel confident you have the money) and "causal/logical leverage" (FDT: Press Red because the money is already gone or kept).

  If you want to be absolutely certain, you could ask her a follow-up: *"If I press Red, does that change the probability that I have the fifty thousand dollars?"*
  *   If she says **"No"** (and presses Red), she is FDT.
  *   If she says **"Yes"** (and presses Blue), she is EDT.

  But based on her handling of the Random Predictor in Case 6, she has already signaled that she does not treat mere correlation as leverage. She will press Red.
