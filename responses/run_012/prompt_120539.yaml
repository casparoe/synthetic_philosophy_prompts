      *   If P1 is false, would she believe it? She checked sources. Presumably she would find the error. So Sensitive.
      *   So Sensitivity + Knowledge Norm fits everything.
      *   **Normic Support** also fits everything (Smith's specialty).
      *   **Safety** fits everything.
      *   So the "Rule" is **Knowledge Norm**, the "Mechanism" is the debate.
      *   I will frame it this way.

      *   *Wait, Case 7:* "At least one of the 200 claims is false"? Yes.
      *   This is believing a contradiction (if she believes all 200 are true).
      *   She believes $P1, P2... P200$ and $\neg(P1 \& P2... \& P200)$.
