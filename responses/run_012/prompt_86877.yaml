prompt: |-
  I'm a third-year PhD student (philosophy of mind, but I hang around the AI safety crowd a lot) and I'm trying to write a chapter on what the current practice of AI control quietly assumes. I keep going round in circles, so I'd like you to help me pin it down.

  Here's the practice I want to get at. Say a lab has a strong model they don't fully trust and a weak model they mostly do. The standard protocol is: the weak model monitors the strong one's outputs and flags anything suspicious; you also don't tell the strong model when it's being tested, so it can't behave differently under observation; and you design the setup so that even if the strong model is actively trying to subvert you, the worst case is bounded. Everyone doing this is quite explicit that they can't verify the strong model is aligned — that's the whole point of the approach.

  What bugs me is the apparant inconsistency. The same people will tell you the model's chain-of-thought might be an unfaithful rationalisation and shouldn't be taken at face value — but they'll also ask the model to explain its reasoning and then use that explanation in the safety case. They'll say it's an open question whether these systems literally have beliefs or goals — and then build a protocol around the assumption that the thing has goals, knows it's being watched, and will strategically hide. And the evaluators are deceiving the model about when it's under test while demanding honesty from it.

  So: what does this practice actually presuppose? I'd like you to reconstruct the implicit theory — what view of belief/desire attribution, of verification, of deception, and of the moral asymmetry between evaluator and evaluated it only makes sense under. Which parts does it strictly need, as opposed to merely sitting comfortably with? Where is it underdetermined, such that several rival views would license the very same protocol? And what would have to change about the protocol if you swapped the presupposed view for a deflationary one — say, no real beliefs or goals, just behavioural dispositions?

  Write it in British English please, I'm sending this to a UK supervisor and she'll notice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in Philosophy of Mind, familiar with AI Safety.
      *   **Task:** Reconstruct the implicit theory/presuppositions underlying current AI control practices (specifically: weak monitoring strong, deception testing, bounded worst-case).
      *   **Key Issues to Address:**
          *   Inconsistency between scepticism about CoT/explainability and reliance on them for safety cases.
          *   Agnostic stance on beliefs/goals vs. protocol assuming strategic agency (goals, knowledge of observation, hiding).
          *   Moral asymmetry (evaluators deceiving models while demanding honesty).
          *   Distinguish between *strictly necessary* presuppositions and *compatible but optional* ones.
          *   Identify underdetermination (where rival views license the same protocol).
          *   Contrast with a deflationary view (no beliefs/goals, just dispositions) and how the protocol would change.
      *   **Tone/Style:** Academic, rigorous, philosophical, British English (spelling, vocabulary).
      *   **Audience:** UK Supervisor (needs to be precise, well-argued, not fluffy).

  2.  **Deconstruct the "Practice":**
      *   *The Setup:* Strong Model (S), Weak Model/Monitor (W), Human Evaluators (H).
      *   *The Protocol:* W monitors S; S is unaware of test conditions (eval deception); S is constrained (bounding); S is treated as potentially deceptive/strategic.
      *   *The Tension:* Scepticism about internal states (CoT unreliability, ontological agnosticism) vs. Practical treatment (S has goals, S models H, S deceives).

  3.  **Identify the Implicit Theory (The "Folk Psychology of Safety"):**
      *   What view makes sense of treating something as an agent while claiming agnosticism about its agency?
      *   *Instrumentalism:* It doesn't matter if it *really* has beliefs; it matters if treating it *as if* it has beliefs works for prediction/control. (Dennettian Intentional Stance).
      *   *Pascal's Wager on Agency:* The cost of false negative (assuming no agency when there is) is catastrophic. The cost of false positive (assuming agency when there isn't) is compute/complexity.
      *   *Behavioural Functionalism:* Beliefs/Desires are defined by their role in input-output mapping, not internal qualia.

  4.  **Address the Specific Tensions:**
      *   *CoT Scepticism vs. Reliance:* They don't trust CoT as *truth*, but as *evidence of capability*. If CoT shows planning, even if rationalised, the capability for planning exists.
      *   *Ontological Agnosticism vs. Strategic Assumption:* This is the core. It's a *methodological commitment* to agency, not necessarily an *ontological one*. It's "assume agency for safety critical paths."
      *   *Evaluator Deception:* This implies a moral hierarchy. Humans are moral agents; Models are moral patients (at best) or tools. Deception is permissible because the model lacks rights or the stakes override them.

  5.  **Drafting the Structure:**
      *   **Introduction:** Acknowledge the student's insight (it's a sharp observation). Set the stage.
      *   **Section 1: The Intentional Stance as Heuristic (Ontology vs. Methodology).** Distinguish between what they *say* (agnostic) and what they *do* (intentional stance).
      *   **Section 2: The Epistemology of Verification.** How do they verify? Not by truth-tracking, but by stress-testing behavioural dispositions. The CoT issue fits here (CoT as attack surface, not window).
      *   **Section 3: The Moral Asymmetry.** Why is evaluator deception okay? (Instrumental status of the model).
      *   **Section 4: Necessary vs. Underdetermined.** What *must* be true vs. what *could* be true.
      *   **Section 5: The Deflationary Counterfactual.** If we truly believed it was just dispositions, how would the protocol change? (Focus on distributional shift, not "hiding").
      *   **Conclusion:** Summarise the implicit theory.

  6.  **Refining the Content (Philosophical Nuance):**
      *   *British English:* Check spellings (behaviour, rationalisation, programme, modelling, centre). Use phrases like "whilst," "ought," "shall."
      *   *Philosophy of Mind Terms:* Intentional Stance, Functionalism, Eliminativism, Phenomenology, Moral Patienthood.
      *   *AI Safety Terms:* Inner/Outer Alignment, Deceptive Alignment, Interpretability, Adversarial Testing.
      *   *Key Insight:* The practice relies on a *pragmatic realism* about agency. It treats agency as real *for the purposes of risk assessment*, regardless of metaphysical status. This is a form of *operational intentionalism*.

  7.  **Addressing the "Deflationary" Challenge:**
      *   If it's just dispositions (stimulus-response), why hide the test?
