  **The Scenario**

  For two hundred pages, Mara has maintained her widowed mother's Victorian house while waiting for it to sell, caring for her brother Julian who lives there rent-free. She polishes the family silver every Friday evening without fail. She has canceled dates to do it, scolded Julian for handling it with dirty hands, and refused offers to sell the set to collectors. The house is now empty; the furniture is gone, the sale closes tomorrow, and Julian moves to an apartment Monday. It is Friday. Julian is asleep on the floor amidst packing tape, exhausted. There will be no dinner, no guests, and the silver is already boxed for the movers. Mara stands in the kitchen, holding the polishing cloth. She is tired, her deliberation capacity is at its daily limit, and the movers arrive at 8:00 AM. She looks at the cloth, looks at the box, and acts.

  **The Two Preference Structures**

  1.  **The Ritualist (Order as End):** Mara values the *maintenance of the standard itself*. The world is better when the silver is polished, regardless of who sees it or uses it. The act of care is the utility.
  2.  **The Hostess (Order as Means):** Mara values the *readiness of the home for habitation*. The world is better when the house is prepared for people. Polishing is only valuable insofar as it serves a future meal or guest.

  **Observed Behavior (Pages 1–200)**

  *   **The Canceled Date:** Mara stays home to polish instead of going out.
      *   *Ritualist:* Predicted. The standard must be maintained on Friday.
      *   *Hostess:* Predicted. Guests might arrive; the house must be ready.
  *   **The Scolding:** Mara reprimands Julian for touching the tray.
      *   *Ritualist:* Predicted. Dirty hands degrade the standard.
      *   *Hostess:* Predicted. Dirty hands soil the tray for future guests.
  *   **The Refusal to Sell:** Mara rejects a collector's offer.
      *   *Ritualist:* Predicted. The set must remain intact to be maintained.
      *   *Hostess:* Predicted. The set is needed for the household's future function.

  *Check:* In every prior instance, the *Standard* and the *Function* were correlated. To keep the house ready (Hostess), one had to maintain the standard (Ritualist). To maintain the standard, one had to keep the house ready. The actions cancel out; the motive is invisible.

  **The Final Scene Prediction**

  *   **If Ritualist:** Mara polishes the silver. Even though it goes straight into a box, even though no one will eat off it, the Friday standard must be met. She places the shining tray into the dark box.
  *   **If Hostess:** Mara puts the cloth away. There is no dinner, no guests, and the house is ceasing to function. Polishing is waste. She leaves the tarnish on the tray and tapes the box shut.

  **Structural Feature Doing the Work**

  The divergence relies on the **decoupling of Instrument and End**. For 200 pages, the Silver's Shine (Instrument) and the House's Readiness (End) were locked together. In the final scene, the House's Readiness is reduced to zero (no one will live there), but the Instrument remains actionable.

  This addresses your hypothesis about optimization: A perfectly optimizing agent with infinite deliberation time might calculate that "polishing yields 0 utility" for the Hostess and "polishing yields 1 utility" for the Ritualist, and act accordingly. However, to ensure the scene reads as *character* rather than *calculation*, the divergence is triggered by **cognitive load** (Constraint 6 & 7). Mara is too tired to recalculate the utility of the act from scratch. She defaults to her **heuristic**.
  *   Ritualist Heuristic: "It is Friday; I polish."
  *   Hostess Heuristic: "Is there a dinner? No; I stop."
  The equivalence breaks not because she makes a mistake, but because her fatigue forces her to rely on the underlying preference structure directly, bypassing the contextual justification that previously masked it.

  **The Counter-Argument**

  A defender of the **Hostess** hypothesis (who sees Mara put the cloth away) would attack the case by arguing: *"She isn't stopping because she doesn't value readiness; she is stopping because the buyers prefer the house 'as-is' and polishing might look like a cover-up."*
  **What Remains:** This defense fails against the specific prose execution if the reader sees Mara look at the *box*, not the *buyers*. If she polishes a piece she knows is being boxed immediately, the "buyer perception" argument collapses. The action must be private. If she polishes it alone, the only audience is the standard itself.

  A defender of the **Ritualist** hypothesis (who sees Mara polish) would argue: *"She polishes it so Julian has a memory of dignity to take with him."*
  **What Remains:** This fails if Julian is asleep and never sees it. If the action is truly unobserved and functionally useless, the "dignity" argument becomes a post-hoc rationalization. The prose must emphasize the silence and the solitude.

  **Feasibility Check**

  All specifications can be met, but **Constraint 5** requires the clarification provided above. You suggested the equivalence breaks when she "falls short of perfect optimization." Strictly speaking, if she falls short (makes an error), the reader might attribute the action to noise rather than motive. To make it an "honest revelation," the structure must be that **fatigue forces reliance on preference-specific heuristics**, not that fatigue causes errors. The divergence comes from *which shortcut she takes*, not that she took a shortcut. If you write it as a mistake, it feels like a cheat. If you write it as a habit revealed under pressure, it feels like truth.
