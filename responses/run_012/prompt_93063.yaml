answer: |-
  **1. Examination Question**

  **Question 1 (20 Marks)**

  Read the following two cases carefully.

  Case one. Mira is the assistant house manager at a large theater. Fifteen minutes before a sold-out performance the fire alarm sounds. It is in fact a false alarm, but no one in the building knows that yet, and the lobby is packed. Mira takes up the microphone and announces, "Everyone will get out of this building unharmed." She believes this. She does not know it: whether the crowd stays calm depends on how it takes her announcement, and about that she has only a well-grounded expectation, drawn from her training and from the way comparable crowds have behaved in drills, that a calm voice will be met with a calm response. What she cannot know is that her announcement is the thing that will save them. Had she said nothing, the crowd would have surged toward the north doors, one of which would have jammed under the crush, and people would have been badly hurt. Because she spoke, the crowd leaves in order and no one is hurt. Her announcement is true, and it is true because she made it.

  Case two. In a second theater, on another night, the same sentence is spoken by Tomás, a visiting producer with no relevant experience, who says it aloud on a hunch, with no evidence whatever, mainly to steady his own nerves. The exits in his theater are already clear, the crowd was never in danger, no one is hurt, and his sentence is true for reasons that have nothing to do with his having uttered it. He believes what he says; he does not know it; and what he says is true.

  Using these cases, evaluate the candidate norms of assertion (Truth, Belief, Justification, Knowledge). Specifically, argue whether the norm governing assertion must be epistemic rather than merely alethic. In your analysis, you must address when the norm is to be applied, given that the truth of the first utterance was not settled at the moment of utterance but was brought about by it. Finally, consider whether either utterance is, strictly speaking, an assertion at all.

  ***

  **2. Model Answer**

  The pair of cases demonstrates that a merely alethic norm (Truth) is insufficient for assertion, while suggesting that standard epistemic norms (Knowledge) require modification to handle self-fulfilling prophecies.

  Tomás's case decisively refutes the Truth Norm. If truth were the only requirement, Tomás's utterance would be proper. However, intuition suggests his assertion is improper because it relies on luck rather than competence. He lacks evidence and knowledge. This aligns with the settled consensus in the literature: truth is necessary but not sufficient. A norm of assertion must be epistemic, requiring some connection between the speaker and the truth beyond mere coincidence. Therefore, both Mira and Tomás fail a Knowledge Norm at the moment of utterance, as neither knows the proposition is true.

  However, Mira's case complicates the application of epistemic norms. If the norm is applied strictly at the moment of utterance, Mira violates it, just like Tomás. Yet, Mira's utterance is intuitively proper, even praiseworthy, whereas Tomás's is not. This suggests the norm cannot be static. In Mira's case, the truth is causally dependent on the assertion. This self-fulfilling structure implies that the norm must be applied relative to the speaker's evidence regarding the *consequences* of speaking, not just the independent truth of the content. Mira has justification regarding the efficacy of her command, even if she lacks knowledge of the outcome. This supports a Justification Norm over a strict Knowledge Norm, or alternatively, a Knowledge Norm that allows for "practical knowledge" in interventionist contexts.

  This leads to the question of timing. If we assess the norm retrospectively, Mira passes and Tomás fails. But norms of assertion are typically constitutive rules governing the act *as it is performed*. If we insist on assessment at the moment of utterance, we must concede that Mira asserts without knowledge. Proponents of the Knowledge Account might argue Mira possesses a form of contextual knowledge based on her training, but this stretches the definition. A more robust solution is to recognize that the norm governs the propriety of the move based on available evidence at *t*, acknowledging that some assertions create their own truth conditions.

  Finally, we must confront whether these are assertions. Assertions aim to convey information about independent facts. Mira's utterance functions more as an exhortation or a performative command; she is not describing a pre-existing state but creating one. Tomás's utterance is a confession of hope, not a claim to fact. If neither is a genuine assertion, the norms of assertion do not apply. However, both use declarative syntax ("Everyone will..."). If we classify them as assertions, we must accept that assertion norms cover predictive and performative uses. If we classify them as non-assertoric speech acts, the cases dissolve, but this avoids the philosophical problem rather than solving it.

  Verdict: The cases support an epistemic norm over an alethic one, as truth alone cannot distinguish Mira from Tomás. However, the Knowledge Norm is too rigid for Mira unless modified to account for self-fulfilling contexts. A Justification Norm, sensitive to the speaker's evidence regarding the causal impact of their speech, best captures the intuition that Mira is proper while Tomás is not. The timing of assessment must remain at the moment of utterance, but the content of the justification must include the efficacy of the speech act itself.

  ***

  **3. Marking Scheme**

  **Total: 20 Marks (5 Points × 4 Marks)**

  **1. Refutation of the Truth Norm (Alethic)**
  *   **Requirement:** Student must use Tomás to show that truth alone is insufficient because lucky guesses are improper assertions.
  *   **Characteristic Error:** Claiming Tomás's assertion is proper because it turned out true, or failing to distinguish necessity from sufficiency.

  **2. Defense of an Epistemic Norm**
  *   **Requirement:** Student must argue that some epistemic standing (Justification or Knowledge) is required to distinguish Mira's propriety from Tomás's impropriety.
  *   **Characteristic Error:** Arguing that belief alone is sufficient, ignoring that both subjects believe but differ in propriety.

  **3. Timing and Self-Fulfilling Structure**
  *   **Requirement:** Student must address that Mira's truth was created by the utterance, arguing whether the norm applies at *t*(utterance) or *t*(outcome), and how this affects the evaluation.
  *   **Characteristic Error:** Ignoring the causal loop and treating Mira's proposition as a standard prediction about independent facts.

  **4. Classification of Speech Act**
  *   **Requirement:** Student must consider whether these are assertions at all (vs. exhortations/predictions) and explain the consequence of this classification for the applicability of assertion norms.
  *   **Characteristic Error:** Assuming without argument that both are definitely assertions, or dismissing the cases entirely because they are "not really" assertions.

  **5. Critical Synthesis and Verdict**
  *   **Requirement:** Student must reach a definite conclusion on which norm best fits the cases (e.g., Justification over Knowledge) while acknowledging live disputes (e.g., whether Knowledge accounts can accommodate Mira).
  *   **Characteristic Error:** Merely sorting the cases into existing accounts without evaluating which account is superior or pretending the cases settle all disputes definitively.
