answer: |-
  ### Argument for the Lexical Priority of Condemnation Risk

  **1. The Case for Priority**
  The distinction between shortfall risk and condemnation risk maps onto a fundamental asymmetry in moral phenomenology and structure. Shortfall risk concerns *gradient* failure: doing less good than one could have. Condemnation risk concerns *categorical* failure: doing what one ought not to do at all. My argument rests on the claim that these two kinds of failure are not fungible.

  1.  Moral theories classify actions as either permissible or impermissible, where impermissibility constitutes a categorical failure distinct from mere suboptimality.
  2.  Under moral uncertainty, an agent faces both the risk of categorical failure (condemnation) and the risk of gradient failure (shortfall).
  3.  Categorical failures are not compensatable by additive moral value gained within or across theories.
  4.  Rational choice under uncertainty requires prioritizing the avoidance of non-compensatable errors over the optimization of compensatable values.
  5.  This priority holds provided the agent assigns non-zero credence to at least one theory that distinguishes prohibition from suboptimality.

  Premise 3 is the load-bearing claim. If violating a constraint were merely a negative value to be weighed against positive value, expected moral value maximization would suffice. But constraints function as side-constraints or barriers; they are not merely weights on a scale. When uncertain, you cannot trade a probability of breaking a barrier against a probability of building a higher tower. The risk of moral corruption or rights violation (condemnation) is qualitatively different from the risk of inefficiency (shortfall).

  This view requires the restriction in Premise 5. If an agent assigns 100% credence to maximizing consequentialism, then every suboptimal act is impermissible, and condemnation risk absorbs shortfall risk. In that specific case, the distinction collapses, and the priority rule yields the same verdict as expected value maximization (since all options carry condemnation risk except the optimal one). The argument gains traction only when the credence distribution includes theories that allow for supererogation or satisficing, creating a genuine gap between what is forbidden and what is merely less than best.

  **2. Intertheoretic Comparisons**
  The view leverages a specific asymmetry in comparability. Credences (probabilities) are naturally comparable across theories; a 10% credence in Theory A is on the same scale as a 10% credence in Theory B. Moral values (utils, rights, virtues) are not obviously intertheoretically comparable; one theory's "unit of good" may not trade against another's.

  By prioritizing condemnation risk, we rely on the probability of impermissibility, which is a common currency (0 to 1). We avoid the need to compare the *magnitude* of value across theories. However, there is a hidden cost. This maneuver treats "impermissible" as a binary flag, ignoring that one theory's prohibition (e.g., lying) might be less severe than another's (e.g., killing). By focusing on the *probability* of any condemnation, we lose sensitivity to the *severity* of condemnation. We treat a 1% risk of murder the same as a 1% risk of a minor lie, provided both are flagged as impermissible. The gain in comparability comes at the cost of granularity.

  **3. Objections and Replies**

  (a) **Paralysis:** If the agent takes many theories seriously, every option may be forbidden by some theory, leaving the safe set empty.
  *Reply:* When the safe set is empty, the agent must minimize the probability of condemnation rather than eliminating it. This creates a secondary lexical tier where some condemnation risks are acceptable if they are sufficiently low.
  *Residual Cost:* Concedes that lexical priority is not absolute but degrades into risk minimization under conflict.

  (b) **The Threshold Problem:** "Non-negligible" is vague; does the view let low-confidence theories veto high-confidence options?
  *Reply:* The threshold is context-sensitive, akin to "beyond reasonable doubt," scaling with the severity of the potential prohibition. This vagueness is a feature of practical reasoning, not a bug.
  *Residual Cost:* Concedes that the view lacks a precise algorithmic formula for all cases.

  (c) **Prohibition-Heavy Theories:** A theory that forbids nearly everything, or one gerrymandered into many duplicates, seems to acquire outsized power.
  *Reply:* Epistemic norms like Occam's razor should reduce credence in complex or gerrymandered theories, neutralizing their veto power. The agent's credences should reflect theoretical virtue, not just moral content.
  *Residual Cost:* Concedes reliance on non-moral epistemic norms to regulate moral decision rules.

  (d) **Maximin Disguise:** Is this just risk-aversion or maximin, inheriting defects like insensitivity to probability?
  *Reply:* It is not pure maximin because optimization occurs within the safe set, respecting probabilities of value once safety is secured. However, it does inherit sensitivity to how options are individuated regarding their prohibition status.
  *Residual Cost:* Concedes sensitivity to irrelevant descriptions of the option set remains.

  (e) **The Collapse Worry:** If the true theory is consequentialism, condemnation risk is zero for the optimal act and high for others, making the view depend on the agent's credence distribution.
  *Reply:* The view is explicitly indexed to the agent's uncertainty; if credence is homogeneous, the view collapses to standard maximization, which is correct for that epistemic state. The view's content is supposed to depend on the diversity of theories entertained.
  *Residual Cost:* Concedes the view has no grip on agents with homogeneous credence distributions.

  **4. Defeat Conditions**
  The position would be defeated if:
  1.  It is demonstrated that all moral disvalue is fungible and additive, rendering categorical constraints illusory.
  2.  Robust intertheoretic value comparison becomes available, allowing shortfall to be weighed directly against condemnation.
  3.  The agent's credence distribution contains only maximizing consequentialist theories, eliminating the distinction between shortfall and condemnation.

  **5. Worked Case**
