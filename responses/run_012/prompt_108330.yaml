  **Priority Verdict:** Choose Option B.
  **Expected Value Verdict:** Choose Option A (assuming 100 lives outweighs the risk-weighted cost of rights violation).
  **Which Is Right:** Priority Verdict.
  **Why:** Violating rights under uncertainty is categorically worse than losing utility.

