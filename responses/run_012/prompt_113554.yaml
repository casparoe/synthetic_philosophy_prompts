answer: |-
  Here is the specification for an adequate theory of verbal disputes, designed to serve as the foundational handout for your seminar.

  ### Desiderata for a Theory of Verbal Disputes

  1.  **Extensional Adequacy**
      *   **Requirement:** The theory must correctly classify the full range of candidate cases, from benign taxonomic queries (is a tomato a fruit?) to hard ontological disputes (do tables exist?) to high-stakes contractual or political conflicts (is a burrito a sandwich under this lease? is a fetus a person under this statute?).
      *   **Motivation:** A theory that dissolves the statue/lump dispute but cannot account for the legal dispute is too narrow for general application. Conversely, a theory that treats the lease dispute as identical to the ontological dispute ignores the coercive power of the state in the former. The theory must map the topology of the terrain, not just one region of it.

  2.  **Normative Discrimination**
      *   **Requirement:** The theory must distinguish between *verbal* disputes where at least one party is at fault (equivocation, obfuscation, carelessness) and those where no one is at fault (innocent dialectical divergence, legitimate conceptual pluralism).
      *   **Motivation:** Calling a dispute "verbal" is often an accusation of wasting time. But sometimes two reasonable speakers use the same word with different, equally valid precisifications. If the theory cannot distinguish malicious equivocation from innocent polysemy, it cannot guide us on whether to admonish the participants or accommodate them.

  3.  **Factual Invariance**
      *   **Requirement:** The theory must specify the relationship between linguistic disagreement and non-linguistic agreement. It must state whether a dispute can be diagnosed as verbal if the parties disagree on empirical facts, or if agreement on all non-linguistic facts is a necessary condition for the diagnosis.
      *   **Motivation:** The classic test (often attributed to Hirsch or Chalmers) is: "If they agreed on the language, would they agree on the truth?" But in live disputes, parties often disagree on the facts *because* they disagree on the concepts (e.g., "He didn't *assault* me" vs. "He touched me"). A theory that requires prior factual agreement may never be able to diagnose a dispute as verbal, rendering it practically useless.

  4.  **Action-Guidance**
      *   **Requirement:** The diagnosis must yield a specific practical recommendation: to **dissolve** the dispute (stop talking), **pursue** it (it is substantive), or **reframe** it (change the vocabulary to resolve the impasse).
      *   **Motivation:** This seminar has a practical aim. Identifying a dispute as verbal is not an end in itself; it is a triage mechanism. If the theory identifies a dispute as verbal but offers no advice on whether to abandon the terms or fight for a specific definition, it fails the pragmatic test.

  5.  **Substantive Neutrality**
      *   **Requirement:** The criteria for verbalness must not entail the falsity of one side of the substantive dispute by definition. The theory cannot rule out the existence of tables *a priori* simply by defining "table" in a way that makes existence impossible or trivial.
      *   **Motivation:** If a theory of verbal disputes is weaponized to settle metaphysical debates before they begin (e.g., "All ontological disputes are verbal, therefore nihilism wins"), it is question-begging. It earns its keep by clarifying the disagreement, not by declaring a winner based on semantic stipulation.

  6.  **High-Stakes Sensitivity**
      *   **Requirement:** The theory must accommodate cases where the "verbal" dispute is the only vehicle for a real grievance, particularly in legal and political contexts. It must explain why some verbal disputes are worth having.
      *   **Motivation:** In a lease dispute or a human rights debate, the fight over the word *is* the fight over the resources or rights. To dismiss these as "merely verbal" is to dismiss the grievance. The theory must distinguish between empty logomachy and consequential conceptual engineering.

  ***

  ### The Self-Application Requirement

  You asked first for the theory's ability to turn its lens upon itself. This is the **Reflexive Stability** condition.

  An adequate theory must be able to classify disputes about its own criteria. If we argue over whether *your* desideratum of "Substantive Neutrality" is itself a neutral requirement, is *that* dispute verbal?

  *   **The Risk:** If the theory claims "All metaphysical disputes are verbal," it must account for the metaphysical status of *that* claim. If the claim is true, is it itself a verbal claim? If so, why should we accept it? If it is substantive, then not all metaphysical disputes are verbal, and the theory is false.
  *   **The Verdict:** Most theories fail this. They treat the diagnosis of verbal disputes as a "view from nowhere"—a substantive meta-ontological position that claims immunity from being diagnosed as verbal. To meet this requirement without swallowing itself, the theory must be **pragmatic rather than dogmatic**. It must admit that the claim "Dispute X is verbal" is itself a move in a language game, justified by its utility (per Desideratum 4), not by its correspondence to a language-independent reality. It avoids self-defeat by not claiming to be the One True Theory of Disputes, but rather a tool for managing specific communicative breakdowns.

  ***

  ### Jointly Unsatisfiable Desiderata (The Tensions)

  You asked to flag the pairs of desiderata that look jointly unsatisfiable. There are two critical tensions here that will drive your seminar's discussion.

  **1. Substantive Neutrality vs. Critical Bite**
  *   **The Tension:** Desideratum 5 demands the theory not decide the dispute in advance. But Desideratum 2 (Normative Discrimination) and 4 (Action-Guidance) demand the theory have critical bite—i.e., tell one party they are confused or speaking nonsense.
  *   **The Conflict:** To tell a metaphysical realist that their dispute with an anti-realist is "verbal" is often to tell the realist they are wrong (or at least, that their question is ill-formed). If the theory has enough teeth to dissolve the dispute, it usually violates neutrality by privileging one conceptual scheme over another. If it remains truly neutral, it lacks the power to recommend dissolution.
  *   **Seminar Question:** Can a theory be a referee without being a player?

  **2. The Defect Condition vs. High-Stakes Sensitivity**
  *   **The Tension:** Traditionally, diagnosing a dispute as "verbal" marks it as defective (a waste of time, Desideratum 4). But Desideratum 6 requires us to acknowledge that some verbal disputes (law, politics) are essential and valuable.
  *   **The Conflict:** If "verbal" means "defective," then legal interpretation is defective. If "verbal" means "about words," then the category is so broad it loses its critical utility. The theory must reconcile the idea that a dispute can be *about language* without being *merely* about language.
  *   **Seminar Question:** Is "merely verbal" a coherent category, or is it a rhetorical weapon used to silence political opponents?

  ***

  ### Assessment of Existing Families of View

  Here is a brief assessment of how the main contenders strain against these desiderata.

  **1. The Carnapian / Logical Positivist View**
  *   *Core:* Disputes are verbal if they violate the rules of a linguistic framework; external questions are meaningless.
  *   *Fails:* **Substantive Neutrality** and **High-Stakes Sensitivity**. It dismisses metaphysics as nonsense (deciding the dispute by fiat) and cannot account for political disputes where the "framework" itself is the site of struggle. It has high Critical Bite but zero Neutrality.

  **2. The Chalmersian / Scrutability View**
  *   *Core:* A dispute is verbal if it would be resolved by agreeing on a canonical base vocabulary (scrutability base).
  *   *Fails:* **Factual Invariance** and **Self-Application**. It assumes parties can agree on the non-linguistic base, which is often the point of contention. Furthermore, the claim that there *is* a scrutability base is itself a substantive metaphysical claim, risking reflexive instability.

  **3. The Hirschian / Quantifier Variance View**
  *   *Core:* Disputes are verbal when parties assign different meanings to quantifiers (e.g., "there exists"), but both meanings are equally valid.
  *   *Fails:* **Normative Discrimination**. By treating both sides as speaking "equally good" languages, it struggles to identify cases of fault or confusion. It also strains against **Action-Guidance**: if both are right in their own language, why reframe? Why not just let them talk past each other?

  **4. The Thomassonian / Deflationist View**
  *   *Core:* Existence questions are trivial if application conditions are met; disputes arise from misunderstanding these conditions.
  *   *Fails:* **Substantive Neutrality**. It builds existence conditions into the semantics of terms, which effectively decides ontological disputes by semantic stipulation (e.g., "If it looks like a table, 'table' applies, therefore tables exist"). This looks like a victory for common sense, but it is a victory bought by definition.

  **5. The Pragmatist / Political View (e.g., Jenkins, Sutton)**
  *   *Core:* Verbal disputes are tools for social coordination; the label "verbal" is a move to shift power or resources.
  *   *Fails:* **Extensional Adequacy** (on the traditional reading). It struggles to account for "harmless" disputes (tomato/fruit) where no power dynamic is at play. However, it best satisfies **High-Stakes Sensitivity** and **Self-Application** (admitting the theory itself is a tool).

  **Summary for the Seminar:**
  No existing view satisfies all six desiderata comfortably. The Carnapian sacrifices Neutrality for Bite. The Hirschian sacrifices Bite for Neutrality. The Pragmatist sacrifices the idea of a "faultless" dispute for Political Reality. Your seminar's task is not to find the theory that passes all tests, but to decide which desideratum we are willing to relax in exchange for a workable tool.
