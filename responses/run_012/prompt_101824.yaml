answer: |-
  The green LED counter on the far wall reads 4,988. The target is 5,000. In the center of the lab, the centrifuges hum a low, vibrating note that Mara feels in her teeth. She holds a vial of treated water up to the light. It is cloudy, just barely, a suspension of particulate that shouldn't be there.

  Beside her, Kev leans against the bench, watching the clock. It is 3:45 PM. The shift ends at 4:00, but the public number resets at midnight. If they hit 5,000 before then, the floor bonus triggers. Everyone gets the extra credit on their paycheck.

  In the corner, enclosed in soundproof glass, sit the auditors. They are temps, rotating every six weeks. They have their own screen, their own logbook. They measure the private number: accuracy. On paper, the private number is walled off. It cannot touch pay. It cannot touch rank. It is supposed to be the truth that sits behind the lie of the counter.

  Mara looks at the glass booth. The two auditors inside are packing their bags. They do this often on days when the green LED climbs fast. When the line moves quickly, the auditors sample less. They take the easy vials from the front of the queue, the ones that look clear. They leave early.

  When the line slows, when the green number stalls, the auditors stay late. They dig into the backlog. They find clouds like this one. They flag them. The private number dips, marking a defect, but nobody loses money over it. Instead, the floor manager gets a call. The next day, the pressure on the green number increases. The staff works harder. The green number goes up. The auditors go home early. The private number stays clean.

  Mara knows the pattern. She has seen the logbook left open on the scanner glass. High volume days have zero flags. Low volume days have a dozen. The private number is no longer measuring the water. It is measuring the speed of the line. It has become a shadow of the public number, tracking it perfectly, rising and falling with the bonus targets instead of the contaminants.

  "Run it," Kev says. He nods at the vial in her hand. "It's probably just air bubbles. You know how the mixers get when we rush the cycle."

  "It's not air," Mara says. She tilts the glass. The sediment shifts, heavy and gray.

  "4,990," Kev says, reading the wall. "Ten more. We have twenty minutes."

  If she logs the defect, the batch gets quarantined. The counter stops while they reprocess. They won't hit 5,000. The bonus dies. The auditors will stay late tomorrow. They will find more errors. The manager will yell. The private number will drop, but since it doesn't affect pay, nobody cares about the drop itself. They only care about what the drop causes: the pressure on the green number.

  The firewall is supposed to prevent this. The auditors aren't allowed to tell her what they see. They aren't allowed to punish her. But they talk to the manager. The manager talks to the floor. The information leaks through the drywall, through the breakroom gossip, through the way the temps avoid eye contact when the line is moving fast.

  Mara looks at the glass booth. The male auditor inside catches her eye. He zips his bag shut. He picks up his coat. He is leaving. He knows the number is high. He knows his logbook stays clean if he leaves now. He is incentivized to not be there when the truth might slow things down.

  "Run it," Kev says again. His voice is flat. He isn't asking.

  Mara looks at the cloudy water. She looks at the green LED. 4,992.

  She places the vial in the rack for cleared samples. She types the code into the terminal. The machine beeps, a bright, affirmative sound. The counter ticks to 4,993.

  "Why I did it this way"

  I chose a water testing lab because the physical stakes (contamination) contrast sharply with the abstract stakes (numbers), grounding the theory in safety. To avoid the "sad ending" cliché where the system collapses, I focused on the *corruption of the audit itself*. The twist isn't that the staff games the system, but that the auditors (the supposed firewall) game it too by syncing their effort with the public target. I used the visual of the glass booth and the temps leaving early to show the leak without exposition. I was tempted to have Mara refuse or expose the fraud, but that provides a moral release valve. Instead, having her comply emphasizes the inertia of the mechanism; the system doesn't break, it just absorbs the error and continues.
