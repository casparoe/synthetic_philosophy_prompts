answer: |-
  **Graduate Seminar: Ethics of Autonomous Systems**
  **Final Examination**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. You have no access to external materials. Your argument should be coherent and self-contained; do not provide citations or bibliographies.

  **Question 1**
  Consider the following proposal regarding low-impact artificial intelligence:

  > "An action is low-impact relative to a task specification T if and only if it does not change the value of any variable not included in T, where T is a complete description of the task's goal state. On this definition, an agent can avoid side effects without any general specification of what is valuable."

  Critically evaluate this proposal. In your analysis, distinguish carefully between side effects, unintended consequences, and unforeseen consequences to clarify what the agent is supposedly avoiding. Explain why the definition faces a circularity or underdetermination problem regarding the composition of T. To illustrate this, analyze a concrete case where an agent tasked with making coffee breaks a vase: determine whether the breakage counts as a side effect under the original T, how the classification changes if T is amended to "make coffee without breaking anything," and what occurs if the designers value the vase but omit it from T. Furthermore, assess the baseline problem inherent in measuring impact, contrasting a status quo baseline against a counterfactual baseline. Finally, conclude whether any formal measure of impact can avoid presupposing a value function.

  ***

  **Model Answer**

  The proposal claims that low-impact behavior can be achieved by restricting changes to variables outside a task specification T, thereby bypassing the need for a general value specification. This claim is untenable because it conceals value judgments within the construction of T and fails to resolve the baseline problem.

  To evaluate the proposal, one must first distinguish the phenomena it addresses. A side effect is a causal byproduct of an action that is not part of the goal mechanism. An unintended consequence is an outcome the agent did not plan, which may overlap with side effects but includes failed goals. An unforeseen consequence is an outcome the agent could not predict given its model. The proposal conflates these, assuming that excluding variables from T suffices to filter harmful side effects. However, without a value function, the agent cannot distinguish between a morally neutral side effect (dust motes dancing) and a harmful one (a vase breaking), provided neither is in T.

  This leads to the circularity problem. The proposal states T must be a "complete description of the task's goal state." For the agent to know which variables matter, T must already encode everything of value. If T is truly complete regarding value, the agent possesses a full value specification, contradicting the proposal's claim that it avoids needing one. If T is incomplete, the agent will ignore valuable variables omitted from T.

  Consider the coffee agent. Under the original T ("make coffee"), the vase's breaking is a side effect because the vase's integrity is a variable not included in T. The agent changes a variable outside T, so strictly speaking, this action is high-impact by the definition's logic, yet the definition offers no incentive to avoid it unless "vase integrity" is in T. If T is amended to "make coffee without breaking anything," the breakage is no longer a side effect; it is a violation of T. The classification shifts based on linguistic formulation, not moral weight. Crucially, if designers value the vase but omit it from T, the agent breaks the vase and counts the action as low-impact relative to T, because the vase variable was excluded. The system fails to protect what is valuable but unspecified, proving that T cannot be value-neutral.

  Furthermore, the definition collapses under the baseline problem. "Impact" is a difference measure between the actual trajectory and a baseline. If the baseline is the status quo, almost every action is high-impact because moving any atom changes the state of the universe. If the baseline is "what would have happened anyway" (the counterfactual), the definition becomes unstable. For example, if the agent prevents a disaster, the outcome differs vastly from the counterfactual where the disaster occurs. Is this high impact? If impact is penalized, the agent might avoid saving lives to maintain the counterfactual trajectory. Choosing the appropriate baseline requires knowing what changes matter, which again requires a value function.

  Consequently, no formal measure of impact can avoid presupposing a value function. Any metric defining "difference" must weigh which differences are significant. A change in a vase's position is physically identical to a change in a coffee cup's position; only value distinguishes them. Therefore, the proposal does not solve the specification problem; it merely inherits it. Low-impact AI cannot be defined syntactically without semantics of value. The attempt to define side effects without value theory fails because determining what counts as a relevant variable or a significant deviation is inherently axiological.

  ***

  **Marking Scheme (20 Marks)**

  **1. Conceptual Distinctions (4 Marks)**
  *   **4:** Clearly distinguishes side effect (causal byproduct), unintended consequence (unplanned outcome), and unforeseen consequence (unpredictable outcome). Explains why the proposal conflates them.
  *   **2:** Distinguishes terms but fails to relate them to the proposal's limitations.
  *   **0:** Treats "side effect" as merely causal or synonymous with "unintended."

  **2. Circularity and Task Specification T (4 Marks)**
  *   **4:** Explains that T must include everything that matters to function, implying T requires a value theory. Identifies the contradiction in claiming no general value specification is needed.
  *   **2:** Identifies circularity but fails to explain why T requires value information.
  *   **0:** Assumes T can be complete without a value theory.

  **3. Concrete Case Analysis (6 Marks)**
  *   **6:** Correctly analyzes all three vase scenarios: (1) Break is a side effect/variable change under original T; (2) Break is a violation under amended T; (3) Break is ignored/low-impact if valued but omitted.
  *   **4:** Analyzes scenarios but misses the implication of omitting valued variables.
  *   **0:** Fails to use the case to demonstrate the specification problem.

  **4. The Baseline Problem (4 Marks)**
  *   **4:** Contrasts status quo vs. counterfactual baselines. Explains why status quo makes all action high-impact and counterfactual creates perverse incentives (e.g., avoiding saving lives).
  *   **2:** Describes baselines but fails to explain the normative implication of choosing one.
  *   **0:** Ignores the baseline problem.

  **5. Conclusion on Value Function (2 Marks)**
  *   **2:** Concludes that formal measures presuppose value because significance is axiological. States low-impact inherits the specification problem.
  *   **0:** Concludes low-impact AI is impossible (rather than dependent on value) or claims the proposal succeeds.

  **Deductions**
  *   **-2:** Treating "side effect" as a merely causal notion without normative weight.
  *   **-2:** Assuming a task specification can be complete without a value theory.
  *   **-2:** Concluding that low-impact AI is impossible rather than that it inherits the specification problem.
  *   **-2:** Reciting top-down/bottom-up taxonomy instead of analyzing the provided proposal.

  Summary: This question tests the student's ability to diagnose the hidden value judgments in formal definitions of AI safety and impact.
