      But do not accuse me of hiding the light, when it is God who has veiled it from the proud. There is indeed a standard above the established order, but it belongs to the order of charity, which is as distant from the order of politics as the mind is from the body. The tyrant may rule the flesh, and the philosopher may rule the mind, but neither can touch the saints. We obey the established powers not because they are perfectly just, but because order is necessary to restrain our violence while we seek the true Justice which is God Himself. I do not tell the people to worship the King; I tell them to endure him, so that they may have the peace to seek the King of Kings, who does not hide Himself from the humble in heart.

