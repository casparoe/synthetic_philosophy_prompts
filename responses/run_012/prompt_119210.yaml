      *   *Black Holes:* If $\Theta_{BH} \approx \Theta_L$, why choose $L$ as the target? This suggests selection bias or multiple testing.
      *   *Non-Design as Disjunction:* $H_C$ is often "Not Design". This is a catch-all hypothesis. In Bayesian terms, catch-alls are notoriously difficult to assign likelihoods to because they lack specific generative mechanisms.
      *   *Design as Composite:* $H_D$ has free parameters (Designer's motives, power). If vague, it risks being unfalsifiable or having a low Occam penalty (if integrated over too broadly) or high penalty (if complex).
