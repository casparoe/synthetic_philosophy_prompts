      *   *Likelihood:* $P(E | H)$.
      *   *Prior:* $P(H)$.
      *   *The Core Claim:* $P(E | H_D) \gg P(E | H_C)$.
      *   *The "Chance" Model ($H_C$):* Usually implies a uniform or broad prior over the physically possible range of constants. If the range is infinite or vast, and the life-permitting region is tiny, the marginal likelihood is tiny.
      *   *The "Design" Model ($H_D$):* Implies a prior concentrated on the life-permitting region.
      *   *The Problem of One Sample:* We observe $\theta_{obs}$ once. This is a parameter estimation problem where the parameter is the universe's settings.

  3.  **Address Specific User Concerns within the Translation:**
      *   *Normalisability:* If the parameter space for constants is unbounded, a uniform prior is improper. Bayes factors become undefined. The argument *needs* a proper prior or a cutoff.
