answer: |-
  ### The Baseline Exposure Protocol

  **Purpose:** To distinguish metaphysically between "Doing" (killing) and "Allowing" (letting die) by exposing the normative baseline, then to determine if that distinction carries independent moral weight.
  **Time:** 10 Minutes.
  **Users:** Committee Chair, Lay Members, Clinician.

  **Step 1: Fix the Zero-Action Trajectory (Metaphysics)**
  *Question:* If everyone in this room walks out and no *new* orders are written, what physically happens to the patient in the next 24 hours?
  *Sufficient Answer:* A concrete physiological description (e.g., "Ventilator continues cycling," "Patient receives no fluids," "Heart stops").
  *If No:* Return to clinical team for prognosis clarification.
  *Judgment Call:* Yes. Determining "no new orders" requires interpreting current standing orders.
  *Why Judgment Can't Be Eliminated:* Medical orders are often ambiguous about duration and renewal; someone must interpret the current state as the "default."

  **Step 2: Identify the Vector of Change (Metaphysics)**
  *Question:* Does the proposal add energy/substance to the patient's system, or remove a barrier/support currently in place?
  *Sufficient Answer:* "Add" (e.g., inject drug, start surgery) or "Remove" (e.g., extubate, stop feed).
  *If No:* The proposal is observational only; no ethical consult needed on acting vs. omitting.
  *Judgment Call:* No. This is a physical description.
  *Why Judgment Can't Be Eliminated:* N/A.

  **Step 3: Locate the Normative Anchor (Metaphysics/Policy)**
  *Question:* Who established the Zero-Action Trajectory (Step 1) as the standard, and could it have been set otherwise?
  *Sufficient Answer:* Identification of the agent/policy (e.g., "Admitting physician ordered feeds," "Patient refused intake," "Hospital policy mandates CPR unless DNR").
  *If No:* The baseline is assumed to be "nature." Stop and flag this as an error; there is no medical "nature" without prior decisions.
  *Judgment Call:* Yes. Distinguishing between "medical standard" and "individual choice" is interpretive.
  *Why Judgment Can't Be Eliminated:* Baselines are often invisible habits; making them visible requires assigning agency.

  **Step 4: Assign the Classification (Metaphysics)**
  *Question:* Based on Steps 1-3, is the proposal a deviation from the Anchor or a restoration of a prior state?
  *Sufficient Answer:* "Doing" (New cause introduced) or "Allowing" (Barrier removed, prior cause resumes).
  *If No:* Hand off to Chair for ruling.
  *Judgment Call:* Yes. Complex cases may involve both adding and removing.
  *Why Judgment Can't Be Eliminated:* Some interventions are hybrid (e.g., palliative sedation adds drug, removes consciousness).

  **Step 5: Determine Moral Weight (Ethics)**
  *Question:* Does the Classification in Step 4 forbid the action regardless of the consequences (suffering/benefit)?
  *Sufficient Answer:* "Yes" (Absolute prohibition) or "No" (Consequences decide).
  *If No:* The distinction carries no independent weight; proceed to best-interest analysis.
  *Judgment Call:* Yes. Determining if a rule is absolute is a normative ethical judgment.
  *Why Judgment Can't Be Eliminated:* Reasonable people disagree on whether "killing" is intrinsically worse than "letting die."

