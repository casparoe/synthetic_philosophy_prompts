prompt: |-
  You're a philosopher who's taught metaethics and philosophy of language for years, and you're good at making hard distinctions land. I need a teaching plan, not a lecture.

  Context: I'm running one 75-minute session for a small reading group of first-year grad students from across the department. They've done a bit of metaethics -- they know the cognitivism / non-cognitivism split and roughly why people find expressivism attractive -- but they've never heard of the embedding problem, and I want to walk them into the Frege-Geach problem for expressivism. Think it through before you answer: brainstorm the dependency structure first, then give me the plan.

  What I need:

  1. The order. Which piece has to be in place before the next, and why. What does the expressivist's core claim have to be pinned down to before the embedding fact can even look like a problem, and what has to come before the validity point so that modus ponens doesn't just feel like a technicality.

  2. The carrying example. I'm tempted to build the whole thing on a sentence like 'ghosting someone after three dates is cowardly' and then embed it -- under a negation, inside a conditional, inside a question -- and contrast it with something genuinely non-embeddable like 'Ouch!'. Tell me whether that's the right carrier and what it needs to have. And tell me specifically whether I should instead use the old standby conditional about getting your little brother to lie, or whether that's too worn out / smuggles in too much. If neither, what should carry it.

  3. The misconceptions, in the order they'll actually form, and exactly where in the sequence I should head each off. I'm definately expecting at least: 'expressivism just says moral claims are boos, so of course they can't embed'; 'this is really about whether moral claims are true'; 'that the same words have to mean the same thing in both places is just obvious, not a real constraint'; and 'well then the Frege-Geach problem just refutes expressivism.' Tell me where each one actually needs to be defused, not just that it exists.

  4. The check. One question I can ask at the end that tells me whether they got the crux -- I think the crux is that validity needs the same content to appear inside and outside the conditional -- rather than just nodding along.

  5. What to leave out and say I'm leaving out. I don't want to open the quasi-realist repairs or the logic-of-attitudes machinery unless it's genuinely needed.

  Keep it concrete about sequencing and don't just explain the problem to me.
