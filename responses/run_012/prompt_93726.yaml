answer: |-
  Here is the dependency structure and the teaching plan. I've structured this to ensure the problem emerges from commitments they already hold, rather than appearing as an external objection.

  ### 1. The Dependency Structure (The Logic of the Lesson)

  You cannot present the Frege-Geach problem as a single block. It is a collision between three distinct commitments. If you introduce them out of order, the students will resolve the tension prematurely by abandoning the wrong commitment.

  **The Sequence:**
  1.  **The Expressivist Semantic Claim (Not just Psychological):** You must pin down that expressivism claims moral sentences *lack propositional content* (they don't describe states of affairs). If students think expressivism is just "moral judgments cause feelings," the problem won't land. It has to be about *meaning*.
  2.  **The Embedding Data:** You must establish that moral sentences *grammatically and logically* function in unasserted contexts (conditionals, negations). This must be established *before* asking what they mean in those contexts.
  3.  **The Logic Constraint (Univocality):** You must establish that for an argument (like Modus Ponens) to be valid, the sentence $P$ must carry the *same content* in the major premise ($P \rightarrow Q$) and the minor premise ($P$).
  4.  **The Collision:** Only now do you reveal that Expressivism (1) + Embedding (2) + Logic (3) = Contradiction. If $P$ expresses an attitude in the minor premise, but cannot express an attitude in the antecedent of the major premise (because you aren't asserting it), then $P$ has two different meanings. If $P$ has two meanings, the argument is equivocal. If the argument is equivocal, it is invalid. But the argument *is* valid.

  **Why this order?**
  If you start with the Logic Constraint, they will treat it as a technicality. If you start with the Collision, they will think it's a "gotcha." By building the commitments individually, the contradiction feels like a genuine philosophical crisis, not a trick.

  ---

  ### 2. The Carrying Example

  **Verdict:** Use **"Ghosting is wrong"** (modified from your "cowardly" idea) for the moral sentence, and **"Ouch!"** for the contrast. Do **not** use the "little brother" example.

  **Why "Ghosting is wrong" over "Cowardly"?**
  "Cowardly" is a thick concept. Students will get bogged down debating whether ghosting is actually cowardly or whether cowardice implies wrongness. You want to isolate the *metaethics*. Use "wrong" (thin evaluative) to prevent substantive ethical drift. Keep the "ghosting" context because it's fresh and prevents them from relying on rote memories of the "little brother" example.

  **Why "Ouch!"?**
  You need a control group. "Ouch!" is a paradigmatic expression of pain/attitude that clearly *fails* to embed.
  *   *Test:* "If ouch, then I am hurt." (Nonsense).
  *   *Contrast:* "If ghosting is wrong, then..." (Perfectly sensible).

  **The Specific Construction:**
  Do not build the whole lesson on one complex sentence. Build it on an argument form.
  *   **P1:** If ghosting is wrong, then it is wrong to encourage ghosting.
  *   **P2:** Ghosting is wrong.
  *   **C:** Therefore, it is wrong to encourage ghosting.

  This is indisputably valid. The example works because it forces the sentence "Ghosting is wrong" to appear once asserted (P2) and once unasserted (P1).

  ---

  ### 3. The Misconceptions (and When to Defuse Them)

  Here is the timeline of misconceptions as they will naturally arise in a 75-minute session, and exactly where you must intervene.

  **A. "Expressivism just says moral claims are boos, so of course they can't embed."**
  *   **When it forms:** Minute 15, when you define expressivism.
  *   **Where to defuse:** **Immediately.** Distinguish between the *psychology* of the speaker (feeling boo) and the *semantics* of the sentence (what the sentence means).
  *   **The Move:** Tell them: "Expressivism isn't just that we feel things. It's that the *meaning* of the sentence is exhausted by the expression of the attitude. If that's the meaning, what is the meaning when I'm not expressing the attitude?"

  **B. "This is really about whether moral claims are true."**
  *   **When it forms:** Minute 35, when discussing the conditional premise. They will say, "But in the 'If' clause, the claim isn't true or false."
  *   **Where to defuse:** **During the Logic Constraint section.** Explicitly bracket truth.
  *   **The Move:** "Forget truth for a moment. We are talking about *content*. Even if we don't think moral sentences have truth conditions, they must have *content* to function in logic. The problem isn't truth; it's identity of content."

  **C. "That the same words have to mean the same thing in both places is just obvious, not a real constraint."**
  *   **When it forms:** Minute 50, when you present the collision. They will shrug and say, "Well, obviously it means the same thing."
  *   **Where to defuse:** **Right before the Collision.** You must make them feel the weight of equivocation.
  *   **The Move:** Use a silly analogy. "If 'bank' means river in P1 and money in P2, the argument fails. If Expressivism says 'wrong' means 'attitude' in P2 but something else in P1, Expressivism is accusing moral logic of being a fallacy of equivocation. Are you willing to say moral logic is fallacious?"

  **D. "Well then the Frege-Geach problem just refutes expressivism."**
  *   **When it forms:** Minute 70, conclusion.
  *   **Where to defuse:** **In the final 5 minutes.**
  *   **The Move:** "This is a *problem*, not a refutation. If it were a refutation, we wouldn't still be discussing expressivism. It tells us expressivism is incomplete, not false. We are leaving out the solutions today (Quasi-realism, etc.) so you can feel the weight of the problem first."

  ---

  ### 4. The Teaching Plan (75 Minutes)

  **Phase 1: Locking the Semantic Claim (15 mins)**
  *   **Activity:** Quick fire definitions. Don't lecture. Ask: "On the expressivist view, what is the semantic content of 'Stealing is wrong'?"
  *   **Goal:** Get them to say "It expresses disapproval" not "It describes a disapproval."
  *   **Intervention:** If they say "It describes my feeling," correct them. It *expresses* the feeling (like "Ouch!" expresses pain, it doesn't describe it).
  *   **Key Distinction:** Asserted contexts only. Expressivism explains what happens when I *say* "Stealing is wrong."

  **Phase 2: The Embedding Data & The "Ouch" Contrast (15 mins)**
  *   **Activity:** Write "Ouch!" on the board. Ask students to embed it in a conditional ("If ouch..."). Ask them to embed "Stealing is wrong" ("If stealing is wrong...").
  *   **Discussion:** Why does one sound nonsensical and the other sound normal?
  *   **Point:** Moral sentences embed grammatically and logically. "Ouch!" does not.
  *   **Trap:** If they say "Ouch!" can embed ("If you say ouch, I'll know it hurts"), point out that "Ouch" is being *mentioned*, not *used*. In "If stealing is wrong," "wrong" is being *used*, not mentioned.

  **Phase 3: The Logic Constraint (15 mins)**
  *   **Activity:** Write a standard Modus Ponens on the board using non-moral content (e.g., "If it is raining, the ground is wet").
  *   **Question:** "Why is this valid?"
  *   **Target Answer:** Because the content of "It is raining" is identical in the If-clause and the Assertion.
  *   **Rule:** Validity requires **Univocality**. If the content shifts, it's equivocation.
  *   **Check:** Ask them to give an example of an invalid argument due to equivocation (e.g., the "bank" example).

  **Phase 4: The Collision (20 mins)**
  *   **Activity:** Put the Moral Modus Ponens on the board (The Ghosting example from Section 2).
      1. If ghosting is wrong, then encouraging ghosting is wrong.
      2. Ghosting is wrong.
      3. Therefore, encouraging ghosting is wrong.
  *   **The Squeeze:**
      1.  Ask: "In premise 2, what does 'ghosting is wrong' mean?" (Answer: Expresses disapproval).
      2.  Ask: "In premise 1, am I expressing disapproval of ghosting?" (Answer: No, I'm hypothesizing).
      3.  Ask: "So, on the expressivist view, does 'ghosting is wrong' have the same content in P1 and P2?"
      4.  **The Reveal:** If they say "No," the argument is invalid (equivocation). If they say "Yes," expressivism seems false (because content isn't just expressing attitude).
  *   **Discussion:** Let them struggle here. Do not offer solutions. Let them feel the dilemma.

  **Phase 5: The Check & Wrap (10 mins)**
  *   **The Check Question:** (See below).
  *   **Wrap:** Acknowledge this is the "Embedding Problem." Note that expressivists have sophisticated replies (Quasi-realism), but they all start by admitting this tension.

  ---

  ### 5. The Check (Diagnostic Question)

  Do not ask "Do you understand the problem?" They will nod.
  Do not ask "Is expressivism true?" That invites substantive debate.

  **Ask this:**
  > "Imagine an expressivist tries to solve this by saying: 'In the "If" clause, the sentence "Ghosting is wrong" doesn't express an attitude, it just *refers* to the attitude.'
  >
  > Based on what we discussed about validity and univocality, why does this move fail to save the validity of the Modus Ponens argument?"

  **What you are looking for:**
  They need to identify that if the meaning *changes* (from expressing in P2 to referring in P1), the term is no longer univocal, and the argument commits the fallacy of equivocation. If they grasp that, they understand the crux: **Validity requires content identity, and Expressivism threatens content identity.**

  ---

  ### 6. What to Leave Out (And Say You Are Leaving Out)

  To keep this to 75 minutes and focused on the *problem* rather than the *solution*, you must explicitly bracket the following. Write this on the board at the start:

  1.  **Quasi-Realism:** Do not explain Blackburn's project of "earning the right" to talk about truth. Tell them: "Expressivists have a reply to this called Quasi-Realism. We are ignoring it today so we can see why it was *needed*."
  2.  **The Negation Problem:** The Frege-Geach problem is often split into the Conditional Problem and the Negation Problem (Schroeder's distinction). Stick to the Conditional/Modus Ponens. It is the cleanest entry point. Say: "There is a harder version of this involving negation ('Ghosting is not wrong'), but we are sticking to conditionals."
  3.  **Logic of Attitudes:** Do not introduce Gibbard's norm-expressivism or complex attitude logics. That is the solution machinery. Keep the focus on the conflict between standard logic and expressivist semantics.

  **Final Teacher-to-Teacher Note:**
  The biggest risk in this session is that the students will try to *solve* the problem before they fully feel it. If a student says, "But couldn't we just say the attitude is present in the conditional too?" stop them. Ask, "Am I actually disapproving of ghosting in the 'If' clause? Or am I just considering the possibility?" Keep them in the tension. The pedagogical value is in the discomfort of the contradiction, not the resolution.
