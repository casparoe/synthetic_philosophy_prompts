      *   *Reading 4: The Normative Rule of Acceptance.*
          *   Claim: If the agent finds a proof of $\phi$, it *ought* to believe $\phi$.
          *   Status: Defensible as a design choice, but distinct from truth.
          *   Who: The designer telling the agent how to behave.
          *   Trouble: This is just the definition of the agent. It doesn't solve the *self-trust* problem regarding *future* versions or modifications, or self-referential sentences. It conflates "I proved it" with "It is true" in a way that blocks error correction.

      *   *Reading 5: Löb's Condition / Provability of Implication.*
          *   Claim: The agent proves $\square \phi \to \phi$ for specific $\phi$.
          *   Status: Only true if $\phi$ is already provable (Löb's Theorem).
          *   Who: The agent.
          *   Trouble: Limits self-trust. The agent can only trust itself on things it has already proved. It cannot trust its own reasoning process generally.

