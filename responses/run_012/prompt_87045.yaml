      *   *Accuracy:* These are substantially correct. The zoo did receive offers (e.g., from a private zoo in England and a park in France), but EEP (European Endangered Species Programme) coordinator rejected them because those institutions weren't approved for breeding or were already over-capacity with non-EEP animals. The public dissection and feeding were key flashpoints. The Danish Animal Ethics Council supported the zoo.
      *   *Action:* Proceed with the provided facts as accurate enough for the argument.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define Speciesism precisely. It's not just "liking humans more." It's the unjustified preference for members of one's own species over others, typically prioritizing human interests (trivial ones) over animal interests (vital ones).

      *   **Lens 1: Sentientism (Equal Consideration of Interests):**
          *   *Theory:* Singer-esque. Count equal interests equally.
          *   *Culling:* Marius's interest in living vs. Zoo's interest in genetic hygiene. Vital vs. Administrative. Fails the test.
