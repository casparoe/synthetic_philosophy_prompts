  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe Marius is a "denizen" in *Zoopolis* terms?
      *   *Correction:* No, denizens are wild animals living in human spaces (rats, pigeons). Marius was bred *by* the institution. He is fully dependent. He fits the "domesticated citizen" model best, even if "citizen" feels weird for a zoo animal. The key is the *obligation of care* inherent in the breeding relationship.
      *   *Initial thought:* Is the genetic logic speciesism?
      *   *Correction:* If I prioritize Giraffe Genes over Human Comfort, is that speciesism? No. If I prioritize Giraffe Genes over Giraffe Life, that's *something else*. I need to be careful not to conflate "valuing animals" with "anti-speciesism." Speciesism is Human > Non-Human. This case is System > Individual. I need to make sure this distinction is sharp.

