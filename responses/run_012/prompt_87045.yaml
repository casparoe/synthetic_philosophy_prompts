      *   Address the "prejudice among others" claim? Check.

  7.  **Final Polish:** Ensure the transition between sections is smooth and the conclusion lands hard on the "speciesism" definition. (Proceed to generate output).

  *(Self-Correction Note on "Speciesism" definition)*: I need to be careful. Standard definition: Bias in favor of humans. In this case, humans killed an animal for the sake of *animal* genetics. So, strictly speaking, it might not be speciesism in the classic sense (Human Interest > Animal Interest). It might be *Individualism vs. Collectivism*. However, the *public outrage* was human humans feeling bad for the animal. The *Zoo's defense* was scientific management. I need to parse whether the *killing* was speciesist. Actually, the prompt asks me to analyze *through* the lens of speciesism. I should argue that the *framework* of zoos itself is speciesist (humans deciding who lives/dies), even if the specific justification is genetic. Or, I should argue that this exposes a limit of the term "speciesism." I will take the latter, more nuanced path: it reveals speciesism is often a proxy for human control, even when disguised as animal benefit.

