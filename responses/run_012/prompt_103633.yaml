answer: |-
  Alex and Blake, two seniors vying for the single Lead Editor position on the school paper, are already three special editions deep into a contest where the winner takes the role and a college recommendation, while the loser gets nothing but exhaustion. Though both explicitly acknowledge in the newsroom chat that they are trapped in a "dollar auction" dynamic, Alex publishes a fourth edition, calculating that the single weekend required is a small price for the chance Blake might quit, whereas stopping guarantees losing the title. Blake, anticipating this, releases a fifth edition, reasoning that conceding now surrenders the prize to Alex for certain, while matching costs only one more weekend with a statistical probability Alex folds. They cycle through six and seven editions, exhausted and grades slipping, each calculating that the marginal cost of one more issue is less than the certain loss of the position if they stop while the other continues, until both miss college deadlines and neither secures the recommendation.

  ***

  **Sunk-Cost Account vs. Case Reality**
  A sunk-cost account predicts that escalation occurs because parties feel compelled to "make good" on prior investments; it posits that Alex continues because he has already spent three weekends and cannot bear to waste them. This diagnosis does not fit the case. In the scenario, neither party cites past effort as a justification. Alex does not argue, "I have done three editions, so I must do a fourth." Instead, the reasoning is strictly forward-looking: the marginal cost of the fourth edition is weighed against the potential future gain of the title, conditional on Blake's expected behavior. The prior three editions are acknowledged as lost in the final outcome ("worse off than if neither had begun"), but they do not appear as a premise in the decision calculus to continue.

  **Step-by-Step Forward-Looking Rationality**
  The escalation is defensible at every step through Expected Value (EV) analysis, assuming a War of Attrition model.
  1.  **State:** Both have submitted 3 editions. The prize (Recommendation) is valued at $V$. The cost of one edition is $C$.
  2.  **Alex's Decision (Move 4):** If Alex stops, he loses the contest immediately (Payoff = 0). If Alex continues, he pays $C$. He continues if $P(\text{Blake quits}) \times V - C > 0$. Even if $V$ is less than the *total* sunk costs, as long as $V > C$ and Alex assigns a non-zero probability to Blake quitting, continuing maximizes EV compared to the certain zero of stopping.
  3.  **Blake's Decision (Move 5):** Blake knows Alex just paid $C$. If Blake stops, Payoff = 0. If Blake continues, he pays $C$. He continues if $P(\text{Alex quits}) \times V - C > 0$.
  4.  **Awareness Step:** Even knowing the pattern, the math remains unchanged. Knowledge of the "dollar auction" label does not alter $V$, $C$, or $P(\text{Opponent Quits})$. As long as each believes the other has a breaking point, the rational move is to test that boundary.
  5.  **Termination:** They end up worse off because the sum of costs ($7C$) exceeds $V$, and both lose the prize. This is an ex-post outcome, not an ex-ante irrationality. At step 6, neither knew step 7 would occur; they only evaluated step 6 vs. stopping.

  **The Driving Feature**
  The feature doing the work is the **asymmetry of cessation in an all-pay contest**. Specifically, stopping incurs a *certain loss of the prize* while the opponent remains active, whereas continuing incurs only a *marginal cost* for a *probabilistic chance* at the prize. The structure forces a choice between a guaranteed loss of the objective (the title) and a gamble that costs little now but might win big.

  **Removal of the Feature**
  If this feature is removed—for example, if the prize were divisible (both could be Co-Editors) or if stopping did not guarantee losing the prize (e.g., a sealed-bid auction where bids are hidden)—the escalation halts. In a divisible prize scenario, the marginal cost of continuing would not be justified by the marginal gain, as the opponent's continuation does not zero out your payoff. The certain loss upon stopping is the engine of the trap.

  **The Irrationality Attack**
  An attacker claiming irrationality would argue: "The parties are irrational because they possess common knowledge of the trap yet fail to coordinate to stop." They would assert that rational agents would recognize the Nash Equilibrium of mutual cessation or flip a coin to decide the winner without cost.
  *Evaluation:* This attack fails on its own terms within the constraints of a non-cooperative game. The scenario specifies a school rivalry without binding contracts or communication channels sufficient for enforcement (they chat, but cannot bind each other). Without a mechanism to enforce a ceasefire, "agreeing to stop" is not a credible strategy; each has an incentive to defect and publish one more edition to steal the prize. Therefore, maintaining the escalation is procedurally rational given the lack of enforceable cooperation, even if the collective outcome is suboptimal. The case holds because it demonstrates that individual rationality (maximizing EV at step *n*) can produce collective ruin without invoking sunk-cost fallacies.
