answer: |-
  A local university philosophy department offers a game using a standard fair coin: the coin is flipped repeatedly until it lands heads. If the first heads appears on the $n$-th flip, the player receives $\$2^n$. The game is presented as a theoretical contract with finite payoffs for every specific outcome, administered in an ordinary room without recourse to infinite capital reserves or exotic physics, relying solely on the mathematical definition of the prize structure.

  **Analysis**

  **Objective Expected Value:**
  The probability of the game ending on flip $n$ is $p_n = (1/2)^n$. The payoff is $x_n = 2^n$. The expected monetary value (EMV) is:
  $$ \text{EMV} = \sum_{n=1}^{\infty} p_n x_n = \sum_{n=1}^{\infty} \frac{1}{2^n} 2^n = \sum_{n=1}^{\infty} 1 = \infty $$
  Since the EMV is infinite, the **Expected-Value Maximizer** accepts any finite entry fee.

  **Agent 2: Bounded-Utility Expected-Utility Maximizer ($F_1$)**
  This agent maximizes $E[U(x)]$, where $U(x)$ is a bounded utility function (e.g., $U(x) < M$ for all $x$).
  $$ E[U] = \sum_{n=1}^{\infty} \frac{1}{2^n} U(2^n) < \sum_{n=1}^{\infty} \frac{1}{2^n} M = M $$
  Since the expected utility is bounded by $M$, the certainty equivalent (the maximum fee $F_1$ they would pay) is finite.
  *   **Feature making $F_1$ finite:** The **boundedness of the utility function**. No matter how large the payoff grows, the marginal utility approaches zero fast enough to keep the sum finite.

  **Agent 3: Probability-Distorting Agent ($F_2$)**
  This agent evaluates the lottery using distorted probabilities $\pi_n = p_n^2 = (1/4)^n$. Assuming they value money linearly after distortion:
  $$ V = \sum_{n=1}^{\infty} \pi_n x_n = \sum_{n=1}^{\infty} \frac{1}{4^n} 2^n = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n = 1 $$
  The distorted value is $\$1$. Thus, $F_2 \le 1$ (ignoring wealth effects).
  *   **Feature making $F_2$ finite:** The **super-exponential decay of the distorted probabilities**. Squaring $p_n$ changes the decay rate from $1/2^n$ to $1/4^n$, which dominates the payoff growth of $2^n$.

  **Geometric Probabilities Variation**
  The standard game already uses geometric probabilities ($p_n = q(1-q)^{n-1}$ with $q=0.5$). If the coin is biased such that the probability of heads is $q \neq 0.5$:
  *   **EMV:** Diverges if $2(1-q) \ge 1$ (i.e., $q \le 0.5$).
  *   **PDA Value:** Converges if $4(1-q)^2 < 1$ (i.e., $q > 0.5$).
  If $q=0.5$, both conditions hold (Infinite EV, Finite PDA). If the coin is heavily biased against heads (e.g., $q=0.1$), the EMV remains infinite, but the PDA value might diverge if $4(0.9)^2 > 1$ (which it is, $3.24 > 1$), causing the PDA agent to also see infinite value.

  **Expected-Value Maximizer's Critique**
  The EVM argues that the other two agents violate the **axioms of rational choice** (specifically independence and continuity). They contend that rejecting a positive infinite expectation for a finite cost is mathematically incoherent and leaves guaranteed value on the table. They argue that utility boundedness is an arbitrary psychological cap rather than a normative rule, and probability distortion is a cognitive bias that misprices risk, whereas linear expectation is the only consistent measure of long-run worth.
