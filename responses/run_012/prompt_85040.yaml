answer: |-
  The **Self-Maintenance View (SMV)** of composition proposes a restrictive criterion for when a plurality of objects composes a further object. By tying existence to a specific causal dynamic—a closed loop of mutual causation enabling self-repair and resistance to dissolution—SMV radically reshapes our ontology. It moves away from common-sense realism (which accepts tables and rocks as objects) and away from nihilism (which accepts only simples), positioning itself instead as a form of **biological or functional organicism**.

  The most important implications of SMV concern the ontological hierarchy of reality, the nature of persistence through time, and the directionality of causation. Below is an analysis of these implications across artifacts, organisms, and social entities.

  ### (a) Artifacts: The Exclusion of "Dead" Matter
  Under SMV, standard artifacts like ships and tables generally **fail to exist as composite objects.**

  *   **Lack of Reciprocal Causation:** A table's legs support the top, but the top does not causally sustain the legs in a way that preserves their arrangement against entropy. The causation is static and structural, not dynamic and self-sustaining.
  *   **Inability to Repair:** If a table leg is broken, the table possesses no internal capacity to repair the perturbation. It relies entirely on external agents (carpenters) to restore its form. Since the "closed loop" is broken by damage and cannot be internally restored, the composite object ceases to exist at the moment of significant structural failure, or perhaps never existed as a genuine unity in the first place.
  *   **Implication for Persistence:** This implies that artifacts do not persist in the robust sense that organisms do. A "Ship of Theseus" scenario is resolved decisively: if the causal loop of self-maintenance is interrupted (e.g., the ship is dismantled), the object ceases to exist, regardless of whether the planks are reassembled later. Artifacts are merely "heaps" or conventional designations imposed by human interests upon collections of simples.
  *   **Implication for Part-Whole Causation:** In artifacts, causation is largely bottom-up (parts determine the whole's properties). SMV denies the top-down causation required for composition; the whole does not act back on the parts to maintain their status as parts.

  ### (b) Organisms: The Paradigm of Existence and Vague Boundaries
  Organisms are the **primary ontological citizens** under SMV. They are the paradigm cases where the conditions of composition are met.

  *   **Special Status of Biological Individuals:** SMV grants biological organisms a privileged metaphysical status. They are the only "medium-sized dry goods" that genuinely exist. This aligns metaphysics with biology, suggesting that *life* is not just a biological category but an ontological one. To be an object is, fundamentally, to be alive (or functionally analogous to life).
  *   **Temporal Boundaries (Persistence):** SMV provides a clear criterion for when an organism begins and ends. Composition begins when the closed causal loop is established (e.g., perhaps at the zygote stage when metabolic self-regulation begins) and ends when the loop irretrievably breaks (death). This resolves puzzles about fetal development or brain death by focusing on the *capacity for self-maintenance* rather than arbitrary developmental milestones.
  *   **Spatial Boundaries (Vagueness):** A profound implication of SMV is that spatial boundaries are **functional, not geometric.** Because causal integration is a matter of degree, the boundaries of an organism may be vague.
      *   *Example:* Are gut bacteria part of the organism? If they are causally integrated into the host's self-maintenance loop (digestion, immune regulation), SMV suggests they may be *parts* of the composite object.
      *   *Example:* Is a shed hair part of the organism? Once it no longer participates in the causal loop of repair/maintenance, it ceases to be a part.
      *   *Implication:* This implies that existence itself can be vague. There may be no sharp fact of the matter about exactly where an organism ends and the environment begins, challenging classical logic's Law of Excluded Middle in metaphysics.

  ### (c) Social Entities: The Test of Functional Realism
  The status of social entities (committees, firms, states) is the most contentious and philosophically rich implication of SMV. It depends on whether "causation" is restricted to physical/biological processes or includes institutional/normative causation.

  *   **The Argument for Existence:** If causation includes normative and informational flows, social entities **can count as composite objects.**
      *   *Closed Loop:* Members act to sustain the firm; the firm's structure (rules, salaries) sustains the members' roles.
      *   *Repair:* States have constitutions and legal systems specifically designed to repair perturbations (elections, courts, police) and resist dissolution (defense, laws against secession).
      *   *Implication:* If SMV accepts social entities, it becomes a form of **social realism.** A state would be ontologically on par with an organism. This validates the intuition that institutions have a "life of their own" distinct from their current members.
  *   **The Argument against Existence:** If "mutual causation" requires physical homeostasis, social entities fail. They rely on the *external* intentions of individuals rather than an intrinsic physical drive to survive. A committee dissolves if members simply choose to leave; it lacks the *automatic* neg-entropic drive of a cell.
  *   **Most Likely SMV Implication:** A robust interpretation of SMV likely admits **highly structured states or corporations** as objects while excluding transient groups like crowds or casual committees. The distinction lies in the *robustness* of the self-repair mechanism. This implies a graded ontology where some social objects are "more real" than others based on their institutional resilience.

  ### Cross-Cutting Thematic Implications

  **1. Persistence as Causal Continuity**
  SMV fundamentally alters the concept of persistence. An object persists not because it retains the same matter (material continuity) nor because it retains the same form (structural continuity), but because it retains the **same self-sustaining causal process.**
  *   *Implication:* An organism can replace all its cells (metabolism) and remain the same object because the *loop* continues. Conversely, if the loop stops (cryogenic freezing, perhaps), the object may cease to exist even if the structure is preserved. Persistence is dynamic, not static.

  **2. Reciprocal Part-Whole Causation**
  SMV necessitates a metaphysics of **downward causation.** For a closed loop to exist, the whole must exert causal power over the parts to keep them in the arrangement that constitutes the whole.
  *   *Implication:* This rejects reductionism. You cannot fully explain the parts without reference to the whole, because the whole is causally responsible for the parts continuing to exist *as parts*. The whole is prior to the parts in terms of explanatory power, even if the parts are prior in terms of material constitution.

  **3. The Biological Privilege**
  Ultimately, SMV implies that **metaphysics is subordinate to biology.** The fundamental structure of reality is not determined by physics (atoms) or logic (sets), but by the organizational principles of living systems.
  *   *Implication:* This creates a "desert landscape" ontology. The universe is mostly empty of composite objects, populated sparsely by living organisms and perhaps a few resilient social or artificial systems. It challenges the anthropocentric view that the things we use (tools, buildings) are the primary reality, suggesting instead that we are surrounded by "heaps" and only the living (and perhaps the institutional) are truly "one."

  ### Conclusion
  The Self-Maintenance View implies a world that is ontologically thinner regarding inanimate matter but thicker regarding living and potentially social systems. It denies the existence of tables to save the reality of the organism. It suggests that **to be is to maintain oneself.** This grants biological individuals a unique metaphysical dignity, defines persistence as the continuity of a process rather than a substance, and forces a rigorous evaluation of whether our social institutions are merely convenient fictions or genuine, self-sustaining entities in their own right.
