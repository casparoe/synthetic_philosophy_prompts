      *(Self-Correction during drafting)*: Make sure I don't just say "the metaphor is bad." I need to say *what work it can still do* vs. *what it cannot do*. The prompt asks "what the level playing field can and cannot be made to support."
      *   *Can support:* Formal equality of opportunity (no legal barriers).
