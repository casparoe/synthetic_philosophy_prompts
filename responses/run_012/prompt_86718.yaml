answer: |-
  **Exam Question**

  Kripke's sceptical solution replaces truth-conditions for meaning ascriptions with assertibility-conditions grounded in community agreement. Critically evaluate whether this dissolves the sceptical paradox or merely relocates it. In your analysis, address the circularity objection regarding group dispositions and consider the case of 'Drillia', a society where linguistic uniformity is produced by authoritarian drilling rather than spontaneous convergence. Conclude by committing to whether meaning ascriptions are non-factual and if this stance is compatible with the objectivity of arithmetic.

  **Model Answer**

  Kripke's sceptical paradox argues that no individual fact, internal or external, constitutes meaning one thing by another, such as plus rather than quus. Since no fact fixes the rule, all usage is ostensibly unjustified. The sceptical solution accepts this negative conclusion but denies that meaning requires truth-conditions. Instead, it proposes that meaning ascriptions are justified by assertibility-conditions grounded in community agreement. This shifts the focus from metaphysical facts to social practices, aiming to make meaning intelligible without facts. However, critics argue this relocates the paradox rather than solving it, as the normative force of rules remains unexplained.

  The circularity worry posits that community agreement presupposes the very rule-following it seeks to explain. If individuals lack normative guidance, aggregating them into a group does not generate normativity from brute dispositions. When the community checks if a member agrees, they must follow a rule to identify agreement. If their identification is merely disposed behavior, the sceptic asks what makes *that* disposition correct. Thus, the solution risks regressing: the group's agreement is just another set of dispositions subject to the same sceptical scrutiny as the individual's. Paul Boghossian argues this makes the solution viciously circular, as it uses a notion of correctness to explain correctness.

  This vulnerability is sharply exposed by the case of 'Drillia'. In Drillia, linguistic uniformity is produced by authoritarian drilling rather than spontaneous convergence. Everyone says '125' because they were conditioned, not because of shared natural reactions. If Kripke's solution relies only on uniformity, Drillia sustains meaning. But if it requires normative agreement, Drillia fails, as coercion lacks the requisite mutual check. Kripke suggests agreement must be a brute fact, but Drillia shows brute uniformity is insufficient for normativity. Without distinguishing forced regularity from genuine agreement, the solution collapses into behaviorism, failing to explain why some agreements are correct and others mistaken. The sceptic can ask why the drillers' rule is the right one.

  Regarding non-factualism, the solution must commit to meaning ascriptions lacking truth-conditions. We cannot say "Jones means plus" is true in virtue of a fact; we say it because Jones passes our tests. This is compatible with arithmetic objectivity if objectivity is understood internally rather than metaphysically. Arithmetic statements are objective within the language game because the community rigorously enforces rules and corrections. While there is no metaphysical fact grounding 'plus', the practice remains stable, indispensable, and resistant to individual whim. We save the phenomenon of mathematics by abandoning the quest for transcendent meaning facts. Objectivity becomes a feature of our communal discipline, not the world.

  Ultimately, the sceptical solution changes the subject to save practice. It admits the sceptic wins on metaphysical grounds but blocks sceptical conclusions about usage. By accepting non-factualism, we preserve arithmetic objectivity as a feature of our form of life, not the world. The paradox is dissolved because the demand for a fact of the matter is rejected as misguided. However, the circularity worry remains a significant tension regarding how normativity emerges from mere agreement. If agreement is just regularity, normativity is lost; if it implies normativity, the explanation is circular. Thus, the solution saves mathematics only by redefining the terms of the debate.

  **Marking Scheme**

  1. The essay must accurately reconstruct the sceptical paradox and the sceptical solution's shift from truth-conditions to assertibility-conditions. [4 marks]
  2. The student must explain the circularity objection, noting that group agreement presupposes the rule-following it attempts to ground. [4 marks]
  3. The analysis of 'Drillia' must distinguish between coerced uniformity and normative agreement, showing why brute regularity fails to solve the paradox. [4 marks]
  4. The answer must commit to non-factualism about meaning and argue whether arithmetic objectivity is preserved internally or lost metaphysically. [4 marks]
  5. The conclusion must evaluate whether the solution dissolves the paradox or changes the subject, addressing the tension between normativity and regularity. [4 marks]
