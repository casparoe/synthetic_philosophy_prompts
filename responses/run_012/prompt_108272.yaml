      *Wait, 90 minutes is very tight for all this.* I need to cut one scenario. Just one deep dive scenario is better than two shallow ones. Let's use one complex scenario with two dimensions (e.g., Policy Budget) or two quick scenarios. Let's go with **two quick scenarios** to show it's not context-specific, but keep them very short.
      Actually, the prompt says "The pairs themselves... at least one pair." Okay, I will design two, but advise the user to drop the second if time runs short.
