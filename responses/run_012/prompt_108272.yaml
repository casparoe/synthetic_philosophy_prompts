answer: |-
  # Facilitator's Run-Sheet: The Ledger and the Trays
  **Time:** 90 Minutes
  **Materials:** 3 colors of index cards (White, Yellow, Blue), black markers, masking tape, 4 plastic trays, 1 side table.
  **Room Setup:** Tables arranged in a U-shape. Three trays labeled **BETTER**, **WORSE**, **EQUAL** placed centrally. One unlabeled tray on a separate side table.

  ## Part I: Setup & The Ledger (30 Minutes)

  **0:00–0:05 | Entry & Rules**
  *   Do not introduce the topic. Do not mention "value," "reason," or "choice."
  *   Hand each participant a packet: 6 White cards, 2 Yellow cards, 2 Blue cards, 1 marker.
  *   **Say:** "We are going to file a series of comparative judgments. There are no right answers, only consistent records. Write clearly. You will not discuss your answers until instructed."
  *   **Recruit the Clerk:** Ask for one volunteer to serve as Clerk. Take them aside for 60 seconds (while others read the first prompt).
      *   **Clerk Instructions:** "Your job is to collect the cards, then return them to their owners. When you return them, you must read the three verdicts back to the owner aloud. Then ask: *'Where does the first pair go in the trays?'* You may not argue, explain, or suggest. You are a mirror. If they hesitate, repeat the question."

  **0:05–0:20 | The Scenarios (White Cards)**
  *   Distribute **Scenario 1** (Project Alpha vs. Beta) and **Scenario 2** (Job A vs. Job B) on the board or handout.
  *   **Scenario 1 (Policy):**
      *   **Option A:** Fund Surveillance Tech. (Reduces crime by 20%, reduces privacy significantly).
      *   **Option B:** Fund Community Outreach. (Reduces crime by 18%, preserves privacy).
      *   **Option A+:** Fund Surveillance Tech+. (Reduces crime by 21%, reduces privacy significantly).
  *   **Scenario 2 (Career):**
      *   **Option A:** University Post. (High prestige, high stress, location X).
      *   **Option B:** Non-Profit Role. (High impact, lower pay, location Y).
      *   **Option A+:** University Post+. (High prestige, high stress, location X, +$5k salary).
  *   **Task:** On **White Cards**, participants must write the Scenario Number and one of three verdicts: **BETTER**, **WORSE**, or **EQUAL**.
      *   Card 1: Scenario 1, A vs. B.
      *   Card 2: Scenario 1, A+ vs. A.
      *   Card 3: Scenario 1, A+ vs. B.
      *   Card 4: Scenario 2, A vs. B.
      *   Card 5: Scenario 2, A+ vs. A.
      *   Card 6: Scenario 2, A+ vs. B.
  *   **Constraint:** They must choose one of the three words. "Unsure" is not a permitted verdict.

  **0:20–0:30 | The Improvement Check (Yellow Cards)**
  *   Hand out **Yellow Cards**.
  *   **Task:** "Look at your verdict for A+ vs. A (Cards 2 & 5). On a Yellow Card, write one sentence explaining *why* the improvement tips the scale in that specific comparison."
  *   Collect White and Yellow cards. The Clerk begins the Audit.

  ## Part II: The Audit & The Trays (35 Minutes)

  **0:30–0:50 | The Audit**
  *   The Clerk circulates. They hand the White Cards back to each participant.
  *   **The Script:** The Clerk points to Card 1 (A vs. B), Card 2 (A+ vs. A), and Card 3 (A+ vs. B). They read the three verdicts aloud.
  *   **The Question:** "Where does the first pair (A vs. B) go in the trays?"
  *   **The Trap:**
      *   If they wrote **EQUAL** on Card 1: The Clerk asks, "If A and B are Equal, and A+ is Better than A, why is A+ not Better than B (Card 3)?"
      *   If they wrote **BETTER/WORSE** on Card 1: The Clerk asks, "You judged A and B differently. Did the 1% improvement (A to A+) cause that difference, or was the difference already there?"
  *   **Facilitator Note:** If a participant argues with the Clerk, intervene gently. "The Clerk is reading your own record. The inconsistency is in the ink, not the room."
  *   **Goal:** Participants should realize their three verdicts cannot logically coexist under the standard three-way frame. They will likely hesitate to place Card 1 into any of the three labeled trays.

  **0:50–1:05 | The Sorting**
  *   Invite participants to approach the central table.
  *   **Instruction:** "File Card 1 (A vs. B) and Card 4 (A vs. B) into the trays according to your verdict."
  *   **Observation:** Watch for hesitation. Watch for cards hovering over the trays but not dropping.
  *   **The Unlabeled Tray:** Point to the side table with the unlabeled tray.
  *   **Say:** "If the labeled trays do not fit your verdict, you may use the tray on the side. You must decide as a group if that tray is to be used. If you use it, you must agree on a label for it. Write the label on tape and affix it to the tray."
  *   **Constraint:** Do not suggest labels. Do not suggest "Parity" or "Incommensurable." Let them struggle. Common emergent labels: "Unsure," "Different Kinds," "No Fit."
  *   **Discussion:** Allow them to debate the label for 10 minutes. This is the only open discussion period so far.

  ## Part III: Commitment & Swap (15 Minutes)

  **1:05–1:15 | The Forced Choice**
  *   Hand out **Blue Cards**.
  *   **Say:** "The filing is complete. Now you must act. Pick either Option A or Option B from Scenario 1. You cannot pick A+."
  *   **Task:** "Write one sentence defending your choice. The sentence must claim the choice is **correct**, not just that you prefer it. Use the word 'should' or 'ought'."
      *   *Example:* "One should choose A because..." (NOT "I like A because...")
  *   **Swap:** Trade Blue Cards with the person to your right.

  **1:15–1:20 | The Neighbor Audit**
  *   **Task:** Read your neighbor's sentence.
  *   **Say:** "Determine if their sentence establishes *correctness* or reports *preference*. Write 'C' or 'P' in the corner of their card. Return it."
  *   **Prompt:** "If you wrote 'P', tell them what word would need to change to make it 'C'."

  ## Part IV: Debrief (10 Minutes)

  **1:20–1:30 | Mapping the Trap**
  *   **Do not lecture.** Ask questions to draw the map out of them, then supply the philosophical terminology only at the end.
  *   **Map the Ledger:** "Who wrote 'Equal' for A/B but 'Not Better' for A+/B?" (Raise hands). "In standard logic, if A=B and A+>A, then A+>B. Why did your verdicts block this?"
  *   **Map the Trays:** "What did you label the fourth tray?" (Write their label on the board). "Why was 'Equal' insufficient?"
  *   **Map the Commitment:** "How many neighbors marked 'P' (Preference) on your defense?" "Is it possible to have a reason for a choice when the options are not equal, better, or worse?"

  **The Three Diagnoses (Write on Board):**
  1.  **Epistemic:** The options *are* equal (or one is better), but we lack the information to see it. (The "Ignorance" view).
  2.  **Ontic:** The options are indeterminate; there is no fact of the matter. (The "Vagueness" view).
  3.  **Conceptual:** The three-way verdict (Better, Worse, Equal) is the wrong frame. There is a fourth relation. (The "Parity" view).

  **The Unresolved Questions:**
  *   "Does the fourth relation belong to the *values* themselves (they lack a common measure), or to our *concepts* (our language is too coarse)?"
  *   "Regarding the Blue Card: Did your commitment *find* a reason that was already there, or did the act of choosing *make* the reason?"
  *   "If the options are on a par, are both choices permissible, or is only one correct?"

  ---

  ## Troubleshooting: Predictable Failures

  **1. The "Preference Uncertainty" Defense**
  *   **The Move:** A participant says, "I just don't know what I prefer. This isn't about value, it's about my psychology."
  *   **The Handle:** Do not correct them. Ask: "If you had more time or more data, would the uncertainty resolve? Or is the uncertainty about *you*, or about the *options*?" If they say "About me," ask them to file the card in "Equal." If they refuse, they have admitted the "Equal" tray is not capturing their state. Let the tension stand.

  **2. The "Rough Equality" Insistence**
  *   **The Move:** A participant insists, "They are basically equal. A+ is better than B, just negligibly. I marked 'Not Better' loosely."
  *   **The Handle:** Turn to the Ledger. "You marked A+ vs. B as 'Equal' or 'Worse'. If A+ is better than B, even negligibly, you must move that card to the 'Better' tray. If you move that card, does the logic hold?" Force them to commit to the strictness of their own verdicts. If they concede A+ > B, ask why A was not < B.

  **3. The Adversarial Audit**
  *   **The Move:** The Clerk gets aggressive, or a participant attacks the Clerk for "tricking" them.
  *   **The Handle:** Intervene immediately. "The Clerk is a function, not a person. They are reading your ink. If the ink is inconsistent, the inconsistency is yours." Re-center the room on the *Ledger*, not the *Clerk*.

  ---

  ## Limitations: What This Activity Cannot Do

  **1. Ontology of Value**
  *   **The Gap:** This activity generates data about *verdicts* (what people say), not *values* (what is good). It proves participants *feel* the trichotomy is exhausted; it does not prove the values *are* incommensurable.
  *   **Your Supply:** In the debrief, you must explicitly state: "We have shown a failure of judgment. We have not shown a failure of the world. The leap from 'we cannot compare' to 'they are incomparable' is a philosophical claim, not an empirical result of this room."

  **2. The Lived Experience**
  *   **The Gap:** A hard choice is often defined by the aftermath (regret, transformation, identity). This 90-minute exercise is instantaneous. It cannot simulate the weight of living with a choice for years.
  *   **Your Supply:** Acknowledge this. "We have simulated the *structure* of the choice, not the *history* of the agent. A hard choice often becomes hard only in retrospect. This activity captures the snapshot, not the film."

  **3. The "Correctness" of Commitment**
  *   **The Gap:** The Blue Card step forces a claim of correctness. But if parity holds, perhaps neither is correct, only permissible.
  *   **Your Supply:** Leave this as the final open question. "If the fourth tray is real, does 'correct' still apply? Or does 'permissible' replace it?" Do not answer. End on the question.
