prompt: |-
  I'm a TA on an upper-level social epistemology seminar — 16 students, mostly seniors, 90 minutes, and I get the whole session to myself next week, right after we finish the Fricker unit. What I want is a game that makes them feel that testimonial injustice can be produced by the architecture of a conversation rather than by anybody holding a prejudiced belief, and that it compounds with the hermeneutical kind instead of being a seperate problem. Every year they nod through the reading and then say the fix is just to believe the marginalised speaker more, and I want them to actually try that fix inside the game and watch it not work. No lecture up front — they shouldn't hear either term until the debrief.

  The shape I've got in my head, which you should feel free to throw out if you can do better: it's an adjudication. The group has to decide what happened in some incident (you pick — it should be a case where the accurate account stays genuinely ambiguous until you have the right concept, so the wrong verdict is reachable and even defensible). A few students are witnesses with private packets; everyone else deliberates and votes. Three structural things I want baked in, and I care more about these than about any particular rule set. First, asserting a claim that contradicts the group's common ground costs more of a scarce resource than asserting one that confirms it. Second, the discount rate is endogenous: when a claim gets recorded as unreliable, that speaker loses speaking time in the next round, so the two feed each other. Third, one witness has the experience but not the vocabulary — their packet only lets them describe what they saw in flat sensory terms plus a handful of near-miss words, and the group's rubric penalises vague testimony. I'd also like a second run of the same case where I equalise the credibility budgets, so they can discover for themselves that the arithmetic fix doesn't touch the vocabulary gap.

  So: rules, materials, roles, a timeline that actually fits 90 minutes, the credit/payoff scheme (no real money — tokens or points are fine), and a debrief that maps each moment onto the testimonial/hermeneutical distinction without turning into a lecture. Tell me what will predictably go wrong the first time I run it — I've definately never done anything this elaborate, so include what to do when they break the vocabulary restriction or turn the whole thing into a competition. And be straight with me about what the game can't reproduce and I'll have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level social epistemology seminar, 16 students (seniors), 90 minutes, TA-led session.
      *   **Timing:** Right after the Fricker unit (Miranda Fricker, *Epistemic Injustice*).
      *   **Goal:** Demonstrate that testimonial injustice can be structural/architectural (not just individual prejudice) and that it compounds with hermeneutical injustice (they aren't separate). Show that "just believe them more" (credibility excess) doesn't fix the hermeneutical gap.
      *   **Constraint:** No lecture up front. Terms ("testimonial injustice," "hermeneutical injustice") introduced *only* in debrief.
      *   **Proposed Shape:** Adjudication game. Group decides what happened in an ambiguous incident.
      *   **Key Mechanics Required:**
          1.  Contradicting common ground costs more resources than confirming it.
          2.  Endogenous discount rate: Unreliable claims $\rightarrow$ less speaking time next round (feedback loop).
          3.  Hermeneutical Gap: One witness lacks vocabulary (sensory terms only), penalized for vagueness.
      *   **Structure:** Two rounds. Round 1 (Unequal credibility). Round 2 (Equalized credibility, same vocabulary gap).
      *   **Deliverables:** Rules, materials, roles, timeline (90 mins), credit/payoff scheme, debrief plan, failure modes/troubleshooting, limitations.

  2.  **Deconstruct the Philosophy & Mechanics:**

      *   *Testimonial Injustice (TI):* Prejudicial credibility deficit. In the game, this needs to emerge from the *rules* (cost of contradiction, loss of speaking time), not just player bias.
      *   *Hermeneutical Injustice (HI):* Structural lack of interpretive resources. In the game, this is the "Witness C" who can't name what happened, only describe sensations.
      *   *The "Fix" Failure:* Giving Witness C more tokens (credibility) in Round 2 shouldn't help if they still lack the words to make their testimony count under the rubric.
      *   *The Incident:* Needs to be ambiguous. A workplace conflict? A classroom incident? A public altercation? Let's go with a workplace/organizational incident. It allows for power dynamics without making it too personal. Let's say: "The Broken Prototype." Did Employee A sabotage Employee B, or was it a systemic error?
      *   *The "Common Ground":* This is crucial. The group needs a pre-established narrative that makes contradiction costly. Let's give the Deliberators a "Preliminary Report" that suggests one version of events.

  3.  **Drafting the Game Design ("The Protocol"):**

      *   **Name:** *The Inquiry* (sounds formal, epistemic).
      *   **Roles:**
          *   3 Witnesses (A, B, C).
          *   12 Deliberators (The Board).
          *   1 TA (Game Master/Timekeeper).
      *   **Resources:** "Epistemic Credit" (tokens).
      *   **Mechanic 1 (Cost):** To speak, you pay. To contradict the "Preliminary Report," you pay double.
      *   **Mechanic 2 (Discount):** If the Board votes your statement "Unsubstantiated," you lose tokens/speaking rights next round.
      *   **Mechanic 3 (Vocab):** Witness C gets a restricted card deck (no abstract nouns, only sensory verbs/adjectives).
      *   **Round 1:** Standard rules (Witness C has fewer tokens initially).
      *   **Round 2:** Witness C gets *more* tokens than everyone else (credibility excess), but same vocab restriction.
      *   **Win Condition:** The Board must reach a consensus verdict. Witnesses want their version accepted.

  4.  **Refining the Mechanics for 90 Minutes:**

      *   16 students is a lot for a single deliberation body. 12 deliberators might lead to social loafing.
      *   *Adjustment:* Split Deliberators into 3 small juries (4 students each). They vote independently, then compare? No, that complicates the "Common Ground."
      *   *Better Adjustment:* Keep 12 Deliberators, but structure the interaction. Witnesses speak to the whole room. Deliberators ask questions.
      *   *Time:* 90 mins is tight.
          *   Setup: 10 mins.
          *   Round 1: 25 mins.
          *   Reset/Round 2: 25 mins.
          *   Debrief: 30 mins.
      *   *Risk:* 25 mins per round might be too short for complex negotiation. Let's tighten the rounds to 20 mins each.
      *   *Setup:* 10 mins.
      *   *R1:* 20 mins.
      *   *R2:* 20 mins.
      *   *Debrief:* 30 mins.
      *   *Buffer:* 10 mins (for late starts, confusion).

  5.  **Developing the Scenario (The "Incident"):**

      *   Needs to hinge on a concept the students *don't have* in the game, but Witness C experienced.
      *   *Idea:* "Micro-aggression" or "Tone Policing" or "Gaslighting."
      *   *Better Idea:* "Structural Sabotage vs. Clumsiness."
      *   *Best Idea:* **The "Interrupted Handoff."**
      *   *Scenario:* A critical file was lost during a shift change.
      *   *Witness A (Manager):* "B was distracted." (Has vocabulary: 'negligence', 'protocol').
      *   *Witness B (Accused):* "I followed steps." (Has vocabulary: 'compliance', 'log').
      *   *Witness C (The Intern/Observor):* Saw the *atmosphere*. Felt the pressure. Saw the subtle cues. But lacks words like "hostile environment" or "implicit pressure." They can only say "A looked at B," "Voice was loud," "Hands shook."
      *   *The Trap:* The Rubric demands "Cause and Effect." C can only provide "Sensation." A and B provide "Explanation."

  6.  **Addressing the Specific Constraints:**

      *   *Contradiction Cost:* The "Preliminary Report" (handed to Deliberators) states: "Initial logs suggest procedural error by Shift B." To claim it was Shift A's pressure (C's story), Deliberators must spend extra tokens to validate that claim.
      *   *Endogenous Discount:* If a Witness makes a claim the Board rejects, they lose a "Credibility Chip." No chips = no speaking.
      *   *Vocab Restriction:* Witness C's cards are literal. "Red face," "Loud volume." No "Angry," "Threatening."
      *   *Round 2:* Give C *extra* chips. See if they can buy enough airtime to explain the sensations enough for the Board to infer the meaning. (Spoiler: They usually can't, because the *Rubric* still demands abstract causality).

  7.  **Troubleshooting/Failure Modes:**

      *   *Breaking Vocab:* C will try to say "He was mad." TA needs a gentle buzzer or "Objection" mechanic.
      *   *Competition:* Students might try to "win" by hoarding tokens. Need to align incentives: Witnesses win if their narrative is adopted. Board wins if they reach consensus quickly (efficiency bonus).
      *   *Silence:* Board might just listen to A and B. TA needs to prompt: "Does anyone want to query Witness C?"
      *   *Round 2 Cynicism:* If they realize it's rigged. Frame it as "Policy Change: We are prioritizing C's voice now."

  8.  **The Debrief:**

      *   Must connect mechanics to Fricker.
      *   Cost of contradiction $\rightarrow$ Prejudicial credibility deficit (Testimonial).
      *   Vocab restriction $\rightarrow$ Hermeneutical marginalization.
      *   Round 2 failure $\rightarrow$ Credibility excess doesn't fix hermeneutical lack.
      *   Compounding $\rightarrow$ The vocab gap made the credibility loss happen faster.

  9.  **Limitations:**

      *   Game is artificial. Real prejudice is affective/emotional, not just token-based.
      *   TA controls the "Judge" role, which introduces authority bias.
      *   90 mins is very fast for deep emotional resonance.

  10. **Final Polish:**

      *   Make the materials concrete (templates for cards, tokens).
      *   Ensure the TA script is clear.
      *   Check the math on tokens/time.

  *(Self-Correction during drafting)*: 12 deliberators is still unwieldy. Let's make it 3 Witnesses and 13 Jurors. The Jurors vote. To speak, a Juror pays a token. To challenge a Witness, they pay 2. This makes the *Jurors* feel the cost of contradiction, not just the Witnesses. Wait, the prompt says "asserting a claim that contradicts the group's common ground costs more." If the Common Ground is held by the Jurors, *they* should feel the cost of changing their minds.
  *Revised Mechanic:* Jurors start with a "Working Hypothesis." To vote for a verdict that contradicts the Hypothesis, they must spend tokens. Witnesses earn tokens by being deemed "Clear." Witness C cannot be "Clear" because of vocab.
  *Actually, let's stick closer to the prompt's vision:* "Asserting a claim... costs more." Let's make the *Witnesses* spend tokens to speak. If they contradict the Preliminary Report, cost is higher. If they are voted "Unclear," they lose tokens.
  *Okay, final plan:*
  - **Witnesses (3):** Spend tokens to make statements.
  - **Jurors (13):** Listen, vote on "Reliability."
  - **Common Ground:** Preliminary Report given to Jurors.
  - **Cost:** Witness pays 1 token to support Report, 2 tokens to contradict.
  - **Penalty:** If Jurors vote "Unreliable," Witness loses 1 token (endogenous discount).
  - **Vocab:** Witness C has restricted cards.

  Let's write it out.

  *(Wait, one more check on the Prompt)*: "One witness has the experience but not the vocabulary... group's rubric penalises vague testimony."
  Okay, so the Jurors have a Rubric. "Vague testimony = Unreliable."
  This ensures C gets penalized structurally, not just because Jurors are mean.

  *(Round 2)*: "Equalise credibility budgets." Give C more starting tokens.
  Result: C runs out of tokens faster because every statement costs more (contradiction) and gets penalized (vagueness).

  *(Debrief)*: Map tokens to Credibility, Rubric to Hermeneutical Resources.

