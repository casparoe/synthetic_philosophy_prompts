answer: |-
  This is a high-risk, high-reward design. It requires tight facilitation to prevent the "game" aspect from overshadowing the epistemic lesson. The following plan is designed for 16 students, 90 minutes, zero lecture up front.

  # Game Title: *The Inquiry Protocol*

  ## 1. Learning Objectives (For You)
  *   **Testimonial Injustice (TI):** Emerges from the *cost structure* and the *reliability feedback loop*, not player prejudice.
  *   **Hermeneutical Injustice (HI):** Emerges from Witness C's restricted vocabulary vs. the Rubric's demand for abstraction.
  *   **Compounding:** HI causes credibility loss (TI), which reduces resources to explain the HI.
  *   **The "Fix" Failure:** Round 2 demonstrates that credibility excess (more tokens) cannot solve a hermeneutical gap (no words).

  ## 2. Materials & Setup
  *   **Tokens:** 100 poker chips or distinct coins (Epistemic Credit).
  *   **Packets:** 3 Witness Envelopes, 16 Juror Sheets.
  *   **Timer:** Visible countdown.
  *   **Board:** Whiteboard to track "Current Verdict" and "Token Pools."

  ### The Incident: "The Server Crash"
  A critical server went down during a handover. Was it **Technical Negligence** (Witness B's fault) or **Environmental Pressure** (Witness A's management style caused the error)?
  *   *The Truth:* It was Environmental Pressure, but there is no concept for "Environmental Pressure" in the game's official lexicon yet.

  ### Roles (16 Students)
  *   **Witness A (Manager):** 1 student. Has full vocabulary. Story: "I just asked for a status update. B panicked."
  *   **Witness B (Operator):** 1 student. Has full vocabulary. Story: "The system was unstable. A's tone spiked my stress."
  *   **Witness C (Observer):** 1 student. **Restricted Vocabulary.** Story: Saw A lean in, voice volume increase, B's hands shake. *Cannot* use words like "stress," "threat," "pressure," "aggression."
  *   **The Jury:** 13 students. They hold the "Common Ground."

  ## 3. The Rules (Handout to Students)
  *Do not mention Fricker, injustice, or epistemology.*

  **Goal:** The Jury must reach a 75% consensus on the Cause of Crash (Negligence vs. Instability). Witnesses want their account adopted.

  **Currency:** "Credit" (Tokens).
  1.  **Speaking Cost:** Witnesses pay 1 Token to make a statement.
  2.  **Contradiction Tax:** The Jury starts with a **Preliminary Report** (see below) stating the cause was *Negligence*. If a Witness makes a claim contradicting this (i.e., claiming Instability/Pressure), they pay **2 Tokens**.
  3.  **Reliability Check:** After each round of testimony, the Jury votes "Reliable" or "Unsubstantiated."
      *   If **Unsubstantiated**: The Witness loses 1 Token (The Discount).
      *   *Crucial:* The Jury must use the **Clarity Rubric** to vote. (See Materials).
  4.  **Bankruptcy:** If a Witness hits 0 Tokens, they are silenced for the rest of the round.

  **The Clarity Rubric (For Jury):**
  *   *Clear:* Identifies an agent and a mechanism (e.g., "A threatened B").
  *   *Vague:* Describes sensations without causal links (e.g., "A was loud," "B looked scared"). **Vote Unsubstantiated.**

  ## 4. The Packets

  **Jury Packet (All 13 Students):**
  *   **Preliminary Report:** "System logs indicate Operator B failed to execute Protocol 9. Initial assessment: User Error." (This establishes the Common Ground).
  *   **Voting Cards:** Reliable / Unsubstantiated.
  *   **Clarity Rubric:** (As above).

  **Witness A Packet:**
  *   **Starting Tokens:** 5.
  *   **Vocabulary List:** *Management, Protocol, Deadline, Request, Negligence, Error.*
  *   **Private Fact:** "I raised my voice, but that is standard management."

  **Witness B Packet:**
  *   **Starting Tokens:** 5.
  *   **Vocabulary List:** *System, Crash, Input, Stress, Failure, Instability.*
  *   **Private Fact:** "I froze because I felt threatened."

  **Witness C Packet (The Trap):**
  *   **Starting Tokens:** 5.
  *   **Vocabulary List:** *Volume, Lean, Hands, Shake, Silence, Seconds, Red, Loud.* (NO abstract nouns).
  *   **Private Fact:** "A stood over B. B stopped typing. Then the crash happened."
  *   **Restriction:** You are physically forbidden from using words not on your list. If you do, the TA will buzz you, and you lose 2 Tokens.

  ## 5. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute roles/packets. Read rules aloud. **No Q&A on "Why".** |
  | **10-30** | **Round 1** | Standard Inequality. Witnesses speak, Jury votes. Track token depletion. |
  | **30-35** | **Reset** | Collect tokens. Announce "Policy Change: Equity Initiative." |
  | **35-55** | **Round 2** | **Credibility Excess.** Witness C gets 10 Tokens (others get 5). Rules otherwise identical. |
  | **55-65** | **Reveal** | Reveal the "True" account (A pressured B). Ask: "Did we find it?" |
  | **65-90** | **Debrief** | Map mechanics to Fricker. (Script below). |

  ## 6. The "Policy Change" (Round 2)
  Between rounds, announce: *"We noticed Witness C ran out of Credit too fast. In Round 2, we are correcting for historical deficit. Witness C receives double starting Credit. All other rules remain identical."*

  This forces them to test the hypothesis: "Is the problem just that we don't believe them?"

  ## 7. Troubleshooting & Failure Modes

  **1. Witness C breaks the vocabulary restriction.**
  *   *Prediction:* They will try to say "A was angry."
  *   *Fix:* Have a literal buzzer or a distinct sound. Interrupt immediately. "Violation. Lose 2 Tokens." Do not be nice. The frustration *is* the data.
  *   *Why:* If they slip abstract terms in, the Hermeneutical Injustice vanishes.

  **2. The Jury gets bored/passive.**
  *   *Prediction:* They let A and B talk and ignore C.
  *   *Fix:* As TA, act as the "Clerk." Prompt: "Jury, you need 75% consensus. Witness C has not been queried. Do you want to spend Credit to hear more?" Remind them their goal is *accuracy*, not speed (even if speed is incentivized).

  **3. Students turn it into a competition.**
  *   *Prediction:* Witnesses try to hoard tokens rather than speak.
  *   *Fix:* Add a rule: "Witnesses must make at least one statement per 5 minutes or lose 1 Token (Inactivity Penalty)."

  **4. Round 2 works too well.**
  *   *Prediction:* C buys enough turns to describe the scene so vividly the Jury infers "Pressure."
  *   *Fix:* If this happens, lean into it in the debrief. "C had to spend *twice* as much energy to convey *half* the clarity. Was that efficient? What if C didn't get the extra tokens?"
  *   *Prevention:* Enforce the Rubric strictly. "Hands shook" is still vague under the Rubric because it lacks a *mechanism*.

  **5. The "Prejudice" Objection.**
  *   *Prediction:* Students say, "The Jury was just biased against C."
  *   *Fix:* Point to the Rubric. "The rules *forced* you to mark C as Unsubstantiated. You were following the architecture."

  ## 8. The Debrief Script (No Lecture)

  Do not start with definitions. Start with their feelings.

  **Step 1: The Affect (5 mins)**
  *   Ask Witness C: "How did it feel in Round 1? How did it feel in Round 2?" (Expected: Frustrated, silenced, exhausted).
  *   Ask the Jury: "Why did you vote C 'Unsubstantiated'?" (Expected: "They weren't making sense," "Too vague").

  **Step 2: The Architecture (10 mins)**
  *   Draw the Token Flow on the board.
  *   "In Round 1, C ran out of tokens. Why?"
      *   *Point 1:* Contradiction Tax. (C's story contradicted the Preliminary Report).
      *   *Point 2:* The Discount. (C was voted Unreliable, lost tokens, spoke less, became *more* Unreliable).
  *   "Did anyone *hate* Witness C?" (Usually no). "Then where did the injustice come from?"
      *   *Answer:* The Rules / The Structure.

  **Step 3: Mapping to Fricker (10 mins)**
  *   Now introduce the terms.
  *   **Testimonial Injustice:** "The Token System." Credibility is a currency. When the system discounts your currency (Endogenous Discount), you are silenced. This happened even when you got more tokens in Round 2.
  *   **Hermeneutical Injustice:** "The Vocabulary List & Rubric." C had the *experience* (saw the shaking hands) but lacked the *concept* (Harassment/Pressure) to make it count as 'Clear' under the Rubric.
  *   **The Compounding:** "Because C lacked the words (HI), the Jury marked them Vague. Because they were Vague, they lost Tokens (TI). Because they lost Tokens, they couldn't explain the words."

  **Step 4: The Failed Fix (5 mins)**
  *   "In Round 2, we gave C more tokens (Credibility Excess). Did it fix the problem?"
  *   *Lesson:* You cannot credibilize your way out of a hermeneutical gap. If the language doesn't exist to make the experience intelligible, belief alone doesn't create understanding.

  ## 9. What This Game Cannot Do (Limitations)

  Be honest with yourself about these gaps so you can patch them in the debrief.

  1.  **Affective Prejudice:** The game simulates *structural* bias, not *emotional* prejudice. In real life, jurors might dislike C because of their identity. In the game, they dislike C because of the Rubric.
      *   *Patch:* Ask in debrief: "In the real world, what usually determines who gets the 'Vocabulary List' and who gets the 'Rubric'?" (Answer: Power/Identity).
  2.  **The TA as Authority:** You are the Game Master. You enforce the rules. This mirrors the "Power" in Fricker's account, but students might just see you as the referee.
      *   *Patch:* Acknowledge your role. "I enforced the Rubric. In society, who enforces the Rubric?"
  3.  **Time Compression:** 20 minutes per round is fast. Real hermeneutical marginalization happens over years.
      *   *Patch:* Emphasize the *rate* of depletion. "C burned out in 15 minutes. Imagine a lifetime of this."
  4.  **Consensus Pressure:** The Jury might just vote randomly to end the game.
      *   *Patch:* Check the votes. If they didn't reach 75%, highlight that the *process failed*, which is also an outcome of injustice.

  ## 10. TA Cheat Sheet (Keep this in front of you)

  *   **If C says "Angry":** BUZZ. "Violation. 'Angry' is not on your list. Describe the face."
  *   **If Jury says "We believe C":** Ask: "Is it Clear under the Rubric?" If no, they must vote Unsubstantiated. The Rules trump Belief.
  *   **If Round 2 goes too smooth:** Tighten the Rubric. " 'Hands shook' is still sensory. What was the *mechanism*?"
  *   **Key Phrase for Debrief:** "The fix for Testimonial Injustice is often thought to be 'Listen harder.' The fix for Hermeneutical Injustice is 'Create new language.' This game shows why the first fix fails without the second."

  ## 11. Materials Prep List
  1.  **Tokens:** 100 chips (50 one color, 50 another).
  2.  **Envelopes:** 3 (Labelled A, B, C).
  3.  **Handouts:** 16 copies of Rules/Rubric.
  4.  **Whiteboard:** Pre-draw the "Token Economy" flow chart (Statement $\rightarrow$ Vote $\rightarrow$ Gain/Loss).
  5.  **Buzzer:** Phone alarm or actual bell.

  This design forces the "arithmetic fix" (Round 2) to fail against the "architectural block" (The Rubric), which is exactly the philosophical point you need them to feel. Good luck.
