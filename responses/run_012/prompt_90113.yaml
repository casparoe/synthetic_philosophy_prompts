answer: |-
  Your flatmate is committing a classic error: he is treating a mathematical model as a physical law. He is right that you cannot argue with the theorem itself (Step 2), but he is wrong that the real world satisfies the theorem's conditions.

  To save your sanity and your defense of democracy, here is exactly where you need to break his chain of reasoning.

  ### The Short Answer
  You need to drop **Premise (1)** as a universal claim, and you must reject **Step (5)** entirely.

  If you keep (1) as stated ("*any* yes/no question... average person is a bit more likely to be right"), the math forces you to accept the absurd conclusions. But (1) is empirically false. Once you fix (1), the rest of the argument collapses, and you can keep the spirit of crowd wisdom without the infallibility claim.

  Here is the detailed breakdown of why his argument fails and how to reconstruct a sensible view of crowd wisdom.

  ---

  ### 1. Attack Premise (1): Competence is Not a Constant
  Your flatmate claims: *"People are, on the whole, better than chance at these... 55/45, say. That's a general fact about humans."*

  This is the weak link. Competence ($p$) is not a property of the human; it is a property of the **human-question pairing**.
  *   **Trivial Questions:** "Is the sky blue?" ($p \approx 1.0$).
  *   **Random Guesses:** "Is this coin heads?" ($p = 0.5$).
  *   **Complex Technical Questions:** "Does this specific protein fold this way?" or "Did the defendant leave this specific DNA trace?"

  For a random person asked a complex question in particle physics or forensic pathology, $p$ is not $0.55$. It is likely **below 0.5**. They are not just guessing; they are confidently wrong due to misinformation or lack of framework.

  **Why this matters for the Theorem (Step 2):**
  Condorcet's Jury Theorem has a dark twin. If the average voter competence $p < 0.5$ (even slightly, say $0.45$), and votes are independent, the probability that the majority is *wrong* tends to 1 as $n$ increases.
  *   If $p > 0.5$, the crowd becomes infallible.
  *   If $p < 0.5$, the crowd becomes **infallibly wrong**.

  By asserting (1) universally, your flatmate ignores the scenarios where the crowd is systematically biased. On questions of advanced physics or specific legal guilt, a random crowd's $p$ is likely $< 0.5$. Therefore, a crowd of 100,000 would be *more* reliable at getting the answer wrong than a single expert.

  **Cost of dropping (1):** You admit that crowds are not magic truth-generators. They only work when the question is within the general competence of the populace.

  ### 2. Attack the Independence Assumption (Hidden in Step 3)
  Your flatmate acknowledges independence in Step (2), but assumes it exists in Step (3). It does not.

  The theorem requires votes to be **independent conditional on the truth**. In the real world, people share information sources, cultural biases, and social pressures.
  *   **Information Cascades:** If the first 10 people guess "Yes," the 11th person is likely to say "Yes" regardless of their private information.
  *   **Common Mode Errors:** If everyone watches the same news channel that reports false information, their errors are correlated.

  When errors are correlated, they do not cancel out; they compound. A crowd of 100,000 people who all read the same fake news article is not 100,000 independent data points; it is effectively one data point repeated 100,000 times. The "law of large numbers" does not apply.

  **Cost of dropping this:** You admit that for a crowd to be wise, it must be *diverse* and *decentralized*. This actually strengthens the case for democracy (free press, free speech) but weakens the case for "just ask a random hall of people."

  ### 3. Attack Step (5): The Self-Certification Fallacy
  Step (5) is logically incoherent. It claims the crowd can vote on whether the conditions for the vote are valid.

  This is circular reasoning. You cannot use a tool to verify that the conditions for using the tool are met.
  *   **Analogy:** You cannot use a ruler to measure whether the ruler itself is accurate without already having a standard of length.
  *   **Logic:** If the crowd is incompetent ($p < 0.5$), their vote on "Are we competent?" will also be wrong. They will vote "Yes, we are competent" with high probability, even though they are not.

  You must drop (5) entirely. It is a category error. The validity of the theorem's assumptions is a matter for external statistical analysis, not internal majority vote.

  ### 4. How to Save Democracy (Without Infallibility)
  You mentioned you want to keep the idea that crowds are wiser than individuals to defend democracy. You can do this, but you need to shift the argument from **Epistemic Infallibility** (knowing facts) to **Value Aggregation** (weighing interests).

  **The "Wisdom of Crowds" vs. Condorcet:**
  There is a distinction between Condorcet's Jury Theorem (about *truth*) and the "Wisdom of Crowds" effect (about *estimation* and *values*).
  *   **Fact Questions:** Crowds only beat experts if the average person has *some* signal ($p > 0.5$) and is independent. This works for "Guess the weight of the ox" (where everyone sees the ox) but not "Does this drug cure cancer" (where no one sees the mechanism).
  *   **Value Questions:** Democracy is not primarily about deciding if a particle exists; it is about deciding "Do we value security over privacy?" or "Should we fund schools or roads?"

  **The Defense:**
  Democracy is not a machine for finding scientific truth. It is a mechanism for:
  1.  **Legitimacy:** People accept outcomes they participate in.
  2.  **Interest Aggregation:** Only the crowd knows what the crowd wants. Experts can tell you how to build a bridge, but not whether the bridge should be built *here* or *there*.
  3.  **Error Correction:** Unlike a dictator, a democratic crowd can fire the leaders when things go wrong.

  ### Summary for Your Flatmate
  Tell him this:

  1.  **I accept the Theorem (2).** It is math.
  2.  **I reject Premise (1).** Human competence is not $>50\%$ on *all* questions. On complex technical issues, random crowds are $<50\%$ competent. By your own theorem, this means large crowds become **confidently wrong** on those topics. Experts are needed to raise $p$ above $0.5$ before the crowd can vote.
  3.  **I reject the Independence assumption in practice (3).** Real crowds share biases. Correlated errors break the theorem.
  4.  **I reject (5).** A broken thermometer cannot verify that it is working. A crowd that fails the competence test cannot vote to pass the competence test.
  5.  **I keep Democracy.** But not because it makes us gods. Because it allows us to aggregate values and correct errors, not because it makes us infallible on particle physics.

  **The Verdict:** Drop **(1)** as a universal claim. That is the factual error that turns a useful heuristic into a absurd dogma.
