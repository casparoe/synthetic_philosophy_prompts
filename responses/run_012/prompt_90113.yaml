      *   *Is (1) completely false?* No, it's false as a *universal*. It's true for some questions. I need to specify that distinction.
      *   *What about the "Wisdom of Crowds" (Surowiecki)?* That's different from CJT. Surowiecki emphasizes diversity and independence more than raw competence. I should mention this distinction to help the user defend democracy without relying on CJT infallibility.
