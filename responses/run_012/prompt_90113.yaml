      *   *Recommendation:* Focus on **(1)**. It's the empirical claim that is false. If $p < 0.5$, the theorem proves the opposite of what the flatmate wants.

  6.  **Structuring the Answer:**
      *   **Direct Answer:** Drop Premise (1) and the interpretation of (5).
      *   **The "p < 0.5" Trap:** Explain that if competence is below 50%, the crowd converges on wrongness.
      *   **The Independence Trap:** Explain correlated errors (information cascades).
      *   **The Self-Certification Trap:** Explain why (5) is nonsense.
