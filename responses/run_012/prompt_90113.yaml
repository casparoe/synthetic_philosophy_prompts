      *   **The Flatmate's Argument:**
          1.  Premise: Ordinary people are $>50\%$ accurate on average ($p > 0.5$).
          2.  Theorem: CJT says if $p > 0.5$ and votes are independent, majority accuracy $\to 1$ as $n \to \infty$.
          3.  Conclusion 1: Large crowds are nearly infallible on factual questions.
          4.  Conclusion 2: Experts are useless; crowds beat experts on *specific* technical/complex questions (murder trials, physics, medicine).
          5.  Conclusion 3: The crowd can validate the theorem's own assumptions (independence, competence) via voting.
