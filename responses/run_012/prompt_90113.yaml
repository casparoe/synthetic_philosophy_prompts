      *   If (1) is false for specific complex questions (like physics or specific murder trials), the theorem (2) doesn't guarantee correctness; it guarantees *incorrectness* if $p < 0.5$.
      *   Also, the independence assumption is violated in real crowds (shared biases).

      *Best Strategy:* Tell the user to reject **(1)** as universally stated, and reject the *application* in **(5)**. The theorem (2) is fine, but its conditions aren't met.

  4.  **Drafting the Response:**

      *   **Validate the User:** Acknowledge that the flatmate is misapplying a valid theorem. This is a classic "map vs. territory" error.
      *   **Address Premise (1) - Competence:** This is the big one. $p > 0.5$ is not a human constant. It depends on the question. For "Is water wet?", $p \approx 1$. For "Is this specific protein structure correct?", $p \approx 0$ for laypeople. If $p < 0.5$, CJT says the crowd becomes *infinitely wrong*.
      *   **Address the Independence Assumption (Hidden in 2/3):** Real people talk. They watch the same news. They share biases. Correlated errors do not cancel out; they compound. This breaks the theorem's application in (3).
      *   **Address Step (5) - Self-Certification:** This is logically invalid. You can't use a tool to verify the conditions required to use the tool. It's circular.
      *   **Address Step (4) - Experts:** Experts exist to raise $p$. If the crowd's $p$ is low, you need experts to raise it. Crowds are good at aggregating *existing* competence, not creating it out of thin air on technical matters.
      *   **Defending Democracy:** Explain that democracy isn't about epistemic infallibility on technical facts. It's about aggregating *values* and *interests*, or choosing between broad directions where $p > 0.5$ is plausible (e.g., "Are we safe?" vs "Is this particle a boson?").

  5.  **Refining the "Which Step to Drop" Advice:**
      *   Technically, you drop **(1)** as a universal claim.
      *   You also have to drop the *unqualified application* of **(2)**. The theorem holds, but the *conditions* for using it are not met in step (3).
