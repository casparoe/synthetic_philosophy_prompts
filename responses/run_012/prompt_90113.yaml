  2.  **Evaluate the Flatmate's Argument Step-by-Step:**

      *   **Step (1): "People are, on average, better than chance (55/45) on *any* ordinary yes/no question of fact."**
          *   *Critique:* This is the weakest link. Is $p > 0.5$ true for *all* questions?
          *   *Reality:* For trivial questions ("Is the sky blue?"), $p \approx 1$. For random guesses ("Is this coin heads?"), $p = 0.5$. For complex technical questions ("Does this particle exist?", "Is this specific DNA match valid?"), $p$ might be $< 0.5$ (systematic bias/misinformation) or barely above 0.5.
          *   *Key Issue:* Competence ($p$) is not a constant property of humans; it's a property of the *human-question pairing*. On hard questions, $p$ can be $< 0.5$.

      *   **Step (2): Condorcet's Jury Theorem.**
          *   *Critique:* The math is correct *given the assumptions*.
          *   *Assumptions:* Binary choice, $p > 0.5$ for all voters, **independence** of votes.
          *   *Key Issue:* Independence is rarely met in real social settings (common information sources, cascades, polarization).

      *   **Step (3): "So for *any* yes/no question... a large enough crowd... is right with probability as close to 1 as you like."**
          *   *Critique:* This follows from (1) and (2), but since (1) is suspect, (3) is suspect. Also, it ignores the independence assumption.

      *   **Step (4): "Experts... are a waste of money."**
          *   *Critique:* This is a non-sequitur even if (3) were true. Experts might be needed to *frame* the question or ensure $p > 0.5$. But mainly, if $p < 0.5$ for the crowd on technical issues, CJT implies the crowd becomes *more confident in the wrong answer* as $n$ grows.

      *   **Step (5): "The crowd can settle whether its own votes are independent..."**
          *   *Critique:* This is circular. You can't vote on whether the conditions for voting correctly are met. It violates the logical order of the theorem. The theorem is an *external* analysis of the voting process, not an *internal* tool.

  3.  **Identify the Break Point:**
      *   The user wants to save Democracy/Crowd Wisdom but kill the "Crowds are Infallible Gods" conclusion.
      *   The most robust place to attack is **Premise (1)** regarding the *scope* of questions, and the **Independence Assumption** hidden in (2).
