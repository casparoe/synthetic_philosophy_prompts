answer: |-
  This is a classic objection, often called the **Indeterminacy of Proper Function** argument. It's a close cousin to Fodor's "Disjunction Problem," but dressed in evolutionary clothing. Your friend is right that it *looks* airtight on paper, because it exploits a genuine tension in how we talk about evolution: selection acts on whole organisms, but teleosemantics needs functions to be individuated at the level of specific traits.

  However, it is not a knockout blow, and you do not need to become an eliminativist to keep (1). Here is the diagnosis of where the leak is, why it looks sealed, and what you pay to fix it.

  ### The Diagnosis: Where the Argument Breaks

  The argument hinges on **Premise (3)**: *"Nothing in the selection history by itself singles one of these out as the function."*

  This is the step you should reject. It looks plausible because it conflates the **fitness of the organism** with the **proper function of the trait**.

  1.  **The Conflation:** It is true that the *bacterium* was selected for surviving, dividing, and persisting. But teleosemantics (specifically Millikan's version, which your group seems to be grinding through) does not define the function of a mechanism by the fitness of the whole organism. It defines it by the specific **causal contribution** that explains why *that specific mechanism* was copied in ancestral lineages.
  2.  **The Specificity:** The chemotaxis mechanism wasn't selected for "persisting in the lineage." That's too broad. It was selected for *regulating flagellar rotation in response to receptor binding*. The "survival" benefit is the *consequence* of the function, not the function itself.
  3.  **The History:** If you look at the lineage, you can trace the proliferation of the chemotaxis genes. They proliferated because they mediated a specific input-output relationship (chemical gradient → tumbling frequency). The history *does* single out that specific relationship, distinct from "eating" or "dividing," because you can imagine a bacterium that divides and eats without *that specific mechanism* (e.g., passive diffusion).

  If you reject (3), (4) collapses. The content is not indeterminate between "nutrients" and "survival" because "survival" was not the *proper function* of the mechanism, even if it was the ultimate evolutionary payoff.

  ### The Consumer Solution: Real Fix or Relabeling?

  You asked specifically about the move to **Consumer Semantics** (fixing content by the mechanism that *uses* the signal, not the one that produces it). You are right to be suspicious. In the hands of a sloppy teleosemanticist, this *is* just relabeling.

  **Why it looks like relabeling:**
  If you say, "The content is whatever the consumer needs it to be," it sounds like you're just defining away the indeterminacy by fiat. "What does the motor need? Oh, just the specific thing that makes the content determinate!"

  **Why it is (potentially) a real distinction:**
  It is not relabeling if you accept Millikan's **Conditions of Satisfaction** constraint.
  *   **Producer Theory:** Asks "What was this state selected to correlate with?" (Vulnerable to your friend's argument: it correlates with nutrients, survival, heat, pH, etc.)
  *   **Consumer Theory:** Asks "What does the downstream mechanism need this state to indicate in order to perform *its* proper function?"

  In the bacterium:
  *   The **Producer** is the receptor complex.
  *   The **Consumer** is the flagellar motor switch.
  *   The motor's proper function is to rotate CCW (smooth swim) or CW (tumble).
  *   For the motor to perform *its* function correctly, it needs the signal to indicate **whether the gradient is improving relative to the last moment.**
  *   It does *not* need the signal to indicate "there is food" (too broad) or "I am surviving" (irrelevant to the motor's immediate mechanics).

  **The Cost:**
  To make this work, you pay a tax in **biological granularity**. You cannot treat the organism as a black box. You must individuate the internal subsystems. If your friend argues, "But the motor was also selected for survival!", you have to insist on the **proximate vs. ultimate** distinction. The motor's *proximate* function is switching rotation. Its *ultimate* value is survival. Teleosemantics grounds content in the proximate function because that is what fixes the *conditions of satisfaction* for the signal.

  If you accept this, you are paying for **structural realism**. You are committing to the view that the internal architecture of the organism (the specific wiring between producer and consumer) constrains content more than the general evolutionary outcome does.

  ### The Fallback: Rejecting Premise (5)

  If you find the Consumer move too costly (or if you think the producer/consumer distinction is blurry in simple organisms like bacteria), you can reject **Premise (5)**: *"An indeterminate representation is no representation."*

  **The Argument:**
  This premise assumes content must be crisp, logical, and univocal. But natural kinds are rarely that clean.
  *   **Vagueness:** The content might be vague between "sucrose gradient" and "nutrient gradient."
  *   **Cost:** You admit that mental content is not a precise logical relation but a biological one, subject to the same fuzziness as "species" or "heart."
  *   **Benefit:** You avoid eliminativism. You accept that the bacterium represents *something*, even if the boundaries of that *something* are slightly fuzzy. This is often called **Partial Interpretation**.

  **Why your friend hates this:**
  If content is indeterminate, truth conditions are indeterminate. If truth conditions are indeterminate, how can we build a logic of thought on top of it?
  **Your counter:** We don't need classical logic for bacteria. We need a theory that explains successful behavior. Vague content can still guide successful behavior.

  ### Summary of Exits

  | Exit | What you reject | What you pay |
  | :--- | :--- | :--- |
  | **The Millikan Exit** | **Premise (3)**. Selection *does* single out specific trait functions, not just organism survival. | **Complexity.** You must do the hard work of individuating biological subsystems (producer vs. consumer) and defending the proximate/ultimate distinction. |
  | **The Vagueness Exit** | **Premise (5)**. Indeterminacy does not imply non-existence. | **Precision.** You admit content is fuzzy. You lose the ability to say mental states have exact truth conditions, but you save naturalism. |
  | **The Eliminativist Exit** | **Premise (1)**. Teleosemantics is wrong; there is no content. | **Everything.** You lose the explanatory power of intentional psychology. (You said you want to avoid this). |

  ### Recommendation for the Group

  Tell your friend this:
  The argument works only if we treat "Selection" as a holistic force that cares only about the whole organism's survival. But evolutionary biology treats selection as acting on **heritable variation in specific traits**.

  The chemotaxis mechanism varies independently of the metabolic mechanism. Therefore, its selection history is distinct. Its function is not "survival" (which is the function of the whole bug); its function is "gradient detection."

  **The Verdict:**
  Reject **(3)**. The "pile of effects" are not all *proper functions*. Most are side effects or ultimate consequences. The proper function is the specific causal contribution that explains the trait's proliferation.

  **Is the Consumer move relabeling?**
  Only if you refuse to look at the biology. If you acknowledge that the flagellar motor has a specific job (switching rotation) that is distinct from the bacterium's job (surviving), then anchoring content to the motor's needs is a substantive constraint, not a label. It ties content to **success conditions** internal to the system, not just external fitness.

  **One final warning:**
  Your friend's use of the bacterium is clever because the system is simple. But that simplicity is also its weakness. In a bacterium, the "consumer" (the motor) is physically coupled to the "producer" (the receptor) almost instantly. This makes the "function" very narrow (switch rotation). If the argument works for the bacterium, it actually *supports* teleosemantics, because it shows content can be grounded in very specific, non-magical mechanical functions. The indeterminacy your friend fears ("nutrients" vs "survival") is resolved by the mechanics: the motor doesn't care about survival, it cares about phosphorylation levels. That *is* the content.

  Don't give up (1). Make them prove that selection history *cannot* individuate traits. That's a much harder bar to clear than showing survival is holistic.
