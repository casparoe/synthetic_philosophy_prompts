answer: |-
  Defining life is less like drawing a boundary around a natural kind and more like trying to nail a cloud to a wall; the tension lies between wanting a definition that captures the *process* of living (which allows for viruses and evolution) versus one that captures the *substance* of living (which demands a cell membrane and metabolism), all while acknowledging that any hard line we draw will inevitably sever a historical continuum that began with chemistry and only gradually became biology.

  ### Tier 1: The Most Defensible
  **(c) Darwinian: a system capable of evolution by natural selection.**
  This criterion best aligns with actual biological practice by focusing on lineage and adaptation rather than static traits, cleanly excluding non-evolving chemical cycles.
  *   **Strained by:** The self-replicating computer program (which satisfies the logic of selection without being biological).

  ### Tier 2: Philosophically Robust but Narrow
  **(b) Self-maintenance: a network that continuously rebuilds its own boundary against decay.**
  This captures the intuitive distinction between an organism and a machine by demanding internal autonomy, but it relies on a topological boundary that is hard to define in edge cases.
  *   **Strained by:** Viruses (which are biologically potent but lack the machinery to maintain their own boundaries).

  **(f) Improbability/Assembly Depth: life is a matter of improbability based on steps of prior selection.**
  This view successfully quantifies the historical contingency required for biology, filtering out simple dissipative structures that lack a deep evolutionary pedigree.
  *   **Strained by:** Mitochondria (which have high assembly depth but are now dependent parts rather than independent wholes).

  ### Tier 3: Substrate-Neutral but Over-Inclusive
  **(e) Informational: anything that stores and copies heritable information.**
  This definition usefully highlights the role of genetics in biology, but it detaches life too easily from the physical chemistry that grounds it.
  *   **Strained by:** A self-replicating computer program (which stores information but lacks physical metabolism).

  ### Tier 4: Pedagogical but Ontologically Weak
  **(a) The textbook checklist: reproduces, grows, responds to stimuli, metabolizes, and so on.**
  This approach is useful for teaching introductory students but fails as a philosophical tool because it treats life as a box of traits rather than a continuous state.
  *   **Strained by:** Viruses (which reproduce and evolve but fail the metabolism and growth criteria).

  ### Tier 5: The Least Defensible
  **(d) Thermodynamic: a dissipative structure that holds itself far from equilibrium and exports entropy.**
  While physically true of all living things, this definition is too broad to be useful because it categorizes non-living physical phenomena as alive.
  *   **Strained by:** A flame (which metabolizes fuel and maintains equilibrium but is clearly not alive).

  ***

  ### On Criterion (f): Assembly Depth
  Where (f) really belongs is not as a standalone competitor to the Darwinian view, but as its **historical signature**. It is essentially a dressed-up version of **(c) Darwinian**, because "steps of prior selection" *are* the mechanism of natural selection measured retrospectively. It adds value by offering a metric for *degrees* of aliveness (a virus has less assembly depth than a bacterium), but it is not distinct in principle; without the Darwinian engine, assembly depth is just complexity, and with it, it is merely the fossil record of evolution.

  ### Confidence Calibration
  I am **moderately confident** in this ranking as a whole, specifically because the Darwinian definition has become the dominant consensus in philosophy of biology for its ability to handle lineage. However, I am **least sure** about the relative placement of **(b) Self-maintenance** versus **(f) Assembly Depth**; while I ranked them in the same tier, there is a genuine philosophical dispute over whether *current autonomy* (autopoiesis) is more fundamental than *historical origin* (evolution), and reasonable arguments exist for swapping their priority depending on whether you value the *state* of the organism or its *history*.
