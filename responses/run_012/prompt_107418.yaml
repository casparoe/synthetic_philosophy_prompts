answer: |-
  Here is the specification you asked for. This is not a solution; it is the engineering document for what a solution must build. If a theory cannot meet these specs, it is not resolving the paradox; it is dissolving the puzzle by changing the subject.

  ### Part 1: The Spec (Desiderata)

  A viable theory must satisfy the following requirements. I have categorized them by the specific case or distinction that forces them onto the list.

  #### A. The Case Requirements
  1.  **The Five-Day Viability Condition**
      *   **Requirement:** The theory must allow the exam to occur on Wednesday (or any day except the last) and constitute a genuine surprise.
      *   **Why:** This is the phenomenological datum. If your theory concludes "The exam cannot happen," you have solved a logic puzzle but failed to explain the classroom reality. The theory must accommodate the *actual outcome* of the story.
  2.  **The One-Day Inconsistency Constraint**
      *   **Requirement:** The theory must explicitly identify why the logic collapses in the one-day case ("Surprise exam tomorrow") while potentially surviving in the five-day case.
      *   **Why:** In the one-day case, the backward induction is zero steps. If the student knows the teacher is truthful, the student knows the exam is tomorrow. Therefore, it is not a surprise. Therefore, the teacher lied. A theory that treats the one-day and five-day cases identically misses the structural role of the induction chain.
  3.  **The Single-Student Epistemic Isolation**
      *   **Requirement:** The theory must account for why the paradox persists even if only one student hears the announcement, provided that student believes the teacher.
      *   **Why:** This rules out solutions that rely on "classroom dynamics" or "information leakage between students." The paradox is internal to the knower, not social.
  4.  **The Truthful-vs-Joker Variable**
      *   **Requirement:** The theory must distinguish between a teacher who *is* truthful and a teacher who is *believed* to be truthful.
      *   **Why:** If the teacher is a known joker, the student's reasoning ("He won't do it") is pragmatic, not logical. A resolution must hold even when the teacher's veracity is an axiom, not a guess.
  5.  **The Principal Backup (Common Knowledge) Condition**
      *   **Requirement:** If the Principal confirms the Teacher's announcement, the theory must treat the announcement as **Common Knowledge** (I know that you know that I know...), not just mutual knowledge.
      *   **Why:** This blocks the "The student didn't really believe the teacher" escape hatch. If the Principal backs it, the announcement becomes part of the shared epistemic framework. A solution that relies on the student doubting the source fails here.
  6.  **The Two-Teachers Conflict**
      *   **Requirement:** If two teachers announce surprise exams for the same week, the theory must predict whether one, both, or neither can succeed.
      *   **Why:** This tests the theory's handling of **competing constraints**. If "surprise" is a resource that gets used up, the theory must quantify it. If it's purely logical, two announcements should create a contradiction that prohibits *both* exams.

  #### B. The Distinction Requirements
  7.  **Derivability vs. Knowledge**
      *   **Requirement:** The theory must distinguish between "It is logically derivable that the exam is on Friday" and "The student *knows* the exam is on Friday."
      *   **Why:** This is the **Logical Omniscience** trap. Just because a conclusion follows from premises doesn't mean the agent has performed the deduction. A solution that conflates logical consequence with psychological knowledge is dead on arrival.
  8.  **Truth vs. Known Truth**
      *   **Requirement:** The theory must separate the proposition "The announcement is true" from "The student knows the announcement is true."
      *   **Why:** This addresses the **Factivity** problem. The teacher can be right (Truth) even if the student cannot establish that rightness (Known Truth) until after the fact.
  9.  **Fact Surprise vs. Timing Surprise**
      *   **Requirement:** The theory must specify whether the surprise concerns the *occurrence* of the exam or the *day* of the exam.
      *   **Why:** Standard setup is Timing Surprise. If a theory resolves the paradox by saying "The student knew there would be an exam, just not when," it must justify why that counts as satisfying the teacher's "You won't be able to predict" clause.
  10. **Ideal Reasoner vs. Believed Reasoner**
      *   **Requirement:** The theory must state whether the student *is* an ideal reasoner or merely *believes* he is one (or believes the teacher thinks he is).
      *   **Why:** This is the **Self-Reference** hook. If the student is ideal, the paradox is a contradiction in the world. If the student merely believes he is ideal, the paradox is a delusion. The spec demands you pick one and stick to it.

  ---

  ### Part 2: The Tension (Satisfiability)

  Your hunch is correct. There is a genuine tension, and it centers on the **One-Day Case**.

  **The Unsatisfiable Trinity:**
  In the one-day version, you cannot jointly hold:
  1.  **Consistency:** The announcement is logically consistent.
  2.  **Ideal Reason:** The student is an ideal reasoner (closed under deduction).
  3.  **Known Veracity:** The student *knows* the teacher is telling the truth.

  If the student *knows* the teacher is truthful, and the teacher says "Surprise exam tomorrow," and there is only one day:
  *   The student deduces: "Exam is tomorrow."
  *   Therefore, it is not a surprise.
  *   Therefore, the teacher's statement is false.
  *   Contradiction with (3).

  **The Five-Day Escape:**
  In the five-day version, this trinity *can* hold, but only if the theory breaks the **Backward Induction Chain** at the very last link (Friday).
  *   The student cannot know on Thursday night that the exam is Friday, *unless* the student knows the exam hasn't happened Mon-Thu.
  *   But to know it hasn't happened Mon-Thu, the student must have survived the elimination of those days.
  *   Most robust theories (like the Epistemic Blindspot theory) argue that the statement "The exam will be on Friday and you won't know it" is a **Moore Sentence** (true but unknowable).
  *   So, in the 5-day case, the announcement is *true*, the student is *ideal*, and the student *knows the teacher is truthful*, but the student **cannot know the announcement is true** until Thursday night.

  **Verdict:** The requirements are jointly satisfiable in the 5-day case *only if* you accept that some truths are unknowable until they become past tense. They are **not** satisfiable in the 1-day case without redefining "knowledge" or "surprise."

  ---

  ### Part 3: Non-Negotiables vs. Camp Preferences

  **Non-Negotiable (The Hard Constraints):**
  *   **The Exam Happens:** Any theory that concludes "No exam occurs" fails the phenomenological spec.
  *   **The Surprise Happens:** Any theory that concludes "The student knew it was Wednesday" fails the phenomenological spec.
  *   **Classical Logic:** Unless you are writing for a paraconsistent logic journal, you cannot simply say "The law of non-contradiction doesn't apply here."
  *   **Factivity of Knowledge:** You cannot say "The student knew it was Wednesday, but it wasn't." (You can't know falsehoods).

  **Camp Preferences (The Negotiables):**
  *   **Logical Omniscience:** Epistemologists will fight over whether "Ideal Reasoner" implies knowing all logical consequences immediately. You can drop this to save the paradox (the "Bounded Rationality" camp).
  *   **The Definition of 'Predict':** Does predict mean "deduce with certainty" or "assign high probability"? (The Probabilistic camp).
  *   **Self-Reference:** Does the announcement refer to the student's knowledge *including* the knowledge of the announcement itself? (The Self-Referential camp).

  ---

  ### Part 4: The Killer Requirement

  You asked which single requirement kills the tidy answers (the "Teacher Lied" crowd and the "Student is Silly" crowd).

  **The Killer is: The Felicity Condition.**

  This is the requirement that **The Announcement Must Be Assertible at the Time It Is Made.**

  *   **Why it kills "The Teacher Lied":** If the teacher lied, the announcement was false. But if it was false, the teacher should not have been able to assert it as a rule of the class without violating the norms of communication. A solution that says "The teacher lied" makes the teacher irrational or deceptive in a way that undermines the setup (which usually assumes a cooperative context).
  *   **Why it kills "The Student is Silly":** If the student's reasoning is simply flawed, then the announcement *was* assertible and true. But the student's reasoning uses standard modal logic (Knowledge Distribution, Factivity, etc.). To call the student silly, you must claim standard logic fails in epistemic contexts. The Felicity Condition forces you to admit: The teacher spoke properly, the student reasoned properly, yet the conclusion is impossible.

  The Felicity Condition forces the theory to confront **Performativity**: The act of announcing the exam changes the conditions required for the exam to be a surprise. A theory that ignores this is just doing logic puzzles, not analyzing the paradox.

  ---

  ### Part 5: The "Redefining Surprise" Trap

  You asked to flag if a candidate theory quietly redefines surprise. **Almost all of them do.** Here is how to spot it in the wild so you can call it out:

  1.  **The Probabilistic Shift:** If the theory says "Surprise means probability < 50%," it has redefined surprise from **Epistemic** (I don't know) to **Statistical** (It's unlikely). This dissolves the paradox but changes the subject. The student in the story doesn't care about odds; they care about deduction.
  2.  **The Temporal Shift:** If the theory says "Surprise means you don't know *until* the morning of," it smuggles in a time delay that wasn't in the original "night before" constraint.
  3.  **The Knowledge Shift:** If the theory says "You can know it's Friday, but you can't *know that you know* it's Friday" (Higher-Order Ignorance), it has redefined knowledge to save the surprise. This is a valid philosophical move (Williamson etc.), but you must explicitly state: **"This solution saves the paradox by downgrading what 'knowing' means."**

  **Summary for your column:**
  The paradox survives because we want three things that don't fit: A truthful teacher, a logical student, and a surprise exam. The 1-day case proves they don't fit. The 5-day case hides the misfit behind a chain of reasoning. Any theory that claims to resolve it must tell you which of those three you have to give up, or explain how "Knowledge" is the slippery variable that allows them to coexist. If they don't do that, they're just waving hands.
