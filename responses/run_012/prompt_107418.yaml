      *   Did I address the hunch? (Yes, 1-day is the inconsistency core).
      *   Did I identify the "Redefining Surprise" move? (Yes).
      *   Did I identify the "Killer Requirement"? (Yes).

      *Let's refine the "Killer Requirement".* The tidy answers are: 1. The announcement is false (Self-Refutation). 2. The student is wrong (Flawed Reasoning).
      To kill #1: We need the requirement that **The Announcement Can Be True.**
      To kill #2: We need the requirement that **The Reasoning Is Valid.**
      The requirement that forces the paradox to *remain* a paradox (and thus kills the tidy dissolutions) is **The Requirement of Epistemic Consistency.** The theory must show how a statement can be *known to be true* without its *content being known to be true* until the event occurs.
