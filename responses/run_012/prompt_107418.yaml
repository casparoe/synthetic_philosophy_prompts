      *   **Topic:** The Surprise Exam Paradox (also known as the Unexpected Hanging Paradox).
      *   **Goal:** They are stuck on writing a column. They don't want "the solution." They want the *specification* (the desiderata) for a valid resolution. They want to know what a theory *must* deliver to count as a resolution.
      *   **Specific Requirements:**
          *   List the desiderata (what a theory must achieve).
          *   Cover specific variations (5-day, 1-day, single student vs. class, truthful vs. joker teacher, principal backup, two teachers).
          *   Cover specific distinctions (derivability vs. knowledge, truth vs. known truth, fact vs. timing surprise, ideal reasoner vs. belief).
          *   Explain *why* each requirement is on the list (which case forces it).
          *   Address satisfiability: Are any jointly unsatisfiable? (Specifically the hunch about the 1-day case).
