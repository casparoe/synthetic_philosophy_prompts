      Answer: **The requirement that the announcement be *felicitous* (properly assertible) at the moment of utterance.**
      Why? If it's felicitous, it can't be simply false (killing Answer 1). If it's felicitous, the student is rational to accept it, making their reasoning hard to dismiss as silly (killing Answer 2). It forces the theory to deal with the *performative* contradiction.

