      *   *What about C7 (Suffering)?* Consistent with C1 (Deprivation of *good*). If future is bad, deprivation is good.

      *   *Wait, one more subtle tension:* C8 (Grief is for *them*) vs C2 (No *them*). If grief is rational because *they* suffered a loss (C1), that works. But if C2 says "no you to be on the receiving end," does that undermine the object of grief? No, because the loss is a fact about their life narrative, not a current state. But C9 (Posthumous wrongs) makes this trickier. If they can be wronged, they have interests. If they have interests, do they have a "subject" status?
      *   *Okay, stick to the big one: C2 vs C9.*

  7.  **Final Polish:**
      *   Ensure tone is helpful for a novelist, not just a philosopher.
