      *   **C4 (Anti-Symmetry):** Pre-birth non-existence isn't the same as post-death non-existence (goods before birth weren't ours to lose).
      *   **C5 (Atemporal Badness):** The badness isn't located at a time/moment; it makes the *life as a whole* worse (holistic comparison).
      *   **C6 (Broken Promise Analogy):** Badness is a relation between you and the life you didn't get, not a state you're in.
      *   **C7 (Benefit Condition):** If future is suffering, death is a benefit (consistent with C1).
      *   **C8 (Rational Grief):** Grief is for the dead person, not just survivors (implies death is objectively bad for them).
      *   **C9 (Posthumous Harm):** Dead can be wronged (betrayal of wishes, reputation).

  3.  **Identify Tensions/Conflicts:**

      *   *Tension A: C2 (Nothing bad after death) vs. C9 (Posthumous Harm).*
