  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Archaeologist + Philosophy of Science (10 years trench + logic of inference).
      *   **Task:** Write desiderata for a theory of inference from material remains to past beliefs/institutions (not just subsistence).
      *   **Audience/Purpose:** Defend claims before an adversarial panel (rivals, regulators, descendant communities with different ontologies).
      *   **Process:**
          1.  Brainstorm candidate requirements (including rejected ones).
          2.  Prune the list (explain why).
          3.  Build the final list around 5 specific cases provided.
          4.  Address specific distinctions (did vs. intended vs. believed, individual vs. shared, ritual vs. mundane, emic vs. etic, absence vs. evidence of absence, pattern vs. label).
          5.  Identify conflicts/incompatibilities among desiderata.
          6.  Name the single most eliminative requirement.
          7.  Format: Numbered list, short table (Non-negotiable vs. Camp-specific), under 1,500 words.
          8.  Constraints: No citations, no names, no reading lists.

  2.  **Deconstruct the Cases:**
      1.  *Lake vessels:* Ritual offering vs. discard? (Lack of refuse suggests non-domestic, but could be specialized production waste).
      2.  *Clay figurines:* Shrine vs. workshop discard? (Uniformity suggests mass production, arrangement suggests intent).
      3.  *Central building:* Redistribution/Authority vs. communal storage? (Monumentality implies labor coordination).
      4.  *Empty cemetery:* Egalitarian vs. perishable goods vs. different mourning practices? (Absence of evidence).
      5.  *Decayed site:* Silence vs. accusation of non-interpretation? (Limits of inference).

  3.  **Brainstorming Requirements (Mental Draft):**
      *   Must account for preservation bias.
      *   Must distinguish intention from outcome.
      *   Must be falsifiable (Popperian?).
      *   Must be usable by descendants (Public archaeology?).
      *   Must avoid equifinality (multiple causes, same effect).
      *   Must respect emic categories (Indigenous ontology).
      *   Must allow for probabilistic claims, not certainty.
      *   Must explain absence (Case 4).
      *   Must allow silence (Case 5).
      *   Must link material to cognitive states (Hard problem).
      *   Must be consistent with formation processes.
      *   Must avoid presentism.

  4.  **Pruning & Philosophy:**
      *   *Reject:* "Must be falsifiable in the strict logical sense." Why? Archaeological hypotheses are often abductive/inferential to the best explanation, not deductive laws. Strict falsification kills useful probabilistic inference.
      *   *Reject:* "Must recover the exact emic meaning." Why? Impossible without texts. We can infer function/intent, but not the specific mythological content. This is a preference of hermeneutic archaeology, not a logical necessity.
      *   *Reject:* "Must produce a definitive narrative." Why? Case 5 shows silence is valid.
      *   *Keep:* "Must address equifinality." (Non-negotiable).
      *   *Keep:* "Must distinguish preservation from behavior." (Non-negotiable).
      *   *Keep:* "Must be intelligible to non-specialists." (Non-negotiable per prompt's purpose).

  5.  **Addressing Distinctions:**
      *   *Did vs. Intended vs. Believed:* Must keep separate. Action (did) is visible; Intent is inferred from pattern; Belief is the hardest layer (requires linking intent to cosmology).
      *   *Individual vs. Shared:* Must distinguish. One figurine = individual; Rows = institutional/shared.
      *   *Ritual vs. Mundane:* Do not collapse. But acknowledge the boundary is fuzzy. Require evidence of deviation from norm.
      *   *Emic vs. Etic:* Keep distinct. We speak etic, but must check against descendant emic ontologies where possible. Do not impose etic categories as emic facts.
      *   *Absence vs. Evidence of Absence:* Critical distinction. Requires taphonomic proof.
      *   *Pattern vs. Label:* Pattern is data; Label is theory. Must not confuse them.

  6.  **Conflicts/Incompatibilities:**
      *   *Precision vs. Accessibility:* High technical nuance vs. clear communication to descendants.
      *   *Silence vs. Accountability:* Saying "we don't know" (Case 5) vs. satisfying the panel's demand for heritage value.
      *   *Emic Respect vs. Etic Analysis:* If descendants say "this is sacred" but data says "workshop", who wins? The theory must navigate this without collapsing.

  7.  **Most Eliminative Requirement:**
      *   "Must resolve equifinality regarding cognitive states." This kills most purely stylistic or functionalist theories that assume form = meaning directly.

  8.  **Drafting the Content (Iterative refinement for word count and tone):**
      *   *Tone:* Professional, rigorous, slightly weary but precise (archaeologist-philosopher).
      *   *Structure:*
