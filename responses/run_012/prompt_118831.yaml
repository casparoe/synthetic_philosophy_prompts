      *Refining the Prune:*
      Candidate: "Must be falsifiable." Reject: Archaeological inference is abductive, not deductive.
      Candidate: "Must recover emic meaning." Reject: Epistemically impossible without texts; imposes modern ontology.
      Candidate: "Must maximize interpretive confidence." Reject: Case 5 shows silence is valid.

      *Refining Desiderata:*
