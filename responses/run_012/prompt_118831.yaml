answer: |-
  **Purpose:** To specify the logical requirements for inferring past beliefs and institutions from material remains, sufficient to defend claims before an adversarial panel comprising rivals, regulators, and descendant communities.

  ### Brainstorming and Pruning

  **Candidate Requirements Generated:**
  1.  Must be strictly falsifiable.
  2.  Must recover the exact emic meaning of artifacts.
  3.  Must account for preservation bias.
  4.  Must distinguish action from intention.
  5.  Must produce a usable narrative for heritage management.
  6.  Must allow for epistemic silence.
  7.  Must resolve equifinality (multiple causes, same effect).
  8.  Must align with descendant ontologies.
  9.  Must quantify uncertainty.

  **Pruning Decisions:**
  *   **Reject "Strictly falsifiable."** Archaeological inference is abductive (inference to the best explanation), not deductive. Demanding strict falsification eliminates probabilistic reasoning necessary for fragmented records.
  *   **Reject "Recover exact emic meaning."** This is epistemically impossible without texts. It is a hermeneutic preference, not a logical requirement. We can infer function and intent, not specific mythological content.
  *   **Reject "Produce usable narrative."** While desirable for regulators, forcing a narrative contradicts Case 5 (the decayed site). A theory must license silence when evidence fails.
  *   **Reject "Align with descendant ontologies."** While ethical, a theory of *inference* cannot mandate ontological alignment as a truth condition. It must, however, allow for translation between ontologies.

  ### Final Desiderata

  1.  **Taphonomic Independence:** The inference must demonstrate that the pattern is not solely the product of preservation bias or natural formation processes.
      *   *Consideration:* Case 1 (vessels) and Case 4 (empty graves). Without ruling out decay or selective survival, behavioral claims are unfounded.
      *   *Source:* Demand of evidence (formation processes).
  2.  **Equifinality Resolution:** The theory must identify why competing explanations (e.g., shrine vs. workshop discard) are less probable than the proposed claim.
      *   *Consideration:* Case 2 (figurines) and Case 3 (central building). Uniformity could imply mass production or ritual standardization.
      *   *Source:* Demand of evidence (underdetermination of meaning).
  3.  **Scale Sensitivity:** The inference must distinguish between individual actions and institutional patterns based on spatial and quantitative magnitude.
      *   *Consideration:* Case 2 (rows of figurines) vs. a single find. Institutional claims require evidence of coordination beyond individual capacity.
      *   *Source:* Demand of evidence (logical scope).
  4.  **Negative Inference Protocol:** Claims based on absence (Case 4) must provide positive evidence that preservation conditions allowed for recovery had the material existed.
      *   *Consideration:* Case 4 (egalitarian cemetery). Absence of goods is only evidence of absence if taphonomy is controlled.
      *   *Source:* Demand of evidence (preservation bias).
  5.  **Epistemic Humility:** The theory must license a conclusion of "unknown" when chronological resolution or preservation precludes inference.
      *   *Consideration:* Case 5 (decayed site). Refusing to interpret is a valid scientific outcome when signal-to-noise ratio is too low.
      *   *Source:* Demand of evidence (chronological resolution).
  6.  **Ontological Translation:** The claim must be translatable into the categories of the descendant community without asserting their ontology is identical to the archaeological construct.
      *   *Consideration:* Panel requirement. We must communicate without imposing etic categories as emic facts.
      *   *Source:* Import (public accountability).

  ### Rulings on Distinctions

  *   **Did vs. Intended vs. Believed:** **Keep Separate.** Action (did) is visible in wear patterns; intention is inferred from deviation from norms (Case 1); belief is a further inferential leap linking intention to cosmology. Collapsing them confuses behavior with theology.
  *   **Individual vs. Shared/Institutional:** **Keep Separate.** Case 2 shows rows (shared); a single figurine implies individual. Institutional claims require evidence of labor coordination (Case 3).
  *   **Ritual vs. Mundane:** **Keep Separate, but Relational.** Do not define ritual by essence, but by deviation from domestic norms (e.g., lack of food refuse in Case 1). Collapsing them renders "ritual" meaningless.
  *   **Emic vs. Etic:** **Keep Separate.** We construct etic models to explain data; we consult descendants for emic continuity. Never present an etic model as an emic fact.
  *   **Absence of Evidence vs. Evidence of Absence:** **Keep Separate.** Critical distinction. Absence of evidence is null; evidence of absence requires taphonomic proof (Case 4).
  *   **Pattern vs. Label:** **Keep Separate.** The arrangement of vessels is the pattern; "offering" is the label. The theory must link them explicitly, not implicitly.

  ### Conflicts and Eliminative Power

  **Incompatible Desiderata:**
  *   **Ontological Translation vs. Equifinality Resolution:** A descendant community may assert a specific meaning (e.g., "these are ancestors") that resolves equifinality for them but lacks material corroboration for the archaeologist. The theory cannot satisfy both strict material verification and ontological authority simultaneously. The conflict bites where heritage value demands certainty that the data cannot support.
  *   **Epistemic Humility vs. Panel Utility:** Regulators often require definitive claims for protection status. Case 5 shows that silence is scientifically valid but administratively difficult. The theory cannot guarantee both scientific integrity and regulatory utility in low-data contexts.

  **Single Most Eliminative Requirement:**
  **Equifinality Resolution regarding cognitive states.**
  This eliminates theories that assume a direct mapping between form and meaning (e.g., "figurines always equal goddess worship"). It kills stylistic seriation used as cultural diagnosis and functionalist assumptions that ignore symbolic redundancy. It demands that any claim about belief must actively disprove a mundane alternative.

  ### Requirement Classification

  | Requirement | Classification | Reason |
  | :--- | :--- | :--- |
  | **Taphonomic Independence** | Non-negotiable | Physical necessity; without it, data is noise. |
  | **Equifinality Resolution** | Non-negotiable | Logical necessity; prevents wishful thinking. |
  | **Scale Sensitivity** | Non-negotiable | Logical necessity; prevents over-generalization. |
  | **Negative Inference Protocol** | Non-negotiable | Logical necessity; prevents false negatives. |
  | **Epistemic Humility** | Non-negotiable | Scientific integrity; acknowledges limits (Case 5). |
  | **Ontological Translation** | Camp-specific | Ethical/Political preference; varies by jurisdiction. |
