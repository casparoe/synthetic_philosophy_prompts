      *Check:* Did I include the table? Yes. Did I name the single eliminative requirement? Yes. Is it under 1500 words? I need to monitor this closely.

      *Re-evaluating the "Brainstorm" section:* The prompt says "Begin by brainstorming... then prune. Say what you pruned and why". This needs to be distinct from the final list.

