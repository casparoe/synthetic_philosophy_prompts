      *   *Word Count Check:* Need to be concise. Avoid fluff.

      *   *Refining the Prune:* Make sure the rejection reasons are philosophical (logic of inference) not just practical.
      *   *Refining the Cases:* Ensure each case is referenced in the desiderata generation.
      *   *Refining the Distinctions:* Be decisive.

      *(Self-Correction during drafting)*: I need to make sure I don't just list the requirements but explain the *consideration* behind each as requested ("with the consideration behind each requirement"). I also need to ensure the "Brainstorm/Prune" section is visible before the final list.

      *Plan:*
