answer: |-
  In a municipal zoning office, a planner approves a routine, merited permit for a local developer. In Arm A, the developer, a stranger to the planner, delivers a publicly logged $500 gift basket to the planner's office the next day as a standalone gesture of thanks, with no prior or future interaction expected. In Arm B, the developer, who is the planner's longstanding neighbor and friend, delivers an identical publicly logged $500 gift basket to the planner's office the next day as part of an annual holiday exchange tradition, with no explicit discussion of future permits. In both cases, the permit was merited, the value is identical, the beneficiary is the planner, the institution's output is unchanged, and the transfer is fully transparent with no explicit *quid pro quo*.

  **The Check**

  **The Case:** The scenario isolates whether corruption resides in the transaction itself or the social fabric surrounding it.

  **The Standards:**
  1.  **Rule-and-public-office:** This standard views public office as a trust requiring impartiality and adherence to formal codes. Since most codes ban gifts from external agents regardless of intent to prevent even the appearance of impropriety, this standard delivers an **identical** verdict: both arms are corrupt violations of duty.
  2.  **Relational/Reciprocity:** This standard distinguishes between market exchange (buying influence) and gift exchange (maintaining social bonds). It delivers an **opposite** verdict: Arm A is corrupt (a bribe disguised as thanks) because it lacks social context, while Arm B is permissible (a gift) because it sustains an existing, non-instrumental relationship.
  3.  **Critical/Privilege:** This standard views both acts as mechanisms of elite access that bypass formal queues. It delivers an **identical** verdict: both arms are corrupt because they allow private wealth to flow to public officials, reinforcing class privilege regardless of the relationship's history.

  **The Feature:** The **reciprocation horizon** (one-off vs. ongoing) is the sole variable doing the work. It determines whether the transfer is interpreted as a price (Arm A) or a present (Arm B). If you remove this feature—making both arms one-off transactions or both arms part of ongoing traditions—the Relational standard collapses, rendering the two arms morally indistinguishable under all three frameworks.

  **The Critique:** The **Rule-and-public-office standard** fares worst here, as it fails to distinguish between a bribe and a birthday present, treating a moral nuance as a legal binary. Its defender would attack the case as **rigged**, arguing precisely on the point of publicity: "You assume logging the gift neutralizes the obligation, but an ongoing relationship creates an invisible debt that publicity cannot cure. By stipulating the permit was 'merited,' you hide the fact that Arm B ensures the planner prioritizes the neighbor's *future* unmerited permits over a stranger's. The case rigs the welfare analysis by ignoring the welfare cost to third parties waiting in line behind the friend."
