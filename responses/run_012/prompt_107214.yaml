answer: |-
  Your dormant reason is not a genuine third position but rather the precise fault line where internalism either stabilizes through idealization or collapses into externalism.

  The genuine disagreement between internalism and externalism concerns the source of normativity, not merely the presence of motivation. Internalism claims that for a consideration to be a reason, it must be grounded in the agent's subjective motivational set, making normativity contingent on psychology; externalism claims reasons exist independently of an agent's contingencies, grounded instead in objective values or facts. The stakes are intelligibility versus authority: internalists argue a reason that cannot possibly motivate is inert and unintelligible as a guide for action, while externalists argue that internalism makes normativity too fragile, allowing agents to simply lack reasons for doing what is objectively right or prudent.

  Your dormant reason fits squarely within the internalist tradition, specifically Bernard Williams' notion of a "sound deliberative route," which grants agents reasons they would accept after correcting factual errors or imagining outcomes accurately. However, this is not a stable third option because it relies on a counterfactual: if the "better deliberation" required to surface the reason involves a radical shift in values rather than just factual correction, the view ceases to be internalist. Consequently, your concept does not change the debate but rather exposes the vagueness in internalism's deliberative criterion, showing that internalism only survives by smuggling in externalist standards of rationality to validate the "better" deliberation.
