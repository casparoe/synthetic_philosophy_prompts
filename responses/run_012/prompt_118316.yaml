answer: |-
  ### Menu of Interpretations: The Golden Rule in the One-Shot Prisoner's Dilemma

  Below are the distinct principles the slogan may express, ordered from normatively empty (in this context) to substantively strong. Each entry includes the commitment, plausibility, and a specific verdict on whether it mandates cooperation in a one-shot Prisoner's Dilemma (PD) against a stranger.

  #### 1. Empirical Prediction (Evolutionary Selection)
  *   **The Principle:** "Strategies that follow this rule prosper in the long run."
  *   **Commitment:** A descriptive claim about population dynamics. It asserts that groups or lineages adhering to the rule outcompete those that do not.
  *   **Plausibility:** High. Evolutionary game theory shows cooperative norms often stabilize in populations over time.
  *   **Verdict on One-Shot PD:** **No.** This is a category error. Even if cooperators win in the long run, this does not tell a rational individual what to do in a specific, terminal interaction *now*. It explains why you might *feel* inclined to cooperate, but it does not justify cooperation as a rational choice in the isolated case.
  *   **Does it settle the case?** No. It explains the existence of the instinct, not the rationality of the act.

  #### 2. Norm of Reciprocity (Strategic)
  *   **The Principle:** "Cooperate because the other party will return the favour in a later interaction."
  *   **Commitment:** Conditional cooperation based on the shadow of the future. It treats the rule as a heuristic for iterated games.
  *   **Plausibility:** High in repeated interactions; standard game-theoretic reasoning.
  *   **Verdict on One-Shot PD:** **No.** By definition, a one-shot PD has no future interaction. There is no mechanism for reward or punishment. A strictly reciprocal agent must defect.
  *   **Does it settle the case?** No. It is factually inapplicable to the scenario your friend described.

  #### 3. The Negative Form (The Silver Rule)
  *   **The Principle:** "Refrain from treating others as you would *not* want to be treated."
  *   **Commitment:** A constraint on harm rather than a command to benefit. It forbids actions you would resent experiencing.
  *   **Plausibility:** Intuitively strong as a baseline moral constraint; easier to universalize than positive aid.
  *   **Verdict on One-Shot PD:** **Ambiguous/No.** This depends on whether defection counts as "harm" or merely "withholding benefit."
      *   If you view defection as actively harming the other (reducing their payoff relative to baseline), the rule forbids it.
      *   If you view defection as merely refusing to gift utility (you wouldn't *demand* they cooperate with you, so you don't owe them cooperation), the rule permits it.
      *   *Distinction:* Unlike the positive form, this does not demand you actively improve their outcome, only that you avoid worsening it. In a PD, mutual defection is worse than mutual cooperation, but is *my* defection a violation? Most strict readings suggest it forbids active aggression, not strategic self-protection.
  *   **Does it settle the case?** No. It is too weak to mandate the positive act of cooperation in a high-stakes dilemma.

  #### 4. Superrationality (Logical Correlation)
  *   **The Principle:** "Assume that any agent reasoning exactly as you do will arrive at the same choice; maximize your payoff under that assumption."
  *   **Commitment:** You treat your decision as logically correlated with the other's decision, not causally. You choose the action that yields the best result *given* that the other player is a mirror of your reasoning process.
  *   **Plausibility:** Controversial. It conflicts with Causal Decision Theory (which says my choice cannot causally affect a stranger's simultaneous choice) but aligns with Evidential or Functional Decision Theory.
  *   **Verdict on One-Shot PD:** **Yes.**
      *   If I Cooperate, the other (reasoning identically) Cooperates. Payoff: High.
      *   If I Defect, the other (reasoning identically) Defects. Payoff: Low.
      *   Therefore, I Cooperate.
  *   **Does it require caring about the other?** **No.** This is the crucial distinction from empathy. A purely selfish agent who believes their reasoning is logically linked to the opponent's will cooperate to maximize *their own* payoff. It separates self-interest from altruism.
  *   **Does it collapse into Reciprocity?** **No.** Reciprocity relies on *causal* influence over time (I help you, so you help me later). Superrationality relies on *logical* correlation in the present (I help you because we are the same type of thinker). It works even in anonymous, one-shot cases.

  #### 5. Kantian Universalizability
  *   **The Principle:** "Act only on maxims that you can will to become a universal law."
  *   **Commitment:** A duty of consistency. You must be willing to live in a world where everyone acts on your proposed rule.
  *   **Plausibility:** High in deontological ethics; foundational to modern rights-based reasoning.
  *   **Verdict on One-Shot PD:** **Yes (with caveats).**
      *   *Contradiction in Conception:* If everyone defected, the concept of a "cooperative dilemma" might collapse (though in a one-shot PD, the game structure remains).
      *   *Contradiction in Will:* Could you rationally will a world where everyone defects? No, because you would be worse off. Therefore, you must will the maxim of cooperation.
      *   *Caveat:* This depends on how you formulate the maxim. If the maxim is "Defect when anonymous," a Kantian might argue this *can* be universalized without logical contradiction, merely undesirable outcomes. However, the standard Kantian reading forbids making oneself an exception to the rule of mutual aid.
  *   **Does it settle the case?** Yes, but it shifts the ground from "what pays" to "what is permissible."

  #### 6. Equal Weight (Empathy/Utilitarian)
  *   **The Principle:** "Give others' interests the same weight as one's own."
  *   **Commitment:** A transformation of the utility function. You no longer maximize *your* payoff; you maximize *joint* payoff.
  *   **Plausibility:** High as a moral ideal; low as a description of standard rational agency.
  *   **Verdict on One-Shot PD:** **Yes.** If you value the other's payoff equally to your own, the Prisoner's Dilemma disappears. The payoff matrix changes: (Cooperate, Cooperate) yields the highest utility for the "combined agent."
  *   **Does it settle the case?** Yes, but it dissolves the dilemma rather than solving it. It admits that cooperation is irrational for a *selfish* agent and argues you ought not to be selfish.

  ***

  ### Analysis of Your Friend's Position

  **Which reading did she likely have in mind?**
  Your friend argued: *"If everyone reasoned as she did everyone would be better off."*
  This is not the **Reciprocity** reading (no future mentioned) nor the **Equal Weight** reading (she didn't say "I care about them," she said "everyone would be better off").
  She is most plausibly using the **Superrationality** reading (logical correlation of reasoning) but conflating it with the **Kantian** reading (universalizability of the maxim). She is treating the Golden Rule as a heuristic for logical symmetry: *"Since I want to be cooperated with, and we are both rational, I must assume my reasoning dictates hers."*

  **Does the slogan settle the one-shot case on this reading?**
  **No, it merely sounds as though it does.**
  *   **The Illusion:** The slogan feels like a moral trump card. It suggests that cooperation is the "obvious" rational choice.
  *   **The Reality:** On the Superrational reading, cooperation is only rational if you accept the controversial premise that your decision is *evidence* of the other's decision (Evidential Decision Theory). Standard Causal Decision Theory (dominant in economics) rejects this: my choice cannot causally influence a stranger's simultaneous choice.
  *   **The Gap:** Your friend is smuggling in a metaphysical assumption (that reasoning is logically correlated across distinct minds) without defending it. If you reject superrationality and stick to standard causal rationality, the Golden Rule provides no leverage in a one-shot PD unless you also adopt the **Equal Weight** (altruistic) reading.

  **Summary Verdict:**
  *   **Reciprocity:** False in one-shot.
  *   **Superrationality:** True *if* you accept non-causal decision theory (Selfish but cooperative).
  *   **Kantian:** True *if* you accept duty over outcome (Duty-bound).
  *   **Equal Weight:** True *if* you accept altruism (Altruistic).
  *   **Negative Form:** Too weak to mandate cooperation.

  Your friend's argument holds only if you grant her the Superrational or Kantian premise. If you insist on standard causal rationality without altruism, the proverb is a platitude that fails to engage the mechanics of the dilemma.
