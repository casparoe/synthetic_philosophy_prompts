answer: |-
  The smell of the Bureau was always the same: wet ink, cold metal, and the dust of erased pencil lines. Tomas sat at his drafting table, the overhead lamp casting a perfect circle of white light onto the grid paper. In his hand, he held a stencil, a thin sheet of brass cut with the outline of a human figure. Head, torso, two legs, no arms raised. Just a man standing. One unit.

  This was the Method. In the old days, before the Clarity reforms, a politician would stand at a podium and speak for an hour about "unprecedented growth" and "shared sacrifice." The workers would leave confused, or angry, or asleep. Now, they walked through the Hall of Facts. They saw a wall of blue men representing steel production. They saw a wall of red men representing grain harvest. They didn't need to speak the city's twelve dialects to understand that the blue wall was twice as high as the red. It was emancipation through geometry. It was truth without adjectives.

  Tomas loved it. He loved the way the noise of the world could be scrubbed away until only the countable remained.

  The dossier on his desk was thin. *District 9: Housing Reallocation.* The directive from the Director was typed on the cover sheet: *Visualize the transition. Emphasize continuity. Output required for Monday's exhibition.*

  Tomas opened the folder. The raw data was there, typed by the statisticians. 
  *Population Pre-Transition: 5,000.*
  *Population Post-Transition: 5,000.*
  *Housing Units Pre: 1,200.*
  *Housing Units Post: 1,200.*
  *Status: Relocated.*

  It was clean. It was ready for transformation. Tomas picked up his ink pad. He would need fifty rows of one hundred men each. Five thousand units. He would place them on the left side of the chart, standing in front of small house icons. Then, an arrow. Then, the same five thousand men on the right side, standing in front of new, larger house icons. The visual equation would be simple: Same People + Better Houses = Progress. A worker walking past would see it in three seconds. They would know they were being cared for.

  But there was a second sheet clipped to the back of the data log. It wasn't stamped *Official*. It was a memo from the Field Enumerator, a young woman named Kaela who still used words instead of numbers.

  *Note on District 9:* *Resistance encountered during Week 3. Barriers erected by residents. Force authorized for removal. Three casualties (fall-related). Personal property loss estimated at 80% due to transport limitations. Emotional distress: High.*

  Tomas stared at the word *Force*.

  He put down the stencil. The Method had rules. Rule One: No size variation. One man is one unit. You do not draw a giant man to represent a thousand workers, because size implies importance, and importance is not a fact. Rule Two: Physicalism only. You draw what can be touched. You do not draw "justice," or "freedom," or "fear." You cannot draw a soul. You cannot draw a god. You cannot draw a reason.

  You can draw a man. You can draw a house. You can draw an arrow indicating movement.

  You cannot draw a gun behind the man. You cannot draw the fear in his legs as he walks. You cannot draw the blood on the pavement from the "fall-related casualties" because dead men are not units of housing reallocation. If they are dead, they are no longer part of the population count. To include them would be to mix categories. To exclude them is to follow the protocol.

  Tomas looked at the blank grid. The temptation of the Method washed over him. He could make this clear. He could take this messy, bloody knot of a week and smooth it into a line that made sense. If he used words, he would have to argue. He would have to say "some were hurt" and someone would say "how many?" and someone else would say "was it necessary?" and the truth would dissolve in the debate. But if he drew the men... the men were there. They were accounted for. They were safe in ink.

  He picked up the stencil again. He pressed it onto the paper. *Thump.* One man. *Thump.* Two men.

  He worked through the first row. The rhythm was soothing. The black ink dried instantly. He reached the arrow phase. The standard arrow was a simple triangle, indicating flow. But here, the flow wasn't natural. It wasn't migration. It was eviction.

  Tomas stopped. He looked at the row of fifty little men. They were identical. Perfectly spaced. If he added a symbol for "force," what would it be? A baton? That was a physical object. But a baton implies a policeman. There were no policemen in the housing data. Only residents and units. If he drew a policeman, he was introducing a variable that wasn't in the header. He would be adding theory to the fact. He would be saying *this move was involuntary* without saying it.

  But if he didn't draw it, he was saying *this move was voluntary.*

  The lamp hummed. Outside the Bureau window, the city lights flickered. Somewhere out there, in District 9, there were fifty families unpacking boxes in rooms that smelled of fresh plaster and old fear. They knew what happened. If they walked into the Hall of Facts on Monday and saw the arrow of smooth transition, would they feel seen? Or would they feel erased?

  Tomas imagined an alternative. He could draw the men on the left side standing still. He could draw the men on the right side lying down. No, dead men aren't housing units. He could draw the men on the left with broken lines? No, line weight must be consistent. Variability introduces error.

  The system was designed to protect the viewer from the bias of the artist. It protected Tomas from himself, too. It stopped him from drawing a giant weeping woman to represent grief, because grief is not measurable. It forced him to stick to the bodies. But what if the truth wasn't in the bodies? What if the truth was in the space between them?

  He looked at the memo again. *Three casualties.*

  If he followed the strict physicalist rule, those three people ceased to exist the moment they died. They were no longer population. They were no longer housing units. They were matter out of place. The chart was about Housing Reallocation. Therefore, the dead are irrelevant to the chart.

  It was logical. It was consistent. It was hollow.

  Tomas dipped his pen in the black ink. He had a choice. He could leave the memo clipped to the back, hidden from the public view, known only to the statisticians. Or he could attach the memo to the wall next to the chart. But words on the wall defeated the purpose. The point was that the picture *was* the knowledge.

  He looked at the fifty little men in the first row. They were sturdy. They were clear. They promised a world where you could look at a wall and know exactly how much bread was baked, how much steel was poured, how many people were housed. It was a beautiful promise. A world without lies.

  But to keep the promise, he had to lie now.

  If he drew the arrow, he smoothed the violence. If he refused to draw the arrow, he broke the system, and the chart would be rejected, and another Transformer would draw it, and they would draw the arrow without hesitation.

  Tomas moved the stencil. He began the second row. *Thump. Thump. Thump.*

  He decided to add a footnote. Not on the chart. On the ledger. He would write the number three in the margin of the official log, next to the population count. *5,000 moved. 3 removed.* It wasn't visual. It wouldn't be on the wall. But it would be in the archive. Someone, someday, might add the numbers and wonder why they didn't match.

  He worked until his fingers were stained black. He finished the five thousand units. They marched across the paper in perfect rows, a silent army of ink. They looked happy, in the way that little ink men can look happy. They looked secure. They looked like the future.

  Tomas blew on the ink to dry it. He clipped the memo to the inside of the folder, facing the cardboard backing. He stacked the finished chart on the pile for the Director.

  On Monday, the workers would walk past. They would see the rows of men. They would see the new houses. They would nod and say, "Look, we are being housed." They would trust the picture because the picture did not shout. It did not use adjectives. It simply showed.

  Tomas washed his hands in the basin in the corner. The water turned grey. He looked at his reflection in the mirror above the sink. He looked like a unit. One head, one torso, two legs. He wondered if there was a symbol for what he had just done. There wasn't. There was only the ink, and the paper, and the silence of the things that could not be drawn.

  In one line: The story explores how the demand for visual neutrality in data representation can systematically erase human suffering that defies quantification.
