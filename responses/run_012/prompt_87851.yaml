answer: |-
  **Project Title:** On the Uniqueness and Stability of Superrational Prescriptions in Symmetric and Asymmetric Games

  **1. Statement of the Research Question**

  The central objective of this project is to determine the formal conditions under which "superrationality"—defined here as a decision procedure wherein agents choose strategies based on the assumption that all similarly situated agents will arrive at the same conclusion—yields a unique, well-defined strategy profile. While existing informal discussions suggest specific solutions for the Platonia Dilemma and the Luring Lottery, it remains unclear whether these solutions are entailed by the principle of superrationality alone or whether they rely on auxiliary selection principles.

  Consequently, the research will address the following precise question: *Under what conditions on the game structure (specifically the cardinality of the strategy space and the number of players) and the epistemic state of the players (specifically the commonality of priors regarding player count and rationality) does the superrational constraint identify a unique strategy? Furthermore, in cases where the superrational constraint admits multiple symmetric equilibria, which supplementary selection principle (e.g., payoff dominance, risk dominance, or program-equilibrium stability) is necessary to restore determinacy?*

  This question narrows the broad philosophical inquiry into superrationality into a tractable analysis of existence and uniqueness theorems within specific game-theoretic models. It shifts the focus from whether superrationality is "correct" to whether it is *mathematically determinate* without smuggling in external normative assumptions.

  **2. Context and Gaps in Existing Literature**

  Current literature on coordination problems and decision theory offers several competing frameworks, none of which fully resolve the indeterminacy issues inherent in Hofstadter's puzzles.

  *   **Causal Decision Theory (CDT):** Standard causal reasoning treats other players' actions as probabilistically independent of one's own. In both the Platonia Dilemma and the Luring Lottery, CDT prescribes dominant strategies that lead to collectively suboptimal outcomes (e.g., everyone sending a telegram or submitting excessive entries). CDT settles the question of what a causal agent should do but fails to capture the intuition that identical reasoning processes should correlate.
  *   **Evidential Decision Theory (EDT):** EDT allows an agent's choice to serve as evidence for the choices of others. While this captures the correlation aspect of superrationality, standard EDT formulations often struggle to single out a unique probability distribution in games with unbounded strategy spaces. It explains *why* one should consider the group's action but does not inherently provide a selection rule for *which* symmetric action to choose when multiple symmetric profiles exist.
  *   **Team Reasoning and We-Intentionality:** These approaches posit that agents reason as members of a group agent. While this successfully selects payoff-dominant outcomes, it assumes the formation of the "team" as a primitive. It does not explain how individual agents, absent communication, agree on the specific weighting or randomization required in the Luring Lottery.
  *   **Program Equilibrium:** This framework allows players to submit algorithms that can read each other's code. While powerful, it relies on assumptions of transparency and computational capacity that exceed the constraints of the original puzzles (no communication, sealed envelopes).
  *   **The Gap:** The specific gap this project addresses is the lack of a formal robustness analysis for superrationality. The literature largely treats the "superrational solution" (e.g., $1/N$ probability in Platonia) as given. It does not rigorously test the boundary conditions: At what level of belief asymmetry does the solution collapse? In the Luring Lottery, does the symmetry assumption alone mathematically force a specific randomization, or is there a continuum of valid superrational strategies? This project posits that the latter is true, and that the apparent uniqueness in existing discussions is an artifact of unstated symmetry assumptions.

  **3. Methodology**

  The project will proceed through the construction and analysis of three formal models. The primary mathematical tools will be probability theory, Bayesian game theory, and fixed-point analysis.

  *   **Phase 1: Formalizing the Superrational Constraint.**
      I will define a *Superrational Solution Concept (SSC)*. Unlike a Nash Equilibrium, where each player best-responds to fixed strategies of others, the SSC will be defined as a strategy $\sigma$ that maximizes expected utility $U(\sigma, \dots, \sigma)$ subject to the constraint that all players adopt $\sigma$. I will explicitly distinguish this from Team Reasoning by maintaining the individualistic utility function while imposing the symmetry constraint as an epistemic condition.

  *   **Phase 2: The Platonia Dilemma with Epistemic Uncertainty.**
      I will parameterize the Platonia Dilemma not by a fixed $N$, but by a common prior distribution $P(N)$. I will derive the SSC for this variable-$N$ case. Subsequently, I will introduce asymmetry by assigning players different priors $P_i(N)$ regarding the number of participants. I will analyze the stability of the symmetric mixed-strategy prescription as the divergence between $P_i$ and $P_j$ increases. The goal is to locate the threshold of asymmetry at which the SSC ceases to be unique or converges to the Causal Decision Theory prescription.

  *   **Phase 3: The Luring Lottery and Unbounded Strategy Spaces.**
      I will construct a formal model of the Luring Lottery where the strategy space is the set of non-negative integers. I will test the hypothesis that symmetry alone is insufficient to select a unique distribution.
      *   *Step A:* Demonstrate that multiple symmetric mixed strategies yield different expected total entries, all of which satisfy the definition of SSC.
      *   *Step B:* Apply candidate selection principles (Payoff Dominance, Maximin, and Entropy Maximization) to this set of strategies to determine if any principle uniquely identifies the "expected total $\approx 1$" prescription found in informal literature.
      *   *Step C:* Compare these results against a Program Equilibrium model to see if allowing for conditional strategies resolves the indeterminacy.

  *   **Phase 4: Comparative Analysis.**
      I will tabulate the predictions of CDT, EDT, Team Reasoning, and the SSC across the constructed cases (Finite/Symmetric, Finite/Asymmetric, Infinite/Symmetric). This will isolate exactly which assumptions drive the determinacy of the solution in each framework.

  **4. Expected Results and Failure Modes**

  *   **Successful Outcome:**
      A successful project will produce a taxonomy of decision problems classified by the determinacy of their superrational solutions. Specifically, I aim to prove a theorem of the form: *The Superrational Solution Concept yields a unique strategy if and only if the strategy space is finite and symmetry is common knowledge.* For the Luring Lottery, I expect to demonstrate that the "expected total $\approx 1$" solution is not derived from superrationality alone but requires an auxiliary principle of *payoff dominance among symmetric profiles*. A genuine result would clarify that superrationality is a constraint on the *set* of admissible strategies, not a complete decision procedure.

  *   **Failure Modes:**
      *   *Mathematical Intractability:* The infinite strategy space of the Luring Lottery may lead to convergence issues in expected utility calculations that cannot be resolved within the scope of the project. If the integrals/sums diverge, the model may need to be simplified, potentially weakening the conclusion.
      *   *Conceptual Collapse:* The project may fail if "superrationality" proves indistinguishable from Team Reasoning once formalized. If the SSC simply reduces to "maximize group utility," the distinction I aim to analyze vanishes.
      *   *Triviality:* It is possible that introducing even minimal asymmetry immediately collapses the SSC into standard Bayesian Nash Equilibrium. While this is a substantive finding, it would limit the scope of the analysis to purely symmetric cases, reducing the project's contribution to the literature on asymmetry.

  **5. Semester Scope and Timeline**

  This project is designed for a single semester (approximately 16 weeks). The scope is limited to three specific game variants to ensure depth over breadth.

  *   **Month 1: Formalization and Literature Synthesis.**
      *   Weeks 1-2: Rigorous definition of the Superrational Solution Concept (SSC) and review of decision-theoretic formalisms (CDT vs. EDT).
      *   Weeks 3-4: Construction of the baseline Platonia model with fixed $N$. Derivation of the standard $1/N$ result within the SSC framework to ensure consistency with existing literature.
      *   *Risk:* Over-spending time on philosophical definitions rather than mathematical formalism. I will mitigate this by adopting the most standard game-theoretic notation available.

  *   **Month 2: Epistemic Uncertainty and Asymmetry.**
      *   Weeks 5-6: Introduction of uncertain $N$ (common prior). Solving for the SSC.
      *   Weeks 7-8: Introduction of asymmetric priors. Numerical simulation or analytic derivation of the stability threshold.
      *   *Risk:* This is the most likely point of overrun. Analyzing asymmetric beliefs in coordination games can become computationally complex. I will limit the asymmetry analysis to a two-player or three-player case if the general $N$-player proof becomes intractable.

  *   **Month 3: The Luring Lottery and Selection Principles.**
      *   Weeks 9-11: Modeling the infinite strategy space. Proving the non-uniqueness of the symmetric solution.
      *   Weeks 12: Testing auxiliary selection principles (Payoff Dominance, etc.) to see if they recover the informal "superrational" answer.
      *   *Risk:* Divergence of expected utility sums. I will prepare a bounded variant of the lottery (e.g., maximum entries capped) as a fallback to ensure a result is obtainable.

  *   **Month 4: Synthesis and Writing.**
      *   Weeks 13-14: Comparative analysis of frameworks (CDT, EDT, Team Reasoning, SSC).
      *   Weeks 15-16: Drafting the final paper, ensuring the distinction between the *constraint* of superrationality and the *selection* of a specific strategy is clearly articulated.

  The most critical path item is the asymmetric belief analysis in Month 2. If this proves too difficult, the project will pivot to a deeper analysis of the selection principles in Month 3, which is philosophically equally valuable.
