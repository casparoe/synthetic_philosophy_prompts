  # Practical Guide: Vital Status Determination (v0.9)

  ## 1. Terminology: The Borderline Bucket
  **Term:** **Vital Pending**  
  **Definition:** Samples exhibiting conflicting vital markers requiring monitoring rather than binary classification; ethical status is suspended until further data resolves the ambiguity.  
  **Applied By:** The *Gradualist*, *Stipulation/Split*, and *Unexplored* leaves. (The *Metabolism-First* and *Replication-First* leaves do **not** use this; they demand a binary yes/no).

  ---

  ## 2. The Decision Tree
  *Instructions: Answer based on empirical observation and standard assay results. Do not infer intent or philosophy.*

  **Q1: System Scale?**  
  Is the candidate unit the entire containing ecosystem (e.g., the whole pond) rather than a component within it?  
  *   **YES** → Go to **Leaf 1**.  
  *   **NO** → Go to **Q2**.

  **Q2: Boundary?**  
  Does the sample maintain a distinct physical or chemical interface separate from the immediate environment?  
  *   **NO** → Go to **Q3**.  
  *   **YES** → Go to **Q5**.

  **Q3: Metabolism?**  
  Does the sample consume free energy to maintain internal order without external machinery?  
  *   **YES** → Go to **Q4**.  
  *   **NO** → Go to **Q9**.

  **Q4: Replication?**  
  Does the sample produce distinct copies of its structure?  
  *   **YES** → **Leaf 2**.  
  *   **NO** → **Leaf 11**.

  **Q5: Metabolism?**  
  Does the sample actively consume free energy to maintain internal order?  
  *   **YES** → Go to **Q6**.  
  *   **NO** → Go to **Q7**.

  **Q6: Replication?**  
  Can the sample produce copies of itself?  
  *   **YES** → Go to **Q8**.  
  *   **NO** → **Leaf 3**.

  **Q7: Replication?**  
  Can the sample produce copies of itself (including host-dependent)?  
  *   **YES** → Go to **Q9**.  
  *   **NO** → Go to **Q10**.

  **Q8: Evolution?**  
  Do copies exhibit heritable variation subject to selection?  
  *   **YES** → **Leaf 4**.  
  *   **NO** → **Leaf 5**.

  **Q9: Evolution?**  
  Do copies exhibit heritable variation subject to selection?  
  *   **YES** → Go to **Q11**.  
  *   **NO** → **Leaf 6**.

  **Q10: Lineage + Potential?**  
  Is it descended from known life AND capable of reviving metabolism/replication under specific conditions?  
  *   **YES** → **Leaf 7**.  
  *   **NO** → **Leaf 8**.

  **Q11: Lineage?**  
  Is the sample causally descended from known terrestrial biology?  
  *   **YES** → **Leaf 9**.  
  *   **NO** → Go to **Q12**.

  **Q12: Substrate?**  
  Is the sample instantiated on physical carbon/water chemistry?  
  *   **YES** → **Leaf 9**.  
  *   **NO** → **Leaf 10**.

  ---

  ## 3. The Leaves (Position Space Map)
  *Each leaf represents a cluster of sample properties. The "Position" is the philosophical view that claims this cluster counts as "Alive." The "Awkward Commitment" is the cost of holding that view.*

  | Leaf | Sample Examples | Position Name | Verdict | Awkward Commitment |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Pond System | **System-Only Vitality** | **ALIVE** | Implies your own cells are not alive, only you are. |
  | **2** | Autocatalytic Network | **Metabolism-First** | **ALIVE** | A burning flame or turbulent whirlpool might qualify. |
  | **3** | Sterile Cell | **Metabolism-First** | **ALIVE** | A sterile mule is alive, but a virus is dead. |
  | **4** | Bacterium (Active) | **Strong Emergence** | **ALIVE** | Excludes alien life that lacks one "core" terrestrial trait. |
  | **5** | Self-Replicating Mineral | **Unattractive** | **ALIVE** | Crystals and geological formations count as living beings. |
  | **6** | Prion / Static Mineral | **Unattractive** | **ALIVE** | Any self-copying pattern, even without variation, is life. |
  | **7** | Frozen Bacterium | **Lineage/Process** | **ALIVE** | A seed is alive, but a spore is not, based on timing alone. |
  | **8** | Dead Matter | **Non-Life** | **DEAD** | (Consensus) No awkward commitment. |
  | **9** | Virus / Digital Lineage | **Replication-First** | **ALIVE** | Computer viruses and parasitic genes are fully alive. |
  | **10** | Simulated Bacterium | **Stipulation/Split** | **VITAL PENDING** | Requires a legal definition, not a scientific discovery. |
  | **11** | Unexplored Combo | **Unexplored** | **VITAL PENDING** | No philosophical tradition has argued for this specific mix. |
  | **12** | Endogenous Viral Element | **Gradualist** | **VITAL PENDING** | "70% alive" has no clear ethical cash value for regulation. |

  *(Note: Leaf 5 and Leaf 6 both map to "Unattractive" positions regarding static replication; they are split here only by boundary presence, but the philosophical commitment is identical.)*

  ---

  ## 4. Limitations: What This Tree Cannot Separate

  **1. Realism vs. Instrumentalism**  
  The tree cannot distinguish between a tech who believes "Life" is a real joint in nature (Realism) and one who believes "Life" is just a useful label for regulation (Instrumentalism). Both will follow the same path to the same leaf, but they disagree on whether they *discovered* life or *assigned* it.

  **2. Substrate Independence**  
  Leaf 9 (Replication-First) lumps Viruses and Digital Lineages together. It cannot separate the view that "biology requires carbon" from the view that "biology is substrate-independent information processing" without adding a arbitrary substrate question (which I relegated to Leaf 10).

  **3. Temporal Phasing**  
  The tree treats "Potential" (Q10) as a binary switch. It cannot separate the view that a dormant spore is *currently* alive from the view that it is only *potentially* alive. Both land on Leaf 7, but the ethical handling of the sample differs (kill it now vs. kill it later).

  **4. The "Vital Pending" Ambiguity**  
  Leaves 10, 11, and 12 all result in **VITAL PENDING**. The tree cannot tell you *which* additional test resolves the ambiguity. It identifies the confusion but does not solve it.
