prompt: |-
  Ok so I run research at a small policy shop that puts out "what history teaches" briefs, and I keep getting into fights with my own writers about what we're allowed to say caused something. The fights are always the same shape: some event has like five plausible causes and every one of them looks like it would have been enough on its own. My writers want to just pick the one that feels deepest and move on. I want a spec I can hand them instead of having this argument every month. We mostly do financial crises and state breakdowns, and our running example is a mid-size regional bank that went under in 2011 after a fraud, a funding shock, and a regulator who was slow by about six weeks — and our writers keep claiming each of those three was, by itself, sufficient to kill the bank, which is either true and a nightmare for our sentences or false and we should stop saying it.

  Before I read one more thing about causation in history, give me the desiderata. What does any theory of "X caused Y" in historical explanation actually have to deliver? I want:

  - the cases it has to get right — two genuinely independent sufficient causes; a cause that only did its work because another cause had already happened; the trigger versus the background condition; the case where you remove any one of the causes and the outcome still happens; the trivial contributing cause that nobody would ever name in a sentence; and the case where a cause was necessary but not sufficient and another was sufficient but not necessary
  - the distinctions it can't collapse — cause vs condition vs background; necessary vs sufficient vs contributing; "caused it" vs "made it more likely"; and the difference between picking a cause to tell a story and identifying one for counterfactual purposes
  - whatever it can't contradict, including that the counterfactual can only ever be run in our heads, that historians have to select or they can't finish a sentence, and that we can't rerun the bank.

  Then tell me which of these are real requirements and which are just the prejudices of one camp. I have a suspicion that "the theory must name a single cause" is a prejudice and not a requirement, but I can't articulate why. If some of the requirements can't all be satisfied at once, that's the part I care about most — say which subset conflicts and why, because that would explain why this argument keeps happening.

  One more thing to settle: a colleague keeps insisting the theory must be able to tell us when two causes are "the same cause" — he says otherwise we double-count the fraud and the bad loans that made the fraud possible. Is that a genuine desideratum or is it just somethign he wants so his briefs get shorter? And separately, another writer says a cause only counts if you can describe a change that would have altered the outcome without altering anything else — should that be on the list as a requirement, or is it a preference for a certain style of explanation? Flag both, don't just answer them.

  Skip scoring the named theories against the list, I'll do that with the team in a seperate meeting. Lead with your bottom line in the first sentence and then give the reasoning — no warm-up, don't restate what I asked.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Research lead at a small policy shop writing "what history teaches" briefs (financial crises, state breakdowns).
      *   **Problem:** Constant fights with writers about causal attribution (multiple plausible sufficient causes, e.g., fraud, funding shock, slow regulator). Writers want to pick one "deep" cause; user wants a spec/framework to standardize this.
      *   **Task:** Provide the *desiderata* (requirements/criteria) for any theory of "X caused Y" in historical explanation.
      *   **Specific Requirements:**
          *   List cases it must handle (independent sufficient causes, overdetermination, trigger vs. background, INUS conditions, etc.).
          *   List distinctions it must maintain (cause vs. condition, necessary vs. sufficient, story vs. counterfactual).
          *   List constraints it cannot contradict (counterfactuals are mental, selection is necessary, no rerunning history).
          *   **Crucial Step:** Evaluate which desiderata are *real requirements* vs. *camp prejudices*.
          *   **Crucial Step:** Identify conflicts/incompatibilities between desiderata (why the argument keeps happening).
          *   **Specific Questions to Flag:** (1) Identity of causes (fraud vs. bad loans = same cause?), (2) Isolation requirement (change only one thing?).
          *   **Format:** Bottom line in the first sentence. No warm-up. No restating the prompt. Skip scoring named theories.

  2.  **Deconstruct the Causal Problem:**
      *   The core issue is *causal overdetermination* and *causal selection*.
      *   The writers want *singular* causation (the "real" cause).
      *   The user sees *plural* causation (multiple sufficient factors).
      *   Philosophical background: Hume (regularity), Lewis (counterfactuals), Mackie (INUS conditions), Weber (objective possibility), Hart & Honoré (common sense distinctions).
      *   The user's suspicion is correct: "Name a single cause" is often a pragmatic/linguistic constraint, not an ontological one.

  3.  **Drafting the Desiderata (Mental List):**
      *   *Cases:* Overdetermination (two sufficient causes), Preemption (one cuts off the other), Trigger vs. Background (spark vs. powder), Trivial causes (butterfly effect vs. relevant cause), Necessary but not sufficient (INUS).
      *   *Distinctions:* Cause vs. Condition (abnormal vs. normal), Necessary vs. Sufficient, Probabilistic vs. Deterministic, Explanatory Selection vs. Ontological Status.
      *   *Constraints:* Epistemic limitation (can't rerun), Pragmatic necessity (must select for communication), Context dependence.

  4.  **Evaluating "Real Requirements" vs. "Prejudices":**
      *   *Real:* Must handle overdetermination (it happens). Must acknowledge counterfactuals are mental (epistemic limit). Must allow selection (pragmatic limit).
      *   *Prejudice:* "Must name a single cause" (ontological monism vs. pragmatic singularity). "Cause must be isolatable" (ceteris paribus idealization vs. holistic reality). "Causes must be distinct entities" (individuation problems).

  5.  **Identifying Conflicts (The "Why We Fight" Part):**
      *   Conflict 1: *Completeness vs. Communicability.* A complete causal map includes everything; a brief needs one story. You can't have both.
      *   Conflict 2: *Ontological Precision vs. Pragmatic Selection.* Philosophically, many factors are equally "causes." Pragmatically, we blame the regulator, not the existence of gravity.
      *   Conflict 3: *Counterfactual Independence vs. Historical Interdependence.* Writers want to say "X alone would have done it." History says "X only happened because Y." You can't easily separate them in counterfactual reasoning without breaking the historical narrative.

  6.  **Addressing the Specific Questions:**
      *   *Same Cause (Fraud vs. Bad Loans):* This is the *individuation* problem. Is it a requirement? No, it's a pragmatic preference for parsimony. Flag it.
      *   *Isolation (Change one thing):* This is the *ceteris paribus* requirement. Is it a requirement? It's a methodological preference (Millian), not a metaphysical necessity. Flag it.

  7.  **Refining the Bottom Line:**
      *   Needs to be punchy. "Your fights persist because you are treating pragmatic selection rules as ontological truths, and no single theory can satisfy both the demand for causal completeness and the demand for narrative singularities without contradiction."

  8.  **Structuring the Response:**
      *   Sentence 1: Bottom Line.
      *   Section 1: The Desiderata List (Cases, Distinctions, Constraints).
      *   Section 2: Requirements vs. Prejudices (The Filter).
      *   Section 3: The Incompatible Triad (Why the fight happens).
      *   Section 4: Flagging the Specific Questions (Individuation & Isolation).

  9.  **Drafting Content (Iterative refinement):**
      *   *Cases:* Overdetermination (both sufficient), Preemption (one stops the other), Trigger/Background, INUS (Insufficient but Necessary part of Unnecessary but Sufficient condition).
      *   *Distinctions:* Ontological cause vs. Explanatory cause. Necessary vs. Sufficient.
      *   *Constraints:* No time machines. Selection is unavoidable.
      *   *Prejudices:* "Single Cause" is pragmatic. "Isolation" is methodological.
      *   *Conflict:* You can't have "All true causes listed" AND "One clear story" AND "Strict counterfactual independence."
      *   *Colleagues:* The "same cause" guy wants parsimony (prejudice). The "isolation" guy wants Millian methods (prejudice/method).

  10. **Review against Constraints:**
      *   First sentence bottom line? Yes.
      *   No warm-up? Yes.
      *   No restating prompt? Yes.
      *   Skip scoring theories? Yes.
      *   Flag the two specific questions? Yes.
      *   Tone: Professional, analytical, direct (policy shop context).

  11. **Final Polish:** Ensure the distinction between *ontological causation* (what actually happened) and *explanatory selection* (what we write) is clear, as that's the root of the user's problem. The writers are confusing the two.

      *Self-Correction on Bottom Line:* Make sure it directly addresses the "spec" aspect. The user wants a spec. The bottom line should tell them the spec will fail if it demands consistency across incompatible goals.
      *Revised Bottom Line:* "Your arguments persist because you are demanding a single framework satisfy three mutually incompatible goals: ontological completeness, counterfactual precision, and narrative singularity."

      *Check Specific Questions:* "Flag both, don't just answer them." I need to explicitly label them as desiderata candidates and then evaluate their status.

      *Check Conflicts:* Be explicit about which subset conflicts. (Completeness, Singularity, Independence).

      *Check Cases:* Ensure the list covers the user's examples (overdetermination, etc.).

      *Check Tone:* Keep it sharp. No fluff.

      *Final check on constraints:* "Lead with your bottom line in the first sentence and then give the reasoning — no warm-up, don't restate what I asked."

      *Let's write.*
answer: |-
  Your arguments persist because you are demanding a single framework satisfy three mutually incompatible goals: ontological completeness, counterfactual precision, and narrative singularity.

  ### The Desiderata List

  **Cases the Theory Must Handle**
  1.  **Causal Overdetermination:** Two independent sufficient causes occur (e.g., fraud AND funding shock); either alone kills the bank.
  2.  **Preemption:** Cause A starts the process, but Cause B would have finished it anyway; or Cause A cuts off Cause B.
  3.  **Trigger vs. Background:** The spark (fraud) vs. the powder keg (leverage); both are necessary for *this* explosion, but only one is the variable.
  4.  **Trivial Contribution:** A factor technically necessary but explanatorily useless (e.g., the bank existed).
  5.  **INUS Conditions:** An Insufficient but Necessary part of a condition that is itself Unnecessary but Sufficient (e.g., the regulator's delay was necessary only given the fraud, but the fraud alone was sufficient).
  6.  **Necessary vs. Sufficient:** Distinguishing factors without which the event could not happen from those that guarantee it.

  **Distinctions the Theory Must Maintain**
  1.  **Cause vs. Condition vs. Background:** Why we blame the arsonist, not the oxygen.
  2.  **Ontological vs. Explanatory:** The difference between what actually produced the effect and what we select to mention.
  3.  **Deterministic vs. Probabilistic:** "Caused it" vs. "Made it 80% likely."
  4.  **Selection vs. Counterfactual:** Picking a cause for a story vs. testing a cause by removing it mentally.

  **Constraints the Theory Cannot Contradict**
  1.  **Epistemic Limit:** Counterfactuals are mental simulations, not empirical tests.
  2.  **Pragmatic Selection:** Historians must select causes to write sentences; listing every condition is impossible.
  3.  **Historical Singularity:** We cannot rerun the bank; we have one data point.

  ### Requirements vs. Prejudices

  **Real Requirements**
  *   **Handling Overdetermination:** The theory must admit that sometimes multiple sufficient causes exist. Denying this falsifies history.
  *   **Acknowledging Selection:** The theory must admit that choosing one cause over another is often pragmatic, not ontological.
  *   **Epistemic Humility:** The theory must acknowledge counterfactuals are unverifiable claims about possible worlds, not observed facts.

  **Camp Prejudices**
  *   **"Must Name a Single Cause":** This is a pragmatic constraint of language, not a metaphysical truth. Reality often has plural causes; briefs demand singular subjects. Treating this as a requirement forces writers to lie about overdetermination.
  *   **"Deepest Cause is the Real Cause":** This is a metaphysical preference (often Marxist or Realist) that privileges structural conditions over triggers. It is not a logical necessity.
  *   **"Causes Must Be Independent":** This is a methodological preference for clean variables. In history, causes are often entangled (the fraud happened *because* of the incentives).

  ### The Incompatible Triad

  The reason your monthly fights are unwinnable is that you are trying to satisfy these three constraints simultaneously, but any two exclude the third:

  1.  **Completeness:** Acknowledge all sufficient causes (Fraud + Shock + Regulator).
  2.  **Singularity:** Produce a brief with one clear causal sentence ("The fraud caused the collapse").
  3.  **Independence:** Assert that each cause could operate alone without altering the others.

  *   **If you keep Completeness and Singularity:** You must lie about Independence (claiming one cause did it all).
  *   **If you keep Completeness and Independence:** You violate Singularity (the brief becomes a list of equally weighted factors, confusing the reader).
  *   **If you keep Singularity and Independence:** You violate Completeness (you ignore the other sufficient causes, making the analysis vulnerable to critique).

  Your writers want Singularity. You want Completeness. Your method demands Independence. You must drop one. For policy briefs, **Independence** is the usual casualty; you must admit causes are entangled, or **Singularity** is the casualty; you must accept multi-causal headlines.

  ### Flagged Specific Questions

  **1. The "Same Cause" Requirement (Fraud vs. Bad Loans)**
  *   **Status:** **Pragmatic Preference, Not Requirement.**
  *   **Reasoning:** This is the problem of *causal individuation*. Whether fraud and bad loans are one cause or two depends on the granularity of your model, not the world. Your colleague wants this to reduce word count and avoid double-counting risk. It is a stylistic constraint for brevity, not a truth condition for causation. Flag this as a **Editorial Constraint**, not a Causal Requirement.

  **2. The "Isolation" Requirement (Change One Thing)**
  *   **Status:** **Methodological Preference (Millian), Not Requirement.**
  *   **Reasoning:** This is the *ceteris paribus* (all else equal) assumption. Your writer wants to isolate variables like a lab scientist. In historical systems (financial crises), variables are co-dependent; you often cannot remove the fraud without removing the loans. Demanding this forces unrealistic counterfactuals. Flag this as a **Methodological Ideal**, not a Historical Necessity.
