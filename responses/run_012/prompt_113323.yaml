prompt: |-
  I've never taken an econ class in my life. I'm a birder — twenty years of it, plus a shelf of evolution and ecology books — so my native language is adaptation, drift, phylogeny, convergent evolution, niche construction, common gardens. But I've gotten sucked into the fight about why some countries are rich and others arent, and it keeps reminding me alot of arguments I already know from biology.

  So restate that whole debate in my vocabulary: the institutions crowd, the geography crowd, the culture crowd, and the people who say you cant get causal answers out of history at all. Faithfully, please, not biology words sprinkled over econ sentences. Then the residue report — what did you have to fudge, what has no counterpart in my vocabulary at all, and for each one, is my framework missing something real or is their disagreement thinner than it sounds?

  Two hunches to back up or shoot down. One: in evolution most traits aren't adaptations, they're drift or frozen accidents, and I suspect "why is Norway rich" is closer to that than anyone wants to admit — tell me if I'm just being lazy with the analogy. Two: counting countries means counting 200 things that share a family tree and copy each other, which a biologist would call the worst sample imaginable, so is "institutions cause growth" really a convergent-evolution claim, and could it ever be tested in a way a biologist would accept?

  And the last one, which I think is where the translation dies: culture. A religion or a value isn't a gene, people change it on purpose and argue about it. Does anything in my vocabulary do that job, or does it just stop there?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Experienced birder (20 years), well-read in evolution/ecology (adaptation, drift, phylogeny, convergent evolution, niche construction, common gardens). No economics background.
      *   **Task:** Translate the debate on economic development (why some countries are rich/poor) into evolutionary biology vocabulary.
      *   **Specific Schools of Thought to Translate:** Institutions, Geography, Culture, Skeptics (no causal answers).
      *   **Required Output:**
          1.  Restatement of the debate in bio vocabulary (faithful translation, not just sprinkling terms).
          2.  Residue Report (what had to be fudged, what has no counterpart, is the bio framework missing something or is the econ disagreement thin?).
          3.  Address Two Hunches:
              *   Hunch 1: Wealth is mostly drift/frozen accidents (like non-adaptive traits).
              *   Hunch 2: Countries are phylogenetically non-independent (worst sample imaginable), is "institutions cause growth" a convergent evolution claim, and can it be tested biologically?
          4.  Address the "Culture" Problem: Culture isn't genes (intentional change, argument). Does bio vocabulary handle this?

  2.  **Deconstruct the Economic Debate into Biological Analogues:**

      *   *The Phenotype:* National Wealth/Development (GDP per capita, industrial capacity).
      *   *The Organism:* The Nation-State (or Society).
      *   *The Environment:* Geography/Climate/Resource Endowment.
      *   *The Genotype/Developmental System:* Institutions (rules of the game).
      *   *The Behavioral/Ethological Layer:* Culture (norms, beliefs).
      *   *The History:* Colonialism, path dependence, historical shocks.

      *   *School 1: Geography (Sachs, Diamond).*
          *   Bio analogue: Ecological determinism / Niche constraints. The environment directly selects for or against certain phenotypes. Disease load, soil quality, latitude = abiotic/biotic stressors.
      *   *School 2: Institutions (Acemoglu, Robinson, North).*
          *   Bio analogue: Developmental constraints / Regulatory networks. It's not the environment directly, but *how the organism processes resources*. Inclusive institutions = open developmental plasticity; Extractive institutions = canalized, resource-hoarding pathways.
      *   *School 3: Culture (Weber, Harrison, Huntington).*
          *   Bio analogue: Ethology / Memetics (careful here) / Behavioral Syndromes. Deep-seated behavioral predispositions that affect fitness.
      *   *School 4: Skeptics (Arndt, Rodrik - sort of).*
          *   Bio analogue: Phylogenetic confounding / Lack of replication. You can't separate the traits because they co-evolved.

  3.  **Drafting the Translation (Section 1):**
      *   Need to speak *as* a biologist talking to a biologist about nations.
      *   *Geography:* It's the "Common Garden" argument. If you put the same species in the tropics vs. temperate, do they grow differently? Geography says yes, environment dictates fitness directly.
      *   *Institutions:* It's the "Developmental Pathway" argument. The genotype (rules) determines if resources are used for somatic growth (public goods) or reproductive hoarding (elites).
      *   *Culture:* It's the "Behavioral Syndrome" or "Learned Ethology."
      *   *Skeptics:* "Phylogenetic Signal." You can't treat nations as independent data points ($N=200$ is false).

  4.  **Developing the Residue Report (Section 2):**
      *   *Fudges:* Nations aren't organisms. They don't die (usually), they don't reproduce sexually (though they split/merge), they don't have a clear DNA.
      *   *Missing vs. Thin:* Econ often treats variables as exogenous (outside the system). Bio knows everything is endogenous (co-evolution). The bio framework might actually be *better* at seeing the feedback loops. The econ disagreement is often about identification, which bio handles via phylogeny controls.

  5.  **Addressing Hunch 1 (Drift vs. Adaptation):**
      *   *Hunch:* Wealth is drift/frozen accident.
      *   *Analysis:* In bio, complex traits (eyes) are usually adaptive. Simple traits or neutral markers are drift. Wealth is complex. However, *path dependence* (QWERTY keyboards, colonial borders) is very much like "frozen accidents" or historical contingency (Gould's *Wonderful Life*).
      *   *Verdict:* Not lazy. It's a strong critique. Initial conditions (colonial settlement mortality) act like founder effects. But sustained wealth looks like adaptation (maintenance requires energy). So: Founder effect + Drift set the stage, Selection maintains it.

  6.  **Addressing Hunch 2 (Phylogeny & Convergence):**
      *   *Hunch:* Countries share a family tree (colonialism, empires). $N=200$ is fake.
      *   *Analysis:* This is the "Galton's Problem" in anthropology, which is exactly phylogenetic non-independence.
      *   *Convergence:* "Institutions cause growth" is claiming that *different lineages* can evolve the *same regulatory mechanism* (inclusive institutions) and get the *same fitness payoff* (growth). That is convergent evolution.
      *   *Testing:* Biologists use Phylogenetic Independent Contrasts (PIC). Economists try to use "Natural Experiments" (e.g., Korea North/South, colonial settler mortality). A biologist would accept the North/South split as a "Common Garden" experiment.
      *   *Verdict:* You are right about the sample size. The "Natural Experiment" approach is the econ equivalent of a controlled lab cross.

  7.  **Addressing the Culture Problem (Section 3):**
      *   *Problem:* Culture is Lamarckian. It's intentional. Genes aren't.
      *   *Bio Counterpart:* Niche Construction Theory. Organisms modify their environment, which changes selection pressures. Also, Dual Inheritance Theory (Gene-Culture Coevolution).
      *   *Verdict:* Bio vocabulary *does* have this, but standard neo-Darwinism doesn't emphasize it enough. Niche Construction is the key term. Culture is a rapid-evolving regulatory layer that alters the selection pressure on the slower-moving institutional "genome."

  8.  **Review and Refine:**
