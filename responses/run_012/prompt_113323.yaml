      *   *Faithfulness:* Did I distort the econ theories to fit the bio analogy? Need to ensure Institutions aren't just "genes" but "developmental rules."
      *   *Residue:* Make sure to highlight that nations *choose* policies, which genes don't. That's the big friction point.

  9.  **Final Polish:** (Self-Correction during drafting)
