answer: |-
  (1) **Sequence of Components and Dependencies**

  You must introduce the components in this specific order. Deviating will allow students to collapse the distinction between *who* is chosen and *why* they choose as they do.

  1.  **The Analytical Lens (Selection vs. Incentive):** This is the **one idea that must land before the rest can even be stated**. You must establish that every method of filling office does two things: it filters the *population* (Selection Effects) and it structures the *behavior* of the officeholder (Incentive Effects).
      *   *Dependency:* Nothing else works unless they accept that elections are not just a way to pick people, but a system of threats and rewards that dictates behavior.
  2.  **The Proposal (The Mechanism):** Present the 150-member body, the 18-month term, and the sealed list.
      *   *Dependency:* Relies on the Lens. Ask them immediately: "Is the sealed list a selection feature or an incentive feature?" (Answer: Both, but primarily incentive—it stops campaigning).
      *   *Non-Optional Component:* The **Sealed List**. You cannot treat this as a minor procedural detail. If you do, they will assume pre-selection lobbying is possible, which destroys the incentive argument. It must be presented as the lock that prevents the re-introduction of electoral incentives.
  3.  **The Accountability Gap:** Introduce the single non-renewable term and the lack of re-election.
      *   *Dependency:* Relies on the Lens. They must analyze this not as "unfair" but as an incentive removal.
  4.  **The Opposition Deficit:** Introduce the lack of parties/organized opposition.
      *   *Dependency:* Relies on the Accountability Gap. Without parties, who finds the errors?
  5.  **The Safety Valve:** Introduce the Referendum Override.
      *   *Dependency:* Relies on the previous two. This is the substitute for the missing accountability and opposition.

  (2) **The Concrete Case**

  Build the session around **Intergenerational Pension Solvency**.

  *   **What it must have:** It must require immediate, unpopular sacrifices (tax hikes or benefit cuts) for long-term stability (20+ years). This highlights the failure of electoral incentives (short-termism) and tests the lottery body's insulation from public wrath.
  *   **What it must lack:** It must lack clear partisan branding. Do not use "Climate Change" (too polarized, allows partisan heuristics) or "Constitutional Rights" (too abstract, invites legalistic rather than institutional critique).
  *   **Candidate to Resist:** **Criminal Justice Reform.** Resist this because it invites arguments about "expertise" and "law and order" that will distract from the institutional design. It also triggers moral intuitions that override incentive analysis. Pension reform is cold, mathematical, and purely about trade-offs, which forces them to look at the *mechanism* of decision-making rather than the *morality* of the outcome.

  (3) **Misconceptions and Objections**

  Address these in the order they will surface. I have flagged the one you should concede.

  1.  **"A random sample is a random sample of the ignorant."**
      *   *When:* Upon revealing the selection method.
      *   *Response:* Head this off by distinguishing *technical knowledge* (which staff/experts provide) from *value judgments* (which the body makes). The design assumes they need to judge trade-offs, not draft the actuarial tables.
  2.  **"Sortition and Term Limits are rival answers to one question."**
      *   *When:* Upon revealing the 18-month non-renewable term.
      *   *Response:* Correct this immediately. Term limits are a constraint on *incumbency advantage* within an electoral system. Sortition removes the *electoral system* entirely. They are orthogonal, not rivals.
  3.  **"A body with no power to compel is a focus group."**
      *   *When:* Upon discussing the enactments.
      *   *Response:* Remind them of the proposal's text: enactments take effect *unless* overturned. The burden of action lies with the public, not the body. It is a legislature with a delayed fuse, not a focus group.
  4.  **"A legislature nobody elected is for that reason undemocratic."**
      *   *When:* Closing summary.
      *   *Verdict:* **This is a fair objection, not a misconception.** You must concede this. Under the standard Schumpeterian definition (democracy = competitive elections), this proposal is *not* democratic.
      *   *Handling:* Do not try to talk them out of this. Instead, force the trade-off: "If you concede it is less 'electorally democratic,' does it achieve a different democratic value, such as 'equality of influence' or 'freedom from donor capture'?" Make them argue about which definition of democracy is being sacrificed, rather than pretending the definition hasn't changed.
  5.  **"The Referendum makes the body pointless."** (Missing from your list)
      *   *When:* Upon revealing the override clause.
      *   *Response:* This is the "Status Quo Bias" objection. Remind them that triggering a referendum requires a petition threshold. The default is *enactment*, not stagnation. The body breaks gridlock; the public holds the veto.

  (4) **The Closing Question**

  Do not ask if they like the proposal. Ask them to break it.

  > "If the 18-month term creates an incentive to act recklessly because there is no future election to fear, which specific feature of this design prevents a reckless majority from passing a pension cut that ruins the system before the referendum can be organized?"

  *   *Why this works:* It forces them to synthesize the Selection/Incentive distinction (the term length) with the Accountability problem (the lack of removal) and the Safety Valve (the referendum timing). If they answer "The people," they have failed (the people are reactive). If they answer "The sealed list," they have failed (that prevents entry, not bad acts). They must identify the *internal* constraint (e.g., the rotating agenda subset or the deliberative friction) or admit there is none.

  (5) **What to Refuse and How**

  You have 90 minutes. You cannot cover the history of sortition or the statistical mechanics of stratification.

  *   **Refuse:** **Historical Precedent (Athens/Venice).**
      *   *Why:* It invites analogical reasoning ("It worked then") rather than institutional analysis ("Does the mechanism work now?").
  *   **Refuse:** **Stratification Mathematics.**
      *   *Why:* Law and Policy students will get bogged down in quota mechanics (gender, race, class) rather than incentive structures.
  *   **How to say it:**
      > "I am not asking you to evaluate whether this is historically authentic or statistically perfect. I am asking you to stress-test the *incentive compatibility*. If we assume the sample is perfectly representative, does the behavior change? Keep your objections to the mechanics of the machine, not the history of the inventor."
