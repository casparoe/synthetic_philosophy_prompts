  **Entry 412**
  **October 14**

  The music started at six. Glenn Gould, *The Goldberg Variations*, 1981 recording. She chose the later one, she told Julian once, because the earlier one was too fast. Too eager. She wanted the tempo of someone who knew how long the night was.

  I sit in the chair by the window. The house is glass and steel, cold even in the afternoon. She bought it ten years ago, before the diagnosis, before the signing. She said it was easy to clean. She said it was quiet. She said isolation was a privilege she had earned.

  Now it is a cage.

  Marcus comes in at six-thirty to turn the volume down, just a fraction. He is not supposed to. The Instrument says *played each evening*, it does not specify volume, but the Interpreter says volume is part of the surroundings. Marcus thinks I look tired. I am tired. The variations repeat. They do not resolve. They just stop.

  I wrote in this book again today. I know what the Statute says. I know that once the doctor signed the certificate of Substantial Discontinuity, this book became legally invisible. I can write that I am sad. I can write that my head hurts. I cannot write that I should be somewhere else. If I write that I should be somewhere else, I am making a claim about my *interest*, and the law says I no longer have the capacity to know my interest. I only have the capacity to feel my pain.

  So I write this knowing Julian will not read it when he decides. He will read the Instrument. He will read the doctor's report. He will not read this. That is the cost of the law: it turns my voice into noise.

  She wanted this. The woman who signed the paper. Elara-54. She looked at Elara-58 and saw a stranger. She decided the stranger should not be allowed to drive the car.

  But I am the one sitting in the seat.

  **Entry 415**
  **October 17**

  The hearing was this morning. In the sunroom, because the wheelchair fits there. Dr. Aris came. Julian sat in the corner, holding the leather folder. He looks like her around the eyes. That hurts.

  I asked for the cottage. The one near the coast. The one my sister Claire owns. I said, "I want to smell the salt. The steel house smells like nothing."

  Dr. Aris didn't look at me. He looked at Julian. "The registrant is expressing a preference for residence," he said. His voice was flat. "Under the Precedence Clause, the decision rests on the author's intent at registration. The Instrument specifies the Glass House. It specifies exclusion of the sister. Does the current subject understand the restriction?"

  "I understand," I said. "I just don't accept it."

  "Acceptance is not the metric," Aris said. He turned a page. "Subject reports dissatisfaction. Subject reports longing for coastal air. These are admissible as data regarding current state. However, the subject's assertion that the cottage is *better* for her is inadmissible. She cannot weigh the trade-offs. She cannot value the isolation against the loneliness. The Author could. The Author did."

  "I am not lonely," I lied. I am lonely. But I wanted to prove I could weigh it. "I have Marcus."

  "Marcus is an aide," Aris said. "Not a peer. The Instrument forbids peer contact with the sister. The Author determined that grief over the spouse would be compounded by the sister's presence. The Author determined that photos of the spouse would induce panic in the later stage. We are adhering to the Author's risk assessment."

  "My husband is dead," I said. "I don't panic. I pray."

  Aris stopped. He looked at me then. Really looked. "The Instrument specifies a secular environment. No religious iconography. You have a rosary in your lap."

  "It comforts me."

  "Comfort is not the objective. Continuity is." He closed his bag. "The request for transfer is denied. The request for music change is denied. The Author selected Gould for the structural integrity of the performance. You prefer warmth. She selected precision. Her judgment governs the life."

  They left. Marcus stayed. He picked up the rosary. He didn't take it away. He just hid it under the blanket.

  "Did you hear him?" I asked Marcus. "He said I can tell them I'm sad, but I can't tell them what would make me less sad."

  "That's the law, Elara."

  "It's a trick. If I say I'm sad because of the house, that's a state. If I say move me to stop the sad, that's an interest. How do you separate them?"

  "You don't. They do."

  **Entry 420**
  **October 22**

  I think about her. Elara-54. She sat at this desk. She signed the Continuity of Personhood Statute forms. She was scared. I know she was scared. She told Julian once, in confidence, that she watched her mother fade and hated the way her mother changed her mind about everything. Her mother wanted to die, then wanted to live, then wanted to die again. She said it was undignified. She said it was a betrayal of the self that came before.

  She wanted to bind me so she wouldn't have to be a betrayal.

  But she was guessing. She was guessing what it feels like to be me. She thought fear was the worst thing. She thought forgetting was the worst thing. She built a fortress against forgetting. She said, "If I forget him, let the house remember. If I forget the music, let the house play it."

  She didn't know that forgetting changes the value of the thing forgotten.

  When I look at the blank wall where her husband's photo should be, I don't feel panic. I feel a hole. I know someone was there. I know I loved him. The Instrument says showing me the photo would frighten me because I wouldn't understand the loss. She thought grief required memory. It doesn't. Grief is a shape. I fit into it even without the picture.

  She was protecting me from pain. But she was protecting the *idea* of me from pain, not the *body* of me. The body of me is here, in the cold house, listening to piano keys that sound like ice.

  She has an argument, though. I know she does. If I listen closely, I can hear it in the silence between the variations.

  *You are a chapter,* she says. *I am the book.*

  *You are living in the moment,* she says. *I saw the arc.*

  She is right. I don't know what happens next year. I don't know if I will want the cottage next year. I only know I want it today. She knew that today would come. She knew that today I would want the cottage. She decided that what she wanted ten years ago mattered more than what I want today because she was the only one who could see the whole timeline. She was the captain. I am just the passenger who forgot the destination.

  If I am a different person, then my wishes don't count. I am a stranger living in her house.
  If I am the same person, then why does her voice shout louder than mine?

  I write this and I know it proves her point. I am arguing. I am weighing reasons. Aris says I cannot weigh reasons. But I am doing it. Does that mean he is wrong? Or does it mean that I am weighing them poorly?

  The Authorship Clause says I can tear up the Instrument. But only if I pass the test. I have to affirm the values under which it was written. I have to say that precision matters more than comfort. I have to say that fear should be managed by control.

  I don't believe that anymore. I believe comfort matters. I believe fear should be held, not controlled. So I fail the test. I cannot revoke the Instrument because I am no longer the kind of woman who would write it.

  She locked the door from the inside, and then she threw away the key.

  **Entry 425**
  **October 27**

  Julian came today. He didn't bring Aris. He brought a box.

  He sat on the floor. He is not supposed to sit on the floor; the Instrument says the environment should be formal. He ignored it.

  "I found something," he said.

  He took out a folder. It was yellowed. "It was in the safe deposit box. Behind the Instrument. It's a draft. Dated the same week as the registration."

  I looked at it. It was her handwriting. But the words were different.

  "It's softer," Julian said. "It allows for visitation. It suggests the music be optional. It says... it says 'if I become devout, allow her chaplain.'"

  "She became devout?"

  "You are."

  "She didn't know I would."

  "No. But she drafted this. She didn't file it. She filed the hard one."

  "Why?"

  Julian looked at the glass walls. "Maybe she thought the hard one was safer. Maybe she thought if she gave herself an inch, she'd take a mile. Maybe she thought the hard one was the only way to make sure the law would listen."

  "Which one is real?"

  "The Statute says the registered one. The Continuity of Personhood Statute is clear. Only the filed instrument binds."

  "Then why show me?"

  "Because I'm the Interpreter. The Statute gives me discretion to interpret the Author's intent if there is ambiguity."

  "Is there ambiguity?"

  "She signed both. She filed one. Does the existence of the draft prove she changed her mind before she even finished? Or does it prove she considered the soft path and rejected it?"

  I looked at the draft. *Allow her chaplain.* I touched the paper. It felt like skin.

  "If you use the draft," I said, "you break the law. The law says the registered one counts."

  "If I don't use the draft," Julian said, "I break her. The hard instrument was written out of fear. The draft was written out of hope. Which Elara do I serve? The one who was scared of dying, or the one who was planning how to live?"

  "The Statute says you serve the one who signed."

  "The Statute assumes the signer is one person. What if she was two people even then? What if Elara-54 morning wrote the draft, and Elara-54 afternoon wrote the Instrument?"

  "Then you pick the afternoon."

  "Why?"

  "Because the afternoon is what stayed."

  Julian stood up. He put the draft back in the box. "I have to make a ruling tomorrow. Aris wants me to confirm the denial. He says the draft is irrelevant. He says the Testimony Bar prevents me from considering your desire for the chaplain as a valid interest."

  "My desire doesn't matter."

  "Your desire is the evidence. The draft is the counter-evidence. The Instrument is the law."

  "If you choose the draft, you say the earlier self wasn't sure. If you choose the Instrument, you say the earlier self was sure."

  "Or," Julian said, "If I choose the draft, I say the earlier self's fear doesn't get to rule the later self's life. If I choose the Instrument, I say the earlier self's authority is absolute."

  He looked at me. "You know I can't let you revoke it. You can't pass the values test. You don't believe in the cold house anymore."

  "No."

  "So the only way you get the cottage is if I decide the Instrument doesn't apply."

  "Can you do that?"

  "I can say the Instrument was based on a factual error. She thought you would panic at photos. You don't. She thought you would hate the coast. You don't."

  "She thought you wouldn't know how to weigh it."

  "That's the point, isn't it?" Julian picked up the box. "She didn't trust you to weigh it. Do I trust you?"

  "Don't ask me."

  "I have to. Not for the decision. But for the record."

  "I weigh it wrong," I said. "I weigh now heavier than later. She weighed later heavier than now."

  "Who is right?"

  "I don't know. I just know I'm the one who has to sleep here tonight."

  **Entry 426**
  **October 28**

  Julian's ruling came an hour ago.

  He denied the transfer to the cottage. He denied the chaplain.

  But he ordered the photos.

  His reasoning was specific. He cited the Precedence Clause. He said the Author's intent was to protect the Later Self from harm. The medical evidence now shows no harm comes from the photos. Therefore, adhering to the ban on photos violates the Author's intent. The Instrument is a means to an end. The end is protection. The means are failing.

  He did not use the draft. He said the draft was inadmissible under the Statute. Only the registered Instrument counts.

  So he used the Instrument to override the Instrument.

  He left the music. He left the house. He left the ban on the sister.

  I asked Marcus why. Marcus said Julian told him: "I can't undo the binding. The Statute won't let me. If I accept the draft, I invalidate the whole system. If I invalidate the system, no one is safe. But I can interpret the safety clause."

  "So I get the photos."

  "You get the photos."

  "And the music?"

  "The music stays. The Author specified it as a structural element, not a safety element. Julian says he can't touch that. The Statute says the Author's aesthetic choices are binding if they don't cause harm. Sadness isn't harm."

  "Sadness isn't harm."

  I write this down. I write it so I don't forget.

  Elara-54 wins the house. Elara-54 wins the music. Elara-54 wins the isolation.
  Elara-58 gets the photos.

  It is a compromise that satisfies no one. It acknowledges that the Earlier Self was wrong about the photos, but right about the house. It acknowledges that the Later Self knows what hurts, but not what matters.

  Julian came in to hang the frame. He put it on the wall. My husband's face. He is smiling. I look at him. I feel a tightness in my chest. It is not panic. It is grief. It is heavy. It is real.

  "Does it hurt?" Julian asked.

  "Yes."

  "Is it good for you?"

  "I don't know."

  He nodded. He accepted that. The Statute allows me to say it hurts. It does not allow me to say if it's good.

  He left. The music started at six. Gould. The ice keys.

  I look at the photo. I look at the window. I am here. She is there. She is dead. I am alive.

  She wanted to govern a single life as one life. She wanted the book to have one voice. But a life is not a book. A book ends. A life stops.

  I pick up the pen. I write: *I want to go home.*

  I know Julian will not read this. I know Aris would strike it from the record. I know the Statute says I cannot define home.

  But I write it. Because if I don't write it, who will know that the person living the life is not the person who planned it?

  The music swells. Variation 25. The black key variations. Sad, she called them. She knew they were sad. She chose them anyway.

  I look at my husband's face. He looks back. He doesn't speak. He doesn't tell me to stay. He doesn't tell me to go.

  I am the one who has to decide what to do with the next hour. Even if I'm not allowed to decide where I sleep.

  I close the book. I put it in the drawer. I lock the drawer.

  The statute says this document is void. It says my voice is evidence of state, not interest. It says I am discontinuous.

  But when the music stops, I am the one who hears the silence.

  And I am the one who has to bear it.
