answer: |-
  ### The "Floor & Luck" Protocol
  **Version 1.0 for Volunteer Assessors**

  **Philosophical Grounding (For the Board):**
  This procedure blends **Luck Egalitarianism** (compensate for brute luck, not option luck) with **Capability Sufficientarianism** (ensure everyone reaches a floor of basic functioning, not equal happiness). It explicitly drops *Welfare Egalitarianism* (we do not measure happiness) and *Strict Resource Equality* (we do not equalize bank accounts).

  **Operational Constraints:**
  1.  **Time:** 15 minutes per file.
  2.  **Authority:** Volunteer assesses; Board signs off on all requests >$2k (which is almost all of them).
  3.  **Mission:** One-off grants only. We fix shocks, not states.

  ---

  ### The Assessment Procedure

  **Step 1: The Capability Floor (Pass/Fail)**
  *Question:* Does the lack of funds prevent the applicant from accessing a **basic capability** (Health, Shelter, Safety, or Access to Livelihood)?
  *   **Yes:** Move to Step 2.
  *   **No:** **STOP. Recommend Decline.**
      *   *Reasoning:* "Our mission is to restore basic functioning, not to fund enhancements or preferences."
      *   *Example:* A broken TV is not a capability block. A broken van used for dialysis is.

  **Step 2: The Luck Filter (Pass/Fail)**
  *Question:* Was the primary cause of this need **Brute Luck** (external, unforeseeable, unavoidable) or **Option Luck** (calculated risk, voluntary choice)?
  *   **Operational Test:** "Would a reasonable person with average resources have been able to avoid this risk?"
  *   **Mostly Brute Luck:** Move to Step 3.
  *   **Mostly Option Luck:** **STOP. Recommend Decline.** (Unless Step 3 overrides, see below).
      *   *Reasoning:* "We compensate for the hand you were dealt, not the bets you chose to take."
      *   *Note:* If the applicant is now below the *survival* floor (homeless/starving), override to **Pass** regardless of luck. (Humanitarian override).

  **Step 3: The Sustainability Check (Pass/Fail)**
  *Question:* Will this one-off grant resolve the blockage for at least **6 months**, or is it a drop in a bucket for a chronic condition?
  *   **Resolves for 6+ months:** Move to Step 4.
  *   **Temporary fix for chronic need:** **STOP. Recommend Decline.**
      *   *Reasoning:* "We are designed to fix sudden shocks. Ongoing needs require systemic support we cannot provide. Funding this creates false hope."
      *   *This is the 'Structural No'.*

  **Step 4: The Substitution Test (Pass/Fail)**
  *Question:* Is there a government agency or larger non-profit better suited to cover this?
  *   **No / Waitlist / Gap:** **Recommend Approve.**
  *   **Yes:** **Recommend Decline** (or refer).
      *   *Reasoning:* "We fill gaps, we do not replace public infrastructure."

  **Board Sign-Off Trigger:**
  *   Any recommendation >$2k goes to the Board with the Step 1-4 checklist completed.
  *   Board votes Up/Down. They do not relitigate the *facts* of the steps, only the *edge cases* where Step 2 (Luck) is ambiguous.

  ---

  ### Running the Files

  #### Case (a): The Flooded Basement
  *   **Step 1 (Capability):** **Pass.** Shelter/Sanitation is a basic capability.
  *   **Step 2 (Luck):** **Pass.** Weather is brute luck. Insurance gap is unfortunate but not a "calculated risk" in the moral sense for a low-savings household.
  *   **Step 3 (Sustainability):** **Pass.** A $6k repair fixes the basement for years. It is a shock, not a state.
  *   **Step 4 (Substitution):** **Pass.** FEMA/Insurance often has gaps/deductibles this size.
  *   **Decision:** **APPROVE ($6k).**
  *   **Reason to Applicant:** "We help neighbors recover from unforeseen disasters that threaten basic shelter."

  #### Case (b): The Musician
  *   **Step 1 (Capability):** **Pass.** Access to Livelihood is a basic capability.
  *   **Step 2 (Luck):** **FAIL.** Quitting a steady job to tour is Option Luck. It was a calculated risk.
      *   *Humanitarian Override?* Is he starving/homeless? Prompt implies he needs fees, not food. Override does not apply.
  *   **Decision:** **DECLINE ($3k).**
  *   **Reason to Applicant:** "Our guidelines prioritize unforeseen hardships over career investments or voluntary risks. We encourage you to seek workforce development grants specifically designed for retraining."
  *   **Note:** This satisfies the Director. It is a "Principled No."

  #### Case (c): The Disabled Kid
  *   **Step 1 (Capability):** **Pass.** Health/Functioning is a basic capability.
  *   **Step 2 (Luck):** **Pass.** Disability is brute luck. No choice involved.
  *   **Step 3 (Sustainability):** **FAIL.** The prompt specifies "ongoing equipment" with "diminishing returns." A one-off grant buys a temporary improvement, but the need recurs. This is a *State*, not a *Shock*.
  *   **Decision:** **DECLINE (Amount TBD).**
  *   **Reason to Applicant:** "While your need is clear and urgent, our foundation is structured to resolve one-time emergencies. We cannot sustain ongoing medical equipment needs without creating a dependency we cannot fulfill. We recommend connecting you with [State Agency X] for long-term support."
  *   **Note:** **This is the Unhappy No.** It is procedurally necessary but morally painful.

  ---

  ### Why Case (c) Forces the "No" You Won't Like

  Case (b) is an easy philosophical reject based on your Director's "choices" mandate. You might feel bad for the musician, but you can sleep at night knowing you stuck to the rules.

  Case (c) is the killer. The family is innocent (Brute Luck). The need is real (Capability). But the **Sustainability Check (Step 3)** forces a No.

  **Why?** Because of the **Diminishing Returns** constraint you mentioned. If every dollar buys less improvement, you are entering a "bottomless pit" scenario. For a small foundation with a fixed pot, funding a chronic, high-cost medical state means denying ten flooded basements.
  *   **The Philosophical Trade:** You are choosing **Sufficientarianism** (getting the 10 flooded people back to the floor) over **Prioritarianism** (giving the most to the worst off, the disabled kid).
  *   **The Operational Truth:** A one-off grant for an ongoing need is often charity porn—it makes the donor feel good but leaves the recipient in the same structural hole next year. Rejecting (c) admits that *your foundation is not the right tool for this job.* That is a hard conversation, but it protects the foundation's solvency and integrity.

  ### Limitations & Confidence

  **Where This Will Misfire:**
  1.  **The "Mixed Cause" File:** Real life is rarely 100% luck or 100% choice. (e.g., The man who skipped insurance *because* he was poor, then got hit by a truck). Step 2 will cause fights. Volunteers will struggle to distinguish "irresponsibility" from "survival strategy."
  2.  **The "Almost Sustainable" File:** What if the equipment lasts 5 months instead of 6? The hard cutoff invites gaming.
  3.  **The "Dignity" Cost:** Telling a disabled family "You are too chronic for us" feels like punishing them for being too sick. It risks reputational damage in a small county.

  **Confidence Level:**
  **75%.** The procedure solves the Board's gridlock by moving the debate from "Who is more worthy?" to "Does this fit the criteria?" It aligns with the Director's luck intuition while protecting the foundation from insolvency via the Sustainability Check.

  **The Weakest Step:**
  **Step 2 (The Luck Filter).**
  This is the least sure component. Distinguishing "Brute Luck" from "Option Luck" is the hardest problem in political philosophy (Dworkin vs. Anderson). Volunteers are not philosophers. A volunteer might judge a single mother's "choice" to live in a flood zone differently than a banker's.
  *   *Mitigation:* Add a "Reasonable Person" standard to the volunteer script: *"Would a person with average means and information have made this same choice?"* If yes, it's not negligence.

  ### Final Recommendation to the Board
  Adopt this protocol to stop relitigating philosophy every meeting. Accept that **Case (c)** will be a "No" not because the family isn't deserving, but because the *instrument* (one-off grant) does not match the *problem* (chronic care). Use that "No" to pivot toward advocacy or referrals, which may actually help them more than a $6k drop in the bucket.
