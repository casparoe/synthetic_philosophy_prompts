      *   **The Task:** Act as an expert on interpretation/authorial intention.
          1.  Brainstorm the live philosophical questions relevant to this specific case.
          2.  Rank them by importance/tractability/upstream dependency.
          3.  Defend the ranking (why X before Y?).
          4.  Address the two specific constraints: Executable Text (Code/Tests) and Unit of Meaning (Diff vs. Repo).
          5.  Identify what would change the ranking.
