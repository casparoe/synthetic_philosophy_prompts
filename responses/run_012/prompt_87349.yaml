answer: |-
  This is a classic hermeneutic problem wrapped in a distributed systems ticket. You are building an engine to resolve conflicts between *norms* (what the code/tests say should happen) and *narratives* (what the humans say happened).

  Here is the map of the philosophical terrain, ranked by what actually impacts your design doc, followed by the defense of that order and the specific constraints you raised.

  ### Part 1: The Map (Live Questions)

  Here are the four interpretive tensions active in your system. I've stripped the academic jargon and translated them into engineering constraints.

  1.  **The Truth Condition (Behavior vs. Rationale):**
      *   *The Question:* When the bot answers "Why," is it explaining *mechanism* (how the code executes) or *justification* (why the human made that choice)?
      *   *The Conflict:* Code explains mechanism. PR comments explain justification. When they diverge (e.g., the code was hacked to fix a bug but the comment wasn't updated), which "Why" is the user asking for?

  2.  **The Boundary of the Text (The Hermeneutic Circle):**
      *   *The Question:* What is the atomic unit of meaning? Is it the specific commit diff, the current state of the file, the whole repository, or the organization's unwritten engineering standards?
      *   *The Conflict:* A commit message might say "Optimize for latency," but if the rest of the repo prioritizes "Consistency," the commit's meaning might be overridden by the system's context. Where does the bot stop reading?

  3.  **The Authority Hierarchy (Intentionalism vs. Formalism):**
      *   *The Question:* When sources contradict, who holds the veto? The original author (Intentionalism), the current code state (Formalism/New Criticism), or the test suite (The "Shadow Author")?
      *   *The Conflict:* Author says "300ms," Code says "500ms," Test says "Must be <400ms." Who wins?

  4.  **Temporal Decay (The Death of the Author):**
      *   *The Question:* Does the "truth" of a design decision expire when the author leaves or when the system evolves?
      *   *The Conflict:* A comment from 2019 explains a constraint that no longer exists technically, but might still exist culturally (e.g., "Don't touch this, legacy billing"). Is that context still valid?

  ---

  ### Part 2: The Ranking

  Here is the order in which you must settle these to build a conflict policy in six weeks.

  **1. The Truth Condition (Behavior vs. Rationale)**
  **2. The Authority Hierarchy (The "Shadow Author" Protocol)**
  **3. The Boundary of the Text (Scope)**
  **4. Temporal Decay (Expiration)**

  ---

  ### Part 3: The Defense

  **1. Why "Truth Condition" is Upstream of Everything**
  This is the only question that is not philosophical but *product-defined*. It is upstream because it dictates which data sources matter at all.
  *   **Reasoning:** If your bot is for *debugging*, the Code/Tests are the only truth. Intent is irrelevant noise. If your bot is for *onboarding/architecture*, Intent is the primary signal, and Code is just evidence.
  *   **Tractability:** This is the easiest to solve. You ask your stakeholders: "If the code says X but the PR says Y, do you want the bot to tell you the code is wrong, or that the PR is outdated?"
  *   **Impact:** If you choose "Rationale," you prioritize PR descriptions and comments. If you choose "Behavior," you prioritize Code and Tests. You cannot rank authorities (Question #2) until you know which game you are playing.

  **2. Why "Authority Hierarchy" is Second**
  Once you know *what* kind of truth you want, you need to know *where* it lives when sources fight.
  *   **Reasoning:** This is where your "Shadow Author" (Tests) insight is critical. In philosophy, texts are passive. In engineering, tests are *active constraints*. They are speech acts; they enforce reality.
  *   **Tractability:** Highly tractable. You can hardcode a hierarchy.
      *   *Recommendation:* **Tests > Running Code > Recent Comments > Old Comments > PR Description.**
      *   *Why:* Tests define the contract. Code defines the implementation. Comments define the hope.
  *   **Impact:** This resolves 80% of your conflicts. If the test asserts `timeout < 400ms` and the PR says `500ms`, the test wins. The bot should report: "PR intended 500ms, but tests enforce <400ms."

  **3. Why "Boundary of the Text" is Third**
  You need to know how far to search before you time out or hallucinate connections.
  *   **Reasoning:** This is the Hermeneutic Circle. You can't understand a line of code without the file, but you can't read the whole repo for every query.
  *   **Tractability:** Medium. You need heuristics.
      *   *Recommendation:* Anchor meaning to the **File + Immediate Imports**. Do not scan the whole org's conventions unless explicitly tagged (e.g., an ADR link).
  *   **Impact:** Prevents the bot from making spurious connections ("This retry logic matches the billing service style from 2018") that confuse the user.

  **4. Why "Temporal Decay" is Last**
  *   **Reasoning:** This is a subset of Authority. If you decide "Tests > Old Comments," you have implicitly solved the decay problem. Old comments lose to current tests.
  *   **Tractability:** Low. "When does intent rot?" is unsolvable philosophically.
  *   **Impact:** Low. As long as your Hierarchy (#2) prioritizes *current* state (Tests/Code) over *historical* state (Comments/PRs), the decay handles itself.

  ---

  ### Part 4: Addressing Your Constraints

  **1. The "Executable Text" (Shadow Author)**
  You are not being cute; you have identified the fundamental difference between literary and code interpretation.
  *   **Philosophical Shift:** In literature, the "Death of the Author" argues the author's intent doesn't matter because the text stands alone. In code, the **"Life of the Compiler"** argues the author's intent *definitely* matters, but only if it matches the execution.
  *   **Impact on Ranking:** This solidifies **Authority Hierarchy (#2)** as the most critical *philosophical* decision. You must treat the Test Suite not as documentation, but as **Law**.
      *   *Why:* A comment is a claim. A test is a proof. If the PR description claims "This handles concurrency" but there are no concurrency tests, the claim is unproven. Your bot should flag this gap.
      *   *Adjustment:* If your tests are flaky or sparse, this hierarchy collapses. If you have high test coverage, the "Shadow Author" is your strongest signal.

  **2. The "Unit of Meaning" (Diff vs. Repo)**
  This is the biggest risk to your timeline.
  *   **Philosophical Shift:** This is the **Hermeneutic Circle**. You cannot interpret the part (the retry logic) without the whole (the system architecture). But the "whole" is undefined.
  *   **Impact on Ranking:** This makes **Boundary (#3)** more dangerous than it looks.
      *   *Risk:* If you define the unit as the **Diff**, you miss systemic constraints (e.g., "All services must retry this way per Org Standard"). If you define it as the **Repo**, you drown in noise.
      *   *Recommendation:* Define the unit as the **Service Boundary**. The "Text" is the current state of the service repository, not the individual commit. This captures org conventions (if they are in the repo) without scanning the entire company.

  ---

  ### Part 5: Dynamics & Deprioritization

  **What Would Change My Ranking?**
  1.  **If the bot moves from "Read" to "Write":** If the bot starts suggesting code changes, **Temporal Decay (#4)** jumps to #1. Relying on 2019 intent to suggest 2024 refactors is dangerous (Sunk Cost Fallacy). You would need to heavily discount old authorial intent.
  2.  **If the bot is used for Compliance/Audit:** If the goal is "Prove we followed security protocol," **Authority Hierarchy (#2)** flips. The PR Description/Sign-off becomes Law, even if the code drifts. The bot's job becomes highlighting the *deviation*, not resolving it.

  **The One Thing to Deprioritize**
  **"Community/Reader Interpretation."**
  *   *What everyone else will say:* "We should weigh Slack discussions and team consensus heavily because code is a social artifact."
  *   *Why you should ignore it:* In engineering, "community understanding" is often just accumulated technical debt or shared misconceptions. Unless that understanding is codified (in an ADR, a comment, or a test), it is ephemeral.
  *   *Reasoning:* Your bot needs deterministic outputs. "The team feels like this is a legacy service" is not a deterministic fact. "The last commit was 3 years ago" is. Prioritize **artifacts** over **folklore**.

  **Where I Am Unsure**
  I am assuming your test suite is a reliable proxy for "intent." If your tests are brittle, autogenerated, or purely happy-path, the "Shadow Author" is a liar. If your test coverage is <50%, you must downgrade **Authority Hierarchy** and rely more on **PR Descriptions**, because the code's "truth" is incomplete. You need to audit your test quality before finalizing the conflict policy.

  ### Summary for the Design Doc
  1.  **Define the Goal:** Are we explaining *how it runs* (Code/Tests win) or *why we chose this* (PR/Comments win)? (My bet: You need both, distinguished by label).
  2.  **Hardcode the Hierarchy:** Tests > Code > Recent Comments > Old Comments > PR Description.
  3.  **Scope:** Limit context to the Service Repo, not the Org.
  4.  **Ignore:** Unwritten team consensus/Slack lore.

  Settle #1 in week 1. Implement #2 in weeks 2-4. Tune #3 in weeks 5-6. Ignore #4 unless you have time left.
