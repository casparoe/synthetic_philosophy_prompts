answer: |-
  ### Revision Session Package: Decision Theory Midterm Prep

  **Course:** Upper-Level Decision Theory
  **Topic:** Expected Utility, Pascal's Mugging, and Boundedness
  **Time Allowed:** 90 Minutes

  ---

  #### Essay Question

  **Prompt:**
  Consider the standard Pascal's Mugging scenario: a stranger threatens you with astronomical disutility unless you hand over your wallet, claiming they have the power to enact this threat with a non-zero but infinitesimal probability.

  Now, consider a variant: **The Finite Hyper-Mugger.** The stranger offers no *infinite* utility, but rather a finite payoff (or threat) of $10^{100}$ utils at a probability of $1/10^{100}$. The expected value remains massive, but no mathematical singularities are involved.

  Write an essay addressing the following:
  1.  Distinguish between two primary strategies for resisting the mugger: (i) the **Epistemic Objection** (the gamble is not well-defined/credible) and (ii) the **Normative Objection** (expected utility maximization must be capped or discounted).
  2.  Evaluate whether shifting from an *infinite* payoff to a *finite but astronomical* payoff strengthens or weakens the Epistemic Objection.
  3.  Conclude by analyzing the "Ratcheting Problem." If you adopt a Normative Objection (e.g., a utility cap), can the mugger simply ratchet the stakes higher to defeat your cap? Does the Finite Hyper-Mugger variant force us to abandon Expected Utility (EU) theory entirely, or is there a remaining defense?

  ---

  #### Model Answer 
  Pascal's Mugging exposes a tension between the axioms of Expected Utility (EU) theory and robust intuitive judgment. When faced with a low-probability, high-stakes demand, EU maximization dictates compliance if the expected value exceeds the cost of resistance. Resisting this conclusion generally requires choosing between an Epistemic Objection or a Normative Objection.

  The **Epistemic Objection** argues that the proposed gamble is not a valid input for decision theory. Under a Savagean framework, acts must map states to consequences. However, when a claim involves powers vastly exceeding common experience, the probability assignment is not merely low; it is epistemically unstable. We cannot meaningfully distinguish a probability of $10^{-100}$ from zero given our cognitive limitations and the possibility of deception. Thus, the gamble is ill-defined. Conversely, the **Normative Objection** grants the probabilities are well-defined but rejects the linearity of EU. This approach suggests bounded utility functions or probability discounting, where probabilities below a certain threshold are treated as zero, or utility values are capped to prevent tail-events from dominating decision-making.

  The shift to the **Finite Hyper-Mugger** variant critically weakens the Epistemic Objection. In the infinite case, one can argue that infinite utility is metaphysically incoherent or undefined within standard real-valued utility functions. However, $10^{100}$ is finite. It is a coherent number, and standard arithmetic applies. If we accept that utility is unbounded and probabilities are non-zero, there is no mathematical "singularity" to hide behind. The finite case strips away the excuse that infinity is "weird." If one accepts the premises of unbounded utility and strict Bayesianism, the finite mugger is actually *more* dangerous than the infinite one, because the calculation is formally valid within standard real analysis. The intuition that one should not pay cannot rely on the incoherence of infinity; it must rely on a rejection of the decision rule itself.

  This leads to the **Ratcheting Problem**. If one adopts a Normative Objection, such as a utility cap at $10^{50}$, the mugger can simply ratchet the threat to $10^{51}$. If the defense relies on a probability threshold (e.g., ignoring anything below $10^{-10}$), the mugger can offer a probability of $10^{-9}$. As long as the agent's utility function is unbounded and they treat non-zero probabilities strictly, there is no stable equilibrium. The mugger can always name a number large enough to swamp any fixed cost.

  Consequently, the Finite Hyper-Mugger suggests that moderate Normative Objections are insufficient. A hard cap violates the continuity axioms required for standard EU representation. To consistently resist the mugger without relying on epistemic skepticism (which fails against coherent finite numbers), one must fundamentally alter the decision architecture. This implies either accepting that rational agents must sometimes act against EV maximization (biting the bullet that EU is incomplete) or adopting a non-linear weighting of probabilities as found in Rank-Dependent Utility. Ultimately, the finite variant demonstrates that the problem is not infinity; it is the linearity of expectation itself. To save our intuitions, we must sacrifice the unboundedness of utility or the strict linearity of probability, acknowledging that EU theory, as derived from Savage's axioms, cannot handle tail-risk dominance without modification.

  ---

  #### Marking Scheme (Total: 20 Marks)

  **1. Distinction Between Objections (6 Marks)**
  *   **A-Grade (5-6):** Clearly defines Epistemic (input invalid/probability unknowable) vs. Normative (rule invalid/EU structure flawed). Notes that Normative grants the probabilities for the sake of argument.
      *   *How people blow it:* Conflating the two, e.g., saying "the probability is too low" without specifying if that means it's *actually* zero (epistemic) or should be *treated* as zero (normative).
  *   **B-Grade (3-4):** Identifies both strategies but treats them as variations of "it's unlikely." Misses the structural implication of the Normative view.
      *   *How people blow it:* Describes the mugger scenario rather than the *response* strategies.
  *   **C-Grade (0-2):** Vague reference to "not believing the mugger."

  **2. Analysis of the Finite Twist (6 Marks)**
  *   **A-Grade (5-6):** Explicitly argues that the finite case *weakens* the Epistemic defense because finite numbers are mathematically coherent. Recognizes this makes the normative tension *worse*, not better.
      *   *How people blow it:* Assuming the finite case is "easier" to solve because infinity is removed.
  *   **B-Grade (3-4):** Notes the difference between finite and infinite but fails to explain why the finite case is philosophically more uncomfortable for the resister.
      *   *How people blow it:* Focuses on the magnitude of the number rather than the coherence of the utility function.
  *   **C-Grade (0-2):** Merely restates the prompt's definition of the Finite Hyper-Mugger.

  **3. The Ratcheting Problem & Conclusion (6 Marks)**
  *   **A-Grade (5-6):** Explains why fixed caps fail (mugger exceeds cap). Concludes that resisting requires abandoning strict EU linearity or unbounded utility (Savage axioms conflict).
      *   *How people blow it:* Proposes a cap without addressing how the mugger defeats it.
  *   **B-Grade (3-4):** Identifies the ratcheting problem but offers a weak conclusion (e.g., "just say no") without linking it back to decision theory axioms.
      *   *How people blow it:* Ignores the ratcheting dynamic entirely.
  *   **C-Grade (0-2):** No clear conclusion on whether EU must be abandoned.

  **4. Structure & Clarity (2 Marks)**
  *   **A-Grade (2):** Logical flow, precise terminology (Savage, linearity, boundedness).
  *   **B-Grade (1):** Readable but imprecise.
  *   **C-Grade (0):** Disorganized or difficult to follow.

  ---
