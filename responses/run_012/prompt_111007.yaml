          *   *Rule:* Religious reasons are legitimate grounds for *self-regulation* or *seeking exemption* (negative liberty), provided they do not impose significant material harm or deny essential access to others. Religious reasons are illegitimate grounds for *imposing obligations* on others (positive law/coercion), unless they can be translated into public goods accessible to non-believers.
