answer: |-
  At the village fête, the Chief Adjudicator stares at the marrow display.

  "Right," he says. "Partially ordered set. Every chain has an upper bound."

  "So," asks the Vicar, "you can award the prize?"

  "By Zorn's Lemma, a maximal element *must* exist."

  "Splendid. Which one?"

  "No idea. It's non-constructive. I know there's a marrow nothing beats, but I can't find it."

  "Surely you can weigh them?"

  "Not necessarily. Multiple maximal elements might be incomparable. It's not a maximum, just maximal."

  "So the winner?"

  "Exists. Just undefined."

  The Vicar sighs. "And the upper bound?"

  "Guaranteed, but doesn't have to be in the chain."

  "So it might not be in this row?"

  "Precisely."

  "Bugger," says the Vicar. "I'll put the kettle on."
