answer: |-
  # Invertebrate Grant Evaluation Protocol (IGEP)

  **Version:** 1.0
  **Operator:** Program Officer
  **Cycle:** Quarterly
  **Time Budget:** 10 staff hours per proposal max

  ## Purpose
  To standardize decisions on invertebrate welfare proposals, balance expected-value (EV) maximization against fiduciary risk, and provide a defensible logic trail for a split board. This procedure does not resolve the metaphysical question of sentience; it manages the financial risk of acting under that uncertainty.

  ## The Logic
  We are not buying "goodness." We are buying *expected welfare units per dollar*, discounted for uncertainty. The "Scale Argument" (Numbers × Sentience Probability) is valid, but it must be penalized for *verification risk*. If we cannot measure whether we helped, we cannot learn, and we cannot justify the risk to skeptical donors.

  ---

  ## Phase 1: The Sentience Floor (Pass/Fail)
  *Goal: Address the "Tiny Robot" objection immediately. If the animal is likely a robot, the math doesn't matter.*

  **Question 1.1:** Does the target taxon have a centralized nervous system or functional analogues (e.g., ganglia, nociceptors) structurally capable of integrating pain signals?
  *   **Yes:** Proceed.
  *   **No:** **DECLINE.** (e.g., Sponges, likely nematodes).

  **Question 1.2:** Is there peer-reviewed behavioral evidence of trade-offs suggesting pain experience (e.g., protecting injured limbs, analgesic preference)?
  *   **Strong Evidence (Multiple studies, cross-lab):** Assign **Sentience Confidence Score (SCS) = 0.8**. (e.g., Decapod crustaceans).
  *   **Plausible Evidence (Some studies, debated interpretation):** Assign **SCS = 0.3**. (e.g., Insects, larvae).
  *   **No Evidence/Theoretical Only:** Assign **SCS = 0.05**.
  *   **Threshold:** Any proposal with **SCS < 0.1** auto-**DECLINE**.
      *   *Note:* This is the "Robot Filter." It acknowledges uncertainty without requiring certainty. It allows insect funding but heavily discounts it compared to vertebrates/crustaceans.

  ---

  ## Phase 2: Intervention Specificity & Measurement (Pass/Fail)
  *Goal: Address the "Crowding Out" and "Money on Fire" objection. If we can't verify impact, we can't justify displacing high-confidence vertebrate work.*

  **Question 2.1:** Can the welfare impact be isolated from background noise?
  *   **High:** Controlled environment (farm, lab), clear intervention point (stunning, feed).
  *   **Medium:** Semi-controlled (supply chain contract), proxy metrics available.
  *   **Low:** Open environment (wild), diffuse intervention (policy, broad reduction).
  *   **Threshold:** **Low** specificity requires **SCS ≥ 0.8**. If SCS is lower (e.g., insects), Specificity must be **High** or **Medium**.
      *   *Logic:* If we are unsure if they feel pain (Low SCS), we must be extremely sure we changed their lives (High Specificity). We cannot fund Low SCS + Low Specificity.

  **Question 2.2:** Is there a defined metric for success that can be reviewed in <18 months?
  *   **Yes:** Proceed.
  *   **No:** **DECLINE.** (We cannot learn from this grant).

  ---

  ## Phase 3: Risk-Adjusted Scale Calculation (Scoring)
  *Goal: Run the "Shut Up and Multiply" math, but apply the discount.*

  **Formula:** `Raw Impact Score = (Affected Individuals × Duration in Years) × SCS`
  **Discounted Impact Score = Raw Impact Score × Verification Factor (VF)`**

  *   **Verification Factor (VF):**
      *   High Measurability: 1.0
      *   Medium Measurability: 0.5
      *   Low Measurability: 0.1

  **Question 3.1:** Does the `Discounted Impact Score` exceed the threshold of a comparable vertebrate project?
  *   *Benchmark:* A standard layer hen welfare project affecting 1M birds for 1 year (SCS 0.9, VF 1.0) = `900,000 Units`.
  *   **Pass:** Score > 900,000.
  *   **Fail:** Score < 900,000. (Unless strategic/learning value is high).

  ---

  ## Phase 4: Portfolio & Opportunity Cost (Board Trigger)
  *Goal: Manage internal politics and risk concentration.*

  **Question 4.1:** Does funding this require cutting an existing, high-confidence vertebrate program?
  *   **Yes:** **FLAG FOR BOARD.** (This is a values decision, not a facts decision).
  *   **No:** Proceed.

  **Question 4.2:** Is the grant amount >$250k?
  *   **Yes:** **FLAG FOR BOARD.**
  *   **No:** Program Officer discretion (if previous steps passed).

  **Question 4.3:** Does this proposal concentrate >50% of the invertebrate budget in a single taxon?
  *   **Yes:** **FLAG FOR BOARD.** (Diversification requirement to hedge against sentience error).

  ---

  ## Where This Procedure is a "Gut Call" in Disguise
  Be transparent with the board about these three points. The math above cannot resolve them:
  1.  **The SCS Numbers:** The difference between 0.3 (insect) and 0.8 (shrimp) is not derived from hard data. It is a consensus estimate to model our uncertainty. It is a policy number, not a biological constant.
  2.  **The Benchmark:** Comparing insect welfare units to hen welfare units assumes moral weight is additive and comparable. The skeptical board members may reject the conversion rate entirely.
  3.  **The Verification Factor:** This is a hedge against embarrassment. It prioritizes projects where we can prove we didn't fail, over projects where we might have succeeded wildly but can't prove it.

  ---

  # Application to Current Proposals

  ## Proposal 1: Electrical Stunning for Farmed Shrimp
  *   **Stats:** 5 Billion shrimp/year affected. 2 month lifespan. $300k ask.
  *   **Phase 1 (Sentience):** Crustaceans. Behavioral evidence exists (UK law recognition).
      *   **SCS:** 0.8 (High Confidence for invertebrate).
      *   **Result:** PASS.
  *   **Phase 2 (Specificity):** Farmed setting. Stunning is a binary event (worked/didn't work).
      *   **Specificity:** High.
      *   **Metric:** Mortality rates pre-slaughter, reflex tests.
      *   **Result:** PASS.
  *   **Phase 3 (Scale):**
      *   Raw: 5,000,000,000 × 0.16 years × 0.8 SCS = 640,000,000 Units.
      *   VF: 1.0 (High measurability).
      *   **Discounted Score:** 640,000,000. (Massively exceeds hen benchmark).
  *   **Phase 4 (Portfolio):**
      *   Ask is >$250k.
      *   **Decision:** **FUND (Recommend to Board).**
      *   **Rationale:** Passes the "Robot Filter" due to legal/scientific precedent. Scale is undeniable. Measurability is high. The only board friction is the dollar amount, not the logic.

  ## Proposal 2: Humane Slaughter for Black Soldier Fly Larvae (BSFL)
  *   **Stats:** 50 Billion larvae/year. 2 week lifespan. $150k ask.
  *   **Phase 1 (Sentience):** Insects/Larvae. Evidence is behavioral but contested. "Tiny robot" objection is strongest here.
      *   **SCS:** 0.3 (Plausible but thin).
      *   **Result:** PASS (Above 0.1 threshold).
  *   **Phase 2 (Specificity):** Farmed setting. Slaughter method can be controlled.
      *   **Specificity:** High.
      *   **Metric:** Time to immobility, physical damage.
      *   **Result:** PASS.
  *   **Phase 3 (Scale):**
      *   Raw: 50,000,000,000 × 0.04 years × 0.3 SCS = 60,000,000 Units.
      *   VF: 0.5 (Harder to verify welfare state in larvae than shrimp).
      *   **Discounted Score:** 30,000,000. (Still exceeds hen benchmark).
  *   **Phase 4 (Portfolio):**
      *   Ask is <$250k.
      *   Does not cut vertebrate programs.
      *   **Decision:** **FUND (Program Officer Discretion).**
      *   **Rationale:** The numbers are big enough to survive the "Robot Discount." It is a contained pilot. If it fails, we lose $150k, not the foundation's reputation.

  ## Proposal 3: Reducing Insecticide Use for Wild Insects
  *   **Stats:** Trillions of wild insects affected. Lifespan varies. $200k ask.
  *   **Phase 1 (Sentience):** Wild Insects. Same as BSFL.
      *   **SCS:** 0.3.
      *   **Result:** PASS.
  *   **Phase 2 (Specificity):** Agricultural landscape. Diffuse intervention.
      *   **Specificity:** **Low.** (Cannot isolate our funding's effect on insecticide use vs. market prices/weather).
      *   **Metric:** "Estimated reduction in chemical load" (Proxy, not welfare).
      *   **Rule Check:** Low Specificity requires SCS ≥ 0.8. Our SCS is 0.3.
      *   **Result:** **FAIL.**
  *   **Phase 3 (Scale):**
      *   Raw: Astronomical.
      *   VF: 0.1 (Low measurability).
      *   **Discounted Score:** Collapses due to Verification Factor.
  *   **Phase 4 (Portfolio):**
      *   **Decision:** **DECLINE.**
      *   **Rationale:** This is the hard call. The EV *might* be the highest of all three if the numbers hold, but the **Verification Factor** kills it. We cannot verify if the insects were helped, nor if our money caused the change. For a small foundation needing to learn and report to a skeptical board, this is "money on fire." We cannot distinguish success from luck.

  ---

  ## Board Memo Summary (For the Skeptics)
  When you present this, use this script for the declines and approvals:

  1.  **On the Shrimp (Approve):** "We are applying a heavy discount to invertebrate sentience. Even with that discount, the shrimp project passes the cost-effectiveness threshold of our chicken work because the sheer numbers are so high and the science is more settled."
  2.  **On the BSFL (Approve):** "This is a high-risk pilot. We are limiting exposure to $150k. We treat the sentience probability as low, but the potential upside justifies a small bet."
  3.  **On the Wild Insects (Decline):** "This is not a judgment on whether wild insects matter. It is a judgment on **attribution**. We cannot measure if this grant helped. If we can't measure it, we can't learn from it. If we can't learn, we are gambling, not grantmaking. We will revisit this when measurement technology improves."

  This procedure lets you fund the high-EV stuff (Shrimp/BSFL) while giving the skeptics a concrete reason to say no to the "woo-iest" stuff (Wild Insects) without denying the premise of invertebrate welfare entirely. It turns a philosophical fight into an operational risk assessment.
