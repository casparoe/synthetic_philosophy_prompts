  ok so in Switzerland every man has to do military service, but if you refuse you can do civilian service instead — only it lasts 50% longer, 365 days instead of 245. You don't even have to convince anyone you're a genuine conscientious objector any more, you just turn up to a one-day info session. And if you're not fit enough to serve at all you're not off the hook either, you pay a special tax, about 3% of your taxable income, until you turn 37. Women aren't conscripted at all. And the army basically only exists to defend the country, since Switzerland's neutral, so it's not as if you're being called up to go and fight in someone else's war.

  So what does a set-up like that actually presuppose about what you owe your country? It sort of says military service is a duty of citizenship — otherwise why punish you with a longer alternative — but the tax for the unfit makes it look more like a fee you pay in time or money, and if it's a real duty then why does it only fall on men? Can those three things hang together, or is it just bits of different theories bolted together? Which one does the system actually need, and which parts could be explained away by other views? Tell me how confident you are in what you say and flag the bit you're least sure about. British English please, and definately go easy on the jargon, I'm only in high school.
