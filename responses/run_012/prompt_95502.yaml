answer: |-
  You have identified a specific and paradoxical structure of authority that is well-recognized in political theory but rarely named as a singular, cross-disciplinary phenomenon. Your intuition that "reserve powers" and "conventions" are merely the furniture is correct: the former is the legal vessel, and the latter is the behavioral norm. Neither captures the *logic* of potency-through-abstinence.

  Here is the conceptual carving you requested, organized by the nearest established concepts, their fit, and the comparative analysis of your examples.

  ### 1. The Nearest Established Concepts

  **A. Benjamin Constant's *Pouvoir Modérateur* (Moderating Power)**
  *   **The Concept:** In his 1815 work *Principles of Politics*, Benjamin Constant argued that a constitutional monarchy requires a "neutral power" (the monarch) distinct from the executive, legislative, and judicial powers. This power exists solely to preserve the constitution by arbitrating when the active powers conflict.
  *   **The Fit:** This is the strongest historical match. Constant explicitly theorized that this power must be "neutral" (outside the contest) to be effective. Its authority derives from its distance from daily governance.
  *   **The Difference:** Constant envisioned this power as potentially *active* in a crisis (e.g., dismissing ministers to restore balance). Your observation is sharper: you note that in modern practice, the *act* of intervention is itself the failure. Constant thought the power could be used to save the system; you observe that using it reveals the system is already broken.
  *   **Confidence:** **High.** This is the direct intellectual ancestor of the structure you describe.

  **B. Symbolic Capital (specifically Non-Expendable Authority)**
  *   **The Concept:** Drawing from Pierre Bourdieu and sociological theories of ritual, authority can function as "symbolic capital" where value is maintained by *not* spending it. In anthropology, this touches on the concept of **Taboo**: certain objects or powers are so sacred that touching them destroys their sanctity (and often the toucher).
  *   **The Fit:** This explains the *mechanism* of the destruction you noted. When the monarch uses the power, they move from being a "symbol of the state" to a "participant in the dispute." They spend their symbolic capital to buy a political outcome, and since the currency is worth more than the outcome, it is a net loss for the institution.
  *   **The Difference:** Symbolic capital is a broad sociological term. It explains *why* the power devalues, but not the *constitutional function* of holding a legal power you cannot use.
  *   **Confidence:** **High.** This accurately describes the social dynamics of the "toxicity" you mentioned.

  **C. Precommitment Strategies (Elster/Schelling)**
  *   **The Concept:** In game theory and political economy, a precommitment strategy is a way of binding oneself to a future course of action to prevent weakness or temptation later (e.g., Ulysses tying himself to the mast).
  *   **The Fit:** The constitution is a precommitment device. By placing a "nuclear button" in the hands of someone who has no incentive to press it, the system precommits to stability. The power exists to deter others (politicians) from pushing the system to the brink, knowing that if they do, they might trigger the "neutral" power, which would be disastrous for everyone.
  *   **The Difference:** Precommitment usually implies binding oneself to *act* (or not act). Here, the power is held by a *third party* (the monarch), not the actors themselves. It is a "third-party enforcement precommitment."
  *   **Confidence:** **Medium.** It captures the strategic logic but feels slightly too mechanistic for the ritualistic aspect you described.

  ### 2. Comparative Analysis of Your Examples

  You asked whether specific powers share this structure. The distinction lies in whether the use of the power **validates** the authority or **depletes** it.

  *   **Presidential Veto:** **Different.**
      *   *Logic:* The veto is a bargaining chip. It is *meant* to be used as part of the legislative process. Its use does not degrade the President's legitimacy; it is an expected exercise of "effective" power.
      *   *Verdict:* This is **Active Authority**.

  *   **Judge's Contempt Power:** **Different.**
      *   *Logic:* While judges are neutral, the contempt power is an enforcement tool. Using it reinforces the court's authority. If a judge *never* used contempt power despite provocation, their authority might weaken.
      *   *Verdict:* This is **Enforcement Authority**.

  *   **Central Bank Emergency Lending (Lender of Last Resort):** **Very Similar, but distinct.**
      *   *Logic:* Like the monarch, the Central Bank's emergency facility is meant for rare crises. Its existence prevents runs (deterrence). However, unlike the monarch, the Central Bank *is* expected to use it when the crisis hits. If they don't, the system collapses. The monarch's system collapses *if they do*.
      *   *Verdict:* This is **Crisis Authority**. It is dormant, but its *use* is the success condition. For the monarch, *non-use* is the success condition.

  *   **Referee Abandoning a Match:** **Closest Match.**
      *   *Logic:* A referee can abandon a match for safety or integrity. But if they do, the "game" (the primary product) is destroyed. They hold the power to ensure the game is played, but using the power ends the game. Their authority relies on the expectation they will only use it if the game is already unplayable.
      *   *Verdict:* This is **Constitutive Abstinence**. It fits your pattern almost perfectly.

  ### 3. Is There a Name for the Structure?

  There is no single, canonical noun in political science that covers this exact logic across all institutions (monarchies, umpires, trustees). However, the structure is best described as:

  **"Constitutive Abstinence"** (Proposed)
  or
  **"Authority via Non-Exercise"**

  In legal theory, this touches on the **"Paradox of the Sovereign"**: the sovereign must be outside the law to guarantee the law, but if they act, they become subject to politics.

  There is a term in systems theory (Luhmann) that comes close: **"Latent Structure."** But this is too broad.
  There is a term in constitutional theory: **"The Efficient Secret"** (Bagehot), but that refers to the cabinet, not the monarch.

  The most precise existing phrase for the *logic* you described is **"The Logic of the Neutral Power"** (derived from Constant), but qualified by the sociological constraint of **"Ritual Taboo."**

  If you require a label for the general structure where authority is conferred by exclusion from the contest, the nearest established term is **"Disinterested Authority."** However, this describes the *holder*, not the *power*.

  **My Proposal:** The structure is a **"Dormant Sovereign Function."** It is a power that derives its potency from its dormancy.

  ### 4. Confidence and Uncertainty

  **Confidence Levels:**
  *   **High Confidence:** That Benjamin Constant's *Pouvoir Modérateur* is the historical/theoretical root of this specific constitutional arrangement.
  *   **High Confidence:** That the Presidential Veto and Contempt Power are fundamentally different categories (Active/Enforcement vs. Dormant/Symbolic).
  *   **Medium Confidence:** That the Central Bank analogy is distinct. (There is a debate among economists about whether LOLR usage stigmatizes the bank similarly to the monarch, but generally, usage is seen as "doing the job" rather than "breaking the system.")
  *   **High Confidence:** That there is no single, universally accepted noun in English political science that encapsulates this exact paradox across all fields (constitutional, sporting, financial).

  **Point of Least Certainty:**
  I am least certain about the existence of a specific **anthropological term** that might map perfectly onto this. There are concepts like **"Sacred Prohibition"** or **"Ritual Avoidance"** in anthropology that describe powers which destroy the user if exercised. It is possible there is a specific term in the anthropology of kingship (e.g., related to *mana* or *taboo*) that describes a "power that kills the holder if used." While I have referenced "Taboo," I cannot be certain there isn't a more precise term in the literature on sacred sovereignty (e.g., in the works of Agamben, Kantorowicz, or Graeber) that serves as the exact "name" you are looking for. My analysis leans heavily on political theory and sociology; a deep dive into comparative religion/anthropology might yield a more poetic, if less political, label.

  ### Summary
  You have identified a power that functions as a **systemic immune response** which is lethal to the host if activated. The nearest established concept is Constant's **Neutral Power**, constrained by the sociological logic of **Symbolic Capital**. The structure is one where legitimacy is inversely proportional to activity. While "Reserve Powers" names the legal tool, **"Constitutive Abstinence"** best names the logic: the authority exists to constitute the order by refusing to intervene in it.
