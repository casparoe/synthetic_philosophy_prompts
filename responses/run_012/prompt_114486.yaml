prompt: |-
  I'm in a social choice reading group and everyone keeps saying that Gibbard–Satterthwaite means every voting rule is manipulable, which I'm pretty sure is a cartoon of it. Can you lay out the actual conceptual issue for me: what the theorem really claims, and why strategy-proofness together with a rule that's able to land on any of three-or-more outcomes ends up forcing a dictator? I want the mechanism, not the statement — why does the pivotal-voter style argument go through, and why does the theorem need the rule to be onto? Two things I've never gotten a straight answer on: (1) if the rule is allowed to randomize over outcomes, does that get you out, or does it just relocate the dictatorship into the mixing weights? (2) the median of the peaks under single-peaked preferences is strategy-proof and not dictatorial, so there's clearly some escape hatches — whats the general list (restrict the preferences, restrict the range, weaken strategy-proofness to some equilibrium notion, allow money/transfers) and what does each one cost you? Also, is this basically Arrow's theorem with game theory bolted on, or is something genuinely different happening? Keep it intuitive where you can, but be precise about which condition is doing the work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
