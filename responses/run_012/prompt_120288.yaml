answer: |-
  The dust in Mr. Gantry's attic tasted of dried lavender and decay, a scent that seemed to cling to the back of the throat. I had been hired to catalogue the solicitor's estate, a task the town of Oakhaven considered a matter of mild civic pride. We are a town that loves its paperwork. We love the clarity of minutes, the permanence of bylaws, and the comforting architecture of a narrative we can control.

  For a century, Oakhaven has prided itself on the Midwinter Procession. Every year, on the solstice, we walk the perimeter of the old parish with lanterns and bags of rock salt. We cast the salt on the ice to break it, a symbolic gesture of warmth against the cold. The story, taught in our primary schools and printed on the tourist brochures, is that the Procession was invented in 1924 by Mayor Halloway. Halloway was a reformer, a man who wanted to knit together a fractured community of miners and merchants. He designed the rite from scratch, open to anyone who wished to walk.

  This manufactured origin was our chief virtue. We told ourselves that a ceremony one chooses is one to which strangers can be admitted, while a ceremony one inherits belongs only to the families who have always held it. Halloway's invention was a democratic act. It meant the Procession belonged to the living, not the dead. It meant I, a graduate student from three counties over, could walk in the front rank alongside the mayor, without asking permission of the Harrowes or the Vances, whose names were on the founding stones of the church.

  I found the ledger on a Tuesday, buried beneath a stack of tithe records from the 1800s. It was a small, leather-bound book, the spine cracked like a dry riverbed. I opened it to a random page and felt the air leave the room.

  *December 21st, 1642. The Salt Bearers walked the perimeter. The frost was deep. Young Thomas Harrowe stumbled on the ice. The priest blessed the brine.*

  I checked the date again. 1642. Oakhaven wasn't incorporated until 1750. The church that currently claims to baptize the Procession wasn't built until 1810. Mayor Halloway was a century away from being born. I turned the pages. There were entries for 1680, 1705, 1799. The details were specific, mundane, and undeniable. The route was identical. The salt was identical. The stumbling Harrowe was an ancestor of the current councilor who sat on the heritage committee.

  I sat on the floor of the attic for an hour, the ledger on my knees. I had come to catalogue a solicitor's papers; instead, I had excavated a ghost. The town's favorite story—that we had chosen our own identity—was a lie. We hadn't chosen anything. We were reenacting a compulsion.

  I took the ledger to Councilor Vance the next morning. She met me in her office, a room decorated with photographs of past Processions, all smiling, diverse, modern. She was a woman who believed in the utility of myth. When I placed the book on her desk and opened it to 1642, she didn't gasp. She didn't lean in to read the faded ink. She looked at the book as if it were a venomous snake.

  "Where did you get this?" she asked, her voice flat.

  "Gantry's attic. It's a solicitor's log. It predates the town."

  Vance closed the book. She didn't push it away, but she stopped touching it. "If this becomes public, Elias, the nature of the walk changes."

  "It changes the history," I said. "It makes it authentic."

  "It makes it inherited," she corrected. "Do you understand the difference? Halloway gave us a gift. He gave us a tradition that required no bloodline. If this ledger is real, then the Procession isn't a civic invitation. It's a family obligation. The Harrowes, the Vances, the Gants—they didn't join the tradition. The tradition survived them."

  She stood up and walked to the window. Outside, the town square was being decorated. Strings of lights were being draped over the statue of Mayor Halloway.

  "We have built a community on the idea that we are here by choice," Vance said. "Newcomers, students, transients. We walk because we want to. If it turns out we walk because we *must*, because this is an ancient rite of propitiation that predates our democracy, then the strangers are no longer guests. They are interlopers."

  "The Council wants me to suppress it," I said. It wasn't a question.

  "We ask you to consider the social cost of accuracy," she said, turning back to me. "History is heavy, Elias. It weighs down the feet. Halloway lightened the load. Let us keep it light."

  But the town is smaller than the secrets we try to keep in it. By Friday, the Old Families knew. I was having coffee near the market when Mrs. Harrowe approached my table. She was seventy, sharp-featured, wearing a coat that had been fashionable in the eighties but was kept immaculate. She didn't ask for permission to sit.

  "You found the book," she said.

  "I did."

  "My grandfather told me," she said, stirring her tea. "He said the Halloway story was a polite fiction. A way to let the miners walk alongside us without us having to acknowledge that they were walking in our shadow."

  "You want it published," I said.

  "We want the truth," she said, though her eyes suggested she wanted the ownership. "If it is old, it belongs to us. Not the Council. Not the students. If it is a survival, then we are the curators. You cannot curate a choice, Elias. You can only curate a legacy."

  She reached across the table and touched my sleeve. "Think of what it means to be part of something that outlasts you. Halloway's invention dies when we stop choosing it. This? This lives whether we want it or not. It gives you roots. Is that not better than being a leaf in the wind?"

  I walked home through the grey afternoon, the ledger's weight pressing against my ribs inside my bag. Two forces, pulling in opposite directions. The Council wanted to preserve the openness of the lie; the Families wanted to secure the exclusivity of the truth. Both claimed to protect the town. Both claimed to protect the Procession.

  But as I walked, I realized the dismay wasn't just political. It was existential. The town of Oakhaven had looked in the mirror for a hundred years and seen a face it had painted itself. It was a face of agency, of modern self-determination. To learn that the face was actually an ancestral mask was to realize that we had never been the painters. We were the canvas.

  The Council voted on Monday. They would not publish the findings. The ledger would be returned to the archives, misfiled under "Folklore – Fiction." They offered me a permanent position in the town archives, a generous salary, a quiet life. A retainer for my silence.

  Mrs. Harrowe's group threatened to go to the press in the city. They spoke of heritage rights and historical integrity. But they were few, and the Council was many. The threat faded, not because they were convinced, but because they realized that publishing the truth would not give them control. It would only make the town afraid. And a frightened town does not walk a procession; it bars its doors.

  The solstice arrived. The air was biting, the sky a bruised purple. I stood at the starting point, the ledger safe in my locked apartment. I had not told the Council yes, and I had not told the Families no. I had simply kept the secret, which made me complicit in both versions of the story.

  The crowd gathered. There were the usual faces: the students from the college, the shopkeepers, the young families with children in woolen hats. But as I looked at them, I saw the shadow of the ledger over them. I saw the Harrowes standing near the front, their posture rigid, proprietorial. They were not smiling at the neighbors. They were watching them, assessing their right to be there.

  And I saw the Councilors, Vance among them, forcing brightness into their voices, ushering the strangers forward, desperate to prove that the door was still open.

  "Ready?" the Mayor called out.

  "Ready," we chorused.

  We began to walk. The route wound through the narrow streets, down to the river, and back up the hill to the church. In previous years, I had felt a sense of lightness during this walk. A sense of community constructed by will. Tonight, the ground felt harder. The salt in my bag felt heavier, like stones.

  As we passed the old Harrowe estate, a gate creaked in the wind. An old instinct, one I had no business possessing, told me to step to the left, to avoid the shadow of the wall. I looked at the woman walking beside me, a nurse who had moved here two years ago. She was laughing, tossing salt on the ice. She believed she was participating in a civic celebration. She believed she was free.

  I did not tell her. I could not tell her.

  If I spoke, I would validate the Harrowes. I would turn her laughter into trespass. If I stayed silent, I validated the Council. I would let her believe in a freedom that was, geographically and historically, an illusion.

  We reached the churchyard. The bells tolled. We cast the last of the salt. The ritual was complete. The crowd dispersed, heading to the warm halls for cider and songs. The Harrowes lingered by the lychgate, speaking in low tones. The Councilors shook hands, their smiles tight.

  I stood alone for a moment in the cold. The evidence in the attic proved that the custom was older than the town. It proved that the land remembered us before we remembered ourselves. But standing there, watching the lanterns fade into the distance, I understood what the evidence did not change.

  The salt still melted the ice. The light still held back the dark. The walk still brought us together, however briefly, in the cold.

  The truth of the origin did not alter the warmth of the hand beside me. It did not change the fact that we had chosen to walk tonight, even if the path was old. The ledger proved we were heirs, but it could not prove we were prisoners. The Harrowes could claim the blood, and the Council could claim the choice, but the walking itself belonged to neither.

  I turned my collar up against the wind. I would keep the ledger in the dark. I would let the town keep its story. Not because the lie was better, but because the truth was too heavy to carry up the hill. We needed the lightness. We needed to believe that we were walking because we wanted to, even if the road was waiting for us long before we were born.

  I joined the crowd toward the lights. The salt was gone, but the taste of it remained on my tongue, ancient and sharp, a reminder that some things are inherited whether we sign for them or not. But I walked with my head up, choosing my steps, one after the other, into the winter night.
